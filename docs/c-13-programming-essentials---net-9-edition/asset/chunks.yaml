- fmt: "\nThe C# index from end (`^`) operator allows you to specify the end of a\
    \ range based on the number of positions from the end of the array.\n\nThe index\
    \ `^1`, for example, represents the last item in the array, `^2` the second from\
    \ last item in the array, and so on. Index `^0` is already set to the total number\
    \ of items in the array:\n\n```csharp\nstring[] myArray = {\n    \"item 1\", //\
    \ <-- ^7 - 7th from last\n    \"item 2\", // <-- ^6\n    \"item 3\", // <-- ^5\n\
    \    \"item 4\", // <-- ^4\n    \"item 5\", // <-- ^3\n    \"item 6\", // <--\
    \ ^2\n    \"item 7\" // <-- ^1 - Last item\n    // ^0 = array length\n};\n```\n\
    \nThe following code demonstrates the use of the index operator when working with\
    \ ranges and arrays:\n\n```csharp\nstring[] sentence = {\"The\", \"best\", \"\
    way\", \"to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"invent\", \"\
    it\"};\n\nstring[] subset1 = sentence[^7..^4];\nstring[] subset2 = sentence[..^2];\n\
    string[] subset3 = sentence[3..^3];\n\nforeach (string word in subset1)\n{\n \
    \   Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\\n\");\n\nforeach\
    \ (string word in subset2)\n{\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\
    \\n\");\n\nforeach (string word in subset3)\n{\n    Console.Write(\"{0} \", word);\n\
    }\n```\n\nOutput:\n```\npredict the future\nThe best way to predict the future\
    \ is to\nto predict the future is\n```\n\n## 26.7 Sorting C# arrays\n\nThe C#\
    \ array is part of the `Array` package, which also includes some useful methods\
    \ for sorting and re-ordering arrays.\n\nIf you need to sort an array, pass it\
    \ as an argument to the `Array.Sort()` method as follows:\n\n```csharp\nstring[]\
    \ myColors = [ \"red\", \"green\", \"yellow\", \"orange\", \"blue\" ];\nConsole.WriteLine(\"\
    Before Sort\");\nforeach (string color in myColors)\n{\n    Console.Write(\"{0}\
    \ \", color);\n}\nArray.Sort(myColors);\nConsole.WriteLine(\"\\n\\nAfter Sort\"\
    );\nforeach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n\
    }\n```\n\nOutput:\n```\nBefore Sort\nred green yellow orange blue\nAfter Sort\n\
    blue green orange red yellow\n```\n\nYou can also reverse the order of the elements\
    \ in an array using the `Array.Reverse()` method:\n\n```csharp\nstring[] myColors\
    \ = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nArray.Reverse(myColors);\n\
    foreach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n\
    ```\n\nOutput:\n```\nblue orange yellow green red\n```\n\n## 26.8 Clearing C#\
    \ arrays\n\nThe values in an array may be cleared using the `Array.Clear()` method.\
    \ This method clears each item in an array to the default value for the type (false\
    \ for `Boolean` values, 0 for numeric items, and `null` for strings). The syntax\
    \ for clearing array elements is as follows:\n\n`Array.Clear(<array>, <start index>,\
    \ <count>);`\n\nIn the above syntax, `<array>` is the array to be cleared, `<start\
    \ index>` is the position within the array at which clearing is to begin, and\
    \ `<count>` is the number of elements to be cleared.\n\nThe following example\
    \ clears three elements starting at item 1:\n\n```csharp\nstring[] myColors =\
    \ [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nArray.Clear(myColors,\
    \ 1, 3);\nforeach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n\
    }\n```\n\nWhen the above code runs, only the blue and red elements will remain\
    \ in the array.\n\n## 26.9 Take the knowledge test\n\nClick the link below or\
    \ scan the QR code to test your knowledge and understanding of C# array management:\n\
    \n[https://www.answertopia.com/ty5r](https://www.answertopia.com/ty5r)\n\n![img](image/c_-array-handling.png)\n\
    \n## 26.10 Summary\n\nThis chapter explored accessing, removing, and sorting elements\
    \ in C# arrays. It demonstrated how to use the `Rank` property to determine the\
    \ number of dimensions, the array accessor notation to access elements, and the\
    \ `foreach` loop to iterate through arrays. Additionally, it covers using ranges\
    \ and the index from end operator to extract subsets of elements, and the `Array.Sort()`,\
    \ `Array.Reverse()`, and `Array.Clear()` methods to sort, reverse, and clear arrays,\
    \ respectively.\n\n## 27. C# List Collections\n\nIn the previous chapters, we\
    \ looked at C# Arrays. While useful for many tasks, arrays are starting to show\
    \ their age in terms of functionality and flexibility. The C# Collection Classes\
    \ provide more advanced mechanisms for gathering groups of objects.\n\n### 27.1\
    \ Creating the CollectionDemo Project\n\nLaunch VS Code, open your “C# Essentials”\
    \ workspace folder and create a new .NET Console App project named `CollectionDemo`.\n\
    \nOnce you have created the project, open the `Program.cs` file and use it to\
    \ try out the examples in the rest of this chapter.\n\n## 27.2 Introducing the\
    \ C# Collection Classes\n\nThe C# Collection classes are designed specifically\
    \ for grouping objects and performing tasks on them. Several collection classes\
    \ are available with C#, and we will look at some key classes in the next few\
    \ chapters.\n\n### 27.3 Creating C# list collections with `List<T>`\n\nThe `List<T>`\
    \ class has properties very similar to C# arrays. One key advantage of this class\
    \ over arrays is that it can grow and shrink as the number of stored objects changes.\n\
    \nThe syntax for creating a `List<T>` is as follows:\n\n```csharp\nList<type>\
    \ name = new List<type>();\n```\n\nAlternatively, you may use a collection initializer:\n\
    \n```csharp\nList<type> name = [<item1>, <item2>, ...];\n```\n\n### 27.4 Adding\
    \ items to lists\n\nOnce you have created a List instance, there are several methods\
    \ you can call to perform tasks on it. One such method is the `Add()` method which,\
    \ as the name suggests, is used to add items to the list:\n\n```csharp\nList<string>\
    \ colorList = [];\ncolorList.Add(\"Red\");\ncolorList.Add(\"Green\");\ncolorList.Add(\"\
    Yellow\");\ncolorList.Add(\"Purple\");\ncolorList.Add(\"Orange\");\n```\n\nThe\
    \ `Add()` method appends the new item to the end of the list. To insert new items\
    \ at a specific index, you will need to use the `Insert()` method covered later.\n\
    \n### 27.5 Initializing a list with multiple values\n\nIn the above example, we\
    \ created an empty list and then added items by one using the `Add()` method.\
    \ However, if you need to initialize a list with a large number of values, you\
    \ may find it more efficient to use a collection initializer:\n\n```csharp\nList<string>\
    \ colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"];\n```\n\
    \n### 27.6 Accessing list items\n\nIndividual items in a list may be accessed\
    \ using the item’s index value (keeping in mind that the first item is 0, the\
    \ second 1, and so on). The index value is placed in square brackets after the\
    \ list name. For example, to access the second item in the `colorList` object:\n\
    \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Orange\"];\nConsole.WriteLine(colorList[1]);\n```\n\nOutput:\nGreen\n\nA list\
    \ item value can similarly be changed using the index combined with the assignment\
    \ (`=`) operator. For example, to change the Yellow color to Indigo, the code\
    \ would read as follows:\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\"\
    , \"Yellow\", \"Purple\", \"Orange\"];\nConsole.WriteLine($\"Color before = {colorList[2]}\"\
    );\ncolorList[2] = \"Indigo\";\nConsole.WriteLine($\"Color after = {colorList[2]}\"\
    );\n```\n\nOutput:\nColor before = Yellow\nColor after = Indigo\n\nAs with arrays,\
    \ you can also construct a `foreach` loop to list all of the the items in a list.\
    \ For example:\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"\
    Yellow\", \"Purple\", \"Orange\"];\nforeach (string color in colorList)\n{\n \
    \   Console.Write($\"{color} \");\n}\n```\n\nOutput:\nRed Green Yellow Purple\
    \ Orange\n\n## 27.7 Removing items from lists\n\nItems may be removed from a list\
    \ using the `Remove()` method. This method takes the value of the item to be removed\
    \ as an argument. For example, to remove the “Orange” string from the `colorList`\
    \ object, we could write the following code:\n\n```csharp\nList<string> colorList\
    \ = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"];\ncolorList.Remove(\"\
    Orange\");\n```\n"
