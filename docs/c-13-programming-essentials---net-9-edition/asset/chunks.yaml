    folder (B):


    ![img](image/vs_code_new_project_added.png)


    Figure 13-4


    13.4 Declaring a C# class


    Before an object can be instantiated, we first need to define the class blueprint
    for the object. In this chapter, we will create a Bank Account class to demonstrate
    the concepts of C# object-oriented programming. The first step is to use the Solution
    Explorer to add a new class file to our project. The Solution Explorer is located
    at the bottom of the Explorer panel as shown in [Figure 13-5](#Object_Orientated_Programming.xhtml__idTextAnchor166)
    :


    ![img](image/vs_code_solution_explorer.png)


    Figure 13-5


    Within the Solution Explorer, hover the mouse pointer over the ObjectDemo entry
    to display the new file and folder buttons:


    ![img](image/vs_code_solution_explorer_add_file.png)


    Figure 13-6


    Clicking the Add New File... button will display the Add New File palette as shown
    in [Figure 13-7](#Object_Orientated_Programming.xhtml__idTextAnchor168) . Within
    the palette, select the Class option:


    ![img](image/vs_code_solution_explorer_new_class.png)


    Figure 13-7


    When prompted, name the class BankAccount before pressing Enter to create the
    file. The new file will automatically load into the editor, where it will read
    as follows:


    using System;


    namespace ObjectDemo;


    public class BankAccount


    {


    }


    13.5 Access modifiers


    When VS Code generated our BankAccount class, it declared using the public access
    modifier. Access modifiers control whether the class can be accessed from code
    elsewhere in the project and can be applied to a variety of types in C#, including
    classes, methods, members, properties, and fields. C# supports the following access
    modifiers:


    • public - There are no restriction on access.


    • protected - Access is only available from within the containing class or derivatives
    of the class.


    • private - Access is only available from within the containing class.


    • file - Access is only available within the containing source file.


    • internal - Access is only available to code within the current assembly (typically
    the code that makes up the compiled executable or library) in which the class
    is declared.


    • protected internal - Access is only available to code within the current assembly
    or derivatives of the containing class.


    • private protected - Access is only available within the containing class or
    derivatives within the current assembly.


    13.6 Creating C# class members


    Class members, fields, or properties are essentially variables and methods embedded
    in the class (the concept of methods is covered later in the chapter). Members
    can be public , private , or protected .


    Public members can be accessed from outside the object and visible in classes
    derived from the current class. Private members can only be accessed by methods
    contained in the class and are not accessible to derived classes. Protected classes
    are only available to derived classes.


    This is the key to data encapsulation . Object-oriented programming convention
    dictates that data should be encapsulated in the class and accessed and set only
    through the class’s methods (typically called getters and setters ).


    When implementing data encapsulation, it is important to understand the difference
    between fields and properties within C# class declarations.


    13.7 Fields vs. properties


    A class member directly declared as a variable is called a field . In the following
    class, for example, the firstname variable is declared as a field:


    public class MyClass {


    public string firstname = ""; // This is a field


    }


    This is referred to as a public field . When declared this way, code outside the
    class can directly access and change this variable.


    Object-oriented programming guidelines, however, suggest that fields should generally
    be protected from direct access (known as private fields ). In C#, this is achieved
    by declaring a property , which, in turn, provides access to the underlying private
    field.


    A property is provided with a name and declares special get and set methods (referred
    to as accessor methods ), which are used to provide access to the underlying field
    using the following syntax:


    public string <property name> {


    get {


    return <field name>;


    }


    set {


    <field name> = value;


    }


    }


    The code of the get method returns the value assigned to the field. The set method,
    on the other hand, is passed a variable named value that can be assigned to the
    field.


    Using this approach, we can now implement a property to encapsulate our firstname
    field:


    public class MyClass


    {


    private string _firstname = "";


    public string FirstName {


    get {


    return _firstname;


    }


    set {


    _firstname = value;


    }


    }


    }


    When a field is associated with a property, the field should be declared as being
    private, and the name is generally prefixed with an underscore (_).


    A more concise approach to declaring accessors is to use the lambda operator (=>)
    to assign get and set expressions (the topic of Lambdas will be covered in the
    [“C# Anonymous Methods, Lambdas, and Local Functions”](#Lambdas.xhtml__idTextAnchor210)
    chapter):


    public string <property name> {


    get => <field name>;


    set => <field name> = value;


    }


    Using the above approach, we can simplify our MyClass example as follows:


    public class MyClass


    {


    private string _firstname = "";


    public string FirstName {


    get => _firstname;


    set => _firstname = value;


    }


    }


    Whether or not to encapsulate all fields within properties and have no public
    fields is a matter of personal preference in terms of how rigidly you want to
    adhere to object-oriented programming conventions. You will see examples of both
    approaches even in Microsoft’s C# reference documents. For the sake of brevity,
    we will use public fields in many examples in this book.


    13.8 Adding members to the BankAccount class


    We can now extend our BankAccount class to add fields to hold the account name
    and number. True to the concept of data encapsulation, we will be making these
    fields private and using properties to provide access:


    .


    .


    namespace ObjectDemo;


    public class BankAccount


    {


    private string _accountName = "";


    private int _accountNumber = 0;


    public string AccountName


    {


    get => _accountName;


    set => _accountName = value;


    }


    public int AccountNumber


    {


    get => _accountNumber;


    set => _accountNumber = value;


    }


    }


    With some fields and properties added to our class, we need to briefly examine
    a few additional data member types and learn how to create object instances from
    the class.


    13.9 Static, read-only, and const data members


    In addition to the data member types we have looked at so far, C# also supports
    several additional member types.'
