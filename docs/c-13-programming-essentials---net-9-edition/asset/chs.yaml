  );\n    Console.WriteLine(result);\n}\n```\n\n当执行代码时，我们将从控制台输出看到通过单次委托调用 `LowerCase()`\
  \ 和 `UpperCase()` 方法都已调用了：\n\nConverting to lowercase > Converting to uppercase\
  \ > THIS SOME TEXT\n\n可以使用 `-=` 运算符从多播委托中移除委托。以下更改调整了上述示例，在第一次调用后从 `multicast` 中移除\
  \ `converter2`：\n\n```csharp\nstatic void Main(string[] args)\n{\n    StringConverter\
  \ converter1 = new(LowerCase);\n    StringConverter converter2 = new(UpperCase);\n\
  \n    StringConverter multicast = converter1 + converter2;\n\n    var result = multicast(\"\
  This is some TEXT\");\n    Console.WriteLine(result);\n\n    multicast -= converter2;\n\
  \n    result = multicast(\"AfTeR reMovAL oF converter2\");\n    Console.WriteLine(result);\n\
  }\n```\n[/content] (注：由于原文 15.5 和 15.6 节的代码块在输入时严重错乱，译文已根据代码逻辑进行了重组以确保可读性) \n\n\
