  \ C# 代码之前，探索了构成典型项目的文件。本章还引入了命名空间的概念，并解释了 VS Code 如何自动生成顶层语句和 `Main()` 方法。\n\n#\
  \ 7. C# 变量与常量\n\n要精通任何编程语言，你都需要学习基础知识。编程最基本的方面之一就是使用变量和常量。即使是像高端视频游戏和企业级商业应用这样的高级程序，也会以某种形式使用变量。\n\
  本章将涵盖 C# 程序员关于变量和常量需要的所有知识。\n\n### 7.1 什么是 C# 变量？\n\n变量是计算机内存中预留用于存储应用程序使用的数据的位置。每个变量都由程序员赋予一个名称并分配一个值。分配给变量的名称可以在\
  \ C# 代码中使用以访问分配给该变量的值。这种访问涉及读取变量的值或更改该值。当然，正是这种改变变量值的能力让它们被称为“变量”。\n### 7.2 类型注解与隐式类型\n\
  \nC# 被归类为类型安全的编程语言。这本质上意味着一旦确定了变量的数据类型，该变量就无法后续存储任何其他类型的数据，否则会引发编译错误。这与松类型编程语言形成对比，在松类型语言中，变量一旦声明，随后可以用于存储其他数据类型。\n\
  \n识别变量类型有两种方法。一种方法是在代码中声明变量或常量时使用类型注解。这通过在变量名之前加上类型声明来实现。例如，下行代码声明了一个名为 `userCount`\
  \ 的类型为 `int`（整数）的变量：\n\n```cs\n```\n\n使用类型注解时，可以在声明后为变量分配一个值：\n\n```cs\nint userCount;\n\
  userCount = 10;\n\n作为声明中类型注解的替代方案，C# 编译器可以使用隐式类型来识别变量类型。当依赖隐式类型时，编译器会查看在初始化时分配给变量的是什么类型的值，并将其用作类型。要指示编译器使用隐式类型，你必须在变量名之前加上\
  \ `var` 关键字。\n\n考虑以下变量声明：\n\n```cs\nvar signalStrength = 22;\n```\n\n在编译上述代码行时，C#\
  \ 将推断出 `signalStrength` 变量的类型为 `int`，`companyName` 的类型为 `string`。\n\n当使用隐式类型声明变量时，必须在声明点赋值一个值。例如，以下内容不是有效的\
  \ C# 语法：\n\n```cs\nbookTitle = \"C# 13 Essentials - .NET 9 Edition\";\n```\n\n在变量声明后的任何点，都可以为其分配新值：\n\
  \n```cs\nint interestRate = 5; // 声明变量并初始化为 5\n```\n\n### 7.3 什么是 C# 常量？\n\n常量与变量类似，在内存中提供了一个命名的位置来存储数据值。常量有一个显著区别：一旦给常量分配了值，它就无法再更改。\n\
  如果一个值在应用程序代码中被反复使用，常量将特别有用。与其每次都使用该值，不如先将值分配给常量然后在代码中引用它，这样代码更易读。例如，对于阅读你 C# 代码的人来说，可能并不清楚你为什么在表达式中使用值\
  \ 5。相反，如果你使用一个名为 `interestRate` 的常量而不是值 5，那么该值的目的就会变得显而易见。常量的另一个优势是，如果程序员需要更改一个被广泛使用的值，只需要在常量声明处更改一次，而不需要在每次引用时都进行修改。\n\
  \n常量使用 `const` 关键字声明，并具有类型、名称和值：\n\n```cs\nconst int interestRate = 10;\n```\n注意，常量必须在声明时初始化。例如，以下代码将无法编译，因为它声明了常量但没有分配值：\n\
  \n```cs\nconst int interestRate; // 无效 - 常量必须在创建时初始化\n```\n\n现在我们已经描述了 C# 变量和常量，可以检查\
  \ C# 程序员可以使用的不同类型，从数值数据类型开始。\n### 7.4 整数类型\n\n一种广泛使用的数据类型是整数。C# 根据数字大小以及整数是带符号（正数或负数）还是无符号（仅正数）提供了几种整数类型。所有整数变量类型都有共同点：它们只能用于存储整数。\n\
  \n下表列出了各种 C# 整数类型、其占用的字节数以及取值范围。\n\n| 类型 | 占用字节数 | 取值范围 |\n| byte | 1 字节 | 0 到 255\
  \ |\n| sbyte | 1 字节 | -128 到 127 |\n| short | 2 字节 | -32768 到 32767 |\n| ushort\
  \ | 2 字节 | 0 到 65535 |\n| int | 4 字节 | -2147483648 到 2147483647 |\n| long | 8 字节\
  \ | -9223372036854775808 到 9223372036854775807 |\n| ulong | 8 字节 | 0 到 18446744073709551615\
  \ |\n\n以下代码演示了这些类型：\n\n```cs\nint myInt = 2012;\nsbyte mySbyte = 127;\n```\n\n所有\
  \ C# 数值数据类型都包含边界属性，可以通过它们识别特定类型的最小值和最大值。例如，以下代码向控制台输出某些整数类型的最小最大边界：\n\n```cs\nConsole.WriteLine(\"\
  byte Min Value = \" + byte.MinValue);\nConsole.WriteLine(\"short Min Value = \"\
  \ + short.MinValue);\nConsole.WriteLine(\"short Max Value = \" + short.MaxValue);\n\
  Console.WriteLine(\"int Min Value = \" + int.MinValue);\nConsole.WriteLine(\"int\
  \ Max Value = \" + int.MaxValue);\nConsole.WriteLine(\"uint Min Value = \" + uint.MinValue);\n\
  Console.WriteLine(\"uint Max Value = \" + uint.MaxValue);\nConsole.WriteLine(\"\
  long Min Value = \" + long.MinValue);\n```\n\n上述代码将生成以下输出：\n\nbyte Min Value = 0\n\
  byte Max Value = 255\nshort Min Value = -32768\nint Min Value = -2147483648\nint\
  \ Max Value = 2147483647\nuint Min Value = 0\nuint Max Value = 4294967295\nlong\
  \ Min Value = -9223372036854775808\nlong Max Value = 9223372036854775807\n\n\n整数对于处理整数数字很好，但在处理带有小数点后的的数字时用处不大。此类数字可以存储在\
  \ `float` 或 `double` 变量类型中。此类数字的默认类型是 `double`。下表显示了这两个类型，对比了它们支持的数字范围以及每种情况下的有效位数：\n\
  \n\n\n\n\n| double | 16 bytes | +/-5.0 * 10−324 到 +/-1.7 * 10308 | 15 – 16 位 |\n\
  \n表 7-2\n\n### 浮点类型\n\n由于 `C#` 中的浮点数值默认被视为 `double`，因此无法按照以下方式声明 `float` 变量：\n```csharpfloat\
  \ myFloat = 23234.23;\n```\n\n尝试编译上述代码将导致语法错误，部分内容如下：\n\n`Literal of type double\
  \ cannot be implicitly converted to type 'float'; use an 'F' suffix to create a\
  \ literal of this type`\n\n\n在上面的示例中，字面量值 `23234.23` 被赋值给名为 `myFloat` 的 `float`\
  \ 变量。问题在于，由于浮点字面量被视为 `double` 类型，因为类型不匹配，无法无法赋值。我们需要告诉 `C#` 我们的字面量数字实际上是 `float`\
  \ 类型。这通过在数字字面量的末尾添加 ‘F’ 后缀来实现，如下：\n\n```csharpfloat myFloat = 23234.23F;\n```\n\n\
  以下代码演示了 `float` 和 `double` 的声明：\n```csharp\nfloat myFloat = 312.20F;\ndouble myDouble\
  \ = 1856675407371955269.95;\n```\n\n需要注意的是，`float` 和 `double` 变量不能作为计数变量（例如，在循环结构中）。\n\
  \n\n`C#` 变量类型的整数族和浮点族具有某些局限性。整数只能处理整数，导致数值的小数部分被剥离。另一方面，浮点数在舍入精度上存在问题。有时需要兼顾两者的优点，因此提供了\
  \ `decimal` 变量类型来处理这种情况。`decimal` 类型是整数和 `float` 变量类型之间的折中方案，它可以存储数值的数值部分并在计算中提供精确值。\n\
  \n与浮点数一样，字面量值必须使用 ‘M’ 后缀被声明为 `decimal` 类型。以下代码声明了两个 `decimal` 值，将它们相乘并显示结果：\n\n\
  ```csharp\ndecimal val1 = 11231.582M;\ndecimal result = val1 * val2;\n```\n\n###\
  \ 7.7 Boolean 类型\n\n`C#` 变量类型使用 `bool` 关键字声明，允许存储 `true` 和 `false` 值。逻辑变量在 `if`\
  \ 和 `while` 语句等控制流结构中非常有用。\n\n\n```csharp\nbool loopFinished = false;\nif (loopFinished)\
  \ {\n    Console.WriteLine(\"The loop is complete\");\n} else {\n    Console.WriteLine(\"\
  Still looping\");\n```\n\n大多数软件都需要一种以字符和单词的形式存储人类可读数据的方法。本章探索 `string` 和字符数据类型的使用。还涵盖了使用名为字符串插值（string\
  \ interpolation）的概念从多个变量构建字符串的主题。\n\n### 7.8 字符数据类型\n\n在字符时，我们指的是单个字母和数字。例如，字母‘a’是一个字符，数字‘1’的视觉表示也是字符。此类字符可以存储在\
  \ `C#` 的 `char` 类型中。一个 `char` 只能包含一个字符。重要的是，字符不仅限于英文字母中的字符。字符在 `C#` 内部以字形簇（grapheme\
  \ clusters）的形式存储。字形簇结合两个或多个 Unicode 标量来表示单个可见字符。\n此外，字符可以在循环和数学表达式中进行计数。要将字符赋值给变量或常量，请用单引号括起字符：\n\
  \n```csharp\nchar myVar = 'a';\nconst char myConst = 'b';\n```\n\n\n```csharp\n\
  char myChar1 = 'f';\nchar myChar2 = ':';\nchar myChar3 = 'X';\n```\n\n\n```csharp\n\
  char myChar4 = '\\u2726';\nConsole.WriteLine(myChar4);\n```\n\n### 7.9 特殊字符\n除了上述列出的标准字符集，还有一组特殊字符（也称为转义序列），用于指定字符串内的换行、制表符或特定的\
  \ Unicode 值等项目。这些特殊字符通过在字符前加一个反斜杠来识别（这一概念被称为转义）。\n\n例如，换行特殊字符的转义序列是 `\\n`。以下代码段使用此换行特殊字符在字符串内部添加空行：\n\
  \n```csharp\nConsole.WriteLine(\"This is a line of text.\\n\\n\\nAn this is another.\"\
  );\n```\n上述代码将生成以下输出：\n\nThis is a line of text.\n\nAn this is another.\n\n任何位于反斜杠之前的字符都被视为特殊字符并进行相应处理。这引出了问题：如果你想要反斜杠怎么办？我们通过转义反斜杠本身（`\\\
  \\`）来实现这一点：\n```csharp\nConsole.WriteLine(\"C# special characters are escaped using\
  \ \\\\\");\n```\n\n当执行上述代码时，将生成以下输出：\n\nC# special characters are escaped.\n`C#`\
  \ 支持的常用特殊字符如下：\n\n| 常量 | 特殊值 |\n| --- | --- |\n| \\e | 转义字符 |\n| \\n | 换行 |\n| \\\
  r | 回车 |\n| \\\\ | 反斜杠 |\n| \\” | 双引号（用于在字符串声明中放置双引号） |\n| \\’ | 单引号（用于在字符串声明中放置单引号）\
  \ |\n| \\unn | 单字节 Unicode 标量，用两个十六进制数字替换 nn |\n| \\unnnn | 双字节 Unicode 标量，用四个十六进制数字替换\
  \ nnnn |\n| \\nnnnnn | 四字节 Unicode 标量，用八个十六进制数字替换 nnnnnn |\n\n\n### 7.10 String\
  \ 类型\n\n之前我们查看了在 `char` 变量中存储单个字符。虽然这对于存储单个字母、数字或 Unicode 标量有效，但对于存储整个单词或句子的作用有限。为了这个目的，`C#`\
  \ 支持 `string` 变量类型。`string` 常量或变量可以存储任意数量的字符。字符串字面量由双引号（`\"`）围绕。例如：\n\n```csharp\n\
  string myString = \"This is string is literal.\";\n\n### 逐字字符串字面量\n\n普通字符串值会解释特殊字符。例如，以下代码由包含多个特殊字符的字符串组成：\n\
  \n```csharp\nstring myString = \"This is some text\\n\\n\\tand this is some more.\"\
  ;\n\n所示，在使用字符串字面量时，使文本跨行的唯一方法是使用 `\\n` 转义字符。以下代码无法编译：\n\n```csharp\nstring myString\
  \ = \"This is some text\n\nand this is some more.\";\n\n字符串字面量必须声明为逐字字符串字面量类型，以便按照书写的内容精确进行解释。逐字字符串字面量忽略转义字符的特殊含义并可以跨行。要将字符串字面量声明为逐字，在声明前加上\
  \ `@` 字符。例如，这允许表达如下字面量：\n\n```csharp\nstring myString = @\"Hi Team,\n\nThe file\
  \ located at 'C:\\Users\\demo\\newdata.txt'\n使用 \\t 序列将制表符插入文本。\n\nBest regards\n\
  ```\n\n\n\n\n```csharp\nstring myString = \"John\";\n\nConsole.WriteLine(myString);\n\
  ```\n\n\nHi Team,\n\n位于 'C:\\Users\\demo\\newdata.txt' 的文件使用了 `\\t` 序列向文本插入制表符。\n\
  \nBest regards\n\n\n## 7.12 字符串插值 (String interpolation)\n\n还可以使用字符串插值通过字符串、变量、常量、表达式和函数调组合构建字符串。\n\
  \n插值通过在字面量声明前加上 `$` 字符并将项目包裹如下所示 `{item}` 来将其嵌入字符串中，其中 `{item}` 是常量或变量名、函数调用，甚至是像数学计算这样的表达式：\n\
  \nint count = 10;\n\nstring message = $\"The current count is {count}\";\n```\n\n\
  例如，下面的代码使用字符串插值创建一个新的字符串变量，嵌入来自各种来源的内容，然后输出到控制台：\n\nstring userName = \"John\";\n\
  \nint inboxCount = 25;\n\nint maxCount = 100;\n\nvar message = $\"{userName} has\
  \ {inboxCount} messages. Message capacity remaining is {maxCount - inboxCount}.\"\
  ;\nConsole.WriteLine(message);\n```\n\n运行上面的示例代码将生成以下：\n\nJohn has 25 messages.\
  \ Message capacity remaining is 75.\n\n\n```csharp\nstring userName = \"John\";\n\
  \nvar message = $\"{userName} reported seeing error code 10 {{low battery}}.\";\n\
  \nConsole.WriteLine(message);\n\n执行上述代码后，将出现以下文本：\n\nJohn reported seeing error\
  \ code 10 {low battery}.\n\n插值也可以在逐义字符串字面量中使用，通过在字符串前加上 `$@` 或 `@$` 来实现：\n\nstring\
  \ userName = \"John\";\n\nint inboxCount = 25;\n\nint maxCount = 100;\n\nvar message\
  \ = $@\"{userName} has {inboxCount} messages.\nMessage capacity remaining is {maxCount\
  \ - inboxCount}.\";\n\nConsole.WriteLine(message);\n```\n\n上述代码将生成以下输出：\n\n\nMessage\
  \ capacity remaining is 75.\n\n注意，插值字符串字面量只能赋值给变量。尝试将插值字符串赋值给常量将导致编译器错误。\n\n## 7.13\
  \ 类型转换 (Type casting)\n\n\n如前所述，C# 是一种强类型语言，这意味着一旦变量被声明为特定类型，随后无法更改为不同的类型。这也限制了可以赋值给变量的值类型。例如，无法将字符串值赋值给\
  \ `int` 变量。\n\n然而，在某些情况下，将一种类型的值赋值给另一种类型的变量是可能的。这涉及隐式转换和显式转换的使用。\n\n### 7.13.1 隐式转换\
  \ (Implicit casting)\n\n\n```csharp\nint myInteger = 20;\n\nlong myLong;\n\nmyLong\
  \ = myInteger;\n\n这种技术被称为隐式转换，因为从 `int` 到 `long` 的转换是由值类型暗示的，而不是在代码中显式声明的。\n\n然而，隐式转换是有限制的。例如，无法隐式转换将\
  \ `long` 赋值给 `int`，因为 `long` 可以存储的数字比 `int` 大得多（`int` 长度为 4 字节，而 `long` 为 8 字节）。尝试将\
  \ `long` 挤入 `int` 变量将不可避免地导致数据丢失。由于此原因，C# 编译器会将此类尝试标记为错误，代码将无法编译，如下所示：\n\n```csharp\n\
  long myLong = 1381292100921;\nint myInteger;\n\nmyInteger = myLong;\n```\n\n当编译器遇到上述代码时，它将声明以下语法错误：\n\
  \n\n如错误消息所示，可以使用显式转换执行此操作。\n\n### 7.13.2 显式转换 (Explicit casting)\n\n虽然编译器可能会阻止隐式转换，但你作为程序员，可能知道尽管变量是\
  \ `long` 类型，但它永远不会包含大于 `int` 变量可以存储的值。在这种情况下，你可能正当想要将存储在 `long` 变量中的值赋值给 `int` 变量。这可以通过使用显式转换将\
  \ `long` 值转换为 `int` 来实现。\n\n\n```csharp\nlong myLong = 138129210;\n\nint myInteger;\n\
  \nmyInteger = (int) myLong;\n\n在使用显式转换时应小心。如果转换的值超过了目标变量的容量，值将会改变且没有警告。例如，考虑上述示例的修改：\n\
  \n```csharp\nlong myLong = 1381292100921;\n\nint myInteger;\nmyInteger = (int) myLong;\n\
  \nConsole.WriteLine($\"myLong = {myLong}\");\n\nConsole.WriteLine($\"myInteger =\
  \ {myInteger}\");\n```\n\n\nmyLong = 1381292100921\n\nmyInteger = 690256740\n\n\
  这种错误在复杂的项目中可能难以定位。同样，将浮点值赋值给存储整数的变量将导致原始值的小数部分丢失。\n\n\n### 7.13.3 识别变量类型\n\n在 C#\
  \ 中通过调用变量的 `GetType()` 方法也可以识别变量的类型。例如，下面的代码输出了 `myVar1` 和 `myVar2` 变量的类型：\n\n```csharp\n\
  string myVar1 = \"Hello\";\ndouble myVar2 = 123123.12;\n\nConsole.WriteLine(myVar1.GetType());\n\
  \nConsole.WriteLine(myVar2.GetType());\n```\n\n\nSystem.String\n\nSystem.Double\n\
  \n## 7.14 知识测试\n\n\n[`www.answertopia.com/q9yn`](https://www.answertopia.com/q9yn)\n\
  \n![img](img/c_-variables.png)\n\n## 7.15 总结\n\n\n# 8. C# 运算符和表达式\n\n本章涵盖了在 C# 中编程时使用运算符创建表达式，包括算术运算符和赋值运算符。涵盖的主题还运算符优先级、逻辑运算符和三元运算符。\n\
  \n\n\n\n在上一章中，我们学习了 C# 中的变量和常量，并描述了不同的变量和常量类型。然而，能够创建常量和变量只是冰山一角。下一步是在 C# 代码中使用这些变量和常量。处理存储在常量和变量中的数据的主要方法是以表达式的形式呈现的。本章将详细检查\
  \ C# 表达式和运算符。\n\n## 8.1 什么是表达式？\n\n最基础的表达式由一个运算符、两个操作数和一个赋值操作组成。以下是一个表达式的示例：\n\n\
  int theResult = 1 + 2;\n```\n\n在上面的示例中，`+` 运算符将两个操作数（`1` 和 `2`）相加。赋值运算符 `=` 随后将加法的结果赋值给名为\
  \ `theResult` 的整数变量。操作数可以很容易地是变量或常量（或两者的混合体），而不是示例中使用的实际数值。\n\n在本章的剩余部分中，我们将检查 C#\
  \ 中可用的各种运算符。\n\n\n我们已经查看了最基础的赋值运算符—— `=` 运算符。该赋值运算符将表达式的结果赋值给变量。本质上，`=` 赋值运算符接收两个操作数。左侧操作数是要被赋值的变量，右侧操作数是待赋值的值。右侧操作数通常是一个执行某些算术或逻辑评估的表达式。以下示例都是赋值运算符的有效用法：\n\
  \n```sharp\nint x;\nint y = 15;\nint z = 5;\nx = y + z; // 将变量 y 加上变量 z 的结果赋值给变量\
  \ x\nx = y; // 将变量 y 的值赋值给变量 x\n```\n\n赋值运算符也可以链式将相同的值赋值给多个变量。例如，以下代码将值 20 赋值给 `x`、`y`\
  \ 和 `z` 变量：\n\n```sharp\nx = y = z = 20;\n```\n\n## 8.3 C# 算术运算符\n\nC# 提供了一系列用于创建数学表达式。这些运算符主要属于二元运算符，因为它们接受两个操作数。异常是一元负运算符（`-`），它表示一个值是负而不是正。这与减法运算符（`-`）形成对比，后者接受两个操作数（即从一个值中减去另一个值）。例如：\n\
  \nint y = -10; // 使用一元 - 运算符将 -10 赋值给变量 y\nint z = 2;\nint x = y - z; // 减法运算符。从\
  \ y 中减去 z\n\n下表列出了主要的 C# 算术运算符：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| – (一元) | 取变量或表达式的值的反\
  \ |\n| * | 乘法 |\n| + | 加法 |\n| – | 减法 |\n| % | 取模 |\n\n表 8-1\n\n注意，单个表达式可以使用多个运算符，例如：\n\
  ```sharp\nint y = 10; // 使用一元 - 运算符将 -10 赋值给变量 y\nint z = 2;\nint x = y * 10 + z\
  \ - 5 / 4;\n```\n\n虽然上面的代码完全有效，但必须意识到 C# 并不是从左到右或从右到左评估表达式，而是按照符合基本数学原理的各种运算符的优先级指定的顺序进行评估。运算符优先级是一个需要理解的重要课题，因为它影响计算结果，并将在下一节详细介绍。\n\
  ## 8.4 C# 运算符优先级\n\nC# 使用与基础数学中相同的运算符顺序概念。例如，我们可能可能在学校时代都学过，以下计算的答案是 210 而不是 300：\n\
  \n```sharp\nint x;\nx = 10 + 20 * 10;\n```\n\n当代码运行时，生成的结果将是 210。这是运算符优先级的直接结果。C#\
  \ 遵循我们在学校中学的相同规则，这些规则告诉它在表达式中应该按什么顺序评估运算符。例如，C# 正确地认为乘法运算符（`*`）的优先级高于加法运算符（`+`）。\n\
  \n幸运的是，C# 内置的优先级可以通过用括号包裹表达式中的低优先级部分（基础数学中的另一个常见概念）来覆盖。例如：\n\n```sharp\nx = (10\
  \ + 20) * 10;\n```\n\n在上面的示例中，括号内的表达式片段在较高优先级的乘法之前被评估，结果为 300。\n\n下表概述了 C# 运算符优先级从最高到最低的顺序：\n\
  \n| :--- | :--- |\n| 最高 | +, -, !, ~, ++x, –x, (T)x |\n| | * / % |\n| | + – |\n\
  | | << >> |\n| | < > <= >= is as |\n| | == != |\n| | ^ |\n| | \\| |\n| | && |\n\
  | | \\|\\| |\n| | :? |\n| 最低 | =, *=, /=, %, +=, -=, <<=, >>=, &=, ^=, |= |\n\n\n\
  赋值运算符具有最低优先级并不意外，因为你只想在表达式完成评估后进行赋值。\n\n\nC# 提供了几种运算符，将赋值与算术或逻辑操作结合。这些运算符主要用于在评估后存储结果。例如，你可能会这样写表达式：\n\
  \n```sharp\nx = x + y;\n```\n\n\n```sharp\nint x = 10;\nint y = 20;\nx += y;\n```\n\
  \n\n| 运算符 | 描述 |\n| :--- | :--- |\n| x -= y | x 减去 y 并将结果存入 x |\n| x *= y | x 乘以\
  \ y 并将结果存入 x |\n| x /= y | x 除以 y 并将结果存入 x |\n| x &= y | 将 x 与 y 的逻辑与结果赋值给 x |\n\
  | x |= y | 将 x 与 y 的逻辑或结果赋值给 x |\n| x ^= y | 将 x 与 y 的逻辑异或结果赋值给 x |\n表 8-3\n\n##\
  \ 8.6 递减运算符\n\n另一个快捷方法涉及 C# 的递增递减运算符。与上一节描述的复合赋值运算符类似，考虑以下 C# 代码片段：\n```sharp\n\
  x = x + 1; // 变量 x 增加 1\nx = x - 1; // 变量 y 减少 1\n```\n\n\n```sharp\nx++; // x 增加\
  \ 1\nx--; // x 减少 1\n```\n\n这些运算符可以放在变量名称之前或之后。如果运算符放在变量名称之前，会在对变量进行任何其他操作之前执行递增递减。例如，在下面的代码中，`x`\
  \ 在赋值给 `y` 之前递增，使得 `y` 的值为 10：\n```sharp\nint x = 9;\nint y;\n```\n\n在下面的示例中，`x`\
  \ 的值（9）在执行递减之前赋值给变量 `y`。因此，在表达式评估后，`y` 的值将为 9，而 `x` 的值将为 8：\n```sharp\nint x = 9;\n\
  int y;\n```\n\n\n\n\n\n除了数学运算符和赋值运算符外，C# 还包含一组逻辑运算符，用于执行比较。这些运算符都根据比较结果返回布尔（`bool`）真或假结果，并且它们是二元的，因为它们与两个操作数一起工作。\n\
  比较运算符最常用于构建程序的控制流。例如，可以根据一个值是否匹配另一个值来构建 `if` 语句：\n\n```csharp\nint x = 9;\nint y\
  \ = 9;\nif (x == y)\n    Console.WriteLine(\"x is equal to y\");\n```\n\n输出：\n\n\
  比较的结果也可以存储在 `bool` 变量中。例如，以下代码将产生一个真值存储在名为 `result` 的变量中：\n\n```csharp\nbool result;\n\
  int x = 10;\nint y = 20;\n```\n\n显然，10 小于 20，导致 `x < y` 表达式的求值结果为真。下表列出了 C# 比较运算符的完整集合：\n\
  | 运算符 | 说明 |\n| --- | --- |\n| `x == y` | 如果 x 等于 y，则返回 true |\n| `x > y` | 如果 x\
  \ 大于 y，则返回 true |\n| `x >= y` | 如果 x 大于或等于 y，则返回 true |\n| `x < y` | 如果 x 小于 y，则返回\
  \ true |\n| `x <= y` | 如果 x 小于或等于 y，则返回 true |\n\n表 8-4\n\n\n另一组返回布尔真和假值的运算符是 C#\
  \ 布尔逻辑运算符。这些运算符既返回布尔结果，又接受布尔值作为操作数。关键的运算符有 NOT (`!`)、AND (`&&`)、OR (`||`) 和 XOR\
  \ (`^`)。\n\nNOT (`!`) 运算符反转布尔变量的当前值或表达式的结果。例如，如果一个名为 `flag` 的变量当前为真，则在变量前加一个 `!`\
  \ 字符将把该值反转为假：\n\n```csharp\nbool flag = true; //变量为真\nsecondFlag = !flag; // secondFlag\
  \ 设置为假\n```\n\n\n```csharp\nif ((10 < 20) || (20 < 10))\n```\n\n输出：\nExpression\
  \ is true\n\nAND (`&&`) 运算符只有当两个操作数都求值为真时才返回真。接下去的示例将返回假，因为两个操作数表达式中只有一个求值为真：\n\n\
  int x = 10;\nint y = 20;\n\nif ((x < 20) && (y < 10))\n    Console.WriteLine(\"\
  Expression is true\");\n    Console.WriteLine(\"Expression is false\");\n```\n\n\
  输出：\nExpression is false\nXOR (`^`) 运算符如果两个操作数中的一个（且仅一个）求值为真，则返回真。例如，接过的示例将返回真，因为只有一个运算符求值为真：\n\
  \n```csharp\nint y = 20;\n\nif ((x < 20) ^ (y < 10))\nelse\n    Console.WriteLine(\"\
  Expression is false\");\n```\n\n输出：\nExpression is true\n\n\n## 8.9 范围和索引运算符\n\n\
  \n## 8.10 三元运算符\n\n\n`[condition] ? [true expression] : [false expression]`\n\n\n\
  ```csharp\nint x = 10;\nint y = 20;\nConsole.WriteLine( x > y ? x : y );\n```\n\n\
  20\n\n上面的真表达式和假表达式简单地输出最大值。在实践中，它可以是任何有效表达式。例如，下面的修改为每个结果指定了要显示的字符串值：\n```csharp\n\
  int x = 10;\nint y = 20;\nConsole.WriteLine(x > y ? \"x is larger\" : \"y is larger\"\
  );\n```\n\n输出：\n\n## 8.11 空合并运算符\n\n空合并运算符 (`??`) 允许在操作数具有 null 值时使用默认值。使用此运算符的语法如下：\n\
  \n\n如果左侧操作数不为 null，则返回操作数的值；否则，表达式返回默认操作数的值。\n\n接下去的示例将输出读取“Welcome back”的文本，因为操作数为\
  \ null 值：\n\nstring customerName = null;\nstring recipient = customerName ?? \"\
  Customer\";\nConsole.WriteLine($\"Welcome back, {recipient}\");\n```\n\n输出：\nWelcome\
  \ back, Customer\nC# 还包含空合并赋值运算符 (`??=`），其语法如下：\n\n`<operand1> ??= <operand2>`\n\
  如果左侧操作数不为 null，则返回操作数的值；否则，表达式返回默认值。\n\n```csharp\ncustomerName ??= \"Customer\"\
  ;\n// customerName 现在是 Customer\n```\n## 8.12 位运算符\n\n如前所述，处理器以二进制方式工作。这些本质上是 1\
  \ 和 0 的流。因此，我们偶尔处于这一层。我们作为程序员在这个领域发现新新意。其他作者对该主题的描述比我们好得多。出于练习目的，我们将使用 8 位值。首先，十进制数字\
  \ 171 用二进制表示为：\n\n10101011\n\n其次，数字 3 用二进制序列表示：\n00000011\n\n现在我们有了两个二进制数字，可以开始查看：\n\
  \n### 8.12.1 位非\n位非用波浪号 (`~`) 字符表示，其效果是反转数字中的所有位。换句话说，所有的 0 变成 1，所有的 1 变成 0。以我们的示例数字\
  \ 3 为，位非操作的结果如下：\n\n00000011 NOT\n========\n11111100\n因此，以下 C# 代码的结果为 -4：\n\n```csharp\n\
  int z = ~y;\nConsole.WriteLine($\"Result is {z}\");\n```\n### 8.12.2 位与\n\n位与用单个符号\
  \ (`&`) 表示。它对两个数字进行按位比较。两个数字的二进制序列中任何对应的位置如果都是 1，则会在结果数字的相同位置产生一个 1。如果任何一个位包含 0，则结果中会出现\
  \ 0。以我们的两个示例数字为例，将如下所示：\n\n10101011 AND\n00000011\n========\n\n我们可以看到，两个数字都有 1 的位置只有最后两个。如果我们在\
  \ C# 代码中执行此操作，那么我们应该发现结果是 3 (00000011)：\n\nint x = 171;\nint y = 3;\nint z = x &\
  \ y;\nConsole.WriteLine($\"Result is {z}\");\n```\n\n\n\n位按或（OR）也会对两个二进制序列进行逐位比较。与按与（AND）操作不同，如果第一个操作数或第二个操作数中有一个\
  \ 1，则或操作就会在结果中放置 1。该运算符由单个竖线字符（`|`）表示。使用我们的示例数字，结果如下：\n\n10101011 OR\n00000011\n\
  ========\n10101011\n```\n\n如果我们在 C# 示例中执行此操作，结果将为 171：\n```csharp\nint x = 171;\n\
  int y = 3;\nint z = x | y;\nConsole.WriteLine($\"Result is {z}\");\n```\n\n\n位按异或（通常称为互斥或，由脱字符字符\
  \ `^` 表示）执行的任务与或操作相似，不同之处在于，如果两个数字中一个或另一个对应的位位置为 1，则在结果中放置 1。如果两个位置均为 1 或均为 0，则结果中的相应位将设置为\
  \ 0。例如：\n\n10101011 XOR\n00000011\n========\n10101000\n```\n\n在这种情况下，结果为 10101000，转换为十进制为\
  \ 168。为了验证这一点，我们可以再次尝试一些 C# 代码：\n```csharp\nint x = 171;\nint y = 3;\nint z = x\
  \ ^ y;\nConsole.WriteLine($\"Result is {z}\");\n```\n\n\n位左移将二进制数中的每个位向左移动指定的位数。将一个整数向左移动一位的效果是该值翻倍。\n\
  \n\n```text\n10101011 Left Shift one bit\n101010110\n```\n\n在 C# 中，位左移运算符由序列 `<<`\
  \ 表示，后面跟着要移动的位数。例如，向左移动 1 位：\n\n```csharp\nint x = 171;\nConsole.WriteLine($\"Result\
  \ is {z}\");\n```\n\n\n### 8.12.6 位右移\n\n位右移正如你预期的那样，与左移相同，只是移动的方向相反。将一个整数向右移动一位的效果是该值减半。\n\
  \n请注意，由于我们是在向右移动，无论使用什么存储结果的数据类型，都没有机会保留最低位。因此，低位会被丢弃。空出的高位位置是用 0 还是 1 填充，取决于用于指示正负数的符号位是否被设置。\n\
  \n10101011 Right Shift one bit\n========\n01010101\n```\n\n位右移由字符序列 `>>` 后面跟移位计数表示：\n\
  \nint x = 171;\nint z = x >> 1;\nConsole.WriteLine($\"Result is {z}\");\n\n执行上述代码时，将报告移位结果为\
  \ 85，这等于二进制 01010101。\n\n## 8.13 复合位运算符\n\n与算术运算符一样，每个位运算符都有一个对应的复合运算符，允许使用单个运算符完成操作和赋值：\n\
  \n| :--- | :--- |\n| `x &= y` | 对 x 和 y 执行位与操作并将结果赋值给 x |\n| `x |= y` | 对 x 和 y\
  \ 执行位或操作并将结果赋值给 x |\n| `x <<= n` | 将 x 向左移动 n 位并将结果赋值给 x |\n| `x >>= n` | 将 x 向右移动\
  \ n 位并将结果赋值给 x |\n\n表 8-5\n\n## 8.14 知识测试\n\n\n[`www.answertopia.com/qo99`](https://www.answertopia.com/qo99)\n\
  \n\n## 8.15 总结\n\n在 C# 编程中，运算符和表达式用于处理和评估变量与常量。这可以简单到使用表达式中的加法运算符两个两个数字并将结果存储在变量中，也可以复杂的执行位操作。运算符有几类，我们在本章中涵盖了每种类型。\n\
  \n# 9. C# 条件控制流\n\n\n## 9.1 循环与条件控制流\n\n无论使用何种编程语言，应用开发都涉及逻辑。编程艺术很大程度上编写根据一个或多个标准做出决策的代码。这些决策决定了哪些代码被执行、执行频率，以及哪些代码在程序运行时被跳过。这通常被称为控制流，因为它控制了流。\n\
  \n## 9.2 使用 if 语句\n\n\n```csharp\nif (boolean expression) {\n    // 当表达式求为真时执行的\
  \ C# 代码\n}\n```\n\n\nif 语句的另一种变体允许我们在 if 语句中的表达式评估为假时指定要执行的代码，使用如下语法：\n\nif (boolean\
  \ expression) {\n    // 当表达式为真时执行的代码\n} else {\n    // 当表达式为假时执行的代码\n}\n```\n\n\n\
  到为止，我们查看了根据单个逻辑表达式结果做出决策的 if 语句。有时，必须根据多个不同的标准做出决策。为了这个目的，可以使用 if … else if … 结构，其语法如下：\n\
  \nif (boolean expression) {\n```\n\n\n\n```csharp\n\n} else if (boolean expression)\
  \ {\n\n// 如果表达式为真，则执行代码\n\n} else if .....\n\n\n// 如果之前的表达式都为假，则执行代码\n\n}\n```\n\
  **注意：** 如果所有布尔表达式的评估结果为假且不需要执行任何操作，则可以省略最后的 `else`。\n\n下面的代码片段演示了 `if` ... `else\
  \ if` ... 结构的使用：\n\n```csharp\n\nif (x == 10) {\n    Console.WriteLine(\"x is 10\"\
  );\n} else if (x == 9) {\n    Console.WriteLine(\"x is 9\");\n} else if (x == 8)\
  \ {\n    Console.WriteLine(\"x is 8\");\n    Console.WriteLine(\"x is some other\
  \ number\");\n}\n```\n\n这种方法对于中等数量的比较效果良好，但在处理大量表达式求值时可能会变得非常繁琐。C# 的 `switch` 语句为此类情况提供了一个更灵活、更高效的解决方案。下一章将介绍\
  \ `switch` 语句。\n\n## 9.5 知识测试\n点击下方链接或扫描二维码，以测试你对 C# 控制流的知识和理解：\n\n[`www.answertopia.com/xzu2`](https://www.answertopia.com/xzu2)\n\
  ![img](img/c_-control.png)\n\n## 9.6 总结\n\n`control flow`（控制流）一术语描述了应用程序源代码在运行时决定执行路径的逻辑。本章检查了条件控制流，并探索了如何使用\
  \ `if` 和 `else` 语句来实现这种类型的流逻辑。\n\n## 10. C# switch 语句\n在本章中，我们将介绍 C# 的 `switch`\
  \ 语句，并演示为什么它是复杂的 `if` ... `else if` ... 语句的更好替代方案。\n\n在上节中，我们查看了如何使用 `if` 和 `else`\
  \ 语句控制程序的执行流。虽然这些语句结构在测试有限数量的条件时效果良好，但在处理大量可能的条件时，它们会迅速变得难以处理。C# 继承了 C 语言语言的 `switch`\
  \ 语句。\n在本章中，我们将详细探讨 `switch` 语句。\n\n### 10.1 为什么要使用 switch 语句？\n\n对于少数几个逻辑值评估，`if`\
  \ ... `else if` ... 结构是完全足够的。遗憾的是，任何多于两个或三个可能的场景都会迅速让这种结构变得既耗时又难以阅读。例如，请考虑以下代码示例。该程序使用\
  \ `if` ... `else if` ... 语句根据型号名称识别汽车制造商：\n\n```csharp\nstring carManufacturer;\n\
  \nif ((String.Compare(carModel, \"Patriot\") == 0) ||\n(String.Compare(carModel,\
  \ \"Liberty\") == 0) ||\n(String.Compare(carModel, \"Wrangler\") == 0)) {\n    carManufacturer\
  \ = \"Jeep\";\n}\n    carManufacturer = \"Ford\";\n}\nelse if (String.Compare(carModel,\
  \ \"Corolla\") == 0) {\n    carManufacturer = \"Toyota\";\n} else {\n    carManufacturer\
  \ = \"unknown\";\n}\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\");\n\
  ```\n\n\n### 10.2 使用 switch 语句\n\nC# `switch` 语句的语法如下：\n\n```csharp\nswitch (value){\n\
  \        statements\n        break/jump\n    case constant:\n        break/jump\n\
  \    default:\n        statements\n        break/jump\n}\n```\n\n\n在上面的语法大纲中，`value`\
  \ 代表一个值或返回一个值的表达式。这是 `switch` 操作的值。以我们的示例为例，这将代表汽车型号的字符串。\n\n每个可能的匹配都需要一个 `case`\
  \ 语句，后面紧跟一个常量值（再次使用我们的示例，这将是汽车型号）。每个 `case` 常量的类型必须与主 `value` 的类型相同。`case` 行之后是当该值匹配\
  \ `case` 常量时要执行的 C# 语句。\n\n语句之后是可选的 `break`、`goto` 或 `continue` 语句。这些语句在找到匹配项时跳出\
  \ `switch` 语句，跳转到代码中的特定位置，或者跳过循环中的任何剩余代码并开始下一次迭代。\n\n\n### 10.3 switch 语句示例\n\n\n\
  ```csharp\nstring carModel = \"Corolla\";\n\nswitch (carModel) {\n    case \"Patriot\"\
  :\n    case \"Wrangler\":\n        carManufacturer = \"Jeep\";\n        break;\n\
  \    case \"Focus\":\n        carManufacturer = \"Ford\";\n        break;\n    case\
  \ \"Corolla\":\n        break;\n    default:\n        carManufacturer = \"unknown\"\
  ;\n        break;\n}\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\"\
  );\n\n### 10.4 解释示例\n\n\n`default` 选项在没有任何 `case` 语句与汽车字符串匹配时，将 `carManufacturer`\
  \ 字符串设置为“unknown”。\n\n### 10.5 使用 switch 表达式\n\n使用 `switch` 语句节省了我们的输入工作并使代码更容易阅读，但\
  \ C# 允许我们使用 `switch` 表达式进一步简化代码，其语法如下：\n\nresult = value switch\n{\n    constant1\
  \ => statements,\n    constant3 or constant4 => statements,\n    constant5 and constant6\
  \ or constant7 => statements,\n    _ => default_statement\n};\n```\n\n使用 `switch`\
  \ 表达式，我们的示例可以简化如下：\n```csharp\nstring carModel = \"Corolla\";\nstring carManufacturer;\n\
  \ncarManufacturer = carModel switch\n{\n    \"Patriot\" or \"Liberty\" or \"Wrangler\"\
  \ => \"Jeep\",\n    \"Corolla\" => \"Toyota\",\n    _ => \"unknown\"\n};\n\nConsole.WriteLine($\"\
  Manufacturer is {carManufacturer}\");\n```\n\n\n在原始示例中，我们使用 `break` 语句退出 `switch`\
  \ 语句。结果是将执行点移动到 `switch` 语句之后的语句。遗憾的是，当必须执行 `default` 语句时就会产生了一个问题。为了满足这一需求，我们将示例代码中的\
  \ `break` 语句替换为 `goto default` 语句：\n\nstring carModel = \"Corolla\";\nstring carManufacturer\
  \ = \"unknown\";\n\nswitch (carModel) {\n    case \"Patriot\":\n    case \"Liberty\"\
  :\n    case \"Wrangler\":\n        goto default;\n    case \"Focus\":\n        carManufacturer\
  \ = \"Ford\";\n        goto default;\n    case \"Corolla\":\n        carManufacturer\
  \ = \"Toyota\";\n        goto default;\n        Console.WriteLine($\"The {carModel}\
  \ is manufactured by {carManufacturer}\");\n        break;\n}\n\n虽然 `goto` 语句也可以用于跳转到\
  \ C# 代码中的标记位置，但强烈建议不要这种这样使用它。上述的用法是像 C# 这样现代面向对象语言中使用 `goto` 语句的唯一接受的用法。正如任何资深程序员都会告诉你的那样，如果你发现自己处于只有通过\
  \ `goto` 语句才能实现某些目标的境地，那么你需要重新思考并重构你的代码，使其不再需要 `goto`。\n\n## 10.7 在 C# switch 语句中使用\
  \ continue\n\n\n\n\n`break` 语句的另一种替代方案是 `continue` 语句。假设 `switch` 语句是循环的一部分。在这种情况下，`continue`\
  \ 语句将导致执行立即返回到循环开头，跳过当前循环迭代中尚未执行的任何后续代码。\n\n在循环中使用 `continue` 语句的详细内容将在“使用 for 语句进行\
  \ C# 循环”章节中介绍。\n\n## 10.8 知识测试\n\n\n[`www.answertopia.com/k4uy`](https://www.answertopia.com/k4uy)\n\
  \n\n## 10.9 总结\n\n当只有少数可能的结果时，`if-else` 语句是做出决策的可靠方法。然而，当一个评估结果会产生许多潜在的结果时，这种方法可能会变得繁琐。在这种情况下，`switch`\
  \ 语句是 C# 中实现流控制逻辑的更好选择。在许多情况下，可以使用 `switch` 表达式进一步简化 `switch` 语句。\n\n## 11. 使用 for\
  \ 语句进行 C# 循环\n\n\n### 11.1 为什么要使用循环？\n\n通常我们知道，计算机非常擅长无限次地执行重复任务，而且速度非常快。另一个常识是，除非有人编程告诉计算机需要做什么，否则计算机什么都不做。循环语句是告诉计算机某项任务需要重复特定次数的主要机制。例如，假设你需要将一个数字自加十次。实现此点的一种方法可能是编写以下\
  \ C# 代码：\n\n```csharp\nlong j = 1;\nj += j;\nj += j;\nj += j;\nj += j;\nj += j;\n\
  j += j;\nj += j;\nj += j;\n```\n\n\nC# `for` 循环的语法如下：\n\nfor ( <初始化器>; <条件表达式>;\
  \ <循环表达式> )\n{\n    要执行的语句\n}\n```\n\n`<初始化器>`元素初始化了一个计数器变量。传统上，使用变量 `i` 用于此目的。例如：\n\
  ```csharp\ni = 0;\n```\n\n上述代码将计数器设置为变量 `i` 并将其设置为零。注意，如果计数器变量之前没有声明，可以在 `for` 语句中进行声明：\n\
  \n```csharp\n```\n\n条件表达式指定了测试内容，用以验证循环是否执行了所需的迭代次数。例如，如果我们想让循环 100 次：\n\n```csharp\n\
  i < 100;\n```\n最后，循环表达式指定了在计数器变量上执行的操作。例如，加 1：\n\n```csharp\n```\n\n在循环每次迭代中要执行的语句体包含在由左括号（`{`）和右括号（`}`）定义的代码块中。\n\
  \n通过这一切，我们可以创建一个 `for` 循环来执行前面示例中概述的任务：\n\n```csharp\nfor (int i=0; i<50; i++) {\n\
  \    j += j;\n    Console.WriteLine(\"j = \" + j);\n```\n\n### 11.2 C# 循环变量作用域\n\
  创建循环时需要注意的关键点是，在循环体内定义的任何变量对循环内的代码都是可见的。这是一个作用域的概念。例如，如果变量 `myCounter` 定义在 `for`\
  \ 循环的体内，那么一旦循环终止，该变量就会消失：\n\n```csharp\n// 变量 myCounter 不存在\nfor (int i = 0; i <\
  \ 10; i++)\n{\n    int myCounter = 0; // 在 for 循环的作用域内创建变量 myCounter\n}\n// 循环退出后变量\
  \ myCounter 现在离开了作用域并消失\n```\n### 11.3 创建无限 for 循环\n\n可以使用 `for(;;)` 语法构建执行无限次数的\
  \ `for` 循环。例如，以下代码示例将不断输出“Hello from C#”，直到用户手动终止程序（或计算机关闭或重启）：\n\n```csharp\nfor\
  \ (;;) {\n    Console.WriteLine(\"Hello from C#\");\n```\n\n如果你在 VS Code 中尝试上面的示例并发现自己陷入了无限循环，可以使用下方图\
  \ 11-1 中突出显示的停止按钮停止执行：\n\n![img](img/vs_code_stop_button.png)\n\n图 11-1\n### 11.4\
  \ 跳出 for 循环\n\n创建循环后，你可能需要在满足满足前跳出循环。C# 提供了 `break` 语句来跳出循环。例如，以下代码示例会在 `j` 超过 100\
  \ 时跳出当前循环：\n```csharp\nlong j = 10;\nfor (int i = 0; i < 50; i++) {\n    j += j;\n\
  \    Console.WriteLine(\"j = \" + j);\n    if (j > 100)\n        break;\n```\n\n\
  ### 11.5 嵌套 for 循环\n到目前，我们只查看了单层 `for`。也可以嵌套循环，让循环位于循环内部。例如：\n\n```csharp\nfor (int\
  \ i = 0; i < 100; i++) {\n    Console.WriteLine(\"i = \" + i);\n    for (int j =\
  \ 0; j < 10; j++) {\n        Console.WriteLine(\"j = \" + j);\n}\n```\n\n\n### 11.6\
  \ 从嵌套循环中跳出\n\n退出嵌套循环时需要注意的一个重要点是，`break` 只退出当前层。例如，以下代码示例会在 `j` 等于 5 时退出当前循环：\n\n\
  ```csharp\nfor (int i = 0; i < 100; i++) {\n    for (int j = 0; j < 10; j++) {\n\
  \        if (j == 5)\n            break;\n        Console.WriteLine(\"j = \" + j);\n\
  \    }\n}\n```\n### 11.7 继续 for 循环\n\n另一个用于循环的有用语句是 `continue` 语句。当执行过程在任何循环中遇到\
  \ `continue` 语句时，它会跳过循环体的剩余代码并从循环顶部重新开始执行。使用这种技术，我们可以例如构造一个 `for` 循环输出 1 到 9 之间的偶数：\n\
  \n```csharp\nfor (int i = 1; i < 10; i++) {\n    if ((i % 2) != 0)\n    Console.WriteLine($\"\
  i = {i}\");\n}\n```\n### 11.8 C# foreach 语句\n\n`foreach` 循环用于迭代集合中的项序列，并提供了一种简单的循环选项。\n\
  \n`foreach` 循环的语法如下：\n\n```csharp\n    // 要执行的代码\n}\n```\n\n\n\n\n例如，考虑以下 `foreach`\
  \ 循环结构：\n\n```csharp\nstring[] myColors = [\"red\", \"green\", \"yellow\", \"orange\"\
  , \"blue\"];\n\nforeach (string color in myColors)\n    Console.WriteLine(\"{0}\
  \ \", color);\n}\n```\n循环开始时，声明当前项将被赋值给命名为 `color` 的常量。然后，我们告诉该语句它将遍历 `myColors`\
  \ 集合中的所有元素。循环体向控制台面板发送消息，指示分配给 `color` 常量的当前值。\n\n正如我们将在“在 C# 中创建 2D、3D 和交错数组” 章节中所看到的，`foreach`\
  \ 循环在处理数组和字典等集合时特别有益。\n\n### 11.9 知识测试\n\n点击下方链接或扫描二维码，以测试你对 C# 循环的知识和理解：\n[`www.answertopia.com/3xzv`](https://www.answertopia.com/3xzv)\n\
  \n![img](img/c_-for-loop.png)\n\n### 11.10 总结\n\n循环控制流是大多数编程语言中的一种基本特性，用于执行必须运行多次的任务。在本章中，我们涵盖了\
  \ C# 的 `for` 和 `foreach` 语句，以及如何利用它们来执行指定次数的任务。此外，我们还探索了嵌套循环，并解释了如何使用 `break` 和\
  \ `continue` 语句来管理循环行为。\n## 12. 使用 do 和 while 语句进行 C# 循环\n\n在涵盖了使用 C# `for` 语句构建循环的主题后，本章旨在介绍另外两种循环选项：`while`\
  \ 和 `do ... while` 结构。\n上一节描述的 C# `for` 循环在预先知道程序中特定任务需要重复多少次时效果良好。然而，在某些情况下，代码需要重复执行直到满足特定条件，而无法得知需要重复多少次才能满足标准。虽然可以使用包含\
  \ `break` 语句的 `for` 循环来实现这一点，但 C# 提供了 `while` 循环这种更优的方案（这是 C# 从 C 编程语言中继承的又一种结构）。\n\
  \n### 12.1 C# while 循环\n\n本质上，`while` 循环会重复一组任务，直到满足特定条件。`while` 循环的语法定义如下：\n\n\
  ```csharp\n    // C# statements go here\n}\n```\n在上面的示例中，`<condition>` 是一个返回 true\
  \ 或 false 的表达式，而 `// C# statements go here` 注释表示在条件表达式持续求值为 true 时执行的 C# 代码。例如：\n\
  \n```csharp\nint myCount = 0;\nwhile ( myCount < 100 ) {\n    myCount++;\n}\nConsole.WriteLine($\"\
  myCount = {myCount}\");\n```\n\n在上面的示例中，`while` 表达式将评估 `myCount` 变量是否小于 100。如果它已经大于\
  \ 100，则括号中的代码将被跳过，循环退出且不执行任何任务。\n\n另一方面，如果 `myCount` 不大于 100，则括号中的代码将被执行，循环返回 `while`\
  \ 语句并重复对 `myCount` 进行评估。这个过程一直重复，直到 `myCount` 的值超过 100，此时循环退出。\n\n### 12.2 C# do\
  \ … while 循环\n\n将 `do … while` 循环视为反转的 `while` 循环通常很有帮助。`while` 循环在执行循环体中的代码之前评估表达式。如果表达式在第一次检查时求值为\
  \ false，则代码不会执行。相反，`do … while` 循环用于适用于情况，即你知道循环体中的代码始终需要至少执行一次。例如，你可能希望继续遍历数组中的项，直到找到特定的项。你知道你至少必须检查数组中的第一个项才有机会找到你需要的条目。`do\
  \ … while` 循环的语法如下：\n\n```csharp\ndo {\n    // C# statements here\n} while (<conditional\
  \ expression>);\n```\n\n在下方的 `do … while` 示例中，循环将持续到变量名为 `i` 的值等于 0：\n\n```csharp\n\
  int i = 10;\ndo {\n    i--;\n    Console.WriteLine($\"i = {i}\");\n} while (i >\
  \ 0);\n```\n\n### 12.3 退出循环\n\n与 `for` 循环一样，也可以通过 `break` 语句从 `while` 或 `do` 循环中退出。\n\
  \n### 12.4 continue 语句\n\n`continue` 语句会跳过循环中的剩余代码并返回到循环顶部。\n\n在下面的示例中，只有当 `i` 为偶数（即能被\
  \ 2 整除无余数）时才会调用 `WriteLine()` 方法：\n\n```csharp\nint i = 1;\nwhile (i < 20) {\n \
  \   i++;\n    if ((i % 2) != 0)\n        continue;\n    Console.WriteLine(\"i =\
  \ \" + i);\n}\n```\n\n上述示例中的 `continue` 语句会在 `i` 不能被 2 整除无余数时跳过 `WriteLine()` 调用。如果触发了\
  \ `continue` 语句，执行将跳转到循环顶部（直到 `i` 超过 19）。\n\n### 12.5 知识测试\n\n点击下方链接或扫描二维码，以测试你对\
  \ C# do-while 循环的知识和理解：\n\n[`www.answertopia.com/3xzv`](https://www.answertopia.com/3xzv)\n\
  \n![img](img/c_-do-while.png)\n\n### 12.6 总结\n\nC# `do` 和 `while` 语句是强大的工具，用于重复执行任务直到满足特定条件，例如算运算达到结果或数据到达网络端口。独立使用时，`while`\
  \ 循环在执行第一次迭代之前检查是否满足条件，从而允许跳过整个循环。另一方面，`do ... while` 循环在你知道在满足条件之前至少需要执行循环代码时非常有用。两种循环都支持\
  \ `break` 和 `continue` 语句。\n\n## 13. C# 对象面向编程简介\n\n到目前为止，我们学习了 C# 编程的基础知识，例如变量类型和控制流。虽然使用这些技术可以编写功能性程序，但要成为一名熟练的\
  \ C# 程序员很多要做。C# 本质上是一种面向对象的编程语言，因此，任何 C# 程序员都被期望使用该语言创建面向对象的应用。\n\nC# 为开发面向对象的应用提供了广泛支持。本章将介绍面向对象编程的基本概念，并解释其与应用开发相关的概念。\n\
  \n### 13.1 什么是对象？\n\n对象是一个自包含的功能模块，可以作为软件应用程序的构建块被轻松使用和重复使用。\n\n\n\n\n对象由数据变量（`properties`）和函数（`methods`）组成，可以在对象上进行访问和调用以执行任务。这些统称为\
  \ `members`。\n\n## 13.2 什么是类？\n\n类就像一个蓝图或建筑师的图纸，描述了对象在创建时的样子。它定义了对象将拥有的方法以及包含的变量。本质上，类决定了对象的属性和行为。\n\
  \n## 13.3 创建 ObjectDemo 项目\n\n启动 VS Code，并打开你的“C# Essentials”工作空间文件夹。按下 `Cmd-Shift-P`\
  \ 显示命令面板，并选择 `.NET: New Project...` 命令，如下所示：\n\n![img](img/vs_code_command_palette2.png)\n\
  图 13-1\n\n从模板列表中选择 `Console App` 选项，在提示时将项目命名为 `ObjectDemo`，按 `Enter` 键确认选择：\n\n\
  ![img](img/vs_code_new_project_name.png)\n图 13-2\n\n接受默认的工作空间文件夹，然后选择创建新项目的选项：\n\
  \n![img](img/vs_code_create_new_project.png)\n图 13-3\n\n从操作栏中选择 `Explorer` 选项（在下方图\
  \ 13-4 中标记为 A），并确认 `ObjectDemo` 项目已列在工作空间文件夹中 (B)：\n\n![img](img/vs_code_new_project_added.png)\n\
  图 13-4\n\n## 13.4 声明 C# 类\n\n在实例化对象之前，我们首先需要为对象定义类蓝图。在本章中，我们将创建一个 `BankAccount`\
  \ 类来演示 C# 面向对象编程的概念。第一步是使用 `Solution Explorer` 向项目添加一个新的类文件。`Solution Explorer`\
  \ 位于 `Explorer` 面板的底部，如图 13-5 所示：\n\n![img](img/vs_code_solution_explorer.png)\n\
  图 13-5\n\n在 `Solution Explorer` 中，将鼠标指针悬停在 `ObjectDemo` 条目上以显示新文件和文件夹按钮：\n\n![img](img/vs_code_solution_explorer_add_file.png)\n\
  图 13-6\n\n点击 `Add New File...` 按钮将显示 `Add New File` 面板，如图 13-7 所示。在面板中，选择 `Class`\
  \ 选项：\n\n![img](img/vs_code_solution_explorer_new_class.png)\n图 13-7\n\n在提示时，将类命名为\
  \ `BankAccount` 然后按 `Enter` 创建文件。新文件将自动加载到编辑器中，内容如下：\n\n```csharp\nusing System;\n\
  \nnamespace ObjectDemo;\n\npublic class BankAccount\n{\n}\n```\n\n## 13.5 访问修饰符\n\
  \n当 VS Code 生成我们的 `BankAccount` 类时，它使用了 `public` 访问修饰符。访问修饰符控制类是否可以从项目的其他代码访问，并可以应用于\
  \ C# 中的多种类型，包括类、方法、成员、属性和字段。C# 支持以下访问修饰符：\n\n- `public` - 访问没有限制。\n- `protected`\
  \ - 仅可以在包含类或该类的派生类内部访问。\n- `private` - 仅可以在包含类内部访问。\n- `file` - 仅在包含的源文件中可用。\n-\
  \ `internal` - 仅允许类所在的程序集（通常是构成编译后可执行文件或库的代码）内的代码访问。\n- `protected internal` - 允许当前程序集内或包含类的派生类访问。\n\
  - `private protected` - 仅允许包含类或当前程序集内的派生类访问。\n\n## 13.6 创建 C# 类成员\n\n类成员、字段或属性本质上是嵌入在类中的变量和方法（方法的概念在本章稍后介绍）。成员可以是\
  \ `public`、`private` 或 `protected`。\n\n`public` 成员可以从对象外部访问，并在派自当前类的类中可见。`private`\
  \ 成员只能由类中包含的方法访问，派生类无法访问。`protected` 类仅对派生类可用。\n\n这是数据封装的关键。面向对象编程规范规定，数据应该封装在类中，并且仅通过类的方法（通常称为\
  \ `getters` 和 `setters`）进行访问和设置。\n\n在实现数据封装时，理解 C# 类声明中字段和属性的区别非常重要。\n\n## 13.7\
  \ 字段 vs 属性\n\n直接声明为变量的类成员称为 `field`。例如，在下面的类中，`firstname` 变量被声明为字段：\n\n```csharp\n\
  public class MyClass {\n    public string firstname = \"\"; // 这是一个字段\n}\n```\n\n\
  这被称为 `public field`。当这样声明时，类外部的代码可以直接访问并更改此变量。\n\n然而，面向对象编程指南建议字段通常应保护免受直接访问（称为\
  \ `private fields`）。在 C# 中，这通过声明一个 `property` 实现，该属性反过来提供了对底层字段的访问。\n\n属性具有一个名称并声明特殊的\
  \ `get` 和 `set` 方法（称为访问器方法），使用以下语法访问底层字段：\n\n```csharp\npublic string <property\
  \ name> {\n    get {\n        return <field name>;\n    }\n    set {\n        <field\
  \ name> = value;\n    }\n}\n```\n\n`get` 方法的代码返回赋值给字段的值。另一方面，`set` 方法接收一个名为 `value`\
  \ 的变量。\n\n声明访问器的更简洁的方法是使用 lambda 运算符 (`=>`) 来分配 get 和 set 表达式（Lambda 主题将在匿名方法、Lambda\
  \ 和本地函数章节中介绍）：\n\n```csharp\npublic string <property name> {\n    get => <field\
  \ name>;\n    set => <field name> = value;\n}\n```\n\n使用上述方法，我们可以这样简化 MyClass 示例：\n\
  \n```csharp\npublic class MyClass {\n    private string _firstname = \"\";\n   \
  \ public string FirstName {\n        get => _firstname;\n        set => _firstname\
  \ = value;\n    }\n}\n```\n\n是否将所有字段封装在属性中而不提供公共字段，取决于你遵循面向对象编程规范的程度。你在微软的 C# 参考文档中也能看到这两种示例。\n\
  \n## 13.8 为 BankAccount 类添加成员\n\n我们现在可以扩展 `BankAccount` 类，添加存储账户名称和的字段。根据数据封装的概念，我们将这些字段设为私有并使用属性提供访问：\n\
  \n```csharp\n.\nnamespace ObjectDemo;\n\npublic class BankAccount\n{\n    private\
  \ string _accountName = \"\";\n    private int _accountNumber = 0;\n\n    public\
  \ string AccountName {\n        get => _accountName;\n        set => _accountName\
  \ = value;\n    }\n\n    public int AccountNumber {\n        get => _accountNumber;\n\
  \        set => _accountNumber = value;\n    }\n}\n```\n\n## 13.9 静态、只读和常量数据成员\n\
  \n除了我们目前过的的数据成员类型外，C# 还支持几种额外的成员类型。\n\n\n\n\nC# 静态成员类型（也称为类属性）存储该类所有对象实例共有的数据值。例如，所有银行客户在储蓄账户上将获得相同的利率。因此，`interestRate`\
  \ 成员应声明为 `static`，因为它被该类的所有对象实例共享。静态成员使用 `static` 关键字进行声明。例如：\n\n```csharp\npublic\
  \ class BankAccount\n{\n    private static int interestRate;\n}\n```\n\n静态成员通过类来访问，而不是通过对象。例如，我们可以通过如下引用\
  \ `BankAccount` 类来更改所有对象实例的 `interestRate` 成员：\n\n```csharp\nBankAccount.interestRate\
  \ = 10;\n```\n\n对于不可修改的数据成员，C# 提供了 `const` 和 `readonly` 关键字。这两者都实现了相同的目标，即防止分配给数据成员的值在声明后被更改。`const`\
  \ 或 `readonly` 成员的值必须在创建时进行赋值：\n\n```csharp\npublic readonly int daysInWeek = 7;\n\
  ```\n\n### 13.10 从 C# 类实例化对象\n\n从类的“蓝图”创建对象被称为实例化。第一步是创建一个所需对象类型的对象变量。然后，使用 `new`\
  \ 关键字创建对象的实例并将其赋值给对象变量：\n\n```csharp\nBankAccount custAccount;\ncustAccount = new\
  \ BankAccount();\n```\n\n也可以在一个语句中声明对象变量并分配对象：\n\n```csharp\nBankAccount custAccount\
  \ = new BankAccount();\n```\n\n或者，由于我们已经声明 `custAccount` 的类型为 `BankAccount`，我们可以让编译器推断我们正在请求一个新的\
  \ `BankAccount` 实例，如下所示：\n\n```csharp\nBankAccount custAccount = new();\n```\n\n\
  编辑 `Program.cs` 文件并添加以下代码：\n\n```csharp\nusing ObjectDemo;\nBankAccount custAccount\
  \ = new();\n```\n\n在创建了 `BankAccount` 类实例后，下一步是学习如何访问类的成员。\n\n### 13.11 访问 C# 对象成员\n\
  \n现在我们已经知道如何编写类以及从类中实例化对象，我们需要知道如何访问它的成员。\n\n首先，你会记得我们将某些成员声明为 `public`，而另一些声明为\
  \ `private`。`public` 方法可以从对象外部完全访问。这是通过使用所谓的点符号法（dot notation）实现的。\n\n点符号法是一种机制，通过指定用点（.）分隔的对象和成员名称来访问对象成员。例如，要访问名为\
  \ `custAccount` 的对象的 `accountName` 成员，我们将使用 `custAccount.accountName` 来引用该成员。\n\n\
  修改 `Program.cs` 文件如下，使用点符号法访问 `BankAccount` 对象的公共成员属性：\n\n```csharp\nBankAccount\
  \ custAccount = new();\ncustAccount.AccountName = \"John Smith\";\ncustAccount.AccountNumber\
  \ = 53211;\nConsole.WriteLine($\"Customer Name is {custAccount.AccountName}\");\n\
  Console.WriteLine($\"Account Number = {custAccount.AccountNumber}\");\n```\n\n在创建\
  \ `BankAccount` 类实例后，上述代码通过我们对象的 `AccountName` 和 `AccountNumber` 属性为两个私有字段赋值。然后代码引用这些属性来显示客户姓名和账户号码值。\n\
  \n运行应用程序并检查输出是否如下：\n\n```\nCustomer Name is John Smith\nAccount Number = 53211\n\
  ```\n\n在上面的示例中，我们创建了 `custAccount` 对象，然后使用点符号法为实例分配了客户姓名和账户号码。当属性在对象创建后立即初始化时，代码可以简化如下，以便单次操作中完成对象实例化和属性初始化：\n\
  \n```csharp\nBankAccount custAccount = new()\n{\n    AccountName = \"John Smith\"\
  ,\n    AccountNumber = 53211\n};\n```\n\n### 13.12 为 C# 类添加方法\n\n类方法本质上是在类语文中可以被调用以执行特定任务的代码例程。\n\
  \n方法有两种形式：静态方法（也称为类方法）和实例方法。静态方法在类级别上操作，例如创建新的类实例。相反，实例方法仅在类的实例上操作（例如，对两个成员变量执行算术运算并返回结果）。\n\
  \n实例方法在它们所属类的左大括号和右括号之间声明，并使用标准的 C# 方法语法进行声明。\n\n静态方法的声明方式与实例方法相似，区别在于 `static`\
  \ 关键字位于声明之前。\n\n例如，编辑 `BankAccount` 类并添加一个显示客户姓名的方法如下：\n\n```csharp\npublic class\
  \ BankAccount\n{\n    private string _accountName = \"\";\n    private int _accountNumber\
  \ = 0;\n\n    ...\n\n    public void DisplayName()\n    {\n        Console.WriteLine($\"\
  Customer name is {AccountName}\");\n    }\n}\n```\n\n上面的方法是一个实例方法，因此 `static` 关键字不在它前面，并且可以如下所示调用：\n\
  \n```csharp\nBankAccount custAccount = new()\n{\n    AccountName = \"John Smith\"\
  ,\n    AccountNumber = 53211\n};\n\n...\n\ncustAccount.DisplayName();\nConsole.WriteLine($\"\
  Account Number = {custAccount.AccountNumber}\");\n```\n\n在设计 `BankAccount` 类时，调用类本身上的静态方法来识别类实例可以存储的最大允许余额可能会很有帮助。这将允许在不创建类实例的情况下识别\
  \ `BankAccount` 类是否适合存储新客户的详情。我们将此方法命名为 `GetMaxBalance()` 并对其如下实现：\n\n```csharp\n\
  public class BankAccount \n{\n    ...\n    public static double GetMaxBalance()\n\
  \    {\n        return(10000000.00);\n    }\n}\n```\n\n声明方法后，可以直接在类上调用，无需创建实例，如下：\n\
  \n```csharp\ndouble maxBalance = BankAccount.GetMaxBalance();\nConsole.WriteLine($\"\
  Maximum allowed balance = ${maxBalance}\");\nBankAccount custAccount = new()\n...\n\
  ```\n\n运行应用程序应该产生以下输出：\n\n```\nMaximum allowed balance = $10000000\nCustomer name\
  \ is John Smith\nAccount Number = 53211\n```\n\n现在我们已经查看了方法成员，下一个任务是查看两个特殊的类方法：构造函数和终结器。\n\
  \n### 13.13 C# 构造函数\n\n尽管名字听起来很大气，但 C# 类构造函数和终结器只不过是在对象被实例化和销毁时被调用的方法。构造函数特别适用于在创建时将初始化值传递给对象。假设我们想在初始化\
  \ `custAccount` 对象时初始化 `_accountName` 和 `_accountNumber` 成员。为了这样做，我们需要声明构造函数。\n\n\
  构造函数的声明方式与其他方法相同，例外是方法的名称必须与类名相同。例如，在我们的 `BankAccount` 类中如下如下构造函数：\n\n```csharp\n\
  public class BankAccount\n{\n    private string _accountName;\n    private int _accountNumber;\n\
  \n    // 构造函数\n    public BankAccount(string accountName, int accountNumber)\n \
  \   {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
  \    }\n\n    ...\n}\n```\n\n构造函数可以在创建实例时初始化这些成员：\n\n```csharp\nBankAccount custAccount\
  \ = new BankAccount(\"Fred Wilson\", 123456);\ncustAccount.DisplayName();\n```\n\
  \n上述类型的构造函数在除了为属性赋值值之外还需要执行任务时特别有用。例如，`BankAccount` 构造函数可能包含一些逻辑来捕捉空客户姓名字符串：\n\n\
  ```csharp\npublic BankAccount(string accountName, int accountNumber)\n{\n    if\
  \ (accountName == \"\")\n        _accountName = \"Anonymous\";\n    else\n     \
  \   _accountName = accountName;\n    _accountNumber = accountNumber;\n}\n```\n\n\
  \n\n\n```csharp\nprivate string _accountName;\nprivate int _accountNumber;\nprivate\
  \ bool _isActive = false;\n\n// Constructor\npublic BankAccount(string accountName,\
  \ int accountNumber)\n{\n    _accountName = accountName;\n    _accountNumber = accountNumber;\n\
  }\n\npublic BankAccount(string accountName, int accountNumber, bool isActive)\n\
  {\n    _accountName = accountName;\n    _accountNumber = accountNumber;\n    _isActive\
  \ = isActive;\n}\n\npublic bool IsActive {\n    get => _isActive;\n    set => _isActive\
  \ = value;\n}\n```\n\n通过这些更改，`BankAccount` 类的实例可以使用任何一个构造函数来创建：\n\n```csharp\nBankAccount\
  \ custAccount = new(\"John Smith\", 53211);\nBankAccount custAccount2 = new(\"John\
  \ Smith\", 53211, true);\n```\n\n### 13.14 C# 主构造函数\n\n当构造函数的唯一目的是是将提供的参数赋值给属性且没有额外的操作时，建议使用主构造函数。主构造函数通过在类名后放置参数并将它们赋值给私有变量来声明。例如：\n\
  \n```csharp\npublic class BankAccount (string accountName, int accountNumber)\n\
  {\n    private string _accountName = accountName ;\n    private int _accountNumber\
  \ = accountNumber ;\n\n    // Constructor\n    public BankAccount(string accountName,\
  \ int accountNumber)\n    {\n        _accountName = accountName;\n        _accountNumber\
  \ = accountNumber;\n    }\n}\n```\n\n### 13.15 C# 终结器\n\n终结器用于在对象被销毁时清理类对象使用的任何资源。与可以使用代码通过\
  \ `new` 关键字触发的构造函数不同，没有方法可以显式调用终结器（例如，没有等于 `new` 关键字的 `delete`）。相反，当运行时判断对象实例不再需要时，将调用终结器。程序员唯一确定的是，终结器将在代码不再需要该对象到应用程序终止之间的某个时间被调用。\n\
  \n终结器的定义方式与构造函数相同，不同之处它们不能是公共的，并且名称前有一个波浪号字符（`~`）：\n\n```csharp\n// Finalizer\n\
  ~BankAccount() {\n    // 执行清理工作的代码\n}\n```\n\n### 13.16 “this” 关键字\n\n在 C# 中构造类时，你可能会遇到方法局部属性或分配给方法参数的名称与类属性冲突的情况。这在类声明中使用公共字段时特别常见。\n\
  \n以以下示例类为例，其中初始化器的参数名称与公共字段名称匹配：\n\n```csharp\nclass DemoClass\n{\n    public string\
  \ name;\n    public int age;\n    public DemoClass(string name, int age)\n    {\n\
  \        name = name;\n        age = age;\n    }\n}\n```\n\n以下代码创建了一个 `DemoClass`\
  \ 实例并用 `name` 和 `age` 值对其进行初始化：\n\n```csharp\nDemoClass demo = new(\"Mark\", 37);\n\
  Console.WriteLine($\"{demo.name} is {demo.age} is years old.\");\n```\n\n当上述代码运行时，将没有\
  \ `name` 的值，且 `age` 将为 0，尽管在创建类实例时 `age` 被设置为 37。此外，编译器将发出如下所示的警告：\n\n`warning CS1717:\
  \ Assignment made to same variable; did you mean to assign something else?`\n\n\
  这里的问题在于，编译器不知道在下面的初始化代码中引用了哪个 `name` 和 `age` 变量：\n\n```csharp\npublic DemoClass(string\
  \ name, int age) {\n    name = name;\n    age = age;\n}\n```\n\n为了解决这个问题，我们需要一种方法告诉编译器方法参数值要赋值给对应的公共字段值。我们可以使用\
  \ `this` 关键字来实现。在此上下文中，`this` 关键字代表当前类实例。为了区分冲突的 `name` 和 `age` 变量，我们需要如下使用 `this`\
  \ 关键字：\n\n```csharp\npublic DemoClass(string name, int age) {\n    this. name =\
  \ name;\n    this. age = age;\n}\n```\n\n现在我们不仅不再看到编译器的警告信息，还能看到 Mark 的名字和正确的年龄。\n\
  \n### 13.17 知识测试\n\n点击下方链接或扫描二维码以测试你对 C# 面对象编程的知识和理解：\n\n[`www.answertopia.com/cnbw`](https://www.answertopia.com/cnbw)\n\
  \n![img](img/c_-oop.png)\n\n### 13.18 总结\n\n像 C# 这样的面向对象的语言促进类的创建以鼓励代码复用和数据封装。在本章中，我们涵盖了\
  \ C# 类和实例的基础概念，并解释了类成员、构造函数、终结器、属性、字段和方法等概念。\n\n# 14. C# 方法\n\n上一章开始介绍 C# 中的面向对象编程，并包含了在类内部声明的方法的使用。本章将更详细地探索\
  \ C# 方法，包括它们如何声明和调用、传递参数以及返回结果。还将解释按引用传递和按值传递参数的主题。\n\nC# 方法对于编写结构良好且高效的代码至关重要。它们提供了一种组织程序的方法，同时避免了代码重复。在本章，我们将研究在\
  \ C# 中如何声明和使用方法。\n\n### 14.1 什么是方法？\n\n方法是一个命名的代码块，可以被调用以执行特定任务。它可以接收用于执行任务的数据，并将结果返回给调用它的代码。例如，如果\
  \ C# 程序中需要执行某个特定的算术计算，可以将执行该算术计算的代码放在方法中。该方法可以设计为接受执行算术计算的值（称为参数）并返回结果。\n\n### 14.2\
  \ 方法与函数\n\n如果你熟悉其他编程语言，你可能听过或使用过函数。通常，函数的声明方式与方法相同，并实现相同的功能。区别在于方法必须在类内部声明，而函数在类外部声明。在\
  \ C# 中，只能在类内部声明方法，函数的概念不存在。\n\n### 14.3 参数还是实参？\n\n在讨论方法时，参数（parameter）和实参（argument）这两个术语经常通用。然而，它们存在细微的区别。方法在被调用时可以接收的值是参数。当方法被调用并传递这些值时，它们被称为实参。\n\
  \n### 14.4 如何声明 C# 函数\n\nC# 函数使用以下语法声明：\n\n```csharp\n<access> <return type> <method\
  \ name>(<para type> <para name>, ...){\n    // 方法代码\n}\n```\n\n函数声明各个字段的解释如下：\n\n\
  - `<access>`：定义了从代码其他部分对该的访问级别。有效值为上一章中解释过的 `public`、`private` 或 `protected`。\n\
  - `<return type>`：函数返回的结果的数据类型。如果函数不返回结果，则设置为 `void`。\n- `<method name>`：分配给方法的名称。这是在应用程序代码内部调用方法时引用该方法的名称。\n\
  - `<para type>`：对应参数的类型。\n- `<para name>`：在方法代码中引用参数的名称。\n- `Method code`：执行工作的方法语句。\n\
  \n例如，下面的方法没有参数，不返回结果，并显示一条消息：\n\n```csharp\npublic void sayHello() {\n    Console.WriteLine(\"\
  Hello\");\n}\n```\n\n另一方面，下面的示例函数接受一个 `int` 和一个 `string` 作为参数，并返回一个 `string` 结果：\n\
  \n```csharp\npublic string BuildMessage(string name, int count) {\n    return($\"\
  {name}, you are customer number {count}\");\n}\n```\n\n### 14.5 创建 MethodDemo 项目\n\
  \n\n\n\n\n启动 VS Code，打开你的 “C# Essentials”工作空间文件夹并创建一个名为 `MethodDemo` 的新 .NET 控制台应用程序。\n\
  \n## 14.6 声明 C# 类文件\n\n遵循 C# 面向对象编程简介 章节中的步骤，使用解决方案管理器（Solutions Explorer）向 `MethodDemo`\
  \ 项目中添加一个名为 `Demo` 的新类文件。添加类文件后，对其进行如下修改以添加一个方法：\n\n```csharp\nusing System;\n\n\
  namespace MethodDemo;\n\npublic class Demo\n{\n    public void SayHello()\n    {\n\
  \        Console.WriteLine(\"Hello\");\n    }\n}\n```\n\n## 14.7 调用 C# 方法\n\n一旦声明，C#\
  \ 方法就可以使用点符号法（dot notation）在类实例上调用，语法如下：\n\n`<instance>.<function name>(<arg1>,\
  \ <arg2>, ... )`\n\n传递给方法的每个参数必须与该方法配置为接受的参数匹配。例如，要调用上述名为 `SayHello()` 的示例方法（该方法没有参数也没有返回值），我们需要对\
  \ `Program.cs` 文件进行如下修改：\n\n```csharp\nusing MethodDemo;\n\nDemo demo = new();\n\
  \ndemo.SayHello();\n```\n\n当应用程序运行时，“Hello”消息将显示在终端中。\n\n## 14.8 处理返回值\n\n`SayHello()`\
  \ 方法的定义包含了 `void` 关键字，表示它不返回结果值。接下来，在 `Demo` 类中添加一个名为 `BuildMessage()` 的方法，该方法接受两个参数并返回一个字符串结果，如下：\n\
  \n```csharp\npublic class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
  Hello\");\n    }\n\n    public string BuildMessage(string name, int count)\n   \
  \ {\n        return ($\"Hello {name}, you are visitor number {count}.\");\n    }\n\
  }\n```\n\n在上述代码中，我们如下所示对返回值包裹了括号：\n\n`return ($\"Hello {name}, you are visitor number\
  \ { count}\");`\n\n这些括号是可选的，因此以下也是 `return` 语句的有效用法：\n\n`return $\"Hello {name},\
  \ you are visitor number {count}.\";`\n\n返回 `Program.cs` 文件并添加代码来调用新方法：\n\n```csharp\n\
  Demo demo = new();\n\nstring message = demo.BuildMessage(\"Bill\", 10);\n\nConsole.WriteLine(message);\n\
  ```\n\n在上面的示例中，我们创建了一个名为 `message` 的新变量，并使用赋值运算符（`=`）在将结果写入控制台之前存储方法的结果。当应用程序运行时，终端中应该出现以下输出：\n\
  \n`Hello Bill, you are visitor number 10\\.`\n\n## 14.9 向方法传递参数\n\n在调用期望参数的方法时，有多种选项可用。其中一个选项（如上所示）是按照参数在方法声明中声明的顺序传递参数：\n\
  \n`string message = demo.BuildMessage(\"Bill Gates\", 10);`\n\n以这种方式调用方法时，参数必须按照参数在方法中声明的顺序进行传递。使用这种技术向方法传递参数也可能难以理解每个参数的用途。这两个问题都可以使用命名参数（named\
  \ arguments）来解决。\n\n### 14.9.1 命名参数\n\n使用命名参数涉及在调用时引用在方法声明中分配的参数名。例如：\n\n`demo.BuildMessage(name:\
  \ \"Steve\", count: 30);`\n\n由于在使用命名参数时顺序并不重要，因此以下也是一个有效的调用：\n\n`demo.BuildMessage(count:\
  \ 30, name: \"Steve\");`\n\n对 `Program.cs` 文件进行以下更改以查看命名参数的作用：\n\n```csharp\nDemo\
  \ demo = new();\n\nstring message = demo.BuildMessage(name: \"Bill\", count: 10);\n\
  \nConsole.WriteLine(message);\n\nmessage = demo.BuildMessage(count: 30, name: \"\
  Steve\");\n\nConsole.WriteLine(message);\n```\n\n如上面的代码所示，在调用方法时参数的顺序不再重要。同时，理解传递给方法的每个参数的用途也变得更加容易。\n\
  \n### 14.9.2 可选参数\n\n通过指定一个默认参数值，可以使 C# 参数变为可选的，如果在调用方法时未提供参数值，则将使用该值。这涉及到在声明方法时为参数分配默认值。在使用可选参数时，唯一的要求是在方法声明中将可选参数放在任何强制性参数之后。\n\
  \n对 `BuildMessage()` 方法进行如下修改，以便在调用方法时未提供客户名称时，使用字符串“Customer”作为默认：\n\n```csharp\n\
  public class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
  Hello\");\n    }\n\n    public string BuildMessage( int count, string name = \"\
  Customer\" )\n    {\n        return $\"Hello {name}, you are visitor number {count}.\"\
  ;\n    }\n}\n```\n\n对方法进行修改后，尝试在传递名称参数的情况下调用它：\n\n```csharp\nDemo demo = new();\n\
  \nstring message = demo.BuildMessage( count: 10 );\n\nConsole.WriteLine(message);\n\
  ```\n\n当应用程序运行时，将出现以下输出，其中“Customer”替换了名称：\n\n`Hello Customer, you are visitor number\
  \ 10\\.`\n\n## 14.10 处理可数量的参数\n\n到为止，我们查看了接受固定数量参数的方法。C# 还提供了一种方法让方法接受可数量的参数。这涉及到使用\
  \ `params` 关键字将参数分组在单个对象中，这在 C# List 章节中有所讨论。假设我们需要一个接受未指定数量字符串的方法。使用 `params` 关键字，我们可以如下声明方法：\n\
  \n```csharp\npublic void GreetGuests( params List<string> guests)\n{\n    foreach\
  \ (var guest in guests) {\n        Console.WriteLine($\"Welcome, {guest}\");\n \
  \   }\n}\n```\n\n当我们调用 `GreetGuests()` 方法时，可以传递包含任何数量名称的 `List` 实例：\n\n```csharp\n\
  List<string> names = [\"John\", \"Paul\", \"George\"];\ndemo.GreetGuests(names);\n\
  \nnames = [\"Mark\", \"Robert\"];\ndemo.GreetGuests(names);\n```\n\n`params` 参数可以与其他方法参数结合，例如：\n\
  \n```csharp\npublic void GreetGuests( int groupId, params List<string> guests)\n\
  {\n    .\n}\n```\n\n方法只能接受一个 `params` 参数，它必须位于参数列表的末尾。\n\n## 14.11 C# in, out, 和\
  \ ref 修饰符\n\n当传递参数给方法时，它是按值传递的。假设代码包含一个名为 `myVar` 的 `int` 变量，并为其分配值 10。随后 `myVar`\
  \ 变量被传递给名为 `DoSomething()` 的方法。在这种情况下，传递的是值 10 的拷贝，与原始的 `myVar` 变量没有连接。因此，方法内部对值的更改不会反映在原始变量中。\n\
  \n向 `Demo` 类添加以下方法以演示这种效果：\n\n```csharp\npublic class Demo\n{\n    .\n    public\
  \ void DoSomething(int myVar) {\n        myVar = 10;\n    }\n}\n```\n\n接下来，对 `Program.cs`\
  \ 文件进行如下修改：\n\n```csharp\nint myVar = 20;\nDemo demo = new();\nConsole.WriteLine($\"\
  Before method call myVar = {myVar}\");\n\ndemo.DoSomething(myVar);\n\nConsole.WriteLine($\"\
  After method call myVar = {myVar}\");\n```\n\n上面的代码声明了一个变量并赋值 20。在调用方法之前，显示了 `myVar`\
  \ 的当前值。该变量作为参数传递给 `DoSomething()` 方法，在其中被赋值为 10。当 `DoSomething()` 方法返回时，再次输出分配给\
  \ `myVar` 变量的值。\n\n运行程序并验证分配给 `myVar` 变量的值未被 `DoSomething()` 方法更改：\n\n`Before method\
  \ call myVar = 20`\n`After method call myVar = 20`\n\n为了允许在方法内部更改分配给变量的值，我们需要按引用传递变量。\n\
  \n\n\n\n引用传递意味着我们传递的不是底层值，而是存储变量该值的内存位置的引用。在方法内部进行的任何更改都将应用到该变量的值。\n\n在方法中声明参数以及调用方法时，均使用\
  \ `ref` 修饰符通过引用传递变量，如下所示：\n\n```csharp\n// Demo.cs\npublic class Demo {\n    //\
  \ ...\n    public void DoSomething(ref int myVar) {\n        myVar = 10;\n    }\n\
  }\n```\n\n```csharp\n// Program.cs\nConsole.WriteLine($\"Before method call myVar\
  \ = {myVar}\");\ndemo.DoSomething(ref myVar);\nConsole.WriteLine($\"After method\
  \ call myVar = {myVar}\");\n```\n\n运行应用程序的输出显示，在方法调用后，赋值给 `myVar` 的值从 20 变为 10：\n\
  \nBefore method call myVar = 20\nAfter method call myVar = 10\n\n调用方法时的另一个可用修改符是\
  \ `out` 关键字。使用 `ref` 修饰符时，方法内部是否更改变量值是可选的。若要强制在方法内部更改变量，请使用 `out` 修饰符代替 `ref`。\n\
  \n`out` 修饰符通常用于在变量传递传递时为 null 时，强制方法初始化该变量。例如：\n\n```csharp\n// Demo.cs\n// ...\n\
  public void DoSomething(out string myVar) {\n    myVar = \"Hello\";\n}\n```\n\n\
  ```csharp\n// Program.cs\nstring myVar;\nDemo demo = new();\ndemo.DoSomething(out\
  \ myVar);\nConsole.WriteLine($\"After method call myVar = {myVar}\");\n```\n\n最后一个介绍的修饰符是\
  \ `in` 修饰符。该修饰符同样通过引用将变量发送到方法，但防止从方法内部更改该引用。例如，下面的代码更改将产生语法错误，因为 `myVar` 现在是一个只读变量：\n\
  \n```csharp\n// Demo.cs\n// ...\npublic void DoSomething(in string myVar) {\n  \
  \  myVar = \"Hello\"; // Syntax error - readonly variable\n}\n```\n\n```csharp\n\
  // Program.cs\n// ...\ndemo.DoSomething(in myVar);\n// ...\n```\n\n### 14.12 知识测试\n\
  点击下方链接或扫描二维码以测试你对 C# 方法的知识和理解：\n[`www.answertopia.com/r67i`](https://www.answertopia.com/r67i)\n\
  \n![img](img/c_-methods.png)\n\n### 14.13 总结\nC# 方法是执行特定任务的自包含代码单元。它们有助于构建代码并促进代码重用。本章讨论了\
  \ C# 方法并解释了如何创建和调用它们。我们还描述了如何向方法添加参数，并区分了命名参数和可选参数。最后，我们学习了何时使用 `in`、`out` 和 `ref`\
  \ 参数修饰符，以及按值和引用传递参数到方法的区别。\n\n# 15. C# 委托 (Delegates)\n本章将通过引入 C# 委托的概念（包括它们是什么以及如何使用），继续探索\
  \ C# 方法。\n\n### 15.1 什么是委托？\n在开始探索 C# 委托之前，理解方法签名（method signatures）的概念会有帮助。当方法被声明时，它接受的参数和返回的结果类型共同构成了方法的签名。以下方法的签名表示它接受一个字符串值作为参数并返回一个整数：\n\
  \n```csharp\npublic int GetLength(string value) {\n    // ...\n}\n```\n\n以下方法执行的是完全不同的任务，但具有与上述\
  \ `GetLength()` 方法完全相同的签名：\n\n```csharp\npublic int CustomerCount(string customer)\
  \ {\n    // ...\n}\n```\n\nC# 委托是一种存储方法引用的变量。如果你熟悉 C 或 C++ 编程，委托类似于函数指针。一旦声明，委托可以更改指向任何匹配该委托方法签名的方法。\n\
  \n### 15.2 声明委托\n委托使用 `delegate` 关键字和以下语法进行声明：\n`delegate <returntype> <delegatename>\
  \ (<parameters>);`\n\n要声明一个与我们的两个示例方法匹配的委托（一个字符串参数和一个整数返回类型），我们应该编写以下代码：\n\n```csharp\n\
  public delegate string MyDelegate (string s);\n```\n\n### 15.3 使用委托\n声明委托后，我们就可以使用它来存储方法的引用。委托实例使用\
  \ `new` 关键字创建，并传递要引用的方法，例如：\n\n```csharp\npublic delegate string MyDelegate (string\
  \ s);\n\nMyDelegate delegate1 = new MyDelegate(GetLength);\nMyDelegate delegate2\
  \ = new MyDelegate(CustomerCount);\n```\n\n在上述代码中，我们创建了两个委托实例，每个指向我们的示例方法之一。一旦声明，就可以像其他其他方法一样调用它们：\n\
  \n```csharp\nvar strlen = delegate1(\"This is some text\");\nvar count = delegate2(\"\
  Robert Addison\");\n```\n\n### 15.4 创建 DelegateDemo 项目\n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为\
  \ `DelegateDemo` 的新 .NET 控制台项目。\n\n### 15.5 C# 委托示例\n在这个示例中，我们将创建一个名为 `StringConverter`\
