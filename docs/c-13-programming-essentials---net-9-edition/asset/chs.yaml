  \ name: John Smith\nHi John Smith, Welcome to C#!\n## 6.4 顶层语句与 Main 方法\n\n对于熟悉其他编程语言的人来说，上面的示例可能会困惑，因为我们可以在没有任何结构或“指令”的情况下编写并执行代码。像\
  \ C# 这样的语言通常需要额外信息，例如类名和导入依赖的指令。例如，我们的 `Program.cs` 文件调用属于 `Console` 类的方法。另一个常见要求是指定执行的起点。许多编程语言都有特殊的\
  \ main 函数或方法来包含这些初始代码。既然其他语言有这些要求，为什么 C# 没有呢？\n\n答案是 C# 确实有这些要求，但 VS Code 在后台自动为我们生成了所谓的顶层语句（top-level\
  \ statements）。这就是 `Program.cs` 文件中新控制台模板注释所指的。尽管我们的应用中只有四行代码，但实际编译的代码将类似于：\n```csharp\n\
  using System;\n\nnamespace SampleApp\n{\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Console.Write(\"Please enter your name: \");\n\n\
  \            var username = Console.ReadLine();\n\n            Console.WriteLine($\"\
  Hi {username}. Welcome to C#!\");\n        }\n}\n```\n\n上述代码中的 `using` 指令告诉编译器导入\
  \ `System` 命名空间，因为文件中的代码依赖于它。接下来，`internal class` 被封装在一个名为 `SampleApp` 的命名空间声明中。C#\
  \ 代码包含类、变量和方法，所有它们都分配了名称。命名空间允许对应用程序代码进行组织，使一个工作区的名称不会与其他工作区的相同名称冲突。在命名空间之外声明的任何内容都是全局命名空间的一部分。\n\
  \n\n\n你只需通过在 `/Program.cs` 文件中声明上述代码，即可覆盖默认的新控制台模板行为。使用哪种方法取决于个人偏好，但在某些情况下，可能需要手动声明顶层语句。因此，理解背后的运行机制至关重要。\n\
