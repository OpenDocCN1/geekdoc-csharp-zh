  \n\n`C#` 是为了让计算机编程对人类来说尽可能简单高效的这一永无止境追求的一部分。虽然将 `C#` 描述为另一种面向对象的编程语言很容易，但事实是，`C#`\
  \ 是整个开发和执行基础设施不可或缺的一部分。这些初始章节的主要目标是概述 `C#` 语言及其所依赖的基础设施。\n\n\n编程的问题在于，计算机完全用数字（准确来说是\
  \ 0 和 1）思考，这被称为机器码，而人类使用单词进行交流。在早期，程序员直接将机器码输入计算机进行编程。正如你所想象的，这是一个耗时且容易出错的过程。下一次演进是将简短的人类可读命令与相应的机器码相关联。例如，程序员可以输入\
  \ `MOV` 命令将值从一个微处理器寄存器转移到另一个。这些命令随后由一个名为`汇编器` (`assembler`) 的软件翻译成机器码，从而赋予这种命令语法“汇编语言”的名字。\n\
  \n接下来是一系列高级语言，旨在让人类更容易编写程序。这些程序使用人类可读的语法编写，然后由`编译器` (`compiler`) 编译为机器码，或者代表处理器由`解释器`\
  \ (`interpreter`) 解析。此类语言包括 `BASIC`、`COBOL`、`Pascal` 和 `Fortran`。另一种语言是 `C`，它于 20\
  \ 世纪 60 年代末和 70 年代初在 `AT&T Bell 实验室` 创建。随后，在 20 世纪 70 年代末和 80 年代初，开始研究 `C` 语言的面向对象方法，并催生了一种新的、面向对象的\
  \ `C` 变体，被称为 `C++`。\n\n然而，故事仍在继续。`C++` 的问题在于太容易犯编程错误。例如，`C++` 会非常乐意地允许程序员编写代码错误，导致缓冲区溢出、内存位置被任意覆盖，并引入内存泄漏，导致应用程序膨胀到耗尽系统上的整个物理内存和交换空间。在使用\
  \ `C`、`C++` 以及所有其他编译语言时遇到的另一个问题是，源代码必须为每种处理器类型重新编译，这使得应用程序从一个硬件平台迁移到另一个平台变得困难。\n\
  \n\n\n\n\nJava 迅速获得了认可，在一段时间内，微软开始了其 Java “拥抱并扩展”活动。Sun 公司乐于微软拥抱 Java，但当他们意识到“扩展”部分是微软引入其自己的专有语言版本的计划时，他们出动了律师。随后引发了政治斗争，微软最终放弃了\
  \ Java。不久后，微软开始讨论一种被称为 `.NET` 的东西，随后是门名为 `C#` 的编程语言。\n\n\n我听见你们在问：“这些历史与 C# 有什么关系？”。`C#`\
  \ 编程语法的起源可以追溯到 `C` 和 `C++`。如果你已经熟悉 `C` 或 `C++`（事实上，甚至是 `Kotlin` 或 `Swift`），那么在学习\
  \ `C#` 时就具有了巨大的优势。`Java`、`C`、`C++` 和 `C#` 语法之间的相似性也是如此。此外，`C#` 还继承了 `Java` 在内存处理（更广为人知的垃圾回收）和中间字节码方面的许多优势，后者消除了为每个目标硬件平台重新编译应用程序的需求。`C#`\
  \ 还伴随着庞大的库框架，旨在为程序员提供几乎可以想象的所有场景的现成解决方案。\n\n尽管有这些相似之处，`Java` 和 `C#` 的基础设施之间仍然存在差异。因此，下一章将提供\
  \ `C#` 基础设施的概述。\n\n\n尽管自 `C#` 推出以来已经发布了一些新的编程语言（如 `Swift` 和 `Kotlin`），但 `C#` 作为一种语言仍在不断进化，并拥有庞大且不断增长的用户群。\n\
  \n\n`C#` 用于开发桌面、移动和服务器应用程序，以及基于 Web 的应用程序和服务。它是所有微软平台上的首选编程语言，并用于 `Unity` 实时开发平台中的编程。\n\
  \n\n点击下方的链接或扫描二维码以测试你对 `C#` 历史的认知和理解：\n\n[`www.answertopia.com/qoe2`](https://www.answertopia.com/qoe2)\n\
  \n![img](img/c_-history.png)\n\n\n`C#` 是由微软创建的一种编程语言，结合了其他流行语言（如 `C`、`C++` 和 `Java`）的元素。它的设计旨在通过内存管理以减少错误以及跨平台兼容的中间字节码等特性，使编程更简单、更高效。`C#`\
  \ 用于桌面、移动、服务器、Web 和游戏开发，是全球前十大最常用的编程语言之一。\n\n\n本章将介绍构建 `C#` 语言的基础设施。在本章结束时，你将清晰地理解\
  \ `CLI`、`CLR`、`VES`、`JIT` 和 `.NET` 等缩字的含义。\n\n\n`C#` 是一种面向对象的编程语言。它本质上是一个定义什么是有效语法的标准。`C#`\
  \ 本身作用不大，因为它依赖于通用语言基础设施 (`CLI`) 来编译和执行应用程序。`CLI` 反而是一个定义了以下组件规范的标准：\n\n- 虚拟执行系统\
  \ (`VES`)\n- 通用中间语言 (`CIL`)\n- 通用类型系统 (`CTS`)\n- 通用语言规范 (`CLS`)\n- 框架\n\n在本章的剩余部分中，我们将检查每个\
  \ `CLI` 组件，以理解 `CLI` 环境是如何结合的。\n\n\n与 `C` 和 `C++` 编译器不同（它们将源代码编译为目标微处理器可以理解的机器码），`C#`\
  \ 编译器将代码编译为一种名为通用中间语言 (`CIL`) 的中间字节码格式。这种代码可以在任何具有符合 `CLI` 标准的虚拟执行系统 (`VES`) 的系统上运行。因此，无需为每个目标平台编译应用程序。\n\
  \n通用中间语言中的“通用（Common）”一词，是因为这种格式不仅适用于 `C#` 编程语言。事实上，任何编程语言都可以目标为 `CIL`，允许来自不同语言的库和代码模块在同一个应用程序中共同执行。提供\
  \ `CIL` 编译的典型语言包括 `Visual Basic`、`COBOL`、`PowerShell`、`Python` 和 `C++`。\n\n\n`VES`（称为运行时）是执行\
  \ `CIL` 字节码的环境。`VES` 读取由 `C#` 编译器生成的字节码，并使用即时 (`JIT`) 编译器将字节码编译为运行其上的处理器的原生机器码。在执行期间，这些代码会与运行时代理协作工作，由该代理管理执行过程。结果，这些执行代码被称为托管代码（managed\
  \ code），该过程处理诸如垃圾回收（处理内存分配和释放）、内存访问和类型安全等问题，以确保代码不会执行任何不该执行的事情。\n\n通常与 `VES` 结合使用的术语是通用语言运行时\
  \ (`CLR`)。`CLR` 是微软对 `VES` 组件实现的官方名称。\n\n\n\n通用语言体系 (`CLI`) 为执行 C# 代码提供了一个标准化的环境。它包含了通用中间语言\
  \ (`CIL`)、虚拟执行系统 (`VES`)、通用类型系统 (`CTS`) 以及通用语言规范 (`CLS`)。`CLI` 能够实现不同编程语言之间的互操作性，并为执行\
  \ `CIL` 代码提供了基础类库。\n\n此外，.NET Framework 类库提供了大量预定义的函数和类，用于创建多样化的应用程序，并包含了用于文件 I/O、网络、数据库访问和用户界面设计的\
  \ API。\n\n\n要开始使用 C# 编程，我们需要一个环境来编写、编辑、编译和运行代码。有许多选择，但对于本书来说，我们需要一个免费使用且对所有读者都提供的解决方案，无论他们是在\
  \ macOS、Windows 还是 Linux 系统上学习 C#。一个流行的工具，也是我们将在本章中安装的工具，是 Visual Studio Code。Visual\
  \ Studio Code 由微软开发，是一个功能丰富、直观的代码编辑环境，与 `C# Dev Kit` 扩展结合时，可以提供学习 C# 所需的一切内容。\n\n\
  ## 4.1 安装 .NET 9 SDK\n除了安装 Visual Studio Code 之外，在编译 C# 程序之前，还需要安装 .NET 9 SDK。虽然安装\
  \ .NET 有多种方法，但我们将使用一种独立于 Visual Studio Code 下载并安装 SDK 的技术。\n\n.NET 9 SDK 的安装步骤取决于你所使用的操作系统，下文所示。\n\
  \n\n.NET 9 SDK 适用于运行 x86、x64 和 Arm64 处理器架构的 Windows 系统。使用以下链接下载与你的系统匹配的最新 .NET 9\
  \ `Installer` 包：\n\n[`dotnet.microsoft.com/en-us/download/dotnet/9.0`](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)\n\
  \n\n![img](img/dotnet_installer_windows.png)\n\n图 4-1\n\n\nmacOS 版本的 .NET 9 SDK\
  \ 适用于 Intel 和 Apple Silicon 系统。要开始安装，请打开浏览器窗口，导航到以下 URL，并下载与你的处理器架构匹配的 `Installer`：\n\
  \n[`dotnet.microsoft.com/en-us/download/dotnet/9.0`](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)\n\
  \n下载安装程序包后，启动它并按照步骤完成安装：\n\n\n图 4-2\n\n### 4.1.3 在基于 Red Hat Linux 的发行版上安装 .NET\
  \ 9\n\n\n```bash\nsudo dnf install dotnet-sdk-9.0\n```\n\n如果安装请求报告没有 `dotnet-sdk-9.0`\
  \ 的匹配项，请跳到下方的“从 Linux 二进制文件安装 .Net 9”部分进行安装。否则，按 ‘y’ 完成安装。\n\n\nDebian 和 Ubuntu\
  \ 系统的安装步骤再次取决于 .NET 9 SDK 的发布状态。首先在 `Terminal` 窗口中运行以下常用命令：\n\n```bash\nsudo apt-get\
  \ install dotnet-sdk-9.0\n```\n\n如果安装请求报告找不到 `dotnet-sdk-9.0` 包，请跳到下一节进行安装。否则，按\
  \ ‘y’ 完成安装。\n### 4.1.5 从 Linux 二进制文件安装 .Net 9\n\n如果 .NET 9 尚未正式发布，则需要使用发行候选 SDK\
  \ 二进制文件进行安装。返回 .NET 9 下载页面，找到并下载如图 4-3 所示与你 CPU 匹配的二进制文件：\n\n![img](img/dotnet_linux_binaries.png)\n\
  \n\n在 `Terminal` 窗口中，创建一个你想要安装 .NET 9 的目录。接下来，运行以下命令（假设你选择了 `$HOME/dotnet9` 作为你的安装目录）：\n\
  \n```bash\ncd $HOME/dotnet9\ntar xvfz <path to downloaded binary archive>\n```\n\
  \n解压 .NET 包后，修改你的 `$HOME/.bashrc` 文件以导出 `DOTNET_ROOT` 环境变量并将 .NET 9 SDK 添加到你的路径中：\n\
  \nexport DOTNET_ROOT=$HOME/dotnet9\nexport PATH=$PATH:$HOME/dotnet9\n```\n\n打开一个新的\
  \ `Terminal` 窗口并运行以下命令验证安装情况：\n```bash\ndotnet --version\n9.0.100-rc.1.24452.12\n\
  ```\n\n\n安装 Visual Studio Code 的第一步是下载它。Windows、macOS 和 Linux 的下载可以通过以下网页获取：\n\n\
  [`code.visualstudio.com/download`](https://code.visualstudio.com/download)\n\n\n\
  Windows 版 Visual Studio Code 适用于 Arm 和 Intel 系统。下载安装程序后，启动它并按照设置向导完成安装。除非你有特殊需求，否则可以使用默认设置。\n\
  \n\nmacOS 版 Visual Studio Code 适用于 Apple Silicon 和 Intel 系统，以 ZIP 存档的形式提供。下载文件后，双击解压\
  \ Code 包，然后打开 `Finder` 窗口将其拖入 `Applications` 文件夹。为了方便，可以将 Visual Studio Code 如下图\
  \ 4-4](#Installing_Visual_Code.xhtml__idTextAnchor041) 所示添加到 Dock：\n\n![img](img/vs_code_add_dock.png)\n\
  \n\n## 4.5 在 Linux 上安装\n\nVS Code 安装包适用于多种 Linux 发行版，包括 Debian、Ubuntu、SUSE 以及大多数基于\
  \ Red Hat 的平台，支持 x64、Arm32 和 Arm64 处理器架构。\n\n\n\nDebian 和 Ubuntu 版 Code 以 `.deb`\
  \ 包的形式提供。要完成安装，打开 `Terminal` 窗口，进入下载包所在的目录，并运行以下命令（其中 `<filename>.deb` 为包名）：\n\n\
  ```bash\nsudo dpkg -i <filename>.deb\n```\n\n\nVS Code 在包括 RHEL、CentOS、Fedora、AlmaLinux\
  \ 和 Rocky Linux 在 Red Hat 系系统中使用 Red Hat 包管理器 (`.rpm`) 文件。要安装 VS Code，打开终端窗口，进入下载包所在的目录，并运行以下命令（其中\
  \ `<filename>.rpm` 为包名）：\n\n```bash\nsudo rpm -ihv <filename>.rpm\n```\n\n安装完成后，可以通过桌面环境搜索应用程序，或者通过命令行运行\
  \ `code` 可执行文件来启动 Visual Studio Code。\n\n\n\n\n\n\n\n![img](img/vs_code_c__dev_kit.png)\n\
