- "# C# 13 编程必备 - .NET 9 版\n\n\n\n![](img/c__13_front_cover_large.png)\n\n\n\n\n\n\
  \n\n\n\n\n本书是掌握 `C# 13` 编程语言和 `.NET 9` SDK 的全面指南，为初学者和经验丰富的开发者都提供了详尽的学习体验。本书包含 31\
  \ 个详细章节、30 份在线知识测试以及可下载的项目代码，其结构旨在支持你完成从基础概念到高级编程技术的旅程，且所有内容均在 `Visual Studio Code`\
  \ 环境下进行。\n\n我们将首先介绍 `C#` 生态系统的基础组件，概述通用语言基础设施 (`CLI`)、通用中间语言 (`CIL`) 和虚拟执行系统 (`VES`)。这些初始章节将帮助你对该平台架构有更深入的理解。之后，我们将提供安装和使用\
  \ `Visual Studio Code` 环境的逐步说明。\n\n随着学习的深入，你将学习 `C#` 语言的基础原理。这包括探索变量、常量、运算符、流程控制和循环等主题。这些基础概念将扩展到涵盖面向对象编程\
  \ (`OOP`)，并重点介绍继承、抽象类、接口和结构体。\n\n除了基础知识外，本书还将进入更专业的领域，包括字符串处理、数组与集合的操作、异常处理以及异步编程技巧的实现。这些章节旨在深化你的理解，并使你具备构建更复杂应用程序所需的技能。\n\
  \n无论你是编程新手，还是寻求精进自己的技能，`C# 13 Programming Essentials - .NET 9 Edition` 都能提供你在 `C#`\
  \ 开发中成功所需的知识和实践指导。\n\n\n书中包含示例的源代码和 `Visual Studio Code` 项目文件可以通过以下链接下载：\n\n[`www.payloadbooks.com/product/csharp13/`](https://www.payloadbooks.com/product/csharp13/)\n\
