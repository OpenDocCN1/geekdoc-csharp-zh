  \n\n通过 `Ctrl-Shift-P`（macOS 上为 `Cmd-Shift-P`）在 VS Code 任何处显示命令面板。\n\n\n编辑多个文件时，并排查看文件通常很有帮助。要将文件拆分为单独的编辑器面板，右键点击文件标签并选择上、下、左或右\
  \ `Split`（分屏）选项，如下所示：\n\n![img](img/vs_code_split.png)\n\n图 5-3\n\n\n编辑大型源文件时，同时查看和编辑文件的不同区域可能很有用。要这样做，右键点击文件标签并选择\
