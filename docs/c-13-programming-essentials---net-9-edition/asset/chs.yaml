  \ Visual Studio Code 配置 C# 开发环境，并探索了该工具的主要功能。在进入稍微高级的话题之前，现在是验证一切是否已安装并运行良好的好机。实现这一点的最佳方法是创建一个\
  \ C# 应用并编译、运行它。本章将介绍如何使用 VS Code 创建 C# 控制台应用程序项目。\n\n## 6.1 创建 SampleApp 项目\n\n\n\
