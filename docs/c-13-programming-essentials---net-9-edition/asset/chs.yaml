  \ `DateTime` 对象提供的用于操作日期时间的各种方法，例如增加或减去天、月、年和其他时间单位。最后，我们涵盖了如何使用 `DateTime` 属性提取日、月、年、小时和分钟等单独组件，这允许对日期和时间的特定元素进行操作。\n\
