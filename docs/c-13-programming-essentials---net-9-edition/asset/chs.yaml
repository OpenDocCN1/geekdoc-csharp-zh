  \n[content]\nC# 异步执行的基础是 `Task` 类和 `await` 算符。`await` 算符告诉系统挂起调用方法的执行，直到相应的异步操作完成并返回。\n\
  \n使用 `Task` 对象和 `await`，我们可以并行运行三个文件处理操作，并并在等待异步调用结果的同时允许 `Main()` 方法中的其他代码运行。\n\
  \n作为第一步，我们将演示为什么异步执行既需要 `Task` 对象也需要 `await` 操作符。不过，首先需要注意的一点是，异步方法通常只能在其他异步方法的作用范围内调用（尽管正如我们在本节稍后看到的，`Task`\
  \ 对象可以用于在同步和异步代码之间提供桥梁）。考虑到此，对以下更改以将 `Main()` 声明为异步方法：\n\n```csharp\nstatic async\
  \ Task Main(string[] args)\n{\n    Stopwatch stopwatch = Stopwatch.StartNew();\n\
  \    // ...\n}\n```\n\n接下来，修改异步调用以使用 `await` 算符，如下所示：\n\n```csharp\nstatic async\
  \ Task Main(string[] args)\n{\n    Stopwatch stopwatch = Stopwatch.StartNew();\n\
  \    Console.WriteLine(\"\\n=== Before async task calls ===\\n\");\n    string filename1\
  \ = await ProcessFileAsync(\"file1.txt\");\n    Console.WriteLine($\"End {filename1}\
  \ at {DateTime.Now}\\n\");\n    string filename2 = await ProcessFileAsync(\"file2.txt\"\
  );\n    Console.WriteLine($\"End {filename2} at {DateTime.Now}\\n\");\n    string\
  \ filename3 = await ProcessFileAsync(\"file3.txt\");\n    Console.WriteLine($\"\
  End {filename3} at {DateTime.Now}\");\n    Console.WriteLine(\"\\n=== After async\
  \ tasks calls ===\\n\");\n    stopwatch.Stop();\n    TimeSpan timeSpan = stopwatch.Elapsed;\n\
  \    Console.WriteLine($\"Elapsed time: {timeSpan.Seconds} seconds\\n\");\n}\n```\n\
  \n一旦修改完成，运行程序并检查控制台输出，输出类似于所示：\n\n```\n=== Before async task calls ===\nStart file1.txt\
  \ at 9/25/2024 9:53:46 AM\nEnd file1.txt at 9/25/2024 9:53:52 AM\nStart file2.txt\
  \ at 9/25/2024 9:53:52 AM\nEnd file2.txt at 9/25/2024 9:53:58 AM\nStart file3.txt\
  \ at 9/25/2024 9:53:58 AM\nEnd file3.txt at 9/25/2024 9:54:04 AM\n=== After async\
  \ tasks calls ===\nElapsed time: 18 seconds\n```\n\n尽管我们已经将文件处理方法改为异步，并使用了 `await`\
  \ 算符，但控制台输出显示任务仍然是顺序执行的。通过将 `await` 操作的结果直接赋值给 `string` 变量，我们实际上是让自己等待直到结果返回，从而强制代码进行同步执行。\n\
  \n为了解决这个问题，我们需要实现以下执行流：\n\n1. 应用程序启动。\n2. `Main()` 调用异步方法。\n3. 当异步任务在后台运行时时，`Main()`\
  \ 继续执行。\n4. 在完成其他工作后，`Main()` 在等待异步任务的结果时挂起。\n5. 异步任务完成并返回结果。\n6. `Main()` 恢复执行。\n\
  \n挑战在于获取异步任务的引用，以便稍后用于 await 结果。我们通过存储异步方法返回的 `Task` 对象并在稍后的代码中使用这些它们来 await 结果来实现这一点。要看到这一效果，请对\
  \ `Main()` 方法进行以下更改：\n\n```csharp\nstatic async Task Main(string[] args)\n{\n  \
  \  Stopwatch stopwatch = Stopwatch.StartNew();\n    Console.WriteLine(\"\\n=== Before\
  \ async task calls ===\\n\");\n    Task<string> task1 = ProcessFileAsync(\"file1.txt\"\
  );\n    Task<string> task2 = ProcessFileAsync(\"file2.txt\");\n    Task<string>\
  \ task3 = ProcessFileAsync(\"file3.txt\");\n    Console.WriteLine(\"=== After async\
  \ tasks calls ===\\n\");\n    string filename1 = await task1;\n    Console.WriteLine($\"\
  End {filename1} at {DateTime.Now}\");\n    string filename2 = await task2;\n   \
  \ Console.WriteLine($\"End {filename2} at {DateTime.Now}\");\n    string filename3\
  \ = await task3;\n    Console.WriteLine($\"End {filename3} at {DateTime.Now}\\n\"\
  );\n    stopwatch.Stop();\n    TimeSpan timeSpan = stopwatch.Elapsed;\n    Console.WriteLine($\"\
  Elapsed time: {timeSpan.Seconds} seconds\");\n}\n```\n\n重新运行程序并检查控制台输出：\n\n```\n\
  === Before async task calls ===\nStart file1.txt at 9/25/2024 9:53:46 AM\nEnd file1.txt\
  \ at 9/25/2024 9:53:52 AM\nStart file2.txt at 9/25/2024 9:53:52 AM\nEnd file2.txt\
  \ at 9/25/2024 9:53:58 AM\nStart file3.txt at 9/25/2024 9:53:58 AM\nEnd file3.txt\
  \ at 9/25/2024 9:54:04 AM\n=== After async tasks calls ===\nElapsed time: 18 seconds\n\
  ```\n\n### Asynchronous calls from synchronous functions\n\n如之前提到的，异步方法期望在异步上下文中调用。然而，通过调用\
  \ `Task.Run()` 方法可以在同步上下文中启动异步任务。假设我们有一个同步方法 `SyncMethod()`，我们需要从中调用异步方法并尝试如下操作：\n\
  \n```csharp\nprivate static void SyncMethod()\n{\n    await AsyncMethod();\n}\n\
  ```\n\n上述代码会在编辑器中产生以下错误提示：\n\n'await' 算符只能在异步方法中使用。考虑标记此方法为 'async' 修饰符并更改其返回类型为\
  \ 'Task'。\n\n我们唯一的选择是将 `SyncMethod()` 改为异步方法，或者使用 `Task.Run()` 方法启动任务。假设将 `SyncMethod()`\
  \ 声明为异步方法不可行，在这种情况下，代码需要更改如下：\n\n```csharp\nprivate static void SyncMethod()\n{\n\
  \    Task.Run(async () => {\n        await AsyncMethod();\n    });\n}\n```\n\n###\
  \ Canceling asynchronous tasks\n\n活跃的异步任务可以随时使用 `CancellationTokenSource` 类进行取消。`CancellationTokenSource`\
  \ 实例包含一个唯一的 `CancellationToken` 对象，用于向运行的任务发送取消请求。为 `AsyncDemo` 项目添加取消支持，首先对 `Main()`\
  \ 方法进行以下更改：\n\n```csharp\nstatic async Task Main(string[] args)\n{\n    var tokenSource\
  \ = new CancellationTokenSource();\n    var cancellationToken = tokenSource.Token;\n\
  \    // ...\n}\n```\n\n现在我们有了取消令牌，需要对 `ProcessFileAsync()` 方法进行一些更改，以便将其传递给执行 6\
  \ 秒延迟的任务：\n\n```csharp\nprivate static async Task<string> ProcessFileAsync(string\
  \ filename ,\n    CancellationToken cancellationToken )\n{\n    Console.WriteLine($\"\
  Start {filename} at {DateTime.Now}\");\n    await Task.Delay(6000 , cancellationToken\
  \ );\n    return filename;\n}\n```\n\n\n\n\n在我们添加用于发送取消请求的代码之前，需要一些额外的步骤。按照目前的写法，当任务被取消时，应用程序将会崩溃，控制台输出部分如下：\n\
  \n```\nUnhandled exception. System.AggregateException: One or more errors occurred.\
  \ (A task was canceled.)\n---> System.Threading.Tasks.TaskCanceledException: A task\
  \ was canceled.\nat System.Threading.Tasks.Task.GetExceptions(Boolean includeTaskCanceledExceptions)\n\
  ```\n\n这里的问题在于，当任务被取消时，会触发一个异常，如果应用程序没有正确处理该异常，就会导致崩溃。解决方案是配置令牌在任务取消时抛出 `OperationCanceledException`\
  \ 错误，然后使用 `try-catch` 语句来优雅地处理该异常：\n\n```csharp\nprivate static async Task<string>\
  \ ProcessFileAsync(string filename, CancellationToken cancellationToken)\n{\n  \
  \  Console.WriteLine($\"Start {filename} at {DateTime.Now}\");\n    try\n    {\n\
  \        cancellationToken.ThrowIfCancellationRequested();\n        await Task.Delay(6000,\
  \ cancellationToken);\n    }\n    catch (OperationCanceledException)\n    {\n  \
  \      Console.WriteLine($\"{filename} processing cancelled\");\n    }\n    return\
  \ filename;\n}\n```\n\n在上面的示例中，我们只是输出了一条表示任务已取消的消息，但在实际应用中，可以在此步骤采取清理措施，例如删除临时文件或关闭网络连接。\n\
  \n最后一步是为用户提供一种取消异步任务的方法。我们通过调用 `CancellationTokenSource` 对象的 `Cancel()` 方法来实现：\n\
  \n```csharp\ntokenSource.Cancel();\n```\n\n为了演示取消文件任务，我们将在任务启动后添加代码，以便在按下按键时取消任务，如下：\n\
  \n```csharp\nstatic async Task Main(string[] args)\n{\n    var tokenSource = new\
  \ CancellationTokenSource();\n    var cancellationToken = tokenSource.Token;\n \
  \   Console.WriteLine(\"\\n=== After async tasks ===\\n\");\n    Console.Write(\"\
  Press any key to cancel\");\n    Console.ReadKey();\n    tokenSource.Cancel();\n\
  \    Task.WaitAll(task1, task2, task3);\n}\n```\n\n## 总结\n\nC# 中的异步编程使用 `Task` 类和\
  \ `await` 操作符来并行运行任务，从而提高性能和响应能力。`await` 操作符会挂起执行，直到任务完成，允许其他代码运行。通过将同步方法转换为异步方法，可以同时执行多个任务，缩短总时间。要实现并发执行，请存储异步方法返回的\
  \ `Task` 对象并在稍后等待它们的结果。异步任务的取消可以使用 `CancellationTokenSource` 对象的 `Cancel()` 方法实现。在取消任务时，应该采取适当步骤处理异常，以防止应用程序崩溃。\n\
  \n## 25 在 C# 中创建 2D、3D 和交错数组\n\n数组显然并不是 C# 特有的。事实上，在 C# 引入之前，几乎所有的其他编程和脚本语言都提供了对数组的支持。数组允许通过单个变量存储并访问相同类型的值的集合。数组中的每个项都通过数组索引进行访问。\n\
  \nC# 数组虽然很有用，但存在一些局限性。也许最重要的局限性是，一旦创建了数组，就无法扩大或缩小它以容纳更多或更少的值。更动态、灵活的集合存储将从“列表集合”（List\
  \ Collections）章节开始介绍。\n\n### 25.1 在 C# 中创建数组\n\n可以用几种不同的方式创建 C# 数组。一种方法是声明数组但不使用任何值对其初始化。其语法如下：\n\
  \n`type[] arrayname;`\n\n在上面的示例中，`type` 表示存储在数组中的数据类型（例如 `string`、`int`、`decimal`\
  \ 等）。方括号 `[]` 表示这是数组的声明，`arrayname` 是引用该数组的名称。\n\n例如，我们可以这样声明一个名为 `myColors` 的字符串数组：\n\
  \n```csharp\nstring[] myColors;\n```\n\n在这个示例中，我们声明了数组但没有给它分配任何值。在声明数组后分配值，请使用以下语法：\n\
  \n```csharp\nstring[] myColors;\nmyColors = new string[] {\"red\", \"green\", \"\
  yellow\", \"orange\", \"blue\"};\n```\n\n也可以在声明行中通过通过在声明后放置逗号分隔的值列表来初始化数组：\n\n```csharp\n\
  string[] myColors = new string[] {\"red\", \"green\", \"yellow\", \"orange\", \"\
  blue\"};\n```\n\n另一个选项是在创建数组时指定大小。例如，要声明一个大小为 5 的数组，请在 `new` 语句的方括号内放置大小值：\n\n```csharp\n\
  string[] myColors = new string[5];\n```\n\n这将为完整数组保留空间，而不会实际向数组中放置任何值。数组元素可以在创建时如下所示初始化（注意元素数量必须与指定的尺寸匹配）：\n\
  \n```csharp\nstring[] myColors = new string[5] {\"red\", \"green\", \"yellow\",\
  \ \"orange\", \"blue\"};\n```\n\n### 25.2 声明多维数组\n\n多维数组通过在方括号内放置逗号来声明。例如，声明一个二维数组：\n\
  \n```csharp\nchar[,] my2Darray;\n```\n\n上述语法中的单个逗号 `,` 告诉 C# 这是一个二维数组。二维数组的初始化方式如下：\n\
  \n```csharp\nchar[,] my2Darray =\n{\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n\
  \    {'c', 'd', 'e'}\n};\n```\n\n这创建了一个包含三行三列的多维数组。\n\n在上面声明数组时，推断数组维度的任务交给了 C#\
  \ 编译器。在用 `new` 语句声明数组时，也可以指定这些维度，例如：\n\n```csharp\nchar[,] my2Darray = new char[3,3]\n\
  {\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n    {'c', 'd', 'e'}\n};\n```\n\n\
  另一方面，下面的代码声明了一个三维数组：\n\n```csharp\nint[,,] my3Darray;\n```\n\n以下代码将初始化三维数组：\n\n\
  ```csharp\nchar[,,] my3Darray =\n{\n    {\n        {'a', 'b', 'c'},\n        {'c',\
  \ 'd', 'e'}\n    },\n    {\n        {'f', 'g', 'h'},\n        {'i', 'j', 'k'}\n\
  \    }\n};\n```\n\n三维数组本质上是一个每个元素都是二维数组的数组。在上面的声明中，数组由两个数组组成，每个数组包含一个二维数组，每个二维数组包含三个元素。这翻译为一个维度为\
  \ 2、2 和 3 的数组。\n\n也可以在如下所示声明数组时指定维度：\n\n```csharp\nchar[,,] my3Darray2 = new char[2,2,3]\n\
  {\n    {\n        {'a', 'b', 'c'},\n        {'c', 'd', 'e'}\n    },\n    {\n   \
  \     {'f', 'g', 'h'},\n        {'i', 'j', 'k'}\n    }\n};\n```\n\n### 25.3 声明交错数组\n\
  \n\n\n\n锯齿数组（Jagged array）是一种每个元素本身也是数组的数组。在这种语境下，使用“锯齿”一词是因为数组元素的长度可以是不同的。锯齿数组可以被看作是一个二维数组，其中每个子数组可以具有不同数量的元素。\n\
  \n以下是一个设计用于存储变长度二维数组的锯齿数组声明示例：\n\n```csharp\nchar[][] myJaggedArray;\n```\n\n以下代码声明并初始化了同一个锯齿数组：\n\
  \n```csharp\nchar[][] myJaggedArray = [\n    ['a', 'b', 'c', 'd', 'e'],\n    ['f',\
  \ 'g', 'h', 'i'],\n    ['j', 'j'],\n    ['k', 'l', 'm', 'n', 'o', 'p', 'q', 'r']\n\
  ];\n```\n\n### 25.4 参加知识测试\n\n点击下方的链接或扫描二维码，以测试你对 C# 数组的知识和理解：\n\n[`www.answertopia.com/e6ca`](https://www.answertopia.com/e6ca)\n\
  \n![img](img/c_-arrays.png)\n\n## 25.5 总结\n\nC# 数组允许存储相同类型的值集合，每个项通过索引访问。多维数组在方括号内用逗号声明，而锯齿数组是长度不一的数组的数组。\n\
  \n# 26. 访问和排序 C# 数组元素\n\n上一章解释了如何在 C# 中创建二维、三维数组和锯齿数组。在本章中，我们将探索如何访问、删除和排序数组的元素。\n\
  \n### 26.1 创建 ArrayDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并创建一个名为 `ArrayDemo`\
  \ 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs` 文件，并使用它来尝试本章其余部分的示例。\n\n#### 26.2\
  \ 获取数组的维度数\n\n数组的维度可以通过数组的 `Rank` 属性获取。例如：\n\n```csharp\nchar[,] my2Darray = new\
  \ char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n    {'c', 'd', 'e'}\n\
  };\n\nchar[,,] my3Darray = new char[2,2,3]\n{\n    {\n        { 'a', 'b', 'c' },\n\
  \        { 'c', 'd', 'e' }\n    },\n    {\n        { 'f', 'g', 'h' },\n        {\
  \ 'i', 'j', 'k' }\n    }\n};\n\nConsole.WriteLine($\"Dimensions in my2Darray = {my2Darray.Rank}\"\
  );\nConsole.WriteLine($\"Dimensions in my3Darray = {my3Darray.Rank}\");\n```\n\n\
  输出：\n```\nDimensions in my2Darray = 2\nDimensions in my3Darray = 3\n```\n\n### 26.3\
  \ 访问数组元素\n\n一旦值存储在数组中，很有可能在 C# 代码的后续某处需要访问这些值。这是通过使用数组访问器符号结合目标值数组的索引来实现的。数组访问器简单是数组名后跟方括号（`[]`）。方括号内放置一个代表目标值数组索引的数字（请记住\
  \ C# 中第一个数组元素的索引为 0）。例如，要访问我们的 `myColors` 数组的第二个元素，将使用以下符号：\n\n```csharp\nstring[]\
  \ myColors = {\"red\", \"green\", \"yellow\", \"orange\", \"blue\"};\nConsole.WriteLine($\"\
  Element at index 1 = {myColors[1]}\");\n```\n\n执行上述代码时，将输出单词“green”，因为这是数组中索引位置\
  \ 1 处包含的字符串。\n\n同样，可以使用访问器符号结合赋值运算符（`=`）来更改数组中特定索引位置的值。例如，要更改数组第一个项的值：\n\n```csharp\n\
  string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nmyColors[0]\
  \ = \"violet\";\nConsole.WriteLine($\"Element at index 0 = {myColors[0]}\");\n```\n\
  \n多维数组中的值可以通过指定指定并用逗号分隔的每个维度的索引值来访问。例如，要访问我们的 `my2Darray` 中第一个数组的第一个元素，将使用以下访问器（请记住数组从索引位置\
  \ 0 开始）：\n\n```csharp\nchar element = my2Darray[0,0];\n```\n\n以下代码演示了如何访问二维和三维数组中的各种元素：\n\
  \n```csharp\nchar[,] my2Darray = new char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'d',\
  \ 'e', 'f'},\n    {'g', 'h', 'i'}\n};\n\nchar[,,] my3Darray =\n{\n    {\n      \
  \  { 'a', 'b', 'c' },\n        { 'd', 'e', 'f' }\n    },\n    {\n        { 'g',\
  \ 'h', 'i' },\n        { 'j', 'k', 'l' }\n    }\n};\n\n// 输出 my2Darray 中第一个数组的第一个元素\n\
  Console.WriteLine($\"{my2Darray[0,0]}\");\n// 输出 my2Darray 中第一个数组的第二个元素\nConsole.WriteLine($\"\
  {my2Darray[0,1]}\");\n// 输出 my2Darray 中第一个数组的第三个元素\nConsole.WriteLine($\"{my2Darray[0,2]}\"\
  );\n// 输出 my2Darray 中第二个数组的第一个元素\nConsole.WriteLine($\"{my2Darray[1,0]}\");\n//\
  \ 输出 my2Darray 中第二个数组的第二个元素\nConsole.WriteLine($\"{my2Darray[1,1]}\");\n// 输出 my2Darray\
  \ 中第二个数组的第三个元素\nConsole.WriteLine($\"{my2Darray[1,2]}\");\n// 输出 my2Darray 中第三个数组的第一个元素\n\
  Console.WriteLine($\"{my2Darray[2,0]}\");\n// 输出 my2Darray 中第三个数组的第二个元素\nConsole.WriteLine($\"\
  {my2Darray[2,1]}\");\n// 输出 my2Darray 中第三个数组的第三个元素\nConsole.WriteLine($\"{my2Darray[2,2]}\"\
  );\n\n// 输出 my3Darray 中第一个数组的第一个元素的第一个元素\nConsole.WriteLine($\"{my3Darray[0,0,0]}\"\
  );\n// 输出 my3Darray 中第一个数组的第一个元素的第二个元素\nConsole.WriteLine($\"{my3Darray[0,0,1]}\"\
  );\n// 输出 my3Darray 中第一个数组的第一个元素的第三个元素\nConsole.WriteLine($\"{my3Darray[0,0,2]}\"\
  );\n// 输出 my3Darray 中第一个数组的第二个元素的第一个元素\nConsole.WriteLine($\"{my3Darray[0,1,0]}\"\
  );\n// 输出 my3Darray 中第一个数组的第二个元素的第二个元素\nConsole.WriteLine($\"{my3Darray[0,1,1]}\"\
  );\n// 输出 my3Darray 中第一个数组的第二个元素的第三个元素\nConsole.WriteLine($\"{my3Darray[0,1,2]}\"\
  );\n// 输出 my3Darray 中第二个数组的第一个元素的第一个元素\nConsole.WriteLine($\"{my3Darray[1,0,0]}\"\
  );\n// 输出 my3Darray 中第二个数组的第一个元素的第二个元素\nConsole.WriteLine($\"{my3Darray[1,0,1]}\"\
  );\n// 输出 my3Darray 中第二个数组的第一个元素的第三个元素\nConsole.WriteLine($\"{my3Darray[1,0,2]}\"\
  );\n// 输出 my3Darray 中第二个数组的第二个元素的第一个元素\nConsole.WriteLine($\"{my3Darray[1,1,0]}\"\
  );\n// 输出 my3Darray 中第二个数组的第二个元素的第二个元素\nConsole.WriteLine($\"{my3Darray[1,1,1]}\"\
  );\n// 输出 my3Darray 中第二个数组的第二个元素的第三个元素\nConsole.WriteLine($\"{my3Darray[1,1,2]}\"\
  );\n```\n\n### 26.4 数组迭代\n\n可以使用 `foreach` 语句来遍历数组。例如，遍历 `myColors`：\n\n```csharp\n\
  string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nforeach\
  \ (string color in myColors)\n{\n    Console.WriteLine(color);\n}\n```\n\n输出：\n\
  ```\nred\ngreen\nyellow\norange\nblue\n```\n\n也可以使用 `for` 循环来遍历数组，通过索引访问项：\n\n```csharp\n\
  string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nfor\
  \ (int i = 0; i < myColors.Length; i++)\n{\n    Console.WriteLine(myColors[i]);\n\
  }\n```\n\n输出同样：\n```\nred\ngreen\nyellow\norange\nblue\n```\n\n### 26.5 范围\n\n范围运算符（`..`）和索引运算符（`^`）对于访问数组子集非常有用。单向范围运算符可以指定向某个方向延伸，直到到达范围的起始或结束（或者满足某个其他条件）。单向范围通过省略范围的一侧数字来声明，例如：`..`\
  \ 或 `^`。\n\n要指定从位置 2 开始到最后一个元素的范围，可以声明为 `2..`：\n\n```csharp\nstring[] sentence =\
  \ [\"The\", \"best\", \"way\", \"to\", \"predict\", \"the\", \"future\", \"is\"\
  , \"to\", \"invent\", \"it\"];\nstring[] subset = sentence[2..];\n```\n\n同样，要指定从第一个元素开始到位置\
  \ 5 元素的范围，范围将是 `..5`：\n\n```csharp\nstring[] sentence = [\"The\", \"best\", \"way\"\
  , \"to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"invent\", \"it\"];\n\
  string[] subset = sentence[..5];\n```\n\n我们还可以将索引运算符与范围运算符结合，执行类似于下面提取从位置 1 到倒数第二个元素的操作：\n\
  \n```csharp\nstring[] sentence = [\"The\", \"best\", \"way\", \"to\", \"predict\"\
  , \"the\", \"future\", \"is\", \"to\", \"invent\", \"it\"];\nstring[] subset = sentence[1..²];\n\
  ```\n\n尝试运行以下代码查看上述示例的效果：\n\n```csharp\nstring[] sentence = [\"The\", \"best\",\
  \ \"way\", \"to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"invent\"\
  , \"it\"];\nstring[] subset1 = sentence[⁷..⁴];\nstring[] subset2 = sentence[..²];\n\
  string[] subset3 = sentence[3..³];\n\nforeach (string word in subset1)\n{\n    Console.Write(\"\
  {0} \", word);\n}\nConsole.WriteLine(\"\\n\");\n\nforeach (string word in subset2)\n\
  {\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\\n\");\n\nforeach\
  \ (string word in subset3)\n{\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\
  \\n\");\n```\n\n当上述代码运行时，它将生成以下输出：\n```\npredict the future\nThe best way to predict\
  \ the future is to\nto predict the future is\n```\n\n### 26.6 C# 索引结束运算符\n\n\n\n\
  \n\nC# 的从末开始索引 (`^`) 运算符允许你根据从数组末尾数的位置来指定范围的末尾。\n\n例如，索引 `¹` 表示数组中的最后一个项，`²` 表示数组中的倒数第二个项，依此类推。索引\
  \ `⁰` 已被设置为数组中项目总数：\n\n```csharp\nstring[] myArray = {\n    \"item 1\", // <-- ⁷\
  \ - 倒数第 7 个\n    \"item 2\", // <-- ⁶\n    \"item 3\", // <-- ⁵\n    \"item 4\"\
  , // <-- ⁴\n    \"item 5\", // <-- ³\n    \"item 6\", // <-- ²\n    \"item 7\" //\
  \ <-- ¹ - 最后一个项\n    // ⁰ = 数组长度\n};\n```\n\n以下代码演示了在处理范围和数组时如何使用索引操作符：\n\n```csharp\n\
  string[] sentence = {\"The\", \"best\", \"way\", \"to\", \"predict\", \"the\", \"\
  future\", \"is\", \"to\", \"invent\", \"it\"};\n\nstring[] subset1 = sentence[⁷..⁴];\n\
  string[] subset2 = sentence[..²];\nstring[] subset3 = sentence[3..³];\n\nforeach\
  \ (string word in subset1)\n{\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\
  \\n\");\n\nforeach (string word in subset2)\n{\n    Console.Write(\"{0} \", word);\n\
  }\nConsole.WriteLine(\"\\n\");\n\nforeach (string word in subset3)\n{\n    Console.Write(\"\
  {0} \", word);\n}\n```\n\n输出：\n```\npredict the future\nThe best way to predict\
  \ the future is to\nto predict the future is\n```\n\n## 26.7 排序 C# 数组\n\nC# 数组是\
  \ `Array` 包的一部分，该包还包含了一些用于排序和重排数组的实用方法。\n\n如果你需要对数组进行排序，可以将将其传递给 `Array.Sort()`\
  \ 方法，如下：\n\n```csharp\nstring[] myColors = [ \"red\", \"green\", \"yellow\", \"\
  orange\", \"blue\" ];\nConsole.WriteLine(\"Before Sort\");\nforeach (string color\
  \ in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\nArray.Sort(myColors);\n\
  Console.WriteLine(\"\\n\\nAfter Sort\");\nforeach (string color in myColors)\n{\n\
  \    Console.Write(\"{0} \", color);\n}\n```\n\n输出：\n```\nBefore Sort\nred green\
  \ yellow orange blue\nAfter Sort\nblue green orange red yellow\n```\n\n你也可以使用 `Array.Reverse()`\
  \ 方法反转数组中元素的顺序：\n\n```csharp\nstring[] myColors = [\"red\", \"green\", \"yellow\"\
  , \"orange\", \"blue\"];\nArray.Reverse(myColors);\nforeach (string color in myColors)\n\
  {\n    Console.Write(\"{0} \", color);\n}\n```\n\n输出：\n```\nblue orange yellow green\
  \ red\n```\n\n## 26.8 清空 C# 数组\n\n可以使用 `Array.Clear()` 方法清空数组中的值。该方法将数组中的每个项重置为该类型的默认值（`Boolean`\
  \ 值为 `false`，数值型项目为 `0`，字符串为 `null`）。清空数组元素的语法如下：\n\n`Array.Clear(<array>, <start\
  \ index>, <count>);`\n\n在上述语法中，`<array>` 是要清空的数组，`<start index>` 是从数组哪个位置开始清空，`<count>`\
  \ 是要清空的元素数量。\n\n以下示例从项目 1 开始清空了三个元素：\n\n```csharp\nstring[] myColors = [\"red\"\
  , \"green\", \"yellow\", \"orange\", \"blue\"];\nArray.Clear(myColors, 1, 3);\n\
  foreach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n\
  ```\n\n当运行上述代码时，数组中将只剩下蓝色和红色元素。\n\n## 26.9 参加知识测试\n\n点击下方链接或扫描二维码，以测试你对 C# 数组管理的知识和理解：\n\
  \n[`www.answertopia.com/ty5r`](https://www.answertopia.com/ty5r)\n\n![img](img/c_-array-handling.png)\n\
  \n## 26.10 总结\n\n本章探讨了 C# 数组中元素的访问、删除和排序。它演示了如何使用 `Rank` 属性确定维度数量，如何使用数组访问器符号访问元素，以及如何使用\
  \ `foreach` 循环遍历数组。此外，还涵盖了使用范围和从末开始索引运算符提取元素子集，以及使用 `Array.Sort()`、`Array.Reverse()`\
  \ 和 `Array.Clear()` 方法分别进行排序、反转和清空数组。\n\n# 27. C# List 集合\n\n在之前的章节中，我们学习了 C# 数组。虽然数组对很多任务有用，但在功能和灵活性方面开始显得过时。C#\
  \ 集合类提供了更高级的机制来收集对象组。\n\n### 27.1 创建 CollectionDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹并创建一个名为\
  \ `CollectionDemo` 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章其余示例。\n\
  \n### 27.2 介绍 C# 集合类\n\nC# 集合类专门为对象分组并对其执行任务而设计。C# 提供了多种集合类，我们将在接下来的几个章节中查看一些关键类。\n\
  \n### 27.3 使用 `List<T>` 创建 C# 列表集合\n\n`List<T>` 类的属性与 C# 数组非常相似。该类相对于数组的一个关键优势是，它可以随着存储对象数量的变化而增长或收缩。\n\
  \n创建 `List<T>` 的语法如下：\n\n```csharp\nList<type> name = new List<type>();\n```\n\n\
  或者，你可以使用集合初始化器：\n\n```csharp\nList<type> name = [<item1>, <item2>, ...];\n```\n\n\
  ### 27.4 向列表添加项\n\n一旦创建了 List 实例，你就可以调用多个方法对其执行任务。其中一个方法是 `Add()` 方法，如其名，它用于向列表添加项：\n\
  \n```csharp\nList<string> colorList = [];\ncolorList.Add(\"Red\");\ncolorList.Add(\"\
  Green\");\ncolorList.Add(\"Yellow\");\ncolorList.Add(\"Purple\");\ncolorList.Add(\"\
  Orange\");\n```\n\n`Add()` 方法将新项附加到列表末尾。若要在特定索引处插入新项，你需要使用稍后介绍的 `Insert()` 方法。\n\
  \n### 27.5 使用多个值初始化列表\n\n在上面的示例中，我们创建了一个空列表，然后使用 `Add()` 方法逐个添加项。但如果你需要初始化一个包含大量值的列表，可能会发现使用集合初始化器更高效：\n\
  \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
  , \"Orange\"];\n```\n\n### 27.6 访问列表项\n\n可以使用项目的索引值访问列表中的单个项（注意第一个项是 0，第二个是 1，依此类推）。索引值放在列表名称后的方括号中。例如，要访问\
  \ `colorList` 对象中的第二个项：\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\"\
  , \"Yellow\", \"Purple\", \"Orange\"];\nConsole.WriteLine(colorList[1]);\n```\n\n\
  输出：\nGreen\n\n列表项的值也可以同样结合索引和赋值运算符 (`=`) 来进行更改。例如，要将黄色改为靛蓝，代码如下：\n\n```csharp\n\
  List<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
  ];\nConsole.WriteLine($\"Color before = {colorList[2]}\");\ncolorList[2] = \"Indigo\"\
  ;\nConsole.WriteLine($\"Color after = {colorList[2]}\");\n```\n\n输出：\nColor before\
  \ = Yellow\nColor after = Indigo\n\n与数组一样，你也可以构建 `foreach` 循环来列出列表中的所有项。例如：\n\n\
  ```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
  , \"Orange\"];\nforeach (string color in colorList)\n{\n    Console.Write($\"{color}\
  \ \");\n}\n```\n\n输出：\nRed Green Yellow Purple Orange\n\n## 27.7 从列表中移除项\n\n可以使用\
  \ `Remove()` 方法从列表中移除项。该方法接受要移除的项的值作为参数。例如，要从 `colorList` 对象中移除“Orange”字符串，我们可以编写以下代码：\n\
  \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
  , \"Orange\"];\ncolorList.Remove(\"Orange\");\n```\n\n\n\n\n\n```csharp\nforeach\
  \ (string color in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\nOutput:\n\
  Green Yellow Purple Orange\n\n注意 C# 列表可以存储重复的项。在存在重复项的情况下，`Remove()` 方法只会删除第一个匹配的实例。\n\
  \n## 27.8 向列表中插入项\n\n之前我们一直使用 `Add()` 方法将项添加到列表中。然而，`Add()` 方法仅将项添加到列表的末尾。有时，我们需要在列表的特定位置插入新项。`Insert()`\
  \ 方法正是为了实现这一特殊目的而提供的。\n\n`Insert()` 接收两个参数：一个表示插入位置索引的整数，以及要插入在该位置的项。例如，要要在我们的示例列表的索引\
  \ 2 位置插入一个项：\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\"\
  , \"Purple\", \"Orange\"];\n\ncolorList.Insert(2, \"White\");\n\nforeach (string\
  \ color in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\nOutput:\nRed\
  \ Green White Yellow Purple Orange\n\n## 27.9 在 C# 中对列表\n\n没有办法可以告诉 C# 在添加项时自动对列表进行排序。可以通过调用\
  \ `Sort()` 方法对列表中的项进行排序：\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\"\
  , \"Yellow\", \"Purple\", \"Orange\"];\n\ncolorList.Sort();\n\nforeach (string color\
  \ in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\nOutput:\nGreen Orange\
  \ Purple Red Yellow\n\n上面的示例使用了 C# 默认比较委托来组织新的列表顺序。虽然这超出了本书的范围，但值得知道的是，对于更高级的需求，你可以创建自己的比较委托。\n\
  \n## 27.10 在 C# 列表中查找项\n\n`List` 类提供了多种方法来查找查找项。最基本的方法是 `Contains()` 方法，当在列表对象上调用该方法时，如果指定的项位于列表中，则返回\
  \ `true`，否则返回 `false`。\n\n`IndexOf()` 方法返回列表中匹配项的索引值。例如，以下代码示例将输出 `true` 结果（表示存在“Red”）以及值\
  \ `2`（这是字符串“Yellow”的索引位置）：\n\n```csharp\nList<string> colorList = [\"Red\", \"Green\"\
  , \"Yellow\", \"Purple\", \"Orange\"];\n\nConsole.WriteLine(colorList.Contains(\"\
  Red\"));\nConsole.WriteLine(colorList.IndexOf(\"Yellow\"));\n```\nOutput:\nTrue\n\
  2\n\n如果在列表中未找到项，`IndexOf()` 方法将返回值 `-1`。\n\n`LastIndexOf()` 方法返回列表中匹配指定项的最后一个项的索引值。当列表包含重复项时，这种方法特别有用：\n\
  \n```csharp\nList<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
  , \"Red\"];\n\nConsole.WriteLine(colorList.LastIndexOf(\"Red\"));\n```\nOutput:\n\
  4\n\n## 27.11 获取列表信息\n\n`List<T>` 类的两个属性对于获取列表对象的信息很有帮助。例如，`Capacity` 属性可以识别集合在不调整大小的情况下可以存储多少项。\n\
  \n然而，`Count` 属性识别列表中当前存储了多少项。通常情况下，`Capacity` 值将匹配或超过当前的 `Count`：\n\n```csharp\n\
  List<string> colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
  ];\n\nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"\
  Capacity = {colorList.Capacity}\");\n```\nOutput:\nCount = 5\nCapacity = 5\n\n在\
  \ `Count` 和 `Capacity` 之间存在差距的情况下，可以通过调用 `TrimExcess()` 方法移除多余的容量：\n\n```csharp\n\
  colorList.TrimExcess();\n```\n\n## 27.12 清空 C# 列表\n\n你可以通过调用 `Clear()` 方法移除列表中的所有项。\n\
  \n`Clear()` 方法从列表中删除项并将 `Count` 属性设置为零。然而，在列表清空后，`Capacity` 属性保持不变。要移除列表的容量，请在调用\
  \ `Clear()` 方法后调用 `TrimExcess()`：\n\n```csharp\nList<string> colorList = [\"Red\"\
  , \"Green\", \"Yellow\", \"Purple\", \"Orange\"];\n\nConsole.WriteLine($\"Count\
  \ = {colorList.Count}\");\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\"\
  );\n\ncolorList.Clear();\n\nConsole.WriteLine($\"Count = {colorList.Count}\");\n\
  Console.WriteLine($\"Capacity = {colorList.Capacity}\");\n\ncolorList.TrimExcess();\n\
  \nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"Capacity\
  \ = {colorList.Capacity}\");\n```\nOutput:\nCount = 5\nCapacity = 5\nCount = 0\n\
  Capacity = 5\nCount = 0\nCapacity = 0\n\n## 27.13 知识测试\n\n点击下面的链接或扫描二维码以测试你对 C#\
  \ List 集合的知识和理解：\n\n[`www.answertopia.com/tccy`](https://www.answertopia.com/tccy)\n\
  \n![img](img/c_-lists.png) \n\n## 27.14 总结\n\nC# 集合类为对象分组提供了高级机制，其中 `List<T>` 是一个允许动态调整大小的关键类。可以使用\
  \ `Add()`、`Remove()`、`Contains()` 和 `IndexOf()` 等方法创建、修改和查询列表。此外，对列表进行排序、清空，并访问其\
  \ `Count` 和 `Capacity` 等属性以获取列表内容的信息。\n\n# 28. C# Dictionary 集合\n\nC# 字典允许以键值对的形式存储和管理数据。字典的作用与数组和列表类似，不同的是字典中的每个项都有唯一的键。\n\
  \n### 28.1 创建 DictionaryDemo\n\n启动 VS Code，打开你的“C# Essentials”文件夹并创建一个名为 DictionaryDemo\
  \ 的 .NET 控制台项目。一旦创建了项目，打开 `Program.cs` 文件并使用它尝试本章中的示例。\n\n### 28.2 字典初始化\n\n字典是一种旨在在无序集合中持有多个值的数据类型。字典中的每个项由一个键和一个关联的值组成。\n\
  \n可以使用以下语法创建一个字典：\n\n```csharp\nDictionary<key-type, value-type> name = new Dictionary<key-type,\
  \ value-type>();\n```\n\n以下代码示例创建一个使用 `int` 作为键、`string` 作为值的空字典：\n\n```csharp\n\
  Dictionary<int, string> movies = new Dictionary<int, string>();\n```\n\n或者，可以使用\
  \ `var` 关键字使用隐式类型：\n\n```csharp\nvar movies = new Dictionary<int, string>();\n```\n\
  \n可以使用集合初始化器使用值集合来初始化新字典（注意我们再次使用了隐式类型）：\n\n```csharp\nvar name = new Dictionary<key-type,\
  \ value-type>()\n{\n    { key1, value1 },\n    { key2, value2 },\n    { key3, value3\
  \ }\n};\n```\n\n以下代码创建了一个以字符串作为键对应电影标题的键值对初始的新字典：\n\n```csharp\nvar movies = new\
  \ Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\" },\n  \
  \  { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\" },\n\
  \    { \"CLA-1659\", \"Casablanca\" }\n};\n```\n\n在上述实例中，C# 编译器将使用隐式类型判断字典的键和值元素都是字符串，并防止插入其他类型的值或键。\n\
  \n### 28.3 字典项计数\n\n可以通过访问字典的 `Count` 属性获取字典项的计数：\n\n```csharp\nvar movies = new\
  \ Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\" },\n  \
  \  { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\" },\n\
  \    { \"CLA-1659\", \"Casablanca\" }\n};\n\nConsole.WriteLine($\"Count = {movies.Count}\"\
  );\n```\nOutput:\nCount = 4\n\n### 28.4 字典迭代\n\n与数组和列表一样，你可以使用 `foreach` 循环语法遍历字典中的所有项。以下代码遍历了\
  \ movies 字典中的所有项，输出每个项的键和值：\n\n```csharp\nforeach (var entry in movies)\n{\n   \
  \ Console.WriteLine($\"{entry.Key}: {entry.Value}\");\n}\n```\n\n\n\n\n\n```csharp\n\
  { \"COM-5465\", \"The Terminal\" },\n{ \"CLA-1659\", \"Casablanca\" }\n};\n\nforeach\
  \ (var movie in movies) {\n    var key = movie.Key;\n    var value = movie.Value;\n\
  \    Console.WriteLine($\"{key} - {value}\");\n}\n```\n**输出:**\n```text\nDRA-1212\
  \ - The Godfather\nWAR-4433 - Apocalypse Now\nCOM-5465 - The Terminal\nCLA-1659\
  \ - Casablanca\n```\n\n正如我们在上面的代码中所看到的，字典中的每个条目都具有 `Key` 和 `Value` 属性。在这种情况下，我们使用了这些属性来提取每个字典条目的键和电影标题。\n\
  \n## 28.5 添加和删除字典条目\n\n可以通过通过调用实例的 `Add()` 方法并传递键/值对，向现有字典中添加新条目：\n\n```csharp\n\
  var movies = new Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\"\
  \ },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
  \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nmovies.Add(\"SCI-2323\", \"Prometheus\"\
  );\nConsole.WriteLine(movies[\"SCI-2323\"]);\n```\n**输出:**\n```text\nPrometheus\n\
  ```\n\n你可以通过调用 `Remove()` 方法并引用与要删除条目匹配的键从字典中删除条目：\n\n```csharp\nvar movies = new\
  \ Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\" },\n  \
  \  { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\" },\n\
  \    { \"CLA-1659\", \"Casablanca\" }\n};\n\nmovies.Remove(\"WAR-4433\");\n\nforeach\
  \ (var movie in movies) {\n    var key = movie.Key;\n    var value = movie.Value;\n\
  \    Console.WriteLine($\"{key} - {value}\");\n}\n```\n**输出:**\n```text\nDRA-1212\
  \ - The Godfather\nCOM-5465 - The Terminal\nCLA-1659 - Casablanca\n```\n\n## 28.6\
  \ 访问和更新字典项\n\n可以使用键下标语法通过引用相应的值来访问或修改特定值。以下代码引用了已知在 `movies` 字典中的键，并输出关联的值（在本例中是标题为“The\
  \ Terminal”的电影）：\n\n```csharp\nvar movies = new Dictionary<string, string>()\n{\n\
  \    { \"DRA-1212\", \"The Godfather\" },\n    { \"WAR-4433\", \"Apocalypse Now\"\
  \ },\n    { \"COM-5465\", \"The Terminal\" },\n    { \"CLA-1659\", \"Casablanca\"\
  \ }\n};\n\nConsole.WriteLine(movies[\"COM-5465\"]);\n```\n**输出:**\n```text\nThe\
  \ Terminal\n```\n\n在更新与指定键关联的值时，也可以使用键进行索引，例如，将同一部电影的标题从“The Terminal”更改为“Caddyshack”：\n\
  \n```csharp\nvar movies = new Dictionary<string, string>()\n{\n    { \"DRA-1212\"\
  , \"The Godfather\" },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\"\
  , \"The Terminal\" },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nmovies[\"COM-5465\"\
  ] = \"Caddyshack\";\nConsole.WriteLine(movies[\"COM-5465\"]);\n```\n**输出:**\n```text\n\
  Caddyshack\n```\n\n## 28.7 检查键或值是否存在\n\n可以通过调用 `ContainsKey()` 方法搜索字典以查找其是否包含特定键。在向字典添加新条目之前，你可能想要调用此方法以确保键尚未被使用，以避免运行时异常错误。\n\
  \n你还可以通过调用 `ContainsValue()` 方法检查字典中是否存在特定值。以下示例演示了这两种方法：\n\n```csharp\nvar movies\
  \ = new Dictionary<string, string>()\n{\n    { \"DRA-1212\", \"The Godfather\" },\n\
  \    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
  \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nif (movies.ContainsKey(\"CLA-1659\"\
  )) {\n    Console.WriteLine(\"Key exists in dictionary\");\n}\n\nif (movies.ContainsValue(\"\
  The Godfather\")) {\n    Console.WriteLine(\"Title exists in dictionary\");\n}\n\
  ```\n**输出:**\n```text\nKey exists in dictionary\nTitle exists in dictionary\n```\n\
