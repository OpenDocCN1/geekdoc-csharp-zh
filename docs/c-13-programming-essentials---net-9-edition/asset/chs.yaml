  \n![img](img/c_-dictionaries.png)\n\n## 28.9 总结\n\nC# 字典存储键值对，允许高效的数据管理。它们可以使用集合进行初始化。\n\
  \n# 29. C# 文件和目录\n\n在本章中，我们将探索如何在使用 C# 中处理文件和目录，使用 `System.IO` 命名空间提供的类。\n\n## 29.1\
  \ 介绍 System.IO\n\n当我们在 C# 中处理文件和目录时，使用 `System.IO` 命名空间提供的类。完成本章后，你将能够使用如下：\n\n\
  - `Path`: 管理路径字符串、构建新路径以及获取现有路径的信息。\n- `Directory`: 创建、删除和导航目录结构。\n- `DirectoryInfo`:\
  \ 类似于 `Directory` 的非静态方法，使用目录初始化实例化。\n- `File`: 创建、复制和打开文件。\n- `FileInfo`: 类似于 `File`\
  \ 的非静态方法，使用文件路径初始化实例。\n- `StreamReader`/StreamWriter`: 提供 `File` 和 `FileInfo` 更灵活的文件读取和写入方案。这些类用于处理文本文件。\n\
  - `BinaryReader`/BinaryWriter`: 与 `StreamReader` 和 `StreamWriter` 功能相同，但用于处理二进制数据。\n\
  \n## 29.2 理解 C# 中的路径\n\n路径由字符串值表示，根据操作系统而有所不同。在 Windows 系统上，每个路径组件都用反斜杠 `\\` 分隔，并通常以驱动器字母开头。使用标准\
  \ UNIX 规范的系统（macOS、Linux、iOS、Android 等）使用正斜杠 `/` 来分隔组件。\n\n当程序启动时，工作目录是启动程序所在的目录。可以使用\
  \ `Directory` 和 `DirectoryInfo` 方法更改应用程序的工作目录。\n\n文件顶层目录称为根目录，由 `/` 或 `\\` 分隔符表示。以\
  \ `/` 或 `\\` 开头的路径被称为绝对路径，因为它们指定了相对于根目录的文件位置。例如，`/home/demo` 和 `C:\\Temp\\Files`\
  \ 是绝对路径。\n\n不以斜杠开头的路径被解释为相对于当前工作目录。因此，如果工作目录是 `C:\\Users\\Demo` 而路径是 `Documents\\\
  Letters`，那么该路径被认为等同于完整路径 `C:\\Users\\Demo\\Documents\\Letters`。\n\nWindows 风格的路径存在问题，因为反斜杠字符在\
  \ C# 字符串中表示转义序列。因此，以下路径会导致语法错误：\n\n```csharp\n\"C:\\Users\\Demo\\Desktop\\Profile.txt\"\
  \n```\n\n一种方案是如下转义反斜杠：\n\n```csharp\n\"C:\\\\Users\\\\Demo\\\\Desktop\\\\Profile.txt\"\
  \n```\n\n或者，Windows 路径可以使用字符串字面量表示：\n\n```csharp\n@\"C:\\Users\\Demo\\Desktop\\\
  Profile.txt\"\n```\n\n## 29.3 创建 FileDemo 项目\n\n\n\n\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为\
  \ `FileDemo` 的新 .NET 控制台项目。一旦项目准备就，打开 `Program.cs` 文件并使用它来尝试本章节其余的代码示例。\n\n## 29.4\
  \ 当前工作目录\n\n应用程序的初始当前工作目录是启动它的目录，可以使用 `Directory` 类进行识别。编辑 `Program.cs` 文件并使用静态方法\
  \ `Directory.GetCurrentDirectory()`，如下所示：\n\n```csharp\nstring currentDirectory\
  \ = Directory.GetCurrentDirectory();\nConsole.WriteLine(currentDirectory);\n```\n\
  \n点击运行按钮并检查终端输出，其中将显示当前目录。例如：\n\n`/Users/neilsmyth/Documents/Books/C#_13/C# Essentials/FileDemo`\n\
  \n## 29.5 检查目录是否存在\n\n`Directory` 和 `DirectoryInfo` 类都提供了一种识别指定路径是否存在目录的方法。以下代码检查名为\
  \ `MyFiles` 的目录是否存在。请注意，由于我们没有在路径开头加上“/”或“\\”，该目录名是相对于当前工作目录的：\n\n```csharp\nif\
  \ (Directory.Exists(\"MyFiles\"))\n{\n    Console.WriteLine(\"Directory Exists.\"\
  );\n}\nelse\n{\n    Console.WriteLine(\"Directory does not exist.\");\n}\n```\n\n\
  通过创建一个初始化目录路径的 `DirectoryInfo` 实例并访问其 `Exists` 属性也可以实现相同的结果：\n\n```csharp\nDirectoryInfo\
  \ dirInfo = new(\"MyFiles\");\nif ( dirInfo.Exists )\n{\n    Console.WriteLine(\"\
  Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"Directory does not exist.\"\
  );\n}\n```\n\n## 29.6 创建目录\n\n识别出目录不存在后，下一步是创建它。在 C# 中使用 `Directory.CreateDirectory()`\
  \ 静态方法或 `DirectoryInfo` 对象的 `Create()` 方法来创建目录，例如：\n\n```csharp\nif (Directory.Exists(\"\
  MyFiles\"))\n{\n    Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  Directory does not exist - creating...\");\n    Directory.CreateDirectory(\"MyFiles\"\
  );\n}\n\nDirectoryInfo dirInfo = new(\"MyFiles\");\nif (dirInfo.Exists)\n{\n   \
  \ Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  Directory does not exist - creating...\");\n    dirInfo.Create();\n}\n```\n\n当代码运行时，第一个语句将检测到目录不存在并创建它，第二个语句将报告该目录现在存在：\n\
  \n```\nDirectory does not exist - creating...\nDirectory Exists.\n```\n\n## 29.7\
  \ 删除目录\n\n使用 `Directory` 类的 `Delete()` 方法删除现有的目录，并将要删除的目录路径作为参数传递，例如：\n\n```csharp\n\
  Directory.Delete(\"/Temp/Images\");\n```\n\n如果目录包含文件或其他子目录，上述方法调用将触发 I/O 异常，表示目录非为空。要覆盖此异常并删除该目录及其所有文件和子目录，请如下所示传递一个布尔值\
  \ `true`：\n\n```csharp\nDirectory.Delete(\"/Temp/Images\", true);\n```\n\n## 29.8\
  \ 修改当前工作目录\n\n通过调用 `Directory.SetCurrentDirectory()` 方法并传递目标目录作为参数可以更改当前工作目录。与所有目录相关的操作一样，提供的路径可以是绝对路径或相对路径。将以下行添加到\
  \ `Program.cs` 文件中将目录更改到 `MyFiles` 文件夹：\n\n```csharp\nDirectory.SetCurrentDirectory(\"\
  MyFiles\");\nConsole.WriteLine(Directory.GetCurrentDirectory());\n```\n\n运行代码并确认当前目录已更改为\
  \ `MyFiles` 子目录，例如：\n\n`/Users/neilsmyth/Dropbox/Documents/Books/C#_13/C# Essentials/FileDemo/MyFiles`\n\
  \n## 29.9 处理文件和目录异常\n\n在 C# 中处理文件和目录时，重要的是许多操作都有抛出异常的可能。例如，考虑上述更改当前工作目录的代码。该示例之所以有效，是因为我们检查了\
  \ `MyFiles` 目录是否存在，并在必要时创建了它。然而，如果目录不存在，结果将不同。要查看此效果，请向项目添加以下代码：\n\n```csharp\n\
  Directory.SetCurrentDirectory(\"MyFiles1\");\n```\n\n点击运行按钮，此时程序将带有以下未处理的 `DirectoryNotFoundException`\
  \ 错误终止：\n\n```\nUnhandled exception. System.IO.DirectoryNotFoundException: Could\
  \ not find a part of the path '/temp/MyFiles1'.\nat Interop.ThrowExceptionForIoErrno(ErrorInfo\
  \ errorInfo, String path, Boolean isDirError)\n```\n\n为了避免未处理的异常，必须对文件和目录的处理进行防御性编码（例如，在引用之前检查目录或文件是否存在），或者在类似下面的\
  \ try-catch 语句中执行：\n\n```csharp\ntry\n{\n    Directory.SetCurrentDirectory(\"MyFiles1\"\
  );\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"{ex.Message}\");\n}\n```\n\
  \n## 29.10 使用 File 类处理文件\n\n在涵盖 C# 目录处理的基础之后，是时候查看文件操作了。`System.IO.File` 类提供了一系列处理文件的静态方法，包括创建、删除、复制、读取和写入。`FileInfo`\
  \ 类提供了对等的方法。\n\n### 29.10.1 检查文件是否存在\n\n与目录一样，我们可以通过调用 `File.Exists()` 方法来检查指定路径是否存在文件：\n\
  \n```csharp\nif (File.Exists(\"/tmp/MyFile.txt\"))\n{\n}\n```\n\n### 29.10.2 创建并打开文件\n\
  \n我们还可以使用 `File.Open()` 方法结合 `FileMode` 值来创建和打开文件：\n\n```csharp\nvar myFile = File.Open(<path>,\
  \ FileMode.<mode>);\n```\n\n打开文件可以使用以下模式：\n- `Append`：如果文件存在则打开它，否则则创建一个新的。随后的写入操作将追加到文件内容之后。\n\
  - `Create`：创建一个新文件，如果已存在则覆盖它。\n- `CreateNew`：尝试创建一个新文件，如果文件已存在则抛出异常。\n- `Open`：打开已存在的文件，如果不存在则抛出异常。\n\
  - `OpenOrCreate`：如果文件存在则打开，否则创建一个新文件。\n- `Truncate`：打开现有文件并将其截断为零长度。\n\n要创建一个新文件并在已存在时覆盖它，可以使用以下代码：\n\
  \n```csharp\nFile.Open(\"MyFile.txt\", FileMode.Create);\n```\n\n### 29.10.3 使用\
  \ File 类读取和写入\n\n`WriteAllText()` 方法将字符串写入指定的文件。如果文件已存在，它将被覆盖，否则将创建一个文件。相反，`ReadAllText()`\
  \ 方法读取指定文件的内容并作为字符串值返回。以下代码向名为 `MyFile.txt` 的文件写入字符串后进行读取：\n\n```csharp\nFile.WriteAllText(\"\
  MyFile.txt\", \"Hello, this is some text.\");\nstring content = File.ReadAllText(\"\
  MyFile.txt\");\nConsole.WriteLine($\"content = {content}\");\n```\n\n当代码执行时，终端将显示：\n\
  \n```\ncontent = Hello, this is some text.\n```\n\n向现有文件追加文本，我们调用 `AppendAllText()`\
  \ 方法如下：\n\n```csharp\nFile.WriteAllText(\"MyFile.txt\", \"Hello, this is some text.\"\
  );\nFile.AppendAllText(\"MyFile.txt\", \" This is more text.\");\nstring content\
  \ = File.ReadAllText(\"MyFile.txt\");\nConsole.WriteLine($\"content = {content}\"\
  );\n```\n\n结果终端输出如下：\n\n```\ncontent = Hello, this is some text. This is more text.\n\
  ```\n\n要一次性向文件写入多行文本，请将行放在列表集合中并传递给 `WriteAllLines()` 方法：\n\n```csharp\nList<string>\
  \ textList = [\"Kia Sorento\", \"Alfa Romeo GTV6\", \"Chevy Spark\", \"Ford Explorer\"\
  , \"Toyota Celica\"];\nFile.WriteAllLines(\"MyFile.txt\", textList);\n```\n\n`ReadAllLines()`\
  \ 方法读取文件的内容并将行作为字符串数组返回：\n\n```csharp\nstring[] readList = File.ReadAllLines(\"\
  MyFile.txt\");\nforeach (string line in readList) {\n    Console.WriteLine(line);\n\
  }\n```\n\n\n\n\n\n运行项目并检查终端中是否有以下输出：\n\nKia Sorento\nAlfa Romeo GTV6\nChevy Spark\n\
  Ford Explorer\nToyota Celica\n\n## 29.11 删除、复制和移动文件\n\n使用 `File` 类的 `Delete()` 方法可以删除现有文件（`FileInfo`\
  \ 类也提供了类似的选项），调用时传递要删除的文件路径，例如：\n\n```cs\nFile.Delete(\"/Temp/SomeFile.txt\");\n\
  ```\n\n如需将现有文件复制到新文件，请按照如下方式使用 `File.Copy()` 方法：\n\n```cs\nFile.Copy(\"File1.txt\"\
  , \"/Temp/File2.txt\");\n```\n\n`File.Move()` 方法将文件从一个位置移动到另一个位置，包括重命名文件的选项。以下代码在目录之间移动了文件：\n\
  \n```cs\nFile.Move(\"MyFile.txt\", \"/Documents/MyFile.txt\");\n```\n\n在接下来的示例中，`Move()`\
  \ 被用于重命名当前工作目录下的文件：\n\n```cs\nFile.Move(\"oldfilename.txt\", \"newfilename.txt\"\
  );\n```\n\n## 29.12 使用流进行文件 I/O\n\n`File` 类提供了一种以文本块或行向文件写入内容的简单方法。然而，对于更复杂的需求，我们需要使用流。\n\
  \n`StreamReader` 和 `StreamWriter` 类与 `File` 类相比，读写文件具有更高的灵活性和控制力，并且更适合处理大文件。\n\n\
  `Stream` 类允许我们按行或按字符读写文本。例如，以下代码使用 `StreamWriter` 的 `Write()` 和 `WriteLine()` 方法分别向流中写入单个字符和行：\n\
  \n```cs\nusing (StreamWriter writer = new(\"MyFile.txt\"))\n{\n    writer.Write('A');\n\
  \    writer.Write('B');\n    writer.Write('C');\n    writer.WriteLine(\"DEFGHIJKLMNOP\"\
  );\n    writer.WriteLine(\"QRSTUVWXYZ\");\n}\n```\n\n注意上述代码中 `using` 语句的使用。`StreamReader`\
  \ 和 `StreamWriter` 在创建时会分配资源，工作完成后需要释放这些资源。`using` 语句确保在完成时调用对应对象的 `Dispose()` 方法以释放分配的资源。或者，必须在流实例上调用\
  \ `Dispose()`：\n\n```cs\nwriter.Dispose();\n```\n\n```\n以下代码使用 `StreamReader` 的\
  \ `ReadLine()` 方法逐行读取 `MyFile.txt` 文件的内容：\n\n```cs\nusing (StreamReader reader =\
  \ new(\"MyFile.txt\"))\n{\n    string line;\n    while ((line = reader.ReadLine())\
  \ != null)\n    {\n        Console.WriteLine(line);\n    }\n}\n```\n\n我们可以使用 `StreamReader`\
  \ 的 `Read()` 方法从文件中读取字符范围。`Read()` 方法有多个重载，允许以不同的方式调用它。例如，以下代码读取并显示了 `MyFile.txt`\
  \ 文件中的第一个字符：\n\n```cs\nConsole.WriteLine($\"Char = {(char)reader.Read()}\");\n```\n\
  \n输出：\nChar = A\n\n`StreamReader` 实例保留一个指向文件中当前位置的指针。上述代码不仅读取了文件的第一个字符，还更新了指针以引用下一个位置。因此，第二次读取操作将返回字符\
  \ ‘B’。\n\n为了避免读取到文件末尾的风险，我们可以使用 `StreamReader` 的 `Peek()` 方法在不读取的情况下查看下一个字符。当 `Peek()`\
  \ 返回 -1 时，我们知道当前字符是最后一个：\n\n```cs\nwhile (reader.Peek() >= 0) {\n    Console.WriteLine($\"\
  Char = {(char)reader.Read()}\");\n}\n```\n\n`Read()` 方法还可以使用以下语法从指定的索引位置读取指定数量的字符：\n\
  \n`Read( <char array> , <index> , <count> )`\n\n在上述语法中，`<index>` 参数是相对于当前流位置的偏移量，而不是从流的开始。例如，如果流指针当前为\
  \ 2，且传递给 `Read()` 的索引值为 3，则字符将从位置 5 开始读取。\n\n以下代码示例从当前位置开始每三个字符分块读取文件：\n\n```cs\n\
  using (StreamReader reader = new(\"MyFile.txt\"))\n{\n    char[] charBuffer;\n \
  \   while (reader.Peek() >= 0)\n    {\n        charBuffer = new char[3];\n     \
  \   reader.Read(charBuffer, 0, 3);\n        Console.WriteLine(charBuffer);\n   \
  \ }\n}\n```\n\n执行上述代码后，将生成以下输出：\n\nABC\nDEF\nGHI\nJKL\nMNO\nP\nQ\nRST\nUVW\nXYZ\n\
  \n在字母 ‘O’ 之后模式被中断，但请记住，这是我们从 `Write()` 切换到 `WriteLine()` 的地方，在 ‘P’ 和 ‘Q’ 之间引入了换行。\n\
  \n在处理流时，我们可以通过访问读取器的 `BaseStream.Length` 属性获取流的长度：\n\n```cs\nvar length = reader.\
  \ BaseStream.Length;\n```\n\n这在读取整个流时初始化字符缓冲区有用：\n\n```cs\nchar[] charBuffer;\n\
  var length = reader.BaseStream.Length;\nwhile (reader.Peek() >= 0)\n{\n    charBuffer\
  \ = new char[ length ];\n    reader.Read(charBuffer, 0, length);\n    Console.WriteLine(charBuffer);\n\
  }\n```\n\n另一种技术是使用 `ReadToEnd()` 方法获取从当前位置到结束的流内容：\n\n```cs\nstring contents = reader.ReadToEnd();\n\
  ```\n\n## 29.13 异步文件处理\n\n除了介绍过的同步方法外，`File` 和 `Stream` 类还包含异步方法，它们在处理大文件时特别有用。以下是这些异步方法的示例：\n\
  \n- `File.WriteAllLinesAsync()`\n- `File.ReadAllLinesAsync()`\n- `File.WriteAllTextAsync()`\n\
  - `File.ReadAllTextAsync()`\n- `StreamReader.ReadAsync()`\n- `StreamReader.BlockAsync()`\n\
  - `StreamReader.ReadLineAsync()`\n- `StreamReader.ReadToEndAsync()`\n- `StreamWriter.WriteAsync()`\n\
  - `StreamWriter.WriteLineAsync()`\n\n这些方法与同步方法语法相似，但必须带有 `await` 关键字的上下文中调用。\n\n\
  ## 29.14 处理二进制流\n\n在此为止，我们仅处理文本文件。对于二进制文件处理，C# 提供了 `BinaryReader` 和 `BinaryWriter`\
  \ 类。以下示例将字符串、布尔、双精度、整数和字符值写入二进制文件：\n\n```cs\nusing (BinaryWriter writer = new(File.Open(\"\
  Binary.dat\", FileMode.Create)))\n{\n    writer.Write(\"Test data\");\n    writer.Write(false);\n\
  \    writer.Write(3.57);\n    writer.Write(33);\n    writer.Write('W');\n}\n```\n\
  \n从二进制流读取数据时，必须按照如下方式调用相应的 `BinaryReader` 方法以匹配数据类型：\n\n```cs\nusing (BinaryReader\
  \ reader = new(File.Open(\"Binary.dat\", FileMode.Open)))\n{\n    Console.WriteLine(\"\
  String = \" + reader.ReadString());\n    Console.WriteLine(\"Boolean = \" + reader.ReadBoolean());\n\
  \    Console.WriteLine(\"Double = \" + reader.ReadDouble());\n    Console.WriteLine(\"\
  Int = \" + reader.ReadInt32());\n    Console.WriteLine(\"Char = \" + reader.ReadChar());\n\
  }\n```\n\n运行后，上述代码将生成以下输出：\n\nString = Test data\nBoolean = False\nDouble = 3.57\n\
  Int = 33\nChar = W\n\n## 29.15 知识测试\n\n点击下方链接或扫描二维码来测试你对 C# 字典集合的知识和理解：\n\n[`www.answertopia.com/65dc`](https://www.answertopia.com/65dc)\n\
  \n![img](img/c_-files.png)\n\n## 29.16 总结\n\n本章探讨了使用 System.IO 命名空间中的类在 C# 中进行文件和目录处理。我们涵盖了创建、删除、导航以及处理文件和目录，包括检查存在性、更改当前工作目录以及处理异常。`File`\
  \ 类提供了处理文件的静态方法，而 `FileInfo` 类提供了相同目的的非静态方法。我们还查看了使用 `StreamReader`、`StreamWriter`、`BinaryReader`\
  \ 和 `BinaryWriter` 类进行更复杂的文件处理。\n\n\n\n字符串是字符的集合，它们组合在一起形成单词或句子。然而，如果没有人类，计算机可能永远与字符串没有任何关系。但事实是，计算机的主要工作之一就是接受人类提供的数据并向人类展示数据。出于这个原因，任何\
  \ C# 程序都可能涉及大量专门设计用于处理字符串格式数据的代码。\n\n## 30.1 创建 StringsDemo 项目\n\n启动 `VS Code`，打开你的“C#\
  \ Essentials”工作空间文件夹，创建一个名为 `StringsDemo` 的新 `.NET Console App` 项目。\n\n创建项目后，打开\
  \ `Program.cs` 文件并使用它来尝试本章其余部分的示例。\n\n### 30.2 在 C# 中创建字符串\n\n字符串由包含在字符串对象中的字符序列组成。可以使用多种不同的机制创建字符串对象。\n\
  \n可以按照如下方式声明字符串但不进行初始化：\n\n```csharp\nstring myString;\n```\n\n或者，你可以使用赋值运算符在 C#\
  \ 中为字符串分配字面量值：\n\n```csharp\nstring myString = \"Hello World\";\n```\n\n当然，你也可以使用隐式类型来声明字符串：\n\
  \n```csharp\nvar myString = \"Hello World\";\n```\n\n同样，可以使用 `new` 关键字并将字面量值传递给构造函数创建一个新字符串：\n\
  \n```csharp\nstring myString = new(\"Hello World\");\n```\n\n字符串字面量置于双引号内（如所示）。如果字符串本身包含双引号，则转义字符（`\\\
  `）应位于双引号字符之前：\n\n```csharp\nConsole.WriteLine(\"He shouted \\\"Can you hear me\\\
  \"\");\n```\n\n输出：\n```\nHe shouted \"Can you hear me?\"\n```\n\n你还可以通过在字符串前加上 `@`\
  \ 字符来指示 C# 将字符串中的所有字符视为字面量。当使用 `@` 符号时，双引号之间的所有内容都被视为原始字符串，无论文本中是否存在换行符、回车、反斜杠等。例如：\n\
  \n```csharp\nConsole.WriteLine(@\"You can put a backslash \\ here\n\nand a new line\n\
  \nand tabs work too.\n\nYou can also put in sequences that would normally be seen\
  \ as escape sequences like \\n and \\t.\");\n```\n\n输出：\n```\nYou can put a backslash\
  \ \\ here\n\nand a new line\n\nand tabs work too.\n\nYou can also put in sequences\
  \ that would normally be seen as escape sequences like \\n and \\t.\n```\n\n如果你熟悉其他编程语言的\
  \ `herodoc` 函数，你会很快发现这本质上是 C# 的实现。\n\n## 30.3 获取 C# 字符串的长度\n\n如果你需要识别 C# 字符串的长度，可以通过访问字符串对象的\
  \ `Length` 属性来实现：\n\n```csharp\nstring myString = \"Hello World\";\nConsole.WriteLine($\"\
  myString length = {myString.Length}\");\n```\n\n输出：\n```\nmyString length = 11\n\
  ```\n\n## 30.4 将字符串视为数组\n\n可以通过将字符串视为数组来访问字符串中的单个字符（数组在“在 C# 中创建 2D、3D 和交错数组” 中介绍过）。\n\
  \n通过使用下标语法（`[]`）指定索引值，你可以访问字符串中的单个字符（记住第一个字符索引位置为 0）：\n\n```csharp\nstring myString\
  \ = \"Hello World\";\nConsole.WriteLine(myString[0]);\n```\n\n### 30.5 字符串迭代\n\n\
  我们可以遍历任何集合，因此可以使用 `foreach` 循环遍历字符串的每个字符：\n\n```csharp\nstring myString = \"Hello\
  \ World\";\nforeach (char c in myString)\n{\n    Console.WriteLine(c);\n}\n```\n\
  \n输出：\n```\nH\ne\nl\nl\no\nW\no\nr\nl\nd\n```\n\n### 30.6 字符串拼接\n\n可以使用简单的加法运算符（`+`）连接字符串。因此，我们可以如下方式组合字符串：\n\
  \n```csharp\nstring myString = \"Hello World.\";\nConsole.WriteLine(myString + \"\
  \ How are you?\");\n```\n\n输出：\n```\nHello World. How are you?\n```\n\n或者，你可以使用\
  \ `string` 类的 `Concat()` 方法来拼接字符串。该方法接受两个字符串作为参数并返回一个新字符串：\n\n```csharp\nstring\
  \ myString1 = \"If at first you don’t succeed, \";\nstring myString2 = \"try, again.\"\
  ;\nstring myString3 = string.Concat(myString1, myString2);\nConsole.WriteLine(myString3);\n\
  ```\n\n输出：\n```\nIf at first you don’t succeed, try, again.\n```\n\n## 30.7 比较字符串\n\
  \n如果你需要将一个字符串与另一个字符串比较，C# 提供了几种选项。最常用的选项是使用相等运算符，如下例所示：\n\n```csharp\nstring myString1\
  \ = \"Hello World\";\nstring myString2 = \"Hello World\";\nif (myString1 == myString2)\n\
  {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  They not match.\");\n}\n```\n\n输出：\n```\nThe strings match\n```\n\n你也可以使用 `Equals()`\
  \ 方法以类似的方式比较字符串。该方法接受两个比较的字符串并返回指示字符串是否匹配的布尔值：\n\n```csharp\nstring myString1 =\
  \ \"Hello world\";\nstring myString2 = \"Hello world\";\nif (string.Equals(myString1,\
  \ myString2))\n{\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n \
  \   Console.WriteLine(\"The strings do not match.\");\n}\n```\n\n输出：\n```\nThe strings\
  \ match\n```\n\n在上面的示例中，我们将两个字符串都传递给了 `Equals()` 方法。`Equals()` 方法也可以在字符串字面量或对象上调用以获得相同的结果：\n\
  \n```csharp\nstring myString1 = \"Hello world\";\nstring myString2 = \"Hello world\"\
  ;\nif (myString1.Equals(myString2, StringComparison.Ordinal))\n{\n    Console.WriteLine(\"\
  The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"The strings do not match.\"\
  );\n}\n```\n\n输出：\n```\nThe strings match\n```\n\n到为止，我们探索的所有比较都是区分大小大小的。在调用 `Equals()`\
  \ 方法时，你还可以传递一个比较类型参数。该类型必须来自 C# 的 `StringComparison` 枚举，它在执行文化敏感比较设置的值之外，还包含了用于区分大小写比较的\
  \ `OrdinalIgnoreCase` 值：\n\n```csharp\nstring myString1 = \"HELLO WORLD\";\nstring\
  \ myString2 = \"Hello world\";\nif (string.Equals(myString1, myString2, StringComparison.OrdinalIgnoreCase))\n\
  {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  The strings do not match.\");\n}\n```\n\n输出：\n```\nThe strings match\n```\n\n当直接在字符串字面量或对象上调用\
  \ `Equals()` 方法时，同样的方法有效：\n\n```csharp\nvar result = \"My String\".Equals(\"my string\"\
  , StringComparison.OrdinalIgnoreCase);\n```\n\n\n\n`string.Compare()` 方法提供了另一种比较字符串的方法，尽管该方法具有一些实用的额外功能。此方法接受两个要比较的字符串作为参数，并返回一个整数值，表示字符串之间排序顺序之间的关系。结果为\
  \ 0 表示字符串匹配。小于 0 的值表示第一个字符串在排序顺序上于第二个字符串。最后，大于 0 的结果表示第二个字符串在排序顺序上于第一个字符串：\n\n```cs\n\
  string myString1 = \"Bananas are yellow.\";\nstring myString2 = \"Oranges are orange.\"\
  ;\nvar result = string.Compare(myString1, myString2);\n\nif (result == 0)\n{\n \
  \   Console.WriteLine(\"Strings match.\");\n}\nelse if (result < 0)\n{\n    Console.WriteLine(\"\
  myString1 precedes myString2 in sort order.\");\n}\nelse if (result > 0)\n{\n  \
  \  Console.WriteLine(\"myString2 precedes myString1 in sort order.\");\n}\n```\n\
  输出:\nmyString1 precedes myString2 in sort order.\n\n### 30.8 更改字符串的大小\n\n可以使用 `ToUpper()`\
  \ 和 `ToLower()` 方法更改字符串中字符的大小写。这两个方法都返回一个修改后的字符串，而不是更改实际字符串。例如：\n\n```cs\nstring\
  \ myString = \"Hello World\";\nstring newString;\nnewString = myString.ToUpper();\n\
  Console.WriteLine(newString);\nnewString = myString.ToLower();\nConsole.WriteLine(newString);\n\
  ```\n输出:\nHELLO WORLD\nhello world\n\n### 30.9 将字符串拆分为多个部分\n\n可以使用 `Split()` 方法将字符串拆分为多个部分。`Split()`\
  \ 接受一个字符作为分隔符，以识别字符串要拆分点。方法调用返回一个包含字符串各个部分的数组。例如，以下代码使用逗号字符作为分隔符拆分字符串。结果放在名为 `myColors`\
  \ 的数组中，然后使用 `foreach` 循环从数组中读取每个项并显示它：\n\n```cs\nstring myString = \"Red, Green,\
  \ Blue, Yellow, Pink, Purple\";\nstring[] myColors = myString.Split(',');\nforeach\
  \ (string color in myColors)\n{\n    Console.WriteLine(color);\n}\n```\n输出:\nRed\
  \ Green Blue Yellow Pink Purple\n\n正如我们看到的，`Split()` 方法按照要求拆分了字符串，但我们有一个问题，空格仍然存在。幸运的是，C#\
  \ 提供了一个方法来处理这个问题。\n\n### 30.10 修剪和填充字符串\n\n可以使用 `Trim()` 方法从字符串中删除不需要的开头和结尾空格。调用时，此方法返回字符串的修改版本，删除了开头和结尾的空格：\n\
  \n```cs\nstring myString = \" hello \";\nConsole.WriteLine(\"[\" + myString + \"\
  ]\");\nConsole.WriteLine(\"[\" + myString.Trim() + \"]\");\n```\n输出:\n[ hello ]\n\
  [hello]\n\n如果你只需要删除开头或结尾的空格，请分别使用 `TrimStart()` 或 `TrimEnd()` 方法。\n\n修剪方法的反向是 `PadLeft()`\
  \ 和 `PadRight()` 方法。这些方法允许向字符串添加开头或结尾字符。方法接受的参数是字符串要填充的总字符数以及填充字符：\n\n```cs\nstring\
  \ myString = \"hello\";\nstring newString;\nnewString = myString.PadLeft(10, ' ');\n\
  newString = newString.PadRight(20, '*');\nConsole.WriteLine(\"[\" + newString +\
  \ \"]\");\n```\n输出:\n[ hello**********]\n\n### 30.11 字符串替换\n\n可以使用 `Replace()` 方法替换字符串的部分。此方法接受要替换的字符串部分和替换字符串作为参数，并返回一个反映更改的新字符串。`Replace()`\
  \ 方法将替换字符串的所有实例：\n\n```cs\nstring myString = \"Hello World\";\nstring newString;\n\
  Console.WriteLine(myString);\nnewString = myString.Replace(\"Hello\", \"Goodbye\"\
  );\nConsole.WriteLine(newString);\n```\n输出:\nHello World\nGoodbye World\n\n### 30.12\
  \ 接受知识测试\n\n点击下方链接或扫描二维码以测试你对 C# 字符串的知识和理解：\n\n[`www.answertopia.com/nppx`](https://www.answertopia.com/nppx)\n\
  \n![img](img/c_-strings.png)\n\n## 30.13 总结\n\nC# 字符串是用于人机交互的字符集合。可以使用字面量、`new`\
  \ 关键字或隐式类型创建字符串。可以使用 `Length()`、`ToCharArray()` 和 `Concat()` 等方法进行操作，并使用 `foreach`\
  \ 循环进行迭代。\n\nC# 提供了各种比较字符串的方法，包括 `Equals()` 和 `Compare()` 等等性运算符。`ToUpper()` 和 `ToLower()`\
  \ 方法可以更改字符串大小，而 `Split()` 将字符串拆分为部分。`Trim()` 删除开头和结尾空格，而 `PadLeft()` 和 `PadRight()`\
  \ 在字符串的开头或结尾添加字符。\n\n# 31. C# 字符串格式化\n\n除了上一节概述的各种字符串处理函数外，string 类还提供了 `Format()`\
  \ 方法。\n\nC# 字符串 `Format()` 方法的主要目的是提供一种在具有额外格式控制的情况下，向字符串中插入字符串、数值或布尔值的方法。\n\n###\
  \ 31.1 Format 方法的语法\n\nstring 字符串 `Format()` 方法的通用语法如下：\n\n`string.Format(\"格式字符串\"\
  , arg1, arg2, ...)`\n\n格式字符串是用于填充值的字符串。在该字符串内部，占位符指示了值的位置。占位符的形式为包裹数字的 `{}`。紧跟格式字符串后面的是逗号分隔的参数列表。每个占位符都必须有一个参数。\n\
  \n### 31.2 创建 StringFormat 项目\n\n启动 VS Code，打开你的“C# Essentials”文件夹，并创建一个名为 `StringFormat`\
  \ 的新 .NET 应用程序。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章节中的示例。\n\n### 31.3 简单的字符串格式化示例\n\
  \n以下代码示例演示了 `Format()` 方法的直接用法：\n\n```cs\nstring newString;\nnewString = string.Format(\"\
  There are {0} cats in my {1} and no {2}\", 2, \"house\", \"dogs\");\nConsole.WriteLine(newString);\n\
  ```\n输出:\nThere are 2 cats in my house and no dogs\n\n让我们快速回顾上述示例中的 `Format()` 方法调用。格式字符串包含三个占位符：`{0}`、`{1}`\
  \ 和 `{2}`。格式字符串后面是用于每个占位符的参数。因此，例如 `{0}` 被第一个参数（数字 2）替换，`{1}` 被第二个参数（字符串“house”）替换。如果你回想“变量和常量”章节，可能会疑惑这与我们在书中多次使用的字符串插值技术相比如何。正如下面所示，C#\
  \ 字符串格式化在与格式控制结合时变得更有用。\n\n### 31.4 使用格式控制\n\n到目前为止，我们只替换了占位符的参数，但没有在显示之前更改参数的格式。这本质上指示\
  \ `Format()` 方法在显示字符串时使用默认格式。`Format()` 方法最强大的方面之一是在占位符内部格式控制来控制输出格式。\n\n格式控制出现在占位符的大括号\
  \ `{}` 内部。带有格式控制的占位符格式如下：\n\n`{n:controlx}`\n\n在上述语法中，`n` 是占位符数字，`control` 是应用于参数的特殊格式控制序列。可选数字\
  \ `x` 进一步格式化某些控制类型的输出。\n\n### 31.5 简单的格式控制示例\n\n以下示例使用了 `X` 格式控制，它用于以十六进制格式显示数字：\n\
  \n\n\n\n\n```csharp\nvar newString = string.Format(\"The number {0} in Hexadecimal\
  \ is {0:X}.\", 432);\n\nConsole.WriteLine (newString);\n```\nOutput:\n数字 432 的十六进制是\
  \ 1B0。\n\n上面的示例以两种格式显示了参数 0 (432)。第一种是默认的十进制格式，而第二种使用 `X` 格式控制符将参数显示为十六进制数。\n\n\
  字符串 `Format()` 方法提供了广泛的格式控制符，我们将在下方对其进行探索。\n\n## 31.6 C# 字符串 `Format()` 格式控制\n\n\
  下表列出了 C# `string.Format()` 方法支持的格式控制以及每个控制符的示例：\n\n| 控制符 | 类型 | 描述 | 示例 |\n| :---\
  \ | :--- | :--- | :--- |\n| C | 货币 | 显示带有当前区域适当货币符号前缀的数字 | 432.00 的 `{0:C}` 输出 $432.00\
  \ |\n| D | 十进制 | 以十进制形式显示数字，并带有可选填充 | 432 的 `{0:D4}` 输出 00432 |\n| E | 指数 | 以科学计数法显示数字，并带有小数部分的可选值\
  \ | 432.32 的 `{0:E5}` 输出 4.32320E+002 |\n| F | 固定值 | 显示数字，包括指定的小数位数 | 432.324343\
  \ 的 `{0:F3}` 输出 432.324 |\n| N | 数字 | 通过插入逗号和四舍五入到最近的百分位将数字转换为人类易读的格式 | 123432.324343\
  \ 的 `{0:N}` 输出 123,432.32 |\n| X | 十六进制 | 将数字转换为十六进制 | 432 的 `{0:X}` 输出 1B0 |\n\
  | 0:0… | 零填充 | 添加零来填充参数 | 43.1 的 `{0:0000.00}` 输出 0043.10 |\n| 0:0#… | 空格填充 | 添加空格来填充参数\
  \ | 43.1 的 `{0:####.##}` 输出 43.1 |\n| % | 百分比 | 将参数乘以 100 并附加百分比符号 | .432 的 `{0:00.00%}`\
  \ 输出 43.20% |\n\n表 31-1\n\n在进入下一个章节之前，运行以下代码以查看这些格式控制符的实际效果：\n\n```csharp\nvar newString\
  \ = string.Format(\"The number {0} fixed to 2 decimal places is {0:F2}.\", 109.78799);\n\
  \nConsole.WriteLine (newString);\n\nnewString = string.Format(\"The number {0} using\
  \ human friendly formatting is {0:N}.\", 1023429.78799);\n\nConsole.WriteLine (newString);\n\
  \nnewString = string.Format(\"The number {0} using exponential formatting is {0:E6}.\"\
  , 32423.24232);\n\nConsole.WriteLine (newString);\n\nnewString = string.Format(\"\
  The number {0} as a percentage to 3 decinal places is {0:00.000%}.\", 0.24232);\n\
  \nConsole.WriteLine (newString);\n```\nOutput:\n数字 109.78799 留 2 位小数是 109.79。\n\
  数字 1023429.78799 使用人类易读格式是 1,023,429.79。\n数字 32423.24232 使用指数计数法是 3.242324E+004。\n\
  数字 0.24232 留 3 位小数的百分比形式是 24.232%。\n\n## 31.7 知识测试\n\n点击下方的链接或扫描二维码来测试你对 C# 字符串格式化的知识和理解：\n\
  \n[`www.answertopia.com/yywc`](https://www.answertopia.com/yywc)\n\n![img](img/c_-string-formatting.png)\n\
  \n## 31.8 总结\n\nC# `string.Format()` 方法允许使用格式控制符将值插入字符串。格式控制符（例如用于货币的 `C` 和用于十六进制的\
  \ `X`）可以在占位符内修改输出格式。该方法为各种数据类型提供了广泛的格式控制符。\n\n# 32. C# 日期和时间\n\n很少有应用程序可以在开发时不需要以某种方式处理日期和时间。认识到这一点，负责\
  \ C# 的微软工程师为我们提供了 `DateTime` 对象。本章将介绍如何使用该对象在 C# 应用程序中处理日期和时间。涵盖的内容包括增加和减少时间、获取系统日期和时间，以及在\
  \ C# 中格式化和提取日期时间的元素。\n\n### 32.1 创建 DateTimeDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并创建一个名为\
  \ `DateTimeDemo` 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章其他部分的示例。\n\
  \n### 32.2 创建 C# `DateTime` 对象\n\n在处理日期和时间时，第一步是创建一个 `DateTime` 对象。在 C# 中处理日期和时间时，使用\
  \ `DateTime` 对象的第一步是创建一个实例。例如，要创建一个 2024 年 4 月 9 日的 `DateTime` 对象，你可以编写以下代码：\n\n\
  ```csharp\nDateTime dt = new DateTime(2024, 4, 9);\nConsole.WriteLine(dt.ToString());\n\
  ```\nOutput:\n4/9/2024\n\n注意，`DateTime` 对象是不可变的。如果你想修改它，方法会返回一个新的对象。例如，通过以下代码为我们的示例增加\
  \ 5 天：\n\n```csharp\nDateTime dt = new DateTime(2024, 4, 9);\nDateTime newDt = dt.AddDays(5);\n\
  Console.WriteLine(newDt.ToString());\n```\nOutput:\n4/14/2024\n\n### 32.3 获取系统日期和时间\n\
  \n`DateTime` 类提供了 `Today` 和 `Now` 静态属性来获取系统日期和时间。例如，以下代码演示了这些属性：\n\n```csharp\n\
  Console.WriteLine(DateTime.Today.ToString());\nConsole.WriteLine(DateTime.Now.ToString());\n\
  ```\nOutput:\n4/9/2024\n4/9/2024 10:30:15 AM\n\n`Today` 只返回当前日期，而 `Now` 返回当前日期和时间。\n\
  \n### 32.4 增加或减少日期和时间\n\n`DateTime` 对象提供了多种方法，用于增加或减少日期和时间。这些方法在下列列：\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `Add` | 增加或减少一个 `TimeSpan` 对象。 |\n| `AddDays` | 增加或减少指定的天数。\
  \ |\n| `AddHours` | 增加或减少指定的小时数。 |\n| `AddMilliseconds` | 增加或减少指定的毫秒数。 |\n| `AddMinutes`\
  \ | 增加或减少指定的分钟数。 |\n| `AddMonths` | 增加或减少指定的月份数。 |\n| `AddSeconds` | 增加或减少指定的秒数。\
  \ |\n| `AddYears` | 增加或减少指定的年数。 |\n\n表 32-1\n\n在使用这些方法时，一个需要理解的至关重要的问题是，这些方法不会更改调用它们的\
  \ `DateTime` 对象的值，而是返回一个新的 `DateTime` 对象。例如，为我们的示例对象增加 5 天：\n\n```csharp\nDateTime\
  \ dt = new DateTime(2024, 4, 9);\nDateTime newDt = dt.AddDays(5);\nConsole.WriteLine(newDt.ToString());\n\
  ```\nOutput:\n4/14/2024\n\n要从日期中减少时间，向相应的方法传递一个负值。例如，我们可以从示例中减少 10 个月：\n\n```csharp\n\
  DateTime dt = new DateTime(2024, 4, 9);\nDateTime newDt = dt.AddMonths(-10);\nConsole.WriteLine(newDt.ToString());\n\
  ```\nOutput:\n6/9/2023\n\n### 32.5 提取日期时间的部分\n\n日期和时间由不同的值组成，即日、月、年、小时、分钟、秒和毫秒。C#\
  \ `DateTime` 对象将每个值存储为对象中的一个独立属性，允许单独访问。例如，以下代码示例提取每个值并将其显示在控制台中：\n\n```csharp\n\
  DateTime dt = new DateTime(2024, 4, 9, 14, 30, 0);\n\nConsole.WriteLine(dt.Day);\n\
  Console.WriteLine(dt.Month);\nConsole.WriteLine(dt.Year);\nConsole.WriteLine(dt.Hour);\n\
  Console.WriteLine(dt.Minute);\nConsole.WriteLine(dt.Second);\nConsole.WriteLine(dt.Millisecond);\n\
  ```\nOutput:\n9\n4\n2024\n14\n30\n0\n0\n\n\n\n\n\n# 2023\n14\n30\n0\n0\n32.6\n\n\
