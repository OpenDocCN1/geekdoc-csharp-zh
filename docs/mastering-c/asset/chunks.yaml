    # Chapter Fourteen


    ## 4. Change the status of the video record in the database to “Processing”.


    Each of these steps can be represented by an activity. For the purpose of this
    exercise, do not worry about these complexities. Simply use `Console.WriteLine()`
    in each of your activity classes.


    Your focus should be on sending a workflow to the workflow engine and having it
    run the workflow and all the activities inside it. We don’t care about the actual
    activities.


    # C# Generics


    C# Generic feature were added in C# 2.0 as a solution to the problem boxing and
    unboxing, casting problems which result to performance penalty. Hence, it increases
    performance, and promotes code reusability, as a result eliminate code duplication
    and ensure type safety in our applications. To understand this Let say we want
    to create a list to store a list of numbers. Below is a simple implementation
    of a basic list. We could have a method `Add()` to add a given number and a method
    `Indexer` to return the number at a given index.


    Now if you want to store a book in the list, the above class will not work. So
    we have to go and create another class and call it `BookList` and it will have
    an `Add()` method that takes the object of a book class as its parameter and also
    an indexer of type `Book`.


    Now the problem here is that for every type we have to create a separate list
    and this sis a lot of code duplication and not productive. More so if there is
    a bug we have to fix it in multiple places hence one solution to fix this is to
    use a list of object as shown below.


    Since `object` is the parent class for every types in `.Net`. Therefore, we can
    easily pass any type to this method and get any object from this indexer. However,
    there is another problem here, which is performance. If we use this class for
    storing value, types like integers. Every time we insert a value type inside this
    list, it has to be boxed to be stored as objects and every time we have to access
    this value it has to be unboxed and this has a performance penalty.


    Even if you use reference type every time we want to cast an object let say a
    book to an object or vice versa . This casting again has performance penalty so
    generic came as a solution to resolve this problem. With generic, we create a
    class once and re use it multiple times and it does not have the performance penalty
    as it is with the above object list.


    Example of a generic List class


    Now generic has a parameter and the parameter are specified as `<T>` short for
    template as shown below. we also create our `Add()` but instead of passing an
    object of book class or any other parameter we pass `T` which the user of this
    class can decide what value of `T` will be.


    Let see how we can use the above class.


    We go to our `Program.cs`, so here we use our generic `List` class to generate
    a list of numbers and we can use the same `GenericList` to store books as shown
    below . You can also see that at run time the `Add()` method has `int` pass as
    parameter in the case of numbers and has the object of the class `Book` pass as
    parameter in the case of `Book`.


    So you see we get code reusability without having the performance penalty because
    at runtime there is no casting or boxing as our `GenericList` takes directly the
    actual parameter needed. This is the basis of creating generic classes, but in
    practical terms, you will be using Generic classes as oppose to creating one.
    It is rare to come across a situation where you need to create a generic class
    instead of using the existing generic lists that are part of `.Net`. In addition,
    you can find all the Generic collections in `.Net` in `System.Collections.Generic`.


    # The Most Useful C# Collections that Every C# Developer must Master


    ## List<T>


    It shows a list of objects that can be accessed by an index. `<T>` short for Template
    means that this is a generic list. Lists are different from arrays in terms of
    size; arrays are fixed in size, while lists can grow in size dynamically. Hence,
    they are also referred to as dynamic arrays or vectors. Internally, for storage
    purposes, a list uses an array. However, when it is filled up. It will create
    a new larger array, and will transfer the items from the existing array into the
    new created one. It is better to use a list than arrays these days even if you
    are working with a fixed number of things.


    To create a list:


    ```csharp

    var list = new List<int>();

    ```


    If you know ahead of time that you wish to store large number of items in a list,
    you can initial a size: like this


    ```csharp

    // creating a list with the size initialized

    var list = new List<int>(20000);

    ```


    Some of the useful operations you can perform with lists are:


    ```csharp

    // Add an item after the last item in a list

    list.Add(4);


    // Add an item at 0 index

    list.Insert(4, 0);


    // Delete an item from list

    list.Remove(1);


    // Delete the item at index 0

    list.RemoveAt(0);


    // Return the item at 0 index

    var first = list[0];


    // Return the index or the position number of an item

    var index = list.IndexOf(4);


    // Check if an item exist in a list

    var contains = list.Contains(4);


    // Return the total number of items in the list

    var count = list.Count;


    // iterate or loop over all objects in a list

    foreach (var item in list)

    Console.WriteLine(item);

    ```


    Now, let us analyze List Performance in these operations


    ### Adding or Removing Items at the Beginning or Middle of a List


    When you add or remove an item at the beginning or middle of a list, it will have
    to shift the position of one or more items. We use the Big O notation to specify
    the cost of this operation. For the worst-case event, when we remove or add item
    at the very beginning, it simply means that all elements in the list were shifted.
    And the Big O notation is `O(n)`, meaning that it is a linear progression which
    means that as the size of the input increase, the execution time increase, so
    the execution time of the algorithm increases in direct proportion to n.


    ### Adding/Removing Items at the End


    To add or remove an item at the end of a list is an operation that is a bit fast
    and is independent on the size of the list. The existing items are not moved or
    shifted. Hence, the execution time is relatively constant and is independent of
    the number of items in the list. The Big O notation is `O(1)`; Where 1 means constant.


    ### Searching for an Item


    When methods like `IndexOf()`, `Contains()` and `Find()` are used for searching
    for an item in a list. A linear search is performed. Hence, it loops or iterates
    over all the elements of the list and when a match is found, it returns it. For
    the worst-case scenario, if this item is placed at the end of the list, all items
    in the list need to be searched or scanned before the exact item is found. So
    the Big O notation is `O(n)`.


    ### Accessing an Item by an Index


    Accessing item using the index is what List is very good at. Hence, the Big O
    notation `O(1)`. It is constant.


    In conclusion, if you need to search for items based on some other criteria other
    than at the beginning or, middle or end of the list, and not an index (e.g Order
    with ID 4567), it is best to use a `Dictionary`.

