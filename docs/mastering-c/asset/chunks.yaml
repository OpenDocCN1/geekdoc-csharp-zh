    ### Implicit Type Conversion (Casting)


    If types are compatible (e.g. integral numbers and real numbers) and the type
     you are considering is bigger,


    you don''t need to do anything. The value will be automatically converted by the
    runtime and


    stored in the target type


    Here is an example of implicit type conversion,


    byte b = 1;


    int k = b;


    Here as we explained before, byte takes one byte of memory and integer takes four
    bytes, so we can easily copy the byte in to the integer variable and no data loss
    will happen.


    But if data loss will occur the compiler will not allow implicit type conversion.


    ### Explicit Type Conversion


    float f = 1.0f;


    Int k = (int)f;


    As you can see even though in converting the float f to an integer, will cause
    data loss, but we are telling the compiler to go ahead and do the conversion by
    enclosing the int data type in bracket beside the variable f  to convert its value
    to integer.


    ### Non Compatible Types


    We may have two incompatible data types like int and string, we can have a number
    represented as string and we want to convert it to integer, we cannot use explicit
    type conversion. We have to employ a different mechanism such as using the Convert
    class and or the Parse method Convert class is part of the .Net framework and
    is define in the System namespace. It has a bunch of methods that is used to convert
    various data types to other data types .All the primitive types (int, short, boolean
    , float etc) that we have explained before they all have their own  parse methods
    . Check out the example below


    string d = “1”;


    int k = Convert.ToInt32(s);


    int h = int.Parse(s);


    Here are some of the methods you can find in the Convert Class;


    *   ToByte()- which convert a given value to byte


    *   ToInt16: which convert a given value to short.


    *   ToInt32 (): which convert a given value to int


    *   ToInt64 (): which convert a given value to long


    ### Another Example of Type Conversion 


    ![image](d2d_images/image144.png)


    If you execute this code, you will get the following output


    ![image](d2d_images/image010.png)


    Why? Because a byte does not have enough storage to take the number 1234, so when
    we run it the application crash. And here is exception, which is the error reporting
    mechanism in .Net framework. it is an advance topic and I covered it in my C#
    sharp advanced course book but for this example I will show you how to handle
    exception, sometimes exceptions are friendly and easy to understand sometime they
    are not, but in any case if you have an exception you do not understand enter
    it into google and you will a lot of answers and solutions for it.


    Here in our example above, the exception occurred at the point of conversion from
    string to byte, so what we need to do is to wrap the code in a try and catch block
    to prevent the program from crashing like it did


    Look at the update code below we put it in try block and the catch block get the
    exception. What happens is that the code you put in a try block is monitored and
    if exception occurs the catch block will be executed and display the friendly
    message to the user instead of crashing


    ![image](d2d_images/image130.png)


    The output


    ![image](d2d_images/image172.png)


    Operators


    In C#, we have five following Operators


    ### Arithmetic Operators


    We use arithmetic operators in computations where you are working with numbers.
    The table below present the arithmetic operators that we have in C#


    ![image](d2d_images/image176.png)


    We also have other two arithmetic operators called increment and decrement, which
    are shortcuts for adding 1 or subtracting 1 from a variable. it can be used as
    prefix  increment or decrement or post fix increment or decrement


    ![image](d2d_images/image028.png)


    Example


    var a = 10;


    var b = 3;


    var c = 2;


    Console.WriteLine(a+ b*c);


    The output of this will 60; because C# follows the natural mathematical arithmetic
    precedence because division and multiplication have higher precedence than addition
    or subtraction. So if you want to add a and b before multiplying with c you write
    it this way


    Console.WriteLine((a+ b)*c);


    This way the output will be 26


    ### Comparison Operators


    ![image](d2d_images/image037.png)


    Example


    var a = 1;


    var b = 2 ;


    Console.WriteLine(a > b);


    Console.WriteLine(a == b);


    The outputs will be false, note that the result of a comparison expression is
    always a boolean value which is true or false


    ### Assignment Operators


    ![image](d2d_images/image091.png)


    ### Logical Operators


    These are used mostly with Boolean expressions which are often used in conditional
    expressions


    ![image](d2d_images/image162.png)


    Example


    var a = 1;


    var b = 2 ;


    var c= 3;


    Console.WriteLine(c > b && c > a); // the output will be true


    Console.WriteLine(c> b &&  c == a);  // the output will be false


    Console.WriteLine(c > b || c > a); // the output will be true


    Console.WriteLine(c> b || c == a); // the output will be true


