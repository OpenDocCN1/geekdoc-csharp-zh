    Dictionary look-ups are so fast because they stores objects in an array internally,
    although they differ from a list, in the sense that objects are added  or removed
    at a particular  index using a hash function. Therefore, when we store an object
    in a dictionary, it will call the GetHashCode () method on the key of the object
    to calculate the hash. The hash is then adjusted according to the size of the
    array to calculate the index into the array to store the object. Later, when we
    lookup an object by its key, GetHashCode () method is used again to calculate
    the hash and the index. Looking at figure below, to store an object in a dictionary,
    the GetHashCode () method on the key is called. Let us take for example that it
    returns 1234\. This hash value is then adjusted based on the size of the internal
