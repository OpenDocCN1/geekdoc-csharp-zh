    public class customer\n{\n    List<Order> Orders = new List<Order>();\n}\n```\n\
    \n#### 只读字段 (Read-only Fields)\n我们可以使用 `readonly` 修饰符声明字段，以确保字段只被赋值一次。我们使用 `readonly`\
    \ 字段在应用程序中创建某种安全性，并提高应用程序的健壮性。例如查看 `customer` 类，我有一个只读的订单列表，如果作为开发者我不小心尝试在另一个方法中初始化此列表，我在此订单对象中的数据就不会丢失。\n\
    \n我们使用 `readonly` 修饰符来提高代码的健壮性。当字段被声明为 `readonly` 时，它需要在声明期间或在构造函数中初始化。该值不能更改。这可以防止你不意外覆盖字段的值，从而避免导致意外的状态。例如，想想上面示例中的\
