    d: `numbers[1]`\n\nAnswer is: `c`\n\n### Question-3:\n\nWe have a class as follows:\n\
    \n```csharp\npublic class Point\n{\npublic int X;\npublic int Y;\n}\n```\n\nHow\
    \ can we create an object of type `Point`?\n\na: `var Point;`\nb: `Point p;`\n\
    c: `Point p = new Point;`\nd: `Point p = new Point();`\n\nAnswer is: `d`\n\n###\
    \ Question-4:\n\nWe have a `TaxCalculator` class as follows. How can we call the\
    \ `Calculate` method?\n\n```csharp\npublic class TaxCalculator\n{\npublic static\
    \ float Calculate()\n{\n\n}\n}\n```\n\na: `TaxCalculator.Calculate();`\nb: `new\
    \ TaxCalculator().Calculate();`\n\nAnswer is: `a`\n\n### Question-5:\n\nThe `\\\
    n` escape character in a string represents:\n\na: A whitespace\nb: A line-break\n\
    c: A tab\n\nAnswer is: `b`\n\n### Question-6:\n\nWhat would be the result of this\
    \ program?\n\n```csharp\nvar number1 = 1;\nvar number2 = number1;\nnumber2++;\n\
    Console.WriteLine(number1);\n```\n\na: 1\nb: 2\n\nAnswer is: `a`\n\n### Question-7:\n\
    \nWe have an enum as follows:\n\n```csharp\npublic enum CustomerType\n{\nBronze,\n\
    Silver,\nGold\n}\n```\n\nWhat will be the output of this code?\n\n```csharp\n\
    var type = (int)CustomerType.Bronze;\nConsole.WriteLine(type):\n```\n\na: 0\n\
    b: 1\nc: Bronze\n\nAnswer is: `a`\n\n# CHAPTER FOUR\n\n# Control Flow\n\nIn this\
    \ chapter we are going to explore conditional and iteration statements in C# we\
    \ use these statements to control the flow of the program. From this section you\
    \ are going to start writing simple C# program. And make sure you spend time with\
    \ the exercises that is the way to train your mind to think like a programmer.\
    \ So Let get started\n\n# Conditional Statements\n\nWe have the following conditional\
    \ statements in C#:\n\n### If / else Statements\n\nHere is the basic structure\
    \ in If / else statement:\n\n```csharp\nIf(condition)\nSomeStatement\nElse if(anotherCondition)\n\
    anotherStatement\nelse\nyetAnotherStatement\n```\n\nso in if we always have a\
    \ `(condition)` in parenthesis that will be executed if the condition is true\
    \ and we can optionally have the `else if` and optionally the `else` which will\
    \ be executed if other earlier conditions are not met.\n\nwe can also have nested\
    \ `If` Statements:\n\n```csharp\nIf(condition)\n{\nIf(anotherCondition)\n// some\
    \ statement\nelse\n```\n\nTry to avoid using multiple nested if else statements\
    \ in your code to avoid make your code unreadable and hard to maintain.\n\n###\
    \ Switch / Case\n\nIn `switch`, we have a variable whose value is used to compare\
    \ the values of other variables in the cases, in the switch example below the\
    \ variable is `state`, which is an enumeration. There are two case statements\
    \ that is evaluated am comparing the value of `state` if it is `Active` the statements\
    \ or actions within that case is executed , if none of these conditions are met\
    \ the default is executed .\n\n```csharp\nSwitch(state)\n{\ncase State.Active\n\
    someStatement\nbreak;\ncase State.Inactive\nsomeStatements\nbreak;\ndefault:\n\
    someStatement\nbreak;\n}\n```\n\nLet see an example of IF /Else statement in action:\n\
    \n![image](d2d_images/image055.png)\n\nThe above code is quite self-explanatory.\
    \ Now we can use the conditional operator in place of If/else. Check out the following\
    \ code snippet:\n\n```csharp\nBool isSuperCustomer=true;\nfloat price;\nif(isSuperCustomer)\n\
    price =20.12f;\nelse\nprice = 30.23f;\n```\n\nThe above code can be rewritten\
    \ using conditional operator like this:\n\n```csharp\nfloat price =(isSuperCustomer\
    \ )? 20.12f: 30.23f;\n```\n\n### Switch Case Example\n\n```csharp\nNamespace SwitchCaseExample\n\
    {\nPublic enum Season\n{\nSpring,\nSummer,\nAutumn,\nWinter\n}\nClass Program\
    \ {\nstatic void Main(string[] args)\n{\nvar season = Season.Autumn;\nswitch(season)\n\
    {\ncase Season.Autumn:\nConsole.WriteLine(“It’s autumn let go swinging “);\nbreak;\n\
    case  Season.Summer:\nConsole .WriteLine(“It’s summer”);\nbreak;\ncase Season.Winter:\n\
    Console.WriteLine(“It’s winter”);\nbreak;\ndefault:\nConsole.WriteLine(“It’s unknown”);\n\
    break;\n}\n}\n```\n*(Note: The original text had some broken logic in the switch\
    \ block, I have cleaned the structure while maintaining context).*\n\n# Iteration\
    \ Statements\n\nEvery programming language has iteration statements that are used\
    \ to repeatedly execute a sequence of statements. In C# we have\n\n* For Loops\n\
    * Foreach Loops\n* While Loops\n* Do-While Loops\n\n### For Loops\n\nLet examine\
    \ the syntax for `for`:\n\n```csharp\nfor(var i=0; i < 10; i++)\n{\n```\n\n`For`\
    \ loops have three parts: initialization clause is where we create the counter\
    \ (`var i=0`), the second part is the condition (`i < 10`), and the third part\
    \ is the iteration clause (`i++`). Statements within the curly braces will be\
    \ executed.\n\n### Foreach Loops\n\nThis is used to iterate over elements that\
    \ is any kind of list. The syntax for `foreach` is:\n\n```csharp\nforeach (var\
    \ number in numbers)\n{\n```\n\nHere we have the temporary variable `number`,\
    \ `foreach` keyword to iterate over `numbers`. Assuming `numbers` is a list, in\
    \ every iteration `number` will hold the current value in the list.\n\n### While\
    \ Loops\n\n```csharp\nWhile (k < 10)\n{\nk++;\n}\n```\n\nIn `while` loop there\
    \ is a condition which as long as it is valid the loop will execute. Typically,\
    \ we have a counter which is initialized It is a bit similar to `for` loop but\
    \ the syntax is different.\n\n### Do-While Loops\n\n```csharp\ndo\n{\ni++;\n}\
    \ while (i<10);\n```\n\n`Do-While` loop is slightly different from `while` loop,\
    \ in that in `do-while` loop, the condition is executed at least once because\
    \ the condition is evaluated at the end of the loop. So here we have the `do`\
    \ and a block of statements to be executed and a counter to be incremented or\
    \ decremented and we have `while` keyword followed by a condition to be evaluated.\
    \ Note you do not always need a counter with a `do-while` loop. It depends on\
    \ what you want achieve.\n\n### Break and Continue\n\n`break`: helps you to jump\
    \ out of the loop\n`continue`: jumps to the next iteration\n\n#### For Loop Example\n\
    \nLet say we want to display the even numbers from 1 to 10. The following code\
    \ will do just that:\n\n```csharp\nfor (int i = 1; i <= 10; i++)\n{\n    if (i\
    \ % 2 == 0)\n    {\n        Console.WriteLine(i);\n    }\n}\n```\n\n![image](d2d_images/image103.png)\n\
    \nThe output is:\n\n![image](d2d_images/image066.png)\n\nA little exercise try\
    \ writing the above code in a reverse order instead of starting from 1 to 10 start\
    \ from 10 to 1 to display even numbers\n\n#### Foreach Loop Example\n\nLet say\
    \ we have a name of type string we want to iterate and display each character\
    \ of the string name. As you know, a string is innumerable.\n\n```csharp\nvar\
    \ name =”Dennis Sharp”;\nforeach ( var character in name)\n{\n    Console.WriteLine\
    \ (character);\n}\n```\n\nExecute the above code to see the output. Let use an\
    \ array to show another example:\n\n![image](d2d_images/image180.png)\n\nThe output\
    \ will be\n"
