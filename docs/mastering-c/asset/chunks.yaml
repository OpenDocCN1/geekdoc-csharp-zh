    # Classes


    ![image](d2d_images/chapter_title_below.png)


    We are going to start our journey by learning about Classes, in this section,
    I will introduce you to bases of classes.


    ❖  What is a class?


    ❖  Real=world example of classes


    ❖  What is an object and how it is different from a class.


    ❖  Static members


    ### Class


    A class is simply a building block of a software application so in a real world,
    an application consist of multiple classes. Each responsible for a particular
    behavior in an application or all these classes together producing the expected
    behavior from the application. Simply put A class encapsulates data (stored in
    ﬁelds) and behavior (deﬁned by methods).


    ![image](d2d_images/image175.png)


    ### Real World example


    Let say we want to implement a web application like Blog engine, a typical software
    or web application consist at least of three layers; presentation, Business Logic
    and the data access layer. In each of these layers we can have classes each responsible
    for something in particular


    ![image](d2d_images/image123.png)


    for example in the presentation layer we can have a class called PostView   which
    will be purely responsible for exposing posts to the user, in the Business logic
    we can a class for the post itself and finally the persistence or the data access
    layer will have a class that will save the post to the database or load the post
    from a database


    ### Anatomy of a Class


    A class has two parts namely


    ❖  Data (represented by fields)


    ❖  Behavior (represented by methods / functions )


    Here is how to demonstrate a class in unified model language (UML)


    ![image](d2d_images/image038.png)![image](d2d_images/image020.png)![image](d2d_images/image034.png)![image](d2d_images/image036.png)


    ### Another example


    ![image](d2d_images/image071.png)![image](d2d_images/image072.png)![image](d2d_images/image035.png)![image](d2d_images/image006.png)


    ### Object


    An object is fundamentally different from a class. An object is essentially the
    instance of a class that reside .in a memory. In the Person class above, we can
    have objects like John, Mary Ann as the instances of the Person Class. The Person
    type or the person class define the blueprint by which we can create objects At
    runtime each of these objects in the memory talks to each other as result the
    expected result or behavior from the application is obtained.


    ### Declaring Classes


    in C#, classes are declare like this access modifier followed by the keyword class
    and the name of the class with opening and closing curly braces and the methods
    and fields of the class are define within the curly braces  as shown below


    public class Person


    {


    Public string Name;


    Public void Introduce () // methods are declare with access modifier return type
    and the name and ()


    {


    Console.WriteLine(“Hi my name is “+ Name);


    }


    ### Creating Objects


    We use the type of the class followed by the identifier and then the new operator
    to initialize the instance of the class as seen below


    Person person -= new Person ();


    A shorter way to write the above is to use var keyword


    var person = new Person ();


    ### Using Objects


    Now that we have an object, we can access the members of the object.


    In our person object we can access the name and give it a value and also access
    the introduce () method as seen below


    var person = new Person();


    person.Name = “Dennis”;


    person.introduce();


    ### Class Members


    We have two types of members instance and static members


    Instance Members:  they are accessible from an object.  For example


    var person = new Person();


    person.introduce();


    Static: members:  are accessible from the class. For example, we don’t have to
    have an instance of the Console class in order to use the method WriteLine (),
    instead we call it using the class name Console.


    Console.WriteLine();


    ### Why use static members?


    To represent concepts that are singleton that means we should have only one instance
    of that in the memory. Like DateTime.Now and Console.WriteLine ().


    ### Declaring Static Members


    To define a member as a static, all you have to do is to use the static keyword
    after the access modifier and you can declare static on any member of the class


    Public class Person


    {


    Public static int peopleCount = 0;


    }


    ### Class Demo


    ![image](d2d_images/image089.png)


    ### Constructors


    A constructor is a method that is called when an instance of a class is created
    .we use constructors to put an object in an early state that is to initialize
    some of the fields in the class. We do not have to always use a constructor, but
    if we need to initialize an object upon creation. Then we use the constructor
    to do that.


    ### Constructor Declaration


    A constructor has an exact name as the class, that is a requirement, and it does
    not have a return type not even void


    Public class Customer


    {


    Public Customer ()// default constructor


    {


    }


    }


    Second Example


    Public class Customer


    {


    Public string Name;


    Public Customer (string name)


    {


    This.Name = name;


    }


    }


    ### Constructor Overloading


    Constructors can be overloaded. Overloading means having a method with the same
    name but different signatures. A signature is what uniquely identifies a method;
    its return type, its name and the types and number of its parameters.  In the
    constructor we can have different signatures as follows


    Public class Customer


    {


    Public Customer () {....} // this takes no parameter it is a default constructor


    Public Customer (string name) {....} // this takes only one string parameter


    Public Customer (int id, string name) {...} // this takes two parameters


    }


    The reason why we do overloading is to make the initialization of the class easy.


    ### Constructor Demo


    Let create a separate class called customer in the our Console Application project
    in visual studio


    And define different signatures of the constructor or overload the constructor.


    ![image](d2d_images/image005.png)


    In our program.cs, we can initialize the class and use one of the custom constructor
    that takes in two parameters {Id and name} to assign value to the members of the
    class object as seen below


    ![image](d2d_images/image001.png)


    ### Object Initializers'
