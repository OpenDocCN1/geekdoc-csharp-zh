    上述界面中另一个需要注意的是大括号，因此在 `C#` 中，无论我们在哪里有一个代码块，都需要用大括号将其括起来，这适用于类、`program` 和命名空间（namespaces）。


    现在我们来写一个简单的 `C#` 程序，在上面 `Main()` 方法的左大括号之后：


