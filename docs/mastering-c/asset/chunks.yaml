    \ these classes combine related variables (fields) and (methods) functions together.\
    \ So here is an example, in the figure below we have a class called `person` with\
    \ four fields `Name`, `Age`, `Height` and `Weight`. It also has four methods or\
    \ functions ; `Walk()`, `Talk()`, `Eat()` and `Sleep()`. This class is a type\
    \ from which we create a blue print of an object. Object is an instance of a `class`,\
    \ from this class example we can create three instances of the `person` class\
    \ like `Mary`, `John` and `Scott` as seen below. More or less when your application\
    \ is running, it is actually objects that are talking with each other and collaborating\
    \ to provide some functionalities.\n\n![image](d2d_images/image146.png)\n\n##\
    \ Declaring Class in C#\n\nTo create a class we start with an access modifier\
    \ the keyword `class` and an identifier.\n\n```csharp\npublic class Person\n{\n\
    }\n```\n\nIn the example, `public` is what we call an access modifier. It checks\
    \ whether a class is visible to other classes or not. Access modifiers are beyond\
    \ the scope of this book and I’ve covered them in my my second book on this course:\
    \ C# Intermediate. For now just remember that whenever you want to create a class\
    \ use the keyword `public` to make it accessible anywhere in the application.\n\
    \nAlso, know that when you declare a variable in a class, you have to give it\
    \ an access modifier, for now we will use `public`.\n\nHere is another example\
    \ of a class with a field and a method:\n\n```csharp\npublic class Person\n{\n\
    \    public string Name;\n    public void Introduce()\n    {\n        Console.WriteLine(\"\
    My name is \" + Name);\n    }\n}\n```\n\n`void` indicates that this method does\
    \ not return a value. In this method `Introduce()`, the empty parenthesis means\
    \ that it does not accept any value or parameter. And what it does is to simply\
    \ output the name of the person on the console. To create an object, we use the\
    \ `new` operator:\n\n```csharp\nPerson person = new Person();\n```\n\nA better\
    \ way of writing the same code is:\n\n```csharp\nvar person = new Person();\n\
    ```\n\nThe `new` operator is used to allocate memory to an object. In C# you don’t\
    \ have to worry about de-allocating the memory. `CLR` has a component called `Garbage\
    \ Collector`, which automatically removes unused objects.\n\nWhen you declare\
    \ a variable in a class, you have to give it an access modifier, for now we will\
    \ use `public`.\n\n```csharp\nPerson person = new Person();\nperson.Name = \"\
    Dennis\";\n```\n\n## Static Modifier\n\nWhen a `static` modifier is used on a\
    \ class (field or method), makes that accessible only via the class, not objects.\n\
    \n```csharp\nPerson.Introduce();\n```\n\nStatic members are used in occasions\
    \ where we want only one instance of that member to exist. As an example, the\
    \ `Main` method in every program is declared as `static`, because we need one\
    \ entry point to the application.\n\n```csharp\npublic class Calculator\n{\n \
    \   public static int Add(int a, int b)\n    {\n        return a + b;\n    }\n\
    }\n```\n\nTo access this method we use the class name:\n\n```csharp\nint result\
    \ = Calculator.Add(1, 2); // the output will be 3\n```\n\nIn the real-world, it’s\
    \ best to stay away from `static` as much as you can because that makes automated\
    \ tests for applications hard.\n\nDemo class example\n\n![image](d2d_images/image045.png)\n\
    \nNote that the class `person` is created outside the `class`. A better way to\
    \ create class is to create as separate file by right clicking the project solution\
    \ > click on `Add` > `Class` and give it a name `person.cs`, or you can use the\
    \ short form `Shift+Alt+C` then you can writes the codes there, also remember\
    \ to add `public` to the class declaration to make accessible anywhere in the\
    \ application. and from the main method we create an object of the class and use\
    \ it to access the fields and also the method `Introduce()`. The output of this\
    \ program will be\n\n![image](d2d_images/image134.png)\n\n## Structs\n\nA `struct`\
    \ (structure) is a type with similar characteristics with a `class`. It combines\
    \ related fields and methods together. In terms of syntax, it is similar but the\
    \ difference is that instead of using the `class` keyword it uses the `struct`\
    \ keyword\n\n```csharp\npublic struct ColorSpectrum\n{\n    public int Red;\n\
    \    public int Green;\n    public int Blue;\n}\n```\n\nUse structs only when\
    \ creating small lightweight objects. That is for a subtle performance optimization.\
    \ In the real-world, new types are usually created using classes, not structures.\
    \ In .NET, all primitive types are defined as structures. They are small and lightweight.\
    \ The biggest primitive type does not have a size that is more than 16 bytes.\n\
    \n## Arrays\n\nAn array is used to store a collection of variables of the same\
    \ type. It is a data structure.\n\nFor example, imagine you will like to work\
    \ with three numbers, instead of declaring three `int` variables (that are related),\
    \ like this\n\n```csharp\nint number1;\nint number2;\nint number3;\n```\n\nyou\
    \ can create an `int` array like this:\n\n```csharp\nint[] numbers = new int[3];\n\
    ```\n"
