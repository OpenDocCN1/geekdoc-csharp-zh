    Every programming language has iteration statements that are used to repeatedly
    execute a sequence of statements. In C# we have four iteration statements 


    *   For Loops


    *   Foreach Loops


    *   While Loops


    *   Do-While Loops


    Let examin the syntax for each of this iteration statement.


    ### For Loops


    for(var i= 0; i < 10; i++)


    {


    }


    For loops have three parts ,the initialization clause and that is where we create 
    the counter ,(var i=0;), the second part is  the condition clause , the for loop
    will be executed as long as the  condition is  valid (I < 10;) and  the third
    part is the iteration clause  where we increase or decrease the counter as the
    case may be (i++).  And statements of code within the curly braces will be executed
    repeatedly. Note that i is just a variable you can use any thing


    ### Foreach Loops


    This is used to iterate over elements of innumerable objects that is anything
    that has some kind of list or array nature.. The syntax for foreach loop is


    foreach (var number in numbers)


    {


    }


    Here we have the temporary variable number, in keyword and list to iterate over
    numbers. Assuming that numbers is a list of integers, in every iteration the number
    will hold the current value in the list.


    ### While Loops


    While (k < 10)


    {


    ....


    k++;


    }


    In while loop there is a condition which as long as it is valid the loop will
    execute. Typically, we have a counter which is initialized and increment or decremented
    as the loop is executed. It is a bit similar to for loop but the syntax is different.


    ### Do-While Loops


    do{


    {


    ......


    i++;


    } while (i< 10);


