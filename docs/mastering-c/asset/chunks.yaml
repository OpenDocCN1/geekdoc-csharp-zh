    # Conditional Statements


    ![image](d2d_images/chapter_title_below.png)


    We have the following conditional statements in C#:


    ### If / else Statements


    Here is the basic structure in If / else statement


    If(condition)


    SomeStatement


    Else if(anotherCondition)


    anotherStatement


    else


    yetAnotherStatement


    so in if we always have a (condition) in parenthesis that will be executed if
    the condition is true  and we can optionally have the else if  and optionally
    the else which  will be executed if other earlier conditions are not met .


    we can also have nested  If Statements


    If(condition)


    {


    If(anotherCondition)


    // some statement


    else


    Try to avoid using multiple nested if else statements in your code to avoid make
    your code unreadable and hard to maintain.


    ### Switch / Case


    In switch, we have a variable whose value is used to compare the values of other
    variables in the cases, in the switch example below the variable is state, which
    is an enumeration. There are two case statements that is evaluated am comparing
    the value of state if it is Active the statements or actions within that case
    is executed , if none of these conditions are met the default is executed .


    Switch(state)


    {


    case State.Active


    someStatement


    break;


    case State.Inactive


    someStatements


    break;


    default:


    someStatement


    break;


    } :


    Let see an example of IF /Else statement in action


    ![image](d2d_images/image055.png)


    The above code is quite self-explanatory. Now we can use the conditional operator
    in place of If/else. Check out the following code snippet


    Bool isSuperCustomer=true;


    float price;


    if(isSuperCustomer)


    price =20.12f;


    else


    price = 30.23f;


    The above code can be rewritten using conditional operator like this


    float price =(isSuperCustomer )? 20.12f: 30.23f;


