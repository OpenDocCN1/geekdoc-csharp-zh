    # 第十四章


    ## 4. 将数据库中的视频记录状态更改为“处理中”。


    这些步骤中的每一个都可以表示一个活动。为了本次练习的目的，请不要担心这些复杂性。只需在你的每个活动类中直接使用 `Console.WriteLine()`
    即可。


    你的重点应该是将工作流发送到工作流引擎，让它运行工作流以及内部所有的活动。我们并不关心具体的活动。


    # C# 泛型


    C# 泛型功能是在 C# 2.0 中引入的，用于解决装箱（boxing）和拆箱以及类型转换导致的性能开销问题。因此，它提高了性能并促进了代码的可重用，从而消除了代码重复并确保了我们应用程序的类型安全。为了理解这一点，假设我们想创建一个列表来存储数字列表。下面是一个基础列表的简单实现。我们可以有一个
    `Add()` 方法来添加指定的数字，以及有一个 `Indexer` 方法来返回指定索引处的数字。


    现在，如果你想在列表中存储一本书，上面的类将无法工作。因此，我们必须创建另一个类并将其命名为 `BookList`，它将有一个 `Add()` 方法，接受书类对象作为参数，还有一个类型为
    `Book` 的索引器。


    现在的问题是，对于每种类型我们都必须创建一个列表，这导致了大量的代码重复且效率低下。更重要的是，如果出现 Bug，我们必须在多个地方进行修复，因此解决此问题的一种方案是使用如下所示的
    object 列表。


    由于 `object` 是 `.Net` 中所有类型的父类，因此我们可以轻松地将任何类型传递给此方法，并从此索引器中获取任何对象。然而，这里还有另一个问题，即性能。如果我们使用此类来存储值类型（如整数），每当我们向此列表插入一个值类型时，它都必须经过装箱才能以对象的形式存储，而每当我们访问这个值时，它都必须经过拆箱，这会带来性能开销。


    即使你使用引用类型，当我们想要将一个对象（例如书）转换为对象（或反之）时，这种类型转换再次产生性能开销，因此泛型作为解决这一问题的解决方案运而生。通过泛型，我们只需创建一个类并多次复用它，它不会有像上面
    object 列表那样的性能开销。


    泛型 List 类示例


    现在泛型有一个参数，该参数被指定为 `<T>`，是 template 的缩写，如下所示。我们也创建了 `Add()` 方法，但不是传递书类的对象或其他任何参数，而是传递
    `T`，该类的用户可以决定 `T` 的取值。


    让我们看看如何使用上述类。


    我们回到 `Program.cs`，在这里我们使用泛型 `List` 类来生成一个数字列表，并可以使用相同的 `GenericList` 来存储书籍，如下所示。你也可以看到，在运行时，对于数字情况，`Add()`
    方法将 `int` 作为参数传递；对于 `Book` 情况，则将 `Book` 类的对象作为参数传递。


    所以你会发现，我们在没有性能开销的情况下获得了代码的可重用性，因为在运行时，我们的 `GenericList` 直接接收所需的实际参数，没有类型转换或装箱。这是创建泛型类的基础，但在实际操作中，你将是使用现有的泛型类，而不是自己创建一个。很少会遇到需要创建一个泛型类而不是使用
    `.Net` 中现有泛型列表的情况。此外，你可以在 `System.Collections.Generic` 命名空间中找到 `.Net` 中所有的泛型集合。


    # 每个 C# 开发者必须掌握的最实用 C# 集合


    ## List<T>


    它显示了一个可以通过索引访问的对象列表。`<T>` 是 Template 的缩写，意味着这是一个泛型列表。在大小方面，列表与数组不同；数组的大小是固定的，而列表可以动态增长。因此，它们也被称为动态数组或向量（vectors）。在内部，为了存储，列表使用数组。但是当它填满时，它会创建一个更大的数组，并将现有数组中的项传输到新创建的数组中。如今即使你处理的是固定数量的对象，使用列表也比数组更好。


    创建列表：


    ```csharp

    var list = new List<int>();

    ```


    如果你预先知道想在列表中存储大量项，可以初始化大小，如下：


    ```csharp

    // 创建一个初始化了大小的列表

    var list = new List<int>(20000);

    ```


    你可以对列表执行的一些有用操作有：


    ```csharp

    // 在列表最后一个项之后添加一个项

    list.Add(4);


    // 在索引 0 处插入一个项

    list.Insert(4, 0);


    // 从列表中删除一个项

    list.Remove(1);


    // 删除索引为 0 的项

    list.RemoveAt(0);


    // 返回索引 0 处的项

    var first = list[0];


    // 返回项的索引或位置数字

    var index = list.IndexOf(4);


    // 检查列表中是否存在某项

    var contains = list.Contains(4);


    // 返回列表中项的总数

    var count = list.Count;


    // 遍历或循环列表中的所有对象

    foreach (var item in list)

    Console.WriteLine(item);

    ```


    现在，让我们分析这些操作中的 List 性能


    ### 在列表的开头或中间添加或删除项


    当我们在列表开头或中间添加或删除项时，必须移动一个或多个项的位置。我们使用大 O 符号来指定此操作的代价。在最坏的情况下，当我们在最开始删除或添加时，意味着列表中的所有元素都移动了。大
    O 符号为 `O(n)`，这意味着它是线性增长，意味着随着输入规模的增加，执行时间也会增加，算法的执行时间与 n 成正比。


    ### 在末尾添加或删除项


    在列表末尾添加或删除项是一个速度很快的操作，且与列表的大小无关。现有项不需要移动或偏移。因此，执行时间是相对常定的，并且与列表中项的数量无关。大 O 符号为
    `O(1)`；其中 1 意味着常数。


    ### 搜索项


    当 `IndexOf()`、`Contains()` 和 `Find()` 等方法用于在列表中搜索时，执行的是线性搜索。因此，它会循环或遍历列表的所有元素，当找到匹配项时返回它。在最坏的情况下，如果该项位于列表末尾，则需要在找到精确项之前搜索或扫描列表中的所有项。因此大
    O 符号为 `O(n)`。


    ### 通过索引访问项


    通过索引访问项是 List 非常擅长的。因此，大 O 符号为 `O(1)`。它是常数。


    总结来说，如果你需要根据列表开头、中间或末尾以外的其他标准来搜索项（例如根据 ID 为 4567 的订单），使用 `Dictionary` 是最好的。


