    的默认方法，它是应用程序的入口，一切都从这里开始。该方法被声明为 `static`，这是我们稍后会学习的内容；方法有输入和输出；括号内的是输入，我们之为 `parameters`（参数）或
    `arguments`（参数）。知道参数是可选的，但在这种默认模板情况下，`Main` 方法有一个名为 `args` 的参数，类型为 `string array`，我们稍后也会学习；在方法名
    `Main()` 之前看到的是返回类型或输出，在这种情况下是 `void`，这意味着该方法不返回任何值，它只包含一些代码。


