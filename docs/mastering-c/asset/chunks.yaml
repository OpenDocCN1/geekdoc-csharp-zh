    # LINQ


    ![image](d2d_images/chapter_title_below.png)


    LINQ stands for Language Integrated Query. It is one the features that came with
    C# 3.0.


    It gives you the capability to query objects in C# natively. With LINQ, you can
    query Objects in memory, e.g. collections (LINQ to Objects), databases (LINQ to
    Entities), XML (LINQ to XML), ADO.Net Data Sets (LINQ to Data Sets).


    Let see see LINQ in actions, let see a simple `BookRepository` class with two
    properties `Title` and `price` and a method called `GetBooks` that return `IEnumerable`
    of book.


    ![image](d2d_images/image154.png)


    In our `program.cs`, we simply instantiate the `BookRepository` and call the `GetBooks`.
    let say we want to display the books that are cheaper than 10 dollars, without
    using LINQ, we will need to iterate through the book collection to get those that
    meet the condition and iterates through selected list and display as shown below.


    ![image](d2d_images/image163.png)


    The output will be:


    ![image](d2d_images/image128.png)


    But with LINQ we can get rid of the above code and use a fewer lines of code to
    achieve the above as shown below the yellow painted code shows how LINQ is used
    in `where` clause a lambda expression is used to determine those books that are
    cheaper than 10 dollars.


    ![image](d2d_images/image148.png)


    The same output will be given:


    ![image](d2d_images/image052.png)


    LINQ also has another method called `OrderBy` and we can chain LINQ methods together
