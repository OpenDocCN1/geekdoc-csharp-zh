    ### Methods


    Signature of a method contains the name, number and order of its parameters.


    For example,


    Public class Point


    {‘


    Public void Move (int x, int y){}


    }


    ### Overloading Methods


    Overloading a method means having a method with the same name but with different
    signatures. This makes it easier for the callers of the method to choose the more
    suitable signature depending on the type of data they have to pass to the method.


    Public class Point


    {


    Public void Move (int x, int y) {} //two parameters that are integer


    Public void Move (Point newLocation ){} // a class type as a parameter


    Public void Move(Point newLocation, int speed){} // a class type and an integer 
    as parameters


    }


    ### Method Demo


    Let create a class Point with some methods overloading


    ![image](d2d_images/image122.png)


    Let go to Program.cs and initialize this class and call the methods above


    ![image](d2d_images/image024.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Write this snippet of code in your visual studio and run it.


    ### Fields


    A ﬁeld can be initialized in two ways: In a constructor, or directly upon declaration.
    The beneﬁt of initialising a ﬁeld during declaration is that if your class has
    one or more constructors, you’ll make sure that the ﬁeld will always be initialised
    irrespective of which constructor is going to be called Field Initialization


    We can initial a field within a constructor like this


    Public class customer


    {


    List<Order> Orders;


    Public Customer()


    {


    Orders = new List<Order> ();


    }


    }


    Another to initialize is outside the constructor


    Public class customer


    {


    List<Order> Orders = new List<Order> ();;


    }


    Read-only Fields


    We can declare a field  with a readonly  modifier to make sure that the field
    is assigned only once  we use readonly fields to create some kind of safety in
    application and to improve the  application robustness  for example take a look
    at  the customer class  I have a list of orders that is readonly ,if as a developer
    I  accidentally try to initialize this list in another method  the data I have
    in this order object will not be lost.


    We use the readonly modiﬁer to improve the robustness of our code. When a ﬁeld
    is declared with readonly, it needs to be initialized either during declaration
    or in a constructor. The value cannot be changed. This prevents you from accidentally
    overwriting the value of a ﬁeld, which can result in an unexpected state. As an
    example, think of the Orders in the above example. If we accidentally re-initialize
    this ﬁeld somewhere else in the class, all the Order objects stored in the list
    will be lost. So we should declare it as readonly


    Public classs Customer


    {


    Readonly List<Order> Orders = new List<Order> ();


    }r


    Access Modifiers


    Access modifier is a way to control access to a class and /or its members  the
    reason for this control is to create some kind of safety in our programs and improve
    robustness for example ,in our Customer class  if we the following


    Public class Customer


    {


    Private string Name;


    }


    In our program.cs  we have the following code


    var john = new Customer


    John.Name;.


    This won’t compile because the field Name is private and can only be access within
    the Customer class. So usually fields in a class are private and can be accessed
    using the public methods called getters and setters. This is also the concept
    behind encapsulation which is information hiding. We will look at it later in
    this book


    In C# we have 5 access modiﬁers: public, private, protected, internal and protected
    internal. - A class member declared with public is accessible everywhere. - A
    class member declared with private is accessible only from inside the class. -
    We’ll learn about the other access modiﬁers when we get to the inheritance. -
    We use access modiﬁers to hide the implementation details of a class. So anything
    that is about “how” a class does its job should be declared as private. This way,
    we make sure other parts of the code will not touch the implementation detail
    of a class. And as a result we improve the robustness of our code. If change the
    implementation of a class, we only need to make changes inside the class. No other
    parts of the code will need to be changed.


    Access Modifiers Demo  with getter and setter methods


    ![image](d2d_images/image085.png)


    Run this code and see the result


    Properties


    A property is a class member that encapsulates a getter/ setter method for accessing
    a field.


    As a best practice, we must declare ﬁelds as private and create public properties
    to provide access to them. - A property encapsulates a get and a set method:


    We need a property to create a getter and a setter with less code for example
    in the previous demo we had the code below the getters and the setter for the
    field _birthdate in the person class


    ![image](d2d_images/image079.png)


    . Imagine we have ten fields in that class we will end up writing like twenty
    setter and getter methods for each of them and that will make our code too large
    and that is not very efficient. Instead we can the same thing as the above code
    with property.. So with property the code will look like this below


    ![image](d2d_images/image040.png)we can also use the auto implemented properties
    to rewrite the above like this


    ![image](d2d_images/image002.png)


    When C# compiler see the above code, internally it will create the private field
    in the class.


