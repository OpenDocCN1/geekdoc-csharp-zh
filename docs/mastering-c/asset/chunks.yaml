    \n注意这里的 `\\n` 和双反斜杠 (`\\\\`)）。我们可以使用逐字字符串来重写这个字符串，通过在我们的字符串前加上 `@` 符号，并去掉转义字符：\n\
    \n```csharp\nvar message = @“Hello Dennis;\nLook into this folder path: c:\\folder1\\\
