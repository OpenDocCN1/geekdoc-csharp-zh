    # Chapter Two


    ## Primitive Types and Expressions


    In this chapter, we are going to start our journey in learning `C#`, so I will
    introduce you to variables and constants, various data types and type conversion,
    scope and overflowing and finally we will discuss the various operators that we
    have in `C#`.


    ### Variables and Constants


    #### Variables

    Variables are names given to storage locations in memory. We use variables to
    store values temporarily in memory. In `C#`, to declare a variable we start with
    a data type follows by an identifier and end with a semicolon (`;`) as shown below:


    ![image](d2d_images/image117.png)


    Here `int` represents the integer type, and `Number` is the identifier for our
    variable. Note that `C#` is case Sensitive, therefore, these two variables are
    different, because one has uppercase `N` and the other lower case `n`. When declaring
    a variable you can optionally initialize it as seen above but note that you cannot
    use a variable unless you initialize it as you see in the second example. Otherwise,
    the code will not compile.


    #### Constants

    Constants are immutable values; values we know that at compile time those values
    will not change throughout the life of the applications. Why do we use `Constants`?
    The reason is simple; to create safety in our application, especially in situations
    where we need to ensure that a value does not change.. Imagine in your application,
    you have this number called `Pi = 3.14;` which is used to calculate the area of
    a circle. That number should always be the same in our program we do not want
    to change it accidentally otherwise our results will be inaccurate. Therefore,
    we declare this number as a constant.


    To declare a constant, we used the keyword `const` followed by the data type and
    the identifier and we must initialize like this: ```csharp

    const float Pi = 3.14;

    ```


    ### Points to Note about Identifiers

    - Identifier cannot start with a number; for example this cannot be an identifier:
    `1route` ![image](d2d_images/image152.png) but this one `Route` is acceptable
    ![image](d2d_images/image158.png)

    - It cannot include white space like this `first Name` but `firstName` is acceptable.

    - It cannot use a reserved keyword like `int` but if you are so desperate to used
    any of the reserved keyword, then you can prefix that with `@` sign like this
    `@int`.

    - Use meaningful name avoid doing this `fn` instead of `firstName`.


    ### Naming Conventions in C#

    In `C#`, to name your local variables: Use Camel case like this: `string firstName
    = “Dennis”;`

    And for your constant variables use Pascal case: `const int Zoom = 5;`


    ### Primitive Types

    Here is the list of most commonly used types in `C#`: Integral Numbers, Real Numbers,
    Character and Boolean. Note that in `.Net` framework they are mapped to data types.
    The third column “Bytes” shows the number of bytes each data type uses and the
    fourth column “Range” show the number of values data type can store.


    ![image](d2d_images/082.png)


    #### Integral Numbers

    In the table above, the Integral numbers are `byte`, `short`, `int` and `long`.
    As you can see in the table `byte` is the smallest it takes only 1 byte while
    `long` is the largest it takes 8 bytes. The larger the number of bytes the more
    storage we have.

    - `byte` maps to `Byte`

    - `short` maps to `Int16`

    - `int` maps to `Int32`

    - `long` maps to `Int64`


    #### Real Numbers

    In Real numbers, we have `float`, `double` and `decimal`. In .Net framework:

    - `float` maps to `Single` and it takes 4 bytes and stores large number

    - `double` maps to `Double` and is twice the size of `float`, it takes 8 bytes

    - `decimal` maps to `Decimal` and it take 16 bytes, the more precision you need
    the bigger datatype you use


    #### Character and Boolean

    In `C#`, we have character which is represent by the keyword `char`, and they
    are Unicode; `bool` which represent Boolean which can be either true or false.


    ### Data Types Declaration and initialization Examples


    #### Integral Numbers

    ```csharp

    Int c; // this is only declaration

    Int a = 18; // this is declaration and initialization

    Int b = 6;

    c = a + b; // this is assignment of value to the variable c which is of integer

    Console.WriteLine(c);

    ```


    #### Real Numbers

    By default in `C#`, `double` is used for real numbers by the C# compilers, so
    if you want to use the data type like `float` and `decimal`, you need to explicitly
    tell the compiler to treat the number you have as a `float` or `decimal` by declaring
    it in this way for example:

    ```csharp

    float number = 1.2f; // by adding this suffix am telling the compiler to treat
    as a float

    decimal number = 1.2m; // the suffix m tells the compiler to treat the number
    as decimal

    ```


    #### Character and Boolean

    ```csharp

    char chA= ‘A’;

    char chB= ‘B’;

    Console.WriteLine (chA.Equal( ‘A’)); // output :  “True”

    Console.WriteLine (‘b’.Equal(chB)); // output :  “False”

    ```

