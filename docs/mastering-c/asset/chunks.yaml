    - 我们使用访问修饰符来隐藏类的实现细节。因此，任何关于类“如何”执行工作的内容都应该声明为 `private`。这样，我们就可以确保代码的其他部分不会触碰类的实现细节。结果是我们提高了代码的健壮性。如果更改了类的实现，我们只需要在类内部进行更改。代码的其他部分将不需要更改。\n\
