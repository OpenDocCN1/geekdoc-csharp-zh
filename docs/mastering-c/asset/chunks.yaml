    ## Boxing and Unboxing


    C# types are divided into two categories: value types and reference types. - Value
    types (e.g. `int`, `char`, `bool`, all primitive types and `struct`) are stored
    in the stack. They have a short life time and as soon as they go out of scope
    are removed from memory. - Reference types (e.g. all classes) are stored in the
    heap. Every object can be implicitly cast to a base class reference. The object
    class is the parent of all classes in `.NET Framework`. So a value type instance
    (e.g. `int`) can be implicitly cast to an `object` reference.


    Boxing is the process of converting a value type instance is converted to an object
    reference


    ```csharp

    Int number =10;

    Object obj = number;

    // or

    Object obj = 10;

    ```


    Unboxing is the opposite: when an object reference is converted to a value type.


    ```csharp

    Object obj = 10;

    Int number = (int)obj;

    ```


    Both boxing and unboxing come with a performance penalty. This is not noticeable
    when dealing with small number of objects. But if you’re dealing with several
    thousands or tens of thousands of objects, it’s better to avoid it.


