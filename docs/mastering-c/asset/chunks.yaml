    # INTERFACES


    ![image](d2d_images/chapter_title_below.png)


    An interface is a language construct that is similar to a class (in terms of syntax)
    but is  fundamentally different.


    An interface is simply a declaration of the capabilities (or services) that a
    class should provide.


    Here is how we declare an interface instead of using the class keyword we use
    the interface keyword and know that in .Net all interfaces starts with the letter
    I. it is a convention as seen in the below example


    public interface ITaxCalculator


    {


    int Calculate();


    }


    Unlike a class, interface does not have an implementation. So you see in the example
    above we have a method called Calculate (), it is simply a decoration, it doesn’t
    have an implementation and it also doesn’t have an access modifier 


    This interface states a class that wants to play the role of a tax calculator,
    should


    provide a method called Calculate() that takes no parameters and returns an int.
    The


    implementation of this class might look like this:


    public class TaxCalculator : ITaxCalculator


    {


    public void Calculate() { ... }


    }


    - So an interface is purely a declaration. Members of an interface do not have


    implementation.


    - An interface can only declare methods and properties, but not fields (because
    fields are about implementation detail).


    - Members of an interface do not have access modifiers.


    ### Why Interface?


    - Interfaces help in  building loosely coupled applications. We reduce the coupling
    between two classes by putting an interface between them. This way, if one of
    these classes changes, it will have no impact on the class that is dependent on
    that (as long as the interface is kept the same).


    Let Look at this analog to help us understand it better. Think of the concept
    of a restaurant and a chef Let say the restaurant  needs a chef with certain capabilities
    , by that definition you can fill that role with anyone that has those capabilities
    as a chef  in the restaurant, so the dependency between the restaurant and the
    Chef is loose. If something happens to that chef, like he gets sick or he resigns
    we can get someone else to fill the role. Now in contrary, if we say a restaurant
    need John as a Chef that means the restaurant is very dependent on John. If something
    happen to John or decide not to come to work, then the restaurant is in trouble.
    So this is a definition of a tightly coupled dependency. That is the restaurant
    is tightly coupled to John.


    But in software development, it is the best practice to build an application that
    its components or classes are loosely coupled, so that changes made to one class
    will have minimum or zero impact on other classes or components.  .


    ### Interfaces and Testability


    Unit testing is part of the automated practice which helps improve the quality
    of our


    code. With automated testing, we write code to test our own code. This helps catching
    bugs early on as we change the code .


    In order to unit test a class, we need to isolate it. This means: we need to assume
    that every other class in our application is working properly and see if the class
    under test is working as expected.


    A class that has tight dependencies to other classes cannot be isolated.


    To solve this problem, we use an interface. Here is an example:


    public class OrderProcessor


    {


    private IShippingCalculator _calculator;


    public Customer(IShippingCalculator calculator)


    {


    _calculator = calculator;


    }


    }


    - So here, OrderProcessor is not dependent on the ShippingCalculator class. It’s
    only dependent on an interface (IShippingCalculator). If we change the code inside
    the ShippingCalculator (eg add a new method or change the method  implementations)
    it will have no impact on OrderProcessor (as long as the interface is kept the
    same).


    ### Interfaces and Extensibility


    We can use interfaces to change our application’s behaviour by “extending” its
    code(rather than changing the existing code).


    If a class is dependent on an interface, we can supply a different implementation
    of


    that interface at runtime. This way, the behaviour of the application changes
    without


    any impact on that class.'
