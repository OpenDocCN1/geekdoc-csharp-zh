    # Arrays and Lists


    ![image](d2d_images/chapter_title_below.png)


    Earlier, we learn a little bit about arrays, here we want to have a deeper look
    at it. We said before that array represent a fixed number of variables of a particular
    type. In C#, we have two types of arrays: Single Dimension array and Multi-Dimensional
    arrays like a matrix.


    ## Single Dimension Arrays


    ```csharp

    var numbers = new int[5];// where the length is 5


    var numbers = new int[5]{1,2,3,4,5}; // this was initialized with its elements

    ```


    ## Multi Dimension Arrays


    We have two types of multi-dimensional arrays in C#; Rectangular and Jagged arrays.


    ![image](d2d_images/image099.png)


    In a rectangular array, each row has the exact number of columns as seen above.


    ## ![image](d2d_images/image157.png)


    In the Jagged array, the number of column in each row can be different. Another
    way to look at jagged array is to see it as the array of an arrays i.e. a single
    dimension array where each element is a single dimension array.


    Example of Rectangular array (2 Dimensional array) syntax:


    ```csharp

    var matrix =  new int[3,5]; // this means  array with 3 rows and five columns


    var matrix = new int[3,5]

    {

    {1,2,3,4,5},

    {5,10,15,20,25},

    {1,5.10,15,20}

    };

    ```


    If the element of the array is known at the point of creating the array, we use
    the initialization object ({}) to initialize it.


    To access element in this array we do it this way:


    ```csharp

    var element = matrix[0,0]; where the 0’s are the index of the row and column respectively

    ```


    Syntax for rectangular 3 dimensional array


    ```csharp

    Var colors = new int[3,6,4];

    ```


    ### Jagged Syntax


    We use two squared brackets to represent a jagged array.


    ```csharp

    var array = new int[3][];

    ```


    In the first square bracket you specify the number of the elements in the top
    level array.


    Now we need to initialize the top level array:


    ```csharp

    array[0] = new int[4];

    array[1]= new int [5];

    array[2] = new int[3];

    ```


    The `Array` class has several methods. Let''s see them:


    ```csharp

    var numbers = new int[5]{1,2,3,4,5};


    // Length

    Console.WriteLine(numbers.Length);


    // IndexOf

    int index = Array.IndexOf(numbers, 9);

    Console.WriteLine("Index of 9: " + index);


    // Clear

    Array.Clear(numbers, 0, 2);


    // Copy

    int[] another = new int[3];

    Array.Copy(numbers, another, 3);


    // Sort

    Array.Sort(numbers);

    Console.WriteLine("Sorted array:");


    // Reverse

    Array.Reverse(numbers);

    Console.WriteLine("Reverse of array:");

    ```


    Note that all these methods are static methods is why we use the `Array` name
    to call them.

