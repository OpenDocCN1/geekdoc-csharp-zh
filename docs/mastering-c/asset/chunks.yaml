    # Working with Text


    ![image](d2d_images/chapter_title_below.png)


    In this section, we want to take a closer look at C# strings. Earlier in this
    course you learnt that the String keyword maps to a String class in C#  we also
    learnt that strings re immutable which means that once you create them you cannot
    change them  so we are going to be looking at useful String methods , converting 
    a string to a number and vice versa.


    ### String Formatting


    ToLower(): This method converts all characters to a lower case  for example  //”:hello
    dennis”


    ToUpper(): This method converts all character to upper case. //” HELLO DENNIS”


    Trim(): This method eliminates whitespace around a string , this is useful  when
    capturing user input .


    ### Searching


    To search for a character or string in a given string you can use the methods
     


    IndexOf()  and  LastIndexOf(), they return the index and  the last appearance
    of a given  character or string  respectively . IndexOf(‘a’) , LastIndexOf(‘Hello’)


    ### SubStrings


    If you want to create a substring from a given string you use the substring method
    this method has a lot of overload s


    Substring(startindex): returns the characters from the starting index to the end
    of the string.


    SubString(startiIndex, length): This takes in a length argument in order to limit
    the number of characters retrieved.


    ### Replacing


    If you want to replace a given title or a substring in a string you use the Replace
    method.


    Replace (‘á’, ‘! ‘)


    ### Null Checking


    We have a couple methods in C# that checks if an object or a variable is null
    or empty.


    String.IsNullOrEmpty(str)


    String.IsNullOrWhiteSpace(str)


    ### Splitting


    To split a string, use the Split () method for example Str. Split (‘’). The split
    method takes in a delimiter as in this example am splitting a string using a space


    ### Converting Strings to Numbers


    There are different ways to do it as follows:


    String s = “1234”;


    Int I = int.parse(s);


    Int j = Convert.ToInt32(s);


    It is better to use Convert class because if the string is null, it will return
    the default value which in this case 0\. Where as int.parse throws an exception..
    it is safer to use Convert methods


    ### Converting Numbers to Strings


    Int k = 1234;


    String s = k.ToString(); // “1234”


    String t = k.To String(“C “); // “$1,234.00”


    String h = i.ToString( “C0”); // “$1,234”


    ![image](d2d_images/image125.png)


    ### String Demo


    ![image](d2d_images/image021.png)


    Note we also have a class StringBuilder that is used for string manipulations.
    it has useful methods  like


    Append(): To add something to the end of the string.


    Insert(): To insert something at a given index.


    Remove(): to remove a character or string at a given index.


    Replace() : to replace a character or string  with another character or string
    and


    clear().: To clear the whole text..


