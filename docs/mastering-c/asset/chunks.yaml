  trans: "\n\n# 第九章\n\n- `Exists()`: 检查文件是否存在。\n- `GetAttributes()`: 返回文件的所有属性。\n\
    - `Move()`: 将文件从一个位置移动到另一个位置。\n- `ReadAllText()`: 读取文件中的文本。\n\n## Directory, DirectoryInfo\n\
    \n它们与 `File`, `FileInfo` 类似。`DirectoryInfo` 提供了实例方法，而 `Directory` 提供静态方法。它们的方法包括：\n\
    \n- `CreateDirectory()`: 创建目录。\n- `Delete()`: 删除目录。\n- `Exists()`: 检查目录是否存在。\n\
    - `GetCurrentDirectory()`: 返回当前目录。\n- `GetFiles()`: 返回目录中的文件。\n- `Move()`: 将文件从一个目录移动到另一个目录。\n\
    - `GetLogicalDrives()`: 返回硬盘的逻辑驱动器，如 `C` 盘。\n\n## Path\n\n具有以下方法：\n\n- `GetDirectoryName()`:\
    \ 获取目录名。\n- `GetFileName()`: 获取文件名。\n- `GetExtension()`: 获取路径或文件的扩展名。\n- `GetTemPath()`:\
    \ 获取文件夹的临时路径。\n\n## File, FileInfo Demo\n\n![image](img/image120.png)\n\n## Directory\
    \ DirectoryInfo Demo\n\n![image](img/image019.png)\n\n要了解更多信息，请访问 Google 并输入 `file\
    \ info class C#`。\n\n## Path Demo\n\n![image](img/image064.png)\n\n## 练习\n\n1.\
    \ 编写一个程序读取文本文件并显示单词数。\n2. 编写一个程序读取文本文件并显示文件中最长的单词。\n\n## Classes\n\n我们将从学习类（Classes）开始我们的旅程，在本节中，我将向你介绍类的基础。\n\
    \n- 什么是类？\n- 类的现实世界示例\n- 什么是对象以及它与类有什么区别。\n- 静态成员\n\n## Class\n\n类仅仅是软件应用程序的构建块，因此在现实世界中，一个应用程序由多个类组成。每个类负责应用程序中的特定行为，或者所有这些类共同产生应用程序预期的行为。简单来说，类封装了数据（存储在\
    \ `fields` 中）和行为（由 `methods` 定义）。\n\n![image](img/image175.png)\n\n## Real World\
    \ example\n\n假设我们想要实现一个像博客引擎那样的应用程序，典型的软件或应用程序至少包含三层：表示层、业务逻辑层和数据访问层。在每一层中，我们都可以拥有类，每个类负责某些特定的内容\n\
    \n![image](img/image123.png)\n\n例如，在表示层，我们可以有一个名为 `PostView` 的类，它专门负责向用户展示帖子；在业务逻辑层，我们可以有一个关于帖子本身的类；最后，持久层或数据访问层将有一个类，可以将帖子保存到数据库或从数据库加载帖子。\n\
    \n## Anatomy of a Class\n\n类有两个部分，即：\n\n- 数据（由 `fields` 表示）\n- 行为（由 `methods /\
    \ functions` 表示）\n\n以下是如何用统一建模语言（UML）演示类：\n\n![image](img/image038.png)![image](img/image020.png)![image](img/image034.png)![image](img/image036.png)\n\
    \n## Another example\n\n![image](img/image071.png)![image](img/image072.png)![image](img/image035.png)![image](img/image006.png)\n\
    \n## Object\n\n对象在根本上与类不同。对象本质上是位于内存中的类实例。在上面的 `Person` 类中，我们可以拥有如 `John`、`Mary\
    \ Ann` 等作为 `Person` 类的实例。`Person` 类型或 `person` 类定义了我们创建创建对象的蓝图。在运行时，内存中的这些每个对象彼此相互通信，从而获得应用程序预期的结果或行为。\n\
    \n## Declaring Classes\n\n在 `C#` 中，类的声明如下：访问修饰符后后跟 `class` 关键字和类名，以及用于包裹的大括号，类的方法和字段定义在大括号内，如下所示：\n\
    \n```csharp\npublic class Person\n{\n    public string Name;\n\n    public void\
    \ Introduce () // 方法用访问修饰符、返回值、名称和 () 声明\n    {\n        Console.WriteLine(\"\
    Hi my name is \"+ Name);\n    }\n}\n```\n\n## Creating Objects\n\n我们使用类的类型后跟标识符，然后使用\
    \ `new` 运算符来初始化类的实例，如下：\n\n```csharp\nPerson person = new Person ();\n```\n\n\
    编写上述内容的更简短方法是使用 `var` 关键字：\n\n```csharp\nvar person = new Person ();\n```\n\n\
    ## Using Objects\n\n现在我们有了一个对象，可以访问对象的成员。\n\n在我们的 `person` 对象中，我们可以访问名称并给它赋值，还可以访问\
    \ `introduce()` 方法，如下所示：\n\n```csharp\nvar person = new Person();\nperson.Name\
    \ = \"Dennis\";\nperson.introduce();\n```\n\n## Class Members\n\n我们有两种类型的成员：实例成员和静态成员。\n\
    \n**Instance Members**：它们可以通过对象访问。例如：\n\n```csharp\nvar person = new Person();\n\
    person.introduce();\n```\n\n**Static members**：可以通过类访问。例如，我们不需要拥有 `Console` 类的实例就可以使用\
    \ `WriteLine()` 方法，相反，我们使用类名 `Console` 调用它。\n\n```csharp\nConsole.WriteLine();\n\
    ```\n\n### 为什么使用静态成员？\n\n为了表示单例概念，这意味着在内存中应该只有一个该类的实例。如 `DateTime.Now` 和 `Console.WriteLine()`。\n\
    \n## Declaring Static Members\n\n要将成员定义为静态，你所需要的就是访问修饰符后使用 `static` 关键字，你可以在类的任何成员上声明静态。\n\
    \n```csharp\npublic class Person\n{\n    public static int peopleCount = 0;\n\
    }\n```\n\n## Class Demo\n\n![image](img/image089.png)\n\n## Constructors\n\n构造函数是在类实例创建时被调用的方法。我们使用构造函数将对象处于初始状态，即初始化类中的某些字段。我们并不总是需要构造函数，但如果我们需要在创建时初始化对象，就可以使用构造函数来实现。\n\
    \n## Constructor Declaration\n\n构造函数的名称与类完全相同，这是一个要求，而且它没有返回值类型，甚至没有 void。\n\n\
    ```csharp\npublic class Customer\n{\n    public Customer () 默认构造函数\n    {\n  \
    \  }\n}\n```\n\n第二个示例：\n\n```csharp\npublic class Customer\n{\n    public string\
    \ Name;\n    public Customer (string name)\n    {\n        This.Name = name;\n\
    \    }\n}\n```\n\n## Constructor Overloading\n\n构造函数可以重载。重载意味着具有相同名称但不同签名的方法。签名是唯一标识方法的方法：返回值类型、名称以及参数的类型和数量。在构造函数中，我们可以有如下不同的签名：\n\
    \n```csharp\npublic class Customer\n{\n    public Customer () {...} // 这不接受参数，默认构造函数\n\
    \    public Customer (string name) {...} // 这只接收一个字符串参数\n    public Customer (int\
    \ id, string name) {...} // 这接收两个参数\n}\n```\n\n我们重载是为了让类的初始化变得简单。\n\n## Constructor\
    \ Demo\n\n在 Visual Studio 的控制台项目中创建一个名为 `customer` 的独立类，并定义构造函数的不同签名或重载构造函数。\n\
    \n![image](img/image005.png)\n\n在我们的 `program.cs` 中，我们可以初始化类并使用接收两个参数 `{Id` 和\
    \ `name}` 的自定义构造函数之一来为类对象的成员赋值，如下所示：\n\n![image](img/image001.png)\n\n"
- fmt: "\nThis is a syntax for quickly initializing an object without the need to\
    \ call one of its constructors.\n\nFor example:\n\n```csharp\nvar person = new\
    \ Person\n{\n    FirstName = \"Harry\",\n    LastName = \"White\"\n};\n```\n\n\
    ### Methods\nSignature of a method contains the name, number and order of its\
    \ parameters.\n\nFor example:\n\n```csharp\npublic class Point\n{\n    public\
    \ void Move (int x, int y){}\n}\n```\n\n### Overloading Methods\nOverloading a\
    \ method means having a method with the same name but with different signatures.\
    \ This makes it easier for the callers of the method to choose the more suitable\
    \ signature depending on the type of data they have to pass to the method.\n\n\
    ```csharp\npublic class Point\n{\n    public void Move (int x, int y) {} //two\
    \ parameters that are integer\n    public void Move (Point newLocation){} // a\
    \ class type as a parameter\n    public void Move(Point newLocation, int speed){}\
    \ // a class type and an integer as parameters\n}\n```\n\n### Method Demo\nLet\
    \ create a class `Point` with some methods overloading\n\n![image](d2d_images/image122.png)\n\
    \nLet go to `Program.cs` and initialize this class and call the methods above\n\
    \n![image](d2d_images/image024.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \nWrite this snippet of code in your visual studio and run it.\n\n### Fields\n\
    A field can be initialized in two ways: In a constructor, or directly upon declaration.\
    \ The benefit of initialising a field during declaration is that if your class\
    \ has one or more constructors, you’ll make sure that the field will always be\
    \ generalised irrespective of which constructor is going to be called.\n\n####\
    \ Field Initialization\nWe can initial a field within a constructor like this:\n\
    \n```csharp\npublic class customer\n{\n    List<Order> Orders;\n    public Customer()\n\
    \    {\n        Orders = new List<Order>();\n    }\n}\n```\n\nAnother to initialize\
    \ is outside the constructor:\n\n```csharp\npublic class customer\n{\n    List<Order>\
    \ Orders = new List<Order>();\n}\n```\n\n#### Read-only Fields\nWe can declare\
    \ a field with a `readonly` modifier to make sure that the field is assigned only\
    \ once. we use readonly fields to create some kind of safety in application and\
    \ to improve the application robustness for example take a look at the `customer`\
    \ class I have a list of orders that is readonly, if as a developer I accidentally\
    \ try to initialize this list in another method the data I have in this order\
    \ object will not be lost.\n\nWe use the `readonly` modifier to improve the robustness\
    \ of our code. When a field is declared with `readonly`, it needs to be initialized\
    \ either during declaration or in a constructor. The value cannot be changed.\
    \ This prevents you from accidentally overwriting the value of a field, which\
    \ can result in an unexpected state. As an example, think of the `Orders` in the\
    \ above example. If we accidentally re-initialize this field somewhere else in\
    \ the class, all the `Order` objects stored in the list will be lost. So we should\
    \ declare it as `readonly`.\n\n```csharp\npublic classs Customer\n{\n    readonly\
    \ List<Order> Orders = new List<Order>();\n}\n```\n\n#### Access Modifiers\nAccess\
    \ modifier is a way to control access to a class and/or its members the reason\
    \ for this control is to create some kind of safety in our programs and improve\
    \ robustness for example ,in our `Customer` class if we the following\n\n```csharp\n\
    public class Customer\n{\n    private string Name;\n}\n```\n\nIn our `Program.cs`\
    \ we have the following code:\n\n```csharp\nvar john = new Customer;\njohn.Name;\n\
    ```\n\nThis won’t compile because the field `Name` is `private` and can only be\
    \ access within the `Customer` class. So usually fields in a class are private\
    \ and can be accessed using the public methods called getters and setters. This\
    \ is also the concept behind encapsulation which is information hiding. We will\
    \ look at it later in this book\n\nIn C# we have 5 access modifiers: `public`,\
    \ `private`, `protected`, `internal` and `protected internal`.\n- A class member\
    \ declared with `public` is accessible everywhere.\n- A class member declared\
    \ with `private` is accessible only from inside the class.\n- We’ll learn about\
    \ the other access modifiers when we get to the inheritance.\n- We use access\
    \ modifiers to hide the implementation details of a class. So anything that is\
    \ about “how” a class does its job should be declared as `private`. This way,\
    \ we make sure other parts of the code will not touch the implementation detail\
    \ of a class. And as a result we improve the robustness of our code. If change\
    \ the implementation of a class, we only need to make changes inside the class.\
    \ No other parts of the code will need to be changed.\n\nAccess Modifiers Demo\
    \ with getter and setter methods\n\n![image](d2d_images/image085.png)\n\nRun this\
    \ code and see the result\n\n### Properties\nA property is a class member that\
    \ encapsulates a getter/ setter method for accessing a field.\n\nAs a best practice,\
    \ we must declare fields as `private` and create public properties to provide\
    \ access to them.\n- A property encapsulates a get and a set method:\n\nWe need\
    \ a property to create a getter and a setter with less code for example in the\
    \ previous demo we had the code below the getters and the setter for the field\
    \ `_birthdate` in the `person` class\n\n![image](d2d_images/image079.png)\n\n\
    . Imagine we have ten fields in that class we will end up writing like twenty\
    \ setter and getter methods for each of them and that will make our code too large\
    \ and that is not very efficient. Instead we can the same thing as the above code\
    \ with property.. So with property the code will look like this below\n\n![image](d2d_images/image040.png)\
    \ we can also use auto implemented properties to rewrite the above like\n\n![image](d2d_images/image02.png)\n\
    \nWhen C# compiler see the above code internally it will create the private field\
    \ in the class.\n\n#### Properties Demo\nLet create a class `person` with some\
    \ properties as below\n\n![image](d2d_images/image161.png)\n\nIn our `Program.cs`\
    \ we have the following code\n\n![image](d2d_images/image18.png)\n\nRun the codes\
    \ to see the result\n\n#### Indexers\n- Indexer is a special kind of property\
    \ that allows accessing elements of a list by an index.\n- If a class has the\
    \ semantics of a list, or collection, we can deﬁne an indexer property for it.\
    \ This way it’s easier to get or set items in the collection.\n\n```csharp\npublic\
    \ class HttpCookie\n{\n    public string this[string key]\n    {\n        get\
    \ {}\n        set {}\n    }\n}\n```\n\n### Exercise\nDesign a `Stopwatch`. The\
    \ job of this class is to simulate a stopwatch. It should provide two methods:\
    \ `Start` and `Stop`. We call the `Start` method ﬁrst, and the `Stop` method next.\
    \ Then we ask the stopwatch about the duration between `start` and `stop`. `Duration`\
    \ should be a value in `TimeSpan`. Display the duration on the console. We should\
    \ also be able to use a stopwatch multiple times. So we may start and stop it\
    \ and then start and stop it again. Make sure the duration value each time is\
    \ calculated properly. We should not be able to start a stopwatch twice in a row\
    \ (because that may overwrite the initial start time). So the class should throw\
    \ an `InvalidOperationException` if it’s started twice.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \nLearning tip: The aim of this exercise is to make you understand that a class\
    \ should be always in a valid state. We use encapsulation and information hiding\
    \ to achieve that. The class should not reveal its implementation detail. It only\
    \ reveals a little bit, like a blackbox. From the outside, you should not be able\
    \ to misuse a class because you should not be able to see the implementation detail.\n"
