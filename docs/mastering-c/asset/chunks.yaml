    # Nullable Types


    ![image](d2d_images/chapter_title_below.png)


    As you know in C#, a value type cannot be null. For example if you define `bool`
    it can have either True or False.


    ```csharp

    bool hasAccess = true;

    ```


    But there are some situations that you like for null let say you are working with
    database and a column called Birth which is nullable type can be declared nullable
    using `?`.


    ```csharp

    DateTime? birth;

    ```


    Let see Nullable in action we have nullable object so that if date is null default
    value will be returned.


    ![image](d2d_images/image13.png)


    Ok let talk about Null Coalescing Operator which is using `??`.


    ![image](d2d_images/image92.png)


    What the above code means is that if date is not null assign date to date2. Note
    that you cannot have an operation between a nullable type and the value type because
    they are not compatible example:


    ```csharp

    int? k = 4;

    int s = 3;

    int z = k * s;

    ```


    This will generate an error telling you “cannot implicitly convert type int? to
    int (Are you missing a cast?)”.


    In this scenario to avoid the above error you may need to declare the entire variable
    as nullable:


    ```csharp

    int? k = 4;

    int? s = 3;

    int? z = k * s;

    ```


    This time you get no error and the output will be given.


    For recap, these are features of Nullable Types:


    - Nullable types are only used with value types.

    - An `InvalidOperationException` will be thrown if value is null; otherwise, it
    will return the value.

    - The `HasValue` property returns a value of true if the variable contains a value,
    or false if it is null.

    - Use `==` and `!=` operators with a nullable type. For other comparison, use
    the `Nullable` static class.

    - Nesting nullable types in code are not allowed. For example `Nullable<Nullable<float>>
    k;` will give a compile time error.


