    \ `checked` 关键字\n\n```csharp\nchecked\n{\n    byte number = 255;\n    number =\
    \ number + 1; // 将发生异常\n}\n```\n\n此代码将抛出异常，你可以使用异常处理（`try` 和 `catch` 块）来防止它的发生。\n\
