- fmt: "\nIn software Engineering, coupling is a measure of how interconnected classes\
    \ and subsystems are. At the beginning of this course, I explained that software\
    \ application is composed of many classes that are packaged inside of namespaces\
    \ and assemblies. Take a look at the picture below\n\n![image](d2d_images/image166.png)\n\
    \n`Class A` is interconnected to `Class B` and `class F`, hence any changes made\
    \ to `A` will affect `B` and `F` and also `Class D` and `C` are dependent on `Class\
    \ B`. this means that changes to `Class A` will affect the application. This is\
    \ an example of tightly coupled design. The more coupled classes, the harder it\
    \ is to change them. A change in one class may affect many other classes.\n\n\
    Nevertheless, in loosely coupled software, as opposed to tightly coupled software,\
    \ is easier to change.\n\n## How Do We Design a Loosely Coupled Application?\n\
    \nThere are three things you need to understand to be able to design a loosely\
    \ coupled application, first is `Encapsulation`, which we have earlier discussed,\
    \ secondly, is the relationships between classes which is the topic of the this\
    \ section and lastly the interfaces.\n\n## Relationships Between Classes\n\nWe\
    \ have two types of relationships between classes: `Inheritance` and `Composition`.\n\
    \n### Inheritance\n\nThis is simply a kind of relationship between two classes\
    \ that allows one to inherit business logics from the other. It is usually referred\
    \ to as `Is-A` relationship: for example, you can say that red is a color.\n\n\
    The advantages of inheritance are:\n- Code re-use: which means encapsulating a\
    \ code in one class and re-use it in another and polymorphic behavior; which is\
    \ greatly powerful.\n\n#### Syntax for inheritance\n\nLet say we have a class\
    \ `Vehicle` and another class `Car` that inherits from `Vehicle` class\n\n```csharp\n\
    public class Vehicle {\n// common shared code\n}\n\npublic class Car : Vehicle\
    \  {\n// code specific to Car\n}\n```\n\nNote that in `C#`, a class can have only\
    \ one parent as you can see the `car` class inheriting the `vehicle` class as\
    \ its parent.\n\n### Inheritance Demo\n\n![image](d2d_images/image041.png)\n![image](d2d_images/image075.png)\n\
    ![image](d2d_images/image074.png)\n\nWe created two classes `Vehicle` and `Car`\
    \ with `car` inheriting from `Vehicle` and calling methods in `vehicle`.\n\n###\
    \ Composition\n\nThis is another kind of relationship that allows one class to\
    \ contain another. We refer to composition as `Has-A` relationship. For example,\
    \ A `Car` has an `Engine`. Look at this UML notation of this example\n\n![image](d2d_images/image133.png)\n\
    \nThe Beneﬁts of a composition are: Code re-use, ﬂexibility and a means to achieve\
    \ loose-coupling.\n\n### Let see Composition in action\n\n![image](d2d_images/image067.png)\n\
    \nAs shown in the figure above, `Car` class has a couple of instance variable\
    \ and few methods. `Maruti` is a specific type of `Car`, which extends `Car` class\
    \ means `Maruti` IS-A `Car`.\n\n![image](d2d_images/image171.png)\n\n`Maruti`\
    \ class uses `Engine` object’s `start()` method via composition. We can say that\
    \ `Maruti` class HAS-A `Engine`.\n\n![image](d2d_images/image105.png)\n\nin the\
    \ `Program.cs` class , the object of `Maruti` class is initialized . Though `Maruti`\
    \ class does not have `setColor()`, `setMaxSpeed()` and `carInfo()` methods still\
    \ we can use it due to `IS-A` relationship of `Maruti` class with `Car` class.\n\
    \n![image](d2d_images/image109.png)\n\nIf we run it we can see output like below.\n\
    \n![image](d2d_images/image009.png)\n\n### Composition VS Inheritance\n\n- **Problems\
    \ with inheritance:**\n  - › It is easily abused by amateur designers / developers\n\
    \  - › it Leads to large complex hierarchies of class.\n  - › Fragility: Such\
    \ hierarchies are very fragile and a change may affect many classes .\n  - › It\
    \ results in tight coupling\n- **Beneﬁts of composition:**\n  - Flexible: Any\
    \ inheritance relationship can be translated to composition.\n  - Leads to loose\
    \ coupling\n\nHaving said all that, it does not mean inheritance should be avoided\
    \ at all times. In fact, it’s great to use inheritance when dealing with very\
    \ stable classes on top of small hierarchies. As the hierarchy grows (or variations\
    \ of classes increase), the hierarchy, however, becomes fragile. Moreover, that’s\
    \ where composition can give you a better design.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Chapter Eleven\n\n![image](d2d_images/chapter_title_below.png)\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Access Modifiers\n\n![image](d2d_images/chapter_title_below.png)\n\nYour classes\
    \ should be design like a black box. They should have limited visibility from\
    \ the outside. The implementation, the detail, should be hidden. In `C #`, we\
    \ use access modiﬁers (mostly `private`) to achieve this. This is referred to\
    \ as Information Hiding (and sometimes Encapsulation) in object-oriented programming.\n\
    \n- **Public**: A member declared as `public` is accessible everywhere. Look at\
    \ the example below, the `promote` method is visible from the outside of the class\
    \ `Customer`\n\n![image](d2d_images/image023.png)\n\n- **Private**: A member declared\
    \ as `private` is accessible only from the class. Look at the example below\n\n\
    The method `CalculateRating()` is visible only within the class , hence the customer\
    \ object cannot access it the way it was able to access the `Promte()` method\
    \ in the previous example rather to call this method you use the class name directly\
    \ .\n\n![image](d2d_images/image047.png)\n\n- **Protected**: A member declared\
    \ as `protected` is accessibly only from the class and its derived classes. `Protected`\
    \ breaks encapsulation (because the implementation details of a class will leak\
    \ into its derived classes) and is better to be avoided. Use `private` methods\
    \ instead\n\n- **Internal**: A member declared as `internal` is accessibly only\
    \ from the same assembly. Personally, I do not think it makes any sense to declare\
    \ a class `internal`. Look at this example below trying to initialize the object\
    \ of that class outside the assembly let say in `program.cs` will throw an error\n\
    \n![image](d2d_images/image153.png)\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n- **Protected Internal**: A member declared as `protected internal` is accessible\
    \ only from the same assembly or any derived classes. (Sounds weird? Forget it!\
    \ It’s not really used.) just for you to know all the access modifiers in `C#`\n\
    \n![image](d2d_images/image178.png)\n\n### Constructors and Inheritance\n\nThere\
    \ are two things you need to know about constructors when it comes to inheritance,\
    \ first is that at instantiation of an object the base class constructors are\
    \ always executed. And the second is base class constructors are not inherited.so\
    \ you need to explicitly deﬁned the constructors in derived class. When creating\
    \ an object of a type that is part of an inheritance hierarchy, base class constructors\
    \ are always executed ﬁrst. - We can use the `base` keyword to pass control to\
    \ a base class constructor. It easy to explain this with an example. So here we\
    \ have a `vehicle` class with `registration Number` as  shown below , the `vehicle`\
    \ class has a constructor that initialize the `private` field `registration Number`\n\
    \n![image](d2d_images/image096.png)\n\nNow let say we want to create a `car` Class\
    \ that derives from `vehicle` we will use the `base` keyword to indicate that\
    \ derivation as shown below\n\n![image](d2d_images/image149.png)\n\nThe `base(registrationNumber)`\
    \ method is simply the constructor of the `vehicle` class. The constructor of\
    \ the `car` class receives an argument called the `registrationNumber` and simply\
    \ pass it to the base class.\n\nGet the source code of this example\n\n### Upcasting\
    \ / Downcasting\n\n- **Upcasting**: is conversion from a derived class to a base\
    \ class\n- **Downcasting**:  is conversion from a base class to a derived class.\
    \ All objects can be implicitly converted to a base class reference.\n\n// Upcasting\
    \ let say we have a `circle` class that is derived from the `Shape` class as shown\
    \ below\n\n![image](d2d_images/image181.png)\n"
