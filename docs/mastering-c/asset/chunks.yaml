    # Extension Methods


    Extension Methods are used to add methods to an existing class without changing
    its source code or creating a new class that inherits from it. This also work
    in sealed classes.


    To create an extension class we use the `static` modifier, the name of the class
    you want to extend and to create the extension method, it has to be a static method
    in a static class with the first argument being the `this` keyword . Look at the
    example below we created a static class `StringExtension` and created a static
    method of type `string` and the name is `shorten` with the first argument `this
    str` and `int numberOfWords`.


    ![image](d2d_images/image138.png)


    The above extension class helps you to shorten your strings.


    Let see how to use this class in the `Program.cs`.


    ![image](d2d_images/image058.png)


    ## When to Use Extension


    Use an extension method only when you have to is when its functionality is important
    to the extended type.


    Use it on interfaces to add generic functionality to classes that do not have
    a common base class like in the case of LINQ methods being extension methods to
    `IEnumerable` interface.


    Use extension method when dealing with classes that are not created by you like
    a class from a 3^(rd) party application or library for instance extending `FileInfo`
    from `.Net Framwok`.


    The major difference between the extension method and other static methods is
    the `This` keyword that it must have as the first parameter in the method.

