    \n```csharp\npublic classs Customer\n{\n    readonly List<Order> Orders = new\
    \ List<Order>();\n}\n```\n\n#### 访问修饰符 (Access Modifiers)\n访问修饰符是控制对类和或其成员访问的方法，这种控制的原因是在我们的程序中创建某种安全性并提高健壮性。例如，在我们的\
