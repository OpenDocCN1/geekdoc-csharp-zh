  trans: "\n4. 编写一个程序，要求用户提供一组由逗号分隔的数字（例如 5, 1, 9, 2, 10, 39）。如果列表为空或数字少于 6 个，则显示“Incorrect\
    \ List”并要求用户重试；否则，显示列表中最小的 3 个数字。\n\n# 第章\n\n## 处理日期\n\n在本章中，我们将学习如何在 C# 中处理日期和时间。我们将介绍\
    \ `DateTime` 和 `TimeSpan`。关于 C# 中的 `DateTime` 对象，你需要了解的一点是它们是不可变的。一旦创建了它们，你就无法更改它们，但有很多方法可以使用它们来修改它们，例如\
    \ `AddDays()`、`AddMonths()` 等。另一点你需要了解的是，`DateTime` 有不同的格式，`DateTime` 中的另一个概念是格式指定符（format\
    \ specifier）。\n\n请查看下面的代码段\n\n![image](img/image080.png)\n\n## TimeSpan \n\n`TimeSpan`\
    \ 将小时、分钟和秒作为参数，它具有如 `Minutes`、`TotalMinutes` 等属性，以及如 `FromHours()`、`AddMinutes()`\
    \ 等方法。与 `dateTime` 对象类似，`Timespan` 对象也是不可变的，但它们也有如 `Add()` 等可以用于修改的方法。\n\n![image](img/image104.png)\n\
    \n# 第七章\n\n## 处理文本\n\n在本节中，我们想更深入地查看 C# 字符串。在课程早些时候，你学习了 `String` 关键字映射到 C# 中的\
    \ `String` 类，我们还学习了字符串是不可变的，这意味着一旦创建了它们，你就无法更改它们，因此我们将查看一些实用的 `String` 方法，将字符串转换为数字以及反之的操作。\n\
    \n### 字符串格式化\n\n`ToLower()`：此方法将所有字符转换为小写，例如 //”:hello dennis”\n\n`ToUpper()`：此方法将所有字符转换为大写。//”\
    \ HELLO DENNIS”\n\n`Trim()`：此方法消除字符串周围的空白字符，这在捕获用户输入时非常有用。\n\n### 搜索\n\n要在给定的字符串中搜索字符或字符串，你可以使用\
    \ `IndexOf()` 和 `LastIndexOf()` 方法，它们分别返回给定字符或字符串的索引和最后出现的位置。`IndexOf('a')`, `LastIndexOf('Hello')`\n\
    \n### 子字符串\n\n如果你想从给定的字符串创建一个子字符串，请使用 `substring` 方法，此方法有许多重载。\n\n`Substring(startindex)`：返回从起始索引到字符串末尾的字符。\n\
    \n`SubString(startiIndex, length)`：它接收一个长度参数以限制检索的字符数量。\n\n### 替换\n\n如果你想替换字符串中给定的标题或子字符串，请使用\
    \ `Replace` 方法。\n\n`Replace (‘á’, ‘! ‘)`\n\n### 空值检查\n\n在 C# 中有几个方法可以检查对象或变量是否为空或\
    \ null。\n\n`String.IsNullOrEmpty(str)`\n\n`String.IsNullOrWhiteSpace(str)`\n\n\
    ### 分割\n\n要拆分字符串，使用 `Split()` 方法，例如 `Str.Split('')`。`split` 方法接收一个分隔符，如此示例所示，我正在使用空格分割字符串。\n\
    \n### 将字符串转换为数字\n\n有不同的方法可以实现，如下：\n\n```csharp\nString s = “1234”;\nInt I = int.parse(s);\n\
    Int j = Convert.ToInt32(s);\n```\n\n使用 `Convert` 类更好，因为如果字符串为 null，它将返回默认值（在此情况下为\
    \ 0）。而 `int.parse` 会抛出异常..。使用 `Convert` 方法更安全。\n\n### 将数字转换为字符串\n\n```csharp\n\
    Int k = 1234;\nString s = k.ToString(); // “1234”\nString t = k.To String(“C “);\
    \ // “$1,234.00”\nString h = i.ToString( “C0”); // “$1,234”\n```\n\n![image](img/image125.png)\n\
    \n### 字符串演示\n\n![image](img/image021.png)\n\n注意，我们还有一个用于字符串操作的类 `StringBuilder`。它有很多实用的方法，如\n\
    \n`Append()`：在字符串末尾添加内容。\n\n`Insert()`：在指定的索引处插入内容。\n\n`Remove()`：移除指定索引处的字符或字符串。\n\
    \n`Replace()`：用另一个字符或字符串替换字符或字符串。\n\n`clear().`：清除整个文本。\n\n### StringBuilder 演示\n\
    \n![image](img/image124.png)\n\n## 练习\n\n在查看答案之前，花时间尝试这些练习\n\n1- 编写一个程序，提示用户输入几个由连字符分隔的数字。检查数字是否是连续的。例如，如果输入是“3-4-5-6-7-8-9”或“21-20-19-18-17-16”，显示消息：“It\
    \ is Consecutive”；否则显示“It is not Consecutive”。\n\n2- 编写一个程序，提示用户输入由连字符分隔的数字。当用户按下回键时，判断是否存在重复。如果有，在控制台上打印“There\
    \ are Duplicates”。\n\n3- 编写一个程序，要求用户输入 24 小时制格式的时间（例如 17:00）。正确的时间应在 00:00 到 23:59\
    \ 之间。如果时间正确，显示“correct”；否则显示“Incorrect Time”。\n\n4- 编写一个程序，提示用户输入几个由空格分隔的单词。使用这些单词创建一个驼峰命名法（PascalCase）的变量名。例如，如果用户输入“number\
    \ of rooms”，显示“NumberOfRooms”。确保程序不依赖大小写。因此，如果用户输入“NUMBER OF ROOMS”，程序仍应显示“NumberOfRooms”。\n\
    \n5- 编写一个程序，提示用户输入一个英文单词。程序应该计算单词中元音（a, e, o, u, i）的数量。因此，如果用户输入“adventure”，程序应显示\
    \ 3。\n\n你可以从 `http://denissharp.aliencoreedge.com/` 下载练习源码，或向 `atcom:dennissharp@aliencoreedge.com`\
    \ 发送邮件。\n\n# 第八章\n\n## 处理文件\n\n在本节中，我们将学习如何在 C# 中处理文件和目录。\n\n在 .Net 中，我们有一个命名空间\
    \ `System.IO`，用于处理文件和目录的类都位于这里。\n\n我们将查看以下类；\n\n`File`, `Fileinfo`\n\n`Directory`,\
    \ `DirectoryInfo`\n\n`Path`\n\n### File, Fileinfo\n\n这两个类提供了创建、复制、删除、移动和打开文件的方法。\n\
    \n它们具有类似的接口，唯一的区别是 `fileInfo` 提供实例方法，而 `file` 提供静态方法，因此这里是包含在 `file`, `fileInfo`\
    \ 中的一些方法：\n\n- `Create()` 创建文件\n- `Copy()` 复制文件\n- `Deletes()` 删除文件。\n\n"
- fmt: "\n# Chapter Nine\n\n- `Exists()`: To check if a file exist..\n- `GetAttributes()`:\
    \ To return all the attributes of a file\n- `Move()`: To move a file from one\
    \ location to another.\n- `ReadAllText()`: To read the text in a file.\n\n## Directory,\
    \ DirectoryInfo\n\nThey are similar to `File`, `FileInfo`. `DirectoryInfo` provides\
    \ instance methods while `Directory` provide static methods. Their methods include:\n\
    \n- `CreateDirectory()`: To create directory\n- `Delete()`: To delete a directory\n\
    - `Exists()`: To check if a directory exist.\n- `GetCurrentDirectory()`: Return\
    \ the current directory.\n- `GetFiles()`: Returns the files in a directory\n-\
    \ `Move()`: To move files form one directory to another\n- `GetLogicalDrives()`:\
    \ returns the logical drives of your hard disk like `C` drive\n\n## Path\n\nIt\
    \ has the following methods:\n\n- `GetDirectoryName()`: To get the directory name\n\
    - `GetFileName()`: get the file name\n- `GetExtension()`: get the extension name\
    \ of the path or file\n- `GetTemPath()`: get the temporary path of a folder .\n\
    \n## File, FileInfo Demo\n\n![image](d2d_images/image120.png)\n\n## Directory\
    \ DirectoryInfo Demo\n\n![image](d2d_images/image019.png)\n\nTo learn more about\
    \ this go to google and type file info class `C#`.\n\n## Path Demo\n\n![image](d2d_images/image064.png)\n\
    \n## Exercises\n\n1. Write a program that reads a text file and displays the number\
    \ of words.\n2. Write a program that reads a text file and displays the longest\
    \ word in the file.\n\n## Classes\n\nWe are going to start our journey by learning\
    \ about Classes, in this section, I will introduce you to bases of classes.\n\n\
    - What is a class?\n- Real=world example of classes\n- What is an object and how\
    \ it is different from a class.\n- Static members\n\n## Class\n\nA class is simply\
    \ a building block of a software application so in a real world, an application\
    \ consist of multiple classes. Each responsible for a particular behavior in an\
    \ application or all these classes together producing the expected behavior from\
    \ the application. Simply put A class encapsulates data (stored in `fields`) and\
    \ behavior (deﬁned by `methods`).\n\n![image](d2d_images/image175.png)\n\n## Real\
    \ World example\n\nLet say we want to implement a web application like Blog engine,\
    \ a typical software or web application consist at least of three layers; presentation,\
    \ Business Logic and the data access layer. In each of these layers we can have\
    \ classes each responsible for something in particular\n\n![image](d2d_images/image123.png)\n\
    \nfor example in the presentation layer we can have a class called `PostView`\
    \ which will be purely responsible for exposing posts to the user, in the Business\
    \ logic we can a class for the post itself and finally the persistence or the\
    \ data access layer will have a class that will save the post to the database\
    \ or load the post from a database\n\n## Anatomy of a Class\n\nA class has two\
    \ parts namely:\n\n- Data (represented by `fields`)\n- Behavior (represented by\
    \ `methods / functions` )\n\nHere is how to demonstrate a class in unified model\
    \ language (UML)\n\n![image](d2d_images/image038.png)![image](d2d_images/image020.png)![image](d2d_images/image034.png)![image](d2d_images/image036.png)\n\
    \n## Another example\n\n![image](d2d_images/image071.png)![image](d2d_images/image072.png)![image](d2d_images/image035.png)![image](d2d_images/image006.png)\n\
    \n## Object\n\nAn object is fundamentally different from a class. An object is\
    \ essentially the instance of a class that reside .in a memory. In the `Person`\
    \ class above, we can have objects like `John`, `Mary Ann` as the instances of\
    \ the `Person` Class. The `Person` type or the `person` class define the blueprint\
    \ by which we can create objects At runtime each of these objects in the memory\
    \ talks to each other as result the expected result or behavior from the application\
    \ is obtained.\n\n## Declaring Classes\n\nin `C#`, classes are declare like this\
    \ access modifier followed by the keyword `class` and the name of the class with\
    \ opening and closing curly braces and the methods and fields of the class are\
    \ define within the curly braces as shown below:\n\n```csharp\npublic class Person\n\
    {\n    public string Name;\n\n    public void Introduce () // methods are declare\
    \ with access modifier return type and the name and ()\n    {\n        Console.WriteLine(\"\
    Hi my name is \"+ Name);\n    }\n}\n```\n\n## Creating Objects\n\nWe use the type\
    \ of the class followed by the identifier and then the `new` operator to initialize\
    \ the instance of the class as seen below:\n\n```csharp\nPerson person = new Person\
    \ ();\n```\n\nA shorter way to write the above is to use `var` keyword:\n\n```csharp\n\
    var person = new Person ();\n```\n\n## Using Objects\n\nNow that we have an object,\
    \ we can access the members of the object.\n\nIn our `person` object we can access\
    \ the name and give it a value and also access the `introduce()` method as seen\
    \ below:\n\n```csharp\nvar person = new Person();\nperson.Name = \"Dennis\";\n\
    person.introduce();\n```\n\n## Class Members\n\nWe have two types of members instance\
    \ and static members\n\n**Instance Members**: they are accessible from an object.\
    \ For example:\n\n```csharp\nvar person = new Person();\nperson.introduce();\n\
    ```\n\n**Static members**: : are accessible from the class. For example, we don’t\
    \ have to have an instance of the `Console` class in order to use the method `WriteLine()`,\
    \ instead we call it using the class name `Console`.\n\n```csharp\nConsole.WriteLine();\n\
    ```\n\n### Why use static members?\n\nTo represent concepts that are singleton\
    \ that means we should have only one instance of that in the memory. Like `DateTime.Now`\
    \ and `Console.WriteLine()`.\n\n## Declaring Static Members\n\nTo define a member\
    \ as a static, all you have to do is to use the `static` keyword after the access\
    \ modifier and you can declare static on any member of the class\n\n```csharp\n\
    public class Person\n{\n    public static int peopleCount = 0;\n}\n```\n\n## Class\
    \ Demo\n\n![image](d2d_images/image089.png)\n\n## Constructors\n\nA constructor\
    \ is a method that is called when an instance of a class is created .we use constructors\
    \ to put an object in an early state that is to initialize some of the fields\
    \ in the class. We do not have to always use a constructor, but if we need to\
    \ initialize an object upon creation. Then we use the constructor to do that.\n\
    \n## Constructor Declaration\n\nA constructor has an exact name as the class,\
    \ that is a requirement, and it does not have a return type not even void\n\n\
    ```csharp\npublic class Customer\n{\n    public Customer ()// default constructor\n\
    \    {\n    }\n}\n```\n\nSecond Example:\n\n```csharp\npublic class Customer\n\
    {\n    public string Name;\n    public Customer (string name)\n    {\n       \
    \ This.Name = name;\n    }\n}\n```\n\n## Constructor Overloading\n\nConstructors\
    \ can be overloaded. Overloading means having a method with the same name but\
    \ different signatures. A signature is what uniquely identifies a method; its\
    \ return type, its name and the types and number of its parameters. In the constructor\
    \ we can have different signatures as follows:\n\n```csharp\npublic class Customer\n\
    {\n    public Customer () {...} // this takes no parameter it is a default constructor\n\
    \    public Customer (string name) {...} // this takes only one string parameter\n\
    \    public Customer (int id, string name) {...} // this takes two parameters\n\
