    \ 运算符为数组分配内存。\n\nC# 中的数组是 .Net 中 `Array` 类的实例。所以这就是为什么在这里我们必须使用 `new` 运算符为该对象分配内存。\n\
    \n例如，给数组赋值：\n\n```\nnumbers[0]= 1;\nnumbers[1] = 1;\nnumbers[2]= 2;\n```\n\n如果你预先知道想要存储在数组中的值，可以使用对象初始化语法并将上面的代码简写如下所示：\n\
    \n```csharp\nint[] numbers= new int [3] { 2,8,17};\n```\n\n要访问数组中的元素，我们使用方括号符号：\n\
    \n```csharp\nnumbers[0] = 2;\n```\n\n注意 C# 数组是从 0 开始索引的。因此第一个元素的索引为 0。让我们进入 Visual\
