    ### Enums


    An enum is a data type that holds a set of name/value pairs.  enums  is used when
    you need to define multiple related constants.


    public enum ShippingMethod


    {


    Regular = 1,


    Express = 2


    }


    Now we can declare a variable of type ShippingMethod enum and use the dot notation


    to initialize it:


    var method = ShippingMethod.Express;


    Enums are internally integers. So you can easily cast them from one data type
    to another :


    var methodId = 1;


    var method = (ShippingMethod)methodId;


    var method = ShippingMethod.Express;


    var methodId = (int)method;


    we convert an enum to a string using the ToString() method. Every object in C#
    has this


    method and can be converted to a string:


    var method = ShippingMethod.Express;


    8


    var methodName = method.ToString();


    To convert a string to an enum (called parsing), use Enum.Parse:


    var method = (ShippingMethod)Enum.Parse(typeof(ShippingMethod),


    methodName);


    ### Reference Types and Value Types


    In C#, we have two main types from which we can create new types: classes and


    structures (structs). All primitive data types are structures while arrays and
    strings are classes.


    All classes in C# are reference Types while structures are Value Types.


    Value Types


    When you create a variable as a value type, a memory is automatically allocated
    to it on the stack and immediately removed once it is out of scope


    When you copy a value type to another variable, a copy of the value stored in
    the


    original variable is taken and stored in the second variable. Hence, these two
    variables


    will be independent.


    var i = 10;


    var j = i;


    j++;


    Here, incrementing j does not impact i.


    In practical terms, it means: if you pass an argument to a method and that argument
    is


    a value type, its value will be copied. So any changes made to that  method argument
    in the method will be lost upon returning from that method.


    Recall that : Primitive types are structures hence they are value types. Any custom
    structure you define will also be a value type.


    ### Reference Types


    For classes, which are reference type, you need to allocate the memory for it
    by yourself using the new operator. In addition, this memory is allocated on heap,
    which means that even if the object goes out of the scope, it will not be removed
    immediately it will be removed by the garbage collector in CLR.


    With a reference type, however, the reference (or memory address) of the object
    is


    copied to the target variable. This implies that : if you copy a reference type
    to another


    variable, any changes you make to the object referenced by either of these variables,


    will be visible through the other variable.


    var array1 = new int[3] { 11, 27, 38 };


    var array2 = array1;


    array2[0] = 0;


    Here, both array1 and array2 reference (or point) the same array object in memory.
