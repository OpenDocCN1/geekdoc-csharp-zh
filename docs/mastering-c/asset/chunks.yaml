    ![image](d2d_images/chapter_title_above.png)


    # C# Fundamentals


    ![image](d2d_images/chapter_title_below.png)


    ## What is C#?


    C# (pronounced “C-Sharp”) is a programming language developed at Microsoft by
    a team led by Anders Hejlsberg and Scott Waltemath, it was designed specifically
    for the `.NET` platform to aid quicker and easy migration to `.NET`. C# by programmers
    who has their roots and previous experiences in `C`, `C++` and `Java`, adapting
    the best features of each and adding new features of its own. Because C# has been
    built upon such widely used and well-developed languages, programmers find learning
    C# to be easy and enjoyable.


    C# is an eventful, object-oriented, Microsoft visual programming language where
    programs are written with the help of an IDE preferble `Microsoft Visual Studio`
    an Integrated Development Environment (IDE). With this IDE, one can write, run,
    test and debug C# programs conveniently, one of benefit is time reduction in producing
    a working program as to compare with the fraction of the time it would have taken
    without using the IDE. The concept of rapidly creating an application using an
    IDE is usually referred to as Rapid Application Development (RAD).


    ## C# VS NET


    C# is a programming language while `.Net` is a framework. It consist of a run
    time environment (`CLR`) and a class library that we use for building applications
    on windows. The `.Net Frameworks` are not limited to C#, there are different languages
    that target `.Net Frameworks` such as `F#`, `VB.Net`. It is also a platform where
    web based applications can be distributed to a great variety of devices (including
    tablets, smart phones and computers). It offers a platform where applications
    written in different programming languages can communicate with each other.


    ## CLR (Common Language Run time)


    When a C# application is compiled, C# compiler compiles your code to `IL` (Intermediate
    Language) code. `IL` code is platform independent, which makes it possible to
    a take a C# program on a different computer with different hardware architecture
    and operating system and run it. For this to happen, we need `CLR`. When a C#
    application is executed, `CLR` compiles the `IL` code into the native machine
    code for the computer on which it is running. This process is called Just-in-time
    Compilation (`JIT`).


    ## Architecture of .NET Applications


    From the architecture point of view, C# application consists of building blocks
    called `classes`. A `class` is a container for data (attributes) and methods (functions).
    Attributes represent the state of the application. Methods include code. They
    have logic. This contains our algorithms and code.


    A `namespace` is a container for related classes. Therefore, as your application
    grows in size, you may want to group the related classes into various namespaces
    for better maintainability.


    As the number of classes and namespaces even grow further, you may want to physically
    separate related namespaces into separate assemblies. An `assembly` is a file
    (`DLL` or `EXE`) that contains one or more namespaces and classes. An `EXE` file
    represents a program that can be executed. While `DLL` is a file that contains
    code that can be re-used across different programs.


    ## Why Learn C#?


    C# is a beautiful cross-platform language that can be used to build different
    kinds of applications. It has similar features and syntax with `C`, `C++` and
    `Java` but easier to learn than them. Moreover, since it is part of `.Net` framework
    it has many re-usable libraries that enables you to quickly develop an application
    without building everything from the scratch. With C#, you can build:


    - Mobile apps (for Windows, Android and iOS)

    - Games

    - Web sites

    - Desktop applications


    In addition, C# is an object oriented [imperative language](https://en.wikipedia.org/wiki/Imperative_programming)
