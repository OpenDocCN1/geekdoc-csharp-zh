    # 动态


    动态是 C# 4.0 引入的特性之一，有时会困扰一些 C# 开发者。然而，它其实很简单。通常编程语言分为静态类型语言（如 C#、Java）和动态类型语言（如
    Ruby、JavaScript 和 Python）。现在这两种之间真正的区别是什么？区别在于在静态语言中，类型、成员、方法、属性的解析是在编译完成的。而在动态语言中，类型、方法、属性或成员的解析是在运行时完成的。


    '
- fmt: "\nThe benefit of static languages is early feedback at compile time while\
    \ the benefit of dynamic languages is that they are easier and faster to code\
    \ with. However, on the other side we have to write more unit test to ensure that\
    \ the code is working properly.\n\nC# started as a static language but in `.Net\
    \ Framework 4.0`, they added dynamics capability in order to improve interoperability\
    \ with `.COM` (examples are writing office applications that uses `Excel` or `Word`)\
    \ and or dynamic languages in `.Net` like `Iron Python`.\n\nAs we said before\
    \ a dynamic type resolves its type at run time based on the value of the expression\
    \ at runtime.\n\nLook at the following code:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    dynamic a = 100;\n    Console.WriteLine(\"Dynamic a value: {0},\
    \ Type: {1}\",a ,a.GetType().ToString());\n    a = \"Hello World!\";\n    Console.WriteLine(\"\
    Dynamic a value: {0}, Type: {1}\", a, a.GetType().ToString());\n    a = true;\n\
    \    Console.WriteLine(\"Dynamic a value: {0}, Type: {1}\", a, a.GetType().ToString());\n\
    \    a = DateTime.Now;\n    Console.WriteLine(\"Dynamic a value: {0}, Type: {1}\"\
    , a a.GetType().ToString());\n}\n```\n\nOutput:\n```\nDynamic a value: 100, Type:\
    \ System.Int32\nDynamic a value: Hello World!!, Type: System.String\nDynamic a\
    \ value: True, Type: System.Boolean\nDynamic a value: 01-01-2014, Type: System.DateTime\n\
    ```\n\n## For Methods and Properties of Dynamic Type\n\nLet say you assign a class\
    \ object to a `dynamic` type, the compiler is not going to throw any exception\
    \ or check if the correct method or properties of the dynamic type that holds\
    \ that custom class until at runtime because by assigning it a dynamic type, you\
    \ are instructing the compiler that the variable type can change or that it is\
    \ not known until runtime.\n\nLook at the following example:\n\n```csharp\npublic\
    \ class Staff\n{\n    public int StaffID { get; set; }\n    public string StaffName\
    \ { get; set; }\n    public int Age { get; set; }\n    public int StandardID {\
    \ get; set; }\n    public void DisplayStaffDetail()\n    {\n        Console.WriteLine(\"\
    Name: {0}\", this.StaffName);\n        Console.WriteLine(\"Age: {0}\", this.Age);\n\
    \        Console.WriteLine(\"Standard: {0}\", this.StandardID);\n    }\n}\n\n\
    class Program\n{\n    static void Main(string[] args)\n    {\n        dynamic\
    \ dynamicStaff = new Staff();\n        dynamicStaff.DisplayStaffDetail();\n  \
    \      dynamicStaff.CreateStaff();\n    }\n}\n```\n\nIf you look at the above\
    \ code you will see that there is no place where we define the method `CreateStaff()`,\
    \ however the compiler will not give any error because it will skips type checking\
    \ because it is `dynamic` type but at runtime we will have runtime error.\n\n\
    ## Using Dynamic Type as a method Parameter\n\nWhen a method have a `dynamic`\
    \ type as its parameter, it can accept any type of parameter at run time.\n\n\
    Look at the following codes:\n\n```csharp\nclass Program\n{ \n    static void\
    \ PrintValue(dynamic obj)\n    {\n        Console.WriteLine(obj);\n    }\n   \
    \ static void Main(string[] args)\n    {\n        PrintValue(\"Hello World!!\"\
    );\n        PrintValue(100);\n        PrintValue(100.50);\n        PrintValue(true);\n\
    \        PrintValue(DateTime.Now);\n    }\n}\n```\n\nOutput:\n```\nHello World!\n\
    100\n100.50\nTrue\n01-01-2014 10:10:50\n```\n\nNote these about dynamic type:\n\
    - `Dynamic` types are resolved at runtime and not at compile time.\n- The compiler\
    \ does not do type checking for `dynamic` type. Therefore, it does not give any\
    \ error about dynamic types at compile time.\n- `Dynamic` types actually shows\
    \ no intellisense support in visual studio.\n- A method can have `dynamic` type\
    \ as its parameter or one of its parameter.\n- if a method or property is not\
    \ compatible at runtime, an exception is thrown.\n\n![image](d2d_images/chapter_title_corner_decoration_left.png)\
