    如果你长期以来设计和编写 Web 应用程序，那么很有可能遇到过很多应用程序响应时间糟糕的情况。在 `AJAX` 之前，几乎无法在不重新加载整个页的情况下更改一小部分内容。在网络连接缓慢的情况下，这种情况会更加糟糕。然而，如今情况已经发生了变化。我们可以在不重新加载整个页面或不触碰其他元素的情况下进行任何更改。因此，性能和用户体验得到了提升。那么，这是如何实现的呢？你可能在想
    AJAX 对吧？是的，Ajax 是一种在服务器和客户端之间交换数据的异步技术。因此，`AJAX` 的主要目标是调用服务器方法并从服务器交换数据，而不会阻塞客户端正在进行的任何活动。因此，客户端无需等待服务器的响应。


    在 `C#` 5.0 中，微软引入了异步编程，这为 `C#` 开发者提供了使用 `C#` 编写自定义异步代码的机会。


    ### 同步编程与异步编程？


    在同步执行模型中，程序按行执行，一次只执行一个。当一个函数被调用时，程序执行必须等待直到该函数返回。


    对于异步程序，当一个方法被调用时，程序执行将继续到下一行，而无需等待函数完成。异步编程提高了响应能力，例如在窗口媒体播放器中，当你播放视频或音乐时，UI 被设计为响应响应的，你可以调整窗口大小，甚至可以在视频或音乐播放时移动它，这是因为它是通过异步编程的，否则当你尝试移动它时，窗口将会冻结。你的网络浏览器也是如此，当你从网络下载内容时，UI
    仍在运行。它是响应响应的，这就是异步编程的好处。


    ### 何时使用异步


    如果你有阻塞操作，例如访问网络、处理文件和数据库或处理图像，那么使用异步是最佳的。


    ### 我们如何在应用程序中使用异步技术？


    ```


    在 `C#` 中，在 `.Net` 4.5 之前，我们有两种常用的传统方法，即多线程和回调方法，这些方法学习起来都很困难且复杂。因此，在 `.Net` 4.5
    中，微软引入了一种新的异步编程模型，称为基于任务的异步模型（Task base asynchronous model）。有两个用于实现这种异步编程的主要关键字；它们被称为
    `Async` 和 `Await`。


    #### Async


    此关键字将函数标识为异步函数。因此，如果一个函数前面指定了 `async`，那么该函数就是异步的。查看异步方法的语法。


    ```csharp

    public async Task DrawProcess()

    {


    }

    ```


    在这里，`DrawProcess()` 方法是一个异步方法，因为 `async` 关键字在它前面。因此，它可以被异步地调用。它还有一个名为 `Task` 的返回类型。任务
    是一个封装了异步操作状态的对象。它有两种形式：一种是泛型形式，另一种是非泛型形式。


    `DrawProcess()` 方法显示了非泛型形式，这意味着它返回 `void`。然而，如果该方法要返回一个字符串，它将使用像这样的泛型形式：`Task<string>`。


    #### Await


    当调用返回 `Task<string>` 的方法时，我们需要在方法前面加上 `await` 关键字。


    听起来像是在等待，对吧？或者它给你一种程序执行必须等待直到方法执行完毕的印象？不，在异步方法前面放置 `await` 运算符只是告诉编译器，这个操作是一个耗时的操作，并且可能需要一些时间来执行。在这种情况下，它不会阻塞此线程，而是会立即将控制权返回给方法的调用者，因此此处的线程不会被锁定，控制权会立即返回方法以继续执行。


    这正是下面示例中的场景；这是一个窗体应用程序，在点击按钮时会下载 HTML 页面。我们使用异步方法来确保在下载期间窗口不会冻结，并保持响应，或者从屏幕上的一个地方移动到另一个地方。由于我们在
    `DownloadStringTaskAsync(url)` 标记了 `await` 运算符，该方法将立即返回给调用它的 `Button_Click()`
    事件，最终当 `DownloadStringTaskAsync(url)` 执行完成后，控制权将返回到异步方法 `DownloadAsync()` 以继续执行剩余的代码，在这种情况下是
    `StreamWriter`。你还会发现，`.net` 库中的每个同步方法都有对应的异步方法。例如，在我们的示例中，`WebClient` 对象为 `DownloadString()`
    调用了 `TaskAsync` 方法，而 `StreamWriter` 调用了 `WriteAsync()`，它是 `Writer()` 的异步方法，而 `Writer()`
    是一种阻塞操作或同步写入方式。这里的想法是提高应用程序的响应能力，并确保其执行是异步的。![image](img/image173.png)


    回顾一下，记住异步函数的返回类型是 `Task`。这意味着当它完成执行时，它将完成一个 `Task`。异步方法的可能返回类型有：


    - `Void`: 意味着没有返回内容

    - `Task`: 它将执行一个操作，像 `void` 一样，它不返回任何内容

    - `Task<T>`: 将返回带有 `T` 类型参数的泛型任务。（T 可以是字符串、整数或任何其他数据类型）


    ### 注意事项


    - `Main` 方法不能是异步的。

    - 此外，`Main` 方法不能被 `await` 运算符调用。

    - 如果任何异步方法没有被 `await` 运算符调用，那么从本质上说它将表现得像同步方法。

    - 属性属性不应定义为异步的。

    - `try/catch` 块不应在 `catch` 或 `finally` 块中调用任何异步方法。

    - 类构造函数或析构函数不应定义异步方法，也不应被异步地调用。


    '
