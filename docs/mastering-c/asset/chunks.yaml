    ### 测验


    问题-0:

    什么是命名空间（namespace）？

    a: 一个包含程序代码的类型。

    b: 类的容器。

    c: 应用程序的可部署单元。

    答案是：b


    问题-1:

    什么是 JIT 编译？

    a: 在运行时将 `IL` 代码编译为原生机器码。

    b: 将 `C#` 代码编译为原生代码。

    c: 将 `C#` 代码编译为 `IL` 代码。

    答案是：a


    问题-2:

    什么是程序集（assembly）？

    a: 由 `CLR` 执行的一段代码

    b: 一个或多个类的容器

    c: `.NET` 应用程序的单一部署单元

    答案是：c


    # 第二章


    ## 基本类型与表达式


    在本章中，我们将开始学习 `C#` 的旅程，因此我将向你们介绍变量和常量、各种数据类型和类型转换、作用域和溢出，最后我们将讨论 `C#` 中拥有的各种运算符。


    ### 变量与常量


    #### 变量

    变量是赋予内存存储位置的名称。我们使用变量在内存中临时存储值。在 `C#` 中，声明变量从数据类型开始，紧接着是一个标识符，并以分号（`;`）结束，如下：


    ![image](img/image117.png)


    这里 `int` 代表整数类型，`Number` 是我们变量的标识符。注意 `C#` 是区分大小写的，因此，这两个变量是不同的，因为一个是大写 `N`，另一个是小写
    `n`。在声明变量时，你可以选择性地初始化它如上所示，但请注意，除非你初始化它，否则你无法使用该变量，正如你在第二个示例所示。否则，代码将无法编译。


    #### 常量

    常量是不可变的值；我们在编译时知道这些值在应用程序的整个生命周期内不会改变。我们为什么要使用 `Constants`（常量）？原因很简单；为了在应用程序中创建安全性，特别是在我们需要确保某个值不改变的情况下。想象在你的应用程序中，有一个名为
    `Pi = 3.14;` 的数字，用于计算圆面积。该数字在我们的程序中应该始终保持，我们不希望意外更改它，否则我们的结果将不准确。因此，我们将此数字声明为常量。


    要声明常量，我们使用关键字 `const` 后面跟数据类型和标识符，并且我们必须像这样初始化：```csharp

    const float Pi = 3.14;

    ```


    ### 关于标识符的注意事项

    - 标识符不能与数字开头；例如这个不能作为标识符：`1route` ![image](img/image152.png) 但这个 `Route` 是可以的
    ![image](img/image158.png)

    - 它不能包含空格，如 `first Name`，但 `firstName` 是可以的。

    - 它不能使用保留关键字如 `int`，但如果你非常想使用任何保留关键字，那么你可以用 `@` 符号作为前缀，如所示所示 `@int`。

    - 使用有意义的名称，避免用 `fn` 代替 `firstName`。


    ### C# 中的命名规范

    在 `C#` 中，为你的局部变量命名：使用驼峰命名法（Camel case），例如：`string firstName = “Dennis”;`

    对于你的常量变量，使用帕斯卡命名法（Pascal case）：`const int Zoom = 5;`


    ### 基本类型

    这里是 `C#` 中最常用的类型列表：整数、实数、字符和布尔值。注意在 `.Net` 框架中，它们被映射到数据类型。第三列“Bytes”（字节）显示了每个数据类型使用的字节数，第四列“Range”（范围）显示了数据类型可以存储的值的数量。


    ![image](img/082.png)


    #### 整数

    在上面的表中，整数是 `byte`、`short`、`int` 和 `long`。正如表中所示，`byte` 是最小的，占用 1 字节，而 `long` 是最大的，占用
    8 字节。字节越多，存储越多。

    - `byte` 映射到 `Byte`

    - `short` 映射到 `Int16`

    - `int` 映射到 `Int32`

    - `long` 映射到 `Int64`


    #### 实数

    在实数中，我们有 `float`、`double` 和 `decimal`。在 .Net 框架中：

    - `float` 映射到 `Single`，占用 4 字节存储大数字

    - `double` 映射到 `Double`，大小是 `float` 的两倍，占用 8 字节

    - `decimal` 映射到 `Decimal`，占用 16 字节，需要的精度越高，使用的类型越大


    #### 字符与布尔

    在 `C#` 中，我们有由关键字 `char` 表示的字符，它们是 Unicode；`bool` 表示布尔，可以是 true 或 false。


    ### 数据类型声明和初始化示例


    #### 整数

    ```csharp

    Int c; // 这仅是声明

    Int a = 18; // 这是声明和初始化

    Int b = 6;

    c = a + b; // 这是将值赋值给整数类型的变量 c

    Console.WriteLine(c);

    ```


    #### 实数

    默认情况下，`C#` 编译器使用 `double` 用于实数，因此如果你想使用像 `float` 和 `decimal` 这样的数据类型，你需要显式地告诉编译器将你的数字视为
    `float` 或 `decimal`，例如这样声明：

    ```csharp

    float number = 1.2f; // 通过添加此后缀告诉编译器视为 float

    decimal number = 1.2m; // 后缀 m 告诉编译器将数字视为 decimal

    ```


    #### 字符与布尔

    ```csharp

    char chA= ‘A’;

    char chB= ‘B’;

    Console.WriteLine (chA.Equal( ‘A’)); // 输出：  “True”

    Console.WriteLine (‘b’.Equal(chB)); // 输出：  “False”

    ```

