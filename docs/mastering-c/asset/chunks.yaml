    the condition is executed At least once because the condition is evaluated at
    the end of the loop. So here we have the keyword do and a block of statements
    to be executed and a counter to be incremented or decremented and we have while
    keyword followed by a condition to be evaluated. Note you do not always need a
    counter with a do-while loop. It depends on what you want achieve.


