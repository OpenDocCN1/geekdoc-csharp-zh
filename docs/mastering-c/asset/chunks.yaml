    whereas a


    character is surrounded by a single quote.


    string name = “Dennis”;


    char ch = ‘A’;


    There are a few different ways to create a string in C#:


    Using a string literal:


    string firstName = “Dennis”;


    Using concatenation:


    It is useful if you want to combine two or more strings.


    string name = firstName + “ “ + lastName;


    Using string.Format:


    This is cleaner than concatenating multiple strings since you can see the output.


    String name = string.Format(“{0} {1}”, firstName, lastName);


    At run time the value of the firstName will be placed at the index {0} placeholder
    and the lastname value will be placed at {1}.


    Using string. Join:


    This is useful when you have an array and would like to join all elements of that
    array with a separator like comma, which is a string.


    var numbers = new int[3] { 11, 27, 37 }


    string list = string.Join(“,”, numbers);


    C# strings are immutable, which means once you create them, you cannot change
    their value or


    any of their characters. The String class contain some methods for modifying strings,
    but these  methods return a new string and do not change the original string.


