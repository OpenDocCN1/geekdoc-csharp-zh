    # Exception Handling  


    ![image](d2d_images/chapter_title_below.png)


    In C#, we use exception handling to deal with unexpected or exceptional situation
    that arise from the program we write. As C# developers, we need to learn how to
    handle exceptions effectively.


    Let see an example let say we have a calculator class  with a method Divide that
    gets two arguments and return their division result like this


    ![image](d2d_images/image025.png)


    In the program.cs we will instantiates the object of the calculator class and
    call the method Divide() and pass 5 as the numerator  and 0  as the  denominator
    . We expect a division by zero exception. Essentially exception is a class .Net


    ![image](d2d_images/image115.png)


    When we run the application, it will crash


    ![image](d2d_images/image016.png)


    ![image](d2d_images/image169.png)


    To avoid this from happening we need to handle such exceptions by using Try and
    Catch blocks. You put the code that is likely to throw an exception inside the
    Try block, so when an exception is thrown the catch block will be executed. However
    if there are no exceptions the catch block will not be executed.


    ![image](d2d_images/image111.png)


    So when we run it again


    ![image](d2d_images/image136.png)


    This is better than our application crashing.


    So as a guideline we should always have a global Try {} catch () block in our
    application.


    Let take a closer look at the catch block in our example we just have a type Exception
    and it is the parent of all the exceptions in .Net  it is good to have an argument
    so that we access the actual exception. In addition, we can have more than one
    catch block.  We can define specific exception like in our case DivideByZero Exception
    and you must start from the specific exception to the most generic or parent exception
    class


    ![image](d2d_images/image155.png)


    The output will show that the first catch is executed which is the specific exception
    to the scenario so the other two need not to be executed 


    ![image](d2d_images/image177.png)


    In C# we also have a finally block which is used to handle any exceptions that
    are thrown  by classes that mange resources that are not handle in CLR, hence
    no garbage collections are applied to them  examples are database connections,
    network connections etc. so in situations like that a manual cleanup  is  done
    .


    ![image](d2d_images/image069.png)


    Even if there are no exceptions, the finally block will always be executed. Note
    also that we used the throw keyword, it is actually use to create a new exception
    like used in the above code within a try catch finally block


    Creating Custom Exceptions


    Custom or user defined are derived from the Exception class.  Look at the following
    example


    using System;


    namespace CustomDefinedException {


    class TemperatureCheck {


    static void Main(string[] args) {


    Temperature temp = new Temperature();


    try {


    temp.showTemp();


    } catch(TempIsZeroException e) {


    Console.WriteLine("TempIsZeroException: {0}", e.Message);


    }


    Console.ReadKey();


    }


    }


    }


    public class TempIsLessThanZeroException: Exception {


    public TempIsLessThanZeroException (string message): base(message) {


    }


    }


    public class Temperature {


    int temperature = 0;


    public void showTemp() {


    if(temperature == 0) {


    throw (new TempIsLessThanZeroException ("Zero Temperature found"));


    } else {


    Console.WriteLine("Temperature: {0}", temperature);


    }


    }


    }


    When this code is compiled and executed, the output will be


    TempIsLessThanZeroException: Zero Temperature found


