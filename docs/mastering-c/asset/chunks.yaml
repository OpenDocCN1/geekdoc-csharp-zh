    Classes are building blocks of an application; these classes combine related variables
    (fields) and (methods) functions together. So here is an example, in the figure
    below we have a class called person with four fields Name, Age, Height and Weight.
    It also has four  methods or functions ; Walk(),Talk(),Eat()and Sleep(). This
    class is a type from which we create a blue print of an object.  Object is an
    instance of a class, from this class example we can create three instances of
    the person class like Mary, John and Scott as seen below. More or less when your
    application is running, it is actually objects that are talking with each other
    and collaborating to provide some functionalities


    ![image](d2d_images/image146.png)


    ### Declaring Class in C#


    To create a class we start with an access modifier the keyword class and an identifier


    Public class Person


    {


    }


    In the example, public is what we call an access modifier. It checks whether a
    class is visible to other


    classes or not. Access modifiers are beyond the scope of this book and I’ve covered
    them in my


    my  second book on this course: C# Intermediate. For now just remember that whenever
    you want to create a class use the keyword public to make it accessible anywhere
    in the application.


    Also, know that when you declare a variable in a class, you have to give it an
    access modifier, for now we will use public.


    Here is another example of  a class with a field and a method:


    public class Person


    {


    public string Name;


    public void Introduce()


    {


    Console.WriteLine(“My name is “ + Name);


    }


    }


    void  indicates that  this method does not return a value. In this method Introduce
    (), the empty parenthesis means that it does not accept any value or parameter.
    And what it does is to simply output the name of the person on the console .To
    create an object, we use the new operator:


    Person person = new Person();


    A better way of writing the same code is:


    var person = new Person();


    Tthe new operator is used to allocate memory to an object. In C# you don’t have
    to worry about


    de-allocating the memory. CLR has a component called Garbage Collector, which
    automatically


    removes unused objects from memory.


    Once we have an object, we can access its fields and methods with the dot notation:


    Person person = new Person();


    person.Name = “Dennis”;


    person.Introduce();


    ### Static Modifier


    When  a static modifier is used on a class member (field or method), makes that
    member accessible only via the class, not any objects. So in the earlier example,
    if the Introduce method was static, we could access it via the Person class:


    Person.Introduce();


    static members are used in occasions where we want only one instance of that member
    to exist in memory. As an example, the Main method in every program is declared
    as static, because we need only one entry point to the application.


    Let see another example of class, with static method


    public class Calculator


    {


    public static int Add(int a, int b)


    {


    return a + b;


    }


    }


    Here we have a static method of type integer that takes two parameters of type
    integer and return the sum of the two parameters. So to access this method we
    use the class name like this


    int result=Calculator. Add(1,2); // the output  will be 3


    In the real-world, it’s best to stay away from static as much as you can because
    that makes writing automated tests for applications hard. Automated testing is
    the topic for another course, but for now, just remember how to use members that
    are already declared as static, and prefer not to declare your own class members
    as static.


    Demo class person example in Visual studio


    ![image](d2d_images/image045.png)


    Notice that the class person is created outside the class program A better way
    to create class is to create as a separate file by right clicking the project
    solution file > click on  Add > Class and give it a name person.cs,  or you can
    use the short form Shift+ Alt+C then you can writes the codes  there ,also remember
    to add public to the  class declaration to make accessible anywhere in the application. 
    and from the main method we create an object of the class and use it to access
    the fields Lastname and firstname  and also the method . Introduce(). The output
    of this program will be


    ![image](d2d_images/image134.png)


    ### Structs


    A struct (structure) is a type with similar  characteristics with a class. It
    combines related fields and methods together. In terms of syntax, it is similar
    but the difference is that instead of using the class keyword it uses the struct
    keyword


    public struct ColorSpectrum


    {


    public int Red;


    public int Green;


    public int Blue;


    }


    Use structs only when creating small lightweight objects. That is for a subtle
    performance optimization. In the real-world,  new types  are usually created using
    classes, not structures.


    In .NET, all primitive types are  defined as  structures. They are small and lightweight.
    The biggest primitive type does not have a  size that is more than 16 bytes.


    ### Arrays


    An array is used to store a collection of variables of the same type. It is a
    data structure.


    For example, imagine you will like to work with three numbers ,instead of declaring
    three int variables (that are related),  like this


    int number1;


    int number2;


    int number3;


    you can create an int array like this:


    int[] numbers = new int[3];'
