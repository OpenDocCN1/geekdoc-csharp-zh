    # C# Delegates


    ![image](d2d_images/chapter_title_below.png)


    Delegates are objects that know how to call a method (or a group of methods) you
    can say that a delegate is a reference or a pointer to a function. Delegates are
    needed for designing extensible and flexible applications. Often this is used
    in design frameworks.


    Delegates simply offers to the application user of your objects the ability to
    customize their behavior. However, there other ways to achieve this but delegates
    are the easiest way in some scenarios to achieve this.


    Why do we need delegates?


    ❖  For designing extensible and flexible applications(e.g framework


    ❖  It  promotes code reusability


    ❖  It allows decoupling and generalization of code


    ❖  It also allows methods to be passed as parameters at runtime.


    ❖  Delegate provides the ability to specialize the behavior of a class without
    creating a subclass for that special behavior.


    Let take a scenario to demonstrate how delegates work. Imagine you are developing
    a framework that will be for processing photos. You know that your application
    need to be extensible


    You have define a class for different photo filters as shown below 


    ![image](d2d_images/image017.png)


    And The code below is used to process photo by calling those filters


    ![image](d2d_images/image033.png)


    What if you release the framework but  another developer wants to use the framework 
    and  apply another filter that you have not define in your code  the problem is
    you have  recreate that code , recompile and redeploy your code  and this could
    be very stressful if every time someone  need a feature  you haven’t added  you
    have to  keep recreating and redeploying your code and this is not the best .So
    with delegate we can make the application extensible such that a developer can 
    create their filters without relying on you. The same problem can also be solved
    using interfaces but here we are going to use delegates to solve this issue.


    To use a delegate to make the code above extensible we need to define a delegate
    type, when defining a delegate we need to define the signature of the method.
    Now this delegate will be responsible for calling, is of type void, and takes
    in a parameter of photo like this


    Public delegate void Photo FilterHandler(Photo  photo);.


    The instance of this delegate can call a pointer to a function or a group of functions
    that have the signature


    ![image](d2d_images/image026.png)


    Now to make the above method extensible instead of hardcoding these photos there.
    we get rid of it and pass a delegate to this method and call  instead  the object
    of the delegate  and pass the photo object as parameter  as shown below.


    ![image](d2d_images/image143.png)


    And what it means that the above method process does not know what photo will
    be applied and is the responsibility of the user of this code to define whatever
    photo they want. Maybe a developer want to apply brightness or another wants to
    apply contrast to the photo. It is up to them. This framework need not to be recompile
    and redeploy as before.


    Now the code below will be like the code the developer who want to use the framework
    will write. Developer will initiate object of your framework class, create the
    instance of the delegate, and point it to a method in PhotoFilters()


    ![image](d2d_images/image165.png)


    So if I execute this code this will be the output


    ![image](d2d_images/image046.png)


    We can easily change this code to apply another filter as shown below


    ![image](d2d_images/image050.png)


    If we run the application, again we will get an output of two filters  like this


    ![image](d2d_images/image018.png)


    Now if as a developer I want to create a filter that is not part of the framework,
    let say a filter to remove red eye.  I will simply add it to my code but the signature
    must be the same as that of the delegate and I will call my custom filter RemoveRedEyeFilter(Photo
    photo) just the same way I call the inbuilt filters in the framework as shown
    below


    ![image](d2d_images/image068.png)


    When you run the application we will get this output


    ![image](d2d_images/image053.png)


    Therefore, delegates are very powerful and allows us to create applications that
    are flexible and extensible. As you can see, I need not to change the PhotoFilter
    class in order to add RemoveEyeFilter method


