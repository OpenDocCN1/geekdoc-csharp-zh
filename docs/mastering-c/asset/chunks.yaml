  trans: "\n\n我们如何访问此数组中的第一个元素？\n\n`var numbers = new int[3] { 21, 72, 3 };`\n\na:\
    \ `numbers.First`\nb: `numbers(0)`\nc: `numbers[0]`\nd: `numbers[1]`\n\n答案是：`c`\n\
    \n### 问题-3：\n\n我们有如下类：\n\n```csharp\npublic class Point\n{\npublic int X;\npublic\
    \ int Y;\n}\n```\n\n我们该如何创建一个 `Point` 类型的对象？\n\na: `var Point;`\nb: `Point p;`\n\
    c: `Point p = new Point;`\nd: `Point p = new Point();`\n\n答案是：`d`\n\n### 问题-4：\n\
    \n我们有如下 `TaxCalculator` 类。我们该如何调用 `Calculate` 方法？\n\n```csharp\npublic class TaxCalculator\n\
    {\npublic static float Calculate()\n{\n\n}\n}\n```\n\na: `TaxCalculator.Calculate();`\n\
    b: `new TaxCalculator().Calculate();`\n\n答案是：`a`\n\n### 问题-5：\n\n字符串中的转义字符 `\\\
    n` 表示：\n\na: 空格\nb: 换行符\nc: 制表符\n\n答案是：`b`\n\n### 问题-6：\n\n此程序的运行是什么？\n\n```csharp\n\
    var number1 = 1;\nvar number2 = number1;\nnumber2++;\nConsole.WriteLine(number1);\n\
    ```\n\na: 1\nb: 2\n\n答案是：`a`\n\n### 问题-7：\n\n我们有如下的枚举（enum）：\n\n```csharp\npublic\
    \ enum CustomerType\n{\nBronze,\nSilver,\nGold\n}\n```\n\n这段代码的输出是什么？\n\n```csharp\n\
    var type = (int)CustomerType.Bronze;\nConsole.WriteLine(type):\n```\n\na: 0\n\
    b: 1\nc: Bronze\n\n答案是：`a`\n\n# 第四章\n\n# 控制流\n\n在本章中，我们将探索 C# 中的条件语句和迭代语句，我们使用这些语句来控制程序的执行流。从本节开始，你将开始编写简单的\
    \ C# 程序。请确保你花时间完成练习，这是训练你的大脑像程序员一样思考的方法。让我们让我们吧。\n\n# 条件语句\n\n在 C# 中有如下条件语句：\n\
    \n### If / else 语句\n\n这里是 If / else 语句的基本型结构：\n\n```csharp\nIf(condition)\nSomeStatement\n\
    Else if(anotherCondition)\nanotherStatement\nelse\nyetAnotherStatement\n```\n\n\
    因此在 `if` 中，我们始终在括号内有一个 `(condition)`，如果该条件为真则将执行它，并且我们可以可选地包含 `else if` 以及可选的\
    \ `else`，如果前面的条件都不满足，则执行 `else`。\n\n我们还可以使用嵌套的 `If` 语句：\n\n```csharp\nIf(condition)\n\
    {\nIf(anotherCondition)\n// 某些语句\nelse\n```\n\n尽量避免在代码中使用多个嵌套的 `if-else` 语句，以避免使代码变得难以阅读且难以维护。\n\
    \n### Switch / Case\n\n在 `switch` 中，我们有一个变量，其值被用于比较 `case` 中其他变量的值。在下面的 `switch`\
    \ 示例中，变量是 `state`，它是一个枚举。有两个 `case` 语句通过比较 `state` 的值进行评估，如果 `state` 是 `Active`，则执行该\
    \ `case` 内的语句或动作；如果这些条件都不满足，则执行 `default`。\n\n```csharp\nSwitch(state)\n{\ncase\
    \ State.Active\nsomeStatement\nbreak;\ncase State.Inactive\nsomeStatements\nbreak;\n\
    default:\nsomeStatement\nbreak;\n}\n```\n\n让我们来看一个 IF /Else 语句运行的示例：\n\n![image](img/image055.png)\n\
    \n上面的代码非常言自明。现在我们可以使用条件运算符来代替 `If/else`。查看以下代码段：\n\n```csharp\nBool isSuperCustomer=true;\n\
    float price;\nif(isSuperCustomer)\nprice =20.12f;\nelse\nprice = 30.23f;\n```\n\
    \n上面的代码可以使用条件运算符重写为如下：\n\n```csharp\nfloat price =(isSuperCustomer )? 20.12f:\
    \ 30.23f;\n```\n\n### Switch Case 示例\n\n```csharp\nNamespace SwitchCaseExample\n\
    {\nPublic enum Season\n{\nSpring,\nSummer,\nAutumn,\nWinter\n}\nClass Program\
    \ {\nstatic void Main(string[] args)\n{\nvar season = Season.Autumn;\nswitch(season)\n\
    {\ncase Season.Autumn:\nConsole.WriteLine(“It’s autumn let go swinging “);\nbreak;\n\
    case  Season.Summer:\nConsole .WriteLine(“It’s summer”);\nbreak;\ncase Season.Winter:\n\
    Console.WriteLine(“It’s winter”);\nbreak;\ndefault:\nConsole.WriteLine(“It’s unknown”);\n\
    break;\n}\n}\n```\n（注：原文在 switch 块中存在一些逻辑错误，我在保持上下文的同时清理了结构）。\n\n# 迭代语句\n\n每种编程语言都有迭代语句，用于重复执行一组语句。在\
    \ C# 中我们有：\n\n* For 循环\n* Foreach 循环\n* While 循环\n* Do-While 循环\n\n### For 循环\n\
    \n让我们检查 `for` 的语法：\n\n```csharp\nfor(var i=0; i < 10; i++)\n{\n```\n\n`For` 循环包含三个部分：初始化子句是我们在创建计数器的地方（`var\
    \ i=0`），第二部分是条件（`i < 10`），第三部分是迭代子句（`i++`）。大括号内的语句将不断执行。\n\n### Foreach 循环\n\n\
    这用于遍历任何类型的列表元素。`foreach` 的语法是：\n\n```csharp\nforeach (var number in numbers)\n\
    {\n```\n\n在这里我们有一个临时变量 `number`，`foreach` 关键字用于遍历 `numbers`。假设 `numbers` 是一个列表，每次迭代中\
    \ `number` 将持有当前值。\n\n### While 循环\n\n```csharp\nWhile (k < 10)\n{\nk++;\n}\n\
    ```\n\n在 `while` 循环中有一个条件，只要它有效循环就会执行。通常我们有一个计数器，它与 `for` 循环相似但语法不同。\n\n### Do-While\
    \ 循环\n\n```csharp\ndo\n{\ni++;\n} while (i<10);\n```\n\n`Do-While` 循环与 `while`\
    \ 循环略有不同，在 `do-while` 循环中，条件至少执行一次，因为条件是在循环结束时评估的。这里我们有 `do` 以及一个要执行的语句块，一个要递增或递减的计数器，以及后面跟一个评估条件的\
    \ `while` 关键字。注意你并不总是需要在 `do-while` 循环中使用计数器。这取决于你想实现什么。\n\n### Break 和 Continue\n\
    \n`break`:帮助你跳出循环\n`continue`: 跳到下次迭代\n\n#### For 循环示例\n\n假设我们想显示从 1 到 10 的偶数。以下代码可以实现此目标：\n\
    \n```csharp\nfor (int i = 1; i <= 10; i++)\n{\n    if (i % 2 == 0)\n    {\n  \
