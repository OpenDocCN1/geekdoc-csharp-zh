    这种安排的有趣之处在于 `VideoEncoder` 对 `mail service`（邮件服务）一无所知，这意味着将来如果我们想扩展应用程序并添加 SMS
    功能，我们只需要创建一个新的 `MessageService` 类，并让它订阅 `VideoEncoder` 的事件，而 `VideoEncoder` 不需要重新编译和部署。


    ![image](img/image000.png)


    由于 `VideoEncoder` 类对 `Mail Service`（邮件服务）或 `MessageService` 类一无所知，`VideoEncoder`
    是如何通知订阅者的呢？嗯，为了让通知发生，它需要向它们发送消息。在实际代码术语中，它需要调用一个将发送该通知的方法。因此，由于 `VideoEncoder`
    不知道 `MailService` 或 `MessageService` 类的存在，为了让它知道调用哪个方法，通常发布者和订阅者之间会有一个约定，这将作为它们之间的通信模式，即一个具有特定约定签名的方法。这种方法通常称为事件处理器（event
    handlers）。当事件发生时，发布者会调用该方法，因此我们需要在 `MailService` 和 `MessageService` 类中编写这样的方法。这样当
    `VideoEncoder` 需要通知订阅者时，就会调用这个方法。


    ![image](img/image106.png)


    该方法的名称并不重要，但签名必须相同


    ![image](img/image004.png)


    再次记住 `VideoEncoder` 并不感知 `MailService` 或 `MessageService` 类。它与它们解耦，它所知道的只是具有约定签名的方法。那么，我们如何告诉
    `VideoEncoder` 调用哪个方法来发送邮件或 SMS 呢？这就是委托（delegate）出现；委托代表了发布者与订阅者之间的约定或合同，并决定了订阅者事件处理器方法的签名。


    让我们来看看实现这一点的代码。假设我们有两个类 `Video.cs` 和 `VideoEncoder.cs`，以及 `program.cs`。


    ![image](img/image098.png)T


    `video` 类仅有一个属性 `Title`，用于该视频的标题。


    此外，在 `VideoEncoder` 类中，为了赋予它发布事件的能力，我们需要定义一个委托，在该委托上定义一个事件并引发该事件。它还有一个像下面所示的编码视频的方法。


    ![image](img/image182.png)


    因此，在 `program.cs` 中，我们有一个 `MailService` 类，其方法具有约定的签名 `OnVideoEncoded` 且类型为 `void`。在这里，我们将
    `MailService` 订阅到 `VideoEncoder` 的 `VideoEncoder` 事件。


    ![image](img/image076.png)


    我们完成了，所以当我们运行它时，将得到


    ![image](img/image054.png)


    现在如果我们想发送短信，只需定义一个 `MessageService` 类，其方法与 `MailService` 具有相同的签名。


    ![image](img/image141.png)


    所以在 `program.cs` 中，我们将实例化并像在邮件服务中做的那样调用事件。


    ![image](img/image014.png)


    这是输出结果


    ![image](img/image083.png)


    这种方法的妙之处在于，为了发送短信而不是邮件，我不需要更改 `VideoEncoder` 类中的任何内容。通过事件，你可以创建发布者并添加订阅者而不改变发布者。


