    A Lambda Expression is just an anonymous method that has no access modifier (public
    or private), no name and no return statement. We use them for convenience, by
    writing less code and achieving the same result. In addition, make the code more
    readable.


    For example, let say we want to write a method that takes a number and return
    the square of the number. Typically, this is how we will write it as shown below


    ![image](d2d_images/image183.png)


    This should return 25.


    Now with lambda expression we can achieve the same thing but with less code


    The syntax for lambda expression is `args => expression`


    We read this as `args` goes to some expression. Therefore, we can write the square
    method above with lambda expression, assign it to a delegate, and then call the
    delegate as shown below


    ![image](d2d_images/image150.png)


    If we run this, it will give the same result as the previous one, which is 25


    If we do not need any arguments in lambda expression, it could be written like
    this


    ```csharp

    //() => ....

    ```


    And if we have one argument it can be used like this


    ```csharp

    // x =>...

    ```


    If we have multiple arguments, it should be surrounded by parenthesis


    ```csharp

    // (x, y, z) => .....

    ```


    In terms of scope, the square lambda expression above has access to the parameters
    passed and as well as all the variables defined within the `static void Main (args)`


