- fmt: "\nNote this curly brackets here, the first one is used to tell the compiler\
    \ that we want to declare an array and the second curly brace is to define the\
    \ size of the array.in C#, arrays have a fixed size., Here, the number 3 specifies\
    \ the size of the array. if an array is created, its size cannot be modified.\
    \ If you need a list with dynamic size, you need to use the `List` class (explained\
    \ later in the course)and the `new` operator is used to allocate memory for the\
    \ array.\n\nAn array in C# is an instance of the `Array` class in .Net. So, that’s\
    \ why here we have to use the `new` operator to allocate memory to this object.\n\
    \nTo assign values to the array for example:\n\n```\nnumbers[0]= 1;\nnumbers[1]\
    \ = 1;\nnumbers[2]= 2;\n```\n\nif you know ahead of time the values you want to\
    \ store in the array you can make use of the object initialization syntax and\
    \ shorten the above code like this:\n\n```csharp\nint[] numbers= new int [3] {\
    \ 2,8,17};\n```\n\nTo access elements in an array, we use the square bracket notation:\n\
    \n```csharp\nnumbers[0] = 2;\n```\n\nNote that in C# arrays are zero-indexed.\
    \ So the first element has index 0. Let go over to Visual Studio to demonstrate\
    \ this\n\n![image](d2d_images/image049.png)\n\nIn the code above, we use the `var`\
    \ keyword to replace the datatype of the array `numbers` being declared note also\
    \ that we use the `Console` class of the display the content of the elements in\
    \ the array. This is basic way of doing it but we can also use loop, but we will\
    \ talk about that later in this course. The output will be:\n\n![image](d2d_images/image168.png)\n\
    \nLook at the output of this code, we assigned a value 1 to the index 0 of the\
    \ `numbers` array and no values for index 1 and 2 but from the output you can\
    \ see that their default values are 0\\. This is because by default elements of\
    \ an array takes the default value of their datatype and in this case integer\
    \ is their data type and its default value is 0, the same with flags array.\n\n\
    ### Strings\n\nA string is a sequence of characters. In C# a string is surrounded\
    \ by double quotes, whereas a character is surrounded by a single quote.\n\n```csharp\n\
    string name = “Dennis”;\nchar ch = ‘A’;\n```\n\nThere are a few different ways\
    \ to create a string in C#:\n\nUsing a string literal:\n```csharp\nstring firstName\
    \ = “Dennis”;\n```\n\nUsing concatenation:\nIt is useful if you want to combine\
    \ two or more strings.\n```csharp\nstring name = firstName + “ “ + lastName;\n\
    ```\n\nUsing `string.Format`:\nThis is cleaner than concatenating multiple strings\
    \ since you can see the output.\n```csharp\nString name = string.Format(“{0} {1}”,\
    \ firstName, lastName);\n```\nAt run time the value of the `firstName` will be\
    \ placed at the index `{0}` placeholder and the `lastname` value will be placed\
    \ at `{1}`.\n\nUsing `string.Join`:\nThis is useful when you have an array and\
    \ would like to join all elements of that array with a separator like comma, which\
    \ is a string.\n\n```csharp\nvar numbers = new int[3] { 11, 27, 37 }\nstring list\
    \ = string.Join(“,”, numbers);\n```\n\nC# strings are immutable, which means once\
    \ you create them, you cannot change their value or any of their characters. The\
    \ `String` class contain some methods for modifying strings, but these methods\
    \ return a new string and do not change the original string.\n\n#### String vs\
    \ string\n\nRemember, all types in C# map to a type in .NET Framework. So, the\
    \ `string` type in C# (all lowercase), maps to the `String` class in .NET, which\
