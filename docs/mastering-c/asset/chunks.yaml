    }\n```\n\n我们可以声明一个 `ShippingMethod` 类型的变量并使用点符号来初始化它：\n\n```csharp\nvar method\
    \ = ShippingMethod.Express;\n```\n\n（注：原文后续部分存在大量重复的段落，已根据指令要求仅翻译逻辑内容）\n"
