    # POLYMORPHISM


    ![image](d2d_images/chapter_title_below.png)


    Poly means many while morph means forms, so poly morphism simply means Many forms
    .The OOP has this concept of poly morphism to provide an ability for a class to
    take more than one forms. So in C# polymorphism provides a way for the base classes
    to implement different methods that are called through the same name


    ### Method Overriding


    Method overriding means modifying the implementation of an inherited method. If
    a method is declared as `virtual` in the base class, we can override it in a derived
    class. Using the `override` keyword like seen below


    ![image](d2d_images/image090.png)


    This technique allows us to achieve polymorphism. Polymorphism is a great object-oriented
    technique that allows use get rid of long procedural switch statements (or conditionals).


    ### Let see this in action


    Look at this base class `Drawing` that has three derived classes `Circle`, `Square`,
    and `Rectangle` overriding the method `Area()` that is define in the base class
    `Drawing`


    ![image](d2d_images/image042.png)


    Each of the three derived classes below have the method `Area()` having the same
    name and signature as the parent class but with the keyword `override`, it defines
    properties and behaviors that are unique to it


    ![image](d2d_images/image011.png)


    In the program class, the object of each class were defined and the `Area` method
    is called as seen below


    ![image](d2d_images/image015.png)

    ![image](d2d_images/image100.png)


    ### Abstract Classes and Members


    Abstract modifier


    Abstract modifier states that a class or a member misses an implementation.it
    is easier to explain this with an example. Take for example our shape Class example
    below


    ![image](d2d_images/image164.png)


    So we have a `Shape` class with `Draw` Method that is declared as `virtual` and
    we have a `Circle` class that derive from the `Shape` class and in the `Circle`
    class we override the `Draw()` method and here we provide the implementation for
    drawing a circle but here we have a problem of defining an implementation for
    drawing a shape . how do we draw a shape, it doesn’t make any sense, when we talked
    about circle we know how to draw a circle or square but a shape it is almost impossible
    to define how to draw a shape because the concept of shape is too abstract, in
    situations like this, the better approach is to use abstract modifier so we can
    declare the `Draw()` method as `abstract` to indicate that this method is missing
    implementation and we leave it to the derived classes to provide an implementations


    So to change abstract modifier, the code above changes to something like this


    ![image](d2d_images/image140.png)


    Note that the `Draw()` method is declared as `abstract` and it doesn’t have a
    body. It is just a declaration


    When you declare a method or property as `abstract` the containing class needs
    to be declared as `abstract` as well


    So `abstract` classes are inherently `virtual` and can provide poly morphic behaviors
    just we have discussed.


    #### Few Rules you need to know while working with abstract classes


    The first one is that abstract members cannot include implementation as we have
    seen in this


    ```csharp

    public abstract void Draw();

    ```


    The second one is that if a member is declared as `abstract`, the containing class
    needs to be declared as `abstract` like this


    ![image](d2d_images/image057.png)


    The third one is that in the Derived classes you must implement all abstract members
    in the base class like this


    ![image](d2d_images/image167.png)


    Here the `Shape` Class has only one method `Draw()` supposing it has other methods,
    you must override them all in the `Circle` Class just the way the `Draw()` method
    was overridden. Otherwise, that derived class is going to be `abstract` too


    The last one is that abstract classes cannot be instantiated, so when you create
    a `Shape` Class as `abstract` you cannot do this


    ![image](d2d_images/image087.png)


    ### The benefits of using Abstract Classes


    - We use abstract when we want to provide some common behavior, while forcing
    other developers to follow our design. For example in our `Shape` class by declaring
    the `Draw` method as `abstract` we are making sure that anytime a developer derive
    a class from the `Shape` method they provide an implementation for the `Draw()`
    method in their derived classes . if we fail to declare the class `Shape` as abstract
    we run the risk of a developer deriving a class from the `Shape` class without
    overriding or providing implementation for the `Draw()` method.


    - We use abstract members when it doesn’t make sense to implement them in a base
    class. For example, the concept of drawing a shape is too abstract. This needs
    to be implemented in the derived classes.


    ### Sealed Classes and Members


    Sealed classes are the opposites of the abstract classes, if a `sealed` modifier
    is applied to a class, prevents derivation of classes from that class. - If applied
    to a method, prevents overriding of that method in a derived class. for example
    we can applied the `sealed` modifier to our `circle` class that was derived from
    the `Shape` class and what that means is that we cannot create a class that derive
    from the `circle` class as shown below


    ![image](d2d_images/image139.png)


    We can also decide to apply the `sealed` modifier only to the method, note that
    the `sealed` modifier can only be applied to a `virtual` method that is being
    overridden as in the case of the `Draw` method in `Circle` class. as shown below


    ```csharp

    public sealed sealed void Draw()

    ```


    ![image](d2d_images/image142.png)

