    \n# Stack<T>\n\n![image](img/chapter_title_below.png)\n\nStack 具有后进先出 (LIFO) 行为。Stack\
    \ 用于需要为用户提供回退功能的情况。例如浏览器。当你浏览不同的网站时，访问的 URL 地址被推入栈中。然后，当点击后退按钮时，栈顶项（代表当前 URL 地址）被弹出，现在我们可以获取上一个访问的地址。另一个例子是应用程序中的撤销功能；它是使用栈实现的。\n\
    \n以下是 Stack 的用法示例：\n\n```csharp\nvar stack = new Stack<string>();\n\n// 在栈中推入项\n\
    stack.Push(\"http://www.facebook.com\");\n\n// 检查栈是否包含给定项\nvar contains = stack.Contains(\"\
    http://www.facebook.com\");\n\n// 栈顶第一个项并移除\nvar top = stack.Pop();\n\n// 返回栈顶第一个项\n\
    var top = stack.Peek();\n\n// 获取栈中的项数\nvar count = stack.Count;\n\n// 从栈中移除所有项\n\
    stack.Clear();\n```\n\n与字典和列表一样，栈在内部也是使用数组实现的。然而，C# 中的数组具有固定大小，因此当你向栈中推入项时，可能需要通过重新分配一个更大的数组并将现有项复制到新数组来增加其容量。但如果不需要重新分配，push\
    \ 是 O(1) 操作；否则，如果需要重新分配，假设栈中有 n 个元素，则所有这些元素都需要复制到新数组中。其运行时间复杂度为 O(n)。\n\n`Pop()`\
    \ 方法是 O(1) 操作。\n\n`Contains()` 方法是线性搜索操作，时间复杂度为 O(n)。\n\n# Queue<T>\n\n"
- fmt: "\n`Queue` has a First-In-First-Out (FIFO) behavior. `Queues` are used in situations\
    \ where there is need to process items as they arrive.\n\nThere are three main\
    \ operations on queue and that include:\n\n* `Enqueue`: means adding an element\
    \ to the end of a queue \n* `Dequeue`: which is used to remove the element at\
    \ the front of the queue \n* `Peek`: is used to inspect the element at the front\
    \ without removing it.\n\nExample of how queue is used:\n\n```csharp\nvar queue\
    \ = new Queue<string> ();\n\n// Add an item to the queue\nqueue.Enqueue(\"transaction1\"\
    );\n\n// Check to see if the queue contains a given item\nvar contains = queue.Contains(\"\
    transaction1\");\n\n// Remove and return the item on the front of the queue\n\
    var front = queue.Dequeue();\n\n// Return the item on the front without removing\
    \ it\nvar top = queue.Peek();\n\n// Remove all items from queue\nqueue.Clear();\n\
    \n// Get the total number of items in the queue\nvar count = queue.Count;\n```\n\
    \nIn conclusion, use lists when you need to access an item by index, but searching\
    \ for an item in a list is quite slow because the search is a linear search.\n\
    \nDictionaries provide fast access or lookups by key. Keys must be unique and\
    \ cannot be null.\n\n`HashSets` are great when you need fast access or lookups\
    \ to check if an element exists in a set or not.\n\n`Stacks` gives the LIFO (Last-In-First-Out)\
    \ behavior and are beneficial when you need to provide the user with a way to\
    \ go back.\n\n`Queues` give the FIFO (First-In-First-Out) behavior and are beneficial\
    \ for processing items in the order that they arrived.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
