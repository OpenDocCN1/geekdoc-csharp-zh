    # Preface


    This book is written to help you learn to code in `C#` immediately and with a
    very good understanding of the fundamental principles of programming


    In this book, you will learn the fundamentals of `C#` programming. No prior programming
    experience is required. You will learn everything from scratch. For an absolute
    beginner this book explains complex concepts in a simple, clear, concise and step-by-step
    way manner for easy understanding. If you are already a programmer writing programs
    in other languages but new to `C#`, this book will bring you up to speed to start
    coding in `C#` immediately


    This is a great book for anyone who wants to get started with `C#` or programming
    in general. It is never too early or too late! All you need to learn programming
    is passion and determination


    The examples in this book are packed with carefully designed exercises that help
    you learn how to think like a programmer and to demonstrate the concepts being
    explained and for deeper understanding


    For intermediate `C#` developers, from Chapter Nine to Thirteen, you will sharpen
    your skills and knowledge on the principles of object orientation including encapsulation,
    inheritance and polymorphism. I will show why encapsulation is important and how
    it helps writing a robust code. I will talk about inheritance ; it is a way to
    reuse code and unfortunately it is abused by a lot of amateur designer and developers
    I will show the promise in inheritance and introduce you to the concept of composition
    as a more flexible way to reuse code we will talk about polymorphism , I will
    show how use a piece of code that has a lot of `if/ else` and `switch case` statements
    and refactor it into an object oriented style you will also learn how to change
    the behavior of an application by extending it so instead of changing the existing
    code which may affect the quality of your application behavior instead you extend
    it by creating new classes that will change the behavior of your application and
    this is extremely perfect. Finally, we talk about interfaces; I will show how
    interfaces improve the testability and extensibility of your applications. Also
    an introduction to unit testing. I hope you will be a better developer after reading
    this book .


    From Chapter Fourteen to the end We are going to be discussing Advance topics
    like `LINQ`, `Lambda expressions`, delegates and events, exception methods, nullable
    type, `Generics`, Exception handling etc. As the English proverb said: "The taste
    of the pudding is in the eating “. Let dive in


    You can download the source code for the exercises and all the sample programs
    in this book at


    [http://dennissharp.aliencoreedge.com/](http://dennissharp.aliencoreedge.com/)


    Or send me a mail at dennissharp@aliencoreedge.com


    ## Contact Information


    I would love to hear from you.


    For feedback or queries, you can contact me at `aliencoreedge@gmail.com`.


