    # Access Modifiers


    ![image](d2d_images/chapter_title_below.png)


    Your classes should be design like a black box. They should have limited visibility
    from the outside. The implementation, the detail, should be hidden. In C #, we
    use access modiﬁers (mostly private) to achieve this. This is referred to as Information
    Hiding (and sometimes Encapsulation) in object-oriented programming.


    Public: A member declared as public is accessible everywhere. Look at the example
    below, the promote method is visible from the outside of the class Customer


    ![image](d2d_images/image023.png)


    Private: A member declared as private is accessible only from the class. Look
    at the example below


    The method CalculateRating() is visible only within the class , hence the customer
    object cannot access it the way it was able to access the Promte () method in
    the previous example rather to call this method you use the class name directly
    .


    ![image](d2d_images/image047.png)


    Protected: A member declared as protected is accessibly only from the class and
    its derived classes. Protected breaks encapsulation (because the implementation
    details of a class will leak into its derived classes) and is better to be avoided. 
    Use private methods instead


    Internal: A member declared as internal is accessibly only from the same assembly.
    Personally, I do not think it makes any sense to declare a class internal. Look
    at this example below trying to initialize the object of that class outside the
    assembly let say in program.cs will throw an error


    ![image](d2d_images/image153.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    Protected Internal: A member declared as protected internal is accessible only
    from the same assembly or any derived classes. (Sounds weird? Forget it! It’s
    not really used.) just for you to know all the access modifiers in C#


    ![image](d2d_images/image178.png)


    ### Constructors and Inheritance


    There are two things you need to know about constructors when it comes to inheritance,
    first is that at instantiation of an object the base class constructors are always
    executed first. And the second is base class constructors are not inherited.so
    you need to explicitly deﬁned the constructors in derived class.  When creating
    an object of a type that is part of an inheritance hierarchy, base class constructors
    are always executed ﬁrst. - We can use the base keyword to pass control to a base
    class constructor. It easy to explain this with an example. So here we have a
    vehicle class with registration Number as  shown below , the vehicle class has
    a constructor that initialize the  private field registration Number


    ![image](d2d_images/image096.png)


    Now let say we want to create a car Class that derives from vehicle we will use
    the base keyword to indicate that derivation as shown below


    ![image](d2d_images/image149.png)


    The base (registrationNumber) method is simply the constructor of the vehicle
    class. The constructor of the car class receives an argument called the registrationNumber
    and simply pass it to the base class.


    Get the source code of this example


