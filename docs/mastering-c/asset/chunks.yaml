    例如，假设我们创建了一个用于迁移数据库的类 `DbMigrator`，该类可以有一个名为 `Migrate()` 的单方法，其中包含了数据库迁移的详细逻辑。假设我们想在数据库迁移时记录一些细节，例如，我们可能想显示迁移开始的时间和结束的时间，如果出现任何问题，我们也记录下来。现在，我们希望在不改变
    `Migrate()` 方法细节或代码的情况下实现这些行为，相反，我们希望通过创建一个名为 `ILogger` 的接口来扩展我们的 `DbMigrator`
    类，该接口可能提供 `LogError` 和 `LogInfo` 等方法。因此，我们使用构造函数将此接口注入到 `DbMigrator` 类中，这种技术被称为依赖注入。现在，让我们创建一个实现
    `ILogger` 接口方法的类，我们称其为 `ConsoleLogger`。我们的 `DbMigrator` 类依赖于 `ILogger` 接口。它完全不知道实现
    `ILogger` 接口方法的 `ConsoleLogger` 类，它仅仅是在与接口交互。因此，我们可以在主程序中，通过为 `DbMigrator` 对象提供我们想要的实现来更改应用程序的行为。例如，在运行时，我们可以提供一个
    `ConsoleLogger` 来在控制台上记录消息。稍后，我们可能决定将消息记录在文件中（或数据库）。我们可以创建一个名为 `FileLogger` 的新类，它实现
    `ILogger` 接口并将其注入到 `DbMigrator`，并在运行时将 `ConsoleLogger` 的实现替换为 `FileLogger`。


