    For example, let’s assume we created a class `DbMigrator` for migrating our data
    base , this class can have a single method called `Migrate()` which holds the
    details of migrating the database and let assume that we want to log some details
    as the database is being migrated , for example , we may want to display the time
    the migration started and when migration finish and if any issue we log it too,
    . now we want to achieve these behaviours without changing the details or the
    code in our method `Migrate()` , instead we are going extend our `DbMigrator`
    class by creating an interface called `ILogger` which may provide methods like
    `LogError` and `LogInfo` So we inject this interface into our `DbMigrator` class
    using a constructor, this technique is called dependency injection. So let create
    a class that will implement the methods in the `ILogger` interface let call it
    `ConsoleLogger`.our `DbMigrator` class is dependent on an `ILogger` interface.
    It knows absolutely nothing about the `ConsoleLogger` class that is implementing
    the methods in the `ILogger` interface. it is simply talking to the interface
    . So we change the behavior of the application at the main program by supplying
    an implementation that we want in the `DbMigrator` object. For example, at runtime,
    we can supply a `ConsoleLogger` to log the messages on the console. Later, we
    may decide to log the messages in a file (or a database). We can simply create
    a new class and call it `FileLogger` that implements the `ILogger` interface and
    inject it into `DbMigrator`.. and at runtime swap the implementation of the `ConsoleLogger`
    with that of `FileLogger`


    ![image](d2d_images/image159.png)

    The `DbMigrator` class and the `ILogger` interface class


    ![image](d2d_images/image056.png)

    The `ConsoleLogger` Class that implements the methods in the `ILogger` interface


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image059.png)

    Injection of the `ILogger` interface into the `DbMigrator` class using a constructor


    ![image](d2d_images/image137.png)

    At runtime the `ConsoleLogger` is supplied to display messages


    ![image](d2d_images/image065.png)

    A new class `Filelogger` implementing `ILogger` interface


    ![image](d2d_images/image003.png)

    At runtime, swapping the `Consolelogger` with `FileLogger` to write the messages
    to a file


    ![image](d2d_images/image114.png)

    The output on the notepad


    So you can see we do not change one line of code in the `DbMigrator` class.


    ### Interfaces and Inheritance


    One of the common misconceptions about interfaces is that they are used to implement
    multiple inheritance in C#. This is fundamentally wrong, yet many books and videos
    make such a false claim.


    With inheritance, we write code once and re-use it without the need to type all
    that code again.


    With interfaces, we simply declare the members the implementing class should contain.
    Then we need to type all that declaration along with the actual implementation
    in that class. So, code is not inherited, even the declaration of the members!


    For example let say we have a class called `UIControl` with attributes and object
    such as `Id`, `size`, `TopLeft` and a method `Draw()`, `Focus()` and let’s create
    a class `TextBox` that derive from `UIControl` and implement two interfaces `IDraggable`
    and `IDroppable`.


    I mentioned that interfaces has nothing to do with interfaces , let me clarify
    that when you use inheritance for example when you derive from `UIControl`, `TextBox`
    automatically inherit all the codes we wrote inside the `UIControl` but with interfaces
    like in the case of `IDraggable` and `IDroppable` they have method `Drag()` and
    `Drop()` declaration with no implementations which we have to implement in the
    `TextBox` class , so there is no code to inherit nor is there any reusability
    , that is why I said that interface has nothing to do with inheritance. Syntactically
    they are written the same way as inheritance, but it is fundamentally wrong to
    say that a class inherit an interface, classes implement interfaces


    ![image](d2d_images/image095.png)


    ![image](d2d_images/image108.png)


    ![image](d2d_images/image081.png)


    ![image](d2d_images/image132.png)

    Interfaces are used to build loosely coupled testable and extensible applications
    and not for code reusability


    ––––––––


    ### Interfaces and polymorphism


    Interfaces exhibit polymorphic behaviours. Let take a look at this `VideoEncoder`
    class that send a notification to the user once a video is encode by the user.
    This notification may be through mail, SMS, or any other method. the `VideoEncoder`
    class need not to know the mechanism employ in sending this notification ., so
    we don’t want the `VideoEncoder` to be tied to a `mailService` class or `SMS`
    class , so interface will be used instead to achieve this notification. We create
    an interface `INotificationChannel`. So we create a `MailNotificationChannel`
    that will implement this interface. Again let create another class `SmsNotificationChannel`
    that implement the same interface `INotificationChannel`. So we have one interface
    and two implementations. So in our `VideoEncoder` class we will have a list of
    notification channels and we iterate through each of them to send notifications.
    We can create several implementations of this interface `INotificationChannel`.
    But the `VideoEncoder` class will remain unchanged. This also achieve close principle,
    which states that a software entity can be open for extension but close to modification.
    But there is just one step missing we need to find a way to tell `videoEncoder`
    the actual channels at runtime so how we do that is ![image](d2d_images/image156.png)

    Is define as private and we do not want to expose it to the outside. We need to
    create another method let call it `RegisterNotificationChannel` that takes in
    the `INotificationChannel` object So in our `program.cs` class we call that `RegisterNotificationChannel`
    and pass the `MailNotificationChannel` to it![image](d2d_images/image121.png).The
    `VideoEncoder` class


    ![image](d2d_images/image174.png)

    The `INotificationChannel` interface


    ![image](d2d_images/image060.png)

    The `MailNotification` class implementing the `INotificationChannel` interface


    ![image](d2d_images/image101.png)

    The `SMSNotification` class implementing the `INotificationChannel` interface


    ![image](d2d_images/image184.png)

    The `program.cs` class


    ![image](d2d_images/image097.png)

    The program output


    ### Exercise


    ### Design a workflow engine


    Design a workflow engine that takes a workflow object and runs it. A workflow
    is a series of steps or activities. The workflow engine class should have one
    method called `Run()` that takes a workflow, and then iterates over each activity
    in the workflow and runs it.


    We want our workflows to be extensible, so we can create new activities without
    impacting the existing activities.


    Educational tip: we should represent the concept of an activity using an interface.
    Each activity should have a method called `Execute()`. The workflow engine does
    not care about the concrete implementation of activities. All it cares about is
    that these activities have a common interface: they provide a method called `Execute()`.
    The engine simply calls this method and this way it executes a series of activities
    in sequence. Real-world use case: in a real-world application you may use a workflow
    in a scenario like the following:


    1- Upload a video to a cloud storage.


    2- Call a web service provided by a third-party video encoding service to tell
    them you have a video ready for encoding.


    3- Send an email to the owner of the video notifying them that the video started
    processing.

