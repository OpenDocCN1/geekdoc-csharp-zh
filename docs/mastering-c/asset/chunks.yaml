    ```\n\n你可以通过键删除对象，或者使用 `Clear()` 方法移除所有对象：\n\n```csharp\n// 通过键删除对象\ndictionary.Remove(1);\n\
    \n// 移除所有对象\ndictionary.Clear();\n```\n\n下面是在 Dictionary 中可以找到的其他重要方法：\n\n```csharp\n\
