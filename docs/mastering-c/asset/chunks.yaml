  raw: 'The benefit of static languages is early feedback at compile time while the
    benefit of  dynamic languages is that they are easier and faster to code with.
    However, on the other side we have to write more unit test to ensure that the
    code is working properly.


    C# started as a static language but. .Net Framework 4.0, they added dynamics capability
    in order to improve interoperability with


    .COM (examples are writing office applications that uses Excel or Word) and  or
    dynamic languages in .Net like Iron Python


    As we said before a dynamic type resolves its type at run time based on the value
    of the expression at runtime.


    Look at the following code


    static void Main(string[] args)


    {


    dynamic a = 100;


    Console.WriteLine("Dynamic a value: {0}, Type: {1}",a ,a.GetType().ToString());


    a = "Hello World!”;


    Console.WriteLine("Dynamic a value: {0}, Type: {1}", a, a.GetType().ToString());


    a = true;


    Console.WriteLine("Dynamic a value: {0}, Type: {1}", a, a.GetType().ToString());


    a = DateTime.Now;


    Console.WriteLine("Dynamic a value: {0}, Type: {1}", a a.GetType().ToString());


    }


    Output:


    Dynamic a value: 100, Type: System.Int32


    Dynamic a value: Hello World!!, Type: System.String


    Dynamic a value: True, Type: System.Boolean


    Dynamic a value: 01-01-2014, Type: System.DateTime


    For Methods and Properties of Dynamic Type


    Let say you assign a class object to a dynamic type, the compiler is not going
    to throw any exception or check if the correct method or property s of the dynamic 
    type that holds that  custom class  until at  runtime because  by assigning it
    a dynamic type , you are instructing the compiler that  the variable type  can
    change  or that it is not known until  runtime 


    Look at the following example


    public class Staff


    {


    public int StaffID { get; set; }


    public string StaffName { get; set; }


    public int Age { get; set; }


    public int StandardID { get; set; }


    public void DisplayStaffDetail()


    {


    Console.WriteLine("Name: {0}", this.StaffName);


    Console.WriteLine("Age: {0}", this.Age);


    Console.WriteLine("Standard: {0}", this.StandardID);


    }


    }


    class Program


    {


    static void Main(string[] args)


    {


    dynamic dynamicStaff = new Staff();


    dynamicStaff. DisplayStaffDetail();


    dynamicStaff.CreateStaff();


    }


    }


    If you look at the above code you will see that there is no place where we define
    the  method CreateStaff() , however the compiler will not give any error  because
    it will skips type checking  because it is dynamic type  but at runtime we will
    have runtime error.


    Using Dynamic Type as a method Parameter


    When a method have a dynamic type as its parameter, it can accept any type of
    parameter at run time.


    Look at the following codes


    class Program


    { 


    static void PrintValue(dynamic obj)


    {


    Console.WriteLine(obj);


    }


    static void Main(string[] args)


    {


    PrintValue(“Hello World!!”);


    PrintValue(100);


    PrintValue(100.50);


    PrintValue(true);


    PrintValue(DateTime.Now);


    }


    }


    Output:


    Hello World!


    100


    100.50


    True


    01-01-2014 10:10:50


    Note these about dynamic type:


    ❖  Dynamic types are resolved at runtime and not at compile time.


    ❖  The compiler does not do type checking for dynamic type. Therefore, it does
    not give any error about dynamic types at compile time.


    ❖  Dynamic types actually shows no intellisense support in visual studio.


    ❖  A method can have dynamic type as its parameter or one of its parameter.


    ❖  if a method or property is not compatible at runtime, an exception is thrown.


