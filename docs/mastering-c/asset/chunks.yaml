    # C# 基础


    ![image](img/chapter_title_below.png)


    ## 什么是 C#？


    C#（读音为“C-Sharp”）是由微软公司由 Anders Hejlsberg 和 Scott Waltemath 领导的团队开发的编程语言，它专为 `.NET`
    平台设计，旨在帮助快速方便地迁移到 `.NET`。C# 由根根于 `C`、`C++` 和 `Java` 的程序员编写，吸取了这些语言的优秀特性并添加了自身的新特性。由于
    C# 是构建在这些广泛使用且成熟的语言之上的，程序员发现学习 C# 既简单又有趣。


    ## C# VS NET


    C# 是一种编程语言，而 `.Net` 是一个框架。它包含一个运行时环境（`CLR`）和一个我们用于在 Windows 上构建应用程序的类库。`.Net Frameworks`
    不限于 C#，还有其他针对 `.Net Frameworks` 的语言，例如 `F#`、`VB.Net`。它还是一个允许基于 Web 的应用程序发布到各种设备（包括平板电脑、智能手机和电脑）的平台。它提供了一个让不同编程语言编写的应用程序可以相互通信的平台。


    ## CLR（公共语言运行时）


    当 C# 应用程序被编译时，C# 编译器会将你的代码编译为 `IL`（中间语言）代码。`IL` 代码是平台无关的，这使得将 C# 程序带到具有不同硬件架构和操作系统的不同计算机上运行它成为可能。为了实现这一点，我们需要
    `CLR`。当 C# 应用程序执行时，`CLR` 将 `IL` 代码编译为运行它的计算机的原生机器代码。这个过程被称为即时编译（`JIT`）。


    ## .NET 应用程序的架构


    从架构的角度来看，C# 应用程序由称为 `classes`（类）的构建块组成。`class` 是数据（属性）和方法（函数）的容器。属性代表应用程序的状态。方法包含代码。它们拥有逻辑。这包含了我们的算法和代码。


    `namespace`（命名空间）是相关类的容器。因此，随着应用程序规模的增大，你可能希望将相关的类分组到不同的命名空间中，以获得更好的可维护性。


    随着类和命名空间数量进一步增加，你可能希望将相关的命名空间物理上分离到不同的程序集中。`assembly`（程序集）是一个文件（`DLL` 或 `EXE`），包含一个或多个命名空间和类。`EXE`
    文件代表一个可以执行的程序。而 `DLL` 是包含可以在不同程序间重用代码的文件。


    ## 为什么学习 C#？


    C# 是一种美丽的跨平台语言，可用于构建各种应用程序。它与 `C`、`C++` 和 `Java` 有类似的特性和语法，但比它们更容易学习。此外，由于它是 `.Net`
    框架的一部分，它拥有许多可用的库，让你能够快速开发应用程序，而无需从零开始一切。使用 C#，你可以构建：


    - 移动应用（适用于 Windows、Android 和 iOS）

    - 游戏

    - 网站

    - 桌面应用程序


    此外，C# 是一种面向对象的[命令式语言](https://en.wikipedia.org/wiki/Imperative_programming)，这意味着你告诉计算机做什么，并将这些命令封装成对象，以模拟你想要的世界。C#
    的多性为你带来了许多职业选择。


    ## 获取 Visual Studio


    要编写 C# 代码，你需要 `Microsoft Visual Studio`。`Visual Studio` 有不同的版本：社区版（Community）、专业版（Professional）和
    Ultimate 版（Ultimate）。


    作为个人、学生或小团队，你可以免费下载 `Visual Studio Community Edition` 并用它构建免费或付费应用。要下载 `Visual
    Studio Community Edition`，请访问：[`www.visualstudio.com/en-us/products/visual-studio-community-vs.aspx`](https://www.visualstudio.com/en-us/products/visual-studio-community-vs.aspx)


    ![image](img/image145.png)


    ––––––––


    ![image](img/scene_break.png)


    ## 我们的第一个 C# 应用程序


    让我们快速浏览 Visual Studio 并构建一个简单的 C# 应用程序。


    打开 `Visual studio` > `File`（文件） > `New`（新建） > `Project`（项目）


    ![image](img/image131.png)


    在上面的图片左侧，我们有模板，在这里你可以看到用 C# 构建的应用程序类型，正如你在列表中看到的，我们可以构建桌面应用程序、Web、移动、窗口、云等。然而，在本书中，我们将关注控制台应用程序（Console
    applications）。


    `Console application` 是一种非常简单的应用程序，没有图形用户界面。此外，它是学习新语言的极佳学习工具。


    所以，从左侧窗口选择 `console applications`，给它起一个名称，在这里我们将命名为 `HelloWorld`，并选择 `Location`（位置），你可以把它放在任何你想的地方，可以在桌面上为本课程创建一个文件夹并保存到那里。


    同样注意 Visual Studio 中 `solution`（解决方案）的概念，这意味着一个 `solution` 可以包含一个或多个项目，但目前我们不需要担心它。


    命名名称后点击 `ok`，下面的界面是我们的默认界面


    ![image](img/image027.png)


    有些开发者第一次打开 `visual studio` 时会被很多面板和图标吓到。但事实是，90% 的时间里你只需要代码编辑器和 `solution explorer`。如果你找不到
    `solution explorer`，只需前往 `VIEW`（视图） > `Solution Explorer`。


    `solution Explorer` 持有我们的项目，在本例中名为 `HelloWorld`；`References`（引用）是 `.Net framework`
    的一部分，用于添加可能需要的类引用；`App.config` 是一个 XML 文件，我们在其中存储应用程序的配置或数据库连接字符串或你想存储任何设置；最后
    `program.cs` 是我们开始编写代码的类。


    ![image](img/image007.png)


    在这个文件 `program.cs` 中，顶部有一组 `using` 语句。


    我们有一个名为 `HelloWorld` 的 `namespace`，它是 visual studio 使用我们为第一个控制台应用程序命的名字创建的。在 C#
    中，我们可以访问此命名空间下的任何类，但如果我们想访问命名空间之外的任何类，我们需要使用 `using` 关键字导入类所在的命名空间，因此默认 有：


    - `System`：这是 `.Net Framework` 中的一个命名空间，包含了所有基础工具类和原始类型类

    - `System.Collections.Generics`：用于处理列表集合等。

    - `System. LINQ`：用于处理数据

    - `System. Text`：用于处理文本、编码等

    - `System .Threading. Tasks:`：用于构建多线程应用程序。


    在我们的应用程序中，我们将只使用 `System`


