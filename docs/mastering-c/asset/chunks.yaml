    ![image](d2d_images/chapter_title_below.png)


    As you know in C#, a value type cannot be null. For example, if you define a bool
    it can have either a True or False.


    bool hasAcess = true; // or false


    But there are some situations that you will like to cater for null values, let
    say you are  working with the database and  you have a table called customers 
    and a column called Birth Date  which  is type datetime and can be  null; because
    not everyone will like to put their  birth date. In that case, if you want to
    map that table to a C# class, you will need a nullable type to do that.


    Any Datatype can be declared nullable using the operator "?"


    Let see Nullable in action  here we have a nullable DateTime object  assigned
    a date and to  assing a value type DateTime object  date2  we call a method GetValue
    Or Default() in the DateTime Library so that  if the  nullable date is null a
    default value will be assigned to  the date2  without  our application crashing.


    ![image](d2d_images/image113.png)


    Ok let talk about Null Coalescing Operator which is represented using ??


    ![image](d2d_images/image092.png)


    What the above code means is that if date is not null assign date to date2 if
    not assign it the value of DateTime.Today .  This is a short way of writing the
    if/ else conditional statement or even the ternary operator method when checking
    for null value


    Note that that you cannot have an operation between a nullable type and the value
    type because they are not compatible f or example if you have the following code
    int? k=4;


    Int s=3;


    Int z = k * s;


    Console.WriteLine(z.ToString());


    Console.ReadLine();


    This will generate an error telling you that “cannot implicitly convert type int? 
    to int . (Are you missing a cast?)”


    In this scenario to avoid the above error you may need to declare the entire variable
    as nullable


    int? k=4;


    Int ?s=3;


    Int ?z = k * s;


    Console.WriteLine(z.ToString());


    Console.ReadLine();


    This time you get no error and the output will be given.


    For recap, these are features of Nullable Types or point to note about Nullable
    Type


    ❖  Nullable types are only used with value types.


    ❖  An InvalidOperationException will be thrown if value is null; otherwise, it
    will return the value.


    ❖  The HasValue property returns a value of either true if the variable contains
    a value, or false if it is null.


    ❖  Use == and! = operators with a nullable type. For other comparison, use the
    Nullable static class.


    ❖  Nesting nullable types in a code are not allowed. For example Nullable<Nullable<float>>
    k; will give a compile time error.


