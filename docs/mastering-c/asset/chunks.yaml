  trans: "\n密封类（Sealed classes）由于了一些运行时优化，速度稍快。个人而言，我不认为这种优化会对你的应用程序产生任何影响。事实上，密封类在应用程序中很少被使用。我建议你在你的应用程序中避免使用密封类；我觉得这是一种反模式，并且可能会破坏你的继承层次结构设计。\n\
    \n## 练习\n\n### 设计数据库连接\n\n要访问数据库，我们首先需要打开一个连接，并在任务完成后关闭它。\n\n连接到数据库取决于目标数据库的类型和数据库管理系统（DBMS）。例如，连接到\
    \ SQL Server 数据库与连接到 Oracle 数据库是不同的。但这两个连接都有一些共同点：\n\n- 它们有一个连接字符串（connection\
    \ string）\n- 它们可以被打开\n- 它们可以被关闭\n- 它们可能有一个超时属性（因此如果连接在超时时间内无法打开，将抛出一个异常）。\n\n\
    你的任务是在名为 `DbConnection` 的基类中表示这些共同点。该类应该包含两个属性：\n- `ConnectionString : string`\n\
    - `Timeout : Timespan`\n\n如果 `DbConnection` 没有连接字符串，它将不处于有效状态。因此，你需要在该类的构造函数中传递一个连接字符串。此外，考虑到发送\
    \ null 或空字符串作为连接字符串的情况。确保抛出异常，以保证你的类始终处于有效状态。\n\n我们的 `DbConnection` 还应该有两个用于打开和关闭连接的方法。我们不知道如何在\
    \ `DbConnection` 中打开或关闭连接，这应该留给派自 `DbConnection` 的类来处理。这些类（例如 `SqlConnection`\
    \ 或 `OracleConnection`）将提供具体的实现。因此，你需要将这些方法声明为抽象（abstract）。\n\n从 `DbConnection`\
    \ 派生两个类 `SqlConnection` 和 `PostgreSqlConnection`，并使用 `Console.WriteLine()` 提供打开和关闭连接的简单实现。在现实世界中，SQL\
    \ Server 提供了打开或关闭数据库连接的 API。对于这个练习，我们不需要担心这个。\n\n# 第十三章\n\n# 接口 (INTERACES)\n\n\
    接口是一种语言结构，在语法上与类相似，但本质上不同。接口仅仅是类应该提供的能力（或服务）的声明。\n\n以下是我们如何声明接口而不是使用 `class` 关键字，我们使用\
    \ `interface` 关键字，并且知道在 .Net 中所有接口都以字母 `I` 开头。这是一种约定，如下例所示：\n\n```csharp\npublic\
    \ interface ITaxCalculator\n{\n    int Calculate();\n}\n```\n\n与类不同，接口没有实现。所以你在上面的示例中看到我们有一个名为\
    \ `Calculate()` 的方法，它仅仅是一个装饰，它没有实现，也没有访问修饰符。\n\n此接口规定，想要扮演税务计算器角色的类应该提供一个名为 `Calculate()`\
    \ 的方法，该方法不接受参数并返回一个 `int`。该类的实现可能如下：\n\n```csharp\npublic class TaxCalculator\
    \ : ITaxCalculator\n{\n    public void Calculate() { ... }\n}\n```\n\n- 所以，接口纯粹是一个声明。接口的成员没有实现。\n\
    - 接口只能声明方法和属性，但不能声明字段（fields），因为字段涉及实现细节。\n- 接口成员没有访问修饰符。\n\n### 为什么要用接口？\n\n\
    - 接口有助于构建松耦合的应用程序。通过在两个类之间放置接口，我们减少了类之间的耦合。这样一来，如果其中一个类发生变化，它对依赖于它的类就不会产生影响（只要接口保持不变）。\n\
    \n让我们看这个类比来帮助更好地理解。思考餐厅和厨师的概念。假设餐厅需要一个具有特定能力的厨师，根据这个定义，你可以让任何具有这些能力的人担任餐厅的厨师角色，因此餐厅和厨师之间的依赖是松耦合的。如果那个厨师发生了什么，比如他生病了或辞职了，我们可以找其他人来这个这个角色。相反，如果我们说餐厅需要\
    \ John 来担任厨师，这意味着餐厅非常依赖 John。如果 John 发生了什么事或决定不来上班，餐厅就会遇到麻烦。这就是紧密耦合依赖的定义。也就是说，餐厅与\
    \ John 是紧密耦合的。\n\n但在软件开发中，构建一个组件或类之间松耦合的应用程序是最佳实践，这样对一个类所做的更改对其他类或组件的影响将降到最低或为零。\n\
    \n### 接口与可测试性\n\n单元测试是自动化实践的一部分，有助于提高代码的质量。通过自动化测试，我们编写代码来测试自己的代码。这有助于在更改代码时尽早发现错误。\n\
    \n为了对一个类进行单元测试，我们需要对其隔离。这意味着：我们需要假设应用程序中的其他所有类都运行正常，并查看被测试的类是否按预期工作。与其他类有紧密依赖的类是无法隔离的。为了解决这个问题，我们使用接口。这里有一个示例：\n\
    \n```csharp\npublic class OrderProcessor\n{\n    private IShippingCalculator _calculator;\n\
    \n    public Customer(IShippingCalculator calculator)\n    {\n        _calculator\
    \ = calculator;\n    }\n}\n```\n\n- 所以这里，`OrderProcessor` 不依赖于 `ShippingCalculator`\
    \ 类。它只依赖于接口（`IShippingCalculator`）。如果我们更改了 `ShippingCalculator` 内部的代码（例如添加新方法或更改方法实现），它对\
    \ `OrderProcessor` 就没有影响（只要接口保持不变）。\n\n### 接口与扩展性\n\n我们可以使用接口通过“扩展”其代码（而不是更改现有代码）来改变应用程序的行为。如果一个类依赖于接口，我们可以在运行时提供该接口的另一个实现。这样，应用程序的行为就会改变，而不会对该类产生任何影响。\n\
    \n"
