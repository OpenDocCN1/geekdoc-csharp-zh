    application , , first  is Encapsulation, which we have  earlier discussed , secondly
    , is the relationships between classes which h is the topic of the this section 
    and  lastly the interfaces


    ### Relationships Between Classes


    We have two types of relationships between classes: Inheritance and Composition.


    Inheritance


    This is simply a kind of relationship between two classes that allows one to inherit
    business logics from the other. It is usually referred to as Is-A relationship:
    for example, you can say that red is a color.


    The advantages of inheritance are


    Code re-use: which means encapsulating a code in one class and re-use it in another
    and polymorphic behavior; which is greatly powerful.


    Syntax for inheritance


    Let say we have a class Vehicle and another class Car that inherits from Vehicle
    class


    public class Vehicle {


    // common shared code


    }


    public class Car : Vehicle  {


    // code specific to Car


    }


    Note that in C#, a class can have only one parent as you can see the car class
    inheriting the vehicle class as its parent


    ### Inheritance Demo


    ![image](d2d_images/image041.png)


    ![image](d2d_images/image075.png)


    ![image](d2d_images/image074.png)


    We created two classes Vehicle and Car with car inheriting from Vehicle and calling
    methods in vehicle.


    ### Composition


    This is another kind of relationship that allows one class to contain another. 
    We refer to composition as Has-A relationship. For example, A Car has an Engine.
    Look at this UML notation of this example


    ![image](d2d_images/image133.png)


    The Beneﬁts of a composition are: Code re-use, ﬂexibility and a means to achieve
    loose-coupling.


    ### Let see Composition in action


    ![image](d2d_images/image067.png)


    As shown in the figure above, Car class has a couple of instance variable and
    few methods. Maruti is a specific type of Car, which extends Car class means Maruti
    IS-A Car.


    ![image](d2d_images/image171.png)


    Maruti class uses Engine object’s start () method via composition. We can say
    that Maruti class HAS-A Engine


    ![image](d2d_images/image105.png)


    in the Program.cs class , the  object of Maruti class is  initialized . Though
    Maruti class does not have setColor(), setMaxSpeed() and carInfo() methods still
    we can use it due to IS-A relationship of Maruti class with Car class.


    ![image](d2d_images/image109.png)


    If we run it we can see output like below.


    ![image](d2d_images/image009.png)


    ### Composition VS Inheritance


    -Problems with inheritance:


    ›  It is easily abused by amateur designers / developers


    ›  it Leads to large complex hierarchies of class.


    ›  Fragility: Such hierarchies are very fragile and a change may affect many classes
    .


    ›  It results in tight coupling


    Beneﬁts of composition:


    Flexible: Any inheritance relationship can be translated to composition.


    Leads to loose coupling


    Having said all that, it does not mean inheritance should be avoided at all times.
    In fact, it’s great to use inheritance when dealing with very stable classes on
    top of small hierarchies. As the hierarchy grows (or variations of classes increase),
    the hierarchy, however, becomes fragile. Moreover, that’s where composition can
    give you a better design.


