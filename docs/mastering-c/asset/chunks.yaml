    If you have been designing and writing web application for a long time, then there
    is a high probability that you must have encountered a lot of bad response time
    of web applications. Before `AJAX`, it is nearly impossible to change a small
    portion of content without reloading the entire page. The scenario is made worse
    with a slow internet connection. However, these days, the situation has changed.
    We can make any changes without reloading an entire page or without touching another
    element. Hence, there is an increase in performance and the user''s experience.
    So, how is it done? You could be thinking AJAX, right? Yes, Ajax is an asynchronous
    technique to exchange data between the server and the client. Therefore, the major
    aim of `AJAX` is to call a server method and exchange data from the server without
    obstructing any activity that is being carried out by the client. Therefore, clients
    need not wait for the server''s response.


    In `C#` 5.0, Microsoft introduced asynchronous programming which has given `C#`
    Developers, the opportunity to write our own asynchronous code with `C#`.


    ### Synchronous and Asynchronous Programming?


    In synchronous execution model, program is executed line by line, one at a time.
    When a function is called, and program execution has to wait until the function
    returns.


    For Asynchronous program, when a method is called, program execution continues
    to the next line, without waiting for the function to complete. Asynchronous programming
    improves responsiveness for example, in the window media player, when you are
    playing your video or music. The UI is designed to be responsive, you can resize
    your window, you can move it around even as your video or music is playing and
    this is because it is programmed asynchronously otherwise as you try to move it
    around the window will freeze.. The same time with your web browser as you download
    contents from the web the UI is still functioning. It is responsive and that is
    the benefit of the Asynchronous programming.


    ### When to Use Asynchronous


    It is best used if you have blocking operations such as accessing the web, working
    with files and databases or working with images.


    ### How do we use asynchronous technique in our applications?


    In `C#`, we have two common Traditional approaches before `.Net` 4.5 and that
    is Multithreading and Callbacks methods all these approaches are hard and complex
    to learn. Therefore, in `.Net` 4.5 Microsoft introduced a new Asynchronous programming
    model, which was called Task base asynchronous model. There are two major keywords
    that is used to achieve this asynchronous programming; they are called `Async`
    and `Await`.


    #### Async


    This keyword qualify a function as an asynchronous function. Therefore, if a function
    has `async` specified in its front, then that function is asynchronous. Look at
    the syntax for asynchronous method.


    ```csharp

    public async Task DrawProcess()

    {


    }

    ```


    Here the `DrawProcess()` method is an asynchronous method because the `async`
    keyword is in front of it. Hence, it can be called asynchronously. It also have
    a return type called `Task`. A task is an object that encapsulate a state of an
    asynchronous operation. It comes into two forms one is of generic form and non-generic
    forms.


    The `DrawProcess()` method shows the non-generic form which means that it returns
    `void`. However, if the method is going to return let say a string, it will use
    the generic form like this `Task<string>`.


    #### Await


    When calling a method that returns the `Task<string>` we need to put the keyword
    `await` in front of the method.


    It sounds like waiting right. or gives you the impression that the program execution
    has to wait until the method is executed? No, putting `await` operator in front
    of an asynchronous method is just telling the compiler,that this operation is
    a costly one and may take a bit of time to execute. In that case, instead of blocking
    this thread, it will simply return the control immediately to the caller of the
    method, so the thread here is not going to be locked and immediately the control
    returns to method to continue executing.


    This is exactly the scenario in the example below; this is window form application
    that on clicking a button, a HTML page is downloaded. We are using async method
    to ensure that during the download the window does not freeze and is responsive
    or can be moved from one place to another on the screen. since we marked `DownloadStringTaskAsync(url)`
    with `await` operator , the method will be return immediately to the `Button_Click()`
    event that called the method , eventually when the `DownloadStringTaskAsync(url)`
    has finish executing control will be returned to async method `DownloadAsync()`
    to continue execute the rest of the code which in this case is the `StreamWriter`.
    You will also observe that for every synchronous method in the `.net` Library,
    there is corresponding an asynchronous method. for instance in our example the
    `WebClient` object called the `TaskAsync` method for `DownloadString()` and the
    `StreamWriter` called `WriteAsync()` which is the Asynchronous method for the
    `Writer()` which is a blocking operation or synchronous way to write . The idea
    here is improve the responsiveness of the application and ensure it is asynchronous
    in its execution. ![image](d2d_images/image173.png)


    For recap, recall that the return type of an asynchronous function is `Task`.
    That means when it finishes its execution it will complete a `Task`. The possible
    return types for an asynchronous method are:


    - `Void`: Means there is nothing to return

    - `Task`: It will perform one operation, and like `void`, it return nothing.

    - `Task<T>`: Will return a generic task with a `T` type parameter. (Which can
    be string, int or any other data type)


    ### Points to Note


    - A `Main` method cannot be asynchronous.

    - In addition, `Main` method cannot be invoked by the `await` operator.

    - If any asynchronous method is not invoked by the `await` operator then by nature
    it will behave like a synchronous method.

    - Function properties should not be defined as asynchronous.

    - A `try/catch` block should not call any asynchronous methods from the `catch`
    or `finally` block.

    - A class constructor or destructor should not define an asynchronous method nor
    should be called asynchronously.

