    # HashSet<T>


    ![image](d2d_images/chapter_title_below.png)


    A HashSet are a set of unique items, just like a mathematical set (e.g. {1, 2,
    3}). A hash set  must not have duplicates and the way in which the items are arrange
    is not important. Hence, both {1, 2, 3} and {2, 3, 1} are equal.


    A HashSet is used when you need super-fast lookups against a list of unique items.
    For instance, you might be processing a list of orders, and for each order, you
    need to quickly check the supplier code from a list of valid supplier codes.


    A HashSet, like a Dictionary, is a hash-based collection, there accessing items
    are very fast with O(1).But unlike a dictionary, it doesn’t store key/value pairs;
    it only stores values. Therefore, every objects should be unique and this is determined
    by the value returned from the GetHashCode () method. Therefore, if you are going
    to store custom types in a set, you need to override GetHashCode () and Equals
    () methods in your type.


    To create a HashSet:


    var hashSet = new HashSet<int>();


    You can add or remove items to a HashSet just like List:


    // Add an object to the set


    hashSet.Add(4);


    // Remove an object


    hashSet.Remove(3);


    // Remove all objects


    hashSet.Clear();


    // Check to see if the set contains an object


    var contains = hashSet.Contains(1);


    // Return the number of objects in the set And here are some other useful methods
    available in the Dictionary class:


    var count = hashSet.Count;


    HashSet provides many mathematical set operations:


    // change the set to have only the objects present in the set and the other set


    hashSet.IntersectWith(another);


    // Remove all objects that found in another set other than this set from hashSet


    hashSet.ExceptWith(another);


    // change the set to contain all objects in itself, in some other set, or both


    hashSet.UnionWith(another);


    var isSupersetOf = hashSet.IsSupersetOf(another);


    var isSubsetOf = hashSet.IsSubsetOf(another);


    var equals = hashSet.SetEquals(another);


