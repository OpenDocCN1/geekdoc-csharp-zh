    # Stack<T>


    ![image](d2d_images/chapter_title_below.png)


    Stack has a Last-In-First-Out (LIFO) behavior.  Stacks are used in cases where
    there is need to provide the user with a way to go back. For example the browser. 
    When you surf different web sites, the URL addresses that you visit are pushed
    on a stack. Then, hence when the back button is clicked, the item on the stack
    (which represents the current URL address in the browser) is popped and now we
    can get the last address you visited from the item on the stack.  Another example
    is the undo feature in the applications; it is implemented using a stack.


    Here is an example of how Stack can be used:


    var stack = new Stack<string>();


    // Push items in a stack


    stack.Push("http://www.facebook.com");


    // Check to see if the stack contains a given item


    var contains = stack.Contains("http://www.facebook.com");


    //Remove the first item on the top of the stack and remove it


    var top = stack.Pop();


    // Return the first item on the top of the stack


    var top = stack.Peek();


    // Get the number of items in stack


    var count = stack.Count;


    // Remove all items from stack


    stack.Clear();


    Also like dictionary and list, a stack is internally implemented using an array.
    However arrays in C# have a fixed size, so as you push items into a stack, there
    may be need to increase its capacity by re-allocating a larger array and copying
    existing items into the new array. But if there is no need for re-allocation,
    push is O(1) operation; otherwise, if re-allocation is required, presuming that
    the  stack has n elements, all these elements need to be copied to the new array.
    This has a runtime complexity of O(n).


    Pop() method  is an O(1) operation.


    Contains () method is a linear search operation with O(n).


