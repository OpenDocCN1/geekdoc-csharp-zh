    ![image](d2d_images/image073.png)


    So if you want to have a new line in your string, you use \n.


    Since the backslash character is used to prefix escape characters, if you want
    to use the


    backslash character itself in your string (eg path to a folder), you need to prefix
    it with


    another backslash: string path = “c:\\folder\\file.txt”;


    ### Verbatim Strings


    When there are many escape characters in a string, that string may become unreadable
    or hard to read and understand.


    var message = “Hello Dennis\nLook into this folder  path:c:\\folder1\\folder2”;


    Note the \n and double backslashes (\\) here. We can re-write this string using
    a


    verbatim string, by prefixing our string with an @ sign, and get rid of escape


    characters:


    var message = @“Hello Dennis”;


    Look into this folder path:


    c:\folder1\folder2”;


