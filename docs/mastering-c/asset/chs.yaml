  \n## 动态\n\n动态是 C# 4.0 引入的特性之一，有时会困扰一些 C# 开发者。然而，它其实很简单。通常编程语言分为静态类型语言（如 C#、Java）和动态类型语言（如\
  \ Ruby、JavaScript 和 Python）。现在这两种之间真正的区别是什么？区别在于在静态语言中，类型、成员、方法、属性的解析是在编译完成的。而在动态语言中，类型、方法、属性或成员的解析是在运行时完成的。\n\
  \n\n\n\n静态语言的优势是在编译时可以获得早期反馈，而动态语言的优势是代码编写更简单、快速。然而，另一方面，我们必须编写更多的单元测试来确保代码正常运行。\n\
  \nC# 起初是一种静态语言，但在 `.Net Framework 4.0` 中，他们添加了动态能力，以提高与 `.COM` 的互操作性（例如编写使用 `Excel`\
  \ 或 `Word` 的 应用程序）以及 `.Net` 中的动态语言（如 `Iron Python`）。\n\n正如我们之前提到的，动态类型在运行时根据表达式的值来解析其类型。\n\
  \n看下面的代码：\n\n```csharp\nstatic void Main(string[] args)\n{\n    dynamic a = 100;\n\
  \    Console.WriteLine(\"Dynamic a value: {0}, Type: {1}\",a ,a.GetType().ToString());\n\
  \    a = \"Hello World!\";\n    Console.WriteLine(\"Dynamic a value: {0}, Type:\
  \ {1}\", a, a.GetType().ToString());\n    a = true;\n    Console.WriteLine(\"Dynamic\
  \ a value: {0}, Type: {1}\", a, a.GetType().ToString());\n    a = DateTime.Now;\n\
  \    Console.WriteLine(\"Dynamic a value: {0}, Type: {1}\", a a.GetType().ToString());\n\
  }\n```\n\n输出：\n```\nDynamic a value: 100, Type: System.Int32\nDynamic a value: Hello\
  \ World!!, Type: System.String\nDynamic a value: True, Type: System.Boolean\nDynamic\
  \ a value: 01-01-2014, Type: System.DateTime\n```\n\n## 动态类型的方法和属性\n\n假设你将一个类对象赋值给\
  \ `dynamic` 类型，编译器在运行时之前不会抛出任何异常，也不会检查持有该自定义类的动态类型是否具有正确的方法或属性，因为通过将其分配动态类型，你是在告诉编译器变量类型可以改变，或者在运行时之前是未。\n\
  \n看下面的示例：\n\n```csharp\npublic class Staff\n{\n    public int StaffID { get; set;\
  \ }\n    public string StaffName { get; set; }\n    public int Age { get; set; }\n\
  \    public int StandardID { get; set; }\n    public void DisplayStaffDetail()\n\
  \    {\n        Console.WriteLine(\"Name: {0}\", this.StaffName);\n        Console.WriteLine(\"\
  Age: {0}\", this.Age);\n        Console.WriteLine(\"Standard: {0}\", this.StandardID);\n\
  \    }\n}\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n    \
  \    dynamic dynamicStaff = new Staff();\n        dynamicStaff.DisplayStaffDetail();\n\
  \        dynamicStaff.CreateStaff();\n    }\n}\n```\n\n如果你看上面的代码，你会发现没有任何地方定义了 `CreateStaff()`\
  \ 方法，然而编译器不会给出任何错误，因为它会跳过类型检查，因为它是 `dynamic` 类型，但在运行时我们将遇到一个运行时错误。\n\n## 将动态类型作为方法参数\n\
  \n当一个方法将 `dynamic` 类型作为其参数时，它可以在运行时接受任何类型的参数。\n\n看下面的代码：\n\n```csharp\nclass Program\n\
  { \n    static void PrintValue(dynamic obj)\n    {\n        Console.WriteLine(obj);\n\
  \    }\n    static void Main(string[] args)\n    {\n        PrintValue(\"Hello World!!\"\
  );\n        PrintValue(100);\n        PrintValue(100.50);\n        PrintValue(true);\n\
  \        PrintValue(DateTime.Now);\n    }\n}\n```\n\n输出：\n```\nHello World!\n100\n\
  100.50\nTrue\n01-01-2014 10:10:50\n```\n\n关于动态类型的这些注意事项：\n- `Dynamic` 类型在运行时解析，而不是在编译时。\n\
  - 编译器不会对 `dynamic` 类型进行类型检查。因此，它在编译时不会关于动态类型给出任何错误。\n- `Dynamic` 类型在 Visual Studio\
  \ 中实际上没有显示智能提示（intellisense）支持。\n- 方法可以拥有 `dynamic` 类型作为其参数或参数之一。\n- 如果方法或属性在运行时不兼容，将抛出异常。\n\
