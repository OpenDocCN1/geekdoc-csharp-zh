  \ 2;\n```\n\n注意 C# 数组是从 0 开始索引的。因此第一个元素的索引为 0。让我们进入 Visual Studio 来演示这一点\n\n![image](img/image049.png)\n\
  \n在上面的代码中，我们使用 `var` 关键字来替换声明的数组 `numbers` 的数据类型，注意我们还使用 `Console` 类来显示数组中元素的内容。这是基础方法，但我们也可以使用循环，我们将在课程的稍后部分讨论这一点。输出将是：\n\
  \n![image](img/image168.png)\n\n看这段代码的输出，我们为 `numbers` 数组的索引 0 赋值为 1，而索引 1 和 2 没有赋值，但从输出中可以看到它们的默认值是\
  \ 0。这是因为默认情况下，数组的元素取其数据类型的默认值，在这种情况下，整数是它们的数据类型，其默认值为 0，布尔标志数组也是如此。\n\n### 字符串 (Strings)\n\
  \n字符串是字符序列。在 C# 中，字符串由双引号包围，而字符由单引号包围。\n\n```csharp\nstring name = “Dennis”;\nchar\
  \ ch = ‘A’;\n```\n\n在 C# 中创建字符串有几种不同的方法：\n\n使用字符串字面量：\n```csharp\nstring firstName\
  \ = “Dennis”;\n```\n\n使用连接符：\n如果你想合并两个或多个字符串，这种方法非常有用。\n```csharp\nstring name =\
  \ firstName + “ ” + lastName;\n```\n\n使用 `string.Format`：\n这比连接多个字符串更干净，因为你可以看到输出。\n\
  ```csharp\nString name = string.Format(“{0} {1}”, firstName, lastName);\n```\n在运行时，`firstName`\
  \ 的值将被放在索引 `{0}` 占位符处，`lastname` 的值将被放在 `{1}`。\n\n使用 `string.Join`：\n当你有一个数组并想用逗号（这是一个字符串）分隔符连接数组的所有元素时，这种方法非常有用。\n\
  \n```csharp\nvar numbers = new int[3] { 11, 27, 37 }\nstring list = string.Join(“,”,\
  \ numbers);\n```\n\nC# 字符串是不可变的，这意味着一旦创建了它们，你就无法更改它们的值或任何一个字符。`String` 类包含了一些修改字符串的方法，但这些方法返回的是一个新字符串，而不是改变原始字符串。\n\
  \n#### String 与 string (String vs string)\n\n记住，C# 中的所有类型都映射到 .NET 框架中的一种类型。因此，C#\
  \ 中的 `string` 类型（全小写）映射到 .NET 中的 `String` 类，这意味着我们可以通过以下两种方式之一声明字符串：\n\n```csharp\n\
  string name;\nString name;\n```\n\n唯一的区别是，如果你使用 `String` 类型，你需要在文件顶部导入 `System`\
  \ 命名空间，因为 `String` 类定义在那里。即使用 `using System;`\n\n### 转义字符 (Escape Characters)\n\n\
  C# 中有少数特殊字符被称为转义字符，如下所示\n\n![image](img/image073.png)\n\n所以，如果你想在字符串中换行，请使用 `\\\
  n`。\n\n由于反斜杠字符用于作为转义字符的前缀，如果你想在字符串中使用反斜杠字符本身（例如文件夹路径），你需要用另一个反斜杠来作为它的前缀：\n\n```csharp\n\
  string path = “c:\\\\folder\\\\file.txt”;\n```\n\n### 逐字字符串 (Verbatim Strings)\n\
  \n当字符串中有许多转义字符时，该字符串可能会变得不可读或难以阅读和理解。\n\n```csharp\nvar message = “Hello Dennis\\\
  nLook into this folder path:c:\\\\folder1\\\\folder2”;\n```\n\n注意这里的 `\\n` 和双反斜杠\
  \ (`\\\\`)）。我们可以使用逐字字符串来重写这个字符串，通过在我们的字符串前加上 `@` 符号，并去掉转义字符：\n\n```csharp\nvar message\
  \ = @“Hello Dennis;\nLook into this folder path: c:\\folder1\\folder2”;\n```\n\n\
  ### Visual Studio 中的演示示例\n\n![image](img/image086.png)\n\n运行 `Shift + F5` 查看输出\n\
  \n### 枚举 (Enums)\n\n枚举是一种包含一组名称/值对的数据类型，当需要定义多个相关常量时使用。\n\n```csharp\npublic enum\
  \ ShippingMethod\n{\n    Regular = 1,\n    Express = 2\n}\n```\n\n我们可以声明一个 `ShippingMethod`\
  \ 类型的变量并使用点符号来初始化它：\n\n```csharp\nvar method = ShippingMethod.Express;\n```\n\n\
  （注：原文后续部分存在大量重复的段落，已根据指令要求仅翻译逻辑内容）\n\n\n\n\n我们如何访问此数组中的第一个元素？\n\n`var numbers =\
  \ new int[3] { 21, 72, 3 };`\n\na: `numbers.First`\nb: `numbers(0)`\nc: `numbers[0]`\n\
  d: `numbers[1]`\n\n答案是：`c`\n\n### 问题-3：\n\n我们有如下类：\n\n```csharp\npublic class Point\n\
