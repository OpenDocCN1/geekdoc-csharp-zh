- "# C# 高级指南\n\n\n\n![](img/cover.jpg)\n\n\n\n\n\n\n# 前言\n\n本书的编写目的是帮助你立即学习 `C#` 代码，并对编程的基本原理有非常好的理解。\n\
  \n在书中，你将学习 `C#` 编程的基础知识。不需要任何先前的编程经验。你将从零开始。对于完全的初学者，本书将以简单、清晰、简洁且循序渐进的方式解释复杂概念，以便于理解。如果你已经是一个使用其他语言编写程序的程序员，但对\
  \ `C#` 还是新手，这本书将帮助你快速进入状态并立即开始编写 `C#` 代码。\n\n对于任何想要开始学习 `C#` 或通用编程的人来说，都是一本极佳的书。学习编程什么时候都不早，也不晚！你学习编程只需要热情和决心。\n\
  \n书中的示例充满了精心设计的练习，这些练习帮助你学习如何像程序员一样思考，演示所解释的概念，并加深理解。\n\n对于中级 `C#` 开发人员，从第九章到第十三章，你将提高你在面向对象原则（包括封装、继承和多态）方面的技能和知识。我将展示为什么封装很重要，以及它如何帮助编写健壮的代码。我将讨论继承；它是重用代码的一种方式，遗憾的是被许多业余设计师和开发者滥用。我将展示继承的价值，并向你介绍组合这一概念，作为一种更灵活的代码重用方式。我们将讨论多态，我将展示如何将一段包含大量\
  \ `if/ else` 和 `switch case` 语句的代码重构为面向对象的风格。你还将学习如何通过扩展应用程序来改变其行为，这样就不是修改可能会影响应用程序行为质量的现有代码，而是通过创建新类来改变应用程序的行为，这非常完美。最后，我们谈论接口；我将展示接口如何提高应用程序的可测试性和扩展性。此外还有单元测试的介绍。我希望你在读完这本书后成为一名更好的开发者。\n\
  \n从第十四章到结束，我们将讨论一些高级主题，如 `LINQ`、`Lambda expressions`、委托和事件、异常方法、可空类型、`Generics`、异常处理等。正如英语谚语所说：“不尝尝不知甜”。让我们开始吧。\n\
  \n你可以在此处下载书中的练习题源码和所有示例程序的源码：\n\n[`dennissharp.aliencoreedge.com/`](http://dennissharp.aliencoreedge.com/)\n\
  \n或发送邮件至我：dennissharp@aliencoreedge.com\n\n## 联系信息\n\n我很乐意听到你的反馈。\n\n如有反馈或查询，你可以通过\
  \ `aliencoreedge@gmail.com` 联系我。\n\n\n\n# 第一章\n\n## C# 简介\n\n欢迎学习 `C#` 基础编程，非常高兴你选择了这本书！\n\
  \n本书旨在帮助初学者和资深程序员快速学习 `C#` 编程。本书的目的是让非程序员学习良好的 `C#` 编程基础技能，并让经验丰富的开发者获得对该语言的严谨解释，从而提高他们的编程技能。\n\
  \n使用 Micro soft Visual Studio 准备好了吗？\n\n我们要学习的内容有很多，让我们开始吧。\n\n\n\n\n\n![image](img/chapter_title_above.png)\n\
  \n# C# 基础\n\n![image](img/chapter_title_below.png)\n\n## 什么是 C#？\n\nC#（读音为“C-Sharp”）是由微软公司由\
  \ Anders Hejlsberg 和 Scott Waltemath 领导的团队开发的编程语言，它专为 `.NET` 平台设计，旨在帮助快速方便地迁移到 `.NET`。C#\
  \ 由根根于 `C`、`C++` 和 `Java` 的程序员编写，吸取了这些语言的优秀特性并添加了自身的新特性。由于 C# 是构建在这些广泛使用且成熟的语言之上的，程序员发现学习\
  \ C# 既简单又有趣。\n\n## C# VS NET\n\nC# 是一种编程语言，而 `.Net` 是一个框架。它包含一个运行时环境（`CLR`）和一个我们用于在\
  \ Windows 上构建应用程序的类库。`.Net Frameworks` 不限于 C#，还有其他针对 `.Net Frameworks` 的语言，例如 `F#`、`VB.Net`。它还是一个允许基于\
  \ Web 的应用程序发布到各种设备（包括平板电脑、智能手机和电脑）的平台。它提供了一个让不同编程语言编写的应用程序可以相互通信的平台。\n\n## CLR（公共语言运行时）\n\
  \n当 C# 应用程序被编译时，C# 编译器会将你的代码编译为 `IL`（中间语言）代码。`IL` 代码是平台无关的，这使得将 C# 程序带到具有不同硬件架构和操作系统的不同计算机上运行它成为可能。为了实现这一点，我们需要\
  \ `CLR`。当 C# 应用程序执行时，`CLR` 将 `IL` 代码编译为运行它的计算机的原生机器代码。这个过程被称为即时编译（`JIT`）。\n\n##\
  \ .NET 应用程序的架构\n\n从架构的角度来看，C# 应用程序由称为 `classes`（类）的构建块组成。`class` 是数据（属性）和方法（函数）的容器。属性代表应用程序的状态。方法包含代码。它们拥有逻辑。这包含了我们的算法和代码。\n\
  \n`namespace`（命名空间）是相关类的容器。因此，随着应用程序规模的增大，你可能希望将相关的类分组到不同的命名空间中，以获得更好的可维护性。\n\n\
  随着类和命名空间数量进一步增加，你可能希望将相关的命名空间物理上分离到不同的程序集中。`assembly`（程序集）是一个文件（`DLL` 或 `EXE`），包含一个或多个命名空间和类。`EXE`\
  \ 文件代表一个可以执行的程序。而 `DLL` 是包含可以在不同程序间重用代码的文件。\n\n## 为什么学习 C#？\n\nC# 是一种美丽的跨平台语言，可用于构建各种应用程序。它与\
  \ `C`、`C++` 和 `Java` 有类似的特性和语法，但比它们更容易学习。此外，由于它是 `.Net` 框架的一部分，它拥有许多可用的库，让你能够快速开发应用程序，而无需从零开始一切。使用\
  \ C#，你可以构建：\n\n- 移动应用（适用于 Windows、Android 和 iOS）\n- 游戏\n- 网站\n- 桌面应用程序\n\n此外，C#\
  \ 是一种面向对象的[命令式语言](https://en.wikipedia.org/wiki/Imperative_programming)，这意味着你告诉计算机做什么，并将这些命令封装成对象，以模拟你想要的世界。C#\
  \ 的多性为你带来了许多职业选择。\n\n## 获取 Visual Studio\n\n要编写 C# 代码，你需要 `Microsoft Visual Studio`。`Visual\
  \ Studio` 有不同的版本：社区版（Community）、专业版（Professional）和 Ultimate 版（Ultimate）。\n\n作为个人、学生或小团队，你可以免费下载\
  \ `Visual Studio Community Edition` 并用它构建免费或付费应用。要下载 `Visual Studio Community Edition`，请访问：[`www.visualstudio.com/en-us/products/visual-studio-community-vs.aspx`](https://www.visualstudio.com/en-us/products/visual-studio-community-vs.aspx)\n\
  \n![image](img/image145.png)\n\n––––––––\n\n![image](img/scene_break.png)\n\n##\
  \ 我们的第一个 C# 应用程序\n\n让我们快速浏览 Visual Studio 并构建一个简单的 C# 应用程序。\n\n打开 `Visual studio`\
  \ > `File`（文件） > `New`（新建） > `Project`（项目）\n\n![image](img/image131.png)\n\n在上面的图片左侧，我们有模板，在这里你可以看到用\
  \ C# 构建的应用程序类型，正如你在列表中看到的，我们可以构建桌面应用程序、Web、移动、窗口、云等。然而，在本书中，我们将关注控制台应用程序（Console\
  \ applications）。\n\n`Console application` 是一种非常简单的应用程序，没有图形用户界面。此外，它是学习新语言的极佳学习工具。\n\
  \n所以，从左侧窗口选择 `console applications`，给它起一个名称，在这里我们将命名为 `HelloWorld`，并选择 `Location`（位置），你可以把它放在任何你想的地方，可以在桌面上为本课程创建一个文件夹并保存到那里。\n\
  \n同样注意 Visual Studio 中 `solution`（解决方案）的概念，这意味着一个 `solution` 可以包含一个或多个项目，但目前我们不需要担心它。\n\
  \n命名名称后点击 `ok`，下面的界面是我们的默认界面\n\n![image](img/image027.png)\n\n有些开发者第一次打开 `visual\
  \ studio` 时会被很多面板和图标吓到。但事实是，90% 的时间里你只需要代码编辑器和 `solution explorer`。如果你找不到 `solution\
  \ explorer`，只需前往 `VIEW`（视图） > `Solution Explorer`。\n\n`solution Explorer` 持有我们的项目，在本例中名为\
  \ `HelloWorld`；`References`（引用）是 `.Net framework` 的一部分，用于添加可能需要的类引用；`App.config`\
  \ 是一个 XML 文件，我们在其中存储应用程序的配置或数据库连接字符串或你想存储任何设置；最后 `program.cs` 是我们开始编写代码的类。\n\n![image](img/image007.png)\n\
  \n在这个文件 `program.cs` 中，顶部有一组 `using` 语句。\n\n我们有一个名为 `HelloWorld` 的 `namespace`，它是\
  \ visual studio 使用我们为第一个控制台应用程序命的名字创建的。在 C# 中，我们可以访问此命名空间下的任何类，但如果我们想访问命名空间之外的任何类，我们需要使用\
  \ `using` 关键字导入类所在的命名空间，因此默认 有：\n\n- `System`：这是 `.Net Framework` 中的一个命名空间，包含了所有基础工具类和原始类型类\n\
  - `System.Collections.Generics`：用于处理列表集合等。\n- `System. LINQ`：用于处理数据\n- `System.\
  \ Text`：用于处理文本、编码等\n- `System .Threading. Tasks:`：用于构建多线程应用程序。\n\n在我们的应用程序中，我们将只使用\
  \ `System`\n\n\n\n\n我们用 visual studio 创建的每个控制台程序在程序内部都有一个名为 `program` 的类，在 program\
  \ 内部，我们有一个名为 `Main()` 的默认方法，它是应用程序的入口，一切都从这里开始。该方法被声明为 `static`，这是我们稍后会学习的内容；方法有输入和输出；括号内的是输入，我们之为\
  \ `parameters`（参数）或 `arguments`（参数）。知道参数是可选的，但在这种默认模板情况下，`Main` 方法有一个名为 `args` 的参数，类型为\
  \ `string array`，我们稍后也会学习；在方法名 `Main()` 之前看到的是返回类型或输出，在这种情况下是 `void`，这意味着该方法不返回任何值，它只包含一些代码。\n\
  \n同样注意 `C#` 是区分大小大小的；因此，如果你用小字母 `m` 输入 `Main` 方法，`CLR` 将无法找到该方法作为应用程序的入口。\n\n上述界面中另一个需要注意的是大括号，因此在\
  \ `C#` 中，无论我们在哪里有一个代码块，都需要用大括号将其括起来，这适用于类、`program` 和命名空间（namespaces）。\n\n现在我们来写一个简单的\
  \ `C#` 程序，在上面 `Main()` 方法的左大括号之后：\n\n输入以下语句：\n\n```csharp\nConsole.WriteLine (\"\
  Hello World\");\n```\n\n然后使用 `Ctrl + F5` 运行以查看输出。\n\n当你运行应用程序时，你应该看到这个屏幕：\n\n![image](img/image088.png)\
  \ 你上面看到的窗口就是我们所谓的 console（控制台），这就是为什么该项目被称为 Console Application（控制台应用程序）。`Console`\
  \ 类用于从控制台读取数据或写入数据，它有很多方法。\n\n## 测验\n\n问题-0:\n什么是命名空间（namespace）？\na: 一个包含程序代码的类型。\n\
  b: 类的容器。\nc: 应用程序的可部署单元。\n答案是：b\n\n问题-1:\n什么是 JIT 编译？\na: 在运行时将 `IL` 代码编译为原生机器码。\n\
  b: 将 `C#` 代码编译为原生代码。\nc: 将 `C#` 代码编译为 `IL` 代码。\n答案是：a\n\n问题-2:\n什么是程序集（assembly）？\n\
  a: 由 `CLR` 执行的一段代码\nb: 一个或多个类的容器\nc: `.NET` 应用程序的单一部署单元\n答案是：c\n\n# 第二章\n\n## 基本类型与表达式\n\
  \n在本章中，我们将开始学习 `C#` 的旅程，因此我将向你们介绍变量和常量、各种数据类型和类型转换、作用域和溢出，最后我们将讨论 `C#` 中拥有的各种运算符。\n\
  \n### 变量与常量\n\n#### 变量\n变量是赋予内存存储位置的名称。我们使用变量在内存中临时存储值。在 `C#` 中，声明变量从数据类型开始，紧接着是一个标识符，并以分号（`;`）结束，如下：\n\
  \n![image](img/image117.png)\n\n这里 `int` 代表整数类型，`Number` 是我们变量的标识符。注意 `C#` 是区分大小写的，因此，这两个变量是不同的，因为一个是大写\
  \ `N`，另一个是小写 `n`。在声明变量时，你可以选择性地初始化它如上所示，但请注意，除非你初始化它，否则你无法使用该变量，正如你在第二个示例所示。否则，代码将无法编译。\n\
  \n#### 常量\n常量是不可变的值；我们在编译时知道这些值在应用程序的整个生命周期内不会改变。我们为什么要使用 `Constants`（常量）？原因很简单；为了在应用程序中创建安全性，特别是在我们需要确保某个值不改变的情况下。想象在你的应用程序中，有一个名为\
  \ `Pi = 3.14;` 的数字，用于计算圆面积。该数字在我们的程序中应该始终保持，我们不希望意外更改它，否则我们的结果将不准确。因此，我们将此数字声明为常量。\n\
  \n要声明常量，我们使用关键字 `const` 后面跟数据类型和标识符，并且我们必须像这样初始化：```csharp\nconst float Pi = 3.14;\n\
  ```\n\n### 关于标识符的注意事项\n- 标识符不能与数字开头；例如这个不能作为标识符：`1route` ![image](img/image152.png)\
  \ 但这个 `Route` 是可以的 ![image](img/image158.png)\n- 它不能包含空格，如 `first Name`，但 `firstName`\
  \ 是可以的。\n- 它不能使用保留关键字如 `int`，但如果你非常想使用任何保留关键字，那么你可以用 `@` 符号作为前缀，如所示所示 `@int`。\n\
  - 使用有意义的名称，避免用 `fn` 代替 `firstName`。\n\n### C# 中的命名规范\n在 `C#` 中，为你的局部变量命名：使用驼峰命名法（Camel\
  \ case），例如：`string firstName = “Dennis”;`\n对于你的常量变量，使用帕斯卡命名法（Pascal case）：`const\
  \ int Zoom = 5;`\n\n### 基本类型\n这里是 `C#` 中最常用的类型列表：整数、实数、字符和布尔值。注意在 `.Net` 框架中，它们被映射到数据类型。第三列“Bytes”（字节）显示了每个数据类型使用的字节数，第四列“Range”（范围）显示了数据类型可以存储的值的数量。\n\
  \n![image](img/082.png)\n\n#### 整数\n在上面的表中，整数是 `byte`、`short`、`int` 和 `long`。正如表中所示，`byte`\
  \ 是最小的，占用 1 字节，而 `long` 是最大的，占用 8 字节。字节越多，存储越多。\n- `byte` 映射到 `Byte`\n- `short`\
  \ 映射到 `Int16`\n- `int` 映射到 `Int32`\n- `long` 映射到 `Int64`\n\n#### 实数\n在实数中，我们有 `float`、`double`\
  \ 和 `decimal`。在 .Net 框架中：\n- `float` 映射到 `Single`，占用 4 字节存储大数字\n- `double` 映射到 `Double`，大小是\
  \ `float` 的两倍，占用 8 字节\n- `decimal` 映射到 `Decimal`，占用 16 字节，需要的精度越高，使用的类型越大\n\n####\
  \ 字符与布尔\n在 `C#` 中，我们有由关键字 `char` 表示的字符，它们是 Unicode；`bool` 表示布尔，可以是 true 或 false。\n\
  \n### 数据类型声明和初始化示例\n\n#### 整数\n```csharp\nInt c; // 这仅是声明\nInt a = 18; // 这是声明和初始化\n\
  Int b = 6;\nc = a + b; // 这是将值赋值给整数类型的变量 c\nConsole.WriteLine(c);\n```\n\n#### 实数\n\
  默认情况下，`C#` 编译器使用 `double` 用于实数，因此如果你想使用像 `float` 和 `decimal` 这样的数据类型，你需要显式地告诉编译器将你的数字视为\
  \ `float` 或 `decimal`，例如这样声明：\n```csharp\nfloat number = 1.2f; // 通过添加此后缀告诉编译器视为\
  \ float\ndecimal number = 1.2m; // 后缀 m 告诉编译器将数字视为 decimal\n```\n\n#### 字符与布尔\n\
  ```csharp\nchar chA= ‘A’;\nchar chB= ‘B’;\nConsole.WriteLine (chA.Equal( ‘A’));\
  \ // 输出：  “True”\nConsole.WriteLine (‘b’.Equal(chB)); // 输出：  “False”\n```\n\n\n\
  \n\n有关 C# 内置类型的更多信息，请访问：[`msdn.microssoft.com/en-us/library/cs7y5x0x0x(v=vs.90).aspx`](http://msdn.microssoft.com/en-us/library/cs7y5x0x0x(v=vs.90).aspx)\n\
  \n### 溢出 (Overflow)\n\n让我们讨论一下 C# 中的溢出概念，查看下面的示例\n\n```csharp\nbyte number = 255;\n\
  number = number + 1; // 输出: 0\nConsole.WriteLine (number);\n```\n\n这段代码片段的输出将是 0\
  \ 而不是 256，这是因为 `byte` 只能取 255，这就是我们所说的溢出，我们超过了 `byte` 数据类型的边界。在 C# 中，默认情况下不对溢出进行检查，这意味着数据类型的值在运行时可以被修改。如果我们超过了数据类型的边界，就会发生溢出。这在程序中是不理想的，为了避免这种情况，我们像下面所示使用\
  \ `checked` 关键字\n\n```csharp\nchecked\n{\n    byte number = 255;\n    number = number\
  \ + 1; // 将发生异常\n}\n```\n\n此代码将抛出异常，你可以使用异常处理（`try` 和 `catch` 块）来防止它的发生。\n\n###\
  \ 作用域 (Scope)\n\n作用域决定变量或常量在何处有效并可以访问\n\n查看下面的三个代码块\n\n```csharp\n{\n    byte a\
  \ = 1;\n    {\n        byte b = 2;\n        {\n            byte c= 3;\n        }\n\
  \    }\n}\n```\n\n`a` 在这段代码块或任何这些子块内部都是可访问的，但在它的块之外是不可的；`b` 在它的块及其子块中可访问；而 `c` 仅在它的块中可访问。块由大括号（`{}}`)\
  \ 表示。\n\n### 演示变量与常量\n\n好了，理论够了，让我们打开 Visual Studio 并编写一些代码\n\n![image](img/image093.png)\n\
  \n使用 `CTRL + F5` 运行上面的代码查看输出\n\n在 C# 中，我们有一个名为 `var` 的关键字，它让变量声明变得更容易，例如在上面的代码中，我不需要显式地放置数据类型，而是可以用\
  \ `var` 来替换它们，它在运行时将映射到对应的数据类型\n\n![image](img/image135.png)\n\n使用 `CTRL + F5` 运行上面的代码查看输出。它应该与之前的示例相同。\n\
  \n好了，现在让我们来看常量\n\n![image](img/image119.png)\n\n我们之前说过，使用 `const` 关键字用于我们不希望值在整个程序中改变的变量。因此在上面的程序中，我们定义了一个常量，在代码的第二行中尝试修改常量\
  \ `pi` 的值，因此编译器出现了一条红线，拒绝允许为 `const` 变量分配不同的值\n\n### 类型转换 (Type Conversion)\n\n\
  在某些情况下，你可能想要临时将变量的值转换为不同的类型。注意，这种转换不会影响原始变量，因为 C# 是一种静态类型语言，简单定义就是：一旦你声明了变量的类型，就无法更改它。但是，你可能需要在将该值赋值给不同类型的变量时，转换变量的“值”。在\
  \ C# 中我们有以下类型转换\n\n### 隐式类型转换 (Implicit Type Conversion)\n\n如果类型是兼容的（例如整数和实数），并且你正在考虑的类型更大，你不需要做任何操作。值将由运行时自动转换并存储在目标类型中。\n\
  \n这是一个隐式类型转换的示例\n\n```csharp\nbyte b = 1;\nint k = b;\n```\n\n正如我们之前解释的，`byte` 占用一个字节内存，而\
  \ `integer` 占用四个字节，所以我们可以轻松地将字节拷贝到整数变量中且不会发生数据丢失。\n\n如果发生数据丢失，编译器将不允许隐式类型转换。\n\n\
  ### 显式类型转换 (Explicit Type Conversion)\n\n```csharp\nfloat f = 1.0f;\nint k = (int)f;\n\
  ```\n\n可以看出，尽管将浮点数 `f` 整数会导致数据丢失，但我们通过在变量 `f` 旁括号中包含 `int` 数据类型来告诉编译器继续转换，将其值转换为整数。\n\
  \n### 不兼容类型 (Non Compatible Types)\n\n我们可能有两个不兼容的数据类型，如 `int` 和 `string`，我们可以有一个表示为字符串的数字并并将其转换为整数，此时我们不能使用显式类型转换。我们必须采用不同的机制，例如使用\
  \ `Convert` 类和或 `Parse` 方法。`Convert` 类是 `.Net` 框架的一部分，定义在 `System` 命名空间中。它有很多方法用于将各种数据类型转换为其他数据类型。我们之前解释的所有原始类型（`int`、`short`、`boolean`、`float`\
  \ 等）都有自己的 `parse` 方法。查看下面的示例\n\n```csharp\nstring d = \"1\";\nint k = Convert.ToInt32(s);\n\
  int h = int.Parse(s);\n```\n\n以下是你在 `Convert` 类中找到的一些方法：\n\n* `ToByte()`- 将给定的值转换为\
  \ `byte`\n* `ToInt16`：将给定的值转换为 `short`\n* `ToInt32()`：将给定的值转换为 `int`\n* `ToInt64()`：将给定的值转换为\
  \ `long`\n\n### 类型转换的另一个示例\n\n![image](img/image140.png)\n\n如果你执行此操作，将得到以下内容\n\n\
  ![image](img/image130.png)\n\n输出\n\n![image](img/image172.png)\n\n在 C# 中，我们有以下运算符\n\
  \n### 算术运算符 (Arithmetic Operators)\n\n当你处理数字时使用算术运算符。下表展示了我们在 C# 中的算术运算符\n\n![image](img/image176.png)\n\
  \n我们还有其他算术运算符称为增减运算符，它们是变量加 1 或减 1 的快捷方式。它可以用作前置增/减或后置增/减运算符\n\n![image](img/image028.png)\n\
  \n示例\n\n```csharp\nvar a = 10;\nvar b = 3;\nvar c = 2;\nConsole.WriteLine(a+ b*c);\n\
  ```\n\n此处的输出将为 60；因为 C# 遵循自然的算术优先级，除法和乘法的优先级高于加法或减法。所以如果你想在乘以 c 之前相加 a 和 b，你应该这样写\n\
  \n```csharp\nConsole.WriteLine((a+ b)*c);\n```\n\n这种情况下输出将为 26\n\n### 比较运算符 (Comparison\
  \ Operators)\n\n![image](img/image037.png)\n\n示例\n\n```csharp\nvar a = 1;\nvar b\
  \ = 2 ;\nConsole.WriteLine(a > b);\nConsole.WriteLine(a == b);\n```\n\n输出将 false，注意比较表达式的结果始终是一个布尔值，即\
  \ true 或 false\n\n### 赋值运算符 (Assignment Operators)\n\n![image](img/image091.png)\n\
  \n### 逻辑运算符 (Logical Operators)\n\n这些主要用于布尔表达式，布尔表达式通常用于条件表达式\n\n![image](img/image162.png)\n\
  \n示例\n\n```csharp\nvar a = 1;\nvar b = 2 ;\nvar c= 3;\nConsole.WriteLine(c > b &&\
  \ c > a); // 输出为 true\nConsole.WriteLine(c> b && c == a);  // 输出为 false\nConsole.WriteLine(c\
  \ > b || c > a); // 输出为 true\nConsole.WriteLine(c> b || c == a); // 输出为 true\n```\n\
  \n\n\n\n它们被用于窗口 API、加密以及 socket 编程。\n\n![image](img/image102.png)\n\n## 注释\n\n注释是我们写在代码中的文本，用于提高可读性和可维护性。在\
  \ C# 中，我们有两种方式编写注释；\n\n**单行注释**：以双斜杠开头。\n\n示例：`//here is a single line comment`\n\
  \n```csharp\nint j = 0;\n```\n\n**多行注释**：使用 `/*` 开始，使用 `*/` 结束。\n\n示例\n\n```csharp\n\
  /* Here is a multi-line comments */\nint j =0;\n```\n\n注意：请保持注释的极少使用，要用注释来解释“为什么”（whys），而不是“是什么”（whats）。\n\
  \n总结之，在本章中，我们学习了 C# 是一种静态类型语言，这意味着当我们使用特定数据类型声明变量时，该类型在变量的生命周期内不能改变。我们还学习了基本类型，如\
  \ `int`、`Boolean`、`short`、`float` 等。在下一章我们将讨论非基本类型，如 `class`、`arrays`、`strings`\
  \ 和 `enums`。\n\n## 验\n\n**问题-0：**\n\n执行此行代码后，`number` 的值是多少？\n\n`byte number = 1000;`\n\
