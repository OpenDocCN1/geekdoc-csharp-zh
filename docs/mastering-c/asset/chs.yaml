  \n## 多态 (POLYMORPHISM)\n\n![image](img/chapter_title_below.png)\n\nPoly 意味着多，morph\
  \ 意味着形式，所以多态简单意味着多种形式。面向对象编程具有多态概念，使类能够以多种形式存在。在 C# 中，多态为基类提供了通过相同名称调用不同方法的方法。\n\
  \n### 方法重写 (Method Overriding)\n\n方法重写意味着修改继承方法的实现。如果一个方法在基类中被声明为 `virtual`，我们可以在派生类中重写它。使用如下所示的\
  \ `override` 关键字\n\n![image](img/image090.png)\n\n这种技术允许我们实现多态。多态是一种优秀的面向对象技术，允许我们消除冗长的过程化\
  \ switch 语句（或条件语句）。\n\n### 来看演示\n\n看这个基类 `Drawing`，它有三个派生类 `Circle`、`Square` 和 `Rectangle`，它们重写了在基类\
  \ `Drawing` 中定义的 `Area()` 方法\n\n![image](img/image042.png)\n\n下面的三个派生类中的每一个都具有 `Area()`\
  \ 方法，与父具有相同的名称和签名，但带有 `override` 关键字，定义了其特有的属性和行为\n\n![image](img/image011.png)\n\
  \n在程序类中，定义了每个类的对象，并如所示调用了 `Area` 方法\n\n![image](img/image015.png)\n![image](img/image100.png)\n\
  \n### 抽象类与成员 (Abstract Classes and Members)\n\n抽象修饰符 (Abstract modifier)\n\n抽象修饰符表示一个类或成员缺少实现。用例子来解释这一点更容易。例如我们下方的形状类示例\n\
  \n![image](img/image164.png)\n\n这里我们有一个 `Shape` 类，其 `Draw` 方法被声明为 `virtual`，我们有一个派生自\
  \ `Shape` 类的 `Circle` 类，在 `Circle` 类中我们重写了 `Draw()` 方法，在这里我们提供了绘制圆的实现，但这里我们遇到了定义绘制形状的实现的问题。我们如何画一个形状呢？这没有意义。当我们谈论圆时，我们知道如何画圆或方形，但对于“形状”，几乎无法定义如何画形状，因为“形状”的概念太抽象了。在这种情况下，更好的方法是使用抽象修饰符，我们可以将\
  \ `Draw()` 方法声明为 `abstract`，以指示该方法缺少实现，并让派生类来提供实现\n\n所以为了更改抽象修饰符，上面的代码发生了变化\n\n\
  ![image](img/image140.png)\n\n注意 `Draw()` 方法被声明为 `abstract`，它没有方法体。当一个方法或属性声明为 `abstract`\
  \ 时，包含它的类也需要声明为 `abstract` 抽象类本质上是 `virtual` 的，正如我们所讨论的。\n\n#### 使用抽象类时需要遵守的少数规则\n\
  \n第一条是抽象成员不能包含实现，如下所示\n\n```csharp\npublic abstract void Draw();\n```\n\n第二条是如果成员被声明为\
  \ `abstract`，包含它的类需要声明为 `abstract`\n\n![image](img/image057.png)\n\n第三条是在派生类中你必须实现所有的抽象成员，如下\n\
  \n![image](img/image167.png)\n\n这里 `Shape` 类只有一个 `Draw()` 方法，假设它有其他方法，你需要在 `Circle`\
  \ 类中重写它们，正如 `Draw()` 方法被重写的方式。否则，该派生类也将是抽象的\n\n最后一条是抽象类不能实例化，所以当你创建一个 `Shape` 类时无法这样做\n\
  \n![image](img/image87.png)\n\n### 使用抽象类的优势\n\n- 我们使用抽象是为了提供某些行为，同时强制其他开发者遵循我们的设计。例如在我们的\
  \ `Shape` 类中，通过将 `Draw` 方法声明为 `abstract`，我们确保任何开发者派生自 `Shape` 类时，都会在派生类中提供 `Draw()`\
  \ 方法的实现。如果我们未能将 `Shape` 类声明为抽象，就会面临开发者派生 `Shape` 类但不重写或提供 `Draw()` 方法实现的风险。\n\n\
  - 当在基类中实现这些成员没有意义时，我们使用抽象成员。例如，形状的概念太抽象。这需要在派生类中实现。\n\n密封类与成员 (Sealed Classes and\
  \ Members)\n\n密封类是抽象类的相反面，如果 `sealed` 修饰符应用于类，则防止从该类进行派生。- 如果应用于方法，则防止在派生类中重写该方法。例如，我们可以将\
  \ `sealed` 修饰符应用于我们派生自 `Shape` 类的 `circle` 类，这意味着我们无法创建一个派生自 `circle` 的类，如下所示\n\n\
  ![image](img/image139.png)\n\n我们也可以决定只对方法应用 `sealed` 修饰符，注意 `sealed` 修饰符只能应用于被重写的\
  \ `virtual` 方法，例如 `Circle` 类中 `Draw` 方法的情况。如下所示\n\n```csharp\npublic sealed override\
  \ void Draw()\n```\n\n![image](img/image142.png)\n\n\n\n\n密封类（Sealed classes）由于了一些运行时优化，速度稍快。个人而言，我不认为这种优化会对你的应用程序产生任何影响。事实上，密封类在应用程序中很少被使用。我建议你在你的应用程序中避免使用密封类；我觉得这是一种反模式，并且可能会破坏你的继承层次结构设计。\n\
  \n### 练习\n\n### 设计数据库连接\n\n要访问数据库，我们首先需要打开一个连接，并在任务完成后关闭它。\n\n连接到数据库取决于目标数据库的类型和数据库管理系统（DBMS）。例如，连接到\
  \ SQL Server 数据库与连接到 Oracle 数据库是不同的。但这两个连接都有一些共同点：\n\n- 它们有一个连接字符串（connection string）\n\
  - 它们可以被打开\n- 它们可以被关闭\n- 它们可能有一个超时属性（因此如果连接在超时时间内无法打开，将抛出一个异常）。\n\n你的任务是在名为 `DbConnection`\
  \ 的基类中表示这些共同点。该类应该包含两个属性：\n- `ConnectionString : string`\n- `Timeout : Timespan`\n\
  \n如果 `DbConnection` 没有连接字符串，它将不处于有效状态。因此，你需要在该类的构造函数中传递一个连接字符串。此外，考虑到发送 null 或空字符串作为连接字符串的情况。确保抛出异常，以保证你的类始终处于有效状态。\n\
  \n我们的 `DbConnection` 还应该有两个用于打开和关闭连接的方法。我们不知道如何在 `DbConnection` 中打开或关闭连接，这应该留给派自\
  \ `DbConnection` 的类来处理。这些类（例如 `SqlConnection` 或 `OracleConnection`）将提供具体的实现。因此，你需要将这些方法声明为抽象（abstract）。\n\
  \n从 `DbConnection` 派生两个类 `SqlConnection` 和 `PostgreSqlConnection`，并使用 `Console.WriteLine()`\
  \ 提供打开和关闭连接的简单实现。在现实世界中，SQL Server 提供了打开或关闭数据库连接的 API。对于这个练习，我们不需要担心这个。\n\n# 第十三章\n\
  \n## 接口 (INTERACES)\n\n接口是一种语言结构，在语法上与类相似，但本质上不同。接口仅仅是类应该提供的能力（或服务）的声明。\n\n以下是我们如何声明接口而不是使用\
  \ `class` 关键字，我们使用 `interface` 关键字，并且知道在 .Net 中所有接口都以字母 `I` 开头。这是一种约定，如下例所示：\n\n\
  ```csharp\npublic interface ITaxCalculator\n{\n    int Calculate();\n}\n```\n\n\
  与类不同，接口没有实现。所以你在上面的示例中看到我们有一个名为 `Calculate()` 的方法，它仅仅是一个装饰，它没有实现，也没有访问修饰符。\n\n此接口规定，想要扮演税务计算器角色的类应该提供一个名为\
  \ `Calculate()` 的方法，该方法不接受参数并返回一个 `int`。该类的实现可能如下：\n\n```csharp\npublic class TaxCalculator\
  \ : ITaxCalculator\n{\n    public void Calculate() { ... }\n}\n```\n\n- 所以，接口纯粹是一个声明。接口的成员没有实现。\n\
  - 接口只能声明方法和属性，但不能声明字段（fields），因为字段涉及实现细节。\n- 接口成员没有访问修饰符。\n\n### 为什么要用接口？\n\n- 接口有助于构建松耦合的应用程序。通过在两个类之间放置接口，我们减少了类之间的耦合。这样一来，如果其中一个类发生变化，它对依赖于它的类就不会产生影响（只要接口保持不变）。\n\
  \n让我们看这个类比来帮助更好地理解。思考餐厅和厨师的概念。假设餐厅需要一个具有特定能力的厨师，根据这个定义，你可以让任何具有这些能力的人担任餐厅的厨师角色，因此餐厅和厨师之间的依赖是松耦合的。如果那个厨师发生了什么，比如他生病了或辞职了，我们可以找其他人来这个这个角色。相反，如果我们说餐厅需要\
  \ John 来担任厨师，这意味着餐厅非常依赖 John。如果 John 发生了什么事或决定不来上班，餐厅就会遇到麻烦。这就是紧密耦合依赖的定义。也就是说，餐厅与\
  \ John 是紧密耦合的。\n\n但在软件开发中，构建一个组件或类之间松耦合的应用程序是最佳实践，这样对一个类所做的更改对其他类或组件的影响将降到最低或为零。\n\
  \n### 接口与可测试性\n\n单元测试是自动化实践的一部分，有助于提高代码的质量。通过自动化测试，我们编写代码来测试自己的代码。这有助于在更改代码时尽早发现错误。\n\
  \n为了对一个类进行单元测试，我们需要对其隔离。这意味着：我们需要假设应用程序中的其他所有类都运行正常，并查看被测试的类是否按预期工作。与其他类有紧密依赖的类是无法隔离的。为了解决这个问题，我们使用接口。这里有一个示例：\n\
  \n```csharp\npublic class OrderProcessor\n{\n    private IShippingCalculator _calculator;\n\
  \n    public Customer(IShippingCalculator calculator)\n    {\n        _calculator\
  \ = calculator;\n    }\n}\n```\n\n- 所以这里，`OrderProcessor` 不依赖于 `ShippingCalculator`\
  \ 类。它只依赖于接口（`IShippingCalculator`）。如果我们更改了 `ShippingCalculator` 内部的代码（例如添加新方法或更改方法实现），它对\
  \ `OrderProcessor` 就没有影响（只要接口保持不变）。\n\n### 接口与扩展性\n\n我们可以使用接口通过“扩展”其代码（而不是更改现有代码）来改变应用程序的行为。如果一个类依赖于接口，我们可以在运行时提供该接口的另一个实现。这样，应用程序的行为就会改变，而不会对该类产生任何影响。\n\
  \n\n\n\n\n例如，假设我们创建了一个用于迁移数据库的类 `DbMigrator`，该类可以有一个名为 `Migrate()` 的单方法，其中包含了数据库迁移的详细逻辑。假设我们想在数据库迁移时记录一些细节，例如，我们可能想显示迁移开始的时间和结束的时间，如果出现任何问题，我们也记录下来。现在，我们希望在不改变\
  \ `Migrate()` 方法细节或代码的情况下实现这些行为，相反，我们希望通过创建一个名为 `ILogger` 的接口来扩展我们的 `DbMigrator`\
  \ 类，该接口可能提供 `LogError` 和 `LogInfo` 等方法。因此，我们使用构造函数将此接口注入到 `DbMigrator` 类中，这种技术被称为依赖注入。现在，让我们创建一个实现\
  \ `ILogger` 接口方法的类，我们称其为 `ConsoleLogger`。我们的 `DbMigrator` 类依赖于 `ILogger` 接口。它完全不知道实现\
  \ `ILogger` 接口方法的 `ConsoleLogger` 类，它仅仅是在与接口交互。因此，我们可以在主程序中，通过为 `DbMigrator` 对象提供我们想要的实现来更改应用程序的行为。例如，在运行时，我们可以提供一个\
  \ `ConsoleLogger` 来在控制台上记录消息。稍后，我们可能决定将消息记录在文件中（或数据库）。我们可以创建一个名为 `FileLogger` 的新类，它实现\
  \ `ILogger` 接口并将其注入到 `DbMigrator`，并在运行时将 `ConsoleLogger` 的实现替换为 `FileLogger`。\n\n\
