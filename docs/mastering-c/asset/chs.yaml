  b: `Point p;`\nc: `Point p = new Point;`\nd: `Point p = new Point();`\n\n答案是：`d`\n\
  \n### 问题-4：\n\n我们有如下 `TaxCalculator` 类。我们该如何调用 `Calculate` 方法？\n\n```csharp\npublic\
  \ class TaxCalculator\n{\npublic static float Calculate()\n{\n\n}\n}\n```\n\na:\
  \ `TaxCalculator.Calculate();`\nb: `new TaxCalculator().Calculate();`\n\n答案是：`a`\n\
  \n### 问题-5：\n\n字符串中的转义字符 `\\n` 表示：\n\na: 空格\nb: 换行符\nc: 制表符\n\n答案是：`b`\n\n### 问题-6：\n\
  \n此程序的运行是什么？\n\n```csharp\nvar number1 = 1;\nvar number2 = number1;\nnumber2++;\n\
  Console.WriteLine(number1);\n```\n\na: 1\nb: 2\n\n答案是：`a`\n\n### 问题-7：\n\n我们有如下的枚举（enum）：\n\
  \n```csharp\npublic enum CustomerType\n{\nBronze,\nSilver,\nGold\n}\n```\n\n这段代码的输出是什么？\n\
  \n```csharp\nvar type = (int)CustomerType.Bronze;\nConsole.WriteLine(type):\n```\n\
  \na: 0\nb: 1\nc: Bronze\n\n答案是：`a`\n\n# 第四章\n\n## 控制流\n\n在本章中，我们将探索 C# 中的条件语句和迭代语句，我们使用这些语句来控制程序的执行流。从本节开始，你将开始编写简单的\
  \ C# 程序。请确保你花时间完成练习，这是训练你的大脑像程序员一样思考的方法。让我们让我们吧。\n\n## 条件语句\n\n在 C# 中有如下条件语句：\n\n\
  ### If / else 语句\n\n这里是 If / else 语句的基本型结构：\n\n```csharp\nIf(condition)\nSomeStatement\n\
  Else if(anotherCondition)\nanotherStatement\nelse\nyetAnotherStatement\n```\n\n\
  因此在 `if` 中，我们始终在括号内有一个 `(condition)`，如果该条件为真则将执行它，并且我们可以可选地包含 `else if` 以及可选的 `else`，如果前面的条件都不满足，则执行\
  \ `else`。\n\n我们还可以使用嵌套的 `If` 语句：\n\n```csharp\nIf(condition)\n{\nIf(anotherCondition)\n\
  // 某些语句\nelse\n```\n\n尽量避免在代码中使用多个嵌套的 `if-else` 语句，以避免使代码变得难以阅读且难以维护。\n\n### Switch\
  \ / Case\n\n在 `switch` 中，我们有一个变量，其值被用于比较 `case` 中其他变量的值。在下面的 `switch` 示例中，变量是 `state`，它是一个枚举。有两个\
  \ `case` 语句通过比较 `state` 的值进行评估，如果 `state` 是 `Active`，则执行该 `case` 内的语句或动作；如果这些条件都不满足，则执行\
  \ `default`。\n\n```csharp\nSwitch(state)\n{\ncase State.Active\nsomeStatement\n\
  break;\ncase State.Inactive\nsomeStatements\nbreak;\ndefault:\nsomeStatement\nbreak;\n\
  }\n```\n\n让我们来看一个 IF /Else 语句运行的示例：\n\n![image](img/image055.png)\n\n上面的代码非常言自明。现在我们可以使用条件运算符来代替\
  \ `If/else`。查看以下代码段：\n\n```csharp\nBool isSuperCustomer=true;\nfloat price;\nif(isSuperCustomer)\n\
  price =20.12f;\nelse\nprice = 30.23f;\n```\n\n上面的代码可以使用条件运算符重写为如下：\n\n```csharp\n\
  float price =(isSuperCustomer )? 20.12f: 30.23f;\n```\n\n### Switch Case 示例\n\n\
  ```csharp\nNamespace SwitchCaseExample\n{\nPublic enum Season\n{\nSpring,\nSummer,\n\
  Autumn,\nWinter\n}\nClass Program {\nstatic void Main(string[] args)\n{\nvar season\
  \ = Season.Autumn;\nswitch(season)\n{\ncase Season.Autumn:\nConsole.WriteLine(“It’s\
  \ autumn let go swinging “);\nbreak;\ncase  Season.Summer:\nConsole .WriteLine(“It’s\
  \ summer”);\nbreak;\ncase Season.Winter:\nConsole.WriteLine(“It’s winter”);\nbreak;\n\
  default:\nConsole.WriteLine(“It’s unknown”);\nbreak;\n}\n}\n```\n（注：原文在 switch 块中存在一些逻辑错误，我在保持上下文的同时清理了结构）。\n\
  \n## 迭代语句\n\n每种编程语言都有迭代语句，用于重复执行一组语句。在 C# 中我们有：\n\n* For 循环\n* Foreach 循环\n* While\
  \ 循环\n* Do-While 循环\n\n### For 循环\n\n让我们检查 `for` 的语法：\n\n```csharp\nfor(var i=0;\
  \ i < 10; i++)\n{\n```\n\n`For` 循环包含三个部分：初始化子句是我们在创建计数器的地方（`var i=0`），第二部分是条件（`i\
  \ < 10`），第三部分是迭代子句（`i++`）。大括号内的语句将不断执行。\n\n### Foreach 循环\n\n这用于遍历任何类型的列表元素。`foreach`\
  \ 的语法是：\n\n```csharp\nforeach (var number in numbers)\n{\n```\n\n在这里我们有一个临时变量 `number`，`foreach`\
  \ 关键字用于遍历 `numbers`。假设 `numbers` 是一个列表，每次迭代中 `number` 将持有当前值。\n\n### While 循环\n\n\
  ```csharp\nWhile (k < 10)\n{\nk++;\n}\n```\n\n在 `while` 循环中有一个条件，只要它有效循环就会执行。通常我们有一个计数器，它与\
  \ `for` 循环相似但语法不同。\n\n### Do-While 循环\n\n```csharp\ndo\n{\ni++;\n} while (i<10);\n\
  ```\n\n`Do-While` 循环与 `while` 循环略有不同，在 `do-while` 循环中，条件至少执行一次，因为条件是在循环结束时评估的。这里我们有\
  \ `do` 以及一个要执行的语句块，一个要递增或递减的计数器，以及后面跟一个评估条件的 `while` 关键字。注意你并不总是需要在 `do-while` 循环中使用计数器。这取决于你想实现什么。\n\
  \n### Break 和 Continue\n\n`break`:帮助你跳出循环\n`continue`: 跳到下次迭代\n\n#### For 循环示例\n\
  \n假设我们想显示从 1 到 10 的偶数。以下代码可以实现此目标：\n\n```csharp\nfor (int i = 1; i <= 10; i++)\n\
  {\n    if (i % 2 == 0)\n    {\n        Console.WriteLine(i);\n    }\n}\n```\n\n\
  ![image](img/image103.png)\n\n输出是：\n\n![image](img/image066.png)\n\n一个小练习：尝试反过来编写上面的代码，而不是从\
  \ 1 到 10 开始，而是从 10 到 1 开始显示偶数。\n\n#### Foreach 循环示例\n\n假设我们有一个字符串类型的名称，我们想要遍历并显示字符串的每个字符。正如你所知，字符串是不可计数的。\n\
  \n```csharp\nvar name =”Dennis Sharp”;\nforeach ( var character in name)\n{\n  \
  \  Console.WriteLine (character);\n}\n```\n\n执行上面的代码查看输出。让我们使用数组来展示另一个示例：\n\n![image](img/image180.png)\n\
  \n输出将是\n\n\n\n\n\n![image](img/image044.png)\n\n## While 循环示例\n\n当不知道循环将运行多少时，最适合使用\
  \ While 。例如写一个程序要求用户输入名称，只有当用户输入空白时程序才会终止。\n\n![image](img/image112.png)\n\n运行上述代码并查看结果。\n\
  \n## Random 类\n\n在结束本章之前，我想向你们介绍 C# 中一个非常有用的类，`Random`。\n\n我们使用它来生成随机数。让我们来看例子，我们要生成\
  \ 1 到 10 之间的随机数。\n\n![image](img/image051.png)\n\n### 练习题\n\n1. 编写一个程序要求用户输入一个数字。数字应在\
  \ 1 到 200 之间。如果用户输入的数字正确，在控制台上显示“correct”；否则显示“Incorrect”（这种逻辑经常用于需要验证输入框中输入值的应用程序）。\n\
  2. 编写一个程序，从控制台或用户处获取两个整数，并显示其中较大的一个。\n3. 编写一个程序，统计 1 到 100 之间有多少数字可以被 5 整除且无余。在控制台上显示计数。\n\
  4. 编写一个程序并持续要求用户输入数字或输入“ok”退出。计算之前输入的所有数字之和并显示在控制台上。\n5. 编写一个程序要求用户输入一个数字。计算该数字的阶乘并打印在控制台上。例如，如果用户输入\
  \ 7，程序应该计算 7x6x5 x 4 x 3 x 2 x 1 并显示为 7! = 5040。\n6. 编写一个程序随机抽取 1 到 100 之间的一个数字。给用户\
  \ 5 次机会猜数字。如果用户正确猜中数字，显示“You made it”；否则显示“You failed”（为了确保程序运行良好，你可以先在控制台上显示隐藏数字）。\n\
  7. 编写一个程序要求用户输入一组用逗号分隔的数字。找到这些数字中最大的一个并显示在控制台上。例如，如果用户输入“7, 31, 18, 11, 24”，程序应该显示\
