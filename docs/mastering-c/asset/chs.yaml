  `program.cs` 类\n\n![image](img/image097.png)\n程序输出\n\n### 练习\n\n### 设计工作流引擎\n\n\
  设计一个接收并运行工作流对象的引擎。工作流是一系列步骤或活动。引擎类类应该有一个名为 `Run()` 的方法，接收工作流，然后遍历工作流中的每一个活动并运行它。\n\
  \n我们希望工作流是可扩展的，这样我们就可以创建新的活动而不影响现有活动。\n\n教学提示：我们应该使用接口来表示活动的概念。每个活动都应该有一个名为 `Execute()`\
  \ 的方法。工作流引擎不关心活动的具体实现。它只关心这些活动具有共同的接口：它们提供一个名为 `Execute()` 的方法。引擎只需调用该方法，以此顺序执行一系列活动。现实场景：在现实应用中，你可能会在以下场景中使用工作流：\n\
  \n1- 将视频上传到云存储。\n\n2- 调用第三方视频编码服务的 Web 服务，告诉他们有一个视频准备好进行编码了。\n\n3- 向视频所有者发送电子邮件，通知他们视频已开始处理。\n\
  \n\n\n\n\n# 第十四章\n\n## 4. 将数据库中的视频记录状态更改为“处理中”。\n\n这些步骤中的每一个都可以表示一个活动。为了本次练习的目的，请不要担心这些复杂性。只需在你的每个活动类中直接使用\
  \ `Console.WriteLine()` 即可。\n\n你的重点应该是将工作流发送到工作流引擎，让它运行工作流以及内部所有的活动。我们并不关心具体的活动。\n\
  \n# C# 泛型\n\nC# 泛型功能是在 C# 2.0 中引入的，用于解决装箱（boxing）和拆箱以及类型转换导致的性能开销问题。因此，它提高了性能并促进了代码的可重用，从而消除了代码重复并确保了我们应用程序的类型安全。为了理解这一点，假设我们想创建一个列表来存储数字列表。下面是一个基础列表的简单实现。我们可以有一个\
  \ `Add()` 方法来添加指定的数字，以及有一个 `Indexer` 方法来返回指定索引处的数字。\n\n现在，如果你想在列表中存储一本书，上面的类将无法工作。因此，我们必须创建另一个类并将其命名为\
  \ `BookList`，它将有一个 `Add()` 方法，接受书类对象作为参数，还有一个类型为 `Book` 的索引器。\n\n现在的问题是，对于每种类型我们都必须创建一个列表，这导致了大量的代码重复且效率低下。更重要的是，如果出现\
  \ Bug，我们必须在多个地方进行修复，因此解决此问题的一种方案是使用如下所示的 object 列表。\n\n由于 `object` 是 `.Net` 中所有类型的父类，因此我们可以轻松地将任何类型传递给此方法，并从此索引器中获取任何对象。然而，这里还有另一个问题，即性能。如果我们使用此类来存储值类型（如整数），每当我们向此列表插入一个值类型时，它都必须经过装箱才能以对象的形式存储，而每当我们访问这个值时，它都必须经过拆箱，这会带来性能开销。\n\
  \n即使你使用引用类型，当我们想要将一个对象（例如书）转换为对象（或反之）时，这种类型转换再次产生性能开销，因此泛型作为解决这一问题的解决方案运而生。通过泛型，我们只需创建一个类并多次复用它，它不会有像上面\
  \ object 列表那样的性能开销。\n\n泛型 List 类示例\n\n现在泛型有一个参数，该参数被指定为 `<T>`，是 template 的缩写，如下所示。我们也创建了\
  \ `Add()` 方法，但不是传递书类的对象或其他任何参数，而是传递 `T`，该类的用户可以决定 `T` 的取值。\n\n让我们看看如何使用上述类。\n\n\
  我们回到 `Program.cs`，在这里我们使用泛型 `List` 类来生成一个数字列表，并可以使用相同的 `GenericList` 来存储书籍，如下所示。你也可以看到，在运行时，对于数字情况，`Add()`\
  \ 方法将 `int` 作为参数传递；对于 `Book` 情况，则将 `Book` 类的对象作为参数传递。\n\n所以你会发现，我们在没有性能开销的情况下获得了代码的可重用性，因为在运行时，我们的\
  \ `GenericList` 直接接收所需的实际参数，没有类型转换或装箱。这是创建泛型类的基础，但在实际操作中，你将是使用现有的泛型类，而不是自己创建一个。很少会遇到需要创建一个泛型类而不是使用\
  \ `.Net` 中现有泛型列表的情况。此外，你可以在 `System.Collections.Generic` 命名空间中找到 `.Net` 中所有的泛型集合。\n\
  \n# 每个 C# 开发者必须掌握的最实用 C# 集合\n\n## List<T>\n\n它显示了一个可以通过索引访问的对象列表。`<T>` 是 Template\
  \ 的缩写，意味着这是一个泛型列表。在大小方面，列表与数组不同；数组的大小是固定的，而列表可以动态增长。因此，它们也被称为动态数组或向量（vectors）。在内部，为了存储，列表使用数组。但是当它填满时，它会创建一个更大的数组，并将现有数组中的项传输到新创建的数组中。如今即使你处理的是固定数量的对象，使用列表也比数组更好。\n\
  \n创建列表：\n\n```csharp\nvar list = new List<int>();\n```\n\n如果你预先知道想在列表中存储大量项，可以初始化大小，如下：\n\
  \n```csharp\n// 创建一个初始化了大小的列表\nvar list = new List<int>(20000);\n```\n\n你可以对列表执行的一些有用操作有：\n\
  \n```csharp\n// 在列表最后一个项之后添加一个项\nlist.Add(4);\n\n// 在索引 0 处插入一个项\nlist.Insert(4,\
  \ 0);\n\n// 从列表中删除一个项\nlist.Remove(1);\n\n// 删除索引为 0 的项\nlist.RemoveAt(0);\n\n//\
  \ 返回索引 0 处的项\nvar first = list[0];\n\n// 返回项的索引或位置数字\nvar index = list.IndexOf(4);\n\
  \n// 检查列表中是否存在某项\nvar contains = list.Contains(4);\n\n// 返回列表中项的总数\nvar count =\
  \ list.Count;\n\n// 遍历或循环列表中的所有对象\nforeach (var item in list)\nConsole.WriteLine(item);\n\
  ```\n\n现在，让我们分析这些操作中的 List 性能\n\n### 在列表的开头或中间添加或删除项\n\n当我们在列表开头或中间添加或删除项时，必须移动一个或多个项的位置。我们使用大\
  \ O 符号来指定此操作的代价。在最坏的情况下，当我们在最开始删除或添加时，意味着列表中的所有元素都移动了。大 O 符号为 `O(n)`，这意味着它是线性增长，意味着随着输入规模的增加，执行时间也会增加，算法的执行时间与\
  \ n 成正比。\n\n### 在末尾添加或删除项\n\n在列表末尾添加或删除项是一个速度很快的操作，且与列表的大小无关。现有项不需要移动或偏移。因此，执行时间是相对常定的，并且与列表中项的数量无关。大\
  \ O 符号为 `O(1)`；其中 1 意味着常数。\n\n### 搜索项\n\n当 `IndexOf()`、`Contains()` 和 `Find()` 等方法用于在列表中搜索时，执行的是线性搜索。因此，它会循环或遍历列表的所有元素，当找到匹配项时返回它。在最坏的情况下，如果该项位于列表末尾，则需要在找到精确项之前搜索或扫描列表中的所有项。因此大\
  \ O 符号为 `O(n)`。\n\n### 通过索引访问项\n\n通过索引访问项是 List 非常擅长的。因此，大 O 符号为 `O(1)`。它是常数。\n\n\
  总结来说，如果你需要根据列表开头、中间或末尾以外的其他标准来搜索项（例如根据 ID 为 4567 的订单），使用 `Dictionary` 是最好的。\n\n\n\
  \n\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)\n\n## Dictionary<TKey, TValue>\n\n\
  ![image](img/chapter_title_below.png)\n\nDictionary 是另一种集合类型，当你需要通过键进行查找时它非常有用。例如，假设你有一份客户列表，在工作过程中，你需要根据\
  \ ID（或其他某些唯一标识符，我们称之为键）快速找到客户。对于列表来说，查找客户将涉及线性搜索，在最坏情况下时间复杂度为 O (n)，正如我们之前讨论的那样。然而，使用字典时，查找项非常快，时间复杂度为\
  \ O (1)，这意味着无论字典有多大，查找时间始终是相对常数的。\n\n在向字典中输入或检索对象时，你需要提供一个键。键是一个唯一标识对象的值，且不能为 null\
  \ 或空。例如，要在 Dictionary 中存储一个订单，可以使用 `OrderID` 作为键。\n\n要创建一个字典，首先需要指定键和值的类型：\n\n```csharp\n\
  var dictionary = new Dictionary<int, Order>();\n```\n\n在这里，我们的字典使用 `int` 键和 `Order`\
  \ 值。因此，你可以如下所示在字典中存储一个 `Order` 对象：\n\n```csharp\ndictionary.Add(customer.Id, customer);\n\
  ```\n\n你还可以在初始化期间向字典添加对象：\n\n```csharp\nvar dictionary = new Dictionary<int, Customer>\n\
  {\n    { order1.Id, order1 },\n    { order2.Id, order2 }\n}\n```\n\n随后，你可以通过 ID\
  \ 快速查找订单：\n\n```csharp\n// 返回 ID 为 1234 的订单\nvar order = dictionary[1234];\n```\n\
  \n你可以通过键删除对象，或者使用 `Clear()` 方法移除所有对象：\n\n```csharp\n// 通过键删除对象\ndictionary.Remove(1);\n\
  \n// 移除所有对象\ndictionary.Clear();\n```\n\n下面是在 Dictionary 中可以找到的其他重要方法：\n\n```csharp\n\
  var count = dictionary.Count;\nvar containsKey = dictionary.ContainsKey(1);\nvar\
  \ containsValue = dictionary.ContainsValue(customer1);\n\n/// 遍历键\nforeach (var\
  \ key in dictionary.Keys)\n    Console.WriteLine(dictionary[key]);\n\n// 遍历值\nforeach\
  \ (var value in dictionary.Values)\n    Console.WriteLine(value);\n\n// 遍历字典\nforeach\
  \ (var keyValuePair in dictionary)\n{\n    Console.WriteLine(keyValuePair.Key);\n\
  \    Console.WriteLine(keyValuePair.Value);\n}\n```\n\nDictionary 查找之所以如此快速，是因为它们在内部将对象存储在数组中，尽管它们与列表不同，区别在于使用哈希函数在特定索引处添加或删除对象。因此，当我们在字典中存储对象时，它会调用对象键的\
  \ `GetHashCode()` 方法来计算哈希。然后根据数组的大小调整哈希值，以计算出存储对象在数组中的索引。稍后，当我们通过键查找对象时，会再次使用 `GetHashCode()`\
  \ 方法计算哈希和索引。查看下图，为了在字典中存储对象，会调用键的 `GetHashCode()` 方法。让我们假设它返回了 `1234`。该哈希值将根据内部数组的大小进行调整。在下图中，内部数组的大小为\
  \ 6。因此，`1234` 除以 6 的余数用于计算索引（在此场景下为 4）。稍后，当我们需要查找此对象时，会再次使用其键计算索引。\n\n![C# 中的哈希表](img/image013.png)\n\
  \n这只是对哈希如何工作的简要解释。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |\
  \  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n## HashSet<T>\n\n![image](img/chapter_title_below.png)\n\nHashSet 是一组唯一项的集合，就像数学集合一样（例如\
  \ {1, 2, 3}）。HashSet 不得有重复项，且元素的排列方式并不重要。因此，{1, 2, 3} 和 {2, 3, 1} 是相等的。\n\n当你需要对唯一项列表进行极快查找时，就会用到\
  \ HashSet。例如，你可能正在处理一个订单列表，对于每个订单，你需要从一个有效供应商代码列表中快速检查供应商代码。\n\nHashSet 和 Dictionary\
  \ 一样，是一种基于哈希的集合，其项访问非常快，时间复杂度为 O(1)。但与字典不同，它不存储键/值对；它只存储值。因此，每个对象都应该是唯一的，这是由 `GetHashCode()`\
  \ 方法返回的值决定的。因此，如果你要在集合中存储自定义类型，你需要在你的类型中重写 `GetHashCode()` 和 `Equals()` 方法。\n\n\
  创建一个 HashSet：\n\n```csharp\nvar hashSet = new HashSet<int>();\n```\n\n你可以像 List\
  \ 一样向 HashSet 中添加或删除项：\n\n```csharp\n// 向集合添加对象\nhashSet.Add(4);\n\n// 从集合移除对象\n\
  hashSet.Remove(3);\n\n// 移除所有对象\nhashSet.Clear();\n\n// 检查集合是否包含对象\nvar contains\
  \ = hashSet.Contains(1);\n\n// 获取集合中的项数\nvar count = hashSet.Count;\n```\n\nHashSet\
  \ 提供了许多数学集合操作：\n\n```csharp\nhashSet.IntersectWith(another);\nhashSet.ExceptWith(another);\n\
  hashSet.UnionWith(another);\nhashSet.IsSuperset(another);\nhashSet.IsSubsetOf(another);\n\
  hashSet.Equals(another);\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n## Stack<T>\n\n![image](img/chapter_title_below.png)\n\nStack 具有后进先出 (LIFO) 行为。Stack\
  \ 用于需要为用户提供回退功能的情况。例如浏览器。当你浏览不同的网站时，访问的 URL 地址被推入栈中。然后，当点击后退按钮时，栈顶项（代表当前 URL 地址）被弹出，现在我们可以获取上一个访问的地址。另一个例子是应用程序中的撤销功能；它是使用栈实现的。\n\
  \n以下是 Stack 的用法示例：\n\n```csharp\nvar stack = new Stack<string>();\n\n// 在栈中推入项\n\
  stack.Push(\"http://www.facebook.com\");\n\n// 检查栈是否包含给定项\nvar contains = stack.Contains(\"\
  http://www.facebook.com\");\n\n// 栈顶第一个项并移除\nvar top = stack.Pop();\n\n// 返回栈顶第一个项\n\
  var top = stack.Peek();\n\n// 获取栈中的项数\nvar count = stack.Count;\n\n// 从栈中移除所有项\n\
  stack.Clear();\n```\n\n与字典和列表一样，栈在内部也是使用数组实现的。然而，C# 中的数组具有固定大小，因此当你向栈中推入项时，可能需要通过重新分配一个更大的数组并将现有项复制到新数组来增加其容量。但如果不需要重新分配，push\
  \ 是 O(1) 操作；否则，如果需要重新分配，假设栈中有 n 个元素，则所有这些元素都需要复制到新数组中。其运行时间复杂度为 O(n)。\n\n`Pop()`\
  \ 方法是 O(1) 操作。\n\n`Contains()` 方法是线性搜索操作，时间复杂度为 O(n)。\n\n## Queue<T>\n\n\n\n\n\n\
  `Queue` 具有先进先出（FIFO）的行为。`Queues` 用于需要按照到达顺序处理项的场景。\n\n队列有三个主要操作，包括：\n\n* `Enqueue`：意味着在队列的末尾添加元素\
  \ \n* `Dequeue`：用于移除队列头部的元素 \n* `Peek`：用于检查头部的元素但不将其移除。\n\n队列的用法示例：\n\n```csharp\n\
  var queue = new Queue<string> ();\n\n// 向队列添加一个项\nqueue.Enqueue(\"transaction1\"\
  );\n\n// 检查队列是否包含给定项\nvar contains = queue.Contains(\"transaction1\");\n\n// 移除并返回队列头部的项\n\
  var front = queue.Dequeue();\n\n// 返回队列头部的项但不移除它\nvar top = queue.Peek();\n\n//\
  \ 清除队列中的所有项\nqueue.Clear();\n\n// 获取队列中的项总数\nvar count = queue.Count;\n```\n\n结论，当你需要通过索引访问项时，请使用列表（lists），但在列表中搜索项的速度非常慢，因为该搜索是线性搜索。\n\
  \n字典（Dictionaries）提供了通过键进行快速访问或查找的能力。键必须是唯一的且不能为空。\n\n`HashSets` 在你需要快速访问或查找以检查元素是否存在于集合中时非常有用。\n\
  \n`Stacks` 提供后进先出（LIFO）行为，当你需要为用户提供一种返回方式时是有益的。\n\n`Queues` 提供先进先出（FIFO）行为，对于按照项到达的顺序处理项非常有益。\n\
