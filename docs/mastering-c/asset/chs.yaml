  \ 发送邮件。\n\n# 第八章\n\n## 处理文件\n\n在本节中，我们将学习如何在 C# 中处理文件和目录。\n\n在 .Net 中，我们有一个命名空间\
  \ `System.IO`，用于处理文件和目录的类都位于这里。\n\n我们将查看以下类；\n\n`File`, `Fileinfo`\n\n`Directory`,\
  \ `DirectoryInfo`\n\n`Path`\n\n### File, Fileinfo\n\n这两个类提供了创建、复制、删除、移动和打开文件的方法。\n\
  \n它们具有类似的接口，唯一的区别是 `fileInfo` 提供实例方法，而 `file` 提供静态方法，因此这里是包含在 `file`, `fileInfo`\
  \ 中的一些方法：\n\n- `Create()` 创建文件\n- `Copy()` 复制文件\n- `Deletes()` 删除文件。\n\n\n\n\n\n\
  # 第九章\n\n- `Exists()`: 检查文件是否存在。\n- `GetAttributes()`: 返回文件的所有属性。\n- `Move()`: 将文件从一个位置移动到另一个位置。\n\
  - `ReadAllText()`: 读取文件中的文本。\n\n## Directory, DirectoryInfo\n\n它们与 `File`, `FileInfo`\
  \ 类似。`DirectoryInfo` 提供了实例方法，而 `Directory` 提供静态方法。它们的方法包括：\n\n- `CreateDirectory()`:\
  \ 创建目录。\n- `Delete()`: 删除目录。\n- `Exists()`: 检查目录是否存在。\n- `GetCurrentDirectory()`:\
  \ 返回当前目录。\n- `GetFiles()`: 返回目录中的文件。\n- `Move()`: 将文件从一个目录移动到另一个目录。\n- `GetLogicalDrives()`:\
  \ 返回硬盘的逻辑驱动器，如 `C` 盘。\n\n## Path\n\n具有以下方法：\n\n- `GetDirectoryName()`: 获取目录名。\n\
  - `GetFileName()`: 获取文件名。\n- `GetExtension()`: 获取路径或文件的扩展名。\n- `GetTemPath()`: 获取文件夹的临时路径。\n\
