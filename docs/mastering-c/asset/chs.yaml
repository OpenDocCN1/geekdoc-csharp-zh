  ### 接口与继承\n\n关于接口的一个常见误解之一是它们被用于在 C# 中实现多重继承。这从根本上说是错误的，但许多书籍和视频都对此做了虚假陈。\n\n通过继承，我们编写一次代码并重复使用，而不需要再次输入所有代码。\n\
  \n通过接口，我们只需要声明实现类应该包含的成员。然后，我们需要在该类中编写所有这些声明以及具体的实现。因此，代码并没有被继承，甚至成员的声明也是如此！\n\n\
  例如，假设我们有一个名为 `UIControl` 的类，具有 `Id`、`size`、`TopLeft` 等属性和对象，以及 `Draw()`、`Focus()`\
  \ 方法。让我们创建一个派自 `UIControl` 的类 `TextBox`，并实现两个接口 `IDraggable` 和 `IDroppable`。\n\n\
  我提到过接口与继承无关，让我澄清一下：比当你使用继承时（例如当你派生自 `UIControl` 时），`TextBox` 会自动继承我们在 `UIControl`\
  \ 内部编写的所有代码；但对于像 `IDraggable` 和 `IDroppable` 这样的接口，它们只有 `Drag()` 和 `Drop()` 方法的声明而没有实现，我们必须在\
  \ `TextBox` 类中实现它们。因此，既没有代码可以继承，也没有可重用性，这就是为什么我说接口与继承无关。在语法上，它们的写法与继承相同，但说一个类“继承”接口是错误的，类是“实现”接口。\n\
  \n![image](img/image095.png)\n\n![image](img/image108.png)\n\n![image](img/image081.png)\n\
  \n![image](img/image132.png)\n接口用于构建松耦合、可测试和可扩展的应用程序，而不是为了代码复用\n\n––––––––\n\n###\
  \ 接口与多态\n\n接口表现出多态行为。让我们来看看这个 `VideoEncoder` 类，当用户编码视频后，它会向用户发送通知。这种通知可以通过邮件、短信或任何其他方法。`VideoEncoder`\
  \ 类不需要知道发送此通知所采用的机制，因此我们不想让 `VideoEncoder` 绑定 `mailService` 类或 `SMS` 类，而是将使用接口来实现这种通知。我们创建一个接口\
  \ `INotificationChannel`。然后，我们创建一个实现此接口的 `MailNotificationChannel`。同样，创建另一个实现相同接口\
  \ `INotificationChannel` 的类 `SmsNotificationChannel`。这样我们就有一个接口和两个实现。在我们的 `VideoEncoder`\
  \ 类中，将有一个通知通道列表，并遍历每一个通道来发送通知。我们可以为此接口 `INotificationChannel` 创建多个实现。但 `VideoEncoder`\
  \ 类将保持不变。这实现了“开闭原则”，即软件实体对扩展开放，对修改关闭。但还缺少一个步骤：我们需要一种方法在运行时告诉 `videoEncoder` 具体的通道，我们的做法是![image](img/image156.png)\n\
  定义为私有且我们不希望将其暴露给外部。我们需要创建另一个方法，称为 `RegisterNotificationChannel`，它接收一个 `INotificationChannel`\
  \ 对象。因此在我们的 `program.cs` 类中，我们调用该方法并传入 `MailNotificationChannel`![image](img/image121.png).`VideoEncoder`\
  \ 类\n\n![image](img/image174.png)\n`INotificationChannel` 接口\n\n![image](img/image060.png)\n\
  实现 `INotificationChannel` 接口的 `MailNotification` 类\n\n![image](img/image101.png)\n\
