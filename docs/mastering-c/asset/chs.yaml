  \ |\n\n![image](img/chapter_title_above.png)\n\n## 数组与列表\n\n![image](img/chapter_title_below.png)\n\
  \n早些时候我们学习了一些关于数组的知识，在这里我们想深入了解它。我们之前提到过，数组表示特定类型的固定数量变量。在 C# 中，我们有两种类型的数组：一维数组和类似于矩阵的多维数组。\n\
  \n## 一维数组\n\n```csharp\nvar numbers = new int[5];//长度为 5\n\nvar numbers = new int[5]{1,2,3,4,5};\
  \ // 这使用其元素进行了初始化\n```\n\n## 多维数组\n\nC# 中有两种类型的多维数组：矩形数组和交错数组（Jagged arrays）。\n\n\
  ![image](img/image099.png)\n\n在矩形数组中，每行的列数相同，如所示。\n\n## ![image](img/image157.png)\n\
  \n在交错数组中，每行的列数可以不同。另一种看待交错数组的方法将其视为数组的数组，即每个元素都是一维数组的一维数组。\n\n矩形数组（二维数组）语法示例：\n\n\
  ```csharp\nvar matrix =  new int[3,5]; // 这意味着一个有 3 行 5 列的数组\n\nvar matrix = new\
  \ int[3,5]\n{\n{1,2,3,4,5},\n{5,10,15,20,25},\n{1,5.10,15,20}\n};\n```\n\n如果在创建数组时已知数组元素，我们使用初始化对象（{}）来初始化它。\n\
  \n访问此数组中的元素方式如下：\n\n```csharp\nvar element = matrix[0,0]; 其中两个 0 分别是行和列的索引\n```\n\
  \n矩形三维数组语法\n\n```csharp\nVar colors = new int[3,6,4];\n```\n\n### 交错数组语法\n\n我们使用两个方括号表示交错数组。\n\
  \n```csharp\nvar array = new int[3][];\n```\n\n在第一个方括号中，你指定顶层数组中元素的数量。\n\n我们需要初始化顶层数组：\n\
  \n```csharp\narray[0] = new int[4];\narray[1]= new int [5];\narray[2] = new int[3];\n\
  ```\n\n`Array` 类有几个方法。让我们来看看：\n\n```csharp\nvar numbers = new int[5]{1,2,3,4,5};\n\
  \n// Length\nConsole.WriteLine(numbers.Length);\n\n// IndexOf\nint index = Array.IndexOf(numbers,\
  \ 9);\nConsole.WriteLine(\"Index of 9: \" + index);\n\n// Clear\nArray.Clear(numbers,\
  \ 0, 2);\n\n// Copy\nint[] another = new int[3];\nArray.Copy(numbers, another, 3);\n\
  \n// Sort\nArray.Sort(numbers);\nConsole.WriteLine(\"Sorted array:\");\n\n// Reverse\n\
  Array.Reverse(numbers);\nConsole.WriteLine(\"Reverse of array:\");\n```\n\n注意所有这些方法都是静态方法，这就是为什么我们使用\
  \ `Array` 名称来调用它们。\n\n\n\n\n4. 编写一个程序，要求用户提供一组由逗号分隔的数字（例如 5, 1, 9, 2, 10, 39）。如果列表为空或数字少于\
  \ 6 个，则显示“Incorrect List”并要求用户重试；否则，显示列表中最小的 3 个数字。\n\n# 第章\n\n## 处理日期\n\n在本章中，我们将学习如何在\
  \ C# 中处理日期和时间。我们将介绍 `DateTime` 和 `TimeSpan`。关于 C# 中的 `DateTime` 对象，你需要了解的一点是它们是不可变的。一旦创建了它们，你就无法更改它们，但有很多方法可以使用它们来修改它们，例如\
  \ `AddDays()`、`AddMonths()` 等。另一点你需要了解的是，`DateTime` 有不同的格式，`DateTime` 中的另一个概念是格式指定符（format\
  \ specifier）。\n\n请查看下面的代码段\n\n![image](img/image080.png)\n\n## TimeSpan \n\n`TimeSpan`\
  \ 将小时、分钟和秒作为参数，它具有如 `Minutes`、`TotalMinutes` 等属性，以及如 `FromHours()`、`AddMinutes()`\
  \ 等方法。与 `dateTime` 对象类似，`Timespan` 对象也是不可变的，但它们也有如 `Add()` 等可以用于修改的方法。\n\n![image](img/image104.png)\n\
  \n# 第七章\n\n## 处理文本\n\n在本节中，我们想更深入地查看 C# 字符串。在课程早些时候，你学习了 `String` 关键字映射到 C# 中的 `String`\
  \ 类，我们还学习了字符串是不可变的，这意味着一旦创建了它们，你就无法更改它们，因此我们将查看一些实用的 `String` 方法，将字符串转换为数字以及反之的操作。\n\
  \n### 字符串格式化\n\n`ToLower()`：此方法将所有字符转换为小写，例如 //”:hello dennis”\n\n`ToUpper()`：此方法将所有字符转换为大写。//”\
  \ HELLO DENNIS”\n\n`Trim()`：此方法消除字符串周围的空白字符，这在捕获用户输入时非常有用。\n\n### 搜索\n\n要在给定的字符串中搜索字符或字符串，你可以使用\
  \ `IndexOf()` 和 `LastIndexOf()` 方法，它们分别返回给定字符或字符串的索引和最后出现的位置。`IndexOf('a')`, `LastIndexOf('Hello')`\n\
  \n### 子字符串\n\n如果你想从给定的字符串创建一个子字符串，请使用 `substring` 方法，此方法有许多重载。\n\n`Substring(startindex)`：返回从起始索引到字符串末尾的字符。\n\
  \n`SubString(startiIndex, length)`：它接收一个长度参数以限制检索的字符数量。\n\n### 替换\n\n如果你想替换字符串中给定的标题或子字符串，请使用\
  \ `Replace` 方法。\n\n`Replace (‘á’, ‘! ‘)`\n\n### 空值检查\n\n在 C# 中有几个方法可以检查对象或变量是否为空或\
