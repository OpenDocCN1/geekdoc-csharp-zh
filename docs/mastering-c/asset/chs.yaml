  \n## 可空类型\n\n![image](img/chapter_title_below.png)\n\n如你所知，在 C# 中，值类型不能为 null。例如，如果你定义了\
  \ `bool`，它可以是 True 或 False。\n\n```csharp\nbool hasAccess = true;\n```\n\n但在某些情况下你可能希望为\
  \ null，假设你正在处理数据库，一个名为 Birth 的列可以使用 `?` 声明为可空。\n\n```csharp\nDateTime? birth;\n\
  ```\n\n让我们看看 Null 的实际应用，我们有一个可空对象，这样如果 date 为空将返回默认值。\n\n![image](img/image13.png)\n\
  \n好的，让我们聊聊合并运算符，即使用 `??`。\n\n![image](img/image92.png)\n\n上述代码的意思是如果 date 不为空则赋值给\
  \ date2。注意，你可以在可空类型和值类型之间进行操作，例如：\n\n```csharp\nint? k = 4;\nint s = 3;\nint z =\
  \ k * s;\n```\n\n这将产生错误，“无法将 int? 转换为 int”。\n\n在这种情况下，为了避免上述错误，你可能需要将整个变量声明为可空：\n\
  \n```csharp\nint? k = 4;\nint? s = 3;\nint? z = k * s;\n```\n\n这次没有错误，并将给出输出。\n\n\
  回顾一下这些是可空类型的特性：\n\n- 可空类型仅用于值类型。\n- 如果值为 null，将抛出 `InvalidOperationException`；否则将返回值。\n\
  - `HasValue` 属性在变量包含值时返回 true，如果为空则返回 false。\n- 在可空类型使用 `==` 和 `!=` 运算符。对于其他比较，使用\
  \ `Nullable` 静态类。\n- 代码中不允许嵌套可空类型。例如 `Nullable<Nullable<float>> k;` 将导致编译错误。\n\n\
