  \ `person` 类，如下：\n\n![image](img/image161.png)\n\n在我们的 `Program.cs` 中有以下代码：\n\n\
  ![image](img/image18.png)\n\n运行代码查看结果\n\n#### 索引器 (Indexers)\n- 索引器是一种特殊的属性，允许通过索引访问元素。\n\
  - 如果类具有集合的语义，我们可以为它定义索引器属性。这样获取或设置集合中的项变得更简单。\n\n```csharp\npublic class HttpCookie\n\
  {\n    public string this[string key]\n    {\n        get {}\n        set {}\n \
  \   }\n}\n```\n\n### 练习题\n设计一个 `Stopwatch`。该类的作用是模拟计时器。它应该提供两个方法：`Start` 和 `Stop`。我们首先调用\
  \ `Start` 方法，然后调用 `Stop` 方法。然后我们询问计时器 `start` 和 `stop` 之间的持续时间。`Duration` 应该是 `TimeSpan`\
  \ 类型。在控制台上显示持续时间。我们还应该多次使用计时器。因此我们可以启动并停止，然后再次启动并停止。确保每次计算的持续时间都是正确的。我们不应该允许连续启动两次计时器（因为可能会覆盖初始启动时间）。所以，如果启动两次，该类应该抛出\
  \ `InvalidOperationException`。\n\n\n\n\n\n在软件工程中，耦合是衡量类和子系统之间相互连接程度的指标。在课程开始时，我解释过软件应用程序是由许多封装在命名空间和程序集中的类组成的。请看下面的图片\n\
  \n![image](img/image166.png)\n\n`Class A` 与 `Class B` 和 `class F` 相互连接，因此对 `A` 的任何更改都会影响\
  \ `B` 和 `F`，而且 `Class D` 和 `C` 也依赖于 `Class B`。这意味着对 `Class A` 的更改将影响整个应用程序。这是一个紧耦合设计的示例。类的耦合度越高，越难以修改。一个类的变化可能会影响许多其他类。\n\
  \n然而，与紧耦合软件相比，松耦合软件更容易更改。\n\n## 我们如何设计松耦合的应用程序？\n\n为了能够设计松耦合的应用程序，你需要理解三点：首先是`Encapsulation`（封装），我们之前之前讨论过；其次是类与类之间的关系，这是本节的主题；最后是接口。\n\
  \n## 类之间的关系\n\n类与类之间有两种类型的关系：`Inheritance`（继承）和 `Composition`（组合）。\n\n### Inheritance\n\
  \n这简单来说是两个类之间的一种关系，允许一个类从另一个类继承业务逻辑。它通常被称为 `Is-A`（是一个）关系：例如，你可以说红色是一种颜色。\n\n继承的优点是：\n\
  - 代码复用：这意味着将代码封装在一个类中并在另一个类中复用；以及多态行为；这种行为非常强大。\n\n#### 继承的语法\n\n假设我们有一个 `Vehicle`\
  \ 类和另一个继承自 `Vehicle` 类的 `Car` 类\n\n```csharp\npublic class Vehicle {\n// 公共共享代码\n\
  }\n\npublic class Car : Vehicle  {\n// Car 特有的代码\n}\n```\n\n注意，在 `C#` 中，一个类只能有一个父类，正如你看到的\
  \ `car` 类继承了 `vehicle` 类作为其父类。\n\n### 继承演示\n\n![image](img/image041.png)\n![image](img/image075.png)\n\
  ![image](img/image074.png)\n\n我们创建了两个类 `Vehicle` 和 `Car`，其中 `car` 继承自 `Vehicle`\
  \ 并调用 `vehicle` 中的方法。\n\n### Composition\n\n这是另一种关系，允许一个类包含另一个类。我们将组合称为 `Has-A`（有一个）关系。例如，一辆汽车\
  \ `Car` 有一个引擎 `Engine`。请看这个示例的 UML 表示法\n\n![image](img/image133.png)\n\n组合的好处是：代码复用、灵活性以及实现松耦合的手段。\n\
  \n### 看看组合的操作\n\n![image](img/image067.png)\n\n如上所示，`Car` 类有几个实例变量和一个方法。`Maruti`\
  \ 是 `Car` 的特定类型，它扩展了 `Car` 类，意味着 `Maruti` 是 `Car`。\n\n![image](img/image171.png)\n\
  \n`Maruti` 类通过组合使用了 `Engine` 对象的 `start()` 方法。我们可以说 `Maruti` 类 有一个 `Engine`。\n\n\
  ![image](img/image105.png)\n\n在 `Program.cs` 类中，初始化了 `Maruti` 类的对象。虽然 `Maruti` 类没有\
  \ `setColor()`、`setMaxSpeed()` 和 `carInfo()` 方法，但由于 `Maruti` 类与 `Car` 类之间的 `IS-A`\
  \ 关系，我们仍然可以使用它们。\n\n![image](img/image109.png)\n\n如果我们运行它，可以看到下面的输出。\n\n![image](img/image009.png)\n\
  \n### 组合 VS 继承\n\n- **继承的问题：**\n  - › 它很容易被业余的设计师/开发者滥用。\n  - › 它导致大型复杂的类层次结构。\n\
  \  - › 脆弱性：这种层级结构非常脆弱，一个更改可能会影响许多类。\n  - › 它导致紧耦合。\n- **组合的好处：**\n  - 灵活：任何继承关系都可以转换为组合。\n\
  \  - 导致松耦合。\n\n尽管如此，这并不意味着应该一直避免继承。事实上，在小层级结构之上处理非常稳定的类时，使用继承是非常极棒的。然而，随着层级结构的增长（或类的变体增加），层级结构会变得脆弱。此外，这正是组合可以为你提供更好设计的地方。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)\n\n# 第十一章\n\n![image](img/chapter_title_below.png)\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)\n\n## 访问修饰符\n\n![image](img/chapter_title_below.png)\n\
  \n你的类应该像黑盒一样被设计。它们从外部的可见性应该是有限的。实现细节、细节应该是隐藏的。在 `C #` 中，我们使用访问修饰符（大部分是 `private`）来实现这一点。这在面向对象编程中被称为信息隐藏（有时被称为封装）。\n\
  \n- **Public**：声明为 `public` 的成员随处可访问。看下面的示例，`promote` 方法在 `Customer` 类外部是可见的\n\n\
  ![image](img/image023.png)\n\n- **Private**：声明为 `private` 的成员仅可从类内部访问。看下面的示例\n\n\
  `CalculateRating()` 方法仅在类内部可见，因此客户对象无法像在上一个示例中访问 `Promte()` 方法那样访问它，相反，要调用此方法，你需要直接使用类名。\n\
  \n![image](img/image047.png)\n\n- **Protected**：声明为 `protected` 的成员仅可从该类及其派生类访问。`Protected`\
  \ 破坏了封装（因为类的实现细节会泄露到它的派生类中），最好避免使用。请改用 `private` 方法。\n\n- **Internal**：声明为 `internal`\
  \ 的成员仅从同一个程序集访问。我个人认为，将一个类声明为 `internal` 没有任何意义。看下面这个示例，尝试在程序集外部初始化该类的对象（例如在 `program.cs`\
  \ 中）将抛出错误\n\n![image](img/image153.png)\n\n––––––––\n\n![image](img/scene_break.png)\n\
  \n- **Protected Internal**：声明为 `protected internal` 的成员仅从同一个程序集或任何派生类访问。（听起来很奇怪？忘记它吧！它并不怎么用。）只是为了让你了解\
  \ `C#` 中所有的访问修饰符\n\n![image](img/image178.png)\n\n### 构造函数与继承\n\n关于继承，关于构造函数你需要了解两点：首先，在实例化对象时，基类的构造函数总是执行；其次，基类构造函数不会被继承，因此你需要在派生类中显式定义构造函数。在创建继承体系一部分类型对象时，基类构造函数总是首先执行。-\
  \ 我们可以使用 `base` 关键字将控制权传递给基类构造函数。通过示例很容易解释这一点。这里我们有一个带有 `registration Number` 的\
  \ `vehicle` 类，如下，`vehicle` 类有一个构造函数来初始化 `private` 字段 `registration Number`\n\n![image](img/image096.png)\n\
  \n现在假设我们要创建一个派自 `vehicle` 的 `car` 类，我们将使用 `base` 关键字来指示这种派生关系如下所示\n\n![image](img/image149.png)\n\
  \n`base(registrationNumber)` 方法就是 `vehicle` 类的构造函数。`car` 类的构造接收接收名为 `registrationNumber`\
  \ 的参数，并将其传递给基类。\n\n获取此示例的源码\n\n### 向上转型 / 向下转型\n\n- **向上转型 (Upcasting)**：从派生类到基类的转换。\n\
  - **向下转型 (Downcasting)**：从基类到派生类的转换。所有对象都可以隐式转换为基类引用。\n\n// 向上转型，假设我们有一个派自 `Shape`\
  \ 类的 `circle` 类，如下所示\n\n![image](img/image181.png)\n\n\n\n\n\n在向上转型（upcasting）中，我们可以进行以下隐式转换\n\
  \n```csharp\nCircle circle= new Circle ();\nShape shape = circle;\n```\n\n向下转型（Downcasting）需要强制类型转换\n\
  \n```csharp\n// Downcasting Circle circle = (Circle)shape;\n```\n\n如果转换失败，强制转换可能会抛出异常。我们可以使用\
  \ `as` 关键字来防止这种情况。如果转换失败，将返回 null。\n\n```csharp\nCircle circle = shape as Circle;\n\
  if (circle != null) ......\n```\n\n我们还可以使用 `is` 关键字：\n\n```csharp\nif (shape is\
  \ Circle)\nvar circle = (Circle) shape;\n```\n\n让我们在 Visual Studio 中演示这个概念，创建一个\
  \ `Shape` 类和一个派生自 `Shape` 类的 `Text` 类\n\n![image](img/image151.png)\n![image](img/image029.png)\n\
  \n![image](img/image126.png)\n\n## 装箱与拆箱 (Boxing and Unboxing)\n\nC# 类型分为两类：值类型和引用类型。-\
  \ 值类型（例如 `int`、`char`、`bool`、所有原始类型和 `struct`）存储在栈上。它们的生命周期很短，一旦超出范围就会从内存中移除。- 引用类型（例如所有类）存储在堆上。每个对象都可以隐式转换为基类引用。`object`\
  \ 是 `.NET Framework` 中所有类的父类。因此，值类型实例（例如 `int`）可以隐式转换为 `object` 引用。\n\n装箱是将值类型实例转换为对象引用的过程\n\
  \n```csharp\nInt number =10;\nObject obj = number;\n// 或者\nObject obj = 10;\n```\n\
  \n拆箱是相反的操作：当将对象引用转换为值类型时。\n\n```csharp\nObject obj = 10;\nInt number = (int)obj;\n\
  ```\n\n装箱和拆箱都会带来性能开销。在处理少量对象时，这种开销并不明显。但如果你正在处理数千或数万个对象，最好避免它。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
