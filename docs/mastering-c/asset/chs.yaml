  \ |\n\n![image](img/chapter_title_above.png)\n\n# 第十八章\n\n![image](img/chapter_title_below.png)\n\
  \n## 扩展方法\n\n扩展方法用于向现有类添加方法，而无需更改源代码或创建一个新的类。它适用于密封类（sealed classes）。\n\n要创建扩展类，我们需要使用\
  \ `static` 修饰符、要扩展的类名称，而要创建扩展方法，它必须是静态类中的静态方法，第一个参数使用 `this` 关键字。看下面的示例，我们创建了一个静态类\
  \ `StringExtension`，并创建了一个类型为 `string` 的静态方法 `shorten`，第一个参数为 `this str` 和 `int\
  \ numberOfWords`。\n\n![image](img/image138.png)\n\n上面的扩展类帮助你缩短字符串。\n\n让我们看看如何在 `Program.cs`\
  \ 中使用这个类。\n\n![image](img/image058.png)\n\n## 何时扩展\n\n只有当功能对扩展类型很重要时，才必须使用扩展方法。\n\
  \n在接口上使用它，以便为没有公共基类的类添加通用功能，例如 LINQ 方法是 `IEnumerable` 接口的扩展方法。\n\n在处理不是你创建的类时使用扩展方法，例如来自第三方应用程序或库的类，比如扩展\
  \ `.Net Framework` 中的 `FileInfo`。\n\n\n\n\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n# LINQ\n\n![image](img/chapter_title_below.png)\n\nLINQ 代表 Language Integrated\
  \ Query（语言集成查询）。它是 C# 3.0 引入的特性之一。\n\n它让你能够原生地在 C# 中查询对象。通过 LINQ，你可以查询内存中的对象，例如：集合（LINQ\
  \ to Objects）、数据库（LINQ to Entities）、XML（LINQ to XML）、ADO.Net Data Sets（LINQ to Data\
  \ Sets）。\n\n让我们来看看 LINQ 的实际应用，让我们来看一个简单的 `BookRepository` 类，它包含两个属性 `Title` 和 `price`\
  \ 以及一个名为 `GetBooks` 的方法，该方法返回书籍的 `IEnumerable`。\n\n![image](img/image154.png)\n\n\
  在我们的 `program.cs` 中，我们简单地实例化 `BookRepository` 并调用 `GetBooks`。假设我们想显示价格低于 10 美元的书籍，如果不使用\
  \ LINQ，我们需要遍历书籍集合以获取符合条件的书籍，然后遍历选定的列表并如所示显示。\n\n![image](img/image163.png)\n\n输出将是：\n\
  \n![image](img/image128.png)\n\n但通过 LINQ，我们可以省略上述代码，并使用更少的代码来实现功能，如下所示。黄色标记的代码显示了如何在\
  \ `where` 子句中使用 LINQ，使用一个 lambda 表达式来确定那些价格低于 10 美元的书籍。\n\n![image](img/image148.png)\n\
  \n将得到相同的输出：\n\n![image](img/image052.png)\n\nLINQ 还有另一个名为 `OrderBy` 的方法，我们可以将 LINQ\
  \ 方法链在一起，可以使用此 `OrderBy()` 方法根据 `Title` 对书籍列表进行排序。\n\n![image](img/image077.png)\n\
  \n注意，现在列表已按标题排序。\n\n![image](img/image070.png)\n\nLINQ 还有另一个强大的方法叫做 `Select()`。用于投影和转换。假设在这个例子中，我们遍历书籍列表并将其转换为另一个对象，或者选择它的一个属性作为字符串，并只输出书籍的标题。\n\
  \n![image](img/image08.png)\n\n编写 LINQ 查询有两种方式：\n\n一种是使用像这样的 LINQ 扩展方法：\n\n![image](img/image116.png)\n\
  \n另一种是使用像这样的 LINQ 查询操作符：\n\n![image](img/image022.png)\n\nLINQ 查询操作符始终以 `from` 开始并以\
  \ `select` 结束。\n\n这两个示例将实现相同的结果并产生相同的输出……因此选择使用哪一个完全取决于你。这是一种个人选择。\n\n其他让你的编码更轻松的\
  \ LINQ 扩展方法……\n\n假设我想获取一本具有特定 `Title` 的书，我可以使用 `Single()` 方法来实现：\n\n![image](img/image063.png)\n\
  \n当我们不确定该对象是否存在时，可以使用 `SingleOrDefault()` 方法来避免应用程序崩溃，因为将返回默认的 null。\n\n![image](img/image030.png)\n\
  \n我们使用 `First()` 获取列表中的第一个元素。当你不确定此类元素是否存在时，可以使用 `FirstOrDefault()`。\n\n![image](img/image110.png)\n\
  \n我们还有 `Skip()` 和 `Take()`。在我们的示例中，我们可以决定跳过前两本书并返回最后三本。\n\n![image](img/image032.png)\n\
  \n我们在 LINQ 中还有一组聚合函数，就像 SQL 一样，如 `Count()`、`Max()`、`Sum()`、`Min()` 等。\n\n![image](img/image043.png)\n\
  \n这返回最高价格最低最低。\n\n![image](img/image031.png)\n\n这返回列表中的书籍总数。\n\nLINQ 的优之处在于，无论你是从内存、数据库还是\
