  \ C#`。\n\n## Path Demo\n\n![image](img/image064.png)\n\n### 练习\n\n1. 编写一个程序读取文本文件并显示单词数。\n\
  2. 编写一个程序读取文本文件并显示文件中最长的单词。\n\n## Classes\n\n我们将从学习类（Classes）开始我们的旅程，在本节中，我将向你介绍类的基础。\n\
  \n- 什么是类？\n- 类的现实世界示例\n- 什么是对象以及它与类有什么区别。\n- 静态成员\n\n## Class\n\n类仅仅是软件应用程序的构建块，因此在现实世界中，一个应用程序由多个类组成。每个类负责应用程序中的特定行为，或者所有这些类共同产生应用程序预期的行为。简单来说，类封装了数据（存储在\
  \ `fields` 中）和行为（由 `methods` 定义）。\n\n![image](img/image175.png)\n\n## Real World\
  \ example\n\n假设我们想要实现一个像博客引擎那样的应用程序，典型的软件或应用程序至少包含三层：表示层、业务逻辑层和数据访问层。在每一层中，我们都可以拥有类，每个类负责某些特定的内容\n\
  \n![image](img/image123.png)\n\n例如，在表示层，我们可以有一个名为 `PostView` 的类，它专门负责向用户展示帖子；在业务逻辑层，我们可以有一个关于帖子本身的类；最后，持久层或数据访问层将有一个类，可以将帖子保存到数据库或从数据库加载帖子。\n\
  \n## Anatomy of a Class\n\n类有两个部分，即：\n\n- 数据（由 `fields` 表示）\n- 行为（由 `methods / functions`\
  \ 表示）\n\n以下是如何用统一建模语言（UML）演示类：\n\n![image](img/image038.png)![image](img/image020.png)![image](img/image034.png)![image](img/image036.png)\n\
  \n## Another example\n\n![image](img/image071.png)![image](img/image072.png)![image](img/image035.png)![image](img/image006.png)\n\
  \n## Object\n\n对象在根本上与类不同。对象本质上是位于内存中的类实例。在上面的 `Person` 类中，我们可以拥有如 `John`、`Mary\
  \ Ann` 等作为 `Person` 类的实例。`Person` 类型或 `person` 类定义了我们创建创建对象的蓝图。在运行时，内存中的这些每个对象彼此相互通信，从而获得应用程序预期的结果或行为。\n\
  \n## Declaring Classes\n\n在 `C#` 中，类的声明如下：访问修饰符后后跟 `class` 关键字和类名，以及用于包裹的大括号，类的方法和字段定义在大括号内，如下所示：\n\
  \n```csharp\npublic class Person\n{\n    public string Name;\n\n    public void\
  \ Introduce () // 方法用访问修饰符、返回值、名称和 () 声明\n    {\n        Console.WriteLine(\"Hi\
  \ my name is \"+ Name);\n    }\n}\n```\n\n## Creating Objects\n\n我们使用类的类型后跟标识符，然后使用\
  \ `new` 运算符来初始化类的实例，如下：\n\n```csharp\nPerson person = new Person ();\n```\n\n编写上述内容的更简短方法是使用\
  \ `var` 关键字：\n\n```csharp\nvar person = new Person ();\n```\n\n## Using Objects\n\
  \n现在我们有了一个对象，可以访问对象的成员。\n\n在我们的 `person` 对象中，我们可以访问名称并给它赋值，还可以访问 `introduce()` 方法，如下所示：\n\
  \n```csharp\nvar person = new Person();\nperson.Name = \"Dennis\";\nperson.introduce();\n\
  ```\n\n## Class Members\n\n我们有两种类型的成员：实例成员和静态成员。\n\n**Instance Members**：它们可以通过对象访问。例如：\n\
  \n```csharp\nvar person = new Person();\nperson.introduce();\n```\n\n**Static members**：可以通过类访问。例如，我们不需要拥有\
  \ `Console` 类的实例就可以使用 `WriteLine()` 方法，相反，我们使用类名 `Console` 调用它。\n\n```csharp\nConsole.WriteLine();\n\
  ```\n\n### 为什么使用静态成员？\n\n为了表示单例概念，这意味着在内存中应该只有一个该类的实例。如 `DateTime.Now` 和 `Console.WriteLine()`。\n\
  \n## Declaring Static Members\n\n要将成员定义为静态，你所需要的就是访问修饰符后使用 `static` 关键字，你可以在类的任何成员上声明静态。\n\
  \n```csharp\npublic class Person\n{\n    public static int peopleCount = 0;\n}\n\
  ```\n\n## Class Demo\n\n![image](img/image089.png)\n\n## Constructors\n\n构造函数是在类实例创建时被调用的方法。我们使用构造函数将对象处于初始状态，即初始化类中的某些字段。我们并不总是需要构造函数，但如果我们需要在创建时初始化对象，就可以使用构造函数来实现。\n\
  \n## Constructor Declaration\n\n构造函数的名称与类完全相同，这是一个要求，而且它没有返回值类型，甚至没有 void。\n\n```csharp\n\
  public class Customer\n{\n    public Customer () 默认构造函数\n    {\n    }\n}\n```\n\n\
  第二个示例：\n\n```csharp\npublic class Customer\n{\n    public string Name;\n    public\
  \ Customer (string name)\n    {\n        This.Name = name;\n    }\n}\n```\n\n##\
  \ Constructor Overloading\n\n构造函数可以重载。重载意味着具有相同名称但不同签名的方法。签名是唯一标识方法的方法：返回值类型、名称以及参数的类型和数量。在构造函数中，我们可以有如下不同的签名：\n\
  \n```csharp\npublic class Customer\n{\n    public Customer () {...} // 这不接受参数，默认构造函数\n\
  \    public Customer (string name) {...} // 这只接收一个字符串参数\n    public Customer (int\
  \ id, string name) {...} // 这接收两个参数\n}\n```\n\n我们重载是为了让类的初始化变得简单。\n\n## Constructor\
  \ Demo\n\n在 Visual Studio 的控制台项目中创建一个名为 `customer` 的独立类，并定义构造函数的不同签名或重载构造函数。\n\n\
  ![image](img/image005.png)\n\n在我们的 `program.cs` 中，我们可以初始化类并使用接收两个参数 `{Id` 和 `name}`\
  \ 的自定义构造函数之一来为类对象的成员赋值，如下所示：\n\n![image](img/image001.png)\n\n\n\n\n\n这是一种用于快速初始化对象的语法，无需调用其任何一个构造函数。\n\
  \n例如：\n\n```csharp\nvar person = new Person\n{\n    FirstName = \"Harry\",\n   \
  \ LastName = \"White\"\n};\n```\n\n### 方法 (Methods)\n方法的签名包含参数的名称、数量和顺序。\n\n例如：\n\
  \n```csharp\npublic class Point\n{\n    public void Move (int x, int y){}\n}\n```\n\
  \n### 方法重载 (Overloading Methods)\n方法重载意味着具有相同名称但不同签名的方法。这使得方法的调用者根据需要传递给方法的数据类型选择更合适的签名。\n\
  \n```csharp\npublic class Point\n{\n    public void Move (int x, int y) {} // 两个整数参数\n\
  \    public void Move (Point newLocation){} // 一个类类型作为参数\n    public void Move(Point\
  \ newLocation, int speed){} // 一个类类型和一个整数作为参数\n}\n```\n\n### 方法演示 (Method Demo)\n\
  让我们创建一个带有一些重载方法的 `Point` 类。\n\n![image](img/image122.png)\n\n进入 `Program.cs` 并初始化该类，调用上面的方法。\n\
  \n![image](img/image024.png)\n\n––––––––\n\n![image](img/scene_break.png)\n\n在你的\
  \ Visual Studio 中编写这段代码并运行它。\n\n### 字段 (Fields)\n字段可以通过两种方式初始化：在构造函数中，或直接在声明时初始化。在声明时初始化字段的好处是，如果你的类有一个或多个构造函数，你将确保无论调用哪个构造函数，字段始终会被通用初始化。\n\
  \n#### 字段初始化 (Field Initialization)\n我们可以在构造函数中这样初始化字段：\n\n```csharp\npublic class\
  \ customer\n{\n    List<Order> Orders;\n    public Customer()\n    {\n        Orders\
  \ = new List<Order>();\n    }\n}\n```\n\n另一种初始化方式是在构造函数外部：\n\n```csharp\npublic\
  \ class customer\n{\n    List<Order> Orders = new List<Order>();\n}\n```\n\n####\
  \ 只读字段 (Read-only Fields)\n我们可以使用 `readonly` 修饰符声明字段，以确保字段只被赋值一次。我们使用 `readonly`\
  \ 字段在应用程序中创建某种安全性，并提高应用程序的健壮性。例如查看 `customer` 类，我有一个只读的订单列表，如果作为开发者我不小心尝试在另一个方法中初始化此列表，我在此订单对象中的数据就不会丢失。\n\
  \n我们使用 `readonly` 修饰符来提高代码的健壮性。当字段被声明为 `readonly` 时，它需要在声明期间或在构造函数中初始化。该值不能更改。这可以防止你不意外覆盖字段的值，从而避免导致意外的状态。例如，想想上面示例中的\
  \ `Orders`。如果我们不小心在类的其他地方重新初始化此字段，列表中存储的所有 `Order` 对象将丢失。因此，我们应该将其声明为 `readonly`。\n\
  \n```csharp\npublic classs Customer\n{\n    readonly List<Order> Orders = new List<Order>();\n\
  }\n```\n\n#### 访问修饰符 (Access Modifiers)\n访问修饰符是控制对类和或其成员访问的方法，这种控制的原因是在我们的程序中创建某种安全性并提高健壮性。例如，在我们的\
  \ `Customer` 类中，如果我们有：\n\n```csharp\npublic class Customer\n{\n    private string\
  \ Name;\n}\n```\n\n在我们的 `Program.cs` 中有以下代码：\n\n```csharp\nvar john = new Customer;\n\
  john.Name;\n```\n\n这无法编译，因为字段 `Name` 是 `private` 的，且只能在 `Customer` 类内部访问。因此，通常类中的字段是私有的，可以通过称为\
  \ getter 和 setter（访问器方法）的公共方法来访问。这也是封装背后的概念，即信息隐藏。我们将在书中后面讨论它。\n\n在 C# 中我们有 5 种访问修饰符：`public`、`private`、`protected`、`internal`\
  \ 和 `protected internal`。\n- 声明为 `public` 的类成员随处可访问。\n- 声明为 `private` 的类成员仅可从类内部访问。\n\
  - 我们在学习继承时将学习其他访问修饰符。\n- 我们使用访问修饰符来隐藏类的实现细节。因此，任何关于类“如何”执行工作的内容都应该声明为 `private`。这样，我们就可以确保代码的其他部分不会触碰类的实现细节。结果是我们提高了代码的健壮性。如果更改了类的实现，我们只需要在类内部进行更改。代码的其他部分将不需要更改。\n\
  \n带有 getter 和 setter 方法的访问修饰符演示\n\n![image](img/image085.png)\n\n运行此代码并查看结果\n\n\
  ### 属性 (Properties)\n属性是类成员，它封装了用于访问字段的 getter/setter 方法。\n\n作为最佳实践，我们必须将字段声明为 `private`，并创建公共属性来提供对这些字段的访问。\n\
