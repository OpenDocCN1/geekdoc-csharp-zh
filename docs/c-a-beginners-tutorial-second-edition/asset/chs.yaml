- "# C#：初学者指南，第二版\n\n\n\n![](img/00048.jpeg)\n\n\n\n\n\n\n\n\n## 关于作者\nJayden Ky 是一位\
  \ `.NET` 顾问和专家，曾作为高级开发人员和架构师参与过各种大型项目。他的其他书籍包括`Visual Basic：初学者教程`和`C#：初学者教程`的第一版。\n\
  \n### 一元加运算符 + \n\n一元加运算符返回其操作数的值。操作数必须是数值原始类型或数值原始类型类型的变量。例如，在以下代码中，`y` 的值为 `4.5`。\n\
  \n```\n float x = 4.5f;\nfloat y = +x;\n```\n\n该运算符没有太大意义，因为缺少它不会产生区别。\n\n## 递增运算符\
  \ ++\n\n递增运算符将操作数的值加一。操作数必须是数值原始类型的变量。该运算符可以出现在操作数之前或之后。如果运算符出现在操作数之前，则称为前置递增运算符。如果写在操作数之后，则变为后置递增运算符。\n\
  \n例如，这里前置递增运算符的使用示例：\n\n```\n int x = 4;\n++x;\n```\n\n在 `++x` 之后，`x` 的值为 `5`。之前的代码等同于\n\
  \n\n\n```\n int x = 4;\nx++; \n```\n\n在 `x++` 之后，`x` 的值为 `5`。\n\n然而，如果递增运算符的结果被赋值给同一个表达式中的另一个变量，则前置运算符与其后置同类之间存在差异。考虑这个示例。\n\
  \n```\n int x = 4;\nint y = ++x;\n// y = 5, x = 5\n```\n\n前置递增运算符在赋值之前应用。`x` 增加到\
  \ `5`，然后将其值复制到 `y`。\n\n然而，查看这里后置递增运算符的使用。\n\n```\n int x = 4;\nint y = x++;\n//\
  \ y = 4, x = 5\n```\n\n使用后置递增运算符时，操作数（`x`）的值在赋值给另一个变量（`y`）之后才会增加。\n\n注意，递增运算符通常应用于\
  \ `ints`。然而，它也适用于其他类型的数值原始类型，如 `float` 和 `long`。\n\n## 递减运算符 --\n\n递减运算符将操作数的值减一。操作数必须是数值原始类型的变量。类似于递增运算符，也有前置递减运算符和后置递减运算符。例如，以下代码递减\
  \ `x` 并将值赋值给 `y`。\n\n```\n int x = 4;\nint y = --x; \n// x = 3; y = 3\n```\n\n在下面的示例中，使用了后置递减运算符：\n\
  \n```\n int x = 4;\nint y = x--; \n// x = 3; y = 4\n```\n\n## 逻辑取反运算符 !\n\n逻辑取反运算符只能应用于\
  \ `bool` 原始类型或 `System.Boolean` 实例。如果操作数为 false，该运算符的值为 true；如果操作数为 true，则为 false。例如：\n\
  \n```\n bool x = false;\nbool y = !x;  \n// 此时，y 为 true，x 为 false\n```\n\n## 位取反运算符\
  \ ~\n\n位取反运算符的操作数必须是整数原始类型或整数原始类型类型的变量。结果是操作数的位取反。例如：\n\n```\n int j = 2;\nint k\
  \ = ~j; // k = -3; j = 2\n```\n\n要理解此运算符如何工作，你需要将操作数转换为二进制数并反转所有位。整数型 `2` 的二进制形式为：\n\
  \n```\n 0000 0000 0000 0000 0000 0000 0000 0010\n```\n\n它的位取反是\n\n```\n 1111 1111\
  \ 1111 1111 1111 1111 1111 1101\n```\n\n这是 `-3` 在整数中的表示。\n\n## sizeof 运算符\n\n此一元运算符用于获取数据类型以字节为单位的大小。例如，`sizeof(int)`\
  \ 返回 `4`。\n\n# 算术运算符\n\n共有四种算术运算：加、减、乘、除和模。这里将讨论每种算术运算符。\n\n## 加法运算符 +\n\n加法运算符将两个操作数相加。操作数的类型必须可以转换为数值原始类型。例如：\n\
  \n```\n byte x = 3;\nint y = x + 5; // y = 8\n```\n\n确保接收加法结果的变量具有足够的容量。例如，在以下代码中，`k`\
  \ 的值为 `-294967296` 而不是 `40 亿`。\n\n```\n int j = 2000000000; // 20 亿\nint k = j +\
  \ j; // 容量不足。一个错误！\n```\n\n另一方面，下面的代码运行符合预期：\n\n```\n long j = 2000000000; // 20\
  \ 亿\nlong k = j + j; // k 的值为 40 亿\n```\n\n## 减法运算符 –\n\n减法运算符在两个操作数之间执行减法。操作数的类型必须可以转换为数值原始类型。例如：\n\
  \n```\n int x = 2;\nint y = x – 1;     // y = 1\n```\n\n## 乘法运算符 *\n\n乘法运算符在两个操作数之间执行乘法。操作数的类型必须可以转换为数值原始类型。例如：\n\
  \n```\n int x = 4;\nint y = x * 4;     // y = 16\n```\n\n## 除法运算符 /\n\n除法运算符在两个操作数之间执行除法。左侧操作数是被除数，右侧操作数是除数。被除数除数必须是可以转换为数值原始类型的类型。例如：\n\
  \n```\n int x = 4;\nint y = x / 2;     // y = 2\n```\n\n注意，在运行时如果除数为零，除法操作将抛出错误。\n\
  \n使用 `/` 运算符的除法结果总是整数。如果除数不能整除被除数，余数将被忽略。例如\n\n```\n int x = 4;\nint y = x / 3;\
  \     // y = 1\n```\n\n## 模运算符 %\n\n模运算符在两个操作数之间执行除法并返回余数。左侧操作数是被除数，右侧操作数是除数。被除数除数必须是可以转换为数值原始类型的类型。例如，以下操作的结果为\
  \ `2`。\n\n```\n 8 % 3\n```\n\n## 等等运算符\n\n有两个相等运算符：`==`（等于）和 `!=`（不等于），它们都作用于可以是整数、浮点、字符或\
  \ `bool` 的两个操作数。相等运算符的结果是一个 `bool`。\n\n例如，比较后 `c` 的值为 true。\n\n```\n int a = 5;\n\
  int b = 5;\nbool c = a == b;\n```\n\n另一个示例：\n\n```\n bool x = true;\nbool y = true;\n\
  bool z = x != y;\n```\n\n比较后 `z` 的值为 false，因为 `x` 等于 `y`。\n\n## 关系运算符\n\n有五个关系运算符：`<`、`>`\
  \ `<=` `>=`。本节将解释这些运算符中的每一个一个。\n\n`<`、`>` `<=` `>=` 运算符作用于两个类型必须可以转换为数值原始类型的操作数。关系运算返回\
  \ `bool`。\n\n`<` 运算符评估左侧操作数的值是否小于右侧操作数的值。例如，以下操作返回 false：\n\n```\n 9 < 6\n```\n\n\
  `>` 运算符评估左侧操作数的值是否大于右侧操作数的值。例如，此操作返回 true：\n\n```\n 9 > 6\n```\n\n`<=` 运算符测试左侧操作数的值是否小于或等于右侧操作数的值。例如，以下操作结果为\
  \ false：\n\n```\n 9 <= 6\n```\n\n`>=` 运算符测试左侧操作数的值是否大于或等于右侧操作数的值。例如，此操作返回 true：\n\
  \n```\n 9 >= 9\n```\n\n## 条件运算符\n\n有三个条件运算符：与运算符 `&&`、或运算符 `||` 和 `?` 运算符。下面将详细介绍这些每一个。\n\
  \n`&&` 运算符\n\n该运算符接受两个表达式作为操作数，且两个表达式必须返回一个可以转换为 `bool` 的值。如果两个操作数求值均为 true，则返回\
  \ true。否则返回 false。如果左侧操作数求值为 false，则不会求值右侧操作数。例如，以下返回 false。\n\n```\n (5 < 3) &&\
  \ (6 < 9)\n```\n\n### || 运算符\n\n\n\n\n此运算符接受两个表达式作为操作数，且两个表达式都必须返回一个可以转换为 `bool`\
  \ 的值。如果其中一个操作数的值为真，则返回真。如果左侧操作数的值为真，则不会对右侧操作数求值。例如，以下表达式返回真。\n\n```\n (5 < 3) ||\
  \ (6 < 9)\n```\n\n### ? : 运算符\n\n此运算符作用于三个操作数。语法如下：\n\n```\n expression1 ? expression2\
  \ : expression3\n```\n\n在这里，`expression1` 必须返回一个可以转换为 `bool` 的值。如果 `expression1`\
  \ 为真，则返回 `expression2`。否则，返回 `expression3`。\n\n例如，以下表达式将 4 赋值给 `x`。\n\n```\n int\
  \ x = (8 < 4) ? 2 : 4\n```\n\n# 移位运算符\n\n移位运算符接受两个操作数，其类型必须可以转换为整数类型。左侧操作数是要位移的值，右侧操作数指示位移距离。移位运算符有三种：\n\
  \n* `?` 左移运算符 `<<`\n* `?` 右移运算符 `>>`\n* `?` 无符号右移运算符 `>>>`\n\n## 左移运算符 <<\n\n左移运算符将数字向左位移，并在右侧补\
  \ 0。`n << s` 的值是 `n` 向左移动 `s` 个位。这等同于乘以 2 的 `s` 次方。\n\n例如，将一个值为 1 的 `int` 向左移动 3\
  \ 位（`1 << 3`）结果为 8。同样，为了得出结论，你可以将操作数转换为二进制数。\n\n```\n 0000 0000 0000 0000 0000 0000\
  \ 0000 0001\n```\n\n向左移动 3 个位单位结果为：\n\n```\n 0000 0000 0000 0000 0000 0000 0000\
  \ 1000\n```\n\n这等于 8（与 `1 * 2³` 相同）。\n\n另一个规则是：如果左侧操作数是 `int`，则只使用位移距离的前五位。也就是说，位移距离必须在\
  \ 0 到 31 之间。如果你传递一个大于 31 的数字，将只会使用前五位。这意味着，如果 `x` 是一个 `int`，`x << 32` 等于 `x << 0`；`x\
  \ << 33` 等于 `x << 1`。\n\n如果左侧操作数是 `long`，则只使用位移距离的前六位。也就是说，实际使用的位移距离在 0 到 63 之间。\n\
  \n## 右移运算符 >>\n\n右移运算符 `>>` 将左侧操作数向右位移。`n >> s` 的值是 `n` 向右移动 `s` 个位。结果值为 `n/2^s`。\n\
  \n例如，`16 >> 1` 等于 8。为了证明这一点，写出 16 的二进制表示法。\n\n```\n 0000 0000 0000 0000 0000 0000\
  \ 0001 0000\n```\n\n然后，向右移动 1 位结果为。\n\n```\n 0000 0000 0000 0000 0000 0000 0000\
  \ 1000\n```\n\n这等于 8。\n\n## 无符号右移运算符 >>>\n\n`n >>> s` 的值取决于 `n` 是正是负。对于正数 `n`，值与\
  \ `n >> s` 相同。\n\n如果 `n` 是负数，值取决于 `n` 的类型。如果 `n` 是 `int`，值为 `(n>>s)+(2<<~s)`。如果\
  \ `n` 是 `long`，值为 `(n>>s)+(2L<<~s)`。\n\n# 赋值运算符\n\n共有十二赋值运算符：\n\n```\n =  +=  -=\
  \  *=  /=  %=  <<=  >>=  >>>=  &=  ^=  |=\n```\n\n赋值运算符接受两个操作数，其类型必须是整数基本类型。左侧操作数必须是一个变量。例如：\n\
  \n```\n int x = 5;\n```\n\n除了赋值运算符 `=` 之外，其余的运算符工作方式相同，你应该将每个运算符看作是由两个运算符组成的。例如，`+=`\
  \ 实际上是 `+` 和 `=`。赋值运算符 `<<=` 有两个运算符，`<<` 和 `=`。\n\n两部分的赋值运算符的工作原理是将第一个运算符应用于两个操作数，然后将结果赋值给左侧操作数。例如，`x\
  \ += 5` 等于 `x = x + 5`。\n\n`x -= 5` 等于 `x = x - 5`。\n\n`x <<= 5` 等同于 `x = x << 5`。\n\
  \n`x &= 5` 产生的结果与 `x = x &= 5` 相同。\n\n# 整数位运算符 & | ^\n\n位运算符 `&`、`|`、`^` 对两个类型可以转换为\
  \ `int` 的操作数执行按位操作。`&` 表示与（AND），`|` 表示或（OR），`^` 表示异或（XOR）。例如，\n\n```\n 0xFFFF &\
  \ 0x0000 = 0x0000\n0xF0F0 & 0xFFFF = 0xF0F0\n0xFFFF | 0x000F = 0xFFFF\n```\n\n##\
  \ 逻辑运算符 & | ^\n\n逻辑运算符 `&`、`|`、`^` 对两个可以转换为 `boolean` 的操作数执行逻辑操作。`&` 表示逻辑与，`|` 表示逻辑或，`^`\
  \ 表示逻辑异或。例如，\n\n```\n true && false = false\n true || false = true\n true ^ false\
  \ = true\n```\n\n# 运算符优先级\n\n运算符的优先级决定了运算符在表达式中求值的顺序。优先级越高的运算符先求值。如果两个运算符的优先级相同，则从左到右求值。\n\
  \n下表显示了 Java 中运算符的优先级：\n\n| 运算符 | 结合性 |\n| :--- | :--- |\n| `expr++`, `expr--`,\
  \ `+expr`, `-expr`, `~expr`, `++`, `--`, `!`, `-`, `+`, `? :`, `->` | 从右到左 |\n|\
  \ `postfixExpr`, `[]`, `()`, `.` | 从左到右 |\n| `*`, `/`, `%` | 从左到右 |\n| `+`, `-`\
  \ | 从左到右 |\n| `<<`, `>>`, `>>>` | 从左到右 |\n| `<`, `<=`, `>`, `>=` | 从左到右 |\n| `==`,\
  \ `!=` | 从左到右 |\n| `&` | 从左到右 |\n| `^` | 从左到右 |\n| `|` | 从左到右 |\n| `&&` | 从左到右 |\n\
  | `||` | 从左到右 |\n| `=`, `+=`, `-=`, `*=`, `/=`, `%=`, `<<=`, `>>=`, `>>>=`, `&=`,\
  \ `^=`, `|=` | 从右到左 |\n\n（注：原文中存在大量重复和混乱的文本，已根据要求提取核心内容并完成翻译）\n\n\n\n在代码中到处编写注释是一个良好的习惯，可以充分解释一个类提供什么功能、一个方法做了什么、一个字段包含什么等。\n\
  \n在 C# 中有两种类型的注释，它们的语法都与 C 和 C++ 中的注释相似。\n\n- 传统注释。使用 `/*` 和 `*/` 括起来一个传统注释。\n-\
  \ 行尾注释。使用双斜杠（`//`），这会导致 `//` 之后的该行剩余部分被编译器忽略。\n\n例如，这里有一个描述方法的注释：\n\n```\n /*\n\
  \  toUpperCase 将 String 对象中的字符转换为大写\n*/\npublic void toUpperCase(String s) {\n```\n\
  \n这里有一个行尾注释：\n\n```\n public int rowCount; //来自来自数据库的行数\n```\n\n 传统注释不支持嵌套，这意味着：\n\
  \n```\n /*\n  /* comment 1 */\n  comment 2 */\n```\n\n是无效的，因为在第一个 `/*` 之后的第一个 `*/`\
  \ 将终止注释。因此，上面的注释将包含多余的 `comment 2 */`，这将产生编译器错误。\n\n另一方面，行尾注释可以包含任何内容，包括字符序列 `/*`\
  \ 和 `*/`，如下所示：\n\n```\n // /* 这个注释是允许的 */\n```\n\n## 总结\n\n本章介绍了 C# 语言基础，即你在进入更高级的主题之前应该掌握的基本概念和主题。讨论的话题包括字符集、变量、原始类型、字面量、运算符、运算符优先级和注释。\n\
  \n第 3 章继续介绍语句，这是 C# 语言的另一个重要主题。\n\n# 第 3 章：语句\n\n计算机程序是由称为语句（statements）的指令编译而成的。C#\
  \ 中有许多类型的语句，其中一些——如 `if`、`while`、`for` 和 `switch`——是条件语句，用于决定程序的执行流。本章将讨论 C# 语句，从概述开始，然后提供每个种语句的详细信息。`return`\
  \ 语句（退出方法的语句）将在第 4 章“对象与类”中讨论。\n\n# C# 语句概述\n\n在编程中，语句是执行某项操作的指令。语句控制程序执行的顺序。给变量赋值是语句的一个示例。\n\
  \n```\n x = z + 5;\n```\n\n即使是变量声明也是一个语句：\n\n```\n long secondsElapsed;\n```\n\n\
  相比之下，表达式是运算符和操作数的组合，并会被求值。例如，`z + 5` 是一个表达式。\n\n在 C# 中，语句以分号结束，多个语句可以写在同一行。\n\n\
  ```\n x = y + 1; z = y + 2;\n```\n\n然而，不建议在同一行编写多个语句，因为这会模糊代码的可读性。\n\n## 注意\n\n\
  在 C# 中，空语句是合法的，且不执行任何操作：\n\n```\n ;\n```\n\n某些表达式可以通过以分号结尾来变为语句。例如，`x++` 是一个表达式。但是，这是一个语句：\n\
  \n```\n x++;\n```\n\n语句可以分组在一个块（block）中。根据定义，块是花括号内以下编程元素的元素的序列：\n\n- `?` 语句\n-\
  \ `?` 局部类声明\n- `?` 局部变量声明语句\n\n语句和语句块可以被标记（label）。标签名称遵循与 C# 标识符相同的规则，并以冒号结束。例如，以下语句被标记为\
  \ `sectionA`。\n\n```\n sectionA: x = y + 1;\n```\n\n此外，这里有一个标记块的示例：\n\n```\n start:\
  \ \n{\n    // statements\n}\n```\n\n标记语句或块的目的是为了使其能够被 `goto` 语句引用。使用 `goto` 通常被认为是一种坏习惯，书中不会讨论它。\n\
  \n# if 语句\n\n`if` 语句是一种条件分支语句。`if` 语句的语法是以下两种之一：\n\n```\n if (booleanExpression)\
  \ \n{\n    statement(s)\n}\n```\n\n```\n if (booleanExpression) \n{\n    statement(s)\n\
  } \nelse \n{\n    statement(s)\n}\n```\n\n如果 `booleanExpression` 求值为真，则执行 `if` 语句后续的块中的语句。如果它求值为假，则不执行\
  \ `if` 块中的语句。如果 `booleanExpression` 求值为假且存在 `else` 块，则执行 `else` 块中的语句。\n\n例如，在在接的\
  \ `if` 语句中，如果 `x` 大于 4，将执行 `if` 块。\n\n```\n if (x > 4) \n{\n    // statements\n\
  }\n```\n\n在下一个示例中，如果 `a` 大于 3，将执行 `if` 块。否则，将执行 `else` 块。\n\n```\n if (a > 3) \n\
  {\n    // statements\n} \nelse \n{\n    // statements\n}\n```\n\n注意，良好的代码风格建议块中的语句应当缩进。\n\
  \n如果你在 `if` 语句中评估一个 `bool`，没有必要像这样使用 `==` 运算符：\n\n```\n bool fileExist = ...\nif\
  \ (fileExist == true)\n```\n\n相反，你可以直接写成：\n\n```\n if (fileExists) \n```\n\n同样，与其写成：\n\
  \n```\n if (fileExists == false) \n```\n\n不如写成：\n\n```\n if (!fileExists)\n```\n\
  \n如果评估的表达式太长而无法写在一行，建议对后续行使用两个单位的缩进。例如：\n\n```\n if (numberOfLoginAttempts < numberOfMaximumLoginAttempts\n\
  \        || numberOfMinimumLoginAttempts > y) \n{\n    y++;\n}\n```\n\n如果 `if` 或\
  \ `else` 块中只有一个语句，则花括号是可选的。\n\n```\n if (a > 3)\n    a++;\nelse\n    a = 3;\n```\n\
  \n然而，这可能会导致所谓的悬空 else（dangling else）问题。考虑以下示例（注意 `System.Console.WriteLine` 是用于打印字符串或值的\
  \ C# 代码）：\n\n```\n if (a > 0 || b < 5)\n    if (a > 2)\n        System.Console.WriteLine(\"\
  a > 2\");\n    else\n        System.Console.WriteLine(\"a < 2\");\n```\n\n该 `else`\
  \ 语句是悬空的，因为目前不清楚它与哪个 `if` 语句关联。`else` 语句总是与紧前的 `if` 关联。使用花括号会让代码更清晰：\n\n```\n if\
  \ (a > 0 || b < 5) \n{\n    if (a > 2) \n        System.Console.WriteLine(\"a >\
  \ 2\");\n    else\n        System.Console.WriteLine(\"a < 2\");\n}\n```\n\n如果有多个选择，你也可以使用\
  \ `if` 配合一系列 `else` 语句。\n\n```\n if (booleanExpression1) \n{\n    // statements\n\
  } \nelse if (booleanExpression2) \n{\n    // statements\n} \n...\nelse \n{\n   \
  \ // statements\n}\n```\n\n例如：\n\n```\n if (a == 1) \n{\n    System.Console.WriteLine(\"\
  one\");\n} \nelse if (a == 2) \n{\n    System.Console.WriteLine(\"two\");\n} \n\
  else if (a == 3) \n{\n    System.Console.WriteLine(\"three\");\n} \nelse\n{\n  \
  \  System.Console.WriteLine(\"invalid\");\n}\n```\n\n在这种情况下，紧跟在 `else` 的语句不使用花括号。请参见本章后面“switch\
  \ 语句”部分。\n\n# while 语句\n\n在许多情况下，你可能希望连续执行某些操作。换句话说，你有一段希望重复执行的代码。直观上，可以通过重复代码来实现。例如，可以使用此行代码实现蜂声：\n\
  \n```\n System.Console.Beep();\n```\n\n并且，为了等待半秒，你使用此语句：\n\n```\n System.Threading.Thread.Sleep(500);\n\
  ```\n\n因此，为了在两个蜂声之间间隔 500 毫秒的情况下产生三个蜂声，你可以简单重复相同的代码：\n\n```\n System.Console.Beep();\n\
  System.Threading.Thread.Sleep(500);\nSystem.Console.Beep();\nSystem.Threading.Thread.Sleep(500);\n\
  System.Console.Beep();\n```\n\n然而，在某些情况下重复代码并不可行。以下是一些情况：\n\n- 重复次数高于 5 次，这意味着代码行增加了五倍。如果你需要修复块中的某行，则该行的副本也必须修改。\n\
  - 如果重复次数无法预知。\n\n\n\n\n\n更聪明明的方法是将重复的代码放入循环中。这样，你只需要编写一次代码，但可以指示 C# 执行任意次数的代码。创建循环的一种方法是使用\
  \ `while` 语句，这是本节讨论的主题。另一种方法是使用 `for` 语句，它将在下一节中解释。\n\n`while` 语句的语法如下：\n\n```\n\
  \ while (booleanExpression) \n{\n    statement(s)\n}\n```\n\n在这里，只要 `booleanExpression`\
  \ 求值为真，`statement(s)` 就会被执行。如果大括号内只有一个有一个语句，你可以省略大括号。然而，为了清晰起见，你应该始终使用大括号。\n\n作为\
  \ `while` 语句的示例，以下代码打印小于三的整数。\n\n```\n int i = 0;\nwhile (i < 3) \n{\n    System.Console.WriteLine(i);\n\
  \    i++;\n}\n```\n\n注意，循环中代码的执行取决于 `i` 的值，`i` 在每次迭代中都会增加，直到达到 3。\n\n要以 500 毫秒的间隔产生三声蜂鸣，请使用以下代码：\n\
  \n```\n int j = 0;\nwhile (j < 3) {\n    System.Console.Beep(); \n    try \n   \
  \ {\n        Thread.currentThread().sleep(500);\n    } \n    catch (Exception e)\
  \ \n    {\n    }\n    j++;\n}\n```\n\n有时，你会使用始终求为真的表达式（例如布尔字面量 `true`），但依赖 `break`\
  \ 语句来退出循环。\n\n```\n int k = 0;\nwhile (true) \n{\n    System.Console.WriteLine(k);\n\
  \    k++;\n    if (k > 2) {\n        break;\n    }  \n}\n```\n\n你将在本章后面的“break 语句”部分学习\
  \ `break` 语句。\n\n# The do-while 语句\n\n`do-while` 语句类似于 `while` 语句，不同之处在于相关的块至少会被执行一次。它的语法如下：\n\
  \n```\n do \n{\n    statement(s)\n} while (booleanExpression);\n```\n\n使用 `do-while`\
  \ 时，你将要执行的 `statement(s)` 放在 `do` 关键字之后。与 `while` 语句一样，如果大括号内只有一个语句，你可以省略大括号。然而，为了清晰起见，请始终使用大括号。\n\
  \n例如，这里是 `do-while` 语句的示例：\n\n```\n int i = 0;\ndo \n{\n    System.Console.WriteLine(i);\n\
  \    i++;\n} while (i < 3);\n```\n\n这在控制台上打印以下内容：\n\n```\n 0\n1\n2\n```\n\n接下来的\
  \ `do-while` 展示了即使用于测试表达式 `j < 3` 的 `j` 的初始值为假，`do` 块中的代码至少也会执行一次。\n\n```\n int\
  \ j = 4;\ndo \n{\n    System.Console.WriteLine(j);\n    j++;\n} while (j < 3);\n\
  ```\n\n这在控制台上打印以下内容。\n\n```\n 4\n```\n\n# for 语句\n\n`for` 语句类似于 `while` 语句，即你用它包含需要执行多次的代码。然而，`for`\
  \ 比 `while` 更复杂。\n\n`for` 语句以初始化开始，随后在每次迭代时进行表达式求值，如果表达式求值为真，则执行语句块。在每次迭代的语句块执行后，还会执行一个更新语句。\n\
  \n`for` 语句具有以下语法：\n\n```\n for ( init ; booleanExpression ; update ) {\n    statement(s)\n\
  }\n```\n\n在这里，`init` 是在第一次迭代之前进行的初始化，`booleanExpression` 是布尔表达式，如果它求值为真，则会导致 `statement(s)`\
  \ 的执行，`update` 是在语句块执行后执行的语句。`init`、`expression` 和 `update` 都是可选的。\n\n`for` 语句只有在满足以下条件之一才会停止：\n\
  \n* `booleanEpression` 求值为假\n* 执行了 `break` 或 `continue` 语句\n* 发生运行时错误。\n\n在初始化部分声明变量并为其赋值是常见的做法。所声明的变量在表达式部分、更新部分以及语句块中都是可见的。\n\
  \n例如，下面的 `for` 语句循环五次，每次都打印 `i` 的值。\n\n```\n for (int i = 0; i < 3; i++) \n{\n \
  \   System.Console.WriteLine(i);\n}\n```\n\n`for` 语句首先声明一个名为 `i` 的 `int` 变量并赋值为\
  \ 0：\n\n```\n int i = 0;\n```\n\n然后求值表达式 `i < 3`，由于 `i` 等于 0，该表达式结果为真。结果是执行语句块并打印\
  \ `i` 的值。然后执行更新语句 `i++`，将 `i` 增加到 1。第一次循环结束。\n\n`for` 语句接着再次求值 `i < 3`。结果仍然为真，因为\
  \ `i` 等于 1。这导致语句块被执行，并在控制台上打印 1。之后，执行更新语句 `i++`，将 `i` 增加到 2。第二次循环结束。\n\n接下来，求值表达式\
  \ `i < 3`，结果为真，因为 `i` 等于 2。这导致语句块运行，并在控制台上打印 2。随后，执行更新语句 `i++`，导致 `i` 等于 3。循环结束。\n\
  \n最后，再次求值表达式 `i < 3`，结果为假。这停止了 `for` 循环。\n\n这就是你将在控制台上看到的内容：\n\n```\n 0\n1\n2\n\
  ```\n\n注意，变量 `i` 在其他地方都是不可可见的，因为它是在 `for` 循环内部声明的。\n\n同样注意，如果 `for` 内部的语句块只包含一个语句，你可以移除大括号，因此在这种情况下，上面的\
  \ `for` 语句可以重写为：\n\n```\n for (int i = 0; i < 3; i++) \n    System.Console.WriteLine(i);\n\
  ```\n\n然而，即使只有一个语句，使用大括号也会让你的代码更清晰。\n\n这是 `for` 语句的另一个示例。\n\n```\n for (int i =\
  \ 0; i < 3; i++) \n{\n    if (i % 2 == 0) \n    {\n        System.Console.WriteLine(i);\n\
  \    }\n}\n```\n\n这个循环了三次。对于每次迭代，测试 `i` 的值。如果 `i` 是偶数，则打印它的值。`for` 循环的结果如下：\n\n\
  ```\n 0\n2\n```\n\n接下来的 `for` 循环与上例类似，但使用 `i += 2` 作为更新语句。结果是它只循环两次，当 `i` 等于 0 和当它为\
  \ 2 时。\n\n```\n for (int i = 0; i < 3; i += 2) \n{\n    System.Console.WriteLine(i);\n\
  }\n```\n\n等待，让我重新检查提供的文本：“递减变量的语句也经常使用。考虑以下 `for` 循环：\n\n```\n for (int i = 3; i\
  \ > 0; i--) \n{\n    System.Console.WriteLine(i);\n}\n```\n\n它打印：\n\n```\n 3\n2\n\
  1\n```\n\n`for` 语句的初始化部分是可选的。在下面的 `for` 循环中，变量 `j` 在循环外部声明，因此 `j` 可能从语句块之外的点被使用。\n\
  \n```\n int j = 0;\nfor ( ; j < 3; j++) {\n    System.Console.WriteLine(j);\n}\n\
  // j 在这里是可见的\n```\n\n如之前所述，更新语句是可选的。接下来的 `for` 语句将更新语句移动到语句块末尾。结果是相同的。\n\n```\n\
  \ int k = 0;\nfor ( ; k < 3; ) \n{\n    System.Console.WriteLine(k);\n    k++;\n\
  }\n```\n\n理论上，你甚至可以省略 `booleanExpression` 部分。例如，下面的 `for` 语句没有该部分，循环仅通过 `break`\
  \ 语句终止。更多信息请参见“break 语句”部分。\n\n```\n int m = 0;\nfor ( ; ; ) \n{\n    System.Console.WriteLine(m);\n\
  \    m++;\n    if (m > 4) \n    {\n        break;\n    }\n}\n```\n\n如果你比较 `for`\
  \ 和 `while`，你会发现可以用 `for` 语句替换 `while` 语句。这意味着\n\n```\n while (expression) \n{\n\
  \    ...\n}\n```\n\n总是可以写成\n\n```\n for ( ; expression; ) \n{\n    ...\n}\n```\n\
  \n## Note\n\n此外，`foreach` 可以遍历数组或集合。有关 `foreach` 的讨论请参见第 5 章“核心类”和第 14 章“集合”。\n\n\
  \n\n\n\n例如，考虑以下代码\n\n```\n int i = 0;\nwhile (true) \n{\n    System.Console.WriteLine(i);\n\
  \    i++;\n    if (i > 3) {\n        break;\n    }\n}\n```\n\n结果是：\n\n```\n 0\n\
  1\n2\n3\n```\n\n注意，`break` 会跳出循环而不执行块中剩余的语句。\n\n这里是 `break` 的另一个示例，这次是在 `for` 循环中。\n\
  \n```\n int m = 0;\nfor ( ; ; ) \n{\n    System.Console.WriteLine(m);\n    m++;\n\
  \    if (m > 4) {\n        break;\n    }\n}\n```\n\n# continue 语句\n\n`continue`\
  \ 语句类似于 `break`，但它只停止当前迭代的执行，并使控制从下一次迭代开始。\n\n例如，以下代码打印数字 0 到 9，但排除了 5。\n\n```\n\
  \ for (int i = 0; i < 10; i++) \n{\n    if (i == 5) {\n        continue;\n    }\n\
  \    System.Console.WriteLine(i);\n}\n```\n\n当 `i` 等于 5 时，`if` 语句的表达式为真，导致调用 `continue`\
  \ 语句。结果是，下方打印 `i` 值的语句不会执行，控制继续下一次循环，即 `i` 等于 6 时。\n\n# switch 语句\n\n正如在本节的最后一部分“if\
  \ 语句”中所讨论的，`switch` 语句是一系列 `else if` 语句的替代方案。`switch` 允许你根据表达式的返回值，从一组代码中选择一个语句块来运行。`switch`\
  \ 语句中使用的表达式必须返回 `int`、`String` 或枚举值。\n\n## 注意\n\n`String` 类将在第 5 章“核心类”中讨论，枚举值将在第\
  \ 12 章“枚举”中讨论。\n\n`switch` 语句的语法如下。\n\n```\n switch(expression) \n{\n    case value_1\
  \ : \n        [statement(s);]\n        [break | goto label;] \n    case value_2\
  \ : \n        [statement(s);]\n        [break | goto label;] \n      .\n      .\n\
  \      .\n    case value_n : \n        [statement(s);]\n        [break | goto label;]\
  \ \n    default: \n        [statement(s);]\n        [break | goto label;] \n}\n\
  ```\n\n在 `switch` case 的每个语句之后，你都可以选择 `break` 或使用 `goto` 跳转到标签。语句和跳转语句是可选的。\n\n\
  这里是 `switch` 语句的示例。如果 `i` 的值为 1，则打印“One player is playing this game.”。如果值为 2，则打印“Two\
  \ players are playing this game is printed.”如果值为 3，则打印“Three players are playing\
  \ this game is printed.对于任何其他值，将打印“You did not enter a valid value.”。\n\n```\n int\
  \ i = ...;\nswitch (i) \n{\n    case 1 : \n        System.Console.WriteLine(\n \
  \               \"One player is playing this game.\");\n        break; \n    case\
  \ 2 : \n        System.Console.WriteLine(\n                \"Two players are playing\
  \ this game.\");\n        break;\n    case 3 : \n        System.Console.WriteLine(\n\
  \                \"Three players are playing this game.\");\n        break;\n  \
  \  default:  \n        System.Console.WriteLine(\n                \"You did not\
  \ enter a valid value.\");\n        break;\n}\n```\n\n## 总结\n\nC# 程序的执行顺序由语句控制。在本章中，你学习了以下控制语句：`if`、`while`、`do-while`、`for`、`break`、`continue`\
  \ 和 `switch`。理解如何使用这些语句对于编写正确的程序至关重要。\n\n# 第 4 章：对象与类\n\n本章将介绍对象和类。如果你是 OOP（面向对象编程）的新手，你可能想要仔细阅读本章，因为深入\
  \ OOP 是编写高质量程序的关键。\n\n本章首先解释什么是对象以及什么构成了类。然后它教你如何使用 `new` 关键字在 C# 中创建对象、对象是如何存储在内存中的、类如何组织到命名空间中、如何使用访问控制来实现封装，以及\
  \ C# 如何管理未使用的对象。此外，还解释了方法重载和静态类成员。\n\n# 什么是 C# 对象？\n\n在 OOP 语言中开发应用程序时，你会创建一个类似于现实情况的模型来解决你的问题。例如，一个公司薪资应用程序，它可以计算员工的实到手工资和应交所得税金额。这样的应用程序将有一个\
  \ `Company` 对象来表示使用应用程序的公司，`Employee` 对象来表示在公司工作的员工，`Tax` 对象来表示每位员工的税务详情，等等。然而，在你开始编写此类应用程序之前，你需要了解什么是\
  \ C# 对象以及如何创建它们。\n\n让我们从观察生活中的对象开始。对象无处不在，有活的（人、宠物等）和其他非活的（汽车、房子、街道等）；具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。\n\
  \n（注：由于原文中存在大量重复的“每个对象都有两个特征：属性和动作。例如……等等等”等段落，在翻译时遵循“不漏掉任何一行”的原则进行了对应处理，但根据“不要重复输出原文”的指令，此处仅展示核心逻辑翻译。以下为后续部分的正常翻译）：\n\
  \n等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，等等等……（此处省略了重复的描述）\n\n等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，每个对象具有两个特征：属性和动作。例如，等等等，具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。\n\
  \n（纠正：由于提供的原文文本存在严重的文本重复错误，以下是基于原文意图的清理后翻译内容）：\n\n**什么是 C# 对象？**\n\n在 OOP 语言中开发应用程序时，你会创建一个类似于现实情况的模型来解决你的问题。例如，一个公司薪资应用程序，它可以计算员工的实到手薪资和应交所得税金额。这样的应用程序将有一个\
  \ `Company` 对象来表示使用应用程序的公司，`Employee` 对象来表示在公司工作的员工，`Tax` 对象来表示每位员工的税务详情，等等。然而，在你开始编写此类应用程序之前，你需要了解什么是\
  \ C# 对象以及如何创建它们。\n\n让我们从观察生活中的对象开始。对象无处不在，有活的（人、宠物等）和其他非活的（汽车、房子、街道等）；具体的（书籍、电视机等）和抽象的（爱、知识、税率、法规和等）。每个对象都有两个特征：属性和动作。例如，汽车具有以下属性：\n\
  * 颜色\n* 轮胎数量\n\n此外，汽车可以执行以下动作：\n* 运行\n* 刹车\n\n例如，狗具有以下属性：\n* 颜色\n* 体重\n\n以及它还可以执行以下动作：\n\
  * 吠叫\n* 嗅闻\n* 撒尿\n* 舔舐\n\n在 C# 中，属性被称为字段（fields），动作被称为方法（methods）。在其他编程语言中，方法通常被称为函数。\n\
  \n如何在 C# 中创建对象？要创建对象，你需要一个类，类将在下一节介绍。\n\n# 类\n\n类是创建相同类型对象的蓝图或模板。如果你有一个 `Employee`\
  \ 类，你可以创建任何数量的 `Employee` 对象。要创建 Street 对象，你需要一个类。\n\n类声明必须使用 `class` 关键字，后跟类名。此外，类有一个在大括号内的体。以下是类的通用语法：\n\
  \n```\n class className \n{\n    [class body]\n}\n```\n\n例如，列表 4.1 显示了一个名为 `Employee`\
  \ 的 C# 类，其中加粗部分为类体。\n\n列表 4.1：Employee 类\n\n```\n class Employee \n{\n    int Age;\n\
  \    double Salary;\n}\n```\n\n\n\n\n\nC# 中的类定义必须保存在带有 `.cs` 扩展的文件中。文件名不需要与类名相同。\n\
  \n## 注意事项\n在面向对象的程序中，为了可视化模型，软件工程师通常使用统一建模语言（UML）中定义的标准记法。在 UML 类图中，类由一个包含三个部分的矩形表示：顶部部分是类名，中间部分是字段列表，底部部分是方法列表。（参见图\
  \ 4.1）。如果显示字段和方法并不重要，可以隐藏它们。\n\n![](img/00009.jpeg)\n\n图 4.1：UML 类图中的 `Employee`\
  \ 类\n\n## 字段 (Fields)\n字段是变量。它们可以是一个值类型，也可以是引用对象的引用。例如，列表 4.1 中的 `Employee` 类有两个字段，`Age`\
  \ 和 `Salary`，它们很可能是值类型。然而，字段也可以引用对象。例如，`Empoyee` 类可能有一个类型为 `Address` 的 `Address`\
  \ 字段，`Address` 是表示街道地址的类：\n\n```\n Address address;\n```\n\n换句话说，对象可以包含其他对象，也就是说如果前者的类包含了引用后者的变量。\n\
  \n字段名称应遵循帕斯卡命名命名法（Pascal naming convention）。字段中每个单词的首字母都要大写。例如，这里是一些“良好”的字段名：`Age`、`MaxAge`、`Address`、`ValidAddress`、`NumberOfRows`。\n\
  \n## 方法 (Methods)\n方法定义了类对象（或实例）可以执行的操作。方法包含声明部分和体。声明部分由返回值、方法名和参数列表组成。体包含执行该操作的代码。\n\
  \n要声明一个方法，请使用以下语法：\n\n```\n returnType methodName (listOfArguments)\n```\n\n方法的返回类型可以是内置数据类型、对象或\
  \ `void`。`void` 返回类型意味着方法不返回任何内容。方法的声明部分称为方法的签名（signature）。\n\n例如，这里有一个返回 `double`\
  \ 的 `GetSalary` 方法。\n\n```\n double GetSalary()\n```\n\n`GetSalary` 方法不接受参数。\n\n\
  作为另一个例子，这里有一个返回 `Address` 对象对象的方法。\n\n```\n Address GetAddress()\n```\n\n而且，这里有一个接受一个参数的方法：\n\
  \n```\n int Negate(int number)\n```\n\n如果一个方法接受多个参数，则两个参数之间用逗号隔开。例如，下面的 `Add` 方法接受两个\
  \ `ints` 并返回一个 `int`。\n\n```\n int Add(int a, int b)\n```\n\n## Main 方法\n一个名为 `Main`\
  \ 的特殊方法提供了应用程序的入口。一个应用程序通常有很多类，但只需要其中一个类拥有 `Main` 方法。该方法允许包含它的类被被调用。\n\n在 C# 中，`Main`\
  \ 的返回值可以是 `void` 或 `int`。它还可以接受一个 `string[]` 参数。以下是有效的 `Main` 方法，你的应用程序中只需要存在其中一个。\n\
  \n`Main` 方法的签名如下：\n\n```\n static void Main()\nstatic void Main(string[] args)\n\
  static int Main()\nstatic int Main(string[] args)\n```\n\n如果你好奇为什么 `Main` 前面有一个\
  \ `static` 单词，你将在本章最后得到答案。\n\n如果你的 `Main` 方法接受参数，你可以在运行类时向它传递参数。要传递参数，请在可执行文件名之后输入它们。两个参数之间用空格隔开。\n\
  \n```\n MyApp arg1 arg2 arg3\n```\n\n所有参数必须以字符串的形式传递。例如，在运行 `Counter` 类时传递两个参数“1”和“safeMode”，你将输入：\n\
  \n```\n Counter 1 safeMode\n```\n\n在 Visual Studio 中向 `Main` 方法传递命令行参数，请在解决方案管理器中右键点击你的项目名称并点击\
  \ `Properties`（属性），然后在属性面板中选择 `Debug`（调试）。你会看到像图 4.2 那样的 `Debug` 窗格。在命令行参数框中输入你的参数，并按\
  \ `Ctrl+S` 保存参数。\n\n![](img/00010.jpeg)\n\n图 4.2：在 Visual Studio 中传递命令行参数\n\n##\
  \ 构造函数 (Constructors)\n每个类必须至少有一个构造函数。否则，无法从该类创建任何对象，该类将毫无用处。因此，如果你的类没有显式定义构造函数，编译器会为你添加一个。\n\
  \n构造函数用于构造对象。构造函数看起来像方法，有时被称为构造器方法。然而，与方法不同，构造函数没有返回值，即使是 `void` 也没有。此外，构造函数的名称必须与类名相同。\n\
  \n构造函数的语法如下：\n\n```\n constructorName (listOfArguments) \n{\n    [constructor body]\n\
  }\n```\n\n构造函数可以没有零参数，这种情况下它被称为无参数（或简称为 no-arg）构造函数。构造函数参数可用于初始化对象的字段。\n\n如果 C#\
  \ 编译器因为类没有构造函数而为类添加无参数构造函数，这种添加是隐式的，即它不会显示在源文件中。然而，如果存在构造函数，无论它接受多少个参数，编译器都不会向该类添加构造函数。\n\
  \n你可以在类中拥有多个构造函数，只要每个构造函数的参数集不同。\n\n如果该类没有构造函数，编译器会为类添加一个无参数构造函数，，添加是式式。。显示。。。。。。。函数函数函数函数函数函数函数函数函数\
  \        2 函数非常。。列表 4.2 描述了带有两个构造函数的 `Employee` 类。\n\n图 4.2：带有构造函数的 Employee 类\n\
  \n```\n public class Employee\n{\n    public int Age;\n    public double Salary;\n\
  \    public Employee()\n    {\n\n    }\n\n    public Employee(int AgeValue, double\
  \ SalaryValue)\n    {\n        Age = AgeValue;\n        Salary = SalaryValue;\n\
  \    }\n}\n```\n\n第二个构造函数特别有用。如果没有它，要给 age 和 salary 赋值，你需要编写额外的代码：\n\n```\n Employee\
  \ employee = new Employee();\nemployee.Age = 20;\nemployee.Salary = 90000;\n```\n\
  \n通过第二个构造函数，你可以在创建对象时同时传递值。\n\n```\n new Employee(20, 90000);\n```\n\n`new` 关键字对你来说是新的，但你将在下一节学习如何使用它。\n\
  \n## 属性 (Properties)\n属性类似于字段，但你可以对属性施加更多的控制。例如，你可以创建一个只读或只写或具有读写权限的属性。属性通常有一个后台字段，用于存储属性值。然而，你可以在存储或返回值之前对其进行计算或处理。\n\
  \n你使用特殊的方法的访问器（accessors）来实现属性。访问器的名称为 `get` 和 `set`。`get` 返回属性的值，`set` 用于赋值。只读属性有一个\
  \ `get` 访问器而没有 `set` 访问器。只写属性有一个 `set` 访问器而没有 `get` 访问器。读写属性同时具有 `get` 和 `set`。\n\
  \n列表 4.3 显示了带有 `Grade` 属性成员的 `Student` 类。注意它有一个用于存储属性值的后台字段 `grade`。\n\n列表 4.3：属性\n\
  \n```\n class Student\n{\n    private double grade; //后台字段\n    public double Grade\n\
  \    {\n        get {\n            return grade;\n        }\n        set {\n   \
  \         grade = value;\n        }\n    }\n}\n```\n\n注意 `set` 方法中的特殊关键字 `value`\
  \ 定义了赋值给属性的值。\n\n你可以像访问字段一样访问 `Grade` 属性：\n\n```\n Student student = new Student();\n\
  student.Grade = 3.7;\nConsole.WriteLine(\"Grade: \" + student.Grade);\n```\n\n另一个例子是列表\
  \ 4.4 中的 `Director` 类具有一个名为 `FullName` 的只读属性。它没有 `set` 访问器，其值是从 `FirstName` 和 `LastName`\
  \ 字段计算得出的。\n\n列表 4.4：属性\n\n```\n class Director\n{\n    public string FirstName;\n\
  \    public string LastName;\n    public string FullName\n    {\n        get \n\
  \        {\n            return FirstName + \" \" + LastName;\n        }\n    }\n\
  }\n```\n\n\n图 4.3 展示了 UML 类图中的一个类。该图提供了所有字段和方法的快速摘要。UML 允许你包含字段类型和方法签名。例如，图 4.3\
  \ 展示了一个包含五个字段和一个方法的 `Book` 类。\n\n![](img/00011.jpeg)\n\n图 4.3：在类图中包含类成员信息\n\n请注意，在\
  \ UML 类图中，字段及其类型之间用冒号隔开。方法的参数列表在括号中，其返回类型写在冒号之后。\n\n# 创建对象\n\n现在你已经知道如何编写类了，是时候学习如何从类创建对象了。对象也被称为实例（instance）。`construct`\
  \ 一词经常被用来代替 `create`，因此，“构造一个 `Employee` 对象”。另一个常用术语是 `instantiate`（实例化）。实例化 `Employee`\
  \ 类等于创建一个 `Employee` 实例。\n\n创建对象有很多方法，但最常用的方法是使用 `new` 关键字。`new` 后面紧跟着要实例化的类的构造函数。例如，要创建一个\
  \ `Employee` 对象，你可以写道：\n\n```\nnew Employee();\n```\n\n大多数情况下，你会将创建的对象赋值给一个对象变量（或引用变量），以便稍后操作该对象。要实现这一点，你只需要声明一个与对象类型相同的对象引用。例如：\n\
  \n```\nEmployee employee = new Employee();\n```\n\n在这里，`employee` 是一个类型为 `Employee`\
  \ 的对象引用。\n\n一旦你有了对象，就可以通过赋值给该对象的对象引用来调用其方法并访问其字段。你使用点（`.`）来调用方法或字段。例如：\n\n```\n\
  objectReference.MethodName\nobjectReference.FieldName\n```\n\n例如，以下代码创建了一个 `Employee`\
  \ 对象并为其 `Age` 和 `Salary` 字段赋值：\n\n```\nEmployee employee = new Employee();\nemployee.Age\
  \ = 24;\nemployee.Salary = 50000;\n```\n\n当对象被创建时，CLR 还会执行初始化操作，为字段分配默认值值。\n\n请注意，你永远不需要显式地销毁对象来释放内存。CLR\
  \ 内部的垃圾回收器会处理这些。然而，这并不意味着你可以创建任意数量的对象，因为内存（仍然）是有限的，而且垃圾回收器的启动需要一些时间。没错，你仍然可能会耗尽内存。\n\
  \n# 空值检查\n\n引用变量可能不引用任何内容。这样的变量被称为 `null`。在空对象变量上调用方法或字段会导致错误。基本上地说，你的程序将会崩溃。\n\n\
  这里是几种检查空值的方法。\n\n# `null` 关键字\n\n引用变量引用一个对象。然而，在某些情况下，引用变量没有值（该变量没有引用对象）。这样的引用变量被认为具有\
  \ `null` 值。例如，以下类级引用变量类型为 `Book` 但尚未被赋值：\n\n```\nBook book; // book 为 null\n```\n\
  \n如果你在方法内部声明了一个本地引用变量，但没有给它赋值对象并在稍后尝试使用它，则你需要给它赋值 `null` 以停止编译器的报错：\n\n```\nBook\
  \ book = null;\n```\n\n类级引用变量会在创建实例时初始化，因此你不需要为它们分配 `null`。\n\n访问空变量引用的字段或方法会引发错误，如下代码所示：\n\
  \n```\nBook book = null;\nConsole.WriteLine(book.title); // 错误，因为 book 是 null\n\
  ```\n\n你可以使用 `==` 运算符测试引用变量是否为空。例如：\n\n```\nif (book == null) \n{\n    book = new\
  \ Book();\n}\nConsole.WriteLine(book.title);\n```\n\n# 空值合并运算符 (`??`)\n\n`??` 运算符被称为空值合并运算符。它的语法如下：\n\
  \n```\noperand-1 ?? operand-2\n```\n\n如果操作数不空，该运算符返回左侧的操作数；否则它返回右侧的操作数。例如，在以下语句中，如果\
  \ `book1` 不空，则 `newBook` 被赋值为 `book1`；如果 `book1` 为空，则赋值为 `book2`。\n\n```\nBook newBook\
  \ = book1 ?? book2;\n```\n\n# 空条件运算符\n\n如果对象为空，访问该对象的成员可能会导致错误。空条件运算符用于避免这种情况。例如：\n\
  \n```\nbook?.title\n```\n\n# 内存中的对象\n\n当你声明变量时，内会在栈（stack）或堆（heap）上分配。对于值类型，数据存储在栈上。对于引用类型，栈包含位于堆堆上的对象的地址。\n\
  \n当你使用 `new` 关键字创建实例时，对象在堆上创建，其地址被分配给栈上的变量。\n\n```\nEmployee employee = new Employee();\n\
  ```\n\n一个对象可以被多个引用变量引用。例如：\n\n```\nBook myBook = new Book();\nBook yourBook = myBook;\n\
  ```\n\n第二行将 `myBook` 的值复制给 `yourBook`。结果是`yourBook` 现在引用与 `myBook` 相同的 `Book` 对象。\n\
  \n\n\n事实证明，`Address` 对象并不真的在 `Employee` 对象内部。然而，`Employee` 对象中的地址引用变量指向了 `Address`\
  \ 对象，从而允许 `Employee` 对象操纵 `Address` 对象。因为在 C# 中，除了通过分配了对象地址的引用变量外，没有其他方法访问对象，因此其他人无法访问\
  \ `Employee` 对象“内部”的 `Address` 对象。\n\n# C# 命名空间 (Namespaces)\n\n命名空间允许你组织类和其他类型，以为你的类型创建一个真正唯一的名称并避免命名冲突。一个命名空间可以包含任意数量的类和其他类型，甚至是另一个命名空间。以下是在命名空间内声明的类。\n\
  \n```\nnamespace MyNamespace\n{\n    class MyClass\n    {\n\n    }\n}\n```\n\n如果你没有在命名空间中声明类，C#\
  \ 编译器将为你添加一个默认的命名空间，即全局命名空间。\n\n可以在多个声明中定义同一个命名空间，例如：\n\n```\nnamespace YourNamespace\n\
  {\n    class Class1\n    {\n\n    }\n}\n\nnamespace YourNamespace\n{\n    class\
  \ Class2\n    {\n\n    }\n}\n```\n\n.NET Framework 也使用命名空间来组织其类库。例如，你一直用于打印字符串的\
  \ `Console` 类属于 `System` 命名空间。\n\n要使用命名空间中的类型，你需要在文件的开头使用 `using` 指令。例如，如果你声明了：\n\
  \n```\nusing System;\n```\n\n你就可以在代码中使用 `System` 命名空间的成员了。因此，你可以简单地写：\n\n```\nConsole.WriteLine(\"\
  Program terminated.\");\n```\n\n如果你没有导入 `System`，则必须包含所用类的全限定名，例如：\n\n```\nSystem.Console.WriteLine(\"\
  Program terminated.\");\n```\n\n# 封装与类访问控制 (Encapsulation and Class Access Control)\n\
  \n面向对象编程（OOP）的一个原则——封装，是一种保护对象中需要安全部分的机制，并只暴露安全暴露的部分。电视机是封装的一个很好的例子。它内部有数千个电子元件，它们共同组成了接收信号并将其解码为图像和声音的部分。然而，这些组件并不暴露给用户，因此索尼和其他制造商将它们包裹在坚固的金属或塑料外壳中，外壳不易损坏。为了让电视机易于使用，它暴露了用户可以触摸的按钮，用于开关机、调整亮度、调节音量等。\n\
  \n回到 OOP 中的封装，让我们以一个可以编码和解码消息的类为例。该类暴露了两个名为 `Encode` 和 `Decode` 的方法，类的用户可以访问这些方法。内部有几十个变量用于存储临时值，以及执行支持任务的其他方法。类的作者隐藏了这些变量和其他方法，因为允许访问它们可能会损害编码/解码算法的安全性。此外，暴露过多的内容会让类变得难以使用。正如你后面看到的，封装是一项强大的特性。\n\
  \nC# 通过访问控制支持封装。访问控制由访问控制修饰符（简称为访问修饰符）管理。C# 中四种访问修饰符：`public`、`protected`、`internal`\
  \ 和 `private`。访问控制修饰符可以应用于类或类成员。类可以是 `public` 也可以是 `internal`。类默认具有 `internal` 访问性，除非它被显式声明为\
  \ `public`。`public` 类可以被任何命名空间中的其他类型访问。相比之下，`internal` 类仅对同一命名空间中的其他类型可见。没有访问修饰符的类具有\
  \ `internal` 访问级别。\n\n例如，在以下片段中的 `ClassA` 是一个 `public` 类。\n\n```\nnamespace CompanyA\n\
  {\n    public class ClassA\n    {\n\n    }\n}\n```\n\n`ClassA` 可以被 `CompanyA` 命名空间内的任何类型访问，也可以被命名空间外的其他类型访问。另一方面，下面的\
  \ `ClassB` 和 `ClassC` 类仅对 `CompanyA` 命名空间中的其他类型可见。这是因为 `ClassB` 和 `ClassC` 都具有 `internal`\
  \ 访问性。\n\n```\nnamespace CompanyA\n{\n    internal class ClassB\n    {\n\n    }\n\
  \n    class ClassC\n    {\n\n    }\n}\n```\n\n默认命名空间中的类可以被任何命名空间中的其他类使用，尽管该类不是 `public`\
  \ 的。例如，在片段中，`Book` 类可以使用 `Chapter` 类，`Chapter` 没有被包含在命名空间中，因此在默认命名空间中。\n\n```\n\
  class Chapter\n{\n\n}\n\nnamespace MyCompany\n{\n    class Book\n    {\n       \
  \ Chapter chapter = new Chapter();\n    }\n}\n```\n\n另一方面，这无法编译，因为 `House` 是 `YourCompany`\
  \ 命名空间的一个 `internal` 类，无法从另一个命名空间的类中访问。\n\n```\nnamespace YourCompany\n{\n    class\
  \ House\n    {\n\n    }\n}\n\nnamespace MyCompany\n{\n    class Person\n    {\n\
  \        House house = new House(); // 编译错误\n    }\n}\n```\n\n你可以将 `House` 类改为 `public`\
  \ 并从另一个命名空间访问它，如下：\n\n```\nnamespace YourCompany\n{\n    public class House\n  \
  \  {\n    }\n}\n\nnamespace MyCompany\n{\n    using YourCompany;\n    class Person\n\
  \    {\n        House house = new House(); // 编译错误\n    }\n}\n```\n\n注意，命名空间不带修饰符，并且始终是\
  \ `public` 的。\n\n现在转向类成员。类成员可以这五种访问级别之一。\n\n- `public`: 访问不受限制。\n- `protected`:\
  \ 访问限于包含它的类或派生自该类的类型。\n- `internal`: 访问限于当前程序集。\n- `protected internal`: 访问限于当前程序集或派生自包含它的类。\n\
  - `private`: 访问限于包含它的类型。\n\n`public` 类成员可以被任何可以访问包含该成员的类访问。例如，NET Framework 类库中\
  \ `System.Object` 类的 `ToString` 方法是 `public` 的。因此，一旦你构造了一个 `Object` 对象，就可以调用它的 `ToString`\
  \ 方法，因为 `ToString` 是 `public` 的。\n\n```\nObject obj = new Object();\nobj.ToString();\n\
  ```\n\n记得你通过以下语法访问类成员：\n\n```\nreferenceVariable.memberName\n```\n\n在前面的代码中，`obj`\
  \ 是指向 `System.Object` 实例的引用变量，`ToString` 是在 `System.Object` 类中定义的方法。\n\n`protected`\
  \ 类成员具有更严格的访问级别。它只能从该类或类的子类访问。类的 `private` 成员只能从同一个类内部访问。\n\n构造函数呢？构造函数的访问级别与字段和方法相同。因此，构造函数可以具有\
  \ `public`、`protected`、`internal`、`protected internal` 和 `private` 访问级别。你可能认为所有构造函数都必须是\
  \ `public` 的，因为构造函数的目的是使类可以实例化。然而，令你惊讶的是，事实并非如此。某些构造函数被设为 `private`，以便这些类不能通过使用\
  \ `new` 关键字实例化。`private` 构造函数通常用于单例类。如果你对这个主题感兴趣，可以在互联网上轻松找到关于该主题的文章。\n\n## 注意\n\
  \n在 UML 类图中，你可以包含有关类成员访问级别的信息。在 `public` 成员前加 `+`，`protected` 成员前加 `#`，`private`\
  \ 成员前加 `-`。没有前缀的成员被认为具有默认访问级别。图 4.7 显示了具有各种访问级别成员的 `Manager` 类。\n\n![](img/00015.jpeg)\n\
  \n图 4.7：在 UML 类图中包含类成员访问级别\n\n## this 关键字\n\n\n\n\n你可以在任何方法或构造函数中使用 `this` 关键字来引用当前对象。例如，如果你有一个类级字段与一个局部变量同名，你可以使用这种语法来引用前者：\n\
  \n```\n this.field\n```\n\n一种常见的用法是在构造函数中接收用于初始化字段的值。考虑代码列表 4.6 中的 `Box` 类。\n\n\
  列表 4.6：`Box` 类\n\n```\n namespace Project04a\n{\n    public class Box\n    {\n \
  \       int Length;\n        int Width;\n        int Height;\n        public Box(int\
  \ length, int width, int height)\n        {\n            this.Length = length;\n\
  \            this.Width = width;\n            this.Height = height;\n        }\n\
  \    }\n}\n```\n\n`Box` 类有三个字段：`Length`、`Width` 和 `Height`。它的构造函数接受三个用于初始化这些字段的参数。使用\
  \ `length`、`width` 和 `height` 作为参数名非常方便，因为它们反映了变量含义。在构造函数内部，`length` 指的是 `length`\
  \ 参数，而不是 `length` 字段。`this.length` 指的是类级的 `length` 字段。\n\n## 使用其他类\n\n在你正在编写的类中使用其他类是非常常见的。默认情况下允许使用与当前类相同命名空间中的类。然而，要使用另一个命名空间中的类，你必须首先使用\
  \ `using` 关键字导入该命名空间。例如，要在你的代码中使用 `System` 命名空间的成员（如 `System.Console` 类），你必须包含以下\
  \ `using` 语句：\n\n```\n namespace Project04a\n{\n    using System;\n    public class\
  \ Demo\n    {\n        public void Test()\n        {\n            // 可以使用 System.Console\
  \ 因为我们导入了 System\n            Console.WriteLine(\"Testing ...\");\n        }\n \
  \   }\n}\n```\n\n注意，`using` 语句必须位于命名空间内部，但在类声明之前。`using` 关键字可以在命名空间中出现多次。\n\n```\n\
  \ namespace Project04a\n{\n    using System;\n    using System.IO;\n    ...\n}\n\
  ```\n\n在不导入的情况下使用属于其他命名空间的类的唯一方法，是在代码中使用类的完全限定名。例如，以下语句使用了 `System.Console` 而没有导入\
  \ `System`。\n\n```\n System.Console.Beep();\n```\n\n如果你在使用不同命名空间中的同名类，则在声明类时必须使用完全限定名。例如，在列表\
  \ 4.7 中，`MyCompany.Person` 类使用了 `Project1.Chair` 和 `Project2.Chair` 类。如果没有完全限定名，将无法确定使用的是哪个\
  \ `Chair` 类。\n\n列表 4.7：使用完全限定名\n\n```\n namespace Project1\n{\n    public class\
  \ Chair\n    {\n    }\n}\n\nnamespace Project2\n{\n    public class Chair\n    {\n\
  \    }\n}\n\nnamespace MyCompany\n{\n    class Person\n    {\n        static void\
  \ Main()\n        {\n            Project1.Chair p1Chair = new Project1.Chair();\n\
  \            Project2.Chair p2Chair = new Project2.Chair();\n        }\n    }\n\
  }\n```\n\n使用另一个类的类被称为“依赖于”后者。图 4.8 显示了描述这种依赖关系的 UML 图。\n\n![](img/00016.jpeg)\n\n\
  图 4.8：UML 类图中的依赖关系\n\n依赖关系用带箭头的虚线表示。在图 4.8 中，`Book` 类依赖于 `Chapter`，因为 `GetChapter`\
  \ 方法返回了一个 `Chapter` 对象。\n\n## 静态成员\n\n你已经学习过要访问对象的公共字段或方法，你需要在对象引用后使用点号，例如：\n\n\
  ```\n // 创建 Book 的实例\nBook book = new Book();\n// 访问 Review 方法\nbook.Review();\n\
  ```\n\n这意味着你必须在访问其成员之前先创建一个对象。然而，在之前的章节中，有示例使用了 `System.Console.WriteLine` 向控制台打印值。你可能已经注意到，你可以在不需要先构造\
  \ `Console` 对象的情况下调用 `WriteLine` 方法。为什么你不需要执行这样的操作呢？\n\n```\n Console console =\
  \ new Console();\nconsole.WriteLine(\"a string\");\n```\n\n相反，你在类名后使用了点号：\n\n```\n\
  \ Console.WriteLine(\"a string\");\n```\n\nC#（以及许多 OOP 语言）支持静态成员的概念，静态成员是在无需先实例化类的情况下调用的类成员。`System.Console`\
  \ 中的 `WriteLine` 方法是静态的，这解释了为什么你可以在不先实例化 `System.Console` 的情况下使用它。\n\n静态成员与类实例绑定。相反，它们可以在没有实例的情况下被调用。事实上，作为类入口点的\
  \ `Main` 方法是静态的，因为它必须在任何对象创建之前被调用。\n\n要创建一个静态成员，你可以在字段或方法声明前使用 `static` 关键字。如果有访问修饰符，`static`\
  \ 关键字可以出现在访问修饰符之前或之后。这两种形式都是正确的：\n\n```\n public static int NumberOfPages;\nstatic\
  \ public int NumberOfPages;\n```\n\n然而，第一种形式更常用。\n\n例如，列表 4.8 显示了带有静态方法的 `MathUtil`\
  \ 类：\n\n列表 4.8：`MathUtil` 类\n\n```\n namespace Project04a\n{\n    class MathUtil\n\
  \    {\n        public static int Add(int a, int b)\n        {\n            return\
  \ a + b;\n        }\n    }\n}\n```\n\n要使用 `Add` 方法，你可以简单地调用它：\n\n```\n MathUtil.Add(a,\
  \ b)\n```\n\n术语“实例方法/字段”用于指代非静态成员。从静态方法中，无法访问实例字段，因为它们只在创建对象后才存在。\n\n初学者经常遇到的一个常见困惑是，他们无法编译类，因为它是静态的。列表\
  \ 4.9 显示了这样一个类。\n\n列表 4.9：从静态方法调用非静态成员\n\n```\n namespace Project04a\n{\n    using\
  \ System;\n    public class StaticDemo\n    {\n        public int B = 8;\n     \
  \   static void Main()\n        {\n            Console.WriteLine(B);\n        }\n\
  \    }\n}\n```\n\n**粗体行**会导致编译错误，因为它尝试从 `Main` 静态方法访问非静态字段 `B`。解决这个问题有两种方法：\n\n\
  1. 将 `B` 设为静态\n2. 创建类的实例，然后通过对象引用访问 `B`\n\n哪种方案合适取决于具体情况。通常需要多年的 OOP 经验才能得出一个让你满意的良好决策。\n\
  \n注意：你只能在类级别声明静态变量。即使方法是静态的，你也无法声明局部静态变量。\n\n静态引用变量呢？你可以声明静态引用变量。该变量将包含一个地址，但所引用的对象存储在堆中。例如：\n\
  \n```\n static Book book = new Book();\n```\n\n静态引用变量提供了一种很好的方法，可以在其他不同对象之间共享同一个对象。\n\
  \n注意：在 UML 类图中，静态成员带有下划线。例如，图 4.9 显示了带有静态方法 `Add` 的 `MathUtil` 类。\n\n## 变量作用域\n\n\
  你已经看到可以在多个地方声明变量：\n\n*   在类体中作为类字段。在此处声明的变量被称为类级变量。\n*   作为方法或构造函数的参数。\n*   在方法体或构造函数体内部。\n\
  *   在语句块内部，例如 `while` 或 `for` 块内部。\n\n现在是学习变量的作用域了。\n\n变量作用域是指变量的可访问性。规则是：在块中定义的变量只能在块内部访问。变量的作用域是定义它的块。例如，考虑以下\
  \ `for` 语句：\n\n```\n for (int x = 0; x < 5; x++) \n{\n    System.Console.WriteLine(x);\n\
  }\n```\n\n\n\n\n变量 `x` 定义在 `for` 语句内部。因此，`x` 仅在该 `for` 块块内部可用。在任何其他地方都无法访问或可见。\n\
  \n规则 2 是嵌套块可以访问在外部代码块中声明的变量。考虑此代码。\n\n```\n for (int x = 0; x < 5; x++) \n{\n  \
  \  for (int y = 0; y < 3; y++) \n    {\n        System.Console.WriteLine(x);\n \
  \       System.Console.WriteLine(y);\n    }\n}\n```\n\n上述代码是有效的，因为内部的 `for` 块可以访问在外部\
  \ `for` 块中声明的 `x`。\n\n根据规则，声明为方法参数的变量可以在方法体内部访问。同样，类级变量可以在类的任何地方被访问。\n\n如果一个方法声明了一个与类级变量同名的局部变量，则前者将“遮蔽”后者。若要在方法体内部访问类级变量，请使用\
  \ `this` 关键字。\n\n## 方法重载\n\n方法名非常重要，应该反映方法的功能。在许多情况下，由于多个方法的功能相似，你可能希望为这些方法使用相同的名称。例如，`PrintString`\
  \ 方法可能接收一个 `String` 参数并打印该字符串。然而，同一个类可能还会提供一个打印 `String` 部分的方法，它接收两个参数：要打印的 `String`\
  \ 和从开始打印的字符位置。你可能想将后者也命名为 `PrintString`，因为它确实在打印一个字符串，但这与第一个 `PrintString` 方法是重复的。\n\
  \n幸运的是，在 C# 中，多个同名方法是允许的，只要每个方法接受不同的参数类型组合。换句话说，在我们的示例中，在同一个类中拥有这两个方法是合法的。\n\n```\n\
  \ public void PrintString(String string)\npublic void PrintString(String string,\
  \ int offset)\n```\n\n这一特征被称为方法重载。\n\n方法的返回值是不在考虑内的。因此，这两个方法不能存在于同一个类中：\n\n```\n\
  \ public int CountRows(int number);\npublic string countRows(int number);\n```\n\
  \n这是因为方法可以在被调用时不将其返回值赋值给变量。在这种情况下，拥有上述 `CountRows` 方法会让编译器感到困惑，因为当你写下\n\n```\n System.Console.Write(countRows(3));.\n\
  ```\n\n时，它不知道调用的是哪个方法。\n\n更复杂的情况在以下方法中体现，它们的签名非常相似。\n\n```\n public int PrintNumber(int\
  \ i) \n{\n    return i*2;\n}\n```\n\n```\n public long PrintNumber(long l) \n{\n\
  \    return l*3;\n}\n```\n\n在同一个类中拥有这两个方法是合法的。但你可能会想，如果你写 `PrintNumber(3)`，调用的是哪个方法？\n\
  \n关键是要回第 2 章“语言基础”，数字字面量除非带有后缀 `L` 或 `l..`，否则会被翻译为 `int`。因此，`printNumber(3)` 将调用此方法：\n\
  \n```\n public int PrintNumber(int i)\n```\n\n要调用第二个方法，请传递一个 `long`：\n\n```\n printNumber(3L);\n\
  ```\n\n注意\n\n静态方法也可以重载。\n\n## 总结\n\n在本章中，你学习了如何使用 `new` 关键字在 C# 中创建对象，对象如何存储在内存中，类如何组织成命名空间，如何使用访问控制来实现封装，以及\
  \ C# 如何管理未使用的对象。此外，你还学习了方法重载和静态类成员。\n\n# 第 5 章\n\n# 核心类\n\n在讨论其他面向对象编程 (OOP) 特性之前，让我们检查几个\
  \ C# 中常用的重要类。这些类包含在 .NET Framework 带的类库中。掌握它们将有助于你理解后续 OOP 课程配套的示例。\n\n所有类中最突出的无疑是\
  \ `System.Object`。然而，如果不先介绍继承，很难讨论这个类，我将在第 6 章“继承”中介绍。因此，`System.Object` 在本章中仅简要讨论。现在我将关注你可以在程序使用的类，从\
  \ `System.String` 和 `System.Text.StringBuffer` 开始。然后，我将讨论数组和 `System.Console` 类。这些类以及\
  \ .NET Framework 类库中其他类型的完整文档可以在此处在线获取。\n\n```\n http://msdn.microsoft.com/en-us/library/gg145045\n\
  ```\n\n# System.Object\n\n`System.Object` 类表示一个 C# 对象。事实上，所有的类都是该类的直接或间接后代。由于你还没有学习继承（将在第\
  \ 6 章“继承”中提供），“后代”这个词对你来说可能没有意义。因此，我将简要讨论该类中的一些方法，并在第 6 章回到这个类。\n\n以下是 `Object`\
  \ 类中的一些方法。\n\n```\n public boolean Equals(Object obj)\n```\n\n将此对象与传入的对象进行比较。类必须实现此方法以提供比较其实例内容的方法。\n\
  \n```\n public Type GetType()\n```\n\n返回此对象的 `System.Type` 对象。有关 `Type` 类的更多信息，请参见本章后部分的“System.Type”章节。\n\
  \n```\n public virtual int GetHashCode()\n```\n\n返回此对象的哈希值。\n\n```\n public virtual\
  \ string ToString()\n```\n\n返回此对象的字符串描述。\n\n暂时不要担心某些方法签名中使用的 `virtual` 关键字。\n\n\
  # System.String\n\n我没有见过任何不使用 `System.String` 类的正式 C# 程序。它是经常使用的类之一，也绝对是最重要的类之一。\n\
  \n`String` 对象表示一个字符串，即一段文本。你也可以把 `String` 认为是一个 Unicode 字符序列。`String` 对象可以包含任意数量的字符。零字符的\
  \ `String` 被称为空字符串。`String` 对象是常量。一旦创建，它们的值就不能改变。正因如此，`String` 实例被认为是不可变的。\n\n你可以使用\
  \ `new` 关键字和 `String` 类构造函数之一来构造 `String` 对象，但这并不常见。大多数情况下，你只需将字符串字面量赋值给变量。\n\n\
  ```\n System.String s = \".NET is cool\";\n```\n\n这产生了一个包含“.NET is cool”的 `String`\
  \ 对象，并将其引用赋值给 `s`。\n\n创建 `String` 的更简单方法是使用 `string` 类型，它是 `String` 类的别名。上面的语句可以更简洁地重写为：\n\
  \n```\n string s = \".NET is cool\";\n```\n\n字符串可以包含转义序列字符（这些你在第 2 章“语言基础”中学过的），如下所示：\n\
  \n```\n string fileName = \"C:\\\\win.txt\";\n```\n\n`fileName` 将包含 C:\\win.txt\
  \ 的值，因为 `\\\\` 代表反斜杠字符。以下将引发错误，因为编译器不知道 `\\w` 是什么。\n\n```\n string wrongFileName\
  \ = \"C:\\win.txt\";\n```\n\n然而，你可以通过在字面量前加上 `@` 来强制编译器以不同的方式解析字符串字面量。例如，以下正确的，因为\
  \ `\\` 不被视为转义字符，而被视为普通字符。\n\n```\n String myFileName = @\"C:\\win.txt\";\n```\n\n\
  ## 字符串拼接\n\n你可以使用 `+` 运算符或 `String` 类的 `Concat` 方法拼接两个字符串。\n\n这是一个使用 `+` 运算符的示例。在执行以下语句后，`greeting`\
  \ 将包含“Aloha”。\n\n```\n string al = \"Al\";\nstring oha = \"oha\";\nstring greeting\
  \ = al + oha;\n```\n\n或者，你可以使用 `String` 类的 `Concat` 方法拼接两个字符串：\n\n```\n string al\
  \ = \"Al\";\nstring oha = \"oha\";\nstring greeting = String.Concat(al, oha);\n\
  ```\n\n注意，由于 `Concat` 是静态方法，你可以在无需创建 `String` 对象的情况下调用它。\n\n\n\n\n\n字符串比较是 C# 编程中最实用的操作之一。最简单的比较两个字符串的方法是使用\
  \ `==` 运算符。此外，你也可以使用 `Equals` 或 `CompareTo` 方法。如果你想测试两个字符串变量是否引用同一个实例，请使用 `Object.ReferenceEquals()`。\n\
  \n考虑以下代码。\n\n```\n string a = \".NET is cool\";\nstring b = \".NET is cool\";\n\
  ```\n\n在这里，`(a == b)` 结果为 true，因为 `a` 和 `b` 具有相同的内容。\n\nCLR 维护着字符串池。包含相同内容的字符串由同一个实例表示。以下代码打印\
  \ True，因为“C#” 一个实例。\n\n```\n string c = \"C#\";\nstring d = \"C#\";\nConsole.WriteLine(object.ReferenceEquals(c,\
  \ d));\n```\n\n然而，以下代码段返回 False，因为 “C” + “#” 返回了一个新的字符串实例：\n\n```\n object.ReferenceEquals(\"\
  C#\", \"C\" + \"#\");\n```\n\n## 字符串字面量\n由于你始终与 `String` 对象一起，因此理解处理字符串字面量的规则是非常重要的。\n\
  \n首先，字符串字面量以双引号 (`\"`) 开始和结束。其次，在结束双引号 `\"` 之前换行会导致编译错误。例如，这段代码将引发编译错误。\n\n```\n\
  \ string s2 = \"This is an important   \n        point to note\";\n```\n\n你可以通过加号连接两个字符串字面量来组合成长字符串字面量。\n\
  \n```\n string s1 = \"Strings \" + \"are important\";\nstring s2 = \"This is an\
  \ important \" +  \n        \"point to note\";\n```\n\n你可以将字符串与基本类型或其他对象拼接。例如，此行代码将一个\
  \ `String` 和一个整数拼接。\n\n```\n string s3 = \"String number \" + 3;\n```\n\n如果一个对象与字符串拼接，将调用前者的\
  \ `ToString` 方法，并将结果用于拼接。\n\n## 转义某些特定字符\n你有时需要在字符串中使用特殊字符，例如回车符 (CR) 和换行符 (LF)。在其他情况下，你可能希望在字符串中包含双引号字符。对于\
  \ CR 和 LF，无法输入这些字符，因为按回车键会换行。包含特殊字符的方法是对它们进行转义，即使用字符替换符。\n\n以下是一些转义序列：\n\n```\n\
  \ \\u          /* a Unicode character\n       \\b          /* \\u0008: backspace\
  \ BS */\n       \\t          /* \\u0009: horizontal tab HT */\n       \\n      \
  \    /* \\u000a: new line */\n       \\f          /* \\u000c: form feed FF */\n\
  \       \\r          /* \\u000d: carriage return CR */\n       \\\"          /*\
  \ \\u0022: double quote \" */\n       \\'          /* \\u0027: single quote ' */\n\
  \       \\\\          /* \\u005c: backslash \\ */\n```\n\n例如，以下代码在字符串末尾包含了 Unicode\
  \ 字符 0122。\n\n```\n string s = \"Please type this character \\u0122\";\n```\n\n\
  要获取一个值为 John \"The Great\" Monroe 的字符串，你需要转义双引号：\n\n```\n string s = \"John \\\"\
  The Great\\\" Monroe\";\n```\n\n## String 类的属性\n`String` 类提供了两个属性：`Length` 和 `Chars`。`Length`\
  \ 属性提供当前 `String` 对象中字符的数量。例如，以下行代码将 `stringLength` 变量设置为 5，因为 “Hello” 中的字符数五个。\n\
  \n```\n int stringLength = \"Hello\".Length;\n```\n\n`Chars` 属性返回指定索引处的 `Char` 对象。`Chars`\
  \ 属性的语法如下。\n\n```\n public char this[int index] { get; }\n```\n\n在这里，`index` 表示从\
  \ 0 开始的位置。因此，要获取字符串中的第一个字符，你传递 `0`。例如，在以下代码中 `greeting[0]` 返回 'W'。\n\n```\n String\
  \ greeting = \"Welcome\";\nchar firstChar = greeting[0];\n```\n\n因此，`Chars` 属性只接受\
  \ 0 到字符数减一的范围。如果你传递超出范围的数字，将得到 `IndexOutOfRangeException`。\n\n例如，以下代码使用 `Length`\
  \ 和 `Chars` 属性打印字符串中的单个字符。\n\n```\n string greeting2 = \"Hello\";\nfor (int i =\
  \ 0; i < greeting2.Length; i++)\n{\n    Console.WriteLine(greeting2[i]);\n}\n```\n\
  \n## String 类的方法\n`String` 类提供了操作 `String` 值的方法。然而，由于 `String` 对象是不可变的，操作的结果始终是一个新的\
  \ `String` 对象。\n\n这里是一些更有用的方法。\n\n```\n public static string Concat(string s1, string\
  \ s2)\n```\n\n拼接两个字符串。例如，`String.Concat(\"Hello\", \"World\")` 返回 “HelloWorld”。\n\
  \n```\n public bool Contains(string value)\n```\n\n指示当前字符串是否包含传入的值。例如，`\"Credit\
  \ card\".Contains(\"card\")` 返回 true。\n\n```\n public bool EndsWith(string suffix)\n\
  ```\n\n- 测试当前字符串是否以指定的后缀结尾。\n\n```\n public int IndexOf(String substring)\n```\n\
  \n返回指定子字符串首次出现的索引。如果没有找到匹配项，则返回 -1。例如，以下表达式返回 6。\n\n```\n \"C# is cool\".IndexOf(\"\
  cool\")\npublic IndexOf(String substring, int fromIndex)\n```\n\n返回从索引开始的指定子字符串首次出现的索引。如果未找到匹配项，则返回\
  \ -1。\n\n```\n public int LastIndexOf(String substring)\n```\n\n返回指定子字符串最后一次出现的索引。如果没有找到匹配项，则返回\
  \ -1。\n\n```\n public int LastIndexOf(String substring, int fromIndex)\n```\n\n\
  返回从索引开始的指定子字符串最后一次出现的索引。例如，以下表达式返回 7，它是最后一个 ‘c’ 的从 0 开始的位置。\n\n```\n \"credit card\"\
  .LastIndexOf(\"c\")\npublic Substring(int beginIndex)\n```\n\n返回从索引开始的当前字符串子字符串。例如，`\"\
  C# is cool\".Substring(6)` 返回 “cool”。\n\n```\n public string Substring(int beginIndex,\
  \ int length)\n```\n\n返回从索引开始的当前字符串子字符串。返回的字符串具有指定的长度。例如，`\"C# is cool\".Substring(3,\
  \ 2)` 返回 “is”。\n\n```\n public string Replace(char oldChar, char newChar)\n```\n\
  \n将当前字符串中所有的 `oldChar` 替换为 `newChar` 并返回新字符串。`\"dingdong\".Replace('d', 'k')` 返回\
  \ “kingkong”。\n\n```\n public string Replace(string oldValue, string newValue)\n\
  ```\n\n将当前字符串中所有的 `oldValue` 替换为 `newValue` 并返回新字符串。例如，`\"Spring\".Replace(\"Spr\"\
  , \"st\")` 返回 “sting”。\n\n```\n public static bool IsNullOrEmpty(string value)\n\
  ```\n\n如果指定的字符串为 null 或空，则返回 true。空字符串不包含任何字符。\n\n```\n public string[] Split(char[]\
  \ separator)\n```\n\n根据指定字符数组的分割当前字符串。例如，`\"big city mayors\".Split(\" \")` 返回一个包含三个字符串的数组。第一个数组元素是\
  \ “big”，第二个是 “city”，第三个是 “mayors”。\n\n```\n public bool StartsWith(String prefix)\n\
  ```\n\n测试当前字符串是否以指定的前缀开头。\n\n```\n public char[] ToCharArray()\n```\n\n将当前字符串作为字符数组返回。\n\
  \n```\n public string ToLower()\n```\n\n将当前字符串中的所有字符转换为小写。例如，`\"Coffee shop hero\"\
  .ToLower()` 返回 “coffee shop hero”。\n\n```\n public string ToUpper()\n```\n\n将当前字符串中的所有字符转换为大写。例如，`\"\
  temporary\".ToUpper()` 返回 “TEMPORARY”。\n\n```\n public string Trim()\n```\n\n修剪开头和结尾的空格并返回新字符串。例如，`\"\
  \ Venus \".Trim()` 返回 “Venus”。\n\n## System.Text.StringBuilder\n\n\n\n\n\n`String`\
  \ 对象是不可变的，如果你需要向其添加或插入字符，它不是一个好的选择。这是因为对 `String` 的字符串操作始终会创建一个新的 `String` 对象，因此开销昂贵。对于现代计算机来说，额外处理时间上的“成本”可能是可以忽略不计的。然而，避免此类操作是一种良好的编程习惯。对于追加和插入，你最好使用\
  \ `System.Text.StringBuilder` 类。\n\n要使用 `StringBuilder`，你首先要创建一个实例并指定一个容量（capacity），即它能够包含的字符数。当你向\
  \ `StringBuilder` 追加字符或字符串时，只要仍有足够的空间空间进行添加，系统就不会创建新实例。如果你超过了容量，系统会自动增加容量，但这是是有代价的。因此，你应该确保创建一个具有足够容量的\
  \ `StringBuilder`，但不要太大，因为每个预留的字符空间即使未使用也会占用内存空间。一旦完成了字符串操作，你可以将 `StringBuilder`\
  \ 转换为字符串。\n\n现在让我们来看如何创建 `StringBuilder` 并使用它的方法。\n\n## StringBuilder 类的构造函数\n\n\
  `StringBuilder` 类有五个构造函数。最简单的是无参数构造函数，它创建一个容量为 16 个字符的 `StringBuilder`。\n\n```cs\n\
  \ public StringBuilder()\n```\n\n第二个构造函数允许你指定容量：\n\n```cs\n public StringBuilder(int\
  \ capacity)\n```\n\n还有一个构造函数允许你设置最大容量。尝试添加多于最大容量的字符将导致抛出异常。\n\n```cs\n public StringBuilder(int\
  \ capacity, int maximumCapacity)\n```\n\n如果你愿意，可以使用第四个构造函数用字符串预先填充 `StringBuilder`。\n\
  \n```cs\n public StringBuilder(string value)\n```\n\n并且，你可以使用第五个构造函数指定一个初始字符串和初始容量：\n\
  \n```cs\n public StringBuilder(string value, int capacity)\n```\n\n最后，`StringBuilder`\
  \ 的最后一个构造函数允许你使用一个子字符串作为初始值。\n\n```cs\n public StringBuilder(string value, int startIndex,\
  \ int length, \n        int capacity)\n```\n\n例如，以下语句创建了一个以“World”为初始值的 `StringBuilder`：\n\
  \n```cs\n string s = \"Hello World\";\nStringBuilder builder = new StringBuilder(s,\
  \ 6, 5, 20);\n```\n\n在不指定最大容量的情况下创建的 `StringBuilder` 将具有非常大的容量（2GB）。\n\n## StringBuilder\
  \ 类的属性\n\n`StringBuilder` 类提供了四个属性：`Capacity`、`Chars`、`Length` 和 `MaximumCapacity`：\n\
  \n```cs\n public int Capacity { get; set; }\n```\n\n`StringBuilder` 的容量。\n\n```cs\n\
  \ public char this[int index] {get; set; }\n```\n\n获取或设置指定索引处的字符。例如，以下代码创建了一个 `StringBuilder`\
  \ 并更改了第一个和第五个字符。\n\n```cs\n StringBuilder builder4 = new StringBuilder(\"Kingkong\"\
  );\n     builder4[0] = 'P';\n     builder4[4] = 'p';\npublic int Length { get; set;\
  \ }\n```\n\n获取或设置此 `StringBuilder` 的长度。\n\n```cs\n public int MaxCapacity { get;\
  \ }\n```\n\n检索此 `StringBuilder` 的最大容量。\n\n## StringBuilder 类的方法\n\n毫无疑问，`StringBuilder`\
  \ 中最重要的方法是它的 `ToString` 方法，它将 `StringBuilder` 的内容作为字符串返回：\n\n```cs\n public override\
  \ string ToString()\n```\n\n如果没有这个方法，`StringBuilder` 类将几乎毫无用处，因为有无数方法接受字符串参数，但很少有方法接受\
  \ `StringBuilder`。\n\n`StringBuilder` 还定义了在 `StringBuilder` 实例中追加、插入和删除字符的方法。`Append`\
  \ 方法带有多个重载，使其能够追加字符串、字符、数字或其他数据类型。如果你追加一个整数，该整数在追加之前会被转换为 `char`。\n\n与 `Append`\
  \ 似的，`Insert` 方法也有多个重载，允许你向 `StringBuilder` 插入不同的数据类型。`Append` 和 `Insert` 之间的区别在于，`Append`\
  \ 始终在 `StringBuilder` 的末尾添加字符，而 `Insert` 允许你在任何位置添加字符。\n\n以下是 `Append` 和 `Insert`\
  \ 的一些重载。\n\n```cs\n public StringBuilder Append(string value)\npublic StringBuilder\
  \ Append(char value)\npublic StringBuilder Append(Object value)\npublic StringBuilder\
  \ Append(int value)\npublic StringBuilder Insert(int index, string value)\npublic\
  \ StringBuilder Insert(int index, char value)\npublic StringBuilder Insert(int index,\
  \ Object value)\npublic StringBuilder Insert(int index, int value)\n```\n\n除了 `Append`\
  \ 和 `Insert` 之外，`StringBuilder` 还提供了一个 `Remove` 方法来删除字符：\n\n```cs\n public StringBuilder\
  \ Remove(int startIndex, int length)\n```\n\n有趣的是，`Append`、`Insert` 和 `Remove` 都返回相同的\
  \ `StringBuilder`，因此这些方法可以链式调用：\n\n```cs\n StringBuilder sb = new StringBuilder(\"\
  Hi Hello\");\nsb.Append(\"World\").Insert(8, ' ').Remove(0, 3);\nConsole.WriteLine(sb.ToString());\
  \ // 输出 \"Hello World\"\n```\n\n## 数组\n\n在 C# 中，你可以使用数组将相同类型的基本类型或对象分组。属于数组的实体被称为数组的元素或成员。数组是派自\
  \ `System.Array` 的类的实例。因此，数组继承了 `System.Array` 类的所有字段、属性和方法。例如，你可以调用 `Length` 属性来获取数组的长度。`Length`\
  \ 字段是在 `System.Array` 中定义的。数组不是可调整大小的，空数组被称为空数组。\n\n数组是一个对象。因此，你可以像其他变量一样将其与 `null`\
  \ 进行比较。\n\n```cs\n String[] names;\nif (names == null)  // 结果为 true\n```\n\n注意\n\
  \n数组也可以包含其他数组，创建数组的语法如下：\n\n使用此语法来声明数组：\n\n```cs\n type[] arrayName;\n```\n\n例如，以下声明了一个名为\
  \ `numbers` 的 long 数组：\n\n```cs\n long[] numbers;\n```\n\n声明数组不会创建数组或为其组件分配空间，编译器只是创建一个对象引用。创建数组的一种方法是使用\
  \ `new` 关键字。你必须指定要创建的数组的大小：\n\n```cs\n new type[size]\n```\n\n例如，以下代码创建一个四个 int\
  \ 的数组：\n\n```cs\n new int[4]\n```\n\n或者，你可以在同一行内声明并创建数组。\n\n```cs\n int[] ints =\
  \ new int[4];\n```\n\n引用数组的组件，使用变量名后的索引。数组是从零开始的，这意味着数组的第一个元素索引为 0。要检索数组的元素，使用括号中的索引。例如，下面的代码创建一个四个\
  \ String 对象的数组并初始化其第一个成员。\n\n```cs\n string[] names = new string[4];\nnames[0] =\
  \ \"Hello World\";给 names 的第一个元素赋值\n```\n\n你也可以在不使用 `new` 关键字的情况下创建并初始化数组。例如，以下代码创建了三个\
  \ String 对象的数组。\n\n```cs\n String[] names = { \"John\", \"Mary\", \"Paul\" };\n\
  ```\n\n以下代码创建一个四个 int 的数组，并将数组赋值给变量 `matrix`。\n\n```cs\n int[] matrix = { 1, 2,\
  \ 3, 10 };\n```\n\n在向方法传递数组时要小心，因为下面的代码是非合法的，尽管下方的 `average` 方法接收 int 数组。\n\n```cs\n\
  \ int avg = average( { 1, 2, 3, 10 } ); // 非法\n```\n\n相反，你必须单独实例化数组。\n\n```cs\n\
  \ int[] numbers = { 1, 2, 3, 10 };\nint avg = average(numbers);\n```\n\n或者这个\n\n\
  ```cs\n int avg = average(new int[] { 1, 2, 3, 10 });\n```\n\n\n\n\n引用范围外的元素将抛出运行时错误。例如，以下代码将引发错误，因为它尝试访问一个包含两个元素的数组的第五个元素：\n\
  \n```\n int[] numbers = { 1, 3 };\nint x = numbers[4];\n```\n\n## 注意\n当创建数组时，其元素要么为\
  \ `null`（如果元素类型是对象类型），要么为元素类型的默认值（如果数组包含原始类型）。例如，`ints` 数组默认包含 0。\n\n## 遍历数组\n\n\
  遍历数组有两种方法：使用 `foreach` 和 `for`。前者的格式更简短：\n\n```\n foreach (elementType element in\
  \ arrayName)\n{\n    // 在此处访问元素\n}\n```\n\n例如，以下代码段打印了 `employees` 中的元素。\n\n```\n\
  \ string[] employees = { \"John\", \"Paul\", \"George\", \"Ringo\" };\nforeach (string\
  \ employee in employees)\n{\n    Console.WriteLine(\"Employee:\" + employee); //\
  \ 打印员工\n}\n```\n\n结果如下。\n\n```\n Employee:John\nEmployee:Paul\nEmployee:George\n\
  Employee:Ringo\n```\n\n第二种方法是使用 `for` 循环并通过索引访问每个元素：\n\n```\n string[] employees\
  \ = { \"John\", \"Paul\", \"George\", \"Ringo\" };\nfor (int i = 0; i < employees.Length;\
  \ i++)\n{\n    Console.WriteLine(\"Employee(\" + (i + 1) + \"): \" + employees[i]);\n\
  }\n```\n\n这里是结果。\n\n```\n Employee(1):John\nEmployee(2):Paul\nEmployee(3):George\n\
  Employee(4):Ringo\n```\n\n可以看出，尽管 `foreach` 更简单，但如果索引对你很重要，有时你会求助于 `for` 循环。\n\n\
  ## 更改数组大小\n\n一旦创建数组，其大小就无法更改。如果你想更改大小，必须创建一个新数组并使用旧数组的值来填充它。例如，以下代码将包含三个 `ints`\
  \ 的数组 `numbers` 的大小增加到 4。\n\n```\n int[] numbers = { 1, 2, 3 };\nint[] temp = new\
  \ int[4];\nfor (int j = 0; j < numbers.Length; j++) \n{\n    temp[j] = numbers[j];\n\
  }\nnumbers2 = temp;\n```\n\n或者，你可以使用 `System.Array` 的静态方法 `Resize`：\n\n```\n Array.Resize(ref\
  \ arrayName, newSize)\n```\n\n作为一个示例，以下代码将 `numbers` 的大小更改为 5。\n\n```\n int[] numbers\
  \ = { 2, 3, 4 };\nArray.Resize(ref numbers, 5);\nConsole.WriteLine(\"Length of numbers:\"\
  \ + numbers.Length);\n```\n\n## 将字符串数组传递给 Main\n\n你可以将字符串数组传递给 `Main` 方法以为程序提供值。在这种情况下，`Main`\
  \ 方法的如下：\n\n```\n public static void Main(string[] args)\n```\n\n列表 5.1 显示了一个遍历\
  \ `Main` 方法 `String` 数组参数的类。\n\n列表 5.1：访问 `Main` 方法的参数\n\n```\n public class MainMethodTest\
  \ \n{\n    public static void Main(string[] args) {\n        foreach (string arg\
  \ in args) {\n            Console.WriteLine(arg);\n        }\n    }\n}\n```\n\n\
  ## System.Console\n\n`System.Console` 类暴露了有用的静态字段和静态方法来操作控制台。以下是 `System.Console`\
  \ 中一些重要的方法。\n\n```\n public static void Beep()\n```\n\n播放蜂鸣声。\n\n```\n public static\
  \ void Clear()\n```\n\n清除控制台缓冲区和控制台窗口。\n\n```\n public static ConsoleKeyInfo ReadKey()\n\
  ```\n\n获取用户按下的下一个按键的信息并在控制台窗口中显示它。\n\n```\n public static string ReadLine()\n```\n\
  \n从输入流中返回下一行字符。\n\n```\n public static void Write(string s)\n```\n\n将字符串参数写入控制台。还有其他\
  \ `Write` 重载版本，因此你可以将任何类型传递给 `Write`。\n\n```\n public static void WriteLine(string\
  \ s)\n```\n\n将字符串参数加上换行符写入控制台。\n\n## 总结\n\n在本章中，你检查了几个重要的类，如 `System.Object`、`System.String`、`System.Text.StringBuilder`、`System.Array`\
  \ 和 `System.Console`。这些是 C# 中最常用的类。你将在后续章节中学习更多的类。\n\n# 第 6 章：继承\n\n继承是一项非常重要的面向对象编程\
  \ (OOP) 特性。它使得任何 OOP 语言中的代码具有扩展性。扩展类也称为继承或子类化。在 C# 中，默认所有类都是可扩展的，但你可以使用 `sealed`\
  \ 关键字防止类被子类化。本章将解释 C# 中的继承。\n\n# 继承概述\n\n你通过创建一个新类来扩展一个类。前者和后者将具有父子关系。原始类是父类、基类或超类。新类是父类的子类、子类或派生类。在\
  \ OOP 中扩展类的过程被称为继承。在子类中，你可以添加新方法、新字段和新属性，还可以覆盖现有方法以更改它们的行为。\n\n图 6.1 展示了一个 UML 类图，描述了类与子类之间的父子关系。\n\
  \n![](img/00018.gif)\n\n图 6.1：父类和子类的 UML 类图\n\n注意，带箭头的线用于表示泛化，例如父子关系。\n\n子类反过来也可以被扩展，除非你专门通过声明为\
  \ `sealed` 来使其变得不可扩展。密封类将在本章后面的“密封类”部分进行讨论。\n\n继承的好处是显而易见的。继承让你有机会添加原始类中不存在的功能。它还给了你更改现有类行为以更好地适应你机会。\n\
  \n# 扩展类\n\n你通过在类声明中使用冒号、在类名之后和父类之前来扩展类。列表 6.1 展示了一个名为 `Parent` 的类，列表 6.2 展示了一个扩展\
  \ `Parent` 的 `Child` 类。\n\n列表 6.1：Parent 类\n\n```\n public class Parent \n{\n\n\
  }\n```\n\n列表 6.2：Child 类\n\n```\n public class Child : Parent\n{\n\n}\n```\n\n扩展类就是如此简单。\n\
  \n## 注意\nC# 中的所有类都自动扩展 `System.Object` 类。`Object` 是 .NET 中的最终超类。列表 6.1 中的 `Parent`\
  \ 默认是 `Object` 的子类。\n\n## 注意\n在 C# 中，一个类只能扩展另一个类。这与允许多重继承的 C++ 不同。然而，多重继承的概念可以通过接口来实现，正如第\
  \ 10 章“接口和抽象类”所讨论的。\n\n## is-a 关系\n\n当你通过继承创建一个新类时，会形成一种特殊的关系。子类和超类具有“is-a”关系。\n\
  \n例如，`Animal` 是一个代表动物的类。有很多类型的动物，包括鸟、鱼和狗，因此你可以创建 `Animal` 的子类来表示特定类型的动物。图 6.2 展示了带有三个子类的\
  \ `Animal` 类：`Bird`、`Fish` 和 `Dog`。\n\n![](img/00019.gif)\n\n图 6.2：继承示例\n\n子类与超类\
  \ `Animal` 之间的 is-a 关系非常明显。鸟“是一种”动物，狗是动物，鱼也是动物。子类是其超类的特殊类型。例如，鸟是动物的一种特殊类型。然而，is-a\
  \ 关系并不反过来。动物不一定是鸟或狗。\n\n列表 6.3 展示了 `Animal` 类及其子类。\n\n列表 6.3：Animal 及其子类\n\n```\n\
  \ class Animal \n{\n    public float Weight;\n    public void Eat() \n    {\n  \
  \  }\n}\n```\n\n```\n class Bird : Animal {\n    public int NumberOfWings = 2;\n\
  \    public void Fly() \n    {\n    }\n}\n```\n\n```\n class Fish : Animal {\n \
  \   public int NumberOfFins = 2;\n    public void Swim()\n    {\n    }\n}\n```\n\
  \n```\n class Dog : Animal {\n    public int NumberOfLegs = 4;\n    public void\
  \ Walk() \n    {\n    }\n}\n```\n\n在这个示例中，`Animal` 类定义了一个适用于所有动物的 `Weight` 字段。它还声明了一个\
  \ `Eat` 方法，因为动物需要进食。\n\n\n\n\n\n`Bird` 类是一种特殊的 `Animal` 类型，它继承了 `Eat` 方法和 `Weight`\
  \ 字段。`Bird` 还增加了一个 `NumberOfWings` 字段和一个 `Fly` 方法。这表明，更具体的 `Bird` 类扩展了更通用的 `Animal`\
  \ 类的功能和行为。\n\n子类继承其父类中的所有公共方法和字段。例如，你可以创建一个 `Dog` 对象并调用它的 `Eat` 方法：\n\n```\n Dog\
  \ dog = new Dog();\ndog.Eat();\n```\n\n`Eat` 方法声明在 `Animal` 类中；`Dog` 类只是简单地继承了它。\n\
  \n“is-a”（是一个是）关系的一个结果是，将子类的实例赋值给父类类型的引用变量是合法的。例如，以下代码是有效的，因为 `Bird` 是 `Animal` 的子类，而\
  \ `Bird` 始终是一个 `Animal`。\n\n```\n Animal animal = new Bird();\n```\n\n然而，以下代码是非法的，因为无法保证一个\
  \ `Animal` 一定是 `Dog`。\n\n```\n Dog dog = new Animal();\n```\n\n# 访问访问性\n\n在子类内部，你可以访问其父类的公共和受保护成员（如方法和字段），但不能访问父类的私有成员。如果子类和父类位于同一个程序集中，你还可以访问父类的内部成员。\n\
  \n考虑列表 6.4 中的 `P` 和 `C` 类。\n\n列表 6.4：显示访问性\n\n```\n public class P \n{\n    public\
  \ void PublicMethod() \n    {\n    }\n\n    protected void ProtectedMethod() \n\
  \    {\n    }\n\n    internal void InternalMethod() \n    {\n    }\n}\n\nclass C\
  \ : P \n{\n    public void TestMethods() \n    {\n        PublicMethod();\n    \
  \    ProtectedMethod();\n        InternalMethod();\n    }\n}\n```\n\n`P` 有三个方法：一个公共、一个受保护、一个具有内部访问级别。`C`\
  \ 是 `P` 的子类。正如你在 `C` 类的 `TestMethods` 方法所示，`C` 可以访问父类的公共和受保护方法。此外，由于 `C` 和 `P` 在同一个程序集中，`C`\
  \ 还可以访问 `P` 的内部方法。\n\n## 方法重写\n\n当你扩展一个类时，你可以更改父类中方法的行为。这被称为方法重写，当你在子类中编写与父类中方法具有相同签名的方法时就会发生这种情况。如果名称相同但参数列表不同，那就是方法重载。方法重载在第\
  \ 4 章“对象与类”中解释过。\n\n你通过重写方法来更改其行为。要重写方法，你需要在子类中编写新方法。你可以重写父类的公共和受保护方法。如果子类和父类位于同一个程序集中，你还可以重写内部访问级别的方法。\n\
  \n列表 6.5 中的 `Shape` 和 `Oval` 类演示了方法重写的示例。\n\n列表 6.5：Shape 和 Oval 类\n\n```\n using\
  \ System;\nclass Shape\n{\n    public void WhatAmI()\n    {\n        Console.WriteLine(\"\
  I am a shape\");\n    }\n}\n\nclass Oval : Shape\n{\n    new public void WhatAmI()\n\
  \    {\n        Console.WriteLine(\"I am an oval\");\n    }\n}\n```\n\n`Oval` 类扩展了\
  \ `Shape` 并重写了 `WhatAmI` 方法。在子类中使用 `new` 关键字是为了表示程序员意识到父类中的 `WhatAmI` 方法被重写了。如果没有\
  \ `new` 关键字，程序仍然可以编译，但会带有警告。\n\n你可以使用以下代码测试列表 6.5 中的方法重写。\n\n```\n Oval oval = new\
  \ Oval();\noval.WhatAmI(); // 打印 \"I am an oval\"\n```\n\n正如你所见，`oval.WhatAmI` 调用了\
  \ `Oval` 类中的方法。\n\n现在猜猜，这段代码的输出是什么？\n\n```\n Shape shape = new Oval();\nshape.WhatAmI();\n\
  ```\n\n在 C# 中，将子类实例赋值给其对象变量是合法的，因为毕竟椭圆是一个形状。然而，输出可能会让你感到。它是：\n\n```\n I am a shape\n\
  ```\n\n在 C# 中，使用引用变量调用方法会调用该类型中定义的方法，无论引用变量所引的对象类型是什么。\n\n## 调用基类构造函数\n\n子类就像普通类一样，你使用\
  \ `new` 关键字来创建它的实例。如果你没有在子类中显式编写构造函数，编译器将隐式添加一个无参数（no-arg）构造函数。\n\n当你通过调用其构造函数之一实例化子类时，构造函数执行的第一件事是调用直接父类的默认构造函数（不带参数的构造函数）。在父类中，构造函数也会调用其直接父类的构造函数。这个过程不断重复，直到达到\
  \ `System.Object` 类的构造函数。也就是说，当你创建一个子对象时，它所有的父类也都被实例化。\n\n列表 6.6 中的 `Employee` 和\
  \ `Manager` 类说明了这一过程。\n\n列表 6.6：调用基类的默认构造函数\n\n```\n using System;\nclass Employee\n\
  {\n    public Employee()\n    {\n        Console.WriteLine(\"Employee()\");\n  \
  \  }\n    public Employee(string name)\n    {\n        Console.WriteLine(\"Employee()\
  \ \" + name);\n    }\n}\n\nclass Manager : Employee\n{\n    public Manager(string\
  \ name)\n    {\n        Console.WriteLine(\"Manager() \" + name);\n    }\n}\n```\n\
  \n如果你像下面的代码一样实例化 `Manager` 类\n\n```\n Manager manager = new Manager(\"Jeff\");\n\
  ```\n\n你将在控制台中看到这些：\n\n```\n Employee\nManager() Jeff\n```\n\n这证明了即使有另一个具有相同参数集的构造函数，`Employee`\
  \ 类构造函数执行的第一件事也是调用 `Employee` 类的默认构造函数。\n\n在创建子类实例时调用基类中的非默认构造函数，你可以使用 `base` 关键字。例如，将\
  \ `Manager` 中的构造函数更改如下所示，以调用 `Employee` 中的第二个构造函数：\n\n```\n public Manager(string\
  \ name) : base(name)\n    {\n        Console.WriteLine(\"Manager() \" + name);\n\
  \    }\n```\n\n注意，子类从自己的构造函数调用父类的构造函数是有意义的，因为子类的实例始终伴随着每个父类的实例。这样，对子类中未重写的方法调用将传递给其父类，直到在层次结构中找到第一个。\n\
  \n## 调用基类的隐藏成员\n\n`base` 关键字在生命中还有用途。它可以用于调用基类中的隐藏成员或重写的方法。由于 `base` 代表直接父类的实例，`base.memberName`\
  \ 返回父类中指定的成员。你可以访问基类中从子类可见的任何成员。例如，列表 6.8 显示了两个具有父子关系的类：`Tool` 和 `Pencil`。\n\n列表\
  \ 6.8：使用 base 访问隐藏成员\n\n```\n using System;\npublic class Tool\n{\n    public string\
  \ Identify() \n    {\n        return \"Generic tool\";\n    }\n}\n\npublic class\
  \ Pencil : Tool {\n    new public string Identify()\n    {\n        return \"Pencil\"\
  ;\n    }\n\n    public void Write() \n    {\n        Console.WriteLine(base.Identify());\n\
  \        Console.WriteLine(Identify());\n    }\n}\n```\n\n`Pencil` 类重写了 `Tool` 中的\
  \ `Identify` 方法。如果你实例化 `Pencil` 类并调用它的 `Write` 方法，你将在控制台上看到以下内容：\n\n```\n Generic\
  \ tool\nPencil\n```\n\n## 类型转换\n\n你可以将对象转换为另一种类型。规则是，你只能将子类的实例转换为其父类。将对象转换为父类被称为向上转型（upcasting）。这里有一个示例，假设\
  \ `Child` 是 `Parent` 的子类。\n\n```\n Child child = new Child();\nParent parent = child;\n\
  ```\n\n要向上转换 `Child` 对象，你只需要将对象赋值给类型为 `Parent` 的引用变量。注意，父类引用变量无法访问仅 `Child` 可用的成员。\n\
  \n\n\n\n由于上述代码段中的 `parent` 引用了一个类型为 `Child`的对象，你可以将其强制转换回 `Child`。这次被称为向下强制转换（downcasting），因为你正在将一个对象按照继承层次结构向下转换为某个类。向下强制转换要求你在括号中编写子类型。例如：\n\
  \n```\n Child child = new Child();\nParent parent = child;// parent 指向 Child 的实例\n\
  Child child2 = (Child) parent; // 向下强制转换\n```\n\n只有当父类引用已经指向子类的实例时，才允许向子类进行向下强制转换。以下代码将产生编译错误。\n\
  \n```\n Object parent = new Object();\nChild child = (Child) parent; // 非法向下强制转换，编译错误\n\
  ```\n\n## 密封类 (Sealed Classes)\n\n你可以通过在类声明中使用 `sealed` 关键字将你的类标记为密封，从而防止他人扩展你的类。`sealed`\
  \ 可以出现在访问修饰符之后或之前。例如：\n\n```\n public final class Pencil \nfinal public class Pen\n\
  ```\n\n第一种更为常见。\n\n尽管将类设为密封会让你的代码运行稍快，但这种差异微小到难以察觉。设计考虑而非速度，才是你将类设为 final 的原因。例如，`System.String`\
  \ 类就是密封的，因为该类的设计者不希望你改变 `String` 类的行为。\n\n## is 关键字\n\n`is` 关键字可以测试对象是否属于指定的类型。它通常用于\
  \ `if` 语句，其语法如下：\n\n```\n if (objectReference is type)\n```\n\n其中 `objectReference`\
  \ 引用正在被检查的对象。例如，以下 `if` 语句返回 true。\n\n```\n String s = \"Hello\";\nif (s is System.String)\n\
  ```\n\n然而，对 `null` 引用变量应用 `is` 会返回 false。例如，以下 `if` 语句返回 false。\n\n```\n String\
  \ s = null;\nif (s is System.String)\n```\n\n此外，由于子类“是（is）其基类的一种类型，当 `Child` 是 `Parent`\
  \ 的子类时，以下 `if` 语句返回 true。\n\n```\n Child child = new Child();\nif (child is Parent)\
  \    // 结果为 true\n```\n\n## 总结 (Summary)\n\n继承是面向对象编程的基本原理之一。继承使得代码具有可扩展性。在 C# 中，所有类默认继承自\
  \ `System.Object` 类。要扩展一个类，使用冒号。方法重写是另一个与继承直接相关的 OOP 特性。它允许你更改父类成员的行为。你可以通过将类设为密封来防止你的类被子类。\n\
  \n第 7 章\n\n# 结构 (Structures)\n\n在引言中你学习了 .NET 类型由类、结构、枚举、接口和委托组成。在第 4 章“对象与类”中讨论了类，你现在应该熟悉它们了。\n\
  \n第二种类型是结构，或简单的 `structs`，它们类似于类，可以拥有字段和方法等成员。然而，与类不同，结构是值类型，不能继承也不能被继承。.NET Framework\
  \ 类库提供了许多结构。例如，`System` 命名空间定义了重要的结构，如 `Byte`、`Char`、`Int32` 和 `DateTime`，它们代表重要的数据类型。\n\
  \n本章解释了什么是结构并展示了一些示例。\n\n## 结构概述 (An Overview of Structures)\n\n结构有时被称为轻量级类，和类一样，它可以拥有字段和方法等成员，并且你可以使用\
  \ `new` 创建结构的实例。然而，结构是值类型，而类是引用类型。值类型分配在栈上或内联中，并在离开作用域时释放。另一方面，引用类型分配在堆上，未使用的引用类型实例会被垃圾回收。值类型的创建成本通常更低，但如果它们涉及大量的装箱（boxing）和拆箱（unboxing），其性能会低于引用类型。所有结构都隐式地派自\
  \ `System.ValueType`。\n\n与类不同，结构不能有子类。换句话说，结构不支持继承。\n\n## .NET 结构 (.NET Structures)\n\
  \n.NET Framework 带有许多结构。C# 中的所有原始类型（如 `int` 和 `char`）都是定义在 `System` 命名空间中的结构的别名。例如，当你在\
  \ C# 代码中声明一个 `int`，就会创建一个 `System.Int32` 的实例。每当你使用一个 `char`，就会有一个 `System.Char`\
  \ 实例在支持它。因此，你可以像下面的代码段所示，在你的原始类型上调用对应结构的成员。\n\n```\n int a = 123;\nSystem.Console.WriteLine(a.GetType());\
  \ // 输出 System.Int32\n```\n\n结构与类之间的另一个区别是，两个变量无法指向同一个结构实例。将结构赋值给新变量会创建结构的新实例。在列表\
  \ 7.1 中，表示复数的 `System.Numerics.Complex` 结构被证明了这一点。\n\n请注意，`System.Numerics` 命名空间可以在\
  \ `System.Numerics.dll` 程序集中找到，要使用它的成员，你首先需要向项目中添加该程序集的引用。请查看侧边栏关于如何向项目添加程序集的说明。\n\
  \n## 向项目添加引用 (Adding A Reference To A Project)\n\n在 Visual Studio 或类似的 IDE 中创建项目时，默认会包含几个程序集。你不需要执行任何操作即可使用程序集中的类型。如果你想使用不在默认程序集中的类型，需要按照以下步骤在项目中引用该程序集：\n\
  \n1. 在“解决方案管理器”中，选择你想要添加引用的项目。\n2. 在“项目”菜单中，选择“添加引用”。\n3. 在“添加引用”对话框中，选择你想要引用的类型。\n\
  4. 在顶部窗格中，选择程序集并点击“确定”。\n\n列表 7.1：复制结构 (Copying structure)\n\n```\n using System;\n\
  using System.Numerics;\n\nclass Numerics\n{\n    public void Test()\n    {\n   \
  \     Complex c1 = new Complex(2, 3);\n        // 创建 c1 的新副本\n        Complex c2\
  \ = c1;\n        c2 *= c2; // 不影响 c1\n        Console.WriteLine(c1); // 输出 (2,3)\n\
  \        Console.WriteLine(c2); // 输出 (-5,12)\n    }\n}\n```\n\n运行 `Test()`，你将在控制台看到：\n\
  \n```\n (2,3)\n(-5,12)\n```\n\n这证明了 `c1` 和 `c2` 是不同的对象，因为当你将 `c1` 赋值给 `c2` 时，创建了一个副本。因此，操作\
  \ `c2` 不影响 `c1`，反之亦然。\n\n## 编写结构 (Writing a Structure)\n\n下节将展示如何编写自定义结构。你使用 `struct`\
  \ 关键字后跟结构名称来创建结构。列表 7.2 显示了名为 `Point` 的自定义结构代码。该结构有两个字段（`X` 和 `Y`）以及两个方法 `Move`\
  \ 和 `Print`。\n\n列表 7.2：自定义结构 (A custom structure)\n\n```\n struct Point\n{\n   \
  \ public int X;\n    public int Y;\n\n    public void Move(int x, int y)\n    {\n\
  \        X += x;\n        Y += y;\n    }\n\n    public void Print()\n    {\n   \
  \     System.Console.WriteLine(\"(\" + X + \", \" + Y + \")\");\n    }\n}\n```\n\
  \n可以使用以下代码测试 `Point` 结构。\n\n```\n Point point1 = new Point();\npoint1.Print();//\
  \ 输出 (0, 0)\npoint1.X = 10;\npoint1.Y = 20;\npoint1.Move(4, 5);\npoint1.Print();\
  \ // 输出 (14, 25)\n```\n\n## 空类型 (Nullable Types)\n\n引用类型和值类型之间的另一个巨大区别是，引用类型可以为\
  \ `null`，而值类型不能。因此，在 C# 中将类变量声明为 `null` 是有效的：\n\n```\n string name = null;\n```\n\
  \n然而，将 `null` 赋值给结构变量会引发编译错误。例如，`System.DateTime` 是一个结构，以下代码将无法编译，因为向结构赋值 `null`\
  \ 是非法的。\n\n```\n System.DateTime today = null;\n```\n\n\n\n无法将 `null` 赋值给值类型通常会令人头疼，特别是在处理关系型数据库时，因为表列可以是\
  \ `null`（意味着它不包含数据）。当从数据库检索日期并将其赋值给 `System.DateTime` 时，如果数据库日期可能为 `null`，就会出现问题。为了解决这个问题，.NET\
  \ Framework 提供了 `System.Nullable` 结构，使得任何结构都可以变为可空。这种解决方案的妙之处在于，你不需要直接处理 `System.Nullable`。要使结构体变为可空，只需在类型名称后加上一个问号即可：\n\
  \n```\n int? x = null; // x 是可空的\n```\n\n## 总结\n\n在本章中，你学习了结构体以及它们与类的区别。你还学习了值类型和引用类型之间的区别，并编写了一个自定义结构体。\n\
  \n# 第 8 章：错误处理\n\n错误处理是任何编程语言中的重要特性。良好的错误处理机制可以帮助程序员更容易编写健壮的应用程序，并防止 bug 的产生。在某些语言中，程序员被迫使用多个\
  \ `if` 语句来检测所有可能导致错误的条件。这可能导致代码变得异常复杂。在较大的程序中，这种做法很容易导致像“意大利面”一样的代码。\n\nC# 提供了结构化异常处理，提供了一种处理错误的良好方法。通过这种策略，可能导致错误的代码部分被隔离在一个代码块中。如果发生错误，该错误将被捕获并在本地进行解决。本章将解释\
  \ C# 的结构化错误处理。\n\n# 异常异常\n\n你可以使用 `try` 语句隔离可能导致运行时错误的代码，它通常配合 `catch` 和 `finally`\
  \ 语句使用。这种隔离通常发生在方法体中。如果遇到错误，公共语言运行时 (`CLR`) 会停止处理 `try` 块并跳转到 `catch` 块。在这里，你可以优雅地处理错误，或者通过“抛出”\
  \ `System.Exception` 对象来通知用户。另一种情况是将异常或一个新的 `Exception` 对象重新抛出给调用该方法的代码。此时，如何处理该错误将取决于调用者。如果抛出的异常没有被捕获，应用程序将突然停止。\n\
  \n这是 `try` 语句的语法：\n\n```\n try \n{\n    [可能抛出异常的代码]\n} \n[catch (ExceptionType-1\
  \ [e]) \n{\n    [当抛出 ExceptionType-1 时执行的代码]\n}] \n[catch (ExceptionType-2 [e])\
  \ \n{\n    [当抛出 ExceptionType-2 时执行的代码]\n}]\n  ... \n[catch (ExceptionType-n [e])\
  \ \n{\n    [当抛出 ExceptionType-n 时执行的代码]\n}]\n[finally \n{\n    [无论是否抛出异常，都会运行的代码]]\n\
  }]\n```\n\n错误处理的步骤可以总结如下：\n\n1. 在 `try` 块中隔离可能导致错误的代码。\n2. 对于每个单独的 `catch` 块，编写在\
  \ `try` 块中发生该特定类型异常时要执行的代码。\n3. 在 `finally` 块中，编写无论是否发生错误都会运行的代码。\n\n注意，`catch`\
  \ 和 `finally` 块是可选的，但必须存在其中一个。因此，你可以拥有带有一个或多个 `catch` 块的 `try`，或者带有 `finally` 的\
  \ `try`，亦或是带有 `catch` 和 `finally` 的 `try`。\n\n之前的语法显示你可以有多个 `catch` 块。这是因为某些代码可能会抛出不同类型的异常。当异常从\
  \ `try` 块抛出时，控制将传递给第一个 `catch` 块。如果抛出的异常类型与第一个 `catch` 块中的异常匹配或是其子类，则执行 `catch`\
  \ 块中的代码，然后控制将进入 `finally` 块（如果存在）。\n\n如果抛出的异常类型与第一个 `catch` 块中的异常类型不匹配，`CLR` 将进入下一个\
  \ `catch` 块并执行相同的操作，直到找到匹配项。如果没有找到匹配项，异常对象将抛出给方法调用者。如果调用者没有将调用该方法的错误代码放在 `try` 块中，程序将崩溃。\n\
  \n为了说明这种错误处理的使用，请考虑列表 8.1 中的 `NumberDoubler` 类。当运行该类时，它会提示你输入。你可以输入任何内容，包括非数字内容。如果你的输入成功转换为数字，它将将其翻倍并打印结果。如果你的输入无效，程序将打印“Invalid\
  \ input”（无效输入）消息。\n\n列表 8.1：NumberDoubler 类\n\n```\n using System;\n\nclass NumberDoubler\n\
  {\n    public void Test()\n    {\n        Console.WriteLine(\"Please type a number\"\
  \n            + \" between 0 and 255 that you want to double\");\n        string\
  \ input = Console.ReadLine();\n        try \n        {\n            Byte number\
  \ = Byte.Parse(input);\n            Console.WriteLine(\"Result: {0}\", 2 * number);\n\
  \        } \n        catch (FormatException e) {\n            Console.WriteLine(\"\
  Invalid input.\");\n            Console.WriteLine(e.StackTrace);\n        }\n  \
  \      catch (OverflowException)\n        {\n            Console.WriteLine(\"The\
  \ number you entered exceeded\"\n                    \"capacity\");\n        }\n\
  \    }\n}\n```\n\n`NumberDoubler` 类使用 `System.Console` 类来获取用户输入。\n\n```\n string\
  \ input = Console.ReadLine();\n```\n\n然后它使用 `System.Byte` 结构的静态 `Parse` 方法将字符串输入转换为字节。如果你查看文档，该方法可能会抛出以下异常之一：\n\
  \n* `ArgumentNullException`，如果字符串输入为 `null`。\n* `FormatException`，如果字符串输入不是数字。\n\
  * `OverflowException`，如果字符串输入小于 0 或大于 255。\n\n`NumberDoubler` 类中的 `Test` 方法没有尝试捕获\
  \ `ArgumentNullException`，因为 `Console.ReadLine()` 的输出永远不会是 `null`。此外注意第二个 `catch`\
  \ 块没有为 `OverflowException` 定义变量，因为块中的代码没有使用它。\n\n要测试 `NumberDoubler` 类，请编写并运行此代码。\n\
  \n```\n new NumberDoubler().Test();\n```\n\n你将在控制台上看到这些：\n\n```\n Please type a\
  \ number between 0 and 255 that you want to double\n```\n\n如果你输入 0 到 255 之间的数字，你将看到你的数字翻倍。然而，如果你输入非数字（如“abcd”），`Parse`\
  \ 方法将抛出 `FormatException`，你将看到错误消息，以及随其后的告知错误原因的堆栈跟踪。\n\n```\n Invalid input.\n\
  \   at System.Number.StringToNumber(String str, NumberStyles options, \n       NumberBuffer&\
  \ number, NumberFormatInfo info, Boolean parseDecimal)\n   at System.Number.ParseInt32(String\
  \ s, NumberStyles style, NumberFormatInfo info)\n   at System.Byte.Parse(String\
  \ s, NumberStyles style, NumberFormatInfo info)\n   at System.Byte.Parse(String\
  \ s)\n   at NumberDoubler.Test() in C:\\App08\\NumberDoubler.cs:line 12 \n```\n\n\
  ## 没有 catch 的 try 和 using 语句\n\n`try` 语句配合 `finally` 使用而不带 `catch` 块。你通常使用这种语法来确保无论\
  \ `try` 块中的代码是否成功完成，某些代码都会执行。例如，在打开数据库连接后，你希望在使用完成后调用其 `Close` 方法。为了说明这种场景，考虑以下打开数据库连接的伪代码。\n\
  \n```\n Connection connection = null;\ntry \n{\n    // 打开连接\n    // 使用连接进行操作并执行其他任务\n\
  \n} \nfinally {\n    if (connection != null) \n    {\n        // 关闭连接\n        connection.Close();\n\
  \    }\n}\n```\n\n如果 `try` 块中发生意外并抛出异常，`Close` 方法始终会被调用以释放资源。\n\n\n\n\n在 C# 中，`using`\
  \ 语句（不要与用于导入命名空间的 `using` 指令混淆）可以被作一种方便的语法，以确保访问未托管资源的托管类型在使用后通过调用这些托管类型的 `Dispose`\
  \ 方法来释放资源。访问未托管资源的托管类型示例包括 `File` 和 `Font`。例如，在创建文件时，`System.IO.File` 类还会创建一个流对象，允许你从文件中读取或向文件中写入。当你不再需要该文件时，必须对相应的流进行适当释放。使用\
  \ `using` 语句允许你写出如下所示非常短的代码：\n\n```\n using (FileStream fs = File.Create(fileName))\n\
  {\n    // 在处对 FileStream 进行某些操作\n}\n```\n\n另一种方法是使用类似这样的 `try` 和 `finally` 块：\n\n\
  ```\n FileStream fileStream = null;\ntry\n{\n    fileStream = File.Create(\"C:/temp.txt\"\
  );\n    // 在处对 fileStream 进行某些操作\n}\nfinally\n{\n    // 在处释放 fileStream。\n}\n```\n\
  \n你将在第 15 章“输入/输出”以及其他章节看到更多关于使用 `using` 语句的示例。\n\n## System.Exception 类\n\n错误的代码可能会抛出任何类型的异常。例如，尝试解析无效的参数可能会抛出\
  \ `System.FormatException`，而在空引用变量上调用方法会抛出 `System.ArgumentNullException`。所有的 .NET\
  \ 异常类都派生自 `System.Exception` 类。因此，花时间研究这个类是值得的。\n\n此外，`Exception` 类拥有 `Message`\
  \ 和 `StackTrace` 属性。`Message` 包含异常的描述，`StackTrace` 包含调用栈上的即时帧。\n\n大多数情况下，`try` 块会伴有一个\
  \ `catch` 块，该块在其他 catch 块之外，还会捕获 `System.Exception`。捕获 `Exception` 的 `catch` 块必须最后出现。如果其他\
  \ `catch` 块未能捕获该异常，则最后一个 `catch` 将捕获它。这是一个示例。\n\n```\n try \n{\n    // 代码\n} \n\
  catch (FormatException e) \n{\n    // 处理 FormatException\n} \ncatch (Exception e)\n\
  {\n    // 处理其他异常\n}\n```\n\n你可能希望上面的代码中使用多个 `catch` 块，因为 `try` 块中的语句可能会抛出 `FormatException`\
  \ 或其他类型的异常。如果抛出后者，它将由最后一个 `catch` 块捕获。\n\n但请注意：`catch` 块的顺序非常重要。例如，你不能将处理 `System.Exception`\
  \ 的 `catch` 块放在任何其他 `catch` 块之前。这是因为 CLR 会尝试按照出现的顺序将抛出的异常与 `catch` 块的参数进行匹配。`System.Exception`\
  \ 会捕获所有内容；因此，在它之后的 `catch` 块将永远不会执行。\n\n如果你有多个 `catch` 块，且其中一个 `catch` 块的异常类型派生自另一个\
  \ `catch` 块的类型，请确保更具体的异常类型先出现。\n\n## 从方法中抛出异常\n\n在在方法中捕获异常时，你有两种方法来处理方法内部发生的错误。你既可以在方法内部处理错误，从而静静地捕获异常而不通知调用者（这在之前的示例中已经演示过），或者你可以将异常抛回给调用者并让调用者来处理。如果你选择第二种方案，调用代码必须捕获由方法抛回的异常。\n\
  \n列表 8.2 展示了一个 `Capitalize` 方法，该方法将字符串的首字母更改为大写。\n\n列表 8.2：`Capitalize` 方法\n\n```\n\
  \ public string Capitalize(string s)\n{\n    if (s == null) \n    {\n        throw\
  \ new ArgumentNullException(\n                \"Your passed a null argument\");\n\
  \    }\n    Character firstChar = s.charAt(0);\n    String theRest = s.substring(1);\n\
  \    return firstChar.toString().toUpperCase() + theRest;\n}\n```\n\n如果你向 `Capitalize`\
  \ 传递 `null`，它将抛出一个新的 `ArgumentNullException`。请注意实例化 `ArgumentNullException` 类并抛出该实例的代码：\n\
  \n```\n throw new ArgumentNullException(\n                \"You passed a null argument\"\
  );\n```\n\n`throw` 关键字用于抛出异常。\n\n下面的示例显示了调用 `Capitalize` 的代码。\n\n```\n String input\
  \ = null;\ntry \n{\n    String capitalized = util.Capitalize(input);\n    System.Console.WriteLine(capitalized);\n\
  } \ncatch (ArgumentNullException e) \n{\n    System.Console.Write(e.Message);\n\
  }\n```\n\n## 注意\n\n构造函数也可以抛出异常。\n\n## 异常过滤器\n\nC# 的一项新特性——异常过滤器允许你为 `catch` 块指定一个条件。语法如下：\n\
  \n```\n try\n{\n    // 执行某些操作\n}\ncatch (SomeException e) when (condition)\n{\n\
  \    // 处理错误\n}\n```\n\n这样，只有在满足条件时才会抛出异常。这与以下代码等效。\n\n```\n try\n{\n    // 执行某些操作\n\
  }\ncatch (SomeException e)\n{\n    if (condition)\n    {\n        // 处理错误\n    }\n\
  \    else\n    {\n        throw;\n    }\n}\n```\n\n## 关于异常处理的最后说明\n\n`try` 语句会带来性能开销。因此，不要过度使用它。如果一个条件并不难以测试，那么你应该进行测试，而不是依赖\
  \ `try` 语句。例如，在空对象上调用方法会抛出 `ArgumentNullException`。因此，你始终可以将方法调用封装在 `try` 块中：\n\n\
  ```\n try \n{\n    ref.MethodA();\n...\n```\n\n然而，在调用 `MethodA` 之前检查 `ref` 是否为空并不困难。因此，下面的代码更好，因为它消除了\
  \ `try` 块。\n\n```\n if (ref != null) \n{\n    ref.MethodA();\n} \n```\n\n## 总结\n\
  \n本章讨论了结构化错误处理的使用，并为每种情况提供了示例。你还介绍了 `System.Exception` 类及其属性和方法。\n\n# 第 9 章：数字和日期\n\
  \n在 C# 中，数字由 `byte`、`short`、`int`、`float`、`double` 和 `long` 等类型表示。这些 C# 类型分别是 .NET\
  \ 结构 `System.Byte`、`System.Int16`、`System.Int32`、`System.Single`、`System.Double`\
  \ 和 `System.Int64` 的别名。此外，日期由 `System.DateTime` 结构表示。在处理数字和日期时，你需要解决的问题是解析、格式化和处理。\n\
  \n解析涉及将字符串转换为数字或日期。解析非常常见，因为程序通常需要用户输入，而用户输入是以字符串形式接收的。如果程序期望数字或日期但接收到字符串，则必须将字符串转换为数字或日期。转换并不总是简单的。在转换之前，你首先需要读取字符串并确保它包含组成数字或日期的字符。例如，“123abc”虽然以数字开头但并不是数字。“123.45”是浮点数但不是整数。“12/25/2013”看起来像日期，但只有当程序期望\
  \ mm/dd/yyyy 格式时才是有效的。将字符串转换为数字被称为数字解析。将字符串转换为日期被称为日期解析。\n\n当你有一个数字或日期时，你可能希望以特定的格式显示它。例如，1000000\
  \ 显示为 1,000,000 会更有可读性，12/25/2016 显示为 Dec 25, 2016。这些分别是数字格式化和日期格式化。\n\n数字和日期的解析与格式化是本章的主题。这些任务在\
  \ .NET 中可以轻松实现，因为上述结构为这些目的提供了相关方法。此外，还讨论了提供数学运算方法的 `System.Math` 类。在此基础上，还有一个关于处理日期的工具类\
  \ `System.Calendar` 的章节。\n\n## 数字解析\n\n\n\n\n一个 C# 程序可能要求用户输入一个数字，该数字将用于处理或作为方法的参数。例如，一个货币转换器程序需要用户输入一个要进行转换的值。你可以使用\
  \ `System.Console` 类的 `ReadLine` 方法来接收用户输入。然而，尽管输入只包含数字，但其类型将是 `string`。在对该数字进行任何操作（例如将其翻倍）之前，你需要对字符串进行解析。成功解析数字的结果是一个数字。\n\
  \n因此，数字解析的目的是将 `string` 转换为数值类型。如果解析失败（例如因为字符串不是数字，或者数字超出了指定的范围），你的程序可能会抛出一个异常。\n\
  \n你可以使用任何表示数值类型的结构体的 `Parse` 方法来解析字符串。`Parse` 的返回类型与包含 `Parse` 方法的结构相同。例如，`System.Int32`\
  \ 中的 `Parse` 方法返回一个 `Int32`。如果解析失败，将抛出 `System.FormatException`。\n\n例如，列表 9.1 中的\
  \ `NumberParsingTest` 类使用 `Console.ReadLine()` 接收用户输入并进行解析。如果用户输入了无效数字，将显示错误信息。\n\
  \n列表 9.1：解析数字 (NumberParsingTest.cs)\n\n```c\n using System;\nnamespace app09\n\
  {\n    class NumberParsingTest\n    {\n        public static void Main()\n     \
  \   {\n            Console.Write(\"Please type in a number:\");\n            String\
  \ input = Console.ReadLine();\n            try\n            {\n                int\
  \ i = Int32.Parse(input);\n                Console.WriteLine(\"The number entered:\
  \ \" + i);\n            }\n            catch (FormatException)\n            {\n\
  \                Console.WriteLine(\"Invalid user input\");\n            }\n   \
  \         Console.ReadKey();\n        }\n    }\n}\n```\n\n## 数字格式化\n\n数字格式化有助于提高数字的可读性。例如，1000000\
  \ 如果打印为 1,000,000 或 1.000.000 会更易读。你选择哪种格式显然取决于你居住的地方。在美国和加拿大的英语省，使用逗号分隔千分位，而在法国或印度尼西亚则使用句点。因此，数字和日期格式取决于用户的文化（或区域设置）。幸运的是，在\
  \ .NET 中处理文化信息非常简单。\n\n.NET 文化信息（简称为 culture info）由 `System.Globalization.CultureInfo`\
  \ 类表示。`CultureInfo` 可以是中性的（当它只指定文化的语言元素时），也可以是特定的（当语言和国家都已定义时）。如果它对文化不敏感，它也可以是一个不变文化（invariant\
  \ culture）。\n\n文化名称的格式是 ISO 639 双字母语言代码、一个连字符和 ISO 3166 双字母国家代码的组合。表 9.1 列出了 ISO\
  \ 639 中的几种语言代码，表 9.2 列出了 ISO 3166 中的一些国家代码（[http://userpage.chemie.fu-berlin.de/diverse/doc/ISO_3166.html]）。\n\
  \n| 代码 | 语言 |\n| :--- | :--- |\n| de | 德语 |\n| el | 希腊语 |\n| en | 英语 |\n| es | 西班牙语\
  \ |\n| fr | 法语 |\n| hi | 印地语 |\n| it | 意大利语 |\n| ja | 日语 |\n| nl | 荷兰语 |\n| pt |\
  \ 葡萄语 |\n| ru | 俄语 |\n| zh | 中文 |\n\n表 9.1：ISO 639 语言代码示例\n\n| 国家 | 代码 |\n| :---\
  \ | :--- |\n| 澳大利亚 | AU |\n| 巴西 | BR |\n| 加拿大 | CA |\n| 中国 | CN |\n| 埃及 | EG |\n\
  | 法国 | FR |\n| 德国 | DE |\n| 印度 | IN |\n| 墨西哥 | MX |\n| 瑞士 | CH |\n| 台湾 | TW |\n\
  | 英国 | GB |\n| 美国 | US |\n\n表 9.2：ISO 3166 国家代码示例\n\n例如，`en-US` 代表英语（美国），`en-GB`\
  \ 代表英语（英国），`fr-FR` 代表法语（法国），`fr-CA` 代表法语（加拿大），`jp-JA` 代表日语（日本）。该规则唯一的例外是 `zh-Hans`（简体中文）和\
  \ `zh-Hant`（繁体中文），它们都是中性文化。\n\n支持的文化信息完整列表可以在此处找到：\n\n```\nhttp://msdn.microsoft.com/en-us/goglobal/bb896001.aspx\n\
  ```\n\n例如，要构造一个代表加拿大使用的英语的 `CultureInfo` 对象，编写如下代码。\n\n```c\nCultureInfo cInfo =\
  \ new CultureInfo(\"en-CA\");\n```\n\n或者，你可以使用 `CultureInfo` 中的静态方法 `CreateSpecificCulture`：\n\
  \n```c\nCultureInfo cInfo = CultureInfo.CreateSpecificCulture(\"en-CA\");\n```\n\
  \n现在你已经有了关于文化信息的足够背景信息，让我们深入研究如何在 C# 中格式化数字。答案证明是简单的，你使用数值类型上的 `ToString` 方法。\n\n\
  以下是 `ToString` 的重载。\n\n```c\npublic string ToString()\npublic string ToString(IFormatProvider\
  \ provider)\npublic string ToString(string format)\npublic string ToString(string\
  \ format, IformatProvider provider)\n```\n\n如果你使用不带参数的 `ToString` 方法，将使用默认系统格式。如果你在美国，很可能是\
  \ `en-US`。例如，下面的 `ToString` 方法将数字 12345 格式化为 12345，这与原始形式相同。\n\n```c\nint value\
  \ = 12345;\nConsole.WriteLine(value.ToString()); // 输出 12345\n```\n\n下面的代码将 `2e3f`\
  \ (2 x 10³) 输出为 2000。\n\n```c\nfloat floatValue = 2e3f; // 2 x 10³\nConsole.WriteLine(floatValue.ToString());\
  \ // 输出 2000\n```\n\n根据你的需求，不带参数的 `ToString` 方法可能也可能不够。如果不够，你可以使用此方法重载向 `ToString`\
  \ 传递格式字符串。\n\n```c\npublic string ToString(string format)\n```\n\n在这里，你传递了表 9.3\
  \ 中给出的标准数值格式字符串之一。\n\n| 格式占位符 | 名称 |\n| :--- | :--- |\n| “C”或 “c” | 货币 |\n| “D”或\
  \ “d” | 小数 |\n| “E”或 “e” | 计数法 |\n| “F”或 “f” | 固定点 |\n| “G”或 “g” | 通用 |\n| “N”或\
  \ “n” | 数字 |\n| “P”或 “p” | 百分比 |\n| “R”或 “r” | 往返 |\n| “X”或 “x” | 十六进制 |\n\n表 9.3：标准数值格式字符串\n\
  \n关于数值格式字符串的更多信息可以在此处找到：\n\n```\nhttp://msdn.microsoft.com/en-us/library/dwhawy9k\n\
  ```\n\n例如，下面的代码输出 12345。\n\n```c\nint intValue = 12345;\nConsole.WriteLine(intValue.ToString(\"\
  g\"));\n```\n\n此外，如果你在美国或一个与美国使用相同货币格式的国家（并且你的电脑被设置为默认设置），你将从这段代码段中获得 $12,345.00。\n\
  \n```c\nint intValue = 12345;\nConsole.WriteLine(intValue.ToString(\"c\"));\n```\n\
  \n换句话说，在缺少文化信息的情况下，`ToString` 方法将假设默认值。但是，嘿，如果你想打印不是你电脑默认的内容呢？比如，你可能正在另一个国家的客户工作？那么，你可以使用另一个同时接受格式和文化信息的\
  \ `ToString` 重载。\n\n```c\npublic string ToString(string format, IformatProvider\
  \ provider)\n```\n\n记得 `CultureInfo` 实现了 `IFormatProvider`，因此可以将 `CultureInfo` 实例作为第二个参数传递。例如，下面的代码将\
  \ 12345 打印为法语法语的货币格式（即魁北克省）：\n\n```c\nCultureInfo frenchCanadian = new CultureInfo(\"\
  fr-CA\");\nConsole.WriteLine(intValue.ToString(\"c\", frenchCanadian));\n// 输出 12\
  \ 345,00 $\n```\n\n无论你的电脑设置如何，运行上面的代码都会得到 12 345,00 $。\n\n列表 9.2 显示了 `NumberParsingTest`\
  \ 类，该类演示了如何使用 `ToString` 的各种重载来格式化数字。\n\n列表 9.2：NumberParsingTest 类\n\n\n\n\n\n\
  ```cs\n using System;\nusing System.Globalization;\n\nnamespace app09\n{\n    class\
  \ NumberFormatTest\n    {\n        public static void Main()\n        {\n      \
  \      float floatValue = 2e3f; // 2 x 10³\n            Console.WriteLine(floatValue.ToString());\
  \ //prints 2000\n            int intValue = 12345;\n            Console.WriteLine(intValue.ToString());\n\
  \n            // use format string\n            Console.WriteLine(intValue.ToString(\"\
  g\")); \n            //prints 12345\n            Console.WriteLine(intValue.ToString(\"\
  c\")); \n            //prints $12,345.00 if en-US\n\n            CultureInfo frenchCanadian\
  \ = new CultureInfo(\"fr-CA\");\n            Console.WriteLine(intValue.ToString(\"\
  c\", \n                frenchCanadian)); // prints 12 345,00 $\n            Console.ReadKey();\n\
  \        }\n    }\n}\n```\n\n## System.Math 类\n\n`Math` 类是一个工具类，为数学运算提供了静态方法。它还有两个静态最终\
  \ double 字段：`E` 和 `PI`。`E` 代表自然对数的底（e），其值接近 2.718。`PI` 是圆周长与直径的比率（pi），其值为 22/7 或约为\
  \ 3.1428。\n\n下面给出了 `Math` 类中的一些方法。\n\n```cs\n public static double Abs(double a)\n\
  ```\n\n返回指定 double 值的绝对值。\n\n```cs\n public static double Acos(double a)\n```\n\n\
  返回在 0.0 到 pi 范围内的角度反余弦值。\n\n```cs\n public static double Asin(double a)\n```\n返回在\
  \ –pi/2 到 pi/2 范围内的角度反正弦。\n\n```cs\n public static double Atan(double a)\n```\n\
  返回在 –pi/2 到 pi/2 范围内的角度反正切值。\n\n```cs\n public static double Cos(double a)\n```\n\
  返回角度的余弦值。\n\n```cs\n public static double Exp(double a)\n```\n返回欧数 e 的指定 double\
  \ 幂。\n\n```cs\n public static double Log(double a)\n```\n返回指定 double 的自然对数（以 e 为底）。\n\
  \n```cs\n public static double Log10(double a)\n```\n返回指定 double 的以十为底的对数。\n\n```cs\n\
  \ public static double Max(double a, double b)\n```\n返回两个指定 double 值中的较大者。\n\n```cs\n\
  \ public static double Min(double a, double b)\n```\n返回两个指定 double 值中的最小值。\n\n##\
  \ 处理日期和时间\n\n.NET Framework 类库中至少有两个类可以用于处理日期和时间：`System.DateTime` 结构和 `System.TimeSpan`\
  \ 结构。它们都提供了解析和格式化的方法，区别仅在于它们所处理的数据范围。本节将解释这两个结构。此外还有 `System.Globalization.Calendar`\
  \ 类及其子类可以操作日期和时间。然而，我将讨论限制在 `DateTime` 和 `TimeSpan` 上，不会讨论 `Calendar` 及其近亲。\n\n\
  ## System.DateTime\n\n`DateTime` 代表一个时间点，例如 1945 年 8 月 9 日或 2020 年 12 月 20 日下午 6:20。\n\
  \n例如，列表 9.3 中的 `DayCalculator` 类展示了如何使用 `DateTime` 解析和格式化日期。\n\n列表 9.3：DayCalculator\
  \ 类\n\n```cs\n using System;\nusing System.Globalization;\n\nnamespace App09\n{\n\
  \    class DayCalculator\n    {\n        public void CalculateDay()\n        {\n\
  \            Console.Write(\"\\nEnter 一个 MM/dd/yyyy 格式的日期: \");\n            DateTime\
  \ selectedDate;\n            string dateString = Console.ReadLine();\n         \
  \   string format = \"MM/dd/yyyy\";\n            CultureInfo provider = CultureInfo.InvariantCulture;\n\
  \n            try \n            {\n                selectedDate = DateTime.ParseExact(dateString,\
  \ \n                    format, provider);\n                Console.WriteLine(\"\
  {0} 是/曾是 {1}\",\n                    selectedDate.ToString(\"MMM dd, yyyy\"),\n\
  \                    selectedDate.DayOfWeek);\n\n                DateTime now =\
  \ DateTime.Now;\n                // 创建今年同一日期的 DateTime\n                DateTime\
  \ thisYear = new DateTime(\n                    now.Year, selectedDate.Month, \n\
  \                    selectedDate.Day);\n\n                Console.WriteLine(\"\
  今年 {0} 落在/落在 \"\n                    + \"一个 {1}\",\n                    thisYear.ToString(\"\
  MMM dd\"),\n                    thisYear.DayOfWeek);\n            }\n          \
  \  catch (FormatException) {\n                Console.WriteLine(\"无效的日期。注意 \"\n\
  \                    + \"月份和日期部分必须是两位。\"\n                    + \"例如，不要输入 1/1/2011，\"\
  \n                    + \"请输入 01/01/2011\");\n            }\n        }\n\n     \
  \   static void Main(string[] args)\n        {\n            DayCalculator dayCalculator\
  \ =\n                new DayCalculator();\n            char tryAgain = 'y';\n  \
  \          while (tryAgain != 'n' && tryAgain != 'N')\n            {\n         \
  \       if (tryAgain == 'y' || tryAgain == 'Y')\n                {\n           \
  \         dayCalculator.CalculateDay();\n                }\n                Console.Write(\"\
  \\n 再次尝试 (y/n)?\");\n                tryAgain = Console.ReadKey().KeyChar;\n   \
  \         }\n        }\n    }\n}\n```\n\n`CalculateDay` 方法是 `DayCalculator` 的核心。它接收用户输入，进行解析并打印输入日期的星期。\n\
  \n## System.TimeSpan\n\n`TimeSpan` 结构代表一个时间间隔，可用于存储时间信息。与包含日期和时间信息的 `DateTime` 不同，`TimeSpan`\
  \ 只能存储时间信息，因此如果你不需要日期部分，它比 `DateTime` 更容易使用。\n\n例如，`App09` 解决方案中的 `TimeSpanExample`\
  \ 项目展示了如何使用 `TimeSpan` 根据起飞和到达时间计算飞行时长。只需要时间信息，因为示例中的航班假设在同一天内开始和结束。\n\n`DurationCalculator`\
  \ 类位于列表 9.4。\n\n列表 9.4：DurationCalculator 类\n\n\n\n\n\n```cs\n using System;\nusing\
  \ System.Globalization;\n\nnamespace TimeSpanExample\n{\n    class DurationCalculator\n\
  \    {\n        public void CalculateDuration()\n        {\n            TimeSpan\
  \ departure;\n            TimeSpan arrival;\n            string format = \"h\\\\\
  :mm\";\n            bool timeValid = true;\n            do\n            {\n    \
  \            Console.Write(\"Departure time (hh:mm):\");\n                string\
  \ intervalString = Console.ReadLine();\n                timeValid = TimeSpan.TryParseExact(intervalString,\
  \ \n                    format, CultureInfo.CurrentCulture, \n                 \
  \   TimeSpanStyles.None, out departure);\n                if (!timeValid)\n    \
  \            {\n                    Console.WriteLine(\"Invalid time. Please \"\n\
  \                        + \"enter your departure time in hh:mm \"\n           \
  \             + \"format (Ex: 10:30 or 21:12)\\n\");\n                }\n      \
  \      }\n            while (!timeValid);\n\n            do\n            {\n   \
  \             Console.Write(\"Arrival time (hh:mm):\");\n                string\
  \ intervalString = Console.ReadLine();\n                timeValid = TimeSpan.TryParseExact(intervalString,\n\
  \                    format, CultureInfo.CurrentCulture,\n                    TimeSpanStyles.None,\
  \ out arrival);\n                if (!timeValid)\n                {\n          \
  \          Console.WriteLine(\"Invalid time. Please \"\n                       \
  \ + \"enter your arrival time in hh:mm \"\n                        + \"format (Ex:\
  \ 10:30 or 21:12)\\n\");\n                }\n            }\n            while (!timeValid);\n\
  \n            if (arrival.CompareTo(departure) > 0)\n            {\n           \
  \     TimeSpan duration = arrival.Subtract(departure);\n                Console.WriteLine(\"\
  Your flight will take {0} \"\n                    + \"hour(s) and {1} minute(s)\"\
  , \n                    duration.Hours, duration.Minutes);\n            }\n    \
  \        else\n            {\n                Console.WriteLine(\"You have entered\
  \ an arrival \"\n                    + \"time that is earlier than the departure\
  \ \"\n                    + \"time.nPlease try again later. \");\n            }\n\
  \        }\n\n        static void Main(string[] args)\n        {\n            DurationCalculator\
  \ calculator = new \n                DurationCalculator();\n            calculator.CalculateDuration();\n\
  \            Console.ReadKey();\n        }\n    }\n} \n```\n\n`DurationCalculator`\
  \ 类中的 `CalculateDuration` 方法完成了所有工作。它使用了两个 `do-while` 循环，分别获取出发时间和到达时间。在每个循环中，`CalculateDuration`\
  \ 调用 `Console.ReadLine()` 获取用户输入，并将输入传递给 `TimeSpan` 的静态方法 `TryParseExact`。以下是用于出发时间的\
  \ `do-while` 循环。\n\n```cs\n bool timeValid = true;\n            do\n           \
  \ {\n                Console.Write(\"Departure time (hh:mm):\");\n             \
  \   string intervalString = Console.ReadLine();\n                timeValid = TimeSpan.TryParseExact(intervalString,\
  \ \n                    format, CultureInfo.CurrentCulture, \n                 \
  \   TimeSpanStyles.None, out departure);\n                if (!timeValid)\n    \
  \            {\n                    Console.WriteLine(\"Invalid time. Please \"\n\
  \                        + \"enter your departure time in hh:mm \"\n           \
  \             + \"format (Ex: 10:30 or 21:12)\\n\");\n                }\n      \
  \      }\n            while (!timeValid);\n```\n\n`TryParseExact` 在解析成功时返回 `true`，在解析失败时返回\
  \ `false`。`TryParseExact` 的最后一个参数是一个 `out` 参数，这意味着在解析成功后会设置 `TimeSpan` 对象。基本上，`do-while`\
  \ 循环将一直持续，直到用户输入 `hh:mm` 格式的有效时间。\n\n第二个 `while` 循环与第一个相似，区别在于错误信息。在接收到有效的到达时间后，会将到达时间与出发时间进行比较。\n\
  \n```cs\n if (arrival.CompareTo(departure) > 0)\n            {\n               \
  \ TimeSpan duration = arrival.Subtract(departure);\n                Console.WriteLine(\"\
  Your flight will take {0} \"\n                    + \"hour(s) and {1} minute(s)\"\
  , \n                    duration.Hours, duration.Minutes);\n            }\n    \
  \        else\n            {\n                Console.WriteLine(\"You have entered\
  \ an arrival \"\n                    + \"time that is earlier than the departure\
  \ \"\n                    + \"time.nPlease try again later. \");\n            }\n\
  ```\n\n如果 `arrival` 大于 `departure`，`arrival.CompareTo(departure)` 将返回一个正整数。在这种情况下，将从\
  \ `arrival` 中减去 `departure` 并打印结果（`duration`）。相反，如果 `departure` 等于或大于 `arrival`，`CalculateDuration`\
  \ 将打印一条错误信息。\n\n最后，是 `Main` 方法，它实例化了 `DurationCalculator` 并调用了 `CalculateDuration`\
  \ 方法。\n\n```cs\n static void Main(string[] args)\n        {\n            DurationCalculator\
  \ calculator = new \n                DurationCalculator();\n            calculator.CalculateDuration();\n\
  \            Console.ReadKey();\n        } \n```\n\n运行此程序，你将在控制台上看到如下：\n\n```\n\
  \ Departure time (hh:mm):\n```\n\n输入时间，例如 `10:30` 并按下回车。你将看到提示输入到达时间的提示：\n\n```\n\
  \ Arrival time (hh:mm):\n```\n\n输入时间，例如 `12:00` 并按下回车。你将获得两个时间之间的时长。相反，如果你输入无效的时间或到达时间早于出发时间，你将收到错误信息。\n\
  \n## 总结\n\n在 C# 中，数字由 `byte`、`short`、`int`、`float`、`double` 和 `long` 表示。这些 C# 类型分别对应\
  \ .NET 结构体 `System.Byte`、`System.Int16`、`System.Int32`、`System.Single`、`System.Double`\
  \ 和 `System.Int64`。此外，日期由 `System.DateTime` 结构表示。在本章中，你学习了处理数字和日期时需要解决三个问题：解析、格式化和操作。\n\
  \n# 第十章 接口与抽象类\n\nC# 初学者往往认为接口只是没有实现代码的代码。虽然这在技术上并不错误，但忽略了使用接口的真正意义。接口不仅如此。接口应该被视为服务提供者与客户端之间的合同。因此，本章重点介绍概念。\n\
  \n技术上讲，抽象类是无法实例化且必须由子类实现的。然而然而抽象类很重要，因为在某些情况下它可以承担接口的角色。你也将在本章学习如何使用抽象类。\n\n# 接口的概念\n\
  \n初学者第一次学习接口时，通常关注如何编写它，而不是理解其背后的概念。他们可能认为接口就像使用 `interface` 关键字声明的、方法没有体的类。虽然这种描述并不准确，但将接口视为无实现的类会错失全局。接口更好的定义是合同，它是服务提供者（服务器）与此类使用者（客户端）之间的合同。\n\
  \n考虑这个现实世界的例子。微软 Windows 是目前最流行的操作系统，但微软并不生产打印机。对于打印，你仍然依赖 `HP`、`Canon` 和 `Samsung`\
  \ 等公司。每家打印机制造商都使用专有技术。但是，他们的产品都可以从任何 Windows 应用程序打印任何文档。这是怎么做到的？\n\n\n\n\n\n这是因为微软曾对打印机制造商说过类似的话：“如果你想让你的产品在\
  \ Windows 上可用（我们知道你们都想），你就必须实现这个 `IPrintable` 接口。”\n\n接口非常简单：\n\n```\n interface\
  \ IPrintable \n{\n    void Print(Document document);\n}\n```\n\n其中 `document` 是要打印的文档。\n\
  \n打印机制造商实现此接口后编写打印机驱动程序。每台打印机都有不同的驱动程序，但它们都实现了 `IPrintable`。打印机驱动程序是 `IPrintable`\
  \ 的实现。在这种情况下，这些打印机驱动程序就是服务提供者。\n\n打印服务的客户端所有的 Windows 应用程序。在 Windows 上打印很容易，因为应用程序只需要调用\
  \ `Print` 方法并传递一个 `Document` 对象即可。由于接口是免费提供的，客户端应用程序可以在无需等待实现可用的情况下进行编译。\n\n这一点在于，得益于\
  \ `IPrintable` 接口，从不同的应用程序打印到不同的打印机是可能的。这是打印服务提供者与打印客户端之间的约定。\n\n接口可以定义方法和其他成员。然而，接口中的方法没有实现。为了使其有用，接口必须有一个实际执行该操作的实现类。\n\
  \n图 10.1 用 UML 类图说明了 `IPrintable` 接口及其实现。\n\n![](img/00020.jpeg)\n\n图 10.1：类图中的一个接口和两个实现类\n\
  \n在类图中，接口的形状与类相同，但名称以*斜体*打印并带有 `<<interface>>` 前缀。`HPDriver` 和 `CanonDriver` 类实现了\
  \ `IPrintable` 接口。它们的实现显然是不同的。在 `HPDriver` 类中，`Print` 方法包含了允许打印到 HP 打印机的代码。在 `CanonDriver`\
  \ 中，代码允许打印到 Canon 驱动程序。在 UML 类图中，类和接口通过一条带箭头的虚线连接。这种关系通常被称为“实现”（realization），因为类为接口提供的抽象提供了实际的实现（真正可以运行的代码）。\n\
  \n## 注意\n\n这个案例研究是虚构的，但问题和解决方案是真实的。希望这能让你进一步理解接口到底是什么。它是一个约定。\n\n另一个说明这一点的真实世界示例是\
  \ `System.Data.IDbConnection` 接口，它为所有数据提供者定义了约定，便于从 C# 代码连接到不同的关系型数据库。只要数据库制造商提供\
  \ `IDbConnection` 的实现，他们的产品就可以被任何 `.NET` 应用程序访问。\n\n## 从技术角度理解接口\n\n现在你已经理解了接口是什么，让我们来看看如何创建一个接口。在\
  \ C# 中，像类一样，接口也是一种类型。按照以下格式编写接口：\n\n```\n interface interfaceName \n{\n\n}\n```\n\
  \n接口可以包含方法、属性、事件和委托的签名。接口可以包含这些成员的实现。此外，接口不能包含字段。\n\n所有接口成员都是隐式公开的（public）。按照惯例，接口名称以\
  \ `I` 为前缀。你应该遵循这一惯例，因为这是最佳实践。\n\n接口是最常用的类型之一，.NET Framework 类库中有数百个接口。示例包括 `System.IClonable`、`System.IComparable`、`System.IFormatProvider`、`System.Collection.IList`、`System.Runtime.Serialization.ISerializable`\
  \ 以及 `System.Data.IDbConnection`。\n\n编写接口很容易。列表 10.1 显示了一个名为 `IPrintable` 的接口。\n\
  \n列表 10.1：IPrintable 接口\n\n```\n public interface IPrintable\n{\n    void Print(Object\
  \ document);\n}\n```\n\n`IPrintable` 接口定义了一个方法 `Print`。注意，尽管方法声明前面没有 `public` 关键字，但\
  \ `Print` 也是公开的。事实上，你不能在接口的方法声明中使用访问修饰符（如 `public` 或 `protected`）。注意，这里只出现了 `Print`\
  \ 的签名。实现写在实现类或结构体中。\n\n与类一样，接口是创建对象的模板。但与普通类不同，接口不能被实例化。它仅仅定义了一组 C# 类可以实现的方法。\n\n\
  要实现接口，你在类声明后使用冒号（`:`）。例如，列表 10.2 显示了一个实现 `IPrintable` 的 `CanonDriver` 类。\n\n列表 10.2：IPrintable\
  \ 接口的实现\n\n```\n public class CanonDriver : IPrintable\n{\n    public void Print(Object\
  \ document) \n    {\n        // 执行打印的代码\n    }\n}\n```\n\n实现类必须重写接口中的所有方法。接口与其实现类之间的关系可以比作父类和子类。类的实例也是接口的实例。例如，下面的\
  \ `if` 语句结果为真。\n\n```\n CanonDriver driver = new CanonDriver();\nif (driver is IPrintable)\
  \    // 结果为真\n```\n\n一个类可以实现多个接口。在类定义中，多个接口名称由逗号隔开。例如，这是一个同时实现 `IPrintable` 和 `System.IComparable`\
  \ 的类的定义：\n\n```\n public class MyPrinter : IPrintable, System.IComparable\n```\n\
  \n当然 course，如果你实现了多个接口，你必须为接口中的所有方法提供实现。\n\n你还可以写一个扩展基类并实现接口的类。例如，这里是一个扩展 `BasePrinter`\
  \ 并同时实现 `IPrintable` 和 `System.IComparable` 的类定义。\n\n```\n public class MyPrinter\
  \ : BasePrinter, IPrintable, System.IComparable\n```\n\n如果你正在扩展类并实现一个或多个接口，需要注意的一点是，你扩展的类名必须位于接口名称之前。例如，以下声明将产生编译错误：\n\
  \n```\n public class MyPrinter : IPrintable, System.IComparable, BasePrinter\n```\n\
  \n接口支持继承。一个接口可以扩展另一个接口。如果接口 `B` 扩展接口 `A`，则称 `B` 为 `A` 的子接口。`A` 是 `B` 的超接口。因为 `B`\
  \ 直接扩展 `A`，所以 `A` 是 `B` 的直接超接口。任何扩展 `B` 的接口都是 `A` 的间接子接口。图 10.2 显示了一个扩展另一个接口的接口。注意连接两个接口线条类型与扩展类的类型相同。\n\
  \n![](img/00021.gif)\n\n图 10.2：扩展接口\n\n大多数情况下你会会在接口中定义方法成员。你在接口中声明方法签名就像在类中一样。然而，接口中的方法没有体，它们直接由分号结束。所有方法都是隐式公开且抽象的，在方法/属性/事件/委托签名中使用访问修饰符是违法的。\n\
  \n接口中方法的语法格式为：\n\n```\n ReturnType MethodName(listOfArgument);\n```\n\n注意，接口中的方法不能声明为静态（static），因为静态方法不能是抽象的。\n\
  \n## 实现 System.IComparable\n\n接下来的示例展示了接口作为服务提供者与服务用户之间约的作用。此示例的目的是让你更容易理解 OOP（面向对象编程）语言中接口的概念。\n\
  \n你在第 5 章“核心类”中学习了数组，我曾简要提到过 `System.Array` 类有一个名为 `Sort` 的静态方法，可以对数组元素排序。它的签名如下：\n\
  \n```\n public static void Sort(Array array)\n```\n\n\n\n\n但是 `Sort` 如何知道如何排序它一无所知的对象呢？`Sort`\
  \ 又如何知道 `Elephant` 对象应该按重量排序，而 `Student` 对象应该按姓和名排序呢？嗯，这就是接口发挥用场的地方。由于 `System.Array`\
  \ 的作者们对这些对象一无所知，他们简单地制定了一份合同，规定 `Sort` 将数组元素视为 `System.IComparable` 实例。因此，如果你想让数组中的对象是可以排序的，你就必须通过确保对象类实现了该接口，来允许它们被转换为\
  \ `IComparable`。\n\n`IComparable` 只有一个方法 `CompareTo`，你可以通过重写它来决定你的对象如何以及应该如何排序。\n\
  \n`IComparableImplementation` 项目包含一个在列表 10.3 中显示的类。\n\n## 列表 10.3: Implementing\
  \ IComparable\n\n```\n using System;\nnamespace App10\n{\n    class Student : IComparable\n\
  \    {\n        private string firstName;\n        private string lastName;\n\n\
  \        public Student(string firstName, \n            string lastName)\n     \
  \   {\n            this.lastName = lastName;\n            this.firstName = firstName;\n\
  \        }\n\n        public string FirstName\n        {\n            get\n    \
  \        {\n                return firstName;\n            }\n            set\n\
  \            {\n                firstName = value;\n            }\n        }\n\n\
  \        public string LastName\n        {\n            get\n            {\n   \
  \             return lastName;\n            }\n            set\n            {\n\
  \                lastName = value;\n            }\n        }\n\n        public int\
  \ CompareTo(Object obj)\n        {\n            Student anotherStudent = (Student)\
  \ obj;\n            if (this.lastName == anotherStudent.lastName)\n            {\n\
  \                return this.FirstName.CompareTo(\n                    anotherStudent.FirstName);\n\
  \            }\n            else\n            {\n                return this.LastName.CompareTo(\n\
  \                    anotherStudent.LastName);\n            }\n        }\n    }\n\
  \n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Student[] students = { \n                new Student(\"John\", \"Suzuki\"\
  ),\n                new Student(\"Liam\", \"Doe\"),\n                new Student(\"\
  John\", \"Smith\"),\n                new Student(\"Joe\", \"Doe\"),\n          \
  \      new Student(\"John\", \"Tirano\"),\n                new Student(\"Louis\"\
  , \"Smith\")};\n\n            Console.WriteLine(\"\\nUnsorted:\");\n           \
  \ Console.WriteLine(\"====================\"\n            foreach (Student student\
  \ in students)\n            {\n                Console.WriteLine(student.LastName\
  \ + \n                    \", \" + student.FirstName);\n            }\n\n      \
  \      Array.Sort(students);\n\n            Console.WriteLine(\"\\nSorted:\");\n\
  \            Console.WriteLine(\"==================\");\n            foreach (Student\
  \ student in students)\n            {\n                Console.WriteLine(student.LastName\
  \ +\n                    \", \" + student.FirstName);\n            }\n\n       \
  \     Console.ReadKey();\n        }\n    }\n}\n```\n\n在列表 10.3 中运行代码将在控制台上显示出如下结果。\n\
  \n```\n Unsorted:\n====================\nSuzuki, John\nDoe, Liam\nSmith, John\n\
  Doe, Joe\nTirano, John\nSmith, Louis\n\nSorted:\n====================\nDoe, Joe\n\
  Doe, Liam\nSmith, John\nSmith, Louis\nSuzuki, John\nTirano, John\n```\n\n# 抽象类\n\
  \n通过接口，你必须编写一个执行实际操作的实现类。如果接口中有许多方法，你可能会面临浪费时间重写你并不使用的方法的风险。抽象类的作用与接口类似，即在服务提供者和其客户端之间提供一份合同，但同时抽象类可以提供部分实现。必须显式重写的方法可以声明为抽象的（abstract）。你仍然需要创建一个实现类，因为你不能实例化抽象类，但你不需要重写你不想使用或更改的方法。\n\
  \n你通过在类声明中使用 `abstract` 修饰符来创建一个抽象类。要创建一个抽象方法，在方法声明前使用 `abstract` 修饰符。列表 10.4 显示了一个抽象类\
  \ `DefaultPrinter` 作为示例。\n\n## 列表 10.4: The DefaultPrinter class\n\n```\n public\
  \ abstract class DefaultPrinter \n{\n    public string GetDescription() \n    {\n\
  \        return \"Use this to print documents.\";\n    }\n    public abstract void\
  \ Print(Object document);\n}\n```\n\n`DefaultPrinter` 中有两个方法：`Print` 和 `GetDescription`。`GetDescription`\
  \ 方法有具体实现，因此你不需要在实现类中重写此方法，除非你想改变它的返回值。`Print` 方法被声明为抽象的且没有方法体。列表 10.5 展示了一个 `MyPrinterClass`\
  \ 类，它是 `DefaultPrinter` 的实现类。\n\n## 列表 10.5: An implementation of DefaultPrinter\n\
  \n```\n public class MyPrinter : DefaultPrinter \n{\n    public override void Print(object\
  \ document) \n    {\n        Console.WriteLine(\"Printing document\");\n       \
  \ // some code here\n    }\n}\n```\n\n具体的实现类如 `MyPrinter` 必须重写所有抽象方法。否则，它本身也必须声明为抽象的。\n\
  \n将类声明为抽象是告诉类用户你希望他们扩展该类的一种。即使类没有抽象方法，你仍然可以将其声明为抽象。\n\n在 UML 类图中，抽象类看起来与具体类相似，区别在于名称是斜体。图\
  \ 10.3 显示了一个抽象类。\n\n![](img/00022.gif)\n\n图 10.3: an abstract class\n\n## 总结\n\n\
  接口在 C# 中起着重要作用，因为它定义了服务提供者和其客户端之间的合同。本章向你展示了如何使用接口。基类提供了接口的通用实现，通过提供代码的默认实现来加速程序开发。\n\
  \n抽象类类似于接口，但它可能提供其某些方法的实现。\n\n# 第 11 章\n\n## 多态\n\n多态性对于初学者面向对象编程（OOP）的新学者来说是最难解释的概念。事实上，大多数时候，如果没有一两个例子，它的定义将毫无意义。嗯，试一下这个。这是许多编程书籍中的定义：“多态性是一种\
  \ OOP 特性，它允许对象在接收方法调用时决定调用哪种方法实现。”如果你觉得这很难理解，你并不孤单。多态性很难用简单的语言解释，尽管如果配上一两个例子，它就很容易理解。\n\
  \n本章解释了什么是多态性，并给出几个例子。\n\n## 注意\n\n在其他编程语言中，多态性也被称为晚绑定（late-binding）、运行时绑定（runtime-binding）或动态绑定（dynamic\
  \ binding）。\n\n## 定义多态\n\n在 C# 和其他 OOP 语言中，如果满足某些条件，给引用变量赋值一个与变量类型不同的对象是合法的。本质上，如果你有一个类型为\
  \ `A` 的引用变量 `a`，赋值一个类型为 `B` 的对象是合法的，如下所示：\n\n```\n A a = new B();\n```\n\n只要满足以下条件之一：\n\
  \n*   `A` 是一个类且 `B` 是 `A` 的子类。\n*   `A` 是一个接口且 `B` 或其父类实现了 `A`。\n\n正如你在第 6 章“继承”中学学的，这被称为向上转型（upcasting）。\n\
  \n当你像前面的代码那样给 `a` 赋值一个 `B` 的实例时，`a` 的类型是 `A`。这意味着你不能调用 `B` 中未在 `A` 中定义的方法。然而，如果你打印\
  \ `a.GetType().ToString()` 的值，你会得到“B”而不是“A”。那么这意味着什么？在编译时，`a` 的类型是 `A`，因此编译器不会允许你调用\
  \ `B` 中未在 `A` 中定义的方法。另一方面，在运行时，`a` 的类型是 `B`，这正如 `a.GetType().ToString()` 的返回值所证明的那样。\n\
  \n\n\n\n\n现在，多态的核心就在这里。如果 `B` 重写了 `A` 中的一个方法（例如，名为 `Play` 的方法），调用 `a.Play()` 将导致调用\
  \ `B` 中 `Play` 的实现（而不是 `A` 中的）。多态允许对象（在本例中，由 `a` 引用的对象）在调用方法时决定选择哪种方法实现（是 `A` 中的还是\
  \ `B` 中的）。多态规定要调用运行时对象的具体实现。\n\n如果你调用 `a` 的另一个方法（例如，名为 `Stop` 的方法）而该方法在 `B` 中没有实现会怎样？`CLR`\
  \ 足够智能，能够感知并查看 `B` 的继承层次结构。事实上，`B` 必须是 `A` 的子类，或者如果 `A` 是一个接口，则必须实现 `A` 的另一个类的子类。否则，代码将无法编译。确定这一点后，`CLR`\
  \ 将沿着类层次结构的阶梯向上爬，找到 `Stop` 的实现并执行它。\n\n现在，多态的定义更有意义了：多态是一种 OOP 特性，允许对象在接收到方法调用时决定调用哪种方法实现。\n\
  \n从技术上讲，C# 是如何实现这一点的？事实证明，C# 编译器在遇到如 `a.Play()` 的方法调用时，会检查 `a` 所代表的类/接口是否定义了此类方法（`Play`\
  \ 方法）以及是否向方法传递了正确的参数集。但这就是编译器所做的极限了。除了静态和密封方法外，它不会将方法调用与方法体连接（或绑定）。`CLR` 在运行时决定如何将方法调用与方法体绑定。换句话说，除了静态和密封方法外，C#\
  \ 中的方法绑定发生在运行时，而不是编译时。运行时绑定也称为晚绑定或动态绑定。其反面是早期绑定，在其中绑定在编译时或链接时发生。早期绑定发生在如 `C` 这样的语言中。\n\
  \n因此，多态是通过 `.NET Framework` 中的晚绑定机制变为可能性的。正因如此，多态也被相当不准确地称为晚绑定、动态绑定或运行时绑定。\n\n让我们看看列表\
  \ 11.1 中的代码。\n\n## 列表 11.1：多态示例\n\n```\n using System;\n\nnamespace PolymorphismExample1\n\
  {\n    class Employee {\n        public virtual void Work() \n        {\n      \
  \      Console.WriteLine(\"I am an employee.\");\n        }\n    }\n\n    class\
  \ Manager : Employee \n    {\n        public override void Work() \n        {\n\
  \            Console.WriteLine(\"I am a manager.\");\n        }\n\n        public\
  \ void Manage() \n        {\n            Console.WriteLine(\"Managing ...\");\n\
  \        }\n    }\n\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Employee employee;\n            employee = new Manager();\n\
  \            Console.WriteLine(employee.GetType().ToString());\n            employee.Work();\n\
  \            Manager manager = (Manager) employee;\n            manager.Manage();\n\
  \n            Console.ReadKey();\n        }\n    }\n}\n```\n\n列表 11.1 定义了两个类：`Employee`\
  \ 和 `Manager`。`Employee` 有一个名为 `Work` 的虚方法，而 `Manager` 扩展了 `Employee` 并增加了一个名为 `Manage`\
  \ 的新方法，同时重写了 `Work`。\n\n`Program` 类中的 `Main` 方法定义了一个类型为 `Employee` 的对象变量 `employee`：\n\
  \n```\n Employee employee;\n```\n\n然而，`employee` 被赋值了一个 `Manager` 的实例，如下：\n\n```\n\
  \ employee = new Manager();\n```\n\n这是合法的，因为 `Manager` 是 `Employee` 的子类，所以 `Manager`\
  \ “是一个” `Employee`。因为 `employee` 被赋值为 `Manager` 的实例，`employee.GetType().ToString()`\
  \ 的结果是什么？你说得对。是“Manager”，而不是“Employee”。\n\n然后，调用了 `Work` 方法。\n\n```\n employee.Work();\n\
  ```\n\n猜猜控制台上写了什么？\n\n```\n I am a manager.\n```\n\n这意味着调用的是 `Manager` 类中的 `Work`\
  \ 方法，这就是多态的体现。\n\n现在，因为 `a` 的运行时类型是 `Manager`，你可以像代码所示将 `a` 强制转型为 `Manager`：\n\n\
  ```\n Manager manager = (Manager) employee;\nmanager.Manage();\n```\n\n看到代码后，你可能会问，为什么最初要将\
  \ `employee` 声明为 `Employee` 类型？为什么不这样将 `employee` 声明为 `Manager` 类型呢？\n\n```\n Manager\
  \ employee;\nemployee = new Manager();\n```\n\n这样做是为了确保灵活性，以防在你不知道对象引用（`employee`）会被赋值为\
  \ `Manager` 实例还是其他实例的情况下。\n\n## 总结\n\n多态是面向对象编程的主要支柱之一。在编译时无法确定对象类型的情况下，它非常有用。本章通过几个示例演示了多态。你可以在其他章节中找到更多多态的示例，特别是第\
  \ 18 章“Windows Presentation Foundation”。\n\n# 第 12 章：枚举\n\n`Enums` 是 `.NET Framework`\
  \ 中的一种数据类型，可用于存储枚举值。你主要使用枚举来限制赋值给变量的可能值或从方法返回的可能值。\n\n本章重点介绍了这种数据类型。\n\n# 枚举概览\n\
  \n你使用 `enum` 关键字为字段或方法创建一组有效值。例如，`customerType` 字段的可能值可能是 `Individual` 和 `Organization`。对于\
  \ `state` 字段，有效值可以是美国所有的州加上加拿大的各省份。通过 `enum`，你可以轻松地限制程序只取有效值中的之一。\n\n`enum` 类型可以独立存在，也可以是类的一部分。如果它需要在应用程序的许多地方使用，就让它独立。如果它只在类内部使用，则最好将\
  \ `enum` 作为类的一部分。\n\n例如，考虑列表 12.1 中的 `EmployeeType` 枚举定义。\n\n## 列表 12.1：EmployeeType\
  \ 枚举\n\n```\n enum EmployeeType\n{\n    FullTime,\n    PartTime,\n    Permanent,\n\
  \    Contractor\n} \n```\n\n`EmployeeType` 枚举有四个枚举值：`FullTime`、`PartTime`、`Permanent`\
  \ 和 `Contractor`。`Enum` 值对大小写敏感，并按照习惯大写。两个枚举值之间用逗号分隔，值可以写在一行也可以写在多行。列表 12.1 中的 `enum`\
  \ 写在多行是为了提高可读性。\n\n使用枚举就像使用类或接口。例如，列表 12.2 中的代码使用了列表 12.1 中的 `EmployeeType` 枚举作为字段类型。\n\
  \n## 列表 12.2：使用 EmployeeType 枚举\n\n```\n using System;\nnamespace EnumExample\n\
  {\n    enum EmployeeType\n    {\n        FullTime,\n        PartTime,\n        Permanent,\n\
  \        Contractor\n    }\n\n    class Employee\n    {\n        private EmployeeType\
  \ employeeType;\n        public Employee(EmployeeType employeeType)\n        {\n\
  \            this.employeeType = employeeType;\n        }\n        public String\
  \ getDescription()\n        {\n            if (employeeType == EmployeeType.Contractor)\n\
  \            {\n                return \"Contractor, pay on hourly basis\";\n  \
  \          }\n            else if (employeeType == EmployeeType.FullTime)\n    \
  \        {\n                return \"Permanent, salary-based\";\n            }\n\
  \            else if (employeeType == EmployeeType.PartTime)\n            {\n  \
  \              return \"Part-Time, mostly students\";\n            }\n         \
  \   else\n            {\n                return \"Full-Time, salary-based\";\n \
  \           }\n        }\n    }\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            EmployeeType employeeType = EmployeeType.PartTime;\n\
  \            Employee employee = new Employee(employeeType);\n            Console.WriteLine(employeeType);\
  \ // prints \"PartTime\"\n            Console.WriteLine(employee.getDescription());\n\
  \            Console.ReadKey();\n        }\n    }\n}\n```\n\n在列表 12.2 中，你使用枚举值就像使用类的静态成员一样。例如，这段代码说明了\
  \ `EmployeeType` 的用法。\n\n```\n EmployeeType employeeType = EmployeeType.PartTime;\n\
  ```\n\n\n\n\n\n注意看 `employeeType` 变量是如何被赋值为 `EmployeeType` 枚举值 `PartTime` 的？因为 `employeeType`\
  \ 变量的类型是 `EmployeeType`，它只能被赋值 `EmployeeType` 中定义的值。\n\n乍看之下，使用 `enum` 与使用常量没有区别。然而，枚举和常量之间存在一些基本区别。对于应该只接受预定义值的情况，常量并不是完美的解决方案。例如，考虑列表\
  \ 12.3 中的 `CustomerTypeStaticFinals` 类。\n\n代码列表 12.3：使用常量\n\n```\n class CustomerTypeStaticFinals\
  \ \n{\n    public const int INDIVIDUAL = 1;\n    public const int ORGANIZATION =\
  \ 2;\n}\n```\n\n假设你有一个名为 `OldFashionedCustomer` 的类，它的 `customerType` 字段使用 `int`\
  \ 类型。以下代码创建了 `OldFashionedCustomer` 的实例并为其 `customerType` 字段赋值：\n\n```\n OldFashionedCustomer\
  \ ofCustomer = new OldFashionedCustomer();\nofCustomer.customerType = 5;\n```\n\n\
  使用常量时，没有任何机制可以阻止你为 `customerType` 分配一个无效整数。为了保证变量只被赋值有效值，枚举比常量更好。\n\n## 类中的枚举\n\n\
  你可以将枚举作为类的成员。如果枚举仅在类内部内部使用，你就可以使用这种方法。例如，列表 12.4 中的代码是列表 12.3 中代码的修改版本。与列表 12.3\
  \ 不同，列表 12.4 中的代码将 `EmployeeType` 枚举声明为 `Employee` 类中的字段。\n\n代码列表 12.4：将枚举作为类成员\n\
  \n```\n using System;\n\nnamespace EnumExample2\n{\n    class Employee\n    {\n\
  \        public enum EmployeeType\n        {\n            FullTime,\n          \
  \  PartTime,\n            Permanent,\n            Contractor\n        }\n      \
  \  private EmployeeType employeeType;\n        public Employee(EmployeeType employeeType)\n\
  \        {\n            this.employeeType = employeeType;\n        }\n        public\
  \ String getDescription()\n        {\n            if (employeeType == EmployeeType.Contractor)\n\
  \            {\n                return \"Contractor, pay on hourly basis\";\n  \
  \          }\n            else if (employeeType == EmployeeType.Permanent)\n   \
  \         {\n                return \"Permanent, salary-based\";\n            }\n\
  \            else if (employeeType == EmployeeType.PartTime)\n            {\n  \
  \              return \"Part-Time, mostly students\";\n            }\n         \
  \   else\n            {\n                return \"Full-Time, salary-based\";\n \
  \           }\n        }\n    }\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Employee.EmployeeType employeeType =\n         \
  \           Employee.EmployeeType.FullTime;\n            Employee employee = new\
  \ Employee(employeeType);\n            Console.WriteLine(employeeType); // prints\
  \ \"FullTime\"\n            Console.WriteLine(employee.getDescription());\n    \
  \        Console.ReadKey();\n        }\n    }\n}\n```\n\n## 对枚举进行 switch\n\n`switch`\
  \ 语句也可以用于枚举的枚举值。列表 12.5 中的代码是在 switch 语句中使用枚举 `DayOfWeek` 的一个示例。\n\n代码列表 12.5：对枚举进行\
  \ switch\n\n```\n using System;\n\nnamespaceExampleExample3\n{\n    enum DayOfWeek\n\
  \    {\n        Monday, Tuesday, Wednesday, Thursday, Friday, Saturday,\n      \
  \      Sunday\n    }\n\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            DayOfWeek day = DayOfWeek.Sunday;\n            switch\
  \ (day)\n            {\n                case DayOfWeek.Monday:\n               \
  \ case DayOfWeek.Tuesday:\n                case DayOfWeek.Wednesday:\n         \
  \       case DayOfWeek.Thursday:\n                case DayOfWeek.Friday:\n     \
  \               Console.WriteLine(\"Week day\");\n                    break;\n \
  \               case DayOfWeek.Saturday:\n                case DayOfWeek.Sunday:\n\
  \                    Console.WriteLine(\"Week end\");\n                    break;\n\
  \            }\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n列表 12.5\
  \ 中的 `switch` 语句接受 `DayOfWeek` 中的值。如果值为 `Monday`、`Tuesday`、`Wednesday`、`Thursday`\
  \ 或 `Friday`，它将打印“Week day”。如果值为 `Saturday` 或 `Sunday`，它将打印“Week end”。\n\n## 总结\n\
  \nC# 支持 `enum`，这是一种 `System.Enum` 子类的特殊类。枚举比整数更受青，因为它更安全。你也可以对枚举进行 switch 操作并迭代它的值。\n\
  \n# 第 13 章\n\n## 泛型\n\n泛型是 .NET Framework 2.0 添加的最显著特性之一。通过泛型，你可以编写参数化类型并通传递一个或多个类型来创建其实例。对象将被限制在这些类型中。除了参数化类型，泛型还支持参数化方法。\n\
  \n泛型的好处包括编译时更严格的类型检查和性能提升。此外，泛型消除了你在处理 `System.Collections` 命名空间中的成员时必须执行的大多数类型转换。\n\
  \n本章解释了如何使用和编写泛型。它从“为什么需要泛型？”部分开始，然后介绍泛型的示例。在讨论了语法之后，本章以解释如何编写泛型类型的节结束。\n\n# 为什么需要泛型？\n\
  \n用例子来论证泛型的优势是最简单的。考虑 `System.Collections.ArrayList` 类，它自 .NET Framework 1.0 以来一直存在于\
  \ .NET Framework 类库中。`ArrayList` 是可以可以对象的集合。向 `ArrayList` 添加对象可以调用它的 `Add` 方法，其签名如下：\n\
  \n```\n public virtual int Add(Object value)\n```\n\n例如，以下代码实例化了 `ArrayList` 并向其添加了一个产品代码（字符串）。\n\
  \n```\n ArrayList productCodes = new ArrayList();\ncodes.Add(\"ABC\");\n```\n\n\
  由于所有的引用类型和值类型都派自 `System.Object`，实际上你可将任何类型的对象传递给 `ArrayList.Add`。这种设计是有意的，因为 `ArrayList`\
  \ 应该作为一个可以容任何类型对象的通用容器。\n\n在 `ArrayList` 中存储对象后，你可以像访问数组元素一样检索元素。\n\n```\n arrayList[index]\n\
  ```\n\n请注意返回值将是 `Object` 类型，你需要对其进行向下转换才能完全使用它。修改上面的代码：\n\n```\n ArrayList productCodes\
  \ = new ArrayList();\ncodes.Add(\"ABC\");\n// 获取第一个元素\nstring productCode = (string)\
  \ productCodes[0];\n```\n\n必须从对象向下转换到实际的对象类型有些不便，但你可能可以接受。另一方面，考虑以下代码，它会产生更严重的后果：\n\
  \n```\n int x = 123;\nArrayList productCodes = new ArrayList();\nproductCodes.Add(\"\
  ABC\");\nproductCodes.Add(x);\n```\n\n在这里，你传递了两个不同的类型：字符串（“ABC”）和 `int` (`x`）。现在，假设你尝试遍历\
  \ `ArrayList`，认为其中所有对象都是字符串。\n\n```\n int count = codes.Count;\nfor (int i = 0;\
  \ i < count; i++)\n{\n    // 打印大写\n    string code = (string)codes[i];\n    Console.WriteLine(code.ToUpper());\n\
  }\n```\n\n你认为会发生什么？它会在第二个元素处崩溃，因为它的类型是 `int`，尝试将 `int` 转换为字符串会导致运行时错误。\n\n所以 `ArrayList`\
  \ 并不酷，因为这个缺陷可能是致命的。\n\n意识到这种不完美，.NET 的设计人员在 .NET 2.0 中加入了泛型。结果是现在有一个名为 `System.Collections.Generic`\
  \ 的命名空间。\n\n以 `System.Collections.Generic.List` 为例。该类与 `System.Collections.ArrayList`\
  \ 非常相似，但 `List` 是参数化的。这里是 `List` 的声明。\n\n```\n public class List<T> : IList<T>,\
  \ ICollection<T>, \n        IEnumerable<T>, IList, ICollection, IEnumerable\n```\n\
  \n在这里，`T` 代表一种类型，即它可以存储的对象的类型。要实例化 `List`，必须指定一个类型，例如 `int` 或 `string`。例如，这是你如何声明字符串列表的：\n\
  \n\n\n\n\n```\n List<string> codes = new List<string>();\n```\n\n这意味着，你只能向 `codes`\
  \ 中添加字符串。添加除 `string` 以外的类型将产生编译错误。\n\n```\n List<string> codes = new List<string>();\n\
  codes.Add(\"ABC\");\ncodes.Add(123); // 编译错误\n```\n\n换句话说，你不会发生向一个 `List` 传递两个不同对象类型的错误。此外，由于\
  \ `List` 只能接受特定类型，你不需要对检索到的元素进行向下转换。这里是一个展示这一点的代码片段。\n\n```\n List<string> codes\
  \ = new List<string>();\ncodes.Add(\"ABC\");\n\n// 在此处添加更多元素\n\n// 遍历 List\nint\
  \ count = codes.Count;\nfor (int i = 0; i < count; i++)\n{\n    // 打印大写字母\n    string\
  \ code = codes[i]; // 无向下转换\n    Console.WriteLine(code.ToUpper());\n}\n```\n\n\
  你将在第 14 章中看到更多 `System.Collections.Generic` 成员的应用。现在，让我们了解更多关于泛型的信息。\n\n## 介绍泛型类型\n\
  \n如上一节所示，泛型类型可以接受参数。这就是为什么泛型类型通常被称为参数化类型。\n\n声明泛型类型与声明非泛型类型相似，不同之处在于使用角括号括起泛型类型的类型变量列表。\n\
  \n```\n MyType<typeVar1, typeVar2, ...>\n```\n\n例如，要声明一个 `System.Collections.Generic.List`，你可以这样写：\n\
  \n```\n List<T> myList;\n```\n\n`T` 被称为类型变量，即一个将被类型替换的变量。替换类型变量的值将用于用作泛型类型中一个或多个方法的参数类型或返回类型。对于\
  \ `List` 类，当创建实例时，`T` 将作为 `Add` 以及其他方法的参数类型。`T` 也将作为 `Find` 以及其他方法的返回类型。这里是 `List`\
  \ 类中 `Add` 和 `Find` 的签名。\n\n```\n public void Add<T>>\npublic T Find(Predicate<T>\
  \ match)\n```\n\n注意\n\n使用类型变量 `T` 的泛型类型允许你在声明或实例化泛型类型时传递 `T`。此外，如果 `T` 是一个类，你也可以传递\
  \ `T` 的子类；如果 `T` 是一个接口，你可以传递实现 `T` 的类。\n\n如果你在 `List` 的声明中传递 `string`，例如：\n\n```\n\
  \ List<string> myList;\n```\n\n由 `myList` 用的 `List` 实例的 `Add` 方法将期望一个 `string` 对象作为其参数，它的\
  \ `Find` 方法将返回 `string`。由于 `Find` 返回特定类型的对象，不需要向下转换。\n\n要实例化泛型类型，你需要传递与声明时相同的参数列表。例如，要创建一个与\
  \ `string` 工作的 `List`，你在角括号中传递 `string`。\n\n```\n List<string> myList = new List<string>();\n\
  ```\n\n作为一个示例，列表 13.1 比较了 `ArrayList` 和 `List`。\n\n列表 13.1：比较非泛型的 `ArrayList` 和泛型的\
  \ `List`\n\n```\n using System;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  \nnamespace ArrayListVsList\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            ArrayList arrayList = new ArrayList();\n       \
  \     arrayList.Add(\"Life without generics\");\n            // 强制转换为 String\n \
  \           String s1 = (String) arrayList[0];\n            Console.WriteLine(s1.ToUpper());\n\
  \n            List<string> list = new List<string>();\n            list.Add(\"Life\
  \ with generics\");\n            // 不需要类型转换\n            String s2 = list[0];\n\
  \            Console.WriteLine(s2.ToUpper());\n\n            Console.ReadKey();\n\
  \       }\n    }\n}\n```\n\n在列表 13.1 中，`ArrayList` 与 `List` 进行了面对面的比较。声明 `List<string>`\
  \ 告诉编译器该 `List` 实例只能存储字符串。在检索 `List` 的成员元素时，不需要向下转换，因为已经返回了预期的类型，即 `string`。\n\n\
  如果你运行列表 13.1 中的代码，你将在控制台上看到这些几行：\n\n```\n LIFE WITHOUT GENERICS\nLIFE WITH GENERICS\n\
  ```\n\n注意\n\n使用泛型类型，类型检查在编译时完成。\n\n这里有趣的一点是，泛型类型本身是一个类型，并可以用作类型变量。例如，如果你想让 `List`\
  \ 存储字符串列表，你可以通过传递 `List<string>` 作为其类型变量来声明 `List`，例如：\n\n```\n List<List<string>>\
  \ myListOfListsOfStrings;\n```\n\n要从 `myList` 中的第一个列表中检索第一个字符串，你可以写：\n\n```\n string\
  \ s = myListOfListsOfStrings[0][0];\n```\n\n列表 13.2 展示了一个使用接受字符串列表的 `List` 的类。\n\
  \n```\n using System;\nusing System.Collections.Generic;\n\nnamespace ListOfLists\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            List<string> listOfStrings = new List<string>();\n            listOfStrings.Add(\"\
  Hello again\");\n            List<List<string>> listOfLists = \n               \
  \     new List<List<string>>();\n            listOfLists.Add(listOfStrings);\n \
  \           string s = listOfLists[0][0];\n            Console.WriteLine(s); //\
  \ 打印 \"Hello again\"\n            Console.ReadKey();\n        }\n    }\n}\n```\n\
  \n此外，泛型类型可以接受多个一个类型参数。例如，你可以用于存储键/值对的 `System.Collections.Generic.Dictionary` 类定义如下。\n\
  \n```\n public class Dictionary<TKey, TValue> : ...\n```\n\n`TKey` 用于表示键的类型，`TValue`\
  \ 表示值的类型。`Dictionary` 类的 `Add` 方法具有以下签名：\n\n```\n public void Add(TKey key, TValue\
  \ value)\n```\n\n列表 13.3 提供了一个使用 `Dictionary` 的示例。\n\n```\n using System;\nusing\
  \ System.Collections.Generic;\n\nnamespace DictionaryExample\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            Dictionary<int,\
  \ string> flowers = \n                    new Dictionary<int, string>();\n     \
  \       flowers.Add(1001, \"Lily\");\n            flowers.Add(1002, \"Rose\");\n\
  \            flowers.Add(1003, \"Lotus\");\n\n            string favorite = flowers[1002];\n\
  \            Console.WriteLine(favorite);\n\n            Console.ReadKey();\n  \
  \      }\n    }\n}\n```\n\n在列表 13.3 中，你创建了一个 `int` 为键类型 `string` 为值类型的 `Dictionary`。检索到的值始终是\
  \ `string` 类型，无需类型转换。\n\n## 应用限制\n\n正如你在前面的节中看到的，`List` 和 `Dictionary` 类允许传递任何类型作为类型参数。然而，你也可以限制用于参数化类型的类型。例如，如果你有一个提供数学操作方法的\
  \ `MathUtility` 类，那么将 `MathUtility` 的类型参数限制为表示数字的值类型是合理的。\n\n表格 13.1 显示了用于类型参数的约束。\n\
  \n| 约束 | 描述 |\n| :--- | :--- |\n| `where T: struct` | 类型参数必须是值类型 |\n| `where T:\
  \ class` | 类型参数必须是引用类型，包括任何类、接口、委托和数组类型。 |\n| `where T: new()` | 类型参数必须有一个无参数的公共构造函数。如果有其他约束，此约束必须最后。\
  \ |\n| `where T: <base class name>` | 类型参数必须是指定的基类或其子类。 |\n| `where T: <interface\
  \ name>` | 类型参数必须是指定的接口或实现该接口的类型。 |\n| `where T: U` | `T` 的类型参数必须与 `U` 的参数相同或派生自它。\
  \ |\n\n表格 13.1：类型参数的约束\n\n例如，要将类型参数限制为值类型，请使用 `where T: struct` 约束。\n\n```\n Class\
  \ MathUtility<T> where T: struct \n{  \n}\n```\n\n如果你尝试将引用类型传递给 `MathUtility`，将得到一个编译错误，提示类型参数必须是值类型。作为另一个示例，以下类期望一个实现\
  \ `IComparable` 的类型参数：\n\n\n\n\n\n```\n class ObjecUtil<T> where T: Icomparable\n\
  {\n}\n```\n\n## 编写泛型类型\n\n编写泛型类型与编写其他类型没有太大，区别在于你需要声明一组你打算在类型的某处使用的类型变量。这些类型变量位于类型名后的尖括号中。例如，列表\
  \ 13.4 中的 `Point` 类就是一个泛型类。`Point` 对象表示坐标系中的一个点，它具有一个 `X` 组件（横坐标）和一个 `Y` 组件（纵坐标）。通过使\
  \ `Point` 泛型化，你可以指定 `Point` 实例的精度程度。例如，如果一个 `Point` 对象需要非常精确，你可以传递 `Double` 作为类型变量。否则，`Integer`\
  \ 就足够了。\n\n列表 13.4: 泛型 `Point` 类\n\n```\n using System;\n\nnamespace CustomGenericType\n\
  {\n    struct Point<T>\n    {\n        T x;\n        T y;\n        public Point(T\
  \ x, T y)\n        {\n            this.x = x;\n            this.y = y;\n       \
  \ }\n        public T X\n        {\n            get { return x; }\n            set\
  \ { this.x = value; }\n        }\n\n        public T Y\n        {\n            get\
  \ { return y; }\n            set { this.y = value; }\n        }\n\n        public\
  \ void Print()\n        {\n            Console.WriteLine(\"({0}, {1})\", x, y);\n\
  \        }\n    }\n}\n```\n\n在列表 13.4 中，`T` 是 `Point` 类的类型变量。`T` 被作 `X` 和 `Y` 属性的返回值和参数类型。此外，构造函数也接受两个\
  \ `T` 类型变量。\n\n使用 `Point` 与使用其他泛型类型一样。例如，列表 13.5 中的代码创建了两个 `Point` 对象，`point1` 和\
  \ `point2`。前者传递 `Integer` 作为类型变量，后者传递 `Double`。\n\n列表 13.5: 测试 `Point`\n\n```\n\
  \ using System;\n\nnamespace CustomGenericType\n{\n    class Program\n    {\n  \
  \      static void Main(string[] args)\n        {\n            Point<int> a = new\
  \ Point<int>();\n            a.Print();\n            Point<double> b = new Point<double>(12.3,\
  \ 244.4);\n            b.Print();\n\n            Console.ReadKey();\n        }\n\
  \    }\n}\n```\n\n如果你运行该程序，你将在控制台上看到这些：\n\n```\n (0, 0)\n(12.3, 244.4)\n```\n\n\
  ## 总结\n\n泛型能够在编译时实现更严格的类型检查。特别是配合 `System.Collections.Generic` 命名空间的成员使用，泛型做了两个贡献。首先，它们在编译时为集合类型添加了类型检查，使得集合包含的对象类型被限制为传递给它的类型。例如，你现在可以创建一个存储字符串的\
  \ `System.Collections.Generic.List` 实例，它不会接受 `Integer` 或其他类型。其次，泛型消除了从集合中检索元素时进行类型转换的需要。\n\
  \n在本章中，你还学习了向泛型类型传递不同的类型变量会导致不同的类型。这意味着 `List<String>` 与 `List<Object>` 是不同的类型。尽管\
  \ `System.String` 是 `System.Object` 的子类，但将 `List<String>` 传递给期望 `List<Object>` 的方法会导致编译错误。\n\
  \n最后，你看到编写泛型类型与编写普通的 C# 类型并没有区别。你只需要在类型名后的尖括号中声明一组类型变量。然后你将这些类型变量作为方法返回值的类型或方法参数的类型。\n\
  \n# 第 14 章：集合\n\n在编写面向对象的程序时，你经常需要处理一组对象。在第 5 章“核心类”中，你学习了数组可以用于对象分组并遍历元素。遗憾的是，数组缺乏你快速开发应用程序所需的灵活性。其一是不能调整大小。幸运的是，`.NET\
  \ Framework` 提供了一接口和类，使得处理对象组变得更容易。这些接口和类是 `System.Collections` 命名空间及其子命名空间的一部分。`System.Collections`\
  \ 包含了非泛型类型，这些类型很大程度上被 `System.Collections.Generic` 命名空间中的泛型类型取代了。本章讨论 `System.Collections.Generic`\
  \ 中最常用的类型。\n\n## 概述\n\n集合是一个将其他分组的对象。也称为容器，它提供了存储、检索和操作其元素的方法。集合帮助 C# 程序员轻松地管理对象。\n\
  \nC# 程序员应该熟悉 `System.Collections.Generic` 命名空间中最重要的类型。该命名空间中有几十个类、结构体接口，由于空间限制，这里将讨论重要的部分：`List`、`HashSet`、`Queue`\
  \ 和 `Dictionary`。\n\n`List`、`HashSet` 和 `Queue` 是相似的，它们都用于存储相同类型的对象。`Dictionary`\
  \ 适合存储键/值对。这些类型将在接后的章节中讨论。\n\n## List 类\n\n`List` 类似于数组，但具有更高的灵活性。当你创建一个数组时，必须指定一个无法更改的大小。而使用\
  \ `List`，指定大小是可选的。当你向 `List` 中添加元素时，如果没有足够的空间存放新元素，它的容量会自动增长。\n\n`List` 是一个泛型类，因此你需要告诉编译器你想在其中存储什么种对象。以下是创建字符串\
  \ `List` 的方法：\n\n```\n List<string> animals = new List<string>();\n```\n\n或者，如果你觉得需要，可以为你的\
  \ `List` 指定大小。以下是指定初始容量为 10 的方法。\n\n```\n List<string> animals = new List<String>(10);\n\
  ```\n\n在两种情况下，如果你添加的元素多于现有容量，`List` 将自动增加其容量。然而，如果你预先知道将在 `List` 中存储多少元素，将初始容量指定为最大数量是一个好主意。这样，你就可以避免调整\
  \ `List` 大小的时间。\n\n你在 `List` 上最频繁执行的操作是添加元素、检索元素、查找有多少个元素以及遍历其元素。\n\n要向 `List` 添加元素，调用其\
  \ `Add` 方法。要查询 `List` 中有多少个对象，调用其 `Count` 属性。注意 `Count` 与 `Capacity` 属性不同。`Capacity`\
  \ 告诉你 `List` 的容量。你很少需要知道某一时刻 `List` 的容量，因为它可以自动增加。\n\n要从 `List` 中检索元素，使用它的 `Item`\
  \ 属性。记住，你通过向 `List` 变量传递索引来调用此属性，就像它是一个数组一样，如下：\n\n```\n myList[0]\n```\n\n第一个元素由索引\
  \ 0 表示，第二个由 1 表示，依此类推。\n\n最后，要遍历 `List` 中的所有元素，使用 `foreach` 循环。\n\n```\n foreach\
  \ (T element in myList)\n{\n    // 对 element 执行某些操作\n}\n```\n\n你将在本节后面的示例中学习更多关于这些方法和属性。\n\
  \n## 更多重要方法\n\n以下是 `List` 中一些重要的方法。\n\n```\n public void Add(T item)\n```\n\n向 `List`\
  \ 添加一个新对象。所添加的项可能为空，并将放置在列表末尾。将其与 `Insert` 方法比较。\n\n```\n public void Clear()\n\
  ```\n\n从 `List` 中删除所有元素并将 `Count` 属性置为 0。\n\n```\n public bool Contains(T item)\n\
  ```\n\n查询 `List` 中是否存在某个项，如果是则返回 true。否则，返回 false。\n\n```\n public T Find(Predicate<T>\
  \ match)\n```\n\n搜索 `List` 并返回第一个符合条件的元素。\n\n```\n public void Insert(int index,\
  \ T item)\n```\n\n在指定的索引处添加项。\n\n```\n public bool Remove(T item)\n```\n\n从 `List`\
  \ 中移除指定的项。如果成功移除该项，则返回 true。否则，返回 false。\n\n```\n public void RemoveAt(int index)\n\
  ```\n\n移除指定索引处的项。将 0 传递给此方法将移除列表中的第一个项。\n\n```\n public void Sort()\n```\n\n使用默认比较器排序\
  \ `List`。\n\n\n\n\n\n```c\n public T[] ToArray()\n```\n\n将元素作为数组返回。\n\n## List 示例\n\
  \n列表 14.1 显示了使用 `List` 存储字符串并使用 `foreach` 迭代它们的示例。\n\n列表 14.1：`List` 示例\n\n```c\n\
  \ namespace ListExamples\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            List<string> titles = new List<string>();\n    \
  \        titles.Add(\"No Sun No Moon\");\n            titles.Add(\"The Desert Story\"\
  );\n            titles.Add(\"Belle!\");\n\n            string selectedTitle = titles[1];\n\
  \            Console.WriteLine(\"Selected: \" + selectedTitle);\n            Console.WriteLine();\n\
  \n            foreach (string title in titles)\n            {\n                Console.WriteLine(\"\
  title: \" + title);\n            }\n\n            Console.ReadKey();\n        }\n\
  \    }\n}\n```\n\n运行此类的结果如下所示。\n\n```\n Selected: The Desert Story\n\ntitle: No\
  \ Sun No Moon\ntitle: The Desert Story\ntitle: Belle!\n```\n\n## HashSet 类\n\n集合（set）是一种可以存储无特定顺序值且不允许重复值的数据结构。哈希集合（hash\
  \ set）是使用哈希表实现的集合（集合也可以通过其他方式实现）。`hash` 一是指用于计算元素索引的函数，以便能够快速检索元素。\n\n在 .NET Framework\
  \ 中，`HashSet` 类表示哈希集合。`HashSet` 与 `List` 类似，拥有 `Add` 和 `Clear` 方法，其作用与 `List` 中的\
  \ `Add` 和 `Clear` 方法相似，并且有一个 `Count` 属性返回 `HashSet` 中的元素数量。然而，与 `List` 不同，`HashSet`\
  \ 不允许重复。此外，你无法在特定索引处添加或删除项。甚至没有用于检索指定位置元素的 `Item` 属性。\n\n另一方面，`HashSet` 提供了处理集合有用的方法，例如\
  \ `IsSubsetOf` 和 `IsSuperSetOf`。\n\n## 有用方法\n\n以下是 `HashSet` 中一些重要的方法。\n\n```csharp\n\
  \ public bool Add(T item)\n```\n\n向 `HashSet` 添加新对象。如果添加的 `item` 已经存在于 `HashSet`\
  \ 中，则不会再次添加，且该方法将返回 `false`。\n\n```csharp\n public void Clear()\n```\n\n从 `HashSet`\
  \ 中删除所有元素并将 `Count` 属性设置为 0。\n\n```csharp\n public bool Contains(T item)\n```\n\n\
  确定项是否在 `HashSet` 中，如果是则返回 `true`。否则返回 `false`。\n\n```csharp\n public bool IsSubsetOf(IEnumerable\
  \ other)\n```\n\n确定 `HashSet` 是否为指定集合的子集。\n\n```csharp\n public bool IsSupersetOf(IEnumerable\
  \ other)\n```\n\n确定 `HashSet` 是否为指定集合的超集。\n\n## HashSet 示例\n\n列表 14.2 中的代码显示了如何使用\
  \ `HashSet` 添加字符串。尝试尝试添加重复项时，查看 `Add` 方法返回什么。\n\n列表 14.2：`HashSet` 示例\n\n```csharp\n\
  \ using System;\nusing System.Collections.Generic;\n\nusing System;\nusing System.Collections.Generic;\n\
  \nnamespace HashSetExamples\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            HashSet<string> productCodes = new HashSet<string>();\n\
  \            bool added = productCodes.Add(\"1234\");\n            Console.WriteLine(\"\
  1234 added? \" + added);\n\n            // 重复，这不会被添加\n            added = productCodes.Add(\"\
  1234\"); \n            Console.WriteLine(\"1234 added? \" + added);\n          \
  \  added = productCodes.Add(\"999\");\n            Console.WriteLine(\"999 added?\
  \ \" + added);\n\n            Console.WriteLine(\"\\nProduct Codes:\");\n      \
  \      foreach (string productCode in productCodes)\n            {\n           \
  \     Console.WriteLine(\"product code: \" + productCode);\n            }\n    \
  \        Console.ReadKey();\n        }\n    }\n}\n```\n\n运行程序将在控制台上显示此内容。\n\n```\n\
  \ 1234 added? True\n1234 added? False\n999 added? True\n\nProduct Codes:\nproduct\
  \ code: 1234\nproduct code: 999\n```\n\n## Queue 类\n\n`Queue` 是一种类似于 `List` 和 `HashSet`\
  \ 的集合。`Queue` 的独特之处在于，你可以使用 `Dequeue` 方法同时检索并移除元素。若要检索元素而不删除它，请使用 `Peek` 方法。`Queue`\
  \ 是先进先出（FIFO）系统。\n\n## 有用方法\n\n以下是在 `Queue` 中定义的的一些的一些重要方法。\n\n```csharp\n public\
  \ void Enqueue(T item)\n```\n\n向 `Queue` 的末尾添加新元素。\n\n```csharp\n public void Clear()\n\
  ```\n\n从 `Queue` 中删除所有元素并将 `Count` 属性设置为 0。\n\n```csharp\n public bool Contains(T\
  \ item)\n```\n\n确定项是否在 `Queue` 中，如果是则返回 `true`。否则返回 `false`。\n\n```csharp\n public\
  \ T Dequeue()\n```\n\n返回 `Queue` 开头的元素并将其移除。\n\n```csharp\n public T Peek()\n```\n\
  \n返回 `Queue` 开头的元素但不将其移除。\n\n## Queue 示例\n\n例如，考虑列表 14.3 中的代码，该代码使用 `Queue` 来添加字符串。\n\
  \n列表 14.3：`Queue` 示例\n\n```csharp\n using System;\nusing System.Collections.Generic;\n\
  \nnamespace QueueExamples\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Queue<string> cities = new Queue<string>();\n  \
  \          cities.Enqueue(\"Ottawa\");\n            cities.Enqueue(\"Ottawa\");\n\
  \            cities.Enqueue(\"Helsinki\");\n\n            foreach (string city in\
  \ cities)\n            {\n                Console.WriteLine(\"city: \" + city);\n\
  \            }\n\n            while (cities.Count > 0)\n            {\n        \
  \        Console.WriteLine(\"selected: \" + cities.Dequeue());\n            }\n\n\
  \            Console.ReadKey();\n        }\n    }\n}\n```\n\n运行程序后，控制台上会显示以下消息。\n\
  \n```\n city: Ottawa\ncity: Ottawa\ncity: Helsinki\nselected: Ottawa\nselected:\
  \ Ottawa\nselected: Helsinki\n```\n\n## Dictionary 类\n\n`Dictionary` 类是创建接收键/值对容器的模板。`Dictionary`\
  \ 适用于存储每个由键和一个值组成的元素，例如 ISBN 和 `Book` 对象，或国家和首都。\n\n要构造 `Dictionary`，你向其构造函数传递键的类型和值的类型。例如，以下代码段创建了一个以\
  \ `string` 为键、以 `Book` 对象为值的 `Dictionary`。\n\n```csharp\n Dictionary books = new\
  \ Dictionary(string, Book);\n```\n\n与其他类型的集合一样，你拥有一个 `Add` 方法向 `Dictionary` 添加键/值对，并有一个\
  \ `Clear` 方法移除其所有元素。\n\n要检索值，请使用其 `Item` 属性。例如，如果 `Dictionary` 包含国家/首都对，使用此语法来检索值：\n\
  \n```csharp\n string selectedCountry = countryDictionary[countryName];\n```\n\n\
  ## Dictionary 示例\n\n例如，考虑列表 14.4 中的代码，它展示了用于存储国家/首都对的 `Dictionary`。\n\n列表 14.4：Dictionary\
  \ 示例\n\n```csharp\n using System;\nusing System.Collections.Generic;\n\nnamespace\
  \ DictionaryExamples\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Dictionary<string, string> capitals = \n       \
  \             new Dictionary<string, string>();\n            capitals.Add(\"France\"\
  , \"Paris\");\n            capitals.Add(\"Australia\", \"Canberra\");\n        \
  \    capitals.Add(\"Canada\", \"Ottawa\");\n\n            Console.WriteLine(capitals[\"\
  Canada\"]); \n            // 打印 \"Ottawa\"\n\n            Console.ReadKey();\n \
  \       }\n    }\n}\n```\n\n运行列表 14.4 中的程序将得到此输出。\n\n```\n Ottawa\n```\n\n## 总结\n\
  \n\n\n\n集合（Collections）非常适合处理一组对象。`.NET Framework` 类库提供了许多你可以轻松使用的集合类型。`.NET Framework`\
  \ 1.0 版本在 `System.Collections` 命名空间中提供了集合类型。随着 `.NET 2.0` 将泛型作为特性引入，它也带来了参数化的集合类型，这些类型可以在\
  \ `System.Collections.Generic` 命名空间中找到。你应该始终使用 `System.Collections.Generic` 中的成员，而不是\
  \ `System.Collections` 中的成员。在本章中，你学习了 `System.Collections.Generic` 命名空间最重要的四个成员：`List`、`HashSet`、`Queue`\
  \ 和 `Dictionary`。\n\n# 第 15 章：输入/输出\n\n输入/输出（I/O）是程序执行的最常见操作之一。I/O 操作的示例包括：\n\n\
  - 创建和删除文件\n- 从文件或网络套接字读取并写入\n- 将对象序列化（或保存）到持久性存储中并检索已保存的对象\n\n自 `.NET Framework\
  \ 1.0` 以来，通过 `System.IO` 命名空间及其子命名空间的形式就已经支持 I/O。本章将根据功能介绍主题，并选取 `System.IO` 命名空间中最重要的成员。\n\
  \n文件和目录的处理与操作是本章的第一个主题。在这里你将学习如何创建和删除文件及目录，以及如何操作它们的属性。接下来，你将在“输入/输出流”节中学习什么是流以及如何使用它。流就像水水管，有助于数据传输。对流的读取和写入要求必须按顺序进行，这意味着要读取第二个数据单元，必须先读取第一个。流有多种类型。`FileStream`、`NetworkStream`\
  \ 和 `MemoryStream` 是流的一些示例。为了方便起，还有用于操作这些流的实用类，让你不需要直接使用它们。我们也会查看这些实用类。\n\n# 文件和目录的处理与操作\n\
  \n`.NET Framework` 类库带有 `File` 和 `Directory` 类分别用于创建和删除文件及目录。此外，通过 `File` 和 `Directory`，你可以操作文件或目录，例如检查文件/目录是否存在。此外，还有一个\
  \ `FileSystemInfo` 类，它是 `FileInfo` 和 `DirectoryInfo` 的父类。`FileInfo` 提供了 `File` 中的许多功能，而\
  \ `DirectoryInfo` 提供了执行 `Directory` 方法相同功能的方法。对于初学者来说，选择使用哪一个有时会困惑。\n\n以下小节详细说明了你可以使用\
  \ `File` 和 `Directory` 执行的操作。\n\n## 创建和删除文件\n\n要创建文件，使用 `System.IO.File` 的 `Create`\
  \ 方法。其方法签名如下：\n\n```\npublic static FileStream Create(string path)\n```\n\n例如，以下代码段创建一个文件并将其分配给\
  \ `FileStream`：\n\n```\nstring fileName = @\"C:\\users\\jayden\\wintemp.txt\";\n\
  try\n{\n    FileStream fs = File.Create(fileName);\n}\ncatch (IOException e)\n{\n\
  \    Console.WriteLine(e.Message);\n}\nfinally\n{\n    // 在此处调用 fs.Close()\n}\n\
  ```\n\n如果要创建的文件已存在，`Create` 方法将用新文件覆盖文件。此外，大多数情况下，你需要将 `File.Create` 放在 `try` 块中，因为如果操作失败（例如没有权限在指定目录中创建文件），它将抛出\
  \ `IOException`。\n\n处理 `File` 的更方便的语法是使用像这样的 `using` 语句：\n\n```\nusing (FileStream\
  \ fs = File.Create(fileName))\n{\n    // 在此处对 FileStream 进行某些操作\n}\n```\n\n使用这种语法，你不需要担心关闭它，因为\
  \ `using` 语句会处理它。然而，如果 `Create` 方法未能创建文件，可能会抛出异常。因此，即使使用 `using` 语句，你仍然需要将代码封装在这样的\
  \ `try` 块中：\n\n```\ntry\n{\n    using (FileStream fs = File.Create(fileName))\n\
  \    {\n        // 在此处对 FileStream 进行某些操作\n    }\n}\ncatch (Exception e)\n{\n  \
  \  // 处理异常\n}\n```\n\n## 创建和删除目录\n\n`System.IO.Directory` 类提供了用于创建和删除目录及子目录的静态方法。要创建目录，使用\
  \ `CreateDirectory` 方法。\n\n```\npublic static DirectoryInfo CreateDirectory(string\
  \ path)\n```\n\n`CreateDirectory` 返回一个 `DirectoryInfo`，它暴露了许多目录属性，例如创建时间、最后访问时间等。此外，`DirectoryInfo`\
  \ 类提供了检索和操作当前目录中文件的方法。你将在本章稍后的“处理文件和目录属性”节中学习更多关于 `DirectoryInfo`类的知识。\n\n如果操作未成功完成，`CreateDirectory`\
  \ 可能会抛出异常。例如，如果没有权限执行任务，方法将抛出 `UnauthorizedAccessException`。同样，尝试创建一个与现有文件相同路径的目录将抛出\
  \ `IOException`。\n\n要删除目录，使用 `Directory` 类的 `Delete` 方法。该方法有两个重载：\n\n```\npublic\
  \ static void Delete(string path)\npublic static void Delete(string path, boolean\
  \ recursive)\n```\n\n使用第一个重载时，目录必须是可写且为空的。尝试删除非空目录将抛出 `IOException`。然而，使用第二个重载时，如果你将\
  \ `true` 作为第二个参数，就可以删除非空目录。请注意，如果目录包含只读文件，第二个重载将失败。\n\n## 处理文件和目录属性\n\n`FileInfo`\
  \ 和 `DirectoryInfo` 类分别用于处理文件和目录。通过 `FileInfo`，你可以创建和删除文件，尽管代码没有比使用 `File` 类时那么简洁。以下是使用\
  \ `FileInfo` 创建文件的方法。你首先需要创建一个 `FileInfo` 实例。\n\n```\nString path = @\"C:\\temp\\\
  note.txt\";\nFileInfo fileInfo = new FileInfo(path);\nusing (FileStream fileStream\
  \ = fileInfo.Create())\n{\n    // 对 fileStream 进行某些操作\n}\n```\n\n选择 `FileInfo` 而不是\
  \ `File` 有其好处。例如，你可以通过调用 `FileInfo` 上的 `Extension` 属性轻松获取文件扩展名。此外，你可以通过调用 `Parent`\
  \ 属性获取 `FileInfo` 的父目录。更不用说它的 `Length` 属性返回以字节为的文件的大小，`CreationTime` 返回创建时间，`ReadOnly`\
  \ 表示文件是否为只读，而 `Exists` 返回指示文件存在的布尔值。\n\n最后一个属性 `Exists` 可能会引起你的注意。如果你已经创建了一个指向该文件的\
  \ `FileInfo`，文件怎么不存在呢？事实是，创建 `FileInfo` 只是在内存中创建一个对象，并没有创建文件。你仍然需要调用 `Create` 来创建文件。当然，如果你在创建\
  \ `FileInfo` 时传递了现有文件的路径，它的 `Exists` 属性将返回 `true`。\n\n`DirectoryInfo` 类与 `FileInfo`\
  \ 类似，并提供类似的属性集，例如 `CreationTime`、`Exists`、`Extension` 和 `Parent`。`DirectoryInfo`\
  \ 还提供了创建和删除目录、获取子目录列表以及检索目录中文件列表的方法。以下是 `GetFiles` 的签名，它返回一个 `FileInfo` 数组：\n\n\
  ```\npublic FileInfo[] GetFiles()\n```\n\n这里是 `GetDirectories` 的签名，它返回一个 `DirectoryInfo`\
  \ 数组，每个元素代表当前目录的子目录。\n\n```\npublic FileInfo[] GetDirectories()\n```\n\n## 列出目录中的文件\n\
  \n获取目录文件列表最简单的方法是使用 `Directory` 类的 `GetFiles` 方法。以下是打印 C 盘所有文件的代码。\n\n\n\n\n```cs\n\
  \ string[] paths = Directory.GetFiles(@\"C:\\\");\nforeach (string path in paths)\n\
  {\n    Console.WriteLine(path);\n}\n```\n\n注意 `Directory.GetFiles` 返回的是一个 `string`\
  \ 数组。数组中的每个元素都包含文件的完整路径，例如 `C:\\markets.doc`。\n\n或者，你也可以创建一个 `DirectoryInfo` 对象并调用它的\
  \ `GetFiles` 方法，如下所示：\n\n```cs\n DirectoryInfo directoryInfo = new DirectoryInfo(\"\
  C:\\\\\");\nFileInfo[] files = directoryInfo.GetFiles();\nforeach (FileInfo file\
  \ in files)\n{\n    Console.WriteLine(file.Name);\n}\n```\n\n`DirectoryInfo.GetFiles`\
  \ 返回一个 `FileInfos` 数组，与返回 `string` 数组的 `Directory.GetFiles` 不同。\n\n## 复制和移动文件\n\n\
  复制文件非常简单。你可以通过调用 `File` 类上的静态方法 `Copy` 来创建文件的副本。例如，以下单行代码将 `C:\\temp` 中的 `market.pdf`\
  \ 复制到 `C:\\temp` 中的 `market2.pdf`。\n\n```cs\n File.Copy(@\"C:\\temp\\market.pdf\"\
  , @\"C:\\temp\\market2.pdf\");\n```\n\n要移动文件，请使用 `File` 中的静态方法 `Move`。这段代码片段将 `C:\\\
  temp\\research.pdf` 移动到 `C:\\research.pdf`。\n\n```cs\n File.Move(@\"C:\\temp\\research.pdf\"\
  , @\"C:\\research.pdf\");\n```\n\n## 输入/输出流\n\nI/O 流（Streams）可以被比作水管。就像水管将城市房屋连接到水库一样，流将\
  \ C# 代码连接到“数据水库”。这个“数据水库”被称为 `sink`（汇点），它可以是一个文件、网络套接字或内存。流的好处在于，你可以使用统一的方式在不同的汇点之间传输数据，从而简化了你的代码。你只需要构建正确的流即可。\n\
  \n所有的流都派自抽象类 `System.IO.Stream`。你并不直接与 `Stream` 操作，而是使用它的后类之一，如 `FileStream`、`MemoryStream`\
  \ 或 `NetworkStream`。你在上一节中已经见过 `FileStream` 的运行。例如，当你使用 `File.Create` 创建文件时，系统会为你创建一个\
  \ `FileStream`，允许你向文件写入内容。\n\n直接处理流是困难的，因为你必须自己管理数据流。幸运的是，`System.IO` 命名空间提供了几个实用类来处理流。每个实用类都属于两类之一：它们是读取器（reader）或者是写入器（writer）。\n\
  \n以下是最常用的读取器和写入器：\n\n*   `StreamReader`：用于从流中读取字符的实用类。\n*   `StreamWriter`：用于向流写入字符的实用类。\n\
  *   `BinaryReader`：用于从流中读取二进制数据的实用类。\n*   `BinaryWriter`：用于向流写入二进制数据的实用类。\n\n所有这些读取器和写入器类都接受\
  \ `Stream` 作为构造函数的参数，因此你只需要确保在创建读取器或写入器时传递正确的流即可。例如，如果你想读取文本文件，你需要获取一个指向该文件的 `FileStream`。通常情况下，当你调用\
  \ `File` 类中的某个方法（如 `Create`）时，系统会为你创建一个 `FileStream`。此外，`File` 类中的方法可能已经返回了一个读取器或写入器，而无需你显式创建\
  \ `FileStream`。例如，`File` 类的 `OpenText` 方法返回一个与底层文件关联的 `StreamReader`。\n\n接下来的章节将展示如何从文件中读写字符和二进制数据。\n\
  \n## 读取文本（字符）\n\n你使用 `StreamReader` 类从流中读取字符。大多数情况下，你会处理文件流，因为它们是最流行的流类型。然而，还有其他类型的流，例如网络流和内存流。\n\
  \n你可以通过向其构造函数传递 `Stream` 来创建一个 `StreamReader`：\n\n```cs\n StreamReader streamReader\
  \ = new StreamReader(stream);\n```\n\n然而，你可能不需要显式地创建 `StreamReader`。例如，`File` 类的\
  \ `OpenText` 方法返回一个与 `FileStream` 关联的 `StreamReader`。因此，你可以调用 `OpenText` 并获取一个 `StreamReader`，如下：\n\
  \n```cs\n StreamReader reader = File.OpenText(path)\n```\n\n这与创建一个 `FileStream`\
  \ 并将其传递给 `StreamReader` 类的构造函数是相同的：\n\n```cs\n FileStream fileStream = [创建/获取一个\
  \ FileStream];\nStreamReader streamReader = new StreamReader(fileStream);\n```\n\
  \n无论你如何创建 `StreamReader`，一旦你拥有了实例，就可以调用各种 `Read` 方法。该方法返回下一个字符。其签名如下：\n\n```cs\n\
  public override int Read()\n```\n\n一次读取一个字符可能不是最高效的方法。通常，你希望一次性读取许多字符。为了这一点，你可以使用\
  \ `Read` 的这个重载：\n\n```cs\npublic override int Read(char[] buffer, int index, int\
  \ count)\n```\n\n在这种情况下，`buffer` 包含要读取的字符，`index` 指明数组中的起始元素，而 `count` 指明缓冲区中要写入的字符数。该方法返回实际读取的字符数。\n\
  \n```cs\n StreamReader streamReader = ...\nchar[] buffer = new char[100];\nstreamReader.Read(buffer,\
  \ 0, 100);\n```\n\n还有一个 `ReadLine` 方法，它从流中读取一行文本并将其作为字符串形式返回。其签名如下：\n\n```cs\npublic\
  \ override string ReadLine()\n```\n\n列表 14.1 显示了从文件中读取字符的代码。\n\n列表 14.1：从文件中读取字符\n\
  \n```cs\nusing System;\nusing System.IO;\n\nnamespace StreamReaderExample\n{\n \
  \   class Program\n    {\n        static void Main(string[] args)\n        {\n \
  \           String path = \"C:\\\\temp\\\\today.txt\";\n            try\n      \
  \      {\n                using (StreamReader reader = File.OpenText(path))\n  \
  \              {\n                    string line;\n                    // 读取并显示文件中的行\n\
  \                    while ((line = reader.ReadLine()) != null)\n              \
  \      {\n                        Console.WriteLine(line);\n                   \
  \ }\n                }\n            }\n            catch (IOException e)\n     \
  \       {\n                Console.Write(e.Message);\n            }\n\n        \
  \    Console.ReadKey();\n        }\n    }\n}\n```\n\n列表 14.1 中的代码打开 `C:\\temp` 中的\
  \ `today.txt` 文件，并读取并打印文件中的每一行文本。要测试此代码，请确保在上述目录中创建了 `today.txt` 文件。\n\n## 写入文本（字符）\n\
  \n要向流写入文本或字符，请使用 `StreamWriter` 类。该类为各种数据类型提供了十几个 `Write` 方法，因此没有需要先将非字符串转换为字符串。其中有一个用于\
  \ `Single`，一个用于 `Uint32`，一个用于 `char` 等，以此此类推。以下是 `Write` 方法的一些签名：\n\n```cs\npublic\
  \ virtual void Write(bool value)\npublic virtual void Write(char value)\npublic\
  \ virtual void Write(int value)\npublic virtual void Write(double value)\npublic\
  \ virtual void Write(string value)\n```\n\n还有一个重载允许你在一次单次操作中写入块字符：\n\n```cs\npublic\
  \ virtual void Write(char[] buffer, int index, int count)\n```\n\n在这种情况下，`buffer`\
  \ 包含要写入的字符，`index` 指明数组中的起始元素，而 `count` 指明缓冲区中要写入的字符数。\n\n还有接受一个值的 `WriteLine` 方法。该方法会在值的末尾添加一个换行符。以下是\
  \ `WriteLine` 方法重载的签名。\n\n\n\n\n\n```\npublic virtual void WriteLine()\npublic virtual\
  \ void WriteLine(bool value)\npublic virtual void WriteLine(char value)\npublic\
  \ virtual void WriteLine(int value)\npublic virtual void WriteLine(double value)\n\
  public virtual void WriteLine(string value)\n```\n\n第一个不带参数的重载用于向流中添加行终止符。\n\n列表\
  \ 14.2 中的代码从控制台接收输入并写入文件。它会持续读取，直到用户输入空字符串。\n\n列表 14.2：向文件写入文本\n\n```\nusing System;\n\
  using System.IO;\n\nnamespace StreamWriterExample\n{\n    class Program\n    {\n\
  \        static void Main(string[] args)\n        {\n            Console.WriteLine(\n\
  \                \"Please type in some text. \" + \n                \"Keep typing\
  \ until you're tired.\" + \n                \"Enter an empty line to exit\");\n\
  \            using (StreamWriter writer = \n                new StreamWriter(@\"\
  C:\\temp\\yoursay.txt\"))\n            {\n                String input = Console.ReadLine();\n\
  \                while (input.Trim().Length != 0)\n                {\n         \
  \           writer.WriteLine(input);\n                    input = Console.ReadLine();\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n## 读取和写入二进制数据\n\n\
  要从文件中读取二进制数据，你可以使用 `BinaryReader` 类。创建一个 `BinaryReader` 非常简单，你只需要向它的构造函数传递一个流：\n\
  \n```\nBinaryReader reader = new BinaryReader(stream);\n```\n\n然后，调用它的其中一个 `Read`\
  \ 方法。例如，读取一个整数，调用它的 `ReadInt16` 或 `ReadInt32` 方法。读取双精度浮点数调用 `ReadDouble` 方法。`BinaryReader`\
  \ 的其他方法包括 `ReadBoolean`、`ReadChar`、`ReadByte`、`ReadDecimal`、`ReadInt64` 和 `ReadString`。\n\
  \n要向文件写入二进制数据，使用 `BinaryWriter`。和 `BinaryReader` 一样，`BinaryWriter` 的实例化也非常简单。你只需要向它的构造函数传递一个流：\n\
  \n```\nBinaryWriter writer = new BinaryWriter(stream);\n```\n\n`BinaryWriter` 提供了许多\
  \ `Write` 方法重载。事实上，每种数据类型都有对应的 `Write` 方法，因此你可以写入整数、双精度、十进制数等。\n\n列表 14.3 中的示例显示了如何将十个整数写入\
  \ `C:\\temp` 中的 `numbers.dat` 文件并将其读回。\n\n列表 14.3：读取和写入二进制数据\n\n```\nusing System;\n\
  using System.IO;\n\nnamespace BinaryReaderWriterExample\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            string path\
  \ = @\"C:\\temp\\numbers.dat\";\n            Random random = new Random();\n   \
  \         FileStream fileStream = File.OpenWrite(path);\n            using (BinaryWriter\
  \ writer =  \n                    new BinaryWriter(fileStream))\n            {\n\
  \                for (int i = 0; i < 10; i++)\n                {\n             \
  \       writer.Write(random.Next(0, 100));\n                }\n            }\n\n\
  \            fileStream = File.OpenRead(path);\n            using (BinaryReader\
  \ reader =  \n                    new BinaryReader(fileStream))\n            {\n\
  \                for (int i = 0; i < 10; i++)\n                {\n             \
  \       int number = reader.ReadInt32();\n                    Console.WriteLine(number);\n\
  \                }\n            }\n\n            Console.ReadKey();\n        }\n\
  \    }\n}\n```\n\n如果你运行程序，你将看到 0 到 100 之间的十个数字。每次运行程序，你都会看到一组不同的数字，因为每个数字都是使用 `Random`\
  \ 对象随机生成的。\n\n## 总结\n\n输入/输出操作通过 `System.IO` 命名空间中的成员支持。文件和目录的处理与操作通过 `File`、`Directory`、`FileInfo`\
  \ 和 `DirectoryInfo` 类完成。数据的读写通过流实现。在本章中，你学习了如何使用这些类从文件中读写字符和二进制数据：`StreamReader`、`StreamWriter`、`BinaryReader`\
  \ 和 `BinaryWriter`。\n\n# 第 16 章\n\n# 高级语言特性\n\nC# 是一种非常强大的语言，具有许多优秀的特性。本章将讨论该语言中书中其他地方未涉及过的重要特性。\n\
  \n## 委托 (Delegates)\n\n`delegate` 从 2.0 版本起就是 C# 语言的一部分，毫无疑问，它是 .NET 中最难理解的类型。`Delegates`\
  \ 类似于 C 和 C++ 中的函数指针。然而，与 C/C++ 函数指针不同，委托是类型安全的。如果你不知道 C 或 C++，你可能需要多读几遍才能很好地理解委托。我将先解释为什么可能需要委托，然后讨论该术语本身的定义并提供几个示例。\n\
  \n假设你想让一个方法（`Method1`）在第一个方法执行完成后调用另一个方法（`Method2`）。即使不使用委托，你也可以轻松地实现：\n\n```\n\
  public virtual void Method1()\n{\n    // 执行一些事情\n    ...\n    // 然后调用 Method2\n\
  \    Method2();\n}\n\npublic void Method2()\n{\n    ...\n}\n```\n\n这很容易，因为你控制了 `Method1`\
  \ 和 `Method2` 的源代码。但是，假设 `Method1` 是类库中的一个方法，你显然无法修改它。你如何让 `Method1` 调用 `Method2`\
  \ 呢？\n\n你可能会说，这有什么大不了的？在很多情况下，如果你想在另一个方法之后调用一个方法，只需在代码中调用这两个方法即可。即使这两个方法是在不同的类中实现的，也很容易。例如，下面的代码段假设\
  \ `Method1` 是 `Type1` 的一部分，而 `Method2` 是 `Type2` 的一部分。让 `Method2` 在 `Method1` 之后执行很容易：\n\
  \n```\npublic void Main()\n{\n    Type1 object1 = new Type1();\n    Type2 object2\
  \ = new Type2();\n    object1.Method1();\n    object2.Method2()\n}\n```\n\n那么，为什么需要委托呢？\n\
  \n问题在于，在某些情况下，方法需要的不是由自己的代码调用，而是由另一个模块甚至系统调用。例如，你可能希望在 GUI 应用程序中响应按钮点击执行某些操作。在这种情况下，你不能使用传统方法，因为在编写系统时，系统开发者并预先知道点击按钮时应该调用哪个（或哪些）方法。但是他们意识到系统的用户可能希望在响应按钮点击时执行某些操作，他们通过创建一个委托类型来实现了这一点。为了在点击按钮时调用你的方法，你需要创建一个引用你方法的委托类型实例。系统随后可以通过该委托实例调用你的方法。\n\
  \n按钮点击示例是委托的一种用途，即作为事件监听器。委托的另一种用途是作为回调（callback）。回调是作为参数传递给其他代码的方法。其他代码随后可以在某个方便的时间回调（执行）传入的方法。这种调用可能是立即发生的（如同步回调），也可能在稍后的时间发生（如异步回调）。\n\
  \n从概念上讲，委托是一种机制，允许调用者在没有预先知道要调用的方法的情况下也能调用该方法。\n\n从技术上讲，委托是一种引用方法的类型。声明委托类型类似于声明方法签名，你需要一个名称、参数列表和一个返回值。委托的声明非常重要，因为它决定了委托可以引用的方法类型。委托实例可以引用的方法必须与委托类型本身的签名相同。\n\
  \n要声明委托类型，使用 `delegate` 关键字。这里有一个示例委托。它被称为 `MyDelegate`，接收一个字符串且没有返回值。\n\n```\n\
  public delegate void MyDelegate(string s1)\n```\n\n你可以通过使用 `new` 运算符或将方法赋值给委托变量来实例化委托。因此，这两行代码是等价的：\n\
  \n\n\n\n\n```\n MyDelegate delegate1 = new MyDelegate(myMethod);\nMyDelegate delegate1\
  \ = myMethod;\n```\n\n在这种情况下，`myMethod` 必须是一个签名与委托类型完全相同的方法。一旦你有了委托实例，就可以将其传递给调用者。\n\
  \n## 注意\n\n在讨论委托时，我们讨论的是两个不同的概念。第一个是**委托类型**，它定义了委托类型实例可以引用的方法类型。第二个是**委托实例**，它是根据委托类型创建的对象，并引用一个或多个方法。\n\
  \n## 委托示例\n\n下面的示例说明了如何将委托作为回调使用。列表 16.1 显示了一个类，该类包含一个根据给定的 Internet 地址下载网页的方法。它还声明了一个名为\
  \ `ResultHandler` 的委托，该方法将在方法执行完毕后调用它。\n\n列表 16.1：`Downloader` 类和 `ResultHandler`\
  \ 委托\n\n```\n namespace DelegateExample\n{\n    using System.Net;\n\n    public\
  \ delegate void ResultHandler(string text);\n\n    public class Downloader\n   \
  \ {\n        public void Download(string url, ResultHandler handler)\n        {\n\
  \            string content;\n            using (WebClient webClient = new WebClient())\n\
  \            {\n                content = webClient.DownloadString(url);\n     \
  \       }\n            handler(content);\n        }\n    }\n}\n```\n\n列表 16.1 中的\
  \ `Download` 方法接受两个参数。第一个参数是 `URL`，第二个参数是一个委托，它将在获取 `URL` 所指向的网页后被调用。下载操作本身由 `System.Net.WebClient`\
  \ 类执行。\n\n在 `Download` 方法结束时，委托实例被调用，方式就像你调用方法一样。\n\n```\n handler(content);\n```\n\
  \n要使用 `Downloader` 类，你需要传递一个签名与 `ResultHandler` 委托类型相同的方法。列表 16.2 显示了使用该类的代码。\n\n\
  列表 16.2：使用 `ResultHandler` 委托\n\n```\n using System;\nusing DelegateExample;\n\n\
  namespace AdvancedLanguageFeatures\n{\n    class Program\n    {\n        static\
  \ void CountWords(string html)\n        {\n            Console.WriteLine(\"The page\
  \ contains {0} words\", \n                    html.Split(' ').Length);\n       \
  \ }\n\n        static void Main(string[] args)\n        {\n            Downloader\
  \ downloader = new Downloader();\n            ResultHandler myDelegate = new ResultHandler(CountWords);\n\
  \            downloader.Download(\"http://news.yahoo.com\", myDelegate);\n     \
  \   }\n    }\n}\n```\n\n列表 16.2 中的代码创建了 `Downloader` 的实例并调用其 `Download` 方法，传递了一个引用\
  \ `CountWords` 的委托类型。`CountWords` 解析网页内容并使用 `String` 类的 `Split` 方法来计算单词数。\n\n你可以将以下行代码：\n\
  \n```\n ResultHandler myDelegate = new ResultHandler(CountWords);\n```\n\n替换为\n\n\
  ```\n ResultHandler myDelegate = CountWords;\n```\n\n你甚至可以在不显式创建委托实例的情况下将 `CountWords`\
  \ 传递给 `Download` 方法：\n\n```\n downloader.Download(\"http://news.yahoo.com\", CountWords);\n\
  ```\n\n## 多委托\n\n委托实例可以引用多个方法。当委托实例被调用时，它引用的所有方法都会被执行。这被称为多委托。\n\n以这个 `PrettyDelegate`\
  \ 委托类型为例：\n\n```\n public delegate void PrettyDelegate(string s);\n```\n\n假设你有三个\
  \ `PrettyDelegate` 实例，它们引用三个不同的方法：\n\n```\n PrettyDelegate delegate1 = obj.Method1;\n\
  PrettyDelegate delegate2 = obj.Method2;\nPrettyDelegate delegate3 = StaticMethod1;\n\
  ```\n\n要创建一个引用所有三个方法的委托实例，你可以这样做：\n\n```\n PrettyDelegate ultimate = delegate1 +\
  \ delegate2;\nultimate += delegate3;\n```\n\n要移除一个方法，请使用 `-=` 运算符。例如，以下代码移除了 `obj.Method1`。\n\
  \n```\n ultimate -= delegate1;\n```\n\n## 预定义委托\n\n`System` 命名空间包含许多预定义的委托，可以用于最常见的情况。这些通用委托中的一些列在表\
  \ 16.1 中。\n\n| 委托 | 说明 |\n| :--- | :--- |\n| Action | 引用一个没有返回值且接受零、一个或多个参数的方法。该委托有\
  \ 17 个版本，接受 0 到 16 个参数。 |\n| AsyncCallback | 引用一个在相应的异步操作完成后将被调用的方法。 |\n| Comparison\
  \ | 引用一个比较两个相同类型对象的方法。 |\n| Converter | 引用一个将对象从一种类型转换为另一种类型的方法。 |\n| EventHandler\
  \ | 引用一个处理没有事件数据的的方法。 |\n| Func | 引用一个有返回值且接受零、一个或多个参数的方法。该委托有 17 个版本，接受 0 到 16\
  \ 个参数。 |\n| Predicate | 引用一个定义一组标准并判断指定对象是否符合这些标准的方法。 |\n\n表 16.1：预定义委托\n\n例如，`Action`\
  \ 委托类型的这种变体返回 `void` 并接受一个参数。\n\n```\n public delegate void Action<in T>(T obj)\n\
  ```\n\n如果你恰好需要一个接受一个参数并返回 `void` 的委托，可以使用 `Action` 而不是自己创建。列表 16.3 中的 `ActionDownloader`\
  \ 类是列表 16.1 中 `Downloader` 类的重写。注意，`ActionDownloader` 中的 `Download` 方法接受一个 `Action`\
  \ 委托实例，而不是自定义委托的实例。\n\n列表 16.3：`ActionDownloader` 类\n\n```\n using System;\nusing\
  \ System.Net;\n\nnamespace ActionDelegate\n{\n    public class ActionDownloader\n\
  \    {\n        public void Download(string url, Action<string> handler)\n     \
  \   {\n            string content;\n            using (WebClient webClient = new\
  \ WebClient())\n            {\n                content = webClient.DownloadString(url);\n\
  \            }\n            handler(content);\n        }\n    }\n}\n```\n\n列表 16.4\
  \ 显示了如何使用 `ActionDownloader` 类。\n\n列表 16.4：使用 `ActionDownloader` 类\n\n```\n using\
  \ System;\nusing ActionDelegate;\nnamespace AdvancedLanguageFeatures\n{\n    class\
  \ Program\n    {\n        static void CountWords(string html)\n        {\n     \
  \       Console.WriteLine(\"The page contains {0} words\", \n                  \
  \  html.Split(' ').Length);\n        }\n\n        static void Main(string[] args)\n\
  \        {\n            ActionDownloader downloader2 = new ActionDownloader();\n\
  \            downloader2.Download(\"http://news.yahoo.com\", CountWords);\n    \
  \    }\n    }\n}\n```\n\n## 事件\n\n事件与委托相关。因此，在处理事件之前，你需要理解委托。\n\n在上面章节的两个示例中，你通过委托实例传递给\
  \ `Download` 方法的方法在你调用 `Download` 方法后不久就被调用了。在某些情况下，特别是在 GUI 环境中，你不希望你的方法被立即调用。你更倾向于等待事件发生后再调用它。例如，如果你的方法在响应按钮点击时执行某些有趣的操作，你希望你的方法在用户点击按钮后立即执行，而不是在此之前。\n\
  \n在这种情况下，你需要调用者对象（最终将调用你方法的对象）获取你的委托实例并将其保留。只有当事件发生时，你的方法才会被调用。为了让一个对象保留委托实例，它的类必须声明一个事件成员。事件成员的类型必须是委托类型。\n\
  \n这是一个声明了类型为 `EventHandler` 的 `DoubleClick` 事件的类，`EventHandler` 是 `System` 命名空间中的委托类型。（参见表\
  \ 16.1。）\n\n```\n public MyClass\n{\n    public event EventHandler DoubleClick;\n\
  \    ...\n}\n```\n\n基本上，事件就像字段或属性那样的类成员。就像字段可以持有值一样，事件也可以持有委托实例。\n\n\n\n\n你可以使用\
  \ `+=` 运算符将委托实例传递给 `DoubleClick` 事件：\n\n```\n MyClass obj = new MyClass():\nobj.MyEventHandler\
  \ += delegate;\n```\n\n列表 16.5 显示了一个更详细的示例，其特点是包含一个 `SmartStorage` 类。诚然，这个例子有些生硬，但它展示了如何创建一个事件。\n\
  \n`SmartStorage` 包含一个 `queue`，只能通过它的 `Put` 和 `Take` 方法访问。你调用 `Put` 来添加新元素，调用 `Take`\
  \ 从队列中弹出元素。队列的容量为 `10`，它不会超过这个数字。每当在队列已有六个或更多元素时调用 `Put` 方法，`SmartStorage` 的实例将抛出一个\
  \ `CapacityEvent` 事件。\n\n列表 16.5：事件示例\n\n```\n using System;\nusing System.Collections.Generic;\n\
  namespace EventExample\n{\n    class SmartStorage<T>\n    {\n        private int\
  \ maxSize = 10;\n        private Queue<T> queue = new Queue<T>();\n        public\
  \ event EventHandler CapacityEvent;\n\n        public void Put(T element)\n    \
  \    {\n            if (queue.Count < maxSize)\n            {\n                queue.Enqueue(element);\n\
  \            }\n            if (queue.Count > 7)\n            {\n              \
  \  if (CapacityEvent != null)\n                {\n                    CapacityEvent(this,\
  \ EventArgs.Empty);\n                }\n            }\n        }\n\n        public\
  \ T Take()\n        {\n            if (queue.Count > 0)\n            {\n       \
  \         return queue.Dequeue();\n            }\n            return default(T);\n\
  \        }\n    }\n}\n```\n\n`SmartStorage` 最重要的部分是事件声明：\n\n```\n public event EventHandler\
  \ CapacityEvent;\n```\n\n`EventHandler` 是委托类型，`CapacityEvent` 是事件的名称。\n\n列表 16.6\
  \ 中的代码显示了如何使用 `SmartStorage` 并向它传递一个作为事件监听器（事件处理程序）的委托。\n\n列表 16.6：使用自定义事件\n\n```\n\
  \ using System;\nusing EventExample;\nnamespace AdvancedLanguageFeatures\n{\n  \
  \  class Program\n    {\n        static void Main(string[] args)\n        {\n  \
  \          SmartStorage<int> storage = new SmartStorage<int>();\n            storage.CapacityEvent\
  \ += \n                    new EventHandler(HandleCapacityEvent);\n            for\
  \ (int i = 0; i < 10; i++)\n            {\n                storage.Put(i);\n   \
  \         }\n            Console.ReadKey();\n        }\n\n        static void HandleCapacityEvent(Object\
  \ sender, \n                EventArgs eventArgs)\n        {\n            Console.WriteLine(\"\
  Storage almost full.\");\n        }\n    }\n}\n```\n\n在这种情况下，你将代码中的 `HandleCapacityEvent`\
  \ 方法作为事件处理程序传递。\n\n```\n storage.CapacityEvent += new EventHandler(HandleCapacityEvent);\n\
  ```\n\n当 `SmartStorage` 实例抛出 `CapacityEvent` 事件时，该方法就会被调用。`for` 循环用于说明这一点。当你运行示例时，你应该在控制台中看到这些内容：\n\
  \n```\n Storage almost full.\nStorage almost full.\nStorage almost full.\n```\n\n\
  你将在第 18 章“Windows Presentation Foundation”中学习更多关于事件的内容。\n\n## 匿名方法\n\n如果一个方法在应用程序生命周期内只使用一次，你可以创建一个匿名方法。匿名方法在\
  \ C# 2.0 中引入，不需要名称，并使用 `delegate` 关键字内联声明。\n\n例如，列表 16.7 中的代码使用匿名方法来处理列表 16.5 中\
  \ `SmartStorage` 类实例的 `CapacityEvent` 事件。\n\n列表 16.7：使用匿名方法\n\n```\n using System;\n\
  using EventExample;\nnamespace AdvancedLanguageFeatures\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            SmartStorage<int>\
  \ storage2 = new SmartStorage<int>();\n            storage2.CapacityEvent += delegate(object\
  \ o, EventArgs e)\n            {\n                Console.WriteLine(\"Storage at\
  \ more than 69% capacity\");\n            }; // 以分号结束\n            for (int i =\
  \ 0; i < 10; i++)\n            {\n                storage2.Put(i);\n           \
  \ }\n        }\n    }\n}\n```\n\n注意，方法声明的末有一个分号。\n\n从 C# 3.0 开始，Lambda 表达式比匿名方法更是编写内联代码的方法。\n\
  \n## Lambda 表达式\n\nLambda 表达式是匿名方法。你可以使用它们来创建（以及其他）委托类型。Lambda 表达式广泛用于 LINQ，你将在第\
  \ 17 章“LINQ”中学习到它。\n\nLambda 的语法是以下形式之一：\n\n```\n (input parameters) => expression\n\
  (input parameters) => { statement(s); }\n```\n\n如果至少有一个输入参数，括号是可选的。\n\n这是一个添加两个参数并返回结果的\
  \ Lambda 表达式。\n\n```\n x, y => x + y;\n```\n\n在大多数情况下，编译器足够智能可以推出参数的类型。如果你需要提供类型，可以这样做：\n\
  \n```\n int x, int y => x + y;\n```\n\n列表 16.8 显示了如何使用 Lambda 处理列表 16.5 中 `SmartStorage`\
  \ 的 `CapacityEvent`。\n\n列表 16.8：使用 Lambda 作为事件处理程序\n\n```\n SmartStorage<int> storage3\
  \ = new SmartStorage<int>();\nstorage3.CapacityEvent += \n        (obj, eventArgs)\
  \ => \n                { Console.WriteLine(\"Storage capacity warning.\"); };\n\n\
  for (int i = 0; i < 10; i++)\n{\n    storage3.Put(i);\n}\n```\n\n## 表达式体成员\n\n从\
  \ C# 6.0 开始，你可以使用 Lambda 表达式代替语句体来编写方法或只读属性。\n\n例如，这里有一个用传统方式编写的 `Add` 方法。\n\n```\n\
  \ public int Add(int a, int b)\n{\n    return a + b;\n}\n```\n\n这里是用 Lambda 表达式编写的相同方法。\n\
  \n```\n public int Add(int a, int b) => a + b;\n```\n\n作为另一个例子，考虑以下只读属性：\n\n```\n\
  \ public string FullName\n{\n    get\n    {\n        return FirstName + \" \" +\
  \ LastName;\n    }\n}\n```\n\n在 C# 6.0 及更高版本，相同的表达式可以使用 Lambda 表达式编写。\n\n```\n public\
  \ string FullName => FirstName + \" \" + LastName;\n```\n\n## 扩展方法\n\nC# 3.0 增加了一个新功能，允许你在不需要扩展或修改类型的情况下为该类型添加功能。你通过创建扩展方法来实现，扩展方法是一种特殊的静态方法。然而，与静态方法不同，扩展方法的调用方式就像实例方法一样。\n\
  \n列表 16.9 显示了一个名为 `MyExtension` 的类，其中包含一个 `String` 类的扩展方法。只要导入了 `StringExtension`\
  \ 命名空间，就可以在任何 `String` 实例上使用方法 `IgnoreCaseEquals`。\n\n列表 16.9：扩展 System.String\n\
  \n```\n using System;\nnamespace StringExtension\n{\n    public static class MyExtension\n\
  \    {\n        public static bool IgnoreCaseEquals(this string s1, string s2)\n\
  \        {\n            return s1.Equals(s2, StringComparison.OrdinalIgnoreCase);\n\
  \        }\n    }\n}\n```\n\n扩展方法必须声明为非泛型、非嵌套静态类中的静态方法。方法的第一个参数前带有 `this` 修饰符，用于指定方法的操作类型。\n\
  \n要使用它，使用 `using` 导入命名空间并像调用实例方法一样调用该方法。你也可以忽略第一个参数，就像它不存在一样：\n\n```\n string a\
  \ = \"abcd\";\nstring b = \"ABCD\";\nbool equals = a.IgnoreCaseEquals(b); // 结果为\
  \ true\n```\n\n最常见的扩展方法是 LINQ 标准查询操作符，它们为现有的 `System.Collections.IEnumerable` 和\
  \ `System.Collections.Generic.IEnumerable<T>` 类型添加了查询功能。\n\n## 隐式类型局部变量\n\nC# 是一种静态类型语言，这意味着变量类型在编译时进行检查。例如，编译器会将此代码标记为错误，因为你正尝试将字符串赋值给\
  \ `int`。\n\n```\n int word = \"Hello!!!\";\n```\n\n\n\n然而，从 C# 3.0 开始，你可以对局部变量使用\
  \ `var` 类型，并让编译器从右侧的表达式中推断（派生）出它们的类型。例如，以下代码是有效的：\n\n```\n var greeting = \"Bonjour\"\
  ;\n```\n\n在编译时，`greeting` 的类型将是 `string`。\n\n这里是 `var` 的另一个示例：\n\n```\n var numbers\
  \ = { 0, 1, 2 };\nforeach (var a in numbers)\n{\n    Console.WriteLine(a);\n}\n\
  ```\n\n在大多数情况下，`var` 用作实际类型的快捷方式。换句话说，作为一种语法上的便利。然而，`var` 也用于匿名类型，正如下一节所述。\n\n##\
  \ 匿名类型\n\n匿名类型是在 C# 3.0 中引入的，它允许你在无需先定义类型的情况下创建对象。匿名类型可以将只读属性封装到对象中，该对象只需要存在较短的时间。\n\
  \n你通过使用 `new` 运算符和对象初始化器来创建匿名类型。你可以将对象赋值给一个 `var` 变量。这是一个示例：\n\n```\n var person\
  \ = new { Name = \"Joe Fresher\", Age = 58 };\nConsole.WriteLine(person.Name);\n\
  ```\n\n## dynamic 类型\n\n我之前提到过 C# 是一种静态强类型语言，这意味着类型检查发生在编译时。然而，C# 4.0 添加了 `dynamic`\
  \ 类型，允许你跳过编译器的类型检查并将其推到运行时。\n\n使用 `dynamic` 类型的目的是为了更容易对编译时未知的对象或数据进行编程，例如当使用反射或从\
  \ COM API 获取值时。\n\n这里是使用 `dynamic` 的示例：\n\n```\n dynamic someObject = getObject();\n\
  someObject.someMethod(1, 2, 4);\n```\n\n编译器将不会检查 `someObject` 的类型，也不会验证 `someMethod`\
  \ 是否。\n\n## 总结\n\nC# 是一个功能丰富的语言。语言的每个新版本的发布都会带来新特性，使语言变得更加丰富。\n\n`delegate`（委托）是一个特别有用且重要的特性，经常用作回调或事件监听器。你可以通过\
  \ `new` 运算符或简单地将匹配的方法传递给 `delegate` 类型变量来创建 `delegate` 实例。或者，你可以使用 lambda 表达式创建\
  \ `delegate` 实例，因为 lambda 本质上是一个匿名方法。\n\nLambda 很有趣，因为它们为 C# 引入了函数式编程。你在第 17 章“LINQ”中学习的\
  \ LINQ 技术使用了大量的 lambda。\n\n另一个重要特性是扩展方法，它允许你在不创建子类或修改类本身的情况下为现有类添加功能。\n\n# 第 17\
  \ 章：使用 LINQ 访问数据\n\n业务应用程序通常使用存储在关系型数据库中的信息，传统的 C# 开发者使用结构化查询语言（`SQL`）来查询数据。然而，随着\
  \ C# 3.0 和 `.NET Framework 3.5` 引入 `LINQ`，这种情况发生了变化。LINQ 是语言集成查询的缩写，它允许编译时进行语法检查，并可以从关系型数据库以外的检索数据，包括\
  \ `.NET` 对象和 XML。\n\n本章解释了如何使用 `LINQ` 处理数据。\n\n## 概述\n\n得益于 `LINQ`，数据检索已成为 C# 和\
  \ Visual Basic 的一部分。这意味着查询语法会在编译时进行检查，你可以利用 Visual Studio 中的 `IntelliSense` 来帮助你列出类成员并完成关键字。编译时语法检查意味着你可以在编写代码时立即捕捉并修正错误，而不是在运行应用程序时。相比之下，使用结构化查询语言（`SQL`）查询关系型数据库意味着让数据库引擎解析\
  \ `SQL` 语句并偶尔产生运行时错误。\n\n与仅用于关系型数据库的 `SQL` 不同，`LINQ` 允许从不同的源查询数据。目前，`LINQ` 支持查询关系型数据库、`.NET`\
  \ 对象和 XML。在 `LINQ` 之前，人们使用 `ADO.NET` 访问关系型数据库。`LINQ` 内部在使用 `ADO.NET` 操作关系型数据库中的数据，但开发者不需要直接处理\
  \ `ADO.NET`。\n\n`LINQ` 的 API 构建在 `.NET Framework` 类库中。使用 `LINQ` 意味着使用 `System.Linq`\
  \ 命名空间及其子命名空间的类型。`LINQ` 还为 `IEnumerable` 接口提供了扩展方法。\n\n根据数据源的类型，`LINQ` 分为以下技术：\n\
  \n* `LINQ to Objects` 用于查询 `.NET` 对象。\n* `LINQ to SQL` 用于查询和操作关系型数据库中的数据。\n* `LINQ\
  \ to DataSet` 用于处理 `DataSet`。\n* `LINQ to Entities` 用于对 `Entity Framework` (`EF`)\
  \ 概念模型编写查询。`Entity Framework` (`EF`) 是一个开源的对象关系映射 (ORM) 框架，是 `.NET Framework` 的一部分。乍一看\
  \ `LINQ to Entities` 与 `LINQ to SQL` 非常相似，两者都可以访问关系型数据库中的数据。然而，`LINQ to SQL` 更容易使用，而\
  \ `LINQ to Entities` 更多功能。\n* `LINQ to XML` 用于处理 XML 文档。\n\n本章仅讨论 `LINQ to Objects`\
  \ 和 `Link to SQL`，这是每个初学者应该掌握的 `LINQ` 技术。另外三个 `LINQ` 技术适合更高级的用户。\n\n## LINQ to Objects\n\
  \n如之前所述，你使用查询从数据源或数据源检索数据。在查询中，你可以决定返回哪些数据以及如何组织结果。应用程序始终将数据源视为 `System.Collections.Generic.IEnumerable`\
  \ 或 `System.Linq.IQueryable`。`IQueryable` 派自 `IEnumerable`，在处理 `LINQ to SQL` 时应使用它。\n\
  \n要创建一个查询，你需要编写一个查询表达式。其语法可以模糊定义如下。\n\n```\n from ...\n[where | orderby | join |\
  \ let] ...\nselect or group ...\n```\n\n查询表达式必须以 `from` 开始，并以 `select` 或 `group`\
  \ 结束。在第一个 `from` 和 `select/group` 子句之间，查询表达式可以包含零或多个 `where`、`orderby`、`join` 或\
  \ `let` 子句，甚至是额外的 `from` 子句。\n\n例如，这是一个选择 `C:\\temp\\pictures` 中所有文件的简单查询表达式：\n\n\
  ```\n string[] files = Directory.GetFiles(@\"C:\\Temp\\pictures\"); // data source\n\
  IEnumerable<string> myQuery = from file in files \n        select file; // query\
  \ expression\n```\n\n在使用 `foreach` 循环对其进行迭代或调用其 `ToList`、`ToArray`、`ToLookup` 或\
  \ `ToDictionary` 方法之前，查询都不会执行。这被称为延迟执行。在运行时，上述代码不会产生任何结果。然而，如果你执行该查询，它将返回 `C:\\\
  Temp\\pictures` 中的所有路径。\n\n以下示例应用了 `where` 子句，过滤掉任何不是 `JPG` 文件：\n\n```\n string[]\
  \ files = Directory.GetFiles(@\"C:\\Temp\\pictures\"); // data source\nIEnumerable<string>\
  \ myQuery = from file in files\n        where file.ToLower().EndsWith(\".jpg\")\n\
  \        select file; // query expression\n```\n\n下面的 `foreach` 语句通过迭代来执行查询：\n\n\
  ```\n foreach (string file in myQuery)\n{\n    Console.WriteLine(file);\n}\n```\n\
  \n`select` 子句可用于投影新类型。例如，以下查询投影了 `numbers` 中每个 `int` 元素的平方。\n\n```\n int[] numbers\
  \ = { 1, 3, 5, 20, -30 };\nIEnumerable<int> squares = from number in numbers\n \
  \       select number * number;\n```\n\n执行时，`squares` 将包含 {1, 9, 24, 400, 900}。\n\
  \n`orderby` 子句可以按升序或降序排序结果。考虑这个示例：\n\n```\n int[] numbers = { 1, 3, 5, 20, -30 };\n\
  IEnumerable<int> orderedNumbers = from number in numbers\n        orderby number\
  \ descending\n        select number;\n```\n\n执行时，`orderedNumbers` 将包含 { 20, 5, 3,\
  \ 1, -30 }。注意，如果没有指定排序顺序，`orderby` 将按升序排序结果。\n\n\n\n\n`System.Collections.Generic.IEnumerable`\
  \ 接口提供了用于处理序列的扩展方法。这些方法是 LINQ 的骨干，被称为标准查询操作符。这些方法中的大部分作用于序列，序列是指类型实现了 `IEnumerable`\
  \ 或 `IQueryable` 的对象。最频繁使用的扩展方法之一是 `Where`，它接收一个 表达式来过滤元素。\n\n你可以使用方法语法或查询语法来编写查询。例如，此查询是用方法语法编写的，因为它使用了\
  \ `Where` 方法。\n\n```\n int[] numbers = { 1, 3, 5, 20, -30 };\nIEnumerable<int> evenNumbers\
  \ = numbers.Where(n => n % 2 == 0);\n```\n\n相同的查询可以使用查询语法重写为如下形式。\n\n```\n int[]\
  \ numbers = { 1, 3, 5, 20, -30 };\nIEnumerable<int> evenNumbers = from number in\
  \ numbers\n        where number % 2 == 0\n        select number;\n```\n\n事实上，查询语法在编译时会被翻译成等效的方法语法。因此，你可以选择使用查询语法或方法语法来编写查询。你甚至可以将两者混合使用，就像这个示例所示，在一个用查询语法编写的查询上调用了\
  \ `Count` 方法。\n\n```\n int[] numbers = { 1, 3, 5, 20, -30 };\nint numberOfEvenNumbers\
  \ = (from number in numbers\n        where number % 2 == 0\n        select number).Count();\n\
  ```\n\n当然，你可以将其分为两个语句以使其更清晰：\n\n```\n int[] numbers = { 1, 3, 5, 20, -30 };\nIEnumerable<int>\
  \ evenNumbers = from number in numbers\n        where number % 2 == 0\n        select\
  \ number;\nint numberOfEvenNumbers = evenNumbers.Count();\n```\n\n表 17.1 显示了更重要的标准查询操作符。\n\
  \n| 操作符 | 说明 |\n| :--- | :--- |\n| Average | 返回小数值序列的平均值。 |\n| Count | 返回序列中元素的数量。\
  \ |\n| Distinct | 返回序列中不相同的元素（无重复）。 |\n| ElementAt | 返回指定零基索引处的元素。 |\n| First |\
  \ 返回序列中的第一个元素。 |\n| GroupBy | 分组序列中的元素。 |\n| Last | 返回序列中的最后一个元素。 |\n| Max | 返回小数值序列中的最大值。\
  \ |\n| Min | 返回小数值序列中的最小值。 |\n| OrderBy | 按升序排列序列中的元素。 |\n| OrderByDescending |\
  \ 按降序排列序列中的元素。 |\n| Select | 将序列中的每个元素投影到新形式中。 |\n| Skip | 跳过序列中给定数量的元素，然后返回剩余元素。\
  \ |\n| Sum | 返回小数值序列的和。 |\n| Where | 根据给定的谓词过滤序列中的元素。 |\n\n表 17.1：更重要的 LINQ 标准查询操作符\n\
  \n## LINQ to SQL\n\nC# 是一种面向对象的编程语言。因此，你经常需要处理对象。当需要持久化你的对象状态时，你会使用什么？\n\n传统上，你会使用\
  \ `ADO.NET` 将对象状态持久化到关系型数据库中。尽管这是一项非常老的技术，关系型数据库仍然是最常用的数据存储类型。`ADO.NET` 过去是现在仍然是一项很好的技术，然而\
  \ `ADO.NET` 并不是完美的解决方案。使用 `ADO.NET` 你必须自己创建数据库架构和表，并编写结构查询语言 (`SQL`) 语句来检索和操作你的数据。而且，如果你的一个类发生了变化，你也必须更改数据库架构。\n\
  \nLINQ to SQL 是 `ADO.NET` 更好的替代方案。内部，LINQ to SQL 使用 `ADO.NET` 打开数据库连接并检索数据。然而，LINQ\
  \ to SQL 不仅可以将你的对象持久化到关系型数据库中，还可以以 `.NET` 对象的形式检索你的持久化数据。换句话说，LINQ to SQL 隐藏了编写\
  \ SQL 语句的复杂性。一旦你将类映射到数据库架构，你只需要处理对象。因此，与返回记录集的 `ADO.NET` 不同，LINQ to SQL 提供了一种对象关系映射（ORM）解决方案，以对象的形式返回数据。你可以自己管理数据库结构，也可以使用工具同步你的数据库和类。\n\
  \n## ADO.NET\n\n`ADO.NET` 自 `.NET 1.0` 以来一直存在，是一种成熟的 `.NET` 技术，用于访问和操作各种格式的数据，包括存储在关系型数据库中或作为\
  \ XML 存储的数据。`ADO.NET` 的名称来自 `ADO`（Access Data Objects），这是一个提供类似功能的旧微软技术。尽管名称相似，但\
  \ `ADO.NET` 的架构与其前身相比几乎没有相似之处。\n\n`ADO.NET` 提供了一种统一的方法来访问不同的关系型数据库。不同的数据库服务器使用不同的专有协议，如果不使用\
  \ `ADO.NET`（或 Java Database Connectivity 等类似技术），访问可能需要编写完全不同的代码。对于 `ADO.NET` 支持的每个关系型数据库，都有能够与数据库服务器通信的类。这些类被称为数据提供程序。\n\
  \n有了像 LINQ to SQL 这样的技术，你不需要直接使用 `ADO.NET`。\n\n为了让 LINQ to SQL 管理你的类实例，你首先必须将类转换为实体类。实体类是指可以使用\
  \ ORM 解决方案持久化实例的类。\n\nLINQ to SQL 的语法与 LINQ to Objects 相同，但你需要打开数据库连接并使用 `IQueryable`\
  \ 代替 `IEnumerable`。`IQueryable` 和 `IEnumerable` 之间的区别是巨大的。使用 `IEnumerable` 时，所有记录都会从数据库检索，并由调用代码进行过滤和排序。使用\
  \ `IQueryable` 时，数据由数据库引擎本身进行过滤和排序。这意味着在使用 `IQueryable` 时传输的数据更少。\n\n关于将实体类映射到数据库表，你可以从以下选项中选择一个：\n\
  \n- 自己创建实体类和数据库表并手动映射。\n- 使用 `DataContext.CreateDatabase` 方法读取现有的实体类，并根据实体类中注释列生成数据库和相应的表。\n\
  - 使用现有数据库架构生成实体类。\n\n在本节中，我将解释如何使用第一种方法。\n\n以下是使用 LINQ to SQL 查询关系型数据库的步骤。\n\n1.\
  \ 使用 `Table` 和 `Column` 特性标记你的类。\n2. 编写连接字符串。\n3. 创建 `DataContext` 对象并传递连接字符串。\n\
  4. 调用 `DataContext` 上的 `GetTable` 方法获取 `Table` 对象。将 `Table` 对象赋值给变量。\n5. 编写以 `Table`\
  \ 变量为数据源的查询。此外，使用 `IQueryable` 代替 `IEnumerable`。\n\n这些步骤将在接下来的小节中进一步解释。此外，还有一个使用\
  \ LINQ to SQL 操作 SQL Server 数据的代码示例。\n\n## 使用 Table 和 Column 特性标记类\n\nLINQ to SQL\
  \ 可以将对象持久化到关系型数据库并以对象的形式检索数据。实体类映射到表行，而实体类的单个属性映射到组成表行的单个列。\n\n为了让 LINQ to SQL 执行此操作，你需要在\
  \ `System.Data.Linq.Mapping` 命名空间中使用 `Table` 和 `Column` 特性标记你的类。你使用 `Table` 特性将数据库表映射到\
  \ C# 类，这基本上是告诉 LINQ 在执行查询时实例化哪一个类。你使用 `Column` 将表列映射到类属性。\n\n使用 `Table` 特性将你的类转换为实体类是很容易的。该特性有一个\
  \ `Name` 属性，应赋值为该实体类实例所映射的数据库表名。\n\n这是一个名为 `Order` 的实体类示例，它映射到数据库中的 `orders` 表。\n\
  \n```csharp\n [Table(Name = \"orders\")]\npublic class Order\n{\n    ...\n}\n```\n\
  \n\n\n\n`Column` 属性将类属性映射到表列。表 17.2 显示了 `Column` 属性较为重要的属性。\n\n| 属性 | 描述 |\n| :---\
  \ | :--- |\n| `CanBeNull` | 表明列是否允许包含空值。 |\n| `Expression` | 表明该列是否为数据库中的计算列。 |\n\
  | `IsDbGenerated` | 表明列的值是否应由数据库自动生成。 |\n| `IsPrimaryKey` | 表明该列是否为主主键。 |\n| `Name`\
  \ | 此属性映射到的表列的名称。 |\n\n表 17.2：`Column` 属性的属性\n\n以下是一个使用 `Column` 属性对类属性标记的示例。\n\n\
  ```cs\n [Table(Name = \"students\")]\npublic class Student\n{\n    private int _Id;\n\
  \    private string _Name;\n\n    [Column(Name=\"id\", IsPrimaryKey=true, IsDbGenerated=true)]\n\
  \    public int Id\n    {\n        get\n        {\n            return this._Id;\n\
  \        }\n        set\n        {\n            this._Id = value;\n        }\n \
  \   }\n\n    [Column(Name=\"student_name\", CanBeNull=true)]\n    public string\
  \ Name\n    {\n        get\n        {\n            return this._Name;\n        }\n\
  \        set\n        {\n            this._Name = value;\n        }\n    }\n}\n\
  ```\n\n## 连接字符串\n\n在程序化连接到关系型数据库时，困难的部分是构建正确的连接字符串。通常情况下，你需要知道你尝试访问的数据库类型、服务器的位置（主机或\
  \ IP 地址），以及可选的数据库的用户名和密码。然后，你必须构建一个由如下键/值对组成的字符串：\n\n```\nkey-1=value-1; key-2=value-2;\
  \ ...; key-n=value-n\n```\n\n每个键/值对之间用分号分隔，分号后的空格是可选的。\n\n让我们先聊聊 SQL Server，因为这可能是你关系型数据库管理系统（RDBMS）的首选。\n\
  \nSQL Server 连接字符串的键可以在此处找到。\n\n```\nhttp://msdn.microsoft.com/en-us/library/system.data.sqlclient.sqlconnection.connectionstring\n\
  ```\n\n表 17.3 显示了其中一些重要的键。\n\n| 键 | 描述 |\n| :--- | :--- |\n| `AttachedDBFilename`\
  \ 或 `Extended Properties` 或 `Initial File Name` | 数据库 `.mdf` 文件的名称。不支持其他文件类型。 |\n\
  | `Connect Timeout` 或 `Connection Timeout` 或 `Timeout` | 在放弃尝试并生成错误之前等待服务器连接的秒数。有效值在\
  \ 0 到 2,147,483,647 之间。 |\n| `Data Source` 或 `Server` 或 `Address` 或 `Addr` 或 `Network\
  \ Address` | 要连接的 SQL Server 实例的名称或网络地址。可以在服务器名之后指定端口号。 |\n| `Initial Catalog` 或\
  \ `Database` | 要使用的数据库名称。 |\n| `Integrated Security` 或 `Trusted_Connection` | 指定是否使用当前的\
  \ Windows 凭据来验证用户。默认值为 `false`，意味着将使用 `UserID` 和 `Password` 值来验证用户。值为 `true` 则将使用当前的\
  \ Windows 凭据。除了 `true` 和 `false` 之外，其他有效值为 `yes`（等同于 `true`）、`sspi`（等同于 `true`）和\
  \ `no`（等同于 `false`）。 |\n| `Max Pool Size` | 如果使用了连接池，池中的最大连接数。 |\n| `Min Pool Size`\
  \ | 如果使用了连接池，池中的最小连接数。 |\n| `Password` 或 `PWD` | 用于验证用户的密码 |\n| `Pooling` | 表明是否应该连接池。有效值为\
  \ `true`（默认值）、`yes`、`false` 和 `no`。 |\n| `User ID` 或 `UID` | 用于验证用户的标识符。 |\n\n表\
  \ 17.3：SQL Server 连接字符串的有效键\n\n打开数据库连接是数据库操作中最耗资源的操作之一。因此，ADO.NET 支持连接池，这意味着打开的连接不会被关闭，而是简单返回池中。连接字符串中的\
  \ `Pooling` 键应保持其默认值，除非你有非常有理由不使用连接池。\n\n以下示例是一个通过挂载 MDF 文件打开 SQL Server 数据库连接的连接字符串。它还使用当前的\
  \ Windows 凭据来验证用户。\n\n```\nData Source=.\\\\SQLEXPRESS;AttachDbFilename=C:\\\\MarketingDB.mdf;\n\
  Integrated Security=True;Connect Timeout=30\n```\n\n以下连接字符串连接到名为 `PC\\\\SQLEXPRESS`\
  \ 的 SQL Server 并使用 `MyCustomerDB` 数据库。\n\n```\nPersist Security Info=False;Integrated\
  \ Security=true;\nInitial Catalog=MyCustomerDB;Server=PC\\\\SQLEXPRESS\";\n```\n\
  \n虽然 SQL Server 可能是你生产环境中的数据库引擎，但在开发环境中可能会选择 SQL Server Express LocalDB 实例，它是为程序开发人员设计的\
  \ SQL Server Express 执行模式。LocalDB 的用处是它与 Visual Studio 捆绑。换句话说，如果你安装了 Visual Studio，就不需要单独安装\
  \ LocalDB。\n\n这是一个 LocalDB 的示例连接字符串。\n\n```\nData Source=(LocalDB)\\MSSQLLocalDB;AttachDbFilename=C:\\\
  \\OrderDb.mdf;\nIntegrated Security=True;Connect Timeout\n```\n\n## DataContext\
  \ 和 Table\n\n`System.Data.Linq.DataContext` 类是处理 LINQ to SQL 的主要类。该类允许你基于实体类创建数据库。但是，这里感兴趣的是它的\
  \ `GetTable` 方法，它返回一个表示数据库表的 `System.Data.Linq.Table` 对象。`Table` 对象代表可以查询的数据源。\n\
  \n以下是基于 `Table` 创建 `DataContext` 和 `Table` 的方法。\n\n```cs\nDataContext dataContext\
  \ = new DataContext(connectionString);\nTable<Student> students = dataContext.GetTable<Student>();\n\
  Iqueryable<Student> query = from student in students\n        select student;\n\
  ```\n```\n\n## 查询数据库\n\n你可以使用 LINQ to SQL 从关系型数据库选择数据。以下示例显示了如何从 LocalDB 数据库检索数据以填充对象。数据库本身包含在本章节中，名为\
  \ `test.mdf`。它与项目的 `cs` 文件位于同一目录。\n\n在开始之前，你必须先添加 `System.Data.Linq` 命名空间的引用。这是因为\
  \ LINQ to SQL 是作为一个独立的程序集（形式为 DLL）部署的。\n\n添加 `System.Data.Linq` 命名空间引用的方法：\n\n1.\
  \ 右键点击你的解决方案/项目。\n2. 点击 `添加 引用` 并搜索 `System.Data.Linq` 然后添加引用。\n3. 点击确定按钮。\n\n数据库中的\
  \ `test.mdf` 包含一个可以映射到列表 17.1 中 `Product`类的表。\n\n列表 17.1：`Product` 类\n\n```cs\n\
  using System.Data.Linq.Mapping;\nusing System.Linq;\nnamespace LINQ\n{\n    [Table]\n\
  \    class Product\n    {\n        [Column (IsPrimaryKey=true)]\n        public\
  \ int Id;\n        [Column]\n        public string name;\n    }\n}\n```\n\n你可以使用列表\
  \ 17.2 中的代码将 `test.mdf` 中的数据作为 `Product` 实例检索。\n\n列表 17.2：使用 LINQ to SQL\n\n```cs\n\
  DataContext db = new DataContext(connectionString);\nTable<Product> products = db.GetTable<Product>();\n\
  Iqueryable<Product> query = from p in products\n        where p.Id > 10\n      \
  \  select p;\n```\n\n\n\n\n```cs\n using System;\nusing System.Linq;\nusing System.Data.Linq;\n\
  using System.IO;\nusing System.Collections.Generic;\n\nnamespace LINQ\n{\n    class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
  \   string dbPath = new \n                    DirectoryInfo(Directory.GetCurrentDirectory())\n\
  \                    .Parent.Parent.FullName + @\"\\test.mdf\";\n            if\
  \ (File.Exists(dbPath))\n            {\n                string connectionString\
  \ = \n                        @\"Data Source=(LocalDB)\\MSSQLLocalDB;\"\n      \
  \                  + \"AttachDbFilename=\" + dbPath + \";\"\n                  \
  \      + \"Integrated Security=True;Connect Timeout=30\";\n\n                DataContext\
  \ dataContext = new \n                        DataContext(connectionString);\n \
  \               Table<Product> products = \n                        dataContext.GetTable<Product>();\n\
  \                IQueryable<Product> query = from pr in products\n             \
  \           where pr.Id < 100\n                        select pr;\n\n          \
  \      foreach (var e in query)\n                {\n                    Console.WriteLine(\"\
  id = {0}, name = {1}\", e.Id, \n                            e.name);\n         \
  \       }\n                Console.WriteLine(\"There are {0} product(s).\", \n \
  \                       products.Count());\n            }\n            else\n  \
  \          {\n                Console.WriteLine(\"Db file does not exist.\");\n\
  \            }\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n最困难的部分是获取正确的连接字符串。在这个示例中，连接字符串是由\
  \ `test.mdf` 文件的路径组成的：\n\n```cs\n string dbPath = new \n        DirectoryInfo(Directory.GetCurrentDirectory())\n\
  \        .Parent.Parent.FullName + @\"\\test.mdf\";\nstring connectionString = \n\
  \        @\"Data Source=(LocalDB)\\MSSQLLocalDB;\"\n        + \"AttachDbFilename=\"\
  \ + dbPath + \";\"\n        + \"Integrated Security=True;Connect Timeout=30\";\n\
  ```\n\n当从 Visual Studio 内部运行程序时，`Directory.GetCurrentDirectory()` 返回 `bin` 下的 `Debug`\
  \ 或 `Release` 目录。`bin` 目录是应用程序目录的子目录。因此，`bin` 目录的父目录就是应用程序目录本身，即 `test.mdf` 文件所在的位置。如果你不是使用\
  \ Visual Studio 运行示例，则需要调整此项。\n\n运行项目，你应该能在产品表中看到两个产品名称。如果你看到“Db file does not exist.”，则说明连接字符串没有指向数据库文件。\n\
  \n## 更新表格\n\n要使用 LINQ to SQL 修改数据库中的数据，你不需要直接操作数据。相反，你以面向对象的方式更新它，即通过更改实体的状态。\n\n\
  在数据库中更新数据的步骤如下：\n\n* 使用 `DataContext` 和 `Table` 对象查询数据。\n* 更新你的实体对象。\n* 在 `DataContext`\
  \ 上调用 `SubmitChanges` 方法将更改保存到数据库。\n\n列表 17.3 显示了使用 LINQ to SQL 连接关系型数据库的示例。\n\n\
  ## 列表 17.3：使用 LINQ to SQL 更新数据\n\n```cs\n using System;\nusing System.Linq;\nusing\
  \ System.Data.Linq;\nusing System.IO;\nusing System.Collections.Generic;\n\nnamespace\
  \ LINQ\n{\n    class Program\n    {\n        static void Main(string[] args)\n \
  \       {\n            string dbPath = new \n                    DirectoryInfo(Directory.GetCurrentDirectory())\n\
  \                    .Parent.Parent.FullName + @\"\\test.mdf\";\n            if\
  \ (File.Exists(dbPath))\n            {\n                string connectionString\
  \ = \n                        @\"Data Source=(LocalDB)\\MSSQLLocalDB;\"\n      \
  \                  + \"AttachDbFilename=\" + dbPath + \";\"\n                  \
  \      + \"Integrated Security=True;Connect Timeout=30\";\n\n                DataContext\
  \ dataContext = new \n                        DataContext(connectionString);\n \
  \               Table<Product> products = \n                        dataContext.GetTable<Product>();\n\
  \                IQueryable<Product> query = from pr in products\n             \
  \                               where pr.Id == 1\n                             \
  \               select pr;\n\n                Product firstProduct = query.First();\n\
  \                firstProduct.name = \"Revised product name\";\n               \
  \ dataContext.SubmitChanges();\n            }\n            else\n            {\n\
  \                Console.WriteLine(\"Db file does not exist.\");\n            }\n\
  \            Console.ReadKey();\n        }\n    }\n}\n```\n\n## 插入行\n\n要使用 LINQ\
  \ to SQL 向数据库表插入行或多行，你需要创建一个指向数据库的 `DataContext` 并调用它的 `GetTable` 方法。`GetTable`\
  \ 方法返回一个 `Table`。然后，你需要调用它的 `InsertOnSubmit` 方法并传递要持久化的对象，最后调用 `DataContext` 的 `SubmitChanges`\
  \ 方法。\n\n插入行的步骤在下面的代码段中描述。\n\n```cs\n // 创建 Product 实例\nProduct newProduct = new\
  \ Product();\nnewProduct.id = 300;\nnewProduct.name = \"New product\";\n\n// 创建\
  \ DataContext 和 Table \nDataContext dataContext = new DataContext(connectionString);\n\
  Table<Product> products = dataContext.GetTable<Product>();\n\n// 插入 Product 并提交更改\n\
  products.InsertOnSubmit(newProduct);\ndataContext.SubmitChanges();\n```\n\n## 删除行\n\
  \n删除行或多行的步骤与插入行的指令相似。从创建 `DataContext` 和 `Table` 开始。接，，创建一个查询来获取要删除的行，遍历它们并调用 `DeleteOnSubmit`\
  \ 方法。要持久化更改，调用 `DataContext` 的 `SubmitChanges` 方法。\n\n以下代码段删除了产品表中所有 `Id` 小于 10\
  \ 的行。\n\n```cs\n DataContext dataContext = new DataContext(connectionString);\n\
  Table<Product> products = dataContext.GetTable<Product>();\nIQueryable<Product>\
  \ query = from pr in products\n        where pr.Id < 10\n        select pr;\n\n\
  foreach (var pr in query)\n{\n    products.DeleteOnSubmit(pr);\n}\ndataContext.SubmitChanges();\n\
  ```\n\n## 总结\n\nLINQ 是一种用于访问和处理各种来源数据的 .NET 技术。有五种 LINQ 子技术，本章讨论了其中两种：LINQ to objects\
  \ 和 LINQ to SQL。LINQ to objects 用于查询 `System.Collections.Generic.IEnumerable` 中的数据。`System.Linq`\
  \ 命名空间为此接口添加了扩展方法，因此你现在可以聚合 `IEnumerable` 中的数据。\n\nLINQ to SQL 在底层使用 ADO.NET 访问关系型数据库并获取数据。此外，LINQ\
  \ to SQL 提供了对象关系映射 (ORM) 服务，允许开发者在关系型数据库中持久化对象状态，无需编写 SQL 语句和直接处理数据库。\n\n# 第 18\
  \ 章\n\n# Windows Presentation Foundation\n\n到为止，书中的所有示例都是作为控制台应用程序构建的。现在是时候揭一下 Windows\
  \ Presentation Foundation (WPF) 了，这是一种用于开发桌面应用程序的技术。\n\n本章介绍了 WPF 并构建了几个简单的应用程序。请注意，本章涵盖的内容仅是\
  \ WPF 能实现功能的冰山一角。如果你感兴趣学习更多关于这种技术，你应该买一本专门介绍 WPF 的书，并访问微软官方 WPF 网站 http://windowsclient.net。在决定使用\
  \ WPF 构建新的 Windows 应用程序之前，请先阅读概述，以了解其他可用的技术。\n\n## 概述\n\n.NET Framework 1.0 发布时带有两种用于开发桌面应用程序的技术：Windows\
  \ Forms 和 GDI+。随着 2006 年 11 月 .NET 3.0 的发布，微软用 Windows Presentation Foundation (WPF)\
  \ 取代两者。为什么要改变主意？很简单。WPF 集成了 .NET 桌面开发者在用 Windows Forms 和 GDI+ 时必须掌握的各种技术。\n\n\n\n\
  \n\n在 WPF 发布六年后，微软发布了 Windows Runtime (WinRT)。WinRT 目标是 Windows 8 电脑，最初让许多 WPF 开发人员感到担心，许多人认为\
  \ WinRT 会让 WPF 过时。微软在 2014 年 11 月的这份公告中发布了 WPF 路线图，试图消除对 WPF 未来担忧，承诺支持 WPF 直至 2023\
  \ 年：\n\n```\nhttp://blogs.msdn.com/b/dotnet/archive/2014/11/12/\nthe-roadmap-for-wpf.aspx\n\
  ```\n\n目前 WPF 仍然是一项安全的投资。这也是合理的选择，因为 WPF 应用程序运行在 Windows 7、8 和 10 机器上。然而，考虑到微软在\
  \ 2015 年 7 月还发布了通用 Windows Platform (UWP)，并一直将其作为编写 Windows 桌面和移动应用程序的未来技术，但通用 Windows\
  \ 应用仅运行在 Windows 10 上。一旦更多 Windows 7 和 8 用户升级到 Windows 10，UWP 可能会真正大流行。\n\n开发 WPF\
  \ 应用程序有两种方法：\n\n* 仅使用代码\n* 使用代码和 XAML\n\n我将在本章中解释这两种方法，首先通过仅使用代码构建 WPF 应用程序，然后通过代码和\
  \ XAML。\n\n## 应用程序与窗口\n\n本节介绍了开发 WPF 应用程序中的两个重要类：`System.Windows.Application` 和\
  \ `System.Windows.Window`。在本节末尾提供了两个示例。\n\n一个 WPF 应用程序由 `System.Windows.Application`\
  \ 类的实例或扩展 `System.Windows.Application` 的类的实例表示。在创建 `Application` 对象后，调用它的 `Run`\
  \ 方法来启动应用程序。这非常简单。\n\n`Run` 方法有两个重载：\n\n```\npublic int Run()\npublic int Run(Window\
  \ window)\n```\n\n第二个重载接受一个表示窗口的 `System.Windows.Window` 对象。没有窗口，你就没有任何视觉内容。第一个\
  \ `Run` 重载通常用于你创建一个扩展了 `Application` 的类，并且窗口的创建是在启动应用程序时自动调用的方法中进行的。你将在本章配套的项目中看到这两个\
  \ `Run` 方法的使用。\n\n创建 WPF 应用程序时需要记住的一个重要点是，你必须使用 `[STAThread]` 特性来标记你的 `Main` 方法。这个特性有什么用呢？该特性将当前线程的单元状态更改为单线程。WPF\
  \ 应用程序必须是单线程的。如果你忘记应用此特性，你的 WPF 应用程序将会崩溃。\n\n现在，让我们先转向 `Window` 类。正如名称所示，`Window`\
  \ 表示一个窗口。在窗口上你可以添加如标签、文本框和按钮等控件。控件将在本章稍后的“WPF 控件”节中进行详细解释。\n\n`Window` 最重要的方法是 `Show`。`Show`\
  \ 打开窗口并返回，而无需等待新打开的窗口关闭。如果不调用 `Show`，你漂亮的窗口永远不会显示。这里是 `Show` 的签名：\n\n```\npublic\
  \ void Show()\n```\n\n你应该记住的 `Window` 的另一个成员是 `Content` 属性，它的类型为 `Object`。你可以给此属性分配任何对象，但你通常会分配一个控件或一个面板（panel）。面板是一个包含其他控件的区域，将在本章稍后的“面板与布局”节中讨论。\n\
  \n表 18.1 列出了 `Window` 类中一些重要的属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| Content | 窗口的内容\
  \ |\n| ContextMenu | 窗口的右键菜单 |\n| FontFamily | 窗口中使用的字体 |\n| FontSize | 窗口中使用的字体大小\
  \ |\n| FontStyle | 窗口中使用的字体样式 |\n| Height | 窗口的高度（像素单位）。 |\n| Icon | 窗口使用的图标对象 |\n\
  | IsActive | 窗口是否激活 |\n| IsVisible | 窗口是否可见 |\n| Left | 窗口左边缘相对于桌面左边缘的位置 |\n| MaxHeight\
  \ | 窗口的最大高度 |\n| MaxWidth | 窗口的最大宽度 |\n| MinHeight | 窗口的最小高度 |\n| MinWidth | 窗口的最小宽度\
  \ |\n| Opacity | 一个 0.0 到 1.0 之间的双精度值，决定窗口的透明度，默认值为 1.0。 |\n| Padding | 窗口内布局控件的内边距\
  \ |\n| Parent | 窗口的父控件 |\n| Title | 窗口的标题 |\n| Top | 窗口顶边缘相对于桌面顶边缘的位置 |\n| Width\
  \ | 窗口的宽度 |\n| WindowStartupLocation | 窗口首次启动时的位置 |\n| WindowState | 窗口所处的状态。其值可以是\
  \ WindowState 枚举中的三个成员之一（最小化、最大化、正常） |\n\n表 18.1：Window 重要的属性\n\n现在你已经了解了 WPF 背后的足够理论，让我们创建两个使用\
  \ `Application`、`Window` 和控件的简单 WPF 应用程序。\n\n## 简单 WPF 应用程序 1\n\n在此示例中，你使用 `Application`\
  \ 类创建一个 WPF 应用程序，并通过传递 `Window` 对象来启动它。\n\n列表 18.1：简单 WPF 1\n\n```\nusing System;\n\
  using System.Windows;\nusing System.Windows.Controls;\n\nnamespace App18\n{\n  \
  \  class SimpleWPF1    \n    {\n        // WPF 应用程序应在 STA 线程上执行\n        [STAThread]\n\
  \        static void Main(string[] args)\n        {\n            Window window =\
  \ new Window();\n            Label label = new Label();\n            label.Content\
  \ = \"WPF is cool\";\n            window.Content = label;\n            window.Title\
  \ = \"Simple WPF App\";\n            window.Height = 100;\n            window.Width\
  \ = 300;\n            window.WindowStartupLocation =\n                    WindowStartupLocation.CenterScreen;\n\
  \            Application app = new Application();\n            app.Run(window);\n\
  \        }\n    }\n}\n```\n\n列表 18.1 中的代码非常直观。首先，你创建一个 `Window` 对象和一个 `Label` 对象。然后，你给标签一个字符串内容，并将标签设置为窗口的内容。接下来，你设置窗口的\
  \ `Title`、`Height`、`Width` 和 `WindowStartupLocation` 属性，你的窗口就准备绪了。之后实例化 `Application`\
  \ 类并调用它的 `Run` 方法。\n\n现在将 `SimpleWPF1` 项目设为 Visual Studio 解决方案中的默认项目并按 `F5`。瞧……你将在图\
  \ 18.1 中看到这样一个窗口。\n\n![](img/00023.jpeg)\n\n图 18.1：你的第一个简单 WPF 应用程序\n\n它看起来是一个标准的窗口，带有最小化、还原和关闭按钮。如果你点击关闭按钮，窗口将关闭，应用程序将终止。\n\
  \n## 简单 WPF 应用程序 2\n\n回想 `Application` 类的 `Run` 方法有一个不带参数的重载。你可能会想，如果你使用这个 `Run`\
  \ 重载，如何向应用程序传递 `Window` 对象？答案是调用 `Run` 的任何重载都会导致 `Application` 实例的 `OnStartup` 方法被调用。在这里编写创建\
  \ `Window` 对象的代码，可以实现向另一个 `Run` 方法传递 `Window` 目标。在这个示例中，你通过扩展 `Application` 类来创建\
  \ WPF 应用程序，并将窗口创建委托给它的 `OnStartup` 方法。\n\n代码如列表 18.2 所示。\n\n列表 18.2：通过扩展 Application\
  \ 创建 WPF 应用程序\n\n\n\n\n```csharp\nusing System;\nusing System.Windows;\nusing System.Windows.Controls;\n\
  \nnamespace App18\n{\n    class SimpleWpf2 : Application\n    {\n        // WPF\
  \ apps should execute on a STA thread\n        [STAThread]\n        static void\
  \ Main(string[] args)\n        {\n            SimpleWpf2 app = new SimpleWpf2();\n\
  \            app.Run();\n        }\n\n        protected override void OnStartup(StartupEventArgs\
  \ e)\n        {\n            base.OnStartup(e);\n            Calendar calendar =\
  \ new Calendar();\n            Window window = new Window();\n            window.Title\
  \ = \"WPF 2\";\n            window.Height = 205;\n            window.Width = 200;\n\
  \            window.Content = calendar;\n\n            window.WindowStartupLocation\
  \ = \n                WindowStartupLocation.CenterScreen;\n            window.Show();\n\
  \        }\n    }\n}\n```\n\n这段代码包含在 `SimpleWPF2` 项目中。要运行它，请将 `SimpleWPF2` 设置为默认项目，并在你的\
  \ `Visual Studio Express` 解决方案中按 `F5`。你将看到一个包含日历的窗口，如图 18.2 所示。\n\n![](img/00024.jpeg)\n\
  \n图 18.2：另一个简单的 WPF 应用程序\n\n## WPF 控件\n\n你在之前的示例中看到了两个控件：`Label` 和 `Calendar`。.NET\
  \ Framework 提供了许多像 `Label` 和 `Calendar` 这样可以使用即用的控件。简单的包括 `Label`、`TextBox` 和 `Button`。复杂的包括如\
  \ `Calendar`、`RichTextBox` 和 `WebBrowser` 等控件。还有面板（panels），它们是包含其他控件的控件。`DockPanel`、`Grid`\
  \ 和 `StackPanel` 就是面板的示例。\n\n这是一个不完整的 WPF 控件列表：\n\n- `Border`: 代表用于装饰另一个控件的边界。\n\
  - `Button`: 代表一个可点击的按钮。\n- `Calendar`: 代表一个可滚动的日历。\n- `Canvas`: 代表包含子元素的空白屏幕。\n\
  - `CheckBox`: 代表一个复选框。\n- `ComboBox`: 代表带有下拉列表的组合框。\n- `DataGrid`: 代表在可自定义网格中显示数据的控件。\n\
  - `DatePicker`: 代表一个用于选择日期的控件。\n- `DockPanel`: 代表一个面板，其子元素可以相对于彼此水平或垂直排列。\n- `Grid`:\
  \ 代表一个由行和列组成的网格区域的面板。\n- `Image`: 代表一个显示图像的控件。\n- `Label`: 代表一段不可编辑的文本。\n- `ListBox`:\
  \ 代表选项列表。\n- `Menu`: 代表一个可以按层级组织元素的菜单。\n- `Panel`: 代表所有 Panel 元素的基类。\n- `PasswordBox`:\
  \ 代表用于输入密码的控件。\n- `PrintDialog`: 代表一个打印对话框。\n- `ProgressBar`: 代表一个进度条。\n- `RadioButton`:\
  \ 代表一个单选按钮。\n- `RichTextBox`: 代表一个富文本编辑控件。\n- `Separator`: 代表用于分隔项目控件中项目的控件。\n-\
  \ `Slider`: 代表一个滑块控件。\n- `SpellCheck`: 作为拼写检查器，用于如 `TextBox` 或 `RichTextBox` 等文本编辑控件。\n\
  - `StackPanel`: 一种可以包含按水平或垂直排列成单行子元素的面板。\n- `TabControl`: 代表一个包含在屏幕上占据相同空间项目的控件。\n\
  - `TextBox`: 代表一个可以显示文本并允许用户编辑它的控件。\n- `ToolBar`: 代表一个组命令或其他控件的容器。\n- `ToolTip`:\
  \ 代表一个工具提示。\n- `TreeView`: 代表一个以树形结构显示数据的控件。\n- `Validation`: 提供对数据验证的支持。\n- `WebBrowser`:\
  \ 代表一个可以嵌入 WPF 应用程序的网络浏览器。\n\n你将在接下来的示例中使用其中一些控件。\n\n## 面板与布局\n\n一个只有一个控件的 WPF 应用程序是非常罕见的。在大多数情况下，你会在应用程序中使用许多控件。在这种情况下，这些控件必须排列在容器（如面板）中。面板是一个矩形形状，可以在其中添加子元素。`System.Windows.Controls.Panel`\
  \ 类代表面板，并在相同的命名空间提供了几个实现。面板可以包含其他面板。\n\n在与面板工作时，你必须考虑子控件应该如何布局。列表 18.3 中的代码显示了如何使用面板并布局其控件。\n\
  \n列表 18.3：面板示例\n\n```csharp\nusing System;\nusing System.Windows;\nusing System.Windows.Controls;\n\
  \nnamespace App18\n{\n    class PanelExample : Application\n    {\n        // WPF\
  \ apps should execute on a STA thread\n        [STAThread]\n        static void\
  \ Main(string[] args)\n        {\n            PanelExample app = new PanelExample();\n\
  \            app.Run();\n        }\n\n        protected override void OnStartup(StartupEventArgs\
  \ e)\n        {\n            base.OnStartup(e);\n            PanelWindow window\
  \ = new PanelWindow();\n            window.Title = \"Panel Example\";\n        \
  \    window.Height = 228;\n            window.Width = 200;\n\n            window.WindowStartupLocation\
  \ = \n                WindowStartupLocation.CenterScreen;\n            window.Show();\n\
  \        }\n    }\n\n    class PanelWindow : Window\n    {\n        public PanelWindow()\n\
  \        {\n            StackPanel mainPanel = new StackPanel();\n            Calendar\
  \ calendar = new Calendar();\n            Button button1 = new Button();\n     \
  \       button1.Content = \"Previous Year\";\n            Button button2 = new Button();\n\
  \            button2.Content = \"Next Year\";\n\n            StackPanel buttonPanel\
  \ = new StackPanel();\n            buttonPanel.Orientation = Orientation.Horizontal;\n\
  \            buttonPanel.HorizontalAlignment = \n                System.Windows.HorizontalAlignment.Center;\n\
  \            buttonPanel.Children.Add(button1);\n            buttonPanel.Children.Add(button2);\n\
  \n            mainPanel.Children.Add(calendar);\n            mainPanel.Children.Add(buttonPanel);\n\
  \n            this.Content = mainPanel;\n        }\n    }\n}\n```\n\n![](img/00024.jpeg)\n\
  \n图 18.3：使用面板\n\n如图 18.3 所示，有几个布局得很好的控件。使用提供的布局的好处是，当你调整窗口大小时，布局会被保留，如图 18.4 所示。\n\
  \n![](img/00025.jpeg)\n\n图 18.4：面板示例（放大）\n\n“上一年”和“明年”按钮是为了允许用户更改年份。然而，当你点击其中任何一个时，什么都不会发生。这是预期的，因为我们没有指示应用程序如何响应。要在事件发生时（例如用户点击按钮时）执行某些操作，你需要编写一个事件处理程序。这个主题将在下一节“事件处理”中介绍。\n\
  \n## 事件处理\n\n事件处理是一种编程范式，在事件触发时会执行一组指令。你已经在第 16 章节“高级语言特性”中学习了相关理论。现在让我们来看看它的实际效果。\n\
  \n列表 18.4 展示了一个类，显示了你如何编写事件处理方法并将其链接到事件。\n\n列表 18.4：事件处理\n\n\n\n\n```\nusing System;\n\
  using System.Windows;\nusing System.Windows.Controls;\n\nnamespace App18\n{\n  \
  \  class EventExample : Application\n    {\n        // WPF 应用应该在 STA 线程上执行\n   \
  \     [STAThread]\n        static void Main(string[] args)\n        {\n        \
  \    EventExample app = new EventExample();\n            app.Run();\n        }\n\
  \n        protected override void OnStartup(StartupEventArgs e)\n        {\n   \
  \         base.OnStartup(e);\n            EventWindow window = new EventWindow();\n\
  \            window.Title = \"Event Example\";\n            window.Height = 228;\n\
  \            window.Width = 200;\n\n            window.WindowStartupLocation = \n\
  \                WindowStartupLocation.CenterScreen;\n            window.Show();\n\
  \        }\n    }\n\n    class EventWindow : Window\n    {\n        Calendar calendar;\n\
  \        public EventWindow()\n        {\n            StackPanel mainPanel = new\
  \ StackPanel();\n            calendar = new Calendar();\n            Button button1\
  \ = new Button();\n            button1.Content = \"Highlight\";\n            Button\
  \ button2 = new Button();\n            button2.Content = \"No Highlight\";\n\n \
  \           StackPanel buttonPanel = new StackPanel();\n            buttonPanel.Orientation\
  \ = Orientation.Horizontal;\n            buttonPanel.HorizontalAlignment = \n  \
  \              System.Windows.HorizontalAlignment.Center;\n            buttonPanel.Children.Add(button1);\n\
  \            buttonPanel.Children.Add(button2);\n\n            mainPanel.Children.Add(calendar);\n\
  \            mainPanel.Children.Add(buttonPanel);\n\n            button1.Click +=\
  \ OnClick1;\n            button2.Click += OnClick2;\n\n            this.Content\
  \ = mainPanel;\n        }\n\n        void OnClick1(object sender, RoutedEventArgs\
  \ e)\n        {\n            calendar.IsTodayHighlighted = true;\n        }\n  \
  \      void OnClick2(object sender, RoutedEventArgs e)\n        {\n            calendar.IsTodayHighlighted\
  \ = false;\n        }\n    }\n}\n```\n\n请特别注意加粗的行。\n\n```\nbutton1.Click += OnClick1;\n\
  button2.Click += OnClick2;\n```\n\n这些行基本上是告诉 WPF，`button1` 的 `Click` 事件已链接到 `OnClick1`，而\
  \ `button2` 的 `Click` 事件已链接到 `OnClick2`。`OnClick1` 和 `OnClick2` 是事件处理器，用于更改 `Calendar`\
  \ 控件的 `IsTodayHighlighted` 属性的值。\n\n```\nvoid OnClick1(object sender, RoutedEventArgs\
  \ e)\n{\n    calendar.IsTodayHighlighted = true;\n}\nvoid OnClick2(object sender,\
  \ RoutedEventArgs e)\n{\n    calendar.IsTodayHighlighted = false;\n}\n```\n\n运行列表\
  \ 18.4 中的代码将显示一个带有日历和两个按钮的窗口，如图 18.5 所示。由于按钮已连接到了事件处理器，它们现在是“活跃”的。\n\n![](img/00026.jpeg)\n\
  \n图 18.5：带有事件处理器的 WPF 应用\n\n## XAML\n\nXAML 代表可扩展应用程序标记语言（eXtensible Application\
  \ Markup Language）。它最初是为 WPF 设计的，但可以用于任何层次结构数据类型。\n\n当你使用 Visual Studio 创建 WPF 项目时，会为你创建两个\
  \ `.xaml` 文件。第一个文件 `MainWindow.xaml` 描述了你 WPF 中的主窗口。它看起来像这样：\n\n```xml\n<Window\
  \ x:Class=\"XamlExample1.MainWindow\"\n   xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n   xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n   Title=\"MainWindow\"\
  \ Height=\"350\" Width=\"525\">\n\n   <Grid>\n\n   </Grid>\n\n</Window>\n```\n\n\
  默认情况下，它使用 `Grid` 作为所有控件的主面板。然而，你可以轻松地更改它。\n\n启动 WPF 项目时为你创建的第二个 XAML 文件是 `App.xaml`\
  \ 文件。它看起来像这样：\n\n```xml\n<Application x:Class=\"XamlExample1.App\"\n   xmlns=\"\
  http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n   xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\
  \n   StartupUri=\"MainWindow.xaml\">\n\n   <Application.Resources>\n\n   </Application.Resources>\n\
  </Application>\n```\n\n此文件描述了 WPF 。请注意，`Application` 元素包含一个 `StartupUri` 属性，它引用了定义\
  \ `Window` 对象的 `MainWindow.xaml` 文件。\n\n如果你运行项目，将看到一个空白窗口。\n\n接下来的示例是一个基于 XAML 的\
  \ WPF 应用。列表 18.5 显示了它的 `MainWindow.xaml` 文件，列表 18.6 显示了它的 `App.xaml` 文件。\n\n列表 18.5：`MainWindow.xaml`\
  \ 文件\n\n```xml\n<Window x:Class=\"XamlExample2.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        Title=\"\
  MainWindow\" Height=\"350\" Width=\"525\">\n    <DockPanel LastChildFill=\"True\"\
  >\n        <Label Foreground=\"Green\" Background=\"Bisque\" DockPanel.Dock=\"Top\"\
  \ \n               Height=\"100\" HorizontalContentAlignment=\"Center\">Top</Label>\n\
  \        <Label Foreground=\"Red\" Background=\"Beige\" DockPanel.Dock=\"Left\"\
  \ \n               Width=\"50\" VerticalContentAlignment=\"Center\">Left</Label>\n\
  \        <TextBlock Foreground=\"Blue\" Background=\"AliceBlue\" \n            \
  \       DockPanel.Dock=\"Right\">Right</TextBlock>\n    </DockPanel>\n</Window>\n\
  ```\n\n列表 18.6：`App.xaml` 文件\n\n```xml\n<Application x:Class=\"XamlExample2.App\"\
  \n   xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n   xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\n   StartupUri=\"MainWindow.xaml\"\
  >\n\n   <Application.Resources>\n\n   </Application.Resources>\n</Application>\n\
  ```\n\n从 XAML 示例可以看到，应用程序没有包含任何代码。如果不用 XAML 编写，应用程序将像列表 18.7 中的代码。\n\n列表 18.7：XAML\
  \ 示例的等等代码\n\n```csharp\nusing System;\nusing System.Windows;\nusing System.Windows.Controls;\n\
  using System.Windows.Media;\n\nnamespace XamlExample2\n{\n    class CodeOnly : Application\n\
  \    {\n        // WPF 应用应该在 STA 线程上执行\n        [STAThread]\n        static void\
  \ Main(string[] args)\n        {\n            CodeOnly app = new CodeOnly();\n \
  \           app.Run();\n        }\n\n        protected override void OnStartup(StartupEventArgs\
  \ e)\n        {\n            base.OnStartup(e);\n            Window window = new\
  \ Window();\n            window.Title = \"CodeOnly\";\n            window.Height\
  \ = 350;\n            window.Width = 525;\n\n            DockPanel dockPanel = new\
  \ DockPanel();\n            dockPanel.LastChildFill = true;\n\n            Label\
  \ topElement = new Label();\n            topElement.Content = \"Top\";\n       \
  \     DockPanel.Set(topElement, Dock.Top);\n            topElement.Foreground =\
  \ new SolidColorBrush(Colors.Green);\n            topElement.Background = new SolidColorBrush(Colors.Bisque);\n\
  \            topElement.Height = 100;\n            topElement.HorizontalContentAlignment\
  \ = HorizontalAlignment.Center;\n\n            Label leftElement = new Label();\n\
  \            leftElement.Content = \"Left\";\n            DockPanel.Set(leftElement,\
  \ Dock.Left);\n            leftElement.Foreground = new SolidColorBrush(Colors.Red);\n\
  \            leftElement.Background = new SolidColorBrush(Colors.Beige);\n     \
  \       leftElement.Width = 50;\n            leftElement.VerticalContentAlignment\
  \ = VerticalAlignment.Center;\n\n            TextBox rightElement = new TextBox();\n\
  \            rightElement.Text = \"Right\";\n            rightElement.Foreground\
  \ = new SolidColorBrush(Colors.Blue);\n            rightElement.Background = new\
  \ SolidColorBrush(Colors.AliceBlue);\n            DockPanel.Set(rightElement, Dock.Right);\n\
  \n            dockPanel.Children.Add(topElement);\n            dockPanel.Children.Add(leftElement);\n\
  \            dockPanel.Children.Add(rightElement);\n\n            window.Content\
  \ = dockPanel;\n            window.Show();\n        }\n    }\n}\n```\n\n## 使用 WPF\
  \ 的多态示例\n\n你也可以在 WPF 中使用许多不同的面向对象（OOP）技术。例如，这里有一个多态的示例。\n\n\n\n\n\n假设你有一个 WPF 应用，并且有一个名为\
  \ `MakeMoreTransparent` 的方法，它可以更改 `UIElement` 的透明度。你希望向该方法传递任何 WPF 控件和面板。因此，你需要让该方法接受\
  \ `UIElement`，它是 WPF 中所有 UI 元素的基类。列表 18.8 显示了该方法。\n\n列表 18.8：`MakeMoreTransparent`\
  \ 方法\n\n```cpp\n void MakeMoreTransparent(UIElement uiElement)\n{\n    double opacity\
  \ = uiElement.Opacity;\n    if (opacity > 0.2)\n    {\n        uiElement.Opacity\
  \ = opacity - 0.1;\n    }\n}\n```\n\n得益于多态，`MakeMoreTransparent` 将接受 `UIElement`\
  \ 的实例或 `UIElement` 子类的实例。列表 18.9 显示了完整的 WPF 应用，这是一个包含一个日历和三个按钮的窗口。点击第三个按钮将遍历窗口的所有子元素并将每个子元素传递给\
  \ `MakeMoreTransparent`。\n\n列表 18.9：带有多态的 WPF 应用\n\n```cpp\n using System;\nusing\
  \ System.Windows;\nusing System.Windows.Controls;\n\nnamespace PolymorphismExample\n\
  {\n    class PolymorphismExample : Application\n    {\n        // WPF apps should\
  \ execute on a STA thread\n        [STAThread]\n        static void Main(string[]\
  \ args)\n        {\n            PolymorphismExample2 app = new PolymorphismExample2();\n\
  \            app.Run();\n        }\n\n        protected override void OnStartup(StartupEventArgs\
  \ e)\n        {\n            base.OnStartup(e);\n            EventWindow window\
  \ = new EventWindow();\n            window.Title = \"Polymorphism Example\";\n \
  \           window.Height = 228;\n            window.Width = 300;\n\n          \
  \  window.WindowStartupLocation = \n                WindowStartupLocation.CenterScreen;\n\
  \            window.Show();\n        }\n    }\n\n    class EventWindow : Window\n\
  \    {\n        Calendar calendar;\n        public EventWindow()\n        {\n  \
  \          StackPanel mainPanel = new StackPanel();\n            calendar = new\
  \ Calendar();\n            Button button1 = new Button();\n            button1.Content\
  \ = \"Highlight\";\n            Button button2 = new Button();\n            button2.Content\
  \ = \"No Highlight\";\n            Button button3 = new Button();\n            button3.Content\
  \ = \"Make more transparent\";\n\n            StackPanel buttonPanel = new StackPanel();\n\
  \            buttonPanel.Orientation = Orientation.Horizontal;\n            buttonPanel.HorizontalAlignment\
  \ = \n                System.Windows.HorizontalAlignment.Center;\n            buttonPanel.Children.Add(button1);\n\
  \            buttonPanel.Children.Add(button2);\n            buttonPanel.Children.Add(button3);\n\
  \n            mainPanel.Children.Add(calendar);\n            mainPanel.Children.Add(buttonPanel);\n\
  \            button1.Click += OnClick1;\n            button2.Click += OnClick2;\n\
  \            button3.Click += OnClick3;\n            this.Content = mainPanel;\n\
  \        }\n\n        void OnClick1(object sender, RoutedEventArgs e)\n        {\n\
  \            calendar.IsTodayHighlighted = true;\n        }\n        void OnClick2(object\
  \ sender, RoutedEventArgs e)\n        {\n            calendar.IsTodayHighlighted\
  \ = false;\n        }\n        void OnClick3(object sender, RoutedEventArgs e)\n\
  \        {\n            Panel panel = (Panel) this.Content;\n            int childrenCount\
  \ = panel.Children.Count;\n            Console.WriteLine(\"start\");\n         \
  \   foreach (UIElement child in panel.Children)\n            {\n               \
  \ MakeMoreTransparent(child);\n            }\n        }\n\n        void MakeMoreTransparent(UIElement\
  \ uiElement)\n        {\n            double opacity = uiElement.Opacity;\n     \
  \       if (opacity > 0.2)\n            {\n                uiElement.Opacity = opacity\
  \ - 0.1;\n            }\n\n        }\n    }\n}\n```\n\n如果你运行该 WPF 应用，你将看到类似于图 18.6\
  \ 中的所示窗口。反复点击右侧的按钮以查看多态的运作。\n\n![](img/00027.jpeg)\n\n图 18.6：带有多态的 WPF\n\n## 绘图应用程序\n\
  \n这是另一个 WPF 应用。它同样利用了多态性。\n\n多态的优势在程序员预先不知道将创建的对象类型的情况下尤为易见。例如，考虑图 18.7 中的 `Simple\
  \ Draw` 应用。通过此应用，你可以绘制三种类型的形状：矩形、线条和椭圆。\n\n![](img/00028.jpeg)\n\n图 18.7：一个 Simple\
  \ Draw 应用\n\n例如，要画一条线，首先点击 `Line` 单选按钮，然后在绘制区域上点击并拖动，然后释放鼠标按钮。你第一次点击绘制区域的位置将成为起点\
  \ (`x1`, `y1`)。你释放鼠标按钮的坐标将是终点 (`x2`, `y2`)。\n\n现在，让我们来看看该应用程序是如何工作的。\n\n首先，查看列表\
