  \ `IShape` 的变量 `shape`。赋值 `shape` 的对象取决于 `shapeType`。在这种情况下，你可以看到在编写类时并不知道创建哪个对象，在编译时也是如此。\n\
  \n## 总结\n\nWPF 是一种用于开发桌面应用的 .NET 技术。在本章中，你学习了 WPF 中的两个主要类：`Application` 和 `Window`，并使用了一些控件。你还学习了可以通过编写代码或使用\
  \ XAML 和代码来编写 WPF 程序。\n\n# 第 19 章\n\n多线程\n\n\n\n\n\nC# 最具吸引力的特性之一是支持易于线程编程。二十年前，线程仅是编程专家的领域。有了\
  \ C# 和其他现代编程语言，即使是初学者现在也可以编写多线程应用程序。\n\n本章解释了什么是线程以及它们为什么重要。它还讨论了同步和可见性问题等相关主题。\n\
  \n## 线程简介\n\n线程是操作系统分配处理器时间的的基本处理单元。线程有时被称为轻量级进程或执行上下文。通过并发运行多个线程，你可以同时执行两个或多个任务，或者给用户提供一种多个任务正在并发执行的错觉。\n\
  \n对于具有多个处理器或单处理器多核的计算机来说，同时运行多个线程并不难实现，因为不同的线程可以在不同的核心或处理器上并发执行。在如今已罕见的单核处理器中，处理时间被切片，每个线程被分配一部分时间，从而给用户一种若干计算正在同时执行的印象。当线程数量超过核心数量时，多核处理器也会发生时间切片现象；当线程数量超过处理器数量时，多处理器计算机也会发生这种情况。\n\
  \n拥有多个线程的程序被称为多线程应用程序。多线程编程或多线程通常用于计算机游戏，但并不局限于此类应用程序。多线程还用于更快地完成任务并提高用户界面的响应能力。例如，如果只有一个线程在执行，当向硬盘写入大文件时，应用程序可能看起来在“卡住”，鼠标光标无法移动且按钮拒绝被点击。通过专门一个线程用于保存文件，另一个线程用于接收用户输入，你的应用程序可以更具响应性。\n\
  \n然而，线程确实消耗资源，因此你不应该创建超过必要的线程数量。此外，跟踪许多线程是一项复杂的编程任务。\n\n## 创建线程\n\n每个 C# 程序都至少有一个线程，即执行程序的线程。当你调用\
  \ C# 程序的静态 `Main` 方法时，系统会创建该线程。若要使用额外的线程，你必须自己创建它们。\n\n线程由 `System.Threading.Thread`\
  \ 类表示。你可以通过调用其接受 `ThreadStart` 委托的构造函数来创建一个 `Thread`：\n\n```\npublic Thread(ThreadStart\
  \ threadStart)\n```\n\n`ThreadStart` 委托类型表示要在线程中执行的方法。其签名如下。\n\n```\npublic delegate\
  \ void ThreadStart()\n```\n\n要创建一个 `Thread`，你可以将一个方法传递给 `ThreadStart` 实例并将其传递给 `Thread`\
  \ 类的构造函数，或者直接将方法传递给 `Thread`。\n\n```\nThread t1 = new Thread(new ThreadStart(myMethod));\n\
  Thread t2 = new Thread(myMethod);\n```\n\n要启动一个 `Thread`，调用它的 `Start` 方法。执行完其方法的\
  \ `Thread` 将自然死亡。你不需要做任何事情。\n\n表 19.1 显示了 `Thread` 类中定义的一些方法，表 19.2 展示了它的某些属性。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `Start` | 启动线程。 |\n| `Sleep` | 暂停指定的毫秒数。 |\n|\
  \ `Abort` | 在线程到达安全点时停止线程。 |\n| `Join` | 阻塞直到调用此方法的线程终止。 |\n\n表 19.1：`Thread` 类更重要的方法\n\
  \n注意：安全点是代码中可以进行垃圾回收的点。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `IsAlive` | 表示线程是否活跃。\
  \ |\n| `IsBackground` | 表示该线程是后台线程还是前台线程。 |\n| `Name` | 线程名称。 |\n| `Priority` |\
  \ 线程的优先级。其值是 `ThreadPriority` 枚举中的成员之一（`AboveNormal`、`BelowNormal`、`Highest`、`Lowest`、`Normal`）。默认值为\
  \ `Normal`。当两个或多个线程竞争有限的处理时间时，此属性非常重要。优先级线程将被优先执行。 |\n| `ThreadState` | 线程的状态。其值是\
  \ `ThreadState` 枚举成员之一（`Aborted`、`AbortRequested`、`Background`、`Running`、`Stopped`、`StopRequested`、`Suspended`、`SuspendRequested`、`Unstarted`\
  \ 和 `WaitSleepJoin`）。 |\n| `CurrentThread` | 当前运行的线程。 |\n\n表 19.2：`Thread`类的属性\n\
  \nListing 19.1 和 19.2 显示了构成多线程应用程序的两个类。Listing 19.1 中 `Counter` 类的 `Count` 方法表示打印数字\
  \ 0 到 2 的任务。\n\nListing 19.1：`Counter` 类\n\n```cs\nusing System;\nusing System.Threading;\n\
  \nnamespace Multithreading\n{\n    class Counter\n    {\n        public void Count()\n\
  \        {\n            for (int i = 0; i < 3; i++)\n            {\n           \
  \     Console.WriteLine(Thread.CurrentThread.Name + \" : \" + i);\n            \
  \    Thread.Sleep(50);\n            }\n        }\n    }\n}\n```\n\nListing 19.2\
  \ 显示了一个创建了两个 `Threads` 并 `Count` 方法作为任务传递的程序。\n\nListing 19.2：在不同的线程中使用 Count\n\n\
  ```cs\nusing System;\nusing System.Threading;\n\nnamespace Multithreading\n{\n \
  \   class Program\n    {\n        static void Main(string[] args)\n        {\n \
  \           Counter counter = new Counter();\n            Thread t1 = new Thread(counter.Count);\n\
  \            t1.Name = \"Thread 1\";\n            Thread t2 = new Thread(new ThreadStart(counter.Count));\n\
  \            t2.Name = \"Thread 2\";\n            t1.Start();\n            t2.Start();\n\
  \        }\n    }\n}\n```\n\n如果你运行这个小型程序，你将在控制台上看到这些打印消息。\n\n```\nThread 1 : 0\n\
  Thread 2 : 0\nThread 1 : 1\nThread 2 : 1\nThread 1 : 2\nThread 2 : 2\n```\n\n结果显示两个线程是并发运行的。\n\
  \n## 使用 Join 方法\n\n当你在 `Thread` 上调用 `Start` 方法来运行给线程的任务时，该方法会立即返回，即使任务尚未完成。运行额外线程的主线程将通过执行\
  \ `Start` 方法调用点正下方的代码行来恢复程序运行。\n\n为了说明这一点，请考虑 Listing 19.3 和 19.4 中的代码。Listing 19.3\
  \ 中的类只需睡眠 100 毫秒，然后打印一个字符串。\n\nListing 19.3：`JoinDemo` 类\n\n```cs\nusing System;\n\
  using System.Threading;\n\nnamespace Multithreading\n{\n    class JoinDemo\n   \
  \ {\n        public void Print()\n        {\n            Thread.Sleep(100);\n  \
  \          Console.WriteLine(\"Printing ... \");\n        }\n    }\n}\n```\n\nListing\
  \ 19.4 显示了一个创建了 `Thread` 并调用其 `Start` 方法的程序。\n\n```cs\nusing System;\nusing System.Threading;\n\
  \nnamespace Multithreading\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Thread t3 = new Thread(new JoinDemo().Print);\n\
  \            t3.Start();\n            Console.WriteLine(\"Finished.\");\n      \
  \  }\n    }\n}\n```\n\n当你运行程序时，你将在控制台上看到这些：\n\n```\nFinished.\nPrinting...\n```\n\
  \n“Finished.” 在 “Printing...” 之前打印，是因为主线程在线程完成之前不会执行调用线程 `Start` 方法点之后的代码。\n\n现在，如果你在\
  \ `Start` 之后这样调用 `Join`：\n\n```cs\nThread t3 = new Thread(new JoinDemo().Print);\n\
  t3.Start();\nt3.Join();\n```\n\n你将在控制台上看到的是这些内容：\n\n```\nPrinting...\nFinished.\n\
  ```\n\n`Join` 方法会阻塞直到 `Thread` 完成。\n\n## 向线程传递 Lambda 表达式\n\n`Thread` 类的构造函数接受方法或委托实例。因此，你也可以传递匿名方法或\
  \ Lambda 表达式。\n\nListing 19.5 显示了 Listing 19.1 代码的重写，但使用了 Lambda 表达式。\n\n\n\n\n\n\
  列表 19.5: 向线程传递 lambda 表达式\n\n```c\n Thread t4 = new Thread(() =>\n    {\n      \
  \  for (int i = 0; i < 3; i++)\n        {\n            Console.WriteLine(Thread.CurrentThread.Name\
  \ + \" : \" + i);\n            Thread.Sleep(50);\n        }\n    });\nt4.Name =\
  \ \"Thread 4\";\nt4.Start();\n```\n\n## 前台线程与后台线程\n\n通用语言运行时（CLR）区分了前台线程和后台线程。前台线程会保持应用程序运行，而后台线程不会。这意味着，如果你从主线程启动了一个前台线程，只要该前台线程活跃，即使主线程执行完毕，应用程序也不会退出。相反，当主线程完成且没有存活的前台线程时，后台线程将被强制终止。\n\
  \n默认情况下，通过调用 `Thread` 的任构造函数创建的线程在前台线程。要将其变为后台线程，请将其 `IsBackground` 属性设置为 `true`：\n\
  \n```c\n Thread thread = new Thread(...);\nthread.IsBackgroudn = true;\nthread.Start();\n\
  ```\n\n## 同步\n\n当两个或多个线程访问共享的可写资源或变量时，你就会面临着数据损坏的风险。这是因为大多数操作不是原子的。根据定义，原子操作是一组可以组合的操作，在系统的其他部分看起来像是一个单一操作。\n\
  \n当两个在不同线程中运行但作用于相同数据的非原子操作发生交错执行时，被称为线程干扰（thread interference）。线程干扰可能导致竞态条件（race\
  \ condition）。竞态条件是指多个线程同时读取或写入某些共享数据，导致结果变得不可预测。竞态条件可能导致难以发现的细微或严重的错误。相比之下，线程安全的代码在被多个线程访问时能够正常运行。\n\
  \n保证线程安全并非易事，因为即使是增加一个 `int` 这样简单的指令都不是原子的：\n\n```csharp\n b++;\n```\n\n这是因为 `b++`\
  \ 需要多条 CPU 指令：\n\n* 将 `b` 所引用内存位置中的值加载到寄存器中。\n* 递增寄存器的值。\n* 将寄存器中的新值复制到原始内存位置。\n\
  \n假设 `b` 的当前值为 `0`。调用两次 `b++` 应该将其值改为 `2`。然而，情况并不总是如此。想象有两个线程（`Thread 1` 和 `Thread\
  \ 2`）几乎在同时调用 `b++`。假设 `Thread 1` 先启动，并将 `0` 加载到寄存器并将其递增为 `1`。但在 `Thread 1` 有机会将值存回内存之前，`Thread\
  \ 2` 将 `b` 的值（仍为 `0`）加载到另一个寄存器并将其递增。随后 `Thread 1` 将其寄存器值存储到内存，紧接着 `Thread 2` 将其寄存器值存储到同一个内存位置。结果是：即使增加了两次，`b`\
  \ 的值仍为 `1`。你的程序中正式出现了一个 bug。\n\n为了防止这种情况发生，你应该始终同步多个线程对可写变量的访问。这意味着你限制一次只有一个线程可以访问它。实现此点的机制是创建一个保护代码段的\
  \ `lock`。`lock`可以是任意对象（包括 `System.Object` 的实例）。任何想要调用该代码段的线程必须先获取 `lock`。由于一次只能有一个线程获取\
  \ `lock`，因此在第一个线程完成之前尝试访问相同代码段的第二个线程将会被阻塞（等待），直到第一个线程释放 `lock`。\n\n你可以使用 `lock`\
  \ 关键字来同步代码块。考虑此此代码段：\n\n```csharp\n private static object myLock = new object();\n\
  public void IncrementB ()\n{\n    lock(myLock)\n    {\n        b++;\n    }\n}\n\
  ```\n\n任何需要增加 `b` 的线程都应该调用 `IncrementB`。此方法获取 `lock` 并一直保持它，直到后续代码块执行完毕。在第一个线程退出代码块并释放\
  \ `lock` 之前，不同的方法无法进入锁定区域。\n\n## Monitor\n\n`lock` 关键字可以使关键段线程安全。然而，也可以使用 `Monitor`\
  \ 类的 `Enter` 和 `Exit` 方法来实现。事实上，`lock` 关键字是这两个方法的语法糖。在编程语言中，语法糖是为了让某些功能更易于使用或表达的语法。\n\
  \n以下代码段\n\n```csharp\n lock(myLock)\n{\n    // statements\n}\n```\n\n会被编译器转换为如下形式：\n\
  \n```csharp\n Monitor.Enter(myLock);\ntry\n{\n    // statements\n}\nfinally \n{\
  \ \n    Monitor.Exit(myLock);\n}\n```\n\n`Enter` 方法获取锁或阻塞直到可以获取锁。`Exit` 方法释放锁。注意，需要线程安全的语句被放置在\
  \ `try` 块中，并且 `Exit` 方法在 `finally` 块中调用。因此，如果其中一条语句抛出异常，锁仍然会被释放。\n\n## Interlocked\n\
  \n你已经了解到增加（和递减）变量不是原子操作。因此，如果该操作从多个线程调用，则必须对它进行同步。为了简化这项繁琐的任务，.NET Framework 引入了\
  \ `System.Threading.Interlocked` 类，它提供了静态方法以线程安全的方式增加和递减变量。\n\n这里是 `Increment` 的签名。\n\
  \n```csharp\n public static int Increment(ref int location)\n```\n\n因此，你不需要编写如下代码\n\
  \n```csharp\n private static object myLock = new object();\npublic void IncrementB\
  \ ()\n{\n    lock(myLock)\n    {\n        b++;\n    }\n}\n```\n\n而是可以使用 `Interlocked`。\n\
  \n```csharp\n public void IncrementB ()\n{\n    Interlocked.Increment(ref b); \n\
  }\n```\n\n而且，你甚至不需要锁！\n\n## Volatile 关键字\n\n如果一个字段要被多个线程修改，你必须在字段声明中使用 `volatile`\
  \ 修饰符。`volatile` 修饰符确保字段始终存在最新值。\n\n`volatile` 修饰符是在不使用锁的情况下同步变量的方便方法。\n\n## WPF\
  \ 线程示例\n\n在本章最后，让我们来看一个具有多线程的的 WPF 应用程序。该展示了两个线程更新线条宽度，直到它们停止。\n\n列表 19.6 显示了 XAML\
  \ 文件中的应用程序布局。该应用程序由一个用于动画的画布和两个按钮组成。第一个按钮 Start 按钮启动动画。第二个按钮 Stop 按钮停止动画。\n\n 列表\
  \ 19.6: XAML 文件\n\n```xml\n <Window x:Class=\"AnimationWithThreads.MainWindow\"\n\
  \        xmlns=\"http://schemas.microsoft.com/winfx/2006/presentation\"\n      \
  \  xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:AnimationWithThreads\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"Animation with threads\" Height=\"232\" Width=\"600\">\n\n\
  \    <Grid>\n        <Grid.RowDefinitions>\n            <RowDefinition Height=\"\
  140\" />\n            <RowDefinition Height=\"70\" />\n        </Grid.RowDefinitions>\n\
  \n        <Canvas Height=\"180\" Width=\"600\" Grid.Column=\"0\" Grid.Row=\"0\"\
  >\n            <Line Name=\"line1\"\n                X1=\"0\" Y1=\"40\"\n      \
  \          X2=\"30\" Y2=\"40\"\n                Stroke=\"Red\"\n               \
  \ StrokeThickness=\"40\" />\n\n            <Line Name=\"line2\"\n              \
  \  X1=\"0\" Y1=\"100\"\n                X2=\"30\" Y2=\"100\"\n                Stroke=\"\
  Green\"\n                StrokeThickness=\"40\" />\n        </Canvas>\n        <StackPanel\
  \ Grid.Column=\"0\" Grid.Row=\"1\" \n                Orientation=\"Horizontal\"\
  >\n            <Button Click=\"StartButton_Click\" Content=\"Start\" Width=\"60\"\
  \ \n                    Height=\"50\"/>\n            <Button Click=\"StopButton_Click\"\
  \ Content=\"Stop\" Width=\"60\" \n                    Height=\"50\"/>\n        </StackPanel>\n\
  \    </Grid>\n</Window>\n```\n\n\n\n\n注意 `Start` 按钮的 `Click` 事件绑定到 `StartButton_Click`\
  \ 方法，而 `Stop` 按钮的 `Click` 事件由 `StopButton_Click` 方法处理。列表 19.7 显示了包含这两个处理程序的程序。\n\
  \n```cs\n using System;\nusing System.Threading;\nusing System.Windows;\n\nnamespace\
  \ AnimationWithThreads\n{\n    /// <summary>\n    /// MainWindow.xaml 的交互逻辑\n  \
  \  /// </summary>\n    public partial class MainWindow : Window\n    {\n       \
  \ private volatile bool stopped = false;\n        public MainWindow()\n        {\n\
  \            InitializeComponent();\n        }\n\n        private void StartButton_Click(object\
  \ sender, RoutedEventArgs e)\n        {\n            Thread thread1 = new Thread(()\
  \ =>\n            {\n                int width = 0;\n                stopped = false;\n\
  \                while(!stopped)\n                {\n                    width +=\
  \ 10;\n                    this.Dispatcher.Invoke((Action)(() =>\n             \
  \       {\n                        line1.X2 = width;\n                    }));\n\
  \                    if (width == 600)\n                    {\n                \
  \        width = 0;\n                    }\n                    Thread.Sleep(100);\n\
  \                }\n            });\n            thread1.Start();\n\n          \
  \  Thread thread2 = new Thread(() =>\n            {\n                int width =\
  \ 0;\n                stopped = false;\n                while (!stopped)\n     \
  \           {\n                    width += 10;\n                    this.Dispatcher.Invoke((Action)(()\
  \ =>\n                    {\n                        line2.X2 = width;\n       \
  \             }));\n                    if (width == 600)\n                    {\n\
  \                        width = 0;\n                    }\n                   \
  \ Thread.Sleep(50);\n                }\n            });\n            thread2.Start();\n\
  \        }\n\n        private void StopButton_Click(object sender, RoutedEventArgs\
  \ e)\n        {\n            stopped = true;\n        }\n    }\n}\n```\n\n`StartButton_Click`\
  \ 方法创建两个线程并启动它们。每个线程都被赋予了一个循环，不断改变线条的宽度并检查 `stopped` 变量，该变量被声明为 `volatile` 以确保对它的任何更改对两个线程都可见。`StopButton_Click`\
  \ 方法将 `stopped` 改为 `true`，从而实际上停止了线程。\n\n图 19.1 显示了应用程序。\n\n![](img/00029.gif)\n\
  \n图 19.1: 使用两个线程\n\n## 总结\n\n多亏于 .NET Framework 对线程的支持，使用 C# 进行多线程编程非常简单。要创建一个线程，你需要传递一个委托来实例化\
  \ `Thread` 类。在本章中，你学习了如何编写操作线程和同步线程的程序。你还学习了如何编写线程安全的代码。\n\n# 附录 A：Visual Studio\
