  要运行项目，按 `F5`。Visual Studio 将编译项目并运行带有 `Main` 方法的类。一个项目只能有一个 `Main` 方法。\n\nVisual\
  \ Studio 会运行项目之前捕获任何编译或生成错误。\n\n## 数据库工作\n\n\n\n\nVisual Studio 不仅仅是一个编译器，它还为开发者提供了许多实用的工具。其中一个工具允许你连接到关系型数据库或创建一个新数据库并对其数据进行操作。你可以创建表、更新表中的数据、运行\
  \ SQL 查询等。\n\nVisual Studio 还附带了 `LocalDB`，这是一个为开发者构建的 SQL Server Express 精简版本。`LocalDB`\
  \ 无需维护，并且由另一个程序启动。`LocalDB` 适用于开发。\n\n## 创建数据库\n\n你可以轻松地连接到现有数据库或创建一个新数据库。支持的数据源有：\n\
  \n* Microsoft Access 文件\n* Microsoft ODBC 数据源\n* Microsoft SQL Server\n* Microsoft\
  \ SQL Server 数据库文件\n* Oracle Database\n\n要创建一个数据库，请遵循以下步骤：\n\n1. 点击 `Tools`（工具）\
  \ > `Connect to Database`（连接到数据库）。你将看到图 A.8 所示的对话框。\n![](img/00037.jpeg)\n图 A.8：添加数据连接\n\
  \n2. 选择数据库类型。在本例中，选择 Microsoft SQL Server Database File。\n3. 点击 `Browser`（浏览）按钮并导航到存放数据库文件的文件夹。\n\
  4. 输入 `MyDB.mdf` 作为文件名并点击 `Open`（打开）。回到 `Add Connection`（添加连接）对话框后，保持身份验证方法（`Windows\
  \ authentication`）并点击 `OK` 按钮。\n5. Visual Studio 将询问是否希望创建一个新的数据库文件。点击 `Yes`（是）。\n\
