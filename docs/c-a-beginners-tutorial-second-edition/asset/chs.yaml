  \ 对象管理器），或点击 Visual Studio 左边缘的标签页。图 A.9 显示了 SQL Server 对象管理器的窗口。你应该在 `SQL Server`\
  \ 下看到 `(localdb)` 项。\n7. 展开 `(localdb)` 节点，你应该会在 `Databases`（数据库）节点下看到 `MyDB`（你新创建的\
  \ SQL Server 数据库文件）。\n![](img/00038.jpeg)\n图 A.9：SQL Server 对象管理器\n\n## 创建表\n\n\
  要在数据库中创建表，请遵循以下步骤。\n\n1. 如果尚未打开，打开 `SQL Server Object Explorer` 并展开 `SQL Server`\
  \ 节点，直到看到你想创建表的数据库（参见图 A.9）。\n2. 右键点击数据库节点下的 `Tables`（表）节点（例如 `MyDB`），并从弹出菜单中选择\
  \ `Add New Table`（添加新表）。将打开如图 A.10 所示的表设计器。\n![](img/00039.jpeg)\n图 A.10：表设计器\n\
  3. 添加具有正确数据类型的字段。随着你添加更多字段，底部的 `T-SQL` 窗口将更新脚本以包含这些字段。完成添加字段后，将表名从 `CREATE TABLE\
  \ [dbo].[Table]` 改为 `CREATE TABLE [dbo].tableName`，将 `tableName` 替换为表的实际名称。\n4.\
  \ 点击 `Update`（更新）按钮。在出现的对话框中，点击 `Update Database`（更新数据库）。该表应被添加到你数据库下的 `Tables`\
  \ 节点，如图 A.11 所示。\n![](img/00040.jpeg)\n图 A.11：新表（Employee）\n\n## 编辑表中的数据\n\n要向表中添加、删除或更新数据，请在\
  \ `SQL Server Object Explorer` 窗口中右键点击表名并选择 `View Data`（查看数据）。\n\n图 A.12 显示了表的数据视图。可以随意添加、删除和编辑记录。\n\
  ![](img/00041.jpeg)\n图 A.12：数据视图\n\n# 附录 B\n\n## SQL Server 2014 Express\n\nMicrosoft\
  \ SQL Server 是目前最流行的关系数据库服务器之一，本附录解释了如何下载和安装此广泛使用的软件免费版本——SQL Server 2014 Express。\n\
  \n## 下载 SQL Server 2014 Express\n\n可以从此网站下载 SQL Server 产品：\n\n```\nhttp://www.microsoft.com/en-us/server-cloud/products/sql-server-editions/sql-server-express.aspx\n\
  ```\n\n当你点击 `Download`（下载）链接时，会被要求使用 Microsoft 账户登录。如果没有，只需注册即可。它是免费的。\n\n成功登录后，你将被重定向到选择\
  \ SQL Server 产品的页面。选择 `SQL Server 2014 Express`（32 位或 64 位）、你偏好的语言以及居住国家。然后，将安装程序\
  \ `.exe` 文件保存到硬盘中。\n\n`SQL Server 2014 Express` 的替代方案是 `SQL Server 2014 LocalDB\
  \ Express`（32 位或 64 位），它是专门为程序员设计的 `SQL Server 2014 Express` 迷你版本。然而，Visual Studio\
  \ 已经包含了 `LocalDB`。有关如何在 Visual Studio 中使用 `LocalDB` 的信息请参见附录 A。\n\n## 注意\n\n在编写时，`SQL\
  \ Server 2016 Express` 即将发布。如果在阅读本书时它已经发布，请选择 2016 版本。\n\n## 安装 SQL Server 2014\
  \ Express\n\n要安装 `SQL Server 2014 Express`，请遵循以下步骤。\n\n1. 双击下载的安装文件。一个小型对话框将要求你确认提取文件的位置。选择一个目录或同意默认设置。你将看到一个如图\
  \ B.1 所示的对话框。\n![](img/00042.jpeg)\n图 B.1：开始安装过程\n2. 在右侧窗口，点击 `New SQL Server stand-alone\
  \ installation`（新建 SQL Server 独立安装）。\n3. 在下一个窗口中，勾选 `I accept the license terms`（我接受许可条款）复选框。\n\
  4. 点击 `Next`（下一步）。打开如图 B.2 所示的 `Feature Selection`（功能选择）窗口。\n![](img/00043.jpeg)\n\
  图 B.2：功能选择窗口\n5. 接受默认并点击 `Next`。\n6. 下一个窗口是 `Instance Configuration`（实例配置）窗口，如图\
  \ B.3 所示。\n![](img/00044.jpeg)\n图 B.3：实例配置窗口\n7. 再次接受默认并点击 `Next`。你将看到如图 B.4 所示的\
  \ `Server Configuration`（服务器配置）窗口。\n![](img/00045.jpeg)\n图 B.4：服务器配置窗口\n8. 点击 `Next`，你将看到如图\
  \ B.5 所示的 `Database Engine Configuration`（数据库引擎配置）窗口。\n![](img/00046.jpeg)\n图 B.5：数据库引擎配置窗口\n\
  9. 再次点击 `Next`。下一个窗口将显示安装完成。（参见图 B.6。）\n![](img/00047.jpeg)\n图 B.6：安装完成\n10. 点击\
  \ `Close`。你可能需要重启电脑。\n"
