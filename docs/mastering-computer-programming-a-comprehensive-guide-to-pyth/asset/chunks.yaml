    # Section 7.2: CSS for Styling Web Pages


    ![image](d2d_images/chapter_title_below.png)


    CSS (Cascading Style Sheets) is a crucial part of web development that allows
    you to control the presentation and styling of HTML elements. It provides the
    means to make web pages visually appealing and user-friendly. In this section,
    we’ll explore the basics of CSS and how it’s used to style web pages.


    ### 1. CSS Syntax


    CSS uses a simple syntax where you select HTML elements and apply styles to them.
    Styles are defined within a set of curly braces {}. Here’s a basic CSS rule:


    selector {


    property: value;


    }


    •  selector specifies which HTML elements the style should apply to. For example,
    h1 selects all <h1> elements.


    •  property defines the specific aspect of the element you want to style, such
    as color or font-size.


    •  value sets the value for the chosen property, like red or 16px.


    ### 2. Inline, Internal, and External CSS


    There are three ways to include CSS in an HTML document:


    • Inline CSS: You can apply styles directly to individual HTML elements using
    the style attribute. For example:


    <p style="color: blue;">This is a blue paragraph.</p>


    • Internal CSS: You can include CSS within a <style> element in the HTML <head>.
    This style applies to the entire document:


    <head>


    <style>


    p {


    color: green;


    }


    </style>


    </head>


    • External CSS: You can create a separate CSS file (e.g., styles.css) and link
    it to your HTML document using the <link> element. This is the preferred method
    for larger projects:


    <head>


    <link rel="stylesheet" type="text/css" href="styles.css">


    </head>


    ### 3. Selectors and Properties


    CSS offers a wide range of selectors to target HTML elements. Here are some common
    selectors:


    • Element Selector: Selects elements by their HTML tag. For example:


    p {


    font-size: 16px;


    }


    • Class Selector: Selects elements by their class attribute. For example:


    .highlight {


    background-color: yellow;


    }


    • ID Selector: Selects elements by their id attribute. IDs should be unique within
    a page. For example:


    #header {


    font-size: 24px;


    }


    ### 4. Cascading and Specificity


    CSS rules can conflict, so the “cascading” in CSS refers to how styles are applied
    when multiple rules target the same element. Specificity plays a crucial role
    in determining which rule takes precedence. Generally, the more specific rule
    wins.


    ### 5. Conclusion


    CSS is a powerful tool for styling web pages, making them visually appealing and
    enhancing user experience. Understanding CSS syntax, selectors, and properties
    is fundamental to effective web design. In the next section, we will delve into
    JavaScript, which adds interactivity to web pages.


