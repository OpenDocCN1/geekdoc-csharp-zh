    # Chapter 6: Exploring C# Programming


    # Section 6.1: Introduction to C


    ![image](d2d_images/chapter_title_below.png)


    C# (pronounced “C sharp”) is a modern, object-oriented programming language developed
    by Microsoft. It is part of the .NET framework and is widely used for building
    Windows applications, web applications, and more. In this section, we’ll introduce
    you to the fundamentals of C# programming.


    ### 1. C# Basics


    C# provides a rich set of features for developing robust and efficient applications.
    Here are some key concepts to get you started:


    • Syntax: C# has a C-style syntax, making it familiar to C, C++, and Java programmers.


    • Object-Oriented: C# is an object-oriented language, which means it focuses on
    organizing code into classes and objects.


    • Type Safety: C# is strongly typed, meaning you must declare the data type of
    variables before using them.


    ### 2. Development Environment


    To start programming in C#, you’ll need to set up your development environment.
    Microsoft offers Visual Studio, a powerful integrated development environment
    (IDE) for C# development. Visual Studio provides features like code editing, debugging,
    and project management.


    ### 3. Basic C# Program


    Let’s start with a simple “Hello, World!” program in C#:


    using System;


    class Program


    {


    static void Main()


    {


    Console.WriteLine("Hello, World!");


    }


    }


    Here’s what this program does:


    •  We include the System namespace, which contains essential classes and methods.


    •  We declare a class called Program.


    •  Inside the class, we define a Main method, which is the entry point of our
    program.


    •  Inside the Main method, we use Console.WriteLine to print “Hello, World!” to
    the console.


    ### 4. Variables and Data Types


    C# supports various data types, including integers, floating-point numbers, characters,
    and more. Here’s an example of declaring and using variables:


    int age = 30;


    double salary = 50000.50;


    char grade = ''A'';


    string name = "John Doe";


    Console.WriteLine($"Age: {age}, Salary: {salary}, Grade: {grade}, Name: {name}");


    ### 5. Control Structures


    C# provides control structures like if, else, while, and for for decision-making
    and looping. Here’s an example of an if statement:


    int x = 10;


    if (x > 5)


    {


    Console.WriteLine("x is greater than 5.");


    }


    else


    {


    Console.WriteLine("x is not greater than 5.");


    }


    ### 6. Object-Oriented Programming (OOP)


    C# is known for its strong support for object-oriented programming. You can create
    classes and objects to model real-world entities and their behavior.


    class Person


    {


    public string Name { get; set; }


    public int Age { get; set; }


    public void SayHello()


    {


    Console.WriteLine($"Hello, my name is {Name} and I am {Age} years old.");


    }


    }


    // Creating an instance of the Person class


    Person person1 = new Person();


    person1.Name = "Alice";


    person1.Age = 25;


    person1.SayHello();


    ### 7. Conclusion


    This introduction provides a glimpse of what C# has to offer. In the subsequent
    sections, we will delve deeper into C# fundamentals, explore object-oriented programming
    concepts, and build various types of applications using this versatile language.
    Whether you’re interested in developing Windows desktop applications, web applications,
    or games, C# has the versatility and power to meet your needs.


