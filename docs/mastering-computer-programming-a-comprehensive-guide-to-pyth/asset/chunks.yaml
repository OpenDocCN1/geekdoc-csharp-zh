    # Section 5.3: Advanced C++ Features (Templates, Lambdas, and More)


    ![image](d2d_images/chapter_title_below.png)


    C++ is a feature-rich programming language that offers advanced features to make
    your code more expressive and efficient. In this section, we’ll explore some of
    these features, including templates, lambdas, and more.


    ### Templates


    Templates in C++ allow you to create generic code that works with different data
    types. They are the foundation of the Standard Template Library (STL) and enable
    you to write reusable code. Here’s a simple example of a function template:


    template <typename T>


    T add(T a, T b) {


    return a + b;


    }


    int main() {


    int sum1 = add(5, 3); // Calls add<int>(5, 3)


    double sum2 = add(2.5, 1.5); // Calls add<double>(2.5, 1.5)


    return 0;


    }


    In this example, we define a template function add that can work with different
    data types. The <typename T> syntax indicates that T is a template type. The compiler
    generates specific versions of the add function for each data type used.


    ### Lambda Expressions


    Lambda expressions provide a concise way to define anonymous functions (functions
    without a name) directly in your code. They are especially useful for one-time
    use or short, simple functions. Here’s an example:


    #include <iostream>


    int main() {


    int x = 5;


    int y = 3;


    // Lambda expression that adds two numbers


    auto add = [](int a, int b) -> int {


    return a + b;


    };


    int sum = add(x, y);


    std::cout << "Sum: " << sum << std::endl;


    return 0;


    }


    In this program, we define a lambda expression add that takes two integers and
    returns their sum. We use the lambda to perform the addition and print the result.


    ### Smart Pointers


    C++ provides smart pointers, which are objects that manage the lifetime of dynamically
    allocated objects, helping to prevent memory leaks and manage resources automatically.
    The two most commonly used smart pointers are std::shared_ptr and std::unique_ptr.
    Here’s an example of std::unique_ptr:


    #include <iostream>


    #include <memory>


    class MyClass {


    public:


    MyClass() {


    std::cout << "MyClass constructor called." << std::endl;


    }


    ~MyClass() {


    std::cout << "MyClass destructor called." << std::endl;


    }


    void DoSomething() {


    std::cout << "MyClass is doing something." << std::endl;


    }


    };


    int main() {


    std::unique_ptr<MyClass> ptr = std::make_unique<MyClass>();


    ptr->DoSomething();


    // Automatically calls the destructor when ptr goes out of scope


    return 0;


    }


    In this example, we create a std::unique_ptr to manage an instance of MyClass.
    When the ptr variable goes out of scope, the destructor of MyClass is automatically
    called.


    ### Exception Handling


    Exception handling in C++ allows you to gracefully handle errors and exceptions
    that may occur during program execution. It consists of try, catch, and throw
    blocks. Here’s a simple example:


    #include <iostream>


    int main() {


    try {


    int numerator = 10;


    int denominator = 0;


    if (denominator == 0) {


    throw std::runtime_error("Division by zero");


    }


    int result = numerator / denominator;


    std::cout << "Result: " << result << std::endl;


    } catch (const std::exception& e) {


    std::cerr << "Error: " << e.what() << std::endl;


    }


    return 0;


    }


    In this program, we attempt to divide by zero, which would normally result in
    a program crash. However, we catch the exception using a try-catch block, allowing
    us to handle the error gracefully.


    These advanced features in C++ enhance the language’s capabilities and make it
    suitable for a wide range of programming tasks. Understanding and using these
    features effectively can significantly improve your productivity and the quality
    of your C++ code. In the following sections of this chapter, we’ll delve deeper
    into C++ programming, exploring the Standard Template Library (STL), best practices,
    and more.


