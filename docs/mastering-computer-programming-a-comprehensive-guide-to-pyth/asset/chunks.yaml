    # Section 4.4: Control Flow in C (Loops and Conditionals)


    ![image](d2d_images/chapter_title_below.png)


    Control flow structures are essential in programming as they determine the order
    in which instructions are executed. In C, you can control program flow using conditionals
    (if statements) and loops (for, while, and do-while loops). In this section, we’ll
    explore these control flow structures.


    ### Conditional Statements (if, else if, else)


    Conditional statements allow you to execute different blocks of code based on
    certain conditions. The primary conditional statement in C is the if statement,
    and you can extend it using else if and else clauses.


    int x = 10;


    if (x > 0) {


    printf("x is positive.\n");


    } else if (x == 0) {


    printf("x is zero.\n");


    } else {


    printf("x is negative.\n");


    }


    In this example, the program checks the value of x and prints a message based
    on the condition. If x is greater than 0, it prints “x is positive.” If x is 0,
    it prints “x is zero.” Otherwise, it prints “x is negative.”


    ### Loops (for, while, do-while)


    Loops are used to repeatedly execute a block of code as long as a specified condition
    is met. C provides three main types of loops: for, while, and do-while.


    #### for Loop


    The for loop is commonly used for iterating over a range of values.


    for (int i = 0; i < 5; i++) {


    printf("Iteration %d\n", i);


    }


    In this example, the for loop runs from i = 0 to i = 4 (5 iterations) and prints
    the current iteration number.


    #### while Loop


    The while loop repeatedly executes a block of code while a specified condition
    is true.


    int count = 0;


    while (count < 3) {


    printf("Count: %d\n", count);


    count++;


    }


    Here, the while loop continues until count reaches 3, printing the value of count
    at each iteration.


    #### do-while Loop


    The do-while loop is similar to the while loop, but it always executes the code
    block at least once before checking the condition.


    int number;


    do {


    printf("Enter a positive number: ");


    scanf("%d", &number);


    } while (number <= 0);


    In this example, the program prompts the user to enter a positive number at least
    once, and the loop continues until a positive number is provided.


    ### Switch Statement


    The switch statement is used to perform different actions based on the value of
    a variable or an expression. It’s often used when you have multiple conditions
    to evaluate.


    int choice;


    printf("Choose an option (1-3): ");


    scanf("%d", &choice);


    switch (choice) {


    case 1:


    printf("You chose option 1.\n");


    break;


    case 2:


    printf("You chose option 2.\n");


    break;


    case 3:


    printf("You chose option 3.\n");


    break;


    default:


    printf("Invalid choice.\n");


    }


    In this example, the switch statement evaluates the value of choice and executes
    the corresponding code block based on the chosen option. If none of the cases
    match, the default block is executed.


    ### Break and Continue


    In loops, the break statement is used to exit the loop prematurely, while the
    continue statement skips the current iteration and continues with the next one.


    for (int i = 0; i < 5; i++) {


    if (i == 3) {


    break; // Exit the loop when i equals 3


    }


    printf("Iteration %d\n", i);


    }


    In this example, when i equals 3, the break statement terminates the loop.


    for (int i = 0; i < 5; i++) {


    if (i == 2) {


    continue; // Skip iteration when i equals 2


    }


    printf("Iteration %d\n", i);


    }


    Here, when i equals 2, the continue statement skips the rest of the current iteration
    and continues with the next one.


    Understanding control flow structures in C allows you to write programs that make
    decisions and repeat tasks efficiently. These structures are fundamental for building
    more complex and dynamic applications. In the following sections, we’ll explore
    functions, pointers, and more advanced C programming topics to further enhance
    your coding skills.


