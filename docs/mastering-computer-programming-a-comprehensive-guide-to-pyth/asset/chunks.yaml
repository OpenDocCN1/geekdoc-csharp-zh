    # Section 6.4: Building Windows Applications with C


    ![image](d2d_images/chapter_title_below.png)


    C# is well-known for its capability to develop Windows applications, including
    desktop applications with graphical user interfaces (GUI). In this section, we
    will explore how C# can be used to build Windows applications using various frameworks
    and tools.


    ### 1. Windows Forms (WinForms)


    Windows Forms, often referred to as WinForms, is a framework for building Windows
    desktop applications with C#. It provides a set of controls and components that
    allow you to create windows, dialogs, buttons, textboxes, and more.


    using System;


    using System.Windows.Forms;


    public class MyForm : Form


    {


    public MyForm()


    {


    // Create a button


    Button button = new Button();


    button.Text = "Click Me";


    button.Click += (sender, e) => MessageBox.Show("Button clicked!");


    // Add the button to the form


    Controls.Add(button);


    }


    [STAThread]


    public static void Main()


    {


    Application.EnableVisualStyles();


    Application.Run(new MyForm());


    }


    }


    In this example, we create a simple Windows Forms application with a button that
    displays a message box when clicked. The application is launched using the Application.Run
    method.


    ### 2. Windows Presentation Foundation (WPF)


    Windows Presentation Foundation (WPF) is a more modern framework for building
    Windows applications with rich user interfaces. It uses XAML (eXtensible Application
    Markup Language) for designing the user interface.


    using System;


    using System.Windows;


    public partial class MainWindow : Window


    {


    public MainWindow()


    {


    InitializeComponent();


    }


    private void Button_Click(object sender, RoutedEventArgs e)


    {


    MessageBox.Show("Button clicked!");


    }


    [STAThread]


    public static void Main()


    {


    Application app = new Application();


    app.Run(new MainWindow());


    }


    }


    In this WPF example, we create a window with a button defined in XAML. When the
    button is clicked, it displays a message box.


    ### 3. Universal Windows Platform (UWP)


    The Universal Windows Platform (UWP) allows you to build Windows applications
    that can run on various Windows devices, including desktops, tablets, and smartphones.
    UWP applications are built using C# and XAML.


    using System;


    using Windows.UI.Xaml;


    using Windows.UI.Xaml.Controls;


    namespace UWPApp


    {


    public sealed partial class MainPage : Page


    {


    public MainPage()


    {


    this.InitializeComponent();


    }


    private void Button_Click(object sender, RoutedEventArgs e)


    {


    // Display a message dialog


    var dialog = new Windows.UI.Popups.MessageDialog("Button clicked!");


    dialog.ShowAsync();


    }


    }


    public sealed partial class App : Application


    {


    public App()


    {


    this.InitializeComponent();


    this.Suspending += OnSuspending;


    }


    protected override void OnLaunched(LaunchActivatedEventArgs e)


    {


    Frame rootFrame = Window.Current.Content as Frame;


    if (rootFrame == null)


    {


    rootFrame = new Frame();


    Window.Current.Content = rootFrame;


    }


    if (e.PrelaunchActivated == false)


    {


    if (rootFrame.Content == null)


    {


    rootFrame.Navigate(typeof(MainPage), e.Arguments);


    }


    Window.Current.Activate();


    }


    }


    private void OnSuspending(object sender, SuspendingEventArgs e)


    {


    var deferral = e.SuspendingOperation.GetDeferral();


    deferral.Complete();


    }


    }


    }


    In this UWP example, we create a simple application with a button that displays
    a message dialog when clicked. UWP applications can adapt their user interfaces
    to different device form factors.


    ### 4. Visual Studio IDE


    To develop Windows applications with C#, you can use Microsoft Visual Studio,
    a powerful integrated development environment (IDE) that provides tools and templates
    for building various types of Windows apps. Visual Studio streamlines the development
    process, offers debugging and testing capabilities, and supports different frameworks
    like WinForms, WPF, and UWP.


    ### 5. Conclusion


    C# is a versatile language for building Windows applications with rich user interfaces.
    Whether you choose WinForms, WPF, or UWP, C# provides the tools and libraries
    needed to create desktop applications that can run on Windows devices. Visual
    Studio is a valuable companion for C# developers, offering a feature-rich environment
    for application development and testing.


