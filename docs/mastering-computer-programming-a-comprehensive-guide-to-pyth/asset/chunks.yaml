    # Section 6.2: C# Language Fundamentals


    ![image](d2d_images/chapter_title_below.png)


    In this section, we will dive deeper into the fundamentals of the C# programming
    language. Building on the introduction provided in Section 6.1, we will explore
    concepts and syntax that are essential for every C# programmer to understand.


    ### 1. Variables and Data Types


    C# supports various data types to store different kinds of information. Here are
    some common data types:


    • int: Used for integer values, e.g., int age = 30;


    • double: Used for floating-point numbers, e.g., double salary = 50000.50;


    • char: Used for single characters, e.g., char grade = ''A'';


    • string: Used for text, e.g., string name = "John Doe";


    • bool: Used for boolean values (true or false), e.g., bool isStudent = true;


    ### 2. Operators


    C# provides various operators for performing operations on variables and values.
    Some common operators include:


    • Arithmetic Operators: +, -, *, /, %


    int x = 10;


    int y = 5;


    int sum = x + y; // sum is now 15


    • Comparison Operators: ==, !=, <, >, <=, >=


    int a = 10;


    int b = 20;


    bool isEqual = (a == b); // isEqual is false


    • Logical Operators: && (and), || (or), ! (not)


    bool isStudent = true;


    bool hasBooks = false;


    bool canStudy = isStudent && !hasBooks; // canStudy is true


    ### 3. Control Structures


    Control structures allow you to make decisions and repeat actions in your C# programs.
    Some commonly used control structures are:


    • if-else Statements: Used for conditional branching.


    int age = 25;


    if (age >= 18)


    {


    Console.WriteLine("You are an adult.");


    }


    else


    {


    Console.WriteLine("You are a minor.");


    }


    • while Loops: Used for repeating code while a condition is true.


    int count = 0;


    while (count < 5)


    {


    Console.WriteLine($"Count: {count}");


    count++;


    }


    • for Loops: Used for iterating over a range of values.


    for (int i = 0; i < 5; i++)


    {


    Console.WriteLine($"Iteration: {i}");


    }


    ### 4. Functions and Methods


    Functions, also known as methods in C#, allow you to organize code into reusable
    blocks. You can define your own functions or use built-in ones.


    // Defining a function


    int Add(int a, int b)


    {


    return a + b;


    }


    // Using the function


    int result = Add(3, 5); // result is 8


    ### 5. Arrays and Collections


    Arrays and collections help you store and manipulate collections of data.


    • Arrays: Fixed-size collections of items of the same data type.


    int[] numbers = new int[3] { 1, 2, 3 };


    • Lists: Dynamic collections that can grow or shrink.


    List<string> names = new List<string>();


    names.Add("Alice");


    names.Add("Bob");


    ### 6. Exception Handling


    C# allows you to handle exceptions that might occur during program execution using
    try-catch blocks.


    try


    {


    int result = 10 / 0; // This will throw an exception


    }


    catch (Exception ex)


    {


    Console.WriteLine($"An error occurred: {ex.Message}");


    }


    ### 7. Conclusion


    This section has covered some of the core concepts of C#, including data types,
    operators, control structures, functions, arrays, and exception handling. Understanding
    these fundamentals is crucial as they form the building blocks for more complex
    C# programming tasks, which we will explore in later sections.


