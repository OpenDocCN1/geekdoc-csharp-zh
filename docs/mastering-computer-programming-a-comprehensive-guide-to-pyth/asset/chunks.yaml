    # Section 4.2: C Syntax and Structure


    ![image](d2d_images/chapter_title_below.png)


    In this section, we’ll dive into the syntax and structure of the C programming
    language. Understanding the basic building blocks of C is essential for writing
    correct and efficient programs.


    ### Hello, World! Revisited


    Let’s revisit the classic “Hello, World!” program in C to explore its syntax:


    #include <stdio.h> // This is a preprocessor directive


    int main() { // This is the main function


    printf("Hello, World!\n"); // This is a function call


    return 0; // This is the return statement


    }


    •  #include <stdio.h>: This line is a preprocessor directive, which tells the
    C compiler to include the standard input/output library (stdio.h) in our program.
    This library provides functions like printf for input and output.


    •  int main(): This is the main function, where program execution begins. It returns
    an integer (int) value. By convention, a return value of 0 indicates a successful
    execution.


    •  {}: These curly braces enclose the body of the main function, defining its
    scope. All statements within the braces are part of the function.


    •  printf("Hello, World!\n");: This is a function call to printf, which is used
    to print text to the console. The \n represents a newline character.


    •  return 0;: This statement exits the main function and returns the value 0,
    indicating a successful program execution. Other return values can indicate errors
    or different program states.


    ### Comments


    C allows you to include comments in your code to provide explanations and make
    it more readable. There are two types of comments in C:


    •  Single-line comments start with // and continue until the end of the line.
    For example:


    // This is a single-line comment


    int x = 10; // You can also include comments after code


    •  Multi-line comments start with /* and end with */. They can span multiple lines:


    /* This is a multi-line comment


    It can span multiple lines


    */


    ### Variables and Data Types


    In C, you declare variables to store data. Variables have a data type that defines
    the kind of data they can hold. Common data types in C include:


    •  int: Represents integers, e.g., int age = 25;


    •  float and double: Represent floating-point numbers (decimals), e.g., float
    price = 12.99;


    •  char: Represents single characters, e.g., char grade = ''A'';


    •  bool: Represents Boolean values, e.g., bool isFound = true;


    You declare variables by specifying the data type followed by the variable name.
    For example:


    int num1 = 42; // Declare an integer variable


    float pi = 3.14; // Declare a floating-point variable


    char letter = ''A''; // Declare a character variable


    bool isValid = true; // Declare a Boolean variable


    ### Operators


    C provides a variety of operators for performing operations on variables and values.
    Some common operators include:


    •  Arithmetic operators: + (addition), - (subtraction), * (multiplication), /
    (division), % (modulo).


    •  Comparison operators: == (equal), != (not equal), < (less than), > (greater
    than), <= (less than or equal to), >= (greater than or equal to).


    •  Assignment operators: = (assignment), += (addition assignment), -= (subtraction
    assignment), *= (multiplication assignment), /= (division assignment), %= (modulo
    assignment).


    •  Logical operators: && (logical AND), || (logical OR), ! (logical NOT).


    •  Increment and decrement operators: ++ (increment), — (decrement).


    Here’s an example of using arithmetic and comparison operators:


    int x = 5;


    int y = 10;


    int sum = x + y; // Addition


    int difference = x - y; // Subtraction


    bool isEqual = x == y; // Comparison (false in this case)


    ### Control Flow


    C provides control flow statements to control the execution of your program. Common
    control flow statements include:


    •  if, else if, and else statements for conditional execution.


    •  switch and case statements for handling multiple conditions.


    •  while and for loops for repetition.


    •  break and continue statements for controlling loop behavior.


    Here’s an example of an if statement:


    int age = 18;


    if (age >= 18) {


    printf("You are an adult.\n");


    } else {


    printf("You are not yet an adult.\n");


    }


    This code uses an if statement to check the value of the age variable and prints
    a message based on the condition.


    Understanding the basic syntax and structure of C programming is the foundation
    for writing C programs. In the next sections, we’ll explore more advanced topics
    like functions, pointers, and control structures to help you become proficient
    in C programming.


