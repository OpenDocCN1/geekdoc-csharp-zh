    # Section 2.2: Writing Your First Python Script


    ![image](d2d_images/chapter_title_below.png)


    Now that you’ve been introduced to Python, it’s time to get hands-on and write
    your first Python script. In this section, we’ll walk you through the basics of
    creating a Python script, running it, and understanding key concepts like variables,
    data types, and basic operations.


    ## Creating a Python Script


    Python scripts are plain text files with a `.py` extension. You can create a Python
    script using a simple text editor like Notepad (on Windows) or any code editor
    of your choice, such as Visual Studio Code, PyCharm, or IDLE (the built-in Python
    IDE). Here’s how to create a basic Python script:


    1.  Open your preferred code editor or text editor.

    2.  Create a new file and save it with a `.py` extension. For example, you can
    name it `first_script.py`.

    3.  Write your Python code within this file.


    ## Writing Your First Python Code


    Let’s start with a simple Python program that prints a greeting message to the
    console. Open your Python script file (`first_script.py`) and add the following
    code:


    ```python

    # This is my first Python script

    print("Hello, Python!")

    ```


    In this code:


    • `# This is my first Python script` is a comment that provides a brief description
    of your script. Comments are ignored by the Python interpreter and are used to
    add explanations to your code.


    • `print("Hello, Python!")` is the main line of code. It uses the `print()` function
    to display the text “Hello, Python!” to the console.


    ## Running Your Python Script


    Once you’ve written your Python script, it’s time to run it. Here’s how:


    1.  Open your command prompt or terminal.

    2.  Navigate to the directory where you saved your `first_script.py` file. You
    can use the `cd` (change directory) command to navigate to the folder containing
    your script.

    3.  Run the script by entering the following command:


    ```bash

    python first_script.py

    ```


    Replace `first_script.py` with the name of your script if it’s different.


    1.  Press Enter, and you should see the output of your Python script in the terminal:


    ```text

    Hello, Python!

    ```


    Congratulations! You’ve successfully written and run your first Python script.


    ## Variables and Data Types


    Python allows you to work with variables to store and manipulate data. Variables
    are like containers that can hold different types of information. Python supports
    various data types, including:


    • `int`: Integer numbers (e.g., 1, 42, -5).

    • `float`: Floating-point numbers (e.g., 3.14, -0.5).

    • `str`: Strings (e.g., “Hello, Python!”, ‘123’).

    • `bool`: Boolean values (True or False).

    • `list`: Ordered collections of items (e.g., [1, 2, 3]).

    • `tuple`: Ordered, immutable collections (e.g., (1, 2, 3)).

    • `dict`: Key-value pairs (e.g., {‘name’: ‘Alice’, ‘age’: 30}).


    Here’s an example of using variables and data types in Python:


    ```python

    # Variables and data types

    name = "Alice"

    age = 30

    height = 5.8

    is_student = True


    # Printing variables

    print("Name:", name)

    print("Age:", age)

    print("Height:", height)

    print("Is student?", is_student)

    ```


    In this code, we’ve created variables `name`, `age`, `height`, and `is_student`
    with different data types. The `print()` function is used to display the values
    of these variables.


    Python is dynamically typed, which means you don’t need to declare the data type
    of a variable explicitly. The interpreter determines the data type based on the
    value assigned to the variable.


    ## Basic Operations


    Python supports various operations on data, such as arithmetic, comparison, and
    logical operations. Here are some examples:


    ```python

    # Basic operations

    a = 10

    b = 5


    # Arithmetic operations

    sum_result = a + b

    difference = a - b

    product = a * b

    division = a / b

    remainder = a % b


    # Comparison operations

    is_equal = a == b

    is_not_equal = a != b

    is_greater = a > b

    is_less = a < b


    # Logical operations

    and_result = a and b

    or_result = a or b

    not_result = not a


    # Printing results

    print("Sum:", sum_result)

    print("Difference:", difference)

    print("Product:", product)

    print("Division:", division)

    print("Remainder:", remainder)

    print("Is Equal:", is_equal)

    print("Not Equal:", is_not_equal)

    print("Is Greater:", is_greater)

    print("Is Less:", is_less)

    print("AND Result:", and_result)

    print("OR Result:", or_result)

    print("NOT Result:", not_result)

    ```


    In this code, we perform arithmetic operations on `a` and `b`, compare their values,
    use logical operators to evaluate conditions. The results are printed to the console.


    This concludes our introduction to Python, where you’ve learned to create, run,
    and understand your first script, work with variables and data types, and perform
    operations. In the following sections, we’ll delve deeper into Python’s features
    and capabilities.

