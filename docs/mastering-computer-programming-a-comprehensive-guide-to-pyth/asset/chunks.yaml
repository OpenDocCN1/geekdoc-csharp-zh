    # Section 5.2: Object-Oriented Programming (OOP) in C++


    ![image](d2d_images/chapter_title_below.png)


    Object-oriented programming (OOP) is a programming paradigm that focuses on organizing
    code around objects, which are instances of classes. C++ is a powerful language
    for OOP, and in this section, we’ll explore the key concepts of OOP in C++.


    ### Classes and Objects


    • Classes: In C++, a class is a blueprint for creating objects. It defines the
    properties (attributes) and behaviors (methods) that objects of the class will
    have. Here’s a simple class definition:


    class Person {


    public:


    // Attributes


    std::string name;


    int age;


    // Methods


    void introduce() {


    std::cout << "My name is " << name << " and I am " << age << " years old." <<
    std::endl;


    }


    };


    In this example, we define a Person class with attributes name and age and a method
    introduce to display information about a person.


    • Objects: Objects are instances of classes. You can create multiple objects from
    a single class. Here’s how to create and use objects of the Person class:


    int main() {


    // Create objects


    Person person1;


    Person person2;


    // Set object attributes


    person1.name = "Alice";


    person1.age = 30;


    person2.name = "Bob";


    person2.age = 25;


    // Call object methods


    person1.introduce();


    person2.introduce();


    return 0;


    }


    In this program, we create two Person objects, set their attributes, and call
    the introduce method to display their information.


    ### Encapsulation


    Encapsulation is the practice of bundling data (attributes) and methods (functions)
    that operate on that data into a single unit, known as a class. It helps in hiding
    the internal implementation details of a class and exposing only the necessary
    interfaces to the outside world. Access specifiers (public, private, and protected)
    control the visibility of class members:


    •  public: Members declared as public are accessible from anywhere.


    •  private: Members declared as private are only accessible within the class.


    •  protected: Members declared as protected are accessible within the class and
    its derived classes.


    ### Inheritance


    Inheritance is a mechanism in OOP that allows you to create a new class (derived
    or child class) by inheriting properties and behaviors from an existing class
    (base or parent class). It promotes code reuse and establishes a relationship
    between classes. Here’s a simple example of inheritance in C++:


    class Animal {


    public:


    void eat() {


    std::cout << "Animal is eating." << std::endl;


    }


    };


    class Dog : public Animal {


    public:


    void bark() {


    std::cout << "Dog is barking." << std::endl;


    }


    };


    In this example, the Dog class inherits from the Animal class. The Dog class can
    access the eat method of the Animal class along with its own bark method.


    ### Polymorphism


    Polymorphism allows objects of different classes to be treated as objects of a
    common base class. It enables dynamic binding, where the appropriate method is
    called at runtime based on the actual object type. C++ supports polymorphism through
    virtual functions and interfaces. Here’s an example:


    class Shape {


    public:


    virtual void draw() {


    std::cout << "Drawing a shape." << std::endl;


    }


    };


    class Circle : public Shape {


    public:


    void draw() override {


    std::cout << "Drawing a circle." << std::endl;


    }


    };


    int main() {


    Shape* shape1 = new Circle();


    shape1->draw(); // Calls the draw method of the Circle class


    delete shape1;


    return 0;


    }


    In this example, we define a Shape class with a virtual draw method. The Circle
    class inherits from Shape and overrides the draw method. When we create a Circle
    object and call its draw method through a Shape pointer, polymorphism ensures
    that the appropriate method is called.


    ### OOP Benefits in C++


    Object-oriented programming in C++ provides several benefits, including code organization,
    modularity, reusability, and a natural way to model real-world entities and relationships.
    It allows you to build complex systems by breaking them down into smaller, manageable
    classes and objects. Understanding OOP principles is crucial for developing robust
    and maintainable C++ applications.


    In the upcoming sections of this chapter, we’ll explore advanced C++ features,
    such as templates, lambda expressions, and the Standard Template Library (STL),
    to further enhance your C++ programming skills.


