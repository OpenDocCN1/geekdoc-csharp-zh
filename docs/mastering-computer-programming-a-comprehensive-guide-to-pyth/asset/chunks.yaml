    # Section 4.3: Variables and Data Types in C


    ![image](d2d_images/chapter_title_below.png)


    In C programming, variables are used to store data, and each variable has a specific
    data type that determines the kind of data it can hold. Understanding C data types
    is fundamental for writing correct and efficient programs. In this section, we’ll
    explore C’s built-in data types and how to declare and use variables.


    ### Built-in Data Types


    C provides several built-in data types to represent different kinds of data. Common
    data types include:


    1.  int: Used to store integers (whole numbers) such as 42, -10, or 0.

    2.  float: Represents floating-point numbers (real numbers with a decimal point),
    e.g., 3.14, -0.5, or 123.45.

    3.  double: Similar to float but with higher precision; often used for more accurate
    decimal calculations.

    4.  char: Represents single characters like ‘A’, ‘5’, or ‘$’.

    5.  **_Bool (bool in C99 and later):** Represents Boolean values, which can be
    either true or false.

    6.  void: Used to indicate that a function does not return any value.


    ### Variable Declaration


    To declare a variable in C, you need to specify its data type followed by the
    variable’s name. For example:


    int age; // Declaring an integer variable named ''age''


    float temperature; // Declaring a floating-point variable named ''temperature''


    char grade; // Declaring a character variable named ''grade''


    You can also initialize variables during declaration by providing an initial value:


    int score = 100; // Initializing an integer variable ''score'' with the value
    100


    float pi = 3.14; // Initializing a float variable ''pi'' with the value 3.14


    char initial = ''A''; // Initializing a character variable ''initial'' with the
    value ''A''


    ### Constants


    In addition to variables, C allows you to define constants, which are values that
    cannot be changed during the program’s execution. You can define constants using
    the const keyword:


    const int days_in_week = 7; // A constant integer representing the number of days
    in a week


    const float pi_value = 3.14159265359; // A constant float representing the value
    of pi


    const char newline = ''\n''; // A constant character representing a newline


    Constants are often used to make code more readable and to avoid magic numbers
    (hard-coded numeric values) in your programs.


    ### Size of Data Types


    The size of data types in C can vary depending on the platform and compiler. To
    determine the size of a data type on your system, you can use the sizeof operator.
    Here’s an example:


    #include <stdio.h>


    int main() {


    printf("Size of int: %lu bytes\n", sizeof(int));


    printf("Size of float: %lu bytes\n", sizeof(float));


    printf("Size of double: %lu bytes\n", sizeof(double));


    printf("Size of char: %lu bytes\n", sizeof(char));


    return 0;


    }


    This program uses the sizeof operator to print the size (in bytes) of different
    data types. Keep in mind that the size of data types can vary on different systems.


    ### Type Modifiers


    In addition to basic data types, C allows you to use type modifiers to further
    define the properties of variables. Some common type modifiers include:


    •  short: Used to declare short integers with reduced storage size.


    •  long: Used to declare long integers with extended storage size.


    •  signed and unsigned: Used to specify whether a variable can hold negative values
    (signed) or only non-negative values (unsigned).


    For example, you can declare a short int as follows:


    short int small_number = 42;


    These type modifiers provide flexibility when working with different data requirements
    and memory constraints.


    Understanding C’s data types and how to declare variables is fundamental for writing
    C programs. It enables you to work with different kinds of data, control memory
    usage, and perform accurate calculations. In the next sections, we’ll explore
    more advanced topics like operators, control structures, and functions to expand
    your C programming knowledge.


