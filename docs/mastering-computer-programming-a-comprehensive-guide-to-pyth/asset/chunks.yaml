    # Section 10.2: SQL Injection and Cross-Site Scripting (XSS)


    ![image](d2d_images/chapter_title_below.png)


    SQL Injection (SQLi) and Cross-Site Scripting (XSS) are two of the most prevalent
    web application vulnerabilities, posing significant threats to the security of
    web-based systems. This section explores these vulnerabilities in detail and provides
    guidance on how to prevent and mitigate them.


    ### SQL Injection (SQLi)


    SQL Injection is a type of security vulnerability that occurs when an attacker
    inserts malicious SQL code into input fields or parameters that are later used
    to construct SQL queries. When the web application does not properly validate
    or sanitize user inputs, an attacker can manipulate these inputs to execute arbitrary
    SQL commands against the application’s database.


    For example, consider a simple login form where a user enters their username and
    password. If the application constructs an SQL query like this:


    SELECT * FROM users WHERE username = ''input_username'' AND password = ''input_password'';


    An attacker could input something like '' OR 1=1— as the username and bypass authentication
    because the query becomes:


    SELECT * FROM users WHERE username = '''' OR 1=1 —'' AND password = ''input_password'';


    This modification makes the query always return true (1=1), granting unauthorized
    access.


    #### Mitigation of SQL Injection


    Mitigating SQL Injection involves using prepared statements or parameterized queries.
    These techniques separate user input from SQL queries, preventing attackers from
    injecting malicious SQL code.


    In Python, using prepared statements with libraries like SQLAlchemy can help mitigate
    SQL Injection:


    from sqlalchemy import create_engine


    from sqlalchemy.sql import text


    engine = create_engine(''database_connection_string'')


    with engine.connect() as conn:


    statement = text("SELECT * FROM users WHERE username = :user AND password = :pass")


    result = conn.execute(statement, user=input_username, pass=input_password)


    ### Cross-Site Scripting (XSS)


    Cross-Site Scripting (XSS) is a vulnerability that occurs when an attacker injects
    malicious scripts (usually JavaScript) into web pages viewed by other users. These
    scripts can then execute within the context of the victim’s browser, potentially
    compromising their session, stealing their data, or performing malicious actions
    on their behalf.


    There are three main types of XSS:


    1.  Stored XSS: The malicious script is permanently stored on the web server and
    served to users who access a specific page or resource.

    2.  Reflected XSS: The attacker injects a script into a URL, and the victim unknowingly
    triggers the script by visiting that URL.

    3.  DOM-based XSS: The attack takes place on the client-side, where the attacker
    manipulates the Document Object Model (DOM) of a web page.


    #### Mitigation of XSS


    To mitigate XSS, input validation and output encoding are crucial. Input validation
    ensures that user-provided data does not contain malicious scripts. Output encoding
    ensures that data is rendered safely in web pages.


    Frameworks and libraries often provide built-in mechanisms to handle output encoding.
    For example, in a Django template, using the |safe filter prevents output encoding,
    while the escapejs filter escapes JavaScript:


    <script>


    var userInput = "{{ user_input|escapejs|safe }}";


    </script>


    It’s essential to educate developers about secure coding practices, use security
    tools, and regularly test web applications for XSS vulnerabilities.


    By addressing SQL Injection and XSS vulnerabilities proactively, developers can
    significantly enhance the security of their web applications and protect users
    from potential harm.


