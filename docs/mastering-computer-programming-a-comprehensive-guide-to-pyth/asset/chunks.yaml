    ### Creating a Python Script


    Python scripts are plain text files with a .py extension. You can create a Python
    script using a simple text editor like Notepad (on Windows) or any code editor
    of your choice, such as Visual Studio Code, PyCharm, or IDLE (the built-in Python
    IDE). Here’s how to create a basic Python script:


    1.  Open your preferred code editor or text editor.


    2.  Create a new file and save it with a .py extension. For example, you can name
    it first_script.py.


    3.  Write your Python code within this file.


    ### Writing Your First Python Code


    Let’s start with a simple Python program that prints a greeting message to the
    console. Open your Python script file (first_script.py) and add the following
    code:


    # This is my first Python script


    print("Hello, Python!")


    In this code:


    •  # This is my first Python script is a comment that provides a brief description
    of your script. Comments are ignored by the Python interpreter and are used to
    add explanations to your code.


    •  print("Hello, Python!") is the main line of code. It uses the print() function
    to display the text “Hello, Python!” to the console.


    ### Running Your Python Script


