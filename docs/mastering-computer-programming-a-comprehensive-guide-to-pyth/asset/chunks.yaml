    \ used after an initial `if` statement.\n\n# if-elif-else statement\n\n```python\n\
    z = 7\nif z > 10:\n    print(\"z is greater than 10\")\nelif z > 5:\n    print(\"\
    z is greater than 5 but not greater than 10\")\nelse:\n    print(\"z is not greater\
    \ than 5\")\n```\n\nIn this example, the first condition `(z > 10)` is false,\
    \ so the program checks the next condition `(z > 5)` and executes the corresponding\
