    # Section 6.5: Developing Web Applications with ASP.NET


    ![image](d2d_images/chapter_title_below.png)


    ASP.NET is a framework for building web applications using C#. It provides a robust
    environment for developing web applications, including web forms, MVC (Model-View-Controller),
    and Web API. In this section, we will explore how ASP.NET allows you to create
    dynamic and interactive web applications.


    ### 1. ASP.NET Web Forms


    ASP.NET Web Forms is a classic approach to web development, where you design web
    pages that resemble Windows Forms. It uses server-side controls and event-driven
    programming.


    <%@ Page Language="C#" AutoEventWireup="true" CodeBehind="Default.aspx.cs" Inherits="WebApp.Default"
    %>


    <!DOCTYPE html>


    <html>


    <head>


    <title>Web Form</title>


    </head>


    <body>


    <form runat="server">


    <asp:Label ID="lblMessage" runat="server" Text="Hello, ASP.NET Web Forms!" />


    <br />


    <asp:Button ID="btnClickMe" runat="server" Text="Click Me" OnClick="btnClickMe_Click"
    />


    </form>


    </body>


    </html>


    In this example, we have an ASP.NET Web Form with a label and a button. The button
    click event is handled in the code-behind file (Default.aspx.cs), allowing you
    to write C# code to respond to user interactions.


    ### 2. ASP.NET MVC


    ASP.NET MVC (Model-View-Controller) is a framework for building web applications
    using the MVC architectural pattern. It separates the application into three main
    components: Models, Views, and Controllers.


    using System;


    using System.Web.Mvc;


    namespace MvcApp.Controllers


    {


    public class HomeController : Controller


    {


    public ActionResult Index()


    {


    ViewBag.Message = "Hello, ASP.NET MVC!";


    return View();


    }


    }


    }


    In this MVC example, we have a controller (HomeController) that handles requests
    and returns a view (Index.cshtml). The view contains HTML markup, and you can
    use Razor syntax to embed C# code within the HTML.


    ### 3. ASP.NET Web API


    ASP.NET Web API allows you to build RESTful web services that can be consumed
    by various clients, including web applications, mobile apps, and IoT devices.


    using System;


    using System.Net;


    using System.Net.Http;


    using System.Web.Http;


    namespace WebApiApp.Controllers


    {


    public class HelloWorldController : ApiController


    {


    public HttpResponseMessage Get()


    {


    return Request.CreateResponse(HttpStatusCode.OK, "Hello, ASP.NET Web API!");


    }


    }


    }


    In this Web API example, we create a controller (HelloWorldController) with a
    GET endpoint that returns a simple message as an HTTP response.


    ### 4. ASP.NET Core


    ASP.NET Core is the cross-platform version of ASP.NET, allowing you to build web
    applications that can run on Windows, macOS, and Linux. It provides a modern and
    lightweight framework for web development with C#.


    using Microsoft.AspNetCore.Mvc;


    using System;


    namespace AspNetCoreApp.Controllers


    {


    public class HomeController : Controller


    {


    public IActionResult Index()


    {


    ViewBag.Message = "Hello, ASP.NET Core!";


    return View();


    }


    }


    }


    In this ASP.NET Core example, we have a controller (HomeController) that returns
    a view with a greeting message. ASP.NET Core is highly modular and supports various
    hosting options, making it a flexible choice for web development.


    ### 5. Conclusion


    ASP.NET is a versatile framework that enables C# developers to build a wide range
    of web applications, from traditional ASP.NET Web Forms to modern ASP.NET Core
    applications. Whether you’re creating data-driven web forms, implementing RESTful
    APIs, or building responsive web applications, ASP.NET provides the tools and
    libraries needed to develop robust and scalable web solutions.


