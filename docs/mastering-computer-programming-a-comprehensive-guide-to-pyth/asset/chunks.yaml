    # Section 6.3: Object-Oriented Programming with C


    ![image](d2d_images/chapter_title_below.png)


    Object-Oriented Programming (OOP) is a fundamental paradigm in C# that allows
    you to model real-world entities and their behavior using classes and objects.
    In this section, we will explore the principles of OOP and how to apply them in
    C#.


    ### 1. Classes and Objects


    In C#, a class is a blueprint for creating objects. Objects are instances of classes
    and represent real-world entities or concepts. Let’s create a simple example:


    class Person


    {


    // Properties (attributes)


    public string Name { get; set; }


    public int Age { get; set; }


    // Methods (behaviors)


    public void SayHello()


    {


    Console.WriteLine($"Hello, my name is {Name} and I am {Age} years old.");


    }


    }


    // Creating an instance of the Person class


    Person person1 = new Person();


    person1.Name = "Alice";


    person1.Age = 25;


    // Calling a method on the object


    person1.SayHello();


    Here, we define a Person class with properties (Name and Age) and a method (SayHello).
    We then create an instance of the Person class and use it to call the SayHello
    method.


    ### 2. Encapsulation


    Encapsulation is the concept of bundling data (properties) and methods (behaviors)
    into a single unit called a class. Access to the internal data of a class is controlled
    through access modifiers like public, private, and protected. For example:


    class BankAccount


    {


    private double balance;


    public void Deposit(double amount)


    {


    if (amount > 0)


    {


    balance += amount;


    }


    }


    public double GetBalance()


    {


    return balance;


    }


    }


    In this example, the balance field is private, so it cannot be accessed directly
    from outside the BankAccount class. Instead, we provide public methods (Deposit
    and GetBalance) to interact with it.


    ### 3. Inheritance


    Inheritance allows you to create a new class based on an existing one, inheriting
    its properties and methods. The new class is called a subclass or derived class,
    and the existing class is the base class or parent class. Example:


    class Animal


    {


    public void Eat()


    {


    Console.WriteLine("Animal is eating.");


    }


    }


    class Dog : Animal


    {


    public void Bark()


    {


    Console.WriteLine("Dog is barking.");


    }


    }


    // Creating instances


    Animal animal = new Animal();


    Dog dog = new Dog();


    // Using inherited methods


    animal.Eat(); // Output: Animal is eating.


    dog.Eat(); // Output: Animal is eating.


    // Using subclass-specific method


    dog.Bark(); // Output: Dog is barking.


    In this example, the Dog class inherits the Eat method from the Animal class,
    and it also has its own method, Bark.


    ### 4. Polymorphism


    Polymorphism allows objects of different classes to be treated as objects of a
    common base class. This simplifies code and enables dynamic behavior. Example:


    class Shape


    {


    public virtual void Draw()


    {


    Console.WriteLine("Drawing a shape.");


    }


    }


    class Circle : Shape


    {


    public override void Draw()


    {


    Console.WriteLine("Drawing a circle.");


    }


    }


    class Square : Shape


    {


    public override void Draw()


    {


    Console.WriteLine("Drawing a square.");


    }


    }


    // Using polymorphism


    Shape[] shapes = new Shape[] { new Circle(), new Square() };


    foreach (Shape shape in shapes)


    {


    shape.Draw();


    }


    In this example, we have a base class Shape with a virtual method Draw, and two
    derived classes, Circle and Square, each with its own implementation of Draw.
    We can store objects of these classes in an array of Shape, and when we call Draw,
    the appropriate method is invoked based on the actual object type.


    ### 5. Conclusion


    Object-Oriented Programming is a powerful paradigm in C# that allows you to structure
    your code in a way that models real-world concepts effectively. Understanding
    classes, objects, encapsulation, inheritance, and polymorphism is crucial for
    writing maintainable and extensible C# applications. As you become more proficient
    in C#, you’ll use these principles to design and build complex software systems.


