    ## Section 2.4: Control Structures (if, else, loops)


    Control structures in Python allow you to control the flow of your program based
    on conditions and repetition. In this section, we''ll explore conditional statements
    (if, else) and different types of loops (for and while) that are essential for
    building complex and dynamic programs.


    ### Conditional Statements (if, else)


    Conditional statements in Python, such as `if` and `else`, allow you to execute
    different code blocks based on specified conditions. Here''s how they work:


    #### The `if` Statement


    The `if` statement is used to execute a block of code only if a condition is true.
    If the condition is false, the code block is skipped.

