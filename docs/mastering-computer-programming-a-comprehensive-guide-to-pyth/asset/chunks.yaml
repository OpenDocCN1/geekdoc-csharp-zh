    \ is used to execute a block of code if the condition specified in the `if` statement\
    \ is false.\n\n# if-else statement\n\n```python\ny = 3\nif y > 5:\n    print(\"\
    y is greater than 5\")\nelse:\n    print(\"y is not greater than 5\")\n```\n\n\
