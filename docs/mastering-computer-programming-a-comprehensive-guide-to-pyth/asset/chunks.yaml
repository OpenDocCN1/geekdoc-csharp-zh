    # Section 2.5: Input and Output in Python


    ![image](d2d_images/chapter_title_below.png)


    In this section, we’ll delve into input and output (I/O) operations in Python.
    These operations allow your program to interact with the user, read data from
    external sources, and write data to files.


    ### Reading User Input


    To read input from the user in Python, you can use the input() function. This
    function reads a line of text entered by the user and returns it as a string.
    Here’s a basic example:


    # Reading user input


    name = input("Enter your name: ")


    print("Hello,", name)


    In this code, the input() function displays the prompt “Enter your name:” and
    waits for the user to enter text. The user’s input is then stored in the name
    variable and printed to the console.


    It’s important to note that the input() function always returns a string. If you
    want to perform numerical operations with the input, you should convert it to
    the appropriate data type (e.g., int or float) using type casting.


    # Converting user input to an integer


    age_str = input("Enter your age: ")


    age = int(age_str)


    # Performing calculations with the user''s age


    next_year_age = age + 1


    print("Next year, you''ll be", next_year_age, "years old.")


    ### Displaying Output


    To display output in Python, you’ve already seen how to use the print() function.
    This function allows you to output text and variables to the console. You can
    format the output by separating multiple items with commas or using string concatenation.


    # Displaying output


    x = 5


    y = 3


    # Using commas to separate items in print()


    print("The value of x is", x, "and the value of y is", y)


    # Using string concatenation


    message = "The sum of x and y is " + str(x + y)


    print(message)


    ### File Input and Output


    Python provides capabilities for reading data from and writing data to files.
    You can use the open() function to open a file and specify the mode (e.g., ‘r’
    for reading or ‘w’ for writing). Once a file is opened, you can use various methods
    to read or write data.


    #### Reading from a File


    To read data from a file, you can use the read() method. Here’s an example:


    # Reading from a file


    file_path = "sample.txt"


    with open(file_path, ''r'') as file:


    content = file.read()


    print("File content:")


    print(content)


    In this code, we open a file named “sample.txt” in read mode (‘r’) and use the
    read() method to read its contents. The with statement ensures that the file is
    properly closed when we’re done with it.


    #### Writing to a File


    To write data to a file, you can use the write() method. Here’s an example:


    # Writing to a file


    output_file_path = "output.txt"


    with open(output_file_path, ''w'') as output_file:


    output_file.write("Hello, Python!\n")


    output_file.write("This is a sample file created with Python.")


    In this code, we open a file named “output.txt” in write mode (‘w’) and use the
    write() method to write text to it. The ‘’ character represents a newline, allowing
    us to write multiple lines to the file.


    ### Closing Files


    When working with files, it’s important to close them properly to free up system
    resources. The with statement is a convenient way to ensure that files are automatically
    closed when you’re done with them. However, if you open a file without using the
    with statement, remember to close it explicitly using the close() method.


    # Closing files explicitly


    file = open("data.txt", ''r'')


    data = file.read()


    file.close()


    In this code, the close() method is called to close the file named “data.txt”
    after reading its contents.


    Understanding input and output operations in Python is essential for building
    interactive applications and processing data from various sources. Whether you’re
    interacting with users, reading data from files, or writing output to files, Python
    provides versatile tools to handle these tasks effectively.


