    \n### Loops (for and while)\n\nLoops in Python allow you to repeat a block of\
    \ code multiple times, making it possible to perform tasks iteratively.\n\n###\
    \ The for Loop\n\nThe `for` loop is used for iterating over a sequence (e.g.,\
    \ a `list`, `tuple`, or `string`) or any iterable object. It allows you to execute\
    \ a block of code for each item in the sequence.\n\n# for loop\n\n```python\n\
    fruits = [\"apple\", \"banana\", \"cherry\"]\nfor fruit in fruits:\n    print(fruit)\n\
    ```\n\nIn this example, the `for` loop iterates over the `fruits` list, and the\
    \ `print()` statement is executed for each item in the list.\n\n### The while\
    \ Loop\n\nThe `while` loop is used to repeatedly execute a block of code as long\
    \ as a specified condition is true.\n\n# while loop\n\n```python\ncount = 1\n\
    while count <= 5:\n    print(\"Count:\", count)\n    count += 1\n```\n\nIn this\
    \ code, the `while` loop runs as long as the `count` variable is less than or\
    \ equal to 5, incrementing `count` by 1 in each iteration.\n\n### Control Flow\
    \ Keywords: break and continue\n\nPython provides two control flow keywords, `break`\
    \ and `continue`, to further control the flow of loops.\n\n* `break`: Terminates\
    \ the current loop and moves to the next statement after the loop.\n\n# break\
    \ example\n\n```python\nnumbers = [1, 2, 3, 4, 5]\nfor num in numbers:\n    if\
    \ num == 4:\n        break\n    print(num)\n```\n\nIn this code, the `for` loop\
    \ stops when it encounters the value 4.\n\n* `continue`: Skips the current iteration\
    \ of a loop and continues to the next iteration.\n\n# continue example\n\n```python\n\
    numbers = [1, 2, 3, 4, 5]\nfor num in numbers:\n    if num == 3:\n        continue\n\
    \    print(num)\n```\n\nIn this code, the value 3 is skipped, and the loop continues\
