    # Section 7.3: JavaScript for Interactivity


    ![image](d2d_images/chapter_title_below.png)


    JavaScript is a programming language that allows you to add interactivity and
    dynamic behavior to web pages. It is an essential part of web development and
    is widely used for creating features like form validation, animations, and real-time
    updates. In this section, we’ll explore the basics of JavaScript and how it can
    be used to enhance web pages.


    ### 1. JavaScript Basics


    JavaScript is a client-side scripting language, which means it runs in the user’s
    web browser. You can include JavaScript code in your HTML document using <script>
    tags. Here’s a simple example:


    <!DOCTYPE html>


    <html>


    <head>


    <title>JavaScript Example</title>


    </head>


    <body>


    <p id="demo">Click the button to change this text.</p>


    <button onclick="changeText()">Click Me</button>


    <script>


    function changeText() {


    document.getElementById("demo").innerHTML = "Text has changed!";


    }


    </script>


    </body>


    </html>


    In this example, we have an HTML paragraph (<p>) and a button. When the button
    is clicked, the changeText JavaScript function is called, which updates the content
    of the paragraph.


    ### 2. Variables and Data Types


    JavaScript supports various data types, including numbers, strings, booleans,
    arrays, and objects. You can declare variables using var, let, or const. For example:


    var name = "John";


    var age = 30;


    var isStudent = true;


    var fruits = ["apple", "banana", "cherry"];


    var person = { firstName: "John", lastName: "Doe" };


    ### 3. Functions and Event Handling


    Functions in JavaScript are blocks of reusable code. You can define functions
    and call them as needed. Event handling is a common use case for functions in
    web development. Here’s an example of event handling:


    <button onclick="sayHello()">Say Hello</button>


    <script>


    function sayHello() {


    alert("Hello, world!");


    }


    </script>


    In this code, clicking the button triggers the sayHello function, which displays
    an alert.


    ### 4. DOM Manipulation


    The Document Object Model (DOM) represents the structure of an HTML document as
    a tree of objects. JavaScript allows you to manipulate the DOM to change content,
    style, or structure dynamically. For example:


    // Change text content


    document.getElementById("demo").innerHTML = "New content";


    // Modify CSS style


    document.getElementById("demo").style.color = "blue";


    // Create new elements


    var newDiv = document.createElement("div");


    newDiv.innerHTML = "This is a new div";


    document.body.appendChild(newDiv);


    ### 5. Conclusion


    JavaScript is a versatile language that brings interactivity and dynamic behavior
    to web pages. Understanding JavaScript basics, data types, functions, and DOM
    manipulation is essential for front-end web development. In the subsequent sections
    of this chapter, we will cover advanced topics like responsive web design and
    server-side scripting with PHP.


