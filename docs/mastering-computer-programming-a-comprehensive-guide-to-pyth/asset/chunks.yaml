    # Section 5.4: Standard Template Library (STL) in C++


    ![image](d2d_images/chapter_title_below.png)


    The Standard Template Library (STL) is a powerful part of C++ that provides a
    collection of template classes and functions to simplify common programming tasks.
    It offers containers, algorithms, and iterators that make it easier to manage
    and manipulate data. In this section, we’ll explore some key components of the
    STL.


    ### Containers


    Containers are objects that store collections of data. The STL provides various
    container types, each with specific characteristics and use cases:


    1.  Vector: std::vector is a dynamic array that can grow or shrink in size. It
    provides fast random access and efficient element insertion/removal at the end.


    #include <vector>


    std::vector<int> numbers = {1, 2, 3, 4, 5};


    numbers.push_back(6); // Add an element to the end


    1.  List: std::list is a doubly-linked list. It supports efficient element insertion/removal
    at both the beginning and end of the list.


    #include <list>


    std::list<std::string> names;


    names.push_back("Alice");


    names.push_back("Bob");


    1.  Map: std::map is an associative container that stores key-value pairs. It
    allows fast retrieval of values by their keys.


    #include <map>


    std::map<std::string, int> scores;


    scores["Alice"] = 95;


    scores["Bob"] = 87;


    1.  Set: std::set is a container that stores unique values in sorted order.


    #include <set>


    std::set<int> uniqueNumbers = {3, 1, 2, 3, 2, 4};


    ### Algorithms


    The STL includes a wide range of algorithms that work with containers, making
    it easy to perform common operations like sorting, searching, and transformation.
    Some commonly used algorithms include:


    •  std::sort: Sorts elements in a container.


    #include <algorithm>


    std::vector<int> numbers = {5, 2, 8, 1, 9};


    std::sort(numbers.begin(), numbers.end());


    •  std::find: Searches for an element in a container.


    #include <algorithm>


    auto it = std::find(numbers.begin(), numbers.end(), 8);


    if (it != numbers.end()) {


    // Found the element


    }


    •  std::for_each: Applies a function to each element in a container.


    #include <algorithm>


    std::for_each(numbers.begin(), numbers.end(), [](int num) {


    std::cout << num << " ";


    });


    ### Iterators


    Iterators are objects that allow you to traverse and manipulate the elements of
    a container. They act as pointers to container elements. There are several types
    of iterators, including begin(), end(), rbegin(), rend(), and more.


    #include <vector>


    std::vector<int> numbers = {1, 2, 3, 4, 5};


    for (auto it = numbers.begin(); it != numbers.end(); ++it) {


    std::cout << *it << " ";


    }


    ### Functors (Function Objects)


    Functors, or function objects, are objects that can be used as if they were functions.
    They are often used in combination with algorithms. You can define your own functors
    by overloading the operator().


    struct MultiplyBy {


    int factor;


    MultiplyBy(int n) : factor(n) {}


    int operator()(int x) const {


    return x * factor;


    }


    };


    std::vector<int> numbers = {1, 2, 3, 4, 5};


    std::transform(numbers.begin(), numbers.end(), numbers.begin(), MultiplyBy(2));


    The STL is a valuable tool for C++ developers, providing efficient and reliable
    solutions for common programming tasks. Understanding the STL’s containers, algorithms,
    iterators, and other components can significantly enhance your productivity and
    code quality. In the upcoming sections of this chapter, we’ll explore best practices
    for C++ programming and how to write efficient and maintainable code.


