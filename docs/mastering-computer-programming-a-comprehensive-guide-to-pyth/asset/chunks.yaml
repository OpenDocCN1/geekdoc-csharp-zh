    \ for its platform independence, making it suitable for building cross-platform\
    \ applications. It’s commonly used in mobile app development (Android), enterprise-level\
    \ systems, and web applications.\n• Example Code:\n\n```java\n// Java code to\
    \ print \"Hello, world!\"\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello, world!\");\n    }\n}\n```\n\n###\
    \ 4. C++\n\n• Use Cases: `C++` is a powerful language often used in game development,\
