  \ i)` | 显示: 2025 | |\n| 16 | `i += 10` | | 55 |\n| 17 | `Console.WriteLine(i)` |\
  \ 显示: 55 | |\n| 18 | `i += 5` | | 60 | |\n| 19 | `if (i > 45)` | 结果为真 | |\n| 20\
  \ | `Console.WriteLine(\"The end\")` | 显示: The end | |\n\n## 25.4 复习习题：判断对错\n\n\
  对以下每个陈述判断对（或错）。\n\n1) 先测试循环（pre-test loop）可能执行零次迭代。\n2) 在流程图中，先测试循环结构中菱形符号的两个出口方向都是向上的。\n\
  3) 先测试循环结构中的语句或语句块至少执行一次。\n4) 当 `while` 语句的布尔表达式求值为真时，它会停止迭代。\n5) 在先测试循环结构中，当结构的语句或语句块执行\
  \ `N` 次时，布尔表达式被求值 `N - 1` 次。\n6) 后测试循环（post-test loop）可能执行零次迭代。\n7) 在后测试循环结构中，当结构的语句或语句块执行\
  \ `N` 次时，其布尔表达式也被求值 `N` 次。\n8) 你不能在后测试循环结构内部嵌套决策控制结构。\n9) 中测试循环（mid-test loop）结构中，语句或语句块\
