  \n编写一个 C# 程序，提示用户输入一个数字，然后显示消息指示该数字的数据类型是整数还是实数。\n\n解决方案\n\n众所周知，当一个数字不包含小数部分时，被视为整数。在\
  \ C# 中，你可以使用 `(int)` 强制转换运算符来获取任何实数的整数部分。如果用户提供的数字与其整数部分相等，则该数字被视为整数。\n\n例如，如果用户输入数字\
  \ `7`，那么这个数字和它的整数部分 `(int)(7)` 是相等的。\n\n相反，如果用户输入数字 `7.3`，这个数字和它的整数部分 `(int)(7.3)`\
  \ 则是不相等的。\n\n该 C# 程序如下。\n\n```csharp\ndouble x;\nConsole.Write(\"Enter a number:\
  \ \");\nx = Convert.ToDouble(Console.ReadLine());\nif (x == (int)x) {\n    Console.WriteLine(x\
  \ + \" is integer\");\n} else {\n    Console.WriteLine(x + \" is real\");\n}\n```\n\
  \n变量 `x` 被声明为 `double`，在数据输入阶段使用了 `Convert.ToDouble()` 方法。这是为了允许用户输入整数或浮点数，是必要的。\n\
  \n#### 练习 23.1-2 验证数据输入并寻找奇偶数\n\n设计流程图并编写相应的 C# 程序，提示用户输入一个非负整数，然后显示消息指示该数是否为偶数；否则必须显示“Odd”。此外，如果用户输入负值或浮点数，必须显示错误消息。\n\
  \n（此练习让你在处理数据验证方面进行实践）。\n\n解决方案\n\n数据验证是限制数据输入的过程，强制用户只输入有效值。\n\n在此练习中，你需要提示用户输入一个非负整数，并在他们输入负值或浮点数时显示错误消息。解决此练习的通用形式流程图所示。\n\
