  \ | 暴风 |\n| 11 | 极性暴风 |\n| 12 | 飓风级 |\n\n\n\n\n这里有一个嵌套决策控制结构的示例。\n\n![Image](img/chapter20-01.png)\n\
  \n这可以重新排列为：\n\n![Image](img/chapter20-02.png)\n\n这里是对应的 C# 代码。\n\n```csharp\nif\
