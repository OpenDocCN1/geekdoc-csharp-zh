  } while (answer.ToUpper() == \"YES\");\n```\n\n### 练习 30.1-6 寻找数字之和\n\n编写一个 C# 程序，让用户输入一个整数，然后计算其数字之和。\n\
  \n#### 解决方案\n\n在练习 13.1-2 中，你学习了如何在总位数未知的情况下拆分整数的数字。在这个练习中，允许用户输入任何值，无论大小。\n\n第一方法\n\
  \n在这种方法中，核心思想是在每次迭代分离出一个数字。然而，挑战在于确定迭代的总次数，这取决于用户整数的大小。那么，这会造成障碍吗？完全不会！\n\n在循环内部，用户提供的整数应该每次迭代不断减少，直到最终变为零。零值可以作为停止循环控制结构迭代的条件。例如，如果用户提供的数字是\
  \ 4753，它在第一次迭代中变为 475，第二次迭代变为 47，然后是 4，最终变为 0。一旦达到 0，迭代必须停止。\n\n让我们尝试通过以下流程图来理解建议的解决方案。某些语句以通用形式编写。\n\
  \n![Image](img/chapter30-01.png)\n\n该语句\n\n\n\n\n\n`digit` ← 提取变量 `x` 的最后一位。\n\n\
  可以使用为了知的 `MOD 10` 操作来编写，如下所示。\n\n`digit ← x MOD 10`\n\n然而，整个概念依赖于以下语句：\n\n`x ← 保留变量\
  \ `x` 除最后一位以外的所有数字。`\n\n该语句最终会将变量 `x` 的值置零，然后执行流随之退出循环。要编写此语句，你可以使用如下所示的 `DIV 10`\
  \ 操作。\n\n`x ← x DIV 10`\n\n相应地，C# 程序变为：\n\n![](img/my_exercise_header.png) \n```csharp\n\
  project_30.1-6aint x, s, digit;x = Convert.ToInt32(Console.ReadLine());s = 0;while\
  \ (x != 0) {digit = x % 10;      //这里是 x MOD 10 操作 = s + digit;x = (int)(x / 10);\
  \   //这里是 x DIV 10 操作}Console.WriteLine(s);\n```\n\n让我们为输入值 `4753` 创建一个跟踪表，以便更好地理解到底发生了什么。\n\
  \n| 步骤 | 语句 | Note | x | digit | s |\n| --- | --- | --- | --- | --- | --- |\n| 1\
  \ | `x = Convert.ToInt32(…)` | 用户输入值 4753 | 4753 | ? | ? |\n| 2 | `s = 0` | | 4753\
  \ | ? | 0 |\n| 3 | `while (x != 0)` | 结果为真 | | | |\n| 4 | `digit = x % 10` | | 4753\
  \ | 3 | 0 |\n| 5 | `s = s + digit` | | 4753 | 3 | 3 |\n| 6 | `x = (int)(x / 10)`\
  \ | | 475 | 3 | 3 |\n| 7 | `while (x != 0)` | 结果为真 | | | |\n| 8 | `digit = x % 10`\
  \ | | 475 | 5 | 3 |\n| 9 | `s = s + digit` | | 475 | 5 | 8 |\n| 10 | `x = (int)(x\
  \ / 10)` | | 47 | 5 | 8 |\n| 11 | `while (x != 0)` | 结果为真 | | | |\n| 12 | `digit\
  \ = x % 10` | | 47 | 7 | 8 |\n| 13 | `s = s + digit` | | 47 | 7 | 15 |\n| 14 | `x\
  \ = (int)(x / 10)` | | 4 | 7 | 15 |\n| 15 | `while (x != 0)` | 结果为真 | | | |\n| 16\
  \ | `digit = x % 10` | | 4 | 4 | 15 |\n| 17 | `s = s + digit` | | 4 | 4 | 19 |\n\
  | 18 | `x = (int)(x / 10)` | | 0 | 4 | 19 |\n| 19 | `while (x != 0)` | 结果为假 | |\
  \ | |\n| 20 | `.WriteLine(s)` | 显示： 19 | | | |\n\n![](img/remember.jpg) 在 C# 中，两个整数除法的结果始终是一个整数。因此，在语句\
  \ `x = (int)(x / 10)` 中，由于变量 `x` 和常量 `10` 都是整数，`(int)` 强制转换运算符是多余的。然而，为了提高可读性，保留它也是一种良好的做法。\n\
  \n### 第二种方法\n\n在这种方法中，核心思想是将用户提供的整数转换为字符串，然后使用 `for`-循环遍历其所有的字符（数字）。然而，在 `for`-循环中，你需要在将每个数字从\
  \ `char` 类型转换回 `int` 类型之前，将其累加到变量 `s` 中。C# 程序如下。\n\n![](img/my_exercise_header.png)\
  \ \n```csharp\nproject_30.1-6bint i, x, s;string xStr, digit;x = Convert.ToInt32(Console.ReadLine());xStr\
  \ = \"\" + x;  //将用户输入转换为字符串 s = 0;for (i = 0; i <= xStr.Length - 1; i++) {digit\
  \ = \"\" + xStr[i];  //获取字符串形式的“数字” s = s + Convert.ToInt32(digit);}Console.WriteLine(s);\n\
  ```\n\n### 30.2 嵌套循环控制结构练习\n\n#### 练习 30.2-1 显示所有包含给定数字的三位整数\n\n编写一个 C# 程序，提示用户输入一个数字（0\
  \ 到 9），然后显示所有至少包含一次用户提供的数字的三位整数。例如，对于用户提供的值 `7`，`357`、`771` 和 `700` 都是这样的整数。\n\n\
  ##### 解决方案\n\n有三种不同的方法！第一种只使用一个 `for`-循环，第二种使用三个相互嵌套的 `for`-循环，第三种则将所有三位整数转换为字符串。让我们分析一下！\n\
  \n###### 第一种方法 —— 使用 `for`-循环\n\n这种方法的核心思想是使用一个 `for`-循环，其中计数器从 `100` 到 `999`。在循环内部，将计数器拆分为数字\
  \ `digit3`、`digit2`，并使用判断结构检查是否至少等于用户提供的数字。C# 程序如下。\n\n![](img/my_exercise_header.png)\
  \ \n```csharp\nproject_30.2-1aint x, i, digit3, digit2, digit1;for (i = 100; i <=9++)digit3\
  \ = (int)(i / 100);r = i % 100;digit2 = (int)(r / 10);digit1 = r % 10;\n```\n\n\
  ###### 第二种方法 —— 嵌套循环\n\n使用三个 `for`-循环，相互嵌套。在这种情况下，`digit3` 由外层循环处理，而 `digit2` 和\
  \ `digit1` 由内部循环处理。C# 程序为：\n\n![](img/my_exercise_header.png) \n```csharp\nproject_30.2-1aint\
  \ digit3, digit2, digit1;Console.Write(\"输入数字 0 - 9 \");x = Convert.ToInt32(Console.ReadLine());for\
  \ (digit3 = 1; digit3 <= 9; digit3++) {for (digit2 = 0; digit2 <= 9; digit2++) {for\
  \ (digit1 = 0; digit1 <= 9; digit1++) {if (digit3 == x || digit2 == x || digit1\
  \ == x) {Console.WriteLine(digit3 * 100 + digit2 * 10 + digit1);}}}\n```\n\n######\
  \ 第三种方法 —— 转换为字符串\n\n使用 `for`-循环，将计数器转换为字符串并使用 `IndexOf()` 方法检查数字是否存在。C# 程序为：\n\n\
  ![](img/my_exercise_header.png) \n```csharp\nproject_30.2-1aint i;string x;Console.Write(\"\
  输入数字 0 - 9 \");x = Console.ReadLine();for (i = 100; i <=999; i++) {if (i.ToString().IndexOf(x)\
  \ != -1) {Console.WriteLine(i);}}}\n```\n\n#### 练习 30.2-2 显示特定实例\n\n编写一个 C# 程序，显示所有第一位数字小于第二位数字且第二位数字小于第三位数字的三位整数。例如，`357`、`456`\
  \ 和 `159` 就是这样的整数。\n\n##### 解决方案\n\n###### 第一种方法 —— 使用 `for`-循环和判断结构\n\n使用 `for`-循环和判断结构，C#\
  \ 程序为：\n\n![](img/my_exercise_header.png) \n```csharp\nproject_30.2-2aint i, r,\
  \ digit1, digit2, digit3;for (i = 100; i <=999; i++) {digit3 = (int)(i / 100);r\
  \ = i % 100;digit2 = (int)(r / 10);digit1 = r % 10;if (digit3 < digit2 && digit2\
  \ < digit1) {Console.WriteLine(i);}}\n```\n\n###### 第二种方法 —— 使用嵌套循环结构\n\n使用嵌套循环结构，C#\
  \ 程序为：\n\n![](img/my_exercise_header.png) \n```csharp\nproject_30.2-2aint digit1,\
  \ digit2, digit3;for (digit3 = 1; digit3 <= 9; digit3++) {for (digit2 = 0; digit2\
  \ <= 9; digit2++) {for (digit1 = 0; digit1 <= 9; digit1++) {if (digit3 < digit2\
  \ && digit2 < digit1) {Console.WriteLine(digit3 * 100 + digit2 * 10 + digit1);}}}\
  \ }}}\n```\n\n\n\n\n\n这种方法基于第二种方法。它们之间的主要区别在于，在这种情况下，变量 `digit1` 总是从大于 `digit2`\
  \ 的值开始，而变量 `digit2` 总是从大于 `digit3` 的值开始。这样一来，第一个显示的整数将是 123。\n\n![](img/notice.jpg)在值\
  \ 123 和 789 之间，没有没有任何整数可以使布尔表达式 `digit3 < digit2 && digit2 < digit1` 为真。\n\nC# 程序如下。\n\
  \n![](img/my_exercise_header.png)\n```csharp\nint digit3, digit2, digit1;\nfor (digit3\
  \ = 1; digit3 <= 7; digit3++) {\n    for (digit2 = digit3 + 1; digit2 <= 8; digit2++)\
  \ {\n        for (digit1 = digit2 + 1; digit1 <= 9; digit1++) {\n            Console.WriteLine(digit3\
  \ * 100 + digit2 * 10 + digit1);\n        }\n    }\n}\n```\n\n![](img/notice.jpg)这种解决方案是最有效的，因为它没有使用任何决策控制结构，而且迭代次数被保持在最低！\n\
  \n![](img/remember.jpg)正如你所看到的，一个问题可以有很多解决方案。找到最优解取决于你自己！\n\n### 30.3 使用循环控制结构进行数据验证\n\
  \n如你所所的，数据验证是限制数据输入的过程，它强制使用户只输入有效值。你已经遇到过使用决策控制结构进行数据验证的方法。让我们回想一下一个例子。\n\n```csharp\n\
  Console.Write(\"Enter a non-negative number: \");\nx = Convert.ToDouble(Console.ReadLine());\n\
  if (x < 0) {\n    Console.Write(\"Error: Negative number entered!\");\n} else {\n\
  \    Console.WriteLine(Math.Sqrt(x));\n}\n```\n\n然而，这种方法对用户来说可能并不方便。如果他们输入了无效数字，程序会显示错误消息，执行流将不可避免地到达结束。用户随后必须重启程序以重新输入有效数字。\n\
  \n接下来，你将发现三种通用形式的通过循环控制结构验证数据输入的方法。在用户输入无效值的情况下，主要目标是反复提示他们，直到他们最终提供有效值为止。当然，如果用户最初输入了有效值，执行流将直接进入程序的下一个部分。\n\
  \n你使用哪种方法取决于你是否希望显示错误消息，以及你是否希望显示不同的错误消息（每种类型的输入错误显示一个），还是对任何错误显示一个通用错误消息。\n\n####\
  \ 第一种方法 – 不带错误消息的数据验证\n\n要在不显示任何错误消息的情况下验证数据输入，你可以使用以下通用形式的代码片段。\n\n```csharp\n\
  do {\n    Console.Write(\"Prompt message\");\n    input_data = Console.ReadLine();\n\
  } while (input_data test 1 fails || input_data test 2 fails || …);\n```\n\n####\
  \ 第二种方法 – 使用通用错误消息的数据验证\n\n验证数据输入并显示通用错误消息（即对任何类型的输入错误显示相同的错误消息），你可以使用以下通用形式的代码片段。\n\
  \n```csharp\nConsole.Write(\"Prompt message\");\ninput_data = Console.ReadLine();\n\
  while (input_data test 1 fails || input_data test 2 fails || … ) {\n    Console.WriteLine(\"\
  Error message\");\n    Console.Write(\"Prompt message\");\n    input_data = Console.ReadLine();\n\
  }\n```\n\n#### 第三种方法 – 使用不同错误消息的数据验证\n\n验证数据输入并为每种输入错误显示不同的错误消息，你可以使用以下通用形式的代码片段。\n\
  \n```csharp\ndo {\n    Console.Write(\"Prompt message\");\n    input_data = Console.ReadLine();\n\
  \    failure = false;\n    if (input_data test 1 fails) {\n        Console.WriteLine(\"\
  Error message 1\");\n        failure = true;\n    } else if (input_data test 2 fails)\
  \ {\n        Console.WriteLine(\"Error message 2\");\n        failure = true;\n\
  \    } else (……)\n} while (failure);\n```\n\n![](img/notice.jpg)语句 `while (failure)`\
  \ 等于语句 `while (failure == true)`。\n\n#### 练习题 30.3-1 寻找奇数和偶数 - 不带错误消息的验证\n\n编写一个\
  \ C# 程序，提示用户输入一个非负整数，然后显示消息指示该数是否为偶数；否则必须显示“Odd”。使用循环控制结构，程序还必须验证数据输入，允许用户只输入非负整数。\n\
  \n解决方案\n\n这里将介绍你在 [30.3 节] 中学到的三种验证数据输入的方法。但首先，让我们在不进行数据验证的情况下解决这个练习。\n\n```csharp\n\
  Console.Write(\"Enter a non-negative integer: \");\nx = Convert.ToInt32(Console.ReadLine());\n\
  if (x % 2 == 0) {\n    Console.WriteLine(\"Even\");\n} else {\n    Console.WriteLine(\"\
  Odd\");\n}\n```\n\n不带错误消息的验证\n\n要在不显示任何错误消息的情况下验证数据输入，请使用 [30.3 节] 中的第一种方法。只需将虚矩形标记的语句替换为以下代码片段即可。\n\
  \n```csharp\ndo {\n    Console.Write(\"Enter a non-negative integer: \");\n    input_data\
  \ = Console.ReadLine();\n} while (input_data test 1 fails || input_data test 2 fails\
  \ || …);\n```\n\n最终的 C# 程序变为：\n\n![](img/my_exercise_header.png)\n```csharp\ndo\
  \ {\n    Console.Write(\"Enter a non-negative integer: \");\n    x = Convert.ToDouble(Console.ReadLine());\n\
  } while (x < 0 || (int)x != x);\nif (x % 2 == 0) {\n    Console.WriteLine(\"Even\"\
  );\n} else {\n    Console.WriteLine(\"Odd\");\n}\n```\n![](img/notice.jpg)变量 `x`\
  \ 被声明为 `double`。这是为了允许用户输入整数或浮点数。\n\n带错误消息的验证\n\n验证数据输入并显示通用错误消息，请使用 [30.3 节] 中的第二种方法替换虚矩形标记的语句。C#\
  \ 程序如下。\n\n```csharp\ndouble x;\nConsole.Write(\"Enter a non-negative integer: \"\
  );\nx = Convert.ToDouble(Console.ReadLine());\nwhile (x < 0 || (int)x != x) {\n\
  \    Console.WriteLine(\"Error! A negative value or float.\");\n    Console.Write(\"\
  Enter a non-negative integer: \");\n    x = Convert.ToDouble(Console.ReadLine());\n\
  }\nif (x % 2 == 0) {\n    Console.WriteLine(\"Even\");\n} else {\n    Console.WriteLine(\"\
  Odd\");\n}\n```\n\n带不同错误消息的验证\n\n在这里，替换的代码片段基于 [30.3 节] 中的第三种方法。C# 程序如下。\n\n```csharp\n\
  double x;\nbool failure;\ndo {\n    Console.Write(\"Enter a non-negative integer:\
  \ \");\n    x = Convert.ToDouble(Console.ReadLine());\n    failure = false;\n  \
  \  if (x < 0) {\n        Console.WriteLine(\"Error! You entered a negative value\"\
  );\n        failure = true;\n    } else if ((int)x != x) {\n        Console.WriteLine(\"\
  Error! You entered a float\");\n        failure = true;\n    }\n} while (failure);\n\
  if (x % 2 == 0) {\n    Console.WriteLine(\"Even\");\n} else {\n    Console.WriteLine(\"\
  Odd\");\n}\n```\n\n#### 练习题 30.3-2 求四个数的和\n\n编写一个 C# 程序，提示用户输入四个正数，然后计算并显示它们的和。使用循环控制结构，程序还必须验证数据输入并在用户输入任何非正值时显示错误消息。\n\
  \n解决方案\n\n这个练习已经在 [练习 26.1-4] 中讨论过。这里的唯一区别是，此程序必须验证数据输入并在用户输入无效值时显示错误消息。为了方便起见，练习中提出的解决方案在此处复制。\n\
  \n```csharp\ndouble total = 0;\nfor (i = 1; i <= 4; i++) {\n    Console.Write(\"\
  Enter a number: \");\n    x = Convert.ToDouble(Console.ReadLine());\n    total +=\
  \ x;\n}\nConsole.WriteLine(total);\n```\n\n\n\n\n本次练习的主要目的是演示如何将验证数据输入的循环控制结构（loop\
  \ control structure）嵌套到其他现有的循环控制结构中。在本次练习中，您应该用虚线矩形标记的语句替换为以下代码段：\n\n```csharp\n\
  Console.Write(\"Enter a number: \");x = Convert.ToDouble(Console.ReadLine());while\
  \ (x <= 0) {\n    Console.WriteLine(\"Please enter a positive value!\");\n    Console.Write(\"\
  Enter a number: \");\n    x = Convert.ToDouble(Console.ReadLine());\n}\n```\n\n\
  最终的 C# 程序将变为：\n\n![](img/my_exercise_header.png) project_30.3-2\n```csharp\nint\
  \ i;double total, x;total = 0;for (i = 1; i <= 4; i++) {\n    Console.Write(\"Enter\
  \ a number: \");\n    x = Convert.ToDouble(Console.ReadLine());\n    while (x <=\
  \ 0) {\n        Console.WriteLine(\"Please enter a positive value!\");\n       \
  \ Console.Write(\"Enter a number: \");\n        x = Convert.ToDouble(Console.ReadLine());\n\
  \    }\n    total += x;\n}\nConsole.WriteLine(total);\n```\n\n![](img/notice.jpg)注意，替换代码段完全嵌套在这个外部的\
  \ for 循环中。\n\n### 30.4 使用循环控制结构寻找最小值和最大值\n\n在第 23.2 节中，您学习了如何使用单分支决策结构找到四个值中的最小值和最大值。现在，以下代码段实现了相同的结果，但仅使用变量\
  \ `w` 来存储用户提供的值。\n\n```csharp\nw = Convert.ToInt32(Console.ReadLine());   //用户输入第\
  \ 1 个值\nmaximum = w;\nw = Convert.ToInt32(Console.ReadLine());   //用户输入第 2 个值\n\
  if (w > maximum) {maximum = w;}\nw = Convert.ToInt32(Console.ReadLine());   //用户输入第\
  \ 3 个值\nif (w > maximum) {maximum = w;}\nw = Convert.ToInt32(Console.ReadLine());\
  \   //用户输入第 4 个值\nif (w > maximum) {maximum = w;}\n```\n\n除了第一对语句外，所有其他语句块都是完全相同的。因此，您可以只保留这些对中的一组，并将其封装在一个执行三次迭代的循环控制结构中，如下：\n\
  \n```csharp\nw = Convert.ToInt32(Console.ReadLine());   //用户输入第 1 个值\nmaximum =\
  \ w;\nfor (i = 1; i <= 3; i++) {\n    w = Convert.ToInt32(Console.ReadLine()); \
  \  //用户输入第 2、第 3 和第 4 个值\n    if (w > maximum) {\n        maximum = w;\n    }\n\
  }\n```\n\n当然，如果您想允许用户输入更多值，只需增加 for 循环的 `final_value` 即可。\n\n接下来将展示一个寻找并显示 10 个人中体重重者的程序。\n\
  \n![](img/my_exercise_header.png) project_30.4a\n```csharp\nint w, maximum, i;\n\
  Console.Write(\"Enter a weight (in pounds): \");\nw = Convert.ToInt32(Console.ReadLine());\n\
  maximum = w;\nfor (i = 1; i <= 9; i++) {\n    Console.Write(\"Enter a weight (in\
  \ pounds): \");\n    w = Convert.ToInt32(Console.ReadLine());\n    if (w > maximum)\
  \ {\n        maximum = w;\n    }\n}\nConsole.WriteLine(maximum);\n```\n\n![](img/notice.jpg)注意\
  \ for 循环的迭代次数比用户提供的值总数少一次。\n\n尽管这个 C# 程序运行正常，但让我们尝试一种稍微不同的方法。与其在循环之前提示用户输入第一个值，然后在循环内输入其余九个值，不如在循环内提示他们输入所有值。\n\
  \n然而，这里出现的问题是，无论如何，在循环开始迭代之前，必须始终为变量 `maximum` 分配一个初始值。但是，这个值不能任意选择；它取决于给定的问题。因此，选择一个“几乎任意”的初始值需要仔细的考虑，因为错误的选择可能会导致不准确的结果。\n\
  \n在本次练习中，所有用户提供的值都与人的体重有关。由于不太可能找到体重为负的人（至少在地球上是如此），您可以安全地将初始值 `-1` 赋值给变量 `maximum`，如下：\n\
  \n![](img/my_exercise_header.png) project_30.4b\n```csharp\nint maximum, i, w;\n\
  maximum = -1;\nfor (i = 1; i <= 10; i++) {\n    Console.Write(\"Enter a weight (in\
  \ pounds): \");\n    w = Convert.ToInt32(Console.ReadLine());\n    if (w > maximum)\
  \ {\n        maximum = w;\n    }\n}\nConsole.WriteLine(maximum);\n```\n\n一旦执行流进入循环，用户输入第一个值，决策控制结构将判断为真。变量\
  \ `maximum` 中的初始值 `-1` 随后会被这个第一个用户提供的值覆盖，之后执行流将正常进行。\n\n![](img/notice.jpg)注意这种方法可能不适用于所有情况。如果练习要求提示用户输入任何数字（而不限于正数），则无法应用此方法，因为用户可能只输入负值。如果发生这种情况，初始值\
  \ `-1` 将永远不会被覆盖。这种方法仅在已知上限时用于寻找 `maximum`。\n\n#### 练习 30.4-1 验证输入并寻找最小值和最大值\n\n\
  编写一个 C# 程序，提示用户输入 10 个体重值并寻找最小值和最大值。使用循环控制结构，程序必须验证数据输入，并在用户输入非正值时显示错误信息。\n\n解决方案\n\
  \n利用上一个练习作为指南，您现在应该能够做到这一点。为了验证数据输入，您只需要将上一个练习中的以下代码：\n\n```csharp\nConsole.Write(\"\
  Enter a weight (in pounds): \");\nw = Convert.ToInt32(Console.ReadLine());\n```\n\
  \n替换为以下代码段：\n\n```csharp\nConsole.Write(\"Enter a weight (in pounds): \");\nw =\
  \ Convert.ToInt32(Console.ReadLine());\nwhile (w < 1 || w > 1500) {\n    Console.Write(\"\
  Invalid value! Enter a weight between 1 and 1500 (in pounds): \");\n    w = Convert.ToInt32(Console.ReadLine());\n\
  }\n```\n\n以下是寻找最重者的最终程序：\n\n![](img/my_exercise_header.png) project_30.4-1\n```csharp\n\
  int minimum, maximum, i, w;\nminimum = 1500;\nmaximum = 0;\nfor (i = 1; i <= 10;\
