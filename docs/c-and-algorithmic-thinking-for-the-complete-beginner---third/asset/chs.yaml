  #### 练习题 23.4-5 阶梯电价和用量\n\nLAV 电力公司根据下表向订阅者收取电费：\n\n| 千瓦时 (kWh) | 每度费用 |\n| ---\
  \ | --- |\n| ≤ 500 | $0.10 |\n| 501 ≤ kWh ≤ 2000 | $0.25 |\n| 2001 ≤ kWh ≤ 4500\
  \ | $0.40 |\n| 4501 ≤ kWh | $0.60 |\n\n编写一个 C# 程序，提示用户输入总千瓦时，然后计算并显示支付总额。\n\n答案\n\
  \n阶梯式意味着当客户消耗例如 2200 kWh 时，总金额的计算如下：前 500 kWh 收取 $0.10，接下来的 1500 kWh 收取 $0.25，最后的\
  \ 200 kWh 收取 $0.40。因此，客户必须支付 500 × 0.10 + 1500 × 0.25 + 200 × 0.40 = $505。\n\n下图可以帮助你完全理解在阶梯费下如何计算总金额。\n\
  \n![Image](img/chapter23-22.png)\n\n对应的 C# 程序所示。\n\n```csharp\nint kwh;\ndouble\
  \ t;\nConsole.Write(\"Enter number of Kilow-hours consumed: \");\nkwh = Convert.ToInt32(Console.ReadLine());\n\
  if (kwh <= 500) {\n    t = kwh * 0.10;\n} else if (kwh <= 2000) {\n    t = 500 *\
  \ 0.10 + (kwh - 500) * 0.25;\n} else if (kwh <= 4500) {\n    t = 500 * 0.10 + 1500\
  \ * 0.25 + (kwh - 2000) * 0.40;\n} else {\n    t = 500 * 0.10 + 1500 * 0.25 + 2500\
  \ * 0.40 + (kwh - 4500) * 0.60;\n}\nConsole.WriteLine(\"Total amount to pay: \"\
  \ + t);\n```\n\n#### 练习题 23.4-6 阶梯定价和短信\n\nLAV 手机公司每月向客户收取 8 美元的基本费用发送短信。额外费用根据发送短信的总数收取，如下表所示：\n\
