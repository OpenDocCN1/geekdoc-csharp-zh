  \n### 16.1 单分支选择结构\n\n这是最简单的选择控制结构。它仅在“真”路径上包含一个语句或语句块，如下面的般形式的流程图片段所示。\n\n![Image](img/chapter16-01.png)\n\
  \n如果 `Boolean_Expression` 结果为真，则执行该结构中的语句或语句块；否则跳过这些语句。\n\nC# 语句的一般形式为：\n\n```csharp\n\
  if (Boolean_Expression) {A statement or block of statements}\n```\n\n![](img/notice.jpg)注意，语句或语句块缩进了\
  \ 2 个空格。\n\n在下一个示例中，只有当用户输入小于 18 的值时，才会显示消息“你未成年！”。当用户输入大于或等于 18 的值时，不显示任何内容。\n\n\
  ![](img/my_exercise_header.png) project_16.1a\n\n```csharp\nint age;\nConsole.Write(\"\
  Enter your age: \");\nage = Convert.ToInt32(Console.ReadLine());\nif (age < 18)\
  \ {\n  Console.WriteLine(\"You are underage!\");\n}\n```\n\n![](img/notice.jpg)注意\
  \ `Console.WriteLine()` 语句缩进了 2 个空格。\n\n在下一个示例中，只有当用户输入小于 18 的值时，才会显示消息“你未成年！”和“你还要等几年”。与之前一样，当用户输入大于或等于\
  \ 18 的值时，不显示任何消息。\n\n![](img/my_exercise_header.png) project_16.1b\n```csharp\n\
  int age;\nConsole.Write(\"Enter your age: \");\nage = Convert.ToInt32(Console.ReadLine());\n\
  if (age < 18) {\n  Console.WriteLine(\"You are underage!\");\n  Console.WriteLine(\"\
  You have to wait for a few more years.\");\n}\n```\n\n![](img/notice.jpg)所有出现在 if\
  \ 语句内部的语句都应该向右缩进相同数量的空格。在上例中，两个 `Console.WriteLine()` 语句都缩进了 2 个空格。\n\n![](img/notice.jpg)为了节省纸张，本书每缩进层使用\
  \ 2 个空格。然而，C# 官方网站建议每缩进层使用 4 个空格。\n\n![](img/notice.jpg)为了缩进文本光标，与其输入空格字符，你可以按“Tab\
  \ ![Image](img/key_tab.png)”键！\n\n![](img/notice.jpg)为了缩进现有的语句或语句块，请选择它并按下“Tab ![Image](img/key_tab.png)”键！\n\
  \n![](img/notice.jpg)为了取消缩进语句或语句块，请选择它并按下“Shift ↑ + Tab ![Image](img/key_tab.png)”组合！\n\
  \n在下一个示例中，只有当用户输入名字“Zeus”时，才会显示消息“你是众王！”。然而，无论用户输入什么名字，都会显示“你住在奥林匹斯山”。\n\n![](img/my_exercise_header.png) project_16.1c\n\
  ```csharp\nstring name;\nConsole.Write(\"Enter your name: \");\nname = Console.ReadLine();\n\
  if (name == \"Zeus\") {\n  Console.WriteLine(\"You are the King of the Gods!\");\n\
  }\nConsole.WriteLine(\"You live on Mount Olympus.\");\n```\n\n\n\n\n在这种情况下，你只需要几行代码，不需要任何决策控制结构！\n\
  \n![](img/my_exercise_header.png) project_16.1-2\n\n```csharp\ndouble x;\nx = Convert.ToDouble(Console.ReadLine());\n\
  Console.WriteLine(Math.Abs(x));\n```\n\n### 16.2 复习题：判断对错\n\n对以下每个陈述选择正确（True）或错误（False）。\n\
  \n1) 当必须执行一组语句时，使用单分支决策结构。\n2) 你使用单分支决策结构是为了让其他程序员更容易理解你的程序。\n3) 在单分支决策结构中包含的语句可能可能一个都不被执行。\n\
  4) 在流程图中，`Decision`（决策）符号代表算法的开始和结束。\n5) 下列代码在语法上是正确的。\n```csharp\nconst int if\
