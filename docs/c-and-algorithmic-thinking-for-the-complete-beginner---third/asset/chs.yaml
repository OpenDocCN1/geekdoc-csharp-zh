  double a, b, c, d;a = Convert.ToDouble(Console.ReadLine());b = Convert.ToDouble(Console.ReadLine());c\
  \ = Convert.ToDouble(Console.ReadLine());if (a > 10) {if (c < 2000) { d = (a + b\
  \ + c) / 12;Console.WriteLine(\"The result is: \" + d); }else { Console.WriteLine(\"\
  Error!\");}}\n```\n\n5) 仅使用单选决策结构重写以下 C# 程序：\n```csharp\ndouble a, b, c, d;a = Convert.ToDouble(Console.ReadLine());b\
  \ = Convert.ToDouble(Console.ReadLine());c = Convert.ToDouble(Console.ReadLine());if\
  \ (a > 10) {if (c < 2000) { d = (a + b + c) / 12;Console.WriteLine(\"The result\
