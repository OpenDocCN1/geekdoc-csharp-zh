  Console.Write(\"Enter a number: \");\nx = Convert.ToDouble(Console.ReadLine());\
  \ // 初始化 x\nwhile (( (int)(x) == x ) { // 依赖于 x 的布尔表达式\n    一条语句或一组语句\n    Console.Write(\"\
  Enter a number: \");\n    x = Convert.ToDouble(Console.ReadLine()); // 更新/修改 x\n\
