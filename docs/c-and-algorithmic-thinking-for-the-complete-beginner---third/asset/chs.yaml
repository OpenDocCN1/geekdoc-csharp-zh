  30) 结构化编程的优势之一是在编写计算机程序时不会出错错误。\n31) 逻辑错误在编译期间被捕获。\n32) 运行时错误在编译期间被捕获。\n33) 语法错误是最难检测的错误。\n\
  34) 一个计算三角形面积但输出错误结果的程序包含逻辑错误。\n35) 当程序不包含输出语句时，它包含语法错误。\n36) 程序必须始终包含注释。\n37) 如果你在程序中添加注释，计算机可以更容易地理解它。\n\
  38) 你不能在语句上方添加注释。\n39) 注释对程序的用户是不可见的。\n40) 如果一个程序可以被新手轻松使用，则它被称为用户友好。\n41) 缩写 `POLA`\
  \ 代表“最小娱乐原则”（Principle of Least Amusement）。\n\n## 4.18 复习题：单选题\n\n为以下每个语句选择正确答案。\n\
