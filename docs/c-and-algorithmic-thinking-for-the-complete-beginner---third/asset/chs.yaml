  \    firstNames[i] = Console.ReadLine();\n    Console.Write(\"Enter last name: \"\
  );\n    lastNames[i] = Console.ReadLine();\n}\n// 获取要搜索的名字并将其转换为大写\nConsole.Write(\"\
  Enter first name to search: \");\nneedle = Console.ReadLine().ToUpper();\n// 在数组\
  \ firstNames 中搜索用户提供的值\nfound = false;\nfor (i = 0; i <= PEOPLE - 1; i++) {\n  \
  \  if (firstNames[i].ToUpper() == needle) {\n        // 转换为大写并比较\n        Console.WriteLine(lastNames[i]);\n\
  \        found = true;\n    }\n}\nif (!found) {\n    Console.WriteLine(\"No one\
  \ found!\");\n}\n```\n\n由于程序处理字母数字数据，因此需要 `ToUpper()` 方法，以便程序能够对任何用户提供的值正确运行。例如，如果值“John”存在于\
  \ `firstNames` 中，而用户想要搜索值“JOHN”，`ToUpper()` 方法确保程序找到所有匹配项。\n\n#### 练习 34.5-3 线性搜索算法\
  \ – 在可能包含多个相同值的二维数组中进行搜索\n\n编写一个代码片段，对二维数组的每一行进行搜索以找到用户提供的值。假设数组包含数值，并可能包含多个相同值。使用线性搜索算法。\n\
  \n**解答**\n\n该代码片段必须在可能包含多个相同值的二维数组的每一行中搜索用户提供的数字。这意味着代码片段必须搜索第一行，并显示所有找到用户提供数字的列；否则，它必须显示一条消息，说明在该行中未找到用户提供的数字。然后，它必须搜索第二行，此过程一直持续到所有行都已检查完毕。\n\
  \n为了更好地理解这个练习，使用了“从内到外”的方法。以下代码片段仅在名为 `haystack` 的二维数组的第一行中搜索给定值（变量 `needle`）。假设变量\
  \ `i` 包含值 0。\n\n```csharp\nfound = false;\nfor (j = 0; j <= COLUMNS - 1; j++) {\n\
