  2) 面向对象编程关注对象。\n3) 对象结合了数据和功能。\n4) 面向对象编程让你更容易地维护代码，但你的代码不能被他人方便使用。\n5) 你可以在不使用类的情况下创建对象。\n\
  6) 创建类的新实例的过程被称为“安装（installation）”。\n7) 在 OOP 中，你总是必须创建至少两个同类的实例。\n8) 构造方法在对象实例化时执行。\n\
  9) 当你创建两个同类的实例时，该类的构造方法方法将执行两次。\n10) 字段前的 `private` 关键字指定该字段可以从类外部访问。\n11) 方法前的\
  \ `public` 关键字指定该方法可以从类外部调用。\n12) 面向对象编程的原则规定，类的数据应该是隐藏的，并防止意外修改。\n13) 属性是类成员，提供了一种灵活的机制来读取、写入或计算字段的值。\n\
  14) 属性暴露了类的内部实现。\n15) 类继承是 OOP 的主要概念之一。\n16) 当一个类被继承时，它被称为“派生类（derived class）”。\n\
  17) 父类会自动继承子类的所有方法和字段。\n\n### 39.9 复习练习\n\n完成以下练习。\n\n1) 执行以下操作：\n   i) 写一个名为 `Geometry`\
