  ## 第 19 章分支结构\n\n### 19.1 分支结构\n\n分支结构是多分支结构的简化版本。对于复杂的算法，它可以帮助更快编写代码并提高可读性。分支结构的基本形式如下：\n\
  \n```csharp\nswitch (变量或要求值的表达式) {\ncase value-1:\n    // 语句或语句块 1\n    break;\n\
  case value-2:\n    // 语句或语句块 2\n    break;\ncase value-3:\n    // 语句或语句块 3\n   \
  \ break;\n...\ncase value-N:\n    // 语句或语句块 N\n    break;\ndefault:\n    // 语句或语句块\
  \ N + 1\n    break;\n}\n```\n\n![](img/notice.jpg)最后一个语句或语句块 `N+1` 是可选的，可以省略（你也需要省略\
  \ `default` 关键字以及相应的 `break` 语句）。\n\n![](img/notice.jpg)为了避免意外结果，请记住在每个 case 末尾包含\
  \ `break` 关键字。如果你省略了它，将会执行两个语句或语句块：省略 `break` 的当前一个，以及下一个。\n\n![](img/notice.jpg)注意在\
  \ C# 中，`switch` 语句仅适用于某些数据类型，如 `bool`、`sbyte`、`byte`、`short`、`ushort`、`int`、`uint`、`long`、`ulong`、`char`\
  \ 或 `string`。\n\n你不总是可以使用分支结构代替多分支结构。在分支结构中，求值的变量或表达式只写一次，这意味着这个相同的变量或表达式在所有 case\
  \ 中都会被求值。而在多分支结构中，每个 case 中求值的变量或表达式可以是不同的。\n\n这里显示了一个使用分支结构的示例。\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ 项目 _19.1\n\n```csharp\nstring name;\nConsole.Write(\"What is your name? \");\n\
  name = Console.ReadLine();\nswitch (name) {\n    case \"John\":\n        Console.WriteLine(\"\
  You are my cousin!\");\n        break;\n    case \"Aphrodite\":\n        Console.WriteLine(\"\
  You are my sister!\");\n        break;\n    case \"Loukia\":\n        Console.WriteLine(\"\
  You are my mom!\");\n        break;\n    default:\n        Console.WriteLine(\"\
  Sorry, I don't know you.\");\n        break;\n}\n```\n\n#### 练习 19.1-1 星期几\n\n编写一个\
  \ C# 程序，提示用户输入一个 1 到 5 之间的整数，然后显示对应的工作日（周一、周二、周三、周四或周五）。如果输入的值无效，必须显示错误消息。\n\n####\
  \ 解决方案\n\n下面展示了解决此练习的流程图。\n\n![Image](img/chapter19-01.png)\n\n对应的 C# 程序可以使用多分支选择结构或\
  \ case 选择结构来编写。让我们尝试两种方法！\n\n##### 第一种方法 – 使用多分支选择结构\n\n![](img/my_exercise_header.png)\
  \ project_19.1-1a\n\n```csharp\nint day;\nConsole.Write(\"Enter an integer between\
  \ 1 and 5: \");\nday = Convert.ToInt32(Console.ReadLine());\nif (day == 1) {\n \
  \   Console.WriteLine(\"Monday\");\n} else if (day == 2) {\n    Console.WriteLine(\"\
  Tuesday\");\n} else if (day == 3) {\n    Console.WriteLine(\"Wednesday\");\n} else\
  \ if (day == 4) {\n    Console.WriteLine(\"Thursday\");\n} else if (day == 5) {\n\
  \    Console.WriteLine(\"Friday\");\n} else {\n    Console.WriteLine(\"Invalid Number\"\
  );\n}\n```\n\n#### 第二种方法 – 使用 case 选择结构\n\n![](img/my_exercise_header.png) project_19.1-1b\n\
  \n```csharp\nint day;\nConsole.Write(\"Enter an integer between 1 and 5: \");\n\
  day = Convert.ToInt32(Console.ReadLine());\nswitch (day) {\n    case 1:\n      \
  \  Console.WriteLine(\"Monday\");\n        break;\n    case 2:\n        Console.WriteLine(\"\
  Tuesday\");\n        break;\n    case 3:\n        Console.WriteLine(\"Wednesday\"\
  );\n        break;\n    case 4:\n        Console.WriteLine(\"Thursday\");\n    \
  \    break;\n    case 5:\n        Console.WriteLine(\"Friday\");\n        break;\n\
  \    default:\n        Console.WriteLine(\"Invalid Number\");\n        break;\n\
  }\n```\n\n![](img/notice.jpg) case 选择结构和多分支选择结构共享同一个流程图。\n\n### 19.2 复习题：判断对错\n\n\
  对以下每个陈述判断对或错。\n\n1) case 选择结构用于扩展备选项的数量。\n2) case 选择结构可以一直代替多分支选择结构。\n3) case 选择结构可以拥有程序员任意任意数量的备选项。\n\
  4) 在 case 选择结构中，最后一个语句或语句块 `N + 1`（出现在 `default` 关键字下方）总是会被执行的。\n5) 在 case 选择结构中，当之前的没有任何\
  \ case 评估为真时，才会执行最后一个语句或语句块 `N + 1`（出现在 `default` 关键字下方）。\n6) 最后一个语句或语句块 `N + 1`\
  \ 以及 `default` 关键字和对应的 `break` 语句是不可省略的。\n7) 在下面的 C# 程序中，语句 `y++` 只有在变量 `a` 包含 1、2\
  \ 或 3 以外的值时才会被执行。\n```csharp\nswitch (a) {\n    case 1:\n        x = x + 5;\n  \
  \      break;\n    case 2:\n        x = x - 2;\n        break;\n    case 3:\n  \
  \      x = x - 9;\n        break;\n    default:\n        x = x + 3;\n        y++;\n\
  \        break;\n}\n```\n\n### 19.3 复习练习\n\n完成以下练习。\n\n1) 创建一个跟踪表，以确定下一个 C# 程序在三种不同执行情况下，每一步中变量的值。\n\
