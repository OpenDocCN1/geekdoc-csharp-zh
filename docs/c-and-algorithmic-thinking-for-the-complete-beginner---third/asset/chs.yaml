  \ salary) : base(name, age) {\n        this.salary = salary;\n        Console.WriteLine(\"\
  A teacher was initialized\");\n    }\n    // This is an additional method for this\
  \ class\n    public void displayValues() {\n        Console.WriteLine(\"Name: \"\
  \ + this.name);\n        Console.WriteLine(\"Age: \" + this.age);\n        Console.WriteLine(\"\
  Salary: \" + this.salary);\n    }\n}\n```\nnotice.jpg) 关键字 `base` 调用了 `SchoolMember`\
