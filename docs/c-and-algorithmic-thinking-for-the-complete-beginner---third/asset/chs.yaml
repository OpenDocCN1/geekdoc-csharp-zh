  \n在下面的解决方案中，程序首先创建一个名为 `vowelsFrequency` 的字典，用于存储和管理每个元音（A, E, I, O, U）的频率，初始频率均设零。对于用户提供的句子每个字符，程序检查它是否为元音，如果是，则更新字典中相应的频率计数。\n\
