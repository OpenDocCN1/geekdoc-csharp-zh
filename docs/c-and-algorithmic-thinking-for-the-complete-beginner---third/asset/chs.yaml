  ##13 章 商与余数的练习\n\n哪些类型的问题需要使用商和余数？可能没有简单的答案，但商和余数可以：\n\n►将数字拆分为单个数字\n►检查整数的奇偶\n\
  ►检查数字是否为另一个数字的倍数\n►将经过的时间（秒）转换为小时、分钟和秒\n►将金额（美元）转换为百元元钞、50 元钞、20 元钞等\n►计算最大公约数\n\
  ►判断数字是否为回文数\n统计数字中的位数\n确定特定数字在数字中出现的次数\n\n当然，这些只是部分用途，你当然可以发现更多。接下来你将看到一些使用整数除法的商和余数的练习。\n\
  \n#### 练习 13.1-1 整数除法的商和余\n\n编写一个 C# 程序，提示用户输入两个整数，然后计算整数除法的商和余数。\n\n### 解决方案\n\n\
  模运算符 `%` 执行整数除法并返回整数余数。由于 C# 实际上并没有整合计算整数商的算术运算符，你可以使用 `(int)` 转换运算符来实现结果。解答所示。\n\
  \n![](img/my_exercise_header.png) project_13.1-1\n```csharp\nint number1, number2,\
  \ q, r;\nConsole.Write(\"Enter first number: \");\nnumber1 = Convert.ToInt32(Console.ReadLine());\n\
  Console.Write(\"Enter second number: \");\nnumber2 = Convert.ToInt32(Console.ReadLine());\n\
  q = (int)(number1 / number2);\nr = number1 % number2;\nConsole.WriteLine(\"Integer\
  \ Quotient: \" + q + \"\\nInteger Remainder: \" + r);\n```\n\n\n\n\n\n![](img/notice.jpg)在\
  \ C# 中，两个整数相除的结果始终是一个整数。因此，在语句 `q = (int)(number1 / number2)` 中，由于变量 `number1` 和\
  \ `number2` 是整数，`(int)` 强制转换符是多余的。然而，为了提高可读性，保留它也是一种良好的做法。\n\n## 练习 13.1-2 计算数字之和\n\
  \n编写一个 C# 程序，提示用户输入一个四位整数，然后计算其各位数字之和。\n\n### 解决方案\n\n在这里你需要记住，像这样的语句：\n\n```csharp\n\
  number = Convert.ToInt32(Console.ReadLine());\n```\n\n是将用户提供的四位整数赋值给单个变量 `number`，而不是四个独立的变量。因此，在用户输入四位整数后，程序必须将该整数拆分为四个数字，并将每个数字赋值给单独的变量。然后，程序就可以计算这四个变量之和并得到所需的结果。有两种方法可以使用。\n\
  \n### 第一种方法\n\n让我们尝试通过算术示例来理解第一种方法。以数字 6753 为例。\n\n| 第一位数字 = 6 | 如果使用 `(/ )` 运算符将用户输入的数字除以\
  \ 1000，并使用 `(int)` 类型转换符获取整数商 `digit1 = (int)(6753 / 1000)`，就可以分离出第一位数字 |\n| 剩余数字\
  \ = 753 | 如果再次将用户输入的数字除以 1000，这次使用 `(%)` 运算符获取整数余数 `r = 6753 % 1000`，就可以分离出剩余数字\
  \ |\n| 第二位数字 = 7 | 如果使用 `(/ )` 运算符将剩余数字除以 100，并使用 `(int)` 类型转换符获取整数商 `digit2 = (int)(753\
  \ / 100)`，就可以分离出第二位数字 |\n| 剩余数字 = 53 | 现在剩余数字为 `r = 753 % 100` |\n| 第三位数字 = 5 |\
  \ 如果使用 `(/ )` 运算符将剩余数字除以 10，并使用 `(int)` 类型转换符获取整数商 `digit3 = (int)(53 / 10)`，就可以分离出第三位数字\
  \ |\n| 第四位数字 = 3 | 最后一个剩余数字（恰好是第四位数字）是 `digit4 = 53 % 10` |\n\n解决该算法的 C# 程序如所示。\n\
  \n![](img/my_exercise_header.png) project_13.1-2a\n\n```csharp\nint digit1, digit2,\
  \ digit3, digit4, number, r, total;\nConsole.Write(\"Enter a four-digit integer:\
  \ \");\nnumber = Convert.ToInt32(Console.ReadLine());\ndigit1 = (int)(number / 1000);\n\
  r = number % 1000;\ndigit2 = (int)(r / 100);\nr = r % 100;\ndigit3 = (int)(r / 10);\n\
  digit4 = r % 10;\ntotal = digit1 + digit2 + digit3 + digit4;\nConsole.WriteLine(total);\n\
  ```\n\n你刚刚看到的程序的追踪表所示。\n\n| 步骤 | 语句 | 注释 | number | digit1 | digit2 | digit3 | digit4\
  \ | r | total |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\
  | 1 | `.Write(\"Enter…` | 显示：Enter a four‑digit integer: | | | | | | | | |\n| 2\
  \ | `number = Convert.ToInt32(…` | 用户输入 6753 | 6753 | ? | ? | ? | ? | ? | ? |\n\
  | 3 | `digit1 = (int)(number / 1000)` | | 6753 | 6 | ? | ? | ? | ? | ? |\n| 4 |\
  \ `r = number % 1000` | | 6753 | 6 | ? | ? | ? | 753 | ? |\n| 5 | `digit2 = (int)(r\
  \ / 100)` | | 6753 | 6 | 7 | ? | ? | 753 | ? |\n| 6 | `r = r % 100` | | 6753 | 6\
  \ | 7 | ? | ? | 53 | ? |\n| 7 | `digit3 = (int)(r / 10)` | | 6753 | 6 | 7 | 5 |\
  \ ? | 53 | ? |\n| 8 | `digit4 = r % 10` | | 6753 | 6 | 7 | 5 | 3 | 53 | ? |\n| 9\
  \ | `total = digit1 + digit2 + digit3 + digit4` | | 6753 | 6 | 7 | 5 | 3 | 53 |\
  \ 21 |\n| 10 | `.WriteLine(total)` | 显示：21 | | | | | | | | | |\n\n为了进一步帮助你，下面提供一个通用的\
  \ C# 程序，可用于拆分任何给定的整数。由于程序的长度取决于数字个数 `N`，你只需要编写 `N-1` 组语句。\n\n```csharp\nConsole.Write(\"\
  Enter an N-digit integer: \");\nnumber = Convert.ToInt32(Console.ReadLine());\n\
  digit1 = (int)(number / 10^(N-1));\nr = number % 10^(N-1);\ndigit2 = (int)(r / 10^(N-2));\n\
  r = r % 10^(N-2);\n...\ndigit(N-2) = (int)(r / 100);\nr = r % 100;\ndigit(N-1) =\
  \ (int)(r / 10);\ndigit(N) = r % 10;\n```\n\n例如，如果你想拆分一个六位整数，需要像下面的程序所示编写五组语句。\n\
  \n![](img/my_exercise_header.png) project_13.1-2b\n\n```csharp\nint digit1, digit2,\
  \ digit3, digit4, digit5, digit6, number, r;\nConsole.Write(\"Enter a six-digit\
  \ integer: \");\nnumber = Convert.ToInt32(Console.ReadLine());\ndigit1 = (int)(number\
  \ / 100000);\nr = number % 100000;\ndigit2 = (int)(r / 10000);\nr = r % 10000;\n\
  digit3 = (int)(r / 1000);\nr = r % 1000;\ndigit4 = (int)(r / 100);\nr = r % 100;\n\
  digit5 = (int)(r / 10);\ndigit6 = r % 10;\nConsole.Write(digit1 + \"  \" + digit2\
  \ + \"  \" + digit3 + \"  \" + digit4 + \"  \" + digit5 + \"  \" + digit6);\n```\n\
  \n### 第二种方法\n\n对于一个四位整数，第一种方法执行三次除法——先除以 1000，然后除以 100，最后除以 10——从左到右分离数字。相反，这种第二种方法中的三次除法都是从右到左，分离数字。再次深入研究这种方法，让我们使用一个算术示例。考虑相同的用户输入：6753。\n\
  \n| 第四位数字 = 3 | 如果使用 `(%)` 运算符将用户输入的数字除以 10，获取整数余数 `digit4 = 6753 % 10`，就可以分离出第四位数字\
  \ |\n| 剩余数字 = 675 | 如果再次使用 `(/ )` 运算符将用户输入的数字除以 10，并使用 `(int)` 类型转换符获取整数商 `r = (int)(6753\
  \ / 10)`，就可以分离出剩余数字 |\n| 第三位数字 = 5 | 如果使用 `(%)` 运算符将剩余数字除以 10，获取整数余数 `digit3 = 675\
  \ % 10`，就可以分离出第三位数字 |\n| 剩余数字 = 67 | 现在剩余数字为 `r = (int)(675 / 10)` |\n| 第二位数字 =\
  \ 7 | 如果使用 `(%)` 运算符将剩余数字除以 10，获取整数余数 `digit2 = 67 % 10`，就可以分离出第二位数字 |\n| 第一位数字\
  \ = 6 | 最后一个剩余数字（恰好是第一位数字）是 `digit1 = (int)(67 / 10)` |\n\n该算法的 C# 程序如所示。\n\n![](img/my_exercise_header.png)\
  \ project_13.1-2c\n\n```csharp\nint digit1, digit2, digit3, digit4, number, r, total;\n\
  Console.Write(\"Enter a four-digit integer: \");\nnumber = Convert.ToInt32(Console.ReadLine());\n\
  digit4 = number % 10;\nr = (int)(number / 10);\ndigit3 = r % 10;\nr = (int)(r /\
  \ 10);\ndigit2 = r % 10;\ndigit1 = (int)(r / 10);\ntotal = digit1 + digit2 + digit3\
  \ + digit4;\nConsole.WriteLine(total);\n```\n\n为了进一步帮助你，下面提供一个通用的 C# 程序，可用于拆分任何给定的整数。该程序使用了第二种方法。再次，由于程序的长度取决于数字个数\
  \ `N`，你只需要编写 `N-1` 组语句。\n\n```csharp\nConsole.Write(\"Enter a N-digit integer: \"\
  );\nnumber = Convert.ToInt32(Console.ReadLine());\ndigit(N) = number % 10;\nr =\
  \ (int)(number / 10);\ndigit(N-1) = r % 10;\nr = (int)(r / 10);\n...\ndigit3 = r\
  \ % 10;\nr = (int)(r / 10);\ndigit2 = r % 10;\ndigit1 = (int)(r / 10);\n```\n\n\
  例如，如果你想拆分一个五位整数，必须像下面的程序所示使用四组语句。\n\n![](img/my_exercise_header.png) project_13.1-2d\n\
  \n```csharp\nint digit1, digit2, digit3, digit4, digit5, number, r;\nConsole.Write(\"\
  Enter a five-digit integer: \");\nnumber = Convert.ToInt32(Console.ReadLine());\n\
  digit5 = number % 10;\nr = (int)(number / 10);\ndigit4 = r % 10;\nr = (int)(r /\
  \ 10);\ndigit3 = r % 10;\nr = (int)(r / 10);\ndigit2 = r % 10;\ndigit1 = (int)(r\
  \ / 10);\nConsole.WriteLine(digit1 + \"  \" + digit2 + \"  \" + digit3 + \"  \"\
  \ + digit4 + \"  \" + digit5);\n```\n\n#### 练习 13.1-3 显示流逝时间\n\n编写一个 C# 程序，提示用户输入一个代表流逝时间的整数，然后以“DD\
  \ day(s) HH hour(s) MM minute(s) and SS second(s)”的格式显示。例如，如果用户输入 700005，则必须显示“8\
  \ day(s) 2 hour(s) 26 minute(s) and 45 second(s)”。\n\n解决方案\n\n\n\n\n正如你可能知道的，一分钟有\
  \ 60 秒，一小时有 3600 秒（60 × 60 一天有 86400 秒（3600 × 24）。让我们尝试使用你在上一个练习中学会的第一种方法分析数字 700005。\n\
  \n| 天数 = 8 | 使用 `/` 运算符将用户提供的整数除以 86400，并使用 `(int)` 类型转换运算符，可以得到整数商 `days = (int)(700005\
  \ / 86400)` |\n| 剩余秒数 = 8805 | 再次将用户提供的整数除以 86400，这次使用 `%` 运算符得到整数余数 `r = 700005\
  \ % 86400` |\n| 小时 = 2 | 使用 `/` 运算符将剩余秒数除以 3600，并使用 `(int)` 类型转换运算符，可以得到整数商 `hours\
  \ = (int)(8805 / 3600)` |\n| 剩余秒数 = 1605 | 此时剩余秒数是 `r = 8805 % 3600` |\n| 分钟 = 26\
  \ | 使用 `/` 运算符将剩余秒数除以 60，并使用 `(int)` 类型转换运算符，可以得到整数商 `minutes = (int)(1605 / 60)`\
  \ |\n| 秒 = 45 | 最后剩下的余数（恰好是剩余秒数）是 `seconds = 1605 % 60` |\n\n该算法的 C# 程序如下。\n\n![](img/my_exercise_header.png)\n\
  \n```csharp\nint days, hours, minutes, number, r, seconds;\nConsole.Write(\"Enter\
  \ a period of time in seconds: \");\nnumber = Convert.ToInt32(Console.ReadLine());\n\
  days = (int)(number / 86400);    // 60 * 60 * 24 = 86400\nr = number % 86400;\n\
  hours = (int)(r / 3600);         // 60 * 60 = 3600\nr = r % 3600;\nminutes = (int)(r\
  \ / 60);\nseconds = r % 60;\nConsole.WriteLine(days + \" day(s) \" + hours + \"\
  \ hour(s) \");\nConsole.WriteLine(minutes + \" minute(s) and \" + seconds + \" second(s)\"\
  );\n```\n\n你也可以使用上一个练习中的第二种方法来解决这个练习。你只需要先除以 60，再次除以 60，最后除以 24，如下所示。\n\n![](img/my_exercise_header.png)\n\
  \n```csharp\nint days, hours, minutes, number, r, seconds;\nConsole.Write(\"Enter\
  \ a period of time in seconds: \");\nnumber = Convert.ToInt32(Console.ReadLine());\n\
  seconds = number % 60;\nr = (int)(number / 60);\nminutes = r % 60;\nr = (int)(r\
  \ / 60);\nhours = r % 24;\ndays = (int)(r / 24);\nConsole.WriteLine(days + \" day(s)\
  \ \" + hours + \" hour(s) \");\nConsole.WriteLine(minutes + \" minute(s) and \"\
  \ + seconds + \" second(s)\");\n```\n\n### 练习 13.1-4 数字反转\n\n编写一个 C# 程序，提示用户输入一个三位整数，然后构建并显示其反转数字。例如，如果用户输入数字\
  \ 875，程序必须显示 578。\n\n### 答案\n\n要分离出用户提供的整数的三个数字，你可以使用第一种或第二种方法。之后，这个练习中唯一的困难在于构建反转数字。\n\
  \n以数字 875 为例。分离后的三个位数字将是：\n\n`digit1 = 8`\n`digit2 = 7`\n`digit3 = 5`\n\n然后你可以通过简单计算乘积之和来构建反转数字：\n\
  \n`digit3 × 100 + digit2 × 10 + digit1 × 1 = 5 × 100 + 7 × 10 + 8 × 1 = 578`\n\n\
  为了换一种方式，让我们使用第二种方法拆分用户提供的数字。C# 程序将如下。\n\n![](img/my_exercise_header.png)\n\n```csharp\n\
  int digit1, digit2, digit3, number, r, reversedNumber;\nConsole.Write(\"Enter a\
  \ three-digit integer: \");\nnumber = Convert.ToInt32(Console.ReadLine());\ndigit3\
  \ = number % 10;      //这是最右侧的数字\nr = (int)(number / 10);\ndigit2 = r % 10;    \
  \       //这是中间的数字\ndigit1 = (int)(r / 10);    //这是最左侧的数字\nreversedNumber = digit3\
  \ * 100 + digit2 * 10 + digit1;\nConsole.WriteLine(reversedNumber);\n```\n\n###\
  \ 13.2 复习题\n\n完成以下：\n\n1. 编写一个 C# 程序，提示用户输入一个整数并显示其最后一位。提示：使用取模。\n2. 编写一个 C# 程序，提示用户输入一个整数，然后找到它的反转。例如，如果用户输入\
  \ 3265，程序必须显示 5623。\n3. 编写一个 C# 程序，提示用户输入一个整数，如果是奇数则显示 1，否则显示 0。\n4. 编写一个 C# 程序，提示用户输入一个整数，如果是偶数则显示\
  \ 1，否则显示 0。\n5. 编写一个 C# 程序，提示用户输入一个以秒为单位的时间，然后以“天 小 分 秒”的格式显示。例如，如果用户输入 200000，显示信息“2\
  \ days 3 hours 46 minutes 40 seconds”。\n6. ATM 机内有 20 元、10 元和 5 元的钞票。编写一个 C# 程序，提示用户输入要取的金额，然后显示\
  \ ATM 提供的最少钞票数量。例如，如果用户输入 76，程序必须显示“3 张 20 元，1 张 10 元和 1 张 5 元”。\n7. 一个机器人到达月球进行某些实验。机器人每一步长长\
  \ 5 英寸。编写一个 C# 程序，提示用户输入机器人走的步数，然后计算以英里、英尺和英寸为单位的距离。例如，如果旅行距离为 100000 英寸，程序必须显示“1\
  \ mile, 27 yards, 4 inches”。\n\n\n\n让我们在下面的示例中使用字符串“Hello World”。该字符串包含 11 个字符（包括两个单词之间的空格字符）。C#\
  \ 对字符进行计数时，假设第一个字符位于位置 0，第二个字符位于位置 1，以此此类推。每个字符的位置在此所示。\n\n![Image](img/chapter14-02.png)\n\
  \n![](img/remember.jpg)空格和任何其他字符一样，也是一个字符。仅仅因为没有人能看到它，并不意味着它不存在！\n\n## 14.3 有用的字符串方法（子程序）及其他方法\n\
  \n### 修剪 (Trimming)\n\n修剪是从字符串的开头或末尾移除空白字符的过程。\n\n在修剪过程中移除的某些空白字符包括：\n\n►普通空格►制表符►换行符（行进符）►回车符\n\
  \n例如，你可以修剪用户误输入的在字符串末尾或开头的任何空格。\n\n你可以用于修剪字符串的方法是：\n\n`subject.Trim()`\n\n此方法返回\
  \ `subject` 的副本，其中 `subject` 字符串开头和结尾的所有空白字符都已移除。\n\n示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3\n```sharp\nstring a, b;\na = \" Hello\";\nb = a.Trim();\nConsole.WriteLine(b\
  \ + \" Poseidon!\"); //显示：Hello Poseidon!\nConsole.WriteLine(a + \" Poseidon!\"\
  ); //显示：   Hello      Poseidon!\n```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被改变。如果你确实需要更改它的内容，可以使用语句\
  \ `a = a.Trim();`\n\n### 字符串替换 (String replacement)\n\n`subject.Replace(search,\
  \ replace)`\n\n此方法在 `subject` 中搜索，并返回其副本，其中 `search` 字符串的所有出现处都被替换为 `replace` 字符串。\n\
  \n示例\n\n![](img/my_exercise_header.png) project_14.3\n```sharp\nstring a, b;\na\
  \ = \"I am newbie in C++. C++ rocks!\";\nb = a.Replace(\"C++\", \"C#\");\nConsole.WriteLine(b);\
  \    //显示：I am newbie in C#. C# rocks\nConsole.WriteLine(a);    //显示：I am newbie\
  \ in C++. C++ rocks\n```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被改变。如果你确实需要更改它的内容，可以使用语句\
  \ `a = a.Replace(\"C++\", \"C#\");`\n\n#### 计算字符数 (Counting the number of characters)\n\
  \n`subject.Length`\n\n这包含 `subject` 的长度，换句话说，就是 `subject` 组成的字符数量。\n\n示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3\n```sharp\nstring a;\nint k;\na = \"Hello Olympians!\";\nConsole.WriteLine(a.Length);\
  \                    //显示：16\nk = a.Length;\nConsole.WriteLine(k);             \
  \              //显示：16\nConsole.WriteLine(\"I am newbie in C#\".Length);  //显示：17\n\
  ```\n\n![](img/remember.jpg)字符包括你可以使用键盘输入的任何内容，如字母、符号、数字和空格字符。\n\n![](img/notice.jpg)注意\
  \ `Length` 是一个属性（属性），而不是一个方法。因此，你不能在结尾加上括号。你将在第八部分中学习更多关于属性的内容。\n\n### 查找字符串位置 (Finding\
  \ string position)\n\n`subject.IndexOf(search)`\n\n此方法返回 `search` 在 `subject` 中第一次出现的数值位置，如果未找到\
  \ `search` 则返回 -1。\n\n示例\n\n![](img/my_exercise_header.png) project_14.3\n```sharp\n\
  int i;\nstring a;\na = \"I am newbie in C#. C# rocks!\";\ni = a.IndexOf(\"newbie\"\
  );\nConsole.WriteLine(i);                   //显示：5\nConsole.WriteLine(a.IndexOf(\"\
  C#\"));     //显示：15\nConsole.WriteLine(a.IndexOf(\"C++\"));    //显示：-1\n```\n\n\
  ![](img/remember.jpg)第一个字符位于位置 0。\n\n### 转换为小写 (Converting to lowercase)\n\n`subject.ToLower()`\n\
  \n此方法返回 `subject` 的副本，其中 `subject` 字符串的所有字母都已转换为小写。\n\n示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3\n```sharp\nstring a, b;\na = \"My NaMe is JohN\";\nb = a.ToLower();\n\
  Console.WriteLine(b);    //显示：my name is john\nConsole.WriteLine(a);    //显示：My\
  \ NaMe is JohN\n```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被改变。如果你确实需要更改它的内容，可以使用语句\
  \ `a = a.ToLower();`\n\n### 转换为大写 (Converting to uppercase)\n\n`subject.ToUpper()`\n\
  \n此方法返回 `subject` 的副本，其中 `subject` 字符串的所有字母都已转换为大写。\n\n示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3\n```sharp\nstring a, b;\na = \"My NaMe is JohN\";\nb = a.ToUpper();\n\
  Console.WriteLine(b);    //显示：MY NAME IS JOHN\nConsole.WriteLine(a);    //显示：My\
  \ NaMe is JohN\n```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被改变。如果你确实需要更改它的内容，可以使用语句\
  \ `a = a.ToUpper();`\n\n### 从字符串中获取单个字符 (Retrieving an individual character from\
  \ string)\n\n`subject[index]`\n\n此符号返回位于指定索引处的字符。如前所述，字符串索引从零开始。你可以使用索引 0 访问第一个字符，使用索引\
  \ 1 访问第二个字符，以此此类推。最后一个字符是字符串长度减一。\n\n示例\n\n![](img/my_exercise_header.png) project_14.3\n\
  ```sharp\nstring a;\na = \"Hello World\";\nConsole.WriteLine(a[0]); //显示：H\nConsole.WriteLine(a[6]);\
  \ //显示：W\nConsole.WriteLine(a[10]); //显示：d\n```\n\n![](img/notice.jpg)注意“Hello”和“World”之间的空格被视为一个字符。因此，字母\
  \ W 位于位置 6。如果你尝试使用无效索引（例如负索引或大于字符串长度的索引），C# 将抛出如图 14–1 所示的错误消息。\n\n![Image](img/chapter14-03.png)\n\
  \n图 14–1 无效索引\n\n![](img/remember.jpg)字符串索引必须在 0 到长度减一之间。\n\n### 获取字符串部分 (Getting\
  \ part of a string)\n\n`subject.Substring(beginIndex [, length])`\n\n此方法返回 `subject`\
  \ 的部分。具体而言，它从 `beginIndex` 开始返回 `length` 个字符。`length` 是可选的。如果省略它，则返回从 `beginIndex`\
  \ 开始到字符串末部的子字符串。\n\n示例\n\n![](img/my_exercise_header.png) project_14.3\n```sharp\n\
  string a;\na = \"Hello Athena\";\nConsole.WriteLine(a.Substring(6, 3)); //显示：Ath\n\
  Console.WriteLine(a.Substring(7));    //显示：then\n```\n\n### 比较字符串 (Comparing strings)\n\
  \n`subject.CompareTo(str)`\n\n当 `subject` 字典序等于 `str` 时，此方法返回 0；当 `subject` 字典序小于\
  \ `str` 时返回小于 0 的值；当 `subject` 字典序大于 `str` 时返回大于 0 的值。\n\n“字典序”意味着字母“A”被认为小于字母“B”，“B”被认为小于字母“C”，以此此类推。当然，如果两个字符串包含第一个字母相同的单词，C#\
  \ 将继续比较它们的第二个字母（如果有必要的话）。例如，单词“backspace”被认为小于单词“backwards”，因为第五个字母“s”小于第五个字母“w”。\n\
  \n示例\n\n![](img/my_exercise_header.png) project_14.3\n```sharp\nstring a = \"backspace\"\
  ;\nstring b = \"backwards\";\nstring c = \"Backspace\";\nstring d = \"winter\";\n\
  string e = \"winter\";\nConsole.WriteLine(a.CompareTo(b)); //显示：-1\nConsole.WriteLine(a.CompareTo(c));\
  \ //显示：-1\nConsole.WriteLine(d.CompareTo(a)); //显示：1\nConsole.WriteLine(d.CompareTo(e));\
  \ //显示：0\n```\n\n![](img/notice.jpg)注意字母“b”和“B”被认为是两个不同的字母。\n\n![](img/notice.jpg)在英语字典中组织单词的语境下考虑“字典序”。\n\
  \n### 将数字或字符转换为字符串 (Converting a number or a character to a string)\n\n`subject.ToString()`\n\
  \n此方法返回 `subject` 的字符串版本，换句话说，它将数字（实数或整数）或字符转换为字符串。\n\n示例\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ project_14.3\n```csharp\nstring a;\nchar b;\nint c, d;\nb = 'W';\na = b.ToString();\
  \ //将字符 W 赋值字符串变量 a\nConsole.WriteLine(a); // 输出: W\nc = 12;\nd = 34;\nConsole.WriteLine(c\
  \ + d); // 输出: 46\nConsole.WriteLine(c.ToString() + d.ToString()); // 输出: 1234\n\
  ```\n\n然而，在 C# 中，如果序列以字符串（即使是空字符串）开始，也可以实现相同的结果，如下例所示。\n\n![](img/my_exercise_header.png)\
  \ project_14.3k\n```csharp\nstring a;\nchar b;\nint c, d;\nb = 'W';\na = \"\" +\
  \ b; //将字符 W 赋值字符串变量 a\nConsole.WriteLine(a); // 输出: W\nc = 12;\nd = 34;\nConsole.WriteLine(c\
  \ + d); // 输出: 46\nConsole.WriteLine(\"\" + c + d); // 输出: 1234\nConsole.WriteLine(\"\
  Result - \" + c + d); // 输出: Result - 1234\n```\n\n### 练习 14.3-1 反序显示字符串\n\n编写一个\
  \ C# 程序，提示用户输入任何包含四个字母的字符串，然后反序显示其内容。例如，如果输入的字符串是“Zeus”，则程序必须显示“sueZ”。\n\n#### 解决方案\n\
  \n假设用户的输入赋值给变量 `s`。你可以通过 `s[3]` 获取第四个字符，通过 `s[2]` 获取第三个字符，依此类推。\n\n这里是该 C# 程序。使用字符串连接运算符（`+`）来重新组合最终的反转后的字符串。\n\
  \n![](img/my_exercise_header.png) project_14.3-1\n```csharp\nstring s, sReversed;\n\
  Console.Write(\"Enter a word with four letters: \");\ns = Console.ReadLine();\n\
  sReversed = \"\" + s[3] + s[2] + s[1] + s[0];\nConsole.WriteLine(sReversed);\n```\n\
  \n![](img/notice.jpg)在 C# 中，有时有通过通过字符串（即使是空字符串）开始序列，来强制编译器执行连接操作而不是普通的加法。\n\n###\
  \ 练习 14.3-2 交换姓名的顺序\n\n编写一个 C# 程序，提示用户在一个单一字符串中输入名和姓。最后，程序必须交换这两个名字的顺序。\n\n####\
  \ 解决方案\n\n这个练习与你在练习 8.1-3 和 8.1-4 中学习的练习不同，后两个练习是交换两个变量的数值值。在本次练习中，名和姓都输入在一个单一字符串中，因此程序必须做的第一件事是拆分字符串并将每个名字赋值给不同的变量。如果你能做到这一点，就可以以不同的顺序将它们重新连接。\n\
  \n让我们用一个例子来尝试理解这个练习。这里显示了你必须拆分的字符串及其每个单独字符的位置。\n\n![Image](img/chapter14-04.png)\n\
  \n在视觉上分隔名和姓的字符是它们之间的空格字符。这里的问题是，这个字符并不总是位于位置 `3`。有些人的名字很短，比如“Tom”，而另一些人的名字较长，比如“Robert”。因此，你需要一种实际上无论字符串内容如何都能找到空格字符位置的工具。\n\
  \n`IndexOf()` 方法正是你所寻找的！如果你用它来查找字符串“Tom Smith”中空格字符的位置，它返回值 `3`。但如果你用它来查找另一个字符串（例如“Angelina\
  \ Brown”）中的空格字符，它返回的是值 `8`。\n\n![](img/notice.jpg)值 `3` 不仅仅是空格字符存在的位置。它还代表了单词“Tom”包含的字符数！这对于为字符串“Angelina\
  \ Brown”返回的值 `8` 也是如此。它既代表了空格字符存在的位置，也代表了单词“Angelina”包含的字符数！\n\n这里是该算法的 C# 程序。\n\
  \n![](img/my_exercise_header.png) project_14.3-2\n```csharp\nstring fullName, name1,\
  \ name2;\nint spacePos;\nConsole.Write(\"Enter your full name: \");\nfullName =\
  \ Console.ReadLine();\n// 找到空格字符的位置。这也是名字包含的\n// 字符数\nspacePos = fullName.IndexOf(\"\
  \ \");\n// 获取从位置 0 开始的 spacePos 个字符\nname1 = fullName.Substring(0, spacePos);\n\
  // 获取从位置 spacePos + 1 开始的剩余字符\nname2 = fullName.Substring(spacePos + 1);\nfullName\
  \ = name2 + \" \" + name1;\nConsole.WriteLine(fullName);\n```\n\n![](img/remember.jpg)`subject.Substring(beginIndex,\
  \ length)` 方法返回 `subject` 的一部分。具体而言，它从位置 `beginIndex` 开始并返回一个长度为 `length` 的子字符串。\n\
  \n![](img/notice.jpg)注意，此程序不能应用于西班牙名字，例如“Maria Teresa García Ramírez de Arroyo”。原因显而易见！\n\
  \n### 练习 14.3-3 创建登录 ID\n\n编写一个 C# 程序，提示用户输入姓氏，然后从姓名的前四个字母（小写）创建一个登录 ID。\n\n####\
  \ 解决方案\n\n要创建一个随机整数，你可以使用 `Next()`。由于你需要一个三位的随机整数，范围在 100 到 999 之间。\n\n这里是该算法的 C#\
  \ 程序。\n\n![](img/my_exercise_header.png) project_14.3-3\n```csharp\nint randomInt;\n\
  string lastName, loginID;\nRandom rnd = new();\nConsole.Write(\"Enter last name:\
  \ \");\nlastName = Console.ReadLine();\n// 获取 100 到 999 之间的随机整数\nrandomInt = rnd.Next(100,\
  \ 1000);\nloginID = lastName.Substring(0, 4).ToLower() + randomInt;\nConsole.WriteLine(loginID);\n\
  ```\n\n![](img/notice.jpg)注意 `Substring()` 如何链式调用 `ToLower()`。第一个方法的的结果作为第二个方法的输入。这是大多数程序员喜欢的编写风格，有助于节省代码。\n\
  \n### 练习 14.3-4 创建随机单词\n\n编写一个 C# 程序，显示由三个字母组成的随机单词。\n\n#### 解决方案\n\n为了创建一个随机单词，你需要一个包含字母表所有\
  \ 26 个字母的字符串。然后你可以使用 `Next()` 方法在位置 0 到 25 之间选择一个字母。\n\n这里是该算法的 C# 程序。\n\n![](img/my_exercise_header.png)\
  \ project_14.3-4\n```csharp\nstring alphabet, randomWord;\nRandom rnd = new();\n\
  alphabet = \"abcdefghijklmnopqrstuvwxyz\";\nrandomWord = \"\" + alphabet[rnd.Next(0,\
  \ 26)] +\nalphabet[rnd.Next(0, 26)] +\nalphabet[rnd.Next(0, 26)];\nConsole.WriteLine(randomWord);\n\
  ```\n\n![](img/notice.jpg)注意 `Next(0, 26)` 被调用了三次，每次都会返回不同的随机数。\n\n![](img/remember.jpg)在\
  \ C# 中，有时有通过字符串（即使是空字符串）开始序列，来强制编译器执行连接操作而不是普通的加法。\n\n你也可以使用 `Length` 属性获取字符串 `alphabet`\
  \ 的长度，如下所示。\n\n![](img/my_exercise_header.png) project_14.3-4b\n```csharp\nstring\
  \ alphabet, randomWord;\nRandom rnd = new();\nalphabet = \"abcdefghijklmnopqrstuvwxyz\"\
  ;\nrandomWord = \"\" + alphabet[rnd.Next(0, alphabet.Length)] +\nalphabet[rnd.Next(0,\
  \ alphabet.Length)] +\nalphabet[rnd.Next(0, alphabet.Length)];\nConsole.WriteLine(randomWord);\n\
  ```\n\n### 练习 14.3-5 计算数字之和\n\n编写一个 C# 程序，提示用户输入一个三位整数，然后计算其数字之和。解决此练习时不要使用整数取模运算符（%%）。\n\
  \n#### 解决方案\n\n现在你可能疑惑，为什么这个练习被放在这一章，而这一章主要关注字符串操作。你可能会认为，你已经知道如何将一个三位整数拆分为三个数字并将每个数字赋值给单独的变量，正如你在第\
  \ 13 章中使用除法运算符（ / ）和整数取模运算符（ % ）学习过的那样。那么，为什么在这里再次讨论这个练习呢？\n\n\n\n\n原因是 `C#` 是一种非常强大的语言，你可以利用它的魔法力量以完全不同的方式来解决这个练习。主要思想是将用户提供的整数转换为字符串类型，并将每个数字（每个字符）赋值给单独变量。\n\
  \n![](img/my_exercise_header.png) `project_14.3-5`\n\n```csharp\nint number, total;\n\
  string sNumber, digit1, digit2, digit3;\nConsole.Write(\"Enter an three-digit integer:\
  \ \");\nnumber = Convert.ToInt32(Console.ReadLine());\nsNumber = \"\" + number;\
  \  //将数字转换为字符串\ndigit1 = \"\" + sNumber[0];  //将位置 0 的字符转换为字符串\ndigit2 = \"\" +\
  \ sNumber[1];  //将位置 1 的字符转换为字符串\ndigit3 = \"\" + sNumber[2];  //将位置 2 的字符转换为字符串\n\
  total = Convert.ToInt32(digit1) + Convert.ToInt32(digit2) + Convert.ToInt32(digit3);\n\
  Console.WriteLine(total);\n```\n\n![](img/notice.jpg)由于变量 `digit1`、`digit2` 和 `digit3`\
  \ 的类型为 `string`，因此在变量 `total` 中找到它们的和之前，你需要使用 `ToInt32()` 方法将它们转换为整数。\n\n### 14.4\
