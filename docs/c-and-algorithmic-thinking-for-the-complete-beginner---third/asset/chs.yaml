  \ `DoingMath` 的类，其中包含：\na) 一个名为 `square` 的私有 void 方法，通过其形式参数列表接收一个数字，然后计算其平方并显示消息“The\
  \ square of XX is YY”，其中 XX 和 YY 必须替换为实际值。\nb) 一个名为 `squareRoot` 的私有 void 方法，通过其形式参数列表接收一个数字，然后计算其平方根并显示消息“The\
  \ square root of XX is YY”，其中 XX 和 YY 必须替换为实际值。但如果数字小于零，方法必须显示错误消息。\nc) 一个名为 `displayResults`\
  \ 的公共 void 方法，通过其形式参数列表接收一个数字，然后调用 `square()` 和 `squareRoot()` 方法来显示结果。\nii) 使用上述类编写一个\
  \ C# 程序，提示用户输入一个数字。程序程序必须显示该数字的平方和平方根。\n\n### 答案\n\n这个练习非常简单。`square()`、`squareRoot()`\
  \ 和 `displayResults()` 方法必须在它们的形式参数列表中包含一个形式参数，以便接收传递的值。解决方案如下。\n\n![](img/my_exercise_header.png)\
