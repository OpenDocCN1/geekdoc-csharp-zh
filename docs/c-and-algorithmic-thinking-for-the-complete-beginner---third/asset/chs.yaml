  \ x accepts passed value\n        this.square(x);\n        this.squareRoot(x);\n\
  \    }\n}\n```\n\n### 39.7 类继承\n\n类继承是面向对象编程（OOP）的核心概念之一。它允许你使用另一个类作为基类来编写一个类。当一个类基于另一个类时，程序员会说“它继承了另一个类”。被继承的类被称为父类、基类或超类。执行继承的类被称为子类、派生类或从属类。\n\
  \n子类会自动继承父类的所有方法和字段。然而，最棒的部分是你可以为子类添加额外的特征（方法或字段）。因此，当你需要编写几个共享许多共同特征但并不完全相同的类时，你就可以使用继承。要实现这一点，你可以按照以下方式操作：首先，你编写一个包含所有共同特征的父类。接下来，你编写子类，从父类继承所有这些共同特征。最后，你为每个子类添加任何额外的、独特的特征。就像人类一样，正是这些额外的且独特的特征使得子类区别于其父类，对吧？\n\
  \n假设你想编写一个程序来跟踪学校里的老师和学生。他们有一些共同的特征，例如姓名和年龄，但他们也有特定的特征，例如老师的薪水和学生的最终成绩，这些特征是不共有的。你在这里可以做的是编写一个名为\
  \ `SchoolMember` 的父类，包含老师和学生共有的所有特征。然后你可以编写两个名为 `Teacher` 和 `Student` 的子类，一个用于老师，一个用于学生。两个子类都可以继承\
  \ `SchoolMember` 类，但必须分别在子类 `Teacher` 和 `Student` 中添加名为 `salary` 和 `finalGrade`\
  \ 的额外字段。\n\n父类 `SchoolMember` 显示如下：\n\n```csharp\nclass SchoolMember {\n    public\
  \ string name;\n    public int age;\n    // Define the constructor\n    public SchoolMember(string\
  \ name, int age) {\n        this.name = name;\n        this.age = age;\n       \
  \ Console.WriteLine(\"A school member was initialized\");\n    }\n}\n```\n\n如果你想一个类继承\
  \ `SchoolMember` 类，它必须定义如下：\n\n```csharp\nclass Name : SchoolMember {\n    // Define\
  \ additional fields for this class\n    // Define the constructor\n    public Name(string\
  \ name, int age, [, …]) : base(name, age) {\n        // Additional statement or\
  \ block of statements\n    }\n    // Define additional methods and/or properties\n\
  }\n```\n\n其中 `Name` 是子类的名称。因此，`Teacher` 类可以如下：\n\n```csharp\nclass Teacher : SchoolMember\
  \ {\n    public double salary;\n    // This is an additional field for this class\n\
