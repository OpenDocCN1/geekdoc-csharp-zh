  \n### 34.5 在数据结构中搜索元素\n\n在计算机科学中，搜索算法是在一组数据中搜索具有特定特征的项的算法。对于数据结构来说，搜索算法通过搜索数据结构来找到与给定值相元素（或元素）。\n\
  \n在数据结构中进行搜索时，有两种情况：\n\n- 你想在一个可能包含多个相同值的数据结构中搜索给定值。因此，你需要找到所有与该给定值相同的元素（或其对应的索引）。\n\
  - 你在一个每个值都是唯一的的数据结构中搜索给定值。因此，你只需要找到一个与给定值相同的元素（或其对应的索引），然后停止后续搜索！\n\n最常用的搜索算法是：\n\
  \n- 线性搜索（或顺序搜索）算法\n- 二分搜索算法\n\n线性搜索和二分搜索算法各有利优缺点。\n\n#### 练习 34.5-1 线性搜索算法 – 在可能包含多个相同值的一维数组中进行搜索\n\
  \n编写一个代码片段，对一维数组进行搜索以找到用户提供的值。假设数组包含数值，并可能包含多个相同值。使用线性搜索算法。\n\n**解答**\n\n线性（或顺序）搜索算法检查数组的第一个元素是否与给定值相等，然后检查第二个元素、第三个元素，以此此类推，直到数组末尾。由于这种逐个检查元素的过程非常缓慢，因此线性搜索算法适用于元素较少的数组。接下来的代码片段所示。它在数组\
  \ `haystack` 中查找用户提供的值 `needle`。\n\n```csharp\nConsole.Write(\"Enter a value to\
  \ search: \");\nneedle = Convert.ToDouble(Console.ReadLine());\nfound = false;\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i] == needle) {\n      \
  \  Console.WriteLine(needle + \" found at position: \" + i);\n        found = true;\n\
  \    }\n}\nif (!found) {\n    Console.WriteLine(\"Nothing found!\");\n}\n```\n\n\
  #### 练习 34.5-2 显示所有具有相同名字的姓\n\n编写一个 C# 程序，提示用户输入 20 个人的名字：将他们的名字输入数组 `firstNames`，将他们的姓输入数组\
  \ `lastNames`。程序随后必须询问用户一个名字，根据该名字它将搜索并显示所有名字与提供的名字相同的人的姓。\n\n**解答**\n\n虽然在练习的表述中并不明确，但\
  \ `firstNames` 数组确实可能包含多个相同值。遇到两个名为“John”的人有多稀奇呢？程序必须在 `firstNames` 中搜索用户提供的名字，每当找到时，必须从另一个数组中显示相应的姓。\n\
  \n```csharp\nconst int PEOPLE = 20;\nint i;\nstring needle;\nbool found;\nstring[]\
  \ firstNames = new string[PEOPLE];\nstring[] lastNames = new string[PEOPLE];\nfor\
