  \n## 第 10 章\n\n## 顺序控制结构引言\n\n### 10.1 什么是顺序控制结构？\n\n顺序控制结构指的是语句按行执行，即语句按照它们在程序中出现的相同顺序顺序执行，而不跳过任何一个语句。例如，它们可以执行一系列读取或写入操作、算术运算或对变量进行赋值。\n\
  \n下面的程序展示了顺序执行的 `C#` 语句示例。\n\n```csharp\nproject_10.1\ndouble num, result;\n// 提示用户输入\
  \ num 的值\nConsole.Write(\"Enter a number: \");\nnum = Convert.ToDouble(Console.ReadLine());\n\
  // 计算 num 的平方\nresult = num * num;\n// 将结果显示在用户的屏幕上\nConsole.WriteLine(\"The square\
  \ of \" + num + \" is \" + result);\n```\n\n顺序控制结构是你在 4.11 节中学到的三个基本控制结构中最简单的。另外两个结构是“决策结构”和“循环结构”。计算机编程中的所有问题都可以仅使用这三个结构来解决！\n\
  \n在 `C#` 中，你可以使用双斜杠（` //`）添加注释。注释是给人类读者看的。编译器和解释器会忽略它们。\n\n#### 练习 10.1-1 计算矩形的面积\n\
  \n编写一个 `C#` 程序，提示用户输入矩形的底边和高度，然后计算并显示其面积。\n\n##### 解决方案\n\n你可能在学校学过，可以使用以下公式计算矩形的面积：\n\
  \n`Area = Base × Height`\n\n在 4.6 节中，你学习了创建算法涉及的三个主要阶段：数据输入、数据处理和结果输出。\n\n在练习中，这三个主要阶段如下：\n\
  \n- 数据输入 – 用户必须输入 `Base` 和 `Height` 的值\n- 数据处理 – 程序必须计算矩形的面积\n- 结果输出 – 程序必须显示上一个阶段计算出的矩形面积\n\
  \n该问题的解决方案所示所示。\n\n```csharp\nproject_10.1-1\ndouble area, b, h;\n// 数据输入 - 提示用户输入底和高的值\n\
  Console.Write(\"Enter the base: \");\nb = Convert.ToDouble(Console.ReadLine());\n\
  Console.Write(\"Enter the height: \");\nh = Convert.ToDouble(Console.ReadLine());\n\
  // 数据处理 - 计算矩形的面积\narea = b * h;\n// 结果输出 - 显示结果\nConsole.WriteLine(\"The area is\
  \ \" + area);\n```\n\n#### 练习 10.1-2 计算圆面积\n\n编写一个 `C#` 程序，计算并显示圆的面积。\n\n##### 解决方案\n\
  \n你可以使用以下公式计算圆的面积：\n\n`Area = π · Radius²`\n\n`π` 的值是一个已知数量，约为 `3.14159`。因此，用户必须输入的是\
  \ `Radius`。\n\n在练习中，你在 4.6 节中学到的三个主要阶段如下：\n\n- 数据输入 – 用户必须输入 `Radius`\n- 数据处理 –\
  \ 程序必须计算圆的面积\n- 结果输出 – 程序必须显示上一个阶段计算出的面积\n\n该问题的解决方案。\n\n```csharp\nproject_10.1-2\n\
  double area, radius;\n// 数据输入 - 提示用户输入 radius 的值\nConsole.Write(\"Enter the radius:\
  \ \");\nradius = Convert.ToDouble(Console.ReadLine());\n// 数据处理 - 计算面积\narea = 3.14159\
  \ * radius * radius;\n// 结果输出 - 显示结果\nConsole.WriteLine(\"The area is \" + area);\n\
  ```\n\n更好的方法是使用常量 `PI`。\n\n```csharp\nproject_10.1-2\nconst double PI = 3.14159;\n\
  double area, radius;\n// 数据输入 - 提示用户输入 radius 的值\nConsole.Write(\"Enter the radius:\
  \ \");\nradius = Convert.ToDouble(Console.ReadLine());\n// 数据处理 - 计算面积\narea = PI\
  \ * radius * radius;\n// 结果输出 - 显示结果\nConsole.WriteLine(\"The area is \" + area);\n\
  ```\n\n#### 练习 10.1-3 汽车在哪里？计算行驶距离\n\n汽车从静止开始，以恒定加速度沿直路行驶一段时间。编写一个 `C#` 程序，提示用户输入加速度和汽车行驶的时间，然后计算并显示行驶距离。所需的公式是：\n\
  \n`S = u · t + 0.5 · a · t²`\n\n其中\n\n- `S` 是汽车行驶的距离，单位为米（m）\n- `u[0]` 是汽车的初始速度，单位为米/秒（m/sec）\n\
  - `t` 是汽车行驶的时间，单位为秒（sec）\n- `a` 是加速度，单位为米/秒²（m/sec²\n\n##### 解决方案\n\n由于汽车从静止开始，初始速度\
