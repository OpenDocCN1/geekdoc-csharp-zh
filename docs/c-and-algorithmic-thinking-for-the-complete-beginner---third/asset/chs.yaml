  ```\n\n## 第 17 章 双分支结构\n\n### 17.1 双分支结构\n\n与单分支决策结构相反，这种决策结构在路径上都包含语句或语句块。\n\n\
  ![Image](img/chapter17-01.png)\n\n如果 `Boolean_Expression` 为真，则执行语句或语句块 1；否则，执行语句或语句块\
  \ 2。\n\nC# 语句的通用形式为：\n\n`if (Boolean_Expression) {语句或语句块 1}`\n`else {语句或语句块 2}`\n\
  \n在下一个示例中，当用户输入大于或等于 18 的值时，显示“成年”。\n\n![](img/my_exercise_header.png) project_17.1\n\
  int age;\nConsole.Write(\"输入年龄： \");\nage = Convert.ToInt32(Console.ReadLine());\n\
  if (age >= 18) {\n    Console.WriteLine(\"成年了！\");\n} else {\n    Console.WriteLine(\"\
  未成年！\");\n}\n```\n\n#### 练习 17.1-1 寻找输出消息\n\n对于下面的流程图，确定三次执行的输出消息。\n\n三次执行的输入值为\
  \ (i) 3，(ii) −3 和 (iii) 0。\n\n![Image](img/chapter17-02.png)\n\n解决方案\n\ni) 当用户输入\
  \ 3 时，布尔表达式为真，执行流遵循右路径并显示“正”。ii) 当用户输入 −3 时，布尔表达式为假，执行流遵循左路径并显示“负数”。iii) 你能预测当用户输入\
  \ 0 时会发生什么吗？如果你认为没有任何消息会被显示，那么你就错了！双分支决策结构总是遵循某条路径，无论是左侧还是右侧！它不能跳过两个语句块的执行。至少必须有一个语句或语句块被执行。因此，在这种情况下，当用户输入\
  \ 0 时，布尔表达式为假，执行流遵循左路径，并显示“负数”！\n\n\n\n\n![](img/notice.jpg)该算法目前并不满足所有可能输入的有效性属性。虽然它能正确识别正值和负值，但它忽略了零的情况。零是一个有效的输入，应该在算法逻辑中考虑在内，以确保它对所有可能的输入都能产生有意义的结果。在本书的后半部分（在练习\
  \ 20.1-2 中），你将学习如何根据用户提供的值是大于、小于还是等于零来显示三个消息。\n\n![](img/remember.jpg)决策符号有一个入口和两个出口路径！你不能有第三个出口！\n\
  \n#### 练习 17.1-2 跟踪表与二选一决策结构\n\n创建一个跟踪表，确定以下 C# 程序在两次不同执行中每一步中变量的值。\n\n两次执行的输入值为\
