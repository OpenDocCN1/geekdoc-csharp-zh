  \ 6\nConsole.WriteLine(Math.Round(5.4)); //显示为: 5\n```\n\n如果你需要对 `number` 进行指定的位数，可以使用以下公式：`Math.Round(number,\
  \ digits)`\n\n### 示例\n\n![](img/my_exercise_header.png) 项目 _11.2\n\n```csharp\n\
  double a = 5.6678;\nConsole.WriteLine(Math.Round(a, 2)); //显示为: 5.67\nConsole.WriteLine(Math.Round(a,\
  \ 1)); //显示为: 5.7\n```\n\n## 取整\n\n`Math.Floor(number)`\n\n此方法返回小于或等于 `number` 的最大整数。\n\
