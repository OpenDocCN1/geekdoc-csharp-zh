  \ = Console.ReadLine()`：\na) 允许用户输入一个值并将其赋值给变量 `data1`。变量 `data2` 保持为空。\nb) 允许用户输入一个值并将其赋值给变量\
  \ `data1data2`。\nc) 允许用户输入两个值并将它们赋值给变量 `data1` 和 `data2`。\nd) 以上都不是\n\n## 第 7 章：运算符\n\
  \n### 7.1 赋值运算符\n\nC# 中最常用的运算符是值赋值运算符（`=`）。例如，下面的 C# 语句将值 5 赋值给变量 `x`。\n\n```csharp\n\
  x = 5;\n```\n\n正如你在第 5 章 中读到的，这等同于流程图中使用的左箭头。\n\n![Image](img/chapter07-01.png)\n\
  \n流程图中使用的左箭头可能比（`=`）符号更方便、更清晰，因为它在直上上说明了右侧的值或表达式的结果被赋值给左侧的变量。\n\n需要注意的是，（`=`）符号并不等同于数学中使用的符号。在数学中，表达式\
  \ `x = 5` 读作“x 等于 5”。但在 C# 中，表达式 `x = 5` 读作“将值 5 赋值给 x”或“设置 x 等于 5”。它们看起来一样，但作用不同！\n\
  \n例如，在数学中，以下两行是等价的。第一行可以读作“x 等于 y 和 z 之和”，第二行读作“y 和 z 之和等于 x”。\n\n```math\nx = y\
  \ + z\ny + z = x\n```\n\n另一方面，在 C# 中，这两个语句绝对不等价。\n\n```csharp\nx = y + z;\ny + z\
  \ = x;\n```\n\n第一个语句是一个有效的 C# 语句，传达了“将 y 和 z 之和赋值给 x”。然而，第二个语句是无效的，因为它试图将 `x` 的值赋值给\
  \ `y + z`，这在 C# 中是不允许的！\n\n![](img/remember.jpg)在 C# 中，（`=`）符号左侧的变量代表内存（RAM）中的一个区域，在该区域可以存储值。\n\
  \n![](img/remember.jpg)在（`=`）符号的左侧必须存在单个变量，而右侧可以是数字、变量、字符串，甚至是一个复杂的数学表达式。\n\n在表\
  \ 7-1 中你可以找到一些值赋值的示例。\n\n| 示例 | 描述 |\n| --- | --- |\n| `a = 9;` | 给变量 `a` 赋值值 9。\
  \ |\n| `b = c;` | 将变量 `c` 的内容赋值给变量 `b`。 |\n| `d = \"Hello Zeus\";` | 给变量 `d` 赋值字符串\
  \ \"Hello Zeus\"。 |\n\n\n\n\n然而，需要注意的是，在 C# 中，两个整数的除法结果始终是一个整数。因此，在表达式 `7 / 2` 中，由于数字\
  \ `7` 和 `2` 都是整数，结果为 `3`（而不是人们可能错误预期的 `3.5`）。相比之下，在表达式 `7.0 / 2` 中，至少有一个数字是实数（浮点数/float），结果确实是\
  \ `3.5`。\n\n以下三个陈述是等价的。它们都会输出 `3.5` 的值。\n\n```csharp\nConsole.WriteLine(7.0 / 2);Console.WriteLine(7\
  \ / 2.0);Console.WriteLine(7.0 / 2.0);\n```\n\n取模运算符（`%`）返回整数除法的余数，这意味着语句\n\n```csharp\n\
  c = 13 % 3;\n```\n\n将值 `1` 赋值给变量 `c`。\n\n取模运算符（`%`）也可以用于浮点数，但结果是实数（float）。例如，操作\n\
  \n```csharp\nd = 14.4 % 3;\n```\n\n将值 `2.4`（而不是你可能错误预期的 `2`）赋值给变量 `d`。\n\n![](img/notice.jpg)请记住，流程图是表示算法的一种松散方法。虽然流程图中允许取模（`%`）运算符，但本书使用了被广泛接受的\
  \ `MOD` 运算符！例如，C# 语句 `y = 13 % 3` 在流程图中表示为\n\n.![Image](img/chapter07-04.png)\n\n\
  在数学中，正如你可能已经知道的，你可以使用圆括号（`()`）以及大括号（`{}`）和方括号（`[]`），如下表达式所示。\n\n.![Image](img/chapter07-06.png)\n\
  \n然而，在 C# 中没有所谓的大括号和方括号。你拥有的圆括号；因此，相同的表达式必须使用圆括号而不是大括号或方括号。\n\n```csharp\ny = 5.0\
  \ / 2.0 * (3 + 2 * (4 + 7 * (6 – 4.0 / 3.0)));\n```\n\n### 7.3 算术运算符的优先级是什么？\n\n\
  算术运算符遵循与数学相同的优先级规则，这些规则是：先执行乘法和除法，后执行加减法。\n\n| 优先级高 ![Image](img/arrow_up.jpg) |\
  \ 优先级低 | 算术运算符 |\n| --- | --- | --- |\n| `*, /, %` | | |\n| `+, −` | | |\n\n当同一个表达式中同时存在乘法和除法时，由于两者的优先级相同，它们从左到右执行（与阅读顺序相同），这意味着表达式\n\
  \n`y = 6 / 3 * 2;`\n\n等价于 ![Image](img/chapter07-07.png)，并将值 `4` 赋值给变量 `y`（除法在乘法之前执行）。\n\
  \n然而，如果你想让乘法在于除法之前执行，可以使用括号来改变优先级。这意味着\n\n```csharp\ny = 6 / (3 * 2);\n```\n\n等价于\
  \ ![Image](img/chapter07-08.png)，并将值 `1` 赋值给变量 `y`（乘法在除法之前执行）。\n\n![](img/notice.jpg)请记住，在\
  \ C# 中无法以 ![Image](img/chapter07-09.png) 或 ![Image](img/chapter07-10.png) 的形式编写分式。放弃吧！Visual\
  \ Studio 或任何 IDE 中都没有方程编辑器。所有的分数都必须写在一行上。例如，![Image](img/chapter07-09.png) 必须写成\
  \ `6 / 3`，![Image](img/chapter07-10.png) 必须写成 `(4 * x + 5) / 6`。\n\n运算顺序可以总结如下：\n\
  \n1) 首先执行括号括号内的任何操作。\n2) 接下来，从左到右执行任何乘法和除法操作。\n3) 最后，从左到右执行任何加减操作。\n\n所以，在下一个示例中\n\
  \n```csharp\ny = 12 + (20 + 3) - 8 / 4 * 3;\n```\n\n操作执行如下：\n\n![Image](img/chapter07-11.png)\n\
  \n### 7.4 复合赋值运算符\n\nC# 提供了一组特殊的运算符，称为复合赋值运算符，可以帮助你更快地编写代码。下表详细列了这些运算符。每个运算符提供了一个示例，而“等价于”列显示了不使用复合赋值运算符的对应语句。\n\
  \n| 运算符 | 描述 | 示例 | 等价于 |\n| --- | --- | --- | --- |\n| `+=` | 加法赋值 | `a += b;`\
  \ | `a = a + b;` |\n| `-=` | 减法赋值 | `a −= b;` | `a = a − b;` |\n| `*=` | 乘法赋值 |\
  \ `a *= b;` | `a = a * b;` |\n| `/=` | 除法赋值 | `a /= b;` | `a = a / b;` |\n| `%=`\
  \ | 取模赋值 | `a %= b;` | `a = a % b;` |\n\n![](img/notice.jpg)记住，在流程图中，本书仅使用这种运算符，在流程图中表示为.![Image](img/chapter07-12.png)\n\
  \n### 练习 7.4-1 哪些 C# 语句是正确的？\n\n以下哪些语句是正确的？\n\ni) `a += 15;`\nii) `a = a + 15;`\n\
  iii) `a++;`\niv) `a = 15++;`\nv) `a += 1;` \nvi) `a = a + 1;`\nvii) `a--;`\nviii)\
  \ `a = a - 1;`\nix) `a = --1;`\nx) `a = a - 1;`\nxii) `a -= 1;`\n\n答案：\n\ni) 正确。\n\
  ii) 正确。\niii) 正确。\niv) 错误。\nv) 正确。\nvi) 正确。\nvii) 正确。\nviii) 正确。\nix) 错误。\nx) 错误。\n\
  xii) 错误。\n\n### 练习 7.4-2 变量类型\n\n以下每个变量类型是什么？\n\ni) `a = 15;`\nii) `width = \"10\
  \ meters\";`\niii) `b = \"15\";`\niv) `temp = 13.5;`\nv) `b = true;`\nvi) `b = \"\
  true\";`\n\n答案：\n\ni) 整数。\nii) 字符串。\niii) 字符串。\niv) 实数 (float)。\nv) 布尔。\nvi) 字符串。\n\
  \n### 7.5 增减运算符\n\n给一个数字加 1 或减去 1 在计算机编程中非常频繁，因此 C# 引入了特殊的运算符来实现这些操作。C# 支持两种类型的增减运算符：\n\
  \n►前置增//减运算符\n►后置增//减运算符\n\n前置增//减运算符放在变量名之前，而后置增//减运算符放在变量名之后。这四种类型的所示所示。\n\n|\
  \ 运算符 | 描述 | 示例 | 等价于 |\n| --- | --- | --- | --- |\n| `++a` | 变量加一 | `++a;` | `a\
  \ = a + 1;` |\n| `−−a` | 变量减一 | `−−a;` | `a = a − 1;` |\n| `a++` | 变量加一 | `a++;`\
  \ | `a = a + 1;` |\n| `a--` | 变量减一 | `a--;` | `a = a − 1;` |\n\n正如你在“等价于”列中所看到的，显然你可以通过使用经典的赋值运算符（\
  \ = ）来获得相同的结果。然而，选择这些新运算符不仅更高效，而且更快。\n\n让我们看一个增运算符的示例，\n\n```csharp\na = b = 5;++a;\
  \ // 这等价于 a = a + 1\nb++; // 这等价于 b = b + 1\nConsole.WriteLine(a); // 输出: 6\nConsole.WriteLine(b);\
  \ // 输出: 6\n```\n\n![](img/remember.jpg)双斜杠（ // ）表示后面的文本是注释；因此，它永远不会被执行。\n\n\n\n\
  在在上一个示例中，前增和后增运算符将变量 `a` 和 `b` 分别加了 1！那么，陷阱在哪里呢？这两个运算符是对价的吗？答案是“是”，但仅在这个特定的示例中如此。在其他情况下，答案可能是“否”。这两个运算符之间存在细微的。\n\
  \n让我们找出这个区别！规则是：前自增/自减运算符先执行增/减操作，然后交付新值；而后自增/自减运算符先交付旧值，然后执行增/减操作。请仔细观察接两个示例。\n\
  \n```csharp\na = 5;b = ++a;Console.WriteLine(a);  //It displays: 6Console.WriteLine(b);\
  \  //It displays: 6\n```\n\n以及\n\n```csharp\na = 5;b = a++;Console.WriteLine(a);\
  \  //It displays: 6Console.WriteLine(b);  //It displays: 5\n```\n\n在第一个示例中，变量 `a`\
  \ 加 1，然后将它的新值赋值给变量 `b`。最后，两个变量的值都是 6。\n\n在第二个示例中，变量 `a` 的值 5 被赋值给变量 `b`，然后变量 `a`\
  \ 加 1。最后，变量 `a` 的值为 6，但变量 `b` 的值为 5！\n\n为了提高程序的效率，可以直接在表达式中使用增/自减运算符，如下面的示例所示。\n\
  \n```csharp\na1 = a2 = 5;b = --a1 * 2 - 1;Console.WriteLine(b);         //It displays:\
  \ 7Console.WriteLine(a2++ * 2);  //It displays: 10Console.WriteLine(a2);       \
  \ //It displays: 6\n```\n\n### 7.6 字符串运算符\n\n将两个独立的字符串合并成一个字符串称为拼接。可以使用两个运算符来拼接（连接）字符串，如下表所示。\n\
