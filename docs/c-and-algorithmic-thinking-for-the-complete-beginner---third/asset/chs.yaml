  \ `answers` 和一个答案。然后返回该答案在数组中出现的次数。\nv) 使用上述子程序，编写一个 C# 程序，提示用户输入公民的 SSNs 和答案。然后必须提示用户输入一个\
  \ SSN，并显示该 SSN 公民给出的答案，以及给出相同答案的公民占总人数的百分比。程序随后必须询问用户是否希望搜索另一个 SSN。如果答案为“Yes”，则重复该过程；否则结束。\n\
  \n9) 八支队伍参加足球锦赛，每支队伍比赛 12 场，每周比赛一场。执行以下操作：\ni) 编写一个名为 `inputData` 的子程序，提示用户将每支队伍的名称以及每场比赛的胜负结果（字母“W”胜，“L”负，或“T”平）分别输入到数组\
  \ `names` 和 `results` 中。然后将这些数组返回给调用者。\nii) 编写一个名为 `displayResult` 的子程序，通过其形式参数列表接收数组\
  \ `names` 和 `results`。然后提示用户输入一个字母（W、L 或 T），并显示每个队伍分别获胜、输掉或平局的周数。例如，如果用户输入“L”，该子程序必须搜索并显示每支队伍对应的周数。\n\
  iii) 编写一个名为 `findTeam` 的子程序，通过其形式参数列表接收数组 `names` 和一个队伍名称，然后返回该队伍在数组中的索引位置。如果未找到队伍，则必须显示消息“Team\
  \ not found”并返回值 `-1`。\niv) 编写一个名为 `countResults` 的子程序，通过其形式参数列表接收数组 `results` 和一个结果。然后返回该结果在数组中出现的次数。\n\
  \n\n\n\n在 第七部分 中，你读过或甚至编写的所有程序都在使用子程序（方法和 void 方法）。这种编程风格被称为过程化编程，在大多数情况下它是没问题的！但当编写大型程序，或者在像\
  \ `Microsoft`、`Facebook` 或 `Google` 这样的大公司工作时，面向对象编程是必须使用的编程风格！\n\n面向对象编程通常称为 `OOP`，是一种关注对象的编程风格。在\
  \ `OOP` 中，数据和功能被结合并封装在一个名为 `object`（对象）的内部。应用面向对象的原则让你能够更轻松地维护代码，并编写出他人容易理解和使用的代码。\n\
  \n“OOP 关注对象”这句话真正意味着什么？让我们考虑一个现实世界中的例子。想象一辆车。你会如何描述一特定的车？它有特定的属性，如品牌、型号、颜色和车牌号。此外，这辆车还可以执行或执行过的特定动作。例如，有人可以启动或关闭它、加速或刹车或停车。\n\
  \n在 `OOP` 中，这辆车可以表示为一个具有特定属性（通常称为 `fields` 字段）并可以执行特定动作（称为 `methods` 方法）的 `object`。\n\
  \n显然，你现在可能在问：“我首先如何创建对象呢？”答案很简单！你只需要一个 `class`（类）。一个 `class` 就像一个“橡皮印章”！图 39-1 中有一个印章（这就是类），带有四个空字段和三个动作（方法）。\n\
  \n![Image](img/chapter39-01.png)\n\n图 39-1 类类一个“橡皮印章”\n\n使用这个印章的人可以盖出很多辆车（这些就是对象）。例如，在图\
  \ 39-2 中，一个小男孩盖了那两辆车，然后给它们上色并用特定属性填充了每辆车的字段。\n\n![Image](img/chapter39-02.png)\n\
  \n图 39-2 你可以使用同一个橡皮章作为模板来盖出很多辆车\n\n![](img/notice.jpg)创建新对象（类的新实例）的过程被称为“实例化”（instantiation）。\n\
  \n![](img/notice.jpg)`class` 是一个模板，每个对象都是从 `class` 创建的。每个 `class` 都应该设计为执行一个且仅一个任务！这就是为什么在大多数情况下，需要使用多个一个\
  \ `class` 来构建整个应用程序！\n\n![](img/notice.jpg)在 `OOP` 中，橡皮印章就是 `class`。你可以使用同一个 `class`\
  \ 作为模板来创建（实例化）很多对象！\n\n### 39.2 C# 中的类和对象\n\n现在你已经掌握了类和对象背后的概念，让我们深入在 C# 中编写一个真实的类。以下代码片段创建了这个类。\n\
  \n```csharp\nclass Car {\n    // fields\n    public string brand;\n    public string\
  \ model;\n    public string color;\n    public string licensePlate;\n\n    // methods\n\
  \    public void turnOn() {\n        Console.WriteLine(\"The car turns on\");\n\
  \    }\n    public void turnOff() {\n        Console.WriteLine(\"The car turns off\"\
  );\n    }\n    public void accelerate() {\n        Console.WriteLine(\"The car accelerates\"\
  );\n    }\n}\n```\n\n以下代码创建了两个对象：\n\n```csharp\nCar car1 = new Car();\ncar1.brand\
  \ = \"Mazda\";\ncar1.model = \"MX5\";\ncar1.color = \"Gray\";\ncar1.licensePlate\
  \ = \"AB1234\";\ncar1.turnOn();\n\nCar car2 = new Car();\ncar2.brand = \"Ford\"\
  ;\ncar2.model = \"Focus\";\ncar2.color = \"Blue\";\ncar2.licensePlate = \"XY9876\"\
  ;\ncar2.turnOff();\n```\n\n输出将是：\n```\nThe car turns on\nThe car turns off\n```\n\
  \n等待，上面的代码提到了 `brand` 和 `model`。让我们加上 `Console.WriteLine`：\n\n```csharp\nConsole.WriteLine(car1.brand);\
  \ // outputs Mazda\nConsole.WriteLine(car2.brand); // outputs Ford\n```\n\n输出现在将是：\n\
  ```\nMazda\nFord\n```\n\n在之前的示例中，`car1` 和 `car2` 是同一个类的实例。使用点符号符号（dot notation）允许你一次只引用一个实例。如果你对一个实例进行任何更改，都不会影响另一个！\n\
  \n`class` 是一个无法执行的模板，而对象是 `class` 的实例，它是可以执行的！\n\n### 39.3 构造函数和 this 关键字\n\n在 C#\
  \ 中，有一种方法具有特殊作用，被称为 `constructor`（构造函数）。每当创建一个 `class` 的实例（对象）时，构造函数方法就会自动执行。你想要对对象进行的任何初始化可以在此方法内完成。在\
  \ C# 中，构造函数的名字与它的类名相同。\n\n看下面的示例。构造函数方法 `Person()` 被调用两次，一次是在创建对象 `p1` 时，一次是在创建对象\
  \ `p2` 时，这意味着会显示消息“An object was created”。\n\n```csharp\nclass Person {\n    public\
  \ Person() {\n        Console.WriteLine(\"An object was created\");\n    }\n}\n\n\
  Person p1 = new Person();\nPerson p2 = new Person();\n```\n\n注意，构造函数的名称前面没有 `void`\
  \ 关键字。\n\n在使用 C# 的面向对象编程 (`OOP`) 中，有一个名为 `this` 的关键字，作为指向当前对象的引用变量。看下面的示例。\n\n```csharp\n\
  class Person {\n    public string name;\n    public int age;\n\n    public Person()\
  \ {\n        Console.WriteLine(\"An object was created\");\n    }\n\n    public\
  \ void sayInfo() {\n        Console.WriteLine(\"I am \" + this.name);\n        Console.WriteLine(\"\
  I am \" + this.age + \" years old\");\n    }\n}\n\nPerson person1 = new Person();\n\
  person1.name = \"John\";\nperson1.age = 14;\nperson1.sayInfo();\n```\n\n注意，在方法外部（但在类内部）声明字段\
  \ `name` 和 `age` 时，你需要直接写字段名而不点符号。然而，从方法内部访问字段时，应该使用点符号（例如 `this.name` 和 `this.age`）。\n\
  \n\n\n\n\n你现在脑海中可能正在旋转的问题是：“为什么在 `sayInfo()` 方法中必须将 `name` 和 `age` 字段引用为 `this.name`\
  \ 和 `this.age` 呢？真的有必要在它们前面使用 `this` 关键字吗？”一个简单的回答是，在方法内部始终可能存在两个同名（`name` 和 `age`）的额外局部变量。因此，你需要一种方法来区分这些局部变量和对象的字段。如果你感到困惑，请尝试理解以下示例。在\
  \ `MyClass` 类中有一个字段 `b`，在类的方法 `myMethod()` 中有一个局部变量 `b`。`this` 关键字被用于区分局部变量和字段。\n\
  \n![](img/my_exercise_header.png) project_39.3\n```csharp\n//Main code starts here\n\
  FooClass x = new();    //创建对象\nxx.b = \"Hello!\";   //给它的字段赋值\nx.myMethod();   \
  \  //它会显示: Hello! \n\n//定义类\nclass FooClass  {\n    public string b;   //这是一个字段\n\
  \    public void myMethod() {\n        string b = \" *** \";  //这是一个局部变量\n     \
  \   Console.WriteLine(b + this.b + b);\n    }\n}\n```\n\n![](img/notice.jpg)关键字\
  \ `this` 可以从类的方法内部引用类的任何成员（字段或方法）。\n\n### 39.4 向构造函数传递初始值\n\n任何方法，甚至是构造方法，都可以在其形式参数列表中包含形式参数。例如，在构造方法中，你可以使用参数在创建期间向对象传递某些初始值。以下示例创建了四个对象，每个对象代表希腊神话中的一个泰坦（Titan）。\n\
  \n![](img/my_exercise_header.png) project_39.4\n```csharp\n//Main code starts here\n\
  Titan titan1 = new(\"Cronus\", \"male\");\nTitan titan2 = new(\"Oceanus\", \"male\"\
  );\nTitan titan3 = new(\"Rhea\", \"female\");\nTitan titan4 = new(\"Phoebe\", \"\
  female\");\n\n//定义类\nclass Titan {\n    public string name;\n    public string gender;\n\
  \    //定义构造函数\n    public Titan(string n, string g) {\n        this.name = n;\n\
  \        this.gender = g;\n    }\n}\n```\n\n在 C# 中，拥有同名的一个字段和一个局部变量（甚至是一个形式参数）是合法的。因此，`Titan`\
  \ 类也可以写如下如下：\n\n```csharp\nclass Titan {\n    public string name;\n    public string\
  \ gender;\n    //定义构造函数\n    public Titan(string name, string gender) {\n      \
  \  this.name = name;     //字段和参数可以有相同的名称\n        this.gender = gender;\n    }\n\
  }\n```\n\n变量 `name` 和 `gender` 是用于向构造函数传递值的参数，而 `this.name` 和 `this.gender` 是用于在对象内部存储值的字段。\n\
  \n#### 练习 39.4-1 历史事件\n\n执行以下操作：\n\ni) 写一个名为 `HistoryEvents` 的类，包含：\na) 一个名为 `day`\
  \ 的 public 字符串字段。\nb) 一个大小为 2 的名为 `events` 的 public 字符串数组字段。\nc) 一个通过形式参数列表接受字段\
  \ `day` 初始值的构造函数。\n\nii) 编写一个 C# 程序，为以下历史事件创建两个 `HistoryEvents` 类的对象：\n\n7 月 4 日\n\
  i) 1776 年：美国独立宣言\nii) 1810 年：法国军队占领阿姆斯特丹\n\n10 月 28 日\ni) 969 年：拜占庭军队占领安提俄\nii)\
  \ 1940 年：希腊独立节（Ohi Day）\n\n然后显示所有可用信息。\n\n##### 解决方案\n\n解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_39.4-1\n```csharp\n//Main code starts here\nHistoryEvents h1 = new(\"\
  4th of July\");\nh1.events[0] = \"1776: Declaration of Independence in United States\"\
  ;\nh1.events[1] = \"1810: French troops occupy Amsterdam\";\n\nHistoryEvents h2\
  \ = new(\"28th of October\");\nh2.events[0] = \"969: Byzantine troops occupy Antioch\"\
  ;\nh2.events[1] = \"1940: Ohi Day in Greece\";\n\nConsole.WriteLine(h1.day);\nConsole.WriteLine(h1.events[0]);\n\
  Console.WriteLine(h1.events[1]);\nConsole.WriteLine();\nConsole.WriteLine(h2.day);\n\
  Console.WriteLine(h2.events[0]);\nConsole.WriteLine(h2.events[1]);\n\n//定义类\nclass\
  \ HistoryEvents {\n    public string day;\n    public string[] events = new string[2];\n\
  \    //定义构造函数\n    public HistoryEvents (string day) {\n        this.day = day;\n\
  \    }\n}\n```\n\n### 39.5 Getter 和 Setter 方法与属性的区别\n\n字段是直接声明在类中的变量。然而，面向对象编程的原则规定，类的数据应该是隐藏的，并且能够防止意外修改。设想某一天你可能会编写一些其他程序员在他们的程序中用到的类。因此，你不希望他们知道你的类内部的什么！你类的内部操作应该对外部隐藏。通过不暴露字段，你成功地隐藏了类的内部实现。字段应该保持对类私有，并通过\
  \ `get` 和 `set` 方法（或属性）进行访问。\n\n![](img/notice.jpg)通常情况下，程序员应该只对具有私有或保护访问权限的数据数据使用字段。在\
  \ C# 中，你可以使用特殊关键字 `private` 或 `protected` 将字段（或方法）设置为私有或保护。\n\n让我们通过一个示例来尝试理解这一切。假设你编写了以下类，将华氏度温度转换为等值的摄氏度。\n\
  \n![](img/my_exercise_header.png) project_39.5a\n```csharp\n//Main code starts here\n\
  FahrenheitToCelsius x = new(-68); //创建对象 x\nConsole.WriteLine(x.getTemperature());\n\
  \n//定义类\nclass FahrenheitToCelsius {\n    public double temperature;\n    //定义构造函数\n\
  \    public FahrenheitToCelsius(double value) {\n        this.temperature = value;\
  \ //字段被初始化\n    }\n    //此方法获取温度\n    public double getTemperature() {\n       \
  \ return 5.0 / 9.0 * (this.temperature - 32.0);\n    }\n}\n```\n\n这个类几乎完美，但有一个主要的缺点。它没有考虑到温度不能低于\
  \ -459.67 华氏度（-273.15 摄氏度）。这个温度被称为绝对零度。因此，一个使用你的类且对物理学一无所知的新手程序员可能会向构造函数传递 -500\
  \ 华氏度的值，如下代码片段所示\n\n```csharp\nFahrenheitToCelsius x = new(-500);\nConsole.WriteLine(x.getTemperature());\n\
  ```\n\n尽管程序可以完美运行并显示 -295.55 摄氏度，但遗憾的是，这个温度在整个宇宙中是不存在的！因此，该类的不同版本可能会部分解决这个问题。\n\n\
  ![](img/my_exercise_header.png) project_39.5b\n```csharp\n//Main code starts here\n\
  FahrenheitToCelsius x = new(-500); //创建对象 x\nConsole.WriteLine(x.getTemperature());\n\
  \n//定义类\nclass FahrenheitToCelsius {\n    public double temperature;\n    //定义构造函数\n\
  \    public FahrenheitToCelsius(double value) {\n        this.setTemperature(value);\
  \ //使用方法设置字段的值\n    }\n    //此方法获取温度\n    public double getTemperature() {\n   \
  \     return 5.0 / 9.0 * (this.temperature - 32.0);\n    }\n    //此方法设置温度\n    public\
  \ void setTemperature(double value) {\n        if (value >= -459.67) {\n       \
  \     this.temperature = value;\n        } else {\n            throw new Exception(\"\
  There is no temperature below -459.67\");\n        }\n    }\n}\n```\n\n![](img/notice.jpg)`throw`\
  \ 语句强制程序抛出异常（运行时错误），导致执行流停止。\n\n这次，使用一个名为 `setTemperature()` 方法来设置字段 `temperature`\
  \ 的值。这更好，但并不完全完美，因为程序员必须小心，并且在每次想要更改 `temperature` 字段的值时都要记住使用这个方法。问题是，`temperature`\
  \ 字段的值仍然可以使用其名称直接更改，如下面的代码片段所示。\n\n```csharp\nFahrenheitToCelsius x = new(-50);\
  \ //创建对象 x\nConsole.WriteLine(x.getTemperature());\nx.setTemperature(-65); //这是可以的\n\
  Console.WriteLine(x.getTemperature());\nx.temperature = -500; //遗憾的是，这仍然被允许！\nConsole.WriteLine(x.getTemperature());\n\
  ```\n\n\n\n\n\n如果你将字段 `temperature` 声明为 `private`，这个问题就可以被完全解决！当字段被声明为 `private`\
  \ 时，调用者（此处为对象 `x`）无法直接访问该字段，接下来的 C# 程序所示。\n\n![](img/my_exercise_header.png) project_39.5c\n\
  ```csharp\n//Main code starts here\nFahrenheitToCelsius x = new(-50);  //Create\
  \ object x. This calls the constructor which,\n//in turn, calls the setter\nConsole.WriteLine(x.getTemperature());\
  \  //This calls the getter.\nx.setTemperature(-65);   //This calls the setter.\n\
  Console.WriteLine(x.getTemperature());  //This calls the getter.\nx._temperature\
  \ = -50;   //This is NOT permitted!\nConsole.WriteLine(x._temperature);   //This\
  \ is NOT permitted as well!\n\n//Define the class\nclass FahrenheitToCelsius {\n\
  \    private double _temperature;  //Declare field temperature as private\n    //Define\
  \ the constructor\n    public FahrenheitToCelsius(double value) {\n        this.setTemperature(value);\
  \   //Call the setter\n    }\n    //This method gets the temperature\n    public\
  \ double getTemperature() {\n        return 5.0 / 9.0 * (this._temperature - 32.0);\n\
  \    }\n    //This method sets the temperature\n    public void setTemperature(double\
  \ value) {\n        if (value >= -459.67) {\n            this._temperature = value;\n\
  \        } else {\n            throw new Exception(\"There is no temperature below\
  \ -459.67\");\n        }\n    }\n}\n```\n\n![](img/notice.jpg) 许多程序员倾向于在私有字段前加上下划线\
  \ (`_`)。\n\n最后但同样，与其使用方法来获取和设置私有字段 `_temperature` 的值，你可以使用属性（property）！属性是类成员，提供了一种灵活的机制来读取、写入或计算你想保持私有的字段的值。属性暴露了字段，但隐藏了实现！要创建一个属性，你仍然需要一个私有字段。私有字段存储了属性暴露的数据。公共属性的一般形式如下。\n\
  \n```csharp\nprivate type _field_name;    //This defines a private field\npublic\
  \ type property_name {  //This defines a public property\n    //Define the getter\n\
  \    get {\n        // A statement or block of statements\n        return _field_name;\n\
  \    }\n    //Define the setter\n    set {\n        // A statement or block of statements\n\
  \        _field_name = value;\n    }\n}\n```\n\n其中\n\n- `type` 是私有字段以及公共属性的类型类型。两种类型必须匹配。\n\
  - `_field_name` 是私有字段的名称。它遵循与变量名相同的规则。\n- `property_name` 是公共属性的名称。它遵循与变量名相同的规则。\n\
  \n接下来的 C# 程序使用属性 `Temperature`（而不是方法）来获取和设置私有字段 `_temperature` 的值。当语句尝试访问属性 `Temperature`\
  \ 的值时，会自动调用 getter；同样地，当语句尝试给属性 `Temperature` 赋值时，会自动调用 setter！\n\n![](img/my_exercise_header.png)\
  \ project_39.5d\n```csharp\n//Main code starts here\nFahrenheitToCelsius x = new(-50);\
  \  //Create object x. This calls the constructor which,\n//in turn, calls the setter.\n\
  Console.WriteLine(x.Temperature);  //This calls the getter.\nx.Temperature = -65;\
  \   //This calls the setter\nConsole.WriteLine(x.Temperature);  //This calls the\
  \ getter.\nx.Temperature = 500;   //This calls the setter and throws an error\n\
  Console.WriteLine(x.Temperature);\n\n//Define the class\nclass FahrenheitToCelsius\
  \ {\n    private double _temperature;  //This defines a private field\n    //Define\
  \ the constructor\n    public FahrenheitToCelsius(double value) {\n        this.Temperature\
  \ = value;  //Property is initialized. This calls the setter\n    }\n    //Define\
  \ a public property\n    public double Temperature {\n        //Define the getter\n\
  \        get {\n            return 5.0 / 9.0 * (this._temperature - 32.0);\n   \
  \     }\n        //Define the setter\n        set {\n            if (value >= -459.67)\
  \ {\n                this._temperature = value;\n            } else {\n        \
  \        throw new Exception(\"There is no temperature below -459.67\");\n     \
  \       }\n        }\n    }\n}\n```\n\n#### 练习 39.5-1 罗马数字\n\n罗马数字如下表所示。\n\n| Number\
