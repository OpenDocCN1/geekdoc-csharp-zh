  \ 第八部分 中学习更多关于属性的知识。\n\n#### 练习 34.1-4 创建两个数组 – 分离正值和负值\n\n编写一个 C# 程序，允许用户向数组中输入\
  \ 100 个数值，然后创建两个新数组：`pos` 和 `neg`。数组 `pos` 必须包含正值，而数组 `neg` 必须包含负值。值 `0`（如果有的话）不应添加到最终的任何数组\
  \ `pos` 或 `neg` 中。\n\n### 解决方案\n\n让我们使用以下示例来分析这种方法。\n\n![Image](img/chapter34-03.png)\n\
  \n在本次练习中，数组 `ar` 的元素索引位置与数组 `pos` 和 `neg` 之间不存在一对一的对应关系。例如，数组 `ar` 中位置 1 的元素没有存储在数组\
  \ `neg` 的位置 1，或者数组 `ar` 中位置 2 的元素没有存储在数组 `pos` 的位置 2。因此，你不能执行以下操作：\n\n``````csharp\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {\n    if (ar[i] > 0) {\n        pos[i] = ar[i];\n\
  \    } else if (ar[i] < 0) {\n        neg[i] = ar[i];\n    }\n}\n```\n\n因为这会导致以下两个数组。\n\
  \n![Image](img/chapter34-04.png)\n\n你这里需要两个独立的索引变量：用于数组 `pos` 的 `posIndex` 和用于数组\
  \ `neg` 的 `negIndex`。这些索引变量必须独立地递增，并且仅当元素被添加到相应的数组时才递增。如下代码片段所示，索引变量 `posIndex`\
  \ 只有在元素添加到数组 `pos` 时才递增，而索引变量 `negIndex` 只有在元素添加到数组 `neg` 时才递增。\n\n```csharp\nposIndex\
  \ = 0;\nnegIndex = 0;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (ar[i] > 0)\
  \ {\n        pos[posIndex] = ar[i];\n        posIndex++;\n    } else if (ar[i] <\
  \ 0) {\n        neg[negIndex] = ar[i];\n        negIndex++;\n    }\n}\n```\n\n这等价于写成：\n\
  \n```csharp\nposIndex = 0;\nnegIndex = 0;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n\
  \    if (ar[i] > 0) {\n        pos[posIndex++] = ar[i];\n    } else if (ar[i] <\
  \ 0) {\n        neg[negIndex++] = ar[i];\n    }\n}\n```\n\n![](img/notice.jpg) 注意变量\
  \ `posIndex` 和 `negIndex` 具有双重作用。当循环迭代时，每个都指向必须放置新元素的位置。但当循环结束时，变量 `posIndex` 和\
  \ `negIndex` 也包含了每个对应数组中的元素总数！\n\n接下来是完整的解决方案。\n\n![](img/my_exercise_header.png)\
  \ `project_34.1-4`\n\n```csharp\nconst int ELEMENTS = 100;\nint i, posIndex, negIndex;\n\
  double[] ar = new double[ELEMENTS];\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n   \
  \ ar[i] = Convert.ToDouble(Console.ReadLine());\n}\n// Create arrays pos and neg\n\
  posIndex = 0;\nnegIndex = 0;\ndouble[] pos = new double[ELEMENTS];\ndouble[] neg\
  \ = new double[ELEMENTS];\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (ar[i]\
  \ > 0) {\n        pos[posIndex++] = ar[i];\n    } else if (ar[i] < 0) {\n      \
  \  neg[negIndex++] = ar[i];\n    }\n}\nfor (i = 0; i <= posIndex - 1; i++) {\n \
  \   Console.Write(pos[i] + \"\\t\");\n}\nConsole.WriteLine();\nfor (i = 0; i <=\
  \ negIndex - 1; i++) {\n    Console.Write(neg[i] + \"\\t\");\n}\n```\n\n![](img/notice.jpg)\
  \ 注意数组 `pos` 和 `neg` 分别包含 `posIndex` 和 `negIndex` 个元素。这就是为什么最后两个循环控制结构一直迭代到变量 `i`\
  \ 分别达到 `posIndex - 1` 和 `negIndex - 1`。\n\n#### 练习 34.1-5 创建一个包含数字 5 的数组\n\n编写一个\
