  \ | 93 | 7 | 5 |\n| 23 | `i < 7` | 结果为假 | | | |\n| 24 | `.WriteLine(a)` | 它显示: 93\
  \ | | | |\n\n在程序结束时，变量 `a` 包含值 93。\n\n### 27.2 适用于嵌套循环的规则\n\n除了适用于 `for` 的四条规则（在第\
  \ 26.2 节中介绍）外，在编写嵌套循环程序时，你必须遵循两条额外的规则，因为它们可以避免产生意外的副作用。\n\n- **规则 1**：内层循环必须完全在外循环内部开始并结束，这意味着循环之间不能重叠。\n\
  - **规则 2**：外循环和内层（嵌套）循环不能使用相同的计数器变量。\n\n### 练习 27.2-1 违反第一规则\n\n设计一个违反嵌套循环第一规则的流程图，该规则规定“内层循环必须完全在外循环内部开始并结束”。\n\
  \n### 答案\n\n以下流程图违反了嵌套循环的第一规则。\n\n如果你尝试执行流程，你会发现它顺利地执行了 `5 × 10 = 50` 次迭代。没有人能看出这个流程图是错误的，实际上在技术上它是正确的。然而，问题在于它的可读性。很难识别这个流程图想要实现什么。而且，它不符合你学过的循环结构，因此无法直接转换为\
  \ C# 程序。避免这种嵌套循环！\n\n### 练习 27.2-2 违反第二规则\n\n找到消息“Hello”显示的次数。\n\n```cpp\nfor (i\
  \ = 1; i <= 3; i++) {\n    for (i = 5; i >= 1; i--) {\n        Console.WriteLine(\"\
  Hello\");\n    }\n}\n```\n\n### 答案\n\n乍看，人们会认为“Hello”显示了 `3 × 5 = 15` 次。然而，仔细观察发现情况并非如此。这个程序违反了嵌套循环的第二规则，该规则规定“外循环和内层（嵌套）循环不能使用相同的计数器变量”。让我们设计对应的流程图。\n\
  \n如果你尝试按照该流程图执行执行，你会发现当内层循环完成所有迭代时，变量 `i` 包含值 0。然后，`i` 加 1，外循环再次重复。这个过程会持续下去，因为\
  \ `i` 永远不会超过外循环布尔表达式所需的数值 3。因此，“Hello”显示了无限次。\n\n### 27.3 复习题\n\n对以下每个陈述判断对或错。\n\
