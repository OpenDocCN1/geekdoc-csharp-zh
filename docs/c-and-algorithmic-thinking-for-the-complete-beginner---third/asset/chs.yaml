  \ |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n表 15-1 C# 中的比较运算符\n\
  \n以下是一些布尔表达式的示例： \n\n* `x > y`。这个布尔表达式是向计算机的一个提问，可以读作“`x` 是否大于 `y`？”\n* `x <= y`。这个布尔表达式也是向计算机\
