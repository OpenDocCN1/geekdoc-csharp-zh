  iii) 使用上述子程序，编写一个 C# 程序，用 100 个随机整数填充数组，然后让用户输入一个整数。显示该整数出现了几次。\n\n## 解决方案\n\n两个子程序都可以作为方法编写，因为它们都返回一个值。`dice()`\
