  \ `40` 小时，超出部分按双倍计算。使用双分支选择结构，设计流程图并编写对应的 C# 程序，让用户输入时薪和时长，然后计算并显示净薪。净薪是扣除任何款项后实际支付给员工的金额。扣除项包括税收、医疗保险、退休计划等。假设总扣除率为\
  \ `30%`。同时也假设用户输入有效值。\n\n### 15) 定期保养会让你的车辆更可靠，减少故障、不便和不必要的支出。通常，你需要进行两种类型的服务：\n\
  a) 每 `6000` 英里一次小保养\nb) 每 `12000` 英里一次大保养\n\n使用双分支选择结构，编写一个 C# 程序，提示用户输入已行驶里程数，然后计算并显示距离下次保养还有多少英里，以及下次服务的类型。假设用户输入有效值。\n\
  \n### 16) 两辆车从静止开始，沿直线道路以恒加速度运动一段时间。使用双分支选择结构，编写一个 C# 程序，提示用户输入两辆车行驶的时间（两车相同）以及各自的加速度，然后计算并显示它们之间的距离，并根据哪辆车领先显示“Car\
  \ A is first”或“Car B is first”。所需的公式为\n\n`S = u*t + 0.5*a*t²`\n\n其中：\n`S` 是汽车行驶的距离，单位为米\
  \ (m)\n`u` 是汽车的初速度，单位为米/秒 (m/sec)\n`t` 是汽车行驶的时间，单位为秒 (sec)\n`a` 是加速度，单位为每秒每秒 (m/sec²)\n\
  \n假设用户提供的加速度值互不同。同时也假设用户输入有效值。\n\n\n\n\n当执行多重选择决策结构时，会求值 `Boolean_Expression_1`。如果其求结果为真，则执行紧随其后的相应语句或语句块；然后跳过结构的其余部分，继续执行多重选择决策结构之后可能存在的任何剩余语句。然而，如果\
  \ `Boolean_Expression_1` 的求结果为假，则执行流将求值 `Boolean_Expression_2`。如果其求结果为真，则执行紧随其后的相应语句或语句块，并跳过结构的其余部分。此过程将持续，直到有一个布尔表达式求值为真，或者没有剩余的布尔表达式为止。\n\
  \n当之前的没有一个布尔表达式求结果为真时，将执行最后一条语句或语句块 `N + 1`。此外，这最后一个语句或语句块 `N + 1` 是可选的，可以省略。这取决于你试图解决的算法。\n\
  \nC# 语句的通用形式为：\n\n```csharp\nif (Boolean_Expression_1) {A statement or block of\
  \ statements 1}else if (Boolean_Expression_2) {A statement or block of statements\
  \ 2}else if (Boolean_Expression_3) {A statement or block of statements 3}...else\
  \ if (Boolean_Expression_N) {A statement or block of statements N}else {A statement\
  \ or block of statements N + 1}\n```\n\n![](img/notice.jpg)最后一条语句或最后一个语句块 `N + 1`\
  \ 是可选的，可以省略（你也需要省略关键字 `else`）。\n\n这里展示了一个简单的示例。\n\n![](img/my_exercise_header.png)\
  \ project_18.1\n```csharp\nstring name;\nConsole.Write(\"What is your name? \");\n\
  name = Console.ReadLine();\nif (name == \"John\") {\n    Console.WriteLine(\"You\
  \ are my cousin!\");\n}else if (name == \"Aphrodite\") {\n    Console.WriteLine(\"\
  You are my sister!\");\n}else if (name == \"Loukia\") {\n    Console.WriteLine(\"\
