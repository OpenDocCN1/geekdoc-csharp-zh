  \n### 23.3 解决数学问题中的决策控制结构\n\n#### 练习 23.3-1 寻找 y 的值\n\n设计一个流程图并编写相应的 C# 程序，在以下公式中找到并显示\
  \ `y` 的值（如果可能）。\n\n.![Image](img/chapter23-05.png)\n\n##### 解决方案\n\n在此练习中，防止用户输入\
  \ `0` 或 `4` 的值至关重要，因为它们会导致分母为零。因此，程序需要考虑这些限制。流程图所示。\n\n![Image](img/chapter23-06.png)\n\
  \n相应的 C# 程序所示。\n\n![](img/my_exercise_header.png) `project_23.3-1`\n\n```csharp\n\
