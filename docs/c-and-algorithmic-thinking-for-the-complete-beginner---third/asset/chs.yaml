  \ / (2 * a);\n            x2 = (-b - Math.Sqrt(D)) / (2 * a);\n            Console.WriteLine(\"\
  Roots: \" + x1 + \", \" + x2);\n        } else {\n            x = -b / (2 * a);\n\
  \            Console.WriteLine(\"One double root: \" + x);\n        }\n    } else\
  \ {\n        Console.WriteLine(\"Complex Roots\");\n    }\n} else {\n    if (b !=\
  \ 0) {\n        x = -c / b;\n        Console.WriteLine(\"Root: \" + x);\n    } else\
  \ if (c != 0) {\n        Console.WriteLine(\"Undefined\");\n    } else {\n     \
  \   Console.WriteLine(\"Indeterminate form\");\n    }\n}\n```\n\n### 23.4 连续值范围系列练习\n\
  \n正如你已经所看到的，在许多问题中，变量的值或表达式的结果可以定义必须执行哪个语句或语句块。在接下来的练习中，你将学习如何测试一个值或表达式的结果是否属于特定的值范围（一系列连续值范围）。\n\
  \n\n\n\n假设你想显示一条消息，表示女性在不同温度下可能穿着的衣服类型。\n\n| 室外温度（华氏度） | 女性可能穿着的衣服类型 |\n| --- |\
  \ --- |\n| 温度 < 45 | 毛衣、外套、牛仔裤、衬衫、鞋子 |\n| 45 ≤ 温度 < 65 | 毛衣、牛仔裤、夹克、鞋子 |\n| 65 ≤\
  \ 温度 < 75 | 七分裤、短裤、T 恤、背心、人字拖、运动鞋 |\n| 75 ≤ 温度 | 短裤、T 恤、背心、运动短裙、裙子、人字拖 |\n\n一眼看上去，单分支决策结构似乎是逻辑上的最佳选择。虽然这并不是错误，但更深入的分析表明，每个条件之间都是相互依赖的，这意味着当其中一个条件为真时，其他所有条件都不应被评估。你只需要从一组可能性中选择一个备选方案。\n\
  \n要解决这类练习题，你可以使用多分支决策结构或嵌套决策控制结构。然而，前者是最佳选择，因为它更方便并增加了可读性，正如接下来的代码段所示。\n\n```\n\
  if (temperature < 45)Console.WriteLine(\"Sweater, coat, jeans, shirt, shoes\");else\
  \ if (temperature >= 45 && temperature < 65)Console.WriteLine(\"Sweater, jeans,\
  \ jacket, shoes\");else if (temperature >= 65 && temperature < 75)Console.WriteLine(\"\
  Capris, shorts, t-shirt, tank top, flip flops, athletic shoes\");else if (temperature\
  \ >= 75)Console.WriteLine(\"Shorts, t-shirt, tank top, skort, skirt, flip flops\"\
  );\n```\n\n然而，仔细观察可以发现，所有下划线的布尔表达式实际上并不是需要的。例如，如果第一个布尔表达式 `(temperature < 45)` 结果为假，执行流将继续评估第二个布尔表达式。然而在这一步中，由于第一个布尔表达式已经评估为假，变量\
  \ `temperature` 绝对大于或等于 45。因此，布尔表达式 `temperature >= 45` 在进行评估时，显然为真，因此可以省略。同样的逻辑适用于所有情况；你可以省略所有下划线的布尔表达式。\n\
  \n这里显示最终代码段，已删除了所有不必要的评估。\n\n```\nif (temperature < 45)Console.WriteLine(\"Sweater,\
  \ coat, jeans, shirt, shoes\");else if (temperature < 65)Console.WriteLine(\"Sweater,\
  \ jeans, jacket, shoes\");else if (temperature < 75)Console.WriteLine(\"Capris,\
  \ shorts, t-shirt, tank top, flip flops, athletic shoes\");elseConsole.WriteLine(\"\
  Shorts, t-shirt, tank top, skort, skirt, flip flops\");\n```\n\n### 练习 23.4-1 计算折扣\n\
