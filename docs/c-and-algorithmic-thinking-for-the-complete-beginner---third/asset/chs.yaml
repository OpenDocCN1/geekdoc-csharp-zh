  \n### 练习 30.1-5 根据用户意愿次数迭代\n\n编写一个 C# 程序，提示用户输入两个数字，然后根据用户意愿的次数计算并显示第一个数字的第二个数字的幂。在每次计算结束后，程序必须提示用户是否再次计算。程序接受所有形式，如“yes”、“YES”、“Yes”。\n\
