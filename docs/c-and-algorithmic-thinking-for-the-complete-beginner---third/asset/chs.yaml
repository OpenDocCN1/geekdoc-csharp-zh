  ### 13) 2004 年雅典奥运会的远跳运动员参加了三次不同的资格赛跳。一名运动员为了晋级，必须达到至少 `8` 米的平均距离。编写一个 C# 程序，提示用户输入三次跳跃成绩，当平均值大于等于\
