  | 12 | `i >= a` | 求值为 false | 4 | | |\n\n#### 练习 26.1-3 计数迭代次数\n\n计算以下代码段在执行两次时的总迭代次数。\n\
  \n两次执行的输入值为：(i) `6` 和 (ii) `5`。\n\n```csharp\nn = Convert.ToInt32(Console.ReadLine());\n\
  for (i = 5; i <= n; i++) {\n    Console.WriteLine(i);\n}\n```\n\n##### 解答案\n\n为了更好地理解过程，与其创建跟踪表，你只需设计相应的流程图。\n\
  \n![Image](img/chapter26-04.png)\n\n从这个流程图片段可以看出：i) 对于输入值 5，布尔表达式求值为 true，执行流进入循环。变量\
