  \n### 解决方案\n\n为了解决这个练习，将使用 `while` 语句。根据第 29.3 节 中讨论的“Ultimate”规则，解决此问题的预测试循环结构如下。\n\
  \n```csharp\nx = Convert.ToDouble(Console.ReadLine()); // 初始化 x\nwhile (testInteger(x))\
  \ { // 依赖于 x 的布尔表达式\n    一条语句或语句块\n    x = Convert.ToDouble(Console.ReadLine());\
  \ // 更新/修改 x\n}\n```\n\n![](img/notice.jpg) 语句 `while (testInteger(x))` 等同于语句 `while\
  \ (testInteger(x) == true)`。\n\n接下来给出最终的解决方案。\n\n![](img/my_exercise_header.png)\
  \ `project_38.1-2`\n\n```csharp\nbool testInteger(double number) {\n    bool returnValue\
  \ = false;\n    if (number == (int)(number)) {\n        returnValue = true;\n  \
  \  }\n    return returnValue;\n}\nint count;\ndouble total, x;\ntotal = 0;\ncount\
  \ = 0;\nx = Convert.ToDouble(Console.ReadLine()); // 初始化 x\nwhile (testInteger(x))\
  \ { // 依赖于 x 的布尔表达式\n    if (x > 0) {\n        total += x;\n        count++;\n \
  \   }\n    x = Convert.ToDouble(Console.ReadLine()); // 更新/修改 x\n}\nif (count >\
  \ 0) {\n    Console.WriteLine(total / count);\n}\n```\n\n![](img/notice.jpg) 注意最后一个单一分支决策结构\
  \ `if (count > 0)`。为了让程序满足确定性（definiteness）属性是必要的。考虑一下！如果用户从一开始就输入一个实数（浮点数），变量 `count`\
  \ 最终将包含值为零的值。\n\n![](img/notice.jpg) 下述方法可以作为之前方法的替代。它直接返回布尔表达式 `number == (int)(number)`\
  \ 的结果（true 或 false）。\n\n```csharp\nbool test_integer(double number) {\n    return\
  \ number == (int)(number);\n}\n```\n\n## 练习 38.1-3 寻找奇数正整数的和\n\n执行以下操作：\n\ni) 编写一个名为\
