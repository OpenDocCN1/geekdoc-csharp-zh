  \n### 37.1 两个子程序可以使用同名的变量吗？\n\n每个子程序都使用自己的内存空间来存储变量的值。即使是主代码也有自己的内存空间！这意味着你可以在主代码中有一个名为\
  \ `test` 的变量，在一个子程序中有一个名为 `test` 的变量，在另一个子程序中又有一个名为 `test` 的变量。请注意！这三个变量是三个完全不同的变量，位于不同的内存位置，并且可以持有完全不同的值。\n\
  \n如下程序所示，在三个不同的内存位置上有三个名为 `test` 的变量，每一个都持有一个完全不同的值。下面的追踪表可以帮助你理解到底发生了什么。\n\n![](img/my_exercise_header.png)\n\
  \n```\nproject_37.1\nvoid f1() {\n    string test;\n    test = \"Testing!\";\n \
  \   Console.WriteLine(test);\n}\nvoid f2(int test) {\n    Console.WriteLine(test);\n\
  }\n//Main code starts here\nint test;\ntest = 5;\nConsole.WriteLine(test);\nf1();\n\
  f2(10);\nConsole.WriteLine(test);\n```\n\n追踪表所示所示。\n\n| 步骤 | 语句 | 备注 | 主代码 | void\
  \ 方法 f1() | void 方法 f2() |\n| --- | --- | --- | --- | --- | --- |\n| | test | test\
  \ | | | |\n| 1 | test = 5 | | 5 | | |\n| 2 | .WriteLine(test) | 它显示为：5 | 5 | | |\n\
  | 3 | f1() | 调用了 f1() | | ? | |\n| 4 | test = \"Testing!\" | | | Testing! | |\n\
  | 5 | .WriteLine(test) | 它显示为：Testing! | | Testing! | |\n| 6 | f2(10) | 调用了 f2()\
  \ | | | 10 |\n| 7 | .WriteLine(test) | 它显示为：10 | | | 10 |\n| 8 | .WriteLine(test)\
  \ | 它显示为：5 | 5 | | |\n\n![](img/notice.jpg)\n注意，子程序中使用的变量只要子程序正在执行就会一直“存在”。这意味着在调用子程序之前，它的任何变量（包括形式参数列表中的变量）都不存在于主内存（RAM）中。它们在子程序被调用时被定义在主内存中，并在子程序结束且执行流返回到调用者时，它们都会从主内存中移除。只有“永远”存在（或者至少在\
  \ C# 程序执行期间）的变量是主代码的变量和全局变量！你将在第 37.6 节 中学习更多关于全局变量的知识。\n\n### 37.2 子程序可以调用另一个子程序吗？\n\
  \n到目前为止，你可能认为只有主代码可以调用子程序。然而，事实并非如此！子程序可以调用任何其他子程序，而该子程序又可以调用另一个子程序，以此此类推。你可以进行任何想要的组合。例如，你可以写一个调用\
  \ `void` 方法的方法、一个调用方法的 `void` 方法、一个调用另一个方法的方法，甚至一个调用 C# 内置方法之一的方法。\n\n接下来的示例恰恰展示了这种情况。主代码调用\
  \ `void` 方法 `displaySum()`，而该方法又调用方法 `add()`。\n\n![](img/my_exercise_header.png)\n\
  \n```\nproject_37.2\nint add(int number1, int number2) {\n    int result;\n    result\
  \ = number1 + number2;\n    return result;\n}\nvoid displaySum(int num1, int num2)\
  \ {\n    Console.WriteLine(add(num1, num2));\n}\n//Main code starts here\nint a,\
  \ b;\na = Convert.ToInt32(Console.ReadLine());\nb = Convert.ToInt32(Console.ReadLine());\n\
  displaySum(a, b);\n```\n\n![](img/notice.jpg)\n当 `add()` 执行 `return` 语句时，它返回到调用者，即\
  \ `void` 方法 `displaySum()`。然后，当 `displaySum()` 方法执行结束时，它返回到调用者，即主代码。\n\n![](img/notice.jpg)\n\
  注意，对这两个子程序的编写顺序没有限制。如果 `displaySum()` 写在 `add()` 之前，结果也是完全一样的。\n\n### 37.3 按值传递和按引用传递参数\n\
  \n在 C# 中，变量是按值传递给子程序的。这意味着如果参数在子程序内部被更改，它在外部不会发生改变。请看以下示例。\n\n![](img/my_exercise_header.png)\n\
  \n```\nproject_37.3\nvoid f1(int b) {\n    b++;\n    Console.WriteLine(b);\n}\n\
  //Main code starts here\nint a;\na = 10;\nf1(a);\nConsole.WriteLine(a);\n```\n\n\
  变量 `a` 的值 `10` 通过参数 `b` 传递给 void 方法 `f1()`。然而，尽管变量 `b` 的内容在子程序内部被修改，但当执行流返回主代码时，该更改不会影响变量\
  \ `a` 的值。\n\n在上一个示例中，主代码和子程序使用的是两个不同的变量名。然而，如果是主代码和子程序使用了两个同名的变量，结果也是一样的。接下来的示例的操作方式和结果与上一个示例完全相同。\n\
  \n```\nproject_37.3b\nvoid f1(int a) {\n    a++;\n    Console.WriteLine(a);\n}\n\
  //Main code starts here\nint a;\na = 10;\nf1(a);\nConsole.WriteLine(a);\n```\n\n\
  \n\n\n尽管如此，如果你希望子程序能够更改参数的值，并且在子程序外部也能反映这一变化，你必须按引用传递参数。要这样做，你必须在形式参数列表和实际参数列表中，都在参数的类型前面加上（附加）`ref`\
  \ 关键字。请看下面的示例，在示例中，形式参数列表和实际参数列表参数 `b` 前面都加上了 `ref` 关键字。\n\n![](img/my_exercise_header.png)\
  \ project_37.3\n```csharp\nvoid f1(ref int b) {\n    b++;\n    Console.WriteLine(b);\
  \ //显示值 11\n}\n//Main code starts here\nint a;\na = 10;\nf1(ref a);\nConsole.WriteLine(a);\
  \ //显示值 11\n```\n\n但请注意一点：只有变量可以按引用传递。你不能像这里这样将常量值或表达式按引用传递。\n\n![](img/my_exercise_header.png)\
  \ project_37.3\n```csharp\nvoid f1(ref int b) {\n    b++;\n}\n//Main code starts\
  \ here\nint x;\nx = 9;\nf1(ref x);      //这运行正常！\nf1(ref 10);     //这是错误的！\nf1(ref\
  \ x + 1); //这也是错误的！\n```\n\n所以，正如你可能意识到的，按引用传递值可以为子程序“返回”一个或多个值提供间接的方法。在下一个示例中，方法\
  \ `divMod()` 将变量 `a` 除以变量 `b`，并找到整数商和余数。如果一切顺利，它返回 `true`；否则返回 `false`。此外，通过两个参数\
  \ `intQuotient` 和 `intRemainder`，该方法还间接返回了计算出的商和计算出的余数。\n\n![](img/my_exercise_header.png)\
  \ project_37.3\n```csharp\nbool divMod(int a, int b, ref int intQuotient, ref int\
  \ intRemainder) {\n    bool returnValue = true;\n    if (b == 0) {\n        returnValue\
  \ = false;\n    } else {\n        intQuotient = (int)(a / b);\n        intRemainder\
  \ = a % b;\n    }\n    return returnValue;\n}\n//Main code starts here\nint val1,\
  \ val2;\nint intQ = 0, intR = 0;\nbool ret;\nval1 = Convert.ToInt32(Console.ReadLine());\n\
  val2 = Convert.ToInt32(Console.ReadLine());\nret = divMod(val1, val2, ref intQ,\
  \ ref intR);\nif (ret == true) {\n    Console.WriteLine(intQ + \"  \" + intR);\n\
  } else {\n    Console.WriteLine(\"Sorry, wrong values entered!\");\n}\n```\n\n![](img/remember.jpg)\
  \ `ref` 关键字必须在形式参数列表和实际参数列表中都位于参数类型之前。\n\n![](img/notice.jpg) 关于形式参数列表中参数的一个非常好的策略是将所有按值传递的参数写在所有按引用传递的参数之前。\n\
  \n### 37.4 传递和或返回数组\n\n将数据结构作为参数传递给子程序与传递简单变量一样。下一个示例将数组 `a` 传递给 `void` 方法 `display()`，后者将显示该数组。\n\
  \n![](img/my_exercise_header.png) project_37.4a\n```csharp\nconst int ELEMENTS =\
  \ 10;\nvoid display(int[] b) {\n    int i;\n    for (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n        Console.Write(b[i] + \"\\t\");\n    }\n}\n//Main code starts here\n\
  int i;\nint[] a = new int[ELEMENTS];\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n  \
  \  a[i] = Convert.ToInt32(Console.ReadLine());\n}\ndisplay(a);\n```\n\n与变量相反，C#\
  \ 中的数据结构默认是按引用传递的。这意味着如果你将（例如）数组传递给子程序，而该子程序更改了数组的一个或多个元素的值，这些变化在子程序外部也会反映出来。请看下面的示例。\n\
  \n![](img/my_exercise_header.png) project_37.4b\n```csharp\nvoid f1(int[] x) {\n\
  \    x[0]++;\n    Console.WriteLine(x[0]); //显示: 6\n}\n//Main code starts here\n\
  int[] y = {5, 10, 15, 20};\nConsole.WriteLine(y[0]); //显示: 5\nf1(y);\nConsole.WriteLine(y[0]);\
  \ //显示: 6\n```\n\n![](img/notice.jpg) 向子程序传递数组传递的是数组的引用，而不是数组的副本，这意味着 `y` 和 `x`\
  \ 实际上是同一个数组的别名。主内存（RAM）中只存在数组的一个副本。如果子程序更改了元素的值，此变化也会反映在主程序中。\n\n在下一个示例中，C# 程序必须找到数组\
  \ `t` 的三个最小值值。为此，程序调用并通过其形式参数 `x` 将数组传递给 `void` 方法 `getArray()`，该方法反过来使用插入排序算法对数组\
  \ `x` 进行排序。当执行流返回到主代码时，数组 `t` 也被排序了。这是因为正如前面所说，C# 中的数组是按引用传递的。因此，主代码最终做的只是显示数组前三个元素的值。\n\
