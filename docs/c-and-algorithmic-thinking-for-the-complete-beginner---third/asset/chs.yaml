  \    d) `/* This will be executed */ Console.WriteLine(\"Hello Aphrodite\");`\n\
  \    e) 以上都不是\n\n## 第 5 章：变量与常量\n\n### 5.1 什么是变量？\n\n在计算机科学中，变量是计算机主内存（RAM）中的一个位置，程序可以在其中存储一个值并在程序执行时更改它。\n\
  \n将变量想象成一个透明的盒子，你可以在其中放入并持有一个东西，一次只能有一个。因为盒子是透明的，你也可以看到里面包含了什么。此外，如果你有多个盒子，你可以给每个起一个独特的名称。例如，你可以三个三个盒子分别命名为\
  \ `numberA`、`numberB` 和 `numberC`。\n\n![Image](img/chapter05-01.png)\n\n名为 `numberA`、`numberB`\
  \ 和 `numberC` 的盒子分别包含数字 13、8 和 4。当然，你可以随时查看甚至更改这些盒子的包含值。\n\n现在，假设有人让你计算前两个盒子的和并将其存在最后一个中。你必须遵循的步骤是：\n\
  1. 查看前两个盒子。\n2. 计算和。\n3. 将结果插入最后一个。\n\n由于每个盒子只能包含一个值，4 实际上被替换为 21。\n\n在流程图中，将值存储在变量的操作由左箭头表示。\n\
  \n![Image](img/chapter05-02.png)\n\n这种操作通常表示为“将一个值或表达式的结果赋值给变量”。箭头始终指向左侧。不允许使用右箭头。此外，在箭头左侧只能存在一个变量。\n\
  \n在真实的计算机科学中，这三个盒子实际上内存中的三个区域，命名为 `numberA`、`numberB` 和 `numberC`。\n\n![Image](img/chapter05-03.png)\n\
  \n当程序指示 CPU 执行以下语句时：\n```\nnumberC = numberA + numberB\n```\n它遵循与上一个示例相同的三个步骤过程：\n\
  1. 将 13 和 8 从内存区域 `numberA` 和 `numberB` 传输到 CPU。（这是第一步，你查看了盒子包含的值）。\n2. CPU 计算 13\
  \ + 8 的和。（这是第二步，你使用大脑计算和）。\n3. 将结果 21 从 CPU 传输到内存区域 `numberC`，替换现有的数字 4。（这是第三步，你把结果插入最后一个）。\n\
  \n执行后，内存看起来如下：\n\n![Image](img/chapter05-04.png)\n\n\n\n\n有时候，你可能需要一个在程序运行期间不能改变的值。这种值被称为**常量**（constant）。简单来说，常量可以被认为是一个被锁定的变量。这意味着当程序开始运行时，一个值会被赋值给该常量，此后，在程序运行过程中，没有任何东西可以改变该值。例如，在财务程序中，利率可以被声明为一个常量。\n\
  \n为常量提供一个描述性的名称还可以提高你程序的可读性，并帮助你避免一些错误。例如，假设你在程序中的许多处使用了值 `3.14159265`（但没有将其作为常量使用）。如果你在输入这个数字时犯了拼写错误，这将产生错误的结果。但是，如果给这个值取一个名字，那么名称中的任何拼写错误都会被编译器检测到，并且你会收到错误消息的通知。\n\
  \n在流程图中，你可以用等号（`=`）来表示将常量设置为某个值的操作。\n\n.![Image](img/chapter05-06.png)\n\n![](img/notice.jpg)本书使用大写字母来区分常量和变量。\n\
  \n考虑这样一个算法：它允许用户输入三个不同产品的价格，然后计算并显示每个产品的 20% 增值税（称为 `VAT`）。图 5–1 显示了在不使用常量时的这一过程。\n\
  \n.![Image](img/chapter05-07.png)\n\n图 5–1 不使用常量计算三个产品的 20% VAT\n\n尽管这个算法是完全正确的，但问题在于作者使用了三次\
  \ 20% 的增值税税率（`20/100`）。如果这是一个真实的计算机程序，CPU 将被迫独立地计算三次除法结果（`20/100`）。\n\n![](img/notice.jpg)通常情况下，除法和乘法是消耗\
  \ CPU 时间的操作，必须尽可能避免。\n\n一个更好的解决方案是使用变量，如图 5–2 所示。这减少了除法操作次数，也减少了出现拼写错误的可能性。\n\n\
  .![Image](img/chapter05-08.png)\n\n图 5–2 使用变量 `vat` 计算三个产品的 20% VAT\n\n这一次，除法（`20/100`）只被计算一次，然后使用其结果来计算每个产品的\
  \ VAT。但即使如此，这个算法（它以后可能会变成计算机程序）仍并不完美；`vat` 是一个变量，任何程序员都可能在程序下方意外改变它的值。\n\n理想的解决方案是将变量\
  \ `vat` 改为常量 `VAT`，如图 5–3 所示。\n\n.![Image](img/chapter05-09.png)\n\n图 5–3 使用常量 `VAT`\
  \ 计算三个产品的 20% VAT\n\n![](img/notice.jpg)注意，当在流程图中声明常量时，使用等号（`=`）而不是左箭头。\n\n这最后一个解决方案出于许多原因是最佳选择：\n\
  \n- 包括程序员在内的任何人都无法仅仅通过在程序的任何位置意外编写诸如 `VAT ← 0.60` 的语句来改变常量 `VAT` 的值。\n- 拼写错误的可能性降到了最低。\n\
  - 算术操作次数保持在最低水平。\n- 如果某天财政部长决定将增值税率从 20% 提高到 22%，程序员只需要修改一行代码即可！\n\n### 5.3 存在多少类型的变量和常量？\n\
  \n在大多数计算机语言中存在许多不同类型的变量和常量。这种多样性的原因是每个变量或常量可以持有的数据类型不同。大多数时候，变量和常量持有以下类型的数据。\n\n\
  - **整数 (Integers)**：整数值是一个没有小数部分的正负数，例如 `5`、`100`、`135`、`-25` 和 `-5123`。\n- **实数\
  \ (Reals)**：实数值是一个包含小数部分的正负数，例如 `5.1`、`7.23`、`5.0`、`3.14` 和 `-23.78976`。实数也被称为浮点数（floats）。\n\
  - **布尔值 (Booleans)**：布尔变量（或常量）只能持有两个值之一：`true` 或 `false`。\n- **字符 (Characters)**：字符是一个字母数字（字母、符号或数字），通常包含在单引号或双引号中，例如\
  \ `\"a\"`、'c'` 或 `\"@\"`。在计算机科学中，字符序列被称为字符串（string）！！！“string”这个词可能会让你联想到某种可以穿的东西，但遗憾的是它不是。请保持你那肮脏宝贵的脑袋专注于计算机科学！字符串的示例有\
  \ `\"Hello Zeus\"`、`\"I am 25 years old\"` 或 `\"Peter Loves Jane For Ever\"`。\n\n\
  ![](img/notice.jpg)在 C# 中，字符串必须包含在双引号内。\n\n### 5.4 C# 中变量和常量的命名规则和约定\n\n当你为变量或常量命名时，必须遵循某些规则。\n\
  \n- 变量或常量的名称应仅由拉丁字符（英语大小写字母）、数字和下划线字符（`_`）组成。对于常量，尽管允许小写字母，但建议只使用大写字母。这种约定有助于在视觉上将常量与变量区分开。变量名的示例有\
  \ `firstName`、`lastName1` 和 `age`，而常量名的示例有 `VAT` 和 `COMPUTER_NAME`。\n- 变量和常量名称对大小写敏感，这意味着大写和小写字母之间存在区别。例如，`myVAR`、`myvar`、`MYVAR`\
  \ 和 `MyVar` 是四个不同的名称。\n- 不允许出现空格。如果变量或常量名称包含多个单词，可以在单词之间使用下划线（`_`），或者将每个单词（除第一个）的首字母大写（驼峰命名法）。例如，变量名\
  \ `student first name` 是错误的。相反，你可以使用 `student_first_name`，或者更好的 `studentFirstName`。\n\
  - 有效的变量或常量名称可以以字母或下划线（`_`）开头。允许使用数字，但不能放在开头。例如，1studentName` 写法不正确。你可以使用 `studentName1`\
  \ 或 `student1Name`。\n- 变量或常量名称通常以描述其包含的数据含义和作用的方式命名。例如，存储温度值的变量可以命名为 `temperature`、`temp`\
  \ 或 `t`。\n- 不要使用 C# 的任何关键字作为变量或常量名称。例如，`while` 不能作为有效的变量或常量名称，因为它是 C# 的关键字。\n\n\n\
  \n\n以下是一些展示如何在不同高级计算机语言中声明变量的示例。\n\n| 声明语句 | 高级计算机语言 |\n| :--- | :--- |\n| `Dim\
  \ sum As Integer` | Visual Basic |\n| `int sum;` | C#, C, C++, Java 等许多语言 |\n| `sum:\
  \ Integer;` | Pascal, Delphi |\n| `var sum;` | Javascript |\n\n### 5.6 如何在 C# 中声明变量\n\
  \nC# 是一种强类型编程语言。这意味着每个变量都必须关联一个特定的数据类型。在 C# 中，一些原始数据类型包括：`bool`、`byte`、`short`、`int`、`long`、`float`、`double`、`decimal`\
  \ 和 `char`。使用哪一个取决于具体问题！\n\n►`type bool` 只能包含两个可能的值：即 `true` 或 `false`\n►`type byte`\
  \ 可以存储 0 到 255 之间的无符号整数\n►`type sbyte` 可以存储 `-128` 到 `+127` 之间的有符号整数\n►`type ushort`\
  \ 可以存储 0 到 `+65535` 之间的无符号整数\n►`type short` 可以存储 `-32768` 到 `+32767` 之间的有符号整数\n\
  ►`type uint` 可以存储 0 到 `+2³² − 1` 之间的无符号整数\n►`type int` 可以存储 `-2³¹` 到 `+2³¹ − 1`\
  \ 之间的有符号整数\n►`type ulong` 可以存储 0 到 `+2⁶⁴ − 1` 之间的无符号整数\n►`type long` 可以存储 `-2⁶³`\
