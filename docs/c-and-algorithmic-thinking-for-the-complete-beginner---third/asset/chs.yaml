  \ `C#` 程序的说明在现阶段是不必要的。当你到达第 9 章时，将需要这些说明。\n\n## 第 2 章复习\n\n### “基础知识”复习\n\n### 字谜游戏\n\
  \n1) 完成以下字谜。\n\n![Image](img/review01-01.png)\n\n横向\n\n1) 语句。\n3) `Windows` 是一种系统。\n\
