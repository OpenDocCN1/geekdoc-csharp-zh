  \ 0` 中，系数 `a`、`b` 和 `c` 是已知的实数，`x` 代表要找到的未知数。因为 `x` 的幂是二次，此方程被分类为二次方程。\n\n方程的根是使该方程成立的\
  \ `x` 值；即等式左侧 `ax² + bx + c` 等于零。\n\n在此练习中，用户必须为系数 `a`、`b` 和 `c` 输入值，程序必须找到使 `ax²\
  \ + bx + c` 等于零的 `x` 值。\n\n根据 `a` 的值，该问题可以被分为两个子问题：\n\ni) 如果系数 `a` 不等于零，可以使用判别式\
  \ `D = b² - 4ac` 找到根。请注意，下面的解决方案在 `D < 0` 时寻找复根；这超出了本书的范围。\nii) 如果系数 `a` 等于零，方程变为\
  \ `bx + c = 0`，其解决方案已提供。\n\n所有必要的路径所示：\n\n![Image](img/chapter23-13.png)\n\n右侧的路径（a\
  \ = 0）是线性方程。\n\n![](img/my_exercise_header.png) `project_23.3-4`\n\n```csharp\n\
  double a, b, c, D, x1, x2, x;\nConsole.WriteLine(\"Enter values for a, b and c:\
  \ \");\na = Convert.ToDouble(Console.ReadLine());\nb = Convert.ToDouble(Console.ReadLine());\n\
  c = Convert.ToDouble(Console.ReadLine());\nif (a != 0) {\n    D = b * b - 4 * a\
