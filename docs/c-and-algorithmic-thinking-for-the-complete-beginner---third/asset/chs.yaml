  \n编写一个 C# 程序，提示用户输入一个句子，然后检查其大小写和标点。程序必须判断字符串是否以大写字母开头并以标点符号结束（仅检查句号、问号和叹号）。\n\n\
  解决方案\n\n在这个练习中，你需要分离字符串的第一个和最后一个字符。如你所知，可以使用下标法访问字符串中的任何单个字符。可以使用索引 `0` 访问第一个字符，索引\
  \ `1` 访问第二个字符，以此此类推。\n\n因此，可以使用以下 C# 语句分离字符串的第一个字符。\n\n`firstChar = sentence[0]`\n\
  \n另一方面，最后一个字符的索引比字符串长度少 1。你可以使用 `Length` 属性获取任何字符串的长度。使用以下语句可以分离字符串的最后一个字符：\n\n\
  `length = sentence.Length`\n`lastChar = sentence[length - 1]`\n\n或者使用更简洁的语句\n\n\
  `lastChar = sentence[sentence.Length - 1]`\n\nC# 程序如下所示。\n\n![](img/my_exercise_header.png)\
  \ 项目 _23.5-3\n\n```csharp\nstring sentence, firstChar, lastChar;\nbool sentenceIsOkay;\n\
  Console.Write(\"Enter a sentence: \");\nsentence = Console.ReadLine();\n// 获取第一个字符并转换为字符串\n\
  firstChar = \"\" + sentence[0];\n// 获取最后一个字符并转换为字符串\nlastChar = \"\" + sentence[sentence.Length\
  \ - 1];\nsentenceIsOkay = true;\nif (firstChar != firstChar.ToUpper()) {\n    sentenceIsOkay\
  \ = false;\n} else if (lastChar != \".\" && lastChar != \"?\" && lastChar != \"\
  !\") {\n    sentenceIsOkay = false;\n}\nif (sentenceIsOkay) {\n    Console.WriteLine(\"\
  Sentence is okay!\");\n}\n```\n\n\n\n\n\n回文数是指在反转数字后仍然保持相同的数字。例如，数字 `13631` 就是一个回文数。编写一个\
  \ C# 程序，让用户输入一个五位整数，并测试该数字是否为回文数。此外，当用户输入 `float` 或任何少于或大于五位的整数时，必须为每种输入错误显示不同的错误信息。\n\
  \n（注意：这涉及数据验证！）\n\n# 解决方案\n\n实际上有两种不同的方法！第一种是将数字的各个位拆分为五个不同的变量，而第二种方法是将数字当作字符串处理。让我们分析一下这两种方法！\n\
  \n## 方法一\n\n要测试用户输入的是否回文数，你需要像在第 13 章中学习的那样，将其数字拆分为五个不同的变量。然后，你可以检查第 `1^(st)` 位是否等于第\
  \ `5^(th)` 位，第 `2^(nd)` 位是否等于第 `4^(th)` 位。如果结果为真，则该数字是回文数。\n\n为了验证数据输入，你需要检查用户是否输入了五位数。请记住，所有五位数都在\
  \ `10000` 到 `99999` 之间。因此，你只需要将数据输入限制在这个范围内。\n\n为了显示许多不同的错误信息，最佳实践是使用多重选择决策结构，首先检查所有情况的数据输入有效性，然后尝试解决所需的问题。例如，如果你需要检查各种错误，可以像下面这样做。\n\
  \n![Image](img/chapter23-23.png)\n\n这里是最终的 C# 程序。\n\n![](img/my_exercise_header.png)\n\
  \n```csharp\nproject_23.5-4aint digit1, r, digit2, digit3, digit4, digit5;\ndouble\
  \ x;\nx = Convert.ToDouble(Console.ReadLine());\nif (x != (int)x) {\n    Console.WriteLine(\"\
  You entered a float\");\n} else if (x < 10000) {\n    Console.WriteLine(\"You entered\
  \ less than five digits\");\n} else if (x > 99999) {\n    Console.WriteLine(\"You\
  \ entered more than five digits\");\n} else {\n    //将 x 的各个位拆分为 5 个不同的变量\n    digit1\
  \ = (int)(x / 10000);\n    r = (int)x % 10000;\n    digit2 = (int)(r / 1000);\n\
  \    r = r % 1000;\n    digit3 = (int)(r / 100);\n    r = r % 100;\n    digit4 =\
  \ (int)(r / 10);\n    digit5 = r % 10;\n    if (digit1 == digit5 && digit2 == digit4)\
  \ {\n        Console.WriteLine(\"Palindrome\");\n    } else {\n        Console.WriteLine(\"\
  Not Palindrome\");\n    }\n}\n```\n\n## 方法二\n\n这种方法将数字当作字符串处理。它比较第一个字符和最后一个字符，以及第二个字符和倒数第二个字符。如果它们相等，意味着该数字是回文数。这里是\
  \ C# 程序。\n\n![](img/my_exercise_header.png)\n\n```csharp\nproject_23.5-4bstring\
  \ xStr;\ndouble x;\nx = Convert.ToDouble(Console.ReadLine());\nif (x != (int)x)\
  \ {\n    Console.WriteLine(\"You entered a float\");\n} else if (x < 10000) {\n\
  \    Console.WriteLine(\"You entered less than five digits\");\n} else if (x > 99999)\
  \ {\n    Console.WriteLine(\"You entered more than five digits\");\n} else {\n \
  \   xStr = \"\" + (int)x;\n    if (xStr[0] == xStr[4] && xStr[1] == xStr[3]) {\n\
  \        Console.WriteLine(\"Palindrome\");\n    } else {\n        Console.WriteLine(\"\
  Not palindrome\");\n    }\n}\n```\n\n### 23.6 布尔表达式参考与实用贴士\n\n本节总结了你目前为止在 C# 旅途中遇到的所有布尔表达式，以及额外的表达式和实用的技巧。无论你是初学者还是资深程序员，这些表达式和技巧将成为你编程工具箱中宝贵的工具。请随身携带，因为你不知道它们何时会派上用场。对于某些表达式，提供了两种或两种以上方法来实现所需的结果。\n\
  \n1) 如何检查 `x` 中的数字是否在 `A` 和 `B` 之间：`x >= A && x <= B`\n2) 如何检查 `x` 中的数字是否不在 `A`\
  \ 和 `B` 之间：`!(x >= A && x <= B)` 或 `x < A || x > B`\n3) 如何检查 `x` 是否等于 `A`、`B` 或\
  \ `C`：`x == A || x == B || x == C`\n4) 如何检查 `x` 既不等于 `A` 也不等于 `B`、不等于 `C`：`x !=\
  \ A && x != B && x != C` 或 `!(x == A || x == B || x == C)`\n5) 如何检查 `x` 是否包含整数。请注意变量\
  \ `x` 必须是 `double` 类型。`x == (int)x`\n6) 如何检查 `x` 是否包含 `float`：`x != (int)x`\n7)\
  \ 如何检查 `x` 是否包含偶数：`x % 2 == 0`、`x % 2 != 1`、`!(x % 2 == 1)` 或 `!(x % 2 != 0)`\n\
