  ```csharp\ndouble a, b, x;\na = Convert.ToDouble(Console.ReadLine());\nb = Convert.ToDouble(Console.ReadLine());\n\
  if (b != 3) {x = a / (b - 3);}\nConsole.WriteLine(x);\n```\n\n### 16.3 复习题：单选择\n\
  \n为以下每个陈述选择正确答案。\n\n1) 单分支决策结构用于以下情况：\na) 语句一个接一个地执行。\nb) 在执行某些语句之前必须做出决策。\nc) 以上都不是。\n\
  d) 以上都是。\n\n2) 单分支决策结构包含的语句或语句块位于：\na) 仅假路径。\nb) 两条路径。\nc) 仅真路径。\n\n3) 在下面的代码片段中，\n\
  ```csharp\nif (x == 3) x = 5;\ny++;\n```\n语句 `y++` 被执行的情况是：\na) 仅当变量 `x` 的值为 3 时。\n\
  b) 仅当变量 `x` 的值为 5 时。\nc) 仅当变量 `x` 的值不等于 3 时。\nd) 总是执行。\n\n4) 在下面的代码片段中，\n```csharp\n\
  if (x % 2 == 0) y++;\n```\n语句 `y++` 被执行的情况是：\na) 变量 `x` 正好被 2 整除。\nb) 变量 `x` 包含一个偶数。\n\
  c) 变量 `x` 不包含奇数。\nd) 以上都是。\ne) 以上都不是。\n\n5) 在下面的代码片段中，\n```csharp\nx = 3 * y;\n\
  if (x > y) y++;\n```\n语句 `y++`：\na) 总是执行。\nb) 永远不执行。\nc) 仅当变量 `y` 包含正值时执行。\nd) 以上都不是。\n\
