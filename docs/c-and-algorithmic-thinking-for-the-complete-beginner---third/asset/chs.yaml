  \n## 第 11 章：数字处理\n\n## 11.1 引言\n\n就像每种高级编程语言一样，C# 提供了许多现用的子程序（称为方法），你可以随地、随地地使用它们。\n\
  \n![](img/notice.jpg)\n\n“子程序”仅仅是一组被封装成单个单元的语句。每个子程序都有一个描述性的名称并执行特定的任务。\n\n为了更好地理解\
  \ C# 的方法，让我们来看看计算正数平方根的赫伦（Heron）迭代公式。\n\n![Image](img/chapter11-01.png)\n\n其中：\n\
  - `y` 是你想要找到平方根的数字\n- `x[n]` 是 `y` 的平方根的第 n 次迭代值\n\n你现在可能感到有些沮丧。你可能认为你应该编写一个程序来通过赫伦公式来计算一个数字的平方根，但事实并非如此！目前，没有人用这种方法计算数字的平方根。幸运的是，C#\
  \ 包含一个为此目的的方法！这个方法实际上是一个小的子程序，被命名为 `Math.Sqrt`，你只需要通过它的名称来调用它，它就会为你完成工作。`Math.Sqrt`\
  \ 方法可能使用了赫伦公式，或者使用了其他方法。`Math.Sqrt` 可能会提供正确的答案。即使你还需要更多，也可以访问：[`tinyurl.com/2r45`](https://tinyurl.com/2r45)\n\
  - [`learn.microsoft.com/en-us/dotnet`](https://learn.microsoft.com/en-us/dotnet)\n\
  \n![Image](img/chapter11-02.png)\n\n![](img/notice.jpg) 数学方法用于需要计算平方根、正弦、余弦、绝对值。\n\
  \n## 11.2 有用的数学方法（子程序）及更多\n\n### 绝对值\n`Math.Abs(number)`\n\n该方法返回数字的绝对值。\n\n示例：\n\
  ```csharp\ndouble a, b;\na = -5;\nb = Math.Abs(a);\nConsole.WriteLine(b); // 输出\
  \ 5\nConsole.WriteLine(Math.Abs(-5.2)); // 输出 5.2\n```\n\n### Pi\n`Math.PI`\n\n\
  它包含 π 值。注意 `Math.PI` 是一个常量，而不是方法。这就是为什么不需要括号。\n\n示例：\n```csharp\nConsole.WriteLine(Math.PI);\
  \ // 输出 3.141592653589793\n```\n\n### 正弦\n`Math.Sin(number)`\n\n该方法返回数字的正弦。数字的值必须弧度表示。你可以乘以\
  \ `Math.PI / 180` 将角度转换为弧度。\n\n示例：\n```csharp\ndouble a, b;\na = Math.Sin(3 * Math.PI\
  \ / 2);\nb = Math.Sin(270 * Math.PI / 180);\nConsole.WriteLine(a + \" \" + b); //\
  \ 输出 -1 -1\n```\n\n### 余弦\n`Math.Cos(number)`\n\n该方法返回数字的余弦。数字的值必须以弧度表示。你可以乘以 `Math.PI\
  \ / 180` 将角度转换为弧度。\n\n示例：\n```csharp\ndouble a, b;\na = Math.Cos(2 * Math.PI);\n\
  b = Math.Cos(360 * Math.PI / 180);\nConsole.WriteLine(a + \" \" + b); // 输出 1 1\n\
  ```\n\n### 正切\n`Math.Tan(number)`\n\n该方法返回数字的正切。数字的值必须以弧度表示。你可以乘以 `Math.PI / 180`\
  \ 将角度转换为弧度。\n\n示例：\n```csharp\ndouble a;\na = Math.Tan(10 * Math.PI / 180);\nConsole.WriteLine(a);\
  \ // 输出 0.17632698070846498\n```\n\n### 字符串转整数\n`Convert.ToInt32(value)`\n\n该方法将整数的字符串表示转换为等效的数值。\n\
  \n\n\n\n\n\n![](img/my_exercise_header.png) 项目 _11.2\n\n```csharp\nstring s1 = \"\
  5\";\nstring s2 = \"3\";\nint k;\nk = Convert.ToInt32(s1);\nConsole.WriteLine(k);\
  \ //显示为: 5\nConsole.WriteLine(Convert.ToInt32(s2)); //显示为: 3\nConsole.WriteLine(s1\
  \ + s2); //显示为: 53\nConsole.WriteLine(Convert.ToInt32(s1) + Convert.ToInt32(s2));\
  \ //显示为: 8\n```\n\n## 转换为实数\n\n`Convert.ToDouble(value)`\n\n此方法将实数的字符串表示转换为其数值等效值。\n\
  \n### 示例\n\n![](img/my_exercise_header.png) 项目 _11.2\n\n```csharp\nstring s1 = \"\
  6.5\";\nstring s2 = \"3.4\";\ndouble x;\nx = Convert.ToDouble(s1);\nConsole.WriteLine(x);\
  \ //显示为: 6.5\nConsole.WriteLine(Convert.ToDouble(s2)); //显示为: 3.4\nConsole.WriteLine(s1\
  \ + s2); //显示为: 6.53.4\nConsole.WriteLine(Convert.ToDouble(s1) + Convert.ToDouble(s2));\
  \ //显示为: 9.9\n```\n\n![](img/notice.jpg)在美国在美国，小数点分隔符是点（ . ）。但在许多国家，小数点分隔符是逗号（ ,\
  \ ）而不是点（ . ）。例如，如果你住在欧洲并尝试执行此代码（当 `s1 = \"6.5\"` 和 `s2 = \"3.4\"` 时），点（ . ）将被忽略。\n\
  \n## 整数值（类型转换）\n\n`(int)number`\n\n这返回 `number` 的整数部分。如果 `number` 包含小数部分，该部分在转换过程中将丢失。\n\
  \n### 示例\n\n![](img/my_exercise_header.png) 项目 _11.2\n\n```csharp\ndouble a = 5.4;\n\
  Console.WriteLine((int)a); //显示为: 5\nConsole.WriteLine((int)34); //显示为: 34\nConsole.WriteLine((int)34.9);\
  \ //显示为: 34\nConsole.WriteLine((int)-34.999); //显示为: -34\n```\n\n![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型的变量转换为另一种类型的方法。注意，`(int)`\
  \ 不是一个方法。它只是 C# 中一种将实数转换为整数的方法。同样注意，如果实数包含小数部分，该部分在转换过程中将丢失。\n\n## 实数值（类型转换）\n\n\
  `(double)number`\n\n这以实数形式返回数字。\n\n### 示例\n\n![](img/my_exercise_header.png) 项目\
  \ _11.2\n\n```csharp\nint a = 5;\nConsole.WriteLine(a / 2); //显示为: 2\nConsole.WriteLine((double)a\
  \ / 2); //显示为: 2.5\nConsole.WriteLine((double)a / 2); //显示为: 2.5\nConsole.WriteLine(a\
  \ / (double)2); //显示为: 2.5\nConsole.WriteLine((double)a / (double)2); //显示为: 2.5\n\
  Console.WriteLine(a / 2.0); //显示为: 2.5\n```\n\n![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型的变量转换为另一种类型的方法。注意，`(double)`\
  \ 不是一个方法。它只是 C# 中一种将整数转换为实数（float）的方法。\n\n![](img/notice.jpg)在 C# 中，两个整数相除的结果始终是一个整数。因此，在上一例的表达式\
  \ `a / 2` 中，由于变量 `a` 和数字 `2` 都是整数，结果是一个整数。如果你希望得到 `double` 类型的结果，除法操作数中至少有一个必须是\
  \ `double` 类型。\n\n## 幂\n\n`Math.Pow(number, exp)`\n\n此方法返回 `number` 升 `exp` 次幂的结果。\n\
  \n### 示例\n\n![](img/my_exercise_header.png) 项目 _11.2\n\n```csharp\ndouble a, b,\
  \ c;\na = 2;\nb = 3;\nConsole.WriteLine(Math.Pow(a, b)); //显示为: 8\nc = Math.Pow(3,\
  \ 2);\nConsole.WriteLine(c); //显示为: 9\n```\n\n![](img/notice.jpg)`Math.Pow()` 方法具有双重作用。除了用于计算一个数值相对于另一个值的幂外，它还用于通过已知数学公式计算数字的任意根\
  \ ![Image](img/chapter07-05.png)。例如，你可以写 `y = Math.Pow(x, 1 / 2.0)` 来计算 `x` 的平方根，或者写\
  \ `y = Math.Pow(x, 1 / 3.0)` 来计算 `x` 的立方根。\n\n## 随机\n\n`Next(minimum_value, maximum_value)`\n\
  \n此方法返回 `minimum_value` 到 `maximum_value - 1` 之间的伪随机整数。方法 `Next()` 定义在 `Random`\
  \ 类中。\n\n### 示例\n\n![](img/my_exercise_header.png) 项目 _11.2\n\n```csharp\nRandom\
  \ rnd = new();\nConsole.WriteLine(rnd.Next(0, 65536)); //显示为: 0 到 65535 之间的随机数\n\
  Console.WriteLine(rnd.Next(10, 100)); //显示为: 10 到 99 之间的随机数\nConsole.WriteLine(rnd.Next(5));\
  \ //显示为: 0 到 4 之间的随机数\n```\n\n![](img/notice.jpg)随机数广泛应用于游戏、模拟、加密等领域。例如，在视频游戏中，随机数可以用于生成关卡、决定敌人的行为或产生掉落物品。\n\
  \n## 舍入\n\n`Math.Round(number)`\n\n此方法返回与 `number` 最接近的整数。\n\n### 示例\n\n![](img/my_exercise_header.png)\
