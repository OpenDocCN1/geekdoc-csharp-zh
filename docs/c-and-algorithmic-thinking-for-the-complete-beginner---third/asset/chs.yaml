  #### 练习 34.5-4 线性搜索算法 – 在包含唯一值的一维数组中进行搜索\n\n编写一个代码片段，对一维数组进行搜索以找到用户提供的值。假设数组包含数值，且数组中的每个值都是唯一的。使用线性搜索算法。\n\
  \n**解答**\n\n这种情况与之前的情况大不同。由于数组中的每个值都是唯一的，当找到用户提供的值时，没有理由无故一直迭代到数组末尾，从而浪费 CPU 时间。实际上有三种方法！让我们分析所有方法！\n\
  \n**第一种方法——使用 break 语句**\n\n在这种方法中，当找到用户提供的值时，使用 `break` 语句跳出 `for`-循环。解决方案如下：\n\
  \n```csharp\nConsole.Write(\"Enter a value to search: \");\nneedle = Convert.ToDouble(Console.ReadLine());\n\
  found = false;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i] == needle)\
  \ {\n```\n\n\n\n\n\n```cs\nConsole.WriteLine(needle + \" found at position: \" +\
  \ i);\nfound = true;\nbreak;\n}}\nif (!found) {\n    Console.WriteLine(\"Nothing\
  \ found!\");\n}\n```\n\n或者你也可以用稍微不同的方式实现的功能。\n\n```cs\nConsole.Write(\"Enter a value\
  \ to search: \");\nneedle = Convert.ToDouble(Console.ReadLine());\nindexPosition\
  \ = -1;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i] == needle) {\n\
  \        indexPosition = i;\n        break;\n    }\n}\nif (indexPosition == -1)\
  \ {\n    Console.WriteLine(\"Nothing found!\");\n} else {\n    Console.WriteLine(needle\
  \ + \" found at position: \" + indexPosition);\n}\n```\n\n### 第二方法——使用标志位\n\n`break`\
  \ 语句并不是在所有计算机语言中都存在；由于本书的意图是教你“算法思维”（而不仅仅是 C# 支持的特殊语句），让我们来看另一种方法。\n\n在接下来的代码段中，当用户提供的值在数组\
  \ `haystack` 中找到时，变量 `found` 将强制执行执行流立即退出循环。\n\n```cs\nConsole.Write(\"Enter a value\
  \ to search: \");\nneedle = Convert.ToDouble(Console.ReadLine());\nfound = false;\n\
  i = 0;\nwhile (i <= ELEMENTS - 1 && !found) {\n    if (haystack[i] == needle) {\n\
  \        found = true;\n        indexPosition = i;\n    }\n    i++;\n}\nif (!found)\
  \ {\n    Console.WriteLine(\"Nothing found!\");\n} else {\n    Console.WriteLine(needle\
  \ + \" found at position: \" + indexPosition);\n}\n```\n\n### 第三方法——仅使用预测试循环结构\n\
  \n这种方法可能是这三种方法中效率最高的。`while` 循环遍历数组，将每个元素与 `needle` 进行比较。只要满足两个条件，循环就会继续：变量 `i`（代表索引）在数组\
  \ `haystack` 的有效范围内，且数组中当前索引处的值不等于 `needle`。如果两个条件都为真，变量 `i` 就会加以移动到下一个元素。这个过程一直持续，直到找到匹配项或到达数组末尾。\n\
  \n```cs\nConsole.Write(\"Enter a value to search: \");\nneedle = Convert.ToDouble(Console.ReadLine());\n\
  i = 0;\nwhile (i < ELEMENTS - 1 && haystack[i] != needle) {\n    i++;\n}\nif (haystack[i]\
  \ != needle) {\n    Console.WriteLine(\"Nothing found!\");\n} else {\n    Console.WriteLine(needle\
  \ + \" found at position: \" + i);\n}\n```\n\n### 练习 34.5-5 搜索社会安全号码\n\n在美国，社会安全号码（SSN）是一个九位的身份号码，适用于所有美国公民，用于出于社会安全之目的识别他们。编写一个\
