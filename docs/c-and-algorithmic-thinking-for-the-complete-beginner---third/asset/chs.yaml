  \n![](img/remember.jpg)决策符号始终有一个入口和两个出口路径！\n\n当然，你很快就会开始创建自己的算法了。这个特定的练习非常简单，在本章中作为特例提出，仅用于演示。在开始创建你自己的算法甚至编写\
  \ C# 程序之前，你需要学习更多知识。保持耐心！几章节之后，伟大的时刻就会降临！\n\n### 4.8 什么是“保留字”？\n\n在计算机语言中，保留字（或关键字）是具有严格预定义含义的单词——它被预留用于特殊用途，不能用于任何其他用途。例如，流程图中的\
  \ `Start`、`End`、`Read` 和 `Write` 词具有预定义的含义。它们分别代表开始、结束、数据输入和结果输出。\n\n保留字存在于所有高级计算机语言中。在\
  \ C# 中，有很多保留字，如 `if`、`while`、`else` 和 `for`。然而，每种语言都有自己的保留字。例如，C# 中的保留字 `else if`\
  \ 在 Python 中写为 `elif`。\n\n### 4.9 语句 (Statement) 和命令 (Command) 有什么区别？\n\n网上关于语句（statement）和命令（command）之间是否存在差异有很大的讨论。有些人倾向于使用“语句”一词，另一些人使用“命令”。对于初级程序员来说，没有区别；两者都是给计算机的指令！\n\
  \n### 4.10 什么是结构化编程？\n\n结构化编程是一种使用模块化和结构化设计的软件开发方法。大型程序被拆分成较小的模块，每个模块都使用结构化代码，这意味着语句以特定的方式组织，以减少错误。正如名称所示，结构化编程是在结构化语言中进行的，C#\
  \ 就是其中一种语言。\n\n结构化编程概念由 Corrado Böhm 和 Giuseppe Jacopini 在 1966 年正式提出。他们使用序列、决策和迭代演示了计算机程序设计。\n\
  \n### 4.11 三种基本控制结构\n\n结构化编程中有三种基本的控制结构。\n\n顺序控制结构：指的是逐行执行，即语句按照程序中出现的顺序依次执行，不跳过任何语句。它也被称为顺序控制结构。\n\
  决策控制结构：根据条件是真为假，决策控制结构可能会跳过整个语句块的执行，或者执行一个块而不是另一个。它也被称为选择控制结构。\n循环控制结构：这是一种允许多次执行一个语句块直到满足指定条件的控制结构。它也被称为迭代控制结构或重复控制结构。\n\
  \n### 练习题 4.11-1 使用流程图理解控制结构\n\n使用流程图为每种控制结构提供一个示例。\n\n### 答案\n\n顺序控制结构示例\n\n.![Image](img/chapter04-09.png)\n\
  \n决策控制结构示例\n\n![Image](img/chapter04-10.png)\n\n循环控制结构示例\n\n![Image](img/chapter04-11.png)\n\
  \n如果你还没有完全理解这三种控制结构的深层含义，不要担心，接下来的章节将对它们进行深入分析。耐心是一种美德。现在你只需要等待！\n\n### 4.12 你的第一个\
  \ C# 程序\n\n\n\n\n将流程图转换为如 C# 等计算机语言会生成一个 C# 程序。C# 程序无非一个包含 C# 语句的文本文件。你甚至可以在你的文本编辑器应用程序中编写\
  \ C# 程序！但请记住，使用 `Visual Studio Code` 或 `Visual Studio Community` 来编写 C# 程序是一个更好的解决方案，因为它们包含了许多可以让你的生活变得更轻松的功能。\n\
  \n![](img/remember.jpg)C# 源代码以默认的 `.cs` 文件扩展名保存在你的硬盘上。\n\n这里是一个非常简单的算法，它会在屏幕上显示三条消息。\n\
  \n.![Image](img/chapter04-12.png)\n\n这里是用 C# 程序编写的相同算法。\n\n```csharp\nConsole.WriteLine(\"\
  Hello World!\");\nConsole.WriteLine(\"Hallo Welt!\");\nConsole.WriteLine(\"The End\"\
  );\n```\n\n![](img/notice.jpg)注意，`C#` 要求所有语句必须以分号 `;` 结束。\n\n## 4.13 语法错误、逻辑错误和运行时错误之间有什么区别？\n\
  \n在编写或执行高级语言代码时，可能会发生三种类型的错误：语法错误、逻辑错误和运行时错误。\n\n语法错误是一种错误，例如拼写错误的关键字、缺失的标点符号或缺失的右括号。语法错误由编译器或解释器检测。如果你尝试执行一个包含语法错误的\
  \ `C#` 程序，你将在屏幕上收到错误消息，且程序将不会执行。你必须修正任何错误，然后再次尝试执行程序。\n\n![](img/notice.jpg)某些 IDE（如\
  \ `Visual Studio Code` 和 `Visual Studio Community`）会在你输入时检测到这些错误，并用红色波浪线下划错误的错误的语句。\n\
  \n逻辑错误是一种导致你的程序无法按预期方式运行的错误。对于逻辑错误，你完全不会收到任何警告。你的代码可以编译并运行，但结果不是预期的。逻辑错误很难检测。你必须彻底检查你的程序以找到错误所在。例如，考虑一个\
  \ `C#` 程序，它提示用户输入三个数字，然后计算并显示它们的平均值。然而，在这个程序中，程序员犯了一个拼写错误（一个“笔误”）；他们的其中一条语句将三个数字之和除以\
  \ `5`，而不是按照应该的除以 `3`。当然，该 `C#` 程序会正常执行，没有任何错误消息，会提示用户输入三个数字并显示结果，但显然不是正确的结果！找到并修正编写错误的\
  \ `C#` 语句是程序员的责任，而不是计算机、解释器或编译器的责任！毕竟计算机并没有那么智能！\n\n运行时错误是在程序执行期间发生的错误。运行时错误可能会导致程序突然终止，甚至导致系统关闭。此类错误是最难检测的错误。在执行程序之前，没有办法可以确定这种错误是否会发生。尽管你可以怀疑它可能会发生！例如，内存耗尽或除以零会导致运行时错误。\n\
  \n![](img/notice.jpg)逻辑错误可能是运行时错误的成因！\n\n![](img/notice.jpg)逻辑错误和运行时错误通常被称为“bug”（漏洞），通常在软件发布前的调试过程中发现。当在软件向公众发布后发现错误时，程序员通常会发布补丁或小型更新来修复错误。\n\
  \n## 4.14 为“调试”意味着什么\n\n调试是发现并减少计算机程序中缺陷（bug）数量的过程，以便使其按预期方式运行。\n\n关于“调试（debugging）”一词的起源有一个传说。1940\
  \ 年，当 `Grace Hopper` 在哈佛大学研究一台 `Mark II Computer` 时，她的同事发现了一个昆虫（飞蛾）卡在一个继电器（一种电气控制开关）中。这个虫阻塞了\
  \ `Mark II 计算机` 的正常运行。因此，当她的同事试图移除这个虫时，Grace Hopper 提到他们正在对系统进行“调试（debugging）”！\n\
  \n## 4.15 为代码编写注释\n\n当你编写一个简单的小程序时，任何人都可以通过逐行阅读来理解它是如何工作的。然而，长程序很难理解，有时甚至对于编写它们的人来说也是。\n\
  \n注释是ร包含在程序中的额外信息，使其更容易阅读和理解。通过使用注释，你可以添加说明和其他信息，包括：\n\n- 谁编写了程序\n- 程序何时创建或最后一次修改\n\
  - 程序的功能是什么\n- 程序是如何工作的\n\n![](img/notice.jpg)注释是给人类读者看的。编译器和解释器会忽略你在程序中添加的任何注释。\n\
  \n然而，你不应该过度注释。没有必要解释程序的每一行代码。只有当程序的某部分难以理解时，才添加注释。\n\n在 `C#` 中，你可以使用以下方法之一添加注释：\n\
  \n- 双斜杠 `//`……\n- 斜杠-星号、星号-斜杠分隔符 `/* …… */`\n\n下面的程序演示了如何使用两种类型的注释。通常，双斜杠 `//` 用于单行注释，而斜杠-星号、星号-斜杠分隔符\
  \ `/* …… */` 用于一次注释多行内容。\n\n```csharp\n/*由 Bouras Aristides 创建，日期: 12/25/2003，修改日期:\
  \ 04/03/2008，描述: 此程序在屏幕上显示一些消息*/\nConsole.WriteLine(\"Hello Zeus!\");  //它在屏幕上显示一条消息\n\
  // 在屏幕上显示第二条消息\nConsole.WriteLine(\"Hello Hera!\");\n/* 在屏幕上显示第三条消息 */ \nConsole.WriteLine(\"\
  Γ σας\");//这是一个注释\nConsole.WriteLine(\"The End\");\n```\n\n正如前面的程序所示，你可以在语句的上方或末尾添加注释，但不能放在语句前面。看最后一条语句，它本应该显示“The\
  \ End”消息。这条语句永远不会执行，因为它被认为是注释的一部分。\n\n![](img/notice.jpg)如果你使用 `/* …… */` 分隔符在语句前面添加注释，语句仍然会被执行。在前面的示例中，尽管希腊语“Γεια\
  \ σας”写在注释旁边，但它仍然会被执行。然而，建议不要遵循这种编写风格，因为它会使你的代码难以阅读。\n\n![](img/notice.jpg)在程序运行时，注释对用户是不可见的。\n\
  \n## 4.17 复习题：对错判断\n\n对以下每个陈述判断对或错。\n\n\n\n\n\n1) 一份菜谱实际上实际上是一个算法。\n2) 算法只用于计算机科学。\n\
