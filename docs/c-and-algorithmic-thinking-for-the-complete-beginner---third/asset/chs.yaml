  #### 练习 12.1-3 在 C# 中编写复杂的数学表达式\n\n编写一个 C# 程序来计算数学表达式\n\n.![Image](img/chapter12-10.png)\n\
  \n假设用户仅为 `x`、`w` 和 `z` 输入正值。\n\n### 解决方案\n\n哦！现在表达式变得更复杂了！事实上，它要复杂得多！所以，让我们来看一种完全不同的方法。核心思想是将复杂的表达式分解为更小、更简单的表达式，并将每个子结果赋值给临时变量。最后，你可以利用这些临时变量构建出原始表达式！这种方法将在给出。\n\
  \n![](img/my_exercise_header.png) project_12.1-3\n```csharp\ndouble denominator,\
  \ nominator, temp1, temp2, temp3, w, x, y, z;\nx = Convert.ToDouble(Console.ReadLine());\n\
  w = Convert.ToDouble(Console.ReadLine());\nz = Convert.ToDouble(Console.ReadLine());\n\
  temp1 = 3 * x * x + 5 * x + 2;\ntemp2 = 7 * w + 1 / z;\ntemp3 = (3 + x) / 7;\nnominator\
  \ = 5 * temp1 / temp2 + z;\ndenominator = 4 * temp3;\ny = nominator / denominator;\n\
  Console.WriteLine(\"The result is: \" + y);\n```\n\n你可能会说：“好吧，但我浪费了这么多变量，而且众所知，每个变量都是主内存的一部分。我如何能用一行写完原始表达式并节省内存内存呢？”\n\
  \n这项工作对于高级程序员来说可能小菜一碟，但对你呢？对新手程序员呢？\n\n下一个方法将帮助你编写即使是最复杂的数学表达式，也不会出现任何语法或逻辑错误！规则非常简单：“在将复杂表达式分解为更小、更简单的表达式并将每个子结果赋值给临时变量后，从后开始，将每个变量替换为其赋值的表达式。但要注意！当你用赋值的表达式替换变量时，必须始终用括号将表达式括起来！”\n\
  \n困惑了吗？别担心！操作起来更简单。让我们尝试重写之前的 C# 程序。从后开始，将变量 `nominator` 和 `denominator` 替换为它们赋值的表达式。结果是\n\
  \n![Image](img/chapter12-11.png)\n\n![](img/notice.jpg)注意添加的额外括号。\n\n现在你必须将变量 `temp1`、`temp2`\
  \ 和 `temp3` 替换为它们赋值的表达式，单行表达式就完成了！\n\n![Image](img/chapter12-12.png)\n\n最后看起来可能很吓人，但并没有那么困难，不是吗？\n\
  \nC# 程序现在可以重写为\n\n![](img/my_exercise_header.png) project_12.1-3b\n```csharp\ndouble\
  \ w, x, y, z;\nx = Convert.ToDouble(Console.ReadLine());\nw = Convert.ToDouble(Console.ReadLine());\n\
  z = Convert.ToDouble(Console.ReadLine());\ny = (5 * (3 * x * x + 5 * x + 2) / (7\
  \ * w + 1 / z) + z) / (4 * ((3 + x) / 7));\nConsole.WriteLine(\"The result is: \"\
  \ + y);\n```\n\n### 12.2 复习练习\n\n完成以下练习。\n\n1)将第一个表中的每个元素与第二个表中的一个或多个元素匹配。\n\n|\
