  i = 1;\nwhile (i <= 4) {\n    x = Convert.ToDouble(Console.ReadLine());\n    total\
  \ = total + x;\n    i++;\n}\nConsole.WriteLine(total);\n```\n\n现在非常容易使用 `for` 语句重写它，并在每次数据输入前显示提示消息。\n\
  \n![](img/my_exercise_header.png)  project_26.1-4\n```csharp\nint i;\ndouble total,\
  \ x;\ntotal = 0;\nfor (i = 1; i <= 4; i++) {\n    Console.Write(\"Enter a number:\
  \ \");\n    x = Convert.ToDouble(Console.ReadLine());\n    total += x;\n}\nConsole.WriteLine(total);\n\
  ```\n\n\n\n\n这个练习非常直观。用户输入一个整数，程序按照该整数指定的次数进行循环。该 C# 程序如下：\n\n```csharp\nint num,\
  \ i;\nConsole.Write(\"Enter an integer: \");\nnum = Convert.ToInt32(Console.ReadLine());\n\
  for (i = 0; i <= num; i++) {\n    Console.WriteLine(Math.Sqrt(i));\n}\n```\n\n####\
  \ 练习 26.1-6 求解 1 + 2 + 3 + … + 100 的和\n\n编写一个 C# 程序，计算并显示以下和：\n\nS = 1 + 2 + 3 +\
  \ … + 100\n\n### 答案\n\n如果你使用顺序控制结构来解决这个练习，它将类似于下面的代码片段。\n\n`s = 0;i = 1;s = s +\
  \ i;i = i + 1;s = s + i;i = i + 1;……s = s + i;i = i + 1;`\n\n让我们使用追踪表来更好地理解它。\n\n\
  | 步骤 | 语句 | 备注 | i | s |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | s = 0 | 0\
  \ | ? | 0 |\n| 2 | i = 1 | | 1 | 0 |\n| 3 | s = s + i | 0 + 1 = 1 | 1 | 1 |\n| 4\
  \ | i = i + 1 | | 2 | 1 |\n| 5 | s = s + i | 0 + 1 + 2 = 3 | 2 | 3 |\n| 6 | i =\
  \ i + 1 | | 3 | 3 |\n| 7 | s = s + i | 0 +1 + 2 + 3 = 6 | 3 | 6 |\n| 8 | i = i +\
  \ 1 | | 4 | 6 |\n| ... | … | | … | … |\n| ... | … | | … | … |\n| 199 | s = s + i\
  \ | | 99 | 4950 |\n| 200 | i = i + 1 | | 100 | 4950 |\n| 201 | s = s + i | 0 + 1\
  \ + 2 + 3 + …+ 99 + 100 = 5050 | 100 | 5050 |\n| 202 | i = i + 1 | | 101 | 5050\
  \ |\n\n现在一切都解释清楚了，你可以做同样的事情，这次使用一个 for 循环，让变量 `i` 递增 1。\n\n```csharp\nint s, i;\n\
  s = 0;\nfor (i = 1; i <= 100; i++) {\n    s = s + i;\n}\nConsole.WriteLine(s);\n\
  ```\n\n#### 练习 26.1-7 求解 2 × 4 × 6 × 8 × 10 的积\n\n编写一个 C# 程序，计算并显示以下积：\n\nP = 2\
  \ × 4 × 6 × 8 × 10\n\n### 答案\n\n让我们使用以下顺序控制结构来解决这个练习。变量 `p` 必须初始化为 1 而不是 0。这是为了让语句\
  \ `p = p * i` 正常运行；否则最终的乘积将为零。\n\n`p = 1;i = 2;p = p * i;i += 2;p = p * i;i += 2;p\
  \ = p * i;i += 2;p = p * i;i += 2;p = p * i;i += 2;`\n\n与上一个练习([练习 26.1-6])一样，这个顺序控制结构可以被\
  \ for 循环替换，如下：\n\n```csharp\nint p, i;\np = 1;\nfor (i = 2; i <= 10; i += 2) {\n\
  \    p = p * i;\n}\nConsole.WriteLine(p);\n```\n\n#### 练习 26.1-8 求解 2² + 4² + 6²\
  \ + … (2N)²的和\n\n编写一个 C# 程序，让用户输入整数 `N`，然后计算并显示以下和：\n\nS = 2² + 4² + 6² + … (2N)²\n\
  \n### 答案\n\n在这个练习中，变量 `i` 必须递增 2。但在每次迭代中，在将其累加到变量 `s` 之前，它的值必须先平方。最终的 C# 程序如下：\n\
  \n```csharp\nint N, i;\ndouble s;\nN = Convert.ToInt32(Console.ReadLine());\ns =\
  \ 0;\nfor (i = 2; i <= 2 * N; i += 2) {\n    s = s + Math.Pow(i, 2);\n}\nConsole.WriteLine(s);\n\
  ```\n\n#### 练习 26.1-9 求解 3³ + 6⁶ + 9⁹ + … (3N)^(3N)的和\n\n编写一个 C# 程序，让用户输入整数 `N`，然后计算并显示以下和：\n\
  \nS = 3³ + 6⁶ + 9⁹ + … (3N)^(3N)\n\n### 答案\n\n这与上一个练习几乎相同。唯一的区别是变量 `i` 在累加到变量 `s`\
  \ 之前，必须作为 `i` 次方。使用 for 循环，最终的 C# 程序如下：\n\n```csharp\nint N, i;\ndouble s;\nN =\
  \ Convert.ToInt32(Console.ReadLine());\ns = 0;\nfor (i = 3; i <= 3 * N; i += 3)\
  \ {\n    s = s + Math.Pow(i, i);\n}\nConsole.WriteLine(s);\n```\n\n#### 练习 26.1-10\
  \ 求解正数的平均值\n\n编写一个 C# 程序，让用户输入 100 个数字，然后计算并显示正数的平均值。添加所有必要的检查以确保程序满足确定性（definiteness）。\n\
  \n### 答案\n\n由于你知道总的迭代次数，可以使用 for 循环。然而，在循环内部，必须使用选择结构来检查用户提供的数字是否为正数；如果是，则必须将用户提供的数字累加到\
  \ `s` 中。变量 `count` 用于统计正数的数量。\n\n```csharp\nint count, i;\ndouble s, x;\ns = 0;\n\
  count = 0;\nfor (i = 1; i <= 100; i++) {\n    x = Convert.ToDouble(Console.ReadLine());\n\
  \    if (x > 0) {\n        s += x;\n        count++;\n    }\n}\nif (count != 0)\
  \ {\n    Console.WriteLine(s / count);\n} else {\n    Console.WriteLine(\"No positive\
  \ numbers entered!\");\n}\n```\n\n#### 练习 26.1-11 统计元音个数\n\n编写一个 C# 程序，提示用户输入一个字符串，然后统计并显示元音的个数。\n\
  \n### 答案\n\n该 C# 程序遍历字符串中的所有字符。for 循环检查每个字符，如果是元音，则变量 `count` 加 1。\n\n```csharp\n\
  string message;\nchar character;\nstring vowels = \"AEIOU\";\nint i, count;\nConsole.Write(\"\
  Enter a message: \");\nmessage = Console.ReadLine().ToUpper();\ncount = 0;\nfor\
  \ (i = 0; i <= message.Length - 1; i++) {\n    character = message[i];\n    if (vowels.IndexOf(character)\
  \ != -1) {\n        count++;\n    }\n}\n```\n\n`Length` 属性包含 `message` 包含的字符数量，而\
  \ `message[i]` 则返回指定位置（由变量 `i` 指定）的字符。`IndexOf()` 方法在 `character` 不在 `vowels` 中时返回\
  \ -1。\n\n### 26.2 适用于 for 循环的规则\n\n在编写 for 循环程序时，你必须遵守某些规则，因为它们可以避免意外的副作用。\n\n-\
  \ **规则 1**：计数器变量可以在循环体中出现，但其值不能被修改。这同样适用于变量 `final_value` 和 `offset`。\n- **规则 2**：`offset`\
  \ 绝不能为零。如果设置为零，循环将无限执行下去。\n- **规则 3**：如果 `initial_value` 小于 `final_value`，则 `offset`\
  \ 必须为正数；如果是负数，循环将执行 0 次。在某些情况下，故意违反此规则是有用的。\n- **规则 4**：如果 `initial_value` 大于 `final_value`，则\
  \ `offset` 必须为负数；如果是正数，循环将执行 0 次。在某些情况下，故意违反此规则是有用的。\n\n#### 练习 26.2-1 统计总迭代次数\n\
  \n以下代码片段执行了多少次迭代？\n\n```csharp\nfor (i = 5; i <= 10; i++) {\n    Console.WriteLine(i);\n\
  \    i--;\n}\n```\n\n### 答案\n\n代码片段违反了 for 循环的第一条规则，即计数器变量可以在循环语句中出现，但其值不能被修改。相应的流程图如下所示，可以帮助你更好地理解实际发生了什么。\n\
  \n![Image](img/chapter26-05.png)\n\n\n\n正如你所示，由于变量 `i` 的初始值 `5` 小于 `10`，执行流进入了循环。然而，在循环内部，语句\
  \ `i ← i - 1` 取消了语句 `i ← i + 1`，导致变量 `i` 不增加，它永远无法达到 `final_value` `10`。因此，循环将执行无限次迭代。\n\
  \n![](img/remember.jpg)与计数变量类似，如果 `final_value` 和 `offset` 是变量而不是常量值，则它们的值在循环内部永远不能改变。\n\
  \n### 练习 26.2-2 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```csharp\nfor (i = 5; i <= 10; i +=\
  \ 0) {Console.WriteLine(i);}\n```\n\n### 答案\n\n此代码段违反了 `for` 循环的第二个规则，即 `offset`\
  \ 永远不能为零。随后的流程图片段可以帮助你更好地理解实际上发生了什么。\n\n.![Image](img/chapter26-06.png)\n\n正如你所示，由于变量\
  \ `i` 的初始值小于 `10`，执行流进入了循环。然而，语句 `i ← i + 0` 永远不会增加变量 `i`，这意味着它永远无法达到 `final_value`\
  \ `10`。因此，循环将执行无限次迭代。\n\n![](img/remember.jpg)`offset` 永远不能为零。\n\n### 练习 26.2-3\
  \ 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```csharp\nfor (i = 5; i >= 10; i--) {Console.WriteLine(i);}\n\
  ```\n\n### 答案\n\n此代码段违反了 `for` 循环的第三条规则，即如果 `initial_value` 小于 `final_value`，则 `offset`\
  \ 必须为正。如果是负，循环将执行零次迭代。随后的流程图片段可以帮助你更好地理解实际上发生了什么。\n\n.![Image](img/chapter26-07.png)\n\
  \n![](img/remember.jpg)当计数器减少时，比较运算符应为 `≥`，当计数器增加时应为 `≤`。\n\n当执行流到达循环控制结构时，值 `5`\
  \ 被赋值给变量 `i`。然而，布尔表达式求值为 `false`，执行流永远不会进入循环！因此，循环执行零次迭代。\n\n![](img/notice.jpg)`for`\
  \ 循环实际上是一个预测试循环结构。正如此，它可能会执行从零到许多次的迭代。\n\n![](img/remember.jpg)故意违反 `for` 循环的第三条规则在某些情况下是有用的。\n\
