  \n### 练习 34.5-7 检查一个值是否存在于所有列中\n\n编写一个 C# 程序，让用户向 20x30 的数组输入数值。在输入所有值后，程序将让用户输入一个值。最后，如果用户提供的值在每一列中至少出现一次，则显示一条消息。\n\
  \n### 答案\n\n该练习可以使用线性搜索算法和计数器变量 `count` 来解决。C# 程序将遍历第一列；如果找到了用户提供的值，C# 程序将停止搜索第一列，变量\
  \ `count` 加 1。然后，程序将遍历第二列；如果再次找到用户提供的值，C# 程序将停止搜索第二列，变量 `count` 再次加 1。这个过程必须重复，直到所有列都检查完毕。在过程结束时，如果\
  \ `count` 的值等于列数，这意味着用户提供的值在每一列中至少存在一次。\n\n让我们使用“从内层到外”的方法。以下代码段在数组的第一列（列索引 0）中搜索，如果找到了用户提供的值，执行流将退出\
  \ for 循环，变量 `count` 加 1。假设变量 `j` 包含值 0。\n\n```cs\nfound = false;\nfor (i = 0; i\
  \ <= ROWS - 1; i++) {\n    if (haystack[i, j] == needle) {\n        found = true;\n\
  \        break;\n    }\n}\nif (found) {\n    count++;\n}\n```\n\n现在你可以将此代码段嵌套在一个遍历所有列的\
  \ for 循环中。\n\n\n\n\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found =\
  \ false;\n    for (i = 0; i <= ROWS - 1; i++) {\n        if (haystack[i, j] == needle)\
  \ {\n            found = true;\n            break;\n        }\n    }\n    if (found)\
  \ {\n        count++;\n    }\n}\n```\n\n你几乎准备就绪——但请考虑一个小细节！如果内部 `for` 循环在某一列中没有找到用户提供的值，外部\
  \ `for` 循环必须停止迭代。继续下去是没有意义的，因为用户提供的值在至少一列中不存在。因此，更好的方法是像下面的代码片段所示，使用 `break` 语句退出外部循环。\n\
  \n```cs\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n    for (i =\
  \ 0; i <= ROWS - 1; i++) {\n        if (haystack[i, j] == needle) {\n          \
  \  found = true;\n            break;\n        }\n    }\n    if (found) {\n     \
  \   count++;\n    } else {\n        break;\n    }\n}\n```\n\n最终的 C# 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.5-7\n\n```csharp\nconst int ROWS = 20;\nconst int COLUMNS = 30;\nint\
  \ i, j, count;\nbool found;\ndouble needle;\ndouble[,] haystack = new double[ROWS,\
  \ COLUMNS];\nfor (i = 0; i <= ROWS - 1; i++) {\n    for (j = 0; j <= COLUMNS - 1;\
  \ j++) {\n        haystack[i, j] = Convert.ToDouble(Console.ReadLine());\n    }\n\
  }\nConsole.Write(\"Enter a value to search: \");\nneedle = Convert.ToDouble(Console.ReadLine());\n\
  count = 0;\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n    for (i\
  \ = 0; i <= ROWS - 1; i++) {\n        if (haystack[i, j] == needle) {\n        \
  \    found = true;\n            break;\n        }\n    }\n    if (found) {\n   \
  \     count++;\n    } else {\n        break;\n    }\n}\nif (count == COLUMNS) {\n\
  \    Console.WriteLine(needle + \" found in every column!\");\n}\n```\n\n![](img/notice.jpg)\
  \ 如果你需要在用户提供的值至少在每行中出现一次（而不是每列）时显示一条消息，C# 程序可以遵循之前所示的步骤，但在这种情况下，它必须遍历行而不是列。\n\n\
  ### 练习 34.5-8 二分查找算法 – 在已排序的一维数组中搜索\n\n编写一个代码片段，在已排序的一维数组上执行搜索以找到给定值。使用二分查找算法。\n\
  \n#### 解决方案\n\n二分查找算法被认为非常快，可以用于大规模数据。然而，它的主要缺点是数据需要经过排序的。\n\n二分查找算法的核心思想是首先检查数组中间的元素。如果它不匹配你正在寻找的“大海针”，算法将确定目标是比中间元素小还是大。这将引导搜索到数组对应的半部分。换句话说，如果你寻找的“针”小于中间元素的值，这意味着该“针”可能在数组的前半部分；否则，它可能在后半部分。该过程持续，通过检查剩余半部分的中间元素来缩小搜索范围，直到找到“针”或正在检查的数组部分减少到单个元素。如果发生后者且未找到“针”，则意味着“针”不在数组中。\n\
  \n困惑吗？让我们通过一个示例来分析二分查找算法。以下数组包含按升序排列的数值。假设你正在寻找的“针”的值是 44。\n\n![Image](img/chapter34-38.png)\n\
  \n使用了三个变量。最初，变量 `left` 包含值 `0`（这是第一个元素的索引），变量 `right` 包含值 `13`（这是最后一个元素的索引），变量 `middle`\
  \ 包含值 `6`（这约为中间元素的索引）。\n\n![Image](img/chapter34-39.png)\n\n你寻找的“针”（值 44）大于中间的值\
  \ `39`，因此你寻找的元素可能在数组的后半部分。因此，变量 `left` 更新为指向索引位置 `7`，变量 `middle` 更新为 `left`（新的）和\
  \ `right` 之间的中间点，如下所示。\n\n![Image](img/chapter34-40.png)\n\n现在，你寻找的“针”（值 44）小于中间的值\
  \ `57`，因此你寻找的元素可能在正在检查的数组的前半部分。因此，现在更新变量 `right` 指向索引位置 `9`，变量 `middle` 更新为指向 `left`\
  \ 和 `right` 之间的中间点。\n\n![Image](img/chapter34-41.png)\n\n现在当变量 `right` 指向索引位置 `8`\
  \ 所示，整个过程就会停止！\n\n![](img/notice.jpg) 每次比较都会缩小 `left` 和 `right` 的范围，你完成了！“针”已找到索引位置\
  \ `8`。\n\n![](img/notice.jpg) 每次成功的比较都会将剩余的元素减少一半！\n\n```cpp\nleft = 0;\nright =\
  \ ELEMENTS - 1;\nfound = false;\nwhile (left <= right && !found) {\n    middle =\
  \ (left + right) / 2;\n    if (needle < haystack[middle]) {\n        right = middle\
  \ - 1;\n    } else if (needle > haystack[middle]) {\n        left = middle + 1;\n\
  \    } else {\n        found = true;\n    }\n}\n```\n\n![](img/notice.jpg) 二分查找算法非常高效，因为它每次都极大地缩小了搜索空间，对于排序数组非常有效。在示例中通过该算法，44\
  \ 可以在三次迭代内找到。相比之下，线性搜索需要九次迭代。\n\n![](img/notice.jpg) 如果数组中出现多次值，二分查找算法只能找到其中一次。\n\
