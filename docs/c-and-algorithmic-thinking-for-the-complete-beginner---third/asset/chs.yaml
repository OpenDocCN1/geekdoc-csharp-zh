  \ Studio`？\n\n# 第二部分\n\n开始学习 `C#`\n\n## 第 4 章：基础算法概念导论\n\n### 4.1 什么是算法？\n\n从技术角度来说来说，算法是一个严格定义的、有限的良定义语句序列（通常称为指令或命令），对于任何可接受的输入值集合（如果有输入的话），它提供了解决问题或特定类问题的解决方案。换句话说，算法是解决给定问题的逐步执行程序。“有限”一词意味着算法必须到达一个终点，而不能无限运行。\n\
  \n你可以在现实生活的各处发现算法，而不仅仅是在计算机科学中。例如，准备吐司或泡茶的过程就可以被为一个算法。为了实现你的目标，必须按照特定的顺序遵循某些步骤。\n\
  \n### 4.2 泡杯茶的算法\n\n以下是泡茶的算法。\n\n1) 在杯子中放入茶包。\n2) 向水壶中加水。\n3) 烧开水壶中的水。\n4) 将一些开水倒入杯中。\n\
  5) 在杯中加入牛奶。\n6) 在杯中加入糖。\n7) 搅拌茶。\n8) 喝茶。\n\n如你所见，必须遵循某些步骤。这些步骤有着特定的顺序，尽管某些步骤可以重新排列。例如，第\
  \ 5 步和第 6 步可以交换。你可以先加糖，后加牛奶。\n\n请记住，某些步骤的顺序可能会改变，但你不能将它们移离本应的位置太远。例如，你不能将第 3 步（“烧开水壶中的水”）移动算法的末尾，因为你最终将喝上一杯冰茶（而不是热水），这与你的初始目标完全不同！\n\
  \n### 4.3 算法的属性\n\n唐纳德·高德（Donald E. Knuth）在他的著作《计算机程序设计第一卷：基本算法》中指出，算法必须满足以下五个属性：\n\
  \n- **输入**：算法必须具有来自指定集合的输入值。\n- **输出**：算法必须从一组指定的输入值中产生输出值。输出值是问题的解决方案。\n- **有限性**：对于任何输入，算法必须在有限的步骤后终止。\n\
  - **确定性**：算法的所有步骤都必须精确定义。算法中的每条指令都应该是清晰且无歧的。算法必须显式地描述如何执行计算。确定性属性确保执行指令的代理将始终知道下一步执行哪条命令。不满足确定性属性的算法示例包括：\n\
  \    - 一个涉及在没有任何检查或保护措施的情况下将数字除以零的算法。除以零在数学上是未定义的，不处理这种情况情况的算法可能会导致计算出现意想不到的结果或错误。\n\
  \    - 一个在没有考虑复数的情况下尝试计算负数平方根的算法。负数的平方根不是实数而是复数。如果算法没有妥善处理这一点，可能会产生无效或无意义的结果。\n\
  - **有效性**：指的是算法能够在有限的时间内，对所有可能的有效输入（包括边界情况）一致且准确地产生意义且正确的结果的能力。算法的步骤必须足够简单，以便例如，使用铅笔和纸的人可以精确地执行它们。\n\
  \n### 4.4 算法很好。但计算机程序到底是什么？\n\n计算机程序无非用计算机可以理解的语言（如 `C#`、`Python`、`C++` 或 `Java`）编写的算法。\n\
  \n计算机程序实际上不能为你泡茶或为你做晚餐，尽管算法可以指导你亲手完成这些步骤。然而，程序可以（例如）用于计算一组数字的平均值，或找到它们中的最大值。人工智能程序甚至可以下棋或解决逻辑谜题。\n\
  \n### 4.5 三方！\n\n算法中总是涉及三方：编写算法的人、执行算法的人，以及使用或享受它的人。\n\n让我们以准备饭菜的算法为例。有人编写算法（菜谱作者），有人执行它（可能是你的母亲），还有人使用它（可能是你）。\n\
  \n现在考虑一个真实的计算机程序。以视频游戏为例。有人用计算机语言编写算法（程序员），某个设备执行它（通常是笔记本电脑或计算机），有人使用它（用户）。\n\n\
  注意，有时“程序员”和“用户”术语可能会产生歧义。当你编写计算机程序时，你暂时担任程序员的角色，但当你使用自己的程序时，你承担了用户的角色。\n\n### 4.6\
  \ 创建算法涉及三个主要阶段\n\n算法应该包含三个阶段：数据输入、数据处理和结果输出。这个顺序是特定的不能改变。\n\n考虑一个寻找三个数字平均值的计算机程序。首先，程序必须提示（询问）用户输入这些数字（数据输入阶段）。接下来，程序必须计算这些数字的平均值（数据处理阶段）。最后，程序必须将结果显示在计算机屏幕上（结果输出阶段）。\n\
  \n让我们更详细查看这些阶段。\n\n**第一阶段 – 数据输入**\n1) 提示用户输入一个数字。\n2) 提示用户输入第二个数字。\n3) 提示用户输入第三个数字。\n\
  \n**第二阶段 – 数据处理**\n4) 计算三个数字的和。\n5) 将和除以 3。\n\n**第三阶段 – 结果输出**\n6) 将结果显示在屏幕上。\n\n\
  在某些情况下，输入阶段可能会缺失，计算机程序可能只包含两个阶段。例如，考虑一个旨在计算以下和的计算机程序：\n\n`1 + 2 + 3 + 4 + 5`\n\n\
  在这个例子中，用户不需要输入任何值，因为计算机程序确切知道做什么。它必须计算 1 到 5 的和，然后将 15 显示在用户的屏幕上。这里显示了两个要求的阶段（数据处理和结果输出）。\n\
  \n**第一阶段 – 数据输入**\n无需操作\n\n**第二阶段 – 数据处理**\n1) 计算 1 + 2 + 3 + 4 + 5 的和。\n\n**第三阶段\
  \ – 结果输出**\n2) 将结果显示在屏幕上。\n\n\n\n\n然而，如果你想让用户来决定该总和的上限呢？如果你想让用户决定是累加 1 到 5 的数字还是\
  \ 1 到 20 的数字呢？在这种情况下，程序必须在开始时包含一个输入阶段，让用户输入该上限。一旦用户输入了上限，计算机就可以计算结果。三个所需的阶段如图所示。\n\
  \n### 第一阶段 – 数据输入\n1) 提示用户输入一个数字。\n\n### 第二阶段 – 数据处理\n2) 计算总和 `1 + 2 + …`（计算到并包含用户输入的上限）。\n\
  \n### 第三阶段 – 结果输出\n3) 在屏幕上显示结果。\n\n例如，如果用户输入数字 6 作为上限，计算机将计算 `1 + 2 + 3 + 4 + 5\
  \ + 6` 的结果。\n\n### 4.7 流程图\n\n流程图是一种展示算法的图形化方法，通常在纸上绘制。它是算法执行流的可视化表示。换句话说，它直观地表示了执行流如何从一条语句进行到下一条语句，直到算法结束。流程图使用的基本符号如表\
  \ 4-1 所示。\n\n| 流程图符号 | 说明 |\n| --- | --- |\n| .![Image](img/chapter04-01.png) |\
  \ 开始/结束：代表算法的开始或结束。开始符号有一个出口，结束符号有一个入口。 |\n| .![Image](img/chapter04-02.png) | 箭头：显示执行流。从一个符号出来并指向另一个符号的箭头表示控制权传递给箭头所指的符号。箭头始终画成向上、向下或侧向的直线（绝不以斜角绘制）。\
  \ |\n| .![Image](img/chapter04-03.png) | 处理：代表一个过程或数学（公式）计算。处理符号有一个入口和一个出口。 |\n\
  | .![Image](img/chapter04-04.png) | 数据输入/输出：代表数据输入或结果输出。在大多数情况下，数据来自键盘，结果显示在屏幕上。数据输入/输出符号有一个入口和一个出口。\
  \ |\n| .![Image](img/chapter04-05.png) | 决策：指示做出决策的点。根据给定的条件（可以为真或为假），算法将遵循右侧或左侧路径。决策符号有一个入口和两个（且始终只有两个）出口。\
  \ |\n| .![Image](img/chapter04-06.png) | 页连接符：显示流程图在另一页上的延续。当流程图太大无法放入单页纸上时，它们用于连接多个页面上的片段。输出的页连接符符号有一个入口，输入的页连接符符号有一个出口。\
