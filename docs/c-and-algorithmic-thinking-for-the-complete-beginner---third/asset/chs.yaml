  ### 14.6 复习练习\n\n完成以下练习。\n\n1)编写一个 C# 程序，让用户输入三位整数并计算其数字之和。\n2)编写一个 C# 程序，提示用户输入姓名并用全大写字母显示。\n\
  3)编写一个 C# 程序，提示用户输入三位整数并将其反转。\n4)编写一个 C# 程序，提示用户输入名字、中间名和姓氏，并按以下方式显示它们：\nFirstName\
  \ MiddleName\nFirstName M.\nLastName F.\n5)编写一个 C# 程序，确保无论用户如何输入姓名，都始终以首字母大写、其余字母小写的方式显示。\n\
  6)编写一个 C# 程序，让用户输入一个长单词并显示其缩写（保留首尾字母，并在它们之间插入字母的数量）。\n\n\n\n你目前为止所学到的内容是顺序控制结构，其中语句按照它们在程序中出现的顺序逐一执行。然而，在严谨的\
  \ C# 编程中，你很少希望语句按顺序执行。很多时候，你希望在某种情况下执行一组语句，而在另一种情况下执行另一组完全不同的语句。\n\n## 15.2 什么是布尔表达式？\n\
  \n假设变量 `x` 包含一个值 `5`。这意味着如果你问“`x` 是否大于 2？”这个问题问题，答案显然是“是（Yes）”。对于计算机来说，这些问题被称为“布尔表达式”（Boolean\
  \ expressions）。例如，如果你写 `x > 2`，这是一个布尔表达式，计算机必须检查表达式 `x > 2` 是真（true）还是假（false）。\n\
  \n![](img/notice.jpg)布尔表达式是一个产生布尔值的表达式，即真（true）或假（false）之一。\n\n![](img/notice.jpg)布尔表达式是形式上的提问，它们应该被读为“某物是否等于/大于/小于其他某物？”，答案只是“是”或“否”（即\
  \ `true` 或 `false`）。\n\n![](img/remember.jpg)决策控制结构可以评估一个布尔表达式或一组布尔表达式，然后决定执行哪一个语句块。\n\
  \n## 15.3 如何编写简单的布尔表达式\n\n简单的布尔表达式写形式为：\n\n`Operand1 Comparison_Operator Operand2`\n\
  \n其中：\n\n* `Operand1` 和 `Operand2` 可以是值、变量、常量或数学表达式。\n* `Comparison_Operator` 可以是表\
