  \ b[i, j];\n        }\n    }\n    Console.WriteLine(minimum + \"  \" + maximum);\n\
  }\n```\n\n### 34.4 数组排序\n\n排序算法是计算机科学中的一个重要课题。排序算法是一种将数组中的元素按特定顺序排列的算法。有很多排序算法，每种算法都有其特定的优缺点。\n\
  \n大多数排序算法通过比较数组中的元素来工作。它们通常根据效率和内存需求进行评估。\n\n有很多排序算法，其中一些包括：\n\n- 冒泡排序\n- 改进的冒泡排序\n\
  - 选择排序\n- 插入排序\n- 堆排序\n- 合并排序\n- 快速排序\n\n就效率而言，冒泡排序被认为效率最低，而列表中的每个后续算法都优于前一个。快速排序被认为是最好、最快的排序算法之一，特别是对于大规模数据操作。\n\
  \n排序算法不仅可以按升序或降序显示数据，还可以帮助找到给定值中的最小值和最大值。例如，在升序排列的数组中，最小值位于第一个索引位置，最大值位于最后一个索引位置。虽然仅为了寻找最小值和最大值而排序是非常无效的，但如果程序由于其他原因对数组进行了排序，随后你需要最小值或最大值，你知道在哪里可以找到它们。\n\
  \n另一个可能需要排序算法的场景是你想要找到并显示数组中最大的三个数字等。在这种情况下，你可以对数组进行降序排序，然后只显示索引为 0、1 和 2 的前三个元素。\n\
  \n#### 练习 34.4-1 冒泡排序算法 – 数值一维数组排序\n\n编写一个 C# 程序，让用户向数组中输入 20 个数值，然后使用冒泡排序算法将其按升序排序。\n\
  \n解决方案\n\n\n\n\n泡沫排序算法可能是效率最低的排序算法之一，但它被广泛用于教学。其核心思想（当要求按升序排列数组时）是重复地将数组中最小的元素移动到索引最小的位置。工作原理如下：算法遍历数组中的元素，比较每对相邻元素，如果它们的顺序不正确（如果顺序错误的话），则交换它们的内容。这个过程会重复多次，直到数组完成排序。\n\
  \n例如，让我们尝试升序排列以下数组。\n\n![Image](img/chapter34-08.png)\n\n最小值是数值 `5`。根据泡沫排序算法，这个值必须像可乐中升起的气泡一样，逐渐“冒泡”或“上升”到位置\
  \ `0`处。当数值 `5` 移动到位置 `0` 后，下一个较小的是数值 `8`。现在，数值 `8` 必须“冒泡”到位置 `1`。接下是数值 `12`，它必须“冒泡”到位置\
  \ `2`，依此类推。这个过程不断重复，直到所有元素都被放置在正确的位置上。\n\n但是如何使用算法来完成这种“冒泡”过程呢？让我们更详细地查看整个过程。对于之前包含六个元素的数组\
  \ `A`，必须执行五轮比较。\n\n### 第一轮\n\n#### 第 1 次比较\n最初比较索引位置 `4` 和 `5` 处的元素。由于数值 `12` 小于数值\
  \ `49`，这两个元素交换内容。\n\n#### 第 2 次比较\n比较索引位置 `3` 和 `4` 处的元素。由于数值 `12` 不小于数值 `5`，因此不进行交换。\n\
  \n#### 第 3 次比较\n比较索引位置 `2` 和 `3` 处的元素。由于数值 `5` 小于数值 `8`，这两个元素交换内容。\n\n#### 第 4 次比较\n\
  比较索引位置 `1` 和 `2` 处的元素。由于数值 `5` 小于数值 `25`，这两个元素交换内容。\n\n#### 第 5 次比较\n比较索引位置 `0`\
  \ 和 `1` 处的元素。由于数值 `5` 小于数值 `17`，这两个元素交换内容。\n\n![Image](img/chapter34-09.png)\n\n\
  第一轮已经完成，但正如你所见，数组还没有排序好。唯一能被放置在正确位置的值是 `5`。然而，由于后续还有更多的轮次，数值 `5` 不需要参与后续的比较。在接下来的轮次中，比较次数将减少一次——即四次比较。\n\
  \n### 第二轮\n\n#### 第 1 次比较\n比较索引位置 `4` 和 `5` 处的元素。由于数值 `49` 不小于数值 `12`，不进行交换。\n\n\
  #### 第 2 次比较\n比较索引位置 `3` 和 `4` 处的元素。由于数值 `12` 不小于数值 `8`，不进行交换。\n\n#### 第 3 次比较\n\
  比较索引位置 `2` 和 `3` 处的元素。由于数值 `8` 小于数值 `25`，这两个元素交换内容。\n\n#### 第 4 次比较\n比较索引位置 `1`\
  \ 和 `2` 处的元素。由于数值 `8` 小于数值 `17`，这两个元素交换内容。\n\n![Image](img/chapter34-10.png)\n\n\
  第二轮已经完成，数值 `8` 保证被放置在正确的位置上。然而，由于后续还有更多的轮次，数值 `8`（当然还包括 `5`）不需要参与后续的比较。在接下来的轮次中，比较次数将减少一次——即三次比较。\n\
  \n### 第三轮\n在这一轮中，执行了三次比较（但只有两次交换），如下。\n\n![Image](img/chapter34-11.png)\n\n第三轮已经完成，数值\
  \ `12` 保证被放置在正确的位置上。和之前一样，由于后续还有更多的轮次，数值 `12`（当然还包括数值 `5` 和 `8`）不需要参与后续的比较。在接下来的轮次中，比较次数将减少一次——即两次比较。\n\
  \n### 第四轮\n在这一轮中，执行了两次比较（且没有交换），所示。\n\n![Image](img/chapter34-12.png)\n\n第四轮已经完成，数值\
  \ `17` 保证被放置在正确的位置上。和之前一样，由于还有最后一轮，数值 `17`（当然还包括数值 `5`、`8` 和 `12`）不需要参与后续的比较。在随后的最后一轮中，比较次数将减少一次——即一次比较。\n\
  \n### 第五轮\n在最后一轮中，只执行了一次比较。由于数值 `49` 不小于数值 `25`，不进行交换。\n\n![Image](img/chapter34-13.png)\n\
  \n第五轮已经完成，最后两个值（`25` 和 `49`）现在保证处于正确的位置。泡沫排序算法已经结束，数组已按升序排列好！\n\n现在你需要一个可以完成上述整个过程的\
  \ C# 程序。让我们使用“从内到外”的方法。下面显示了仅执行第一轮的代码片段。请注意，这是内层循环。\n\n\n\n在 C# 中，你不能使用比较运算符（如小于号\
  \ `<` 或大于号 `>`）来比较字符串。正如你已经从第 14.3 节 中了解到的，C# 支持 `CompareTo()` 方法，该方法可用于此。对于该方法，字母“A”被认为“小于”字母“B”，“B”被认为“小于”字母“C”，依此类推。当然，如果数组中包含第一个字母相同的单词，C#\
  \ 将继续比较它们的第二个字母，如果必要的话，可能还会比较第三个字母。例如，名字“Jonathan”被认为“小于”名字“Jone”，因为第四个字母“a”“小于”第四个字母“e”。之之，如果你将布尔表达式\
  \ `a[n] < a[n - 1]` 替换为表达式 `a[n].CompareTo(a[n - 1]) < 0`，那么泡沫排序算法就能对字母数字值进行升序排序。\n\
  \n![](img/notice.jpg)考虑在英文字典中单词组织方式的背景下的字母数字排序。\n\n现在，让我们看看需要修改什么，以便算法按降序而不是升序排序。你还记得泡沫排序算法实际上是如何运作的吗？元素逐渐“泡”到索引最小的位置，就像气泡在可乐水中上升一样。你在这个练习中想要的是让较大的（而不是较小的）元素“泡”到索引较低的位置。因此，你只需要简单地反转决策控制结构的比较运算符即可！\n\
  \n降序排序字母数字值的代码片段如下。\n\n```csharp\nstring tempStr;for (m = 1; m <= ELEMENTS - 1;\
  \ m++) {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (a[n].CompareTo(a[n\
  \ - 1]) > 0) {\n            tempStr = a[n];\n            a[n] = a[n - 1];\n    \
  \        a[n - 1] = tempStr;\n        }\n    }\n}\n```\n\n### 练习 34.4-3 排序一维数组的同时保持与第二个数组的关系\n\
