  \n\n\n\n\n例如，考虑以下练习：\n\n编写一个 C# 程序，让用户输入三个数字。然后按升序排列显示这些数字。\n\n考虑以下代码片段。它让用户输入这三个数字。\n\
  \n```csharp\nfor (i = 0; i <= 2; i++) {number = Convert.ToDouble(Console.ReadLine());}\n\
  ```\n\n当循环最终完成迭代时，变量 `number` 只包含最后提供的那个数字。遗憾的是，之前的两个数字都丢失了！使用这段代码片段，可能无法将它们按升序排列显示出来。\n\
  \n一种可能的解决方案是使用三个独立的变量，如下所示。\n\n```csharp\nnum1 = Convert.ToDouble(Console.ReadLine());num2\
  \ = Convert.ToDouble(Console.ReadLine());num3 = Convert.ToDouble(Console.ReadLine());if\
  \ (num1 <= num2 && num2 <= num3)Console.WriteLine(num1 + \" \" + num2 + \" \" +\
  \ num3);else if (num1 <= num3 && num3 <= num2)Console.WriteLine(num1 + \" \" + num3\
  \ + \" \" + num2);else if (num2 <= num1 && num1 <= num3)Console.WriteLine(num2 +\
  \ \" \" + num1 + \" \" + num3);else if (num2 <= num3 && num3 <= num1)Console.WriteLine(num2\
  \ + \" \" + num3 + \" \" + num1);else if (num3 <= num1 && num1 <= num2)Console.WriteLine(num3\
  \ + \" \" + num1 + \" \" + num2);elseConsole.WriteLine(num3 + \" \" + num2 + \"\
  \ \" + num1);\n```\n\n这不是一个完美的解决方案，但它有效！然而，如果这个练习的描述要求用户输入 1,000 个数字而不是三个呢？想一想！你能为所有这些数字编写一个类似的\
  \ C# 程序吗？当然不能！幸运的是，有数据结构！\n\n![](img/notice.jpg)在计算机科学中，数据结构是组织数据的集合，以便你以最有效的方式对其进行操作。\n\
  \nC# 提供了多种数据结构，例如数组（arrays）、数组列表（arraylists）、链表（linkedlists）、列表（lists）、字典（dictionaries）和字符串（strings）。是的，你听得没错！由于字符串是字母数字字符的集合，因此它被认为的数据结构。\n\
  \n除了字符串（你已经学习了足够的内容）之外，数组和字典是 C# 中常用的数据结构。接下来的章节将分析它们。\n\n### 31.2 什么是数组？\n\n数组是数据结构的一种，可以在公共名称下存储多个值。它可以被看作元素的集合，每个元素都被分配有一个唯一的数字，称为索引位置（index\
  \ position），或简单称为索引。数组是可变的（changeable），这意味着一旦创建了数组，其元素的值就可以更改。\n\n![](img/notice.jpg)计算机科学中的数组类似于数学中使用的矩阵。数学矩阵是数字或其他数学对象的集合，按行和列排列。\n\
  \n![](img/notice.jpg)数组有一维和多维数组。多维数组可以是二维、三维、四维等。\n\n#### 一维数组\n\n下面的示例展示了一个存储六名学生成绩的一维数组。数组的名称为\
  \ `grades`。为了方便起见，相应的索引写在每个元素上方。在 C# 中，默认情况下索引编号始终从零开始。\n\n![Image](img/chapter31-01.png)\n\
  \n![](img/remember.jpg)由于索引编号从零开始，数组最后一个元素的索引比数组中元素的总数少 1。在数组 `grades` 中，最后一个元素的索引是\
  \ 5，而元素的总数是 6。\n\n你可以将数组视为六个独立的变量——`grades0`、`grades1`、`grades2`... ... `grades5`——每个变量持有一个学生的成绩。然而，数组的优势在于它可以一个公共名称下持有多个值。\n\
  \n#### 二维数组\n\n通常情况下，多维数组对于处理多组数据非常有用。例如，假设你想存储加利福尼亚州四月四周的每日最高气温。一种方法是使用四个一维数组，每周一个。此外，每个数组有七个元素，对应每周的每一天，如下。\n\
  \n![Image](img/chapter31-02.png)\n\n然而，这种方法有点笨拙，因为你必须单独处理每个数组。更好的方法是使用一个具有四行（每周一行）和七列（每周每天一列）的二维数组，如下。\n\
  \n![Image](img/chapter31-03.png)\n\n#### 三维数组\n\n下一个示例显示了一个三维数组，存储了 2013 年和 2014\
  \ 年加利福尼亚州四月四周的每日最高气温。\n\n![Image](img/chapter31-04.png)\n\n![](img/notice.jpg)注意，四维、五维甚至百维数组也是可能存在的。然而，经验表明，作为一名程序员，你一生中需要的最大数组维度可能二或三。\n\
  \n#### 练习 31.2-1 设计数组\n\n设计一个可以存储 8 个人年龄的数组，然后向数组中添加一些典型值。\n\n### 答案\n\n这是一个简单的题。你所做的就是设计一个具有\
  \ 8 个元素的数组（索引 0 到 7）。它可以是一个单行或单列的数组，如下。\n\n![Image](img/chapter31-05.png)\n\n![](img/remember.jpg)由于索引编号从零开始，数组最后一个元素的索引比数组中元素的总数少\
  \ 1。在数组 `grades` 中，最后一个元素的索引是 5，而元素的总数是 6。\n\n你可以将数组认为是六个独立的变量——`grades0`、`grades1`、`grades2`...\
  \ ... `grades5`——每个变量持有一个学生的成绩。然而，数组的优势在于它可以一个公共名称下持有多个值。\n\n#### 练习 31.2-2 设计数组\n\
  \n设计一个数组来存储七个人的姓名和年龄，然后向数组中添加一些典型值。\n\n### 答案\n\n这个题很简单。你只需要设计一个具有 8 个元素的数组。第一个个人是\
  \ John Thompson，他 17 岁。他的年龄存储在索引 0。下一个人的名字（Ava Miller）和她的年龄（25）存储在索引 1，以此此类推。\n\n\
  #### 练习 31.2-3 设计数组\n\n设计必要的数组来存储十个人的姓名以及他们在一月、二月和三月的平均体重（磅）。然后向数组添加一些典型值。\n\n###\
  \ 答案\n\n在这个练习中，你需要一个用于姓名的一维数组和一个用于体重的二维数组，它们之间有一一对应的关系。\n\n![Image](img/chapter31-07.png)\n\
  \n### 31.3 在 C# 中创建一维数组\n\nC# 有多种方法可以创建数组并向其添加元素。根据给定的问题，由你决定使用哪种。\n\n让我们尝试使用常用方法创建数组。\n\
  \n![Image](img/chapter31-08.png)\n\n#### 第一种方法\n\n要创建数组并直接为其元素赋值，可以使用下面的 C# 语句，通用格式如下：\n\
  \n```csharp\ntype[] array_name = { value0, value1, value2, … , valueM };\n```\n\n\
  其中\n\n► `type` 可以 `int`、`double`、`string` 等。► `array_name` 是数组的名称。► `value0`、`value1`、`value2`……\
  \ `valueM` 是元素的值。\n\n对于这种方法，你可以使用以下语句创建数组 `ages`：\n\n```csharp\nint[] ages = {12,\
  \ 25, 9, 11};\n```\n\n![](img/notice.jpg)索引会自动设置。值 12 被分配给索引位置 0，值 25 被分配给索引位置 1，以此此类推。默认情况下，索引编号始终从零开始。\n\
  \n![](img/notice.jpg)在第 5.4 节中你学习了在为变量命名时必须遵循的规则。为数组命名遵循完全相同的规则！\n\n#### 第二种方法\n\
  \n\n\n\n\n你可以使用以下通用形式的语句在 C# 中创建一个包含 `size` 个空元素的数组：\n\n```csharp\ntype[] array_name\
  \ = new type[size];\n```\n\n其中 `size` 可以是任何正整数值，也可以是一个包含任何正整数值的变量。\n\n下一条语句创建一个包含\
  \ 4 个空元素的数组 `ages`：\n\n```csharp\nint[] ages = new int[4];\n```\n\n![](img/notice.jpg)语句\
  \ `int[] ages = new int[4]` 在主内存（RAM）中预留了四个位置。\n\n要给数组元素赋值，你可以使用以下通用形式的语句：\n\n```csharp\n\
  array_name[index] = value;\n```\n\n其中 `index` 是该元素在数组中的索引位置。\n\n接下来的代码段创建了数组 `ages`（在主内存中预留了四个位置），然后给它的元素赋值。\n\
