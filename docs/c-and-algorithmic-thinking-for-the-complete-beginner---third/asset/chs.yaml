  \n![](img/notice.jpg)复杂的代码可能会无效的结果！尝试通过将大型嵌套决策控制结构拆分为多个较小的结构，或使用其他类型的决策控制结构，来保持代码尽可能简单。\n\
  \n显然，只要保持语法和逻辑上的正确，你可以将任何决策控制结构嵌套在任何其他决策控制结构内部。在下一个示例中，分支决策结构嵌套在一个双分支决策结构中。\n\n\
