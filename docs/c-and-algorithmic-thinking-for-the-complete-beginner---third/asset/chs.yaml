  \ 1], values[0, 0]]);\n```\n16) 下列的代码片段显示一个 3 × 4 数组的所有元素。\n```csharp\nfor (k =\
  \ 0; k <= 11; k++) {\n    i = (int)(k / 4);\n    j = k % 4;\n    Console.WriteLine(names[i,\
  \ j]);\n}\n```\n17) 下列的代码片段允许用户向数组 `b` 输入 100 个值。\n```csharp\nfor (i = 0; i <= 9;\
  \ i++) {\n    for (j = 0; j <= 9; j++) {\n        b[i, j] = Console.ReadLine();\n\
  \    }\n}\n```\n18) 如果数组 `b` 包含 10 × 20 个元素，下列的代码片段将其所有元素的值翻倍。\n```csharp\nfor (i\
  \ = 9; i >= 0; i--) {\n    for (j = 19; j >= 0; j--) {\n        b[i, j] *= 2;\n\
  \    }\n}\n```\n19) 如果数组 `b` 包含 10 × 20 个元素，下列的代码片段显示了其中的元素。\n```csharp\nfor (i\
  \ = 0; i <= 8; i += 2) {\n    for (j = 0; j <= 19; j++) {\n        Console.WriteLine(b[i,\
  \ j]);\n    }\n}\nfor (i = 1; i <= 9; i += 2) {\n    for (j = 0; j <= 19; j++) {\n\
  \        Console.WriteLine(b[i, j]);\n    }\n}\n```\n20) 下列的代码片段只显示索引为偶数的列。\n```csharp\n\
  for (j = 0; j <= 10; j += 2) {\n    for (i = 0; i <= 9; i++) {\n        Console.WriteLine(a[i,\
  \ j]);\n    }\n}\n```\n21) 一个 5 × 5 的数组是一个正方形数组。\n22) 在 `N × N` 数组的主对角线上，所有元素的行索引都等于它们的列索引。\n\
  23) 在数学中，方阵矩阵的反对角线（antidiagonal）是从数组左上角到右下角的元素集合。\n24) `N × N` 数组反对角线上的任何元素都满足方程\
  \ `i + j = N − 1`，其中 `i` 和 `j` 对应行列索引。\n25) 下列的代码片段计算 `N × N` 数组主对角线元素的和。\n```csharp\n\
  total = 0;\nfor (k = 0; k <= N - 1; k++) {\n    total += a[k, k];\n}\n```\n26) 下列的代码片段显示\
  \ `N × N` 数组的反对角线所有元素。\n```csharp\nfor (i = N - 1; i >= 0; i--) {\n    Console.WriteLine(a[i,\
  \ N - 1]);\n}\n```\n27) `N × N` 数组主对角线下方任何元素的列索引始终大于其行索引。\n\n### 32.8 复习题：单选择\n\n\
