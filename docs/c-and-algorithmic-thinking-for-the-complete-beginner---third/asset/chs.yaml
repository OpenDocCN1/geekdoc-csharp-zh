  }\n```\n\n![](img/notice.jpg) 需要 `if (maximum != -460)` 语句是因为用户有可能从一开始就输入单词“STOP”。\n\
  \n为了验证数据输入，你只需要替换以下两行代码：\n\n```csharp\nConsole.Write(\"Enter its average temperature:\
