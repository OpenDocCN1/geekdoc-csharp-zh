  \ C# 程序逐行读取文件，并将城市名称和温度分别存储在数组 `cities` 和 `temperatures` 中。假设文件中至少至少包含一个城市名称及其对应的温度。该程序必须：\n\
  \ni) 计算并显示所有城市的平均温度。\nii) 找出并显示最高温度以及具有该温度的所有城市名称。\n\n# 8) 某些单词如“revolutionary”和“internationalization”非常长，反复编写它们会非常累。假设如果一个单词的长度超过\
  \ 10 个字符，我们就认为该单词太长。在这种情况下，该单词必须替换为特殊的缩写，其生成方法如下：保留单词的首字母和最后一个字母，并在它们之间插入字母的数量。例如，“revolutionary”变为\
  \ `r11y`，“internationalization”变为 `i18n`。\n\n假设有一个名为 `f_data41.2-8.txt` 的文件，其中包含英文文本。执行以下操作：\n\
  \ni) 编写一个名为 `abbreviate` 的子程序，接受一个单词，当其长度超过 10 个字符时，返回其缩写；否则返回原单词。\nii) 使用上述子程序，编写一个\
  \ C# 程序，从文件中读取文本并显示它，同时将所有长单词替换为相应的缩写。\n\n假设单词由单个空格字符分隔。\n\n# 9) 皮格拉丁语（Pig Latin）是一种在英语国家常用的趣味性语言游戏。它涉及根据一组简单规则更改单词的字母。以下是将单词翻译成皮格拉丁语的规则：\n\
  \n- 如果单词以元音开头，直接在单词末尾添加“way”。例如，“apple”变为 `appleway`。\n- 如果单词以一个或多个辅音开头，将这些辅音移动到单词末尾并添加“ay”。例如，“banana”变为\
  \ `ananabay`，“flower”变为 `owerflay`。\n\n假设有一个名为 `f_data41.2-9.txt` 的文件，其中包含英文文本。执行以下操作：\n\
  \ni) 编写一个名为 `pigLatinTranslator` 的子程序，接受一个英文单词并返回对应的皮格拉丁语翻译。\nii) 使用上述子程序，编写一个 C#\
  \ 程序，从文件中读取文本并将对应的皮格拉丁语翻译写入文件 `pig_translation.txt`。\n\n假设文本仅包含小写字母，且单词由空格分隔。\n\n\
  # 10) 给定两个字符串 `X = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"` 和 `Y = \"JKWCTAMEDXSLFBYUNGHP\"\
  `，你可以加密任何消息。持有 Y 的人可以通过将 X 的字母逐一映射到 Y 来解密。具体来说，字母“A”加密为 `J`，字母“B”为 `K`，字母“C”为 `W`，以此此类推。根据这种加密方法，编写一个\
  \ C# 程序提示用户输入消息，然后将加密消息写入文件 `encrypted.txt`。空格字符不能加密并应保持原样。\n\n# 11) 编写一个 C# 程序解密上一个练习的消息（位于\
  \ `encrypted.txt` 中），并将解密后的消息写入名为 `decrypted.txt` 的文件中。\n\n# 12) 编写一个名为 `copyFile`\
  \ 的子程序，接受两个参数（源和目标），使用目标名称创建源的新副本。\n\n# 13) 假设有一个名为 `f_data41.2-13.txt` 的文件，其中包含三角形所有三边的长度（每行一个）。文件结构的示例所示。\n\
  \n```\n16.0\n20.6\n22.7\n```\n\n执行以下操作\n\ni) 编写一个 `Triangle` 类，包含：\na) 三个名为 `_sideA`、`_sideB`\
  \ 和 `_sideC` 的私有 float 字段。\nb) 构造函数，从文件中读取三边并将它们赋值给字段 `_sideA`、`_sideB` 和 `_sideC`。\n\
  c) 一个名为 `canBeTriangle` 的公共 Boolean 方法，检查并在当 `_sideA`、`_sideB` 和 `_sideC` 中的值可以作为三角形三边长度时返回\
  \ true；否则返回 false。提示：在任何三角形中，每边的长度都小于其他两边长度之和。\nd) 一个名为 `displayLengths` 的公共 void\
  \ 方法，显示所有三边的长度，以及一条指示这些长度是否可以是三角形三边长度的消息。\ne) 一个名为 `displayArea` 的公共 void 方法，在长度可以作为三角形三边长度的情况下，计算并显示三角形的面积。你可以使用海伦公式，该公式已经使用了近\
  \ 2000 年！\n\n其中 S 是半周。\nf) 一个名为 `displayPerimeter` 的公共 void 方法，在长度可以作为三角形三边长度的情况下，计算并显示三角形的周长。\n\
  ii) 使用上述类，编写一个 C# 程序显示关于三角形的所有可用信息。\n\n## 在“文件”中复习\n\n### 复习填字游戏\n\n1) 解决以下填字游戏。\n\
