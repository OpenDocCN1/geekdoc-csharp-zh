  \n## 24 章：循环结构简介\n\n### 24.1 什么是循环结构？\n\n循环结构是一种允许在满足特定条件下多次执行语句或语句块。\n\n### 24.2\
  \ 从顺序控制到循环结构\n\n下一个示例允许用户输入四个数字并计算并显示它们的和。正如你所示，还没有循环结构，只有顺序控制。\n\n```csharp\ndouble\
  \ x, y, z, w, total;\nx = Convert.ToDouble(Console.ReadLine());\ny = Convert.ToDouble(Console.ReadLine());\n\
  z = Convert.ToDouble(Console.ReadLine());\nw = Convert.ToDouble(Console.ReadLine());\n\
  total = x + y + z + w;\nConsole.WriteLine(total);\n```\n\n虽然这段代码很短，但考虑另一个允许用户输入千个数字而不是四个。你能想象写一千次\
  \ `Convert.ToDouble(Console.ReadLine())` 语句吗？如果只需要写一次该语句并指示计算机执行一千次，那将方便得多。这就是循环结构大显身场的地方！\n\
  \n深入研究循环结构之前，先尝试解决这个谜题！在还没有使用循环结构的情况下，显然你在想：“我用两个变量能做的事情是在变量 `x` 中读取单个值，然后将该值赋值给变量\
  \ `total`”。你的想法是正确的，如下：\n\n```csharp\nx = Convert.ToDouble(Console.ReadLine());\n\
  total = x;\n```\n\n这等价于：\n\n```csharp\ntotal = 0;\nx = Convert.ToDouble(Console.ReadLine());\n\
  total = total + x;\n```\n\n现在呢？现在你实际上有三件事可以做，这些是：思考、思考，当然还有！\n\n第一个用户提供的数字已存储在变量\
  \ `total` 中，所以变量 `x` 现在可以自由使用了！因此，你可以重用变量 `x` 读取第二个值，它也会累积在变量 `total` 中，如下：\n\n\
  ```csharp\ntotal = 0;\nx = Convert.ToDouble(Console.ReadLine());\ntotal = total\
  \ + x;\nx = Convert.ToDouble(Console.ReadLine());\ntotal = total + x;\n```\n\n![](img/notice.jpg)语句\
  \ `total = total + x` 将 `x` 的值累加到 `total` 中，这意味着它将 `x` 的值与 `total` 中之前的任何值相加。\n\n\
  \n\n由于第二个用户提供的数字已经累加到变量 `total` 中，变量 `x` 可以被重用！这个过程可以重复进行，直到四个数字都被读取并累加到变量 `total`\
  \ 中。最终代码如下。请注意，它还没有使用任何循环控制结构！\n\n```\ntotal = 0;x = Convert.ToDouble(Console.ReadLine());total\
  \ = total + x;x = Convert.ToDouble(Console.ReadLine());total = total + x;x = Convert.ToDouble(Console.ReadLine());total\
  \ = total + x;x = Convert.ToDouble(Console.ReadLine());total = total + x;Console.WriteLine(total);\n\
  ```\n\n![](img/notice.jpg)\n这段代码与本节开头的初始代码被认为是等价。然而，它们之间的主要区别在于后者包含了四对相同的语句。\n\n\
  显然，你可以使用这个示例来读取并找到四个以上数字的和。但是，多次编写这些语句对可能会非常繁琐，而且如果不小心遗漏了某一组，可能会导致错误。\n\n你真正需要的是只保留一组语句，但使用循环控制结构来执行四次（或者如果你愿意，执行\
  \ 1000 次）。你可以使用类似下面的代码片段。\n\n```\ntotal = 0;execute_these_statements_4_times {x\
  \ = Convert.ToDouble(Console.ReadLine());total = total + x;}Console.WriteLine(total);\n\
  ```\n\n显然，C# 中并没有任何 `execute_these_statements_4_times` 语句。这仅用于演示之目的，但很快你就会学习 C#\
  \ 支持的所有循环控制结构的所有知识了！\n\n### 24.3 复习题：判断对错\n\n对以下每个陈述选择对或错。\n\n1) 循环控制结构是一种允许在满足指定条件之前多次执行某语句或语句块的结构。\n\
  2) 可以使用顺序控制结构来提示用户输入 1000 个数字，然后计算它们的和。\n3) 下面的代码片段将值 10 累加到变量 `total` 中。`total\
  \ = 10;a = 0;total = total + a;`\n4) 下面的 C# 程序满足有效性属性。`int a, total;a = 5;total\
  \ = total + a;Console.WriteLine(total);`\n5) 以下两个代码片段都将值 5 赋值给变量 `total`。`a = 5;total\
  \ = a;`total = 0;a = 5;total = total + a;`\n\n## 第 25 章\n\n前测试、中测试和后测试循环结构\n\n###\
  \ 25.1 前测试循环结构\n\n前测试循环结构如流程图所示。\n\n![Image](img/chapter25-01.png)\n\n让我们看看当执行流到达前测试循环结构时会发生什么。如果\
  \ `Boolean_Expression` 求值为真，则执行该结构的语句或语句块，并且执行流返回去再次检查 `Boolean_Expression`。如果 `Boolean_Expression`\
  \ 再次求值为真，则重复该过程。当 `Boolean_Expression` 在某一点求值为假时，迭代停止，执行流退出循环。\n\n![](img/notice.jpg)\n\
  决策符号（菱形或菱形形）既用于决策控制结构，也用于循环控制结构。然而，在循环控制结构中，菱形的出口之一总有一个向上的方向。\n\n![](img/notice.jpg)\n\
  “前测试循环结构”之所以这样命名，是因为首先评估布尔表达式，然后执行该结构的语句或语句块。\n\n![](img/notice.jpg)\n因为在进入循环之前评估了布尔表达式，前测试循环可能会执行从零到多次的迭代。\n\
  \n![](img/notice.jpg)\n每次执行循环控制结构的语句或语句块时，计算机科学中的术语是“循环正在迭代”或“循环执行一次迭代”。\n\nC# 语句的一般形式是\n\
  \n`while (Boolean_Expression) {A statement or block of statements}`\n\n下面的示例显示了\
  \ 1 到 10 的数字。\n\n![](img/my_exercise_header.png) project_25.1\n```\nint i = 1;\n\
  while (i <= 10) {Console.WriteLine(i);i++;}\n```\n\n![](img/notice.jpg)\n就像决策控制结构中一样，循环控制结构内部的语句应该缩进。\n\
  \n与决策控制结构类似，当只需要一个语句作为 `while` 语句的一部分时，允许省略大括号 `{`。因此，`while` 语句可以像下面所示。\n\n`while\
  \ (Boolean_Expression)One_Single_Statement;`\n\n![](img/remember.jpg)\n为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使\
  \ `while` 语句只包含一个语句。\n\n#### 练习 25.1-1 设计流程图并计算总迭代次数\n\n为下面的代码片段设计相应的流程图。这段 C# 代码执行了多少迭代？\n\
  \n```\nint i = 4;while (i > 0) {i--;}Console.WriteLine(\"The end\");\n```\n\n**解答**\n\
  \n相应的流程图片段如下。\n\n![Image](img/chapter25-02.png)\n\n接下来，跟踪表可以帮助观察执行流。\n\n| 步骤 | 语句\
  \ | 注释 | i | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | i = 4 | | 4\
  \ | | |\n| 2 | while (i > 0) | 求值为真 | | 1st | |\n| 3 | i-- | | 3 | | |\n| 4 | while\
  \ (i > 0) | 求值为真 | | 2nd | |\n| 5 | i-- | | 2 | | |\n| 6 | while (i > 0) | 求值为真\
  \ | | 3rd | |\n| 7 | i-- | | 1 | | |\n| 8 | while (i > 0) | 求值为真 | | 4th | |\n|\
  \ 9 | i-- | | 0 | | |\n| 10 | while (i > 0) | 求值为假 | | | |\n| 11 | println(\"The\
  \ end\") | 显示: The end | | |\n\n从跟踪表中可以看出，迭代总数为四。\n\n![](img/notice.jpg)\n前测试循环结构的语句或语句块执行\
  \ N 次，布尔表达式被评估 N+1 次。因此，要确定迭代次数，计算语句或语句块执行的次数。\n\n#### 练习 25.1-2 计算总迭代次数\n\n这段代码执行了多少迭代？\n\
  \n```\nint i = 4;while (i >= 0) {Console.WriteLine(i);i--;}Console.WriteLine(\"\
  The end\");\n```\n\n**解答**\n\n与上一个几乎相同。区别在于布尔表达式在 `i = 0` 时仍然为真。因此，它额外执行了一次迭代，即五次迭代。\n\
  \n#### 练习 25.1-3 计算总迭代次数\n\n这段代码执行了多少迭代？\n\n```\nint i = 1;while (i != 6) {i +=\
  \ 2;}Console.WriteLine(\"The end\");\n```\n\n**解答**\n\n让我们创建一个跟踪表来观察执行流。\n\n| 步骤\
  \ | 语句 | 注释 | i | | |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | i = 1\
  \ | | 1 | | |\n| 2 | while (i != 6) | 求值为真 | | 1st | | |\n| 3 | i += 2 | | 3 | |\
  \ |\n| 4 | while (i != 6) | 求值为真 | | 2nd | | |\n| 5 | i += 2 | | 5 | | |\n| 6 |\
  \ while (i != 6) | 求值为真 | | 3rd | | |\n| 7 | i += 2 | | 7 | | |\n| 8 | while (i\
  \ != 6) | 求值为真 | | ... | | |\n| 9 | … | … | | |\n\n从跟踪表中可以看出，由于值 6 从未赋值给变量 `i`，这段代码将无限次迭代！显然，这段代码不满足有限性属性。\n\
  \n#### 练习 25.1-4 计算总迭代次数\n\n这段代码执行了多少迭代？\n\n```\nint i = -10;while (i > 0) {Console.WriteLine(i);i--;}Console.WriteLine(\"\
  The end\");\n```\n\n**解答**\n\n最初，将 -10 赋值给变量 `i`。布尔表达式直接求值为假，执行流直接进入 `Console.WriteLine(\"\
  The end\")` 语句。因此，这段代码执行了零迭代。\n\n#### 练习 25.1-5 寻找四个数字的和\n\n使用前测试循环结构编写一个 C# 程序，让用户输入四个数字，然后计算并显示它们的和。\n\
  \n**解答**\n\n\n\n\n你还记得第 24.2 节中计算四个数字之和的示例吗？在最后，经过简单的处理后，建议的代码片段变为：\n\n```cs\ntotal\
  \ = 0;execute_these_statements_4_times {x = Convert.ToDouble(Console.ReadLine());total\
  \ = total + x;}Console.WriteLine(total);\n```\n\n现在，你需要一种方法用真实的 C# 语句来“呈现” `execute_these_statements_4_times`\
  \ 语句。`while` 语句可以实现这一点，但你需要一个额外的变量来计算迭代的总数。这样，当执行了所需的迭代次数后，执行流将退出循环。\n\n以下是一个通用的代码片段，它会根据\
  \ `total_number_of_iterations`指定的次数进行迭代：\n\n```cs\ni = 1;while ( i <= total_number_of_iterations\
  \ ) {A statement or block of statementsi++;}\n```\n\n其中 `total_number_of_iterations`\
  \ 可以是一个常量值，甚至是一个变量或表达式。\n\n将此代码片段与上一个结合后，最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ project_25.1-5double total, x;int i;total = 0;i = 1;while (i <= 4) {x = Convert.ToDouble(Console.ReadLine());\
  \    [[More…]](#more.xhtml_more_25_1_5_1)total = total + x;i++;}Console.WriteLine(total);\n\
  \n![](img/notice.jpg)变量 `i` 的名称并不是固定的。你可以使用任何喜欢的变量名，例如 `counter`、`count`、`k` 等。\n\
  \n#### 练习 25.1-6 寻找奇数的之和\n\n设计一个流程图并编写相应的 C# 程序，让用户输入 20 个整数，然后计算并显示奇数的和。\n\n**解答**\n\
  \n这非常简单。程序在循环内部必须做的是检查用户提供的数字是否为奇数，如果是奇数，则该数字必须累加到变量 `total` 中；偶数则被忽略。流程图所示。它包含一个嵌套在预测试循环结构中的单分支决策结构。\n\
  \n![Image](img/chapter25-03.png)\n\n对应的 C# 程序如下：\n\n![](img/my_exercise_header.png)\
  \ project_25.1-6int total, i, x;total = 0;i = 1;while (i <= 20) {x = Convert.ToInt32(Console.ReadLine());if\
  \ (x % 2 != 0) {\n\n> total += x;    //这等于 total = total + x\n\n}i++;}Console.WriteLine(total);\n\
  \n![](img/notice.jpg)你可以将任何决策控制结构嵌套在任何循环控制结构中，只要它们在语法和逻辑上是正确的。\n\n#### 练习 25.1-7\
  \ 寻找 N 个数字之和\n\n编写一个 C# 程序，让用户输入 N 个数字，然后计算并显示它们的和。`N` 的值必须在程序开始时由用户提供。\n\n**解答**\n\
  \n在此练习中，迭代的总数取决于用户必须输入的值。以下是一个通用的代码片段，它迭代 N 次，其中 `N` 由用户提供。\n\n```cs\nn = Convert.ToInt32(Console.ReadLine());i\
  \ = 1;while (i <= n) {A statement or block of statementsi++;}\n```\n\n根据你目前所学的知识，最终程序变为：\n\
  \n![](img/my_exercise_header.png) project_25.1-7int n, i;double x, total;total =\
  \ 0;n = Convert.ToInt32(Console.ReadLine());i = 1;while (i <= n) {x = Convert.ToDouble(Console.ReadLine());total\
  \ += x;i++;}Console.WriteLine(total);\n\n#### 练习 25.1-8 寻找未知数量数字之和\n\n编写一个 C# 程序，让用户重复输入整数值，直到输入值\
  \ -1 为止。数据输入完成后，必须显示所输入数字之和。（-1 的值不能包含在最终和中）。接下来，创建一个跟踪表，使用 10、20、5 和 -1 作为输入值来检查你的程序运行是否正常。\n\
  \n**解答**\n\n在此练习中，迭代的总数是未知的。如果你使用决策控制结构，你的程序看起来 own 下面的代码片段：\n\n```cs\ntotal = 0;x\
  \ = Convert.ToInt32(Console.ReadLine());if (x != -1) {  //检查变量 x               \
  \       total += x;   //并执行此语句 x = Convert.ToInt32(Console.ReadLine());  //并执行这一个\
  \ if (x != -1) {  //检查变量 x\n\n> total += x;   //并执行此语句\n\n> x = Convert.ToInt32(Console.ReadLine());\
  \  //并执行这一个\n\n> if (x != -1) {  //检查变量 x\n\n> > total += x;   //并执行此语句\n\n> > x\
  \ = Convert.ToInt32(Console.ReadLine());  //并执行这一个\n\n> > if (x != -1) {  //检查变量\
  \ x\n\n```\n\n现在让我们用循环结构来重写这个程序。最终程序如下：\n\n![](img/my_exercise_header.png) project_25.1-8double\
  \ total;total = 0;x = Convert.ToInt32(Console.ReadLine());if (x != -1) {total +=\
  \ x;x = Convert.ToInt32(Console.ReadLine());}Console.WriteLine(total)\n\n现在创建一个跟踪表，使用\
  \ 10、20、5 和 -1 作为输入值，确定该程序运行是否正常。\n\n| 步骤 | 语句 | x | total |\n| --- | --- | ---\
  \ | --- |\n| 1 | `total = 0` | - | 0 |\n| 2 | `x = Convert.ToInt32(Console.ReadLine())`\
  \ | 10 | 0 |\n| 3 | `if (x != -1)` | 10 | 0 |\n| 4 | `total += x` | 10 | 10 |\n\
  | 5 | `x = Convert.ToInt32(Console.ReadLine())` | 20 | 10 |\n| 6 | `if (x != -1)`\
  \ | 20 | 10 |\n| 7 | `total += x` | 20 | 30 |\n| 8 | `x = Convert.ToInt32(Console.ReadLine())`\
  \ | 5 | 30 |\n| 9 | `if (x != -1)` | 5 | 30 |\n| 10 | `total += x` | 5 | 35 |\n\
  | 11 | `x = Convert.ToInt32(Console.ReadLine())` | -1 | 35 |\n| 12 | `if (x != -1)`\
  \ | -1 | 35 |\n| 13 | `Console.WriteLine(total)` | -1 | 35 |\n\n如你所示，最后 `total`\
  \ 包含了值 35，这确实是 10 + 20 + 5 的和。此外，用户提供的 -1 值不参与和。\n\n#### 练习 25.1-9 寻找 20 个数字的乘积\n\
  \n编写一个 C# 程序，让用户输入 20 个数字，然后计算并显示它们的乘积。\n\n**解答**\n\n如果你使用序列控制结构，它将像下面：\n\n```cs\n\
  p = 1;x = Convert.ToDouble(Console.ReadLine());p = p * x;x = Convert.ToDouble(Console.ReadLine());p\
  \ = p * x;……x = Convert.ToDouble(Console.ReadLine());p = p * x;\n```\n\n![](img/notice.jpg)注意变量\
  \ `p` 初始化为 1 而不是 0。为了让语句 `p = p * x` 正常运行，这是必要的；否则最终乘积将为零。\n\n利用之前练习的知识，最终程序变为：\n\
  \n![](img/my_exercise_header.png) project_25.1-9double p, x;int i;p = 1;i = 1;while\
  \ (i <= 20) {x = Convert.ToDouble(Console.ReadLine());p = p * x;i++;}Console.WriteLine(p);\n\
  \n### 25.2 后测试循环结构\n\n后测试循环结构在流程图所示。\n\n![Image](img/chapter25-04.png)\n\n![](img/remember.jpg)在循环结构中，菱形的一个出口总是向上的。\n\
  \n让我们看看当执行流到达后测试循环结构时发生什么。该结构的语句或语句块被直接执行，如果 `Boolean_Expression` 为真，执行流返回到语句或语句块上方的点。语句或语句块再次执行，如果\
  \ `Boolean_Expression` 再次为真，则重复该过程。当 `Boolean_Expression` 在某处评估为假时，迭代停止，执行流退出循环。\n\
  \n\n\n\n![](img/notice.jpg)后测试循环与先测试循环的区别在于，后测试循环首先执行结构中的语句或语句块，然后才求值布尔表达式。因此，后测试循环至少执行一次迭代！\n\
  \n![](img/remember.jpg)每当循环控制结构的语句或语句块被执行一次时，计算机科学中的术语是“循环正在迭代（iterating）”或“循环执行了一次迭代”。\n\
  \nC# 语句的通用形式为：\n\n```csharp\ndo {A statement or block of statements} while (Boolean_Expression);\n\
  ```\n\n以下示例显示了数字 1 到 10。\n\n![](img/my_exercise_header.png)  project_25.2\n```csharp\n\
  int i = 1;do {Console.WriteLine(i);i++;} while (i <= 10);\n```\n\n![](img/notice.jpg)注意\
  \ `do-while` 语句结尾有一个分号（ `;` ）。\n\n当只需要一个单一语句作为 `do-while` 语句的一部分时，允许省略大括号 `{ }`。因此，`do-while`\
  \ 语句可以像下面所示写：\n\n```csharp\ndoOne_Single_Statement;while (Boolean_Expression);\n\
  ```\n\n![](img/notice.jpg)为了防止潜在的逻辑错误，许多程序员倾向于即使 `do-while` 语句仅包含一个语句也使用大括号。\n\n\
  ### 练习 25.2-1 设计流程图并计算总迭代次数\n\n为以下代码段设计相应的流程图。这段 C# 代码执行了多少迭代？\n\n```csharp\nint\
  \ i;i = 3;do {i--;} while (i > 0);Console.WriteLine(\"The end\");\n```\n\n### 答案\n\
  \n相应的流程图片段如下。\n\n.![Image](img/chapter25-05.png)\n\n现在，让我们创建一个追踪表来观察执行流。\n\n| 步骤\
  \ | 语句 | 注释 | i | | |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `i = 3` | |\
  \ 3 | | |\n| 2 | `i--` | | 2 | 第 1 次 | 迭代 |\n| 3 | `while (i > 0)` | 求值结果为真 | |\
  \ | |\n| 4 | `i--` | | 1 | 第 2 次 | 迭代 |\n| 5 | `while (i > 0)` | 求值结果为真 | | | |\n\
  | 6 | `i--` | | 0 | 第 3 次 | 迭代 |\n| 7 | `while (i > 0)` | 求值结果为假 | | | |\n| 8 |\
  \ `.WriteLine(\"The end\")` | 显示：The end | | | |\n\n如你从追踪表所示，总迭代次数为三次。\n\n![](img/notice.jpg)后测试循环结构中的语句或语句块会被执行\
  \ N 次，布尔表达式也会求值 N 次。因此，要确定总迭代次数，你可以计算语句或语句块的执行次数，或者计算布尔表达式的求值次数。这两个计数是相等！\n\n###\
  \ 练习 25.2-2 计算总迭代次数\n\n这段代码段执行了多少迭代？\n\n```csharp\nint i = 3;do {Console.WriteLine(i);i--;}\
  \ while (i >= 0);Console.WriteLine(\"The end\");\n```\n\n### 答案\n\n这个练习与上一个几乎相同。主要区别在于这里的布尔表达式在\
  \ `i = 0` 时仍然保持为真。因此，它多执行了一次迭代，即四次。\n\n### 练习 25.2-3 设计流程图并计算总迭代次数\n\n为以下代码段设计相应的流程图。这段代码执行了多少迭代？\n\
  \n```csharp\nint i = -1;do {Console.WriteLine(\"Hello there!\");i--;} while (i >\
  \ 0);Console.WriteLine(\"The end\");\n```\n\n### 答案\n\n相应的流程图片段如下。\n\n.![Image](img/chapter25-06.png)\n\
  \n最初将值 -1 赋值给变量 `i`。在循环内部，显示消息“Hello there!”并且变量 `i` 减 1（结果为 -2）。布尔表达式 `i > 0` 求值为假，执行流直接进入\
  \ `Write (\"The end\")` 语句。因此，该算法执行了一次迭代！\n\n### 练习 25.2-4 计算总迭代次数\n\n这段代码段执行了多少迭代？\n\
  \n```csharp\nint i = 1;do {i = i + 2;} while (i != 4);Console.WriteLine(\"The end\"\
  );\n```\n\n### 答案\n\n让我们创建一个追踪表来观察执行流。\n\n| 步骤 | 语句 | 注释 | i | | |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| 1 | `i = 1` | | 1 | | |\n| 2 | `i = i + 2` | | 3\
  \ | 第 1 次 | 迭代 |\n| 3 | `while (i != 4)` | 求值结果为真 | | | |\n| 4 | `i = i + 2` | |\
  \ 5 | 第 2 次 | 迭代 |\n| 5 | `while (i != 4)` | 求值结果为真 | | | |\n| 6 | `i = i + 2` |\
  \ | 7 | 第 3 次 | 迭代 |\n| 7 | `while (i != 4)` | 求值结果为真 | | | |\n| 8 | … | … | ...\
  \ | ... |\n| 9 | … | … | ... | ... |\n\n如你从追踪表所示，总迭代次数为三次。（等等，追踪显示这是一个无限循环，因为 `i`\
  \ 跳过了 4）。\n\n### 练习 25.2-5 寻找 N 的乘积\n\n编写一个 C# 程序，允许用户输入 N 然后计算并显示它们的乘积。左侧使用后测试循环而右侧使用先测试循环。然而，当用户为\
  \ N 输入非正值时，两个程序的运行方式不同。例如，如果输入值为 0，左侧程序执行零次迭代，而右侧程序执行一次迭代。\n\n\n\n\n\n## 练习 25.3-1\
