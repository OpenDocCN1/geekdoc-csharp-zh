  \n#### 练习 33.4-1 使用三个一维数组\n\n有 20 名学生，每个人都收到了两门课程的成绩。编写一个 C# 程序，提示用户输入每个学生两门课程的姓名和成绩。程序必须找到并显示所有两门课程成绩都大于\
  \ 89 的学生姓名。\n\n解决方案\n\n以下是所需的数组，包含一些典型值。\n\n![Image](img/chapter33-07.png)\n\n\n\
  \n正如你所看到的，数组 `names` 中的元素与数组 `gradesLesson1` 以及 `gradesLesson2` 中的元素之间存在一一对应的关系。这\
  \ 20 名学生中的第一个是 George，他在两门课程中获得的分分别是 95 分和 92 分。“George”这个名字存储在 `names` 数组的索引 0\
  \ 处，在 `gradesLesson1` 和 `gradesLesson2` 数组相同的索引处也存储了这两门课程的成绩。下一个学生（Anna）和她的成绩分别存储在\
  \ `names`、`gradesLesson1` 和 `gradesLesson2` 数组的索引 1 处，依此类推。\n\n该 C# 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_33.4-1\n```csharp\nconst int STUDENTS = 20;\nint i;\nstring[] names =\
  \ new string[STUDENTS];\nint[] gradesLesson1 = new int[STUDENTS];\nint[] gradesLesson2\
  \ = new int[STUDENTS];\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    Console.Write(\"\
  Enter student name No\" + (i + 1) + \": \");\n    names[i] = Console.ReadLine();\n\
  \    Console.Write(\"Enter grade for lesson 1: \");\n    gradesLesson1[i] = Convert.ToInt32(Console.ReadLine());\n\
  \    Console.Write(\"Enter grade for lesson 2: \");\n    gradesLesson2[i] = Convert.ToInt32(Console.ReadLine());\n\
  }\n//显示两门课程成绩均大于 89 的名字\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    if (gradesLesson1[i]\
  \ > 89 && gradesLesson2[i] > 89) {\n        Console.WriteLine(names[i]);\n    }\n\
  }\n```\n\n#### 练习 33.4-2 使用一维数组结合二维数组\n\n有 10 名学生，他们每个人都收到了五门课程的成绩。编写一个 C# 程序，提示用户输入每个学生的姓名和所有课程的成绩，然后计算并显示有多一个成绩大于\
  \ 89 分的学生姓名。\n\n##### 解决方案\n\n在本次练习中，你可以采取与上一个相同的方法。例如，你可以使用一维数组来存储学生的姓名，并使用五个一维数组来存储每个学生每门课程的成绩。这并不十分方便，但可以可行。显然，当成绩超过两门时，这不是最合适的方法。\n\
  \n这里最好的方法是使用一个一维数组来存储学生的姓名，并使用一个二维数组来存储每个学生每门课程的成绩。\n\n实际上有两种方法。使用哪种方法完全取决于你！如果你决定在二维数组中，行代表学生，列代表课程，那么你可以使用下面讨论的第一种方法。如果你决定行代表课程，列代表学生，则可以使用后面的第二种方法。\n\
  \n###### 第一种方法——行表示学生，列表示课程\n\n在这种方法中，二维数组必须有 10 行（每行代表一个学生）和 5 列（每列代表一门课程）。其他数组可以按如下方式与该二维数组对应。\n\
  \n![Image](img/chapter33-08.png)\n\n![](img/notice.jpg)程序将创建一个辅助数组 `count`，并存储每个学生大于\
  \ 89 分的成绩数量。\n\n现在，让我们看看如何读取值并存储在 `names` 和 `grades` 数组中。一种简单的解决方案是使用一个 `for`-循环来读取姓名，然后使用嵌套的\
  \ `for`-循环来读取成绩。然而，对于用户来说，先输入所有姓名再输入所有成绩可能并不实用。一种更符合用户的方法是提示用户输入一个学生的姓名以及他们所有的成绩，然后处理下一个学生姓名及其相应的成绩，依此类推。解决方案如下。\n\
  \n![](img/my_exercise_header.png) project_33.4-2a\n```csharp\nconst int STUDENTS\
  \ = 10;\nconst int LESSONS = 5;\nint i, j;\n// 一口气读取姓名和成绩。遍历 grades 数组中的行\nstring[]\
  \ names = new string[STUDENTS];\nint[,] grades = new int[STUDENTS, LESSONS];\nfor\
  \ (i = 0; i <= STUDENTS - 1; i++) {\n    Console.Write(\"Enter name for student\
  \ No. \" + (i + 1) + \": \");\n    names[i] = Console.ReadLine();\n    for (j =\
  \ 0; j <= LESSONS - 1; j++) {\n        Console.Write(\"Enter grade No. \" + (j +\
  \ 1) + \" for \" + names[i] + \": \");\n        grades[i, j] = Convert.ToInt32(Console.ReadLine());\n\
  \    }\n}\n// 创建数组 count。遍历行\nint[] count = new int[STUDENTS];\nfor (i = 0; i <=\
  \ STUDENTS - 1; i++) {\n    count[i] = 0;\n    for (j = 0; j <= LESSONS - 1; j++)\
  \ {\n        if (grades[i, j] > 89) {\n            count[i]++;\n        }\n    }\n\
  }\n// 显示有多一个成绩大于 89 分的学生姓名\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    if (count[i]\
  \ > 1) {\n        Console.WriteLine(names[i]);\n    }\n}\n```\n\n###### 第二种方法——行表示课程，列表示学生\n\
  \n在这种方法中，二维数组必须有 5 行（每行代表一门课程）和 10 列（每列代表一个学生）。其他数组可以按如下方式与该二维数组对应，所示。\n\n![](img/notice.jpg)程序将创建一个辅助数组\
