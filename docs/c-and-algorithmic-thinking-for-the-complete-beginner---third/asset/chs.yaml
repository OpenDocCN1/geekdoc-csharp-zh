  //Define the getter\nget {\n    Dictionary<int, string> number2roman = new() {\n\
  \        {1, \"I\" }, {2, \"II\" }, {3, \"III\" }, {4, \"IV\"}, {5, \"V\"}\n   \
  \ };\n    return number2roman[_number];\n}\n```\n\n相应，setter 可以如下：\n\n```csharp\n\
  //Define the setter\nset {\n    Dictionary<string, int> roman2number = new() {\n\
