  \n让我们请四个人按顺序出现。假设他们的体重按出现顺序分别为 `165`、`170`、`160` 和 `180`。\n\n| 步骤 | 大脑中的最小值值 |\n\
  | :--- | :--- |\n| 第一个人走过来，体重为 `165` 磅。在大脑中记住体重（想象一个名为 `minimum` 的变量）。 | `minimum\
  \ = 165` |\n| 第二个人走过来，体重为 `170` 磅。他没有你大脑中记住的重量轻，所以你要忽略他的体重。 | `minimum = 165` |\n\
  | 第三个个人走过来，体重为 `160` 磅，比你大脑中记住的重量轻，所以你要忘记之前的值并在变量中记住 `160`。 | `minimum = 160` |\n\
  | 第四个人走过来，体重为 `180` 磅。他没有你大脑中记住的重量轻，所以你要忽略他的体重。变量中的值仍然是 `160`。 | `minimum = 160`\
  \ |\n\n当过程结束，大脑中的变量 `minimum` 包含了最轻人的体重！\n\n以下是流程图以及相应的 C# 程序，该程序提示用户输入四个人的体重，然后找到并显示最轻的重量。\n\
  \n![Image](img/chapter23-04.png)\n\n![](img/my_exercise_header.png) project_23.2\n\
  ```csharp\nint w1, w2, w3, w4, minimum;\nConsole.Write(\"Enter the weight of four\
  \ men:\");\nw1 = Convert.ToInt32(Console.ReadLine());\nw2 = Convert.ToInt32(Console.ReadLine());\n\
  w3 = Convert.ToInt32(Console.ReadLine());\nw4 = Convert.ToInt32(Console.ReadLine());\n\
  //记住第一个人的体重\nminimum = w1;\n// 如果第二个个人更轻，忘记之前的\n//值并记住他的体重\nif (w2 < minimum) {\n\
  \    minimum = w2;\n}\n//如果第三个个人更轻，忘记之前的\n//值并记住他的体重\nif (w3 < minimum) {\n    minimum\
  \ = w3;\n}\n//如果第四个个人更轻，忘记之前的\n//值并记住他的体重\nif (w4 < minimum) {\n    minimum = w4;\n\
  }\nConsole.WriteLine(minimum);\n```\n\n**注意：** 注意此程序试图寻找最低值，而不是该值实际上赋值给了哪个变量。\n\n\
