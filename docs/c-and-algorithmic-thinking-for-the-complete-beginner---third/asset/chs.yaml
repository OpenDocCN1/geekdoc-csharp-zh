  \    }\n    x++;\n}\n```\n消息“Hello Artemis”显示\na) 无限次。\nb) 1500 次。\nc) 6 次。\nd)\
  \ 以上都不是。\n\n4) 以下代码片段\n```cpp\nfor (i = 1; i <= 3; i++) {\n    for (j = 1; j <=\
