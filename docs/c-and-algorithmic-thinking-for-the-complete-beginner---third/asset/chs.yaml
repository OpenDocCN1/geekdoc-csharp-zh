  \n\n\n\n\n你目前为止看到的所有程序都可以描述为“临时”的。尽管它们读取了一些输入数据并显示了某些输出结果，但所有的值都存储在计算机内存（RAM）中的变量、数组和其他数据结构中；因此，当程序执行结束时，这些值都会丢失。即使没有发生这种情况，在你关闭电脑时它们也会丢失。然而，在许多情况下，你需要将这些值保留在更持久的存储设备中，例如硬盘（HDD）或固态硬盘（SSD）。\n\
  \nC# 可以读取存储在计算机文件中输入数据，也可以向相同或不同的文件写入输出结果。这种读取/写入过程被称为文件 I/O（文件输入/输出），可以使用 C# 的一些现成方法来实现。\n\
  \n通常，使用的文件类型是文本文件。文本文件包含字符序列，并存储在持久存储设备（HDD、SSD 等）中。\n\n![](img/notice.jpg)计算机编程中使用的另一种文件是“二进制文件”；然而，这种类型超出了本书的范围，将不再进行进一步分析。\n\
  \n在接下来的章节中，你将学习如何打开和关闭文本文件，如何从文本文件中读取值或向其写入值，甚至如何在其中搜索某个值。\n\n### 40.2 打开文件\n\n\
  `StreamReader` 和 `StreamWriter` 是两个可以用于从文本文件读取数据和向其写入数据的类。`StreamWriter` 类还可以将数据追加到文本文件中。\n\
  \n要使用文件进行读取，你要做的第一件事是打开文件。在 C# 中，这是通过以下通用形式的语句实现的：\n\n```\nStreamReader descriptor;\n\
  descriptor = File.OpenText(filename);\n```\n\n或者更简洁的语句：\n\n```\nStreamReader descriptor\
  \ = File.OpenText(filename);\n```\n\n其中\n\n- `descriptor` 是文件对象的名称，用于从文件中读取。\n-\
  \ `filename` 是一个包含存储在硬盘（或其他任何存储设备，如 SSD、USB 闪存等）中的文件夹（目录）和文件名的字符串。如果文件 `filename`\
  \ 不，C# 将抛出运行时错误。\n\n![](img/notice.jpg)当你打开一个文件进行读取时，文件指针将位于文件的开头（位置 0）。\n\n![](img/notice.jpg)在某种程度上，文件指针可以比作数组的索引。你将在第\
  \ 40.5 节中学习更多关于文件指针的知识。\n\n相应地，要使用文件进行写入，你要做的第一件事是使用以下通用形式的语句打开文件：\n\n```\nStreamWriter\
  \ descriptor;\ndescriptor = File.CreateText(filename);\n```\n\n或者更简洁的语句：\n\n```\n\
  StreamWriter descriptor = File.CreateText(filename);\n```\n\n如果文件 `filename` 已经存在，C#\
  \ 将覆盖它；否则，C# 将创建一个新文件。\n\n同样，要使用文件进行追加，你需要使用以下通用形式的语句打开文件：\n\n```\nStreamWriter\
  \ descriptor;\ndescriptor = File.AppendText(filename);\n```\n\n或者更简洁的语句：\n\n```\n\
  StreamWriter descriptor = File.AppendText(filename);\n```\n\n在这种情况下，如果文件 `filename`\
  \ 不存在，C# 将创建一个新文件。\n\n![](img/notice.jpg)当你打开一个文件进行追加时，文件指针将位于文件的末尾。\n\n让我们看一些示例。\n\
  \n### 示例 1\n\n以下语句\n\n```\nStreamReader f = File.OpenText(\"names.txt\");\n```\n\
  \n打开文本文件“names.txt”进行读取。文件“names.txt”必须存在于保存可执行文件（`.exe`）的相同文件夹（目录）中。如果文件不存在，C#\
  \ 将抛出运行时错误。\n\n### 示例 2\n\n该语句\n\n```\nStreamWriter fgrades = File.CreateText(\"\
  c:/temp/grades.txt\");\n```\n\n在 `c:/temp` 文件夹（目录）中创建文本文件“grades.txt”并打开它进行写入。如果文件已存在，C#\
  \ 将覆盖它。\n\n![](img/notice.jpg)注意，文件的路径定义使用斜杠（`/`）而不是反斜杠（`\\`）。\n\n### 示例 3\n\n该语句\n\
  \n```\nStreamWriter fgrades = File.AppendText(\"c:/temp/students/grades.txt\");\n\
  ```\n\n打开文本文件“grades.txt”进行追加。该文件必须存在 `c:/temp` 文件夹（目录）的“students”子文件夹（子目录）中。如果文件不存在，C#\
  \ 将创建一个新文件。\n\n### 40.3 关闭文件\n\n在完成对文件的读取、写入或追加操作后，使用 `Close()` 方法关闭文件至关重要。该方法表示已完成完成，导致操作系统（OS）保存内存（RAM）中可能存在的任何未保存数据。`Close()`\
  \ 方法的通用形式如下：\n\n```\ndescriptor.Close();\n```\n\n其中 `descriptor` 是用于打开文件的对象名称。\n\
  \n让我们看一些示例。\n\n### 示例 1\n\n以下代码段\n\n```\nStreamReader fst = File.OpenText(\"c:/temp/data.txt\"\
  );\nfst.Close();\n```\n\n打开文本文件“c:/temp/data.txt”进行读取，并在最后将其关闭。\n\n### 示例 2\n\n\
  以下代码段\n\n```\nStreamWriter f = File.AppendText(\"temperatures.txt\");\nf.Close();\n\
  ```\n\n打开文本文件“temperatures.txt”进行追加，并在最后将其关闭。\n\n## 40.4 在文件中写入（或追加）\n\n要在文件中写入（或追加）一个值，你可以使用\
  \ `Write()` 方法。该方法的通用形式为：\n\n```\ndescriptor.Write(value);\n```\n\n其中 `descriptor`\
  \ 是用于打开文件的对象名称。\n`value` 是你想要写入（或追加到）文件的字符串、整数或浮点数。\n\n以下示例在 `c:/temp` 文件夹（目录）中创建文件“f_data40.4.txt”。如果文件“f_data40.4.txt”已存在，C#\
  \ 将覆盖它；否则，C# 将创建一个新文件。然后，程序使用 `Write()` 方法写入三个字符串。\n\n![](img/my_exercise_header.png)\n\
  ```csharp\nconst string PATH = \"c:/temp/\";\nStreamWriter fout = File.CreateText(PATH\
  \ + \"f_data40.4.txt\");\nfout.Write(\"Good Morning\");\nfout.Write(\"Good Evening\"\
  );\nfout.Write(\"Good Night\");\n```\n\n这三个字符串都使用 `Write()` 方法写入了同一行。这是因为与你熟悉的 `WriteLine()`\
  \ 方法不同，`Write()` 方法不会在字符串末尾自动添加换行符。\n\n![](img/notice.jpg)打开文本文件并查看内部内容，可以使用简单的记事本程序，例如\
  \ Windows 的记事本。或者，你可以从以下地址免费下载并使用 Notepad++：\n\n[`notepad-plus-plus.org`](https://notepad-plus-plus.org)\n\
  \n要强制 C# 写入换行符，你可以使用特殊字符序列 `\\n`（在第 6.2 节中介绍）或使用 `WriteLine()` 方法。下一个示例对之前创建的文件“f_data40.4.txt”进行追加。随后，写入换行符以及三行文本。\n\
  \n![](img/my_exercise_header.png)\n```csharp\nconst string PATH = \"c:/temp/\";\n\
  StreamWriter fout = File.AppendText(PATH + \"f_data40.4.txt\");\nfout.Write(\"\\\
  n\");\nfout.Write(\"Hello!\\n\");\nfout.Write(\"Hi!\\n\");\nfout.Write(\"Bye!\\\
  n\");\nfout.Close();\n```\n\n如果你执行此程序，然后用记事本程序打开“c:/temp/f_data40.4.txt”文件，你现在将看到以下内容：\n\
  \nGood MorningGood EveningGood Night\nHello!\nHi!\nBye!\n\n![](img/notice.jpg)第一行“Good\
  \ MorningGood EveningGood Night”在打开文件追加之前就已经于文件中。\n\n使用 `WriteLine()` 方法，之前的程序可以等效地编写为如下形式。\n\
  \n\n\n\n\n![](img/my_exercise_header.png) `project_40.4c`\n\n```csharp\nconst string\
  \ PATH = \"c:/temp/\";\nStreamWriter fout = File.AppendText(PATH + \"f_data40.4-i.txt\"\
  );\nfout.WriteLine();\nfout.WriteLine(\"Hello!\");\nfout.WriteLine(\"Hi!\");\nfout.WriteLine(\"\
  Bye!\");\nfout.Close();\n```\n\n下一个示例在 `c:/temp` 文件夹中创建 `f_data40.4-ii.txt` 文件。如果文件\
  \ `f_data40.4-ii.txt` 已经存在，C# 将覆盖它；否则，C# 将创建一个新文件。然后，程序使用 `WriteLine()` 方法在文件的 10\
  \ 个单独的行上写入 10 个字符串。\n\n![](img/my_exercise_header.png) `project_40.4d`\n\n```csharp\n\
  const string PATH = \"c:/temp/\";\nint i;\nStreamWriter fout = File.CreateText(PATH\
  \ + \"f_data40.4-ii.txt\");\nfor (i = 1; i <= 10; i++) {\n    fout.WriteLine(\"\
  Line \" + i);\n}\nfout.Close();\n```\n\n### 40.5 文件指针\n\n正如前面提到的，文件指针与数组的索引非常相似。两者都用于指定读取信息的位置或写入新信息的位置。然而，文件指针和数组索引之间的主要区别在于，前者在每次执行读取或写入操作时都会自动移动。\n\
  \n假设一个文件已经包含了消息“HELLO JOHN\\nHI ALL!”。如果你打开这个特定的文件进行读取，文件指针将自动放置在文件的开头，如下所示。\n\n\
  ![Image](img/chapter40-01.png)\n\n如果你现在执行读取操作（如下一节所述），读取将从文件指针指示的位置开始，且指针将自动向末尾移动，移动的位移等于你所读取的字符数。下面是如果你从文件中读取一行时，文件指针将所在的位置。\n\
  \n![Image](img/chapter40-02.png)\n\n![](img/notice.jpg)接后的读取操作将从单词“HI”开始的位置开始。\n\
  \n相反，如果你以追加模式打开文件，文件指针将自动定位在文件的末尾，此处所示：\n\n![Image](img/chapter40-03.png)\n\n如果你随后执行写入操作，写入将从文件指针指示的位置开始，指针将自动向末尾移动，移动的位移等于你在文件中写入的字符数。\n\
  \n![Image](img/chapter40-04.png)\n\n### 40.6 从文件中读取\n\n假设文件 `f_to_be_or_not_to_be.txt`\
  \ 包含以下文本。\n\nTo be, or not to be: that is the question:\nWhether 'tis nobler in\
  \ the mind to suffer\nThe slings and arrows of outrageous fortune,\nOr to take arms\
  \ against a sea of troubles,\nAnd by opposing end them? To die: to sleep;\n\n你可以使用\
  \ `ReadLine()` 或 `ToEnd()` 方法读取此文件的内容。让我们来看一下这两种方法。\n\n#### 读取到当前行结束\n\n要从从文件的当前位置读取到当前行末尾的所有字符，并将它们赋值给变量\
  \ `line_str`，通常你可以使用以下语句：\n\n```csharp\nline_str = descriptor.ReadLine();\n```\n\
  \n其中 `descriptor` 是用于打开文件的对象的名称。`line_str` 可以是任何类型的变量。以下程序将文件 `f_to_be_or_not_to_be.txt`\
  \ 的前三行赋值变量 `a`、`b` 和 `c`。\n\n![](img/my_exercise_header.png) `project_40.6a`\n\n\
  ```csharp\nconst string PATH = \"c:/temp/\";\nstring a, b, c;\nStreamReader fin\
  \ = File.OpenText(PATH + \"f_to_be_or_not_to_be.txt\");\na = fin.ReadLine();\nb\
  \ = fin.ReadLine();\nc = fin.ReadLine();\nConsole.WriteLine(a); // 显示: To be, or\
  \ not to be: that is the question:\nConsole.WriteLine(b); // 显示: Whether 'tis nobler\
  \ in the mind to suffer\nConsole.WriteLine(c); // 显示: The slings and arrows of outrageous\
  \ fortune,\n```\n\n#### 读取到文件结束\n\n要从文件的当前位置读取到文件末尾的所有字符，并将它们赋值给变量 `line_str`，通常你可以使用以下语句：\n\
  \n```csharp\nline_str = descriptor.ToEnd();\n```\n\n其中 `descriptor` 是用于打开文件的对象的名称。`line_str`\
  \ 可以是任何类型的变量。以下程序将文件 `f_to_be_or_not_to_be.txt` 的第一行赋值给变量 `a`，并将文件的其余内容赋值给变量 `b`。\n\
  \n![](img/my_exercise_header.png) `project_40.6b`\n\n```csharp\nconst string PATH\
  \ = \"c:/temp/\";\nstring a, b;\nStreamReader fin = File.OpenText(PATH + \"f_to_be_or_not_to_be.txt\"\
  );\na = fin.ReadLine(); // 赋值第一行\nb = fin.ToEnd(); // 赋值剩余内容\nfin.Close();\nConsole.WriteLine(a\
  \ + \"\\n\" + b);\n```\n\n在下一个示例中，`ToEnd()` 方法将文件 `f_to_be_or_not_to_be.txt` 的所有内容赋值给变量\
  \ `s`。\n\n![](img/my_exercise_header.png) `project_40.6c`\n\n```csharp\nconst string\
  \ PATH = \"c:/temp/\";\nStreamReader fin = File.OpenText(PATH + \"f_to_be_or_not_to_be.txt\"\
  );\nstring s = fin.ToEnd();\nfin.Close();\nConsole.WriteLine(s);\n```\n\n### 40.7\
  \ 遍历文件\n\n遍历文件内容有两种方法。假设文件 `f_to_be_or_not_to_be.txt` 包含以下文本：\n\nTo be, or not to\
  \ be: that is the question:\nWhether 'tis nobler in the mind to suffer\nThe slings\
  \ and arrows of outrageous fortune,\nOr to take arms against a sea of troubles,\n\
  And by opposing end them? To die: to sleep;\n\n#### 第一种方法\n\n这种方法先将文件的所有内容赋值给一个变量，然后使用\
  \ `for` 结构遍历变量的字符，如下例所示。\n\n![](img/my_exercise_header.png) `project_40.7a`\n\n\
  ```csharp\nconst string PATH = \"c:/temp/\";\nstring s;\nint i;\nStreamReader fin\
  \ = File.OpenText(PATH + \"f_to_be_or_not_to_be.txt\");\ns = fin.ToEnd(); // 将文件内容赋值给\
