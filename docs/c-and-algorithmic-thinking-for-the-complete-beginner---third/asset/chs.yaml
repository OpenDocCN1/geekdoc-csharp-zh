  Nothing Entered!\");\n}\n```\n\n### 练习 30.4-3 “评分”\n\n在教室内里有 20 名学生。编写一个 C# 程序，提示老师输入学生在数学测试中得到的成绩（0\
  \ ‐ 100），然后显示最高分以及获得“A”的学生人数（即 90 到 100 分）。此外，程序必须验证数据输入。用户提供的值必须在 0 到 100 之间。\n\
