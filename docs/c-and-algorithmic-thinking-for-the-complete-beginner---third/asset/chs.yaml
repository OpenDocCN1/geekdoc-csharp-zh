  \n### 练习题 4.7-1 求三个数字的平均值\n\n设计一个计算三个数字平均值的算法。每当平均值低于 10 时，必须显示消息“Fail!”。否则，如果平均值为\
  \ 10 或以上，必须显示消息“Pass!”。\n\n### 答案\n\n在这个问题中，必须显示两条不同的消息，但每次执行算法时只能出现其中一条；消息的文字取决于平均值。算法的流程图在此处。\n\
