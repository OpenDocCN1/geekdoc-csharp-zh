  \ 等同于语句 `if (vowelsFrequency.ContainsKey(letter) == true).`\n\n### 34.7 复习题：判断对错\n\
  \n对以下每个陈述判断对或错。\n\n\n\n\n\n# 冒泡排序\n\n1. 冒泡排序算法（按升序排序数组时）的主要思想是重复地将数组中的最小元素移动到低索引位置。\n\
  2. 在按升序排序的数组中，第一个元素是所有元素最大的。\n3. 使用冒泡排序算法时，交换的总数取决于给定的数组。\n4. 冒泡排序算法交换次数最多的情况是当你想要对一个已经升序排序的数组进行降序排序时。\n\
  5. 在冒泡排序算法中，当判断控制结构测试布尔表达式 `A[n] > A[n − 1]` 时，意味着数组 `A` 的元素正在按降序排序。\n6. 在 `C#`\
  \ 中，排序算法比较字母的方式与比较数字的方式不同。\n7. 如果你想排序数组 `A` 但保持与数组 `B` 元素的一一对应关系，你必须同样重新排列数组 `B`\
  \ 的元素。\n8. 冒泡排序算法有时性能优于改进后的冒泡排序算法。\n9. 根据冒泡排序算法，在每一轮中（最后一次除外），只能保证有一个元素被放置在正确的位置。\n\
  10. 冒泡排序算法只能通过使用 `for-loops` 实现。\n11. 快速排序算法不能用于对二维数组的每一列进行排序。\n12. 插入排序算法可以按降序或升序排序。\n\
  13. 最快的排序算法之一是改进后的冒泡排序算法。\n14. 对于一个包含 `N` 个元素的一维数组，冒泡排序算法执行了 ![Image](img/chapter34-49.png)\
  \ 次比较。\n15. 对于一个包含 `N` 个元素的一维数组，冒泡排序算法执行了 ![Image](img/chapter34-50.png) 轮遍历。\n\
  16. 使用改进后的冒泡排序算法时，如果执行了一次完整的遍历且没有进行任何交换，则算法知道数组已经排序，不需要再进行后续遍历了。\n17. 使用选择排序算法时，如果你想对数组进行降序排序，则需要寻找最大值。\n\
  18. 选择排序算法在主内存有限的计算机系统上表现良好。\n19. 选择排序算法适用于大规模数据操作。\n20. 选择排序算法是一种非常复杂的算法。\n21.\
  \ 插入排序算法的性能通常优于选择排序和冒泡排序。\n22. 插入排序算法有时甚至比快速排序算法更快。\n23. 快速排序算法被认为是最好且最快的排序算法之一。\n\
  24. 排序后的数组只包含互不相同的元素。\n\n# 搜索算法\n\n25. 搜索算法是一种在数据集中查找具有特定特征的项的算法。\n26. 顺序搜索算法只能用于包含算术值的数组。\n\
  27. 最常用的搜索算法之一是快速搜索算法。\n28. 一种搜索算法被称为堆排序算法。\n29. 线性（或顺序）搜索算法的工作原理如下：它可以检查检查数组的最后一个元素是否等于给定的值，然后检查倒数第二个元素，依此类推，直到到达数组开头或找到给定的值。\n\
  30. 在某些情况下，线性搜索算法可以比二分搜索算法更快地找到元素。\n31. 线性搜索算法可以用于大规模数据操作。\n32. 线性搜索算法不能用于已排序数组。\n\
  33. 二分搜索算法可以用于大规模数据操作。\n34. 如果数组中多次包含某个值，二分搜索算法只能找到该值按顺序出现的第一次出现。\n35. 使用搜索算法时，如果数组包含唯一值且找到了你正在寻找的元素，则没有必要继续检查。\n\
  36. 二分搜索算法的主要缺点是数据需要排序。\n37. 二分搜索算法只能用于包含算术值的数组。\n38. 如果你正在寻找的元素在数组的最后一个位置，从数组开始搜索的线性搜索算法将检查数组中的所有元素。\n\
  39. 线性搜索算法可以用于二维数组。\n40. 如果你使用二分搜索算法查找的元素位于一个至少包含三个元素的数组第一个位置，则它只需一次迭代即可被找到。\n\n\
  # 34.8 复习练习\n\n完成以下练习题。\n\n1. 编写与以下流程图片段对应的 `C#` 程序。\n\n![Image](img/chapter34-51.png)\n\
