  Provided value exists in array \" + searchAndCount(x, a) + \" times\");\n```\n\n\
  # 练习 38.2-5 骰子每个数字出现了多少？\n\n使用上一个练习（练习 38.2-4）中提到的 `dice()` 和 `searchAndCount()`\
  \ 方法，编写一个 C# 程序，用 100 个随机整数（1 到 6 之间）填充数组，然后显示六个数字每个出现的次数，以及哪个数字出现最多。\n\n## 解决方案\n\
  \n如果你不使用循环控制结构解决此练习，将按照以下步骤进行：\n\n// 将 `n1` 赋值为数组中数字 1 出现的次数 `n1 = searchAndCount(1,\
  \ a)`\n// 将 `n2` 赋值为数组中数字 2 出现的次数 `n2 = searchAndCount(2, a)`\n...\n// 将 `n6` 赋值为数组中数字\
  \ 6 出现的次数 `n6 = searchAndCount(6, a)`\n// 显示数组中六个数字每个出现的次数 `Console.WriteLine(n1\
  \ + \"  \" + n2 + \"  \" + n3 + \"  \" + n4 + \"  \" + n5 + \"  \" + n6)`\n// 寻找\
  \ `n1`, `n2`… `n6` 中的最大值 `maximum = n1;maxI = 1;`\n`if (n2 > maximum) {maximum =\
  \ n2;maxI = 2;}`\n`if (n3 > maximum) {maximum = n3;maxI = 3;}`\n...\n`if (n6 > maximum)\
  \ {maximum = n6;maxI = 6;}`\n// 显示数组中出现最多的数字。`Console.WriteLine(maxI);`\n\n```csharp\n\
  const int ELEMENTS = 100;\nint[] a = new int[ELEMENTS];\nint i;\nfor (i = 0; i <\
  \ ELEMENTS; i++) {\n    a[i] = dice();\n}\nint n1 = searchAndCount(1, a);\nint n2\
  \ = searchAndCount(2, a);\nint n3 = searchAndCount(3, a);\nint n4 = searchAndCount(4,\
  \ a);\nint n5 = searchAndCount(5, a);\nint n6 = searchAndCount(6, a);\nConsole.WriteLine(n1\
  \ + \"  \" + n2 + \"  \" + n3 + \"  \" + n4 + \"  \" + n5 + \"  \" + n6);\nint maximum\
  \ = n1;\nint maxI = 1;\nif (n2 > maximum) {\n    maximum = n2;\n    maxI = 2;\n\
  }\nif (n3 > maximum) {\n    maximum = n3;\n    maxI = 3;\n}\nif (n4 > maximum) {\n\
  \    maximum = n4;\n    maxI = 4;\n}\nif (n5 > maximum) {\n    maximum = n5;\n \
  \   maxI = 5;\n}\nif (n6 > maximum) {\n    maximum = n6;\n    maxI = 6;\n}\nConsole.WriteLine(\"\
  Most frequent number is \" + maxI);\n```\n\n\n\n\n但现在你已经读到了这本书的末尾，当然你可以做一些更有创造性的事情。与其将\
  \ `searchAndCount()` 方法的每个结果赋值给单独变量 `n1`、`n2`、`n3`、`n4`、`n5` 和 `n6`，你可以将这些结果赋值给名为\
  \ `n` 的数组的位置 `0`、`1`、`2`、`3`、`4` 和 `5`，所示。\n\n```csharp\nint[] n = new int[6];for\
  \ (i = 0; i <= 5; i++) {n[i] = searchAndCount(i + 1, a);}\n```\n\n之后，你可以使用在 34.3\
  \ 节中学到的知识找到数组 `n` 的最大值。\n\n完整的解决方案所示。\n\n![](img/my_exercise_header.png) project_38.2-5\n\
  ```csharp\nconst int ELEMENTS = 100;\nint dice() {Random rnd = new();return rnd.Next(1,\
  \ 7);}\nint searchAndCount(int x, int[] a) {int count = 0;int i;for (i = 0; i <=\
  \ ELEMENTS - 1; i++) {\n    if (a[i] == x) {\n        count++;\n    }\n}return count;}\n\
  int i, maximum, maxI;\n//创建一个 1 到 6 之间的随机整数数组 a\nint[] a = new int[ELEMENTS];\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {a[i] = dice();}\n// 创建数组 n 并显示这六个数字在数组 a 中出现的次数\n\
  int[] n = new int[6];\nfor (i = 0; i <= 5; i++) {n[i] = searchAndCount(i + 1, a);Console.WriteLine(\"\
  Value \" + (i + 1) + \" appears \" + n[i] + \" times\");}\n// 找到数组 n 的最大值\nmaximum\
  \ = n[0];\nmaxI = 0;\nfor (i = 1; i <= 5; i++) {if (n[i] > maximum) {\n    maximum\
  \ = n[i];\n    maxI = i;\n}}\n// 显示哪个数字在数组中出现频率最高\nConsole.WriteLine(\"Value \"\
  \ + (maxI + 1) + \" appears in the array \" + maximum + \" times.\");\n```\n\n###\
