  \ C# 程序来显示以下三角形。\n\n*\n* *\n* * *\n* * * *\n\n## 第 28 章\n\n## 循环结构的流程图\n\n### 28.1\
  \ 引言\n\n通过前面的章节，你已经熟悉了所有的循环结构。由于流程图是学习“算法思维”的理想方式并能帮你更好地理解控制结构，本章将教你如何将 C# 程序转换为流程图，以及如何将流程图转换为\
  \ C# 程序。\n\n### 28.2 将 C# 程序转换为流程图\n\n将 C# 程序转换为流程图，你需要记住所有的循环结构及其对应的流程图。接下来将进行总结。\n\
  \n**前测试循环（Pre-Test Loop）**\n```csharp\nwhile (Boolean_Expression) {\n    // 语句块\n\
  }\n```\n![Image](img/chapter25-01.png)\n\n**后测试循环（Post-Test Loop）**\n```csharp\n\
  do {\n    // 语句块\n} while (Boolean_Expression);\n```\n![Image](img/chapter25-04.png)\n\
  \n**中测试循环（Mid-Test Loop）**\n```csharp\nwhile (true) {\n    // 语句块\n    if (Boolean_Expression)\n\
  \        break; // 语句块\n}\n```\n![Image](img/chapter25-07.png)\n\n**For 循环（For-Loop）**\n\
  ```csharp\nfor (counter = initial_value; counter <= final_value; counter = offset)\
  \ {\n    // 语句块\n}\n```\n![Image](img/chapter26-01.png)\n\n接下来，你会发现许多可能需要帮助的练习。\n\
  \n#### 28.2-1 设计流程图\n\n设计与以下代码片段对应的流程图：\n```csharp\nint i = 50;\nwhile (i > 10)\
  \ {\n    if (i % 2 == 1) {\n        Console.WriteLine(i);\n    }\n    i -= 5;\n\
  }\n```\n答案：代码片段包含一个嵌套单分支结构的前测试循环。对应的流程图如下。\n![Image](img/chapter28-01.png)\n\n####\
  \ 28.2-2 设计流程图\n\n设计与以下代码片段对应的流程图：\n```csharp\nint i = 30;\ndo {\n    if (i % 8\
  \ == 0) {\n        Console.WriteLine(i + \" is a multiple of 8\");\n    }\n    if\
  \ (i % 4 == 0) {\n        Console.WriteLine(i + \" is a multiple of 4\");\n    }\n\
  \    if (i % 2 == 0) {\n        Console.WriteLine(i + \" is a multiple of 2\");\n\
  \    }\n    i -= 2;\n} while (i > 0);\n```\n答案：代码片段包含一个嵌套三个单分支结构的后测试循环。对应的流程图如下。\n\
  ![Image](img/chapter28-02.png)\n\n#### 28.2-3 设计流程图\n\n设计与以下 C# 程序对应的流程图：\n```csharp\n\
  int hour;\nfor (hour = 1; hour <= 24; hour++) {\n    Console.WriteLine(\"Hour is\
  \ \" + hour + \":00.\");\n    if (hour >= 4 && hour < 12) {\n        Console.WriteLine(\"\
  Good Morning\");\n    } else if (hour >= 12 && hour < 20) {\n        Console.WriteLine(\"\
  Good Afternoon\");\n    } else if (hour >= 20 && hour < 24) {\n        Console.WriteLine(\"\
  Good Evening\");\n    } else {\n        Console.WriteLine(\"Good Night\");\n   \
  \ }\n}\n```\n答案：该 C# 程序包含一个嵌套多分支结构的 for 循环。对应的流程图如下。\n![Image](img/chapter28-03.png)\n\
  \n#### 28.2-4 设计流程图片段\n\n设计与以下代码片段对应的流程图：\n```csharp\nint a, i;\na = Convert.ToInt32(Console.ReadLine());\n\
  switch (a) {\n    case 1:\n        for (i = 1; i <= 9; i += 2) {\n            Console.WriteLine(i);\n\
  \        }\n        break;\n    case 2:\n        for (i = 9; i >= 1; i -= 2) {\n\
  \            Console.WriteLine(i);\n        }\n        break;\n    default:\n  \
  \      Console.WriteLine(\"Nothing to do!\");\n        break;\n}\nConsole.WriteLine(\"\
  The End!\");\n```\n答案：代码片段包含一个嵌套了两个 for 循环的 switch 结构。对应的流程图片段如下。\n![Image](img/chapter28-04.png)\n\
  \n![](img/remember.jpg)多分支结构和 switch 可以共享同一个流程图。\n\n#### 28.2-5 设计流程图\n\n设计与以下 C#\
  \ 程序对应的流程图：\n```csharp\nint n, m, total, i, j;\nn = Convert.ToInt32(Console.ReadLine());\n\
  m = Convert.ToInt32(Console.ReadLine());\ntotal = 0;\nfor (i = 0; i <= n - 1; i++)\
  \ {\n    for (j = 0; j <= m - 1; j++) {\n        total += i * j + j;\n    }\n}\n\
  Console.WriteLine(total);\n```\n答案：该 C# 程序包含嵌套循环控制结构；一个 for 循环嵌套在另一个 for 循环之中。对应的流程图如下。\n\
  ![Image](img/chapter28-05.png)\n\n### 28.3 将流程图转换为 C# 程序\n\n\n\n\n这种转换并不总是容易的。某些情况下，流程图设计者没有遵循任何特定规则，因此在将流程图转换为\
  \ C# 程序之前可能需要对其进行修改。以下是此类情况的一个示例。\n\n![Image](img/chapter27-02.png)\n\n如你所见，此流程图片段包含的循环控制结构与你已经学习的任何结构都不匹配，例如前测试、后测试、中测试循环，甚至是\
  \ `for` 循环控制结构。因此，你只有一种选择，那就是通过添加额外的语句或删除现有语句来修改流程图，直到出现已知的循环控制结构为止。下面是一些练习题，在其中一些练习题中，初始流程图确实需要修改。\n\
  \n### 练习 28.3-1 编写 C# 程序\n\n编写与以下流程图片段对应的 C# 代码。\n\n![Image](img/chapter28-06.png)\n\
  \n### 答案\n\n这是一个简单的题。你必须克服的唯一障碍是真（true）和假（false）路径的位置不完全正确。你需要让真路径而不是假路径来执行迭代。如你所知，可以交换这两个路径，但你还需要对布尔表达式取反。因此，对应的代码片段变为：\n\
  \n```csharp\ni = 0;while (i <= 90) {Console.WriteLine(i);i = i + 2;}Console.WriteLine(\"\
  The End\");\n```\n\n使用 `for` 循环，该代码片段可以等价地写为：\n\n```csharp\nfor (i = 0; i <= 90;\
  \ i += 2) {Console.WriteLine(i);}Console.WriteLine(\"The End\");\n```\n\n### 练习\
  \ 28.3-2 编写 C# 程序\n\n编写与以下流程图对应的 C# 程序。\n\n![Image](img/chapter28-07.png)\n\n###\
  \ 答案\n\n此流程图包含一个嵌套了双分支决策结构的后测试循环结构。C# 程序如下：\n\n```csharp\nint i;i = 1;do {if (i\
  \ < 45) {\n    Console.WriteLine(i);\n}else {\n    Console.WriteLine(-i);\n}i++;}\
  \ while (i < 90);Console.WriteLine(\"The End\");\n```\n\n### 练习 28.3-3 编写 C# 程序\n\
  \n编写与以下流程图对应的 C# 程序。\n\n![Image](img/chapter28-08.png)\n\n### 答案\n\n哎呀！真是一团糟！这里有这么多菱形！不过要小心，因为并不是所有的它们都是决策控制结构。事实上，其中两个是循环控制结构，而只有一个代表决策控制结构！你能认出后者吗？\n\
  \n到目前为止，你应该对循环控制结构非常熟悉了。如你所知，在循环控制结构中，菱形的出口之一总有一个向上的方向。因此，从初始流程图中提取的如下所示的流程图片段，显然就是你正在寻找的决策控制结构。\n\
  \n![Image](img/chapter28-09.png)\n\n当然，它是一个双分支决策结构！\n\n现在，让我们识别其余结构。在双分支决策结构之前，有一个后测试循环结构。它的流程图片段如下。\n\
  \n![Image](img/chapter28-10.png)\n\n最后，之前提到的双分支决策结构和后测试循环结构嵌套在下一个流程图片段中，\n\n![Image](img/chapter28-11.png)\n\
  \n它恰好是一个前测试循环结构，可以使用 C# 中的 `while` 或 `for` 语句编写。对应的 C# 程序如下：\n\n```csharp\nint i;double\
  \ s, n;s = 0;for (i = 0; i <= 99; i++) {do {\n    n = Convert.ToDouble(Console.ReadLine());\n\
  } while (n < 0);if (n < 100)\n    s = s + Math.Pow(n, 2);\nelse\n    s = s + Math.Pow(n,\
  \ 3);\n}Console.WriteLine(s);\n```\n\n其实并没有那么难，对吧？\n\n### 练习 28.3-4 编写 C# 程序\n\n\
  编写与以下流程图对应的 C# 程序。\n\n![Image](img/chapter28-12.png)\n\n### 答案\n\n这是一个中测试循环结构。由于该结构没有直接对应的\
  \ C# 语句，你可以使用 `break` 语句——或者你甚至可以将流程图转换为更熟悉的形式，如接下来的两种方法所示\n\n#### 第一种方法——使用 `break`\
  \ 语句\n\n主要思想是创建一个无限循环 `while (true) { ... }`，当两个语句块之间的布尔表达式求为真时，从中 `break` 出来。根据这种方法，初始流程图可以用\
  \ C# 写如下所示。\n\n```csharp\nint i;double S, a;i = 1;S = 0;while (true) {\n    a =\
  \ Convert.ToDouble(Console.ReadLine());\n    i++;if (i >= 90) break;S = S + a *\
  \ i;\n}Console.WriteLine(S);\n```\n\n记住，尽管 `break` 语句很有用，它也可能导致你写出难以阅读和理解的代码，尤其是当你大量使用它时。所以，请节使用！\n\
  \n#### 第二种方法——转换流程图\n\n中测试循环结构及其使用前测试循环结构的等价形式如下。\n\n![Image](img/chapter28-13.png)\n\
  \n因此，初始流程图变为\n\n![Image](img/chapter28-14.png)\n\n现在，编写对应的 C# 程序很容易了。\n\n```csharp\n\
  int i;double S, a;i = 1;S = 0;a = Convert.ToDouble(Console.ReadLine());\ni++;while\
  \ (i < 90) {S = S + a * i;\ni++;}Console.WriteLine(S);\n```\n\n### 28.4 复习题\n\n\
