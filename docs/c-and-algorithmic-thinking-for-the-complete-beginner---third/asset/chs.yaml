  \n### 32.1 在 C# 中创建二维数组\n\n二维数组是一种可以存储按行和列组织的数据结构。它允许你高效地表示和操作表格数据。例如，一个可以存储三位学生四门课程成绩的数组如下。\n\
  \n![Image](img/chapter32-01.png)\n\n二维数组有行和列。在这个特定的示例中，数组 `grades` 有 3 行 4 列。\n\n\
  和一维数组一样，有许多方法可以创建并向二维数组添加元素（和值）。让我们尝试使用最常用的方法创建 `grades` 数组。\n\n### 第一种方法\n\n要创建数组并直接向其元素赋值，可以使用以下通用的\
  \ C# 语句：\n\n`type[,] array_name = {{value0-0, value0-1, value0-2, …, value0-M},{value1-0,\
  \ value1-1, value1-2, …, value1-M},{value2-0, value2-1, value2-2, …, value2-M},…{valueN-0,\
  \ valueN-1, valueN-2, …, valueN-M}};`\n\n其中：\n- `type` 可以是 `int`、`double`、`string`\
  \ 等。\n- `array_name` 是数组的名称。\n- `value0-0`, `value0-1`, `value0-2`, …, `valueN-M`\
  \ 是数组元素的值。\n\n对于这种方法，你可以使用以下语句创建 `grades` 数组：\n\n```csharp\nstring[,] grades = {{\"\
  B+\", \"A+\", \"A\", \"C-\"},{\"B\", \"A\", \"C\", \"A+\"},{\"B\", \"B\", \"B-\"\
  , \"B+\"}};\n```\n\n它也可以写成一行：\n\n```csharp\nstring[,] grades = {{\"B+\", \"A+\"\
  , \"A\", \"C-\"}, {\"B\", \"A\", \"C\", \"A+\"}, {\"B\", \"B\", \"B-\", \"B+\"}};\n\
  ```\n\n索引是自动设置的。第一个值 `B+` 被赋值给行索引 0 和列 0，第二个值 `A+` 赋值给行索引 0 和列 1，依此类推。\n\n### 第二种方法\n\
  \n你可以使用以下通用的语句在 C# 中创建一个带有空元素的二维数组：\n\n`type[,] array_name = new type[number_of_rows,\
  \ number_columns];`\n\n其中：\n- `type` 可以是 `int`、`double`、`string` 等。\n- `array_name`\
  \ 是数组的名称。\n- `number_of_rows` 和 `number_columns` 可以是任何正整数。\n\n然后你可以使用以下通用的语句为数组元素赋值：\n\
  \n`array_name[row_index, column_index] = value;`\n\n其中 `row_index` 和 `column_index`\
  \ 分别是元素的行索引和列位置。\n\n以下代码片段创建了一个具有 3 行 4 列共 12 个空元素的 `grades` 数组，然后给以下位置赋值：\n\n```csharp\n\
  string[,] grades = new string[3, 4];\ngrades[0, 0] = \"B+\";\ngrades[0, 1] = \"\
  A+\";\ngrades[0, 2] = \"A\";\ngrades[0, 3] = \"C-\";\ngrades[1, 0] = \"B\";\ngrades[1,\
  \ 1] = \"A\";\ngrades[1, 2] = \"C\";\ngrades[1, 3] = \"A+\";\ngrades[2, 0] = \"\
  B\";\ngrades[2, 1] = \"B\";\ngrades[2, 2] = \"B-\";\ngrades[2, 3] = \"B+\";\n```\n\
  \n### 32.2 如何从二维数组获取值\n\n二维数组由行和列组成。下面的示例显示了一个具有三行四列的二维数组。\n\n![Image](img/chapter32-03.png)\n\
  \n二维数组的每个元素可以使用一对索引来唯一标识：行索引和列索引。\n\n`array_name[row_index, column_index]`\n\n以下代码片段创建了具有三行四列的二维数组\
  \ `grades`，然后显示其部分元素：\n\n```csharp\nstring[,] grades = {{\"B+\", \"A+\", \"A\",\
  \ \"C-\"},{\"B\", \"A\", \"C\", \"D\"},{\"B\", \"B\", \"B-\", \"B+\"}};\nConsole.WriteLine(grades[1,\
  \ 2]); // 输出: C\nConsole.WriteLine(grades[2, 2]); // 输出: B-\nConsole.WriteLine(grades[0,\
  \ 0]); // 输出: B\n```\n\n#### 练习 32.2-1 创建轨迹表\n\n为以下代码片段创建轨迹表：\n\n```csharp\nint[,]\
  \ a = {{0, 0},{0, 0},{0, 0}};\na[1, 0] = 9;\na[0, 1] = 1;\na[0, 0] = a[0, 1] + 6;\n\
  x = 2;\na[x, 1] = a[0, 0] + 4;\na[x - 1, 1] = a[0, 1] * 3;\na[x, 0] = a[x - 1, 1]\
  \ - 3;\n```\n\n\n\n\n\n# 解决方案\n\n这段代码段使用 3 × 2 数组，即一个具有 3 行 2 列的数组。跟踪表如下。\n\n| 步骤\
  \ | 语句 | 注释 | x | a |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | `int[,] a = {\
  \ {0, 0}, {0, 0}, {0, 0} };` | 这创建了一个值为零的数组 `a`。 | ? | \\| 0 \\| 0 \\|<br>\\| 0\
  \ \\| 0 \\|<br>\\| 0 \\| 0 \\| |\n| 2 | `a[1, 0] = 9` | | ? | \\| 0 \\| 0 \\|<br>\\\
  | 9 \\| 0 \\|<br>\\| 0 \\| 0 \\| |\n| 3 | `a[0, 1] = 1` | | ? | \\| 0 \\| 1 \\|<br>\\\
  | 9 \\| 0 \\|<br>\\| 0 \\| 0 \\| |\n| 4 | `a[0, 0] = a[0, 1] + 6` | | ? | \\| 7\
  \ \\| 1 \\|<br>\\| 9 \\| 0 \\|<br>\\| 0 \\| 0 \\| |\n| 5 | `x = 2` | | 2 | \\| 7\
  \ \\| 1 \\|<br>\\| 9 \\| 0 \\|<br>\\| 0 \\| 0 \\| |\n| 6 | `a[x, 1] = a[0, 0] +\
  \ 4` | | 2 | \\| 7 \\| 1 \\|<br>\\| 9 \\| 0 \\|<br>\\| 0 \\| 11 \\| |\n| 7 | `a[x\
  \ - 1, 1] = a[0, 1] * 3` | | 2 | \\| 7 \\| 1 \\|<br>\\| 9 \\| 3 \\|<br>\\| 0 \\\
  | 11 \\| |\n| 8 | `a[x, 0] = a[x - 1, 1] - 3` | | 2 | \\| 7 \\| 1 \\|<br>\\| 9 \\\
  | 3 \\|<br>\\| 0 \\| 11 \\| |\n\n## 32.3 如何遍历二维数组\n\n由于二维数组由行和列组成，程序可以按行遍历，也可以按列遍历。\n\
  \n### 按行遍历\n\n按行遍历意味着首先处理第 0 行，然后处理第 1 行，紧接着是第 2 行，依此类推。接下来是一个 3 × 4 数组的示例。箭头显示了执行按行遍历时遵循的“路径”，换句话说，它们显示了处理元素的顺序。\n\
  \n![Image](img/chapter32-04.png)\n\n![](img/remember.jpg)一个 3 × 4 数组是一个具有 3 行 4\
  \ 列的二维数组。在 `Y × X` 表示法中，第一个数字（`Y`）始终代表总行数，第二个数字（`X`）始终代表总列数。\n\n按行遍历时，数组元素处理如下：\n\
  \n► 第 0 行的元素按以下顺序 `a[0, 0] → a[0, 1] → a[0, 2] → a[0, 3]` 处理\n► 第 1 行的元素按以下顺序 `a[1,\
  \ 0] → a[1, 1] → a[1, 2] → a[1, 3]` 处理\n► 第 2 行的元素按以下顺序 `a[2, 0] → a[2, 1] → a[2,\
  \ 2] → a[2, 3]` 处理\n\n使用 C# 语句，让我们尝试通过按行遍历处理 3 × 4 数组（3 行 × 4 列）的所有元素。\n\n```csharp\n\
  i = 0; // 变量 i 指向第 0 行。\nfor (j = 0; j <= 3; j++) { // 此循环结构处理第 0 行的所有元素\n    process\
  \ a[i, j];\n}\ni = 1; // 变量 i 指向第 1 行。\nfor (j = 0; j <= 3; j++) { // 此循环结构处理第 1\
  \ 行的所有元素\n    process a[i, j];\n}\ni = 2; // 变量 i 指向第 2 行。\nfor (j = 0; j <= 3;\
  \ j++) { // 此循环结构处理第 2 行的所有元素\n    process a[i, j];\n}\n```\n\n当然，使用嵌套循环结构也可以相同的结果：\n\
  \n```csharp\nfor (i = 0; i <= 2; i++) {\n    for (j = 0; j <= 3; j++) {\n      \
  \  process a[i, j];\n    }\n}\n```\n\n让我们来看一些示例。下面的代码段允许用户将 10 × 10 = 100 个值输入数组\
  \ `b`。\n\n```csharp\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n\
  \        b[i, j] = Console.ReadLine();\n    }\n}\n```\n\n下面的代码段将数组 `b` 中的所有值减 1。\n\
  \n```csharp\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n      \
  \  b[i, j]--; // 等于：b[i, j] = b[i, j] - 1\n    }\n}\n```\n\n下面的代码段显示数组 `b` 的所有元素。\n\
  \n```csharp\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n      \
  \  Console.Write(b[i, j] + \"\\t\");\n    }\n    Console.WriteLine();\n}\n```\n\n\
  ![](img/notice.jpg)`Console.WriteLine()` 语句用于在行之间“显示”换行。\n\n### 按列遍历\n\n按列遍历意味着首先处理第\
  \ 0 列，然后处理第 1 列，紧接着是第 2 列，依此类推。接下来是一个 3 × 4 数组的示例。箭头显示了处理元素的顺序。\n\n![Image](img/chapter32-05.png)\n\
  \n按列遍历时，数组元素处理如下：\n\n► 第 0 列的元素按以下顺序 `a[0, 0] → a[1, 0] → a[2, 0]` 处理\n► 第 1 列的元素按以下顺序\
  \ `a[0, 1] → a[1, 1] → a[2, 1]` 处理\n► 第 2 列的元素按以下顺序 `a[0, 2] → a[1, 2] → a[2, 2]`\
  \ 处理\n► 第 3 列的元素按以下顺序 `a[0, 3] → a[1, 3] → a[2, 3]` 处理\n\n使用 C# 语句，让我们尝试通过按列遍历处理\
  \ 3 × 4 数组（3 行 × 4 列）的所有元素。\n\n```csharp\nj = 0; // 变量 j 指向第 0 列。\nfor (i = 0; i\
  \ <= 2; i++) { // 此循环结构处理第 0 列的所有元素\n    process a[i, j];\n}\nj = 1; // 变量 j 指向第\
  \ 1 列。\nfor (i = 0; i <= 2; i++) { // 此循环结构处理第 1 列的所有元素\n    process a[i, j];\n\
  }\nj = 2; // 变量 j 指向第 2 列。\nfor (i = 0; i <= 2; i++) { // 此循环结构处理第 2 列的所有元素\n  \
  \  process a[i, j];\n}\nj = 3; // 变量 j 指向第 3 列。\nfor (i = 0; i <= 2; i++) { // 此循环结构处理第\
  \ 3 列的所有元素\n    process a[i, j];\n}\n```\n\n当然，可以使用所示的嵌套循环控制结构实现相同的结果。\n\n```csharp\n\
  for (j = 0; j <= 3; j++) {\n    for (i = 0; i <= 2; i++) {\n        process a[i,\
  \ j];\n    }\n}\n```\n\n如你所见，这段代码与按行遍历的代码仅有一点不同：两个 for 循环交换了位置。不过要小心。不要在语句 `process\
  \ a[i, j]` 中交换索引变量 `i` 和 `j` 的位置。取下面的代码段作为例如。它尝试按列遍历 3 × 4 数组（3 行 × 4 列），但并不符合确定性。你能发现为什么吗？\n\
  \n```csharp\nfor (j = 0; j <= 3; j++) {\n    for (i = 0; i <= 2; i++) {\n      \
  \  process a[i, j];\n    }\n}\n```\n\n问题发生在变量 `j` 等于 3 时。语句 `process a[j, i]` 尝试处理第\
  \ 3 行（这是第四行），而它并不存在！仍然困惑吗？不要困！3 × 4 数组中没有行索引 3。\n\n## 32.4 如何将用户输入的值添加到二维数组\n\n\
  与一维数组一样，与其从键盘读取值并赋值给变量，你可以直接将该值赋值特定的数组元素。下面的代码段创建了二维数组 `names`，提示用户输入六个值，并将这些值赋值给数组。\n\
  \n```csharp\nstring[,] names = new string[3, 2];\nConsole.Write(\"Name for row 0,\
  \ column 0: \");names[0, 0] = Console.ReadLine();\nConsole.Write(\"Name for row\
  \ 0, column 1: \");names[0, 1] = Console.ReadLine();\nConsole.Write(\"Name for row\
  \ 1, column 0: \");names[1, 0] = Console.ReadLine();\nConsole.Write(\"Name for row\
  \ 1, column 1: \");names[1, 1] = Console.ReadLine();\nConsole.Write(\"Name for row\
  \ 2, column 0: \");names[2, 0] = Console.ReadLine();\nConsole.Write(\"Name for row\
  \ 2, column 1: \");names[2, 1] = Console.ReadLine();\n```\n\n使用嵌套 for 循环，这段代码可以等效地写为：\n\
  \n```csharp\nconst int ROWS = 3;\nconst int COLUMNS = 2;\nint i, j;\nstring[,] names\
  \ = new string[ROWS, COLUMNS];\nfor (i = 0; i <= ROWS - 1; i++) {\n    for (j =\
  \ 0; j <= COLUMNS - 1; j++) {\n        Console.Write(\"Name for row \" + i + \"\
  , column \" + j + \": \");\n        names[i, j] = Console.ReadLine();\n    }\n}\n\
  ```\n\n#### 练习 32.4-1 仅显示浮点数\n\n编写一个 C# 程序，提示用户在 5 × 7 数组中输入数值，然后显示包含浮点数的元素的索引。\n\
  \n解决方案\n\n按行遍历是最流行的方法，所以让我们使用它吧。解决方案如下。\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ project_32.4-1\n\n```csharp\nconst int ROWS = 5;\nconst int COLUMNS = 7;\nint\
  \ i, j;\ndouble[,] a = new double[ROWS, COLUMNS];\nfor (i = 0; i <= ROWS - 1; i++)\
  \ {\n    for (j = 0; j <= COLUMNS - 1; j++) {\n        Console.Write(\"Enter a value\
  \ for element \" + i + \", \" + j + \": \");\n        a[i, j] = Convert.ToDouble(Console.ReadLine());\n\
  \    }\n}\nfor (i = 0; i <= ROWS - 1; i++) {\n    for (j = 0; j <= COLUMNS - 1;\
  \ j++) {\n        if (a[i, j] != (int)(a[i, j])) { // Check if it is real (float)\n\
  \            Console.WriteLine(\"A real found at position: \" + i + \", \" + j);\n\
  \        }\n    }\n}\n```\n\n## 练习 32.4-2 仅显示奇列\n\n编写一个 C# 程序，提示用户在 5 × 7 数组中输入数值，然后显示索引为奇数的列的元素（即索引为\
  \ 1、3 和 5 的列）。\n\n### 解决方案\n\n接下来是该 C# 程序。\n\n![](img/my_exercise_header.png) project_32.4-2\n\
  \n```csharp\nconst int ROWS = 5;\nconst int COLUMNS = 7;\nint i, j;\ndouble[,] a\
  \ = new double[ROWS, COLUMNS];\nfor (i = 0; i <= ROWS - 1; i++) {\n    for (j =\
  \ 0; j <= COLUMNS - 1; j++) {\n        Console.Write(\"Enter a value for element\
  \ \" + i + \", \" + j + \": \");\n        a[i, j] = Convert.ToDouble(Console.ReadLine());\n\
  \    }\n}\n// 遍历列\nfor (j = 1; j <= COLUMNS - 1; j += 2) { // 从 1 开始，每次递 2\n   \
  \ for (i = 0; i <= ROWS - 1; i++) {\n        Console.Write(a[i, j] + \"  \");\n\
  \    }\n}\n```\n\n![](img/notice.jpg) 本书尽可能地使用变量 `i` 作为行索引，变量 `j` 作为列索引。当然，你也可以使用其他变量名，例如用于行索引的\
  \ `row`、`r`，或者用于列索引的 `column`、`c`，但变量 `i` 和 `j` 被程序员广泛使用。在使用一段时间后，你的大脑会将 `i` 与行、将\
  \ `j` 与列联系起来。因此，每个在二维数组中使用这些变量名作为索引的算法或程序将更容易被理解。\n\n## 32.5 变量 i 和 j 有什么故事？\n\n\
  许多程序员认为名字 `i` 代表“index”（索引），而使用 `j` 仅仅是因为它跟在 `i` 后面。还有人认为名字 `i` 代表“integer”（整数）。事实可能处于两者之间的某一点。\n\
  \n在计算机出现很久以前，数学家就已经使用 `i`、`j` 和 `k` 来表示数学中的整数。后来，在第一种高级计算机语言之一 `FORTRAN` 中，变量 `i`、`j`、`k`、`l`、`m`\
  \ 和 `n` 默认都是整数。因此，第一批程序员养成了在程序中使用变量 `i` 和 `j` 的习惯，这成为了大多数计算机语言的惯例。\n\n## 32.6 方矩阵\n\
  \n在数学中，行数和列数相同的矩阵称为方矩阵。以下是方矩阵的一些示例。\n\n.![Image](img/chapter32-06.png)\n\n.![Image](img/chapter32-07.png)\n\
  \n## 练习 32.6-1 寻找主对角线元素的和\n\n编写一个 C# 程序，让用户在 10 × 10 数组中输入数值，然后计算其主对角线元素的和。\n\n\
  ### 解决方案\n\n在数学中，方矩阵的主对角线是从左上角到右角的元素的集合。以下是方矩阵的示例，其主对角线用深色背景突出。\n\n.![Image](img/chapter32-08.png)\n\
  \n.![Image](img/chapter32-09.png)\n\n![](img/notice.jpg) 注意，主对角线上的元素行索引等于它们的列索引。\n\
  \n你可以使用两种不同的方法计算主对角线元素的和。让我们学习这两种方法。\n\n### 第一种方法 – 遍历所有元素\n\n在这种方法中，程序遍历行并检查行索引是否等于列索引。对于表示为\
  \ N × N 的方矩阵（在此情况下为数组），行数和列数相等的，因此你只需要定义一个常量 `N`。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_32.6-1a\n\n```csharp\nconst int N = 10;\nint i, j;\ndouble total;\ndouble[,]\
  \ a = new double[N, N];\nfor (i = 0; i <= N - 1; i++) {\n    for (j = 0; j <= N\
  \ - 1; j++) {\n        a[i, j] = Convert.ToDouble(Console.ReadLine());\n    }\n\
  }\n// 计算和\ntotal = 0;\nfor (i = 0; i <= N - 1; i++) {\n    for (j = 0; j <= N -\
  \ 1; j++) {\n        if (i == j) {\n            total += a[i, j]; // 这等于：total =\
  \ total + a[i, j]\n        }\n    }\n}\nConsole.WriteLine(\"Sum = \" + total);\n\
  ```\n\n![](img/notice.jpg) 注意，程序遍历行并检查行索引是否等于列索引。或者，通过遍历列也可以相同的结果。\n\n![](img/notice.jpg)\
  \ 在这种方法中，负责计算和的嵌套循环控制结构执行了 10 × 10 = 100 次迭代。\n\n### 第二种方法 – 直接遍历主对角线\n\n在这种方法中，单一循环控制结构直接遍历主对角线。解决方案如下。\n\
  \n![](img/my_exercise_header.png) project_32.6-1b\n\n```csharp\nconst int N = 10;\n\
  int i, j, k;\ndouble total;\ndouble[,] a = new double[N, N];\nfor (i = 0; i <= N\
  \ - 1; i++) {\n    for (j = 0; j <= N - 1; j++) {\n        a[i, j] = Convert.ToDouble(Console.ReadLine());\n\
  \    }\n}\n// 计算和\ntotal = 0;\nfor (k = 0; k <= N - 1; k++) {\n    total += a[k,\
  \ k];\n}\nConsole.WriteLine(\"Sum = \" + total);\n```\n\n![](img/notice.jpg) 这种方法比第一种高效得多，因为负责计算和的\
  \ for 循环执行的迭代次数仅为 10 次。\n\n## 练习 32.6-2 寻找反对对角线元素的和\n\n编写一个 C# 程序，让用户在 5 × 5 数组中输入数值，然后计算其反对对角线元素的和。\n\
  \n### 解决方案\n\n在数学中，方矩阵的反对对角线是从右上角到左下角的元素的集合。接下来，你可以看到一个用深色背景突出反对对角线的 5 × 5 矩阵示例。\n\
  \nchapter32-10.\n\nN × N 数组的反对对角线元素满足以下方程：\n\n`i + j = N - 1`\n\n其中 `i` 和 `j` 分别对应行和列。如果你解出\
  \ `j`，方程变为：\n\n`j = N - i - 1`\n\n使用这个公式，对于之前的 5 × 5 数组，当 `i` 等于 3 时，`j` 的值为：\n\n\
  `j = 5 - 3 - 1 = 1`\n\n利用所有这些知识，我们现在编写对应的 C# 程序。\n\n![](img/my_exercise_header.png)\
  \ project_32.6-2\n\n```csharp\nconst int N = 5;\nint i, j;\ndouble total;\ndouble[,]\
  \ a = new double[N, N];\nfor (i = 0; i <= N - 1; i++) {\n    for (j = 0; j <= N\
  \ - 1; j++) {\n        a[i, j] = Convert.ToDouble(Console.ReadLine());\n    }\n\
  }\n// 计算和\ntotal = 0;\nfor (i = 0; i <= N - 1; i++) {\n    j = N - i - 1; // 等于：\n\
  \    total += a[i, j]; // total += a[i, N - i - 1];\n}\nConsole.WriteLine(\"Sum\
  \ = \" + total);\n```\n\n![](img/notice.jpg) 注意，负责寻找反对对角线元素和的 for 循环直接遍历反对对角线。\n\
  \n## 练习 32.6-3 填充数组\n\n编写一个 C# 程序创建并显示以下数组。\n\n![Image](img/chapter32-11.png)\n\n\
  ### 解决方案\n\n如所示，主对角线上有一个 −1。你已经知道方矩阵主对角线元素的共同特征是它们的行索引等于它们的列索引。现在，你还需要找到包含值 10 的元素的共同特征，以及另一个包含值\
  \ 20 的元素的共同特征。实际上确实有！任何包含值 10 的元素的行索引都大于对应的列索引，同样，任何包含值 20 的元素的行索引都小于对应的列索引。\n\n\
  因此，相应的 C# 程序如下。\n\n\n\n\n\n![](img/my_exercise_header.png)\n\n# 项目 32.6\n\n```csharp\n\
  const int N = 5;\nint i, j;\nint[,] a = new int[N, N];\nfor (i = 0; i <= N - 1;\
  \ i++) {\n    for (j = 0; j <= N - 1; j++) {\n        if (i == j) {\n          \
  \  a[i, j] = -1;\n        }\n        else if (i > j) {\n            a[i, j] = 10;\n\
  \        }\n        else {\n            a[i, j] = 20;\n        }\n    }\n}\nfor\
  \ (i = 0; i <= N - 1; i++) {\n    for (j = 0; j <= N - 1; j++) {\n        Console.Write(a[i,\
  \ j] + \"\\t\");\n    }\n    Console.WriteLine();\n}\n```\n\n### 32.7 复习题：判断对错\n\
  \n判断下列每个陈述的对或错。\n\n1) 二维数组中的所有元素必须包含不同的值。\n2) 为了引用二维数组中的一个元素，你需要两个索引。\n3) 二维数组的两个索引必须全为变量，或者全为常量值。\n\
  4) 一个 5 × 6 的数组是一个具有五列六行的二维数组。\n5) 若要引用数组 `b` 中存在于第二行第三列的元素，你应该写成 `b[2, 3]`。\n6)\
  \ 遍历行意味着首先处理二维数组的第一行，接着处理第二行，依此类推。\n7) 你不能使用 `i` 和 `j` 以外的任何变量来遍历二维数组。\n8) 下列的 C#\
  \ 语句创建了一个二维数组。`int[,] names = new int[3, 7];`\n9) 下列的代码片段创建了一个包含四个元素的二维数组，并为它们分配了值。\n\
  ```csharp\nstring[,] names = new string[2, 2];\nnames[0, 0] = \"John\";\nnames[0,\
