  \ 29.3 节中讨论的“终极”规则是关重要的。根据该规则，预测试循环结构的通用形式如下：\n\n```\n初始化 total\nwhile (total <=\
  \ 1000) {\n    一条语句或一组语句\n    更新/修改 total\n}\n```\n\n由于循环的布尔表达式 `决`于变量 `total`，因此该变量必须在循环开始之前初始化，并在循环内部进行更新（修改）。更具体地说，更新/修改变量\
  \ `total` 的语句必须是循环的最后一条语句。随后，C# 程序变为：\n\n![](img/my_exercise_header.png) project_30.1-3\n\
