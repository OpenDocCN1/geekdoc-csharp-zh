  \ 程序。\n\n![Image](img/chapter21-24.png)\n\n## 第 22 章\n\n决策控制结构的技巧与窍\n\n### 22.1\
  \ 引言\n\n本章专门教授你一些可以帮助你编写“更好”代码的实用技巧和窍。当你设计自己的算法或自己的 C# 程序时，应该始终记住这些技巧。\n\n这些技巧和技巧可以帮助你提高代码的可读性，并帮助代码更短甚至运行更快。当然，没有单一完美的方法论，因为在某些情况下使用特定的技巧会有帮助，但在另一些情况下，同一个技巧可能会产生完全相反的结果。大多数情况下，代码优化取决于编程经验。\n\
  \n\n\n\n![](img/remember.jpg)较小的算法并不总是解决给定问题的最佳方案。为了解决特定问题，你可能会写一个非常短的算法，但遗憾的是它会消耗大量的\
  \ CPU 时间。另一方面，你也可以用另一种算法解决同一个问题，尽管它看起来更长，但计算结果要快得多。\n\n## 22.2 选择决策控制结构\n\n下面的图可以帮助你根据检查的变量数量，判断哪种决策控制结构是给定问题的更好选择。\n\
  \n![Image](img/chapter22-01.png)\n\n![](img/notice.jpg)此图推荐的是最佳选项，而不是唯一选项。例如，当一个变量的情况超过两种时，使用嵌套的决策控制结构并不是错的。不过，建议的多多分支决策结构和建议的分支决策结构更加方便。\n\
  \n## 22.3 简化决策控制结构\n\n仔细观察以下通用形式给出的流程图片段。\n\n![Image](img/chapter22-02.png)\n\n\
  如你所见，在双分支决策结构的两条路径开头都存在两个相同的语句或语句块，末尾也有另外两个相同的语句或语句块。这意味着，无论 `Boolean_Expression`\
  \ 的结果如何，这些语句都会执行。因此，你可以简单地将它们移动到外部，并分别放在双分支决策结构的正之前和之后，如等效结构所示。\n\n![Image](img/chapter22-03.png)\n\
  \n![](img/notice.jpg)该提示适用于任何决策控制结构，只要所有路径中都存在相同的语句或语句块即可。\n\n![](img/notice.jpg)某些情况下无法应用此提示。例如，如果一个语句（或语句块）影响了该结构的布尔表达式，你就不能将其移动到决策控制结构正之前。\n\
  \n你仍然感到困惑吗？接下来你将看到一些可以帮助你更好理解练习。\n\n### 练习 22.3-1 “收缩”算法\n\n使用更少的语句重新设计以下流程图。\n\n\
  ![Image](img/chapter22-04.png)\n\n### 答案\n\n如你所见，语句 `y ← a * 2` 存在于双分支决策结构的两条路径中。这意味着，无论布尔表达式的结果如何，该语句都会执行。因此，你可以简单地将该语句移动到外部，并放在双分支决策结构的正之前，如下。\n\
  \n![Image](img/chapter22-05.png)\n\n### 练习 22.3-2 “收缩” C# 程序\n\n使用更少的语句重写以下 C# 程序。\n\
  \n```csharp\nint a, y;a = Convert.ToInt32(Console.ReadLine());if (a > 0) {y = a\
  \ * 4;Console.WriteLine(y);}else {y = a * 3;Console.WriteLine(y);}\n```\n\n### 答案\n\
  \n如你所见，语句 `Console.WriteLine(y)` 存在于双分支决策结构的两条路径中。这意味着，无论布尔表达式的结果如何，该语句都会执行。因此，你可以简单地将该语句移动到外部，并放在双分支决策结构的正之后，如下。\n\
  \n```csharp\nint a, y;a = Convert.ToInt32(Console.ReadLine());if (a > 0) {y = a\
  \ * 4;}else {y = a * 3;}Console.WriteLine(y);\n```\n\n### 练习 22.3-3 “收缩”算法\n\n使用更少的语句重新设计以下流程图，然后编写对应的\
  \ C# 程序。\n\n![Image](img/chapter22-06.png)\n\n### 答案\n\n如果你尝试将 `Write y` 语句移到多分支决策结构之外，后续生成的流程图绝对与初始流程图不等效。\n\
  \n![Image](img/chapter22-07.png)\n\n这是因为右侧的最后一条路径，在初始流程图中，它并不包含 `Write y` 语句。\n\n\
  检查两个流程图，看它们是否产生相同的结果。例如，假设用户输入了一个错误的数字。在两个流程图中，执行流都会走向 `Write \"Wrong Number\"`\
  \ 语句。之后，初始流程图不再执行其他语句，而第二个流程图会额外执行一个 `Write y` 语句。\n\n![](img/remember.jpg)如果一个语句或语句块在所有路径中都不存在，你就不能将其移动到决策控制结构之外。\n\
  \n你现在可能想知道是否有其他方法可以将 `Write y` 语句移到多分支决策结构之外。答案是“肯定的”，但你需要稍微重新安排流程图。你需要完全移除右侧的最后一条路径，并在开头使用全新的决策控制结构来检查用户提供的数字是否错误。一种可能的解决方案所示所示。\n\
  \n![Image](img/chapter22-08.png)\n\n对应的 C# 程序为：\n\n```csharp\ndouble a, y;a = Convert.ToDouble(Console.ReadLine());if\
  \ (a >= 30) {Console.WriteLine(\"Wrong Number\");}else {if (a < 10) { y = a * 2;\
  \ }else if (a < 20) { y = a / 2; }else { y = a + 2; }Console.WriteLine(y);}\n```\n\
  \n## 22.4 逻辑运算符 – 使用，还是不使用：这是一个值得考虑的问题！\n\n在某些情况下，可以使用逻辑运算符代替嵌套的决策控制结构，这可以提高可读性。看看以下通用形式给出的流程图片段。\n\
  \n![Image](img/chapter22-09.png)\n\n如你所见，只有当两个布尔表达式都为真时，才会执行语句或块 1。在所有其他情况下都会执行语句或块\
  \ 2。因此，可以重新设计这个流程图。\n\n![Image](img/chapter22-10.png)\n\n现在让我们看看另一个流程图。\n\n![Image](img/chapter22-11.png)\n\
  \n在这个流程图中，当 `Boolean_Expression_1` 为真或 `Boolean_Expression_2` 为真时，都会执行语句或块 2。因此，你可以如下使用\
  \ OR 运算符重新设计此流程图。\n\n![Image](img/chapter22-12.png)\n\n![](img/notice.jpg)显然，这些方法也可以适用于嵌套决策控制结构。\n\
  \n### 练习 22.4-1 重写代码\n\n使用逻辑运算符重写以下 C# 程序。\n\n```csharp\nstring today, name;today\
  \ = Console.ReadLine();name = Console.ReadLine();if (today == \"February 16\") {if\
  \ (name == \"Lukia\") { Console.WriteLine(\"Happy Birthday!!!\"); }else { Console.WriteLine(\"\
  No match!\");}}else{Console.WriteLine(\"No match!\");}\n```\n\n### 答案\n\n`Console.WriteLine(\"\
  Happy Birthday!!!\")` 只有在两个布尔表达式都为真时才执行。`Console.WriteLine(\"No match!\")` 在所有其他情况下执行。因此，你可以使用\
  \ `&&` 运算符重写该 C# 程序。\n\n```csharp\nstring today, name;today = Console.ReadLine();name\
  \ = Console.ReadLine();if (today == \"February 16\" && name == \"Lukia\") {Console.WriteLine(\"\
  Happy Birthday!!!\");}else {Console.WriteLine(\"No match!\");}\n```\n\n### 练习 22.4-2\
  \ 重写代码\n\n使用逻辑运算符重写以下 C# 程序。\n\n```csharp\nint a, b, y;a = Convert.ToInt32(Console.ReadLine());b\
  \ = Convert.ToInt32(Console.ReadLine());y = 0;if (a > 10) {y++;}else if (b > 20)\
  \ {y++;}else {y--;}Console.WriteLine(y);\n```\n\n### 答案\n\n当变量 `a` 大于 10 或变量 `b`\
  \ 大于 20 时，会执行 `y++` 语句。因此，你可以使用 `||` 运算符重写该 C# 程序。\n\n```csharp\nint a, b, y;a =\
  \ Convert.ToInt32(Console.ReadLine());b = Convert.ToInt32(Console.ReadLine());y\
  \ = 0;if (a > 10 || b > 20) {y++;}else {y--;}Console.WriteLine(y);\n```\n\n## 22.5\
  \ 合并两个或多个单分支决策结构\n\n有时，你可能会设计一个包含连续的两个或多个单分支决策结构的算法，每个结构都评估相同的布尔表达式。示例所示。\n\n![Image](img/chapter22-13.png)\n\
  \n\n\n\n当出现这种情况时，你只需要将所有的单路分支决策结构合并为一个，如下所示。\n\n![Image](img/chapter22-14.png)\n\
  \n![](img/remember.jpg)单路分支决策结构需要是相互相邻的。如果它们之间存在任何语句，你就无法将它们合并，除非你能够将该语句移动到代码中的其他地方。\n\
  \n### 练习 22.5-1 合并决策控制结构\n\n在下述 C# 程序中，合并单路分支决策结构。\n\n```csharp\nint a;a = Convert.ToInt32(Console.ReadLine());if\
  \ (a > 0) {Console.WriteLine(\"Hello\");}if (a > 0) {Console.WriteLine(\"Hermes\"\
  );}\n```\n\n### 答案\n\n第一个和第二个决策控制结构评估的是完全相同的布尔表达式，因此它们可以简单地合并为一个。\n\n该 C# 程序变为：\n\
  \n```csharp\nint a;a = Convert.ToInt32(Console.ReadLine());if (a > 0) {Console.WriteLine(\"\
  Hello\");Console.WriteLine(\"Hermes\");}\n```\n\n### 练习 22.5-2 合并决策控制结构\n\n在下述 C#\
  \ 程序中，尽可能合并所有的单路分支决策结构。\n\n```csharp\nint a, y, b;a = Convert.ToInt32(Console.ReadLine());y\
  \ = 0;if (a > 0) {y += a + 1;}b = Convert.ToInt32(Console.ReadLine());if (!(a <=\
  \ 0)) {Console.WriteLine(\"Hello Hera\");}a++;if (a > 0) {Console.WriteLine(\"Hallo\
  \ Welt\");}Console.WriteLine(y);\n```\n\n### 答案\n\n仔细检查后可以明显看出第一个和第二个决策控制结构评估的是完全相同的布尔表达式。具体来说，否定\
  \ `a > 0` 得到 `a <= 0`，而对 `a <= 0` 再次取反（这次使用非 (`!`) 运算符）则得到 `!(a <= 0)`。因此，`a > 0`\
  \ 实际上等同于 `!(a <= 0)`。\n\n![](img/remember.jpg)两次否定即为肯定。\n\n然而，在第一个和第二个决策控制结构之间存在语句\
  \ `b = Convert.ToInt32(Console.ReadLine())`，这阻止了将它们合并为一个。幸运的是，这条语句可以移动到程序的开头，因为它并不会影响执行流的其他部分。\n\
  \n另一方面，在第二个和第三个决策控制结构之间存在语句 `a++`，这也阻止了你的合并；不幸的是，这条语句无法移动到其他地方，因为它确实影响了执行流的其他部分（第二个和第三个决策控制结构依赖于此语句）。因此，第三个决策控制结构无法与前两个合并！\n\
  \n最终的 C# 程序看起来如下。\n\n```csharp\nint a, b, y;a = Convert.ToInt32(Console.ReadLine());b\
  \ = Convert.ToInt32(Console.ReadLine());y = 0;if (a > 0) {y += a + 1;Console.WriteLine(\"\
  Hello Hera\");}a++;if (a > 0) {Console.WriteLine(\"Hallo Welt\");}Console.WriteLine(y);\n\
  ```\n\n### 22.6 用双路分支决策结构替换两个单路分支决策结构\n\n看下一个示例。\n\n```csharp\nif (x > 40 {//Do\
  \ something}if (x <= 40) {//Do something else}\n```\n\n第一个决策控制结构评估变量 `x` 以测试它是否大于\
  \ 40，紧接着，第二个决策控制结构再次评估该变量，以测试它是否小于或等于 40！\n\n这是初学者程序员犯的一个非常常见的“错误”。他们使用了两个单路分支决策结构，尽管一个双路分支决策结构就能完成相同的工作。\n\
  \n上一个示例可以使用仅用一个双路分支决策结构进行重写，如下：\n\n```csharp\nif (x > 40 {//Do something}else {//Do\
  \ something else}\n```\n\n尽管这两个示例都是完全正确且运行良好的，但第二种方案更好。CPU 只需要评估一个布尔表达式，这将导致更快的执行速度。\n\
  \n![](img/notice.jpg)两个单路分支决策结构必须是相互相邻的。如果它们之间存在任何语句，你就无法“合并”它们（即用双路分支决策结构替换它们），除非你能够将该语句移动到代码中的其他地方。\n\
  \n### 练习 22.6-1 “合并”决策控制结构\n\n在下述代码片段中，尽可能“合并”所有的单路分支决策结构。\n\n```csharp\nint a,\
  \ y, b;a = Convert.ToInt32(Console.ReadLine());y = 0;if (a > 0) {y += a;}b = Convert.ToInt32(Console.ReadLine());if\
  \ (!(a > 0)) {Console.WriteLine(\"Hello Zeus\");}if (y > 0) {Console.WriteLine(y\
  \ + 5);}y += a;if (y <= 0) {Console.WriteLine(y + 12);}\n```\n\n### 答案\n\n第一个决策控制结构评估变量\
  \ `a` 以测试它是否大于零，紧随其，第二个决策控制结构再次评估变量 `a` 以测试它是否不大于零。尽管在它们之间存在语句 `b = Convert.ToInt32(Console.ReadLine())`，但这条语句可以移动到其他地方，因为它并不影响执行流的其他部分。因此，第一个和第二个决策控制结构可以合并！\n\
  \n另一方面，在第三和第四个决策控制结构之间存在语句 `y += a`，这阻止了你的合并。这条语句无法移动到任何地方，因为它确实影响了执行流的其他部分（第三和第四个决策控制结构依赖于此语句）。因此，第三和第四个决策控制结构无法合并！\n\
  \n最终的代码片段变为：\n\n```csharp\nint a, y, b;a = Convert.ToInt32(Console.ReadLine());b\
  \ = Convert.ToInt32(Console.ReadLine());y = 0;if (a > 0) {y += a;}else {Console.WriteLine(\"\
  Hello Zeus\");}if (y > 0) {Console.WriteLine(y + 5);}y += a;if (y <= 0) {Console.WriteLine(y\
  \ + 12);}\n```\n\n### 22.7 将可能为真的布尔表达式放在前面\n\n多分支和分支结构在决定执行哪个语句或块之前都需要检查多个布尔表达式。在下面的决策控制结构中：\n\
  \n```csharp\nif (Boolean_Expression_1) {A statement or block of statements 1}else\
  \ if (Boolean_Expression_2) {A statement or block of statements 2}else if (Boolean_Expression_3)\
  \ {A statement or block of statements 3}\n```\n\n程序首先测试 `Boolean_Expression_1` 是否为真。如果不是，测试\
  \ `Boolean_Expression_2` 是否为真，如果不是，再测试 `Boolean_Expression_3`。然而，如果 `Boolean_Expression_1`\
  \ 在大多数情况下为假，而 `Boolean_Expression_3` 在大多数情况下为真呢？这意味着在测试通常为真的 `Boolean_Expression_3`\
  \ 之前，浪费时间测试通常为假的 `Boolean_Expression_1`。\n\n为了让你的程序更高效，你可以将可能为真的布尔表达式放在开头，将可能为假的布尔表达式放在结尾，如下：\n\
  \n```csharp\nif (Boolean_Expression_3) {A statement or block of statements 3}else\
  \ if (Boolean_Expression_2) {A statement or block of statements 2}else if (Boolean_Expression_1)\
  \ {A statement or block of statements 1}\n```\n\n虽然这种改变看起来可能并不重要，但你节省的每一点时间积累起来都能让你的程序运行更快、更高效。\n\
  \n### 练习 22.7-1 重新排列布尔表达式\n\n根据研究，美国人喜欢的宠物是狗，猫位第二，豚鼠之后，鸟最后。在下的代码片段中，重新排列布尔表达式以使程序在大多数情况下运行更快、更高效。\n\
  \n```csharp\nstring kind;Console.Write(\"What is your favorite pet? \");kind = Console.ReadLine();switch\
  \ (kind) {case \"Parrots\":\n\n> Console.WriteLine(\"It screeches!\");\n\n> break;\n\
  \ncase \"Guinea pig\":\n\n> Console.WriteLine(\"It squeaks\");\n\n> break;\n\ncase\
  \ \"Dog\":\n\n> Console.WriteLine(\"It barks\");\n\n> break;\n\ncase \"Cat\":\n\n\
  > Console.WriteLine(\"It meows\");\n\n> break;\n\n}\n```\n\n### 答案\n\n\n\n\n对于这项研究，你可以重新排列代码片段，使其在大多数情况下运行得快一点。\n\
  \n```csharp\nstring kind;Console.Write(\"What is your favorite pet? \");kind = Console.ReadLine();switch\
  \ (kind) {\n    case \"Dog\":\n        Console.WriteLine(\"It barks\");\n      \
  \  break;\n    case \"Cat\":\n        Console.WriteLine(\"It meows\");\n       \
  \ break;\n    case \"Guinea pig\":\n        Console.WriteLine(\"It squeaks\");\n\
  \        break;\n    case \"Parrots\":\n        Console.WriteLine(\"It screeches!\"\
  );\n        break;\n}\n```\n\n---\n\n### 22.8 为什么代码缩进如此重要？\n\n在你阅读这本书的过程中，你可能会疑惑为什么在\
  \ C# 语句前面会出现空格字符，以及为什么这些语句不像下面的示例写在段落的最左边缘。\n\n```csharp\nint x, y;Console.Write(\"\
  Enter a number: \");x = Convert.ToInt32(Console.ReadLine());Console.Write(\"Enter\
  \ a second number: \");y = Convert.ToInt32(Console.ReadLine());if (x > 5) {Console.WriteLine(\"\
  Variable x is greater than 5\");}else {x = x + y;Console.WriteLine(\"Hello Zeus!\"\
  );if (x == 3) {Console.WriteLine(\"Variable x contains a value of 3\");}else {x\
  \ = x - y;Console.WriteLine(\"Hello Olympians!\");if (x + y == 24) {Console.WriteLine(\"\
  The sum of x + y is equal to 24\");}else {Console.WriteLine(\"Nothing of the above\"\
  );}}}\n```\n\n答案显而易见！没有缩进的代码难以阅读和理解。任何阅读这种编写代码的人都会对 `if` – `else` 的配对感到困惑（即某个 `else`\
  \ 属于哪个 `if`）。此外，如果一个长 C# 程序是这样写的，几乎无法找到（例如）一个被遗忘的右括号 `}` 的位置。\n\n代码缩进可以定义为一种组织源代码的方式。缩进使用空格或制表符对代码进行格式化，以提高可读性。良好的缩进代码非常有帮助，即使需要花费额外的精力，因为从长远来看，当你重新查看代码时，它可以节省你大量时间。遗憾的是，它有时会被忽视，而会在以后引起麻烦。遵循特定的编程风格有助于你避免语法和逻辑错误。它还能帮助程序员更容易学习和理解他人编写的代码。\n\
  \n代码缩进类似于作者在视觉上安排书籍文本的方式。他们不是写一长串句子，而是将文本分成章节和段落。这种动作没有改变文本的含义，但让它更易读。\n\n所有出现在大括号\
  \ `{ }` 内部的语句都应该缩进。例如，通过缩进双选决策结构内部的语句，你可以在视觉上将它们隔离开。因此，任何人都可以一眼看出当布尔表达式求值为真时执行哪些语句，当布尔表达式求值为假时执行哪些语句。\n\
  \n只有人类难以阅读和理解没有缩进的程序。计算机可以执行任何带有或不带缩进的 C# 代码，只要不包含语法错误。\n\n---\n\n### 22.9 复习题：判断对错\n\
  \n对以下每个陈述判断对错。\n\n1) 较小的算法总是解决给定问题的最佳解决方案。\n2) 只要语句在决策结构的两个路径开头都存在，你就可以将其移动到双选决策结构之外并紧接其前面。\n\
  3) 你总是可以使用逻辑运算符代替嵌套的决策控制结构来增加可读性。\n4) 只有当两个单选决策结构连续出现且它们评估的是等价的布尔表达式时，才能它们合并为一个单选决策结构。\n\
  5) 从双选决策结构转换为两个单选决策结构总是可能的。\n6) 只有当两个单选决策结构连续出现且它们仅评估相同的布尔表达式时，才能被替换为一个双选决策结构。\n\
  7) 包含决策控制结构且编写时没有代码缩进的 C# 程序无法被计算机执行。\n\n---\n\n### 22.10 复习题：单选择\n\n为以下每个陈述选择正确答案。\n\
  \n1) 以下两个程序：\n```csharp\nint a;a = Convert.ToInt32(Console.ReadLine());if (a > 40)\
  \ {Console.WriteLine(a * 2);a++;}else {Console.WriteLine(a * 2);a += 5;}\n```\n\
  ```csharp\nint a;a = Convert.ToInt32(Console.ReadLine());Console.WriteLine(a * 2);if\
  \ (a > 40) {a++;}else {a += 5;}\n```\na) 产生相同的结果。\nb) 不产生相同的结果。\nc) 以上都不是。\n\n2)\
  \ 以下两个程序：\n```csharp\nint a;a = Convert.ToInt32(Console.ReadLine());if (a > 40)\
  \ {Console.WriteLine(a * 2);}if (a > 40) {Console.WriteLine(a * 3);}\n```\n```csharp\n\
  int a;a = Convert.ToInt32(Console.ReadLine());if (a > 40) {Console.WriteLine(a *\
  \ 2);Console.WriteLine(a * 3);}\n```\na) 产生相同的结果，但第一个程序更快。\nb) 产生相同的结果，但第二个程序更快。\n\
  c) 不产生相同的结果。\nd) 以上都不是。\n\n3) 以下两个程序：\n```csharp\nint a;a = Convert.ToInt32(Console.ReadLine());if\
  \ (a > 40) {Console.WriteLine(a * 2);}else {Console.WriteLine(a * 3);}\n```\n```csharp\n\
  int a;a = Convert.ToInt32(Console.ReadLine());if (a > 40) {Console.WriteLine(a *\
  \ 2);}if (a > 40) {Console.WriteLine(a * 3);}\n```\na) 产生相同的结果，但第一个程序更快。\nb) 产生相同的结果，但第二个程序更快。\n\
  c) 不产生相同的结果。\nd) 以上都不是。\n\n4) 以下程序：\n```csharp\nint x;x = Convert.ToInt32(Console.ReadLine());if\
  \ (x < 0)\n```\n无法执行，因为\na) 它没有使用缩进。\nb) 它包含了逻辑错误。\nc) 以上都不是。\n\n---\n\n### 22.11\
  \ 练习\n\n完成以下练习。\n\n1) 使用更少的语句重写以下 C# 程序：\n```csharp\nint a, x, y;y = Convert.ToInt32(Console.ReadLine());if\
