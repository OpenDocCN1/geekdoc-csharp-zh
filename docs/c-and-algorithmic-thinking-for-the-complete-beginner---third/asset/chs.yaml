  \n### 练习 34.4-5 排序二维维数组\n\n编写一个代码片段，对二维数组的每一列进行升序排序。假设该数组包含数值值。\n\n#### 解决方案\n\n\
  二维维数组的示例如下。\n\n![Image](img/chapter34-17.png)\n\n\n\n由于该数组有七列，冒泡排序算法需要执行七次，每列执行一次。因此，整个冒泡排序算法应该嵌套在一个循环七次的\
  \ `for` 循环中。\n\n但让我们按照正确的顺序来。使用“从内层到外层”的方法，下一个代码片段仅对二维数组 `a` 的第一列（列索引为 0）。假设变量 `j`\
  \ 的值为 0。\n\n```cpp\nfor (m = 1; m <= ROWS - 1; m++) {\n    for (n = ROWS - 1; n\
  \ >= m; n--) {\n        if (a[n, j] < a[n - 1, j]) {\n            temp = a[n, j];\n\
  \            a[n, j] = a[n - 1, j];\n            a[n - 1, j] = temp;\n        }\n\
  \    }\n}\n```\n\n现在，为了对所有列进行排序，你可以将这段代码片段嵌套在一个遍历所有列的 `for` 循环中，如下：\n\n```cpp\n\
  for (j = 0; j <= COLUMNS - 1; j++) {\n    for (m = 1; m <= ROWS - 1; m++) {\n  \
  \      for (n = ROWS - 1; n >= m; n--) {\n            if (a[n, j] < a[n - 1, j])\
  \ {\n                temp = a[n, j];\n                a[n, j] = a[n - 1, j];\n \
  \               a[n - 1, j] = temp;\n            }\n        }\n    }\n}\n```\n\n\
  这并不难对吧？\n\n### 练习 34.4-6 改进的冒泡排序算法 – 一维数组排序\n\n编写一个 C# 程序，让用户输入 20 个人的体重，然后显示三个最重和三个轻的体重。使用改进的冒泡排序算法。\n\
  \n### 答案\n\n为了解决这个练习，C# 程序可以对用户提供的数据进行升序排序，然后显示索引位置 17、18 和 19 的元素（三个最重的体重）以及索引位置\
  \ 0、1 和 2 的元素（三个最轻的体重）。但这种改进版的冒泡排序算法是什么，它实际上是如何工作的？假设你有下面这样一个包含六个人体重的数组。\n\n![Image](img/chapter34-18.png)\n\
  \n如果你仔细观察，你可以自己确认，唯一不在正确位置上的元素是索引为 3 和 4 的元素。如果你交换它们的值，数组 `w` 立即就会变成有序状态！遗憾的是，冒泡排序算法并不是这样运行的。对于给定的六元素数组，无论哪种方式，它都会执行五轮，总共进行\
  \ ![Image](img/chapter34-19.png) 次比较，其中 `N` 是数组元素的总数。对于较大的数组，冒泡排序算法执行的比较总数呈指数级增长！例如，对于一个包含\
  \ 1000 个元素的数组，冒泡排序算法会执行 499,500 次比较！\n\n当然，改进的冒泡排序算法可以通过以下方式克服这种情况：如果执行了一个完整的循环且没有发生任何交换，则表明数组现在已经排序，不需要再进行后续循环。为了实现这一点，C#\
  \ 程序可以使用一个标志变量来指示是否发生了任何交换。在每一轮开始时，可以给标志变量分配 `false` 值；当发生交换时，分配 `true` 值。如果在一轮结束时，标志仍为\
  \ `false`，则说明没有发生任何交换，因此必须停止迭代。改进的冒泡排序如接下来所示。它使用了 `break` 语句和标志变量 `swaps`。\n\n```cpp\n\
  for (m = 1; m <= ELEMENTS - 1; m++) {\n    // 给变量 swaps 赋值 false\n    swaps = false;\n\
  \    // 执行新的一轮\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (w[n] < w[n\
  \ - 1]) {\n            temp = w[n];\n            w[n] = w[n - 1];\n            w[n\
  \ - 1] = temp;\n            swaps = true;\n        }\n    }\n    // 如果变量 swaps 仍为\
  \ false，说明这一轮没有发生交换。停止迭代！\n    if (!swaps) break;\n}\n```\n\n![](img/notice.jpg)每当开始新的一轮时，必须给变量\
  \ `swaps` 分配值 `false`。这就是为什么语句 `swaps = false` 必须放在两个 `for` 语句之间。\n\n![](img/notice.jpg)语句\
  \ `if (!swaps)` 等于语句 `if (swaps == false)`。\n\n最终的 C# 程序如下所示。\n\n![](img/my_exercise_header.png)\
  \ 项目 _34.4-6\n```cpp\nconst int ELEMENTS = 20;\nint i, m, n;\nbool swaps;\ndouble\
  \ temp;\ndouble[] w = new double[ELEMENTS];\nfor (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n    w[i] = Convert.ToDouble(Console.ReadLine());\n}\nfor (m = 1; m <= ELEMENTS\
  \ - 1; m++) {\n    swaps = false;\n    for (n = ELEMENTS - 1; n >= m; n--) {\n \
  \       if (w[n] < w[n - 1]) {\n            temp = w[n];\n            w[n] = w[n\
  \ - 1];\n            w[n - 1] = temp;\n        }\n    }\n    if (!swaps) break;\n\
  }\nConsole.WriteLine(\"三个最重的体重:\");\nConsole.WriteLine(w[ELEMENTS - 3] + \" \" +\
  \ w[ELEMENTS - 2] + \" \" + w[ELEMENTS - 1]);\nConsole.WriteLine(\"三个最轻的体重:\");\n\
  Console.WriteLine(w[0] + \" \" + w[1] + \" \" + w[2]);\n```\n\n### 练习 34.4-7 选择排序算法\
  \ – 一维数组排序\n\n编写一个 C# 程序，使用选择排序算法对数组进行升序排序。\n\n### 答案\n\n选择排序算法在处理大数据时并不像冒泡排序那样效率低下，但它通常比后者更好。让我们尝试对数组进行升序排序：\n\
  \n```cpp\nfor (m = 0; m < ELEMENTS - 1; m++) {\n    int minIndex = m;\n    for (n\
  \ = m + 1; n < ELEMENTS; n++) {\n        if (a[n] < a[minIndex]) {\n           \
  \ minIndex = n;\n        }\n    }\n    // 交换元素\n    temp = a[m];\n    a[m] = a[minIndex];\n\
  \    a[minIndex] = temp;\n}\n```\n\n\n\n编写一个 C# 程序，提示用户输入一年内每月消耗的电量总量（kWh）。然后显示用电量最高的三个月份以及对应的电量数值（按降序排列）。使用选择排序算法。\n\
  \n## 解决方案\n\n在此项练习中，你需要以下两个一维数组。\n\n![Image](img/chapter34-26.png)\n\n当选择排序算法对 `kwh`\
  \ 数组的元素进行排序时，必须保持与 `months` 数组元素的一一对应关系。这意味着每当 `kwh` 数组中的两个元素交换内容时，`months` 数组中对应的元素也必须交换内容。\n\
  \n然而，考虑到你只需要用电量最高的三个月份，选择排序算法应该对前三个元素进行排序。该 C# 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.4-\n\n```csharp\nint i, m, indexOfMax, n;\ndouble maximum, temp;\n\
  string tempStr;\nstring[] months = {\"January\", \"February\", \"March\", \"April\"\
  , \"May\", \"June\", \"July\", \"August\", \"September\", \"October\", \"November\"\
  , \"December\"};\ndouble[] kwh = new double[months.Length];\nfor (i = 0; i <= months.Length\
  \ - 1; i++) {\n    Console.Write(\"Enter kWh for \" + months[i] + \": \");\n   \
  \ kwh[i] = Convert.ToDouble(Console.ReadLine());\n}\nfor (m = 0; m <= 2; m++) {\n\
  \    //仅对前三个元素进行排序\n    maximum = kwh[m];\n    indexOfMax = m;\n    for (n = m;\
  \ n <= months.Length - 1; n++) {\n        if (kwh[n] > maximum) {\n            maximum\
  \ = kwh[n];\n            indexOfMax = n;\n        }\n    }\n    // 交换 kwh 的值\n \
  \   temp = kwh[m];\n    kwh[m] = kwh[indexOfMax];\n    kwh[indexOfMax] = temp;\n\
  \    // 交换 months 的值\n    tempStr = months[m];\n    months[m] = months[indexOfMax];\n\
  \    months[indexOfMax] = tempStr;\n}\nfor (i = 0; i <= 2; i++) {\n    Console.WriteLine(months[i]\
  \ + \": \" + kwh[i]);\n}\n```\n\n![](img/notice.jpg)如果此练习要求使用冒泡排序而不是选择排序算法，你可以采用同样的“技巧”。算法可以执行\
  \ 3 次循环而不是 `ELEMENTS – 1` 次循环。\n\n## 练习 34.4-9 插入排序算法 – 一维数组的排序\n\n编写一个代码段，使用插入排序算法按升序排列数组中的元素。假设数组包含数值。\n\
  \n### 解决方案\n\n插入排序算法对于大规模数据来说效率很低，选择排序和冒泡排序算法也是如此，但它的性能通常优于两者。此外，插入排序算法在排序非常小的数组时可以证明非常快——有时甚至比快速排序算法更快。\n\
  \n插入排序算法类似于你扑牌的方式。你开始时将所有的牌朝朝放在桌子上。桌面上的牌代表未排序的“数组”。开始时你的左手是空的，但最后这只手将持有排序好的牌。过程如下：你一次从桌上取出一张牌，并将其插入到左手中正确的位置。要找到牌的正确位置，你需要将其从右到左与手中已有的每张牌进行比较。最后，桌子上不能再有牌了，你的左手将持有所有排序好的牌。\n\
  \n例如，让我们尝试按升序排列以下数组。为了更好地理解这个例子，假设排序过程已经开始，数组的前三个元素已经过排序。\n\n![Image](img/chapter34-27.png)\n\
  \n![](img/notice.jpg)索引位置 0、1 和 2 处的元素代表你左手中的牌，而数组的其余元素代表桌子上未排序的牌。\n\n位置 3 处的元素（数值为\
  \ 8）从数组中移除，其左侧所有值大于 8 的元素都向右移动。数组 `A` 变为\n\n![Image](img/chapter34-28.png)\n\n现在释放了一个位置，将值\
  \ 8 插入到该处。数组变为\n\n![Image](img/chapter34-29.png)\n\n位置 4 处的元素（数值为 10）从数组中移除，其左侧所有值大于\
  \ 10 的元素都向右移动。数组 `A` 变为\n\n![Image](img/chapter34-30.png)\n\n现在释放了一个位置，将值 10 插入到该处。数组变为\n\
  \n![Image](img/chapter34-31.png)\n\n位置 5 处的元素（数值为 18）从数组中移除，其左侧所有值大于 18 的元素都向右移动。数组\
  \ `A` 变为\n\n![Image](img/chapter34-32.png)\n\n将值 18 插入到释放的位置。数组变为\n\n![Image](img/chapter34-33.png)\n\
  \n位置 6 处的元素（数值为 9）从数组中移除，其左侧所有值大于 9 的元素都向右移动。数组 `A` 变为\n\n![Image](img/chapter34-34.png)\n\
  \n最后，将值 9 插入到释放的位置，算法结束，数组现在已经排序完毕。\n\n![Image](img/chapter34-35.png)\n\n![](img/notice.jpg)算法实际执行的操作是逐个检查未排序的元素，并将每个元素插入到已已排序元素中的适当位置。\n\
  \n使用插入排序算法按升序排列数组的代码段如下。\n\n```csharp\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n \
  \   //\"从数组中“移除”索引位置 m 处的元素并保留在变量 element 中\n    element = a[m];\n    // 将适当元素向右移动\n\
  \    n = m;\n    while (n > 0 && a[n - 1] > element) {\n        a[n] = a[n - 1];\
  \  //等同于：\n        n--;              //a[n--] = a[n – 1];\n    }\n    // 将之前“移除”的元素插入索引位置\
  \ n\n    a[n] = element;\n}\n```\n\n![](img/notice.jpg)请注意，索引位置 m 处的元素并没有实际上从数组中移除，而是在执行移动操作时实际上被覆盖了。（等等，文本说“并没有实际上从数组中移除，而是在执行移动操作时实际上被覆盖了”）。这就是为什么它的值被保留在\
  \ `element` 中。\n\n![](img/notice.jpg)如果你想按降序排列数组，你只需要将布尔语句改为 `n > 0 && a[n - 1]\
  \ < element`。\n\n![](img/remember.jpg)与之前的两个算法一样，为了在 C# 中排序字母数字数据，只需将表达式 `n > 0\
  \ && a[n - 1] > element` 替换为 `n > 0 && a[n - 1].CompareTo(element) > 0`。\n\n## 练习\
