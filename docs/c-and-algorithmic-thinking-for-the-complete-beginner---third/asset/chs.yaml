  \n我出生于 1973 年，从很小开始，我就发现了对计算机编程的热爱。12 岁时，我得到了我的第一台电脑——Commodore 64，它包含一个基于 ROM 的\
  \ BASIC 编程语言版本和 64KB 内存。它带我进入了编程的世界！\n\n我拥有皮拉埃斯技术教育学院的计算机工程学位。此外，我还在特拉斯德莫克里特斯大学获得了电气与计算机工程的工程师和集成硕士学位。\n\
  \n在我之前一家专门工业数据流和产品标签的公司担任软件开发人员期间，我的职责包括为数据终端开发软件应用程序，以及用于在 `Microsoft SQL Server®`\
  \ 上进行收集和存储数据的 PC 软件。\n\n多年来，我设计了各种应用程序，包括为各种公司和组织设计的仓库系统和网站。目前，我在一家职业高中担任计算机科学教师，教授计算机编程、计算机网络、互联网/内网编程工具以及数据库等课程。\n\
  \n我编写了几本书，主要关注算法思维和计算思维，利用了 `Python`、`Java`、`C++`、`PHP` 和 `Visual Basic` 等语言。\n\n\
  在职业追求之外，我婚姻美满，快乐地养着两个孩子。\n\n### 致谢\n\n我要特别感谢我的朋友、高级编辑 Victoria (Vicki) Austin，她在第一版中提供的帮助。没有她，本书可能无法发挥全部潜力。在她耐指导和建设性建议下，她帮助我提升了这本书水平！\n\
  \n### 本书的结构\n\n你手中的这本书遵循螺旋课程教学法，这是由美国心理学家杰罗·布鲁纳（Jerome Bruner）在 1960 年提出的。根据这种方法，在教学过程中，基本元素会反复出现——每次都变得更加深入。首先读者学习基本元素而不必担心细节。随后，教授细节并再次提到基本元素，最终存储在大脑的长期记忆中。\n\
  \n根据布鲁纳，学习需要学生的积极参与、实验、探索和发现。本书包含了许多示例，大多数可以进行实际操作。这让读者有机会接触 `C#` 并能够创建自己的程序。\n\n\
  ### 谁应该买这本书？\n\n本书针对最新版本的 `C#` 完全完全更新，提供了全面的编程介绍，假设对该主题没有基础。它是为渴望从零学习 `C#` 的个人设计的，为算法思维提供了强大的基础——这是任何程序员必须掌握的基本技能。算法思维不仅是编写代码，它还意味着通过代码解决问题的艺术。\n\
  \n本版保留了前作的所有受欢迎功能，同时引入了大量新练习，并进行了大量的修订和更新。此外，全新的章节对处理文件提供了实用介绍。\n\n本书结构适用于课堂教学和独立学习，每个章的最后都有一组问题和练习，旨在加强您的理解并应用所学知识。拥有约\
  \ 250 道解题和 480 道未解练习、500 道判断题、150 道单选题以及 200 道复习题和字谜游戏（在线提供解决方案和答案），本书非常适合：\n\n\
  ►追求自学的初级或中级程序员►高中生►大学或学院大一学生►教育者►教授►任何想要使用最佳实践和技术开始学习或教授计算机编程的人\n\n### 本使用的约定\n\n\
  \n\n\n\n以下是对书中使用的惯例的一些说明。“惯例”指的是文本某些部分的显示标准方式。\n\n## C# 语句\n\n本书使用了大量用 C# 语言编写的示例。C#\
  \ 语句使用如下所示字体显示。\n\n```\nThis is a C# statement\n```\n\n## 段落文本中的关键字、变量、方法和参数\n\n\
  关键字、`variables`、`methods`（子程序）和 `arguments` 有时会段落文本中。当它们出现时，这些特殊文本将使用与段落其他部分不同的字体显示。例如\
  \ `firstName = 5` 就是段落文本中的一个 C# 语句示例。\n\n### 斜体单词\n\n你可能会注意到，某些特殊文本也以斜体形式显示。在本书中，斜体单词表示通用的类型，必须被替换为适用于你数据的特定名称。例如，C#\
  \ 语句的通用形式可能呈现为：\n\n```c\nvoid name(type1 arg1, type2 arg2)\n```\n\n为了完成该语句，必须将关键字\
  \ `name`、`type1`、`arg1`、`type2` 和 `arg2` 替换为具有意义的内容。当你程序中使用该语句时，你可能会以以下形式使用：\n\n\
  ```csharp\nvoid displayRectangle(int width, int height)\n```\n\n### 三个点（…）：省略号\n\
  \n在语句的通用形式中，你可能会在示例的列表后面看到三个点（ …），它们也被称为“省略号”。它们不是语句的一部分。省略号表示你可以在列表中包含你想要的任意数量的项。例如，语句通用形式中的省略号：\n\
  \n```csharp\ndisplayMessages(arg1, arg2, … );\n```\n\n表示列表可能包含多于两个参数。当你程序中使用该语句时，你的语句可能像这样：\n\
  \n```csharp\ndisplayMessages(message1, \"Hello\", message2, \"Hi!\");\n```\n\n###\
  \ 斜体方括号\n\n某些语句或方法（子程序）的通用形式可能包含带斜体的“方括号” `[ ]`，这表示括其中的区域是可选的。例如，语句的通用形式：\n\n```csharp\n\
  subject.Substring(beginIndex [, length])\n```\n\n表示 `[, length]` 部分可以省略。\n\n例如，以下两个语句可能会产生不同的结果，但它们在语法上都是正确的。\n\
  \n```csharp\na = s.Substring(3);\nb = s.Substring(3, 9);\n```\n\n### 深色标题\n\n本书的大多数示例使用如下所示字体显示。\n\
