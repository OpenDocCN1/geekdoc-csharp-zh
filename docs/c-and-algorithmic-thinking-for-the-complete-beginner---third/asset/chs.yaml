  \n# 第一部分\n基础知识\n\n## 第一章\n计算机是如何工作的\n\n### 1.1 引言\n\n在当今社会中，几乎每项任务都需要使用计算机。在学校，学生使用电脑搜索互联网并发送电子邮件。在工作中，人们使用它们制作演示文稿、分析数据并与客户交流。在家，人们使用电脑玩游戏、连接社交网络并与其他聊天。当然，不要忘记像\
  \ iPhone 这样的智能手机。它们也是计算机！\n\n计算机之所以能执行许多不同的任务，是因为它们可以被编程。换句话说，计算机可以执行任何程序告诉它执行的工作。程序是一组语句（通常称为指令或命令），计算机遵循这些语句来执行特定的任务。\n\
  \n程序对计算机来说是关重要的，因为没有程序，计算机就是一台无所事事的笨人机器。实际上是程序告诉计算机该做什么以及什么时候做。另一方面，程序员或软件开发者是设计、创建并测试计算机程序的人。\n\
  \n本书将向你介绍使用 C# 语言进行编程的基础概念。\n\n### 1.2 什么是硬件？\n\n硬件术指的是组成计算机的所有设备或组件。如果你打开过计算机或笔记本电脑的外壳，你可能已经见过它的许多组件，例如处理器\
  \ (`CPU`)、内存和硬盘。计算机不是一个设备，而是一个共同工作的设备系统。这里讨论了典型计算机系统的基本组件。\n\n►中央处理器 (CPU)\n\n这是计算机执行程序中定义的所有任务的部分。\n\
  \n►主内存 (RAM – 随机访问存储器)\n\n这是计算机存放程序（在运行时）以及程序正在处理的数据的区域。当你关闭计算机或拔掉电源时，存储在此类型内存中的所有程序和数据都会丢失。\n\
  \n主内存 (ROM – 只读存储器)\n\nROM 或只读存储器是一种特殊的内存，计算机只能读取（但不能更改）。存储在此类型内存中的所有程序和数据在计算机关闭时不会丢失。ROM\
  \ 通常包含制造商的指令以及一个称为引导加载程序的程序，其功能是在打开电源后启动计算机系统的运行。\n\n►次级存储设备\n\n\n\n\n这通常是硬盘或 `SSD`（固态硬盘），有时（但较少）是\
  \ `CD/DVD` 驱动器。与主内存（`RAM`）相比，这种内存可以存储较长时间的数据，即使计算机没有电也是如此。然而，存储在此内存中的程序无法直接执行。它们必须被传输到速度得多的内存中，即主内存。\n\
  \n## 输入设备\n\n输入设备是指所有从外部世界收集数据并输入计算机进行进一步处理的设备。`键盘`、`鼠标`和`麦克风`都是输入设备。\n\n## 输出设备\n\
  \n输出设备是指所有向外部世界输出数据的设备。`显示器`（屏幕）和打印机都是输出设备。\n\n### 1.3 什么是软件？\n\n计算机所做的一切都由软件控制。软件分为两类：系统软件和应用软件。\n\
  \n- **系统软件**是控制和管理计算机基本操作的程序。例如，系统软件控制计算机的内部操作。它管理所有连接到它的设备，并保存数据、加载数据以及允许其他程序的执行。系统软件的三种主要类型是：\n\
  \    - **操作系统**。`Windows`、`Linux`、`macOS`、`Android`和`iOS`都是操作系统的示例。\n    - **实用软件**。这类软件通常与操作系统一起安装。它们用于让计算机尽可能高效地运行。`防病毒软件`和`备份工具`被视为实用软件。\n\
  \    - **设备驱动程序**。设备驱动程序控制连接到计算机的设备，如`鼠标`或`显卡`。设备驱动程序是一个像翻译器的程序。它将操作系统的指令翻译成设备实际上可以理解的指令。\n\
  - **应用软件**指的是你用于日常任务的所有其他程序，例如`浏览器`、`文字处理器`、`记事本`、`游戏`等等。\n\n### 1.4 计算机如何执行（运行）程序\n\
  \n当你打开计算机时，主内存（`RAM`）是完全空的。计算机需要做的第一件事是将操作系统从硬盘传输到主内存。\n\n在操作系统加载到主内存后，你就可以执行（运行）你喜欢的任何程序（应用软件）。这通常通过点击、双击或触摸程序的相应图标来实现。例如，假设你点击了你喜欢的文字处理器的图标。此动作命令计算机从硬盘复制（或加载）文字处理程序到主内存（`RAM`）中，以便`CPU`执行它。\n\
  \n![](img/remember.jpg)\n程序存储在硬盘等次级存储设备上。当你在计算机上安装程序时，程序会被复制到硬盘上。然后，当你执行程序时，程序会从硬盘复制（加载）到主内存（`RAM`），并执行该程序的副本。\n\
  \n![](img/notice.jpg)\n“运行”和“执行”是同义词，可以互换使用。\n\n### 1.5 编译器和解释器\n\n计算机可以执行用严格定义的计算机语言编写的程序。你不能使用英语或希腊语等自然语言编写程序，因为你的计算机无法理解你！\n\
  \n但计算机实际上理解什么呢？计算机可以理解一种特定的低级语言，称为`机器语言`。在机器语言中，所有的语句（或命令）都由 0 和 1 组成。以下是用机器语言编写的程序示例，用于计算两个数字的和。\n\
  \n```\n0010 0001 0000 01000001 0001 0000 01010011 0001 0000 01100111 0000 0000 0001\n\
  ```\n\n感到惊讶？别担心，你不会用这种方式编写程序的。希望现在不再有人用这种方式编写计算机程序了。如今，所有的程序员都用高级语言编写程序，然后他们使用特殊的程序将它们翻译成机器语言。\n\
  \n![](img/notice.jpg)\n高级语言是一种不限于特定类型计算机的语言。\n\n程序员用于执行翻译的程序有两种：`编译器`和`解释器`。\n\n\
  - **编译器**是一个将用高级语言编写的语句翻译成一个独立的机器语言程序的程序。然后你可以在你需要的任何时候执行该机器语言程序。翻译完成后，除非你对高级语言程序更改了更改，否则不需要再次运行编译器。\n\
  - **解释器**是一个同时翻译并执行用高级语言编写的语句的程序。当解释器读取高级语言程序中的每条单独语句时，它就会对其进行翻译。\n\n### 1.6 什么是源代码？\n\
  \n程序员在高级语言中编写的语句（通常称为指令或命令）被称为`源代码`或简单称为`代码`。程序员首先在名为`代码编辑器`的程序中输入`源代码`，然后使用`编译器`来翻译它，或使用`解释器`来执行它。\n\
  \n![](img/notice.jpg)\n虽然现在看起来可能并不寻常，但使用简单的文本编辑器编写程序是完全可能的！\n\n### 1.7 复习习题：判断对错\n\
  \n请对下列每项判断对或错。\n\n1) 现代计算机能够执行这么多任务是因为它们具有可编程能力。\n2) 计算机可以在没有程序的情况下运行。\n3) 硬盘是硬件示例。\n\
  4) 即使计算机没有电，数据也可以在主内存（`RAM`）中存储很久。\n5) 数据存储在主内存（`RAM`）中，但程序不是。\n6) 扬声器是输出设备的示例。\n\
  7) `Windows`和`Linux`是软件示例。\n8) 设备驱动程序是硬件示例。\n9) 媒体播放器是系统软件示例。\n10) 当你打开计算机时，主内存（`RAM`）已经包含了操作系统。\n\
  11) 当你打开文字应用程序时，它实际上是从次级存储设备复制到主内存（`RAM`）的。\n12) 在机器语言中，所有的语句（命令）都是 0 和 1 的序列。\n\
  13) 如今，计算机无法理解 0 和 1。\n14) 如今，软件是用 0 和 1 组成的语言编写的。\n15) 软件指的是计算机的物理组件。\n16) `编译器`和`解释器`是软件。\n\
  17) 编译器将`源代码`翻译成可执行文件。\n18) 解释器创建一个机器语言程序。\n19) 考虑到程序可能会被执行多次，在通过解释翻译并执行一次后，解释器就不再需要了。\n\
  20) `源代码`可以使用简单的文本编辑器编写。\n\n### 1.8 复习习题：单选题\n\n为下列每个陈述选择正确答案。\n\n\n\n\n\n1) 以下哪一项不是计算机硬件？\n\
  a) 硬盘\nb) DVD 光盘\nc) 声卡\nd) 主内存 (RAM)\n\n2) 以下哪一项不是次级存储设备？\na) DVD 读写机\nb) 固态硬盘\
  \ (SSD)\nc) USB 闪盘\nd) RAM\n\n3) 以下哪种操作是 CPU 无法执行的？\na) 将数据传输到主内存 (RAM)。\nb) 从主内存\
  \ (RAM) 传输数据。\nc) 执行算术运算。\nd) 外科手术。\n\n4) 触摸屏是\na) 输入设备。\nb) 输出设备。\nc) 以上两者都是。\n\
  \n5) 以下哪一项不是软件？\na) Windows\nb) Linux\nc) iOS\nd) 视频游戏\ne) 网页浏览器\nf) 以上都是软件。\n\n\
  6) 以下哪个陈述是正确的？\na) 程序存储在硬盘上。\nb) 程序存储在 USB 闪盘（U 盘）上。\nc) 程序存储在主内存 (RAM) 中。\nd) 以上全部正确。\n\
  \n7) 以下哪个陈述是正确的？\na) 程序直接从硬盘执行。\nb) 程序直接从 DVD 光盘执行。\nc) 程序直接从主内存 (RAM) 执行。\nd) 以上全部正确。\n\
  e) 以上均不正确。\n\n8) 程序员无法用以下语言编写计算机程序：\na) 机器语言。\nb) 这种语言（如英语、希腊语等）。\nc) C#。\n\n9)\
  \ 编译器会将\na) 用机器语言编写的程序翻译成高级语言程序。\nb) 用自然语言（英语、希腊语等）编写的程序翻译成 机器语言程序。\nc) 用高级计算机语言编写的程序翻译成机器语言程序。\n\
  d) 以上都不是。\ne) 以上都是。\n\n10) 机器语言是\na) 机器之间相互通信使用的语言。\nb) 一种由数值指令组成、计算机直接使用的语言。\n\
  c) 使用英语单词进行操作的语言。\n\n11) 在用高级计算机语言编写的程序中，如果两个语句连续出现，解释器会\na) 翻译并执行第一个，然后翻译并执行第二个。\n\
  b) 先翻译第一个，再翻译第二个，然后同时执行它们。\nc) 只翻译第一个（因为它们是相同的），然后执行两次。\n\n## 第 2 章\n\n## C# 与集成开发环境\n\
  \n### 2.1 什么是 C#？\n\n`C#`（读作“C sharp”）是一种广泛使用的通用型高级计算机编程语言，它允许程序员创建桌面应用或移动应用程序、大规模应用程序、嵌入式系统、客户端/服务器应用程序、网页以及许多其他类型的软件。`C#`\
  \ 是其前身 `C` 编程语言的扩展。\n\n`C#` 被设计为一种平台无关语言。它的目的是让程序员能够“一次编写，随运行 (WORA)”，这意味着代码编写一次即可在任何硬件和操作系统的组合上运行，而无需重新编译。\n\
  \n### 2.2 脚本和程序之间的区别是什么？\n\n从技术上来说，脚本是解释执行的，而程序是编译执行的，但这实际上并不是它们的主要区别。它们之间还有更重要的区别！\n\
  \n用 `JavaScript` 或 `VBA`（应用程序 Visual Basic）等脚本语言编写的脚本的主要目的是控制另一个应用程序。因此你可以说，在某些方面\
  \ `JavaScript` 控制网页浏览器，而 `VBA` 控制微软® Office 应用程序（如 `MS Word` 或 `MS Excel`）。\n\n\
  相反，用 `C#`、`C++` 或 `Java`（仅举几个）等编程语言编写的程序独立于任何其他应用程序执行。只要用户需要，程序随时都可以作为独立程序执行，不需要宿主应用程序。\n\
  \n![](img/notice.jpg)Microsoft Office 的宏是用 `VBA` 编写的脚本。它们的目的是自动化 Microsoft Office\
  \ 内的某些功能。\n\n![](img/notice.jpg)很多人认为 `JavaScript` 是 `Java` 的简化版，但实际上名称的相似仅仅是巧合。\n\
  \n![](img/remember.jpg)脚本不能作为独立程序执行。它需要宿主应用程序才能执行。\n\n### 2.3 为什么你应该学习 C#\n\n`C#`\
  \ 是所谓的“高级”计算机语言。`C#` 的编码风格与 `C` 语言相似。它非常容易理解，在 `Windows`、`Android`、`Linux` 和 `Unix`\
  \ 等多个平台上非常高效。`C#` 是一种灵活且强大的语言，非常适合开发大规模应用程序、嵌入式系统、驱动程序、客户端/服务器应用程序、艺术应用、音乐播放器，甚至是视频游戏。\n\
  \n`C#` 无处不在！它存在于桌面计算机、笔记本电脑、移动设备，甚至存在于价值数百万的数据中心中。凭借全球庞大的开发者社区，`C#` 实现了许多令人兴奋的应用服务的快速开发。`C#`\
  \ 程序员的大量可用是组织选择 `C#` 而非其他编程语言进行新开发的主要原因。这也是你实际上应该学习 `C#` 的绝佳理由！\n\n### 2.4 C# 是如何工作的\n\
  \n计算机不能理解英语或希腊语等自然语言，因此你需要像 `C#` 这样的计算机语言来与它们通信。`C#` 是一种非常强大的高级计算机语言。`C#` 编译器（实际上是两个编译器的组合）将\
  \ `C#` 语言转换为计算机可以理解的语言，被称为“机器语言”。\n\n过去，计算机语言使用解释器或编译器。但现在，包括 `C#` 在内的许多语言使用两个编译器。在\
  \ `C#` 中，第一个编译器将语句翻译成一种称为公共中间语言 (`CIL`) 的中间语言，这种语言类似于 Java 的字节码。`CIL` 代码存储在磁盘上的可执行文件中，称为程序，通常扩展名为\
  \ `.exe`。随后，当用户想要执行该文件时，`.NET`（读作“dot net”）会执行即时 (`JIT`) 编译，将 `CIL` 代码转换为低级机器语言代码以供硬件直接执行。\n\
  \n![](img/notice.jpg).NET Framework 是用于在 Windows 上运行任何类型应用的 .NET 版本。\n\n![](img/notice.jpg).NET\
  \ Core 是用于在 Windows、Linux 或 macOS 上运行的网站、服务和控制程序的 .NET 版本\n\n![](img/notice.jpg)除了两个编译器，有些语言使用一个编译器和一个解释器。例如\
  \ Java，编译器将 Java 语句翻译成字节码语句并将其保存为 `.class` 文件。随后，当用户想要执行 `.class` 文件时，Java 虚拟机 (`JVM`)——实际上是编译器和解释器的组合——会读取\
  \ `.class` 文件并执行它，最初使用解释执行。在解释过程中，`JVM` 会监控频繁执行的字节码序列，并将它们翻译（编译）成低级机器语言代码以供硬件直接执行。\n\
  \n在图 2–1 中，你可以看到用 C# 编写的语句是如何编译成 `CIL` 代码的，以及 `CIL` 代码随后是如何使用 `.NET` 编译并执行的。\n\n\
  .![Image](img/chapter02-01.png)\n\n图 2–1 使用 .NET 执行 C# 语句\n\n\n\n\n现在有了一些合理的问题：为什么要费这些事？为什么\
  \ `C#` 和其他语言需要翻译两次？为什么 `C#` 语句不直接翻译成低级机器语言代码？答案在于 `C#` 被设计为一种平台无关的编程语言。这意味着程序编写一次，就可以在任何设备上执行，无论其操作系统或架构如何，只要该设备安装了相应版本的\
  \ `.NET` 即可。在过去，程序必须为每个计算机平台重新编译，甚至重写。`C#` 的最大优势之一就是你只需要编写和编译一次程序！在图 2–2 中，你可以看到用\
  \ `C#` 编写的语句是如何编译成 `CIL` 代码的，以及 `CIL` 代码如何在任何安装了相应 `.NET` 的平台上执行的。\n\n![Image](img/chapter02-02.png)\n\
  \n图 2–2 在不同平台上执行 `C#` 语句\n\n## 2.5 集成开发环境\n\n集成开发环境（简称 `IDE`）是一种种的软件，它包含了程序员编写和测试程序所需的所有基本工具。`IDE`\
  \ 通常包含一个源代码编辑器，并集成了如 `compiler`（编译器）或 `interpreter`（解释器）等工具，以及一个 `debugger`（调试器）。`Visual\
  \ Studio Community` 和 `Visual Studio Code` 是 `IDE` 的两个示例，允许程序员编写、执行和调试他们的源代码。\n\n\
  ![](img/notice.jpg)“调试器”有助于程序员发现并纠正许多错误的工具。\n\n## 2.6 Microsoft Visual Studio\n\n\
  `Visual Studio` 是一个集成开发环境 (`IDE`)，它为许多编程语言提供了一套强大的工具（通过单独安装的扩展），并让你能够轻松创建适用于 `Android`、`iOS`、`macOS`、`Windows`\
  \ 和云端的应用程序，以及网站、Web 应用程序 Web 服务。\n\n`Visual Studio` 不仅仅是一个文本编辑器。它可以缩进行、匹配单词和括号，并突出显示错误的源代码。它还提供自动代码（`IntelliSense^®`），这意味着在你输入时，它会显示可能的补全列表。`IDE`\
  \ 还提供提示帮助你分析代码并发现任何潜在问题。它甚至会建议一些简单的解决方案来修复这些问题。你可以使用 `Visual Studio` 不仅可以编写程序，还可以直接从\
  \ `IDE` 执行你的程序。\n\n`Visual Studio` 在全球范围内庞大的用户群，这就是为什么它有许多不同的版本。具体来说，在微软的下载页面，你可以下载：\n\
  \n► `Visual Studio`（Community、Professional 或 Enterprise 版），运行在 `Windows` 上\n► `Visual\
  \ Studio for Mac`，运行在 `macOS` 上\n► `Visual Studio Code`，运行在 `Windows`、`macOS` 和\
  \ `Linux` 上\n\n下一章（第 3 章），你将找到一些链接，指导如何在你的计算机上安装和配置必要的内容，例如在 `Windows` 或 `Linux`\
  \ 上安装 `Visual Studio Community`、`Visual Studio Code` 以及 `.NET Core SDK`。然后，在第 9\
  \ 章中，你将发现使用 `Visual Studio Community` 或 `Visual Studio Code` 编写、执行和调试 `C#`程序的指导。这些说明可以在我的网站上找到。此外，你那里那里许多技巧，这对你作为初级程序员的第一步非常有价值！\n\
  \n## 第 3 章\n\n## 需要安装的软件包\n\n### 3.1 安装什么\n\n为了本书的目的，你需要在计算机上安装一个集成开发环境 (`IDE`)。`Visual\
