  \ {\n        maximum = w;\n    }\n}\nConsole.WriteLine(minimum + \"  \" + maximum);\n\
  ```\n\n#### 练习 30.4-2 验证输入并寻找最热行星\n\n编写一个 C# 程序，提示用户反复输入行星的名称和平均温度，直到输入“STOP”（作为名称）。最后，程序必须显示最热行星的名字。此外，由于\
  \ `-459.67`（华华氏度）是可能的最低温度（被称为绝对零），程序还必须验证数据输入（使用循环控制结构），并在用户输入低于绝对零的温度时显示错误信息。\n\
  \n解决方案\n\n首先，让我们不使用数据验证来编写 C# 程序。根据“终极”规则，预测试循环结构应该是如下的通用形式：\n\n```csharp\nConsole.Write(\"\
  Enter the name of a planet: \");\nname = Console.ReadLine();   //初始化名称\nwhile (name.ToUpper()\
  \ != \"STOP\") {\n    一条语句或语句块\n    Console.Write(\"Enter the name of a planet:\
  \ \");\n    name = Console.ReadLine();   //更新/更改名称\n}\n```\n\n\n\n现在，让我们添加剩余的语句，仍然不进行数据输入验证。请记住，由于值\
  \ `-459.67^o` 是温度刻度的下限，你可以使用比此更小的值作为变量 `maximum` 的初始值。\n\n```csharp\nmaximum = -460;mName\
  \ = \"\";Console.Write(\"Enter the name of a planet: \");name = Console.ReadLine();\
