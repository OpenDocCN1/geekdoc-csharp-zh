  \ 练习 41.1-4 合并文件\n\n假设有两个名为 `text1.txt` 和 `text2.txt` 的文本文件。编写一个 C# 程序，将这两个文件的内容合并，并将合并后的文本写入名为\
  \ `final.txt` 的第三个文件中，将 `text1.txt` 的内容放在 `text2.txt` 的内容之前。\n\n### 解决方案\n\n这个练习可以使用多种方法解决。让我们来看看其中两种。\n\
  \n### 第一种方法\n\n程序打开 `text1.txt` 文件，读取其所有内容，将其赋值给变量 `contents`，然后关闭文件。接下来，它打开 `text2.txt`\
  \ 文件，读取其所有内容，将其与之前的内容（即变量 `contents` 中的内容）合并，并关闭文件。最后，它打开 `final.txt` 文件并将合并后的内容写入其中，如下所示所示。\n\
  \n```csharp\nconst string PATH = \"c:/temp/\";\nstring contents;\nStreamReader fin;\n\
  fin = File.OpenText(PATH + \"text1.txt\");\ncontents = fin.ReadToEnd();\nfin.Close();\n\
  fin = File.OpenText(PATH + \"text2.txt\");\ncontents += fin.ReadToEnd(); // 合并\n\
  fin.Close();\nStreamWriter fout = File.CreateText(PATH + \"final.txt\");\nfout.Write(contents);\n\
  fout.Close();\n```\n\n注意对象 `fin` 是在程序开头声明的。这样你就可以反复使用同一个对象来打开和读取多个文件。\n\n### 第二种方法\n\
  \n接下来的程序在开始时打开所有三个文件，写入合并后的内容，然后关闭它们。\n\n```csharp\nconst string PATH = \"c:/temp/\"\
  ;\nStreamReader fin1 = File.OpenText(PATH + \"text1.txt\");\nStreamReader fin2 =\
  \ File.OpenText(PATH + \"text2.txt\");\nStreamWriter fout = File.CreateText(PATH\
  \ + \"final.txt\");\nfout.Write(fin1.ReadToEnd() + fin2.ReadToEnd());\nfout.Close();\n\
  fin2.Close();\nfin1.Close();\n```\n\n关闭文件的顺序不需要与打开它们文件的顺序一致。例如，你可以先打开 `text2.txt`\
  \ 文件并最后关闭它，或者先打开再先关闭它。\n\n### 练习 41.1-5 在文件中搜索\n\n在美国，社会安全号码（SSN）是一个九位数的身份号码，适用于所有美国公民，用于在社会安全方面识别他们。假设有一个名为\
  \ `SSN.txt` 的文件，其中包含加利福尼亚州所有公民的 SSN（社会安全号码）以及姓名，每行一条记录。文件结构示例所示：\n\n`123456789 Aristides\
  \ Bouras 123000000 Loukia Ainarozidou 121212121 John Papas Junior..`\n\n编写一个 C#\
  \ 程序，提示用户输入要搜索的 SSN 前几位，然后在文件中搜索并显示 SSN 以这些数字开头的公民的姓名。\n\n### 解决方案\n\n在这个特定的练习中，如果用户输入了全部九位\
  \ SSN 进行搜索并且找到了该 SSN，程序必须显示相应公民的姓名并在之后停止搜索。另一方面，如果用户输入的搜索位数少于九位，程序必须搜索并显示所有 SSN\
  \ 以这些数字开头的公民的姓名。该练习的解决方案如下。\n\n```csharp\nconst string PATH = \"c:/temp/\";\nstring\
  \ ssnToSearch, line, ssn, fullName;\nbool found;\nConsole.Write(\"Enter an SSN to\
  \ search: \");\nssnToSearch = Console.ReadLine();\nStreamReader fin = File.OpenText(PATH\
  \ + \"SSN.txt\");\nfound = false;\nwhile (!fin.EndOfStream) {\n    line = fin.ReadLine();\n\
  \    ssn = line.Substring(0, 9);\n    fullName = line.Substring(10);\n    // 如果找到了\n\
  \    if (ssnToSearch == ssn.Substring(0, ssnToSearch.Length)) {\n        Console.WriteLine(fullName);\n\
  \        found = true;\n        // 如果搜索的 SSN 包含 9 位且找到了，则退出循环\n        if (ssnToSearch.Length\
  \ == 9) {\n            break;\n        }\n    }\n}\nfin.Close();\nif (!found) {\n\
  \    Console.WriteLine(\"Not found!\");\n}\n```\n\n### 练习 41.1-6 使用子程序合并文件\n\n执行以下操作：\n\
  \ni) 编写一个名为 `readContent` 的子程序，接受文件名并返回其内容。\nii) 编写一个名为 `writeContent` 的子程序，接受文件名和一个字符串，并将该字符串写入文件。\n\
  iii) 使用上述子程序，编写一个 C# 程序，提示用户输入两个文件名，然后将第一个文件的内容复制到第二个文件中。假设用户输入的是有效文件名。\n\n### 解决方案\n\
  \n尽管这个练习看起来非常简单，但有必要强调 `readContent()` 方法的几点。检查下面的 `readContent()` 方法并尝试找到它包含的错误。该错误是一个逻辑错误，而不是语法错误。该方法可以在没有任何语法错误的情况下成功执行。\n\
  \n```csharp\nstring readContent(string filename) {\n    StreamReader fin = File.OpenText(filename);\n\
  \    return fin.ReadToEnd();\n    fin.Close();\n}\n```\n\n发生的情况是，当执行 `return` 语句时，C#\
  \ 会忽略方法的其余部分，这意味着文件不会关闭。想象在程序多次调用这个特定方法，你最终会有许多打开的文件。良好的做法是将 `return` 语句放在方法的末尾，如下所示。\n\
  \n```csharp\nstring readContent(string filename) {\n    StreamReader fin = File.OpenText(filename);\n\
  \    string contents = fin.ReadToEnd();\n    fin.Close();\n    return contents;\n\
  }\n\nvoid writeContent(string filename, string contents) {\n    StreamWriter fout\
  \ = File.CreateText(filename);\n    fout.Write(contents);\n    fout.Close();\n}\n\
  \n// 主代码开始\nConsole.Write(\"Enter source filename: \");\nstring source = Console.ReadLine();\n\
  Console.Write(\"Enter destination filename: \");\nstring destination = Console.ReadLine();\n\
  string c = readContent(source);\nwriteContent(destination, c);\n```\n\n### 41.2\
