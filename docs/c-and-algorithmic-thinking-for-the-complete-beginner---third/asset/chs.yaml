  \ / x + (x + 9) / (x - 4);\n    Console.WriteLine(y);\n}\n```\n\n#### 练习 23.3-2\
  \ 寻找 y 的值\n\n设计一个流程图并编写相应的 C# 程序，在以下公式中找到并显示 `y` 的值（如果可能）。\n\n.![Image](img/chapter23-07.png)\n\
  \n##### 解决方案\n\n该公式有两个不同的结果。\n\n► 当 `x` 大于或等于零时，可以按照上一个练习中所示的方法找到 ![Image](img/chapter23-08.png)\
  \ 中 `y` 的值。\n► 然而，对于小于零的 `x`，一个小细节可以节省你几行代码。仔细检查发现，分式 ![Image](img/chapter23-09.png)\
  \ 没有限制，因为 `x` 永远不会是 `+5`；因此分母永远不会为零。这是因为在给定的公式中 `x` 小于零！\n\n流程图所示。\n\n![Image](img/chapter23-10.png)\n\
  \nC# 程序所示。\n\n![](img/my_exercise_header.png) `project_23.3-2`\n\n```csharp\ndouble\
  \ x, y;\nx = Convert.ToDouble(Console.ReadLine());\nif (x >= 0 ) {\n    if (x ==\
  \ 0 || x == 3) {\n        Console.WriteLine(\"Error: Division by zero!\");\n   \
  \ } else {\n        y = (7 + x) / (x - 3) + (3 - x) / x;\n        Console.WriteLine(y);\n\
  \    }\n} else {\n    y = 40 * x / (x - 5) + 3;\n    Console.WriteLine(y);\n}\n\
  ```\n\n#### 练习 23.3-3 求解线性方程 ax + b = 0\n\n设计一个流程图并编写相应的 C# 程序，找到并显示线性方程\n\n`ax\
  \ + b = 0`\n\n的根\n\n##### 解决方案\n\n在方程 `ax + b = 0` 中，系数 `a` 和 `b` 是已知的实数，`x` 代表要找到的未知数。因为\
  \ `x` 的幂是一次，此方程被分类为一次方程，也称为线性方程。\n\n方程的根是使该方程成立的 `x` 值；即等式左侧 `ax + b` 等于零。\n\n在此练习中，用户必须为系数\
  \ `a` 和 `b` 输入值，程序必须找到使 `ax + b` 等于零的 `x` 值。\n\n方程 `ax + b = 0` 在求解 `x` 时，会有以下三种情况：\n\
  \ni) 用户输入系数 `a` 为 `0` 且 `b` 为非零，方程变为 `x = -b / a`。\nii) `a` 和 `b` 均为 `0`，这种情况下结果是未定的。\n\
  iii) 用户输入其他值。\n\n这三种情况所示：\n\n![Image](img/chapter23-11.png)\n\n![Image](img/chapter23-12.png)\n\
  \nC# 程序所示。\n\n![](img/my_exercise_header.png) `project_23.3-3`\n\n```csharp\ndouble\
  \ a, b, x;\nConsole.WriteLine(\"Enter values for a and b: \");\na = Convert.ToDouble(Console.ReadLine());\n\
