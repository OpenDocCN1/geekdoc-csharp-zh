  \ 33.1 引言\n\n由于数组是可以处理的，你在之前的章节中已经学习了。然而，在本章中你将发现如何处理行列，C# 支持的一些方法。\n\n### 33.2\
  \ 逐行处理\n\n逐行处理意味着每一行都被单独处理。假设你有以下多维数组。为了显示行的和，有以下两种方法遍历行。\n\n让我们尝试找到行的和。第一种方法——创建一个辅助数组\n\
  \n在这种方法中，程序处理每一行并创建一个辅助数组。这种方法提供了很大的灵活性，因为你之后可以使用这个数组。所示：\n\n![Image](img/01)\n\n\
  现在，让我们编写相应的代码段。为了方便理解，使用了“从内到外”的方法。假设 `i` 包含了值。辅助数组的结果如下：\n\n```csharp\ns = 0;\n\
  for (j = 0; j <= COLUMNS - 1; j++) {\n    s += b[i, j];\n}\ntotal[i] = s;\n```\n\
  \n这段代码段可以等价于：\n\n```csharp\ntotal[i] = 0;\nfor (j = 0; j <= COLUMNS - 1; j++) {\n\
  \    total[i] += b[i, j];\n}\n```\n\n现在，将此代码段嵌套在遍历所有行的循环循环中，结果如下：\n\n```csharp\n\
  for (i = 0; i <= ROWS - 1; i++) {\n    total[i] = 0;\n    for (j = 0; j <= COLUMNS\
  \ - 1; j++) {\n        total[i] += b[i, j];\n    }\n}\n```\n\n第二种方法——直接查找并处理\n\n\
  这种方法不使用辅助数组；它只计算并处理和。代码段如下：\n\n```csharp\nfor (i = 0; i <= ROWS - 1; i++) {\n  \
  \  total = 0;\n    for (j = 0; j <= COLUMNS - 1; j++) {\n        total += b[i, j];\n\
  \    }\n    process total;\n}\n```\n\n`process total` 是什么？这取决于给定的问题。它可能只是显示和，可能计算每一行的平均值并显示它，或者可能用于计算更复杂的数学表达式。\n\
  \n例如，下面的示例计算并显示了数组 `b` 每一行的平均值。\n\n```csharp\nfor (i = 0; i <= ROWS - 1; i++) {\n\
  \    total = 0;\n    for (j = 0; j <= COLUMNS - 1; j++) {\n        total += b[i,\
  \ j];\n    }\n    average = total / COLUMNS;\n    Console.WriteLine(average);\n\
  }\n```\n\n#### 练习 33.2-1 求平均值\n\n有 20 个学生，每个人都收到了 10 门课程的成绩。编写一个 C# 程序，提示用户输入每个学生所有课程成绩，然后计算并显示每个学生所有大于\
  \ 89 的平均值。\n\n解决方案\n\n\n\n\n既然你已经学习了两种单独处理每一行的方法，让我们把它们都用上吧。\n\n## 第一种方法 – 创建辅助数组\n\
  \n在这种方法中，程序单独处理每一行，并创建一个辅助数组，数组中的每个元素存储一行的平均值。两个所需的数组如所示。\n\n![Image](img/chapter33-03.png)\n\
  \n在创建平均数组后，程序可以找到并显示所有大于 `89` 的平均值。该 C# 程序如下。\n\n```csharp\n![](img/my_exercise_header.png)\
  \ project_33.2-1const int STUDENTS = 20;\nconst int LESSONS = 10;\nint i, j;\nint[,]\
  \ grades = new int[STUDENTS, LESSONS];\nfor (i = 0; i <= STUDENTS - 1; i++) {\n\
  \    Console.WriteLine(\"For student No. \" + (i + 1) + \"...\");\n    for (j =\
  \ 0; j <= LESSONS - 1; j++) {\n        Console.Write(\"enter grade for lesson No.\
  \ \" + (j + 1) + \": \");\n        grades[i, j] = Convert.ToInt32(Console.ReadLine());\n\
  \    }\n}\n//创建平均数组。遍历每一行\ndouble[] average = new double[STUDENTS];\nfor (i = 0;\
  \ i <= STUDENTS - 1; i++) {\n    average[i] = 0;\n    for (j = 0; j <= LESSONS -\
  \ 1; j++) {\n        average[i] += grades[i, j];\n    }\n    average[i] /= LESSONS;\n\
  }\n//显示所有大于 89 的平均值\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    if (average[i] >\
  \ 89) {\n        Console.WriteLine(average[i]);\n    }\n}\n```\n\n## 第二种方法 – 直接找到并显示即可！\n\
  \n这种方法没有使用辅助数组；它只是计算并直接显示所有大于 `89` 的平均值。该 C# 程序如下。\n\n```csharp\n![](img/my_exercise_header.png)\
  \ project_33.2-1bconst int STUDENTS = 20;\nconst int LESSONS = 10;\nint i, j;\n\
  double average;\nint[,] grades = new int[STUDENTS, LESSONS];\nfor (i = 0; i <= STUDENTS\
  \ - 1; i++) {\n    Console.WriteLine(\"For student No. \" + (i + 1) + \"...\");\n\
  \    for (j = 0; j <= LESSONS - 1; j++) {\n        Console.Write(\"enter grade for\
  \ lesson No. \" + (j + 1) + \": \");\n        grades[i, j] = Convert.ToInt32(Console.ReadLine());\n\
  \    }\n}\n//计算每一行的平均值并直接显示大于 89 的值\nfor (i = 0; i <= STUDENTS - 1; i++) {\n   \
  \ average = 0;\n    for (j = 0; j <= LESSONS - 1; j++) {\n        average += grades[i,\
  \ j];\n    }\n    average /= LESSONS;\n    if (average > 89) {\n        Console.WriteLine(average);\n\
  \    }\n}\n```\n\n### 33.3 单独处理每一列\n\n单独处理每一列意味着每一列都被分别处理，并且每列的结果（可以是和、平均值等）可以被单独用于后续处理。假设你有下面这个\
  \ 4 × 5 的数组。\n\n![Image](img/chapter33-04.png)\n\n和之前一样，让我们尝试单独找到每一列的和。同样，你有两种方法可以使用。这两种方法都通过遍历列。\n\
  \n### 第一种方法 – 创建辅助数组\n\n在这种方法中，程序单独处理每一列，并创建一个辅助数组，数组中的每个元素存储一列的和。这种方法赋予了你很大的灵活性，因为你可以在程序的后续部分使用这个新数组进行进一步处理。底部是辅助数组\
  \ `total`。\n\n![Image](img/chapter33-05.png)\n\n现在，让我们编写相应的代码段。为了更容易理解这个过程，再次使用了“从内层到外”的方法。以下代码段计算第一列（列索引\
  \ `0`）的和，并将结果存储在辅助数组 `total` 中位置 `0` 的元素中。假设变量 `j` 的值为 `0`。\n\n```csharp\ns = 0;\n\
  for (i = 0; i <= ROWS - 1; i++) {\n    s += b[i, j];\n}\ntotal[j] = s;\n```\n\n\
  这个程序可以等价地写：\n\n```csharp\ntotal[j] = 0;\nfor (i = 0; i <= ROWS - 1; i++) {\n   \
  \ total[j] += b[i, j];\n}\n```\n\n现在，将此代码段嵌套在一个遍历所有列的 `for` 循环中结果如下。\n\n```csharp\n\
  for (j = 0; j <= COLUMNS - 1; j++) {\n    total[j] = 0;\n    for (i = 0; i <= ROWS\
  \ - 1; i++) {\n        total[j] += b[i, j];\n    }\n}\n```\n\n### 第二种方法 – 直接找到并处理即可。\n\
  \n这种方法没有使用辅助数组；它只是计算并直接处理和。代码段如下。\n\n```csharp\nfor (j = 0; j <= COLUMNS - 1; j++)\
  \ {\n    total = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n        total += b[i,\
  \ j];\n    }\n    process total;\n}\n```\n\n相应地，以下代码段计算并显示每一列的平均值。\n\n```csharp\n\
  for (j = 0; j <= COLUMNS - 1; j++) {\n    total = 0;\n    for (i = 0; i <= ROWS\
  \ - 1; i++) {\n        total += b[i, j];\n    }\n    Console.WriteLine(total / ROWS);\n\
  }\n```\n\n#### 练习 33.3-1 寻找平均值\n\n有 10 名学生，每个人都收到了五门课程的成绩。编写一个 C# 程序，提示用户输入每个学生所有课程的成绩，然后计算并显示所有大于\
  \ 89 的平均值。\n\n解决方案\n\n既然你已经学习了两种单独处理每一行的方法，让我们把它们都用上吧。\n\n## 第一种方法 – 创建辅助数组\n\n\
  在这种方法中，程序单独处理每一行，并创建一个辅助数组，数组中的每个元素存储一行的平均值。两个所需的数组如所示。\n\n![Image](img/chapter33-03.png)\n\
  \n在创建平均数组后，程序可以找到并显示所有大于 `89` 的平均值。该 C# 程序如下。\n\n```csharp\n![](img/my_exercise_header.png)\
