  b) 一个名为 `Number` 的公共属性。它用于以整数格式获取和设置 `_number` 的值。当数字无法被识别时，setter 抛出错误。\nc) 一个名为\
  \ `Roman` 的公共属性。它用于以罗马数字格式获取和设置 `_number` 的值。当罗马数字无法被识别时，setter 抛出错误。\nii) 使用上述类，编写一个\
  \ C# 程序，显示对应于值 3 的罗马数字以及对应于罗马数字 \"V\" 的数字。\n\n### 解决方案\n\n属性 `Number` 的 getter 和\
  \ setter 非常简单，因此无需解释。然而，属性 `Roman` 的 getter 和 setter 需要一些解释。\n\n属性 `Roman` 的 getter\
  \ 可以写写如下：\n\n```csharp\n//Define the getter\nget {\n    if (_number == 1) {\n  \
