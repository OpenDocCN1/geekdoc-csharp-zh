  \ C# 程序。\n\n![Image](img/chapter28-17.png)\n\n# 第 29 章\n\n循环控制结构的技巧与窍门\n\n### 29.1\
  \ 引言\n\n本章旨在向你介绍一些可以帮助你编写“更好”代码的实用技巧和窍门。在设计自己的算法甚至 C# 程序时，你应该始终记住这些技巧。\n\n这些技巧可以帮助你提高代码的可读性，帮助你在解决每个给定的问题时选择使用哪种循环控制结构，并帮助使代码更短甚至运行更快。当然，没有单一完美的方法，因为在某些情况下使用特定的技巧可能有帮助，但在另一些情况下相同的技巧可能会产生完全相反的结果。大多数时候，代码优化取决于编程经验。\n\
  \n![](img/remember.jpg)较小的算法并不总是解决给定问题的最佳方案。为了解决特定问题，你可能会编写一个简洁的算法，但遗憾的是，它会被证明消耗大量的\
  \ CPU 时间和/或大部分主内存（RAM）。相反，你可以使用另一个算法解决同一个问题，该算法看起来更长，但计算结果更快且/或占用更少的 RAM。\n\n###\
  \ 29.2 选择循环控制结构\n\n下图可以帮助你根据迭代次数，为每个给定的问题选择最合适的循环控制结构。\n\n![Image](img/chapter29-01.png)\n\
  \n![](img/notice.jpg)此图推荐的是最佳选项，而非唯一选项。例如，当迭代次数已知时，使用预测试或后测试循环结构并不是错误的。不过，提议的 `for`\
  \ 循环会更方便。\n\n### 29.3 “终极”规则\n\n在使用预测试或后测试循环结构时，经常困扰程序员的一个问题是：如何确定哪些语句应该写在循环控制结构的内部，哪些应该写在外部，以及以什么顺序编写。\n\
  \n有一个简单而强大的规则——“终极”规则！一旦你遵循它，产生逻辑错误的可能性将降为零！\n\n“终极”规则规定：\n\n- 参与循环布尔表达式的变量或变量必须在进入循环之前初始化。\n\
  - 参与循环布尔表达式的变量或变量的值必须在循环内部进行更新（更改）。具体来说，执行此更新/更改的语句必须是循环的最后语句之一。\n\n例如，如果变量 `x`\
  \ 是参与循环布尔表达式的变量，那么预测试循环结构的形式如下：\n\n```csharp\nInitialize x\nwhile ( Boolean_Expression(x)\
  \ ) {\n    一条语句或语句块\n    Update/alter x\n}\n```\n\n并且后测试循环结构的形式如下：\n\n```csharp\n\
  Initialize x\ndo {\n    一条语句或语句块\n    Update/alter x\n} while ( Boolean_Expression(x)\
  \ );\n```\n\n其中：\n\n- `Initialize x` 是任何一个给变量 `x` 分配初始值的语句。它可以是一个输入语句（如 `Console.ReadLine()`），也可以是使用赋值运算符（`=`）的赋值语句。但在后测试循环结构中，此语句有时可能是多余的，可以省略，因为\
  \ `x` 的初始化可以直接在循环内部发生。\n- `Boolean_Expression(x)` 可以是从简单到复杂的任何依赖于变量 `x` 的布尔表达式。\n\
  - `Update/alter x` 是任何更改 `x` 值的语句，例如另一个输入语句、使用赋值运算符（`=`）的赋值语句，甚至是复合赋值运算符。重要重要的是，该语句必须置于循环布尔表达式求值点之前。这意味着它应该是循环内部的最后语句之一。\n\
  \n以下是一些使用“终极”规则的示例。\n\n**示例 1**\n\n```csharp\na = Convert.ToInt32(Console.ReadLine());\
  \ // 初始化 a\nwhile (a > 0) { // 取决于 a\n    Console.WriteLine(a);\n    a = a - 1;\
  \ // 更新 a\n}\n```\n\n**示例 2**\n\n```csharp\na = Convert.ToInt32(Console.ReadLine());\
  \ // 初始化 a\nb = Convert.ToInt32(Console.ReadLine());\nwhile (a > b) { // 取决于 a 和\
  \ b\n    Console.WriteLine(a + \" \" + b);\n    a = Convert.ToInt32(Console.ReadLine());\
  \ // 更新 a\n}\n```\n\n**示例 3**\n\n```csharp\ns = 0; // 初始化 s\ndo {\n    y = Convert.ToInt32(Console.ReadLine());\n\
  \    s = s + y; // 更新 s\n} while (s < 1000); // 取决于 s\n```\n\n**示例 4**\n\n```csharp\n\
  y = 0; // 初始化 y\ndo {\n    y = Convert.ToInt32(Console.ReadLine());\n} while (y\
  \ < 0); // 取决于 y\n```\n在此示例中，循环外的 y 初始化是多余的，可以像所示那样省略：\n\n```csharp\ndo {\n    y\
  \ = Convert.ToInt32(Console.ReadLine());\n} while (y < 0);\n```\n\n**示例 5**\n\n\
  ```csharp\nodd = 0; // 初始化 odd\neven = 0; // 初始化 even\nwhile (odd + even < 5) {\
  \ // 取决于 odd 和 even\n    x = Convert.ToInt32(Console.ReadLine());\n    if (x % 2\
  \ == 0) {\n        even++; // 更新 even\n    } else {\n        odd++; // 更新 odd\n\
  \    }\n}\n```\n\n现在，你将意识到为什么应该遵循“终极”规则了！让我们来看以下练习：\n\n编写一个代码片段，让用户重复输入，直到总共输入三个正数。\n\
  \n这个练习被布置给学生，一个学生给出了以下代码片段作为答案\n\n```csharp\nint positivesCount;\ndouble x;\npositivesCount\
  \ = 0;\nx = Convert.ToDouble(Console.ReadLine());\nwhile (positivesCount != 3) {\n\
  \    if (x > 0) {\n        positivesCount += 1;\n    }\n    x = Convert.ToDouble(Console.ReadLine());\n\
  }\nConsole.WriteLine(\"Three Positives provided!\");\n```\n\n下面的追踪表可以帮助你确定问题所在。假设用户想要输入值\
  \ 5、−10、−2、4 和 20。\n\n| 步骤 | 语句 | 备注 | positivesCount | x |\n| --- | --- | --- |\
  \ --- | --- |\n\n\n\n\n\n| 1 | `positivesCount = 0` | | 0 | ? |\n| 2 | `x = Convert.ToDouble(…)`\
  \ | | 0 | 5.0 |\n| 3 | `while (positivesCount != 3)` | 结果为 true |\n| 4 | `if (x\
  \ > 0)` | 结果为 true |\n| 5 | `positivesCount += 1` | | 1 | 5.0 |\n| 6 | `x = Convert.ToDouble(…)`\
  \ | | 1 | −10.0 |\n| 7 | `while (positivesCount != 3)` | 结果为 true |\n| 8 | `if (x\
  \ > 0)` | 结果为 false |\n| 9 | `x = Convert.ToDouble(…)` | | 1 | −2.0 |\n| 10 | `while\
  \ (positivesCount != 3)` | 结果为 true |\n| 11 | `if (x > 0)` | 结果为 false |\n| 12 |\
  \ `x = Convert.ToDouble(…)` | | 1 | 4.0 |\n| 13 | `while (positivesCount != 3)`\
  \ | 结果为 true |\n| 14 | `if (x > 0)` | 结果为 true |\n| 15 | `positivesCount += 1` |\
  \ | 2 | 4.0 |\n| 16 | `x = Convert.ToDouble(…)` | | 2 | 20.0 |\n| 17 | `while (positivesCount\
  \ != 3)` | 结果为 true |\n| 18 | `if (x > 0)` | 结果为 true |\n| 19 | `positivesCount\
  \ += 1` | | 3 | 20.0 |\n| 20 | `x = Convert.ToDouble(…)` | | 3 | ??? |\n\n这里有一个逻辑错误！在第\
  \ 20 步，尽管用户提供的正数总数已经是三个，且你期望执行会结束，但遗憾的是用户仍然被要求输入额外的数字！但是，你需要的是一个让用户输入三个正数而不是四个代码片段，对吧？\n\
  \n这就是为什么你应该始终按照规程办事！让我们这个代码片段应该如何编写。\n\n由于 `while` 循环的布尔表达式依赖于变量 `positivesCount`，因此该变量必须在循环外部初始化。该变量也必须在循环内部更新/修改。执行此更新/修改的语句必须是循环内的最后一条语句，如下代码片段（通用形式）所示。\n\
  \n```cpp\npositivesCount = 0;            // positivesCount 的初始化\nwhile (positivesCount\
  \ != 3) { // 这依赖于 positivesCount\n    一条语句或语句块\n    if (x > 0) {\n        positivesCount\
  \ += 1;   // positivesCount 的更新/修改\n    }\n}\n```\n\n现在你可以添加任何必要的语句来完成代码。你只需要添加的语句是让用户输入数字的语句（必须在循环内完成）以及显示最后消息的语句（必须在循环完成所有迭代后完成）。因此，最终的代码片段变为：\n\
  \n```cpp\nint positivesCount;\ndouble x;\npositivesCount = 0;\nwhile (positivesCount\
  \ != 3) {\n    x = Convert.ToDouble(Console.ReadLine());\n    if (x > 0) {\n   \
  \     positivesCount += 1;\n    }\n}\nConsole.WriteLine(\"Three Positives provided!\"\
  );\n```\n\n### 29.4 跳出循环\n\n循环可能会消耗过多的 CPU 时间，因此在使用它们时必须非常小心。有时，你需要在循环完成所有迭代之前跳出或结束循环，通常是在满足特定条件时。\n\
  \n假设有一个隐藏密码，你通过某种方式知道它是三个字符，且仅包含数字。以下 `for` 循环执行了 900 次迭代，试图通过暴力攻击找到该隐藏密码。\n\n```cpp\n\
  found = false;\nfor (i = 100; i <= 999; i++) {\n    if (i == hiddenPassword) {\n\
  \        password = i;\n        found = true;\n    }\n}\nif (found == true) {\n\
  \    Console.WriteLine(\"Hidden password is: \" + password);\n}\n```\n\n![](img/notice.jpg)\
  \ 暴力攻击是获取任何密码保护内容的的最简单方法。攻击者尝试字母、数字和符号的组合，希望最终能猜对。\n\n现在，假设隐藏密码是 `123`。正如你所知道的，`for`\
  \ 循环按指定的次数迭代，在这种情况下，它不在乎是否找到了隐藏密码。尽管密码在第 `24` 次迭代中就被找到了，但遗憾的是，循环继续迭代直到变量 `i` 达到值\
  \ `999`，从而浪费了 CPU 时间。\n\n有人可能会认为 800 – 900 次迭代并不什么，他们可能是的。然而，在大规模数据处理中，每一次迭代都关重要。因此，在使用循环控制结构时要非常小心，特别是那些迭代次数过多的结构。如果隐藏密码是十位的呢？这意味着\
  \ `for` 循环必须执行 9,000,000,000 次迭代！\n\n有两种方法可以帮助你让程序运行更快。这两种方法的核心思想都是：在满足特定条件时跳出循环。\n\
  \n#### 方法一：使用 `break` 语句\n\n你可以通过 `break` 语句在循环实际完成所有迭代之前跳出。查看以下程序。\n\n```cpp\n\
  found = false;\nfor (i = 100; i <= 999; i++) {\n    if (i == hiddenPassword) {\n\
  \        password = i;\n        found = true;\n        break;\n    }\n}\n```\n\n\
  #### 方法二：使用标志位\n\n`break` 语句并不是在所有语言中都存在；而且由于本书的意图是教授“算法思维”，让我们来看另一种方法。在下面的 C# 程序中，当找到隐藏密码时，执行流会退出循环。\n\
  \n```cpp\nfound = false;\ni = 100;\nwhile (found == false && i <= 999) {\n    if\
  \ (i == hiddenPassword) {\n        password = i;\n        found = true;\n    }\n\
  \    i++;\n}\n```\n\n### 29.5 优化你的循环\n\n正如，循环可能会消耗过多的 CPU 时间，因此你必须非常小心并谨慎使用。虽然大量的迭代有时是不可避免的，但你总有方法让循环运行得更好。\n\
  \n下一个代码片段计算 1, 2, 3, 4, 5, … 10000 之和。\n\n```cpp\ns = 0;\ni = 1;\ndo {\n    countOfNumbers\
  \ = 10000;\n    s = s + i;\n    i++;\n} while (i <= countOfNumbers);\nConsole.WriteLine(s);\n\
  ```\n\n在使用循环时（特别是执行多次迭代的循环时），你应该始终记住：避免在循环内部放置对该循环没有用途的语句。在上例中，`countOfNumbers =\
  \ 10000` 就是这样一条语句。遗憾的是，只要它存在循环内部，计算机就会无故执行 10000 次，这当然会影响计算机的性能。\n\n为了解决这个问题，你只需将该语句移动到循环外部，如下：\n\
  \n```cpp\ncountOfNumbers = 10000;\ns = 0;\ni = 1;\ndo {\n    s = s + i;\n    i++;\n\
  } while (i <= countOfNumbers);\nConsole.WriteLine(s);\n```\n\n#### 练习 29.5-1 优化循环\n\
  \n以下代码片段计算数字 1, 2, 3, 4, … 10000 的平均值。尝试将尽可能多的语句移到循环外部，提高程序的效率。\n\n```cpp\ns = 0;\n\
  for (i = 1; i <= 10000; i++) {\n    s = s + i;\n    average = s / 10000;\n}\nConsole.WriteLine(average);\n\
  ```\n\n解决方案\n\n\n\n\n\n初级程序员在计算平均值时经常犯的一个非常常见的错误，是将将总和除以数字个数的语句（此处为 `average = s\
  \ / 10000`）放在循环内部。想一想！假设你想计算自己在学校的平均成绩。你的第一步是计算你所修全部 10 门课程的成绩总和。然后，当所有成绩都加完后，你将该总和除以\
  \ `10`。这意味着你执行了 10 次加法只执行了一次除法。\n\n![](img/notice.jpg)计算平均值是一个两步骤的过程。\n\n因此，在循环内部计算平均值是没有意义的。你可以将此语句移动到循环外部并紧随之后，让循环仅用于累加数字如下：\n\
  \n```csharp\ns = 0;\nfor (i = 1; i <= 10000; i++) {s = s + i;}\naverage = s / 10000;\n\
  Console.WriteLine(average);\n```\n\n## 练习 29.5-2 提取循环\n\n下一个公式\n\n![Image](img/chapter29-02.png)\n\
  \n是通过以下代码段解决的，其中 `N` 由用户提供。\n\n```csharp\nint n, i, j, denom;\ndouble s;\nConsole.Write(\"\
  Enter N: \");\nn = Convert.ToInt32(Console.ReadLine());\ns = 0;\nfor (i = 1; i <=\
  \ n; i++) {\n    denom = 0;\n    for (j = 1; j <= n; j++) {\n        denom += Math.Pow(j,\
  \ j);\n    }\n    s += i / (double)denom;\n}\nConsole.WriteLine(s);\n```\n\n尝试将尽可能多的语句移到循环外部，以提高代码效率。\n\
  \n### 答案\n\n从公式可以看出，分母对于所有分数都是相同的。因此，对每个分数反复计算它是没有意义的。你可以只计算一次分母并多次使用结果，如下：\n\n\
  ```csharp\nint n, i, j, denom;\ndouble s;\nConsole.Write(\"Enter N: \");\nn = Convert.ToInt32(Console.ReadLine());\n\
  denom = 0;\nfor (j = 1; j <= n; j++) {\n    denom += Math.Pow(j, j);\n}\ns = 0;\n\
  for (i = 1; i <= n; i++) {\n    s += i / (double)denom;\n}\nConsole.WriteLine(s);\n\
  ```\n\n## 29.6 无限循环以及如何停止它们\n\n所有的 `while` 循环内部必须包含某些内容，最终能引导执行流退出循环。但错误仍然会发生！例如，下面的代码段包含一个无限循环。遗憾的是，程序员忘记在循环内部增加变量\
  \ `i`；因此，变量 `i` 永远无法达到 `10` 的值。\n\n```csharp\ni = 1;\nwhile (i != 10) {Console.WriteLine(\"\
  Hello there!\");}\n```\n\n![](img/notice.jpg)如果循环无法停止迭代，被称为无限循环或死循环。\n\n程序员可能犯的另一个错误类似于下面：\n\
  \n```csharp\ni = 1;\nwhile (i != 10) {Console.WriteLine(\"Hello there!\");i += 2;}\n\
  ```\n\n尽管这段代码段确实包含一个在循环内增加变量 `i` 的语句（`i += 2`），但遗憾的是，执行流永远不会退出循环，因为值 `10` 永远没有赋值给变量\
  \ `i`。\n\n无限循环会永远迭代下去，停止它迭代的唯一方法是使用魔法力量！例如，当 Windows 操作系统中的应用程序“卡死”（可能是因为执行流进入了无限循环），用户必须使用组合键\
  \ `ALT+CTRL+DEL` 来强制结束应用程序。\n\n在 Visual Studio Community 或 Visual Studio Code 中，当你不小心编写并执行无限循环时，可以简单地点击工具栏上的“停止调试”\
  \ ![Image](img/vs_stop_button.png) 或“停止” ![Image](img/vs_code_stop_button.png) 图标，执行就会停止。\n\
  \n![](img/notice.jpg)在 Visual Studio Code 中，强制结束应用程序的另一种方法是在终端窗口中使用组合键 `CTRL+C`。\n\
  \n## 29.7 “从内层向外”方法\n\n“从内向外”是本书提出的一种方法，旨在帮助你从内而外地学习“算法思维”。该方法首先处理并设计内部（嵌套）控制结构，然后随着算法（或程序）的发展，不断添加更多的控制结构，并将之前的结构嵌套其中。这种方法可以用于大型且复杂的控制结构，因为它帮助你设计无错误的流程图甚至是\
  \ C# 程序。本书在任何似乎需要的地方、任何时候都会使用这种方法。\n\n让我们尝试下面的例子。\n\n编写一个 C# 程序，显示如下所示的乘法表。\n\n\
  ![Image](img/chapter29-03.png)\n\n根据“从内向外”方法，你从编写内部控制结构开始，然后当一切都通过测试且运行良好后，你就可以添加外层的控制结构。\n\
  \n所以，让我们尝试只显示乘法表的第一行。如果你检查这一行，会发现在每次乘法运算中，乘数始终是 `1`。我们将乘数考虑为值为 `1` 的变量 `i`。只显示乘法表第一行的循环控制结构如下：\n\
  \n```csharp\nfor (j = 1; j <= 10; j++) {\n    Console.Write(i + \"x\" + j + \"=\"\
  \ + i * j + \"\\t\");\n}\n```\n\n如果你执行这段代码段，结果是\n\n![Image](img/chapter29-04.png)\n\
  \n![](img/remember.jpg)特殊字符序列 `\\t` 在每次迭代后“显示”制表符。这确保了所有内容对齐。\n\n内部（嵌套）循环控制结构已经就绪。你现在需要一种执行该控制结构九的方法，但每次变量\
  \ `i` 必须包含一个不同的值，从 `1` 到 `9`。这可以通过如下实现：\n\n```csharp\nfor (i = 1; i <= 9; i++) {\n\
  \    // 代码段 1：显示乘法表的单行\n    Console.WriteLine();\n}\n```\n\n![](img/notice.jpg)`Console.WriteLine()`\
  \ 语句用于在行之间“显示”换行。\n\n将代码段 1 嵌入主代码后，最终的 C# 程序变为\n\n```csharp\nint i, j;\nfor (i =\
  \ 1; i <= 9; i++) {\n    for (j = 1; j <= 10; j++) {\n        Console.Write(i +\
  \ \"x\" + j + \"=\" + i * j + \"\\t\");\n    }\n    Console.WriteLine();\n}\n```\n\
  \n## 29.8 复习习题：对错判断\n\n判断以下陈述的对错。\n\n\n\n\n\n1) 当迭代次数未知时，你可以使用确定循环。\n2) 当迭代次数已知时，你不能使用后测试循环结构。\n\
  3) 根据“终极”规则（Ultimate rule），在预测试循环结构中，参与循环布尔表达式的变量的初始化必须在循环内部完成。\n4) 根据“终极”规则，在预测试循环结构中，参与循环布尔表达式的变量的更新/修改语句必须是循环内的最后一条语句。\n\
