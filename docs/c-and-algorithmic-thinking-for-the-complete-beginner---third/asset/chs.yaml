  \ `HH` 是随机选择的小时，`NN` 是用户的姓名。请两次完成此练习，一次使用嵌套决策结构，另一次使用多分支决策结构。\n\n7)编写一个 C# 程序，提示用户输入三角形三边的长度，然后判断用户提供的数字是否可以作为三角形三条边的长度。如果长度无效，必须显示相应的消息；否则，程序必须进一步判断该三角形是否是\
  \ a)等边三角形\n\n提示：在等边三角形中，所有的边都相等。\n\nb)直角三角形（或直角三角形）\n\n提示：使用勾股定理。\n\nc)非特殊三角形\n\n\
  提示：在任何三角形中，每边的长度都小于另外两边长度之和。\n\n8)在自动取款机（ATM）内部存有 $10、$5 和 $1 的钞票。编写一个 C# 程序来模拟这台\
  \ ATM 的工作方式。开始，机器提示用户输入四位数 PIN，然后检查 PIN 的有效性（假设“1234”为有效 PIN）。如果用户提供的 PIN 正确，程序必须提示用户输入他们想要提取的金额（整数），最后显示\
  \ ATM 必须提供的最少钞票数量。例如，如果用户输入的金额为 $36，程序必须显示“3 张 $10 钞票，1 张 $5 钞票和 1 张 $1 钞票”。此外，如果用户输入了错误的\
  \ PIN，机器将允许他们重试两次。如果用户三次都输入了错误的 PIN，则必须显示消息“PIN 已锁定”并结束程序。假设用户输入的金额是有效的。\n\n9)编写一个\
  \ C# 程序，提示用户输入两个值，一个温度，一个风速。如果温度高于 75 华氏度，则该天气被认为是炎热，否则为寒冷。如果风速超过 12 英里小时，则该天气被认为是有风，否则无风。程序必须根据用户提供的值显示单一消息。例如，如果用户输入的温度为\
  \ 60，风速为 10，程序必须显示“今天天气寒冷且无风”。假设用户输入的值有效。\n\n# 第 21 章：更多关于决策控制结构的流程图\n\n### 21.1\
  \ 引言\n\n通过学习前面的章节，你已经熟悉了所有的决策控制结构。由于流程图是学习“算法思维”并帮助你更好地理解特定控制结构的理想方式，本章专门用于教你如何将\
  \ C# 程序转换为流程图，或将流程图转换为 C# 程序。\n\n### 21.2 将 C# 程序转换为流程图\n\n要将 C# 程序转换为相应的流程图，你需要回忆所有的决策控制结构及其对应的流程图片段。它们在这里已汇总完毕。\n\
