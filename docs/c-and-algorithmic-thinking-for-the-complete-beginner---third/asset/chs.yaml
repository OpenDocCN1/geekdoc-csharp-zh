  \ (`&&`) 运算符的结果为真。如果你仔细观察，发现右侧布尔表达式（`b != 2`）的结果为假。因此，你不需要浪费时间去计算左侧布尔表达式的结果。最终结果确定为假。\n\
  \nii)当至少有一个布尔表达式为真时，`OR` (`||`) 运算符的结果为真。如果你仔细观察，发现右侧布尔表达式（`a >= 5`）的结果实际上为真。所以，不要费精力去计算左侧布尔表达式的结果。最终结果确定为真。\n\
  \n### 15.5 将布尔表达式的结果赋值给变量\n\n鉴于布尔表达式实际上会返回一个值（true 或 false），这个值可以直接赋值给变量。例如，语句：\n\
  \n```csharp\na = x > y;\n```\n\n该语句将 `true` 或 `false` 的值赋值给布尔变量 `a`。它可以被读为：“如果变量\
  \ `x` 的内容大于变量 `y` 的内容，则将值 `true` 赋值给变量 `a`；否则，将值 `false` 赋值给变量 `a`”。下一个示例将在屏幕上显示值\
  \ `true`。\n\n![](img/my_exercise_header.png) project_15.5 \n```csharp\nint x, y;\n\
  bool a;\nx = 8;\ny = 5;\na = x > y;\nConsole.WriteLine(a);\n```\n\n### 15.6 逻辑运算符的优先级顺序是什么？\n\
  \n一个复杂的布尔表达式可能会使用多个逻辑运算符，如下所示表达式：\n\n```csharp\nx > y || x == 5 && x <= z || !(z\
  \ == 1)\n```\n\n因此，一个合理的问题是：“哪个逻辑操作首先执行？”\n\nC# 中的逻辑运算符遵循适用于大多数编程语言的相同优先级规则。优先级顺序为：首先执行逻辑非\
  \ (`!`)，接着执行逻辑与 (`&&`)，最后执行逻辑或 (`||`)。\n\n| 高优先级 ![Image](img/arrow_up.jpg) | 低优先级\
  \ | 逻辑运算符 |\n| :--- | :--- | :--- |\n| | | `!` |\n| | | `&&` |\n| | | | `||` |\n\
  \n表 15-3 逻辑运算符的优先级顺序\n\n![](img/notice.jpg)你可以始终使用括号来改变默认优先级。\n\n#### 练习 15.6-1\
  \ 填充真值表\n\n根据变量 `a`、`b` 和 `c` 的值，在下表中填充“true”或“false”。\n\n| a | b | c | a > 2 ||\
  \ c > b && c > 2 | !(a > 2 || c > b && c > 2) |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 1 | −5 | 7 | | |\n| 10 | 10 | 3 | | |\n| −4 | −2 | −9 | | |\n\n**解法**\n\n\
  为了计算复杂布尔表达式的结果，你可以使用以下图形方法。\n\n对于 `a = 1`、`b = −5`、`c = 7`，最终结果为 `true`，所示。\n\n\
  ![Image](img/chapter15-01.png)\n\n![](img/remember.jpg)与 (`&&`) 操作的优先级更高，在或 (`||`)\
  \ 操作之前执行。\n\n对于 `a = 10`、`b = 10`、`c = 3`，最终结果为 `true`，所示。\n\n![Image](img/chapter15-02.png)\n\
  \n对于 `a = −4`、`b = −2`、`c = −9`，最终结果为 `false`，所示。\n\n![Image](img/chapter15-03.png)\n\
  \n表格第五列的值可以非常容易地出来，因为其列标题中的布尔表达式与第四列中的表达式几乎相同。唯一的区别是表达式前面的逻辑非 (`!`) 运算符。因此，只需对第四列的结果取反即可计算出第五列的值！\n\
  \n最终的真值表所示。\n\n| a | b | c | a > 2 || c > b && c > 2 | !(a > 2 || c > b && c > 2)\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | −5 | 7 | true | false |\n| 10 |\
  \ 10 | 3 | true | false |\n| −4 | −2 | −9 | false | true |\n\n#### 练习 15.6-2 将英语句子转换为布尔表达式\n\
  \n一位主任要求学生根据自己的年龄举手。他想找到符合条件的学生：\n\ni)9 岁到 12 岁之间。\nii)8 岁以下且 11 岁以上。\niii)8 岁、10\
  \ 岁和 12 岁。\niv)6 岁到 8 岁之间，且 10 岁到 12 岁之间。\nv)既不是 10 岁也不是 12 岁。\n\n**解法**\n\n为了组合所需的布尔表达式，使用了变量\
  \ `age`。\n\ni)“9 岁到 12 岁之间”的句子可以用图形方式表示，所示。\n\n![Image](img/chapter15-04.png)\n\n\
  但要注意！在数学中写 `9 ≤ age ≤ 12` 是合法的，但在 C# 中它是 `age >= 9 && age <= 12`。\n\n“9 岁到 12 岁之间”的句子可以用图形方式表示，所示。\n\
  \n![Image](img/chapter15-04.png)\n\n\n\n\n\n否定是反转布尔表达式含义的过程。有两种方法可以用于否定布尔表达式。\n\n\
  ### 第一种方法\n\n这种方法是最简单的。只需在原始布尔表达式前面使用 `NOT` (`!`) 运算符，你的否定后的布尔表达式就准备绪了！例如，如果原始布尔表达式是\n\
  \n```\nx > 5 && y == 3\n```\n\n那么否定后的布尔表达式变为\n\n```\n!(x > 5 && y == 3)\n```\n\n\
  ![](img/notice.jpg)注意，整个表达式必须用括号起来。如果你将表达式写为 `!(x > 5) && y == 3`，那是完全错误的。在这种情况下，`NOT`\
  \ (`!`) 运算符只会否定第一个布尔表达式 `x > 5`。\n\n### 第二种方法\n\n这种方法稍微复杂一点，但并不难学。你只需要根据下表对每个运算符进行否定。\n\
  \n| 原始运算符 | 否定后的运算符 |\n| --- | --- |\n| `==` | `!=` |\n| `!=` | `==` |\n| `>` |\
  \ `<=` |\n| `<` | `>=` |\n| `<=` | `>` |\n| `>=` | `<` |\n| `&&` | `||` |\n| `||`\
  \ | `&&` |\n| `!` | `!` |\n\n![](img/notice.jpg)注意 `NOT` (`!`) 运算符保持不变。\n\n例如，如果原始布尔表达式是\n\
  \n```\nx > 5 && y == 3\n```\n\n那么否定后的布尔表达式变为\n\n```\nx <= 5 || y != 3\n```\n\n然而，有一个小细节需要注意。如果\
  \ `AND` (`&&`) 和 `OR` (`||`) 运算符共同存在于复杂的布尔表达式中，那么否定后的布尔表达式中使用 `OR` (`||`) 运算符的表达式必须用括号起来，以保持初始的优先级。例如，如果原始布尔表达式是\n\
  \n```\nx >= 5 && x <= 10 || y == 3\n```\n\n那么否定后的布尔表达式必须是\n\n```\n(x < 5 || x >\
  \ 10) && y != 3\n```\n\n![](img/notice.jpg)如果你忘记将表达式 `x < 5 || x > 10` 括起来，由于 `AND`\
  \ (`&&`) 运算符的优先级高于 `OR` (`||`) 运算符，表达式 `x > 10 && y != 3` 将被先求，这显然是错误的！\n\n####\
  \ 练习 15.8-1 否定布尔表达式\n\n使用两种方法否定以下布尔表达式。\n\ni) `b != 4`\nii) `a * 3 + 2 > 0`\niii)\
  \ `!(a == 5 && b >= 7)`\niv) `a == true`\nv) `b > 7 && !(x > 4)`\nvi) `a == 4 ||\
  \ b != 2`\n\n### 答案\n\n##### 第一种方法\n\ni) `!(b != 4)`\nii) `!(a * 3 + 2 > 0)`\niii)\
  \ `!(!(a == 5 && b >= 7))`，或者等价于 `a == 5 && b >= 7`\n\n![](img/notice.jpg)两次否定等于肯定。也就是说，连续两个\
  \ `NOT` (`!`) 运算符会相互否定。\n\niv) `!(a == true)`\nv) `!(b > 7 && !(x > 4))`\nvi) `!(a\
  \ == 4 || b != 2)`\n\n##### 第二种方法\n\ni) `b == 4`\nii) `a * 3 + 2 <= 0`\n\n![](img/notice.jpg)注意算术运算符并不是被“否定”的。永远不要用加号\
  \ (`+`) 替换为减号 (`−`) 操作！\n\niii) `! (a != 5 || b < 7)`\n\n![](img/notice.jpg)注意 `NOT`\
  \ (`!`) 运算符保持不变。\n\niv) `a != true`\nv) `b <= 7 || !(x <= 4)`\nvi) `a != 4 && b\
  \ == 2`\n\n### 15.9 复习题：对/错\n\n为每个陈述选择对或错。\n\n1) 布尔表达式是一个始终结果为两个值之一的表达式。\n2) 布尔表达式至少包含一个逻辑运算符。\n\
  3) 在 C# 中，表达式 `x = 5` 测试变量 `x` 是否等于 5。\n4) 下述语句不是有效的 C# 语句：`a = b == c;`\n5) 布尔表达式\
  \ `b < 5` 测试变量 `b` 是否小于或等于 5。\n6) `AND` (`&&`) 运算符也称为逻辑析运算符。\n7) `OR` (`||`) 运算符也称为逻辑补运算符。\n\
  8) 如果两个布尔表达式都为真，那么它们的逻辑与的结果等于它们逻辑取或的结果。\n9) 如果两个布尔表达式的值不同，那么它们的逻辑取或的结果一定为真。\n10)\
  \ 表达式 `c == 3 && d > 7` 被视为复杂的布尔表达式。\n11) 当两个操作数（布尔表达式）都为真时，逻辑运算符 `OR` (`||`) 的结果为真。\n\
  12) 当变量 `x` 包含除 5 以外的任何值时，布尔表达式 `!(x == 5)` 的结果为真。\n13) `NOT` (`!`) 运算符在逻辑运算符中优先级最高。\n\
  14) `OR` (`||`) 运算符在逻辑运算符中优先级最低。\n15) 在布尔表达式 `(x > y || x == 5) && x <= z` 中，`AND`\
  \ (`&&`) 操作在 `OR` (`||`) 操作之前执行。\n16) 在布尔表达式 `a * b + c > 21 || c == b` 中，程序首先测试\
  \ `c` 是否大于 21。\n17) 当老师想要寻找小于 8 岁且大于 11 岁的学生时，对应的的布尔表达式是 `age < 8 && age > 11`。\n\
  18) 布尔表达式 `x < 0 && x > 100` 对于任何 `x` 的值都为假。\n19) 布尔表达式 `x > 0 || x < 100` 对于任何\
  \ `x` 的值都为真。\n20) 布尔表达式 `x > 5` 等于 `!(x < 5)`。\n21) 布尔表达式 `!(x > 5 && y == 5)` 等于\
  \ `!(x > 5)`。\n22) 在莎士比亚的《哈姆雷特》第三幕第一场中，主角说“生存还是毁灭，这是一个问题”。如果你将其写成布尔表达式 `toBe ||\
  \ !toBe`，那么这个“问题”在代码 `toBe = toBe || !toBe;` 的结果为真。\n23) 表达式 `!(x <= 5)` 等于 `x >\
  \ 5`。\n\n### 15.10 复习题：单选题\n\n为每个项目选择正确答案。\n\n1) 下列哪个不是比较运算符？\na) `>=`\nb) `<=`\n\
