  \ 1; i++) {\n    if (t[i] < 36) {\n        Console.WriteLine((i + 1) + \"\\t\");\n\
  \    }\n}\n```\n\n### 练习 34.6-2 有可能下雪吗？\n\n编写一个 C# 程序，让用户输入 1 月 31 天内每天同一小时记录的温度（华氏度）。该\
  \ C# 程序随后必须显示是否存在可能下雪的情况，即是否存在温度低于 36 华氏度（约 2 摄氏度）。\n\n### 解决方案\n\n在此练习中，你不能复制上一个练习使用的数组。以下代码段是错误的。\n\
  \n```csharp\nfor (i = 0; i <= DAYS - 1; i++) {\n    if (t[i] < 36) {\n        Console.WriteLine(\"\
  There was a possibility of snow in January!\");\n    }\n}\n``` 如果 月有多天低于 36 华氏度，该消息就会显示多次——实际上有两种方法。让我们研究一下。\n\
  \n#### 第一种方法：统计低于 36 华氏度的天\n\n在此练习中，你可以使用一个变量来统计温度低于 36 华氏度的天。在检查完所有日期后，可以检查该变量的值。如果不零，意味着至少有一天。\n\
  \n![](img/my_exercise_header.png) project_34.6-2a\n```csharp\nconst int DAYS = 31;\n\
  int i, count;\nint[] t = new int[DAYS];\nfor (i = 0; i <= DAYS - 1; i++) {\n   \
  \ t[i] = Convert.ToInt32(Console.ReadLine());\n}\ncount = 0;\nfor (i = 0; i <= DAYS\
  \ - 1; i++) {\n    if (t[i] < 36) {\n        count++;\n    }\n}\nif (count != 0)\
  \ {\n    Console.WriteLine(\"There was a possibility of snow in January!\");\n}\n\
  ```\n\n#### 第二种方法：使用标志\n\n在此方法中，你不是统计所有低于 36 华氏度的天，而是使用一个布尔变量（标志）。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.6-2b\n```csharp\nconst int DAYS = 31;\nint i;\nbool found;\nint[] t\
  \ = new int[DAYS];\nfor (i = 0; i <= DAYS - 1; i++) {\n    t[i] = Convert.ToInt32(Console.ReadLine());\n\
  }\nfound = false;\nfor (i = 0; i <= DAYS - 1; i++) {\n    if (t[i] < 36) {\n   \
  \     found = true;\n        break;\n    }\n}\nif (found) {\n    Console.WriteLine(\"\
  There was a possibility of snow in January!\");\n}\n```\n\n想象变量 `found` 就像一个真实的标志。初始时，标志未提升（`found\
  \ = false`）。在 `for` 循环中，当发现温度低于 36 华氏度时，标志被提升（将值 `true` 赋值给变量 `found`），并且再也不会被降低。\n\
  \n注意 `break` 语句！一旦发现温度低于 36 华氏度，此后继续检查就没意义了。\n\n如果循环执行了所有迭代且没有发现低于 36 华氏度的温度，变量\
  \ `found` 将包含其初始值（`false`），因为执行流从未进入决策控制结构。\n\n#### 练习 34.6-3 哪些城市可能有下雪？\n\n\n\n\
