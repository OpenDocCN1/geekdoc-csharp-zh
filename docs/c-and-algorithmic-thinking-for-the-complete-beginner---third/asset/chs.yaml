  \ | 两个条件均为假。 |\n| 2000 | 是 | 第二个条件为真。它能被 400 整除 |\n| 2002 | 否 | 两个条件均为假。 |\n| 2004\
  \ | 是 | 第一个条件为真。它能被 4 整除，且不能被 100 整除 |\n| 2024 | 是 | 第一个条件为真。它能被 4 整除，且不能被 100 整除\
