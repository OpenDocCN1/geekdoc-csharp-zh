  \n![Image](img/chapter21-10.png)\n\n## 21.4 将流程图转换为 C# 程序\n\n这种转换并不总是容易的。在某些情况下，流程图的设计者没有遵循特定的规则，因此在将流程图转换为\
  \ C# 程序之前，可能需要对其进行修改。以下是此类情况的一个示例。\n\n![Image](img/chapter21-11.png)\n\n如你所见，此流程图片段包含的决策控制结构与你已经过的任何决策控制结构都不匹配。因此，你只有一个选择，那就是通过添加额外的语句或删除现语句来修改流程图，直到出现已知的决策控制结构为止。以下是一些初始流程图确实需要修改的练习题。\n\
  \n### 练习 21.4-1 编写 C# 程序\n\n编写与以下流程图对应的 C# 程序。\n\n.![Image](img/chapter21-12.png)\n\
  \n### 答案\n\n这非常简单。你必须克服的唯一障碍是真路径和假路径并不完全在正确的位置。你需要使用真路径而不是假路径来将语句包含在单分支决策结构中。\n\n\
  交换这两个路径是可能的，但你还需要对相应的布尔表达式进行取反。以下两个流程图片段是等价的。\n\n![Image](img/chapter21-13.png)\n\
  \n因此，流程图可以修改并看起来像这样。\n\n.![Image](img/chapter21-14.png)\n\n对应的 C# 程序如所示。\n\n```csharp\n\
  double x, y;x = Convert.ToDouble(Console.ReadLine());y = 50;if (x / 2 <= 10) {x\
  \ = x / 3;y = x + 4;}Console.WriteLine(y);\n```\n\n### 练习 21.4-2 编写 C# 程序\n\n编写与以下流程图对应的\
  \ C# 程序。\n\n![Image](img/chapter21-15.png)\n\n### 答案\n\n在这个练习中，一个双分支决策结构嵌套在一个单分支决策结构中。你只需要对布尔表达式\
  \ `x == 100` 进行取反并交换真/假路径即可。C# 程序如所示。\n\n```csharp\ndouble x, y;x = Convert.ToDouble(Console.ReadLine());y\
  \ = 1;if (x != 100) {  //这是一个单分支决策结构 y = Convert.ToDouble(Console.ReadLine());if\
  \ (x < y) {   //这是一个嵌套的双分支决策结构\n\n> x = x - 3;\n\n> y = x + 4;\n\n}else {\n\n> x\
  \ = x / 3 + 5;\n\n> y = x + 20;\n\n}}Console.WriteLine(x + \"  \" + y);\n```\n\n\
  ### 练习 21.4-3 编写 C# 程序\n\n编写与以下流程图对应的 C# 程序。\n\n![Image](img/chapter21-16.png)\n\
  \n### 答案\n\n在这个流程图中，决策控制结构与你学过的任何决策控制结构都不匹配。因此，你必须通过添加额外的语句或删除现有的语句来修改流程图，直到出现已知的决策控制结构为止！\n\
  \n在这个练习中，你必须克服的障碍是评估 `y MOD x ≠ 1` 布尔表达式的决策控制结构。请注意，当执行流遵循假路径时，它会执行语句 `a ← 20`，然后在到达算法结束之前执行语句\
  \ `Write a`。因此，如果你简单地在它的假路径内部添加新语句 `Write a`，就可以保持执行流的完整。以下流程图与初始流程图等价。\n\n![Image](img/chapter21-17.png)\n\
  \n现在，流程图包含了已决策控制结构；即一个双分支决策结构嵌套另一个双分支决策结构中。对应的 C# 程序如下。\n\n```csharp\nint x, y,\
  \ a;x = Convert.ToInt32(Console.ReadLine());y = Convert.ToInt32(Console.ReadLine());if\
  \ (x % y != 1) {if (y % x != 1) {\n\n> Console.WriteLine(\"Invalid\");\n\n}else\
  \ {\n\n> a = 20;\n\n> Console.WriteLine(a);\n\n}}else {a = 10;Console.WriteLine(a);}\n\
  ```\n\n然而，你可以做得更好的事情！如果你对所有布尔表达式进行取反并交换它们的真/假路径，你就可以得到一个多分支决策结构，这在 C# 中比嵌套的决策控制结构更方便。修改后的流程图如所示。\n\
  \n![Image](img/chapter21-18.png)\n\n对应的 C# 程序如下。\n\n```csharp\nint x, y, a;x = Convert.ToInt32(Console.ReadLine());y\
  \ = Convert.ToInt32(Console.ReadLine());if (x % y == 1) {a = 10;Console.WriteLine(a);}else\
  \ if (y % x == 1) {a = 20;Console.WriteLine(a);}else {Console.WriteLine(\"Invalid\"\
  );}\n```\n\n## 21.5 复习练习\n\n完成以下练习题。\n\n1) 设计与以下 C# 程序对应的流程图。`int a;a = Convert.ToInt32(Console.ReadLine());if\
