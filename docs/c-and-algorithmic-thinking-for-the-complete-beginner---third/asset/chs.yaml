  \ (z - 4) * (a - 3) / 7 + 36;\nif (z >= w && a < z) {\n    y = 2 * a;\n}\nelse {\n\
  \    y = 4 * a;\n}\nConsole.WriteLine(y);\n```\n\n##### 解 Solution\n\ni) 对于输入值 5，跟踪表如下。\n\
  \n| 步骤 | 语句 | 注释 | a | z | w | y |\n| --- | --- | --- | --- | --- | --- | --- |\n\
  | 1 | `a = Convert.ToDouble(…)` | 用户输入值 5 | 5.0 | ? | ? | ? |\n| 2 | `z = a * 10`\
  \ | | 5.0 | 50.0 | ? | ? |\n| 3 | `w = (z - 4) * (a - 3) / 7 + 36` | | 5.0 | 50.0\
  \ | 49.142 | ? |\n| 4 | `if (z >= w && a < z)` | 判定结果为 true | | | | |\n| 5 | `y\
  \ = 2 * a` | | 5.0 | 50.0 | 49.142 | 10.0 |\n| 6 | `.WriteLine(y)` | 显示为: 10 | |\
  \ | | |\n\nii) 对于输入值 10，跟踪表如下。\n\n| 步骤 | 语句 | 注释 | a | z | w | y |\n| --- | ---\
  \ | --- | --- | --- | --- | --- |\n| 1 | `a = Convert.ToDouble(…)` | 用户输入值 10 |\
  \ 10.0 | ? | ? | ? |\n| 2 | `z = a * 10` | | 10.0 | 100.0 | ? | ? |\n| 3 | `w =\
  \ (z - 4) * (a - 3) / 7 + 36` | | 10.0 | 100.0 | 132.0 | ? |\n| 4 | `if (z >= w\
  \ && a < z)` | 判定结果为 false | | | | | |\n| 5 | `y = 4 * a` | | 10.0 | 100.0 | 132.0\
  \ | 40.0 |\n| 6 | `.WriteLine(y)` | 显示为: 40 | | | | | |\n\n#### 练习 17.1-3 谁最大？\n\
  \n设计一个流程图并编写相应的 C# 程序，让用户输入两个数字 A 和 B，然后确定并显示这两个数中的较大者。\n\n##### Solution\n\n这个练习可以使用二选一或单一决策结构来解决。所以，让我们都用用吧！\n\
  \n###### 方法一——使用二选一决策结构\n\n这种方法测试数字 B 的值是否大于数字 A。如果是，则数字 B 是最大的；否则，数字 A 是最大的。使用这种方法解决此练习的流程图所示。\n\
  \n![Image](img/chapter17-03.png)\n\n相应的 C# 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_17.1-3\n```csharp\ndouble a, b, maximum;\na = Convert.ToDouble(Console.ReadLine());\n\
  b = Convert.ToDouble(Console.ReadLine());\nif (b > a) {\n    maximum = b;\n}\nelse\
  \ {\n    maximum = a;\n}\nConsole.WriteLine(\"Greatest value: \" + maximum);\n```\n\
  \n![](img/notice.jpg)注意，此练习旨在尝试确定最大值，而不是该值实际上赋值给了哪个变量（赋值给变量 A 还是变量 B）。\n\n######\
  \ 方法二——使用单一决策结构\n\n如下流程图所示，这种方法最初假设数字 A 可能是最大值（这就是为什么它将变量 `a` 的值赋给变量 `maximum`）。然而，如果证明数字\
  \ B 大于数字 A，则更新最大值；变量 `maximum` 被赋一个新值——变量 `b` 的值。因此，无论数字 A 和 B 的值是多少，最后变量 `maximum`\
  \ 将始终包含最大值。\n\n![Image](img/chapter17-04.png)\n\nC# 程序所示如下。\n\n![](img/my_exercise_header.png)\
  \ project_17.1-3\n```csharp\ndouble a, b, maximum;\na = Convert.ToDouble(Console.ReadLine());\n\
  b = Convert.ToDouble(Console.ReadLine());\nif (b > a) {\n    maximum = b;\n}\nelse\
  \ {\n    maximum = a;\n}\n```\n\n\n\n\n\n### 1) 创建一个追踪表，以确定以下 C# 程序在两种不同执行下每一步的变量值。然后，设计相应的流程图。\n\
