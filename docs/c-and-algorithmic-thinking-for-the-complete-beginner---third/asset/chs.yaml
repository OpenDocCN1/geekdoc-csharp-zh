  \ `needle`。假设数组包含数值。\n33) 二分搜索算法的优点和缺点是什么？\n34) 使用二分搜索算法，写出代码片段对数组 `a` 进行搜索以找到值\
  \ `needle`。假设数组包含数值并按升序排序。\n\n# 第七部分：子程序\n\n## 第 35 章：子程序简介\n\n### 35.1 什么是子程序？\n\
  \n在计算机科学中，子程序（subprogram）是一个封装成单元的语句块，用于执行特定的任务。每当需要执行该特定任务时，可以在程序中多次调用子程序。\n\n\
  在 C# 中，内置方法（built-in method）就是此类子程序的示例。以著名的 `Math.Abs()` 方法为例。它由一个名为 `Abs` 的封装成单元的语句块组成，并执行一个特定任务——返回数字的绝对值。\n\
  \n如果你好奇 `Math.Abs()` 方法内部可能存在什么样的语句，这里有一个可能的语句块：\n\n```csharp\nif (number < 0) return\
  \ number * (-1); else return number;\n```\n\n通常来说，子程序分为两种：函数（functions）和过程（procedures）。函数和过程的区别在于函数会返回一个结果，而过程不会。然而，在某些计算机语言中，这种区别可能并不明显。在某些语言中，函数也可以像过程一样运行且不返回结果；而在某些语言中，过程可以返回一个甚至多个结果。\n\
  \n取决于所使用的计算机语言，“函数”和“过程”的术语可能不同。例如，在 Visual Basic 中，它们被称为“functions”和“subprocedures（子过程）”，在\
  \ FORTRAN 中是“functions”和“subroutines（子例）”，而在 C# 中，通常首选术语是“methods（方法）”和“void methods（空方法）”。\n\
  \n### 35.2 什么是过程化编程？\n\n假设你被分配了一个项目来解决你地区的吸毒问题。一种可能的方法（可能证明非常困难甚至无法实现）是尝试自己解决这个问题！\n\
  \n然而，一种更好的方法是将大问题细分为更小的子问题，如预防、治疗和康复，每个子问题都可以进一步细分为更小的子问题，如图 35–1 所示。\n\n图 35–1\
  \ 问题可以被细分为更小的问题。\n\n作为该项目的负责人，你可以租一栋建筑并在其中建立三个部门：预防部门、治疗部门和康复部门，每个部门都可以进一步细分为子部门，即预防部门（包含所有子部门）、治疗部门（包含所有子部门）、康复部门（包含所有子部门）。最后，你聘佣人员（各领域的专家），组建团队并让他们完成工作！\n\
  \n过程化编程正是这样做。它将一个初始问题细分为较小的子问题，每个子问题再进一步细分为更小的子问题。最后，为每个子问题编写一个子程序，主程序调用它们来完成不同的部分工作。\n\
  \n过程化编程具有若干优点：\n- 它允许程序员在需要时重用相同的代码，无需重写或复制。\n- 它相对容易实现。\n- 它帮助程序员更容易地跟踪执行流，简化了调试过程。\n\
  \n一个非常大的程序如果全部在一起，调试和维护可能会非常困难。由于这个原因，通常将其细分为较小的子程序，每个子程序执行一个明确的过程。\n\n### 35.3\
  \ 什么是模块化编程？\n\n在模块化编程中，通用功能的子程序被组合在独立的模块中，每个模块可以有自己的数据集。因此，一个程序可以由多个部分组成，每个部分（模块）可以包含一个或多个较小部分（子程序）。\n\
  \n`Math` 库就是这样一个示例。它包含了通用功能的子程序（数学相关），如 `Abs()`、`Sqrt()`、`Sin()`、`Cos()`、`Tan()`\
  \ 等。\n\n如果你在之前的药物问题示例中使用模块化编程，那么你可以拥有三个独立的建筑——一栋用于预防部门及其所有子部门，另一栋用于治疗部门及其所有子部门，第三栋用于康复部门及其所有子部门（如图\
  \ 35–2 所示）。这三栋建筑可以被视为模块化编程中的三个不同的模块，每个模块都包含通用功能的子程序。\n\n图 35–2 通用功能的子程序可以被组合在独立的模块中。\n\
  \n### 35.4 复习题：判断题\n\n对下列每个陈述判断对或错。\n\n\n\n\n\n1. 子程序是一个被封装成单元的执行特定任务的语句块。\n2. 通常情况下，子程序有两种：函数（functions）和过程（procedures）。\n\
  3. 通常来说，函数和过程的区别在于过程会返回一个结果，而函数不返回。\n4. C# 仅支持过程。\n5. 过程化编程将初始问题细分为更小的子问题。\n6. 过程化编程的一个优点是可以重用相同的代码，而无需重写或复制它。\n\
  7. 过程化编程帮助程序员更容易遵循执行流。\n8. 模块化编程提高了程序的开发速度。\n9. 在模块化编程中，将具有共同功能的子程序被分组到不同的模块中。\n\
  10. 在模块化编程中，每个模块都可以有自己的数据。\n11. 模块化编程使用的结构与结构化编程不同。\n12. 一个程序可以由多个模块组成。\n\n# 第 36\
  \ 章：用户自定义子程序\n\n## 36.1 返回值的子程序\n\n在许多计算机语言中，返回一个值的子程序被称为函数。C# 将它们称为方法（methods），并且方法分为两类。有内置方法，如\
  \ `Math.Abs()`、`Math.Sqrt()`，还有用户自定义方法，即你个人编写并在自己的程序中使用的方法。\n\n返回返回值的 C# 方法的通用形式所示。\n\
  \n```text\nreturn_type name([type1 arg1, type2 arg2, type3 arg3, …]) {\n    Local\
  \ variables declaration section\n    A statement or block of statements\n    return\
  \ value;\n}\n```\n\n其中：\n\n- `return_type` 是方法返回的值的数据类型。\n- `name` 是方法的名称。\n- `arg1`,\
  \ `arg2`, `arg3`, …` 是参数列表（变量、数组等），用于从调用者向方法传递值。参数可以根据需要有任意数量。\n- `type1`, `type2`,\
  \ `type3`, …` 是每个参数的数据类型。每个参数都必须有一个数据类型。\n- `value` 是返回给调用者的值。它可以是一个常量、变量、表达式，甚至是一个数据结构。它的数据类型必须与方法的\
  \ `return_type` 匹配。\n\n![](img/notice.jpg)注意参数是可选的；也就是说，方法可以不包含任何参数。\n\n![](img/notice.jpg)在第\
  \ 5.4 节中学了为变量命名时必须遵守的规则。为子程序命名遵循完全相同的规则！\n\n方法名可以被比作一个盒子（见图 36–1），其中包含一个语句或一个语句块。它接受参数\
  \ `arg1`, `arg2`, `arg3`, …` 作为输入值，并返回 `value` 作为输出值。\n\n![Image](img/chapter36-01.png)\n\
  \n图 36–1 方法可以被比作一个盒子\n\n例如，下一个方法通过参数 `num1` 和 `num2` 两个数字，然后计算它们的和并返回结果。\n\n```csharp\n\
  double getSum(double num1, double num2) {\n    double result;\n    result = num1\
  \ + num2;\n    return result;\n}\n```\n\n当然，这也可以写为：\n\n```csharp\ndouble getSum(double\
  \ num1, double num2) {\n    return num1 + num2;\n}\n```\n\n## 36.2 如何调用方法\n\n每次方法的调用如下：你写下方法的名称，后面跟着一个参数列表（如果需要），要么在一个将方法的返回值赋值给变量的语句中，要么直接写在一个表达式中。\n\
  \n让我们看一些例子。下一个方法通过参数 `num` 接收一个数值，并返回该值三次方的计算。\n\n```csharp\ndouble cube(double\
  \ num) {\n    double result;\n    result = num * num * num;\n    return result;\n\
  }\n```\n\n现在，假设你想计算以下表达式的结果。\n\n![Image](img/chapter36-02.png)\n\n你可以将方法 `cube()`\
  \ 返回的值赋值给变量，如下所示：\n\n```csharp\nx = Convert.ToDouble(Console.ReadLine());\ncb =\
  \ cube(x);        //将返回的值赋值给变量\ny = cb + 1 / x;     //并使用该变量\nConsole.WriteLine(y);\n\
  ```\n\n或者你也可以直接在表达式中调用该方法：\n\n```csharp\nx = Convert.ToDouble(Console.ReadLine());\n\
  y = cube(x) + 1 / x; //在表达式中直接调用方法\nConsole.WriteLine(y);\n```\n\n或者你甚至可以直接在 `Console.WriteLine()`\
  \ 语句中调用方法。\n\n```csharp\nx = Convert.ToDouble(Console.ReadLine());\nConsole.WriteLine(cube(x)\
  \ + 1 / x);  //在 WriteLine()语句中直接调用方法\n```\n\n![](img/notice.jpg)用户自定义方法可以像 C# 的内置方法一样调用。\n\
  \n现在让我们来看另一个例子。下一个 C# 程序定义了方法 `getMessage()`，然后主代码调用了它。返回的值赋值给变量 `a`。\n\n![](img/my_exercise_header.png)\
  \ project_36.2a\n```csharp\n//定义方法\nstring getMessage() {\n    string msg;\n   \
  \ msg = \"Hello Zeus\";\n    return msg;\n}\n//主代码在此开始\nstring a;\nConsole.WriteLine(\"\
  Hi there!\");\na = getMessage();\nConsole.WriteLine(a);\n```\n\n如果你运行这个程序，将显示以下消息。\n\
  \n![Image](img/chapter36-03.png)\n\n![](img/notice.jpg)方法在程序开始运行时不会立即执行。在上一个例子中，实际执行的第一条语句是\
  \ `Console.WriteLine(\"Hi there!\")`。\n\n你可以向方法传递（发送）值，只要方法的括号内至少存在一个参数。在下一个例子中，方法\
  \ `display()` 被调用了三次，但每次通过参数 `color` 传递了不同的值。\n\n![](img/my_exercise_header.png)\
  \ project_36.2b\n```csharp\n//定义方法\nstring display(string color) {\n    return \"\
  There is \" + color + \" in the rainbow\";\n}\n//主代码在此开始\nConsole.WriteLine(display(\"\
  red\"));\nConsole.WriteLine(display(\"yellow\"));\nConsole.WriteLine(display(\"\
  blue\"));\n```\n\n如果你运行这个程序，将显示以下消息。\n\n![Image](img/chapter36-04.png)\n\n在下一个例子中，必须向\
  \ `display()` 传递两个值。\n\n![](img/my_exercise_header.png) project_36.2c\n```csharp\n\
  string display(string color, bool exists) {\n    string neg = \"\";\n    if (!exists)\
  \ {\n        neg = \"n't any\";\n    }\n    return \"There is\" + neg + \"  \" +\
  \ color + \" in the rainbow\";\n}\n//主代码在此开始\nConsole.WriteLine(display(\"red\"\
  , true));\nConsole.WriteLine(display(\"yellow\", true));\nConsole.WriteLine(display(\"\
  black\", false));\n```\n\n![](img/notice.jpg)在 C# 中，你可以将方法放在主代码上方或下方。不过，大多数程序员倾向于将它们放在顶部以便观察。\n\
  \n## 36.3 不返回值的子程序\n\n在计算机科学中，不返回值的子程序可以被称为过程（procedure）、子过程（subprocedure）、子程序（subroutine）、void\
  \ 函数（void function）等。在 C# 中，通常使用的术语是 void 方法（void method）。\n\nC# void 方法的通用形式为：\n\
  \n```text\nvoid name([type1 arg1, type2 arg2, type3 arg3, …]) {\n    Local variables\
  \ declaration section\n    A statement or block of statements\n}\n```\n\n其中：\n\n\
  - `name` 是 void 的名称。\n- `arg1`, `arg2`, `arg3`, …,` 是参数列表（变量、数组等），用于从调用者向 void 方法传递值。参数可以根据需要有任意数量。\n\
  - `type1`, `type2`, `type3`, …` 是每个参数的数据类型。每个参数都必须有一个数据类型。\n\n![](img/notice.jpg)注意参数是可选的；也就是说，void\
  \ 方法可以不包含任何参数。\n\n例如，下一个 void 方法通过参数 `num1` 和 `num2` 接收两个数字，然后计算它们的和最后显示结果。\n\n\
  ```csharp\nvoid displaySum(double num1, double num2) {\n    double result;\n   \
  \ result = num1 + num2;\n    Console.WriteLine(result);\n}\n```\n\n## 36.4 如何调用\
  \ void 方法\n\n你可以通过直接写它的名称来调用 void 方法。下一个例子定义了 void 方法 `displayLine()`，主代码在需要显示水平线时会调用该\
  \ void 方法。\n\n\n\n\n\n![](img/my_exercise_header.png) project_36.4a\n\n```csharp\n\
  // Define the void method\nvoid displayLine() {\n    Console.WriteLine(\"---------------------\"\
  );\n}\n// Main code starts here\nConsole.WriteLine(\"Hello there!\");\ndisplayLine();\n\
  Console.WriteLine(\"How do you do?\");\ndisplayLine();\nConsole.WriteLine(\"What\
  \ is your name?\");\ndisplayLine();\n```\n\n你可以向 `void` 方法传递（发送）值，只要在 `void` 方法的括号内至少存在一个参数。在下一个示例中，`void`\
  \ 方法 `displayLine()` 被调用了三次，但每次通过变长参数传递了不同的值，导致打印出三行长度不同的线。\n\n![](img/my_exercise_header.png)\
  \ project_36.4b\n\n```csharp\nvoid displayLine(int length) {\n    int i;\n    for\
  \ (i = 1; i <= length; i++) {\n        Console.Write(\"-\");\n    }\n    Console.WriteLine();\n\
  }\n// Main code starts here\nConsole.WriteLine(\"Hello there!\");\ndisplayLine(12);\n\
  Console.WriteLine(\"How do you do?\");\ndisplayLine(14);\nConsole.WriteLine(\"What\
  \ is your name?\");\ndisplayLine(18);\n```\n\n![](img/remember.jpg) 因为由于 `void`\
  \ 方法 `displayLine()` 没有返回值，下行代码是错误的。你不能将 `void` 方法赋值给变量，因为没有任何返回值值！\n\n```csharp\n\
  y = display_line(12);\n```\n\n此外，你不能在语句中调用它。下行代码也是错误的。\n\n```csharp\nConsole.WriteLine(\"\
  Hello there!\\n\" + display_line(12));\n```\n\n### 36.5 形式参数与实际参数\n\n每个方法（或 `void`\
  \ 方法）都包含一个称为形式参数列表的参数列表。如前所述，此列表中的参数是可选的；形式参数列表可以包含没有参数、一个参数或多个参数。\n\n当调用子程序（方法或\
  \ `void` 方法）时，可能会将参数列表传递给子程序。该列表被称为实际参数列表。\n\n在下一个示例中，形式参数（变量）`n1` 和 `n2` 构成形式参数列表，而实际参数（变量）`x`\
  \ 和 `y`，以及实际参数（表达式）`x + y` 和 `y / 2` 构成了实际参数列表。\n\n![](img/my_exercise_header.png)\
  \ project_36.5\n\n```csharp\n// Define the method multiply().\n// The two arguments\
  \ n1 and n2 are called formal arguments.\ndouble multiply( double n1, double n2\
  \ ) {\n    double result;\n    result = n1 * n2;\n    return result;\n}\n// Main\
  \ code starts here\ndouble x, y, w;\nx = Convert.ToDouble(Console.ReadLine());\n\
  y = Convert.ToDouble(Console.ReadLine());\n// Call the method multiply().\n// The\
  \ two arguments x and y are called actual arguments.\nw = multiply( x, y );\nConsole.WriteLine(w);\n\
  // Call the method multiply().\n// The two arguments x + y and y / 2 are called\n\
  // actual arguments.\nConsole.WriteLine(multiply( x + 2, y / 2 ));\n``` 注意形式参数和实际参数之间存在一一对应的关系。在第一次调用中，实际参数\
  \ `x` 的值被传递给形式参数 `n1`，实际参数 `y` 的值被传递给形式参数 `n2`。在第二次调用中，实际参数（表达式）`x + 2` 的值被传递给形式参数\
  \ `n1`，实际参数（表达式）`y / 2` 的值被传递给形式参数 `n2`。\n\n### 36.6 方法如何执行\n\n当主代码调用方法时，执行以下步骤：\n\
  - 主代码语句的执行中断。\n- 实际参数列表中的变量或表达式的结果被传递（赋值）给参数列表中对应的参数（变量），执行流跳转到方法定义的地方。\n- 执行方法中的语句。\n\
  - 当执行流到达 `return` 语句时，值从方法返回到主代码，执行流从调用方法的地方继续。\n\n在下一个 C# 程序中，方法 `maximum()` 接收两个参数并返回较大的值。\n\
  \n![](img/my_exercise_header.png) project_36.6\n\n```csharp\ndouble maximum(double\
  \ val1, double val2) {\n    double m;\n    m = val1;\n    if (val2 > m) {\n    \
  \    m = val2;\n    }\n    return m;\n}\n// Main code starts here\ndouble a, b,\
  \ maxim;\na = Convert.ToDouble(Console.ReadLine());\nb = Convert.ToDouble(Console.ReadLine());\n\
  maxim = maximum(a, b);\nConsole.WriteLine(maxim);\n```\n\n当 C# 程序启动时，执行的第一条语句是 `a\
  \ = Convert.ToDouble(Console.ReadLine())`（这被程序的条语句）。下面的跟踪表显示了精确的执行流、值 `a` 和 `b`\
  \ 如何从主代码传递到方法，以及方法如何返回结果。假设用户输入值 3 和 8。\n\n| 步骤 | 主代码语句 | a | b | maxim |\n| ---\
  \ | --- | --- | --- | --- |\n| 1 | `a = Convert.ToDouble(...)` | 3.0 | ? | ? |\n\
  | 2 | `b = Convert.ToDouble(...)` | 3.0 | 8.0 | ? |\n| 3 | `maxim = maximum(a, b)`\
  \ | | | |\n\n当调用方法 `maximum()` 时，主代码语句的执行中断，值 `a` 和 `b` 被传递（如果愿意则赋值）给对应的形式参数（变量）`val1`\
  \ 和 `val2`，执行流跳转到方法定义的地方。然后执行方法中的语句。\n\n| 步骤 | 方法 `maximum()` 语句 | val1 | val2 |\
