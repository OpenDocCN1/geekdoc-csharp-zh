  \ C# 程序，提示用户输入一个非负值，然后使用 Heron 公式计算其平方根，如下。\n\n###### ![Image](img/chapter11-01.png)\n\
  \n其中\n\n- `y` 是你想要寻找平方根的数\n- `x[n]` 是 `y` 的平方根的 n 次迭代值\n\n此外，使用循环控制结构，程序在用户输入任何负值时必须验证数据输入并显示错误消息。\n\
  \n### 解决方案\n\n几乎可以确定你现在可能有点困惑，正在抓腮腮。不要被这些数学东西吓到！你可以尝试通过下面的流程图来理解 Heron 公式！\n\n![Image](img/chapter30-03.png)\n\
  \n还是困惑吗？让我们来看一个例子。让我们尝试寻找 25 的平方根：\n\n\n\n\n\n► 提出一个猜测。假设 `8` 是你的第一个猜测。`8` 的平方是\
  \ `64`。由于 `64` 对于 `25` 来说并不“足够接近”，通过计算该表达式来提出一个新的猜测\n\n![Image](img/chapter30-04.png)\n\
  \n► `5.56` 的平方大约是 `30.91`。由于 `30.91` 对于 `25` 并不“足够接近”，通过计算该表达式来提出一个新的猜测\n\n![Image](img/chapter30-05.png)\n\
  \n► `5.02` 的平方是 `25.2`。如果你认为 `25.2` 与 `25` ““足够接近”，那么你就可以停止整个过程并得出结论：`25` 的近似平方根是\
  \ `5.02`。\n\n![](img/notice.jpg)显然，如果需要更高的精度，你可以继续该过程，直到找到一个被认为更接近 `25` 平方根的值。\n\
  \n现在，让我们来看相应的 C# 程序。\n\n![](img/my_exercise_header.png) project_30.5-7\n```csharp\n\
  const double ACCURACY = 0.0000000000001;\ndouble y, guess;\nRandom rnd = new();\n\
  Console.Write(\"输入一个非负数: \");\ny = Convert.ToDouble(Console.ReadLine());\nwhile\
  \ (y < 0) {\n    Console.Write(\"无效值。请输入一个非负数: \");\n    y = Convert.ToDouble(Console.ReadLine());\n\
  }\nguess = rnd.Next(1, (int)y); //在 1 和用户提供的值之间产生一个随机初始猜测\nwhile (Math.Abs(guess\
  \ * guess - y) > ACCURACY) { // 是否“足够接近”？\n    guess = (guess + y / guess) / 2;\
  \ // 不是，创建一个新的“猜测”！\n}\nConsole.WriteLine(guess);\n```\n\n![](img/notice.jpg)注意这里检查“是否足够接近”的方式。当差值的绝对值\
  \ `|guess² - y|` 小于 `0.0000000000001`（其中 `y` 是用户提供的值）时，执行流将退出循环。\n\n#### 练习 30.5-8\
  \ 计算 π\n\n编写一个 C# 程序，使用 Madhava–Leibniz 级数计算 `π`，精度为 `0.00001`。\n\n![Image](img/chapter30-06.png)\n\
  \n##### 解\n\nMadhava–Leibniz 级数可以求解出 `π`，变为\n\n![Image](img/chapter30-07.png)\n\n\
  分数越多，精度越高！因此，为了计算该公式，程序需要进行多次迭代以便使用尽可能多的分数。但当然，它不能无限迭代下去！当当前计算出的 `π` 值与上一次迭代计算出的值“足够接近”时，循环必须停止迭代，这意味着它们差值的绝对值已经变得非常小。常量\
  \ `ACCURACY` 定义了此差值必须有多小。这里是 C# 程序。\n\n```csharp\nconst double ACCURACY = 0.00001;\n\
  double pi, piPrevious;\nint sign, denom;\npi = 0;\nsign = 1; // 这是第一个分数的符号\ndenom\
  \ = 1; // 这是第一个分数的分母\ndo {\n    piPrevious = pi; // 保留之前的 pi\n    pi += sign * 4\
  \ / (double)denom; // 通过加上一个分数（项）计算新的 pi\n    sign = -sign; // 为下一个分数准备符号\n    denom\
  \ += 2; // 为下一个分数准备分母\n} while (Math.Abs(pi - piPrevious) > ACCURACY); // 是否“足够接近”？\n\
  Console.WriteLine(\"Pi ~= \" + pi);\n```\n\n![](img/notice.jpg)注意变量 `sign` 在每次迭代中在值\
  \ `-1` 和 `+1` 之间切换的方式。\n\n如果你减小常量 `ACCURACY` 的值，`π` 的计算将越来越精确。取决于你计算机的运行，你可以相当快地计算出\
  \ `π` 的前五位。然而，计算 `π` 的每一个后续数字所需的时间会呈指数级增长。在现代计算机上使用这种方法计算 40 位 `π` 可能需要数年！\n\n####\
  \ 练习 30.5-9 用分数近似实数\n\n编写一个 C# 程序，提示用户输入一个 `0` 到 `100` 之间的实数，然后尝试找到一个更好地接近它的分数 ![Image](img/chapter30-08.png)，其中\
  \ `N` 是 `0` 到 `100` 之间的整数，`M` 是 `1` 到 `100` 之间的整数。使用循环控制结构，程序还必须验证数据输入，允许用户只输入 `0`\
  \ 到 `100` 之间的值。不需要显示任何错误信息。\n\n##### 解\n\n解决方案非常简单。你只需要遍历变量 `n` 和 `m` 的所有可能组合，并检查哪一个更接近用户提供的实数。\n\
  \n要遍历变量 `n` 和 `m` 的所有可能组合，你可以使用嵌套循环控制结构，即两个嵌套在内部的 `for` 循环，如下。\n\n```csharp\nfor\
  \ (n = 0; n <= 100; n++) {\n    for (m = 1; m <= 100; m++) {\n        // ...\n \
  \   }\n}\n```\n\nnotice.jpg)总迭代次数是 `101 × 100`。对于现代计算机来说，这微不足道！\n\n![](img/notice.jpg)变量\
  \ `m` 代表分母，且不能为零。以下\n\n![Image](img/chapter30-09.png)\n\n可以评估分数的“好坏”。困惑吗？让我们尝试近似\
  \ `0.333`。显然 `N = 1` 和 `M = 3` 是最好的。现在是 C# 程序：\n\n```csharp\ndouble x, y, minimum;\n\
  int bestN, bestM, n, m;\ndo {\n    Console.Write(\"输入一个 0 到 100 之间的实数: \");\n  \
  \  x = Convert.ToDouble(Console.ReadLine());\n} while (x < 0 || x > 100);\nbestN\
  \ = bestM = 1;\nminimum = 100;\nfor (n = 0; n <= 100; n++) {\n    for (m = 1; m\
  \ <= 100; m++) {\n        y = Math.Abs(n / (double)m - x);\n    }\n}\n}\n```\nnotice.jpg)将\
  \ `m` 转换为 `double` 类型会欺骗 C# 并执行普通除法（返回实数的除法）。如果你省略了 `(double)` 强制转换，由于被数和除数都是 `int`，C#\
  \ 将执行整数除法并产生错误结果。\n\n### 30.6 循环结构的通用练习\n\n#### 练习 30.6-1 从 0 到 100 的华氏度内核\n\n编写一个\
  \ C# 程序，显示从 `0` 到 `100` 的所有华氏度及其对应的开尔度。使用增量值 `0.5`。已知\n\n1.8 · Kelvin = Fahrenheit\
  \ + 459.67\n\n解\n\n公式求解 Kelvin 变为\n\n![Image](img/chapter30-16.png)\n\n你只需要一个 `for`\
  \ 循环，将 `fahrenheit` 的值从 `0` 增加到 `100`，偏移量为 `0.5`。解决方案如下。\n\n```csharp\ndouble fahrenheit,\
  \ kelvin;\nfor (fahrenheit = 0; fahrenheit <= 100; fahrenheit += 0.5) {\n    kelvin\
  \ = (fahrenheit + 459.67) / 1.8;\n    Console.WriteLine(\"华氏度: \" + fahrenheit +\
  \ \" 开尔度: \" + kelvin);\n}\n```\n\n#### 练习 30.6-2 棋盘上的米\n\n有一个关于发明国际棋的穷人的传说。印度的国王对这个新游戏非常满意，提议给这个穷人任何想要的东西。那个穷但聪明的人告诉国王，他希望棋盘的第一格有一粒米，第二个格子有两粒，第三个有四粒，以此类推，棋盘的\
  \ 64 个格子每个格子都翻倍。\n\n这在国王看来是一个非常的要求，于是命令仆人把米带来。\n\n编写一个 C# 程序，计算并显示棋盘上最后有多少粒米、多少磅米。假设一磅米包含大约\
  \ `30,000` 粒米。\n\n解\n\n```csharp\nlong grains = 1;\nfor (int i = 1; i < 64; i++)\
  \ {\n    grains *= 2;\n}\ndouble pounds = grains / 30000.0;\nConsole.WriteLine(\"\
  总粒数: \" + grains);\nConsole.WriteLine(\"总磅数: \" + pounds);\n```\n\n\n\n\n\n假设有一个只有\
  \ 2 × 2 = 4 个方格的棋盘，变量 `grains` 的初始赋值为 1（这是第 1 个方格上的谷粒数量）。一个循环三次的 for 循环可以在每次迭代中将变量\
  \ `grains` 的值翻倍，如下代码所示。\n\n```c\ngrains = 1;for (i = 2; i <= 4; i++) {grains = 2\
  \ * grains;}\n```\n\n每次迭代结束时变量 `grains` 的值如表所示。\n\n| 迭代 | grains 的值 |\n| --- | ---\
  \ |\n| 第 1 次 | 2 × 1 = 2 |\n| 第 2 次 | 2 × 2 = 4 |\n| 第 3 次 | 2 × 4 = 8 |\n\n在第 3\
  \ 次迭代结束，变量 `grains` 包含值 8。这个值并不是棋盘上的谷粒总数，而是第 4 个方格上的谷粒数。如果你需要找到棋盘上的谷粒总数，可以对所有方格上的谷粒求加，即\
  \ 1 + 2 + 4 + 8 = 15。\n\n在现实世界中，真正的棋盘包含 8 × 8 = 64 个方格，因此你需要迭代 63 次。C# 程序如下。\n\n\
  ![](img/my_exercise_header.png)\n```c\nint i;ulong grains, total;double weight;grains\
  \ = 1;total = 1;for (i = 2; i <= 64; i++) {grains = 2 * grains;total = total + grains;}weight\
  \ = total / 30000.0;Console.WriteLine(total + \"  \" + weight);\n```\n\n如果你想知道这些数字有多大，这里是答案：棋盘上有\
  \ 18,446,744,073,709,551,615 粒大米；也就是说 614,891,469,123,651.8 磅！\n\n![](img/notice.jpg)没有将变量\
  \ `grains` 和 `total` 声明为 `int` 甚至 `long` 的原因是这两种类型都无法容如此大的数字。`long` 类型的上限是 +2⁶³\
  \ − 1，遗憾的是，这仍然不够。\n\n### 练习 30.6-3 简单的民调查\n\n一家民意调查公司询问 1000 名市民他们早上是否吃早餐。编写一个 C#\
  \ 程序，提示市民输入他们的性别（M 代表男性，F 代表女性，O 代表其他）以及对问题的回答（Y 代表是，N 代表否，S 代表有时），然后计算并显示回答“是”的市民人数，以及在回答“否”的市民中女性占的百分比。使用循环控制结构，程序还必须验证数据输入，且性别仅接受\
  \ M、F 或 O，回答仅接受 Y、N 或 S。\n\n#### 解决方案\n\n该 C# 程序如下。\n\n![](img/my_exercise_header.png)\
  \ \n```csharp\nconst int CITIZENS = 1000;int totalYes, femaleNo, i;string gender,\
  \ answer;totalYes = 0;femaleNo = 0;for (i = 1; i <= CITIZENS; i++) {do {\n\n> Console.Write(\"\
  Enter gender: \");\n\n> gender = Console.ReadLine().ToLower();\n\n} while (gender\
  \ != \"m\" && gender != \"f\" && gender != \"o\");do {\n\n> Console.Write(\"Do you\
  \ eat breakfast in the morning? \");\n\n> answer = Console.ReadLine().ToLower();\n\
  \n} while (answer != \"y\" && answer != \"n\" && answer != \"s\");if (answer ==\
  \ \"y\") {\n\n> totalYes++;\n\n}if (gender == \"f\" && answer == \"n\") {\n\n> femaleNo++;\n\
  \n}}Console.WriteLine(totalYes + \"  \" + femaleNo * 100 /(double)CITIZENS + \"\
  %\");\n```\n\n![](img/notice.jpg)注意 C# 是如何将用户的输入转换为小写的。\n\n### 练习 30.6-4 消息是回文吗？\n\
  \n回文是一个正着读和反着读都相同的单词或句子。（你可能还记得从 练习 23.5-4 中，数字也可以是回文）。编写一个 C# 程序，提示用户输入一个单词或句子，然后显示一条消息说明用户提供的单词或句子是否为回文。以下是一些回文单词和消息。\n\
  \n►Anna►Radar►Madam►A nut for a jar of tuna.►Dennis and Edna sinned.►Murder for\
  \ a jar of red rum.►Borrow or rob?►Are we not drawn onward, we few, drawn onward\
  \ to new era?\n\n#### 解决方案\n\n在开始逐个比较字母并检查第一个字母是否与最后一个相同，第二个字母是否与倒数第二个相同，以此类推之前，你需要记住几点。\n\
  \n►在给定的句子或单词中，某些字母可能是大写的，有些是小写的。例如，在句子“A nut for a jar of tuna”中，尽管第一个和最后一个字母相同，但它们并不被认为是相等的。因此，程序在开始比较之前必须转换所有字母——例如转换为小写。►移除像空格、句号、问号这样的字符是关重要的。如果没有这一步，在“Borrow?”句子中，程序会错误地认为它是回文。假设句子是“Borrow?”\n\
  \n![Image](img/17.png)\n\n你应该在这里意识到，循环应该迭代字母的一半。你能发现为什么吗？程序应该开始比较位置 0 与最后位置。然后它应该比较位置\
  \ 1 与倒数位置，以此类推。所有字母都已比较完毕。\n\n解决这个问题有很多方法。下面提供了一些方案。然而，如果你对它们的运行方式仍有疑问，可以使用 Visual\
  \ Studio 逐步执行并观察变量的值。\n\n#### 第一种方法\n\n解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ \n```csharp\nint i, middlePos, j;\nstring message, messageClean;\nchar leftLetter,\
  \ rightLetter;\nbool palindrome;\nConsole.Write(\"Enter a message: \");message =\
  \ Console.ReadLine().ToLower();//创建一个除空格、逗号和问号以外的新字符串 messageClean = \"\";for (i\
  \ = 0; i <= message.Length - 1; i++) {letter = \"\" + message[i];if (letter != \"\
  \ \" && letter != \",\" && letter != \".\" && letter != \"?\") {\n\n> messageClean\
  \ += letter;\n\n}}j = messageClean.Length - 1; // 这是 messageClean 的最后一个位置 middlePos\
  \ = (int)(j / 2); // 这是 messageClean 的中间位置 palindrome = true; // 起初假设句子是回文//这个 for\
  \ 循环逐个比较字母。for (i = 0; i <= middlePos; i++) {leftLetter = messageClean[i];rightLetter\
  \ = messageClean[j];//如果有一对字母没有通过验证，则将变量 palindrome 设置为 falseif (leftLetter != rightLetter)\
  \ {\n\n> palindrome = false;\n\n}j--;}//如果变量 palindrome 仍为真 if (palindrome) {Console.WriteLine(\"\
  The message is palindrome\");}\n```\n\n#### 第二种方法\n\n之前的方法运行良好，但让我们假设用户输入了一个不是回文的长句子；例如，它的第二个字母与倒数第二个字母不同。遗憾的是，在前一种方法中，尽管变量\
  \ palindrome 已经被设置为 false，但最后一个 for 循环仍然会继续迭代到句子的中间，即使是从第二次迭代开始就是如此。所以，让我们尝试让这个程序变得更好。正如你已经知道的，可以使用\
  \ `break` 语句在循环完成所有迭代之前跳出循环。\n\n此外，由于只有四种不同的字符需要移除（空格、逗号、句号和问号），你只需要链调用四个 `Replace()`\
  \ 方法就可以避免第一个循环，如下 C# 程序所示。\n\n\n\n\n\n![](img/my_exercise_header.png)\n\n# 项目 30.6-4b\n\
  \n```csharp\nint i, middlePos, j;\nstring message, messageClean;\nbool palindrome;\n\
  Console.Write(\"Enter a message: \");\nmessage = Console.ReadLine().ToLower();\n\
  //创建一个新字符串，包含除空格、逗号、句号和问号以外的所有字符\nmessageClean = message.Replace(\"  \", \"\").Replace(\"\
  ,\", \"\").Replace(\".\", \"\").Replace(\"?\", \"\");\nj = messageClean.Length -\
  \ 1;\nmiddlePos = (int)(j / 2);\npalindrome = true;\nfor (i = 0; i <= middlePos;\
  \ i++) {\n    if (messageClean[i] != messageClean[j]) {\n        palindrome = false;\n\
  \        break;\n    }\n    j--;\n}\nif (palindrome) {\n    Console.WriteLine(\"\
  The message is palindrome\");\n}\n```\n\n![](img/notice.jpg) 显然，一个问题有很多解决方案。找到最优解取决于你！\n\
  \n![](img/notice.jpg) 如果你想移除所有不需要的字符（空格、逗号、句号、问号、和符号等），你可以使用下面的代码片段代替。它只保留变量 `messageClean`\
  \ 中的字母！\n\n```csharp\n//创建一个只包含字母的新字符串\nmessageClean = \"\";\nstring validChars\
  \ = \"abcdefghijklmnopqrstuvwxyz\";\nfor (i = 0; i < message.Length; i++) {\n  \
  \  if (validChars.IndexOf(message[i]) != -1) {\n        messageClean += message[i];\
  \   //拼接\n    }\n}\n```\n\n### 30.7 复习题：判断对错\n\n请对以下每个陈述选择对或错。\n\n1) 数据验证是限制数据输入的过程，强制用户只输入有效值。\n\
  2) 你可以使用确定次数的循环来验证数据输入。\n3) 为了强制用户只输入正数且不显示任何错误信息，可以使用以下代码片段。\n```csharp\ndo {\n\
  \    Console.Write(\"Enter a positive number: \");\n    x = Convert.ToDouble(Console.ReadLine());\n\
  } while (x <= 0);\n```\n4) 为了强制用户输入 1 到 10 之间的数字，可以使用以下代码片段。\n```csharp\nConsole.Write(\"\
  Enter a number between 1 and 10: \");\nx = Convert.ToDouble(Console.ReadLine());\n\
  while (x >= 1 && x <= 10) {\n    Console.WriteLine(\"Wrong number\");\n    Console.Write(\"\
  Enter a number between 1 and 10: \");\n    x = Convert.ToDouble(Console.ReadLine());\n\
  }\n```\n5) 为了在 10 个用户提供的数字中找到最小数，可以使用以下代码片段。\n```csharp\nminimum = 0;\nfor (i =\
  \ 1; i <= 10; i++) {\n    w = Convert.ToDouble(Console.ReadLine());\n    if (w <\
  \ minimum) {\n        minimum = w;\n    }\n}\n```\n6) 为了在 10 个用户提供的数字中找到最大数，可以使用以下代码片段。\n\
  ```csharp\nmaximum = 0;\nfor (i = 1; i <= 10; i++) {\n    w = Convert.ToDouble(Console.ReadLine());\n\
  \    if (w > maximum) {\n        maximum = w;\n    }\n}\n```\n7) 为了在 10 个用户提供的正数中找到最大数，可以使用以下代码片段。\n\
  ```csharp\nmaximum = 0;\nfor (i = 1; i <= 10; i++) {\n    w = Convert.ToDouble(Console.ReadLine());\n\
  \    if (w > maximum) {\n        maximum = w;\n    }\n}\n```\n\n### 30.8 复习练习题\n\
