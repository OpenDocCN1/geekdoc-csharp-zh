  \ names 包含城市，数组 t 包含它们在特定日的温度。\n\n### 37.5 参数默认值（可选参数）和命名参数\n\n如果你在形式参数列表中为参数分配了默认值，这意味着如果没有为该参数传递值，则将使用默认值。在下一个示例中，方法\
  \ `prependTitle()` 设计用于在名称之前添加（添加前缀）标题。然而，如果没有传递参数 title 的值，该方法将使用默认值“M”。\n\n\n\n\
  \n\n![](img/my_exercise_header.png) project_37.5a\n\n```csharp\nstring prependTitle(string\
  \ name, string title = \"M\") {\n    return title + \"  \" + name;\n}\nConsole.WriteLine(prependTitle(\"\
  John King\")); //显示显示: M John King\nConsole.WriteLine(prependTitle(\"Maria Miller\"\
  , \"Ms\")); //显示显示: Ms Maria Miller\n```\n\n![](img/notice.jpg)当为形式参数列表中的参数分配了默认值时，该参数就称为“可选参数”。\n\
  \n![](img/notice.jpg)在形式参数列表中，任何可选参数必须位于任何非可选参数的右侧；反之则操作将是错误的。\n\n此外，在 C# 中，可以使用如下形式的命名参数来调用子程序：\n\
  \n`argument_name: value`\n\nC# 假设命名参数是可选的。如果在调用子程序时没有提供参数，则将使用默认值。请查看下面的 C# 程序。`prependTitle()`\
  \ 方法被调用了四次。但在最后一次调用中，使用了命名参数。\n\n![](img/my_exercise_header.png) project_37.5b\n\
  \n```csharp\nstring prependTitle(string firstName, string lastName, string title\
  \ = \"M\", bool reverse = false) {\n    string returnValue;\n    if (!reverse)\n\
  \        returnValue = title + \"  \" + firstName + \"  \" + lastName;\n    else\n\
  \        returnValue = title + \"  \" + lastName + \"  \" + firstName;\n    return\
  \ returnValue;\n}\n// 主代码开始这里\nConsole.WriteLine(prependTitle(\"John\", \"King\"\
  )); //显示显示: M John King\nConsole.WriteLine(prependTitle(\"Maria\", \"Miller\", \"\
  Ms\")); //显示显示: Ms Maria Miller\n//显示: Ms Miller Maria\nConsole.WriteLine(prependTitle(\"\
  Maria\", \"Miller\", \"Ms\", true)); //使用命名参数调用方法\nConsole.WriteLine(prependTitle(\"\
  John\", \"King\", reverse: true)); //显示显示: M King John\n```\n\n![](img/notice.jpg)注意，参数\
  \ `reverse` 是形式参数列表中的第四个。但通过使用命名参数，你可以跳过这个顺序。\n\n![](img/notice.jpg)与其使用“命名参数”这一术语，许多计算机语言（如\
  \ Python 和 JavaScript 等）更倾向于使用“关键字参数”这一术语。\n\n### 37.6 变量的作用域\n\n变量的作用域是指该变量的影响范围。在\
  \ C# 中，变量可以是局部作用域或全局作用域。声明在子程序内部的变量具有局部作用域，只能在该子程序内部访问。相反，声明在子程序外部的变量具有全局作用域，可以在任何子程序内部访问，也可以从主代码访问。\n\
  \n让我们来看一些例子。下一个例子声明了一个全局变量 `test`。尽管如此，这个全局变量在 `void` 方法内部被访问并显示。\n\n![](img/my_exercise_header.png)\
  \ project_37.6a\n\n```csharp\nint test; //将 test 声明为全局\nvoid displayValue() {\n\
  \    Console.WriteLine(test); //显示显示: 10\n}\n// 主代码开始这里\ntest = 10; //这是一个全局变量\n\
  displayValue();\nConsole.WriteLine(test); //显示显示: 10\n```\n\n![](img/notice.jpg)全局变量必须在在它们的它们的子程序外部且之前声明。然而，大多数程序员倾向于将它们全部放在顶部以便更好地观察。\n\
  \n但要小心！如果全局变量的值在子程序内被修改，此更改也会反映在子程序外部。在下一个例子中，`void` 方法 `displayValue()` 将全局变量 `test`\
  \ 的值增加到 11，当执行流返回主代码时，将显示值为 11。\n\n![](img/my_exercise_header.png) project_37.6b\n\
  \n```csharp\nint test; //将 test 声明为全局\nvoid displayValue() {\n    test++;\n    Console.WriteLine(test);\
  \ //显示显示: 11\n}\n// 主代码开始这里\ntest = 10;\nConsole.WriteLine(test); //显示显示: 10\ndisplayValue();\n\
  Console.WriteLine(test); //显示显示: 11\n```\n\n下一个程序声明了一个全局变量 `test`、`void` 方法 `displayValueA()`\
  \ 内部的局部变量 `test`，以及 `void` 方法 `displayValueB()` 内部的另一个局部变量 `test`。请记住，全局变量 `test`\
  \ 和两个局部变量 `test` 是三个不同的变量！此外，第三个方法 `displayValueC()` 使用并修改了全局变量 `test` 的值。这是因为在该方法内没有声明任何局部变量\
  \ `test`。\n\n![](img/my_exercise_header.png) project_37.6c\n\n```csharp\nint test;\
  \ //全局变量 test\nvoid displayValueA() {\n    int test; //局部变量 test\n    test = 7;\n\
  \    Console.WriteLine(test); //显示显示: 7\n}\nvoid displayValueB() {\n    int test;\
  \ //局部变量 test\n    test = 9;\n    Console.WriteLine(test); //显示显示: 9\n}\nvoid displayValueC()\
  \ {\n    //使用全局变量 test 的值\n    Console.WriteLine(test); //显示显示: 10\n    test++;\
  \ //增加全局变量 test 的值\n}\n// 主代码开始这里\ntest = 10; //这是全局变量\n```\n\n![](img/notice.jpg)子程序可以具有相同名称的变量，因为它们只在它们所在的子程序中被识别。\n\
  \n### 37.7 代码部分的拆分\n\n不拆分编写大型程序会导致代码难以理解或维护。假设你有一个大型程序，并希望将其拆分为子程序。下一个程序解释了必须遵循的步骤。标记有虚线框的部分部分必须转换为子程序。\n\
  \n![](img/my_exercise_header.png) project_37.7\n\n```csharp\nint totalYes, femaleNo,\
  \ i;\nstring temp1, gender, temp2, answer;\ntotalYes = 0;\nfemaleNo = 0;\nfor (i\
  \ = 1; i <= 100; i++) {\n    do {\n        Console.Write(\"输入公民 \" + i + \" 的性别：\"\
  );\n        temp1 = Console.ReadLine();\n        gender = temp1.ToLower();\n   \
  \ } while (gender != \"male\" && gender != \"female\" && gender != \"other\");\n\
  \    do {\n        Console.Write(\"你下午去跑步吗？\");\n        temp2 = Console.ReadLine();\n\
  \        answer = temp2.ToLower();\n    } while (answer != \"yes\" && answer !=\
  \ \"no\" && answer != \"sometimes\");\n    if (answer == \"yes\") {\n        totalYes++;\n\
  \    }\n    if (gender == \"female\" && answer == \"no\") {\n        femaleNo++;\n\
  \    }\n}\nConsole.WriteLine(\"总正面回答：\" + totalYes);\nConsole.WriteLine(\"女性负面回答：\"\
  \ + femaleNo);\n```\n\n要将此程序的部分转换为子程序，你必须：\n\n-对于每个虚线框，决定使用方法还是 `void` 方法。这取决于子程序是否返回结果。\n\
  -确定每个虚线框中存在的变量以及它们在该虚线框中的作用。\n\n接下来的流程图可以帮助你决定对每个变量做什么，它是必须传递给子程序和/或从子程序返回，还是仅仅作为子程序内部的局部变量。\n\
  \n![Image](img/chapter37-02.png)\n\n所以，借助这个流程图，让我们逐个处理虚线框！没有标记虚线框的部分将组成主代码。\n\n\
  # 第一部分\n\n在第一个虚线框中有三个变量：`i`、`temp1` 和 `gender`。然而，并不是它们都必须包含在替换虚线框的子程序的形式参数列表中。让我们找出为什么！\n\
  \n\n\n\n\n# 第一部分\n\n- 变量 `i`：在虚线框外部初始化/更新；因此，它必须传递给子程序。它在虚线框内没有更新；因此，不应返回给调用者。\n\
  - 变量 `temp1`：在虚线框外部没有初始化/更新；因此，不应传递给子程序。它在虚线框内初始化，但其值在外部没有使用；因此，不应返回给调用者。根据流程图，由于变量\
  \ `temp1` 既不需要传递也不需要返回，该变量可以作为子程序内的局部变量。\n- 变量 `gender`：在虚线框外部没有初始化/更新；因此，不应传递给子程序。它在虚线框内初始化，然后在外部使用了其值；因此，它必须返回给调用者。\n\
  \n因此，由于必须向主代码返回一个值，可以使用所示的方法。\n\n```csharp\n//First part\nstring getGender(int i)\
  \ {\n    string gender, temp1;\n    do {\n        Console.Write(\"Enter gender for\
  \ citizen No \" + i + \": \");\n        temp1 = Console.ReadLine();\n        gender\
  \ = temp1.ToLower();\n    } while (gender != \"male\" && gender != \"female\" &&\
  \ gender != \"other\");\n    return gender;\n}\n```\n\n![](img/remember.jpg)方法的数据类型必须与返回值的数据类型匹配。\n\
  \n# 第二部分\n\n在第二个虚线框中有两个变量，`temp2` 和 `answer`，但它们并不都需要都包含在替换虚线框的子程序的形式参数列表中。让我们来看看为什么！\n\
  \n- 变量 `temp2`：在虚线框外部没有初始化/更新；因此，不应传递给子程序。它在虚线框内初始化/更新，但其值在外部没有使用；因此，不应返回给调用者。根据流程图，由于变量\
  \ `temp2` 既不需要传递也不需要返回，该变量可以作为子程序内的局部变量。\n- 变量 `answer`：在虚线框外部没有初始化/更新；因此，不应传递给子程序。它在虚线框内初始化，然后在外部使用了其值；因此，它必须返回给调用者。\n\
  \n因此，由于必须向主代码返回一个值，可以使用方法，所示所示。\n\n```csharp\n//Second part\nstring getAnswer()\
  \ {\n    string temp2, answer;\n    do {\n        Console.Write(\"Do you go jogging\
  \ in the afternoon? \");\n        temp2 = Console.ReadLine();\n        answer =\
  \ temp2.ToLower();\n    } while (answer != \"yes\" && answer != \"no\" && answer\
  \ != \"sometimes\");\n    return answer;\n}\n```\n\n### 第三部分\n\n在第三个虚线框中有四个变量：`answer`、`totalYes`、`gender`\
  \ 和 `femaleNo`。让我们看看你应该对它们做什么。\n\n- 变量 `answer` 和 `gender`：均在子程序外部初始化/更新；因此，它们必须传递给子程序。它们在子程序内没有更新；因此，不应返回给调用者。\n\
  - 变量 `totalYes` 和 `femaleNo`：均在子程序外部初始化；因此，它们必须传递给子程序。它们在子程序内被更新，然后在外部使用了其值；因此，它们必须返回给调用者。\n\
  \n因此，由于必须向主代码返回两个值，可以使用 void 方法。变量 `totalYes` 和 `femaleNo` 必须通过引用传递，以便它们的值可以（间接地）返回到主代码，如所示。\n\
  \n```csharp\n//Third part\nvoid countResults(string answer, string gender, ref int\
  \ totalYes, ref int femaleNo) {\n    if (answer == \"yes\") {\n        totalYes++;\n\
  \    }\n    if (gender == \"female\" && answer == \"no\") {\n        femaleNo++;\n\
  \    }\n}\n```\n\n![](img/remember.jpg)关于形式参数列表中参数的一个非常好的策略是将所有按值传递的参数放在按引用传递的参数之前。\n\
  \n### 第四部分\n\n在示例的第四个虚线框有两个变量：`totalYes` 和 `femaleNo`。让我们看看你应该对它们做什么。\n\n- 变量 `totalYes`\
  \ 和 `femaleNo`：均在虚线框外部更新；因此，它们必须传递给子程序。它们在虚线框内没有更新；因此，不应返回给调用者。\n\n因此，由于不应向主代码返回任何值，可以使用\
  \ void 方法，如下。\n\n```csharp\n//Fourth part\nvoid displayResults(int totalYes, int\
  \ femaleNo) {\n    Console.WriteLine(\"Total positive answers: \" + totalYes);\n\
  \    Console.WriteLine(\"Women's negative answers: \" + femaleNo);\n}\n```\n\n###\
  \ 最终程序\n\n最终程序包括主代码和上述所有引用的子程序，所示。\n\n![](img/my_exercise_header.png) project_37.7b\n\
  \n```csharp\n//First part\nstring getGender(int i) {\n    string gender, temp1;\n\
  \    do {\n        Console.Write(\"Enter gender for citizen No \" + i + \": \");\n\
  \        temp1 = Console.ReadLine();\n        gender = temp1.ToLower();\n    } while\
  \ (gender != \"male\" && gender != \"female\" && gender != \"other\");\n    return\
  \ gender;\n}\n\n//Second part\nstring getAnswer() {\n    string temp2, answer;\n\
  \    do {\n        Console.Write(\"Do you go jogging in the afternoon? \");\n  \
  \      temp2 = Console.ReadLine();\n        answer = temp2.ToLower();\n    } while\
  \ (answer != \"yes\" && answer != \"no\" && answer != \"sometimes\");\n    return\
  \ answer;\n}\n\n//Third part\nvoid countResults(string answer, string gender, ref\
  \ int totalYes, ref int femaleNo) {\n    if (answer == \"yes\") {\n        totalYes++;\n\
  \    }\n    if (gender == \"female\" && answer == \"no\") {\n        femaleNo++;\n\
  \    }\n}\n\n//Fourth part\nvoid displayResults(int totalYes, int femaleNo) {\n\
  \    Console.WriteLine(\"Total positive answers: \" + totalYes);\n    Console.WriteLine(\"\
  Women's negative answers: \" + femaleNo);\n}\n\n//Main code here\nint i, totalYes,\
  \ femaleNo;\nstring gender, answer;\ntotalYes = 0;\nfemaleNo = 0;\nfor (i = 1; i\
  \ <= 100; i++) {\n    gender = getGender(i);\n    answer = getAnswer();\n    countResults(answer,\
  \ gender, ref totalYes, ref femaleNo);\n}\ndisplayResults(totalYes, femaleNo);\n\
  ```\n\n\n\n\n让我们来看看这个图是如何工作的。主代码调用 `factorial(5)` 方法，该方法转调用 `factorial(4)` 方法，后者又调用\
  \ `factorial(3)` 方法，依此类推。最后一次调用 `(factorial(1))` 向其调用者 `(factorial(2))` 返回值 1，随后向其调用者\
  \ `(factorial(3))` 返回值 1 × 2 = 2，依此类推。当方法 `factorial(5)` 从最顶层的调用返回时，你就得到了最终的解决方案。\n\
  \n为了避免逻辑错误，所有递归子程序必须遵循三个重要的规则：\n\n1) 它们必须调用自己。2) 它们必须有一个基础情况（base case），即“告诉”子程序停止递归的条件。基础情况通常是一个可以直接解决的极小问题。它是对“最简单”可能问题的解决方案。在上一个示例的\
  \ `factorial()` 方法中，基础情况是 1 的阶乘。当调用 `factorial(1)` 时，布尔表达式 `value == 1` 求值为真，并标志着递归的结束。3)\
  \ 它们必须改变状态并向基础情况移动。状态的改变意味着子程序修改了它的某些数据。通常，数据以某种方式变得越来越小。在上一个示例的 `factorial()` 方法中，由于基础情况是\
  \ 1 的阶乘，整个概念都依赖于向该基础情况移动的想法。\n\n结论是，递归帮助你编写更具创意、更优雅的程序，但请记住它并不总是最佳选择。递归的主要缺点是程序员很难想透逻辑，因此调试包含递归子程序的代码非常困难。此外，递归算法可能可能不如非递归算法，因为它可能会消耗过多的\
  \ CPU 时间和/或过多的内存（RAM）。因此，有些时候遵循 KISS 原则，与其使用递归，不如使用循环控制结构来解决算法更好。\n\n![](img/notice.jpg)\
  \ 对于不知道 KISS 原则的人，它是“Keep It Simple, Stupid”（保持简单，别笨蛋！）的缩写！它指出，大多数系统如果保持简单、避免任何不必要的复杂性，运行效果最好！\n\
  \n### 37.9 复习题：判断对错\n\n为以下每个陈述选择对或错。\n\n1) 每个子程序都使用自己的内存空间来存储变量的值。\n2) 子程序中使用的变量“生命周期”与子程序的执行时间一样长。\n\
  3) 只有在 C# 程序执行期间一直运行的变量是主代码的变量和全局变量。\n4) 子程序可以调用主代码。\n5) 如果按值传递参数，且其值在子程序内部被更改，则它在外部不会发生变化。\n\
  6) 实际参数的名字和相应的形式参数的名字必须相同。\n7) 实际参数的总数不能大于形式参数的总数。\n8) 表达式不能传递给子程序。\n9) 默认情况下，C#\
