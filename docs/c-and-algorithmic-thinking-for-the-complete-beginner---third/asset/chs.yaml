  3) `Trim()` 方法是一个用户定义方法。\n4) 每次调用用户定义方法的方式与调用内置方法的方式相同。\n5) 方法的 `argument list`（参数列表）中可以包含任意数量的参数。\n\
  6) 在方法中，`formal argument list`（形式参数列表）必须包含一个参数。\n7) 在方法中，`formal argument list`（形式参数列表）可选的。\n\
  8) 方法不能返回数组。\n9) 以下语句是一个有效的 C# 语句：\n```csharp\nreturn x + 1;\n```\n10) `formal argument`（形式参数）可以是一个\
  \ `expression`（表达式）。\n11) `actual argument`（实参数）可以是一个 `expression`（表达式）。\n12) 方法的\
  \ `actual argument list`（实参数列表）可以没有任何参数。\n13) 下述语句调用了三次 `cubeRoot()` 方法：\n```csharp\n\
  cb = cubeRoot(x) + cubeRoot(x) / 2;\n```\n14) 以下代码段显示的值与语句 `Console.WriteLine(cubeRoot(x)\
  \ + 5)` 显示的值完全相同：\n```csharp\ncb = cubeRoot(x);\ny = 5;\nConsole.WriteLine(y);\n\
  ```\n15) 方法必须始终包含 `return` 语句，而 `void` 方法则不需要。\n16) 名字 `play-guitar` 可以是一个有效的方法名。\n\
  17) 在 C# 中，你不能将方法放在主代码下方。\n18) 当主代码调用方法时，主代码语句的执行会被中断。\n19) 通常情况下，函数可以不向调用者返回任何值。\n\
  20) `IndexOf()` 方法是 C# 的内置方法。\n21) 以下代码段显示值 0.5：\n```csharp\ndouble divide(double\
  \ b, double a) {\n    return a / b;\n}\ndouble a = 10;\ndouble b = 5;\nConsole.WriteLine(divide(a,\
  \ b));\n```\n22) 在计算机科学中，不返回结果的子程序被称为 `void` 函数。\n23) 在 C# 中，你可以通过编写方法名后跟一对空括号来调用\
  \ `void` 方法。\n24) 在主代码中进行的 `void` 方法调用中，`actual argument list`（实参数列表）中的变量必须是主代码中的变量。\n\
  25) 在 `void` 方法调用中，`actual argument list`（实参数列表）只能使用变量。\n26) 在 `void` 方法中，所有的 `formal\
  \ arguments`（形式参数）必须有不同的名称。\n27) `void` 方法的 `formal argument list`（形式参数列表）必须始终包含至少一个参数。\n\
  28) `formal`（形式）和 `actual`（实）参数之间一一对应的关系。\n29) 你可以在语句中调用 `void` 方法。\n30) 当执行流到达\
  \ `void` 方法的结束时，执行流将从调用方法之前的地方继续。\n31) `void` 方法不向调用者返回任何值。\n32) `void` 方法可以不从调用者处接受任何值。\n\
  33) 调用 `void` 方法的方式与调用 `method`（方法）的方式不同。\n34) 在以下 C# 程序中，第一个执行的语句是 `Console.WriteLine(\"\
