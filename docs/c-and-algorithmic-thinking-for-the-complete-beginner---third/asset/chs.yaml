  他们今年 \" + ages[indexOfMax] + \" 岁！\");\n```\n\n\n\n\n\n# 练习 38.2-2 使用子程序对数组进行排序\n\
  \n执行以下操作：\n\ni) 编写一个名为 `mySwap` 的子程序，通过其形式参数列表接收一个字符串数组以及两个索引。该子程序随后交换相应索引位置元素的值。\n\
  ii) 使用上述子程序 `mySwap()`，编写一个名为 `mySort` 的子程序，通过其形式参数列表接收一个字符串数组，然后使用冒泡排序算法对数组进行排序。它必须能够按升序或降序排序。为了实现这一点，在形式参数列表中包含一个额外的\
  \ `Boolean` 参数。\niii) 编写一个名为 `displayArray` 的子程序，通过其形式参数列表接收一个数组并将其显示出来。\niv) 使用上述子程序\
  \ `mySort()` 和 `displayArray()`，编写一个 C# 程序，提示用户输入 20 个人的名字，然后显示它们两次：一次按升序排列，一次按降序排列。\n\
  \n## 解决方案\n\n如下方的 C# 所示所示，`void` 方法 `mySort()` 使用了冒泡排序算法的改进版本。当将值 `true` 传递给参数 `ascending`\
  \ 时，算法对数组 `a` 进行升序排序。当传递值 `false` 时，算法对数组 `a` 进行降序排序。\n\n此外，每当两个元素的内容之间需要交换时，`void`\
  \ 方法 `mySort()` 就会调用 `void` 方法 `mySwap()`。\n\n![](img/my_exercise_header.png) project_38.2-2\n\
  ```csharp\nconst int PEOPLE = 20;\nvoid mySwap(string[] a, int index1, int index2)\
  \ {\n    string temp;\n    temp = a[index1];\n    a[index1] = a[index2];\n    a[index2]\
  \ = temp;\n}\nvoid mySort(string[] a, bool ascending) {\n    int m, n;\n    for\
  \ (m = 1; m <= PEOPLE - 1; m++) {\n        for (n = PEOPLE - 1; n >= m; n--) {\n\
  \            if (ascending) {\n                if (a[n].CompareTo(a[n - 1]) < 0)\
  \ {\n                    mySwap(a, n, n - 1);\n                }\n            }\
  \ else {\n                if (a[n].CompareTo(a[n - 1]) > 0) {\n                \
  \    mySwap(a, n, n - 1);\n                }\n            }\n        }\n    }\n\
  }\nvoid displayArray(string[] a) {\n    int i;\n    for (i = 0; i <= PEOPLE - 1;\
  \ i++) {\n        Console.WriteLine(a[i]);\n    }\n}\nint i;\nstring[] names = new\
  \ string[PEOPLE];\nfor (i = 0; i <= PEOPLE - 1; i++) {\n    Console.Write(\"Enter\
  \ a name: \");\n    names[i] = Console.ReadLine();\n}\nmySort(names, true);    \
  \    // 按升序排序名字\ndisplayArray(names);        // 并显示它们\nmySort(names, false);   \
  \    // 按降序排序名字\ndisplayArray(names);        // 并显示它们。\n```\n\n![](img/notice.jpg)\
  \ 在 C# 中，数组是按引用传递的。这就是为什么不需要在子程序 `mySort()` 中包含返回语句。。\n\n# 练习 38.2-3 阶进电价与用电量\n\n\
