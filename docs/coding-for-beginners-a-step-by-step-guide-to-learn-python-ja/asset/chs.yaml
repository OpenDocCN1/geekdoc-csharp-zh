- "# 初学者编程指南：从零开始 Python、Java、SQL、C、C++、C#、HTML 和 CSS 的逐步学习指南\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n## 引言\n《初学者编程》是一份完整且真实的指南，适用于那些决心学习最佳编程方法、技术和方法论的学生。随着软件行业每天都在更新最新的编码语言和工具，采用新的技能和技术对于在竞争激的市场中生存是至关重要的。对于学生和学习者来说，阅读一直是他们至关重要的资源，因为通过实施最新的技术和编程方法论，他们可以提高表现和产出。\n\
  \n本书是一本成功的编程手册，涵盖了适用于初学者和专业人士的所有主要编程语言、语法和实践。在进入编程世界之前，有几个重要的因素需要考虑，以便培养敏锐的问题解决和分析能力。因此，本书针对初级程序员，并针对你可能对\
  \ `java`、`sql`、`c`、`c++`、`c#`、`python`、`html` 和 `css` 提出的每一个问题提供了解决方案和答案。\n\n我始终强调基础知识和技能的获取。这本书不会让你在一个小时内或一夜之间变成程序员，但它会为你的编程职业奠下坚实的基础。阅读本书后，你的编程基础知识将会增加，你对任何编程语言的熟练程度也会提高。\n\
  \n## 第一章：什么是编程？\n通常，编程是指计算机用于完成某些任务的一系列指令。这也被编码。在深入讨论之前，你必须意识到编程是如何工作的，以及指令集是如何形成的。当你能够遵循正确的方法时，它可以变得非常简单。编程是通过高级语言和低级语言与计算机通信的一种。\n\
  \n为了用计算机解决问题，执行操作的指令集被称为算法。例如，如果你被赋予加两个整数的任务，那么加整数的算法将用特定语言（如 `c++` 或 `c#`）编写。如果有任何语法错误，编译器将无法执行程序。编程可以通过实践和编写来更好地学习；尽管在开始时可能是一项有趣的活动，但也可能变得非常耗时。此外，本书将让初学者更容易选择最合适的。\n\
  \n### 使用计算机编程解决问题\n本质上，计算机程序旨在通过遵循指令来解决特定问题。人们可以通过遵循多种技术和方法编写程序。为了解决问题，你需要确定代码流并逐步满足要求以实现预期的输出。在某些情况下，你的计算机程序即使在挣扎几个小时后可能无法运行，因为语法不当或需要关注指令顺序和计算机编程语言的要求。\n\
  \n以制作木桌为例，你需要按照以下步骤列出指令：\n\n1. 获取制作桌子所需的合适的木材。\n2. 获取过程中将使用的基本工具和设备。\n3. 连接部件并制作你的桌子。\n\
  4. 对成品进行抛光，使其看起来更美观。\n\n\n\n\n\n关于计算机的自然语言，它们无法理解人类语言，因此我们需要通过另一种名为`binary code`（二进制代码）的语言与系统进行通信。`binary\
  \ code`由一系列 1 和 0 组成，是计算机的自然通信语言。为了帮助计算机理解人类语言，我们使用翻译器和编辑器来编写程序。翻译器具有将源代码转换为机器语言的能力。\n\
  \n翻译器有多种类型，被称为`interpreters`（解释器）、`compilers`（编译器）和`assemblers`（汇器）。`interpreters`通常用于逐行解释处理语言，以运行最终程序。此外，`interpreter`还会列出任何语法错误或问题，以便程序员清除错误并执行程序。\n\
  \n在`compilers`的帮助下，源代码通过编译过程转换为二进制代码并执行以输出。如果源代码中没有错误或问题，`compiler`将一次性翻译并执行所有行。此外，计算机程序也被称为`apps`（应用程序或应用软件），并根据其设计运行的环境或平台进行定制。`apps`还分为桌面应用程序和移动应用程序两类。\n\
  \n# 编程基础\n\n## 计算机编程简介\n\n每个计算机程序都是完成源代码的程序、过程和算法的组合。由于这种过程组合也可以被视为软件的表示，因此该过程被视为实现输出的一系列动作，其中程序被认为是按特定顺序执行的一系列动作。算法是任何程序的主要驱动力，也被称为解决特定程序或问题的有序步骤集。\n\
  \n有不同的高级语言和低级语言可以用于编写计算机程序。如今，程序和软件通常使用流行的语言制作，包括`c`、`c++`、`java`、`python`、`html`、`php`、`ruby`和`perl`。这些语言用于产生目前用于各个领域和行业的计算机程序，包括医疗、工程、通信、家用和娱乐行业。此外，计算机程序还用于创建图形\
  \ Web 应用程序和桌面应用程序。\n\n## 编程元素与基础\n\n通常，计算机语言是几个元素的组合，允许程序员实现预期输出。这些元素包括基础语法、编程环境、数据类型、关键字、`variables`（变量）、决策、基本运算符和函数。此外，为了在程序中执行某些操作，你还需要应用其他操作并使用包括循环、字符串、字符、文件输入输出和数组在内的元素。\n\
  \n编程有五种不同的基本元素，也被认为是任何程序的构建块。这些元素被称为`input`（输入）、`output`（输出）、`arithmetic`（算术）、`conditional`（条件）和`looping`（循环）。从第一个元素开始，`input`是将命令和数据获取计算机的过程，而`output`元素具有交付结果的功能。如果有计算或操作，则使用`arithmetic`元素配合条件语句来测试条件的真假。\n\
  \n# 环境、数据类型与基础语法\n\n## 环境\n\n为了运行或执行程序，你必须为你正在使用的语言安装或设置所需的工具和环境。此外，如果初学者发现安装和配置编程环境困难，也可以使用文本编辑器创建计算机程序。为了将程序执行为二进制格式，必须使用`compiler`，因为计算机无法直接理解文本格式的程序。\n\
  \n此外，文本到二进制格式的转换是由计算机可以运行的`compiler`完成的。可以使用`c++`和`java`等编程语言。\n\n## 基本语法\n\n为了方便初学者，我们将从一个用`c++`编写的示例程序开始。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    cout <<\
  \ \"hello world!\";\n    return 0;\n}\n```\n\n该程序的输出是：\n\n```\nhello world!\n```\n\
  \n程序以#include`和`main()`（也称为主函数）开始。最后，`return 0;`是退出状态。如果你无法编译程序，可能存在某些语法错误，例如遗漏了一个分号。\n\
  \n## 数据类型\n\n数据类型是各种语言的重要部分，并且在创建应用程序时使用。因为它告诉计算机如何使用提供的数据。数据类型的详细信息如下：\n\n*   日期：`01/04/2015`\n\
  *   整数：`521324`\n*   布尔：`true/false`\n*   字符串：`aabb`\n*   空：无数据\n*   长型：`532543253`\n\
  *   浮点数：`5.2341`\n*   短型：`0`\n\n## 语法\n\n如前所述，程序被定义为执行某些操作以交付特定输出的元素和属性集合。使用`c++`编程语言时，编写程序时需要遵循预定义的基本语法。\n\
  \n\n\n\n\n### 3. 方法 (Methods)\n方法被视为行为，负责在类内执行和操作不同的动作。\n\n### 变量、关键字、运算符和决策\n变量是计算机程序中不可或缺的一部分，因为它们提供了存储计算机程序中值和数据的计算机内存位置。为了保存一个值，你必须创建变量并为它们分配适当的名字，将值存储到变量中，并从变量中检索这些值。\n\
  \n要开始声明变量，我们需要按照如下方式编写程序：\n\n```cpp\n#include <iostream.h>\n\nint main() {\n  int\
  \ a;\n}\n```\n\n上述程序创建了一个名为 `a` 的变量，并由 `int` 关键字指定。这意味着该变量只能存储 `int` 类型的值，你不允许再次定义\
  \ `a` 来在变量中存储另一种类型的值。\n\n要将值存储到变量中，只需在程序声明变量后指定你想要放入 `a` 中的数字即可。\n\n#### 关键字 (Keywords)\n\
  每种编程语言都有用于不同用途的不同关键字。虽然每种语言都提供了一套完整的保留关键字，但在使用关键字时需要遵循一些通用规则。与 `float`、`int`、`long`\
  \ 和 `string` 类似，在每个编程语言中常用的其他关键字如下：\n\n*   Else\n*   Switch\n*   Goto\n*   Static\n\
  *   Case\n*   Break\n*   Enum\n*   For\n*   If\n*   Union\n*   Double\n*   Private\n\
  \n#### 运算符 (Operators)\n运算符是任何编程语言的关键，用于执行某些操作或逻辑计算。由于它们通常用于数学计算，我们可以通过程序中的各种表达式来解决复杂的方程。\n\
  \n编程语言中通常有两种运算符：\n\n1.  **算术运算符 (Arithmetic operators)**：用于执行数学和算术运算的运算符。例如：`+`、`-`、`/`、`--`、`++`、`*`。\n\
  \    *   **二元运算符**：与其他操作数共同工作的运算符，如 `+`、`-`、`/`、`*`。\n    *   **一元运算符**：用于与单个操作数工作的运算符。例如：`++`、`--`。\n\
  2.  **关系运算符 (Relational operators)**：这些是最常用的运算符，告诉我们一个操作数是否等于另一个。例如：`==`、`<=`、`>=`、`<`、`>`、`!=`。\n\
  \n下面是程序中基本运算符及其功能的表格：\n\n| 运算符 | 功能 |\n| :--- | :--- |\n| `+` | 两个操作数相加 |\n| `-`\
  \ | 两个操作数相减 |\n| `/` | 除法 |\n| `*` | 法 |\n| `==` | 检查两个操作数是否相等 |\n| `>=` | 检查左操作数的值大于或等于右操作数\
  \ |\n| `<=` | 检查左操作数的值小于或等于右操作数 |\n\n逻辑运算符也是所有编程语言的重要部分。它们用于在各种场景下获取某些决策。这些运算符是\
  \ `and`、`or` 和 `not`。它们也被用于证明真假陈述。\n\n### 决策 (Decisions)\n决策是一个程序员必须根据两个或多个给定条件选择一个选项的过程。你必须测试条件是真是假，并呈现正确的输出。\n\
  \n对于不同的编程语言，决策语句定义如下：\n\n*   `if` 语句\n*   `else` 语句\n*   `Switch`\n*   `else if`\
  \ 语句\n*   条件运算符\n\n### 字符、数组和字符串 (Characters, arrays, and strings)\n在编程语言中，`char`\
  \ 类型用于存储字符和字母。它们还负责在调用字符时存储值并传递输出。你只允许在单引号内存储单个数字或字母，例如 `'&'`。定义字符的示例代码如下：\n\n```cpp\n\
  char ch1 = 'a';\n```\n\n#### 数组 (Arrays)\n数组是一种能够存储相同类型顺序元素的数据结构，且通常具有固定大小，由于它由连续的内存位置组成，也被称为相同名称下的元素集。如果你正在编写一个顺序存储整数的程序，创建数组将是最佳解决方案。这是固定数量值数组的声明方式：\n\
  \n```cpp\nint data[10];\n```\n\n两种流行的数组类型被称为：\n1.  一维数组。\n2.  多维数组。\n\n##### 访问数组\
  \ (Accessing arrays)\n声明完成后，你可以通过索引轻松地访问元素。数组的第一个索引为 0，如果数组的大小为 `n`，你必须使用 `n-1`\
  \ 来访问最后一个元素。要初始化数组，你可以遵循如下模式：\n\n```cpp\nint arr[5] = {1, 2, 3, 4, 5};\n```\n\n\
  数组允许程序员将数据存储到变量中而无需专门定义每个变量。与其他数据类型类似，数组使用 `[` 和 `]` 括号声明，一旦数组声明完成，你就可以赋值。在程序中有创建、赋值和声明数组的不同方法。\n\
  \n##### 声明 (Declaration)\n为了声明数组，你必须记住数组大小必须大于 0 的整数。数组可以如下声明：\n\n`Type arrayname[arraysize];`\n\
  \n##### 初始化 (Initialization)\n要初始化数组，你可以可以使用述语句：\n\n```cpp\nint arr[5] = {23, 45,\
  \ 53, 64, 73};\n```\n\n#### 字符串 (Strings)\n字符串是编程语言中用于表示字符数组的数据类型。声明和初始化字符串，你需要遵循与数组相同的结构。每种编程语言都有编写字符串的不同技术和方法，但在每个情况下功能都是相同的。字符串还可以包含短语中的空格，例如“我从下午\
  \ 5 点开始等待”。字符串的示例如下：\n\n```cpp\nchar c[] = \"abcdef\";\n```\n\n### 函数和文件输入输出 (Functions\
  \ and file i/o)\n#### 函数 (Functions)\n函数是程序内执行特定任务的代码块。编程语言中有两种函数：标准库函数和自定义函数。标准库函数被分配处理\
  \ I/O 处理、计算和数据处理等主要任务，而自定义函数是由程序员创建的用于执行特定任务。函数更像是可以重复使用的代码。\n\n在 C 语言编程中定义函数，你需要声明返回类型、函数名、参数列表和函数体。例如：\n\
  \n```cpp\n#include <iostream.h>\n\nvoid functionname()\n\nint main() {\n  functionname();\n\
  }\n```\n\n#### 文件输入输出 (File i/o)\n为了存储和管理计算机文件（如图像、文档、纯文本或 Excel 表格），我们利用文件输入输出模式的支持。通过文件输入，该方法用于将任何数据写入文件，而文件输出方法用于显示来自文件的结果。通常，文件可以使用不同的模式打开，如只读模式、只写模式或读写模式。\n\
  \n\n\n\n\n每种编程语言都有特定的函数用于打开、读取或创建新文件。对于打开文件，推荐的函数是 `open()`，而关闭文件则可以使用 `fclose()`\
  \ 函数。\n\n# 编程环境\n\n## 什么是编程环境？\n开发环境是编程工具和一组流程的组合，共同用于运行程序。根据你编写程序时使用的语言，你可以选择最合适的环境，并按照提供的说明完成项目。因为编程是我们实现不同解决方案和输出的方式，我们可以通过编程工具和环境以多种方式表达我们的想法。\n\
  \n此外，编译器以逐步的方式执行算法，并执行其他活动，如决策选择、顺序处理和迭代。\n\n## 集成开发环境\n集成开发环境是指将工具和过程连接在一起的软件，为编程环境带来方便的界面。集成开发环境（`ide`）被称为应用程序，它有助于应用程序开发，并为开发者提供基于图形用户界面（`gui`）的工作方法。现代\
  \ ide 还可以用于生成结构图、流程图，并为编程提供模块化的方法。\n\n为了选择一个 ide，你可以兼顾你的语言需求和编程风格。这可以让你更容易地完成复杂的应用程序并获得更好的结果。\n\
  \n# 工具与技术\n有数千软件开发工具、ids 和技术可以用于创建完美的应用程序、程序和软件。我们列出并简要介绍了一些最有效、易用且先进的工具，供程序员开发任何类型的\
  \ Web、桌面和移动应用程序。\n\n以下是一些针对初级程序员的器工具：\n\n### NetBeans\nBeans 是一个开源集成开发环境，可以作为开发桌面、Web\
  \ 和移动应用程序的工具。该工具允许简单高效的项目管理过程，允许开发者编写无 bug 代码，并提供智能代码编辑功能。此外，该 ide 最适合 `php`、`c++`\
  \ 和 c 编程语言。\n\n### Cloud9\n提到在线集成开发环境时，`cloud9` 疑是值得考虑的最佳工具之一。支持的语言包括 `php`、`c`、`c++`、`python`、`perl`、`node.js`\
  \ 和 `javascript`。开发者可以选择大量的默认运行器来执行应用程序并通过提供的建议更快地编写代码。\n\n### Visual studio\n`Visual\
  \ studio` 是由微软设计开发的顶级集成开发环境。由于支持广泛的平台，开发者现在可以无忧地构建安全、共享和管理软件组件。此外，自动化的 `azure` 部署允许你在集中版本控制系统的支持下提高代码质量。\n\
  \n## 技术\n学习编程语言和技术是适应最新方法和技巧的最佳方式。从 `javascript`、`python` 和 `c++` 等主流技术开始，可以让初学者更容易地对编程有更好的理解。此外，每种技术都有自己的视角和方法论，你必须深入学习这些概念。\n\
  \n对于开源开发者来说，由于 Java 虚拟机（`jvm`），`java` 被认为是最好的语言。这允许软件运行在任何系统上。初学者也可以从 `c++` 开始练习，因为它可以访问非常底层组件和简单的方法。\n\
  \n# 方法论\n编程方法论是分析复杂问题并规划软件开发过程的过程，以实现可能的解决方案。也称为模块化编程，软件开发过程分类如下：\n\n- **需求收集**：由于这是软件开发周期的第一阶段，它由专家和专业人员执行，他们可以轻松地对项目进行可行性研究。会讨论结果和技术方法，以便项目能够无故障地完成。\n\
  - **需求工程**：下一步是收集相关数据并定义完成项目所需的需求。通常，我们需要创建一个包含所有设计开发数据的软件需求（`s`）文档。系统分析师必须清楚客户需求，并向开发者提供详细简报，以便他们相应地编写代码。通常客户无法清晰地定义他们的需求。\n\
  - **设计**：在我们完成需求后，下一步是按照软件需求（`s`）文档中的指定设计架构。此时，你还需要概述设计模块化、时间限制和产品规格。\n- **开发**：这是开发者开始根据项目经理的指令和指南在项目上工作的阶段。对于每个特定项目，会在广泛的研究和开发后选择一种编程语言，以完全满足客户的实际需求和功能。\n\
  - **测试**：此阶段涉及通过监督客户需求对软件进行检查和检查。通过使用各种测试用例检查产品的错误、缺陷和需要改进之处，以确保每个需求都完全满足并可运行。\n\
  - **部署**：部署是 `sdlc` 过程的最后阶段。由于产品现在已经通过了设计、开发和测试程序，已准备交付给客户。根据业务策略，产品也可以发布在市场上或按照客户给出的指令进行发布。\n\
  \n## 前端技术\n前端开发通常指的是通过实现 Web 应用程序的设计结构和动画来开发用户界面。用于前端开发的核心技术包括 `html`、`css` 和 `javascript`，专业开发者可能还会使用\
  \ `ajax`、`amp` 或 `angular` 等最新技术。\n\n超文本标记语言（`html`）和级联样式表（`css`）是创建网站的基础构建块，也用于增强网页的响应能力。`html`、`javascript`\
  \ 和 `css` 是前端开发的三大技术。\n\n文档编辑器\n\n\n\n\n为了创建软件文档、演示文、图表、图形或动画，有多种文档编辑工具可用。从最流行的工具开始，你可以安装\
  \ `microsoft office` 并轻松地编辑任何类型的文档。该包包含了 `microsoft word`、`microsoft excel`、`microsoft\
  \ powerpoint`、`outlook`、`one note`、`one drive` 等模块。\n\n此外，`google docs` 是另一个在线文档编辑工具，可以在线访问、更新和创建文档。该工具允许你创建表格、文档、幻灯片和表单，你可以从广泛的模板中选择。\n\
  \n# 第二章：java\n\n## 概述与基础语法\n\nJava 是一种高级编程语言，由 sun microsystems 于 1995 年发布。有无数的网站和应用程序使用\
  \ `java` 技术构建，因为与其他编程语言相比，它可靠、易用且更快。作为一种面向对象的编程语言，开发者可以更快地编写代码、编译、执行和测试程序。此外，使用\
  \ `java` 开发的应用适用于多种环境而且更加安全。\n\n该语言设计用于包括 windows、unix 和 mac os 在内的不同平台运行，并为这些平台提供了多种配置。`java`\
  \ 具有绝对的平台无关性，它被编译成特定平台的机器码，字节码通过 `java virtual machine` (`jvm`) 进行分发和解释。此外，`java\
  \ byte code` 实现了高性能，并专为分布式互联网环境设计。\n\n进入基础语法，`java` 编程通常基于对象、类、方法、变量、修饰符、构造函数和正则表达式。为了更好地理解简单的\
  \ `java` 程序，你可以参考以下对每个方面的简要细节：\n\n#### 关键字\n\n| 关键字 | 功能 |\n| :--- | :--- |\n| Class\
  \ | 用于声明一个类 |\n| Void | 返回类型 |\n| Public | 访问修饰符，用于使函数可见 |\n| Static | 用于在静态方法中创建对象\
  \ |\n| `Main()` | `Main()` 方法置于程序开头 |\n| `System.out.println()` | 在控制台上打印语句 |\n\n\
  在开始 `java` 编程之前，请确保记住 `java` 是一种区分大小写的语言，你需要用大写字母声明类名。方法名应以小写字母开头，程序文件名必须与类名完全一致，以避免在执行程序时出现任何问题。\n\
  \n`java` 编程语言中的概念包括类、对象、多态、继承、抽象、封装、实例和方法传递。\n\n你的第一个 `java` 程序可能像这样：\n\n```java\n\
  class helloworld {\n    public static void main(string[] args) {\n        System.out.println(\"\
  your first java program!\")\n    }\n}\n```\n\n## Java 标识符与修饰符\n\n`java` 标识符应该以 a\
  \ 到 z 或 A 到 Z 的字母开头，因为标识符同样区分大小写。你必须记住关键字永远作为标识符，标识符在第一个字符后可以是任何字符组合。例如，`month`、`price`\
  \ 或 `_place`。\n\n`java` 编程语言中有两种类型的修饰符。一种称为访问修饰符，另一种称为非修饰符。修饰符通常用于修改方法或类。\n\n####\
  \ 类与对象\n\n对象是类的一部分，也被称为实例。类表示一组所有对象共有的属性，并且是创建对象的原型。要声明一个类，我们需要包含修饰符、类名、接口和类体。此外，`java`\
  \ 中的一切内容都与对象和类相关，这些类与方法和属性相结合。以手机为例，它有颜色、内存和重量等属性。在 `java` 中创建一个类，你需要遵循下述语法：\n\n\
  ```java\npublic class newclass {\n    int a;\n}\n```\n\n创建一个名为 `newobj` 的对象：\n\n\
  ```java\npublic class newclass {\n    int a = 1;\n    public static void main(string[]\
  \ args) {\n        newclass newobj = new newclass();\n        System.out.println(newobj.a);\n\
  \    }\n}\n```\n\n创建对象需要声明、实例化和初始化。声明是声明带有对象类型的变量名的过程，而实例化是使用 `new` 关键字创建对象。程序通过调用构造函数继续执行以初始化新对象。\n\
  \n#### 数据类型与变量\n\n在 `java` 程序中，数据存储在变量中，程序将数据读取到变量并执行提供的操作。一旦过程完成，变量会被写入一次新位置。变量提供了一个用于存储值的保留内存位置，内存由操作系统分配。\n\
  \n## 数据类型\n\n`java` 编程语言中有两种不同的数据类型，称为基本数据类型和对象数据类型。基本数据类型被分为 8 类：`byte`、`short`、`int`、`long`、`float`、`double`、`boolean`\
  \ 和 `char`。对象数据类型通过类的构造函数创建并负责访问对象。每个可用引用变量的默认值都设置为 `null`，它也可以用于引用声明类型的对象。\n\n\
  #### 变量\n\n`java` 编程语言使用了三种变量：\n1. 局部变量\n2. 实例变量\n3. 类/静态变量\n\n#### 局部变量\n局部变量通常声明在构造函数和方法中。由于它们是在构造时创建的，因此修饰符不能与局部变量一起使用。局部变量没有默认值。\n\
  \n#### 实例变量\n实例变量声明在类内部，每当创建对象时就会创建一个。它们存储被多个构造函数或方法引用的值。实例变量也可以修饰符。\n\n## 运算符、控制语句与决策\n\
  \n### 运算符\n\n`java` 编程语言中提供的基本运算符说明如下：\n\n*   算术运算符：算术运算符用于在程序中进行数学计算和方程求解。这包括加、减、乘、除、模运算以及增、减函数。\n\
  *   一元运算符：后置 `expr++` 和前置 `++expr` `--expr` 表达式。\n*   逻辑运算符：`(a && b)` 为假，`(a ||\
  \ b)` 为真，`!(a && b)` 为真。\n*   位运算符：用于执行位操作。\n*   赋值：`=`、`+=`、`|=`、`^=`。\n\n### 控制语句\n\
  \n`java` 语言的控制语句与 c 或 c++ 等其他主要编程语言相似。详细条件说明如下：\n\n\n\n\n\nIf-else：if 语句用于检查给定条件是否为真或假。Java\
  \ 编程语言中有不同类型的 if 语句，分别称为 if 语句、if-else 语句、if-else 阶梯和嵌套 if 语句。\n\n这里有一个演示 if 语句的简单\
  \ Java 程序：\n\n```java\nPublic class marks {\n    public static void main (string\
  \ [] args) {\n        int marks = 50;\n        if (age < 50) {\n            system.out.print\
  \ (\"your marks are less than 50\");\n        }\n    }\n}\n```\n上述程序的输出为：your marks\
  \ are less than 50。\n\nIf-else：该语句用于测试条件，如果结果为真，则执行 `if` 块；如果为假，则执行 `else` 语句。\n\
  \nSwitch：switch 语句用于从多个条件执行单个语句。该语句可以与 `short`、`int`、`long`、`byte`、`string` 和 `long`\
  \ 等数据类型。\n\nswitch 语句的语法如下：\n* `Switch (expression){`\n* `Case value,1:`\n* `//code,\
  \ to be executed;`\n* `Break ; //`\n* `Case value,2:`\n* `//code, to be executed;`\n\
  * `Break ;`\n* `Default :`\n* `当所有 case 未匹配时执行的代码；`\n* `}`\n\n### 循环\n编程语言中通用的循环有三种：\n\
  * `For` 循环\n* `While` 循环\n* `Do-while` 循环\n\n### For 循环\nFor 循环用于在程序的某个执行迭代。如果迭代次数是固定的，建议在程序中使用\
  \ `for` 循环。\n\n### While 循环\nWhile 循环的特点是重复单个或一组语句，以测试给定条件是否为真。它用于迭代次数不是固定的情况。\n\
  \n### Do while 循环\n`do while` 循环用于多次迭代程序的某个。如果迭代次数不是固定，则要求至少执行一次程序。\n\n需要特定的循环控制语句来将执行顺序改为普通序列。Java\
  \ 编程语言中使用的两种控制语句包括：\n* `Break` 语句：终止 switch 或循环并开始下次循环。\n* `Continue` 语句：允许循环重新测试其条件并跳过主体的剩余部分。\n\
  \n# 决策\n决策结构包含在给定场景下需要测试的一个或多个条件。如果条件为真，则可以执行下一个语句；如果给定条件为假，程序将终止。下面的图正确地展示了决策过程实际上是如何运作的：\n\
  \n# 字符、字符串、数组和正则表达式\nJava 编程语言使用了字符包装类，并提供了多个用于操作字符的静态方法。要创建一个字符对象，需要遵循以下语法：\n```\n\
  Character ch = new character ('a');\n```\n编译器会自动创建一个字符对象，如果你向方法传递任何基本类型 `char`，编译器将使用语言中的各种方法将\
  \ char 转换为字符 对象。\n\n正如我们之前讨论过的字符串重要性和功能一样，Java 平台还提供了 `string` 类的支持。程序员可以通过多种方式操作字符串。在\
  \ Java 语言中创建字符串的示例代码如下：\n```java\nPublic class string {\n    Public static void\
  \ main (string args []) {\n        char[] array = {'s', 't', 'r', 'i', 'n', 'g'};\n\
  \        string str = new string (array);\n        system.out.println (str);\n \
  \   }\n}\n```\n该程序的输出为：string。此外，我们还可以使用 Java 编程语言中简单的连接方法来拼接字符串，如下：`String1.concat(string2);`。在\
  \ Java 中创建字符串对象，程序员可以选择字面量或关键字方法。\n\n#### 数组\n数组是每种编程语言的重要部分，因为它允许程序员处理并将数据存储到变量中。为了存储大量数据，你也可以将数组视为同类变量的集合。要声明数组，可以遵循下面定义的简单语法：\n\
  ```\ndatatype[] array;\n```\n在 Java 中创建数组非常简单，可以使用以下语法：\n```\nArray = new datatype[size];\n\
  ```\n该语句将创建一个给定大小的数组，并将该数组的引用赋值给变量。通常，使用 `for` 循环或 `foreach` 循环处理数组，因为数组内部元素具有相同的类型和大小。用于排序、比较和填充数组元素的静态方法：自带的\n\
  * `Public static int binarysearch(object a, object)`\n* `Public static void fill(int[]\
  \ a, int val)`\n* `Public static boolean equals(long[] a, long[] a2)`\n* `Public\
  \ static void sort(object a)`\n\n## 正则表达式\n正则表达式是一个用于定义模式的 API，也用于搜索、编辑和处理文本。Java\
  \ 有预定义的 `java.util.regex` 包，其中包含 pattern 类、matcher 类和 syntax 异常对象。pattern 类要求开发者从\
  \ `compile()` 方法开始并返回一个 pattern 对象，因为它不提供公共构造函数。对于 matcher 类，matcher 对象通过 `matcher()`\
  \ 方法查找并对比针对输入字符串的操作，以获得一个 matcher 对象。syntax 异常表示正则表达式模式中的错误或失误。\n\n# 文件和 I/O\nJava\
  \ 编程语言具有一个内置包，负责数据输入输出操作。该流被称为 `java.io`，并支持处理数据的多种操作和功能。Java 中有两种类型的流，称为 `input\
  \ stream` 和 `output stream`。输入流用于读取数据，而输出流用于向文件写入数据。Java 具有各种 i/o 数据处理流，包括：\n* `字节`\
  \ 流\n* `字符` 流\n* `标准` 流\n* 文件输入流\n* 文件输出流\n\n# 面向对象 Java\n面向对象编程是一种使用类和对象的方法。通过使用继承、多态、封装和抽象等多个概念，程序员可以开发\
  \ Java 应用和程序。\n\n## 继承\n继承是 Java 编程语言中的特性，允许它继承另一个类的特征和属性。这可以在子类和父类之间进行。特征的类称为父类，继承其他类的类称为子类。\n\
  \n在 Java 中使用继承，可以遵循下面的语法：\n```\nClass derived-class extends base-class {\n    //\
  \ 方法\n}\n```\n\n#### 多态\n多态是一个允许对象具有多种形式的概念。在 Java 中，有两种多态：编译时多态和运行时多态。编译时多态通过方法重载和构造函数重载实现。运行时多态通过方法重写实现。\n\
  \n\n\n\n\n通过多种方式执行单个任务的技术被称为多态。在 Java 编程中，我们可以使用方法重写（method overriding）和方法重载（method\
  \ overloading）技术来实现多态。需要知道的一点是，可以通过引用变量访问对象，一旦它被重新赋值给其他对象，可以使用引用变量的类型来确定用于访问对象的方法。\n\
  \n例如：\n\n```\npublic interface school{}\n\npublic class student{}\n\npublic class\
  \ john extends student implements school{}\n```\n\n在上述情况下，`john` 被认为是多态的，因为它具有多重继承，我们也可以对同一个对象应用引用变量。\n\
  \n### 抽象 (Abstraction)\n\n抽象类是在其声明中包含 `abstract` 关键字的类，它可能不包含抽象方法。当类具有抽象方法时，它无法被实例化，程序员必须从另一个类继承它以实现该抽象方法。\n\
  \n### 封装 (Encapsulation)\n\nJava 编程中的封装是将数据和方法包装在一起的过程。通常，一个类的变量将对另一个类隐藏，并且只能通过当前类中使用的方法进行访问。封装的优点是类可以被设为只读或只写，并且还可以对存储的数据具有完全的控制权。\n\
  \n### 递归 (Recursion)\n\n递归是指在程序内部调用自身的方法的技术。`recurse()` 方法从 `main` 方法中调用，也可以从同一个\
  \ `recurse()` 方法中被调用。这个过程一直持续，直到满足给定条件，如果不满足条件，就会发生无限递归。\n\n以下是 Java 中递归的简单实现：\n\
  \n```java\nClass sample {\n    static void printfun(int test) {\n        if (test\
  \ < 1)\n            return;\n        else {\n            system.out.printf(\"%d\
  \ \", test);\n            // state 2\n            printfun(test - 1);\n        \
  \    system.out.printf(\"%d \", test);\n            return;\n        }\n    }\n\n\
  \    public static void main(string[] args) {\n        int test = 3;\n        printfun(test);\n\
  \    }\n}\n```\n\n#### 递归的优点\n\n在某些复杂的程序，编写递归代码可以带来多种益处。因为它提供了一种简单且整洁的代码编写方式，开发者可以轻松地执行各种类型的操作。\n\
  \n### 抽象类和抽象方法\n\n#### 抽象类\n\n在 Java 编程中，抽象类是指一种无法初始化并使用 `abstract` 关键字声明的类。\n\n\
  以下是在 Java 中声明抽象类 `student` 的语法：\n\n```java\nAbstract class student {\n    // 方法和属性\n\
  }\n```\n\n请记住，我们不能创建抽象类的对象。这样做将产生编译错误。\n\n#### 抽象类的继承\n\n以下是一个说明抽象类继承的 Java 程序：\n\
  \n```java\nAbstract class student {\n    public void displayinfo() {\n        system.out.println(\"\
  i am a student\");\n    }\n}\n\nClass grade extends student {\n}\n\nClass main {\n\
  \    public static void main(string[] args) {\n        grade g1 = new grade();\n\
  \        g1.displayinfo();\n    }\n}\n```\n\n#### 抽象方法\n\n在 Java 中创建抽象方法，使用相同的关键字\
  \ `abstract`。其语法定义如下：\n\n`Abstract void move_to();`\n\n## 第三章：SQL 与数据库\n\n### 什么是数据库？\n\
  \n数据库是可被访问、管理和更新的数据集合。在简要讨论数据库之前，理解数据的实际含义以及如何处理数据是非常关重要的。数据通常被定义为记录和事实的集合，我们可以对它们进行计算和应用推理。\n\
  \n为了保护、保存、交付和组织数据，创建了数据库，管理整个过程的系统被称为数据库管理系统 (DBMS)。\n\n### 数据库管理系统 (DBMS) 概念\n\n\
  数据库管理系统由多个程序组成，允许用户访问数据库并通过不同的过程处理数据。由于它通常设计用于控制对数据库的访问，DBMS 中引入了各种操作和功能，使其更加高效、安全和可靠。\n\
  \n有 4 种不同的 DBMS：\n\n1. **关系型 DBMS (Relational dbms)**：这类 DBMS 以表的形式定义数据库关系。\n2.\
  \ **面向对象的关系 DBMS (Object oriented relational dbms)**：面向对象的关系 允许以……的形式存储数据。\n3. **网络\
  \ DBMS (Network dbms)**：网络 具有多对多的关系，通常用于复杂场景。\n4. **层次型 (Hierarchical)**：层次型 遵循父子关系，结构类似于树。\n\
  \n### 数据库环境与架构\n\n数据库环境被称为负责数据处理的组件，因为数据库通常存储在硬件中。\n\nDBMS 的架构通常分为三个主层：\n* 表示层 (Presentation\
  \ tier)\n* 应用层 (Application tier)\n* 数据库层 (Database tier)\n\n云数据库的架构通常分为三层，但云数据库是中心化的并设计为可访问的。\n\
  \n### 数据库的类型\n\n根据组织方式，有不同类型的数据库。\n\n关系型数据库 (Relational database)：关系型数据库是以多种方式定义、组织和访问数据的。由于是表格形式，表包含行和列。\n\
  \n分布式数据库 (Distributed database)：分布式数据库的数据存储在多个站点，这些站点通过通信链路相互连接。对于同构分布式数据库，连接的是相同类型的硬件和数据库应用程序；对于异构分布式数据库，每个位置和连接的系统可以是不同的。\n\
  \n云数据库 (Cloud database)：云数据库环境的设计旨在将数据存储在私有云、公有云或混合云中，提供了更好的扩展性和存储容量。它是业务应用程序的最佳选择。\n\
  \nNoSQL 数据库 (Noql database)：NoSQL 数据库最适合大型分布式数据，并通过关系数据库进行方便的管理。\n\n面向对象数据库 (Object\
  \ oriented database)：面向对象数据库由关系数据库支持，基于对象而非动作。\n\n最终用户数据库\n\n\n\n\n\n终端用户数据库是一个共享数据库，专门为终端用户设计和创建。由于它具有整个数据库的摘要特征，终端用户完全不需要担心在任何数据库级别上正在执行的操作。\n\
  \n# 数据库语法、数据类型和操作符\n\n标准查询语言（`sql`）用于在数据库中存储、处理和检索数据。`sql` 允许数据库管理员执行管理数据库所需的多种操作。该语言允许你通过编写简单的查询来执行查询、检索数据、插入记录、更新记录、删除记录、创建新数据库、创建新表以及在数据库中设置权限。\n\
  \n`sql` 有不同的版本，它们都支持如 `select`、`delete`、`insert`、`where` 和 `update` 等主要功能。\n\n#\
  \ 结构化查询语言 (sql)\n\n`sql` 用于 `mysql`、`sybase`、`oracle` 和 `sql server` 等关系数据库系统的语言。作为标准的数据库语言，`sql`\
  \ 允许用户描述数据、访问数据并操作关系数据库管理系统。此外，用户还可以通过结构化查询语言创建、查看和删除数据库。\n\n此过程中包含的不同组件包括优化引擎、`sql`\
  \ 查询引擎、经典查询引擎和查询调度器。为了在关系数据库管理系统中执行特定操作，我们可以使用下的命令：\n\n| 命令 | 描述 |\n| :--- | :---\
  \ |\n| `Create` | 用户可以创建新表，或数据库中的一个对象。 |\n| `Read` | 用户可以读取存储在表中的数据。 |\n| `Update`\
  \ | 更新表以修改记录。 |\n| `Delete` | 删除表中的任何记录。 |\n| `Insert` | 向表中插入一条新记录。 |\n| `Select`\
  \ | 从数据库中的表中选择特定记录。 |\n| `Alter` | 在数据库对象内进行更改。 |\n| `Drop` | 从数据库中删除整个表。 |\n\n\
  通过使用上述操作，我们可以对下方名为‘students’的示例表执行不同的操作：\n\n| 学生 ID | 学生姓名 | 市 | 学科 | 分数 | 百分比 |\n\
  | :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | William | New york | Mathematics\
  \ | 85 | 60% |\n| 2 | James | California | English | 79 | 58% |\n\n从上述表中获取记录的 `sql`\
  \ 语句具有以下语法：\n\n```\nselect * from students;\n```\n\n## 1. sql 查询\n\n为了对数据库中的表执行特定操作，我们需要使用如下所示的各种查询：\n\
  \n| 查询 | 语法 |\n| :--- | :--- |\n| `Insert into` | `insert into table_name(column1,\
  \ column2,...)` <br> `(value_1, value_2,...)` |\n| `Update` | `update table_name\
  \ set column1 = value_1, column2 = value_2.. where condition` |\n| `Delete` | `delete\
  \ from table_name where condition;` |\n| `Order by` | `select column1, ..from table_name,\
  \ order by column1, asc/desc;` |\n| `Min()` | `select min(column_name,) from table_name,\
  \ where condition;` |\n| `Max()` | `select max(column_name,) from table_name, where\
  \ condition;` |\n| `Where` | `select column1.. from table_name, where condition;`\
  \ |\n\n# Sql 链接 (joins)\n\n以带有表 a 和表 b 的关系数据库为例，表也可以通过 `sql` 连接查询进行连接。图清晰地显示了两个表是如何连接在一起以共享数据的：我们将在示例表‘patients’上实现连接子句操作：\n\
  \n**表 1：**\n| patientid | case | date |\n| :--- | :--- | :--- |\n| 4321 | 9-2011\
  \ | |\n| 8235 | 3-12-15 | |\n\n**表 2：**\n| case | patientname | City |\n| :--- |\
  \ :--- | :--- |\n| 1 | Andre | Chicago |\n| 3 | John | La |\n\n要连接这两个表，我们可以按照如下方式编写\
  \ `sql` 连接语句：\n\n```\nselect patientid, case, date from patients join patients on\
  \ case = patientname;\n```\n\n有四种不同的 `sql` 连接查询类型，被称为：\n\n* **内连接 (Inner join)**：内连接从表\
  \ a 和表 b 中选择满足连接条件的的整条记录。\n```\nselect column_name from table1 inner join table2\
  \ on table1.column_name = table2.column_name;\n```\n* **左连接 (Left join)**：左连接从表\
  \ a 选择所有记录并结合满足连接条件的表 b 的记录。\n```\nselect column_name from table1 left join table2\
  \ on table1.column_name = table2.column_name;\n```\n* **右连接 (Right join)**：右连接从表\
  \ b 选择所有记录并结合满足连接条件的表 a 的记录。\n```\nselect column_name from table1 right join table2\
  \ on table1.column_name = table2.column_name;\n```\n* **全外连接 (Full outer join)**：全外连接即使在不满足连接，也会选择表\
  \ a 和表 b 的所有记录。\n```\nselect column_name from table1 full outer join table2 on table1.column_name\
  \ = table2.column_name where condition;\n```\n\n# 合并操作符 (Union operator)\n\n为了合并两个或多个\
  \ select 语句的结果，使用了 `union` 操作符，每个列必须具有相同的数据类型。此外，select 语句中的列顺序应该是相同的。在 `sql` 中实现\
  \ `union` 操作符的语法如下：\n\n```\nselect column_name from table1 union select column_name\
  \ from table2;\n```\n\n# 分组 (Group by)\n\n`sql` `group by` 语句用于对数据库表执行列表或编号。在 `sql`\
  \ 中使用 `group by` 语句的语法如下：\n\n```\nselect column_name from table_name, where condition\
  \ group by column_name, order by column_name;\n```\n\n# 排序 (Order by)\n\n`sql` 中的\
  \ `order by` 语句用于升序或降序排序数据。实现 order by 子句的语法如下：\n\n```\nselect column_list from\
  \ table_name, where condition [order by column1, column2,] [asc | desc];\n```\n\n\
  # 高级 sql\n\n还有其他一些关键操作和子句可以执行复杂的操作。以下是高级 `sql` 功能的详细介绍：\n\n## 索引 (Indexes)\n\n`sql`\
  \ 索引被数据库搜索引擎用于优化数据处理过程。由于它们被视为特殊的查找表，索引有助于加速 where 子句和 select 查询。为了创建索引，可以使用 `create\
  \ index` 语句结合唯一约束来防止重复条目。\n\n使用 `create index` 的语法：\n```\ncreate index index_name\
  \ on table_name;\n```\n\n使用 `drop index` 的语法：\n```\ndrop index index_name;\n```\n\
  \n## 清空表 (Truncate table)\n\n`sql` 中的 `truncate table` 命令被用于删除现有表中的完整数据。\n\n基础语法：\n\
  \n```\ntruncate table table_name;\n```\n\n\n\n\n\n例如，在创建 `students` 表时为 `id` 列定义主键，我们可以使用以下\
  \ sql 语句：\n\n```sql\nCreate table students (\nid in not null ,\nfirstname varchar\
  \ ( 255 ),\nlastname varchar not null ( 255 ),\nmarks int ,\nprimary key (id)\n\
  );\n```\n\n### 外键\nsql 中的 `foreign key` 约束用于将两个表关联，其中一个表中的 `foreign key` 引用另一个表的\
  \ `primary key`。\n\n在 `studentid` 列上实现 `foreign key` 约束以创建 `student` 表的语法如下：\n\n\
  ```sql\nCreate table student (\nstudentid in not null ,\nstudentmarks int not null\
  \ ,\nclassid int ,\nprimary key (studentid),\nforeign key (classid) references students(\
  \ stude,ntid)\n);\n```\n\n### 约束和有用资源\n约束是实施在表数据列上的特定规则。通常，实施约束用于限制插入表的数据类型。最常见的包括\
  \ `not null` 约束、`default` 约束、`unique` 约束、`primary key`、`foreign key`、`check` 约束和\
  \ `index`。\n\n此外，完整性约束还可以提高关系型数据库中存在的数据的一性和准确性。通常，`primary key`、`foreign key` 和\
  \ `unique` 约束是引用完整性 (ri) 的一部分。\n\n为了提高 sql 数据库的性能，有几个可以轻松实现的因素。在编写列名时，建议使用 `select`\
  \ 语句而不是 `*` 分隔符。例如：\n\n```sql\nSelect * from students\n```\n\n此外，在语句上设置 `nocount`\
  \ 将减少 sql 服务器更新插入、删除或更新操作行所需的时间。\n\n## 第章：c\nC 编程语言于 1972 年在美国的 AT&T 贝尔实验室开发。通常，编程语言分为两大大类，即高级语言和低级语言，但\
  \ C 语言被归类为中间语言。这种语言的目的是提供内存的低级访问，并为 `php` 和 `java` 等其他主要编程语言提供了语法支持。\n\n### 介绍和简单程序\n\
  作为一种结构化语言，程序员可以通过实现不同的方法和编程技术来创建分区代码块并创建业务应用程序。此外，我们还可以在 C 库中编写新函数并在整个应用程序中重复。\n\
  \n#### 开始 C 编程\n编写 C 程序对初学者来说简单易懂。从基础程序语法开始，我们可以如下开发 C 应用程序和程序：\n\n```c\n#include\
  \ <stdio.h>\n\nInt main ()\n{\nint a = 2 ;\nprintf( \"%d\" ,a);\nreturn 0 ;\n}\n\
  ```\n\n#### 头文件\n编写 C 程序的第一部分是选择头文件。通常，头文件以 `.h` 扩展编写，并包含函数声明。要包含头文件，我们可以遵循以下语法：\n\
  \n```c\n#include <string.h>\n```\n\nC 头文件的示例：\n\n| 头文件 | 定义 |\n| :--- | :--- |\n\
  | Stdio.h | 用于定义输入和输出函数 |\n| String.h | 用于字符串处理 |\n| Stdde,f.h | 定义有用的类型和宏 |\n|\
  \ Stdlib.h | 定义内存分配 |\n| Stdint.h | 用于定义整数类型 |\n| Math.h | 用于执行数学函数 |\n\n#### 方法和变量声明\n\
  编写 C 程序的下部分是定义方法和声明变量。声明方法的语法为：\n\n```c\nInt main ()\n{\n```\n\n变量声明的语法为：\n\n```c\n\
  Int main ()\n{\nInt z;\n}\n```\n\n程序体：\n\n```c\nInt main ()\n{\nint z;\nprintf(:d,\
  \ z);\nreturn 0 ;\n}\n```\n要终止程序，我们可以使用 return 语句：`return 0`。\n\n#### 关键字\n关键字是任何编程语言的主力，也被称为保留字。虽然高级语言有多个关键字，但\
  \ C 语言只允许使用 32 个关键字，如下：`Double`,`Long`, `Int`,`Switch`,`Case`,`Enum`,`Type`,`Union`,`Const`,`For`,`Do`,`While`,`Static`,`Default`,`Auto`,`Break`,`else`,`Struct`,`Float`,`Short`,`Char`,`Return`,`Void`,`Continue`,`If`,`Goto`,`Sizeof`,`Volatile`（注）。\n\
  \n#### 数据类型和变量\n在 C 语言中，数据类型用于定义变量，以便在程序中使用之前分配存储。C 语言的内置数据类型包括 `float`、`int` 和\
  \ `double`。这些数据类型有 `signed` 和 `unsigned` 修饰符。以下是 C 语言允许的有效数字、字母和符号：\n\n#### 字母：a-z,\
  \ A-Z\n- 符号：- ~ ! # % ^ & * ( ) _ - = | \\ { } ] : ; ' < > . \n- 数字：0,1,2,3,4…\n\
  \n#### 变量\n在 C 中声明变量，我们可以遵循以下程序语法：\n\n```c\n#include <stdio.h>\n// 变量声明：\nextern\
  \ int a, b;\nextern int c;\nInt main () {\n/* 变量定义： */\nint a, b;\nint c;\nfloat\
  \ f;\n/* 初始化 */\na = 30 ;\nb = 20 ;\nc = a + b;\nprintf( \"value of c : %d \\n\"\
  \ , c);\nreturn 0 ;\n}\n```\n程序的输出是：50。\n\n#### 变量的作用域\n任何编程语言变量的作用域用于允许变量设置权限。通常变量被分为局部变量、全局变量和形式参数。\n\
  \n局部变量声明在块内，仅供特定区域的语句使用。由于它们对其他函数未知，我们无法在函数外部访问局部变量。\n\n全局变量通常在函数外部并在程序过程中保持其值。它可以被程序中的任何函数访问和调用。局部变量需要程序员初始化，而全局变量会自动初始化。\n\
  \n### 循环和函数\n### 循环\n循环是每个编程语言的重要部分，允许开发者多次执行特定语句。C 编程语言中有 4 种类型的循环，简介如下：\n\n1.\
  \ for 循环：用于按指定次数执行语句，也被认为可以简化处理循环变量的代码。\n2. while 循环：重复给定语句并检查给定条件为真还是假。在执行循环体之前，它检查所有条件。\n\
  3. do while 循环：工作与 while 循环相同，但 do while 循环在最后检查条件。\n4. 嵌套循环：循环内部循环被称为嵌套循环。\n\n\
  为了从正常顺序改变循环的执行，我们还可以使用循环控制语句。`break`语句退出循环并将执行转移到下一语句，而 `continue`语句导致循环跳过体的其余部分并重新检查给定条件。\n\
  \n为了将控制权转移到标记语句，我们可以使用 `goto` 。\n\n#### 函数\n为了在 C 编程语言中定义函数，建议使用以下语法：\n\n```c\n\
  返回类型,函数名( 参数列表) {\n函数体\n}\n```\n\n\n\n\n在函数中，返回类型被称为函数本身返回的函数值的数据类型，而函数的动作名称被称为函数名。每当函数被调用时，我们都要求传递一个参数，其值被称为参数或实参参数。必须注意的是，参数并不是强制性的，函数也可以在不带任何参数的情况下执行。\n\
  \n函数体包含多个语句，通常定义了在函数内部要执行的动作。为了在 C 语言中声明一个 `min()` 函数，我们可以使用如下语法：\n\n```\nInt min(int\
  \ num1, int num2);\n```\n\n在程序中调用函数时，我们需要传递参数和函数名。如果函数返回了任何值，也可以将其存储起来。\n\n## 向函数传递参数的方法\n\
  \n### 值传用（Call by value）\n值传用方法用于将实际值从参数复制到函数的形参数中。对参数所的更改对函数内的参数没有直接影响。\n\n###\
  \ 引用传值（Call by reference）\n引用传值方法用于将参数的地址复制到形参数中。对参数的更改会直接影响参数。\n\n## 数组、字符串和链表\n\
  \n#### 数组\n数组是元素的集合，可以存储固定大小的相同类型的顺序数据，由连续的内存位置组成，数组可以通过以下语法声明：\n\n```\nType arrayname,\
  \ [arraysize];\n```\n\n示例：\n```\n3\n5\n6\n8\n10\n20\n```\n\n所有数组的第一个元素的索引均为 0，这也被称为基索引。注意，数组的大小在声明后不能更改。在\
  \ C 语言中初始化数组，我们可以使用如下语句：\n\n```\nInt data[50];\n```\n\n要初始化数组，我们可以使用下面提到的语法：\n\n\
  ```\nInt data[10] = {3, 2, 7, 8, 23, 42, 64, 73, 23, 77};\n```\n\n在这个数组中，索引 `0`\
  \ 的值为 `3`，而索引 `9` 的值值为 `77`。\n\n下面是一个使用 C 语言编程中的数组寻找 5 个整数平均值的示例：\n\n```c\n#include\
  \ <stdio.h>\n\nInt main ()\n{\nint avg = 0 ;\nint sum =0 ;\nint x =0 ;\nint num[\
  \ 4 ];\nfor (x =0 ; x <5 ;x++ )\n{\nprintf( enter number %d \\n \", (x +1));\nscanf(\
  \ \"%d\", & num[x]);\n}\nfor (x =0 ; x <5 ;x++ )\n{\nsum = sum + num[x];\n}\navg\
  \ = sum /5 ;\nprintf( average of entered number is: %d\", avg);\nreturn 0 ;\n}\n\
  ```\n\n### 二维数组和三维数组\nC 编程语言也支持 2 维和 3 维的多维数组。为了初始化二维数组，我们使用以下语法：\n\n```\nInt z[2][3]\
  \ = {\n{0, 1,}\n{2, 3, 4}\n{5,6,9}\n};\n```\n\n或者\n\n```\nInt z[2][3] = {0, 1, 2,\
  \ 3 , 4, 5, 6, 9};\n```\n\n#### 字符串\n在 C 编程中，字符串是通过使用字符的一维数组创建的。字符串必须由空字符终止，也称为\
  \ `\\0`。\n\n在 C 中声明字符串，我们可以遵循下面提到的语法：\n\n```\nChar str_name,[size];\n```\n\n`‘str_name,’`\
  \ 用于定义字符串，而大小告诉我们字符串的长度。\n\n下面的 C 程序编写用于声明、读取和打印字符串：\n\n```c\n#include<stdio.h>\n\
  \nInt main ()\n{\n// 声明字符串\nchar str[ 10 ];\n// 读取字符串\nscanf( \"%s\",str);\n// 打印字符串\n\
  printf( \"%s\",str);\nreturn 0 ;\n}\n```\n\n## 指针和结构体\n指针是一个值的变量，其值与程序中另一个变量的地址相同。由于它具有指向内存位置的地址，我们可以提前声明指针并将其存储在任何变量地址。声明指针变量的语法如下：\n\
  \n```\nType *var;\n```\n\n要使用指针，我们首先需要定义指针变量并将变量的地址赋值给指针。接下来我们可以从指针变量给出的地址访问值。整个操作都是通过\
  \ `*` 运算符完成的，该运算符返回定义的变量地址的值。必须注意的是，普通变量存储值，而指针变量存储变量地址。空指针的值为 0，任何指针的大小均为 2 字节。下面是一个用\
  \ C 语言指针编写的示例程序：\n\n```c\n#include <stdio.h>\nInt main ()\n{\nint *ptr, q;\nq =100\
  \ ;\nptr= &q;\nprintf( \"%d\",*ptr);\nreturn 0 ;\n}\n```\n\n### 结构体\n结构体定义为变量的集合，允许程序员组合不同的数据类型。结构体可以类似于数组，但唯一的区别是数组只能持有相似类型的数据。以组织为例，我们可以使用结构体来管理员工的记录：\n\
  \n*   姓名\n*   员工 ID\n*   职位\n*   区域\n\n在 C 语言中定义结构体的语句为：\n\n```\nStruct employee\
  \ {\nchar name[10];\nint employee_id;\nchar designation[50];\nchar region[100];\n\
  };\n```\n\n在编译时初始化结构体的语句为：\n\n```\nStruct employee = {34,12};\n```\n\n### 访问结构体\n\
  为了访问结构体，我们需要使用访问运算符。要在 C 语言中访问结构体的成员，可以使用下面的运算符：\n\n*   成员运算符：`.`\n*   结构体指针运算符：`->`\n\
  \n访问结构的示例程序：\n\n```c\n#include <stdio.h>\nStruct distance {\nint feet;\nfloat inch;}\
  \ dist1, dist2, sum;\n\nInt main ()\n{\nprintf( 1st distance, \\n );\nprintf( enter\
  \ feet: \");\nscanf( \"%d\", &dist1.feet);\nprintf( enter inch: \");\nscanf( \"\
  %f\", &dist1.inch);\nprintf( 2nd distance, \\n );\nprintf( enter feet: \");\nscanf(\
  \ \"%d\", &dist2.feet);\nprintf( enter inch: \");\nscanf( \"%f\", &dist2.inch);\n\
  sum.feet = dist1.feet + dist2.feet;\nsum.inch = dist1.inch + dist2.inch;\nwhile\
  \ (sum.inch >= 12 )\n{\n++sum.feet;\nsum.inch = sum.inch - 12;\n}\nprintf( sum of\
  \ distances = %d '-%.1f \", sum.feet, sum.inch);\nreturn 0 ;\n}\n```\n\n输出：\n![image_rsrcF9.jpg](img/image_rsrcF9.jpeg)\n\
  \n### 结构体指针\n我们也可以 C 编程语言中定义结构体指针，这与定义指向另一个变量指针的方法相同。通过指针访问结构体的成员，可以考虑以下语法：\n\n\
  ```\nStruct_pointer->title;\n```\n\n## C 编程文件\n编程要求开发者使用最有效的方法处理不同的需求和场景。为了在 C 语言中执行文件操作，我们可以使用以下操作：\n\
  \n*   `fprint(f)`\n*   `fscanf()`\n*   `fread()`\n*   `fwrite()`\n*   `fseek()`\n\
  \n通常，程序终止时所有数据都会丢失，因此我们需要创建一个包含所有数据的特定文件。它还节省了时间，并允许程序员通过输入几个命令从文件中访问数据，并通过 C 语言运算符将数据传输到另一台计算机。\n\
  \n\n\n\n文件分为两类：文本文件和二进制文件。文本文件是 `.txt` 文件，可以使用记事本创建，并且在写入、维护和更新记录时所需的精力最少。二进制文件是\
  \ `.bin` 文件，它们以 0 和 1 的二进制形式存储数据。此外，与文本文件相比，二进制文件可以存储更多的数据。\n\n在 C 编程语言中，我们可以通过下表提到的简单命令创建新文件、打开现有文件、从文件中读取和写入信息，以及关闭文件：\n\
  \n| 操作 | 语法 |\n| :--- | :--- |\n| 打开文件 | `Ptr = fopen(\"file_open\", \"mode\")`\
  \ |\n| 关闭文件 | `fclose(fptr);` |\n| 写入二进制文件 | `fwrite(address_data, size_data, numbers_data,\
  \ pointer_to_file);` |\n| 从二进制文件读取 | `fread(address_data, size_data, numbers_data,\
  \ pointer_to_file);` |\n| 写入文本文件 | `File *fptr; Fptr = fopen(\"file_address\", \"\
  w\");` |\n| 从文本文件中读取 | `File *fptr; Fptr = fopen(\"file_address\", \"r\");` |\n\
  | 文件定位 | `fseek(file, *stream, long int offset, int whence);` |\n\n### 让 C 编程变得简单的实要技巧\n\
  \n对于初学者，建议始终通过在 `/*` 和 `*/` 之间编写关键代码信息来对代码进行注释。对代码的大部分进行注释也可以便于日后的更改并改进程序的功能。此外，始终使用变量来存储数据（如\
  \ `int`、`char` 和 `float`），因为这会让你更简单地执行不同的操作和计算。\n\nC 语言简单且快速。凭借指针、关键字和位运算符的使用，对于初学者来说，编写高效的代码无疑不是一个问题。\n\
  \n## 第五章：C++\n\nC++ 是一种由 Bjarne Stroustrup 在 1979 年开发的自由形式且中间级编程语言。作为 C 编程语言的增强版本，C++\
  \ 现在已成为最常用且最适合初者的语言。该语言提供了约 7 种不同的编程风格，你可以根据自己的需求选择最合适的风格。作为一种静态类型编程语言，C++ 允许编译器在执行程序之前列出错误或\
  \ Bug。此外，使用 C++ 进行面向对象的编程使得解决复杂问题变得方便，并扩展了标准库的使用。\n\nC++ 是世界上最流行的编程语言，广泛应用于图形用户界面、操作系统和嵌入式系统。\n\
  \n#### 基础语法\n\nC++ 编程语言的基础语法与 C 等其他语言相同。包括各种单词、符号、字符、操作和表达式，程序员必须遵循一组预定义的规则来正确执行程序。\n\
  \n这里是我们可以开始学习 C++ 时编写的第一个程序：\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
  int main()\n{\ncout << \"my first program in c++\";\nreturn 0;\n}\n```\n\n程序输出：my\
  \ first program in c++. \n\n![image_rsrc9FB.jpg](img/image_rsrc9FB.jpeg)\n\n![image_rsrc9FC.jpg](img/image_rsrc9FC.jpeg)\n\
  \n程序的详情如下：\n\n- `#include<iostream>`：该语句包含预定义的输入和输出函数，并通知编译器包含该文件。\n- `using namespace\
  \ std;`：一种用于存储程序内函数和操作的语句，其中 `std` 被视为命名空间名。\n- `int main()`：这是程序的主函数，执行从这里开始。`int`\
  \ 是返回类型，指示编译器返回一个整数值，我们也必须在末尾加上 `0`。\n- `cout << \"my first program in c++\"`：`cout`\
  \ 是一个属于 iostream 的对象，用于显示内容。\n- `return 0;`：该语句从 `main()` 返回 0，负责主函数的执行。\n\n###\
  \ 变量和数据类型\n\n变量是 C++ 语言中不同类型的标识符，因为它们是通过特定的关键字定义的。我们必须按照给定的语法创建变量、指定类型并赋值：\n\n`Type\
  \ variable = value;`\n\n变量的类型\n- `int`：用于存储整数和全数。例如，`4563`。\n- `char`：用于存储单个字符。例如，'a'\
  \ 或 'z'。\n- `double`：用于存储浮点数。例如，`50.21342`。\n- `bool`：用于存储具有两种状态的值：真（true）或假（false）。\n\
  - `string`：用于存储文本。例如，\"c++ language\"。\n\n要声明变量并为变量赋值，我们可以按照下面提到的语法：\n\n```cpp\n\
  int newnum;\nnewnum = 50;\ncout << newnum;\n```\n\nC++ 中使用的每个变量都应该用唯一的名称标识，这些名称被称为标识符。为了构造标识符，必须包含字母、数字或下划线，并且区分大小写。\n\
  \n## 数据类型\n\nC++ 编程语言中的数据类型定义了可以在变量中存储的数据类型。通常，C++ 中的数据类型分为三类：内置的、派生的和用户定义的。用户定义的数据类型包括结构（struct）、联合体（union）和枚举（enum），而派生数据类型基于数组、函数和指针。\n\
  \nC++ 的内置数据类型：\n- `int`\n- `char`\n- `float`\n- `double`\n- `bool`\n\n用户定义的数据类型：\n\
  - `union`\n- `enum`\n- `struct`\n\n派生数据类型：\n- `function`\n- `array`\n- `pointer`\n\
  \n### 修饰符和存储类\n\nC++ 编程语言中的修饰符用于 `char`、`double` 和 `int` 数据类型，以改变基本类型的含义以满足某些编程条件。修饰符包括\
  \ `signed`、`unsigned`、`long` 和 `short`。\n\n为了定义 C++ 程序中变量和函数的作用域，可以使用存储类 `auto`、`register`、`extern`、`mutable`\
  \ 和 `static`。`auto` 存储类是所有局部变量的默认值，而 `static` 存储类允许编译器在程序生存期间存储局部变量，并在离开作用域时删除。`extern`\
  \ 存储类提供全局变量的引用，用于多个文件使用同一个全局函数或变量的情况。对于 `mutable` 存储类，只考虑类对象，并且也可以被常量成员函数修改。\n\n\
  ### 控制流\n\n在 C++ 中，控制流是指程序运行时指令、函数和状态被评估和执行的顺序。这些状态在代码内部从上到部执行，以完全满足程序逻辑。程序并不依赖线性状态序列，C++\
  \ 提供了特定的控制流状态。\n\nC++ 控制流状态：\n1. `if else`\n2. `for` 循环\n3. `do while` 循环\n4. `break`\
  \ & `continue`\n5. `switch` 状态\n6. `goto` 状态\n\n#### If 语句\n\n在 C++ 编程中，`if` 语句用于程序中有多个需要执行的状态或情况。`if`\
  \ 语句的语法显示，只有在给定状态为真时才会执行括号内的内容；`else` 则假状态会被自动忽略。\n\n\n\n\n\n```cpp\nif(condition){\n\
  \  state,me,nt;\n}\n```\n\n### if state,me,nt 的流程图：\n\n用于说明 C++ 中 if state,me,nt\
  \ 的示例程序：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
  \  int marks = 80;\n  if (marks < 100) {\n    cout << \"marks are less than 100\"\
  ;\n  }\n  if (marks > 100) {\n    cout << \"marks are greater than 100\";\n  }\n\
  \  return 0;\n}\n```\n\n### 嵌套 if state,me,nt\n在 C++ 中，嵌套在 state,me,nt 内部的 state,me,nt\
  \ 被称为嵌套 if state,me,nt。例如：\n\n```cpp\nif (condition_1) {\n  State,me,nt1;\n  if\
  \ (condition 2) {\n    State,me,nt2;\n  }\n}\n```\n\n### If else, state,me,nt:\n\
  ```cpp\nif (condition_1) {\n  State,me,nt;\n  else (condition 2) {\n    State,me,nt;\n\
  \  }\n}\n```\n\n### Switch case\nC++ 编程中的 switch case, state,me,nt 用于当程序中给出多个条件，并且我们需要根据提供的条件执行相应操作时。`break`\
  \ 和 `continue` 操作也是 switch state,me,nt 的重要组成部分。C++ 中 switch case 的语法如下：\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\n\nint main() {\n  int num = 10;\n  switch\
  \ (num + 5) {\n    case 1:\n      cout << \"case,1: value, is: \" << num << endl;\n\
  \    case 2:\n      cout << \"case,2: value, is: \" << num << endl;\n    case 3:\n\
  \      cout << \"case,3: value, is: \" << num << endl;\n    default:\n      cout\
  \ << \"de,fault: value, is: \" << num << endl;\n  }\n  return 0;\n}\n```\n\n###\
  \ Go to state,me,nt\nC++ 中的 go to state,me,nt 用于改变程序的执行流，并将控制转移到同一程序内另一个带有标记的 state,me,nt。\n\
  \ngo to state,me,nt 的语法：`goto label;`\n\n## 循环与函数\n\n### 循环\nC++ 编程语言中的循环 state,me,nt\
  \ 用于按特定次数的迭代执行特定的代码块，直到满足提供的条件。由于它们允许程序员同时执行多项任务，循环 state,me,nt 会执行函数中的第一个 state,me,nt\
  \ 并根据需要移动到下一个。\n\n##### 循环类型\n- **While 循环**：当提供的条件为真时重复 state,me,nt，并在执行循环体之前重新检查。\n\
  - **Do while 循环**：在循环执行期间检查条件。\n- **For 循环**：多次执行特定的 state,me,nt 并同时管理循环变量。\n- **嵌套循环**：在一个循环内部包含另一个循环。\n\
  \n循环可以通过不同的控制 state,me,nt 执行，如 `break` state,me,nt、`continue` state,me,nt 和 `goto`\
  \ state,me,nt。\n\n#### 函数\n函数负责将不同的代码段组合并一起执行，以完成给定的操作。C++ 编程语言中的两种主要函数类型包括库函数和自定义函数。库函数是在\
  \ C++ 中预定义的，而用户定义函数是由程序员自己创建的。\n\n定义一个函数，我们可以使用以下语法：\n\n```cpp\nreturn_type function_name(parameter\
  \ list) {\n  function body\n}\n```\n\n`min()` 函数的示例代码：\n```cpp\nint min (int num1,\
  \ int num2) {  //函数声明\n  // 局部变量声明\n  int result;\n  if (num1 < num2)\n    result\
  \ = num1;\n  else\n    result = num2;\n  return result;\n}\n```\n\n##### 函数调用\n\
  在 C++ 中调用函数，我们可以使用以下方法：\n- 引用传递。\n- 值传递。\n- 指针传递。\n\n##### 函数重载\n当两个或多个函数具有相同的名称但具有不同的参数时，该过程被称为重载函数。C++\
  \ 中函数重载的语法如下：\n\n```cpp\nvoid same_function(int a);\nint same_function(float a0);\n\
  void same_function(int a, double, b);\n```\n\n## 数组、字符串、指针和引用\n\n#### 数组\n数组在编程语言中被广泛使用，因为允许我们处理大量相同类型的数据。通常，数组被用作存储固定数量数值的数据集合。\n\
  \n在 C++ 中声明数组的语法：\n`datatype arrayname[size];`\n\n初始化：\n`int age[5] = {15, 20, 25,\
  \ 30};`\n\n使用数组求和的 C++ 示例程序：\n```cpp\n#include <iostream>\nusing namespace std;\n\
  \nint main() {\n  int nummers[10], sum = 0;\n  for (int i = 0; i < 10; i++) {\n\
  \    cin >> nummers[i];\n    sum += nummers[i];\n  }\n  cout << \"sum = \" << sum;\n\
  \  return 0;\n}\n```\n\n#### 字符串\n字符串被用作字符集合。在 C++ 中，常见的类型有字符串和标准库。可以使用以下语法来定义字符串：\n\
  `char str[] = \"programming\";`\n\n指针被用作值，指向内存地址。在 C++ 中，使用以下操作符访问变量的内存地址：\n\n####\
  \ 类\n类是创建对象的蓝图。它是一种自定义类型。定义类的语法：\n`class name {`\n\n类可以定义为私有的（private）或受保护的（protected），这样数据只能在程序内部访问。示例代码：\n\
  ```cpp\nclass student {\nprivate:\n  char name[20];\n  int rollno;\n  float total;\n\
  \npublic:\n  // 获取学生详情的函数\n  void getdetails(void);\n  // 打印学生详情的函数 void putdetails(void);\n\
  };\n```\n\n### 继承与多态\n在编写实现继承的程序时，我们可以考虑基类和派生类的概念。由于类可以派生自一个或多个类，派生类可以访问基类的所有非私有成员，同时也可以从现有类创建一个新类。C++\
  \ 中继承的语法为：\n\n```cpp\nclass a { // 基类 };\nclass b : public a { // 派生类 };\n```\n\n\
  #### 访问修饰符\n在 C++ 中，访问修饰符用于确定类之外成员的可用性限制。主要的访问修饰符有私有（private）、受保护（protected）和公共（public）。\n\
  \n在创建类时使用私有访问修饰符，使基类的受保护和公共数据成员变为派生类的私有成员，而基类的私有成员仍保持为私有。\n\n在受保护（protected）访问修饰符中，基类的公共和受保护数据成员变为派生类的受保护成员。基类的私有成员仍然无法访问。\n\
  \n在创建类时使用公共（public）访问修饰符，使基类的数据成员变为派生类的公共成员。基类的私有和受保护成员仍然无法访问。\n\n\n\n\n当基类的公共数据成员变为派生类的公共成员时，会使用访问限定符。受保护成员在派生类中变为受保护状态，而基类的私有成员保持不可访问。\n\
  \n在 c++ 中使用访问限定符的语法如下：\n\n```cpp\nClass myclass { // class\n\nPublic : // access\
  \ specifier\n\n// class members\n};\n```\n\n### 友函数、数据结构与封装性\n\n#### 友函数\n在面向对象编程中，非成员函数无法访问对象的私有和受保护数据。为了允许访问私有或受保护数据，我们可以使用友函数或友类，这允许程序员访问类的私有和受保护数据。\n\
  \n该函数通过 `friend` 关键字声明，并应该在类体内使用。在 c++ 编程语言中声明友函数，可以使用下述语法：\n\n```cpp\nClass class_name\n\
  {\nfriend return_type function_name(argument);\n}\n```\n\n#### 数据结构\n虽然为了明确本主题的目标，需要深入介绍数据结构，但我们将讨论如何在\
  \ c++ 中定义和使用结构（structure）。结构是一种用户定义类型，可以通过以下语法在程序中实现：\n\n```cpp\nStruct [structure,\
  \ tag]\n{\nmember definition;\n}\n```\n\n例如：\n\n```cpp\nStruct vehicle {\nchar name[50];\n\
  char category[100];\nint model,l_year;\n} vehicle;\n```\n\n要访问结构中的任何成员，我们可以使用成员访问运算符（`.`）。通过数据结构定义结构体指针变得简单，我们可以使用以下语法：\n\
  \n```cpp\nStruct vehicle *struct_pointer;\n```\n\n#### 封装性\n“封装”（encapsulation）一术语定义为编程中向用户隐藏敏感数据的方法。为了执行封装，我们需要将类变量和属性声明为私有（private），并通过\
  \ getter 和 setter 方法读取或修改私有成员的值。访问私有成员的语法定义如下：\n\n```cpp\n#include <iostream>\n\n\
  Using namespace std;\n\nClass employee {\nprivate:\n    // private attribute\n \
  \   int salary;\n\npublic:\n    // setter\n    void setsalary(int s) {\n       \
  \ salary = s;\n    }\n    // getter\n    int getsalary() {\n        return salary;\n\
  \    }\n};\n\nInt main() {\n    employee myobj;\n    myobj.setsalary(50000);\n \
  \   cout << myobj.gettsalary();\n    return 0;\n}\n```\n\n### 文件处理\n在 c++ 编程语言中，我们一直使用\
  \ `cin` 和 `cout` 方法在程序中读写数据。为了从文件中读写数据，c++ 提供了一个名为 `fstream` 的标准库，其中包含 `ifstream`、`ofstream`\
  \ 和 `fstream` 数据类型。\n\n要打开文件可以使用 `fstream` 或 `ofstream` 对象，其 c++ 语法定义如下：\n\n```cpp\n\
  Void open(const char *filename, ios::openmode mode);\n```\n\n关闭文件的语法：\n\n```cpp\n\
  Void close();\n```\n\n### C++ 语言特性与支持\nC++ 编程语言提供了丰富的库支持和标准模板库 (stl) 函数，用于快速编写代码。作为一种面向对象的编程语言，我们可以专注于对象并执行不同类型的操作和实现，而与其他与其他主要语言不同，c++\
  \ 提供了如下支持。\n\n由于其快速、可靠和安全的特性，c++ 广泛应用于操作系统、图形和数据库的开发。该语言速度快，并以其高效性著称，此外 c++ 还允许异常处理并支持函数重载。\n\
  \n### C#：概述与基础语法\n\n#### 概述\nC# 是由微软开发的一种编程语言，用于 .NET 框架。该语言基于面向对象编程，并与 c++ 等其他编程语言具有相同的基础语法。C#\
  \ 为通用基础设施 (cli) 开发，其由运行时环境和可执行代码组成。由于易学习，c# 是最好的编程语言之一，因为它们生成高效的程序并在不同的平台上编译。\n\n\
  为了运行 c# 应用程序和程序需要 .NET 框架，它可以用于编写 Windows 应用程序和服务。c# 的开发环境 (ide) 包括 Visual Studio。\n\
  \n#### 基础语法\n基于面向对象编程，c# 编程的核心在于类和对象。以学生类为例，它具有名称、ID 和年级等属性，虽然每个学生的属性是相同的，但他们每个人都有不同的名称、ID\
  \ 和年级，这些被称为对象属性。通常，一个 c# 程序由命名空间声明、类方法、主方法和语句组成。\n\n这里是一个在 c# 中打印“welcome to c#\
  \ programming”的简单程序：\n\n```csharp\nUsing system:\nnamespace csharp programming\n\
  class programming {\n    // main function\n    static void main(string[] args) {\n\
  \        Console.WriteLine(\"welcome to c# programming\");\n        Console.ReadKey();\n\
  \    }\n}\n```\n\n基础语法的细节：\n- `Using system`：用于为程序包含系统命名空间。\n- `Namespace declaration`：程序内类的集合。\n\
  - `Class declaration`：包含程序中所使用的数据和方法的类。\n- `Static void main()`：`static` 关键字表示该方法可以在不实例化类的情况下被访问。\n\
  - `Console.WriteLine()`：用于定义系统命名空间的方法。\n- `Console.ReadKey()`：让计算机等待下一个命令并防止屏幕关闭。\n\
  \n#### 数据类型与变量\n数据类型是任何编程语言的组成部分，因为它们指定了语言支持的数据类型。由于它们在 c# 中是预定义的，数据类型分为三大类：值数据类型、引用数据类型和指针类型。\n\
  \n值数据类型变量派自 `System.ValueType` 类，包含字母和数字形式的数据。下表显示了 c# 编程语言中使用的值类型：\n\n| 数据类型 |\
  \ 表示形式 | 默认值 | 范围 |\n| :--- | :--- | :--- | :--- |\n| Byte | 8 位无符号整数 | 0 | 0 到\
  \ 255 |\n| Decimal | 128 位精确小数 | 0.0 | -7.9 x e²⁸ 到 7.9 x e²⁸ |\n| Bool | 布尔值 |\
  \ False | True/false |\n| Float | 32 位单浮点类型 | 0.0m | -3.4 x e³⁸ 到 + 3.4 x e³⁸ |\n\
  | Double | 0.0d | (+/-)5.0 x e⁻³²⁴ 到 (+/-)1.7 x e³⁸ |\n| Char | 16 位 Unicode 字符\
  \ | ‘\\0’ | U+0000 to u+ffff |\n| Int | 32 位符号整数类型 | 0 | -2,147,483,648 to 2,147,483,647\
  \ |\n| Short | 16 位符号整数类型 | 0 | -32,768 to 32,767 |\n| Long | 64 位符号整数类型 | 0l |\
  \ -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |\n\n2. 引用数据类型,\n\n\n\n\
  \n引用数据类型存储的是变量的引用，而不是存储实际数据。通过使用多个变量，引用类型可以指向同一个内存位置，如果内存位置被其中一个变量更改，另一个变量的值也会随之改变。\n\
  \n### 3. 对象类型 (object type)\n\n对象数据类型被认为是 C# 中所有数据类型的基类。此外，对象类型还可以分配其他类型的值、引用类型、定义类型和值类型。\n\
  \n### 4. 指针数据类型\n\n指针数据类型包含变量值的内存地址，其语法如下：\n\n`Type* identifier;`\n\n### 运算符\n\n\
  C# 使用运算符的方式与 `c` 和 `c++` 等其他主要编程语言相同。内置运算符集包括算术运算符、关系运算符、位运算符、逻辑运算符、杂运算符和赋值运算符。\n\
  \n### 函数与方法\n\n在 `c` 编程语言中，函数允许程序员封装代码的特定部分，并在代码的其他部分利用它。由于它消除了重写代码的需求，我们可以从多个地方访问函数并执行所需的操作。`c`\
  \ 中的函数使用以下语法声明：\n\n```\n<visibility> <return type> <name>(<parameters>)\n{\n<function\
  \ code>\n}\n```\n\n被称为成员函数或类成员的函数在 `c` 编程语言中也被称为方法。通常，`c` 中有两种方法，称为实例方法和静态方法。\n\n\
  函数可以返回任何类型的数据，并且执行多条语句，如 `read`、`follow` 和 `run`。\n\n在 `c` 中使用函数的示例程序：\n\n```csharp\n\
  using system;\n\nClass return2\n{\n    static string lastfirst(string firstname,\
  \ string lastname)\n    {\n        string separator = \", \";\n        string result\
  \ = lastname + separator + firstname;\n        return result;\n    }\n    static\
  \ void main()\n    {\n        console.WriteLine(lastfirst(\"john\", \"william\"\
  ));\n        console.WriteLine(lastfirst(\"james\", \"lewis\"));\n    }\n}\n```\n\
  \n### 数组、字符串和结构体\n\n#### 数组\n\n数组用于存储具有相同数据类型的固定大小元素集合。由于具有连续的内存位置，可以使用以下语法在 `c`\
  \ 编程语言中声明数组：\n\n`Datatype[] arrayname;`\n\n初始化：\n`Int [] age = new age[20]`\n\n\
  在 `c` 编程语言中声明和访问数组的示例程序：\n\n```csharp\nusing system;\nnamespace arrayapplication\
  \ {\n    class myarray {\n        static void main(string[] args) {\n          \
  \  int [] n = new int[20]; /* n 是一个包含 20 个整数的数组 */\n            int i,j;\n     \
  \       /* 初始化数组 n 的元素 */\n            for (i = 0; i < 20; i++) {\n            \
  \    n[i] = i + 100;\n            }\n            /* 输出每个数组元素的值， */\n           \
  \ for (j = 0; j < 10; j++) {\n                console.WriteLine(\"element[{0}] =\
  \ {1}\", j, n[j]);\n            }\n            console.ReadKey();\n        }\n \
  \   }\n}\n```\n\n#### 字符串\n\n我们可以在 `c` 编程中使用 `system.string` 关键字创建字符串。为了创建一个字符串对象，我们可以采用不同的方法，例如将字符串字面量赋值给字符串变量、使用连接运算符\
  \ (`+`）、调用格式化方法转换值，或通过使用字符串构造函数。\n\n语法：\n`String []array={\"this\", \"is\", \"c#\"\
  };`\n\n#### 类与对象\n\n类被定义为对象类型的表示以及以及数据类型的蓝图。在 `c` 编程中，类的定义以关键字 `class`、类名和类体开始。访问类中的成员允许访问成员，其中类的默认访问权限被称为\
  \ `internal`（内部的）。为了访问成员，我们可以使用 `.` 运算符。它还将对象的名称与成员的名称联系起来。类也被视为一种引用类型，在我们使用 `new`\
  \ 运算符创建类的实例之前，该变量包含 `null` 值。在 `c` 中声明类，可以遵循以下语法：\n\n```csharp\nPublic class student\n\
  {// 属性，方法}\n```\n\n示例：\n`Myclass student = new myclass();`\n`Myclass student2 =\
  \ student;`\n\n#### 创建对象\n\n在 `c` 编程中，对象完全基于类。类定义了一种类型的对象。它也被称为类的实例，可以使用以下语法创建：\n\
  \n`student object1 = new student();`\n\n一旦创建了类的实例，对象引用就会自动传回。例如：\n`student object2\
  \ = new student();`\n`student object3 = object2;`\n\n以下程序展示了如何在 `c` 编程语言中创建对象：\n\
  \n```csharp\nusing system;\nnamespace tutorial {\n    Class program\n    {\n   \
  \     Static void main(string[] args)\n        {\n            users user = new users(\"\
  harry\", 20);\n            user.userDetails();\n            console.WriteLine(\"\
  press enter to exit..\");\n            Console.ReadLine();\n        }\n    }\n}\n\
  Public class users\n{\n    Public string name {get; set; }\n    Public int age {get;\
  \ set; }\n    Public users(string name, int age)\n    {\n        Name = name;\n\
  \        Age = age;\n    }\n    Public void userDetails()\n    {\n        console.WriteLine(\"\
  name: {0}, age: {1}\", name, age);\n    }\n}\n```\n\n### 继承与多态\n\n## 继承\n\n继承是 `c`\
  \ 的重要部分，因为它是一种面向对象的编程语言。它允许程序员重用具有相同功能的类，继承的工作方式类似于父子关系。父类被视为基类，而子类被称为派生类，它继承了父类的所有功能。\n\
  \n语法：\n`<access-specifier> class <base_class> {... }`\n`Class <derived_class> :\
  \ <base_class> {... }`\n\n对于多级继承：\n```csharp\nPublic class a\n{\n// implementation\n\
  }\nPublic class b : a\n{\n// implementation\n}\nPublic class c : b\n{\n// implementation\n\
  }\n```\n\n#### 多态\n\n多态是指通过单一操作执行多种功能的技术。静态多态在编译时执行，而动态多态在运行时决定。\n\n在静态多态中，`c` 允许程序员实现以下两种方法：\n\
  \n**函数重载**\n\n函数重载在给定的范围内为同一个函数名提供多个定义。此外，函数定义在类型上必须不同，以便你不会重载返回类型不同的函数声明。\n\n**构造函数**\n\
  \n\n\n\n\n在 C# 编程中，每当创建结构体或类时，构造函数会被自动调用。由于一个类可以有多个构造函数来处理不同的参数，构造函数还允许程序员设置实例化限制和默认值。\n\
  \n### 创建构造函数的语法：\n\n```csharp\npublic class person\n{\n    private string last;\n\
  \    private string first;\n\n    public person(string lastname, string firstname)\n\
  \    {\n        last = lastname;\n        first = firstname;\n    }\n    // remaining\
  \ implementation of person class.\n}\n```\n\nC# 编程中使用的三种构造函数分别称为实例构造函数、静态构造函数和私有构造函数。\n\
  \n### 异常处理\n\n异常是将控制权从程序一段转移到另一段的方式。通常，异常被视为程序执行期间出现的问题。为了捕获这种情况，C# 提供了多种异常处理方法，即\
  \ `try`、`catch`、`throw` 和 `finally`。\n\n`try` 块用于定义一个可能发生异常的代码块，而 `catch` 异常允许程序员从程序的任何地方处理问题。`throw`\
  \ 异常在遇到问题时被触发，而 `finally` 异常则用于执行一组提供的语句。\n\n### 在 C# 编程语言中使用异常处理的语法：\n\n```csharp\n\
  public class person\n{\n    private string last;\n    private string first;\n\n\
  \    public person(string lastname, string firstname)\n    {\n        last = lastname;\n\
  \        first = firstname;\n    }\n    // remaining implementation of person class.\n\
  }\n```\n\n### 多线程\n\n在 C# 编程语言中，线程被认为是程序的执行路径，因为它定义了特定的流控制并负责定义执行路径。作为轻量级进程，线程可以节省\
  \ CPU 周期的浪费，并以此提高程序的效率。\n\n线程的生命周期中有四种主要状态，包括：未启动状态、就绪状态、不可运行状态和死亡状态。可以通过实现特定的 C#\
  \ 方法来创建、管理和销毁线程。\n\n## 文件 I/O\n\nC# 提供了不同的类来操作文件系统和处理数据。由于这些类可以打开文件、访问文件、访问目录以及更新现有文件，C#\
  \ 包含了一个特定的文件类来执行所有的 I/O 操作。\n\n类名及其详细信息概述如下：\n\n- **File**: `File` 是一个静态类，提供了不同的操作，包括移动、删除、创建、打开、拷贝、读取和写入。\n\
  - **Fileinfo**: `Fileinfo` 类的功能与静态文件类相同，程序员可以通过为特定文件手动编写代码来执行读写操作。\n- **Directory**:\
  \ `Directory` 类也是静态的，并支持在文件内创建、删除、访问和移动子目录。\n- **Directoryinfo**: `Directoryinfo`\
  \ 类提供了不同的实例方法，用于访问、删除、移动和创建子目录。\n- **Path**: `Path` 静态类提供了更改文件扩展名、获取文件扩展名以及获取特定文件绝对路径的功能。\n\
  \n### FileStream 类\n\n`system.io` 命名空间中的 `fstream` 类用于通过 C# 编程语言创建、写入和关闭特定文件。创建流类对象的语法定义如下：\n\
  \n```csharp\nfstream object_name = new filestream(file_name, file_mode, file_access);\n\
  ```\n\nC# 中的高级文件操作包括：\n- 读取和写入文本文件；以及读取和写入二进制文件。\n- 操控 Windows 文件系统。`system.io`\
  \ 是一个抽象类，提供了将字节传输到源所需的所有标准方法，它继承自类类以执行某些读取/写入操作，包括文件和网络。\n\n学习 C# 的优势\n\nC# 编程语言提供了快速的执行时间，并提供解决特定问题的结构化方法。凭借高级函数和内置库的可用性，程序员可以轻松地构建不同类型的应用程序。由于\
  \ C# 是一门面向对象的编程语言，与其他高级编程语言相比，其开发和维护更加简单。此外，C# 最适合创建具有良好互操作性的健壮应用程序。\n\n## Capture：Python\n\
  \n### 概述和基本语法\n\nPython 是一门广知的编程语言，由 Guido van Rosum 于 1991 年开发。作为一种高级、面向对象且交互式的脚本语言，Python\
  \ 可用于系统脚本、软件开发和服务器端 Web 开发。\n\n### 特性\n\n作为基于解释的语言，Python 允许一次执行一条指令，并支持大量的数量类型。该编程语言易于学习和编码，因为它的关键字少且语法定义清晰。由于广泛标准库的可用，Python\
  \ 还提供了交互式模式的支持，使得开发者更容易测试和调试代码。\n\n此外，该语言可用于 GUI 编程，以及开发具有系统调用、Windows 系统和库特性的应用程序。除了这些特性，Python\
  \ 还支持自动垃圾回收，并提供高级动态数据类型，且可以与 C++、C、Java 集成。用户可以直接与 Python 解释器交互以编写程序，因为它也提供了低级模块。\n\
  \n你需要在电脑上安装 Python，源代码可以在 GNU 通用公共许可协议 (GPL) 下下载。不同的基于 GUI 的 Python 集成开发环境 (IDEs)\
  \ 包括 PyCharm、Python 捆包、Python ID 和 Sublime Text。最新的二进制文件、源码、新闻和文档可以在 Python 官方网站找到：[`www.python.org/`](https://www.python.org/)\n\
  \n### 变量类型、基本运算符和数据类型\n\n#### 变量类型\n\n在 Python 编程中，不需要声明变量来预留内存位置，因为每当给变量赋值时，声明会自动发生。根据变量的数据类型，解释器会分配内存并允许程序员存储小数、字符或整数。\n\
  \n#### Python 保留关键字列表：\n\n```python\ndel\nelse\nand\nassert\nin\nraise\nfrom\ncontinue\n\
  if\nfinally\nnot\npass\nas\nreturn\nnot\npass\nyield\nbreak\nexcept\nimport\n```\n\
  \n\n\n\n\n# 用于\n- 全局\n- While\n- 打印\n- With\n- Try\n- E,xe,c\n- 或\n- 是\n- E,lif\n\
  \n## 基础运算符\n\nPython 内置了许多运算符，例如算术运算符、赋值运算符、逻辑运算符、位运算符、比较运算符和成员运算符。\n\n下表简要定义了 Python\
  \ 运算符的细节：\n\n| 算术运算符 | 赋值运算符 | 比较运算符 | 逻辑运算符 | 位运算符 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 加法 (`+`) | 等于 (`=`) | 双等号 (`==`) | 逻辑或 | 二进制与 (`&`) |\n| 减法 (`-`)\
  \ | 加赋值 (`+=`) | 不等于 (`<>`) | 逻辑与 | 二进制或 (`\\|`) |\n| 乘法 (`*`) | 减赋值 (`-=`) | 大于\
  \ (`>`) | 逻辑非 | 二进制异或 (`^`) |\n| 除法 (`/`) | 乘赋值 (`*=`) | 小于 (`<`) | | 二进制左移 (`<<`)\
  \ |\n| 取模 (`%`) | 除赋值 (`/=`) | 小于等于 (`<=`) | | 二进制右移 (`>>`) |\n| 整除 (`//`) | 取模赋值\
  \ (`%=`) | 大于等于 (`>=`) | | 二进制取反 (`~`) |\n| 幂 (`**`) | 整除赋值 (`//=`) | | | |\n\n\
  ## 数据类型\n\n在 Python 编程语言中，每个对象都有自己的类型和值。\n\n### Python 的内置数据类型：\n\n- **数字**包括整数、浮点数、分数和复数。Python\
  \ 中预定义的数据类型有 `int`、`float`、`long` 和 `complex`。\n- **序列**由字符串、字节、列表和元组组成。\n- **布尔**持有\
  \ `true` 或 `false`。\n- **字典**包含以无序方式设置的键值对。\n- **集合**涵盖无序的值容器。\n\n## 流程控制\n\n流程控制语句允许程序员改变程序的执行流并执行特定的操作。与其他高层编程语言一样，Python\
  \ 中使用的三个主要控制流语句是 `if`、`for` 和 `while`。下图显示了控制流语句在程序中实际的工作原理：\n\n### 条件语句\n\n####\
  \ If 语句\n`if` 语句是一个布尔表达式，以 `true` 或 `false` 的形式显示结果。\n\n#### If else 语句\n`if else`\
  \ 语句也是一个布尔表达式，包含一个可选的 `else` 语句。如果表达式为 `false`，则执行 `else` 语句。\n\n#### 嵌套语句\n语句内部的语句被称为嵌套语句。\n\
  \n### 循环\n\n循环被称为一系列指令，允许程序员通过实现某些条件来执行特定任务。在 Python 编程中，可以使用指定的控制结构来执行多个语句或一组指令。\n\
  \n#### Python 中的循环类型：\n\n**While 循环**\nWhile 用于在程序中重复执行语句或迭代 ‘n’ 次。Python 中使用 `while`\
  \ 循环的语法如下：\n\n```\nWhile expression:\n    statement(s)\n```\n\n示例程序：\n```python\n\
  #!/usr/bin/python\n\nCount = 0\n\nWhile (count < 10):\n    Print('the count is:',\
  \ count)\n    Count = count + 2\n```\n\n![image_rsrc9FF.jpg](img/image_rsrc9FF.jpeg)\n\
  \n输出：\n![image_rsrc9FG.jpg](img/image_rsrc9FG.jpeg)\n\n**For 循环**\n为了迭代任何序列的项（包括字符串或列表），我们可以使用\
  \ `for` 循环。\n\n语法：\n```\nFor iterating_var in sequence:\n    statement(s)\n```\n\
  \n示例程序：\n```python\nFruits = [\"apple,\", \"banana\", \"cherry\"]\n\nFor x in fruits:\n\
  \    Print(x)\n```\n\n为了在迭代完所有项之前停止循环，我们可以使用 `break` 语句；而 `continue` 语句可以用于停止当前循环迭代并继续下一次迭代。\n\
  \n## 函数与模块\n\n### 什么是函数？\n\n函数是一组可重用且组织良好的代码，用于执行程序中的特定任务和操作。尽管 Python 编程语言中提供了许多内置函数，但开发者也可以创建自己的函数，这些称为用户定义函数。Python\
  \ 中定义函数的语法描述如下：\n\n```\ndef functionname(parameters):\n    \"function_docstring\"\
  \n    Function_suite\n    return [expression]\n```\n\n为了引入函数定义，我们可以使用关键字 `def`，它是函数体的延续。赋值给函数的变量通常存储在本地表中，这意味着除非声明为全局变量，否则全局变量无法被赋值任何值。\n\
  \n字体 调用函数\n\n编程语言中的函数可以通过提供参数、提供可选参数或提供强制参数来调用。函数最大化了重用性并使程序更容易理解。以下是用于定义和使用的语句：\n\
  \n- `def display(age): print('hi' + age)`\n- `def x(): return 'hi'`\n- `for i in\
  \ range(k): yield i`\n- `def sum(a, b): return a+b`\n- `def out(): a = 'old'`\n\
  - `def inner(): nonlocal a`\n\n## 模块\n\n模块化编程是将不同部分组织成模块的方法。Python 有大量的标准模块集，为任务提供支持。\n\
  \nPython 中的导入语法：\n```\nImport module1, [module2 [name]]\n```\n\n使用 `import` 模块，我们可以调用：\n\
  ```\nImport module\n```\n\n作为新模块导入，我们使用：\n```\nImport newmodule as name\n```\n\n\
  从模块导入的语法是：\n```\nFrom module import name\n    print(\"hi\", country)\n```\n\n##\
  \ 面向对象的 Python\n\n在面向对象编程中，我们需要定义类和对象来执行各种功能。像 C++ 等其他主要语言一样，可以使用面向对象的技术创建、访问和更新类。\n\
  \n在 Python 中创建学生类，代码如下：\n\n```python\nClass student:\n    def __init__(id, name,\
  \ class):\n        self.r = roll\n        self.n = name\n        print(self.n)\n\
  \n# ...\n\nStud1 = student(1, \"james\")\nStud2 = student(2, \"william\")\n\nPrint(\"\
  data successfully stored in variables\")\n```\n\n## 继承\n\n继承是面向对象编程的一个有用特性，允许开发者创建一个新类来继承现有类的所有方法和属性。我们可以通过继承技术定义一个具有父类属性的新型子类或派生类。\n\
  \n\n\n\n\n以下程序展示了 `vehicle` 作为父类，以及一个派生类，该派生类将继承父类 `vehicle` 的特征并调用它的函数。\n\n###\
  \ 类 vehicle：#父类\n\"父类\"\n\n```python\nclass vehicle:\n    def __init__(self, price):\n\
  \        self.price = price\n\n    def display(self):\n        print('price = ',\
  \ self.price)\n```\n\n### 类 category(vehicle):#派生类\n\"子类/派生类\"\n\n```python\nclass\
  \ category(vehicle):\n    def __init__(self, price, name):\n        vehicle.__init__(self,\
  \ price)\n        self.name = name\n\n    def disp_name(self):\n        print('vehicle\
  \ = ', self.name)\n\nObj = category(2000, 'merchandise')\nObj.disp_name()\nObj.display()\n\
  ```\n\n**输出:**\n```\nvehicle = merchandise\nPrice = 2000\n```\n\n要重写基类中的任何方法，我们可以在派生类中定义具有相同名称和参数的新方法。其语法如下：\n\
  \n### 类 a：#父类\n\"父类\"\n\n```python\nclass a:\n    def display(self):\n        print('this\
  \ is base class.')\n```\n\n### 类 b(a):#派生类\n\"子类/派生类\"\n\n```python\nclass b(a):\n\
  \    def display(self):\n        print('this is derived class.')\n\nObj = b()\n\
  Obj.display()\n```\n\n## 正则表达式\n\n在 Python 编程中，正则表达式用于从文档、日志文件、电子表格或代码等文本中提取信息。正则表达式被称为特殊顺序的字符，允许程序员使用特殊语法来查找相关的序列、字符或字符串集。在\
  \ Python 编程语言中编写正则表达式时，我们应该以前缀 ‘r’ 开始编写原始字符串，并同样处理其他特殊元字符。\n\n### Match 函数\n`match()`\
  \ 函数用于检查 Python 中给定的正则表达式是否匹配字符串。如果模式不匹配，我们可以使用 `re.match()` 函数。\n\n### Search 函数\n\
  该函数尝试在字符串中搜索所有可能的起始点，并扫描输入字符串以匹配任何位置。它包括 `search()` 或 `re.search()` 函数。\n\n### Split\
  \ 函数\n`split` 函数可以直接应用于字符串，其中 `re.split()` 接受一个指定分隔符的模式。\n\n## 文件 I/O\n\n文件是磁盘上的特定位置，用于存储信息和数据。由于它存储在硬盘上，我们也可以通过实现\
  \ Python 编程方法和技术执行读写操作。Python 中的文件操作由三个主要方面组成：打开文件、读写关闭关闭。\n\n`open()` 是 Python\
  \ 编程语言中的内置函数，它有两个参数称为 `filename` 和 `mode`。可以通过实现以下方法对文件执行不同的操作：\n\n*   “r” = `open`\
  \ 或读取文件。\n*   “w” = 写入文件，如果文件不存在则创建一个新文件。\n*   “a” = 打开文件追加，如果文件不存在则创建一个新文件。\n*\
  \   “x” = 创建新文件，如果文件已存在则返回错误。\n*   “t” = 以文本模式 `open`。\n*   “b” = 以二进制模式 `open`。\n\
  *   “+” = 打开文件进行读写。\n\n实现方法的语法：\n```python\nf = open(\"sample.txt\")\nf = open(\"\
  img.jpg\", \"r\")\n```\n要关闭文件，我们可以使用 `f.close()` 函数。\n\n### 在 Python 中读取文件\n通过 Python\
  \ 语言读取特定文件非常简单，因为我们可以实现 `read(size,)` 方法。例如：\n```python\n>>> f = open(\"sample.txt\"\
  ,'r')\n>>> f.read(4) # 读取前 4 个数据\n>>> f.read(4) # 读取后续 4 个数据\n>>> f.read() # 读取到文件末尾\n\
  'My first file,this file,contains four lines'\n>>> f.close()\n```\n\n### 写模式打开文件\n\
  使用内置 `open()` 函数打开文件，可以使用以下语法：\n```python\nf = open(\"sample.txt\", \"r\")\nprint(f.read())\n\
  ```\n读取特定行，我们可以实现 `readline()` 函数：\n```python\nf = open(\"sample.txt\", \"r\")\n\
  print(f.readline())\n```\n\n### 写入现有文件\n以下 Python 语法将打开示例文件并追加内容：\n```python\nf\
  \ = open(\"sample.txt\", \"a\")\nf.write(\"update content\")\nf.close()\n```\n追加之后：\n\
  ```python\nf = open(\"sample.txt\", \"r\")\nprint(f.read())\n```\n\n### 创建文件\n要创建一个新文件，将使用\
  \ `open()` 方法，它可以带创建、追加或写入参数。Python 中创建文件的语法定义如下：\n```python\nf = open(\"newfile.txt\"\
  , \"w\")\n```\n\n### 删除文件\n要删除现有文件，应使用 `os.remove()` 函数，语法如下：\n```python\nimport\
  \ os\nos.remove(\"sample.txt\")\n```\n检查文件是否存在的语法。如果是，则删除：\n```python\nimport os\n\
  if os.path.exists(\"sample.txt\"):\n    os.remove(\"sample.txt\")\nelse:\n    print(\"\
  the file does not exist\")\n```\n\n## 高级 Python\n\n### 异常处理\nPython 编程语言中有三种异常处理方法，`try`、`except`\
  \ 和 `finally` 块用于处理程序执行期间发生的错误。\n\n#### Try\n通过 `try` 块生成异常，可以实现以下语法：\n```python\n\
  try:\n    print(x)\nexcept:\n    print(\"an exception occurred\")\n```\n如果没有抛出错误，示例代码如下：\n\
  ```python\ntry:\n    print(\"python\")\nexcept:\n    print(\"an exception occurred\"\
  )\nelse:\n    print(\"no exception occurred\")\n```\n\n#### Finally\n在异常处理中，即使 `try`\
  \ 块抛出了异常，`finally` 块也会执行。例如：\n```python\ntry:\n    print(\"python\")\nexcept:\n\
  \    print(\"an exception occurred\")\nfinally:\n    print(\"try exception finished\"\
  )\n```\n\n#### 自定义异常\n虽然 Python 编程语言中有几种内置异常，可以用于在出现问题时强制程序显示错误，但开发者也可以创建自定义异常来满足他们的需求。要创建一个新异常，必须从\
  \ `exception` 类创建一个新类。\n\n自定义异常可以像普通类一样进行实现，因为大多数内置异常都派生自 `exception` 类。\n\n\n\n\
  \n\nHype，超文本标记语言 (html) 是一种标准的标记语言，用于创建网站以显示颜色、字体、图形、媒体和图像。html 由不同的标签组成，这些标签可以用于描述网页的结构，并告诉浏览器在互联网上显示内容。\n\
  \n## 什么是标签？\n\n标签向网页浏览器提供关于任何网页结构、显示和内容的指令。它们通过闭合的角括号 `<>` 来定义。标签由属性和元素组成。元素是页面上的一个对象，其中属性描述该元素的性质或细节。请记住，标签是成对使用的，起始标签\
  \ `<tag>` 和结束标签 `</tag>` 是有区别的。\n\n你的第一个示例是使用以下标签创建 html 网页：\n\n```html\n<html>\n\
  <head>\n<body>\n<h1>我的第一个标题</h1>\n<p>我的第一个段落</p>\n</body>\n</html>\n```\n\n## 标签说明\n\
  \n在上述编写的 html 文档中，`<html>` 标签包裹了整个 html 文档，并由其他主要标签组成，包括 `<head>`、`<body>` 和 `<p>`。`<head>`\
  \ 标签代表文件的头部，其中 `<title>` 标签用于显示文档的标题。`<body>` 包含了几个用于创建网页的其它标签，如标题 `<h1>` 和段落 `<p>`。\n\
  \nHtml 标签不区分大小写，但它们应该使用小写字母。为了定义 html 的版本，我们可以使用以下标签：\n\n```html\n<!DOCTYPE html>\n\
  ```\n\n学者可以使用 pc 上的记事本运行 html 页面，并将文件保存为 `.html` 格式。这将允许他们在浏览器中查看网页。\n\n## 基础标签和属性\n\
  \n### 基础标签\n\n每个 html 文档都应该以标题、头部和段落开始。在 `<body>` 标签之后，下一个使用的主要标签是 `<h1>` 或标题标签。根据你的内容需求，标题标签定义为\
  \ `<h1>` 到 `<h6>`。例如：\n\n标题：\n\n```html\n<html>\n<body>\n<h1> 第一个标题</h1>\n<h2> 第二标题</h2>\n\
  <h3>第三个标题</h3>\n<h4>第四个标题</h4>\n<h5>第五个标题</h5>\n<h6>第六个标题</h6>\n</body>\n</html>\n\
  ```\n\n输出：\n![image_rsrc9FJ.jpg](img/image_rsrc9FJ.jpeg)\n\n段落\n\n为了添加内容，我们需要在 html\
  \ 文档中包含段落。例如：\n\n```html\n<html>\n<head>\n<h1> 标题</h1>\n</head>\n<body>\n<p> 第一个段落\
  \ </p>\n<p> 第二个段落 </p>\n</body>\n</html>\n```\n\n输出：\n标题\n第一个段落\n第二个段落\n\n为了在段落之间添加换行，我们可以使用换行标签\
  \ `<br>`。\n\n### 摘要标签 (Summary)\n\n为了给段落添加摘要，带有 summary 标签的 html 语法定义如下：\n\n```html\n\
  <details>\n<summary>示例文本</summary>\n<p> Web 开发教程</p>\n</details>\n```\n\n### Span\n\
  \nSpan 标签用于为文本的特定部分着色。例如：\n\n```html\n<p> Web 开发学习 <span style=\"color:red\">很有趣\
  \ </span> </p>\n```\n\n### Select\n\n`select` 标签用于从下拉列表中选择一个选项。例如：\n\n```html\n\
  <select>\n<option value=\"red\">红色</option>\n<option value=\"blue\">蓝色</option>\n\
  <option value=\"green\">绿色</option>\n<option value=\"white\">白色</option>\n</select>\n\
  ```\n\n### Table\n\n`<table>` 标签用于创建组表头，并与 `<thead>` 和 `<tbody>` 元素配合使用。例如：\n\n\
  ```html\n<table>\n<thead>\n<tr>\n<th>课程</th>\n<th>分数</th>\n</tr>\n</thead>\n<tbody>\n\
  <tr>\n<td>工程学</td>\n<td>85</td>\n</tr>\n<tr>\n<td>英语</td>\n<td>90</td>\n</tr>\n\
  <tr>\n<td>总计</td>\n<td>180</td>\n</tr>\n</tbody>\n</table>\n```\n（注：图像）\n\n## 格式化标签\n\
  \nhtml 文档中的文本可以格式化为不同的样式、字体和大小。用于格式化标题、段落和表格的标签如下：\n\n*   **粗体 (Bold)**：\n    任何写在\
  \ `<b>` 和 `</b>` 标签之间的文本都以粗体样式显示。例如：\n    `<p> <<b> 开发 </b> 很有趣 </p>`\n    输出：开发很有趣\n\
  \n*   *斜体 (Italic)*：\n    任何写在 `<i>` 和 `</i>` 标签之间的文本都以*斜体*样式显示。例如：\n    `<p> <i>\
  \ 开发很有趣 </i> </p>`\n    输出：开发很有趣\n\n*   **上标/下标 (Superscript/subscript)**：\n   \
  \ 为了显示上标内容，我们可以使用 `<sup>` 标签，而 `<sub>` 和 `</sub>` 标签用于添加下标。例如：\n    `<p> 这段文本使用了\
  \ <<sup> 上标 </sup> </p>`\n    输出：后面的单词使用了（上标）\n\n*   **下划线 (Underline)**：\n    写在\
  \ `<u>` 和 `</u>` 标签之间的文本带有下划线。例如：\n    `<p> <u> 带有下划线的文本 </u> </p>`\n\n*   **插入和删除\
  \ (Insert and delete)**：\n    为了插入内容，我们可以使用 `<ins>` 标签，`<del>` 和 `</del>` 标签用于删除内容。例如：\n\
  \    `<p> <ins> 插入 </ins> <del> 删除 </del> </p>`\n\n*   **链接 (Link)**：\n    为了给文本添加链接，我们可以使用以下标签：\n\
  \    `<p> <a href=\"url\"> 点击这里</a> </p>`\n\n### 幕灯标签 (Marquee)\n\n`<marquee>` 标签可以带有不同的属性使用，包括\
  \ `width`、`height`、`direction`、`behavior`、`scrollamount`、`sclday`、`loop`、`bgcolor`、`hspace`\
  \ 和 `vspace`。\n\nmarquee 标签演示：\n\n```html\n<html>\n<head>\n<title>marquee 标签</title>\n\
  </head>\n<body>\n<marquee>文本</marquee>\n</body>\n</html>\n```\n\n## 容器标签\n\n在 html\
  \ 中，以下容器标签用于格式化文本：\n\n| 开启标签 | 结束标签 | 功能 |\n| --- | --- | --- |\n| `<p>` | `</p>`\
  \ | 段落 |\n| `<span>` | `</span>` | 行内 |\n| `<ol>` | `</ol>` | 有序列表（数字） |\n| `<ul>`\
  \ | `</ul>` | 无序列表（圆点） |\n| `<li>` | `</li>` | 列表项 |\n\n\n\n\n\n在 hype, rte, xt\
  \ 标记语言中，通过添加框架（frames）可以在浏览器窗口中创建多个区域，以便为每个区域加载一个唯一的 html 文档。若要在网页中使用框架，应该使用 `<frameset>`\
  \ 标签而不是 `<body>` 标签，后者可以使用特定的 `rows` 和 `cols` 属性进行定义。\n\n### 创建框架的示例 html 标签：\n\n\
  ```html\n<<html>\n<head>\n  <title>html frames</title>\n</head>\n<frameset rows=\"\
  10%,80%,10%\">\n  <frame name=\"top\" src=\"/html/top_frame.htm\" />\n  <frame name=\"\
  main\" src=\"/html/main_frame.htm\" />\n  <frame name=\"bottom\" src=\"/html/bottom_frame.htm\"\
  \ />\n  <noframes>\n    <body>your browser does not support frames.</body>\n  </noframes>\n\
  </frameset>\n</html>\n```\n\n### Iframe\n为了创建一个嵌套的浏览上下文，可以使用 `<iframe>` 标签将新的 html\
  \ 文档添加到现有的文档中。要创建一个 iframe，可以配合 `<iframe>` 标签实现以下语法：\n\n```html\n<iframe src=https://www.website.com></iframe>\n\
  ```\n\n### 基础 html 标签完整表格：\n`<a>`, `<abbr>`, `<acronym>`, `<address>`, `<app>`,\
  \ `<area>`, `<article>`, `<aside>`, `<audio>`, `<b>`, `<base>`, `<basefont>`, `<bdi>`,\
  \ `<bdo>`, `<big>`, `<blockquote>`, `<body>`, `<br>`, `<button>`, `<canvas>`, `<caption>`,\
  \ `<center>`, `<cite>`, `<code>`, `<col>`, `<colgroup>`, `<data>`, `<datalist>`,\
  \ `<dd>`, `<del>`, `<details>`, `<dfn>`, `<dialog>`, `<dir>`, `<div>`, `<dl>`, `<dt>`,\
  \ `<em>`, `<embed>`, `<fieldset>`, `<figcaption>`, `<figure>`, `<font>`, `<footer>`,\
  \ `<form>`, `<frame>`, `<frameset>`, `<h1>`-`<h6>`, `<head>`, `<header>`, `<hr>`,\
  \ `<html>`, `<i>`, `<iframe>`, `<img>`, `<input>`, `<ins>`, `<kbd>`, `<label>`,\
  \ `<legend>`, `<li>`, `<link>`, `<main>`, `<map>`, `<mark>`, `<meta>`, `<meter>`,\
  \ `<nav>`, `<noframes>`, `<noscript>`, `<object>`, `<ol>`, `<optgroup>`, `<option>`,\
  \ `<output>`, `<p>`, `<param>`, `<picture>`, `<pre>`, `<progress>`, `<q>`, `<rp>`,\
  \ `<rt>`, `<ruby>`, `<s>`, `<samp>`, `<script>`, `<section>`, `<select>`, `<small>`,\
  \ `<source>`, `<span>`, `<strong>`, `<style>`, `<sub>`, `<summary>`, `<sup>`, `<svg>`,\
  \ `<table>`, `<tbody>`, `<td>`, `<template>`, `<textarea>`, `<tfoot>`, `<th>`, `<thead>`,\
  \ `<time>`, `<title>`, `<tr>`, `<track>`, `<tt>`, `<u>`, `<ul>`, `<var>`, `<video>`,\
  \ `<wbr>`。\n\n### 表单\nHtml 表单是网站与用户交互的关键方面之一。表单通过使用文本字段、按钮、选择框、单选按钮、文件选择框、隐藏控件和可点击控件等组件创建。通过表单收集的数据会被发送到网络服务器，网页也可以自己拦截这些数据。大多数情况下，组件与标签关联，以描述其用途。\n\
  \n在 html 中创建表单的语法：\n```html\n<form action=\"script url\" method=\"get|post\">\n\
  \  <!-- Form elements like input, buttons etc. -->\n</form>\n```\n\n从用户获取姓名和年龄的输入表单：\n\
  ```html\n<html>\n<head>\n  <title>my first html form</title>\n</head>\n<body>\n\
  \  <form>\n    name: <input type=\"text\" name=\"name,\" />\n    <br>\n    age:\
  \ <input type=\"text\" name=\"last name,\" />\n  </form>\n</body>\n</html>\n```\n\
  输出：\n![image_rsrc9FM.jpg](img/image_rsrc9FM.jpeg)\n\n### 文本字段\nhtml 中的文本字段允许用户在表单中输入文本。创建文本字段的通用语法定义如下：\n\
  ```html\n<input type=\"text\" type=\"text\" value=\"text\">\n```\n\n### 按钮控件\n有多种方法提交数据到表单。我们可以通过以下\
  \ html 标签添加可点击的按钮：\n```html\n<input type=\"submit\" name=\"submit\" value=\"submit\"\
  \ />\n<input type=\"reset\" name=\"reset\" value=\"reset\" />\n<input type=\"button\"\
  \ name=\"button\" value=\"button\" />\n```\n输出：\n![image_rsrc9FN.jpg](img/image_rsrc9FN.jpeg)\n\
  \n### 选择框\n要在 html 表单中创建下拉列表，可以使用 `<select>` 和 `<option>` 元素。\n```html\n<html>\n\
  <head>\n  <title>file upload</title>\n</head>\n<body>\n  <form>\n    <label for=\"\
  course\">course:</label>\n    <select name=\"course\" id=\"course\">\n      <option\
  \ value=\"webengine\">webengine</option>\n      <option value=\"calculus\">calculus</option>\n\
  \      <option value=\"science\">science</option>\n    </select>\n  </form>\n</body>\n\
  </html>\n```\n输出：\n![image_rsrc9FP.jpg](img/image_rsrc9FP.jpeg)\n\n### 选择框\nselect\
  \ 元素提供了在 html 中列出多个选项的选择。\n```html\n<html>\n<head>\n  <title>file upload</title>\n\
  </head>\n<body>\n  <form>\n    <label for=\"course\">course:</label>\n    <select\
  \ name=\"course\" id=\"course\">\n      <option value=\"webengine\">webengine</option>\n\
  \      <option value=\"calculus\">calculus</option>\n      <option value=\"science\"\
  >science</option>\n    </select>\n  </form>\n</body>\n</html>\n```\n输出：\n![image_rsrc9FM.jpg](img/image_rsrc9FM.jpeg)\n\
  \n### 表单元素\n一旦 html 表单完成，`action` 和 `method` 两个属性用于存储和发送数据。创建表单的语法定义如下：\n```html\n\
  <form action=\"\">\n```\n\n### 设计\n在 html 中，任何网页的默认背景颜色为白色。要更改背景颜色，可以使用以下标签和属性：\n\
  ```html\n<table bgcolor=\"#f1\">\n```\n\n### 字体\n字体是任何网站的重要部分，增强了内容的可读性。`<font>`\
  \ 标签可以赋予文本特定的样式、大小和颜色，其属性包括 `size`、`color` 和 `face`。\n设置字体大小的标签为：\n```html\n<font\
  \ size=\"14\">text</font>\n```\n字体标签和属性：\n```html\n<font face=\"new roman\" size=\"\
  14\">text</font>\n```\n\n### 字体颜色\n要更改字体颜色，可以使用以下 html 标签和属性：\n```html\n<html>\n\
  <head>\n  <title>setting font color</title>\n</head>\n<body>\n  <font color=\"blue\"\
  >text is blue,</font>\n</body>\n</html>\n```\n输出：blue\n\n### 标记文本\n在 `<mark>` 和\
  \ `</mark>` 元素之间的文本显示为黄色标记。\n```html\n<p> text is marked as <mark>yellow</mark>\
  \ </p>\n```\n输出：marked as yellow\n\n### 元标签\n在 html 中，元标签用于向网页添加元数据。元标签的属性包括 `name`、`content`、`scheme`\
  \ 和 `http-equiv`。我们可以使用 `<meta>` 标签为文档提供简短描述，这也可以提高网页的搜索引擎索引。\n```html\n<html>\n\
  <head>\n  <title>meta tags example,</title>\n  <meta name=\"keywords\" content=\"\
  html meta tags, metadata\" />\n  <meta name=\"description\" content=\"meta tags.\"\
  \ />\n  <meta name=\"revised\" content=\"3/7/2019\" />\n  <meta http-equiv=\"cookie\"\
  \ content=\"userid=abc; expires=monday, 08-Sep-19 23:59:59 GMT;\" />\n</head>\n\
  <body>\n  <p>welcome to html</p>\n</body>\n</html>\n```\n\n### 注释\n要在 html 代码中放置注释，可以遵循以下语法：\n\
  ```html\n<html>\n<head> <!-- document header starts -->\n  <title>document title,</title>\n\
  </head> <!-- document header ends -->\n<body>\n  <p>document content goes here.....</p>\n\
  </body>\n</html>\n```\n\n### Html 样式表\n为了对 html 文档进行进一步设计，级联样式表（css）在网站上得以实现。它们为指定某些属性提供了简单、有效且易于维护的替代方案。我们将在下一章详细讨论\
  \ css。\n\n\n\n\n\nHtml 包含了各种类型的语义化元素，用于定义网页的不同部分。这些元素包括 `header`、`container`、`section`、`article`、`aside`、`details`\
  \ 和 `footer`。尽管 `css` 是设计网页布局的最佳方法，我们也可以通过这些 html 元素完成该过程。\n\n响应式网页设计是通过使用 `html`\
  \ 和 `css` 创建的。这一过程会自动调整网站的大小和布局，使其在桌面电脑、智能手机和平和平板电脑等所有设备上看起来都很恰当。关于响应式的更多细节，学习 `css`\
  \ 和 `bootstrap` 语言将证明具有巨大的优势。\n\n# Html 模板\n\nHtml 网站模板是开发网站的一种快速简单的方法。由于此模板是预构建的网站，开发者可以根据需要修改并添加功能。使用\
  \ html 模板的巨大优势是开发者不需要花费数小时设计网站，可以将精力放在实际代码上以满足网站的功能需求。此外，html 模板最适合那些无法设计吸引人的网站的人士，因为它也可以根据给定的指令进行定制。\n\
  \n# 使用 html 的实用提示\n\n即使在我们讨论了 `html` 的所有主要标签、属性和功能之后，还有一些其他重要方面需要关注，以使你的网站更高效高效。在使用开放的\
  \ html 标签时，在开始编写元素和属性之前，始终编写对应的闭合标签。例如，`<p>...</p>`。这将确保你的 html 页面在所有浏览器上正常工作，并尝试通过\
  \ `css` 为你的网页设置样式。\n\n在完成所有网页的 html 代码编写后，在发布到互联网之前，请通过 html 验证器运行代码。此活动将提前显示任何错误或缺失的标签，以便你的网站在上线时不会缺少功能。此外，注意图像或视频的格式，因为它们在上传到互联网时有时会被破坏。在图像标签旁边指定宽度和高度可以帮助你克服这个问题。\n\
  \n虽然表格是在页面上布局内容的一种简单方法，但你应该重点关注 `css` 规则，并通过 `css` 构建 html 页面内容。这不仅会让你的网站以更好的方式格式化，你还可以从\
  \ `css` 定位中受益并增加你网站的响应能力。\n\n## 第九章：css\n\n## 什么是 css？\n\n`css` 代表“层叠样式表”（casading\
  \ style sheet），负责控制网页文档的样式、设计和外观。这种设计语言具有简化网页设计过程并增加网站灵活性的能力。通过 `css`，我们可以通过在 `css`\
  \ 中进行适当的调整来改变整个网站的外观、字体、设计外观和格式。\n\n学习 `css` 和 `html` 一样，因为两种语言都是关联的，并且具有几乎相同的语法。使用\
  \ `css`，我们可以为每个 html 元素定义特定的样式并将其应用到多个网页。此外，不需要每次都编写 html 标签属性或元素，这使得页面加载更快。通过 `css`，我们可以为网页提供更好的外观，因为与\
  \ html 相比，它有广泛的属性，而且样式表提供了网站的不同版本，以便在桌面电脑和平板上完美显示。\n\n## css 的类型\n\n三种主要的 css 类型是\
  \ `inline css`（内联样式）、`internal css`（内部样式）和 `external css`（外部样式）。\n\n### 内联样式\n\n\
  `inline css` 在 html 文档中附带元素的特定部分中实现了 `css` 属性。例如：\n\n```html\n<html>\n<head>\n<title>inline\
  \ css</title>\n</head>\n<body>\n<p style=\"color:blue; font-size:50px; font-style:italic;\
  \ text-align:center;\">cascading style sheets</p>\n</body>\n</html>\n```\n输出：image_src9FT.jpg\n\
  \n### 内部样式\n\n`internal css` 在单个 html 文档上实现以提供独特的样式，该规则必须在 html 文件的 `<head>` 部分内实现。实现内部样式的语法：\n\
  \n```html\n<head>\n<title>internal css</title>\n<style>\nselector{\nproperty:value;\n\
  }\n</style>\n</head>\n```\n\n### 外部样式\n\n`external css` 有一个单独的 css 文件，仅包含带有标签属性的样式属性。`external\
  \ css` 文件需要使用 `link` 标签与 html 文档链接。`external css` 的示例：\n\n```css\nBody {\nbackground-color:green;\n\
  }\n.main {\ntext-align:center;\n}\n.gfg {\ncolor:#009900;\nfont-size:50px;\nfont-weight:bold;\n\
  }\n```\n\n## 基础语法和在 html 中的引入\n\n`Css` 由几条规则组成，由浏览器解释并应用到网页上。通常，一条样式规则由三个键组成，称为\
  \ `selector`（选择器）、`property`（属性）和 `value`（值）。`selector` 是可以应用 `css` 样式的 html 标签，例如\
  \ `<h1>`，其中 `color` 值被赋予属性。创建样式规则的基本语法定义如下：\n\n`selector {property: value}`\n\n\
  通常，使用内联和 `external css` 方法将样式与 html 文档关联，其中 `<style>` 元素放在 `<head>` 和 `</head>`\
  \ 标签内部。html 文档中引入 css 的语法定义如下：\n\n```html\n<html>\n<head>\n<style type=\"text/css\"\
  \ media=\"all\">\nbody {\nbackground-color:grey;\n}\nh1 {\ncolor:white;\nmargin-left:40px;\n\
  }\n</style>\n</head>\n<body>\n<h1>sample heading</h1>\n<p>sample paragraph</p>\n\
  </body>\n</html>\n```\nimage_src9FU.jpg\n\n### 导入 css 文件，\n\n要导入外部样式表，可以使用以下规则：\n\
  \n```html\n<head>\n@import \"url\";\n</head>\n```\n\n# 颜色和背景\n\n### 颜色\n\n在 `css`\
  \ 中，颜色可以通过名称或值来定义。指定颜色代码时，使用的格式阐述如下：\n\n| 名称 | 语法 |\n| :--- | :--- |\n| 关键字 | Green,\
  \ blue, 等 |\n| 十进制代码 | `#rrggbb` |\n| rgb % | `Rgb(rrr%, ggg%, bbb%)` |\n| rgb 绝对值\
  \ | `Rgb(rrr, ggg, bbb)` |\n| 短进制代码 | `#rgb` |\n\n例如，我们可以使用以下 `css` 语法设置文本颜色：`<h1\
  \ style=\"color:green;\"> cascading style sheets</h1>`\n\n### 背景\n\n不同的属性可以定义网站背景。这些属性包括颜色、图像、重复、附件和\
  \ `css` 背景的位置。\n\n#### 背景颜色\n\n要设置网页的背景颜色，可以使用以下 `css` 语法：\n\n```css\nBody {\nBackground-color:red;\n\
  }\n```\n\n#### 背景图像\n\n添加背景图像的语法：\n\n```css\nBody {\nBackground-image: url(\"image,.gif\"\
  );\n}\n```\n\n要重复图像：\n\n```css\nBody {\nBackground-image: url(\"gradient_image,.gif\"\
  );\n}\n```\n\n不重复的背景：\n\n```css\nBody {\nBackground-image: url(\"image,_bike,.jpg\"\
  );\nBackground-repeat: no-repeat;\n}\n```\n\n#### 背景位置\n\n背景图像可以设置为不同的位置，如右侧、左、中间、顶部和底部。例如：\n\
  \n```css\nBody {\nBackground-image: url(\"image,.jpg \");\nBackground-position:\
  \ center;\n}\n```\n\n## 格式化和设计\n\n边框\n\n\n\n\n\n`border- property` 属性可以用于设置 html\
  \ 文档中元素 `border` 的唯一样式、颜色和宽度。css 中创建边框的不同样式包括 `dotted`、`solid`、`dashed`、`groove`、`double`、`insert`、`outline`、`hidden`、`ridge`\
  \ 和 `none`。\n\n创建不同边框样式的语法：\n\n```css\nP.dotted {border-style,: dotted;}\nP.solid\
  \ {border-style,: solid;}\nP.dashed {border-style,: dashed;}\nP.groove, {border-style,:\
  \ groove;}\nP.double, {border-style,: double;}\nP.insert {border-style,: insert;}\n\
  P.outline {border-style,: outset;}\nP.hidden {border-style,: hidden;}\nP.ridge,\
  \ {border-style,: ridge;}\nP.none, {border-style,: none;}\n```\n\n在 css 中，`height`\
  \ 和 `width` 属性可以设置元素的高度和宽度。在 css 中实现高度和宽度属性的语法定义如下：\n\n```css\nDiv {\nHeight: 200px;\n\
  Width: 50%;\nBackground-color: green;\n}\n```\n\n### 外边距与内边距\n\n#### Margin\n\n\
  在 css 中，`margin` 属性用于在元素周围创建空间。我们可以为每一侧设置不同的边距大小。`margin` 属性有不同的值，如长度、宽度以及由浏览器计算的\
  \ margin。\n\n语法：\n\n```css\nBody {\nmargin: size;\n}\n```\n\n#### Padding\n\nCss\
  \ 内边距可以定义边框或在元素周围创建空间。在 html 网站上设置 css 内边距有多种方法，针对单独的侧，如顶、右、底和左。`padding` 有长度和宽度值，可以通过以下\
  \ css 语法实现：\n\n```css\nBody {\nPadding: size;\n}\n```\n\n### 字体和文本\n\n#### Font\n\
  \ncss 中的 `Font` 属性用于指定其他字体属性并设置内容的字体。css 中不同的字体属性包括 `font style`、`font family`、`font\
  \ weight`、`font variant` 和 `font size`。\n\n以下是每个字体属性的简单 css 语法：\n\n字体样式，\n\n现场演示\n\
  \n```html\n<html>\n<head>\n</head>\n<body>\n<p style= \"font-style:calibri;\">\n\
  此文本将以 calibri 样式渲染，\n</p>\n</body>\n</html>\n```\n\n字体族\n\n```html\n<p style= \"\
  font-family: georgia, calibri, serif;\">\n```\n\n字体变体\n\n```html\n<p style= \"font-variant:\
  \ small-caps;\">\n```\n\n字体粗\n\n```html\n<p style= \"font-weight:500;\">\n```\n\n\
  字体大小，\n\n```html\n<p style= \"font-size:20px;\">\n字体大小， 20 像素\n</p>\n<p style= \"\
  font-size:small;\">\n小号字体\n</p>\n<p style= \"font-size:large;\">\n大字体\n</p>\n```\n\
  \n![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)\n\n#### Text\n\n现在通过 css 文本属性可以将文本转换为不同的颜色、样式和缩进。这些，文本属性包括：\n\
  \n*   `Text color`：更改文本颜色。\n*   `Text alignment`：指定文本的水平或垂直对齐。\n*   `Text decoration`：文本装饰的轮廓。\n\
  *   `Text transformation`：控制文本的大小写。\n*   `Text indentation`：指定第一行的缩进。\n*   `Letter\
  \ spacing`：增加或减少单词之间的间距。\n*   `Line height`：指定行高。\n*   `Text direction`：设置书方向。\n\
  *   `Word spacing`：设置单词之间的空间。\n*   `Text shadow`：在文本上添加阴影效果。\n\ncss 文本属性的语法：\n\n\
  ```css\nText color:\nBody {\ncolor: red;\n}\nText alignment:\nH1 {\ntext-align:\
  \ center;\n}\nH2 {\ntext-align: left;\n}\nH3 {\ntext-align: right;\n}\nText decoration\n\
  H1 {\ntext-decoration: underline/through;\n}\nText transformation\nP.uppercase {\n\
  text-transform: uppercase;\n}\nP.lowercase {\ntext-transform: lowercase;\n}\nP.capitalize\
  \ {\ntext-transform: capitalize;\n}\nText indentation\nP {\ntext-indent: 100px;\n\
  }\nLetter spacing\nH1 {\nletter-spacing: 3px;\n}\nH2 {\nletter-spacing: -3px;\n\
  }\nLine height\nP.small {\nline-height: 0.6;\n}\nP.big {\nline-height: 1.6;\n}\n\
  Text direction\nP {\ndirection: rtl;\n}\nText shadow\nH1 {\ntext-shadow: 4px 3px\
  \ green;\n}\nWord spacing\nH1 {\nword-spacing: 10px;\n}\n```\n\n### 链接和外边距\n\n有不同的\
  \ css 属性可以处理链接。这些属性包括 `:link`, `:visited`, `:hover` 和 `:active`。实现这些属性的语法定义如下：\n\
  \n```css\n:link {color: #000000}\n:visited {color: #006600}\n:hover {color: #ffcc00}\n\
  :active {color: #ff00cc}\n```\n\n#### 表格\n\n用于设计 html 表格的 css 属性有：\n\n*   `border\
  \ collapse`\n*   `border spacing`\n*   Caption side\n*   Empty cells\n*   Table\
  \ layout\n\n使用 css 创建简单表格的语法：\n\n```html\n<html>\n<body>\n<table class=\"table\"\
  \ border=\"1\">\n<tr>\n<th>first name</th>\n<th>last name</th>\n<th>marks</th>\n\
  </tr>\n<tr>\n<td>john</td>\n<td>harry</td>\n<td>40</td>\n</tr>\n</table>\n</body>\n\
  </html>\n```\n\n输出：\n\n![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)\n\n#### Border\
  \ collapse（边框折叠）\n\n```html\n<html>\n<head>\n<style type=\"text/css\">\ntable.one\
  \ {border-collapse:collapse;}\ntable.two {border-collapse:separate;}\ntd.a {\nborder-style:dotted;\n\
  border-width:3px;\nborder-color:#000000;\npadding: 10px;\n}\ntd.b {\nborder-style:solid;\n\
  border-width:3px;\nborder-color:#333333;\npadding:10px;\n}\n</style>\n</head>\n\
  ```\n\n#### Border spacing（边框间距）\n\n```html\n<html>\n<head>\n<style type=\"text/css\"\
  >\ntable.one {\nborder-collapse: separate;\nwidth :400px;\nborder-spacing:10px;\n\
  }\ntable.two {\nborder-collapse: separate;\nwidth :400px;\nborder-spacing:10px 50px;\n\
  }\n</style>\n</head>\n<body>\n<table class=\"one\" border=\"1\">\n<caption> separate\
  \ border table with border-spacing </caption>\n<tr><td>a</td></tr>\n<tr><td>b</td></tr>\n\
  </table>\n</body>\n</html>\n```\n\n\n\n\nCSS 中使用了两种类型的列表，称为有序列表和无序列表。在有序列表中，所有的列表项都用序列数字或字母标记，而在无序列表中，列表项通常用项目符号标记。列表的值可以通过使用\
  \ `circle`、`decimal`、`lower-roman`、`upper-roman`、`decimal-leading-zeros`、`lower-alpha`、`upper-alpha`\
  \ 和 `square` 等值来创建。\n\n例如：\n\n```html\n<html>\n<head>\n<style>\nul.a {\n  list-style-type:square;\n\
  }\nol.c {\n  list-style-type:lower-alpha;\n}\n</style>\n</head>\n<body>\n  <h2>CSS\
  \ 有序列表与无序列表</h2>\n  <p>无序列表</p>\n  <ul class=\"a\">\n    <li>one,</li>\n    <li>two</li>\n\
  \    <li>three,</li>\n  </ul>\n  <ul class=\"b\">\n    <li>one,</li>\n    <li>two</li>\n\
  \    <li>three,</li>\n  </ul>\n  <p>有序列表</p>\n  <ol class=\"c\">\n    <li>one,</li>\n\
  \    <li>two</li>\n    <li>three,</li>\n  </ol>\n  <ol class=\"d\">\n    <li>one,</li>\n\
  \    <li>two</li>\n    <li>three,</li>\n  </ol>\n</body>\n</html>\n```\n\n输出：\n\n\
  CSS 有序列表与无序列表\n无序列表\n● one,\n● two\n● three,\n● one,\n● two\n● three,\n有序列表\nA.\
  \ one,\nB. two\nC. three,\n1. one,\n2. two\n3. three,\n\n### 图标\n通过使用 HTML 的图标库，我们也可以通过\
  \ CSS 添加不同类型的图标。这些图标包括 Font Awesome 图标、Bootstrap 图标和 Google 图标。\n\nFont Awesome\
  \ 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n```\n\nBootstrap 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
  >\n```\n\nGoogle 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/icon?Family=material+icons\"\
  >\n```\n\n示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\"\
  \ href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n</head>\n<body>\n  <h1>css icons</h1>\n  <i class=\"fa fa-cloud\" style=\"font-size:32px;\"\
  ></i>\n  <i class=\"fa fa-heart\" style=\"font-size:32px;\"></i>\n  <i class=\"\
  fa fa-file\" style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-car\" style=\"font-size:32px;\"\
  ></i>\n  <i class=\"fa fa-bars\" style=\"font-size:32px;\"></i>\n</body>\n</html>\n\
  ```\n![image_rsrc9FY.jpg](img/image_rsrc9FY.jpeg)\n\n### 下拉菜单\n我们也可以通过 CSS 创建下拉菜单。由于与\
  \ HTML 元素相同，下拉菜单由一个无序列表和嵌套列表组成。列表用于创建下拉结构。例如：\n\n```html\n<html>\n<head>\n<title>dropdown\
  \ css</title>\n</head>\n<body>\n  <nav>\n    <ul>\n      <li class=\"level-1\">\n\
  \        <a href=\"\">list\n        <ul>\n          <li><a href=\"\">page 1</a></li>>\n\
  \          <li><a href=\"\">page 2</a></li>>\n          <li><a href=\"\">page 3</a></li>>\n\
  \          <li><a href=\"\">page 4</a></li>>\n        </ul>\n      </li>\n    </ul>\n\
  \  </nav>\n</body>\n</html>\n```\n\n输出：\n![image_rsrc9FZ.jpg](img/image_rsrc9FZ.jpeg)\n\
  \n### 层与可见性\n\n#### 层\n通过 CSS，我们可以通过实现 `z-index` CSS 属性来创建各种区域的多个层。例如：\n\n```html\n\
  <html>\n<head></head>\n<body>\n  <div style=\"background-color:blue; width:300px;\
  \ height:100px; position:relative; top:10px; left:80px; z-index:2\"></div>\n  <div\
  \ style=\"background-color:red; width:300px; height:100px; position:relative; top:-60px;\
  \ left:35px; z-index:1;\"></div>\n  <div style=\"background-color:black; width:300px;\
  \ height:100px; position:relative; top:-20px; left:120px; z-index:3;\"></div>\n\
  </body>\n</html>\n```\n输出：\n![image_rsrc9G0.jpg](img/image_rsrc9G0.jpeg)\n\n####\
  \ 可见性\nCSS 中的 `visibility` 属性允许我们隐藏元素。`visibility` 有预定义值，包括 `visible` 和 `hidden`。实现如下：\n\
  \n```html\n<p>visible</p>\n<p style=\"visibility:hidden;\">hidden</p>\n```\n\n###\
  \ 布局与动画\n\n#### 布局\n通过 CSS，我们可以通过 `display` 属性来实现网页的布局。实现 CSS 布局的方法包括 `normal flow`、`grid`、`floats`、`table\
  \ layout`。\n\n#### 动画\nCSS 动画允许元素从一种样式变为另一种样式，为此我们需要指定一些关键帧。例如：\n\n```css\n@keyframes\
  \ sample {\n  from {background-color:blue;}\n  to {background-color:brown;}\n}\n\
  /* 应用动画到 */\ndiv {\n  width:100px;\n  height:100px;\n  background-color:blue;\n\
  \  animation-name:sample;\n  animation-duration:4s;\n}\n```\n\n#### 如何有效使用 CSS\n\
  其他 CSS 属性和元素可以提高网页的图形和吸引力。虽然学习和实现所有 CSS 属性非常关键，使用良好的编辑器会有帮助。编写 CSS 时，您还应该避免使用内联代码，并将样式或属性放在外部样式表中。检查您的代码在\
  \ Chrome 和 Safari 等最新浏览器中是否运行是一个好主意，这样可以确保网页的显示和格式。CSS 代码还可以作为其他项目的模板，您可以将旧代码复到新项目中。多个类也可以通过间距分离来实现，我们可以从\
  \ CSS 继承中获益。\n\n## 第十章：编程基础\n\n### 选择编程语言\n由于我们已经详细讨论了所有主要的编程语言及其语法，初学者可以选择一种最容易学习和实现的语言。虽然大多数主流语言如\
  \ `C`、`C++` 和 `Java` 的语法相似，但在编写程序时需要关注几个重要方面。`C` 和 `C++` 是初学者开发应用程序的最佳选择，因为它们提供了深入的理解和清晰的概念。对于开发网络插件、桌面应用程序或移动应用程序，可以考虑\
  \ `Java` 语言，因为它提供了完整的支持和功能。`HTML`、`CSS` 和 `PHP` 是网站开发的核心语言，初学者很容易学会。作为程序员，不要局限于单一语言，尝试最新的技术和实现。\n\
  \n多种计算机编程语言可以解决特定问题。为了让事情变得简单，初学者可以根据自己的技能选择最合适且易于实现的编程语言。编程取决于其他因素，如应用程序的可用性、安全性、兼容性和响应时间。\n\
  \n高效编程技巧\n\n\n\n\n# 编程技巧\n\n虽然编写易于理解的代码并满足程序需求是计算机编程的主要部分，但仍有一些基本的技巧和方法可以提高程序员的效率。从最关键的考虑点开始，程序员应该避免向函数传递长参数列表，并尽量尝试使用\
  \ `int` 指针或 `void` 函数类型。此外，不要将 `chars` 转换为其他数据类型，因为 `char` 变量可以位于内存的任何位置。\n\n此外，全局变量绝不能用一个小型函数进行初始化，并尽量减少对浮点数进行数学运算的使用。这将缩短执行时间并消耗更少的内存。当代码达到数千行时，全局变量和循环会使程序员难以处理应用程序，且微小的变动都会导致巨大的问题。\n\
  \n在方法或函数内部编写 `switch case` 语句、循环和 `try-catch` 是一种理想的方法。记住，方法也应该写在 `class` 和函数定义内部。此外，使用合适的结构来构建应用程序是一个很好的方法，这也能提高编码规范。\n\
  \n最后但同样重要的是，还可以考虑版本控制软件来提高应用程序性能并发布更新。虽然这是专业程序员使用的方法，但对于学者来说，`mercurial` 或 `git`\
  \ 等工具也容易学习和使用。\n\n在编写代码时，避免深层嵌套并限制行长度，因为这会使代码难以阅读。\n\n## 增强你的基础技能\n\n为了成为一名优秀的程序员，必须意识到计算机编程中所有关键和主要的概念。了解算法和数据结构的基础知识是提高解决问题能力的极佳方法。此外，编写单元测试是另一种提升思维和编码能力的方法。在完成编码后，建议进行深度的代码审查，并发现任何错误或待改进之处。作为回报，这项活动也将提高应用程序的性能和效率。\n\
  \n代码必须始终简单且有意义。通过使用适当的命名规范，你可以毫不费力地替换变量或方法。记住，为你的应用程序创建一个特定的文件夹和文件可以带来巨大的收益，你可以轻松地进行维护和调试。学习编程基础是培养强大的开发和分析能力的关键方面。\n\
  \n此外，尝试通过解决编程练习题和编写简单的代码来实练你的编码技能。这不仅会提升你的编程水平，你还能开发出高效有效的新解决方案。花时间学习编程基础也更容易适应最新的技术并学习新的编程方法。通过学习和实现新的方法、函数和方案，可以让编程变得有趣。\n\
  \n## 结论\n\n《零基础学编程》（coding for absolute beginners）的设计初编写初旨在为初学者提供计算机编程的有价值的知识、信息和原则。本书彻底涵盖了主要的编程语言，并提供了实现给定概念和发现的指南。\n\
  \n编写计算机代码需要开发者遵循预定义的语法和流程。根据项目需求，可以选择一种易于实现的语言，并关注现有的工具和技术。计算机编程由多个任务组成，包括编写源代码、测试、系统实现、方法论、调试和功能实现。\n\
  \n在读完这本书后，我确定新手程序员可以培养强大的分析和思维能力，并对每种语言的给定概念有深入的理解。本书是在大量的研究和事实调查后编写的，以便向读者传递正确的信息和语法。\n\
  \n我希望宝贵的读者们通过阅读本手册的章节，能够学习、适应并实施计算机编程技术，并培养敏锐的编码技能。《零基础学编程》以简单易懂的方式，涵盖了每种编程语言的所有主要和次要解释。\n\
