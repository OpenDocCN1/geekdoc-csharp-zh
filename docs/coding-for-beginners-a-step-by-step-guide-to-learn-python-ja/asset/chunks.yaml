  trans: "\nCSS 中使用了两种类型的列表，称为有序列表和无序列表。在有序列表中，所有的列表项都用序列数字或字母标记，而在无序列表中，列表项通常用项目符号标记。列表的值可以通过使用\
    \ `circle`、`decimal`、`lower-roman`、`upper-roman`、`decimal-leading-zeros`、`lower-alpha`、`upper-alpha`\
    \ 和 `square` 等值来创建。\n\n例如：\n\n```html\n<html>\n<head>\n<style>\nul.a {\n  list-style-type:square;\n\
    }\nol.c {\n  list-style-type:lower-alpha;\n}\n</style>\n</head>\n<body>\n  <h2>CSS\
    \ 有序列表与无序列表</h2>\n  <p>无序列表</p>\n  <ul class=\"a\">\n    <li>one,</li>\n    <li>two</li>\n\
    \    <li>three,</li>\n  </ul>\n  <ul class=\"b\">\n    <li>one,</li>\n    <li>two</li>\n\
    \    <li>three,</li>\n  </ul>\n  <p>有序列表</p>\n  <ol class=\"c\">\n    <li>one,</li>\n\
    \    <li>two</li>\n    <li>three,</li>\n  </ol>\n  <ol class=\"d\">\n    <li>one,</li>\n\
    \    <li>two</li>\n    <li>three,</li>\n  </ol>\n</body>\n</html>\n```\n\n输出：\n\
    \nCSS 有序列表与无序列表\n无序列表\n● one,\n● two\n● three,\n● one,\n● two\n● three,\n有序列表\n\
    A. one,\nB. two\nC. three,\n1. one,\n2. two\n3. three,\n\n### 图标\n通过使用 HTML 的图标库，我们也可以通过\
    \ CSS 添加不同类型的图标。这些图标包括 Font Awesome 图标、Bootstrap 图标和 Google 图标。\n\nFont Awesome\
    \ 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n```\n\nBootstrap 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
    >\n```\n\nGoogle 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/icon?Family=material+icons\"\
    >\n```\n\n示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\"\
    \ href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n</head>\n<body>\n  <h1>css icons</h1>\n  <i class=\"fa fa-cloud\" style=\"\
    font-size:32px;\"></i>\n  <i class=\"fa fa-heart\" style=\"font-size:32px;\"></i>\n\
    \  <i class=\"fa fa-file\" style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-car\"\
    \ style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-bars\" style=\"font-size:32px;\"\
    ></i>\n</body>\n</html>\n```\n![image_rsrc9FY.jpg](img/image_rsrc9FY.jpeg)\n\n\
    ### 下拉菜单\n我们也可以通过 CSS 创建下拉菜单。由于与 HTML 元素相同，下拉菜单由一个无序列表和嵌套列表组成。列表用于创建下拉结构。例如：\n\
    \n```html\n<html>\n<head>\n<title>dropdown css</title>\n</head>\n<body>\n  <nav>\n\
    \    <ul>\n      <li class=\"level-1\">\n        <a href=\"\">list\n        <ul>\n\
    \          <li><a href=\"\">page 1</a></li>>\n          <li><a href=\"\">page\
    \ 2</a></li>>\n          <li><a href=\"\">page 3</a></li>>\n          <li><a href=\"\
    \">page 4</a></li>>\n        </ul>\n      </li>\n    </ul>\n  </nav>\n</body>\n\
    </html>\n```\n\n输出：\n![image_rsrc9FZ.jpg](img/image_rsrc9FZ.jpeg)\n\n### 层与可见性\n\
    \n#### 层\n通过 CSS，我们可以通过实现 `z-index` CSS 属性来创建各种区域的多个层。例如：\n\n```html\n<html>\n\
    <head></head>\n<body>\n  <div style=\"background-color:blue; width:300px; height:100px;\
    \ position:relative; top:10px; left:80px; z-index:2\"></div>\n  <div style=\"\
    background-color:red; width:300px; height:100px; position:relative; top:-60px;\
    \ left:35px; z-index:1;\"></div>\n  <div style=\"background-color:black; width:300px;\
    \ height:100px; position:relative; top:-20px; left:120px; z-index:3;\"></div>\n\
    </body>\n</html>\n```\n输出：\n![image_rsrc9G0.jpg](img/image_rsrc9G0.jpeg)\n\n####\
    \ 可见性\nCSS 中的 `visibility` 属性允许我们隐藏元素。`visibility` 有预定义值，包括 `visible` 和 `hidden`。实现如下：\n\
    \n```html\n<p>visible</p>\n<p style=\"visibility:hidden;\">hidden</p>\n```\n\n\
    ### 布局与动画\n\n#### 布局\n通过 CSS，我们可以通过 `display` 属性来实现网页的布局。实现 CSS 布局的方法包括 `normal\
    \ flow`、`grid`、`floats`、`table layout`。\n\n#### 动画\nCSS 动画允许元素从一种样式变为另一种样式，为此我们需要指定一些关键帧。例如：\n\
    \n```css\n@keyframes sample {\n  from {background-color:blue;}\n  to {background-color:brown;}\n\
    }\n/* 应用动画到 */\ndiv {\n  width:100px;\n  height:100px;\n  background-color:blue;\n\
    \  animation-name:sample;\n  animation-duration:4s;\n}\n```\n\n#### 如何有效使用 CSS\n\
    其他 CSS 属性和元素可以提高网页的图形和吸引力。虽然学习和实现所有 CSS 属性非常关键，使用良好的编辑器会有帮助。编写 CSS 时，您还应该避免使用内联代码，并将样式或属性放在外部样式表中。检查您的代码在\
    \ Chrome 和 Safari 等最新浏览器中是否运行是一个好主意，这样可以确保网页的显示和格式。CSS 代码还可以作为其他项目的模板，您可以将旧代码复到新项目中。多个类也可以通过间距分离来实现，我们可以从\
    \ CSS 继承中获益。\n\n## 第十章：编程基础\n\n### 选择编程语言\n由于我们已经详细讨论了所有主要的编程语言及其语法，初学者可以选择一种最容易学习和实现的语言。虽然大多数主流语言如\
    \ `C`、`C++` 和 `Java` 的语法相似，但在编写程序时需要关注几个重要方面。`C` 和 `C++` 是初学者开发应用程序的最佳选择，因为它们提供了深入的理解和清晰的概念。对于开发网络插件、桌面应用程序或移动应用程序，可以考虑\
    \ `Java` 语言，因为它提供了完整的支持和功能。`HTML`、`CSS` 和 `PHP` 是网站开发的核心语言，初学者很容易学会。作为程序员，不要局限于单一语言，尝试最新的技术和实现。\n\
    \n多种计算机编程语言可以解决特定问题。为了让事情变得简单，初学者可以根据自己的技能选择最合适且易于实现的编程语言。编程取决于其他因素，如应用程序的可用性、安全性、兼容性和响应时间。\n\
    \n高效编程技巧\n"
