    For example, to define a primary key on the `id` column when the `students` table
    is created, we can use the following sql statement:


    ```sql

    Create table students (

    id in not null ,

    firstname varchar ( 255 ),

    lastname varchar not null ( 255 ),

    marks int ,

    primary key (id)

    );

    ```


    ### Foreign key

    The `foreign key` constraint in sql is implemented to link two tables together
    for which the `foreign key` in one table, refers to the `primary key` from the
    other table.


    Syntax for implementing the `foreign key` constraint on `studentid` column to
    create `student` table:


    ```sql

    Create table student (

    studentid in not null ,

    studentmarks int not null ,

    classid int ,

    primary key (studentid),

    foreign key (classid) references students( stude,ntid)

    );

    ```


    ### Constraints and useful resources

    Constraints are the specific rules that are implemented on data columns of a table.
    generally, constraints are implemented to limit the type of data that can be inserted
    into a table. most commonly, this includes `not null` constraint, `default` constraint,
    `unique` constraint, `primary key`, `foreign key`, `check` constraint, and `index`.


    Furthermore, integrity constraints can also be used to avail better consistency
    and accuracy of data present in the relational database. usually, `primary key`,
    `foreign key`, and `unique` constraints are a part of referential integrity (ri).


    In order to improve the performance of sql database, there are several important
    factors that can be implemented with ease. while writing a column name, it is
    advised that `select` statement is used rather than the `*` delimiter. for example:


    ```sql

    Select * from students

    ```


    Furthermore, setting the `nocount` on statement will reduce the time required
    for sql server to update rows for insert, delete, or update operations


    ## Chapter four: c

    C programming language was developed at at & t’s bell laboratories in the usa
    in 1972. generally, there are two major categories of programming languages known
    as high level language and low level language, but c is ranged as a middle level
    language. the purpose of this language is to provide low level access to memory
    and has also given syntax to other major programming languages such as `php` and
    `java`.


    ### Introduction and simple programs

    Being a structured language, programmers can create partitioned code blocks and
    create business applications by implementing different approaches and programming
    techniques. moreover, we can also write new functions and repeat the throughout
    the application in the c library.


    ### Starting with c programming

    Writing a c program is simple and easy for beginners. starting with the basic
    program syntax, we can develop c applications and programs as follows:


    ```c

    #include <stdio.h>


    Int main ()

    {

    int a = 2 ;

    printf( "%d" ,a);

    return 0 ;

    }

    ```


    #### Header files

    The first part of writing a c program is selection of header files. generally,
    a header file is written with extension `.h` and also contains function declarations.
    to include a header file, we can follow the syntax as follows:


    ```c

    #include <string.h>

    ```


    Examples of c header files:


    | Header file | Definition |

    | :--- | :--- |

    | Stdio.h | Used to define input and output functions |

    | String.h | Used for string handling |

    | Stdde,f.h | Defines useful types and macros |

    | Stdlib.h | Defines memory allocation |

    | Stdint.h | Used for defining integer types |

    | Math.h | Used to perform mathematical functions |


    #### Methods and variable declaration

    The next part of writing a c program is to define a method and declare the variables.
    syntax for declaring method is:


    ```c

    Int main ()

    {

    ```


    Syntax for variable declaration is:


    ```c

    Int main ()

    {

    Int z;

    }

    ```


    Program body:


    ```c

    Int main ()

    {

    int z;

    printf(:d, z);

    return 0 ;

    }

    ```

    To terminate the program we can use the return statement: `return 0`.


    #### Keywords

    Keywords are the main force of any programming language and are also known as
    reserved words. although there are several keywords for high level language, only
    32 keywords are allowed to be used in c which are as follows: `Double`, `Long`,
    `Int`, `Switch`, `Case`, `Enum`, `Type`, `Union`, `Const`, `For`, `Do`, `While`,
    `Static`, `Default`, `Auto`, `Break`, `else`, `Struct`, `Float`, `Short`, `Char`,
    `Return`, `Void`, `Continue`, `If`, `Goto`, `Sizeof`, `Volatile`.


    #### Data types and variables

    In the c language, data types are used to define a variable so that storage can
    be assigned before it being used in the program. the built-in data types of the
    c language include `float`, `int`, and `double`. these data types have modifiers
    `signed` and `unsigned`. Following are the valid numbers, alphabets, and symbols
    that are allowed in the c language:


    - Alphabets: a-z, A-Z

    - Symbols: - ~ ! # % ^ & * ( ) _ - = | \ { } ] : ; '' < > .

    - Digits: 0,1,2,3,4…


    #### Variables

    To declare the variables in c we can follow the program syntax as follows:


    ```c

    #include <stdio.h>

    // variable declaration:

    extern int a, b;

    extern int c;

    Int main () {

    /* variable definition: */

    int a, b;

    int c;

    float f;

    /* initialization */

    a = 30 ;

    b = 20 ;

    c = a + b;

    printf( "value of c : %d \n" , c);

    return 0 ;

    }

    ```

    The output of this program is: 50.


    #### Scope of variables

    The scope of variables in any programming language is set to allow certain permissions
    to the variables. generally variables are categorized as local variables, global
    variables, and formal parameters.


    Local variables are declared within a block and can be only used by statements
    that are written in a specific region of the program. as they are not known to
    other functions in the program, we cannot access local variables outside the function.


    Global variables are usually defined outside a function and hold their values
    throughout the program. it can be accessed and called by any function within the
    program. local variables need to be initialized by the programmer whereas the
    global variables get initialized automatically.


    ### Loops and functions

    #### Loops

    Loops are an essential part of every programming language and allow the developers
    to execute a specific statement multiple times. there are 4 different types of
    loops used in the c programming language that are briefed as follows:


    1. for loop: used to execute a statement a specific number of times and is also
    considered to abbreviate the code to handle loop variable.

    2. while loop: repeats the given statement and checks whether the given condition
    is true or false. before executing the loop body, it checks all of the conditions.

    3. do while loop: works the same as the while loop, however, the do while loop
    only checks the condition at the end.

    4. nested loops: a loop inside a loop is known as nested loop.


    To change the execution of loops from the normal sequence, we can use the loop
    control statements as well. the `break` statement exits the loop and transfers
    execution to the next statement whereas the `continue` statement causes the loop
    to skip the rest of its body and re-check the given condition.


    For transferring control to the labeled statement, we can use the `goto` statement.


    #### Functions

    To define a function in the c programming language, the following syntax is recommended:


    ```c

    Return type, function name( parameter list) {

    function body

    }

    ```

