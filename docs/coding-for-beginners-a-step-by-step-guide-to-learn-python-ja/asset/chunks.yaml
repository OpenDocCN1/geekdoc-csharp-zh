    `border- property` 属性可以用于设置 html 文档中元素 `border` 的唯一样式、颜色和宽度。css 中创建边框的不同样式包括 `dotted`、`solid`、`dashed`、`groove`、`double`、`insert`、`outline`、`hidden`、`ridge`
    和 `none`。


    创建不同边框样式的语法：


    ```css

    P.dotted {border-style,: dotted;}

    P.solid {border-style,: solid;}

    P.dashed {border-style,: dashed;}

    P.groove, {border-style,: groove;}

    P.double, {border-style,: double;}

    P.insert {border-style,: insert;}

    P.outline {border-style,: outset;}

    P.hidden {border-style,: hidden;}

    P.ridge, {border-style,: ridge;}

    P.none, {border-style,: none;}

    ```


    在 css 中，`height` 和 `width` 属性可以设置元素的高度和宽度。在 css 中实现高度和宽度属性的语法定义如下：


    ```css

    Div {

    Height: 200px;

    Width: 50%;

    Background-color: green;

    }

    ```


    ### 外边距与内边距


    #### Margin


    在 css 中，`margin` 属性用于在元素周围创建空间。我们可以为每一侧设置不同的边距大小。`margin` 属性有不同的值，如长度、宽度以及由浏览器计算的
    margin。


    语法：


    ```css

    Body {

    margin: size;

    }

    ```


    #### Padding


    Css 内边距可以定义边框或在元素周围创建空间。在 html 网站上设置 css 内边距有多种方法，针对单独的侧，如顶、右、底和左。`padding` 有长度和宽度值，可以通过以下
    css 语法实现：


    ```css

    Body {

    Padding: size;

    }

    ```


    ### 字体和文本


    #### Font


    css 中的 `Font` 属性用于指定其他字体属性并设置内容的字体。css 中不同的字体属性包括 `font style`、`font family`、`font
    weight`、`font variant` 和 `font size`。


    以下是每个字体属性的简单 css 语法：


    字体样式，


    现场演示


    ```html

    <html>

    <head>

    </head>

    <body>

    <p style= "font-style:calibri;">

    此文本将以 calibri 样式渲染，

    </p>

    </body>

    </html>

    ```


    字体族


    ```html

    <p style= "font-family: georgia, calibri, serif;">

    ```


    字体变体


    ```html

    <p style= "font-variant: small-caps;">

    ```


    字体粗


    ```html

    <p style= "font-weight:500;">

    ```


    字体大小，


    ```html

    <p style= "font-size:20px;">

    字体大小， 20 像素

    </p>

    <p style= "font-size:small;">

    小号字体

    </p>

    <p style= "font-size:large;">

    大字体

    </p>

    ```


    ![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)


    #### Text


    现在通过 css 文本属性可以将文本转换为不同的颜色、样式和缩进。这些，文本属性包括：


    *   `Text color`：更改文本颜色。

    *   `Text alignment`：指定文本的水平或垂直对齐。

    *   `Text decoration`：文本装饰的轮廓。

    *   `Text transformation`：控制文本的大小写。

    *   `Text indentation`：指定第一行的缩进。

    *   `Letter spacing`：增加或减少单词之间的间距。

    *   `Line height`：指定行高。

    *   `Text direction`：设置书方向。

    *   `Word spacing`：设置单词之间的空间。

    *   `Text shadow`：在文本上添加阴影效果。


    css 文本属性的语法：


    ```css

    Text color:

    Body {

    color: red;

    }

    Text alignment:

    H1 {

    text-align: center;

    }

    H2 {

    text-align: left;

    }

    H3 {

    text-align: right;

    }

    Text decoration

    H1 {

    text-decoration: underline/through;

    }

    Text transformation

    P.uppercase {

    text-transform: uppercase;

    }

    P.lowercase {

    text-transform: lowercase;

    }

    P.capitalize {

    text-transform: capitalize;

    }

    Text indentation

    P {

    text-indent: 100px;

    }

    Letter spacing

    H1 {

    letter-spacing: 3px;

    }

    H2 {

    letter-spacing: -3px;

    }

    Line height

    P.small {

    line-height: 0.6;

    }

    P.big {

    line-height: 1.6;

    }

    Text direction

    P {

    direction: rtl;

    }

    Text shadow

    H1 {

    text-shadow: 4px 3px green;

    }

    Word spacing

    H1 {

    word-spacing: 10px;

    }

    ```


    ### 链接和外边距


    有不同的 css 属性可以处理链接。这些属性包括 `:link`, `:visited`, `:hover` 和 `:active`。实现这些属性的语法定义如下：


    ```css

    :link {color: #000000}

    :visited {color: #006600}

    :hover {color: #ffcc00}

    :active {color: #ff00cc}

    ```


    #### 表格


    用于设计 html 表格的 css 属性有：


    *   `border collapse`

    *   `border spacing`

    *   Caption side

    *   Empty cells

    *   Table layout


    使用 css 创建简单表格的语法：


    ```html

    <html>

    <body>

    <table class="table" border="1">

    <tr>

    <th>first name</th>

    <th>last name</th>

    <th>marks</th>

    </tr>

    <tr>

    <td>john</td>

    <td>harry</td>

    <td>40</td>

    </tr>

    </table>

    </body>

    </html>

    ```


    输出：


    ![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)


    #### Border collapse（边框折叠）


    ```html

    <html>

    <head>

    <style type="text/css">

    table.one {border-collapse:collapse;}

    table.two {border-collapse:separate;}

    td.a {

    border-style:dotted;

    border-width:3px;

    border-color:#000000;

    padding: 10px;

    }

    td.b {

    border-style:solid;

    border-width:3px;

    border-color:#333333;

    padding:10px;

    }

    </style>

    </head>

    ```


    #### Border spacing（边框间距）


    ```html

    <html>

    <head>

    <style type="text/css">

    table.one {

    border-collapse: separate;

    width :400px;

    border-spacing:10px;

    }

    table.two {

    border-collapse: separate;

    width :400px;

    border-spacing:10px 50px;

    }

    </style>

    </head>

    <body>

    <table class="one" border="1">

    <caption> separate border table with border-spacing </caption>

    <tr><td>a</td></tr>

    <tr><td>b</td></tr>

    </table>

    </body>

    </html>

    ```


