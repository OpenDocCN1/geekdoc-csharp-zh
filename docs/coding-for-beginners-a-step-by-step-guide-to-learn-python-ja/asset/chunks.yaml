    In a function, the return type is known as the data type of the function value
    that is returned by the function itself, whereas the action name of the function
    is known as function name. whenever a function is invoked, we are required to
    pass a parameter and its value is referred to as an argument or actual parameter.
    it must be noted that parameters are not compulsory and a function might also
    be executed without any parameters.


    Function body contains multiple statements and usually defines the actions that
    are to be performed within the function. to declare a `min()` function in c, we
    can use the syntax as follows:


    ```

    Int min(int num1, int num2);

    ```


    To call a function within the program, we are required to pass the parameters
    and function name. if any value has been returned by the function, it can be stored
    as well.


    ## Methods to pass an argument to a function


    ### Call by value

    The call by value method is used to copy the actual value from an argument to
    the formal parameter of the function. the changes that are made to the parameter
    have no direct effect on the argument within the function.


    ### Call by reference

    The call by reference method is used to copy the address of an argument to the
    formal parameter. changes made in the parameter directly affect the argument.


    ## Arrays, strings, and linked lists


    ### Arrays

    An array is a collection of elements that can store a fixed size sequential data
    of the same type., consisting of contiguous memory locations, an array can be
    declared through the following syntax:


    ```

    Type arrayname, [arraysize];

    ```


    Example:

    ```

    3

    5

    6

    8

    10

    20

    ```


    All of the arrays have 0 as the index of their first element and it is also known
    as the base index. note, that the size of an array cannot be changed after declaration.
    to initialize an array in the c language, we can use the statement as follows:


    ```

    Int data[50];

    ```


    To initialize an array, we can use the syntax mentioned below:


    ```

    Int data[10] = {3, 2, 7, 8, 23, 42, 64, 73, 23, 77};

    ```


    In this array, the index `0` has value `3` whereas the index `9` has value `77`.


    Below is an example to find the average of 5 integers using arrays in c programming
    language:


    ```c

    #include <stdio.h>


    Int main ()

    {

    int avg = 0 ;

    int sum =0 ;

    int x =0 ;

    int num[ 4 ];

    for (x =0 ; x <5 ;x++ )

    {

    printf( enter number %d \n ", (x +1));

    scanf( "%d", & num[x]);

    }

    for (x =0 ; x <5 ;x++ )

    {

    sum = sum + num[x];

    }

    avg = sum /5 ;

    printf( average of entered number is: %d", avg);

    return 0 ;

    }

    ```


    ### 2d and 3d arrays

    C programming language, supports 2d and 3d multi-dimensional arrays as well. to
    initialize the two-dimensional arrays, we use the following syntax:


    ```

    Int z[2][3] = {

    {0, 1,}

    {2, 3, 4}

    {5,6,9}

    };

    ```


    Or


    ```

    Int z[2][3] = {0, 1, 2, 3 , 4, 5, 6, 9};

    ```


    ### Strings

    In c programming, strings are created by using a one-dimensional array of characters.
    the string must be terminated by a null character also known as `\0`.


    To declare a string in c, we can follow the syntax mentioned below:


    ```

    Char str_name,[size];

    ```


    `‘str_name,’` is used to define the string whereas the size tells us about the
    length of the string.


    The below c program is written to declare, read, and print a string:


    ```c

    #include<stdio.h>


    Int main ()

    {

    // declaring string

    char str[ 10 ];

    // reading string

    scanf( "%s",str);

    // print string

    printf( "%s",str);

    return 0 ;

    }

    ```


    ## pointers and structures

    A pointer is a variable that has a value, the same as the address of another variable,
    in the program. as it has direct address to the memory location, we can declare
    a pointer in advance, and store it at any variable address. the syntax for declaring
    a pointer variable is as follows:


    ```

    Type *var;

    ```


    To use pointers at first we are required to define a pointer variable and assign
    the address of a variable to the pointer. next we can access the value from the
    address is given in the pointer variable. the whole of this operation is performed
    with the help of `*` operator which returns the value of variable address defined
    by. it must be noted that a normal variable stores a value whereas the pointer
    variable stores the variable address. value of the null pointer is 0, the size
    of any pointer is 2 byte. Below is a sample program written by pointers in c language:


    ```c

    #include <stdio.h>

    Int main ()

    {

    int *ptr, q;

    q =100 ;

    ptr= &q;

    printf( "%d",*ptr);

    return 0 ;

    }

    ```


    ### Structures

    Structure is defined as a collection of variables and allows the programmers to
    combine different data types. structure can be referred to that of an array but
    the only difference is that an array can only hold data of a similar type. Taking
    an example of an organization, we can use structures to manage a record of employees
    as follows:


    *   Name

    *   Employee id

    *   Designation

    *   Region


    The statement for defining structure in c language is:


    ```

    Struct employee {

    char name[10];

    int employee_id;

    char designation[50];

    char region[100];

    };

    ```


    To initialize the structure at compile time, the statement is:


    ```

    Struct employee = {34,12,52,66};

    ```


    ### Accessing the structure

    In order to access the structure, we are required to use the access operator.
    to access the members of a structure in the c programming language, the below
    mentioned of operators can be used:


    *   Member operator: `.`

    *   Structure pointer operator: `->`


    Sample program for accessing the structure:


    ```c

    #include <stdio.h>

    Struct distance {

    int feet;

    float inch;} dist1, dist2, sum;


    Int main ()

    {

    printf( 1st distance, \n );

    printf( enter feet: ");

    scanf( "%d", &dist1.feet);

    printf( enter inch: ");

    scanf( "%f", &dist1.inch);

    printf( 2nd distance, \n );

    printf( enter feet: ");

    scanf( "%d", &dist2.feet);

    printf( enter inch: ");

    scanf( "%f", &dist2.inch);

    sum.feet = dist1.feet + dist2.feet;

    sum.inch = dist1.inch + dist2.inch;

    while (sum.inch >= 12 )

    {

    ++sum.feet;

    sum.inch = sum.inch - 12 ;

    }

    printf( sum of distances = %d ''-%.1f ", sum.feet, sum.inch);

    return 0 ;

    }

    ```


