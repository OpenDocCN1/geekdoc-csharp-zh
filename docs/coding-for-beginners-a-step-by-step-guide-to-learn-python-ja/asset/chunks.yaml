  trans: "\n\n在 hype, rte, xt 标记语言中，通过添加框架（frames）可以在浏览器窗口中创建多个区域，以便为每个区域加载一个唯一的 html\
    \ 文档。若要在网页中使用框架，应该使用 `<frameset>` 标签而不是 `<body>` 标签，后者可以使用特定的 `rows` 和 `cols`\
    \ 属性进行定义。\n\n### 创建框架的示例 html 标签：\n\n```html\n<<html>\n<head>\n  <title>html frames</title>\n\
    </head>\n<frameset rows=\"10%,80%,10%\">\n  <frame name=\"top\" src=\"/html/top_frame.htm\"\
    \ />\n  <frame name=\"main\" src=\"/html/main_frame.htm\" />\n  <frame name=\"\
    bottom\" src=\"/html/bottom_frame.htm\" />\n  <noframes>\n    <body>your browser\
    \ does not support frames.</body>\n  </noframes>\n</frameset>\n</html>\n```\n\n\
    ### Iframe\n为了创建一个嵌套的浏览上下文，可以使用 `<iframe>` 标签将新的 html 文档添加到现有的文档中。要创建一个 iframe，可以配合\
    \ `<iframe>` 标签实现以下语法：\n\n```html\n<iframe src=https://www.website.com></iframe>\n\
    ```\n\n### 基础 html 标签完整表格：\n`<a>`, `<abbr>`, `<acronym>`, `<address>`, `<app>`,\
    \ `<area>`, `<article>`, `<aside>`, `<audio>`, `<b>`, `<base>`, `<basefont>`,\
    \ `<bdi>`, `<bdo>`, `<big>`, `<blockquote>`, `<body>`, `<br>`, `<button>`, `<canvas>`,\
    \ `<caption>`, `<center>`, `<cite>`, `<code>`, `<col>`, `<colgroup>`, `<data>`,\
    \ `<datalist>`, `<dd>`, `<del>`, `<details>`, `<dfn>`, `<dialog>`, `<dir>`, `<div>`,\
    \ `<dl>`, `<dt>`, `<em>`, `<embed>`, `<fieldset>`, `<figcaption>`, `<figure>`,\
    \ `<font>`, `<footer>`, `<form>`, `<frame>`, `<frameset>`, `<h1>`-`<h6>`, `<head>`,\
    \ `<header>`, `<hr>`, `<html>`, `<i>`, `<iframe>`, `<img>`, `<input>`, `<ins>`,\
    \ `<kbd>`, `<label>`, `<legend>`, `<li>`, `<link>`, `<main>`, `<map>`, `<mark>`,\
    \ `<meta>`, `<meter>`, `<nav>`, `<noframes>`, `<noscript>`, `<object>`, `<ol>`,\
    \ `<optgroup>`, `<option>`, `<output>`, `<p>`, `<param>`, `<picture>`, `<pre>`,\
    \ `<progress>`, `<q>`, `<rp>`, `<rt>`, `<ruby>`, `<s>`, `<samp>`, `<script>`,\
    \ `<section>`, `<select>`, `<small>`, `<source>`, `<span>`, `<strong>`, `<style>`,\
    \ `<sub>`, `<summary>`, `<sup>`, `<svg>`, `<table>`, `<tbody>`, `<td>`, `<template>`,\
    \ `<textarea>`, `<tfoot>`, `<th>`, `<thead>`, `<time>`, `<title>`, `<tr>`, `<track>`,\
    \ `<tt>`, `<u>`, `<ul>`, `<var>`, `<video>`, `<wbr>`。\n\n### 表单\nHtml 表单是网站与用户交互的关键方面之一。表单通过使用文本字段、按钮、选择框、单选按钮、文件选择框、隐藏控件和可点击控件等组件创建。通过表单收集的数据会被发送到网络服务器，网页也可以自己拦截这些数据。大多数情况下，组件与标签关联，以描述其用途。\n\
    \n在 html 中创建表单的语法：\n```html\n<form action=\"script url\" method=\"get|post\">\n\
    \  <!-- Form elements like input, buttons etc. -->\n</form>\n```\n\n从用户获取姓名和年龄的输入表单：\n\
    ```html\n<html>\n<head>\n  <title>my first html form</title>\n</head>\n<body>\n\
    \  <form>\n    name: <input type=\"text\" name=\"name,\" />\n    <br>\n    age:\
    \ <input type=\"text\" name=\"last name,\" />\n  </form>\n</body>\n</html>\n```\n\
    输出：\n![image_rsrc9FM.jpg](img/image_rsrc9FM.jpeg)\n\n### 文本字段\nhtml 中的文本字段允许用户在表单中输入文本。创建文本字段的通用语法定义如下：\n\
    ```html\n<input type=\"text\" type=\"text\" value=\"text\">\n```\n\n### 按钮控件\n\
    有多种方法提交数据到表单。我们可以通过以下 html 标签添加可点击的按钮：\n```html\n<input type=\"submit\" name=\"\
    submit\" value=\"submit\" />\n<input type=\"reset\" name=\"reset\" value=\"reset\"\
    \ />\n<input type=\"button\" name=\"button\" value=\"button\" />\n```\n输出：\n![image_rsrc9FN.jpg](img/image_rsrc9FN.jpeg)\n\
    \n### 选择框\n要在 html 表单中创建下拉列表，可以使用 `<select>` 和 `<option>` 元素。\n```html\n<html>\n\
    <head>\n  <title>file upload</title>\n</head>\n<body>\n  <form>\n    <label for=\"\
    course\">course:</label>\n    <select name=\"course\" id=\"course\">\n      <option\
    \ value=\"webengine\">webengine</option>\n      <option value=\"calculus\">calculus</option>\n\
    \      <option value=\"science\">science</option>\n    </select>\n  </form>\n\
    </body>\n</html>\n```\n输出：\n![image_rsrc9FP.jpg](img/image_rsrc9FP.jpeg)\n\n###\
    \ 选择框\nselect 元素提供了在 html 中列出多个选项的选择。\n```html\n<html>\n<head>\n  <title>file\
    \ upload</title>\n</head>\n<body>\n  <form>\n    <label for=\"course\">course:</label>\n\
    \    <select name=\"course\" id=\"course\">\n      <option value=\"webengine\"\
    >webengine</option>\n      <option value=\"calculus\">calculus</option>\n    \
    \  <option value=\"science\">science</option>\n    </select>\n  </form>\n</body>\n\
    </html>\n```\n输出：\n![image_rsrc9FM.jpg](img/image_rsrc9FM.jpeg)\n\n### 表单元素\n\
    一旦 html 表单完成，`action` 和 `method` 两个属性用于存储和发送数据。创建表单的语法定义如下：\n```html\n<form action=\"\
    \">\n```\n\n### 设计\n在 html 中，任何网页的默认背景颜色为白色。要更改背景颜色，可以使用以下标签和属性：\n```html\n<table\
    \ bgcolor=\"#f1\">\n```\n\n### 字体\n字体是任何网站的重要部分，增强了内容的可读性。`<font>` 标签可以赋予文本特定的样式、大小和颜色，其属性包括\
    \ `size`、`color` 和 `face`。\n设置字体大小的标签为：\n```html\n<font size=\"14\">text</font>\n\
    ```\n字体标签和属性：\n```html\n<font face=\"new roman\" size=\"14\">text</font>\n```\n\
    \n### 字体颜色\n要更改字体颜色，可以使用以下 html 标签和属性：\n```html\n<html>\n<head>\n  <title>setting\
    \ font color</title>\n</head>\n<body>\n  <font color=\"blue\">text is blue,</font>\n\
    </body>\n</html>\n```\n输出：blue\n\n### 标记文本\n在 `<mark>` 和 `</mark>` 元素之间的文本显示为黄色标记。\n\
    ```html\n<p> text is marked as <mark>yellow</mark> </p>\n```\n输出：marked as yellow\n\
    \n### 元标签\n在 html 中，元标签用于向网页添加元数据。元标签的属性包括 `name`、`content`、`scheme` 和 `http-equiv`。我们可以使用\
    \ `<meta>` 标签为文档提供简短描述，这也可以提高网页的搜索引擎索引。\n```html\n<html>\n<head>\n  <title>meta\
    \ tags example,</title>\n  <meta name=\"keywords\" content=\"html meta tags, metadata\"\
    \ />\n  <meta name=\"description\" content=\"meta tags.\" />\n  <meta name=\"\
    revised\" content=\"3/7/2019\" />\n  <meta http-equiv=\"cookie\" content=\"userid=abc;\
    \ expires=monday, 08-Sep-19 23:59:59 GMT;\" />\n</head>\n<body>\n  <p>welcome\
    \ to html</p>\n</body>\n</html>\n```\n\n### 注释\n要在 html 代码中放置注释，可以遵循以下语法：\n```html\n\
    <html>\n<head> <!-- document header starts -->\n  <title>document title,</title>\n\
    </head> <!-- document header ends -->\n<body>\n  <p>document content goes here.....</p>\n\
    </body>\n</html>\n```\n\n### Html 样式表\n为了对 html 文档进行进一步设计，级联样式表（css）在网站上得以实现。它们为指定某些属性提供了简单、有效且易于维护的替代方案。我们将在下一章详细讨论\
    \ css。\n\n"
- fmt: "\nHtml includes various types of semantic elements that are used to deine\
    \ different parts of a web page. these elements include `header`, `container`,\
    \ `section`, `article`, `aside`, `details`, and `footer`. although `css` is the\
    \ best approach to design layout of a web page, we can also complete the procedure\
    \ through these html elements.\n\nA responsive web design is created by using\
    \ `html` and `css`. this procedure automatically resizes and adjusts a website\
    \ to make it look suitable on all devices such as desktop, smartphone, and tablet.\
    \ for more details regarding responsiveness, learning about `css` and `bootstrap`\
    \ language will prove to be of great advantage.\n\n# Html templates\n\nHtml website\
    \ templates are a quick and easy way to develop a website. as this template is\
