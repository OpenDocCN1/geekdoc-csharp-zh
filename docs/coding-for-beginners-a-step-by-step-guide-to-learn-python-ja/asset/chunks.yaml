  trans: "\n\n# 用于\n- 全局\n- While\n- 打印\n- With\n- Try\n- E,xe,c\n- 或\n- 是\n- E,lif\n\
    \n## 基础运算符\n\nPython 内置了许多运算符，例如算术运算符、赋值运算符、逻辑运算符、位运算符、比较运算符和成员运算符。\n\n下表简要定义了\
    \ Python 运算符的细节：\n\n| 算术运算符 | 赋值运算符 | 比较运算符 | 逻辑运算符 | 位运算符 |\n| :--- | :--- |\
    \ :--- | :--- | :--- |\n| 加法 (`+`) | 等于 (`=`) | 双等号 (`==`) | 逻辑或 | 二进制与 (`&`)\
    \ |\n| 减法 (`-`) | 加赋值 (`+=`) | 不等于 (`<>`) | 逻辑与 | 二进制或 (`\\|`) |\n| 乘法 (`*`) |\
    \ 减赋值 (`-=`) | 大于 (`>`) | 逻辑非 | 二进制异或 (`^`) |\n| 除法 (`/`) | 乘赋值 (`*=`) | 小于 (`<`)\
    \ | | 二进制左移 (`<<`) |\n| 取模 (`%`) | 除赋值 (`/=`) | 小于等于 (`<=`) | | 二进制右移 (`>>`) |\n\
    | 整除 (`//`) | 取模赋值 (`%=`) | 大于等于 (`>=`) | | 二进制取反 (`~`) |\n| 幂 (`**`) | 整除赋值 (`//=`)\
    \ | | | |\n\n## 数据类型\n\n在 Python 编程语言中，每个对象都有自己的类型和值。\n\n### Python 的内置数据类型：\n\
    \n- **数字**包括整数、浮点数、分数和复数。Python 中预定义的数据类型有 `int`、`float`、`long` 和 `complex`。\n\
    - **序列**由字符串、字节、列表和元组组成。\n- **布尔**持有 `true` 或 `false`。\n- **字典**包含以无序方式设置的键值对。\n\
    - **集合**涵盖无序的值容器。\n\n## 流程控制\n\n流程控制语句允许程序员改变程序的执行流并执行特定的操作。与其他高层编程语言一样，Python\
    \ 中使用的三个主要控制流语句是 `if`、`for` 和 `while`。下图显示了控制流语句在程序中实际的工作原理：\n\n### 条件语句\n\n####\
    \ If 语句\n`if` 语句是一个布尔表达式，以 `true` 或 `false` 的形式显示结果。\n\n#### If else 语句\n`if else`\
    \ 语句也是一个布尔表达式，包含一个可选的 `else` 语句。如果表达式为 `false`，则执行 `else` 语句。\n\n#### 嵌套语句\n语句内部的语句被称为嵌套语句。\n\
    \n### 循环\n\n循环被称为一系列指令，允许程序员通过实现某些条件来执行特定任务。在 Python 编程中，可以使用指定的控制结构来执行多个语句或一组指令。\n\
    \n#### Python 中的循环类型：\n\n**While 循环**\nWhile 用于在程序中重复执行语句或迭代 ‘n’ 次。Python 中使用\
    \ `while` 循环的语法如下：\n\n```\nWhile expression:\n    statement(s)\n```\n\n示例程序：\n\
    ```python\n#!/usr/bin/python\n\nCount = 0\n\nWhile (count < 10):\n    Print('the\
    \ count is:', count)\n    Count = count + 2\n```\n\n![image_rsrc9FF.jpg](img/image_rsrc9FF.jpeg)\n\
    \n输出：\n![image_rsrc9FG.jpg](img/image_rsrc9FG.jpeg)\n\n**For 循环**\n为了迭代任何序列的项（包括字符串或列表），我们可以使用\
    \ `for` 循环。\n\n语法：\n```\nFor iterating_var in sequence:\n    statement(s)\n```\n\
    \n示例程序：\n```python\nFruits = [\"apple,\", \"banana\", \"cherry\"]\n\nFor x in\
    \ fruits:\n    Print(x)\n```\n\n为了在迭代完所有项之前停止循环，我们可以使用 `break` 语句；而 `continue`\
    \ 语句可以用于停止当前循环迭代并继续下一次迭代。\n\n## 函数与模块\n\n### 什么是函数？\n\n函数是一组可重用且组织良好的代码，用于执行程序中的特定任务和操作。尽管\
    \ Python 编程语言中提供了许多内置函数，但开发者也可以创建自己的函数，这些称为用户定义函数。Python 中定义函数的语法描述如下：\n\n```\n\
    def functionname(parameters):\n    \"function_docstring\"\n    Function_suite\n\
    \    return [expression]\n```\n\n为了引入函数定义，我们可以使用关键字 `def`，它是函数体的延续。赋值给函数的变量通常存储在本地表中，这意味着除非声明为全局变量，否则全局变量无法被赋值任何值。\n\
    \n字体 调用函数\n\n编程语言中的函数可以通过提供参数、提供可选参数或提供强制参数来调用。函数最大化了重用性并使程序更容易理解。以下是用于定义和使用的语句：\n\
    \n- `def display(age): print('hi' + age)`\n- `def x(): return 'hi'`\n- `for i\
    \ in range(k): yield i`\n- `def sum(a, b): return a+b`\n- `def out(): a = 'old'`\n\
    - `def inner(): nonlocal a`\n\n## 模块\n\n模块化编程是将不同部分组织成模块的方法。Python 有大量的标准模块集，为任务提供支持。\n\
    \nPython 中的导入语法：\n```\nImport module1, [module2 [name]]\n```\n\n使用 `import` 模块，我们可以调用：\n\
    ```\nImport module\n```\n\n作为新模块导入，我们使用：\n```\nImport newmodule as name\n```\n\
    \n从模块导入的语法是：\n```\nFrom module import name\n    print(\"hi\", country)\n```\n\n\
    ## 面向对象的 Python\n\n在面向对象编程中，我们需要定义类和对象来执行各种功能。像 C++ 等其他主要语言一样，可以使用面向对象的技术创建、访问和更新类。\n\
    \n在 Python 中创建学生类，代码如下：\n\n```python\nClass student:\n    def __init__(id, name,\
    \ class):\n        self.r = roll\n        self.n = name\n        print(self.n)\n\
    \n# ...\n\nStud1 = student(1, \"james\")\nStud2 = student(2, \"william\")\n\n\
    Print(\"data successfully stored in variables\")\n```\n\n## 继承\n\n继承是面向对象编程的一个有用特性，允许开发者创建一个新类来继承现有类的所有方法和属性。我们可以通过继承技术定义一个具有父类属性的新型子类或派生类。\n\
    \n"
- fmt: "\nThe following program shows `vehicle` as a parent class along with a derived\
    \ class which will inherit features of parent class `vehicle`, and invoke its\
    \ functions as well.\n\n### Class vehicle: #parent class\n\"parent class\"\n\n\
    ```python\nclass vehicle:\n    def __init__(self, price):\n        self.price\
    \ = price\n\n    def display(self):\n        print('price = ', self.price)\n```\n\
    \n### Class category(vehicle): #derived class\n\"child/derived class\"\n\n```python\n\
    class category(vehicle):\n    def __init__(self, price, name):\n        vehicle.__init__(self,\
    \ price)\n        self.name = name\n\n    def disp_name(self):\n        print('vehicle\
    \ = ', self.name)\n\nObj = category(2000, 'merchandise')\nObj.disp_name()\nObj.display()\n\
    ```\n\n**Output:**\n```\nvehicle = merchandise\nPrice = 2000\n```\n\nTo override\
    \ any method in the base class, we can define a new method along with the same\
    \ name and parameters in the derived class. the syntax is as follows:\n\n### Class\
    \ a: #parent class\n\"parent class\"\n\n```python\nclass a:\n    def display(self):\n\
    \        print('this is base class.')\n```\n\n### Class b(a): #derived class\n\
    \"child/derived class\"\n\n```python\nclass b(a):\n    def display(self):\n  \
    \      print('this is derived class.')\n\nObj = b()\nObj.display()\n```\n\n##\
    \ Regular Expressions\n\nIn python programming, regular expressions are used to\
    \ extract information from text including documents, log files, spreadsheets,\
    \ or code. regular expressions are known as characters in special order that allow\
    \ programmers to find relevant sequence, or characters or set of strings by using\
    \ a specialized syntax. whenever regular expressions are written in python programming\
    \ language, we are supposed to begin raw strings with prefix ‘r’ and other special\
    \ meta characters as well.\n\n### Match function\nThe `match()` function is used\
    \ to check whether the given regular expression matches a string in python or\
    \ not. in case, the pattern does not match, we can use the `re.match()` function.\n\
    \n### Search function\nThis function attempts to search for all of the possible\
    \ starting points within the string and scans through the input string to match\
    \ any location. it includes the `search()` or `re.search()` functions.\n\n###\
    \ Split function\nThe `split` function can be applied directly on a string where\
    \ the `re.split()` accepts a pattern which specifies the delimiter.\n\n## File\
    \ I/o\n\nFile is a specific location on a disk which is used to store information\
    \ and data. as it is stored in a hard disk, we can also perform read and write\
    \ operations by implementing python programming methods and techniques. file operation\
    \ in python consists of three major aspects which are open a file, read or write,\
    \ and close the file.\n\n`open()` is the built-in function in python programming\
    \ language, which has two parameters known as `filename`, and `mode`. the following\
    \ methods can be implemented to perform different operations in a file:\n\n* \
    \  “r” = `open` or read a file.\n*   “w” = write into a file, and create a new\
    \ file, if it does not exist.\n*   “a” = open the file for appending and create\
    \ a new file, if it does not exist.\n*   “x” = create a new file, and return an\
    \ error if file is already present.\n*   “t” = `open` in text mode.\n*   “b” =\
    \ `open` in binary mode.\n*   “+” = `open` file for reading or writing.\n\nSyntax\
    \ for implementing the methods:\n```python\nf = open(\"sample.txt\")\nf = open(\"\
    img.jpg\", \"r\")\n```\nTo close a file, we can use the `f.close()` function.\n\
    \n### Reading files in python\nReading a specific file through python language\
    \ is simple for we can implement the `read(size,)` method. for example:\n```python\n\
    >>> f = open(\"sample.txt\",'r')\n>>> f.read(4) # read first 4 data\n>>> f.read(4)\
    \ # read next 4 data\n>>> f.read() # read till end of file\n'My first file,this\
    \ file,contains four lines'\n>>> f.close()\n```\n\n### Opening a file on write\n\
    To open the file using the built-in `open()` function, we can use the following\
    \ syntax:\n```python\nf = open(\"sample.txt\", \"r\")\nprint(f.read())\n```\n\
    For reading a specific line, we can implement the `readline()` function:\n```python\n\
    f = open(\"sample.txt\", \"r\")\nprint(f.readline())\n```\n\n### Writing into\
    \ an existing file\nThe following python syntax will open the sample file and\
    \ append content as well:\n```python\nf = open(\"sample.txt\", \"a\")\nf.write(\"\
    update content\")\nf.close()\n```\nAfter the appending:\n```python\nf = open(\"\
    sample.txt\", \"r\")\nprint(f.read())\n```\n\n### Creating a file\nTo create a\
    \ new file, `open()` method will be used which can create, append or write parameters.\
    \ the syntax for creating a file in python is defined as follows:\n```python\n\
    f = open(\"newfile.txt\", \"w\")\n```\n\n### Deleting a file\nTo delete an existing\
    \ file, `os.remove()` function should be used with the following syntax:\n```python\n\
    import os\nos.remove(\"sample.txt\")\n```\nSyntax to check whether a file exists\
    \ or not. if yes, delete it:\n```python\nimport os\nif os.path.exists(\"sample.txt\"\
    ):\n    os.remove(\"sample.txt\")\nelse:\n    print(\"the file does not exist\"\
    )\n```\n\n## Advanced Python\n\n### Exception Handling\nThere are three main methods\
    \ of exception handling in python programming language., `try`, `except`, and\
    \ `finally` blocks are used to handle errors that occur during program execution.\n\
    \n#### Try\nTo generate an exception through try` block, the following syntax\
    \ can be implemented:\n```python\ntry:\n    print(x)\nexcept:\n    print(\"an\
    \ exception occurred\")\n```\nIf no errors are raised, the sample code is as follows:\n\
    ```python\ntry:\n    print(\"python\")\nexcept:\n    print(\"an exception occurred\"\
    )\nelse:\n    print(\"no exception occurred\")\n```\n\n#### Finally\nIn exception\
    \ handling, the `finally` block will be executed even if the `try` block has raised\
    \ an exception or not. for example:\n```python\ntry:\n    print(\"python\")\n\
    except:\n    print(\"an exception occurred\")\nfinally:\n    print(\"try exception\
    \ finished\")\n```\n\n#### User-defined exceptions\nAlthough there are several\
    \ built-in exceptions in python programming language, that can be used to force\
    \ the program to show an error when something is wrong, developers can also create\
    \ custom exceptions to fulfill their requirements. to create a new exception,\
    \ a new class must be created from `exception` class.\n\nUser-defined exceptions\
    \ can be implemented in the same way as a normal class because most of the built-in\
    \ exceptions are derived from `exception` class.\n"
