    终端用户数据库是一个共享数据库，专门为终端用户设计和创建。由于它具有整个数据库的摘要特征，终端用户完全不需要担心在任何数据库级别上正在执行的操作。


    # 数据库语法、数据类型和操作符


    标准查询语言（`sql`）用于在数据库中存储、处理和检索数据。`sql` 允许数据库管理员执行管理数据库所需的多种操作。该语言允许你通过编写简单的查询来执行查询、检索数据、插入记录、更新记录、删除记录、创建新数据库、创建新表以及在数据库中设置权限。


    `sql` 有不同的版本，它们都支持如 `select`、`delete`、`insert`、`where` 和 `update` 等主要功能。


    # 结构化查询语言 (sql)


    `sql` 用于 `mysql`、`sybase`、`oracle` 和 `sql server` 等关系数据库系统的语言。作为标准的数据库语言，`sql`
    允许用户描述数据、访问数据并操作关系数据库管理系统。此外，用户还可以通过结构化查询语言创建、查看和删除数据库。


    此过程中包含的不同组件包括优化引擎、`sql` 查询引擎、经典查询引擎和查询调度器。为了在关系数据库管理系统中执行特定操作，我们可以使用下的命令：


    | 命令 | 描述 |

    | :--- | :--- |

    | `Create` | 用户可以创建新表，或数据库中的一个对象。 |

    | `Read` | 用户可以读取存储在表中的数据。 |

    | `Update` | 更新表以修改记录。 |

    | `Delete` | 删除表中的任何记录。 |

    | `Insert` | 向表中插入一条新记录。 |

    | `Select` | 从数据库中的表中选择特定记录。 |

    | `Alter` | 在数据库对象内进行更改。 |

    | `Drop` | 从数据库中删除整个表。 |


    通过使用上述操作，我们可以对下方名为‘students’的示例表执行不同的操作：


    | 学生 ID | 学生姓名 | 市 | 学科 | 分数 | 百分比 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | William | New york | Mathematics | 85 | 60% |

    | 2 | James | California | English | 79 | 58% |


    从上述表中获取记录的 `sql` 语句具有以下语法：


    ```

    select * from students;

    ```


    ## 1. sql 查询


    为了对数据库中的表执行特定操作，我们需要使用如下所示的各种查询：


    | 查询 | 语法 |

    | :--- | :--- |

    | `Insert into` | `insert into table_name(column1, column2,...)` <br> `(value_1,
    value_2,...)` |

    | `Update` | `update table_name set column1 = value_1, column2 = value_2.. where
    condition` |

    | `Delete` | `delete from table_name where condition;` |

    | `Order by` | `select column1, ..from table_name, order by column1, asc/desc;`
    |

    | `Min()` | `select min(column_name,) from table_name, where condition;` |

    | `Max()` | `select max(column_name,) from table_name, where condition;` |

    | `Where` | `select column1.. from table_name, where condition;` |


    # Sql 链接 (joins)


    以带有表 a 和表 b 的关系数据库为例，表也可以通过 `sql` 连接查询进行连接。图清晰地显示了两个表是如何连接在一起以共享数据的：我们将在示例表‘patients’上实现连接子句操作：


    **表 1：**

    | patientid | case | date |

    | :--- | :--- | :--- |

    | 4321 | 9-2011 | |

    | 8235 | 3-12-15 | |


    **表 2：**

    | case | patientname | City |

    | :--- | :--- | :--- |

    | 1 | Andre | Chicago |

    | 3 | John | La |


    要连接这两个表，我们可以按照如下方式编写 `sql` 连接语句：


    ```

    select patientid, case, date from patients join patients on case = patientname;

    ```


    有四种不同的 `sql` 连接查询类型，被称为：


    * **内连接 (Inner join)**：内连接从表 a 和表 b 中选择满足连接条件的的整条记录。

    ```

    select column_name from table1 inner join table2 on table1.column_name = table2.column_name;

    ```

    * **左连接 (Left join)**：左连接从表 a 选择所有记录并结合满足连接条件的表 b 的记录。

    ```

    select column_name from table1 left join table2 on table1.column_name = table2.column_name;

    ```

    * **右连接 (Right join)**：右连接从表 b 选择所有记录并结合满足连接条件的表 a 的记录。

    ```

    select column_name from table1 right join table2 on table1.column_name = table2.column_name;

    ```

    * **全外连接 (Full outer join)**：全外连接即使在不满足连接，也会选择表 a 和表 b 的所有记录。

    ```

    select column_name from table1 full outer join table2 on table1.column_name =
    table2.column_name where condition;

    ```


    # 合并操作符 (Union operator)


    为了合并两个或多个 select 语句的结果，使用了 `union` 操作符，每个列必须具有相同的数据类型。此外，select 语句中的列顺序应该是相同的。在
    `sql` 中实现 `union` 操作符的语法如下：


    ```

    select column_name from table1 union select column_name from table2;

    ```


    # 分组 (Group by)


    `sql` `group by` 语句用于对数据库表执行列表或编号。在 `sql` 中使用 `group by` 语句的语法如下：


    ```

    select column_name from table_name, where condition group by column_name, order
    by column_name;

    ```


    # 排序 (Order by)


    `sql` 中的 `order by` 语句用于升序或降序排序数据。实现 order by 子句的语法如下：


    ```

    select column_list from table_name, where condition [order by column1, column2,]
    [asc | desc];

    ```


    # 高级 sql


    还有其他一些关键操作和子句可以执行复杂的操作。以下是高级 `sql` 功能的详细介绍：


    ## 索引 (Indexes)


    `sql` 索引被数据库搜索引擎用于优化数据处理过程。由于它们被视为特殊的查找表，索引有助于加速 where 子句和 select 查询。为了创建索引，可以使用
    `create index` 语句结合唯一约束来防止重复条目。


    使用 `create index` 的语法：

    ```

    create index index_name on table_name;

    ```


    使用 `drop index` 的语法：

    ```

    drop index index_name;

    ```


    ## 清空表 (Truncate table)


    `sql` 中的 `truncate table` 命令被用于删除现有表中的完整数据。


    基础语法：


    ```

    truncate table table_name;

    ```


