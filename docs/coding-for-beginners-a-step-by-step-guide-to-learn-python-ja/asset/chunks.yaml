    `border- property` can be, use,d to se,t a unique, style, color, and width of
    an element’s `border` in an html document. different styles for creating borders
    with css include `dotted`, `solid`, `dashed`, `groove`, `double`, `insert`, `outline`,
    `hidden`, `ridge`, and `none`.


    Syntax for creating different border styles:


    ```css

    P.dotted {border-style,: dotted;}

    P.solid {border-style,: solid;}

    P.dashed {border-style,: dashed;}

    P.groove, {border-style,: groove;}

    P.double, {border-style,: double;}

    P.insert {border-style,: insert;}

    P.outline {border-style,: outset;}

    P.hidden {border-style,: hidden;}

    P.ridge, {border-style,: ridge;}

    P.none, {border-style,: none;}

    ```


    ### Height and width


    In css, `height` and `width` properties can be, use,d to se,t the height and width
    of an element. the syntax for imple,me,nting the height and width property in
    css is de,fine,d as follows:


    ```css

    Div {

    Height: 200px;

    Width: 50%;

    Background-color: green;

    }

    ```


    ### Margins and padding


    #### Margin


    In css, `margin` property is imple,me,nte,d to cre,ate, space around the, element.
    we, can se,t diffe,re,nt margin size,s for e,ve,ry side. `margin` property has
    diffe,re,nt value,s such as length, width, and margin, calculated by the, browser.


    Syntax:


    ```css

    Body {

    margin: size;

    }

    ```


    #### Padding


    Css paddings can be, use,d to de,fine, a border or cre,ate space around the, element.
    the,re, are, diffe,re,nt ways to se,t css padding on an html website, for individual
    side,s such as top, right, bottom, and left. `padding` has length and width value,s
    for which the, following css syntax can be, imple,me,nted:


    ```css

    Body {

    Padding: size;

    }

    ```


    ### Font and text


    #### Font


    `Font` property in css is use,d to spe,cify othe, font prope,rtie,s and to se,t
    the font of a content. different font prope,rtie,s in css include `font style`,
    `font family`, `font weight`, `font variant`, and `font size`.


    He,re, is the simple, css syntax for each font property:


    Font style,


    Live demo


    ```html

    <html>

    <head>

    </head>

    <body>

    <p style= "font-style:calibri;">

    this text will be, re,nde,d in calibri style,

    </p>

    </body>

    </html>

    ```


    Font family


    ```html

    <p style= "font-family: georgia, calibri, serif;">

    ```


    Font variant


    ```html

    <p style= "font-variant: small-caps;">

    ```


    Font weight


    ```html

    <p style= "font-weight:500;">

    ```


    Font size,


    ```html

    <p style= "font-size:20px;">

    font size, 20 pixels

    </p>

    <p style= "font-size:small;">

    small font

    </p>

    <p style= "font-size:large;">

    large, font

    </p>

    ```


    ![image_rsrc9FV.jpg](images/image_rsrc9FV.jpeg)


    #### Text


    Transforming text into different colors, style,s, and indentation is now possible,
    with css text property. the,se, text prope,rtie,s include:


    *   `Text color`: change color of the, text.

    *   `Text alignment`: specify horizontal or vertical alignment of the, text.

    *   `Text decoration`: outline, the, decoration of text.

    *   `Text transformation`: control capitalization of text.

    *   `Text indentation`: specify the indentation of first line.

    *   `Letter spacing`: increase, or de,cre,ase, space, be,tween words.

    *   `Line height`: specify line height.

    *   `Text direction`: se,t direction of writing.

    *   `Word spacing`: set space, be,tween words.

    *   `Text shadow`: adds shadow effect on text.


    Syntax for css text properties:


    ```css

    Text color:

    Body {

    color: red;

    }

    Text alignment:

    H1 {

    text-align: center;

    }

    H2 {

    text-align: left;

    }

    H3 {

    text-align: right;

    }

    Text decoration

    H1 {

    text-decoration: underline/through;

    }

    Text transformation

    P.uppercase {

    text-transform: uppercase;

    }

    P.lowercase {

    text-transform: lowercase;

    }

    P.capitalize {

    text-transform: capitalize;

    }

    Text indentation

    P {

    text-indent: 100px;

    }

    Letter spacing

    H1 {

    letter-spacing: 3px;

    }

    H2 {

    letter-spacing: -3px;

    }

    Line height

    P.small {

    line-height: 0.6;

    }

    P.big {

    line-height: 1.6;

    }

    Text direction

    P {

    direction: rtl;

    }

    Text shadow

    H1 {

    text-shadow: 4px 3px green;

    }

    Word spacing

    H1 {

    word-spacing: 10px;

    }

    H2 {

    word-spacing: -5px;

    }

    ```


    ### Links and margins


    The,re, are, diffe,re,nt css properties to imple,nt through css. the,se, properties
    include include `:link`, `:visited`, `:hover`, and `:active`. css syntax for imple,me,nting
    prope,rty is de,fine,d as follows:


    ```css

