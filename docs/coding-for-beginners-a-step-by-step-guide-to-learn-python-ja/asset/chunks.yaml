    在函数中，返回类型被称为函数本身返回的函数值的数据类型，而函数的动作名称被称为函数名。每当函数被调用时，我们都要求传递一个参数，其值被称为参数或实参参数。必须注意的是，参数并不是强制性的，函数也可以在不带任何参数的情况下执行。


    函数体包含多个语句，通常定义了在函数内部要执行的动作。为了在 C 语言中声明一个 `min()` 函数，我们可以使用如下语法：


    ```

    Int min(int num1, int num2);

    ```


    在程序中调用函数时，我们需要传递参数和函数名。如果函数返回了任何值，也可以将其存储起来。


    ## 向函数传递参数的方法


    ### 值传用（Call by value）

    值传用方法用于将实际值从参数复制到函数的形参数中。对参数所的更改对函数内的参数没有直接影响。


    ### 引用传值（Call by reference）

    引用传值方法用于将参数的地址复制到形参数中。对参数的更改会直接影响参数。


    ## 数组、字符串和链表


    ### 数组

    数组是元素的集合，可以存储固定大小的相同类型的顺序数据，由连续的内存位置组成，数组可以通过以下语法声明：


    ```

    Type arrayname, [arraysize];

    ```


    示例：

    ```

    3

    5

    6

    8

    10

    20

    ```


    所有数组的第一个元素的索引均为 0，这也被称为基索引。注意，数组的大小在声明后不能更改。在 C 语言中初始化数组，我们可以使用如下语句：


    ```

    Int data[50];

    ```


    要初始化数组，我们可以使用下面提到的语法：


    ```

    Int data[10] = {3, 2, 7, 8, 23, 42, 64, 73, 23, 77};

    ```


    在这个数组中，索引 `0` 的值为 `3`，而索引 `9` 的值值为 `77`。


    下面是一个使用 C 语言编程中的数组寻找 5 个整数平均值的示例：


    ```c

    #include <stdio.h>


    Int main ()

    {

    int avg = 0 ;

    int sum =0 ;

    int x =0 ;

    int num[ 4 ];

    for (x =0 ; x <5 ;x++ )

    {

    printf( enter number %d \n ", (x +1));

    scanf( "%d", & num[x]);

    }

    for (x =0 ; x <5 ;x++ )

    {

    sum = sum + num[x];

    }

    avg = sum /5 ;

    printf( average of entered number is: %d", avg);

    return 0 ;

    }

    ```


    ### 二维数组和三维数组

    C 编程语言也支持 2 维和 3 维的多维数组。为了初始化二维数组，我们使用以下语法：


    ```

    Int z[2][3] = {

    {0, 1,}

    {2, 3, 4}

    {5,6,9}

    };

    ```


    或者


    ```

    Int z[2][3] = {0, 1, 2, 3 , 4, 5, 6, 9};

    ```


    ### 字符串

    在 C 编程中，字符串是通过使用字符的一维数组创建的。字符串必须由空字符终止，也称为 `\0`。


    在 C 中声明字符串，我们可以遵循下面提到的语法：


    ```

    Char str_name,[size];

    ```


    `‘str_name,’` 用于定义字符串，而大小告诉我们字符串的长度。


    下面的 C 程序编写用于声明、读取和打印字符串：


    ```c

    #include<stdio.h>


    Int main ()

    {

    // 声明字符串

    char str[ 10 ];

    // 读取字符串

    scanf( "%s",str);

    // 打印字符串

    printf( "%s",str);

    return 0 ;

    }

    ```


    ## 指针和结构体

    指针是一个值的变量，其值与程序中另一个变量的地址相同。由于它具有指向内存位置的地址，我们可以提前声明指针并将其存储在任何变量地址。声明指针变量的语法如下：


    ```

    Type *var;

    ```


    要使用指针，我们首先需要定义指针变量并将变量的地址赋值给指针。接下来我们可以从指针变量给出的地址访问值。整个操作都是通过 `*` 运算符完成的，该运算符返回定义的变量地址的值。必须注意的是，普通变量存储值，而指针变量存储变量地址。空指针的值为
    0，任何指针的大小均为 2 字节。下面是一个用 C 语言指针编写的示例程序：


    ```c

    #include <stdio.h>

    Int main ()

    {

    int *ptr, q;

    q =100 ;

    ptr= &q;

    printf( "%d",*ptr);

    return 0 ;

    }

    ```


    ### 结构体

    结构体定义为变量的集合，允许程序员组合不同的数据类型。结构体可以类似于数组，但唯一的区别是数组只能持有相似类型的数据。以组织为例，我们可以使用结构体来管理员工的记录：


    *   姓名

    *   员工 ID

    *   职位

    *   区域


    在 C 语言中定义结构体的语句为：


    ```

    Struct employee {

    char name[10];

    int employee_id;

    char designation[50];

    char region[100];

    };

    ```


    在编译时初始化结构体的语句为：


    ```

    Struct employee = {34,12};

    ```


    ### 访问结构体

    为了访问结构体，我们需要使用访问运算符。要在 C 语言中访问结构体的成员，可以使用下面的运算符：


    *   成员运算符：`.`

    *   结构体指针运算符：`->`


    访问结构的示例程序：


    ```c

    #include <stdio.h>

    Struct distance {

    int feet;

    float inch;} dist1, dist2, sum;


    Int main ()

    {

    printf( 1st distance, \n );

    printf( enter feet: ");

    scanf( "%d", &dist1.feet);

    printf( enter inch: ");

    scanf( "%f", &dist1.inch);

    printf( 2nd distance, \n );

    printf( enter feet: ");

    scanf( "%d", &dist2.feet);

    printf( enter inch: ");

    scanf( "%f", &dist2.inch);

    sum.feet = dist1.feet + dist2.feet;

    sum.inch = dist1.inch + dist2.inch;

    while (sum.inch >= 12 )

    {

    ++sum.feet;

    sum.inch = sum.inch - 12;

    }

    printf( sum of distances = %d ''-%.1f ", sum.feet, sum.inch);

    return 0 ;

    }

    ```


    输出：

    ![image_rsrcF9.jpg](img/image_rsrcF9.jpeg)


    ### 结构体指针

    我们也可以 C 编程语言中定义结构体指针，这与定义指向另一个变量指针的方法相同。通过指针访问结构体的成员，可以考虑以下语法：


    ```

    Struct_pointer->title;

    ```


    ## C 编程文件

    编程要求开发者使用最有效的方法处理不同的需求和场景。为了在 C 语言中执行文件操作，我们可以使用以下操作：


    *   `fprint(f)`

    *   `fscanf()`

    *   `fread()`

    *   `fwrite()`

    *   `fseek()`


    通常，程序终止时所有数据都会丢失，因此我们需要创建一个包含所有数据的特定文件。它还节省了时间，并允许程序员通过输入几个命令从文件中访问数据，并通过 C 语言运算符将数据传输到另一台计算机。

