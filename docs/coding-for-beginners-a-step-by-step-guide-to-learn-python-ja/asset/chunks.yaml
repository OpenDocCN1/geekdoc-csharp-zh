    \ implemented in a specific section attached with the element in html document.\
    \ for example:\n\n```html\n<html>\n<head>\n<title>inline css</title>\n</head>\n\
    <body>\n<p style=\"color:blue; font-size:50px; font-style:italic; text-align:center;\"\
    >cascading style sheets</p>\n</body>\n</html>\n```\nOutput: image_src9FT.jpg\n\
    \n### Internal css\n\n`internal css` is implemented over a single html document\
    \ to give it a unique style that the rule must be implemented within the html\
    \ file in `<head>` section. Syntax for implementing internal css:\n\n```html\n\
    <head>\n<title>internal css</title>\n<style>\nselector{\nproperty:value;\n}\n\
    </style>\n</head>\n```\n\n### External css\n\n`external css` has a separate css\
    \ file includes only one style property with tag attributes. `external css` file\
    \ needs to be linked with the html document using the `link` tag. example of `external\
    \ css`:\n\n```css\nBody {\nbackground-color:green;\n}\n.main {\ntext-align:center;\n\
    }\n.gfg {\ncolor:#009900;\nfont-size:50px;\nfont-weight:bold;\n}\n```\n\n## Basic\
    \ syntax and inclusion in html\n\n`Css` is made up of several rules which are\
    \ interpreted by the browser and applied over the web page. generally, a style\
    \ rule is made up of 3 keys known as `selector`, `property`, and `value`. `selector`\
    \ is an html tag at which `css` style can be applied such as `<h1>` where `color`\
