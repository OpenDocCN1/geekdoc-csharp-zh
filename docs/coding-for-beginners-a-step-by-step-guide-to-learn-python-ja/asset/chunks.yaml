    Html 包含了各种类型的语义化元素，用于定义网页的不同部分。这些元素包括 `header`、`container`、`section`、`article`、`aside`、`details`
    和 `footer`。尽管 `css` 是设计网页布局的最佳方法，我们也可以通过这些 html 元素完成该过程。


    响应式网页设计是通过使用 `html` 和 `css` 创建的。这一过程会自动调整网站的大小和布局，使其在桌面电脑、智能手机和平和平板电脑等所有设备上看起来都很恰当。关于响应式的更多细节，学习
    `css` 和 `bootstrap` 语言将证明具有巨大的优势。


    # Html 模板


    Html 网站模板是开发网站的一种快速简单的方法。由于此模板是预构建的网站，开发者可以根据需要修改并添加功能。使用 html 模板的巨大优势是开发者不需要花费数小时设计网站，可以将精力放在实际代码上以满足网站的功能需求。此外，html
    模板最适合那些无法设计吸引人的网站的人士，因为它也可以根据给定的指令进行定制。


    # 使用 html 的实用提示


    即使在我们讨论了 `html` 的所有主要标签、属性和功能之后，还有一些其他重要方面需要关注，以使你的网站更高效高效。在使用开放的 html 标签时，在开始编写元素和属性之前，始终编写对应的闭合标签。例如，`<p>...</p>`。这将确保你的
    html 页面在所有浏览器上正常工作，并尝试通过 `css` 为你的网页设置样式。


    在完成所有网页的 html 代码编写后，在发布到互联网之前，请通过 html 验证器运行代码。此活动将提前显示任何错误或缺失的标签，以便你的网站在上线时不会缺少功能。此外，注意图像或视频的格式，因为它们在上传到互联网时有时会被破坏。在图像标签旁边指定宽度和高度可以帮助你克服这个问题。


    虽然表格是在页面上布局内容的一种简单方法，但你应该重点关注 `css` 规则，并通过 `css` 构建 html 页面内容。这不仅会让你的网站以更好的方式格式化，你还可以从
    `css` 定位中受益并增加你网站的响应能力。


    # 第九章：css


    ## 什么是 css？


    `css` 代表“层叠样式表”（casading style sheet），负责控制网页文档的样式、设计和外观。这种设计语言具有简化网页设计过程并增加网站灵活性的能力。通过
    `css`，我们可以通过在 `css` 中进行适当的调整来改变整个网站的外观、字体、设计外观和格式。


    学习 `css` 和 `html` 一样，因为两种语言都是关联的，并且具有几乎相同的语法。使用 `css`，我们可以为每个 html 元素定义特定的样式并将其应用到多个网页。此外，不需要每次都编写
    html 标签属性或元素，这使得页面加载更快。通过 `css`，我们可以为网页提供更好的外观，因为与 html 相比，它有广泛的属性，而且样式表提供了网站的不同版本，以便在桌面电脑和平板上完美显示。


    ## css 的类型


    三种主要的 css 类型是 `inline css`（内联样式）、`internal css`（内部样式）和 `external css`（外部样式）。


    ### 内联样式


    `inline css` 在 html 文档中附带元素的特定部分中实现了 `css` 属性。例如：


    ```html

    <html>

    <head>

    <title>inline css</title>

    </head>

    <body>

    <p style="color:blue; font-size:50px; font-style:italic; text-align:center;">cascading
    style sheets</p>

    </body>

    </html>

    ```

    输出：image_src9FT.jpg


    ### 内部样式


    `internal css` 在单个 html 文档上实现以提供独特的样式，该规则必须在 html 文件的 `<head>` 部分内实现。实现内部样式的语法：


    ```html

    <head>

    <title>internal css</title>

    <style>

    selector{

    property:value;

    }

    </style>

    </head>

    ```


    ### 外部样式


    `external css` 有一个单独的 css 文件，仅包含带有标签属性的样式属性。`external css` 文件需要使用 `link` 标签与 html
    文档链接。`external css` 的示例：


    ```css

    Body {

    background-color:green;

    }

    .main {

    text-align:center;

    }

    .gfg {

    color:#009900;

    font-size:50px;

    font-weight:bold;

    }

    ```


    ## 基础语法和在 html 中的引入


    `Css` 由几条规则组成，由浏览器解释并应用到网页上。通常，一条样式规则由三个键组成，称为 `selector`（选择器）、`property`（属性）和
    `value`（值）。`selector` 是可以应用 `css` 样式的 html 标签，例如 `<h1>`，其中 `color` 值被赋予属性。创建样式规则的基本语法定义如下：


    `selector {property: value}`


    通常，使用内联和 `external css` 方法将样式与 html 文档关联，其中 `<style>` 元素放在 `<head>` 和 `</head>`
    标签内部。html 文档中引入 css 的语法定义如下：


    ```html

    <html>

    <head>

    <style type="text/css" media="all">

    body {

    background-color:grey;

    }

    h1 {

    color:white;

    margin-left:40px;

    }

    </style>

    </head>

    <body>

    <h1>sample heading</h1>

    <p>sample paragraph</p>

    </body>

    </html>

    ```

    image_src9FU.jpg


    ### 导入 css 文件，


    要导入外部样式表，可以使用以下规则：


    ```html

    <head>

    @import "url";

    </head>

    ```


    # 颜色和背景


    ### 颜色


    在 `css` 中，颜色可以通过名称或值来定义。指定颜色代码时，使用的格式阐述如下：


    | 名称 | 语法 |

    | :--- | :--- |

    | 关键字 | Green, blue, 等 |

    | 十进制代码 | `#rrggbb` |

    | rgb % | `Rgb(rrr%, ggg%, bbb%)` |

    | rgb 绝对值 | `Rgb(rrr, ggg, bbb)` |

    | 短进制代码 | `#rgb` |


    例如，我们可以使用以下 `css` 语法设置文本颜色：`<h1 style="color:green;"> cascading style sheets</h1>`


    ### 背景


    不同的属性可以定义网站背景。这些属性包括颜色、图像、重复、附件和 `css` 背景的位置。


    #### 背景颜色


    要设置网页的背景颜色，可以使用以下 `css` 语法：


    ```css

    Body {

    Background-color:red;

    }

    ```


    #### 背景图像


    添加背景图像的语法：


    ```css

    Body {

    Background-image: url("image,.gif");

    }

    ```


    要重复图像：


    ```css

    Body {

    Background-image: url("gradient_image,.gif");

    }

    ```


    不重复的背景：


    ```css

    Body {

    Background-image: url("image,_bike,.jpg");

    Background-repeat: no-repeat;

    }

    ```


    #### 背景位置


    背景图像可以设置为不同的位置，如右侧、左、中间、顶部和底部。例如：


    ```css

    Body {

    Background-image: url("image,.jpg ");

    Background-position: center;

    }

    ```


