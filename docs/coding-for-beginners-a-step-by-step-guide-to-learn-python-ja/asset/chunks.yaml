  trans: "\n\n关于计算机的自然语言，它们无法理解人类语言，因此我们需要通过另一种名为`binary code`（二进制代码）的语言与系统进行通信。`binary\
    \ code`由一系列 1 和 0 组成，是计算机的自然通信语言。为了帮助计算机理解人类语言，我们使用翻译器和编辑器来编写程序。翻译器具有将源代码转换为机器语言的能力。\n\
    \n翻译器有多种类型，被称为`interpreters`（解释器）、`compilers`（编译器）和`assemblers`（汇器）。`interpreters`通常用于逐行解释处理语言，以运行最终程序。此外，`interpreter`还会列出任何语法错误或问题，以便程序员清除错误并执行程序。\n\
    \n在`compilers`的帮助下，源代码通过编译过程转换为二进制代码并执行以输出。如果源代码中没有错误或问题，`compiler`将一次性翻译并执行所有行。此外，计算机程序也被称为`apps`（应用程序或应用软件），并根据其设计运行的环境或平台进行定制。`apps`还分为桌面应用程序和移动应用程序两类。\n\
    \n# 编程基础\n\n## 计算机编程简介\n\n每个计算机程序都是完成源代码的程序、过程和算法的组合。由于这种过程组合也可以被视为软件的表示，因此该过程被视为实现输出的一系列动作，其中程序被认为是按特定顺序执行的一系列动作。算法是任何程序的主要驱动力，也被称为解决特定程序或问题的有序步骤集。\n\
    \n有不同的高级语言和低级语言可以用于编写计算机程序。如今，程序和软件通常使用流行的语言制作，包括`c`、`c++`、`java`、`python`、`html`、`php`、`ruby`和`perl`。这些语言用于产生目前用于各个领域和行业的计算机程序，包括医疗、工程、通信、家用和娱乐行业。此外，计算机程序还用于创建图形\
    \ Web 应用程序和桌面应用程序。\n\n## 编程元素与基础\n\n通常，计算机语言是几个元素的组合，允许程序员实现预期输出。这些元素包括基础语法、编程环境、数据类型、关键字、`variables`（变量）、决策、基本运算符和函数。此外，为了在程序中执行某些操作，你还需要应用其他操作并使用包括循环、字符串、字符、文件输入输出和数组在内的元素。\n\
    \n编程有五种不同的基本元素，也被认为是任何程序的构建块。这些元素被称为`input`（输入）、`output`（输出）、`arithmetic`（算术）、`conditional`（条件）和`looping`（循环）。从第一个元素开始，`input`是将命令和数据获取计算机的过程，而`output`元素具有交付结果的功能。如果有计算或操作，则使用`arithmetic`元素配合条件语句来测试条件的真假。\n\
    \n# 环境、数据类型与基础语法\n\n## 环境\n\n为了运行或执行程序，你必须为你正在使用的语言安装或设置所需的工具和环境。此外，如果初学者发现安装和配置编程环境困难，也可以使用文本编辑器创建计算机程序。为了将程序执行为二进制格式，必须使用`compiler`，因为计算机无法直接理解文本格式的程序。\n\
    \n此外，文本到二进制格式的转换是由计算机可以运行的`compiler`完成的。可以使用`c++`和`java`等编程语言。\n\n## 基本语法\n\n\
    为了方便初学者，我们将从一个用`c++`编写的示例程序开始。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    cout << \"hello world!\";\n    return 0;\n}\n```\n\
    \n该程序的输出是：\n\n```\nhello world!\n```\n\n程序以#include`和`main()`（也称为主函数）开始。最后，`return\
    \ 0;`是退出状态。如果你无法编译程序，可能存在某些语法错误，例如遗漏了一个分号。\n\n## 数据类型\n\n数据类型是各种语言的重要部分，并且在创建应用程序时使用。因为它告诉计算机如何使用提供的数据。数据类型的详细信息如下：\n\
    \n*   日期：`01/04/2015`\n*   整数：`521324`\n*   布尔：`true/false`\n*   字符串：`aabb`\n\
    *   空：无数据\n*   长型：`532543253`\n*   浮点数：`5.2341`\n*   短型：`0`\n\n## 语法\n\n如前所述，程序被定义为执行某些操作以交付特定输出的元素和属性集合。使用`c++`编程语言时，编写程序时需要遵循预定义的基本语法。\n\
    \n"
- fmt: "\n### 3. Methods\nA method is referred to as the behavior and is responsible\
    \ for the execution and manipulation of different actions within the class.\n\n\
    ### Variables, keywords, operators, and decisions\nVariables are an essential\
    \ part of a computer program as they provide computer memory locations required\
    \ to store values and data in a computer program. In order to save a value, you\
    \ will have to create variables and assign them a proper name, store values into\
    \ the variables, and retrieve the given values back from the variables.\n\nTo\
    \ get started with declaring variables, we will have to write the program as follows:\n\
    \n```cpp\n#include <iostream.h>\n\nint main() {\n  int a;\n}\n```\n\nThe above\
    \ written program creates a variable named `a` and is specified by an `int` keyword.\
    \ this means the variable can only store an `int` type value, and you are not\
    \ allowed to define `a` again to store another type of value in the variable.\n\
    \nTo store a value into the variable, just declare the number that you want to\
    \ place in `a` after the declaration of a variable in the program.\n\n#### Keywords\n\
    There are different keywords for every programming language that are used for\
    \ various purposes. Although each language provides a complete set of reserved\
    \ keywords, there is a common rule that needs to be followed while using the keywords.\
    \ Same as `float`, `int`, `long`, and `string`, other keywords that are mostly\
    \ used in every programming language are as follows:\n\n*   Else\n*   Switch\n\
    *   Goto\n*   Static\n*   Case\n*   Break\n*   Enum\n*   For\n*   If\n*   Union\n\
    *   Double\n*   Private\n\n#### Operators\nOperators are the key aspect of any\
    \ programming language and are required to perform certain operations or logical\
    \ computations. As they are generally used for mathematical calculations, we can\
    \ solve complex equations by using various expressions in the program.\n\nThere\
    \ are two kinds of operators that are generally used in programming languages:\n\
    \n1.  **Arithmetic operators**: operators that are used to conduct mathematical\
    \ and arithmetic operations. for example: `+`, `-`, `/`, `--`, `++`, `*`.\n  \
    \  *   **Binary operators**: operators that work with other operands such as `+`,\
    \ `-`, `/`, `*`.\n    *   **Unary operators**: operators that are used to work\
    \ with a single operand. for example: `++`, `--`.\n2.  **Relational operators**:\
    \ these are the most commonly used operators that tell us whether one operand\
    \ is equal to another or not. for example: `==`, `<=`, `>=`, `<`, `<`, `>`, `!=`.\n\
    \nHere is a table detailing basic operators and their functionality within the\
    \ program:\n\n| Operator | Functionality |\n| :--- | :--- |\n| `+` | Addition\
    \ of two operands |\n| `-` | Subtraction of two operands |\n| `/` | Division |\n\
    | `*` | Multiplication |\n| `==` | Check whether the two operands are equal or\
    \ not |\n| `>=` | Check if the left operand is greater than or equal in value,\
    \ as compared to the right operand |\n| `<=` | Check if the left operand is less\
    \ than or equal in value, to the right operand |\n\nLogical operators are also\
    \ an essential part of all programming languages. they are used to obtain certain\
    \ decisions in various scenarios. these operators are `and`, `or`, and `not`.\
    \ they are used to prove true or false statements as well.\n\n### Decisions\n\
    Decision making is a process in which the programmer has to select one option\
    \ based on the two or more given conditions. you will have to test whether the\
    \ condition is true or false, and present the correct output.\n\nFor different\
    \ programming languages, the decision-making statements are defined as follows:\n\
    \n*   `if` statement\n*   `else` statement\n*   `Switch`\n*   `else if` statement\n\
    *   Conditional operator\n\n### Characters, arrays, and strings\nIn programming\
    \ languages, `char` type is used to store characters and letters. they are also\
    \ responsible for storing values and delivering output when the character is called.\
    \ you are only allowed to store a single-digit number or alphabet inside the single\
    \ quotes such as `'&'`. The example code for defining characters is as follows:\n\
    \n```cpp\nchar ch1 = 'a';\n```\n\n#### Arrays\nAn array is a data structure that\
    \ has capability to store a sequential number of elements of the same type and\
    \ is generally of fixed size, as it is comprised of contiguous memory locations,\
    \ it is also known as the set of elements under the same name. if you are writing\
    \ a program to store integers in sequence, creating an array will be the best\
    \ solution. This is how an array of a fixed number of values is declared:\n\n\
    ```cpp\nint data[10];\n```\n\nThe two popular types of array are known as:\n1.\
    \  One-dimensional arrays.\n2.  Multi-dimensional arrays.\n\n##### Accessing arrays\n\
    After you are done with the declaration, you can easily access elements through\
    \ indices. arrays have 0 in the first index and if the size of an array is `n`,\
    \ you will have to use `n-1` to access the last element. To initialize the array,\
    \ you can follow the pattern as follows:\n\n```cpp\nint arr[5] = {1, 2, 3, 4,\
    \ 5};\n```\n\nArrays allow the programmers to store data into variables without\
    \ defining every variable specifically. similar to other data types, arrays are\
    \ declared using `[` and `]` brackets, and once the array has been declared you\
    \ can assign the values. there are different ways to create, assign, and declare\
    \ arrays in a program.\n\n##### Declaration\nIn order to declare arrays, you must\
    \ remember that array size must be an integer greater than 0. an array can be\
    \ declared as follows:\n\n`Type arrayname[arraysize];`\n\n##### Initialization\n\
    To initialize an array, you can use the statement mentioned below:\n\n```cpp\n\
    int arr[5] = {23, 45, 53, 64, 73};\n```\n\n#### Strings\nString is a data type\
    \ that is used in programming languages to represent an array of characters. to\
    \ declare and initialize a string, you need to follow the same structure as the\
    \ arrays. there are different techniques and ways to write strings for every programming\
    \ language, but the functionality is the same in each case. a string can also\
    \ contain spaces in a phrase, such as “i have been waiting since 5 pm.” The example\
    \ of a string is as follows:\n\n```cpp\nchar c[] = \"abcdef\";\n```\n\n### Functions\
    \ and file I/o\n#### Functions\nA function is known as a block of code which performs\
    \ a specific task within the program. there are two types of functions in programming\
    \ called standard library functions and user-defined functions. The standard library\
    \ functions are assigned the duty of handling major tasks such as I/O processing,\
    \ computations, and data handling whereas the user-defined functions are created\
    \ by the programmers to perform specific tasks. functions are more like reusable\
    \ code that can perform certain actions and provide better modularity for the\
    \ program as well.\n\nTo define a function in C programming, you need to declare\
    \ a return type, function name, parameter list, and function body. For example:\n\
    \n```cpp\n#include <iostream.h>\n\nvoid functionname()\n\nint main() {\n  functionname();\n\
    }\n```\n\n#### File I/o\nTo store and manage computer files such as images, word\
    \ documents, plain text, or excel sheets, we take support from the file input/output\
    \ operation modes. with file input, the approach is used to write any data into\
    \ the file, whereas the file output method is used to display results from a file.\
    \ generally, a file can be opened in different modes such as read-only mode, write-only\
    \ mode, or read and write mode.\n"
