  trans: "\n\nHype，超文本标记语言 (html) 是一种标准的标记语言，用于创建网站以显示颜色、字体、图形、媒体和图像。html 由不同的标签组成，这些标签可以用于描述网页的结构，并告诉浏览器在互联网上显示内容。\n\
    \n## 什么是标签？\n\n标签向网页浏览器提供关于任何网页结构、显示和内容的指令。它们通过闭合的角括号 `<>` 来定义。标签由属性和元素组成。元素是页面上的一个对象，其中属性描述该元素的性质或细节。请记住，标签是成对使用的，起始标签\
    \ `<tag>` 和结束标签 `</tag>` 是有区别的。\n\n你的第一个示例是使用以下标签创建 html 网页：\n\n```html\n<html>\n\
    <head>\n<body>\n<h1>我的第一个标题</h1>\n<p>我的第一个段落</p>\n</body>\n</html>\n```\n\n##\
    \ 标签说明\n\n在上述编写的 html 文档中，`<html>` 标签包裹了整个 html 文档，并由其他主要标签组成，包括 `<head>`、`<body>`\
    \ 和 `<p>`。`<head>` 标签代表文件的头部，其中 `<title>` 标签用于显示文档的标题。`<body>` 包含了几个用于创建网页的其它标签，如标题\
    \ `<h1>` 和段落 `<p>`。\n\nHtml 标签不区分大小写，但它们应该使用小写字母。为了定义 html 的版本，我们可以使用以下标签：\n\n\
    ```html\n<!DOCTYPE html>\n```\n\n学者可以使用 pc 上的记事本运行 html 页面，并将文件保存为 `.html` 格式。这将允许他们在浏览器中查看网页。\n\
    \n## 基础标签和属性\n\n### 基础标签\n\n每个 html 文档都应该以标题、头部和段落开始。在 `<body>` 标签之后，下一个使用的主要标签是\
    \ `<h1>` 或标题标签。根据你的内容需求，标题标签定义为 `<h1>` 到 `<h6>`。例如：\n\n标题：\n\n```html\n<html>\n\
    <body>\n<h1> 第一个标题</h1>\n<h2> 第二标题</h2>\n<h3>第三个标题</h3>\n<h4>第四个标题</h4>\n<h5>第五个标题</h5>\n\
    <h6>第六个标题</h6>\n</body>\n</html>\n```\n\n输出：\n![image_rsrc9FJ.jpg](img/image_rsrc9FJ.jpeg)\n\
    \n段落\n\n为了添加内容，我们需要在 html 文档中包含段落。例如：\n\n```html\n<html>\n<head>\n<h1> 标题</h1>\n\
    </head>\n<body>\n<p> 第一个段落 </p>\n<p> 第二个段落 </p>\n</body>\n</html>\n```\n\n输出：\n\
    标题\n第一个段落\n第二个段落\n\n为了在段落之间添加换行，我们可以使用换行标签 `<br>`。\n\n### 摘要标签 (Summary)\n\n为了给段落添加摘要，带有\
    \ summary 标签的 html 语法定义如下：\n\n```html\n<details>\n<summary>示例文本</summary>\n<p>\
    \ Web 开发教程</p>\n</details>\n```\n\n### Span\n\nSpan 标签用于为文本的特定部分着色。例如：\n\n```html\n\
    <p> Web 开发学习 <span style=\"color:red\">很有趣 </span> </p>\n```\n\n### Select\n\n\
    `select` 标签用于从下拉列表中选择一个选项。例如：\n\n```html\n<select>\n<option value=\"red\">红色</option>\n\
    <option value=\"blue\">蓝色</option>\n<option value=\"green\">绿色</option>\n<option\
    \ value=\"white\">白色</option>\n</select>\n```\n\n### Table\n\n`<table>` 标签用于创建组表头，并与\
    \ `<thead>` 和 `<tbody>` 元素配合使用。例如：\n\n```html\n<table>\n<thead>\n<tr>\n<th>课程</th>\n\
    <th>分数</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>工程学</td>\n<td>85</td>\n</tr>\n\
    <tr>\n<td>英语</td>\n<td>90</td>\n</tr>\n<tr>\n<td>总计</td>\n<td>180</td>\n</tr>\n\
    </tbody>\n</table>\n```\n（注：图像）\n\n## 格式化标签\n\nhtml 文档中的文本可以格式化为不同的样式、字体和大小。用于格式化标题、段落和表格的标签如下：\n\
    \n*   **粗体 (Bold)**：\n    任何写在 `<b>` 和 `</b>` 标签之间的文本都以粗体样式显示。例如：\n    `<p> <<b>\
    \ 开发 </b> 很有趣 </p>`\n    输出：开发很有趣\n\n*   *斜体 (Italic)*：\n    任何写在 `<i>` 和 `</i>`\
    \ 标签之间的文本都以*斜体*样式显示。例如：\n    `<p> <i> 开发很有趣 </i> </p>`\n    输出：开发很有趣\n\n*   **上标/下标\
    \ (Superscript/subscript)**：\n    为了显示上标内容，我们可以使用 `<sup>` 标签，而 `<sub>` 和 `</sub>`\
    \ 标签用于添加下标。例如：\n    `<p> 这段文本使用了 <<sup> 上标 </sup> </p>`\n    输出：后面的单词使用了（上标）\n\
    \n*   **下划线 (Underline)**：\n    写在 `<u>` 和 `</u>` 标签之间的文本带有下划线。例如：\n    `<p> <u>\
    \ 带有下划线的文本 </u> </p>`\n\n*   **插入和删除 (Insert and delete)**：\n    为了插入内容，我们可以使用\
    \ `<ins>` 标签，`<del>` 和 `</del>` 标签用于删除内容。例如：\n    `<p> <ins> 插入 </ins> <del> 删除\
    \ </del> </p>`\n\n*   **链接 (Link)**：\n    为了给文本添加链接，我们可以使用以下标签：\n    `<p> <a href=\"\
    url\"> 点击这里</a> </p>`\n\n### 幕灯标签 (Marquee)\n\n`<marquee>` 标签可以带有不同的属性使用，包括 `width`、`height`、`direction`、`behavior`、`scrollamount`、`sclday`、`loop`、`bgcolor`、`hspace`\
    \ 和 `vspace`。\n\nmarquee 标签演示：\n\n```html\n<html>\n<head>\n<title>marquee 标签</title>\n\
    </head>\n<body>\n<marquee>文本</marquee>\n</body>\n</html>\n```\n\n## 容器标签\n\n在\
    \ html 中，以下容器标签用于格式化文本：\n\n| 开启标签 | 结束标签 | 功能 |\n| --- | --- | --- |\n| `<p>`\
    \ | `</p>` | 段落 |\n| `<span>` | `</span>` | 行内 |\n| `<ol>` | `</ol>` | 有序列表（数字）\
    \ |\n| `<ul>` | `</ul>` | 无序列表（圆点） |\n| `<li>` | `</li>` | 列表项 |\n\n"
- fmt: "\nIn hype, rte, xt markup language, frames are added to create multiple sections\
    \ in the browser window so that each section can be loaded with a unique html\
    \ document. To use frames in a web page, `<frameset>` tag should be used instead\
    \ of `<body>` tag which can the then be defined with specific `rows` and `cols`\
    \ attributes.\n\n### Sample html tags for creating frames:\n\n```html\n<html>\n\
    <head>\n  <title>html frames</title>\n</head>\n<frameset rows=\"10%,80%,10%\"\
    >\n  <frame name=\"top\" src=\"/html/top_frame.htm\" />\n  <frame name=\"main\"\
    \ src=\"/html/main_frame.htm\" />\n  <frame name=\"bottom\" src=\"/html/bottom_frame.htm\"\
    \ />\n  <noframes>\n    <body>your browser does not support frames.</body>\n \
    \ </noframes>\n</frameset>\n</html>\n```\n\n### Iframe\nTo create a nested browsing\
    \ context, the `<iframe>` tag can be used to add a new html document into an existing\
    \ one. To create an iframe, the following syntax can be implemented along with\
    \ the `<iframe>` tag:\n\n```html\n<iframe src=https://www.website.com></iframe>\n\
    ```\n\n### Complete table of basic html tags:\n`<a>`, `<abbr>`, `<acronym>`, `<address>`,\
    \ `<app>`, `<area>`, `<article>`, `<aside>`, `<audio>`, `<b>`, `<base>`, `<basefont>`,\
    \ `<bdi>`, `<bdo>`, `<big>`, `<blockquote>`, `<body>`, `<br>`, `<button>`, `<canvas>`,\
    \ `<caption>`, `<center>`, `<cite>`, `<code>`, `<col>`, `<colgroup>`, `<data>`,\
    \ `<datalist>`, `<dd>`, `<del>`, `<details>`, `<dfn>`, `<dialog>`, `<dir>`, `<div>`,\
    \ `<dl>`, `<dt>`, `<em>`, `<embed>`, `<fieldset>`, `<figcaption>`, `<figure>`,\
    \ `<font>`, `<footer>`, `<form>`, `<frame>`, `<frameset>`, `<h1>`-`<h6>`, `<head>`,\
    \ `<header>`, `<hr>`, `<html>`, `<i>`, `<iframe>`, `<img>`, `<input>`, `<ins>`,\
    \ `<kbd>`, `<label>`, `<legend>`, `<li>`, `<link>`, `<main>`, `<map>`, `<mark>`,\
    \ `<meta>`, `<meter>`, `<nav>`, `<noframes>`, `<noscript>`, `<object>`, `<ol>`,\
    \ `<optgroup>`, `<option>`, `<output>`, `<p>`, `<param>`, `<picture>`, `<pre>`,\
    \ `<progress>`, `<q>`, `<rp>`, `<rt>`, `<ruby>`, `<s>`, `<samp>`, `<script>`,\
    \ `<section>`, `<select>`, `<small>`, `<source>`, `<span>`, `<strong>`, `<style>`,\
    \ `<sub>`, `<summary>`, `<sup>`, `<svg>`, `<table>`, `<tbody>`, `<td>`, `<template>`,\
    \ `<textarea>`, `<tfoot>`, `<th>`, `<thead>`, `<time>`, `<title>`, `<tr>`, `<track>`,\
    \ `<tt>`, `<u>`, `<ul>`, `<var>`, `<video>`, `<wbr>`.\n\n### Forms\nHtml forms\
    \ are one of the key aspects of interaction between a website and a user. A form\
    \ is created by using widgets such as text fields, buttons, select boxes, radio\
    \ buttons, file select boxes, hidden controls, and clickable controls. Data collected\
    \ through forms is sent to the web server and the web page can also intercept\
    \ the data on its own. Most of the time, widgets are linked with a label in order\
    \ to describe their purpose.\n\nSyntax for creating a form in html:\n```html\n\
    <form action=\"script url\" method=\"get|post\">\n  <!-- Form elements like input,\
    \ buttons etc. -->\n</form>\n```\n\nInput form to take name, and age from user:\n\
    ```html\n<html>\n<head>\n  <title>my first html form</title>\n</head>\n<body>\n\
    \  <form>\n    name: <input type=\"text\" name=\"name,\" />\n    <br>\n    age:\
    \ <input type=\"text\" name=\"last name,\" />\n  </form>\n</body>\n</html>\n```\n\
    Output:\n![image_rsrc9FM.jpg](images/image_rsrc9FM.jpeg)\n\n### Text fields\n\
    Text fields in html allow users to input text into the form. The general syntax\
    \ for creating text fields is defined as follows:\n```html\n<input type=\"text\"\
    \ type=\"text\" value=\"text\">\n```\n\n### Button controls\nThere are different\
    \ ways to submit data into forms. We can add clickable buttons by using the following\
    \ html tags:\n```html\n<input type=\"submit\" name=\"submit\" value=\"submit\"\
    \ />\n<input type=\"reset\" name=\"reset\" value=\"reset\" />\n<input type=\"\
    button\" name=\"button\" value=\"button\" />\n```\nOutput:\n![image_rsrc9FN.jpg](images/image_rsrc9FN.jpeg)\n\
    \n### Select box\nTo create a dropdown list in html forms, we can use `<select>`\
    \ and `<option>` element.\n```html\n<html>\n<head>\n  <title>file upload</title>\n\
    </head>\n<body>\n  <form>\n    <label for=\"course\">course:</label>\n    <select\
    \ name=\"course\" id=\"course\">\n      <option value=\"webengine\">webengine</option>\n\
    \      <option value=\"calculus\">calculus</option>\n      <option value=\"science\"\
    >science</option>\n    </select>\n  </form>\n</body>\n</html>\n```\nOutput:\n\
    ![image_rsrc9FP.jpg](images/image_rsrc9FP.jpeg)\n\n### Select box\nThe select\
    \ element gives an option to list multiple options in html.\n```html\n<html>\n\
    <head>\n  <title>select course,</title>\n</head>\n<body>\n  <form>\n    <select\
    \ name=\"dropdown\">\n      <option value=\"math\">math</option>\n      <option\
    \ value=\"physics\">physics</option>\n    </select>\n  </form>\n</body>\n</html>\n\
    ```\nOutput:\n![image_rsrc9FR.jpg](images/image_rsrc9FR.jpeg)\n\n### Form element\n\
    Once the html form has complete, the two attributes `action` and `method` are\
    \ required to store and send data. `action` contains the address where the data\
    \ will be sent, while `method` defines how to handle form information. The syntax\
    \ for creating form element is defined as follows:\n```html\n<form action=\"/login\"\
    \ method=\"post\">\n```\n\n### Designing\nIn html, the default background color\
    \ for any webpage is white. To change the background color, the following tags\
    \ and attributes can be used:\n```html\n<table bgcolor=\"#f1f1f1\">\n```\n\n###\
    \ Fonts\nFonts are an essential part of any website and enhance the readability\
    \ of your content. The `<font>` tag can be used to give a specific style, size,\
    \ and color to the text and its attributes include `size`, `color`, and `face`.\n\
    To set the font size, the tags and attributes are:\n```html\n<font size=\"14\"\
    >text</font>\n```\nFont tags and attributes:\n```html\n<font face=\"new roman\"\
    \ size=\"14\">text</font>\n```\n\n### Font color\nTo change the font color, the\
    \ following html tags and attributes can be used:\n```html\n<html>\n<head>\n \
    \ <title>setting font color</title>\n</head>\n<body>\n  <font color=\"blue\">text\
    \ is blue,</font>\n</body>\n</html>\n```\nOutput: text is blue\n\n### Marked text\n\
    The text written between `<mark>` and `</mark>` elements is displayed as marked\
    \ with yellow.\n```html\n<p> text is marked as <mark>yellow</mark> </p>\n```\n\
    Output: text is marked as yellow\n\n### Meta tags\nIn html, meta tags can be used\
    \ to add metadata into your web pages. The attributes of meta tags include `name`,\
    \ `content`, `scheme`, and `http-equiv`. We can use `<meta>` tag to give a short\
    \ description about the document which can also improve search engine indexing\
    \ for your web page.\n```html\n<html>\n<head>\n  <title>meta tags example,</title>\n\
    \  <meta name=\"keywords\" content=\"html meta tags, metadata\" />\n  <meta name=\"\
    description\" content=\"meta tags.\" />\n  <meta name=\"revised\" content=\"3/7/2019\"\
    \ />\n  <meta http-equiv=\"cookie\" content=\"userid=abc; expires=monday, 08-Sep-19\
    \ 23:59:59 GMT;\" />\n</head>\n<body>\n  <p>welcome to html</p>\n</body>\n</html>\n\
    ```\n\n### Comments\nTo place comments in html code, the following syntax can\
    \ be followed:\n```html\n<html>\n<head> <!-- document header starts -->\n  <title>document\
    \ title,</title>\n</head> <!-- document header ends -->\n<body>\n  <p>document\
    \ content goes here.....</p>\n</body>\n</html>\n```\n\n### Html style sheets\n\
    For further design of html documents, cascading style sheets (css) are implemented\
    \ over the website. They provide easy, effective, and manageable alternatives\
    \ to specify certain attributes for a website. We will be discussing css in full\
    \ detail in the next chapter.\n"
