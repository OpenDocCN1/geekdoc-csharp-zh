    :visited {color: #006600}

    :hover {color: #ffcc00}

    :active {color: #ff00cc}

    ```


    #### Tables


    He,re, are, diffe,re,nt css properties that can be, use,d to transform and de,sign
    a html,.


    *   `border collapse`

    *   `border spacing`

    *   Caption side

    *   Empty cells

    *   Table layout


    Syntax for creating simple, table using css:


    ```html

    <html>

    <body>

    <table class="table" border="1">

    <tr>

    <th>first name</th>

    <th>last name</th>

    <th>marks</th>

    </tr>

    <tr>

    <td>john</td>

