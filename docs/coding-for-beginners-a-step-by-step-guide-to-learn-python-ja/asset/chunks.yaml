  trans: "\n\n文件分为两类：文本文件和二进制文件。文本文件是 `.txt` 文件，可以使用记事本创建，并且在写入、维护和更新记录时所需的精力最少。二进制文件是\
    \ `.bin` 文件，它们以 0 和 1 的二进制形式存储数据。此外，与文本文件相比，二进制文件可以存储更多的数据。\n\n在 C 编程语言中，我们可以通过下表提到的简单命令创建新文件、打开现有文件、从文件中读取和写入信息，以及关闭文件：\n\
    \n| 操作 | 语法 |\n| :--- | :--- |\n| 打开文件 | `Ptr = fopen(\"file_open\", \"mode\"\
    )` |\n| 关闭文件 | `fclose(fptr);` |\n| 写入二进制文件 | `fwrite(address_data, size_data,\
    \ numbers_data, pointer_to_file);` |\n| 从二进制文件读取 | `fread(address_data, size_data,\
    \ numbers_data, pointer_to_file);` |\n| 写入文本文件 | `File *fptr; Fptr = fopen(\"\
    file_address\", \"w\");` |\n| 从文本文件中读取 | `File *fptr; Fptr = fopen(\"file_address\"\
    , \"r\");` |\n| 文件定位 | `fseek(file, *stream, long int offset, int whence);` |\n\
    \n### 让 C 编程变得简单的实要技巧\n\n对于初学者，建议始终通过在 `/*` 和 `*/` 之间编写关键代码信息来对代码进行注释。对代码的大部分进行注释也可以便于日后的更改并改进程序的功能。此外，始终使用变量来存储数据（如\
    \ `int`、`char` 和 `float`），因为这会让你更简单地执行不同的操作和计算。\n\nC 语言简单且快速。凭借指针、关键字和位运算符的使用，对于初学者来说，编写高效的代码无疑不是一个问题。\n\
    \n## 第五章：C++\n\nC++ 是一种由 Bjarne Stroustrup 在 1979 年开发的自由形式且中间级编程语言。作为 C 编程语言的增强版本，C++\
    \ 现在已成为最常用且最适合初者的语言。该语言提供了约 7 种不同的编程风格，你可以根据自己的需求选择最合适的风格。作为一种静态类型编程语言，C++ 允许编译器在执行程序之前列出错误或\
    \ Bug。此外，使用 C++ 进行面向对象的编程使得解决复杂问题变得方便，并扩展了标准库的使用。\n\nC++ 是世界上最流行的编程语言，广泛应用于图形用户界面、操作系统和嵌入式系统。\n\
    \n### 基础语法\n\nC++ 编程语言的基础语法与 C 等其他语言相同。包括各种单词、符号、字符、操作和表达式，程序员必须遵循一组预定义的规则来正确执行程序。\n\
    \n这里是我们可以开始学习 C++ 时编写的第一个程序：\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    int main()\n{\ncout << \"my first program in c++\";\nreturn 0;\n}\n```\n\n程序输出：my\
    \ first program in c++. \n\n![image_rsrc9FB.jpg](img/image_rsrc9FB.jpeg)\n\n![image_rsrc9FC.jpg](img/image_rsrc9FC.jpeg)\n\
    \n程序的详情如下：\n\n- `#include<iostream>`：该语句包含预定义的输入和输出函数，并通知编译器包含该文件。\n- `using namespace\
    \ std;`：一种用于存储程序内函数和操作的语句，其中 `std` 被视为命名空间名。\n- `int main()`：这是程序的主函数，执行从这里开始。`int`\
    \ 是返回类型，指示编译器返回一个整数值，我们也必须在末尾加上 `0`。\n- `cout << \"my first program in c++\"`：`cout`\
    \ 是一个属于 iostream 的对象，用于显示内容。\n- `return 0;`：该语句从 `main()` 返回 0，负责主函数的执行。\n\n###\
    \ 变量和数据类型\n\n变量是 C++ 语言中不同类型的标识符，因为它们是通过特定的关键字定义的。我们必须按照给定的语法创建变量、指定类型并赋值：\n\n\
    `Type variable = value;`\n\n变量的类型\n- `int`：用于存储整数和全数。例如，`4563`。\n- `char`：用于存储单个字符。例如，'a'\
    \ 或 'z'。\n- `double`：用于存储浮点数。例如，`50.21342`。\n- `bool`：用于存储具有两种状态的值：真（true）或假（false）。\n\
    - `string`：用于存储文本。例如，\"c++ language\"。\n\n要声明变量并为变量赋值，我们可以按照下面提到的语法：\n\n```cpp\n\
    int newnum;\nnewnum = 50;\ncout << newnum;\n```\n\nC++ 中使用的每个变量都应该用唯一的名称标识，这些名称被称为标识符。为了构造标识符，必须包含字母、数字或下划线，并且区分大小写。\n\
    \n### 数据类型\n\nC++ 编程语言中的数据类型定义了可以在变量中存储的数据类型。通常，C++ 中的数据类型分为三类：内置的、派生的和用户定义的。用户定义的数据类型包括结构（struct）、联合体（union）和枚举（enum），而派生数据类型基于数组、函数和指针。\n\
    \nC++ 的内置数据类型：\n- `int`\n- `char`\n- `float`\n- `double`\n- `bool`\n\n用户定义的数据类型：\n\
    - `union`\n- `enum`\n- `struct`\n\n派生数据类型：\n- `function`\n- `array`\n- `pointer`\n\
    \n### 修饰符和存储类\n\nC++ 编程语言中的修饰符用于 `char`、`double` 和 `int` 数据类型，以改变基本类型的含义以满足某些编程条件。修饰符包括\
    \ `signed`、`unsigned`、`long` 和 `short`。\n\n为了定义 C++ 程序中变量和函数的作用域，可以使用存储类 `auto`、`register`、`extern`、`mutable`\
    \ 和 `static`。`auto` 存储类是所有局部变量的默认值，而 `static` 存储类允许编译器在程序生存期间存储局部变量，并在离开作用域时删除。`extern`\
    \ 存储类提供全局变量的引用，用于多个文件使用同一个全局函数或变量的情况。对于 `mutable` 存储类，只考虑类对象，并且也可以被常量成员函数修改。\n\
    \n### 控制流\n\n在 C++ 中，控制流是指程序运行时指令、函数和状态被评估和执行的顺序。这些状态在代码内部从上到部执行，以完全满足程序逻辑。程序并不依赖线性状态序列，C++\
    \ 提供了特定的控制流状态。\n\nC++ 控制流状态：\n1. `if else`\n2. `for` 循环\n3. `do while` 循环\n4.\
    \ `break` & `continue`\n5. `switch` 状态\n6. `goto` 状态\n\n#### If 语句\n\n在 C++ 编程中，`if`\
    \ 语句用于程序中有多个需要执行的状态或情况。`if` 语句的语法显示，只有在给定状态为真时才会执行括号内的内容；`else` 则假状态会被自动忽略。\n\n"
- fmt: "\n```cpp\nif(condition){\n  state,me,nt;\n}\n```\n\n### Flowchart of if state,me,nt:\n\
    \nSample program to illustrate, the, if state,me,nt in c++:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n  int marks = 80;\n  if (marks\
    \ < 100) {\n    cout << \"marks are less than 100\";\n  }\n  if (marks > 100)\
    \ {\n    cout << \"marks are greater than 100\";\n  }\n  return 0;\n}\n```\n\n\
    ### Nested if state,me,nt\nIn c++, a state,me,nt within a state,me,nt is known\
    \ as a nested if state,me,nt. for example,:\n\n```cpp\nif (condition_1) {\n  State,me,nt1;\n\
    \  if (condition 2) {\n    State,me,nt2;\n  }\n}\n```\n\n### If else, state,me,nt:\n\
    ```cpp\nif (condition_1) {\n  State,me,nt;\n  else (condition 2) {\n    State,me,nt;\n\
    \  }\n}\n```\n\n### Switch case\nA switch case, state,me,nt in c++ programming\
    \ is used, when the, re, are, multiple, conditions given, in the, program and\
    \ we, are, required, to perform operations based on the, provided condition. `break`\
    \ and `continue` operations are, also a vital part of the switch state,me,nt.\
    \ the syntax for switch case in c++ is as follows:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n  int num = 10;\n  switch (num + 5) {\n\
    \    case 1:\n      cout << \"case,1: value, is: \" << num << endl;\n    case\
    \ 2:\n      cout << \"case,2: value, is: \" << num << endl;\n    case 3:\n   \
    \   cout << \"case,3: value, is: \" << num << endl;\n    default:\n      cout\
    \ << \"de,fault: value, is: \" << num << endl;\n  }\n  return 0;\n}\n```\n\n###\
    \ Go to state,me,nt\nThe, go to state,me,nt in c++ is used to change, the, execution\
    \ of a program and transfer the control to another labeled state,me,nt within\
    \ the same program.\n\nSyntax for go to state,me,nt: `goto label;`\n\n## Loops\
    \ and functions\n\n#### Loops\nLoop state,me,nt in c++ programming language, are\
    \ implemented to execute, a specific block of code, for a certain number of iterations\
    \ until it satisfies the provided condition. as they allow programmers to perform\
    \ multiple tasks at a time,, a loop state,me,nt executes the first state,me,nt\
    \ in the function and moves onto the next as required.\n\n##### Types of loops\n\
    - **While loop**: repeats a state,me,nt while the, provided condition is true,\
    \ and rechecks before executing the loop body.\n- **Do while loop**: checks the\
    \ condition while the, loop is being executed.\n- **For loop**: executes a specific\
    \ state,me,nt multiple times and manages the loop variable, as well.\n- **Nested\
    \ loops**: more than one loop inside another loop.\n\nLoops can be executed through\
    \ different control state,me,nt such as `break` state,me,nt, `continue` state,me,nt,\
    \ and `goto` state,me,nt.\n\n#### Functions\nFunctions are, responsible, for combining\
    \ different segments of code, and executing them together to perform the, given\
    \ operation. two major types, of functions in c++ programming language, include,\
    \ library function and user-defined function. library functions are, predefined\
    \ in c++ where as, the, user-defined functions are, created by the, programmer\
    \ the mselves.\n\nTo define, a function, we, can use, the following syntax:\n\n\
    ```cpp\nreturn_type function_name(parameter list) {\n  function body\n}\n```\n\
    \nSample code for `min()` function:\n```cpp\nint min (int num1, int num2) {  //function\
    \ declaration\n  // local variable, declaration\n  int result;\n  if (num1 < num2)\n\
    \    result = num1;\n  else\n    result = num2;\n  return result;\n}\n```\n\n\
    ##### Function calling\nTo call a function in c++, we, can use, the following\
    \ methods:\n- Call by reference.\n- Call by value.\n- Call by pointer.\n\n#####\
    \ Function overloading\nWhen two or more, functions have, the same name, but different,\
    \ arguments, the, process is known as overloaded functions. the syntax for function\
    \ overloading in c++ is mentioned as follows:\n\n```cpp\nvoid same_function(int\
    \ a);\nint same_function(float a0);\nvoid same_function(int a, double, b);\n```\n\
    \n## Arrays, strings, pointers, and references\n\n#### Arrays\nArrays are, free,\
    \ used in programming languages, as they allow us to handle, a huge volume, of\
    \ data of the same type. generally, an array is used as a collection of data which\
    \ holds a fixed number of values.\n\nSyntax for declaring an array in c++:\n`datatype\
    \ arrayname[size];`\n\nInitialization:\n`int age[5] = {15, 20, 25, 30};`\n\nSample\
    \ program in c++ to find a sum, using arrays:\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n  int nummers[10], sum = 0;\n  for (int i =\
    \ 0; i < 10; i++) {\n    cin >> nummers[i];\n    sum += nummers[i];\n  }\n  cout\
    \ << \"sum = \" << sum;\n  return 0;\n}\n```\n\n#### Strings\nStrings are, used\
    \ as a collection of characters. in c++, the, common types are, strings and standard\
    \ library. the following syntax can be used to define, a string:\n`char str[]\
    \ = \"programming\";`\n\nA pointer is used as a value, which points to a memory\
    \ address. in c++, the following operators are used to access the memory address\
    \ of a variable:\n\n#### Classes\nA class is a blue-print for creating objects.\
    \ it is a custom type. Syntax for defining a class:\n`class name {`\n\nA class\
    \ can be defined as private, or protected so that the data could only be accessed\
    \ within the program. Sample code:\n```cpp\nclass student {\nprivate:\n  char\
    \ name[20];\n  int rollno;\n  float total;\n\npublic:\n  // function to get student's\
    \ details\n  void getdetails(void);\n  // function to print student's details\
    \ own  void putdetails(void);\n};\n```\n\n#### Inheritance and polymorphism\n\
    When writing a program to implement inheritance, we, can consider the concept\
    \ of base class and derived class. as a class can be derived from one, or more,\
    \ classes, a derived class can access all of the non-private members of its base\
    \ class along with also creating a new class from an existing class. the syntax\
    \ for inheritance in c++ is:\n\n```cpp\nclass a { // base class };\nclass b :\
    \ public a { // derived class };\n```\n\n#### Access specifiers\nIn c++, the access\
    \ specifiers are used to determine, the limits for the availability of class members\
    \ beyond that class. the major access specifiers are, private, protected and public.\n\
    \nA private access specifier is used when creating a class so that the, protected\
    \ and public data members of the, base class become, the private members of the,\
    \ derived class where as the, private member of base class remains private.\n\n\
    In the protected access specifier, the, public and protected data members of the,\
    \ base class become, the protected members of the, derived class. the, private\
    \ member of the base class still remains inaccessible.\n\nA public access specifier\
    \ is used when creating a class so that the, data members of the, base class become,\
    \ the public members of the, derived class. the private and protected members\
    \ of the base class still remain inaccessible.\n"
