  trans: "\n当基类的公共数据成员变为派生类的公共成员时，会使用访问限定符。受保护成员在派生类中变为受保护状态，而基类的私有成员保持不可访问。\n\n在\
    \ c++ 中使用访问限定符的语法如下：\n\n```cpp\nClass myclass { // class\n\nPublic : // access\
    \ specifier\n\n// class members\n};\n```\n\n### 友函数、数据结构与封装性\n\n#### 友函数\n在面向对象编程中，非成员函数无法访问对象的私有和受保护数据。为了允许访问私有或受保护数据，我们可以使用友函数或友类，这允许程序员访问类的私有和受保护数据。\n\
    \n该函数通过 `friend` 关键字声明，并应该在类体内使用。在 c++ 编程语言中声明友函数，可以使用下述语法：\n\n```cpp\nClass class_name\n\
    {\nfriend return_type function_name(argument);\n}\n```\n\n#### 数据结构\n虽然为了明确本主题的目标，需要深入介绍数据结构，但我们将讨论如何在\
    \ c++ 中定义和使用结构（structure）。结构是一种用户定义类型，可以通过以下语法在程序中实现：\n\n```cpp\nStruct [structure,\
    \ tag]\n{\nmember definition;\n}\n```\n\n例如：\n\n```cpp\nStruct vehicle {\nchar\
    \ name[50];\nchar category[100];\nint model,l_year;\n} vehicle;\n```\n\n要访问结构中的任何成员，我们可以使用成员访问运算符（`.`）。通过数据结构定义结构体指针变得简单，我们可以使用以下语法：\n\
    \n```cpp\nStruct vehicle *struct_pointer;\n```\n\n#### 封装性\n“封装”（encapsulation）一术语定义为编程中向用户隐藏敏感数据的方法。为了执行封装，我们需要将类变量和属性声明为私有（private），并通过\
    \ getter 和 setter 方法读取或修改私有成员的值。访问私有成员的语法定义如下：\n\n```cpp\n#include <iostream>\n\
    \nUsing namespace std;\n\nClass employee {\nprivate:\n    // private attribute\n\
    \    int salary;\n\npublic:\n    // setter\n    void setsalary(int s) {\n    \
    \    salary = s;\n    }\n    // getter\n    int getsalary() {\n        return\
    \ salary;\n    }\n};\n\nInt main() {\n    employee myobj;\n    myobj.setsalary(50000);\n\
    \    cout << myobj.gettsalary();\n    return 0;\n}\n```\n\n### 文件处理\n在 c++ 编程语言中，我们一直使用\
    \ `cin` 和 `cout` 方法在程序中读写数据。为了从文件中读写数据，c++ 提供了一个名为 `fstream` 的标准库，其中包含 `ifstream`、`ofstream`\
    \ 和 `fstream` 数据类型。\n\n要打开文件可以使用 `fstream` 或 `ofstream` 对象，其 c++ 语法定义如下：\n\n```cpp\n\
    Void open(const char *filename, ios::openmode mode);\n```\n\n关闭文件的语法：\n\n```cpp\n\
    Void close();\n```\n\n### C++ 语言特性与支持\nC++ 编程语言提供了丰富的库支持和标准模板库 (stl) 函数，用于快速编写代码。作为一种面向对象的编程语言，我们可以专注于对象并执行不同类型的操作和实现，而与其他与其他主要语言不同，c++\
    \ 提供了如下支持。\n\n由于其快速、可靠和安全的特性，c++ 广泛应用于操作系统、图形和数据库的开发。该语言速度快，并以其高效性著称，此外 c++ 还允许异常处理并支持函数重载。\n\
    \n### C#：概述与基础语法\n\n#### 概述\nC# 是由微软开发的一种编程语言，用于 .NET 框架。该语言基于面向对象编程，并与 c++ 等其他编程语言具有相同的基础语法。C#\
    \ 为通用基础设施 (cli) 开发，其由运行时环境和可执行代码组成。由于易学习，c# 是最好的编程语言之一，因为它们生成高效的程序并在不同的平台上编译。\n\
    \n为了运行 c# 应用程序和程序需要 .NET 框架，它可以用于编写 Windows 应用程序和服务。c# 的开发环境 (ide) 包括 Visual Studio。\n\
    \n#### 基础语法\n基于面向对象编程，c# 编程的核心在于类和对象。以学生类为例，它具有名称、ID 和年级等属性，虽然每个学生的属性是相同的，但他们每个人都有不同的名称、ID\
    \ 和年级，这些被称为对象属性。通常，一个 c# 程序由命名空间声明、类方法、主方法和语句组成。\n\n这里是一个在 c# 中打印“welcome to c#\
    \ programming”的简单程序：\n\n```csharp\nUsing system:\nnamespace csharp programming\n\
    class programming {\n    // main function\n    static void main(string[] args)\
    \ {\n        Console.WriteLine(\"welcome to c# programming\");\n        Console.ReadKey();\n\
    \    }\n}\n```\n\n基础语法的细节：\n- `Using system`：用于为程序包含系统命名空间。\n- `Namespace declaration`：程序内类的集合。\n\
    - `Class declaration`：包含程序中所使用的数据和方法的类。\n- `Static void main()`：`static` 关键字表示该方法可以在不实例化类的情况下被访问。\n\
    - `Console.WriteLine()`：用于定义系统命名空间的方法。\n- `Console.ReadKey()`：让计算机等待下一个命令并防止屏幕关闭。\n\
    \n#### 数据类型与变量\n数据类型是任何编程语言的组成部分，因为它们指定了语言支持的数据类型。由于它们在 c# 中是预定义的，数据类型分为三大类：值数据类型、引用数据类型和指针类型。\n\
    \n值数据类型变量派自 `System.ValueType` 类，包含字母和数字形式的数据。下表显示了 c# 编程语言中使用的值类型：\n\n| 数据类型\
    \ | 表示形式 | 默认值 | 范围 |\n| :--- | :--- | :--- | :--- |\n| Byte | 8 位无符号整数 | 0 |\
    \ 0 到 255 |\n| Decimal | 128 位精确小数 | 0.0 | -7.9 x e²⁸ 到 7.9 x e²⁸ |\n| Bool |\
    \ 布尔值 | False | True/false |\n| Float | 32 位单浮点类型 | 0.0m | -3.4 x e³⁸ 到 + 3.4\
    \ x e³⁸ |\n| Double | 0.0d | (+/-)5.0 x e⁻³²⁴ 到 (+/-)1.7 x e³⁸ |\n| Char | 16\
    \ 位 Unicode 字符 | ‘\\0’ | U+0000 to u+ffff |\n| Int | 32 位符号整数类型 | 0 | -2,147,483,648\
    \ to 2,147,483,647 |\n| Short | 16 位符号整数类型 | 0 | -32,768 to 32,767 |\n| Long |\
    \ 64 位符号整数类型 | 0l | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |\n\
    \n2. 引用数据类型,\n\n"
- fmt: "\nThe reference data type stores the reference to a variable instead of storing\
    \ the actual data. By using multiple variables, reference types can point to a\
    \ memory location and in case the memory location is changed by one of the variables,\
    \ the other variable will automatically change its value.\n\n### 3. object type\n\
    \nObject data type is considered as the base class for all data types that are\
    \ used in C#. Moreover, object types can also be assigned values of other types,\
    \ reference types, defined types, and value types as well.\n\n### 4. pointer data\
    \ type\n\nPointer data type contains memory address of the variable value and\
    \ has the syntax as follows:\n\n`Type* identifier;`\n\n### Operators\n\nC# makes\
    \ use of operators in the same way as the other major programming languages such\
    \ as `c` and `c++`. the set of built-in operators include arithmetic operators,\
    \ relational operators, bitwise operators, logical operators, misc operators,\
    \ and assignment operators.\n\n### Functions and methods\n\nIn `c` programming\
    \ language, a function allows the programmers to encapsulate a specific part of\
    \ the code, and utilize it from other sections of the code as well. as it stops\
    \ the need to rewrite the code, we can access a function from multiple places\
    \ and perform the required operations as well. the functions in `c` are declared\
    \ by using the following syntax:\n\n```\n<visibility> <return type> <name>(<parameters>)\n\
    {\n<function code>\n}\n```\n\nA function that is known as a member function or\
    \ a member of a class is also known as a method in `c` programming language. generally,\
    \ there are two methods in `c` called an instance method and a static method.\n\
    \nFunctions can return any type of data and there can be multiple statements executed\
    \ such as `read`, `follow`, and `run`.\n\nSample program by using functions in\
    \ `c`:\n\n```csharp\nusing system;\n\nClass return2\n{\n    static string lastfirst(string\
    \ firstname, string lastname)\n    {\n        string separator = \", \";\n   \
    \     string result = lastname + separator + firstname;\n        return result;\n\
    \    }\n    static void main()\n    {\n        console.WriteLine(lastfirst(\"\
    john\", \"william\"));\n        console.WriteLine(lastfirst(\"james\", \"lewis\"\
    ));\n    }\n}\n```\n\n### Arrays, strings, and structures\n\n#### Arrays\n\nAn\
    \ array is used to store a fixed size collection of elements with the same datatype.\
    \ having contiguous memory locations, an array can be declared in `c` programming\
    \ language by using the following syntax:\n\n`Datatype[] arrayname;`\n\nInitialization:\n\
    `Int [] age = new age[20]`\n\nSample program to declare and access arrays in `c`\
    \ programming language:\n\n```csharp\nusing system;\nnamespace arrayapplication\
    \ {\n    class myarray {\n        static void main(string[] args) {\n        \
    \    int [] n = new int[20]; /* n is an array of 20 integers */\n            int\
    \ i,j;\n            /* initialize elements of array n */\n            for (i =\
    \ 0; i < 20; i++) {\n                n[i] = i + 100;\n            }\n        \
    \    /* output each array element's value, */\n            for (j = 0; j < 10;\
    \ j++) {\n                console.WriteLine(\"element[{0}] = {1}\", j, n[j]);\n\
    \            }\n            console.ReadKey();\n        }\n    }\n}\n```\n\n####\
    \ Strings\n\nWe can create strings in `c` programming by using the keyword `system.string`.\
    \ to create a string object, we can adopt different approaches such as assigning\
    \ a string literal to a string variable, using the concatenation operator (`+`),\
    \ calling formatting method to convert a value, or by using a string constructor.\n\
    \nSyntax:\n`String []array={\"this\", \"is\", \"c#\"};`\n\n#### Classes and objects\n\
    \nClass is defined as a representation of a type of object and blueprint for a\
    \ data type. in `c` programming, the class definition starts with keyword `class`,\
    \ class name, and class body. access members in classes allow access for members\
    \ where the default access for a class is known as internal. in order to access\
    \ members we can use the `.` operator. it also links the name of an object with\
    \ the name of a member. A class is also considered a reference type and the variable\
    \ contains null value until we create an instance of the class using the `new`\
    \ operator. to declare the class in `c`, we can follow the syntax mentioned below:\n\
    \n```csharp\nPublic class student\n{// properties, methods}\n```\n\nSample:\n\
    `Myclass student = new myclass();`\n`Myclass student2 = student;`\n\n#### Creating\
    \ an object\n\nIn `c` programming, an object is entirely based on class. a class\
    \ defines a type of object. it is also known as an instance of a class and can\
    \ be created using the following syntax:\n\n`student object1 = new student();`\n\
    \nOnce the instance of a class has been created, the object reference is passed\
    \ back automatically. for example:\n`student object2 = new student();`\n`student\
    \ object3 = object2;`\n\nThe following program shows how an object is created\
    \ in `c` programming language:\n\n```csharp\nusing system;\nnamespace tutorial\
    \ {\n    Class program\n    {\n        Static void main(string[] args)\n     \
    \   {\n            users user = new users(\"harry\", 20);\n            user.userDetails();\n\
    \            console.WriteLine(\"press enter to exit..\");\n            Console.ReadLine();\n\
    \        }\n    }\n}\nPublic class users\n{\n    Public string name {get; set;\
    \ }\n    Public int age {get; set; }\n    Public users(string name, int age)\n\
    \    {\n        Name = name;\n        Age = age;\n    }\n    Public void userDetails()\n\
    \    {\n        console.WriteLine(\"name: {0}, age: {1}\", name, age);\n    }\n\
    }\n```\n\n### Inheritance and polymorphism\n\n#### Inheritance\n\nInheritance\
    \ is a major part of `c` as it is an object-oriented programming language. allowing\
    \ the programmers to reuse different classes that require the same functionality,\
    \ inheritance works in the same method to that of a parent and child. parent is\
    \ considered as the base class where as child is known as the derived class which\
    \ inherits all of the functionality from its parent class.\n\nSyntax:\n`<access-specifier>\
    \ class <base_class> {... }`\n`Class <derived_class> : <base_class> {... }`\n\n\
    For multiple-level inheritance:\n```csharp\nPublic class a\n{\n// implementation\n\
    }\nPublic class b : a\n{\n// implementation\n}\nPublic class c : b\n{\n// implementation\n\
    }\n```\n\n#### Polymorphism\n\nPolymorphism refers to the technique where multiple\
    \ functionality is performed through a single operation. static polymorphism is\
    \ performed at compile time, where as the dynamic polymorphism is decided at the\
    \ run time.\n\nIn static polymorphism, `c` allows programmers to implement the\
    \ following two approaches:\n\n**Function overloading**\n\nFunction overloading\
    \ provides multiple definitions for the same function name in the given scope.\
    \ moreover, function definition should differ from each other by types so that\
    \ you do not overload function declarations that have a different return type.\n\
    \n**Constructors**\n"
