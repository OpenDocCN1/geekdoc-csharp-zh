    - E,lif\n\n## Basic Operators\n\nPython has built-in operators such as arithmetic\
    \ operators, assignment operators, logical operators, bitwise operators, comparison\
    \ operators, and membership operators.\n\nThe details for python operators are\
    \ briefly defined in the following table:\n\n| Arithmetic Operators | Assignment\
    \ Operators | Comparison Operators | Logical Operators | Bitwise Operators |\n\
    | :--- | :--- | :--- | :--- | :--- |\n| Addition (`+`) | Equal (`=`) | Double\
    \ equal (`==`) | Logical or | Binary and (`&`) |\n| Subtraction (`-`) | Add and\
    \ (`+=`) | Not equal to (`<>`) | Logical and | Binary or (`\\|`) |\n| Multiplication\
    \ (`*`) | Subtract and (`-=`) | Greater than (`>`) | Logical not | Binary xor\
    \ (`^`) |\n| Division (`/`) | Multiply and (`*=`) | Less than (`<`) | | Binary\
    \ left shift (`<<`) |\n| Modulus (`%`) | Division and (`/=`) | Less than equal\
    \ to (`<=`) | | Binary right shift (`>>`) |\n| Floor division (`//`) | Modulus\
    \ and (`%=`) | Greater than equal to (`>=`) | | Binary 1s complement (`~`) |\n\
    | Exponent (`**`) | Floor division and (`//=`) | | | |\n\n## Data Types\n\nIn\
    \ python programming language, every object has its own type and value.\n\n###\
    \ Built-in data types for python:\n\n- **Numbers** include integers, floats, fractions,\
    \ and complex numbers as well. The predefined data types in python are `int`,\
    \ `float`, `long`, and `complex`.\n- **Sequences** are comprised of strings, bytes,\
    \ lists, and tuples.\n- **Boolean** holds either `true` or `false`.\n- **Dictionaries**\
    \ include key paired values that are set in an unordered way.\n- **Sets** cover\
    \ unordered container of values.\n\n## Flow Control\n\nFlow control statements\
    \ allow the programmers to change the flow of program and perform specific operations\
    \ as well. Same as the other high-level programming languages, the three major\
    \ control flow statements used in python are `if`, `for`, and `while`. The following\
    \ diagram shows how the control flow statements actually work in a program:\n\n\
    ### Conditional statements\n\n#### If statement\nThe `if` statement is a boolean\
    \ expression which shows the result in the form of either `true` or `false`.\n\
    \n#### If else statement\nThe `if else` statement is also a boolean expression\
    \ and it includes an optional `else` statement. If the expression shows up as\
    \ `false`, the `else` statement gets executed.\n\n#### Nested statements\nA statement\
    \ within a statement is known as nested statement.\n\n### Loops\n\nLoops are known\
    \ as a sequence of instructions that allow the programmer to perform specific\
    \ tasks by implementing certain conditions. In python programming, loops can be\
    \ used to execute several statements or a set of instructions by using the given\
    \ control structures.\n\n#### Types of loops in python:\n\n**While loop**\nWhile\
    \ loop is used to repeat a statement or iteration ‘n’ number of times within the\
    \ program. Syntax for using `while` loop in python is:\n\n```\nWhile expression:\n\
    \    statement(s)\n```\n\nSample program:\n```python\n#!/usr/bin/python\n\nCount\
    \ = 0\n\nWhile (count < 10):\n    Print('the count is:', count)\n    Count = count\
    \ + 2\n```\n\n![image_rsrc9FF.jpg](images/image_rsrc9FF.jpeg)\n\nOutput:\n![image_rsrc9FG.jpg](images/image_rsrc9FG.jpeg)\n\
    \n**For loop**\nIn order to iterate items of any sequence, including a string\
    \ or list, we can use `for` loop.\n\nSyntax:\n```\nFor iterating_var in sequence:\n\
    \    statement(s)\n```\n\nSample program:\n```python\nFruits = [\"apple,\", \"\
    banana\", \"cherry\"]\n\nFor x in fruits:\n    Print(x)\n```\n\nTo stop the loop\
    \ before it has iterated through all items, we can use the `break` statement where\
    \ the `continue` statement can be used to stop iteration of loop and continue\
    \ with the next iteration.\n\n## Functions and modules\n\n### What are functions?\n\
    \nA function is a set of reusable and organized code that is used to perform specific\
    \ tasks and operations within the program. Although there are several built-in\
    \ functions available in python programming language, but developers can also\
    \ create their own functions which are also known as user-defined functions. The\
    \ syntax for defining a function in python is described as follows:\n\n```\ndef\
    \ functionname(parameters):\n    \"function_docstring\"\n    Function_suite\n\
    \    return [expression]\n```\n\nTo introduce a function definition, we can use\
    \ the keyword `def` which is the continuation of the function body. The variables\
    \ that are assigned to a function generally store their value in local table,\
    \ which means global variables cannot be assigned any value unless it is declared\
    \ as global.\n\n### Calling functions\n\nFunctions in programming language can\
    \ be called by giving arguments, providing an optional argument or giving mandatory\
    \ arguments. Functions maximize reusability and make programs easier to understand.\
    \ Following are the statements used to define and use:\n\n- `def display(age):\
    \ print('hi' + age)`\n- `def x(): return 'hi'`\n- `for i in range(k): yield i`\n\
    - `def sum(a, b): return a+b`\n- `def out(): a = 'old'`\n- `def inner(): nonlocal\
    \ a`\n\n## Modules\n\nModular programming is the approach to organize different\
    \ sections into modules. There is a huge collection of standard modules in python\
    \ which provide support for tasks.\n\nSyntax for importing in python:\n```\nImport\
    \ module1, [module2 [name]]\n```\n\nTo use `import` module, we can call:\n```\n\
    Import module\n```\n\nTo import as new module, we use:\n```\nImport newmodule\
    \ as name\n```\n\nTo import from module, the syntax is:\n```\nFrom module import\
    \ name\n    print(\"hi\", country)\n```\n\n## Object-oriented python\n\nIn object-oriented\
    \ programming, we are required to define classes and objects to perform various\
    \ functions. Like other major languages such as C++, we can create, access and\
    \ update classes by using object-oriented techniques.\n\nTo create a student class\
    \ in python, the code is written as follows:\n\n```python\nClass student:\n  \
    \  def __init__(id, name, class):\n        self.r = roll\n        self.n = name\n\
    \        print(self.n)\n\n# ...\n\nStud1 = student(1, \"james\")\nStud2 = student(2,\
    \ \"william\")\n\nPrint(\"data successfully stored in variables\")\n```\n\n##\
    \ Inheritance\n\nInheritance is a useful feature of object-oriented programming\
    \ which allows developers to create a new class to inherit all of the methods\
    \ and properties of an existing class. We can define a new child class or derived\
    \ class with the properties of a parent class or base class by using inheritance\
    \ techniques.\n"
