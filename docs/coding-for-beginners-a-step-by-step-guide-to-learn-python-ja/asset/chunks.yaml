  trans: "\n为了创建软件文档、演示文、图表、图形或动画，有多种文档编辑工具可用。从最流行的工具开始，你可以安装 `microsoft office` 并轻松地编辑任何类型的文档。该包包含了\
    \ `microsoft word`、`microsoft excel`、`microsoft powerpoint`、`outlook`、`one note`、`one\
    \ drive` 等模块。\n\n此外，`google docs` 是另一个在线文档编辑工具，可以在线访问、更新和创建文档。该工具允许你创建表格、文档、幻灯片和表单，你可以从广泛的模板中选择。\n\
    \n# 第二章：java\n\n## 概述与基础语法\n\nJava 是一种高级编程语言，由 sun microsystems 于 1995 年发布。有无数的网站和应用程序使用\
    \ `java` 技术构建，因为与其他编程语言相比，它可靠、易用且更快。作为一种面向对象的编程语言，开发者可以更快地编写代码、编译、执行和测试程序。此外，使用\
    \ `java` 开发的应用适用于多种环境而且更加安全。\n\n该语言设计用于包括 windows、unix 和 mac os 在内的不同平台运行，并为这些平台提供了多种配置。`java`\
    \ 具有绝对的平台无关性，它被编译成特定平台的机器码，字节码通过 `java virtual machine` (`jvm`) 进行分发和解释。此外，`java\
    \ byte code` 实现了高性能，并专为分布式互联网环境设计。\n\n进入基础语法，`java` 编程通常基于对象、类、方法、变量、修饰符、构造函数和正则表达式。为了更好地理解简单的\
    \ `java` 程序，你可以参考以下对每个方面的简要细节：\n\n### 关键字\n\n| 关键字 | 功能 |\n| :--- | :--- |\n|\
    \ Class | 用于声明一个类 |\n| Void | 返回类型 |\n| Public | 访问修饰符，用于使函数可见 |\n| Static | 用于在静态方法中创建对象\
    \ |\n| `Main()` | `Main()` 方法置于程序开头 |\n| `System.out.println()` | 在控制台上打印语句 |\n\
    \n在开始 `java` 编程之前，请确保记住 `java` 是一种区分大小写的语言，你需要用大写字母声明类名。方法名应以小写字母开头，程序文件名必须与类名完全一致，以避免在执行程序时出现任何问题。\n\
    \n`java` 编程语言中的概念包括类、对象、多态、继承、抽象、封装、实例和方法传递。\n\n你的第一个 `java` 程序可能像这样：\n\n```java\n\
    class helloworld {\n    public static void main(string[] args) {\n        System.out.println(\"\
    your first java program!\")\n    }\n}\n```\n\n## Java 标识符与修饰符\n\n`java` 标识符应该以\
    \ a 到 z 或 A 到 Z 的字母开头，因为标识符同样区分大小写。你必须记住关键字永远作为标识符，标识符在第一个字符后可以是任何字符组合。例如，`month`、`price`\
    \ 或 `_place`。\n\n`java` 编程语言中有两种类型的修饰符。一种称为访问修饰符，另一种称为非修饰符。修饰符通常用于修改方法或类。\n\n\
    ## 类与对象\n\n对象是类的一部分，也被称为实例。类表示一组所有对象共有的属性，并且是创建对象的原型。要声明一个类，我们需要包含修饰符、类名、接口和类体。此外，`java`\
    \ 中的一切内容都与对象和类相关，这些类与方法和属性相结合。以手机为例，它有颜色、内存和重量等属性。在 `java` 中创建一个类，你需要遵循下述语法：\n\
    \n```java\npublic class newclass {\n    int a;\n}\n```\n\n创建一个名为 `newobj` 的对象：\n\
    \n```java\npublic class newclass {\n    int a = 1;\n    public static void main(string[]\
    \ args) {\n        newclass newobj = new newclass();\n        System.out.println(newobj.a);\n\
    \    }\n}\n```\n\n创建对象需要声明、实例化和初始化。声明是声明带有对象类型的变量名的过程，而实例化是使用 `new` 关键字创建对象。程序通过调用构造函数继续执行以初始化新对象。\n\
    \n## 数据类型与变量\n\n在 `java` 程序中，数据存储在变量中，程序将数据读取到变量并执行提供的操作。一旦过程完成，变量会被写入一次新位置。变量提供了一个用于存储值的保留内存位置，内存由操作系统分配。\n\
    \n### 数据类型\n\n`java` 编程语言中有两种不同的数据类型，称为基本数据类型和对象数据类型。基本数据类型被分为 8 类：`byte`、`short`、`int`、`long`、`float`、`double`、`boolean`\
    \ 和 `char`。对象数据类型通过类的构造函数创建并负责访问对象。每个可用引用变量的默认值都设置为 `null`，它也可以用于引用声明类型的对象。\n\n\
    ### 变量\n\n`java` 编程语言使用了三种变量：\n1. 局部变量\n2. 实例变量\n3. 类/静态变量\n\n#### 局部变量\n局部变量通常声明在构造函数和方法中。由于它们是在构造时创建的，因此修饰符不能与局部变量一起使用。局部变量没有默认值。\n\
    \n#### 实例变量\n实例变量声明在类内部，每当创建对象时就会创建一个。它们存储被多个构造函数或方法引用的值。实例变量也可以修饰符。\n\n## 运算符、控制语句与决策\n\
    \n### 运算符\n\n`java` 编程语言中提供的基本运算符说明如下：\n\n*   算术运算符：算术运算符用于在程序中进行数学计算和方程求解。这包括加、减、乘、除、模运算以及增、减函数。\n\
    *   一元运算符：后置 `expr++` 和前置 `++expr` `--expr` 表达式。\n*   逻辑运算符：`(a && b)` 为假，`(a\
    \ || b)` 为真，`!(a && b)` 为真。\n*   位运算符：用于执行位操作。\n*   赋值：`=`、`+=`、`|=`、`^=`。\n\n\
    ### 控制语句\n\n`java` 语言的控制语句与 c 或 c++ 等其他主要编程语言相似。详细条件说明如下：\n\n"
- fmt: "\nIf-else: the if statement is used to check whether the given condition is\
    \ true, or false.. there are different types of if statements in the java programming\
    \ language, which are called an if statement, if-else statement, if-else-ladder,\
    \ and nested if statement.\n\nHere is a simple java program to demonstrate the\
    \ if statement:\n\n```java\nPublic class marks {\n    public static void main\
    \ (string [] args) {\n        int marks = 50;\n        if (age < 50) {\n     \
    \       system.out.print (\"your marks are less than 50\");\n        }\n    }\n\
    }\n```\nOutput for the above program is: your marks are less than 50.\n\nIf-else:\
    \ the statement is used to test the condition and if the results are true,, the\
    \ `if` block is executed and in case of false,, the `else` statement is executed.\n\
    \nSwitch: the switch statement is used to execute a single statement from multiple\
    \ conditions. the statement can work with data types including `short`, `int`,\
    \ `long`, `byte`, `string`, and `long`. \n\nSyntax for switch statement is given\
    \ as follows:\n* `Switch (expression){`\n* `Case value,1:`\n* `//code, to be executed;`\n\
    * `Break ; //`\n* `Case value,2:`\n* `//code, to be executed;`\n* `Break ;`\n\
    * `Default :`\n* `Code to be executed if all cases are not matched;`\n* `}`\n\n\
    # Loops\nThere are three kinds of loops in programming languages that are used\
    \ in general.\n* `For` loop\n* `While` loop\n* Do-while loop\n\n### For loop\n\
    For loop is used to perform iteration in a part of the program. if the number\
    \ of iterations is fixed, you are advised to use `for` loop in your program.\n\
    \n### While loop\nWhile loop has the characteristics to repeat a single, or group\
    \ of statements to test whether the given condition is true, or not. it is used\
    \ when the number of iterations is not fixed.\n\n### Do while loop\nThe `do while`\
    \ loop is used to iterate a part of a program several times. if the number of\
    \ iterations is not fixed, you are required to execute the program at least once..\n\
    \nThere are specific loop control statements that are required to change the execution\
    \ into a normal sequence.. the two control statements used in java programming\
    \ language, include:\n* `Break` statement: terminates the switch or loop to start\
    \ the next loop.\n* `Continue` statement: allows the loop to re-test its condition\
    \ and skip the rest of the body.\n\n# Decision making\nThe decision-making structure\
    \ features one or more conditions that need to be tested under a given scenario.\
    \ if the condition is true,, the next statement can be executed whereas the program\
    \ would terminate, if the given condition is false.. the diagram below correctly\
    \ shows how the decision-making process actually works:\n\n# Characters, strings,\
    \ arrays, and regular expressions\nJava programming language makes use of character\
    \ wrapper class and offers multiple static methods for manipulating characters.\
    \ to create a character object, you need to follow the syntax as follows:\n```\n\
    Character ch = new character ('a');\n```\nThe compiler will automatically create\
    \ a character object and if you pass any primitive char into the method, the compiler\
    \ will convert the char into character by using various approaches from the language,.\n\
    \nAs we have discussed the importance and functionality of strings before,, java\
    \ platform also provides support from `string` class. programmers can manipulate\
    \ strings in multiple ways. the sample code for creating a string in the java\
    \ language, is as:\n```java\nPublic class string {\n    Public static void main\
    \ (string args []) {\n        char[] array = {'s', 't', 'r', 'i', 'n', 'g'};\n\
    \        string str = new string (array);\n        system.out.println (str);\n\
    \    }\n}\n```\nThe output for this program is: string. Moreover, we can also\
    \ concatenate strings by using a simple concatenation approach in java programming\
    \ language, as follows: `String1.concat(string2);`. To create a string object\
    \ in java,, programmers can choose it literal or keyword approach.\n\n# Arrays\n\
    Arrays are a vital part of every programming language, as allows programmers to\
    \ handle and store data into variables. as to store a large collection of data,\
    \ you can also consider an array as collection of variables of the same category..\
    \ to declare an array, you can follow the simple syntax defined below:\n```\n\
    datatype[] array;\n```\nCreating an array in java is simple, for which you can\
    \ use the following syntax:\n```\nArray = new datatype[size];\n```\nThis statement\
    \ will create an array of the given size, and assign the reference of this array\
    \ to the variable as well., usually, arrays are processed by using `for` loop\
    \ or `foreach` loop because the elements inside the array are of the same type\
    \ and size,. Static methods for sorting, comparing, and filling array elements:\
    \ own* `Public static int binarysearch(object a, object)`\n* `Public static void\
    \ fill(int[] a, int val)`\n* `Public static boolean equals(long[] a, long[] a2)`\n\
    * `Public static void sort(object a)`\n\n# Regular expressions\nRegular expressions\
    \ is an API that is used to define patterns and is also used for searching, editing,\
    \ and manipulating text. java has predefined `java.util.regex` package, that consists\
    \ of pattern class, matcher class, and syntax exception object. the pattern class\
    \ requires the developers to start with `compile()` methods and return a pattern\
    \ object as it provides no public constructors. For the matcher class, the matcher\
    \ object finds and compares the operations against an input string to obtain a\
    \ matcher object through the `matcher()` method. syntax exception indicates an\
    \ error or mistake in the regular expression pattern.\n\n# Files and i/o\nJava\
    \ programming language features a built-in package, that is responsible for data\
    \ input and output operations. the stream is known as `java.io` and supports multiple\
    \ operations and functionality to handle data.. there are two general types of\
    \ streams in java which are known as `input stream` and `output stream`. Input\
    \ stream is used to read data whereas the output stream is used for writing data\
    \ in a file.. Java language features various i/o data handling streams that include\
    \ the following:\n* `Byte` streams\n* `Character` streams\n* `Standard` streams\n\
    * `File` input stream\n* `File` output stream\n\n# Object oriented java\nObject-oriented\
    \ programming is an approach that includes the use of classes and objects. by\
    \ using multiple concepts such as inheritance, polymorphism, encapsulation and\
    \ abstraction, programmers can develop java applications and programs.\n\n###\
    \ Inheritance\nInheritance is a feature in java programming language, that allows\
    \ it to inherit the features and properties of another class. this can be done\
    \ between the subclass and superclass.. the class whose features are inherited\
    \ is called the superclass whereas the class that inherits the properties of another\
    \ class is called as the subclass.\n\nTo use inheritance in java programming language,,\
    \ you can follow the syntax as mentioned below:\n```java\nClass derived-class\
    \ extends base-class {\n    // methods\n}\n```\n\n### Polymorphism\nPolymorphism\
    \ is a concept that allows one object to be used for many forms. in java, there\
    \ are two types of polymorphism: compile-time polymorphism and runtime polymorphism.\
    \ compile-time polymorphism is achieved through method overloading and constructor\
    \ overloading. runtime polymorphism is achieved through method overriding.\n"
