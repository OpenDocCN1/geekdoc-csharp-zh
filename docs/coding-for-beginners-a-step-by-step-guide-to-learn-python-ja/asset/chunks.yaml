    >\n```\n\nGoogle icons syntax:\n```html\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/icon?Family=material+icons\"\
    >\n```\n\nExample:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\"\
    \ href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n</head>\n<body>\n  <h1>css icons</h1>\n  <i class=\"fa fa-cloud\" style=\"\
    font-size:32px;\"></i>\n  <i class=\"fa fa-heart\" style=\"font-size:32px;\"></i>\n\
    \  <i class=\"fa fa-file\" style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-car\"\
    \ style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-bars\" style=\"font-size:32px;\"\
    ></i>\n</body>\n</html>\n```\n![image_rsrc9FY.jpg](images/image_rsrc9FY.jpeg)\n\
    \n### Dropdowns\nWe can also create dropdown menus through CSS. Being the same\
    \ as HTML elements, a dropdown consists of an unordered list and nested lists.\
    \ Lists are used to create the drop-down structure. for example:\n\n```html\n\
    <html>\n<head>\n<title>dropdown css</title>\n</head>\n<body>\n  <nav>\n    <ul>\n\
    \      <li class=\"level-1\">\n        <a href=\"\">list\n        <ul>\n     \
    \     <li><a href=\"\">page 1</a></li>\n          <li><a href=\"\">page 2</a></li>\n\
    \          <li><a href=\"\">page 3</a></li>\n          <li><a href=\"\">page 4</a></li>\n\
    \        </ul>\n      </li>\n    </ul>\n  </nav>\n</body>\n</html>\n```\n\nOutput:\n\
    ![image_rsrc9FZ.jpg](images/image_rsrc9FZ.jpeg)\n\n### Layers and visibility\n\
    \n#### Layers\nThrough CSS, we can create multiple layers of various divisions\
    \ by implementing the `z-index` CSS property. for example:\n\n```html\n<html>\n\
    <head></head>\n<body>\n  <div style=\"background-color:blue; width:300px; height:100px;\
    \ position:relative; top:10px; left:80px; z-index:2\"></div>\n  <div style=\"\
    background-color:red; width:300px; height:100px; position:relative; top:-60px;\
    \ left:35px; z-index:1;\"></div>\n  <div style=\"background-color:black; width:300px;\
    \ height:100px; position:relative; top:-20px; left:120px; z-index:3;\"></div>\n\
    </body>\n</html>\n```\nOutput:\n![image_rsrc9G0.jpg](images/image_rsrc9G0.jpeg)\n\
    \n#### Visibility\nThe `visibility` property in CSS allows us to hide an element\
    \ from view and this property can also be used to hide error messages and retain\
    \ text. `visibility` has predefined values including `visible` and `hidden`. Syntax\
    \ for implementing visibility in a paragraph through CSS:\n\n```html\n<p>text\
    \ visible.</p>\n<p style=\"visibility:hidden;\">text should not be visible.</p>\n\
    ```\n\n### Layout and animations\n\n#### Layout\nThe CSS layout techniques are\
    \ a great way to take elements contained in a web page and present them in different\
    \ layouts. this technique is generally used to change the position of elements.\
    \ modules for CSS layout include `normal flow`, `display`, `grid`, `floats`, `table\
    \ layout`, andmultiple column layout`. all methods of achieving a page layout\
    \ in CSS are conducted through the `display` property.\n\n#### Animation\nCSS\
    \ animations allow an element to change style from one to another which we can\
    \ implement multiple properties. for CSS animations, we are required to specify\
    \ some keyframes. for example:\n\n```css\n@keyframes sample {\n  from {background-color:blue;}\n\
    \  to {background-color:brown;}\n}\n/* apply the animation to */\ndiv {\n  width:100px;\n\
    \  height:100px;\n  background-color:blue;\n  animation-name:sample;\n  animation-duration:4s;\n\
    }\n```\n\n#### How to effectively use CSS\nThere are several other CSS properties\
    \ and elements that can be implemented to improve the graphics and attractiveness\
    \ of a web page. although it is critical to learn and implement all properties\
    \ of CSS, using a good editor can help create a perfect website design. every\
    \ method used in CSS should be consistent so that there are no problems such as\
    \ interpretation. while writing CSS, you should also avoid using inline code and\
    \ place the styles or attributes only in external stylesheets. checking that your\
    \ code works on latest browsers such as Chrome and Safari can be a great idea\
    \ so that you can ensure proper display and formatting of web pages. CSS code\
    \ can also be used as a template for other projects and you can recycle existing\
    \ code into new ones. multiple classes can also be implemented with space separation\
    \ and we can benefit from CSS inheritance by applying specific elements.\n\n##\
    \ Chapter ten: programming essentials\n\n### Selecting the programming language\n\
    As we have thoroughly discussed all of the major programming languages and their\
    \ syntax in detail beginners can choose the language which seems easiest to learn\
    \ and implement. although most major languages such as `C`, `C++`, and `Java`\
    \ have similar syntax, there are several important aspects that need to be focused\
    \ on when writing a program. `C` and `C++` are the best options for developing\
    \ computer applications for beginners because they provide an in-depth understanding\
    \ of programming and clear concepts as well. For developing web plugins, desktop\
    \ applications, or mobile applications, `Java` language can be considered because\
    \ it provides complete support and functionality. `HTML`, `CSS`, and `PHP` are\
    \ the core languages for website development and can be easily learned by beginners.\
    \ as a programmer, one should never limit the selves to a single language and\
    \ try the latest techniques and implementations.\n\nMultiple computer programming\
    \ languages can be used to solve a specific problem. to make things easier beginners\
    \ can look at their skills and select the programming language which is most suitable\
    \ and easy to implement. programming is dependent on several other factors such\
    \ as usability of application, security, compatibility, and response time.\n\n\
    Tips for efficient programming\n"
