- fmt: "\nThere are two types of files known as text files and binary files. Text\
    \ files are `.txt` files that can be created by using notepad and require minimum\
    \ effort to write, maintain, and update the record. Binary files are the `.bin`\
    \ files and they store the data in the binary form of 0s and 1s. Furthermore,\
    \ binary files can store a larger amount of data compared to text files.\n\nIn\
    \ the C programming language, we can create a new file, open an existing file,\
    \ read from and write information to a file, and close a file through simple commands\
    \ mentioned in the following table:\n\n| Operation | Syntax |\n| :--- | :--- |\n\
    | Opening a file | `Ptr = fopen(\"file_open\", \"mode\")` |\n| Closing a file\
    \ | `fclose(fptr);` |\n| Write to binary file | `fwrite(address_data, size_data,\
    \ numbers_data, pointer_to_file);` |\n| Read from binary file | `fread(address_data,\
    \ size_data, numbers_data, pointer_to_file);` |\n| Write to text file | `File\
    \ *fptr; Fptr = fopen(\"file_address\", \"w\");` |\n| Read from text file | `File\
    \ *fptr; Fptr = fopen(\"file_address\", \"r\");` |\n| File seek | `fseek(file,\
    \ *stream, long int offset, int whence);` |\n\n### Essential tips to make C programming\
    \ easy\n\nFor beginners, it is advised that they always comment their code by\
    \ writing vital code information between `/*` and `*/`. Commenting on the major\
    \ part of your code can also make it easier to make future changes and improve\
    \ the functionality of the program. Furthermore, always use variables to store\
    \ data such as `int`, `char`, and `float` because it will make it simpler for\
    \ you to perform different operations and calculations.\n\nC language is simple\
    \ and fast. With the availability of pointers, keywords, and bitwise operators,\
    \ writing efficient code will surely not be a problem for beginners.\n\n## Chapter\
    \ five: C++\n\nC++ is a free form and intermediate level programming language\
    \ that was developed by Bjarne Stroustrup in 1979. Being an enhanced version of\
    \ the C programming language, C++ has now become the most used and best suited\
    \ language for beginners. The language delivers about 7 different styles of programming\
    \ and you can choose the most suitable style as per your requirements. Being a\
    \ statistically typed programming language, C++ allows the compiler to outline\
    \ errors or bugs before executing the program. Moreover, object-oriented programming\
    \ with C++ makes it convenient to solve complex problems and extends the usage\
    \ of standard libraries as well.\n\nC++ is the world’s most popular programming\
    \ language and is widely used with graphical user interfaces, operating systems\
    \ and embedded systems as well.\n\n### Basic syntax\n\nThe basic syntax for C++\
    \ programming language is the same as other languages such as C. Including various\
    \ words, symbols, characters, operations and expressions, the programmer must\
    \ follow a predefined set of rules to execute the program properly.\n\nHere is\
    \ the first program we can write to get started with C++:\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\ncout << \"my first program in c++\";\nreturn\
    \ 0;\n}\n```\n\nProgram output: my first program in c++. \n\n![image_rsrc9FB.jpg](images/image_rsrc9FB.jpeg)\n\
    \n![image_rsrc9FC.jpg](images/image_rsrc9FC.jpeg)\n\nThe details of the program\
    \ are as follows:\n\n- `#include<iostream>`: the statement contains predefined\
    \ input and output functions and informs the compiler to include the file as well.\n\
    - `using namespace std;`: a statement used to store the functions and operations\
    \ within the program where `std` is considered a namespace name.\n- `int main()`:\
    \ this is the main function of the program where execution begins. `int` is a\
    \ return type and indicates to the compiler to return an integer value for which\
    \ we also have to include `0` at the end.\n- `cout << \"my first program in c++\"\
    `: `cout` is an object that belongs to the i and is used to display the content.\n\
    - `return 0;`: the statement returns 0 from `main()` and is responsible for the\
    \ execution of the main function.\n\n### Variables and data types\n\nVariables\
    \ are different types of variables in C++ language as they are defined with a\
    \ specific keyword. We must create a variable, specify the type, and assign the\
    \ value by following the syntax as given:\n\n`Type variable = value;`\n\nTypes\
    \ of variables\n- `int`: used to store integers and whole numbers. For example,\
    \ `4563`.\n- `char`: used to store single characters. For example, 'a' or 'z'.\n\
    - `double`: used to store floating point numbers. For example, `50.21342`.\n-\
    \ `bool`: used to store value with two states: true or false.\n- `string`: used\
    \ to store text. For example, \"c++ language\".\n\nTo declare and assign a value\
    \ to a variable, we can follow the syntax mentioned below:\n\n```cpp\nint newnum;\n\
    newnum = 50;\ncout << newnum;\n```\n\nEvery variable that is used in C++ should\
    \ be identified with unique names which are known as identifiers. To construct\
    \ identifiers names must contain letters, digits, or underscores and are case\
    \ sensitive as well.\n\n### Data types\n\nData types in the C++ programming language\
    \ define the type of data that can be stored in a variable. Generally the data\
    \ types in C++ are classified into three groups: built-in, derived, and user-defined.\
    \ The user-defined data type includes structures, union, and `enum` where the\
    \ derived data type is based on array, function, and pointer.\n\nBuilt-in data\
    \ types for C++:\n- `int`\n- `char`\n- `float`\n- `double`\n- `bool`\n\nUser-defined\
    \ data types:\n- `union`\n- `enum`\n- `struct`\n\nDerived data types:\n- `function`\n\
    - `array`\n- `pointer`\n\n### Modifier types and storage classes\n\nModifiers\
    \ in C++ programming language are used with `char`, `double`, and `int` data types\
    \ to change the meaning of base type in order to meet certain programming conditions.\
    \ These modifiers include `signed`, `unsigned`, `long`, and `short`.\n\nTo define\
    \ the scope of variables and functions within a C++ program, we can use storage\
    \ classes such as `auto`, `register`, `extern`, `mutable`, and `static`. `auto`\
    \ storage class is default for all local variables whereas the `static` storage\
    \ class allows the compiler to store a local variable during the lifetime of the\
    \ program and destroy it whenever it goes out of scope. The `extern` storage class\
    \ gives reference of a global variable and is used when there are two or more\
    \ files using the same global functions or variables. For the `mutable` storage\
    \ class, only class objects are considered and they can also be modified by a\
    \ constant member function as well.\n\n### Flow control\n\nIn C++ programming,\
    \ control flow is referred to as the order in which instructions, functions, and\
    \ states are being evaluated and executed while the program is running. These\
    \ states are executed sequentially from top to bottom inside the code so that\
    \ the program logic is fully satisfied. Programs are not dependent on a linear\
    \ sequence of states for which C++ provide specific flow control states.\n\nFlow\
    \ control states in C++:\n1. `if else`\n2. `for` loop\n3. `do while` loop\n4.\
    \ `break` & `continue`\n5. `switch` state\n6. `goto` state\n\n#### If state\n\n\
    In C++ programming, the `if` state is used when there are multiple states or cases\
    \ to be executed within the program. The syntax for `if` state shows that the\
    \ parentheses only gets executed if the given state is true; `else`, the false\
    \ states are ignored automatically.\n"
