- fmt: "\nOn the topic of the natural language of a computer, they are unable to understand\
    \ human language, and therefore we need to communicate with the system through\
    \ another language called `binary code`. `binary code` is made up of a series\
    \ of 1s and 0s and is the natural communicating language of computers. in order\
    \ to help the computer understand human language, we use translators and editors\
    \ for writing programs. translators have the capability to convert the source\
    \ code into the machine’s language.\n\nThere are multiple types of translators\
    \ known as `interpreters`, `compilers`, and `assemblers`. `interpreters` are generally\
    \ used to interpret languages which are the processed line by line to run the\
    \ final program. moreover, any syntax errors or mistakes are also outlined by\
    \ the `interpreter` so the programmer can clear out the mistakes and execute the\
    \ program.\n\nWith the help of `compilers`, the source code is converted to binary\
    \ code through a compilation process and is executed to deliver the output. if\
    \ there are no errors or mistakes in the source code, all of the lines are translated\
    \ and executed at once by the `compiler`. moreover, computer programs are also\
    \ known as `apps` (application or application software,) and are tailored to the\
    \ environment or platform they are designed to run on. `apps` are differentiated\
    \ in the categories of desktop applications and mobile applications as well.\n\
    \n# Basics of programming\n\n## Introduction to computer programming\n\nEvery\
    \ computer program is a combination of procedures, processes, and algorithms that\
    \ complete the source code. as this process combination can also be considered\
    \ a representation of a software, the process is referred to as a series of actions\
    \ to achieve an output where the procedure can be considered as a series of actions\
    \ performed in a specific order. algorithms are the main driving force of any\
    \ program, also known as an ordered set of steps to solve a certain program or\
    \ problem.\n\nThere are different high-level and low-level languages that can\
    \ be used to write a computer program. nowadays, programs and software are generally\
    \ made by using popular languages which include `c`, `c++`, `java`, `python`,\
    \ `html`, `php`, `ruby`, and `perl`. these languages are used to produce computer\
    \ programs that are currently being used in various fields and industries including\
    \ the medical, engineering, communication household, and entertainment industries.\
    \ furthermore, computer programs are also being used to create graphics web applications,\
    \ and desktop applications as well.\n\n## Elements and basics of computer programming\n\
    \nUsually, computer languages are a combination of several elements that allow\
    \ programmers to achieve an expected output. these elements include the basic\
    \ syntax, programming environment, data types, keywords, `variables`, decision\
    \ making, basic operators, and functions. moreover, in order to perform certain\
    \ operations within a program, you need to apply other operations and use elements\
    \ including loops, strings, characters, file i/o, and arrays as well.\n\nThere\
    \ are five different basic elements of programming that are also considered the\
    \ building blocks of any program. the elements are known as `input`, `output`,\
    \ `arithmetic`, `conditional`, and `looping`. starting with the first element,\
    \ `input` is the process of getting commands and data into the computer whereas\
    \ the `output` element has the functionality to deliver the results. if there\
    \ are any sort of calculations or operations, the `arithmetic` element is used\
    \ along with the conditional statement to test whether the condition is true,\
    \ or false.\n\n# Environment, data types, and basic syntax\n\n## Environment\n\
    \nIn order to run or execute a program, you must install or setup the required\
    \ tool and environment for the language you are using. moreover, beginners can\
    \ also use a text editor to create computer programs if they find it difficult\
    \ to install and configure the programming environments on their own. to execute\
    \ the programs into binary format, it is mandatory that you use a `compiler` because\
    \ the computer cannot understand a program directly if given in the text format.\n\
    \nmoreover, the conversion of text into binary format is done by the `compiler`\
    \ which computers can run. programming languages such as `c++` and `java` can\
    \ be used.\n\n## Basic syntax\n\nTo make it easier for beginners, we will start\
    \ with a sample program written in `c++`.\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    cout << \"hello world!\";\n    return 0;\n\
    }\n```\n\nThe output for this, is:\n\n```\nhello world!\n```\n\nThe program starts\
    \ with `#include` and `main()` which is also known as the main function. At last,\
    \ `return 0;` is the exit status. If you are unable to compile the program, there\
    \ might be some possible syntax errors such as omission of a single semicolon.\n\
    \n## Data types\n\nData types are an important part of various languages and are\
    \ used when creating applications. as it tells the computer how to use the provided\
    \ data. Details of data types are as follows:\n\n*   Date: `01/04/2015`\n*   Integer:\
    \ `521324`\n*   Boolean: `true/false`\n*   String: `aabb`\n*   Void: no data\n\
    *   Long: `532543253`\n*   Floating point number: `5.2341`\n*   Short: `0`\n\n\
    ## Syntax\n\nAs stated previously, a program is defined as a collection of elements\
    \ and attributes that perform certain operations to deliver a specific output.\
    \ with the `c++` programming language, there is a predefined basic syntax that\
    \ needs to be followed when writing programs.\n"
