  trans: "\n\n以下程序展示了 `vehicle` 作为父类，以及一个派生类，该派生类将继承父类 `vehicle` 的特征并调用它的函数。\n\n###\
    \ 类 vehicle：#父类\n\"父类\"\n\n```python\nclass vehicle:\n    def __init__(self, price):\n\
    \        self.price = price\n\n    def display(self):\n        print('price =\
    \ ', self.price)\n```\n\n### 类 category(vehicle):#派生类\n\"子类/派生类\"\n\n```python\n\
    class category(vehicle):\n    def __init__(self, price, name):\n        vehicle.__init__(self,\
    \ price)\n        self.name = name\n\n    def disp_name(self):\n        print('vehicle\
    \ = ', self.name)\n\nObj = category(2000, 'merchandise')\nObj.disp_name()\nObj.display()\n\
    ```\n\n**输出:**\n```\nvehicle = merchandise\nPrice = 2000\n```\n\n要重写基类中的任何方法，我们可以在派生类中定义具有相同名称和参数的新方法。其语法如下：\n\
    \n### 类 a：#父类\n\"父类\"\n\n```python\nclass a:\n    def display(self):\n       \
    \ print('this is base class.')\n```\n\n### 类 b(a):#派生类\n\"子类/派生类\"\n\n```python\n\
    class b(a):\n    def display(self):\n        print('this is derived class.')\n\
    \nObj = b()\nObj.display()\n```\n\n## 正则表达式\n\n在 Python 编程中，正则表达式用于从文档、日志文件、电子表格或代码等文本中提取信息。正则表达式被称为特殊顺序的字符，允许程序员使用特殊语法来查找相关的序列、字符或字符串集。在\
    \ Python 编程语言中编写正则表达式时，我们应该以前缀 ‘r’ 开始编写原始字符串，并同样处理其他特殊元字符。\n\n### Match 函数\n`match()`\
    \ 函数用于检查 Python 中给定的正则表达式是否匹配字符串。如果模式不匹配，我们可以使用 `re.match()` 函数。\n\n### Search\
    \ 函数\n该函数尝试在字符串中搜索所有可能的起始点，并扫描输入字符串以匹配任何位置。它包括 `search()` 或 `re.search()` 函数。\n\
    \n### Split 函数\n`split` 函数可以直接应用于字符串，其中 `re.split()` 接受一个指定分隔符的模式。\n\n## 文件 I/O\n\
    \n文件是磁盘上的特定位置，用于存储信息和数据。由于它存储在硬盘上，我们也可以通过实现 Python 编程方法和技术执行读写操作。Python 中的文件操作由三个主要方面组成：打开文件、读写关闭关闭。\n\
    \n`open()` 是 Python 编程语言中的内置函数，它有两个参数称为 `filename` 和 `mode`。可以通过实现以下方法对文件执行不同的操作：\n\
    \n*   “r” = `open` 或读取文件。\n*   “w” = 写入文件，如果文件不存在则创建一个新文件。\n*   “a” = 打开文件追加，如果文件不存在则创建一个新文件。\n\
    *   “x” = 创建新文件，如果文件已存在则返回错误。\n*   “t” = 以文本模式 `open`。\n*   “b” = 以二进制模式 `open`。\n\
    *   “+” = 打开文件进行读写。\n\n实现方法的语法：\n```python\nf = open(\"sample.txt\")\nf = open(\"\
    img.jpg\", \"r\")\n```\n要关闭文件，我们可以使用 `f.close()` 函数。\n\n### 在 Python 中读取文件\n通过\
    \ Python 语言读取特定文件非常简单，因为我们可以实现 `read(size,)` 方法。例如：\n```python\n>>> f = open(\"\
    sample.txt\",'r')\n>>> f.read(4) # 读取前 4 个数据\n>>> f.read(4) # 读取后续 4 个数据\n>>>\
    \ f.read() # 读取到文件末尾\n'My first file,this file,contains four lines'\n>>> f.close()\n\
    ```\n\n### 写模式打开文件\n使用内置 `open()` 函数打开文件，可以使用以下语法：\n```python\nf = open(\"sample.txt\"\
    , \"r\")\nprint(f.read())\n```\n读取特定行，我们可以实现 `readline()` 函数：\n```python\nf =\
    \ open(\"sample.txt\", \"r\")\nprint(f.readline())\n```\n\n### 写入现有文件\n以下 Python\
    \ 语法将打开示例文件并追加内容：\n```python\nf = open(\"sample.txt\", \"a\")\nf.write(\"update\
    \ content\")\nf.close()\n```\n追加之后：\n```python\nf = open(\"sample.txt\", \"r\"\
    )\nprint(f.read())\n```\n\n### 创建文件\n要创建一个新文件，将使用 `open()` 方法，它可以带创建、追加或写入参数。Python\
    \ 中创建文件的语法定义如下：\n```python\nf = open(\"newfile.txt\", \"w\")\n```\n\n### 删除文件\n\
    要删除现有文件，应使用 `os.remove()` 函数，语法如下：\n```python\nimport os\nos.remove(\"sample.txt\"\
    )\n```\n检查文件是否存在的语法。如果是，则删除：\n```python\nimport os\nif os.path.exists(\"sample.txt\"\
    ):\n    os.remove(\"sample.txt\")\nelse:\n    print(\"the file does not exist\"\
    )\n```\n\n## 高级 Python\n\n### 异常处理\nPython 编程语言中有三种异常处理方法，`try`、`except` 和 `finally`\
    \ 块用于处理程序执行期间发生的错误。\n\n#### Try\n通过 `try` 块生成异常，可以实现以下语法：\n```python\ntry:\n \
    \   print(x)\nexcept:\n    print(\"an exception occurred\")\n```\n如果没有抛出错误，示例代码如下：\n\
    ```python\ntry:\n    print(\"python\")\nexcept:\n    print(\"an exception occurred\"\
    )\nelse:\n    print(\"no exception occurred\")\n```\n\n#### Finally\n在异常处理中，即使\
    \ `try` 块抛出了异常，`finally` 块也会执行。例如：\n```python\ntry:\n    print(\"python\")\nexcept:\n\
    \    print(\"an exception occurred\")\nfinally:\n    print(\"try exception finished\"\
    )\n```\n\n#### 自定义异常\n虽然 Python 编程语言中有几种内置异常，可以用于在出现问题时强制程序显示错误，但开发者也可以创建自定义异常来满足他们的需求。要创建一个新异常，必须从\
    \ `exception` 类创建一个新类。\n\n自定义异常可以像普通类一样进行实现，因为大多数内置异常都派生自 `exception` 类。\n\n"
- fmt: "\nHype, text markup language, (html) is a standard markup language, used to\
    \ create websites to display colors, fonts, displays graphics, media, and images.\
    \ html is comprised of different tags that can be used to describe the structure\
    \ of a web page and tell the browser to display the content over the internet.\n\
    \n## What are tags?\n\nTags give instructions to web browsers regarding the structure,\
    \ display, and content of any web page. as they are defined through enclosed angle\
    \ brackets: `<>`. tags are comprised of attributes and elements. an element is\
    \ an object on a page, where an attribute describes the quality or details of\
    \ that element. remember that tags are to be used in pairs and opening tag `<tag>`\
    \ and closing tags are differentiated by `</tag>`.\n\nYour first sample, html\
    \ web page be created by using the following tags:\n\n```html\n<html>\n<head>\n\
    <body>\n<h1>my first heading</h1>\n<p>my first paragraph</p>\n</body>\n</html>\n\
    ```\n\n## Description of tags\n\nIn the above-written html document, the `<html>`\
    \ tag encloses the complete html document and is comprised of other major tags\
    \ including `<head>`, `<body>`, and `<p>`. the `<head>` tag represents the file’s\
    \ head where the `<title>` tag is used to show the document’s header. `<body>`\
    \ includes several other tags that are to be used to create a web page, such as\
    \ heading `<h1>` and paragraph `<p>`.\n\nHtml tags are not case sensitive, but\
    \ they should be used in lower case. to define the version of html, we can use\
    \ the following tag:\n\n```html\n<!DOCTYPE html>\n```\n\nBeginners can run html\
    \ pages by using notepad pc and save the file in `.html` format. this will allow\
    \ them to view the webpages in a browser.\n\n## Basic tags and attributes\n\n\
    ### Basic tags\n\nEach html document is supposed to start with a title, heading,\
    \ and paragraph. after the `<body>` tag, the next major tag to be used is `<h1>`\
    \ or heading tag. depending on your content requirements, heading tags are defined\
    \ with `<h1>` to `<h6>`. for example:\n\nHeadings:\n\n```html\n<html>\n<body>\n\
    <h1> first heading</h1>\n<h2> second heading</h2>\n<h3>third heading</h3>\n<h4>fourth\
    \ heading</h4>\n<h5>fifth heading</h5>\n<h6>sixth heading</h6>\n</body>\n</html>\n\
    ```\n\nOutput:\n![image_rsrc9FJ.jpg](images/image_rsrc9FJ.jpeg)\n\nParagraph\n\
    \nFor adding content, we need to include paragraphs in the html document. for\
    \ example:\n\n```html\n<html>\n<head>\n<h1> heading</h1>\n</head>\n<body>\n<p>\
    \ first paragraph </p>\n<p> second paragraph </p>\n</body>\n</html>\n```\n\nOutput:\n\
    Heading\nFirst paragraph\nSecond paragraph\n\nTo add break between a paragraph,\
    \ we can use the line break tag `<br>`.\n\n### Summary tag\n\nTo add summary for\
    \ the paragraph, the html syntax with summary tag is defined as follows:\n\n```html\n\
    <details>\n<summary>sample text</summary>\n<p> web development tutorials</p>\n\
    </details>\n```\n\n### Span\n\nSpan tag is used to color specific part of a text.\
    \ for example:\n\n```html\n<p> web development is <span style=\"color:red\"> interesting\
    \ </span> to learn </p>\n```\n\n### Select\n\nThe `select` tag is used for selecting\
    \ one option from drop list. for example:\n\n```html\n<select>\n<option value=\"\
    red\">red</option>\n<option value=\"blue\">blue</option>\n<option value=\"green\"\
    >green</option>\n<option value=\"white\">white</option>\n</select>\n```\n\n###\
    \ Table\n\nThe `<table>` tag is used to create a group header and is used with\
    \ `<thead>` and `<tbody>` elements. for example:\n\n```html\n<table>\n<thead>\n\
    <tr>\n<th>course</th>\n<th>marks</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>engineering</td>\n\
    <td>85</td>\n</tr>\n<tr>\n<td>english</td>\n<td>90</td>\n</tr>\n<tr>\n<td>sum</td>\n\
    <td>180</td>\n</tr>\n</tbody>\n</table>\n```\n(Note: image)\n\n## Formatting tags\n\
    \nTexts within an html document can be formatted to different styles, fonts, and\
    \ sizes. the tags to format headings, paragraphs, and tables are as follows:\n\
    \n*   **Bold**:\n    Any text written between `<b>` and `</b>` tags is displayed\
    \ in bold style. for example:\n    `<p> <b> development </b> is interesting </p>`\n\
    \    Output: development is interesting\n\n*   **Italic**:\n    Any text written\
    \ between `<i>` and `</i>` is displayed in italic style. for example:\n    `<p>\
    \ <i> development is interesting </i> </p>`\n    Output: development is interesting\n\
    \n*   **Superscript/subscript**:\n    To display content in superscript, we can\
    \ use `<sup>` tags as `<sub>` and `</sub>` tags are used for adding subscripts.\
    \ for example:\n    `<p> this text uses a <sup> superscript </sup> </p>`\n   \
    \ Output: the following word uses a (superscript)\n\n*   **Underline**:\n    Text\
    \ written between `<u>` and `</u>` tag is underlined\n    `<p> <u> sample text\
    \ </u> </p>`\n    Output: sample text\n\n*   **Insert and delete tags**:\n   \
    \ To insert the `<ins>` and `</ins>` tags are used where to delete any text we\
    \ can use `<del>` and `</del>` tags.\n\n*   **Link**:\n    To add a link within\
    \ the text, we can use the following tag:\n    `<p> <a href=\"document location\"\
    ></a> </p>`\n\n### Marquee tag\n\nThe `<marquee>` tag can be used with different\
    \ attributes including width, height, direction, behavior, scrollamount, scrolldelay,\
    \ loop, bgcolor, hspace, and vspace.\n\nDemonstration of marquee tag:\n\n```html\n\
    <html>\n<head>\n<title>html marquee tag</title>\n</head>\n<body>\n<marquee>sample\
    \ text</marquee>\n</body>\n</html>\n```\n\n## Container tags\n\nIn html, the following\
    \ container tags are used to format the text:\n\n| Opening tag | Closing tag |\
    \ Functionality |\n| :--- | :--- | :--- |\n| `<p>` | `</p>` | Paragraph |\n| `<span>`\
    \ | `</span>` | To add inline content within a paragraph |\n| `<em>` | `</em>`\
    \ | Used to give text emphasis |\n| `<ol>` | `</ol>` | Ordered list (numbers)\
    \ |\n| `<ul>` | `</ul>` | Unordered list (bullets) |\n| `<li>` | `</li>` | List\
    \ item |\n\n## Tables, images, and frames\n\n### Tables\n\nTables are an essential\
    \ part of any website, as they help us to illustrate and elaborate key information\
    \ in a suitable manner. in html, there are predefined tags that can be used to\
    \ create and design tables.\n\n### Tags for creating tables in html\n\nTo create\
    \ a table, we can use the following tag:\n\n```html\n<table>\n</table>\n```\n\n\
    ### Table rows\n\nTo create rows, we use `<tr>` tag:\n\n```html\n<tr></tr>\n```\n\
    \n### Table header\n\nThe `<th>` tag is for row header or column header.\n\n```html\n\
    <th></th>\n```\n\n### Table data\n\nThe `<td>` tag is for table data. the attributes\
    \ for table data are `colspan` and `rowspan` for which we need to use span cells\
    \ across multiple rows and columns.\n\n```html\n<td colspan=\"number\"></td>\n\
    <td rowspan=\"number\"></td>\n```\n\n### Images\n\nImages are an essential part\
    \ of any website, as they help us to illustrate concepts, services and information\
    \ in a better way. it is quite simple to insert and manage images in html.\n\n\
    ### Tag for inserting image\n\nTo insert an image, we use the following tag:\n\
    \n```html\n<img src=\"image url\" />\n```\n\nTo set a specific height and width\
    \ of an image, the following syntax can be used:\n\n```html\n<img src=\"image\
    \ url\" alt=\"sample image\" width=\"100\" height=\"100\" />\n```\n\n### Alignment\
    \ and border\n\nThere are three positions to align an image on a webpage, known\
    \ as center, right, and left. for this, we can use the `align` attribute. for\
    \ example:\n\n```html\n<img src=\"image url\" alt=\"sample image\" align=\"center\"\
    />\n```\n\nFor creating image border, the attribute is `border`. for example:\n\
    \n```html\n<img src=\"image url\" alt=\"sample image\" border=\"4\"/>\n```\n\n\
    ### Frames\n"
