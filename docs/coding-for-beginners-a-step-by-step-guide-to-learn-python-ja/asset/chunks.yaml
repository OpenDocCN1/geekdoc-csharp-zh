  trans: "\n\n```cpp\nif(condition){\n  state,me,nt;\n}\n```\n\n### if state,me,nt\
    \ 的流程图：\n\n用于说明 C++ 中 if state,me,nt 的示例程序：\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n  int marks = 80;\n  if (marks < 100) {\n  \
    \  cout << \"marks are less than 100\";\n  }\n  if (marks > 100) {\n    cout <<\
    \ \"marks are greater than 100\";\n  }\n  return 0;\n}\n```\n\n### 嵌套 if state,me,nt\n\
    在 C++ 中，嵌套在 state,me,nt 内部的 state,me,nt 被称为嵌套 if state,me,nt。例如：\n\n```cpp\nif\
    \ (condition_1) {\n  State,me,nt1;\n  if (condition 2) {\n    State,me,nt2;\n\
    \  }\n}\n```\n\n### If else, state,me,nt:\n```cpp\nif (condition_1) {\n  State,me,nt;\n\
    \  else (condition 2) {\n    State,me,nt;\n  }\n}\n```\n\n### Switch case\nC++\
    \ 编程中的 switch case, state,me,nt 用于当程序中给出多个条件，并且我们需要根据提供的条件执行相应操作时。`break` 和 `continue`\
    \ 操作也是 switch state,me,nt 的重要组成部分。C++ 中 switch case 的语法如下：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n  int num = 10;\n  switch\
    \ (num + 5) {\n    case 1:\n      cout << \"case,1: value, is: \" << num << endl;\n\
    \    case 2:\n      cout << \"case,2: value, is: \" << num << endl;\n    case\
    \ 3:\n      cout << \"case,3: value, is: \" << num << endl;\n    default:\n  \
    \    cout << \"de,fault: value, is: \" << num << endl;\n  }\n  return 0;\n}\n\
    ```\n\n### Go to state,me,nt\nC++ 中的 go to state,me,nt 用于改变程序的执行流，并将控制转移到同一程序内另一个带有标记的\
    \ state,me,nt。\n\ngo to state,me,nt 的语法：`goto label;`\n\n## 循环与函数\n\n#### 循环\n\
    C++ 编程语言中的循环 state,me,nt 用于按特定次数的迭代执行特定的代码块，直到满足提供的条件。由于它们允许程序员同时执行多项任务，循环 state,me,nt\
    \ 会执行函数中的第一个 state,me,nt 并根据需要移动到下一个。\n\n##### 循环类型\n- **While 循环**：当提供的条件为真时重复\
    \ state,me,nt，并在执行循环体之前重新检查。\n- **Do while 循环**：在循环执行期间检查条件。\n- **For 循环**：多次执行特定的\
    \ state,me,nt 并同时管理循环变量。\n- **嵌套循环**：在一个循环内部包含另一个循环。\n\n循环可以通过不同的控制 state,me,nt\
    \ 执行，如 `break` state,me,nt、`continue` state,me,nt 和 `goto` state,me,nt。\n\n####\
    \ 函数\n函数负责将不同的代码段组合并一起执行，以完成给定的操作。C++ 编程语言中的两种主要函数类型包括库函数和自定义函数。库函数是在 C++ 中预定义的，而用户定义函数是由程序员自己创建的。\n\
    \n定义一个函数，我们可以使用以下语法：\n\n```cpp\nreturn_type function_name(parameter list) {\n\
    \  function body\n}\n```\n\n`min()` 函数的示例代码：\n```cpp\nint min (int num1, int num2)\
    \ {  //函数声明\n  // 局部变量声明\n  int result;\n  if (num1 < num2)\n    result = num1;\n\
    \  else\n    result = num2;\n  return result;\n}\n```\n\n##### 函数调用\n在 C++ 中调用函数，我们可以使用以下方法：\n\
    - 引用传递。\n- 值传递。\n- 指针传递。\n\n##### 函数重载\n当两个或多个函数具有相同的名称但具有不同的参数时，该过程被称为重载函数。C++\
    \ 中函数重载的语法如下：\n\n```cpp\nvoid same_function(int a);\nint same_function(float a0);\n\
    void same_function(int a, double, b);\n```\n\n## 数组、字符串、指针和引用\n\n#### 数组\n数组在编程语言中被广泛使用，因为允许我们处理大量相同类型的数据。通常，数组被用作存储固定数量数值的数据集合。\n\
    \n在 C++ 中声明数组的语法：\n`datatype arrayname[size];`\n\n初始化：\n`int age[5] = {15, 20,\
    \ 25, 30};`\n\n使用数组求和的 C++ 示例程序：\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n  int nummers[10], sum = 0;\n  for (int i = 0; i < 10;\
    \ i++) {\n    cin >> nummers[i];\n    sum += nummers[i];\n  }\n  cout << \"sum\
    \ = \" << sum;\n  return 0;\n}\n```\n\n#### 字符串\n字符串被用作字符集合。在 C++ 中，常见的类型有字符串和标准库。可以使用以下语法来定义字符串：\n\
    `char str[] = \"programming\";`\n\n指针被用作值，指向内存地址。在 C++ 中，使用以下操作符访问变量的内存地址：\n\n\
    #### 类\n类是创建对象的蓝图。它是一种自定义类型。定义类的语法：\n`class name {`\n\n类可以定义为私有的（private）或受保护的（protected），这样数据只能在程序内部访问。示例代码：\n\
    ```cpp\nclass student {\nprivate:\n  char name[20];\n  int rollno;\n  float total;\n\
    \npublic:\n  // 获取学生详情的函数\n  void getdetails(void);\n  // 打印学生详情的函数 void putdetails(void);\n\
    };\n```\n\n#### 继承与多态\n在编写实现继承的程序时，我们可以考虑基类和派生类的概念。由于类可以派生自一个或多个类，派生类可以访问基类的所有非私有成员，同时也可以从现有类创建一个新类。C++\
    \ 中继承的语法为：\n\n```cpp\nclass a { // 基类 };\nclass b : public a { // 派生类 };\n```\n\
    \n#### 访问修饰符\n在 C++ 中，访问修饰符用于确定类之外成员的可用性限制。主要的访问修饰符有私有（private）、受保护（protected）和公共（public）。\n\
    \n在创建类时使用私有访问修饰符，使基类的受保护和公共数据成员变为派生类的私有成员，而基类的私有成员仍保持为私有。\n\n在受保护（protected）访问修饰符中，基类的公共和受保护数据成员变为派生类的受保护成员。基类的私有成员仍然无法访问。\n\
    \n在创建类时使用公共（public）访问修饰符，使基类的数据成员变为派生类的公共成员。基类的私有和受保护成员仍然无法访问。\n\n"
- fmt: "\nAccess specifier is used when the public data members of the base class\
    \ become the public member of the derived class. The protected members become\
    \ protected in derived class whereas the private members of the base class remain\
    \ inaccessible.\n\nSyntax for using access specifiers in c++:\n\n```cpp\nClass\
    \ myclass { // class\n\nPublic : // access specifier\n\n// class members\n};\n\
    ```\n\n### Friend function, data structures, and encapsulation\n\n#### Friend\
    \ function\nIn object-oriented programming, the nonmember function is not given\
    \ access to private and protected data of an object. To allow access for private\
    \ or protected data in this case, we can use friend function or friend class which\
    \ allows programmers to access the private and protected data of a class.\n\n\
    The function is declared by the keyword `friend` and should be used within the\
    \ body of the class. To declare the friend function in c++ programming language,\
    \ we can use the syntax as mentioned below:\n\n```cpp\nClass class_name\n{\nfriend\
    \ return_type function_name(argument);\n}\n```\n\n#### Data structures\nAlthough\
    \ data structures are required to be briefed in depth with detail to clear objectives\
    \ of this topic, we will be discussing how a structure is defined and used in\
    \ c++. structure is a user-defined datatype, which can be implemented in a program\
    \ by using the following syntax:\n\n```cpp\nStruct [structure, tag]\n{\nmember\
    \ definition;\n}\n```\n\nFor example:\n\n```cpp\nStruct vehicle {\nchar name[50];\n\
    char category[100];\nint model,l_year;\n} vehicle;\n```\n\nFor accessing any member\
    \ within the structure, we can use the member access operator (`.`). Defining\
    \ pointers to structures is made simple through data structures for which we can\
    \ use the following syntax:\n\n```cpp\nStruct vehicle *struct_pointer;\n```\n\n\
    #### Encapsulation\nThe term ‘encapsulation’ is defined as the approach to hide\
    \ sensitive data from users in programming. To perform encapsulation, we are required\
    \ to declare the class variables and attributes as private, and read or modify\
    \ the value of a private member through getter and setter methods. The syntax\
    \ for accessing private members is defined as follows:\n\n```cpp\n#include <iostream>\n\
    \nUsing namespace std;\n\nClass employee {\nprivate:\n    // private attribute\n\
    \    int salary;\n\npublic:\n    // setter\n    void setsalary(int s) {\n    \
    \    salary = s;\n    }\n    // getter\n    int getsalary() {\n        return\
    \ salary;\n    }\n};\n\nInt main() {\n    employee myobj;\n    myobj.setsalary(50000);\n\
    \    cout << myobj.gettsalary();\n    return 0;\n}\n```\n\n### File handling\n\
    In c++ programming language, we have been using `cin` and `cout` methods to read\
    \ or write data within a program. To read and write data from a file, c++ offers\
    \ a standard library known as `fstream` which includes `ifstream`, `ofstream`,\
    \ and `fstream` data types.\n\nTo open a file, `fstream` or `ofstream` objects\
    \ can be used for which the c++ syntax is defined as follows:\n\n```cpp\nVoid\
    \ open(const char *filename, ios::openmode mode);\n```\n\nSyntax for closing a\
    \ file:\n\n```cpp\nVoid close();\n```\n\n### C++ language features and support\n\
    C++ programming language provides rich library support and standard template library\
    \ (stl) functions that can be used to write code fast. As it is an object-oriented\
    \ programming language, we can focus on objects and perform different type of\
    \ operations and implementations without any hassle, unlike other major languages,\
    \ c++ provide support as.\n\nDue to its fast, reliable, and secure features, c++\
    \ is widely used in development of operating systems, graphics, and database.\
    \ the language is fast and is known for its efficiency, more c++ also allows exception\
    \ handling and supports function overloading.\n\n### C#: Overview and basic syntax\n\
    \n#### Overview\nC# is a programming language developed by Microsoft to be used\
    \ with the .NET framework. the language is based on object-oriented programming\
    \ and has the same basic syntax as other programming languages such as c++. C#\
    \ is developed for common infrastructure (cli) which is comprised of runtime environment\
    \ and executable code, being easy to learn c# is one of the best programming languages\
    \ as they can produce efficient programs and compile on different platforms.\n\
    \nIn order to run c# applications and programs, a .NET framework is required which\
    \ can be used to write code for windows applications and services. the development\
    \ environment (ide) for c# includes Visual Studio.\n\n#### Basic syntax\nBased\
    \ on object-oriented programming, c# programming is all about classes and objects.\
    \ Taking the example of a student class, it has attributes such as name, id, and\
    \ grade, although the attributes of each student are the same, each of them has\
    \ different name, id, and grade which are known as object properties. generally\
    \ a c# program is comprised of namespace declaration, class methods, main method,\
    \ and statements.\n\nHere is a simple program to print “welcome to c# programming”\
    \ in c#:\n\n```csharp\nUsing system:\nnamespace csharp programming\nclass programming\
    \ {\n    // main function\n    static void main(string[] args) {\n        Console.WriteLine(\"\
    welcome to c# programming\");\n        Console.ReadKey();\n    }\n}\n```\n\nDetails\
    \ for basic syntax:\n- `Using system`: used to include system namespace for the\
    \ program.\n- `Namespace declaration`: collection of classes within the program.\n\
    - `Class declaration`: the class which contains data and methods to be used in\
    \ the program.\n- `Static void main()`: the keyword `static` shows that this method\
    \ can also be accessed without instantiating class.\n- `Console.WriteLine()`:\
    \ method used to define system namespace.\n- `Console.ReadKey()`: makes the computer\
    \ wait for the next command and also stops the screen from turning off.\n\n####\
    \ Datatypes and variables\nData types are an essential part of any programming\
    \ language, as they specify the type of data that is supported in the language.\
    \ as they are predefined in c#, datatypes are separated into three major categories\
    \ known as value data types, reference data types, and pointer data type.\n\n\
    The value data type variables are derived from `System.ValueType` class and they\
    \ contain data in the form of alphabets and numbers. Following table shows the\
    \ value types that are used in c# programming language:\n\n| Data type | Representation\
    \ | Default value | Range |\n| :--- | :--- | :--- | :--- |\n| Byte | 8-bit unsigned\
    \ integer | 0 | 0 to 255 |\n| Decimal | 128-bit precise decimal values | 0.0 |\
    \ -7.9 x e²⁸ to 7.9 x e²⁸ |\n| Bool | Boolean value | False | True/false |\n|\
    \ Float | 32-bit single floating-point type | 0.0m | -3.4 x e³⁸ to + 3.4 x e³⁸\
    \ |\n| Double | 0.0d | (+/-)5.0 x e⁻³²⁴ to (+/-)1.7 x e³⁰⁸ |\n| Char | 16-bit\
    \ unicode character | ‘\\0’ | U+0000 to u+ffff |\n| Int | 32-bit signed integer\
    \ type | 0 | -2,147,483,648 to 2,147,483,647 |\n| Short | 16-bit signed integer\
    \ type | 0 | -32,768 to 32,767 |\n| Long | 64-bit signed integer type | 0l | -9,223,372,036,854,775,808\
    \ to 9,223,372,036,854,775,807 |\n\n2. reference data type,\n"
