    ### Passing pointers to structures

    We can also define pointer to structure in the c programming language, which is
    done in the same manner as defining a pointer to another variable. in order to
    access the members of a structure through pointer, the following syntax can be
    considered:


    ```

    Struct_pointer->title;

    ```


    ## C programming files

    Programming requires the developers to handle different requirements and scenarios
    by using the most effective approaches. to perform file handling operations in
    c language, we can use the operations as follows:


    *   `fprint(f)`

    *   `fscanf()`

    *   `fread()`

    *   `fwrite()`

    *   `fseek()`


    Generally, the entire data is lost when a program is terminated for which we have
    to create a specific file containing all of the data. it also saves time, and
    lets the programmer access data from the file, by entering a few commands and
    transferring the data from one computer to another through c language operators.

