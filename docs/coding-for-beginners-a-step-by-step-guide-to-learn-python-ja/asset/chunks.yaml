  trans: "\n引用数据类型存储的是变量的引用，而不是存储实际数据。通过使用多个变量，引用类型可以指向同一个内存位置，如果内存位置被其中一个变量更改，另一个变量的值也会随之改变。\n\
    \n### 3. 对象类型 (object type)\n\n对象数据类型被认为是 C# 中所有数据类型的基类。此外，对象类型还可以分配其他类型的值、引用类型、定义类型和值类型。\n\
    \n### 4. 指针数据类型\n\n指针数据类型包含变量值的内存地址，其语法如下：\n\n`Type* identifier;`\n\n### 运算符\n\
    \nC# 使用运算符的方式与 `c` 和 `c++` 等其他主要编程语言相同。内置运算符集包括算术运算符、关系运算符、位运算符、逻辑运算符、杂运算符和赋值运算符。\n\
    \n### 函数与方法\n\n在 `c` 编程语言中，函数允许程序员封装代码的特定部分，并在代码的其他部分利用它。由于它消除了重写代码的需求，我们可以从多个地方访问函数并执行所需的操作。`c`\
    \ 中的函数使用以下语法声明：\n\n```\n<visibility> <return type> <name>(<parameters>)\n{\n<function\
    \ code>\n}\n```\n\n被称为成员函数或类成员的函数在 `c` 编程语言中也被称为方法。通常，`c` 中有两种方法，称为实例方法和静态方法。\n\
    \n函数可以返回任何类型的数据，并且执行多条语句，如 `read`、`follow` 和 `run`。\n\n在 `c` 中使用函数的示例程序：\n\n```csharp\n\
    using system;\n\nClass return2\n{\n    static string lastfirst(string firstname,\
    \ string lastname)\n    {\n        string separator = \", \";\n        string\
    \ result = lastname + separator + firstname;\n        return result;\n    }\n\
    \    static void main()\n    {\n        console.WriteLine(lastfirst(\"john\",\
    \ \"william\"));\n        console.WriteLine(lastfirst(\"james\", \"lewis\"));\n\
    \    }\n}\n```\n\n### 数组、字符串和结构体\n\n#### 数组\n\n数组用于存储具有相同数据类型的固定大小元素集合。由于具有连续的内存位置，可以使用以下语法在\
    \ `c` 编程语言中声明数组：\n\n`Datatype[] arrayname;`\n\n初始化：\n`Int [] age = new age[20]`\n\
    \n在 `c` 编程语言中声明和访问数组的示例程序：\n\n```csharp\nusing system;\nnamespace arrayapplication\
    \ {\n    class myarray {\n        static void main(string[] args) {\n        \
    \    int [] n = new int[20]; /* n 是一个包含 20 个整数的数组 */\n            int i,j;\n \
    \           /* 初始化数组 n 的元素 */\n            for (i = 0; i < 20; i++) {\n      \
    \          n[i] = i + 100;\n            }\n            /* 输出每个数组元素的值， */\n   \
    \         for (j = 0; j < 10; j++) {\n                console.WriteLine(\"element[{0}]\
    \ = {1}\", j, n[j]);\n            }\n            console.ReadKey();\n        }\n\
    \    }\n}\n```\n\n#### 字符串\n\n我们可以在 `c` 编程中使用 `system.string` 关键字创建字符串。为了创建一个字符串对象，我们可以采用不同的方法，例如将字符串字面量赋值给字符串变量、使用连接运算符\
    \ (`+`）、调用格式化方法转换值，或通过使用字符串构造函数。\n\n语法：\n`String []array={\"this\", \"is\", \"\
    c#\"};`\n\n#### 类与对象\n\n类被定义为对象类型的表示以及以及数据类型的蓝图。在 `c` 编程中，类的定义以关键字 `class`、类名和类体开始。访问类中的成员允许访问成员，其中类的默认访问权限被称为\
    \ `internal`（内部的）。为了访问成员，我们可以使用 `.` 运算符。它还将对象的名称与成员的名称联系起来。类也被视为一种引用类型，在我们使用 `new`\
    \ 运算符创建类的实例之前，该变量包含 `null` 值。在 `c` 中声明类，可以遵循以下语法：\n\n```csharp\nPublic class student\n\
    {// 属性，方法}\n```\n\n示例：\n`Myclass student = new myclass();`\n`Myclass student2\
    \ = student;`\n\n#### 创建对象\n\n在 `c` 编程中，对象完全基于类。类定义了一种类型的对象。它也被称为类的实例，可以使用以下语法创建：\n\
    \n`student object1 = new student();`\n\n一旦创建了类的实例，对象引用就会自动传回。例如：\n`student object2\
    \ = new student();`\n`student object3 = object2;`\n\n以下程序展示了如何在 `c` 编程语言中创建对象：\n\
    \n```csharp\nusing system;\nnamespace tutorial {\n    Class program\n    {\n \
    \       Static void main(string[] args)\n        {\n            users user = new\
    \ users(\"harry\", 20);\n            user.userDetails();\n            console.WriteLine(\"\
    press enter to exit..\");\n            Console.ReadLine();\n        }\n    }\n\
    }\nPublic class users\n{\n    Public string name {get; set; }\n    Public int\
    \ age {get; set; }\n    Public users(string name, int age)\n    {\n        Name\
    \ = name;\n        Age = age;\n    }\n    Public void userDetails()\n    {\n \
    \       console.WriteLine(\"name: {0}, age: {1}\", name, age);\n    }\n}\n```\n\
    \n### 继承与多态\n\n#### 继承\n\n继承是 `c` 的重要部分，因为它是一种面向对象的编程语言。它允许程序员重用具有相同功能的类，继承的工作方式类似于父子关系。父类被视为基类，而子类被称为派生类，它继承了父类的所有功能。\n\
    \n语法：\n`<access-specifier> class <base_class> {... }`\n`Class <derived_class>\
    \ : <base_class> {... }`\n\n对于多级继承：\n```csharp\nPublic class a\n{\n// implementation\n\
    }\nPublic class b : a\n{\n// implementation\n}\nPublic class c : b\n{\n// implementation\n\
    }\n```\n\n#### 多态\n\n多态是指通过单一操作执行多种功能的技术。静态多态在编译时执行，而动态多态在运行时决定。\n\n在静态多态中，`c`\
    \ 允许程序员实现以下两种方法：\n\n**函数重载**\n\n函数重载在给定的范围内为同一个函数名提供多个定义。此外，函数定义在类型上必须不同，以便你不会重载返回类型不同的函数声明。\n\
    \n**构造函数**\n\n"
- fmt: "\nIn C# programming, a constructor is automatically called whenever a struct\
    \ or class is created. as a class can have multiple constructors to handle different\
    \ arguments, constructors allow the programmers to set limit instantiation and\
    \ default values as well.\n\n### Syntax for creating constructors: \n\n```csharp\n\
    public class person\n{\n    private string last;\n    private string first;\n\n\
    \    public person(string lastname, string firstname)\n    {\n        last = lastname;\n\
    \        first = firstname;\n    }\n    // remaining implementation of person\
    \ class.\n}\n```\n\nThe three type of constructors used in C# programming are\
    \ known as instance constructors, static constructors, and private constructors.\n\
    \n### Exception handling\n\nExceptions are how to transfer control from one segment\
    \ of the program to another. generally, an exception is considered a problem that\
    \ is seen during the execution of a program. to catch the circumstance, C# gives\
    \ multiple exception handling approaches known as `try`, `catch`, `throw`, and\
    \ `finally`.\n\nA `try` block outlines a block of code, for which the exception\
    \ is being used whereas the `catch` exception allows the programmer to handle\
    \ the problem from anywhere in the program. `throw` exception is launched whenever\
    \ a problem is faced whereas the `finally` exception is used to execute a provided\
    \ set of statements.\n\n### Syntax for using exception handling in C# programming\
    \ language:\n\n```csharp\npublic class person\n{\n    private string last;\n \
    \   private string first;\n\n    public person(string lastname, string firstname)\n\
    \    {\n        last = lastname;\n        first = firstname;\n    }\n    // remaining\
    \ implementation of person class.\n}\n```\n\n### Multithreading\n\nIn C# programming\
    \ language, a thread is considered the execution path for a program as it defines\
    \ a specific flow control and is responsible for defining execution paths as well.\
    \ as they are lightweight processes, a thread can save wastage of cpu cycle, and\
    \ in return boost efficiency of the program.\n\nThere are four main states in\
    \ the life-cycle of a thread which include, unstarted state, ready state, not\
    \ runnable state, and dead state. threads can be created, managed, and destroyed\
    \ by implementing specific C# methods.\n\n### File I/O\n\nC# provides different\
    \ classes to operate with the file system and data handling. as these classes\
    \ can be used to open files, access files, access directories, and update existing\
    \ files, C# includes a specific file class to perform all of the I/O operations.\n\
    \nThe class names with details are briefed as follows:\n\n- **File**: `File` is\
    \ a static class which provides different operations including move, delete, create,\
    \ open, copy, read, and write.\n- **Fileinfo**: The `Fileinfo` class performs\
    \ the same as the static file class and programmers can read and write operations\
    \ by writing the code manually for a specific file.\n- **Directory**: The `Directory`\
    \ class is also static and provides support for creating, deleting, accessing,\
    \ and moving subdirectories within a file.\n- **Directoryinfo**: The `Directoryinfo`\
    \ class provides different instance methods for accessing, deleting, moving, and\
    \ creating subdirectories.\n- **Path**: The `Path` static class delivers functionality\
    \ for changing the extension of a file, retrieving extension of a file, and retrieving\
    \ the absolute physical path of a specific file.\n\n### FileStream class\n\nThe\
    \ `fstream` class in the `system.io` namespace is used to create, write, and close\
    \ a specific file through C# programming language. syntax for creating a stream\
    \ class and object is defined as follows:\n\n```csharp\nfstream object_name =\
    \ new filestream(file_name, file_mode, file_access);\n```\n\nAdvanced file operations\
    \ in C# include:\n- reading and writing into text files. own- reading and writing\
    \ into binary files.\n- manipulating the windows file system. `system.io` is an\
    \ abstract class which provides all of the standard methods required to transfer\
    \ bytes to the source, which inherits stream class to perform certain read/write\
    \ operations include file, network.\n\nAdvantages of learning C#\n\nC# programming\
    \ language delivers fast execution time and provides a structured approach to\
    \ solve specific problem. with the availability of advanced functions and built-in\
    \ libraries, programmers can build different types of applications without any\
    \ hassle, as C# is an object-oriented programming language, the development and\
    \ maintenance are simple compared to other high-level programming languages. Over,\
    \ C# is best for creating robust applications with proper interoperability.\n\n\
    ## Capture: Python\n\n### Overview and basic syntax\n\nPython is a well-known\
    \ programming language, which was developed by Guido van Rosum in 1991. being\
    \ a high level object-oriented and interactive scripting language, python can\
    \ be used for system scripting, software development, and server side web development.\n\
    \n### Features\n\nBeing an interpreted based language, python allows execution\
    \ of one instruction at a time, and supports extensive number of data types as\
    \ well. the programming language is easy to learn and code because it has few\
    \ keywords and a clearly defined syntax. with the availability of a broad standard\
    \ library, python also provides support for an interactive mode which makes it\
    \ easier for the developers to test and debug code.\n\nOver, the language can\
    \ be used for gui programming and to develop applications that feature system\
    \ calls, windows systems, and libraries. along with these features, python also\
    \ supports automatic garbage collection and delivers high level dynamic data types\
    \ and can be integrated with C++, C, java. users can interact with python interpreter\
    \ directly to write programs as it provides low level modules as well.\n\nPython\
    \ needs to be installed on your pc and the source code can be downloaded under\
    \ the GNU General Public License (GPL). different gui based python integrated\
    \ development environments (ides) include PyCharm, the Python bundle, Python ID,\
    \ and Sublime Text. the up to date and current binaries, source code, news, and\
    \ documentation can be found at the official website of python: [https://www.python.org/](https://www.python.org/)\n\
    \n### Variable types, basic operators, and data types\n\n#### Variable types\n\
    \nIn python programming, variables are not required to be declared for reserving\
    \ a memory location because the declaration automatically happens whenever a value\
    \ is assigned to the variable. depending on the data type of the variable, the\
    \ interpreter allocates memory and allows the programmer to store decimals, characters,\
    \ or integers.\n\n#### Reserved keywords list for python:\n\n```python\ndel\n\
    else\nand\nassert\nin\nraise\nfrom\ncontinue\nif\nfinally\nnot\npass\nas\nreturn\n\
    not\npass\nyield\nbreak\nexcept\nimport\n```\n"
