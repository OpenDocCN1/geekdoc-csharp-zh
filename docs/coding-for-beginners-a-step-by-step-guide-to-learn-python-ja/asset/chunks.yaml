    End-user database is a shared database, that is specifically designed and created
    for the end-user. as it features a summary of the whole database, the end-user
    certainly needs not to worry about the operations that are being performed at
    any database level.


    # Database syntax, data type, and operators


    Standard query language (`sql`) is used for storing, manipulating, and retrieving
    data within a database. `sql` allows database administrators to perform multiple
    operations that are required to manage a database. the language allows you to
    execute queries, retrieve data, insert records, update records, delete records,
    create new databases, create new tables, and set permissions in a database just
    by writing simple queries.


    There are different versions of `sql` and all of them support major functionalities
    such as `select`, `delete`, `insert`, `where`, and `update`.


    # Structured query language (sql)


    `sql` is the language that is used for relational database systems such as `mysql`,
    `sybase`, `oracle`, and `sql server`. Being a standard database language, `sql`
    allows users to describe the data, access data, and manipulate the relational
    database management systems. Furthermore, users can also create, view, and drop
    databases through the structured query language.


    The different components that are included in this process are optimization engines,
    `sql` query engine, classic query engine, and query dispatcher. To perform specific
    operations in a relational database management system, we can use the commands
    mentioned below:


    | Command | Description |

    | :--- | :--- |

    | `Create` | User can create a new table, or an object within the database. |

    | `Read` | User can read the data stored in the tables. |

    | `Update` | Update the tables to modify records. |

    | `Delete` | Delete any record from the table. |

    | `Insert` | Insert a new record into the table, |

    | `Select` | Select specific records from the tables within the database. |

    | `Alter` | Bring changes within a database object. |

    | `Drop` | Delete the entire table from the database. |


    By using the above operations, we can perform different operations from the sample
    table named ‘students’ given below:


    | Student id | Student name | City | Subject | Marks | Percentage |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | William | New york | Mathematics | 85 | 60% |

    | 2 | James | California | English | 79 | 58% |


    The `sql` statement to fetch records from the above table will have the following
    syntax:


    ```

    select * from students;

    ```


    ## 1. sql queries


    In order to perform specific operations with tables in a database, we are required
    to use different queries that are explained as follows:


    | Query | Syntax |

    | :--- | :--- |

    | `Insert into` | `insert into table_name(column1, column2,...)` <br> `(value_1,
    value_2,...)` |

    | `Update` | `update table_name set column1 = value_1, column2 = value_2.. where
    condition` |

    | `Delete` | `delete from table_name where condition;` |

    | `Order by` | `select column1, ..from table_name, order by column1, asc/desc;`
    |

    | `Min()` | `select min(column_name,) from table_name, where condition;` |

    | `Max()` | `select max(column_name,) from table_name, where condition;` |

    | `Where` | `select column1.. from table_name, where condition;` |


    # Sql joins


    Taking the example of relational database with table a and table b, the table
    can also be joined through the `sql` join query. the diagram clearly shows how
    both the tables are joined together to share data: we will implement join clause
    operations on example tables ‘patients’:


    **Table 1:**

    | patientid | case | date |

    | :--- | :--- | :--- |

    | 4321 | 9-2011 | |

    | 8235 | 3-12-15 | |


    **Table 2:**

    | case | patientname | City |

    | :--- | :--- | :--- |

    | 1 | Andre | Chicago |

    | 3 | John | La |


    To join both tables, we can write the `sql` join statement as follows:


    ```

    select patientid, case, date from patients join patients on case = patientname;

    ```


    There are four different types of `sql` join queries known as:


    * **Inner join**: inner join selects the entire record from table a and table
    b where the join condition is satisfied.

    ```

    select column_name from table1 inner join table2 on table1.column_name = table2.column_name;

    ```

    * **Left join**: left join selects the entire record from table a combined with
    records from table b where the join condition is satisfied.

    ```

    select column_name from table1 left join table2 on table1.column_name = table2.column_name;

    ```

    * **Right join**: right join selects all records from table b combined with records
    from table a where the join condition is satisfied.

    ```

    select column_name from table1 right join table2 on table1.column_name = table2.column_name;

    ```

    * **Full outer join**: full outer join selects all records from table a and table
    b even if the join condition is not met.

    ```

    select column_name from table1 full outer join table2 on table1.column_name =
    table2.column_name where condition;

    ```


    # Union operator


    To combine the result of two or more select statements, the `union` operator is
    used for which each of the column must have similar data types. moreover, the
    columns in the select statement should be in the same order for both tables. the
    syntax for implementing `union` operator in `sql` is as follows:


    ```

    select column_name from table1 union select column_name from table2;

    ```


    # Group by


    The `sql` `group by` statement can be used to perform listing or numbering from
    the database table. syntax for using `group by` statement in `sql` is as follows:


    ```

    select column_name from table_name, where condition group by column_name, order
    by column_name;

    ```


    # Order by


    The `order by` statement in `sql` is used to sort data in ascending or descending
    order. syntax for implementing order by clause, is as follows:


    ```

    select column_list from table_name, where condition [order by column1, column2,]
    [asc | desc];

    ```


    # Advanced sql


    There are several other vital operations and clauses that can be implemented to
    perform complex operations within the database. here are some of the key features
    of advanced `sql` explained in detail:


    ## Indexes


    `sql` indexes are used by database search engines to optimize the process of data
    handling. as they are considered special lookup tables, an index helps speed up
    where clauses and select queries as well. to create an index, we can use `create
    index` statement along with the unique constraint to prevent duplicate entries.


    Syntax for using `create index`:

    ```

    create index index_name on table_name;

    ```


    Syntax for using `drop index`:

    ```

    drop index index_name;

    ```


    ## Truncate table


    The `truncate table` command in `sql` is implemented to delete complete data from
    an existing table.


    Basic syntax:


    ```

    truncate table table_name;

    ```

