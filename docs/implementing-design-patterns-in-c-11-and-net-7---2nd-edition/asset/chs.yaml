  \ SDK`，因为它已经是 Visual Studio 安装的一部分。默认情况下，Visual Studio 会更新并遵循引入到 `.NET` 中的最新功能，例如库的更新、微小和重大更改，以及新项目模板。然而，初始安装后的任何新库的更新都不会自动将升级应用到你的现有项目中。每个项目都针对特定的\
