  \n# Azure Function\n\n\nAzure Function 基于无服务器计算模型，该模型允许我们使用事件和触发器方法执行代码，而无需担心主机应用程序基础设施的配置，对于可扩展服务来说，这是一个具有成本效益的选择。\n\
  \n假设你有一个特定的服务，需要偶尔执行或仅在特定事件发生时执行。在这种情况下，保持常规应用程序服务器 7x24 小可用是没有意义的，这会增加成本并使服务的基础设施定价过高。合适的做法是在当特定事件发生时让特定服务在线，一旦进程完成，基础设施会自动关闭。\n\
  \nAzure Function 是此类操作的完美替代方案，因为它允许我们为短生命周期进程创建函数，按使用比例对资源计费。因此，根据 Azure Function\
  \ App 的配置，它可以以合理的价格支持每月数百万次请求。\n\n\n![](img/Figure_2.9.png)\n\n图 2.9：创建 Function\
  \ App\n\n与 Azure 上的其他资源类型类似，为你的资源指定一个唯一名称是强制性的。这不仅适用于你的账户，还适用于 Azure 上显示的所有资源，因为\
  \ Function apps 默认使用 `azurewebsites.net` 域名，且你的 App 名称不能与其他现有的 Function Apps URL\
  \ 冲突。你还必须指定订阅项和资源组，如图 2.10 所示：\n\n\n图 2.10：Function app 名称\n\nAzure functions 支持使用\
  \ .NET、Node.js、Python、Java 和 PowerShell 脚本进行代码实现。在本章的语境下，选择了 .NET 作为主要的开发栈，并使用了该平台的六版本，如图\
  \ 2.11 所示：\n\n\n图 2.11：Function app 技术栈\n\n其余的基础配置涉及操作系统和计划（Plan），这直接影响到维护应用程序本身基础设施以及执行函数的定价模型。在本示例中，选择了\
  \ Linux 操作系统，因为从 .NET Core 1.0 版本开始 .NET 已经是跨平台的。还选择了消费型（无服务器）计划类型，如图 2.12 所示：\n\
  \n![](img/Figure_2.12.png)\n\n\n确认基本配置后，你将被重定向到预览屏幕，你可以在那里确认实际创建之前检查应用程序的每个相关方面。基础配置下的多数配置在创建后无法更改；因此，在确认创建资源之前，检查最后一个屏幕中指定的数值是至关重要的，如图\
