  \ 移动数据工厂接口\n\n该接口有两个主要属性（`name` 和 `limit`），旨在识别不同类型对象之间的差异。下一步是为 `Mobile Data Factory`\
  \ 指定实现接口的具体类，如图 7.12 所示：\n\n\n图 7.12: 无限数据类\n\n考虑到本场景需要两种移动数据套餐（无限量和 10 GB），必须创建关于\
  \ 10 GB 限制的第二个类，实现相同的接口 `IMobileDataFactory`，如图 7.13 所示：\n\n\n图 7.13: 十 GB 移动数据类\n\
  \n在此阶段，关于主工厂的所有必要子类都已创建，使得预付和付费选项得以实现，这些选项将负责每个移动套餐的自定义创建，并遵循本节开头确定的需求。抽象工厂模式允许我们创建复杂对象以抽象并封装它们的实现细节，使代码对开发者来说更容易阅读和理解。在真实场景中，移动套餐工厂必须负责创建这两个套餐之外的任何不同类型，遵循利益相关者和市场需求随时间不断变化的业务需求。因此，如果需要添加新类型，负责创建的主类将隐藏新类型的复杂性，并且可以安全地扩展功能，而无需担心给软件架构引入问题。\n\
  \n\n![](img/Figure_7.14.png)\n\n图 7.14: 移动套餐工厂表示\n\n\n![](img/Figure_7.15.png)\n\
  \n图 7.15: 移动套餐工厂接口\n\n\n\n`IMobilePlanFactory` 接口包含三个属性，每个属性对应根据短信、连接速度和移动数据需求确定的一个特征。按照惯例，抽象工厂模式（Abstract\
  \ Factory Pattern）使用 `Create` 前缀与每个属性的生成相关。这有助于了解抽象工厂模式工作原理的开发者识别出该模式。此外，建议在类名中使用\
  \ `Factory` 后缀，以与设计模式相对应。在软件开发中，使用有意义的名称是最重要的良好编码实践之一，因为它允许我们减少项目文档的量，并减少分析他人编写代码的时间。\n\
  \n一旦创建了移动计划工厂的接口，下一步就是根据需求严格遵循它们各自的规范，创建两种可用的移动计划。首先，必须创建 `PrepaidFactory` 类来实现底层的接口，如下方的\
  \ 图 7.16 所示：\n![](img/Figure_7.16.png)\n\n图 7.16：预付费移动计划工厂类\n\n`PrepaidFactory`\
  \ 类根据其需求创建相关属性的实例，例如 `CreateConnectionSpeed` 方法中的 `LowSpeed` 类实例，其他两个关于其他属性的创建方法也是如此，它们同样引用接口。另一方面，`PostpaidFactory`\
  \ 类根据自身的规范自动用不同类型填充其属性，如下方的 图 7.17 所示：\n![](img/Figure_7.17.png)\n\n图 7.17：后付费移动计划工厂类\n\
  \n这种方法有助于使代码解释相对简单，因为每个工厂类都显式地创建它自己的不同对象实例，尽管它们共享相似的接口。实现给定移动计划场景的最后一步是创建客户端类，它是抽象工厂模式层次结构中的最高层。客户端类不需要暴露深层次的细节，因为子工厂类通过遵循预付费和后付费移动计划的底层需求，处理每个对象创建的复杂性和实现。客户端类必须根据移动计划类型实现创建正确工厂类所需的逻辑语句。为了明确代码的目的，可以在此上下文中创建一个枚举（enum），引用两种类型的移动计划，如下方的\
  \ 图 7.18 所示：\n![](img/Figure_7.18.png)\n\n图 7.18：移动计划枚举\n\n此外，客户端类可以在构造函数中接收特定的移动计划类型，并包含一个逻辑语句来创建底层的移动计划工厂，如下方的\
  \ 图 7.19 所示：\n![](img/Figure_7.19.png)\n\n图 7.19：移动计划枚举\n\n在给定的场景中，类的构造函数接收指向之前创建的枚举的移动计划类型，因为该方法有一个检查类型的\
  \ `if` 语句。因此，根据其值创建一个不同的移动计划工厂实例：`Prepaid` 或 `Postpaid` 工厂。此外，指定了一个名为 `Describe`\
  \ 的方法，仅用于演示对象之间的区别。\n在 Blazor Server 应用中，我们可以创建一个或多个 `MobilePlan` 类的实例并显示 `Describe`\
  \ 方法的结果，如下方的 图 7.20 所示：\n\n![](img/Figure_7.20.png)\n\n图 7.20：Blazor server 实现\n\
  如 图 7.20 所示，Blazor Server 应用中的 `Index.razor` 组件创建了两个 `MobilePlanClient` 类实例，每个实例具有不同的类型（`Prepaid`\
  \ 和 `Postpaid`），并在网页上显示每个移动计划的描述。运行 Blazor Server 应用后，你将能够在屏幕上看到每个类型移动计划的规范，如下方的\
  \ 图 7.21 所示：\n\n![](img/Figure_7.21.png)\n\n图 7.21：Blazor server 结果\n`Mobile Client`\
  \ 类对抽象工厂类的使用相对简单，因为它从应用程序的最高层封装了每种移动计划类型的实现，将所有关于实现的责任和细节委托给专门类。\n\n## 结论\n结论\n\n\
  \n在本章中，你学习了如何使用 C# 语言在真实场景中实现抽象工厂模式，并能够理解通用设计模式的核心要点，即在实现和软件架构方面使用通用解决方案解决软件开发中的常见问题。\n\
  \n在下一章中，你将继续使用 C# 语言和 `.NET` 平台开启设计模式之旅，学习原型模式（Prototype pattern），并将其概念应用于 ASP.NET\
  \ Core 应用中。\n\n\n\n\n-   **具体工厂 (Concrete Factory)**：这些类或对象实现了抽象工厂中定义的方法。每个具体工厂对应于特定的产品变体/族，并创建这些产品对象。\n\
  -   **抽象产品 (Abstract Product)**：代表某类型产品的主接口或抽象类。它声明了产品必须实现的操作。\n-   **客户端代码 (Client\
  \ Code)**：这是应用程序中使用抽象工厂及其产品的部分。客户端代码与实际的具体类解耦，仅依赖于抽象接口。这允许客户端在不更改核心代码的情况下处理不同的产品族。\n\
