  \n![](img/fm1.png)\n\n# 第 12 章 使用 GRPC 的代理模式\n\n## 引言\n\n实现安全和访问控制策略是大多数企业应用的关键方面，因为它们对于企业在风险风险方面的成功至关重要。某些设计模式可以帮助构建健壮的架构，封装对特定外部资源的访问，并定义一种简单的标准以提高代码的可读性和可维护性。\n\
  \n代理模式帮助我们构建一种健壮的架构，通过仅允许使用特定操作来控制对外部源特定资源的访问，过滤客户端应用程序或消费者需要使用的可用数据。这种模式代表了一种优雅的方式，可以拦截\
  \ API 请求并为客户端应用程序添加额外功能，而无需更改源应用程序的典型行为。\n\n学习代理模式允许你理解如何为系统与库之间简单且复杂的集成实现访问控制。这些系统和库共享接口和协议，但由于业务和安全需求，需要对客户端应用程序限制数据和操作。\n\
  \n在本章中，通过遵循循序渐进的方法，你将能够使用 `C#` 语言以及结合 GRPC 协议的 Blazor 在实际示例中使用代理模式。\n\n## \n\n在本章中，我们将讨论以下主题：\n\
  \n- 代理模式定义\n- 代理模式实现\n- 使用 Blazor 和 GRPC 的代码示例\n\n## 目标\n\n学习本章后，你应该理解代理模式的理论和实践方面，并识别该模式在\
  \ `.NET` 应用和遗留项目用法。\n\n## 代理模式定义\n\n代理模式的主要目标是在集成环境中调解两个或多个组件之间的通信，以控制对源功能的访问。\n\
  \n根据定义，代理模式很容易与适配器模式（Adapter pattern）混淆。两者都旨在调解对特定资源、类或功能的直接访问。然而，尽管它们的目的看起来非常相似，但每个背后的意图完全不同。适配器模式提供了一个接口，如果涉及的类或组件具有不同的接口或输出，该接口是可以被客户端理解的。\n\
  \n需要强调的是，代理模式与更改应用程序的输出或数据格式无关，仅用于过滤和限制对某些功能的访问。\n\n## 代理模式类型\n\n考虑到代理模式可以在不同的场景和语文中使用，可以将该模式分为以下子类型：\n\
  \n- 智能代理（Smart）：这种类型的目的是在客户端和源应用程序之间建立集成时执行不同的操作。这种代理对于执行不属于集成原始功能的操作有益，例如日志记录操作。\n\
  - 保护代理（Protection）：这种代理类型主要旨在为特定功能添加安全控制和访问限制。这种类型通常用于 API，其中客户端应用程序的配置文件或用户应限制可用方法。\n\
  - 缓存代理（Cache）：在企业应用的许多场景中，方法或 API 返回的数据并不经常更改。在这种情况下，可以实现代理类来拦截请求并将过程重定向到另一个过程，从而避免对昂贵资源（如事务数据库）进行不调用。\n\
  - 虚拟代理（Virtual）：有时，代理模式可以简化提供给客户端应用程序的输出。在这种背景下，简化意味着源应用程序暴露的方法或函数。\n- 远程代理（Remote）：这种子类型是代理模式最常用的用途之一，它创建一个负责调解远程资源访问的中间件。客户端应用程序并不一定知道特定资源托管在哪里，这意味着代理组件抽象了与远程组件通信的所有复杂性。\n\
  \n\n\n\n\n软件开发中呈现的良好实践之一是组件之间的松耦合关系。代理模式（Proxy pattern）允许我们保护原始系统免受其他外部系统决定的限制。因此，如果客户端应用程序需要集成现有的第三方或外部资源，则涉及集成的所有部分都可以独立地共存。这是通过使用中介来实现的，以保护源系统和目标系统不受协议和接口干扰的影响。\n\
  \n## 代理模式结构\n\n作为结构性设计模式分类的一部分，代理模式允许我们在软件架构中定义工作流，从而强制解决方案对对对象和资源的访问实施限制。实现这种工作流使得在应用程序中拦截请求成为可能根据功能性和非功能性需求运行额外的自定义例程。\n\
  \n从视觉上看，代理模式的表示结构如图 12.1 所示：\n\n![](img/Figure_12.1.png)\n\n图 12.1: 代理模式图\n\n图 12.1\
  \ 显示客户端应用程序需要访问一个名为 `Real Service` 的特定服务。在这种场景下，对资源的请求被 `Proxy` 层拦截，这允许我们应用如访问控制和过滤等额外操作。`Proxy`\
  \ 层可以包含对内部服务调用的日志操作以及其他自定义例程。\n\n根据代理模式提出的解决方案，客户端应用程序从不直接访问另一个服务。这种限制对于具有不同要求的项目可以出于不同的原因，但以下是最常见的理由：\n\
  \n- 客户端应用程序不应访问其他应用程序提供的所有服务。\n- 法律限制限制了对其他服务提供的方法和功能的访问。\n- 外部服务提供的资源在成本和性能方面非常昂贵。这使得拦截请求变得有利，并为访问原始资源提供了更好的替代方案。这种场景常见于数据缓存向客户端应用程序返回信息，而不是从传统的数据库源提供数据。\n\
  - 在某些情况下，外部资源需要由客户端按照不同的访问规则控制，包括消费数据的源部分不存在的策略。这常见于由不同公司开发且不共享要求的系统的之间的集成。\n- 在多个客户端应用程序消费同一资源的情况下，它们对功能有不同的需求和期望。代理模式可以用于将客户端应用程序的请求重定向到正确的资源或功能，而无需更改源项目目标项目中底层代码的实现。\n\
  - 当法律或业务需求涉及被许多客户端应用程序使用的特定系统时，安全策略会不断变化。\n- 在任何系统之间的集成中，对集成源部分的完全访问通常限于公司之间合同所确定的范围。例如，许多大型科技公司提供基于\
  \ `REST APIs` 的人工智能服务。对服务的访问可能受到定价级别、安全策略、计费策略或其他底层业务规则的限制。\n\n遵循推荐的软件架构实践，任何与业务核心没有相关的的功能都应该在独立的结构中实现。在人工智能服务的上下文中，原始服务应保持不受外部干扰，例如财务信息和其他超出服务核心的业务需求（该服务的核心是提供人工智能服务本身）。在这种场景下，人工智能服务可以保持完整，并可以开发一个\
  \ `Proxy` 层来处理身份验证、安全策略和其他非功能性需求规则。\n\n## 在真实项目中的常见用途\n\n考虑到该模式允许实现的各种能力，代理模式在市场中被广泛使用。通过利用一种能够减少由于应用程序核心需求而对原始类和功能产生更改的模式，使解决方案变得更加健壮。行业中使用的许多\
  \ API 涉及某些程度的安全性，并且通常实现了代理模式所述的概念，而许多开发者并没有意识到该模式实际上在许多场景中被使用了。\n\n在涉及数百万用户的大规模应用程序解决方案中，根据用户消费应用程序的设备类型提供处理请求的替代方案是非常常见的。在这种背景下，想象这样一个场景：社交媒体应用程序有多个用户，且设备类型必须自定义应用程序返回的数据量。这意味着某些类型的设备可能会接收较多的数据，而其他设备由于设备在内存和处理器能力方面的限制，接收数据的轻量级版本。随后可以使用\
  \ `proxy` 拦截来自每个设备的请求，并在从服务器返回响应之前为每种类型的设备应用适当的规则，如图 12.2 所示：\n\n![](img/Figure_12.2.png)\n\
  \n图 12.2: 社交媒体的代理层\n\n最初，客户端应用程序请求的信息本质上是相同的，但 `Proxy` 应用程序为每种设备应用自定义策略，限制移动设备的数据量，并为桌面设备返回完整内容。此外，`Proxy`\
  \ 可能负责应用安全检查，例如针对移动设备的 `JSON Web Token` (`JWT`)，以及为 Web 和桌面设备应用不同的身份验证方法。所有这些方面都不会影响源应用程序。\n\
  \n在下一节中，你将为一个接近真实场景的假设性场景实现代理设计模式。该应用程序遵循真实应用中常见的类似需求，以让你获得使用 .NET 平台和 `C#` 语言实现此模式的经验。\n\
  \n## 代理模式实现\n\n本节包含一个示例应用程序的规范，该程序使用代理模式处理真实项目中常见的需求。需要强调的是，在软件开发中，使用任何设计模式来解决特定问题并不是强制性的。然而，在大多数情况下，它们的使用代表了为各种项目中常见问题提供通用、可维护且有效的解决方案的有效方法。因此，本章解释的示例仅代表了处理假设场景所述问题的方法一种。\n\
  \n### 场景需求\n\n想象这样一个场景：有一个应用程序负责存储和管理与在线新闻相关的信息。每个新闻故事或文章关联有一个广告。\n\n该场景具有以下需求：\n\
  \n- 新闻故事或文章在桌面、移动和 Web 平台上可见。\n- 每个新闻故事或文章必须有一个类别，并可以与无、一个或多个广告关联。\n- 从 Web 平台访问故事或文章不应允许用户阅读生活方式类别的内容。\n\
  - 如果通过移动平台访问，内容将不包含广告。\n\n\n\n\n在给定的场景中，三个不同的平台（桌面端、移动端和网页端）将从同一个存储库获取信息。该存储库包含一个存储与新闻、分类和广告相关内容的数据库。然而，为了增加场景的复杂性，我们可以设定其他由合作伙伴公司维护的应用程序也在从同一个数据库获取信息。为了访问数据库，将使用一个\
  \ `ContentRepository` 层。因此，由于不同的源和应用程序消费相同的内容，`ContentRepository` 层应保持原样，不受其他应用程序或层中包含的需求的影响。\n\
  \n## 实际示例\n\n要创建此应用程序，请使用 Visual Studio 创建控制台应用程序（Console Application），然后添加与示例相关的类。创建的第一个类是\
  \ `News` 类，它包含与新闻故事或文章相关的信息，如图 12.3 所示：\n\n![](img/Figure_12.3.png)\n\n图 12.3：News\
  \ 类定义\n\n第二个创建的类是 `Advertisement` 类，它将作为 `Content` 类的一个属性。`Advertisement` 类的结构如图\
  \ 12.4 所示：\n\n![](img/Figure_12.4.png)\n\n图 12.4：Advertisement 类定义\n\n`Advertisement`\
  \ 类仅包含 `Id`、产品名称以及重定向到广告的超链接。如前所述，`Advertisement` 类将是 `Content` 类的一部分，并具有一对多的关系，因为内容（新闻故事或文章）可能包含一个或多个广告。\n\
  \n`Content` 类包含新闻、广告列表和一个分类，如图 12.5 所示：\n\n![](img/Figure_12.5.png)\n\n图 12.5：Content\
  \ 类结构\n\n如图 12.5 所示，`Content` 类文件包含 `CategoryEnum` 枚举定义，该枚举包含五个分类。到此时，所有必要的模型都已创建，现在可以实现内容存储库类、底层接口以及代理模式（Proxy\
  \ pattern）本身。\n\n名为 `ContentRepository` 的层负责与数据库建立通信，并向消费者应用程序返回必要信息。为了在本节中演示，内容存储库的实现被简化为一个简单的\
  \ `ContentRepository` 类，用于模拟对的访问。因此，该假设类将模拟（mock）内容、新闻和分类数据。\n\n在代理模式的实现中，强烈建议代理类与集成中的源类及目标类共享相同的接口，以保持方法名和属性具有相似的签名，便于系统或层之间的集成。因此，客户端应用程序不需要了解现有存储库的实现，因为对资源的访问并非直接发生，而是实际上使用了代理层作为中间介。代理将管理权限、安全过滤器和其他业务需求。\n\
  \n实现的下一步是创建 `IContentRepository` 接口，该接口将由存储库类和代理类共享，其实现如图 12.6 所示：\n\n![](img/Figure_12.6.png)\n\
  \n图 12.6：内容存储库接口\n\n为了演示，`IContentRepository` 接口仅包含一个方法。`ContentRepository` 和 `Proxy`\
  \ 类需要根据需求实现自己的 `GetContent` 方法。\n\n创建接口后，下一步是创建 `ContentRepository` 类，其实现方式如图 12.7\
  \ 所示：\n\n![](img/Figure_12.7.png)\n\n图 12.7：内容存储库类\n\n如图 12.7 所示，`GetContent` 方法模拟了数据库访问，并返回包含三个不同元素的内容列表，其信息如下：\n\
  \n*   属于体育（Sport）分类的内容，包含三个广告\n*   属于教育（Education）分类的内容，包含三个广告\n*   属于生活方式（Lifestyle）分类的内容，包含三个广告\n\
  \n给定的内容足以模拟本节开始为三个不同平台（移动端、桌面端和网页端）定义的所有需求。代理模式实现的最后一步是创建一个负责拦截客户端应用程序请求的类。根据需求，应用所有的安全、身份验证和数据过滤策略。\n\
  \n代理模式的目的是提供一个中间层，用于管理任何需要在安全、策略和过滤器方面实现、但不属于原始应用程序本身的内容。在本节给场景范围内，请求来自安装在不同类型设备上的应用程序。已创建一个代理类来接收请求并应用与每个平台相关的需求，避免了直接在存储库中实现规则的需求。\n\
  \n遵循代理模式实现所述的良好实践，代理类必须实现与原始类相同的接口。考虑到给定的场景，这意味着代理类应该实现 `IContentRepository` 接口。`ContentRepositoryProxy`\
  \ 类需要实现为每种设备类型和新闻分类定义的所有自定义需求。此外，`ContentRepositoryProxy` 类可能包含身份验证、安全策略以及任何超出原始源类或应用程序提供功能的自定义实现。这意味着\
  \ `ContentRepositoryProxy` 类仅包含与内容过滤相关的逻辑。\n\n设计模式通常与软件开发中的其他实践（如 SOLID 原则）密切相关。它们代表了许多编写高标准代码和为复杂问题提供高效解决方案的实践。因此，设计模式也遵循面向对象编程范式的最佳实践。\n\
  \n`ContentRepositoryProxy` 类的实现呈现于图 12.8：\n\n![](img/Figure_12.8.png)\n\n图 12.8：代理类实现\n\
  \n为了便于说明，创建了 `DeviceType` 枚举以显式处理这三个平台（桌面端、移动端和网页端）的设备类型。类构造函数接收一个设备类型作为参数，`GetContent`\
  \ 方法有一个处理每个设备类型不同规则的语句。\n\n从原始存储库获取数据后，代理类对移动设备类型的信息进行过滤，移除所有广告。在请求来自网页平台的情况下，代理类会过滤掉任何生活方式分类的内容。\n\
  \n如示例所示，客户端应用程序并不直接从存储库访问内容，而是使用 `ContentRepositoryProxy` 类，其中规则按照业务需求已在代码中实现。\n\
  \n要查看代理类的实现结果，你可以在控制台应用程序中调用代理类并传递不同的参数，如图 12.9 所示：\n\n![](img/Figure_12.9.png)\n\
  \n图 12.9：控制台应用程序\n\n\n\n\n在这个简单的程序中，`Proxy` 类被实例化了三次，每个设备类型对应一个。控制台显示了由 `proxy`\
  \ 类返回的内容数量信息，然后检查每种类型的内容是否关联了广告。考虑到给定场景中的需求，移动平台将接收所有类别的内容，但不会接收广告。另一方面，网络平台应该接收除生活方式类别之外的所有类别的广告。如果你运行\
  \ `Console` 应用程序，将得到如图 12.10 所示的结果：\n\n![](img/Figure_12.10.png)\n\n图 12.10：代理模式结果\n\
  \n`Proxy` 类的工作符合预期，并说明了内容存储库类不受业务需求中任何额外需求的影响。此外，需求中的任何更改都只会在 `ContentRepositoryProxy`\
  \ 类中实现，从而保护原始内容存储库类不受外部干扰。\n\n# Blazor 使用 GRPC\n\n`GRPC` 是由 Google 开发的开源协议，允许我们在使用远程过程调用（Remote\
  \ Procedure Call）框架时利用高性能，并通过 `protobuf` 约建立服务器与客户端之间的通信。考虑到这是一个开源协议，包括 `.NET` 和\
  \ `C#` 在内的许多技术都实现了它。\n\n在 `.NET` 项目（如 `Blazor WebAssembly`）中使用 `GRPC`，可以作为单页应用程序（SPA）开发简单性与高性能协议的极佳替代方案，用于在\
  \ `Blazor WebAssembly` 应用程序与后端服务之间接收和发送数据。\n\n通常情况下，大多数端端应用程序之间的集成是通过 `REST APIs`\
  \ 实现的。取决于用于集成的技术，实现另一种协议（如 `GRPC`）可能具有挑战性。\n\n`Proxy` 模式可以用于封装 Blazor 应用实现的复杂性以及对\
  \ `GRPC` 服务的调用。在编码方面，服务的消耗与传统的 `REST APIs` 类似。\n\n为了演示和验证 `GRPC` 如何工作，请使用 Visual\
  \ Studio 中的默认模板创建一个 `GRPC` 服务，如图 12.11 所示：\n\n![](img/Figure_12.11.png)\n\n图 12.11：GRPC\
  \ 项目模板\n\n创建完成后，项目应包含三个主要文件夹（`Properties`、`Protos` 和 `Services`），如图 12.12 所示：\n\n\
  ![](img/Figure_12.12.png)\n\n图 12.12：GRPC 项目结构\n\n`Services` 包含 `GRPC` 服务的实际端点，其服务结构与通用\
  \ `ASP.NET Core` 项目的 `Controller` 非常相似，如图 12.13 所示：\n\n![](img/Figure_12.13.png)\n\
  \n图 12.13：GRPC 服务代码\n\n位于 Visual Studio `GRPC` 项目默认模板中的 `SayHello` 方法接收一个具有 `name`\
  \ 属性的 `HelloRequest` 对象。该方法的返回值是一个 `HelloReply` 对象，它返回一个结合了 `Hello` 单词与请求中传递的名称的消息。\n\
  \n要使用 `Blazor WebAssembly` 应用程序消费 `GRPC` 服务，你可以使用 Visual Studio 创建默认模板并安装图 12.14\
  \ 所示的包：\n\n![](img/Figure_12.14.png)\n\n图 12.14：GRPC 的 Nuget 包\n\n`GRPC` 通信旨在客户端和服务器之间关于请求和响应有一个标准协议，包括双方共享相同的数据模型。为了方便使用相同的模式，有必要在客户端应用程序也包含\
  \ `.proto` 文件，这可以在应用程序的文件夹中完成，如图 12.15 所示：\n\n![](img/Figure_12.15.png)\n\n图 12.15：客户端应用程序中的\
  \ Proto 文件\n\n需要强调的是，在客户端应用程序中放置 `.proto` 文件时，即使文件的其余内容与服务器应用程序使用的相同，你也必须针对应用程序正确的命名空间。因此，从服务器应用程序将\
  \ `.proto` 文件复制到客户端后，请确保更新 `cshar_namespace` 属性为具有项目名称的正确值，如图 12.16 所示：\n\n![](img/Figure_12.16.png)\n\
  \n图 12.16：proto 文件的命名空间配置\n\n之后，在你的 `.csproj` 文件中包含 `.proto` 文件的引用，如图 12.17 所示：\n\
  \n![](img/Figure_12.17.png)\n\n图 12.17：Proto 文件引用\n\n一旦完成了所有 `.proto` 文件和包的配置，就可以开始使用项目自动创建的代理类来封装客户端和服务器之间的通信。为了测试通信，你可以调整\
  \ `Index.razor` 组件以调用 `Greeter` 服务，如图 12.18 所示：\n\n![](img/Figure_12.18.png)\n\n\
  图 12.18：Grpc 客户端\n\n## 结论\n\n正如你在本章中所学到的，`Proxy` 模式允许我们为需要使用不同协议在两个或多个组件之间建立通信并在它们之间应用策略的场景实现简单的解决方案。通过本章，你有机会学习如何使用\
  \ `C#` 语言在真实场景中实现 `Proxy` 模式，并学习了如何使用 `Blazor`、`GRPC` 和`面向对象编程`范式应用该模式。\n\n在下一章中，你将通过学习\
  \ `Command` 模式并应用在前章节获得的所有通用知识，继续使用 `C#` 语言和 `.NET` 平台开启设计模式之旅。\n\n## 要点\n\n- `Proxy`\
  \ 模式帮助我们拦截对源应用程序功能的访问，应用业务需求而不影响实现本身。\n- 单个解决方案可以将 `Proxy` 模式与 `SOLID` 原则相结合。\n\
  - 在由于安全原因必须限制对某些功能的访问的任何情况下都可以应用 `Proxy` 模式。\n\n## 单选题\n\n1. 代理模式适用于哪种场景？\n   A.\
  \ 系统之间的集成\n   B. 不考虑安全性的场景\n   C. 任何使用 `C#` 作为语言的项目\n   D. 以上都不是\n\n2. 观察本章给出的示例，哪个类包含了\
  \ `Proxy` 模式所需的实现？\n   A. 内容存储库类\n   B. 客户端应用程序\n   C. `ContentRepositoryProxy`\
  \ 类\n   D. 新闻类\n\n## 答案\n\n| 1 | A |\n| 2 | C |\n\n## 问题\n\n1. 解释代理模式的主要目的。\n\n\n\
  \n\n2. 根据你在本章中学到的知识，创建一个假设的场景，在该章给出的示例之外，该场景可以使用代理模式。\n\n3. 解释可以使用代理模式的场景类型。\n\n\
  4. 你目前是否有任何正在实现代理模式的项目？\n\n## 关键术语\n\n* `Client application`（客户端应用程序）：系统中通常包含用户界面且在抽象层上较高的层。\n\
  * `System integration`（系统集成）：使用定义协议在两个或多个组件之间的通信。\n* `API`：应用程序接口，通常用于允许不同系统之间的集成。\n\
  * `Cache`（缓存）：在软件开发中，指将数据存储在性能优于原始源的地方。\n\n## 加入我们书籍的 Discord 空间\n\n加入书籍 Discord\
