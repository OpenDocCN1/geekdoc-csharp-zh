  \n![](img/fm1.png)\n\n# 第 8 章：使用 ASP.NET Razor 的原型模式\n## 引言\n\n软件开发中的许多情况需要重复创建复杂对象的新实例，这可能会导致性能问题，并在计算资源使用（包括内存消耗和\
  \ CPU）方面带来额外挑战，限制了现代应用程序的可扩展性。原型模式允许我们创建复杂且昂贵的对象的副本，主要用于 .NET 应用程序和 C# 库。\n\n学习原型模式让你有机会理解该模式在哪些场景下大有用场，并让你具备足够的知识在基于\
  \ C# 语言的遗留项目中识别出该模式。\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   原型模式概念\n*   Razor Pages 项目类型的详细说明\n\
  \n## 目标\n\n在学习本单元后，你应该理解原型模式可以应用于哪些场景，识别遗留项目和第三方库中原型模式的使用，并在实际项目中应用原型模式。\n## 原型模式定义\n\
  \n原型模式主要允许高效复制复杂对象，从而在创建需要大量计算工作才能生成的新对象实例时节省资源。通过原型模式的使用，一旦发生了高成本过程（理想情况下只发生一次），复杂对象创建的整个困难部分本质上就对消费者隐藏了；任何相同对象的其他额外实例都是通过一种允许创建对象结构模板完整副本的方法来制作，仅修改特定属性以生成正确的状态。因此，在对象第一次创建时，会生成一个新实例的模型，保持大多数属性的正确初始状态，并为任何新实例的特定属性保留专门的状态。\n\
  \n原型模式是创建型模式的一部分，因为它有助于对象的生成；在特定场景下，它与其他创建型模式（如抽象工厂和构建器）结合使用，为这些其他模式提供卓越的性能。\n任何工厂模式都有责任简化复杂结构的创建以证明其正合理性，但原型模式比其他模式要直接得多，因为它不需要为了一套复杂的类集合就能正常工作，而且原型模式不需要使用继承和多个接口来实现其目的。然而，创建第一个作为其他对象模板的复杂对象背后的复杂性需要额外的实现逻辑。每种场景都会对哪种方法更好进行自定义分析，始终从简单性、维护性、扩展性和其他开发成本的角度考虑。\n\
  \n在使用面向对象编程范式开发的软件中，有时不允许复制对象的特定属性，因为它们被标记为私有（private）修饰，或者它们可能需要额外的逻辑来正确填充。在这种情况下，原型模式是一个极佳的选择，因为它便于对象所有属性的复制，并保持这些属性所需的状态。这种方法主要使用包和库来管理复杂结构的复制，例如大型\
  \ XML 对象和 ORM 数据库上下文等许多场景。\n\n在对原型模式的理论概念和目的进行简要解释后，下一节将通过实际示例展示如何在真实场景中应用它，并将让你看到如何原生地应用于使用\
  \ C# 语言的不同 .NET 项目。\n## 原型模式实现\n\n考虑到原型模式与对象复制策略密切相关，在开始实际示例中使用原型模式之前，你必须理解 C# 语言中浅拷贝和深拷贝的区别，这将帮助你在软件架构方面做出正确的决定，并防止意外的软件行为（特别是在生产环境中）。\n\
  \n通常，在需要将一个复制到另一个的情况下，如果软件中的某个例程更改了复制的对象实例之一，所有其他副本的状态方面都会受到影响，它们的属性会同时改变。尽管它们显然是不同的实例，但它们在内存中共享相同的引用并在物理上存储在同一个位置。这种共享内存地址的复制类型在\
  \ C# 语言中通常被称为浅拷贝（Shallow Copy），可以使用赋值运算符来实现。\n为了检查浅拷贝在实践中如何工作，请使用 Visual Studio\
  \ 2022 创建一个新的 ASP.NET Core Web App，选择图 8.1 中突出显示的模板：\n\n![](img/Figure_8.1.png)\n\
  图 8.1：Razor Pages\n\n\n![](img/Figure_8.2.png)\n图 8.2：Razor Pages 结构\n\n项目生成后，在项目中创建一个名为\
  \ `Customer` 的类，它将用于演示浅拷贝。该类的结构可以参考图 8.3 中的示例：\n![](img/Figure_8.3.png)\n图 8.3：Customer\
  \ 类\n\nRazor 项目使用模型（Models）的概念在应用程序前端渲染信息。为了测试 C# 语言中的浅拷贝功能，请修改项目的 `Index.cshtml.cs`\
  \ 文件，包含一个与 `Customer` 列表相关的属性，并更改 `OnGet` 方法体以创建两个 `Customer` 对象，其中第二个是第一个对象的副本，如图\
  \ 8.4 所示：\n\n图 8.4：Index Razor 页的后端代码\n\n\n\n\n如你在第 19 行所示，`customer2` 变量是 `customer1`\
  \ 变量的副本，第 21 行将 `Name` 属性更改为“Customer 2”。之后，这两个对象被包含在 `Customers` 列表中。为了查看这两个对象的状态结果，请对\
  \ `Index.cshtml` 文件进行必要的修改，以遍历 `Customers` 列表并显示 name 属性，如图图 8.5 所示：\n\n![](img/Figure_8.5.png)\n\
  \n图 8.5：Index Razor 页面\n考虑到第二个客户对象是通过等号运算符从第一个实例创建的副本，因此在任何实例中进行的任何更改都会自动反映到其他实例中。如果我们运行应用程序（即\
  \ Razor 页面），在 `Index` 页面渲染后可能会发现两个客户具有相同的名称，如图 8.6 所示：\n\n![](img/Figure_8.6.png)\n\
  \n图 8.6：浅拷贝结果\n两个对象在内存中共享相同的地址；因此，从程序角度来说，它们是不同的对象。这种行为可能会给不熟悉 C# 语言的开发者带来一些问题，而且如果不使用复制对象的正确方法，在任何类型的项目中很容易引入\
  \ Bug。\n\n此外，另一种创建浅拷贝的方法是实现实现 `ICloneable` 接口。该接口强制实现 `Clone` 方法，并可以使用名为 `MemberwiseClone`\
  \ 的原生方法来应用浅拷贝。`clone` 方法为引用类型属性在内存中保持相同的引用。要测试这种行为，你可以实现图图 8.7 所示的代码，该代码更改了 `Customer`\
  \ 类：\n\n![](img/Figure_8.7.png)\n图 8.7：MemberwiseClone 方法\n\n注意，`Customer` 类实现了在其签名中指定的\
  \ `ICloneable` 接口。指定了一个 `Address` 类来将 `Customer` 类的底层属性更改为非基本数据类型，这将有助于测试非基本数据类型浅拷贝的行为。\n\
  \n通过实现 `ICloneable` 接口，可以在 `Index` Razor 页面后端的 `OnGet` 方法中使用 `Clone` 方法，如图图 8.8\
  \ 所示：\n![](img/Figure_8.8.png)\n\n图 8.8：Clone 方法\n\n在这种情况下，`Address` 属性不是 C# 语言中的基本类型。当使用标准的\
  \ `Clone` 方法创建副本时，所有属性都可以在副本中正常更改。尽管如此，`customer1` 对象的副本中的 `Address` 属性与源对象共享相同的内存位置。\n\
  作为本章解释的浅拷贝选项的替代方案，C# 语言允许我们使用深拷贝（Deep Copy）的概念，它包括创建对象的实际独立副本，这些副本不共享内存中的示例引用，并且参与复制的任何对象中的任何更改都不会影响其他实例。在软件开发的大多数情况下，这是对象复制的预期行为。然而，为了避免复杂对象深拷贝中的性能问题，理解并学习如何正确创建深拷贝。在更改了上一个示例的\
  \ `Clone` 方法后，需要将源对象序列化到内存流对象中，并且方法的返回值必须是相同对象的反序列化，如图图 8.9 所示：\n\n![](img/Figure_8.9.png)\n\
  图 8.9：深拷贝\n\n此新版本的 `Clone` 方法保证为副本在内存中创建一个新的引用。因此，对源对象进行的任何更改都不会影响任何副本，因为它们之间是完全独立的。图图\
  \ 8.9 中的代码了如何在不需要逐个指定对象属性的情况下创建对象的深拷贝。\n\n考虑到你已经学习了 C# 语言中深拷贝和浅拷贝的区别，现在是时候通过实际示例来熟悉原型模式（prototype\
  \ pattern）了。为此，想象一个假设场景：你正在参与一个流媒体平台相关的项目，该平台为客户提供了订阅计划的机会。每个计划都有其规范，它们在技术上代表 C#\
  \ 语言中的一个复杂类，必须在运行时根据业务需求对实例进行填充。如果提供流媒体服务的公司决定升级特定计划的策略，则只需要更改计划的版本和价格，而其他属性保持不变。\n\
  在这种背景下，创建一个上一个版本计划的副本并仅更改副本中的相关属性将是一个优势。这将允许我们高效使用应用程序服务器中的内存，并可能提高用户的性能，特别是当该副本在计算资源方面代表某项复杂操作时。每种设计模式都有解决软件开发中特定问题的目的，并且在实际场景中应用某些模式总有其理由。在本章给出的场景背景下，需求明确指出流媒体服务中需要升级的客户计划仍然相同，除了版本号和价格。取决于应用程序中创建新计划的复杂性，原型模式是非常适的，因为其目的是创建对象的高效副本。\n\
  \n给定的场景必须有两个代表客户计划的类，如图图 8.10 所示：\n\n![](img/Figure_8.10.png)\n图 8.10：CustomerPlan\
  \ 类\n\n如图 8.10 所示，`CustomerPlan` 类包含有关公司政策、法规和额外信息的属性。根据要求，这些关于政策和法规的属性对于所有客户计划具有相同的值，但价格和版本之间可以不同。考虑到本章对浅拷贝的解释，如果开发者没有在应用程序中正确实现复制，由于对\
  \ C# 语言中引用类型复制缺乏了解，可能会导致实现场景需求的问题，导致多个客户计划实例被错误更新，如你在图 8.11 所示：\n\n![](img/Figure_8.11.png)\n\
  图 8.11：第二个浅拷贝示例\n\n图图 8.11 中的代码创建了两个不同的 `CustomerPlan` 类实例，并为名称、价格和版本属性分配了不同的值。这段代码的问题是什么？考虑到要求只对公司政策和法规属性保持相同的值，程序使用等号运算符复制第一个计划以创建第二个客户计划。完成后，其余代码更改了本应适用于第二个计划的值（名称、价格和版本），但如你在调试模式对第一个对象的详细信息所示，你可以发现第一个客户计划的状态与第二个计划相同。\n\
  \n\n\n在这种情况下，两个客户计划具有相同的名称、价格和版本，因为这两个对象共享相同的内存引用。其结果显然不符合业务需求。为了解决这个问题，在保持例程具有优秀性能的同时，可以应用本章之前所示的深拷贝（Deep\
  \ Copy）方法来实现原型模式。此外还有使用 `ICloneable` 接口的选择；然而，在本章中，将实现一种更显式的深拷贝方法，以便在代码中清晰地实现需求，如图图\
  \ 8.12 所示：\n\n![](img/Figure_8.12.png)\n\n\n`CustomerPlan`类的属性保持不变，但一个名为 `DeepCopy`\
  \ 的新方法现在是类结构的一部分，这允许我们创建对象的实际副本而不共享相同的内存地址。考虑到 `DeepCopy` 方法使用了序列化，所有参与拷贝的类都必须标记有正确的\
  \ `Serializable` 属性，如图 8.13 所示：\n\n![](img/Figure_8.13.png)\n\n\n经过这些修改，类现在已完全准备好使用，不会出现任何序列化的运行时异常。考虑到\
  \ `OnGet` 方法中之前的代码示例，有必要更改第二个客户计划的创建，现在必须使用新创建的 `DeepCopy` 方法。你只需要更改与创建第二个客户计划实例相关的行。在这种情况下，系统不再在内存中保留相同的引用，对其中一个计划所的任何更改都不会影响其他潜在的副本。在代码中进行所需的更改后，符合要求的最终版本如图图\
  \ 8.14 所示：\n\n![](img/Figure_8.14.png)\n\n\n如你在第 25 行所示，客户计划的第二个实例是作为第一个实例的副本创建的，但它使用的是深拷贝方法，这保证了两个对象不会共享相同的内存地址，并且可以独立地在两个对象中进行更改。在需要创建多个对象的复杂场景下，一旦复杂对象的副本比从头创建新实例成本低得多，性能上的提升将要显著得多。\n\
  \n原型模式允许我们创建对象的副本，通过复制另一个对象的属性作为模板来应用更好的方法。在内存资源可能被过度使用的生产环境中，理解风险至关重要，这意味着代码中的任何性能改进（例如原型模式的使用）都是非常受欢迎的。\n\
  \n\n正如你在本章中所学到的，原型模式在需要创建多个具有相似状态但某些属性具有不同值的特定对象实例的所有场景中都很有帮助。原型模式广泛用于 .NET 应用程序，它代表了更有效地管理应用程序内存的一种重要方法，并在性能方面为用户提供良好的体验。\n\
  \n通过本章，你学习了如何使用 C# 语言在真实场景中实现原型模式，并能够理解在何种情况下可以使用该模式。此外，你还学习了浅拷贝和深拷贝的区别，并理解了在何种场景下更推荐使用每一种。\n\
  \n\n## 记忆点](#contents.xhtml_sc2_137a)\n\n*   原型模式允许我们高效地创建对象副本，节省内存资源，并在需要创建多个相似对象的复杂操作中提高软件性能。\n\
  *   浅拷贝在内存中为所有相关对象实例保留相同的引用。\n\n## 选择题](#contents.xhtml_sc2_138a)\n\n1. 在 C# 语言中使用哪种接口可以强制实现\
  \ clone 方法？\n\n    2. `Interface`\n    3. `ICopy`\n    4. `ICloneable`\n\n2. 使用哪种方法可以在\
  \ C# 语言中原生实现浅拷贝行为？\n    1. `MemberwiseClone`\n    2. `ObjectClone`\n    3. `Copy`\n\
  \    4. `Clone`\n\n\n| 1 | D |\n| 2 | A |\n\n## question](#contents.xhtml_sc2_140a)\n\
  1. 解释原型模式的主要目的。\n2. 为什么使用原型模式很重要？\n3. 根据你在本章中所学到的，创建一个除本章给出的示例之外可以使用原型模式的假设性场景。\n\
  4. C# 语言中浅拷贝和深拷贝之间有什么区别？\n\n\n*   **浅拷贝 (Shallow copy)**：在 C# 语言中，浅拷贝过程在内存中为使用拷贝方法创建的所有对象保持相同的地址引用。因此，一个对象的更改会影响所有其他副本。\n\
  *   **深拷贝 (Deep copy)**：在 C# 语言中，深拷贝表示从另一个对象创建对象，在内存中保持不同且独立的引用，对象在状态更改上互不影响。\n\n\
  # 第 9 章 使用 C# 11 新特性的工厂方法模式](#contents.xhtml_ch09a)\n## 引言](#contents.xhtml_sc2_142a)\n\
  \n在软件开发中正确使用设计模式对于保持架构的可扩展性至关重要，同时仍应用简单性以在良好实践、可维护性和活性方面达到高标准。\n\n考虑到大量的设计模式，每个模式实现的概念听起来都很熟悉。在某些情况下，快速查看它们可能会导致无法观察到细节并理解它们之间的区别。这可能发生在第\
  \ 7 章中解释的抽象工厂模式、本书的 Blazor 抽象工厂模式以及工厂方法模式之间。\n## 结构](#contents.xhtml_sc2_143a)\n\
  \n在本章中，我们将讨论以下主题：\n\n*   工厂方法概念\n*   C# 11 引入的新特性代码示例\n\n## 目标](#contents.xhtml_sc2_144a)\n\
  \n学习本章后，你将理解真实场景下的原型模式，并能够识别旧项目对该模式的使用。\n\n\n工厂方法模式（Factory Method pattern）是抽象工厂模式（Abstract\
  \ Factory pattern）的一种更简单的替代方案。当不需要在层次结构的最高层（作为客户端服务或类）生成许多子类或与主对象相关的多个额外类族时，我们可以允许使用工厂的概念来创建复杂对象。\n\
  \n本书的第 7 章《使用 Blazor 的抽象工厂模式》中示例的抽象工厂模式包含一个创建其他工厂的主工厂，这比工厂方法模式复杂得多。因此，仅在软件架构成比例地复杂时才建议使用抽象工厂。可以说，工厂方法模式在目的上的定义与之相似，但区别在于：该模式负责为对象创建一个工厂，而抽象工厂模式则负责在多个层级上创建“工厂的工厂”。\n\
  工厂方法定义了一个负责创建复杂对象的基类，但将创建应用程序将使用的对象新实例的责任委托给子类。例如，想象一个应用程序需要为在线商店注册产品和服务的场景。如果产品类型在实现销售程序开始时就已经确定，且这些对象通常不属于具有多个子类型的同一项目类族，则可能建议使用工厂方法。此外，复杂对象实例的创建过程不应涉及级联工厂或其成员实现中的任何异常情况。\n\
  \n可以说，这种模式允许我们创建复杂对象，并将创建对象的复杂性封装在主要消费这些对象的软件之外。总而言之，当系统需要创建在属性状态方面不包含复杂要求的对象时，工厂方法是一个很好的替代方案，因为它从消费对象的具体类中隐藏了工厂的实现和逻辑，允许我们随着时间的推插入新类型的对象而不破坏一致性。\n\
  ## 工厂方法的实现\n\n由于工厂方法模式是抽象工厂模式的一种更简单的替代方案，因此在实现具有与之前第 7 章《使用 Blazor 的抽象工厂模式》中解释的相似需求的项目时，重构架构以符合该模式至关重要。因此，在本节中，你将有机会实现一个场景的基础结构。该场景涉及一家向客户销售手机套餐的公司，每个套餐在短信、移动数据和其他服务方面有不同的配置，但与第\
  \ 7 章《使用 Blazor 的抽象工厂模式》中提供的场景相比，在需求上只有细微差别：\n\n*   该公司为客户提供两种类型的套餐：预付和后付费。\n* \
  \  预付套餐有短信限制，每月最多 2,000 条短信。\n*   后付费选项有短信限制，每月最多 5,000 条短信。\n*   预付套餐的最大连接速度为每秒\
  \ 50 兆字节。\n*   后付费套餐的最大连接速度为每秒 100 兆字节。\n\n\n| 手机套餐 | 短信限制 | 连接速度 |\n| --- | ---\
  \ | --- |\n| 预付 | 2,000 条/月 | 50 兆字节/秒 |\n| 后付费 | 5,000 条/月 | 100 兆字节/秒 |\n表 9.1：手机套餐\n\
  \n鉴于该场景，使用工厂方法模式允许我们从客户端应用程序的最高层抽象其实现来构建底层对象，如图 9.1 中的图表所示：\n\n![](img/Figure_9.1.png)\n\
  图 9.1：工厂方法图\n\n如你在图 9.1 中所示，工厂方法模式的结构比抽象工厂模式简单得多，因为创建子工厂并不是强制性的。一旦在本节中确定了需求并用正确的关联定义了模型结构，我们就可以开始实现过程。第一步是创建单独的类和接口。本章的示例，使用设计为\
  \ .NET 控制台应用程序的客户端应用程序。对于此应用程序，不存在与数据库的交互，以便专注于工厂方法模式的 C# 实现。\n\n按照图 9.1 中的规范，我们必须创建第一个类和接口来表示基工厂和相关类。我们可以从创建\
  \ `TextMessage` 类开始（包括底层接口），其范围限制在图 9.2 所示的表示中：\n![](img/Figure_9.2.png)\n\n图 9.2：ITextMessage\
  \ 接口\n\n该接口包含两个属性，旨在识别场景中其他类消费对象时的差异。为了开始工厂方法本身的编码过程，必须在最开始创建相关接口。这对于保持项目良好的可测试性和扩展性是一个良好的做法。\n\
  下一步是创建实现 `ITextMessage` 接口的具体类，如图 9.3 所示：\n\n![](img/Figure_9.3.png)\n\n图 9.3：TextMessage\
  \ 类\n`TextMessage`类的实现并不包含任何关于场景中业务需求的规范，例如 `Name` 属性的特定值或方案允许的短信数量。需求的完整实现反而应该是工厂类的职责，它将抽象短信创建背后的逻辑。\n\
  \n`MobilePlan` 在给定场景中必须包含关于 `Texts`、`InternetConnection` 和 `MobileDataPlan` 的信息，如本节开始的需求列表所示。考虑到短信的基础已经创建，下一步是创建\
  \ `InternetConnection` 类，包括相关的接口。连接速度结构需要一个接口（`IConnectionSpeed`），该接口包含了与未来具体类相关的属性，如图\
  \ 9.4 所示：\n\n![](img/Figure_9.4.png)\n图 9.4：IConnectionSpeed 接口\n\n\n\n\n图 9.4 所示的接口仅包含两个属性（名称和速度），旨在识别实现类在使用这些对象时对象之间的差异。下一步是创建实现\
  \ `IConnectionSpeed` 接口的 `ConnectionSpeed` 具体类，如图 9.5 所示：\n\n![](img/Figure_9.5.png)\n\
  \n图 9.5：`ConnectionSpeed` 类\n在需求中，有两种类型的连接速度（高和低）。因此，工厂类将负责根据需求为每个移动方案相应地为连接速度和其他特征填充所有属性。如果使用抽象工厂模式，由于需要为不同的子类型创建具体类，这种方法就代表了一项重大决策。每种方法都有优缺点。最佳决策必须考虑项目的需求。\n\
  \n此时，移动方案类的复合属性已经创建完成，下一步是创建移动方案结构，这涉及到指定一个名为 `IMobilePlan` 的通用接口，该接口将为两种已移动方案类型（后付费和预付费）实现，如图\
  \ 9.6 所示：\n\n![](img/Figure_9.6.png)\n图 9.6：`IMobilePlan` 接口\n\n正如关于连接速度和短信类所说的，所有实现\
  \ `IMobilePlan` 接口的类都不负责为相应的属性指定任何值，因为这应该由未来的工厂类完成。考虑到需求包含两种不同的移动方案，有为每个类型创建一个具体类，并在\
  \ `PostPaidMobilePlan` 类中实现 `IMobilePlan` 接口，如图 9.7 所示：\n\n![](img/Figure_9.7.png)\n\
  图 9.7：`PostPaidMobilePlan` 类\n\n每个移动方案都有了自己的底层类，从现在开始，就可以为每个类指定在必要时使用的额外自定义方法。通过这种方法，尽管有一个工厂来创建每个类型，但每个类之间仍然不相互依赖。这通常符合良好的面向对象编程实践。\n\
  \n下一步是为预付费移动方案创建 `PrePaidMobilePlan` 类，这通过图 9.8 中演示的代码实现：\n![](img/Figure_9.8.png)\n\
  \n图 9.8：`PrePaidMobilePlan` 类\n\n如你在图 9.8 中所所示，预付费移动方案类包含一个名为 `PrePaidIntegration`\
  \ 的方法，该方法是该类特有的。这是特定场景中使用工厂方法而不是抽象工厂模式的优势，因为可以更有效地对每个类进行专门化。然而，当前模式仍然需要创建工厂（每个移动方案类型一个），以实现从消费者应用程序中封装对象创建的目的。在这种情况下，你需要创建一个供所有工厂共享的基工厂类，如图\
  \ 9.9 所示：\n![](img/Figure_9.9.png)\n\n图 9.9：`BaseMobilePlanFactory` 类\n\n遵循工厂方法所述的最佳实践，基工厂类必须使用\
  \ `abstract` 修饰符，并且 `GetMobilePlan` 方法必须引用负责创建移动方案实例的方法。你可能会在遗留项目或外部库中使用相同的模式。这一特征表明了将实例的创建委托给工厂子类的意图，这正是该模式与抽象工厂模式的主要区别。\n\
  一旦创建了基工厂，就可以创建各个工厂了。各个工厂将继承自基类，并为各个类型执行所有必要的自定义操作，如图 9.10 中所示的代码所示：\n\n![](img/Figure_9.10.png)\n\
  \n图 9.10：`PrepaidMobilePlanFactory` 类\n`PrePaidMobilePlanFactory` 类继承自基工厂抽象类，并重写负责创建移动方案的方法，根据需求为连接速度和短信属性指定自定义值。此外，该方法调用了\
  \ `PrePaidIntegration` 方法来运行与实例创建相关的自定义操作。为了演示目的，集成方法没有任何实现，但真实场景可能需要与每个工厂相关的额外操作。\n\
  \n最后，按照需求，下一步是为后付费移动方案创建底层工厂类（`PostPaidMobilePlanFactory`），遵循与之前代码相同的模式，如图 9.11\
  \ 所示：\n![](img/Figure_9.11.png)\n\n图 9.11：`PostpaidMobilePlanFactory` 类\n\n通过此类，工厂方法模式得到了完全实现，遵循了本节开头指定的所有业务需求。最后需要做的是在客户端应用程序测试工厂类并检查结果。在控制台应用程序中，你可以创建每个工厂类的实例并验证输出结果，如图\
  \ 9.12 所示：\n![](img/Figure_9.12.png)\n\n图 9.12：工厂类实例\n\n通过使用各个工厂类提供的 `GetMobilePlan`\
  \ 方法获取移动实例，从而从客户端应用程序中隐藏实现的所有方面，实现了工厂方法的主要目的。作为客户端应用程序的最后一步，在控制台中打印每个方案的属性，如图 9.13\
  \ 所示：\n![](img/Figure_9.13.png)\n\n图 9.13：工厂方法输出\n\n假设你使用给定的实现运行应用程序。在这种情况下，控制台显示了预付费和后付费移动方案之间的差异，证明了实现按预期工作，并将实现的复杂性保留在工厂类中而不是消费者应用程序中，如图\
  \ 9.14 所示：\n![](img/Figure_9.14.png)\n\n图 9.14：工厂方法结果\n\n正如本章所示，工厂方法模式的实现比抽象工厂模式需要的努力更少，可以将简单性与极佳的架构相结合，这种架构允许我们在抽象类中封装重大操作的完整实现，避免真实场景中的访问违规和意外行为。\n\
  \n\n\n当创建任何对象的新实例时，通常需要在类的构造函数中包含对必填字段的验证。在之前的 `C#` 语言版本中，这一过程的实现变得相当棘手，因为它需要通过抽象类以及任何其他子类通过继承来完成。\n\
  \n`C# 11` 版本引入了用于属性的 `required` 修饰符，它可以用于在创建对象新实例时强制要求特定字段进行赋值。这一新特性适用于类、结构（structs）和\
  \ record 类型。\n\n如你在 图 9.15 中所示，`Customer` 模型中的 `DocumentNumber` 属性被标记为 `required`：\n\
  ![](img/Figure_9.15.png)\n\n图 9.15：Required 修饰符\n\n当字段被标记为 `required` 时，任何创建底层对象实例的尝试都会导致编译器错误，如\
  \ 图 9.16 所示：\n![](img/Figure_9.16.png)\n\n图 9.16：编译器错误\n\n为了解决这个问题，必须修改 `Customer`\
  \ 类的构造函数，使其接收文档号作为输入，并使用 `SetsRequiredMembers` 特性初始化相应的属性，如 图 9.17 所示：\n![](img/Figure_9.17.png)\n\
  \n图 9.17：Customer 构造函数\n\n在修改 `Customer` 构造方法后，你可以在构造函数中传递底层文档值，这将解决编译器问题，如 图 9.18\
  \ 所示：\n![](img/Figure_9.18.png)\n\n图 9.18：Customer 初始化\n\n`required` 修饰符可以用于同一类、结构（struct）或\
  \ record 中的多个字段，这对于避免在代码中过度使用条件语句，或为了在 `C#` 语言中使用反射来实现类似的目标非常有帮助。\n### UTF-8 字符串字面量\n\
  \n`C# 11` 引入了在字符串上使用 `u8` 后缀的可能性，用以确定该字符串应使用 `UTF-8` 编码。当应用程序中的多个例程需要此类编码作为特定协议的一部分时，这非常有帮助。你可以指定该后缀，如\
  \ 图 9.19 所示：\n\n![](img/Figure_9.19.png)\n图 9.19：UTF-8 后缀\n\n必须强调的是`.NET` 中的字符串使用的是\
  \ `UTF-16` 编码。`UTF-8` 字符串字面量不能作为可选参数的默认值，因为它们是运行时常量。\n\n### 字符串插值中的换行符\n除了可以将字符串转换为\
  \ `UTF-8` 之外，`C# 11` 还引入了处理字符串插值换行符的方法。使用新语法，可以在字符串插值内部指定 `switch` 情况和其他命令，如 图 9.20\
  \ 所示：\n\n![](img/Figure_9.20.png)\n\n图 9.20：字符串插值中的换行符\n这一新特性提高了涉及模式匹配的表达式的可读性，并减少了字符串插值所需的行数。\n\
  \n### 列表模式\n\n从 `C# 11` 开始，可以使用一组模式来匹配和比较列表，如 图 9.21 所示：\n![](img/Figure_9.21.png)\n\
