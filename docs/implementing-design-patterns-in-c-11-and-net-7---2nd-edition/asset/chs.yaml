  \ 将是 `https://bpbdotnetbook.azurewebsites.net`。\n\nAzure 包含了大量可以通过标准 REST API 消费的服务；包括物联网、人工智能、机器学习等资源。对于大多数服务，Microsoft\
  \ 提供了成熟的库，用作 C# 和其他语言的中间件。有关可用的 Azure 服务和底层 SDK 的更多信息，请参阅 Azure 官方文档。\n\n## .NET\
  \ 6 中的新功能\n\n在发布 `.NET Core 1.0` 之后（这是第一个支持多平台开发的 .NET 版本），.NET 平台不断演进直到 `.NET 6`，形成了一个单一的生态系统，整合了用于移动、Web\
  \ 的成熟统一库和 SDK。在接下来的章节中，你将有机会了解 `.NET 6` 引入的最相关特性。\n### Hot reload\n\n热重载（Hot reload）是构建在\
  \ Visual Studio 和 .NET 平台中的功能，允许你在代码库中进行更改并在应用程序运行时显示。该功能适用于 Visual Studio 2022\
  \ 或使用 `dotnet watch` 命令行工具。当使用 Visual Studio 以调试模式运行应用程序时，你可以使用热重载按钮（如 图 2.29 中高亮所示），在无需停止并重新启动应用程序的情况下反射更改：\n\
  \n![](img/Figure_2.29.png)\n图 2.29：Hot Reload\n\n该选项显著提高了日常工作效率，支持 .NET 的各种类型项目，包括\
  \ Blazor、Web API、MVC、MAUI 等。\n\n### .NET MAUI\n多平台支持是 .NET 平台的规则改变者，而 .NET MAUI\
  \ 项目处于领先地位，因为它代表了微软的巨大努力，允许开发者创建一个可以在 Web、桌面和移动平台上兼容并部署的单一应用程序。对于 `.NET 6`，该项目处于预览阶段。\n\
  \n要在 Visual Studio 中创建 MAUI 应用，你必须安装以下工作负载：\n\n* 使用 .NET 进行移动开发\n* .NET 桌面开发\n*\
  \ 使用 C++ 进行桌面开发\n\n如果你已经安装了 Visual Studio 2022，你需要使用 Visual Studio Installer 并检查底层负载，如\
  \ 图 2.30 所示：\n\n![](img/Figure_2.30.png)\n\n\n.NET MAUI 代表了用于移动开发的 Xamarin Forms\
  \ 的新一代，但它远不止于此。这种新的项目类型是 .NET 平台泛现代化现代化多平台方面的发展方向。\n\n## HTTP/3\n\n\n\n`.NET` 平台自\
  \ `.NET 6` 预览版起开始支持 `HTTP/3`。这种新协议与性能改进有关，因为它直接使用了 `QUIC` 技术，这使得连接比之前的协议更快，并允许客户端设备在\
  \ Wi-fi 和移动数据网络之间自动切换。你可以通过修改 `HttpClient` 对象的底层配置，在 `.NET` 项目中使用 `HTTP/3` 协议，如图\
  \ 2.31\n\n图 2.31：用于 HTTP/3 的 HTTP 客户端配置\n\n与 `HTTP/2` 相比，`HTTP3` 具有更响应速度，为应用程序提供了更高的可靠性和更好的用户体验，因为这种新的现代协议能够更高效地处理丢包，并在不产生不子请求的情况下在客户端和服务器之间建立连接。\n\
  ## 自定义检查](#contents.xhtml_sc3_47)\n\n`.NET 6` 引入了识别平台和操作系统的新方法，以防需要为每个平台编写自定义代码或更改应用程序的行为。此外，可以使用类内的方法和属性的注解，以确定该方法是否受特定平台支持。平台检查如图\
  \ 2.32\n\n图 2.32：平台检查\n有大量方法可以检查操作系统版本和其他平台。这对于多平台开发特别有用，它不仅包括了部署到不同平台的能力，还可以更改应用程序在设计和功能方面的表现。\n\
  \n## 结论](#contents.xhtml_sc2_48)\n\n`.NET` 平台提供了许多项目类型，以支持在创新、多平台开发和创建可扩展应用程序方面的广泛可能性。`.NET`\
  \ 的历史表明，该平台仍在进化以满足市场需求。在下一章节中，你将学习面向对象编程（`OOP`）的基本概念，这将使你有足够的专业知识遵循封装、继承和 SOLID\
  \ 原则的良好实践。\n## 注意事项](#contents.xhtml_sc2_49)\n\n*   `.NET 5` 代表了 `.NET` 平台多平台支持努力的统一。\n\
