  \n\n## Visual Studio Code 简介\n\n\n![](img/Figure_1.10.png)\n\n图 1.10：Visual Studio\
  \ Code 编辑区域\n在资源管理器侧边栏，你可以访问项目的所有现有文件夹和文件，包括在同一个资源管理器的多个窗口中同时管理多个项目的可能。如图 1.10 所示，编辑器侧边栏是开发实际代码的地方，可以在代码提示、代码段等许多方面获得与\
  \ `Visual Studio` 相似的体验。\n\n`Visual Studio Code` 是一个基于命令行的编辑器，这意味着它在 IDE 中管理和开发项目的视觉选项可能较少。但是，你可以通过使用命令快速运行、构建和为你的应用程序创建新文件，而无需使用鼠标点击，如果你熟悉可用的命令和快捷键，这将提高生产力。\n\
  \n传统的完整 `Visual Studio 2022` IDE 版本依赖于 `.sln`（解决方案）文件中的现有规范以及项目的特定扩展（例如 `C#` 项目的\
  \ `.csproj` 文件）来正确打开项目解决方案。尽管 `Visual Studio Code` 允许你仅通过打开简单的文件夹和文件来运行代码，这当你想要在同一个\
  \ `Visual Studio Code` 中同时运行其他非 `.NET` 相关的语言时非常有用。\n谈到生产力和菜单选项，`Visual Studio Code`\
  \ 比 `Visual Studio` 更灵活且可定制，因为它包含了许多预定义的命令和快捷键来获取文件、更友好的跨文件夹和文件搜索选项等等，如图 1.11 所示：\n\
  \n![](img/Figure_1.11.png)\n\n图 1.11：Visual Studio Code 快捷键\n`Visual Studio` 是目前市场上流行的代码编辑器。由于该项目背后活跃的技术社区的大量贡献，可用功能随时间呈指数级增长，提供了大量的扩展和新功能。\n\
  \n## .NET 历史\n\n\n这第一个版本最重要的特性是通用语言运行程序 (`CLR`) 能力，它允许开发者在同一个解决方案中使用多种编程语言创建 `.NET`\
  \ 应用程序。.NET 平台能够使用 `CLR` 在运行时执行多个项目，将每种编程语言的输出转换为通用中间语言 (`CIL`)，也称为中间语言 (`IL`)，从而提供了共享用\
  \ `C#` 编写的库和用 `Visual Basic` 编写的库于单个应用程序的可能性。这种使用多种语言开发单个应用程序的能力并不意味着那时可以使用 `.NET`\
  \ 创建跨平台应用程序。相比之下，当时只能在 Windows 系统上运行和开发 `.NET` 应用程序。\n\n2003 年第二季度，.NET 的第一个相关版本以\
  \ 1.1 版本发布，并在该阶段引入了对开放数据库连接 (`ODBC`) 的支持，以满足 .NET 应用程序数据库集成的标准需求。在此之前，.NET 在市场上尚未被广泛采用，需要发布重要功能以满足最现代的软件开发需求和趋势。\n\
  2006 年 1 月，微软发布了 .NET Framework 2.0 以及其他相关工具和产品，例如 `Visual Studio 2005`、更稳定的新 `SQL\
  \ Server 2005` 以及 `Biz Talk`。该版本最重要的成就之一是对是对 64 位计算机架构的支持，以及 `C#` 语言的新功能，如部分类 (`partial\
  \ class`)、`ASP.NET` 的新身份验证选项以及允许使用内存数据库管理数据库操作的 `DataTable` 对象。\n\n随着新功能的出现，`Visual\
  \ Studio` 在企业级应用开发方面变得成熟且完善，作为一个完整的 IDE，即使对于那些拥有 .NET 不支持的其他编程语言知识的程序员也是如此。此外，`ASP.NET\
  \ Web Forms` 项目在具有桌面开发经验的开发者中被广泛采用，导致了大量人员向 Web 开发的迁移。\n\n\n\n\n在 ASP.NET Model\
  \ View Controller (MVC) 项目引入该平台之前，ASP.NET Web Forms 在 .NET Framework 中占据着重要地位。基于表单的\
  \ 页面导航在 Web 早期非常常见。它本质上被认为用户从 Web 浏览器发送请求，服务器返回响应，并始终在服务器上保持整个页面（包括所有 Web 控件）的状态。在这种模型中，服务器负责处理\
  \ HTML 和相关内容（包括动态数据）。这种方法使用 View State（视图状态）模型在每次请求之间存储所有服务器端组件的值。此外，ASP.NET Web\
  \ Forms 还提供了在每个页面的 HTML 和逻辑代码之间使用分离文件的选项，这在当时被认为是一种创新。\n\n2006 年 11 月，.NET Framework\
  \ 3.0 发布，包含了与桌面开发和 Web 服务相关的新功能。当时，JavaScript 对象表示法（JSON）模式尚未用于服务集成。可扩展标记语言（XML）是当时系统间标准通信最常用的替代方案。来自\
  \ .NET 平台的 Windows Communication Foundation（WCF）成为了 .NET 的官方 Web 服务。随着 .NET 在 2006\
  \ 年后采用市场采用的最现代模式并用 Web 应用程序编程接口（API）模型取代它，WCF 随着时间的推移变得过时。\nWCF 的优点之一是它与原生 Visual\
  \ Studio 工具集成，这允许开发者通过提供 Web 服务 URL 从其他 Web 服务导入第三方端点到 Visual Studio，为外部服务指定的对应对象生成底层\
  \ `C#` 类，即使这些服务是用其他编程语言编写的。该助手侧重于解释第三方 Web 服务的 `XML` 规范，以创建相应的对象及其属性，而无需编写任何代码。此外，Service\
  \ Import（服务导入）工具会自动生成 `C#` 语言的方法，以与引用的 Web 服务建立连接，允许按照底层服务规范向服务发送请求，并将服务响应解析为 `C#`\
  \ 类可以理解的格式。它在当时是一项高效的工具，也是 WCF 结合其他 .NET 工具在市场上变得如此受欢迎的关键点。\n\n如今，许多公司仍有使用 WCF 规范开发的遗留项目（legacy\
  \ projects）Web 服务。ASP.NET Web Forms 应用也是如此，因为许多公司将其用于大型复杂项目，并且尚未将其迁移到基于 .NET 的新版本\
  \ Web 项目。\n\n.NET Framework 3.0 引入的另一项重要技术是 Windows Presentation Foundation (WPF)\
  \ 项目类型，这是一种使用扩展应用程序标记语言（XAML）创建桌面应用程序的新方法，利用 3D 计算机图形能力开发丰富的用户界面。这种项目类型代表了 .NET\
  \ 平台上传统的 Windows Form 项目类型的替代方案。\n当 .NET Framework 3.5 于 2007 年 11 月发布时，它为桌面应用程序带来了性能改进。它引入了第一版本的\
  \ Entity Framework，提供了改进应用程序与关系型数据库通信体验的可能性，代表了对在其他平台上流行的对象关系映射（ORM）框架的替代方案。然而，Entity\
  \ Framework 的新版本必须在 2008 年与 .NET Framework Service Pack 1 同时发布，其中包含了根据技术社区反馈进行的相关更新，但该版本尚不够成熟，不足以被全球范围内大量的公司和项目主要采用。ORM\
  \ 概念及其重要性在市场上被广泛认可，因此对 Entity Framework 进行巨大的改进变得极其必要，主要是为了给该工具提供可靠性和稳定性。\n\n在 Entity\
  \ Framework 更新仅发布一年后，微软就提供了 4.0 版本的 .NET Framework。尽管如此，它没有对之前的版本引入任何破坏性更改（break\
  \ changes），且作为更新的一部分并没有许多新功能。不同的是，2012 年 8 月发布的 .NET Framework 4.5 包含了针对 Web 应用、桌面开发和\
  \ Windows 8 原生组件的许多改进。在该版本的所有新功能中，ASP.NET 应用的新能力脱颖而出，包括对 Web Forms 的 HTML 5 支持以及对\
  \ Websocket 协议的支持，这代表了当时遵循最现代 Web 标准实践的一大步。此外，此 .NET 版本允许使用异步 HTTP 请求和响应。\n\n2015\
  \ 年 7 月，.NET Framework 4.6 发布，这是该框架在通过 .NET Core 变为多平台之前的最后一个大版本，尽管它在 4.7 和 4.8\
  \ 版本中仍有小更新。4.6 版本引入了对 Azure SQL Server 分布式事务的支持、与 WPF 用户界面相关的改进，以及通过使用注解特性为 ASP.NET\
  \ 应用提供数据本地化支持。\n## .NET Core 版本\n\n考虑到 2015 年的现状，软件开发市场正在变化以适应跨平台概念。在这种背景下，.NET\
  \ 平台仅支持 Windows 操作系统这一事实对其演进和在市场影响力构成了重大限制。2005 年，公司、开发者和技术社区已广泛接受：跨平台开发是任何软件项目成功和成本的强制性要求，即软件开发过程中涉及的底层技术能够在多个操作系统、多种类型设备上执行，并与其他技术和平台具有互操作性。\n\
  \n为了专注于满足这些新需求，微软于 2016 年 6 月发布了第一版本的 .NET Core。这个颠覆性的平台允许在 Linux 和 macOS 上开发、部署和运行\
  \ .NET 应用程序。用于 `C#` 和 Visual Basic 语言的 .NET 库和包已完全从零开始重写，并且创建了新版本的 ASP.NET 项目和 Entity\
  \ Framework，这些产品被重命名为 ASP.NET Core 和 Entity Framework Core，以遵循针对跨平台开发的 .NET 新品牌。\n\
  此外，所有的 .NET Core 库及其其项目都变为了开源项目，代码共享在 Github 上，这使得技术社区的任何人都能为后续版本的演进做出贡献和协作，在各种项目上报告功能问题，并对平台内的新功能提供反馈。向开源模式的转变对于\
  \ .NET 开发者来说是一个巨大的里程碑，因为在当时只有 ASP.NET MVC 项目可以被认为是开源项目。它显著促进了来自其他技术的开发者对 .NET 的采用。\n\
  \n.NET Core 1.1 于 2016 年 11 月发布，包含了许多开发者和公司反馈问题的解决方案，并专注于支持更广泛的 Linux 发行版。此外，此版本改进了\
  \ Entity Framework 工具以支持 Azure 和 SQL 2016。\n\n\n\n在 2017 年 8 月，`.NET Core 2.0` 被发布，它可以使用\
  \ `.NET Standard` 作为中间件与遗留的 `.NET Framework` 库集成，并通过新功能改进了跨平台支持。该版本带来了新的 `Razor\
  \ Pages` Web 项目，这是在 `.NET Core` 平台上创建 Web 应用程序的传统 `ASP.NET MVC` 项目类型的替代方案。此时，`.NET\
  \ Core` 已成为一个成熟的平台，被全球范围内的公司采用。对跨平台开发的支持是 `.NET Core` 的关键，结合了 `Visual Studio Code`\
  \ 和新的命令行选项。开发者能够创建几乎可以在任何地方执行的 `.NET` ，通过开源项目的增量式稳健更新参与到 `.NET` 下一个版本的演进，同时也享受到许多\
  \ `.NET` 库性能改进带来的益处。\n\n本章之前提到的 `.NET Standard` 是一种针对 `.NET` 库的典型 API 规范，允许我们在所有\
  \ `.NET` 项目中使用它，无论其版本如何。这意味着不同类型的项目可以通过 `.NET Standard` 共享库，包括广泛的 `.NET Framework`\
  \ 和 `.NET Core` 库之间的兼容性。必须提到的是，`.NET Core` 和 `.NET Standard` 是不同的东西。前者不直接兼容 `.NET\
  \ Framework` 库，而后者被设计为所有 `.NET` 版本之间的桥梁。因此，将 `.NET Framework` 迁移到 `.NET Core` 的最佳策略是在\
  \ `.NET Standard` 中创建库。这样，可以在不发生任何重大破坏性更改的情况下保留遗留项目的实现，并在 `.NET Core` 项目中使用相同的库，以逐渐过渡到新版本的\
  \ `.NET`。\n\n\n![](img/Figure_1.12.png)\n\n图 1.12: .NET Standard\n\n\n从第一个版本开始，`.NET\
  \ Core` 有许多改进和重大新功能，跨平台能力在所有版本中都严格遵循，包括 `.NET Core 3.0` 版本，它在满足现代软件开发需求方面是一个游戏规则改变者，因为它支持\
  \ `Windows Forms`、`WPF`、人工智能 (AI) 和物联网 (IoT)。在本书的后续章节中，你将有机会深入研究所有这些类型的项目，并理解应用于\
  \ `.NET Core`、`.NET 5`、`.NET 6` 和 `.NET 7` 的性能改进。\n\n### .NET 5, .NET 6 和 .NET 7\n\
  2020 年 11 月，微软发布了 `.NET 5`，它代表了在使用 `.NET` 平台进行软件开发的新时代的开始，此时所有跨平台开发的工作已达到了良好的成熟和稳定水平。这意味着最相关的\
  \ `.NET` 库在此时已完全迁移，以具有跨平台兼容性。\n\n在所有 `.NET` 版本中，`.NET 5` 代表了 `.NET Core 3.1` 和 `.NET\
  \ Framework 4.8` 的演进，这是自 `.NET Core 1.0` 以来在 `.NET` 平台上整合所有跨平台开发努力的一个巨大里程碑。因此，可以说\
  \ `.NET 5` 是现代和跨平台开发中 `.NET` 生态系统的统一，结合了新功能和相关的性能改进。\n\n统一平台将跨平台作为关键点，这不仅意味着跨多个操作系统的兼容性，还意味着跨多个设备和平台，例如桌面、Web、云端、游戏、物联网等。使用\
  \ `.NET` 实现多平台开发需要对整个 `.NET` 平台进行复杂的重构，同时也显著改进了 `C#` 语言现有功能的性能，包括类型转换、并行化等。\n2021\
  \ 年 11 月，微软发布了 `.NET 6`，它包含了进一步的性能改进、`Arm64` 支持、`.NET MAUI`、`C# 10`、新项目模板、对 `HTTP/3`\
  \ 的支持、代码分析的改进、`DateTime` 和时区的改进等。此时，许多公司已经在使用 `.NET 5`，迁移到 `.NET 5` 对于遗留项目并不构成巨大挑战。\n\
  \n最后，2022 年 11 月，`.NET 7` 将通过 `.NET MAUI` 为现代客户端开发带来重大改进、云原生改进以及升级现有 .NET 应用程序的新工具。\n\
  \n### C# 语言简介\n学习任何编程语言的最佳方法都是创建真实的应用程序进行练习，并在实际场景应用应用编码基本概念的技术知识。首先，基本概念适用于任何编程语言，如变量、循环、块和迭代器。在本章的后续部分中，你将有机会体验并创建多个\
  \ `C#` 应用程序，接触该语言的大多数概念。\n\n`C#` 是一种强类型语言，所有指定的变量都具有特定类型。因此，如果创建一个仅用于存储数字的变量，任何尝试存储其他类型内容的尝试都会导致编译错误。在计算机编程中，还有弱类型语言，它们不是预编译的，变量类型在应用程序运行时动态检查。作为一种强类型语言，`C#`\
  \ 强制在源代码中指定任何变量类型，显式指示每个变量上应该存储什么类型的数据。\n\n\n从代码可读性来说，在软件开发过程中为变量和任何自定义实现良好的命名规范至关重要。为变量、方法、类、函数、项目和结构体使用有意义的名字。在\
  \ `C#` 语言中，类主要使用驼峰命名法（例如 `MyBook`），常量使用大写（例如 `MAX_ITEMS_ORDER`）。让你的代码易于他人阅读，这提高了生产力，降低了项目成本并促进了软件开发团队的协作。\n\
  \n图 1.13 代表了控制台应用程序中 `C#` 变量的简单创建和赋值：\n\n![](img/Figure_1.13.png)\n```\n\n图 1.13:\
  \ C# 变量\n\n\n第 3 行和第 4 行表示使用不同类型创建的两个变量。第一个使用 `string` 类型，它存储内容“I’m reading the\
  \ Design Patterns with .NET book.”。考虑到这是一个字符串值，内容必须包含在引号中，因为这是 `C#` 语言中任何字符串的模式。对于代码示例中的第二个变量（第\
  \ 4 行），指定了 `double` 类型，它存储小数值（7.0），且由于它是数值值，因此不需要使用引号。变量应该根据其用途命名，并且它可以在相同作用范围内的程序其他部分使用：`class`、`method`\
  \ 或局部函数。\n\n`C#` 语言中有许多变量，每种变量都有其特定的使用原因。以下列表包含了最流行的类型及其详细说明和示例：\n\n\n- `int`：此类型用于存储整数，无论是正数还是负数。与任何其他变量类型一样，整数在存储大小方面也有定义的限制（最大值和最小值）。在这种情况下，`C#`\
  \ 语言中整数的最小值为 -2,147,483,648，最大值为 2,147,483,647。这种限制有助于防止内存泄漏和安全漏洞。每当程序中创建一个变量时，内存中都会留出空间来存储该值，并在引用类型在内存中保留引用以供使用。因此，强烈建议为应用程序中使用的任何变量选择合适的变量类型。此外，在\
  \ `C#` 语言中可以使用其他尺寸的整数类型。例如，`short` 类型允许我们存储 -23,768 到 32,767 之间的数字（`System.Int16`），`long`\
  \ 类型允许我们存储 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 之间的整数（`System.Int64`），而且还有更多选项。在特定程序中使用正确的整数类型直接取决于数据在精度和大小方面的要求。通常，如果没有显式要求确定另一种类型，大多数情况下都会使用\
  \ `int` 类型，该类型表示 32 位数（`System.Int32`）。\n\n- `boolean`：这种变量类型用于存储表示真或假值的逻辑内容，如图\
  \ 1.14\n\n\n第 9 行表示一个 `bool` 变量字符串，一个真值，第 10 行在控制台上打印该底层值的值。\n\n- `string`：如图 1.8\n\
  \n\n本章所示的所有变量类型都可以认为是 `C#` 语言中的原始类型，因为它们代表程序中存储数据的简单结构。一旦创建变量，每种类型在尺寸和内存分配方面都有其限制。.NET\
  \ 垃圾收集功能会在不再使用后从内存中清理它们，只保留必要信息以实现高性能内存管理。\n\n如果给变量赋值了错误的值类型，编译器将显示错误，阻止程序运行。这种编译时的类型检查对于像\
  \ `C#` 这样的强类型语言来说是一个巨大的优势，因为此功能允许我们比其他接受动态类型的语言更早发现发现问题。\n\n\n虽然 `string` 和 `object`\
  \ 类型被认为是原始类型，但它们也可以 `C#` 语言中的类、接口和委托类型相同的引用类型。因此，值类型与原始类型之间没有强制关系。\n\n以下主题包含了最流行的原生引用类型及其详细说明和示例：\n\
  \n\n图 1.16：C# 中的数组\n\n\n\n### 列表\n- `List`: 它是一个复杂的对象，允许我们像列表一样操作元素，并通过索引访问这些值。该类型包含许多扩展方法，用于搜索列表中的元素、排序以及执行各种操作。这是\
  \ C# 中最常用的类型之一，因为几乎所有程序都有处理来自数据库和其他来源元素列表的共同需求。在创建列表时，应该已经定义元素的类型，并可以使用 `Add` 方法进行赋值，该方法是\
  \ `List` 类的一部分。该类型支持多种操作，这是它与数组变量之间的主要区别。在操作元素方面，两者可以获得相似的结果。尽管如此，`List` 类型包含了更多更高级的选项，可以在集合中插入、删除和搜索项目，而无需显式地引用列表操作中的索引。`List`\
  \ 类型的额外功能有助于我们防止动态数据操作中的错误，因为数组始终具有确定的赋值值范围。图 1.17 包含一个 `List` 示例，展示了向集合分配元素的方法：\n\
