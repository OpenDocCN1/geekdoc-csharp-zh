  \ 面向对象编程基础概念”中详细解释，但为了开始学习类的基本概念，你必须知道类是 C# 语言中的引用类型之一，其正确的使用和定义是任何使用 C# 语言的软件至关重要的部分。可以通过类来定义属性、可见性、构造函数以及面向对象编程的其他固有概念。目前，将其理解为\
