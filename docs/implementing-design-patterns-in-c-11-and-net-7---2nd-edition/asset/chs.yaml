  \ 71 行所示。\n\n\n`do-while` 指令与普通的 `while` 语句非常相似，区别在于块内的逻辑代码在测试条件之前运行。因此，代码至少运行一次，因为逻辑测试是在每次循环的末尾执行的。[图\
  \ 1.22 包含一个与图 1.21 所示目的相同的代码，但使用了 `do-while`：\n\n![](img/Figure_1.22.png)\n\n\n\
  这种循环适用于在测试条件之前必须执行特定操作的情况，这是与本章之前介绍的 `while` 语句的主要区别。在本图 1.22](#ch01.xhtml_fig1-22)的简单例程中，`timesExecuted`\
  \ 变量的初始值为 0(zero)，无论最终条件如何，循环体都会执行第一次，迭代发生 25 次。在特定情况下，`while` 循环测试的条件可能永远无法满足，导致导致死循环，从而抛出栈溢出异常（Stackoverflow\
  \ exception）。\n\n#### For 循环 [#contents.xhtml_sc4_16a)\n\n\n- 应在 `for` 语句内部创建一个包含迭代初始值的变量。\n\
  - 用于测试和满足的条件应使用为初始迭代创建的变量。\n- 执行的次数应该是递增的且预定义的。\n\n\n\n\n为了清晰地理解这种循环，你可以查看图 1.23\
  \ 中的细节，其中包含的实现与图 1.21 和图 1.22 中之前表示的相似：\n\n\n图 1.23: C# 中的 for 循环\n\n如图 1.23 所示，`timesExecuted`\
  \ 变量声明在 `for` 循环语句内部，增量过程发生在需要满足的条件之后，即循环的第二条指令中。如果你将其与图 1.21 和图 1.22 中的之前的实现相比，尽管目的和结果相同，但\
  \ `for` 循环似乎比其他的更直观、更易读。因此，在涉及列表和循环的逻辑操作中，有许多实现相同目标的方法。在实现过程中，为你的选择选择最选项将会有帮助。\n\
  \n\n`foreach` 循环可以在元素列表上执行操作，而无需使用索引访问元素。`foreach` 语句可以用于 C# 中任何实现了 `IEnumerable<T>`\
  \ 接口的类型。图 1.24 展示了 `foreach` 如何工作，它为列表中的每个项目执行一个代码块：\n\n![](img/Figure_1.24.png)\n\
  \n\n如图 1.24 所示，在第 98 行创建了一个字符串元素列表，并在第 99 行到 105 行之间填充了该列表。列表上的每个项目都会执行一次 `foreach`\
  \ 指令，具体位于第 107 行到 110 行之间。这意味着打印星期几（Day of Week）的代码块运行了七次，每周每天运行一次。通常情况下，循环实现在需要运行重复操作时具有编写代码更少的优势。在这个示例中，并没有指定七次\
  \ `Console.WriteLine` 指令（每周的每一天一次），而是只指定了一次。\n\n### 运算符\n\n\n#### 算术运算符\n\n这种类型的运算符用于执行加、减、除、乘以及其他常见的常规算术运算。可以使用变量或直接指定值来执行这些操作，如图\
  \ 1.25 所示：\n\n\n图 1.25: C# 中的算术运算符\n\n如图 1.25 所示，在第 118 行到 121 行之间创建了变量，用于存储涉及变量\
  \ `number1` 和 `number2` 定义的两个数字的算术运算总和。注意的是，存储操作结果的变量创建时应遵循操作结果的正确类型。在这种背景下，如果两个数字中至少有一个带有小数值，则结果变量应该是\
  \ `decimal` 类型或 `float` 类型，取决于对算术运算预期的精度。\n\n\n等号运算符是 C# 语言中最常用的运算符，因为它被用于给变量赋值，如图\
  \ 1.26 所示：\n\n![](img/Figure_1.26.png)\n\n图 1.26: C# 中的赋值运算符\n\n在第 131 行，创建了一个名为\
  \ `customMessage` 的字符串变量，并使用运算符 `=` 为其赋值了一个值。\n\n确切的过程发生在第 132 行，但使用的是 `int` 类型。可以使用等号运算符连续地为多个变量赋值，这意味着最终所有变量都将具有相同的值，这在第\
  \ 135 行中得到演示，那里三个变量（`x`、`y` 和 `z`）的值都是 10。因此，C# 语言中的等号运算符并不仅用于算术运算，还用于给变量赋值。在这种情况下，变量始终位于左侧，底层值位于右侧。\n\
  \n\n![](img/Figure_1.27.png)\n\n图 1.27: 等号运算符\n\n在给出的示例中，图 1.27 中的第 148 行使用运算符 `==`\
  \ 来验证 `Day` 属性是否等于数字 4。因此，等号运算符在这里用于比较而非赋值。\n\n\n关系运算符是常见的实现之一，涉及布尔表达式。为了实现这一目标，C#\
  \ 语言包含了许多运算符，允许我们比较两个或多个值。下表包含了所有的关系运算符：\n\n| 名称 | 运算符 | 预期结果 |\n| --- | --- | ---\
  \ |\n| 不等于 | `!=` | 10 |\n| 小于 | `<` | 15 |\n| 大于 | `>` | 15 |\n| 小于等于 | `<=` |\
  \ 25 |\n| 大于等于 | `>=` | 25 |\n表 1.1: C# 中的关系运算符\n\n关于等号运算符，在 C# 语言中要重要的是，为了两个值进行比较，应该使用两个等号运算符。这样编译器就会将其识别为比较而不是赋值。此外，可以使用\
  \ `!` 运算符反转布尔值。图 1.28 包含了 C# 中每个关系运算符的示例：\n\n![](img/Figure_1.28.png)\n图 1.28: 关系运算符\n\
  \n如果在任何关系语句之前使用 `!` 运算符，关系运算符可能会产生相反的结果。这对于原始条件默认返回假的情况下增加代码的可读性非常有帮助。\n\n#### 逻辑运算符\n\
  逻辑运算符用于在复合条件中组合关系运算符。它们只是返回真或假值的布尔语句。这种类型的运算符通常用于逻辑实现中的循环和决策语句，当句子中的一个或多个条件需要满足时。\n\
  \nAND 和 OR 运算符可以组合以进行不同的比较，取决于它们的顺序，语句可以返回不同的结果。例如，想象一个程序，只有在周一或周二执行某个特定操作。在这种情况下，可以使用\
  \ OR 运算符组合两个逻辑表达式，如图 1.29 所示：\n\n![](img/Figure_1.29.png)\n图 1.29: “OR”运算符\n\n如第\
  \ 195 行所示，有一个 `if` 语句包含两个由关键字 `||` 分隔的条件，这是 C# 中 OR 运算符的等价物。在这种情况下，只有当两个条件至少有一个被满足时，才会执行\
  \ `if` 块中的代码。\n\n\n\n\n在给出的示例中，`if` 语句内部代码块的执行条件只有在星期为六且当前小时数大于 6 时才会被满足。\n\n##\
  \ 一元运算符\nC# 语言拥有一类主要用于对单个操作数进行操作的运算符。它们在编写特定例程时（如增加数字、反转布尔值、减少数字等）非常节省时间。在 C# 中，若要给整数变量增加一个数字，可以使用运算符\
  \ `++`，并且可以使用双减号运算符 `--` 来减少变量的值，如图 1.31 所示：\n\n![](img/Figure_1.31.png)\n\n图 1.31：C#\
  \ 中的一元运算符\n上述实现与使用算术运算符更改 `numberExample` 变量的值相同。在这种情况下，它等同于：`numberExample = numberExample\
  \ + 1`。无疑，一元运算符的语法在实现相似结果所需的代码量方面经过了优化。然而，在某些情况下，如果组合使用过多的元元运算符可能会可能会代码难以阅读。\n\n\
  ## 三元运算符\n\n三元运算符是另一种能够帮助我们减少逻辑语句中代码行数的运算符，当某个条件的结果是给变量赋值时，它可以替换 `if` 语句。如图 1.32\
  \ 所示，有一个字符串类型的变量名为 `message`，其值是一个使用运算符 `?` 和 `:` 构造的三元表达式表达式。如果满足条件，则将消息“Today\
  \ is Monday”赋值给变量；否则，则将文本“Today is not Monday”赋值给变量：\n![](img/Figure_1.32.png)\n\
  \n图 1.32：三元运算符\n\n当条件复杂且可能包含复合语句时，不建议使用三元运算符进行判断。在这种情况下，表达式中过多的条件将使代码难以阅读。因此，请使用\
  \ `if` 语句代替，并保持逻辑操作显式暴露，以便于维护和可读性。\n## 复合赋值运算符\n\n与三元运算符和一元运算符一样，位操作类型有助于减少实现中的代码行数，使操作更容易。任何算术运算符后跟等号\
  \ `=` 运算符在 C# 语言中意味着编译器应该将等号之前的算术操作应用于其变量值。图 1.33 包含了 `+`（加法）和 `*`（乘法）的复合赋值运算符示例：\n\
  \n![](img/Figure_1.33.png)\n图 1.33：复合赋值运算符\n\n应谨慎使用复合赋值运算符，因为它们可能会使复杂的实现难以阅读和调试。因此，如果数学运算包含许多部分和条件，请考虑使用显式变量进行数学运算。\n\
  \n## if 语句\nC# 语言包含许多运算符用于在布尔表达式中创建不同的条件语句。这表明了通过实现精确语句（即使是复杂条件）来控制软件行为的重要性。`if`\
  \ 语句是 C# 语言中最基本的条件运算符，它由根据一个或多个逻辑条件执行或不执行一个代码块组成。可以使用 `else` 子句指定仅当 `if` 语句中的特定条件为假时运行某个代码块，如图\
  \ 1.34 所示：\n\n![](img/Figure_1.34.png)\n\n图 1.34：if/else 语句\n\n在示例中，如果当前月份是一月份，则执行特定的代码块；如果条件结果为假，则执行另一个代码块。这种使用\
  \ `if` 语句的方法在需要根据结果（真或假）执行两个不同任务时特别有用。它遵循 `if-then-else` 模式，是 C# 在任何应用程序中使用频率最高的特性之一。\n\
  假设一个逻辑需求在 `if` 或 `else` 块内部包含许多子条件，强烈建议使用其他逻辑结构处理条件，例如 `switch`，它将在本节的下一个主题中解释。根据复杂性，单个实现中嵌套条件中的许多层级和子层级会导致代码难以阅读和维护，并且随着时间推移对实现进行更改时可能会引入错误。\n\
  \n## switch case\n\n如果逻辑实现包含多个备选选项，则 `switch case` 语句是合适的；因此，只有一个代码块会被执行。换句话说，是匹配具有预定义比较值的条件的选项。`switch\
  \ case` 广泛用于需要通过许多条件测试一个值的情况，甚至当条件超过两个或三个时也是如此，如图 1.35 所示：\n\n![](img/Figure_1.35.png)\n\
  图 1.35：switch-case 语句\n\n在此示例中，一个值（月份数字）针对 12 个选项进行测试，指令中的每个 `case` 对应一个，如果满足了其中一个条件，程序将执行底层\
  \ `case` 和 `break` 关键字之间指定的代码块。当条件的工作流可能包含多个选项，且为每个条件应执行的例程略有不同时，暴露系统需求非常有用。在 C#\
  \ 编程语言中使用 `switch-case` 语句处理多个选项而不是多个 `if` 子句是良好的做法。如果在如图 1.35 所示的示例中使用 `if` 语句，代码将像如图\
  \ 1.36 中的实现：\n\n![](img/Figure_1.36.png)\n图 1.36：嵌套 if 子句\n\n图 1.36 中的实现与图 1.35\
  \ 中的实现方式相同，但它包含了多得多的行且更加复杂。因此，当需要对多个值进行测试时，建议使用 `switch-case` 语句。\n\n## 错误处理 #contents.xhtml_sc3_20a\n\
  市场上的每个软件都存在实现错误、异常行为和执行问题。软件问题有很多可能，例如类型转换错误、内存泄漏问题、数据问题、空检查、应用程序与数据库之间的通信问题以及服务器配置问题等。每种编程语言都有处理这些可能的特定方法，映射这些错误可以显著提高软件的稳定性。\n\
  \nC# 语言包含原生实现，可以正确捕获程序可能的所有错误，并显示关于异常根源的有价值详细信息。如果异常来自任何原生 .NET 库，它还包含修复错误的建议。在任何项目中使用第三方库和资源都是常见的。集成这些第三方系统通常需要网络连接来进行通信、身份验证和协议运行。考虑到集成过程中可能故障的许多因素，任何应用程序都应该有一种可靠的方法来防止在此范围内可能提出的异常。当软件任何部分发生问题时，程序必须实现自定义例程。\n\
  \n\n\n\n在软件开发中，异常（exceptions）是应用程序中可能发生的所有错误。正确管理这些异常可以可以在程序执行期间发生任何错误时，控制任何自定义实现的工作流，显式地确定应用程序的行为。\n\
  \n在图 1.37 中，有一个异常处理实现的示例。在此上下文中，该方法接收一个人的年龄值并处理可能的异常，如果年龄无效，则向系统抛出异常：\n\n![](img/Figure_1.37.png)\n\
  图 1.37：抛出异常\n\n.NET 库包含了许多继承自主 `System.Exception` 类的异常类。在给出的示例（图 1.37）中，使用了 `ArgumentOutOfRangeException`，向系统传递自定义错误消息，引用问题的原因，并强制执行业务需求，不允许年龄值为负数。在这种情况下，可以有意地抛出异常。此外，如果第\
  \ 332 行输入的不是整数值，可能会抛出意料之外的错误。\n\n如果年龄值无效，应该使用 `try-catch` 块来管理异常。否则，程序的执行将因为意外的行为而中断。`try-catch`\
  \ 块的指定所示图 1.38：\n![](img/Figure_1.38.png)\n\n图 1.38：try-catch 块\n\n如图 1.38 所示，`age`\
  \ 变量在 `try` 块内部赋值。如果发生异常，系统将根据异常类型执行底 `catch` 块。如果错误具有由自定义异常处理处理的已知原因，将提供有关错误的更多详细信息，因为由于业务逻辑需求显式抛出了\
  \ `ArgumentOutOfRangeException`。如果发生任何其他错误，将执行第二个 `catch` 块。\n\n异常处理是任何软件项目最重要的部分之一，因为它与发生某些错误时应用程序处理用户体验的方式密切相关，而且直接关系到软件的可靠性。因此，在开发生命周期的开发和设计阶段必须映射所有可能的异常，并应该根据业务决策和良好的软件架构方法采取自定义操作。\n\
  当应用程序使用外部资源或与第三方系统集成时，通常需要实现一个例程来防止内存中对象的拆释放问题。例如，如果向数据库记录某些内容发生错误，无论过程是否成功，建议关闭与该数据库的连接。为了正确处理这种情况，可以使用\
  \ `finally` 块，它在代码工作流的所有情况下都会执行，无论是否执行了 `catch` 块，如图 1.39 所示：\n\n![](img/Figure_1.39.png)\n\
  \n图 1.39：Finally 块\n在图 1.39 中，可以看到在 `try` 块内部验证年龄是否有效后，应用程序调用了 `SavePerson` 方法，在实际场景中，该方法将执行实际的数据库操作，该操作需要打开连接并依赖网络可用性以建立通信。即使操作失败，系统始终关闭与数据库的连接，如第\
  \ 351 行和 354 行所示。`finally` 块的代码在所有情况下执行，遵循 `try` 和 `catch` 块的执行顺序。\n\n## 命名空间](#contents.xhtml_sc4_21a)\n\
  \nC# 语言中的命名空间（namespace）是一种特性，允许我们根据逻辑标准将一组类、结构和其他实现分离并保留。在 C# 中，每个类都位于特定的命名空间下；包括我们自己创建的或由\
  \ .NET 平台提供的。要定义命名空间，在类或结构体的名称之前指定一个由点分隔的路径，如图 1.40 所示：\n\n![](img/Figure_1.40.png)\n\
  图 1.40：命名空间定义\n\n在给出的示例中，`MyClass` 类位于 `Book.Chapter1` 命名空间下，因此将其他相关类保留在相同的命名空间下是逻辑上的。在类需要在另一个命名空间中使用的情况下，可以使用\
  \ `using` 指令来获取类的可见性，如图 1.41 所示：\n\n![](img/Figure_1.40.png)\n图 1.41：使用命名空间\n\n\
  一旦在任何 C# 文件中引用了命名空间，该命名空间下的所有类和结构体在同一文件的上下文中都是可用的，取决于类的可见性，如果被标记为 `internal`、`private`\
  \ 或 `public`。使用命名空间允许组织复杂项目，将类和结构保持在类似的框中。\n\n## C# 10 和 11 中的新功能](#contents.xhtml_sc3_22a)\n\
  .NET 7 为 .NET 平台带来了许多相关的通用改进，并适用于版本 11 中 C# 语言的增强。在本节中，你将介绍自 C# 10 以来引入 C# 语言的最相关的改进和新功能，以及\
  \ C# 11 中预期的新功能。\n\n### 全局 using 指令](#contents.xhtml_sc4_23a)\n\n从 C# 10 开始，你可以将任何\
  \ `using` 指令指定为全局，这意味着不需要在所有文件中声明单独的 `using` 指令。使用全局指令有两种：一种是在常规 `using` 指令之前使用\
  \ `global` 关键字，如图 1.42 所示：\n\n![](img/Figure_1.42.png)\n图 1.42：全局使用指令\n\n另一种实现相同目标的方法是编辑底层项目文件（`.csproj`），在项目配置中指定\
  \ `Using` 标签，如图 1.43 所示：\n\n![](img/Figure_1.43.png)\n\n图 1.43：csproj 中的全局使用\n两种方法的结果相同，但从维护和可读性的角度来看，在项目文件中指定全局指令代表了一种更显式的集中方式。\n\
  \n### 泛型属性](#contents.xhtml_sc4_24a)\n\n在 C# 中可以创建一个继承自 `System.Attribute` 的泛型类。与之前的\
  \ C# 版本相比，它简化了语法。例如，你需要创建一个 `GenericAttribute` 类，如图 1.44 所示：\n\n![](img/Figure_1.44.png)\n\
  图 1.44：泛属性类\n\n创建泛型属性后，你可以将其作为注解放在类属性上方，如图 1.45 所示：\n\n![](img/Figure_1.45.png)\n\
  \n图 1.45：泛型属性的使用\n在这种情况下，属性中的类型参数是强制性的，这意味着存在限制以避免转换错误，类似于应用 `typeof` 运算符验证特定对象的类型时。\n\
