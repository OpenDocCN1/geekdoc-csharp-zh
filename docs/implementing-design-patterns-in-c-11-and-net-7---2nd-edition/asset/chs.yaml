  \n![](img/fm1.png)\n\n# 第 13 章 使用 MediatR 实现命令模式\n\n## 引言\n\n命令设计模式是一种多功能工具，它将与多方面操作相关的所有本质信息整合到一个对象中。它能够高效处理复杂任务，包括数据库事务、API\
  \ 请求和各种集成，从而简化了客户端应用程序的整个流程。通过封装命令类执行的所有内部操作，它创建了一个内心的结构，增强了灵活性和控制力。\n\n由于它是需要集成多种编程语言的数据库提供者的首选方案，命令设计模式无疑是当今软件开发中最常见的设计模式之一。它在全球范围内大量项目中的广泛采用证明了它的有效性和相关性。\n\
  \n学习命令模式不仅有助于识别其在遗留项目中的应用，还能优化理解现有代码所需的时间。这可以导致显著的资源节省，并简化实现新软件的流程，特别是在使用 `C#` 语言和\
  \ .NET 平台时。\n\n在接下来的章节中，你将在指导下学习使用 `C#` 语言进行命令模式的实际应用。我们将逐步构建一个真实的场景，通过动手实践的体验加强你对这一宝贵设计原则的理解。无论你是资深专业人士还是初接触该模式的新学者，本章提供的见解和技术对你的软件开发之旅都可能是无价的。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 命令模式概念\n* `C#` 和 .NET 中的示例\n*  MediatR 使用命令模式\n\n\
  ## 目标\n\n完成本单元后，你将获得掌握命令模式所需的技能和理解，这是现代软件设计中的基础概念。你将能够识别其在 .NET 应用程序和现有项目中的用法，识别其实现方式和变体。除了仅仅的理论理解，你还能够在现实场景中实践地应用命令模式，利用其原则创建更健壮、灵活且易于维护的代码。无论是从事新开发工作，还是完善现有系统，这些知识都将成为你编程工具箱中宝贵的资产。\n\
  \n## 命令模式定义\n\n设计模式通过遵循面向对象编程、软件架构和 SOLID 原则的最佳实践，在简化复杂问题的解决方案方面发挥着至关重要的作用。尽管每个模式在特定实现和最终目标上都有所不同，但关注它们的底层原理而非具体实现，可以使它们更容易被理解和掌握。\n\
  \n在本章中，你将深入研究命令设计模式的复杂之处，揭示其结构和主要目的。你的旅程将包含一个实践示例，在其中你学习如何实现该模式以与在线商店的外部财务服务集成。在开始这一实践体验之前，熟悉命令模式的基本结构并理解其核心意图至关重要。\n\
  \n命令模式的作用是保护客户端应用程序（请求者）免受应用程序另一层（接收者）所执行的操作复杂性的影响。由于接收者仅负责执行操作，请求所需的子操作数量变得无关紧要。该模式的核心哲学是允许执行多方面的任务，并将结果合并为由客户端应用程序调用的统一高层操作。这不仅有助于操作的执行，还便于这些操作的撤销，类似于数据库操作和广泛的业务流程中常用的事务。\n\
  \n命令模式的高层抽象可以在图 13.1 中所示，该图展示了客户端应用程序与命令模式之间的交互：\n\n![](img/Figure_13.1.png)\n\n\
  图 13.1：命令模式图\n\n图 13.1 同样描定了分配给每一层的不同职责，提供了关于组件如何相互连接和共同运行的清晰全面的视图。无论是资深开发者还是新手，本章的都是加深你对这种最多功能设计模式之一的理解，增强你创建优雅且健壮软件的能力。\n\
  \n实现命令模式需要几个不同的组件：客户端应用程序、调用者、命令接口、命令实现和接收者。最初，这种配置通常代表该设计模式在各种场景中的标准实现。然而，需要执行多个命令的更复杂的情况可能需要略有不同的实现。\n\
  \n在同一上下文中对所有命令使用通用接口不仅确保了一致性，还增强了应用程序的可测试性。通过将命令注入到类中，可以模拟实际具体命令类的行为，从而实现更健壮的测试和开发。鉴于命令模式的定义有时看起来很抽象，强烈建议通过参与该模式的真实世界应用来加深理解。为此，遵循本章附带的实践教程至关重要。这种实践经验将允许你看到命令模式的运行，并以直接相关的真实世界软件开发的方式应用其原则，从而巩固你对这一强大设计概念的掌握。\n\
  \n## 代理模式实现\n\n鉴于命令模式的主要目标是从客户端应用程序中抽象复杂操作的执行，因此获得该模式的真实体验需要创建一个旨在解决命令模式试图解决的问题的应用程序。正如在本章开头部分提到的，并在随后的页面中详细说明的那样，你将有机会参与一个实践项目。该项目涉及构建一个财务交易的抽象，这是在线商店中常见的流程。它代表了命令模式的真实世界应用，该实践练习的要求如下：\n\
  \n\n\n\n\n*   在线商店必须支持通过信用卡交易进行支付，为用户提供无缝且安全的体验。\n*   完成购买后，系统必须通过减少购买产品的可用数量来自动更新库存，确保跟踪的准确性和可用性。\n\
  *   如果售出了由第三方供应商的产品，系统必须及时通知相关供应商，以促进清晰的沟通和及时的补货。\n\n在上述任何操作发生故障的情况下，系统必须能够回滚所有相关操作，以维护数据完整性并尽可能地减少潜在错误。这确保了即使面临不可预见的挑战，整个事务处理过程也是连贯且可靠的。\n\
  \n在给定的场景中，系统的构建需要开发一个通用的命令接口，并应用于所有操作中。尽管这些操作彼此可能完全不同，但它们的具体实现必须对客户端应用程序隐藏。自然地，要完整运行此示例，将涉及与外部\
  \ API 的交互、数据库集成以及与第三方系统的协调。这包括与供应商的通信，但值得注意的是，为了本次练习的目的，底层执行过程将进行模拟，从而将重点完全集中在命令模式的实现上。\n\
  \n至于所需的业务模型类，示例要求开发能够封装购买过程各个方面的模型。这包括与购买本身相关的关键数据，以及涉及客户、产品和供应商的互连细节。这些实体必须仔细定义和结构化，以反映在线商店的运营需求，并符合命令模式的原则。这些关系及其在系统内部集成的视觉表示可以在图\
  \ 13.2 中找到，提供了关于它们在此特定设计模式背景下如何相互作用的清晰、全面的概述：\n\n![](img/Figure_13.2.png)\n\n图 13.2：命令模式类图\n\
  \n`Purchase` 类由于在命令模式实现中起至关重要的作用，是该系统的中心枢纽。它被设计作为一个参数，封装了履行需求中概述的操作所需的所有基本信息。通过连贯地组织这些数据，`Purchase`\
  \ 类简化了各种任务的执行，并增强了代码的可维护性。该类的具体实现（包括其属性和方法）在随后的图 13.3 中所示，为其在更广泛系统中的结构和功能提供了清晰的视觉指南：\n\
  \n![](img/Figure_13.3.png)\n\n图 13.3：Purchase 类\n\n在 `Purchase` 类与 `Product` 和 `Customer`\
  \ 实体之间关系的背景下，这一假设场景的完整实现需要随后开发 `Customer` 类。该组件在定义和管理系统中特定用户的细节方面起着关键作用。`Customer`\
  \ 类实现的视觉描述（包括其关键属性和方法）在图 13.4 中提供。该插图作为理解其结构、重要性以及与更广泛框架内其他元素交互的指南：\n\n![](img/Figure_13.4.png)\n\
  \n图 13.4：Customer 类\n\n`Product` 类与 `Supplier` 类保持一一一的关系，反映了产品与其提供者之间的直接关联。为了演示，`Supplier`\
  \ 类仅关注引用模型的属性，省略了负责处理与供应商集成过程的特定方法。这种精简方法有助于隐藏供应商集成的底层复杂性，使示例集中在核心结构和关系上，而不深究与供应商系统通信和协调的复杂细节。它确保了重点保持在说明命令模式的基本概念以及在此背景下类与类之间的连接上。\n\
  \n### 额外类\n\n根据提供场景中概述的要求，`Product` 和 `Supplier` 类的实现对于本章探讨的示例是不可或的。这些类在系统内各承担不同的角色，经过精心构建，以反映假设在线商店的特定需求和限制。关于它们的结构、属性和关系的详细视觉表示在随后的图\
  \ 13.5 中提供，作为理解它们在命令模式实现更广泛背景下功能的清晰且富有洞察力的指南：\n\n![](img/Figure_13.5.png)\n\n图 13.5：Product\
  \ 和 supplier 类\n\n接下来，我们有 `CreditCard` 类，它与系统中的 `Purchase` 类紧密连接。该类负责处理支付处理所需的信用卡信息，并构成事务工作流的重要组成部分。`CreditCard`\
  \ 类实现的详细插图（突出了其属性、方法以及与 `Purchase` 类的关系）可以在以下图 13.6 中找到。它为这一基本元素在命令模式示例更广泛背景下的角色和结构提供了深刻的见解。\n\
  \n![](img/Figure_13.6.png)\n\n图 13.6：信用卡类\n\n在此阶段，我们已成功创建了实现本章示例所需的全部模型相关类类。在该框架内，命令模式将承担协调各种操作的角色，所有操作都遵循一个通用接口。该设计的中心是构造函数将包含一个购买对象，封装每笔交易所需的细节。在这一基础上，下一步是创建接口，该接口遵循相同的结构原则。该接口的视觉插图显示了它与整体设计的对齐以及它与其他组件集成的方式，可以在随后的图\
  \ 13.7 中提供。该可视化为接口在命令模式更广泛背景下的运作方式提供了清晰的见解，并为后续的实施阶段奠定了基础：\n\n![](img/Figure_13.7.png)\n\
  \n图 13.7：通用接口\n\n\n\n\n\n为了启动这一过程，第一个命令类将展示信用卡操作。该组件将作为系统内处理支付事务的核心骨干，将命令模式的抽象概念转化为具体的代码。接下来的\
  \ 图 13.8 提供了该类结构和实现的视觉化表示，对其在更广泛的类框架中的角色提供了一个简洁且详尽的视角：\n\n![](img/Figure_13.8.png)\n\
  \n图 13.8: 支付命令类\n\n在图 13.8 中，显而易见的是该类实现了 `IPurchaseCommand` 接口，并在构造函数中接收一个购买对象。这种方法形成了在该示例中所有命令类都必须遵循的模式。\n\
  \n考虑到整个购买过程，它由三个不同的操作组成。值得注意的是，其中两个关键功能——供应商通知和存储产品管理的实现是缺失的。因此，需要处理的后续任务是创建减少存储中产品数量信息的功能。这是整个过程中不可或缺的组件。\n\
  \n控制此操作的底层命令类包含了必要的实现，这些实现在图 13.9 中被详细阐述：\n\n![](img/Figure_13.9.png)\n\n图 13.9:\
  \ 存储命令实现\n\n在图 13.9 中，你会注意到存储命令类遵循与支付命令相同的模式。区别仅在于两个方法的实现，这些方法被修改以执行与其各自对应的不同操作。使用相同的接口是一个策略性的架构决策；它确保了整个系统中所有的命令类都符合本节初始要求规定的回滚过程（revert\
  \ process）。\n\n在理解此基础上，只剩下一个命令类待实现：即与供应商通知相关的类。考虑到每个供应商可能需要独特的集成方法，可以将命令设计模式巧妙地与其他模式结合。其中一个例子是策略模式，它在本书的第\
  \ 15 章 中详细列出。该图强调了整合之前章节的原则，以构建一个针对供应商通知特定需求的连贯且高效的设计：\n\n![](img/Figure_13.10.png)\n\
  \n图 13.10: 供应商命令实现\n\n随着所有三个核心命令类现在已建立，注意力转向了负责封装这些命令类所执行操作的类的构建。这是系统设计的关键部分，与最初设定的需求紧密一致。\n\
  \n如果操作的执行抛出异常或产生意外结果，系统被要求为该特定操作启动相应的回滚过程。这需要一个健壮的架构，其中命令类的管理类必须明确地确保其行为符合预期。\n\n\
  图 13.11 提供了该设计的详细视觉化表示，说明了直接管理命令类的类如何运作以保证预期的行为。它提供了不同元素之间相互作用的清晰视图，强化了该类在整个系统架构中的战略性：\n\
  \n![](img/Figure_13.11.png)\n\n图 13.11: 购买逻辑类\n\n`PurchaseLogic` 类设计用于接收符合购买命令接口的购买命令类，并包含一个特定方法来监督由具体命令类定义的操作执行。正如图\
  \ 13.11 所示的代码所示，`ConfirmPurchase` 方法包含一个 `try-catch` 块，专门为管理购买执行过程中可能出现的任何失败而设计。\n\
  \n这种设计策略确保了客户端应用程序依赖 `PurchaseLogic` 类来编排操作，而不是直接从命令类调用底层方法。这种方法不仅整合了控制，还保证了在发生意外情况时回滚操作会被一致地调用。\n\
  \n现在所有利用命令设计模式基础设施的必要类都已就绪，你可以灵活地在各种上下文中实现这些示例类，例如控制台应用程序或任何符合你执行每个类中嵌入操作需求的项目。\n\
  \n在本章中，控制台应用程序作为平台，用于演示创建多个命令类的实例以及模型类的实例化。这涵盖了与客户、供应商、产品和购买的信息。第一步涉及创建客户和信用卡对象的实例，并为其注入假设性数据。该过程的视觉化表示方便地展示在图\
  \ 13.12 中，为当前任务提供了清晰简洁的指南：\n\n![](img/Figure_13.12.png)\n\n图 13.12: 客户和信用卡对象\n\n\
  基础对象建立后，下一阶段涉及生成购买对象的新实例。此过程需要与新创建的客户和信用卡实体进行细密关联。图 13.13 在视觉上说明了这一关键步骤，提供了该过程关键组件中形成的关系和关联的清晰表示：\n\
  \n![](img/Figure_13.13.png)\n\n图 13.13: 购买对象\n\n在此示例中，购买对象由单个产品组成并链接到特定的供应商。在现实应用中，此类信息可能来自数据库或外部\
  \ API。然而，为了演示，这些对象的实例是手动构建的。\n\n每个命令类都预期在构造函数中接收一个购买对象。因此，相同的购买对象实例将分发到每个命令类实例，涵盖支付、存储管理和供应商通知。必须意识到，在所呈现的范围内，完整的购买过程需要协调所有三个命令类的操作。\n\
  \n在客户端应用程序中，程序要求为每种不同类型的命令创建一个实例。这些实例必须作为参数传递给 `PurchaseLogic` 类实例。图 13.14 为这种复杂的安排提供了视觉指南，说明了组件在更广泛的系统架构中相互作用和关联的精确方法：\n\
  \n![](img/Figure_13.14.png)\n\n图 13.14: 客户端应用程序实现\n\n\n\n\n需要强调的是，如果没有特定的业务要求强制在单次操作失败时将所有三个操作作为单个事务的一部分进行回滚，那么现有的实现并不是错误的。然而，考虑到这种需求确实存在，实现必须进行一些调整以完全满足这一需求。\n\
  \n必要的修改旨在确保系统满足规定的条件，并通过集成事务类来解决该需求。图 13.15 详细说明了该类在系统更广泛的背景下的运行方式，为确保符合该操作特定要求的适配提供了清晰且富有洞察力的视角：\n\
  \n![](img/Figure_13.15.png)\n\n图 13.15：事务购买命令类\n\n事务购买命令类的构建用于接收一个购买命令列表，并设计为实现相同的购买命令接口，以保持一致的模式。这种特定实现符合了一项需求：即使一个操作失败，也需要回滚所有操作。尽管这种方法看起来比之前的实现更复杂，但它更准确地封装并表示了底层需求。\n\
  \n在客户端应用程序中，实例化事务命令类变得至关重要。这一步取代了早期设计中三个独立的购买逻辑类实例。图 13.16 生动地描绘了这种新结构，说明了创建统一的事务命令类如何简化流程，确保满足指定的条件和要求：\n\
  \n![](img/Figure_13.16.png)\n\n图 13.16：带有事务的客户端应用程序\n\n利用命令设计模式，我们能够编写出既具有可读性又能透明地表达需求底层意图的代码。在本章的场景中，需求要求确保与在线商店购买相关的所有必要操作都能以连贯的方式执行。如果这些操作中的一个或多个失败，则整个购买过程必须回滚，将所有单个操作视为单个统一过程的组件。\n\
  \n这种设计模式在 във情况下被证明特别有利，它为处理复杂操作提供了一种结构化且清晰的方法。我希望这个示例不仅能了你对命令模式的理解，还赋予了你从旧项目中识别并应用这种模式的洞察力。这里提供的细致实现提供了一份实践指南，培养了在处理这种多功能模式的复杂性方面的理解和能力。\n\
  \n## MediatR 和命令模式\n\nMediatR 是一个用于 C# 的库，有助于中介者模式的实现，允许对象在不知道彼此身份的情况下进行通信。命令模式将请求转换为独立对象，可以像任何其他对象一样被传递和保存。这种模式将发送请求的对象与实际执行请求的对象分离开。MediatR\
  \ 可以结合使用将 `Command` 对象发送到各自的处理器，允许它们协同工作。\n\n在利用 MediatR 的 C# 中，`Commands` 可以定义为实现\
  \ `IRequest` 接口的请求。然后创建处理器来处理这些 `Commands`。通过将请求处理逻辑封装在命令处理器内部，并使用 MediatR 分发这些\
  \ `Commands`，架构变得更加模块化和易于维护。MediatR 处理路由，让应用程序遵循单一职责原则，因为每个 `Command` 处理器只需要处理一种特定类型的命令。\n\
  \nMediatR 和命令模式的集成简化了具有许多交互组件的复杂应用程序的管理。它促进了松耦合，因为组件不需要了解彼此，只需要知道它们发送或接收的 `Commands`。这导致了更具维护性的代码库，并通过将功能隔离到可测试单元中使测试变得更容易。这种架构选择在遵循\
  \ CQRS 模式的应用程序中可能特别有利，在那种模式下，读写分离与 `Commands` 和 MediatR 的用法完美契合。\n\n## 结论\n\n在整个章节中，你见证了命令模式所起的关键作用，特别是在需要将多个操作作为一个整体执行的场景中。它擅长将这些操作的复杂性从客户端应用程序中抽象出来。这种模式在\
  \ .NET 中被频繁使用，因为大多数数据库提供程序利用命令模式来简化使用 C# 语言开发的应用程序中数据库操作的执行。你在本章中获得的见解使你能够从零开始构建自己的命令结构，并将其应用于真实项目。你还可以将此模式与其他旨在封装操作执行的模式无缝结合，从而进一步隔离客户端应用程序。\n\
  \n在探索本章时，你不仅学习了如何使用 C# 语言实际地实现命令模式，还学习了如何为复杂问题设计简单的解决方案。这涉及到面向对象编程最佳实践的运用，丰富了你的理解和技术熟练度。你新掌握利用命令模式的能力将使你能够创建更加模块化和易于维护的代码。\n\
  \n展望下一章，你对 C# 语言和 .NET 平台设计模式的探索将继续发展。你将深入研究策略模式，在本书早期章节获得的基础知识的基础上进行。这段旅程将进一步完善你的技能，让你能够以更大的信心和专业知识应对现代软件开发的需求。\n\
  \n## 记忆要点\n\n*   命令模式有效地从客户端应用程序中隐藏了操作执行背后的复杂性。通过遵循一致的接口和模式，它确保了处理各种任务的统一方法。\n*\
  \   命令模式的多功能性允许它与其他设计模式（如策略模式）无缝结合。这使得解决方案更加健壮和灵活，并根据特定需求进行定制。\n*   在需要将多个操作作为单个事务管理的场景下，强烈推荐命令模式。它的结构化方法简化了复杂过程的编排，提高了效率和可靠性。\n\
  \n## 选择题\n\n1. 命令模式在什么场景下被推荐？\n   1. 简单操作\n   2. 系统集成非常复杂\n   3. 需要作为事务执行和处理的操作\n\
  \   4. 以上都不是\n\n2. 在本章提供的示例中，哪个类包含了代理模式的必要实现？\n   1. 购买逻辑\n   2. 客户\n   3. 购买\n\
  \   4. 购买命令\n\n## 答案\n\n| 1 | C |\n| 2 | D |\n\n## 思考题\n\n1. 解释命令模式的主要目的。\n\n2.\
  \ 根据你在本章中学到的知识，在本章示例之外创建一个可以应用命令模式的假设场景。\n\n\n\n\n\n3. 解释命令模式可以在哪些类型的场景下使用。\n\n\
  4. 你目前是否正在参与任何实现了了命令模式的项目？\n\n## 关键术语\n\n- `Transaction`（事务）：在软件开发中，事务代表一组需要一起执行的任务，如果其中至少有一个任务失败，则将对所有任务执行回滚过程。\n\
  - `Receiver`（接收者）：在命令设计模式的实现上下文中，接收者是负责执行特定操作的源类。\n- `Invoker`（调用者）：在命令设计模式的实现上下文中，调用者是一个负责调用命令类的中间类或层。\n\
