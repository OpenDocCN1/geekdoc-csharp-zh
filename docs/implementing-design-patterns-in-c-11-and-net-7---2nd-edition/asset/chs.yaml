  \ 平台的近期更新如何提高了性能和可扩展性，特别是对于企业级应用程序？\n\n## 关键术语](#contents.xhtml_sc2_53)\n*   通用语言运行时\
  \ (`CLR`)：`CLR` 是 `.NET` 的虚拟机组件，用于管理 `.NET` 程序的执行。它提供内存管理、垃圾回收和安全等服务。\n*   `C#`\
  \ (C Sharp)：`C#` 是由微软作为 `.NET` 计划的一部分开发的现代面向对象编程语言。它是开发者在 `.NET` 平台上创建应用程序的主要语言之一。\n\
  *   `ASP.NET`：在 `.NET` 平台上构建 Web 应用程序和 Web 服务的流行框架。它提供了工具和库，更容易创建动态网站、Web 应用程序和\
  \ Web 服务。\n*   `.NET Core`：`.NET` 的跨平台版本（适用于 Windows、Linux、macOS），包含了框架的核心功能并支持云和\
  \ Web 应用开发。它是一个模块化的、高性能的 `.NET` 实现，用于创建 Web 应用程序和服务、微服务以及其他现代服务器端应用。\n*   `Entity\
  \ Framework`：一种用于 .NET 的对象关系映射 (ORM) 框架。它允许开发者使用 .NET 对象与数据库进行交互工作，而无需关注存储数据的底层数据库表和列。\n\
