  \n## 引言\n\n从本章开始，我们将开启开发者所需的 .NET 核心领域之旅，包括多平台概念、.NET 6 和 .NET 7 引入的相关新特性和项目模板、性能增强以及创建最小\
  \ API 的新可能。\n\n你将在本章学习如何使用 Visual Studio 中的模板创建各种项目，例如控制台和桌面应用程序、Blazor、ASP.NET\
  \ Core Web API 以及 MAUI 项目简介。\n\n\n在本章中，我们将讨论以下主题：\n\n*   多平台概念的理解\n*   云开发的 .NET\n\
  *   .NET 6 和 .NET 7 的性能增强\n\n## 目标\n\n完成本单元后，你将获得若干关键能力。你将熟练在 .NET 框架中构建最小 API，同时掌握使用\
  \ .NET 进行云开发。此外，你将完善增强现有代码库的技能。最后，你将对 .NET 平台的演进趋势产生见解，预测其未来的发展。\n## 多平台概念\n\n随着过去十年云应用程序的兴，市场竞争发生了巨大变化，从软件许可的争夺变为云系统基础设施服务，以支持对扩展性、大数据、全球化和开源项目的高需求。因此，对盈利的关注不再是操作系统，而是基础设施的可靠性，因为许多公司正在改变商业模式，提供基于软件服务（SaaS）的解决方案。\n\
  \n尽管如此，大型科技公司仍在实现和创建新版本的操作系统，注意力完全转向遵循开源技术文化，这些大公司的共识是任何现代应用程序都能够在 Linux、macOS 和\
  \ Windows 平台上运行，而无需为每个平台维护独立的代码库。\n\n\n\n\n此外，随着物联网（IoT）的兴起，执行应用程序的设备类型比以往任何时候都更加多样，这使得软件开发过程变得复杂得多。不久前，每个\
  \ Web 开发人员最大的挑战就是成功地让同一个应用程序在多个浏览器（Internet Explorer、Firefox、Chrome 等）中以合理的质量运行。在这种背景下，Web\
  \ 应用程序可以从不同的操作系统访问，并且应用程序托管在服务器上，该服务器的规格和配置是相当受控的。但，这种相对受控的场景迅速转向另一个更复杂的场景，即基于跨平台环境，以实多个操作系统具有更好的应用程序兼容性，降低基础设施成本，并利用微服务架构向全球范围内更多的用户更快速地交付应用程序。\n\
  \n为了满足现代软件开发的这些新需求，微软自 `.NET Core 1.0` 版本以来对 `.NET` 平台进行了改进，从 `.NET 5` 开始拥有了非常成熟的跨平台开发框架，并在随后的直到\
  \ `.NET 7` 的版本中不断进行相关增强。因此，`.NET 7` 是一项丰富且强大的技术，它允许我们构建几乎可以在任何地方运行的现代应用程序，而且具有比之前的\
  \ `.NET` 版本更高的性能优势。\n\n在 `.NET Framework` 中 `C#` 语言的最初，微软的软件开发技术和工具主要仅支持 Windows\
  \ 平台，这对于 `.NET` 扩展到更大市场构成了明确的限制，因为当时桌面应用程序开发非常流行，而这类项目需要冗余地编写两次甚至多次（每个操作系统一个代码库），增加了软件项目的整体复杂性和隐性成本。\n\
  从这个意义上说，`.NET` 平台自 `.NET Core 1.0` 开始通过转向更关注开源的革命性变化改变了游戏规则，并汇聚了跨平台能力。使用最新的 .NET\
  \ 版本（`.NET 7`）构建应用程序允许你编写一个单一程序，该程序可以托管在任何平台、多种类型的设备、不同的云提供商上，并被大量的 Web API 调用。这场革命使\
  \ `.NET` 在市场中占据了显著地位，个人、公司、技术社区和学术机构能够通过开源项目模型为平台的演进做出贡献。\n\n## 用于云开发的 .NET\n\n\
  现代软件开发涉及对云服务和适用于分布式系统的架构模式的了解，允许开发者创建在基础设施方面具有可扩展性、可靠且成本效益的应用程序。`.NET` 平台提供了广泛的库和包，以促进与微软提供的强大云平台\
  \ `Azure` 的集成。\n`Azure` 上提供的服务不断增加，包括以下服务：虚拟机、云存储、无服务器函数、关系型和 NoSQL 数据库、Web 服务器、IoT、混合现实、人工智能、网络、Active\
  \ Directory、DevOps、区块链、机器学习等。\n\n对于这些服务中的每一个，微软都为 C# 和其他语言提供了 SDK 和库，方便业务应用程序与多个云服务的集成。`Azure`\
  \ 上的大部分资源都有使用传统的 REST API 进行集成，但使用库作为中间件无疑会加速开发过程，以开发者可以在重用性和可读性方面获得巨大优势的方式暴露 API。\n\
  \n## Azure 存储账户\n\n大多数应用程序需要存储不同格式的图像、静态文件和内容，并允许用户将自己的文件上传到服务器。类似的要求适用于 Web、移动和桌面应用程序，包括需要处理大量文件的后台服务。存储这些文件有很多方法，例如：\n\
  * 在应用程序服务器内的文件夹中存储这些文件\n* 使用专门的机器来存储文件\n* 在应用程序文件之间的文件夹中存储文件\n* 将它们作为 blobs 存储在数据库中\n\
  * 使用存储系统在应用程序上下文之外存储文件\n所有这些选项根据应用程序必须具备的技术和非功能性需求背景都有其优缺点，但通常情况下，在文件上传方面有一些建议在任何项目中都遵循的良好实践。其中一个良好实践涉及将用户内容文件从应用程序服务器分离到独立的外部存储服务中，这提供了一种更高效的文件提供方式（带宽），并且在数据复制、安全策略和自动备份工具方面具有强大的能力。\n\
  \n考虑到这些实践，`Azure Storage Account` 在可扩展性、安全性、性能和成本管理方面代表了一个极好的替代方案；可以使用 `.NET` 应用程序使用此云资源，因为微软为\
  \ `C#` 语言提供了包以加速开发过程，尽管也可以使用传统的 REST API 与 `Azure` 服务进行任何集成。\n\n要将 `C#` 应用程序与 `Azure\
  \ Storage Accounts` 集成，你需要安装微软提供的 `Azure.Storage.Blobs` 包。要测试该包，请使用 Visual Studio\
  \ 2022 或 Visual Studio Code 创建一个新的控制台应用程序并安装底层包，如图 2.1 所示：\n\n![](img/Figure_2.1.png)\n\
  图 2.1：Azure Storage Blobs 包\n\n```在 `Program.cs` 文件中，你需要导入该包的引用，并指定有关存储账户的身份验证信息，例如连接字符串和容器名称，如图\
  \ 2.2 所示：\n\n![](img/Figure_2.2.png)\n\n图 2.2：Azure Storage 的身份验证信息\n```注意图 2.2，第一行代码包含对\
