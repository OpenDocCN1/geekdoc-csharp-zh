  \n图 2.14：Function app 部署\n\n生成 Function App 后，你可以在新资源下手动创建函数，如图 2.15 所示：\n\n\n图\
  \ 2.15：Azure Portal 上的函数\n\n考虑到 Azure functions 托管的是小范围内的部分代码，可以使用 Visual Studio\
  \ 或 Visual Studio 在本地开发函数。在这种情况下，需要作为 Visual Studio 安装的一部分安装 Azure 开发工作负载，如图 2.16\
  \ 所示：\n\n![](img/Figure_2.16.png)\n\n\n安装工作负载后，从头开始新建项目时，Visual Studio 提供了所有相关的\
  \ Azure 项目模板。为了体验 Azure Functions 的本地开发，你需要在 Visual Studio 中创建底层项目，如图 2.17 所示：\n\
  \n![](img/Figure_2.17.png)\n\n\n选择了底层项目类型并命名项目后，必须选择 .NET 版本、触发器类型和授权级别。在本章的示例中，选择了\
  \ .NET 6 版本，并结合了 HTTP 触发器和匿名访问，如图 2.18 所示：\n\n![](img/Figure_2.18.png)\n\n\nHTTP\
