  \n![](img/fm1.png)\n\n# 第 14 章 使用 Azure C# 和 Azure Functions 使用策略模式\n\n## 引言\n\n\
  在软件开发的多维度领域，针对特定问题可以应用多种解决方案，不同的方法可能会产生相同的结果。然而，设计模式在这一领域提供了独特的优势。它们提供了一个统一的工具箱，为跨越不同公司和各种类型项目中遇到的反复问题提供了经过验证的解决方案。\n\
  \n在这个框架内，策略模式（Strategy pattern）作为一种优雅且高效的工具脱颖而出。它旨在简化在具有相似目标的多个类中实现的算法复杂性。该模式的统一方法使得代码更具适应性且易于维护，确保了系统各个部分之间的无缝集成。\n\
  \n通过掌握策略模式，你打开了在基于 `C#` 语言和 .NET 平台构建的遗留项目中识别其应用的大门。它不仅提供了一个历史视角，还为你提供了一个高层抽象工具，用于管理新项目和现有项目中的各种操作。这种理解可以显著提高你的代码质量，使其更具扩展性和健壮性。\n\
  \n本章为你提供了一个深入研究策略模式实际应用的宝贵机会。通过遵循使用 `C#` 语言的分步指南，你将构建一个真实世界的场景，获得实践经验。这种理论与实践之间的实体联系将丰富你的知识，并为你应对现代软件开发的挑战做好准备。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n- 策略模式概念\n- `C#` 和 .NET 示例\n- Azure Functions 在策略模式中的实际用法\n\
  \n## 目标\n\n学习本单元后，你将对策略模式有全面的理解，这是一个超越了纯理论知识的重要概念。你不仅将掌握它的基本原理，还将熟练地识别它的应用，特别是在\
  \ .NET 应用和现有项目中。在现有代码中识别策略模式是一项关键技能，它让你能够分析他人如何处理相似的挑战，并从他们的解决方案中获得见解。\n\n不仅仅仅是理解，本单元还赋予了你将在现实世界场景中应用策略模式所需的实际技能。通过弥合理论与实践之间的鸿沟，你能够在你的项目中有效地利用这种模式，增强软件的可维护性、灵活性整体质量。这种对策略模式的实践经验将成为一个坚实的基础，帮助你为复杂问题构建优雅的解决方案。\n\
  \n## 策略模式定义\n\n在深入策略模式的具体定义之前，理解 `C#` 语言中运行时（runtime）和编译时（compile time）的区别至关重要。编译时是指应用构建期间、项目运行之前识别和确认操作的阶段。例如，在运行\
  \ `ASP.NET Core` 的 Web 应用中，`C#` 实现中的语法错误等问题将导致 Visual Studio IDE 中出现构建错误。编译器识别的所有类型和类必须是有效的，这意味着它们在编译时必须是知的，包括它们在\
  \ `C#` 语言背景下的特定实现。\n\n相反，运行时是指只有在应用程序活动运行时才能识别的行为。与接口和逻辑实现相关的问题（依赖于页面请求或数据库连接等特定条件）在此阶段被检测。本质上，编译时处理已知的类型、类和语法行为，而运行时处理依赖于某些因素的更不确定的可变行为。\n\
  \n在这种语境下，策略模式起着重要作用，允许在运行时更改方法或实现的类型。根据特定条件，代码可能会在不同场景下创建不同的类，在封装操作复杂性方面提供了灵活性。类似的原理存在于其他模式中，例如工厂方法。\n\
  \n策略模式专门涉及为具有相似目的的类指定一个通用接口。策略模式类然后根据参数、条件或自定义验证确定应该实例化哪个具体类，从而符合业务和技术需求。这种方法促进了更具适应性和易于维护的代码结构，强调了策略模式在现代软件开发中的重要性。\n\
  \n## 策略模式结构\n\n在本章中，你将深入研究策略设计的复杂细节。在此过程中，你将发现如何将此概念应用于真实世界的场景，特别是实现全球递送应用程序的业务需求。但在开始这段旅程之前，熟悉策略模式的底层结构并理解其主要目标至关重要。\n\
  \n策略模式的核心是一个上下文类（context class），它负责协调决策过程，确定需要实例化哪个具体类。在运行时，该上下文类定义了主程序调用的特定策略类，这种关系在图\
  \ 14.1](#ch14.xhtml_fig14-1)中视觉化。这种动态方法允许代码具有适应性和模块化，使技术实现与业务环境不断变化的需求保持一致：\n\n\
  ![](img/Figure_14.1.png)\n\n图 14.1：策略模式图\n\n如图 14.1](#ch14.xhtml_fig14-1)所示，所有具体类都遵循相同的接口，从而促进了统一的方法。创建正确对象的逻辑从客户端应用程序中抽象出来，因为特定程序可能有多个选项可供选择。客户端应用程序不需要知道哪个类；相反，整个策略由上下文类进行协调，隐藏了决策过程的复杂性。\n\
  \n\n\n\n\n在现实应用中，这种方法可能变得特别强大。例如，一个涉及数百个类和复杂的微操作的复杂项目可能需要一个精心设计的策略模式。将这些复杂性从客户端应用程序中抽象出来，上下文类（context\
  \ class）的创建是实现该模式时最重大的挑战。在本章中，你将获得从零开始构建策略模式的操作机会。在一个假设但真实的场景需求指导下，你将获得关于如何应用这种设计方法来解决复杂问题的实践见解，增强代码的适应性和可维护性。\n\
  \n## 策略模式的实现\n\n在软件开发中，设计模式的应用应该与其旨在解决的特定问题密切对齐。不同的问题需要独特的解决方案，而多样化的需求需要定制的实现，以在不损害面向对象编程原则的前提下满足所有必要方面。考虑到这一点，请考虑一个假设场景：一家全球递送公司希望按城市监管流程，每个地区在税收、收入、就业和定价方面都有自己的规则。例如：\n\
  \n* 纽约市对所有交易征收 10% 的税，并将利润的 25% 用于派送。\n* 洛杉矶对交易征收 20% 的税，并留出利润的 10% 用于派送。\n* 圣保罗规定了\
  \ 10% 的税、15% 的利润率并强制要求全职员工。\n* 任何没有特定规定的城市都默认遵循纽约的要求。\n\n这种场景提供了多种实现途径，每种途径都有自己的挑战和细微差别。一个关键考虑是，此类应用程序可能需要扩展到许多城市，每个城市都有不同的业务规则。考虑到城市之间法律法规复杂性的差异，要设计一个支持无数法律要求的应用程序将是艰巨的。\n\
  \n为了保持架构一致性并处理这种复杂性，策略模式可以是一个非常有价值的工具。通过使用这种模式，客户端应用程序的对象实例化（可能涉及复杂的实现）可以保持简单，特别是在应用程序的高层。一个设计良好的策略基础设施将承担为每个城市创建正确实例的责任，无缝加载所有关于税收、就业和盈利的本地法规。\n\
  \n此示例的基础元素将与用户和递送实体相关的类。由于本章侧重于策略模式的实现，这些模型已经简化，省略了一些在现实应用中可能存在的属性和方法。第一个要构建的类是\
  \ `User` 类，其细节将在随后的 图 14.2 中所示。这一步标志着将强大的设计模式应用于复杂的、全球可扩展问题的实战旅程的开始：\n\n![](img/Figure_14.2.png)\n\
  \n图 14.2：User 类\n\n`User` 类设计用于封装策略模式类所需的本质信息，特别包含一个城市代码的属性。在本示例的上下文中，每个城市的独特需求需要创建一个不同的策略对象，以反映不同的实现方式。\n\
  \n作为 `User` 类的补充，必须构建一个 `Delivery` 类。该类捕获了有关递送实体的基础信息，封装了应用程序功能所需的基本细节。该类的结构以及与整体策略的关系可以在下方的\
  \ 图 14.3 中看到，该图展示了满足场景复杂性的、精简简练而又具有适应性的设计：\n\n![](img/Figure_14.3.png)\n\n图 14.3：Delivery\
  \ 类\n\n根据规定的要求，每个城市根据与税收和利润相关的不同规则运行。这些独特的规定意味着 `Delivery` 类的底层属性必须利用策略类的能力进行动态更改。因此，在定义了类的基本结构（如前面的截图所示）之后，对其实现进行进一步完善。具体来说，它必须被调整以适应专门逻辑注入。这种调整使得类能够根据每个城市的独特规则准确地修改税收和利润值，提供一种灵活且感知上下文的解决方案，以适应多样化的监管环境。\n\
  \n## 创建城市策略类\n\n为了增强策略模式实现的可测试性和扩展性，在定义基础结构时，选择接口而不是抽象类是明智的。这种选择符合现代开发实践，并提供了更灵活、更易于维护的基础。\n\
  \n在这一关键考虑的基础上，下一个需要创建的组件是城市策略类。该类在系统中充当中枢角色，规定了规范应用各种城市特定需求的合同。它包含了专门处理与每个不同地区税收、利润和就业相关的细微规则的方法，将它们整合成一个凝聚且健壮的策略。该类的视觉化表示（突出了它的核心特征以及它在系统内部建立的关系）如下方的\
  \ 图 14.4 所示：\n\n![](img/Figure_14.4.png)\n\n图 14.4：城市策略接口\n\n`City strategy interface`\
  \ 的显著之处在于它专门关注方法而非属性。这符合它的特定角色，即核心在于处理为每个城市的独特需求而定制的自定义实现。由于类的职责并不延伸到维护递送或用户对象的正确状态，因此属性是不必要的。\n\
  \n考虑到每个城市需要创建不同的对象，为每个城市指定一个实现城市策略接口的具体类（concrete class）会更有效。这避免了尝试将多维度的业务逻辑封装在一个单一、笨肿的类中可能产生的混乱和复杂性。另一个有益的做法是在设计模式实现中涉及的类后添加模式名称作为后缀。这有助于参与该项目的其他开发者识别模式，并可以简化分析，特别是在遗留项目的语境下。\n\
  \n现在城市策略接口已经就绪，下一步涉及修改之前指定的 `Delivery` 类。这涉及到将接口注入到 `Delivery` 类的构造器方法中，这是将接口功能集成到类行为中的关键步骤。\n\
  \n此外，税收和利润属性的 `get` 方法是由接口内部指定的底层方法定义的。这种结构确保了接口与类之间一致且凝聚的关系，接口有效地决定了关键属性的行为。这些关系和修改的视觉化插图如下方的\
  \ 图 14.5 所示，清晰详细地展示了这些组件如何在系统内部交互：\n\n![](img/Figure_14.5.png)\n\n图 14.5：带有策略接口的\
  \ Delivery 类\n\n\n\n\n\n`Delivery` 类的构造函数被设计为动态的，符合策略设计模式的原则。因此，它并不接收具体的城市策略类；相反，要实例化的类是在运行时确定的。这意味着在执行包含策略实现的例程之前，具体的类类型是未知的。在有了具体策略类的基础设施支持后，下一步是为每个城市创建一个单独的类，每个类实现城市策略接口。\n\
  \n然而，如果客户端应用程序突然扩展到大量不同的城市，这种方法可能会变得具有挑战性。这种增长将迫使我们按照“每个城市一个类”的模式创建许多单独的类。管理这种复杂性将非常困难，需要频繁重新部署应用程序以适应新城市的加入。在这种情况下，另一种方法可能更合适，例如使用一个由详尽的数据库结构控制其状态的单一类。这种结构可以正确地支持每个城市的特定规则，从而简化维护并提高可扩展性。\n\
  \n### 城市策略的实现\n\n对于当前的示例，由于它概述了三个城市（纽约、洛杉矶和圣保罗）的需求，需要创建三个相应的类。创建过程可以从纽约市类开始，其结构如图\
  \ 14.6 所示。这种方法确保了每个城市的独特需求都能被准确表示，为有效实现策略模式奠定了基础：\n\n![](img/Figure_14.6.png)\n\n\
  图 14.6：纽约策略类\n\n`NewYorkStrategy` 类遵循 `ICityStrategy` 接口，负责确定纽约市的就业规则。它被作为输入传递给\
  \ `Delivery` 类的构造函数，封装了将税收和利润计算应用于运费的逻辑。管理这些计算的方法可以在实现 `ICityStrategy` 接口的底层类中找到，遵循了本节之前概述的特定要求。\n\
  \n与纽约市建立的方法一致，必须额外创建两个类：一个用于圣保罗，另一个用于洛杉矶。这两个类都将实现 `ICityStrategy` 接口，该接口将根据用户的城市注入到\
  \ `Delivery` 类中。尽管为每个城市开发单独的类初看起来看起来可能是一项艰巨的任务，但考虑到可能实现的城市数量，这种复杂性是有其目的的。\n\n策略模式的主要目标是通过将复杂性抽象到软件的低层，来简化客户端应用程序。这意味着在应用程序的底层构建一个更复杂的架构，从而提高灵活性和可维护性。\n\
  \n在建立了纽约的第一个具体类后，下一步是为圣保罗和洛杉矶指定类似的类，每个类都实现相同的接口。例如，下面的细节展示了 `LosAngelesStrategy`\
  \ 类的实现，它与其同类遵循相同的结构原则，如图 14.7 所示：\n\n![](img/Figure_14.7.png)\n\n图 14.7：洛杉矶策略类\n\
  \n如之前的图 14.7 所示，类名带有策略后缀，便于在未来的维护中识别策略模式。从乍看之下，该类的实现可能是冗余的。但在现实场景中，确定利润和税收值可能需要复杂的操作，例如数据库调用或与外部服务的集成。\n\
  \n为了保持设计的完整性，建议将实现与外部变化隔离开，例如可能影响税收和利润方法产生的值的意外参数。这种方法与良好的软件开发实践非常契合，反映了 SOLID 指南中述的原则。通过遵循这些原则，适用于某个城市的任何更改都只需要在相应的策略类中进行修改。\n\
  \n强调单一职责原则（SRP）的重要性，值得注意的是，一个类应该只有一个更改的原因。例如，在配送客户端应用程序的上下文中，对纽约城市规则的任何更改都只会影响其底层类，而对系统的其他部分不受影响。\n\
  \n当纽约和洛杉矶的具体类几乎完成后，最后的任务是定义 `SaoPauloStrategy` 类。它的创建遵循相同的原则，具体实现可以在下面的图 14.8 中查看：\n\
  \n![](img/Figure_14.8.png)\n\n图 14.8：圣保罗策略类\n\n### 上文类与策略方法\n\n在此阶段，所有的具体城市类都已构建，客户端应用程序指定的策略已单独集成到每个相应的城市策略类中。正如策略设计模式概述的那样，现在需要创建上下文类（Context\
  \ class）。该类将负责制定城市策略类的正确实例，从而减轻客户端应用程序在为每种场景创建特定类方面的决策职责。\n\n考虑到这一点，必须设计一个策略方法类。它的功能是在某些标准的指导下返回正确的具体类。在本章的框架内，该标准是\
  \ `User` 类中的城市代码信息。因此，根据城市代码，系统负责制定城市策略类的精确实例。\n\n添加这种辅助结构似乎是可选的，但它的作用是增强开发人员的代码可读性。此外，它增加了开发针对策略设计模式类的有意义的单元测试和集成测试前景。\n\
  \n通常，在管理多个选项时，使用 `switch-case` 语句来监督策略方法类内部具体对象的创建。这在处理大量备选方案时特别相关。在某些情况下，可能需要更复杂的条件来协调创建正确实例的逻辑。然而，根据本示例的要求，简单的\
  \ `switch-case` 语句就足够了，如图 14.9 所示：\n\n![](img/Figure_14.9.png)\n\n图 14.9：策略方法类\n\
  \n如图 14.9 所示，该类具有一个接受城市代码作为参数的单一方法。根据该代码，switch-case 语句导航到相应的城市策略类以制定所需的具体对象。如果没有找到匹配的城市代码，则默认实例化纽约城市类。\n\
  \n这一实操探索的最后一步是在客户端应用程序中调用这些类。这可以表现为一个简单的控制台应用程序，建立用户和配送对象的实例。出于教学目的，至关重要的是构建封装了示例中定义的所有城市的实例。此外，可以设计单元测试，以确保每个不同的具体类都正确应用了利润、税收和就业规则信息。\n\
  \n\n\n\n要开始使用这些类，你可能从创建一个用户对象开始。具体而言，你可以定义纽约市，使用代码 `NYC` 作为策略方法类的参数，该操作在后的图 14.10\
  \ 所示：\n\n![](img/Figure_14.10.png)\n\n图 14.10：客户端应用程序\n\n构建了城市策略方法对象，随后在运行时实例化具体的城市策略类。这是通过将城市代码传递给\
  \ `SetCityStrategy` 方法实现的。按照该实现，将创建一个交付对象，并将城市策略对象作为参数提供。\n\n如果你选择显示税收、利润和就业数值，将检索到纽约市特定的正确值。这些数据与该城市在就业法规、税收和利润方面的预设要求一致，这种关系在随后的图\
  \ 14.10 中得到了进一步说明。\n\n正如本章强调的样，在客户端应用程序中使用策略模式基础设施可以提高简单性，并符合面向对象编程（OOP）的最佳实践。这种方法有效地将实现细节从目标类中封装出来，维护了\
  \ OOP 的基本原则。\n\n一旦完全掌握了策略模式，建议通过为本示例中所示的所有可能的城市创建用户和交付对象的实例来扩展这一实践。这种扩展允许开发单元测试，这是细致评估和验证结果的关键步骤。此类测试确保了应用程序能够对各种场景做出适当响应，增强了其健壮性和可靠性。\n\
  \n## 策略模式与 Azure Functions\n\nAzure Functions 是由微软 Azure 平台提供的无服务器计算服务，它与策略设计模式原则密切契合。与策略模式类似，Azure\
  \ Functions 鼓励开发模块化、独立的功能块，这些功能块可以在不更改核心应用程序架构的情况下进行更换或扩展。Azure 中的每个函数都类似于设计模式中的具体策略，封装了可以按需执行的特定逻辑，并可以针对各种场景或需求进行定制。\n\
  \nAzure Functions 与策略设计模式之间的关联强调了软件设计中灵活、可扩展的方法。正如策略模式允许对算法进行封装并在它们之间轻松切换，Azure\
  \ Functions 允许创建隔离的、可用的组件，这些组件可以无缝集成到应用程序的各个部分。这促进了代码的可维护性，降低了复杂性，并提供了适应变化的灵活性。此外，Azure\
  \ Functions 的无服务器特性意味着它们可以轻松扩展以满足需求，这反映了策略设计模式核心的适应能力和可扩展精神。它说明了经典设计原则的现代实现，是为云原生开发的需求和机会身定制的。\n\
  \n## 结论\n\n在本章中，我们探索了策略模式，这是一种设计方法，特别适用于需要在整个应用程序中应用一致的业务逻辑，但规则又根据特定业务需求而异的场景。利用这种模式的智慧在复杂项目中尤为凸显，它有助于简化架构、增强可维护性，并使开发人员能够在不影响现有代码的情况下安全地扩展功能。\n\
  \n本章提供的实际示例阐明了如何利用 C# 语言使用策略模式构建真实世界的场景。这个示例不仅是一个技术解决方案，它展示了一种为复杂问题应用精简解决方案的方法论，拥抱了面向对象编程的最佳实践。\n\
  \n当你继续下一章时，你将使用 C# 语言和 .NET 平台在设计模式领域开启新的探索。准备好深入研究观察者模式，并在你到目前为止书中培养的基础知识基础上继续。下一章有望加深你的理解并进一步提高你的技能，确保对这些核心编程概念有全面的掌握。\n\
  \n## 要点回顾\n\n*   策略模式让我们能够从客户端应用程序封装创建具体类背后的所有逻辑，作为扩展现有功能的灵活替代方案，而不会影响遗留代码。\n* \
  \  在应用程序需要在场景之间实现一组高度差异化的规则集的情况下，不建议使用策略模式。\n*   在策略模式实现中使用接口有助于我们实施单元测试和集成测试，并通过测试单个策略方法类来覆盖\
  \ 100% 的情况。因此，测试规范的制定并不昂贵，且具有巨大的收益。\n\n## 单选题\n\n1. 在哪种场景下推荐使用策略模式？\n    1. 当需要在编译时创建对象时\n\
  \    2. 当需要在运行时创建动态对象时\n    3. 当类共享相同需求时\n    4. 以上都不是\n\n2. 查看本章给出的示例，哪个类不包含代理模式所需的必要实现？\n\
  \    1. 纽约策略类\n    2. 洛杉矶策略类\n    3. 城市策略方法类\n    4. 用户类\n\n## 答案\n\n| 1 | B |\n\
  | 2 | D |\n\n## 思考题\n\n1. 解释策略模式的主要目的。\n2. 根据你在本章中所学的知识，创建一个本章示例之外的可以应用策略模式的假设场景。\n\
  3. 解释可以使用策略模式的场景类型。\n4. 你目前正在的项目中有没有实现策略模式？\n\n## 核心术语\n\n*   `compile time`：在项目运行之前可以被识别和发现的操作。\n\
  *   `runtime`：在应用程序实际运行时识别的特定行为。\n\n# 第 15 章 观察者模式](#contents.xhtml_ch15a)\n\n##\
  \ 引言](#contents.xhtml_sc2_225a)\n\n现代应用程序通常需要事件驱动通知以符合特定的业务需求。这需要一种健壮的软件架构，以向所有订阅者发送及时、准确的通知。本章详细介绍的观察者设计模式为这一挑战提供了宝贵的解决方案。它促进了能够检测对象变化的程序，并让我们能够及时准确地通知所有相关用户或客户端应用程序这些变化。\n\
  \n掌握观察者模式开启了在用 C# 语言和 .NET 平台开发的遗留项目中识别其应用的机会。此外，它让你能够将该模式集成到各种应用程序中，跨越移动、桌面和网页等各种平台。\n\
  \n![](img/fm1.png)\n\n\n\n\n\n本章将作为你应用观察者模式的实战指南。通过一个利用 C# 语言的实际示例，你将逐步构建一个真实世界的场景。无论你是在完善现有系统还是构建新系统，从本章中获得的见解和技能都将显著提升你创建更具响应性且互联的应用程序的能力。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   观察者模式概念\n*   `C#` 和 `.NET` 中的示例\n*   Azure Functions\
  \ 在策略 `pattern` 模式中的实际用法\n\n## 目标\n\n完成本单元后，你将对观察者模式有全面的理解。这些基础知识将使你掌握该模式的底层机制、应用场景以及它创建能够对对象变化做出响应的系统的潜力。\n\
  \n此外，你将能够识别 `.NET` 应用程序和现有项目中观察者模式的存在及其实现。这种识别模式的能力在你工作或分析各种项目时将证明是无价的，因为它让你能够看到如何利用观察者模式来增强整体结构和功能。\n\
  \n最后，本单元将为你在真实世界场景中应用观察者模式做好准备。无论你是在开发移动端、Web 还是桌面应用程序，通过本单元获得的实践技能都将帮助你有效利用观察者模式，根据特定需求进行定制，从而创建出更动态且互联的系统。\n\
  \n## 观察者模式定义\n\n如今，跨多个设备和平台的应用程序普及使得实时通知变得必要，从而增强了用户体验。特别是在移动应用程序中，通知已成为一项标准功能，并以无数方式实现。这代表了全球开发者面临的一个共同挑战；然而，解决方案并不需要重新发明，而是要针对独特场景进行适应。\n\
  \n自现代编程语言出现以来，事件驱动架构已被广泛利用。这种方法通常涉及应用程序使用事件来触发不同组件甚至不同服务之间的过程。应用程序对特定事件的反应在软件开发中并不是新颖概念；多年来一直从本质上被广泛应用着。\n\
  \n社交媒体应用程序拥有庞大的用户群，这进一步增加了通知挑战的复杂性。单一社交媒体平台可能拥有数百个需要传递通知的事件，每个事件都受到复杂的规则、权限和条件的限制。在这种背景下，使用简单且常见的模式变得至关重要。毕竟，此类应用程序的核心不仅在于通知，健壮的软件架构必须在不损害其他功能的前提下支持这一关键特性。\n\
  \n观察者设计模式为需要通知功能的应用程序提供了一种优雅且高效的解决方案。它广泛用于 `C#` 语言和 `.NET` 应用程序，其逻辑围绕着订阅者与特定对象的关联。如果一个对象需要根据另一个对象的变化接收通知，则通知对象必须促进订阅过程。\n\
  \n为了清晰地理解观察者模式如何运行，可以参考[图 15.1]。该图概述了模式的基本结构，并说明了需要接收通知的类（`Observer`）与负责启动这些通知的类（`Subject`）之间的关系。这种可视化有助于理解组件之间的相互作用，并阐明了为什么观察者模式已成为许多构建互联和响应式系统的开发者的首选解决方案：\n\
  \n![](img/Figure_15.1.png)\n\n图 15.1：观察者模式图\n\n`Subject` 类充当中心枢纽的角色，包含了其他类可能想要跟踪的信息，特别是当其状态或内容发生变化时。因此，具体的\
  \ `Subject` 类包含一个负责维护订阅者列表的私有属性。这些订阅者本质上是对接收通知表现出兴趣的对象。为了管理此列表，该类包含了附加和移除观察者的方法，在实际应用中通常称为\
  \ `subscribe` 和 `unsubscribe` 方法。\n\n如[图 15.1]所示，`Observer` 接口具有一个名为 `Update` 的方法。该方法必须由所有具体的观察者类实现并起着至关重要的作用。具体来说，`Update`\
  \ 方法由 `Subject` 类在其 `Notify` 方法中调用，用于观察者集合中的每一个单独对象。通过对接口的谨慎使用，观察者设计模式的实现允许各种具体类订阅通知。这赋予了该模式灵活性和扩展性，这些属性在复杂系统中被证明是很有益的。\n\
  \n在本章的后半部分，你将有机会通过从零开始构建利用观察者模式的真实世界应用程序来将理论付诸实践。提供的示例是一个博客应用程序，其中用户可以选择订阅通知。在这种情况下，每当他们关注的博客中创建新帖子时，订阅者将收到通知。这项动手练习不仅巩固了所探索的概念，还展示了观察者模式如何应用于常见的开发场景。\n\
  \n## 观察者模式实现\n\n与之前涵盖不同设计模式的章节一样，本章将引导你对之前在理论上解释过的观察者设计模式进行实际实现。这种实践经验将增强你识别现有项目中模式用法的能力，并使你能够在各种背景下应用它的能力。特别是，你会发现该模式在需要实现通知或任何事件驱动例行的场景中非常有用。\n\
  \n对于实际示例，我们将创建一个博客应用程序，允许用户订阅不同的博客。订阅后，每当他们关注的博客中创建新帖子时，他们将收到通知。这个动态应用程序可以托管多个微博客，由各种用户管理，并方便不同用户对广泛博客的多次订阅。\n\
  \n要开始，我们必须定义任何使用观察者设计模式的应用程序通用的接口。虽然不同系统之间的上下文可能不同，但主体（subject）和观察者（observer）的基础概念是一致的。因此，我们将从创建\
  \ `ISubject` 接口开始，它是模式不可或缺的一部分，如随后的[图 15.2]所示。该接口为模式在我们特定示例中的应用奠定了基础，同时也展示了它在不同应用程序中的灵活性：\n\
  \n![](img/Figure_15.2.png)\n\n图 15.2：Subject 接口\n\n`ISubject` 接口在定义主体与观察者之间的关系方面起着至关重要的作用。它包含了两个专门设计用于在主体具体类中管理观察者的方法。这些方法处理观察者的添加和删除，能够动态控制谁接收通知。此外，接口强制要求\
  \ `Notify` 方法，迫使具体类制定制定通知过程的独特逻辑，因为这可能随不同类而异。\n\n\n\n\n\n除了 `ISubject` 接口外，还必须定义\
  \ `IObserver` 接口。它为所有观察者类设定了合约义务，确保接收通知的方法是标准的。这种一致性增强了模式的灵活性和扩展性，使其能够轻松适应各种场景。这些关键接口及其关系的表示所示在随后的图\
  \ 15.3 中：\n\n![](img/Figure_15.3.png)\n\n图 15.3: 观察者接口\n\n`ISubject` 接口在定义主题与观察者之间的关系方面起着至关重要的作用。它包含了两个核心方法，专门设计用于在主题的具体类中管理观察者。这些方法处理观察者的添加和删除，能够对谁接收通知进行动态控制。此外，该接口还要求实现一个\
  \ `Notify` 方法，强制具体类制定管理通知过程的唯一逻辑，因为这种逻辑在不同类之间可能有所不同。\n\n除了 `ISubject` 接口外，还必须定义\
  \ `IObserver` 接口。它为所有观察者类设定了合约义务，确保接收通知的方法是标准的。这种一致性增强了模式的灵活性和扩展性，使其能够轻松适应各种场景。这些关键接口及其关系的表示所示在随后的图\
  \ 15.4 中：\n\n![](img/Figure_15.4.png)\n\n图 15.4: 类图\n\n在特定的场景中，`Blog` 类承担了主题的角色，因此实现了\
  \ `ISubject` 接口。相反，`User` 类承担了观察者的角色，履行观察者接口的要求。这种清晰的职责分工有助于模块化设计，使每个类都能专注于其在整个模式中的特定功能。\n\
  \n### 创建 User 类](#contents.xhtml_sc2_230a)\n\n具体 `User` 类的实现如下方的图 15.5 所示：\n\n![](img/Figure_15.5.png)\n\
  \n图 15.5: User 类\n\n在 `User` 类的实现中，`Update` 方法接收一个通用对象作为参数并将其强制转换为特定的 `Post` 对象。每当发生通知事件时，主题类都会调用此方法。使用通用对象进行通知提供了极大的灵活性，因为不同的类可能预期接收不同类型的通知。\n\
  \n如之前所示，为了演示目的，`Update` 方法在屏幕上显示了用户名和博客文章的标题。这种即时反馈允许你跟踪观察者模式实现中的活动。在现实世界中，该方法可以用于向移动应用程序中的用户展示收件箱通知，或者通过新博客文章的详情来刷新显示。\n\
  \n相反，在此语境下，`Blog` 类充当主题类，并且必须遵守相关的接口。这需要对处理观察者附加和解绑的方法进行定制化规范，并实现负责通知所有已订阅观察者的方法。为了演示的清晰起见，`Blog`\
  \ 类的结构随附图 15.6 所示：\n\n![](img/Figure_15.6.png)\n\n图 15.6: Blog 类\n\n如前述图 15.6 所示，`Attach`\
  \ 和 `Detach` 方法仅承担修改类内私有观察者列表的任务。这些方法对于管理客户端应用程序中可能发生的订阅事件至关重要。遵循观察者设计模式的原则，`Notify`\
  \ 方法系统地遍历观察者列表，在每个观察者对象上执行 `Update` 方法。\n\n结论，`Notify` 方法由 `AddPost` 方法调用，而该方法每当博客中添加新文章时就会被触发。`AddPost`\
  \ 和 `Notify` 方法之间的这种紧密集成体现了事件驱动的开发哲学，使应用程序在生成新文章时分发通知的核心功能上具有可靠的行为。\n\n### 创建博客文章类](#contents.xhtml_sc2_231a)\n\
  \n博客文章的实现可以从提供的图 15.7 查看：\n\n![](img/Figure_15.7.png)\n\n图 15.7: Post 类\n\n在云应用中，特别是在关键需求处理过程中跨越大量设备的通知时，队列的概念被广泛使用。实时通知是现代开发的主流，.NET\
  \ 平台通过 SignalR 技术拥抱了这一点。SignalR 允许客户端与服务器之间的实时通信，遵循了观察者设计模式概述的订阅者概念。\n\n在此语境下，客户端应用程序（无论是浏览器中打开的网页还是桌面应用程序）在观察者模式中承担了主题的角色。如果客户端应用程序发生任何变化，必须通知服务器。随后，所有必要的更改必须在订阅特定事件的众多设备之间同步。SignalR\
  \ 代表了一项强大的技术，极大简化了实时应用（如聊天平台或实时交互屏幕）的开发。\n\n此时，你已经具备了使用假设数据实现并充分测试观察者模式的所有必要基础设施。考虑到\
  \ `User` 类中 `Update` 方法的自定义实现，你可以检查输出以完全理解你的解决方案的精确行为和有效性。\n\n### 客户端应用程序](#contents.xhtml_sc2_232a)\n\
  \n为了准确模拟现实场景，你可以通过手动创建多个 `User` 类实例来继续。接下来，你需要创建一个 `Blog` 类实例。一旦创建了这些实例，最后一步是将用户对象附加到\
  \ `Blog` 类中。该过程见随附的图 15.8：\n\n![](img/Figure_15.8.png)\n\n图 15.8: 客户端应用程序\n\n之前的截图显示了控制台应用程序，提供了该过程的逐步演示。最初，创建了三个用户对象，分别为\
  \ `userOne`、`userTwo` 和 `userThree`。随后，将这些对象都附加到博客对象。然后，创建了一篇新文章并添加到博客中。如果你运行应用程序，结果输出将如下图\
  \ 15.9 所示：\n\n![](img/Figure_15.9.png)\n\n图 15.9: 客户端应用程序结果\n\n为了理解实现的结果，记住应用程序执行的操作序列至关重要，详细所示：\n\
  \n1. 创建 `User` 类的新实例。\n2. 实例化 `Blog` 类对象。\n3. 将用户对象附加到 `Blog` 类，从而订阅它们以便在创建新文章时接收通知。\n\
  4. 使用 `Blog` 类中的相关方法将新文章对象添加到博客。\n5. `AddPost` 方法触发 `Notify` 方法，随后调用用户类中的 `Update`\
  \ 方法。该部分的具体实现见下方的图 15.10：\n\n![](img/Figure_15.10.png)\n\n图 15.10: Update 方法\n\n\
  \n\n\n\n正如本章所演示的，实现观察者模式需要对发送通知的类和接收通知的类都进行修改。为了便于该模式的识别和维护，强烈建议对所有涉及的接口和组件使用描述性且直观的名称。这样做不仅有助于其他开发者在项目维护阶段进行工作，还能确保遵循该设计模式的底层原则，特别是当未来需要对应用程序进行扩展时。\n\
  \n我们希望本章内容能让你对观察者模式有坚实的理解。基于你通过这个实操演练所获得的见解，我鼓励你去探索并创建更多使用观察者模式的场景。在本处提供的示例之外进行尝试，将为你提供无足珍贵的实操经验，并加深你对这一核心设计概念的掌握。\n\
  \n## 结论\n\n在本章中，你深入学习了观察者模式，它是软件开发中的基石，特别是当应用程序需要向多个对象发送通知时。\n\n观察者模式不仅仅是一个理论概念；它还是当今应用中广泛使用的实用设计模式。它的相关性延伸到各种现实世界的场景，例如在社交媒体应用中管理跨不同设备和海量用户的用户的通知。该模式作为开发者工具箱中最受欢迎的工具之一脱颖而出。\n\
  \n通过使用 C# 语言的实操示例，本章引导你了解实现观察者模式的复杂之处，同时遵循了 SOLID 原则等最佳实践，并拥抱了面向对象的编程范式。\n\n进入下一章时，你将学习到\
  \ .NET 应用中其他常用设计模式的简要概述，这些模式在本书之前的章节中尚未涉及。接下来的部分还将为你提供有关在现实应用中有效运用这些设计模式的重要实践方法和建议。通过将理论概念与实际实现相结合，本书旨在为你提供在现代软件开发中脱颖而出所需的技能和知识。\n\
  \n## 要点回顾\n\n- 观察者模式允许根据事件实现向多个对象发送通知的必要逻辑。\n- 强烈建议在观察者模式的实现中使用接口，以获得更灵活、可扩展的软件架构。\n\
  \n## 单选题\n\n1. 根据你所学的内容以及本章给出的实操示例，`Notify` 方法应该在哪个类中实现？\n    1. 在主体类（subject）中\n\
  \    2. 在静态类中\n    3. 在外部服务中\n    4. 在观察者类（observer）中\n\n2. 在本章给出的实操示例中，哪个类代表观察者类？\n\
  \    1. 博客类 (blog class)\n    2. 文章类 (post class)\n    3. 用户类 (user class)\n   \
  \ 4. 均不是\n\n## 答案\n\n| 1 | A |\n| 2 | C |\n\n## 思考题\n\n1. 解释观察者模式的主要目的。\n2. 根据你在本章中所学的内容，创建一个本章示例之外可以应用观察者模式的假设场景。\n\
  3. 解释观察者模式适用于哪些类型的场景。\n4. 你目前正在的项目中有是否有实现了观察者模式的？\n\n## 核心术语\n\n- **观察者类 (Observer\
  \ class)**：期望接收通知的类。\n- **主体类 (Subject class)**：负责向所有订阅对象发送通知的类。\n\n## 加入我们书籍的 Discord\
