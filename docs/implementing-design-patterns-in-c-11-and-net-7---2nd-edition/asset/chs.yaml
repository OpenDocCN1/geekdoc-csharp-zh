  \n### 循环、运算符和迭代器 #contents.xhtml_sc3_13a)\n\n\n#### While 语句 [#contents.xhtml_sc4_14a)\n\
  \n使用 `while` 语句，可以执行操作直到预定义的条件不再满足（假）。程序在循环开始时测试条件，如果测试结果为真，则循环将继续执行。它的用法与 C# 语言中用于循环操作的其他语句类似。尽管如此，在此情况下用于条件的语法对于试图解释和调试代码的开发者来说是足够清晰的。因此，用于判断循环是否应该继续运行的条件对开发者来说是易读的，因为它们位于循环的开头。[图\
  \ 1.21 中有一个 `while` 语句的示例，它有一个持续运行直到条件不满足的条件：\n\n\n图 1.21: C# 中的 While\n\n图 1.21\
