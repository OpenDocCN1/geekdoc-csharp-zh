  \ `Python` 等其他编程语言中的做法。\n\n### 总结\n正如你在本章中学到的，工厂方法模式有助于以简单高效的方式管理复杂对象的创建，并使用了关于封装和多态的最佳实践。考虑到该模式广泛使用了接口和抽象类，可以在整个项目中保持一致的架构，从而充分利用\
  \ Mock 对象进行测试和其他目的的用处。这种模式减少了类之间的依赖性，并使我们具备扩展功能的潜力，而不会对旧代码产生任何影响。\n\n在本章中，你学习了如何在真实场景下用\
  \ `C#` 语言实现工厂方法模式，并展示了理解设计模式通用核心要点的能力。这支持了软件开发中针对常见问题使用通用解决方案的能力。\n\n在下一章中，你将有机会结合\
  \ `C#` 语言和 `Entity Framework` 学习适配器（Adapter）模式。\n\n\n\n这正是适配器模式健壮性发挥作用的地方。它有助于构建一个统一的接口，促进在原生不支持兼容输入输出的系统之间进行无缝通信。重要的是，这种障碍并不仅限于不同实体开发的系统，也可能出现在同一组织内的遗留项目与新启动项目之间。\n\
  \n\n通过本章，你将使用 `C#` 语言深入探讨适配器模式的细节。这些原理将在一个实用的、逐步的示例中得到阐释，为深入理解和应用这一关键模式铺平道路。\n\n\
  \n在本章中，我们将讨论以下主题：\n\n*   适配器设计模式定义\n*   适配器设计模式实现\n\n## 目标\n\n在本章中，我们的目标是多方面的。首先，我们旨在加强你对系统集成的理解，这是当今多样化应用格局中的关键需求。\n\
  \n\n第三，我们打算彻底探索适配器模式如何维护 SOLID 原则，特别是开闭原则，以实现有效的非破坏性集成。\n\n最后，我们将使用 `C#` 语言通过实用的、逐步的示例来解析这些概念，从而演示适配器模式在现实场景中的应用。\n\
  \n\n## 适配器模式定义\n\n适配器模式在软件开发领域占据重要地位，是集成各种系统的关键促进者。开发者经常需要应对各种组件之间的兼容性问题。此外，为特定目的设计的组件在与其他组件集成时，可能会提出额外需求。其目标是在确保无缝集的同时保持原始系统的完整性，避免对源目标组件进行破坏性更改。\n\
  \n\n适配器的作用是桥接原生不兼容接口之间的鸿沟，在保持原始组件完整的同时利用它们的功能。例如，如果一个系统需要处理 `JSON` 格式的数据，但遗留项目提供\
  \ `XML` 格式的数据，那么保留原始系统中的 `XML` 格式是非常明智的。与其破坏现有的接口，不如创建一个适配器，将遗留系统的 `XML` 数据转换为所需的\
  \ `JSON` 格式。集成通常涉及第三方软件，这些系统的可能并不开放修改。鉴于适配器必须在不影响涉及组件的情况下构建，该模式要求创建适配器。该类负责将源格式转换为目标格式。这种做法是集成的一个不可或缺的，并符合\
  \ SOLID 原则的核心原则——开闭原则。通常，适配器设计模式的结构如下图所示：\n\n![虽然系统集成的复杂性会有很大差异，但适配器模式的基本结构保持一致。它扩展了接口，通常是为了调和源目标之间的通信，而它们在输入和输出格式上往往存在不兼容性。这种设计模式提供了多个连接器和适配器的灵活性，它们相互独立运行。这种独立运行极大地减少了在生产环境中出现不兼容错误的风险，确保了更流畅、更可靠的系统性能。\n\
  \n\n与之前章节对其他设计模式的探索一样，全面理解适配器模式需要通过实践。我们将实现一个镜像现实场景的项目。考虑一个拥有遗留系统的在线商店，该系统开发于二十年前，以\
  \ `XML` 格式提供客户信息。基于 `XML` 的系统在二十年前是一种流行格式，由于其稳定性以及商店与软件供应商之间的长期合同，它一直得到维护。因此，保持当前接口完好对于确保与现有供应商继续合作至关重要。\n\
  \n相比之下，公司的其他系统采用了如 `.NET Core` 和 `C#` 语言等现代技术。这些新系统暴露的所有 API 都使用 `JSON` 格式和 `REST`\
  \ 技术。因此，遗留系统的输出与主要使用 `JSON` 格式消息的新系统并不直接兼容。\n\n\n\n\n另一种方案是修改遗留系统以提供 JSON 格式的响应，从而确保与其他系统的兼容性。然而，场景明确规定该系统不允许修改。由于无法访问源代码，且提供者拒绝允许对产品核心进行更改，这排除了这一选项。\n\
  \n\n根据适配器模式建议的结构以及给定场景的要求，解决方案的实现应该指定一个适配器。该适配器负责将遗留系统的响应转换为新系统可以解释的格式。这种策略为应用程序与其他各种其他系统的连接提供了可能，如果它们的数据需要转换为目标应用程序可以理解的格式。\n\
  \n正如这种解决方案类型所所示的，在促进数据库集成的库中（如 `Entity Framework` 和 `Hibernate`），我们经常可以找到类似的方法。本质上，这些库建立了一个包装器来连接两个不同的系统（应用程序和数据库）。标准的\
  \ `ADO.NET` 技术提供了通用接口，允许任何数据库提供程序为 `C#` 语言开发自己的包装器。正如你可能注意到的，`ADO.NET` 中的某些类带有 `adapter`\
  \ 后缀，这意味着它们遵循与适配器设计模式相同的概念。\n\n\n![](img/Figure_10.2.png)\n\n图 10.2：适配器模式实现图\n\n\
  \n在现实情况下，维护和识别设计模式可能会变得具有性，特别是当它们与其他模式交织且缺乏清晰、描述性的命名时。当使用不恰的模式来解决特定问题时，也会出现复杂情况。在某些项目中，发现实现设计模式并不罕见，这并不是因为项目需要，而是因为开发者想要学习该模式。然而，部署特定设计模式的决定应该始终由业务需求和当前的问题来引导。\n\
  \n关于我们涉及适配器模式的假设场景，我们的下一步行动是生成实现此模式所需的代码。鉴于遗留系统负责提供用户信息，我们需要开发类来模拟其行为。要创建的类是 `Customer`\
  \ 类，它被遗留项目使用，如后续 图 10.3\n\n图 10.3：Customer 类\n\n如前述 图 10.3 中描述的结构：\n\n![](img/Figure_10.2.png)\n\
  \n图 10.2：适配器模式实现图\n\n要创建的类是 `Customer` 类，它被遗留项目使用，如后续 图 10.3\n\n图 10.3：Customer\
  \ 类\n\n如前述 图 10.3 中描述的结构：\n\n![](img/Figure_10.2.png)\n\n图 10.2：适配器模式实现图\n\n要创建的类是\
  \ `Customer` 类，它被遗留项目使用，如后续 图 10.3\n\n图 10.3：Customer 类\n\n如前述 图 10.3;\n}\n```\n\
  \n接下来，我们实现 `CustomerLogic` 类，它代表遗留系统。\n\n```csharp\nclass CustomerLogic\n{\n   \
  \ public List<Customer> GetCustomers()\n    {\n        // Legacy implementation\n\
  \        return new List<Customer>();\n    }\n}\n```\n\n等等，在我们的场景中，我们需要创建 `Customer`\
  \ 类来模拟遗留系统的行为。\n\n```csharp\nclass Customer\n{\n    public string Name { get; set;\
  \ }\n    public int Age { get; set; }\n}\n```\n\n现在，我们创建 `CustomerAdapter` 类，它实现了\
  \ `ICustomer` 并包装了 `CustomerLogic`。\n\n```csharp\nclass CustomerAdapter : ICustomer\n\
  {\n    private readonly CustomerLogic _customerLogic;\n\n    public CustomerAdapter(CustomerLogic\
  \ customerLogic)\n    {\n        _customerLogic = customerLogic;\n    }\n\n    public\
  \ List<Customer> GetCustomers()\n    {\n        var customers = _customerLogic.GetCustomers();\n\
  \        // Transform or process as needed\n        return customers;\n    }\n}\n\
  ```\n\n最后，我们在 `Program` 类中使用该适配器。\n\n```csharp\nclass Program\n{\n    static void\
  \ Main(string[] args)\n    {\n        CustomerLogic logic = new CustomerLogic();\n\
  \        ICustomer adapter = new CustomerAdapter(logic);\n        var customers\
  \ = adapter.GetCustomers();\n        // Process customers\n    }\n}\n```\n\n\n\n\
  本章阐明了适配器模式的威力，它是解决那些本质上不共享兼容输入输出格式、但又需要交互和通信的系统的解决方案。适配器模式作为最频繁实现的设计模式之一，显著增强了基于面向对象编程的软件应用程序之间的通信。\n\
  \n该模式的支撑是 SOLID 原则中的**开闭原则**，它促进了在不修改相关组件行为的情况下扩展功能实践。因此，源类和目标类（或组件）可以保持现有接口，同时提供接口扩展性，以适应不同内容和格式的数据。在这里，适配器模式通过单一的适配器类承担了两个组件之间数据转换的责任。\n\
  \n通过本章，你不仅学会了如何使用 C# 在实际场景中应用适配器模式，还对更广泛的设计模式的核心目的有了深入的理解。也就是说，设计模式为软件开发挑战提供了解决方案，且这些方案符合面向对象编程的最佳实践，并被业界广泛接受。\n\
  \n在进入下一章时，将继续通过 `C#` 和 `.NET` 平台深入研究设计模式。这一探索将包括对组合模式的研究，进一步充实你在书中之前章节中积累的全面知识。\n\
  \n## 要点回顾\n\n*   尽管适配器模式属于较简单的设计模式，但它在集成异构系统方面具有巨大的威力。\n*   适配器模式的实现并不需要创建大量的类或复杂的层级——编写适配器类是至关重要的。\n\
  *   该模式广泛应用于负责数据库交互和外部资源操作的库中，凸显了它的实用性和有效性。\n\n## 单选题\n\n1.  下列哪项不能正确描述适配器模式？\n\
  \    1.  适配器模式有助于集成异构系统\n    2.  适配器模式复杂且难以实现\n    3.  数据库集成经常使用适配器模式\n    4.  以上均都不是\n\
  \n2.  控制系统集成的逻辑应该位于哪个类中？\n    1.  `Adapter class`\n    2.  `Client application`\n\
  \    3.系统中的 `Abstract class`\n    4.  `Source class`\n\n## 答案\n\n| 1 | B |\n| :---\
  \ | :--- |\n| 2 | A |\n\n### 思考\n\n1.  阐明适配器模式的主要目标。\n2.  根据本章学到的知识，设计一个除示例示例之外的假设场景，在该场景下适配器模式可以有效部署。\n\
  3.  阐述使用适配器模式的优点。\n4.  你目前参与的项目是否有采用适配器模式的？\n\n## 关键术语\n\n*   `Client Application`：这是系统最抽象的层，通常包含用户界面。\n\
  *   `System Integration`：这是使用指定协议实现各个组件之间通信的过程。\n*   `API`：应用程序接口通常设计用于促进异构系统之间的集成。\n\
  *   `Cache`：在软件开发领域，缓存涉及将数据存储在性能优于原始源的位置。\n\n加入我们书的 Discord 空间获取最新更新、作者和讨论：[`discord.com/example`](https://discord.com/example)\n\
  \n（组合模式图片）\n\n![](img/fm1.png)\n\n# 第 11 章 使用 ASP.NET 的组合模式 (Composite)\n\n## 引言\n\
  \n在任何编程语言中管理层级和递归结构可能是一项艰巨的任务，由于性能、复杂性和逻辑的问题。然而，组合模式解决了这一挑战，为需要多个嵌套层级的场景提供了优雅的解决方案。该模式与我们之前讨论过的替换替换原则密不可分。\n\
  \n理解组合模式不仅是一个学习里程碑；它是一个深入理解接口正确利用的机会。此外，它从 SOLID 原则、面向对象编程到质量保证各个方面，促进了对可扩展性、可维护性和可测试性等高级概念的探索。\n\
  \n在本章中，我们将超越理论知识，通过将组合模式应用于示例，你将获得实践经验。我们将引导你使用 `C#` 逐步创建一个真实的应用程序。你不仅将理解组合设计模式的机制，还将掌握其实现方法。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   组合模式定义\n*   组合模式实现\n*   代码示例与练习\n\n## 目标\n\n本章将加深你对组合模式的理解，这是一种处理编程中层级和递归结构的设计模式。通过教授理论方面、现实应用以及有效使用组合模式的情况，将提升你的解决问题和软件设计能力。\n\
  \n你还将学习 SOLID 原则、面向对象编程和设计的五大核心原则，以及组合模式如何体现这些原则以创建健壮、可扩展且可维护的代码。最后，你将有机会在真实的编程场景中应用组合模式，按照分步指南解决复杂问题，这将增强你对未来项目中使用组合模式的理解和信心。\n\
  \n## 组合模式定义\n\n组合模式指出集合的行为应该与任何单个对象相同。本质上，它模糊了单个对象和组合对象之间的边界，确保无论是单个对象还是一组对象，都可以调用操作。这种统一的接口允许以统一的方式处理单个对象和组合。\n\
  \n在现实世界中，组合模式模仿了树形结构，其中一个元素可以拥有许多相同的子元素，从而建立了父子关系。这使得像调用父元素一样无缝地调用子元素成为可能。这种结构层级的视觉表示见图\
  \ 11.1：\n\n![](img/Figure_11.1.png)\n\n图 11.1：组合模式图\n\n\n\n在这种特定语境下，组件既可以是单个元素，也可以是包含多个子元素的父元素。客户端应用程序对元素的组成保持无感知，从而以统一的方式处理所有元素。这种抽象隐藏了父元素和子元素之间的区别。正如前面提到的，参与此过程的所有组件和类都是相同类型，或者共享一个公共接口。这种方法利用封装的概念，将实现的复杂性从客户端应用程序中屏蔽掉。这是对第\
  \ 3 章面向对象编程基础概念》中解释的**里氏夫替换原则**的实际演示。\n\n组合模式也可以用层级图来表示，以便于视觉理解。这种表示方法更能反映该模式频繁应用的的场景。如图\
  \ 11.2 所示，一个特定的元素可以拥有多个子元素，尽管它们是相同类型的。这种说明性的方法不仅简化了理解，还让模式的应用更加直观：\n\n![](img/Figure_11.2.png)\n\
  \n图 11.2：层级表示\n\n这种树形结构是组合模式的一个特征特征，渗透在各种应用中，包括跨 Web、移动和桌面平台的菜单界面组件。由于该模式的架构类似于树结构，图中的单个元素通常被称为“叶子节点”，而包含子元素的元素被称为“组合节点”。通过一个真实世界的示例，你将更容易掌握组合模式的概念和用法。接下来的章节将提供一个观察和实现涉及此模式项目的机会。\n\
  \n有趣的是，组合元素也可以包含其他组合作为子元素，以适应特定需求。这种模式优雅且灵活地允许在相同类型的类之间或共享相同接口的元素之间创建无限的层级关系。此外，它可能减少了所需的类数量。只要为解决方案中所有层级的相关元素定义一个通用的模式，它为构建复杂的结构铺平了道路。因此，组合模式为处理复杂的对象层次结构提供了一种高效的解决方案。\n\
  \n## 组合模式实现 (#contents.xhtml_sc2_174a)\n\n理解任何设计模式最有效的方法将其嵌入程序中，从而亲身验它的优势和局限性。使用设计模式的原理应主要以问题为导向。只有当系统需要实现共享相同接口的类之间的层级关系时，才应该使用组合模式。\n\
  \n考虑一个在线商店提供单个产品的场景。假设公司决定将这些产品组作为捆绑产品进行销售。尽管捆绑产品本质上是单个产品的集合，但它必须被视为一个独立的产品，拥有自己的价格、名称、条形码和其他规格。\n\
  \n随着系统的演进，假设的公司可能会引入更多产品组合作为组合单品，从而增加系统的复杂性。维护这样一个系统变得越来越具有挑战性。组合模式旨在解决正这个问题，提供了在父元素中嵌入无限数量子元素的灵活性。这种完整的实现引入了新的障碍，例如数据库结构、性能和实体关系。然而，本节的示例场景专注于应用的实现部分，使用了\
  \ C# 语言。\n\n给定场景并遵循组合模式的架构，我们的系统需要完成以下任务：\n\n*   为 `Product` 实体建立通用接口。\n*   开发实现\
  \ `Product` 接口的具体 `Product` 类。\n*   定义组合类及其添加和删除子元素的方法。\n*   指定子类特有的自定义方法。\n\n根据组合模式的定义并需求，元素可能包含也不包含子元素。尽管所有元素共享相同的接口，但必须在组合类中定义一个特定的自定义方法，以区分单个元素和组合元素。根据本节指定的\
  \ string，我们在线商店的实现将镜像图 11.3 所示的结构：\n\n![](img/Figure_11.3.png)\n\n图 11.3：组合模式实现\n\
  \n如前面的图 11.3 所示，`Combo` 类和 `Product` 类共享相同的接口，尽管 `Combo` 类专门包含添加和删除产品的方法。鉴于 `Combo`\
  \ 是包含其他产品的产品，该类体现了组合模式定义的组合类。值得注意的是，接口的恰当使用使我们能够创建有价值的抽象，正如通过各种设计模式的实现所演示的。\n\n\
  深化对接口、继承和抽象类等高级概念的理解至关重要。如果这些概念对你来说很陌生，建议参考第 5 章《设计模式简介》，该章节将使用 C# 语言通过详细解释和实际示例阐明这些主题。\n\
  \n本节的目标是构建一个能够创建产品的在线商店，前提是某些产品可以代表作为单个实体销售的多个产品列表。正如本节之前提到的，符合我们目标的实现第一步是创建一个所有产品都使用的通用接口。在此语境下，一组产品被称为\
  \ `Combo`。因此，使用 Visual Studio 创建一个控制台应用程序并制定一个镜像下方图 11.4 所示结构的接口：\n\n![](img/Figure_11.4.png)\n\
  \n图 11.4：IProduct 接口\n\n该接口应该封装 `Product` 和 `Combo` 类之间共享的所有属性和方法。每个类将执行有关细节和定价的唯一逻辑。要注意并不是所有产品都包含子产品。此外，只有组合类应该包含添加和删除子元素的例程。这些方法故意从接口中删除，以避免实现中的错误和对组合模式的误用。接口指定的\
  \ `Category` 属性将由具体类用于区分单个产品和 Combo。\n\n一旦建立了接口，下一阶段涉及创建 `Product` 和 `Combo` 类。在你的控制台项目中，创建一个名为\
  \ `Product` 的新类并实现 `IProduct` 接口，如下图 11.5 所示：\n\n![](img/Figure_11.5.png)\n\n图 11.5：Product\
  \ 类\n\n\n\n\n如代码段所示，该类包含了接口中定义的所有属性和方法。`GetProductDetails` 方法的实现展示了产品详情的摘要，例如名称、价格和类别。这仅用于演示目的。在现实场景中，此方法将涉及从数据库中获取信息，或执行更复杂的逻辑来组装产品详情。尽管如此，当前的实现已足够让你熟悉复合模式的行为，并能够区分单个\
  \ `Product` 与包含子产品的复合对象。\n\n`Product` 类中的 `GetPriceDetails` 方法体现了显示产品原价的功能。它目前尚不能适应特殊折扣的适用。因此，所有将单个产品作为其子产品列表一部分的对象（即\
  \ `Combo` 类）将自动继承该值。这种结构使我们能够在尽管它们共享相同接口的情况下，仍能维护单个产品与复合对象之间的独立性。最终，所有的复合对象本身都是产品。\n\
  \n接下来的阶段需要创建 `Combo` 类。`Combo` 是一个包含关联产品的产品。请注意，这不同于仅仅对对象进行分组。`Combo` 类保留了与单个产品相同的特性，如名称、价格和其他属性。参考图\
  \ 11.2 所示的图，`Combo` 是一个封装其他节点的产品。每个单独节点可以包含一个子产品，递归地，一个子产品可以由多个子产品组成。这种配置为描述需要产品与子产品之间层级关系的业务流程提供了一种强大且灵活的结构。`Combo`\
  \ 类的实现见于图 11.6：\n\n![](img/Figure_11.6.png)\n\n图 11.6: Combo 类\n\n`Combo` 类与 `Product`\
  \ 类不同，它实现了 `IProduct` 接口并引入了区别。在 `Combo` 类中，添加了一个私有属性来表示构成组合部分的子产品。\n\n此外，该类包含两个特定方法：`AddProduct`\
  \ 和 `RemoveProduct`。这些方法分别负责向子产品列表添加新产品和移除现有产品。虽然为了演示目的这些方法的内容保持隐藏，但它们的实现细节将在下文中提供。\n\
  \n在 `Combo` 类中包含 `IProducts` 列表是作为如何将普通独立类转换为复合对象的示例。虽然 `Product` 和 `Combo` 类具有相似之处，但\
  \ `Combo` 类包含了额外的逻辑来管理与 combo 实例绑定的子产品。\n\n如图 11.5 所示，`Product` 类中的 `GetProductDetails`\
  \ 和 `GetProductPrice` 方法设计为仅关注产品本身。相比之下，`Combo` 类中的这些方法表现出更大的复杂性，包含了同时也监控其子产品的代码。需要注意的是，每个子产品的细节使用了源自子元素的方法，如随后的图\
  \ 11.7 所示：\n\n![](img/Figure_11.7.png)\n\n图 11.7: Combo 类详细方法\n\n`Combo` 类中的 `GetProductDetails`\
  \ 方法包含了一种定制实现，其范围超出了仅仅显示 Combo 。它系统地执行一个循环，遍历子产品列表，并调用子元素的相应方法。通过这样做，它确保了子类的实现保持完整，同时父类保留了对自身方法的自主权。\n\
  \n至重要的一点是，复合对象可能是其他复合对象的节点，从而在所有共享共同 `IProduct` 接口的对象之间建立无限的层级关系。如果开发的实现未能允许这种复杂性，则表明复合模式可能实现不当。\n\
  \n继续探索 `Combo` 类方法，如前述图 11.7 所示，`GetPriceDetails` 方法遍历每个子产品。在此过程中，它增量地累加到 `Combo`\
  \ 类的 `Price` 属性上以计算最终价格。因此，子类中的相同方法与复合类中的方法区别开来。\n\n至此，我们完整的复合模式实现已经完成并准备好部署。现在已经为在客户端控制台应用程序中使用这些类做好了。\n\
  \n考虑一个现实场景，一家在线商店提供三种产品：书、笔记本电脑和显示器，每种产品都有其独特的定价。偶尔，促销活动允许商店提供一个名为 `techCombo` 的组合包，包含所有三个产品。在复合模式的框架下，单个物品——书、笔记本电脑和显示器——将使用\
  \ `Product` 类定义，而 `techCombo` 将通过 `Combo` 类构建，反映了组合包含子产品的事实。\n\n一旦创建了前三个产品的独立实例，必须将它们添加到\
  \ combo 对象中，以符合复合模式。这一过程在下方的图 11.8 所示：\n\n![](img/Figure_11.8.png)\n\n图 11.8: 客户端应用程序\n\
  \n在 `main` 方法中，前三行用于创建三个独立产品。每个产品通过为 `Name`、`Price` 和 `Category` 属性分配特定值来定义。随后，在第\
  \ 13 行实例化 `techCombo` 对象。\n\n后续行用于将三个产品添加到 `techCombo` 对象中。鉴于 `Combo` 类配备了管理添加和移除新子产品的专门方法，因此熟悉\
  \ `Combo` 类特有的方法是非常关重要的。\n\n这些 `Combo` 类特有且对其功能至关重要的方法，在下方提供的图 11.9 中被清晰地突出：\n\n\
  ![](img/Figure_11.9.png)\n\n图 11.9: 添加 (AddProduct) 和移除 (RemoveProduct) 方法\n\n最后，本章的目标是引导你理解并熟悉复合设计模式。这种模式多年来一直是软件开发的基石，并继续被广泛应用。我鼓励你开启自己的项目，创建一个假设的场景，让你能够将本章中获得的知识和见解转化到新的背景和应用中。通过这样做，你将有机会进一步探索并调整这种多功能模式以适应各种情况。\n\
  \n结论\n\n\n\n\n\n该模式常用于负责编排工作流的系统（包含顺序步骤和子步骤），在提供图形化分级视觉结构的库（如绘图工具）中也非常流行。\n\n在 `C#`\
  \ 语言的范围内，本章已让你具备实现组合模式（composite pattern）的技能。你现在应该掌握如何利用这种模式为复杂问题构建简单有效的解决方案，并符合面向对象编程的最佳实践。\n\
  \n在进入下一章时，你将继续深化在 `C#` 语言和 `.NET` 背景下对设计模式的理解。接下来的内容将介绍代理模式（proxy pattern），使你能够整合并应用从书中前面的章节中获得的全面见解和技术。\n\
  \n## 知识点回顾\n\n- 组合模式通过在类和子类中使用相同的接口来促进一致性，将单个对象及其组合一同等对待。\n- 在实现组合模式时，组合类必须包含一个子类的集合，这使得构建复杂结构成为可能。\n\
  - 组合模式具有极高的灵活性，可以将一个组合类指定为另一个组合结构中的子类。这种递归性质提供了近乎无限的抽象和适应性，促进了复杂的层次结构设计。\n\n## 多选择题\n\
  \n1. 组合模式适用于以下哪种情况？\n    1. 需要非层次架构的系统。\n    2. 包含大量类型的系统。\n    3. 任何基于面向对象编程范式的软件。\n\
