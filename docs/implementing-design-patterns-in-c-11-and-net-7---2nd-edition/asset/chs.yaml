  \n![](img/fm1.png)\n\n## 引言\n\n通过本章，我们将开始使用 `C# 11.0` 和 `.NET 7` 开启设计模式之旅，介绍 `C#`\
  \ 编程的基本概念，让你熟悉该语言及其主要操作和指令，这些指令将帮助你理解为了在本书后续章节中取得进展需要学习的内容，例如面向对象编程、设计模式和 `.NET`\
  \ 平台。\n你将在本章中学习如何创建和使用变量、操作符以及逻辑和条件语句。此外，你将有机会在 `C#` 中实现基础程序的实践经验。此外，你还可以尝试 `Visual\
  \ Studio 2022` 提供的全新调试体验。\n\n熟悉 `C#` 的基本概念将使你理解如何在书后的章节中应用复杂的设计模式。这将帮助你使用 `.NET`\
  \ 平台构建企业级项目。\n\n\n在本章中，我们将讨论以下主题：\n\n*   `Visual Studio 2022` 和 `Visual Studio Code`\
  \ 的安装指南\n*   `Visual Studio 2022` 和 `Visual Studio Code` 简介\n*   `C#` 的基本操作\n* \
  \  `C#` 中的对象类型\n*   `C#` 中的循环与迭代\n*   `C#` 中的错误处理\n\n## 目标\n\n在本单元中，你将学习设置 `Visual\
  \ Studio IDE` 和 `Visual Studio Code`，创建 `C#` 应用，掌握基础语言操作，并使用 `C# 10` 和 `11` 的新特性。这些技能将为精通\
  \ `C#` 编程和开发奠下坚实的基础。\n\n\n\n此外，微软提供了 `Visual Studio Code`，这是一种适用于 `.NET` 和 `C#`\
  \ 应用的免费开源轻量级代码编辑器，不仅适用于 Windows 和 macOS，还适用于各种 Linux 发行版。考虑到该编辑器是一个开源的可扩展项目，全球的技术社区、IT\
  \ 专业人士和公司为 `C#` 之外的许多语言创建了众多扩展。因此，它是创建跨平台应用的理想工具。`Visual Studio Code` 可以在官方网站免费下载。\n\
