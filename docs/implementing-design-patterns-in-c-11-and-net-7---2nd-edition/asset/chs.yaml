  \n![](img/fm1.png)\n# 第 6 章 .NET 应用中的单例模式\n\n## 引言\n\n软件开发中的许多场景需要保持特定对象的单个实例，以便在整个系统中共享，以实现定义良好的目的，例如共享数据库连接、内存中缓存对象，或者一个负责为应用程序所有部分保持一致状态的类实例。单例模式\
  \ (Singleton Pattern) 允许我们实现这一目标，它是使用依赖注入的 .NET 应用中最常用且为人知的模式之一。\n学习单例模式可以让你理解在哪些场景下使用这种模式会有所帮助。它还可以帮助你识别遗留项目和第三方库中的该模式。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n- 单例模式概念\n- C# 和 .NET 中的示例\n- 依赖注入的性能增强\n\n## 目标\n学习本单元后，你应该能够理解单例模式，将其应用于真实项目，并识别遗留项目和第三方库中对该模式的使用。\n\
  \n## 单例模式定义\n\n单例模式如其名，其首要目标是保证应用程序中只有一个特定实例可用，并为软件的其他类和组件全局共享该对象的相同状态。通过这种模式，底层类的结构限制了其他对象实例的创建，通常使用\
  \ `static` 修饰符。.NET 平台自 `.NET Core 1.0` 版本以来对单例模式的使用引入了许多改进，将该模式的使用与依赖注入的概念相结合，使其变得易于管理，并可以在内存中保持特定对象的单一访问点，而无需在程序上强制使用该模式本身。\n\
  与其他模式一样，单例模式的优缺点取决于其应用场景。其优点之一是，可以确保系统在整个系统范围内安全地保持同一个对象，并正确地管理可能的并发挑战。遵循面向对象编程的最佳实践，该模式的使用通过私有构造方法限制了相应类的规范，这避免了违反规则的可能性，并防止了创建具有不同状态的不适当多个对象实例。\n\
  \n在负面方面，单例模式使实现单元测试的任务变得复杂得多，因为涉及的类被标记为 `static` 修饰符，在验证应用程序执行行为方面模拟状态以进行验证是一项挑战。此外，考虑到该模式的显式目的是为整个应用程序保留特定对象的单一全局访问点，并发和并行线程访问对象时需要防止锁以确保所有对对象的请求都接收到相同的结果，这在响应性能中任何额外的纳秒都至关重要的关键系统中可能会性能问题。\n\
  \n考虑到你已经学习了单例模式的理论概念，下一节将向你展示如何通过实践方法在不同场景中应用该模式，并将让你理解单例模式如何在 .NET 平台的不同项目类型中原生。\n\
  ## 单例模式定义\n\n由于每个设计模式都有定义的目的，即使用良好的 OOP 和软件架构实践来解决软件开发中的特定问题，因此学习任何模式并构建一个需要每个模式解决实际问题的场景至关重要。在本章的范围内，即单例模式本身。\n\
  \n如此，假设有一个假设场景，系统必须全局保持同一个对象实例，该实例负责与外部资源通信，例如根据需要将文档转换为 PDF 格式的第三方 Web 服务或连接到远程数据库。该场景中的要求之一是限制访问外部服务的认证次数，将其限制为一次，以避免整个过程的额外成本和性能问题。因此，用于\
  \ PDF 转换器服务的认证单会话必须尽可能保持开启，并在所有依赖 PDF 转换服务的应用程序例之间共享。如果在这种情况下使用标准类，该类的实现将类似于图 6.1\
  \ 所示：\n![](img/Figure_6.1.png)\n\n图 6.1：PDF 转换器类\n\n一旦 PDF 服务类在转换方法需要一个 `Session`\
  \ 对象（如 `ConvertToPdf` 方法体所示），每当生成 `PDFConverter` 类的新实例时就会创建一个新的 `Session` 对象。考虑到给定场景中的要求规定，对于多次调用外部服务应尽可能使用单个\
  \ `Session`，当前的实现并没有完美满足这些要求，因为在此版本的代码中，可以在没有任何限制的情况下创建多个类实例。要查看给定代码的输出结果，可以在类中实现一个名为\
  \ `GetSessionInfo` 的新方法，如图 6.2 所示：\n![](img/Figure_6.2.png)\n\n图 6.2：GetSessionInfo\
  \ 方法\n\n该方法显示的信息允许我们在测试类时跟踪运行时工作流，以验证整个应用程序每次都使用不同的会话实例。\n## 多个实例\n\n如果我们将图 6.1\
  \ 和图 6.2 中的代码放在普通的控制台应用程序中，可以在 `Program.cs` 文件中多次调用 `PDFConverter` 类，以验证应用程序在生成多个实例时未能正确处理会话创建。你可以使用图\
  \ 6.3 所示的代码调整 `Program.cs` 文件中的 `Main` 方法：\n\n![](img/Figure_6.3.png)\n\n图 6.3：多个\
  \ PDF 转换器实例\n\n\n\n\n在第九行到第十一行之间，使用 `PDF Converter` 类的一个实例将第一个文档转换为 PDF，而在第十五行到第十七行之间，使用转换器的新实例（另一个实例）将第二个文档转换。由于程序在第十三行和第十九行两次调用了\
  \ `GetSessionInfo` 方法，当 `Console` 应用程序运行时，系统会在屏幕上显示两个文档转换的会话信息，如图图 6.4 所示：\n![](img/Figure_6.4.png)\n\
  \n图 6.4：会话信息显示\n\n如图 6.4 所示，生成的两个不同的会话，这意味着实现符合预期需求。尽管这只是在 `Console` 应用程序的 `Program.cs`文件的同一个方法中创建多个实例的示例，但场景需求要求的思想是在代码中创建一种架构，强制整个应用程序全局访问\
  \ `PDF Converter` 对象的单实例，以避免开发过程中可能出现的错误。因此，软件设计必须具有一种能够显式限制 `PDF Converter` 类多个实例创建的结构。这代表了软件开发中的一个常见问题，因为如果不使用拒绝创建对象多个实例的机制，是无法想象限制违反需求的行为的。\n\
  ## 单例模式的修改 (#contents.xhtml_sc3_110a)\n\n单例模式是针对本章学习目的之给定场景的一种简单而复杂的解决方案，因为它的实现需要对\
  \ `PDFConverter` 类进行重大更改，以防止多个实例的创建，并确保应用程序在并发访问负责将文档转换为 PDF 的外部资源时遇到任何问题。\n\n首先，至关重要的是理解，单例模式中的所有类构造函数都应该使用\
  \ `private` 修饰符，并且底层类应该使用 `sealed` 修饰符，如图图 6.5 所示：\n![](img/Figure_6.5.png)\n\n\
  图 6.5：PDF Converter 类的首次修改\n\n`sealed` 修饰符防止其他类继承 `PDFConverter` 类，这是避免通过继承创建对象多个实例的必要限制。然而，在对类进行这些小更改后，`Program.cs`\
  \ 文件中的例程显示了预期的错误，考虑到在我们使用 `private` 修饰符修改了构造函数的可见性后，不允许再创建 `PDF Converter` 类的新实例，如图图\
  \ 6.6 所示：\n![](img/Figure_6.6.png)\n\n图 6.6：编译错误\n\n单例模式的实际目标是避免创建对象的多个实例，但在对 `PDFConverter`\
  \ 类进行更改后，无法再创建 `PDFConverter` 类型的任何实例，这意味着尚未实现单例模式。。按照惯例，单例模式要求使用 `GetInstance`\
  \ 静态属性，它仅在对象状态为 null 时处理对象新实例的创建，如图图 6.7 所示：\n![](img/Figure_6.7.png)\n\n图 6.7：GetInstance\
  \ 方法\n\n在这种情况下，类构造函数方法仍然是私有的，并且类现在有一个静态方法，它总是返回同一个对象实例，除非对象为 null。该实现保证了整个应用程序中将使用同一个实例，即使该类在程序中被多次引用。\n\
  这些更改之后，在代码设计和实现方面满足了主要需求，只需要在 `Program.cs` 文件中进行少量的额外更改。考虑到 `PDFConverter` 类使用了静态属性，程序在内存中仅保留该对象的唯一引用，防止了创建新实例的可能性。尽管结果完全不同，但代码保持相对相似，如图图\
  \ 6.8 所示：\n\n![](img/Figure_6.8.png)\n\n图 6.8：Program.cs 文件中的更改\n不再调用类构造函数方法，而是为\
  \ `PDFConverter` 类型对象调用静态属性。因此，`Program.cs` 文件中的例程在实现方面仅产生了微不足道的影响。如果我们运行 `Console`\
  \ 应用程序，两个文档转换都将使用同一个会话，如图图 6.9 所示：\n\n![](img/Figure_6.9.png)\n\n图 6.9：会话结果\n当前的单例模式实现在对\
  \ `PDFConverter` 实例有大量并发请求的场景中存在局限性，因为它可能会在尝试从内存获取信息时引起并发问题，导致线程锁定。为了避免错误，在这种情况下，使用\
  \ C# 语言现有的 `lock` 特性更安全，它将防止在负责管理 `PDFConverter` 对象单实例创建的代码块中同时访问相同资源。所有其他线程必须等待通过\
  \ `lock` 语句访问资源。下图 6.10 所示的代码演示了具有线程安全实现的类更改：\n\n![](img/Figure_6.10.png)\n\n图 6.10：lock\
  \ 语句\n在这种情况下，建议在高需求场景下使用 `lock` 语句。然而，此功能需要谨慎使用，因为它可能会导致性能问题，因为应用程序可能会有大量的请求在队列中等待访问资源。\n\
  \n## 线程安全的实现 (#contents.xhtml_sc4_111a)\n\n6.10 所示的代码版本中使用了一个名为 `lockThreadSafe`\
  \ 的私有属性，并且 `GetInstance` 静态属性在需要创建 `PDFConverter` 类新实例的情况下进行了正确的锁定。通常，这种实现被称为线程安全单例，对于密集并发访问特定资源可能导致应用程序错误的场景，这是一个极佳的替代方案。\n\
  关于单例模式，可以采取的另一种方法是使用 C# 语言中的 `Lazy` 类型，这是一个可用功能，允许我们隐式地使用线程安全实现概念，无需在代码中添加额外的 `lock`\
  \ 语句。如果我们重构之前的代码以使用 `Lazy` 类型，其实现将如图 6.11 所示：\n\n![](img/Figure_6.11.png)\n\n图 6.11：Lazy\
  \ 类型\n使用 `Lazy` 类型减少了实现单例模式所需的代码量，并产生了相同的结果，是获得更可读代码的绝佳替代方案。.NET 平台为 ASP.NET Core\
  \ 应用程序和其他类型提供了处理单例模式的额外选项，这包括了使用依赖注入为整个应用程序保持对象单实例的过程。\n\n## 依赖注入 (#contents.xhtml_sc4_112a)\n\
  \n.NET 平台从 .NET Core 1.0 版本开始就引入了无需安装任何额外第三方库即可使用依赖注入的可能性。\n\n\n\n\n要检查如何在 .NET\
  \ 应用中使用依赖注入（Dependency Injection），请创建一个 ASP.NET Core MVC 项目，并在项目中创建 `PDFConverter`\
  \ 类，如图 6.12 所示：\n![](img/Figure_6.12.png)\n\n图 6.12：用于 ASP.NET MVC 项目的 PDF Converter\
  \ 类\n\n如你在图 6.13 中所示，该类实现了 `IPdfConverter` 接口，其表示方式如下：\n![](img/Figure_6.13.png)\n\
  \n图 6.13：IPdfConverter 接口\n\n在 .NET 应用程序中使用依赖注入时，使用接口是关重要的，因为有助于根据应用程序需求使用不同类型的实现，而无需更改引用该接口的多个部分。\n\
  PDF 转换器还引用了 `Session` 类，该类负责生成外部服务使用的会话 ID。为了方便学习，`Session` 类的实现类似于图 6.14 中的代码示例：\n\
  \n![](img/Figure_6.14.png)\n\n图 6.14：Session 类\n`Session` 类在根据 `Guid` 类创建新类实例时生成一个新的\
  \ ID 值。这种实现有助于我们正确测试单例模式和依赖注入，因为 `PDFConverter` 类有一个 `Session` 类型的私有属性。我们希望确保同一个对象实例在应用程序中跨多个请求共享。\n\
  \n此外，`PdfService` 类引用了 `PdfService` 类，如图 6.15 所示：\n\n![](img/Figure_6.15.png)\n\
  图 6.15：PDF Service 类\n\n对于此 ASP.NET MVC 项目，框架的责任是使用依赖注入来处理 `PDFConverter` 类的单例策略。对于任何需要在整个应用程序中共享相同实例或自动注入到不同类中的类或对象，你必须在\
  \ .NET 应用程序的服务配置中注册它，这通常在 `Program.cs` 文件中实现，可以在其中以单例（Singleton）状态注册类和接口，如图 6.16\
  \ 所示：\n\n![](img/Figure_6.16.png)\n图 6.16：用于 PDF 转换器的服务配置\n\n在第三行，使用 `AddSingleton`\
  \ 方法注册服务，并传递 `PdfConverter` 接口和相应的具体类。在所有需要使用 `PDFConverter` 的类中，你都需要允许通过构造函数注入对象，如图\
  \ 6.17 中的 `HomeController` 所示：\n\n![](img/Figure_6.17.png)\n图 6.17：HomeController\
  \ 的注入\n\n通过对 `Program.cs` 和 `HomeController.cs` 文件应用这些修改，HomeController 接收到的所有请求将获得相同的\
  \ PDF 器对象实例，而无需通过编程处理单例模式。要验证依赖注入是否正常工作，你可以使用图 6.18 所示的代码修改转换器中的 `Index` 操作：\n\n\
  ![](img/Figure_6.18.png)\n图 6.18：Index Action\n\n`Index` 操作使用 `PdfConverter` 对象将两个文档转换为\
  \ PDF，并共享同一个对象。它填充了一个包含会话 ID 信息的字符串列表，并将该值传递给视图。为了可视化表示会话信息，请在 `Index.cshtml` 文件中实现以下代码，如图\
  \ 6.19 所示：\n![](img/Figure_6.19.png)\n\n图 6.19：Index 视图\n\n如图 6.18 所示，`HomeController`\
  \ 类的构造函数接收 `PDFConverter` 接口，应用程序在每次向控制器发送新请求时都会自动注入 `PDFConverter` 对象的实例。`Index`\
  \ 操作具有与控制台应用程序相似的实现。\n尽管如此，它仍然存储了包含两次调用 `PDFConverter` 类会话信息的字符串列表。如果应用程序运行多次，即使\
  \ `Index` 页面刷新多次，系统也会对每次调用保持相同的会话 ID。更改 `Index` 视图显示会话列表后，结果与之前控制台应用程序单例模式实现相似，区别在于状态由\
  \ ASP.NET Core 应用程序隐式处理。如果你运行应用程序，将能够验证已实现正确的行为，如图 6.20 所示：\n\n![](img/Figure_6.20.png)\n\
  \n图 6.20：带有会话信息的 Index 视图\n即使 `PDFConverter` 类没有显式实现单例模式，考虑到该类在 .NET 应用程序的服务配置中注册并以单例方式运行，结果仍然满足要求，即在所有构造函数注入该类的地方，在整个应用程序中保持对象的唯一实例。如图\
  \ 6.20 所示。\n\n## 结论\n\n正如本章中所学的，单例模式有助于在应用程序中保持相同的实例，提供对资源的单一访问点。由于依赖注入的引入，这种非侵入式的方法避免了为类创建静态属性。\n\
  通过本章，你有机会学习如何在实际项目中使用 C# 语言实现单例模式并理解其适用场景。此外，你还学习了如何在依赖应用程序中使用该模式。\n\n在下一章中，你将有机会使用\
  \ C# 语言继续设计模式之旅，并在 Blazor 应用程序中学习抽象工厂模式。\n\n## 记住要点\n- 单例模式可以通过私有构造函数和静态属性手动实现。\n\
  - `lock` 语句可以防止单例模式实现中的并发问题。\n- .NET 平台允许我们通过 `Program.cs` 文件中的服务注册使用单例模式，以实现应用程序中唯一实例的目标。\n\
  \n## 单选题\n1. C# 语言中的什么种功能可以避免资源的并发访问问题？\n   - `lock` 语句\n   - `Factory`\n   - `static`\n\
  \   - `private`\n2. 单例类可以在 ASP.NET 程序的哪个类中注册？\n   - `Program.cs`\n   - `Global.asax`\n\
  \   - `Controllers`\n   - View\n3. 单例类 `lock` 语句的替代方案是什么？\n   - `Tasks`\n   - `Lazy`\
  \ 类型\n   - `Parallel loops`\n   - 均都不是\n## 答案\n\n| 1 | A |\n| 2 | D |\n| 3 | B |\n\
  ## 问题\n\n1. 解释单例模式的主要目的。\n2. 在 ASP.NET 应用程序的服务中将类注册为单例的主要益处是什么？\n\n\n\n\n## 3. 根据你在本章中学到的知识，创建一个在本章示例之外的、可以应用单例模式的假设场景。\n\
  \n\n- **单例实例 (Single Instance)**：这是单例模式的核心思想。该模式确保一个类在应用程序的生命周期内只有一个实例，防止任何机制创建多个一个实例。\n\
  - **全局访问点 (Global Access Point)**：除了确保单例外，单例模式还提供了一个访问该实例的全局点。这确保了软件的每个部分都可以访问单例实例，而无需直接对其实例化。\n\
  - **懒性初始化 (Lazy Initialization)**：这是一种在需要时才创建单例实例的技术。当实例的创建消耗大量资源，且在特定请求之前不需要时，懒性初始化特别有用。\n\
