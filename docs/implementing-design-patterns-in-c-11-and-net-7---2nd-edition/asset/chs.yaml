  \n![](img/fm1.png)\n\n# 第 3 章 C# 面向对象编程的基本概念](#contents.xhtml_ch03)\n## 引言](#contents.xhtml_sc2_54)\n\
  \n软件开发是一个抽象过程，通过在软件中实现业务和系统需求来对应现实，通常使用面向对象编程范式。\n\n这种范式的概念几十年来帮助软件行业创建了稳定、可读且可扩展的代码，使得编码过程对开发者来说更容易，并为多种编程语言带了智能化的设计。\n\
  此外，围绕面向对象编程（`OOP`）的讨论为软件工程领域带来了许多补充和贡献，例如 `SOLID` 原则概念和设计模式，这提高了全球软件开发的整体质量，并提供了构建健壮可扩展应用程序的可能性，从技术和专业水平上提升了软件工程。\n\
  \n由于这些事实，任何开发者都需要正确学习这种范式，将其应用于现实和复杂的场景，这是市场上几乎所有软件开发职位的要求。\n\n通过本章，你将学习面向对象编程的核心概念，如类、构造函数、方法、抽象、继承和接口。此外，本章还将介绍设计模式和\
  \ SOLID 原则示例。\n\n## 结构](#contents.xhtml_sc2_55)\n在本章中，我们将讨论：\n\n*   类、构造函数和方法\n\
  *   静态类和方法\n*   结构\n\n## 目标](#contents.xhtml_sc2_56)\n\n学习本单元后，你应该能够理解面向对象编程概念并讨论设计模式的关键方面。在本章结束时，你应该能够使用面向对象编程创建基础应用程序，并在实际项目中使用\
  \ SOLID 原则。\n\n\n\n从零开始学习面向对象编程（OOP）概念，你必须知道，市场上的任何软件以及任何使用现代编程语言的代码实现都有其特定的目标，即解决由业务需求和非功能性需求包围的真实问题的显式意图。在软件工程中，解决单个问题有许多方法，而保持和编写易于理解的代码对于任何项目的成功至关重要，这能保持代码实现与软件试图解决的现实世界概念之间的关联。OOP\
  \ 帮助我们保持这种业务需求与逻辑实现之间的关联性，便于对代码的理解，使其不仅能被机器解读，也能被开发者理解。\n\n`C#` 语言从第一个版本起就完全支持 OOP，`.NET`\
  \ 用户编写的每个程序都必须应用这种范式，因为该平台的所有原生库都是严格基于这一概念并遵循这一模式的。此外，`.NET` 平台受益于设计模式的先进概念和 `SOLID`\
  \ 原则，这些将在本书中通过基于真实场景的示例进行进一步解释。\n\nOOP 允许我们围绕对象来组织软件需求的实现，对象代表了系统中需要抽象的某个行为和状态。对象可以包含属性和方法，负责维护和操作对象的状态，并允许执行与对象相关的操作。在\
  \ `C#` 和其他基于 OOP 范式的语言中，对象由类定义，该类应该具有与业务需求中提到的现实世界实体相似的特征，遵循忠实的表示。\n为了更好地理解，想象一个需要使用\
  \ `C#` 语言和 `.NET` 开发在线商店的场景。在这个虚构的案例研究中，系统将实现以下需求：\n\n*   允许用户注册产品和产品类型。\n*   每个产品都应该有一个标题和一个唯一的数字来识别该产品。\n\
  *   用户是指任何访问在线商店但不一定完成购买的人。\n*   一旦用户在在线商店进行购买，该用户应被注册为客户，并带有用于账单的附加信息。\n*   产品可以根据其类型包含不同的属性。\n\
  考虑到给定的场景，如果我们开始规划必要代码的设计以保持一切组织整齐，我们必须先创建类，创建使用这些类创建的任何具体对象共有的最基本属性。从产品模型开始，该类的初始实现如图\
  \ 3.1\n\n图 3.1：Product 类\n\n在这种例中，字段 `Id`、`Title` 和 `Price` 代表 `Product` 类的属性，每个属性都有自己的类型，例如整数、字符串和十进制。你必须注意，在每个属性类型之前有一个关键字。该关键字意味着整个解决方案属性的访问修饰符或范围。OOP\
  \ 包含以下访问修饰符：\n*   `Public`：类或属性可以被其他类自由访问，即使是同一个程序集中的类也是如此。\n*   `Private`：属性只能由属性所在的同一个类访问。\n\
  *   `Protected`：属性只能在同一个类或任何派生类中访问。\n*   `Internal`：属性或类可以被其他类访问，但限制这些类必须在同一个程序集中。\n\
  *   `Protected internal`：类或属性可以被同一个程序集中的任何其他类访问，也可以被所有派生类访问，即使它们不在同一个程序集中。\n取决于所使用的访问修饰符，访问级别会改变，如图\
  \ 3.2 所示：\n\n![](img/Figure_3.2.png)\n\n图 3.2：访问修饰符\nOOP 拥有强制现代编程语言遵循良好编码实践的原则，其额外目的是不违反任何基于\
  \ OOP 范式的软件中通常应遵循的机制，例如封装、继承、多态和可重用。本章的后续章节将包含关于这些实践的详细信息。\n\n### 封装\n\nOOP 范式中的封装避免了外部对对象状态的干扰，保护了对类属性及其方法的访问。为了成功实现这一目标，本章之前提到了理解类属性访问层级的含义。对属性、方法和类的访问级别的显式控制，确保了负责该项目的其他开发者无法违反类的预期边界，包括每个类如何管理底层对象状态的方面。当类之间的依赖性较低时，它会增加整个项目的可测试性和可维护性。\n\
  ### 继承\n\nOOP 范式中的继承概念与软件开发中的可重用原则密切相关。它允许我们在具有相似目的的类之间共享属性和方法。继承另一个类的类被称为派生类，在这种语境下，基类通常被称为父类。\n\
  \n`C#` 语言允许我们为类签名仅指定一个继承，但在需要时可以使用接口来模拟多重继承实现。在继承的实际示例方面，我们可以扩展本章已经给出的在线商店场景，该商店可能包含许多类型的不同产品，这些产品之间共享公共属性和方法，并可能具有仅适用于专门化类的属性。\n\
  在这种语境下，`Movie` 类是产品的一种，并与其他产品具有相似的特征，例如 `Id`、`Title` 和 `Price`。但是，它也具有不适用于其他类的特定属性。考虑到本章图\
  \ 3.1 所示的 `Product` 类，它已经包含了公共基属性，`Movie` 类可以继承 `Product` 类，如图 3.3 所示：\n\n![](img/Figure_3.3.png)\n\
  \n图 3.3：访问修饰符\n\n在该 `Movie` 类的签名中，声明了对 `Product` 类的继承，这意味着 `Movie` 类将包含 `Product`\
  \ 类中存在的所有属性，以及来自类的其他特定字段，例如`发布日期`、`类别`和`时长`。决定是否继承另一个类取决于项目的背景和业务需求。如果不同的类之间存在明确的关联，这可能表明继承是适用的。这种\
  \ OOP 特性帮助开发者节省在应用程序的多个类之间编写代码的时间，有助于保持项目所决编码设计的一致性。\n### 可重用性\n\n\n\n\n\n回到本章演示的在线商店（Online\
  \ Store）场景，由于示例已经包含一个基础 `Product` 类，如果在线商店有大量不同类型的产品，那么对所有产品都智能地使用基类将为整个项目的实现节省大量时间。这种可重用的概念及其益处也适用于更复杂的场景，在这些场景中，不仅简单的属性和方法可以重用，整个库和包可以在多个项目之间共享，以最大限度地实现类、组件和特征的重用。\n\
  \n## 多态\n\n多态允许我们重写父类的方法，为多个类共享一个标准接口，以确保软件架构的完整性和一致性。正如其名称所示，多态是指同一个方法假设多种形式的可能性。在在线商店的示例中，假设每个产品都可以根据自定义规则有自己的应用折扣方式。在这种情况下，`Product`\
  \ 基类将有一个标准方法来计算折扣，但所有派生类都有根据其需要重写折扣方法行为的可能性。\n\n\n![](img/Figure_3.4.png)\n\n图 3.4：`Product`\
  \ 类上应用折扣的方法\n\n\n![](img/Figure_3.5.png)\n\n图 3.5：`Movie` 类上应用折扣的方法\n\n\n![](img/Figure_3.6.png)\n\
  \n图 3.6：`Movie` 类上应用折扣的方法\n\n在这种情况下，需要使用 `override` 关键字来指示父类的底层实现不一定会以相同的方式使用。\n\
  \n\n为了保持良好的编码实践和结构良好的项目，通常类的完整实现都出现在同一个文件中，遵循文件名与类名相同的惯例，如图 3.7 所示：\n\n![](img/Figure_3.7.png)\n\
  \n\n在某些情况下，一个类包含许多行代码，当多个开发人员需要同时处理同一个文件时，维护会变得复杂。在这种情况下，将类拆分为多个文件是方便的，这可以避免合并冲突，并为了理解提供更好的逻辑分离。虽然类显示于多个文件中，但编译器会将它们合并为一个类。在接后的代码示例中，有两个关于\
  \ `Product` 类的文件，一个包含字段，另一个包含类的方法，如图 3.8 所示：\n\n![](img/Figure_3.8.png)\n\n\n`partial`\
  \ 关键字用于类签名中，相同的过程也适用于 `Product` 类的所有其他部分类。由于给定的部分 `Product` 类只包含负责应用折扣的方法，而类的其余实现被放在另一个文件中，如图\
  \ 3.9 所示：\n\n![](img/Figure_3.9.png)\n\n\n部分类的使用非常灵活，但建议仅在类规模足够大、足以证明将其拆分为部分类的合理性时才使用它。此外，假设一个类包含许多行代码。在这种情况下，通常这很明确地表明该类应该重构以遵循单一职责原则（SRP），这是\
  \ SOLID 原则中提到的一项良好实践，将在书中进一步解释。\n\n## 构造函数 (Constructor)\n\n\n![](img/Figure_3.10.png)\n\
  \n图 3.10：`Product` 对象实例\n\n\n![](img/Figure_3.11.png)\n\n图 3.11：多个构造函数\n\n\n如图 3.11\
  \ 所示，可以在构造函数中传递参数，这通常在对象初始化时需要执行操作时完成，例如设置类属性的初始状态或从其他类注入对象（这里用了依赖注入的概念）。\n\n##\
  \ 静态类 (Static classes)\n\n\n![](img/Figure_3.12.png)\n\n图 3.12：静态 `Helper` 类\n\n\
  \n\n如图 3.12 所示，`static` 关键字将 `Helper` 类转换为静态类。由于无法为静态类创建实例，如果实现尝试违反这一原则，编译器将抛出错误，如图\
  \ 3.13 所示：\n\n![](img/Figure_3.13.png)\n\n图 3.13: 静态类的编译错误\n要使用静态类中存在的方法，您可以直接调用它们而不使用\
  \ `new` 关键字，如图 3.14 所示：\n\n![](img/Figure_3.14.png)\n\n图 3.14: 静态类的正确用法\n通常，当定义静态类时，其所有成员在标记为静态成员方面都遵循相同的签名。\n\
  \n## 结构体 (Structs)\n\nC# 中的结构体实现实现与类相似，包括属性和方法。然而，主要的区别在于当 C# 程序执行时它们在内存中的保留方式。传统的类在\
  \ C# 中被认为是引用类型，这意味着该类型并不将其值存储在与其内存中的引用完全相同的内存位置。对于类，如果在程序中多次使用同一个对象实例，内会在需要访问时在内存中查找底层对象的内存引用，而不是直接查找对象的状态。\n\
  \n另一方面，结构体将引用和存储的值存储在一起，使得对值的访问通常比引用类型快得多。此外，与类相比，结构体具有以下限制：\n* 不 possible 将结构体用于继承\n\
  * 不允许结构体使用空构造函数。它必须有一个带参数的构造函数。\n* 创建实例时，要求为局部变量赋值。\n* 一旦从结构体创建的对象的方法完成处理，该实例将从内存中移除。\n\
  \n\n![](img/Figure_3.15.png)\n\n图 3.15: 结构体示例\n\n\n![](img/Figure_3.16.png)\n\n\
  图 3.16: 结构体构造函数\n\n\n## 接口 (Interfaces)\n\n在面向对象编程 (OOP) 中，接口代表了所有签名中引用该接口的类都应该遵循的合约。换句话说，接口包含了类中存在的所有强制内容，包括属性和方法。这一特性对于正确实现业务需求和在开发过程中强制一致性具有重要意义。\n\
  \n在 C# 语言中，用户可以在接口名称之前使用相应的关键字创建接口。从本质上说，接口不包含实现，实现是实现这些接口的类的责任。C# 8.0 引入了指定默认接口方法的可能性，这种方法可以包含实现，但这似乎是一种反模式，因为接口的主要目的是为类建立合约，并将方法的行为委托给它们。\n\
  \n\n![](img/Figure_3.17.png)\n\n\n在此 `Product` 接口中有一个规范强制所有引用该接口的类实现 `Deliver` 方法。这种引用可以在类名之后进行，如图\
  \ 3.18 所示：\n\n![](img/Figure_3.18.png)\n\n\n一旦使用接口，如果缺少接口中任何方法的实现，编译器都会指出这一点，如图\
  \ 3.19 所示：\n\n![](img/Figure_3.19.png)\n\n\nC# 10 引入了接口的静态抽象成员概念，允许实现接口的类型对属性进行自定义版本的实现。例如，你可以在\
  \ `Product` 接口中有一个标记为 `static` 且 `abstract` 的成员名为 `IsDeliverable`。在这种情况下，由类来定义静态属性的值，如图\
  \ 3.20 所示：\n\n![](img/Figure_3.20.png)\n\n\n在这种情况下，由类来决定静态成员的值，如图 3.21 所示：\n\n![](img/Figure_3.21.png)\n\
  \n\n在这种情况下，由类来决定静态成员的值，接口的使用可以为应用程序提供更高的一致性。接口可以提高代码的可维护性，并在正确使用依赖注入的概念时使单元测试更容易，从而降低开发成本并降低引入问题和\
  \ Bug 的风险。\n\n## 结论 (Conclusion)\n\n\n下一章将使用最新的 C# 语言详细解释所有的 SOLID 原则。\n\n\n\n\n\
  - `Class`（类）：创建对象（特定实例）的蓝图或模板。在 `C#` 中，类定义了属性、方法、事件等，作为对象的结构。\n- `Object`（对象）：类的实例。它是类蓝图的真实世界表示。\n\
  - `Encapsulation`（封装）：将数据（属性）和操作这些数据的方法（函数）打包成单个单元，确保对象的内部状态对外部隐藏。\n- `Inheritance`（继承）：一种机制，新类从现有类派生属性和行为（方法）。它促进了代码的重用。\n\
  \n# 第 4 章 C# 中的 SOLID 原则\n\n## 引言\n\n\n你将学习如何在真实项目中使用 `C#` 语言应用所有这些标准实践。SOLID 原则的知识是学习设计模式（本书的主要目的）的强制要求。考虑到软件实现在代码结构方面可能具有的高复杂性，理解这些原则至关重要，这使你能够在现有项目和第三方库中识别出它们。\n\
  \n## 结构\n\n- 单一职责原则\n- 开闭原则\n- 里基夫替换原则\n- 依赖倒转原则\n\n\n在学习本单元后，你应该能够理解 SOLID 原则并在现有项目中识别\
  \ SOLID 原则。你还应该能够在 `.NET 7` 和 `C# 11` 的基础项目中应用 SOLID 原则。\n\n## 单一职责原则\n\n\n要找到在交付、质量和用户预期方面失败的软件项目并不困难，这些失败通常是因为技术问题以及随着时间推移扩展软件到新功能的能力限制。在任何软件开发周期中，当在软件发布给用户后进行更改时，项目所需的成本会更高。对任何现有功能的更改都可能为项目引入新问题；同时，添加新功能也会变得更加复杂。\n\
  \n针对软件开发中的这些挑战，保持代码尽可能整洁并遵循软件开发的良好实践，对于项目的成功以及保证项目在支持和演进方面的长期可持续性至关重要。\n\n\n![](img/Figure_4.1.png)\n\
  \n图 4.1：应用单一职责原则之前的代码\n\n- 将文档转换为 PDF 格式\n- 向用户发送电子邮件\n- 在日志文件中记录交易\n\n根据此实现中调用的\
  \ `CompleteTransaction` 方法，该例程的主要目的本应该是执行商业交易。然而，实际代码做的远多于此：发送电子邮件和将文件转换为 PDF 格式。这清楚表明没有遵循\
  \ SRP，增加了随着时间推移在此代码中引入回归 bug 的可能性，因为方法的多个部分中的任何一个更改都可能轻易影响整个方法的执行。此外，将多个职责组合到同一个方法中使得在其他软件部分重用该方法变得更加困难。\n\
  \n另一种方法是重构此代码，将所有次要内容的实现隐藏在方法之外，只保留与交易完成相关的代码，如 [图 4.2] 所示。\n![](img/Figure_4.2.png)\n\
  \n图 4.2：单一职责重构\n\n该相同实现的新版本在代码方面有了显著改进。与电子邮件和转换为 PDF 相关的复杂性已移动到其他类，并可以在软件的其他部分重用。此外，`CompleteTransaction`\
  \ 方法的代码行更少，更容易理解其目的。SRP 最关键的一点是：类应该只有一个更改的原因。经过重构过程，代码被分成三个不同的类，它们可以被独立地更改而不影响其他类。因此，主类不再违反该原则。\n\
  ## 开闭原则\n\nOCP 是 SOLID 缩写中的第二个，该原则背后的思想是：对象应对扩展开放的，但对行为的更改关闭的。任何软件都将大量的业务需求转换为代码。需求可能会因为业务请求、新法规或仅仅是因为对软件目的的更好理解而频繁发生变化。然而，许多需求的变化不应该每次都代表或要求修改代码。假设代码中的某个特定例程被更改了多次。在这种情况下，可能意味着用于开发此部分代码的设计或模式不够清晰，并且没有遵循软件开发的良好实践。\n\
  \n此外，软件的每次更改都可能通过向现有功能引入错误对生产环境产生影响，这是应该尽可能避免的。遵循 OCP，如果提出了新需求并需要更改代码中的现有类或方法，则应该扩展该类以考虑这一新请求，而不是更改它。因此，添加新需求应该被视为新功能，代表扩展而不是修改。\n\
  例如，想象以下场景。有一个系统允许用户创建账户并在流媒体平台上访问电影。在最初，单一账户类型对每个用户具有相同的行为和需求。下方的 [图 4.3] 代表了该简单实现：\n\
  \n![](img/Figure_4.3.png)\n\n图 4.3：开闭示例\n\n\n\n如上一个截图所示，该例程正在创建一个包含四个用户的列表，对于每个项目，方法\
  \ `Generate` 都来自 `PlatformAccount` 类。该类包含了用户与客户账户之间的映射，如图 4.4 所示：\n\n\n图 4.4：平台账户类\n\
  \n此示例中的 `Customer` 和 `User` 类具有相同的字段，如下两个代码样本所示：\n\n![](img/Figure_4.5.png)\n\n\n\
  `Customer` 类的表示形式如下一个截图所示：\n\n![](img/Figure_4.6.png)\n\n\n在实际场景中，`platform account`\
  \ 类在实现中会使用一个将客户插入数据库的方法，并可能包含额外的代码。尽管如此，由于目标是演示 `OCP`（开闭原则），为了便于理解，隐藏了复杂性。考虑到业务需求的修改，软件该部分的需求可能会随时更改，假设有一项需求是流媒体公司将为客户提供其他类型的账户，例如与标准账户逻辑不同的高级账户。在这种情况下，有两种主要选择：更改\
  \ `platform account` 类的实现以检查客户是否拥有高级账户，如果是，则方法将运行不同的代码，如下代码样本所示：\n\n![](img/Figure_4.7.png)\n\
  \n\n如上一个截图所示，该实现违反了 `OCP`，因为 `platform account` 类被修改了而不是仅仅被扩展。它现在包含一个 `if` 语句，以防客户拥有高级账户，并调用了不同的方法。使用这种方法有几个局限性和风险：\n\
  \n*   所有必须调用 `create` 方法的方法都必须正确设置 `isPremiumAccount` 属性。在编码过程中很容易出错，并忘记将该属性值设为\
  \ `true`。\n*   如果该类具有复杂的实现，在方法中添加代码可能会很容易影响其他类型账户（例如标准账户）的行为，而标准账户应该保持原样。\n\n另一种遵循\
  \ `OCP` 建议的实现是扩展功能以提供高级账户选项，而不是更改用于创建标准账户的现有类。可以使用接口来抽象 `User` 和 `PlatformAccount`\
  \ 类来实现这一目标。通过这样，标准账户和高级账户将是分开的类，且原始类的实现将不会被修改，如图 4.8 所示：\n\n![](img/Figure_4.8.png)\n\
  \n\n创建了一个 `premium user` 类，并与 `User` 类共享相同的接口，如下两个代码样本所示：\n\n![](img/Figure_4.9.png)\n\
  \n\n两个用户类（`User` 和 `PremiumUser`）都有一个名为 `PlatformAccount` 的属性，它引用一个接口并为用户和用户高级对象创建不同类的实例，如下例所示：\n\
  \n![](img/Figure_4.10.png)\n\n\n如果软件已经在生产环境中使用并在现有功能上添加新需求，则强烈建议使用 `OCP`。该原则有助于保持代码的可读性，并避免遗留项目中的问题。\n\
  \n## 里氏夫替换原则\n\n\n为了演示这一原则，我们将创建一个代表该原则试图解决的相同条件的场景。例如，想象一个允许在在线图书服务中创建用户的系统，有两种不同类型的账户：高级和标准。标准账户可以访问有限的书籍，而高级账户对书籍有无限访问权限，并可以与家庭成员共享访问权限。它们有共同点，创建一个作为每个类父类的基类是自然的，如图\
  \ 4.11 所示：\n\n![](img/Figure_4.11.png)\n\n\n如上一个截图所示，在 `BaseUser` 类中有与对象状态相关的属性，如全名、`email`\
  \ 和 `password`。但该类还包含提供书籍访问和家庭成员访问的方法。考虑到标准和高级用户类派生自基类，两者的实现如图 4.12 所示：\n\n![](img/Figure_4.12.png)\n\
  \n\n该类包含的方法并不适用于标准用户类，而是适用于高级用户类，例如家庭成员访问和对书籍的无限访问。这种实现的问题在于，如果创建了 `StandardUser`\
  \ 类的实例，并误调用了只属于高级用户类的方法，系统将抛出异常，功能将失去其完整性。此外，所提模型没有反映针对高级账户的特定业务规则。\n\n解决此问题的两种方法一种是从基类中移除与高级账户的方法，另一种是使用接口。下面的截图代表了第一个解决方案：\n\
  \n\n图 4.13：重构后的用户基类\n\n这些方法从类中移除，是因为根据此示例的要求，它们并不是每个子类通用的。另一方面，这些方法被相应地放置在标准和高级用户类中，如下代码样本所示：\n\
  \n![](img/Figure_4.14.png)\n\n\nOOP 中良好的继承实践的主要点是父类应该只包含通用和标准的实现。`LSP` 规定父类应该被子类替换，反之亦然。尽管\
  \ `LSP` 的概念与 `OCP` 有不同，但它们的目标相似，即在根据新需求请求应用更改时避免问题。\n\n\n该原则帮助开发者避免在使用不代表业务需求的接口时犯错。类似于\
  \ `LSP`（即建议只在父类中使用适用于所有子类的属性和方法），接口隔离原则在接口方面应用了相同的概念。为了清楚理解该原则，请参考以下包含产品接口的截图：\n\
  \n![](img/Figure_4.15.png)\n\n\n\n\n在在线商店等常见场景中，系统很容易包含具有不同属性的产品。例如，下面的截图展示了两个不同类的实现：`Television`（电视）和\
  \ `OnlineBook`（在线书籍）：\n\n\n图 4.16：书籍和电视类\n\n如之前的截图所示，考虑到这两个类都实现了相同的 `IProduct` 接口，它们具有相同的属性。这种实现的问题在于，并不是所有类型的都共享相同的属性或方法。例如，与产品尺寸相关的字段（`Width`\
  \ 和 `Height`）对于 `Television` 是有意义，但对于 `OnlineBook` 则没有。为了获得更精确的代码定义，接口隔离原则指出，为每个产品类型创建一个独立的接口会更好，如下所示所示：\n\
  \n\n图 4.17：接口隔离\n\n每个特定类必须使用其底层接口，该接口包含了类中应该使用的正确字段。同样的概念也适用于方法，并且它是面向对象编程（OOP）范式中最核心的最佳实践之一。\n\
  \n\nSOLID 原则的最后一个 DIP（依赖倒转原则）强制要求在存在依赖关系的情况下，隐藏类之间实现的优秀实践。为了避免开发过程中的风险，每个类应该只包含与类本身相关的实现，并保持它们之间低耦合的关联。\n\
  \n例如，一个名为 `Document`（文档）的类可能有一个负责将文档转换为 PDF 或其他格式的方法。在实际场景中，文档转换的实现将放在一个不同的类中，并在文档类中引用它，如下所示：\n\
  \n\n图 4.18：Document 类\n\n在这个示例中，有两个明显的依赖关系：\n\n*   文档类可以在某些操作中保持其原始功能，而无需直接与转换器类关联。\n\
  \n因此，文档类依赖于另外两个类，而转换器类是 `Document` 类的依赖。考虑到文档转换过程通常会使用第三方库，如果有更改第三方库的需求，文档转换类与软件其他部分之间的高依赖可能会导致问题。\n\
  \n减少类之间依赖并遵循 DIP 的替代方案是在依赖其他类的类构造函数中将接口作为参数传递，如下代码示例所示：\n![](img/Figure_4.19.png)\n\
  \n图 4.19：依赖倒转原则\n\n通过这种方式实现，一旦转换器类共享相同的接口，你就可以转换器类的实现注入到 `Document` 类中。此外，它提高了类的测试性，因为更容易创建模拟类（mock\
  \ classes）来模拟转换器类的行为。\n## 结论\n\nSOLID 原则的创建是为了帮助编写更好的代码，考虑到 C# 是一种 OOP 语言，这些原则完美适用。所有原则都旨在尽可能地减少对现有软件更改的影响，并帮助我们编写更整洁的代码。SRP\
  \ 可以用于类和方法级别，甚至用于架构设计中，以减少组件之间的依赖并拥有更多可重用的功能。OCP 和 LSP 的主要点是，扩展软件功能比更改现有实现更安全。它避免了破坏性变更（break-changes）并使代码更具可读性。ISP\
  \ 和 DIP 也同样适用。\n\n在本章中，你学习了关于 SOLID 原则的核心信息。通过创建实际示例，你熟悉了在 .NET Core 项目的不同软件开发场景中使用这些原则的主要优势。\n\
  在下一章中，你将开启设计模式的之旅，并使用 .NET 5 和 C# 9.0 语言通过抽象工厂模式的实际示例。\n\n## 要点回顾\n\n*   当现有项目需要更改时，建议使用\
  \ OCP。\n*   SOLID 原则完美适用于 C# 语言以及使用 .NET 开发的项目。\n\n## 单选题\n\n1. 哪种 SOLID 原则规定类应该只有一个更改的原因？\n\
  \    2. 开闭原则 (Open/Closed Principle)\n    3. 里氏夫替换原则 (Liskov Substitution Principle)\n\
  \    4. 依赖倒转原则 (Dependency Inversion Principle)\n\n2. 根据 SOLID 原则，哪种原则建议高级模块不应该依赖于低级模块，两者都应该依赖于抽象？\n\
  \    2. 开闭原则\n    3. 里氏夫替换原则\n    4. 依赖倒转原则\n\n3. 哪种 SOLID 原则强调超类的对象应该被子类的对象替换而不影响程序的正确性？\n\
  \    2. 开闭原则\n    3. 里氏夫替换原则\n    4. 依赖倒转原则\n\n## 答案\n| 1 | A |\n| 2 | D |\n| 3\
  \ | C |\n\n## 思考题\n1. 解释 LSP 的主要优势。\n2. 哪种 SOLID 原则帮助我们减少类之间的依赖？\n3. 解释现有项目更改的风险。\n\
  \n## 核心术语\n*   单一职责原则 (SRP): 一个类应该只有一个更改的原因。\n*   开闭原则 (OCP): 软件实体（类、模块、函数等）应该对扩展开放，但对修改关闭。\n\
  *   里氏夫替换原则 (LSP): 子类型必须能够替换其基类型，而不改变程序的正确性。\n*   接口隔离原则 (ISP): 任何客户端都不应被强制依赖它们不使用的接口。\n\
  *   依赖倒转原则 (DIP): 高级模块不应该依赖于低级模块。两者都应该依赖于抽象。此外，抽象不应该依赖于细节。细节应该依赖于抽象。\n# 第 5 章 设计模式简介](#contents.xhtml_ch05a)\n\
  \n## 引言](#contents.xhtml_sc2_87a)\n\n通过本章，我们开始了设计模式概念的之旅，包括它们在软件开发中使用历史的细节，这将帮助你在进行软件项目时识别机会，并引导你针对市场中软件架构方面的常见问题找到正确的解决方案。\n\
  你将学习设计模式的重要性，以及为什么它们几十年来在软件开发中一直被使用。你还将理解书中后续章节中示例的最常见类型和分类。\n\n\n\n\n学习本单元后，你将能够理解设计模式的基本概念，并识别常见设计模式的分类。在本章中，我们将讨论设计模式在软件开发不同场景下的应用。\n\
  \n## 设计模式的重要性\n设计模式是软件开发中的热门话题。尽管如此，对于软件开发人员、软件架构师以及任何需要构建涉及重大技术决策的复杂软件的专业人士来说，了解它们的起源以及它们为什么在日常工作中如此重要，始终是关重要的。\n\
  \n软件开发中的常见问题可以通过标准解决方案来解决，许多公司和专业人士在特定场景下已经拥有经验，我们在从事特定项目时可以借鉴这些经验。设计模式是软件开发中反复出现问题的证明有效的解决方案。\n\
  \n它并非起始于软件开发领域，其概念借鉴自克里斯托弗·亚历山大（Christopher Alexander），他是一位土木工程师，记录了解决建筑相关问题的解决方案。他识别出了土木工程领域反复出现的情况。基于他在这些背景下解决问题的经验，他不仅决定记录这些案例，还将其发布并与其他分享。\n\
  在克里斯托弗·亚历山大发布了第一版土木设计模式后，这一理念在包括软件工程在内的其他领域变得变得有名。大约二十年后，软件开发的第一批设计模式被规范和创建，这导致了\
  \ 1995 年埃里克·伽马（Eric Gamma）、理查德·赫尔姆（Richard Helm）、沃尔夫·约翰逊（Ralph Johnson）和约翰·维西德斯（John\
  \ Vissides），即所谓的“四人帮”（Gang of Four）出版了《设计模式：可重用面向对象的设计》（Design Patterns: Elements\
  \ of Reusable Object-Oriented Software）。关于该主题的首次正式出版对该领域产生了巨大影响，确定了 23 种多年后仍然非常有用的模式。\n\
  \n这 23 种模式被选中是因为它们代表了软件开发中已知问题的优秀解决方案，遵循了克里斯托弗·亚历大的相同理念。尽管这 23 种模式在第一个出版物中被提到，但随着软件开发的演进和复杂性的增加，又创建并记录了数百种模式，其中包括适用于云应用、分布式系统、数据工程等更多场景的模式。\n\
  \n软件项目在设计和需求方面面临着巨大的挑战，因为它们的性质相当抽象，并且可能在开发过程中发生变化。在软件工程中，面临以前从未遇到的问题是常态，主要与软件的技术和业务方面有关。在软件设计中做出正确的决策对于项目的成功至关重要。这些决策显著影响可扩展性、可维护性、扩展性以及优秀编码技术和软件架构实践的其他关键方面。\n\
  除了拥有模式解决软件行业常见问题具有明显优势外，使用设计模式还有助于软件工程师之间的沟通，建立了一种共同语言，以便在代码结构和技术实现细节方面进行共享。\n\n\
  ## 设计模式的历史\n\n设计模式实际上源于 20 世纪 70 年代，源自克里斯托弗·亚历山大和其他著名人士编写的《模式语言：城镇、建筑、施工》（Pattern\
  \ Language: Towns, Buildings, Construction）。该出版物记录了包含 200 多个示例的建筑模式。“模式语言”一词是指 1986\
  \ 年出版的《以用户中心的系统设计》（User Centered System Design），该书建议将应用于数字项目和服务的交互设计模式。\n与此同时，20\
  \ 世纪 80 年代开始了针对软件工程的广泛研究。肯特·贝克（Kent Beck）和沃德·坎宁姆（Ward Cunningham）在 Tektronix Test\
  \ Systems Group 工作时使用了定义的设计模式。亚历山大的思想指导了这两位专业人士，定义以用户为中心的软件设计。\n\n同时，埃里希·伽马（Erich\
  \ Gamma）在准备博士论文期间看到了定义已知问题解决方案的重要性。他认为设计模式有助于提高使用面向对象范式的软件项目的质量。作为准备欧洲面向对象编程主题会议的一部分，伽马、理查德·赫尔姆等人在\
  \ 1991 年投入了大量精力记录软件开发模式。\n\n在 1991 年的这次会议上，伽马和赫尔姆将其工作与沃尔夫·约翰逊和约翰·维西德的工作相结合，创建了一个名为“四人帮”（Gang\
  \ of Four, GoF）的非正式小组，这个名字在软件行业变得非常流行。这四位专业人士出版了《设计模式：可重用面向对象的设计》，正如本章提到的，书中包含了\
  \ 23 种模式。\n设计模式并没有随着“四人帮”出版的第一本书而停止。它随着时间的推移而不断演进，得到了来自公司和个人贡献者的重要贡献，包括山地小组（Hillside\
  \ Group）的贡献。这个非营利组织创建了《程序模式语言》（Pattern Languages of Programs），这是一系列年度会议，其首要目标是审查和评估设计模式的领先水平。本章的后续章节解释了许多相关的设计模式类型。\n\
  \n## 设计模式分类\n\n设计模式通常根据其目的分为四大类：创建型、结构型、行为型和并发。在定义了前 23 种设计模式后，根据软件开发的新需求又定义了许多模式，包括用于云架构和分布式系统的模式。\n\
  ## 创建型模式\n\n创建型模式简化了复杂对象的创建过程，将构建这些对象的逻辑从类本身分离出来。这种设计模式通常实现一个多个类使用的接口，负责构建具有相似结构的对象。\n\
  \n分离复杂对象的构建允许将创建拆分为细小的步骤，以便任何在该项目工作的开发者都能轻松理解。创建型设计模式旨在封装运行时需要创建哪些类，有时会从应用程序的调用者处隐藏这些类的实例。\n\
  可以根据实现方式对创建模式进行分组，一种侧重于处理对象如何创建，另一种则侧重于类是如何创建的。市场上通用的五种已知的创建模式有：\n\n*   抽象工厂 (Abstract\
  \ factory)\n*   构建器模式 (Builder pattern)\n*   工厂方法模式 (Factory method pattern)\n*\
  \   单例模式 (Single pattern)\n\n在本书的后续章节中，你将有机会通过结合 .NET 平台最新版本的特性（如 Blazor、GRPC 等）来实现所有这些创建型模式。尽管设计模式是一个与平台和技术无关的话题，但本书将向你展示如何使用\
  \ .NET 平台和 C#语言的最新特性使用最著名的模式来构建可扩展和易扩展的应用程序。\n\n## 行为型模式\n\n\n\n\n行为模式通常用于实现类与类之间良好的良好实践，减少它们之间的耦合性。某些模式主要用于\
  \ `.NET` 应用程序，例如 `mediator` 和 `command` 模式。最常见的行为模式有：\n*   责任链模式\n*   命令模式\n*  \
  \ 解释器模式\n*   迭代器模式\n*   中者模式\n*   观察者模式\n*   状态模式\n    *   策略模式\n    *   模板方法模式\n\
  \    *   访问者模式\n在本书所举例的企业级应用开发过程中，你会发现这种模式的主要目标是在类之间传递信息，其传递方式可以在不损害每个类的自主性和可测试性的情况下允许工作流执行。\n\
  \n理解这些模式分类背后的类别对于正确使用它们至关重要。每种模式的记录都是为了解决特定问题，而分类有助于在我们正在进行的项目背景下识别出正确的模式。任何设计模式的使用都应该基于特定的标准，以清晰地理解需要解决的问题。\n\
  \n## 结构型模式\n结构型模式旨在促进一个或多个应用程序中类与组件之间的关系。这种模式通常用于建立系统之间的集成，减少不同组件之间的依赖关系。我们可以看到一些结构型模式主要用于\
  \ `.NET` 应用程序，例如 `Decorator` 模式和 `Adapter` 模式等。\n\n*   适配器模式\n*   聚合模式\n*   桥接模式\n\
  *   装饰器模式\n*   扩展性模式\n*   外观模式\n*   重量类模式\n*   代理模式\n总之，结构型模式是结合多个对象和类以整合复杂结构并实现系统清晰目标的极佳方法。系统中多个不同组件的组合需要软件工程师和软件架构师具备深厚的知识，而正确理解结构型模式对于构建可扩展、灵活且易于长期更改和维护的应用程序至关重要。\n\
  \n## 分布式系统模式\n\n开发涉及多个应用程序、托管在多个区域的数据库以及大量负载的复杂系统，在软件架构方面需要复杂的技术来支持系统的长期运行。随着企业级应用的演进，构建分布式系统的挑战变得更加复杂，需要记录和识别能够帮助创建分布式系统的模式。\n\
  对于任何需要支持每日数百万用户并发访问的应用程序，无论使用何种技术构建系统，在软件架构方面都需要考虑许多因素，例如网络问题、服务器宕机、同步问题等。\n\n为了解决这些反复出现的问题，软件行业、专家和大型公司记录了一系列专门用于分布式系统的设计模式：\n\
  \n*   时钟边界等待\n*   涌现领导\n*   固定分区\n*   低水位线\n*   法定人数 (Quorum)\n*   请求批\n*   租赁\n\
  *   领导与跟随者\n*   心跳\n*   版本向量\n\n\n## 微服务设计模式\n\n微服务一直是现代应用程序的一种流行的架构方法。根据系统的规模，它可能涉及数百个应用程序的开发，这通常发生在大型金融系统、电子商务以及涉及复杂交易和数百万并发请求的领域。微服务设计模式解决了以下挑战：可扩展性、韧性、可用性、自动置备、故障隔离等。基于这些挑战，有已知的微服务模式可以应用：\n\
  \n*   按子域分解\n*   绞杀者模式 (Strangler pattern)\n*   API 网关模式\n*   聚合模式\n*   每个服务数据库\n\
  *   健康检查\n*   断路器模式\n\n许多其他模式也被用于解决微服务架构中的问题，包括持续交付模式、边车（sidecars）等。模式的定义和记录是一个永不停止的过程。因此，微服务架构和其他用途的模式列表将随时间的推移继续增长。\n\
  \n\n正确理解设计模式是任何软件开发人员的一项基本技能。它包括在真实项目中选择正确方法来解决复杂问题的能力，应对涉及系统性能、可扩展性、维护预测性以及任何软件项目许多关键方面的功能性和非功能性压力。\n\
  \n在本章中，你有学习应用于软件开发的设计模式的历史、最常见的类别，并概述了设计模式对于面向对象编程、分布式系统和微服务架构的重要性。\n\n\n## 记忆要点\n\
  \n*   软件开发的设计模式灵感源于土木工程的模式，包括建筑设计。\n*   建议理解设计模式类别，以便将每种模式应用于正确的场景。\n*   在某些情况下，开发复杂的应用程序将涉及多种模式的结合以满足功能性和功能性需求。\n\
  *   对于任何想要使用面向对象范式构建复杂可靠应用程序的开发者来说，设计模式都是至关重要的。\n\n## 单选题\n\n    1. 创建模式\n    2.\
  \ 结构型模式\n    3. 行为模式\n    4. 架构模式\n\n    1. 创建模式\n    2. 结构型模式\n    3. 行为模式\n  \
  \  4. 架构模式\n\n    1. 创建模式\n    2. 结构型模式\n    3. 行为模式\n    4. 架构模式\n\n\n| 1 | A |\n\
  \n\n\n\n| 2 | D |\n| 3 | C |\n\n## 问题\n\n1. 解释创建型模式的主要目的。\n3. 描述使用设计模式的主要优势。\n\n\
  ## 关键术语\n\n- **创建型模式 (Creational Patterns)**：这些模式处理对象的创建机制，试图以适用于场景的方式创建对象。\n- **行为型模式\
  \ (Behavioral Patterns)**：这些模式关于识别对象之间常见的通信模式并实现这些模式。\n- **并发模式 (Concurrency Patterns)**：关注多线程编程范式。它们以确保安全和高效执行的方式来处理多线程执行模型。\n\
  - **架构模式 (Architectural Patterns)**：这些是处理软件架构的高级模式。它们为更广泛的系统架构提供了一套模板。\n\n## 加入我们书籍的\
