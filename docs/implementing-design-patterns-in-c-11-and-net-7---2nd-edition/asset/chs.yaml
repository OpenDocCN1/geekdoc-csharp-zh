  \n\n# 第 7 章 使用 Blazor 的抽象工厂模式\n\n## 引言\n\n\n学习抽象工厂模式允许你能够优雅地应用面向对象编程中关于多态和封装的最佳实践，同时开发一个稳定的结构，以扩展和扩展项目的复杂性，并能够快速支持需求变更。了解这种设计模式对于熟悉市场上使用的其他创建性模式至关重要。\n\
  \n通过本章，你将有机会理解抽象工厂模式，并以循序渐进的方法将其概念应用于 Blazor 应用程序中。\n\n\n在本章中，我们将讨论以下主题：\n\n- 抽象工厂模式概念\n\
  - `C#` 和 `.NET` 示例\n\n## 目标\n\n学习完本单元后，你应该能够理解抽象工厂模式，将抽象工厂模式应用到真实项目项目中，并识别封装、多态以及其他面向对象编程概念的使用。\n\
  \n\n软件开发中的任何设计模式都代表了在反复场景中频繁发生的常见问题的通用解决方案，它是构建遵循市场广泛认可方法的软件架构的健健的替代方案。所有软件项目在业务和非功能需求上都不同，但许多项目面临相似的技术挑战。\n\
  \n例如，想象一个场景：系统有一个允许用户为在线商店注册产品和服务的对象。不同的公司销售不同类型的产品，但实现此类系统背后的基础设施在类、业务逻辑、数据模型、数据库结构和技术需求方面是非常相似的，包括控制事务以及支持注册在属性和特性方面具有不同配置的大量条目的需求。\n\
  \n\n在这种背景下，在所有可用的设计模式列表中，存在抽象工厂模式，它允许我们创建相关对象族，并将创建这些对象的复杂性从消耗这些对象的应用程序抽象出来。简而言之，当系统需要创建根据复杂规则具有不同属性创建方式的对象时，抽象工厂模式封装了具体类背后对象构建的实现和逻辑，使我们能够通过插入相同族中的更多类型对象来扩展软件架构，而不损害实现的完整性和应用程序的一致性。\n\
  \n正如本书之前所的，在基于面向对象编程范式的软件开发中，正确使用接口是具有可测试性、可扩展且可靠的结构的本质特征之一，这代表了抽象工厂模式的关键点之一。\n\n\
  \n考虑到抽象工厂模式降低了对象族创建的复杂性，将其概念应用到需求与抽象工厂模式旨在解决的问题相似的项目中是非常关重要的。因此，在本节中，你将有机会实现一家移动公司的基础结构，该公司向客户销售与短信、移动数据和其他服务的各种类型计划，这代表了一个抽象工厂模式可以解决以下要求的场景：\n\
  \n- 公司将为客户提供两种计划：预付和后付\n- 两种计划在短信、网络连接速度和移动数据限制方面必须有不同的条件\n- 预付选项的最大速度为每秒 10 兆字节\n\
  - 预付计划同月内的数据传输限制为 10 GB\n- 后付选项提供无限数据传输和无限数量的短信\n- 后付计划具有高速网络连接，最高每秒 500 兆字节\n\n\
  \n| 移动计划 | 短信限制 | 移动数据传输 | 连接速度 |\n| --- | --- | --- | --- |\n| 预付 | 1000/月 | 10\
  \ GB/月 | 10 兆字节/秒 |\n| 后付 | 无限 | 无限 | 500 兆字节/秒 |\n表 7.1：移动计划\n\n给定该场景，抽象工厂模式的使用允许我们通过将实现从应用程序的最高层（在本文模式中是客户端层）抽象出来来构建这些复杂对象，如图\
  \ 7.1 所示：\n\n![](img/Figure_7.1.png)\n图 7.1：抽象工厂实现\n\n\n\n\n\n## 抽象工厂实现\n\n考虑到给定场景中建立的需求和模型结构，实现\
  \ `Abstract Factory` 模式的第一步是创建各个类和接口。在本章的真实示例中，使用一个 `Blazor` 应用作为客户端程序，并使用内存中的对象模拟与数据库的交互。遵循图\
  \ 7.1 所示的图，必须为每个工厂创建并定义第一个类，从 `Text Message Factory`（短信工厂）及其底层接口开始，范围限于图 7.2 所示的内容：\n\
  \n\n图 7.2: 短信工厂表示\n\n`Text Message Factory` 的实现需要一个接口，该接口应包含与类别底层具体类型（无限量和每月 1000\
  \ 条）相关的属性，如图 7.3 所示：\n\n\n图 7.3: 短信工厂接口\n\n该接口仅包含两个属性，旨在当场景中的其他类消费这些对象时识别它们之间的差异。对于任何项目，为\
  \ `Abstract Factory` 类创建接口在未来的可测试性和扩展性方面都是很好的做法，我们示例的下一步是为 `Text Message Factory`\
  \ 创建实现给定接口的具体类，如图 7.4 所示：\n\n\n图 7.4: 千条短信类\n\n由于给定场景考虑了两种类型的短信套餐（无限量和千条短信），必须创建关于无限类型的第二个类，实现相同的接口\
  \ `ITextMessageFactory`，如图 7.5 所示：\n\n\n图 7.5: 无限短信类\n\n考虑到两种类型实现了相同的接口，它们具有相同的成员和方法。然而，每种类型都可以根据每个规范实现不同的行为。这种方法允许我们一致地创建单元和测试，模拟数据库的集成，注入数据并将功能扩展到其他类型，而不破坏现有实现。\n\
