    2\. Facade Pattern:


    The Facade Pattern provides a unified interface to a set of interfaces in a subsystem.
    It simplifies complex systems by providing a higher-level interface that hides
    the complexity of the underlying components.


    Example:


    ```csharp


    // Subsystem Components


    public class SubsystemA


    {


    public void OperationA() { }


    }


    public class SubsystemB


    {


    public void OperationB() { }


    }


    // Facade


    public class SystemFacade


    {


    private readonly SubsystemA _subsystemA;


    private readonly SubsystemB _subsystemB;


    public SystemFacade(SubsystemA subsystemA, SubsystemB subsystemB)


    {


    _subsystemA = subsystemA;


    _subsystemB = subsystemB;


    }


    public void PerformComplexOperation()


    {


    _subsystemA.OperationA();


    _subsystemB.OperationB();


    }


    }


    ```


    3\. Factory Pattern:


    The Factory Pattern provides an interface for creating objects without specifying
    their concrete classes. It encapsulates object creation logic, making the system
    more flexible and easier to extend.


    Example:


    ```csharp


    // Product Interface


    public interface IProduct


    {


    void Operation();


    }


    // Concrete Products


    public class ConcreteProductA : IProduct


    {


    public void Operation() { }


    }


    public class ConcreteProductB : IProduct


    {


    public void Operation() { }


    }


    // Factory


    public class ProductFactory


    {


    public IProduct CreateProduct(string type)


    {


    switch (type)


    {


    case "A":


    return new ConcreteProductA();


    case "B":


    return new ConcreteProductB();


    default:


    throw new ArgumentException("Invalid product type");


    }


    }


    }


    ```


    4\. Singleton Pattern:


    The Singleton Pattern ensures that a class has only one instance and provides
    a global point of access to that instance. It is often used for managing resources
    or state that should be shared across the application.


    Example:


    ```csharp


    // Singleton Implementation


    public class Singleton


    {


    private static Singleton _instance;


    private static readonly object _lock = new object();


    private Singleton() { }


    public static Singleton Instance


    {


    get


    {


    lock (_lock)


    {


    if (_instance == null)


    {


    _instance = new Singleton();


    }


    return _instance;


    }


    }


    }


    }


    ```


    5\. Observer Pattern:


    The Observer Pattern defines a one-to-many dependency between objects so that
    when one object changes state, all its dependents are notified and updated automatically.
    It is useful for implementing event-driven architectures.


    Example:


    ```csharp


    // Subject Interface


    public interface ISubject


    {


    void Attach(IObserver observer);


    void Detach(IObserver observer);


    void Notify();


    }


    // Concrete Subject


    public class ConcreteSubject : ISubject


    {


    private readonly List<IObserver> _observers = new List<IObserver>();


    public void Attach(IObserver observer)


    {


    _observers.Add(observer);


    }


    public void Detach(IObserver observer)


    {


    _observers.Remove(observer);


    }


    public void Notify()


    {


    foreach (var observer in _observers)


    {


    observer.Update();


    }


    }


    }


    // Observer Interface


    public interface IObserver


    {


    void Update();


    }


    // Concrete Observer


    public class ConcreteObserver : IObserver


    {


    public void Update()


    {


    // Handle update


    }


    }


    ```


