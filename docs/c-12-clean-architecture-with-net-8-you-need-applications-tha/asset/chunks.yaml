    \ HTML 与 C# 代码结合在一起。\n\n```html\n<!-- 视图示例 - Index.cshtml -->\n@model IEnumerable<OrderDto>\n\
    \n@foreach (var order in Model)\n{\n    <div>\n        <h4>订单 ID: @order.Id</h4>\n\
    \        <p>客户姓名: @order.CustomerName</p>\n        <p>总金额: @order.TotalAmount</p>\n\
    \    </div>\n}\n```\n\n### 2.3 依赖注入\n\nASP.NET Core MVC 开箱即支持依赖注入，使得将服务和组件注入到控制器、视图以及应用程序的其他部分变得容易。\n\
    \n```csharp\n// 表示层 Startup.cs\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    services.AddControllersWithViews();\n\n    // 注册服务\n    services.AddScoped<IOrderService,\
    \ OrderService>();\n}\n```\n\n## 3. ASP.NET Core MVC 在清洁架构中的优势\n\n### 3.1 关注点分离\n\
    \nASP.NET Core MVC 通过将表示逻辑（控制器和视图）与业务逻辑和数据访问层分离来促进关注点分离。这种分离增强了可维护性和可测试性。\n\n\
    ### 3.2 可测试性\n\n借助清洁架构和 ASP.NET Core MVC，可以使用 Moq 或 NSubstitute 等模拟框架对控制器和视图进行隔离单元测试。这确保了表示层按预期行为。\n\
    \n### 3.3 可扩展性\n\nASP.NET Core MVC 提供了一个可扩展的架构，允许随着应用程序的增长添加新的功能和组件。MVC 的模块化特性使开发者能够在不损害其架构的情况下扩展和定制应用程序。\n\
    \nASP.NET Core MVC 8 是一个强大且灵活的框架，用于在 C# 12 和 .NET 8 中构建 Web 应用程序，尤其是在清洁架构的背景下。通过将\
    \ ASP.NET Core MVC 实现为表示层，开发者可以在其应用程序中实现关注点分离、可维护性和可测试性。凭借模型-视图-控制器模式、路由、模型绑定和依赖注入等特性，ASP.NET\
    \ Core MVC 为构建现代 Web 应用程序提供了坚实的基础。将 ASP.NET Core MVC 作为清洁架构项目的关键组件，以构建满足现代软件开发要求的可扩展、可维护且高质量的\
    \ Web 应用程序。\n\n## 从 ASP.NET Core MVC 控制器使用业务逻辑层（C# 12）\n\n从 ASP.NET Core MVC 控制器使用业务逻辑层是在\
    \ C# 12 和 .NET 8 中构建 Web 应用程序的一个基本方面，尤其是在清洁架构的背景下。清洁架构促进了关注点分离，其中表示层（MVC 控制器）通过定义良好的接口与应用程序层（业务逻辑）进行交互。让我们探讨如何从\
    \ ASP.NET Core MVC 控制器使用业务逻辑层，同时提供代码示例并遵循清洁架构原则。\n\n### 1. 理解清洁架构层\n\n#### 1.1\
    \ 表示层（MVC 控制器）\n\n表示层使用 ASP.NET Core MVC 控制器实现，负责处理用户交互、处理 HTTP 请求和呈现视图。\n\n####\
    \ 1.2 应用程序层（业务逻辑）\n\n应用程序层包含应用程序的业务逻辑，包括用例、工作流和业务规则。它协调表示层和领域层之间的交互。\n\n### 2.\
    \ 从 MVC 控制器使用业务逻辑层\n\n#### 2.1 依赖注入\n\n使用依赖注入将业务逻辑层中的必要服务注入到 MVC 控制器中。这允许控制器使用应用程序层提供的功能。\n\
    \n```csharp\n// 表示层示例 - OrderController\npublic class OrderController : Controller\n\
    {\n    private readonly IOrderService _orderService;\n\n    public OrderController(IOrderService\
    \ orderService)\n    {\n        _orderService = orderService;\n    }\n\n    //\
    \ 使用业务逻辑的操作方法\n    public async Task<IActionResult> Index()\n    {\n```\n"
