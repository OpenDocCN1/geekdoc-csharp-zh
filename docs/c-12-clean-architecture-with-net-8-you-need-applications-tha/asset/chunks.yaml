    In the infrastructure layer, implement repository interfaces using Entity Framework
    Core or other data access technologies. Repository implementations encapsulate
    database interactions and adhere to the contract defined by the repository interfaces.


    ```csharp


    // Infrastructure Layer Example - Order Repository Implementation


    public class OrderRepository : IOrderRepository


    {


    private readonly AppDbContext _dbContext;


    public OrderRepository(AppDbContext dbContext)


    {


    _dbContext = dbContext;


    }


    public async Task<Order> GetByIdAsync(int id)


    {


    return await _dbContext.Orders.FindAsync(id);


    }


    public async Task<IEnumerable<Order>> GetAllAsync()


    {


    return await _dbContext.Orders.ToListAsync();


    }


    public async Task CreateAsync(Order order)


    {


    _dbContext.Orders.Add(order);


    await _dbContext.SaveChangesAsync();


