    \ and evolution of the software.\n\n**Code Example:**\n\n```\nMyApp\n|-- Domain\n\
    |-- Application\n|-- Infrastructure\n|-- Presentation\n```\n\n### 2. Dependency\
    \ Inversion\n\nClean Architecture emphasizes the Dependency Inversion Principle\
    \ (DIP), which states that high-level modules should not depend on low-level modules;\
    \ both should depend on abstractions. This principle allows for loose coupling\
