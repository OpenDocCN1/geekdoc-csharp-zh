    Data Persistence with .NET 8 in Clean Architecture


    Choosing the Right Data Access Technology (.NET Entity Framework Core)


    Choosing the right data access technology is crucial for building robust and scalable
    applications in C# 12 with .NET 8, especially within the context of clean architecture.
    One of the most popular choices for data access in .NET is Entity Framework Core
    (EF Core). Let''s explore the considerations and advantages of using EF Core,
    along with code examples, within a clean architecture setup.


    1\. Understanding Entity Framework Core (EF Core):


    1.1 What is EF Core?


    Entity Framework Core (EF Core) is an open-source, cross-platform Object-Relational
    Mapping (ORM) framework for .NET. It provides a powerful set of tools for mapping
    domain entities to database tables, querying data, and managing database operations.


    1.2 Key Features of EF Core:


    ● ORM Capabilities: EF Core allows developers to work with domain objects directly,
    abstracting away the underlying database interactions.


    ● Linq Support: EF Core supports LINQ queries, making it easy to write expressive
    and efficient database queries using C# language features.


    ● Code-First Approach: Developers can define database entities and relationships
    using C# classes, and EF Core generates the corresponding database schema.


    ● Migration Support: EF Core provides tools for managing database schema changes
    over time through migrations, enabling seamless database updates.


    2\. Considerations for Choosing EF Core:


    2.1 Compatibility with Clean Architecture:


    EF Core fits well with clean architecture principles, as it allows for the separation
    of concerns between the data access layer and the domain layer. Developers can
    define database entities and repositories within the infrastructure layer, while
    keeping the domain layer independent of specific database technologies.


    2.2 Performance and Scalability:


    EF Core offers good performance for most applications, especially when combined
    with best practices such as proper indexing and query optimization. However, for
    highly performance-critical applications, it''s essential to carefully benchmark
    and optimize database interactions.


    2.3 Ease of Development:


    One of the major advantages of EF Core is its ease of use and developer productivity.
    With its intuitive API and tooling support, developers can quickly build and maintain
    data access code without needing to write complex SQL queries manually.


    3\. Implementing EF Core in Clean Architecture:


    3.1 Defining Database Entities:


    In the infrastructure layer of clean architecture, define database entities using
    EF Core''s code-first approach. These entities map to database tables and represent
    the domain concepts.


    ```csharp


    // Entity Framework Core Example - Order Entity


    public class OrderEntity


    {


    public int Id { get; set; }


    public string CustomerName { get; set; }


    public decimal TotalAmount { get; set; }


    // Other properties


    }


    ```


    3.2 Implementing Repositories:


    Create repository interfaces and implementations to abstract database operations.
    Repositories encapsulate data access logic and provide a clean interface for interacting
    with the database.


    ```csharp


    // Infrastructure Layer Example - Order Repository Interface


    public interface IOrderRepository


    {


    Task<OrderEntity> GetByIdAsync(int id);


    Task CreateAsync(OrderEntity order);


    // Other repository methods


    }


    ```


    ```csharp


    // Infrastructure Layer Example - Order Repository Implementation


    public class OrderRepository : IOrderRepository


    {


    private readonly AppDbContext _dbContext;


    public OrderRepository(AppDbContext dbContext)


    {


    _dbContext = dbContext;


    }


    public async Task<OrderEntity> GetByIdAsync(int id)


    {


    return await _dbContext.Orders.FindAsync(id);


    }


    public async Task CreateAsync(OrderEntity order)


    {


    _dbContext.Orders.Add(order);


    await _dbContext.SaveChangesAsync();


    }


    // Other repository methods


    }


    ```


    3.3 Configuring EF Core Context:


    Configure the EF Core database context, specifying database providers, connection
    strings, and entity mappings. This configuration is typically done in the startup
    class of the presentation layer.


    ```csharp


    // Presentation Layer Startup.cs


    public void ConfigureServices(IServiceCollection services)


    {


    // Configure EF Core context


    services.AddDbContext<AppDbContext>(options =>


    options.UseSqlServer(Configuration.GetConnectionString("DefaultConnection")));


    // Register repositories


    services.AddScoped<IOrderRepository, OrderRepository>();


