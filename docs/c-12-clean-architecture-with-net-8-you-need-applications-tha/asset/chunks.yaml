    \    {\n        private readonly ProductService _productService;\n\n        public\
    \ ProductController(ProductService productService)\n        {\n            _productService\
    \ = productService;\n        }\n\n        [HttpGet]\n        public async Task<ActionResult<List<Product>>>\
    \ GetAllProducts()\n        {\n            var products = await _productService.GetAllProductsAsync();\n\
    \            return Ok(products);\n        }\n    }\n}\n```\n\n分层架构是一种强大的设计模式，它促进了软件系统中的关注点分离和模块化。通过将代码库组织成不同的层，开发人员可以构建更易于理解、维护和扩展的软件。借助\
    \ `C# 12` 和 `.NET 8` 中的特性和增强功能，实现分层架构变得更加高效和有效，使团队能够构建满足现代软件开发需求的健壮且可扩展的软件系统。\n\
    \n### 依赖规则：高层模块不应依赖于低层模块\n\n依赖规则是整洁架构的一个关键原则，它指出高层模块不应依赖于低层模块。相反，两者都应依赖于抽象。此规则旨在促进组件之间的松耦合，提高可维护性，并实现更轻松的测试和可扩展性。在本指南中，我们将探讨依赖规则，并在整洁架构的上下文中，使用\
    \ `C# 12` 和 `.NET 6` 演示其实现。\n\n#### 理解依赖规则\n\n在整洁架构中，模块被组织成层，每层负责特定的任务或关注点。依赖规则规定，包含更抽象和特定于业务逻辑的高层模块，不应依赖于包含实现细节或基础设施关注点的低层模块。相反，两者都应依赖于抽象或接口。\n\
    \n此原则确保对低层模块（如数据库访问或外部依赖）的更改不会影响高层模块。它还促进了模块化，允许组件独立开发和维护。此外，依赖规则通过使组件在测试期间易于模拟或替换来促进可测试性。\n\
