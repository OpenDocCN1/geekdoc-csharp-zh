    \n#### 1.2 依赖注入如何促进松耦合\n\n依赖注入通过将创建和管理依赖的责任从使用它们的类中移除，从而解耦组件。类不再内部创建依赖，而是从外部源接收它们，通常是通过构造函数注入。\n\
    \n#### 1.3 代码示例\n\n考虑一个例子，其中 `OrderService` 类依赖于 `IOrderRepository` 接口来与数据库交互。如果没有\
    \ DI，`OrderService` 将在内部创建 `OrderRepository` 的实例，导致紧耦合。\n\n```csharp\n// Without\
    \ Dependency Injection\npublic class OrderService : IOrderService\n{\n    private\
    \ readonly IOrderRepository _orderRepository = new OrderRepository();\n    //\
