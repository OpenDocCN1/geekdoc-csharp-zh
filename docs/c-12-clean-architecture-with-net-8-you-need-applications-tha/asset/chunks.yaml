- fmt: "# 依赖注入在 ASP.NET Core MVC 中的优势\n\n## 3.1 灵活性\n\n依赖注入允许在运行时替换实现，从而轻松更改服务实现或引入新功能，而无需修改现有代码。\n\
    \n## 3.2 可测试性\n\n通过将依赖注入到类中，ASP.NET Core MVC 应用程序变得更容易测试。在单元测试期间模拟或替换依赖，可以对各个组件进行隔离测试。\n\
    \n## 3.3 模块化设计\n\n依赖注入通过将应用程序分解为更小的、可互换的组件来促进模块化设计。这有助于更好的代码组织，并使应用程序更易于理解和维护。\n\
    \n在 ASP.NET Core MVC 应用程序中实现依赖注入对于在 C# 12 和 .NET 8 中实现灵活性、模块性和可维护性至关重要，尤其是在清洁架构的背景下。通过在内置依赖注入容器中注册服务和依赖，将依赖注入到控制器和服务类中，并利用构造函数注入，开发人员可以在其应用程序中实现松散耦合、可测试性和灵活性。清洁架构原则指导应用程序的设计和组织，促进关注点分离和模块化。将依赖注入作为\
    \ ASP.NET Core MVC 开发的基础原则，以构建可扩展且可维护的 Web 应用程序，满足现代软件开发的要求。\n\n# 利用 Minimal API\
    \ 实现简洁高效的控制器（.NET 8 新特性）\n\n在 .NET 8 中利用 Minimal API 提供了一种简洁高效的方式来构建 ASP.NET Core\
    \ 应用程序中的控制器，尤其是在清洁架构的背景下。Minimal API 简化了定义端点的过程，减少了样板代码，并提供了更专注的开发体验。让我们探索如何在\
    \ C# 12 和 .NET 8 中，遵循清洁架构原则，利用 Minimal API 创建控制器，并附带代码示例。\n\n## 1. 理解 Minimal\
