    \    {\n        var orderService = new OrderService();\n        // Test logic\
    \ using orderService\n    }\n}\n```\n\n通过依赖注入，我们可以在测试期间注入 `IOrderRepository` 的模拟实现，从而更容易地隔离和测试\
    \ `OrderService` 类。\n\n```csharp\n// With Dependency Injection (Easier to test)\n\
    [TestClass]\npublic class OrderServiceTests\n{\n    [TestMethod]\n    public async\
    \ Task PlaceOrderAsync_Should_Create_Order()\n    {\n        // Arrange\n    \
    \    var mockOrderRepository = new Mock<IOrderRepository>();\n        var orderService\
