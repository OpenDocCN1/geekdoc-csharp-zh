    Use cases represent specific actions or interactions that users can perform within
    the system to achieve a particular goal or outcome. Each use case encapsulates
    a set of related actions and business rules that are executed to fulfill a user
    request.


    2.2 Defining Use Cases:


    Use cases are typically implemented within the application layer of clean architecture.
    This layer contains application-specific logic and orchestrates the interaction
    between the domain entities and the infrastructure services.


