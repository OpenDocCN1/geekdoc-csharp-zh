    \ orderService.PlaceOrderAsync(orderDto);\n\n        // 断言\n        mockOrderRepository.Verify(repo\
    \ => repo.CreateAsync(It.IsAny<OrderEntity>()), Times.Once);\n    }\n}\n```\n\n\
    #### 3.2 集成测试\n\n集成测试确保系统不同组件之间的交互按预期工作。通过测试领域层与基础设施层的集成，开发者可以验证应用程序的端到端行为。\n\n\
    ```csharp\n// 集成测试示例 - OrderRepository\n[TestClass]\npublic class OrderRepositoryTests\n\
