    \n#### 2.2 依赖注入如何增强可测试性\n\n依赖注入通过允许在单元测试期间将依赖替换为模拟对象或存根来促进测试。这使开发者能够隔离组件，并专注于测试其特定行为，而无需担心其依赖的行为。\n\
    \n#### 2.3 代码示例\n\n考虑测试 `OrderService` 类。如果没有依赖注入，将很难隔离该类并独立于 `OrderRepository`\
    \ 测试其行为。\n\n```csharp\n// Without Dependency Injection (Difficult to test)\n[TestClass]\n\
