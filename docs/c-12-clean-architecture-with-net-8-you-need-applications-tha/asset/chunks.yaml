- fmt: "\n## 项目结构\n\n```\nSolutionName\n│\n├───src\n│   ├───Application        //\
    \ Application Layer\n│   ├───Domain             // Domain Layer\n│   ├───Infrastructure\
    \    // Infrastructure Layer\n│   └───Presentation       // Presentation Layer\n\
    │\n└───tests\n    ├───Application.Tests // Application Layer Tests\n    ├───Domain.Tests\
    \      // Domain Layer Tests\n    └───Infrastructure.Tests // Infrastructure Layer\
    \ Tests\n```\n\n- `src`: Contains the source code for the application.\n- `Application`:\
    \ Houses application-specific logic and use cases.\n- `Domain`: Contains domain\
    \ entities, value objects, and domain logic.\n- `Infrastructure`: Holds implementations\
    \ of interfaces defined in the domain layer and deals with external dependencies.\n\
    - `Presentation`: Handles UI and user interaction.\n- `tests`: Contains unit and\
    \ integration tests for each layer.\n\n## 项目设置\n\n### Application Layer\n\nThis\
    \ layer contains application-specific business rules and logic. It doesn't depend\
    \ on any other layer.\n\n```csharp\n// src/Application/MyApplication.csproj\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \  </PropertyGroup>\n</Project>\n```\n\n### Domain Layer\n\nThe domain layer contains\
    \ entities, value objects, interfaces, and domain logic.\n\n```csharp\n// src/Domain/MyDomain.csproj\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \  </PropertyGroup>\n</Project>\n```\n\n### Infrastructure Layer\n\nThis layer\
    \ contains implementations of interfaces defined in the domain layer. It deals\
    \ with database access, file IO, external services, etc.\n\n```csharp\n// src/Infrastructure/MyInfrastructure.csproj\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \  </PropertyGroup>\n</Project>\n```\n\n### Presentation Layer\n\nThis layer is\
    \ responsible for UI and input/output handling.\n\n```csharp\n// src/Presentation/MyPresentation.csproj\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \    <OutputType>Exe</OutputType>\n    <UseWPF>true</UseWPF> // Use WPF for desktop\
    \ apps\n    <!-- <UseWinForms>true</UseWinForms> Use WinForms for desktop apps\
    \ -->\n    <!-- <UseBlazor>true</UseBlazor> Use Blazor for web apps -->\n  </PropertyGroup>\n\
    </Project>\n```\n\n### Tests Projects\n\nThese projects contain unit and integration\
    \ tests for respective layers.\n\n```csharp\n// tests/Application.Tests/Application.Tests.csproj\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \  </PropertyGroup>\n  <ItemGroup>\n    <ProjectReference Include=\"../src/Application/MyApplication.csproj\"\
    \ />\n  </ItemGroup>\n</Project>\n```\n\n```csharp\n// tests/Domain.Tests/Domain.Tests.csproj\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \  </PropertyGroup>\n  <ItemGroup>\n    <ProjectReference Include=\"../src/Domain/MyDomain.csproj\"\
    \ />\n  </ItemGroup>\n</Project>\n```\n\n```csharp\n// tests/Infrastructure.Tests/Infrastructure.Tests.csproj\n\
    <Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \  </PropertyGroup>\n  <ItemGroup>\n    <ProjectReference Include=\"../src/Infrastructure/MyInfrastructure.csproj\"\
    \ />\n  </ItemGroup>\n</Project>\n```\n\n## 依赖注入\n\nIn the `Infrastructure` layer,\
    \ configure DI for interfaces defined in the `Domain` layer.\n\n```csharp\n//\
    \ src/Infrastructure/DependencyInjection.cs\nusing Microsoft.Extensions.DependencyInjection;\n\
    using MyDomain.Interfaces;\nusing MyInfrastructure.Repositories;\n\nnamespace\
    \ MyInfrastructure\n{\n    public static class DependencyInjection\n    {\n  \
    \      public static IServiceCollection AddInfrastructure(this IServiceCollection\
    \ services)\n        {\n            services.AddScoped<IMyRepository, MyRepository>();\n\
    \            // Add other services here\n            return services;\n      \
    \  }\n    }\n}\n```\n\nIn the `Presentation` layer, configure DI for services\
    \ from the `Application` layer and infrastructure services.\n\n```csharp\n// src/Presentation/DependencyInjection.cs\n\
    using Microsoft.Extensions.DependencyInjection;\nusing MyApplication.Interfaces;\n\
    using MyInfrastructure;\n\nnamespace MyPresentation\n{\n    public static class\
    \ DependencyInjection\n    {\n        public static IServiceCollection AddPresentation(this\
    \ IServiceCollection services)\n        {\n            services.AddInfrastructure();\n\
    \            services.AddScoped<IMyService, MyService>();\n            // Add\
    \ other services here\n            return services;\n        }\n    }\n}\n```\n\
    \nThis setup follows the principles of clean architecture, with clear separation\
    \ of concerns and dependency inversion. Each layer is independent of others, promoting\
    \ maintainability, testability, and scalability.\n\n## 关注点分离\n\nUnderstanding\
    \ project layouts and separation of concerns is crucial for building maintainable\
    \ and scalable applications. With .NET 8 and C# 12, adhering to clean architecture\
    \ principles ensures a clear separation of concerns, making it easier to manage\
    \ complexity and facilitate testing. Let's delve into the key aspects of project\
    \ layouts and separation of concerns in the context of clean architecture.\n\n\
    ### Application Layer\n\n**Responsibility:** Defines application-specific logic\
    \ and orchestrates interactions between domain entities and infrastructure services.\n\
    \n```csharp\n// Application Layer Example\npublic interface IOrderService\n{\n\
    \    Task PlaceOrderAsync(OrderDto orderDto);\n}\n\npublic class OrderService\
    \ : IOrderService\n{\n    private readonly IOrderRepository _orderRepository;\n\
    \n    public OrderService(IOrderRepository orderRepository)\n    {\n        _orderRepository\
    \ = orderRepository;\n    }\n\n    public async Task PlaceOrderAsync(OrderDto\
    \ orderDto)\n    {\n        // Business logic to place an order\n        await\
    \ _orderRepository.CreateAsync(orderDto.ToEntity());\n    }\n}\n```\n\n### Domain\
    \ Layer\n\n**Responsibility:** Encapsulates domain entities, value objects, and\
    \ business logic.\n\n```csharp\n// Domain Layer Example\npublic class Order\n\
    {\n    public int Id { get; set; }\n    public string CustomerName { get; set;\
    \ }\n    public decimal TotalAmount { get; set; }\n    // Other properties and\
    \ business logic\n}\n```\n\n### Infrastructure Layer\n\n**Responsibility:** Implements\
    \ interfaces defined in the domain layer, deals with data access, external services,\
    \ and infrastructure concerns.\n\n```csharp\n// Infrastructure Layer Example\n\
    public class OrderRepository : IOrderRepository\n{\n    private readonly AppDbContext\
    \ _dbContext;\n\n    public OrderRepository(AppDbContext dbContext)\n    {\n \
    \       _dbContext = dbContext;\n    }\n\n    public async Task CreateAsync(OrderEntity\
    \ orderEntity)\n    {\n        _dbContext.Orders.Add(orderEntity);\n        await\
    \ _dbContext.SaveChangesAsync();\n    }\n}\n```\n\n### Presentation Layer\n\n\
    **Responsibility:** Handles user interface, input/output, and presentation concerns.\n\
    \n```csharp\n// Presentation Layer Example (ASP.NET Core MVC)\npublic class OrderController\
    \ : Controller\n{\n    private readonly IOrderService _orderService;\n\n    public\
    \ OrderController(IOrderService orderService)\n    {\n        _orderService =\
    \ orderService;\n    }\n\n    [HttpPost]\n    public async Task<IActionResult>\
    \ PlaceOrder(OrderViewModel orderViewModel)\n    {\n        if (!ModelState.IsValid)\n\
    \        {\n            return BadRequest(ModelState);\n        }\n\n        await\
    \ _orderService.PlaceOrderAsync(orderViewModel.ToDto());\n        return Ok();\n\
    \    }\n}\n```\n"
