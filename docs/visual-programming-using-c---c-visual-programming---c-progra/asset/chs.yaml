  \ 65,400 个 `variant`（带数字） |\n\n## **算术运算符**\n\n- `+` 加法\n- `−` 减法\n- `*` 乘法\n- `/`\
  \ 除法\n\n使用上述算术运算符，我们可以在 c-sharp 语言中进行许多计算。\n\n```csharp\nint num1, num2, add;\n\
  num1 = Convert.ToInt32(Console.ReadLine());\nnum2 = Convert.ToInt32(Console.ReadLine());\n\
  add = num1 + num2;\nConsole.Write(add);\n```\n\n## **关系运算符**\n\n| 运算符 | 含义 |\n|\
  \ :--- | :--- |\n| `<` | 小于 |\n| `<=` | 小于等于 |\n| `>` | 大于 |\n| `>=` | 大于等于 |\n\
  | `==` | 等于 |\n| `!=` | 不等于 |\n\n16 bytes 直到 `Double` 范围内的任意数值\n\n```csharp\nint\
  \ a, b, c;\na = 2;\nb = 3;\nif(a < b)\nConsole.WriteLine(\"a is less than b\");\n\
  ```\n\n上述代码测试了 a 是否小于 b 并显示结果。\n\n## **字符串与字符**\n\n通常做法是使用 `string` 关键字来声明字符串变量。`String`\
  \ 类拥有克隆字符串、比较字符串、拼接字符串和复制字符串的方法。该类还提供了在字符串中查找子字符串、查找字符或子字符串索引、替换字符、分割字符串、修剪字符串以及为字符串添加填充的方法。`string`\
  \ 类还提供了将字符串字符转换为大写或小写的方法。\n\n```csharp\nstring fname, lname;\nfname = \"Rowan\"\
  ;\nlname = \"Atkinson\";\nfname.Length .ToCharArray() .Empty\n.Substring(index)\n\
  ```\n\n- 返回给定字符串中字符的数量\n- 它将给定字符串转换为字符数组\n- 它检查给定字符串是否为空\n- 从给定索引返回子字符串\n- `.Join(string,string)`\
  \ - 并两个字符串\n\n`+` 运算符也用于组合多个字符串。\n\n```csharp\nstring authorDetails = firstName\
  \ + \" \" + lastName + \" is \" + age + \" years\";\n```\n\n`char` 数据类型表示 .NET 中的一个字符。在\
  \ .NET 中，文本被存储为顺序的只读 `Char` 对象集合。C# 字符串的末尾没有空终止符；因此，C# 字符串可以包含任意数量的嵌入式空字符（`'\\0'`）。\n\
  \n```csharp\nchar ch=’A’;\nchar[] chars = { 'M', 'a', 'h', 'e', 's', 'h' };\n```\n\
