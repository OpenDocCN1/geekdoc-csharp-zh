  \ | -32,768 到 32,767 |\n| `long` (整数) | 4 字节 | +/- 10 位整数 |\n| `longlong` (长整数)\
  \ | 8 字节 | +/- 19 位整数 |\n| `single` (单精度浮点数[4 字节]) | -3.4 E38 到 -1.4E-45 |\n| `double`\
  \ (双精度浮点数 8 字节) | 负值 -1.7E308 到 -4.9E-324；正值 4.9E-324 到 1.7E308 |\n| `currency`\
