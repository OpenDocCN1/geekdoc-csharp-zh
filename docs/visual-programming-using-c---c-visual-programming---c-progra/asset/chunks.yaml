  trans: "\n通用语言运行时（`CLR`）通过使用垃圾回收器执行自动内存管理，回收不再使用的对象所占用的内存，以便该内存供其他对象使用。当一个对象不再有任何引用时，该对象就可以被销毁了。每个对象都有一个特殊的成员，称为析构函数，它由垃圾回收器在回收对象内存之前调用，用于对对象执行终止清理工作。析构函数的声明方式与无参数构造函数类似，区别是它的名称是类名并以波浪号（`~`）开头，且其头部没有访问修饰符。在垃圾回收器调用对象的析构函数后，该对象就可以进行垃圾回收了。\n\
    \n```csharp\n~ Product()\n{\n\n}\n```\n\n垃圾回收器的一个问题是，它不保证会在指定的时间执行任务。因此，垃圾回收器可以在对象变为可销毁后的任何时间调用析构函数，并可以在析构函数执行后的任何时间回收内存。\n\
    \n### 静态成员\n\n每个对象都拥有类中所有实例变量的副本。在某些情况下，某个特定变量的拷贝应该由类的所有对象共享。在这种情况下，使用静态变量。静态变量代表类范围的信息——类的所有对象共享同一份数据。静态变量的声明以关键字\
    \ `static` 开头。\n\n```csharp\npublic class Employee {\n    public static int count\
    \ = 0; // 内存中的对象数量\n\n    public static void showLine()\n    {\n        Console.WriteLine(―------------------------------------------);\n\
    \    }\n}\n```\n\n在上面的示例中，`count` 是静态变量，`showLine()` 是静态函数。\n\n### 数据抽象与封装\n\n\
    类通常会向客户端隐藏其实现细节。抽象成员没有详细的代码。这些代码将在程序的后部分编写。\n\n它用于向外部世界只显示对象的必要且核心的特征。这意味着显示必要的内容，并将不必要的内容封装在外部。可以通过使用\
    \ `private` 访问修饰符来实现隐藏。\n\n让我们来看这段代码！\n\n```csharp\nabstract class animal {\n\
    \    public abstract void eat(); \n    public void sound()\n    {\n        Console.WriteLine(\"\
    dog can sound\");\n    }\n}\n```\n\n在上面的类中，`animal` 是通用类，不同种类的动物吃不同的食物。`eat()`\
    \ 方法是抽象方法，稍后编写。方法重写可以通过在被重写的方法之前放置关键字 `new` 来完成。\n\n```csharp\nclass dog : animal\n\
    {\n    public override void eat() { \n        Console.WriteLine(\"dog can eat\"\
    ); \n    }\n}\n```\n\n在上面的 `dog` 类中重写了 `eat()` 方法。\n\n### 封装\n\n封装定义为“将一个或多个项目封装在一个物理或逻辑包中的过程”。在面向对象编程方法中，封装防止了对实现细节的访问。抽象和封装是面向对象编程的相关特征。\n\
    \n### 继承\n\n继承允许我们根据另一个类来定义类，这使得创建和维护应用程序变得更容易。这还提供了重用代码功能的机会并加快了实现速度。现有的类被称为基类，新类被称为派生类。在下面的类中，`Rectangle`\
    \ 是基类，`Tabletop` 是派生类。\n\n```csharp\nclass Rectangle {\n    //成员变量\n    protected\
    \ double length; protected double width;\n\n    public Rectangle(double l, double\
    \ w) { \n        length = l;\n        width = w;\n    }\n\n    public double GetArea()\
    \ {\n        return length * width;\n    }\n\n    public void Display() {\n  \
    \      Console.WriteLine(\"Length: {0}\", length);\n        Console.WriteLine(\"\
    Width: {0}\", width);\n        Console.WriteLine(\"Area: {0}\", GetArea()); \n\
    \    }\n}//end class Rectangle\n\nclass Tabletop : Rectangle {\n    private double\
    \ cost;\n\n    public Tabletop(double l, double w) : base(l, w) { }\n\n    public\
    \ double GetCost() {\n        double cost;\n        cost = GetArea() * 70;\n \
    \       return cost;\n    }\n\n    public void Display() {\n        base.Display();\n\
    \        Console.WriteLine(\"Cost: {0}\", GetCost()); \n    }\n}\n```\n\n### 多态\n\
    \n多态一词意味着有许多形式。在面向对象编程范式中，多态通常表示为“一个接口，多个函数”。\n\n多态可以是静态的或动态的。在`静态多态`中，对函数的响应在编译时确定。在`动态多态`中，它在运行时决定。\n\
    \n### 静态多态\n\n在编译期间将函数与对象绑定的机制称为早期绑定。它也称为静态绑定。C# 提供了两种实现静态多态的技术。它们是——\n\n- 函数重载\n\
    - 运算符重载\n\n```csharp\nclass Printdata {\n    void print(int i) {\n        Console.WriteLine(\"\
    Printing \", i );\n    }\n    void print(double f) {\n        Console.WriteLine(\"\
    Printing \" , f);\n    }\n    void print(string s) {\n        Console.WriteLine(\"\
    Printing \", s);\n    }\n\n    static void Main(string[] args) {\n        Printdata\
    \ p = new Printdata();\n        // 调用 print 打印整数\n        p.print(5);\n      \
    \  // 调用 print 打印浮点数\n        p.print(500.263);\n        // 调用 print 打印字符串\n \
    \       p.print(\"string\");\n    }\n}\n```\n\n在上面的示例中，我们为整数、浮点数和字符串编写了 `print()`\
    \ 函数。\n\n### 动态多态\n\nC# 允许你创建抽象类来提供接口的部分实现。当派生类继承它时完成实现。抽象类包含抽象方法，由派生类实现。派生类具有更多专门的功能。\n\
    \n关于抽象类的规则如下：\n\n- 我们无法创建抽象类的实例\n- 我们不能在抽象类之外声明抽象方法\n\n```csharp\nabstract class\
    \ Shape {\n    public abstract int area();\n}\n\nclass Rectangle: Shape {\n  \
    \  private int length;\n    private int width;\n\n    public Rectangle(int a =\
    \ 0, int b = 0) {\n        length = a;\n        width = b;\n    }\n\n    public\
    \ override int area () {\n        // area 方法在基类中作为抽象成员存在\n        // 在派生类中重写，称为动态多态。\n\
    \        Console.WriteLine(\"Rectangle class area :\");\n        return (width\
    \ * length);\n    }\n\n    static void Main(string[] args) {\n        Rectangle\
    \ r = new Rectangle(10, 7);\n        double a = r.area();\n        Console.WriteLine(\"\
    Area: {0}\",a);\n        Console.ReadKey();\n    }\n}\n```\n\n### 第四部分：使用 Windows\
    \ Forms 图用户界面\n\n- 简介 - Windows Forms\n- 控件属性与布局 - 标签、文本框和按钮 - 组框和面板 - 复选框和单选框\
    \ - NumericUpDown 控件 - 鼠标事件处理-键盘事件处理–各种控件 - 多文档界面 (MDI)  - 视觉继承 - 自定义控件\n\n在窗口顶部有一个菜单栏，包含文件、编辑、视图、项目、生成、调试、数据、工具、窗口和帮助菜单。菜单栏下方是工具栏按钮，每个按钮都有定义好的任务，如创建新项目或打开现有项目。工具栏下方有两个标签——这些以标签页视图显示信息并允许用户在之间切换。\n\
    \n#### 控件描述\n\n**Label** - Label 是 C# 中最常用的控件之一。我们可以使用 Label 控件在页面的固定位置显示文本。\n\
    \n```csharp\nlabel1.Text = \"这是我的第一个标签\";\n```\n\n此外可以使用 Image 属性显示图像，或者使用 ImageIndex\
    \ 和 ImageList 属性的组合。\n\n```csharp\nlabel1.Image = Image.FromFile(\"C:\\\\testimage.jpg\"\
    );\n```\n"
- fmt: "\n### **TextBox** - Enables the user to enter data via the keyboard. It can\
    \ also be used to display editable or uneditable text. For displaying a text in\
    \ a `TextBox` control , you can code like this.\n\n```cs\ntextBox1.Text = \"welcome\
    \ to our college\";\n```\n\n### **Button** - Windows Forms controls are reusable\
    \ components that encapsulate user interface functionality and are used in client\
    \ side Windows applications. A button is a control, which is an interactive component\
    \ that enables users to communicate with an application. The `Button` class inherits\
    \ directly from the `ButtonBase` class. A `Button` can be clicked by using the\
    \ mouse, `ENTER` key, or `SPACEBAR` if the button has focus.\n\n```cs\nbutton1.Text\
    \ = \"Click Here\";\n```\n\n### **CheckBox** - Specifies an option that can be\
    \ selected (checked) or unselected (not checked).\n\n![](Image00008.jpg) `checkBox1.Text\
    \ = \"Net-informations.com\";`\n\n```cs\ncheckBox1.ThreeState = true;\n```\n\n\
    ### **ComboBox** - Provides a drop-down list of items from which the user can\
    \ make a selection either by clicking an item in the list or by typing in a box.\n\
    \n```cs\ncomboBox1.Items.Add(\"Sunday\");\ncomboBox1.Items.Add(\"Monday\");\n\
    comboBox1.Items.Add(\"Tuesday\");\n```\n\n### **ListBox** - Provides a list of\
    \ items from which the user can make a selection by clicking one or more items.\n\
    \n```cs\nlistBox1.Items.Add(\"Sunday\");\nlistBox1.Items.Add(\"Monday\");\nlistBox1.Items.Add(\"\
    Tueday\");\n```\n\n### **Radio Button** - A radio button or option button enables\
    \ the user to select a single option from a group of choices when paired with\
    \ other `RadioButton` controls. When a user clicks on a radio button, it becomes\
    \ checked, and all other radio buttons with same group become unchecked.\n\n![](Image00009.jpg)\n\
    \n`radioButton1.Checked = true;`\n\n### **NumericUpDown** - A `NumericUpDown`\
    \ control allows users to provide a spin (up/down) interface to move through pre-defined\
    \ numbers using up and down arrows. For example `cud` is the `NumericUpDown` control.\n\
    \n```cs\ncud.Maximum = 100 \ncud.Minimum = 0 \ncud.Value = 10;\n```\n\n### **C#\
    \ Mouse Events**\nAn essential aspect of Windows programming is the use of the\
    \ mouse.\n\n- **Click**: This event occurs when the mouse button is released,\
    \ typically before the `MouseUp` event. The handler for this event receives an\
    \ argument of type `EventArgs`. Handle this event when you only need to determine\
    \ when a click occurs.\n- **MouseClick**: This event occurs when the user clicks\
    \ the control with the mouse. The handler for this event receives an argument\
    \ of type `MouseEventArgs`. Handle this event when you need to get information\
    \ about the mouse when a click occurs.\n- **DoubleClick**: This event occurs when\
    \ the control is double-clicked. The handler for this event receives an argument\
    \ of type `EventArgs`. Handle this event when you only need to determine when\
    \ a double-click occurs.\n- **MouseDoubleClick**: This event occurs when the user\
    \ double-clicks the control with the mouse. The handler for this event receives\
    \ an argument of type `MouseEventArgs`. Handle this event when you need to get\
    \ information about the mouse when a double-click occurs.\n- **MouseDown**: This\
    \ event occurs when the mouse pointer is over the control and the user presses\
    \ a mouse button. The handler for this event receives an argument of type `MouseEventArgs`.\n\
    - **MouseEnter**: This event occurs when the mouse pointer enters the border or\
    \ client area of the control, depending on the type of control. The handler for\
    \ this event receives an argument of type `EventArgs`.\n- **MouseHover**: This\
    \ event occurs when the mouse pointer stops and rests over the control. The handler\
    \ for this event receives an argument of type `EventArgs`.\n- **MouseLeave**:\
    \ This event occurs when the mouse pointer leaves the border or client area of\
    \ the control, depending on the type of the control. The handler for this event\
    \ receives an argument of type `EventArgs`.\n- **MouseMove**: This event occurs\
    \ when the mouse pointer moves while it is over a control. The handler for this\
    \ event receives an argument of type `MouseEventArgs`.\n- **MouseUp**: This event\
    \ occurs when the mouse pointer is over the control and the user releases a mouse\
    \ button. The handler for this event receives an argument of type `MouseEventArgs`.\n\
    - **MouseWheel**: This event occurs when the user rotates the mouse wheel while\
    \ the control has focus. The handler for this event receives an argument of type\
    \ `MouseEventArgs`. You can use the `Delta` property of `MouseEventArgs` to determine\
    \ how far the mouse has scrolled.\n\n### **MouseEventArgs Class**\nThis gives\
    \ us information about what has just happened with the mouse. There is a constructor,\
    \ but it does not seem useful.\n\n**Properties: (all \"get\" only)**\n- `X` =\
    \ x-coordinate of the mouse (integer)\n- `Y` = y-coordinate of the house (integer)\n\
    - `Location` = location of the mouse (`Point`, hence an x-y pair)\n- `Button`\
    \ = which mouse button was pressed (a member of the `MouseButtons` enumeration:\
    \ `Left`, `Right`, `Middle`, `None`, etc.)\n- `Clicks` = number of times the button\
    \ was pressed and released (integer)\n- `Delta` = the number of notches (\"detents\"\
    ) by which the mouse has been rotated (integer)\n\nWe will need a using statement\
    \ for `System.Windows.Forms`. In the `InitializeComponent` method, we need a line:\n\
    \n`this.MouseDown += new MouseEventHandler(this.Form_MouseDown);`\n\nThe event\
    \ handler might look like this:\n\n```cs\nprivate void Form_MouseDown(object sender,\
    \ MouseEventArgs e) {\n    switch (e.Button)\n    {\n        case MouseButtons.Left:\n\
    \            MessageBox.Show(\"Left Button Click\");\n            break;\n   \
    \     case MouseButtons.Right:\n            MessageBox.Show(\"Right Button Click\"\
    );\n            break;\n        default:\n            break;\n    }\n}\n```\n\n\
    ### **Keyboard Events**\nThere are three key events:\n\n- **KeyDown**: This event\
    \ is raised once when a user presses a key. The second argument of the event handler\
    \ is type `EventArgs`.\n- **KeyPress**: This event is raised when the key or keys\
    \ pressed result in a character. For instance, \"Shift\" plus \"a\" produces the\
    \ character \"A\". If the keys are held down, the `KeyPress` event may be repeated,\
    \ as in \"AAAAAAAAA\". The second argument of the event handler is type `KeyPressEventArgs`.\n\
    - **KeyUp**: This event is raised when a key is released. The second argument\
    \ of the event handler is type `KeyEventArgs`.\n\nThus the sequence of events\
    \ is: `KeyDown`, `KeyPress`, `KeyUp`. In the Designer file, we need a line to\
    \ attach the handler to the event:\n\n`this.KeyDown += new System.Windows.Forms.KeyEventHandler(this.KeyDemo_KeyDown);`\n\
    \n### **C# Menu Control**\nA Menu on a Windows Form is created with a `MainMenu`\
    \ object, which is a collection of `MenuItem` objects. `MainMenu` is the container\
    \ for the Menu structure of the form and menus are made of `MenuItem` objects\
    \ that represent individual parts of a menu.\n\n![](Image00010.jpg)\n\nWe can\
    \ add menus to Windows Forms at design time by adding the `MainMenu` component\
    \ and then appending menu items to it using the Menu Designer. After drag the\
    \ `MenuStrip` on your form you can directly create the menu items by type a value\
    \ into the \"Type Here\" box on the menubar part of your form. From the following\
    \ picture you can understand how to create each menu items on mainmenu object.\n\
    \n![](Image00011.jpg)\n\n### **Other Controls**\n\n- **Font Dialog Box**: Font\
    \ dialog box represents a common dialog box that displays a list of fonts that\
    \ are currently installed on the system.\n- **OpenFile Dialog Box**: The `OpenFileDialog`\
    \ component allows users to browse the folders of their computer or any computer\
    \ on the network and select one or more files to open. The dialog box returns\
    \ the path and name of the file the user selected in the dialog box.\n- **Print\
    \ Dialog Box**: A user can use the Print dialog box to select a printer, configure\
    \ it, and perform a print job. Print dialog boxes provide an easy way to implement\
    \ Print and Print Setup dialog boxes in a manner consistent with Windows standards.\n\
    \n### **Implementing an MDI Form**\n"
