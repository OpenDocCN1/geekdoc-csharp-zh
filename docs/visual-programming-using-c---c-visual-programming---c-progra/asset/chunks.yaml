  trans: "\n\n### **TextBox** - 允许用户通过键盘输入数据。它也可以用于显示可编辑或不可编辑的文本。要在 `TextBox` 控件中显示文本，你可以这样编写：\n\
    \n```cs\ntextBox1.Text = \"welcome to our college\";\n```\n\n### **Button** -\
    \ Windows Forms 控件是封装了用户界面功能的可用组件，用于客户端 Windows 应用程序。按钮是一种控件，它是一种交互式组件，允许用户与应用程序进行通信。`Button`\
    \ 类直接继承自 `ButtonBase` 类。用户可以使用鼠标、`ENTER` 键或在按钮获得焦点时的 `SPACEBAR`（空格键）点击按钮。\n\n\
    ```cs\nbutton1.Text = \"Click Here\";\n```\n\n### **CheckBox** - 指定一个可以选中（勾选）或取消选中（未勾选）的选项。\n\
    \n![](img/Image00008.jpg) `checkBox1.Text = \"Net-informations.com\";`\n\n```cs\n\
    checkBox1.ThreeState = true;\n```\n\n### **ComboBox** - 提供一个项目列表，用户可以通过点击列表中的项目或在框中输入内容来选择一个项目。\n\
    \n```cs\ncomboBox1.Items.Add(\"Sunday\");\ncomboBox1.Items.Add(\"Monday\");\n\
    comboBox1.Items.Add(\"Tuesday\");\n```\n\n### **ListBox** - 提供一个项目列表，用户可以通过点击一个或多个项目来做出选择。\n\
    \n```cs\nlistBox1.Items.Add(\"Sunday\");\nlistBox1.Items.Add(\"Monday\");\nlistBox1.Items.Add(\"\
    Tueday\");\n```\n\n### **Radio Button** - 单选按钮（或选项按钮）与其他 `RadioButton` 控件配对使用时，允许用户从一组选择中选择单个选项。当用户点击单选按钮时，它将变为选中状态，所有同组的其他单选按钮将变为未选中状态。\n\
    \n![](img/Image00009.jpg)\n\n`radioButton1.Checked = true;`\n\n### **NumericUpDown**\
    \ - `NumericUpDown` 控件允许用户提供一个旋钮（向上/向下）界面，通过向上和向下箭头遍历预定义的数字。例如 `cud` 就是一个 `NumericUpDown`\
    \ 控件。\n\n```cs\ncud.Maximum = 100 \ncud.Minimum = 0 \ncud.Value = 10;\n```\n\n\
    ### **C# Mouse Events**\nWindows 编程的一个重要方面方面是鼠标的使用。\n\n- **Click**: 此事件在释放鼠标按钮时发生，通常在\
    \ `MouseUp` 事件之前。该事件的处理程序接收一个类型为 `EventArgs` 的参数。当你只需要确定何时发生点击时，请处理此事件。\n- **MouseClick**:\
    \ 此事件在用户用鼠标点击控件时发生。该事件的处理程序接收一个类型为 `MouseEventArgs` 的参数。当你需要在点击发生时获取有关鼠标的信息时，请处理此事件。\n\
    - **DoubleClick**: 此事件在双击控件时发生。该事件的处理程序接收一个类型为 `EventArgs` 的参数。当你只需要确定何时发生双击时，请处理此事件。\n\
    - **MouseDoubleClick**: 此事件在用户用鼠标双击控件时发生。该事件的处理程序接收一个类型为 `MouseEventArgs` 的参数。当你需要在双击发生时获取有关鼠标的信息时，请处理此事件。\n\
    - **MouseDown**: 此事件在鼠标指针位于控件上且用户按下鼠标按钮时发生。该事件的处理程序接收一个类型为 `MouseEventArgs` 的参数。\n\
    - **MouseEnter**: 此事件在鼠标指针进入控件的边界或客户区域时发生，取决于控件的类型。该事件的处理程序接收一个类型为 `EventArgs`\
    \ 的参数。\n- **MouseHover**: 此事件在鼠标指针停止并停留在控件上时发生。该事件的处理程序接收一个类型为 `EventArgs` 的参数。\n\
    - **MouseLeave**: 此事件在鼠标指针离开控件的边界或客户区域时发生，取决于控件的类型。该事件的处理程序接收一个类型为 `EventArgs`\
    \ 的参数。\n- **MouseMove**: 此事件在鼠标指针在控件上移动时发生。该事件的处理程序接收一个类型为 `MouseEventArgs` 的参数。\n\
    - **MouseUp**: 此事件在鼠标指针位于控件上且用户释放鼠标按钮时发生。该事件的处理程序接收一个类型为 `MouseEventArgs` 的参数。\n\
    - **MouseWheel**: 此事件在控件拥有焦点时用户旋转鼠标轮时发生。该事件的处理程序接收一个类型为 `MouseEventArgs` 的参数。你可以使用\
    \ `MouseEventArgs` 的 `Delta` 属性来确定鼠标滚动了多少距离。\n\n### **MouseEventArgs Class**\n\
    这为我们提供了关于鼠标刚刚发生了什么的信息。它有一个构造函数，但似乎并不好用。\n\n**属性：（仅限 \"get\")**\n- `X` = 鼠标的 x\
    \ 坐标（整数）\n- `Y` = 鼠标的 y 坐标（整数）\n- `Location` = 鼠标的位置（`Point`，因此是一个 x-y 对）\n- `Button`\
    \ = 按下了哪个鼠标按钮（`MouseButtons` 枚举的成员：`Left`、`Right`、`Middle`、`None` 等）\n- `Clicks`\
    \ = 按钮按下并释放的次数（整数）\n- `Delta` = 鼠标旋转的刻度数（整数）\n\n我们需要为 `System.Windows.Forms` 使用\
    \ `using` 语句。在 `InitializeComponent` 方法中，我们需要一行：\n\n`this.MouseDown += new MouseEventHandler(this.Form_MouseDown);`\n\
    \n事件处理程序可能像这样：\n\n```cs\nprivate void Form_MouseDown(object sender, MouseEventArgs\
    \ e) {\n    switch (e.Button)\n    {\n        case MouseButtons.Left:\n      \
    \      MessageBox.Show(\"Left Click\");\n            break;\n        case MouseButtons.Right:\n\
    \            MessageBox.Show(\"Right Click\");\n            break;\n        default:\n\
    \            break;\n    }\n}\n```\n\n### **Keyboard Events**\n有三种键盘事件：\n\n- **KeyDown**:\
    \ 当用户按下按键时触发此事件一次。处理程序接收一个类型为 `EventArgs` 的参数。\n- **KeyPress**: 当按键或按键组合产生字符时触发此事件。例如，“Shift”加上“a”产生字符“A”。如果按住按键，`KeyPress`\
    \ 事件可能会重复，如“AAAAAAAAA”。处理程序接收一个类型为 `KeyPressEventArgs` 的参数。\n- **KeyUp**: 当释放按键时触发此事件。处理程序接收一个类型为\
    \ `KeyEventArgs` 的参数。\n\n因此事件的顺序为：`KeyDown`、`KeyPress`、KeyUp`。在设计文件中，我们需要一行将处理程序绑定到事件：\n\
    \n`this.KeyDown += new System.Windows.Forms.KeyEventHandler(this.KeyDemo_KeyDown);`\n\
    \n### **C# Menu Control**\nWindows Form 上的菜单通过 `MainMenu` 对象创建，它是 `MenuItem` 对象的集合。`MainMenu`\
    \ 是表单菜单结构的容器，菜单由代表菜单部分的 `MenuItem` 对象组成。\n\n![](img/Image00010.jpg)\n\n我们可以在设计时通过添加\
    \ `MainMenu` 组件并使用菜单设计器向其追加菜单项为 Windows Forms 添加菜单。将 `MenuStrip` 拖到表单后，你可以在表单菜单栏部分的框中输入值来直接创建菜单项。从下面的图中你可以了解如何在主菜单对象上创建每个菜单项。\n\
    \n![](img/Image00011.jpg)\n\n### **其他控件**\n\n- **字体对话框**: 字体对话框是一个常用的对话框，显示系统当前安装的字体列表。\n\
    - **打开文件对话框**: `OpenFileDialog` 组件允许用户浏览计算机或网络上任何计算机的文件夹，并选择一个或多个打开的文件。对话框返回用户在对话框中选择的文件路径和名称。\n\
    - **打印对话框**: 用户可以使用打印对话框选择打印机、配置打印并执行打印作业。打印对话框提供了一种以符合 Windows 标准实现打印和打印设置对话框的方法。\n\
    \n### **实现 MDI 表单**\n\n"
- fmt: "\nA Multiple Document Interface (MDI) programs can display multiple child\
    \ windows inside them. This is in contrast to single document interface (SDI)\
    \ applications, which can manipulate only one document at a time. Visual Studio\
    \ Environment is an example of Multiple Document Interface (MDI) and notepad is\
    \ an example of an SDI application. MDI applications often have a `Window` menu\
    \ item with submenus for switching between windows or documents.\n\n![](Image00012.gif)\
    \ Any windows can become an MDI parent, if you set the `IsMdiContainer` property\
    \ to `True`. `IsMdiContainer = true;`\n\nCreate a new C# project, then you will\
    \ get a default form `Form1`. Then add two mnore forms in the project (`Form2`,\
    \ `Form3`). Create a Menu on your form and call these two forms on menu click\
    \ event. Follow this small step by step walkthrough to make a small MDI application.\n\
    \n1. Goto `File->New->Blank Solution`\n2. Select `Visual C# Projects` in `Project\
    \ Types`\n3. Select `WindowsApplication` in `Templates`\n4. Type for eg. `myBestMDI`\
    \ in the `Name` textbox\n5. By Clicking the browse button select the location\
    \ & Click `OK`\n\n### Creating the Main MDI Form(frmMDIMain) to Act as a Container\n\
    \n1. In the `View->Solution Explorer` click `Form1` only once\n2. Locate the property\
    \ `FileName` and type `\"frmMDIMain.cs\"`\n3. In the `Solution Explorer` now doubleclick\
    \ `frmMDIMain`\n4. Locate the property `(Name)` and type `\"frmMDIMain\"`\n5.\
    \ Locate the property `Text` and type `\"This is the Parent\"`\n6. Locate the\
    \ property `IsMDIContainer` and set it to `true`\n7. Locate the property `WindowState`\
    \ and set it to `Maximized`\n\n### Creating the Child form (frmMChild) to Demonstrate\
    \ Multiple Instance\n\n1. Goto `Project Menu-Add Windows Forms` & type `frmMChild`\n\
    2. In the `Solution Explorer` now doubleclick `frmMChild`\n3. Locate the property\
    \ `Text` and type `\"This is the Multi Instance Child\"`\n4. Locate the property\
    \ `size` & set it to `568, 464`\n\n### MODULE– V\n\nDatabases and LINQ - Introduction\
    \ - relational Databases - LINQ to SQL – Querying a Database with LINQ - Dynamically\
    \ Binding Query Results - Retrieving Data from Multiple Tables with LINQ - Creating\
    \ a Master/Detail View Application Tools and Web Resources Case Study\n\n####\
    \ What is LINQ?\n\nLINQ (Language Integrated Query) is uniform query syntax in\
    \ `C#` and `VB.NET` to retrieve data from different sources and formats. It is\
    \ integrated in `C#` or `VB`, thereby eliminating the mismatch between programming\
    \ languages and databases, as well as providing a single querying interface for\
    \ different types of data sources.\n\nFor example, SQL is a Structured Query Language\
    \ used to save and retrieve data from a database. In the same way, LINQ is a structured\
    \ query syntax built in `C#` and `VB.NET` to retrieve data from different data\
    \ sources such as collections, `ADO.Net DataSet`, `XML Docs`, web service and\
    \ `MS SQL Server` and other databases.\n\nThe following example demonstrates a\
    \ simple LINQ query that gets all strings from an array which contains 'a'.\n\n\
    ![](Image00013.jpg) LINQ Usage\n\nLINQ queries return results as objects. It enables\
    \ you to uses object-oriented approach on the result set and not to worry about\
    \ transforming diffent formats of results into objects.\n\n![](Image00014.jpg)\n\
    \n```\n// Data source\nstring[] names = {\"Bill\", \"Steve\", \"James\", \"Mohan\"\
    \ };\n\n// LINQ Query\nvar myLinqQuery = from nm in names where nm.Contains('a')\n\
    select nm;\n\n// Query execution\nforeach(var nm in myLinqQuery) Console.Write(nm\
    \ + \" \");\n```\n\n#### Standard Query & Operators\n\nStandard Query Operators\
    \ in LINQ are actually extension methods for the `IEnumerable<T>` and `IQueryable<T>`\
    \ types. They are defined in the `System.Linq.Enumerable` and `System.Linq.Queryable`\
    \ classes. There are over 50 standard query operators available in LINQ that provide\
    \ different functionalities like filtering, sorting, grouping, aggregation, concatenation,\
    \ etc.\n\n![](Image00015.jpg) Standard Query Operators in Query Syntax\n\n####\
    \ Standard Query Operators in Method Syntax\n\n![](Image00016.jpg) Standard query\
    \ operators in query syntax is converted into extension methods at compile time,\
    \ so both are same.\n\n**OrderBy**\n\nOrderBy sorts the values of a collection\
    \ in ascending or descending order. It sorts the collection in ascending order\
    \ by default because ascending keyword is optional here. Use descending keyword\
    \ to sort collection in descending order.\n\n```csharp\nIList<Student> studentList\
    \ = new List<Student>() {\n    new Student() { StudentID = 1, StudentName = \"\
    John\", Age = 18 },\n    new Student() { StudentID = 2, StudentName = \"Steve\"\
    , Age = 15 },\n    new Student() { StudentID = 3, StudentName = \"Bill\", Age\
    \ = 25 },\n    new Student() { StudentID = 4, StudentName = \"Ram\" , Age = 20\
    \ },\n    new Student() { StudentID = 5, StudentName = \"Ron\" , Age = 19 } \n\
    };\n\nvar orderByResult = from s in studentList orderby s.StudentName select s;\n\
    \nConsole.WriteLine(\"Ascending Order:\");\nforeach (var std in orderByResult)\n\
    \    Console.WriteLine(std.StudentName);\n```\n**Output**\nAscending Order:\n\
    Bill\nJohn\nRam\nSteve\nRon\n\n**GroupBy**\n\nThe GroupBy operator returns a group\
    \ of elements from the given collection based on some key value.\n\n```csharp\n\
    var groupedResult = from s in studentList\ngroup s by s.Age;\n\n//iterate each\
    \ group\nforeach (var ageGroup in groupedResult)\n{\n    Console.WriteLine(\"\
    Age Group: {0}\", ageGroup.Key); //Each group has a key\n    foreach(Student s\
    \ in ageGroup) // Each group has inner collection\n    {\n        Console.WriteLine(\"\
    Student Name: {0}\", s.StudentName);\n    }\n}\n```\n**Output**\nAge Group: 18\n\
    Student Name: John\nStudent Name: Bill\nAge Group: 15\nStudent Name: Steve\n...As\
    \ you can see in the above example, you can iterate the group using a `foreach`\
    \ loop, where each group contains a key and inner collection. The following figure\
    \ shows the result in debug view. Notice that each group will have a property\
    \ name on which group is performed. In the above example, we used `Age` to form\
    \ a group so each group will have `Age` property name instead of `Key` as a property\
    \ name.\n\n```csharp\n// Student collection\nIList<Student> studentList = new\
    \ List<Student>() {\n    new Student() { StudentID = 1, StudentName = \"John\"\
    , Age = 18 },\n    new Student() { StudentID = 2, StudentName = \"Steve\", Age\
    \ = 15 },\n    new Student() { StudentID = 3, StudentName = \"Bill\", Age = 25\
    \ },\n    new Student() { StudentID = 4, StudentName = \"Ram\" , Age = 20 },\n\
    \    new Student() { StudentID = 5, StudentName = \"Ron\" , Age = 19 }\n};\n\n\
    IList<Standard> standardList = new List<Standard>() {\n    new Standard(){ StandardID\
    \ = 1, StandardName=\"Standard 1\"},\n    new Standard(){ StandardID = 2, StandardName=\"\
    Standard 2\"},\n    new Standard(){ StandardID = 3, StandardName=\"Standard 3\"\
    }\n};\n\nvar innerJoinResult = studentList.Join(// outer sequence\n    standardList,\
    \ // inner sequence\n    student => student.StandardID, // outerKeySelector\n\
    \    standard => standard.StandardID, // innerKeySelector\n    (student, standard)\
    \ => new // result selector\n    {\n        StudentName = student.StudentName,\
    \ StandardName = standard.StandardName\n    });\n\nforeach (var obj in innerJoinResult)\n\
    {\n    Console.WriteLine(\"{0} - {1}\", obj.StudentName, obj.StandardName);\n\
    }\n```\n**Output**\nJohn - Standard 1\nSteve - Standard 1\nBill - Standard 2\n\
    Ram - Standard 2\n"
  raw: 'A Multiple Document Interface (MDI) programs can display multiple child windows
    inside them. This is in contrast to single document interface (SDI) applications,
    which can manipulate only one document at a time. Visual Studio Environment is
    an example of Multiple Document Interface (MDI) and notepad is an example of an
    SDI application. MDI applications often have a Window menu item with submenus
    for switching between windows or documents.


    ![](Image00012.gif) Any windows can become an MDI parent, if you set the IsMdiContainer
    property to True. **IsMdiContainer = true;**


    Create a new C# project, then you will get a default form Form1 . Then add two
    mnore forms in the project (Form2 , Form 3) . Create a Menu on your form and call
    these two forms on menu click event. Follow this small step by step walkthrough
    to make a small MDI application.


    1\. Goto File->New->Blank Solution


    2\. Select Visual C# Projects in Project Types


    3\. Select WindowsApplication in Templates


    4\. Type for eg. myBestMDI in the Name textbox


    5\. By Clicking the browse button select the location & Click OK


    **Creating the Main MDI Form(frmMDIMain) to Act as a Container**


    1\. In the View->Solution Explorer click Form1 only once


    2\. Locate the property FileName and type "frmMDIMain.cs"


    3\. In the Solution Explorer now doubleclick frmMDIMain


    4\. Locate the property (Name) and type "frmMDIMain"


    5\. Locate the property Text and type "This is the Parent"


    6\. Locate the property IsMDIContainer and set it to true


    7\. Locate the property WindowState and set it to Maximized


    **Creating the Child form (frmMChild) to Demonstrate Multiple Instance**


    1\. Goto Project Menu-Add Windows Forms & type frmMChild


    2\. In the Solution Explorer now doubleclick frmMChild


    3\. Locate the property Text and type "This is the Multi Instance Child"


    4\. Locate the property size & set it to 568, 464


    **MODULE– V**


    Databases and LINQ - Introduction - relational Databases - LINQ to SQL – Querying
    a Database with LINQ - Dynamically Binding Query Results - Retrieving Data from
    Multiple Tables with LINQ - Creating a Master/Detail View Application Tools and
    Web Resources Case Study


    **What is LINQ?**


    LINQ (Language Integrated Query) is uniform query syntax in C# and VB.NET to retrieve
    data from different sources and formats. It is integrated in C# or VB, thereby
    eliminating the mismatch between programming languages and databases, as well
    as providing a single querying interface for different types of data sources.


    LINQ (Language Integrated Query) is uniform query syntax in C# and VB.NET to retrieve
    data from different sources and formats. It is integrated in C# or VB, thereby
    eliminating the mismatch between programming languages and databases, as well
    as providing a single querying interface for different types of data sources.


    For example, SQL is a Structured Query Language used to save and retrieve data
    from a database. In the same way, LINQ is a structured query syntax built in C#
    and VB.NET to retrieve data from different types of data sources such as collections,
    ADO.Net DataSet, XML Docs, web service and MS SQL Server and other databases.


    The following example demonstrates a simple LINQ query that gets all strings from
    an array which contains ''a''.


    ![](Image00013.jpg)  LINQ Usage


    LINQ queries return results as objects. It enables you to uses object-oriented
    approach on the result set and not to worry about transforming diffent formats
    of results into objects.


    ![](Image00014.jpg)


    // Data source


    string[] names = {"Bill", "Steve", "James", "Mohan" };


    // LINQ Query


    var myLinqQuery = from nm in names where nm.Contains(''a'')


    select nm;


    // Query execution


    foreach(var nm in myLinqQuery) Console.Write(nm + " ");


    ## **Standard Query & Operators**


    Standard Query Operators in LINQ are actually extension methods for the IEnumerable<T>
    and IQueryable<T> types. They are defined in the System.Linq.Enumerable and


    System.Linq.Queryable classes. There are over 50 standard query operators available
    in LINQ that provide different functionalities like filtering, sorting, grouping,
    aggregation, concatenation, etc.


    ![](Image00015.jpg)  Standard Query Operators in Query Syntax


    ## **Standard Query Operators in Method Syntax**


    ![](Image00016.jpg) Standard query operators in query syntax is converted into
    extension methods at compile time, so both are same.


    **OrderBy**


    OrderBy sorts the values of a collection in ascending or descending order. It
    sorts the collection in ascending order by default because ascending keyword is
    optional here. Use descending keyword to sort collection in descending order.


    **IList<Student> studentList = new List<Student>() {


    new Student() { StudentID = 1, StudentName = "John", Age = 18 } , new Student()
    { StudentID = 2, StudentName = "Steve", Age = 15 } , new Student() { StudentID
    = 3, StudentName = "Bill", Age = 25 } ,**


    **new Student() { StudentID = 4, StudentName = "Ram" , Age = 20 } , new Student()
    { StudentID = 5, StudentName = "Ron" , Age = 19 } };**


    **var orderByResult = from s in studentList orderby s.StudentName select s;**


    **Console.WriteLine("Ascending Order:");


    foreach (var std in orderByResult)**


    **Console.WriteLine(std.StudentName);** **Output**


    Ascending Order:


    Bill


    John


    Ram


    Ron


    Steve


    ## **GroupBy**


    The GroupBy operator returns a group of elements from the given collection based
    on some key value.


    var groupedResult = from s in studentList


    group s by s.Age;


    //iterate each group


    foreach (var ageGroup in groupedResult)


    {


    Console.WriteLine("Age Group: {0}", ageGroup.Key); //Each group has a key


    foreach(Student s in ageGroup) // Each group has inner collection Console.WriteLine("Student
    Name: {0}", s.StudentName); }


    Output


    AgeGroup: 18


    StudentName: John


    StudentName: Bill


    AgeGroup: 21


    StudentName: Steve


    StudentName: Abram


    AgeGroup: 20


    StudentName: Ram


    As you can see in the above example, you can iterate the group using a ''foreach''
    loop, where each group contains a key and inner collection. The following figure
    shows the result in debug view. Notice that each group will have a property name
    on which group is performed. In the above example, we have used Age to form a
    group so each group will have "Age" property name instead of "Key" as a property
    name.


    // Student collection


    IList<Student> studentList = new List<Student>() {


    new Student() { StudentID = 1, StudentName = "John", Age = 18, StandardID = 1
    } , new Student() { StudentID = 2, StudentName = "Steve", Age = 21, StandardID
    = 1 } , new Student() { StudentID = 3, StudentName = "Bill", Age = 18, StandardID
    = 2 } , new Student() { StudentID = 4, StudentName = "Ram" , Age = 20, StandardID
    = 2 } , new Student() { StudentID = 5, StudentName = "Ron" , Age = 21 }


    };


    IList<Standard> standardList = new List<Standard>() {


    new Standard(){ StandardID = 1, StandardName="Standard 1"}, new Standard(){ StandardID
    = 2, StandardName="Standard 2"}, new Standard(){ StandardID = 3, StandardName="Standard
    3"}


    };


    var innerJoinResult = studentList.Join(// outer sequence


    standardList, // inner sequence


    student => student.StandardID, // outerKeySelector


    standard => standard.StandardID, // innerKeySelector


    (student, standard) => new // result selector


    {


    StudentName = student.StudentName, StandardName = standard.StandardName });


    foreach (var obj in innerJoinResult)


    {


    Console.WriteLine("{0} - {1}", obj.StudentName, obj.StandardName);


    }


    }


    Output


    John - Standard 1


    Steve - Standard 1


    Bill - Standard 2


    Ram - Standard 2'
