  trans: "\n\n# 使用属性以及 get 和 set 访问器的软件工程\n\n使用本章早些描述的属性似乎违反了私有数据的概念。虽然提供带有 `get`\
    \ 和 `set` 访问器的属性看起来与将其相应的实例变量设为公共相同，但事实并非如此。公共实例变量可以被程序中的任何属性或方法读取或写入。如果实例变量是私有的，客户端代码只能通过类的非私有属性或方法间接访问该实例变量。这允许类控制数据设置或返回的方式。例如，`get`\
    \ 和 `set` 访问器可以在私有实例变量中存储的数据格式与客户端偏好的数据格式之间进行转换。\n\n## 控制结构\n\n通常情况下，应用程序中的语句按照其编写顺序一个接一个执行——这一过程被称为顺序执行。各种\
    \ C# 语句允许你指定下一个要执行的语句不一定是顺序上的下一个语句——这被称为控制转移。\n\n![](img/Image00003.jpg)\n\n它包含两个表示要执行的操作的动作状态。每个动作状态都包含一个动作表达式——例如，“向总分中添加分数”或“向计数器加\
    \ 1”——它指定了要执行的操作。其他操作可能包括计算或输入输出操作。活动图中的箭头表示转换，指示了动作发生的顺序。\n\n### if 单选择语句\n\n\
    应用程序使用选择语句在备选的方案之间进行选择。例如，假设考试的及格分是 60。\n\n```csharp\nif ( grade >= 60 )\nConsole.WriteLine(\"\
    Passed\");\n```\n\n上述 C# 语句确定条件 `grade >= 60` 为真为假。如果条件为真，则显示“Passed”，并执行顺序上的下一个\
    \ C# 语句。如果条件为假，则忽略输出语句，并执行顺序上的下一个 C# 语句。\n\n![](img/Image00004.jpg)\n\n### if…else\
    \ 双选择语句\n\n`if` 单选择语句仅在条件为真时执行执行指定的动作；否则，将跳过该动作。`if…else` 双选择语句允许你在条件为真时指定一个动作，并在条件为假时指定另一个不同的动作。\n\
    \n```csharp\nif ( grade >= 60 )\nConsole.WriteLine(\"Passed\");\nelse\nConsole.WriteLine(\"\
    Failed\");\n```\n\n例如，如果 `grade >= 60` 为真，C# 语句将显示“Passed”，但如果 `grade < 60` 为真，则显示“Failed”。在任何情况下，显示完成后，都会执行顺序上的下一个语句。`else`\
    \ 部分体也进行了缩进。无论你选择何种缩进规范，都应该始终应用于整个应用程序。不遵守统一间距规范的应用程序很难阅读。\n\n![](img/Image00005.jpg)\
    \ 条件运算符 (?:)\n\nC# 提供了条件运算符 `?:`，它可以替代 `if…else` 语句。这是 C# 唯一的三元运算符——它接受三个操作数。操作数与\
    \ `?:` 符号共同组成一个条件表达式。第一个操作数（`?` 的左侧）是一个布尔表达式（即评估结果为 `bool` 类型值——真或假的表达式），第二个操作数（在\
    \ `?` 和 `:` 之间）是布尔表达式为真时条件表达式的值，第三个操作数（`:` 的右侧）是布尔表达式为假时条件表达式的值。\n\n```csharp\n\
    Console.WriteLine( grade >= 60 ? \"Passed\" : \"Failed\");\n```\n\n例如，该语句显示 `WriteLine`\
    \ 的条件表达式参数的值。前一个语句中的条件表达式如果布尔表达式 `grade >= 60` 为真，则于字符串 \"Passed\"，如果布尔表达式为假，则于字符串\
    \ \"Failed\"。\n\n## 嵌套 if…else 语句\n\n![](img/Image00006.gif)\n\n应用程序可以通过将 `if…else`\
    \ 语句放在其他 `if…else` 语句内部创建创建嵌套 `if…else` 语句来测试多种情况。例如，以下嵌套 `if…else` 语句对于大于等于 90\
    \ 的考试成绩显示 A，对于 80 到 89 之间的成绩显示 B，对于 70 到 79 之间的成绩显示 C，对于 60 到 69 之间的成绩显示 D，对于所有其他成绩显示\
    \ F：\n\n```csharp\nif ( grade >= 90 )\nConsole.WriteLine(\"A\");\nelse\nif ( grade\
    \ >= 80 )\nConsole.WriteLine(\"B\");\nelse\nif ( grade >= 70 )\nConsole.WriteLine(\"\
    C\");\nelse\nif ( grade >= 60 )\nConsole.WriteLine(\"D\");\nelse\nConsole.WriteLine(\"\
    F\");\n```\n\n**模块– III**\n\n类与对象：深入探讨 - 引言 - 控制成员的访问 - 使用 `this` 引用引用当前对象的成员\
    \ - 索引器 - 默认和无参数构造函数–组合 - 垃圾收集与析构函数- 静态类成员 - 数据抽象与封装 – 对象初始化器– 委托 面对象编程：继承 - 多态、接口和运算符重载-异常处理\n\
    \n## 控制成员的访问\n\n我们可以使用以下访问修符来指定类型或成员的可访问性：\n\n`public`：类型或成员可以被同一程序集中的任何其他代码或引用它的另一个程序集访问。\n\
    \n`private`：类型或成员只能被同一类或结构体的代码访问。\n\n`protected`：类型或成员可以被同类或派生类的代码访问。\n\n`internal`：类型或成员可以被同一程序集中的代码访问，但不能从另一个程序集访问。\n\
    \n类成员（包括嵌套类）可以使用六种访问类型进行声明。结构体成员不能声明为 `protected`，因为结构体不支持继承。\n\n## Reference\n\
    \n`this` 关键字指向类的实例，并作为扩展方法的第一个参数的修饰。\n\n```csharp\npublic class Employee\n{\n\
    \    private string alias;\n    private string name;\n\n    public Employee(string\
    \ name, string alias)\n    {\n        // 使用 this 来限定类的成员\n        // 而不是构造函数参数。\n\
    \        this.name = name;\n        this.alias = alias;\n    }\n}\n```\n\n为了限定被同名隐藏的成员，例如：\n\
    \n## 默认和无参数构造函数\n\n对于声明了至少一个构造函数的类，编译器不会创建默认构造函数。在这种情况下，如果你希望能够无参数调用构造函数，我们必须声明一个无参数构造函数，默认构造函数，无参数构造函数通过空括号调用。\n\
    \n```csharp\nclass Product\n{\n    public int pid;\n    public string pname;\n\
    \n    // 空或无参数构造函数\n    public Product()\n    {\n    }\n\n    public Product(int\
    \ pid=10,string pname=\"Hammam\")\n    {\n        this.pid = pid;\n        this.pname\
    \ = pname;\n    }\n\n    public void show()\n    {\n        Console.WriteLine(pid);\n\
    \        Console.WriteLine(pname);\n    }\n\n    static void Main(string[] args)\n\
    \    {\n        Product p = new Product();\n        p.show();\n        p.pid =\
    \ 34;\n        Product p2 = new Product(23);\n        p2.show();\n        Console.ReadKey();\n\
    \    }\n}\n```\n\n在 `p2` 实例中，`pid` 取 23，`pname` 取构造函数的默认值。\n\n"
- fmt: "\nThe Common Language Runtime (`CLR`) performs automatic memory management\
    \ by using a garbage collector to reclaim the memory occupied by objects that\
    \ are no longer in use, so the memory can be used for other objects. When there\
    \ are no more references to an object, the object becomes eligible for destruction.\
    \ Every object has a special member, called a destructor, that is invoked by the\
    \ garbage collector to perform termination housekeeping on an object before the\
    \ garbage collector reclaims theobject’s memory. A destructor is declared like\
    \ a parameterless constructor, except that its name is the class name, preceded\
    \ by a tilde (`~`), and it has no access modifier in its header.After the garbage\
    \ collector calls the object’s destructor, the object becomes eligible for garbage\
    \ collection.\n\n```csharp\n~ Product()\n{\n\n}\n```\n\nA problem with the garbage\
    \ collector is that it doesn’t guarantee that it will perform its tasks at a specified\
    \ time. Therefore, the garbage collector may call the destructor any time after\
    \ the object becomes eligible for destruction, and may reclaim the memory any\
    \ time after the destructor executes.\n\n### Static Members\n\nEvery object has\
    \ its own copy of all the instance variables of the class. In certain cases, only\
    \ one copy of a particular variable should be shared by all objects of a class.\
    \ A static variable is used in such cases. A static variable represents class-wide\
    \ information—all objects of the class share the same piece of data. The declaration\
    \ of a static variable begins with the keyword `static`.\n\n```csharp\npublic\
    \ class Employee {\n    public static int count = 0; // number of objects in memory\n\
    \n    public static void showLine()\n    {\n        Console.WriteLine(―------------------------------------------―);\n\
    \    }\n}\n```\n\nIn the above example `count` is the static variable `showLine()`\
    \ is the static function.\n\n### Data Abstraction and Encapsulation\n\nClasses\
    \ normally hide the details of their implementation from their clients. The abstract\
    \ member has no detailed coding. This will be code later in program.\n\nIt is\
    \ used to display only necessary and essential features of an object to outside\
    \ the world.Means displaying what is necessary and encapsulate the unnecessary\
    \ things to outside the world.Hiding can be achieved by using `private` access\
    \ modifiers.\n\nLets have a look of this code!\n\n```csharp\nabstract class animal\
    \ {\n    public abstract void eat(); \n    public void sound()\n    {\n      \
    \  Console.WriteLine(\"dog can sound\");\n    }\n}\n```\n\nIn the above class\
    \ `animal` is the generic class in which different kinds of animal takes different\
    \ food. The `eat()` method is the abstract method that will code later. The method\
    \ overriding could be done by putting the keyword `new` before that overridden\
    \ method.\n\n```csharp\nclass dog : animal\n{\n    public override void eat()\
    \ { \n        Console.WriteLine(\"dog can eat\"); \n    }\n}\n```\n\nThe above\
    \ `dog` class we override the `eat()` method.\n\n### Encapsulation\n\nEncapsulation\
    \ is defined 'as the process of enclosing one or more items within a physical\
    \ or logical package'. Encapsulation, in object oriented programming methodology,\
    \ prevents access to implementation details. Abstraction and encapsulation are\
    \ related features in object oriented programming.\n\n### Inheritance\n\nInheritance\
    \ allows us to define a class in terms of another class, which makes it easier\
    \ to create and maintain an application. This also provides an opportunity to\
    \ reuse the code functionality and speeds up implementation time. This existing\
    \ class is called the base class, and the new class is referred to as the derived\
    \ class. In the following class `Rectangle` is the Base class and `Tabletop` is\
    \ the Derived class.\n\n```csharp\nclass Rectangle {\n    //member variables\n\
    \    protected double length; protected double width;\n\n    public Rectangle(double\
    \ l, double w) { \n        length = l;\n        width = w;\n    }\n\n    public\
    \ double GetArea() {\n        return length * width;\n    }\n\n    public void\
    \ Display() {\n        Console.WriteLine(\"Length: {0}\", length);\n        Console.WriteLine(\"\
    Width: {0}\", width);\n        Console.WriteLine(\"Area: {0}\", GetArea()); \n\
    \    }\n}//end class Rectangle\n\nclass Tabletop : Rectangle {\n    private double\
    \ cost;\n\n    public Tabletop(double l, double w) : base(l, w) { }\n\n    public\
    \ double GetCost() {\n        double cost;\n        cost = GetArea() * 70;\n \
    \       return cost;\n    }\n\n    public void Display() {\n        base.Display();\n\
    \        Console.WriteLine(\"Cost: {0}\", GetCost()); \n    }\n}\n```\n\n### Polymorphism\n\
    \nThe word polymorphism means having many forms. In object-oriented programming\
    \ paradigm, polymorphism is often expressed as 'one interface, multiple functions'.\n\
    \nPolymorphism can be static or dynamic. In `static polymorphism`, the response\
    \ to a function is determined at the compile time. In `dynamic polymorphism`,\
    \ it is decided at run-time.\n\n### Static Polymorphism\n\nThe mechanism of linking\
    \ a function with an object during compile time is called early binding. It is\
    \ also called static binding. C# provides two techniques to implement static polymorphism.\
    \ They are −\n\n- Function overloading\n- Operator overloading\n\n```csharp\n\
    class Printdata {\n    void print(int i) {\n        Console.WriteLine(\"Printing\
    \ \", i );\n    }\n    void print(double f) {\n        Console.WriteLine(\"Printing\
    \ \" , f);\n    }\n    void print(string s) {\n        Console.WriteLine(\"Printing\
    \ \", s);\n    }\n\n    static void Main(string[] args) {\n        Printdata p\
    \ = new Printdata();\n        // Call print to print integer\n        p.print(5);\n\
    \        // Call print to print float\n        p.print(500.263);\n        // Call\
    \ print to print string\n        p.print(\"Hello C++\");\n        Console.ReadKey();\n\
    \    }\n}\n```\n\nIn the above example we written the `print()` function for integer,\
    \ float and string data.\n\n### Dynamic Polymorphism\n\nC# allows you to create\
    \ abstract classes that are used to provide partial class implementation of an\
    \ interface. Implementation is completed when a derived class inherits from it.\
    \ Abstract classes contain abstract methods, which are implemented by the derived\
    \ class. The derived classes have more specialized functionality.\n\nHere are\
    \ the rules about abstract classes:\n\n- We cannot create an instance of an abstract\
    \ class\n- We cannot declare an abstract method outside an abstract class\n\n\
    ```csharp\nabstract class Shape {\n    public abstract int area();\n}\n\nclass\
    \ Rectangle: Shape {\n    private int length;\n    private int width;\n\n    public\
    \ Rectangle(int a = 0, int b = 0) { \n        length = a;\n        width = b;\n\
    \    }\n\n    public override int area () {\n        // The method area() present\
    \ in base class as a abstract member. \n        // That will be redefined in derived\
    \ class called dynamic polymorphism.\n        Console.WriteLine(\"Rectangle class\
    \ area :\");\n        return (width * length);\n    }\n\n    static void Main(string[]\
    \ args) {\n        Rectangle r = new Rectangle(10, 7);\n        double a = r.area();\n\
    \        Console.WriteLine(\"Area: {0}\",a);\n        Console.ReadKey();\n   \
    \ }\n}\n```\n\n### MODULE IV: Graphical User Interfaces with Windows Forms\n\n\
    - Introduction - Windows Forms\n- Control Properties and Layout - Labels, TextBoxes\
    \ and Buttons - GroupBoxes and Panels - CheckBoxes and RadioButtons - NumericUpDown\
    \ Control - Mouse-Event Handling-Keyboard-Event Handling– various controls - Multiple\
    \ Document Interface (MDI) Windows - Visual Inheritance - User-Defined Controls\n\
    \nNear the top of the window, there’s a menu bar containing the menus File, Edit,\
    \ View, Project, Build, Debug, Data, Tools, Window, and Help. Below the menu bar\
    \ is a tool bar of buttons, each with a defined task, such as creating a new project\
    \ or opening an existing project. There are two tabs below the tool bar—these\
    \ present information in a tabbed view and allow users to switch between them.\n\
    \n#### Control Description\n\n**Label** - Labels are one of the most frequently\
    \ used C# control. We can use the Label control to display text in a set location\
    \ on the page.\n\n```csharp\nlabel1.Text = \"This is my first Label\";\n\nIn addition\
    \ to display an image using the Image property, or a combination of the ImageIndex\
    \ and ImageList properties.\n\nlabel1.Image = Image.FromFile(\"C:\\\\testimage.jpg\"\
    );\n```\n"
