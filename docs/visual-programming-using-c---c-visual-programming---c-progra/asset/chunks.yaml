    ![](Image00000.jpg) **VISUAL PROGRAMMING USING C#


    MODULE– I**


    Introduction - C, C++, Objective-C, Java and C# - Extensible Markup Language (XML)
    - Introduction to Microsoft .NET - The .NET Framework and the Common Language
    Runtime Introduction to Object Technology - Introduction to C# Applications -
    Creating a Simple Application in Visual C# Express - Formatting Text with Console.Write
    and Console. WriteLine - Another C# Application: Adding Integers


    – Arithmetic - Decision Making: Equality and Relational Operators– Strings and
    Characters.


    **Introduction to C & C++**


    C is a high-level structured oriented programming language, used in general purpose
    programming, developed by Dennis Ritchie at AT&T Bell Labs, the USA between 1969
    and 1973.


    In 1988, the American National Standards Institute (ANSI) had formalized the C
    language. C was invented to write UNIX operating system. C is a successor of ''Basic
    Combined Programming Language'' (BCPL) called B language. Linux OS, PHP, and MySQL
    are written in C. C has been written in assembly language. Simula (1967)


    The very first object-oriented programming language C++ (1983) The first object-oriented
    programming language in the C family of languages Java (1995) Sun''s object-oriented
    programming language C# (2001) programming language


    **Java**


    Java is a general purpose, high-level programming Microsystems. The Java programming
    language was developed by a small team of engineers, known as the Green Team,
    who initiated the language in 1991\. Later, in 2009, Oracle Corporation acquired
    Sun Microsystems and took ownership of two key Sun software assets: Java and Solaris.
    In 2006 Sun started to make Java available under the GNU General Public License
    (GPL). Oracle continues this project called Open-JDK Sun Microsystems was acquired
    by the Oracle Corporation in 2010\. Oracle has now the steermanship for Java.


    Microsoft''s object-oriented


    language developed by Sun


    What is XML?


     XML stands for eXtensible Markup Language  XML is a markup language much like
    HTML  XML was designed to store and transport data  XML was designed to be self-descriptive


    XML Simplifies Things


     It simplifies data sharing  It simplifies data transport  It simplifies platform
    changes  It simplifies data availability


    Many computer systems contain data in incompatible formats. Exchanging data between
    incompatible systems (or upgraded systems) is a time-consuming task for web developers.
    Large amounts of data must be converted, and incompatible data is often lost.


    XML stores data in plain text format. This provides a software- and hardwareindependent
    way of storing, transporting, and sharing data. XML also makes it easier to expand
    or upgrade to new operating systems, new applications, or new browsers, without
    losing data. With XML, data can be available to all kinds of "reading machines"
    like people, computers, voice machines, news feeds, etc.


    **Introduction to C#**


    C# was created at Microsoft late in the 1990s and was part of Microsoft’s overall
    .NET strategy. It was first released in its alphaversion in the middle of 2000\.
    C#’s chief architect was Anders Hejlsberg.


    **.NET Framework**


    It defines two very important entities.


    The first is the Common Language Runtime. This is the system that manages the
    execution of your program. Along with other benefits, the Common Language Runtime
    is the part of the .NET Framework that enables programs to be portable, supports
    mixed-language programming, and provides for security.


    The second entity is the .NET class library. This library gives your program access
    to the runtime environment. For example, if you want to perform I/O, such as displaying
    something on the screen, you will use the .NET class library to do it.


    **The Common Language Runtime (CLR)** manages the execution of .NET code. It is
    the job of the CLR to translate the intermediate code into executable code when
    a program is run. Microsoft Intermediate Language is turned into executable code
    using a JIT compiler. JITstands for ―just in time.‖ The process works like this:
    When a .NET program is executed, the CLR activates the JIT compiler. The JIT compiler
    converts (Microsoft Intermediate Language) MSIL into native code on a demand basis,
    as each part of your program is needed.


    ## **Functions of .NET CLR**


     Convert code into CLI


     Exception handling


     Type safety


     Memory management (using the Garbage Collector)  Security


     Improved performance


     Language independency  Platform independency  Architecture independency


    ## **Components of .NET CLR**


    The key components of CLR includes the following:


     Class Loader - Used to load all classes at run time.


     MSIL to Native code - The Just In Time (JTI) compiler will convert MSIL code
    into native code.


     Code Manager - It manages the code at run time.


     Garbage Collector - It manages the memory. Collect all unused objects and deallocate
    them to reduce memory.


     Thread Support - It supports multithreading of our application.


     Exception Handler - It handles exceptions at run time.


    ## **Benefits of .NET CLR**


    The runtime provides the following benefits:


     Performance improvements.


     The ability to easily use components developed in other languages.


     Extensible types provided by a class library.


     Language features such as inheritance, interfaces, and overloading for object-oriented


    programming.


     Support for explicit free threading that allows creation of multithreaded, scalable
    applications.  Support for structured exception handling.


     Support for custom attributes.


     Garbage collection.


     Use of delegates instead of function pointers for increased type safety and
    security.


    ![](Image00001.jpg) **Object-Oriented Programming**


    At the center of C# is object-oriented programming (OOP). The object-oriented
    methodology is inseparable from C#, and all C# programs are, at least to some
    extent, object-oriented. Becauseof its importance to C#, it is useful to understand
    OOP’s basic principles before you write even a simple C# program.


    Encapsulation is a programming mechanism that binds together code and the data
    it manipulates, and keeps both safe from outside interference and misuse. In an
    objectoriented language, code and data can be bound together in such a way that
    a selfcontained black box is created.


    Polymorphism (from G reek, meaning ―many forms‖) is the quality that allows one
    interface to access a general class of actions. A simple example of polymorphism
    is found in the steering wheel of an automobile. The steering wheel (the interface)
    is the same, no matter what type of actual steering mechanism is used.


    Inheritance is the process by which one object can acquire the properties of another
    object. This is important because it supports the concept of hierarchical classification.
    If you think about it, most knowledge is made manageable by hierarchical (that
    is, top-down) classifications.


    **Visual Studio IDE(Integrated Development Environment)**


    Visual Studio is Microsoft’s integrated programming environment. It lets us edit,
    compile, run, and debug a C# program, all without leaving its well thought-out
    environment. Visual Studio offers convenience and helps manage your programs.
    It is most effective for larger projects,


    **New C# Project**


    Create a new, empty C# project by selecting File | New Project. Next, select Empty
    Project.


    Visual C# - Project


    Console Application


    Windows Forms Application


    Console Application


    This application of C# program shows the output in command window. **Example**


    ## class MyClass { static void Main() { Console.Write(―Welcome‖); } }


    Where Console.Write() method is used to display output on screen Console.ReadLine()
    method is used to read data at run time **Data Types**


    ## The following table shows the supported data types, including


    storage sizes and ranges. **byte (1), Boolean (true / false), integer (+/**'
