    \ 类图 软件工程\n\n## **方法**\n\n在 C# 中，我们通过创建一个类来开始。类描述了任务。例如，一个类可能包含存款的方法、取款的方法以及查询余额的方法。到为止，我们使用了汽车的示例来引入类、对象和方法。\n\
    \n## **类**\n\n现在我们使用带有 `string` 类型的构造器来引入方法。\n\n## **UML 类图**\n\nUML 类图模型类，其构造器有一个类型为\
    \ string 的名称参数。与操作一样，UML 在类图中类的第三个区域中模型构造器。类图基本上表示了系统的面向对象视图，其本质上是静态的。\n\n**Bank\
    \ Account**\n+ Owner : String +Balance : Decimal + deposit()\nwithdrawal()\n\n\
    **依赖**\n\n依赖意味着两个或多个类之间的关系，其中一个类的变化可能会强制另一个类发生变化。然而，它始终会创建一个更弱的关系。依赖表示一个类依赖于另一个类。\n\
    \n**Customer Bank**\n\n"
- fmt: "\n# Software Engineering with Properties and set and get Accessors\n\nUsing\
    \ properties as described earlier in this chapter would seem to violate the notion\
    \ of private data. Although providing a property with `get` and `set` accessors\
    \ may appear to be the same as making its corresponding instance variable public,\
    \ this is not the case. A public instance variable can be read or written by any\
    \ property or method in the program. If an instance variable is private, the client\
    \ code can access the instance variable only indirectly through the class’s non-private\
    \ properties or methods. This allows the class to control the manner in which\
    \ the data is set or returned. For example, `get` and `set` accessors can translate\
    \ between the format of the data stored in the private instance variable and the\
    \ format of the data preferred by the client.\n\n## Control Structures\n\nNormally,\
    \ statements in an application are executed one after the other in the order in\
    \ which they’re written—this process is called sequential execution. Various C#\
    \ statements enable you to specify that the next statement to execute is not necessarily\
    \ the next one in sequence—this is called transfer of control.\n\n![](Image00003.jpg)\n\
    \nIt contains two action states that represent actions to perform. Each action\
    \ state contains an action expression—for example, \"add grade to total\" or \"\
    add 1 to counter\"—that specifies an action to perform. Other actions might include\
    \ calculations or input/output operations. The arrows in the activity diagram\
    \ represent transitions, which indicate the order in which the actions occur.\n\
    \n### if Single-Selection Statement\n\nApplications use selection statements to\
    \ choose among alternative courses of action. For example, suppose that the passing\
    \ grade on an exam is 60.\n\n```csharp\nif ( grade >= 60 )\nConsole.WriteLine(\"\
    Passed\");\n```\n\nThe above C# statement determines whether the condition `grade\
    \ >= 60` is true or false. If the condition is true, \"Passed\" is displayed,\
    \ and the next C# statement in order is performed. If the condition is false,\
    \ the output statement is ignored, and the next C# statement in order is performed.\n\
    \n![](Image00004.jpg)\n\n### if…else Double-Selection Statement\n\nThe `if` single-selection\
    \ statement performs an indicated action only when the condition is true; otherwise,\
    \ the action is skipped. The `if…else` double-selection statement allows you to\
    \ specify an action to perform when the condition is true and a different action\
    \ when the condition is false.\n\n```csharp\nif ( grade >= 60 )\nConsole.WriteLine(\"\
    Passed\");\nelse\nConsole.WriteLine(\"Failed\");\n```\n\nFor example, the C# statement\
    \ displays \"Passed\" if `grade >= 60` is true, but displays \"Failed\" if `grade\
    \ < 60` is true. In either case, after displaying occurs, the next statement in\
    \ sequence is performed. The body of the `else` part is also indented. Whatever\
    \ indentation convention you choose should be applied consistently throughout\
    \ your applications. It’s difficult to read applications that do not obey uniform\
    \ spacing conventions.\n\n![](Image00005.jpg) Conditional Operator (?:)\n\nC#\
    \ provides the conditional operator `?:`, which can be used in place of an `if…else`\
    \ statement. This is C#’s only ternary operator—it takes three operands. Together,\
    \ the operands and the `?:` symbols form a conditional expression. The first operand\
    \ (to the left of the `?`) is a boolean expression (i.e., an expression that evaluates\
    \ to a `bool`-type value—true or false), the second operand (between the `?` and\
    \ `:`) is the value of the conditional expression if the boolean expression is\
    \ true and the third operand (to the right of the `:`) is the value of the conditional\
    \ expression if the boolean expression is false.\n\n```csharp\nConsole.WriteLine(\
    \ grade >= 60 ? \"Passed\" : \"Failed\");\n```\n\nFor example, the statement displays\
    \ the value of `WriteLine`’s conditional-expression argument. The conditional\
    \ expression in the preceding statement evaluates to the string \"Passed\" if\
    \ the boolean expression `grade >= 60` is true and evaluates to the string \"\
    Failed\" if the boolean expression is false.\n\n## Nested if…else Statements\n\
    \n![](Image00006.gif)\n\nAn application can test multiple cases by placing `if…else`\
    \ statements inside other `if…else` statements to create nested `if…else` statements.\
    \ For example, the following nested `if…else` statement displays A for exam grades\
    \ greater than or equal to 90, B for grades in the range 80 to 89, C for grades\
    \ in the range 70 to 79, D for grades in the range 60 to 69 and F for all other\
    \ grades:\n\n```csharp\nif ( grade >= 90 )\nConsole.WriteLine(\"A\");\nelse\n\
    if ( grade >= 80 )\nConsole.WriteLine(\"B\");\nelse\nif ( grade >= 70 )\nConsole.WriteLine(\"\
    C\");\nelse\nif ( grade >= 60 )\nConsole.WriteLine(\"D\");\nelse\nConsole.WriteLine(\"\
    F\");\n```\n\n**MODULE– III**\n\nClasses and Objects: A Deeper Look – Introduction\
    \ - Controlling Access to Members - Referring to the Current Object’s Members\
    \ with the `this` Reference – Indexers - Default and Parameterless Constructors–\
    \ Composition - Garbage Collection and Destructors- static Class Members - Data\
    \ Abstraction and Encapsulation – Object Initializers– Delegates Object-Oriented\
    \ Programming: Inheritance - Polymorphism, Interfaces and Operator Overloading-Exception\
    \ Handling\n\n## Controlling Access to Members\n\nWe can use the following access\
    \ modifiers to specify the accessibility of a type or member:\n\n`public`: The\
    \ type or member can be accessed by any other code in the same assembly or another\
    \ assembly that references it.\n\n`private`: The type or member can be accessed\
    \ only by code in the same class or struct.\n\n`protected`: The type or member\
    \ can be accessed by code in the same class or in a class that is derived from\
    \ that class.\n\n`internal`: The type or member can be accessed by any code in\
    \ the same assembly, but not from another assembly.\n\nClass members (including\
    \ nested classes and structs) can be declared with any of the six types of access.\
    \ Struct members cannot be declared as `protected` because structs do not support\
    \ inheritance.\n\n## This Reference\n\nThe `this` keyword refers to the current\
    \ instance of the class and is also used as a modifier of the first parameter\
    \ of an extension method.\n\n```csharp\npublic class Employee\n{\n    private\
    \ string alias;\n    private string name;\n\n    public Employee(string name,\
    \ string alias)\n    {\n        // Use this to qualify the members of the class\n\
    \        // instead of the constructor parameters.\n        this.name = name;\n\
    \        this.alias = alias;\n    }\n}\n```\n\nTo qualify members hidden by similar\
    \ names, for example:\n\n## Default and Parameterless Constructors\n\nThe compiler\
    \ will not create a default constructor for a class that explicitly declares at\
    \ least one constructor. In this case, if you want to be able to invoke the constructor\
    \ with no arguments, we must declare a parameterless constructor, a default constructor,\
    \ a parameterless constructor is invoked with empty parentheses.\n\n```csharp\n\
    class Product\n{\n    public int pid;\n    public string pname;\n\n    // Empty\
    \ or Parameterless constructor\n    public Product()\n    {\n    }\n\n    public\
    \ Product(int pid=10,string pname=\"Hammam\")\n    {\n        this.pid = pid;\n\
    \        this.pname = pname;\n    }\n\n    public void show()\n    {\n       \
    \ Console.WriteLine(pid);\n        Console.WriteLine(pname);\n    }\n\n    static\
    \ void Main(string[] args)\n    {\n        Product p = new Product();\n      \
    \  p.show();\n        p.pid = 34;\n        Product p2 = new Product(23);\n   \
    \     p2.show();\n        Console.ReadKey();\n    }\n}\n```\n\nIn `p2` instance\
    \ `pid` takes 23 and `pname` takes default value from the constructor.\n\n###\
    \ **Garbage Collection and Destructors**\n"
  raw: '### **Software Engineering with Properties and set and get Accessors**


    Using properties as described earlier in this chapter would seem to violate the
    notion of private data. Although providing a property with get and set accessors
    may appear to be the same as making its corresponding instance variable public,
    this is not the case. A public instance variable can be read or written by any
    property or method in the program. If an instance variable is private, the client
    code can access the instance variable only indirectlythrough the class’s non-private
    properties or methods. This allows the class to control the manner in which the
    data is set or returned. For example, get and set accessors can translate between
    the format of the data stored in the private instance variable and the format
    of the data preferred by the client.


    ## **Control Structures**


    Normally, statements in an application are executed one after the other in the
    order inwhich they’re written—this process is called sequential execution. Various
    C# statements enable you to specify that the next statement to execute is not
    necessarily the next one in sequence—this is called transfer of control.


    ![](Image00003.jpg)


    It contains two action states that represent actions to perform. Each action state
    contains an action expression—for example, ―add grade to total‖ or ―add 1 to counter‖—that
    specifies an action to perform. Other actions might include calculations or input/output
    operations. The arrows in the activity diagram represent transitions, which indicate
    the order in which the actions occur.


    ### **if Single-Selection Statement**


    Applications use selection statements to choose among alternative courses of action.
    For example, suppose that the passing grade on an exam is 60.


    **if** ( grade >= **60** )


    Console.WriteLine( **"Passed"** );


    The above C# statement determines whether the condition grade >= 60 is true or
    false. If the condition is true, "Passed" is displayed, and the next C# statement
    in order is performed. If the condition is false, the output statement is ignored,
    and the next C# statement in order is performed.


    ![](Image00004.jpg)


    ### **if…else Double-Selection Statement**


    The if single-selection statement performs an indicated action only when the conditionis
    true; otherwise, the action is skipped. The if…else double-selection statement
    allows you to specify an action to perform when the condition is true and a different
    action when the condition is false.


    **if** ( grade >= **60** )


    Console.WriteLine( **"Passed"** );


    **else**


    Console.WriteLine( **"Failed"** );


    For example, the C# statement displays "Passed" if grade >= 60 is true, but displays
    "Failed" if grade < 60 is true. In either case, after displaying occurs, the next
    statement in sequence is performed. The body of the else part is also indented.
    Whatever indentation convention you choose should be applied consistently throughout
    your applications. It’s difficult to read applications that do not obey uniform
    spacing conventions.


    ![](Image00005.jpg) **Conditional Operator (?:)**


    C# provides the conditional operator (?:), which can be used in place of an if…else
    statement. This is C#’s only ternary operator—it takes three operands. Together,
    the operands and the ?: symbols form a conditional expression. The first operand
    (to the left of the ?) is a boolean expression (i.e., an expression that evaluates
    to a bool-type value—true or false), the second operand (between the ? and :)
    is the value of the conditional expression if the boolean expression is true and
    the third operand (to the right of the :) is the value of the conditional expression
    if the boolean expression is false.


    Console.WriteLine( grade >= **60** ? **"Passed"** : **"Failed"** );


    For example, the statementdisplays the value of WriteLine’s conditional- expression
    argument. The conditional expression in the preceding statement evaluates to the
    string "Passed" if the boolean expression grade >= 60 is true and evaluates to
    the string "Failed" if the boolean expression is false.


    ## **Nested if…else Statements**


    ![](Image00006.gif)


    An application can test multiple cases by placing if…else statements inside other
    if…else statements to create nested if…else statements. For example, the following
    nested if…else statement displays A for exam grades greater than or equal to 90,
    B for grades in the range 80 to 89, C for grades in the range 70 to 79, D for
    grades in the range 60 to 69 and F for all other grades:


    **if** ( grade >= **90** )


    Console.WriteLine( **"A"** );


    **else


    if** ( grade >= **80** )


    Console.WriteLine( **"B"** );


    **else


    if** ( grade >= **70** )


    Console.WriteLine( **"C"** ); **else**


    **if** ( grade >= **60** )


    Console.WriteLine( **"D"** ); **else**


    Console.WriteLine( **"F"** );


    **MODULE– III**


    Classes and Objects: A Deeper Look – Introduction - Controlling Access to Members
    - Referringto the Current Object’s Members with the this Reference – Indexers
    - Default and Parameterless Constructors– Composition - Garbage Collection and
    Destructors- static Class Members - Data Abstraction and Encapsulation – Object
    Initializers– Delegates Object-Oriented Programming: Inheritance - Polymorphism,
    Interfaces and Operator Overloading-Exception Handling


    ## **Controlling Access to Members**


    We can use the following access modifiers to specify the accessibility of a type
    or member


    **public :** The type or member can be accessed by any other code in the same
    assembly or another assembly that references it.


    **private:** The type or member can be accessed only by code in the same class
    or struct. **protected:** The type or member can be accessed only by code in the
    same class, or in a class that is derived from that class.


    **Internal:** The type or member can be accessed by any code in the same assembly,
    but not from another assembly.


    Class members (including nested classes and structs) can be declared with any
    of the six types of access. Struct members cannot be declared as protected because
    structs do not support inheritance.


    ## **This** Reference


    # The **this** keyword refers to the current instance of the class and is also
    used as a


    modifier of the first parameter of an extension method.


    **public class Employee


    {**


    **private string alias; private string name;**


    **public Employee(string name, string alias) {


    // Use this to qualify the members of the class // instead of the constructor
    parameters. this.name = name;


    this.alias = alias;


    }


    }**


     To qualify members hidden by similar names, for example:


    ## **Default and Parameterless Constructors**


    The compiler will not create a default constructor for a class that explicitly
    declares at least one constructor. In this case, if you want to be able to invoke
    the constructor with no arguments, we must declare a parameterless constructor,
    a default constructor, a parameterless constructor is invoked with empty parentheses.


    class Product {


    public int pid;


    public string pname; Empty or Parameterless constructor


    public Product() {


    } public Product(int pid=10,string pname="Hammam") {


    this.pid = pid;


    this.pname = pname; }


    public void show()


    {


    Console.WriteLine(pid); Console.WriteLine(pname);


    }


    static void Main(string[] args)


    {


    Product p = new Product(); p.show();


    p.pid = 34;


    Product p2 = new Product(23); p2.show();


    Console.ReadKey();


    }


    }


    In p2 instance pid takes 23 and pname takes default value from the constructor.


