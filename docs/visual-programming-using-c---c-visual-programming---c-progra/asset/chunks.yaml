    ## **Inheritance**


    Inheritance allows us to define a class in terms of another class, which makes
    it easier to create and maintain an application. This also provides an opportunity
    to reuse the code functionality and speeds up implementation time. This existing
    class is called the base class, and the new class is referred to as the derived
    class. In the following class Rectangle is the Base class and Tabletop is the
    Derived class


    class Rectangle {


    //member variables


    protected double length; protected double width;


    public Rectangle(double l, double w) { length = l;


    width = w;


