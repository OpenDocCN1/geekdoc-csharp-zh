  trans: "\n\n多文档界面（MDI）程序可以在其内部显示多个子窗口。这与单文档界面（SDI）应用程序形成对比，后者一次只能操作一个文档。Visual Studio\
    \ 环境是多文档界面（MDI）的示例，而记事本是 SDI 应用的示例。MDI 应用通常包含一个 `Window`（窗口）菜单项，并带有用于切换窗口或文档的子菜单。\n\
    \n![](img/Image00012.gif) 只要你将 `IsMdiContainer` 属性设置为 `True`，任何窗口都可以成为 MDI 父容器。`IsMdiContainer\
    \ = true;`\n\n创建一个新的 C# 项目，然后你将获得一个默认表单 `Form1`。接下在项目中添加另外两个表单（`Form2`、`Form3`）。在你的表单上创建一个菜单，并在菜单点击事件中调用这两个表单。按照这个简单的分步指南创建一个小型\
    \ MDI 应用程序。\n\n1. 转到 `File->New->Blank Solution`\n2. 在 `Project Types` 中选择 `Visual\
    \ C# Projects`\n3. 在 `Templates` 中选择 `WindowsApplication`\n4. 在 `Name` 框中输入例如\
    \ `myBestMDI`\n5. 点击浏览按钮选择位置并点击 `OK`\n\n### 创建主 MDI 表单(frmMDIMain) 作为容器\n\n1.\
    \ 在 `View->Solution Explorer` 中仅点击一次 `Form1`\n2. 找到属性 `FileName` 并输入 `\"frmMDIMain.cs\"\
    `\n3. 在 `Solution Explorer` 中现在双击 `frmMDIMain`\n4. 找到属性 `(Name)` 并输入 `\"frmMDIMain\"\
    `\n5. 找到属性 `Text` 并输入 `\"This is the Parent\"`\n6. 找到属性 `IsMDIContainer` 并将其设置为\
    \ `true`\n7. 找到属性 `WindowState` 并将其设置为 `Maximized`\n\n### 创建子表单 (frmMChild) 以演示多个实例\n\
    \n1. 转到 `Project Menu-Add Windows Forms` 并输入 `frmMChild`\n2. 在 `Solution Explorer`\
    \ 中现在双击 `frmMChild`\n3. 找到属性 `Text` 并输入 `\"This is the Multi Instance Child\"\
    `\n4. 找到属性 `size` 并将其设置为 `568, 464`\n\n### 模块– V\n\n数据库与 LINQ - 简介 - 关系型数据库 -\
    \ LINQ to SQL - 使用 LINQ 查询数据库 - 动态绑定查询结果 - 使用 LINQ 从多个表中检索数据 - 创建主从视图应用程序 工具与网络资源\
    \ 案例研究\n\n#### 什么是 LINQ？\n\nLINQ（语言集成查询）是 `C#` 和 `VB.NET` 中的统一查询语法，用于从不同的源和格式检索数据。它集成在\
    \ `C#` 或 `VB` 中，消除了编程语言与数据库之间的不匹配，并为不同类型的数据源提供了单一的查询接口。\n\n例如，SQL 是一种用于从数据库保存和检索数据的结构化查询语言。同样，LINQ\
    \ 是构建在 `C#` 和 `VB.NET` 中的结构化查询语法，用于从不同的数据源（集合、`ADO.Net DataSet`、`XML Docs`、Web\
    \ 服务和 `MS SQL Server` 以及其他数据库）\n\n下面的示例演示了一个简单的 LINQ 查询，从包含 'a' 的数组中获取所有字符串。\n\
    \n![](img/Image00013.jpg) LINQ Usage\n\nLINQ 查询以对象形式返回结果。它允许你对结果集使用面向对象的方法，而无需担心将不同格式的结果转换成对象。\n\
    \n![](img/Image00014.jpg)\n\n```\n// Data source\nstring[] names = {\"Bill\",\
    \ \"Steve\", \"James\", \"Mohan\" };\n\n// LINQ Query\nvar myLinqQuery = from\
    \ nm in names where nm.Contains('a')\nselect nm;\n\n// Query execution\nforeach(var\
    \ nm in myLinqQuery) Console.Write(nm + \" \");\n```\n\n#### 标准查询与运算符\n\nLINQ\
    \ 中的标准查询运算符实际上是针对 `IEnumerable<T>` 和 `IQueryable<T>` 类型的扩展方法。它们定义在 `System.Linq.Enumerable`\
    \ 和 `System.Linq.Queryable` 类中。LINQ 提供了 50 多个标准查询运算符，提供过滤、排序、分组、聚合、连接等不同功能。\n\n\
    ![](img/Image00015.jpg) 查询语法中的标准查询运算符\n\n#### 方法语法中的标准查询运算符\n\n![](img/Image00016.jpg)\
    \ 查询语法中的标准查询运算符在编译时会被转换为扩展方法，因此两者是相同的。\n\n**OrderBy**\n\nOrderBy 按升序或降序对集合的值。它默认按升序排序集合，因为这里的\
    \ ascending 关键字是可选的。使用 descending 关键字按降序排序集合。\n\n```csharp\nIList<Student> studentList\
    \ = new List<Student>() {\n    new Student() { StudentID = 1, StudentName = \"\
    John\", Age = 18 },\n    new Student() { StudentID = 2, StudentName = \"Steve\"\
    , Age = 15 },\n    new Student() { StudentID = 3, StudentName = \"Bill\", Age\
    \ = 25 },\n    new Student() { StudentID = 4, StudentName = \"Ram\" , Age = 20\
    \ },\n    new Student() { StudentID = 5, StudentName = \"Ron\" , Age = 19 } \n\
    };\n\nvar orderByResult = from s in studentList orderby s.StudentName select s;\n\
    \nConsole.WriteLine(\"Ascending Order:\");\nforeach (var std in orderByResult)\n\
    \    Console.WriteLine(std.StudentName);\n```\n**Output**\nAscending Order:\n\
    Bill\nJohn\nRam\nSteve\n\n**GroupBy**\n\nGroupBy 运算符根据某些键值从给定集合返回元素组。\n\n```csharp\n\
    var groupedResult = from s in studentList\ngroup s by s.Age;\n\n//iterate each\
    \ group\nforeach (var ageGroup in groupedResult)\n{\n    Console.WriteLine(\"\
    Age Group: {0}\", ageGroup.Key); //每个组有一个键\n    foreach(Student s in ageGroup)\
    \ //每个组有一个内部集合\n    {\n        Console.WriteLine(\"Student Name: {0}\", s.StudentName);\n\
    \    }\n}\n```\n**Output**\nAge Group: 18\nStudent Name: John\nAge Group: 15\n\
    Student Name: Steve\n...正如上面的示例所示，可以使用 `foreach` 循环遍历组，每个组包含一个键和一个内部集合。下图显示了调试视图中的结果。注意每个组具有执行分组的属性名。在上面的示例中，我们使用\
    \ `Age` 来分组，因此每个组将具有 `Age` 属性名而不是 `Key` 属性名。\n\n```csharp\n// Student collection\n\
    IList<Student> studentList = new List<Student>() {\n    new Student() { StudentID\
    \ = 1, StudentName = \"John\", Age = 18 },\n    new Student() { StudentID = 2,\
    \ StudentName = \"Steve\", Age = 15 },\n    new Student() { StudentID = 3, StudentName\
    \ = \"Bill\", Age = 25 },\n    new Student() { StudentID = 4, StudentName = \"\
    Ram\" , Age = 20 },\n    new Student() { StudentID = 5, StudentName = \"Ron\"\
    \ , Age = 19 }\n};\n\nIList<Standard> standardList = new List<Standard>() {\n\
    \    new Standard(){ StandardID = 1, StandardName=\"Standard 1\"},\n    new Standard(){\
    \ StandardID = 2, StandardName=\"Standard 2\"},\n    new Standard(){ StandardID\
    \ = 3, StandardName=\"Standard 3\"}\n};\n\nvar innerJoinResult = studentList.Join(//\
    \ 外部序列\n    standardList, // 内部序列\n    student => student.StandardID, // 外部键选择器\n\
    \    standard => standard.StandardID, // 内部键选择器\n    (student, standard) => new\
    \ // 结果选择器\n    {\n        StudentName = student.StudentName, StandardName = standard.StandardName\n\
    \    });\n\nforeach (var obj in innerJoinResult)\n{\n    Console.WriteLine(\"\
    {0} - {1}\", obj.StudentName, obj.StandardName);\n}\n```\n**Output**\nJohn - Standard\
    \ 1\nSteve - Standard 1\nBill - Standard 2\nRam - Standard 2\n\n"
