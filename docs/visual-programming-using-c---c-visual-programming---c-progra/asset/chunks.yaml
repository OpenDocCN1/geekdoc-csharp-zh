  trans: "\n\n![](img/Image00017.jpg)\n\n访问电子版请访问 www.cs.aagasc.edu.in\n\n![](img/Image00000.jpg)\
    \ 使用 C# 进行视觉化编程\n\n# 模块 – I\n\n 导言 - C, C++, Objective-C, Java 和 C#\n- 可扩展标记语言\
    \ (XML)\n- Microsoft .NET 导言\n- .NET 框架与通用语言运行时 (CLR)\n- 对象技术简介\n- C# 应用程序简介\n\
    -在 Visual C# Express 中创建简单的应用程序\n- 使用 `Console.Write` 和 `Console.WriteLine` 格式化文本\n\
    - 另一个 C# 应用程序：整数相加 – 算术\n- 决策制定：等号运算符和关系运算符\n- 字符串与字符。\n\n## C 与 C++ 导言\n\nC 是一种高级结构化面向对象的编程语言，用于通用编程，由\
    \ Dennis Ritchie 在 1969 年至 1973 年间在美国 AT&T 贝尔实验室开发。\n\n1988 年，美国国家标准学会 (ANSI)\
    \ 将 C 语言正式化。C 的发明是为了编写 UNIX 操作系统。C 是“基本组合编程语言”(BCPL) B 语言的继者。Linux 操作系统、PHP 和\
    \ MySQL 都是用 C 编写的。C 曾用汇编语言编写。Simula (1967)\n\n第一种面向对象的编程语言 C++ (1983) C 语言族中第一种面向对象的编程语言\
    \ Java (1995) Sun 的面向对象编程语言 C# (2001) 编程语言\n\n## Java\n\nJava 是一种通用的、高级编程语言。Java\
    \ 编程语言由一个名为“绿色团队”(Green Team) 的工程师小组开发，他们在 1991 年启动了该语言。随后在 2009 年，甲骨文公司 (Oracle\
    \ Corporation) 收购了 Sun Microsystems，并获得了两个关键 Sun 软件资产的所有权：Java 和 Solaris。2006\
    \ 年，Sun 开始根据 GNU 通用公共许可证 (GPL) 下提供 Java。甲骨文继续了这个名为 Open-JDK 的项目。Sun Microsystems\
    \ 于 2010 年被甲骨文公司收购。现在 Oracle 拥有 Java 的管理权。\n\n由 Sun 开发的微软面向对象语言\n\n## 什么是 XML？\n\
    \n- XML 代表可扩展标记语言 (Extensible Markup Language)\n- XML 是一种类似于 HTML 的标记语言\n- XML\
    \ 设计用于存储和传输数据\n- XML 设计为是自描述的\n\n### XML 简化了事情\n\n- 它简化了数据共享\n- 它简化了数据传输\n- 它简化了平台变更\n\
    - 它简化了数据可用性\n\n许多计算机系统包含不兼容的数据。在不兼容系统（或升级后的系统）之间交换数据对于 Web 开发人员来说是一项耗时的任务。大量数据必须转换，且不兼容的数据经常丢失。\n\
    \nXML 以纯文本格式存储数据。这提供了一种独立于软件和硬件的数据存储、传输和共享方式。XML 还更容易扩展或升级到新的操作系统、新应用程序或新浏览器，而不会丢失数据。\n\
    \n## C# 导言\n\nC# 是由 Sun 开发的微软面向对象语言。C# 在 1990 年代后期由 Anders Helsberg 创建，他是 C# 的首席架构师。\n\
    \n## .NET 框架\n\n.NET Framework 定义了两个重要的实体。第一个是通用语言运行时 (CLR)，它是执行程序的系统。第二个是 .NET\
    \ 类库，它提供了面向对象编程的便利。.NET 类库允许程序在运行时访问。通用语言运行时 (CLR) 管理程序的执行。通过 JIT 编译器（即时编译）将 MSIL\
    \ 转换为可执行代码。JIT 代表“即时”(just in time)。\n\n### CLR 的功能\n\nCLR 具有：\n\n- 代码转换\n- 异常处理\n\
    - 类型安全\n- 性能\n- 平台独立性\n- 独立性\n\n### CLR 的组件\n\nCLR 的关键组件包括：\n\n- 类加载器 - 在运行时加载所有类。\n\
    - MSIL 到原生代码 - 即时编译器 (JIT) 将 MSIL 转换为原生代码。\n- 代码管理器 - 在运行时管理代码。\n- 垃圾回收器 - 管理并释放内存。\n\
    - 线程支持 - 支持多线程。\n- 异常处理程序 - 在运行时处理异常。\n\n### CLR 的优势\n\n运行时提供了以下益处：\n\n- 性能提升。\n\
    - 轻松使用其他语言开发的组件。\n- 支持继承、接口和重载等语言特性。\n- 支持显式线程，用于创建可扩展的应用程序。\n- 支持结构化异常处理。\n-\
    \ 支持自定义属性。\n- 垃圾回收。\n- 使用委托提高类型安全性和安全性。\n\n![](img/00001.jpg) 面向对象编程\n\nC# 的核心是面向对象编程\
    \ (OOP)。面向对象方法论与 C# 不可分，所有的 C# 程序在某种程度上都是面向对象的。由于其对 C# 的重要，在编写简单的 C# 程序之前理解 OOP\
    \ 基本原理是有用的。\n\n封装是将代码与其操作的数据结合的机制，并使其不受外部干扰和误用。在面向对象的语言中，可以将代码和数据结合，创建一个黑盒。\n\n\
    多态（源自希腊语，意为“多种形式”）允许一个接口访问通用类。多态的一个简单例子是汽车的方向盘。无论使用什么类型的转向机制，方向盘（接口）都是相同的。\n\n\
    继承是一个对象获取另一个对象属性的过程。这很重要，因为它支持层级分类的概念。如果你想一下，大多数知识通过层级（即自上而下）分类变得易于管理。\n\n## Visual\
    \ Studio IDE (集成开发环境)\n\nVisual Studio 是微软的集成开发环境。它允许我们在不离开其良好环境的情况下编辑、编译、运行和调试\
    \ C# 程序。Visual Studio 提供了便利并有助于管理程序。它对于较大的项目最为有效。\n\n## 新 C# 项目\n\n通过选择“文件 | 新项目”创建一个新的空\
    \ C# 项目。接下来，选择“空项目”。\n\nVisual C# - 项目\n\n- 控制台应用程序\n- Windows Forms 应用程序\n\n\
    - 控制台应用程序\n\n此 C# 程序在命令窗口中显示输出。 示例\n\n```\nclass MyClass {\n    static void Main()\
    \ {\n        Console.Write(\"Welcome\");\n    }\n}\n```\n\n其中 `Console.Write()`\
    \ 方法用于在屏幕上显示输出，`Console.ReadLine()` 方法在运行时读取数据 ## 数据类型\n\n## 下表显示了支持的数据类型，包括存储大小和范围。`byte`\
    \ (1), `Boolean` (true / false), `integer` (+/**\n\n"
- fmt: "\n**`32,767)`, `long` (10 digit integer), `single` (4 bytes float), `double`\
    \ (8 bytes float), `decimal` (14 bytes 29 digit integer), `date` ( year 1 to 9999),\
    \ `string`**\n\n![](Image00002.gif)\n\n| Data type | Storage size | Range |\n\
    | :--- | :--- | :--- |\n| `byte` | 1 byte | 0 to 255 |\n| `boolean` | 2 bytes\
    \ | `True` or `False` |\n| `integer` | 2 bytes | -32,768 to 32,767 |\n| `long`\
    \ (long integer) | 4 bytes | +/- 10 Digit Integer |\n| `longlong` (longlong integer)\
    \ | 8 bytes | +/- 19 Digit Integer |\n| `single` (single-precision floating[4\
    \ bytespoint)] | -3.4 E38 to -1.4E-45 |\n| `double` (double-precision floating\
    \ 8 bytes point) | -1.7E308 to-4.9E-324 for negative values; 4.9E-324 to 1.7E308\
    \ for positive values |\n| `currency` (scaled integer) | 8 bytes | +/- 15 Digits\
    \ |\n| `decimal` | 14 bytes | +/-29 Digits |\n| `date` | 8 bytes | January 1,\
    \ 100 to December 31, 9999 |\n| `object` | 4 bytes | Any `Object` reference |\n\
    | `string` (variable-length) | 10 bytes + string length | 0 to approximately 2\
    \ billion |\n| `string` (fixed-length) | Length of string | 1 to approximately\
    \ 65,400 `variant` (with numbers) |\n\n## **Arithmetic Operators**\n\n- `+` Addition\n\
    - `−` Subtraction\n- `*` Multiplication\n- `/` Division\n\nUsing the above arithmetic\
    \ operators we can do lot of calculation in c-sharp language.\n\n```csharp\nint\
    \ num1, num2, add;\nnum1 = Convert.ToInt32(Console.ReadLine());\nnum2 = Convert.ToInt32(Console.ReadLine());\n\
    add = num1 + num2;\nConsole.Write(add);\n```\n\n## **Relational Operators**\n\n\
    | Operator | Meaning |\n| :--- | :--- |\n| `<` | Less than |\n| `<=` | Less than\
    \ or equal to |\n| `>` | Greater than |\n| `>=` | Greater than or equal to |\n\
    | `==` | Equal to |\n| `!=` | Not equal to |\n\n16 bytes Any numeric value up\
