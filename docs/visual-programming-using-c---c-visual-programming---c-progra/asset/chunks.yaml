    ## **Classes, Objects, Methods, Properties and Instance Variables**


    Let’s begin with a simple drive a car, someone has to design it. A car typically
    begins as engineering drawings, similar to the blueprints used to design a house.
    These engineering drawings include the design for an accelerator pedal to make
    the car go faster. The pedal ―hides‖ the complex mechanisms that actually make
    the car go faster, just as the brake pedal ―hides‖ the mechanisms that slow the
    car and the steering wheel ―hides‖ the mechanisms that turn the car.


    This enables people with little or no knowledge of how engines work to drive a
    car easily.


    ## **Methods**


    Now let’s use our car example to introduce the key progr amming concepts of this
    section. Performing a task in an application requires a method. The method describes
    the mechanisms that actually perform its tasks. The method hides from its user
    the complex tasks that it performs, just as the accelerator pedal of a car hides
    from the driver the complex mechanisms of making the car go faster.


    ## **Classes**


    In C#, we begin by creating an application unit called a class to house (among
    otherthings) a method, just as a car’s engineering drawings house (among other
    things) the design of an accelerator pedal. In a class, you provide one or more
    methods that are designedto perform the class’s tasks.


    For example, a class that represents a bank account might contain one method to
    deposit money in an account, another to withdraw money from an account and a third
    to inquire what the current account balance is. Objects Just as you cannot drive
    an engineering drawing of a car, you cannot ―drive‖ a class. Just as someone has
    to build a car from its engineering drawings before you can actually drive it,
    you must build an object of a class before you can make an application perform
    the tasks the class describes. That’s one reason C# is known as an object-oriented
    programming language.


    ## **Method Calls**


    When you drive a car, pressing its gas pedal sends a message to the car to perform
    a task make the car go faster. Similarly, you send messages to an object—each
    message is known as a method call and tells a method of the object to perform
    its task.


    ## **Attributes**


