    using a garbage collector to reclaim the memory occupied by objects that are no
    longer in use, so the memory can be used for other objects. When there are no
    more references to an object, the object becomes eligible for destruction. Every
    object has a special member, called a destructor, that is invoked by the garbage
    collector to perform termination housekeeping on an object before the garbage
    collector reclaims theobject’s memory. A destructor is declared like a parameterless
    constructor, except that its name is the class name, preceded by a tilde (~),
    and it has no access modifier in its header.After the garbage collector calls
    the object’s destructor, the object becomes eligible for garbage collection.


