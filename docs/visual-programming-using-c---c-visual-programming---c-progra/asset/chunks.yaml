    }


    static void Main(string[] args) {


    Printdata p = new Printdata();


    // Call print to print integer p.print(5);


    // Call print to print float p.print(500.263);


    // Call print to print string


    p.print("Hello C++");


    Console.ReadKey();


    }


    }


    In the above example we written the print() function for integer, float and string
    data.


    ## **Dynamic Polymorphism**


    C# allows you to create abstract classes that are used to provide partial class
    implementation of an interface. Implementation is completed when a derived class
    inherits from it. Abstract classes contain abstract methods, which are implemented
    by the derived class. The derived classes have more specialized functionality.


    Here are the rules about abstract classes −


     We cannot create an instance of an abstract class


     We cannot declare an abstract method outside an abstract class


    abstract class Shape {


    public abstract int area();


    }


    class Rectangle: Shape {


    private int length;


    private int width;


    public Rectangle( int a = 0, int b = 0) { length = a;


    width = b;


    }


    public override int area () {


    The method area() present in base class Shape as a abstract member. That will
    be redefined in derived class called dynamic polymorphism.


    Console.WriteLine("Rectangle class area :"); return (width * length);


    }


    static void Main(string[] args) {


    Rectangle r = new Rectangle(10, 7); double a = r.area();


    Console.WriteLine("Area: {0}",a); Console.ReadKey();


    } }


