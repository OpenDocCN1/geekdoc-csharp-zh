  \ SQL 基础\n\nEntity SQL 是一种基于文本的查询语言，允许你直接在 C# 代码中编写数据查询。我们将首先为你提供坚实的 Entity SQL\
  \ 基础，涵盖其语法、查询组合以及它与传统 SQL 的区别。你将深入理解如何构建 Entity SQL 查询以从 Entity Framework 模型中检索数据。\n\
  \n```csharp\nvar entitySqlQuery = \"SELECT p.Name FROM Products AS p WHERE p.Price\
  \ < 50\";\n```\n\n我们的代码片段演示了一个简单的 Entity SQL 查询，用于选择价格小于 50 的产品名称。\n\n## 执行复杂查询\n\
  \nEntity SQL 在处理复杂查询场景方面表现出色。我们将探索 Entity SQL 发挥优势的高级技术和场景，例如执行复杂的联结、聚合数据以及执行涉及多个相关实体的查询。你将学习如何利用\
  \ Entity SQL 的能力从你的数据中提取价值的见解。\n\n```csharp\nvar complexEntitySqlQuery = @\"\n\n\
  SELECT c.Name, COUNT(o.OrderID) AS OrderCount\nFROM Customers AS c\nINNER JOIN Orders\
  \ AS o ON c.CustomerID = o.CustomerID\nGROUP BY c.Name\nHAVING COUNT(o.OrderID)\
  \ > 5\";\n```\n\n我们的代码示例演示了一个复杂的 Entity SQL 查询，该查询连接了客户和订单，统计每个客户的订单数量，并过滤结果仅包含订单超过五个客户。\n\
  \n## Entity SQL 中的参数化\n\n参数化是编写安全且高效查询的关键方面。我们将引导你完成 Entity SQL 查询的参数化过程，确保你的查询不受\
  \ SQL 注入攻击，而且针对查询计划的缓存和重用进行了优化。\n\n```csharp\nvar minPrice = 50;\n\nvar parameterizedEntitySqlQuery\
  \ = \"SELECT p.Name FROM Products AS p WHERE p.Price < @minPrice\";\n```\n\n我们的代码片段展示了\
  \ Entity SQL 中的参数化，其中 `@minPrice` 参数用于根据价格过滤产品。\n\n你已经熟练掌握如何在 Entity Framework 中使用\
  \ Entity SQL 进行高级查询。Entity SQL 的表达能力灵活性使其成为处理复杂数据检索场景和从数据模型中提取意义信息的宝贵工具。掌握 Entity\
  \ SQL 使你能够创建处理即使是最复杂的查询要求的数据驱动应用程序。\n\n## 性能考虑因素\n\n在《C# 的 Entity Framework 数据访问技术》的第\
