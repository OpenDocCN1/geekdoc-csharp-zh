  \ Orders { get; set; }\n}\n```\n\n我们的 `Customer` 类说明了在 `Orders` 导航属性上使用 `virtual`\
  \ 关键字来实现延迟加载。\n\n你现在全面理解了在 Entity Framework 中使用 LINQ 和 Entity SQL 的性能因素。这些见解和策略对于构建提供最佳性能的数据驱动应用程序至关重要。性能优化是成为精通\
  \ Entity Framework 开发者的关键方面。\n\n# 第 6 节：Entity Framework 与数据库\n\n欢迎来到《C# 的 Entity\
