  \    {\n        ValidAudience = \"your-audience\",\n        ValidIssuer = \"your-issuer\"\
  ,\n        IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(\"\
  your-secret-key\")),\n    };\n});\n```\n\n#### 保护传输中和静态的数据\n保护 RESTful APIs 不仅关于控制谁可以访问它们，还要确保数据在传输时被加密，并在存储时得到妥善保护。我们将涵盖保护传输中和静态数据的技术，提供一种全面的\
  \ API 安全方案。\n\n#### 防止常见的安全漏洞\n此外，我们将探索常见的安全漏洞，如跨站脚本 (XSS) 和跨站请求伪造 (CSRF)，以及如何保护你的\
