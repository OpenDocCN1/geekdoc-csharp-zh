  \ 查询涉及构建表达式，以指定你想检索的数据以及它应该如何成型。我们将引导你一步步构建 LINQ 查询的过程，涵盖过滤、投影、排序和其他基本操作。你将获得编写精确查询以提取所需数据的实战经验。\n\
  \n```csharp\nvar query = from product in dbContext.Products\nwhere product.Price\
  \ < 50\norderby product.Name\nselect new\n{\n    product.Name,\n    product.Price\n\
  };\n```\n\n我们的代码示例说明了一个 LINQ 查询，它过滤价格小于 50 的产品，按名称排序，并仅投影名称和价格。\n\n### 理解延迟执行\n\n\
  延迟执行是处理 LINQ 查询时的一个关键概念。我们将探索 LINQ 查询并非在构建时立即执行，而是在实际需要数据时才执行。这一概念允许优化查询执行，并在涉及大型数据集场景中对性能产生显著影响。\n\
  \n```csharp\nvar query = dbContext.Products.Where(p => p.Price < 50);\nvar result\
  \ = query.ToList(); // 执行在此处\n```\n\n我们的代码片段通过在调用 `ToList()` 时执行查询演示了延迟执行。\n\n你已经掌握了使用\
