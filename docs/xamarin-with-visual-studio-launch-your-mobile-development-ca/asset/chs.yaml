  \n有关 BPB 的更多信息，请访问 [`www.bpbonline.com`](http://www.bpbonline.com/)。\n\n# 第一章\n\n\
  ## 移动应用开发的重要性\n\n### 引言\n\n作为一名 Xamarin 求职者，你正准备进入开发和发布移动设备应用程序的美奇世界。编写软件确实需要技术背景，但还需要理解你将要针对的市场和用户群体。在移动应用开发领域，有必要理解为什么它在今天代表了一项重要的职业机会，以及获得最佳结果的推荐方法。本章介绍了当今移动应用开发的现状，并解释了为什么使用像\
  \ Xamarin 这样的开发框架可以开启更多机会，并提供有关如何自主跟上移动世界新发布版本的提示。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   当今移动应用开发的重要性\n*   使用跨平台方法开发移动应用的重要性\n*   跟上技术发布\n\n### 目标\n\n完成本章后，你将理解为什么构建移动应用对于今天的求职者来说是一项重要机会，你还将理解为什么从一个代码库为多个平台开发应用程序很重要。你将明确目前有哪些类型的移动设备以及它们是如何改变人们生活的。最后，你将获得有关如何跟上新发布和平台更新的提示，这是信息技术工作中至关重要的一部分。\n\
  \n### 移动应用的重要性\n\n在过去的 10 年里，智能手机、平板电脑和可穿戴设备的惊人普及彻底改变了我们的生活。如果你考虑智能手机（最重要的移动设备），它们不仅可以通话，还可以作为每个人的个人助手。它们允许人们执行一些在几年前只能通过计算机完成的任务，如上网或使用专用工具和资源。想象一下播放音乐的\
  \ MP3 播放器、查看时间的钟、标记约会的日历、获取信息的报纸等等；这些现在都可以在智能手机中。作为一名软件开发者，移动设备的日益普及、技术的持续演进以及它们应用的多样性，为在软件行业寻找长期工作提供了极佳的机会。但在开始开发之前，需要考虑移动设备的演变，以及它们如何改变了我们的生活，也改变了公司管理的方式。\n\
  \n### 移动设备与应用程序\n\n\n\n\n首先要澄清的一点是什么是移动设备，以及这个定义在今天如何适用，其中包含一些历史背景，帮助你关注当今移动应用开发的重要性。任何可以在移动中工作的设备都可以被视为移动设备。仅用于通话和短信的旧功能手机、笔记本电脑、手表、MP3\
  \ 播放器、罗针都是移动设备的例子。显然，你无法为 20 世纪 90 年代的功能手机或 MP3 播放器开发应用程序，但它们仍然是移动设备。因此，第一个基本考虑是：移动设备的现代是从先进硬件与操作系统的结合开始的。在移动设备上拥有操作系统（如\
  \ `iOS` 或 `Android`），不仅为终端用户带来了更好的、以人为中心的体验来使用所有内置系统功能（包括摄像头和传感器），还提供了运行应用程序的选择。这使得旧设备与现代设备产生了本质区别。在设备上拥有操作系统允许开发具有不同目的并能利用所有系统硬件的应用程序，为个人开发者、软件公司和企业内部使用开启了新的商业机会世界。\n\
  \n### 现代移动设备的简史\n\n市场上有多多种操作系统可用，但大多数移动设备运行在 `iOS` 和 `Android` 上，因此我们可能会认为这些是开启移动革命的首批系统。这只是部分正确。在\
  \ 21 世纪 00 代中期，微软发布了 `Windows Compact Edition`（`CE`）操作系统，它支持第一代智能手机和平板电脑。当时，运行 `Windows\
  \ CE` 的设备已经提供了触摸屏，尽管当时需要使用塑料笔与设备进行交互，因为那时的屏幕交互还非常基础。`Windows CE` 是一个功能完整的操作系统，包含了\
  \ `Microsoft .NET Compact Framework` 平台，使用 `Microsoft Visual Studio` 和 `C#` 编程语言的开发者可以使用该平台为该类设备构建应用程序。`Windows\
  \ CE` 是一个具有远见的操作系统，但受到两个主要问题的困扰：它主要认为是为商务客户设计的，而不是面向全球受众；而且它没有被充分地推向人们的家庭，反而像 `Windows\
  \ PC` 那样。市面上也有运行 `Windows CE` 的手机供所有人使用，但其普及率很低，导致成功有限。几年后，苹果和谷歌完成了向现代移动设备时代的过渡，为全球受众引入了智能手机和平板电脑，其操作系统的设计理念是人人为中心，而不是以业务为中心。这使得世界上每一个人都能开发应用程序并可能从中获利。\n\
  \n### 面向人的移动设备\n\n苹果在 2008 年首次推出了带有 `iOS` 操作系统的 `iPhone`，2 年后，他们推出了同样运行 `iOS` 的\
  \ `iPad` 平板电脑。尽管成本最高，苹果进行了一次不可思议的营销活动，使公司能够推销这些设备，现在很多人经常将 `iPad` 称为平板电脑，将 `iPhone`\
  \ 称为“手机”。2008 年，谷歌宣布了第一版本的 `Android`，运行该操作系统的第一台设备是 `HTC Dream` 智能手机。`Android` 随后被许多制造商迅速采用，并成为大量价格适的智能手机和平板电脑的首选系统，这是它们成功的关键之一。在发布平板电脑时，苹果和谷歌都确保开发者可以免费复用大部分代码，使他们的应用在两种设备上运行而无需额外成本，这是他们成功的另一个要点，因为终端用户可以在智能手机和平板电脑上拥有他们喜爱的应用（极少数除外）。微软作为首家投资移动操作系统和移动应用开发的公司后，在几年后通过\
  \ `Windows Phone` 操作系统再次加入这一市场，首先与 `LG` 和 `Nokia` 等重要制造商合作，然后构建了自己的设备。`Windows Phone`\
  \ 是一个非常好的系统，但它已经太晚，无法占据足够的市场份额来生存，因此最终在 2019 年被淘汰。近年来，华为也为他们的设备创建了基于 `Android` 引擎的操作系统，得益于设备的普及，可以被认为是继\
  \ `iOS` 和 `Android` 之后的第三常用操作系统。\n\n### 无处不在移动设备\n\n随着技术的演进，科技公司能够在其他类型的设备上实现操作系统。两个例子是智能手表和智能电视，你有苹果和谷歌操作系统的专用版本，使得在手表和电视接收机上运行成为可能。在智能手表上，你可以通话、发送消息、监控心率、分享运动结果以及更多操作。在智能电视上，你可以使用喜爱的流媒体服务的应用程序来看电视节目和电影。你将在书中后面看到\
  \ `Xamarin` 如何允许为这类设备创建应用程序。微软将 `Windows 10` 从 PC 引入了 `HoloLens` 全息眼镜和 `Xbox` 游戏机，因此有不同类型的设备实现了“应用程序随处可用”的愿景。现在你已经对过去几年的演变有了整体了解，理解企业如何开始将移动设备成为其日常流程的一部分变得非常重要。\n\
  \n### 移动应用对公司的重要性\n\n随着智能手机和平板电脑进入千家万户，每个人都能理解这些设备及其系统的潜力。它不再仅仅是公司内部用于商务目的的工具；而是属于每个人的东西，从娱乐到简化日常任务等等。公司是由人组成的，而那些为了个人目的使用智能设备并经营公司的人们，已经迅速开始考虑将智能手机和平板电脑引入日常工作，以提高生产力、加快速度并节省成本。让我们来看几个例子：\n\
  \n*   **餐厅**：过去，服务员点餐的唯一方法是拿着笔去顾客桌旁写下订单然后去厨房；现在，许多餐厅有了智能手机或平板电脑，服务员快速输入订单，系统会自动通知厨房，为客户和餐厅员工提高了效率并节省了时间。\n\
  *   **医院**：通过平板电脑和特定应用程序，医生可以在现场实时检查患者状况并开适当的治疗方案，而无需反复回到桌面查看电脑并写下所有内容。\n*   **销售代表**：他们去客户那里时，可以在平板电脑上拥有所需的一切，而无需每次都带笔记本电脑。\n\
  *   **库存管理**：通过智能手机或平板电脑，可以在巡视库存时搜索产品，而不是先在桌面工作站上查找。\n*   **银行**：通过提供移动银行应用程序，他们为客户提供了极佳的服务，让客户可以随地操作账户而无需排队数小时，同时也释放了大量内部的人力资源。\n\
  \n\n\n可能有成千上万的例子，但这些例子足以让你理解为什么移动应用程序对企业至关重要，并因此说明为什么移动应用开发在今天如此重要。下一节将进一步阐述上述考虑因素的重要性。\n\
  \n### 移动应用开发中的职业机会\n\n技术的不断演进为移动应用开发领域提供了重要的职业机会。更强大的新硬件、运行操作系统的新型设备、移动操作系统的持续更新，以及越来越多的公司将智能手机和平电脑作为日常工作工具，都确保了移动应用开发行业就业的稳定性。机会可以针对两个不同的领域：个人用户和企业。你可以开发面向全球观众的应用程序，让每个人都能安装你的应用或游戏；你也可以开发针对企业的应用程序，或者公司为了其特定需求而创建的内部使用的应用程序。\n\
  \n### 如何通过移动应用开发赚钱\n\n在第一个领域（即个人用户）中赚钱无疑要困难得多。`Apple Store` 和 `Google Play` 中有数百万个应用，而且几乎每种需求都有免费的程序。因此，你需要发明新事物，并创建出让成千上万用户喜爱以至于愿意付费的程序或游戏。为全球观众构建成功的付费应用是一项复杂且结构化的工作，因此它们通常由软件公司开发，这些公司可以依靠多个团队：开发团队、营销团队、本地化团队、测试人员和数据分析团队。\n\
  \n对于个人自由职业开发者来说，这确实可以，但付出非常高。因此，如果你希望看到自己的工作成果运行在每个人的设备上，你可能想在软件公司找一份工作。作为替代方案，如果你希望保持独立，你仍然可以作为自由职业顾问加入一个或多个由软件公司运行的项目。当涉及到公司将移动设备作为日常工作工具时，这可能是最有趣的选择，而且能让你更容易获得薪水。事实上，有些公司的业务是构建软件，而有些公司的业务并非构建软件，但他们希望拥有用于企业内部使用的应用程序。在在这两种情况下，你都能够从零开始开发新应用程序，或者长期地更新和维护现有应用程序，因为业务需求会随着时间而变化。此外，业务类型的多样化将使你的工作更有趣且更有挑战性，这对于你的动力至关重要。\n\
  \n### 总结移动系统的工作原理\n\n之前，你已经了解到现代移动设备与旧一代移动设备的区别在于，现代设备拥有一个允许托管应用程序的操作系统。让我们更详细地澄清这些句子。操作系统是使用户与硬件之间进行交互的软件，它们从第一批计算机在全球市场发布以来就已经存在了。例如，`MS-DOS`\
  \ 是 `Microsoft` 在 80 年代赋予个人电脑能力的操作系统。在当时，一切都必须通过键盘和命令行完成，但得益于连接用户与磁盘驱动器的操作系统，向磁盘写入文件的简单操作是可能的。具有图形用户界面的操作系统随后在\
  \ 90 年代开始改变用户使用计算机的方式，并伴随着持续的演进，导致了我们今天在计算机和设备上使用的操作系统。对于移动设备，请思考你手机上的系统相机应用：\n\n\
  * 你点击相机图标\n* 软件启动相机\n* 通过一个简单的按钮，你就可以控制相机拍照或录制视频\n\n在这些几个手势背后，有很多你需要了解的概念。相机是你手机上的设备硬件。操作系统是你作为用户与硬件之间的真实连接，因为它允许你通过相机应用与手机摄像头进行交互。我不断提到相机应用是一个应用程序而不是操作系统的功能，是因为任何由开发者构建的应用程序都可以使用相机硬件。设备制造商为用户提供内置的系统应用程序，以便可以立即使用相机拍照和录制视频。但如果你考虑即时通讯软件，它们允许你拍摄照片并通过系统应用程序之外的消息将其快速发送给你的联系人。这是可能的，因为操作系统暴露了函数和库，任何人构建的任何应用程序都可以调用它们来访问设备上的硬件。这些函数和库被称为\
  \ `Application Programming Interface`（`API`）。每个操作系统都有一组特定的 `APIs`，它们是构建移动设备应用的关键。。预装在\
  \ `iOS` 和 `Android` 上的相机应用本身会调用系统 API 来访问硬件。`APIs` 存在于任何让设备执行某些工作的地方，例如读写文件、与传感器交互、绘制用户界面。苹果和谷歌提供了开发工具和环境，让开发者能够通过编程语言（如苹果的\
  \ `Swift` 和谷歌的 `Java`）以及一组简化了通过高层方法访问此类 `APIs` 的库来访问系统 `APIs`。显然，在本书中是不可能描述苹果和谷歌的\
  \ `APIs` 是如何工作的（在 `Chapter 13, Working With Native API` 中明确要求除外），但这里需要理解的关键点是操作系统如何让应用程序能够使用设备硬件和功能。\n\
  \n### 跨平台方法的重要性\n\n根据前几节的讨论，假设你经营一家公司，想要构建一个应用程序来改进两个主流移动系统——`iOS` 和 `Android` 的业务。苹果和谷歌提供了它们自己的开发工具、编程语言、平台和环境，这两个操作系统都有它们自己的特定功能。考虑到这些，你有两种替代方案：\n\
  \n* 聘用几名开发者，其中一些具有苹果平台经验，另一些具有安卓 平台经验，这将使你的公司能够在更短的时间内为两个操作系统构建应用，但成本会高得多。\n* 聘用具有两种开发环境经验的少量开发者。这将节省资金，但至少会将开发时间增加一倍，对发布时机，因此对你的业务产生巨大影响。\n\
  \n\n\n\n\n由于公司对在不同平台上提供应用程序的需求，在过去的几年中，已经创建出多种技术，使开发者能够从单一代码库目标多个平台。这被称为**跨平台开发**，而且它不仅适用于移动开发。事实上，某些技术允许从单一的共享代码库为不同的系统和不同的设备构建应用。例如，由\
  \ `Xamarin` 提供的 `Xamarin.Forms` 平台允许你从一个代码库目标 Android 和 iOS 移动系统、Windows 和 `macOS`\
  \ 电脑以及可穿戴设备，这是跨平台开发技术的完美范例。表 1.1 提供了目前最流行的跨平台开发技术的总结：\n\n| **名称** | **简要描述** | **编程语言**\
  \ |\n| :--- | :--- | :--- |\n| **Angular** | Angular 是一个开源框架，允许从共享的 Java 代码库为移动设备、桌面和网页创建应用。\
  \ | **Java** |\n| **React Native** | React Native 是开源的，由 Facebook 开发。它允许使用 JavaScript\
  \ 和 `React.js` 库为 Android、iOS、macOS 和 Windows 创建应用。 | **JavaScript** |\n| **Xamarin**\
  \ | Xamarin 是基于 Microsoft .NET 技术构建的开源框架。它允许为 Android、iOS、macOS、Windows 和可穿戴设备创建应用，并为已具备微软技术栈技能的开发者设计。\
  \ | **C#** |\n| **Flutter** | Flutter 是 Google 开发的开源框架，允许为移动设备和桌面系统（包括 Linux）构建应用。它与\
  \ Google 创建的 Dart 编程语言配合工作。 | **Dart** |\n| **Cordova** | Cordova 是最早的跨平台开发工具之一，现在由\
  \ Adobe 支持。应用是结合用于用户界面的 HTML 标记和用于功能的 JavaScript 代码的结果。 | **HTML + JavaScript**\
  \ |\n| **Ionic** | Ionic 构建在 `Cordova` 之上，并与 JavaScript 代码配合。它经常因生成的应用性能较低而受到批评。\
  \ | **JavaScript** |\n\n**表 1.1：** 最流行的跨平台开发技术\n\n需要理解，公司通常根据许多条件（包括现有员工的现有技能）来决定使用什么技术以及需要招聘的人员。这是\
  \ 第 2 章，移动应用市场中的 Xamarin 和微软 中的关键点之一。本书专注于 `Xamarin`，但所有这些跨平台开发框架都有一些共同点。这些将在后续章节中讨论。\n\
  \n# 跨平台代码的局限性 (#toc.xhtml_s14a)\n\n不同的操作系统具有不同的架构和 API，并运行在不同的硬件上。因此，跨平台代码无法访问特定系统的所有功能；它只能访问多个系统共有的功能。例如，iPhone\
  \ 和运行 Android 的三星手机都拥有相机，跨平台代码确实可以拍照和录视频，因为此功能在两个系统中都是可用的。然而，iPhone 的相机具有三星设备不具备的功能，反之亦然；此类功能无法通过跨平台代码访问，因为它们是特定于平台的。继续上一个例子，开发者仍然能够单独访问\
  \ iPhone 相机的完整功能和三星设备相机的完整功能，但这需要通过原生代码来实现，这意味着要编写仅适用于特定平台的代码，因此它不是跨平台的。关于 `Xamarin`\
  \ 如何这样工作的实际示例请参阅 第 13 章，使用原生 API。\n\n# 应用大小与性能 (#toc.xhtml_s15a)\n\n你经常会听到人们谈论跨平台应用。这种术语是不正确的。应用始终是原生的，这里的原生意味着跨平台开发框架（如\
  \ `Xamarin.Forms`）可以生成特定目标系统的二进制文件，例如适用于 iOS 的 `.ipa` 文件、适用于 Windows 的 `.exe` 文件以及适用于\
  \ Android 的 `.apk` 文件。没有任何通用文件格式可以同时目标这三者。正确的术语应该是“跨平台项目”。在接下来的章节中，你将了解到项目是一组源代码文件、图像、字体和创建应用所需的所有资源，这些资源最终会被封装进应用程序文件中。这些澄清非常重要，因为许多开发者（通常还有利益相关者和决策者）认为跨平台意味着性能低下且应用尺寸巨大。事实并非如此；为了更好地理解，让我们用几个简单的词来总结一下原生开发和跨平台开发是如何工作的。\n\
  \n# 了解原生应用 (#toc.xhtml_s16a)\n\n使用 Apple 或 Google 开发工具构建的原生应用会直接访问 iOS 或 Android\
  \ API。相反，当你使用跨平台开发框架构建应用时，它拥有的库会首先检测应用运行在何种操作系统上，并根据该系统调用相应的 iOS 或 Android API 来绘制用户界面并调用其他功能。简而言之，你的应用需要这些框架库才能工作，而这些库需要被封装到跨平台开发框架生成的应用程序文件中。结果是，生成的应用程序文件会大一点，因为它需要包含更多的库。\n\
  \n# 揭开应用性能问题的谜 (#toc.xhtml_s17a)\n\n你的应用首先需要调用跨平台框架的库，因此它会产生额外的开销。然而，应用大小和这种额外开销都是合理的。对于\
  \ `Xamarin`，这项技术多年年来一直在演进，微软付出了巨大的努力以提供最佳性能。\n\n大多数时候，如果应用性能不佳，是因为架构设计不当或开发者在编写代码时没有做出最佳决策。有时，最终的应用程序文件变得很大，因为它包含了未使用的资源、对于移动设备来说太图像文件等。此外，仅仅将开发工具更新到最新版本可能会带来性能改进。尽管如此，你不应该因为使用了跨平台开发工具就担心应用大小和性能问题。你构建和编写应用将决定差异。\n\
  \n# 与新设备和平台保持同步 (#toc.xhtml_s18a)\n\n与新设备和保持同步对你来说非常重要。此外，当市场上出现新设备，或者当移动操作系统的新版本作为现有设备的更新而发布时，厂商也会发布针对这些新产品的更新开发工具。这对于你来说极其重要，因为你需要确保你的现有代码在新设备和更新的系统上仍然能够运行。因此，了解何时可用更新的开发工具并对你的工作进行必要的调整是非常重要的。\n\
  \n\n\n\n\n在第 5 章，使用 Xamarin 和 Xamarin.Forms 构建移动应用中，我将提供有关如何更新此本书所需开发工具的具体信息。\n\n\
  你可以自由选择自己喜欢的方式来保持信息更新，但最简单的方法是收藏各厂商的开发者网站，并订阅他们的新闻和活动（也可以通过新闻通讯）。特别是当新设备即将上市时，厂商通常会组织可以在线参加的会议，你应该关注。接下来的几段提供了有关如何从主要厂商处订阅本书介绍的平台相关新闻的信息。\n\
  \n### 从 Apple 获取更新\n\nApple 在其网站（[`www.apple.com`](https://www.apple.com)）上分享新闻和活动信息，例如发布新产品的会议。如果你愿意在移动应用开发行业工作，你可能还想收藏书签\
  \ Apple 开发者网站（[`developer.apple.com`](https://developer.apple.com)）。这是主要的开发者门户，你可以在此处访问构建适用于\
  \ macOS、iOS、tvOS 和 WatchOS 的应用程序所需的所有开发资源。书中会在适当的时候提到这些内容，但在这里，他们还会分享关于技术会议、活动、新设备以及从开发角度看操作系统新版本。图\
  \ 1.1 展示了 Apple 开发者门户的示例，其中包括 2021 年全球开发者大会（WWDC21）的公告以及指向活动期间公告列表的快捷方式（Apple 活动）：\n\
  \n![](img/Figure-1.1.jpg)\n\n**图 1.1：** 从 Apple 开发者门户获取更新\n\n你可以点击每个快捷方式，查看使用 Apple\
  \ 私有技术的开发者公告、新闻、新设备和技术会议列表。对于与提交应用到 App Store 以及新开发库相关的完整更新列表，你可以访问 `News and Updates`\
  \ 网站。图 1.2 显示了一个示例，你可以在其中看到网站如何告知 App Store 税收的变化：\n\n![](img/Figure-1.2.jpg)\n\n\
  **图 1.2：** News and Updates 网页显示开发者的更新\n\n该网站非常重要，因为它列出了你在发布应用到 App Store 时需要满足的强制性要求，还列出了新的和更新的开发者工具，以及你必须注意的商店政策更新。\n\
  \n### 从 Google 获取更新\n\nGoogle 在两个不同的网站上分享关于 Android 操作系统和开发工具的信息。关于 Android 操作系统的新闻和\
  \ Android 的通用公告可以在 [`www.android.com`](https://www.android.com) 找到。从上到下滚动页面，你会发现指向新功能列表、设计更新、对特定技术的支持以及运行\
  \ Android 的设备列表的快捷方式。在页面底部，你会找到开发者新闻列表，你可以水平滚动。图 1.3 展示了它的样子：\n\n![](img/Figure-1.3.jpg)\n\
  \n**图 1.3：** 针对开发者的 Android 最新新闻\n\n你可以获取有关使用 Google 工具为 Android 开发的新闻的第二个网站是 Google\
  \ 开发者网站（https://developers.google.com）。这是主要的开发者门户，包含了所有支持 Android 开发的 Google 技术的官方文档。建议你访问\
  \ `Events` 页面，在在那里你可以找到可以参加的会议和活动列表，以了解 Android 应用程序开发和支持该操作系统的新设备的最新动态。\n\n###\
  \ 从 Microsoft 获取新闻\n\n即使 Microsoft 不再生产智能手机、平板电脑（除可转换 Surface 设备外）和移动操作系统，但书中描述的以及你在工作中使用的开发环境、编程语言和平台是由\
  \ Microsoft 生产的。此外，Xamarin 可以针对 Windows 10，Windows 10 拥有一个商店（Windows Store），用户可以从那里下载应用程序，因此关注该公司的新发布版本非常重要。全球新闻可以在\
  \ https://news.microsoft.com 获取。活动和会议可以通过 Events 页面（https://www.microsoft.com/en-us/events）访问，在那里你可以找到为开发者、IT\
  \ 专业人员和企业提供的即将举行和已过去的活动列表，并附有录像。请注意，即使页面地址包含 en-US 本地化标识，它也是一个全球页面，总结了全球范围内的活动。随后，你可以浏览\
  \ Microsoft 开发者（[`developer.microsoft.com`](https://developer.microsoft.com)）网站获取有关开发工具和平台的最新新闻、发布和更新。这对于保持新技术和官方文档的更新尤为重要。\n\
  \n### 结论\n\n随着最现代移动设备的日益普及，由于公司业务模式随时间的推移发生了变化，成为移动应用开发者无疑是你开启成功且安全职业的最佳选择之一。这不仅涉及技术技能，还需要理解市场如何演变、用户和公司需求的变化，以及新设备和新操作系统版本的可用性。智能手机和平板电脑无疑是个人和商业用途最常用的设备，因此你可能希望将注意力放在\
  \ iOS 和 Android 系统上。为了构建应用程序，你需要开发工具和平台，无论是原生还是跨平台的。有多种选项可用，本书讨论了 Xamarin 及其 Xamarin.Forms\
  \ 变体，它可以帮助你从一个共享的 C# 代码库跨多个平台。跨平台开发有缺点，但如果你的应用程序架构准确，你就能从中获得最大的收益。开发工具和平台也会随着设备而演进，因此你必须关注主要厂商的公告和发布；你已经了解了如何简单地做到这一点。在对今天移动开发的重要性和现状进行概括之后，是时候深入了解为什么\
  \ Xamarin 是一个很好的选择，以及它是如何适应当今市场的。\n\n### 要点回顾\n\n*   **移动设备**：可以在移动状态下工作的设备。\n*\
  \   **操作系统**：允许用户与硬件交互的软件。\n*   **应用程序编程接口 (API)**：开发者可以在应用程序中使用的操作系统库。\n*   **跨平台开发**：从一套代码为多个平台和系统创建软件。\n\
  \n# 第 2 章\n\n## 移动应用市场中的 Xamarin 和 Microsoft\n\n### 引言\n\n在第一章中，你了解了今天移动应用市场的状况，以及用于构建移动设备应用程序的最流行的开发框架。本章将对本书的主题\
  \ Xamarin 提供更多详细信息，提供其历史以及自 Microsoft 收购以来的增长，并帮助你理解使用此技术开发应用所需的知识。你还将学习 Xamarin\
  \ 开发平台的基础知识，以及为什么它是你当今取得成功的绝佳选择。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n\n\n\n\n* Xamarin\
  \ 作为应用开发框架\n* 了解 Xamarin 和 Xamarin.Forms\n* 安装和配置开发工具\n\n### 目标\n\n通过完成本章，你将清晰地理解选择\
  \ Xamarin 作为移动设备应用程序开发技术的优势，具体来说，是它的 `Xamarin.Forms` 版本。你将学习需要使用哪些工具，以及如何安装和配置开发环境，你还将获得有关微软在下一代移动应用开发工具方面工作的一些提示。\n\
  \n### 作为应用开发框架的 Xamarin\n\n对于一家公司来说，为构建任何类型的应用程序选择合适的开发框架至关重要。它影响着预算、进度以及在利益相关者面前的信誉，还会影响参与该项目的开发者。实际上，并没有固定的规则，决定取决于几个因素。然而，选择开发框架最常用的方法之一是考虑开发者的现有技能、如果当前技能不足以时招聘新开发者的成本，以及根据项目进度对现有开发者进行培训的成本和时间。公司通常意识到，最佳选择是使用一个允许复用现有技能或仅需短期培训的开发框架。这可能会节省大量的时间和资金，而且在移动应用开发中尤为重要，特别是对于那些还没有应用的公司来说，这使得投资是一项风险。\n\
  \n### 使用微软技能进行移动应用开发\n\n对于开发者拥有深厚微软背景（如 `.NET` 技术和 `C#` 编程语言）的公司来说，选择 Xamarin 作为移动应用的开发平台是一个自然选择。这是本章第一个要点，即明确\
  \ Xamarin 的目标用户群：具有深厚微软背景的开发者和公司。通过 Xamarin，你可以使用 `C#` 作为编程语言构建移动应用，复用所有关于 `.NET`\
  \ 技术的现有技能和知识。为了理解你如何使用 `C#` 为 iOS 和 Android 创建应用程序，还需要额外的说明，因此，从 Xamarin 的简要历史开始是一个好主意。\n\
  \n### 作为一家公司的 Xamarin\n\n追溯到 2000 年 6 月，微软宣布了 `.NET Framework`（读作 dot net），这是一项开发者可以利用在\
  \ Windows 上构建新一代应用程序的现代技术。在下一章中，你将学习更多关于 `.NET Framework` 架构及其在过去几年中的演变，这些演变导致了单一的、跨平台的\
  \ `.NET`。现在，你只需要知道 `.NET Framework` 实现了以下内容：\n\n* 语言互操作性：`.NET` 家族中的编程语言可以使用用其他\
  \ `.NET` 语言编写的代码。\n* 一个涵盖最常用操作的大型复用代码库。\n* 许多场景下的自动内存管理。\n* 用于执行应用程序的安全沙箱环境。\n\n\
  如今，`.NET` 是一项开源、跨平台且跨设备的技术，但在 2017 年之前，它完全都是 Windows 的。由于这个原因，当 `.NET Framework`\
  \ 首次发布时，Ximian 公司的软件工程师 Miguel de Icaza 立即理解了它的潜力，并开始研究它是否可以在 Linux 上运行。这样的研究导致了\
  \ `Mono` 项目的开发，这是一个与 `.NET` 兼容的框架，可以在 Windows 外的系统上运行并允许开发者在这些系统上编写 `C#` 代码。\n\n\
  ### Mono 项目\n\n`Mono` (`https://www.mono-project.com`) 在开发 3 年后于 2004 年首次发布，在几年里，项目的开发和演进不仅关注支持\
  \ Linux 等桌面平台，还通过特定的派生框架 `MonoTouch` 和 `MonoDroid` 支持 iOS 和 Android 等移动平台。还创建了一个名为\
  \ `MonoDevelop` 的开源开发环境，允许开发者在 `Mono` 之上编写 `C#` 代码。在 `Mono` 开发进行的同时，2003 年，Miguel\
  \ de Icaza 创立的 Ximian 公司被 Novell 收购，项目继续演进并配合新的 `.NET Framework` 版本发布。2011 年，Novell\
  \ 被 Attachmate 收购，后者宣布了数百人的裁员，其中包括 Miguel de Icaza。因此，当他不得不离开时，他和另一位工程师 Nat Friedman\
  \ 创立了一家名为 Xamarin 的新公司，Nat 成为首席执行官。\n\n### 转向 Xamarin\n\nXamarin 负责继续 `Mono` 的开发和演变，并进行了一些相关的变化：`MonoTouch`\
  \ 和 `MonoDroid` 框架别变为 `Xamarin.iOS` 和 `Xamarin.Android`，`MonoDevelop` 演变为名为 `Xamarin\
  \ Studio` 的新开发环境，该环境也适用于 Mac 计算机。`Xamarin.iOS` 和 `Xamarin.Android` 是第一个编写原生应用程序的框架，但它们是独立工作的。这意味着开发者可以利用现有的\
  \ `C#` 和 `.NET` 技能，但他们仍然需要创建两个不同的项目并了解两个平台的 API。\n\n`Mono` 因为另一个原因也很重要：它是让用 Xamarin\
  \ 创建的应用程序能够在不同系统上运行的运行时系统。就像运行用 `WPF` 编写的 Windows 应用程序需要 `.NET Framework`，用 Xamarin\
  \ 创建的 iOS 和 Android 应用需要 `Mono`。\n\nXamarin 继续了其框架的演进，并在 2014 年首次发布了 `Xamarin.Forms`，这是一个允许从单一共享\
  \ `C#` 代码库目标于多个平台（当时仅限 iOS 和 Android）的新框架。`Xamarin.Forms` 的目标是提供对所有平台通用功能的统一访问，例如大多数用户界面控件和一些设备功能。在当时，`Xamarin.Forms`\
  \ 的代码库是有限的。没有声明式语言来创建用户界面，因此一切都在 `C#` 中完成，开发者在许多情况下必须进行原生开发。这不是一个效率很高的框架，可能许多开发者因为他们必须付出的努力而气馁。然而，`Xamarin.Forms`\
  \ 是第一个 `C#` 跨平台开发框架，兴趣迅速上升。在几个月内进行了许多改进；例如，他们在 2015 年引入了扩展应用程序标记语言 (`XAML`) 的基本版本来设计用户界面，并引入了多项新功能，使\
  \ `Xamarin.Forms` 成为一个非常有吸引力的选择。然而，Xamarin 的企业许可非常昂贵，尽管有了改进，但该技术的采用似乎停滞了。不过，情况很快发生了变化，正如后续章节所解释的那样。\n\
  \n### 移动应用生态系统中的微软\n\nXamarin 的开发者非常清楚，大多数 C# 开发者会更倾向于使用 `Visual Studio` 作为开发环境而不是\
  \ `Xamarin Studio`，至少在 Windows 上是这样。由于这个原因，他们为 `Visual Studio` 创建了扩展，可以在微软环境内部创建\
  \ Xamarin 项目。\n\n在谈论 Visual Studio 时，你经常会听到扩展（extensions）。扩展可以被看作是为开发环境添加插件（plug-in）。因此，在引用\
  \ Visual Studio 时，正确的术语是扩展而不是插件。\n\n\n\n\n\n此外，通过这些扩展，`Visual Studio` 包含了视觉工具，简化了在\
  \ `Xamarin.iOS` 和 `Xamarin.Android` 项目中设计用户界面的方式。因此，微软对 `Xamarin` 的潜力有非常清晰的认识。事实上，微软在\
  \ 2016 年 2 月宣布收购 `Xamarin` 公司，将他们构建的所有跨平台和原生开发技术引入内部，并聘佣了他们的工程师。这项巨大的投资让微软重回了移动应用生态系统，但采用了一种不同的方法。\n\
  \n### 微软对 Xamarin 投资的重要性\n\n正如你可能在第 1 章，移动应用开发的重要性 中回想的那样，微软作为移动操作系统和设备的提供商可能并不成功，但他们一直拥有世界上最强大的开发工具和环境，因此，他们能够将\
  \ `Visual Studio` 开发环境的力量和生产力与 `Xamarin` 框架相结合，从而为那些拥有微软技术栈现有技能并愿意为移动设备创建应用程序的开发者提供最佳体验。在过去的\
  \ 4 年里，微软在几个方向上令人不可思议地推动了 `Xamarin`。代码库不断改进和演进，直到变成了今天的模样，引入了数十种控件、可重用代码以及设备功能的访问，从而极大地提高了开发者的效率。他们开源了整个\
  \ `Xamarin` 平台（以及所有基于 `.NET` 的技术），将源代码移动到 `GitHub`，这不仅意味着接受社区的贡献，还让社区参与到产品的增长中。\n\
  \n### 使用微软工具和服务提高生产力\n\n基于为 Windows Phone 和 Windows 桌面版开发应用时提供一流工具所积累的经验，微软可以在 `Xamarin`\
  \ 和 `Xamarin.Forms` 中扩展集成在开发环境中的强大生产力工具。不仅限于此，始终考虑到新的跨平台方法，微软还构建了 `Visual Studio`\
  \ for Mac，并于 2017 年首次发布。这是 `Xamarin Studio` 的自然演进，但具有 `Visual Studio` 所有为人知的强大功能，开发者可以在\
  \ Mac 计算机首次使用它们。微软还围绕 `Xamarin` 创建了产品和服务生态系统，例如作为微软云平台 `Azure` 部分的应用生命周期管理工具，允许开发者快速实现推送通知、数据同步、授权以及分析等服务，这些有助于决策者根据对应用程序使用的分析来驱动业务和投资。\n\
  \n通过如此大力地推动 `Xamarin`，微软还能够增加人们对其移动服务的信任。今天，通过 `Microsoft Visual Studio 2022`，开发者拥有了最强大的开发环境，可以使用\
  \ `Xamarin` 为移动设备构建应用程序。现在你已经知道 `Xamarin` 的来源了，你需要了解更多关于技术方面的知识，这是下一节的主题。\n\n###\
  \ 理解 Xamarin 和 Xamarin.Forms\n\n`Xamarin` 是一种开发技术，它让精通 `C#` 和微软技术栈的开发者能够为多个操作系统构建应用程序。更具体地说，`Xamarin`\
  \ 归类了以下开发平台：\n\n*   `Xamarin.Android`：一组 `.NET` 库和工具，允许你在 Android 设备上运行 `C#` 代码。这是可能的，因为\
  \ `Xamarin.Android` 在后台将在 `C#` 中完成的所有工作翻译成等等的 `Java` 代码，并调用相应的 `Java` 和 `Google`\
  \ 工具来创建应用程序二进制文件。结果是，`Xamarin.Android` 需要 `Java` 软件开发包 (`SDK`）以及如 `Android SDK Manager`\
  \ 和 `Android Device Manager` 等工具。在本章稍后的部分，你将看到如何正确配置环境并安装必要的工具。\n\n*   `Xamarin.iOS`：一组\
  \ `.NET` 库和工具，允许你在 iPhone 和 iPad 设备上运行 `C#` 代码。在后台，`Xamarin.iOS` 将在 `C#` 中完成的所有工作翻译成等等的\
  \ `Objective C` 代码，并调用 `Apple` 开发者工具来创建应用程序二进制文件。对于 Android，下一节将解释如何正确设置你的开发环境以目标\
  \ `iOS`。\n\n*   `Xamarin.Mac`：一组 `.NET` 库和工具，允许你在 macOS 机器上运行 `C#` 代码，构建桌面应用程序。像\
  \ `Xamarin.iOS` 一样，它将完成的所有工作翻译成等等的 `Objective C` 代码，并调用 `Apple` 开发者工具来创建应用程序二进制文件。\n\
  \n*   `Xamarin.Forms`：一个允许从单一共享代码库目标多个平台的库。在后台，`Xamarin.Forms` 同时调用 `Xamarin.Android`\
  \ 和 `Xamarin.iOS`，然后这两个平台负责调用相应的原生工具来创建应用程序二进制文件的工作。\n\n`Xamarin.Android` 和 `Xamarin.iOS`\
  \ 能够访问其目标操作系统的原生 API，而 `Xamarin.Forms` 则需要通过它们来实现。这也是为什么你经常听到开发者在提到 `Xamarin.Android`\
  \ 和 `Xamarin.iOS` 时称为 `Xamarin native` 的原因。\n\n### Xamarin.Forms 的优势\n\n`Xamarin`\
  \ 原生平台要求你详细了解操作系统的 API。此外，你仍然需要两个项目：一个用于 Android，一个用于 iOS。你可以在两者之间共享一些逻辑，但所有的用户界面和对设备功能的访问都需要单独的工作和努力。使用\
  \ `Xamarin.Forms`，你将拥有以下优势：\n\n*   你并不需要详细了解原生 API（尽管总是建议这样做），因为你拥有在所有平台通用的代码。\n\
  \n*   你可以从一个代码库目标多个平台。\n\n*   `Xamarin.Forms` 还可以从同一个代码库目标通用 Windows 平台（UWP），允许你的代码运行在\
  \ Windows 10 上。\n\n*   你只需要编写、调试和维护一次代码，而不是两次，减少了工作。\n\n*   你仍然会发布两个不同的应用程序，但你使用\
  \ `Xamarin.Android` 和 `Xamarin.iOS` 时也会这样做。\n\nWindows 上的 `Visual Studio` 不支持 `Xamarin.Mac`，因此不再进一步讨论。在第\
  \ 5 章，使用 Xamarin 和 Xamarin.Forms 构建移动应用 中，你将了解使用 `Xamarin.Android` 和 `Xamarin.iOS`\
  \ 创建应用程序的工作原理，`Xamarin.Forms` 将得到更深入的讨论。\n\n### 关于 .NET MAUI 的提示\n\n\n\n\n微软刚刚发布了用于跨平台方法开发应用程序的下一代框架。该框架被称为\
  \ `.NET MAUI`，代表多平台应用用户界面（Multiplatform Application User Interface），旨在与 `.NET 6`\
  \ 配合使用。此外，`.NET 6` 将不同技术（如 `Xamarin`）的 API 统一到了一个 `.NET` 代码库中，并取代 `Mono` 作为运行移动应用所需的运行时平台。`.NET\
  \ MAUI` 是一个全跨平台开发框架，目标涵盖移动设备以及桌面系统。它可以被视为 `Xamarin.Forms` 的自然继任者和替代者，你将在适当的地方学习更多细节。微软意识到全球有成千上万的开发者一直在使用\
  \ `Xamarin.Forms` 构建对他们业务至关重要的应用程序，因此他们设计 `.NET MAUI` 的架构允许保持相同的工作方法论、相同的代码语法、相同的工具以及相同的\
  \ `Xamarin.Forms` 技能。虽然肯定会有一些变化，但一旦你熟悉了 `Xamarin.Forms`，这些变化完全是可以接受的。此外，项目结构将变得简单得多，应用性能也将零成本地得到显著提升。因此，即使\
  \ `Xamarin.Forms` 在未来几年内逐渐被 `.NET MAUI` 代替，这对你来说也可以是一个机会。事实上，作为一名 Xamarin 的求职者，今天学习\
  \ `Xamarin` 和 `Xamarin.Forms` 更加重要，因为你将能够通过从本书获得的技能立即准备好使用 `.NET MAUI`，并能够处理那些公司不会立即迁移但仍需随时间维护的现有\
  \ `Xamarin.Forms` 项目。\n\n提示：微软将包含一个迁移助手（Migration Assistant）工具，其目标是简化从 `Xamarin.Forms`\
  \ 项目迁移到 `.NET MAUI` 的过程。然而，请记住，公司决定对其关键应用程序进行此类重要更新之前通常需要时间。这背后有几个原因，但从技术和开发的角度来看，你可能希望考虑有时等几周时间看看是否有\
  \ Bug 被报告并解决，而且第三方提供的组件和库可能无法与新技术同时发布。\n\n总的来说，你不应该太害怕技术的变革和淘汰，因为这是你在信息技术工作中的一部分。技术在演进，新工具层出不穷，而作为开发者，你必须学会应对这些变化。始终尝试将此视为机会，例如，学习如何在他人之前、在你的竞争对手之前帮助公司迁移到新平台。\n\
  \n## 安装和配置开发工具\n\n使用 `Xamarin` 构建移动设备应用需要一些前提条件。首先，如果你想为 `iOS` 构建应用，你需要一台 `Mac`。这是苹果策略要求的，该策略规定\
  \ `iOS` 的应用二进制文件只能在 `macOS` 上生成，无论使用什么开发技术。如果你不想（或不能）购买 `Mac` 电脑但仍想针对 `iOS`，你可以在线租用\
  \ `Mac`。像 `MacInCloud` ([`www.macincloud.com`](https://www.macincloud.com)) 等服务允许你租用预装了所有开发工具的\
  \ `Mac` 机器，让你准备就绪。这些是付费服务，请确保仅在需要时选择合适的方案。\n\n在线租赁 `Mac` 设备的限制是，你无法在物理 `iPhone`\
  \ 或 `iPad` 上测试你的应用（这些设备需要连接到 `Mac`）。然而，正如你将在下一章看到的，你可以在设备模拟器上测试应用程序。\n\n在考虑这些通用事项之后，让我们详细讨论\
  \ Windows 和 `macOS` 所需系统配置。\n\n### Xamarin 的系统要求\n\n本节描述了安装使用 `Xamarin` 构建应用所需的开发工具的最低系统要求，这些要求也是成功完成书中所有章节的基础。为了方便起见，我们列出了\
  \ Windows 和 `macOS` 的系统要求，但本书基于 Windows 及其配置，因此对于 `macOS`，你将获得的关于生成应用二进制文件所需的信息。这是因为大多数具有微软技术栈背景的公司必然已经使用\
  \ Windows 多年，因此这也是构建移动应用的首选系统。\n\n### Windows 系统要求\n\n官方文档 ([https://docs.microsoft.com/en-us/xamarin/cross-platform/get-started/requirements))\
  \ 指出 `Windows 7` 和 `Visual Studio 2017` 是最低软件要求，而构建针对 `UWP`的应用则需要 `Windows 10`。然而，根据多年使用\
  \ `Xamarin` 的经验，推荐的系统要求如下：\n\n* 一台至少拥有 8 GB 内存的 PC。这在你使用设备模拟器时会产生差异，并有助于保持机器运行足够快。\n\
  * 使用 `Windows 10` 作为操作系统，不仅是为了从 `Xamarin.Forms` 目标 `UWP`，还因为它是最新、因此最强大且经过优化的系统。\n\
  * `Microsoft Visual Studio 2019` 或 `2022`。后者是目前最新的版本，微软提供了一个免费的社区版（Community edition），你可以免费使用。\n\
  \n`Visual Studio` 安装程序将安装所有必要的库和软件开发包，包括 Java 和 Google 的包。这将在下一节中说明。\n\n在下一节中，你将通过\
  \ `Visual Studio 2022` 的安装和配置过程，以便准备好环境。\n\n### macOS 系统要求\n\n在 `Mac` 机器上，所有开发工具在仅有\
  \ 4 GB 内存的情况下运行，但性能将无法接受。以下是推荐要求的列表：\n\n* 一台至少拥有 8 GB 内存的 `Mac` 电脑。与 Windows 一样，这有助于保持机器运行足够快。\n\
  * `macOS 10.14` (Mojave) 或更高版本。\n* `Microsoft Visual Studio for Mac 2019`。在写作期间这是目前的最新版本，但微软很快将发布\
  \ 2022 版本。也有免费的社区版供使用。\n* `Xcode 10` 或更高版本。`Xcode` 是苹果的开发环境，它包含了 `Xamarin.iOS` 在后台调用的开发工具。你可以从\
  \ `Mac` 的 App Store 免费下载。\n\n为了在你的电脑上安装 `Visual Studio for Mac 2019`，请访问 `Visual\
  \ Studio for Mac` 官方页面 ([https://visualstudio.microsoft.com/vs/mac/)) 并按照步骤下载、安装和配置开发环境。\n\
  \n### Android 和 iOS 设备\n\n无论你在 Windows 还是 `macOS` 上工作，开发工具都附带设备模拟器，你可以使用它们来测试应用程序。设备模拟器是一个安装了特定版本操作系统的虚拟机，并被配置为模拟特定的硬件配置。\n\
  \n\n\n模拟器随后允许你可以在无需物理设备的情况下为 iOS 和 Android 构建应用，但这并非理想状态。用户、客户和利益相关者会在物理设备上运行你的应用，而这正是你应该测试代码的地方。此外，如果你需要向客户甚至你的雇主展示工作成果，在模拟器上演示是不够专业的。显然，你无法购买数百种不同的设备，但一台\
  \ Android 设备和一台 iPhone（如果你的目标平台是 iOS 的话）就足够了。因此，设备模拟器可以成为你在这不同操作系统版本和硬件配置上测试代码的良好伙伴，但至少一个物理设备应该是你的硬性要求。\n\
  \n### 安装和配置 Microsoft Visual Studio\n\nMicrosoft Visual Studio 是用于在 Windows 工作站上构建移动应用程序的开发环境。它有多个版本：企业版（Enterprise）、专业版（Professional）和社区版（Community）。企业版和专业版都是付费版本，通常通过适当的许可提供。如果你加入了一公司，可能会通过批量许可获得其中一种。社区版是完全免费的。它包含的工具和服务较少，但它包含了你使用\
  \ Xamarin 构建移动应用所需的所有内容，并且可以用于商业。\n\n假设你将使用社区版，请访问 Visual Studio 官方页面 `https://visualstudio.microsoft.com/vs/`。点击\
  \ `Download Visual Studio` 按钮并选择 `Community 2022`选项。这将将在磁盘上下载 Visual Studio 安装程序，你需要启动它。\n\
  \n### 选择工作负载\n\n当 Visual Studio 安装程序启动时，它会提供几个所谓的工作负载（workloads）。每个工作负载都包含针对特定开发领域（如桌面、Web、云和移动端）所需的工具。找到桌面和移动工作负载（参见图\
  \ 1.2），并确保选中了 `.NET desktop development`、`Universal Windows Platform development`\
  \ 以及 `Mobile development with .NET`。后者还包含了必要的 Java 和 Google 支持工具。\n\n![](img/Figure-2.1.jpg)\n\
  \n**图 2.1:** 选择适当的工作负载\n\n**实际上，只有当你计划让 Xamarin.Forms 项目针对 Windows 10 时，才需要选择 Universal\
  \ Windows Platform development。然而，在书的后面，你将看到完整的项目结构，包括 UWP 项目，因此该工作负载对于与书籍内容完全一致是必要的。**\n\
  \n### 检查单个组件\n\n当你选择工作负载时，Visual Studio 安装程序已经确保了必要的组件将被安装，但确保你确实拥有所需的一切仍然非常重要。为此，点击窗口顶部的\
  \ `Individual components` 选项卡（参见图 1.2），然后向下滚动列表直到看到两个组：Emulators（模拟器）以及 SDKs, libraries,\
  \ and frameworks（SDK、库和框架），如图 2.2 所示：\n\n![](img/Figure-2.2.jpg)\n\n**图 2.2:** 检查单个组件\n\
  \n在 Emulators 下，确保两个选项都已勾选。在 SDKs, libraries, and frameworks 下，确保选中了两个 `Android\
  \ SDK setup` 选项。准备就绪后，点击 `Close`。此时，点击 `Install` 按钮并等待安装完成。在下一章中，你将开始在实践中使用 Visual\
  \ Studio。\n\n### 为 Android 设备配置开发者模式\n\n默认情况下，Android 物理设备未启用支持应用开发，因此你需要启用所谓的开发者模式。这可以通过在设备的系统信息中连续点击\
  \ 7 次操作系统版本号来实现。在 Android 上，操作系统信息的位置并不总是同一个地方。图 3.2 显示了我的华为 P10 lite 上的 `Build\
  \ number` 版本，位于 `About phone` 菜单下。\n\n![](img/Figure-2.3.jpg)\n\n**图 2.3:** 使用操作系统版本号启用开发者模式\n\
  \n在你点击 7 次版本号后，会有消息提示开发者模式已启用。此操作将在系统设置下开启一个名为 `Developer` 的新菜单。打开此新菜单并确保启用 USB\
  \ 调试选项。\n\n# macOS macOS 配置\n\n正如你在本节开头学到的，根据 Apple 的策略，需要 Mac 来构建 iOS 的应用程序二进制文件。如果你打算针对\
  \ iOS，并且想坚持本书，你需要在 Mac 上进行一些配置步骤。幸运的是，Visual Studio 2019 简化了 Mac 为 Xamarin 开发配置的方式，因此许多以前需要的手动步骤现在不再需要。在你的\
  \ Mac 上，打开 App Store 应用并搜索 Xcode。图 4.2 显示了其外观如下：\n\n![](img/Figure-2.4.jpg)\n\n\
  **图 2.4:** 在 Mac 上查找并安装 Xcode\n\n假设你还没有 Xcode，你会看到一个名为 `Install` 的按钮而不是 `Open`。点击该按钮并等待\
  \ Xcode 安装。请注意这可能需要一些时间。安装完成后，启动 Xcode 并等待其初始化。\n\n### 总结\n\n在选择移动应用开发框架时，对于已经拥有微软技术栈（如\
  \ C# 语言和作为开发环境的 Visual Studio）技能的开发者来说，Xamarin 是一个自然选择。原因是 Xamarin 使得编写 C# 代码并生成原生\
  \ iOS、Android 和 UWP 应用程序成为可能。具体来说，通过 Xamarin.Forms，你可以编写一次代码并从单一的共享代码库针对所有平台。本章为你提供了关于\
  \ Xamarin 的更详细的概述，并帮助你安装了 Visual Studio 2022 开始开发，但在你上手编写代码之前，你需要了解 .NET 技术是如何运作的。\n\
  \n### 问题\n\n1. **什么是 Mono？**\n   Mono 是一个跨平台框架，使其可以在 Linux 和移动系统上编写和运行 C# 代码。\n\n\
  2. **什么是 Xamarin.Forms？**\n   Xamarin.Forms 是一个开发平台，允许从单一的共享代码库针对多个系统（如 iOS、Android\
  \ 和 UWP）。\n\n## 知识点\n\n* 你可以使用免费的 Visual Studio 2019 社区版使用 Xamarin 构建应用，即使用于商业目的。\n\
  * 你可以在 Windows 和 macOS 上开发应用。\n* 构建 iOS 应用需要 Macget。\n* 可以通过 Android 设备设置中点击 7 次操作系统版本号来启用开发者模式。\n\
  \n\n\n\n\n### 引言\n\n作为一名使用 Xamarin 的开发者，你需要了解为应用程序提供支持的技术以及你用于编写、调试和编译代码的工具。Microsoft\
  \ .NET 是一项技术，它包含了为桌面、Web、移动和云端构建现代应用程序的执行环境和工具。.NET 是一项非常强大又复杂的技术；在本章中，你将学习其架构的基础知识。你还将对\
  \ Microsoft Visual Studio 进行实战性的介绍，这是你用于创建 Xamarin 项目的开发环境。在本章中，你还将学习贯穿于本书其余部分的重要概念，并接触对你开发者生涯中始终非常重要的术语。\n\
  \n本章讨论了适用于所有 .NET 平台以及各种应用程序的通用概念、工具、规则和实践。目前，对你来说，理解 .NET 和 Visual Studio 是如何工作的，比获取目前尚无用处的\
  \ Xamarin 特定信息更重要。你在这里学到的通用概念将从[第 5 章：使用 Xamarin 和 Xamarin.Forms 构建移动应用]开始有针对特定的解释。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   介绍 .NET\n*   .NET 6：统一 .NET\n*   使用 Visual Studio\
  \ 构建应用程序\n*   在 Visual Studio 2019 IDE 中工作\n*   编译、运行和调试代码\n\n### 目标\n\n完成本章后，你将掌握\
  \ .NET 开发技术的基础知识，并理解为什么在处理 Xamarin 之前拥有这些知识是必要的，以及 .NET 架构中每个主要组件的作用。你还将开始接触 Microsoft\
  \ Visual Studio，这是用于基于 .NET 应用程序的集成开发环境（`IDE`）。具体来说，你将学习如何创建项目、调试和运行代码，以及如何使用 IDE\
  \ 中常用的工具和窗口。\n\n集成开发环境是一种将所有必要的开发工具包含在一个地方的软件，例如代码编辑器、调试器、启动编译器的自动化工具等。`IDE` 缩写在书中经常被用来指代\
  \ Visual Studio 以便快速引用。\n\n### 介绍 .NET\n\n通常来说，应用程序需要一个提供服务、工具和库的执行环境。多年来，Microsoft\
  \ .NET Framework 一一直是使用 .NET 语言（C#、F# 和 Visual Basic）编写的应用程序的首选执行环境和开发技术。.NET 项非常强大的技术，但它有两个重要的局限性：它只能在\
  \ Windows 上运行，并且不支持移动开发。2015 年，微软宣布了一个名为 .NET Core 的新平台，它也可以在 macOS、Linux 和移动设备上运行。这两者已经并行运行多年，但在两者之间共享所有\
  \ API 并不总是容易或可行的。因此，微软最近发布了 .NET 6，这是一个从共享代码库目标所有系统的统一 .NET 平台。理解 .NET Framework\
  \ 对你来说至关重要，即使在书中没有真正使用它，因为它是所有 C# 和 .NET 开发（包括 Xamarin）的 Foundation。在本章中，你将首先查看\
  \ .NET Framework 以及首次带它进入 .NET Core 最终进入 .NET 6 的路径。\n\n### 介绍适用于 Windows 的 .NET\
  \ framework\n\n.NET Framework 包含两个主要领域：运行应用程序的执行环境，以及开发者用于构建 Windows 和 Web 应用程序的带有库的工具。目前可用的最新版本是\
  \ 4.8，关于版本的更多讨论将在本章稍后部分进行。\n\n作为应用程序的执行环境，.NET Framework 位于 Windows 和你的应用程序之间。作为一种开发技术，.NET\
  \ Framework 4.8 包含了免费提供的库和命令行工具。理论上，你可以使用 Windows 记事本编写最复杂的 .NET 应用程序，并使用 .NET 工具进行编译。这显然不是理想的，因此微软提供了\
  \ Visual Studio 来构建用于 .NET Framework 的应用程序，你将在本章的第二部分遇到这个强大的环境。C#、Visual Basic 和\
  \ F# 是开发者可以使用来构建 .NET 应用程序的语言。C++ 的变体也可以用于构建 .NET 应用程序，但通常这种语言被认为有更广泛用途。无论你使用什么编程语言，.NET\
  \ Framework 都允许你构建以下类型的应用程序：\n\n*   使用 ASP.NET 的 Web 应用程序。\n*   使用 Windows Presentation\
  \ Foundation（`WPF`）的 Windows 桌面应用程序。\n*   使用 Windows Forms 的 Windows 桌面应用程序。\n*\
  \   用于 Windows Communication Foundation（`WCF`）和 Web API 进行数据交换的网络服务。\n\n其他类型的应用程序可以使用\
  \ .NET Core 进行开发。\n\n微软仍然支持 Windows Forms，但它是一个过时的平台，应仅用于维护现有程序。\n\n### 在磁盘上定位 .NET\
  \ framework\n\n通常，你不需要直接与 .NET Framework 工具交互，但有时可能是必要的，因此对你来说，知道在哪里找到它很重要。在磁盘上，.NET\
  \ Framework 4.8 可以在 `C:\\Windows\\Microsoft.NET\\Framework\\4.0.30319` 文件夹中找到。你可以通过\
  \ Windows 资源管理器快速验证，此类文件夹包含许多代表基类库（Base Class Library）的 `.dll` 文件以及许多命令行工具，例如 C#\
  \ 编译器和 `MSBuild.exe`（能够构建整个解决方案的工具）。在后台，当你将代码编译为二进制文件时，Visual Studio 会调用 MSBuild。通常情况下，Visual\
  \ Studio 会为你完成所有必要的工作，但知道工具和库所在地仍然是重要的。\n\n### .NET framework 架构\n\n.NET Framework\
  \ 的不同组件作为 Windows 和你的应用程序之间的层级工作，如图 3.1 所示：\n\n![](img/Figure-3.1.jpg)\n\n图 3.1：\
  \ .NET Framework 的架构\n\n在 Windows 之上，第一层是通用语言运行时（`CLR`）。将在后续章节中详细讨论，但简单来说，它代表了应用程序的执行环境。在\
  \ CLR 之上，你找到了基类库（`BCL`）。它提供了可以在代码中利用的所有系统和可重用 .NET 对象。BCL 还作为大多数 .NET 开发平台（如 Windows\
  \ Forms、WPF 和 ASP.NET）的基础设施，这些是这种分层架构的最后级别。\n\n### 通用语言运行时 (CLR)\n\n.NET 的最大优势之一是，Visual\
  \ Basic、C# 和 F# 等语言共享相同的基础设施。这由 CLR 表示，它负责：\n\n*   管理应用程序从启动到关闭的执行过程。\n*   管理应用程序使用的内存和资源。\n\
  *   管理对资源的访问。\n*   管理安全。\n\n\n\n\n上述列表中反复出现的“管理”（managing）一词并非偶然。事实上，在谈论 .NET 时，你经常会听到“托管”（managed）这个词，指的是`managed\
  \ environment”（托管环境）和`managed code”（托管代码）。为了更好地理解，让我们考虑在 .NET 出现之前开发者是如何为 Windows\
  \ 构建应用程序的。开发者完全负责管理应用程序访问的`managing system`（系统资源）、内存分配、文件等，其主要原因是应用程序可以直接访问系统。如果处理不当，这可能会产生危险的后果。.NET\
  \ 提供的托管环境确保应用程序通过 `CLR` 与 `.NET Framework` 通信，而不是直接与系统通信。`CLR` 还会代表应用程序管理内存，例如释放不再需要的对象。总来说，`CLR`\
  \ 负责应用程序所需的大部分系统资源，并且只有在应用程序被完全信任时，它才会授予对系统资源的访问权限。显然，仍然存在开发者需要直接利用系统资源的情况，因此 .NET\
  \ 使得通过所谓的 `P/Invoke`（平台调用 Platform Invoke）访问 Windows API 成为可能。`P/Invoke` 允许编写所谓的`unmanaged\
  \ code`未托管代码，这种技术应该在 .NET 未为特定任务提供 API 时才使用。这也是为什么本书中没有讨论 `P/Invoke` 的原因。\n\n###\
  \ 编译器与程序集概念\n\n你通过编程语言编写源代码来创建应用程序，但操作系统无法直接理解你所写的内容。出于这个原因，开发环境包含了编译器。编译器是一种将源代码翻译成操作系统可以理解的机器语言的软件。例如，.NET\
  \ 自带有几个编译器：`C#` 编译器、`Visual Basic` 编译器、`F#` 编译器；你可以使用 `C#`、`Visual Basic` 或 `F#`\
  \ 编程语言编写代码，然后相关的编译器将源代码翻译成系统可以理解并运行的二进制文件，这同样适用于移动系统。\n\n关于编译过程以及开发环境调用的用于生成可执行文件的额外工具（如链接器/linkers），还有很多内容要说。关于\
  \ Xamarin，你将在接下来的章节中获得所有信息。关于其他开发平台，在书中无法解释所有内容，这也会超出了本书的讨论范围，因此最好的办法是访问微软官方文档（`https://docs.microsoft.com/`）并在相应的平台文档中阅读其工作原理。\n\
  \n移动应用程序与桌面或 Web 应用程序显然具有不同的架构，因此编译过程的工作略有不同。然而，.NET 中的一些通用概念对你来说很重要，它们也适用于 Xamarin。通常情况下，程序员使用高级编程语言编写代码，然后由编译器对源代码进行解析和分析。这些编译器负责生成操作系统可以运行的二进制文件。二进制文件（简称为\
  \ binaries）可以是可执行文件或动态链接库（`.dll`）。二进制文件通常需要一个运行时（runtime），即一组包含应用程序所需所有类型的库。关键点在于，用\
  \ `Visual Basic 6` 编写的应用程序需要它们自己的运行时，用 `C++` 编写的应用程序需要另一个运行时，而用 `Java` 编写的应用程序则需要另一个运行时。.NET\
  \ 的目标之一是简化针对不同语言编写的源代码的编译过程，以便所有 .NET 语言的编译器都能生成在 `CLR` 上运行的二进制文件。\n\n### .NET 中的程序集\n\
  \n无论你选择哪种语言编写代码，在 .NET 中，所有编译器都会生成一个程序集（assembly）。你可以将程序集看作一个包含 `CIL` 代码和元数据的二进制文件。`CIL`\
  \ 是 Common Intermediate Language（公共中间语言）的缩写，是一种进化的、面向对象的程序集汇语言。`CIL` 指令与 CPU 无关，关键点是，用任何\
  \ .NET 语言编写的代码段都会产生相同的 `CIL` 代码。程序集的另一个部分是元数据。它包括关于你代码中定义的类型和成员的信息、数字签名以及对外部定义的其他类型的引用。这有助于\
  \ `CLR` 预先识别应用程序的需求。这在 `Mono` 中也发生过，直到 `.NET 6` 将所有平台统一在同一个伞下。因此，尽管带有 `.exe` 或 `.dll`\
  \ 扩展名，.NET 程序集并不是一个由操作系统立即运行的可执行文件。当你启动一个 .NET 可执行文件时，Windows 知道它是一个程序集并调用 `just-in-time`（`JIT`）编译器。`JIT`\
  \ 负责分析程序集的元数据、封装信息，并将 `CIL` 代码即时编译成操作系统可以解释的机器码。\n\n### 基类库\n\n.NET Framework 的另一个重要构建块是基类库\
  \ `Base Class Library`（BCL）。BCL 实现了成千上万个可重用的对象和 API，你可以在代码中使用它们，并且它们适用于所有 .NET 语言以及你用于构建应用程序的大多数开发平台，例如（但不限于）`Windows\
  \ Forms`、`WPF`、`ASP.NET` 和 `Xamarin`。利用 BCL 中定义的类型允许你通过编写托管代码执行大量的编程任务。类型将在 `[第\
  \ 4 章：C# 编程语言]` 中进一步讨论，但简单来说，它们表示对象的一种。BCL 将类型分组在命名空间中，每个命名空间的名称通常指的是技术。例如，`System.Windows`\
  \ 命名空间暴露了类型和其他命名空间以支持使用 `Windows Presentation Foundation`（`WPF`）开发应用程序，而 `System.Web`\
  \ 命名空间暴露了类型和其他命名空间以支持使用 `ASP.NET` 开发 Web 应用程序。你可以轻松识别 BCL 定义的命名空间，因为它们以 `System`\
  \ 为前。\n\n### 从 .NET Framework 到 .NET Core\n\n在之前的版本中，.NET Framework 是构建各种应用程序的独特环境，包括桌面应用程序、Web\
  \ 应用程序以及带有 `.NET Compact Framework` 等版本的移动应用。在过去的几年里，微软采取了一些进步：他们为桌面应用程序保留了完整的 .NET\
  \ Framework，并创建了 `.NET Core`（`https://github.com/microsoft/dotnet`）。这是一个开源、通用的且模块化的\
  \ .NET Framework 子集，设计用于跨平台迁移，目标是最大化代码复用和共享。.NET Core 是模块化的，因为它以较小的程序集包形式提供，且大部分没有依赖，而不是包含大部分核心功能的大型程序集。这一点很重要两个原因：微软可以使用敏捷开发模型更新\
  \ .NET Core，而你作为开发者可以简单地为应用程序和库选择所需的功能组件。与其在你拥有现有 `Visual Studio` 经验时习惯的那样添加程序集引用，在为\
  \ .NET Core 开发时，你通过 `NuGet 包管理器` 获取包，它是 `Visual Studio 2019` 中的一个集成工具，可以轻松地在项目中包含库。\n\
  \n### .NET Core 的优势\n\n\n\n\n.NET Core 的第一个优势是它是跨平台的。这意味着它不仅可以在 Windows 上运行，还可以在\
  \ macOS 和 Linux 及其派生发行版上运行。对于特微软来说，这是一场真正的革命，它让具有微软技术栈经验的开发者能够在不同的系统上编写并部署 C# 代码。通过\
  \ .NET Core，你可以创建以下应用程序：\n\n*   Windows 10 通用应用\n*   使用 `ASP.NET Core` 的跨平台 Web\
  \ 应用\n*   可移动类库 (Portable class libraries)\n*   可移动控制台应用程序 (Portable Console applications)\n\
  \n在架构方面，.NET Core 包含两个主要组件：\n\n*   `CoreCLR`：一个小型的可移植运行时（Runtime），它包含了垃圾回收器和即时编译器（`RyuJIT`），但不包含应用程序域或代码访问安全等功能。该运行时通过\
  \ `NuGet` 交付，目前由 `Microsoft.CoreCLR` 包表示。\n*   基类库（Base class libraries）：它们提供了几乎与完整版\
  \ .NET Framework BCL 相同的代码，但这些代码经过了重构，消除了依赖项，以便更容易启用较小的库集。\n\n使用 .NET Core 构建的应用程序运行在隔离环境中。Visual\
  \ Studio 将 `CoreCLR`、应用程序包以及你的应用程序所使用的库封装成一个本地包。通过这种方法，你的应用程序将不受机器范围内完整版 .NET Framework\
  \ 版本的影响，而且最重要的是，它们对操作系统没有依赖关系。由于 .NET Core 可以在 Windows、Mac OSX 和 Linux 上运行，它为每个操作系统暴露的\
  \ API 提供了共享的实现，因此无论应用程序运行在什么平台上，你都可以编写相同的代码。这些 API 的共享实现必须遵循 .NET Standard（`https://docs.microsoft.com/en-us/dotnet/standard/net-standard`），这是一项规定了\
  \ API 必须如何实现才能在多个平台上可用的正式规范。*图 3.2* 提供了 .NET Core 5 架构的表示图：\n\n![](img/Figure-3.2.jpg)\n\
  \n**图 3.2：** .NET Core 架构\n\n现在的重点在于有两个主要平台——.NET Framework 和 .NET Core，再加上像 Xamarin\
  \ 这样的额外开发技术，它们仍然可以使用 .NET 语言（`C#` 和 `F#`）以及大部分 .NET API，但使用的是不同的运行时（在这种情况下是 `Mono`）。这就是\
  \ .NET 6 出现并统一它们的所在。\n\n### .NET 6：统一的 .NET\n\n.NET Framework、.NET Core 和 Xamarin\
  \ 共享多个 API、库、工具和编程语言，但它们针对不同的场景。对于 Xamarin 来说，底层运行时也是不同的，因为它基于 `Mono`。考虑到这一点，微软决定将所有这些平台统一为一个\
  \ .NET 技术，使用同一一套 API、库和工具。这种统一被称为 .NET。将所有平台带到一个 .NET 下下的工作始于 2020 年 10 月发布的 .NET\
  \ 5，其主要目标是让 Xamarin 使用 .NET Core 代替 `Mono`，并让两者共有一套代码库。对于微软来说，下一步是将 .NET Framework\
  \ 和 .NET 5 统一为一套共享的 API，命名为 .NET 6，并于 2021 年 11 月发布。*图 3.3* 显示了 .NET 6 架构的样子：\n\n\
  ![](img/Figure-3.3.jpg)\n\n**图 3.3：** .NET 6 架构\n\n如所示，所有高级开发平台现在都依赖相同的运行时、库、API\
  \ 和工具。显然，.NET 6 提高了那些只需处理单一平台的开发者的生产力，它还提供了通用的性能改进，并与 Microsoft Visual Studio 完美集成，以提供最好的开发体验。谈到\
  \ Visual Studio，现在是时候发现如何使用这个开发环境构建应用程序，以及在处理 Xamarin 和 Xamarin.Forms 时将用到的大多数功能了。\n\
  \n### 使用 Visual Studio 构建应用程序\n\n你使用 Microsoft Visual Studio IDE 通过 `C#` 开发应用程序。最新可用版本是\
  \ 2022，于 2021 年 11 月发布，但使用 Xamarin 构建应用的最低推荐版本是 2019。本章中的插图基于 Visual Studio 2019，但它们在\
  \ Visual Studio 2022 中看起来也一样。本节的目标是提供使用 Xamarin 所需工具的必要知识。值得提到，Visual Studio 是一个复杂的环境，因此本章只能对你将在\
  \ Visual Studio 内部执行的最常见任务以及你需要的最相关的工具提供概述。简而言之，你将熟悉这个 IDE。本章描述的工具适用于所有 .NET 开发平台。特定于\
  \ Xamarin.Forms 的工具将在后续章节中适当适当介绍。此时，你可以启动 Visual Studio。在 Windows 的开始菜单中，你可以找到一个名为\
  \ `Visual Studio 2019`（如果你安装的是该版本，则为 `2022`）的快捷方式。点击它来启动开发环境。\n\n### 使用微软账户登录\n\n\
  第一次启动 Visual Studio 时，系统会要求用微软账户登录。这通常是一个基于微软某个提供商（如 Hotmail、Live、Outlook）的电子邮件地址，但也可以是来自其他提供商的地址并作为微软账户关联到\
  \ Outlook。*图 3.4* 展示了这一点：\n\n![](img/Figure-3.4.jpg)\n\n**图 3.4：** 登录 Visual Studio\n\
  \n虽然不是强制性的，但强烈建议你登录 Visual Studio，原因如下：\n\n*   启用了跨机器的设置同步。\n*   Visual Studio 社区版将永久解锁。\n\
  *   IDE 将自动登录所有微软服务。\n*   如果是从 MSDN 订阅下载的，Visual Studio 将完全解锁。\n\n点击 `Sign in` 并输入你的电子邮件；然后点击\
  \ `Next`。此时，在需要时输入密码并点击 `Sign In`。Visual Studio 现在将完成关联服务的登录，并显示启动窗口。\n\n### 同步设置\n\
  \n将微软账户连接到 Visual Studio 的优势之一是启用名为“同步设置”的功能。正如你在书中发现的，IDE 是高度自定义的，你可能希望在所有安装了 Visual\
  \ Studio 的机器上使用相同的偏好。具体来说，同步设置属于 Visual Studio 的常规选项，你可以通过选择 `Tools` 菜单中的 `Options`\
  \ 命令来访问它们包含：\n\n*   **主题设置**：通过打开 `Environment` 页面以及 `Options` 对话框中的 `General` 选项卡可以更改\
  \ Visual Studio 的图形主题。\n*   **启动设置**：可以通过打开 `Options` 对话框中的 `Startup` 选项卡进行自定义。\n\
  *   所有文本编辑器设置：可以通过打开 `Options` 对话框中的 `Text Editor` 选项卡进行获取和自定义。\n*   所有可用字体和颜色设置：可以通过打开\
  \ `Options` 对话框中的 `Environment`、`Fonts` 和 `Colors` 选项卡进行获取。\n*   所有可用键盘快捷键（包括默认和自定义）：可以通过打开\
  \ `Options` 对话框中的 `Environment`、`Keyboard` 选项卡进行获取。\n*   自定义命令别名。\n\n这些设置中的某些将在后续章节中描述。\n\
  \n### 介绍启动窗口\n\n当 Visual Studio 2019 启动时，会显示启动窗口。*图 3.5* 显示了一个基于 Visual Studio 2019\
  \ 的示例：\n\n![](img/Figure-3.5.jpg)\n\n\n\n\n![](img/Figure-3.5.jpg)\n\n**图 3.5:**\
  \ Visual Studio 2019 启动页\n\n在左侧，启动窗口显示了最近打开的项目列表。你可以通过右键点击项目并选择 `从列表中移除 (Remove\
  \ From List)` 从列表中删除一个或多个项目。在右侧，启动窗口提供了常用操作的快捷方式，例如：\n\n*   **克隆或检出代码 (Clone or\
  \ check out code)**：此快捷方式允许你连接到 Azure DevOps 或 GitHub 上的 Git 仓库，以便克隆仓库或检出代码。此将在下一节详细讨论。\n\
  *   **打开项目或解决方案 (Open a project or solution)**：此快捷方式允许你打开现有的解决方案或项目。\n*   **打开本地文件夹\
  \ (Open a local folder)**：此快捷方式允许将现有文件夹作为散文件集合打开，类似于 Visual Studio Code 也支持的功能。\n\
  *   **创建新项目 (Create a new project)**：这将启动同名的对话框，你可以通过选择模板创建一个新项目。此功能将在下一节进行彻底讨论。\n\
  \n如果你不想处理项目，只想打开 IDE，可以点击`不带代码继续 (Continue without code)` 链接。你很快就会创建一个新项目，但首先了解项目在\
  \ Visual Studio 和 .NET 中的结构至关重要。\n\n### 理解项目和解决方案\n\n在现代软件开发中，应用程序并不仅仅是将一个代码文件编译为二进制文件的结果。相反，你编写了许多相互链接的代码文件，并且你需要图像、数据文件、字体和其他资源。构建应用程序所需的所有文件都收集在一个项目中。在\
  \ Visual Studio 中，你可以根据想要构建的应用程序类型创建数十不同的项目类型。在 C# 中，项目所需的文件和资源列表包含在 `.csproj` 文件中。Visual\
  \ Studio 知道如何处理`可扩展标记语言` (`XML`) 文件以正确加载项目。在 Visual Studio 中，你可能需要一起处理多个项目，这是一个非常常见的情况。这通过解决方案\
  \ (Solutions) 来表示，解决方案可以被视为项目的容器。一个解决方案可以包含无限数量不同类型的项目，例如 C# 项目、类库、Web 服务和 Windows\
  \ 客户端应用程序。解决方案是一个 `.sln` 文件，与 `.csproj` 项目文件类似，它具有 XML 结构。Visual Studio 知道如何解析 `.sln`\
  \ 文件并相应加载项目，从而提供了通过解决方案资源管理器 (Solution Explorer) 工具窗口管理项目和解决方案的选项，将在后续章节中讨论。\n\n\
  **由于使用 Visual Studio 可以创建许多不同的项目，在书中无法描述所有可能的选项。因此，重点将放在你可以用 C# 创建的项目上，因为这语言你同时也用于开发\
  \ Xamarin 的语言。**\n\n### 使用 C# 创建项目\n\n你可以通过点击启动窗口中的`创建新项目 (Create a new project)`\
  \ 快捷方式，或者在进入 IDE 后通过`文件 (File)`、`新建项目 (New Project)` 命令来创建项目。这将显示适用于所有语言和平台的支持项目模板完整列表。可以使用对话框右上角的一个或多个下拉列表对列表进行过滤。例如，点击`所有语言\
  \ (All languages)` 下拉列表并选择 `C#` 以根据此语言限制列表（见[图 3.6]）。可用项目模板列表取决于你在安装 Visual Studio\
  \ 时选择了哪些工作负载 (workloads)，但通常，你可以创建项目来生成桌面应用程序、Web 应用程序和服务、移动应用程序以及可重用库。\n\n![](img/Figure-3.6.jpg)\n\
  \n**图 3.6:** 使用 C# 创建项目\n\n[表 3.1] 总结了作为 Xamarin 开发者与你最相关的 C# 项目模板列表。你可以通过在 Visual\
  \ Studio 中滚动列表查看每个模板：\n\n| 模板 | 简描述 |\n| :--- | :--- |\n| 控制台应用程序 (Console Application)\
  \ | 用于创建在不同系统上运行的命令行应用程序的项目。 |\n| ASP.NET Core Web 应用 (ASP.NET Core Web App) | 用于创建可以托管在不同系统上的\
  \ Web 应用程序的项目。 |\n| 类库 (Class library) | 用于创建可重用代码库的项目。 |\n| ASP.NET Core Web API\
  \ | 用于创建以表示状态传输 (REST) 方法暴露 API 的 Web 服务的项目。 |\n| Windows Forms 应用 (Windows Forms\
  \ App) | 基于 Windows Forms 技术创建桌面应用程序的项目。 |\n| WPF 应用程序 (WPF Application) | 基于 Windows\
  \ Presentation Foundation 技术创建桌面应用程序的项目。 |\n| 空应用（通用 Windows） (Blank App (Universal\
  \ Windows)) | 用于针对通用 Windows 平台 (UWP) 创建的项目。 |\n| 移动应用 (Xamarin.Forms) (Mobile App\
  \ (Xamarin.Forms)) | 一个包含多个项目的项目模板，允许使用 Xamarin.Forms 为 iOS、Android 和 UWP 创建应用。这是你在书中将最常用的项目模板。\
  \ |\n| Android 应用 (Xamarin) (Android App (Xamarin)) | 使用 Xamarin.Android 创建 Android\
  \ 应用的项目。 |\n| iOS 应用 (Xamarin) (iOS App (Xamarin)) | 使用 Xamarin.iOS 创建 iOS 应用的项目。\
  \ |\n| Android Wear (Xamarin) (Android Wear (Xamarin)) | 使用 Xamarin.Android 为可穿戴设备创建\
  \ Android 应用的项目。 |\n| iOS Wear (Xamarin) (iOS Wear (Xamarin)) | 使用 Xamarin.iOS 为可穿戴设备创建\
  \ iOS 应用的项目。 |\n| Xamarin.UITest 跨平台测试项目 (Xamarin.UITest Cross Platform Test Project)\
  \ | 允许为 Xamarin 项目实现用户界面自动化测试的项目。 |\n\n**表 3.1:** 与 C# 最相关的项目模板\n\n启动窗口中的每个项目模板都有简短描述，位于项目名称下方（见图\
  \ 3.6）。\n\n在本章中，你将使用自己的模板来发现 Visual Studio 中的工具。在书的其余部分，你将使用移动应用 (`Xamarin.Forms`)\
  \ 项目模板来创建移动应用。当你创建一个新项目时，Visual Studio 首先生成包含一个或多个项目的解决方案，取决于所选的模板。\n\n### 创建你的第一个\
  \ C# 项目\n\n现在你已经了解了创建项目的概念，准备好创建你的第一个 C# 项目了。你将使用控制台应用程序，这对于教学目的是理想的，并且可以在不依赖特定平台的情况下快速理解。在启动对话框中，点击`控制台应用程序\
  \ (Console Application)`模板。Visual Studio 将显示`配置新项目 (Configure your new project)`对话框，你可以在其中指定项目名称和磁盘上的位置（见图\
  \ 3.7）。项目名称不能包含空格。在项目名称框中输入 `MyFirstProgram`。Visual Studio 提供存储项目的默认位置，通常为 `C:\\\
  Users\\UserName\\source\\repos`，其中 `UserName` 是你的 Windows 用户。你可以提供不同的位置，但现在使用默认即可。准备好后点击`下一步\
  \ (Next)`：\n\n![](img/Figure-3.7.jpg)\n\n**图 3.7:** 提供项目信息\n\n在`其他信息 (Additional\
  \ information)`对话框中（见图 3.8），你将能够指定目标框架。选择可用的 .NET Core 版本。在我的机器上，它是 .NET 5.0 (`Current`)。完成后，点击`创建\
  \ (Create)`：\n\n![](img/Figure-3.8.jpg)\n\n**图 3.8:** 提供项目信息\n\n几秒钟后，你的项目就就绪了，Visual\
  \ Studio 2019 显示了代码编辑器（见图 3.9）：\n\n![](img/Figure-3.9.jpg)\n\n\n\n\n\n**图 3.9:**\
  \ 新项目已就绪\n\n该代码仅在系统控制台（Console）窗口中显示一条消息，这个简单的项目将作为你学习 Visual Studio 2019 中开发人员需要的工具和功能的基础。\n\
  \n### 使用 Visual Studio IDE\n\nVisual Studio 2019 IDE 是一个非常强大的开发环境，它提供了许多提高效率的工具，将简化你的开发人员生活。本节描述了你为了成功理解后续章节涵盖的主题而需要了解的重要工具、命令和功能。其他一些工具需要更多关于\
  \ C# 编程语言的知识，因此将在后面的章节中适当适当进行讨论。\n\n### 使用工具窗口\n\n工具窗口（Tool windows）是可以在 IDE 界面上移动、排列和停靠的浮动窗口，它们提供了多样的工具。通常情况下，Visual\
  \ Studio 中所有可用的工具窗口都列在`View（视图）菜单中。但也有例外；例如，提供测试工具的窗口可以在`Test（测试）菜单中找到，而提供调试工具的窗口可以在`Debug（调试）菜单中找到。书中的示例需要使用几个工具窗口，本章提供了这些最常用窗口的概述。特别是，本章描述了`Solution\
  \ Explorer（解决方案管理器）`、`Error List（错误列表）`、`Properties（属性）`和`Output（输出）`窗口，因为你将在所有项目中频繁使用它们。你将在相应的章节中学习与其他移动应用开发相关的工具窗口。重新排列工具窗口可以通过点击它们的标题并将其拖放到新的所需位置，并释放到[图\
  \ 3.10]所示交叉箭头中最合适的箭头上来实现：\n\n![](img/Figure-3.10.jpg)\n\n**图 3.10:** 排列工具窗口\n\n\
  当你首次安装 Visual Studio 时，工具窗口在 IDE 中有一个默认位置，但你可以根据方便对它们进行重新排列。接下来的章节将讨论你最常用的工具窗口。\n\
  \n### 解决方案管理器\n\nSolution Explorer 可能是你交互频繁的工具窗口。它允许你管理解决方案、项目和文件。它提供了解决方案、项目以及每个项目内文件的结构化且完整的视图。它还提供了添加、删除文件以及将文件组织到子文件夹的方法。[图\
  \ 3.11]显示了新创建的 C# 项目在解决方案管理器中的显示情况。\n\n![](img/Figure-3.11.jpg)\n\n**图 3.11:** 使用解决方案管理器浏览解决方案\n\
  \n如你所示，解决方案位于根级别。嵌套在其之下的是项目（在这种情况下，只有一个项目）。在每个项目内部，你可以找到代码文件和子文件夹。这些可以包含图像、数据库文件、文档以及任何其他所需的资源。你还可以获取项目中所有依赖的列表。依赖项是应用程序运行所需的库或组件。对于基于\
  \ .NET Core 构建的控制台项目，所需的依赖项是 `Microsoft.NETCore.App`。对于基于 .NET Core 构建的控制台项目，所需的依赖项是\
  \ `Microsoft.NETCore.App`。对于基于 .NET Core 构建的控制台项目，所需的依赖项是 `Microsoft.NETCore.App`。对于基于\
