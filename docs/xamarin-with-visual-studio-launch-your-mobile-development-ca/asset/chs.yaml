  \ (`https://docs.microsoft.com/en-us/xamarin/community-toolkit`) 中，这是一个包含许多可重用视图、转换器、行为等的开源库。在本书中，Community\
  \ Toolkit 只会被提到几次，但 `MediaElement` 是个例外，因为人们对此视图的需求一直很高，而且包含媒体确实是移动端开发中一个非常常见的需求。\n\
  \n(注：由于提供的原文中存在大量重复段落，已根据要求“不要重复输出原文”的原则对核心逻辑内容进行了翻译。)\n\n\n\n\n| `Duration` | 类型为\
  \ `TimeSpan`，此属性返回媒体内容的持续时间。 |\n| `Aspect` | 类型为 `Aspect`，它允许使用与 Image 视图相同的值（`AspectFit`、`AspectFill`、`Fill`）和行为对视频进行缩放和拉伸。\
  \ |\n\n**表 10.2：** `MediaElement` 最相关的成员\n\n例如，假设你将 `AutoPlay` 属性设置为 `false`。当你为\
  \ `MediaElement` 分配 `Source` 属性时，视频会开始加载，但你需要手动播放它。你可以编写以下代码：\n\n```csharp\nprivate\
  \ void Media1_MediaOpened(object sender, EventArgs e)\n{\n    Media1.Play();\n}\n\
  \nprivate async void Media1_MediaFailed(object sender, EventArgs e)\n{\n    await\
  \ DisplayAlert(\"Error\", “There was a problem while opening your media\",\n   \
  \ “OK\");\n}\n```\n\n前面的代码展示了如何利用 `MediaOpened` 和 `MediaFailed` 事件。在第一种情况下，调用 `Play`\
  \ 方法开始播放媒体。在第二种情况下，向用户显示警告消息。\n\n# 播放本地文件\n\n`MediaElement` 的源可以是嵌入式视频、本地文件和 URI。对于后者，你刚刚看到了一个示例。对于嵌入在应用资源中的文件，你将使用以下语法：\n\
  \n```xml\n<MediaElement Source=\"ms-appx:///YourVideo.mp4\" />\n```\n\n你基本上是在文件名前添加\
  \ `ms-appx:///` 前缀。使用类似的语法，你还可以播放存储在应用本地文件夹或临时文件夹中的媒体文件。你可以通过将文件复制到 Xamarin.iOS\
  \ 项目的 `Resources` 文件夹以及 Xamarin.Android 项目的 `Assets` 文件夹，将文件包含在本地应用文件夹中。例如：\n\n\
  ```xml\n<MediaElement Source=\"ms-appdata:///local/YourVideo.mp4\" />\n```\n\n播放应用文件夹中的视频，而\
  \ `<MediaElement Source=\"ms-appdata:///temp/YourVideo.mp4\" />` 则播放临时文件夹中的视频。它们的共同点是具有\
  \ `ms-appdata:///` 前缀，其紧跟的是文件夹名称。最后，还可以播放存储在设备库中的媒体。要实现这一点，你首先需要一个从库中选取内容的用户界面。Xamarin\
  \ Community Toolkit 实现了对设备特定文件夹的共享访问，因此你可以在 `Button` 的 `Clicked` 事件处理程序中编写如下的 C#\
  \ 代码：\n\n```csharp\nstring mediaName = await DependencyService.Get<IVideoPicker>().GetVideoFileAsync();\n\
  \nif (!string.IsNullOrWhiteSpace(mediaName))\n{\n    MediaElement1.Source = new\
  \ FileMediaSource\n    {\n        File = mediaName\n    };\n}\n```\n\n`DependencyService`\
  \ 类将在 *第 13 章：使用原生 API* 中详细介绍，但现在你需要知道的是，它允许从共享项目调用平台特有的代码。由于允许从设备中选取内容的系统 API 在\
  \ iOS 和 Android 上显然不同，因此 `GetVideoFileAsync` 方法有单独的实现，其目的是显示文件选择器并允许用户选择媒体文件。结果的名称如果不为空，则将通过\
  \ `FileMediaSource` 类的实例分配给 `MediaElement` 的 `Source` 属性。像 `Image` 一样，你也可以通过由 `MediaSource`\
  \ 类暴露的 `FromFile` 和 `FromUri` 方法通过程序设置 `MediaElement` 的源。\n\n### 结论\n\n让应用程序具有吸引力对于移动应用开发者来说至关重要。Xamarin.Forms\
  \ 提供了画刷和形状，它们不仅允许创建渐变和几何形状，还可以用于实现有趣的用户体验。想想椭圆内包含图像的头像示例吧。如今移动应用中的另一个关键点是提供播放音频和视频的能力。在\
  \ Xamarin.Forms 中，这种支持最近通过 `MediaElement` 视图添加，该视图通过 Community Toolkit 提供，这是一个由微软支持的开源库，你可能想将其标记为以供进一步学习。创建漂亮的应用程序是很重要的，但还不够够。事实上，你需要学习应用程序如何从头到尾运行，这是下一章的主题。\n\
  \n### 关键术语\n\n*   **渐变（Gradient，用于应用开发）**：由多种颜色组成的标量背景。\n*   **几何形状 (Geometry)**：表示简单和复合几何形状的对象。\n\
  *   **依赖服务 (Dependency service)**：一种允许从共享项目访问原生代码的类。\n\n### 建议阅读\n\n*   关于画刷的微软官方文档\
  \ (**https://docs.microsoft.com/en-us/xamarin/xamarin-forms/user-interface/brushes/**)\n\
  *   关于形状的微软官方文档 (**https://docs.microsoft.com/en-us/xamarin/xamarin-forms/user-interface/shapes/**)\n\
  *   关于 Xamarin Community Toolkit 的微软官方文档 (**https://docs.microsoft.com/en-us/xamarin/community-toolkit/**)\n\
  \n# 第 11 章\n\n# 管理应用生命周期\n\n### 引言\n\n应用程序执行的简单操作，或用户的简单手势，会在所谓的应用生命周期中产生反应。这代表了应用正在运行或已关闭的时间点。当用户打开应用时，启动是生命周期的第一个时刻。当用户关闭应用时，是生命周期的最后一个时刻。当应用发送到后台时（例如，未关闭而用户只是切换到另一个应用），这是生命周期的另一个时刻。理解并正确管理生命周期对于移动应用开发至关重要，因为你需要知道如何保留对用户的信息。例如，假设你的应用有一个表单，用户正在输入详细信息。如果应用发送到后台，你需要确保在重新打开应用时显示这些信息。本章从\
  \ Xamarin 的角度解释了生命周期，并增强了你对属于生命周期的技术的认知，例如处理广播消息。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   `Application` 类\n*   应用生命周期事件\n*   发送应用消息\n\n### 目标\n\n完成本章后，你将能够完全管理生命周期，了解在应用程序关闭之前何时以及如何持久化用户设置和偏好。\n\
  \n### 创建示例项目\n\n本章带有一个辅助 Xamarin.Forms 解决方案，你可以用 Visual Studio 打开以便更好地遵循示例。如果你想从头创建一个项目，可以按照以下步骤操作：\n\
  \n1.  创建一个名为 `ApplicationLifecycle` 的新 Xamarin.Forms 解决方案，以与示例保持一致。\n2.  不要编辑或删除自动生成的\
  \ `MainPage.xaml` 文件；它稍会被使用。\n3.  对于书中讨论的每个布局，添加一个类型为 `Content Page (XAML)` 的新项。要实现这一点，右键点击共享项目名称，然后点击“添加新项”。\n\
  4.  为新的 XAML 文件分配一个与讨论视图匹配的名称，例如 `ApplicationEvents.xaml`，然后点击“添加”。\n\n\n\n\n\n\
  对于你向项目添加的每个页面，请在 `ContentPage` 中添加一个空的 `StackLayout`，并将 `VerticalOptions` 属性赋值为\
  \ `CenterAndExpand`。除非另有指定，这将是后续页面中代码示例的默认选择布局。\n\n# Application 类\n\n`Application`\
  \ 类从编码角度来看代表了应用程序的运行实例。它负责应用程序的生命周期，并响应如应用启动和页面打开等事件。每个 `Xamarin.Forms` 解决方案都包含一个派生自\
  \ `Application` 的 `App` 类，你实际上操作的是 `App` 而不是 `Application`。该类的定义位于 `App.xaml.cs`\
  \ 文件中；它还定义了整个应用程序可用的资源。\n\n关于资源，在第 9 章：资源与数据绑定中，你已经学习了如何在 `App.xaml` 文件中放置所有想要在整个应用中共享的资源。在后台，资源是由\
  \ `App` 类及其 `Resources` 属性处理的。因此，XAML 仅仅提供了一个更易的界面来定义和消费资源。\n\n由于 `App` 类是单例的（这意味着只能存在一个实例），它暴露了一个类型为\
  \ `App` 的属性 `Current`，你使用它来与类本身进行交互。以下行显示了如何使用 `Current` 获取设备的图形主题：\n\n```csharp\n\
  var theme = App.Current.UserAppTheme;\n```\n\n`App` 类的许多类型和成员供平台内部使用，但有少数对你来说至关重要。例如，`Page`\
  \ 类型的 `MainPage` 属性代表应用程序的根页面。你已经在书中多次使用了此属性，但重要的是要记住，它是应用程序生命周期的一部分。当你创建一个项目时，赋值如下：\n\
  \n```csharp\npublic App()\n{\n    InitializeComponent();\n    MainPage = new MainPage();\n\
  }\n```\n\n你不仅可以在这里更改根页面，还可以在之后重新分配主页面，以模拟应用程序的重启。在这种情况下，你可以按照如下方式更改根页面：\n\n```csharp\n\
  App.Current.MainPage = new SecondaryPage();\n```\n\n`App` 类还用于制作影响应用程序的更改，并存储你希望在任何地方使用的字段和属性。接下来的章节将讨论这些场景。\n\
  \n# 使用主题\n\nAndroid 和 iOS 拥有图形主题，并且它们都包含深色和浅色主题。你可以轻松地获取用户设备上当前激活的是哪种主题，甚至可以通过 `App`\
  \ 类为应用设置不同的主题。以下代码演示了如何获取主题：\n\n```csharp\nvar currentTheme = App.Current.UserAppTheme;\n\
  switch(currentTheme)\n{\n    case OSAppTheme.Light:\n        break;\n    case OSAppTheme.Dark:\n\
  \        break;\n    default:\n        break;\n}\n```\n\n`UserAppTheme` 属性指定主题，类型为\
  \ `OSAppTheme`，该枚举暴露了三个值：`Light`、`Dark` 和 `Unspecified`。以下代码演示了你如何强制应用使用特定的主题：\n\
  \n```csharp\nApp.Current.UserAppTheme = OSAppTheme.Light;\n```\n\n# 定义全局变量\n\n在某些情况下，你可能需要将值或引用存储在变量中，并希望这些变量在整个应用中可用。为了实现这一点，你可以在\
  \ `App` 类中定义静态字段或属性，如下例：\n\n```csharp\npublic partial class App : Application\n\
  {\n    internal static string SharedProperty { get; set; }\n    …\n}\n```\n\n在这种情况下，`SharedProperty`\
  \ 属性被标记为 `internal`，因此它只能从共享项目内部访问。此外，它被标记为 `static`，因为 `App` 类只能有一个实例。这是一个特殊情况，因为你无需调用\
  \ `Current` 属性即可访问这些成员；因此，你可以这样使用它：\n\n```csharp\nApp.SharedProperty = “Some text”;\n\
  ```\n\n可以在应用中任何地方访问的变量被称为全局变量。\n\n**提示：全局变量在某些情况下非常有用且方便，但请记住，当你未使用它们时，它们会占用内存中的分配空间。出于原因，你应该尽可能避免全局变量，优先使用局部变量，后者在不再使用时会被销毁。**\n\
  \n# 应用程序生命周期事件\n\n`Application` 类暴露了 .NET 事件，代表应用程序生命周期中最重要的时刻。本节将讨论与应用运行时间相关的事件，以及当用户执行某些操作时触发的事件。\n\
  \n# 理解和使用 Application 事件\n\n`Application` 类暴露了以下三个事件：\n\n*   `OnStart`：在应用启动（且之前已关闭）时触发。\n\
  *   `OnSleep`：在应用被发送到后台或关闭时触发。\n*   `OnResume`：在应用切回前台时触发。\n\n你可以处理这些事件以便在应用程序生命周期的特定时刻执行操作；例如，在\
  \ `OnStart` 触发时加载用户设置，或在 `OnSleep` 触发时持久化用户设置。Visual Studio 不会自动添加这些事件处理程序，因此你需要手动将它们添加到\
  \ `App.xaml.cs` 文件中，如下：\n\n```csharp\nprotected override void OnStart()\n{\n}\n\
  protected override void OnSleep()\n{\n}\nprotected override void OnResume()\n{\n\
  }\n```\n\n现在你将学习这些事件的实际用法，这在许多应用程序中都是常见的。\n\n# 示例：存储和检索数据\n\n应用程序事件的一种常见用法检索和存储用户访问应用程序的时间。这样做的原因是无限的；例如，你可能希望在应用后台运行一段时间后要求用户重新登录。为了实现这一点，你将使用\
  \ `Xamarin.Essentials` 库，该库由 Visual Studio 自动添加到新解决方案中，并在第 13 章：与原生 API 交互中详细介绍。该库暴露了一个名为\
  \ `Preferences` 的类，允许将原始类型信息保存到应用的本地存储。你可以使用该类的 `Get` 方法检索信息，并使用 `Set` 方法保存信息。以下代码演示了这种操作：\n\
  \n```csharp\nprivate DateTime _lastActivityTime;\nprotected override void OnStart()\n\
  {\n    _lastActivityTime = Preferences.Get(“LastActivityTime”, DateTime. MinValue);\n\
  }\nprotected override void OnSleep()\n{\n    Preferences.Set(“LastActivityTime”,\
  \ DateTime.Now.ToUniversalTime());\n}\nprotected override void OnResume()\n{\n \
  \   _lastActivityTime = Preferences.Get(“LastActivityTime”, DateTime. MinValue);\n\
  }\n```\n\n\n\n\n当应用启动并触发 `OnStart` 事件时，代码会在应用程序的本地存储中搜索一个名为 `LastActivityTime` 的变量。如果找到，则返回存储的值。如果未找到（例如，因为是首次运行应用），则返回一个默认值。当应用切换到后台或关闭时，会触发\
  \ `OnSleep` 事件，并将当前日期和时间保存到应用程序的本地存储中。当应用从后台恢复时，会触发 `OnResume` 事件，代码将搜索相同的日期和时间值，如果没有找到任何内容，则返回默认值。应用程序事件的另一种可能用法是在应用发送到后台或关闭之前，将用户在应用中输入的所有数据保存到数据库中，这样当应用恢复时数据就不会丢失。这不仅是一种最佳实践，更是应用的工作方式。\n\
  \n# 真实世界场景：恢复数据\n\n某些应用程序提供数据表单，并在应用关闭或挂起之前显示待处理的数据。这并非强制性行为，取决于应用的需求和设计。如果你必须处理这种场景，有许多方法可以。例如，如果你有一个需要持久化的对象实例，可以将其序列化到本地\
  \ JSON 文件，以便在再次启动时加载数据。如果你也在使用 SQLite 数据库，可以在应用挂起或关闭时为临时数据创建一个特定的表。然后，在启动时，可以从临时表中加载数据。通常，这种方法是开发团队共享的，在许多应用程序中，足以警告用户如果在应用关闭或挂起前未保存，数据将会丢失。\n\
  \n# 响应页面事件\n\n有时，你可能想在页面打开或关闭时知道。在这种情况下，`Application` 类暴露了表 1.1 中的事件：\n\n| 成员 |\
  \ 描述 |\n| :--- | :--- |\n| `PageAppearing` | 页面显示时触发 |\n| `PageDisappearing` | 页面移除时触发\
  \ |\n| `ModalPushing` | 模态页面添加到导航栈时触发 |\n| `ModalPushed` | 模态页面显示时触发 |\n| `ModalPopping`\
  \ | 代码调用 `PopAsync` 时触发 |\n| `ModalPopped` | 模态页面从导航栈移除时触发 |\n\n**表 1.1：与页面导航相关的事件**\n\
  \n在处理这些事件时，你需要显式地订阅它们，如下例所示：\n\n```\nApp.Current.PageAppearing += Current_Pageearing;\n\
  ```\n\n对于 `PageAppearing` 和 `PageDisappearing`，事件处理器获取页面实例：\n\n```csharp\nprivate\
  \ void Current_Pageearing(object sender, Page e)\n{\n    if(e is MainPage)\n   \
  \ {\n}\n```\n\n在此代码段中，代码检查页面是否为 `MainPage` 对象。对于其他事件，事件处理器分别处理 `ModalPushingEventArgs`、`ModalPushedEventArgs`、`ModalPoppingEventArgs`\
  \ 和 `ModalPoppedEventArgs` 类型。所有这些类都暴露了 `Modal` 属性，它指向触发事件的模态页面实例。以下是一个示例：\n\n```csharp\n\
  private void Current_ModalPopping(object sender, ModalPoppingEventArgs e)\n{\n \
  \   }\n```\n\n**提示：当需要在页面生命周期级别工作时，记得单个页面触发的 `OnAppearing` 和 `OnDisappearing` 事件。**\n\
  \n# 通过应用发送消息\n\n应用的不同部分经常需要相互通信。例如，`viewmodel` 中的某个方法需要通知视图操作已完成，以便视图采取相应的操作。这是通过广播消息实现的，在\
  \ `Xamarin.Forms` 中，你通过静态 `MessagingCenter` 类进行管理。该类采用发布者/订阅者模型，这意味着发布者对象在不知道哪个其他对象接收消息的情况下发送广播消息，而其他订阅者对象在拦截到特定消息时采取必要的操作。`MessagingCenter`\
  \ 类暴露了三个主要方法：`Send`、`Subscribe` 和 `Unsubscribe`。最简单的形式是用以下语法发送消息：\n\n```cs\nMessagingCenter.Send(this,\
  \ “MESSAGE”);\n```Send` 接收两个参数：发送消息的对象实例和包含消息的字符串。消息字符串完全由你选择。通常，发送消息的对象实例就是调用 `Send`\
  \ 的实例。订阅者注册消息如下：\n\n```csharp\nMessagingCenter.Subscribe<MainPage>(this, “MESSAGE”,\
  \ (sender) =>\n{\n    // 在此处执行某些操作\n});\n```\n\n`Subscribe` 接收一个 `type` 参数，代表发送消息的对象；在示例中，它是\
  \ `MainPage`。方法的第一个参数是订阅对象的实例、对象订阅的消息，以及一个接收发送者实例作为参数的动作。在不再需要时，使用以下代码取消订阅消息：\n\n\
  ```cs\nMessagingCenter.Unsubscribe<MainPage>(this, “MESSAGE”);\n```\n\n`Unsubscribe`\
  \ 需要你指定发送者的类型，然后接收订阅者的实例和消息。\n\n**提示：取消订阅消息极其重要。如果你释放了一个对象实例而没有取消订阅它正在监听的消息，然后创建了相同对象的新实例，可能会发生运行时冲突，且消息可能不再被订阅。**\n\
  \n有很多可以使用广播消息的场景，但 Model-View-ViewModel 无疑是最常见的。现在，你将学习如何改进 MVVM 架构。\n\n# 使用 MVVM\
  \ 广播消息\n\n假设你在 viewmodel 中有一个方法可以完成某个操作，你想通过显示警报或新页面向用户显示消息。根据 MVVM 原则，viewmodel\
  \ 不能打开视图或警报，而数据绑定视图应该只实现与界面相关的代码，而不与 viewmodel 进行直接交互。在这种情况下，当 viewmodel 完成操作时，它可以发送消息。视图可以订阅该消息，并在消息发送时采取相应的操作（如显示警报或新页面）。为了更好地理解和实际操作，在\
  \ Visual Studio 中重新打开在第 9 章：资源与数据绑定中讨论的 `LocalDataAccess` 解决方案。准备好后，打开 `ContactViewModel.cs`\
  \ 文件并找到以下代码：\n\n```cs\nSaveAllCommand = new Command(() => ContactsDataBase.SaveAll(Contacts));\n\
  ```\n\n正如你可能记得的，此命令调用了 `SaveAll` 方法，将联系列表的所有可用更改存储在 SQLite 数据库中。现在，假设你想通过警报通知用户已完成。你可以这样扩展之前的代码：\n\
  \n```csharp\nSaveAllCommand = new Command(() =>\n{\n    ContactsDataBase.SaveAll(Contacts);\n\
  \    MessagingCenter.Send(this, “ContactsSaved”);\n});\n```\n\n\n\n\n保存操作完成后，会发送一条消息。现在，打开\
  \ `MainPage.xaml.cs` 文件并按如下所示构造函数：\n\n```csharp\npublic MainPage()\n{\n    InitializeComponent();\n\
  \    MessagingCenter.Subscribe<ContactViewModel>(this, “ContactsSaved”,\n    async\
  \ (sender)=> {\n    await DisplayAlert(“Information”, “Contacts saved!”, “OK”);\n\
  \    });\n    ViewModel = new ContactViewModel();\n    BindingContext = ViewModel;\n\
  }\n```\n\n调用 `Subscribe` 方法是为了注册由 `ContactViewModel` 类发送的 `ContactsSaved` 消息，执行的操作显示警报。通过这种方法，你的代码完全遵循\
  \ MVVM 原则，并实现了一个常见的功能，即在 ViewModel 中的某个操作完成时显示额外的用户界面。图 11.1 显示了得益于消息交换，警报是如何出现的：\n\
  \n![](img/Figure-11.1.jpg)\n\n**图 11.1:** 通过消息交换显示警报\n\n你在示例解决方案中只处理了一个页面，因此调用 `Unsubscribe`\
  \ 是没有必要的，因为销毁页面实例意味着关闭应用程序。然而，如果你位于正在关闭的不同页面上，调用 `Unsubscribe` 是重要的。\n\n# MessagingCenter\
  \ 技巧与技巧\n\n关于广播消息，你应该了解一些最佳实践和建议。第一个建议是在创建发送消息的对象的实例之前调用 `Subscribe`。如果你回看 `MainPage`\
  \ 对象的构造函数，就可以看到这一点。这不是强制性的，但如果发送者对象的构造函数已经发送了消息，你将会丢失这些消息。第二个建议是关于消息字符串。如果你想避免拼写错误并利用\
  \ Visual Studio 代码编辑器的功能，可以在单独的类中将消息字符串定义为常量，如下：\n\n```csharp\ninternal static class\
  \ MessageConstants\n{\n    public const string ContactsSaved = “ContactsSaved”;\n\
  }\n```\n\n你可以通过常量来引用消息，这将启用 Visual Studio 中的 IntelliSense，加快添加字符串的速度并避免拼写错误。接下来的这行代码是一个示例：\n\
  \n```csharp\nMessagingCenter.Send(this, MessageConstants.ContactsSaved);\n```\n\n\
  最后一个提示是关于由订阅者执行的操作。在之前的代码示例中，操作被封装在 Lambda 表达式内部。然而，如果你有更复杂的代码要执行，可以如下所示重写订阅者：\n\
  \n```csharp\nMessagingCenter.Subscribe<ContactViewModel>(this, “ContactsSaved”,\n\
  ShowCompletionMessageAsync);\n```\n\n你基本上是在传递一个方法的名称，该方法在接收到消息时必须调用。考虑以下示例：\n\n\
  ```csharp\nprivate async void ShowCompletionMessageAsync(ContactViewModel contactViewModel)\n\
  {\n    await DisplayAlert(“Information”, “Contacts saved!”, “OK”);\n}\n```\n\n这种方法更清晰地说明了发送者实例是如何被订阅者接收的，并提供了更好的视角，当你有更多行代码需要处理时，推荐这种做法。\n\
  \n### 结论\n\n在开发移动应用时，管理应用程序生命周期非常重要。这不仅让你对应用程序有完全控制，还允许你根据应用生命周期的不同阶段实现适当的用户体验。在本章中，应用程序生命周期事件对于扩展你关于处理本地数据的知识很有帮助。然而，大多数移动应用与远程数据和服务一起。因此，在下一章中，你将与\
  \ Web API 服务一起，并加强对 C#、.NET 和 Xamarin.Forms 的理解。\n\n### 关键术语\n\n*   **应用程序生命周期 (Application\
  \ lifecycle)**：代表应用的运行时间，从启动到关闭或进入后台。\n*   **全局变量 (Global variables)**：应用中所有对象可用的变量。\n\
  *   **广播消息 (Broadcast message)**：应用中对象之间交换的字符串消息。\n\n### 建议阅读\n\n关于应用程序生命周期的微软官方文档（**https://docs.microsoft.com/en-us/xamarin/xamarin-forms/app-fundamentals/app-lifecycle**）。\n\
  \n# 第 12 章\n\n# 使用 Web API\n\n### 引言\n\n在之前的章节中，你已经看到了如何处理本地数据和本地 SQLite 数据库来读取和写入信息。然而，在现实世界中，大多数数据驱动的应用程序也与远程数据源一起。在典型的架构中，调用\
  \ Web 服务来从远程数据库读取和写入数据，Web 服务和数据库都可以托管在服务器或云服务上。在理想世界中，应用程序和 Web 服务应该能够无论创建它们使用的开发技术和编程语言如何都能相互通信，因此它们交换的数据应该以通用格式提供。在本章中，你将学习如何使用最现代的微软技术创建和消费\
  \ Web 服务，使用标准数据交换格式与移动应用进行数据交换。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   章节准备知识\n*  \
  \ 理解 Web 服务和 Web API\n*   JSON：一种标准数据交换格式\n*   在 Visual Studio 中创建 Web API\n*  \
  \ 发布 Web API 服务\n*   使用 Xamarin.Forms 使用 Web API\n\n### 目标\n\n完成本章后，你将扩展关于数据驱动开发的重要概念的知识，并能够在\
  \ Xamarin.Forms 项目中实现与远程数据源的数据交换。\n\n与之前包含一个项目的配套章节不同，本章的解决方案由多个项目组成。因此，创建项目的步骤将在专门章节中描述。如果你希望按照说明进行，可以打开配套的\
  \ `BookService` 解决方案。\n\n# 章节准备知识\n\n在本章的第一部分，你将学习如何创建并发布 Web API 服务到远程服务器。无法预测你正在使用的环境，因此为了给所有读者提供相同的可能性，本章将使用\
  \ Azure 作为远程目标，这有助于理解如何在云端发布和管理 Web API 服务。相反，如果你想将服务发布到本地服务器，你可能需要联系公司的管理员，他们将帮助你设置和配置必要的基础设施。此外，你将使用名为\
  \ `Postman` 的工具来测试你实现的 API 调用，因为它是一个许多公司使用的工具。\n\n### 下载 Postman\n\n\n\n\n\nPostman\
  \ ([`www.postman.com`](https://www.postman.com)) 是一个开发者用于构建和测试 API 调用的免费工具。它是一个非常强大的工具，支持许多数据交换格式、环境和安全标准。它可能是开发者处理\
  \ Web API 时最流行的工具，甚至 Visual Studio 调试器也能检测到 API 调用是否是由 Postman 发出的，并允许你相应地使用常用的调试工具。现在，下载并安装\
  \ Postman；安装程序基于一键式方法，因此非常简单。在本章的稍后部分，你将使用它来测试你的工作。\n\n### 理解 Web 服务和 Web API\n\n\
  Web 服务（Web service）是一种允许在网络上的源与客户端应用程序之间以及反之之间进行通信的软件。Web 服务通过将其发布到远程服务器向客户端提供。我们说的远程服务器既包括本地服务器，也包括像\
  \ Microsoft Azure 这样的云服务。通信是通过 Web 服务向公众暴露的函数实现的，客户端可以像调用任何 .NET 方法一样调用这些函数。此类调用的结果就是客户端与服务之间交换的数据。Web\
  \ 服务可以使用不同的技术编写，并且其设计方式使其能够被不同类型的应用程序消费（例如，桌面应用、移动应用等）。从微软的角度来看，.NET 一直允许通过不同的技术方案使用\
  \ C#（以及其他 .NET 语言）创建和发布 Web 服务：ASP.NET 和 ASP.NET Core、Windows Communication Foundation（`WCF`）以及最近的\
  \ ASP.NET Web API。\n\nWeb API 可以任何支持 REST 的开发平台创建。然而，在本章中，任何对 Web API 的引用均指 ASP.NET\
  \ Core Web API，因此指微软栈构建的服务。\n\nWCF 特别代表了 .NET 演进中的一个重要里程碑，因为它是一种允许在服务器端利用 .NET 所有力量的技术，它支持大量的通信协议，并通过\
  \ Visual Studio 中的特定工具简化了客户端与服务之间的连接。另一方面，WCF 实现服务和服务的方式源于简单对象访问协议（`SOAP`）格式，但该格式仅由使用\
  \ .NET 构建的应用程序支持。在移动开发中，这不是推荐的方法，你应该优先选择由不同技术编写的客户端消费的 Web 服务。为了实现这一点，你使用 Web API\
  \ 服务。通常来说，Web API 是你通过 HTTP 和 HTTPS 协议访问的 Web 服务；它们暴露的函数由称为 `endpoint` 的静态 URL 标识。例如，如果一个名为\
  \ `CustomerService` 的 Web API 托管在名为 `Server01` 的服务器上，该 Web API 的地址如下：\n\n```\nhttps://server01/CustomerService\n\
  ```\n\n如果该服务暴露了一个用于检索客户列表的函数 `GetCustomers`，则端点（即函数的地址）如下：\n\n```\nhttps://server01/CustomerService/GetCustomers\n\
  ```\n\n函数支持参数，这将在章的稍后讨论。应用程序通过所谓的表述状态转移（`REST`）方法向 Web API 服务发送请求，.NET 提供了允许以面向对象的方式发送和管理请求的对象。REST\
  \ 是一种基于约束设计 Web 软件的架构风格。没有深入研究 REST 的细节，但强调每个请求都由特定的 HTTP 动词标识是很。常见的 HTTP 动词表示对数据的操作，并在表\
  \ 12.1 中描述：\n\n| HTTP 动词 | 描述 |\n| :--- | :--- |\n| `GET` | 从数据源读取并返回数据。 |\n| `POST`\
  \ | 向远程源写入新数据。 |\n| `PUT` | 修改远程源中的现有数据。 |\n| `PATCH` | 部分修改远程源中的现有数据。 |\n| `DELETE`\
  \ | 从远程源删除数据。 |\n\n表 12.1：常见的 HTTP 动词\n\n实际上，HTTP 动词并不直接执行操作。接收请求的 Web API 会检测请求中指定的\
  \ HTTP 动词并做出相应反应。这意味着你可以使用 `POST` 来检索数据而不是 `GET`，这也很常见，因为 `POST` 支持加密请求。正如你将在接下来的章节中看到的，Microsoft\
  \ Visual Studio 为创建、开发和发布 Web API 服务提供了完全支持。实际上，在实现服务与客户端之间的通信时，你需要知道交换格式并据此实现你的架构。\n\
  \n# JSON：一种标准的数据交换格式\n\nJavaScript 对象表示法（`JSON`）格式是 Web API 服务与移动应用之间实现数据交换的事实标准。它之所以流行有几个原因，但以下无疑是最重要的：\n\
  \n* 它的结构非常简单\n* 它没有依赖项\n* 它本质上是纯文本，可以表示复杂数据\n* 它被用作具有极其简单语法的标记语言。\n\n为了更好地理解，假设你有一个需要与\
  \ Web API 服务交换联系人信息的应用程序。`Contact` 实例由以下 C# `Contact` 类表示：\n\n```csharp\npublic\
  \ class Contact\n{\n  public string FirstName { get; set; }\n  public string LastName\
  \ { get; set; }\n  public DateTime DateOfBirth { get; set; }\n  public int Age {\
  \ get; set; }\n  public bool IsFamilyMember { get; set; }\n}\n```\n\n在 JSON 中，一个联系人的表示如下：\n\
  \n```json\n{\n  \"firstName\": \"Alessandro\",\n  \"lastName\": \"Del Sole\",\n\
  \  \"dateOfBirth\": \"1977-05-10T00:00:00\",\n  \"age\": 44,\n  \"isFamilyMember\"\
  : false\n}\n```\n\n你可以看到，简单的对象定义在括号内，每个键值对之间由冒号分隔。注意数字没有加引号。**提示：按照习惯，JSON 中的属性名遵循驼峰命名法（首字母小写）。然而，使用大驼峰（首字母大写）定义属性名也非常常见，特别是对于\
  \ .NET 开发者。**\n\nJSON 还可以表示数据集合。以下标记是一个基于多个联系人的示例：\n\n```json\n{\n  \"contacts\"\
  : [\n    {\n      \"firstName\": \"Alessandro\",\n      \"lastName\": \"Del Sole\"\
  ,\n      \"dateOfBirth\": \"1977-05-10T00:00:00\",\n      \"age\": 44,\n      \"\
  isFamilyMember\": false\n    },\n    {\n      \"firstName\": \"Robert\",\n     \
  \ \"lastName\": \"White\",\n      \"dateOfBirth\": \"1990-01-01T00:00:00\",\n  \
  \    \"age\": 32,\n      \"isFamilyMember\": true\n    }\n  ]\n}\n```\n\n任何 JSON\
  \ 标记必须封装在括号之间。方括号表示数组，单个对象（在括号内）位于数组内部并用逗号分隔。你可以有一个拥有自身属性和集合的根对象。例如，考虑以下 C# 代码：\n\
  \n```csharp\npublic class People\n{\n  public List<Contact> Contacts { get; set;\
  \ }\n  public int ID { get; set; }\n  public string Owner { get; set; }\n}\n```\n\
  \n它由以下 JSON 表示：\n\n```json\n{\n  \"contacts\": [\n    {\n      \"firstName\": \"\
  Alessandro\",\n      \"lastName\": \"Del Sole\",\n      \"dateOfBirth\": \"1977-05-10T00:00:00\"\
  ,\n      \"age\": 44,\n      \"isFamilyMember\": false\n    },\n    {\n      \"\
  firstName\": \"Robert\",\n      \"lastName\": \"White\",\n      \"dateOfBirth\"\
  : \"1990-01-01T00:00:00\",\n      \"age\": 32,\n      \"isFamilyMember\": true\n\
  \    }\n  ],\n  \"id\": 0,\n  \"owner\": \"System administrator\"\n}\n```\n\n\n\n\
  \n\n在之前的示例中，JSON 标记代表许多相同类型的对象，但你可以在同一个节点下拥有不同的对象。JSON 不仅用于格式化 Web API 服务向客户端返回的数据响应，还用于封装客户端向服务调用\
  \ API 的请求信息。在接下来的章节中将通过 Web API 的实际实现进行更详细的解释，但目前你只需要知道，从客户端到服务的请求将包含以下标头：\n\n`Content-Type:\
  \ application/json`\n\n`Accept: application/json`\n\n当客户端从 Web API 接收数据时，它们需要将生成的\
  \ JSON 转换为 C# 对象。幸运的是，有许多库让你非常快速地完成这一操作。这在接下来的章节中也会进行解释。\n\n### 在 Visual Studio\
  \ 中创建 Web API\n\n你现在将学习如何使用 C# 和 ASP.NET Core 创建 Web API 服务，在接下来的章节中，你将学习如何从 Xamarin.Forms\
  \ 解决方案中消费此服务。示例 Web API 将模拟一个远程书架，你可以从那里读取书籍信息，也可以在那里添加新书。正如你想象的，在一个章节内不可能对 ASP.NET\
  \ Core 和 Web API 技术进行总结，因此解释将集中在使用 Visual Studio 开发 Web API 服务最重要的概念上。为了与从 Xamarin.Forms\
  \ 消费 Web API 的微软文档（https://docs.microsoft.com/en-us/aspnet/core/mobile/native-mobile-backend）保持一致，并为了提供尽可能抽象的实现，数据将通过内存集合而不是数据库提供。\n\
  \n在现实世界中，公司使用关系型数据库存储远程信息，例如 Microsoft SQL Server、MySQL、PostgreSQL 或 Azure  SQL。这里无法预测所有可能的场景，因此数据存储将实际上取决于你加入的公司。然而，数据交换的方式将是相同的。有关更多信息，你可以阅读关于\
  \ Microsoft Entity Framework 的内容，这是以 .NET 访问数据库的技术（https://docs.microsoft.com/en-us/ef/）。\n\
  \n准备好后，在 Visual Studio 中打开 `Create a new project`（创建新项目）对话框，并找到 `ASP.NET Core Web\
  \ API project` 模板，如图[图 12.1]所示。你可以在搜索框中输入 Web API 来帮助自己：\n\n![](img/Figure-12.1.jpg)\n\
  \n**图 12.1：** 创建新的 Web API 项目\n\n完成后，点击 `Next`（下一步）。在下一个屏幕上，指定 `BookService` 为新项目的名称（参见[图\
  \ 12.2]），然后再次点击 `Next`：\n\n![](img/Figure-12.2.jpg)\n\n**图 12.2：** 指定项目名称\n\n在 `Additional\
  \ information`（附加信息）对话框中（参见[图 12.3]），你将看到 Visual Studio 如何建议将机器上安装的最新 .NET 版本作为框架。如果你安装了\
  \ .NET 6，确保选择了此版本，或者确保选择了尽可能高的版本：\n\n![](img/Figure-12.3.jpg)\n\n**图 12.3：** 指定项目属性\n\
  \n在 `Authentication`（身份验证）类型字段中，你可以指定以下验证模式之一：\n\n* **None**：这是匿名验证类型，允许客户端在无需验证的情况下访问信息。\n\
  * **Microsoft identity platform**：这是 Microsoft Active Directory 验证技术的演进，基于 OAuth\
  \ 2.0 标准。\n* **Windows**：用于 Windows 域内，允许通过登录 Windows 的用户凭据对客户端进行身份验证。\n\n就像数据存储一样，为了简单起见，并因为无法预测你将工作的任何真实场景，这里使用了\
  \ `None authentication`。许多公司还根据用户名和密码实现自己的身份验证机制，这在现实中并不罕见。保持所有选项不变并点击 `Create`（创建）。几秒钟后，项目将准备就绪。Visual\
  \ Studio 会自动生成模拟天气预报服务的代码。本章将使用这些代码，以便你逐步学习如何手动实现必要的组件，但没有必要删除任何文件。\n\n# 理解项目结构\n\
  \n关于 Web API 项目的结构，你需要了解一些相关点。第一点是控制器（controllers）。控制器是一个可以被视为向公开的 API 调用容器的类，其中\
  \ API 调用是可从客户端应用程序调用并返回结果的 .NET 方法。当你创建一个 Web API 项目时，会向 `WeatherForecastController.cs`\
  \ 文件添加一个名为 `WeatherForecastController` 的默认示例控制器。你将在创建新的运行时学习更多关于控制器的知识，但你现在需要知道的是控制器包含了希望客户端能够调用的方法。你需要了解第二点是服务的配置信息，存储在两个\
  \ JSON 文件中：`appsettings.json` 和 `launchSettings.json`。\n\nJSON 现在广泛用于定义项目配置，特别是在\
  \ Visual Studio 的最新版本中，取代了 XML。因此，它不仅用于数据交换，还用于本地对象定义。\n\n这两个文件都受你设置项目属性方式的影响，但在创建新项目时，它们具有标准结构。`appsettings.json`\
  \ 文件决定了日志系统如何跟踪运行时流，而 `launchSettings.json` 文件存储了在项目属性中设置的启动和发布信息。没有必要直接更改它们，因为你将使用专用的\
  \ Visual Studio 窗口。你需要知道的是，这些文件是 Visual Studio 存储某些配置的物理位置。查看它们的内容由你决定。下一个要讨论的点是\
  \ `Program.cs` 文件。\n\n在 .NET 6 中，`Program.cs` 文件包含隐式定义在 `Program` 类中的代码。这意味着没有 `Program\
  \ { }` 类块，只有类的体。在较低的版本中，`Program { }` 类块仍然显式定义。\n\n此文件包含 `Program` 类以及所有必要的启动代码，并且在创建新项目时，具有以下内容：\n\
  \n```cs\nvar builder = WebApplication.CreateBuilder(args);\n\n// 向容器中添加服务\nbuilder.Services.AddControllers();\n\
  // 更多关于在 https://aka.ms/aspnetcore/swashbuckle 配置 Swagger/OpenAPI 的信息\nbuilder.Services.AddEndpointsApiExplorer();\n\
  builder.Services.AddSwaggerGen();\n\nvar app = builder.Build();\n\n// 配置 HTTP 请求管道\n\
  if (app.Environment.IsDevelopment())\n{\n  app.UseSwagger();\n  app.UseSwaggerUI();\n\
  }\n\napp.UseHttpsRedirection();\napp.UseAuthorization();\napp.MapControllers();\n\
  app.Run();\n```\n\n\n\n\n`builder` 变量类型为 `WebApplicationBuilder`，负责通过一个名为 `Services`（类型为\
  \ `IServiceCollection`）的集合定义 Web API 暴露的服务。其 `AddControllers` 方法将项目中找到控制器添加到暴露的服务列表中；`AddEndpointsApiExplorer`\
  \ 方法暴露包含控制器列表和其他服务的元数据，以便客户端了解该服务提供了哪些功能；`AddSwaggerGen` 方法添加了对 Swagger ([`swagger.io/`](https://swagger.io/))\
  \ 的支持，Swagger 是一个自动生成 Web API 文档的工具。Swagger 并不是 .NET 的一部分，它由 Visual Studio 作为 NuGet\
  \ 包自动添加到解决方案中。你将在“本地测试 Web API”（Testing the Web API Locally）部分看到 Swagger 生成的结果。`app`\
  \ 变量类型为 `WebApplication`，代表正在运行的 Web API 服务实例。这是一个关键点：Web API 服务是静态服务，这意味着它只在被调用时才会创建实例。接下来的几行代码检测该服务是否运行在开发机（如你的机器）上；如果是，它将启用服务显示由\
  \ Swagger 生成的文档。接下来，它通过 `UseHttpsRedirection` 方法启用所谓的 HTTPS 重定向。这很重要，特别是在调试时，因为本地通信是通过\
  \ HTTP 而非 HTTPS 进行的，因此此机制确保 HTTP 调用被解释为 HTTPS。最后两个方法 `MapControllers` 和 `Run` 分别完成控制器的暴露并启动\
  \ Web API 服务的实例。你仍然需要对 `Program.cs` 文件进行工作。事实上，你需要将处理数据的类实例指定为服务之一。这将在下一节中完成。\n\n\
  # 创建数据模型\n\n示例项目的目标是暴露一些调用，以便对虚拟的“书架”（`bookshelf`）进行操作，因此你需要一个代表单本书的类。它可以非常简单，如下定义所示：\n\
  \n```csharp\npublic class Book\n{\n    public int ID { get; set; }\n    public string\
  \ Title { get; set; }\n    public DateTime PublicationDate { get; set; }\n    public\
  \ string ISBN { get; set; }\n}\n```\n\n`ID` 属性很重要，因为它允许唯一标识一个对象，并且它将用于 API 方法用于检索此类唯一对象。现在，你需要一个可以处理数据的服务。Web\
  \ API 项目要求你首先定义一个称为 service 的接口，该接口建立了一组处理数据的方法和属性。以下代码显示了如何定义一个处理书籍的服务接口：\n\n```csharp\n\
  public interface IBookRepository\n{\n    bool DoesItemExist(int id);\n    IEnumerable<Book>\
  \ All { get; }\n    Book Find(int id);\n    void Insert(Book item);\n    void Update(Book\
  \ item);\n    void Delete(int id);\n}\n```\n\n**提示：`Repository` 后缀不是强制的，但为了与官方 Web\
  \ API 文档中的项目示例保持一致。**\n\n成员名称是自言自语的：`DoesItemExist` 检查给定 id 的 `Book` 对象是否已存在；`All`\
  \ 是一个返回 `Book` 对象完整列表的属性；`Find` 根据 id 返回一个特定实例；而 `Insert`、`Update` 和 `Delete` 则允许添加、修改和删除\
  \ `Book` 类的实例。到此时，你需要一个实现 `IBookRepository` 接口的类。在现实世界中，此类类将实现访问数据库的方法，但在本示例中，它将与示例内存集合一起工作。它被称为\
  \ `BookRepository`，定义如下：\n\n```csharp\npublic class BookRepository : IBookRepository\n\
  {\n    private List<Book> Books;\n    public IEnumerable<Book> All => Books;\n \
  \   public BookRepository()\n    {\n        InitializeData();\n    }\n\n    public\
  \ void Delete(int id)\n    {\n        Books.Remove(this.Find(id));\n    }\n\n  \
  \  public bool DoesItemExist(int id)\n    {\n        return Books.Any(item => item.ID\
  \ == id);\n    }\n\n    public Book Find(int id)\n    {\n        return Books.FirstOrDefault(item\
  \ => item.ID == id);\n    }\n\n    public void Insert(Book item)\n    {\n      \
  \  Books.Add(item);\n    }\n\n    public void Update(Book item)\n    {\n       \
  \ var book = this.Find(item.ID);\n        var index = Books.IndexOf(book);\n   \
  \     Books.RemoveAt(index);\n        Books.Insert(index, item);\n    }\n\n    private\
  \ void InitializeData()\n    {\n        Books = new List<Book>();\n        var book1\
  \ = new Book\n        {\n            ID = 1,\n            ISBN = \"9789391392871\"\
  ,\n            Title = \"Practitioner’s Guide to Data Science\",\n            PublicationDate\
  \ = new DateTime(2022, 1, 1)\n        };\n        var book2 = new Book\n       \
  \ {\n            ID = 2,\n            ISBN = \"9789355510068\",\n            Title\
  \ = \"IoT for Beginners\",\n            PublicationDate = new DateTime(2021, 12,\
  \ 1)\n        };\n        var book3 = new Book\n        {\n            ID = 3,\n\
  \            ISBN = \"9789355511102\",\n            Title = \"iOS 15 Application\
  \ Development for Beginners\",\n            PublicationDate = new DateTime(2021,\
  \ 12, 1)\n        };\n        Books.Add(book1);\n        Books.Add(book2);\n   \
  \     Books.Add(book3);\n    }\n}\n```\n\n之前的代码使用了你已经熟悉的的技术。它在 `Books` 集合上调用 `Add`\
  \ 和 `Remove` 方法来插入和删除 `Book` 实例，并调用 `FirstOrDefault` 方法根据 id 检索特定的 `Book` 实例。`All`\
  \ 属性简单地返回 `Books` 集合的内容，而 `Update` 方法首先从集合中删除现有 `Book` 对象实例，然后添加一个包含任何编辑的新实例。`Insert`、`Update`\
  \ 和 `Delete` 方法将映射到控制器中的 `POST`、`PUT` 和 `DELETE` HTTP 动词，而 `All` 属性将映射到 `GET` 动词。`InitializeData`\
  \ 方法生成一些示例数据，模拟数据库表。\n\n**提示：在现实世界中，不建议从数据库（或其他数据源）物理删除项目。更好的方法是在数据库中添加一个名为 `IsDeleted`（或类似的）布尔列，并在删除对象时将其值设置为\
  \ true。这将需要你更改返回列表的方法，以过滤掉 `IsDeleted` 值为 true 的项。**\n\n在使用数据服务之前，需要将其添加到 Web API\
  \ 暴露的服务集合中。为了实现这一点，你需要将加粗显示的代码行添加到 `Program.cs` 文件中：\n\n```csharp\nvar builder =\
  \ WebApplication.CreateBuilder(args);\n// 将服务添加到容器中。\nbuilder.Services.AddSingleton<IBookRepository,\
  \ BookRepository>();\nbuilder.Services.AddControllers();\n```\n\n`AddSingleton`\
  \ 方法添加指定数据服务的唯一实例。你需要指定服务接口和一个专门的实现。\n\n### 实现控制器\n\n下一步是实现客户端可以调用以对数据执行操作的方法，这必须在控制器内部完成。Visual\
  \ Studio 提供了简化控制器类生成的工具。要实现这一点，右键点击“解决方案管理器”中的项目名称，并选择“添加” | “新建脚架项目”。\n\n**提示：在\
  \ Visual Studio 术语中，脚架（scaffolding）意味着生成已设置好工作的文件，包含了必要的引用、命名空间和最小代码。**\n\n在“新建脚架项目”对话框中（见图\
  \ 12.4），选择“API 控制器 - 空项”，然后点击“添加”。\n\n**图 12.4：添加新的 API 控制器**\n\n此时，你将为控制器文件指定名称（见图\
  \ 12.5），因此输入 `BooksController.cs` 并最后点击“添加”：\n\n**图 12.5：为控制器命名**\n\n\n\n\n\n##\
  \ 图 12.5：指定控制器的名称\n\n当新代码文件准备完成后，你首先会注意到以下类定义：\n\n```csharp\n[Route(\"api/[controller]\"\
  )]\n[ApiController]\npublic class BooksController : ControllerBase\n{\n    …\n}\n\
  ```\n\n`Route` 属性极其重要，因为它定义了控制器的 URL。在这种情况下，该控制器将通过以下方式调用：\n\n`https://serverName/BookService/api/Books`\n\
  \n`Route` 属性为服务 URL 添加了 `api` 后缀，并使得你只需指定名称（而不带 `Controller` 后缀）即可调用控制器。这在接节节测试服务时会变得更加清晰。`ApiController`\
  \ 属性确保 .NET 将该类识别为 Web API 控制器，而继承自 `ControllerBase` 则为控制器提供了特定的对象，这些对象将在接下来的章节中讨论。\n\
  \n### 获取数据\n\n你需要添加的第一段代码是类的构造函数，以及一个用于存储数据上下文实例的字段。你可以这样写：\n\n```csharp\nprivate\
  \ readonly IBookRepository bookRepository;\npublic BooksController(IBookRepository\
  \ _bookRepository)\n{\n    bookRepository = _bookRepository;\n}\n```\n\n当服务启动时，你在\
  \ `Program` 类中看到的 `AddSingleton` 方法也会调用控制器的构造函数，并传递数据上下文对象的实例。现在，你可以编写简单的代码来返回完整的书籍列表：\n\
  \n```csharp\n[HttpGet]\npublic IActionResult List()\n{\n    try\n    {\n       \
  \ return Ok(bookRepository.All);\n    }\n    catch (Exception)\n    {\n        return\
  \ BadRequest(ErrorCodes.CouldNotGetItems.ToString());\n    }\n}\n```\n\n在这种情况下，方法名\
  \ `List` 并不重要，因为服务会拦截由 `HttpGet` 属性指定的 `GET` 动词，无论方法名是什么。`List` 返回一个类型为 `IActionResult`\
  \ 的对象，它指定了成功调用以及数据，或者返回一个错误状态。`Ok` 是一个返回成功状态码以及 `bookRepository` 实例中所有对象的方法。如果发生错误，代码通过\
  \ `BadRequest` 方法返回 `Bad Request`（错误请求）状态码。该方法接受一个字符串作为参数，在此情况下是名为 `ErrorCodes`\
  \ 的枚举值的 `ToString` 转换结果，该枚举定义如下：\n\n```csharp\npublic enum ErrorCodes\n{\n    InvalidBookData,\n\
  \    BookIDInUse,\n    RecordNotFound,\n    CouldNotCreateItem,\n    CouldNotUpdateItem,\n\
  \    CouldNotDeleteItem,\n    CouldNotGetItems\n}\n```\n\n此枚举是完全自定义的，允许你发送自己的错误代码。\n\
  \n## 创建和更新数据对象\n\n下一步是编写添加和更新 `Book` 对象的代码。你添加的第一个方法称为 `create`，它如下映射 `POST` 动词：\n\
  \n```csharp\n[HttpPost]\npublic IActionResult Create([FromBody] Book item)\n{\n\
  \    try\n    {\n        if (item == null || !ModelState.IsValid)\n        {\n \
  \           return BadRequest(ErrorCodes.InvalidBookData.ToString());\n        }\n\
  \        bool itemExists = bookRepository.DoesItemExist(item.ID);\n        if (itemExists)\n\
  \        {\n            return StatusCode(StatusCodes.Status409Conflict, ErrorCodes.BookIDInUse.ToString());\n\
  \        }\n        bookRepository.Insert(item);\n    }\n    catch (Exception)\n\
  \    {\n        return BadRequest(ErrorCodes.CouldNotCreateItem.ToString());\n \
  \   }\n    return Ok(item);\n}\n```\n\n首先需要强调的是，该方法接收要添加的 `Book` 对象作为参数，该对象也装饰了\
  \ `FromBody` 属性。这意味着该对象位于 HTTP 请求正体中，.NET 将从那里解码数据。代码理解起来非常简单：如果对象为 `null` 或数据模型不处于有效状态（`!ModelState.IsValid`），则发送\
  \ `BadRequest`；如果集合中已存在相同 `ID` 的对象，则调用 `StatusCode` 方法发送代码为 `409` 的 HTTP 错误，这意味着数据冲突（`StatusCodes.Status409Conflict`）；如果一切正常，则调用\
  \ `Insert` 方法将新对象添加到集合中。\n\n**提示：记住，在现实世界，对数据的检查以及对 `Insert` 等方法的调用将针对数据访问层（例如 Entity\
  \ Framework）进行，而不是针对内存集合。**\n\n在更新现有项时，你可以编写以下映射 `PUT` 动词的方法：\n\n```csharp\n[HttpPut]\n\
  public IActionResult Edit([FromBody] Book item)\n{\n    try\n    {\n        if (item\
  \ == null || !ModelState.IsValid)\n        {\n            return BadRequest(ErrorCodes.InvalidBookData.ToString());\n\
  \        }\n        var existingItem = bookRepository.Find(item.ID);\n        if\
  \ (existingItem == null)\n        {\n            return NotFound(ErrorCodes.RecordNotFound.ToString());\n\
  \        }\n        // 更新逻辑...\n    }\n    catch (Exception)\n    {\n        return\
  \ BadRequest(ErrorCodes.CouldNotUpdateItem.ToString());\n    }\n    return Ok(item);\n\
  }\n```\n\n（此处与之前方法的区别在于，代码会检查项是否存在，如果存在，则调用 `Update` 方法；否则，发送错误。）\n\n### 删除对象\n\n\
  控制器的最后部分涉及实现从数据上下删除指定对象的操作，并映射 `DELETE` 动词。\n\n```csharp\n[HttpDelete(\"{id}\")]\n\
  public IActionResult Delete(int id)\n{\n    try\n    {\n        var item = bookRepository.Find(id);\n\
  \        if (item == null)\n        {\n            return NotFound(ErrorCodes.RecordNotFound.ToString());\n\
  \        }\n        bookRepository.Delete(item);\n    }\n    catch (Exception)\n\
  \    {\n        return BadRequest(ErrorCodes.CouldNotDeleteItem.ToString());\n \
  \   }\n    return NoContent();\n}\n```\n\n你可能立即发现了与之前方法有几点区别。首先，`HttpDelete` 属性要求指定\
  \ ID。这意味着对象的 `ID` 会随 URL 一起发送，例如 `https://serverName/api/Books/1`。这里的 `1` 是一个示例\
  \ ID。第二个区别是方法参数不再通过 `FromBody` 传递，而是从 URL 获取。如果找到了指定 ID 的对象，则调用 `Delete` 方法。\n\n\
  ## 测试 Web API 服务\n\n正如任何其他应用程序一样，Web API 服务在发布给公众之前必须经过调试和测试。由于 Visual Studio 安装程序设置了一个名为\
  \ Internet Services Express（简称 IIS Express）的执行环境，在开发机器上测试和调试服务非常简单。IIS Express 不进行详细讨论，因此你可以查看文档获取更多信息。你只需按\
  \ F5 即可启动服务。\n\n\n\n\n\n安装证书后，你的 Web API 服务将启动，你的默认浏览器将显示 Swagger 用户界面，如图 12.8 所示：\n\
  \n![](img/Figure-12.8.jpg)\n\n**图 12.8：安装自动生成的 SSL 证书**\n\n在 Web API 项目中添加 Swagger\
  \ 是最近才，这是一个非常棒的改进，因为该库会自动生成你的 Web API 文档，并具有非常友的用户界面。你可以浏览 API 调用，查看它们的参数，通过点击每个调用旁边的\
  \ `Try it out` 按钮直接尝试 API，并在必要时输入相应的参数。虽然内置的工具在测试 API 调用方面效果非常好，但大多数公司会使用更高级的测试和调试工具，例如你之前下载并安装的\
  \ Postman。\n\n# 使用 Postman 进行 API 调用(#toc.xhtml_s362a)\n\nPostman 是一个非常强大的工具，在本章中，你将使用它最常用的功能来支持带有\
  \ JSON 请求和响应的 API 调用。当你打开 Postman 时，要做的第一件事是配置请求头，以包含对 JSON 内容的支持。点击 `Headers` 选项卡（参见图\
  \ 12.9），滚动预填充的头列表并添加一个名为 `Content-Type` 的新头（内置的补全引擎会在此帮助你）。该头的值 `application/json`：\n\
  \n![](img/Figure-12.9.jpg)\n\n**图 12.9：设置 Postman**\n\n完成后后，在地址栏中输入 Web API 服务的\
  \ URL（可以从你浏览器的地址栏获取），后面加上 `api/Books` 后缀。你可能记得此后缀是如何通过 `BooksController` 类定义中的 `Route`\
  \ 属性设置的。\n\n**提示：你的 Web API 服务托管在本地服务器上，称为 `localhost`，地址由冒号后的端口号指定。在当前示例中，它是 `https://localhost:7123`。你可以通过选择\
  \ `Debug` | `ProjectName Debug Properties` 然后找到 `Launch Profiles` 对话框中的 `App URL`\
  \ 字段来更改它。**\n\n确保地址栏左侧选择了 `GET` 动词，如图 12.10 所示，然后点击 `Send`。在窗口底部，你将看到 JSON 格式的 `Book`\
  \ 对象列表（参见图 12.10）。此外，请注意 Postman 如何显示 `HTTP` 状态码（`Status 200 OK`）以及接收请求和发送响应所需的毫秒时间：\n\
  \n![](img/Figure-12.10.jpg)\n\n**图 12.10：通过 GET 调用检索数据**\n\n你不需要其他任何东西，因为 Web API\
  \ 服务只是在响应 `HTTP GET` 请求。如果你需要传递参数（例如为了过滤查询结果），你可以使用与 `DELETE` 动词相同的方法。写入新数据需要 `POST`\
  \ 调用，因此请确保在地址栏左侧的组合框中从 `GET` 更改为 `POST`。你还需要传递新 `Book` 对象的信息。为了实现这一点，点击 `Body` 选项卡（参见图\
  \ 12.11）然后选择 `raw` 内容类型。这允许直接以 JSON 提供对象信息。你可以选择其他方法，但这在这里不属于讨论范围。根据你的意愿提供新对象信息，然后点击\
  \ `Send`。如果一切顺利，Web API 服务将返回新对象的实例，它显示在窗口底部：\n\n![](img/Figure-12.11.jpg)\n\n**图\
  \ 12.11：通过 POST 调用写入数据**\n\n如果你想更新现有对象，请将 HTTP 动词从 `POST` 更改为 `PUT`，并在对象的 JSON 中，首先指定现有项目的\
  \ `ID`，然后根据需要更改其他属性；最后，点击 `Send`。最后一个 API 调用映射到 `DELETE` 动词，因此将选择从 `PUT` 更改为 `DELETE`，然后在地址栏中添加一个斜杠，后跟你想删除的对象的\
  \ `ID`（参见图 12.12）。如果一切按预期工作，Web API 服务将返回 `204 status` 状态码（`No Content`）。\n\n![](img/Figure-12.12.jpg)\n\
  \n**图 12.12：通过 DELETE 调用删除项目**\n\n在使用 Postman 之后，在现实世界中，你可能会从移动应用调用 API 以检查一切是否运行正常，并在将所有内容发布到远程服务器之前进行必要的调试。然而，仅出于教学目的，Web\
  \ API 服务现在将首先发布到 Azure，最后由 Xamarin 调用。\n\n# 发布 API 服务(#toc.xhtml_s36a)\n\nWeb API\
  \ 服务，以及通常的 Web 应用程序，可以发布到不同的目标，例如本地服务器、云平台、本地服务器甚至 ZIP 程序包。Visual Studio 集成了对所有这些场景的支持，并从\
  \ Azure 发布。假设你已经设置了 Azure 订阅，在 `Solution Explorer`（解决方案管理器）中，右键点击项目，然后点击 `Publish`（发布）。当\
  \ `Publish` 对话框出现时（参见图 12.13），选择 `Azure` 作为目标并点击 `Next`。\n\n![](img/Figure-12.13.jpg)\n\
  \n**图 12.13：选择发布配置文件**\n\n发布到 Azure 需要设置两个构建模块：作为容器的应用服务和一个 Web 服务。确保所选的 Subscription（订阅）名称已分配你的订阅，如果不存在资源组，请点击\
  \ `New` 按钮创建一个。在 `Hosting Plan combo`（托管计划组合框）框中，确保选择了之前创建的托管计划。准备就绪后，点击 `Create`。下一步是定义托管计划，这意味着选择数据中心区域和规模的大小。如果你查看图\
  \ 12.14，你可以看到 Visual Studio 如何为托管计划生成名称，你可以对其保持不变。`Location`（位置）组合框允许你选择一个区域。选择离你居住\
  \ `Country`（国家）最近的一个以减少带宽和延迟。在 `Size`（大小）组合框中，确保你选择了 `Free plan`。该计划提供的计算资源比其他计划少，但对于本章的目的已经足够了。设置好后，点击\
  \ `OK`：\n\n![](img/Figure-12.14.jpg)\n\n**图 12.14：选择托管计划**\n\n在 `App Service (Windows)`\
  \ 对话框中（参见图 12.15），为服务输入一个名称，或者保持 Visual Studio 建议的名称不变。这将用于在 Azure 管理门户中标识该服务。确保资源组已分配你的订阅，如果不存在资源组，请点击\
  \ `New` 按钮创建一个。在 `Hosting Plan` 框中，确保选择了之前创建的托管计划。准备就绪后，点击 `Create`。\n\n![](img/Figure-12.15.jpg)\n\
  \n**图 12.15：配置 Azure 服务资源**\n\n此时，你将收到 Web API 的摘要信息，特别是名称，如图 12.16 所示。Visual Studio\
  \ 自动提供了一个名称，在本例中为 `BookServiceapi`，这是可以接受的，所以保持原样。确保 `Location`、`Organization` 和\
  \ `Administrator email` 有效的值，然后点击 `OK`：\n\n![](img/Figure-12.16.jpg)\n\n**图 12.16：设置\
  \ Web API 名称**\n\n\n\n\n\n在最后一步中，提供了 Web API 服务的摘要，如图 12.17 所示。检查每个字段是否已分配了你之前决定的内容，准备好后，点击\
  \ `Create`：\n\n![](img/Figure-12.17.jpg)\n\n**图 12.17:** 配置 Web API 属性\n\n当对话框关闭时，Visual\
  \ Studio 会生成一个新的发布配置文件，该配置以后可以重用，并提供 `Publish` 按钮（参见图 12.18）。当你点击它时，Visual Studio\
  \ 开始将 Web API 服务打包并发布到你的 `Azure subscription`。发布所需的时间取决于项目的复杂性，因此在这种情况下，它应该非常快\n\
  \n![](img/Figure-12.18.jpg)\n\n**图 12.18:** 检查发布选项\n\n当发布过程完成后，Visual Studio 将打开你默认浏览器的实例，并指向\
  \ Web API 服务的地址。然而，这可能会导致 `404 – Not found error`，因为示例服务没有定义用户界面，而且默认情况下，Azure 会自动配置\
  \ Web API 服务，使得出于安全考虑，任何调用都应包含订阅密钥（subscription key）。当前的示例服务基于匿名验证，因此你需要禁用包含订阅密钥；否则，没有任何客户端能够调用\
  \ API（除非你明显包含了订阅密钥）。要实现这一点，请打开 Azure 管理门户网站 ([`portal.azure.com`](https://portal.azure.com))\
  \ 并使用你的凭据登录。当门户出现时，在最近使用的资源列表中点击 `BookServiceapi` 资源（或你之前指定的名称）。这将打开 Web API 的管理页面。在屏幕左侧，点击工具栏上的\
  \ `APIs`，然后点击位于工具栏和详细视图之间列中的服务名称（参见图 12.19）。当详细信息出现在屏幕右侧时，点击 `Settings` 选项卡，并在页面底部找到并取消勾选\
  \ `Subscription` 选字段。\n\n**提示：你始终可以通过在 API 请求中包含 `Ocp-Apim-Subscription-Key` 请求头来包含订阅密钥，以实现更安全的\
  \ Web API 访问，就像你在 Postman 中处理 `Content-Type` 请求头那样，你可以通过点击工具栏上的 `Subscriptions`\
  \ 获取订阅密钥。在下一节中，你将获得在 C# 中添加头的示例。**\n\n![](img/Figure-12.19.jpg)\n\n**图 12.19:**\
  \ 在 Azure 上访问 Web API 属性\n\n准备好后，点击 `Save`。记住服务 URL，你可以在 Web service URL 字段中找到它。稍后将使用它。如果你愿意，可以关闭管理门户。在从\
  \ Xamarin.Forms 项目中使用服务之前，最好通过 Postman 进行测试，以确保一切设置正确。要实现这一点，请按照以下步骤操作：\n\n1. 打开\
  \ Postman。\n2. 在地址栏中，将服务的本地地址替换为从 Azure 管理门户复制的地址。\n3. 重复上一节描述的步骤，进行 API 调用以读取、插入和删除数据。\n\
  \n当你检查一切一切按预期工作后，你就可以进入练习的最后部分了：从 Xamarin.Forms 项目中消费远程服务。\n\n**即使 Azure 订阅默认启用了支出限额（spending\
  \ limit），即使你选择了免费托管计划，也建议删除不再使用的资源，特别是在你实验时，以避免产生银行账户费用的风险。仅仅关闭服务是不够的，你需要完全删除未使用的资源和服务。当前的示例服务可能此类此类。**\n\
  \n# 使用 Xamarin.Forms 消费 Web API](#toc.xhtml_s364a)\n\n在本节中，你将学习如何从 Xamarin.Forms\
  \ 调用 Web API 服务并与原生移动应用中的数据进行交互。你获得的大部分知识在这里将被重复，因此我们将只关注新概念。你可以向现有解决方案添加新的 Xamarin.Forms\
  \ 项目，以便将所有示例代码都放在一个地方。要实现这一点，在 `Solution Explorer` 中，右键点击解决方案名称，然后点击 `Add` | `New\
  \ Project`。通过复用已有的技能，创建一个名为 `BookClient` 的新 Xamarin.Forms 项目。当项目准备好后，要的第一件事是对 .NET\
  \ 和 C# 添加 JSON 支持。最新版本的 .NET 包含了通过 `System.Text.Json` 命名空间对 JSON 的原生支持，但在 Xamarin.Forms\
  \ 中不可用（它在 .NET MAUI 中可用）。此外，有一个名为 `Newtonsoft.Json` 的库，多年来它已成为处理 JSON 数据的事实标准，因此你将学习如何使用它，准备好处理利用该库的现有项目。在\
  \ `Solution Explorer` 中，右键点击 `BookClient` 项目名称（仅限共享项目），然后选择 Manage NuGet Packages。当显示\
  \ NuGet 用户界面时，你会看到 `Newtonsoft.Json` 包已出现在最受欢迎的列表中（参见图 12.20）。选择该包并点击 `Install`。\n\
  \n![](img/Figure-12.20.jpg)\n\n**图 12.20:** 安装 Newtonsoft.Json 包\n\n现在你已经添加了对 JSON\
  \ 支持，可以基于 Model-View-ViewModel（MVVM）模式创建必要的基础。\n\n## 创建数据模型](#toc.xhtml_s365a\n\n\
  在代码方面，你首先需要一个表示书的类。然而，该类以及你在下一节中创建的 ViewModel 都发送更改通知，因此创建一个实现 `INotifyPropertyChanged`\
  \ 接口的基类是一个好主意，它将被模型和 ViewModel 使用。你可以将类命名为 `NotifyBase` 并定义如下：\n\n```csharp\nusing\
  \ System.ComponentModel;\nusing System.Runtime.CompilerServices;\n\nnamespace BookClient.Model\n\
  {\n    public class NotifyBase : INotifyPropertyChanged\n    {\n        public event\
  \ PropertyChangedEventHandler PropertyChanged;\n        public void OnPropertyChanged([CallerMemberName]\
  \ string propertyName = null)\n        {\n            PropertyChanged?.Invoke(this,\
  \ new PropertyChangedEventArgs(propertyName));\n        }\n    }\n}\n```\n\n此时，你可以定义一个名为\
  \ `Book` 的类，它具有与 Web API 服务中定义的 `Book` 类相同的属性，但增加了属性更改通知，以便用户界面能够根据更改自动刷新。以下是 `Book`\
  \ 类的简单代码：\n\n```csharp\nusing System;\n\nnamespace BookClient.Model\n{\n    public\
  \ class Book : NotifyBase\n    {\n        private int _id;\n        public int ID\n\
  \        {\n            get { return _id; }\n            set { _id = value; OnPropertyChanged();\
  \ }\n        }\n\n        private string _title;\n        public string Title\n\
  \        {\n            get { return _title; }\n            set\n            {\n\
  \                _title = value; OnPropertyChanged();\n            }\n        }\n\
  \n        private DateTime _publicationDate;\n        public DateTime PublicationDate\n\
  \        {\n            get { return _publicationDate; }\n            set { _publicationDate\
  \ = value; OnPropertyChanged(); }\n        }\n\n        private string _isbn;\n\
  \        public string ISBN\n        {\n            get { return _isbn; }\n    \
  \        set { _isbn = value; OnPropertyChanged(); }\n        }\n    }\n}\n```\n\
  \n现在你已经有了数据模型，是时候编写 ViewModel 并学习如何与 Web API 服务进行通信了。\n\n## 创建 ViewModel](#toc.xhtml_s366a)\n\
  \n\n\n\nViewModel 将负责向用户界面暴露数据以及执行数据操作的命令。你可以将 viewmodel 类命名为 `BookViewModel` 并让其派生自\
  \ `NotifyBase`。该类需要暴露 `Book` 对象的集合以及单个 `Book` 实例，该实例稍后将绑定到界面中 `CollectionView` 的选中项。定义可以如下：\n\
  \n```csharp\nusing BookClient.Model;\nusing Newtonsoft.Json;\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Collections.ObjectModel;\nusing System.Linq;\n\
  using System.Net.Http;\nusing System.Text;\nusing System.Threading.Tasks;\nusing\
  \ Xamarin.Forms;\n\nnamespace BookClient.ViewModel\n{\n    public class BookViewModel\
  \ : NotifyBase\n    {\n        private ObservableCollection<Book> _books;\n    \
  \    public ObservableCollection<Book> Books\n        {\n            get { return\
  \ _books; }\n            set { _books = value; OnPropertyChanged(); }\n        }\n\
  \n        private Book _selectedBook;\n        public Book SelectedBook\n      \
  \  {\n            get { return _selectedBook; }\n            set { _selectedBook\
  \ = value; OnPropertyChanged(); }\n        }\n\n        private const string baseAddress\
  \ = \"https://yourapiservice.azurewebsites.net/api/books\";\n        public BookViewModel()\n\
  \        {\n            Books = new ObservableCollection<Book>();\n        }\n \
  \   }\n```\n\n注意构造函数如何创建 `Books` 集合的实例以避免空引用。此外，注意定义了一个名为 `baseAddress` 的常量，它包含了你的\
  \ Web API 服务的地址。该常量的值必须替换为你之前在 Azure 管理门户检索的 URL，或者如果你正在使用本地服务器，则是你服务器上 Web API\
  \ 服务的地址。下一步是定义添加、编辑和删除数据的命令。添加数据的方式如下：\n\n```csharp\npublic Command AddCommand\n\
  {\n    get\n    {\n        return new Command(async () =>\n        {\n         \
  \   var newBook = new Book();\n            newBook.ID = Books.Max(b => b.ID) + 1;\n\
  \            Books.Add(newBook);\n            await PostBookAsync(newBook);\n  \
  \      });\n    }\n}\n```\n\n此命令创建了一个 `Book` 类的实例，并自动为其 `ID` 属性分配一个比集合中现有最高 ID 值的值，该值是通过\
  \ `IEnumerable` 接口的 `Max` 扩展方法获取的。这样做是为了提供一个有效的 ID，无需用户手动操作。命令最后调用了一个名为 `PostBookAsync`\
  \ 的方法，该方法将在后续章节中定义，因此请忽略代码编辑器中的任何波浪线。删除对象的命令实现更为简单：\n\n```csharp\npublic Command\
  \ DeleteCommand\n{\n    get\n    {\n        return new Command(async () =>\n   \
  \     {\n            Books.Remove(SelectedBook);\n            await DeleteBookAsync(SelectedBook);\n\
  \        });\n    }\n}\n```\n\n简而言之，用户界面中当前选中的对象首先从集合中移除，然后通过名为 `DeleteBookAsync`\
  \ 的方法远程删除，该方法也将在后续章节中描述。更新现有的 `Book` 实例更为简单，通过以下命令定义完成：\n\n```csharp\npublic Command\
  \ UpdateCommand\n{\n    get\n    {\n        return new Command(async () =>\n   \
  \     {\n            await PutBookAsync(SelectedBook);\n        });\n    }\n}\n\
  ```\n\n名为 `PutBookAsync` 的方法将把当前选中对象的实例发送到 Web API，但不需要进行其他操作，因为编辑已经反映在 `Books`\
  \ 集合中了。此时，你需要定义上述所有允许与 Web API 服务交互的方法。\n\n# 在 C# 中调用 Web API 服务\n\n在 .NET 开发中，有许多选项可以处理远程服务，但\
  \ `System.Net.Http` 命名空间下的 `HttpClient` 类是最常用的，特别是在 `Xamarin.Forms` 中。`HttpClient`\
  \ 类允许轻松处理基于 REST 的服务，例如 `GetAsync`、`PostAsync`、`PutAsync` 和 `DeleteAsync` 等方法。其类型为\
  \ `Uri` 的 `BaseAddress` 属性可填充 `DefaultHeaders`。除非需要在多个方法之间共享 `HttpClient` 实例，否则建议使用\
  \ `using` 块创建一个实例，以确保它在使用后被释放。你想要实现的第一个操作是从 API 获取书籍列表。要实现这一点，请编写以下方法：\n\n```csharp\n\
  public async Task GetBooks()\n{\n    using (var client = new HttpClient())\n   \
  \ {\n        client.BaseAddress = new Uri(baseAddress);\n        var result = await\
  \ client.GetAsync(client.BaseAddress);\n        if (result.SuccessStatusCode)\n\
  \        {\n            var resultContent = await result.Content.ReadAsStringAsync();\n\
  \            var deserializedBooks = JsonConvert.DeserializeObject<List<Book>>(resultContent);\n\
  \            foreach (var book in deserializedBooks)\n            {\n          \
  \      Books.Add(book);\n            }\n        }\n    }\n}\n```\n\n你可以看到，`BaseAddress`\
  \ 属性被赋值为 `baseAddress` 字段。在这种情况下不需要任何自定义。`ReadAsStringAsync` 获取数据的 JSON。根据网络服务返回的当前示例数据，`ReadAsStringAsync`\
  \ 的结果是如下 JSON：\n\n```json\n[{\"id\":1,\"title\":\"Practitioner’s Guide to Data Science\"\
  ,\"publicationDate\":\"2022-01-01T00:00:00\",\"isbn\":\"9789391392871\"},{\"id\"\
  :2,\"title\":\"IoT for Beginners\",\"publicationDate\":\"2021-12-01T00:00:00\",\"\
  isbn\":\"9789355510068\"},{\"id\":3,\"title\":\"iOS 15 Application Development for\
  \ Beginners\",\"publicationDate\":\"2021-12-01T00:00:00\",\"isbn\":\"9789355511102\"\
  }]\n```\n\n\n\n显然，你无法在 C# 中直接使用 JSON，因此这就是 `Newtonsoft.Json` 库大显身场的地方。`JsonConvert`\
  \ 类了一个静态方法，允许将 JSON 转换为 C# 对象（称为“反序列化”），以及将 C# 对象转换为 JSON（称为“序列化”）。Web API 的响应是一个\
  \ `Book` 对象的 JSON 数组，因此 `JsonConvert.DeserializeObject` 方法将字符串转换为 `List<Book>` 实例。你不应该直接将其转换为\
  \ `ObservableCollection`，因为 `DeserializeObject` 旨在仅与基本类型配合工作。事实上，该方法的最后一部分会遍历检索到的\
  \ `List`，并将每个 `Book` 对象添加到 `Books` 集合中。写入对象与检索数据的方式略有不同，但对于 `POST` 和 `PUT` 请求，方法是相同的。请考虑以下\
  \ `PostBookAsync` 和 `PutBookAsync` 方法：\n\n```csharp\npublic async Task PostBookAsync(Book\
  \ data)\n{\n    using (var client = new HttpClient())\n    {\n        client.BaseAddress\
  \ = new Uri(baseAddress);\n        string json = JsonConvert.SerializeObject(data);\n\
  \        var content = new StringContent(json, Encoding.UTF8, \"application/json\"\
  );\n        var result = await client.PostAsync(client.BaseAddress, content);\n\
  \    }\n}\n\npublic async Task PutBookAsync(Book data)\n{\n    using (var client\
  \ = new HttpClient())\n    {\n        client.BaseAddress = new Uri(baseAddress);\n\
  \        string json = JsonConvert.SerializeObject(data);\n        var content =\
  \ new StringContent(json, Encoding.UTF8, \"application/json\");\n        var result\
  \ = await client.PutAsync(client.BaseAddress, content);\n    }\n}\n```\n\n在这两种情况下，在创建\
  \ `HttpClient` 类实例后，你首先需要将想要发送到 Web API 的 `Book` 实例转换为 JSON 字符串。这是通过调用 `JsonConvert.SerializeObject`\
  \ 方法实现的，该方法接收你想要转换的对象作为参数。`PostAsync` 和 `PutAsync` 都需要发送适配 HTTP 通信的 JSON 内容。为此，你可以使用\
  \ `StringContent` 类，在构造函数中传递 JSON 数据、编码格式（UTF8 是合适的编码）以及 `application/json` 规范。生成的对象将连同服务地址一起传递给\
  \ `PostAsync` 和 `PutAsync`。最后一个方法名为 `DeleteBookAsync`。它首先从集合中删除指定的 `Book` 实例，然后调用\
  \ `HttpClient` 实例上的 `DeleteAsync` 向 Web API 发送 `DELETE` 请求。你设置请求的方式与前两个方法类似，区别在于目标地址。事实上，Web\
  \ API 要求客户端在服务地址后附加对象的 ID。你可以通过许多方式实现此，但在当前的示例中，ID 被附加到 `BaseAddress` 属性的值上：\n\n\
  ```csharp\npublic async Task DeleteBookAsync(Book data)\n{\n    Books.Remove(data);\n\
  \    using (var client = new HttpClient())\n    {\n        client.BaseAddress =\
  \ new Uri(baseAddress);\n        string json = JsonConvert.SerializeObject(data);\n\
  \        var content = new StringContent(json, Encoding.UTF8, \"application/json\"\
  );\n        var result = await client.DeleteAsync($\"{client.BaseAddress}/{data.ID}\"\
  );\n    }\n}\n}\n```\n\n现在 ViewModel 已经完成，你准备好编写一个允许显示和编辑数据的最小用户界面了。\n\n作为一个练习，你可以使用\
  \ `try..catch` 块实现错误处理，并让方法根据 Web API 发送的状态码返回值。你还可以将 `GetBooksAsync`、`PostBookAsync`、`PutBookAsync`\
  \ 和 `DeleteBookAsync` 方法移动到单独的服务类中。\n\n# 设计用户界面\n\n用户界面的目的是在 `CollectionView` 中显示书籍列表，并提供添加、编辑和删除数据的按钮。所有必要的\
  \ XAML 标记都可以写在 `MainPage.xaml` 文件。此外，所有的 XAML 标记都基于你在第 9 章“资源和数据绑定”中学到的技术，因此在这里不再进行解释。以下是示例用户界面的\
  \ XAML 代码：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \nx:Class=\"BookClient.MainPage\">\n<Grid>\n    <Grid.RowDefinitions>\n        <RowDefinition\
  \ />\n        <RowDefinition Height=\"Auto\" />\n    </Grid.RowDefinitions>\n  \
  \  <CollectionView x:Name=\"BookList\" SelectionMode=\"Single\"\n    SelectedItem=\"\
  {Binding SelectedBook}\">\n        <CollectionView.ItemTemplate>\n            <DataTemplate>\n\
  \                <StackLayout>\n                    <Entry Text=\"{Binding Title}\"\
  \ FontSize=\"16\" />\n                    <Entry Text=\"{Binding ISBN}\" FontSize=\"\
  12\" />\n                    <DatePicker Date=\"{Binding PublicationDate}\" FontSize=\"\
  14\" />\n                </StackLayout>\n            </DataTemplate>\n        </CollectionView.ItemTemplate>\n\
  \    </CollectionView>\n    <StackLayout Grid.Row=\"1\" Orientation=\"Horizontal\"\
  >\n        <Button x:Name=\"AddButton\" Text=\"Add new\" Command=\"{Binding AddCommand}\"\
  \ />\n        <Button x:Name=\"DeleteButton\" Text=\"Delete\" Command=\"{Binding\
  \ DeleteCommand}\" />\n        <Button x:Name=\"UpdateButton\" Text=\"Update\" Command=\"\
  {Binding UpdateCommand}\" />\n    </StackLayout>\n</Grid>\n</ContentPage>\n```\n\
  \n示例项目的最后一部分是创建 viewmodel 实例并将其分配给页的绑定上下文，如下：\n\n```csharp\nusing BookClient.ViewModel;\n\
  using Xamarin.Forms;\n\nnamespace BookClient\n{\n    public partial class MainPage\
  \ : ContentPage\n    {\n        private BookViewModel ViewModel { get; set; }\n\
  \        public MainPage()\n        {\n            InitializeComponent();\n    \
  \        ViewModel = new BookViewModel();\n            BindingContext = ViewModel;\n\
  \            BookList.ItemsSource = ViewModel.Books;\n        }\n\n        protected\
  \ override async void OnAppearing()\n        {\n            base.OnAppearing();\n\
  \            await ViewModel.GetBooksAsync();\n        }\n    }\n}\n```\n\n# 测试应用程序\n\
  \n如果你运行客户端应用程序，你将看到 Web API 返回的书籍列表，如图 12.21 所示，你还可以看到通过点击 `Add new` 按钮添加的空记录。此按钮会导致绑定的命令在数据存储中插入一个新对象，因此如果你对其进行了更改，则将点击\
  \ `Update` 按钮：\n\n如果你想测试 `Delete` 按钮，请先在列表中选择一本书。\n\n### 结论\n\n移动应用与远程服务通信以交换数据和信息是非常常见的。使用\
  \ Xamarin.Forms 构建的应用程序可以与任何基于 REST 的服务交互，但使用微软技术栈构建服务的最常见的方法是使用 Web API。本章解释了不同数据交换格式的基础，重点关注\
  \ JSON，然后探索了如何创建和发布 Web API 服务，该服务暴露了可以调用以对数据执行操作的。在章的第二部分，你学习了如何从 Xamarin.Forms\
  \ 项目中调用 Web API，以及如何复用现有技能将数据连接到用户界面。在下一章中，你将使用原生平台 API 以获得完整的编程体验。\n\n\n\n\n* \
  \  **REST**: REpresentational State Transfer（表述状态转移）的缩写，一种通过约束驱动网络软件开发的架构风格。\n*\
  \   **JSON**: JavaScript Object Notation（JavaScript 对象表示）的缩写，一种用于服务与客户端之间交换数据的标准格式。\n\
  *   **Web API**: 一种 Web 服务，它暴露了可以通过 HTTP 动词在网络上执行操作的方法。\n*   **HttpClient**: 一个允许在\
  \ .NET 中调用 Web API 类的类。\n\n### 建议阅读\n\n*   Microsoft ASP.NET Web APIs 文档 (`https://dotnet.microsoft.com/en-us/apps/aspnet/apis`)\n\
  *   将 Web API 服务发布到 Azure (`https://docs.microsoft.com/en-us/aspnet/core/tutorials/publish-to-azure-api-management-using-vs`)\n\
  *   将 Web 应用发布到 Internet 信息 Services (`https://docs.microsoft.com/en-us/aspnet/core/tutorials/publish-to-iis`)\n\
  *   在 Xamarin.Forms 中消费 REST 服务 (`https://docs.microsoft.com/en-us/xamarin/xamarin-forms/data-cloud/web-services/rest`)\n\
  *   使用 Entity Framework 使用 Web API (`https://docs.microsoft.com/en-us/aspnet/web-api/overview/data/using-web-api-with-entity-framework/`)\n\
  \n# 第 13 章\n\n# 使用原生 API\n\n### 介绍\n\n\n\n你在 Xamarin.Forms 中学到的第一个概念之一是，作为一种跨平台技术，它提供了一种访问所有支持系统可用功能的通用方法。然而，有时你可能需要更进一步，通过\
  \ `Xamarin.iOS` 和 `Xamarin.Android` 代码访问原生 API 来利用特定功能。例如，这在实际开发中非常常见：移除 `Entry`\
  \ 视图的边框需要访问所有目标平台上视图本身的原生 API。在本章中，你将学习如何从 C# 访问 iOS 和 Android 系统的原生 API 和功能，并理解如何使用\
  \ `Xamarin.Essentials` 库以跨平台的方法调用原生功能。正如你想象的，在一个章节中不可能讨论 iOS 和 Android 的整个原生 API\
  \ 和代码库，因此在学习了关键概念后，你将能够在自己的基础上的基础上扩展知识。这也是本书的最后一个技术章节，将完成使用 Xamarin.Forms 开发移动应用的基础知识。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   使用设备类\n*   高级视图自定义：自定义渲染器（Custom renderers）\n\
  *   使用效果（effects）管理原生属性\n*   显示原生视图\n*   使用平台特定内容自定义视图\n*   跨平台访问原生 API：Xamarin.Essentials\n\
  \n### 目标\n\n完成本章后，你将能够仅在特定设备上运行代码块，并知道如何更改视图的结构和行为。此外，本章将帮助你学习如何在 Xamarin.Forms\
  \ 代码中包含原生 iOS 和 Android 视图，以及如何在 `Xamarin.Essentials` 库的帮助下无需使用原生 API 原生功能。\n\n\
  ### 准备示例项目\n\n本章带有两个解决方案，你可以用 Visual Studio 打开以便跟踪示例。一个名为 `NativeAccess`，涉及访问设备和系统功能；另一个名为\
  \ `XamarinEssentials`，关于 `Xamarin.Essentials` 库的使用。\n\n如果你想自己创建新项目，请按照以下步骤操作：\n\n\
  1. 分别创建两个名为 `NativeAccess` 和 `XamarinEssentials` 的新 Xamarin.Forms 解决方案，以与示例保持一致。\n\
  2. 不要编辑或删除自动生成的 `MainPage.xaml` 文件；稍后将用到。\n3. 对于章中讨论的每个新功能，添加类型为 `Content Page (XAML)`\
  \ 的新项。要实现此操作，右键点击共享项目名称，然后在右键菜单中点击 `Add New` `Item`。\n4. 在 `Add New Item` 对话中，点击左侧的\
  \ Xamarin.Forms 节点，然后选择 `Content Page (XAML)` 模板。\n5. 为新的 XAML 文件分配一个与讨论的主题匹配的名称并点击\
  \ `Add`。\n\n对于向项目添加的每个页面，在 `ContentPage` 中添加一个空的 `StackLayout`，并将其 `VerticalOptions`\
  \ 属性设置为 `CenterAndExpand`。除非另有指定，这将是后续页面中代码示例的选布局。\n\n## 使用设备类\n\n有时，你可能需要在特定的特定系统或特定设备（如手机、平板电脑或桌面计算机）上运行某些代码。你可以通过一个名为\
  \ `Device` 的类来实现。除外，它还暴露了两个属性 `RuntimePlatform` 和 `Idiom`，其中第一个属性返回应用程序运行的系统，第二个属性返回设备类型。为了更好地理解，请考虑以下代码：\n\
  \n```csharp\n// SampleLabel 是 UI 中的一个 Label 视图\nswitch(Device.RuntimePlatform)\n\
  {\n    case \"iOS\":\n        // iOS 特有\n        break;\n    case \"Android\":\n\
  \        // Android 特有\n        break;\n    case \"UWP\":\n        // UWP 特有\n \
  \       break;\n    case \"macOS\":\n        // macOS 特有\n        break;\n    case\
  \ \"WPF\":\n        // WPF 特有\n        break;\n}\n```\n\n`RuntimePlatform` 类型为 `string`，代表当前系统，包括\
  \ iOS、Android、UWP（Windows 10 及更高版本）、macOS 和 WPF。`GetNamedSize` 方法返回目标系统的命名大小，是获取设备特定信息的另一种方法。对于系统颜色，你可以调用\
  \ `GetNamedColor` 方法。`RuntimePlatform` 的另一种用法是在简单的 if 块中，如下：\n\n```csharp\nif(Device.RuntimePlatform\
  \ == \"Android\")\n{\n    // 在 Android 上执行代码\n}\n```\n\n有时，了解当前设备的形状因子（form factor）也是很有用的，可以通过以下方式实现：\n\
  \n```csharp\nswitch(Device.Idiom)\n{\n    case TargetIdiom.Desktop:\n        //\
  \ 桌面\n        break;\n    case TargetIdiom.Phone:\n        // 手机\n        break;\n\
  \    case TargetIdiom.Tablet:\n        // 平板\n        break;\n    case TargetIdiom.Unsupported:\n\
  \        // 不支持的设备\n        break;\n}\n```\n\n`Idiom` 属性类型为 `TargetIdiom`，允许你了解设备类型。如果你需要根据设备类型进行\
  \ UI 调整，它可以与 `RuntimePlatform` 结合。\n\n### 使用计时器\n\n在 Xamarin.Forms 中，`Device` 类也用于创建计时器。计时器是在指定的时间间隔执行代码的对象。这通过\
  \ `StartTimer` 方法实现，该方法接受 `TimeSpan` 类型的对象和要执行的操作作为参数。以下代码显示了一个示例：\n\n```csharp\n\
  public MainPage()\n{\n    InitializeComponent();\n    Device.StartTimer(TimeSpan.FromSeconds(30),\
  \ ShowMessage);\n}\n\nprivate bool ShowMessage()\n{\n    DisplayAlert(“信息”, “已过去\
  \ 30 秒”, “确定”);\n    return true;\n}\n```\n\n在示例中，`ShowMessage` 方法每 30 秒被调用一次。当你想要停止计时器时，你的方法应该返回\
  \ `false`；否则，它将返回 `true` 直到你想让计时器运行。\n\n### 运行线程安全代码\n\n\n\n\n\n通过高级编程技术，你可能会遇到从用户界面线程启动的代码在单独的新线程上运行的情况。如果运行在单独线程上的代码需要与用户界面的元素进行交互，运行时将抛出跨线程违规的异常。在这种情况下，你可以调用\
  \ `Device.BeginInvokeOnMainThread` 方法，该方法将要在 UI 线程上执行的动作作为参数。这是一个示例：\n\n```csharp\n\
  Device.BeginInvokeOnMainThread(ActionToExecute);\n```\n\n`…`\n\n```csharp\nprivate\
  \ void ActionToExecute()\n{\n    // 这部分在 UI 线程上运行\n}\n```\n\n还有一种名为 `InvokeOnMainThreadAsync`\
  \ 的异步备选方案，你可以配合 `await` 运算符使用它，如下所示：\n\n```csharp\nawait Device.InvokeOnMainThreadAsync(ActionToExecute);\n\
  ```\n\n`…`\n\n```csharp\nprivate async Task ActionToExecute()\n{\n    // 这部分在 UI\
  \ 线程上运行\n}\n```\n\n许多开发者意识到，只有当调试器抛出线程违规异常时才需要使用上述方法，这在你专注于编写代码时是非常正常的。特别是在职业生涯初期，你的情况可能也是如此。不要担心；始终留心地进行调试，你就能相应地修复你的代码。\n\
  \n# 基于 Device 的内容方向\n\n如果你计划构建在全球范围内分发的应用程序，你需要支持不同的内容方向。事实上，某些文化要求内容从左到右排列，而另一些文化则要求从右到左排列。`Device`\
  \ 类帮助你通过在 XAML 中如下所示分配 `FlowDirection` 属性直接来实现这一点：\n\n```xml\n<ContentPage FlowDirection=”{x:Static\
  \ Device.FlowDirection}”>\n```\n\n通常情况下，`FlowDirection` 属性（每个视图均可用）允许指定内容方向以支持不同的文化。通过指向\
  \ `Device` 类中同名的静态属性（`x:Static` 允许从 XAML 中调用静态属性），你将能够根据设备设置支持相应的方向。\n\n# 条件 XAML：OnPlatform\
  \ 和 OnIdiom\n\n每个对象都派自 `VisualElement` 类，因此所有视图和布局都允许根据目标系统或设备变体（Idiom）指定不同的行为。例如，在目前的大多数示例中，你向页面添加了值为\
  \ 0,20,0,0 的 `Padding`，这同时适用于 Android 和 iOS（也适用于 UWP 等其他支持平台）。然而，指定内边仅对 iOS 有意义。因此，你可以利用一个名为\
  \ `OnPlatform` 的标记扩展，它允许根据目标系统设置不同的属性值。在以下示例中，不同的系统应用了不同的内边：\n\n```xml\n<ContentPage.Padding>\n\
  \    <OnPlatform x:TypeArguments=”Thickness”\n        iOS=”0, 20, 0, 0”\n      \
  \  Android=”0, 5, 0, 0”\n        UWP=”0, 10, 0, 0” />\n</ContentPage.Padding>\n\
  ```\n\n以下是关键点列表：\n\n*   你希望为每个平台分配不同值的属性，需要使用扩展语法进行声明。\n*   你必须指定 `OnPlatform` 标记扩展，并通过\
  \ `x:TypeArguments` 标签为当前属性提供数据类型。在此示例中，`Padding` 的类型是 `Thickness`，因此后者是你需要指定的。\n\
  *   你需要指定一个或多个支持的平台，如 iOS、Android 和 UWP（后者在代码中显示仅用于教学目的）。\n*   `OnPlatform` 还有一个扩展语法，如果你想为多个平台分配相同的值，可以像这样一样利用它：\n\
  \n```xml\n<ContentPage.Padding>\n    <OnPlatform x:TypeArguments=”Thickness”>\n\
  \        <On Platform=”iOS” Value=”0,20,0,0”/>\n        <On Platform=”Android, UWP”\
  \ Value=”0,5,0,0\"/>\n    </OnPlatform>\n</ContentPage.Padding>\n```\n\n`OnPlatform`\
  \ 通常用于调整在不同平台上具有不同对齐和拉伸选项的视觉元素。你也可以使用 `OnIdiom` 标记扩展根据设备变体分配不同的属性值。接下来的示例显示了如何根据设备类型设置\
  \ `StackLayout` 的方向：\n\n```xml\n<StackLayout.Orientation>\n    <OnIdiom x:TypeArguments=”StackOrientation”>\n\
  \        <OnIdiom.Tablet Value=”Horizontal” />\n        <OnIdiom.Phone Value=”Vertical”\
  \ />\n    </OnIdiom>\n</StackLayout.Orientation>\n```\n\n你仍然需要使用支持的数据类型设置 `x:TypeArguments`，然后通过\
  \ `OnIdiom.Tablet`、`OnIdiom.Phone` 和 `OnIdiom.Desktop` 设置一个或多个变体。\n\n# 高级视图自定义：自定义渲染器（Custom\
  \ renderers）\n\n如你所知，Xamarin.Forms 提供了所有支持平台上可用的视觉元素，对于此类视觉元素，它实现了所有平台上通用的属性和特性。然而，在某些情况下，你可能需要访问仅在视图原生\
  \ API 中可用的属性。这样做有很多原因，其中大多数与设计和实现有关。例如，假设你需要实现一个极其常见的需求：一个没有边框的 `Entry`。没有内置属性允许你执行此操作，因此实现此点的唯一方法是通过所谓的渲染器（renderers）控制原生视图。渲染器是一个封装原生视图的\
  \ C# 类。例如，Xamarin.Forms 提供 `Label` 来显示静态文本。在后台，一个名为 `LabelRenderer` 的类将 Android\
  \ 的 `TextView` 和 iOS 的 `UILabel` 转换为 `Label`。内置渲染器的开发方式向 `Xamarin.Forms` 代码库暴露所有跨平台对象。这就是为什么自己的渲染器被称为自定义渲染器。\n\
  \n### 定义自定义视图\n\n自定义渲染器全局应用于它们的目标类型，因此在创建新的渲染器之前，定义一个派自你想要修改的类的视图视图是一个好主意。在共享项目中，添加一个名为\
  \ `BorderlessEntry` 的新类，代码如下：\n\n```csharp\nusing Xamarin.Forms;\n\nnamespace NativeAccess\n\
  {\n    public class BorderlessEntry: Entry\n    {\n    }\n}\n```\n\n该类是 `Entry`\
  \ 视图的拷贝，并将由自定义渲染器支持。这使得在使用自定义视图的同时维护普通的 `Entry` 视图成为可能。\n\n### 定义 Android 渲染器\n\n\
  在“解决方案”中，右键点击 Android 项目，然后选择“添加 | 类”。添加一个名为 `BorderlessEntryRenderer` 的新类。\n\n\
  **提示：你可以自由选择自定义渲染器类的名称；惯例是将自定义共享视图名称与 `Renderer` 后缀结合。这将有助于你维护代码，并让其他开发者更容易理解渲染器的实现方式。**\n\
  \n编写以下代码，下方会有注释：\n\n```csharp\nusing Android.Content;\nusing Android.Graphics.Drawables;\n\
  using Android.OS;\nusing NativeAccess;\nusing NativeAccess.Droid.Renderers;\nusing\
  \ Xamarin.Forms;\nusing Xamarin.Forms.Platform.Android;\n\n[assembly: ExportRenderer(typeof(BorderlessEntry),\
  \ typeof(BorderlessEntryRenderer))]\n\nnamespace NativeAccess.Droid.Renderers\n\
  ```\n\n\n\n\n\n```cs\npublic class BorderlessEntryRenderer : EntryRenderer\n{\n\
  \    public BorderlessEntryRenderer(Context context) : base(context)\n    {\n  \
  \  }\n    protected override void OnElementChanged(ElementChangedEventArgs<Entry>\
  \ e)\n    {\n        base.OnElementChanged(e);\n        if (Control != null)\n \
  \       {\n            Control.Background = new ColorDrawable(Android.Graphics.Color.Transparent);\n\
  \        }\n    }\n}\n```\n\n每个自定义渲染器（custom renderer）都会重写 `OnElementChanged` 方法，该方法是你获取原生视图实例的地方，该实例由\
  \ `Control` 属性表示。在这种情况下，原生视图是 Android 的 `FormTextView`。一旦获取了原生视图实例，你就可以根据需要对其属性对其进行自定义。在这种情况下，视图的整个背景被分配了透明颜色。将代码包含在空值检查\
  \ `if(Control != null)` 或 `try..catch` 块中始终是非常重要的，因为渲染器可能会在视图绘制到屏幕之前就被调用，特别是在应用程序启动时。代码中的下一个相关点是\
  \ `ExportRenderer` 特性。它负责告诉 Xamarin.Forms，在整个应用（程序集规范）中，类型为 `BorderlessEntry` 的视图必须使用此自定义渲染器渲染，而不是内置的系统渲染器（在这种情况下为\
  \ `EntryRenderer`）。现在，你可以更好地理解为什么要创建一个新的 Xamarin.Forms 视图了：如果你没有这样做，你的渲染器将全局应用到应用中所有的\
  \ Entry 视图，这是不理想的。下一步是为 iOS 定义自定义渲染器。\n\n### 定义 iOS 渲染器\n\n按照相同的步骤，在解决方案的 iOS 项目中添加一个名为\
  \ `BorderlessEntryRenderer` 的新类。这次，代码如下：\n\n```cs\nusing NativeAccess;\nusing NativeAccess.iOS;\n\
  using System.ComponentModel;\nusing UIKit;\nusing Xamarin.Forms;\nusing Xamarin.Forms.Platform.iOS;\n\
  \n[assembly: ExportRenderer(typeof(BorderlessEntry), typeof(BorderlessEntryRenderer))]\n\
  namespace NativeAccess.iOS\n{\n    public class BorderlessEntryRenderer : EntryRenderer\n\
  \    {\n        protected override void OnElementChanged(ElementChangedEventArgs<Entry>\
  \ e)\n        {\n            base.OnElementChanged(e);\n            if (Control\
  \ != null)\n            {\n                // 将子层裁剪到视图根图层的边界\n                Control.Layer.MasksToBounds\
  \ = true;\n                // 无圆角\n                Control.Layer.CornerRadius =\
  \ 0;\n                // 无边框\n                Control.BorderStyle = UITextBorderStyle.None;\n\
  \                // 最小边框宽度\n                Control.Layer.BorderWidth = 1;\n   \
  \             // 分配透明颜色\n                Control.Layer.BorderColor = Color.Transparent.ToCGColor();\n\
  \            }\n        }\n    }\n}\n```\n\n在 iOS 上，你仍然应用 `ExportRenderer` 特性，并且重写\
  \ `OnElementChanged` 方法，但这次控件是 iOS 的 `UITextField`，它有自己的方法和属性。现在你已经有了自定义渲染器，可以在用户界面中测试它们。\n\
  \n# 将自定义渲染器应用到视图\n\n现在你已经定义了自定义渲染器，需要显式地使用它们。在共享项目的页面中，你首先需要声明一个 XML 命名空间，引用项目以及定义目标视图的命名空间。如果你遵循配套解决方案，`BorderlessEntry`\
  \ 类定义在根命名空间中，你如下方式引用它：\n\n```xml\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n            xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n       \
  \     xmlns:local=\"clr-namespace:NativeAccess\"\n            x:Class=\"NativeAccess.CustomRenderersPage\"\
  >\n```\n\n现在，你可以像使用任何其他视图一样使用该视图，声明如下：\n\n```xml\n<ContentPage.Content>\n    <StackLayout\
  \ Orientation=\"Vertical\" Padding=\"20\">\n        <Label Text=\"Regular Entry:\"\
  \ />\n        <Entry WidthRequest=\"150\" BackgroundColor=\"Yellow\"/>\n       \
  \ <Label Text=\"Borderless Entry:\"/>\n        <local:BorderlessEntry WidthRequest=\"\
  150\" BackgroundColor=\"Yellow\" HorizontalOptions=\"FillAndExpand\"/>\n    </StackLayout>\n\
  </ContentPage.Content>\n```\n\n如果你运行这段代码，运行时将根据应用程序运行的平台应用相应的自定义渲染器。图 13.1 显示了示例的结果，包含一个普通的\
  \ `Entry` 和一个 `BorderlessEntry`：\n\n![](img/Figure-13.1.jpg)\n\n**图 13.1：** 应用自定义渲染器\n\
  \n# 关于自定义渲染器的更多信息\n\n由于 Xamarin.Forms 中的每个视觉元素都依赖于渲染器以及原生 Android 和 iOS 视图，且创建自定义渲染器完全取决于你的需求，因此无法进一步讨论自定义渲染器，但总结一些有用的关键点是有帮助的：\n\
  \n*   最佳实践是在共享项目中定义一个专用的视图。\n*   所有平台的自定义渲染器都通过 `ExportRenderer` 特性应用。\n*   在大多数情况下，你重写\
  \ `OnElementChanged` 方法来获取原生视图实例。\n*   你甚至可以为第三方组件创建自定义渲染器。\n*   当你需要处理没有跨平台实现的需求时，参考\
  \ Xamarin.iOS (https://docs.microsoft.com/en-us/xamarin/ios/user-interface/controls/)\
  \ 和 Xamarin.Android (https://docs.microsoft.com/en-us/xamarin/android/user-interface/controls/)\
  \ 文档是最重要的工作。\n*   尽管如此，收藏关于自定义渲染器的官方文档也是重要的：https://docs.microsoft.com/en-us/xamarin/forms/app-fundamentals/custom-renderer\n\
  \n# 使用效果（effects）管理原生属性\n\n有时，你可能想对原生视图进行自定义，但只需要更改某些属性，而不需要重新定义视图的行为。在这种情况下，你可以避免使用渲染器并利用效果。效果是在共享代码中继承自\
  \ `RoutingEffect` 的类，平台特定的实现分别继承自 `Xamarin.Forms.Platform.Android.PlatformEffect`\
  \ 和 `Xamarin.Forms.Platform.iOS.PlatformEffect`。为了更好地理解，假设你想为 `Entry` 内部的文本指定最大长度。为此，考虑以下\
  \ XAML 代码：\n\n```xml\n<Label Text=\"Entry with an effect:\" />\n<Entry WidthRequest=\"\
  120\" x:Name=\"DataEtry\">\n    <Entry.Effects>\n        <local:MaxLengthEffect\
  \ MaxLength=\"8\" />\n    </Entry.Effects>\n</Entry>\n```\n\n**提示：** 为了方便起见，可以将上述代码添加到自定义渲染器示例中两个\
  \ `Label`/`Entry` 组之后。\n\n每个视图都暴露一个名为 `Effects` 的集合，并包含多个效果。在这个示例中，应用了一个名为 `MaxLengthEffect`\
  \ 的效果，并为名为 `MaxLength` 的属性分配了一个整数。现在，目标是实现效果以及针对 Android 和 iOS 的平台特定代码。\n\n### 声明效果\n\
  \n在你的共享项目中，添加一个名为 `MaxLengthEffect` 的新类，代码如下：\n\n```cs\npublic class MaxLengthEffect\
  \ : RoutingEffect\n{\n    public MaxLengthEffect() : base($\"MyCompanyName. {nameof(MaxLengthEffect)}\"\
  )\n    {\n    }\n    public int MaxLength { get; set; }\n}\n```\n\n\n\n\n\n该类继承自\
  \ `RoutingEffect`，以便 `Xamarin.Forms` 知道它是一个效果。构造函数包含对一个所谓资源组（resource group）的引用。资源组可以被视为效果的容器，因此你定义一个根节点（在本例中为\
  \ `MyCompanyName`）后跟一个点，然后为效果提供一个标识符。按照惯，你使用效果本身的名称。定义资源组和效果标识符非常重要，因为 `Xamarin.Forms`\
  \ 使用它们来识别和应用效果。然后，你就可以定义效果所需的所有属性和方法。对于当前的示例，你只需要一个可以在 XAML 中赋值的 `int` 属性，正如你在本节开头看到的那。除非你想进一步自定义效果，否则共享代码端无需做任何其他操作。\n\
  \n# 实现平台特定效果](#toc.xhtml_s390a)\n\n与自定义渲染器一样，效果也有平台特定的实现，这对于设置原生视图属性是必要的。从 Android\
  \ 实现开始，在 `Droid` 项目中添加名为 `MaxLengthEffectPlatform` 的新类并包含以下代码：\n\n```\nusing Android.Widget;\n\
  using NativeAccess;\nusing NativeAccess.Droid;\nusing System;\nusing System.Linq;\n\
  using Xamarin.Forms;\nusing Xamarin.Forms.Platform.Android;\n\n[assembly: ResolutionGroupName(“MyCompanyName”)]\n\
  [assembly: ExportEffect(typeof(MaxLengthEffectPlatform), nameof(MaxLengthEffect))]\n\
  \nnamespace NativeAccess.Droid\n{\n    public class MaxLengthEffectPlatform : PlatformEffect\n\
  \    {\n        protected override void OnAttached()\n        {\n            try\n\
  \            {\n                var sharedEffect = (MaxLengthEffect)\n         \
  \       Element.Effects.FirstOrDefault(e => e is MaxLengthEffect);\n           \
  \     TextView editEntry = Control as TextView;\n                editEntry?.SetFilters(new\
  \ Android.Text.IInputFilter[]\n                {\n                    new Android.Text.\
  \ InputFilterLengthFilter(sharedEffect.MaxLength)\n                });\n       \
  \     }\n            catch (Exception ex)\n            {\n                //Catch\
  \ any exception\n            }\n        }\n        protected override void OnDetached()\n\
  \        {\n        }\n    }\n}\n```\n\n命名空间块必须使用 `ResolutionGroupName` 属性标记，该属性指定了当前效果所属的解析组。类似于自定义渲染器（应用\
  \ `ExportRenderer` 属性），你也需要应用 `ExportEffect` 属性，并将平台特定实现的名称和共享效果名称作为参数传递。派自 `PlatformEffect`\
  \ 类需要实现两个方法：`OnAttached` 和 `OnDetached`。第一个方法在效果应用时调用，而第二个方法在效果移除时调用。只有当你有代码显式从集合中移除效果时，`OnDetached`\
  \ 才是必要的。上述代码中 `OnAttached` 的作用如下：\n\n*   它从调用者视图 (`Element`) 中获取类型为 `MaxLengthEffect`\
  \ 的第一个效果。\n*   它获取原生 Android `TextView`，将类型为 object 的 `Control` 转换为专用实例。\n*   它通过\
  \ `SetFilters` 方法向 `TextView` 添加类型为 `InputFilterLengthFilter` 的新过滤器。\n\n使用此代码，将无法输入超过指定数量的字符。这将在本章节后面进一步演示，但你首先需要为\
  \ iOS 添加平台特定的实现。在 iOS 项目中添加 `MaxLengthEffectPlatform` 类并编写以下代码：\n\n```\nusing Foundation;\n\
  using NativeAccess.iOS;\nusing System;\nusing System.Linq;\nusing UIKit;\nusing\
  \ Xamarin.Forms;\nusing Xamarin.Forms.Platform.iOS;\n\n[assembly: ResolutionGroupName(“MyCompanyName”)]\n\
  [assembly: ExportEffect(typeof(MaxLengthEffectPlatform), “MaxLengthEffect”)]\n\n\
  namespace NativeAccess.iOS\n{\n    public class MaxLengthEffectPlatform : PlatformEffect\n\
  \    {\n        protected override void OnAttached()\n        {\n            try\n\
  \            {\n                var sharedEffect =\n                (MaxLengthEffect)Element.Effects.\n\
  \                FirstOrDefault(e => e is MaxLengthEffect);\n                UITextField\
  \ nativeEntryView = Control as UITextField;\n                if (nativeEntryView\
  \ != null)\n                {\n                    nativeEntryView.ShouldChangeCharacters\
  \ = (UITextField textField,\n                    NSRange range, string replacementString)\
  \ =>\n                    {\n                        var length = textField.Text.Length\
  \ - range.Length +\n                        replacementString.Length;\n        \
  \                return length <= sharedEffect.MaxLength;\n                    };\n\
  \                }\n            }\n            catch (Exception ex)\n          \
  \  {\n                //Catch any exception\n            }\n        }\n        protected\
  \ override void OnDetached()\n        {\n        }\n    }\n}\n```\n\n在 iOS 中，`UITextField`\
  \ 原生视图不具备直接添加过滤器的功能，因此代码通过一个匿名方法为 `ShouldChangeCharacters` 属性赋值，该方法将视图的原始内容替换为长度受效果\
  \ `MaxLength` 属性限制的字符串。\n\n# 测试代码](#toc.xhtml_s391a)\n\n如果你运行示例应用程序，将得到一个与 图 13.2\
  \ 中所示的结果：\n\n![](img/Figure-13.2.jpg)\n\n**图 13.2：** 应用效果\n\n如果你在两个 Entry 视图中输入，系统将阻止你添加超过指定数量的字符。效果在很多情况下都很有用，但只有当你不需要重新定义原生视图的行为时，它们的使用才有意义。\n\
  \n# 显示原生视图](#toc.xhtml_s392)\n\nXamarin.Forms 还提供了在 XAML 中嵌入原生 Android 和 iOS 视图的选择。假设你有一个测试此场景的页面，必须声明以下\
  \ XML 命名空间：\n\n```xml\n<?xml version=”1.0” encoding=”utf-8” ?>\n<ContentPage xmlns=”http://xamarin.com/schemas/2014/forms”\n\
  xmlns:x=”http://schemas.microsoft.com/winfx/2009/xaml”\nxmlns:ios=”clr-namespace:UIKit;assembly=Xamarin.iOS;targetPlatform=iOS”\n\
  xmlns:androidWidget=”clr-namespace:Android.Widget;assembly=Mono.Android;targetPlatform=Android”\n\
  xmlns:formsandroid=”clr-namespace:Xamarin.Forms;assembly=Xamarin.Forms.Platform.Android;targetPlatform=Android”\n\
  x:Class=”NativeAccess.NativeViewsPage”>\n\n<ContentPage.Content>\n\n</ContentPage>\n\
  ```\n\n对于 iOS，你需要从 `Xamarin.iOS` 库导入 `UIKit` 命名空间。对于 Android，你需要两个命名空间：用于嵌入原生视图的\
  \ `Android.Widget` 以及来自 `Xamarin.Forms.Platform.Android` 库的 `Xamarin.Forms` 部分命名空间（用于获取界面上下文）。有了这些命名空间就可以就可以嵌入原生视图。以下示例演示了如何显示原生标签（Android\
  \ 的 `TextView` 和 iOS 的 `UILabel`）：\n\n```xml\n<StackLayout>\n    <ios:UILabel Text=”Native\
  \ Text” View.HorizontalOptions=\"Start\"/>\n    <androidWidget:TextView Text=”Native\
  \ Text”\n    x:Arguments=\"{x:Static formsandroid:Forms.Context} />\n</StackLayout>\n\
  ```\n\n如你所示，对于 Android，你需要将 UI 上下文传递给视图的构造函数，使用 `x:Staticformsandroid:Forms.Context`\
  \ 语法。你可以像处理任何 `Xamarin.Forms` 视图一样分配属性、调用方法并处理事件。\n\n**提示：了解如何在共享代码中嵌入原生视图是知识的一部分，但这是你可能想要避免的做法。只有当你必须包含没有\
  \ Xamarin.Forms 对应控件的视图时，才应该利用此功能。此外，不要忘记 XAML 编辑器对此功能的支持有限。**\n\n# 使用平台特定项自定义视图](#toc.xhtml_s393a)\n\
  \n\n\n\n\n`Xamarin.Forms` 的最大优势是它允许从共享代码库中调用视图，其属性在所有支持的平台上都是可用。之前，你已经看到了如何利用自定义渲染器（custom\
  \ renderers）向 `Xamarin.Forms` 暴露非跨平台的功能。对于更简单的情况，`Xamarin.Forms` 提供了所谓的“平台特定属性（platform-specifics）”。此功能简化了对仅在特定平台上可用的功能的调用。这意味着适用于\
  \ Android 的平台特定属性可能在 iOS 上不可用，反之亦然。例如，iOS 上 `ListView` 上的分隔符不是全宽的。与其创建一个自定义渲染器，你可以利用平台特定属性。这可以通过以下代码实现：\n\
  \n```xml\n<?xml version=”1.0” encoding=”utf-8” ?>\n<ContentPage xmlns=”http://xamarin.com/schemas/2014/forms”\n\
  xmlns:x=”http://schemas.microsoft.com/winfx/2009/xaml”\nxmlns:ios=”clr-namespace:Xamarin.Forms.\
  \ PlatformConfiguration.iOSSpecific;assembly=Xamarin. Forms.Core”\nx:Class=”NativeAccess.ExamplePlatformSpecifics”>\n\
  <ContentPage.Content>\n<StackLayout>\n<ListView ios:ListView.SeparatorStyle=”FullWidth”\n\
  x:Name=”FullSeparatorListView”>\n</ListView>\n</StackLayout>\n</ContentPage.Content>\n\
  </ContentPage>\n```\n\n在 iOS 上，你需要导入 `Xamarin.Forms.PlatformConfiguration.iOSSpecific`\
  \ 命名空间，而在 Android 上，你需要导入 `Xamarin.Forms.PlatformConfiguration.AndroidSpecific`\
  \ 命名空间。为了使用平台特定属性，你输入命名空间标识符，跟随冒号以及你想自定义的属性。下面的 Android 平台特定属性示例演示了如何在 `WebView`\
  \ 上启用内容缩放：\n\n```xml\n<?xml version=”1.0” encoding=”utf-8” ?>\n<ContentPage xmlns=”http://xamarin.com/schemas/2014/forms”\n\
  xmlns:x=”http://schemas.microsoft.com/winfx/2009/xaml”\nxmlns:android=”clr-namespace:Xamarin.Forms.\
  \ PlatformConfiguration. AndroidSpecific;assembly=Xamarin.Forms.Core”\nx:Class=”NativeAccess.PlatformSpecificsPage”>\n\
  <ContentPage.Content>\n<StackLayout>\n<WebView Source=”https://www.microsoft.com”\n\
  android:WebView.EnableZoomControls=”true”\nandroid:WebView.DisplayZoomControls=”true”\
  \ />\n</StackLayout>\n</ContentPage.Content>\n</ContentPage>\n```\n\n这段代码很容易理解。真正的点在于，第一个平台特定属性仅在\
  \ iOS 上可用，而第二个仅在 Android 上可用，但它们都避免了在这些简单情况下实现自定义渲染器。官方文档提供了适用于 Android（`https://docs.microsoft.com/en-us/xamarin/xamarin-forms/platform/android/`）和\
  \ iOS（`https://docs.microsoft.com/en-us/xamarin/xamarin-forms/platform/ios/`）的长平台特定属性列表。你也可以\
  \ C# 代码中应用平台特定属性，可以通过调用扩展方法 `On` 实现：\n\n```csharp\nWebView1.On<Android>().EnableZoomControls(true).DisplayZoomControls(true);\n\
  ```\n\n你指定目标平台作为方法的类型参数，然后在 IntelliSense 的帮助下，你可以浏览平台特定属性列表。如果你不想阅读文档，这是发现可用内容的另一种方法。显然，在调用\
  \ `On` 方法及其成员之前，你首先需要添加指向平台特定命名空间的适当的 using 指令。\n\n### 访问设备功能：DependencyService\
  \ 类\n\n到目前为止，你已经看到了如何访问原生 API 以自定义用户界面元素，但这只是你所做工作的一部分。事实上，有时你需要访问来自设备硬件或操作系统的平台特定功能，这些功能需要从共享项目中调用。`Xamarin.Forms`\
  \ 提供了 `DependencyService` 类来处理这些场景。基于该类的编程模式要求你在共享项目中定义一个接口，该接口包含一个或多个需要平台特定实现并执行实际工作的工作成员。为了更好地理解，假设你需要获取在操作系统上设置的语言。向共享项目添加以下接口：\n\
  \n```csharp\npublic interface IDeviceInfo\n{\n    string GetSystemLanguage();\n\
  }\n```\n\n共享代码将调用 `GetSystemLanguage` 方法来获取系统语言，而实现由平台特定项目提供。在 Android 项目中，添加一个名为\
  \ `DeviceInfo` 的新类并包含以下代码：\n\n```csharp\nusing System.Globalization;\nnamespace\
  \ NativeAccess.Droid\n{\n    public class DeviceInfo : IDeviceInfo\n    {\n    \
  \    public string GetSystemLanguage()\n        {\n            return CultureInfo.CurrentCulture.ToString();\n\
  \        }\n    }\n}\n```\n\n在 Android 上，你可以通过 `CultureInfo.CurrentCulture` 对象直接获取当前的\
  \ OS 语言。在 iOS 上，工作方式不同，这就是为什么你需要两个不同的实现。向 iOS 项目添加包含以下代码的 `DeviceInfo` 类：\n\n```csharp\n\
  using Foundation;\nnamespace NativeAccess.iOS\n{\n    public class DeviceInfo :\
  \ IDeviceInfo\n    {\n        public string GetSystemLanguage()\n        {\n   \
  \         return NSLocale.PreferredLanguages[0];\n        }\n    }\n}\n```\n\n在\
  \ iOS 上，你通过获取 `NSLocale` 类 `PreferredLanguages` 集合中的第一个项来获取 OS 语言。现在你有了两个实现，你需要一种方法从共享项目中使用这些信息。可以通过以下代码实现：\n\
  \n```csharp\nstring osLanguage = DependencyService.Get<IDeviceInfo>().GetSystemLanguage();\n\
  ```\n\n`Get` 方法需要接口作为类型参数来检索实例，取决于当前系统。一旦获得实例，你就可以调用成员（在此例中为 `GetSystemLanguage`）并获得所需的结果。在过去，`DependencyService`\
  \ 类被密集用于访问许多原生功能，例如文件信息、短信接口、屏幕信息和传感器。这确实强大，但意味着要学习和记忆数百个原生 API。幸运的是，在过去的 3 年里，微软一直在努力开发一个名为\
  \ `Xamarin.Essentials` 的库，它简化了从共享代码访问原生的功能，在许多情况下消除了对 `DependencyService` 的需求。这就是为什么没有提供关于该模式的其他示例，而是采用简单有效的原生访问。\n\
  \n### 跨平台访问原生 API：Xamarin.Essentials\n\n`Xamarin.Essentials` 是一个专门为 `Xamarin.Forms`\
  \ 设计的 .NET 库；它暴露的对象允许从共享项目访问原生、平台特定的功能，而无需实现依赖服务模式。当你创建一个新的 `Xamarin.Forms` 解决方案时，`Xamarin.Essentials`\
  \ 会自动添加到项目依赖中。你可以通过展开“解决方案管理器”中的 `Dependencies` 节点来快速验证这一点。\n\n\n\n\n\n`Xamarin.Essentials`\
  \ 提供了数百个对象，因此在本节中，你将学习如何通过关注大多数应用程序所需的功能，为真实世界的开发做好准备。你可以通过在 Visual Studio 中打开 `XamarinEssentials`\
  \ 辅助解决方案来遵循代码示例。记住在使用 `Xamarin.Essentials` 的代码文件中添加以下指令：`using Xamarin.Essentials;`。\n\
  \n### 检查网络连接\n\n如果你的应用程序在网络（如互联网或本地局域网）上运行，那么在启动任何需要连接的操作之前，你必须对连接状态进行检查。如果不这样做，你的应用程序将抛出未处理的错误，并提供非常糟糕的用户体验。为了解决这个问题，你可以使用\
  \ `Connectivity` 类并订阅其 `ConnectivityChanged` 事件，如下所示：\n\n```csharp\nConnectivity.ConnectivityChanged\
  \ += Connectivity_ConnectivityChanged;\n```\n\n你应该在页面的构造函数或 `App` 类定义中订阅此事件。`ConnectivityChanged`\
  \ 的事件处理器接收一个类型为 `ConnectivityChangedEventArgs`的对象作为第二个参数，该对象提供了网络连接状态的信息：\n\n```csharp\n\
  private async void Connectivity_ConnectivityChanged(object sender, ConnectivityChangedEventArgs\
  \ e)\n{\n    switch (e.NetworkAccess)\n    {\n        case NetworkAccess.Internet:\n\
  \            // App 已连接到互联网：\n            break;\n        case NetworkAccess.Local:\n\
  \            // App 已连接到本地网络\n            break;\n        case NetworkAccess.ConstrainedInternet:\n\
  \            // App 到互联网的连接有限\n            break;\n        case NetworkAccess.None:\n\
  \            // App 未连接\n            break;\n        default: // 未知\n          \
  \  break;\n    }\n}\n```\n\n更具体地说，`NetworkAccess` 枚举返回网络连接状态。当为 `None` 或 `Unknown`，或者当你的代码确实需要访问互联网而\
  \ `NetworkAccess` 返回了不同的值时，你应该告知用户由于缺乏连接性导致的情况，并取消请求的操作。你还可以快速检测所谓的“连接配置”，让你让你了解设备是通过以太网线（UWP\
  \ 桌面应用中常见）、Wi-Fi、蜂窝网络还是蓝牙连接的。以下代码显示了一个示例：\n\n```csharp\nif(Connectivity.NetworkAccess\
  \ != NetworkAccess.None)\n{\n    var profiles = Connectivity.ConnectionProfiles;\n\
  \    if(profiles.Contains(ConnectionProfile.WiFi) || profiles.Contains(ConnectionProfile.Ethernet))\n\
  \    {\n        // 以太网或 WiFi 连接，一切良好\n    }\n    else if(profiles.Contains(ConnectionProfile.Cellular))\n\
  \    {\n        // 告知用户其数据套餐可能会产生费用\n    }\n    else if (profiles.Contains(ConnectionProfile.Bluetooth))\n\
  \    {\n        // 蓝牙可用\n    }\n    else\n    {\n        // 处理未知状态\n    }\n}\n```\n\
  \n`ConnectionProfiles` 集合填充了一系列代表设备上当前活动连接的值。例如，如果设备上的 Wi-Fi、蜂窝数据和蓝牙都已启用，则该集合将包含\
  \ `ConnectionProfile.WiFi`、`ConnectionProfile.Cellular` 和 `ConnectionProfile.Bluetooth`\
  \ 值。`ConnectionProfiles` 属性非常有用；例如，如果它只包含 `Cellular` 值，你应该告知用户，他们可能会被运营商收取数据套餐使用费用。你不需要对他们的数据套餐负责，但你确实提醒了他们。\n\
  \n**提示：在 Android 上，记得添加 `ACCESS_NETWORK_STATE` 权限以启用获取连接状态。**\n\n### 检查电池状态\n\n\
  移动应用开发与桌面或 Web 开发之间最大的区别之一是移动应用运行在电池供电的设备上。这是一个重要点，因为你必须处理电量低的情况，特别是如果你的应用程序管理数据。默认情况下，Android\
  \ 和 iOS 在电量达到 20% 时都会向用户显示警告，因此没有显示额外的警告信息并打扰用户。然而，当电量极低时，你必须找到保存数据的方法或给用户一个选择做什么的。`Xamarin.Essentials`\
  \ 库提供了 `Battery` 类，它暴露了 `EnergySaverStatusChanged` 事件（当设备进入节能模式时触发）。将将提供一个示例，但它涉及其他对象。更具体地说，`Battery`\
  \ 类暴露了以下成员：\n\n* `ChargeLevel`，类型为 double，返回 0 到 1 之间的当前电池电量，其中 0 表示已放电，1 表示满电。\n\
  * `BatteryState`，类型为 `BatteryState` 的枚举，返回由 表 13.1* 中描述的值之一表示的电池状态：\n\n| State |\
  \ Description |\n| :--- | :--- |\n| `Charging` | 电池正在充电。 |\n| `Discharging` | 电池正在放电。一旦设备从电源断开，这也是当前状态。\
  \ |\n| `NotCharging` | 电池未充电。 |\n| `NotPresent` | 未找到电池（例如，在桌面电脑上）。 |\n| `Unknown`\
  \ | 无法检测电池状态。 |\n\n表 13.1：BatteryState\n\n* `PowerSource`，类型为 `BatteryPowerSource`，返回关于设备如何供电的信息，其值如\
  \ 表 13.2* 中总结的：\n\n| Power source value | Description |\n| :--- | :--- |\n| `Battery`\
  \ | 设备由电池供电。 |\n| `AC` | 设备连接到交流电源。 |\n| `Usb` | 设备通过 USB 线缆供电。 |\n| `Wireless`\
  \ | 设备通过无线充电供电。 |\n| `Unknown` | 无法检测电源。 |\n\n表 13.2：PowerSource\n\n**提示：在 Android\
  \ 上，记得添加 `BATTERY_STATS` 权限以启用访问电池信息。**\n\n处理电池状态变化最高效的方法是在 `App` 构造函数中订阅 `EnergySaver`\
  \ 事件，如下：\n\n```csharp\nBattery.EnergySaverStatusChanged += Battery_EnergyStatusChanged;\n\
  ```\n\n事件处理器需要检查电量是否低于 20% 且开启了节能模式：\n\n```csharp\nprivate void Battery_EnergyStatusChanged(object\
  \ sender, EnergySaverStatusChangedEventArgs e)\n{\n    MessagingCenter.Send(this,\
  \ “BatteryEvent\", e.EnergySaverStatus == EnergySaverStatus.On && Battery.ChargeLevel\
  \ <= 0.2);\n}\n```\n\n由于 `App` 类无法操作用户界面，当事件被拦截并处理时，会向任何订阅了它的对象发送消息。例如，视图可以这样订阅此类消息：\n\
  \n```csharp\nMessagingCenter.Subscribe<App, bool>(this, “BatteryEvent\", ManageBatteryLevelChanged);\n\
  ```\n\n此外，在 `ManageBatteryLevelChanged` 方法中，视图可以本地保存数据或进行任何可能的操作，以防在电量突然下降时导致数据丢失。记住，对于允许用户输入数据的应用程序，处理电池状态并不是一个选项。你负责保持用户数据处于良好状态并随时确保安全。\n\
  \n\n\n\n\n`Xamarin.Essentials` 暴露了 `Email` 类，该类暴露了 `ComposeAsync` 方法等。调用此方法时，它会启动系统默认的电子邮件客户端，因此无需构建自己的用户界面。这是推荐的方法，至少基于以下两个原因：\n\
  \n*   用户对他们已经熟悉的电子邮件客户端感到舒适。\n*   你不需要对邮件交换的安全性负责。\n\n为了发送电子邮件，你首先需要创建一个 `EmailMessage`\
  \ 类的实例并填充其自解释性强的属性，如下所示：\n\n```cs\nEmailMessage message = new EmailMessage();\n\
  message.Subject = “Contact request”;\nmessage.To = new List<string> { “support@yourcompany.com”\
  \ };\nmessage.Cc = new List<string> { “marketing@mycompany.com” };\nmessage.BodyFormat\
  \ = EmailBodyFormat.PlainText;\nmessage.Body = “We would need to meet your developers\
  \ to suggest features.”;\n```\n\n请注意你如何通过 `List<string>` 添加多个收件者。注意 `EmailBodyFormat`\
  \ 枚举允许指定 `PlainText` 或 `Html` 作为邮件格式。在 HTML 的情况下，你需要将正文作为包含 HTML 的字符串传递。最后一步是以下简单的调用：\n\
  \n```cs\nawait Email.ComposeAsync(message);\n```\n\n这将在目标设备上启动默认电子邮件客户端，并提供预先配置的电子邮件消息。也可以指定附件。每个附件都由\
  \ `EmailAttachment` 类的实例表示，如下所示被添加到 `Attachments` 集合中：\n\n```cs\nstring attachmentPath\
  \ = Path.Combine(Environment.GetFolderPath(\nEnvironment.SpecialFolder.MyPictures),\n\
  “attachedImage.jpg”);\nEmailAttachment attachment = new EmailAttachment(attachmentPath);\n\
  message.Attachments = new List<EmailAttachment>();\nmessage.Attachments.Add(attachment);\n\
  ```\n\n在之前的代码中，一个位于本地相册的图像文件被作为附件添加到邮件消息中。上传并随消息发送附件将是客户端的责任。\n\n### 发送短信\n\n在通过互联网运行的免费聊天应用的时代，短信似乎已经过时了。然而，有很多理由仍然继续使用它们，最重要的一点是即使在没有网络连接的情况下它们也能工作。`Sms`\
  \ 类允许发送短信，你有几种选择。以下代码行显示了带有空字段的发送短信系统用户界面：\n\n```cs\nSms.ComposeAsync();\n```\n\n\
  你也可以按照如下方式准备短信：\n\n```cs\nvar message = new SmsMessage();\nmessage.Body = “Text\
  \ of the message”;\nmessage.Recipients = new List<string>{“Alessandro Del Sole”};\n\
  Sms.ComposeAsync(message);\n```\n\n在第二个示例中，你创建了一个 `SmsMessage` 类的实例，将消息的文本分配给 `Body`\
  \ 属性，并将收件者列表分配给 `Recipients` 属性。后者是任何实现 `IEnumerable<string>` 的集合，显然，你必须确保收件者的名称与设备联系人列表中的名称匹配。你可以将正文和收件者列表传递给\
  \ `SmsMessage` 类的构造函数，但这样你就被迫必须传递两者。使用建议的方法，你只需要创建正文，并让用户从更方便的系统用户界面选择收件者。\n\n###\
  \ 打开内容\n\n移动应用程序的另一个常见选项是打开外部内容，例如设备上的网站或应用程序。本节描述了如何处理这两种情况。\n\n# 打开网络浏览器\n\n对于网站或任何网络托管的内容，你可以打开默认网络浏览器。虽然\
  \ `Xamarin.Forms` 提供了用于显示网页和 HTML 内容的 `WebView`，但有时这并不是推荐的方法。例如，如果你的应用程序需要显示来自医疗网站的建议，使用\
  \ `WebView` 打开内容会给用户一种信息是由你提供的错觉。相反，信息是由第三方提供的，这对于用户来说应该是清晰的，特别是当你在电子商务网站上显示敏感信息（如医疗数据和支付信息）时。只需一行代码即可打开默认网络浏览器，如下所示：\n\
  \n```cs\nawait Browser.OpenAsync(“https://www.microsoft.com”);\n```\n\n`Browser`\
  \ 类的 `OpenAsync` 方法简单地接受目标地址作为参数。例如，在没有任何更改的情况下，这将在 Android 上打开 Chrome，在 iOS 上打开\
  \ Safari。\n\n### 打开默认应用\n\n还可以使用设备上的专用默认应用打开指定的资源。例如，你可以按照如下方式使用目标设备上的默认查看器打开远程\
  \ PDF 文档：\n\n```cs\nstring url = “https://www.someproducts.com/usermanual.pdf”;\n\
  if(await Launcher.CanOpenAsync(url))\nawait Launcher.OpenAsync(url);\n```\n\n`Launcher`\
  \ 类暴露了 `CanOpenAsync` 方法，你应该先调用它以确保设备具有这些指定资源的查看器。如果返回 true，你就可以调用 `OpenAsync` 来打开该资源。\n\
  \n### 存储用户偏好\n\n你已经在 [第 11 章：管理应用程序生命周期] 中看到了存储本地偏好和设置的示例，因此在本节中你将获得更多细节。`Preferences`\
  \ 类允许在本地存储和检索键/值对，其中键唯一标识信息，而值可以是 .NET 原始类型之一。以下代码显示了一个示例：\n\n```cs\n// 存储一个整数\n\
  Preferences.Set(“NumberOfTapsPerAction”, 2);\n// 存储一个 DateTime\nPreferences.Set(“LastDateTimeAccess”,\
  \ DateTime.Now);\n// 检查键是否存在\nif (Preferences.ContainsKey(“NumberOfTapsPerAction”))\n\
  // 返回键的值，如果未找到键则返回默认值\nPreferences.Get(“NumberOfTapsPerAction”, 0);\n```\n\n`Get`\
  \ 方法允许你在键不存在时指定一个默认值，因此检查 `ContainsKey` 不是强制性的。然而，此方法对于检测键的存在可能非常有用。你也可以通过 `Remove`\
  \ 和 `Clear` 方法分别删除单个键或所有内容，如下所示：\n\n```cs\n// 删除单个键\nPreferences.Remove(“NumberOfTapsPerAction”);\n\
  // 删除所有偏好\nPreferences.Clear();\n```\n\n在 Android 上，偏好存储在系统的共享偏好中 ([`developer.android.com/training/data-storage/shared-preferences`](https://developer.android.com/training/data-storage/shared-preferences))。在\
  \ iOS 上，偏好存储在 User Defaults 系统数据库中 ([`docs.microsoft.com/en-us/xamarin/ios/app-fundamentals/user-defaults`](https://docs.microsoft.com/en-us/xamarin/ios/app-fundamentals/user-defaults))。偏好是存储少量信息的方便方法，但它们是不安全的。为了更安全地存储本地信息，可以使用安全存储，将在下一节中讨论。\n\
  \n**当应用程序被卸载时，本地偏好也会被删除。**\n\n\n\n\n\n有时，有必要以安全的方式在本地存储设置；例如对于密码或任何可以识别用户的敏感信息。为了这一目的，Android\
  \ 和 iOS 均提供了安全的本地存储。在 Android 上，这通过 `KeyStore` ([`developer.android.com/training/articles/keystore`](https://developer.android.com/training/articles/keystore))\
  \ 表示；而在 iOS 上，它通过 `KeyChain` ([`developer.apple.com/documentation/security/keychain_services`](https://developer.apple.com/documentation/security/keychain_services))\
  \ 表示。存储（Preferences）和安全存储之间存在重要差异：\n\n*   Preferences 存储在为应用程序保留的空间中，并在卸载时会被删除。\n\
  *   安全存储位于系统级，这意味着当应用程序卸载时，存储的信息不会被删除，需要开发者进行额外检查。\n*   Preferences 支持任何 .NET 原生类型，但安全存储仅支持\
  \ `string` 类型。\n\n尽管如此，`Xamarin.Essentials` 提供了 `SecureStorage` 类，你可以如下使用它：\n\n\
  ```\n// 向安全存储添加键/值对\nawait SecureStorage.SetAsync(\"UserID\", \"12345\");\n\n//\
  \ 从安全存储获取键/值对\nstring userIDValue = await SecureStorage.GetAsync(\"UserID\");\n\n\
  // 从安全存储移除指定的键\nSecureStorage.Remove(\"UserID\");\n```\n\n总结来说，`SetAsync` 在指定的键下保存字符串，而\
  \ `GetAsync` 获取指定键的字符串，如果未找到则返回 `null`。`Remove` 方法从存储中移除指定的键。另一个方法 `RemoveAll` 会从安全存储中移除所有键。\n\
  \n**提示：你可以完全信任安全存储。但如果你需要额外的安全级别，可以使用 .NET 加密算法加密字符串并将其保存到安全存储，然后在从安全存储读取它时进行解密。这对于你的应用程序管理银行账户或医疗数据非常有用。**\n\
  \n# 带版本跟踪的安全设置\n\n正如前面提到的，卸载应用程序时键不会从安全存储中移除，因为安全存储是在操作系统级别共享的。应用程序可能会卸载然后重新安装；因此如果使用安全存储，提供一个全新的环境很重要。为了实现这一点，你可以将\
  \ `SecureStorage` 类与 `VersionTracking` 类结合（后者由 `Xamarin.Essentials` 提供），后者提供了允许版本跟踪的成员，用于理解应用程序是否在设备上首次运行。考虑以下代码：\n\
  \n```cs\nprivate async Task<bool> IsAppRunningFirstTime()\n{\n    if (VersionTracking.IsFirstLaunchEver)\n\
  \    {\n        string userID = await SecureStorage.GetAsync(\"userID\");\n    \
  \    if (userID != null)\n            SecureStorage.Remove(\"userID\");\n      \
  \  return true;\n    }\n    return false;\n}\n```\n\n`VersionTracking.IsFirstLaunchEver`\
  \ 方法在应用程序首次在设备上运行时返回 true。在这种情况下，目标是提供一个全新的环境，以便代码检查指定的键是否存在并在将其移除。为了启用版本跟踪，你需要在\
  \ `App` 类的构造函数中添加以下代码：\n\n```cs\nVersionTracking.Track();\n```\n\n这里列出了 `VersionTracking`类的其他有用成员：\n\
  \n*   `IsFirstLaunchForCurrentVersion` 如果应用程序当前版本在设备上首次运行，则返回 true。\n*   `IsFirstLaunchForCurrentBuild`\
  \ 如果应用程序当前构建在设备上首次运行，则返回 true。\n*   `VersionHistory` 是一个 `IEnumerable<string>` 对象，包含了已安装在设备上的应用程序版本列表。\n\
  *   `CurrentVersion` 包含应用程序的版本号。\n*   `CurrentBuild` 包含版本的构建号。\n\n当你想要实现强制更新机制，或者在人们可以使用应用程序之前提供需要下载的更新内容时，`VersionTracking`\
  \ 类可以非常有用。\n\n### 更多 Essentials API\n\n`Xamarin.Essentials` 有了巨大的改进，特别是在过去一年中：库中添加了许多新的跨平台\
  \ API。本章描述了在各种应用程序中常用的对象，但无疑还有更多。例如，`Xamarin.Essentials` 使得访问陀螺仪、加速度计、方向传感器和 GPS\
  \ 服务等硬件设备变得更加简单。带有代码示例的完整支持 API 可以在官方 Microsoft 文档 ([`docs.microsoft.com/en-us/xamarin/essentials/`](https://docs.microsoft.com/en-us/xamarin/essentials/))\
  \ 中找到。此外，每当你实现收集地理位置等数据的功能时，请记住以下三个考虑因素：你必须明确请求用户启用传感器并收集数据，你必须提供清晰的隐私政策来解释为什么需要启用一个或多个传感器以及你收集哪些数据，并且你必须为用户提供撤回同意的方式。\n\
  \n### 关于插件的提示\n\n将原生 API 的访问统一到共享代码中的目标对于开发者社区一直以来都很。因此，多年来，个人开发者（包括微软员工）构建了所谓的插件，即允许从\
  \ `Xamarin.Forms` 项目使用原生 iOS 和 Android 功能的库。`Xamarin.Essentials` 实际上是在插件之后很久才产生的，理念相同，但将许多功能整合在了一起。许多插件仍然存在，并且在许多现实项目中仍可以找到它们。它们可以从\
  \ NuGet 安装，而且几乎所有的插件都是免费的。图 13.3 显示了 NuGet 中的插件列表：\n\n![](img/Figure-13.3.jpg)\n\
  \n**图 13.3：** Xamarin.Forms 插件列表\n\n例如，`Xam.Plugin.Media` 插件能够以跨平台的方法从设备相机捕捉照片和视频，而\
  \ `Plugin.Fingerprint` 插件能够快速实现生物识别身份验证。\n\n\n\n\n`Xamarin.Forms` 最大的优势在于它提供了一种统一的、跨平台的方法来访问不同系统可用的功能。然而，有时你可能访问原生视图和设备功能。在视图方面，你可以使用自定义渲染器（custom\
  \ renderers）进行深层视图自定义和行为更改，而可以使用效果（effects）进行不需要更改视图行为的自定义。你还可以直接在 XAML 标记中嵌入原生视图，或者使用平台特定项（platform-specifics）为\
  \ `Xamarin.Forms` 视图分配原生属性。在访问设备和系统功能方面，你可以使用 `DependencyService` 类和同名模式。不过，更现代的方法是使用\
  \ `Xamarin.Essentials` 库，它提供了大量的 .NET API，用于从 `Xamarin.Forms` 代码访问原生系统功能。关于访问原生\
  \ API 的讨论也标志着本书技术性章节的结束。现在你已经掌握了所有必要的知识，你需要开始开发新项目或在现有项目上工作。在接下来的两个章节中，你将找到许多关于寻找好工作以及如何在软件行业保持成功的有用建议。\n\
  \n### 核心术语\n\n* **Thread-safe（线程安全）**：运行在线程内部的代码以及它所使用的资源。\n* **Renderer（渲染器）**：一种\
  \ C# 类，能够将原生 Android 和 iOS 视图暴露给 Xamarin.Forms。\n* **Platform-specifics（平台特定项）**：一种允许在\
  \ XAML 中直接为 `Xamarin.Forms` 视图分配原生属性的功能。\n* **Dependency service（依赖服务）**：一种基于接口原生实现的\
  \ `Xamarin.Forms` 编程模式，无论目标系统如何，其成员都会在共享项目内部被调用。\n\n### 推荐阅读\n\n* 自定义渲染器文档：`https://docs.microsoft.com/en-us/xamarin/xamarin-forms/app-fundamentals/custom-renderer/`\n\
  * 效果文档：`https://docs.microsoft.com/en-us/xamarin/xamarin-forms/app-fundamentals/effects/`\n\
  * 依赖服务文档：`https://docs.microsoft.com/en-us/xamarin/xamarin-forms/app-fundamentals/dependency-service/introduction`\n\
  * Xamarin.Essentials 文档：`https://docs.microsoft.com/en-us/xamarin/essentials/`\n\
  \n# 第 14 章：寻找工作\n\n### 引言\n\n作为一名 Xamarin 的求职者，你可能希望通过获得一份需要使用你技能的工作，从技术角度练习你所学的知识。在本章中，你将找到许多关于寻找与技能和背景相关的工作的有用建议，还将找到关于准备工作面试的信息。显然，这些建议不仅适用于\
  \ Xamarin 相关的工作，也适用于信息技术领域的各种职位。最后，正如你可能注意到的，之所以使用“建议”一词是因为实际上根本没有规则。每个人寻找工作和申请职位的方法都可能不同，但一些通用的建议对所有人都是有用的。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n* 准备你的简历\n* 现代方式找工作：使用 LinkedIn\n* 迈出一步：吸引工作\n* 准备工作面试\n\
  \n### 目标\n\n完成本章后，你将学习到作为一名使用 Xamarin 的移动应用开发者寻找工作的现代方法。你将发现不仅可以寻找工作，还能吸引工作的方法。\n\
  \n### 准备你的简历\n\n在寻找工作时，简历是一份至关重要的文档。它总结了你是谁、你的经验如何、你完成了哪些学习，以及你能为聘用你的公司带来什么价值。在互联网上，你可以找到数千份简历模板并选择一份最符合你口味的；然而，考虑以下几点是非常重要的：\n\
  \n* **保持简洁**：两页就足够了。招聘人员需要关注关键信息，而不是你的人生故事（至少在第一次接触时是）。\n* **添加个人照片**：这给人一种正在阅读真实人物简历的感觉，特别是在今天这种远程连接的时代。\n\
  * **联系信息**：添加你的基本联系信息和出生日期。\n* **添加真实且客观的技术技能列表**：这是雇主首先会看的内容。在这方面请不要撒谎。\n* **仅添加最高学历**：如果你上过大学，请添加你的大学学位；否则，添加你的高中学历。没有必要添加所有的求学经历，除非它与你申请的职位相关。\n\
  * **认证专业知识**：添加任何与你申请职位相关的证书或课程。\n* **现有经验**：如果你有之前的工作经验，请添加一个总结，简要描述你在份工作中中所做过。\n\
  * **保持一致性**：如果你申请的一份需要 `Xamarin` 经验的工作，仅添加关于 `Xamarin`、`.NET` 以及你通常在 `Xamarin` 中使用的技术的细节（例如，`Web\
  \ API`、`SQL`、`Azure`）。对于其他技能，用一行写简短总结。\n* **在线状态**：添加专业社交媒体配置的链接，如 `LinkedIn`，以及你可能拥有的公共代码库，如\
  \ `GitHub`。对于某些公司来说，这确实会有影响。\n* **个人生活**：写一两行关于你工作之外的个人兴趣和爱好。\n\n大多数雇主和招聘人员都知道你会把简历发送给多家公司，因此当他们理解你写了一份针对他们需求定制的简历时，他们通常会很感激。总的来说，始终要诚实。不要为了满足公司的要求和吸引兴趣而说你在某方面有经验。说虚假的话不是开始你与公司之间建立信任关系的最好方式。此外，不要过分评价作为\
  \ IT 世界工作基础的技能。例如，即使你是使用 `Excel` 的高手，也不要写你是 `Excel` 之神。只需提到你对 Office 软件套有深厚的知识即可。诚实和简单是良好开始的关键。最后，每当你简历发送给不同的公司时，都要更新简历上的日期，打印它，添加签名，扫描并以\
  \ `PDF` 格式发送。更新日期和添加签名意味着你想向他们证明你是可靠的。制作 `PDF` 文档很重要，因为即使在移动设备上也可以阅读，所以任何雇主都可以随时随地阅读。\n\
  \n### 现代方式找工作：使用 LinkedIn\n\n\n\n\n\n寻找工作的传统方法是在报纸、大学公告栏上寻找公司的招聘公告，或者直接向你熟悉的公司发送简历。这仍然是你可以做的事情，但当今\
  \ IT 行业寻找工作的合适方法是使用 LinkedIn (`https://www.linkedin.com`)。多年来，LinkedIn 一直是最重要且最流行的职业社交网络。因此，如果你还没有\
  \ LinkedIn 账号，就应该创建一个（`https://www.linkedin.com/signup`）。当你创建账户时，就可以输入所有的联系方式和个人详细信息，建议你添加一张个人照片。你的个人资料中有几个部分是你应该保持更新的；你可以通过点击页面右上角的\
  \ `Me`（我），然后点击 `View Profile`（查看档案）来访问这些部分。第一部分包含你的照片和当前活动的摘要，如*图 14.1](#c14.xhtml_fig14_1)*所示，在其中你可以看到本书作者的个人页。\n\
  \n![](img/Figure-14.1.jpg)\n\n**图 14.1:** 你的 LinkedIn 个人资料摘要\n\n你应该保持更新的下部分是你的工作经验（如果有），即使你已经有一段时间没有工作了。\n\
  \n*图 14.2](#c14.xhtml_fig14_2)* 显示了一个示例：\n\n![](img/Figure-14.2.jpg)\n\n**图 14.2:**\
  \ 保持你的工作经验更新\n\n**提示：点击铅笔图标可以更新 LinkedIn 个人资料的每个部分。**\n\n接下来，还有两个关键部分：`Licenses\
  \ & certifications`（执照与认证）和 `Skills`（技能）。在这里，你可以添加你通过学习和考试获得的任何官方认证，并且可以添加你的技术技能列表（请参见*图\
  \ 14.3](#c14.xhtml_fig14_3)*）：\n\n![](img/Figure-14.3.jpg)\n\n**图 14.3:** 认证与技能\n\
  \n对于技能，你可以添加你认为自己准备更充分的内容，LinkedIn 上认识你的其他人可以证实你所说的。这是有益的，因为任何查看你个人资料的招聘人员都能看到你对特定主题的知识储备有多强，并得到了其他专业人士的确认。这是一个重要的点，需要特定的考虑，将在下一节*向前迈：吸引工作*中进行介绍。\n\
  \n### 寻找工作\n\n如果你点击页面顶部工具栏上的 `Jobs`（工作），你就可以在 LinkedIn 上搜索工作。*图 14.4](#c14.xhtml_fig14_4)*\
  \ 显示了一个示例：\n\n![](img/Figure-14.4.jpg)\n\n**图 14.4:** 寻找工作\n\nLinkedIn 将根据你添加到个人资料中的技能、认证、位置和当前职位推荐一系列招聘公告。此外，你还可以通过在右上角的搜索栏中输入内容或选择位置（也支持输入\
  \ remote 远程）来手动搜索开放职位。在页面左侧，有一个菜单，其中的选项可以帮助你充分利用 LinkedIn。例如，你可以将简历上传到个人资料中，或者观看一段关于找工作最佳实践的教学视频。你可以点击某个开放职位查看其完整详情。如果你认为这对你来说是一个很好的机会，点击\
  \ `Apply`（申请）按钮并按照步骤操作。正如你可以想象的，通过 LinkedIn，你拥有无限可能，并能够关注更符合你技能和预期的开放职位。然而，LinkedIn\
  \ 还有另一个优势：作为一个社交媒体平台，它还允许招聘人员为他们的需求找到最佳的人才。这是下一节的主题。\n\n### 向前迈：吸引工作\n\n使用 LinkedIn\
  \ 的最大好处之一是让吸引工作变得容易。吸引工作意味着招聘人员将根据你发布和分享的内容发现你的个人资料，如果你的个人资料符合他们的需求，他们将能够与你联系并提供工作。这意味着你可能无需申请职位就能找到工作。然而，这只有在\
  \ LinkedIn 搜索算法能够在招聘人员搜索时找到你的个人资料时才可能发生，这并非轻而易举。接下来的几节将讨论你如何吸引工作，开放你的思维去接受更广泛的可能性。然而，请始终记住：成功不是免费的；它需要投入。\n\
  \n### 与正确的联系建立联系\n\nLinkedIn 对寻找工作有很大帮助，但这需要建立合适的人脉网络。记住，这不是一个好玩的社交媒体，所以你不应该专注于将你生活中遇到过的任何人都加入你的人脉中。作为开始，只向那些你从专业角度认识的人发送联系请求。如果你是职场新人，或者作为第二步，如果你已经将人加入了你的人脉，在\
  \ LinkedIn 的搜索栏中输入与你感兴趣的技术相关的术语，例如 Xamarin。会出现一个符合你标准的人、公司和小组列表。开始关注公司和小组，然后查看可能对与你建立联系感兴趣的人，例如共同兴趣、你们都关注的公司等。如果你有一个新账户，可能会出现你想联系的人不接受你的邀请，但这不应该让你气馁。接下来的几节将帮助改进这一点。随着你在\
  \ LinkedIn 上的人脉和活动增长，你的规则应该是与有相同兴趣的人以及来自部门的人建立联系。\n\n# 分享他的内容\n\n吸引工作的关键让你的个人资料更容易被发现。这可以通过编写关于你兴趣的文章或分享内容来轻松实现。作为第一步，你可以分享其他人、小组或公司发布的内容，正如前几段所解释的那样。找到可以分享的内容很容易：你可以在滚动时间线或打开你关注的公司或个人的个人页时找到它。对于他们发布的每一个内容，LinkedIn\
  \ 都提供了 `Share`（分享）按钮。*图 14.5](#c14.xhtml_fig14_5)* 显示了如何分享公司的帖子：\n\n![](img/Figure-14.5.jpg)\n\
  \n**图 14.5:** 分享公司或其他的内容\n\n这种简单的操作会有几种结果：\n\n*   内容的作者可以看到你分享了它，因此他们可能会回关注。\n*\
  \   你分享的内容出现在你人脉中的其他人那里，所以他们可以看到你对什么感兴趣。\n*   LinkedIn 搜索算法开始更好地理解你的兴趣，并将你的帖子推荐给其他相同兴趣的人，从而使你的个人资料更容易被发现。\n\
  \n\n\n\n\n你是万千中的一个。让自己和你的个人资料易于被发现是吸引工作的关键。最好的方法是分享你的知识，这在当今的 IT 领域是基础性的。公开展示你所掌握的知识是让自己被发现的最佳方式，也是建立知识信任的最佳方式（只要你写的内容在技术上是准确的）。分享知识意味着编写文章、录制教程视频、启动技术博客以及/发布开源项目。你不需要成为书籍作者或会议演讲者；你可以在家里轻松做一些事情，这些事情就会产生影响。在网上分享内容已经能让你变得易于发现，而\
  \ LinkedIn 可以通过发布动态，让你的人脉了解你为开发者社区所做的，从而帮助提升你的曝光率。\n\n### 编写文章和其他内容\n\n你可以发布的第一类型内容是技术文章。作为一名新发布者，建议从提供免费空间并配有审核员的网站开始。最好的起点是\
  \ `C# Corner` (`https://www.c-sharpcorner.com/`)。这是允许发布技术文章的最受欢迎的网站之一，每当你发布内容时，内容都会首先由他们团队的人员进行审核批准。你不需要写长篇文章，重要的是写出准确的内容。你发布的准确内容越多，你的声誉就增长得越大。你可以研究一个主题或从你的现实经验中提取案例并写此一篇文章。当你的文章上线后，去\
  \ LinkedIn 创建一条新动态，分享文章链接并添加一段说明你已发布了新文章的文字。LinkedIn 还允许你在动态中添加标签（hashtags），这有助于提高它们的可见性。同样的理念也适用于发布在\
  \ `YouTube` 上的教程视频。这可能需要更多的自信，但从长远来看将会有帮助。\n\n### 加入在线社区\n\n在线社区是分享知识的另一个绝佳地方，它们提供了在\
  \ LinkedIn 之外寻找工作的另一种可能。这些社区通常依赖于带有内容的网站、论坛以及参与和分享知识的其他选项。世界上有数千个社区，所以尝试在 `Google`\
  \ 上搜索一下，看看是否有位于你居住附近的社区。事实上，大多数时候也会组织线下活动，这对于加强你与其他人的关系非常重要。\n\n# 分享你的代码\n\n分享你编写的代码不应被低估。例如，你可以创建小型库或应用程序来演示如何完成某些任务，并将源代码发布到流行的在线网站，如\
  \ `GitHub` (`https://github.com`) 或 `Bitbucket` (`https://bitbucket.org`)。这有助于提高你的声誉和可发现性，有些公司要求将公共代码库作为简历的一部分。在在线仓库上发布代码的步骤不在本书的涵盖范围内，但有许多在线指南解释了如何实现这一点。重要的是，这是另一种你可以通过\
  \ LinkedIn 动态分享的内容类型，你可以在动态中添加资源链接和简要描述（不要忘记使用标签）。）。\n\n**提示：像 `C# Corner` 和 `GitHub`\
  \ 这样的网站非常受欢迎，不仅其内容很容易通过 `Google` 搜索找到，而且它们还被数百万开发者视为具有自身生命力的资源容器，即使在没有 LinkedIn\
  \ 的情况下也能提升你的可见度。如果你是软件开发的新手，最好的想法是找一个能在你的文章和代码上线之前对其进行审核的人，直到你对自己的技能充满信心。**\n\n\
  # 关于 LinkedIn 的最终考虑\n\n如果你遵循到目前为止提供的建议，你的 LinkedIn 个人资料将保持极度活跃，并且在数百万其他资料中易于被发现。这将使招聘人员更容易找到你的资料，并帮助你建立一个强大、持续的专业人脉网络。设置\
  \ LinkedIn 页面最初可能看起来很麻烦，但你应该将其视为一种长期投资。显然，LinkedIn 可以通过搜索和吸引人脉来帮助找工作，但获得工作的真正第一步是通过面试。\n\
  \n### 准备工作面试\n\n无论面试是在线下还是虚拟环境下进行，几点考虑始终是有效的。作为一名 `Xamarin` 求职者，你正在申请技术职位，因此可能会有更多的面试官，通常是你将要工作的团队经理、团队中的一名开发人员以及人力资源部门的代表，至少在初接触时是这样。首先，仔细听他们关于公司业务以及你作为开发其产品的开发者应该做什么的说明。如果可能，多提问，让面试官理解你对这份工作有真正的兴趣。\n\
  \n### 技术面试\n\n通常问技术问题是为了了解你的技能是否胜任公司的产品，以避免给你带来麻烦，或者为了了解你对软件开发有多热情。记住，公司在招聘人员时会投入巨大成本，因此他们必须确保你的技术技能和经验能让他们受益。也可能发生这种情况，特别是在具有复杂层级和规定的大型企业中，你会被要求完成一些技术练习。显然，无法预测或详细讨论技术问题；这些取决于面试官、职位要求以及公司构建的产品。\n\
  \n### 人事面试\n\n\n\n\n\n经理和人力资源部门的代表可能会提出更多与了解你个人相关的问题，例如你是否能与现有团队融合、你的期望、抱心等。一个经常被问的问题是`你认为十年年后你会处于什么位置？`。尽管这个问题没有标准答案，但以一种留给你你希望在公司内个人和技术上都成长的印象来回答总是一个好主意。例如，如果你申请的是软件开发人员的职位，在\
  \ 10 年后，你可能希望自己成为一个软件开发人员团队的技术主管。他们非常清楚这个问题没有精确的答案，但他们想了解你是如何考虑自己在公司内部成长的。初试通常是为了彼此认识，所以除非面试官主动提起，否则永远不要询问薪资信息。显而易见，获得薪水是地球上每个人工作的动力，但你应该给出的感知是无论薪水如何，你对这份工作感兴趣。这通常是第二次甚至第三次面试的话题。因此，你总有机会讨论薪资水平和福利；完全不需要在第一次面试中这样做。至少在讨论职位的第一次会议中，如果可能的话，即使他们安排在深夜或清晨，也可以接受。这可能是为了故意为之测试你的灵活性，并不意味着这会在你的日常工作日内发生。此外，在面试之前，尝试了解公司是否有着装要求。如果有，请以符合要求的方式穿着，让他们明白你对他们的规则没有意见。最后，一个反复但基础的建议是，对自己的技能、个人需求和期望始终保持诚实。面试官不仅会欣赏并青睐这种方法，对他们来说信任你也同样重要。\n\
  \n### 结论\n\n在当今世界，找工作不再是你可以用老办法完成的事情。现代工作需要现代的方式来寻找职业，特别是对于 IT 行业的职业，而且招聘人员的工作方式也非常现代，因此在公共渠道（包括`LinkedIn`）上分享你的知识非常重要，这将使你更容易吸引寻找熟练开发者的雇主的兴趣。但一旦你获得了工作，你需要在你的岗位上保持成功，以便维持你的职位并在专业领域不断成长。这是下一章的主题。\n\
  \n# 注意事项\n\n*   你的简历应该是简洁的，并应该突出你申请的职位所需的技能。\n*   在面试中，始终要诚实。工作对你和雇佣你的公司来说都是一项长期投资，因此信任是基础。\n\
  *   利用`LinkedIn`根据你的技能和知识搜索工作。\n*   尽可能发布内容、写文章并加入社区，以建立在线声誉。\n*   吸引工作对你来说是选择，因此在`LinkedIn`上分享你的在线动态。\n\
  \n# 第 15 章\n\n## 成为一名移动应用开发者\n\n### 引言\n\n获取技术知识和寻找工作是开启移动应用开发世界生涯的两大重点，但随着时间的推移，你会希望自己的职位并可能向新的、更高的职位进化。虽然这取决于个人，但所有开发者都可以做几件事来提升自己，并在软件行业取得更大的成功。本章描述了一些最佳实践，不仅能帮助你维持职位，还能帮助你在团队的日常工作中做出贡献。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   培养你的热情和好奇心\n*   学习成为团队合作者\n*   保持开发技术的更新\n\n\
  ### 目标\n\n完成本章后，你将学习保持高水平热情和好奇心的重要性，如何在团队中工作，以及如何保持日常工作中使用的相关技术的更新。\n\n本章讨论的所有主题都应视为建议而非规则。此外，它们应该根据你的工作/生活平衡和可用时间来应用。最好的建议是不要过度要求自己，始终留出放松的时间。\n\
  \n## 培养你的热情和好奇心\n\n参与的项目越多，学到的就越多。然而，你的日常工作有时可能是重复性的。例如，你可能在同一个项目上工作多年，即使你一直在添加新功能，也可能在同一个主题上停留一段时间。这当然不应该是问题，但保持高水平的热情好奇好奇并关注其他事物是非常重要的。\n\
  \n### 尝试自定义项目\n\n培养编写代码热情的最好方法仍然是编写代码。花一些时间在日常工作之外、业务需求之外创建简单的应用。当然，这不应该被视为第二份工作或生活中的另一项任务。你可以根据自己的意愿在任何时间投入任何时间，但专注于某些让你感到可以自由实验而没有日常工作压力的事情，并使用你学习过的且每天使用的技术，是非常重要的。设定一个目标，例如根据你的时间及其功能你想构建的应用程序类型，然后开始。即使你预先不知道如何实现你想要的功能也可以这样做。这可以是一个通过研究开发平台来提高知识的极佳练习，你克服的障碍越多，就越会感到动力和热情。作为结果，实验将带给你你可以在日常工作中复用的知识。这将让你在做出技术决策时更明智、更快。关于从事自定义项目，一个很好的练习是使用`GitHub`(`https://github.com`)\
  \ 作为你代码的远程仓库。原因是其他开发者可以看到你的代码，给出改进建议并提出问题；换句话说，他们可以互动并分享想法，这具有巨大的价值。所以，尽管尝试吧。这是在没有压力的情况下继续做喜欢的事的好极方法，它真的有助于你培养对编程的热情。\n\
  \n### 尝试第三方组件\n\n许多软件公司生产针对不同开发平台的库和组件，有助于实现自定义功能时节省时间。例如，如果你要在`Xamarin.Forms` 项目中实现图表，你可能更希望使用第三方组件而不是自己编写视图和逻辑。选择许可和订阅是有成本的，但自己构建组件所需的时间精力可能要贵得多，所以这是一个值得考虑的问题。因此，许多公司使用他人生产的第三方组件。如果你能花时间尝试此类组件，你也将能够在日常工作中做出更合适的技术建议或决策。针对`Xamarin.Forms`\
  \ 的重要库供应商列举如下：\n\n\n\n\n\n*   **Infragistics** ([`www.infragistics.com`](https://www.infragistics.com)):\
  \ 他们为 Xamarin.Forms 和原生平台提供了一套非常强大的面向数据的视图组件。这套套件缺少通用视图，但它是最强大且最受期待的工具之一。在购买许可证之前可以进行免费试用。\n\
  \n*   **Progress（原 Telerik）** ([`www.telerik.com`](https://www.telerik.com)): 他们为\
  \ Xamarin.Forms 和原生平台提供了几十种视图。他们提供了免费试用，你可以在购买许可证之前使用。\n\n*   **Syncfusion** ([`www.syncfusion.com`](https://www.syncfusion.com)):\
  \ 他们不仅为 Xamarin.Forms 和原生平台提供了最流行且高效的组件和库组合之一，还提供了免费的社区许可，允许在某些条件下构建商业产品。更多细节请参阅他们的网站。\n\
  \n*   **DevExpress** ([`www.devexpress.com`](https://www.devexpress.com)): 他们为 Xamarin.Forms\
  \ 提供了一系列付费和免费的视图。免费组件都是为数据处理设计的，但它们运行良好，绝对值得一试。\n\n当你与使用此类组件的团队进行面试时，花些时间尝试第三方组件也是很有用的。即使你申请的团队使用的组件与你尝试过的不同，但你具备使用第三方库的方法，这一事实也会受到青睐。\n\
  \n### 学习成为团队的一员\n\n构建软件是一项团队工作，因为其中涉及到多个角色，从图形设计师到开发者、测试人员、翻译人员以及产品所有者等经理。当你加入一家公司时，可能会在一个团队中工作。这对你来说非常有价值，因为你可以学习流程是如何运作的，以及如何与从事同一项目但背景不同的人互动。学习团队的工作流是基础性的；你需要一些时间来适应人员和流程，但随后一切都会变成一种良好的习惯。然而，成为团队成员和成为团队合作者（team\
  \ player）之间存在巨大差异。记住，至少在敏捷（Agile）等现代工作方法论中，成功或失败都是团队行为；绝不是个人的成功或过错。这意味着团队中的每一个人（包括在内）都应该尽全力为项目做出贡献。如果你的工作环境足够智能，你可以记住以下建议：\n\
  \n*   **积极主动**：不要等待别人索要想法或反馈；如果你发现应用中有任何需要改进的地方，请与其他成员分享你的想法和解决方案。\n*   **表达**：与他人分享你的想法、疑问和主意。在大多数情况下，你不会决定实现哪些功能，但你可以提供反馈，以微调它们对终端用户的影响。\n\
  *   **举手示意**：没有人是完美的，也没有开发者能 100% 掌握某项开发技术。所以你可能会遇到困难，例如当你第一次开发某个功能时。如果发生这种情况，请举手示意；不要羞于寻求帮助。提问和寻求帮助比编写你对自己都怀疑的代码要好得多。\n\
  *   **对变化持开放态度**：不仅是技术，甚至业务需求和组织需求也会不断演变。你可以保持的最佳方法是将此类变化视为价值而非问题。\n*   **以团队的视角看问题**：即使团队是由个人组成的，最糟糕的情况是每个人都从个人角度考虑自己的工作，而不是从整体上考虑项目结果。记住，获胜或失败的是团队，而不是个人。你的客户或利益相关者不在乎谁失败了；他们考虑的是团队的失败和团队的成功。\n\
  \n### 与开发技术保持同步\n\n在第 1 章，移动应用开发的重要性中，你获得过关于如何与市场主要厂商发布的设备和操作系统更新保持同步的建议。这些建议仍然有效，但由于你现在拥有了更丰富的技术技能，可以通过额外的考虑因素来丰富它们。查看新发布版本始终重要的，特别是关于你每天使用的开发技术。如果你考虑书中讨论的所有微软技术栈，至少有两项技术你可能想要进一步详细分析。\n\
  \n`.NET Multiplatform Application User Interface**，也称为 `.NET MAUI` (`https://docs.microsoft.com/en-us/dotnet/maui/`)，这是微软推出的全新开发平台，你将用它来构建移动应用程序。记住，你在书中学到的所有技能在\
  \ MAUI 中仍然有效且是基础，但读一些关于它的内容是很重要的。图 15.1 显示了 MAUI 官方网站欢迎页的样式：\n\n![](img/Figure-15.1.jpg)\n\
  \n**图 15.1：** .NET MAUI 欢迎页\n\n`.NET 6` ([`dot.net`](https://dot.net)) 于 2021 年\
  \ 11 月发布，最终实现了提供一个针对所有开发领域的 API 的。图 15.2 显示了 .NET 官方网站欢迎页的样式：\n\n![](img/Figure-15.2.jpg)\n\
  \n**图 15.2：** .NET 官方网站\n\n通常，你可以查看微软在他们的开发者网站 (`https://developer.microsoft.com/`)\
  \ 上正在构建和发布的内容，该网站针对所有支持平台。在这里，你可以找到作为 Xamarin 开发者每天使用的技术的新闻、信息和快捷方式。图 15.3 显示了开发者网站首页的样式：\n\
  \n![](img/Figure-15.3.jpg)\n\n**图 15.3：** 开发者网站\n\n出于几个原因，了解接下来将会推出什么非常重要。例如，如果你需要启动新项目，你可以为使用什么技术做出更好的决策。另一个例子是，你将成为所有那些不喜欢经常获取信息的同事的参考点。这将产生巨大的影响。这种讨论可以与本章前面讨论的实验建议联系起来。通常，微软会提供他们正在构建的产品早期版本（称为预览版），你可以用它们开始实验。**提示：开发团队是由人组成的，有他们的优点和缺点。在你的职业生活中，你会发现既有喜欢保持技术同步的人，也有等待他人告知发生了什么事情的人。尝试成为第一类人，因为你可以从中获益。**\n\
  \n此外，这种方法在你申请新职位时可能很有用。关键点不在于对每项新技术都拥有深入知识（这是不可能的），而是记住这项技术关于什么的。\n\n### 结\n\n\n\
  \n\n\n每个开发者都能编写代码，但只有少数开发者能真正产生影响。如果你想成为其中之一，就应该培养对技术和软件开发的热情和好奇心。实现这一点有多种方法，但最简单且最有吸引力的方法是在日常工作之外，尝试新的和早期发布的版本、第三方组件以及自己的项目。此外，培养在团队中的工作方式将有助于保持高动力，因此建议学习成为一名团队合作者，而不仅仅是一个团队成员。\n\
  \n### 需要记住的要点\n\n*   开发者是对技术充满热情的人。永远不要感到烦恼，让这种热情始终保持。编写自己的代码，尝试不同的事物并进行实验。\n* \
  \  成功和失败都是团队共同的。通过成为一名团队合作者来帮助团队成长。保持积极、保持投入，并在必要时举手主动承担。\n*   紧跟技术潮流是软件开发者的必修课。知道的越多，能做的就越多。你还可以为公司项目的技术决策提供帮助。\n\
  \n##建议阅读\n\n*   如何成为一名出色的团队合作者 ([`www.mindtools.com/pages/article/newTMM_53.htm`](https://www.mindtools.com/pages/article/newTMM_53.htm))\n\
  *   如何让编程变得令人兴奋更有趣 ([`www.freecodecamp.org/news/how-to-make-programming-more-exciting-and-funnier/`](https://www.freecodecamp.org/news/how-to-make-programming-more-exciting-and-funnier/))\n\
