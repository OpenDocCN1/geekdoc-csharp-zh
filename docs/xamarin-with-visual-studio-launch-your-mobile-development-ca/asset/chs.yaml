  \ Path 绘制自定义形状\n\n`Path` 类可以绘制更复杂的形状，其 `Data` 属性也可以赋值 `Geometry` 对象。这些是经过优化的特殊对象，用于绘制\
  \ 2D 形状，并允许绘制简单和复杂的几何结构。在简单几何结构中，有 `EllipseGeometry`、`LineGeometry` 和 `RectangleGeometry`，它们的名称不言自明。例如，以下代码绘制了一个椭圆、一条线和一个矩形：\n\
  \n```xml\n<Path Fill=\"Yellow\" Stroke=\"Red\">\n<Path.Data>\n  <EllipseGeometry\
  \ Center=\"50,50\" RadiusX=\"50\" RadiusY=\"50\" />\n</Path.Data>\n</Path>\n\n<Path\
  \ Stroke=\"Black\">\n<Path.Data>\n  <LineGeometry StartPoint=\"10,20\" EndPoint=\"\
  100,130\" />\n</Path.Data>\n</Path>\n\n<Path Fill=\"Yellow\" Stroke=\"Red\">\n<Path.Data>\n\
  \  <RectangleGeometry Rect=\"10,10,150,100\" />\n</Path.Data>\n</Path>\n```\n\n\
  以下列表总结了关键属性：\n\n* 对于 `EllipseGeometry` 对象，你通过 `Center` 属性控制椭圆中心（该属性是一个 `Point` 类型的坐标），并通过类型为\
  \ double 的 `RadiusX` 和 `RadiusY` 属性控制半径。\n* 对于 `LineGeometry` 对象，你通过 `StartPoint`\
  \ 和 `EndPoint` 属性定义线的边界，但线的位置由 `Path` 的位置决定。\n* 对于 `RectangleGeometry` 对象，`Rect`\
  \ 属性定义了矩形的边界。\n\n另一个名为 `PathGeometry` 的 `Geometry` 对象使得创建极其复杂的形状成为可能，包括曲线和弧。由于其在非常特定的场景下使用，本章未对此涵盖，但官方文档提供了带有示例的良好概述，可以在\
  \ `https://docs.microsoft.com/en-us/xamarin/xamarin-forms/user-interface/shapes/geometries`\
