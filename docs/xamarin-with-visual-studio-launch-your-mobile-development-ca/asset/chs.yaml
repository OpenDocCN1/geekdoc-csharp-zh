  \ `Microsoft.NETCore.App`。对于基于 .NET Core 构建的控制台项目，所需的依赖项是 `Microsoft.NETCore.App`。\n\
  \n分析器（Analyzers）是分析你代码的特殊工具。更多信息请参见[docs.microsoft.com/visualstudio/code-quality/roslyn-analyzers](https://docs.microsoft.com/visualstudio/code-quality/roslyn-analyzers)。你也可以通过在搜索框中输入内容来过滤列表。对于错误和警告，你都可以双击`Error\
  \ List（错误列表）`中的消息，代码编辑器将直接移动到导致消息的代码。你也可以按`F1` 或选择`Show Error Help（显示错误帮助）`命令来获取有关特定消息的帮助。\n\
  \n\n\n\n\n`Properties` 窗口由两列组成。左列显示属性名称，右列包含属性值。对于 C# 对象，你通常会在代码中设置属性，但对于控件（用户界面的元素）或文件，你可以利用\
  \ `Properties` 窗口。打开 `Properties` 窗口的快捷键是 `F4`。\n\n### 输出窗口 (Output window)\n\n\
  Visual Studio 会持续调用外部工具。编译器和 NuGet 包管理器是 Visual Studio 经常需要运行的工具示例。外部工具在完成后会发送其操作结果，Visual\
  \ Studio 将此类输出重定向到 `Output` 窗口。以编译器为例，当编译过程完成后，编译器的输出将发送到 `Output` 窗口，而不是显示在系统控制台中。[图\
  \ 3.15] 显示了 `Output` 窗口的一个示例，其中包含了 C# 项目的编译过程结果：\n\n![](img/Figure-3.15.jpg)\n\n\
  **图 3.15:** 显示程序编译结果输出窗口\n\n输出窗口是交互式的。例如，当你编译程序时，如果编译器报告了任何错误，`Output` 窗口会显示这些错误，你可以点击窗口工具栏上的按钮来导航错误消息。导航到错误消息还会让代码编辑器打开导致该错误的代码。你会发现\
  \ `Output` 窗口极其有用，特别是在调试时，因为它还会显示调试器输出。如果你点击 `Show` `Output From` 拉框，你将看到可用输出的列表。\n\
  \n### 编辑项目属性 (Editing project properties)\n\n在 Visual Studio 术语中，项目设置被称为项目属性（project\
  \ properties）。这些包括应用程序文件名、应用程序图标、版本号、版权信息和编译设置。要打开项目属性，你需要在 `Solution Explorer`（解决方案资源管理器）中右键点击项目名称，然后选择\
  \ `Properties`。[图 3.16] 显示了你之前创建的第一个 C# 程序的 `Properties` 编辑器：\n\n![](img/Figure-3.16.jpg)\n\
  \n**图 3.16:** 编辑项目属性\n\n`Properties` 编辑器按标签页组织，每个标签页代表项目的特定区域，例如应用程序级属性、外部引用、部署选项、编译选项和调试选项。目前，你不需要学习所有的标签页，因为它们会根据你正在处理的项目类型而变化。对于\
  \ Xamarin 项目，`Properties` 编辑器具有特定的标签页，将在相应的章节中讨论。实际上， `Application` 标签页是目前唯一会被讨论的，因为它适用于所有项目类型。\n\
  \n### 编辑应用程序设置 (Editing application settings)\n\n应用程序设置包括可执行文件的名称、图标，或操作系统感兴趣的元数据，例如程序版本、版权信息等。`Application`\
  \ 标签页允许你编辑此类设置，并且会在你首次打开 `Properties` 时默认显示（参见[图 3.16]）。具体来说：\n\n*   `Assembly Name`（程序集名称）字段用于设置编译程序集的名称。默认情况下，程序集的名称基于项目名称。\n\
  *   `Default Namespace`（默认命名空间）字段用于设置根级命名空间标识符。（命名空间将在下一章讨论）。你可以将根命名空间想象为存储项目实现的所有内容的对象。根据微软规范，根命名空间的形成应如下：`CompanyName.ProductName.Version`（非强制）。\n\
  *   `Output type`（输出类型）指定应用程序类型（例如，控制台应用程序、类库、Windows Forms 应用程序），由 Visual Studio\
  \ 自动设置。你不应该更改此框中的默认设置。\n*   `Target framework`（目标框架）允许你更改作为应用程序运行时的 .NET 目标版本。当发布\
  \ .NET 新版本且你想让程序利用其新功能时，这对于桌面应用程序可能有用。\n*   `Startup object`（启动对象）允许你指定应用程序的主入口点。这在\
  \ Windows 项目中可能很有意义，但在 Xamarin 项目中则不同。\n\n`Resources`（资源）组允许你为 Windows 应用程序指定图标以及必须嵌入应用程序本身的资源。这些将不会用于\
  \ `Xamarin.Forms` 项目，因为它们处理资源的方式不同。\n\n### 基本代码编辑功能 (Basic code editing features)\n\
  \n代码编辑器是你度过开发者生涯大部分时间的地方，因此了解如何利用它提供的所有工具来提高效率至关重要。显然，并不是所有工具都能在本章讨论，因为它们一方面需要更多\
  \ C# 语言知识，另一方面则需要更复杂的项目。因此，你将学习如语法高亮、IntelliSense 和代码缩放等功能。其他将在将在章讨论，届时你将学习更多 C#\
  \ 的知识。\n\n### 语法高亮 (Syntax colorization)\n\n如果你回看[图 3.9] 并查看示例程序的源代码，你可以注意到单词具有不同的颜色。Visual\
  \ Studio 在视觉上让你更容易理解每个单词指代什么。特别是：\n\n*   C# 语言的保留字为蓝色。\n*   .NET 或自定义库内部对象的名称为浅蓝色。\n\
  *   此类对象暴露的成员名称为深灰色。\n*   命名空间标识符为黑色。\n*   字符串为棕色。\n*   注释为绿色。\n\n语法高亮是每个代码编辑器中极其重要的功能，因为你的眼睛会立即根据颜色识别源代码的部分，这会使你的工作速度更快。\n\
  \n### 缩放代码编辑器 (Zooming the code editor)\n\n代码编辑器支持放大和缩小。这是通过按 Ctrl 键并上下移动鼠标轮来实现的。你也可以通过更改\
  \ IDE 左下角的缩放百分比来缩放代码编辑器（参见[图 3.9]）。\n\n### 介绍 IntelliSense (Introducing IntelliSense)\n\
  \nIntelliSense 是一种提高编码体验的工具，表现为在你输入时在代码编辑器中弹出的集成窗口，其目标是提供自动补全选项。[图 3.17] 显示了在添加新指令时\
  \ IntelliSense 的工作情况：\n\n你可以通过以下选项之一完成自动补全：\n\n*   `Tab`：按下 *Tab* 键选择选中的自动补全选项并允许编写其他代码。\n\
  *   `Spacebar`：按下空格键选择选中的自动补全选项，在末尾添加一个空格并允许编写其他代码。\n*   `Enter`：按下 *Enter* 键选择选中的自动补全选项，在末尾添加一对空括号并将光标移动到新行。当你添加不需要参数的方法时，建议使用此选项。\n\
  *   `(`：按下 `(` 键选择选中的自动补全选项，在末尾添加左括号并允许你提供参数。\n*   `Ctrl + spacebar`：按下 *Ctrl* +\
  \ 空格键将调出完整的 IntelliSense 选项列表。\n\n\n\n\n当你输入一个字符时，IntelliSense 就会激活，它甚至对 C# 保留字有效。当你从\
  \ IntelliSense 列表中选择一个单词、成员名称或标识符时，它还会显示相关文档（如果可用）。列表还可以根据成员类型进行过滤。IntelliSense\
  \ 是一项非常有价值的生产力工具，因为提供的建议也是基于上下文。这项技术不仅适用于 C#，还适用于所有 .NET 语言以及 XAML 和 HTML 等标记语言。\n\
  \n# 更改代码编辑器选项](#toc.xhtml_s84a)\n\n代码编辑器可以通过许多方式进行自定义。你可以通过 `Tools` | `Options`\
  \ 访问代码编辑器设置，然后在 `Options` 对话框中找到 `Text Editor` 节点（参见图 3.18）。\n\n![](img/Figure-3.18.jpg)\n\
  \n**图 3.18：访问代码编辑器设置**\n\n对代码编辑器选项的深入解释超出了本的范围，但在这里你可以找到可以在设置中更改的任何内容。例如，你可以通过选择\
  \ All Languages、Line Numbers 来启用行号，或者通过 All Languages 下或各个语言名称下的 `Tabs` 节点来控制默认间距和缩进。`Options`\
  \ 是自言自语的，因此理解它们的工作原理和作用并不困难。\n\n**你可能会惊讶地发现 Text Editor 选项并没有提供自定义字体和颜色的功能。这是因为这些位于\
  \ Environment 节点下的 Fonts 和 Colors 子节点下。在这里，你可以更改代码编辑器的所有默认属性，包括保留字、标识符、注释和字符串的颜色。**\n\
  \n# 编译、运行和调试代码](#toc.xhtml_s85a)\n\n编译项目意味着从源代码和资源文件生成 .NET 程序集。在 Visual Studio\
  \ 中，此过程也被称为生成（building）。正如你之前在本章的“.NET 中的程序集”节中学到的，程序集可以是一个独立的应用程序（`.exe` 文件），也可以是一个类库（`.dll`\
  \ 二进制文件）。然而，由于 Visual Studio 支持许多应用程序类型（包括原生移动应用），编译过程也可以为特定平台生成生成二进制文件，例如用于 Android\
  \ 的 `.apk` 文件和用于 iOS 的 `.ipa` 文件。要将项目编译为应用程序，你需要使用 `Build` 。具体来说，你点击 `Build`，`Build\
  \ ProjectName`，其中 `ProjectName` 是你的项目名称。当你调用此命令时，Visual Studio 会启动一个名为 `MSBuild.exe`\
  \ 的命令行工具，它能够编译整个解决方案。当 `MSBuild` 完成解决方案编译后，Visual Studio 会 `Output` 窗口中显示日志。如果你回看图\
  \ 3.15，可以看到 `MyFirstProgram` 示例应用程序编译过程的输出日志。编译日志非常重要，特别是当编译过程失败时。如果因为代码错误导致编译失败，这些错误将列在之前描述的\
  \ `Error List` 窗口中（参见图 3.13）。如果编译成功，生成的二进制文件将放在 `Bin\\Debug` 或 `Bin\\Release` 子文件夹中，取决于所选的输出配置。\n\
  \n# 理解配置](#toc.xhtml_s86a)\n\n默认情况下，Visual Studio 为编译项目提供了两种配置：\n\n*   **Debug**：此配置确保\
  \ C# 编译器生成调试符号，以便你可以使用 Visual Studio 调试器调试和测试你的应用程序。\n*   **Release**：此配置在编译时排除调试符号，并对将应用程序发布给用户的过程进行生成过程优化。\n\
  \n配置可以通过使用 Visual Studio 工具栏上的组合框或通过 `Properties` 窗口的 `Build` 选项卡进行设置（参见图 3.19）。\n\
  \n![](img/Figure-3.19.jpg)\n\n**图 3.19：更改生成配置**\n\n对于 Xamarin，还有一个名为 Ad-Hoc 的额外配置。它与\
  \ Release 配置非常相似，但针对分发给测试人员进行了优化，并要求使用适当证书对应用进行签名。在实践中，在你准备好发布应用程序包之前，你不会使用 Ad-Hoc，在开发期间，你通常会使用\
  \ Debug 配置。\n\n**提示：Visual Studio 还允许你基于默认配置创建自定义配置。你可以通过点击 `Build` | `Configuration\
  \ Manager` 来实现。在大多数情况下，创建自定义配置并不是必要的，因此此处将不会涉及这一点，特别是对于 Xamarin，建议使用提供的配置。因此，这个提示更多是为了扩充你的知识，而不是实际用途。**\n\
  \n`Properties` 窗口的 `Build` 选项卡允许自定义和控制编译选项。然而，此选项卡（以及编译选项）会根据你正在开发的应用程序类型而变化。对于\
  \ Xamarin，`Build` 选项卡为 Android 和 iOS 项目提供了不同的选项。目前，请记住 `Build` 选项卡是你控制编译选项的地方。特别是对于\
  \ Android，编译选项的更改将在第五章：使用 Xamarin 和 Xamarin.Forms 构建移动应用 中讨论。\n\n# 运行和调试代码](#toc.xhtml_s87a)\n\
  \n使用 Visual Studio 创建应用程序时，你可以从 IDE 内部运行应用程序以查看其工作原理，你有两种方法来实现：\n\n*   在附加调试器实例的情况下运行应用程序。这需要启用\
  \ Debug 配置。\n*   在不附加调试器实例的情况下运行应用程序。建议启用 Release 配置。\n\n**为了在附加调试的情况下启动应用，你可以按\
  \ F5，或者点击 IDE 工具栏上显示项目名称带有绿色播放图标的按钮。相反，按 CTRL+F5 可无调试启动。**\n\n对于示例控制应用程序，应用程序将在系统控制台窗口中运行。对于\
  \ Windows Forms 或 WPF 项目，应用程序将在 Windows 内部运行并带有图形界面。对于 Xamarin 项目，应用程序将在手机或平板模拟器或物理设备上运行。调试器是一个复杂的工具，它可以分析整个应用程序生命周期内每一行代码的执行，并允许发现错误、修复问题、查找特定时刻变量的值，或仅仅分析执行流。调试在开发周期中至关重要，你将花费长时间调试代码。因此，理解\
  \ Visual Studio 调试应用程序的基本概念是非常重要的，这些也适用于 Xamarin 开发。在继续之前，在示例项目的 `Console.WriteLine`\
  \ 语句之后添加以下代码行：`Console.ReadLine();` 这将使处于等待状态，等待用户输入。\n\n# 调试你的代码](#toc.xhtml_s88a)\n\
  \n\n\n\n调试是分析应用程序执行流、寻找 bug 以及发现运行时错误的过程。为了实现这一点，调试器需要所谓的 `symbols`（符号），这是一组数据文件，调试器使用它们将源代码与运行时库及依赖项连接起来并分析执行流。Visual\
  \ Studio 仅在选择 Debug（调试）配置时才会生成符号，因此，调试时需要它。现在，按 `F5` 开始调试。Visual Studio 将首先编译项目，然后运行应用程序。调试器会分析每一行代码的执行情况，检测运行时错误，并允许开发者控制执行流。*图\
  \ 3.20* 显示了在调试模式下运行的应用程序：\n\n![](img/Figure-3.20.jpg)\n\n**图 3.20：** 附加调试器运行的应用程序\n\
  \n在 IDE 的底部区域，可以使用某些标签，如 `Locals`（本地变量）、`Watch 1`（监视 1）、`Call Stack`（调用栈）、`Breakpoints`（断点）、`Command\
  \ Window`（命令窗口）、`Immediate Window`（立即窗口）和 `Output`（输出）。这些实际上是带有特定调试工具的工具窗口，将在后续章节中根据需要被调用。当应用程序处于调试模式时，Visual\
  \ Studio 的状态栏和边框会变为橙色。在学习这些工具之前，你需要修改示例应用程序的源代码，使其故意产生错误，以便你在调试器的帮助下修复这些错误。\n\n\
  ### 为调试准备示例项目\n\n在本节中，你将学习如何调试代码、如何分析执行流以及如何修复错误。这需要一些用于此目的的代码。进入 Visual Studio，在编辑器中将现有代码修改如下：\n\
  \n```csharp\nusing System;\nusing System.IO;\n\nnamespace MyFirstProgram\n{\n  \
  \  class Program\n    {\n        static void Main(string[] args)\n        {\n  \
  \          // 要显示的的文本消息\n            string textMessage = \"Hello World!\";\n  \
  \          // 尝试打开一个不存在的文件\n            string textFileContent = File.ReadAllText(@\"\
  C:\\MyFile.txt\");\n            // 显示文本消息\n            Console.WriteLine(textMessage);\n\
  \            // 等待用户输入\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
  \n接下来的章节将教你更多关于 C# 语言的概念，但简而言之，这里有：\n\n*   顶部的两个 `using` 指令，它们简化了代码中访问某些对象的方式。\n\
  *   以项目命名的 `root` 命名空间。\n*   名为 `Program` 的 `root` 类定义，它包含了应用程序启动时将执行的第一段代码，以及 `Main`\
  \ 方法（在 .NET 术语中，函数被称为方法）。\n*   类型为 `string` 的变量 `textMessage`，包含一些文本，对于分析执行流很有用。\n\
  *   类型为 `string` 的变量，包含调用 `File` 类中的 `ReadAllText` 方法产生的结果，该方法尝试读取不存在的文件内容。这对于理解如何调试运行时错误很有用。\n\
  *   来自 `Console` 类的 `WriteLine` 方法，用于显示上面定义的文本消息。\n*   来自 `Console` 类的 `ReadLine`\
  \ 方法，它等待用户按回车键，这对于避免之前的指令结束时应用程序自动关闭很有用。\n\n现在你已经准备好了源代码，终于可以利用调试器的所有功能了。\n\n###\
  \ 断点和数据提示\n\n断点提供了一种细粒度控制代码执行流的方法。你可以在代码的某处放置一个断点，执行将在该处中断（中断模式）。在中断模式下，你可以分析变量值和对象状态，并采取适当的行动。完成后，你可以从相同点恢复执行。你可以通过将光标置在特定代码行上然后按\
  \ `F9` 来添加断点。你放置断点的代码行将会变为红色高亮（参见*图 3.21*）：\n\n![](img/Figure-3.21.jpg)\n\n**图 3.21：**\
  \ 添加断点\n\n为了实践性地理解断点，请按 `F5` 开始调试应用程序。当遇到断点时，调试器会中断执行，在行本身执行之前，当前代码行将被黄色高亮（参见*图\
  \ 3.22*）：\n\n![](img/Figure-3.22.jpg)\n\n**图 3.22：** 使用断点分析执行流\n\n注意 `Locals tool`\
  \ 窗口如何显示每个变量在那一刻的值。在这种情况下，它们还没有值，因为第一行代码尚未执行，但 `Locals` 的目的是帮助你理解变量的值。\n\n**提示：**\
  \ 如果你在*图 3.22* 中看到的工具窗口在 Visual Studio 中没有可用，你可以通过打开 `Debug` 菜单然后选择 `Windows` 以及感兴趣的项目来手动启用它们。\n\
  \n同样，如果你悬停在 `textMessage` 变量上，你可以看到工具提示。此功能被称为数据提示（data tips）（参见*图 3.23*）：\n\n![](img/Figure-3.23.jpg)\n\
  \n**图 3.23：** 使用数据提示显示变量值\n\n一旦你完成了对对象的分析，你可以按 `F5` 恢复执行（直到遇到下一个断点），或者逐行继续。按 `F10`（`Debug`\
  \ 菜单中 `Step Over` 命令的快捷键）允许你一次执行一条语句。而使用 `F11`，你执行的是单行代码（这是 `Debug` 菜单中 `Step Into`\
  \ 命令的快捷键）。继续当前代码示例，你可以按 `F11` 检查 `textMessage` 变量是否已正确初始化。无论按 `F10` 还是 `F11`，调试器都会执行放置断点的行，Visual\
  \ Studio 将高亮行变为黄色。现在，你可以再次悬停在变量上查看赋值结果，现在是 \"Hello World!\"。\n\n\n\n如你所见，代码编辑器用浅绿色高亮了导致错误的代码行。标题为\
  \ `Exception Unhandled` 的工具提示还显示了有关错误的摘要信息。在这种情况下，抛出了 `FileNotFoundException` 错误，且未被开发者处理。这就是应用程序执行中断的原因。`Exception\
  \ Unhandled` 工具提示还显示了错误消息的描述；在此例中，描述为找不到指定的文件。此时，你还可以点击 `View Detail`，这将允许你打开 `Quick\
  \ Watch` 窗口，如*图 3.25*所示：\n\n![](img/Figure-3.25.jpg)\n\n**图 3.25:** 调查错误详情\n\n`QuickWatch`\
  \ 对话框显示了 `FileNotFoundException` 类的属性列表。其中，`StackTrace` 属性非常有用，因为它显示了导致错误的对象的完整调用层级。另一个有趣的属性是\
  \ `InnerException`。在当前示例中，它被设置为 null，但在许多情况下，它将显示在当前异常发生之前发生的异常层级。现在，你应该做的是修复错误并重启应用程序。在下一章中，你将学习如何正确实现错误处理，但目前，你已经发现了如何检测\
  \ bug 和错误的方法。\n\n### 结论\n\n在本章中，你学习了 .NET 技术的基础及其当前状态，并开始使用 Visual Studio 2019 开发环境，创建了你的第一个\
  \ C# 项目，并理解了调试器的工作原理。当你开始使用 Xamarin 时，这些概念将非常有用，但首先你需要概述 C# 编程语言，该语言将在下一章中介绍。\n\n\
  ### 记忆要点\n\n*   .NET 是一种开源、跨平台且跨设备的技术，允许创建和运行下一代应用程序。\n*   .NET 具有分层架构，位于操作系统和应用程序之间。\n\
  *   .NET 6 将所有 .NET API 统一到一个代码库中。\n\n### 关键术语\n\n*   **.NET 程序集 (Assembly)**：由编译过程生成的二进制文件，包含可执行代码和元数据。\n\
  *   **基类库 (Base Class Library)**：来自 .NET 的主要重用代码和组件库。\n*   **集成开发环境 (IDE)**：一种将代码编辑器、调试器和应用程序生命周期管理工具于一体的开发工具。\n\
  *   **调试器 (Debugger)**：用于发现应用程序中 bug 和异常的工具。\n\n# 第 4 章\n\n## C# 编程语言\n\n### 引言\n\
  \nC# 是一种你可以用于编写各种 .NET 应用程序的编程语言，包括使用 Xamarin 开发的移动应用。它首次于 2002 年随 .NET Framework\
  \ 1.0 发布，并很快受到数百万开发者的喜爱，因为它提供了充分利用 .NET 力量的能力，其语法对于使用 C 和 C++ 的开发者来说非常熟悉，并结合了 Visual\
  \ Basic 典型的易用性。本章总结了你作为一名使用 Xamarin 编写移动应用的开发者时需要了解的最相关特征。该语言的其他更具体的特性将在后续章节中在合适的情况下进行描述。\n\
  \n正如你想象的，不可能在几页纸内详细描述 C# 编程语言。在章末尾，你将找到关于 C# 的书籍和文档建议。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   理解数据类型\n*   常用数据操作符\n*   迭代对象\n*   理解循环\n*   条件代码块\n*   引入数组\n*   面向对象编程\n\
  *   高级 C# 编程\n\n### 目标\n\n完成本章后，你将能够利用最相关的 C# 基础特性，这些特性不仅是你构建 Xamarin 应用时所需要的，而且你可以将它们用于任何\
  \ .NET 项目。\n\n### 理解数据类型\n\n应用程序处理数据，这些数据可以是不同类型：数字、日期、文本，以及这些类型中的某些组合成的复杂类型，代表应用程序必须处理的现实世界对象。.NET\
  \ 实现了原始数据类型并允许创建自定义类型。此外，.NET 类型在语言之间是共享的，这得益于 .NET 的另一项称为 `通用类型系统 (Common Type\
  \ System)` 的功能。在本节中，你将学习什么是通用类型系统、.NET 提供了原始类型，以及值类型和引用类型之间的区别。在稍后的面向对象编程部分，你将学习如何创建自定义类型，这是你在日常工作中经常需要做的事情。\n\
  \n### 认识通用类型系统\n\n.NET 提供了一种处理数据类型的方法，称为 `通用类型系统 (Common Type System)`。它为暴露数据类型提供了一个统一模型，使得所有\
  \ .NET 语言（如 C#、Visual Basic 和 F#）都可以使用相同的数据类型。例如，32 位整数由 `System.Int32` 数据类型表示，所有\
  \ .NET 语言都可以调用 `System.Int32` 对象来声明整数，因为该类型是由 .NET Framework 提供的且与语言无关的。\n\n`System`\
  \ 是 .NET 的根命名空间。命名空间可以被视为类型的容器，正如你将在本文的*面向对象编程*部分中学到的那样。\n\n实际上，每个数据类型都是继承自 `Object`\
  \ 的对象。该类提供了所有 .NET 类型都具备的基础设施。.NET 自带了数千个内置数据类型，它们都派生自 `System.Object`，而通用类型系统确保了这一点。在讨论了值类型和引用类型后，这个概念将变得更加清晰。\n\
  \n### 区分值类型和引用类型\n\n值类型是直接存储数据的类型。值类型的示例包括整数 (`System.Int32`)、布尔值 (`System.Boolean`)、日期\
  \ (`System.DateTime`) 和字节 (`System.Byte`)。值类型存储在称为栈的内存区域。以下是一个包含值的值类型示例：\n\n```\n\
  System.Int32 anInteger = 5;\n```\n\nC# 定义了代表通用类型系统的保留字，例如 `int` 代表 `System.Int32`，`bool`\
  \ 代表 `System.Boolean`，`byte` 代表 `System.Byte`，因此之前的赋值可以重写为（这也是常用的实现方式）：\n\n```\n\
  int anInteger = 5;\n```\n\nC# 是大小写敏感的。这意味着你需要注意关键字和标识符的大小写。C# 编译器总是会通知无效的引用，且 IntelliSense\
  \ 会帮助你快速选择正确的引用，但这是你需要记住的一点。例如，`int` 是保留字，而 `Int` 则。\n\n引用类型是仅引用实际数据的类型。换句话说，引用类型在栈中存储其数据的地址，而实际数据存储在另一个称为托管堆（managed\
  \ heap）的内存区域。引用类型由类表示，类将在*面向对象编程*部分进行更详细的描述。以下是一个引用类型的示例：\n\n```csharp\nclass Person\n\
  {\n    string FirstName { get; set; }\n    string LastName { get; set; }\n}\n```\n\
  \n\n\n\n引用类型派自 `System.Object` 或其他派自 `System.Object` 的类，这些类定义了所有引用类型的通用基础。从对象“派生”（`Deriving`，或继承\
  \ `inheriting`）将在稍后的面向对象编程（OOP）部分进行详细解释，但它意味着对象将自动实现起始类暴露的所有公共成员。C# 也用 `Object`\
  \ 关键字来表示这一点。值类型则经过一个名为 `System.ValueType` 的中间对象，该对象派自 `System.Object` 并定义了所有值类型的通用基础。\n\
  \n### .NET 原始类型\n\n基类库（Base Class Library）提供了几种内置的原始类型，你可以根据需要使用。C# 提供了一些保留字，作为常用值类型名称的对应项。你可以交替使用\
  \ .NET 名称和 C# 保留字。[表 4.1] 列出了 .NET Framework 中最常见的原始类型，以及每个类型的描述和 C# 关键字：\n\n| **类型**\
  \ | **描述** | **C# 关键字** |\n| :--- | :--- | :--- |\n| `System.Int16` | 表示范围在 –32768\
  \ 到 32767 之间的数值。 | `short` |\n| `System.Int32` | 表示范围在 –2147483648 到 2147483647\
  \ 之间的数值。 | `int` |\n| `System.Int64` | 表示范围在 –9223372036854775808 到 9223372036854775807\
  \ 之间的数值。 | `long` |\n| `System.Single` | 表示范围从 –3.4028235E+38 到 3.4028235E+38 的浮点数。\
  \ | `float` |\n| `System.Double` | 表示大范围浮点数（双精度），范围从 –1.79769313486232e308 到 1.79769313486232e308。\
  \ | `double` |\n| `System.Boolean` | 接受 True 或 False 值。 | `bool` |\n| `System.Char`\
  \ | 表示单个 Unicode 字符。 | `char` |\n| `System.DateTime` | 表示不同支持格式的日期、时间或两者（见后续段落）。\
  \ | `DateTime` |\n| `System.Byte` | 表示无符号字节，范围从 0 到 255。 | `byte` |\n| `System.SByte`\
  \ | 表示有符号字节，范围从 –128 到 127。 | `sbyte` |\n| `System.UInt16` | 表示范围在 0 到 65535 之间的正数值。\
  \ | `ushort` |\n| `System.UInt32` | 表示范围在 0 到 4294967295 之间的正数值。 | `uint` |\n| `System.UInt64`\
  \ | 表示范围在 0 到 18446744073709551615 之间的正数值。 | `ulong` |\n| `System.Decimal` | 表示财务和科学计算中带有大数字的十进制数，范围在\
  \ –79228162514264337593543935 到 79228162514264337593543935 之间。 | `decimal` |\n|\
  \ `System.TimeSpan` | 表示时间间隔，范围在 –10675199102846868 ticks 之间。 | |\n| `System.Guid`\
  \ | 允许生成全局唯一标识符。 | |\n| `System.String` | 表示文本。 | `string` |\n\n表 4.1: .NET 原始数据类型\n\
  \n### 声明和使用变量\n\n变量是与可能改变值的符号名称。在每种语言中，变量必须具有特定类型。在 C# 中声明变量时，语法要求你首先指定类型，然后是标识符，可选以及值。以下示例演示了如何在控制台（Console）中声明并显示不同变量的值：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    int anInteger = 2;\n    double\
  \ calculation = 74.6 * 834.1;\n    byte oneByte = 0x0;\n    string sampleText =\
  \ \"Hello World in 2021!\";\n    bool isTrueOrFalse = true;\n    Console.WriteLine(anInteger);\n\
  \    Console.WriteLine(calculation);\n    Console.WriteLine(oneByte);\n    Console.WriteLine(sampleText);\n\
  \    Console.WriteLine(isTrueOrFalse);\n    Console.ReadLine();\n}\n```\n\nC# 还允许你使用\
  \ `var` 关键字在不显式指定类型的情况下声明变量。该关键字启用名为“局部类型推断”的功能，并将识别类型的工作委托给编译器。它的工作如下：\n\n```csharp\n\
  // 声明一个 Integer\nvar anInteger = 2;\n// 声明一个 double 并存储计算结果\nvar calculation = 74.6\
  \ * 834.1;\n// 声明一个存储十六进制值的 byte\nvar oneByte = 0x0;\n// 声明一个 string\nvar sampleText\
  \ = \"Hello World in 2021!\";\n// 声明一个 Boolean 变量\nvar isTrueOrFalse = true;\n```\n\
  \n通常情况下，显式声明变量类型是最佳实践。但在某些情况下，使用 `var` 更方便；例如，当显式类型非常长或当你处理匿名类型时。\n\n### 澄清值类型和引用类型的区别\n\
  \n值类型和引用类型之间存在差异，这与它们在内存中的分配方式以及管理数据有关。值类型包含它们所表示的数据，并存储在名为 `stack`（栈）的内存区域。引用类型仅包含它们表示的实际数据的地址（引用）。地址存储在栈中，而实际数据存储在另一个名为托管堆（managed\
  \ heap）的区域中。为了更好地理解，考虑以下处理值类型的代码行：\n\n```csharp\nint firstInteger = 1;\nint secondInteger\
  \ = firstInteger;\n```\n\n通过这些行，将 `firstInteger` 的值赋值给 `secondInteger` 会创建一个 `firstInteger`\
  \ 值的精确拷贝，这意味着在内存中拥有两个整数。如果你更改了 `secondInteger` 的值，不会影响 `firstInteger`；演示如下：\n\n\
  ```csharp\nsecondInteger = 2;\nConsole.WriteLine(firstInteger); // 输出 1\nConsole.WriteLine(secondInteger);\
  \ // 输出 2\n```\n\n现在，考虑以下基于引用类型的示例。使用上面定义的 `Person` 类：\n\n```csharp\nPerson person1\
  \ = new Person();\nperson1.LastName = \"Del Sole\";\nPerson person2 = person1;\n\
  ```\n\n通过将 `person1` 赋值给 `person2`，你并没有创建 `person1` 的拷贝。相反，你创建了对象地址的拷贝。假设你写了以下行：\n\
  \n```csharp\nperson2.LastName = \"White\";\nConsole.WriteLine(person2.LastName);\
  \ // 输出 White\nConsole.WriteLine(person1.LastName); // 输出 White\n```\n\n你会看到更改实例属性会影响相同地址的源实例。这些澄清非常重要，你始终需要记住它们，特别是在处理引用类型时。\n\
  \n### 常用数据运算符\n\nC# 提供了不同的运算符，例如算术运算符、比较运算符和逻辑运算符。本节对每类运算符进行了简要描述。\n\n### 等于不等于运算符\n\
  \n`==` 和 `!=` 运算符分别允许检查条件是否为真。以下代码显示了一个示例：\n\n```csharp\nbool trueValue = true;\n\
  if(trueValue == true)\n{\n    // 条件为真\n}\nif(trueValue != true)\n{\n    // 条件为假\n\
  }\n```\n\n这些运算符可以使用任何需要执行条件检查的地方，而是在 `if` 块中。\n\n\n\n\n\n提示：当你需要比较两个相同类的实例是否相等时，你将使用每个实例暴露的\
  \ `Equals` 方法，该方法继承自 `System.Object`。在 .NET 中还有其他方法比较对象的相等性，但此处不进行讨论。\n\n### 算术运算符\n\
  \nC# 提供了[表 4.2]中列出的算术运算符。\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `+` | 加法运算符 |\n| `-`\
  \ | 减法运算符 |\n| `*` | 乘法运算符 |\n| `/` | 除法运算符 |\n| `^` | 幂运算符 |\n| `%` | 取模运算符 |\n\
  \n**表 4.2：** C# 中的算术运算符\n\n运算符的优先级遵循算术规则。例如，在以下行中，乘法会在加法之前执行：\n\n```csharp\ndouble\
  \ result = 10 + 20 * 5;\n```\n\n前四个运算符也可以作为递增运算符。例如，假设你有以下代码：\n\n```csharp\nint\
  \ value = 1;\nvalue++;\n```\n\n第二行将值递增了一个单位。这就是所谓的后置递增。现在，考虑以下代码：\n\n```csharp\n\
  int value = 1;\nConsole.WriteLine(++value);  // 显示 2\n```\n\n在这种情况下，递增发生在使用值之前，被称为前置递增。此外，递增运算符可以用于递增指定数量的单位。例如，以下行将值增加了\
  \ 2 个单位：\n\n```csharp\nvalue+=2;  // 等同于 value = value + 2;\n```\n\n下一行将值乘以 2：\n\
  \n```csharp\na*=2;  // 等同于 value = value * 2;\n```\n\n记住，.NET 提供了 `System.Math`\
  \ 类，它暴露了许多简化算术操作的方法。\n\n### 转换运算符\n\n你将非常经常需要在 .NET 类型之间进行转换。例如，当用户在 Xamarin.Forms\
  \ 中点击列表中的某项时，选中的项由一个对象实例表示，但你显示的数据是特殊类型，因此你需要将它从对象转换为你的类型。你可能还需要将整数表示为字符串，因此你需要进行适当的转换。转换发生的场景有很多，所以你至少需要对转换运算符有一个整体了解。\n\
  \n### 直接类型转换\n\n假设你有以下代码，其中 `onePerson` 是 `Person` 类型的对象：\n\n```csharp\nobject aPerson\
  \ = onePerson;\n```\n\n这在 C# 中是合法的，但不最优，因为 `aPerson` 实际上是 `Person` 类的实例；因此，你可能想将其转换为适当的类型。可以这样做：\n\
  \n```csharp\nPerson result = (Person)aPerson;\n```\n\n目标类型包含在括号中，结果赋值给目标变量。然而，如果转换失败，将抛出错误。这在你指定了无效的目标类型时可能会发生。你可以处理此错误，也可以如下所示使用\
  \ `as` 运算符：\n\n```csharp\nPerson result = aPerson as Person;\n```\n\n如果转换失败，`as`\
  \ 将返回 `null` 而不是抛出错误。你可以使用 `if` 块检查转换是否成功：\n\n```csharp\nif(result != null)\n{\n\
  \    // 执行某些操作\n}\n```\n\n值类型不支持 `as` 运算符，除非它们可空类型（参见本章后续的“处理可空类型”部分）。\n\n### 使用\
  \ Convert 类转换类型\n\n.NET 基类库提供了 `System.Convert` 类，它暴露了用于类型间快速转换的函数。以下示例演示了如何将双精度浮数转换为小数：\n\
  \n```csharp\ndouble value = 2.5;\ndecimal result = Convert.ToDecimal(value);\n```\n\
  \n`Convert` 类拥有所有原始类型以及更多方法，例如 `ToDateTime`、`ToInt` 和 `ToByte`。\n\n### 字符串转换\n\n\
  在 C# 中，每个类型都派自 `System.Object`，因此它们实现了一个名为 `ToString` 的方法，该方法将当前类型实例转换为字符串。以下代码演示了如何将\
  \ `DateTime` 转换为字符串：\n\n```csharp\nstring today = DateTime.Today.ToString();\n```\n\
  \n此外，你仍然可以使用直接转换将其他类型转换为字符串，如下：\n\n```csharp\nobject aString = \"Hello World\";\n\
  string result = (string)aString;\nstring result2 = aString as string;\n```\n\n关于\
  \ `ToString`，该方法灵活且强大，允许你使用特定的格式选项自定义输出字符串。你可以在 `https://docs.microsoft.com/en-us/dotnet/api/system.object.tostring`\
  \ 读取官方文档。\n\n### 逻辑运算符\n\n逻辑运算符是允许布尔值之间比较并返回布尔值的特殊运算符。有几种运算符和不同的场景，但最常见的是 `And`\
  \ 和 `Or` 运算符，分别由 `&&` 和 `||` 字面量表示。以下包含注释的代码演示了这一点：\n\n```csharp\nDateTime firstDate\
  \ = new DateTime(2021, 10, 25);\nDateTime secondDate = new DateTime(2021, 11, 30);\n\
  \nif(firstDate > DateTime.Today && firstDate < secondDate)\n{\n    // 如果 firstDate\
  \ 大于今天且小于 secondDate....\n}\n\nif (firstDate > DateTime.Today || firstDate < secondDate)\n\
  {\n    // 如果 firstDate 大于今天或者小于 secondDate....\n}\n```\n\n另一个有用的运算符是 `!`，用于取反。看这段代码：\n\
  \n```csharp\nif !(firstDate > DateTime.Today)\n{\n    // 如果 firstDate 不大于今天....\n\
  }\n```\n\n通过它，你可以从取反角度控制布尔比较。这些是你最最使用的运算符。逻辑运算符将在文档中讨论（https://docs.microsoft.com/en-us/dotnet/csharp/language-reference/operators/logical-operators）。\n\
  \n### 处理字符串\n\n字符串是 .NET 中的特殊类型。字符串是一种引用类型，但它实际上被当作值类型使用。基于此，你可以将字符串赋值给另一个字符串，如下：\n\
  \n```csharp\nstring hello = \"Hello World!\";\nstring target = hello;\n```\n\n字符串是不可变的，这意味着一旦创建无法更改。这意味着当你赋值或编辑字符串时，实际上是在创建一个新字符串。你可以使用\
  \ `==` 和 `!=` 运算符分别比较字符串的相等性或不等性，如下例所示：\n\n```csharp\nstring hello = \"Hello World!\"\
  ;\nstring hello2 = \"Hello World\";\nbool areStringEqual = hello == hello2; // false\n\
  bool areStringDifferent = hello != hello2; // true\n```\n\n`string` 类暴露了许多处理字符串的方法。相关的将在后续章节讨论。\n\
  \n### 检查空字符串\n\n在 C# 中，字符串可以为空或空。区别在于空字符串未初始化，而空字符串已初始化且长度为零。在实践中，你可能在使用字符串之前检查它是否为空或空。这是通过\
  \ `IsNullOrEmpty` 方法实现的，如下例所示：\n\n```csharp\nif(string.IsNullOrEmpty(stringToCheck))\n\
  {\n    // 字符串为空或空\n}\n```\n\n你还可以使用 `IsNullOrWhiteSpace` 方法来检查字符串是否为空或仅包含空格。\n\n\
  ### 字符串拼接\n\n拼接字符串是一项常见任务。C# 提供了多种拼接字符串的方法。第一种方法是使用加运算符，如下：\n\n```csharp\nstring\
  \ result = hello2 + hello;\n```\n\n第二种方法使用 `string.Concat` 方法，其中每个字符串用逗号隔开：\n\n\
  ```csharp\nstring result = string.Concat(hello2, hello);\n```\n\n\n\n\n\n第三种被称为\
  \ `string interpolation`（字符串插值），它允许快速将多个变量嵌入字符串中，如下例所示（注意字符串必须以 `$` 符号置前）：\n\n```\n\
  string result = $\"{hello2} {hello}\";\n```\n\n你基本上是将变量封装在括号中。值得一提的是，你并不限于包含 `string`\
  \ 类型的变量；你也可以包含其他原始类型。当你需要在运行时使用用户提供的值构建字符串（例如 URL）时，这特别有用。拼接字符串的第四种方法是使用 `System.Text.StringBuilder`\
  \ 类，如下：\n\n```// Requires a using System.Text directive\nstring first = “first\"\
  ;\nstring second = “second\";\nstring third = “third\";\nStringBuilder builder =\
  \ new StringBuilder();\nbuilder.Append(first);\nbuilder.AppendLine(second);\nbuilder.AppendLine(third);\n\
  string result = builder.ToString();\n```\n\n`StringBuilder` 类非常高效，但只有当你需要拼接或处理数百个字符串时才建议使用它。`Append`\
  \ 方法在不添加行终止符的情况下添加字符串，而 `AppendLine` 则会添加。\n\n### 字符串格式化\n\n通常，你需要以特定的格式发送输出字符串，例如货币、百分比或小数。`System.String.Format`\
  \ 方法允许你轻松地格式化文本。以下代码是经典方法的示例：\n\n```\n// Returns “The cost of fuel is $1.00\nConsole.WriteLine(string.Format(@\"\
  The cost of fuel is {0:C}dollars\", 1));\n// Returns “You are eligible for a 21.50%\
  \ discount”\nConsole.WriteLine(string.Format(“You are eligible for a {0:P} discount\"\
  , 21.5F));\n// Returns “Hex counterpart for 10 is A”\nConsole.WriteLine(string.Format(“Hex\
  \ counterpart for 10 is {0:X}\", 10));\n```\n\n`Format` 方法接受若干要格式化的值，然后将其嵌入主字符串中，这些值通过括号内的数字进行引用。例如，`{0}`\
  \ 是第二个参数，`{1}` 是第三个，以此此类推。符号指定格式；例如，`C` 代表货币，`P` 代表百分比，`X` 代表十六进制。C# 提供了[表 4.3]\
  \ 中列出的符号：\n\n| 操作符 | 说明 |\n| :--- | :--- |\n| c | 货币 |\n| d | 小数 |\n| e | 科学计数 |\n\
  | f | 浮点 |\n| g | 通用 |\n| n | 数字 |\n| p | 百分比 |\n| r | 十六进制 |\n\n表 4.3：字符串格式化选项\n\
  \n这些符号也被 `object.ToString` 方法接受，用于将任何类型的输出格式化为字符串。对此，你通常需要通过 `DateTime.ToString`\
  \ 方法格式化日期，但这将在书后的部分演示。\n\n### 对象迭代\n\n迭代允许多次执行相同的操作。在 C# 中，迭代可以通过 `for` 和 `foreach`\
  \ 语句执行。`for` 语句允许你有限次数地重复相同的操作（或一组操作）。以下代码显示了一个示例，其中相同的操作（写入控制台窗口）重复了 10 次：\n\n\
  ```\nfor (int counter = 1; counter < 11; counter++)\n{\n    Console.WriteLine(\"\
  Action repeated {0} times\", counter);\n}\n```\n\n在此类类语句中，你需要定义一个数值类型的变量（上一个例中的\
  \ `counter`）作为计数器。计数器不断增加，并重复操作，直到计数器小于指定值。因为计数器从 1 开始，重复 10 次操作需要它小于 `11`（即最多为\
  \ 10 次）。如果计数器从 0 开始，则计数器需要 `< 10`，但显然，你需要记住操作的索引（0, 1 等）与操作执行的次数（1, 2 等）是不匹配的。注意字符串中的\
  \ `{0}` 占位符如何用于显示预先未知并存储在变量中的值。当你需要对集合或数组中的所有项执行相同的操作时，可以使用 `foreach` 语句。你将在接下来的章节中学习更多关于集合的知识，但现在请考虑这个非常简单的示例，它遍历了存储在数组中的、你机器上运行的进程列表：\n\
  \n```\n// Requires a using System.Diagnostics directive\nProcess[] processList =\
  \ Process.GetProcesses();\nforeach(Process in processList)\n{\n    Console.WriteLine(\"\
  Process name {0}, process ID {1}\", process.ProcessName, process.Id);\n}\n```\n\n\
  [图 4.1] 显示了我的机器上运行的进程列表摘录：\n\n![](img/Figure-4.1.jpg)\n\n图 4.1：我的机器上运行的进程列表摘录\n\n\
  \n\n\n\n```csharp\n{\nConsole.WriteLine(\"The input string is valid\");\n}\n```\n\
  \n`if` 条件检查条件是否为真；如果是，则执行指定的操作。你也可以指定在条件为假时进行评估。你还可以使用 `else if` 语句来提供另一种评估方案。如果没有表达式满足条件，`else`\
  \ 语句将提供一个在那种情况下执行的操作。\n\n如果满足条件时执行的操作由单行代码组成（如上面的示例所示），则不需要括在括号内。\n\n# switch 条件分支代码块\n\
  \n`switch` 语句允许你针对一组值对表达式进行评估。通常，`switch` 用于在表达式被评估为真的情况下，检查该表达式是否匹配某个特定值。如果你考虑上一节中关于\
  \ `if` 块的代码示例，可以使用 `switch` 将重写如下：\n\n```csharp\nswitch(inputString.Length)\n{\n\
  \    case < 5:\n        Console.WriteLine(\"The input string is too short\");\n\
  \        break;\n    case > 10:\n        Console.WriteLine(\"The input string is\
  \ too long\");\n        break;\n    default:\n        Console.WriteLine(\"The input\
  \ string is valid\");\n        break;\n}\n```\n\n简而言之：\n\n*   `switch` 条件指定了必须被检查的对象。\n\
  *   每个 `case` 语句检查要评估的条件并允许执行操作。\n*   `default` 语句指定了当之前所有检查的条件都不满足时执行的操作。\n*  \
  \ `case` 和 `default` 块必须始终以 `break` 语句结束，除非你使用 `return` 指令从函数返回一个值。\n*   与通用 C#\
  \ 规则不同，`case` 和 `default` 语句内部的代码不需要括在括号内。\n\n请记住，C# 编译器经过优化会按顺序评估条件，这意味着第一个 `case`\
  \ 语句应该是最可能发生的那个，这也可以提高性能。\n\n### 介绍数组\n\n在软件编程中，数组是一组通过 `index`（索引）标识的元素集合。C# 中的数组是基于零的索引的，这意味着第一个元素的\
  \ `index = 0`，第二个元素的 `index = 1`，依此类推。C# 支持以下类型的数组：\n\n*   一维数组\n*   多维数组\n*   交错数组（锯齿数组）\n\
  \n让我们从一维数组开始。\n\n### 一维数组\n\n一维数组正如其名，只有一个维度，可以如下进行声明：\n\n```csharp\nint[] arrayName\
  \ = new int[10];\n```\n\n上述行代码声明了一个容量为 10 个元素的整数数组。类型名后跟着一对方括号。接下来的行代码演示了如何通过索引访问数组中的元素：\n\
  \n```csharp\nint result = arrayName[2];\n```\n\n因为它们是基于零的索引，`index = 2` 的元素实际上是数组中的第三个元素。显然，索引可以使用变量表示，如下方的\
  \ `for` 循环所示：\n\n```csharp\nfor (int i = 0; i < arrayName.Length; i++)\n{\n    int\
  \ result = arrayName[i];\n}\n```\n\n`Length` 属性返回数组中的元素个数。\n\n### 多维数组\n\n多维数组允许以行和列的形式组织项目。以下代码演示了如何创建一个三维数组，其中第一维度可以包含四个项目，第二维度可以包含三个项目，第三维度可以包含两个项目：\n\
  \n```csharp\nint[,,] array1 = new int[4, 2, 3];\n```\n\n如你所见，一个维度由逗号（`,`）表示。第一个维度是隐式的，所以只从第二个维度开始添加逗号。你仍然通过索引访问元素，这基本上指定了元素在数组中的位置，如下行代码所示：\n\
  \n```csharp\nint element = array1[2, 1, 1];\n```\n\n### 交错数组\n\n交错数组是数组中的每个元素都是另一个数组的数组，因此也被称为数组数组。以下代码声明了一个交错数组：\n\
  \n```csharp\nint[][] jaggedArray = new int[3][];\n```\n\n如你所见，类型后跟着两对方括号。在这个特定的声明中，数组有三个元素，每个元素都是一个维数组。在使用元素之前，必须对它们进行初始化，如下例所示：\n\
  \n```csharp\njaggedArray[0] = new int[5];\njaggedArray[1] = new int[4];\njaggedArray[2]\
  \ = new int[2];\n```\n\n作为开发者，你需要了解数组以及它们是如何工作的。然而，你只会在特定场景下（例如复杂的数学计算）使用多维数组和交错数组。至少在本书中，它们不会被使用。\n\
  \n### 面向对象编程 (OOP)\n\n在日常生活中，你使用对象执行各种活动。你使用玻璃杯喝水，开车去上班，使用手机与他人联系。这些每个对象都有自己的特征。例如，有数百种手机型号；它们有不同的颜色、不同的操作系统和不同的运营商，但它们都是手机。OOP\
  \ 类似于这种生活观。事实上，OOP 依赖于对象；例如，你可以拥有一个允许处理文件的对象或另一个允许管理图片的对象。在 .NET 中，对象的开发通常由类（class）表示。结构（struct）也是对象，但它们的目的是表示值而非执行操作。对象拥有一些执行操作的成员，称为方法（methods）。在本章中，你将学习\
  \ .NET 类是如何结构化的。\n\n### 理解访问修饰符\n\n访问修饰符设置了对象及其在项目内部外部的可见性。它们由保留字表示，如表 4.4 所示：\n\
  \n| 修饰符 | 描述 |\n| :--- | :--- |\n| `public` | 由相同程序集或引用它的程序集中的任何代码访问。类型的公共成员的访问级别由该类型本身的访问级别控制。\
  \ |\n| `private` | 仅由相同类或结构中的代码访问。 |\n| `internal` | 由相同程序集中的任何代码访问，但不能从另一个程序集访问。\
  \ |\n| `protected` | 仅由相同类或派自该类的类中的代码访问。 |\n| `private protected` | 仅由其声明程序集内的相同类或派自该类的类型代码访问。\
  \ |\n| `protected internal` | 由其声明程序集中的任何代码访问，或由另一个程序集中的派生类访问。 |\n\n**表 4.4:** C#\
  \ 中的访问修饰符\n\n如果没有指定修饰符，则默认为 `internal`。同样值得注意的是，修饰符的可用性取决于对象或成员。这将在适当的时候说明。\n\n\
  ### 使用类定义引用类型\n\n在 .NET 中，类是你用于定义自定义对象的类型，它们是引用类型。类通过类块定义，如下：\n\n```csharp\nclass\
  \ Person\n{\n}\n```\n\n请记住，如果没有指定修饰符，C# 默认分配 `internal`。如果你的类应该被其他项目消费（例如当你创建一个可重用库时），它们必须标记为\
  \ `public`，如下：\n\n```csharp\npublic class Person\n```\n\n\n\n\n类可以定义成员，例如字段、属性和方法（本章将涵盖所有内容），以及其他类和结构。下一节将介绍在类内部可以定义的成员，以便你对创建自定义类有一个完整的了解。\n\
  \n### 使用字段和属性存储信息\n\n字段（Fields）是用于存储信息和从中读取信息的地方。它们以类级变量的形式声明，与局部变量的区别在于，它们是在方法或属性级别上声明的。以下代码展示了声明字段是多么简单：\n\
  \n```c\nclass Person\n{\n    DateTime BirthDate;\n}\n```\n\n字段可以从类内部及其成员中访问，如果你指定了其中一个合适的修饰符（例如\
  \ `public`），也可以从外部世界访问。在字段内部，你存储了自定义对象所需的实际信息。你也可以对字段进行内联初始化，如下所示行所示：\n\n```c\n\
  DateTime BirthDate = DateTime.Now;\n```\n\n它们也可以在类的构造函数中进行初始化，并且可以是只读的。在这种情况下，你使用\
  \ `readonly` 关键字，如下所示：\n\n```cc\nreadonly DateTime BirthDate = DateTime.Now;\n```\n\
  \n只读字段不能被修改，因此它需要在内联时（如上行所示）或在类的构造函数中初始化。由于字段包含了应用程序处理的实际数据，它们并不是提供信息（尤其是向外部世界）的最佳方式。出于此目的，你应当属性（Properties）。属性是调用者访问存储在字段中数据的公共方式。通过属性，你可以决定用户读取和写入实际信息的权限类型。属性通常用作字段，但它们的作用类似于方法。你编写属性的方式可以是简单的或扩展的。你需要了解这两种方法，因为在\
  \ Xamarin.Forms 中，你经常会使用扩展方式。让我们从这里开始。你这样编写属性：\n\n```csharp\nprivate DateTime _birthDate;\n\
  public DateTime BirthDate\n{\n    get\n    {\n        return _birthDate;\n    }\n\
  \    set\n    {\n        _birthDate = value;\n    }\n}\n```\n\n简而言之，属性的 `get` 方法返回字段的值，而\
  \ `set` 方法通过保留字 `value` 为后备字段分配一个值。通过属性访问信息是非常重要的，因为你可以在 `set` 方法中对值进行验证或逻辑处理。正如你在接下来的章节中看到的，你经常会在此地调用属性更改通知。当你不需要对输入的值执行任何操作时，可以使用简化的语法，如下所示：\n\
  \n```csharp\npublic DateTime BirthDate { get; set; }\n```\n\n这被称为自动实现属性（auto-implemented\
  \ properties）。当使用这种语法时，你甚至不需要声明后备字段，因为 C# 编译器会为你隐含创建一个并自动处理 `get` 和 `set`。属性可以是任何\
  \ .NET 类型，包括你自己的类型。你可以像使用任何其他变量一样使用属性，但这假设是一个类的实例。例如，你可以为赋值属性：\n\n```csharp\nPerson\
  \ newPerson = new Person();\nnewPerson.BirthDate = new DateTime(1977, 05, 10);\n\
  ```\n\n然后，你可以这样检索属性值：\n\n```csharp\nDateTime dateOfBirth = newPerson.BirthDate;\n\
  ```\n\n或者，作为另一个示例，直接访问该值：\n\n```csharp\nConsole.WriteLine(newPerson.BirthDate);\n\
  ```\n\n**作为一般规则，你使用点 (`.`) 来访问任何类型的任何成员。**\n\n### 使用方法执行操作\n\n方法（Method）是执行操作的成员。方法可能返回值，也可能不返回。以下是方法的最小示例：\n\
  \n```csharp\npublic void DoSomething()\n{\n    if (System.IO.File.Exists(@\"C:\\\
  SomeFile.txt\") == false)\n        throw new System.IO.FileNotFoundException();\n\
  \    else\n        Console.WriteLine(\"The file exists\");\n}\n\npublic bool DoSomethingElse()\n\
  {\n    bool result = System.IO.File.Exists(@\"C:\\SomeFile.txt\");\n    return result;\n\
  }\n```\n\n`void` 关键字标记不返回值的方法。对于返回值的方法，方法名之前必须跟上 `return` 类型。要调用方法，只需调用它的名称。继续前面的示例，你可以通过输入以下行来调用\
  \ `DoSomething` 方法：\n\n```csharp\nDoSomething();\n```\n\n如果方法返回值，你应该将调用结果赋值给变量，如下：\n\
  \n```csharp\nbool returnValue = DoSomethingElse();\n```\n\n如果你需要评估方法返回的值，这一点是非常重要的。如果你不需要评估结果，可以在不赋值结果的情况下调用方法：\n\
  \n```csharp\nDoSomethingElse();\n```\n\n你可以在任何需要值的地方调用函数。继续前面的示例，以下代码是允许的：\n\n```csharp\n\
  Console.WriteLine(DoSomethingElse());\n```\n\n类暴露的方法需要通过点符号来调用。如果 `DoSomething`\
  \ 定义在 `Person` 类中，你将如下所示调用它：\n\n```csharp\nnewPerson.DoSomething();\n```\n\n方法可以接收参数。在\
  \ .NET 术语中，参数（Parameters）是方法接受的对象，是在你声明方法时编写的。参数（Arguments）是你调用方法时传递给方法的表达式。以下代码展示了一个接收参数的简单示例以及随后对该方法的调用；方法声明定义了一个名为\
  \ `stringToDisplay` 的参数，然后方法体将一个参数传递给 `Console.WriteLine`：\n\n```csharp\npublic\
  \ void DisplayString(string stringToDisplay)\n{\n    Console.WriteLine(stringToDisplay);\n\
  }\n\npublic void SendString()\n{\n    DisplayString(\"Xamarin for JobSeekers\");\n\
  }\n```\n\n参数可以按值传递（默认值），也可以按引用传递。参数可以按引用传递，在参数类型之前添加 `ref` 关键字（例如 `ref int`）。以下是按值传递和按引用传递参数的区别：\n\
  \n- 如果你按值传递值类型，编译器会创建原始值的副本，因此对参数所做的更改不会反映在原始数据上。如果你按引用传递值类型，对参数所引用的对象的更改将反映在原始数据上，因为在这种情况下，参数是数据的内存地址。\n\
  - 如果你按引用传递引用类型，编译器将传递内存地址。如果你按值传递引用类型，编译器将传递内存指针的副本。在这两种情况下，无论参数如何传递，原始对象都会被修改。区别在于，当你按引用传递引用类型变量时，被调用的方法可以通过将其替换为指向不同对象的内存指针来更改该变量引用的对象。\n\
  \n你将在书后面看到一些按引用传递参数的示例。实际上，.NET 中的方法更加强大，因为它们提供了一种名为重载（overloading）的选项。这意味着提供同一个方法的多个签名，签名是指方法可以接收的参数的数量和类型。以下代码片段演示了重载：\n\
  \n```csharp\npublic string FullName(string lastName, string firstName)\n{\n    return\
  \ string.Concat(lastName, \" \", firstName);\n}\n\npublic string FullName(string\
  \ lastName, string firstName, int age)\n{\n    return string.Concat(lastName, \"\
  \ \", firstName, \" of age: \", age);\n}\n\npublic string FullName(string lastName,\
  \ string firstName, DateTime dateOfBirth)\n{\n    return string.Concat(lastName,\
  \ \" \", firstName, \" born on: \", dateOfBirth);\n}\n```\n\n\n\n如你所见，名为 `FullName`\
  \ 的方法有四种不同的实现。每种实现与其他不同在于它们接收的参数数量不同。之前的示例非常简单：每个实现都返回提供的参数的拼接结果。\n\n### 介绍构造函数和静态类\n\
  \n当你声明一个类时，你正在定义一个引用类型。通常，引用类型不能直接使用，而是需要先实例化。实例化一个类型允许使用该类型的一个对象。你使用构造函数来创建类型的实例。构造函数是一个与类同名的方法，它可以可选地接收参数。每个类都隐式地定义了一个无参数构造函数，即使你没有声明它。以下代码展示了默认无参数构造函数的示例：\n\
  \n```csharp\npublic class Person\n{\n    public Person()\n    {\n    }\n}\n```\n\
  \n当你使用 `new` 关键字声明一个给定类型的变量时，你实际上是在调用它的构造函数，如下如下行所示：\n\n```csharp\nPerson onePerson\
  \ = new Person();\n```\n\n构造函数也是初始化对象属性和字段的地方。如果你考虑带有 `BirthDate` 属性的 `Person` 类示例，你可以在构造函数中初始化它，如下所示：\n\
  \n```csharp\nclass Person\n{\n    public DateTime BirthDate { get; set; }\n    public\
  \ Person()\n    {\n        BirthDate = new DateTime(1977, 05, 10);\n    }\n}\n```\n\
  \n构造函数可以接收参数，以便你可以使用运行时确定的值初始化类的成员。以下代码片段展示了一个示例：\n\n```csharp\nclass Person\n{\n\
  \    public DateTime BirthDate { get; set; }\n    public Person(DateTime birthDate)\n\
  \    {\n        BirthDate = birthDate;\n    }\n}\n```\n\n**如果你实现了一个接收参数的构造函数，编译器将不再提供隐式构造函数，因此如果你希望仍然能够在没有默认值的情况下创建对象实例，则需要手动提供一个。**\n\
  \n由于构造函数是方法，它们也支持重载。因此，你可以编写多个构造函数，如下所示：\n\n```csharp\npublic Person(DateTime birthDate)\n\
  {\n    BirthDate = birthDate;\n}\npublic Person()\n{\n    BirthDate = new DateTime(1977,\
  \ 05, 10);\n}\n```\n\n通过构造函数，你可以拥有同一个对象的多个实例，例如，如果你需要表示多个人、多本书、多个订单、多个客户等。在某些情况下，你不需要一个对象的多个实例，单个实例就足够了。在这种情况下，你可以定义一个\
  \ `static` 类。以下代码展示了一个示例：\n\n```csharp\npublic static class HelperMethods\n{\n \
  \   public static double CalculatePercentage(double inputValue, double percentage)\n\
  \    {\n        return inputValue / 100 * percentage;\n    }\n}\n```\n\n静态类通常定义用于实现通用成员。它们不需要构造函数，因为只能有一个实例。因此，调用静态类成员的方法需要你编写类的名，后面跟着一个点\
  \ `.` 和成员名，如下例所示：\n\n```csharp\ndouble result = HelperMethods.CalculatePercentage(250,\
  \ 20);\n```\n\n你也可以在非静态类内部定义静态成员。这对于定义与对象特定实例关联的成员非常有用。\n\n### 使用继承定义派生类型\n\n继承是面向对象编程中的一项重要特性。一个类可以继承或派生自另一个类，这意味着新类可以拥有第一个类（称为基类）公开的所有属性、方法和成员。新类随后可以定义自己的成员。继承的成员可以被重写，以使其行为适应新类的上下文。.NET\
  \ 允许单级继承，这意味着一个类一次只能继承另一个类。每个类都隐式地派生自 `System.Object`，并使用 `:` 符号继承类。以下代码提供了一个名为\
  \ `Person` 的基类和名为 `Customer` 的派生类的示例：\n\n```csharp\npublic class Person\n{\n   \
  \ public string FirstName { get; set; }\n    public string LastName { get; set;\
  \ }\n}\npublic class Customer: Person\n{\n    public string CompanyName { get; set;\
  \ }\n}\n```\n\n在这个示例中，`Customer` 类暴露了一个新的 `CompanyName` 属性，并且通过继承暴露了 `FirstName`\
  \ 和 `LastName` 属性。继承具有巨大的力量，你现在通过对接口和抽象类的介绍将理解这种力量。\n\n### 理解接口和抽象类\n\n接口和抽象类是 OOP\
  \ 的另外两个重要支柱，你经常会在 Xamarin 中使用它们（特别是接口）。本节将描述这二者，并总结关键要点。\n\n### 定义接口\n\n接口提供了一个成员列表，对象必须实现这些成员以标准化的方式完成特定任务。它们也被称为契约，因为它们规定了对象必须如何行为以实现某些目标。例如，.NET\
  \ 知道在处理数据绑定时，实现 `IValueConverter` 接口的对象将用于类型之间的转换。\n\n```csharp\npublic interface\
  \ IPerson\n{\n    string LastName { get; set; }\n    string FirstName { get; set;\
  \ }\n    DateTime DateOfBirth { get; set; }\n    string FullName();\n}\n```\n\n\
  按照约定，接口标识符以大写 `I` 开。虽然不是强制，但强烈建议这样做。接口定义只包含成员定义，没有主体。对于 `FullName` 方法定义，只有签名而没有方法体和实现，这些留给了实现接口的类。接口内部定义的成员不能标记访问修饰符，它们默认是\
  \ public。\n\n### 实现接口\n\n实现意味着告诉类需要暴露接口中定义的所有成员。你通过使用 `:` 符号后跟接口名称来实现。IntelliSense\
  \ 将提供可用接口列表，当你选择 `IPerson` 时，代码编辑器将用红色波浪线标记它，因为仍然缺少实现。然而，你可以快速提供一个基础，如下所示：\n\n*\
  \   悬停在 `IPerson` 上。\n*   点击灯泡图标。\n*   点击 `Implement Interface` 选项。\n\n*[图 4.2]*\
  \ 展示了如何完成此操作：\n\n![](img/Figure-4.2.jpg)\n\n**图 4.2:** 快速实现接口\n\n你不仅可以看到预览，Visual\
  \ Studio 还会为你提供基础实现，但需要重写。以下代码片段展示了如何在 `Person` 类中实现 `IPerson` 接口：\n\n```csharp\n\
  public class Person : IPerson\n{\n    public string LastName { get; set; }\n   \
  \ public string FirstName { get; set; }\n    public DateTime DateOfBirth { get;\
  \ set; }\n    public string FullName()\n    {\n        return $\"{LastName} {FirstName}\"\
  ;\n    }\n}\n```\n\n\n\n\n除了作为合约（contracts）使用外，接口对于一种名为多态的编程模式也非常重要。因为多个类可以实现 `IPerson`\
  \ 接口，你可以声明以下变量，它可以接收任何实现 `IPerson` 的对象，并操作所有实例中共有的成员：\n\n```cs\nIPerson person =\
  \ newPerson;\n```\n\n```cs\nConsole.WriteLine(person.FullName());\n```\n\n`newPerson`\
  \ 对象可以是 `Person` 类型或任何其他实现 `IPerson` 的类型，并且通过多态，无论原始类型如何，你都可以操作共有的成员。\n\n### 介绍抽象类\n\
  \n抽象类允许为派生对象创建基础实现，但不能被直接使用。考虑以下 `Person` 类：\n\n```cs\npublic abstract class Person\n\
  {\n    public string LastName { get; set; }\n    public string FirstName { get;\
  \ set; }\n    public virtual string FullName()\n    {\n        return $\"{LastName}\
  \ {FirstName}\";\n    }\n}\n```\n\n它提供了一个基础，该基础可以适用于任何以更专门方式表示人的类，例如客户、联系人和朋友。它被标记为抽象的，因此你不能创建该类的实例，它必须被继承。此外，请注意\
  \ `FullName` 虽然提供了一个基础实现，但它被标记为 `virtual`，这提供了重新定义其行为的选择。以下是一个派自 `Person` 的 `Customer`\
  \ 类示例，它重写了 `FullName` 方法：\n\n```cs\npublic class Customer: Person\n{\n    public\
  \ int CustomerID { get; set; }\n    public override string FullName()\n    {\n \
  \       return $\"Customer ID: {CustomerID}, Last name: {LastName}\";\n    }\n}\n\
  ```\n\n你没有义务重写 `virtual` 方法，你可以利用原始实现。在这种情况下，你使用 `base` 关键字，后跟成员的名称。\n\n**总而言之，接口规定了对象必须实现哪些成员以满足合约；而抽象类规定了派生对象必须实现哪些成员，并提供了提供基础实现的选项，且不需要满足任何合约。**\n\
  \n抽象类的反面是密封类（sealed classes）。被标记为 `sealed` 关键字的类不能被继承。如果你构建了出售给第三方的库，并且你不希望别人从你的类开始创建新对象，那么这将非常有用。\n\
  \n### 在命名空间内组织类型\n\n命名空间可以被视为类型的容器。命名空间定义在 `namespace { }` 块中。每个命名空间都可以暴露以下类型和成员：\n\
  \n* 类\n* 结构体\n* 接口\n* 枚举\n* 委托\n* 嵌套命名空间\n\n下面的列表提供了一个命名空间定义上述某些类型的示例：\n\n```cs\n\
  namespace People\n{\n    public interface IContactable\n    {\n        bool HasEmailAddress\
  \ { get; }\n    }\n    public abstract class Person\n    {\n        public string\
  \ FirstName { get; set; }\n        public string LastName { get; set; }\n      \
  \  public override string ToString()\n        {\n            return FirstName +\
  \ \" \" + LastName;\n        }\n    }\n    public enum PersonType\n    {\n     \
  \   Work = 0,\n        Personal = 1\n    }\n    public class Contact: Person, IContactable\n\
  \    {\n        public string EmailAddress { get; set; }\n        public override\
  \ string ToString()\n        {\n            return base.ToString();\n        }\n\
  \        public bool HasEmailAddress\n        {\n            get\n            {\n\
  \                if (string.IsNullOrEmpty(this.EmailAddress))\n                \
  \    return false;\n                else\n                    return true;\n   \
  \         }\n        }\n    }\n    public struct PersonInformation\n    {\n    \
  \    public PersonType PersonCategory { get; set; }\n        public bool HasEmailAddress\
  \ { get; set; }\n    }\n}\n```\n\n命名空间的目的是为了更好地组织类型。在某些情况下，对象的层次结构可能会暴露两个具有不同行为但名称相同的不同类型。例如，假设你有两个\
  \ `Person` 类；第一个应该代表业务联系人，第二个应该代表你的朋友。当然，你不能在一个命名空间内创建两个同名的类。正因如此，你可以将此类类型组织在不同的命名空间中从而避免冲突。\n\
  \n**按照约定，命名空间的名称应具有以下格式：`CompanyName.ProductName.NamespaceName`。这不是强制性的，完全取决于你是否遵循这一约定。如果你使用第三方库，命名空间是以这种方式定义的。**\n\
  \n### 使用 using 指令访问命名空间内的类型\n\n你经常需要调用定义在长名称命名空间中的类型。要调用类型，你需要编写类型的全名，这包含了定义特定类型的命名空间标识符，如下代码所示：\n\
  \n```cs\nSystem.IO.FileStream textFile = new System.IO.FileStream(@\"C:\\test.txt\"\
  , System.IO.FileMode.Open);\n```\n\n通过输入包括命名空间在内的全名来访问对象在 .NET 中被称为完全限定名（fully qualified\
  \ name）。为了更快地编写更简单更整洁的代码，你可以添加 using 指令来缩短访问类型的方式。例如，在代码文件的顶部，你可以添加以下指令：\n\n```cs\n\
  using System.IO;\n```\n\n这让编译器知道它需要查找定义在 `System.IO 命名空间` 中的类型。然后，你可以如下重重写之前的代码段：\n\
  \n```cs\nFileStream textFile = new FileStream(@\"C:\\test.txt\", FileMode.Open);\n\
  ```\n\n如果你从两个不同的命名空间访问两个同名的对象，你仍然需要使用完全限定名。\n\n# 使用结构体定义值类型\n\n结构体允许创建自定义值类型。你会发现类和结构体之间有很多相似之处，尽管本节将解释一些重要的区别。你使用结构体\
  \ `{ }` 块创建结构体。下面的代码提供了一个表示创建时间戳的坐标示例：\n\n```cs\npublic struct ExtendedCoordinate\n\
  {\n    public double X { get; set; }\n    public double Y { get; set; }\n    public\
  \ DateTime TimeStamp { get; set; }\n    public ExtendedCoordinate(double x, double\
  \ y)\n    {\n        X = x;\n        Y = y;\n        TimeStamp = DateTime.Now;\n\
  \    }\n}\n```\n\n结构体可以暴露多个成员，例如字段、属性、方法甚至事件，就像类一样。然而，当你需要创建数据的副本类型时，应该使用结构体，如下所示。\n\
  \n**结构体不支持继承。它们只继承自 `System.ValueType`，不允许进一步继承。**\n\n# 将结构体赋值给变量\n\n结构体是值类型，因此将结构体实例赋值给声明为该类型的变量会创建数据的副本。下面的代码演示了：\n\
  \n```cs\nExtendedCoordinate coordinate = new ExtendedCoordinate(45.2, 37.1);\n```\n\
  \n这是结构体和类之间最大最重要的区别之一。显然，结构体也可以作为方法参数传递。\n\n# 结构体及其成员的可见性\n\n结构体及其成员拥有与类相同的访问修符。结构体只接受\
  \ `private`、`public` 和 `internal` 修饰符。如果没有指定修饰符，默认提供 `internal`。结构体的成员可以使用 [表 4.2]\
  \ 中描述的修饰符进行限定。\n\n### 定义枚举\n\n枚举是 .NET 中提供的另一种值类型。它们表示一组封装在 `enum { }` 代码块中的常量。枚举继承自\
  \ `System.Enum`，而 `Enum` 继承自 `System.ValueType`。以下是枚举的示例：\n\n```cs\npublic enum\
  \ Food\n{\n    Bread,   // 0\n    Tomato,  // 1\n    Potato,  // 2\n    Chicken,\
  \ // 3\n    Fish     // 4\n}\n```\n\n\n\n\n\n默认情况下，枚举是整数值的集合。前面的代码定义了一个类型为 `int`\
  \ 的 `Food` 枚举，它存储了一组整数常量。C# 编译器也可以自动为枚举中的每个成员分配一个整数值（从零开始），如注释所示。你可以手动分配自定义值，但应尽量避免这样做，因为标准行为可以确保其他类型可以无错误地使用你的枚举。\n\
  \n### 使用枚举\n\n你可以像使用任何其他 .NET 类型一样使用枚举。例如，考虑以下方法，它接收一个 `Food` 枚举作为参数，并根据传递的值显示相应的响应：\n\
  \n```csharp\nprivate void CheckFood(Food foodList)\n{\n    switch (foodList)\n \
  \   {\n        case Food.Bread:\n        {\n            Console.WriteLine(\"You\
  \ chose Bread\");\n            break;\n        }\n        case Food.Chicken:\n \
  \       {\n            Console.WriteLine(\"You chose Chicken\");\n            break;\n\
  \        }\n        default:\n        {\n            Console.WriteLine(\"All food\
  \ is good\");\n            break;\n        }\n    }\n}\n```\n\n接下来的代码段声明了一个类型为 `Food`\
  \ 的变量，为其赋值，并通过传递该变量来调用该方法：\n\n```csharp\nvar myFood = Food.Bread;\nCheckFood(myFood);\n\
  ```\n\n注意当你需要指定类型为枚举的值时，IntelliSense 是如何介入的。\n\n### 实现错误处理\n\n如你所知，.NET 语言的特征之一是互操作性，这意味着一种语言必须理解并使用用另一种语言编写。这就是为什么需要一种通用的错误的方法。在\
  \ .NET 中，错误被识别为异常（exceptions）。异常是 `System.Exception` 类的实例（或派生自它的专门类的实例），并提供了有关所发生错误的深层信息。你通过编写\
  \ `try..catch..finally` 代码块来执行异常处理。该代码块背后的流逻辑遵循以下序列：\n\n*   尝试执行代码。\n*   如果遇到异常，执行指定的操作。\n\
  *   无论代码执行成功还是由于异常失败，都执行最后的代码。\n\n下面的示例演示了当某些代码尝试打开文件并发生错误时，如何控制异常流：\n\n```csharp\n\
  // Requires a using System.IO; directive\nConsole.WriteLine(\"Specify a file name:\"\
  );\nstring fileName = Console.ReadLine();\nFileStream myFile = null;\ntry\n{\n \
  \   myFile = new FileStream(fileName, FileMode.Open);\n    // Seek a specific position\
  \ in the file.\n    // Just for example\n    myFile.Seek(5, SeekOrigin.Begin);\n\
  }\ncatch (FileNotFoundException ex)\n{\n    Console.WriteLine($\"File {ex.FileName}\
  \ not found.\");\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"An unidentified\
  \ error occurred: {ex.Message}\");\n}\nfinally\n{\n    myFile?.Close();\n}\n```\n\
  \n当你使用 `catch` 拦截异常时，可以传递一个存储异常对象实例的变量，以获取大量有用信息。对于前面的代码，它尝试打开文件并在其中搜索特定位置。如果未找到文件，`FileStream.Seek`\
  \ 方法将抛出 `FileNotFoundException`。除其他外，它还暴露了一个 `FileName` 属性，其中包含未找到的文件名。通常，所有的异常类都暴露一个名为\
  \ `Message` 的属性（其中包含错误消息）以及一个 `StackTrace` 属性（这有助于开发者理解代码的哪个部分导致了错误）。基类库（BCL）以及所有第三方库通常包含大量的专门异常，捕获在特定场景下可能发生的所有异常是最佳实践。在上面的代码段中，针对未找到的文件捕获了专门异常，但由于可能会发生其他不可预测的错误，也捕获了通用异常。`finally`\
  \ 块是完全可选的，但在某些情况下它非常重要。事实上，它允许无论 `try` 块成功还是失败都执行代码。如果你有打开的文件（如前面的示例所示）或打开的数据库连接，这里就是你可以关闭所有现有引用的地方。\n\
  \n### 实现事件\n\n事件（Events）是通知其他对象发生了某些事的一种。事件使用 `event` 关键字声明。当你定义一个事件时，你还需要一个类，该类包含事件想要与调用者共享的信息。.NET\
  \ 定义了一个名为 `EventArgs` 的基类，你可以继承它来实现你自己的类。假设你想通知调用者读取文本文件已完成。你可以如下实现一个事件和一个事件参数类：\n\
  \n```csharp\nclass EventsDemo\n{\n    public event EventHandler<OperationCompletedEventArgs>\
  \ FileCompleted;\n}\n\nclass OperationCompletedEventArgs: EventArgs\n{\n    public\
  \ string FileName { get; set; }\n    public OperationCompletedEventArgs(string fileName)\n\
  \    {\n        FileName = fileName;\n    }\n}\n```\n\n以下是关键点：\n\n*   `EventHandler`\
  \ 是一个委托（delegate），是一种特殊的 .NET 类型，可以被视为函数指针。\n*   `OperationCompletedEventArgs` 暴露了你想与事件订阅者共享的信息，在本例中是文件名，必须通过构造函数提供。\n\
  \n通过如下调用其 `Invoke` 方法触发事件：\n\n```csharp\npublic void OpenFile(string fileName)\n\
  {\n    string result = System.IO.File.ReadAllText(fileName);\n    var eventArgs\
  \ = new OperationCompletedEventArgs(fileName);\n    FileCompleted?.Invoke(this,\
  \ eventArgs);\n}\n```\n\n\n\n\n\n本节描述了你作为 Xamarin 开发人员在日常工作中经常使用的高级概念和技术。正如你想象的那样，与其他主题一样，其内容远比本章总结的要多，因此如果你没有足够的经验或者觉得需要进一步的解释，始终建议阅读一本关于\
  \ C# 编程的专。\n\n# 泛型与可空类型 (Generics and Nullable Types)\n\n在编写 Xamarin 代码时，你经常会使用泛型和可空类型。泛型是\
  \ .NET 类型，它们可以根据单一实现调整其行为以适应不同类型的对象。它们只能持有指定的类型，并避免在处理不同类型对象时发生意外。.NET 中定义了数十种泛型类型，你也可以创建自己的泛型（本书未涵盖），但对你来说最常见的情况是使用泛型集合。例如，NET\
  \ 定义了 `System.Collections.Generics.List<t>` 类，该对象可以包含仅一种类型对象的列表。`<t>` 字面量表示泛型实现，并称为类型参数。你在\
  \ Xamarin.Forms 中非常频繁使用的另一个集合是 `System.Collections.ObjectModel.ObservableCollection<t>`，它继承自\
  \ `List<t>`，并能够通知用户界面其包含的元素的变化。以下代码段演示了如何创建一个整数列表，这种技术对于每个类型（包括自定义类）都是相同的：\n\n```\n\
  var integerList = new List<int>();\nintegerList.Add(1);\nintegerList.Add(2);\nConsole.WriteLine(integerList[1]);\
  \ // writes 2\nintegerList.Remove(1); // removes 1\n```\n\n你首先需要泛型类型的实例，然后可以调用 `Add`\
  \ 方法添加指定类型的新对象。你可以使用索引（从零开始）访问列表中的单个元素。你还可以通过 `Remove` 方法删除成员，该方法删除指定的值或实例（而不是索引）。使用泛型创建列表的另一种方法是使用称为集合初始化器的特性，当你需要的值或实例由变量表示时非常有用，如下代码所示：\n\
  \n```cs\nint first = 0;\nint second = 1;\nvar integerList = new List<int> { first,\
  \ second };\n```\n\n使用这种语法，列表被创建并用括号内的系列值填充。当你实现自己的泛型时，还可以提供一些约束。例如，你可能希望决定泛型只能与实现特定接口的引用类型一起工作。泛型是一个复杂得多的的话，因此我建议你阅读官方文档\
  \ `https://docs.microsoft.com/en-us/dotnet/csharp/fundamentals/types/generics`。\n\
  \n# 处理可空类型 (Working with Nullable types)\n\n所有 .NET 类型都有默认值。对于引用类型，默认值为 `null`。值类型具有取决于类型本身的默认值；例如，`int`\
  \ 为 0 或 `bool` 为 `false`。值类型不能为 null。然而，在某些情况下，让值类型也支持 null 是重要的。这发生在映射数据库列到 .NET\
  \ 对象或具有三状态对象（例如真、假、null）的情况下。在 C# 中，这可以通过可空类型实现，可空类型是泛型。你有两种声明可空类型的方法：\n\n```cs\n\
  Nullable<int> oneInteger = 0;\nint? oneInteger = 0;\n```\n\n`Nullable<t>` 泛类型为任何值类型增加了对\
  \ null 值的支持，你也可以使用简化语法，在声明的值类型后添加问号。以下代码展示了如何使用可空类型的示例：\n\n```cs\nif (oneInteger.HasValue)\n\
  Console.WriteLine(oneInteger.Value);\n```\n\n虽然你可以直接为可空类型赋值，但你必须先检查对象是否为 null。这可以通过评估\
  \ `HasValue` 属性来实现，如果对象不为 null，则返回 true。此时，你可以通过 `Value` 属性访问实际值。尝试访问为 null 的可空类型将导致\
  \ `NullReferenceException`。\n\n# 语言集成查询 (LINQ)\n\n**语言集成查询** (**LINQ**) 是一项允许使用回想起\
  \ SQL 语言的语法查询对象集合的特性。这是 C# 中最复杂且强大的功能之一，因此在这里仅进行介绍，并重点关注在后续章节中会有用的用方法。假设你有一个名为 `people`\
  \ 的 `List<Person>`，你想检索出生年份小于 2000 年的人子集。使用 LINQ，你可以按照如下方式编写代码：\n\n```cs\nvar query\
  \ = from person in people\nwhere person.DateOfBirth.Year < 2000\nselect person;\n\
  ```\n\n`from` 子句允许引用集合中的每一个实例，`where` 提供了通过条件为查询添加过滤器的选项，而 `select` 允许将每个符合条件的实例添加到新的数据集中。查询结果是一个\
  \ `IEnumerable<t>` 对象（如果你正在使用如 `Entity` Framework 这样的数据框架，则它会变为 `IQueryable<t>`）。通常，LINQ\
  \ 可以用于任何实现 `IEnumerable<t>` 接口的对象。显然，还有许多可能的选项和子句，但这些是你需要的基础语法。事实上，你可以对结果进行分组、执行数学聚合等。你还可以从查询中检索单个元素。例如，你可以检索序列中的第一个或最后一个元素。以下示例显示了如何检索集合的第一个元素：\n\
  \n```cs\nvar query = (from person in people\nwhere person.DateOfBirth.Year < 2000\n\
  select person).First();\n```\n\n`First` 是一个扩展方法，返回调用它的类型实例；现在 `query` 将是 `Person`\
  \ 类型。.NET 中充斥着扩展方法，你也可以创建自定义的扩展方法。正如名称所示，扩展方法为现有对象扩展新功能，而不需要拥有对象的源代码。实际上，扩展方法可以使用许多种不同的场景，但最常用的可能是\
  \ Lambda 表达式。Lambda 表达式可以被视为匿名方法，允许在一行代码内执行查询并评估复杂的表达式。例如，使用 Lambda 表达式你可以重写之前的\
  \ LINQ 查询：\n\n```cs\nvar query = people.Where(person => person.BirthDate.Year <\
  \ 2000).First();\n```\n\n`=>` 运算符表示 Lambda 表达式的语法，并提供了一种声明序列中每个元素的引用变量的方法。注意 `Where`\
  \ 也是一个用于过滤结果的扩展方法。你可以使用 `&&` 和 `||` 运算符组合多个条件。如果没有找到符合条件的元素，First 方法将抛出异常。如果你想避免异常，可以使用\
  \ `FirstOrDefault`，它会返回当前类型的默认值（在这种情况下为 `null`）。同样，LINQ 提供了 `Last` 和 `LastOrDefault`\
  \ 方法来检索序列中的最后一个元素。所有可以使用常规 LINQ 语法完成的操作都可以用 Lambda 表达式完成，并且你还可以进行更复杂的操作。你将在后续章节中看到更多示例。\n\
  \n\n\n\n\n### 异步编程\n\n通常，代码是同步运行的，这意味着一次只执行一个操作。对于运行时间短的操作，这没有问题。但对于耗时操作，应用程序可能会变得无响应并一直冻结直到操作完成，用户无疑会感到焦虑。作为一种通用的编程概念，在单独线程上运行耗时操作是一种最佳实践。线程可以被看作是一个独立的工作单元。用户界面运行在特定的线程上，因此如果所有耗时代码都影响了用户界面线程，应用程序就会冻结。这就是为什么将潜在的耗时操作委托到单独线程可以使应用程序更具响应性；这种技术被称为多线程。然而，处理线程可能会引入其他问题，包括但不限于以下内容：\n\
  \n*   由某个线程处理的对象无法被另一个线程访问，为了实现这一点，你必须处理非常复杂的编程技术。\n*   对资源的访问必须以特定的方式实现，以便在第一个线程完成工作之前，这些资源对其他线程是锁定状态。\n\
  \n当然，所有问题都是可以解决的，但这需要复杂的工作。为了在保持应用程序响应能力的同时简化操作，，.NET 自 2012 年以来一直提供了异步编程模式。简而言之，单个线程可以被分为多个任务，其中每个任务都可以异步工作，而无需创建单独的线程。这些点点：\n\
  \n*   在方法声明中添加 `async` 修饰符。\n*   在 `async` 方法内部使用 `await` 运算符来等待任务完成，而不阻塞线程。\n\n\
  为了理解它是如何工作的，请考虑读取大文件的场景。文件越大，在操作完成之前阻塞用户界面的风险就越高。接下来的示例展示了如何创建一个异步读取文件的方法：\n\n```sharp\n\
  private async Task<bool> ReadFileAsync(string fileName)\n{\n    try\n    {\n   \
  \     string fileContent = await File.ReadAllTextAsync(fileName);\n        Console.WriteLine(fileContent);\n\
  \        return true;\n    }\n    catch (Exception)\n    {\n        return false;\n\
  \    }\n}\n```\n\n这里有几点额外关注的内容：\n\n*   按照惯例，异步方法的名称应以 `async` 后缀结尾。\n*   异步方法返回类型为\
  \ `System.Threading.Tasks.Task` 的对象（无返回值，即 `void`），或者当有返回值时返回 `System.Threading.Tasks.Task<T>`。然而，`return`\
  \ 语句直接采用原始类型，而不是 `Task<t>`（见前面的代码）。\n*   编译器在同一线程内部创建了一个工作单元（`task`），这保持了应用程序的响应能力并解决了所有与多线程相关的问题。\n\
  \n异步编程可能是 C# 中最复杂的话题，绝不应该处处使用；它应该只在耗时操作可能阻塞用户界面的地方使用。在本节中，你学习了最基础的概念，这些概念对于 Xamarin\
  \ 同样重要，因为你将一直使用这种模式。然而，如果使用不当，可能会导致代码效率低下。因此，不要忘记阅读官方文档（`https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/async/`）。\n\
  \n### 结论\n\nC# 是一种高级、编译型且面向对象（OOP）的语言，你可以用它来构建各种应用程序，从桌面到 Web 和移动端，再到云端。微软无疑一直将\
  \ C# 视为最重要的 .NET 语言，并对其持续投入。从下一章开始，C# 将是你使用 Xamarin 构建移动应用程序的编程语言。本章只能总结你作为移动应用开发者需要记住的语言最重要的特性，但正如最后小节建议的那样，阅读额外的文档是绝对必要的。现在，坐好，系好安全带，准备好开启你的\
  \ Xamarin 开发者旅程。\n\n### 建议阅读\n\n*   书籍：*Mastering C# 8.0*，BPB Publishing (`https://bpbonline.com/collections/programming/products/mastering-c-8-0-book-ebook`）。\n\
  *   微软官方 C# 文档 (`https://docs.microsoft.com/en-us/dotnet/csharp/`）。\n\n# 第 5 章：使用\
  \ Xamarin 和 Xamarin.Forms 构建应用\n\n### 引言\n\n在学习了 Microsoft Visual Studio 和 C# 编程语言的基础之后，是时候开始使用\
  \ Xamarin 进行移动应用开发了。尽管本书侧关注 Xamarin.Forms，但了解原生项目是如何工作的对你来说非常重要。原因是 Xamarin.Forms\
  \ 解决方案依赖于原生项目，因此你必须了解它们的结构以及你如何如何配置它们。本章的第一部分解释了如何创建、配置和调试原生的 Xamarin.Android 和\
  \ Xamarin.iOS 项目。在第二部分，你将学习如何创建一个 Xamarin.Forms 解决方案，讨论其结构并理解该平台的基础，这对于后续章节是必须的。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   理解 Xamarin.Android 项目\n*   理解 Xamarin.iOS 项目\n\
  *   使用 Xamarin.Forms 的跨平台项目\n*   为发布准备应用程序\n\n### 目标\n\n完成本章后，你将能够创建 Xamarin.Forms\
  \ 解决方案并配置底层项目。你还将学习关于准备发布应用程序最重要的概念。\n\n## 理解 Xamarin.Android 项目\n\n通过复用在前几章节中学到的技能，打开\
  \ Visual Studio 并进入 `Create a new project`（新建项目）对话框（如果你已经在 IDE 中，则选择 `File` | `New`\
  \ | `Project`）。你创建 Xamarin.Android 项目所需的项目模板名为 `Android App` (`Xamarin`)。图 5.1 显示了它的样子（你也可以过滤列表以快速找到它，如图所示）。\n\
  \n![Figure-5.1.jpg]\n**图 5.1:** 创建 Xamarin.Android 项目\n\n选择该模板并点击 `Next`。此时，将要求在\
  \ `New Android App` 对话框中指定应用程序类型，如图 5.2 所示：\n\n![Figure-5.2.jpg]\n**图 5.2:** 选择\
  \ Android 应用类型\n\n表 5.1 描述了可能的应用类型。\n\n| Android 应用类型 | 描述 |\n| :--- | :--- |\n\
  | Single View App | 基于单个页面的简单应用程序。 |\n| Navigation Drawer App | 实现多间导航的应用程序。 |\n\
  | Tabbed App | 基于标签页分组页面的应用程序。 |\n| Blank App | 用于需要从头开始实现一切的空项目。 |\n\n**表 5.1:**\
  \ C# 中的 Android 应用类型\n\n\n\n\n\n为了演示目的，请选择 `Single View App` 模板。注意，您可以在左下角的 `Minimum\
  \ Android Version` 下拉菜单指定所需的最低 Android 版本（参见图 5.2*）。这是一个至关重要的选择：选择较高的版本可以让您获得利用最新、最现代的操作系统\
  \ API 和设备功能的选项，但会排除使用较低版本设备的用户；选择较低版本则允许您针对更大的用户群体，但它要求您使用所选版本上可用的操作系统和设备功能，而这些功能可能并不那么新。当您点击\
  \ `OK` 时，系统会要求您指定项目名称。在此示例中输入 `AndroidApp`。几秒钟，Xamarin.Android 解决方案将准备就绪。\n\n# 理解项目结构\n\
  \n在解决方案管理器（Solution Explorer）中，你可以看到项目结构，如图 5.3*所示：\n\n![](img/Figure-5.3.jpg)\n\
  \n**图 5.3：** Xamarin.Android 项目结构\n\n以下是需要记住的关键点列表：\n\n*   在 `References` 下，你将找到所需的库列表，包括系统库和第三方库。\n\
  *   在 `Assets` 文件夹下，你可以添加应用所需的资源文件，例如文档或视频。\n*   在 `Resources` 文件夹下，你可以找到子文件夹，可以在其中添加图像、图标和布局文件。更具体地说，你将图像添加到\
  \ `drawable` 中，并添加到名称以 `mipmap` 开头的文件夹中。每个分辨率都有一个文件夹。\n*   在 `Resources\\layout`\
  \ 文件夹中，你可以找到两个 XML 文件，它们与用户界面定义相关。\n\n`activity_main.xml` 文件代表应用的主入口点，并作为页面容器，你还可以在这里添加多个页面通用的控件。在\
  \ Android 开发中，一个活动（activity）代表单个页面，或者由一组组件表示的某个独立功能。`content_main.xml` 文件代表主页面，这是你可以绘制用户界面并处理其行为的地方。\n\
  \n# 绘制和处理用户界面\n\n在 Xamarin.Android 中，你通过编辑 XML 文件来绘制用户界面，就像使用 Android Studio 等原生工具一样。如果你双击\
  \ `content_main.xml` 文件，将看到代码编辑器和图形设计器，你可以在其中绘制用户界面的元素。如果你展开 ToolBox 工具窗口（参见图 5.4*），你还会看到一个可以在设计器上绘制用户界面的控件列表：\n\
  \n![](img/Figure-5.4.jpg)\n\n**图 5.4：** 编辑用户界面\n\nToolBox 应该在 IDE 的左侧自动隐藏，但如果你在那里看不到它，可以选择\
  \ `View` | `Toolbox`。你可以将控件拖到设计器表面上。例如，将一个 `TextView` 控件拖到设计器。此控件允许显示某些文本。当你这样做时，代码编辑器将更新为相应的\
  \ XML 标记。你可以在 `android:text` 属性中（参见图 4.5*）或 `Properties` 窗口中编辑文本。\n\n**描述 Android\
  \ 控件不在本章的范围内；这里的目标是为您介绍 Xamarin.Forms。然而，作为一条通用规则，记住控件由 XML 元素表示，其属性由 XML 属性表示。**\n\
  \n用户界面必须对用户操作做出响应。例如，用户点击按钮或在文本框中输入某些文本。用户界面元素触发事件，这些事件可以在 C# 中进行处理。例如，如果你打开 `main_activity.xml`\
  \ 文件，你会看到有一个允许发送电子邮件的悬浮按钮。在 `MainActivity.cs` 文件中，该按钮的 `Click` 事件处理如下：\n\n```csharp\n\
  private void FabOnClick(object sender, EventArgs eventArgs)\n{\n    View view =\
  \ (View) sender;\n    Snackbar.Make(view, “Replace with your own action\", Snackbar.LengthLong)\n\
  \    .SetAction(\"Action\", (View.IOnClickListener)null).Show();\n}\n```\n\n简而言之，当用户点击按钮时，代码获取按钮自身的实例，然后调用\
  \ `Snackbar.Make` 方法来执行必须由开发者实现的操作。目前，你只需要知道操作是在 C# 中处理；在接下来的章节中，你将看到这个概念如何广泛应用于\
  \ Xamarin.Forms，这也是这本书的重点。然后，在原生代码中处理事件将在第 13 章：与原生 API 交互*中讨论。\n\n# 配置 App Manifest\n\
  \nAndroid 应用程序可以在所谓的 manifest（清单）中进行配置。manifest 是一个 XML 文件，包含一组属性，使得配置应用行为成为，Visual\
  \ Studio 为其提供了一个方便的图形编辑器。如果你双击解决方案管理器中的 `Properties` 元素，`Application Manifest` 将出现，如图\
  \ 5.5*所示。\n\n![](img/Figure-5.5.jpg)\n\n**图 5.5：** 编辑 manifest\n\n*表 5.2* 总结了你可以通过\
  \ manifest 配置的选项：\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Application name` | 应用在设备上显示的名称。它指向在\
  \ `Resources\\values\\strings.xml` 中定义的 `app_name`。 |\n| `Package name` | 应用的唯一标识符。按照惯例以\
  \ com 开加上公司名称和应用名称。 |\n| `Application icon` | 应用图标，存储在 `mipmap` 文件夹下的 `.png` 文件。\
  \ |\n| `Application theme` | 可的应用主题。 |\n| `Version number` | 应用的唯一版本号。可以是 1, 2,\
  \ 3 等。 |\n| `Version name` | 向客户显示的版本名称（例如 1.0, 2.1）。 |\n| `Install location` |\
  \ 在支持的系统（直到 Android 5.1）上允许将应用安装在外部存储上。 |\n| `Minimum Android version` | 所需的所需的\
  \ Android 版本。 |\n| `Target Android version` | 用于编译项目的 Android SDK 和工具版本。 |\n| `Required\
  \ permissions` | 允许指定访问系统资源和设备工具所需的权限。 |\n\n花时间浏览 `Required permissions` 列表。这非常重要，因为应用程序无法随意访问系统资源和设备工具（如摄像头或传感器），这出于隐私考虑以及让用户了解应用能做什么，都是完全合理的。例如，如果你的应用需要连接互联网，你必须标记\
  \ `INTERNET` 权限。如果它允许拍照或录制视频，必须选择 `CAMERA` 权限。权限名称通常非常自俗易懂，但在接下来的章节中，你将通过提供的代码示例学习更多权限，在那里你实现真实的应用功能。必须在代码中处理权限以检测用户是接受还是拒绝权限请求。幸运的是，Xamarin.Android\
  \ 项目模板为你完成了这些。在 `MainActivity.cs` 文件中，你可以找到以下代码：\n\n```csharp\npublic override void\
  \ OnRequestPermissionsResult(int requestCode,\nstring[] permissions, [GeneratedEnum]\
  \ Android.Content.PM.Permission[]\ngrantResults)\n{\n    Xamarin.Essentials.Platform.OnRequestPermissionsResult(requestCode,\n\
  \    permissions, grantResults);\n    base.OnRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n}\n```\n\n\n\n\n\n`OnRequestPermissionsResult` 方法调用了\
  \ Xamarin.Essentials 库中 `Platform` 类的同名方法，该库是一个为常用开发任务提供 API 的重要工具，我们将在第 11 章，管理应用程序生命周期中讨论它。此方法会根据你在清单文件（manifest）中的设置来请求用户权限。如果你忘记在清单文件中配置权限，应用程序将抛出异常，因此你对对此需要非常小心。\n\
  \n# 调试 Android 应用程序\n\n你可以使用在前章节中学习的步骤来运行、调试和测试 Android 应用程序，这意味着按 `F5` 开始调试，或按\
  \ `Ctrl` + `F5` 在不附加调试器的情况下启动应用程序。然而，这里的目标不再是 Windows 控制台，而是一个设备。这可以是一台物理手机、平板电脑，也可以是一个模拟器。为了简单起见，以下段落将基于模拟器。在\
  \ Visual Studio 工具栏中，靠近 `Start` 图标的地方，你应该能看到预先配置的 Android 模拟器的名称，并可以点击向下箭头查看可用目标设备列表（参见图\
  \ 5.6）：\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6：** 选择调试设备\n\n在我的机器上，列表显示了一个模拟器（Pixel\
  \ 2 Pie 9.0）和一个物理设备（`HUAWEI WAS-LX1A`）。如果你想配置现有模拟器或创建一个带有你喜好的系统属性的新模拟器映像，可以点击 `Android\
  \ Device Manager`。这将打开 Android 设备管理器工具，如图 5.7 所示：\n\n![](img/Figure-5.7.jpg)\n\n\
  **图 5.7：** Android 设备管理器工具\n\n例如，你可以看到 Pixel 2 Pie 模拟器配置了 1 GB 的内存内存和 1080 x 1920\
  \ 的屏幕分辨率。如果你想更改配置，可以点击 `Edit`。相反，如果你喜欢从头开始创建一个新的模拟器映像，可以点击 `New`。这超出了本文的范围，因此将其留给你作为练习。你不需要从\
  \ Android 设备管理器手动启动模拟器，因为 Visual Studio 会为你完成操作。所以，如果你回到 Visual Studio 并按下 `Start`\
  \ 按钮，选定的模拟器将启动，应用程序将加载。如果你目标是物理设备，Visual Studio 将会在设备上启动应用程序并附加调试器实例。图 5.8 显示了当前简单应用程序在模拟器上的外观：\n\
  \n![](img/Figure-5.8.jpg)\n\n**图 5.8：** 在模拟器中运行的带有扩展控件的 Android 应用程序\n\n模拟器提供了扩展控件，你可以利用它们模拟应用程序生命周期中的不同情况，例如电池电、网络连接和位置。通过点击模拟器工具栏底部的\
  \ `…` 按钮启用扩展控件。你还可以旋转模拟器、控制音量以及截屏。调试时，你可以使用在第 3 章，介绍 Visual Studio 和 .NET 中学习的所有工具，例如断点和数据提示。\n\
  \n**当调试器附加到应用程序时，执行速度显然会慢得多。原因是调试器需要遍历执行的每一行代码，包括在后台运行的系统代码。如果你想测试真实的应用程序性能，应该至少在不使用调试器的情况下运行应用程序，并且可能在物理设备上运行。**\n\
  \n生成的 `.apk` 文件可以在 `bin\\debug` 或 `bin\\release` 下找到，取决于选择的配置。你会找到两个 `.apk` 文件，其中一个在名称中包含签名字面。如果你不提供签名，Visual\
  \ Studio 会为了在物理设备上的调试添加一个。无论你使用哪种设备，你现在都有查看你的 Android 应用程序如何运行的选项，这正是你在书其余部分中使用\
  \ Xamarin.Forms 并配合真实用户界面时要做的操作，因此请记住这些步骤。\n\n# 配置调试和生成选项\n\nVisual Studio 为你提供了配置调试和构建\
  \ Android 应用程序包的多个选项。如果你打开项目属性，你可以在 `Application` 选项卡中编辑用于构建应用程序包的 Android SDK 版本，如图\
  \ 5.9 所示：\n\n![](img/Figure-5.9.jpg)\n\n**图 5.9：** 配置 Android SDK 版本\n\n这不能与运行你的应用程序所需的最低版本混淆。相反，它允许你指定必须使用哪个版本的\
  \ Android 工具来构建应用程序包。在可能的情况下，你将使用机器上可最新版本，但在出现兼容性问题时你可以降级。在 `Android Options` 选项卡中，你可以配置调试和生成选项。如果你查看图\
  \ 5.10，你会看到许多选项，但只有一部分与你的日常工作相关：\n\n![](img/Figure-5.10.jpg)\n\n**图 5.10：** 配置 Android\
  \ SDK\n\n表 5.3 总结了与你相关的选项：\n\n| 选项 |  |\n| :--- | :--- |\n| `Use Fast Deployment\
  \ (debug mode only)` | 启用时，仅重新生成更新的程序集。 |\n| `Android Package Format` | 你可以在经典的\
  \ `.apk` 格式和新的 app bundle（应用束）之间进行选择，后者会创建一个更小的包。 |\n| `Linking` | 这允许控制链接器，链接器是一个持续查找未使用的类型和引用并将其删除以保持包体积较小的工具。支持的选项有\
  \ Sdk Assemblies only（默认）、Sdk and User Assemblies 以及 None。 |\n\n目前，保持默认选项即可。你可以在需要时更改它们。所有这些概念适用于每个\
  \ Xamarin.Forms 解决方案包含的原生 Android 项目，因此它们非常重要。`Android Package Signing` 选项将在发布部分进行讨论。\n\
  \n# 理解 Xamarin.iOS 项目\n\n通过 Visual Studio，你还可以创建原生的 Xamarin.iOS 项目。此外，如果你决定针对该平台，Xamarin.Forms\
  \ 解决方案将包含一个 Xamarin.iOS 原生项目，因此对你来说至少了解它们的结构是重要的。在 `Create new project` 对话中，找到 `iOS\
  \ App (Xamarin)` 项目模板（参见图 5.11）：\n\n![](img/Figure-5.1.jpg)\n\n**图 5.1：** 创建项目\n\
  \n你可以使用搜索框快速过滤列表。当你点击 `Next` 时，将要求指定项目类型（参见图 5.12）：\n\n![](img/Figure-5.12.jpg)\n\
  \n**图 5.12：** 指定 iOS 项目类型\n\n表 5.4 描述了可能的应用程序类型：\n\n| Android 应用类型 | 描述 |\n| :---\
  \ | :--- |\n| `Single View App` | 基于单个页面的简单应用程序。 |\n| `Master-Detail App` | 实现主页面（Master）并可以在子页面（Detail）之间导航的应用程序。\
  \ |\n| `Tabbed App` | 基于按标签分组页面的应用程序。 |\n| `Blank App` | 用于需要从头开始实现一切的空项目。 |\n\n\
  **表 5.4：** C# 中的 iOS 应用类型**\n\n\n\n\n根据你打算针对的设备类型，可以在“设备支持”（Device Support）组中选择其中一个。默认是\
  \ `Universal`（通用），这使得应用程序同时在 iPhone 和 iPad 上运行。你可以在稍后通过 `Info.plist` 文件随时更改设备类型。`Minimum\
  \ iOS Version`（最低 iOS 版本）下拉菜单允许你选择目标设备必须安装的最低 iOS 版本。版本越低，能够触达的用户就越多，但你将无法利用最新版本暴露的\
  \ API。对于当前示例，选择 `Single View App`（单视图应用）项目，然后点击 `OK`。在下一个对话框中，你将指定项目名称。对于当前示例，只需输入\
  \ `iOSApp` 然后点击 `OK`。几秒钟后项目将准备就绪，Visual Studio 将要求你连接到 Mac 计算机。正如你在 *第 1 章，移动应用开发的重要性*\
  \ 和 *第 2 章，Xamarin 与微软在移动应用市场中的地位*中所记得的，需要一台带有 XCode 开发工具的 Mac 计算机来使用 Xamarin 和\
  \ C# 构建 iOS 应用。在“配对 Mac”（Pair to Mac）窗口中，你可以指定一台位于同一网络中或可以通过其 IP 地址访问的 Mac。*图 5.13*\
  \ 展示了该对话框的外观：\n\n![](img/Figure-5.13.jpg)\n\n**图 5.13:** 将 Visual Studio 连接到 Mac\
  \ 计算机\n\n**如果配对 Mac 对话框没有自动出现，你可以通过 工具(Tools)、iOS、Pair to Mac 来显示它。**\n\n如果你的 Mac\
  \ 出现在列表中，只需双击它或点击 `Add Mac`添加 Mac）输入 Mac 本身的名称或 IP 地址。准备好后，点击 `Connect`连接）。假设你已经在\
  \ Mac 上开启了远程访问选项，Visual Studio 将询问 Mac 的凭据以进行连接。这些是可以登录系统的 Mac 用户的用户名和密码。对话框最终会通知你连接成功还是失败。\n\
  \n# 理解项目结构](#toc.xhtml_s164a)\n\n在解决方案资源管理器（Solution Explorer）中，你可以看到项目结构，其外观如 *图\
  \ 5.14* 所示：\n\n![](img/Figure-5.14.jpg)\n\n**图 5.14:** Xamarin.iOS 项目的结构\n\n以下是需要记住的关键点：\n\
  \n*   在 `References`（引用）下，你将找到所需的库列表，包括系统和第三方。\n*   在 `Assets Catalogs`（资源目录）文件夹下，你存储\
  \ Apple Store 需要的所有图标。\n*   在 `Resources`（资源）文件夹下，你添加图像、字体文件、文档以及应用可能需要的任何资源。\n\
  *   `Info.plist` 文件可以被视为 iOS 中的应用清单，允许配置应用的主属性。将在后续章节中进行更详细的讨论。\n*   `Entitlements.plist`\
  \ 文件允许将应用连接到多个 Apple 服务（例如 Apple Pay、Apple 登录、Siri、iCloud 等）并设置正确的授权。\n\n你还可以看到两个\
  \ `.storyboard` 文件，它们代表了用户界面设计的地方。\n\n# 处理用户界面](#toc.xhtml_s165a)\n\nXamarin.iOS\
  \ 允许你使用 `.storyboard` 文件创建用户界面，这与 Apple Xcode 使用的格式完全相同。如果你查看 *图 5.14*，你可以看到两个文件：`LaunchScreen.storyboard`\
  \ 和 `Main.storyboard`。第一个文件允许你为应用创建一个功能性的启动界面，其中包含静态以及以及类型的视觉元素。`Main.storyboard`\
  \ 代表应用的根页面，是你创建的第一个页面。此前，Visual Studio 拥有一个集成的可视设计器来帮助你为 Xamarin.iOS 项目创建用户界面，但它最近被删除了。因此，你有两个选择：\n\
  \n*   手动编写 XML 标记，将视觉元素直接映射到 `.storyboard` 文件内部。为了更深入地理解，你可以双击其中一个 `.storyboard`\
  \ 文件，并查看它们在代码编辑器中的显示方式（示例请参见 *图 5.15*，基于 `Main.storyboard` 的示例）。\n*   在 Mac 的 XCode\
  \ 中编辑 `.storyboard` 文件，以利用更复杂的视觉设计工具。\n\n![](img/Figure-5.15.jpg)\n\n**图 5.15:**\
  \ .storyboard 文件的 XML 标记\n\n对于本书而言，这两种选择都无关紧要，因为你将专注于 Xamarin.Forms 项目，而 Visual\
  \ Studio 为此类项目提供了适当的设计工具。但如果你需要使用视觉设计工具处理 Xamarin.iOS 项目，则这些项目需要在带有 XCode 的 Mac\
  \ 上打开。与 Android 一样，Xamarin.iOS 依赖 C# 代码来响应用户界面上的用户操作，以及处理应用生命周期所需的代码。如果你打开解决方案中的各种\
  \ .cs 文件，你将看到可以很容易联想到应用或页面生命周期事件的方法名。你将在*第 13 章：与原生 API 工作* 中学习更多相关内容。现在，最好用几句话介绍一个实战技巧。打开\
  \ `Main.cs` 文件。这是应用的主入口点，也是将执行的第一段代码。你将发现一个 `Main` 方法：\n\n```csharp\nstatic void\
  \ Main(string[] args)\n{\n    // 如果你想使用不同的 Application Delegate\n    // 你可以在这里指定它\n\
  \    UIApplication.Main(args, null, \"AppDelegate\");\n}\n```\n\n`UIApplication.Main`\
  \ 方法创建 `UIApplication` 类的实例，它代表整个生命周期内的应用程序。在 Xamarin.iOS 中，某些类型的运行时错误会导致应用崩溃而没有任何异常信息，即使启用了调试配置也是由于由于原因，你可以将调用封装在\
  \ `try..catch` 块中，如下：\n\n```csharp\ntry\n{\n    UIApplication.Main(args, null, \"\
  AppDelegate\");\n}\ncatch (System.Exception ex)\n{\n    System.Diagnostics.Debug.WriteLine(ex.Message);\n\
  }\n```\n\n通过这种方式，如果发生了问题，你可以使用断点或查看“输出”窗口查看 `Exception` 类提供的信息。这也适用于你的 Xamarin.Forms\
  \ 项目，因为它们依赖 Xamarin.iOS，因此建议在每个项目中都实现这种机制。\n\n# 调试 iOS 应用](#toc.xhtml_s166a)\n\n\
  在 Xamarin.iOS 中，你有通常的 `Debug` 和 `Release` 构建配置，外加两个变体：`iPhoneSimulator` 和 iPhone。当你想要使用\
  \ XCode 开发工具提供的模拟器之一时，使用第一个；当你想要在物理设备上运行应用时，使用第二个。例如，假设你想在安装了 iOS 15 的 iPhone 13\
  \ 上调试。你选择 `Debug` 配置，然后选择 `iPhoneSimulator`，并在启动按钮的下拉菜单中选择所需的设备，如 *图 5.16* 所示：\n\
  \n连接到 Mac 的物理设备也会出现在列表中，但只有在选择了 iPhone 配置时才能选择它们。\n\n**你可以在 Mac 的 XCode 中安装或删除设备模拟器。这不是\
  \ Visual Studio 可以处理的。**\n\n如果你按下 *F5*，Visual Studio 将连接 Mac 上的 XCode 开发工具。这对于构建\
  \ `.ipa` 应用包并启动 iPhone 模拟器是所需的。记住，这一切都发生在 XCode 端。大约分钟后，你应该看到设备模拟器运行着示例应用程序。\n\n\
  \n\n\n图 5.17：空的 Xamarin.iOS 项目运行在 iPhone 13 模拟器上\n\n在实践中，模拟器运行在 Mac 上的。Visual Studio\
  \ 仅在 Windows 上通过一个专用的用户界面共享该模拟器。\n\n由于 iOS 模拟器实际上运行在 Mac 上，如果你没有在 Windows 上也看到运行的模拟器，则必须显式启用此选项。可以通过点击\
  \ `Tools` | `Options` | `Xamarin` | `iOS Settings` 然后选择名为 `Remote Simulator` to\
  \ Windows 的选项来实现。\n\n模拟器带有一个工具栏，其中的按钮允许你模拟手势，例如按下物理主按钮、锁定屏幕和截屏。你可以通过点击 `…` 按钮访问高级选项，例如设置网络条件和示例位置。使用模拟器不仅使得使用不同的屏幕因子和硬件特性测试应用成为可能，还简化了开发过程，因为不需要开发者配置文件（developer\
  \ profile）。当你想要在物理设备上调试应用时，你需要开发者配置文件。这将在下一节中解释。\n\n# 理解描述文件和开发者账户\n\n为 iOS 构建应用需要一个\
  \ Apple 开发者账户。出于开发和调试目的，Apple SDK 会根据你的 Apple ID 生成一个免费的开发者账户，你可以用它编写代码和调试。这是自动完成的。正如后文*发布应用*部分中提到的，你需要一个付费的开发者账户来发布应用或将应用分发给测试人员。目前，免费的个人账户就可以了。如果你希望在物理设备上运行应用，你还需要所谓的描述文件（provisioning\
  \ profiles）。描述文件允许 Mac 出于开发目的识别你的物理设备。这在项目属性中完成，因此在 `Solution Explorer` 中右键点击项目名称，然后选择\
  \ `Properties`。`iOS Bundle Signing` 选项页将自动打开（参见图 5.18）：\n\n![](img/Figure-5.18.jpg)\n\
  \n图 5.18：管理 iOS 的描述文件\n\n如果选择了 `Manual Provisioning`（手动配置）选项，你将看到一个名为 `Developer`\
  \ 的配置文件，用于调试应用程序。如果你没有付费的 Apple 订阅，这是你唯一使用的选项。如果你有订阅，你还会看到用于发布应用的额外配置文件，你还可以利用 `Automatic\
  \ Provisioning` 选项，让 Visual Studio 为你完成配置账户的工作。你只需要做的就是点击 Add `Account`，提供你的 Apple\
  \ ID 凭据，并等待信息下载和连接。总之，Apple 提供免费的开发者账户，但它只能针对模拟器和物理设备进行开发和调试，不能用于分发或发布应用。物理设备需要描述文件，而模拟器不需要，Visual\
  \ Studio 会为你生成它们。\n\n# 配置应用包选项\n\n就像 Android 拥有应用清单（app manifest）一样，在 iOS 上你也可以配置一些重要的项目属性。这是通过编辑\
  \ `Info.plist` 文件实现的。如果你双击它，你将看到如图 5.19 所示的编辑器：\n\n![](img/Figure-5.19.jpg)\n\n\
  图 5.19：编辑应用程序属性\n\n`Application Name` 允许你指定应用在设备上显示的名称。`Bundle Identifier`（包标识符）代表整个\
  \ App Store 的唯一标识符，它由 com. 前缀、随后的公司名称和应用标识符组成。注意你如何如何更改创建项目时选择的目标设备，以及如何指定支持的设备方向。你实际上并不是在创建\
  \ Xamarin.iOS 项目，而是将使用 Xamarin.Forms。因此，建议不要更改 `Main Interface` 选项的值，它实际上指向作为根页的\
  \ `.storyboard` 文件。`Hide` status bar 和 `Requires full screen` 选项分别允许隐藏 `iOS status`\
  \ 状态栏（时、电量状态、网络）以及占据所有可用屏幕空间。后者对于没有物理主按钮的最新设备特别有用。\n\n在这部通用型读书中，无法总结所有的功能和集成选项。因此，你在这里只获得关于可能性的提示；鼓励你查看官方文档（https://docs.microsoft.com/en-us/xamarin/ios）以获取更多信息。\n\
  \n与 Android 不同，你不需要设置应用需要向用户请求的权限。这些将直接在代码中处理。`Info.plist` 编辑器提供了三个选项页：\n\n*   `Visual\
  \ Assets`（视觉资源）：你可以在这里提供应用图标、启动图像以及两个 iTunes 图标。\n*   `Capabilities`（功能）：在这里，你可以看到应用是否需要与\
  \ Game Center、Maps 和后台模式等服务集成。这部分没有详细介绍，请查看文档（https://docs.microsoft.com/en-us/xamarin/ios/deploy-test/provisioning/capabilities）。\n\
  *   `Advanced`（高级）：在此选项页中，你可以指定应用是否可以打开特定类型的文件或 URL。\n\n此外，你可以将应用与 Siri 等更多服务进一步集成。这可以通过编辑\
  \ `Entitlements.plist` 文件来实现。图 5.20 显示了编辑 `iCloud` 设置时的示例。\n\n![](img/Figure-5.20.jpg)\n\
  \n图 5.20：带有 Apple 服务的选项\n\n记住，`Info.plist` 和 `Entitlements.plist` 文件并不是 Xamarin.iOS\
  \ 的特有；它们是 Apple 的文件格式，必要时可以在 Xcode 中编辑。现在你已经有了关于 Xamarin.iOS 的通用知识，是时候转向本书重点：Xamarin.Forms\
  \ 了。\n\n### 使用 Xamarin.Forms 构建跨平台项目\n\nXamarin.Forms 是 Xamarin 代码库的最新成员，几年前加入的。Xamarin.Forms\
  \ 的目标是使用 C# 开发跨平台项目，尽可能地共享代码。特别是，它让你共享适用于所有平台的界面元素和在所有平台上运行的逻辑。在整个本书的学习过程中，你可以为项目赋予特定平台的功能，这实际上是一个非常常见的需求。Xamarin.Forms\
  \ 是你将使用的工具，因此本节解释的概念至关重要。在 `Create a new project` 对话框中找到 `Mobile App (Xamarin.Forms)`\
  \ 项目模板，例如在搜索列表中输入 mobile 以过滤结果，如图 5.21 所示：\n\n![](img/Figure-5.21.jpg)\n\n图 5.21：创建\
  \ Xamarin.Forms 项目\n\n当你点击 `Next` 时，会被要求项目名称。对于当前示例，输入 `MobileApp` 然后点击 `Create`。此时会弹出\
  \ `New Mobile App` 对话框，在这里你可以为应用指定模板，如图 5.22 所示：\n\n![](img/Figure-5.22.jpg)\n\n\
  图 5.22：选择应用模板\n\n有三个模板：\n\n*   `Flyout`，创建一个带有可折叠侧边菜单的基础结构。\n\n\n\n\n\n* `Tabbed`（标签页）：创建一个基于标签页的基础结构，以实现页面导航。\n\
  * `Blank`（空白）：创建一个包含一个页面的空项目。\n\n现在，请选择 `Blank`。然后，你可以找到想要针对的目标支持平台列表。正如 *第 1 章，移动应用开发的重要性*\
  \ 和 *第 2 章，移动应用市场中的 Xamarin 与微软* 中提到的，本书仅关注 Android 和 iOS，因此请确保选中了这两个平台。最后，点击 `Create`（创建）。几秒钟后，项目就会在\
  \ Visualal Studio 中准备就绪。\n\n# 理解项目结构 (#toc.xhtml_s170a)\n\n如果你查看解决方案资源管理器（Solution\
  \ Explorer）（请参见 *图 5.23*），你可以看到一个 Xamarin.Forms 解决方案是由三个项目组成的（如果你也选择了 UWP 作为目标，它们将是四个项目）：\n\
  \n![](img/Figure-5.23.jpg)\n\n**图 5.23：** Xamarin.Forms 解决方案的结构\n\n`MobileApp` 项目也被称为共享项目（shared\
  \ project），因为它是编写代码、逻辑和用户界面的真实所在。它的主要依赖是 Xamarin.Forms 库和 .NET Standard 库，而 Xamarin.Essentials\
  \ 是为了支持常用任务而添加的额外库。然后你可以找到两个原生项目 `MobileApp.Android` 和 `MobileApp.iOS`，它们具有你在本章之前学过的相同结构和行为，并且都包含对共享项目的引用。共享项目可以被认为是原生项目与\
  \ Xamarin 库之间的连接点，因此正如你在前面的节中学习的那样，它们仍然是自定义应用信息的地方。\n\n# 介绍 XAML、App.xaml 和 MainPage.xaml\
  \ (#toc.xhtml_s171a)\n\n在解决方案资源管理器中，你还会看到两个文件：`App.xaml` 和 `MainPage.xaml`。`App.xaml`\
  \ 文件包含在应用中全局可用的资源，并允许在其后台 C# 文件（命名为 `App.xaml.cs`）中管理应用程序生命周期事件，你可以展开 `App.xaml`\
  \ 节点来看到该文件。相反，`MainPage.xaml` 代表自动生成的根页面。它包含了用户界面的视觉元素以及所需的导航。它的后台代码文件 `MainPage.xaml.cs`\
  \ 用于处理用户界面上的用户操作并管理页面生命周期。特别是在接下来的两个章节中，你将学习如何处理多个页面。`.xaml` 扩展表示该文件包含 XAML 标记代码。XAML\
  \ 代表可扩展应用程序标记语言（eXtensible Application Markup Language），是一种衍生自 XML 的用于创建用户界面的标记语言。\n\
  \n**作为一般规则，每个 XAML 文件都有对应的 C# 后代码文件。可能会有例外，但这是最常见的情况。**\n\n如果你点击 `MainPage.xaml`，你将在代码编辑器中看到\
  \ Visual Studio 生成的一些示例 XAML 标记代码（请参见 *图 5.24*）：\n\n![](img/Figure-5.24.jpg)\n\n\
  **图 5.24：** 通过 XAML 定义用户界面\n\nXAML 基于 XML 语法。更具体地说，XML 节点表示一个视觉元素，而 XML 属性表示视觉元素的属性。在示例代码中，有以下相关元素：\n\
  \n* `ContentPage` 是一个表示单个页面的对象。\n* `xmlns` 标签可以比作 C# 命名空间，允许从库或内置架构导入对象，例如 Xamarin\
  \ 类型的情形。\n* `StackLayout` 是一种布局，可以被视为视觉元素的容器。\n* `Frame` 和 `Label` 是视觉元素，在移动应用开发术语中通常称为视图（views）。\n\
  \n正如你在前面的节中学习的样，共享项目仍然是自定义应用信息的地方。正如 *图 5.24* 所示，共享项目可以被认为是原生项目与 Xamarin 库之间的连接点。\n\
  \n\n\n\n\n## 图 5.26：为发布归档包\n\n你在`图 5.26`中看到的`Archive Manager`工具也包含了之前归档的包列表。下一步是点击`Distribute`（发布）。系统会询问你想要使用哪个通道，如`图\
  \ 5.27`所示：\n\n![](img/Figure-5.27.jpg)\n\n### 图 5.27：选择分发通道\n\n`Ad Hoc` 分发通道允许你创建一个经过签名的\
  \ `.apk` 文件，你可以自由地与他人共享。如果你选择 `Google Play`，Visual Studio 将要求你提供 Google Play 凭据并引导你完成将应用发布到商店的过程。不过，你始终可以选择\
  \ `Ad Hoc` 选项，并在后期阶段手动将生成的 `.apk` 上传到 Google Play。点击 `Ad Hoc`。系统将提示你`Create an Android\
  \ keystore`（创建 Android 密钥库），如`图 5.28`所示：\n\n![](img/Figure-5.28.jpg)\n\n### 图 5.28：创建\
  \ Android 密钥库\n\n这是一个你用于签名应用包的证书。强制性字段是`Alias`、`Password`和`Full Name`。别名只是为了你记录的一个方便名称。在准备好后点击`Create\
  \ when ready`，然后在`Archive Manager`中点击`Distribute`。当 `.apk` 文件生成完成后，你就可以点击`Open Folder`按钮在\
  \ Windows 资源管理器中查看该文件。然后你可以将应用包与他人共享，或手动将其上传到 Google Play。\n\n## 准备 iOS 包 #toc.xhtml_s175a\n\
  \n对于 iOS，工作原理非常相似。你仍然需要为项目选择`Release configuration`（发布配置），但你需要选择 iPhone 变体和物理设备。此外，你仍然需要连接到\
  \ Mac。然后，在`Solution Explorer`（解决方案资源管理器）中右键点击项目名称并选择`Archive`（归档）。Visual Studio\
  \ 将 Mac 上搜索适当的配置文件（provisioning profile）。如果未找到，你可以按照以下步骤创建一个：\n\n1. 在 Mac 上打开 Xcode\n\
  2. 使用任何模板创建一个新的 Swift 项目\n3. 当 Xcode 提示你指定包标识（bundle identifier）时，输入与你在 Xamarin.iOS\
  \ 项目中添加完全相同的标识符\n4. 选择目标设备（模拟器或物理设备）并通过工具栏上的`Start`按钮启动应用程序。\n\n这些步骤将在 Mac 端生成一个配置文件。完成后，返回\
  \ Visual Studio 并重复之前的步骤。记住生成的 `.ipa` 文件位于 Mac 上，因此你需要从那里获取它。Apple 允许你在将应用发布到常规\
  \ App Store 之前，通过 TestFlight 工具将应用分发给内部测试人员。这里将无法涵盖 TestFlight，因此建议阅读官方文档（`[`developer.apple.com/testflight/`](https://developer.apple.com/testflight/)`）。\n\
  \n## 结论 #toc.xhtml_s176a\n\n在本章中，你学习了原生项目是如何制作的，以及为什么它们在 Xamarin.Forms 解决方案中如此重要。你还学习了如何设置开发环境以处理跨平台项目。你已经掌握了使用\
  \ Xamarin.Forms 开发移动应用的所有必要基础知识。从下一章开始，你将正式开始编写代码，并将学习到更多关于 Xamarin.Forms 和移动应用开发通用的概念。\n\
  \n## 记忆点 #toc.xhtml_s177a\n\n* 使用 Xamarin.Forms，你跨项目共享用户界面和逻辑。\n* 你在原生项目的属性中设置应用信息。\n\
  * 在 Xamarin.Forms 中，用户界面通常是用 XAML 标记编写的。\n\n## 关键术语 #toc.xhtml_s178a\n\n* **App\
  \ manifest（应用清单）**：一个指定应用属性的文件。\n* **XAML**：你用于用声明方法定义用户界面的标记语言。\n* **Imperative\
  \ code（命令式代码）**：你用于实现应用操作的 C# 代码。\n* **Archive（归档）**：准备好分发的签名应用包。\n\n## 第 6 章 #toc.xhtml_c06\n\
  \n## 使用布局组织用户界面 #toc.xhtml_c06\n\n### 引言 #toc.xhtml_s179a\n\n你无法预测应用将运行在哪些移动设备上；它们可能是智能手机、平板电脑，甚至是台式电脑。这意味着许多可能的屏幕尺寸和形状。应用程序还应该同时支持横屏和竖屏模式。基于这些考虑，移动应用中的用户界面必须是自适应的。这意味着视觉元素将自动动态地调整大小以适应设备、屏幕尺寸和形状。为了实现这一点，Xamarin.Forms\
  \ 提供了布局（layouts），这是本章的主题。\n\n在书中，你经常遇到布局（layout）、视图（view）、控件（control）、视觉元素（visual\
  \ element）等术语。正如你在本章中学到的，布局可以包含一个或多个视图。view 是用户界面的单个部分（例如文本框、按钮等），且 view 一词在原生 Android\
  \ 和 iOS 开发中常用。control 的含义与 view 相同，但在微软的术语中使用得更频繁。视觉元素（visual element）可以是用户界面的任何元素元素，包括布局和视图。**在本书中，control\
  \ 和 view 是交替使用的。**\n\n### 结构 #toc.xhtml_s180a\n\n在本章中，我们将涵盖以下主题：\n\n* 理解布局的概念\n\
  * 使用 Xamarin.Forms 布局组织用户界面\n* 使用层叠样式表样式化用户界面\n\n### 目标 #toc.xhtml_s81a\n\n完成本章后，你将能够以动态方式组织视觉元素，并根据特定场景决定哪种布局更适合你的需求。本章带有一个配套的\
  \ Xamarin.Forms 解决方案，你可以在 Visual Studio 中打开跟随示例。共享项目包含多个页面，每个页面都有关于特定布局的示例，并具有自解释的名称。启动页面在`App.xaml.cs`文件中分配，将页面实例传递给\
  \ `MainPage` 属性，如下：\n\n```text\nMainPage = new StackLayoutExample();\n```\n\n上面的行显示了如何运行\
  \ `StackLayoutExample` 页面。\n\n### 理解布局的概念 #toc.xhtml_s182a\n\n大多数情况下，动态界面界面应该是动态动态这意味着适应这意味着类型、屏幕尺寸以及字体等用户设置。因此，你添加到用户界面的视觉元素不应具有固定的大小或位置，除非在固定定位提供良好用户体验的情况下。Xamarin.Forms\
  \ 通过将控件排列在称为布局或面板的容器中来实现动态界面。本章对所有可用布局进行了详细说明，并解释了如何以动态方法添加控件。此外，你还将了解到 Xamarin.Forms\
  \ 中的用户界面是以层次方式构建的，这意味着一个布局可以包含多个嵌套布局并创建复杂的用户界面。*表 6.1* 描述了 Xamarin.Forms 中的可用布局。\n\
  \n| 布局 | 说明 |\n| :--- | :--- |\n| `StackLayout` | 视觉元素一个接一个放置，方向水平（从左到右）或垂直（从上到下）。\
  \ |\n| `FlexLayout` | 类似于 `StackLayout`，但如果页面空间不足，视觉元素将换到下一行或下一列。 |\n| `Grid` |\
  \ 视觉元素定位在虚拟表格的行和列中。 |\n| `AbsoluteLayout` | 允许在指定位置放置子元素。 |\n\n\n\n\n\n| `RelativeLayout`\
  \ | 将子元素放置在取决于其与其他元素关系所建立的约束的位置。 |\n| `ScrollView` | 在子视觉元素上实现滚动功能。 |\n| `Frame`\
  \ | 为子视觉元素添加彩色边框、圆角和投影投影。 |\n| `ContentView` | 允许表单实现自定义且可重用的 XAML 视图。 |\n\n**表\
  \ 6.1:** Xamarin.Forms 中的布局\n\n在 Xamarin.Forms 中，每个页面通常至少有一个根布局，该布局在页面的 `Content`\
  \ 属性中声明。这种根布局通常包含页面中视觉元素的层级结构，该结构还可能包含其他布局。\n\n# 对齐和间距选项\n\n在 Xamarin.Forms 中，可以通过分别设置\
  \ `HorizontalOptions` 和 `VerticalOptions` 属性，在用户界面中对每个视觉元素进行水平或垂直对齐。允许的值由 `LayoutOptions`\
  \ 结构提供，并列在 表 6.2 中。例如，如果你在页面中只有一个根布局，可以将 `VerticalOptions` 赋值为 `FillAndExpand`，这样它将填充所有可用空间：\n\
  \n| 对齐 | 说明 |\n| :--- | :--- |\n| `Center` | 视觉元素居中对齐。 |\n| `CenterAndExpand` |\
  \ 视觉元素居中对齐并填充所有可用空间。 |\n| `Start` | 如果赋值给 `HorizontalOptions`，视觉元素左侧对齐。如果赋值给 `VerticalOptions`，视觉元素在顶部对齐。\
  \ |\n| `StartAndExpand` | 如果赋值给 `HorizontalOptions`，视觉元素左侧对齐。如果赋值给 `VerticalOptions`，视觉元素在顶部对齐。在两种情况下，视觉元素都会填充所有可用空间。\
  \ |\n| `End` | 如果赋值给 `HorizontalOptions`，视觉元素右侧对齐。如果赋值给 `VerticalOptions`，视觉元素在底部对齐。\
  \ |\n| `EndAndExpand` | 如果赋值给 `HorizontalOptions`，视觉元素右侧对齐。如果赋值给 `VerticalOptions`，视觉元素在底部对齐。在两种情况下，视觉元素都会填充所有可用空间。\
  \ |\n| `Fill` | 视觉元素的子元素周围没有间距，且不会扩展。 |\n| `FillAndExpand` | 视觉元素的子元素周围没有间距，并会填充所有可用空间。\
  \ |\n\n**表 6.2:** 对齐选项\n\n在安排用户界面时，正确管理视觉元素与布局之间的间距以及单个视图内部的间距同样重要。这是通过利用以下三个属性实现的：`Padding`、`Spacing`\
  \ 和 `Margin`。表 6.3 对它们进行了进一步详细描述：\n\n| 属性 |  |\n| :--- | :--- |\n| `Margin` | `thickness`\
  \ 类型，是视觉元素与其相邻视图之间的空间。 |\n| `Padding` | `thickness` 类型，是视觉元素与其子元素之间的空间。 |\n| `Spacing`\
  \ | `double` 类型，仅在 `StackLayout` 中可用，指定每个子元素之间的间距。默认值为 6。 |\n\n**表 6.3:** 间距选项\n\
  \n`thickness` 类型的属性有一个固定值，也可以为每个边设置不同的值。例如，考虑以下赋值：\n\n`Margin = \"10\"`\n\n它为视图相对于其相邻视觉元素的所有边添加相同的距离。相反，考虑以下赋值：\n\
  \n`Margin = \"10,5,10,5\"`\n\n它按照以下顺序：左、上、右、下为视图的每个边添加不同的距离。\n\n间距和距离的实现可能不会那么直观，因此建议你进行一些实验以获得更好的、实用的理解。\n\
  \n### 理解视觉树\n\n在所有基于 XAML 的技术中（例如 Xamarin.Forms、Windows Presentation Foundation\
  \ 和 Universal Windows Platform），你经常会听到视觉树（visual tree）的概念。视觉树是构成用户界面及其原始元素的视觉元素层级结构。例如，考虑以下代码：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\nx:Class=\"Layouts.MainPage\"\
  >\n<StackLayout Orientation=\"Vertical\">\n    <Label Text=\"Example\" />\n    <StackLayout>\n\
  </StackLayout>\n</StackLayout>\n</ContentPage>\n```\n\n这段代码生成了一个包含一些视觉元素的页面，其视觉层级由视觉树表示。在视觉树的顶部有一个\
  \ `ContentPage`，它代表单个页面。层级结构的下一层是 `StackLayout`（在接后的章节中解释）。然后，在同一层上有两个对象：`Label`\
  \ 和 `StackLayout`。如果你有一定的编程经验，你就知道通常视觉元素也有一个名称来唯一标识它们。但在之前的 XAML 代码中，没有视觉元素具有名称。在后台，Xamarin.Forms\
  \ 运行时即使在视觉元素没有名称的情况下识别并处理它们。这在第 9 章，使用资源和数据绑定中处理数据绑定工作时将特别有用。\n\n### .NET 对象层级结构\n\
  \n从 .NET 对象的角度来看，下一节描述的所有布局都继承自 `Xamarin.Forms.Layout` 类，该类暴露了每个布局通用的属性和结构。`Layout`\
  \ 类继承自 `Xamarin.Forms.View` 类，该类定义了布局和视图的基础设施。View 类进一步继承自 `Xamarin.Forms.VisualElement`\
  \ 类，该类定义了任何视觉元素的基本结构。例如，在表 6.2 中总结的的 `HorizontalOptions` 和 `VerticalOptions` 属性定义在\
  \ `View` 类中。在实践中，尽管这对你的知识有帮助，但没有记住每个属性的继承级别。你可以快速使用“转到定义”工具和“对象浏览器”窗口来分析对象的结构。因此，通过继承的成员仅在需要时才会突出显示。\n\
  \n# 组织用户界面\n\n本节描述了如何创建一个示例项目，其中包含你将在书中多次使用的概念，并展示了如何使用表 6.1 中的布局来组织用户界面元素。\n\n\
  ### 创建示例项目\n\n如所述，本章节带有一个相应的 Xamarin.Forms 解决方案，你可以使用 Visual Studio 打开它以便遵循示例。但如果你想从头创建一个项目，可以遵循以下步骤：\n\
  \n*   根据上一节的课程，创建一个名为 `Layouts` 的新 Xamarin.Forms 解决方案，以保持一致。\n\n*   不要编辑或删除生成的 `MainPage.xaml`\
  \ 文件；它稍后将派用到。\n\n\n\n\n\n*   对于书中讨论的每种布局，添加一个类型为 Content Page (XAML)的新项。要完成此操作，右键单击共享项目名称，然后在上下文菜单中点击\
  \ `Add New Item`。\n*   在 `Add New Item` 对话框中，点击左侧的 `Xamarin.Forms` 节点，然后选择 `Content\
  \ Page (XAML)` 模板。\n*   为新的 XAML 文件分配一个与所讨论布局相匹配的名称，例如 `StackLayoutExample.xaml`，然后点击\
  \ `Add`。\n\n这也是一个熟悉创建和管理 Xamarin.Forms 解决方案的有用练习。\n\n### StackLayout\n\n使用 `StackLayout`\
  \ 布局，子视图彼此相邻。子视图可以沿水平或垂直方向排列；垂直方向是默认设置。以下代码演示了如何水平和垂直排列子视图，以及 `StackLayout` 如何包含嵌套布局：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\nx:Class=\"Layouts.StackLayoutExample\"\
  >\n<StackLayout Orientation=\"Vertical\">\n  <StackLayout Orientation=\"Horizontal\"\
  \ Margin=\"5\">\n    <Label Text=\"Sample controls\" Margin=\"5\"/>\n    <Button\
  \ Text=\"Test button\" Margin=\"5\"/>\n  </StackLayout>\n  <StackLayout Orientation=\"\
  Vertical\" Margin=\"5\">\n    <Label Text=\"Sample controls\" Margin=\"5\"/>\n \
  \   <Button Text=\"Test button\" Margin=\"5\"/>\n  </StackLayout>\n</StackLayout>\n\
  </ContentPage>\n```\n\n此 XAML 的结果显示在 图 6.1 中，你可以看到运行中的 Android 和 iOS 模拟器。\n\n所有表示代码结果的用户界面图形都将显示\
  \ Android 和 iOS 模拟器，以便你更好地了解代码是如何跨平台运行的。如果某个仅仅一个系统中可用，则只显示相关的设备。\n\n![](img/Figure-6.1.jpg)\n\
  \n**图 6.1：** 使用 StackLayout 视图\n\n`Orientation` 属性可以赋值为 `Horizontal` 或 `Vertical`；后者是默认值。在用户界面动态性方面，`StackLayout`\
  \ 的子视图根据方向按比例调整大小。你也可以通过为每个子视图分配 `WidthRequest` 和 `HeightRequest` 属性为子视图分配固定大小。它们分别代表宽度和高度，但最好不要分配固定大小。如\
  \ 表 6.3 所示，你还可以通过 `Spacing` 属性决定子视图之间的间距。\n\n### FlexLayout\n\n与 `StackLayout` 一样，`FlexLayout`\
  \ 中的子视图彼此相邻（水平或垂直），但如果屏幕空间不足，它们将换行或换到新列（取决于 `Direction` 的值）。在最简单的形式，你如下声明 `FlexLayout`：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\nPadding=\"0,20,0,0\"\
  \nx:Class=\"Layouts.FlexLayoutExample\">\n<FlexLayout Wrap=\"Wrap\" JustifyContent=\"\
  SpaceAround\" Direction=\"Row\">\n  <Label Text=\"This is a sample label in a page\"\
  \ FlexLayout.AlignSelf=\"Center\"/>\n  <Button Text=\"Tap here to get things done\"\
  \ FlexLayout.AlignSelf=\"Center\" x:Name=\"Button1\"/>\n</FlexLayout>\n</ContentPage>\n\
  ```\n\n**提示：`Padding` 属性已分配给 `ContentPage` 对象，以便在屏幕顶部与根视觉元素之间添加一些距离。这通常仅在 iOS 中需要，但目前适用于两个平台。在接下来的章节中，你将学习如何按操作系统处理属性。\n\
  \n*   `Direction`：此属性指定子视图应按单行还是单列排列。类型为 `FlexDirection`，支持的值有 `Row`（默认）、`Column`、`RowReverse`\
  \ 和 `ColumnReverse`。后两个将导致子视图反向排列。\n*   `Wrap`：此属性类型为 `FlexWrap`，指定如果第一行/列空间不足，子视图必须换到下一行或下一列（取决于\
  \ `Direction` 的值）。允许的值有 `Wrap`（换到下一行/列）、`NoWrap`（强制视图内容保持单行/列）和 `Reverse`（换到下一行/列但反向排列）。\n\
  *   `JustifyContent`：此属性类型为 `FlexJustify`，指定在有额外空间时子视图应如何组织。可能的值为 start、`center`、`end`、`SpaceAround`、`SpaceBetween`\
  \ 和 `SpaceEvenly`。`FlexLayout` 中的子视图可以通过属性 `FlexLayout.AlignSelf` 进行对齐，其值可以是 `Start`、`Center`、`End`、`Stretch`。图\
  \ 6.2 显示了代码示例的结果并演示了子换的工作原理。\n\n![](img/Figure-6.2.jpg)\n\n**图 6.2：** 使用 FlexLayout\
  \ 视图\n\n### Grid\n\n`Grid` 是渲染性能方面最好的布局，它允许像虚拟表格一样在行和列中组织子视图。你可以仅定义行、仅定义列或同时定义行和列来创建虚拟单元格。行、列和单元格可以包含单个视图或另一个布局，这为你设计复杂的用户界面提供了极大的灵活性。以下代码段演示了如何定义一个分为行两列的\
  \ `Grid`：\n\n```xml\n<Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition />\n  \
  \  <RowDefinition />\n  </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n   \
  \ <ColumnDefinition />\n    <ColumnDefinition />\n  </Grid.ColumnDefinitions>\n\
  </Grid>\n```\n\n\n\n\n通常情况下，附加属性（attached properties）允许从当前视觉元素为另一个视觉元素分配属性。\n\n\
  行和列的索引从 0 开始，因此 0 表示从左侧的第一列和从顶部的第一行。行、列和虚拟单元格可以包含嵌套布局，以实现更复杂的视觉层次结构。以下代码演示了这一点，即嵌套网格：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n  xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n  x:Class=\"Layouts.GridSample\"\
  >\n  <ContentPage.Content>\n    <Grid>\n      <Grid.RowDefinitions>\n        <RowDefinition\
  \ />\n        <RowDefinition />\n      </Grid.RowDefinitions>\n      <Grid.ColumnDefinitions>\n\
  \        <ColumnDefinition />\n        <ColumnDefinition />\n      </Grid.ColumnDefinitions>\n\
  \      <Button Text=\"First Button\" />\n      <Button Grid.Column=\"1\" Text=\"\
  Second Button\"/>\n      <Grid Grid.Row=\"1\">\n        <Grid.RowDefinitions>\n\
  \          <RowDefinition />\n          <RowDefinition />\n        </Grid.RowDefinitions>\n\
  \        <Grid.ColumnDefinitions>\n          <ColumnDefinition />\n          <ColumnDefinition\
  \ />\n        </Grid.ColumnDefinitions>\n        <Button Text=\"Button 3\" />\n\
  \        <Button Text=\"Button 4\" Grid.Column=\"1\" />\n      </Grid>\n    </Grid>\n\
  \  </ContentPage.Content>\n</ContentPage>\n```\n\n注意，为了简单起见，可以省略 `Grid.Row=\"0\"\
  ` 和 `Grid.Column=\"0\"` 值。此代码的结果所示图 6.3：\n\n![](img/Figure-6.3.jpg)\n\n**图 6.3:**\
  \ 使用 Grid 的表格化布局\n\n# 行和列的间距、比例和跨度\n\n`Grid` 中的行和列尽可能具有动态的高度和宽度。默认情况下，行和列占据所有可用空间，但你还可以额外控制行的高度和列的宽度。每个\
  \ `RowDefinition` 的 `Height` 属性和每个 `ColumnDefinition` 的 `Width` 属性可以分配来自 `GridUnitType`\
  \ 枚举的值，以便管理它们的大小、比例和间距。可能的值如下：\n\n* **Auto：** 列和行自动调整大小以适应其内容。\n* **Star：** 列和行根据剩余可用空间按比例调整大小。\n\
  * **Absolute：** 行和列具有固定的高度和宽度。\n\n在 XAML 中，你使用 `*` 表示星比例，使用数值表示绝对值，如下代码段所示：\n\n\
  ```xml\n<Grid.ColumnDefinitions>\n  <ColumnDefinition Width=\"Auto\"/>\n  <ColumnDefinition\
  \ Width=\"*\"/>\n  <ColumnDefinition Width=\"20\"/>\n</Grid.ColumnDefinitions>\n\
  ```\n\n你还可以强制单元格中的视觉元素跨越多个行或列。这是通过 `Grid.RowSpan` 和 `Grid.ColumnSpan` 附加属性实现的，分配为视图应占据的行数和列数。\n\
  \n### AbsoluteLayout\n\n`AbsoluteLayout` 布局允许所谓的绝对定位，这意味着根据你的视觉元素的边界（bounds）指定其精确的大小和位置。让我们来看一个示例以便更好地理解：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n  xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n  x:Class=\"Layouts.AbsoluteLayoutExample\"\
  \ Padding=\"0,20,0,0\">\n  <AbsoluteLayout>\n    <Label Text=\"First Label\"\n \
  \     AbsoluteLayout.LayoutBounds=\"0, 0, 0.25, 0.25\"\n      AbsoluteLayout.LayoutFlags=\"\
  All\" TextColor=\"Red\"/>\n    <Label Text=\"Second Label\"\n      AbsoluteLayout.LayoutBounds=\"\
  0.20, 0.20, 0.25, 0.25\"\n      AbsoluteLayout.LayoutFlags=\"All\" TextColor=\"\
  Orange\"/>\n    <Label Text=\"Third Label\"\n      AbsoluteLayout.LayoutBounds=\"\
  0.40, 0.40, 0.25, 0.25\"\n      AbsoluteLayout.LayoutFlags=\"All\" TextColor=\"\
  Violet\"/>\n    <Label Text=\"Fourth Label\"\n      AbsoluteLayout.LayoutBounds=\"\
  0.60, 0.60, 0.25, 0.25\"\n      AbsoluteLayout.LayoutFlags=\"All\" TextColor=\"\
  Yellow\"/>\n  </AbsoluteLayout>\n</ContentPage>\n```\n\n从代码中可以看出，你通过 `AbsoluteLayout.LayoutBounds`\
  \ 和 `AbsoluteLayout.LayoutFlags` 附加属性指定子元素的位置。具体来说，`LayoutBounds` 属性允许你使用 `double`\
  \ 类型的值指定视图四个边界的位置，用逗号分隔。`LayoutFlags` 属性接受 `AbsoluteLayoutFlags` 枚举的值，并允许你更深入地控制子视图的位置。以下是可能值的列表：\n\
  \n* **All：** 子元素的所有维度都是按比例的。\n* **HeightProportional：** 子元素的高度按比例的。\n* **WidthProportional：**\
  \ 子元素的宽度是按比例的。\n* **None：** 无解释。\n* **SizeProportional：** 子元素的大小是按比例的。\n* **PositionProportional：**\
  \ 子元素的位置是按比例的。\n\n### RelativeLayout\n\n`RelativeLayout` 布局将子元素相互或相对于容器视图进行布局。`RelativeLayout`\
  \ 中的子元素的位置通过所谓的约束（constraints，由 `ConstraintExpression` 表示确定。以下代码段演示了如何使用来自其他视觉元素的附加属性分配这些属性：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n  xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n  x:Class=\"Layouts.RelativeLayoutExample\"\
  >\n  <ContentPage.Content>\n    <RelativeLayout>\n      <BoxView Color=\"Yellow\"\
  \ x:Name=\"YellowBoxView\"\n        RelativeLayout.YConstraint=\"{ConstraintExpression\
  \ Type=RelativeToParent,\n        Property=Height,Factor=.15,Constant=0}\"\n   \
  \     RelativeLayout.WidthConstraint=\"{ConstraintExpression\n        Type=RelativeToParent,Property=Width,Factor=1,Constant=0}\"\
  \n        RelativeLayout.HeightConstraint=\"{ConstraintExpression\n        Type=RelativeToParent,Property=Height,Factor=.8,Constant=0}\"\
  \ />\n      <BoxView Color=\"Green\"\n        RelativeLayout.YConstraint=\"{ConstraintExpression\
  \ Type=RelativeToView,\n        ElementName=YellowBoxView,Property=Y,Factor=1,Constant=20}\"\
  \n        RelativeLayout.XConstraint=\"{ConstraintExpression Type=RelativeToView,\n\
  \        ElementName=YellowBoxView,Property=X,Factor=1,Constant=20}\"\n        RelativeLayout.WidthConstraint=\"\
  {ConstraintExpression\n        Type=RelativeToParent,Property=Width,Factor=.5,Constant=0}\"\
  \n        RelativeLayout.HeightConstraint=\"{ConstraintExpression\n        Type=RelativeToParent,Property=Height,Factor=.5,Constant=0}\"\
  \ />\n    </RelativeLayout>\n  </ContentPage.Content>\n</ContentPage>\n```\n\n`RelativeLayout`\
  \ 类暴露了 `XConstraint` 和 `YConstraint` 属性。你将在第 9 章，资源和数据绑定中看到更多示例。图 6.5 显示了此代码的结果：\n\
  \n![](img/Figure-6.5.jpg)\n\n**图 6.5:** 视图的相对定位\n\n\n\n\n\n官方文档建议尽量避免 `RelativeLayout`\
  \ 布局，因为其渲染性能较差。如果你确实需要使用，请尽量避免在同一个页面中使用多个 `RelativeLayout` 布局。\n\n### ScrollView\n\
  \n有时，你的用户界面可能由长长的视觉元素组成，这些元素无法在一个屏幕内显示，因此应该是滚动的。为了实现这一点，你可以将视觉元素包含在 `ScrollView`\
  \ 布局内部。用法非常简单：\n\n```xml\n<ScrollView x:Name=\"Scroll1\">\n  <StackLayout>\n   \
  \ <Label Text=\"My favorite color:\" x:Name=\"Label1\"/>\n    <BoxView BackgroundColor=\"\
  Green\" HeightRequest=\"600\" />\n  </StackLayout>\n</ScrollView>\n```\n\n简而言之，`ScrollView`\
  \ 为你的视觉层次添加了滚动功能。在这个示例中，由于 `BoxView` 的高度很大，它无法在一个屏幕内显示，因此可以滚动内容。移动应用的一个常见场景是隐藏滚动条，你可以通过给\
  \ `HorizontalScrollbarVisibility` 和 `VerticalScrollbarVisibility` 属性赋值 `Always`、`Never`\
  \ 和 `Default` 值来更改其可见性。因此，你可以将这两个属性都赋值为 `Never`。你还可以通过 `Orientation` 属性控制滚动方向。支持的值有\
  \ `Horizontal` 和 `Vertical`，因此你可以设置 `ScrollView` 仅水平或仅垂直滚动。滚动动作显然不是静态的，因此在这里提供一张无法演示滚动手势的图片意义不大。你可以快速运行配套代码并亲自查看它的工作原理。\n\
  \n### 通过代码控制 ScrollView\n\n有时，你可能需要在 C# 代码中滚动视图；例如，在用户在应用做出选择后，你可能需要关注特定的视觉元素。`ScrollView`\
  \ 类暴露了 `ScrollToAsync` 方法，该方法有两个重载。为了更好地理解，请考虑以下两行代码：\n\n```csharp\nScroll1.ScrollToAsync(0,\
  \ 100, true);\nScroll1.ScrollToAsync(Label1, ScrollToPosition.Start, true);\n```\n\
  \n在第一行中，该方法确保 `ScrollView` 顶部 100 点处的内容可见。在第二行中，该方法强制 `ScrollView` 将指定的视觉元素移动到视图顶部，并确保\
  \ `ScrollView` 的当前位置与指定视图的位置一致。`ScrollToPosition` 枚举支持以下值：\n\n* `Center`: 将子元素滚动到中心。\n\
  * `End`: 将子元素滚动到末尾。\n* `MakeVisible`: 使元素在视图内可见。\n* `Start`: 将子元素滚动到起始位置。\n\n**避免嵌套\
  \ ScrollView 布局，并避免向 ScrollView 添加带有内置滚的视图（`CollectionView`、`WebView`、`ListView`\
  \ 等），因为这可能会导致滚动冲突。**\n\n### Frame\n\n`Frame` 的目的是在子视觉元素周围绘制彩色边框，并可选地添加阴影和圆角。以下代码提供了一个示例：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n             xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n      \
  \       x:Class=\"Layouts.FrameExample\">\n  <Frame OutlineColor=\"Red\" CornerRadius=\"\
  3\" HasShadow=\"True\" Margin=\"20\">\n    <Label Text=\"Label in a frame\"\n  \
  \         HorizontalOptions=\"Center\"\n           VerticalOptions=\"Center\"/>\n\
  \  </Frame>\n</ContentPage>\n```\n\n以下是最相关的属性列表及其描述：\n\n* `OutlineColor`: 允许指定框架边框的颜色。\n\
  * `CornerRadius`: 允许在 Frame 周围绘制圆角。\n* `HasShadow`: 设置为 true 时，在 Frame 下方显示投影投影。\n\
  \n[图 6.6] 提供了一个示例：\n\n![](img/Figure-6.6.jpg)\n\n**图 6.6：** 使用 Frame 包围视图\n\n###\
  \ ContentView\n\n`ContentView` 布局通常用于创建自定义且可复用的控件，因为它允许将多个视觉元素组合并在视图中。要创建一个 `ContentView`，在“解决方案管理器”（Solution\
  \ Explorer）中，右键点击共享项目，然后点击“添加新项”。当“添加新项”对话框出现时，点击左侧的 Xamarin.Forms 节点，然后选择 `Content\
  \ View item`，如[图 6.7]所示。注意，Visual Studio 还提供了 `Content View (C#)` 项模板，但它会生成一个新类，你需要在\
  \ C# 而不是 XAML 中定义你的视觉元素：\n\n![](img/Figure-6.7.jpg)\n\n**图 6.7：** 向项目添加新项\n\n此时，新项已添加到项目。。在\
  \ XAML 编辑器中，你可以看到 `ContentView` 是如何添加视觉元素的：\n\n```xml\n<ContentView>\n  <ContentView.Content>\n\
  \    <StackLayout>\n      <Label Text=\"Enter your address:\" />\n      <Entry x:Name=\"\
  EmailEntry\" TextChanged=\"EmailEntry_TextChanged\" />\n    </StackLayout>\n  </ContentView.Content>\n\
  </ContentView>\n```\n\n值得提到的是`ContentView` XAML 文件始终有一个后置代码（code-behind），你可以在其中管理视觉元素，例如处理事件。如果你查看\
  \ `Entry` 定义（一个允许输入文本的视图），可以看到 `TextChanged` 事件正在被处理。在 C# 后置代码，你可以拥有以下代码：\n\n```csharp\n\
  private void EmailEntry_TextChanged(object sender, TextChangedEventArgs e)\n{\n\
  \    _emailAddress = e.NewTextValue;\n}\n\nprivate string _emailAddress;\npublic\
  \ string EmailAddress\n{\n    get => _emailAddress;\n}\n```\n\n这里有一些你日常工作中可以使用的要点：\n\
  \n* `private` 字段存储用户输入的字符串。\n* 私有字段的内容通过名为 `EmailAddress` 的只读属性暴露给外部。\n* 使用公共只读属性和私有字段允许从调用视图获取数据而无需直接访问。\n\
  \n这种方法是最佳实践，但你始终可以为调用者提供通过读写属性编辑数据的选项。\n\n# 使用 ContentView\n\n使用 `ContentView` 需要三个步骤：\n\
  \n1. 在 XAML 文件中使用 `ContentView` 添加 XML 命名空间。\n2. 声明 `ContentView` 实例。\n3. 在代码中分配属性并处理\
  \ `ContentView`。\n\n\n\n\n\n命名空间标识符由你决定，但在引用第一级应用命名空间时，经常使用 `local`。引用定义了一个或多个自定义控件的命名空间的语法为\
  \ `clr-namespace:`。然后，你可以简单地添加视图的实例，如下所示：\n\n```xml\n<local:ContentViewExample />\n\
  ```\n\n然后，你可以对其分配属性、处理事件，以及你对任何其他 Xamarin.Forms 控件所执行的所有操作。图 6.8 显示了示例 `ContentView`\
  \ 的外观：\n\n![](img/Figure-6.8.jpg)\n\n**图 6.8：** 在用户界面中添加 ContentView\n\n如果你为视图指定了名称，你将能够从代码中访问其成员；例如之前定义的\
  \ `EmailAddress` 属性。\n\n# 使用级联样式表设置用户界面样式 (#toc.xhtml_s199a)\n\n`级联样式表`（`CSS`）允许在如\
  \ HTML 等标记语言中定义的视觉元素上实现不同的样式。Xamarin.Forms 支持 CSS 的特定子集，但不支持所有的 CSS 元素和语法。因此，此功能应仅被视为\
  \ XAML 的补充，建议优先使用 XAML 样式。Xamarin.Forms 允许你在项目中实现和消费 CSS 样式，其中一种在 XAML 中，另一种在 C#\
  \ 中。\n\n# 作为 XAML 资源定义 CSS 样式 (#toc.xhtml_s200a)\n\n在 Xamarin.Forms 中实现和消费 CSS 样式的种方法是在\
  \ XAML。你可以向页面的 `Resources` 集合添加一个 `StyleSheet` 对象。下面的代码段演示了这一点：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n            xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n       \
  \     x:Class=\"Layouts.CSSsample\">\n  <ContentPage.Resources>\n    <ResourceDictionary>\n\
  \      <StyleSheet>\n        <![CDATA[\n        ^contentpage {\n        background-color:\
  \ lightblue; }\n        stacklayout {\n        margin: 20; }\n        ]]>\n    \
  \  </StyleSheet>\n    </ResourceDictionary>\n  </ContentPage.Resources>\n</ContentPage>\n\
  ```\n\n在这种情况下，CSS 样式表定义被放置在 CDATA 节中。你基本上是以键值对的形式为每个视觉元素提供属性值。语法要求视觉元素名称，以及括括号内的属性名（后跟冒号）和值（后跟分号），例如\
  \ `stacklayout { margin: 20; }`。注意根元素（在本例中为 `contentpage`）必须跟在 `^` 符号。你不需要做任何其他操作，因为样式将应用到\
  \ CSS 中指定的所有视觉元素上。图 6.9 显示了上述列出的 CSS 样式如何将页面背景颜色变为浅蓝色，以及如何对 `StackLayout` 应用外边距：\n\
  \n![](img/Figure-6.9.jpg)\n\n**图 6.9：** 使用 CSS 设置用户界面样式\n\n**CSS 定义内部的视觉元素名称必须全小写。**\n\
  \n# 在 XAML 中消费 CSS 文件 (#toc.xhtml_s201a)\n\n在 XAML 中消费 CSS 样式的另一种可用选项是来自现有的 `.css`\
  \ 文件。首先，你需要将你的 `.css` 文件添加到 `Xamarin.Forms` 共享项目中，并将其 `BuildAction` 属性设置为 `EmbeddedResource`。`.css`\
  \ 文件必须遵循 `Xamarin.Forms` 支持的语法。例如，你可以将上一段中显示的 CDATA 节的内容复制粘贴到新的 `.css` 文件中。下一步是向\
  \ `ContentPage` 对象的资源添加 `StyleSheet` 对象，并为其 `Source` 属性分配 `.css` 文件名，如下例所示：\n\n\
  ```xml\n<ContentPage.Resources>\n  <ResourceDictionary>\n    <StyleSheet Source=\"\
  /mystyle.css\"/>\n  </ResourceDictionary>\n</ContentPage.Resources>\n```\n\n显然，你可以将\
  \ `.css` 文件组织在子文件夹中；例如，`Source` 属性的值可以是 `/Assets/mystyle.css`。配套代码包含适用于 Xamarin.Forms\
  \ 的示例 `.css` 文件。\n\n# 在 C# 中创建和实现 CSS 样式 (#toc.xhtml_s202a)\n\n在 Xamarin.Forms 中消费\
  \ CSS 样式的最后选项是 C# 代码。你可以通过字符串创建 CSS 样式（通过 `StringReader` 对象），也可以从现有的 `.css` 文件加载样式。然而，在这两种情况下，关键点在于你仍然需要将样式添加到页面资源中。下面的代码段演示了第一种情况，即从字符串创建\
  \ CSS 样式并手动包含在页面的 `Resources` 集合中：\n\n```csharp\nusing (var reader = new StringReader(\"\
  ^contentpage { background-color: lightblue; } stacklayout { margin: 20; }\"))\n\
  {\n    // \"this\" 代表一个页面\n    this.Resources.Add(new StyleSheet(reader));\n}\n\
  ```\n\n\n\n\n\n### 引言\n\n视图（Views）是任何移动应用程序用户界面的构建模块，它们代表了用户在应用中执行的操作。例如，日期选择器、文本框和日历都是视图的示例。`Xamarin.Forms`\
  \ 提供了许多开箱即用的视图并在本章中进行了描述。从术语的角度来看，也有必要进行重要的说明。*view*（视图）一词泛指你在 Microsoft 术语中称为 *control*（控件）、Android\
  \ 术语中称为 *widget*（小部件）以及 Apple 术语中称为 view 的。虽然这些词可以互换使用，但为了与官方文档保持一致，将使用 view 一词作为标准。在前章涵盖的所有概念现在都将非常有用，因为本章讨论的视图将组织在布局（layouts）中。\n\
  \n`Xamarin.Forms` 提供的某些视图将在 `[第 9 章，资源和数据绑定]` 中讨论，而不是在本章中。原因是此类视图仅与数据绑定集合一起，因此你首先需要理解数据绑定背后的概念。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 常用属性\n* 处理文本\n* 与按钮的用户交互\n* 选择日期和时间\n* 显示 HTML\
  \ 内容\n* 选择布尔值和数值\n* 实现搜索功能\n* 处理长时间运行的任务\n* 显示图像\n* 为视图添加交互性\n* 理解视觉状态\n\n### 目标\n\
  \n完成本章后，你将能够使用 `Xamarin.Forms` 创建基础移动应用程序，向用户显示信息，实现不同类型值的选择并处理用户交互。\n\n### 创建示例项目\n\
  \n本章附有一个配套 `Xamarin.Forms` 解决方案，你可以用 Visual Studio 打开它以更好地遵循示例。如果你想从头创建一个项目，可以按照以下步骤操作：\n\
  \n1. 创建一个新的名为 `CommonViews` 的 `Xamarin.Forms` 解决方案，以与示例保持一致。\n2. 不要编辑或删除自动生成的 `MainPage.xaml`\
  \ 文件；它将在以后使用。\n3. 对于书中讨论的每种布局，添加一个类型为 `Content Page (XAML)` 的新项。要实现此操作，右键点击共享项目名称，然后在上下文菜单中点击\
  \ `Add New Item`（添加新项）。\n4. 在 `Add New Item` 对话中，点击左侧的 `Xamarin.Forms` 节点，然后选择 `Content\
  \ Page (XAML)` 模板。\n5. 为新的 XAML 文件分配一个与讨论的视图匹配的名称，例如 `WorkingWithText.xaml`，并点击\
  \ `Add`（添加）。\n6. 对于你添加到项目的每个页面，在 `ContentPage` 中添加一个空的 `StackLayout`，并将其 `VerticalOptions`\
  \ 属性赋值为 `CenterAndExpand`。除非明确指定，这将是后续几页中代码示例的首选布局。\n\n### 常用属性\n\n所有视图都继承自 `Xamarin.Forms.View`\
  \ 类，因此它们共享许多通用的属性。书中最相关且最常用的属性描述在 `[表 7.1]` 中。\n\n| 属性 | 描述 |\n| :--- | :--- |\n\
  | `HorizontalOptions` | 允许指定视图的水平对齐。支持的值与 `[第 6 章，使用布局组织用户界面]` 中 `[表 6.2]` 描述的布局相同。\
  \ |\n| `VerticalOptions` | 允许指定视图的垂直对齐。支持的值与 `[第 6 章，使用布局组织用户界面]` 中 `[表 6.2]` 描述的布局相同。\
  \ |\n| `HeightRequest` | 允许指定视图的高度。类型为 `double`。 |\n| `WidthRequest` | 允许指定视图的宽度。类型为\
  \ `double`。 |\n| `IsVisible` | 类型为 `bool`，允许指定视图在视觉树中是否可见。默认值为 `true`。 |\n| `IsEnabled`\
  \ | 类型为 `bool`，启用或禁用视图。禁用视图意味着它是可见的，但用户无法与其交互。默认值为 `true`。 |\n| `GestureRecognizers`\
  \ | 此属性允许为原生不支持此项的视图添加交互。将在本章稍后的“*为视图添加交互性*”部分进行详细讨论。 |\n\n**表 7.1:** 最相关视图的常用属性\n\
  \n了解这些共享属性非常重要，因为它们在章中会被频繁使用。\n\n### 处理文本\n\n显示和输入文本可能是移动应用中最常见的操作。`Xamarin.Forms`\
  \ 提供了三个关于文本的视图：Label、Entry 和 Editor。\n\n### 使用 label 显示文本\n\n你使用 `Label` 视图来显示只读文本，例如标题、消息和普通内容。以下代码段演示了如何通过分配其最常用的属性来声明一个\
  \ `Label`：\n\n```xml\n<Label Text=\"Welcome to Xamarin for JobSeekers!\" TextColor=\"\
  Blue\"\nLineBreakMode=\"WordWrap\"\nHorizontalTextAlignment=\"Center\"\nVerticalTextAlignment=\"\
  Center\" FontSize=\"Medium\"/>\n```\n\n`Text` 属性无疑是最重要的，因为它包含了你想显示的文本。你可以通过 `TextColor`\
  \ 属性为文本设置颜色，如果你想让标签具有特定的背景颜色，甚至分配 `BackgroundColor` 属性。`LineBreakMode` 属性设置了文本截断或换行到新行的方式。支持的值描述在\
  \ `[表 7.2]`：\n\n| 值 | 描述 |\n| :--- | :--- |\n| `WordWrap` | 将长文本换行到新行，确保在换行之前显示完整的单词（默认设置）。\
  \ |\n| `NoWrap` | 不换行或截断。 |\n| `HeadTruncation` | 在开头截断长文本。 |\n| `TailTruncation`\
  \ | 在结尾截断长文本。 |\n| `MiddleTruncation` | 在中间截断长文本。 |\n| `CharacterWrap` | 将长文本换行到新行，但不确保在换行之前显示完整的单词，仅根据字符边界。\
  \ |\n\n**表 7.2:** LineBreakMode 枚举的文本截断模式\n\n`HorizontalTextAlignment` 和 `VerticalTextAlignment`\
  \ 设置文本的对齐，而不是 `Label` 的对齐。支持的值有 `Start`、`Center` 和 `End`。你还可以通过分配 `FontSize` 属性指定字体大小。这将在后的管理字体部分进一步解释。其他有用属性如下：\n\
  \n* `CharacterSpacing`: 允许指定文本各个字符之间的间距。\n* `TextType`: 默认情况下，`Label` 显示文本，但你可以为此属性分配\
  \ HTML 并显示 HTML 内容。\n* `TextTransform`: 此属性可以将整个文本转换为小写（`LowerCase`）和大写（`UpperCase`）。如果没有明确分配此属性，则不进行转换。\n\
  * `FlowDirection`: 多个视图共有，此属性使得支持从右到左的文本方向。支持的值有 `LeftToRight`（默认）、`RightToLeft`\
  \ 和 `MatchParent`。后者继承自父视图的方向。\n\n`Label` 视图还可以显示格式化文本，正如你将在接下来的章节中看到的。`[图 7.1]`\
  \ 显示了上述的 `Label` 在 Android 和 iOS 上的外观：\n\n![](img/Figure-7.1.jpg)\n\n**图 7.1:**\
  \ 一个 Label 和一个 Entry\n\n\n\n\n\n# 使用 entry 和 editor 用户输入\n\n`Xamarin.Forms` 提供了两种视图来接收用户输入：`Entry`\
  \ 和 `Editor`。主要区别在于 `Entry` 允许输入单行文本，而 `Editor` 允许输入多行。下面的代码片段演示了如何声明一个 `Entry`：\n\
  \n```xml\n<Entry x:Name=\"Entry1\" Placeholder=\"Enter some text...\" TextColor=\"\
  Green\" Keyboard=\"Chat\" ReturnType=\"Done\" Completed=\"Entry1_Completed\"/>\n\
  ```\n\n[表 7.3] 总结了 `Entry` 最相关的属性。\n\n**为 Entry 描述的所有属性和事件也适用于 Editor。**\n\n| 属性\
  \ | 描述 |\n| :--- | :--- |\n| `Text` | `string` 类型，存储用户输入的文本。 |\n| `Placeholder`\
  \ | `string` 类型，在 `Entry` 中显示描述，仅在内容为空时显示。 |\n| `TextColor` | `color` 类型，设置输入文本的颜色。\
  \ |\n| `Keyboard` | 允许根据视图用途显示内置设备键盘类型之一。支持的自解释值包括 Chat, Default, Email, Numeric,\
  \ Plain, Text, Telephone 和 URL。 |\n| `ReturnType` | 根据以下支持的值设置设备键盘回车键上显示的文本：Default,\
  \ Done, Search, Go, Next, Send。文本将以设备上设置的语言显示。 |\n| `IsSpellCheckEnabled` | `bool`\
  \ 类型，如果设备语言支持，则对输入文本启用拼写检查。 |\n| `IsTextPredictionEnabled` | `bool` 类型，启用设备键盘的建议功能。\
  \ |\n\n**表 7.3：** Entry 和 Editor 视图最相关的属性\n\n`Entry` 还允许像处理 `Label` 一样设置 `CharacterSpacing`、`HorizontalTextAlignment`\
  \ 和 `VerticalTextAlignment` 等属性。这是一个交互式视图，因此它暴露了你可以处理的事件以操作输入的文本。你可能会经常处理的事件如下：\n\
  \n* `TextChanged`: 每次按键时都会触发。\n* `Completed`: 当系统检测到用户不再打字时触发。\n\n你可能已经注意到，之前 `Entry`\
  \ 的定义通过 `x:Name` 标签为视图指定了名称，这是为了能够处理视图的事件。下面的代码片段演示了如何处理这两个事件：\n\n```csharp\nprivate\
  \ void Entry1_Completed(object sender, EventArgs e)\n{\n    string enteredText =\
  \ Entry1.Text;\n}\n\nprivate void Entry1_TextChanged(object sender, TextChangedEventArgs\
  \ e)\n{\n    string enteredText = e.NewTextValue;\n    string previousText = e.OldTextValue;\n\
  }\n```\n\n通过 `Completed` 事件，你通过 `Text` 属性获取输入。通过 `TextChanged`，你仍然可以这样做，还可以使用 `TextChangedEventArgs`\
  \ 类的 `NewTextValue` 和 `OldTextValue` 属性来理解新输入了哪些文本并将其与之前的文本进行比较。[图 7.1] 显示了 Entry\
  \ 的运行情况。\n\nEditor 具有相同的行为、属性和事件，但它允许跨多行输入长文本。\n\n### 输入密码\n\n`Entry` 暴露了一个名为 `IsPassword`\
  \ 的有用属性。当为 `true` 时，用户输入将被掩码，你可以使用 `Entry` 输入密码。结果仍然存储在 `Text` 属性中，所有其他行为和成员保持不变。\n\
  \n### 应用和管理字体\n\n所有显示文本的视图都允许自定义字体（也称为字字体）。因此，这不仅适用于 `Label`、`Entry` 和 `Editor`，还适用于所有支持文本的视图，例如按钮。对于此类视图，以下属性允许你操作字体：\n\
  \n* `FontFamily`: 通过名称指定使用的字体。\n* `FontAttributes`: 允许通过同名的值 `Italic` 和 `Bold` 将文本格式化为斜体或加粗。\n\
  * `FontSize`: 指定文本的大小。这可以通过数值值或所谓的命名大小来实现，如 micro, small, medium, body（默认），header,\
  \ title, subtitle, caption 和 large。\n* `TextDecoration`: 允许通过同名的 `underline` 和 `strikethrough`\
  \ 值添加下划线或删除线装饰。\n\n在涉及字体大小时，建议使用命名大小而不是数值，因为在具有不同操作系统和屏幕因子的设备上，使用数值可能会产生不同的结果。命名大小在平台之间是一致的。下行代码演示了如何显示加粗且\
  \ header 尺寸的下划线文本：\n\n```xml\n<Label FontAttributes=\"Bold\" FontSize=\"Header\"\
  \ Text=\"Bold header\" TextDecorations=\"Underline\" />\n```\n\n# 实现自定义字体\n\n在现实世界中，实现自定义字体是非常常见的。这些字体可以是官方字体（例如来自\
  \ Google Material 设计的），也可以由专业人士创建。\n\n1. 将 `.ttf` 文件添加到 Android 的 `Assets` 文件夹和\
  \ iOS 的 `Resources` 文件夹中。\n2. 将 Android 的 `Build Action` 设置为 `AndroidResource`，iOS\
  \ 设置为 `EmbeddedResource`。\n3. 在 XAML 中，通过名称（不带 `.ttf` 扩展）分配字体。\n\n```xml\n<Label\
  \ Text=\"Custom Font\">\n    <FontFamily>\n        <OnPlatform x:TypeArguments=\"\
  String\">\n            <On Platform Value=\"MyFont\"/>\n        </OnPlatform>\n\
  \    </FontFamily>\n</Label>\n```\n\n这是你第一次看到 `OnPlatform` 标签。书中将在以后对其进行详细讨论，但现在重要的是理解为它允许在不同平台上区分同一属性的行为。`x:TypeArguments`\
  \ 属性指定了属性的 .NET 类型，这里是 `string`，因为这是 `FontFamily` 属性的类型。接下来，对于 iOS 平台，属性的值被为不带 `.ttf`\
  \ 扩展的字体文件名。如果你想尝试真实的字体，可以从 Google (https://fonts.google.com/) 下载一些。这些字体与 Android\
  \ 和 iOS 设备都非常兼容，因此你可以更精确地了解它们是如何工作的。\n\n# 使用 FormattedString 实现复杂的文本格式\n\n`Label`\
  \ 视图提供了使用更复杂的字符串格式显示文本的选项。这是通过 `FormattedString` 的 `FormattedText` 属性实现的。该属性由 `Span`\
  \ 对象的集合填充，每个 `Span` 代表格式化字符串的一个区域。下面的代码提供了一个示例：\n\n```xml\n<Label Margin=\"10\"\
  \ HorizontalOptions=\"Center\" VerticalOptions=\"CenterAndExpand\">\n    <Label.FormattedText>\n\
  \        <FormattedString>\n            <FormattedString.Spans>\n              \
  \  <Span FontSize=\"Large\" FontAttributes=\"Bold\" ForegroundColor=\"Black\" Text=\"\
  Xamarin for JobSeekers\" />\n                <Span FontSize=\"Medium\" FontAttributes=\"\
  Italic\" ForegroundColor=\"Blue\" Text=\"published by BP Publishing\" />\n     \
  \           <Span FontSize=\"Small\" FontAttributes=\"Bold\" ForegroundColor=\"\
  Gray\" Text=\"Written by Alessandro Del Sole\" />\n            </FormattedString.Spans>\n\
  \        </FormattedString>\n    </Label.FormattedText>\n</Label>\n```\n\n上述代码的结果所示在\
  \ [图 7.2] 中：\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2：** 实现复杂的字符串格式化\n\n\n\n\n\nSpan\
  \ 对象支持文本操作属性，这些属性你在讨论 `Label` 视图时已经见过了，因此你对 `FormattedString` 属性会很。\n\n### 与按钮的交互\n\
  \n`Button` 可能是实现用户交互最常用的视图。在应用程序的常见流程中，用户按下（在移动端术语中为点击）按钮后，任务开始执行。以下代码演示了如何引导用户点击通过\
  \ XAML 声明和设计的 `Button`：\n\n```xml\n<StackLayout Spacing=\"10\" Margin=\"10\" VerticalOptions=\"\
  CenterAndExpand\">\n    <Label Text=\"Tap the button\" VerticalOptions=\"CenterAndExpand\"\
  \ HorizontalOptions=\"CenterAndExpand\" />\n    <Button x:Name=\"Button1\" Text=\"\
  Tap here!\" BackgroundColor=\"DarkBlue\" TextColor=\"White\" BorderColor=\"LightBlue\"\
  \ BorderWidth=\"2\" CornerRadius=\"4\" Clicked=\"Button1_Clicked\" />\n</StackLayout>\n\
  ```\n\n*表 7.4* 总结了 `Button` 最重要的属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Text` |\
  \ 按钮中显示的文本。 |\n| `TextColor` | 文本的颜色。 |\n| `BorderColor` | 为按钮添加有色的边框。 |\n| `BorderWidth`\
  \ | 指定按钮周围边框的厚度。 |\n| `CornerRadius` | 指定按钮角的半径。 |\n| `Image` | 允许指定一个放置在按钮文本附近的图像。\
  \ |\n| `BackgroundColor` | 按钮的背景颜色。 |\n\n**表 7.4：** 最相关的 Button 属性\n\n上述 XAML 代码将产生*图\
  \ 7.3* 所示的结果：\n\n![](img/Figure-7.3.jpg)\n\n**图 7.3：** 使用按钮实现用户交互\n\n注意 `Button`\
  \ 声明包含一个视图的名称和一个指向名为 `Button1_Clicked` 事件处理程序的 `Clicked` 事件。在 C# 后置代码文件中，你从这里处开始执行当用户点击按钮时触发的操作。该事件处理程序如下所示：\n\
  \n```csharp\nprivate void Button1_Clicked(object sender, EventArgs e)\n{\n    //\
  \ 在此处开始执行操作…\n}\n```\n\n例如，你可以跳转到应用程序的另一个页面并下载某些数据，或任何与你的应用程序上下文相关的操作。一旦你完全了解可以使用\
  \ `Xamarin.Forms` 做什么，你将更容易理解哪些操作最适合特定的上下文。\n\n**提示：由于 `Button` 显示文本，它还暴露了如 `FontFamily`、`FontSize`、`FontAttributes`、`TextTransform`\
  \ 等属性。你可以像使用 `Label` 一样直接使用它们。**\n\n`Xamarin.Forms` 还提供了 `ImageButton` 视图，它的工作方式与\
  \ `Button` 完全相同，但显示的是图像而不是文本。要显示的图像分配给 `ImageButton` 的 `Source` 属性，如下：\n\n```xml\n\
  <ImageButton Source=\"AnImage.png\" x:Name=\"AnImageButton\" Clicked=\"AnImageButton_Clicked\"\
  />\n```\n\n所有其他控制半径和边框的选项仍然可用，你仍然可以处理 `Clicked` 事件来触发操作。`Source` 属性类型为 `ImageSource`，通过此对象的实例分配图像的方法将在本节稍后的“显示图像”部分进行详细讨论，因此建议将该部分作为参考。\n\
  \n### 选择日期和时间\n\n在 `Xamarin.Forms` 中，你可以分别利用 `DatePicker` 和 `TimePicker` 视图通过每个系统的用户界面选择日期和时间。这些将在本节中讨论。\n\
  \n# 使用 DatePicker 选择日期\n\n`DatePicker` 的声明如下：\n\n```xml\n<DatePicker x:Name=\"DatePicker1\"\
  \ MinimumDate=\"01/01/2021\" MaximumDate=\"12/31/2021\" DateSelected=\"DatePicker1_DateSelected\"\
  />\n```\n\n你可以使用 `MinimumDate` 和 `MaximumDate` 属性指定有效日期范围，两者的类型均为 `DateTime`。日期以\
  \ `MM/DD/YYYY` 格式表示。`Date` 属性包含选定的日期，如果在 XAML 中未指定，则认为系统当前日期。当用户选择日期时，会触发 `DateSelected`\
  \ 事件，你可以如下处理它：\n\n```csharp\nprivate void DatePicker1_DateSelected(object sender,\
  \ DateChangedEventArgs e)\n{\n    DateTime selectedDate = e.NewDate;\n}\n```\n\n\
  `DateChangedEventArgs` 类提供了 `NewDate` 属性（包含新选择的日期）和 `OldDate` 属性（包含之前的日期）。*图 7.4*\
  \ 显示了 `DatePicker` 在两个平台上的外观：\n\n![](img/Figure-7.4.jpg)\n\n**图 7.4：** DatePicker\n\
  \n### 使用 TimePicker 选择时间\n\n在 `Xamarin.Forms` 中，你可以分别利用 `DatePicker` 和 `TimePicker`\
  \ 视图通过每个系统的用户界面选择日期和时间。这些将在本节中讨论。\n\n`TimePicker` 在概念上与 `DatePicker` 类似，允许用户选择时间。`TimePicker`\
  \ 可以如下声明：\n\n```xml\n<TimePicker x:Name=\"TimePicker1\" PropertyChanged=\"TimePicker_PropertyChanged\"\
  />\n```\n\n`TimePicker` 暴露了 `PropertyChanged` 事件，该事件在值更改时触发。你可以如下处理它：\n\n```csharp\n\
  private void TimePicker_PropertyChanged(object sender, PropertyChangedEventArgs\
  \ e)\n{\n    if (e.PropertyName == TimePicker.TimeProperty)\n    {\n        TimeSpan\
  \ selectedTime = ((TimePicker)sender).Time;\n    }\n}\n```\n\n### 显示 HTML 内容\n\n\
  有时，你可能需要在应用程序内部直接打开网站或显示 HTML 文档。为了实现这一点，你可以实现 `WebView` 视图。在最简单的形式下，你如下声明 `WebView`：\n\
  \n```xml\n<WebView x:Name=\"WebView1\" Source=\"https://bpline.com\"/>\n```\n\n\
  此代码的结果如*图 7.6* 所示，其中你可以看到 `WebView` 显示了一个网站：\n\n![](img/Figure-7.6.jpg)\n\n**图 7.6：**\
  \ 使用 WebView 打开网站\n\n**提示：在 Android 上，如果你使用 `WebView` 打开网站，请记住在应用清单文件中包含 Internet\
  \ 权限。**\n\n`WebView` 暴露了 `Navigating` 事件（在导航开始时触发）和 `Navigated` 事件（在导航完成时触发）。导航也可以通过\
  \ `GoBack` 和 `GoForward` 方法进行程序化控制，在检查 `CanGoBack` 和 `CanGoForward` 布尔属性返回 `true`\
  \ 后调用这些方法。`WebView` 的 `Source` 属性不仅允许指定 HTML 内容的内容，还可以被分配不同的类型。它的类型是 `WebViewSource`，这是一个可以接收\
  \ URI 或包含 HTML 标记的字符串的对象。例如，你可以为 `Source` 分配静态 HTML 内容，如下：\n\n```csharp\nWebView1.Source\
  \ = \"<div><h1>Header</h1></div>\";\n```\n\n\n\n\n\n### 选择布尔值和数值\n\n`Xamarin.Forms`\
  \ 提供了多个视图来实现基于布尔（真/假）和数值的用户输入。这些视图包括 `Switch`（开关）、`CheckBox`（复选框）、`Slider`（滑动条）和\
  \ `Stepper`（步进器）。\n\n# 使用开关开启选项\n\n`Switch` 是一种提供切换值的视图，通常用于启用或禁用选项，并且通常用于选择真或假值。开关的值通过\
  \ `IsToggled` 属性设置，当用户将 `Switch` 移动到不同位置时，会触发 `Toggled` 事件。需要注意的是，此视图没有标签，因此你需要手动添加一个。下面的示例展示了如何实现一个\
  \ `Switch`：\n\n```xml\n<StackLayout>\n    <Label Text=\"Enable notifications\"/>\n\
  \    <Switch x:Name=\"Switch1\" IsToggled=\"True\" Toggled=\"Switch1_Toggled\" Margin=\"\
  5,0,0,0\"/>\n</StackLayout>\n```\n\n用户的选择存储在 `ToggledEventArgs` 对象的实例中，你可以通过如下方式处理\
  \ `Toggled` 事件来获取它：\n\n```cs\nprivate void Switch1_Toggled(object sender, ToggledEventArgs\
  \ e)\n{\n    bool isToggled = e.Value;\n}\n```\n\n图 7.7 显示了 `Switch` 的外观：\n\n![](img/Figure-7.7.jpg)\n\
  \n**图 7.7：** 使用 Switch 开启选项\n\n你可以可选通过 `OnColor` 属性为开启时的开关选择器提供不同的颜色。\n\n# 使用 CheckBox\
  \ 进行用户选择\n\n`CheckBox` 用于启用或禁用用户的选择。与 `Switch` 一样，它没有显示文本的内置属性，因此你需要自己实现。`IsChecked`\
  \ 属性包含选择的真或假值，当用户与视图交互时，会引发 `CheckedChanged` 事件。下面的代码显示了一个示例：\n\n```xml\n<StackLayout\
  \ Orientation=\"Horizontal\">\n    <CheckBox x:Name=\"PrivacyBox\" IsChecked=\"\
  False\" Color=\"Red\" VerticalOptions=\"Center\" CheckedChanged=\"PrivacyBox_CheckedChanged\"\
  \ Margin=\"5,0,0,0\"/>\n    <Label Text=\"I have read the privacy policy\" VerticalOptions=\"\
  Center\"/>\n</StackLayout>\n```\n\n注意你如何用特定颜色设置 `Color` 属性。`CheckedChanged` 事件的处理程序将通过\
  \ `CheckedChangedEventArgs` 类接收新值的信息，其 `Value` 属性包含当前值：\n\n```cs\nprivate void PrivacyBox_CheckedChanged(object\
  \ sender, CheckedChangedEventArgs e)\n{\n    bool newValue = e.Value;\n}\n```\n\n\
  图 7.8 显示了上述代码的结果：\n\n![](img/Figure-7.8.jpg)\n\n**图 7.8：** 使用 CheckBox 实现用户选择\n\n\
  # 使用 RadioButton 进行多选\n\n`RadioButton` 是一种特殊的视图，允许在系列中实现互斥选择。为了更好地理解，在查看代码之前，请考虑图\
  \ 7.9，查看用户如何从列表中选择一个选项：\n\n![](img/Figure-7.9.jpg)\n\n**图 7.9：** 使用 RadioButton\
  \ 从列表中选择选项\n\n当你选择一个选项时，所有其他选项会被禁用。你不需要手动处理任何内容，这就是互斥的含义。下面的代码实现了图 7.9 中的用户界面：\n\
  \n```xml\n<StackLayout Spacing=\"10\" VerticalOptions=\"CenterAndExpand\">\n   \
  \ <Label Text=\"Select your age:\"/>\n    <RadioButton Content=\"0 - 15\" x:Name=\"\
  FirstAgeRangeButton\" CheckedChanged=\"FirstAgeRangeButton_CheckedChanged\" />\n\
  \    <RadioButton Content=\"16 - 40\" x:Name=\"SecondAgeRangeButton\" IsChecked=\"\
  True\" CheckedChanged=\"SecondAgeRangeButton_CheckedChanged\"/>\n    <RadioButton\
  \ Content=\"41 or more\" x:Name=\"ThirdAgeRangeButton\" CheckedChanged=\"ThirdAgeRangeButton_CheckedChanged\"\
  />\n</StackLayout>\n```\n\n`RadioButton` 视图会自动成组工作。你可以通过将 `IsChecked` 属性赋值为 `true`\
  \ 来手动选择一个，这也是你用于获取选择状态的属性。`Content` 属性的类型为 `object`，可以包含字符串（如当前示例所示），也可以包含视图。例如，你可以为\
  \ `Content` 属性分配一个图像：\n\n```xml\n<RadioButton Value=\"Option1\">\n    <RadioButton.Content>\n\
  \        <Image Source=\"Option1Image.jpg\" />\n    </RadioButton.Content>\n</RadioButton>\n\
  ```\n\n当为 `Content` 分配视图时，通过其 `Value` 属性为 `RadioButton` 分配一个字符串值也是方便的。虽然不是强制的，但这使得能够根据\
  \ `RadioButton` 的值而非显示内容进行操作。当 `RadioButton` 被选中时，会触发 `CheckedChanged` 事件。事件处理方法的存根如下所示：\n\
  \n```cs\nprivate void FirstAgeRangeButton_CheckedChanged(object sender, CheckedChangedEventArgs\
  \ e)\n{\n    // 如果 e.Value 为 true，则选择了该选项。在此处应用你的逻辑\n}\n```\n\n你检查 `CheckedChangedEventArgs`\
  \ 类中 `Value` 属性的值来获取 `RadioButton` 的状态。如果为 `true`，则已选中；否则，选择被取消。如果 `Content` 属性分配了字符串，你可以应用所有在\
  \ `Label` 中中学过的属性，如 `TextColor`、`TextTransform`、`FontFamily`、`FontSize` 和 `FontAttributes`。在\
  \ iOS 上，`BorderColor` 属性允许为整个视图绘制彩色边框。\n\n### 实现分组\n\n`RadioButton` 视图按组工作。当你添加它们时，会自动添加一个组并由运行时处理。然而，你可能需要多个组。例如，一个关于年龄的组，另一个是从列表中选择职位的组等。你有两种指定组名的方法：第一种是在\
  \ `RadioButton` 视图的父布局上添加 `RadioButton.GroupName` 附加属性；第二种是在每个 `RadioButton` 上分配\
  \ `GroupName` 属性。下面的代码演示了如何实现两个选项组（为了简单未指定名称和事件处理程序）：\n\n```xml\n<StackLayout Spacing=\"\
  10\" VerticalOptions=\"CenterAndExpand\">\n    <StackLayout RadioButton.GroupName=\"\
  Age\">\n        <Label Text=\"Select your age:\"/>\n        <RadioButton Content=\"\
  0 - 15\" />\n        <RadioButton Content=\"16 - 40\" />\n        <RadioButton Content=\"\
  41 or more\" />\n    </StackLayout>\n    <StackLayout RadioButton.GroupName=\"Job\"\
  >\n        <Label Text=\"Select your job:\"/>\n        <RadioButton Content=\"Entrepreneur\"\
  \ />\n        <RadioButton Content=\"Consultant\" />\n        <RadioButton Content=\"\
  Employee\" />\n    </StackLayout>\n</StackLayout>\n```\n\n\n\n\n\n自定义颜色完全是可选的；不过，你可以为选择器\
  \ `ThumbColor` 指定颜色，为最小侧的滑块 `MinimumTrackColor` 指定颜色，并为最大侧的滑块 `MaximumTrackColor`\
  \ 指定颜色。当选择器移动到不同的值时，会触发 `ValueChanged` 事件，新值将存储在 `ValueChangedEventArgs` 对象的 `NewValue`\
  \ 属性中。你可以在事件处理程序中如下获取它：\n\n```csharp\nprivate void Slider1_ValueChanged(object sender,\
  \ ValueChangedEventArgs e)\n{\n    double value = e.NewValue;\n    ValueLabel.Text\
  \ = $\"You selected: {value}\";\n}\n```\n\n*图 7.10* 显示了上述代码的结果：\n\n![](img/Figure-7.10.jpg)\n\
  \n**图 7.10：** 使用 Slider 选择值\n\n值得提到的是，更新 `Label` 以显示 `Slider` 值的更好方法是将 `Label` 的\
  \ `Text` 属性绑定到 `Slider` 的 `Value` 属性；然而，你将在 *第 9 章，资源与数据绑定* 中获得有关数据绑定的必要知识，因此目前直接赋值是可行。\n\
  \n# 使用 Stepper 进行增量值选择 (#toc.xhtml_s229a)\n\n`Stepper` 是一个允许通过内置 `+` 和 `–` 按钮按指定的增量增加或减少值的视图。为了更好地理解，假设你想允许用户选择年龄。可以通过\
  \ `Stepper` 实现，如下：\n\n```xml\n<StackLayout VerticalOptions=\"CenterAndExpand\" HorizontalOptions=\"\
  FillAndExpand\">\n    <Label Text=\"Select your age\"/>\n    <Stepper x:Name=\"\
  Stepper1\" Increment=\"1\" Maximum=\"95\" Minimum=\"13\" Value=\"30\" ValueChanged=\"\
  Stepper1_ValueChanged\"/>\n    <Label Text=\"You selected: \" x:Name=\"StepperValue\"\
  />\n</StackLayout>\n```\n\n`Maximum` 和 `Minimum` 属性指定了 `Stepper` 的数值限制，而 `Value`\
  \ 代表当前选择的值。最后一个 `Label` 在 `ValueChanged` 事件处理程序中更新，其代码如下：\n\n```csharp\nprivate\
  \ void Stepper1_ValueChanged(object sender, ValueChangedEventArgs e)\n{\n    double\
  \ value = e.NewValue;\n    StepperValue.Text = $\"You selected: {value}\";\n}\n\
  ```\n\n*图 7.11* 显示了上述代码的结果：\n\n![](img/Figure-7.11.jpg)\n\n**图 7.11：** 使用 Stepper\
  \ 选择值\n\n# 实现搜索功能 (#toc.xhtml_s230a)\n\n`Xamarin.Forms` 允许你通过 `SearchBar` 视图在应用中快速实现搜索功能。它显示系统搜索框，其中包含系统搜索图标，用户点击图标即可开始搜索。值得注意的是，`SearchBar`\
  \ 提供了搜索的用户界面，但处理搜索结果的逻辑完全依赖于你的工作。例如，你可以根据输入的搜索术语使用 LINQ 查询过滤元素列表，或者你可以重绘用户界面以仅显示符合搜索标准的视觉元素。你可以如下声明声明\
  \ `SearchBar`：\n\n```xml\n<SearchBar x:Name=\"SearchBar1\" Placeholder=\"Enter you\
  \ search key...\" SearchButtonPressed=\"SearchBar1_SearchButtonPressed\" TextChanged=\"\
  SearchBar1_TextChanged\" />\n```\n\n当用户点击搜索图标时，会触发 `SearchButtonPressed` 事件，而每次按键时都会触发\
  \ `TextChanged`。你用于搜索的逻辑应该在 `SearchButtonPressed` 触发时进行处理，并由以下处理程序存根进行处理：\n\n```csharp\n\
  private void SearchBar1_SearchButtonPressed(object sender, EventArgs e)\n{\n   \
  \ // 根据 SearchBar 的 Text 属性实现逻辑...\n}\n```\n\n*图 7.12* 显示了上述代码的结果：\n\n![](img/Figure-7.12.jpg)\n\
  \n**图 7.12：** 实现搜索功能\n\n**提示：在后台，`SearchBar` 是一个进化的 `Entry`。这意味着你可以像之前描述 `Entry`\
  \ 视图那样管理所有与文本相关的属性，包括字体管理和文本转换。**\n\n在自定义方面，你可以分配 `PlaceholderColor`、`TextColor`、`BackgroundColor`\
  \ 和 `CancelButtonColor` 属性来更改占位符、搜索文本、搜索栏背景以及输入时显示的 `Cancel` 按钮的颜色。\n\n# 处理长时间任务\
  \ (#toc.xhtml_s231a)\n\n某些操作可能会持续很长时间，你无法准确预测它们将持续多久。例如，从互联网下载数据、调用 Web API、对数据库进行复杂查询。在这种情况下，最佳实践是通知用户正在进行可能耗时长的操作，这样当应用中没有任何反应时，他们就不会感到意外。`ActivityIndicator`\
  \ 视图显示了正在进行的操作。声明并启用 `ActivityIndicator` 非常简单，如下：\n\n```xml\n<ActivityIndicator\
  \ x:Name=\"Indicator1\" IsVisible=\"true\" Running=\"true\" />\n```\n\n实际上，当你分配\
  \ `Running` 属性时，旋转器就开始运行，但你可能也想为了一致性设置可见性（`IsVisible`）。你需要在代码中停止指示器，例如如下：\n\n```csharp\n\
  private void DisableIndicator()\n{\n    Indicator1.Running = false;\n    Indicator1.IsVisible\
  \ = false;\n}\n```\n\n当长时间任务完成后，你会调用它。*图 7.13* 显示了进度外观：\n\n![](img/Figure-7.13.jpg)\n\
  \n**图 7.13：** 等待长时间任务\n\n旋转器的外观基于系统颜色，但你可以通过分配 `Color` 属性来指定不同的颜色。\n\n**提示：页面对象（包括\
  \ `ContentPage`）暴露了 `IsBusy` 属性。运行时将在设备状态栏显示活动指示器。你可能也会考虑此选项，例如对于不影响用户界面的后台任务。**\n\
  \n# 显示图像 (#toc.xhtml_s232a)\n\n移动应用开发者，你的目标之一是创建漂亮且吸引人的应用。为了这个目的，你经常包含媒体内容，如图像、视频和音频。媒体将在*第\
  \ 10 章，画刷、形状与媒体* 中讨论；本章介绍了如何显示图像。图像在任何移动应用中都很常见，使用它们的理由有很多。Xamarin.Forms 暴露了一个名为\
  \ `Image` 的视图，允许显示本地和远程图像。支持的格式有 `.jpg`、`.png`、`.gif`（动态 GIF）和 `.tif`。要显示的图像路径分配给\
  \ `Source` 属性。例如，以下代码从远程 URL 显示一张免费图片（`Aspect` 属性将在下一节 *处理横比例* 中进行详细说明）：\n\n```xml\n\
  <Image Source=\"https://images.freeimages.com/images/large-previews/72c/fox-1522156.jpg\"\
  \ Aspect=\"AspectFit\"/>\n```\n\n*图 7.14* 显示了此 XAML 的结果。在这种情况下，图片是用户界面的唯一元素，并位于屏幕中心，但在你的应用程序中，你无疑会显示不同布局的图像：\n\
  \n\n\n\n\n![](img/Figure-7.14.jpg)\n\n**图 7.14:** 显示图像\n\n`Source` 属性的类型为 `ImageSource`。它可以接收\
  \ URL、本地文件的文件名或存储在应用程序资源中的图像地址。分配文件名非常简单，如下例所示：\n\n```xml\n<Image Source=\"SampleImage.jpg\"\
  \ Aspect=\"AspectFit\"/>\n```\n\n`Xamarin.Forms` 会在每个平台项目的资源中搜索图像文件，这意味着它会搜索 Xamarin.iOS\
  \ 项目的 `Resources` 文件夹以及 Xamarin.Android 项目中 `Resources` 文件夹下的 `mipmap` 子文件夹。正如你在*管理图像文件*\
  \ 节中所学习到的那样，必须提供不同分辨率的相同图像以满足多个屏幕因素，运行时将解析最合适的一个。在 C# 中分配 `Source` 属性也是很常见的，例如，当你需要根据上下文显示不同的图像时。你可以通过调用\
  \ `ImageSource` 类中的静态方法来实现，如下所示：\n\n```csharp\nImage1.Source = ImageSource.FromUri(new\
  \ Uri(\"https://mysite.com/myimage.jpg\"));\nImage1.Source = ImageSource.FromFile(\"\
  MyImage.jpg\");\nImage1.Source = ImageSource.FromResource(\"ProjectName.Folder.ImageFileName.jpg\"\
  );\n```\n\n`FromUri` 方法将远程图像分配为源，你在上一个示例中已经看到了这一点。`FromFile` 方法将本地图像文件分配为源。`FromResource`\
  \ 方法将嵌入资源分配为视图的源。为了将图像作为嵌入资源包含，你需要遵循以下步骤：\n\n1. 将图像文件添加到共享项目中。你完全可以将文件复制到子文件夹中。\n\
  2. 将其 `Build Action` 属性设置为 `EmbeddedResource`。\n3. 在之前代码的第三行中，将 `ProjectName` 替换为你的项目名称，将\
  \ `Folder` 替换为你拷贝图像文件的子文件夹名称（可选），以及文件名。\n\n**将图像嵌入到应用程序资源中可以避免在多个地方和多个项目中多次管理图像文件，但这会增加应用程序包的大小。这种技术应仅限于严格的情况。**\n\
  \n在 XAML 中使用嵌入资源分配 `Image.Source` 属性是非常困难的，除非你对 Xamarin 中的 XAML 和资源有深厚的知识，而你现在可能还没有。因此，最好且最简单的方法是在\
  \ C# 中使用 `ImageSource.FromResource` 方法。\n\n# 处理比例\n\n`Aspect` 属性指定了图像在其所占空间内的大小和拉伸方式。你可以分配\
  \ `Aspect` 枚举中的一个值：\n\n* `Fill`: 图像被拉伸以完全精确地填充显示区域。\n* `AspectFill`: 图像被裁剪以填充显示区域，同时保持原始比例。\n\
  * `AspectFit`: 使整个图像适应显示区域。如果图像不够宽或不够高，则会在侧边添加一些空白空间。\n\n也可以通过 `WidthRequest` 和\
  \ `HeightRequest` 属性调整图像的宽度高度。\n\n### 管理图像文件\n\n将图像作为本地文件添加是特定于平台的，因此 iOS 和 Android\
  \ 的行为不同。在 iOS 上，必须提供三种不同分辨率的相同图像。假设你有一个名为 `MyImage.png` 的图像文件，你需要以下文件：`MyImage.png`、`MyImage@2x.png`\
  \ 和 `MyImage@3x.png`。在现实世界中，将图像导出为所需的文件格式是专业设计师的职责（讨论可以执行此操作的设计工具不在本书的范围内），因此你不需要担心自己生成它们。能够将图像导出为\
  \ iOS 和 Android 资源的工具示例是 Adobe XD 和 Figma (https://www.figma.com)。文件必须复制到 Xamarin.iOS\
  \ 的 `Resources` 文件夹中。Visual Studio 应自动将每个文件的 `Build Action` 属性设置为 `BundleResource`，但请确保双检查此项。对于\
  \ Android，你需要六种不同的分辨率。如果你在 Visual Studio 中展开 Xamarin.Android 项目的 `Resources` 文件夹，你会看到以下子文件夹：\n\
  \n* mipmap-anydpi-v26\n* mipmap-hdpi\n* mipmap-mdpi\n* mipmap-xhdpi\n* mipmap-xxhdpi\n\
  * mipmap-xxxhdpi\n\n你的设计师将提供适当分辨率的文件，你需要按照提到的顺序，从低到高将其复制到上述子文件夹中。顺便提一下，微软文档有一个关于在\
  \ Xamarin.Forms 解决方案中管理图像的页面，建议阅读：https://docs.microsoft.com/en-us/xamarin/xamarin-forms/user-interface/images。\n\
  \n### 为视图添加交互性\n\n`Xamarin.Forms` 中的并非所有视图都原生支持用户交互。例如，你无法点击 `Label`，但有时你可能想在它开始之前请求用户确认。\n\
  \n### 实现手势识别器\n\n不支持直接的视图（例如所有的布局或 `Image`）暴露了类型为 `IList<GestureRecognizer>` 的 `GestureRecognizers`\
  \ 属性。`GestureRecognizer` 对象是以下手势识别器的基类：\n\n* `TapGestureRecognizer`: 为视图添加点击功能。\n\
  * `PinchGestureRecognizer`: 添加对检测手指移动的支持。\n* `PanGestureRecognizer`: 添加对拖拽对象的支持。\n\
  * `SwipeGestureRecognizer`: 为视图添加点击功能。\n* `DragGestureRecognizer`: 添加对双指缩放的支持。\n\
  \n作为一名关注通用代码的 Xamarin 求职者，你真正需要知道的是 `TapGestureRecognizer`，它无疑是真实世界应用中最常用的手势。虽然其他手势也很有用，但它们的使用频率较低，并且在大多数情况下，有新添加的视图实现了相同的手势（例如\
  \ `SwipeView`）。以下代码显示了如何使用 `TapGestureRecognizer` 为 `Label` 添加点击支持：\n\n```xml\n\
  <Label Text=\"Tap Here!\" HorizontalOptions=\"CenterAndExpand\" VerticalOptions=\"\
  CenterAndExpand\">\n    <Label.GestureRecognizers>\n        <TapGestureRecognizer\
  \ x:Name=\"LabelTap\" NumberTapsRequired=\"1\" Tapped=\"LabelTap_Tapped\"/>\n  \
  \  </Label.GestureRecognizers>\n</Label>\n```\n\n`NumberOfTapsRequired` 属性允许你指定启用交互需要多少次点击，而\
  \ `Tapped` 事件在用户点击视图时触发。事件处理程序如下：\n\n```csharp\nprivate void LabelTap_Tapped(object\
  \ sender, EventArgs e)\n{\n    // Label 被点击了\n}\n```\n\n如果你想了解更多关于其他手势识别器的信息，文档有一个专门的页面：https://docs.microsoft.com/en-us/xamarin/xamarin-forms/app-fundamentals/gestures。在书中，你将找到有关特定视图的详细信息，你可以以更结构化的方式来实现相同的手势。\n\
  \n### 显示和处理警报\n\n警报是小型系统对话框，用于向用户发送消息，并在执行需要注意的操作之前请求用户确认。在 `Xamarin.Forms` 中，每个\
  \ Page 对象都暴露了一个名为 `DisplayAlert` 的异步方法，你可以调用它来实现此目的。以下代码显示了如何在点击按钮时显示单向警报：\n\n\n\
  \n\n\n```csharp\nprivate async void Button1_Clicked(object sender, EventArgs e)\n\
  {\n    await DisplayAlert(\"Warning\", \"The battery level is low\", \"OK\");\n\
  }\n```\n\n该方法的第一个参数是对话框的标题，第二个参数是内容，第三个参数是显示的唯一按钮文本。此外，可以使用 `DisplayAlert` 的重载方法来接受用户输入。下面的代码演示了这一点：\n\
  \n```csharp\nbool result = await DisplayAlert(\"Warning\", \"Do you wish to continue?\"\
  , \"OK\", \"Cancel\");\n```\n\n方法的第三和第四个参数代表确认和取消选项，你可以为它们添加任何喜欢的文本。如果用户选择确认选项，`DisplayAlert`\
  \ 返回 true；否则返回 false。*图 7.15* 显示了代码的结果：\n\n![](img/Figure-7.15.jpg)\n\n**图 7.15:**\
  \ 显示警报框\n\n### 理解视觉状态\n\n视图具有描述其当前状态的状态。例如，视图可以拥有 `Normal`（正常）状态、`Disabled`（禁用）状态或\
  \ `Focused`（聚焦）状态。你可以在 C# 代码中通过实现逻辑根据其状态更改视图的外观，也可以利用名为“视觉状态管理器”（Visual State Manager）的功能。该功能允许你完全在\
  \ XAML 中根据视图的状态更改其外观。例如，你可以根据状态更改视图的某些颜色。接下来的 XAML 显示了如何根据状态更改 `Entry` 的背景颜色：\n\n\
  ```xml\n<Entry VerticalOptions=\"Center\" HorizontalOptions=\"FillAndExpand\" Placeholder=\"\
  Enter some text here...\">\n  <VisualStateManager.VisualStateGroups>\n    <VisualStateGroup\
  \ x:Name=\"CommonStates\">\n      <VisualState x:Name=\"Normal\">\n        <VisualState.Setters>\n\
  \          <Setter Property=\"BackgroundColor\" Value=\"White\" />\n        </VisualState.Setters>\n\
  \      </VisualState>\n      <VisualState x:Name=\"Focused\">\n        <VisualState.Setters>\n\
  \          <Setter Property=\"BackgroundColor\" Value=\"LightBlue\" />\n       \
  \ </VisualState.Setters>\n      </VisualState>\n      <VisualState x:Name=\"Disabled\"\
  >\n        <VisualState.Setters>\n          <Setter Property=\"BackgroundColor\"\
  \ Value=\"Gray\" />\n        </VisualState.Setters>\n      </VisualState>\n    </VisualStateGroup>\n\
  \  </VisualStateManager.VisualStateGroups>\n</Entry>\n```\n\n`VisualStateManager`\
  \ 对象暴露了一个 `VisualStateGroups` 集合，你在其中放置一个根对象，该对象包含与你想表示的状态数量相等的 `VisualState` 对象。对于每个\
  \ `VisualState`，你指定一个 `VisualState.Setters` 组，在其中你根据特定状态更改感兴趣的属性值。在这个示例中，代码仅设置了\
  \ `BackgroundColor` 属性，这是通过名为 `Setter` 的对象完成的，该对象接收属性名及其新值。*图 7.16* 从左到右显示了 `Entry`\
  \ 根据状态的外。对于 `Disabled` 状态，你通常根据自己的逻辑启用或禁用视图，但对于当前的示例，你可以显式地将 `IsEnabled` 属性赋值为 false：\n\
  \n![](img/Figure-7.16.jpg)\n\n**图 7.16:** 管理视觉状态：正常、聚焦、禁用\n\n`Normal`、`Disabled`、`Focused`\
  \ 和 `Selected` 状态是 `Xamarin.Forms` 中每个视图共同拥。*表 7.5* 中列出的视图还有一些特定的状态可用：\n\n| 视图 |\
  \ 特定视觉状态 |\n| :--- | :--- |\n| `Button` | `Pressed` |\n| `CheckBox` | `IsChecked`\
  \ |\n| `CarouselView` | `DefaultItem`, `NextItem`, `PreviousItem`, `CurrentItem`。（`CarouselView`\
  \ 在第 9 章，资源与数据绑定 中讨论）。 |\n| `ImageButton` | `Pressed` |\n| `RadioButton` | `Checked`\
  \ 和 `Unchecked` |\n| `Switch` | `On` 和 `Off` |\n\n**表 7.5:** 特定视觉状态\n\n视觉状态管理器对开发者来说确实有用，但它真正的威力在于允许专业设计师完全在声明式代码中处理视觉状态，而无需实现\
  \ C# 逻辑。\n\n### 结论\n\n视图是用户界面的构建块，你通过实现它们为应用程序添加功能。本章描述了所谓的常用视图和原始控件，这些控件允许最常见的用户交互和输入，例如显示和输入文本、处理日期和时间、选择值以及使用图像丰富\
  \ UI。你已经看到了视图在单个页面内的工作，但在现实世界中，这显然不是移动应用程序的工作方式。下一章将描述用户界面实现的另一个重要部分，即页面之间的导航。\n\
  \n### 关键术语\n\n*   **视图 (View)**：实现的单个原始控件。\n*   **字体 (Typeface)**：大小、粗细、样式。\n* \
  \  **内容页 (Content Page)**：表示单个页面的。\n*   **手势识别器 (Gesture recognizer)**：识别手指动作的对象。\n\
  *   **视觉状态 (Visual state)**：视图的状态。\n\n### 建议阅读\n\nMicrosoft 官方 Xamarin.Forms (https://docs.microsoft.com/en-us/xamarin/xamarin-forms/user-interface)。\n\
  \n# 第 8 章\n\n# 页面与导航\n\n### 介绍\n\n到目前为止，你已经看到了如何在单个空白页面内实现布局和视图。然而，移动应用程序依赖不同的页面。本章解释了\
  \ `Xamarin.Forms` 中提供的页面类型，并解释了如何在页面之间导航，包括 Shell。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n*   介绍可用页面\n*   页面导航\n*   常用应用功能：Shell\n\n### 目标\n\n完成本章后，你将完全掌握 `Xamarin.Forms`\
  \ 中用户界面构建块的知识，并能够根据业务需求实现适当页面和导航结构。这将为你理解后续章节中描述的概念奠定基础。\n\n### 介绍可用页面\n\n移动应用程序可以有侧边菜单和导航栏，内容可能组织在标签中。为了获得最佳用户体验，`Xamarin.Forms`\
  \ 许多页面，以跨平台的方法表示原生应用如何显示内容。在代码方面，所有可用页面都继承自 `Page` 抽象类，每个页面都是视觉树中的根元素。`ContentPage`\
  \ 是你目前为止用于表示单个空白页面的，但 `Xamarin.Forms` 中共有五种页面，如*表 8.1*所示：\n\n| 页面类型 |  |\n| :---\
  \ | :--- |\n| `ContentPage` | 表示单个页面。 |\n| `FlyoutPage` | 表示具有主从详情视图的页面。 |\n| `TabbedPage`\
  \ | 通过标签组多个 `ContentPage` 页面。 |\n| `CarouselPage` | 允许在 `ContentPage` 对象之间滑动切换。\
  \ |\n| `NavigationPage` | 实现页面之间导航的基础设施。 |\n\n**表 8.1:** Xamarin.Forms 中的页面类型\n\n\
  \n\n\n通常情况下，每个页面只能包含一个根视觉元素，通常上是一个布局，然后基于子布局通过更复杂的用户界面实现来对其阐述。本节描述了可用的页面类型，并解释了在何时使用它们是最好的。\n\
  \n### 独立页面：ContentPage\n\n在上一个章节中，你已经多次使用了 `ContentPage`。此页面不仅可以作为一个独立页面工作，还可以作为其他页面的子元素，正如在本章中看到的那样。因此，强调它的\
  \ `Title` 属性非常重要，它用于识别父页面（如 `TabbedPage` 或 `CarouselPage`）中的当前活动页面。此外，知道 `Content`\
  \ 标签可以省略也是很有用的。基于此，以下代码是完全合法的（同样请注意 `Title` 属性的声明）：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\nxmlns:local=\"clr-namespace:IntroducingPages\"\
  \nTitle=\"Main page\"\nx:Class=\" IntroducingPages.MainPage\">\n<Label Text=\"A\
  \ content page with title\"/>\n</ContentPage>\n```\n\n`ContentPage` 可以单独使用，也可以作为后续章节中讨论的其他页面的内容。\n\
  \n### 主详情视图：FlyoutPage\n\n你一定用过实现侧边菜单的移动应用程序，该侧边菜单通常位于屏幕左侧，你可以通过滑动手势打开或关闭，并允许从多个选项中选择一个项目；当你选择一个项目时，屏幕右侧会显示特定的内容。这种用户界面被称为主详情（master-details）。在\
  \ `Xamarin.Forms` 的之前的版本中，可以使用一个名为 `MasterDetailPage` 的页面，但后来它被废弃了，取而代之的是一个名为 `FlyoutPage`\
  \ 的新页面。这允许从术语开始以更现代的方式实现主详情视图。事实上，flyout（飞出菜单）是用户可以显示或隐藏的侧边菜单。为了更好地理解，请参考图 8.1，你可以在那里看到飞出菜单：\n\
  \n![](img/Figure-8.1.jpg)\n\n**图 8.1：** FlyoutPage 中的 flyout\n\n图 8.2 向你展示了细节：\n\
  \n![](img/Figure-8.2.jpg)\n\n**图 8.2：** FlyoutPage 中的细节\n\n在两张图中，你都可以看到一个基于 flyout\
  \ 中项目列表的示例，详情内容根据选择而变化。以下代码演示了如何复制你在图中看到的结果，它也代表了 flyout 背后的思想：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\" ?>\n<FlyoutPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\nx:Class=\"IntroducingPages.FlyoutPageSample\"\
  >\n<FlyoutPage.Flyout>\n<ContentPage Title=\"Main page\" BackgroundColor=\"LightSalmon\"\
  >\n<StackLayout Spacing=\"10\" Margin=\"0,20,0,0\">\n<Label Text=\"Select an item:\"\
  \ FontSize=\"Title\"\nMargin=\"20,0,0,0\" FontAttributes=\"Bold\"\nHorizontalOptions=\"\
  Start\"/>\n<Label Text=\"First item\" x:Name=\"Item1\" Margin=\"20,0,0,0\"\nFontAttributes=\"\
  Bold\">\n<Label.GestureRecognizers>\n<TapGestureRecognizer x:Name=\"Item1Tapped\"\
  \nTapped=\"Item1Tapped_Tapped\"/>\n</Label.GestureRecognizers>\n</Label>\n<Label\
  \ Text=\"Second item\" x:Name=\"Item2\" Margin=\"20,0,0,0\"\nFontAttributes=\"Bold\"\
  >\n<Label.GestureRecognizers>\n<TapGestureRecognizer x:Name=\"Item2Tapped\"\nTapped=\"\
  Item2Tapped_Tapped\"/>\n</Label.GestureRecognizers>\n</Label>\n</StackLayout>\n\
  </ContentPage>\n</FlyoutPage.Flyout>\n<FlyoutPage.Detail>\n<ContentPage BackgroundColor=\"\
  LightYellow\">\n<StackLayout VerticalOptions=\"Center\" HorizontalOptions=\"Start\"\
  >\n<Label Margin=\"20,0,0,0\"\nText=\"You have selected the first item\"\nx:Name=\"\
  Item1Details\"/>\n<Label Margin=\"20,0,0,0\"\nText=\"You have selected the second\
  \ item\" x:Name=\"Item2Details\"\nIsVisible=\"False\"/>\n</StackLayout>\n</ContentPage>\n\
  </FlyoutPage.Detail>\n</FlyoutPage>\n```\n\n以下关于 `FlyoutPage` 和上述代码的相关要点：\n\n* `FlyoutPage.Flyout`\
  \ 对象允许你实现 flyout。\n* `Flyout` 的内容通常是 `ContentPage`，但这不是规定；它可以是任何派自 `Page` 的对象。\n\
  * 当用户打开 flyout 时，`FlyoutPage` 的 `IsPresented` 属性被设置为 true。当它隐藏时，`IsPresented` 被设置为\
  \ false。\n* 事实上，flyout 是用户可以显示或隐藏的侧边菜单。为了更好地理解，请参考图 8.1，你可以在那里看到 flyout：\n\n![](img/Figure-8.1.jpg)\n\
  \n**图 8.1：** FlyoutPage 中的 flyout\n\n图 8.2 向你展示了细节：\n\n![](img/Figure-8.2.jpg)\n\
  \n**图 8.2：** FlyoutPage 中的细节\n\n在两张图中，你都可以看到一个基于 flyout 中项目列表的示例，详情内容根据选择而变化。以下代码演示了如何复制你在图中看到的结果，它也代表了\
  \ flyout 背后的思想：\n\n（此处省略重复代码块说明，保持逻辑一致）\n\n### 在标签页内组织内容：TabbedPage\n\n`Xamarin.Forms`\
  \ 提供了一种简单的方法在标签页内组织内容，它由 `TabbedPage` 对象表示。`TabbedPage` 允许你实现多个标签页，每个标签页包含一个 `ContentPage`\
  \ 以实现更简单的导航。图 8.3 显示了 `TabbedPage` 的示例：\n\n![](img/Figure-8.3.jpg)\n\n**图 8.3：**\
  \ 在 TabbedPage 内组织内容\n\n\n\n\n`TabbedPage` 可以被视为 `Page` 对象的容器，可以通过选择标签（tab）来访问其中的每一个对象。如果你查看*[图\
  \ 8.3*，你可以看到标签是如何根据目标系统的设计指南渲染的，这意味着在 Android 设备上位于顶部，在 iOS 设备上位于底部。好消息是，你不需要处理标签之间的导航，因为这是一个内置功能。你只需要提供内容页。下面的代码演示了如何构建*图\
  \ 8.3*中所示的用户界面：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<TabbedPage\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\n            xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \n            x:Class=\"IntroducingPages.TabbedPageSample\">\n    <TabbedPage.Children>\n\
  \        <ContentPage Title=\"First\">\n            <Label Text=\"This is the first\
  \ page\" HorizontalOptions=\"Center\" VerticalOptions=\"Center\"/>\n        </ContentPage>\n\
  \        <ContentPage Title=\"Second\">\n            <Label Text=\"This is the second\
  \ page\" HorizontalOptions=\"Center\" VerticalOptions=\"Center\"/>\n        </ContentPage>\n\
  \        <ContentPage Title=\"Third\">\n            <Label Text=\"This is the third\
  \ page\" HorizontalOptions=\"Center\" VerticalOptions=\"Center\"/>\n        </ContentPage>\n\
  \    </TabbedPage.Children>\n</TabbedPage>\n```\n\n这里有两个关键点需要强调：\n\n*   `TabbedPage.Children`\
  \ 集合必须填充 `Page` 对象，在本例中即为 `ContentPage` 对象。\n*   每个 `ContentPage` 必须指定 `Title` 属性，该属性也是显示在相应标签上的文本。\n\
  \n你可以添加的标签数量没有限制，但建议不要超过三个或四个，特别是如果你的应用程序运行在较小的屏幕上（如手机）。\n\n# 滚动页面](#toc.xhtml_s249a\n\
  \n移动应用用户体验中最常见的手势之一是通过称为 `swiping`（滑动）的动作来滚动内容。例如，滑动浏览图片库。在 `Xamarin.Forms` 中，某些视图允许其子内容进行滑动，但你也可以使用\
  \ `CarouselPage` 对象来实现页面滑动。为了更好地理解，请考虑*图 8.4*所示的示例：\n\n![](img/Figure-8.4.jpg)\n\
  \n**图 8.4：** 使用 CarouselPage 滑动内容\n\n*图 8.4*中的示例展示了正在滑动的 `CarouselPage`。当滑动手势完成后，选中的\
  \ `ContentPage` 将获得焦点。你可以向左向右滑动。声明 `CarouselPage` 的方法和你看到 `TabbedPage` 时一样。事实上，你仍然需要用\
  \ `ContentPage` 对象填充 `Children` 集合。下面的代码演示了如何生成上述示例：\n\n```xml\n<CarouselPage xmlns=\"\
  http://xamarin.com/schemas/2014/forms\"\n              xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \n              x:Class=\"IntroducingPages.CarouselPageSample\">\n    <CarouselPage.Children>\n\
  \        <ContentPage Title=\"Pizza\">\n            <StackLayout VerticalOptions=\"\
  CenterAndExpand\">\n                <Image Source=\"pizza.png\"/>\n            \
  \    <Label Text=\"Order your pizza\" HorizontalOptions=\"Center\" VerticalOptions=\"\
  Center\"/>\n            </StackLayout>\n        </ContentPage>\n        <ContentPage\
  \ Title=\"Ice cream\">\n            <StackLayout VerticalOptions=\"CenterAndExpand\"\
  >\n                <Image Source=\"icecream.png\" />\n                <Label Text=\"\
  Order an ice cream\" HorizontalOptions=\"Center\" VerticalOptions=\"Center\"/>\n\
  \            </StackLayout>\n        </ContentPage>\n        <ContentPage Title=\"\
  Seafood\">\n            <StackLayout VerticalOptions=\"CenterAndExpand\">\n    \
  \            <Image Source=\"seafood.png\" />\n                <Label Text=\"Order\
  \ some seafood\" HorizontalOptions=\"Center\" VerticalOptions=\"Center\"/>\n   \
  \         </StackLayout>\n        </ContentPage>\n    </CarouselPage.Children>\n\
  </CarouselPage>\n```\n\n**提示：** 示例代码中使用的图像可以在配套解决方案的原生项目的 `Resources` 文件夹下找到。\n\n\
  然后你可以根据用户界面的结构在 C# 中添加操作并处理事件；例如，添加按钮或手势识别器。\n\n# 页面间的导航](#toc.xhtml_s250a\n\n通常情况下，移动应用程序基于多个页面的，每个页面提供特定的内容。通常来说，这是通过实现页面导航来实现的。`Xamarin.Forms`\
  \ 通过内置的导航框架轻松地实现页面导航，该框架在最高层由一个名为 `NavigationPage` 的特殊页面暴露。`Xamarin.Forms` 的导航框架包含一个页面栈；当打开新页面时，它会被添加到栈中；当它被关闭时，它会被从栈中移除，遵循“后进先出”\
  \ (`LIFO`) 的方法。\n\n\n\n\n\n```csharp\npublic SecondaryPage()\n{\n    InitializeComponent();\n\
  }\n\nprivate int receivedNumber;\npublic SecondaryPage(int oneNumber)\n{\n    InitializeComponent();\n\
  \    receivedNumber = oneNumber;\n}\n```\n\n通过这种方法，你可以通过传递数字或不传递任何内容来调用该页面。如果你实现了一个重载构造函数来接收数据，请记住始终添加\
  \ `InitializeComponent` 的调用，并且必须在任何其他代码之前调用。第二种方案是仅添加一个接收数据的构造函数，这意味着前面的代码将如下：\n\
  \n```csharp\npublic partial class SecondaryPage : ContentPage\n{\n    private int\
  \ receivedNumber;\n    public SecondaryPage(int oneNumber)\n    {\n        InitializeComponent();\n\
  \        receivedNumber = oneNumber;\n    }\n}\n```\n\n如果目标页面必须接收数据，这种方法是很好。对于这两种方案，你都可以在\
  \ `PushAsync`（或 `PushModalAsync`）调用中传递数据，如下：\n\n```csharp\nawait Navigation.PushAsync(new\
  \ SecondaryPage(1000));\n```\n\n在这行代码中，1000 是一个整数，它也是页面构造函数所需的类型。在你的场景中，你将根据构造函数的实现来传递适当的对象。\n\
  \n### 实现自定义标题\n\n当你为封装在 `NavigationPage` 的页面分配 `Title` 属性时，导航栏也将显示标题文本。你可以通过向页面添加\
  \ `NavigationPage.TitleView` 附加属性来自定义标题，使用视图而不是显示文本。以下代码显示了一个示例：\n\n```xml\n<ContentPage\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \nx:Class=\"IntroducingPages.SecondaryPage\">\n  <NavigationPage.TitleView>\n  \
  \  <StackLayout Orientation=\"Horizontal\">\n      <Image Source=\"icon.png\"/>\n\
  \      <Label Text=\"Page title\" />\n    </StackLayout>\n  </NavigationPage.TitleView>\n\
  </ContentPage>\n```\n\n在示例中，标题是由包含图像和一些文本的布局组成的。\n\n### 理解页面生命周期\n\n面的生命周期依赖于以下两个事件：\n\
  \n- `OnAppearing`：在页面渲染之前触发。\n- `OnDisappearing`：当页面从导航栈中移除时触发。\n\n它们由任何派自于 `Page`\
  \ 的对象暴露，不需要显式声明，除非你想在这些特定时刻实现自定义操作。如果是这样，它们基础代码如下：\n\n```csharp\nprotected override\
  \ void OnAppearing()\n{\n    // 替换为你的代码…\n    base.OnAppearing();\n}\n\nprotected\
  \ override void OnDisappearing()\n{\n    // 替换为你的代码…\n    base.OnDisappearing();\n\
  }\n```\n\n**提示：IntelliSense 在这里非常有帮助。只需输入 `override`，然后选择两个方法名之一并按 Tab 键。代码编辑器将生成必要的基础代码。**\n\
  \n该流程可以总结如下：\n\n- 当首次打开页面时，会调用构造函数并触发 `OnAppearing`。\n- 当通过导航打开另一个页面时，当前页面会触发 `OnDisappearing`，但当前页面的实例不会被销毁也不会从栈中移除。\n\
  - 当通过导航打开的页面通过调用 `PopAsync` 或 `PopModalAsync` 关闭时，会触发 `OnDisappearing`，并且页面实例将从栈中移除。\n\
  - 当导航返回第一个页面时，构造函数不会被调用，因为实例没有从栈中移除，但会再次触发 `OnAppearing`。\n\n因此，你可以利用 `OnAppearing`\
  \ 编写希望在每次打开页面时都执行的代码，而在构造函数中，你可以编写只执行一次的代码。在 `OnDisappearing` 中，你可以编写在每次离开当前页面时执行的代码，无论是因为它被关闭还是因为你正在导航到不同的页面。\n\
  \n### 拦截物理返回键\n\nAndroid 设备具有物理 `Back` 键，它可以简化应用之间或应用功能之间的导航。与导航栏上的软件返回键不同，物理 `Back`\
  \ 键默认会挂起当前应用程序。但你可能希望用户在按下物理返回键时返回上一个页面。为了实现这一点，你可以如下所示处理 `OnBackButtonPressed`\
  \ 事件：\n\n```csharp\nprotected override bool OnBackButtonPressed()\n{\n    return\
  \ base.OnBackButtonPressed(); // 在此处替换为你的逻辑\n}\n```\n\n`base.OnBackButtonPressed`\
  \ 方法调用默认行为，因此你可以对其如下更改：\n\n```csharp\nprotected override async bool OnBackButtonPressed()\n\
  {\n    await Navigation.PopAsync();\n    return true;\n}\n```\n\n当你实现自定义逻辑时，该方法应返回\
  \ `true`，这意味着返回键已被处理。此外，请注意该方法标记了 `async` 操作符，因为它调用了 `PopAsync`。\n\n### 通用功能：Shell\n\
  \nShell 是一个特殊的根节点，它简化了实现移动应用常用功能的方式，例如抽屉菜单（flyout menu）、搜索栏和导航栏。Shell 最大的好处是所有这些功能都在一个地方实现，而不需要自己完成所有工作。\n\
  \n\n\n\n\n*   **飞出菜单 (Flyout menu)**：这与通过 `FlyoutPage` 获取的效果类似，但它位于同一个根布局中。因此，它支持滑动，通常用于提供指向其他内容的快捷方式。图\
  \ 8.8 显示了一个示例：\n\n    ![](img/Figure-8.8.jpg)\n\n    **图 8.8：** 实现飞出菜单\n\n*   **搜索栏**：这实现了一个搜索内容的用户界面，你可以对其进行处理以显示搜索结果。\n\
  \n这些视觉元素之间没有相互关系，因此你没有强制实现所有元素。此外，它们支持样式，以便你可以完全更改 `shell` 项目的外观，正如将在本章的最后一节中看到的。在接下来的段落中，你将学习如何实现列出的所有项目。你将首先学习如何单独实现飞出菜单和标签栏（tab\
  \ bar），然后将学习如何使用简化的语法同时实现两者。\n\n### 添加飞出菜单\n\n在 `Shell` 中添加飞出菜单非常简单。事实上，对于你想要添加到飞出菜单的每个项目，你都在\
  \ `Shell` 根节点下声明一个 `FlyoutItem` 类型的对象。要实现这一点，请在 Visual Studio 中打开 `AppShell.xaml`\
  \ 文件。现在，假设你想创建一个带有三个页面快捷方式的飞出菜单。以下代码演示了这一点：\n\n```xml\n<Shell ... >\n<FlyoutItem\
  \ Title=\"Home\" Icon=\"home.png\">\n  <ShellContent ContentTemplate=\"{DataTemplate\
  \ pages:HomePage}\"/>\n</FlyoutItem>\n<FlyoutItem Title=\"About\" Icon=\"about.png\"\
  >\n  <ShellContent ContentTemplate=\"{DataTemplate pages:AboutPage}\"/>\n</FlyoutItem>\n\
  <FlyoutItem Title=\"Contact\" Icon=\"contact.png\">\n  <ShellContent ContentTemplate=\"\
  {DataTemplate pages:ContactPage}\"/>\n</FlyoutItem>\n</Shell>\n```\n\n每个 `FlyoutItem`\
  \ 对象的 `Title` 和 `Icon` 属性分别代表菜单中显示的文本和图标。图标遵循上一章中关于图像的相同规则。每个 `FlyoutItem` 的内容是一个\
  \ `ShellContent` 类型的对象，它允许导航到不同的页面，但仍然在 `Shell` 内部。指定目标页面的语法是将 `ContentTemplate`\
  \ 属性分配一个名为 `DataTemplate` 的特殊对象。数据模板是下一章涵盖的主题之一，所以现在只需记住这种语法即可。图 8.8 显示了此代码的结果。表\
  \ 8.3 总结了你可以分配以自定义飞出菜单外观和行为的其他有趣属性。\n\n| 属性 |  |\n| :--- | :--- |\n| `FlyoutIcon`\
  \ | 为飞出菜单指定自定义图标文件。 |\n| `FlyoutHeader` | 允许在飞出菜单顶部添加视图。 |\n| `FlyoutBackgroundImage`\
  \ | 为飞出菜单分配背景图像。 |\n| `FlyoutBackgroundImageAspect` | 设置背景图像的拉伸方式。对于 `Image` 视图的支持值为\
  \ `Fill`、`AspectFit` 和 `AspectFill`。 |\n| `FlyoutIsPresented` | 指定飞出菜单是否应该自动打开。\
  \ |\n\n**表 8.3：** 在 Shell 中自定义飞出菜单的属性。\n\n### 利用内置导航：标签栏 (The Tab bar)\n\nShell\
  \ 提供了一个基于标签的内置导航框架。如果你查看 图 8.7 和 图 8.8，你可以看到 shell 底部带有图标和文本的标签栏。标签栏由 `TabBar` 对象表示，每个标签由\
  \ `Tab` 对象表示。与 `TabbedPage` 一样，你添加的标签数量没有限制，但建议不要超过三个或四个，以确保它们能够适应任何屏幕尺寸。`TabBar`\
  \ 也像飞出菜单一样被添加到 `Shell` 对象中，对于每个标签，你都添加一个 `ShellContent` 对象，就像你在定义飞出菜单时做的那样。以下代码演示了如何创建你在\
  \ 图 8.7 和 图 8.8 中看到的标签栏：\n\n```xml\n<Shell ... >\n<TabBar>\n<Tab Title=\"Home\"\
  \ Icon=\"home.png\">\n  <ShellContent ContentTemplate=\"{DataTemplate pages:HomePage}\"\
  />\n</Tab>\n<Tab Title=\"About\" Icon=\"about.png\">\n  <ShellContent ContentTemplate=\"\
  {DataTemplate pages:AboutPage}\"/>\n</Tab>\n<Tab Title=\"Contact\" Icon=\"contact.png\"\
  >\n  <ShellContent ContentTemplate=\"{DataTemplate pages:ContactPage}\"/>\n</Tab>\n\
  </TabBar>\n</Shell>\n```\n\n每个标签上显示的文本通过 `Title` 属性指定。值得提到的是，你不需要编写任何代码来实现页面导航，因为所有内容都由\
  \ `Shell` 处理（尽管你有选项可以这样做，这将在接下来的章节中进行介绍）。\n\n### 同时实现飞出菜单和标签栏\n\n许多移动应用程序在飞出菜单和标签栏中提供指向其他页面的相同快捷方式。这提供了更好的用户体验；例如，当标签栏上的快捷方式被飞出菜单本身覆盖时，允许从飞出菜单访问该页面。如果你希望在飞出菜单和标签栏中都具有相同的导航快捷方式，你可以编写以下代码：\n\
  \n```xml\n<Shell ... >\n<FlyoutItem FlyoutDisplayOptions=\"AsMultipleItems\">\n\
  <Tab Title=\"Home\" Icon=\"home.png\">\n  <ShellContent ContentTemplate=\"{DataTemplate\
  \ pages:HomePage}\"/>\n</Tab>\n<Tab Title=\"About\" Icon=\"library.png\">\n  <ShellContent\
  \ ContentTemplate=\"{DataTemplate pages:AboutPage}\"/>\n</Tab>\n<Tab Title=\"Contact\"\
  \ Icon=\"contact.png\">\n  <ShellContent ContentTemplate=\"{DataTemplate pages:ContactPage}\"\
  />\n</Tab>\n</FlyoutItem>\n</Shell>\n```\n\n总结，你将 `Tab` 对象作为 `FlyoutItem` 对象的子添加，并且你必须将\
  \ `FlyoutDisplayOptions` 属性分配为 `AsMultipleItems`。该属性值允许一个飞出项目显示多个子元素。\n\n### 实现搜索栏\n\
  \nShell 还包含一个内置的搜索用户界面，这需要一些准备工作。首先，你需要创建一个继承自基类 `SearchHandler` 的类，在其中实现你自己的搜索逻辑。假设你有一个处理联系人列表的应用程序，并且以下对象来表示人员：\n\
  \n```csharp\npublic class Person\n{\n  public string FirstName { get;set; }\n  public\
  \ string LastName {get;set; }\n}\n\npublic class PersonViewModel\n{\n  public ObservableCollection<Person>\
  \ People { get; set; }\n  public PersonViewModel()\n  {\n    People = new ObservableCollection<Person>();\n\
  \    People.Add(new Person { LastName=\"Del Sole\", FirstName=\"Alessandro\"});\n\
  \    People.Add(new Person { LastName =\"White\", FirstName =\"Robert\" });\n  \
  \  People.Add(new Person { LastName =\"Sonny\", FirstName =\"John\" });\n  }\n}\n\
  ```\n\n现在，同样假设 `PersonViewModel` 类在应用程序某处实例化，并且其 `People` 属性填充了 `Person` 对象列表。此时，你可以实现一个根据搜索标准搜索特定项目的类。在当前示例中，搜索标准是姓氏。以下代码演示了如何实现这一点：\n\
  \n```csharp\n// 需要使用 System.Linq 指令\npublic class PeopleSearchHandler : SearchHandler\n\
  {\n  public PersonViewModel { get; set; }\n  protected override void OnQueryChanged(string\
  \ oldValue, string newValue)\n  {\n    base.OnQueryChanged(oldValue, newValue);\n\
  \    if (string.IsNullOrWhiteSpace(newValue))\n    {\n      ItemsSource = null;\n\
  \    }\n    else\n    {\n      ItemsSource = PersonViewModel.People\n        .Where(p\
  \ => p.LastName.ToLower().Contains(newValue.ToLower()))\n        .ToList();\n  \
  \  }\n  }\n\n  protected override async void OnItemSelected(object item)\n  {\n\
  \    base.OnItemSelected(item);\n    Person person = item as Person;\n    if(person\
  \ != null)\n    {\n    }\n  }\n}\n```\n\n\n\n\n\n```csharp\nawait (Application.Current.MainPage\
  \ as Shell).GoToAsync($\"PersonDetails?name={person.LastName}\");\n}\n}\n}\n```\n\
  \n当用户在搜索字段中输入内容时，会触发 `OnQueryChanged` 事件。在这里，有一个 LINQ 查询，根据用户输入的内容过滤 `People` 对象的集合。查询结果被赋值给搜索处理类中名为\
  \ `ItemsSource` 的属性。该属性可以包含一个对象集合，并在用户输入时显示在搜索栏下方。请注意，`OnQueryChanged` 还暴露了 `oldValue`\
  \ 和 `newValue` 字符串，它们分别代表搜索栏中之前的文本和搜索栏中的当前值。你需要处理的另一个事件是 `OnItemSelected`，它在用户从搜索结果中选择某项时被触发。通常，目标操作包括从搜索结果中检索所选对象的实例，并打开一个可以处理所检索数据类型的新页面。在当前示例中，该目标页面被称为\
  \ `PersonDetails`。当你的逻辑完成后，就可以将搜索栏添加到用户界面中。与其他功能（如飞出菜单或标签栏）不同，搜索栏不是在 Shell 的 XAML\
  \ 代码中声明的，而是在页面级别声明的。例如，在 `HomePage.xaml` 文件中，你可以在 `Content` 属性之前添加以下 XAML：\n\n```xml\n\
  <Shell.SearchHandler>\n    <local:PeopleSearchHandler Placeholder=\"Enter search\
  \ term\"\n                               ShowsResults=\"true\" SearchBoxVisibility=\"\
  Expanded\"\n                               DisplayMemberName=\"LastName\" />\n</Shell.SearchHandler>\n\
  ```\n\n图 8.9 显示了搜索用户界面的外观：\n\n![](img/Figure-8.9.jpg)\n\n**图 8.9：**搜索栏\n\n当用户从列表中选择一项时，将检索相应的类实例并打开新页面。值得提到的是\
  \ `DisplayMemberName` 属性，它指定了用于显示搜索框内容的属性。\n\n# 程序化与 Shell 交互 (#toc.xhtml_s261a)\n\
  \n你可以通过 C# 与 Shell 交互并设置其属性，就像在 XAML 中执行一样，或者当你需要在运行时更改某些内容。Shell 由 `Shell` 类表示，该类作为一个单例类（只有一个实例）可用，你可以通过\
  \ `Current` 属性访问它。例如，下面的代码演示了如何程序化设置飞出菜单的背景图像：\n\n```csharp\nShell.Current.FlyoutBackgroundImage\
  \ = ImageSource.FromFile(\"background.png\");\n```\n\n你将能够映射的方法访问 Shell 内部对象的所有属性，IntelliSense\
  \ 将帮助你理解可用的成员。下一行代码演示了如何程序化导航到不同的页面：\n\n```csharp\nawait Shell.Current.GoToAsync(\"\
  about\");\n```\n\n`GoToAsync` 方法允许打开不同的页面，但这需要定义一个所谓的路由（route）。可以通过为 `ShellContent`\
  \ 对象的 `Route` 属性分配你选择的标识符来实现，如下行所示：\n\n```xml\n<ShellContent ContentTemplate=\"\
  {DataTemplate pages:AboutPage}\" Route=\"about\"/>\n```\n\n其他支持路由的对象还有 `FlyoutItem`、`Tab`\
  \ 和 `TabBar`。你也可以调用 `GoToAsync` 导航到未在 Shell 视觉层次结构中的页面。要实现这一点，你首先需要为目标页面注册一个路由：\n\
  \n```csharp\nRouting.RegisterRoute(\"TargetPage\", typeof(TargetPage));\n```\n\n\
  其中 `TargetPage` 是未包含在视觉层次结构中的目标页面名称。\n\n**本节中 C# 示例数量有限是有刻意的。请记住，XAML 的主要优势之一是允许专业设计师在不接触任何\
  \ C# 代码的情况下处理用户界面。你应该将与 Shell 的 C# 交互限制在本节重点出的情况下，并将设计更改留在 XAML 中。**\n\n# 修改 Shell\
  \ 样式 (#toc.xhtml_s262a)\n\n默认情况下，Shell 采用目标操作系统的的主调颜色。然而，可以使用不同的颜色和字体自定义飞出菜单和标签栏等元素。在\
  \ `Xamarin.Forms` 中，这是通过资源实现的。下一章将详细讨论，但这里提供预览。下面的代码演示了如何更改 `Shell` 和标签栏的颜色：\n\n\
  ```xml\n<Shell.Resources>\n    <ResourceDictionary>\n        <Style x:Key=\"BaseStyle\"\
  \ TargetType=\"Element\">\n            <Setter Property=\"Shell.BackgroundColor\"\
  \ Value=\"LightGreen\" />\n            <Setter Property=\"Shell.ForegroundColor\"\
  \ Value=\"Blue\" />\n            <Setter Property=\"Shell.TitleColor\" Value=\"\
  White\" />\n            <Setter Property=\"Shell.DisabledColor\" Value=\"LightGray\"\
  \ />\n            <Setter Property=\"Shell.UnselectedColor\" Value=\"Gray\" />\n\
  \            <Setter Property=\"Shell.TabBarBackgroundColor\" Value=\"LightBlue\"\
  />\n            <Setter Property=\"Shell.TabBarForegroundColor\" Value=\"Red\"/>\n\
  \            <Setter Property=\"Shell.TabBarUnselectedColor\" Value=\"Orange\"/>\n\
  \            <Setter Property=\"Shell.TabBarTitleColor\" Value=\"Red\"/>\n     \
  \   </Style>\n        <Style TargetType=\"ShellContent\" BasedOn=\"{StaticResource\
  \ BaseStyle}\"/>\n    </ResourceDictionary>\n</Shell.Resources>\n```\n\n如你所见，属性名称是自解释的。它们使用每个属性对应的的\
  \ `Setter` 对象进行赋值，这些对象封装在 `ResourceDictionary` 资源内部，并包裹在 `Shell.Resources` 之中。\n\
  \n\n\n\n\n### 引言\n\n在现实世界的移动 应用程序开发中，你通常需要遵循某种视觉设计，这迫使你在同一类型的视图上重复使用颜色、字体和大小。你不需要每次都为每个视图分配相同的属性，而是可以使用资源（resources）。使用资源的语法与你利用另一个强大功能——数据绑定（data\
  \ binding）的语法相似，数据绑定允许将视图连接到 .NET 对象，以便它们可以在无需你手动干预的情况下自动交换信息。例如，从 `DatePicker`\
  \ 中选择日期并将选择结果存储在 `DateTime` 变量中可以自动化过程，而当你处理数据集合和数据库时，这种方法会变得更为重要。本章将同时介绍资源和数据绑定，为你提供关于\
  \ Xamarin.Forms 的关键知识。\n\n数据访问、数据绑定以及你在这些场景中使用的相关视图可能非常复杂。因此，本章的目标不是描述所有对象的所有可用属性和可能的用途。相反，作为一名\
  \ Xamarin 求职者，目标是为你提供所有必要的知识，使你能够立即在现有项目上投入工作，进行维护和新功能的实现。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\
  \n* 理解和定义资源\n* 将数据绑定到用户界面\n* 高级数据绑定：Model-View-ViewModel 模式\n* 使用 SQLite 数据库进行本地数据访问\n\
  \n### 目标\n\n完成本章后，你将能够定义并重用样式和数据模板，并且通过高级编程模式和 SQLite 数据库本地数据访问，实现用户界面与数据集合之间通信的自动化。\n\
  \n### 创建示例\n\n本章提供了不同的 Xamarin.Forms 解决方案，你可以用 Visual Studio 打开它们以便遵循示例。如果你想自己创建项目，可以按照以下步骤操作：\n\
  \n1. 分别创建三个名为 `Resources`、`DataBinding` 和 `MvvmSample` 的 Xamarin.Forms 解决方案。对于本地数据访问部分，你需要扩展\
  \ `MvvmSample` 项目。\n2. 对于每个共享项目，不要编辑或删除自动生成的 `MainPage.xaml` 文件，因为它稍后会用到。\n3. 对于书中讨论的每个视图（特别是关于数据绑定的），添加类型为\
  \ `Content Page (XAML)` 的新项。要实现此操作，右键点击共享项目名称，然后在上下文菜单中点击 `Add New Item`。\n4. 在\
  \ `Add New Item` 对话框中，点击左侧的 Xamarin.Forms 节点，然后选择 `Content Page (XAML)` 项模板。\n5.\
  \ 为新的 XAML 文件分配一个与讨论视图匹配的名称，例如 `CollectionViewSample.xaml`，并点击 `Add`。\n\n对于你添加到项目中的每个页面，在\
  \ `ContentPage` 中添加一个空的 `StackLayout`，并将其 `VerticalOptions` 属性赋值为 `CenterAndExpand`。除非另有指定，这将是后续页面代码示例的备选布局。\n\
  \n### 理解和定义资源\n\n在软件开发中，资源代表可重用的对象。在 .NET 开发中，资源通常由 `.resx` 文件表示，你可以在其中定义可重用的字符串或图像。相反，在\
  \ Xamarin.Forms 以及更通用的所有基于 XAML 的开发平台（如 WPF 和 UWP）中，资源代表在 XAML 中定义的属性集合，你可以将其应用于多个视觉元素。Xamarin.Forms\
  \ 支持多种类型的资源：样式、数据模板和对象引用。样式将在接下来的段落中讨论，而数据模板和对象引用将在讨论数据绑定时进行，因为那是它们被使用的地方。但首先，你需要知道如何声明资源以及它们的可见性范围。\n\
  \n### 定义资源\n\n`Application` 类、页面和布局都暴露了一个名为 `Resources` 的集合。这是一个 `ResourceDictionary`\
  \ 对象的集合，每个对象都可以包含不同的资源。在实践中，你并不真的需要定义多个 `ResourceDictionary` 实例，但如果你想逻辑上分组资源，这可能会很有用。你可以如下所示定义资源集合：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\nx:Class=\"Resources.Page1\"\
  >\n< ContentPage.Resources>\n<ResourceDictionary>\n</ResourceDictionary>\n</ ContentPage.Resources>\n\
  </ ContentPage >\n```\n\n在上述代码片段中，资源是在页面级别定义的。在接下来的示例中，资源是在布局级别定义的：\n\n```xml\n\
  <Grid>\n<Grid.Resources>\n<ResourceDictionary>\n</ResourceDictionary>\n</Grid.Resources>\n\
  </Grid>\n```\n\n在接下来的代码片段中，资源是在应用级别定义的：\n\n```xml\n<Application xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\nx:Class=\"Resources.App\"\
  >\n<Application.Resources>\n<ResourceDictionary>\n</ResourceDictionary>\n</Application.Resources>\n\
  </Application>\n```\n\n提供这三个示例的原因是资源的范围，可以总结如下：\n\n* 在 `App.xaml` 文件中定义的资源在整个应用中均可用。\n\
  * 定义在页面中的资源仅对该页面包含的视图和布局可用，对外部无效。\n* 定义在布局中的资源仅对该布局包含的视图和布局可用，对外部无效。\n\n现在你已经知道资源定义在哪里以及范围是如何工作的，你准备好在实践中开始定义资源了。\n\
  \n### 定义和分配样式\n\n样式是最常见的重用资源类型，也是学习此主题的最简单方法。样式可以认为是一组可重用的属性和值，适用于相同类型的视觉元素。例如，你可能需要为页面上的所有按钮应用相同的背景颜色、字体大小和文本颜色。另一个示例可以是应用程序中的所有标签应用相同的字体。如果没有样式，你将需要手动为所有视图分配相同的属性，重复多次。样式由\
  \ `Style` 对象表示。它需要一个 `x:Key` 标签，其中包含样式的唯一标识符，你将用它来分配样式；该键可以被视为名称。它还需要指定样式可以应用的视图，这是通过样式的\
  \ `TargetType` 属性指定的。你想包含在样式中的每个属性都由 `Setter` 对象表示，该对象有两个属性：`Property` 指定目标属性，`Value`\
  \ 表示属性值。以下代码演示了如何定义一个针对 `Button` 视图的样式并分配 `BackgroundColor`、`TextColor`、`FontAttributes`\
  \ 和 `FontSize` 属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<Application\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\nxmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \nx:Class=\"Resources.App\">\n<Application.Resources>\n<ResourceDictionary>\n<Style\
  \ x:Key=\"PrimaryButtonStyle\" TargetType=\"Button\">\n<Setter Property=\"BackgroundColor\"\
  \ Value=\"Blue\"/>\n<Setter Property=\"TextColor\" Value=\"White\"/>\n<Setter Property=\"\
  FontAttributes\" Value=\"Bold\"/>\n<Setter Property=\"FontSize\" Value=\"Medium\"\
  \ />\n</Style>\n</ResourceDictionary>\n</Application.Resources>\n</Application>\n\
  ```\n\n\n\n\n\n```xml\n</Application.Resources>\n</Application>\n```\n\n随后使用样式非常简单。视图（Views）暴露了一个\
  \ `Style` 属性，你可以用目标视图的样式对其进行赋值。下面的代码段演示了如何将上面定义的样式分配给三个按钮，以便它们具有相同的的外观：\n\n```xml\n\
  <StackLayout VerticalOptions=\"CenterAndExpand\" HorizontalOptions=\"FillAndExpand\"\
  \ Spacing=\"20\" Margin=\"20,0,20,0\">\n    <Button Text=\"Button one\" Style=\"\
  {StaticResource PrimaryButtonStyle}\" />\n    <Button Text=\"Button two\" Style=\"\
  {StaticResource PrimaryButtonStyle}\" />\n    <Button Text=\"Button three\" Style=\"\
  {StaticResource PrimaryButtonStyle}\" />\n</StackLayout>\n```\n\n赋值样式的语法需要一个在括号之间的标记扩展，它由\
  \ `StaticResource` 对象组成，后面跟着样式的键值。\n\n**提示：如你在输入时所看到的，智能感知（IntelliSense）不仅会显示样式列表让你编写代码更快，而且特别是它只会显示可以应用到你正在编辑的视图上的样式。**\n\
  \n实际上，还有另一种分配样式的方法，如下：\n\n```xml\n<Button Text=\"Button one\" Style=\"{DynamicResource\
  \ ButtonStyle}\" />\n```\n\n如果你计划在运行时修改样式的属性，并希望目标视图自动更新以反映更改，可以使用 `DynamicResource`\
  \ 代替 `StaticResource`。图 9.1 显示了之前定义的样式赋值结果：\n\n![](img/Figure-9.1.jpg)\n\n**图 9.1：**\
  \ 为三个不同的按钮分配样式\n\n显然，你可以拥有多个针对相同视图的样式，然后根据页面定义和上下文选择最合适的一个。下面的代码演示了如何为 `Button`\
  \ 视图实现多个样式，以及如何通过指定不同的 `x:Key` 来区分它们：\n\n```xml\n<Style x:Key=\"PrimaryButtonStyle\"\
  \ TargetType=\"Button\">\n    <Setter Property=\"BackgroundColor\" Value=\"Blue\"\
  />\n    <Setter Property=\"TextColor\" Value=\"White\"/>\n    <Setter Property=\"\
  FontAttributes\" Value=\"Bold\"/>\n    <Setter Property=\"FontSize\" Value=\"Medium\"\
  \ />\n</Style>\n\n<Style x:Key=\"SecondaryButtonStyle\" TargetType=\"Button\">\n\
  \    <Setter Property=\"BackgroundColor\" Value=\"LightGray\"/>\n    <Setter Property=\"\
  TextColor\" Value=\"Blue\"/>\n    <Setter Property=\"FontAttributes\" Value=\"Bold\"\
  />\n    <Setter Property=\"FontSize\" Value=\"Medium\" />\n</Style>\n```\n\n###\
  \ 实现样式继承\n\n样式支持继承使得能够定义一个基础样式，然后根据你的特定需求自定义样式。可以通过指定 `BaseOn` 属性从另一个样式继承样式，该属性接受\
  \ `StaticResource` 标记扩展作为值。下面的代码演示了如何为所有派自 `View` 的对象（如视图和布局）定义样式，其中提供了对齐选项。接下来，定义了一个\
  \ `Label` 视图的样式，它继承自上一个。这个新样式将拥有 `ViewStyle` 样式的属性，加上在 `LabelStyle` 样式中定义的新属性：\n\
  \n```xml\n<Style x:Key=\"ViewStyle\" TargetType=\"View\">\n    <Setter Property=\"\
  HorizontalOptions\" Value=\"Center\" />\n    <Setter Property=\"VerticalOptions\"\
  \ Value=\"Center\" />\n</Style>\n\n<Style x:Key=\"LabelStyle\" TargetType=\"Label\"\
  \ BasedOn=\"{StaticResource ViewStyle}\">\n    <Setter Property=\"TextColor\" Value=\"\
  Green\" />\n    <Setter Property=\"FontSize\" Value=\"Large\" />\n</Style>\n\n<Style\
  \ x:Key=\"RedLabelStyle\" TargetType=\"Label\" BasedOn=\"{StaticResource LabelStyle}\"\
  >\n    <Setter Property=\"TextColor\" Value=\"Red\" />\n</Style>\n```\n\n第三个样式 `RedLabelStyle`\
  \ 演示了如何重新定义其所继承样式中的一个属性。这将允许该样式拥有基础样式中定义的所有属性加上在此处实施的更改。\n\n# 实现隐式样式化\n\n假设你想对资源作用域内定义的所有目标视图应用相同的样式。可以利用称为“隐式样式化”（implicit\
  \ styling）的功能。考虑以下代码：\n\n```xml\n<Style TargetType=\"Button\">\n    <Setter Property=\"\
  BackgroundColor\" Value=\"Blue\"/>\n    <Setter Property=\"TextColor\" Value=\"\
  White\"/>\n    <Setter Property=\"FontAttributes\" Value=\"Bold\"/>\n    <Setter\
  \ Property=\"FontSize\" Value=\"Medium\" />\n</Style>\n```\n\n如你所示，没有指定 `x:Key`\
  \ 标签。如果此样式定义在应用程序中，它将自动应用到应用程序中的所有按钮，而无需显式分配 `Style` 属性。同样，如果它定义在页面的资源中，它将应用到页面中的所有按钮；如果它定义在布局的资源中，它将应用到布局内部的所有按钮。你仍然可以通过指定\
  \ `x:Key` 标签并手动将其分配给你不希望进行隐式样式化的单个视图。\n\n### 将数据绑定到用户界面\n\n在软件开发中，数据绑定（data binding）是一种连接视图和数据对象的机制，用于实现两者之间的自动信息交换。这使得视图在数据更改时能够自动更新，反之亦然。为了更好地理解，考虑用户在\
  \ `Entry` 中输入某些文本的情景。如果没有数据绑定，你需要手动处理每次按键的 `TextChanged` 事件并将字符串存储到数据属性中。数据绑定巧妙地解决了这些问题，实现了视图与\
  \ .NET 对象之间的自动通信和内容更新。在接下来的段中，你将学习如何在 Xamarin.Forms 中成功使用数据绑定。\n\n### 开始数据绑定\n\n\
  由于数据绑定的复杂性和重要性，你将采用循序渐进的方法学习此功能，从小部分开始。假设你有如下 `Contact` 类：\n\n```csharp\npublic\
  \ class Contact\n{\n    public string LastName { get; set; }\n    public string\
  \ FirstName { get; set; }\n    public DateTime DateOfBirth { get; set; }\n    public\
  \ bool IsFamilyMember { get; set; }\n}\n```\n\n想象你有一个类的实例，并希望用户通过用户界面上的合适视图向类实例输入数据。你可以有一个包含两个\
  \ `Entry` 视图、一个 `DatePicker` 和 `CheckBox` 的页面（解决方案中的 `SimpleBindingPage.xaml`）。与其手动处理每个属性的事件和数据存储，可以使用数据绑定。页面的\
  \ XAML 代码如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\n             xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \n             x:Class=\"DataBinding.SimpleBindingPage\">\n    <ContentPage.Content>\n\
  \        <StackLayout Orientation=\"Vertical\" Padding=\"20\">\n            <Label\
  \ Text=\"First Name:\" />\n            <Entry Text=\"{Binding FirstName}\"/>\n \
  \           <Label Text=\"Last Name:\" />\n            <Entry Text=\"{Binding LastName}\"\
  />\n            <Label Text=\"Date of birth:\"/>\n            <DatePicker Date=\"\
  {Binding DateOfBirth, Mode=TwoWay}\"/>\n            <StackLayout Orientation=\"\
  Horizontal\">\n                <Label Text=\"Is family member?:\" VerticalOptions=\"\
  Center\"/>\n                <CheckBox IsChecked=\"{Binding IsFamilyMember}\"/>\n\
  \            </StackLayout>\n        </StackLayout>\n    </ContentPage.Content>\n\
  </ContentPage>\n```\n\n\n\n\n\n```xml\n<VerticalOptions=\"Center\"/>\n</StackLayout>\n\
  </StackLayout>\n</ContentPage.Content>\n</ContentPage>\n```\n\n如你所见，对于每个视图，接收用户输入的属性（`Entry.Text`、`DatePicker.Date`\
  \ 和 `CheckBox.IsChecked`）都被分配了一个标记扩展，该扩展由绑定字面量加之数据对象中的目标属性表示。\n\n提示：绑定到属性的完整语法为\
  \ `{Binding Path=PropertyName}`，但在像之前的简单表达式中，可以省略 `Path`。\n\nXamarin.Forms 支持 表\
  \ 9.1 中描述的五种数据绑定类型，可以通过绑定表达式的 `Mode` 属性进行指定：\n\n| 类型 | 说明 |\n| :--- | :--- |\n|\
  \ `TwoWay` | 数据绑定在读写模式下工作（视图可以从绑定对象读取并写入数据）。 |\n| `OneWay` | 数据绑定在只读模式下工作，视图只能从绑定对象读取数据。\
  \ |\n| `OneWayToSource` | 数据绑定在只写模式下工作，视图只能向绑定对象写入数据。 |\n| `OneTime` | 数据绑定在只读模式下工作，但视图只能读取一次数据。\
  \ |\n| `Default` | Xamarin 会根据当前视图自动分配最合适的类型。如果未指定类型，这也是默认行为。 |\n\n表 9.1：支持的数据绑定类型\n\
  \n如果你查看之前的代码，可以发现 `Entry` 视图没有指定模式（mode）。这假设了 `Mode=Default`，且 Xamarin 自动将 `TwoWay`\
  \ 识别为此类视图最合适的类型。`DatePicker` 是一个例外，因为即使在原生支持读写绑定的情况下，也需要指定 `TwoWay` 模式。视图的所有属性都不能数据绑定到另一个属性，只有所谓的“可绑定属性（bindable\
  \ properties）”可以做到。\n\n在本书中，你将学习如何使用可绑定属性，但它们的实现将留给你进行进一步研究。之所以这样做的原因是它们具有复杂性，而且作为一名\
  \ Xamarin 的求职者，你会发现可绑定属性通常只在自定义视图中实现。官方文档提供了进一步的指导，可以访问 https://docs.microsoft.com/en-us/xamarin/xamarin-forms/xaml/bindable-properties。\n\
  \n可绑定属性的强大之处在于它们不仅可以将其值写入目标对象，而且当目标对象的值在数据绑定外部更新时，它们也会自动更新。为了澄清这一点，考虑这样一个场景：从数据库读取数据并将其存储在\
  \ .NET 对象中。数据被读取，值被写入 .NET 类的属性，而绑定到此类类的视图属性会自动更新其值。然而，只有当绑定的 .NET 对象发送了所谓的“属性更改通知”时，可绑定属性才能自动刷新内容，这意味着通知界面一个或多个值发生了变化。要实现这一点，绑定的类必须实现\
  \ `System.ComponentModel.INotifyPropertyChanged` 接口。\n\n# 属性更改通知：INotifyPropertyChanged](#toc.xhtml_s277a)\n\
  \n作为数据绑定源的可绑定属性持续监听名为 `PropertyChanged` 的事件，该事件是由实现 `INotifyPropertyChanged` 接口的对象触发的。当此类事件被触发时，可绑定属性的值会自动刷新。考虑到此，之前展示的\
  \ `Contact` 类应该重写如下：\n\n```csharp\nusing System;\nusing System.ComponentModel;\n\
  using System.Runtime.CompilerServices;\nnamespace DataBinding\n{\n    public class\
  \ Contact : INotifyPropertyChanged\n    {\n        private string _lastName;\n \
  \       public string LastName\n        {\n            get\n            {\n    \
  \            return _lastName;\n            }\n            set\n            {\n\
  \                _lastName = value;\n                OnPropertyChanged();\n    \
  \        }\n        }\n        private string _firstName;\n        public string\
  \ FirstName\n        {\n            get\n            {\n                return _firstName;\n\
  \            }\n            set\n            {\n                _firstName = value;\n\
  \                OnPropertyChanged();\n            }\n        }\n        private\
  \ DateTime dateOfBirth;\n        public DateTime DateOfBirth\n        {\n      \
  \      get\n            {\n                return dateOfBirth;\n            }\n\
  \            set\n            {\n                dateOfBirth = value;\n        \
  \        OnPropertyChanged();\n            }\n        }\n        private bool _isFamilyMember;\n\
  \        public bool IsFamilyMember\n        {\n            get\n            {\n\
  \                return _isFamilyMember;\n            }\n            set\n     \
  \       {\n                _isFamilyMember = value;\n                OnPropertyChanged();\n\
  \            }\n        }\n        public event PropertyChangedEventHandler PropertyChanged;\n\
  \        private void OnPropertyChanged([CallerMemberName] string propertyName =\
  \ null)\n        {\n            PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));\n\
  \        }\n    }\n}\n```\n\n以下是关于上述代码的关键点：\n\n- 每个属性的 `set` 方法在每次其值变化时都会调用一个名为\
  \ `OnPropertyChanged` 的方法。这实现了更改通知。\n- `CallerMemberName` 属性会自动解析调用者的名称，在本例中即为属性名。\n\
  - 定义 `OnPropertyChanged` 方法是为了简化调用。\n- Xamarin.Forms 库中的多个对象也暴露了具有相同实现的名为 `PropertyChanged`\
  \ 的方法，因此在你的对象中执行相同的操作有助于确保一致性。\n\n# 分配绑定上下文](#toc.s278a)\n\n你之前已经创建了一个数据对象，编写了一些用户界面，并为数据绑定做好了准备；最后一步是连接对象与视图。这通过为对象分配一个名为\
  \ `BindingContext` 的属性来实现。该属性在许多对象中可用（例如页面和布局），并代表了视图的数据源。对于之前的示例，你可以在页面的后台代码文件中编写以下代码：\n\
  \n```csharp\nprivate Contact NewContact { get; set; }\n\npublic SimpleBindingPage()\n\
  {\n    InitializeComponent();\n    NewContact = new Contact\n    {\n        FirstName\
  \ = \"Alessandro\",\n        LastName = \"Del Sole\",\n        DateOfBirth = new\
  \ DateTime(1977, 05, 10),\n        IsFamilyMember = false\n    };\n    BindingContext\
  \ = NewContact;\n}\n```\n\n创建了一个 `Contact` 类的新实例并将其赋值给类型 `NewContact` 的属性。定义属性的方法是推荐的，因为数据绑定引擎针对属性而非字段或局部变量进行了优化，而且它可以从页面的其他地方访问该对象。将\
  \ `NewContact` 实例分配给页面的 `BindingContext` 属性这真正开启了数据绑定。在后台，子视图将在其父容器的 `BindingContext`\
  \ 属性中查找对象实例，并绑定到绑定表达式指定的属性。如果你现在运行示例代码，将看到页面的用户界面如何自动填充来自 `Contact` 类实例的值，如图 9.2\
  \ 所示：\n\n![](img/Figure-9.2.jpg)\n\n**图 9.2：** 将对象实例绑定到视图\n\n\n\n\n你对数据进行的任何更改都将发送到绑定对象。你可以通过在\
  \ `Contact` 类的 `OnPropertyChanged` 方法定义处设置断点来轻松地演示这一点。你会看到每当根据用户输入更改属性值时，该方法就会被调用。你到为止看到的只是数据绑定的基本实现，它对于单个页面（例如数据输入场景）来说非常有用。然而，当你处理数据集合时，数据绑定的威力会被完全释放。\n\
  \n### 使用数据集合\n\n在用户界面中显示和编辑数据集合是数据绑定的另一个常见场景。Xamarin.Forms 提供了几种用于显示数据集合的视图，如表 9.2\
  \ 所示：\n\n| 视图 | 描述 |\n\n| :--- | :--- |\n| `ListView` | 显示绑定集合的项列表。 |\n| `CollectionView`\
  \ | 以更现代、高效的方式显示来自绑定集合的项列表。 |\n| `CarouselView` | 允许滚动浏览集合中的项列表，并保持选中项的焦点。 |\n|\
  \ `TableView` | 以表格视图显示集合中的项。 |\n| `Picker` | 根据系统用户界面从集合中选择一个项。 |\n\n**表 9.2:**\
  \ 支持数据集合的视图\n\n关于 [表 9.2] 中列出的视图，需要考虑两个重要的点：\n\n* 在 Xamarin.Forms 4.5 之前，`ListView`\
  \ 是显示和编辑列表的唯一视图，该版本引入了 `CollectionView`。虽然它的效率较低且管理更复杂，但在现实世界中，你仍然发现许多项目依赖于 `ListView`。这就是为什么我们要对其他视图一样对其进行详细讨论。\n\
  * 当你想实现一系列设置或选项时，使用 `TableView` 是有意义的。`CollectionView` 可以实现更复杂的结果，因此我们将介绍 `TableView`，但不会深入探讨不必要的细节。\n\
  \n[表 9.2] 中描述的所有视图都具有一个特征：它们都暴露了一个名为 `ItemsSource` 的对象类型属性，接收你想要绑定的集合实例。该集合必须实现\
  \ `IEnumerable` 接口。在 Xamarin.Forms 中，你通常使用 `System.Collections.ObjectModel.ObservableCollection<T>`\
  \ 类型的集合。这种特殊集合的工作方式与 `List<T>` 完全相同，但当从集合中添加或删除项时，它还会发送更改通知，以便绑定的视图能够自动刷新其内容。\n\n\
  由于 `ObservableCollection` 在添加或删除项时会发送更改通知，如果你想通知用户界面集合中现有项的更改，必须确保数据对象实现了之前讨论过的\
  \ `INotifyPropertyChanged` 接口。\n\n### 显示数据：ListView\n\n多年来，`ListView` 一直是显示数据集合的唯一可用视图，因此了解它的工作原理非常重要，特别是将来可能需要维护现有项目的话。如果你想遵循辅助示例解决方案，可以打开\
  \ `ListViewSample.xaml` 页面。假设你有一个 `Contact` 对象的集合，并且你想在列表中显示每个联系人的属性值。以下代码演示了如何声明适当的\
  \ `ListView`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\n    xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \n    x:Class=\"DataBinding.ListViewSample\">\n    <ContentPage.Content>\n     \
  \   <StackLayout>\n            <ListView x:Name=\"ContactList\" ItemsSource=\"{Binding}\"\
  \n                      ItemSelected=\"ContactList_ItemSelected\"\n            \
  \          HasUnevenRows=\"True\">\n                <ListView.ItemTemplate>\n  \
  \                  <DataTemplate>\n                        <ViewCell.View>\n   \
  \                         <Frame HasShadow=\"False\" BorderColor=\"Blue\" Margin=\"\
  10\">\n                                <StackLayout>\n                         \
  \           <Label Text=\"Last name:\"/>\n                                    <Entry\
  \ Text=\"{Binding LastName}\"/>\n                                    <Label Text=\"\
  First name:\"/>\n                                    <Entry Text=\"{Binding FirstName}\"\
  />\n                                    <Label Text=\"Date of birth:\"/>\n     \
  \                               <DatePicker Date=\"{Binding DateOfBirth, Mode=TwoWay}\"\
  />\n                                    <StackLayout Orientation=\"Horizontal\"\
  >\n                                        <Label Text=\"Is Family Member?:\" VerticalOptions=\"\
  Center\"/>\n                                        <CheckBox IsChecked=\"{Binding\
  \ IsFamilyMember}\" VerticalOptions=\"Center\"/>\n                             \
  \       </StackLayout>\n                                </StackLayout>\n       \
  \                     </Frame>\n                        </ViewCell.View>\n     \
  \               </DataTemplate>\n                </ListView.ItemTemplate>\n    \
  \        </ListView>\n        </StackLayout>\n    </ContentPage.Content>\n</ContentPage>\n\
  ```\n\n这段代码中有几个关键点，其中一些点在视图之间也是通用的，即它们不仅限于 `ListView`。第一个考虑的点是 `ItemsSource` 属性，它接收数据绑定集合的实例。当绑定表达式简单为\
  \ `{Binding}` 时（如上一个示例所示），视图从 `BindingContext` 获取数据源。将集合实例赋值给 `BindingContext` 属性将该集合成为整个页面的数据源。在页面的后台代码（code-behind）中，你可以：\n\
  \n```csharp\nprivate ObservableCollection<Contact> Contacts { get; set; }\n\npublic\
  \ ListViewSample()\n{\n    InitializeComponent();\n    Contacts = new ObservableCollection<Contact>();\n\
  \    Contact contact1 = new Contact\n    {\n        FirstName = \"Alessandro\",\n\
  \        LastName = \"Del Sole\",\n        DateOfBirth = new DateTime(1977, 5, 10),\n\
  \        IsFamilyMember = false\n    };\n    Contact contact2 = new Contact\n  \
  \  {\n        FirstName = \"Robert\",\n        LastName = \"White\",\n        DateOfBirth\
  \ = new DateTime(1980, 2, 3),\n        IsFamilyMember = true\n    };\n    Contact\
  \ contact3 = new Contact\n    {\n        FirstName = \"Angela\",\n        LastName\
  \ = \"Green\",\n        DateOfBirth = new DateTime(1982, 9, 1),\n        IsFamilyMember\
  \ = true\n    };\n    Contacts.Add(contact1);\n    Contacts.Add(contact2);\n   \
  \ Contacts.Add(contact3);\n    BindingContext = Contacts;\n}\n```\n\n第二个考虑的点是一个名为\
  \ `ItemSelected` 的事件，当用户选择列表中的某一项时触发该事件。事件处理程序如下：\n\n```csharp\nprivate void ContactList_ItemSelected(object\
  \ sender, SelectedItemChangedEventArgs e)\n{\n    var contact = e.SelectedItem as\
  \ Contact;\n    if(contact != null)\n    {\n        // 此处继续代码\n    }\n}\n```\n\n\
  \n\n\n\n当事件触发时，会创建一个 `SelectedItemChangedEventArgs` 对象的实例，其 `SelectedItem` 属性（对象类型为\
  \ object）包含选中的项目。这必须被转换为期的类型。良好的做法是通过 `as` 运算符进行转换，然后检查结果是否不为 `null`，以在转换失败时避免异常。将\
  \ `HasUnevenRows` 属性设置为 `true` 可使行高变为动态。下一个关键点在于，`ListView` 以及其他视图并不知道你希望如何展示数据。因此，你需要实现一个\
  \ `DataTemplate`（数据模板），它代表你想要根据需要用于显示数据的一组视觉元素。在 `ListView` 中，`DataTemplate` 始终从单元格（cell）开始。Xamarin.Forms\
  \ 支持表 9.3*描述的单元格类型：\n\n| 单元格类型 | 说明 |\n| :--- | :--- |\n| `TextCell` | 显示两个 `Label`\
  \ ：一个显示自由文本，另一个显示绑定的值。 |\n| `EntryCell` | 显示一个带有自由文本的 `Label` 和一个带有绑定字符串值的 `Entry`。\
  \ |\n| `ImageCell` | 显示一个带有自由文本的 `Label` 和一个带有绑定图像的 `Image`。 |\n| `SwitchCell` |\
  \ 显示一个带有自由文本的 `Label` 和一个带有绑定 `bool` 值的 `Switch`。 |\n| `ViewCell` | 允许使用自定义视觉元素（如布局）显示数据。\
  \ |\n\n**表 9.3：** 支持的单元格类型\n\n当前的示例基于 `ViewCell`，因为其他单元格不足以展示 `Contact` 类的信息，因此有必要自定义布局。例如，如果你只想显示（并编辑）姓氏，可以使用\
  \ `EntryCell` 类型，如下：\n\n```xml\n<StackLayout>\n  <ListView x:Name=\"PeopleList\"\
  \ ItemsSource=\"{Binding}\">\n    <ListView.ItemTemplate>\n      <DataTemplate>\n\
  \        <EntryCell Label=\"Last name:\" Text=\"{Binding LastName}\"/>\n      </DataTemplate>\n\
  \    </ListView.ItemTemplate>\n  </ListView>\n</StackLayout>\n```\n\n`DataTemplate`\
  \ 中只能添加一个单元格，这意味着你甚至无法组合多个 `EntryCell` 类型。这是为什么 `ViewCell` 是最常用的单元格的另一个原因。如果你运行示例页面，将得到图\
  \ 9.3*所示的结果：\n\n![](img/Figure-9.3.jpg)\n\n**图 9.3：** 使用 ListView 显示和编辑集合\n\n如你所见，`ListView`\
  \ 在单独的行中展示每个 `Contact` 类的实例，并允许通过通过数据数据模板中指定的视图来编辑数据。例如，如果你点击出生日期字段，你将看到 `DatePicker`\
  \ 视图开始工作。你输入的所有数据都将自动存储在绑定的类中。\n\n**提示：所有内置滚动条的视图（如 `ListView` 和下一节讨论的其他视图）都永远不要嵌套在\
  \ `ScrollView` 内部；这样做是为了避免滚动冲突。**\n\n### 作为资源的 DataTemplate\n\n允许展示列表的视图暴露了 `ItemTemplate`\
  \ 属性，你可以像上一个示例那样为它分配一个 `DataTemplate`。然而，数据模板可以被定义为可重用的资源。例如，你可以将之前所示的 `DataTemplate`\
  \ 移动到面的资源中，如下：\n\n```xml\n<ContentPage.Resources>\n  <ResourceDictionary>\n    <DataTemplate\
  \ x:Key=\"ContactTemplate\">\n      <ViewCell>\n        <ViewCell.View>\n      \
  \    <Frame HasShadow=\"False\" BorderColor=\"Blue\" Margin=\"10\">\n          \
  \  <StackLayout>\n              <Label Text=\"Last name:\"/>\n              <Entry\
  \ Text=\"{Binding LastName}\"/>\n              <Label Text=\"First name:\"/>\n \
  \             <Entry Text=\"{Binding FirstName}\"/>\n              <Label Text=\"\
  Date of birth:\"/>\n              <DatePicker Date=\"{Binding DateOfBirth, Mode=TwoWay}\"\
  />\n              <StackLayout Orientation=\"Horizontal\">\n                <Label\
  \ Text=\"Is Family Member?:\" VerticalOptions=\"Center\"/>\n                <CheckBox\
  \ IsChecked=\"{Binding IsFamilyMember}\" VerticalOptions=\"Center\"/>\n        \
  \      </StackLayout>\n            </StackLayout>\n          </Frame>\n        </ViewCell.View>\n\
  \      </ViewCell>\n    </DataTemplate>\n  </ResourceDictionary>\n</ContentPage.Resources>\n\
  ```\n\n然后你可以通过内联分配视图的 `ItemTemplate` 属性来使用该数据模板，如下：\n\n```xml\n<ListView x:Name=\"\
  ContactList\" ItemsSource=\"{Binding}\"\n          ItemSelected=\"ContactList_ItemSelected\"\
  \n          HasUnevenRows=\"True\" ItemTemplate=\"{StaticResource ContactTemplate}\"\
  \ />\n```\n\n如你所见，你使用了与在样式中看到的相同的语法。将数据模板移动到可重用资源有几个原因（遵循“理解和定义资源”章节中描述的相同范围规则），例如使其在不同的视图之间、甚至如果在库中然后在不同的应用程序之间复用，或者使代码更有组织且易于阅读。\n\
  \n### 绑定不同类型：值转换器\n\n有时，你可能需要绑定特定类型的数据但以另一种格式显示它。为了更好地理解，请考虑 `ConverterPage.xaml`。假设你想根据\
  \ `bool` 属性更改 `Label` 的颜色。`Label` 类的 `TextColor` 属性类型为 `Color`，但第二个是 `bool`。在这种情况下，你可以使用值转换器。此类实现了\
  \ `IValueConverter`，将输入类型转换为另一种类型。目标是在 `Member` 属性为 true 时将 Family? 文本显示为红色，false\
  \ 则显示默认颜色。以下代码演示了如何实现（注释如下）：\n\n继续示例，在共享项目中添加一个名为 `BoolToConverter.cs` 的新代码文件。按照惯例，值转换器的名称带有\
  \ `Converter` 后缀应便于理解其用途。\n\n```csharp\nusing System;\nusing System.Globalization;\n\
  using Xamarin.Forms;\n\nnamespace DataBinding\n{\n  public class BoolToColorConverter\
  \ : IValueConverter\n  {\n    public object Convert(object value, Type targetType,\n\
  \          object parameter, CultureInfo culture)\n    {\n      try\n      {\n \
  \       bool originalValue = (bool)value;\n        switch (originalValue)\n    \
  \    {\n          case true:\n            return Color.Red;\n          default:\n\
  \            return Color.Default;\n        }\n      }\n      catch (Exception)\n\
  \      {\n        return Color.Default;\n      }\n    }\n\n    public object ConvertBack(object\
  \ value, Type targetType,\n      object parameter, CultureInfo culture)\n    {\n\
  \      throw new NotImplementedException();\n    }\n  }\n}\n```\n\n`IValueConverter`\
  \ 接口要求转换类实现两个方法：`Convert` 和 `ConvertBack`。`Convert` 允许将源类型转换为视图所需的另一种类型，而 `ConvertBack`\
  \ 则完全相反。在这种情况下，代码首先将值参数从对象转换为 `bool`，然后根据其值返回不同的颜色。如果你的绑定方向是只读的，你不需要实现 `ConvertBack`，就像在本例中，你的视图不会编辑转换后的值，只是使用它。两个方法都接收以下四个参数，即使开发者只提供了前三个参数中的：\n\
  \n*   `value`：需要转换的源对象。\n*   `targetType`：编译器检测到的源的预期类型。\n*   `parameter`：你可以从绑定表达式传递给转换器的额外参数，用于向转换器提供数据。\n\
  \n\n\n\n\n*   `culture`: 这也由编译器推断，并用 `CultureInfo` 类的实例表示，该实例包含当前系统的本地化信息。\n\n下一步是在\
  \ XAML 中使用该转换器。你首先需要添加一个 XML 命名空间声明，以引用暴露转换器类的 C# 命名空间，如下例所示：\n\n`xmlns:local=\"\
  clr-namespace:DataBinding\"`\n\n下一步是添加引用该转换器的资源，如下：\n\n```xml\n<ContentPage.Resources>\n\
  \  <ResourceDictionary>\n    <local:BoolToColorConverter x:Key=\"BoolToColorConverter\"\
  \ />\n    …………\n  </ResourceDictionary>\n</ContentPage.Resources>\n```\n\n现在，将转换器分配给感兴趣的绑定表达式的\
  \ `Converter` 属性，如下所示：\n\n```xml\n<StackLayout Orientation=\"Horizontal\">\n  <Label\
  \ Text=\"Is Family Member?:\"\n         TextColor=\"{Binding IsFamilyMember, Converter={StaticResource\
  \ BoolToColorConverter}}\"\n         VerticalOptions=\"Center\"/>\n  <CheckBox IsChecked=\"\
  {Binding IsFamilyMember}\"\n            VerticalOptions=\"Center\"\n           \
  \ Color=\"{Binding IsFamilyMember, Converter={StaticResource BoolToColorConverter}}\"\
  />\n</StackLayout>\n```\n\n由于转换器是一个资源，因此使用 `StaticResource` 标记扩展添加引用。在两个视图中，`Color`\
  \ 类型的属性都绑定到 `bool` 类型的 `IsFamilyMember` 属性上，但转换器根据 `bool` 值返回一个 `Color` 类型的对象。如果你运行代码，将看到如图\
  \ 9.4 所示的结果：\n\n![](img/Figure-9.4.jpg)\n\n**图 9.4:** 使用值转换器\n\n如你所示，如果绑定的 `Contact`\
  \ 类的 `IsFamilyMember` 属性为真，则文本和复选框显示为红色。此外，你可以取消该标记并查看所有内容如何恢复默认颜色，这也证明了数据绑定正在工作。如果你需要向转换器传递参数以实现进一步的逻辑，你使用的语法如下：\n\
  \n`{Binding PropertyName, Converter={StaticResource ConverterName}, ConverterParameter=value}}`\n\
  \n以下是你可能需要实现值转换器的示例场景列表：\n\n*   将 `DateTime` 对象格式化为自定义字符串表示。\n*   将 HTML 字符串值显示在\
  \ `WebView` 中。\n*   将字节数组转换为 `ImageSource` 以显示图像。\n*   将整数值转换为 `Boolean` 真/假表示。\n\
  \n值转换器是一项强大的功能，它们在实际开发中被广泛使用。你将经常使用它们，在接下来的章节中将提供更多示例。\n\n# 高效显示集合 (#toc.xhtml_s283a)\n\
  \n使用最新版本的 Xamarin.Forms，已经添加了几个视图来显示具有不同用户体验的集合。本节描述了这些额外的视图，并讨论了如何在内置系统选择器中显示列表。\n\
  \n# 使用 CollectionView 显示列表 (#toc.xhtml_s284a)\n\n在过去，在 Xamarin.Forms 中显示和绑定数据列表只能通过\
  \ `ListView` 实现。从 4.0 版本开始，Xamarin.Forms 提供了一个新的视图来显示和绑定列表：`CollectionView`。与 `ListView`\
  \ 相比，该视图具有以下优势：\n\n*   它具有更简单的 API 。\n*   它不需要单元格来实现数据模板，使得用户界面的渲染过程比以前更轻量。\n* \
  \  与 `ListView` 不同，它暴露了属性，允许在无需编写原生代码的情况下自定义某些布局点。\n\n`CollectionView` 是一个强大且现代的视图，应该被视为\
  \ `ListView` 的替代方案，而非替代品。\n\n如果你考虑同一个 `Contact` 类集合，你可以使用 `CollectionView` 如下所示重写用户界面：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n             xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n      \
  \       x:Class=\"DataBinding.CollectionViewSample\"\n             Padding=\"0,20,0,0\"\
  >\n  <ContentPage.Content>\n    <StackLayout>\n      <CollectionView x:Name=\"ContactList\"\
  \n                      ItemsSource=\"{Binding Contacts}\" Margin=\"15\"\n     \
  \                 SelectionMode=\"Single\"\n                      SelectionChanged=\"\
  ContactList_ SelectionChanged\"\n                      VerticalScrollBarVisibility=\"\
  Never\"\n                      HorizontalScrollBarVisibility=\"Never\">\n      \
  \  <CollectionView.ItemTemplate>\n          <DataTemplate>\n            <StackLayout\
  \ Margin=\"10\">\n              <Label Text=\"Full name:\"/>\n              <Entry\
  \ Text=\"{Binding LastName}\"/>\n              <Label Text=\"First name:\"/>\n \
  \             <Entry Text=\"{Binding FirstName}\"/>\n              <Label Text=\"\
  Date of birth:\"/>\n              <DatePicker Date=\"{Binding DateOfBirth, Mode=TwoWay}\"\
  />\n              <StackLayout Orientation=\"Horizontal\">\n                <Label\
  \ Text=\"Is Family Member?:\" VerticalOptions=\"Center\"/>\n                <CheckBox\
  \ IsChecked=\"{Binding IsFamilyMember}\" VerticalOptions=\"Center\"/>\n        \
  \      </StackLayout>\n            </StackLayout>\n          </DataTemplate>\n \
  \       </CollectionView.ItemTemplate>\n        <CollectionView.EmptyView>\n   \
  \       <Label Text=\"No data is available\" TextColor=\"Red\" FontSize=\"Large\"\
  \n                 VerticalOptions=\"Center\" VerticalAlignment=\"Center\"\n   \
  \              HorizontalOptions=\"Center\" HorizontalAlignment=\"Center\"/>\n \
  \       </CollectionView.EmptyView>\n      </CollectionView>\n    </StackLayout>\n\
  \  </ContentPage.Content>\n</ContentPage>\n```\n\n在 `CollectionView` 的定义中，你可以看到集合仍然通过\
  \ `ItemsSource` 属性分配。此外，你发现了以下元素：\n\n*   `SelectionMode`：指定用户可以选择单个（single）或多个（multiple）项目。如果设置为\
  \ `None`，则禁用选择。在 `ListView` 中，你需要编写自定义渲染器来禁用选择。\n*   `HorizontalScrollBarVisibility`\
  \ 和 `VerticalScrollBarVisibility`：这些属性允许设置水平垂直滚动条的可见性。支持的值有 `Always`、`Never` 和 `Default`。后者采用目标行为。\n\
  *   `SelectionChanged`：当用户选择一个或多个项目时触发的事件，取决于 `SelectionMode` 的值。\n\n项目的呈现方式通过 `DataTemplate`\
  \ 提供，类似于 `ListView`，但这种情况下你不再需要单元格，可以使用布局。在之前的 XAML 底部，你还可以看到 `CollectionView` 暴露了另一个属性属性：`EmptyView`。它可以分配一个在绑定集合为空或空时自动显示的单个视图或布局。这非常有用，因为它消除了在集合为空时编写自定义用户界面的需求，这是你在处理\
  \ `ListView` 时需要做的。在运行示例之前，你需要在页面的后台文件中将集合绑定到用户界面，如下：\n\n```csharp\nprivate ContactViewModel\
  \ ViewModel { get; set; }\n\npublic CollectionViewSample()\n{\n  InitializeComponent();\n\
  \  ViewModel = new ContactViewModel();\n  BindingContext = ViewModel;\n}\n```\n\n\
  在外观方面，使用 `CollectionView` 还有额外的优势。默认情况下，项目垂直排列，且每行包含一个项目，但你可以快速更改这种行为。例如，你可以轻松地定义一个水平列表视图如下所示：\n\
  \n```xml\n<CollectionView.ItemsLayout>\n  <LinearItemsLayout Orientation=\"Horizontal\"\
  />\n</CollectionView.ItemsLayout>\n```\n\n\n\n\n`ItemsLayout` 属性可以使用两个对象进行设置：`LinearItemsLayout`\
  \ 和 `GridItemsLayout`。使用 `LinearItemsLayout`，你可以让 `CollectionView` 每行显示一个项目，可以是垂直或水平方向。当未指定\
  \ `LinearItemsLayout` 时，默认认为垂直方向，如之前的代码列表所示。`GridItemsLayout` 对象允许创建网格视图，如下所示：\n\
  \n```xml\n<CollectionView.ItemsLayout>\n    <GridItemsLayout Orientation=\"Vertical\"\
  \ Span=\"3\"/>\n</CollectionView.ItemsLayout>\n```\n\n你只需要通过 `Span` 属性指定方向 `Orientation`（`Horizontal`\
  \ 或 `Vertical`）以及每行的项目数量。显然，你需要考虑需要展示的每个项目的大小以及屏幕上的可用空间。图 9.6 显示了垂直网格视图的示例：\n\n\
  ![](img/Figure-9.6.jpg)\n\n**图 9.6:** 实现网格视图\n\n也有必要说明一下如何处理 `SelectionChanged`\
  \ 事件。以下代码演示了这一点：\n\n```sharp\nprivate void ContactList_SelectionChanged(object sender,\
  \ SelectionChangedEventArgs e)\n{\n    // 针对单选情况\n    var selectedPerson = this.ContactList.SelectedItem\
  \ as Contact;\n    // 针对多选情况：\n    var singlePerson = e.CurrentSelection.FirstOrDefault()\
  \ as Contact;\n    var selectedObjects = e.CurrentSelection.Cast<Contact>();\n \
  \   foreach (var person in selectedObjects)\n    {\n        // 在此处处理你的对象属性...\n\
  \    }\n}\n```\n\n如果 `SelectionMode` 被赋值为 `Single`；你只需要事件处理程序中的第一行代码，这在你查看 `ListView`\
  \ 时已经见过。如果 `SelectionMode` 被赋值为 `Multiple`，你需要对 `SelectionChangedEventArgs` 对象实例的\
  \ `CurrentSelection` 属性（类型为 `IReadOnlyList<object>`）调用一个名为 `Cast` 的泛型方法，并将目标类型作为\
  \ `type` 参数传递。`Cast` 将集合中的每个对象转换为相应类型的集合。作为一种现代且易于使用的数据视图，`CollectionView` 迅速进入了数千个项目的代码库，同时也建议在新项目中使用它。\n\
  \n# 使用 CarouselView 制作滚动列表 (#toc.xhtml_s285a)\n\n`CarouselView` 是另一种允许滚动列表的视图，它具有专门支持滑动手势的额外成员。在底层，`CarouselView`\
  \ 构建在 `CollectionView` 之上，它允许水平和垂直方向的滚动。为了更好地理解，请先考虑 图 9.7，在图中你可以通过滑动视图在 `CarouselView`\
  \ 内部滚动项目：\n\n![](img/Figure-9.7.jpg)\n\n**图 9.7:** 在 CarouselView 中滑动项目\n\n以下代码演示了如何实现一个\
  \ `CarouselView`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage\
  \ xmlns=\"http://xamarin.com/schemas/2014/forms\"\n             xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\
  \n             x:Class=\"DataBinding.CarouselViewSample\" Padding=\"0,20,0,20\"\
  >\n    <ContentPage.Content>\n        <StackLayout Orientation=\"Vertical\">\n \
  \           <CarouselView x:Name=\"PeopleList\" ItemsSource=\"{Binding Contacts}\"\
  \n                          CurrentItemChanged=\"PeopleList_CurrentItemChanged\"\
  \n                          PositionChanged=\"PeopleList_PositionChanged\"\n   \
  \                       CurrentItem=\"{Binding SelectedContact}\">\n           \
  \     <CarouselView.ItemsLayout>\n                    <LinearItemsLayout Orientation=\"\
  Horizontal\"\n                                      SnapPointsAlignment=\"Center\"\
  \n                                      SnapPointsType=\"Mandatory\"/>\n       \
  \         </CarouselView.ItemsLayout>\n                <CarouselView.ItemTemplate>\n\
  \                    <DataTemplate>\n                        <Frame HasShadow=\"\
  False\" BorderColor=\"Blue\" Margin=\"20\">\n                            <StackLayout>\n\
  \                                <Label Text=\"Last name:\"/>\n                \
  \                <Entry Text=\"{Binding LastName}\"/>\n                        \
  \        <Label Text=\"First name:\"/>\n                                <Entry Text=\"\
  {Binding FirstName}\"/>\n                                <Label Text=\"Date of birth:\"\
  />\n                                <DatePicker Date=\"{Binding DateOfBirth, Mode=TwoWay}\"\
  />\n                                <StackLayout Orientation=\"Horizontal\">\n \
  \                                   <Label Text=\"Is Family Member??\" VerticalOptions=\"\
  Center\"/>\n                                    <CheckBox IsChecked=\"{Binding IsFamilyMember}\"\
  \ VerticalOptions=\"Center\"/>\n                                </StackLayout>\n\
  \                            </StackLayout>\n                        </Frame>\n\
  \                    </DataTemplate>\n                </CarouselView.ItemTemplate>\n\
  \            </CarouselView>\n        </StackLayout>\n    </ContentPage.Content>\n\
  </ContentPage>\n```\n\n与 `CollectionView` 相比，有几处不同。首先，当视图滚动时会触发 `PositionChanged`\
  \ 事件。位置以 `int` 类型返回，通过 `PositionChangedEventArgs` 对象的 `CurrentPosition` 属性暴露：\n\n\
  ```csharp\nprivate void PeopleList_PositionChanged(object sender, PositionChangedEventArgs\
  \ e)\n{\n    int currentPosition = e.CurrentPosition;\n    int previousPosition\
  \ = e.PreviousPosition;\n}\n```\n\n通过 `int` 类型的 `PreviousPosition` 属性也很容易获取之前的位置。相反，当用户在视图中选择项目时，会触发\
  \ `CurrentItemChanged` 事件。你可以按照如下方式获取相关信息：\n\n```csharp\nprivate void PeopleList_CurrentItemChanged(object\
  \ sender, CurrentItemChangedEventArgs e)\n{\n    var currentItem = e.CurrentItem\
  \ as Contact;\n    var previousItem = e.PreviousItem as Contact;\n}\n```\n\n`CurrentItem`\
  \ 和 `PreviousItem` 属性都是 `object` 类型，你需要对它们进行转换。你可以通过 `ItemsLayout` 属性及其 `LinearItemsLayout`\
  \ 成员对视图的外观进行进一步控制，其值可以是 `Horizontal` 或 `Vertical`。你还可以通过 `SnapPointType` 属性控制捕捉点。这些属性决定了滚动项目的行为，例如让它们带有惯性地滚动（`Mandatory`）或一次滚动一个（`MandatorySingle`）。可以通过赋值\
  \ `None` 来禁用捕捉点。相反，`SnapPointsAlignment` 属性指定了捕捉点如何对齐项目，它可以赋值为 `Start`、`Center`\
  \ 或 `End`。`CarouselView` 允许实现非常常用的用户体验，大多数情况下也建议显示指示器。`IndicatorView` 允许在 `CarouselView`\
  \ 中显示项目数量和当前项目。为了更好地理解，请看图 9.8 底部的指示器：\n\n# 使用 IndicatorView 显示项目指示 (#toc.xhtml_s286a)\n\
  \n`IndicatorView` 允许显示 `CarouselView` 中的项目数量和当前项目。过去你需要手动完成，但在最新版本的 Xamarin.Forms\
  \ 中，你可以利用 `IndicatorView`。\n\n实现 `IndicatorView` 非常简单。你可以通过如下简单的声明在视觉树中添加一个：\n\n\
  ```xml\n<IndicatorView x:Name=\"PersonIndicatorView\"\n               IndicatorColor=\"\
  LightGray\"\n               SelectedIndicatorColor=\"DarkGray\"\n              \
  \ HorizontalOptions=\"Center\" />\n```\n\n注意你如何通过 `IndicatorColor` 属性指定普通指示器的颜色，通过\
  \ `SelectedIndicatorColor` 属性指定当前指示器的颜色。重要的是必须为视图分配一个名称，因为你将通过将其名称传递给 `CarouselView`\
  \ 的 `IndicatorView` 属性来引用 `IndicatorView`，如下所示：\n\n```xml\n<CarouselView x:Name=\"\
  PeopleList\" ItemsSource=\"{Binding Contacts}\"\n              CurrentItemChanged=\"\
  PeopleList_CurrentItemChanged\"\n              PositionChanged=\"PeopleList_PositionChanged\"\
  \n              IndicatorView=\"PersonIndicatorView\"\n              CurrentItem=\"\
  {Binding SelectedContact}\">\n```\n\n\n\n\n你不需要做其他任何操作。`CarouselView` 和 `IndicatorView`\
  \ 将保持连接，后者将能够根据 `CarouselView` 的当前项目显示当前的指示器。\n\n# 使用 Picker 选择项目 (#toc.xhtml_s287a)\n\
  \n`Picker` 是一个 Xamarin.Forms 视图，它允许从列表中选择项目，并映射到目标系统的选择器控件。为了更好地地理解，请参考图 9.9，它演示了如何使用\
  \ `Picker` 从列表中选择一种水果：\n\n![](img/Figure-9.9.jpg)\n\n**图 9.9：** 使用 Picker 进行项目选择\n\
  \n如你所见，`Picker` 调用了系统的选择器。与之前讨论的视图一样，它暴露了一个 `ItemsSource` 属性，该属性被赋予实现了 `IEnumerable`\
  \ 接口的集合。下面的 XAML 代码显示了如何实现示例 `Picker`：\n\n```xml\n<StackLayout VerticalOptions=\"\
  FillAndExpand\">\n    <Label Text=\"Select your favorite fruit:\"/>\n    <Picker\
  \ x:Name=\"FruitPicker\" ItemDisplayBinding=\"{Binding Name}\"\n            SelectedIndexChanged=\"\
  FruitPicker_SelectedIndexChanged\"/>\n</StackLayout>\n```\n\n适当的注释将帮助你理解绑定集合是如何实现的。在页面的构造函数中，你可以拥有以下代码：\n\
  \n```csharp\npublic PickerSample()\n{\n    InitializeComponent();\n    var apple\
  \ = new Fruit { Name = \"Apple\", Color = \"Green\" };\n    var strawberry = new\
  \ Fruit { Name = \"Strawberry\", Color = \"Red\" };\n    var orange = new Fruit\
  \ { Name = \"Orange\", Color = \"Orange\" };\n    var fruitList = new ObservableCollection<Fruit>()\n\
  \    { apple, strawberry, orange };\n    this.FruitPicker.ItemsSource = fruitList;\n\
  }\n```\n\n如你所示，代码定义了一些 `Fruit` 类型的对象，该类声明如下：\n\n```csharp\npublic class Fruit\n\
  {\n    public string Name { get; set; }\n    public string Color { get; set; }\n\
  }\n```\n\n接下来，声明了一个新的 `ObservableCollection<Fruit>` 并填充了所有对象。最后，`Picker` 的 `ItemsSource`\
  \ 属性被赋予了这样一个集合。每个 `Fruit` 对象有两个属性：`Name` 和 `Color`，但 `Picker` 并不知道在选择视图中显示哪一个。因此，`Picker`\
  \ 的 `ItemDisplayBinding` 属性被赋予绑定对象的属性名称，该属性将用于在列表中显示值（参见前面的 XAML 代码）。当用户在列表中选择一个项目时，`Picker`\
  \ 会触发一个名为 `SelectedIndexChanged` 的事件。事件的名称清楚地表明该视图是基于项目位置工作的，而不是基于项目实例。然而，你不需要处理索引和项目位置。事实上，你可以快速获取所选项目，如下所示：\n\
  \n```csharp\nprivate async void FruitPicker_SelectedIndexChanged(object sender,\
  \ EventArgs e)\n{\n    var currentFruit = this.FruitPicker.SelectedItem as Fruit;\n\
  \    if (currentFruit != null)\n        await DisplayAlert(\"Selection\",\n    \
  \        $\"You selected {currentFruit.Name}\", \"OK\");\n}\n```\n\n简而言之，你将 `Picker.SelectedItem`\
  \ 属性的值转换为预期类型的对象（在本例中为 `Fruit`）。通过 `as` 运算符进行转换是一种良好的做法，这样转换失败时将返回 `null` 而不是抛出异常，你将能够一个简单的\
  \ `if` 块检查转换结果是否不为空。一旦你获得了转换后的对象，就可以根据需要对其进行操作。\n\n# 引入可绑定布局 (#toc.xhtml_s288a)\n\
  \nXamarin.Forms 通过所谓的“可绑定布局”（bindable layouts）功能允许任何布局支持数据绑定。假设你想对 `StackLayout`\
  \ 绑定在之前关于 `ListView` 和 `CollectionView` 示例中相同的 `Contact` 对象集合。你可以编写以下 XAML：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \n             xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n      \
  \       x:Class=\"DataBinding.BindableLayoutsSamplePage\">\n    <ContentPage.Content>\n\
  \        <StackLayout BindableLayout.ItemsSource=\"{Binding Contacts}\">\n     \
  \       <BindableLayout.ItemTemplate>\n                <DataTemplate>\n        \
  \            <StackLayout Margin=\"10\">\n                        <Label Text=\"\
  Full name:\"/>\n                        <Entry Text=\"{Binding LastName}\"/>\n \
  \                       <Label Text=\"First name:\"/>\n                        <Entry\
  \ Text=\"{Binding FirstName}\"/>\n                        <Label Text=\"Date of\
  \ birth:\"/>\n                        <DatePicker Date=\"{Binding DateOfBirth, Mode=TwoWay}\"\
  />\n                        <StackLayout Orientation=\"Horizontal\">\n         \
  \                   <Label Text=\"Is Family Member?:\" VerticalOptions=\"Center\"\
  />\n                            <CheckBox IsChecked=\"{Binding IsFamilyMember}\"\
  \ VerticalOptions=\"Center\"/>\n                        </StackLayout>\n       \
  \             </StackLayout>\n                </DataTemplate>\n            </BindableLayout.ItemTemplate>\n\
  \            <BindableLayout.EmptyView>\n                <Label Text=\"No data available\"\
  \ TextColor=\"Red\" FontSize=\"Large\" VerticalOptions=\"Center\" HorizontalOptions=\"\
  Center\"/>\n            </BindableLayout.EmptyView>\n        </StackLayout>\n  \
  \  </ContentPage.Content>\n</ContentPage>\n```\n\n以下是最相关要点的总结：\n\n*   布局可以利用可绑定布局功能支持数据绑定。\n\
  *   `BindableLayout.ItemsSource` 属性被赋予一个集合，就像你使用 `ListView` 或 `CollectionView` 时做的一样。\n\
  *   你使用 `BindableLayout.ItemTemplate` 属性定义显示项目的模板，再次就像你使用 `ListView` 或 `CollectionView`\
  \ 时做的一样。\n*   通过 `BindableLayout.EmptyView`，你可以指定当绑定集合为空时显示的视图。\n\n可绑定布局的渲染性能很差。因此，你应该避免使用它们，并选择\
  \ `CollectionView` 或 `ListView` 视图，即使对于短列表也是如此。根据多个项目中修复性能问题的经验，`CollectionView`\
  \ 可以在 1 秒内渲染，而可绑定布局可能需要 7 或 8 秒。\n\n# 高级数据绑定：模型-视图-视图模式 (#toc.xhtml_s289a)\n\n模型-视图-视图模式（或\
  \ MVVM）是一种用于基于 XAML 的开发平台（如 Xamarin.Forms、WPF 和 UWP）的架构模式。它提供了层之间强且清晰的分。为了简单起见，你把之前关于在\
  \ `CollectionView` 中显示 `Contact` 对象集合的示例转换为基于 MVVM 的代码。模型是数据。ViewModel 代表业务逻辑。视图是界面。基于这些假设，`Contact`\
  \ 类是模型。业务逻辑封装在一个新的 ViewModel 类中，该类将暴露 `Contact` 对象集合以及对数据的操作。视图部分将定义在 XAML 页面中。使用\
  \ MVVM 时，XAML 页面及其后台代码文件仅包含与用户界面和数据绑定分配相关的代码，不再包含其他内容。使用 MVVM 有许多好处，特别是在大型项目中。以下是最重要的：\n\
  \n*   可以在 XAML 中更改用户界面，而不会影响任何处理数据的代码。\n*   ViewModel 中的业务逻辑应该与对象交互，而无需知道它们的来源。这使得更改数据访问层（例如从\
  \ SQLite 数据库更改到远程数据服务）而无需更改逻辑成为可能。\n\n\n\n\nMVVM 可能会相当复杂，但你对它使用得越多，就越能体会它的优势。市场上有很多几个库可以简化你实现\
  \ MVVM 的方式，它们将在本节末尾列出。尽管如此，你需要了解 MVVM 背后的原理，因此我们在这里不会直接使用它们。\n\n**提示：良好的做法是保持代码组织良好，通过将模型放在名为\
  \ `Models` 的子文件夹中，将 ViewModel 放在名为 `ViewModels` 的子文件夹中，将视图放在名为 `Views` 的子文件夹中。你还可以创建额外的子文件夹来按区域更好地组织模型、ViewModel\
  \ 和视图。**\n\n# 定义数据模型\n\n在 MVVM 中，模型（model）代表数据。在 C# 中，数据由类表示。例如，之前使用的 `Contact`\
  \ 类就是当前示例中的模型。在这里重新列出它的代码供你参考：\n\n```csharp\npublic class Contact : INotifyPropertyChanged\n\
  {\n    private string _lastName;\n    public string LastName\n    {\n        get\n\
  \        {\n            return _lastName;\n        }\n        set\n        {\n \
  \           _lastName = value;\n            OnPropertyChanged();\n        }\n  \
  \  }\n    private string _firstName;\n    public string FirstName\n    {\n     \
  \   get\n        {\n            return _firstName;\n        }\n        set\n   \
  \     {\n            _firstName = value;\n            OnPropertyChanged();\n   \
  \     }\n    }\n    private DateTime dateOfBirth;\n    public DateTime DateOfBirth\n\
  \    {\n        get\n        {\n            return dateOfBirth;\n        }\n   \
  \     set\n        {\n            dateOfBirth = value;\n            OnPropertyChanged();\n\
  \        }\n    }\n    private bool _isFamilyMember;\n    public bool IsFamilyMember\n\
  \    {\n        get\n        {\n            return _isFamilyMember;\n        }\n\
  \        set\n        {\n            _isFamilyMember = value;\n            OnPropertyChanged();\n\
  \        }\n    }\n    public event PropertyChangedEventHandler PropertyChanged;\n\
  \    private void OnPropertyChanged([CallerMemberName] string propertyName = null)\n\
  \    {\n        PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));\n\
  \    }\n}\n```\n\n你需要记住的是，你的模型应该实现 `INotifyPropertyChanged` 接口以支持更改通知。默认情况下，当创建类的新实例时，`DateOfBirth`\
  \ 属性被赋值为 1900 年 1 月 1 日。你可能想通过添加类似下面的构造函数将默认值改为不同的日期：\n\n```csharp\npublic Contact()\n\
  {\n    DateOfBirth = DateTime.Today;\n    IsFamilyMember = true;\n}\n```\n\n默认日期被赋值为今天的日期，并且每个新实例的\
  \ `IsFamilyMember` 也被赋值为 true。原因是你将在接下来的章节中描述，将实现只返回家庭成员的查询。\n\n### 实现业务逻辑：Commands\
  \ 和 ViewModels\n\nViewModel 是该模式至关重要的部分。ViewModel 类只知道模型的数据类型，但它不知道数据来自哪里，最重要的是，它不知道哪个视图将使用该\
  \ ViewModel。这意味着 ViewModel 必须以尽可能抽象的方式工作。ViewModel 有两个主要目的：向视图暴露数据以及实现根据你的业务逻辑操作数据的动作。视图通过\
  \ ViewModel 访问数据而不是直接访问数据，原因是为了过滤操作并确保数据由中间层处理。你接做的第一件事是创建一个按照惯例以 `ViewModel` 结尾的\
  \ ViewModel 类，例如 `ContactViewModel`。该类必须实现 `INotifyPropertyChanged` 接口。\n\n### 暴露数据\n\
  \nViewModel 类的第一部分暴露了一个集合、一个 `Contact` 类的实例，并实现了更改通知：\n\n```csharp\npublic class\
  \ ContactViewModel: INotifyPropertyChanged\n{\n    public ObservableCollection<Contact>\
  \ Contacts { get; set; }\n    private Contact _selectedContact;\n    public Contact\
  \ SelectedContact\n    {\n        get\n        {\n            return _selectedContact;\n\
  \        }\n        set\n        {\n            _selectedContact = value;\n    \
  \        OnPropertyChanged();\n        }\n    }\n    public event PropertyChangedEventHandler\
  \ PropertyChanged;\n    private void OnPropertyChanged([CallerMemberName] string\
  \ propertyName = null)\n    {\n        PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));\n\
  \    }\n}\n```\n\n下一步是加载数据。在当前示例中，数据是在代码中创建的。在本章的最后一部分，你将学习如何从 SQLite 加载数据。以下方法演示了这一点：\n\
  \n```csharp\nprivate void LoadSampleData()\n{\n    Contacts = new ObservableCollection<Contact>();\n\
  \    // sample data\n    Contact person1 = new Contact\n    {\n        FirstName\
  \ = \"Alessandro\",\n        LastName = \"Del Sole\",\n        IsFamilyMember =\
  \ false,\n        DateOfBirth = new DateTime(1977, 5, 10)\n    };\n    Contact person2\
  \ = new Contact\n    {\n        FirstName = \"Robert\",\n        LastName = \"White\"\
  ,\n        IsFamilyMember = false,\n        DateOfBirth = new DateTime(1960, 2,\
  \ 1)\n    };\n    Contact person3 = new Contact\n    {\n        FirstName = \"Joseph\"\
  ,\n        LastName = \"Green\",\n        IsFamilyMember = true,\n        DateOfBirth\
  \ = new DateTime(1980, 4, 2)\n    };\n    Contacts.Add(person1);\n    Contacts.Add(person2);\n\
  \    Contacts.Add(person3);\n}\n```\n\n这段代码创建了新的联系人并填充了集合。\n\n### 使用 Commands 定义动作\n\
  \n下一步是定义任何调用者都可以调用的动作。例如，从集合中添加或删除项目可以视为动作。为了实现这一点，你需要定义命令。命令是 `Command` 类型的对象，视图可以通过数据绑定访问它，正如你将在后续章节中看到的。命令必须定义为属性，如下例所示定义了用于添加和删除联系人的命令：\n\
  \n```csharp\npublic Command AddCommand { get; set; }\npublic Command DeleteCommand\
  \ { get; set; }\n```\n\n作为第二步，命令属性必须赋值为 `Command` 类实例，其构造函数需要调用命令时执行的动作，以及可选的布尔条件，以指定动作是否可以执行。以下是构造函数的代码演示了这一点。注意代码还调用了\
  \ `LoadSampleData` 方法来加载数据，并包含了类的括号：\n\n```csharp\npublic ContactViewModel()\n{\n\
  \    LoadSampleData();\n    AddCommand = new Command(() => Contacts.Add(new Contact()));\n\
  \    DeleteCommand = new Command<Contact>((contact) => Contacts.Remove(contact),\n\
  \    (contact) => contact != null);\n}\n```\n\n`Command` 类实例至少接受一个参数 `Execute`，类型为\
  \ `Action<T>`，代表调用命令时执行的动作。可选，你可以指定类型为 bool 的 `CanExecute` 参数，以判断命令是否可以执行。首先考虑 `AddCommand`\
  \ 对象。它被赋值为 `Command` 实例，其第一个参数是 `Action<T>`，代表针对数据执行的动作。具体来说，`Action<T>` 在语法上表示为\
  \ lambda 表达式，其体向集合添加了新的 `Contact` 实例。对于 `DeleteCommand` 对象，还有最后一步。事实上，指定了一个布尔条件来处理\
  \ `CanExecute` 参数。在这种情况下，只有当传递了 `Contact` 类实例给命令时，动作才会执行。\n\n# 设计用户界面\n\n示例用户界面将由两个主要组件组成：一个显示联系人列表的\
  \ `CollectionView`，以及一个包含两个按钮的工具栏，用于调用 ViewModel 中定义的命令。以下 XAML 演示了这一点：\n\n\n\n\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
  \ xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\" x:Class=\"MvvmSample.MainPage\"\
  \ Padding=\"0,20,0,0\">\n  <StackLayout>\n    <CollectionView x:Name=\"ContactsList\"\
  \ ItemsSource=\"{Binding Contacts}\" SelectionMode=\"Single\" SelectedItem=\"{Binding\
  \ SelectedContact}\" VerticalScrollBarVisibility=\"Never\" HorizontalScrollBarVisibility=\"\
  Never\">\n      <CollectionView.ItemTemplate>\n        <DataTemplate>\n        \
  \  <StackLayout Margin=\"10\">\n            <Label Text=\"First name:\"/>\n    \
  \        <Entry Text=\"{Binding FirstName}\"/>\n            <Label Text=\"Last name:\"\
  />\n            <Entry Text=\"{Binding LastName}\"/>\n            <Label Text=\"\
  Date of birth:\"/>\n            <DatePicker Date=\"{Binding DateOfBirth, Mode=TwoWay}\"\
  />\n            <StackLayout Orientation=\"Horizontal\">\n              <Label Text=\"\
  Is Family Member?\"?\" VerticalOptions=\"Center\"/>\n              <CheckBox IsChecked=\"\
  {Binding IsFamilyMember}\" VerticalOptions=\"Center\"/>\n            </StackLayout>\n\
  \          </StackLayout>\n        </DataTemplate>\n      </CollectionView.ItemTemplate>\n\
  \    </CollectionView>\n    <StackLayout Orientation=\"Horizontal\">\n      <Button\
  \ Text=\"Add\" Command=\"{Binding AddCommand}\"/>\n      <Button Text=\"Delete\"\
  \ Command=\"{Binding DeleteCommand}\" CommandParameter=\"{Binding Source={x:Reference\
  \ ContactsList}, Path=SelectedItem}\"/>\n    </StackLayout>\n  </StackLayout>\n\
  </ContentPage>\n```\n\n所有绑定的视图都指向 viewmodel 中定义的对象。如你所示，`CollectionView` 的定义仍然与专用示例中的相同，并且它仍然通过绑定（Binding）表达式指向数据。在代码底部，你可以看到对于两个\
  \ `Button` 视图，`Command` 属性被赋值了一个绑定表达式，该表达式指向 viewmodel 中的一个命令。通过这种方式，不再需要在视图的后置代码（code-behind）中定义和处理\
  \ `Click` 事件，这完美符合 MVVM 的分离原则。注意，对于第二个按钮，还指定了 `CommandParameter`。此属性允许将对象作为参数传递给绑定的\
  \ `Command`。在这种情况下，参数是 `CollectionView (x:Reference ContactsList)` 中当前选中的项目（`Path=SelectedItem`）。最后部分是将\
  \ viewmodel 的实例作为页面的数据源，这可以在后置代码中如下实现：\n\n```csharp\nprivate ContactViewModel ViewModel\
  \ { get; set; }\n\npublic MainPage()\n{\n  InitializeComponent();\n  ViewModel =\
  \ new ContactViewModel();\n  BindingContext = ViewModel;\n}\n```\n\n如果你现在运行代码，你将看到与图\
  \ 10.9 中所示类似的结果：\n\n![](img/Figure-9.10.jpg)\n\n**图 9.10：** 使用 Model-View-ViewModel\
  \ 进行数据绑定\n\n所有内容都通过数据绑定运行，且 viewmodel 以抽象的方式运行。注意在你在列表中选择一个项目之前，`Delete` 按钮是禁用的；这是因为在后台，视图的\
  \ `IsEnabled` 属性自动绑定到为该命令实现的 `CanExecute` 逻辑的结果上。正如你可以想象的，MVVM 远不止于此，但你在本章中看到的正是你入门这一模式并能够上手现有的\
  \ MVVM 实现所需要的内容。\n\n**一个常见的任务是从当前页面打开另一个页面，但在 MVVM 中这无法直接完成（视图只能与其 viewmodel 通信），且\
  \ viewmodel 无法打开视图。可以通过 `MessagingCenter` 类来实现，该类在第 11 章管理应用程序周期 中进行了描述，因此你仍然会接触\
  \ MVVM。**\n\n### MVVM 框架\n\nMVVM 是一种流行的模式，已经创建了许多库来使其工作更简单，包括对更复杂任务的支持。最流行的库列举如下：\n\
  \n*   **FreshMvvm** ([`www.michaelridland.com/xamarin/freshmvvm-mvvm-framework-designed-xamarin-forms/`](http://www.michaelridland.com/xamarin/freshmvvm-mvvm-framework-designed-xamarin-forms/)).\n\
  *   **MVVM Light** ([`www.mvvmlight.net/`](http://www.mvvmlight.net/)).\n*   **Prism**\
  \ ([`github.com/PrismLibrary/Prism`](https://github.com/PrismLibrary/Prism)).\n\
  *   **MvvmCross** ([`www.mvvmcross.com/`](https://www.mvvmcross.com/)).\n\nFreshMvvm\
  \ 是专门为 Xamarin.Forms 设计的，而 Prism 由微软支持。总的来说，它们都是很好的库，并且每一个都完全支持 MVVM 模式和原则。\n\n\
  ### 下拉刷新手势：RefreshView\n\n大多数应用程序允许通过简单的手势重新加载列表。RefreshView` 提供了内置的下拉刷新功能。你可以将\
  \ `CollectionView` 封装在 `RefreshView` 内部，如下：\n\n```xml\n<RefreshView RefreshColor=\"\
  Blue\" IsRefreshing=\"{Binding IsRefreshing}\" Command=\"{Binding RefreshCommand}\"\
  >\n  <CollectionView x:Name=\"ContactsList\">\n    …\n  </CollectionView>\n</RefreshView>\n\
  ```\n\n你分配了三个重要的属性：\n\n*   `RefreshColor`，`Color` 类型，允许你为指示器分配颜色；否则使用系统默认颜色。\n*\
  \   `IsRefreshing`，`bool` 类型，在你想要显示指示器时赋值为 `true`，在想要停止时赋值为 `false`。\n*   `Command`\
  \ 被赋值一个执行重新加载数据的命令。\n\n`IsRefreshing` 对象被赋值了一个绑定表达式，原因是数据刷新逻辑位于 viewmodel 中，因此你不应该在视图的后置代码中直接赋值\
  \ true 或 false。此时，你将对 viewmodel 进行一些更改。首先，你需要添加一个名为 `IsRefreshing` 的属性，如下：\n\n```csharp\n\
  private bool _isRefreshing;\npublic bool IsRefreshing\n{\n  get\n  {\n    return\
  \ _isRefreshing;\n  }\n  set\n  {\n    _isRefreshing = value;\n    OnPropertyChanged();\n\
  \  }\n}\n```\n\n其次，你需要一个新的命令，如下：\n\n```csharp\npublic Command RefreshCommand { get;\
  \ set; }\n```\n\n在 viewmodel 的构造函数中，你将命令分配某些加载数据的代码。以下代码提供了一个模拟耗时操作的示例：\n\n```csharp\n\
  RefreshCommand = new Command(async () =>\n{\n  IsRefreshing = true;\n  LoadSampleData();\n\
  \  // 模拟较长的操作\n  await Task.Delay(2000);\n  IsRefreshing = false;\n});\n```\n\n\
  这里的数据并非来自数据库或网络服务，因此它会立即刷新，而 `Task.Delay` 方法模拟了等待一段时间的过程。注意在加载数据前后为 `IsRefreshing`\
  \ 赋值的方式，当这发生时，会触发更改通知，以便 `RefreshView` 的 `IsRefreshing` 属性相应地更新。\n\n# 使用 SQLite\
  \ 数据库访问本地数据\n\n\n\n\nSQLite 是一种流行的本地数据库引擎，作为 Android 和 iOS 操作系统的部分内容预装的。SQLite 是一个关系型数据库，支持表、列、键、索引以及你对数据库所预期的所有功能。此外，它非常适合以结构化的方式存储应用程序数据。SQLite\
  \ 数据库是 `.db3` 本地文件，存在于设备上应用程序的工作空间内。本章将介绍如何通过实现适当架构，以真实世界的方法来操作 SQLite 数据库。建议你在\
  \ Visual Studio 中打开本节的配套解决方案，命名为 `LocalDataAccess`。该主题相当复杂，它将简化你学习所有讨论领域的方式。作为替代方案，你也可以处理\
  \ MVVM 示例解决方案，该方案扩展了此处讨论的功能。\n\n# 安装 SQLite NuGet 包\n\n在编写代码之前，有必要安装一个 NuGet 包，以便使用\
  \ C# 与 SQLite 交互并使用其高级功能（如 LINQ）。存在很多库，但你需要安装的是名为 `sqlite-net-pcl` 的包，它由 Praeclarum\
  \ 开发，如你在图 9.11 中所示。这是一个免费库，也作为开源项目可用：\n\n![](img/Figure-9.11.jpg)\n\n**图 9.11:**\
  \ 安装 SQLite NuGet 包\n\n确保为解决方案中的所有项目都安装了该包。\n\n# 获取数据库路径\n\n一旦安装了 NuGet 包，定义一个带有静态属性的类，包含磁盘上数据库文件的路径是一个好主意。在配套解决方案中，你可以找到一个名为\
  \ `DataAccess\\DataAccessHelper.cs` 的文件，其代码如下：\n\n```csharp\nusing System;\nusing\
  \ System.IO;\n\nnamespace LocalDataAccess.DataAccess\n{\ninternal class DataAccessHelper\n\
  {\n    public const string DatabaseFilename = \"Contacts.db3\";\n    public static\
  \ string DatabasePath\n    {\n        get\n        {\n            var basePath =\
  \ Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData);\n \
  \           return Path.Combine(basePath, DatabaseFilename);\n        }\n    }\n\
  }\n}\n```\n\n这段代码的核心部分是 `DatabasePath` 属性，类型为 `string`，它返回数据库文件的路径。它由本地应用程序文件夹和数据库文件名组成，由\
  \ `DatabaseFilename` 字段标识。文件夹通过静态类 `Environment` 中的名为 `GetFolderPath` 方法检索，并通过 `Environment.SpecialFolder`\
  \ 枚举中的 `LocalApplicationData` 变量进行标识。此代码允许无论目标系统如何都能检索相应的路径；该路径稍后将被使用。\n\n# 实现数据模型\n\
  \n当前示例的目标是从 `Contact` 对象的数据库集合读取并写入数据。为了实现这一目标，使用现有的 `Contact` 类作为数据模型来映射数据库中的表，但它需要进行一些调整。首先，你需要在\
  \ `Contact.cs` 文件中添加 `using SQLite;` 指令，并按如下方式更改类定义：\n\n\n\n```csharp\n[Table(\"\
  Contacts\")]\npublic class Contact : INotifyPropertyChanged\n```\n\n如果未指定 `Table`\
  \ 属性，数据库上的表将使用类名创建，因此该表将命名为 `Contact`。按照惯例，表名通常使用复数形式，因此 `Table` 属性被用于此目的，但一般而言，它允许提供一个与类名不同的表名。你需要做的第二个修改是添加一个被数据库用主键的整数属性，以便对象可以被快速索引和标识。话虽如此，你可以添加以下属性：\n\
  \n```csharp\n[PrimaryKey][AutoIncrement]\npublic int ID { get; set; }\n```\n\n注意\
  \ `PrimaryKey` 和 `AutoIncrement` 属性是如何应用到属性上的，使其被用主键，且其值由数据库引擎自动递增并处理。这些更改可能足够了，但了解\
  \ SQLite 支持通过向数据属性添加特殊属性来支持数据验证对你非常有帮助。例如，你可以为 `LastName` 属性添加以下属性：\n\n```csharp\n\
  [MaxLength(50)][NotNull]\npublic string LastName\n```\n\n`MaxLength` 决定字符串的最大长度，`NotNull`\
  \ 强制要求为此属性提供值。现在你已经完成了所有最小的必要更改，是时候实现数据访问层了。\n\n### 实现数据访问层\n\n在现实世界中，实现数据访问层是一种最佳实践，通常是一个暴露执行数据操作方法的类，并且它与应用程序的所有其他部分独立。为了更好地理解，请考虑配套解决方案中的\
  \ `DataAccess\\ContactsDataAccess.cs` 文件。代码的第一部分定义了一个 `SQLiteConnection` 类型的对象，其实例允许访问数据库并对数据执行操作：\n\
  \n```csharp\npublic class ContactsDataAccess\n{\n    public static SQLiteConnection\
  \ Database;\n    private static object collisionLock = new object();\n    public\
  \ ContactsDataAccess()\n    {\n        Database = new SQLiteConnection(DataAccessHelper.DatabasePath);\n\
  \        Database.CreateTable<Contact>();\n    }\n}\n```\n\n该对象的 `collisionLock`\
  \ 字段稍后将用于防止多个线程访问数据库。`SQLiteConnection` 的构造函数接受数据库路径作为参数，该参数由之前定义的 `DataAccessHelper.DatabasePath`\
  \ 属性暴露。如果没有找到指定名称和路径的数据库，SQLite 引擎将创建一个。`CreateTable` 方法在第一次创建数据库时需要创建表，但如果表已存在，此调用将被忽略。此类方法要求你指定映射所需表的类，在本例中为映射\
  \ `Contacts` 表的 `Contact` 类。\n\n`SQLiteConnection` 类还暴露了读取和写入数据的方法。`Table` 方法在表存在时返回对象集合，如果是第一次访问数据库则会创建一个。实现数据访问层的处是你可以实现进一步的逻辑。例如，以下方法只返回家庭成员的联系人列表：\n\
  \n```csharp\npublic List<Contact> GetFamilyMembers()\n{\n    lock (collisionLock)\n\
  \    {\n        var contacts = Database.Table<Contact>();\n        var result =\
  \ contacts.Where(c => c.IsFamilyMember).ToList();\n        return result;\n    }\n\
  }\n```\n\n如你所示，你可以使用 LINQ 根据你的业务需求过滤集合。注意访问数据库的代码是如何封装在 `lock` 块中的。这防止了在数据库在使用时其他线程访问它。`Table`\
  \ 是一个泛型方法，并将感兴趣的类作为 `type` 参数。这就是方法如何理解你想从哪个表获取数据。`SQLiteConnection` 暴露了匹配所谓 C.R.U.D（创建、读取、更新、删除）操作的方法。它们是\
  \ `Insert`、`Update`、`Delete`、`InsertAll`、`UpdateAll`、`DeleteAll`。前三个方法针对单个实例操作，而其他方法对指定集合中的所有项执行相关操作。以下代码演示了如何插入、编辑和删除联系人：\n\
  \n```csharp\npublic void AddContact(Contact contact)\n{\n    lock (collisionLock)\n\
  \    {\n        Database.Insert(contact);\n    }\n}\n\npublic void DeleteContact(Contact\
  \ contact)\n{\n```\n\n\n\n\n\n```cs\nlock(collisionLock)\n{\n    Database.Delete(contact);\n\
  }\n}\n\npublic void EditContact(Contact contact)\n{\n    lock(collisionLock)\n \
  \   {\n        Database.Update(contact);\n    }\n}\n```\n\n这些方法的使用非常简单。如果需要，这些方法可以在处理数据之前包含进一步的逻辑。现在，假设你的集合中有新的但未保存的联系人，并且你对现有的联系人进行了更改。以下代码演示了如何处理多个对象：\n\
  \n```cs\npublic void SaveAll(IEnumerable<Contact> contacts)\n{\n    lock(collisionLock)\n\
  \    {\n        var existingContacts = contacts.Where(c => c.ID != 0);\n       \
  \ var newContacts = contacts.Where(c => c.ID == 0);\n        Database.UpdateAll(existingContacts);\n\
  \        Database.InsertAll(newContacts);\n    }\n}\n```\n\n`SaveAll` 方法接收你想要操作的对象完整集合，它将由视图模型（viewModel）发送。这段代码的关键点在于，`int`\
  \ 类型的主键值在对象保存到数据库之前为 0，因此你可以区分需要插入的未保存对象与值不为 0 只需要更新的现有对象。你可以实现额外的查询和逻辑，但这些方法已足够满足示例目的。值得提到的是，`SQLiteConnection`\
  \ 类还暴露了一个名为 `Query` 的方法，它允许直接执行 SQL 语句，而不是使用 LINQ。\n\n# 调用数据访问层\n\n数据访问层必须由视图模型调用，视图模型是数据和用户界面之间的中间对象。`ContactViewModel`\
  \ 类应该首先扩展以下两个属性：\n\n```cs\npublic Command SaveAllCommand { get; set; }\npublic ContactsDataAccess\
  \ ContactsDataBase;\n```\n\n第一个命令添加了根据之前描述的 `SaveAll` 方法保存集合中所有对象的选项。`ContactsDataAccess`\
  \ 类型的 `ContactsDataBase` 属性表示数据访问层类的实例。接下来，你可以定义一个加载数据的方法。在这些章节之前的示例中，数据是手动创建的，但现在是从数据库加载的。该方法名为\
  \ `LoadData`，如下所示：\n\n```cs\nprivate void LoadData()\n{\n    Contacts = new ObservableCollection<Contact>(ContactsDataBase.GetFamilyMembers());\n\
  }\n```\n\n注意如何调用 `GetFamilyMembers` 方法来仅检索 `IsFamilyMember` 属性为 true 的 `Contact`\
  \ 类实例，以及结果如何被转换为 `ObservableCollection<Contact>` 并赋值给视图模型的 `Contacts` 属性（该属性是真实数据源）。使视图模型针对数据运行所需的最后一步涉及创建数据访问层类的实例并实现新命令。你可以按照以下方式编辑视图模型的构造函数，添加**粗粗**的部分：\n\
  \n```cs\npublic ContactViewModel()\n{\n    ContactsDataBase = new ContactsDataAccess();\n\
  \    LoadData();\n    AddCommand = new Command(() => Contacts.Add(new Contact()));\n\
  \    DeleteCommand = new Command<Contact>((contact) =>\n    {\n        Contacts.Remove(contact);\n\
  \        if(contact.ID != 0)\n            ContactsDataBase.DeleteContact(contact);\n\
  \    }, (contact) => contact.LastName != null);\n    SaveAllCommand = new Command(()\
  \ => ContactsDataBase.SaveAll(Contacts));\n    RefreshCommand = new Command(async\
  \ () =>\n    {\n        IsRefreshing = true;\n        LoadData();\n        // 模拟较耗时的操作\n\
  \        await Task.Delay(2000);\n        IsRefreshing = false;\n    });\n}\n```\n\
  \n以下是关键点列表：\n\n*   创建了数据访问层（`ContactsDataAcces` 类）的实例，并调用了 `LoadData` 方法。\n*   `AddCommand`\
  \ 的实现没有变化，因为只需要在内存中添加新对象。\n*   `DeleteCommand` 的实现被扩展为也可以从数据库中删除该对象，但仅当其 ID 不为 0\
  \ 时（这意味着它已存在于表中），通过数据访问层类的 `DeleteContact` 方法实现。\n*   新的 `SaveAllCommand` 对象简单地调用数据访问层的\
  \ `SaveAll` 方法，传递当前的联系人集合。后者方法负责对新项和现有项执行逻辑。\n\n现在，是时候扩展用户界面来完成项目了，MVVM 的某些优势将变得更加清晰。\n\
  \n# 扩展用户界面\n\n你为针对数据库加载和保存数据所做的所有更改都在视图模型的命令实现内部完成了，因此用户界面中不需要进行任何更改。事实上，由于数据绑定和\
  \ MVVM 原则，用户界面绑定到视图模型中的命令，而无需知道背后实际上发生了什么，这是 MVVM 的主要优势之一。你唯一做的是添加一个绑定到 `SaveAllCommand`\
  \ 属性的新按钮：\n\n```xml\n<Button Text=\"Save All\" Command=\"{Binding SaveAllCommand}\"\
  />\n```\n\n如果你现在运行应用程序，首先会看到一个空列表，你可以通过点击 `Add` 按钮开始填充。你还会看到 `Delete` 按钮在选择联系人之前是禁用的（参见图\
  \ 9.12），这是因为你在命令中指定了 `CanExecute` 参数：\n\n![](img/Figure-9.12.jpg)\n\n**图 9.12：**\
  \ 与本地数据库交互\n\n点击 `Save All` 将允许你看到所有新的和编辑过的 `Contact` 实例将如何保存到表行中。\n\n\n\n\n移动应用程序不仅应该具备功能性，还应该提供美观的用户界面。这听起来可能是一句讨厌的话，因为显然，以最有效的方式实现目标应该是任何应用程序的重点。然而，应用程序越有吸引力，用户就越可能回来并反复使用，这对于每个应用开发者来说都是关键的。用户体验和用户界面越好，在在使用功能之前被应用程序吸引的用户就越多。在\
  \ Xamarin.Forms 中有很多方法可以制作精美的应用程序，本章将关注代码库最近新增的内容：画笔、形状以及对多媒体内容的支持。你将从绘制的角度学习如何使用这些对象，因为你需要了解它们在技术上是如何工作的。此外，你还将获得有关现实世界中可能性的提示，以提高用户界面的质量。\n\
  \n#结构 (#toc.xhtml_s307a)\n\n在本章中，我们将涵盖以下主题：\n\n* 使用画笔为对象着色\n* 绘制形状\n* 结合多媒体进行操作\n\
  \n# 目标 (#toc.xhtml_s308a)\n\n完成本章后，你将能够为应用程序添加纯色、渐变色、几何形状、自定义形状以及媒体播放功能。\n\n# 创建示例项目\
  \ (#toc.xhtml_s309a)\n\n本章带有一个配套的 Xamarin.Forms 解决方案，你可以用 Visual Studio 打开它以更好地理解示例。如果你想从头开始创建一个项目，可以按照以下步骤：\n\
  \n1. 创建一个名为 `Brushes_Shapes_Media` 的 Xamarin.Forms 解决方案，以便与示例解决方案保持一致。\n2. 不要编辑或删除自动生成的\
  \ `MainPage.xaml` 文件；稍后将用到。\n3. 对于书中讨论的每个布局，添加一个类型为 `Content Page (XAML)` 的新项。为此，右键点击共享项目名称，然后在\
  \ `Context` 菜单中点击 `Add New Item`。\n4. 在 `Add New Item` 对话中，点击左侧的 Xamarin.Forms 节点，然后选择\
  \ `Content Page (XAML)` 模板。\n5. 为新的 XAML 文件分配一个与讨论视图匹配的名称，例如 `Brushes.xaml`，并点击\
  \ `Add`。\n\n对于向项目中添加的每个页面，在 `ContentPage` 中添加一个空的 `StackLayout`，并将其 `VerticalOptions`\
  \ 属性赋值为 `CenterAndExpand`。除非另有指定，这将是后续章节中代码示例的首选布局。\n\n# 使用画笔为对象着色 (#toc.xhtml_s310a)\n\
  \n画笔（Brushes）是 Xamarin.Forms 代码库最近新增的内容。它们是派自 `Brush` 基类的对象，允许使用纯色和渐变色为特定视图着色。为了更好地理解，考虑以下\
  \ Frame 定义，其中 `BackgroundColor` 属性是以普通方式赋值的：\n\n```xml\n<Frame CornerRadius=\"5\"\
  \ BackgroundColor=\"Yellow\"\nMargin=\"20\" WidthRequest=\"150\"\nHeightRequest=\"\
  150\">\n</Frame>\n```\n\n`BackgroundColor` 属性支持 `Color` 类型的值。大多数视图现在还暴露名为 `Background`\
  \ 的属性，其类型为 `Brush`。你可以这样重写之前的代码：\n\n```xml\n<Frame CornerRadius=\"5\" Margin=\"\
  20\" WidthRequest=\"150\" HeightRequest=\"150\">\n  <Frame.Background>\n    <SolidColorBrush\
  \ Color=\"Yellow\"/>\n  </Frame.Background>\n</Frame>\n```\n\n`Brush` 类型的属性允许分配\
  \ `SolidColorBrush`、`LinearGradientBrush` 和 `RadialGradientBrush` 类型的对象。\n\n**画笔的目的是填充视图的背景，因此这就是你最常操作的\
  \ `Brush` 类型属性的原因。**\n\n`SolidColorBrush` 对象用单一颜色填充视图，你为它的 `Color` 属性（类型为 `Color`）分配感兴趣的颜色。在处理单个颜色时，你也可以使用以下紧凑的语法：\n\
  \n```xml\n<Frame CornerRadius=\"5\" Background=\"Yellow\" Margin=\"20\" WidthRequest=\"\
  150\"\nHeightRequest=\"150\">\n</Frame>\n```\n\n你还可以使用 `LinearGradientBrush` 对象创建垂直和水平的线性渐变，并使用\
  \ `RadialGradientBrush` 对象创建圆形渐变。\n\n**提示：使用 `Brush` 类型属性分配单个颜色而不是使用 `Color` 类型属性的唯一原因是，你可以在运行时替换为不同的画笔（例如渐变）。否则，这种选择没有区别。**\n\
  \n# 定义线性渐变 (#toc.xhtml_s311a)\n\n提到的第二个画笔是 `LinearGradientBrush`。它允许创建水平、垂直和对角线渐变。线性渐变基于两个二维坐标绘制，分别称为\
  \ `StartPoint` 和 `EndPoint`。`StartPoint` 代表视图的左上角，默认值为 0,0（这也是它的最小值）。`EndPoint`\
  \ 代表视图的右下角，默认值为 1,1（这也是它的最大值）。在以下代码中，你可以看到如何用线性渐变填充 `Frame` 的背景：\n\n```xml\n<Frame\
  \ CornerRadius=\"5\" Margin=\"20\" WidthRequest=\"150\" HeightRequest=\"150\">\n\
  \  <Frame.Background>\n    <LinearGradientBrush EndPoint=\"1,0\">\n      <GradientStop\
  \ Color=\"Blue\" Offset=\"0.1\"/>\n      <GradientStop Color=\"Violet\" Offset=\"\
  0.5\"/>\n      <GradientStop Color=\"Red\" Offset=\"1.0\"/>\n    </LinearGradientBrush>\n\
  \  </Frame.Background>\n</Frame>\n```\n\n可以看出，渐变中的每种颜色都通过 `GradientStop` 对象设置，该对象也表示位置（类型为\
  \ `double`）。添加的颜色数量没有限制。你通过 `StartPoint` 和 `EndPoint` 的值控制渐变的方向。图 10.1 显示了此代码的结果：\n\
  \n(图 10.1\n\n# 定义圆形渐变 (#toc.xhtml_s312a)\n\n最后一个可用的画名为 `RadialGradientBrush`，允许用圆形渐变填充视图。它仍然像\
  \ `LinearGradientBrush` 一样使用 `GradientStop` 对象来表示颜色及其位置，并暴露了两个新属性：`Radius`（类型为 `double`），决定圆的半径，默认值为\
  \ 0.5（范围为 0 到 1）；以及 `Center`（类型为 `Point`），默认值为 0.5, 0.5，代表渐变的圆心。以下代码显示了一个示例：\n\n\
  ```xml\n<Frame CornerRadius=\"5\" Margin=\"20\" WidthRequest=\"150\" HeightRequest=\"\
  150\">\n  <Frame.Background>\n    <RadialGradientBrush>\n      <GradientStop Color=\"\
  Blue\" Offset=\"0.1\"/>\n      <GradientStop Color=\"Violet\" Offset=\"0.5\"/>\n\
  \      <GradientStop Color=\"Red\" Offset=\"1.0\"/>\n    </RadialGradientBrush>\n\
  \  </Frame.Background>\n</Frame>\n```\n\n此代码的结果如图 10.2 所示：\n\n(图 10.2\n\n在现实世界中，你可能使用线性渐变比使用圆形渐变更多，但了解这种可能性总是好的。\n\
  \n**正如你在图 10.2 中所示，圆在 Android 和 iOS 上显示并不相同。这是视图外观取决于每个系统、屏幕尺寸和外形的案例之一。**\n\n# 绘制形状\
  \ (#toc.xhtml_s313a)\n\n\n\n\n\n形状（Shapes）是一种特殊的视图，允许你在页面中绘制派自基 `Shape` 类的几何图形。Xamarin.Forms\
  \ 中的 `Shape` 对象可以渲染普通形状和自定义形状。在普通形状方面，可用选项有：`Ellipse`、`Rectangle`、`Line` 和 `Polygon`。如你所见，它们的名称都是自解释其的。对于自定义形状，你将使用\
  \ `Polyline` 对象。在介绍每个形状的细节之前，值得提到它们共享几个属性，总结在表 10.1*中：\n\n| **属性** | **类型** | **描述**\
  \ |\n| :--- | :--- | :--- |\n| `Aspect` | `Stretch` | 决定形状填充周围空间的方式。支持的值有 `None`、`Fill`、`Uniform`\
  \ 和 `UniformToFill` |\n| `Fill` | `Brush` | 用于填充形状的画笔。 |\n| `Stroke` | `Brush` |\
  \ 用于绘制形状轮廓的画笔。 |\n| `StrokeThickness` | `double` | 表示轮廓的宽度。默认值为 0，意味着不可见的轮廓。 |\n\
  | `StrokeDashArray` | `DoubleCollection` | 一个双精度值集合，表示用于绘制形状轮廓虚线和间隙的模式。 |\n| `StrokeDashOffset`\
  \ | `double` | 表示虚线之间的距离。 |\n\n**表 10.1:** 常见形状属性\n\n在处理形状时，你将发现学习这些属性是多么容易。值得提到的是，为了设计的清晰性，所有代码示例中都将添加轮廓，但这完全是可选的。\n\
  \n# 绘制圆形和椭圆\n\n可用的最简单形状是 `Ellipse`（椭圆），它可以用于绘制圆和椭圆。以下代码演示了如何绘制简单的椭圆：\n\n```xml\n\
  <Ellipse Fill=\"Yellow\" Stroke=\"Green\" StrokeThickness=\"3\" WidthRequest=\"\
  250\" HeightRequest=\"100\" HorizontalOptions=\"Center\" Margin=\"0,50,0,0\"/>\n\
  ```\n\n`Fill` 属性包含一个填充形状的 `Brush` 对象，因此你并不局限于单一颜色。`Stroke` 属性也是如此，它是用于绘制轮廓的画笔。你可以通过\
  \ `WidthRequest` 和 `HeightRequest` 控制椭圆的大小。当它们具有相同的值时，椭圆将呈现为圆。图 10.3*显示了椭圆的样子：\n\
  \n![](img/Figure-10.3.jpg)\n\n**图 10.3:** 绘制椭圆\n\n在现实世界中利用 `Ellipse` 的一种实用方法可能是创建头像，使用\
  \ Image 视图填充 `Ellipse` 视图，例如用于个人资料。\n\n# 绘制矩形\n\n下一个形状是另一个简单的：`Rectangle`（矩形）。以下代码演示了如何绘制矩形：\n\
  \n```xml\n<Rectangle Stroke=\"Green\" StrokeThickness=\"4\" StrokeDashArray=\"1,1\"\
  \ StrokeDashOffset=\"6\" WidthRequest=\"250\" HeightRequest=\"100\" Margin=\"0,50,0,0\"\
  \ HorizontalOptions=\"Center\">\n    <Rectangle.Fill>\n    <LinearGradientBrush>\n\
  \    <GradientStop Color=\"Yellow\" Offset=\"0\"/>\n    <GradientStop Color=\"Red\"\
  \ Offset=\"0.5\"/>\n    <GradientStop Color=\"Orange\" Offset=\"1\"/>\n    </LinearGradientBrush>\n\
  \    </Rectangle.Fill>\n</Rectangle>\n```\n\n如果你回看表 10.1*，你可以回想起 `StrokeThickness`\
  \ 属性如何决定轮廓的厚度，而 `StrokeDashArray` 和 `StrokeDashOffset` 分别表示虚线的模式和距离。图 10.4*显示了生成的形状：\n\
  \n![](img/Figure-10.4.jpg)\n\n**图 10.4:** 绘制矩形\n\n# 绘制线条\n\n使用 `Line` 形状绘制线条是非常容易。考虑以下代码：\n\
  \n```xml\n<Line X1=\"0\" Y1=\"30\" X2=\"250\" Y2=\"20\" StrokeLineCap=\"Round\"\
  \ Stroke=\"Violet\" StrokeThickness=\"12\" Margin=\"0,50,0,0\" HorizontalOptions=\"\
  Center\"/>\n```\n\n相关的属性是 `X1`、`Y1`、`X2` 和 `Y2`，所有类型均为 `double`。`X1` 和 `X2` 代表线条在\
  \ X 轴上的起点和终点，而 `Y1` 和 `Y2` 代表线条在 Y 轴上的最低和最高点。`StrokeLineCap` 属性是完全可选的，允许在线条末端添加形状。你可以在\
  \ `Flat`（默认，无形状）、`Square`（与线条厚度和高度相同的矩形）和 `Round`（半圆）之间进行选择。\n\n\n\n\n\n```xml\n\
  HorizontalOptions=\"Start\" />\n```\n\n`Data` 属性包含了一些命令，更好的描述如下：\n\n* `M`，也称为 `move`（移动）命令，代表路径绝对起点的坐标。\n\
  * `L`，也称为 `line`（直线）命令，绘制一条连接从 `M` 点到指定终点的直线。\n* `Z`，也称为 `close`（闭合）命令，将当前点连接到 `M`\
  \ 点。\n\n前面的代码绘制了一个三角形，如图图 10.8 所示：\n\n![](img/Figure-10.8.jpg)\n\n**图 10.8：** 使用\
  \ Path 绘制自定义形状\n\n`Path` 类可以绘制更复杂的形状，其 `Data` 属性也可以赋值 `Geometry` 对象。这些是经过优化的特殊对象，用于绘制\
  \ 2D 形状，并允许绘制简单和复杂的几何结构。在简单几何结构中，有 `EllipseGeometry`、`LineGeometry` 和 `RectangleGeometry`，它们的名称不言自明。例如，以下代码绘制了一个椭圆、一条线和一个矩形：\n\
  \n```xml\n<Path Fill=\"Yellow\" Stroke=\"Red\">\n<Path.Data>\n  <EllipseGeometry\
  \ Center=\"50,50\" RadiusX=\"50\" RadiusY=\"50\" />\n</Path.Data>\n</Path>\n\n<Path\
  \ Stroke=\"Black\">\n<Path.Data>\n  <LineGeometry StartPoint=\"10,20\" EndPoint=\"\
  100,130\" />\n</Path.Data>\n</Path>\n\n<Path Fill=\"Yellow\" Stroke=\"Red\">\n<Path.Data>\n\
  \  <RectangleGeometry Rect=\"10,10,150,100\" />\n</Path.Data>\n</Path>\n```\n\n\
  以下列表总结了关键属性：\n\n* 对于 `EllipseGeometry` 对象，你通过 `Center` 属性控制椭圆中心（该属性是一个 `Point` 类型的坐标），并通过类型为\
  \ double 的 `RadiusX` 和 `RadiusY` 属性控制半径。\n* 对于 `LineGeometry` 对象，你通过 `StartPoint`\
  \ 和 `EndPoint` 属性定义线的边界，但线的位置由 `Path` 的位置决定。\n* 对于 `RectangleGeometry` 对象，`Rect`\
  \ 属性定义了矩形的边界。\n\n另一个名为 `PathGeometry` 的 `Geometry` 对象使得创建极其复杂的形状成为可能，包括曲线和弧。由于其在非常特定的场景下使用，本章未对此涵盖，但官方文档提供了带有示例的良好概述，可以在\
  \ `https://docs.microsoft.com/en-us/xamarin/xamarin-forms/user-interface/shapes/geometries`\
  \ 找到。\n\n# 使用多媒体\n\n播放视频和音频是另一个常见需求，不仅适用于面向媒体的应用程序，也适用于那些希望通过吸引人的内容来吸引用户的用户界面。Xamarin.Forms\
  \ 代码库不包含跨平台媒体播放器，但微软最近开发了一个名为 `MediaElement` 的播放器，将其包含在 Xamarin Community Toolkit\
  \ (`https://docs.microsoft.com/en-us/xamarin/community-toolkit`) 中，这是一个包含许多可重用视图、转换器、行为等的开源库。在本书中，Community\
  \ Toolkit 只会被提到几次，但 `MediaElement` 是个例外，因为人们对此视图的需求一直很高，而且包含媒体确实是移动端开发中一个非常常见的需求。\n\
