- "# Visual Studio 中的 Xamarin：通过 .NET 和 C# 创建 Android 和 iOS 应用，开启你的移动开发职业（英文版）\n\n\
  \n\n![](img/cover.jpg)\n![image](img/cover.jpg)\n\n\n![](img/line.jpg)\n\n\n![](img/line.jpg)\n\
  \n\n![](img/logo.jpg)\n\n\n\n\n# 献给\n*献我我出色的妻子 Angelica，我会爱你直到永远*\n\n# 关于作者\n\n\
  **Alessandro Del Sole** 是一位高级软件工程师，致力于医疗保健行业使用 Xamarin 构建移动应用。他从 2015 年起就开始使用 Xamarin，并是\
  \ Xamarin 认证移动开发人员。Alessandro 从 2008 年起一直是微软最有价值专业人员（MVP），并编写了许多技术书籍、电子书、文章、教程视频，并在意大利最重要的会议上担任演讲者。他最近还被任命为\
  \ C# Corner MVP。\n\n# 关于评审员\n\n**Ninaada** 是一位拥有 10 多年行业经验的 Xamarin 认证移动开发人员。他从事基于\
  \ Xamarin 的项目超过 6 年，涵盖了多个领域和行业，包括世界 500 强公司。他还通过贡献 GitHub 和偶尔写博客活跃在 Xamarin 社区。目前，他在\
  \ Steer73 担任 Xamarin 开发人员。他对自然和野生动物摄影有浓厚兴趣，可以在他的社交媒体页面上看到。请访问 **[`linktr.ee/ninaada`](https://linktr.ee/ninaada)**\
  \ 了解更多信息。\n\n# 致谢\n\n首先，我要非常感谢我的妻子 Angelica，她尊重我写作需要的时间，并且一直支持我，向我展现了如此多的爱。\n\n\
  接着，我要感谢 BPB Publications 团队的大力支持。我已经写了 15 年的书了，但这是我第一次与他们合作，整个团队让我更轻松地尝试不同的工作方式。\n\
  \n特别感谢了不起的 Arielle (**[`imarielle.com`](https://imarielle.com)**），她的音乐在我写作的许多小时里是我的动力。\n\
  \n最后，我想感谢本书的所有读者，以及所有在过去几年里读过我写的其他书籍或文章的人。写作是一项巨大的工程，因此你需要动力，而多年来的良好反馈就是我继续写下去的正确动力。\n\
  \n# 前言\n\n本书从开发者的角度涵盖了移动应用开发，这些开发者希望使用微软的开发工具，从一套代码同时针对 iOS 和 Android 系统。\n\n本书既适用于经验开发者，也适用于初学者，对于那些想要在移动应用行业开启软件开发新职业的人来说，提供了一种特殊且实用的方法。\n\
  \n建议具备 `C#` 编程语言的基础知识，但书中介绍了贯穿全书的通用编程和特定语言的概念，以便初级开发者也能熟悉所有讨论的话题。\n\n本书的目标是解释如何从零开始移动应用，专注于所有必要方面：用户界面、逻辑、与\
  \ Web 服务的交互、数据消耗，以及移动设备应用应该如何构建架构。\n\n对于那些希望凭借微软技术背景寻找软件开发新工作的人，本书也提供了特别关注。\n\n\
  本书分为 **15 章**。前四章介绍读者进入 `C#`、`Microsoft Visual Studio` 和 `.NET` 的软件开发世界。第 5 到第 13\
  \ 章都是技术章节，涵盖了使用 `Xamarin` 以跨平台方法开发移动应用。最后两章专门关注如何开始、建立和维护作为成功的移动开发人员的职业。以下是各章节的详细信息。\n\
  \n- **第 1 章** 描述了为什么在今天成为一名移动应用开发者很重要，以及为什么以跨平台方式构建应用是重要的。\n- **第 2 章** 描述了微软如何进入移动应用开发领域。介绍了\
  \ `Xamarin`，并讨论了为什么选择 `Xamarin` 作为开发平台可能是成功的关键。\n- **第 3 章** 介绍了 `.NET` 技术（包括最新更新）以及作为开发环境的\
  \ `Microsoft Visual Studio`。\n- **第 4 章** 旨在为初学者提供 `C#` 编程语言的快速概述，使他们对书中使用的开发工具感到熟悉。\n\
  - **第 5 章** 描述了如何在 `Microsoft Visual Studio` 中创建 `Xamarin` 解决方案，解释了代码共享策略如何工作以将应用交付到多个操作系统。\n\
  - **第 6 章** 解释了移动应用用户界面的基础，以及如何使用布局创建自适应和自动调整大小的用户界面。\n- **第 7 章** 描述了如何使用 `Xamarin`\
  \ 提供的控件创建应用界面，以及如何管理与控件的交互。\n- **第 8 章** 描述了如何用页面组织应用界面、不同类型的页面以及页面导航如何工作。\n- **第\
  \ 9 章** 描述了可重资源的概念，并解释了如何将数据对象连接到界面以实现自动通信。它还解释了如何使用本地 `SQLite` 数据库存储、检索和数据。\n-\
  \ **第 10 章** 讨论了如何使用画刷、形状和媒体内容丰富应用界面。\n- **第 11 章** 解释了如何处理应用生命期的不同事件，以及如何管理移动应用的常见需求，如网络连接、电量、本地设置。\n\
  - **第 12 章** 描述了如何在 `Xamarin` 项目中使用 Web 服务，包括托管在 `Azure` 上的云服务。\n\n\n\n\n\n第 13\
  \ 章 介绍了如何从 Xamarin 访问原生 iOS 和 Android API，并指出只有在 `Xamarin` 和 `Xamarin.Essentials`\
  \ 代码库中没有跨平台解决方案时，才需要这样做。它还描述了如何实现特定于平台的自定义功能。\n\n第 14 章 帮助你理解如何在理解招聘公司核心业务后，根据读者的经验进行针对性合适的职位搜索，以寻找与\
  \ Xamarin 移动应用开发相关的工作。\n\n第 15 章 就如何在移动应用开发市场保持工作的良好方法提供了建议，包括在团队工作以及跟上技术更新的技巧和诀。\n\
