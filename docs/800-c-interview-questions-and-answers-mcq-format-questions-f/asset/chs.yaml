  \ 是用于值相等比较的方法\n- 选项 3：`==` 是用于引用相等比较的运算符，而 `Equals()` 是用于引用相等比较的方法\n- 选项 4：`==`\
  \ 和 `Equals()` 是相同的，可以互换使用\n\n**正确答案：** 选项 2\n\n说明：C# 中 `==` 和 `Equals()` 的区别在于\
  \ `==` 是用于值相等比较的运算符，而 `Equals()` 是一个可以重写的方法，用于为值或引用相等比较提供自定义行为。`==` 运算符主要用于比较值类型的值或引用类型的引用相等，而\
  \ `Equals()` 方法可以被类重写以定义它们自己的相等性逻辑。当使用 `==` 比较引用类型时，它比较的是对象的引用（地址），而不是内容。相反，`Equals()`\
  \ 方法允许对象通过重写它来定义自己的相等性比较。\n\n### C# 中的 `is` 运算符是如何工作的？\n- 选项 1：它检查对象是否属于特定类型\n-\
