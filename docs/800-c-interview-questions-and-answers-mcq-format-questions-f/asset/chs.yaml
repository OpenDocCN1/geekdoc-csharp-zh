  \ `this`，你可以区分类成员与同名的构造函数参数或局部变量。这有助于消除歧义并指定操作或赋值的意图目标。在构造函数参数掩盖了类的字段或属性的情况下，`this`\
  \ 特别有用。\n\n## C# 中的构造函数是一个与类名 ______ 相同的特殊方法。\n\n- 选项 1：相同\n- 选项 2：不同\n- 选项 3：相似\n\
  - 选项 4：唯一\n\n# 正确答案：选项 1\n\n解释：C# 中的构造函数与它所属的类同名。这种命名约定允许编译器将构造函数与类关联，并确保在创建类对象时调用它。通过拥有与类相同的名称，构造函数可以初始化对象并正确设置其初始状态。\n\
  \n## C# 类中构造函数的目的是在对象创建时 ______ 它。\n\n- 选项 1：初始化\n- 选项 2：修改\n- 选项 3：销毁\n- 选项 4：扩展\n\
  \n# 正确答案：选项 1\n\n解释：C# 类中构造函数的目的是在对象创建时初始化对象。构造函数负责通过向其字段或属性赋值来设置对象的初始状态。它们确保对象以有效且一致的状态开始运行。构造函数还可以执行类所需的其他必要的设置任务或初始化逻辑。通过执行构造函数，对象为使用准备好了并可以执行其预期的功能。\n\
  \n## 是的，C# 中的类可以有多个 ______，只要它们的参数不同。\n\n- 选项 1：构造函数\n- 选项 2：方法\n- 选项 3：属性\n- 选项\
  \ 4：事件\n\n# 正确答案：选项 1\n\n解释：是的，C# 中的类可以有多个构造函数，只要它们的参数不同。这种概念被称为构造函数重载。构造函数重载允许你在类中定义多个构造函数，每个构造函数接受不同的参数集。每个构造函数都有唯一的参数列表，在创建对象时允许不同的初始化场景或自定义选项。通过提供多个构造函数，你可以适应创建类实例各种方式。\n\
  \nC# 中的默认构造函数是不带参数的构造函数，而参数化构造函数 ______。\n\n- 选项 1：接受一个或多个参数\n- 选项 2：参数具有默认值\n-\
  \ 选项 3：具有可选参数\n- 选项 4：被隐式调用\n\n# 正确答案：选项 1\n\n解释：C# 中的默认构造函数是不带参数的构造函数。它提供了创建类对象的默认方式。它用默认值初始化对象，或者在创建对象期间不需要任何额外参数即可设置其初始状态。相反，参数化构造函数是接受一个或多个参数的构造函数。它通过为构造函数参数提供特定值，允许对对象进行自定义初始化。参数化构造函数是显式调用的并在创建对象期间需要传递参数。\n\
