  \n\n\n\n\n# 选项 4：是的，C# 中的方法可以使用 `out` 或 `ref` 关键字返回多个值\n\n**正确答案：** 选项 2\n\n**解释：**\
  \ 是的，C# 中的方法可以使用元组（tuples）或自定义对象返回多个值。`Tuples` 是 C# 中的一种内置类型，允许你将多个值组合在一起，并将它们作为单个值从方法返回。或者，你也可以创建自定义对象来封装并返回多个值。通过返回元组或自定义对象，你可以有效地从方法返回多个值。\n\
  \n## 如果方法的返回类型为 `void`，它会返回什么？\n\n- 选项 1：返回类型为 `void` 的方法不返回任何值\n- 选项 2：返回类型为 `void`的方法返回\
