  \n## 比较运算符\n\n### C# 中用哪个运算符检查两个值是否相等？\n- 选项 1：`==`\n- 选项 2：=`\n- 选项 3：`===`\n-\
  \ 选项 4：`!=`\n\n**正确答案：** 选项 1\n\n说明：C# 中的 `==` 运算符用于检查两个值是否相等。它是一个二比较运算符，如果运算符两边的值相等则返回\
  \ true，否则返回 false。例如，`int x = 5; int y = 5; bool result = (x == y);` 将将值 true 赋值给变量\
  \ `result`，因为 `x` 和 `y` 的值相等。\n\n### C# 中表示“不等于”的运算符是什么？\n- 选项 1：`=! `\n- 选项 2：`!=`\n\
  - 选项 3：`!==`\n- 选项 4：`<>\n\n**正确答案：** 选项 2\n\n说明：C# 中的 `!` 运算符用于检查两个值是否不等。它是一个二比较运算符，如果运算符两边的值不相等则返回\
  \ true，如果它们相等则返回 false。例如，`int x = 5; int y = 3; bool result = (x != y);` 将将值 true\
  \ 赋值给变量 `result`，因为 `x` 和 `y` 的值不等。\n\n### C# 中的 `<=` 运算符的作用是什么？\n- 选项 1：检查左操作数是否小于或等于右操作数\n\
