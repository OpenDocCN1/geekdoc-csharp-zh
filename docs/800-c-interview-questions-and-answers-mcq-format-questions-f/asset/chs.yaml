  \n## 解释\n在 C# 中，如果你尝试访问超出字符串边界的索引处的字符，将抛出 `IndexOutOfRangeException`。当索引值为负数或大于或等于字符串长度时，就会发生此异常。它表示你正尝试访问字符串有效范围之外的字符，应该对其进行适当处理以防止程序崩溃或意外行为。\n\
