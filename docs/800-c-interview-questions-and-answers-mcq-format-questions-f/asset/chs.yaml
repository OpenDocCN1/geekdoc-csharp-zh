  \n**正确答案：** 选项 1\n\n**解释：** 返回类型为 `void` 的方法不返回任何值。此类方法的目的是执行某项任务或操作，而不产生需要返回的结果。当调用\
  \ `void` 方法时，调用者期望方法执行其预定功能，而不期望返回值。\n\n## 你能讨论一下如何在 C# 方法中返回多个值吗？\n\n- 选项 1：你可以通过使用元组或创建并返回封装了值的自定义对象从\
