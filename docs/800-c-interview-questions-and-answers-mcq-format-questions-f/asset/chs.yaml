  \ `bool?`，你可以分配额外的 `null` 值来指示未定义或未知状态。这在你需要表示值的缺失时非常有用。\n\n假设你正在开发一个需要处理用户输入的 C#\
  \ 。用户可以输入 \"yes\" 或 \"no\"，你需要将这些输入转换为布尔值。你会如何处理？\n\n- 选项 1：使用 `bool.Parse()` 或\
