  \ `Boolean` 列保持一致。\n\n# if 语句\n如何在 C# 中创建 if 语句？\n\n- **选项 1**：使用 `if` 关键字，后跟圆括号内的条件和代码块。\n\
  - **选项 2**：使用 `is` 关键字，后跟圆括号内的条件和代码块。\n- **选项 3**：使用 `for` 关键字，后跟圆括号内的条件和代码块。\n\
