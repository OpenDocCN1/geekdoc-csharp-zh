  \ C# 中 `++i` 和 `i++` 的区别在于评估顺序。`++i` 也称为前自增，它先增加 `i` 的值，然后返回增加后的值。相反，`i++` 也称为后自增，它先返回当前值，然后再增加值。\n\
  \n## 溢出与下溢\nC# 如何处理算术运算中的溢出和下溢？\n\n- 选项 1：溢出或下溢时 C# 会抛出异常\n- 选项 2：C# 自动调整结果\n- 选项\
