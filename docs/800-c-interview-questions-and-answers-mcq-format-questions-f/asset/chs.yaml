  \n**正确答案：选项 4**\n\n**解析：** C# 中的运算符优先级决定了运算符在算术表达式中评估的顺序。某些运算符的优先级高于其他运算符，这意味着它们先被评估。例如，乘法（`*`）和除法（`/`）的优先级高于加法（`+`）和减法（`-`）。如果运算符优先级相同，则从左到右评估。括号可以覆盖默认优先级并强制特定的评估顺序。理解运算符优先级对于正确解释和评估算术表达式至关重要。\n\
  \n## 增运算符\nC# 中 `++i` 和 `i++` 有什么区别？\n\n- 选项 1：它们都将 `i` 的值加 1\n- 选项 2：`#NAME?`\n\
