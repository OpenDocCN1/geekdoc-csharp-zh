  \ 关键字可以用于检查算术溢出或下溢条件。当使用 `checked` 关键字时，会对算术操作进行潜在的溢出或下溢检查，如果发生这种情况，将抛出 `OverflowException`。默认情况下，C#\
  \ 中的算术操作是未检查的（unchecked），这意味着不会执行这些检查。`checked` 关键字提供了一种在特定代码块中强制执行溢出和下溢检查的式方法。\n\
