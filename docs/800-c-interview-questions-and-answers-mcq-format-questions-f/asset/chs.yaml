  **选项 3**：接口\n**选项 4**：实现和签名\n\n**正确答案**：选项 1\n\n**解释**：当 `C#` 中的多个接口具有相同签名的方法时，实现这些接口的类为该方法提供单一实现。该实现满足所有接口的要求，确保无论使用哪个接口来访问它，该方法的行为都保持一致。\n\
