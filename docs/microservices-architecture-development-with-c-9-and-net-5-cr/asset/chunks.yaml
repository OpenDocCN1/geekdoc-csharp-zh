    \ offering features like dependency injection, configuration, and cloud-native\
    \ support.\n\n### Core Principles of Microservices Design\n\n- **Independent Deployability**:\
    \ Each microservice should be deployable independently without affecting other\
    \ services.\n- **Bounded Context**: Microservices should align with specific business\
    \ domains or capabilities.\n- **Decentralized Governance**: Teams owning different\
