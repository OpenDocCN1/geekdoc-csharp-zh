    \          image: my-product-service:latest\n          ports:\n            - containerPort:\
    \ 80\n```\n\n### `Service`: Exposes a set of `Pods` as a network service.\n\n\
    ```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: product-service\nspec:\n\
    \  selector:\n    app: product-service\n  ports:\n    - protocol: TCP\n      port:\
