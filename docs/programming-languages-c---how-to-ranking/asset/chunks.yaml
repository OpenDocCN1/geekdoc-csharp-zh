  trans: "\n布局概览显示了 Core )\"。\n\nSnap Next。\n\n在“设计你的新项目”窗口中，指定新项目的名称和区域。\n\nSnap\
    \ Create。\n\n我们将利用此项目在本文的后续章节中概述匿名方法、lambda 表达式和代表方法（terminations）的用法。\n\n## C#\
    \ 中的委托 (Delegates)\n\nC# 中的委托（delegate）被描述为包含绑定在词法作用域（lexical climate）中的自由因素的方法。C#\
    \ 编程语言将委托视为一种顶级数据类型。这意味着你可以像处理其他顶级数据类型一样，将能力分配给变量、实例化它或在它们之间传递。\n\n委托是一种特定的能力类型，它本质上与它引用的环境相关联。因此，委托可以使用与引用环境相关的因素，无论这些因素是否超出了委托的作用范围。\n\
    \n[ 了解领先首席信息官（CIOs）如何重塑 IT。。立即下载 CIO 最新的智库报告！ ]\n\n### C# 中的基本委托模型\n\n你可以像下面的代码段所示，使用匿名方法来组合委托：\n\
    \n```csharp\nFunc<string, string> someFunc = delegate (string someVariable) return\
    \ \"Hi World!\";\n```\n\n同样，你可以像下面的代码段所示，使用 lambda 表达式来创建委托：\n\n```csharp\nFunc<string,\
    \ string> someFunc = someVariable => \"Hi World!\";\n```\n\n注意，上面的两个代码片段都创建了一个接受字符串作为边界并返回另一个字符串的方法。以下是调用我们刚刚创建的这两个方法的方法：\n\
    \n```csharp\nstring str = someFunc(\"This is a demo\");\n```\n\n我们来看另一个模型。下面的代码段在一个名为\
    \ `x` 的非局部（non-nearby）因素中创建一个整数值。\n\n```csharp\nint x = 10;\nAction conclusion\
    \ = delegate Console.WriteLine(\"The worth of the non-nearby factor x is: {0}\"\
    , x);\nconclusion();\n```\n\n以下是使用 lambda 表达式实现相同操作的方法：\n\n```csharp\nint x =\
    \ 10;\nAction conclusion = () =>\n{\n    Console.WriteLine(\"The worth of the\
    \ non-neighborhood variable x is: {0}\", x);\n};\nconclusion();\n```\n\n在这两种情况下，输出将完全如下方图\
    \ 1 所示。\n\n### 委托捕获的是因素，而不是属性\n\n由于委托绑定到它声明的环境，因此它可以引用作用域之外的因素以及体内部的项。以下是一个描述此点的模型：\n\
    \n```csharp\nint x = 10;\nAction a = delegate {\n    Console.WriteLine($\"The\
    \ worth of x is: {x}\"); \n};\na();\n```\n\n当执行上述代码时，输出将如图 2 所示出现在控制台窗口。\n\n随后的代码段显示，匿名方法绑定到父方法体中的因素，而不是属性。\n\
    \n```csharp\nint x = 10;\nAction a = delegate {\n    Console.WriteLine($\"The\
    \ worth of x is: {x}\"); \n};\nx = 100;\na();\n```\n\n当执行上述代码时，输出将如图 3 所示。注意，匿名方法返回的是\
    \ 10，而不是 100。\n\n### C# 方法是如何工作的？\n\n当 C# 编译器识别出一个定义了超出当前层级方法的代表方法时，该代理及其相关的环境因素会被提升到编译器创建的类中。从那时起，只需一点编译器魔法即可在编译器创建的类的实例之间移动，确保每次实例化委托时，都会调用该类上的一个能力。一旦不再对该类的实例有任何引用，该实例就会像其他情况一样被\
    \ GC 回收。\n\n以下是一个根据包含方法的代码片段生成的编译器生成的类示例。`[CompilerGenerated]`\n\n```csharp\n\
    private fixed class <>c__DisplayClass0_0\n{\n    public int x;\n    inner void\
    \ <M>b__0()\n    {\n        Console.WriteLine(string.Format(\"The worth of x is:\
    \ {0}\", x)); \n    } \n}\n```\n\n为了让 lambda 保持“可调用性”，它引用的因素在声明它们的方法执行完毕后仍应保持存在。为了实现这一点，C#\
    \ 依赖于类。因此，当 lambda 表达式访问在方法内部声明的变量时，该变量会被提取并放在由编译器创建的另一个类中。这大致就是方法的工作原理！\n\n##\
    \ MALINA PRONTO\n"
