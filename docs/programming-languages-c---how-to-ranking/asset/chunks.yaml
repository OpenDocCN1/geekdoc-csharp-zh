    Python 中同样存在这些工具，然而，它们的利用完全取决于个人意愿。免费的 VB.NET IDE 被称为 `Visual Studio Express`。在编写时，最新的版本是
    `Visual Studio Express 2010`。遗憾的是，使用该 IDE 的免费版，你的功能将受到限制，而且你创建的任何项目都无法进行商业化出售。遗憾的是，该
    IDE 的完整付费版并不便宜，而且可能不适合专业人士，但幸运的是，学习 VB 使用免费版就足够了。随着时间的推移，现在不再有很多商业程序是用 VB 开发的，但
    `Visual Studio` IDE 允许你使用许多不同的语言。你使用它时创建的通用性也将允许你利用 IDE 的力量在许多不同的语言中进行开发。有些人人会认为，几乎每种语言都可以在内容管理器中创建，而且它们无疑是编写代码最灵活的方式。


    虽然这实际上是显而易见的（而且我建议你在提高水平后尝试在内容工具中开发以分析），但我强烈建议你用一个正版 IDE 学习你的第一门语言。


    虽然通常情况下，人们会先学习 Python 或 VB，而这些大部分是学校教授的内容，但我并不建议学习这两者。我认为，你的第一门语言在它有效地帮助你掌握编程基础之后，应该对你继续保持价值。如果我必须为新手建议其中一种，那将是
    `VB.NET`，因为理所当然，计算机程序最不可预测的部分是图形化部分，而在 `VB.NET` 中，由于直观的界面，这非常简单。这两种语言经常被用作演示，因为它们对错误非常宽容，并允许你在不担心许多更复杂问题的情况下，对编程标准建立信心。


    对于你们中那些无畏的灵魂 来说，我真的推荐将 `Java` 作为你的第一门语言，尽管它倾向于复杂，因此不是一个作为第一门语言的典型选择。`Java` 程序与其他大多数程序的不同之处在于，它们并不运行在你的
    PC 上。客户端下载 `Java`，然后，你的代码运行在所谓的 `VM`（`Virtual Machine`，虚拟机）上。这意味着你的代码运行在 `Java`
    提供的特殊区域——你电脑的虚拟副本——并为你处理将其映射到真实机器的解释。这意味着 `Java` 程序是“跨平台”的，意味着它们通常可以在 Windows、Mac、Linux
    以及大多数其他工作框架上运行。


    `Java` 是一门值得学习的语言，因为它非常广泛且有用。此外，它是非常奇人的，并且对于专业人士和商业工作来说是免费的。然而，与 `VB` 和 `Python`
    不同，它不容忍错误，并要求你对一切都非常确定。它还是一种面向对象的编程语言，这是一个非常复杂的问题，我将简要尝试总结一下。像 `Python` 和 `VB`
    这样的语言被称为过程化语言，意味着代码行是按顺序一个接一个，而 `Java` 是一种面向对象的语言。面向对象编程是如今编程领域被频繁提到的术语，尽管并非完全适用，但很大程度上被认为是一个明智的主意。


    在最基层，面向对象的程序是关于对象的。一个对象是 `class`（类）的“实例”。一个 `class` 是一个用来描述像猫之类的对象的蓝图。`class`
    包含了关于猫的信息，如它的名字、年龄和所有者，也包含了“策略”（这些基本上是猫可以执行的活动，如喵喵）。`feline` 类的实例将给你一只特定的猫。尽管如此，这并不是一个
    `Java` 练习，所以如果你足够勇敢去用 `Java` 尝试不同的事物，你将自己更详细地学习这一点。`VB.NET` 和 `Python` 都都支持面向对象的开发事件，而
    `Java` 可以以过程化的方式使用。

