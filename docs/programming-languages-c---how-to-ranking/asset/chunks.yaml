    \ `C# 9.0` 中运行顶级项目。为了运行本文中提供的代码模型，你的框架中应该已经引入了 `Visual Studio 2019`。如果你还没有该版本，可以在此处下载\
    \ `Visual Studio 2019`。\n\n请注意，`C# 9.0` 在 `Visual Studio 2019` 的 `16.9 Preview\
    \ 1` 或更高版本，以及 `.NET 5.0 SDK` 中可用。\n\n## 在 Visual Studio 中创建 .NET Core 控制台应用程序项目\n\
    \n首先，我们需要在 Visual Studio 中创建一个 `.NET Core` 控制台应用程序项目。假设你的框架中已引入 `Visual Studio\
    \ 2019`，请按照下面的步骤在 `Visual Studio` 中创建另一个 `.NET Core` 控制台应用程序项目。\n\n启动 `Visual\
    \ Studio` IDE。点击“创建新项目（Make new task）”。\n\n在“新建项目”窗口中，从显示的布局列表中选择“控制台应用 (.NET\
    \ Core)”。\n\n点击“下一步”。\n\n在“配置你的新项目”窗口中，确定新项目的名称和位置。\n\n点击“创建”。我们将利用此项目在本文的后续部分中使用顶级项目。\n\
    \n## C# 9.0 中的顶级程序模型\n\n我们应该先看一个关于顶级项目如何处理标准代码的示例。在 `C# 9.0` 引入顶级语句之前，这是你为控制台应用编写的基础性代码：\n\
    \n```csharp\nusing System;\nnamespace IDG_Top_Level_Programs_Demo\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Console.WriteLine(\"Hello World!\");\n        }\n    }\n}\n```\n\n在使用 `C#\
    \ 9.0` 时，我们可以避免繁琐的操作，并利用顶级项目以更简单的方式编写代码。下面的代码段展示了如何利用顶级语句来重构上述代码：\n\n[ 了解首席信息官如何重新思考\
    \ IT。即刻下载 CIO 最新的智库报告！ ]\n\n```csharp\nusing System;\nConsole.WriteLine(\"Hello\
    \ World!\");\n```\n\n无论如何，当程序运行时，你会在控制台窗口看到显示“Hi World!”字符串。\n\n## 在 C# 9.0 顶级项目中使用语句\n\
    \n你可以在顶级项目中使用语句。下面是一个代码模型，展示了你如何在顶级项目中使用语句。\n\n```csharp\nSystem.Console.WriteLine(DisplayMessage(\"\
    Joydip!\"));\nSystem.Console.Read();\nstatic string DisplayMessage(string name)\n\
    { \n    return \"Hi, \" + name;\n}\n```\n\n当你执行上述程序时，你应该会在控制台窗口看到输出结果“Hi, Joydip!”：\n\
    \n## 在 C# 9.0 顶级项目中使用类\n\n你同样可以在顶级项目中使用类、结构体和枚举。下面的代码片段概述了你如何在顶级项目中使用类。\n\n```csharp\n\
    System.Console.WriteLine(new Author().DisplayMessage(\"Joydip!\"));\nSystem.Console.Read();\n\
    public class Author\n{\n    public string DisplayMessage(string name)\n    {\n\
    \        return \"Hi, \" + name;\n    }\n}\n```\n\n当你执行上述程序时，输出结果将如图 1 所示。\n\n\
    ## C# 9.0 中顶级项目的工作原理\n\n总而言之，顶级项目具体是如何运作的？后台发生了什么？顶级项目基本上是编译器的一个特性。如果你没有编写标准代码，编译器将为你创建它。\n\
    \n参考我们之前编写的后续代码。\n\n```csharp\nusing System;\nConsole.WriteLine(\"Hello World!\"\
    );\n```\n\n下面显示的代码（使用 `SharpLab` 在线工具创建）展示了编译器生成的代码样式：\n\n```csharp\nusing System;\n\
    using System.Diagnostics;\nusing System.Reflection;\nusing System.Runtime.CompilerServices;\n\
    using System.Security; using System.Security.Permissions;\n[assembly: CompilationRelaxations(8)]\n\
    [assembly: RuntimeCompatibility(WrapNonExceptionThrows = true)]\n[assembly: Debuggable(DebuggableAttribute.DebuggingModes.Default\
    \ | DebuggableAttribute.DebuggingModes.DisableOptimizations | DebuggableAttribute.DebuggingModes.IgnoreSymbolStoreSequencePoints\
    \ | DebuggableAttribute.DebuggingModes.EnableEditAndContinue)] [assembly: SecurityPermission(SecurityAction.RequestMinimum,\
    \ SkipVerification = true)]\n[assembly: AssemblyVersion(\"0.0.0.0\")]\n[module:\
    \ UnverifiableCode]\n[CompilerGenerated]\ninternal static class <Program>$\n{\
    \ \n    private static void <Main>$(string[] args)\n    {\n        Console.WriteLine(\"\
    Hello World!\");\n    }\n}\n```\n\n如果你查看编译器生成的代码，你会发现编译器创建的静态类上方带有 `[CompilerGenerated]`\
    \ 标记。顶级项目是 `C# 9.0` 中一项非常不起的新特性，通过它编译器会在后台自动为你创建标准代码。顶级项目对于没有大量记录和逻辑的简单项目非常有用。请注意，你的应用程序中只能有一个文件使用顶级语句；否则，编译器会报错。\n"
