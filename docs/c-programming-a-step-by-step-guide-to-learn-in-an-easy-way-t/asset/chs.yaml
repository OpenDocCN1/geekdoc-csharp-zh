  \ 的 `RichTextBox` 控件。\n\n## 可靠编程\n\n扩展文本格式非常灵活，但格式中的任何错误都会导致显示文本出现错误。\n\n## 如何将文本加载到\
  \ RichTextBox 控件\n\n此示例加载用户在 `OpenFileDialog` 中选择的文件。代码随后将文件内容填充到 `RichTextBox`\
  \ 控件中。\n\n### 示例\n\n```csharp\n// 创建一个 OpenFileDialog 对象。\nopenFile1 = new OpenFileDialog\
  \ ();\n\n// 初始化过滤器以查找文本文件。\nopenFile1.Filter = \"Text Files | * .txt\" ;\n\n// 如果用户选择了文件，则将其内容加载到\
  \ RichTextBox。\nif (openFile1.ShowDialog () == System.Windows.Forms.DialogResult.OK)\n\
  \    richTextBox1.LoadFile (openFile1.FileName, RichTextBoxStreamType.PlainText);\n\
  ```\n\n### 编译代码\n\n此示例需要：\n\n*   一个名为 `richTextBox1` 的 `RichTextBox` 控件。将代码段插入到\
  \ `Form1_Load` 方法中。运行程序时，将提示你选择文本文件。\n\n## 将文本加载到 RichTextBox 控件\n\n此示例加载用户在 `OpenFileDialog`\
  \ 中选择的文件。代码随后用文件内容填充 `RichTextBox` 控件。\n\n### 示例\n\n```csharp\n// 创建一个 OpenFileDialog\
  \ 对象 .\nopenFile1 = new OpenFileDialog ();\n\n// 初始化过滤器以查找文本文件。\nopenFile1.Filter\
  \ = \"Text Files | * .txt\" ;\n\n// 如果用户选择了文件，则将其内容加载到 RichTextBox。\nif (openFile1.ShowDialog\
  \ () == System.Windows.Forms.DialogResult.OK)\n    richTextBox1.LoadFile (openFile1.FileName,\
  \ RichTextBoxStreamType.PlainText);\n```\n\n### 编译代码\n\n此示例需要以下组件。\n\n*   一个名为 `richTextBox1`\
  \ 的 `RichTextBox` 控件。将代码段粘贴到 `Form1_Load` 方法中。执行程序时，将提示你选择文本文件。\n\n## 对话框\n\n###\
  \ 如何从对话框检索数据\n\n对话框允许你的程序与用户进行交互，并检索用户在对话框中输入的数据以供你的应用程序使用。有几个内置的对话框可以在应用程序中使用。你也可以创建自己的对话框。\n\
  \nWindows Forms 开发中的一项常见任务是在用户点击应用程序主表单上的按钮时显示对话框以收集信息。你可以在 Visual C# Express 版\
  \ IDE 中看到此项示例。当你向表单添加 `ListBox` 控件时，可以点击属性窗口中的 `Items` 属性来显示对话框。此对话框允许你可以在文本框的单独行上快速输入文本。当点击\
  \ `OK` 时，应用程序会将每行文本添加到 `ListBox` 控件中。如果你想让用户向应用程序中的列表框添加他们自己的项目，可以创建自己的字符串编辑器对话框。\n\
  \n## 从对话框检索数据\n\n对话框允许程序与用户进行交互，并将用户在对话框中输入的数据检索到应用程序中。有几个内置对话框可供应用程序使用。你也可以创建自己的对话框。\n\
  \nWindows Forms 开发中的一项常见任务是在用户点击主表单上的按钮后显示对话框以收集信息。下面的示例了如何在 Visual C# Express 版\
