  10. 关闭应用程序。\n\n# ListBox 和 ComboBox 控件\n\n## 如何在 ListBox 控件中添加和清除项\n此示例在点击 `button1`\
  \ 时，将 Windows Forms `TextBox` 控件的内容添加到 `ListBox` 控件中，并在点击 `button2` 时清空内容。\n\n###\
  \ 示例\n```sharp\nprivate void button1_Click (object sender, System.EventArgs e)\n\
  {\n    listBox1.Items.Add (\"Sally\");\n    listBox1.Items.Add (\"Craig\");\n}\n\
  \nprivate void button2_Click (object sender, System.EventArgs e)\n{\n    listBox1.Items.Clear\
  \ ();\n}\n```\n\n### 编译代码\n此示例需要：\n* 一个包含名为 `listBox1` 的 `ListBox` 控件以及名为 `button1`\
  \ 和 `button2` 的按钮的表单。将 `button1` 的 Click 事件处理程序添加到 `button1_Click`，将 `button2` 的\
  \ Click 事件处理程序添加到 `button2_Click`。\n\n# ListBox 和 ComboBox\n\n## 在 ListBox 控件中添加和移除项\n\
  此示例在按下 `button1` 时，将 Windows Forms `TextBox` 控件的内容添加到 `ListBox` 控件，并在按下 `button2`\
  \ 时移除。\n\n### 示例\n```csharp\nprivate void button1_Click (object sender, System.EventArgs\
  \ e)\n{\n    listBox1.Items.Add (\"Sally\");\n    listBox1.Items.Add (\"Craig\"\
  );\n}\n\nprivate void button2_Click (object sender, System.EventArgs e)\n{\n   \
  \ listBox1.Items.Clear ();\n}\n```\n\n### 编译代码\n此示例需要以下组件。\n* 一个包含名为 `listBox1`\
