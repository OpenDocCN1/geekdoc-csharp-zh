  \n## 错误与异常处理\n\n当 C# 程序运行时出现问题时，就会发生异常。异常会停止程序的当前流，如果没有处理，程序就会停止。异常可能是由程序中的错误引起的（例如，除以零），也可能是意外输入的结果（例如用户选择了一个不存在的文件）。作为程序员，你需要让你的程序处理这些问题而不是直接崩溃。\n\
  \nC# 提供了几个关键字——`try`、`catch` 和 `finally`——允许程序检测异常、处理异常并继续运行。它们是提高应用程序可靠性非常有用的工具。\n\
  \n#### Try 和 Catch\n\n`try` 和 `catch` 关键字配合使用。使用 `try` 封装可能产生异常的代码块，使用 `catch` 包含异常发生时将执行的代码。在示例中，计算产生了除以零异常，然后被捕获。如果没有\
  \ `try` 和 `catch` 块，该程序将失败。\n\n```csharp\nclass ProgramTryCatch\n{\n  static void\
  \ Main ()\n  {\n    int x = 0, y = 0;\n    try\n    {\n      x = 10 / y;\n    }\n\
  \    catch (System.DivideByZeroException)\n    {\n      System.Console.WriteLine\
  \ ( \"There was an attempt to divide by zero.\" );\n    }\n  }\n}\n```\n\n对于你的 `catch`\
  \ 代码正在检测的异常类型进行具体的指定是一种良好的编程习惯。\n\n\n\n\n\n```csharp\nclass ProgramTryCatch\n{\n\
  \    static void Main ()\n    {\n        int x = 0, y = 0;\n        try\n      \
  \  {\n            x = 10 / y;\n        }\n        catch (System.DivideByZeroException)\n\
  \        {\n            System.Console.WriteLine ( \"There was an attempt to divide\
  \ by zero.\" );\n        }\n    }\n}\n```\n\n通常情况下，建议您显式指定 `catch` 代码捕获的异常类型。每个\
  \ `try` 可以有多个 `catch` 语句，每个语句处理一个独立的异常。\n\n## finally 块\n\n`finally` 块中的代码无论是否发生异常都始终会被执行。使用\
  \ `finally` 块来确保资源被释放：例如，确保文件已关闭。\n\n| try{ // 在此处尝试代码。}catch (SomeSpecificException\
  \ ex){ // 在此处处理异常。}finally{ // 在 try（以及可能的 catch）之后执行的代码。} |\n\n## 使用异常处理\n\n异常并不总是意味着程序中发生了灾难性问题。很多时候，它们是离开不再相关的代码段的方便方法，或者是一个方法执行失败的信号。\
  \ .NET Framework 类中的许多方法会创建异常来警告特定情况。\n\n您也可以使用 `throw` 关键字触发自己的异常。\n\n![clear](img/Image00021.jpg)\
  \ finally 块\n\n`finally` 块包含的代码无论是否发生异常都始终会被执行。为了确保资源被释放（例如确保文件已关闭），请使用 `finally`\
  \ 块。\n\n```csharp\ntry\n{\n    // 在此处尝试代码。\n}\ncatch (SomeSpecificException ex)\n\
  {\n    // 在此处处理异常。\n}\nfinally\n{\n    // 在 try（以及可能的 catch）之后执行的代码。\n}\n```\n\n\
  ![clear](img/Image00021.jpg) 使用异常处理\n\n异常并不总是指示程序存在严重问题。它们通常是离开不再相关的代码段的方便方法，或者指示方法失败。大多数\
  \ .NET Framework 类方法抛出异常来警告特定情况。\n\n您也可以通过 `throw` 关键字抛出自己的异常。\n\n例如：\n\n| class\
  \ ProgramThrow{ static void DoWork (int x) { if (x> 5) { throw new System.ArgumentOutOfRangeException\
  \ ( \"X is too large\" ); } } static void Main () { try { DoWork (10); } catch (System.ArgumentOutOfRangeException\
  \ ex) { System.Console.WriteLine (ex.Message); } } } |\n\n当您认为可能出现某些意外情况时，请在程序中使用异常。例如，在处理来自用户的输入、读取文件或访问互联网信息时。\n\
  \n### 示例\n\n```csharp\nclass ProgramThrow\n{\n    static void DoWork ( int x)\n\
  \    {\n        if (x> 5)\n        {\n            throw new System.ArgumentOutOfRangeException\
  \ ( \"X is too large\" );\n        }\n    }\n    static void Main ()\n    {\n  \
  \      try\n        {\n            DoWork (10);\n        }\n        catch (System.ArgumentOutOfRangeException\
  \ ex)\n        {\n            System.Console.WriteLine (ex.Message);\n        }\n\
  \    }\n}\n```\n\n如果您预计会有意外情况发生，我们建议使用异常。例如，在处理用户输入的数据、读取文件或访问互联网信息时，它们将非常有用。\n\n\
  ### 如何：捕获异常\n\n此示例使用 `try-catch` 块将除以零捕获为异常。捕获异常后，执行将在 `finally` 块中恢复。\n\n#### 示例\n\
  \n```csharp\nint top = 0, bottom = 0, result = 0;try{ result = top / bottom;}catch\
  \ (System.Exception ex){ System.Console.WriteLine ( \"{0} exception caught here.\"\
  \ , Ex.GetType (). ToString ()); System.Console.WriteLine (ex.Message);}finally{\
  \ System.Console.WriteLine ( \"Clean-up code executes here ...\" );}System.Console.WriteLine\
  \ ( \"Program execution continues here ...\" );\n\n```\n\nSystem.DivideByZeroException\
  \ exception caught here.\n\n尝试除以零。\n\n清理代码在此处执行 ...\n\n程序执行在此继续 ...\n\n## 捕获异常\n\
  \n此示例使用 `try-catch` 块捕获除以零异常。捕获异常后，执行将在 `finally` 块中继续。\n\n#### 示例\n\n```csharp\n\
  int top = 0, bottom = 0, result = 0;try{ result = top / bottom;}catch (System.Exception\
  \ ex){ System.Console.WriteLine ( \"{0} exception caught here.\" , Ex.GetType ().\
  \ ToString ()); System.Console.WriteLine (ex.Message);}finally{ System.Console.WriteLine\
  \ ( \"Clean-up code executes here ...\" );}System.Console.WriteLine ( \"Program\
  \ execution continues here ...\" );\n\n```\n\n// 结果\n\nSystem.DivideByZeroException\
