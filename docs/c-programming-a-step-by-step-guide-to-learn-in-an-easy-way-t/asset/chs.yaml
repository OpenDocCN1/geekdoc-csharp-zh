  \n### [.NET Framework 类库](https://translate.googleusercontent.com/translate_f#_Toc256868441)\n\
  \n# C# 和 .NET Framework 简介\n\n`C#` 是一种优雅、强类型、面向对象的语言，用于开发运行在 [.NET Framework 工作](https://translate.googleusercontent.com/translate_f#_.NET_Framework_Conceptual)\
  \ 中的多种安全强大的应用程序 [[i]](https://translate.googleusercontent.com/translate_f#_edn1)\
  \ 。你可以使用 `C#` 开发常见的 Windows 客户端应用程序、XML Web 服务、分布式组件、服务器-客户端应用程序、数据库应用程序以及许多其他程序。Visual\
  \ `C#` 2008 包含一个高级代码编辑器、用户友好的设计器、内置调试器以及许多其他工具，可以帮助你使用 `C#` 3.0 和 .NET Framework\
  \ 3.5 开发应用程序。\n\n| ![Note](img/Image00001.jpg) 注意。 |\n| :--- | :--- |\n| 阅读 Visual\
  \ `C#` 文档假设用户具备基础编程原理知识。对于初学者，互联网上提供了 Visual `C#` 快速版。你还可以利用互联网上的 `C#` 书籍和资源来获得实践编程技能。\
  \ |\n\n## C# 语言\n\n`C#` 语法非常富有表现力，但于学习。任何熟悉 `C`、`C++` 或 `Java` 的人都能识别出 `C#` 语言特有的大括号语法。熟悉其中任何一种语言的开发者通常都能够在很短时间内有效地与\
  \ `C#` 语言一起工作。`C#` 语法简化了 `C++` 中困难的操作，并提供了 `Java` 不具备的强大功能，如可空值类型、`enums`（枚举）、`delegates`（委托）、`lambda\
  \ expressions`（Lambda 表达式）以及直接内存访问。`C#` 支持泛型方法和类型以获得更好的安全性和性能，还支持迭代器，迭代器允许你在实现可以轻松在客户端代码中使用的类集合时，定义自己的迭代行为。在\
  \ `C#` 3.0 中，语言集成查询 (`LINQ`) 表达式使强类型查询成为一种一等语言结构。\n\n作为一种面向对象的语言，`C#` 支持封装、继承和多态的概念。所有变量和方法（包括作为应用程序入口点的\
  \ `Main` 方法）都封装在类定义中。一个类可以直接继承一个父类，但可以实现任意数量的接口。覆盖父类中 `virtual` 方法的方法需要 `override`\
  \ 关键字以防止意外定义。在 `C#` 中，结构类似于轻量级类：它是一种栈分配的类型，实现了接口但不支持继承。\n\n除了上述描述的基础面向对象原则外，`C#`\
  \ 通过几种创新的语言结构简化了软件组件的开发，包括：\n\n*   封装的方法签名，称为 `delegates`（委托），它支持强类型事件通知。\n*   作为私有成员变量访问器的属性。\n\
  *   具有运行时声明性类型元数据的特性。\n*   内联 XML 文档注释。\n*   `LINQ`（语言集成查询），提供了跨多个数据源的内置查询能力。\n\n\
  如果你需要与其他 Windows 软件（如 `COM` 对象或原生 `Win32` `DLLs`）互操作，可以使用 `C#` 中称为“Interop”（互操作）的过程。Interop\
  \ 过程允许 `C#` 程序几乎可以执行原生 `C++` 可能执行的任何操作。在直接内存访问至关重要的情况下，`C#` 甚至支持指针和“不安全”代码的概念。\n\
  \n与 `C` 和 `C++` 相比，`C#` 的生成过程比 `Java` 更简单灵活。没有单独的头文件，方法和类型不需要按特定顺序声明。在 `C#` 源文件中定义任意数量的类、结构、接口和事件。\n\
  \n## .NET Framework 架构\n\n`C#` 程序运行在 .NET Framework 中，这是一个集成的 Windows 组件，包含虚拟机运行时\
  \ (`CLR`) 和一套统一的类库。`CLR` 是微软对 `CLI` 的商业实现，`CLI` 是支持运行时和开发环境创建的国际标准，这些环境使得语言和库之间能够紧密互操作。\n\
  \n用 `C#` 编写的源代码根据 `CLI` 规范编译成中间语言 (`IL`)。`IL` 代码和如位图、字符串等资源存储在磁盘上称为程序集（assembly）的可执行文件中，程序集包含有关类型、版本、文化和安全要求的清单。运行\
  \ `C#` 程序时，`CLR` 根据程序集中的信息加载程序集。`CLR` 执行 `JIT` 编译将 `IL` 代码转换为机器码指令。\n\n`CLR` 还提供了与垃圾回收、异常处理和资源管理相关的其他服务。由\
  \ `CLR` 执行的代码有时被称为“托管代码”，相对于针对特定系统的“非托管代码”。\n\n![从 C# 源代码到执行](img/Image0002.jpg)\n\
  \n语言之间的互操作是 .NET Framework 的一个关键特性。由于 `C#` 编译器生成的 `IL` 代码符合 `CTS` 规范，基于 `C#` 的 `IL`\
  \ 代码可以与 Visual Basic、Visual C++、Visual J# 以及其他 20 多种语言的代码互操作。单个程序集可以包含用不同语言编写的模块，类型之间像在相同语言中编写一样相互引用。\n\
  \n除了运行时服务，.NET Framework 还拥有超过 4000 个命名类的类的库，提供了从文件输入输出、字符串处理 XML 解析到 Windows Forms\
  \ 的各种有用函数。在典型的 `C#` 应用程序中，.NET Framework 类库被大量用于开发代码。\n\n## 创建你的第一个 C # 应用程序\n\n\
  创建一个 `C#` 只需要几分钟。按照以下步骤创建一个打开窗口并响应按键的程序。\n\n### 创建 C # 应用程序\n\n1.  在 `文件` 菜单上，指向\
  \ `新建`，然后点击 `项目`。\n2.  确保选择了 `Windows 应用程序` 模板，在 `名称` 字段中输入 `MyProject` 并点击 `确定`\
  \ 。\n\n将在将在 Forms 设计器中看到一个 Windows Form。这是你应用程序的用户界面。\n\n3.  在 `视图` 菜单上，点击 `工具箱`\
  \ 使控件列表可见。\n4.  展开 `常用控件` 列表，并将`标签`控件拖到表单上。\n5.  同样从`工具箱` `常用控件` 列表中，将一个按钮拖到表单上，位于标签附近。\n\
  6.  双击新按钮以打开 `代码编辑器`。Visual `C#` 插入了一个名为 `button1_Click` 的方法，该方法在按钮被点击时执行。\n7. \
  \ 将方法更改为如下所示：\n\n\n\n\n\n```csharp\nprivate void button1_Click (object sender, EventArgs\
  \ e){\n    label1.Text = \"Hello, World!\";\n}\n```\n\n8. 按 `F5` 编译并运行你的应用程序。\n\n\
  当你点击按钮时，将显示一条文本消息。恭喜！你刚刚编写了你的第一个 C# 应用程序。\n\n## 创建第一个 C# 应用程序\n\n创建一个 C# 应用程序只需不到一分钟。按照以下步骤创建一个可以打开窗口并响应按钮点击的程序。\n\
  \n### 创建 C# 应用程序\n\n1. 在 `File` 菜单上，指向 `New` 并点击 `Project`。\n2. 确保选中了 `Windows Application`\
  \ 模板，在 `Name` 字段中输入 `MyProject`，并点击 `OK`。\n\n`Windows Form Designer` 将打开，并显示一个 `Windows\
  \ Form`。这是你正在创建的应用程序的用户界面。\n\n3. 在 `View` 菜单上，点击 `Toolbox` 打开控件列表。\n4. 展开 `Standard\
  \ Controls` 列表，并将一个 `Signature` 控件拖到表单上。\n5. 同样，从 `Standard Controls` 工具箱列表中，将一个\
  \ `button` 拖到表单上并将其放在签名旁边。\n6. 双击新的 `button` 打开代码编辑器。`Visual C #` 已插入了一个名为 `button1_Click`\
  \ 的方法，该方法会在点击按钮时执行。\n7. 按照如下所示修改方法。\n\n```csharp\nprivate void button1_Click (object\
  \ sender, EventArgs e){\n    label1.Text = \"Hello, World!\";\n}\n```\n\n8. 按 `F5`\
  \ 键编译并运行应用程序。\n\n现在点击按钮将显示一条文本消息。恭喜！第一个 C# 应用程序已创建。\n\n## 创建 C# 控制台应用程序\n\n本主题的目的是让你在构建最简单的\
  \ C# 程序形式——控制台应用程序的过程中，熟悉 `Visual C # Express Edition` 开发环境。因为控制台应用程序在命令行中执行所有输入和输出，因此它们非常适合快速尝试语言特性和编写命令行实用程序。\n\
  \n| 本节讨论的开发环境功能在开发 Windows Forms 应用程序时也会遇到。不要仅仅因为不计划编写控制台应用程序就跳过这部分！ |\n\n在本节中，你将学习：\n\
  * 如何创建一个新的控制台应用程序。\n* 如何在 `Code editor` 中使用书签。\n* 如何查看 `Solution Explorer`。\n* 如何保持代码格式整洁。\n\
  * 如何使用 `IntelliSense` 让代码输入更快、更准确。\n* 如何生成并运行你的应用程序。\n\n你在任务中创建的程序使用了 `System.IO`\
  \ 命名空间中的类来获取并显示 `C:\\` 目录的文件列表和大小。你可以使用此代码作为搜索目录中特定文件名实用程序的基础。\n\n1. 在 `File` 菜单上，点击\
  \ `New Project`。\n\n出现 `New Project` 对话框。此对话框列出了 `Visual C # Express Edition` 可以创建的不同默认应用程序类型。\n\
  2. 选择 `Console Application` 作为项目类型，并将你的应用程序命名为 `List Files`。\n默认位置通常可以，但如果你需要，也可以随时输入新路径。\n\
  3. 点击 `OK`。\n\n### 创建 C# 控制台应用程序（详细）\n\n本节的目的是通过构建最简单的 C# 程序形式——控制台应用程序，向你介绍 `Visual\
  \ C # Express Edition` 开发环境。因为控制台应用程序通过命令行进行输入和输出，因此它们非常适合快速熟悉语言的能力并编写命令行实用程序。\n\
  \n| 本节描述的开发环境功能在开发 Windows Forms 应用程序时也会被使用。即使你不计划构建控制台应用，也不要跳过这部分！ |\n\n内容\n* 创建新的控制台应用程序。\n\
  * 在代码编辑器中使用书签。\n* 使用 `Solution Explorer`。\n* 维护正确的代码格式。\n* 使用 `IntelliSense` 编写更快、更准确的代码。\n\
  * 生成并运行应用程序。\n\n在本节中创建的程序使用了 `System.IO` 命名空间中的类来获取并显示 `C:` 目录下文件名和大小的列表。此代码可以作为搜索目录中特定文件名实用程序的基础。\n\
  \n1. 在 `File` 菜单上，选择 `New Project`。\n\n打开 `New Project` 对话框。此对话框列出了你可以使用 `Visual\
  \ C #` 构建的不同默认应用程序类型。\n2. 选择 `Console Application` 作为项目类型，并将应用程序名称更改为 `File List`。你可以保留默认位置或根据喜好指定新路径。\n\
  3. 点击 `OK` 按钮。\n\n`Visual C # Express Edition` 会为你的项目创建一个以项目标题命名的新文件夹。它还会打开主 `Visual\
  \ C # Express Edition` 窗口和 `Code pane`，你将在其中输入和修改创建应用程序的 C# 源代码。\n\n![ExpressCS\
  \ screenshot(Image00003.jpg)\n\n注意窗口顶部的工具栏。此工具栏包含用于创建、加载和保存项目、编辑源代码、生成你的应用程序以及隐藏和显示组成\
  \ `Visual C # Express Edition` 环境的其他窗口的图标。工具栏最右侧的五个图标用于打开如 `Solution Explorer` 和\
  \ `Toolbox` 等重要窗口。将鼠标指针悬停在这些图标的任何一个上以获取弹出工具提示 `Help`。\n\n| 在编写大型程序时，书签非常有用，因为它们能让你快速从源代码的一个位置跳转到另一个位置。要创建书签，点击\
  \ `Toggle bookmark` 图标，或按 `CTRL + B, T`。你会在边距看到一个青色的标记。使用相同的步骤删除现有的书签。你可以创建任意数量的书签，并使用\
  \ `Next Bookmark` 和 `Previous Bookmark` 图标在它们之间跳转，或者通过按 `CTRL + B, N` 和 `CTRL +\
  \ B, P`。 |\n\nVisual C # Express 将为你的项目创建一个以项目标题命名的新文件夹。它还会打开主 Visual C # Express\
  \ Edition 窗口和 Code Pane，用于输入和修改创建应用程序的 C# 源代码。\n\n![ExpressCS screenshot(Image00003.jpg)\n\
  \n注意窗口顶部的工具栏。此工具栏包含用于创建、加载和保存项目、编辑源代码、生成你的应用程序以及隐藏和显示其他窗口的图标。工具栏右边缘有五个用于打开 Solution\
  \ Explorer 和 Toolbox 窗口的图标。当鼠标悬停在这些图标的任何一个上时，会出现工具提示。\n\n| 在编写大型程序时，书签非常有用，借助它们的帮助，你可以快速从源代码的一个地方跳转到另一个地方。要创建书签，你需要点击“Bookmark”图标或按键键组合\
  \ `CTRL + B, T`。字段上将出现一个蓝色标记。你可以创建任何数量的书签并使用 `Next Bookmark` 和 `Previous Bookmark`\
  \ 图标在它们之间移动，或者通过按 `CTRL + B, N` 和 `CTRL + B, P`。 |\n\n4. 通过点击屏幕右侧的 `Solution Explorer`\
  \ 选项或工具栏上的 `Solution Explorer` 图标，确保 `Solution Explorer` 是可见的。\n\n`Solution Explorer`\
  \ 是一个非常有用的窗格，因为它显示了组成你项目的各种文件。该项目最重要的文件是 `Program.cs`，它包含了你应用程序的源代码。\n\n![ExpressThumbtack(Image00004.jpg)\n\
  \n如果你想保持你的 Visual C # Express Edition 显示整洁，知道如何打开和隐藏如 `Solution Explorer` 等窗口是很重要的。默认情况下，`Solution\
  \ Explorer` 是可见的。如果你想隐藏 `Solution Explorer`，请点击 `Auto Hide` 图标、标题栏中的 `push-pin`\
  \ 图标，或者打开 `Solution Explorer` 标题栏上的 `Options` 菜单并启用 `Auto Hide`。其他窗口（如 `Class View`\
  \ 和 `Properties`）也有这些图标。\n\n\n\n\n\n### 5. 在代码编辑器中输入类名 `Console`\n\n如果 `Solution\
  \ Explorer` 仍然遮挡了 `Code` 格，请点击 `Code` 格将其隐藏。现在，点击 `Main` 方法内部左大括号 `{` 的右侧，并按 `ENTER`\
  \ 换行。注意编辑器如何自动对光标进行缩进。\n\n> 代码编辑器始终尝试将你的代码格式化为标准的、易读的布局。如果你的代码开始变得杂乱，可以通过点击 `Edit`\
  \ 菜单中的 `Advanced` 然后选择 `Format Document`，或者通过按下 `CTRL + E, D` 来重新格式化整个文档。\n\n###\
  \ 4. 点击屏幕右侧的 `Solution Explorer` 标签或工具栏上的 `Solution Explorer` 图标，验证 `Solution Explorer`\
  \ 是否显示\n\n`Solution Explorer` 面板非常有用，它显示在项目包含的各种文件上。最重要的项目文件是 `Program.cs`，它包含了应用程序的源代码。\n\
  \n![ExpressThumbtack](img/Image00005.jpg)\n\n了解如何打开和隐藏如 `Solution Explorer` 这样的窗口非常重要，这样可以保持\
  \ `Visual C# Express Edition` 正常状态。`Solution Explorer` 默认可见。要隐藏 `Solution Explorer`，请点击\
  \ `Auto-Hide` 图标（标题栏中的大针图标），或在 `Solution Explorer` 标题栏中打开 `Options` 菜单并选择 `Auto\
  \ Hide`。其他窗口如 `Class View` 和 `Properties` 也有这些图标。\n\n### 5. 在代码编辑器输入类名 `Console`\n\
  \n如果 `Solution Explorer` 仍然隐藏了 `Code` 格，请点击 `Code` 格将其隐藏。现在，点击 `Main` 方法内部左大括号 `{`\
  \ 的右侧并按 `Enter` 移动到新行。注意编辑器会自动进行缩进。\n\n> 代码编辑器始终尝试将输入的代码格式化为标准的、易读的结构。如果代码看起来不美观，可以通过选择\
  \ `Edit` 菜单中的 `More` 并点击 `Format Document`，或者通过按下 `CTRL + E, D` 来重新格式化整个文档。\n\n\
  当你输入一个 `C#` 类名或关键字时，你有一个选择：你可以自己输入完整的单词，也可以让 `Code` 格中包含的 IntelliSense 工具为你完成。例如，当你输入\
  \ `\"c\"` 时，会弹出一个单词列表，IntelliSense 会尝试预测你正在输入的单词。在这种情况下，你暂时还看不到显示的 `\"Console\"\
  ` 单词。你可以向下滚动列表，或者继续输入单词 `\"console.\"`。当 `\"console\"` 在列表中高亮显示时，按下 `ENTER`、`TAB`\
  \ 或双击它，`Console` 就会被添加到你的代码中。\n\n![ExpressCase screenshot](img/Image00006.jpg)\n\
  \n使用 IntelliSense 的优势在于，你可以确定字母的大小写和拼写是正确的。是自己输入代码还是让 IntelliSense 来完成完全取决于你。\n\n\
  当你输入类名或 `C#` 关键字时，你可以选择是自己完成单词的输入，还是让 `Code` 格中内置的 IntelliSense 工具来完成。例如，输入 `\"\
  c\"` 将显示由 IntelliSense 建议的单词列表，你可以从中选择你正在输入的单词。在这种情况下，单词 `\"Console\"` 尚不可见。向下滚动列表或继续输入单词\
  \ `\"console\"`。当单词 `\"console\"` 在列表中被高亮时，按下 `Enter`、`TAB` 或双击它，`Console` 就会被添加到代码中。\n\
  \n![ExpressCase screenshot](img/Image00006.jpg) 使用 IntelliSense 的优势在于你对单词正确的大小写和拼写充满信心。用户可以自己输入代码也可以使用\
  \ IntelliSense 技术。\n\n### 6. 输入句点和方法名 `WriteLine`\n\n一旦你在 `Console` 之后输入句点，另一个 IntelliSense\
  \ 列表就会显示。此列表包含了 `Console` 类部分的所有可能的方法和属性。你需要 `WriteLine` 方法，你可以在列表底部看到它。你可以自己完成输入\
  \ `WriteLine`，或者一直按 `DOWN ARROW` 键直到选中它，然后按 `ENTER`、`TAB` 或双击它。`WriteLine` 就会被添加到你的代码中。\n\
  \n![ExpressConsole](img/Image00007.jpg)\n\n输入一个左括号。你会立即看到另一个 IntelliSense 功能——方法签名以工具提示消息的形式出现。在这种情况下，你可以看到有\
  \ 19 种不同的签名，你可以通过点击 `UP` 和 `DOWN ARROW` 键来查看它们。\n\n### 7. 输入字符串 `\"This program\
