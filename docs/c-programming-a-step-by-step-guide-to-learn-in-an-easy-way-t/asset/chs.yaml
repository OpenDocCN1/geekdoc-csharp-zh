  \n\n\n\n\n# Windows Presentation Foundation (WPF) 允许你为应用程序创建视觉增强型用户界面。即使是你在标准 Windows\
  \ Forms 应用程序中常见的典型控件在 WPF 应用程序中也得到了增强。标准的 WPF 控件类似于你在 Windows Forms 工具箱中找到的控件。WPF\
  \ 控件属于 `System.Windows.Controls` 命名空间，而不是 `System.Windows.Forms` 命名空间。还可以通过使用 XAML\
  \ 标记创建 WPF 控件。\n\n当你从工具箱将 WPF 控件拖到设计表面上时，这些控件类似于 Windows Form 应用程序中的控件。然而，WPF 控件是可以自定义的。WPF\
  \ 控件支持样式和模板，这允许你创建视觉上吸引人的应用程序。要修改控件的外观，可以在 XAML 编辑器中向控件添加样式和属性。由于手动编写 XAML 标记非常困难，你可能希望考虑使用可以为你生成\
  \ XAML 的应用程序，例如 Expression Blend。\n\n## 过程：向 WPF 窗口添加控件\n\n1. 在 `File` 菜单上，点击 `New\
  \ Project`。\n2. 在 `New Project` 对话框中，在 `Templates` 格中，点击 `WPF Application`。\n3.\
  \ 在 `Name` 框中输入 `WPFControls`，然后点击 `OK`。\n4. 创建一个新的新的 Windows Presentation Foundation\
  \ 项目。\n5. 从 `Toolbox` 中，将一个 `TextBox` 控件拖到 WPF 窗口的右上方。\n6. 点击文本框。\n\n## WPF 标准控件\n\
  \n7. 在 `Properties` 窗口中为文本框设置以下属性。\n\n| Property | Value |\n| :--- | :--- |\n| `VerticalAlignment`\
  \ | Top |\n| `Width` | 75 |\n| `Height` | 26 |\n\n8. 向 WPF 窗口添加一个 `Button` 控件，紧邻文本框。\n\
  9. 在 XAML 编辑器中，将起始标签和结束 `Button` 标签之间的文本从 `Button` 更改为 `Add`，如下例所示。\n\n```xml\n\
  <Button Height=\"23\" HorizontalAlignment=\"Right\" Margin=\"0,59,35,0\" Name=\"\
  Button1\" VerticalAlignment=\"Top\" Width=\"75\"> Add </Button>\n```\n\n10. 在输入新值后，按钮上的文本会发生变化。\n\
  11. 在文本框下方向 WPF 窗口添加一个 `ListBox` 控件。\n12. 双击按钮添加默认事件处理程序，并添加以下代码：\n\n```csharp\n\
  if (textBox1.Text != \"\"){\n    listBox1.Items.Add(textBox1.Text);\n    textBox1.Text\
  \ = \"\";\n}\n```\n\n13. 按 `F5` 运行你的程序。出现包含你刚刚添加的文本框、列表框和按钮的窗口。\n14. 在文本框中输入一些文本，然后点击\
  \ Add 按钮。验证文本已添加到列表框。\n15. 向列表中添加额外的文本。\n\n## 标准控件总结\n\nWindows Presentation Foundation\
  \ (WPF) 允许你为应用程序创建视觉增强型用户界面。在应用程序中，WPF 甚至改进了 Windows Forms 的标准应用程序控件。标准的 WPF 元素类似于\
  \ Windows Forms 工具箱中找到元素。WPF 控件属于 `System.Windows.Controls`，而不是 `System.Windows.Forms`。你也可以使用\
  \ XAML 标记创建 WPF 控件。\n\n当你从工具箱将 WPF 控件拖到设计表面上时，它们类似于 Windows Forms 应用程序中的控件。然而，WPF\
  \ 控件是可以自定义的。WPF 控件支持样式和模板，帮助你创建视觉上吸引的应用程序。要更改控件的外观，可以在 XAML 编辑器中为其添加样式和属性。由于自己编写\
  \ XAML 标记很困难，请尝试使用 Expression Blend 等应用程序生成 XAML。\n\n## 详细属性配置\n\n| Property | Value\
  \ |\n| :--- | :--- |\n| `VerticalAlignment` | Top edge |\n| `Width` | 75 |\n| `Height`\
  \ | 26 |\n\n## 事件处理程序实现\n\n```csharp\nif (textBox1.Text != \"\"){\n    listBox1.Items.Add(textBox1.Text);\n\
  \    textBox1.Text = \"\";\n}\n```\n\n\n\n\n\n-   文档控件，例如 `System.Windows.Controls.DocumentViewer`\
  \ 和 `System.Windows.Controls.FlowDocumentPageViewer`。\n\n| `System.Windows.Controls.ListBox`\
  \ | 允许用户从列表中选择项。 |\n| :--- | :--- |\n| `System.Windows.Controls.RadioButton` | 允许用户从互斥的项目中选择一个。选择一个单选按钮将排除同一容器中的任何其他按钮。\
  \ |\n| `System.Windows. Controls.StackPanel` | 允许你水平或垂直方向排列子控件。 |\n| `System.Windows.Control.TabControl`\
  \ | 允许你以表格形式排列视觉内容。 |\n| `System.Windows.Controls.TextBox` | 显示未格式化的文本并允许用户输入文本。\
  \ |\n\n### 工具箱中可用的其他控件\n\n- 托管控件，例如 `System.Windows.Controls.Canvas`、`System.Windows.Controls.DockPanel`\
  \ 和 `System.Windows.Controls.Frame`。更多信息请参阅“了解 WPF 容器控件”。\n- 菜单和工具栏，例如 `System.Windows.Controls.Menu`、`System.Windows.Controls.ToolBar`\
  \ 和 `System.Windows.Controls.Primitives.StatusBar`。\n- 文档控件，例如 `System.Windows.Controls.DocumentViewer`\
  \ 和 `System.Windows.Controls.FlowDocumentPageViewer`。\n\n## 如何：为 WPF 控件创建事件处理程序\n\
  \n你可以通过双击设计视图中的控件为许多控件添加默认事件处理程序。你还可以通过向 Windows Presentation Foundation (WPF) 应用程序中控件的\
  \ XAML 表示添加属性来创建创建事件处理程序。此 XAML 标记定义了事件以及处理该事件的方法名称。然后，你在代码编辑器中编写该方法的代码。\n\n###\
  \ 为按钮创建事件处理程序\n\n1. 使用 Visual C# Express 版创建一个 WPF 应用程序。更多信息请参阅“如何：创建新的 WPF 项目”。\n\
  2. 从工具箱将 `Button` 拖入 WPF 窗口，然后选择该按钮。\n3. 双击按钮。\n\n`Click` 事件处理程序被创建，且光标将置于代码编辑器中的事件处理程序中。\n\
  4. 向事件处理程序添加以下代码：\n\n```csharp\nMessageBox.Show (\"Event handler was created by\"\
  \ + \"double-clicking the button.\");\n```\n\n5. 从工具箱将第二个 `Button` 控件拖入 WPF 设计表面，然后选择该按钮。\n\
  6. 在 XAML 编辑器中向 `Button` 元素添加一个名为 `Click` 的属性，并将其值设置为 `ButtonOKClicked`。这是你在代码中为事件处理程序指定的名称。例如，该属性可以写为：`Click\
  \ = \"ButtonOKClicked\"`。\n7. 右键单击设计器，然后点击“查看代码”。\n8. 向 `Window1` 类添加以下事件处理程序。每当您点击按钮时，此代码都会显示一条消息。\n\
  \n```csharp\nprivate void ButtonOKClicked (object sender, RoutedEventArgs e){\n\
  \    MessageBox.Show (\"Event handler was created manually.\");\n}\n```\n\n9. 按\
  \ `F5` 运行程序。\n10. 当窗口出现时，点击按钮。\n11. 验证点击每个按钮时消息框中是否显示了正确的文本，然后关闭应用程序。\n\n## 为 WPF\
  \ 控件创建事件处理程序（摘要）\n\n对于许多控件，你可以添加默认事件处理程序。要执行此操作，在设计模式下双击所需的控件。或者，你也可以通过向 Windows\
  \ Presentation Foundation (WPF) 应用程序中控件的 XAML 添加属性来创建事件处理程序。XAML 标记定义了事件以及处理该事件的方法名称。然后，在代码编辑器中，你可以编写该方法的代码。\n\
  \n为按钮创建事件处理程序\n\n1. 使用 Visual C# Express 版创建 WPF 应用程序。\n2. 从工具箱将 `Button` 控件拖入 WPF\
  \ 窗口，然后选择该按钮。\n3. 双击按钮。\n\n`Click` 事件处理程序被创建，鼠标指针位于代码编辑器中的事件处理程序中。\n4. 向你的事件处理程序添加以下代码。\n\
  \n```csharp\nMessageBox.Show (\"Event handler was created by\" + \"double-clicking\
  \ the button.\");\n```\n\n5. 从工具箱将第二个 `Button` 控件拖到 WPF 设计表面，然后选择该按钮。\n6. 在 XAML\
  \ 编辑器中向 `Button` 元素添加一个名为 `Click` 的属性，并将其设置为 `ButtonOKClicked`。这将分配给你代码中事件处理程序的名称。例如，属性可以写如下所示：`Click\
  \ = \"ButtonOKClicked\"`。\n7. 右键单击设计器，然后点击“查看代码”。\n8. 向 `Window1` 类添加以下事件处理程序。每当按下按钮时，此代码都会显示一条消息。\n\
  \n```csharp\nprivate void ButtonOKClicked (object sender, RoutedEventArgs e){\n\
  \    MessageBox.Show (\"Event handler was created manually.\");\n}\n```\n\n9. 按\
  \ `F5` 键执行程序。\n10. 当窗口出现时，点击按钮。\n11. 确保每次点击每个按钮时消息框中都显示正确的文本，然后关闭应用程序。\n\n## 连接到数据\n\
