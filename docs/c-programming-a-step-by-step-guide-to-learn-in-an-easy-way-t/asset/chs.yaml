  \n![较大架构中的托管代码](img/Image00030.jpg)\n\n后续章节提供了 .NET Framework 核心组件和特性的更详细描述。\n\n\
  ## 公共语言运行时特性\n\n公共语言运行时管理内存、线程执行、代码执行、代码安全验证、编译和其他系统服务。这些特性对于运行在公共语言运行时上的托管代码是内在。\n\
  \n关于安全性，托管组件根据许多因素被授予不同程度的信任，这些因素包括它们的来源（例如互联网、企业网络或本地计算机）。这意味着一个托管组件可能可能无法执行文件访问操作、注册表访问操作或其他敏感功能，即使它被用在同一个活动应用程序中。\n\
  \n运行时强制代码访问安全。例如，用户可以信任嵌入在 Web 页面中的可执行文件可以在屏幕上播放动画或唱歌曲，但不能访问其个人数据、文件系统或网络。因此，运行时的安全特性使得合法的互联网部署软件具有极其丰富的功能。\n\
  \n运行时通过实现称为公共类型系统（`CTS`）的严格类型和代码验证基础设施来强制代码的健壮性。`CTS` 确保所有托管代码都是自描述的。各种微软和第三方语言编译器生成的符合\
  \ `CTS` 的托管代码。这意味着托管代码可以消耗其他托管类型和实例，同时严格执行类型保真性和类型安全。\n\n此外，运行时的托管环境消除了许多常见的软件问题。例如，运行时会自动处理对象布局并管理对对象的引用，并在对象不再被使用时释放它们。这种自动内存管理解决了两个最常见的应用程序错误：内存泄漏和无效内存引用。\n\
  \n运行时还加速了开发者的生产力。例如，程序员可以使用他们选择的开发语言编写应用程序，同时充分利用运行时、类库以及由其他开发者用其他语言编写的组件。任何选择目标运行运行时编译器供应商都可以这样做。目标为\
  \ .NET Framework 的语言编译器使 .NET Framework 的特性对该语言编写的现有代码可用，极大地简化了现有应用程序的迁移过程。\n\n\
  ## CLR 特性\n\n`CLR` 管理内存、线程执行、代码执行、代码安全检查、编译和其他系统服务。这些工具是运行在 `CLR` 中的托管代码的内部工具。\n\
  \n出于安全考虑，托管组件根据许多因素被分配不同的信任级别，这些因素包括它们的来源（例如互联网、企业网络或本地计算机）。这意味着一个托管组件可能可能执行文件访问操作、注册表访问操作或其他关键功能，即使它被用在同一个活动应用程序中。\n\
  \n\n\n\n# 运行时概述\n\n运行时提供了代码访问控制。例如，用户可以信任嵌入在网页中的可执行应用程序，使其在屏幕上播放动画或进行录音，同时防止其访问个人数据、文件系统或网络。通过这种方式，`CLR`\
  \ 安全性为部署在互联网上的真实软件提供了极其丰富的功能。\n\n运行时还通过实现名为泛型类型系统（`CTS`）的强类型和代码验证框架，提供了代码的可靠性。泛型类型系统允许所有托管代码都是自描述的。各种\
  \ Microsoft 和第三方语言编译器都会生成符合泛型类型系统的托管代码。这意味着托管代码可以接受其他托管类型和实例，同时仍保持类型正确性和强类型性。\n\n\
  此外，托管运行时消除了许多常见的软件问题。例如，运行时会自动管理对象的放置和对象引用，并在它们不再被使用时释放它们。自动内存管理消除了两种最常见的应用程序错误：内存泄漏和无效的内存引用。\n\
  \n运行时运行时还提高了开发者的效率。例如，程序员可以使用他们熟悉的开发语言编写应用程序，同时充分利用其他开发者用其他语言编写的运行时、类库和组件。对于任何访问运行时的编译器供应商来说都是可行的。针对\
  \ `.NET Framework` 的语言编译器使得用相应语言编写现有代码可以使用 `.NET Framework`，极大地促进了现有应用程序的迁移。\n\n\
  虽然运行时是为未来的软件设计的，但它支持今天和昨天的软件。托管代码与非托管代码之间的互操作性允许开发者继续使用必要的 `COM` 组件和 `DLLs`。\n\n\
  运行时旨在增强性能。尽管通用语言运行时提供了许多标准的运行时服务，但托管代码绝不会被解释。一种称为即时编译（`JIT`）的特性允许所有托管代码在执行其运行的系统的原生机器语言上运行。同时，内存管理器消除了内存碎片的可能性并增加了内存引用局部性，以进一步提高性能。\n\
  \n最后，运行时可以由高性能的服务器端应用程序托管，例如 `Microsoft® SQL Server ™` 和 `Internet Information Services\
  \ (IIS)`。这种基础设施使您能够使用托管代码编写业务逻辑，同时享受到支持运行时托管的行业顶级企业级服务器的卓越性能。\n\n## .NET Framework\
  \ 类库\n\n`.NET Framework` 类库是一组可重用的类型，它们与通用语言运行时紧密集成。类库是面向对象的，提供了类型，您自己的托管代码可以从这些派生功能。这不仅使得\
  \ `.NET Framework` 类型易于使用，还减少了学习 `.NET Framework` 新功能相关的时间。此外，第三方组件可以与 `.NET Framework`\
  \ 中的类无缝集成。\n\n例如，`.NET Framework` 集合类实现了一组接口，您可以使用这些接口来开发自己的集合类。您的集合类将与 `.NET Framework`\
  \ 中的类无缝融合。\n\n正如您对面向对象的类库所预期的那样，`.NET Framework` 类型允许您完成一系列常见的编程任务，包括字符串管理、数据收集、数据库连接和文件访问等任务。除了这些常见任务，类库还包含了支持各种特殊开发场景的类型。例如，您可以使用\
  \ `.NET Framework` 开发以下类型的应用程序和服务：\n\n* 控制台应用程序。\n* Windows GUI 应用程序 (Windows Forms)。\n\
  * Windows Presentation Foundation (WPF) 应用程序。\n* `ASP.NET` 应用程序。\n* Web 服务。\n* Windows\
  \ 服务。\n* 使用 Windows Communication Foundation (`WCF`) 的面向服务的应用程序。\n* 使用 Windows Workflow\
  \ Foundation (`WF`) 的启用工作流的应用程序。\n\n例如，Windows Forms 类是一套全面的可重用类型，极大地简化了 Windows\
  \ GUI 开发。如果您编写 `ASP.NET` Web Form 应用程序，可以使用 Web Forms 类。\n\n# MS Visual Studio 环境下的\
