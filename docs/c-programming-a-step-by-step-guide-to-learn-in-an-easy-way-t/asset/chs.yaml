  \ 和 `ValidateNames` 属性。\n\n# 教程：显示调色板\n\n你可以使用内置的 `ColorDialog` 组件显示颜色对话框，而不是创建自己的调色板。例如，当用户点击表单上的按钮时，允许他们选择一种颜色应用于\
