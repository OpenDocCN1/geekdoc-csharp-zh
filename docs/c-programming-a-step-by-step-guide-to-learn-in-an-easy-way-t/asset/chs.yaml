  \ `break` 语句在整数计数达到 \"10\" 时跳出 `for` 循环。\n\n### 示例\n\n```csharp\nfor (int counter\
  \ = 1; counter <= 1000; counter ++)\n{\n    if (counter == 10)\n      break;\n \
  \   System.Console.WriteLine (counter);\n}\n```\n\n### 编译代码\n\n将代码复制并粘贴到控制台应用程序的\
  \ `Main` 方法中。\n\n## 字符串\n\n`C#` 字符串是不可变的：一旦创建，就无法更改。处理字符串的方法会返回新的字符串对象。因此，出于性能考虑，大量的字符串拼接或其他操作应该使用\
  \ `StringBuilder` 类来执行，如下方的代码所示。\n\n`C#` 字符串是一个一个或多个字符的组合，使用 `string` 关键字声明，属于 `System`\
  \ 类。与 `C++` 中的字符数组相比，`C#` 中的字符串用用得多，且不容易出现编程错误。\n\n字符串字面量使用引号声明，如下例所示：\n\n```csharp\n\
  string greeting = \"Hello, World!\";\n```\n\n\n\n\n`@` 符号表示在创建字符串时忽略转义字符和换行符。因此，以下两个字符串是相同的：\n\
  \n```csharp\nstring p1 = \"\\\\\\\\ My Documents \\\\ My Files \\\\\";\nstring p2\
  \ = @\" \"\\\\ My Documents \\ My Files \\\";\n```\n\n### ToString()\n\nC# 的内置数据类型都提供了\
  \ `ToString()` 方法，该方法将值转换为字符串。此方法可用于数值转换为字符串，如下所示：\n\n```csharp\nint year = 1999;\n\
  string msg = \"Eve was born in\" + year.ToString ();\nSystem.Console.WriteLine (msg);\
  \ // 输出 \"Eve was born in 1999\"\n```\n\n### @ 符号\n\n`@` 符号表示在创建字符串时忽略转义字符和换行符。接下来的两行是相同的：\n\
  \n```csharp\nstring p1 = \"\\\\\\\\ My Documents \\\\ My Files \\\\\";\nstring p2\
  \ = @\" \"\\\\ My Documents \\ My Files \\\";\n```\n\n### ToString()\n\n所有 C# 内置数据类型都提供一个\
  \ `ToString()` 方法，可以将值转换为字符串。该方法可以将数值转换为字符串，如下：\n\n```csharp\nint year = 1999;\n\
  string msg = \"Eve was born in\" + year.ToString ();\nSystem.Console.WriteLine (msg);\
  \ // 输出 \"Eve was born in 1999\"\n```\n\n### 访问单个字符\n\n可以使用 `Substring`、`Replace`、`Split`\
  \ 和 `Trim` 等方法访问字符串中的单个字符。\n\n```csharp\nstring s3 = \"Visual C # Express\";\nSystem.Console.WriteLine\
  \ (s3.Substring (7, 2)); // 输出 \"C #\"\nSystem.Console.WriteLine (s3.Replace (\"\
  C #\", \"Basic\")); // 输出 \"Visual Basic Express\"\n```\n\n也可以将字符复制到字符数组中，如下：\n\n\
  ```csharp\nstring s4 = \"Hello, World\";\nchar [] arr = s4.ToCharArray (0, s4.Length);\n\
  foreach (char c in arr){\n    System.Console.Write (c); // 输出 \"Hello, World\"\n\
  }\n```\n\n可以使用索引访问字符串中的单个字符，如下：\n\n```csharp\nstring s5 = \"Printing backwards\"\
  ;\nfor (int i = 0; i <s5.Length; i ++){\n    System.Console.Write (s5 [s5.Length\
  \ - i - 1]); // 输出 \"sdrawkcab gnitnirP\"\n}\n```\n\n### 访问单个字符\n\n可以使用 `Substring`、`Replace`、`Split`\
  \ 和 `Trim` 等方法访问字符串中的单个字符。\n\n```csharp\nstring s3 = \"Visual C # Express\";\nSystem.Console.WriteLine\
  \ (s3.Substring (7, 2));\n// 输出：\"C #\"\nSystem.Console.WriteLine (s3.Replace (\"\
  C #\", \"Basic\"));\n// 输出：\" Visual Basic Express \"\n```\n\n你也可以将字符复制到字符数组，如下所示：\n\
  \n```csharp\nstring s4 = \"Hello, World\";\nchar [] arr = s4.ToCharArray (0, s4.Length);\n\
  foreach (char c in arr)\n{\n    System.Console.Write (c); // 输出 \"Hello, World\"\
  \n}\n```\n\n可以使用索引访问字符串中的单个字符，如下所示：\n\n```csharp\nstring s5 = \"Printing backwards\"\
  ;\nfor (int i = 0; i <s5.Length; i ++)\n{\n    System.Console.Write (s5 [s5.Length\
  \ - i - 1]);\n}\n// 输出：\"sdrawkcab gnitnirP\"\n```\n\n### 更改大小写\n\n要将字符串中的字母转换为大写或小写，使用\
  \ `ToUpper()` 或 `ToLower()`，如下：\n\n```csharp\nstring s6 = \"Battle of Hastings,\
  \ 1066\";\nSystem.Console.WriteLine (s6.ToUpper ()); // 输出 \"BATTLE OF HASTINGS\
  \ 1066\"\nSystem.Console.WriteLine (s6.ToLower ()); // 输出 \"battle of hastings 1066\"\
  \n```\n\n### 更改大小写\n\n要更改字符串中字母的大小（大写或小写），使用 `ToUpper()` 或 `ToLower()`，如下所示：\n\n\
  ```csharp\nstring s6 = \"Battle of Hastings, 1066\";\nSystem.Console.WriteLine (s6.ToUpper\
  \ ());\n// 输出 \"BATTLE OF HASTINGS 1066\"\nSystem.Console.WriteLine (s6.ToLower\
  \ ());\n// 输出 \"battle of hastings 1066\"\n```\n\n### 比较\n\n比较两个字符串的最简单方法是使用 `==`\
  \ 和 `!=` 符号，它们执行区分大小敏感的比较。\n\n```csharp\nstring color1 = \"red\";\nstring color2\
  \ = \"green\";\nstring color3 = \"red\";\nif (color1 == color3)\n{\n    System.Console.WriteLine\
  \ ( \"Equal\" );\n}\nif (color1 != color2)\n{\n    System.Console.WriteLine ( \"\
  Not equal\" );\n}\n```\n\n### 比较\n\n比较两个字符串的最佳方法是使用 `==` 和 `!=` 运算符，它们提供了区分大小敏感的比较。\n\
  \n```csharp\nstring color1 = \"red\";\nstring color2 = \"green\";\nstring color3\
  \ = \"red\";\nif (color1 == color3)\n{\n    System.Console.WriteLine ( \"Equal\"\
  \ );\n}\nif (color1 != color2)\n{\n    System.Console.WriteLine ( \"Not equal\"\
  \ );\n}\n```\n\n字符串对象还有一个 `CompareTo()` 方法，该方法根据一个字符串小于 (`<`) 还是大于另一个字符串 (`>`) 返回一个整数值。在比较字符串时，使用\
  \ Unicode 值，小写的值比大写的值小。\n\n```csharp\n// 为 string1 和 string2 输入不同的值以\n// 测试 CompareTo\
  \ 的行为\nstring string1 = \"ABC\";\nstring string2 = \"abc\";\nint result = string1.CompareTo\
  \ (string2);\nif (result> 0)\n{\n    System.Console.WriteLine ( \"{0} is greater\
  \ than {1}\", string1, string2);\n}\nelse if (result == 0)\n{\n    System.Console.WriteLine\
  \ ( \"{0} is equal to {1}\", string1, string2);\n}\nelse if (result < 0)\n{\n  \
  \  System.Console.WriteLine ( \"{0} is less than {1}\", string1, string2);\n}\n\
  // 输出：ABC is less than abc\n```\n\n对于字符串对象，还有一个 `CompareTo()` 方法，根据一个字符串是否小于 (`<`)\
  \ 或大于 (`>`) 另一个字符串返回一个值。在比较字符串时，使用 Unicode 值，小写的值小于大写的值。\n\n```csharp\n// 为 string1\
  \ 和 string2 输入不同的值以\n// 测试 CompareTo 的行为\nstring string1 = \"ABC\";\nstring string2\
  \ = \"abc\";\nint result2 = string1.CompareTo (string2);\nif (result2> 0)\n{\n \
  \   System.Console.WriteLine (\"{0} is greater than {1}\", string1, string2);\n\
  }\nelse if (result2 == 0)\n{\n    System.Console.WriteLine (\"{0} is equal to {1}\"\
  , string1, string2);\n}\nelse if (result2 < 0)\n{\n    System.Console.WriteLine\
  \ (\"{0} is less than {1}\", string1, string2);\n}\n// 输出：ABC is less than abc\n\
  ```\n\n要在另一个字符串中搜索字符串，使用 `IndexOf()`。如果未找到搜索字符串，`IndexOf()` 返回 -1；否则，它返回第一次出现的从\
  \ 0 开始的索引。\n\n```csharp\nstring s9 = \"Battle of Hastings, 1066\";\nSystem.Console.WriteLine\
  \ (s9.IndexOf ( \"Hastings\" )); // 输出 10\nSystem.Console.WriteLine (s9.IndexOf\
  \ ( \"1967\" )); // 输出 -1\n```\n\n### 将字符串拆分为子字符串\n\n将字符串拆分为子字符串（例如将句子拆分成单词）是一项常见的编程任务。`Split()`\
  \ 方法接收一个分隔符的字符数组（例如，空格字符），并返回子字符串数组。你可以使用 `foreach` 访问此数组，如下所示：\n\n```csharp\nchar\
  \ [] delimit = new char [] {''};\nstring s10 = \"The cat sat on the mat.\";\nforeach\
  \ (string substr in s10.Split (delimit))\n{\n    System.Console.WriteLine (substr);\n\
  }\n```\n\n此代码每行输出一个单词，如下所示：\n\nThe\ncat\nsat\non\nthe\nmat.\n\n### 将字符串拆分为子字符串\n\
  \n将字符串拆分为子字符串（类似于将句子拆分成单词）是一项常见的编程任务。`Split()` 方法接收一个字符 类型的分隔符数组（例如，分隔符可以是空格），并返回子字符串数组。该数组只能通过\
  \ `foreach` 访问，如下所示：\n\n```csharp\nchar [] delimit = new char [] {''};\nstring s10\
  \ = \"The cat sat on the mat.\";\nforeach (string substr in s10.Split (delimit))\n\
  {\n    System.Console.WriteLine (substr);\n}\n```\n\n此代码每行输出一个单词，如下所示：\n\nThe\n\
  cat\nsat\non\nthe\nmat.\n\n![clear](img/Image00021.jpg) 使用 StringBuilder\n\n\n\n\
  \n\n# StringBuilder\n\n`StringBuilder` 类创建了一个字符串缓冲区，如果你的程序执行大量的字符串操作，它将提供更好的性能。`StringBuilder`\
  \ 类还允许你重新分配单个字符，这是内置的字符串数据类型不支持的。\n\n在以下示例中，创建了一个 `StringBuilder` 对象，并使用 `Append`\
  \ 方法逐个添加其内容。\n\n```csharp\nclass TestStringBuilder{\n    static void Main ()\n \
  \   {\n        System.Text.StringBuilder sb = new System.Text.StringBuilder ();\n\
  \        // 创建一个由数字 0 - 9 组成的字符串\n        for (int i = 0; i <10; i ++)\n       \
  \ {\n            sb.Append (i.ToString ());\n        }\n        System.Console.WriteLine\
  \ (sb); // displays 0123456789\n        // 复制字符串中的一个字符（System.String 不可以）\n    \
  \    sb [0] = sb [9];\n        System.Console.WriteLine (sb); // displays 9123456789\n\
  \    }\n}\n```\n\n## 使用 StringBuilder 类\n\n`StringBuilder` 类创建了一个字符串缓冲区，当你的程序处理许多字符串时，它可以提高性能。`StringBuilder`\
  \ 类还允许你重新分配单个字符，这是内置的字符串数据类型不支持的。\n\n以下示例创建了一个 `StringBuilder` 对象，并使用 `Append` 方法顺序添加其内容。\n\
  \n```csharp\nclass TestStringBuilder\n{\n    static void Main ()\n    {\n      \
  \  System.Text.StringBuilder sb = new System.Text.StringBuilder ();\n        //\
  \ 创建一个由数字 0 - 9 组成的字符串\n        for (int i = 0; i <10; i ++)\n        {\n      \
  \      sb.Append (i.ToString ());\n        }\n        System.Console.WriteLine (sb);\
  \ // displays 0123456789\n        // 复制字符串中的一个字符（System.String 不可以）\n        sb\
  \ [0] = sb [9];\n        System.Console.WriteLine (sb); // displays 9123456789\n\
  \    }\n}\n```\n\n## 如何：生成多行字符串字面量\n\n此示例演示了构造多行字符串字面量的两种方法。\n\n### 示例\n\n```csharp\n\
  string myString1 = \"This is the first line of my string. \\ n\" + \"This is the\
  \ second line of my string. \\ N\" + \"This is the third line of the string. \\\
  \ N\";string myString2 = @ \"This is the first line of my string.This is the second\
  \ line of my string.This is the third line of the string. \";\n```\n\n### 编译代码\n\
  \n将代码复制并粘贴到控制台程序的 `Main` 方法中。\n\n### 创建多行字符串字面量\n\n以下示例提供了创建多行字符串字面量的两种方法。\n\n###\
  \ 示例\n\n```csharp\nstring myString1 = \"This is the first line of my string. \\\
  \ n\" + \"This is the second line of my string. \\ N\" + \"This is the third line\
  \ of the string. \\ N\";\nstring myString2 = @ \"This is the first line of my string.This\
  \ is the second line of my string.This is the third line of the string. \";\n```\n\
  \n### 编译代码\n\n将代码复制并粘贴到控制台程序的 `Main` 方法中。\n\n## 如何：在字符串数组中搜索字符串\n\n此示例对字符串数组调用 `IndexOf`\
  \ 方法，以报告子字符串第一次出现的字符串编号和索引。\n\n### 示例\n\n```csharp\nstring [] strArray = {\"ABCDEFG\"\
  , \"HIJKLMNOP\"};string findThisString = \"JKL\";int strNumber;int strIndex = 0;for\
  \ (strNumber = 0; strNumber <strArray.Length; strNumber++) { strIndex = strArray[strNumber].IndexOf(findThisString);\
  \ if (strIndex >= 0) { System.Console.WriteLine(\"Found in \" + strNumber + \" at\
  \ index \" + strIndex); break; } }\n```\n\n### 编译代码\n\n将代码复制并粘贴到控制台程序的 `Main` 方法中。\n\
  \n`IndexOf` 方法返回子字符串第一次出现的索引。该索引从 0 开始，这意味着第一个字符位于索引 0 处。如果没有找到子字符串，则返回 -1。\n\n\
  ## 数组和集合\n\n存储相关数据项组是大多数应用程序的基本需求；实现此点的两种主要方法是使用数组和集合。\n\n### 数组\n\n数组是相同类型对象的集合。由于数组可以是任意任何长度，它们可以存储数千甚至数百万个对象，但大小必须在创建数组时决定。数组中的每个项通过索引访问，索引只是指示对象存储在数组中位置或槽位置的数字。\n\
  \n### 一维数组\n\n数组是对象的索引集合。对象的一维数组声明方式如下：\n\n```csharp\ntype [] arrayName;\n```\n\n\
  通常，你会在初始化数组的同时初始化其元素，如下：\n\n```csharp\nint [] array = new int [5];\n```\n\n\n\n\n\
  \n数值型数组元素的默认值为 0，引用型元素默认为 null，但你可以在创建数组时初始化值，如下：\n\n```java\nint [] array1 = new\
  \ int [] {1, 3, 5, 7, 9};\n```\n\n或者像这样：\n\n```java\nint [] array2 = {1, 3, 5, 7,\
  \ 9};\n```\n\n数组使用从零开始的索引，因此数组中的第一个元素是索引 0 的元素。\n\n```java\nstring [] days = { \"\
  Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thr\", \"Fri\", \"Sat\" };\nSystem.Console.WriteLine\
  \ (days [0]);  // 输出 \"Sun\"\n```\n\n## 数组与集合\n\n存储一组相关的数据是大多数软件应用程序的基本需求；实现这一目标有两种主要方法：数组和集合。\n\
  \n![clear](img/Image00021.jpg)\n\n## 数组\n\n数组是相同类型对象的集合。由于数组的长度实际上几乎是无限的，因此它们可以用于存储数千甚至数百万个对象，但在创建时必须指定数组的大小。数组的每个元素都通过数字索引来访问，该索引指示对象存储在数组中的位置或单元格。数组可以同时存储引用类型和值类型。\n\
  \n### 一维数组\n\n数组是带索引的对象集合。对象的一维数组声明方式如下。\n\n```java\ntype [] arrayName;\n```\n\n\
  通常，数组中的元素会同时初始化，如下所示。\n\n```java\nint [] array = new int [5];\n```\n\n数值型数组元素的默认值设置为\
  \ 0，引用型元素设置为 null，但在创建数组时可以如下所示初始化值。\n\n```java\nint [] array1 = new int [] {1,\
  \ 3, 5, 7, 9};\n```\n\n或者如此：\n\n```java\nint [] array2 = {1, 3, 5, 7, 9};\n```\n\
  \n数组索引从零开始，因此数组的第一个元素的编号为 0。\n\n```java\nstring [] days = { \"Sun\" , \"Mon\" ,\
  \ \"Tue\" , \"Wed\" , \"Thr\" , \"Fri\" , \"Sat\" };\nSystem.Console.WriteLine (days\
  \ [0]); // 输出 \"Sun\"\n```\n\n### 多维数组\n\n从概念上讲，二维多维数组类似于一个网格。三维多维数组类似于一个立方体。\n\n\
  ```java\n// 声明多维数组（二维）\nint [,] array2D = new int [2,3];\n// 声明并初始化多维数组\nint [,]\
  \ array2D2 = {{1, 2, 3}, {4, 5, 6}};\n// 在多维数组中写入元素\nfor (int i = 0; i <2; i ++)\n\
  {\n    for (int j = 0; j <3; j ++)\n    {\n        array2D [i, j] = (i + 1) * (j\
  \ + 1);\n    }\n}\n// 从多维数组中读取元素\nfor ( int i = 0; i <2; i ++)\n{\n    for (int\
  \ j = 0; j <3; j ++)\n    {\n        System.Console.Write (array2D [i, j]);\n  \
  \  }\n    System.Console.WriteLine ();\n}\n```\n\n### 锯齿数组\n\n多维数组的一种变体是交错数组：即数组的数组。交齿数组是一个一维数组，其每个元素本身也是数组。这些元素数组不需要具有相同的大小。\n\
  \n你可以像这样声明一个交齿数组：\n\n```java\nint [] [] jaggedArray = new int [3] [];\n```\n\n这样做会创建一个包含三个数组的数组。这些数组可以这样初始化：\n\
  \n```java\njaggedArray [0] = new int [5];\njaggedArray [1] = new int [4];\njaggedArray\
  \ [2] = new int [2];\n```\n\n### 多维数组（详细说明）\n\n从概念上讲，二维多维数组类似于一个网格。三维多维数组类似于一个立方体。\n\
  \n```java\n// 声明多维数组（ 二维 ）\nint [,] array2D = new int [2,3];\n// 声明并初始化多维数组\nint\
  \ [,] array2D2 = {{1, 2, 3}, {4, 5, 6}};\n// 在多维数组中写入元素\nfor ( int i = 0; i <2;\
  \ i ++)\n{\n    for ( int j = 0; j <3; j ++)\n    {\n        array2D [i, j] = (i\
  \ + 1) * (j + 1);\n    }\n}\n// 从多维数组中读取元素\nfor ( int i = 0; i <2; i ++)\n{\n  \
  \  for ( int j = 0; j <3; j ++)\n    {\n        System.Console.Write (array2D [i,\
  \ j]);\n    }\n    System.Console.WriteLine ();\n}\n```\n\n### 数组数组\n\n多维数组的一种类型是数组的数组。数组的数组是一维数组，其中每个元素都是数组。数组元素不需要具有相同的大小。\n\
  \n你可以如下所示声明数组的数组：\n\n```java\nint [] [] jaggedArray = new int [3] [];\n```\n\n创建一个包含三个数组的数组。这些数组可以这样初始化\n\
  \n```java\njaggedArray [0] = new int [5];\njaggedArray [1] = new int [4];\njaggedArray\
  \ [2] = new int [2];\n```\n\n### 使用 foreach 语句\n\n`foreach` 语句通常用于访问数组中的每个元素：\n\n\
  ```java\nint [] numbers = {4, 5, 1, 2, 3, -1, 0};\nforeach (int i in numbers)\n\
  \    Console.WriteLine (i);\n```\n\n`foreach` 语句通常用于访问存储在数组中的每个元素：\n\n```java\n\
  int [] numbers = {4, 5, 1, 2, 3, -1, 0};\nforeach ( i in numbers)\n{\n    System.Console.Write\
  \ (\"{}\", i);\n}\n// 输出：4 5 1 2 3 -1 0\n```\n\n### 对象数组\n\n创建对象数组而不是简单类型的数组是一个部分过程。首先你声明数组，然后创建存储在数组中的对象。此示例创建了一个音频\
  \ CD 类，然后创建了一个存储 20 个音频 CD 的数组。\n\n```java\nnamespace CDCollection\n{\n    // 定义\
  \ CD 类型。\n    class CD\n    {\n        private string album;\n        private string\
  \ artist;\n        private int rating;\n        public string Album\n        {\n\
  \            get { return album;}\n            set {album = value;}\n        }\n\
  \        public string Artist\n        {\n            get { return artist;}\n  \
  \          set {artist = value;}\n        }\n        public int Rating\n       \
  \ {\n            get { return rating;}\n            set {rating = value;}\n    \
  \    }\n    }\n    class Program\n    {\n        static void Main (string [] args)\n\
  \        {\n            // 创建存储 CD 的数组。\n            CD [] cdLibrary = new CD [20];\n\
  \            // 用 CD 对象填充库。\n            for (int i = 0; i <20; i ++)\n        \
  \    {\n                cdLibrary [i] = new CD ();\n            }\n            //\
  \ 为第一个专辑分配详情。\n            cdLibrary [0] .Album = \"See\" ;\n            cdLibrary\
  \ [0] .Artist = \"The Sharp Band\" ;\n            cdLibrary [0] .Rating = 10;\n\
  \        }\n    }\n}}\n```\n\n## 如何：声明数组 ![clear](img/Image00021.jpg)\n\n此示例展示了声明不同类型数组的三种方法：单维、多维和交齿。\n\
  \n示例\n\n```java\n// 单维数组。\nint [] myArray1 = new int [5];\nstring [] myArray2 =\
