  \ |\n\n### 示例\n\n```csharp\nint x = 100;\nif (x == 100){\n    System.Console.WriteLine\
  \ ( \"X is equal to 100\" );\n}\n```\n\n## 逻辑运算符\n\n在 C# 中，运算符的语法与其他 C 风格编程语言相似。运算符用于执行计算、赋值、检查相等和不相等性等。\n\
  \n\n\n\n\n```csharp\ndouble d = System.Math.Sin (System.Math.PI / 2);\n\ndouble\
  \ e = System.Math.Sqrt (144);\n```\n\n## 运算符重载\n\nC 支持运算符重载；这允许你重新定义运算符，使其在配合自定义数据类型时更具意义。在下面的示例中，创建了一个\
  \ `struct`，它使用由 `enumeration`（枚举）定义的变量类型存储星期中的某一天。加法运算符被重载，使得可以在当前天基础上增加整数数量的天数，并返回一个新的周几。因此，在周日增加一天会返回周一。\n\
  \n## 示例\n\n```csharp\nusing System;\n// 定义一个 DayOfWeek 数据类型\nenum DayOfWeek {Sunday,\
  \ Monday, Tuesday, Wednesday, Thursday, Friday, Saturday};\n\n// 定义一个用于存储方法和运算符的结构体\n\
  struct Day\n{\n    private DayOfWeek day;\n    // 结构体的构造函数\n    public Day (DayOfWeek\
  \ initialDay)\n    {\n        day = initialDay;\n    }\n    // 重载的 + 运算符\n    public\
  \ static Day operator + (Day lhs, int rhs)\n    {\n        int intDay = (int) lhs.day;\n\
  \        return new Day ((DayOfWeek) ((intDay + rhs)% 7));\n    }\n    // 重载的 ToString\
  \ 方法\n    public override string ToString ()\n    {\n        return day.ToString\
  \ ();\n    }\n}\n\npublic class Program\n{\n    static void Main ()\n    {\n   \
  \     // 创建一个名为 \"today\" 的新对象\n        Day today = new Day (DayOfWeek.Sunday);\n\
  \        Console.WriteLine (today.ToString ());\n        today = today + 1;\n  \
  \      Console.WriteLine (today.ToString ());\n        today = today + 14;\n   \
  \     Console.WriteLine (today.ToString ());\n    }\n}\n```\n\n# 决策与分支\n\n根据某些输入或计算值改变程序的控制流是编程语言的重要部分。C\
  \ 提供了跳转到代码中新位置（无条件）或通过测试（有条件）来改变控制流的能力。\n\n## 备注\n\n最简单的条件分支使用 `if` 结构。你可以在 `if`\
  \ 结构中使用 `else` 子句，并且 `if` 结构可以嵌套。\n\n```csharp\nusing System;\nclass Program\n{\n\
  \    static void Main ()\n    {\n        int x = 1;\n        int y = 1;\n      \
  \  if (x == 1)\n            Console.WriteLine ( \"x == 1\" );\n        else\n  \
  \          Console.WriteLine ( \"x! = 1\" );\n        if (x == 1)\n        {\n \
  \           if (y == 2)\n            {\n                Console.WriteLine ( \"x\
  \ == 1 and y == 2\" );\n            }\n            else\n            {\n       \
  \         Console.WriteLine ( \"x == 1 and y! = 2\" );\n            }\n        }\n\
  \    }\n}\n```\n\n注意：与 C++ 不同，`if` 语句需要布尔值。例如，不允许使用无法为简单 `True` 或 `False` 的语句，例如\
  \ `a = 10`。在 C 中，`0` 不能替代 `False`，`1` 或任何其他值不能替代 `True`。\n\n## 选择与分支\n\n根据某些输入或计算值改变程序的控制流是该语言的重要部分。C\
  \ 提供了改变流的能力，一种是通过无条件导航到代码中的新位置，另一种是通过测试有条件地导航。\n\n最简单的条件分支使用 `if` 结构。`else` 子句可以与\
  \ `if` 语句配合使用，`if` 语句可以嵌套。\n\n注意：与 C++ 不同，`if` 语句需要布尔。例如，不允许使用未设置为简单 `True` 或 `False`\
  \ 的运算符，例如 `a = 10`。在 C 中，`zero` 不能替换 `False`，另一个值不能替换 `True`。\n\n跟在 `if` 和 `else`\
  \ 关键字后面的语句可以是单行代码（如第一个 `if-else` 语句所示），也可以是语句块（如第二个 `if-else` 语句所示）。嵌套 `if-else`\
  \ 是允许的，但通常使用 `switch` 语句是更好的做法。\n\n`switch` 语句可以根据给定表达式的值执行多个操作。如果满足条件，则执行 `case`\
  \ 语句和 `break` 关键字之间的代码。如果你想让控制流继续到另一个 `case`，请使用 `goto` 关键字。\n\n```csharp\nusing\
  \ System;\nclass Program\n{\n    static void Main ()\n    {\n        int x = 3;\n\
  \        switch (x)\n        {\n            case 1:\n                Console.WriteLine\
  \ ( \"x is equal to 1\" );\n                break;\n            case 2:\n      \
  \          Console.WriteLine ( \"x is equal to 2\" );\n                break;\n\
  \            case 3:\n                goto default ;\n            default:\n   \
  \             Console.WriteLine ( \"x is equal to neither 1 nor 2\" );\n       \
  \         break;\n        }\n    }\n}\n```\n\n`switch` 语句用于确定执行哪个 `case` 的表达式必须使用内置数据类型，如\
  \ `int` 或 `string`；你不能使用更复杂的自定义类型。\n\n与 Visual Basic 不同，在 C 中条件必须是一个常量值。例如，不允许将表达式与值的范围进行比较。\n\
  \n跟在 `if` 和 `else` 关键字后面的语句可以表示单行代码（如第一个 `if-else` 语句所示），也可以表示括号内的语句块（如第二个 `if-else`\
  \ 语句所示）。嵌套 `if-else` 语句是合法的，但在编程中，最好的方法是使用 `switch` 语句。\n\n`switch` 语句用于确定其可执行的表达式必须使用内置数据类型，如\
  \ `int` 或 `string`；不能使用更复杂的自定义类型。\n\n## 循环\n\n\n\n\n\n## 循环\n\n循环是一个语句或一组语句，它们会按照指定的次数重复，直到满足某些条件为止。你所使用的循环类型取决于你的编程任务和个人编码偏好。`C#`\
  \ 与其他语言（如 `C++`）的一个主要区别在于是 `foreach` 循环，它旨在简化数组或集合的遍历。\n\n## foreach 循环\n\n`C#`\
  \ 引入了一种创建循环的方式，这对于 `C++` 和 C 程序员来说可能是全新的：`foreach` 循环。`foreach` 循环不再仅仅为了索引数组或其他数据结构（如集合）而创建一个变量，它会为你完成一些繁琐的工作：\n\
  \n```csharp\n// 一个整数数组\nint [] array1 = {0, 1, 2, 3, 4, 5};\nforeach (int n in array1)\n\
  {\n    System.Console.WriteLine (n.ToString ());\n}\n// 一个字符串数组\nstring [] array2\
  \ = { \"hello\", \"world\" };\nforeach (string s in array2)\n{\n    System.Console.WriteLine\
  \ (s);\n}\n```\n\n## 周期结构 (Cycles)\n\n周期结构是一条或多个语句，它们会重复指定的次数，直到满足特定条件为止。循环类型的选择取决于编程任务和个人编码偏好。`C#`\
  \ 与 `C++` 等其他语言的主要区别之一是 `foreach` 循环，它旨在使遍历数组或集合变得更加容易。\n\n![clear](img/Image00021.jpg)\
  \ Foreach 循环\n\n`C#` 引入了一种创建循环的新方法，`C++` 和 C 程序员可能并不熟悉：`foreach` 循环。`foreach` 循环不再仅仅是创建一个变量来索引数组或其他数据结构（如集合），它承担了更繁重的工作。\n\
  \n```csharp\n// 一个整数数组\nint [] array1 = {0, 1, 2, 3, 4, 5};\nforeach (int n in array1)\n\
  {\n    System.Console.WriteLine (n.ToString ());\n}\n// 一个字符串数组\nstring [] array2\
  \ = { \"hello\" , \"world\" };\nforeach (string s in array2)\n{\n    System.Console.WriteLine\
  \ (s);\n}\n```\n\n![clear](img/Image00021.jpg)\n\n## for 循环\n\n以下是使用 `for` 关键字创建相同循环的方式：\n\
  \n```csharp\n// 一个整数数组\nint [] array1 = {0, 1, 2, 3, 4, 5};\nfor (int i = 0; i <\
  \ 6; i ++)\n{\n    System.Console.WriteLine (array1 [i] .ToString ());\n}\n// 一个字符串数组\n\
  string [] array2 = { \"hello\", \"world\" };\nfor (int i = 0; i < 2; i ++)\n{\n\
  \    System.Console.WriteLine (array2 [i]);\n}\n```\n\n## while 循环\n\n`while` 循环版本在以下示例中：\n\
  \n```csharp\n// 一个整数数组\nint [] array1 = {0, 1, 2, 3, 4, 5};\nint x = 0;\nwhile (x\
  \ < 6)\n{\n    System.Console.WriteLine (array1 [x] .ToString ());\n    x ++;\n\
  }\n// 一个字符串数组\nstring [] array2 = { \"hello\", \"world\" };\nint y = 0;\nwhile (y\
  \ < 2)\n{\n    System.Console.WriteLine (array2 [y]);\n    y ++;\n}\n```\n\n## for\
  \ 循环\n\n以下展示了使用 `for` 关键字创建的几个循环。\n\n```csharp\n// 一个整数数组\nint [] array1 = {0, 1,\
  \ 2, 3, 4, 5};\nfor (int i = 0; i < 6; i ++)\n{\n    System.Console.WriteLine (array1\
  \ [i] .ToString ());\n}\n// 一个字符串数组\nstring [] array2 = { \"hello\" , \"world\"\
  \ };\nfor (int i = 0; i < 2; i ++)\n{\n    System.Console.WriteLine (array2 [i]);\n\
  }\n```\n\n![clear](img/Image00021.jpg) while 循环\n\n以下示例展示了 `while` 循环的变体。\n\n![clear](img/Image00021.jpg)\
  \ do-while 循环\n\n`do-while` 循环版本在以下示例中：\n\n```csharp\n// 一个整数数组\nint [] array1 =\
