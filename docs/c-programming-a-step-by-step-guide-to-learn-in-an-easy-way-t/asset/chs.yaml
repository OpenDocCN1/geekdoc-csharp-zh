  \ `InkCanvas` 并选择它，使复选框出现标记。\n12. 点击 `OK` 将 `InkCanvas` 控件添加到工具箱。\n13. 从工具箱将一个 `InkCanvas`\
  \ 控件拖到 `WPF` 窗口。\n14. 在 `Properties` 窗口中设置 `InkCanvas` 控件的以下属性：\n\n| 属性 | 值 |\n\
