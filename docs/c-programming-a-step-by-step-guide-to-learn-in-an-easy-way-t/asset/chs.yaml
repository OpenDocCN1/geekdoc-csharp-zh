  \ | Stretching |\n| `Margin` | 9, 9, 9, 68 |\n\n15. 通过将其 `Background` 属性设置为 `LightYellow`，将\
  \ `InkCanvas` 的颜色更改为黄色。\n\n`InkCanvas` 控件的背景在运行时将显示为浅黄色。\n\n16. 将两个 `Button` 控件拖入\
  \ `InkCanvas` 控件下方的 `WPF window` 中。将 `button1` 放在左侧，`button2` 放在右侧。\n\n17. 选择 `button1`\
