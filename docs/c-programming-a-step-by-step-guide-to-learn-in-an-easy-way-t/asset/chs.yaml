  \ |\n| VerticalAlignment | Stretch |\n| Margin | 9, 9, 9, 68 |\n\n15. 通过将将其 `Background`\
  \ 属性设置为 `LightYellow` 将 `InkCanvas` 控件的颜色更改为黄色。\n\n\n\n\n\n`InkCanvas` 控件的背景颜色在运行时将显示为浅黄色。\n\
  \n16. 将两个 `Button` 控件拖到 `InkCanvas` 下方的 `WPF Window` 中。将 `button1` 放在左侧，`button2`\
  \ 放在右侧。\n\n8. 在下拉列表中点击 `Brown` 并按 `Enter`，将 `WPF window` 的 `Background` 属性更改为棕色。\n\
  \n| 你也可以通过添加 `Background` 属性并将其值设置为 `Background = \"Brown\"` 来直接修改 XAML 标记。 |\n\n\
  9. 要打开 `Toolbox`，在 `View` 菜单上选择 `Toolbox`。\n\n10. 右键点击 `Toolbox` 并选择 `Select Elements`。[[1]](https://translate.googleusercontent.com/translate_f#_ftn1)\n\
  \n打开 `Select Toolbox Items` 对话框。\n\n11. 在 `Components` WPF 对话框上，选择 `Toolbox Items`，向下滚动到\
