  \ XAML 标记。\n\n```xml\n<Button Height = \"23\" HorizontalAlignment = \"Right\" Margin\
  \ = \"0,0,72,24\" Name = \"button2\" VerticalAlignment = \"Bottom\" Width = \"75\"\
  \ Click = \"ButtonCloseClicked\"> Close </Button>\n```\n\n4. `WPF application` 应该类似于下图中的\
  \ `Ink Pad` 应用程序。\n\n\n\n\n\n![属性窗口中的事件按钮](img/Image00023.jpg)\n\n### 设置属性\n\n在属性窗口中向表单添加控件后，你可以设置其属性，例如背景颜色和默认文本。在属性窗口中设置的值是在控件在运行时创建时分配给相应属性的初始值。在许多情况下，可以在运行时通过获取或设置应用程序中控件类实例的属性，以程序化的方式访问并更改这些值。属性窗口在运行时非常有用，因为它允许你查看控件支持的所有属性、事件和方法。\n\
  \n![clear](img/Image00021.jpg) # 事件处理\n\nGUI（图形用户界面）程序大多是基于事件的。此类程序会等待用户操作，例如在文本框中输入文本、按下按钮或更改组合框中的选择。当执行某项操作时，控件（它仅仅是\
  \ .NET Framework 类的实例）会向应用程序分发事件。要处理事件，你可以在应用程序中编写一个特殊方法，该方法会在接收到事件时调用。\n\n在属性窗口中，你可以指定要在代码中处理的事件。要查看控件的事件，请在设计器中选择它，并点击属性窗口中带有闪电图标的“事件”按钮。下图显示了一个事件按钮。\n\
  \n![“属性窗口”中的事件按钮](img/Image00023.jpg)\n\n当你通过属性窗口添加事件处理程序时，设计器将为你自动编写空的方法体，你必须编写代码使该方法执行某些有用操作。大多数控件会生成许多事件，但大多数情况下，应用程序只需要处理其中几个，甚至只处理其中一个。例如，你可能需要处理按钮的\
  \ `Click` 事件，但除非你想以某种高级方式自定义它的外观，否则你不需要处理它的 `Paint` 事件。每个控件都有一个默认事件处理程序。你可以通过在设计器中双击控件来创建默认事件处理程序。这将创建事件处理程序并打开代码编辑器，以便你编写代码来处理该事件。\n\
  \n# 如何：使用按钮控件\n\n按钮允许用户与你的程序交互。例如，许多对话框都有一个确定按钮和一个取消按钮。用户可以点击确定按钮来提交在对话框中输入的信息。或者，他们可以点击取消来关闭对话框而不提交任何数据。\n\
  \n你可以设置按钮的属性来更改其外观。例如，你可以设置 `Text` 属性在按钮上显示特定文本，或设置 `ForeColor` 属性更改文本颜色。\n\n每当用户在控件上执行特定操作时，控件就会触发事件。你可以创建事件处理程序，来决定程序应如何响应事件。所有控件都有一个默认事件处理程序，对于按钮来说，就是\
  \ `Click` 事件。你在按钮的 `Click` 事件处理程序中编写的代码会在每当用户点击按钮时运行。\n\n当你使用属性窗口添加事件处理程序时，构造函数将自动编写空方法的主体，用户必须编写代码，以便该方法能够执行必要的操作。大多数控件会生成许多事件，但应用程序通常只需要处理其中的一小部分，甚至只有一个。例如，你可能想处理按钮的\
  \ `Click` 事件，但不想处理它的 `Paint` 事件，除非你想以某种额外方式更改它的外观。每个控件都有一个默认事件处理程序。要创建默认事件处理程序，请在表单上双击控件。将创建一个事件处理程序并打开代码编辑器以编写处理该事件的代码。\n\
  \n## 使用按钮控件\n\n按钮允许用户与程序交互。例如，许多对话框有确定和取消按钮。用户可以点击确定来提交对话框中输入的信息。否则，他们可以点击取消关闭窗口而不提交数据。\n\
  \n你可以设置属性来更改其外观。例如，你可以设置 `Text` 属性在按钮上显示特定文本，或设置 `ForeColor` 属性更改文本颜色。\n\n对于控件，当用户在控件上执行某些操作时，会触发事件。创建事件处理程序允许你定义程序应如何响应事件。所有控件都有一个默认事件处理程序；对于按钮，该处理程序是\
  \ `Click`。在 `Click` 事件处理程序中编写的代码会在用户点击按钮时执行。\n\n### 在程序中使用按钮\n\n1. 在“文件”菜单上，点击`NewProject`。\n\
  2. 在“新建项目”对话框中，在“模板”窗格中，点击`Windows Forms Application`。\n3. 在“名称”框中输入 `ButtonExample`，然后点击“确定”。\n\
  一个新的 Windows Forms 项目将打开。\n4. 从“工具箱”将一个 `Button` 控件拖到表单上。\n5. 在属性窗口中，将 `Text` 属性更改为\
  \ `Display Date` 然后按 `ENTER`。\n6. 在属性窗口中，点击 `ForeColor` 属性右侧的箭头，然后点击打开的对话框中的“自定义”选项卡。\n\
  7. 点击红色框以给按钮文本应用红色字体。\n8. 在表单中，双击按钮以打开代码编辑器。\n代码编辑器将在名为 `button1_Click` 的方法中间打开。这就是\
  \ `Click` 事件处理程序。\n9. 在 `button1_Click` 事件处理程序中，输入以下行。\n\n``````\nMessageBox.Show(\"\
  Today is\" + DateTime.Today.ToLongString());\n```\n10. 按 F5 运行程序。\n11. 程序启动并出现表单。当你点击按钮时，消息框会显示今天的日期。\n\
  \n## 如何：通过程序调用按钮的 Click 事件\n\n即使用户没有点击按钮，你也可以通过 `PerformClick` 方法程序化地触发按钮的 `Click`\
  \ 事件。下面的示例了如何在程序内部调用按钮的点击事件。当 `button2` 被点击时，`button1` 的点击事件也会触发。\n\n### 在程序中使用按钮\n\
  \n1. 在“文件”菜单上，点击`NewProject`。\n2. 在“新建项目”对话框中，在“模板”窗格中，点击`Windows Forms Application`，然后点击“确定”。\n\
  一个新的 Windows Forms 项目将打开。\n3. 从“工具箱”将两个 `Button` 控件拖到表单上。\n4. 在表单中，双击第一个按钮 (`button1`）以创建\
  \ `Click` 事件处理程序。\n5. 在 `button1_Click` 事件处理程序中，输入以下代码行。\n\n``````\nMessageBox.Show(\"\
  button1.Click was raised.\");\n```\n6. 右键点击代码，然后点击`View Designer`。\n\n\n\n\n\n7.\
  \ 双击第二个按钮 (`button2`) 以创建 `Click` 事件处理程序。\n\n8. 在 `button2_Click` 事件处理程序中，输入以下行代码。\n\
  \n```csharp\n// Call the Click event of button1.test.PerformClick ();\n```\n\n9.\
  \ 按 `F5` 运行程序。\n\n10. 程序启动并出现表单。当你点击任意 `button1` 或 `button2` 时，`button1` 的点击事件处理程序将显示一条消息。\n\
  \n### 通过程序调用按钮点击事件\n\n使用户没有点击按钮，也可以使用 `PerformClick` 方法程序化地调用按钮的 `Click` 事件。下面的代码示例展示了如何程序化触发按钮点击事件。点击\
  \ `button 1` 也会触发 `button2` 的点击事件。\n\n### 在程序中使用按钮\n\n1. 在 `File`（文件）菜单上，选择 `New\
