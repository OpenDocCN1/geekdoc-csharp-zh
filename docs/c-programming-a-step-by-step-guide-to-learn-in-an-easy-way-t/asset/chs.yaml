  \n将代码复制并粘贴到控制台应用程序的 `Main` 方法中。\n\n\n\n\n.NET Framework 是一个集成的 Windows 组件，支持创建和执行下一代\
  \ XML 应用程序和 Web 服务。.NET Framework 具有以下目标：\n\n- 为本地对象代码的存储和执行提供一致的面向对象的编程环境，为通过互联网分发的代码提供本地执行，或提供远程执行。\n\
  - 提供一个代码执行环境，最大限度地减少软件部署和版本控制中的冲突。\n- 提供一个代码执行环境，确保代码的安全执行，包括由未知或未经过完全信任的第三方供应商生成的代码。\n\
  - 提供一个代码执行环境，消除运行脚本或解释型代码运行时带来的性能问题。\n- 在不同类型的应用程序（如 Windows 应用程序和 Web 应用程序）中提供一致的开发体验。\n\
  - 设计行业标准的互操作性，将 .NET Framework 代码与任何其他代码集成。\n\n.NET Framework 的两个主要组件是公共语言运行时（`CLR`）和\
  \ .NET Framework 类库。.NET Framework 基于 `CLR`。运行时可以被视为一个代理，负责在运行时管理代码并提供内存管理、线程管理和远程调用等基本服务。同时，它还施加了严格的类型条件和其他类型的代码准确性检查，以确保安全性和可靠性。事实上，运行时的主要任务是管理代码。访问运行时的代码被称为托管代码，而不访问运行时的代码被称为非托管代码。.NET\
  \ Framework 的另一个核心组件类库，提供了一套完整的、面向对象的类型集合，用于开发从命令行或图形用户界面应用程序到使用最新 `ASP.NET` 技术（如\
  \ Web Forms 和 XML Web 服务）的应用程序。\n\n.NET Framework 可以由非托管组件托管，这些组件将 `CLR` 加载到自己的进程中并触发托管代码的执行，从而创建一个允许同时进行托管和非托管执行的编程环境。.NET\
  \ Framework 不仅提供几个核心运行时，还支持独立供应商开发核心运行时。\n\n例如，`ASP.NET` 托管运行时以为托管代码提供可扩展的服务器端环境。`ASP.NET`\
  \ 直接与运行时协作，以启用 `ASP.NET` 应用程序和 XML Web 服务，这两将在本文主题的后后部分讨论。\n\nInternet Explorer\
  \ 是一个托管运行时（以 MIME 类型扩展的形式）的非托管应用程序示例。使用 Internet Explorer 托管运行时允许您在 HTML 文档中嵌入托管组件或\
  \ Windows Forms 控件。以这种方式托管运行时使得托管移动代码（类似于 Microsoft® ActiveX® 控件）成为可能，但提供了只有托管代码才能提供的显著改进，例如半信任执行和隔离文件存储。\n\
  \n下面的插图显示了公共语言运行时、类库与应用程序以及整个系统的关系。插图还显示了托管代码如何在较大的架构中运行。\n\n#### 场景下的 .NET Framework\n\
