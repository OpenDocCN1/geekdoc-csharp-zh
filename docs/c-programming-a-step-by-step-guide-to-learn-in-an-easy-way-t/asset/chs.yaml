  \n### 如何：在表单上嵌入 Windows Media Player\n你可以将 Windows Media Player 嵌入 Windows 表单中，为你的应用程序提供多媒体。你必须先将\
  \ Windows Media Player COM 控件添加到工具箱，然后就可以该控件添加到应用程序。\n\n#### 将 Windows Media Player\
  \ 控件添加到工具箱\n1. 在“文件”菜单上，点击`新建项目`。\n2. 在“新建项目”对话框中，点击`Windows Forms 应用程序`，然后点击`确定`。\n\
  打开一个新的 Windows Forms 项目。\n3. 右键点击`工具箱`，点击选择选择项目`。\n\n| ![Note](img/Image00001.jpg)\
  \ 注意：如果你没有看到工具箱，请点击“视图”菜单上的`工具箱`来打开它。 |\n4. 打开“自定义工具箱项”对话框。\n5. 在“COM 组件”选项卡上，勾选\
  \ Windows Media Player 复选框，然后点击`确定`。\n6. Windows Media Player 控件出现在当前的工具箱选项卡上。\n\
  \n当你将 Windows Media Player 控件添加到工具箱时，Visual Studio 会自动引用两个库：`AxWMPLib` 和 `WMPLib`。下一步是将控件添加到表单。\n\
  \n### 向应用程序添加多媒体文件\n为了增强你的应用程序，你可以添加多媒体组件，如音频、视频和图形文件。本节提供了指向描述为应用程序添加多媒体的常见编程任务主题链接。\n\
  \n### 在表单上嵌入 Windows Media Player\n你可以将 Windows Media Player 嵌入 Windows 表单中，为你的应用程序提供多媒体。Windows\
  \ Media Player COM 控件必须先添加到工具箱，然后就可以该控件添加到应用程序。\n\n#### 向工具箱添加 Windows Media Player\
  \ 控件\n1. 在“文件”菜单上，点击`新建项目`。\n2. 在“新建项目”对话框中，点击`Windows Forms 应用程序`，然后点击`确定`。\n打开一个新的\
  \ Windows Forms 项目。\n3. 右键点击`工具箱`，点击选择项目。\n\n| ![Note](img/Image00001.jpg) 注意：如果工具箱不可见，在“视图”菜单上选择`工具箱`。\
  \ |\n4. 打开“自定义工具箱项”对话框。\n5. 在“COM 组件”选项卡上，勾选 Windows Media Player 复选框，然后点击`确定`。\n\
  6. Windows Media Player 控件出现在当前的工具箱选项卡上。\n\n当你将 Windows Media Player 控件添加到工具箱时，Visual\
  \ Studio 会自动引用两个库：`AxWMPLib` 和 `WMPLib`。下一步是将控件添加到表单。\n\n#### 在表单上添加 Windows Media\
  \ Player 控件\n1. 从工具箱将 Windows Media Player 控件拖到 Windows 表单上。\n2. 在“属性”窗口中，将`停靠`属性设置为`填充`。你可以通过点击中心正方形来实现。\n\
  3. 双击表单的标题栏，在代码编辑器中添加默认的`加载`事件。\n4. 在 `Form_Load` 事件处理程序中添加以下代码，以便在应用程序打开时加载视频。\n\
  \n```cs\naxWindowsMediaPlayer1.URL = \"http://go.microsoft.com/fwlink/?LinkId=95772\"\
  ;\n```\n注意：使用的路径是一个指向在线视频的链接。你可以更改路径和文件名以显示不同的视频。\n\n5. 此代码将 Windows Media Player\
  \ 的 URL 设置为你指定的媒体文件。由于 `autoStart` 属性默认为 true，当你设置 `URL` 属性时，Windows Media Player\
  \ 将开始播放。\n6. 按 `F5` 运行代码。\n7. 当应用程序打开时，通过双击表单的标题栏将表单的大小更改为全屏。\n\n\n\n\n\n| Note.该路径是指向互联网视频的直接链接。你可以更改路径和文件名以显示其他视频内容。`axWindowsMediaPlayer1.URL\
  \ =\"http://go.microsoft.com/fwlink/?LinkId=95772\";` |\n\n5. 此代码将 `URL` 设置为 Windows\
  \ Media Player 中指定的媒体文件。当你设置 `URL` 属性时，Windows Media Player 将自动开始播放，因为 `autoStart`\
  \ 属性默认设置为 `\"true\"`。\n\n6. 按 `F5` 键执行代码。\n\n7. 在打开的应用程序中，双击表单标题栏将表单大小调整为全屏。\n\n\
  # 如何：在应用程序中播放声音\n\n你可以使用 `System.Media` 命名空间为你的应用程序添加声音。在应用程序中使用 `System.Media.SystemSounds.Beep.Play();`\
  \ 可以播放系统声音（例如蜂鸣声）。\n\n你还可以播放特定的音频文件。以下示例展示了如何播放用户选择的波形音频文件。\n\n## 播放音频文件\n\n1. 在\
  \ `File` 菜单上，点击 `New Project`。\n\n2. 在 `New Project` 对话框中，点击 `Windows Forms Application`，然后点击\
  \ `OK`。\n\n打开一个新的 Windows Forms 项目。\n\n3. 从 `Toolbox` 拖一个 `Button` 控件到 `Windows\
  \ Form`。\n\n4. 双击按钮以创建默认的 `Click` 事件处理程序，并添加以下代码。此代码将显示 `File Open` 对话框并将结果传递给名为\
  \ `playSound` 的方法，该方法将在将在中中创建。\n\n```cs\nOpenFileDialog dialog = new OpenFileDialog\
  \ ();\ndialog.Filter = \"Audio Files (.wav) | *.wav\" ;if (dialog.ShowDialog ()\
  \ == DialogResult.OK){\n    string path = dialog.FileName;\n    playSound (path);}\n\
  }\n```\n\n5. 在 `button1_Click` 事件处理程序下添加以下方法代码。\n\n```cs\nprivate void playSound\
  \ (string path){\n    System.Media.SoundPlayer player = new System.Media.SoundPlayer\
  \ ();\n    player.SoundLocation = path;\n    player.Load ();\n    player.Play ();\n\
  }\n```\n\n6. 按 `F5` 运行代码。\n\n7. 点击按钮并选择音频文件。文件加载后，声音将开始播放。\n\n# 在应用中播放音频\n\n你可以使用\
  \ `System.Media` 命名空间为你的应用程序添加声音。在应用程序中播放系统声音（如标准蜂鸣声）是通过 `System.Media.SystemSounds.Beep.Play();`\
  \ 完成的……\n\n此外，还可以播放某些音频文件。以下示例显示了用户的 WAV 格式音频文件的播放。\n\n## 播放音频文件\n\n1. 在 `File`\
  \ 菜单上，选择 `New Project`。\n\n2. 在 `New Project` 对话框中，选择 `Windows Forms Application`，然后点击\
  \ `OK`。\n\n将打开一个新的 Windows Forms 项目。\n\n3. 从 `Toolbox` 将 `Button` 控件拖到表中。\n\n4.\
  \ 双击按钮创建默认的 `Click` 事件处理程序并添加以下代码。此代码显示文件打开对话框并将结果传递给名为 `playSound` 的方法，该方法将在下一步中创建。\n\
  \n```cs\nOpenFileDialog dialog = new OpenFileDialog ();\ndialog.Filter = \"Audio\
  \ Files (.wav) | *.wav\" ;if (dialog.ShowDialog () == DialogResult.OK){\n    string\
  \ path = dialog.FileName;\n    playSound (path);}\n}\n```\n\n5. 在 `button1_Click`\
  \ 事件处理程序下方添加以下方法代码。\n\n6. 按 `F5` 键执行代码。\n\n7. 点击按钮并选择音频文件。加载文件后，声音将开始播放。\n\n# 创建和使用位图和图标\n\
  \n此主题旨在帮助你使用 Visual C# Express 版演示如何执行常见位图和图标编程任务的代码。\n\n## 如何：在运行时创建位图\n\n此示例创建并填充一个\
  \ `Bitmap` 对象，然后在 `PictureBox` 控件中显示它。要运行此示例，创建一个 `Windows Forms Application` 项目并从\
  \ `Toolbox` 将 `PictureBox` 控件拖到表中。`PictureBox` 的大小并不重要；它会自动调整大小以适应位图。将 `CreateBitmap`\
  \ 方法粘贴到 `Form1` 类中，并在 `Form1_Load` 事件处理程序中调用它。\n\n### 示例\n\n```cs\nvoid CreateBitmap\
  \ ()\n{\n    const int colWidth = 10;\n    const int rowHeight = 10;\n    System.Drawing.Bitmap\
  \ checks = new System.Drawing.Bitmap (\n        colWidth * 10, rowHeight * 10);\n\
  \    // 棋盘由 10 行 10 列组成。\n    // 棋盘中的每个方格都是 10 x 10 像素。\n    // 嵌套的 for 循环用于计算\n\
  \    // 位图表面上每个方格的位置，并将\n    // 像素设置为黑色或白色。\n    // 两个外部循环遍历\n    // 位图表面上的每个方格。\n\
  \    for (int columns = 0; columns <10; columns ++)\n    {\n        for (int rows\
  \ = 0; rows <10; rows ++)\n        {\n            // 确定当前方格\n            // 应该是黑色还是白色。\n\
  \            Color color;\n            if (columns % 2 == 0)\n            {\n  \
  \              color = Color.Black;\n            }\n            else\n         \
  \   {\n                color = Color.White;\n            }\n            // (为了简洁省略了设置像素的逻辑)\n\
  \        }\n    }\n}\n```\n（注：源文件中用于代码逻辑的文本是碎片化的；已对结构进行清理以提高可读性，同时保留原意。）\n\n\n\n\
  \n```cs\nclass Program{\n    static void Main (string [] args)    {\n        //\
  \ Load the image.\n        System.Drawing.Image image1 = System.Drawing.Image.FromFile\
  \ (@ \"C: \\ test.bmp\");\n        // Save the image in JPEG format.\n        image1.Save\
  \ (@ \"C: \\ test.jpg\", System.Drawing.Imaging.ImageFormat.Jpeg);\n        // Save\
  \ the image in GIF format.\n        image1.Save (@ \"C: \\ test.gif\", System.Drawing.Imaging.ImageFormat.Gif);\n\
  \        // Save the image in PNG format.\n        image1.Save (@ \"C: \\ test.png\"\
  , System.Drawing.Imaging.ImageFormat.Png);\n    }\n}\n```\n\n### 编译代码\n\n你可以在命令提示符处编译示例，或者使用\
  \ IDE 将代码粘贴到控制台应用程序中。对于后者，你必须引用 `System.Drawing.dll` 文件。\n\n将 `\"c: \\ test.bmp\"\
  `、`\"c: \\ test.jpg\"`、`\"c: \\ test.gif\"` 和 `c: \\ test.png` 替换为实际的文件名。\n\n 将图像从一种格式转换为另一种\n\
