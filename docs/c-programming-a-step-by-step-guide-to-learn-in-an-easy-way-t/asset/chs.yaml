  \ |\n| Name | addItems |\n| Text | Add |\n\n## 从对话框检索数据\n\n有几种方法可以将数据从一个 Windows\
  \ 表单传递到另一个。在例示例中，你会将 `Form1` 传递给 `Form2` 的构造函数。\n\n### 从对话框检索数据\n\n1. 双击 OK 以创建默认的\
  \ `Click` 事件处理程序。在向此过程添加代码之前，你应该为主表单创建一个变量，并为 `Form2` 类创建一个新构造函数。\n2. 在默认构造函数下方添加以下代码。此代码创建一个接受\
