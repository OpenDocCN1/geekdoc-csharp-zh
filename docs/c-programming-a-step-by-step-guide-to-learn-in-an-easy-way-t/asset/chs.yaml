  \ \"hello\", \"world\" };\nint y = 0;\ndo\n{\n    System.Console.WriteLine (array2\
  \ [y]);\n    y ++;\n} while (y < 2);\n```\n\n## 如何：跳出迭代语句\n\n此示例使用 `break` 语句在整数计数器达到\
  \ 10 时跳出 `for` 循环。\n\n### 示例\n\n```csharp\nfor (int counter = 1; counter <= 1000;\
  \ counter ++)\n{\n    if (counter == 10)\n      break;\n    System.Console.WriteLine\
  \ (counter);\n}\n```\n\n### 编译代码\n\n将代码复制并粘贴到控制台应用程序的 `Main` 方法中。\n\n## do-while\
  \ 循环\n\n以下示例展示了 `do-while` 循环的变体。\n\n```csharp\n// 一个整数数组\nint [] array1 = {0, 1,\
  \ 2, 3, 4, 5};\nint x = 0;\ndo\n{\n    System.Console.WriteLine (array1 [x] .ToString\
  \ ());\n    x ++;\n} while (x < 6);\n// 一个字符串数组\nstring [] array2 = { \"hello\"\
  , \"world\" };\nint y = 0;\ndo\n{\n    System.Console.WriteLine (array2 [y]);\n\
