  \ 0, 0, 100, 100);\n        myPen.Dispose();\n    }\n\n    // Click 消息的处理程序.\n \
  \   void myButton_Click (Object sender, System.EventArgs e)\n    {\n        MessageBox.Show\
  \ (\"Click\");\n    }\n}\n```\n\n\n\n\n你可以使用 `TextBox` 控件显示文本并从用户处检索文本。当用户在 `TextBox`\
