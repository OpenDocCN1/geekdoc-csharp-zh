  \ \\ test.png` 替换为实际文件名。\n\n### 自定义、显示和打印 Windows Forms\n\n本主题提供了相关链接，向你展示如何执行 Windows\
  \ Forms 的特定任务，例如自定义表单的形状和颜色，以及显示和打印表单。\n\n#### 如何：更改表单的背景颜色\n\n此示例通过程序更改 Windows\
  \ Form 程序的背景颜色。\n\n示例\n\n```cs\nprivate void Form1_Click (object sender, EventArgs\
  \ e){    \n    this.BackColor = System.Drawing.Color.DarkBlue;\n}\n```\n\n### 编译代码\n\
  \n此示例需要：\n\n*   一个名为 `Form1` 的表单。将其 `Click` 事件处理程序设置为 `Form1_Click`。\n\n#### 如何：创建形状表单\n\
  \n以下示例为表单提供了一个椭圆形。\n\n示例\n\n```cs\nSystem.Drawing.Drawing2D.GraphicsPath shape =\
  \ new System.Drawing.Drawing2D.GraphicsPath ();\nshape.AddEllipse (0, 0, this.Width,\
  \ this.Height);\nthis.Region = new System.Drawing.Region (shape);\n```\n\n### 编译代码\n\
  \n要使用此代码，请将其复制到 `Form1_Load` 事件处理程序中。\n\n`Form` 类的 `Region` 属性是一个高级成员。\n\n### 自定义、显示和打印\
