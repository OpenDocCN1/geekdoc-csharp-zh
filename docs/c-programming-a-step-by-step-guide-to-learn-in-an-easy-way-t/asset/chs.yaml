  ```\n\n19. `WPF application` 应该类似于下面插中的 `Ink Pad` 应用程序。\n\n### WPF Ink Application\n\
  ![WPF Ink Application](img/Image00020.jpg)\n\n### 创建事件处理程序\n\n1. 双击 `Clear`。\n2.\
  \ 选择 `button1` 并在 `XAML` 视图模式下更改 XAML 标记，如下所示。\n\n```xml\n<Button Height = \"23\"\
  \ HorizontalAlignment = \"Left\" Margin = \"85,0,0,24\" Name = \"button1\" VerticalAlignment\
