  \ C# 版本会自动为你创建空的事件处理程序。\n\n双击按钮，将看到项目的代码编辑器出现。你还会看到 `click` 事件的事件处理程序（即用户点击按钮时发生的事件消息）已为你创建。在事件处理方法中添加代码，使其类似于以下代码。\n\
  \n```csharp\nprivate void goButton_Click(object sender, System.EventArgs e)\n{\n\
  \    webBrowser1.Navigate(new Uri(comboBox1.SelectedItem.ToString()));\n}\n```\n\
  \n\n\n\n`WebBrowser` 元素处理渲染网页的所有复杂工作。在应用程序中，通过 `WebBrowser` 类实例来访问它。查看 `form1.Designer.cs`\
  \ 文件可以发现，该类的一个实例已添加到应用程序代码中，同时还有代表通过设计器添加的其他元素的类实例。在添加事件处理器和调用控件方法时，将使用使用这些实例。\n\
  \n### 14. 为 `Button` 控件添加事件处理器\n\n此时，应用程序的设计阶段已经结束，是时候添加一些代码来提供程序的功能了。\n\n程序必须为按钮和每个菜单项拥有事件处理器。事件处理器是当用户与控件交互时执行的方法。Visual\
  \ C# Express 会自动生成空事件处理器。\n\n双击按钮打开代码编辑器。你会发现环境已为用户点击按钮时触发的 `Click` 事件创建了事件处理器。在你的事件处理器方法中添加以下代码。\n\
  \n```csharp\nprivate void goButton_Click(object sender, System.EventArgs e)\n{\n\
  \    webBrowser1.Navigate(new Uri(comboBox1.SelectedItem.ToString()));\n}\n```\n\
  \n此代码从 `ComboBox` 控件中获取当前选中的项目（一个包含 Web URL 的字符串），并将其传递给 Web 浏览器的 `Navigate` 方法。`Navigate`\
  \ 方法加载并显示该位置 Web 网页的内容。\n\n### 15. 为 `MenuStrip` 选项添加事件处理器\n\n返回设计器窗口，依次双击菜单中的每个子项。Visual\
  \ C# Express 版为每个项目创建了事件处理器方法。编辑这些方法，使其类似于以下代码。\n\n| `private void homeToolStripMenuItem_Click(object\
  \ sender, System.EventArgs e){ webBrowser1.GoHome();}private void goForwardToolStripMenuItem_Click(object\
  \ sender, System.EventArgs e){ webBrowser1.GoForward();}private void goBackToolStripMenuItem_Click(object\
  \ sender, System.EventArgs e){ webBrowser1.GoBack();}` |\n\n这些菜单处理器中的每一个都会调用 `WebBrowser`\
  \ 类支持的导航方法。\n\n此代码从 `ComboBox` 控件中获取当前选中的项目（包含网站 URL 的字符串），并将其传递给 Web 浏览器的 `Navigate`\
  \ 方法。`Navigate` 方法加载并显示指定网页的内容。\n\n### 15. 为 `MenuStrip` 参数添加事件处理器\n\n返回设计窗口，依次双击菜单中的每个菜单项。Visual\
  \ C# 会为每个项目创建事件处理器方法。修改下面所示的这些方法。\n\n```csharp\nprivate void homeToolStripMenuItemMenuItem_Click(object\
  \ sender, System.EventArgs e)\n{\n    webBrowser1.GoHome();\n}\n\nprivate void goForwardToolStripMenuItem_Click(object\
  \ sender, System.EventArgs e)\n{\n    webBrowser1.GoForward();\n}\n\nprivate void\
  \ goBackToolStripMenuItem_Click(object sender, System.EventArgs e)\n{\n    webBrowser1.GoBack();\n\
  }\n```\n\n这些菜单处理器中的每一个都会调用 `WebBrowser` 类支持的导航方法。\n\n| 你从这段代码中可以看出，给菜单选项给出的默认名称可能会非常令人困惑。因此，在创建每个菜单控件时，使用属性编辑器更改其名称是一个好主意。这样处理器的名称将反映菜单选项的名称。\
  \ |\n\n### 16. 查看 Visual C# 为你编写的代码\n\nVisual C# IDE 已经为你编写了初始化代码。在代码视图中，找到 `Form1`\
  \ 类的构造函数。它的签名是 `public Form1()`。右键点击从构造函数内部调用的 `InitializeComponent` 方法，然后点击“转到定义”。你现在可以看到在你拖放控件和在属性窗口中设置属性时，后台编写的所有代码。\n\
  \n### 17. 添加你自己的初始化代码\n\n最后一个任务是向 `Form1` 添加一些你自己的初始化代码。构造函数绝不应该用于调用任何可能抛出异常的代码。因此，任何此类代码必须位于其他地方，而该位置就是\
  \ `Form1_Load` 方法。点击代码编辑器顶部的 `Form1.cs` [设计] 选项卡返回 Windows Form。选择表单，并在属性窗口中点击“事件”按钮（带有闪电图标的那个），然后双击\
  \ `Load`。这将添加一个事件处理器方法并将光标置于代码视图中的方法中。\n\n当用户启动你的程序时，Windows 将通过发送 `Load` 事件通知你的应用程序表单。当表单接收到该事件时，它将调用\
  \ `Form1_Load` 方法。响应事件而调的方法称为事件处理器。系统会在适当的时间调用你的事件；你的工作是将代码放入你想在事件发生时执行的事件处理器中。\n\
  \n在代码视图中，如如下代码所示，向 `Form1_Load` 方法添加两行代码。这将导致 `WebBrowser` 控件显示你计算机的默认主页并设置 `ComboBox`\
  \ 的初始值。\n\n| 从这段代码可以明显看出，为菜单选项使用默认名称可能会非常困惑。因此，最好使用属性编辑器更改每个菜单选项的名称。这样处理器的名称将反映菜单选项的名称。\
  \ |\n\n### 16. 查看生成的 Visual C# 代码\n\nVisual C# IDE 自动生成初始化代码。在代码视图中，找到 `Form1` 类的构造函数。它的签名是\
  \ `public Form1()`。右键点击从构造函数内部调用的 `InitializeComponent` 方法，并选择“转到定义”。这将显示在属性窗口中拖放控件和设置属性时所生成的代码。\n\
  \n### 17. 添加你自己的初始化代码\n\n最后，让我们为 `Form1` 添加我们自己的初始化代码。构造函数绝不应该用于调用任何可能抛出异常的代码。此类代码应该位于\
  \ `Form1_Load` 方法中。点击代码编辑器顶部的 `Form1.cs` [设计] 选项卡返回 Windows Form。选择表单，并在属性窗口中点击“事件”按钮（带有闪电图标），然后双击\
  \ `Load`。事件处理器将被创建，光标移动到代码视图中的方法处。\n\n当程序启动时，Windows 将通过分发 `Load` 事件通知应用程序表单。当表单接收到该事件时，`Form1_Load`\
  \ 方法将被调用。响应事件而调的方法称为事件处理器。系统会在正确的时刻触发事件，开发者的任务是将代码放在事件发生时应该执行的事件处理器中。\n\n在代码视图中，如下代码所示，向\
  \ `Form1_Load` 方法添加两行代码。这将导致 `WebBrowser` 控件显示默认主页并为 `ComboBox` 控件分配初始值。\n\n| `private\
  \ void Form1_Load(object sender, EventArgs e){ comboBox1.SelectedIndex = 0; webBrowser1.GoHome();}`\
  \ |\n\n### 18. 生成并运行程序\n\n按 F5 生成并运行浏览器。屏幕上显示 Windows Form，然后显示你计算机的默认主页。你可以使用 `ComboBox`\
  \ 控件选择网站，并点击转跳转。菜单选项允许你返回主页，或在以前访问过的网站之间来回。\n\n![MSN 示例截图](img/Image00016.jpg)\n\
  \n\n\n\n\n![Sample MSN Screenshot](img/Image00017.jpg)\n\n# Windows Presentation\
  \ Foundation 简介\n\nWindows Presentation Foundation (`WPF`) 是一种下一代演示系统，用于构建具有视觉震撼体验的\
  \ Windows 客户端应用程序。通过 `WPF`，你可以创建各种独立应用程序和浏览器托管应用程序。一些示例包括 [Yahoo!](https://translate.google.com/translate?hl=ar&prev=_t&sl=ru&tl=en&u=http://go.microsoft.com/fwlink/%3FLinkId%3D91192)\
  \ [Messenger](https://translate.google.com/translate?hl=ar&prev=_t&sl=ru&tl=en&u=http://go.microsoft.com/fwlink/%3FLinkId%3D91192)\
  \ 和 [纽约时报阅读](https://translate.google.com/translate?hl=ar&prev=_t&sl=ru&tl=en&u=http://go.microsoft.com/fwlink/%3FLinkId%3D91193)，以及下图所示的\
  \ [Contoso 医疗示例应用程序](https://translate.google.com/translate?hl=ar&prev=_t&sl=ru&tl=en&u=http://go.microsoft.com/fwlink/%3FLinkId%3D91196)。\n\
  \n![Contoso Healthcare UI sample](img/Image00018.jpg)\n\n`WPF` 的核心是一个独立于分辨率且基于向量的渲染引擎，旨在利用现代图形硬件的优势。`WPF`\
  \ 通过一套全面的应用程序开发功能扩展了核心功能，包括可扩展应用程序标记语言 (`XAML`)、控件、数据绑定、布局、2D 和 3D 图形、动画、样式、模板、文档、媒体、文本和字体排法。`WPF`\
  \ 包含在 Microsoft .NET Framework 中，因此你可以构建包含 .NET Framework 类库其他元素的应用程序。\n\n## 创建\
  \ WPF 应用程序\n\n本主题的目的是向你展示如何创建一个简单的 Windows Presentation Foundation (`WPF`) 应用程序，并熟悉\
  \ Visual C# Express 版集成开发环境 (`IDE`)。与 Windows Forms 应用程序一样，`WPF` 应用程序可以通过从工具箱拖放控件到设计表面来设计。除了有设计器、`Properties`\
  \ 窗口和工具箱外，`WPF` 项目中的 `IDE` 还有一个包含 `XAML` 的窗口。`XAML` 是可扩展应用程序标记语言的缩写，用于创建用户界面。下面的插图显示了\
  \ `XAML` 编辑器的位置。\n\n### XAML 编辑器\n\n![XAML Window](img/Image00019.jpg)\n\n此示例向你展示如何创建自己的墨水应用程序，你可以画画。\n\
  \n在本节中，你将学习如何：\n* 创建 `WPF` 应用程序。\n* 在代码视图和设计视图之间切换。\n* 更改 `WPF` 窗口的属性。\n\n## 创建\
  \ WPF C# 应用程序\n\n本节的目的是演示如何创建一个简单的 Windows Presentation Foundation (`WPF`) 应用程序，并向你介绍\
  \ Visual C# `IDE` Express 版。与 Windows Forms 应用程序一样，`WPF` 应用程序可以通过从工具箱拖放控件到设计表面来创建。除了设计器、`Properties`\
  \ 窗口和工具箱，`WPF` 项目中的 `IDE` 还有一个 `XAML` 窗口。`XAML` 是可扩展应用程序标记语言的缩写，是用于创建用户面的 `XAML`\
  \ 语言。下图显示了 `XAML` 编辑器的位置。\n\n![XAML Window](img/Image00019.jpg)\n\n此示例演示了如何创建一个允许你绘画的墨水应用程序。\n\
  \n本节涵盖了以下任务：\n* 创建 `WPF` 应用程序。\n* 在代码视图和设计视图之间切换。\n* 更改 `WPF` 窗口属性。\n* 使用 `XAML`\
  \ 编辑器。\n* 添加 `System.Windows.Controls.InkCanvas` 控件。\n* 添加 `System.Windows.Controls.Button`\
  \ 控件。\n* 为控件创建事件程序。\n\n1. 在 `File` 菜单上，点击 `New Project`。\n出现 `New Project` 对话框。此对话框列出了\
  \ Visual C# Express 版可以创建的不同默认应用程序类型。\n2. 点击 `WPF Application`。\n3. 将你的应用程序更改为 `Ink\
  \ Pad`。\n4. 点击 `OK`。\n\nVisual C# Express 版为你的项目创建一个以项目标题命名的文件夹，然后在 `Designer view`\
  \ 中显示你标题为 `Window1` 的新 `WPF` 窗口。你可以随时通过右键点击设计表面或代码窗口并选择 `View Code` 来切换到代码视图。默认情况下，`XAML`\
  \ 编辑器显示在设计器下方，但你可以通过右键点击设计表面并点击 `View XAML` 在全屏模式下查看 `XAML` 标记。\n\n你在 `Designer\
  \ view` 中看到的 `WPF` 窗口是应用程序启动时打开的窗口的视觉表示。在 `Designer view` 中，你可以从工具箱将各种控件拖到 `WPF`\
  \ 窗口。当你将控件拖到 `WPF` 窗口后，Visual C# 会自动创建代码，使控件在运行时处于适当的位置。\n\n5. 如果你看不到 `Properties`\
  \ 窗口，在 `View` 菜单上，点击 `PropertiesWindow`。此窗口列出了当前选择 `WPF` 窗口或控件的属性，你可以在这里更改现有值。\n\
  6. 在 `Properties` 窗口中通过设置 `Height` 属性为 550 和 `Width` 属性为 370 来更改 `WPF` 窗口的大小。\n\
  7. 将 `WPF` 窗口的标题更改为 `Ink Pad`。\n\n* 使用 `XAML` 编辑器。\n* 添加 `System.Windows.Controls.InkCanvas`\
  \ 控件。\n* 添加 `System.Windows.Controls.Button` 控件。\n* 为控件创建事件程序。\n\n1. 在 `File` 菜单上，点击\
  \ `New Project`。\n出现 `New Project` 对话框。此对话框列出了 Visual C# Express 版可以创建的不同默认应用程序类型。\n\
  2. 点击 `WPF Application`。\n3. 将你的应用程序更改为 `Ink Pad`。\n4. 点击 `OK`。\n\nVisual C# Express\
  \ 版为你的项目创建一个以项目标题命名的文件夹，然后在 `Designer view` 中显示你标题为 `Window1` 的新 `WPF` 窗口。你可以随时通过右键点击设计表面或代码窗口并选择\
  \ `View Code` 来切换到代码视图。默认情况下，`XAML` 编辑器显示在设计器下方，但你可以通过右键点击设计表面并点击 `View XAML` 在全屏模式下查看\
  \ `XAML` 标记。\n\n你在 `Designer view` 中看到的 `WPF` 窗口是应用程序启动时打开的窗口的视觉表示。在 `Designer view`\
  \ 中，你可以从工具箱将各种控件拖到 `WPF` 窗口。当你将控件拖到 `WPF` 窗口后，Visual C# 会自动创建代码，使控件在运行时处于适当的位置。\n\
  \n5. 如果 `Properties` 窗口可见，在 `View` 菜单上，点击 `Properties Window`。此窗口列出了当前选择 `WPF` 窗口或控件的属性，你可以在这里更改现有值。\n\
  6. 在 `Properties` 窗口中通过设置 `Height` 属性为 550 和 `Width` 属性为 370 来更改 `WPF` 窗口的大小。\n\
  7. 将 `WPF` 窗口的标题更改为 `Ink Pad`。\n8. 通过在下拉框中点击 `Brown` 然后按 `Enter` 将 `WPF` 窗口的 `Background`\
  \ 属性设置为棕色。\n\n| 你也可以通过添加 `Background` 属性并将其设置为 `Background = \"Brown\"` 直接修改 `XAML`\
  \ 标记 |\n\n9. 要打开工具箱，点击 `View` 菜单，然后点击 `Toolbox`。\n10. 右键点击 `Toolbox`，然后点击 `Choose\
