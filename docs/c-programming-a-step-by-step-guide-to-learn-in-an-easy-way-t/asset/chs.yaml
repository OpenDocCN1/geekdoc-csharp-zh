  16. 关闭应用程序。\n\n# 教程：动态显示 OpenFileDialog\n\n你可以使用 `OpenFileDialog` 组件允许用户浏览文本文件并将选的文件加载到\
  \ `Windows Form` 上的 `RichTextBox` 控件。此示例在运行时实例化 `OpenFileDialog`。\n\n## 示例\n\n```csharp\n\
  // 创建一个 OpenFileDialog 对象。\nOpenFileDialog openFile1 = new OpenFileDialog ();\n\n\
  // 初始化 OpenFileDialog 以查找文本文件。\nopenFile1.Filter = \"Text Files | *.txt\";\n\n//\
  \ 检查用户是否从 OpenFileDialog 选择了文件。\nif (openFile1.ShowDialog () == System.Windows.Forms.DialogResult.OK)\n\
  \    // 将文件内容加载到 RichTextBox 控件中。\n    richTextBox1.LoadFile (openFile1.FileName,\
  \ RichTextBoxStreamType.PlainText);\n```\n\n## 编译代码\n\n* 将代码复制到 `Load_Form1` 事件处理程序中。运行程序时，将提示你选择文本文件。所选文件的内容将显示在\
  \ `RichTextBox` 控件中。\n\n## 健性编程\n\n使用 `CheckFileExists`、`CheckPathExists`、`DefaultExt`、`Filter`、`Multiselect`\
  \ 和 `ValidateNames`。\n\n## 动态显示 OpenFileDialog 组件\n\n为了允许用户选择文本文件并加载到 `Windows Form`\
  \ 上的 `RichTextBox` 控件，可以使用 `OpenFileDialog` 组件。此示例在运行时创建 `OpenFileDialog` 组件。\n\n\
  ## 示例\n\n```csharp\n// 创建一个 OpenFileDialog 对象。\nOpenFileDialog openFile1 = new OpenFileDialog\
  \ ();\n\n// 初始化 OpenFileDialog 以查找文本文件。\nopenFile1.Filter = \"Text Files | *.txt\"\
  ;\n\n// 检查用户是否从 OpenFileDialog 选择了文件。\nif (openFile1.ShowDialog () == System.Windows.Forms.DialogResult.OK)\n\
  \    // 将文件内容加载到 RichTextBox 控件中。\n    richTextBox1.LoadFile (openFile1.FileName,\
  \ RichTextBoxStreamType.PlainText);\n```\n\n## 编译代码\n\n* 将代码复制到 `Load_Form1` 事件处理程序中。执行程序时，将提示你选择文本文件。所选文件的内容将显示在\
