  \ 属性设置为字符串数组中的值。\n\n#### 编译代码\n\n此示例需要以下组件。\n* 一个带有名为 `button1` 的 `Button` 控件的 Windows\
  \ Form。将 `button1` 的 `Click` 事件处理程序设置为 `button1_Click`。\n\n#### 示例\n\n---\n\n###\
  \ 如何：创建非矩形按钮\n\n此示例演示了如何创建一个与标准矩形按钮形状不同的按钮。代码在表单上添加了一个圆形按钮，并创建了一个在点击圆形时显示消息的事件处理程序。\n\
  \n#### 编译代码\n\n此示例需要一个包含名为 `Form2` 表单的 Windows Forms Application 项目。\n\n#### 示例\n\
  \n```csharp\npublic Form2 ()\n{\n    //\n    // Windows Form 设计器支持。\n    //\n  \
