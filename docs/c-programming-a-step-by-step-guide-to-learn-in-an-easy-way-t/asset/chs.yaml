  \ `ENTER` 键在 `TextBox` 中创建多行文本。你可以将 `Multiline` 属性设置为 `true` 来启用此功能。\n\n### 使用 TextBox\
  \ 控件接收输入\n\n通过 `TextBox` 控件，你既可以显示文本也可以从用户处接收文本。在 `TextBox` 中用户输入的数据可以通过 `Text`\
