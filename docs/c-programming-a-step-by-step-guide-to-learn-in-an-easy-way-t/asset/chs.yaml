  ;\n```\n\n### 编译代码\n复制代码并粘贴到控制台应用程序的 `Main` 方法中。\n\n# 可靠性编程\n使用属性的完全限定名称（除非它在相同作用域内可用）。\n\
  \n如果该属性是静态的，你不能使用类的实例来引用它。\n\n在将表达式赋值给属性时，检查以下几点：\n\n*   使用了兼容的数据类型。\n*   使用了有效值，特别是当该值是从用户输入检索的时。\n\
  \n如果你需要对可能的异常有更多控制，将属性赋值包含在 try-catch 语句中。\n\n### 结构体\nC# 中的结构体（struct）与类相似，但结构体缺少某些功能，例如继承。此外，由于结构体是值类型，它的创建速度通常比类更快。如果你在需要大量创建新数据结构的密集循环中，应该考虑使用结构体而不是类。结构体还用于封装数据字段组，例如网格上点的坐标或矩形的尺寸。\n\
  \n示例\n\n\n\n\n\n此示例程序定义了一个 `struct` 来存储地理位置。它还重写了 `ToString()` 方法，以便在 `WriteLine`\
  \ 语句中显示时产生更有用的输出。由于该 `struct` 中没有方法，因此将其定义为 `class` 并没有任何优势。\n\n```csharp\nstruct\
  \ GeographicLocation\n{\n    private double longitude;\n    private double latitude;\n\
  \    public GeographicLocation(double longitude, double latitude)\n    {\n     \
  \   this.longitude = longitude;\n        this.latitude = latitude;\n    }\n    public\
  \ override string ToString()\n    {\n        return System.String.Format(\"Longitude:\
  \ {0} degrees, Latitude: {1} degrees\", longitude, latitude);\n    }\n}\n\nclass\
  \ Program\n{\n    static void Main()\n    {\n        GeographicLocation Seattle\
  \ = new GeographicLocation(123, 47);\n        System.Console.WriteLine(\"Position:\
  \ {0}\", Seattle.ToString());\n    }\n}\n```\n\n### 输出\n此示例的输出如下：\nPosition: Longitude:\
  \ 123 degrees, Latitude: 47 degrees\n\n### 结构体 (Structures)\nC# 中的结构体与 `class` 类似，但结构体缺少一些功能，例如继承。此外，由于\
  \ `struct` 是一种 `value type`，它的创建速度比 `class` 快。如果你有一个连续循环，在其中创建了大量新的数据结构，建议使用 `structure`\
  \ 而不是 `class`。结构体用于封装一组数据字段，例如网点坐标或矩形尺寸。\n\n![clear](img/Image00021.jpg) 示例\n以下程序示例定义了一个\
  \ `struct` 来存储地理位置。它还重写了 `ToString()` 方法，以便在 `WriteLine` 语句中显示时输出更相关的结果。由于 `struct`\
  \ 中没有方法，将 `struct` 定义为 `class` 是没有意义的。\n\n### 结果\n运行示例后，将显示以下输出。\nPosition: Longitude:\
  \ 123 degrees, Latitude: 47 degrees\n\n## 变量与常量\n变量代表数值、字符串值或 `class` 的对象。变量存储的值可能会改变，但名称保持不变。变量是\
  \ `field` 的一种类型。以下代码是关于声明整数变量、为其赋值然后赋赋一个新值的简单示例。\n\n```csharp\nint x = 1; // x 持有值\
  \ 1\nx = 2; // 现在 x 持有值 2\n```\n\n在 C# 中，变量使用特定的数据类型和标签进行声明。如果你的编程背景是 `JScript`\
  \ 等弱类型语言，你可能习惯了对所有变量使用相同的 `var` 类型，但在 C# 中，你必须指定你的变量是 `int`、`float`、`byte`、`short`\
  \ 还是 20 多种不同数据类型之一。类型规定了（其他）在应用程序运行时必须为存储该值分配的精确内存量。C# 语言在将变量从一种类型转换为另一种类型时强制执行某些规则。\n\
  \n```csharp\nint answer = 42;\nstring greeting = \"Hello, World!\";\ndouble bigNumber\
  \ = 1e100;\nSystem.Console.WriteLine(\"{0} {1} {2}\", answer, greeting, bigNumber);\n\
  ```\n\n## 常量\n常量是 `field` 的另一种类型。它持有在程序编译时赋值的值，之后永远不会改变。常量使用 `const` 关键字声明；它们对于提高代码的可读性很有用。\n\
  \n```csharp\nconst int speedLimit = 55;\nconst double pi = 3.14159265358979323846264338327950;\n\
  ```\n\n`readonly` 变量类似于常量，但它的值是在程序启动时赋值的。这允许你根据某些其他条件设置该值。\n\n\n\n\n\n# 数据类型\n\n\
  | 数据类型 | 范围 |\n| :--- | :--- |\n| `byte` | `0 .. 255` |\n| `sbyte` | `-128 .. 127`\
  \ |\n| `short` | `-32,768 .. 32,767` |\n| `ushort` | `0 .. 65,535` |\n| `int` |\
  \ `-2,147,483,648 .. 2,147,483,647` |\n| `uint` | `0 .. 4,294,967,295` |\n| `long`\
  \ | `-9,223,372,036,854,775,808 .. 9,223,372,036,854,775,807` |\n| `ulong` | `0\
  \ .. 18,446,744,073,709,551,615` |\n| `float` | `-3.402823e38 .. -3.402823e38` |\n\
  | `double` | `-1.79769313486232e308 .. 1.79769313486232e308` |\n| `decimal` | `-79228162514264337593543950335\
  \ .. 79228162514264337593543950335` |\n| `char` | 一个 Unicode 字符 |\n| `string` |\
  \ 一个 Unicode 字符字符串 |\n| `bool` | `true` 或 `false` |\n| `object` | 对象 |\n\n这些数据类型是\
  \ `System` 命名空间中预定义类型的别名。除 `object` 和 `string` 之外，所有类型都是值类型。\n\n## 使用内置数据类型\n\n\
  内置数据类型在 C# 程序中以以下几种方式使用：\n\n### 作为变量\n```csharp\nint answer = 42;\nstring greeting\
  \ = \"Hello, World!\";\n```\n\n### 作为常量\n```csharp\nconst int speedLimit = 55;\n\
  const double pi = 3.14159265358979323846264338327950;\n```\n\n### 作为返回值和参数\n```csharp\n\
  long CalculateSum (int a, int b){\n    long result = a + b;\n    return result;\n\
  }\n```\n\n要定义你自己的数据类型，请使用 `Classes`（类）、`Enumerations`（枚举）或 `Structs`（结构体）。\n\n##\
  \ 数据类型转换\n\n数据类型之间的转换可以隐式进行（由编译器自动完成转换），也可以通过强制类型转换显式地进行（即由程序员强制转换并承担信息丢失的风险）。\n\
  \n例如：\n```csharp\nint i = 0;\ndouble d = 0;\ni = 10;\nd = i; // 隐式转换\nd = 3.5;\n\
  i = (int) d; // 显式转换，或“强制转换”\n```\n\n## 值类型和引用类型\n\n与你熟悉的某些编程语言不同，C# 有两种数据类型：值类型和引用类型。如果性能对你的应用程序很重要，或者你对\
  \ C# 如何管理数据和内存感兴趣，那么了解它们的区别就非常重要。\n\n当使用基础内置数据类型或用户定义的结构声明变量时，它是一个值类型。例外是 `string`\
  \ 数据类型，它是一个引用类型。\n\n值类型将其内容存储在栈（stack）分配的内存中。例如，在这种情况下，值 `42` 存储在称为栈的内存区域：\n```csharp\n\
  int x = 42;\n```\n\n当变量 `x` 因为它的方法执行完毕而超出作用域时，该值将从栈中删除。使用栈是非常高效，但值类型的有限寿命使得它们不适合在不同类之间共享数据。\n\
  \n相比之下，引用类型（例如类的实例或数组）分配在称为堆（heap）的不同内存区域。在下面的示例中，组成数组的十个整数所需的空间分配在堆上：\n```csharp\n\
  int [] numbers = new int [10];\n```\n\n这部分内存在方法结束时不会返回给堆；只有当垃圾回收确定它不再需要时，才会被回收。\n\
  \n\n\n\n\n让我们深入探讨一下。当数据作为值类型参数传递给方法时，在栈上会创建每个参数的副本。显然，如果涉及的参数是大型数据类型（例如包含许多元素的用户定义结构体），或者该方法执行了多次，可能会对性能产生影响。\n\
  \n在这些情况下，使用 `ref` 关键字传递类型的引用可能更为理想。这等同于 `C++` 中向函数传递变量指针的技巧。与 `C++` 版本一样，该方法具有更改变量内容的能力，这并不总是安全的。程序员需要在安全性和性能之间进行权衡（trade-off）。\n\
  \n```csharp\nint AddTen (int number) // 参数按值传递{\n    return number + 10;\n}\n```\n\
  \n```csharp\nvoid AddTen ( ref int number) // 参数按引用传递{\n    number + = 10;\n}\n\
  ```\n\n`out` 关键字与 `ref` 关键字类似，但它告诉编译器方法必须为参数赋值，否则将发生编译错误。\n\n```csharp\nvoid SetToTen\
  \ ( out int number){\n    // 如果此行不存在，代码将无法编译。\n    number = 10;\n}\n```\n\n## 性能问题\n\
  \n让我们更仔细地观察这种情况。当你将数据作为值类型参数传递给方法时，栈上会创建每个参数的副本。显然，如果涉及的参数是大型数据类型（例如带有许多成员的自定义结构体），或者该方法执行了多次，这将对性能产生负面影响。\n\
  \n在这种情况下，建议使用 `ref` 关键字传递类型的引用。在 C# 中，这等同于 `C++` 向函数传递变量指针的方法。与 `C++` 一样，方法具有更改变量内容的能力，这并不总是安全的。程序员必须在安全性和性能之间找到折中点。\n\
  \n```csharp\nint AddTen (int number) // 参数按值传递{\n    return number + 10;\n}\n```\n\
  \n```csharp\nv oid AddTen ( ref int number) // 参数按引用传递{\n    number + = 10;\n}\n\
  ```\n\n`out` 关键字与 `ref` 关键字类似，但它告诉编译器方法必须为参数赋值，否则将发生编译错误。\n\n```csharp\nvoid SetToTen\
  \ ( out int number){\n    // 如果此行不存在，代码将无法编译。\n    number = 10;\n}\n```\n\n## 运算符\n\
  \n在 C# 中，运算符的语法与其他 C 风格编程语言相似。运算符用于进行计算、为变量赋值、测试相等性或不相等性以及执行其他操作。\n\n以下章节列出了 C#\
  \ 中一些常用的运算符。\n\n### 赋值和相等运算符\n\n在 C# 中，等号 `=` 运算符的功能与 C 和 `C++` 相同：\n\n| 运算符 | 用途\
  \ |\n| :--- | :--- |\n| `=` | 赋值值。 |\n| `==` | 测试相等性。 |\n\n### 示例\n\n```csharp\n\
  int x = 100;\nif (x == 100){\n    System.Console.WriteLine ( \"X is equal to 100\"\
  \ );\n}\n```\n\nC# 运算符的语法与其他 C 风格编程语言相似。运算符用于执行计算、赋值、检查相等和不相等性等。\n\n接下来的章节提供了 C#\
  \ 中最常用运算符的列表。\n\n![clear](img/Image00021.jpg) 相等和赋值运算符\n\n在 C# 中，等号 `=` 运算符的功能与\
