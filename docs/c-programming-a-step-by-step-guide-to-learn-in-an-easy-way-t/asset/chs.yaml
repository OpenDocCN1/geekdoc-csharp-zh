  \ C# 中使用 LINQ Express\n\n单个表中的数据可以被链接。如果两个表之间存在相关数据，该关系将在 `Data Sources` 窗口中显示。例如，如果您连接到\
  \ `Northwind` 示例数据库并展开 `Products` 表，您会发现 `Order Details` 表作为 `Products` 表的一部分出现。如果您将此\
  \ `Order Details` 表或其一个或多个字段拖到 `Windows Form`，它将作为与 `Products` 表的关系的一部分出现。例如，滚动\
  \ `Products` 表中的产品会自动显示每个产品相应的订单信息。\n\n\n\n\n\n## 支持 LINQ 的 C# 语言增强\n\n以下是 C# 3.0\
  \ 添加的一些支持 LINQ 的新语言结构：\n\n| 语言结构 | 说明 |\n| :--- | :--- |\n| 查询表达式 (query expressions)\
  \ | 声明式查询语法，用于从任何支持 LINQ 的数据源查询数据。 |\n| 隐式类型变量 (implicitly typed variables) | 使用\
  \ `var` 修饰符指定的变量，允许编译器推断变量类型。 |\n| 对象初始化器 (object initializers) | 允许无需显式调用对象构造函数初始化对象。\
  \ |\n| 匿名类型 (anonymous types) | 允许编译器创建对象而无需指定命名数据类型。类型名称仅对编译器可见。 |\n| 扩展方法 (extension\
  \ methods) | 通过将静态方法关联到类型，对任何现有类型进行扩展。 |\n| Lambda 表达式 (lambda expressions) | 内联表达式或语句块，可以用任何需要委托类型的地方。\
  \ |\n\n### 支持 LINQ 的 C# 语言扩展\n\nC# 3.0 中添加了若干个支持 LINQ 的新语言结构。\n\n| 语言结构 | 说明 |\n\
  | :--- | :--- |\n| 查询表达式 | 声明式查询语法，用于从任何 LINQ 支持的数据源查询数据。 |\n| 隐式类型变量 | 变量声明中的 `var`\
  \ 修饰符允许编译器确定其类型。 |\n| 对象初始化器 | 允许你在无需显式调用构造函数的情况下初始化对象。 |\n| 匿名类型 | 允许编译器创建对象而不指定命名数据类型。类型名称仅对编译器可见。\
  \ |\n| 扩展方法 | 允许通过与静态方法关联来扩展任何现有类型。 |\n| Lambda 表达式 | 在任何需要委托类型的地方都可以使用的内置表达式或语句块。\
  \ |\n\n### 编写 LINQ 查询\n\n无论你处理的是 ADO.NET 数据集、SQL 数据库、NET 集合还是 XML 文档，LINQ 查询表达式的基本结构都是相同的。查询表达式以\
  \ `from` 子句开头，随后是 `where`、`orderby`、`select` 等查询子句。完整的表达式存储在查询变量中，该变量可以执行或修改任意次数。查询表达式语法类似于\
  \ SQL 语法。例如，你可以使用以下语法编写 LINQ 查询，返回 `students` 数据库中所有专业为科学的学生：\n\n```\nIEnumerable<Student>\
  \ studentQuery =\nfrom student in studentApp.students\nwhere student.Major == \"\
  Science\"\nselect student;\n```\n\n## LINQ to Objects\n\nLINQ to Objects 术语是指使用\
  \ LINQ 查询内存中的数据集合，例如 `System.Collections` 和 `System.Collections.Generic` 命名空间中的类。这些类包括\
  \ `ArrayList`、`List<T>`、`Dictionary<K, T>` 等。你可以查询数组，因为它们隐式支持 `IEnumerable<T>`。\n\
  \n你甚至可以将文本文件导入枚举数据结构中，并运行查询来过滤或排序其内容。\n\n无论数据源是 ADO.NET 数据集、SQL 数据库、NET Framework\
  \ 集合还是 XML 文档，LINQ 查询表达式的基本结构保持不变。查询表达式从 `from` 子句开始，随后是 `where`、`orderby`、`select`\
  \ 等其他表达式。查询变量存储完整的查询表达式，可以执行或修改任意次数。查询表达式语法类似于 SQL 语法。例如，你可以使用以下语法编写 LINQ 查询，返回学生基础中所有主修科学的学生：\n\
  \n```\nIEnumerable<Student> studentQuery =\nfrom student in studentApp.students\n\
  where student.Major == \"Science\"\nselect student;\n```\n\nLINQ to Objects 术语是指使用\
  \ LINQ 查询内存中的数据集合，例如 `System.Collections` 和 `System.Collections.Generic` 命名空间中的类。这些类包括\
  \ `ArrayList`、`List<T>`、`Dictionary<K, T>` 等。你可以查询数组，因为它们隐式支持 `IEnumerable<T>` 泛接口。\n\
  \n你甚至可以将文本文件导入枚举结构中，并运行查询来过滤和排序内容。\n\n## LINQ to SQL\n\n使用 LINQ to SQL 通过使用 OR Designer\
  \ 创建的强类型对象层访问 SQL Server 和 SQL Server Express 数据库。\n\n你可以使用 OR Designer 将 LINQ to\
  \ SQL 类映射到数据库中的表，然后编写 LINQ 查询将数据绑定到应用程序中的控件上。例如，下面的 LINQ 查询将 LINQ 查询结果（所有来自美国的客户）绑定到\
  \ `DataGridView` 控件的绑定源上。\n\n| `var CustomersQuery = from customers in northwindSampleDataContext1.Customers\
  \ where customers.Country == \"US\" select customers; customerBindingSource.DataSource\
  \ = CustomersQuery;` |\n| 注意：OR Designer 目前不支持 SQL Server Compact 3.5 数据库。 |\n\n\
  ## LINQ to DataSet\n\nDataSet 用于将数据绑定到应用程序中的控件。DataSet 并不是直接连接数据库，而是允许应用程序使用离线（缓存）数据或多个数据源的子集。当应用程序上线时，DataSet\
  \ 中的更改可以更新到数据库中。\n\nLINQ to DataSet 对缓存数据进行查询比 DataSet 可用的过滤和排序方法更快、更简单。\n\n## LINQ\
  \ to XML\n\nLINQ to XML 允许你使用 LINQ 表达式代替 XPath 或 XQuery 来轻松创建和修改 XML 文档。LINQ to\
  \ XML 是一种新的内存编程 API，它使用现代构造代替 W3C 文档对象模型 (DOM)。\n\n## LINQ to SQL (继续)\n\n使用 LINQ\
  \ to SQL 通过使用 OR Designer 创建的强类型对象层访问 SQL Server 和 SQL Server Express 数据库。\n\n你可以使用\
  \ OR Designer 将 LINQ to SQL 类映射到数据库中的表，然后编写 LINQ 查询将数据绑定到应用程序中的控件上。例如，下面的 LINQ 查询将\
  \ LINQ 查询结果（所有客户）绑定到 `DataGridView` 控件的绑定源上。\n\n| `var CustomersQuery = from customers\
  \ in northwindSampleDataContext1.Customers where customers.Country == \"US\" select\
  \ customers; customerBindingSource.DataSource = CustomersQuery;` |\n| 注意：OR Designer\
  \ 不支持 SQL Server Compact 3.5 数据库。 |\n\n## LINQ to DataSet (继续)\n\nDataSet 用于将数据绑定到应用程序中的控件。与其直接连接数据库，可以使用\
  \ DataSet 创建独立的数据缓存或数据源的子集。当应用程序上线时，DataSet 的更改将应用于数据库中。\n\nLINQ to DataSet 查询缓存数据比\
  \ DataSet 提供的过滤和排序方法更快、更简单。\n\n## LINQ to XML (继续)\n\nLINQ to XML 使得可以使用 LINQ 表达式代替\
  \ XPath 或 XQuery 来轻松创建和修改 XML 文档。LINQ to XML 是一种新的内存编程 API，它使用现代构造代替 W3C 文档对象模型\
  \ (DOM)。\n\n# C# 语言基础\n\n## C# 程序内部\n\n为了理解 C# 程序是如何运行的，让我们检查传统的“Hello World!”程序，逐行处理\
  \ C# 代码。\n\n### Hello World，C# 风格\n\nC# 语言使用类来组织和封装代码。事实上，所有可执行的 C# 代码必须包含在类中，即使是像“Hello\
  \ World!”这样的短程序。以下是一个在控制窗口显示“Hello World!”的完整程序。\n\n```csharp\nusing System;// 一个\
  \ C# 版本的 \"Hello World!\" 程序\nnamespace HelloWorld\n{\n    class Hello\n    {\n\
  \        static void Main ()\n        {\n            Console.WriteLine( \"Hello\
  \ World!\" );\n        }\n    }\n}\n```\n\n\n\n\n\n### 初学者 C# 语言\n\n### C# 程序结构\n\
  \n为了理解 C# 程序是如何工作的，让我们来看一个传统的“Hello World!”程序并分析其 C# 代码的每一行。\n\n![clear](img/Image00021.jpg)\
  \ C# 风格的 \"Hello World\"\n\n类（Classes）用于简化和格式化 C# 代码。事实上上，所有可执行的 C# 代码必须包含在一个类中，对于像“Hello\
  \ World!”这样的短程序也是如此。以下是在控制窗口中显示“Hello World!”消息的程序完整文本。\n\n```csharp\nusing System;\n\
  \n// A Hello World! program in C #\n\nnamespace HelloWorld\n{\n    class Hello\n\
  \    {\n        static void Main ()\n        {\n            System.Console.WriteLine\
  \ (\"Hello World!\");\n            // 在调试模式下保持控制窗口打开\n            System.Console.WriteLine\
  \ (\"Press any key to exit.\");\n            System.Console.ReadKey ();\n      \
  \  }\n    }\n}\n```\n\n![clear](img/Image00021.jpg)\n\n## 指令和命名空间\n\n当你使用 Visual\
  \ C# 创建控制台应用程序时，代码编辑器中的前几行包含 `using` 指令，列出了若干个 .NET Framework 命名空间。命名空间（Namespace）是将类和结构体组合在一起的方法，可以限制它们的作用范围并避免与其他类和结构体的命名冲突。当你在\
  \ Visual C# 中创建程序时，系统会自动为你创建一个命名空间。若要在程序中使用其他命名空间中的类，你必须通过 `using` 指令明确指定它们。在创建新应用程序时，默认会列出最常用的\
  \ .NET Framework 命名空间。如果你在类库中使用其他命名空间中的类，你必须在源文件中为该命名空间添加 `using` 指令。\n\n当代码编辑器检测到你声明了一个类或结构体，但在当前\
  \ `using` 指令列出的命名空间中找不到时，它会建议包含该类或结构体的命名空间。\n\n### 注释\n\n在 `using` 语句之后，下一行包含一条注释。注释用于向你自己或其他程序员添加备注。\n\
  \n`| // A \"Hello World!\" program in C # |`\n\n`//` 字符将该行的剩余部分转换为注释。你也可以通过将文本块放在\
  \ `/*` 和 `*/` 之间来对其进行注释，例如：\n\n`| /* A \"Hello World!\" program in C #.This program\
  \ displays the string \"Hello World!\" on the screen. * / |`\n\n你还可以使用格式选项来自动注释代码。\n\
  \n## 指令 using 和命名空间\n\n当你使用 Visual C# 创建控制台应用程序时，代码编辑器中的第一行包含一个 `using` 指令，列出了若干个\
  \ .NET Framework 命名空间。从某种意义上说，命名空间允许将类和结构组合在一起，限制它们的作用范围并避免与其他类和结构冲突。当你在 Visual\
  \ C# 中创建程序时，命名空间会自动创建。若要在程序中使用其他命名空间中的类，你必须通过 `using` 指令指定它们。创建新应用程序时，默认列出最常用的 .NET\
  \ Framework 命名空间。如果你在类库中使用其他命名空间中的类，你必须在源文件中为该命名空间添加 `using` 指令。\n\n当代码编辑器确定声明的类或结构未出现在当前\
  \ `using` 指令列表的命名空间中时，它会建议包含该类或结构的命名空间。\n\n![clear](img/Image00021.jpg) Note\n\n\
  `using` 语句之后的行包含一条注释。注释用于向你自己或其他程序员添加备注。\n\n`// A Hello World! program in C #`\n\
  \n`//` 字符将该行的剩余部分转换为注释。你也可以像示例那样，将文本块放在 `/*` 和 `*/` 之间来注释掉它。\n\n`/* A \"Hello World!\"\
  \ program in C #.\nThis program displays the string \"Hello World!\" on the screen.\
  \ * /`\n\n你还可以使用格式选项自动注释掉你的代码。\n\n### 类\n\nC# 语言使用类来封装代码：所有可执行的 C# 代码必须包含在一个类中。\n\
  \n### Main ()\n\n*   C# 程序必须包含一个 `Main` 方法，控制流在此处开始并结束。`Main` 方法是你创建对象和执行其他方法的地方。`Main`\
  \ 方法是一个静态方法，位于类或结构体内部。在“Hello World!”示例中，它位于 `Program` 类内部。\n\n`Main` 方法可以通过以下方式之一进行定义：\n\
  \n*   它可以返回 `void`：\n    `| static void Main (){    // ...} |`\n*   它也可以返回 `int`：\n\
  \    `| static int Main (){    // ...    return 0;} |`\n*   它可以接收参数，这对于命令行工具非常有用：\n\
  \    `| static void Main (string [] args){    // ...} |`\n*   ——或者\n    `| static\
  \ int Main (string [] args){    // ...    return 0;} |`\n\n`Main` 方法的参数是一个字符串数组，表示用于调用程序的命令行参数。注意，与\
  \ C++ 不同，此数组不包含可执行文件的名称。\n\n## 控制台输入与输出\n\nC# 控制台程序通常使用由 .NET Framework `Console`\
  \ 类提供的输入/输出服务。`Console.WriteLine (\"Hello, World!\");` 语句使用了 `WriteLine` 方法。它在命令行窗口上显示字符串参数，后跟一个换行符。其他\
  \ `Console` 方法用于不同的输入和输出操作。`Console` 类是 `System` 命名空间的成员。如果程序开头没有包含 `using System;`\
  \ 语句，你必须像这样指定 `System` 类：\n\n`| System.Console.WriteLine ( \"Hello World!\" |`\n\
  \n`WriteLine` 方法非常有用，如果你在编写控制台应用程序，将经常使用它。\n\n`WriteLine` 可以显示字符串：\n`| Console.WriteLine\
  \ ( \"Hello World!\" ); |`\n\n`WriteLine` 也可以显示数字：\n`| int x = 42;Console.WriteLine\
  \ (x); |`\n\n如果你需要显示多个项目，使用 `{0}` 表示第一个项目，`{1}` 表示第二个项目以此此类推，如下：\n\n`| int year\
  \ = 1066;string battle = \"Battle of Hastings\" ;Console.WriteLine ( \"The {0} took\
  \ place in {1}.\" , Battle, year); |`\n\n输出将如下：\n\nThe Battle of Hastings took place\
  \ in 1066.\n\n\n\n\nC# 控制台程序通常使用由 .NET Framework 的 `Console` 类提供的 I/O 服务。`Console.WriteLine(\"\
  Hello, World!\");` 使用了 `WriteLine` 方法。它将字符串参数在另起行输出到命令提示符窗口。其他的 `Console` 方法被用于各种输入和输出操作。`Console`\
  \ 类是 `System` 命名空间的成员。如果你在程序开头使用 `System;` 指令 [[34]](https://translate.googleusercontent.com/translate_f#_ftn34)，那么你将需要像下面的示例那样指定\
  \ `System` 类。\n\n```csharp\nSystem.Console.WriteLine(\"Hello World!\");\n```\n\n\
  `WriteLine` 方法非常有用，并且在构建控制台应用程序时经常被使用。`WriteLine` 方法可以显示行。\n\n```csharp\nConsole.WriteLine(\"\
  \ Hello World!\");\n```\n\n`WriteLine` 方法还可以显示数字。\n\n```csharp\nint x = 42;\nConsole.WriteLine(x);\n\
  ```\n\n如果你需要显示多个项目，请使用 `{0}` 表示第一个项目，`{1}` 表示第二个项目，依此类推，如下所示。\n\n```csharp\nint\
  \ year = 1066;\nstring battle = \"Battle of Hastings\";\nConsole.WriteLine(\"The\
  \ {0} took place in {1}.\", battle, year);\n```\n\n结果将如下所示。[[35]](https://translate.googleusercontent.com/translate_f#_ftn35)\n\
  哈斯廷斯战役发生于 1066 年。\n\n# 程序结构与执行流\n\n当你创建一个 C# 应用程序时，你可以选择创建控制台应用程序或 Windows 应用程序。\n\
  \n\n\n\n\n# 命名空间简介\n\n命名空间（Namespaces）是组织 C# 程序中各种类型的方式。它们可以比计算机文件系统中的文件夹。就像文件夹一样，命名空间为类定义了唯一的限定名称。一个\
  \ C# 程序包含一个或多个命名空间，每个命名空间要么由程序员定义，要么作为之前编写的类库的一部分定义。\n\n例如，`System` 命名空间包含 `Console`\
  \ 类，它包含了用于读取和写入控制台窗口的方法。`System` 命名空间还许多许多空间，如 `System.IO` 和 `System.Collections`。仅\
  \ `.NET Framework` 平台就提供了 80 多个命名空间，每个命名空间包含数千个类，因为命名空间用于避免与同名的类型和方法产生混淆。\n\n当你在命名空间声明之外编写类时，编译器将为其提供一个默认命名空间。\n\
  \n## 命名空间快捷方式\n\n要使用位于 `System` 命名空间 `Console` 类中的 `WriteLine` 方法，你可以使用如下代码行：\n\n\
  ```csharp\nSystem.Console.WriteLine ( \"Hello, World!\" );\n```\n\n记住在 `Console`\
  \ 中包含的所有方法之前都加上 `System` 会很快变得乏味，因此一个实用的快捷方法是在 C# 源文件的开头插入 `using` 指令，如下：\n\n```csharp\n\
  using System;\n```\n\n包含 `using System;` 意味着假定使用 `System` 命名空间，随后你只需要写：\n\n```csharp\n\
  Console.WriteLine ( \"Hello, World!\" );\n```\n\n## 创建你自己的命名空间\n\n在开发大型程序时，使用命名空间是非常常见的。使用自己的命名空间可以对同名的方法和类型提供某种程度的控制。例如，假设你正在编写一个从磁盘加载统计数据图像文件的应用程序。你可以创建两个新的命名空间，一个名为\
  \ `Images`，另一个名为 `StatisticalData`。由于使用了两个独立的命名空间，每个命名空间中定义的方法名称将是唯一的，即使各个类的名称相同。这意味着你可以在两个命名空间中都拥有名为\
  \ `FileHandling` 的类，且都包含一个名为 `Load` 的方法。你可以通过引用 `StatisticalData.FileHandling` 或\
  \ `Images.FileHandling` 来指定你想要的类。\n\n在 Visual C# Express 项目中，为每个命名空间创建一个单独的文件夹是良好的做法。\n\
  \n![clear](img/Image00021.jpg) 加速命名空间方法\n\n要使用位于 `System` 命名空间 `Console` 类中的 `WriteLine`\
  \ 方法，请使用所示代码行。\n\n```csharp\nSystem.Console.WriteLine ( \"Hello, World!\" );\n```\n\
  \n记住 `Console` 中包含的所有方法必须加上 `System` 会很快变得很燥，因此在 C# 源文件的顶部插入 `using` 指令是一个好主意，如下：\n\
  \n```csharp\nusing System;\n```\n\n添加 `using System;` 建立了对 `System` 命名空间的假设，随后可以编写以下内容：\n\
  \n```csharp\nConsole.WriteLine ( \" Hello , World !\" );\n```\n\n## 示例：命名空间\n\n\
  下面的示例定义了两个命名空间，每个空间包含一个名为 `FileHandling` 的类。通过指定命名空间，可以快速区分这些类以及它们包含的方法。\n\n```csharp\n\
  namespace StatisticalData {\n    class FileHandling {\n        public void Load\
  \ () {} // 加载统计数据的代码\n    }\n}\nnamespace Images {\n    class FileHandling {\n \
  \       public void Load () {} // 加载图像文件的代码\n    }\n}\nclass Program {\n    static\
  \ void Main () {\n        StatisticalData.FileHandling data = new StatisticalData.FileHandling\
  \ ();\n        data.Load ();\n        Images.FileHandling image = new Images.FileHandling\
  \ ();\n        image.Load ();\n    }\n}\n```\n\n### 类\n\nC# 是一种面向对象的编程语言，与其他现代语言一样，它将相关的字段、方法、属性和事件分组在名为“类”的数据结构中。\n\
  \n![clear](img/Image00021.jpg) 类与对象\n\n类本质上是自定义数据类型的蓝图。一旦你定义了一个类，就可以通过将其加载到内存来使用它。已加载到内存的类被称为对象或实例。你通过使用\
  \ C# 关键字 `new` 来创建类的实例。\n\n这是一个名为 `SampleClass` 的类定义示例，以及创建一个名为 `sampleClass1` 的对象（它是该类的一个实例）。由于\
  \ C# 要求 `Main` 函数必须定义在类内部，以下代码还定义了一个 `Program` 类，但该类没有用于创建对象。\n\n```csharp\nusing\
  \ System;\nclass SampleClass {\n    public void SayHello () {\n        Console.WriteLine\
  \ ( \"Hello, World!\" );\n    }\n}\nclass Program {\n    // Main 是入口点，每个 C# 程序从这里开始\n\
  \    static void Main (string [] args) {\n        SampleClass sampleClass1 = new\
  \ SampleClass (); // 创建对象\n        sampleClass1.SayHello (); // 调用方法\n    }\n}\n\
  ```\n\n就像你可以根据同一份蓝图建造任何数量的房子一样，你可以实例化同一类的任何数量的对象。拥有包含许多相同类对象的数组或列表是非常常见的。类的每个实例都占用独立的内存空间，其字段的值（下文讨论的静态字段除外）是分离且独立的。在下面的代码示例中，你可以创建一个\
  \ `Animal` 类型的对象并将其大小设置为 2，并创建另一个大小设为 3 的对象。然而，这个规则有一个重要的例外，那就是静态成员。\n\n![clear](img/Image00021.jpg)\
  \ 类\n\n\n\n\n正如你可以根据一张图纸建造几栋建筑一样，你也可以创建许多相同类的对象。通常会使用包含许多相同类对象的数组或列表。该类的每个实例都占用内存中独立的区域；其字段的值（不包括下文描述的静态字段）也是独立的。以下代码示例创建了一个类型为\
  \ `Animal` 的对象，将其大小设置为\"2\"，并创建了另一个大小为\"3\"。然而，此规则有一个重要的例外，即静态成员。\n\n## 静态成员与实例成员\n\
  \n静态成员是方法或字段，可以在不引用类的某个特定实例的情况下访问它。最常见的静态方法是 `Main`，它是所有 C# 程序的入口点；请注意，调用 `Main`\
  \ 方法时你不需要创建包含该类的实例。另一个常用的静态方法是 `Console` 类中的 `WriteLine`。请注意访问静态方法时语法的差异：在点操作符（`.`）的左侧，你使用的是类名而不是实例名：`Console.WriteLine`。\n\
  \n当你声明一个类字段为 `static` 时，该类的所有实例将“共享”该字段。如果以下代码示例中的 `size` 被声明为静态，并且其中一个 `Animal`\
  \ 对象更改了值，那么所有类型为 `Animal` 的对象的值都会发生变化。\n\n静态类是指所有成员都是静态的类。出于性能和效率考虑，静态类、方法和字段在某些场景下非常有用。然而，如果你假设一个字段是实例字段而实际上它是静态的，就可能会产生细微的错误。更多信息，请参阅《静态类和静态类成员（C#\
  \ 编程指南）》。\n\n## 类与文件\n\n每个 C# 程序至少包含一个类。在设计程序时，在每个源代码文件（`.cs`）中保留一个类是一个良好的习惯，但并非强制要求。如果你使用\
  \ C# 集成开发环境（IDE）来创建类，它会同时为你创建一个新的源代码文件。\n\n![clear](img/Image00021.jpg) 实例成员与静态成员\n\
  \n静态成员是方法或字段，可以在不引用类的某个特定实例的情况下访问它。最常见的静态方法是 `Main`，它代表所有 C# 程序的入口点；注意，调用 `Main`\
  \ 时不需要实例化包含它的类。另一个常用的静态方法是 `Console` 类中的 `WriteLine`。访问静态方法时，请注意语法的差异；在点（句号）语句的左侧，使用的是类名而不是实例名：`Console.WriteLine`。\n\
  \n声明为 `static` 的类字段将在所有实例之间共享。如果以下代码示例中的 `size` 被声明为静态且一个 `Animal` 对象更改了值，所有 `Animal`\
  \ 对象的值都会改变。\n\n在静态类中，所有元素也是静态的。在许多情况下，建议使用静态类、方法和字段以提高性能和效率。然而，如果将静态字段误认为是实例字段，则可能会发生隐性错误。\n\
  \n![clear](img/Image00021.jpg) 类与文件\n\n每个 C# 程序至少包含一个类。在开发程序时，建议（但不是必须）每个源代码文件（CS\
  \ 文件）中保留一个独立的类。如果你使用 C# IDE 创建类，它会自动生成一个源代码文件。\n\n### 封装\n\n类通常代表一个事物的特征以及它可以执行的操作。例如，为了用\
  \ C# 类表示一种动物，你可能会给它大小、速度和力量（以数字形式表示），以及一些函数如 `MoveLeft()`、`MoveRight()`、`SpeedUp()`、`Stop()`\
  \ 等，在这些函数中你将编写代码让你的“动物”执行这些动作。在 C# 中，你的动物类看起来如下：\n\n```cs\npublic class Animal {\n\
  \    private int size;\n    private float speed;\n    private int strength;\n  \
  \  public void MoveLeft() // 方法\n    {\n        // 代码写在这里 ...\n    }\n    // 其他方法写在这里\
  \ ...\n}\n```\n\n如果你浏览 .NET Framework 类库，你会发现每个类都代表一个“事物”，例如 `XmlDocument`、`String`、`Form`\
  \ 等，并且每个事物都有其可以执行的各种操作（方法）、你可以读取并可能修改的特征（属性）以及它在执行某些给定操作时发送的通知（事件）。方法、属性、事件，以及所有其他内部变量和常量（字段），统称为类的成员。\n\
  \n将成员分组到类中不仅在逻辑上是合理的，还能让你隐藏你不希望让其他代码访问的数据和函数。这一原则被称为封装。当你浏览 .NET Framework 类库时，你看到的只是这些类的公共成员。每个类可能还拥有私有成员，这些成员供该类或相关类在内部使用，但不是供应用程序使用。当你创建自己的类时，将决定哪些成员应该是公共的，哪些应该是私有的。\n\
  \n![clear](img/Image00021.jpg) 封装\n\n通常，一个类代表对象的特征和它所执行的操作。例如，为了用 C# 类表示一种动物，你需要给它大小、速度和力量（以数字形式表示），以及一些函数，如\
  \ `MoveLeft()`、`MoveRight()`、`SpeedUp()`、`Stop()` 等，在这些函数中你可以编写代码为动物完成这些事情。在 C#\
  \ 中，一个动物类可能像这样。\n\n```cs\npublic class Animal\n{\n    private int size;\n    private\
  \ float speed;\n    private int strength;\n    public void MoveLeft() // 方法\n  \
  \  {\n        // 代码写在这里 ...\n    }\n    // 其他方法写在这里 ...\n}\n```\n\n查看 .NET Framework\
  \ 类库可以清楚地看到，每个类都代表一个“对象”，如 `XmlDocument`、`String`、`Form`，对于每个这样的“对象”，都有不同的可以执行的操作（方法）、可以读取和修改的特征（属性）以及在执行某些指定操作时发送的通知（事件）。方法、属性和事件，以及所有其他内部变量和常量（字段）被称为类成员。\n\
  \n将成员分组到类中不仅符合逻辑，还能让你隐藏不应提供给其他代码的数据和函数。这一原则被称为封装。当你浏览 .NET Framework 类库时，你只会看到这些类的公共成员。每个类都可能拥有私有成员，供该类或相关类内部使用，而不供应用程序使用。当你创建自己的类时，你需要决定哪些成员是公共的，哪些是私有的。\n\
  \n### 继承\n\n类可以继承另一个类，这意味着包含了原始类的所有成员（包括公共和私有的），加上它定义的额外成员。原始类被称为基类，新类被称为派生类。你创建一个派生类来表示基类的一种更具体的类型。例如，你可以定义一个继承自\
  \ `Animal` 的 `Cat` 类。`Cat` 可以做 `Animal` 能做的一切，此外它还可以执行一个额外的独特动作。C# 代码如下：\n\n```cs\n\
  public class Cat: Animal\n{\n    public void Purr()\n    {\n    }\n}\n```\n\n\n\n\
  \n`Cat: Animal` 符号表示 `Cat` 继承自 `Animal`，因此 `Cat` 也拥有一个 `MoveLeft` 方法以及三个私有变量 `size`、`speed`\
  \ 和 `strength`。如果你定义了一个继承自 `Cat` 的 `SiameseCat` 类，它将拥有 `Cat` 的所有成员加上 `Animal` 的所有成员。\n\
  \n### 多态\n\n在计算机编程领域，多态指的是派生类重新定义或重写（override）其继承自基类的方法的能力。当你需要在方法中执行某些特定操作，而该操作在基类中是不同的或未定义的时，你就会需要这样做。例如，`Animal.MoveLeft`\
  \ 方法由于为了对所有动物都有效，它必须非常通用，因此可能非常简单：诸如“改变方向，使动物的头部现在指向 X 方向”。然而，在你的 `Cat` 类中，这可能是不够。你可能需要指定\
  \ `Cat` 在旋转时如何移动它的爪子和尾巴。如果你还定义了 `Fish`（鱼）类或 `Bird`（鸟）类，你可能需要为这些类中的每一个类以不同的方式重写 `MoveLeft`\
  \ 方法。因为你可以为特定的类自定义 `MoveLeft` 方法的行为，所以创建该类并调用其方法的代码就不需要为世界上每种动物都准备一个单独的方法。只要对象继承自\
  \ `Animal`，调用代码就可以调用 `MoveLeft` 方法，而该对象自身的方法版本将被调用。\n\n![clear](img/Image00021.jpg)\
  \ 继承\n\n一个类可以继承另一个类，这意味着它包含了原始类的所有成员（包括公共和私有成员）以及它定义的额外成员。原始类被称为基类（base class），新类被称为派生类（derived\
  \ class）。创建派生类的目的是为了表示基类的特殊能力。例如，你可以定义一个名为 `Cat` 的类，它继承自 `Animal`。`Cat` 可以做 `Animal`\
  \ 能做的所有事情，外加一个独特的动作。C# 代码看起来如下：\n\n```csharp\npublic class Cat: Animal\n{\n    public\
  \ void Purr ()\n    {\n    }\n}\n```\n\n符号 `Cat: Animal` 意味着 `Cat` 继承自 `Animal`，并且\
  \ `Cat` 也拥有一个方法 `MoveLeft` 和三个私有变量：`size`、`speed` 和 `strength`。如果你定义了一个继承自 `Cat`\
  \ 的 `SiameseCat` 类，它将包含所有的 `Cat` 成员以及所有的 `Animal` 成员。\n\n在计算机编程中，多态指的是派生类修改或重写其继承自基类的方法的能力。当基类中不同或未定义的方法需要执行某些特殊操作时，就会使用此功能。例如，由于\
  \ `Animal.MoveLeft` 方法为了适用于所有动物而需要是通用的，它可能非常简单，例如“改变位置使动物的头部位于 X 方向”。然而，对于 `Cat`\
  \ 类来说，这可能是不够的。你可能需要指定 `Cat` 在转弯时如何移动它的腿和尾巴。如果 `Fish` 类或 `Bird` 类已经定义，你可能需要为这些类中的每个类以不同的方式重写\
  \ `MoveLeft` 方法。因为你可以为特定类自定义 `MoveLeft` 方法的行为，创建类并调用其方法的代码就不需要为每种动物准备一个单独的方法。只要对象继承自\
  \ `Animal`，调用者只需调用 `MoveLeft` 以及该对象自身的方法版本。\n\n### 构造函数\n\n每个类都有一个构造函数：一个与类同名的方法。当根据类定义创建对象时，构造函数会被调用。构造函数通常设置类中定义变量的初始值。如果数值数据类型的初始值为零、布尔数据类型的初始值为\
  \ `false` 或引用类型的初始值为 `null`，则没有必要，因为这些数据类型会自动进行初始化。\n\n你可以定义带有任意数量参数的构造函数。没有参数的构造函数称为默认构造函数。接下来的示例定义了一个具有默认构造函数和一个接受字符串的构造函数的类，并分别使用了它们：\n\
  \n```csharp\nclass SampleClass\n{\n    string greeting;\n    public SampleClass\
  \ ()\n    {\n        greeting = \"Hello, World\" ;\n    }\n    public SampleClass\
  \ (string message)\n    {\n        greeting = message;\n    }\n    public void SayHello\
  \ ()\n    {\n        System.Console.WriteLine (greeting);\n    }\n}\n\nclass Program\n\
  {\n    static void Main (string [] args)\n    {\n        // 使用默认构造函数。\n        SampleClass\
  \ sampleClass1 = new SampleClass ();\n        sampleClass1.SayHello ();\n      \
  \  // 使用接受字符串参数的构造函数。\n        SampleClass sampleClass2 = new SampleClass ( \"Hello,\
  \ Mars\" );\n        sampleClass2.SayHello ();\n    }\n}\n```\n\n每个类都有一个构造函数——一个与类同名的方法。当根据类定义创建对象时，构造函数会被调用。通常，构造函数设置类中定义变量的初始值。如果数值数据类型的初始值为零、布尔数据类型的“false”或引用类型的\
  \ `null`，则不使用构造函数，因为这些数据类型会自动初始化。\n\n你可以定义带有任意数量参数的构造函数。无参数的构造函数称为默认构造函数。接下来的示例显示了一个带有默认构造函数和一个接受字符串表达式的构造函数的类定义。然后该类使用了其中的每一个。\n\
  \n```csharp\nclass SampleClass\n{\n    string greeting ;\n    public SampleClass\
  \ ()\n    {\n        greeting = \"Hello, World\" ;\n    }\n    public SampleClass\
  \ (string message)\n    {\n        greeting = message;\n    }\n    public void SayHello\
  \ ()\n    {\n        System.Console.WriteLine (greeting);\n    }\n}\n\nclass Program\n\
  {\n    static void Main (string [] args)\n    {\n        // 使用默认构造函数。\n        SampleClass\
  \ sampleClass1 = new SampleClass ();\n        sampleClass1.SayHello ();\n      \
  \  // 使用接受字符串参数的构造函数。\n        SampleClass sampleClass2 = new SampleClass ( \"Hello,\
  \ Mars\" );\n        sampleClass2.SayHello ();\n    }\n}\n```\n\n## 运算符重载\n\n具有相同名称的方法（在上一个示例中为\
  \ `SampleClass()`）被称为重载。编译器知道使用哪种方法，因为在每次创建对象时都会提供参数列表（如果有）。重载可以让你的代码更加灵活和易读。\n\n\
  方法重载\n\n方法重载是指创建相同名称的方法（在上一个示例中为 `SampleClass()`）。编译器知道使用哪种方法，因为每次创建对象时都会提供参数列表。重载可以让你的代码更加灵活和易读。\n\
