  # 创建 C# Windows 应用程序\n\n本主题的目的是让你熟悉 Visual C# Express 版集成开发环境 (IDE) 的各个元素，你将通过它使用\
  \ Windows Forms 构建一个相对简单的 C# 程序。Windows Forms 为你的项目提供了诸许多组件，例如对话框、菜单、按钮以及许多其他控件，这些组件构成了标准的\
  \ Windows 应用程序用户界面 (UI)。从根本上说，这些控件只是 `.NET Framework` 类库中的类。Visual C# Express 版中的\
  \ `Designer` 视图允许你将控件拖到应用程序的主表单上，并调整它们的大小和位置。在此过程中操作时，IDE 会自动添加源代码来创建相应类的实例并对其进行初始化。\n\
  \n此示例将向你展示如何创建一个自己的 浏览器应用程序，可以通过指向喜喜爱网站的快捷方式对其进行自定义。\n\n在本节中，你将学习如何完成以下任务：\n\n*\
  \ 创建一个新的 Windows Forms 应用程序。\n* 在 `Code` 视图和 `Designer` 视图之间切换。\n* 更改 Windows Form\
  \ 的属性。\n* 添加一个 `MenuStrip` 控件。\n* 添加一个 `Button` 控件。\n* 创建并填充 `ComboBox` 控件。\n* 使用\
  \ `WebBrowser` 控件。\n* 为控件创建事件处理程序。\n\n1. 在 `File` 菜单上，点击 `New Project`。\n出现 `New\
