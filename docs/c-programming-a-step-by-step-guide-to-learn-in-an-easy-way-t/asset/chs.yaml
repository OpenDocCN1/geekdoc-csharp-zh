  \ .NET Framework 由三个主要部分组成：公共语言运行时、统一类库的层次结构，以及称为 ASP.NET 的组件化 ASP。\n\n[[ii]](https://translate.googleusercontent.com/translate_f#_ednref2)\
  \ 为其他应用程序提供数据和服务的应用程序逻辑单元。应用程序使用标准的 Web 协议和数据格式（如 HTTP、XML 和 SOAP）访问 XML Web 服务，而取决于每个\
