  \ (...) ***...…\n\n\n\n\n此函数的目的是告诉程序从用户输入流中读取下一行。你可以直接对已声明的变量使用此函数。但是，你需要先对数据进行转换，使其与变量类型匹配。\n\
  \n例如，如果你声明了字符串：\n\n```csharp\nstring MyString;\n```\n\n那么你需要结合使用 `Convert.ToString`\
  \ 函数和 `Console.ReadLine` 方法，以便将随后的用户输入存储到 `MyString` 中。\n\n以下是使用这些方法的正确语法：\n\n```csharp\n\
  string MyString;\nMyString = Convert.ToString (Console.ReadLine());\n```\n\n这是一个接受用户输入并将其打印为喜颜色的程序示例。\n\
  \n```csharp\nusing System;\n\nnamespace FavoriteColor\n{\n    class MainClass\n\
  \    {\n        public static void Main (string[] args)\n        {\n           \
  \ string MyString;\n/* 字符串已声明 */\n            Console.WriteLine (“Greetings! What\
  \ is your favorite color?”);\n            /* 询问用户输入 */\n            MyString = Convert.ToString(Console.ReadLine());\n\
  \            /* 输入被转换为字符串类型并存储到变量 MyString 中 */\n            Console.WriteLine (“Your\
  \ favorite color is “ + MyString);\n            /* 程序被要求在输出 MyString 中值之外额外输出一行\
  \ */\n        }\n    }\n}\n```\n\n## 转换为其他数据类型\n\n如上所述，在存储到变量之前，你需要将 `Console.ReadLine`\
  \ 方法获取输入转换为适当的数据类型。转换为数据类型需要特定的语法。为了方便参考，以下是针对特定数据类型需要使用的函数列表，这些函数将主要用于本书的后续课程：\n\
  \n- 转换为整数 – `Convert.ToInt32`\n- 转换为小数 – `Convert.ToDecimal`\n- 转换为字符 – `Convert.ToChar`\n\
  - 转换为布尔 – `Convert.ToBoolean`\n\n# 第 5 章 – 执行操作\n\n在本章中：\n\n- 基础运算符介绍\n- 在变量上执行操作\n\
  - 使用逻辑运算符\n\n到此时，你应该已经知道如何编写一个以简单形式允许用户交互的程序。用户现在可以参与并影响程序的运行。但仍然缺少一些东西。你需要给你的程序一个目的。\n\
  \n## C# 的基础运算符\n\nC# 使用的运算符与 C++ 中使用的相似。该编程语言有一组非常大的运算符，分为 15 类：\n\n- 原始运算符\n- 一元运算符\n\
  - 乘法运算符\n- 加法运算符\n- 关系和类型测试\n- 等等运算符\n- 移位运算符\n- 逻辑异或\n- 逻辑或\n- 逻辑与\n- 条件与\n- 条件或\n\
  - 条件运算符\n- 空合并运算符\n- 赋值运算符和 Lambda 表达式\n\n对于初学者来说，你需要学习如何使用用于算术和逻辑处理的基础运算符。这些是帮助为你的程序注入活力并赋予其实际目的的基本过程。\n\
  \n## 执行数学运算\n\n编写执行操作的方法和表达式是非常言而易懂的。例如，如果你想相变量 `x` 和 `y` 的值，在变量声明并赋值后你将使用以下语法。你可以使用\
  \ `Console.Write` 函数配合以下语法直接打印结果数字：\n\n```csharp\nConsole.Write (“The sum is ” +\
  \ (x + y));\n```\n\n记住，你需要将想要执行的算术运算括在括号中。否则，`Console.Write` 函数将把 `x` 和 `y` 的值仅仅视为要写入行的扩展。例如，如果\
  \ `x = 1` 且 `y = 2`，结果将是：\n\n```csharp\nConsole.Write (“The sum is “ + x + y));\
  \ /* 相应的输出将是 The sum is 12 */\nConsole.Write (“The sum is “ + (x + y)); /* 相应的输出将是\
  \ The sum is 3 */\n```\n\n或者，你可以将结果存储在另一个变量中。这样你就可以避免每次想打印两个变量之和时都添加 `(x + y)`。将其存储在单独变量中还允许你使用它的值执行进一步的操作。\n\
  \n## 简单计算器\n\n在 C# 中创建一个全功能程序的最简单方法是编写一个执行简单数学计算的小程序。利用你学到的关于用户输入和变量的知识，你应该能够获取要执行操作的值。\n\
  \n这是一个允许你对两个数字进行简单数学运算的程序示例：\n\n```csharp\nusing System;\n\nnamespace Calculator\n\
  {\n    class MainClass\n    {\n        public static void Main (string[] args)\n\
  \        {\n            int x, y, a, b, c, d;\n            Console.WriteLine (“Please\
  \ insert the 1st number.”);\n            x = Convert.ToInt32(Console.ReadLine());\n\
  \            Console.WriteLine (“Please insert the 2nd number.”);\n            y\
  \ = Convert.ToInt32(Console.ReadLine());\n            a = x + y;\n            b\
  \ = x - y;\n            c = x * y;\n            d = x / y;\n            Console.WriteLine\
  \ (“The sum is “ + a);\n            Console.WriteLine (“The difference is “ + b);\n\
  \            Console.WriteLine (“The product is “ + c);\n            Console.WriteLine\
  \ (“The quotient is “ + d);\n        }\n    }\n}\n```\n\n## 其他运算符\n\n在本书的剩余章节中，你还将介绍\
  \ C# 中的其他基础运算符。这包括条件、关系和一元运算符，它们可用于循环。首先，让我们看看一些元运算符：\n\n注意：变量 `x` 仅作为操作数的示例，不属于运算符本身。\n\
  \n- `++x` – 该运算符将操作数的值增加 1。\n- `--x` – 该运算符将操作数的值减少 1。\n- `+x` – 该运算符仅表示操作数的值。\n\
  - `-x` – 该运算符将取操作数的负值。\n\n一元运算符之所以这样命名是因为它们只影响所属的单个操作数。这些运算符对于编写条件语句设置循环参数有用。\n\n\
  另一类有运算符是关系运算符，其主要目的是比较两个操作数：\n\n- `==` – 该运算符检查两个操作数是否相等。\n- `!=` – 与 `==` 运算符相反，此运算符检查两个操作数是否不等。\n\
  - `>` – 该运算符检查左侧操作数是否大于右侧。\n- `<` – 该运算符检查左侧操作数是否小于右侧。\n- `>=` – 该运算符检查左侧是否大于或等于右侧。\n\
  - `<=` – 该运算符检查左侧是否小于或等于右侧。\n\n关系运算符返回布尔值并用于创建条件语句。在创建循环时设置条件参数也有用。\n\n最后，条件运算符是用于检查两个或多个参数的基础运算符。它们返回布尔值取决于操作数的值。这两个运算符是：\n\
  \n- `&&` – 该运算符检查双方是否都为真。如果是，它将产生真的布尔值。\n- `||` – 该运算符检查至少有一侧是否为真。例如，表达式 `1 < 2\
  \ || 1 > 2` 将返回真的布尔值，因为左侧为真，即使右侧不是。\n\n\n\n\n\n# 数字检查器程序\n\n你可以查看下方的示例程序，它演示了如何使用这\
  \ 3 类运算符中的某些运算符。该程序专门编写用于实现以下功能：\n\n* 请求输入第一个数字\n* 请求输入第二个数字\n* 检查两个数字是否相同\n* 检查第一个数字是小还是大\n\
  * 检查其中一个数字是否为负数\n* 检查其中一个负数是否等于 `-2`\n* 获取第一个数字的增量\n* 获取第二个数字的减量\n\n注意：同样请注意使用了流程控制语句\
  \ (`if`）。这些将在下一章节进行讨论。\n\n```csharp\nusing System;\n\nnamespace Operations\n{\n\
  \    class MainClass\n    {\n        public static void Main(string[] args)\n  \
  \      {\n            int x, y;\n            Console.WriteLine (“first number.”);\n\
  \            x = Convert.ToInt32(Console.ReadLine());\n            Console.WriteLine\
  \ (“second number.”);\n            y = Convert.ToInt32(Console.ReadLine());\n  \
  \          /* Relational Operators */\n            if (x == y)\n            {\n\
  \                Console.WriteLine (“The two numbers are equal.”);\n           \
  \ }\n            else if (x < y)\n            {\n                Console.WriteLine\
  \ (“The first number is smaller.”);\n            }\n            else\n         \
  \   {\n                Console.WriteLine (“The first number is bigger.”);\n    \
  \        }\n            /* Conditional Operators */\n            if (x < 0 || y\
  \ < 0)\n            {\n                Console.WriteLine (“one of them is negative.”);\n\
  \                if (x != -2 && y != -2)\n                {\n                  \
  \  Console.WriteLine (“None of them is -2.”);\n                }\n            }\n\
  \            /* Unary Operators */\n            Console.WriteLine (“The increment\
  \ of the first number is “ + ++x);\n            Console.WriteLine (“The decrement\
  \ of the second number is “ + --y);\n            Console.ReadKey();\n        }\n\
  \    }\n}\n```\n\n记住，你可以使用这些运算符在程序中创建逻辑。这些对于创建流程控制语句至关重要，它们将在下一章节讨论。\n\n# 第 6 章\
  \ – C# 中的流程控制\n\n在本章中：\n* If-Else 语句基础\n* 使用 Switch 语句\n* 生成随机数\n* 编写循环\n\n到目前，你应该已经注意到你在\
  \ C# 中编写的程序是按一个方向运行的。它们从第一行一直到最后一个大括号。在上一章中你还学习了 `if-else` 语句，它会在运行方法之前检查特定条件。在理解\
  \ C# 程序中的流程控制方面，这是向正确方向的一步。\n\n## 什么是流程控制？\n\n简单来说，你可以使用流程控制语句来控制程序的方向或过程。与其简单地从上到下运行每一行和方法，你可以告诉程序在任何给定时刻访问哪些特定的内容。\n\
  \n你在上一章使用的 `if-else` 语句是使用布尔逻辑的流程控制示例。如果满足一个条件，将应用后续的方法。为了清晰起见，这里是 C# 中编写 `if-else`\
  \ 语句的正确语法：\n\n```csharp\nif (“在此处插入条件”)\n{\n    /* 如果满足条件，插入你想要运行的方法 */\n}\nelse\
  \ if (“在此处插入辅助条件”)\n{\n    /* 如果不满足第一个条件，可以使用 else if 检查另一个条件并运行其他方法 */\n}\nelse\n\
  {\n    /* 如果之前的所有条件都不满足，可以运行 else 语句；记住 else 语句是可选的 */\n}\n```\n\n除了 `if-else` 语句外，在运行结果之前检查特定条件的更简单方法是使用三元运算符\
  \ (`?`)。使用此运算符，你可以根据条件返回的布尔值初始化另一个变量的值。使用此运算符的正确语法如下：\n\n`<条件> ? <如果为真的结果> : <如果为假的结果>`\n\
  \n例如，`if-else`：\n```csharp\nif (x != y)\n    z = 1;\nelse\n    z = 2;\n```\n等于：\n\
  `z = (x != y) ? 1 : 2;`\n\n在 C# 语言中，使用条件语句控制运行哪些代码行被称为分支。除了使用三元运算符和 `if-else` 语句外，你还可以使用\
  \ `switch` 语句来控制程序的运行。\n\n## Switch\n\n通过 `switch` 语句，你可以编写具有不同 case 的程序，这些 case\
  \ 根据 `switch` 表达式中变量的值触发。以下是 `switch` 语句的样式：\n\n```csharp\nswitch (“statement”)\n\
  {\n    case 1: /* 如果 switch 变量等于 1，将发生什么 */\n        break;\n    case 2: /* 如果 switch\
  \ 变量等于 2，将发生什么 */\n        break;\n    default: /* 如果 switch 变量不等于上述任何 case，将发生什么\
  \ */\n        break;\n}\n```\n\n同时请记住，你需要在每个 case 结束操作的地方使用 `break`。否则，程序将继续执行剩余的\
  \ case，从而违背使用 `switch` 流程控制语句的目的。此外，注意 `default` 等于 `if-else` 语句中的 `else` 语句。\n\n\
  这是一个简单的示例，要求用户从给定范围内输入一个数字并给出相应的响应：\n\n```csharp\nchar x;\nConsole.WriteLine (“Insert\
  \ a letter from A-C.”);\nx = Convert.ToChar(Console.ReadLine());\nx = Char.ToUpper(x);\n\
  switch (x)\n{\n    case ‘A’:\n    {\n        Console.WriteLine (“You put A.”);\n\
  \        break;\n    }\n    case ‘B’:\n    {\n        Console.WriteLine (“You put\
  \ B.”);\n        break;\n    }\n    case ‘C’:\n    {\n        Console.WriteLine\
  \ (“You put C.”);\n        break;\n    }\n    default:\n    {\n        Console.WriteLine\
  \ (“Invalid input.”);\n        break;\n    }\n}\n```\n\n注意，对于此示例，`x` 的字符输入在 `x =\
  \ Char.ToUpper(x);` 这一行被转换为大写。记住上述 `switch` 语句中的 case 只检查 `x` 的值是否为大写字母 A、B 或 C\
  \ 之一。如果用户在不先转换的情况下输入小写 a，case 语句将把用户引导到 `default` 方法。\n\n## 编写循环\n\n创建程序运行方式变化的另一种方法是使用循环。只要满足所需的条件，循环基本上会一直重复其内部的方法。循环还有一个特定的点，在该点会对条件进行更新和重新检查。一旦不再满足要求的条件，循环就会停止，应用程序将恢复。\n\
  \n### While 循环\n\n`while` 循环在运行包含的语句之前先测试条件。利用 `while` 循环的最简单方法是创建一个从 10 开始倒数的程序。它的编写方式如下：\n\
  \n```csharp\nint x = 10;\nwhile (x > 0)\n{\n    Console.WriteLine (x);\n}\n```\n\
  \n\n\n\n\n```csharp\nx--;\n\n /* 在此示例中，递减运算符是为了防止无限循环 */\n\n\n```\n\n# for 循环\n\n\
  for 循环与 while 循环的主要区别在于，在声明 for 循环本身时，初始化、检查和更新先决变量的参数被包含在内了。结合上面的示例，for 循环的形式如下：\n\
  \n```csharp\nfor (int x = 10; x > 0; x--)\n\n{\n    Console.WriteLine (x);\n}\n\
  ```\n\n# do-while 循环\n\ndo-while 循环在检查条件之前会先执行一次方法。在控制台应用程序中使用此循环的一种方便方法是将整个程序封装在循环中，这将为用户提供重启选项。\n\
  \n为了演示 do-while 循环，这里有一个模拟掷骰子的示例程序。该程序将完成以下任务：\n\n*   从 1-6 之间随机生成两个数字\n*   获取这两个数字之和\n\
  *   询问用户是否还想再次掷骰\n\n# 生成随机数\n\n在 C# 中生成随机数，你需要调用 `Random` 类，该类用于生成随机数的实例。可以使用实例构造函数语法来实现，这需要为实例指定名称以及可选参数。\n\
  \n要创建 `Random` 类的实例，可以使用以下语法：\n\n```csharp\nRandom <instance name> = new Random\
  \ ();\n```\n\n此外，你还需要实际使用该随机实例的变量。例如，如果你想为变量 `random` 生成一个随机值，你需要使用的语法如下：\n\n```csharp\n\
  Random RandomInstance = new Random ();\nint random = RandomInstance.Next (1, 101;\n\
  ```\n\n在这个特定的示例中，随机实例将生成一个 1 到 100 之间的数字，该数字与 `RandomInstance` 一起声明。记住，表达式中的最大值始终比实际值大\
  \ 1。如果你愿意，可以留空这些参数。\n\n话不多说，骰子模拟器程序如下：\n\n```csharp\nusing System;\n\nnamespace\
  \ DieRoller\n\n{\n    class MainClass\n    {\n        public static void Main (string[]\
  \ args)\n        {\n            char Roll = ‘R’;\n            /* 首先，我们初始化 do-while\
  \ 循环的条件 */\n            do {\n                Random x = new Random ();\n      \
  \          /* 我们创建了一个名为‘x’的 random 类的实例/对象 */\n                int die01 = x.Next\
  \ (1, 7);\n                Console.WriteLine (“The first die rolls “+ die01);\n\
  \                /* 第一个骰子或变量 die01 的值从 1-6 之间生成并打印 */\n                int die02\
  \ = x.Next (1, 7);\n                Console.WriteLine (“The second die rolls “+\
  \ die02);\n                /* 第二个骰子或变量 die02 的值从 1-6 之间生成并打印 */\n              \
  \  Console.WriteLine (“You rolled “ + (die01 + die02));\n                /* 打印两个骰子的总和\
  \ */\n                Console.WriteLine (“Press R to Reroll”);\n               \
  \ Roll = Convert.ToChar (Console.ReadLine ());\n                Roll = Char.ToUpper\
  \ (Roll);\n                /* 在这里，用户可以按 R 键使变量 Roll 的值满足循环条件 */\n            } while\
  \ (Roll == ‘R’);\n            /* 最后，程序检查变量 roll 的值是否仍为 Y，如果是则将重启 */\n        }\n\
  \    }\n}\n```\n\n## 你可能感兴趣的其他书籍预览：\n\n[HTML: Step by Step Beginners Guide to HTML](http://www.amazon.com/gp/product/B00YDSJ8VC?Version*=1&*entries*=0)\n\
