- fmt: "\nThe purpose of this function is to tell the program to read the following\
    \ line from the user input stream. You can use this function directly on an already-declared\
    \ variable. However, you need to convert the data first so that it matches the\
    \ variable.\n\nFor example, if you declare the string:\n\n```csharp\nstring MyString;\n\
    ```\n\nThen you need to use the function `Convert.ToString` in conjunction with\
    \ the `Console.ReadLine` method to allow the ensuing user input to be stored to\
    \ `MyString`.\n\nHere is the proper syntax for using these methods:\n\n```csharp\n\
    string MyString;\nMyString = Convert.ToString (Console.ReadLine());\n```\n\nHere\
    \ is an example of a program that accepts user input and prints it out as the\
    \ favorite color.\n\n```csharp\nusing System;\n\nnamespace FavoriteColor\n{\n\
    \    class MainClass\n    {\n        public static void Main (string[] args)\n\
    \        {\n            string MyString;\n/* The String is declared */\n     \
    \       Console.WriteLine (“Greetings! What is your favorite color?”);\n     \
    \       /* The user is asked for input */\n            MyString = Convert.ToString(Console.ReadLine());\n\
    \            /* The input is converted to string type and stored to the variable\
    \ MyString */\n            Console.WriteLine (“Your favorite color is “ + MyString);\n\
    \            /* The program is told to output a line in addition to the value\
    \ stored in MyString */\n        }\n    }\n}\n```\n\n## Converting to Other Data\
    \ Types\n\nAs stated above, you need to convert the input obtained through the\
    \ `Console.ReadLine` method into the appropriate data type before they can be\
    \ stored to variables. There are specific syntaxes required for converting to\
    \ data types. To serve as your guide, here is a list of the functions you need\
    \ to use for specific data types which will be used primarily throughout the lessons\
    \ in this book:\n\n- To Int–`Convert.ToInt32`\n- To Decimal – `Convert.ToDecimal`\n\
    - To Char – `Convert.ToChar`\n- To Bool – `Convert.ToBoolean`\n\n# Chapter 5 –\
    \ Performing Operations\n\nIn this Chapter:\n\n- Introduction to the Basic Operators\n\
    - Performing Operators on Variables\n- Using Logical Operators\n\nAt this point,\
    \ you should now know how to write a program that allows user interaction in the\
    \ simplest form. The user can now participate and have an influence on the course\
    \ of the program. But something is still lacking. You need to give your program\
    \ a purpose.\n\n## The Basic Operators of C#\n\nC# uses operators that resemble\
    \ the ones used in C++. There is a particularly large set of operators used in\
    \ this programming language which are grouped across 15 categories:\n\n- Primary\n\
    - Unary\n- Multiplicative\n- Additive\n- Relational and Type Testing\n- Equality\n\
    - Shift\n- Logical XOR\n- Logical OR\n- Logical AND\n- Conditional AND\n- Conditional\
    \ OR\n- Conditional\n- Null-Coalescing\n- Assignment and Lambda\n\nFor beginners,\
    \ you need to learn how to use the basic operators used for arithmetic and logical\
    \ processes. These are the essential processes that will help breathe life into\
    \ your program and give it an actual purpose.\n\n## Performing Mathematical Operations\n\
    \nWriting the methods and expressions that will perform operations is pretty self-explanatory.\
    \ For example, if you want to add the values of variables `x` and `y`, you will\
    \ be using the following syntax after the variables are declared and assigned\
    \ values. You can print the resulting number directly using the `Console.Write`\
    \ function with the following syntax:\n\n```csharp\nConsole.Write (“The sum is\
    \ ” + (x + y));\n```\n\nRemember that you need to enclose the arithmetic operation\
    \ you want to perform in parentheses. Otherwise, the `Console.Write` function\
    \ will understand the values of `x` and `y` merely as extensions of the line to\
    \ be written. For example, if `x = 1` and `y = 2`, these will be the results:\n\
    \n```csharp\nConsole.Write (“The sum is “ + x + y)); /* The ensuing output will\
    \ be The sum is 12 */\nConsole.Write (“The sum is “ + (x + y)); /* The ensuing\
    \ output will be The sum is 3 */\n```\n\nAlternatively, you can store the resulting\
    \ number into another variable. This way, you can prevent having to add `(x +\
    \ y)` every time you want to print the sum of the two variables. Storing it to\
    \ a separate variable will also allow you to use its value to perform further\
    \ operations.\n\n## A Simple Calculator\n\nThe easiest way to experience how to\
    \ create a fully-operational program in C# is by writing a small program that\
    \ performs simple mathematical calculations. Using what you have learned about\
    \ user input and variables, you should be able to obtain the values in which you\
    \ are going to perform your operations on.\n\nHere is an example program that\
    \ will allow you to perform simple mathematical operations with two numbers:\n\
    \n```csharp\nusing System;\n\nnamespace Calculator\n{\n    class MainClass\n \
    \   {\n        public static void Main (string[] args)\n        {\n          \
    \  int x, y, a, b, c, d;\n            Console.WriteLine (“Please insert the 1st\
    \ number.”);\n            x = Convert.ToInt32(Console.ReadLine());\n         \
    \   Console.WriteLine (“Please insert the 2nd number.”);\n            y = Convert.ToInt32(Console.ReadLine());\n\
    \            a = x + y;\n            b = x - y;\n            c = x * y;\n    \
    \        d = x / y;\n            Console.WriteLine (“The sum is “ + a);\n    \
    \        Console.WriteLine (“The difference is “ + b);\n            Console.WriteLine\
    \ (“The product is “ + c);\n            Console.WriteLine (“The quotient is “\
    \ + d);\n        }\n    }\n}\n```\n\n## Other Operators\n\nFor the remaining chapters\
    \ of this book, you will also be introduced to the other basic operators in C#.\
    \ This includes the conditional, relational, and unary operators which can be\
    \ used for creating loops. First, let us look at some of the unary operators:\n\
    \nNote: The variable `x` is only used as an example to represent the operand and\
    \ is not included in the operators itself.\n\n- `++x` – This operator will increase\
    \ the numeric value of the operand by an increment of 1.\n- `--x` – This operator\
    \ will decrease the numeric value of the operand by a decrement of 1.\n- `+x`\
    \ – This operator simply denotes the value of the operand.\n- `-x` – This operator\
    \ will take the negative value of the operand.\n\nUnary operators are named as\
    \ such because they only affect the single operand they are attached to. These\
    \ operators are useful for writing conditional statements and setting parameters\
    \ for loops.\n\nAnother category of useful operators is the relational operators,\
    \ which have the primary purpose of comparing two operands:\n\n- `==` – This operator\
    \ checks if the values of two operands each each.\n- `!=` – As opposed to the\
    \ `==` operator, this operator checks if the values of two operands are NOT equal.\n\
    - `>` – This operator checks if the value of the operand to the left is greater\
    \ than the one on the right.\n- `<` – This operator checks if the value of the\
    \ operand to the left is less than the one on the right.\n- `>=` – This operator\
    \ checks if the operand to the left is greater than or equal to the one on the\
    \ right.\n- `<=` – This operator checks if the operand to the left is less than\
    \ or equal to the one on the right.\n\nRelational operators return a Boolean value\
    \ and are used for creating conditional statements. They are also useful for setting\
    \ conditional parameters when creating loops.\n\nLastly, conditional operators\
    \ are basic operators that are used for checking two or more parameters. They\
    \ return a Boolean value depending on the values of the operands. The two conditional\
    \ operators are:\n\n- `&&` – This operator checks if both sides are true. If they\
    \ are, it will result in the Boolean value for true.\n- `||` – This operator checks\
    \ if at least one of the sides is true. For example, the expression `1 < 2 ||\
    \ 1 > 2` will return the Boolean value true because the left side is true even\
    \ though the right side is not.\n"
  raw: 'The purpose of this function is to tell the program to read the following
    line from the user input stream. You can use this function directly on an already-declared
    variable. However, you need to convert the data first so that it matches the variable.


    For example, if you declare the string:


    string MyString;


    Then you need to use the functionConvert.ToStringin conjunction with theConsole.ReadLine
    method to allow the ensuing user input to be stored toMyString.


    Here is the proper syntax for using these methods:


    string MyString;


    MyString = Convert.ToString (Console.ReadLine());


    Here is an example of a program that accepts user input and prints it out as the
    favorite color.


    using System;


    namespace FavoriteColor


    {


                  class MainClass


                  {


                  public static void Main (string[] args)


                  {


                                string MyString;


    /* The String is declared */


                  Console.WriteLine (“Greetings! What is your favorite color?”);


    /* The user is asked for input */


                  MyString = Convert.ToString(Console.ReadLine());


    /* The input is converted to string type and stored to the variable MyString */


                  Console.WriteLine (“Your favorite color is “ + MyString);


    /* The program is told to output a line in addition to the value stored in MyString
    */


                  }


                  }


    }


    Converting to Other Data Types


    As stated above, you need to convert the input obtained through theConsole.ReadLine
    method into the appropriate data type before they can be stored to variables.
    There are specific syntaxes required for converting to data types. To serve as
    your guide, here is a list of the functions you need to use for specific data
    types which will be used primarily throughout the lessons in this book:


    *   To Int–Convert.ToInt32


    *   To Decimal – Convert.ToDecimal


    *   To Char – Convert.ToChar


    *   To Bool – Convert.ToBoolean


    Chapter 5 –Performing Operations


    In this Chapter:


    **Introduction to the Basic Operators


    **Performing Operators on Variables


    **Using Logical Operators


    At this point, you should now know how to write a program that allows user interaction
    in the simplest form. The user can now participate and have an influence on the
    course of the program. But something is still lacking. You need to give your program
    a purpose.


    The Basic Operators of C#


    C# uses operators that resemble the ones used in C++. There is a particularly
    large set of operators used in this programming language which are grouped across
    15 categories:


    *   Primary


    *   Unary


    *   Multiplicative


    *   Additive


    *   Relational and Type Testing


    *   Equality


    *   Shift


    *   Logical XOR


    *   Logical OR


    *   Logical AND


    *   Conditional AND


    *   Conditional OR


    *   Conditional


    *   Null-Coalescing


    *   Assignment and Lambda


    For beginners, you need to learn how to use the basic operators used for arithmetic
    and logical processes. These are the essential processes that will help breathe
    life into your program and give it an actual purpose.


    Performing Mathematical Operations


    Writing the methods and expressions that will perform operations is pretty self-explanatory.
    For example, if you want to add the values of variablesxandy, you will be using
    the following syntax after the variables are declared and assigned values. You
    can print the resulting number directly using theConsole.Write function with the
    following syntax:


    Console.Write (“The sum is ” + (x + y));


    Remember that you need to enclose the arithmetic operation you want to perform
    in parentheses. Otherwise, theConsole.Write function will understand the values
    of x and y merely as extensions of the line to be written. For example, ifx =
    1and y= 2, these will be the results:


    Console.Write (“The sum is “ + x + y)); /* The ensuing output will be The sum
    is 12 */


    Console.Write (“The sum is “ + (x + y)); /* The ensuing output will be The sum
    is 3 */


    Alternatively, you can store the resulting number into another variable. This
    way, you can prevent having to add + (x + y)); every time you want to print the
    sum of the two variables. Storing it to a separate variable will also allow you
    to use its value to perform further operations.


    A Simple Calculator


    The easiest way to experience how to create a fully-operational program in C#
    is by writing a small program that performs simple mathematical calculations.
    Using what you have learned about user input and variables, you should be able
    to obtain the values in which you are going to perform your operations on.


    Here is an example program that will allow you to perform simple mathematical
    operations with two numbers:


    using System;


    namespace Calculator


    {


                  class MainClass


                  {


                  public static void Main (string[] args)


                  {


                  int x, y, a, b, c, d;


                  Console.WriteLine (“Please insert the 1st number.”);


                  x = Convert.ToInt32 (Console.ReadLine ());


                  Console.WriteLine (“Please insert the 2nd number.”);


                  y = Convert.ToInt32 (Console.ReadLine ());


    a = x + y; /* the sum of x and y is stored to a */


    b = x – y; /* the difference is stored to b */


    c = x * y; /* the product is stored to c */


    d = x / y; /*the quotient is stored to d */


                  Console.WriteLine (“The sum of the 2 numbers: “ + a);


                  Console.WriteLine (“The difference is: “ + b);


                  Console.WriteLine (“The product is: “ + c);


                  Console.WriteLine (“The quotient is: “ + d);


                  Console.ReadKey ();


                  }


                  }


    }


    Other Operators


    For the remaining chapters of this book, you will also be introduced to the other
    basic operators in C#. This includes the conditional, relational, and unary operators
    which can be used for creating loops. First, let us take a look at some of the
    useful unary operators:


    Note: The variable x is only used as an example to represent the operand and is
    not included in the operators itself.


    *   ++x – This operator will increase the numeric value of the operand by an increment
    of 1.


    *   --x – This operator will decrease the numeric value of the operand by a decrement
    of 1.


    *   +x – This operator simply denotes the value of the operand.


    *   -x – This operator will take the negative value of the operand.


    Unary operators are named as such because they only affect the single operand
    they are attached to. These operators are useful for writing conditional statements
    and setting parameters for loops.


    Another category of useful operators is the relational operators, which have the
    primary purpose of comparing two operands:


    *   == - This operator checks if the values of two operands equal each other.


    *   != - As opposed to the == operator, this operator checks if the values of
    two operands are NOT equal.


    *   > - This operator checks if the value of the operand to the left is greater
    than the one on the right.


    *   < - This operator checks if the value of the operand to the left is less than
    the one on the righty


    *   >= - This operator checks if the operand to the left is greater than or equal
    to the one on the right.


    *   <= - This operator checks if the operand to the left is less than or equal
    to the one on the right.


    Relational operators return a Boolean value and are used for creating conditional
    statements. They are also useful for setting conditional parameters when creating
    loops.


    Lastly, conditional operators are basic operators that are used for checking two
    or more parameters. They return a Boolean value depending on the values of the
    operands. The two conditional operators are:


    *   And (&&) – This operator checks if both sides are true. If they are, it will
    result in the Boolean value for true.


    *   Or (||) – This operator checks if at least one of the sides is true. For example,
    the expression1 < 2 || 1 > 2 will return the Boolean value true because the left
    side is true even though the right side is not.'
