    Pi value is \"+pi );/*通过加法连接字符加上调用 】*/         \n                 }\n        \
    \  }\n}\n```\n\n上述程式中仅仅拿×作范本您完全替代随意某个喜欢的量结果依然会按照 Console WriteLine 规则打印只是不能忘记尾巴上的那标志性后缀\
    \ 'M'.\n\n后章节还将学到怎么对这些 variable 进行操作运算但是为了让那些计更有意义前提得学会用户输人为来源去填充它们的价值一旦你觉得己经掌握了则可以放心往下走向下一课题-----\n\
    \n第四章——全面了解输入终端获取到的信息\n\n本章节涵盖以下要点 ：                \n·捕获外界讯息的 API           \
    \             \n ·吸纳之后放入确当名字定下的存储器空间           \n ·转化资料形态以便适应期望操作  \n\n想要运用各种算术逻辑行动让您的应用使命必达最重要的一步自然是搞清怎样使\
    \ console 中有进项并提供容器收纳之当前我们就先谈明如何处理这个流程 -----------\n\n###抓取外部信息的途径    \n前文简略提过的办法\
