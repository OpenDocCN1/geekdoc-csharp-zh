    Before anything else, remember that anything written between `/*` and `*/` are\
    \ seen by the compiler as the comments. They do not affect the program in any\
    \ way and are only included by developers for organization, so you can write anything\
    \ you like within them. Pay attention to the comments found in the code examples\
    \ throughout this book as they will denote something useful.\n\nRemember that\
    \ the Hello World program is a console application,\n\n## Namespace Declaration\n\
    \nAt the beginning of the program, notice how the namespace system is declared\
    \ (using `System;`). `System` is essentially a collection of codes that is called\
    \ upon by the Hello World program. Using namespaces is generally considered as\
    \ a good habit for developers since it prevents issues within the program such\
    \ as name clashes.\n\nTake note that if the `System` namespace is not used in\
    \ this program, the line `Console.WriteLine` will have to be written as `System.Console.WriteLine`.\
    \ But if you use the namespace declaration for `System`, then you do not have\
    \ to include `System` whenever you write a `Console.WriteLine` function.\n\nAfter\
    \ declaring the `System` namespace, the program now declares a new namespace called\
    \ `Test` (`namespace Test`). Remember that `Test` can be any word that will describe\
    \ your program. You can use something like `MyProgram` or `HelloWorld` just for\
    \ personalization, but it will not have an effect on the program.\n\n## Class\
    \ Declaration\n\nNext is the class declaration (`class MainClass`). Just like\
    \ the declaration of the `Test` namespace, you can use any word you like to label\
    \ this class. In C# programming, namespaces contain multiple classes that, in\
    \ turn, contain different methods. These terms will be explained as you go through\
    \ this book. While using the same label for your namespace and class will work\
    \ with the Hello World program, you should never use similar names when writing\
    \ other programs.\n\n## The Main Method\n\nThe next statement, `public static\
    \ void Main (string[] args)`, initiates a method in the Hello World program. In\
    \ this particular line, the `Main` method was initialized. Always remember that\
    \ the `Main` method is called the entry point of C# programs because it is called\
    \ first whenever the program starts. The words `public` and `static` are both\
    \ modifiers while `void` indicates that this method has no return value. The `public`\
    \ modifier basically allows the method to be called from external locations outside\
    \ the class. `Static`, on the other hand, makes the method a member of the class\
    \ itself and not a particular object of the class.\n\nFinally, the `(string[]\
    \ args)` defines the parameters to be included for the main method. This also\
    \ allows arguments and values to be passed over to this method. But for a program\
    \ like Hello World that does not use command line arguments, you can leave the\
    \ spaces between the parentheses blank and define the main method only with `public\
    \ static void Main ()`.\n\nThe next statement, which is included in the main method,\
    \ uses the `Console.WriteLine` function. This is the basic output function for\
    \ C#. Whenever it is called, it will print the text contained between the parentheses\
    \ and quotation marks in the console application.\n\n## The C# Coding Conventions\n\
    \nOutside the required syntax for a functional C# program, there are other standards\
    \ or conventions being followed by programmers. More specifically, there are the\
    \ C# coding conventions set by Microsoft to serve as guidelines for related documentation.\
    \ These, according to the programming community, are the good practices that you\
    \ should start adapting to as soon as you begin.\n\nWhile they sometime do not\
    \ have a direct effect on the program itself, it can help make other things such\
    \ as debugging, modifying, and optimizing easier. For example, it is entirely\
    \ possible to write a program in a lateral manner. But it is considered as a bad\
    \ practice because it greatly reduces the readability of your code. As much as\
    \ possible, programmers are encouraged to write 1 statement per line.\n\nThere\
    \ are several other guidelines that professional programmers follow that are related\
    \ to almost every aspect of C#. But for beginners, here are the essential practices\
    \ you should always remember as you learn the art of C# programming:\n\n- Do not\
    \ write anything in the same line as curly braces\n- Do not write anything in\
    \ the same line as comments\n- Focus on the 1:1 rule; write only one declaration\
    \ or statement in a single line\n- Always use indentations\n- If lines are not\
    \ indented automatically by the IDE, use tab to indent them yourself\n- Make sure\
    \ paired curly braces are aligned (opening and closing)\n\n# Chapter 3 – All About\
    \ Data\n\nIn this Chapter:\n\n### The Basic Input for C#\n\n### Introduction to\
    \ Variables and Data Types\n\n### The Different Methods of Declaring Variables\
    \ and Output\n\nThe Hello World program described in the previous chapter is a\
    \ complete program in a sense that it accomplishes what it was written to do.\
    \ Unfortunately, it is not meant for something more than just outputting information.\
    \ Remember that programming languages are invented so humans can communicate with\
    \ machines. But what you have done so far with the Hello World program is to write\
    \ something that will do.\n\n## The Basic Input\n\nThere is also one issue that\
    \ may arise with the Hello World program, or at least, the version of the Hello\
    \ World program in the previous chapter. In some compilers, running the program\
    \ will only briefly flash the console application before it closes immediately.\
    \ This is because there is nothing else that follows the `Console.WriteLine` function.\
    \ Once it does its job, a program will naturally terminate.\n\nA quick and easy\
    \ way to prevent this is to tell your program to wait for user input before ending\
    \ its life cycle, which can be done by adding the function:\n\n```csharp\nConsole.ReadKey\
    \ ();\n```\n\nYou can add this line after the `Console.WriteLine` function within\
    \ the `Main` method, meaning you should not add it after the very next curly brace\
    \ after said function. For now, you can leave the space for parameters (between\
    \ the parentheses) empty.\n\nGo ahead and try running the new program. You should\
    \ now notice that the program waits before any key is pressed before quitting.\
    \ Take note that for IDEs like MonoDevelop, the user is prompted a message like\
    \ press any key to continue. When a key is pressed, it will automatically be printed\
    \ in the console application window.\n\nTelling the program to await user input\
    \ is just the tip of the iceberg when it comes to user input in C# development.\
    \ The next step is to learn how to store user input into variables and somehow\
    \ utilize that information. But first, you should learn how to declare variables.\n\
    \n## Declaring Variables\n\nAs mentioned in the first chapter, variables are basically\
    \ any name that contains a specific data type. Variables are used for the purpose\
    \ of storing user input. But before a variable can be used, it must first be declared.\
    \ The same rule applies for every other programming language in existence.\n\n\
    To declare a variable, you need to use the following syntax:\n\n```csharp\nvar\
    \ MyVar = “insert value here”;\n```\n\nBear in mind that `MyVar` can be replaced\
    \ with anything you want to name your variable. Just remember that C# is case-sensitive,\
    \ so it is best to take note of capitalizations when naming variables. The same\
    \ goes for naming classes and methods.\n"
