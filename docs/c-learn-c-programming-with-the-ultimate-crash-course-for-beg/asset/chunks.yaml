  trans: "\n\n```csharp\nx--;\n\n /* 在此示例中，递减运算符是为了防止无限循环 */\n\n\n```\n\n# for 循环\n\
    \nfor 循环与 while 循环的主要区别在于，在声明 for 循环本身时，初始化、检查和更新先决变量的参数被包含在内了。结合上面的示例，for 循环的形式如下：\n\
    \n```csharp\nfor (int x = 10; x > 0; x--)\n\n{\n    Console.WriteLine (x);\n}\n\
    ```\n\n# do-while 循环\n\ndo-while 循环在检查条件之前会先执行一次方法。在控制台应用程序中使用此循环的一种方便方法是将整个程序封装在循环中，这将为用户提供重启选项。\n\
    \n为了演示 do-while 循环，这里有一个模拟掷骰子的示例程序。该程序将完成以下任务：\n\n*   从 1-6 之间随机生成两个数字\n*   获取这两个数字之和\n\
    *   询问用户是否还想再次掷骰\n\n# 生成随机数\n\n在 C# 中生成随机数，你需要调用 `Random` 类，该类用于生成随机数的实例。可以使用实例构造函数语法来实现，这需要为实例指定名称以及可选参数。\n\
    \n要创建 `Random` 类的实例，可以使用以下语法：\n\n```csharp\nRandom <instance name> = new Random\
    \ ();\n```\n\n此外，你还需要实际使用该随机实例的变量。例如，如果你想为变量 `random` 生成一个随机值，你需要使用的语法如下：\n\n\
    ```csharp\nRandom RandomInstance = new Random ();\nint random = RandomInstance.Next\
    \ (1, 101;\n```\n\n在这个特定的示例中，随机实例将生成一个 1 到 100 之间的数字，该数字与 `RandomInstance` 一起声明。记住，表达式中的最大值始终比实际值大\
    \ 1。如果你愿意，可以留空这些参数。\n\n话不多说，骰子模拟器程序如下：\n\n```csharp\nusing System;\n\nnamespace\
    \ DieRoller\n\n{\n    class MainClass\n    {\n        public static void Main\
    \ (string[] args)\n        {\n            char Roll = ‘R’;\n            /* 首先，我们初始化\
    \ do-while 循环的条件 */\n            do {\n                Random x = new Random ();\n\
    \                /* 我们创建了一个名为‘x’的 random 类的实例/对象 */\n                int die01\
    \ = x.Next (1, 7);\n                Console.WriteLine (“The first die rolls “+\
    \ die01);\n                /* 第一个骰子或变量 die01 的值从 1-6 之间生成并打印 */\n            \
    \    int die02 = x.Next (1, 7);\n                Console.WriteLine (“The second\
    \ die rolls “+ die02);\n                /* 第二个骰子或变量 die02 的值从 1-6 之间生成并打印 */\n\
    \                Console.WriteLine (“You rolled “ + (die01 + die02));\n      \
    \          /* 打印两个骰子的总和 */\n                Console.WriteLine (“Press R to Reroll”);\n\
    \                Roll = Convert.ToChar (Console.ReadLine ());\n              \
    \  Roll = Char.ToUpper (Roll);\n                /* 在这里，用户可以按 R 键使变量 Roll 的值满足循环条件\
    \ */\n            } while (Roll == ‘R’);\n            /* 最后，程序检查变量 roll 的值是否仍为\
    \ Y，如果是则将重启 */\n        }\n    }\n}\n```\n\n## 你可能感兴趣的其他书籍预览：\n\n[HTML: Step by\
