    Chapter 1 –Getting Started


    In this Chapter:


    **Brief Introduction to C#


    **Downloading a Free IDE and Compiler


    **The Basic Terms of C#


    If you are reading this book, then you are probably:


    *   A student


    *   A hobbyist


    *   A professional in need of a reference


    If you are completely new to the world of programming, then you should know that
    you need two things before you can start. To be specific, you need to install
    an Integrated Development Environment or IDE so you can write your code and a
    compiler to build your codes into a runnable piece of application.


    Usually, these two come bundled together. If you are a student and currently has
    a subject for C#, then you should probably ask for a copy of these two from your
    instructor. Otherwise, you need to purchase or download an IDE from the internet.


    For you to get started right away, you can choose from any of the free IDEs that
    include C# functionality below:


    *   Microsoft Visual Studio Express– [www.visualstudio.com](http://www.visualstudio.com)


    *   MonoDevelop–  [www.monodevelop.com](http://www.monodevelop.com)


    *   SharpDevelop– [www.icsharpcode.net/opensource/SD](http://www.icsharpcode.net/opensource/SD)


    Take note that the interfaces and shortcut commands for each IDE will vary. This
    is why the instructions of this book when it comes to accessing certain functions
    will be generalized, but the codes themselves should be exactly the same. Go ahead
    and download the one you prefer.


    If you are using Mac OS or Linux, then you may want to choose the cross-platform
    MonoDevelop. This particular IDE is feature-rich and has an interface that is
    very easy to get into. However, if you want an IDE that is lightweight, then you
    should go for SharpDevelop. Finally, you should choose Visual Studio Express in
    case you are interested in the added features of upgrading to Visual Studio Professional
    later on. Bear in mind that the programs listed above already come with compilers,
    so it is no longer necessary to look for one. After downloading your software,
    then you are ready to get started with coding.


    The Basic Terms of C#


    If you have never programmed before, a lot of the terms used in the following
    chapters such as statements, parameters, expressions, methods, and classes will
    definitely be confusing to you. Here is a quick reference guide for the basic
    terms in the world of C# programming:


    *   Class–A class is a group of methods and variables which define the behavior
    of instances, namely objects in object-oriented programming.


    *   Method–A method in C# is similar to a function in C++. Methods contain specific
    procedures for a class. Throughout the lessons this book, many methods or functions
    will be used such asConsole.WriteLine,Convert, and so on.


    *   Object– Objects are instances that apply the specifications set by a class.


    *   Statement– Statements are the building blocks of any program. Declarations,
    expressions, iterations, initiations, and a number of other actions within a program
    are statements.


    *   Operators–C# uses a lot of operator symbols that are similar to those useable
    in C++. Operators are used to perform arithmetic and logical operations between
    different data types. Some of the operators in C# are increment and decrement
    (-- and ++), multiplicative (*, /, and %), additive (+ and -), and several others
    for logical and conditional expressions.


    *   Variables–Variables are essentially just containers for specific pieces of
    data, which can have different types such as integral, floating point, decimal,
    Boolean, nullable, and textual. Remember that specific data types only permit
    specific values.


    *   Expressions– Expressions can include operators, variables, method invocations,
    and values. Depending on what an expression consists of, it may be classified
    as an invocation expression, query expression, literal expressions, and simple
    name expressions. There are also expressions known as Lambda expressions, which
    are used only for Language-Integrated Query or LINQ.


    Chapter 2 –The Program Structure


    In this Chapter:


    **The Hello World Program


    **Understanding the C# Program Structure


    **Basic Guidelines for Syntax (The Coding Conventions)


    Sometimes, the best way to learn something you are clueless about is to jump into
    the action. If you have studied other programming languages before, then you probably
    encountered the Hello World program that every beginner knows. It is the simplest
    of all programs with the sole function of printing the words Hello World and nothing
    else.


    To help you understand the program structure of C#, let us begin with the Hello
    World program as an example. Here is what the Hello World program looks like in
    C#:


    using System;


    namespace Test


    /* The two lines above are Namespace Declarations */


    {


    /* Just like in C++, brackets are used to segregate classes and methods */'
