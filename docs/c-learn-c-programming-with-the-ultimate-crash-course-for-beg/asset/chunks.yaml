    ```\n\n首先请牢记，任何写在`/*`和`*/`之间的内容都会被编译器视为注释。它们不会对程序产生任何影响，仅供开发者进行组织管理之用，因此你可以在其中随意编写任何内容。请注意本书代码示例中的相关注释——这些注释通常会提示一些有用的信息。\n\
    \n需要记住的是，\"Hello World\"程序是一个控制台应用程序。\n\n## 命名空间声明\n\n在程序的起始位置，请注意命名空间的声明方式（使用\
    \ `System;`）。本质上来说, `System`)是一组被 \"Hello World\" 程序调用的代码集合。通常认为养成使用命名空间的习惯对于开发者来说是良好的编程实践*它将有效避免程序中出现的诸如名称冲突之类的问题.\n\
    \n特别注意：如果在本程序中未引用“系统”的字段，“Console.WriteLine”就必须写完全程作为 “.这种用法会使函数不发生改变直到完成操作用线上的东西保留行政行外呼！”\
    \  但如果你使用了针对 **系统的**命令来宣告该域；那么每次书写一个功能时就不再需要使用 System 一词并附加于.On 之后呢 ?就是在表示应为:这样实际而简便操作之余也就是只有将我们所认知的部分一起带过来了呀！？”\n\
    \n`\n\n　　在为表单经过了初始配置后的这个时候 ,本地单元现在又定义出了一个全新的类别叫 TEST ──(`namespace Test)`.虽说此时['Test']可以用任意能够描绘您项目的术语来表示\
    \ ，例如个性化可以使用('MyProgram’或者是' Hello 世界 ')来形容这个名字的名称 .但是不管用哪种都并不会给这个项目带来什么不同寻常的效果也不是它自己对属性的直接干涉结果可以无所谓做很多改变的变数罢而已...”\n\
    \n## Class Declaration （类的申明）\n\n接下来便是类生命的步骤一共两道──(′)标识符像是刚刚我们处理'\"测试\"'这样一个大类区域般容易也很宽松自在)、),然而当我们站在\
    \ C#语言环境中进行操作的时候会发现 .实际上在这些个容器之中包含了多个子元素 、而且相互之间各含基本通路的不同手法那就会成为技能里最核心的知识点了!\n\
    \n后面紧随其运算符符号足够的表现特征应当是我们生命原则上面指出的几个没有太大混淆性问题只要大方向掌握好就好比如总算无明显歧义甚至并存着类似标注也没所谓等范围性事项最终全是完美贴合的学习要领宝典哦！！最后也要铭记虽然出现在字符段落就像本例种类同名以确保发展服装流程对着心向目标准则坚守到底不外乎一定会受益良多再加上更加安全连接脉络的网络后越来越满足结局了则是居多以上要素决定之基础上展开就可以提前尽情体会一番吧！\n\
    \n其实啊？当到下一个陈述出现时刻便将要开始真正摆荡理智的热情中心热度指示领域的关键部分 —— 「主线」方法 (< {=$strPod?}\")\n在这特有的完整一行当中正巧预告名叫「主轴的机制已经孕育成型同时切记每个从头到尾都不能马虎不光因为它是这项技术的起点路径也是入场卷等等...里头除了起到修饰作用的\
    \ [`public]以及形容词接着延续性质的涵括 [static]]以外更有返回值方面的揭示表明本段 block 没有任何外界返回的结果交付出去 。然后那个叫做“共有的限定文辞译作英文相对含义就是允许外部环境对这一结构跨过级别而不加限制地访问下去。“另外还有代表成长分支记录的调整指令就是把此类中的一个实例成员权移交到这个门本身而非私拥特订的对象实体给予自由分享给自己的全部孩子均可齐备得来这份通道一口畅通表达了嘛……\
    \ \n\n】\n\n长久下来到最后关头之一描述那时繁茂细节经过细分受教育琢磨求精艺成就卓越愿望深藏心底绝不会溜走翻页密谋拓展也有妥帖简直足以令人称赞不已还不快点整理收藏起来快去采纳实行好吧？\n\
    \n    此外紧接着诉薪资终于要来了有关建立变量首项基础注意和图二呈现也不禁重要想当初头章节也曾经提过的那些知识包含特定数据类型玩意儿是为了保存用户键入的资料方便调用预备后续深入探讨千万不能忽略忽视要认真扎实学会逐步细看撒手去做即可达成无限小巧思实质提高很快咯哇~~!!\n\
    \n/BLOCKQUOTE>\n</think>"
- fmt: "\nNext is the basic assignment operator (`=`) which allows you to set a value\
    \ for your variable. Take note that no data type is specified if you are to declare\
    \ variables using only the `var` function. Instead, the data type will be automatically\
    \ determined depending on what kind of data you associate when you declare the\
    \ variable. This is why you cannot declare an undefined variable using this method.\n\
    \nHowever, you do not really need to assign a value to variables as soon as the\
    \ program starts. With this being said, you can simply declare a variable by omitting\
    \ the assignment operator and shortening your declaration to:\n\n`<Data type>\
    \ MyVar;`\n\nBut first, what exactly are data types and how do they differ? First\
    \ of all, there are three categories encompassing different data types; value\
    \ types, reference types, and pointer types. For the rest of this book, much of\
    \ the focus will be invested on value data types. These are the data types that\
    \ are usually embedded as values to variables.\n\n## The Data Types List\n\nThere\
    \ are 13 total data types. But we will only be expounding and using a few of them\
    \ throughout this book. Remember that there are default values to these data types,\
    \ which are used in case you do not set the value yourself when declaring variables\
    \ with them:\n\n*   `Boolean (bool)` – The `Boolean` or `bool` data type only\
    \ has two possible values; `true` or `false`. This is extremely convenient for\
    \ creating conditions. The default value for this data type is `false`. Take note\
    \ that unlike in C++, the `Boolean` values in C# do not have numerical values.\
    \ This means `true` is not equal to `1` and `false` is not equal to `0`.\n*  \
    \ `Character (char)` – A character or `char` data type is represented by a single\
    \ Unicode character or simply just text. Remember that this particular data type\
    \ uses only a single character, as opposed to the `string` data type. The default\
    \ value for this data type is `'\\0'`.\n*   `Integer (int)` – For basic programming\
    \ purposes, you will be relying mostly on the `integer` or `int` data type when\
    \ dealing with numbers. The `int` data type is considered as a signed integer,\
    \ which are identified by computers using 2s complement. The default value for\
    \ the `int` data type is `0`.\n*   `String (string)` – The `string` data type\
    \ is basically a sequence of characters. A `string` may also contain numerals.\
    \ This is ideal when storing information such as names, passwords, words, and\
    \ basically any other sequence that uses alphanumeric characters.\n*   `Decimal\
    \ (decimal)` – Remember that other data types, namely `float` and `double`, can\
    \ be used with integers that have precise decimal values. However, for most numerical\
    \ concepts in the human language (money, measurements, etc.), it is always simpler\
    \ to use the `decimal` data type. For artifacts or values used for the sole purpose\
    \ of calculations within the program, sometimes `float` or `double` is more apt.\
    \ The default value for a `decimal` type is `0.0M`.\n\nThe data types that will\
    \ not be expounded on in this book are the following:\n\n*   `Float (float)` –\
    \ The `float` data type contains 32-bit floating-point values. It is basically\
    \ short for floating point, which refers to a decimal point somewhere within the\
    \ digits. `Float` data types can have up to 7 digits.\n*   `Double (double)` –\
    \ A `double` type is the same as the `float` type with the primary difference\
    \ of storing up to 16 digits. Unlike the `float` type, `double` denotes 64-bit\
    \ double-precision floating points.\n*   `Long (long)` – `Long` is an integer\
    \ data type (no decimal points) that may contain numbers from `-9,223,372,036,854,775,808`\
    \ to `9,223,372,036,854,775,807`. This is the range of the 64-bit signed integers.\
    \ Take note that for `int`, which denotes 32-bit signed integers, the range is\
    \ `-2,147,483,648` to `2,147,483,647`.\n*   `Short (short)` – In comparison to\
    \ the `long` and `int` data types, the `short` data type denotes 16-bit signed\
    \ types with a range from `-32,768` to `32,767`.\n*   `Sbyte` – The `sbyte` represents\
    \ the smallest of the pack; denoting 8-bit signed integers which contain numbers\
    \ from `-128` to `127`.\n*   `Byte, Uint, Ulong` – These are the unsigned counterparts\
    \ of `sbyte`, `int`, and `short` types. They do not contain numbers less than\
    \ zero, which is why their entire range is extended to positive numbers. For `byte`,\
    \ the range goes from `0` to `255`. For `uint`, the range goes from `0` to `4,294,967,295`.\
    \ For `ulong`, the range goes from `0` to `18,446,744,073,709,551,615`. And for\
    \ `ushort`, the range goes from `0` to `65,535`.\n\nGoing back to declaring variables,\
    \ you can now declare them with specific data types using the keyword of type.\
    \ For example, if you want to declare the variable `x` with the data type `integer`\
    \ without defining its value, you can use the following syntax:\n\n`int x;`\n\n\
    Using this method, you may also declare multiple variables like:\n\n`int x, y,\
    \ z;`\n\nLastly, remember that you can still assign a specific value for variables\
    \ using this method of declaration. All you need to do is to use the assignment\
    \ operator (`=`) and use the following syntax:\n\n`int x = 1, y = 2, z = 3;`\n\
    \n## Outputting Variables\n\nThe next thing to learn is how to use the values\
    \ stored in variables with the output stream. For example, let us try using a\
    \ variable for `pi` and use the `Console.WriteLine` function to print it in the\
    \ application. Take a look at the example below that is written for this simple\
    \ purpose:\n\n```csharp\nusing System;\n\nnamespace Output\n{\n    class MainClass\n\
    \    {\n        public static void Main (string[] args)\n        {\n         \
    \   decimal pi;\n            pi = 3.1416M;\n            /* Remember that the default\
    \ values for the decimal data type contains the suffix M */\n            Console.WriteLine(\"\
    The value of pi is \" + pi);\n            /* The operator + is used with the Console.WriteLine\
    \ method to use variable values */\n        }\n    }\n}\n```\n\nTake note that\
    \ the name `pi` is only used in the above program as an example. You can change\
    \ the value assigned to the variable to anything you like and it will be printed\
    \ with the `Console.WriteLine` method. Just remember that the decimal data type\
    \ requires the suffix `M` to be valid.\n\nLater on, you will learn how to perform\
    \ operations with these variables. But in order to make those calculations matter;\
    \ you should first learn how to utilize user input in setting the values for variables.\
    \ Once you think you fully understand variables and data types, feel free to proceed\
    \ to the next chapter.\n\n# Chapter 4 – All About User Input\n\nIn this Chapter:\n\
    - The Functions for Getting User Input\n- Saving User Input to Variables\n- Converting\
    \ Data Types from User Input\n\nUnderstanding and learning how to use variables\
    \ in a program is the first step to utilizing user input. Once these variables\
    \ contain values, you can now perform various arithmetic and logical operations\
    \ that will give your program a purpose. But first, let us discuss how to obtain\
    \ values from user input.\n\n## How to Get User Input\n\nThe function `Console.ReadKey()`\
    \ briefly mentioned in the previous chapter is the simplest way to allow user\
    \ interaction in the program. You can actually utilize user input using the following\
    \ syntax:\n\n`ConsoleKeyInfo x;`\n\n/* ConsoleKeyInfo is a class that is used\
    \ for a single key press and can be used in conjunction with modifier keys such\
    \ as Alt, Ctrl, and Shift */\n\n`Console.WriteLine(\"Press a letter\\n\");`\n\n\
    /* The \\n tells the program to write a new line */\n\n`x = Console.ReadKey ();`\n\
    \n/* The program is now told to use Console.ReadKey for the variable x */\n\n\
    `Console.Write(\"\\nYou pressed: \");`\n\n`Console.WriteLine(x.Key.ToString());`\n\
    \n/* Finally, the program is told to print the value of x, which was assigned\
    \ using the Console.ReadKey function */\n\nHowever, you need to learn a better\
    \ method of obtaining user input and saving them to actual variables you can operate\
    \ with. This time, you will need to use the `Console.ReadLine()` function.\n\n\
    ## Using the Console.ReadLine Function\n"
