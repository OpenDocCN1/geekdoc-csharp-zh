  trans: "\n\n此函数的目的是告诉程序从用户输入流中读取下一行。你可以直接对已声明的变量使用此函数。但是，你需要先对数据进行转换，使其与变量类型匹配。\n\
    \n例如，如果你声明了字符串：\n\n```csharp\nstring MyString;\n```\n\n那么你需要结合使用 `Convert.ToString`\
    \ 函数和 `Console.ReadLine` 方法，以便将随后的用户输入存储到 `MyString` 中。\n\n以下是使用这些方法的正确语法：\n\n\
    ```csharp\nstring MyString;\nMyString = Convert.ToString (Console.ReadLine());\n\
    ```\n\n这是一个接受用户输入并将其打印为喜颜色的程序示例。\n\n```csharp\nusing System;\n\nnamespace FavoriteColor\n\
    {\n    class MainClass\n    {\n        public static void Main (string[] args)\n\
    \        {\n            string MyString;\n/* 字符串已声明 */\n            Console.WriteLine\
    \ (“Greetings! What is your favorite color?”);\n            /* 询问用户输入 */\n   \
    \         MyString = Convert.ToString(Console.ReadLine());\n            /* 输入被转换为字符串类型并存储到变量\
    \ MyString 中 */\n            Console.WriteLine (“Your favorite color is “ + MyString);\n\
    \            /* 程序被要求在输出 MyString 中值之外额外输出一行 */\n        }\n    }\n}\n```\n\n\
    ## 转换为其他数据类型\n\n如上所述，在存储到变量之前，你需要将 `Console.ReadLine` 方法获取输入转换为适当的数据类型。转换为数据类型需要特定的语法。为了方便参考，以下是针对特定数据类型需要使用的函数列表，这些函数将主要用于本书的后续课程：\n\
    \n- 转换为整数 – `Convert.ToInt32`\n- 转换为小数 – `Convert.ToDecimal`\n- 转换为字符 – `Convert.ToChar`\n\
    - 转换为布尔 – `Convert.ToBoolean`\n\n# 第 5 章 – 执行操作\n\n在本章中：\n\n- 基础运算符介绍\n- 在变量上执行操作\n\
    - 使用逻辑运算符\n\n到此时，你应该已经知道如何编写一个以简单形式允许用户交互的程序。用户现在可以参与并影响程序的运行。但仍然缺少一些东西。你需要给你的程序一个目的。\n\
    \n## C# 的基础运算符\n\nC# 使用的运算符与 C++ 中使用的相似。该编程语言有一组非常大的运算符，分为 15 类：\n\n- 原始运算符\n\
    - 一元运算符\n- 乘法运算符\n- 加法运算符\n- 关系和类型测试\n- 等等运算符\n- 移位运算符\n- 逻辑异或\n- 逻辑或\n- 逻辑与\n\
    - 条件与\n- 条件或\n- 条件运算符\n- 空合并运算符\n- 赋值运算符和 Lambda 表达式\n\n对于初学者来说，你需要学习如何使用用于算术和逻辑处理的基础运算符。这些是帮助为你的程序注入活力并赋予其实际目的的基本过程。\n\
    \n## 执行数学运算\n\n编写执行操作的方法和表达式是非常言而易懂的。例如，如果你想相变量 `x` 和 `y` 的值，在变量声明并赋值后你将使用以下语法。你可以使用\
    \ `Console.Write` 函数配合以下语法直接打印结果数字：\n\n```csharp\nConsole.Write (“The sum is ”\
    \ + (x + y));\n```\n\n记住，你需要将想要执行的算术运算括在括号中。否则，`Console.Write` 函数将把 `x` 和 `y`\
    \ 的值仅仅视为要写入行的扩展。例如，如果 `x = 1` 且 `y = 2`，结果将是：\n\n```csharp\nConsole.Write (“The\
    \ sum is “ + x + y)); /* 相应的输出将是 The sum is 12 */\nConsole.Write (“The sum is\
    \ “ + (x + y)); /* 相应的输出将是 The sum is 3 */\n```\n\n或者，你可以将结果存储在另一个变量中。这样你就可以避免每次想打印两个变量之和时都添加\
    \ `(x + y)`。将其存储在单独变量中还允许你使用它的值执行进一步的操作。\n\n## 简单计算器\n\n在 C# 中创建一个全功能程序的最简单方法是编写一个执行简单数学计算的小程序。利用你学到的关于用户输入和变量的知识，你应该能够获取要执行操作的值。\n\
    \n这是一个允许你对两个数字进行简单数学运算的程序示例：\n\n```csharp\nusing System;\n\nnamespace Calculator\n\
    {\n    class MainClass\n    {\n        public static void Main (string[] args)\n\
    \        {\n            int x, y, a, b, c, d;\n            Console.WriteLine (“Please\
    \ insert the 1st number.”);\n            x = Convert.ToInt32(Console.ReadLine());\n\
    \            Console.WriteLine (“Please insert the 2nd number.”);\n          \
    \  y = Convert.ToInt32(Console.ReadLine());\n            a = x + y;\n        \
    \    b = x - y;\n            c = x * y;\n            d = x / y;\n            Console.WriteLine\
    \ (“The sum is “ + a);\n            Console.WriteLine (“The difference is “ +\
    \ b);\n            Console.WriteLine (“The product is “ + c);\n            Console.WriteLine\
    \ (“The quotient is “ + d);\n        }\n    }\n}\n```\n\n## 其他运算符\n\n在本书的剩余章节中，你还将介绍\
    \ C# 中的其他基础运算符。这包括条件、关系和一元运算符，它们可用于循环。首先，让我们看看一些元运算符：\n\n注意：变量 `x` 仅作为操作数的示例，不属于运算符本身。\n\
    \n- `++x` – 该运算符将操作数的值增加 1。\n- `--x` – 该运算符将操作数的值减少 1。\n- `+x` – 该运算符仅表示操作数的值。\n\
    - `-x` – 该运算符将取操作数的负值。\n\n一元运算符之所以这样命名是因为它们只影响所属的单个操作数。这些运算符对于编写条件语句设置循环参数有用。\n\
    \n另一类有运算符是关系运算符，其主要目的是比较两个操作数：\n\n- `==` – 该运算符检查两个操作数是否相等。\n- `!=` – 与 `==` 运算符相反，此运算符检查两个操作数是否不等。\n\
    - `>` – 该运算符检查左侧操作数是否大于右侧。\n- `<` – 该运算符检查左侧操作数是否小于右侧。\n- `>=` – 该运算符检查左侧是否大于或等于右侧。\n\
    - `<=` – 该运算符检查左侧是否小于或等于右侧。\n\n关系运算符返回布尔值并用于创建条件语句。在创建循环时设置条件参数也有用。\n\n最后，条件运算符是用于检查两个或多个参数的基础运算符。它们返回布尔值取决于操作数的值。这两个运算符是：\n\
    \n- `&&` – 该运算符检查双方是否都为真。如果是，它将产生真的布尔值。\n- `||` – 该运算符检查至少有一侧是否为真。例如，表达式 `1 <\
    \ 2 || 1 > 2` 将返回真的布尔值，因为左侧为真，即使右侧不是。\n\n"
- fmt: "\n# Numbers Checker Program\n\nYou can take a look at the following example\
    \ program that demonstrates how some of the operators under these 3 categories\
    \ can be used. It is written specifically to fulfill the following:\n\n* Ask for\
    \ the input of a first number\n* Ask for the input of a second number\n* Checks\
    \ to see if both numbers are the same\n* Checks if the first number is smaller\
    \ or bigger\n* Checks if one of the numbers is negative\n* Checks if one of the\
    \ negative numbers is equal to `-2`\n* Gets the increment of the first number\n\
    * Gets the decrement of the second number\n\nNote: Also notice that flow control\
    \ statements (`if`) will be used. These will be discussed in the next chapter.\n\
    \n```csharp\nusing System;\n\nnamespace Operations\n{\n    class MainClass\n \
    \   {\n        public static void Main(string[] args)\n        {\n           \
    \ int x, y;\n            Console.WriteLine (“first number.”);\n            x =\
    \ Convert.ToInt32(Console.ReadLine());\n            Console.WriteLine (“second\
    \ number.”);\n            y = Convert.ToInt32(Console.ReadLine());\n         \
    \   /* Relational Operators */\n            if (x == y)\n            {\n     \
    \           Console.WriteLine (“The two numbers are equal.”);\n            }\n\
    \            else if (x < y)\n            {\n                Console.WriteLine\
    \ (“The first number is smaller.”);\n            }\n            else\n       \
    \     {\n                Console.WriteLine (“The first number is bigger.”);\n\
    \            }\n            /* Conditional Operators */\n            if (x < 0\
    \ || y < 0)\n            {\n                Console.WriteLine (“one of them is\
    \ negative.”);\n                if (x != -2 && y != -2)\n                {\n \
    \                   Console.WriteLine (“None of them is -2.”);\n             \
    \   }\n            }\n            /* Unary Operators */\n            Console.WriteLine\
    \ (“The increment of the first number is “ + ++x);\n            Console.WriteLine\
    \ (“The decrement of the second number is “ + --y);\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\nRemember that you can use these operators to create\
    \ logic within your program. These are essential for creating flow control statements,\
    \ which will be discussed in the next chapter.\n\n# Chapter 6 – Flow Control in\
    \ C#\n\nIn this Chapter:\n* The Basics of If-Else Statements\n* Using Switch Statements\n\
    * Generating Random Numbers\n* Writing Loops\n\nBy now, you should notice that\
    \ the programs you have written so far in C# run in one direction. They travel\
    \ from the first line down to the last curly brace. You are also introduced to\
    \ the `if-else` statements in the previous chapter, which will check for specific\
    \ conditions before running methods. This is a single step in the right direction\
    \ when it comes to understanding flow control in C# programs.\n\n## What is Flow\
    \ Control?\n\nIn simple terms, you can use flow control statements to control\
    \ the direction or course of your program. Instead of simply running each line\
    \ and method from top to bottom, you may tell your program which specific ones\
    \ to access at any given moment.\n\nThe `if-else` statement you used in the previous\
    \ chapter is an example of flow control that uses Boolean logic. If one condition\
    \ is met, then the following methods will be applied. To be clear, here is the\
    \ proper syntax for writing `if-else` statements in C#:\n\n```csharp\nif (“insert\
    \ conditions here”)\n{\n    /* Insert the methods you wish to run in case the\
    \ conditions are met */\n}\nelse if (“Insert secondary conditions here”)\n{\n\
    \    /* If the first condition is not met, you can use else if to check for another\
    \ condition and run other methods instead */\n}\nelse\n{\n    /* You can run an\
    \ else statement in case none of the prior conditions are met; remember that else\
    \ statements are optional */\n}\n```\n\nAside from the `if-else` statement, a\
    \ simpler method of checking for specific conditions before running the result\
    \ is using the ternary operator (`?`). With this operator, you can initialize\
    \ the value of another variable depending on the returned Boolean value of the\
    \ condition. The correct syntax for using this operator is as follows:\n\n`<condition>\
    \ ? <result if true> : <result if false>`\n\nFor example, `if-else`:\n```csharp\n\
    if (x != y)\n    z = 1;\nelse\n    z = 2;\n```\nIs the same as:\n`z = (x != y)\
    \ ? 1 : 2;`\n\nIn C# language, the practice of using conditional statements to\
    \ control which lines of codes to run is also referred as branching. Aside from\
    \ using the ternary operator and `if-else` statements, you can control the course\
    \ of your program using the `switch` statement.\n\n## Switch\n\nWith the `switch`\
    \ statement, you can write your program with different cases that trigger on the\
    \ value of the variable in the `switch` expression. Here is what the `switch`\
    \ statement looks like:\n\n```csharp\nswitch (“statement”)\n{\n    case 1: /*\
    \ what will happen if the switch variable equals 1 */\n        break;\n    case\
    \ 2: /* what will happen if the switch variable equals 2 */\n        break;\n\
    \    default: /* what will happen if the switch variable does not equal any of\
    \ the case above */\n        break;\n}\n```\n\nAlso bear in mind that you need\
    \ to `break` where you want to end the action in each case. Otherwise, the program\
    \ will continue through the rest of the cases and thus defeats the purpose of\
    \ using the `switch` flow control statement. Also take that `default` is equivalent\
    \ to the `else` statement in an `if-else` statement.\n\nHere is a simple example\
    \ that asks the user to insert a number from a given range and gives an appropriate\
    \ response:\n\n```csharp\nchar x;\nConsole.WriteLine (“Insert a letter from A-C.”);\n\
    x = Convert.ToChar(Console.ReadLine());\nx = Char.ToUpper(x);\nswitch (x)\n{\n\
    \    case ‘A’:\n    {\n        Console.WriteLine (“You put A.”);\n        break;\n\
    \    }\n    case ‘B’:\n    {\n        Console.WriteLine (“You put B.”);\n    \
    \    break;\n    }\n    case ‘C’:\n    {\n        Console.WriteLine (“You put\
    \ C.”);\n        break;\n    }\n    default:\n    {\n        Console.WriteLine\
    \ (“Invalid input.”);\n        break;\n    }\n}\n```\n\nNotice that for this example,\
    \ the character input for `x` was converted to uppercase in the line `x = Char.ToUpper(x);`.\
    \ With the `switch` statement shown above, remember that the cases only check\
    \ if the value of `x` is any of the uppercase characters A, B, and C. If the user\
    \ inputs lowercase a without converting it first, the case statement will send\
    \ the user to the `default` method.\n\n## Writing Loops\n\nAnother way to create\
    \ variations on how your program will run is to use loops. A loop will basically\
    \ keep on repeating the methods inside it as long as the required conditions are\
    \ met. A loop also has a specific point wherein the condition is updated and rechecked.\
    \ Once the condition required is no longer met, the loop stops and the application\
    \ will resume.\n\n### While Loop\n\nThe `while` loops tests the condition first\
    \ before running the enclosed statements. The simplest way to utilize a `while`\
    \ loop is to create a program that counts down from 10. Here is how it is written:\n\
    \n```csharp\nint x = 10;\nwhile (x > 0)\n{\n    Console.WriteLine (x);\n}\n```\n"
