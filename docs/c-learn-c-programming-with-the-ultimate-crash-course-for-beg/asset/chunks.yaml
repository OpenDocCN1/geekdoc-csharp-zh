    Chapter 3 – All About Data


    In this Chapter:


    **The Basic Input for C#


    **Introduction to Variables and Data Types


    **The Different Methods of Declaring Variables and Output


    The Hello World program described in the previous chapter is a complete program
    in a sense that it accomplishes what it was written to do. Unfortunately, it is
    not meant for something more than just outputting information. Remember that programming
    languages are invented so humans can communicate with machines. But what you have
    done so far with the Hello World program is to write something that will do the
    exact same thing over and over again; without the participation of the end-user.


    The Basic Input


    There is also one issue that may arise with the Hello World program, or at least,
    the version of the Hello World program in the previous chapter. In some compilers,
    running the program will only briefly flash the console application before it
    closes almost immediately. This is because there is nothing else that follows
    after theConsole.WriteLine function. Once it does its job, a program will naturally
    terminate.


    A quick and easy way to prevent this is to tell your program to wait for user
    input before ending its life cycle, which can be done by adding the function:


    Console.ReadKey ();


    You can add this line after theConsole.WriteLine function within the Main method,
    meaning you should not add it after the very next curly brace after said function.
    For now, you can leave the space for parameters (between the parentheses) empty
    since you will not need them.


    Go ahead and try running the new program. You should now notice that the program
    waits before any key is pressed before quitting. Take note that for IDEs like
    MonoDevelop, the user is prompted a message like press any key to continue. When
    a key is pressed, it will automatically be printed in the console application
    window.


    Telling the program to await user input is just the tip of the iceberg when it
    comes to user input in C# development. The next step is to learn how to store
    user input into variables and somehow utilize that information. But first, you
    should learn how to declare variables.


    Declaring Variables


    As mentioned in the first chapter, variables are basically any name that contains
    a specific data type. Variables are used for the purpose of storing user input.
    But before a variable can be used, it must first be declared. The same rule applies
    for every other programming language in existence.


    To declare a variable, you need to use the following syntax:


    var MyVar = “insert value here”;


    Bear in mind that MyVar can be replaced with anything you want to name your variable.
    Just remember that C# is case-sensitive, so it is best to take note of capitalizations
    when naming variables. The same goes for naming classes and methods.'
