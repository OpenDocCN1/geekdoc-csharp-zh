  trans: "\n接下来是基本的赋值运算符（`=`），它允许你为变量设置一个值。请注意，如果仅使用 `var` 函数声明变量，则无需指定数据类型。相反，数据类型将根据你在声明时为该变量关联的数据类型自动确定。这就是为什么你不能用这种方法声明未定义的变量的原因。\n\
    \n然而，在程序启动时你并不需要立即给所有变量赋值。也就是说，你可以省略赋值运算符来直接简单地这样缩短声明的写法：\n\n`<Data type> MyVar;`\n\
    \n但首先我们来具体看看什么是数据类型以及它们之间到底有何区别？第一点,共有三大类别涵盖了不同的数据类型的分类：值类型、引用类型和指针的类型是本范围内的这三类的划分标准；对于本书其余部分来说重点将会集中在数值型数据的讨论上这些通常是作为嵌入到变数里的基本形式存在的几种结构化方式之一\
    \ 。\n\n##  相关概念归类 /列表式的说明 \n一共有 13 种不同类型可供选择 ,但在全过程中我们会详细阐述其中一部分并加以运用 。请记住每种都有默认设定好的初始状态\
    \ （即当你没有显式地对其进行定义时的预设情况 ）: \n\n*   `Boolean (布尔)` ————这种只包含两种取值:`true(真)`或 false(`假`)非常适用于创建条件判断语句\
    \ ;它的缺省值为 false 需要注意与 C++不同 ，C#中的 Boolean 不存在数字含义因此 true 不等同于 1 且 fals e 也不等于\
    \ 0 。\n*   字符型 (`char`)------一种储单个 Unicode 编码文字即是说仅仅是文本而已注意这里强调只容纳一个字符合集而非字符串那样多字序列；其原始为你\\\
    <'\\\\0'\\>\n *整数(int)-————日常编程中最常用来处理数字的主要就是 integer/int 类别的了.此属于带有正负号机器内部采用补码识别机制的范围类型\
    \ ;预先配置好 reset 回起点时候的基数则是零(\n **string-**其实质上一连串有序排列起来的符号集合里面可以包括一些阿拉伯数码非常适合存放姓名密码单词等等任何字母混编组成的组合\
    \ .系统赋予初态为空串 \"\"\n decimal-(十进制 )----------另外比如 float double 也能支持带小数点的准确计算但对例如金钱度量之类人类语言常见场景直接用\
    \ decimal 显然简便很多反之纯粹为了算法执行目的而设计的构件偶尔更适合选用 float/double.d emical 起始模样叫做 \"0 .M\
    \ \"\n\n下列是这本书里不会深入剖析的具体项目：\n      Float 浮点数---保存 32 位精度最大七位数长度双精 bit 两个都是 64bits\
    \ 容量上限扩展到了十六个有效位置\n长整 l ong ------不含小数点能够承载范围从 -9 223372036854775808 至 +9223372036854775807\
    \ 这是有符六十四比特能级宽度相对于三十二位的 int 而言区间限于(-3147483648)...类似短 short 定义为签字版 16b iti 覆盖度大约[-32768..+37677]最小的一位叫\
    \ Sby te 表示八 bit 有符号极限-128~127 .\n     unsinged varieites 对应 sbyte uint ulong\
    \ ushort 分别不具备负数区段因而整体移动向更高维度分别是 BYTe=[00--255],UInt[:4294967295 ],ULONG...极其巨大直至最后一个\
    \ ushort 也达到了 65535.\n回到刚才提到的那个初始化问题上现在你就可以依靠关键词精确限定某种 specifi ed variable 样本例如如果想指派\
    \ x 不附具体的数值只需要这样的语法:\nint x;\n同样这份方法还适合于同时多个如 ... :\n然后最后也不能忘掉还能利用等算子实现兼具匹配的效果只需参照\
    \ : ...\n输出引用的内容接下就要学习如何结合 output 流把存入的内容显现出来假设我们打算圆周率π并且呼叫 Console.Writline 显示成实际应用程序界面中来检验下面的样例就是为了达到这一简单意图写的代码块”:\n\
    \n```csharp\nusing System;\n\nnamespace Output  \n{\n    class MainClass   \n\
