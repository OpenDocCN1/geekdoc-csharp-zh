  trans: "\n\n# 数字检查器程序\n\n你可以查看下方的示例程序，它演示了如何使用这 3 类运算符中的某些运算符。该程序专门编写用于实现以下功能：\n\
    \n* 请求输入第一个数字\n* 请求输入第二个数字\n* 检查两个数字是否相同\n* 检查第一个数字是小还是大\n* 检查其中一个数字是否为负数\n* 检查其中一个负数是否等于\
    \ `-2`\n* 获取第一个数字的增量\n* 获取第二个数字的减量\n\n注意：同样请注意使用了流程控制语句 (`if`）。这些将在下一章节进行讨论。\n\
    \n```csharp\nusing System;\n\nnamespace Operations\n{\n    class MainClass\n \
    \   {\n        public static void Main(string[] args)\n        {\n           \
    \ int x, y;\n            Console.WriteLine (“first number.”);\n            x =\
    \ Convert.ToInt32(Console.ReadLine());\n            Console.WriteLine (“second\
    \ number.”);\n            y = Convert.ToInt32(Console.ReadLine());\n         \
    \   /* Relational Operators */\n            if (x == y)\n            {\n     \
    \           Console.WriteLine (“The two numbers are equal.”);\n            }\n\
    \            else if (x < y)\n            {\n                Console.WriteLine\
    \ (“The first number is smaller.”);\n            }\n            else\n       \
    \     {\n                Console.WriteLine (“The first number is bigger.”);\n\
    \            }\n            /* Conditional Operators */\n            if (x < 0\
    \ || y < 0)\n            {\n                Console.WriteLine (“one of them is\
    \ negative.”);\n                if (x != -2 && y != -2)\n                {\n \
    \                   Console.WriteLine (“None of them is -2.”);\n             \
    \   }\n            }\n            /* Unary Operators */\n            Console.WriteLine\
    \ (“The increment of the first number is “ + ++x);\n            Console.WriteLine\
    \ (“The decrement of the second number is “ + --y);\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n记住，你可以使用这些运算符在程序中创建逻辑。这些对于创建流程控制语句至关重要，它们将在下一章节讨论。\n\
    \n# 第 6 章 – C# 中的流程控制\n\n在本章中：\n* If-Else 语句基础\n* 使用 Switch 语句\n* 生成随机数\n* 编写循环\n\
    \n到目前，你应该已经注意到你在 C# 中编写的程序是按一个方向运行的。它们从第一行一直到最后一个大括号。在上一章中你还学习了 `if-else` 语句，它会在运行方法之前检查特定条件。在理解\
    \ C# 程序中的流程控制方面，这是向正确方向的一步。\n\n## 什么是流程控制？\n\n简单来说，你可以使用流程控制语句来控制程序的方向或过程。与其简单地从上到下运行每一行和方法，你可以告诉程序在任何给定时刻访问哪些特定的内容。\n\
    \n你在上一章使用的 `if-else` 语句是使用布尔逻辑的流程控制示例。如果满足一个条件，将应用后续的方法。为了清晰起见，这里是 C# 中编写 `if-else`\
    \ 语句的正确语法：\n\n```csharp\nif (“在此处插入条件”)\n{\n    /* 如果满足条件，插入你想要运行的方法 */\n}\nelse\
    \ if (“在此处插入辅助条件”)\n{\n    /* 如果不满足第一个条件，可以使用 else if 检查另一个条件并运行其他方法 */\n}\nelse\n\
    {\n    /* 如果之前的所有条件都不满足，可以运行 else 语句；记住 else 语句是可选的 */\n}\n```\n\n除了 `if-else`\
    \ 语句外，在运行结果之前检查特定条件的更简单方法是使用三元运算符 (`?`)。使用此运算符，你可以根据条件返回的布尔值初始化另一个变量的值。使用此运算符的正确语法如下：\n\
    \n`<条件> ? <如果为真的结果> : <如果为假的结果>`\n\n例如，`if-else`：\n```csharp\nif (x != y)\n  \
    \  z = 1;\nelse\n    z = 2;\n```\n等于：\n`z = (x != y) ? 1 : 2;`\n\n在 C# 语言中，使用条件语句控制运行哪些代码行被称为分支。除了使用三元运算符和\
    \ `if-else` 语句外，你还可以使用 `switch` 语句来控制程序的运行。\n\n## Switch\n\n通过 `switch` 语句，你可以编写具有不同\
    \ case 的程序，这些 case 根据 `switch` 表达式中变量的值触发。以下是 `switch` 语句的样式：\n\n```csharp\nswitch\
    \ (“statement”)\n{\n    case 1: /* 如果 switch 变量等于 1，将发生什么 */\n        break;\n\
    \    case 2: /* 如果 switch 变量等于 2，将发生什么 */\n        break;\n    default: /* 如果\
    \ switch 变量不等于上述任何 case，将发生什么 */\n        break;\n}\n```\n\n同时请记住，你需要在每个 case\
    \ 结束操作的地方使用 `break`。否则，程序将继续执行剩余的 case，从而违背使用 `switch` 流程控制语句的目的。此外，注意 `default`\
    \ 等于 `if-else` 语句中的 `else` 语句。\n\n这是一个简单的示例，要求用户从给定范围内输入一个数字并给出相应的响应：\n\n```csharp\n\
    char x;\nConsole.WriteLine (“Insert a letter from A-C.”);\nx = Convert.ToChar(Console.ReadLine());\n\
    x = Char.ToUpper(x);\nswitch (x)\n{\n    case ‘A’:\n    {\n        Console.WriteLine\
    \ (“You put A.”);\n        break;\n    }\n    case ‘B’:\n    {\n        Console.WriteLine\
    \ (“You put B.”);\n        break;\n    }\n    case ‘C’:\n    {\n        Console.WriteLine\
    \ (“You put C.”);\n        break;\n    }\n    default:\n    {\n        Console.WriteLine\
    \ (“Invalid input.”);\n        break;\n    }\n}\n```\n\n注意，对于此示例，`x` 的字符输入在 `x\
    \ = Char.ToUpper(x);` 这一行被转换为大写。记住上述 `switch` 语句中的 case 只检查 `x` 的值是否为大写字母 A、B\
    \ 或 C 之一。如果用户在不先转换的情况下输入小写 a，case 语句将把用户引导到 `default` 方法。\n\n## 编写循环\n\n创建程序运行方式变化的另一种方法是使用循环。只要满足所需的条件，循环基本上会一直重复其内部的方法。循环还有一个特定的点，在该点会对条件进行更新和重新检查。一旦不再满足要求的条件，循环就会停止，应用程序将恢复。\n\
    \n### While 循环\n\n`while` 循环在运行包含的语句之前先测试条件。利用 `while` 循环的最简单方法是创建一个从 10 开始倒数的程序。它的编写方式如下：\n\
    \n```csharp\nint x = 10;\nwhile (x > 0)\n{\n    Console.WriteLine (x);\n}\n```\n\
    \n"
