  trans: "\n\n# 继承\n\n继承允许 `{category}` 聚集另一个类的成员。在下面的示例中，类 `sq` 继承自 `parallelogram`，用冒号表示。`parallelogram`\
    \ 随后成为 `sq` 的基类，而 `sq` 继而成为 `parallelogram` 的派生类。除了自身的成员外，`sq` 还获得了 `parallelogram`\
    \ 中所有可访问的成员，构造函数和析构函数除外。\n\n```csharp\n// 基类（父类）\nclass parallelogram {\n    public\
    \ int x = 10, y = 10;\n    public int GetArea() { return x * y; }\n}\n\n// 派生类（子类）\n\
    class sq : parallelogram { }\n```\n\nC# 中的类 只能继承自一个基类。如果没有指定基类，该类可以隐式地继承自 `System.Object`。因此，它是所有其他类的基础类。\n\
    \n```csharp\nclass parallelogram : System.Object {}\n```\n\nC# 内部包含一个统一的类型系统，所有知识类型直接或间接地继承自\
    \ `Object`。然而，这不仅适用于类，还适用于其他知识类型，如数组和简单类型。例如，`int` 关键字只是 `System.Int32` 结构体类型的别名。同样，`object`\
    \ 是 `System.Object` 类的别名。\n\n```csharp\nSystem.Object o = new object ();\n```\n\
    \n由于每个类型都继承自 `Object`，因此它们都共享一组典型的策略。其中一种方法是 `ToString`，它返回一个该对象的字符串说明。\n\n```csharp\n\
    System.Console.Write( o.ToString() );\n```\n\n# 强制转型和上转型\n\n在概念上，派生类可以是基类的特化化。这表明\
    \ `sq` 可以被合理地视为一个 `parallelogram`，同时也被视为一个 `Object`，并可以用于任何预期 `parallelogram`\
    \ 或 `Object` 的地方。如果创建了 `sq` 的关联实例，它将被强制转换为 `parallelogram`，因为派生类包含了基类中的所有内容。\n\
    \n```csharp\nSquare s = new sq ();\nparallelogram r = s;\n```\n\n该对象目前被视为 `parallelogram`，因此只能访问\
    \ `Rectangle` 的成员。一旦该项被强制转型为 `sq`，所有属于 `sq` 的特定成员仍然可以保留。这通常是因为 `parallelogram`\
    \ 仅包含了 `sq`，它没有在任何方法中修改 `sq` 对象。\n\n```csharp\nSquare s2 = (Square) r;\n```\n\n\
    强制转型必须显式创建，因为不允许将实际的 `parallelogram` 强制转换为 `sq`。\n\n```csharp\nRectangle r2 =\
    \ new parallelogram ();\nsq s3 = (Square) r2; // error\n```\n\n# Is 关键字\n\n有两种运算符用于在对对象进行强制转型时避免异常。首先是\
    \ `is` 运算符，如果左侧的对象可以实体化（类型转换）为正确的右侧类型，则它返回 `true`，且不会引发关联异常。\n\n```csharp\nRectangle\
    \ Q = new Square();\nif (q is sq.) // 条件为真\n```\n\n# As 关键字\n\n另一个用于避免对象强制转型异常的运算符是\
    \ `as` 运算符。该运算符提供了另一种编写精确实性检查的方法，其区别在于如果转换失败，引用将被置为 `null`。\n\n```csharp\nRectangle\
    \ r = new parallelogram ();\nSquare o = r as sq.; // 无效转换，返回 null\n```\n\n# 装箱\
    \ (Boxing)\n\nC# 的统一类型系统允许值类型的变量隐式地生成为项类别的引用类型。这种操作被称为装箱，一旦值被追踪到项，它就被视为引用类型。\n\
    \n```csharp\nint myInt = 5;\nobject myObj = myInt; // 装箱\n```\n\n# 解箱 (Unboxing)\n\
    \n装箱的反面是解箱。它将装箱的值转换为其原始类型的变量。解箱操作必须是显式的，因为如果项未解箱为正确的类型，可能会发生软件错误。\n\n```csharp\n\
    myInt = (int)myObj; // 解箱\n```\n\n# 第 12 章\n\n## 重新定义成员\n\n派生类中的成员将重新定义基类中的成员。这会对所有可继承成员产生深度影响，但它最常用于提供实例策略的新实现。为了传递方法的替换实现，在子类中重新定义该方法，使其签名与基类中的方法相同。签名包括名称、参数和方法的返回类型。\n\
    \n```csharp\nclass parallelogram {\n    int x, y = 10;\n    public int GetArea()\
    \ { return x * y; }\n}\nclass sq : parallelogram {\n    public int GetArea() {\
    \ return x * x; }\n}\n```\n\n## 隐藏成员\n\n取决于方法是否旨在覆盖还是重写（override）可继承的方法。默认情况下，新方法可以隐藏它，但编译器会提供警告，说明这种行为应该是显式指定的。为了消除警告，必须使用\
    \ `new` 修饰符。这指定了意图是覆盖可继承的方法并将其替换为新的实现。\n\n```csharp\nclass sq : parallelogram\
    \ {\n    public new int GetArea() { return x * x; }\n}\n```\n\n## 重写成员\n\n在方法被重写之前，应首先在基类中的方法上加上\
    \ `virtual` 修饰符。该修饰符允许方法在派生类中被重写。\n\n```csharp\nclass parallelogram {\n    int\
    \ x, y = 10;\n    public virtual int GetArea() { return x * y; }\n}\n```\n\n随后使用\
    \ `override` 修饰符来修改可继承方法的实现。\n\n```csharp\nclass sq : parallelogram {\n    public\
    \ override int GetArea() { return x * x; }\n}\n```\n\n## 隐藏与覆盖\n\n当 `sq` 强制转换为\
    \ `parallelogram` 时，显示了 `override` 和 `new` 之间的区别。如果使用 `new` 修饰符重新定义了方法，则允许访问在\
    \ `parallelogram` 中定义的先先隐藏的方法。相反，如果使用 `override` 修饰符重新定义方法，则转换仍然可以确定 `sq` 中定义的版本……基本上，`new`\
    \ 修饰符在类层级结构向下重新定义方法，而 `override` 则在层级结构中向上向下重新定义方法。\n\n# Sealed（密封）关键字\n\n为了防止已重写的方法在继承自派生类的类中被进一步重写，可以将方法声明为\
    \ `sealed` 以抵消 `virtual` 修饰符。\n\n```csharp\nclass MyClass { }\n```\n\n一个类可以被声明为\
    \ `sealed` 以阻止任何类继承它。\n\n# Base 关键字\n\n有一种方法可以访问即使被重新定义的父类方法。这通常通过使用 `base` 关键字引用基类实例来实现。无论方法是被隐藏还是被重写，都可以通过此关键字进行访问。\n\
    \n```csharp\nclass Triangle : parallelogram {\n    public override int GetArea()\
    \ { return base.GetArea()/2; }\n}\n```\n\n`base` 关键字可以从派生类构造函数调用基类构造函数。该关键字随后在构造函数体之前使用，并跟有冒号。\n\
    \n```csharp\nclass parallelogram {\n    int x, y = 10;\n    public Rectangle(int\
    \ a, int b) { }\n}\nclass sq : parallelogram {\n    public Square(int a) : base(a,a)\
    \ { }\n}\n```\n\n当派生类构造函数没有指向基类构造函数时，编译器可以机械插入对无参数基类构造函数的调用，以确保基类被正确创建。\n\n```csharp\n\
    class sq : parallelogram {\n    public Square(int a) // 隐式调用 base()\n}\n```\n\n\
    注意，如果基类包含一个无参数的构造函数，编译器就不会产生默认的无参数构造函数。因此，在派生类中构建构造函数时，如果没有精确匹配已定义的基类构造函数，会导致编译错误。\n\
    \n```csharp\nclass Base { public Base(int a) }\nclass Derived : Base // 编译错误\n\
    ```\n\n"
