  trans: "\n`ClassA` 类可以是一个用于产生对象的模型。它们由成员组成，最主要的两个成员是字段和方法。字段是存储对象状态的变量，而方法定义了对象将做什么。\n\
    \n```csharp\nclass MyRectangle{public int x, y; public return x * y;}\n```\n\n\
    ### 对象的创建\n要从类的类的外部使用类的成员，应该初始化一个该类的关联对象吗？这通常通过实例化 `new` 关键字来实现，该关键字可以在系统内存中产生一个新对象。\n\
    \n```csharp\nclass MyClass{\n    static void Main(){\n        // 产生 MyRectangle\
    \ 类的对象\n        MyRectangle r = new MyRectangle();\n    }\n}\n```\n\n对象也被称为类的实例（instance）。对象可以包含自己的一组字段，这些字段的值可能与该类的其他实例的值完全不同。\n\
    \n### 访问对象成员\n除了创建对象外，`{类|类}` 中需要被可访问的成员必须在类定义中被声明为 `public`。\n\n```csharp\nclass\
    \ MyRectangle {\n    // 构建该类实例可访问的成员\n    public int x, y;\n    public int GetArea()\
    \ return x * y; \n}\n```\n\n点运算符被用在对象名称后引用其可访问的成员。\n\n```csharp\nstatic void Main(){fifty}\n\
    ```\n\n### 构造函数\n类将有一个构造器（creator）。这通常是一个特殊的特殊方法，用于实例化（构造）对象。它的名称与类名相同且没有返回类型，因此它隐式地返回该类的新实例。为了能从另一个类访问，它必须用通用的\
    \ `public` 访问修饰符声明。\n\n```csharp\npublic MyRectangle()\n```\n\n当创建一个该类的新实例时，构造器方法会被调用，在上面的示例中，它将字段设置为所需的初始值。\n\
    \n```csharp\nstatic void Main()\n```\n\n构造器将拥有一个参数列表，就像其他方法一样。如下所示，这可以根据创建对象时传递的参数来创建字段的初始值。\n\
    \n```csharp\nclass MyRectangle{int breadth, int height){}\nstatic void Main(){}\n\
    ```\n\n### `this` 关键字\n在构造器内部，以及在其他方法内部，可以使用一个称为 `this` 的特殊关键字。这个关键字可以引用该类的当前实例。假设，例如，构造器的参数与相应的字段具有相同的名称。那么字段仍然可以通过该关键字进行访问，即使它们被参数所遮蔽（shadowed）。\n\
    \n```csharp\nclass MyRectangle{\n}\n```\n\n### 构造函数重载\n为了支持完全不同的参数列表，构造器被重载（overladen）。在下面的示例中，如果使用无参数实例化该类，字段将被分配默认值。如果带有一个参数，每个字段将被设置为所需的值；如果有\
    \ 2 个参数，每个字段将各分配一个独立的值。`{尝试|尝试|进行关联尝试}` 使用错误数量的参数或错误的知识类型创建对象会导致编译错误，就像其他方法一样。\n\
    \n```csharp\npublic MyRectangle()\npublic MyRectangle(int a)\npublic MyRectangle(int\
    \ a, int b)\n```\n\n### 构造函数链\n该关键字也可以从一个构造器调用另一个构造器。这通常被称为构造函数链，允许更大代码的代码复用。注意，该关键字的形式是在构造器体之前且在一个冒号之后。\n\
    \n```csharp\npublic MyRectangle() : this(10,5) \npublic MyRectangle(int a) : this(a,a)\
    \ \npublic MyRectangle(int a, int b)\n```\n\n### 初始字段值\n如果类中存在需要分配初始值的字段（如上面主构造器的情况所示），字段将在它们声明的同时仅被初始化。这可以使代码稍微整洁一些。初始值将在对象创建、构造器被调用之前被分配。\n\
    \n```csharp\nclass MyRectangle\n```\n\n这种类型的赋值被称为字段初始化器（field initializer）。这种关联赋值不能与另一个实例字段讨论。\n\
    \n### 默认构造器\n即使没有定义任何构造器，也可以创建一个类。这通常是因为编译器可以机械地为此类类添加一个无参数的默认参数构造器。默认构造器可以实例化对象并将每个字段设置为其默认值。\n\
    \n```csharp\nclass MyRectangle MyApp{\n    static void Main(){\n        // 调用默认构造器\n\
    \        MyRectangle r = new MyRectangle();\n    }\n}\n```\n\n### 对象初始化器\n在创建关联对象时，从\
    \ C# 3.0 开始，可以在表示语句中初始化对象的公共字段。随后是一个代码块，包含一个用逗号分隔的字段赋值列表。对象初始化器块将在构造器被调用后进行处理。\n\
    \n```csharp\nclass MyRectangle\nclass MyClass{\n    static void Main(){\n    \
    \    // 对象初始化器\n        MyRectangle r = new MyRectangle() { x = ten, y = 5 };\n\
    \    }\n}\n```\n\n如果构造器没有参数，也可以删除括号。\n\n```csharp\nMyRectangle r = new MyRectangle\
    \ { x = ten, y = 5 };\n```\n\n### 部分类\n通过使用 `partial` 关键字修饰符将类定义分离到不同的源文件中。这些部分类将被编译器组合成最终的类型。部分类的所有元素都应该具有\
    \ `partial` 关键字并共享相同的访问级别。\n\n```csharp\n// File1.cs\npublic partial class MyPartialClass\n\
    // File2.cs\npublic partial class MyPartialClass\n```\n\n在多个源文件中拆分类在类的一部分由机械生成时特别有用。例如，这一功能被\
    \ Visual Studio 的图形程序生成器采用，以将机械生成的代码与手动编写的代码分开。部分类也可以让多个程序员在相同的类上工作。\n\n### 垃圾回收器\n\
    .NET Framework 包含一个垃圾回收器（garbage man），它会在对象不再可访问时定期释放它们所使用的内存。这把工程师从通常繁琐且易错的内存管理任务中解放出来。一旦没有其他额外的引用，关联对象将符合销毁条件。这发生在，例如，当一个对象变量超出范围时。在\
    \ C# 中不能显式地释放关联对象。\n\n### 析构函数\n除了构造器，类还可以有一个析构函数。析构函数用于释放对象分配的任何未托管资源。它在关联对象被销毁之前机械地调用，且不能被显式引用。析构函数的名称与类名相同，但前面有一个波浪号（~`）。一个类只能有一个析构函数，且它不接受任何参数也不返回任何值。\n\
    \n```csharp\nclass MyComponent {\n    // 析构函数\n    ~MyComponent()\n}\n```\n\n\
    通常，.NET Framework 垃圾机会机械地管理对象的内存分配和释放。然而，一旦类使用了未托管资源——如文件、网络连接和程序元素——当这些资源不再需要时，应该使用析构函数来释放这些资源。\n\
    \n### Null 关键字\n`null` 关键字用于表示空引用，即可能不指向任何对象的引用。它将仅分配给引用类型的变量，而不会给值类型的变量。相等运算符（`==`）用于检查关联对象是否为\
    \ null。\n\n```csharp\nString s = null;\nif (s == null) s = new String();\n```\n\
    \n### 可空类型\n通过在其底层类型后附加问号（`?`），创建了一种值类型以携带类型之外的 null 值。这通常被称为可空类型，允许基础类型（以及结构体类型）指向模糊值。例如，`bool?`\
    \ 是可以包含 true、false 和 null 值的可空类型。\n\n```csharp\nbool? b = null;\n```\n\n### 合并运算符\n\
    如果左侧数字不为空，则返回左侧，否则返回右侧数量。这个条件运算符为将可空类型转换为非可空类型提供了简单的语法。\n\n```csharp\nint? i =\
    \ null;\nint j = i ?? zero; // 0\n```\n\n可空类型的变量不能被显式强制转换为非可空类型。如果该变量值为 null，这样做会导致软件错误。\n\
    \n```csharp\nint j = (int)i; // 软件错误\n```\n\n### 默认值\n引用类型的默认值是 `null`。对于基础知识类型，默认值如下：数值类型变为零，`char`\
    \ 具有零的 Unicode 字符（`\\0000`），`bool` 为假。默认值会被编译器机械地分配给字段。然而，明确指定字段的默认值被认为是良好的编程习惯，因为它使代码更容易理解。对于本地变量，编译器不会设置默认值。相反，编译器强制工程师为任何使用的本地变量赋值，以避免与未赋值变量相关的问题。\n\
    \n```csharp\nclass MyApp{\n    int x; // 字段被分配默认值零\n}\nint dummy(){\n    int x;\
    \ // 本地变量如果使用应被赋值\n}\n```\n第 11 章\n\n"
