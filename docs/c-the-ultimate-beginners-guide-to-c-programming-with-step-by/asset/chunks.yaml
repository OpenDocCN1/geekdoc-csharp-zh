    # Operators


    Operators are wont to operate on values. They will be filed into five types: arithmetic,
    assignment, and comparison, logical and bitwise operators.


    ## Arithmetic operators

    The arithmetic operators include the four basic arithmetic operations, also because
    the modulus operator (`%`) which is employed to get the division remainder.


    ```csharp

    float y = 2 + 2; // 4 // addition

    y = 5 - 2; // 3 // subtraction

    y = 2 * 2; // 6 // multiplication

    y = 3 / 2; // 1 // division

    y = 3 % 2; // 1 // modulus (division remainder)

    ```

    Notify that the division sign gives an incorrect result. This is often because
    it operates on two integer values and can, therefore, around the result and return
    an integer. To urge the right value, one among the numbers must be converted into
    a number.

    ```csharp

    x = 3 / (float) 2; // 1.5

    ```


    ## Assignment operators

    The second group is that the assignment operators. Most significantly, the assignment
    operator (`=`) itself, which assigns a worth to a variable.


    ## Combined assignment operators

    A common use of the assignment and arithmetic operators is to work on a variable
    then to save lots of the result back to that very same variable. These operations
    are often shortened with the combined assignment operators.

    ```csharp

    int x = 0;

    x += 5; // x = x+5;

    x -= 5; // x = x-5;

    x *= 5; // x = x*5;

    x /= 5; // x = x/5;

    x %= 5; // x = x%5;

    ```


    ## Increment and decrement operators

    Another normal operation is to increment or decrement a variable by one. This
    will be simplified with the increment (`++`) and decrement (`--`) operators.

    ```csharp

    x++; // x = x+1;

    x--; // x = x-1;

    ```

    Both of those operators are often used either before or after a variable.

    ```csharp

    x++; // post-increment

    x--; // post-decrement

    ++x; // pre-increment

    --x; // pre-decrement

    ```

    The result of the variable is the same whichever is employed. The difference is
    that the post-operator returns the first value before it changes the variable,
    while the pre-operator changes the variable first then return the worth.

    ```csharp

    x = 5; y = x++; // y=5, x=6

    x = 5; y = ++x; // y=6, x=6

    ```


    ## Comparison operators

    The comparison operators connect two values and return either true or false. They’re
    mainly wont to specify conditions, which are expressions that evaluate to either
    true or false.

    ```csharp

    bool x = (1 == 3); // false // adequate to

    x = (4 != 3); // true // not adequate to

    x = (3 > 4); // false // greater than

    x = (3 < 4); // true // but

    x = (3 >= 4); // false // greater than or adequate to

    x = (2 > 1) = 10 (2) // right shift

    x = ~4; // ~00000100 = 11111011 (-5) // invert

    ```

    These bitwise operators have shorthand assignment operators, a bit like the arithmetic
    operators.

    ```csharp

    int x = 5; x &= 5; // 101 & 100 = 100 (4) // and

    x=5; x |= 5; // 101 | 100 = 101 (5) // or

    x=5; x ^= 5; // 101 ^ 100 = 001 (1) // xor

    x=5; x > 1 = 10 (2) // right shift

    ```


    ## Operator precedents

    In C#, expressions are normally evaluated from left to right. However, when an
    expression contains multiple operators, the precedence of these operators decides
    the order during which they''re evaluated.


    | Pre | Operator | Pre | Operator |

    | :--- | :--- | :--- | :--- |

    | 1 | ++ -- ! ~ | 7 | & |

    | 2 | * / % | 8 | ^ |

    | 3 | + - | 9 | \| |

    | 4 | << >> | 10 | && |

    | 5 | < <= > >= | 11 | \| |

    | 6 | == != | 12 | = op= |


    For example, logical and (`&&`) binds weaker than relational operators, which
    successively bind weaker than arithmetic operators.

    ```csharp

    Bool x = 2 + 4 > 1 * 4 && 5 / 5 == 1; // true

    ```

    To make things clearer, parentheses are often wont to specify which a part of
    the expression is going to be evaluated first. Parentheses have the very best
    precedence of all operators.

    ```csharp

    Bool x = ((2 + 5) > (1 * 4)) && ((5 / 5) == 1); // true

    ```


    # Chapter 5


    ## String

    The string data type is employed to store string constants, which are delimited
    by a quotation marks.

    ```csharp

    String a = "Hello";

    ```


    ## String concatenation

    The sign is employed to mix two strings. It’s referred to as the concatenation
    operator (`+`) during this context. It also has an accompanying assignment operator
    (`+=`), which appends a string to a different and creates a replacement string.

    ```csharp

    String b = a + "World"; // Hello World

    b += "World"; // Hello World

    ```


    ## Escape characters

    A statement are often choppy across multiple lines, but a string constant must
    get on one line. So as to divide it, the string constant has got to first be break
    up using the concatenation operator.

    ```csharp

    String c = "Hello" + "World";

    ```

    To add new lines into the string itself, the escape character `\n` is employed.

    ```csharp

    String c = "Hello\nWorld";

    ```

    This backslash notation is employed to write down special characters, like the
    backslash itself or a double-quote. Among the special characters is additionally
    a Unicode character notation for writing any character.


    | Character | Meaning | Character | Meaning |

    | :--- | :--- | :--- | :--- |

    | \n | newline | \f | form feed |

    | \t | horizontal tab | \a | alert sound |

    | \v | vertical tab | \’ | single quote |

    | \b | backspace | \" | double quote |

    | \r | carriage return | \\ | backslash |

    | \0 | null character | \uFFFF | Unicode character (4-digit hex number) |


    Escape characters may be unheeded by adding associate degree “@” symbol before
    the string. This is often known as a verbatim string and might as an example be
    accustomed create file ways additional decipherable.

    ```csharp

    string e = "c:\\Windows\\System32\\cmd.exe";

    string f = @"c:\Windows\System32\cmd.exe";

    ```


    ## String compare

    The thanks to compare two strings is just by using the adequate to operator. This
    may not compare the memory addresses, as in another languages like Java.

    ```csharp

    bool c = (a == b); // true

    ```


    ## String members

    The string class features a lot of useful members. For, methods like `Replace`,
    `Insert` and take away. A crucial thing to notice is that there are not any methods
    for changing a string. Methods that appear to switch a string actually always
    return a totally new string. This is because the string class is immutable. The
    content of a string variable can''t be changed, unless the entire string is replaced.

    ```csharp

    string a = "String";

    string b = a.Replace("i", "o"); // Strong

    b = a.Insert(0, "My "); // My String

    b = a.Remove(0, 3); // ing

    b = a.Substring(0, 3); // Str

    b = a.ToUpper(); // STRING

    int i = a.Length; // 6

    ```


    ## StringBuilder class

    StringBuilder is a mutable string class. Because of the performance cost related
    to replacing a string, the StringBuilder class may be a better alternative when
    a string must be modified repeatedly.

    ```csharp

    System.Text.StringBuilder sb = new System.Text.StringBuilder("Hello");

    ```

    The class has several methods which will be wont to manipulate the particular
    content of a string, such as `Append`, `Remove` and `Insert`.

    ```csharp

    sb.Append(" World"); // Hello World

    sb.Remove(0, 6); // World

    sb.Insert(0, "Bye"); // Bye World

    ```

    To convert a StringBuilder object back to a daily string, the `ToString` method
    is employed.

    ```csharp

    string s = sb.ToString(); // Bye World

    ```


