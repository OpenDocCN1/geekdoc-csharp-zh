  trans: "\n\n![](img/Image00000.jpg)\n\n# C# 终极初学者指南：带分步指导与实战示例\nJames Herron\n\n\
    ## 目录\n- 引言\n- 第 1 章 Hello 好世界\n- 第 2 章 编译与运行\n- 第 3 章 变量\n- 第 4 章 运算符\n- 第 5\
    \ 章 字符串\n- 第 6 章 数组\n- 第 7 章 条件判断语句\n- 第 8 章 循环\n- 第 9 章 方法\n- 第 10 章 类\n- 第 11\
    \ 章 继承\n- 第 12 章 重定义成员\n- 第 13 章 访问级别\n- 第 14 章 静态\n- 第 15 章 属性\n- 第 16 章 索引器\n\
    - 第 17 章 接口\n- 第 18 章 抽象\n- 第 19 章 命名空间\n- 第 20 章 枚举\n- 第 21 章 异常处理\n- 第 22 章\
    \ 运算符重载\n- 第 23 章 自定义转换\n- 第 24 章 委托\n- 第 25 章 事件\n- 结论\n\n## 引言\nC# 编程语言是微软为\
    \ `.NET Framework` 设计的一种现代面向对象的语言。`C#`（读作“see sharp”）基于许多主流编程语言的简单特性构建。它结合了 `C++`\
    \ 的便利性和 `Visual Basic` 的简单性，同时也借鉴了 `Java` 的许多特性。这使得语言易于发现和使用，并且对错误具有鲁棒性，能够实现快速应用程序开发。与\
    \ `C++` 相比，这一切通常可以在不牺牲太多便利性或速度的情况下实现。\n\n在 2002 年发布后的几年里，`C#` 成为第三热门的编程语言——仅次\
    \ `Java` 和 `C/C++`——而且其人气一直在不断增长。它是一种通用编程语言，因此非常用于创建各种范围的程序。从小型工具到电脑游戏、桌面应用程序，或者可能是操作系统，通常都内置\
    \ `C#`。该语言还可以配合 `ASP.NET` 使用来基于 Web 的应用程序。\n\n在 `.NET` 中开发时，程序员对于使用哪种编程语言有很多选择。一些流行的\
    \ `.NET` 语言包括 `VB.NET`、`C++/CLI`、`F#` 和 `C#`。在这些，`C#` 通常是首选语言。与其他 `.NET` 语言一样，`C#`\
    \ 最初被编译为中间语言。这种语言被称为 `通用中间语言 (CIL)`，运行在 `.NET Framework` 上。因此，一个 `.NET` 程序将可以在任何安装了该框架的系统上执行。\n\
    \n`.NET Framework` 可能是一个具有标准执行引擎和高级类库的软件框架。它运行在 `Microsoft Windows` 上，因此仅用于编写\
    \ Windows 应用程序。然而，也有跨平台的版本可用，其中最大的两个是 `Mono` 和 `DotGNU`。它们都是开源项目，允许 `.NET` 应用程序运行在其他平台上，如\
    \ `Linux`、`Mac OS X` 和嵌入式系统。\n\n## 第 1 章：Hello World\n\n### 选择 IDE\n要开始编写 `C#`\
    \ 代码，你需要一个支持微软 `.NET Framework` 的集成开发环境 (IDE)。最受欢迎的选择是微软自己的 `Visual Studio`。\n\
    \n1. 该 IDE 还提供免费版本，一个名为 `Visual Studio Express` 的轻量版本，可以从微软网站下载。\n2. `C#` 语言自\
    \ 2002 年最初发布 `C# 1.0` 以来经历了多次更新。在编写本文时，`C# 5.0` 是 2012 年发布的当前版本。语言的每个版本都对应 `Visual\
    \ Studio` 的某个版本，因此为了使用 `C# 5.0` 的功能，你需要 `Visual Studio 2012` 或 `Visual Studio\
    \ Express 2012`。\n\n### 创建项目\n安装好 IDE 后，继续启动它。然后你需要创建一个项目，该项目可以管理 `C#` 源文件和其他资源。要显示“新建项目”窗口，在\
    \ `Visual Studio` 中访问 `文件` ➤ `新建` ➤ `项目`，或者在 `Visual Studio Express` 中访问 `文件`\
    \ ➤ `新建项目`。从那里，在左侧框架内选择 `Visual C#` 模板类型。然后在右侧框架内选择 `控制台应用程序` 模板。在窗口底部，你可以根据需要配置项目的名称和位置。完成后，点击\
    \ `确定`，项目向导将创建你的项目。\n\n你现在已经创建了一个 `C#` 项目。在解决方案管理器面板中（`视图` ➤ `解决方案管理器`）中，你会看到项目由一个\
    \ `C#` 源文件 `.cs` 组成，该文件应该已经打开了。如果没有打开，双击进入解决方案管理器以打开它。在源文件中，有一些基础代码帮助你开始。然而，为了在现阶段保持简单，请继续并将代码简化为如下形式。\n\
    \n```csharp\nclass MyApp{\n    static void Main (){}}\n```\n\n应用程序现在包含一个名为 `MyApp`\
    \ 的类别，其中包含一个空的 `Main` 方法，两者都由大括号界定。`Main` 方法是程序的入口，必须具有这种格式。大小写同样重要，因为 `C#` 是区分大小写的。大括号界定了属于某个代码实体（如类别或方法）的内容，并且它们必须包含。括号及其内容被称为代码块，或简称为块。\n\
    \n### Hello World\n正如学习任何新编程语言时一样，编写的主要程序是一个显示“Hello World”文本字符串的程序。这通常通过在 `Main`\
    \ 方法的大括号之间添加以下代码来实现。\n\n```csharp\nSystem.Console.WriteLine(\"Hello World\");\n\
    ```\n\n此行代码使用了 `WriteLine` 方法，该方法接受一个由双引号界定的字符串参数。该方法位于 `Console` 类中，该类属于 `System`\
    \ 命名空间。注意，点运算符 `.` 被用于访问命名空间和类的成员。该语句需要以分号结束，`C#` 中的所有语句都是如此。你的代码现在应该应该像这样：\n\n\
    ```csharp\nclass MyApp{\n    static void Main (){\n        System.Console.WriteLine(\
    \ \"Hello World\" );\n    }\n}\n```\n\n### IntelliSense\n在 `Visual Studio` 中编写代码时，当有多个预定义的替代方案供选择时，一个名为\
    \ `IntelliSense` 的窗口就会弹出。这个窗口非常有用，也可以通过按下 `Ctrl + Space` 手动调用。它让你能够快速访问程序中准备好使用的任何代码实体，包括\
    \ `.NET Framework` 的类和方法及其描述。这通常是一个非常强大的功能，你理应该学会如何良好使用。\n\n## 第 2 章：编译与运行\n\n"
- fmt: "\n# Compile and Run\n\nVisual Studio compilation with the Hello World program\
    \ completed, subsequent step is to compile and run it. To try to so open up the\
    \ `Debug` menu and choose `Start without Debugging`, or just press `Ctrl + F5`.\
    \ Visual Studio will then compile and run the appliance which displays the string\
    \ during a console window.\n\nThe reason why you are doing not want to settle\
    \ on the beginning `Debugging` command (`F5`) is because the console window will\
    \ then close as because the program has finished executing.\n\n```\nC:\\MySolution\\\
    MyProject>\\Windows\\Microsoft.NET\\Framework64\\v2.0.50727\\ csc.exe Program.cs\n\
    ```\n\n```\nC:\\MySolution\\MyProject> Program.exe Hello World\n```\n\nIf you\
    \ try running the compiled program it will display the same output as that built\
    \ by Visual Studio.\n\n# Comments\n\nComments are wont to insert notes into the\
    \ ASCII text file. C# uses the quality C++ comment notations, with both single-line\
    \ and multi-line comments. They’re meant only to reinforce the readability of\
    \ the ASCII text file and haven't any effect on the top program.\n\nThe single-line\
    \ comment begins with `//` and extends to the top of the road. The multi-line\
    \ comment may span multiple lines. It is delimited by `/*` and `*/`.\n\n```cpp\n\
    // single-line comment\n/* multi-line comment */\n```\n\nIn addition to the present,\
    \ there are two documentation comments. One single-line documentation comment\
    \ that starts with `///`, and one multi-line documentation comment that's delimited\
    \ by `/**` and `*/`. These comments are used when producing class documentation.\n\
    \n```csharp\n// Class level documentation.\nclass MyApp{\n    /** Program entry\
    \ point.\n    Command line arguments.*/*/\n    static void Main( string [] args){\n\
    \        System.Console.WriteLine( \"Hello World\" );\n    }\n}\n```\n\n# Chapter\
    \ 3: Variables\n\n## Variables\n\nVariables are used for storing data through\
    \ program execution.\n\n### Data types\n\nDepending on what data you would like\
    \ to store there are several different sorts of data types. The straightforward\
    \ types in C# contain four signed integer types and 4 unsigned, three floating-point\
    \ types also as `char` and `bool`.\n\n| Data Type | Size (bits) | Description\
    \ |\n| :--- | :--- | :--- |\n| `sbyte` | 8 | Signed integers |\n| `short` | 16\
    \ | |\n| `int` | 32 | |\n| `long` | 64 | |\n| `byte` | 8 | Unsigned integers |\n\
    | `ushort` | 16 | |\n| `uint` | 32 | |\n| `ulong` | 64 | |\n| `float` | 32 | Floating-point\
    \ numbers |\n| `double` | 64 | |\n| `decimal` | 128 | |\n| `char` | 16 | Unicode\
    \ character |\n| `bool` | 4 | Boolean value |\n\n### Declaration\n\nIn C#, a variable\
    \ must be declared (created) before it is often used. To declare a variable you\
    \ begin with the info type you would like it to carry followed by a variable name.\
    \ The name is often almost anything you would like, but it's an honest idea to\
    \ offer your variables names that are closely associated with the worth they're\
    \ going to hold.\n\n```csharp\nint myInt;\n```\n\n### Assignment\n\nA value is\
    \ assigned to the variable by using the sign, which is that the assignment operator\
    \ (`=`). The variable then becomes defined or initialized.\n\n```csharp\nintValue\
    \ = 100;\n```\n\nThe declaration and assignment are often combined into one statement.\n\
    \n```csharp\nint intValue = 100;\n```\n\nIf multiple variables of an equivalent\
    \ type are needed there's a shorthand way of declaring or defining them by using\
    \ the comma operator (`,`).\n\n```csharp\nint intValue = 100, intValue2= 200,\
    \ intValue3;\n```\n\nOnce a variable has been defined (declared and assigned)\
    \ it is often employed by referencing the variable’s name.\n\n```csharp\nSystem.Console.Write(intValue);\
    \ // 100\n```\n\n### Integer types\n\nThere are four signed integer types which\
    \ will be used counting on how large variety you would like the variable to carry.\n\
    \n```csharp\n// Signed integers\nsbyte intValue8 = 200; // -128 to +127\nshort\
