- fmt: "\n![](Image00000.jpg)\n\n# C# The Ultimate Beginners Guide to C# Programming\
    \ with Step by Step Guidance and Hands-On Examples\nJames Herron\n\n## Table Of\
    \ Contents\n- [Introduction](#\n- [Chapter 1 Hello World](#\n- [Chapter 2 Compile\
    \ and Run](#\n- [Chapter 3 Variables](#\n- [Chapter 4 Operators](#\n- [Chapter\
    \ 5 String](#\n- [Chapter 6 Arrays](#\n- [Chapter 7 Conditionals](#\n- [Chapter\
    \ 8 Loops](#\n- [Chapter 9 Methods](#\n- [Chapter 10 Class](#\n- [Chapter 11 Inheritance](#\n\
    - [Chapter 12 Redefining Members](#\n- [Chapter 13 Access Levels](#\n- [Chapter\
    \ 14 Static](#\n- [Chapter 15 Properties](#\n- [Chapter 16 Indexers](#\n- [Chapter\
    \ 17 Interface](#\n- [Chapter 18 Abstract](#\n- [Chapter 19 Namespaces](#\n- [Chapter\
    \ 20 Enum](#\n- [Chapter 21 Exception Handling](#\n- [Chapter 22 Operator Overloading](#\n\
    - [Chapter 23 Custom Conversions](#\n- [Chapter 24 Delegates](#\n- [Chapter 25\
    \ Events](#\n- [Conclusion](#\n\n## Introduction\nThe C# programing language is\
    \ a modern, object-oriented language designed by Microsoft for the `.NET Framework`.\
    \ `C#` (pronounced “see sharp”) builds upon a number of the simplest features\
    \ of the main programming languages. It combines the facility of `C++` with the\
    \ simplicity of `Visual Basic` and also borrows much from `Java`. This leads to\
    \ a language that's easy to find out and use, robust against errors that enable\
    \ rapid application development. All this is often achieved without sacrificing\
    \ much of the facility or speed, in comparison to `C++`.\n\nIn the years following\
    \ its release in 2002, `C#` has become the third hottest programing language –\
    \ after `Java` and `C/C++` – and its popularity keeps growing. It’s a general-purpose\
    \ programing language, so it's useful for creating a good range of programs. Everything\
    \ from small utilities to computer games, desktop applications, or maybe operating\
    \ systems are often inbuilt `C#`. The language also can be used with `ASP.NET`\
    \ to make web-based applications.\n\nWhen developing in `.NET`, programmers are\
    \ given a good range of choices on which programing language to use. A number\
    \ of the more popular `.NET` languages include `VB.NET`, `C++/CLI`, `F#`, and\
    \ `C#`. Among these, `C#` is usually the language of choice. Just like the other\
    \ `.NET` languages, `C#` is initially compiled to an intermediate language. This\
    \ language is named the `Common Intermediate Language (CIL)` and is run on the\
    \ `.NET Framework`. A `.NET` program will, therefore, be ready to execute on any\
    \ system that has that framework installed.\n\nThe `.NET Framework` may be a software\
    \ framework that has a standard execution engine and an upscale class library.\
    \ It runs on `Microsoft Windows` and is therefore only applied for writing Windows\
    \ applications. However, there also are cross-platform ports available, the 2\
    \ largest being `Mono` and `DotGNU`. these are both open source projects that\
    \ allows `.NET` applications to be run on other platforms, like `Linux`, `Mac\
    \ OS X`, and embedded systems.\n\n## Chapter 1: Hello World\n\n### Choosing an\
    \ IDE\nTo begin coding in `C#` you would like an Integrated Development Environment\
    \ (IDE) that supports the Microsoft `.NET Framework`. The foremost popular choice\
    \ is Microsoft’s own `Visual Studio`.\n\n1. This IDE is additionally available\
    \ for free of charge as a light-weight version called `Visual Studio Express`,\
    \ which may be downloaded from Microsoft’s website.\n2. The `C#` language has\
    \ undergone a variety of updates since the initial release of `C# 1.0` in 2002.\
    \ At the time of writing, `C# 5.0` is that the current version which was released\
    \ in 2012. Each version of the language communicates to a version of `Visual Studio`,\
    \ so In order to use the features of `C# 5.0`, you would like `Visual Studio 2012`\
    \ or `Visual Studio Express 2012`.\n\n### Creating a project\nAfter installing\
    \ the IDE, plow ahead and launch it. You then got to create a replacement project,\
    \ which can manage the `C#` source files and other resources. To display the New\
    \ Project window attend `File` ➤ `New` ➤ `Project` in `Visual Studio` or `File`\
    \ ➤ `New Project` in `Visual Studio Express`. From there select the `Visual C#`\
    \ template type within the left frame. Then select the `Console Application` template\
    \ within the right frame. At rock bottom of the window, you'll configure the name\
    \ and site of the project if you would like to. Once you are done click `OK` and\
    \ therefore the project wizard will create your project.\n\nYou have now created\
    \ a `C#` project. Within the Solution Explorer pane (`View` ➤ `Solution Explorer`)\
    \ you'll see that the project consists of one `C#` source file `.cs` that ought\
    \ to already be opened. If not, you'll double-click on enter the answer Explorer\
    \ so as to open it. Within the source file, there's some basic code to assist\
    \ you to start. However, to stay things simple at this stage plow ahead and simplify\
    \ the code into this.\n\n```csharp\nclass MyApp{\n    static void Main (){}}\n\
    ```\n\nThe application now consists of a category called `MyApp` containing an\
    \ empty `Main` method, both delimited by curly brackets. The most method is that\
    \ the entry point of the program and must have this format. The casing is additionally\
    \ important since `C#` is case-sensitive. The curly brackets delimit what belongs\
    \ to a code entity, like a category or method, and that they must be included.\
    \ The brackets, alongside their content, is mentioned as a code block, or simply\
    \ a block.\n\n### Hello World\nAs is common when learning a replacement programing\
    \ language the primary program to write down is one that displays a “Hello World”\
    \ text string. This is often accomplished by adding the subsequent line of code\
    \ between the curly brackets of the most method.\n\n```csharp\nSystem.Console.WriteLine(\"\
    Hello World\");\n```\n\nThis line of code uses the `WriteLine` method which accepts\
    \ one string parameter delimited by double-quotes. The tactic is found inside\
    \ the `Console` class, which belongs to the `System` namespace. Note that the\
    \ dot operator `.` is employed to access members of both namespaces and classes.\
    \ The statement needs end with a semicolon, as must all statements in `C#`. Your\
    \ code should now appear as if this.\n\n```csharp\nclass MyApp{\n    static void\
    \ Main (){\n        System.Console.WriteLine( \"Hello World\" );\n    }\n}\n```\n\
    \n### IntelliSense\nWhen writing code in `Visual Studio` a window called `IntelliSense`\
    \ will pop-up wherever there are multiple predetermined alternatives from which\
    \ to settle on. This window is incredibly useful and maybe mentioned manually\
    \ by pressing `Ctrl + Space`. It gives you quick access to any code entities you're\
    \ ready to use within your program, including the classes and methods of the `.NET\
    \ Framework` alongside their descriptions. This is often a really powerful feature\
    \ that you simply should learn to form good use.\n\n## Chapter 2: Compile and\
    \ Run\n"
