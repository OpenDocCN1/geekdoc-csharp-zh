    \ `public` 并具有与其要保护的字段相同的访问级别，随后是属性名称以及一个定义了 `get` 和 `set` 访问器的代码块。\n\n```csharp\n\
    class Time {\n    private int seconds;\n    public int sec {\n        get { return\
    \ seconds; }\n        set {}\n    }\n}\n```\n\n属性是以强制执行的方式进行量的，但其使用方式类似于字段。请注意\
    \ `value` 关键字对应于分配给属性的值。\n\n## 自动实现属性 (Auto-implemented properties)\n\n`get` 和\
    \ `set` 访问器直接对应字段的属性非常常见。因此，有一种编写此类属性的简写方法，即省略访问器代码块以及私有字段。这种语法在 C# 3.0 中引入，并命名为自动实现属性。\n\
    \n```csharp\nclass Time {}\n```\n\n## 属性的优势 (Property blessings)\n\n由于属性内部没有特殊的逻辑，它在功能上等同于一个公共字段。然而，作为一个一般原则，由于属性带来的各种优势，在实际编程中不应使用公共字段。\n\
    \n首先，属性允许技术人员更改属性的内部实现，而不会破坏任何使用该属性的程序。这对于可能被不同程序员使用的类通常具有特定的重要性。例如，在 `Time` 类中，字段的访问类型可能需要从\
    \ `int` 修改为 `computer memory unit`（计算机内存单元）。通过属性，这种转换可能在后台处理。然而，使用公共字段，更改发布类类的底层访问类型可能会破坏任何使用该类别的程序。\n\
    \n```csharp\nclass Time {\n    private computer memory unit seconds;\n    public\
    \ int sec {set}}\n}\n```\n\n属性的第二个优势是它们允许技术人员在允许修改之前验证信息。例如，可以防止 `seconds` 字段被分配负数值。\n\
    \n`属性` 并不非对应于实际字段。它们甚至可以拥有自己的值。信息甚至可以从类外部返回，例如从信息。同时，没有任何阻止技术人员在访问器中执行不同的操作，例如维护一个更新计数器。\n\
    \n```csharp\npublic int hour {\n    set {\n        seconds = value * 3600;\n \
    \       count++;\n    }\n}\nprivate int count\n```\n\n## 只读和只写属性 (Read-only and\
    \ write-only properties)\n\n访问器中的任何一个都可以被忽略。如果不包含 `set` 访问器，属性变为只读；如果不包含 `get`\
    \ 访问器，则属性即为只写。\n\n```csharp\n// 只读属性\npublic int sec {\n    public get { return\
    \ seconds; }\n}\n// 只写属性\npublic int sec {\n    public set\n}\n```\n\n## 属性访问级别\
    \ (Property access levels)\n\n访问器的访问级别可以被限制。例如，通过将 `set` 属性创建 `private set`。属性本身的访问级别也可以修改以限制每个访问器。默认情况下，访问器是\
    \ `public`，因此属性本身是 `private` 的。\n\n```csharp\nprivate int sec\n```\n\n# 第 16 章\n\
    \n## 索引器 (Indexers)\n\n索引器允许对象被处理为数组。它们以属性相同的方式声明，区别是使用了 `this` 关键字而不是名称，并且它们的访问器带有参数。在下面的示例中，技术工人（索引器）对应于一个名为\
    \ `knowledge` 的对象数组。\n\n```csharp\nclass MyArray {\n    object[] knowledge = new\
    \ object[10];\n    public object this[int i] {set}}\n}\n```\n\n`get` 访问器从数组中返回所需的部分，因此\
    \ `set` 访问器将值插入到所需的部分。通过在位置的索引器，该类的实例可以被创建并用作数组，每个元素用于引入和设置天气。\n\n```csharp\n\
    static void Main() {\n    object o = a[5];\n    Console.WriteLine(\"hi World\"\
    );\n}\n```\n\n## 索引器参数 (Indexer parameters)\n\n索引器的参数列表与方法相似，区别在于它应该至少有一个参数，且不允许使用\
    \ `ref` 或 `out` 修饰符。例如，如果有一个二维数组，列和行索引作为单独参数传递。\n\n```csharp\nclass MyArray {\n\
    \    object[,] knowledge = new object[10,10];\n    public object this[int i, int\
    \ j] {\n        get { return data[i,j]; } \n        set}}\n}\n```\n\n索引参数不必是整数类型。对象甚至可以作为索引参数传递。`get`\
    \ 访问器将用于返回找到传入对象的位置。\n\n```csharp\nclass MyArray {\n    object[] knowledge = new\
    \ object[10];\n    public int this[object o] {\n        get { return System.Array.IndexOf(data,\
    \ o); }\n    }}\n}\n```\n\n## 索引器重载 (Indexer overloading)\n\n这两项功能都可以通过重载索引器来提供。参数的类型和数量可以验证索引器如何被引用。\n\
    \n```csharp\nclass MyArray {\n    object[] knowledge = new object[10];\n    public\
    \ int this[object o] {\n        get { return System.Array.IndexOf(data, o); }\n\
    \    }\n    public object this[int i] {\n        get { return data[i]; } \n  \
    \      set}}\n}\n```\n\n请记住，在实际程序中，访问器内部应该包含范围检查，以避免因尝试访问数组长度之外而引起的异常。\n\n```csharp\n\
    public object this[int i] {\n    get { return (i >= 0 && i < knowledge.Length)\
    \ ? data[i] : null; }\n    set { if (i >= 0 && i < knowledge.Length) data[i] =\
    \ value; }\n}}\n```\n```\n\n# 第 17 章\n\n## 接口 (Interface)\n\n接口用于指定派生类应该实现的成员。它们用\
    \ `interface` 关键字概述，后面紧跟一个名称和一个代码块。它们的命名约定是以大字母“I”开头，因此每个单词首字母大写。\n\n```csharp\n\
    interface IMyInterface {}\n```\n\n## 接口签名 (Interface signatures)\n\n接口代码块将仅包含签名，只有方法、属性、索引器和事件。接口成员不能有任何实现。相反，它们的体被分号替换。它们同时不能有任何访问修饰符，因为接口成员始终是\
    \ `public`。\n\n```csharp\ninterface IMyInterface {\n    // 接口方法\n    int GetArea();\n\
    \    // 接口属性\n    int space;\n    // 接口索引器\n    int this[int index];\n    // 接口事件\n\
    \    event System.EventHandler MyEvent;\n}\n```\n\n##静态对象 Largest (IComparable\
    \ a, IComparable b)\n\n使用关联接口的第二个优势是为类提供关联接口，通过该接口可以使用类。这种关联接口定义了使用该类的程序员想要的功能。\n\
    \n```csharp\ninterface IMyClass {}\nclass MyClass : IMyClass {\n    public void\
    \ Hidden()\n}\n```\n\n程序员将通过此接口读取类的实例，通过将对象放入接口类型的变量中。\n\n```csharp\nIMyInterface\
    \ m = new MyClass();\n```\n\n这种抽象提供了两个边缘。首先，它让其他程序员更容易使用该类，因为他们目前只能访问与他们相关的成员。其次，它使得类更具活性，因为只要遵循接口，其实现就可以更改而不被使用该类的其他程序员察觉到。\n\
    \n"
