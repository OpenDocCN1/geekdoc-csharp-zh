  trans: "\n\n# 访问级别\n\n每个类的成员都有一个关联的访问级别，它决定了该成员在什么地方可见。在 C# 市场上共有 5 种访问级别：`public`、`protected`、`internal`、`protected\
    \ internal` 和 `private`。类成员的默认访问级别是 `non-public`（非公有）。\n\n## 私有访问\n无论访问级别如何，所有成员在声明的类内部都是可用的。这是非公有成员可以被访问的唯一地方。\n\
    \n```csharp\nclass MyBase {\n    // 无限制访问 \n    public int myPublic;\n    // 程序集或派生类\n\
    \    protected internal int myProtInt;\n    // 程序集内部\n    internal int myInternal;\n\
    \    // 类或派生类 \n    protected int myProtected;\n    // 仅限类内部私有\n    private int\
    \ myPrivate;\n    void Test()\n}\n```\n\n## 保护访问\n`protected` 成员可以在派生类中被访问，但从不同的类中无法访问。\n\
    \n```csharp\nclass Derived : MyBase {}\n```\n\n## 内部访问\n`internal` 成员可以在原生程序集的任何地方被访问，但不能从另一个程序集访问。在\
    \ .NET 中，关联的程序集可以是程序（`.exe`）或库（`.dll`）。\n\n```csharp\n// 程序集类\nAnyClass {}\n```\n\
    \n## 保护内部访问\n`protected internal` 访问意味着 `protected` 或 `internal` 之一。`protected\
    \ internal` 成员可以在此程序集的任何地方被访问，也可以在程序集外部派生自该类的类中访问。\n\n```csharp\n//不同的程序集类\nclass\
    \ Derived : MyBase {\n    void Test(MyBase m)\n}\n```\n\n## 公共访问\n`public` 访问提供了从成员被定义的任何地方进行无限制的访问。\n\
    \n```csharp\n//不同的程序集类\nAnyClass {}\n```\n\n## 顶层访问级别\n顶级成员可以是声明在其他类型之外的类型。在 C#\
    \ 中，后续类型将在顶层声明：`category`（类）、`interface`（接口）、`struct`（结构体）、`enum`（枚举）和 `delegate`（委托）。默认情况下，这些未包含的成员被赋予\
