  trans: "\n\n# 运算符重载\n\n运算符重载允许重新定义运算符，并在一个或多个操作数属于确切类型的地方使用它们。一旦正确完成，这可以修改代码并使自定义类型的使用变得像内置类型一样简单易用。\n\
    \n## 运算符重载示例\n\n在此示例中，有一个名为 `MyNum` 的类，它包含一个整数字段和一个用于设置该字段的构造函数。此外，还有一个静态的 `Add`\
    \ 方法，它可以将两个 `MyNum` 对象相加，并将结果作为一个全新的 `MyNum` 对象返回。\n\n```csharp\nclass MyNum {\n\
    \    public static MyNum Add(MyNum a, MyNum b) {\n        return new MyNum(a.val\
    \ + b.val);\n    }\n}\n```\n\n两个 `MyNum` 实例可以进一步利用 `Add` 方法。\n\n## 二元运算符重载\n\n\
    运算符重载的作用是更改这种语法，从而为类提供额外直观的接口。要将 `Add` 方法转换为加法运算符的重载方法，只需将名称替换为 `operator` 关键字，后跟跟要实现的运算符。关键字与运算符之间的空格可以忽略。请注意，为了使运算符重载方法生效，它必须声明为\
    \ `public` 和 `static`。\n\n```csharp\nclass MyNum {\n    public static MyNum operator\
    \ +(MyNum a, MyNum b) {}\n}\n```\n\n由于该类当前重载了加法运算符，该运算符就可以执行预期的计算。\n\n```csharp\n\
    MyNum a = new MyNum(10), b = new MyNum(5);\nMyNum c = a + b;\n```\n\n## 一元运算符重载\n\
    \n加可以是二元运算符，因为它接收两个操作数。要重载单元运算符（例如递增 `++`），则改用一个方法参数。\n\n```csharp\npublic static\
    \ MyNum operator ++(MyNum a)\n```\n\n注意，这可能会重载递增运算符的后置和前置版本。\n\n```csharp\nMyNum\
    \ a = new MyNum(10);\na++;\n++a;\n```\n\n## 返回类型和参数\n\n当重载单个运算符时，返回类型和参数类型应该是相同的类型。相反，一旦重载大多数二元运算符，返回类型可以是\
    \ `void` 以外的任何类型，且其中一个参数应该是相同的类型。这意味着可以对不同的方法参数来重载任何二元运算符，例如允许 `MyNum` 和 `int`\
    \ 进一步相加。\n\n```csharp\npublic static MyNum operator +(MyNum a, int b)\n```\n\n\
    C# 允许重载几乎所有的运算符，如下表所示。复合赋值运算符不能显式实现。相反，一旦其相应的算术或位运算符被实现，它们就会隐式实现。\n\n| 二元运算符 |\
    \ 一元运算符 | 不可重载的 |\n| :--- | :--- | :--- |\n| `+ - * /` | `+ -` | 无 |\n| `+= -=\
    \ *= /= %=` | `& | ^ << >>` | `&= |= ^= <<= >>==` |\n| `== != > < >= <=` | `!\
    \ ~ ++ --` | `true false` |\n| `&& \\|\\| =` | `( ): new as is typeof` | |\n\n\
    比较运算符，此外还有 `true` 和 `false`，应该成对实现。例如，重载等号运算符意味着不等于运算符也必须实现。\n\n## true 和 false\
    \ 运算符重载\n\n注意上表中的 `true` 和 `false` 被视为运算符。通过重载它们，类的对象可以在任何必须评估为布尔类型的条件语句中使用。一旦重载了它们，返回类型应该是\
    \ `bool`。\n\n```csharp\nclass MyNum {\n    public static bool operator true(MyNum\
    \ a) {\n        return (a.val != 0);\n    }\n    public static bool operator false(MyNum\
    \ a) {\n        return (a.val == 0);\n    }\n}\n```\n\n"
