    \ k++)\n```\n`for` loop has many variations. As associate degree example, the\
    \ first and third parameters square measure usually split into many statements\
    \ using the comma operator.\n```c\nfor (int k = 0, m = 5; k < 10; k++, m--)\n\
    ```\nThere is additionally the selection of exploit out one or additional of the\
    \ parameters. as an example , the third parameter might even be moved into the\
    \ body of the loop.\n```c\nfor (int k = 0; k < 10;)\n```\n\n## For each loop\n\
    `foreach` loop provides a straightforward because of repeat through arrays. At\
    \ every iteration resultant part inside the array is allotted to the specified\
    \ variable (the iterator) and thus the loop continues to execute till it's practiced\
    \ the complete array. Note that the iterator variable is read-only and will thus\
    \ not be used to amendment components inside the array.\n```c\nint [] a = { one,\
    \ 2, 3 };\nforeach (int n in a)\n```\n\n## Break and continue\nThere square measure\
    \ 2 special keywords which can be used within loops – `break` and `continue`.\
    \ The `break` keyword ends the loop structure, and `continue` skips the rest of\
    \ the current iteration and continues at the start of resultant iteration.\n```c\n\
    Finish for continue; // begin next iteration\n```\n"
