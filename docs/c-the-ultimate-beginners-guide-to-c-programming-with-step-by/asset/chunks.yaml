  trans: "\n\n# 方法\n\n方法是可重用的代码块，它们在已知后可以独立执行。\n\n## 定义方法\n方法定义通常在类内部创建，通过输入 `void`\
    \ 后跟方法名、一组括号和一个代码块来完成。`void` 关键字意味着该操作不会返回任何值。方法的命名规范与类相似——使用具有描述性的名称，且每个单词的首字母均大写。\n\
    \nC# 中的所有方法都应该属于一个类，这是可能编写语句的唯一地方。C# 没有在类之外界定方法策略的世界函数（全局函数）。\n\n## 调用方法\n上面的方法可以打印一条文本消息。要调用（执行）它，应该先通过\
    \ `new` 关键字创建一个 `MyApp` 类的实例。然后使用点操作符，通过实例名来访问其成员，其中包含 `MyPrint` 技术。\n\n```csharp\n\
    class MyApp {\n    void MyPrint() {\"Howdy World\"}\n}\n```\n\n## 方法参数\n方法名后的括号用于向方法传递参数。为了执行当前操作，相应的参数应该在方法定义内部，以类型之间由逗号分隔的变量声明列表的形式排列。\n\
    \n```csharp\nvoid MyPrint(string s1, string s2)\n```\n\n方法区域通常定义为需要各种类型的参数，它们可以具有任何数据类型。只需确保方法定义时具有相应的类型和数量的参数即可。\n\
    \n```csharp\nstatic void Main () {\"Hallo World\"}\n```\n\n准确来说，参数（parameters）出现在方法定义中，而参数（arguments）出现在方法调用中。然而，这两个术通常互换使用。\n\
    \n## params 关键字\n为了接受特定类型的可变数量参数，可以使用带有 `params` 修饰符的关联数组，它通常作为参数列表中最后一个参数添加。传递给方法的任何所需类型的后续参数都可以机械地存储在此数组中。\n\
    \n```csharp\nvoid MyPrint(params string[] s)\n```\n\n## 方法重载\n只要参数的类型或数量不同，就可以声明多个具有相同名称的方法。这通常被称为方法重载，例如在\
    \ `System.Console.Write` 技术的实现中就可以看到，它有十八个方法定义。这是一个强大的功能，允许我们处理各种参数，而不需要让技术人员记住完全不同的策略。\n\
    \n```csharp\nvoid MyPrint(string s)\nvoid MyPrint(int i)\n```\n\n## 可选参数\n从 C#\
    \ 4.0 开始，通过在方法声明中为参数提供默认值，通常将参数区域声明为可选。一旦调用方法，这些可选参数甚至可以省略以使用默认值。\n\n```csharp\n\
    class MyApp {\n    static void Main()\n}\n```\n\n## 命名参数\nC# 4.0 同时引入了命名参数，它允许通过其对应参数的名称传递关联参数。此功能通过允许按无顺序传递参数增强了可选参数的功能，而不是依赖于它们在参数列表中的位置。因此，任何可选参数区域通常允许不指定其之前的每个可选参数的值。然而，每个可选和需要的参数区域通常都是命名的，但命名参数应该放在未命名的参数之后。\n\
    \n```csharp\nstatic void Main() {seven}\n```\n\n## return 语句\n方法将返回一个值。`void`\
    \ 关键字被替换为方法可以返回的信息类型，因此 `return` 关键字被添加到方法体中并关联所需返回类型的参数。\n\n`return` 也是一个跳转语句，会导致方法退出并将值返回到调用方法的地方。例如，上面的\
    \ `Get Print` 技术通常作为关联参数传递给 `Write` 技术，因为该方法求值为字符串。\n\n```csharp\nstatic void\
    \ Main () {\"Hullo World\"}\n```\n\n`return` 语句也可以用于 void 方法，在到达最高代码块之前退出。\n\n\
    ```csharp\nvoid MyMethod ()\n```\n\n## 值类型和引用类型\nC# 中有两种数据类型：值类型和引用类型。值类型变量直接包含其数据，而引用类型变量持有对其对数据的引用。C#\
    \ 中的引用类型包括：`class`、`interface`、`array` 和 `delegate` 类型。值类型包括基础类型，连同结果的 `struct`、`enum`\
    \ 和 `nullable` 类型。引用类型变量通常通过 `new` 关键字创建，尽管并不总是必要的，例如 `string` 对象的例子。\n\n引用类型的变量通常被称为关联对象，尽管准确来说，问题在于该变量所引用的数据。对于引用类型，多个变量将引用相似的对象，因此通过一个变量执行的操作可能会对引用相似对象的其他变量产生影响。与之的是，对于值类型，每个变量都可以存储自己的值，对其中一个的操作不会影响另一个。\n\
    \n### 按值传递\n当传递值类型的参数时，传递的是变量的一个副本，因此如果副本被更改，将不会对主变量产生影响。\n\n```csharp\nvoid Set(int\
    \ i) \nstatic void Main() {\n    MyApp m = new MyApp();\n    int x = 0; // 值类型\n\
    \    m.Set(x); // 传递 x 的值\n    System.Console.Write(x); // zero\n}\n```\n\n###\
    \ 按引用传递\n对于引用类型，C# 使用真正的按引用传递。这意味着一旦传递引用类型，不仅可以更改它的状态，还可以交换整个对象并将修改传回主对象。\n\n\
    ```csharp\nvoid Set (int[] i) { } \nstatic void Main() {\n    MyApp m = new MyApp();\n\
    \    int[] y = { zero }; // 引用类型\n    m.Set(y); // 传递对象 \n    system .Console.Write(y[0]);\
    \ // ten\n}\n```\n\n### ref 关键字\n变量类型通常通过 `ref` 关键字传递引用，在调用者和方法声明处均使用。这可能导致变量按引用传递，从而动态地更新主值。\n\
    \n```csharp\nvoid Set(ref int i)\nstatic void Main() {\n    MyApp m = new MyApp();\n\
    \    int x = 0; // 值类型\n    m.Set(ref x); // 传递值类型的引用 \n    System.Console.Write(x);\
    \ // ten\n}\n```\n\n### out 关键字\n有时你需要按引用传递未赋值的关联变量并在方法中对其赋值。然而，直接使用未赋值的本地变量会导致编译时错误。在这种情况下，通常使用\
    \ `out` 关键字。它的行为与 ref 类似，但编译器允许使用未赋值的变量，并且它会强制你在方法内部实际设置该变量。\n\n第 10 章\n\n"
