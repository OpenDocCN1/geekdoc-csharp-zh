  trans: "\n\n# 摘要\n\n抽象类提供了一种部分实现，其他类可以基于此衍生。一旦一个类被声明为抽象，就意味着该类将包含不完整的成员，这些成员必须在派生类中强制执行具体的实现。\n\
    \n## 抽象成员\n任何需要实体的成员都可以声明为抽象——例如策略、属性和索引器。这些成员随后将留待实现，仅指定其签名，而体会被用分号替换。\n\n###\
    \ 抽象类的形式\n```csharp\npublic abstract class form {\n    public abstract int GetArea();\
    \ // 抽象属性\n    public abstract int space // 抽象训练工人\n    public abstract int this[int\
    \ index] // 抽象事件\n    public delegate void MyDelegate();\n    public abstract\
    \ event MyDelegate MyEvent; // 抽象分类\n    public abstract category InnerShape ;\n\
    }\n```\n\n### 抽象示例\n作为一个相关示例，下面的类有一个名为 `GetArea` 的相关抽象方法。\n\n```csharp\nabstract\
    \ category form {\n    int one hundred, y = 100; \n    public abstract int GetArea();\n\
    }\n```\n\n如果 `{a category}` 派生自这个抽象类，它将被强制重写抽象成员。这通常与 `virtual` 修饰符完全不同，后者指定该成员也是可以被重写的。\n\
    \n```csharp\nclass parallelogram: form { \n    come back x * y; \n}\n```\n\n派生类也可以被声明为抽象，在这种情况下，它不需要实现任何抽象成员。\n\
    \n抽象类 `parallelogram`: form 也是一个抽象类也可以继承自一个非抽象类。\n\n```csharp\nclass NonAbstract\
    \ Abstract: Non Abstract\n```\n\n如果底基类有虚成员，这些成员可以被重写为抽象，以强制任何派生类为它们提供新的实现。\n\n\
    ```csharp\nclass MyClass {\n    void virtual Dummy()\n}\nabstract category Abstract\
    \ : MyClass {\n    void abstract override Dummy()\n}\n```\n\n抽象类可以被用作接口来承载由派生类组成的对象。\n\
    `Shape s = new Rectangle();`\n\n实例化抽象类是不行的。尽管如此，抽象类可能拥有构造函数，这些构造函数通过 `bottom`\
    \ 关键字从派生类被感知。\n```csharp\nShape s = new form(); // 编译错误\n```\n\n## 抽象类与接口\n抽象类在许多方面类似于接口。它们各自都勾勒了派生类应该实现的成员签名，并且它们中的任何一个都不能实例化。主要的区别在于第一，抽象类将包含非抽象成员，而接口不能；第二，`{a\
    \ category}` 可以实现任何范围的接口，但仅继承自一个类，无论是抽象还是非抽象。\n\n```csharp\n// 定义默认实用性和定义 \nabstract\
    \ category form {\n    int one hundred, y = 100; \n    public abstract int GetArea();\n\
    }\nclass parallelogram : form // category 可以是一个 form\n\n// 定义相关接口或特定的实用性接口 \n\
    class MyClass : IComparable // category 可以被比较\n```\n\n抽象类即使作为一个非抽象类，也会扩展一个基类并实现任何范围的接口。然而，接口不能继承自类。尽管它会继承另一个接口，该接口实际上将两个接口合并为了一个。\n\
    \n# 第 19 章\n\n## 命名空间\n命名空间提供了将相关的排名成员聚类到层次结构的简单方法。它们还被用于避免命名冲突。一个排名成员（如类）如果不在命名空间内，则被认为属于默认命名空间。它可以通过在命名空间块中进行封装来移动到不同的命名空间。命名空间的命名规范与类相同，每个单词的首字母都大写。\n\
    \n```csharp\nnamespace MyNamespace {\n    class MyClass\n}\n```\n\n### 嵌套命名空间\n\
    命名空间可以嵌套任意深度的级别以勾勒命名空间层次结构。\n\n```csharp\nnamespace MyNamespace {\n    namespace\
    \ NestedNamespace {\n        class MyClass\n    }\n}\n```\n\n编写这种内容的快速方法通常是仅用点分隔命名空间。\n\
    ```csharp\nnamespace MyNamespace.NestedNamespace {\n    class MyClass\n}\n```\n\
    \n注意，在项目中的另一个类中再次声明相同的命名空间，其影响与每个命名空间都封装在同一个块内相似，尽管该类位于另一个代码文件中。\n\n### 命名空间访问\n\
    要从另一个命名空间访问一个类，必须指定其完全限定名。\n\n```csharp\nnamespace MyNamespace.NestedNamespace\
    \ {\n    public category MyClass\n}\nnamespace OtherNamespace {}\n```\n\n### using\
    \ 指令\n可以通过 `using` 指令结合命名空间来缩短完全限定名。该命名空间的成员随后可以在代码文件的任何地方访问，而无需在每个引用之前 le 加命名空间。必须将\
    \ `using` 指令位于代码文件中所有备用成员之前。\n\n```csharp\nusing MyNamespace.NestedNamespace;\n\
    ```\n\n直接访问这些成员意味着，如果当前命名空间内存在冲突的成员签名，则封装的命名空间内的成员将被隐藏。例如，如果 `OtherNamespace`\
    \ 中也有一个 `MyClass`，则该类将作为默认采用。若要使用封装的命名空间内的类，则必须再次指定完全限定名。\n\n```csharp\nusing\
    \ MyNamespace.NestedNamespace; \nnamespace MyNamespace.NestedNamespace {\n   \
    \ public category MyClass\n}\nnamespace OtherNamespace {\n    public category\
    \ MyClass\n}\n```\n\n要更改此引用，将修改 `using` 指令将命名空间分配给相关别名。\n\n```csharp\nusing MyAlias\
    \ = MyNamespace.NestedNamespace;\n// ...\nint x = MyAlias.MyClass.x;\n```\n\n\
    另一种更短的方法是通过使用类似的别名符号，将完全限定类名勾勒为代码文件的全新类型。\n\n```csharp\nusing MyType = MyNamespace.NestedNamespace.MyClass;\n\
    // ...\nint x = MyType.x;\n```\n\n# 第 20 章\n\n"
- fmt: "\n# Enum\n\nAn enumeration may be a special quite price sort consisting of\
    \ an inventory of named constants. To create one, the `enum` keyword is employed\
    \ followed by a reputation and a code block, containing a comma-separated list\
    \ of constant parts.\n\n```csharp\nenum State;\n```\n\nThis enumeration sort may\
    \ be accustomed produce variables which will hold these constants. To assign a\
    \ worth to the enum variable, the weather ar accessed from the enum as if they\
    \ were static members of a category.\n\n`State s = State.Run;`\n\n### Example\n\
    ```csharp\nEnum example\n```\n\nThe `switch` statement provides an honest example\
    \ of once associate enumeration may be helpful. Compared to victimization standard\
    \ constants, associate enumeration has the advantage of permitting the computer\
    \ user to obviously specify what constant values ar allowed. This provides compile-time\
    \ sort safety, and IntelliSense additionally makes the values easier to recollect.\n\
    \n```csharp\nswitch (s)\n```\n\n### Enum constant values\nThere is sometimes no\
    \ have to be compelled to recognize the particular constant values that the constants\
    \ represent, however generally it should be necessary. By default, the primary\
    \ part has the worth zero, and every sequential part has one price higher.\n\n\
    ```csharp\nenum State { three }; };\n```\n\nThese default values may be overridden\
    \ by assignment values to the constants. The values may be computed and don't\
    \ have to be distinctive.\n\n```csharp\nenum State { five }; };\n```\n\n### Enum\
    \ constant sort\nThe underlying variety of the constant parts is implicitly specified\
    \ as `int`, however this will be modified by employing a colon once the enumeration’s\
