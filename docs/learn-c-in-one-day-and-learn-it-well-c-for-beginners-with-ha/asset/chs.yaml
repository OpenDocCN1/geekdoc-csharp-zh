- "# 一天学会 C# 并精通它：带实战项目的 C# 初学者指南：一本让你立即开始 C# 编程的唯一书籍\n\n\n\n![](img/calibre_cover.jpg)\n\
  \n\n\n[`www.learncodingfast.com/csharp`](http://www.learncodingfast.com/csharp)\n\
  \n\n## 前言\n\n本书的目的是帮助你**快速**学习 C# 并**精通**地掌握它。\n\n本书不假设你具备任何编程背景。如果你是完全的初学者，你会发现这本书以易于理解的方式解释了复杂的概念。如果你是经验丰富的程序员但刚开始接触\
  \ C#，这本书将为你提供足够的深度，让你立即开始编写 C# 代码。\n\n书中的所有示例都经过仔细挑选，旨在演示每个概念，以便你对语言有更深入的理解。主题经过精心挑选，能让你广泛接触\
  \ C#，而不会让你陷入信息过载中。这些主题包括面向对象的编程概念、错误处理技术、文件处理技术等。\n\n此外，正如理查德·布莱森（Richard Branson）所说：“学习任何事情最好的方法就是实践。”本书包含一个项目，将引导你从零编写一个简单的薪资软件。该项目使用了书中涵盖的概念，并让你有机会看到它们是如何整合在一起的。\n\
  \n你可以在以下地址下载项目的源代码以及书中所有的示例程序：\n[`www.learncodingfast.com/csharp`](http://www.learncodingfast.com/csharp)\n\
  \n### 联系方式\n\n我非常乐意听到你的反馈。\n\n如有反馈或查询，你可以通过 jamie@learncodingfast.com 联系我。\n\n###\
  \ Jamie 的其他书籍\n\n![](img/00007.jpg)\n[Python：一天学会 Python 并精通](http://mybook.to/Python)\n\
  \n![](img/00006.jpg)\n[CSS：一天学会 CSS 并精通](http://mybook.to/CSS)\n\n## 附录 A – 项目答案\n\
  \n# 第 1 章：C# 简介\n\n欢迎学习 C# 编程，感谢你选择这本书！\n\n无论你是经验丰富的程序员还是完全初学者，这本书的编写都是为了帮助你快速学习\
  \ C# 编程。书主题经过精心挑选，旨在让你对 C# 有广泛的了解，同时不会让信息过载让你感到无从从。\n\n读完本书后，你应该能够毫无问题地编写自己的 C#\
  \ 程序。事实上，我们将在书末的项目中一起编写一个简单的薪资软件。准备好开始了吗？\n\n首先，让我们来回答几个问题：\n\n### 什么是 C#？\n\n`C#`（读作\
  \ C Sharp）是由 Anders Hejlsberg 领导的微软在 2000 年初开发的面向对象的编程语言。它是 .Net 框架的一部分，旨在成为一种简单的通用编程语言，用于开发不同类型的应用程序，包括控制台、窗口、Web\
  \ 和移动应用程序。\n\n与所有现代编程语言一样，`C#` 代码类似于计算机无法理解的英语。因此，`C#` 代码必须使用所谓的“编译器”（参见脚注）转换为机器语言。我们在本书书中将使用的编译器是微软提供的免费版\
  \ `Visual Studio Community 2015`。\n\n### 为什么要学习 C#？\n\n\n\n`C#` 的语法和特性与 `Java` 和\
  \ `C++` 等其他编程语言相似。因此，如果你有任何编程经验，你会发现学习 `C#` 是一件轻而易举的事。即使你对编程一无从，`C#` 的设计也易于学习（不像\
  \ `C` 或 `C++`），是一门非常棒的入门门语言。\n\n此外，`C#` 是 .Net 框架的一部分。该框架包含大型预写代码库，程序员可以使用这些代码，而不需要从头开始编写一切。这允许程序员在\
  \ `C#` 中快速开发应用程序，使得 `C#` 成为你在时间紧迫时工作的理想语言。\n\n最后，`C#` 是一门面向对象编程 (`OOP`) 的语言。面向对象编程是一种将问题分解为相互作用的对象的方法。一旦你掌握了\
  \ `C#`，你就能熟悉这些概念，这将使你将来更容易地掌握其他面向对象的编程语言。\n\n脚注：将 `C#` 程序转换为机器语言实际上要稍微复杂一些。Visual\
  \ Studio Community 仅仅将 `C#` 程序转换为 `MIL`，代表微软中间语言（Microsoft Intermediate Language）。这些\
  \ `MIL` 代码然后由一个称为通用语言运行时（Common Language Runtime）的虚拟执行系统转换为机器语言。更多信息，请检查 `https://msdn.microsoft.com/en-us/library/z1zx92`。尽管如此，对于我们的目的，不需要了解这些复杂的细节来编写自己的\
  \ `C#` 程序。\n\n# 第 2 章：为 C# 做好准备\n\n### 安装 Studio Community\n\n在开始用 `C#` 开发应用程序之前，我们需要下载\
  \ `Visual Studio Community`。正如第 1 章提到的，`Visual Studio Community` (`VSC`) 是微软提供的一个免费编译器。事实上，`VSC`\
  \ 不仅仅是一个编译器。它是一个集成开发环境 (`IDE`)，包含一个用于编写代码的文本编辑器和一个帮助我们识别编程错误的调试器。\n\n要下载 `VSC`，请访问\
  \ `https://www.visualstudio.com/en-us/products/visual-studio-community`。\n\n![](img/00004.jpg)\n\
  \n点击 `Download Community 2015` 下载文件。下载完成后，双击安装 `VSC`。安装后，系统将提示你重启电脑。重启电脑后，你就可以开始编写你的第一个\
  \ `C#` 程序了。\n\n### 你的第一个 C# 程序\n\n为了编写我们的第一个程序，让我们在桌面上创建一个文件夹并将其命名为 `C# Projects`。我们将所有的\
  \ `C#` 项目都保存在这个文件夹中。\n\n接下来，启动 `VSC` 并选择 `File` > `New` > `Project…`（如果你找不到 `VSC`，可能需要搜索\
  \ `Visual Studio 2015`）。我们将编写的第一个程序是控制台应用程序。控制台应用程序指的是没有图形用户界面的程序。\n\n在新建项目对话框中，选择左侧的\
  \ `Visual C# > Windows`，并在主框中选择 `Console Application`。将此程序命名为 `HelloWorld` 并将其保存到之前创建的\
  \ `C# Projects` 文件夹中。你可以使用 `Browse…` 按钮浏览到正确的文件夹。最后，点击 `OK` 创建项目。\n\n![](img/00003.jpg)\n\
  \n你将看到 `VSC` 为你自动创建默认模板。将模板中的代码替换为下面的代码。注意，添加行号仅供参考，不属于实际代码的一部分。由于大多数移动设备的屏幕较小，如果你在\
  \ Kindle、平板电脑或手机上查看，代码可能会看起来很乱。如果你在阅读代码时遇到困难，可以尝试将屏幕切换到横屏模式。或者，你可以从 `http://www.learncodingfast.com/csharp`\
  \ 下载此示例以及书中所有其他示例程序的源代码。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
  \ HelloWorld\n{\n    // 显示 Hello World 的简单程序\n    class Program\n    {\n       \
  \ static void Main(string[] args)\n        {\n            Console.WriteLine(\"Hello\
  \ World\");\n            Console.Read();\n        }\n    }\n}\n```\n\n我强烈建议你自己手动输入代码，以更好地感受\
  \ `VSC` 的工作原理。在你输入时，你会注意到光标附近偶尔会弹出一个框，显示一些帮助信息。这被称为 IntelliSense（智能感）。例如，当你在 `Console`\
  \ 后面输入一个点 (`.`) 时，会弹出一个列表，让你知道点之后可以输入什么。这是 `VSC` 帮助程序员更轻松编程的特性之一。\n\n输入完成后，你可以通过点击顶部菜单上的\
  \ `Start` 按钮来执行此程序（参见下图）。\n\n![](img/00005.jpg)\n\n如果你的程序运行失败，`VSC` 将在 `Output Window`（输出窗口）中通知你错误。双击错误会将光标移动到错误所在的位置。对比你的代码与上面的代码以纠正错误并再次运行程序。\n\
  \n\n\n\n如果一切顺利且你的程序运行成功，将出现一个黑窗口，上面有白色的“Hello World”。这个黑窗口被称为控制台。按 `Enter` 关闭窗口。\n\
  \n就这样！你已经成功编写了你的第一个程序。拍拍鼓励自己吧。\n\n如果你现在导航到你的“C# Projects”文件夹，你会发现一个名为“HelloWorld”的文件夹。在文件夹中，你会找到另一个“HelloWorld”文件夹和一个\
  \ `HelloWorld.sln` 文件。这个 `.sln` 文件是解决方案文件。每当你需要重新打开项目时，都要打开这个文件。如果打开解决方案文件时文本编辑器没有显示你的代码，只需双击右侧“解决方案管理器”（Solution\
  \ Explorer）（参考之前的图片）中的 `Program.cs` 文件即可打开它。\n\n你的代码的可执行文件（`.exe`）可以在 `HelloWorld\
  \ > HelloWorld > bin > Debug` 文件夹中找到。\n\n## C 程序的基本结构\n\n现在，让我们快速回顾一下你刚刚编写的基础程序。\n\
  \n### 指令\n\n从第 1 行到第 5 行，我们有几个以单词 `using` 开头的语句。这些语句被称为指令。它们告诉编译器我们的程序使用了某个命名空间。\n\
  \n例如，第一行\n\n```cs\nusing System;\n```\n\n告诉编译器我们的程序使用了 `System` 命名空间。\n\n### 命名空间\n\
  \n命名空间简单来说相关代码元素的分组。这些元素包括类、接口、枚举和结构体等（我们将在后续章节中介绍这些每个元素）。\n\nC# 带有大量的预写代码，它们被组织在不同的命名空间中。`System`\
  \ 命名空间允许让我们与用户交互的方法代码。我们在程序使用了其中两个方法——`WriteLine()` 和 `Read()` 方法。其他命名空间在我们的程序中不需要。但是，由于这些命名空间包含在默认模板中，我们将它们留在代码中。\n\
  \n除了 Microsoft 提供的预写命名空间外，我们也可以声明自己的命名空间。\n\n声明命名空间的一个优势是可以防止命名冲突。只要属于不同的命名空间，两个或多个代码元素可以同名。例如，下面的代码定义了两个命名空间，它们都包含一个名为\
  \ `MyClass` 的类。这在 C# 中是被允许的，因为这两个类属于不同的命名空间（`First` 和 `Second`）。\n\n```cs\nnamespace\
  \ First\n{\n    class MyClass\n    {\n    }\n}\n\nnamespace Second\n{\n    class\
  \ MyClass\n    {\n    }\n}\n```\n\n在我们的示例中，我们声明了一个命名空间——`HelloWorld`。\n\n`HelloWorld`\
  \ 命名空间从第 7 行开始，第 8 行有一个左大括号。它在第 20 行用右大括号结束。大括号在 C# 中被广泛用于表示代码元素的开始和结束。C# 中的所有左大括号必须用相应的右大括号关闭。\n\
  \n在 `HelloWorld` 命名空间内，我们有 `Program` 类，它从第 12 行开始到第 19 行结束。在 `Program` 类中，我们有 `Main()`\
  \ 方法，它从第 14 行开始到第 18 行结束。\n\n## Main() 方法\n\n`Main()` 方法是所有 C# 控制台应用程序的入口点。（注：原文此处存在大量重复句子，翻译已保留核心含义说明）。\n\
  \n在我们的示例中，我们声明了一个命名空间——`HelloWorld`。\n\n\n\n\n\n`double` 是 C# 中默认的浮点数据类型。换句话说，如果你写一个像\
  \ 2.34 的数字，C# 默认会将其处理为 `double`。\n\n### decimal\n`decimal` 存储小数，但其范围比 `float` 和\
  \ `double` 小。然而，它的精度得多，大约有 28-29 位数字。\n\n如果你的程序在存储非整数时需要极高的精度，你应该使用 `decimal` 数据类型。例如，当你编写一个对精度非常重要的金融应用程序时。\n\
  \n### char\n`char` 代表字符（character），用于存储单个 Unicode 字符，如 ‘A’、‘%’、‘‘p’ 等。\n\n### bool\n\
  `bool` 代表布尔值（boolean），只能包含两个值：`true` 和 `false`。它通常用于控制流语句。我们将在第 6 章介绍控制流语句。\n\n\
  ### 变量命名\nC# 中的变量名只能包含字母、数字或下划线（`_`）。但是，第一个字符不能是数字。因此，你可以将变量命名为 `userName`、`user_name`\
  \ 或 `userName2`，但不能是 `2userName`。\n\n此外，还有一些保留字不能作为变量名，因为它们在 C# 中已经有了预定义的含义。这些保留字包括\
  \ `Console`、`if`、`while` 等词。我们将在随后的章节中学习每一个词。\n\n最后，变量名是区分大小写的。`username` 和 `userName`\
  \ 是不同的。\n\n在 C# 中命名变量时有两种惯例。我们可以使用驼峰命名法（camel case），也可以使用下划线。驼峰命名法是使用混合大小写来编写复合词，除了第一个单词外，每个单词的首字母都大写（例如\
  \ `thisIsAVariableName`）。这是我们在本书书中其余部分将使用的约定。或者，另一种常见的做法是使用下划线（`_`）来分隔单词。如果你愿意，可以这样命名变量：`this_is_a_variable_name`。\n\
  \n### 变量初始化\n每当你声明一个新变量时，都需要给它赋赋一个初始值。这被称为初始化变量。你之后可以在程序中更改变量的值。\n\n初始化变量有两种方法。你可以在声明时初始化，也可以在单独的语句中初始化。\n\
  \n下面的示例展示了如何在声明点时初始化变量：\n\n### 示例 1\n这些示例展示了如何初始化 `byte` 和 `int` 变量。\n\n```c\nbyte\
  \ userAge = 20;\nint numberOfEmployees = 510;\n```\n由于 `byte` 和 `int` 用于没有小数位的数据，如果你编写类似下面的代码，将会得到错误：\n\
  \n```c\nbyte userAge2 = 20.0;\n```\n在 C# 中，20.0 不等于 20。\n\n### 示例 2\n接下来的示例展示了如何用整数初始化\
  \ `double`、`float` 和 `decimal` 变量。虽然这些数据类型用于带有小数部分的数字，但我们也可以像下面所示使用它们来存储整数。\n\n\
  ```c\ndouble intNumberOfHours = 5120;\nfloat intHourlyRate = 60;\ndecimal intIncome\
  \ = 25399;\n```\n\n### 示例 3\n下面的示例展示了如何用非整数初始化 `double`、`float` 和 `decimal` 变量。\n\
  \n```c\ndouble numberOfHours = 5120.5;\nfloat hourlyRate = 60.5f;\ndecimal income\
  \ = 25399.65m;\n```\n如前所述，带小数数字的默认数据类型是 `double`。\n\n因此，在上面的示例中，当你初始化 `hourlyRate`\
  \ 时，需要在 60.5 之后添加后缀 ‘f’，以明确告诉编译器将 60.5 转换为 `float`。\n\n同样，当你初始化 `income` 时，需要添加后缀\
  \ ‘m’ 将 25399.65 转换为 `decimal` 数据类型。\n\n### 示例 4\n`char` 数据类型只能包含单个字符。当我们初始化 `char`\
  \ 变量时，需要将该字符括在单引号中。例如：\n\n```c\nchar grade = ‘A’;\n```\n\n### 示例 5\n`bool` 变量只能是\
  \ `true` 或 `false`。下面的示例展示了如何初始化 `bool` 变量。\n\n```c\nbool promote = true;\n```\n\
  \n### 示例 6\n除了单独初始化变量外，只要它们属于相同的数据类型，你还可以在同一个语句中初始化多个变量。以下示例展示了如何这样做。注意两个变量之间用逗号分隔，语句以分号结束。\n\
  \n```c\nbyte level = 2, userExperience = 5;\n```\n上面的六个示例展示了如何在声明点时初始化变量。或者，你可以选择在单独的语句中初始化变量。下例所示：\n\
  \n```csharp\nbyte year; //声明变量\nyear = 20; //初始化它\n```\n\n### 赋值符号\n编程中的 `=` 符号与我们在数学中学习的\
  \ `=` 符号含义不同。在编程中，`=` 符号被称为赋值符号。这意味着我们是将 `=` 符号右侧的值赋值给左侧的变量。理解 `year = 20` 这样的语句的一种良好方法是将其视为\
  \ `year <- 20`。\n\n在编程中，语句 `x = y` 是不同的。### 基础运算符\n除了给变量赋值初始值或将另一个变量赋值给它，我们对变量执行通常操作。C#\
  \ 中的基础运算符包括 `+`、`-`、`*`、`/` 和 `%`，分别代表加、减、乘、除和取模。\n\n#### 示例\n假设 x = 7, y = 2\n\n\
  加法：x + y = 9\n减法：x - y = 5\n乘法：x*y = 14\n除法：x/y = 3（将答案向下取整到整数）\n取模：x%y = 1（7 除以\
  \ 2 的余数）\n\n在 C# 中，如果 `x` 和 `y` 都是整数，除法得到整数答案。然而，如果 `x` 或 `y` 中有一个是非整数，我们将得到非整数答案。例如：\n\
  \n```7 / 2 = 3\n7.0 / 2 = 3.5\n7 / 2.0 = 3.5\n7.0 / 2.0 = 3.5\n```\n在第一情况下，整数除以另一个整数，得到整数答案。答案的小数部分（如果有）会被截断。因此，我们得到\
  \ 3 而不是 3.5。\n\n在所有其他情况下，由于一个操作数是非整数，结果是非整数。\n\n### 更多赋值运算符\n除了 `=` 符号外，C#（以及大多数编程语言）还有一些赋值运算符。这些包括像\
  \ `+=`、`-=` 和 `*=` 这样的运算符。\n\n假设我们有一个变量 `x`，初始值为 10。如果我们想让 `x` 加 2，我们可以写：\n\n```c\n\
  x = x + 2;\n```\n程序将首先求值右侧表达式（`x + 2`），并将赋值给左侧。所以最终上面的语句变为 `x <- 12`。\n\n与其写 `x\
  \ = x + 2`，我们也可以写 `x += 2` 来表达相同的含义。`+=` 符号实际上是赋值符号与加法运算符的简写。因此，`x += 2` 意味着 `x\
  \ = x + 2`。\n\n同样，如果我们想做减法，可以写 `x = x - 2` 或 `x -= 2`。这种方法对于上述章节提到的所有 5 个运算符都适用。\n\
  \n\n\n\n\n大多数编程语言也拥有 `++` 和 `--` 运算符。`++` 运算符用于你想将变量的值增加 1 时。例如，假设\n\n```\nint x\
  \ = 2;\n```\n\n如果你写\n\n```\nx++;\n```\n\n`x` 的值就会变为 3。\n\n当使用 `++` 运算符时，不需要使用 `=`\
  \ 符号。语句 `x++;` 等同于\n\n```\nx = x + 1;\n```\n\n`++` 运算符可以放在变量名的前面，也可以放在变量名的后面。这会影响任务执行的顺序。\n\
  \n假设我们有一个名为 `counter` 的整数。如果我们写\n\n```\nConsole.WriteLine(counter++);\n```\n\n程序会先打印\
  \ `counter` 的原始值，然后再将 `counter` 增加 1。换句话说，它按照以下顺序执行任务：\n\n```\nConsole.WriteLine(counter);\n\
  counter = counter + 1;\n```\n\n相反，如果我们写\n\n```\nConsole.WriteLine(++counter);\n\
  ```\n\n程序会先将 `counter` 增加 1，然后再打印 `counter` 的新值。换句话说，它按照以下顺序执行任务：\n\n```\ncounter\
  \ = counter + 1;\nConsole.WriteLine(counter);\n```\n\n除了 `++` 运算符外，我们还有 `--` 运算符（两个减号）。该运算符将变量的值减少\
  \ 1。\n\n## C# 中的类型转换\n\n有时在我们的程序中，我们需要从一种数据类型转换为另一种数据类型，例如从 `double` 转换为 `int`。这被称为类型转换（Type\
  \ Casting）。\n\n要将一种数值数据类型转换为另一种，我们只需要在想要转换的数据前面加上 `(new data type)` 即可。\n\n例如，我们可以这样将非整数转换为整数：\n\
  \n```\nint x = (int) 20.9;\n```\n\n当我们把 20.9 转换为整数时，得到的值是 20，而不是 21。小数部分在转换后被截断了。\n\
  \n我们还可以将 `double` 转换为 `float` 或 `decimal`。还记得我们之前提到过在 C# 中，所有非整数默认被处理为 `double`\
  \ 吗？如果我们想将像 20.9 这样的数字赋值给 `float` 或 `decimal`，我们需要分别添加 `f` 和 `m` 后缀。另一种方法是使用强制转换，如下所示：\n\
  \n```\nfloat num1 = (float) 20.9;\ndecimal num2 = (decimal) 20.9;\n```\n\n`num1`\
  \ 和 `num2` 的值都将是 20.9。\n\n除了数值类型之间的转换外，我们还可以进行其他类型的转换。我们将在后续章节中探索这些转换。\n\n# 第 4\
  \ 章：数组、字符串和列表\n\n在上一章中，我们涵盖了 C# 中常用的一些基础数据类型。除了这些基础数据类型外，C# 还提供了一些高级数据类型。在本章中，我们将涵盖三种高级数据类型：数组、字符串和列表。此外，我们将讨论值数据类型（value\
  \ data type）和引用数据类型（reference data type）之间的区别。\n\n### 数组\n\n数组简单来说是相互相关的数据集合。假设我们要存储\
  \ 5 个用户的年龄。与其将它们存储为 `user1Age`、`user2Age`、`user3Age`、`user4Age` 和 `user5Age`，我们可以将它们存储为一个数组。\n\
  \n数组可以这样声明并初始化：\n\n```\nint[] userAge = {21, 22, 23, 24, 25};\n```\n\n- `int` 表示该变量存储\
  \ `int` 类型的值。\n- `[]` 表示该变量是一个数组，而不是普通变量。\n- `userAge` 是数组的名称。\n- `{21, 22, 23,\
  \ 24, 25}` 是数组存储的五个整数。\n\n除了在声明处声明并初始化数组外，我们还可以先声明数组稍后初始化它。为此，我们需要使用 `new` 运算符：\n\
  \n```\nint[] userAge = new int[5];\nuserAge = new [] {21, 22, 23, 24, 25};\n```\n\
  \n第一条语句声明并创建了一个存储 5 个整数的数组。第二条语句初始化了该数组。\n\n数组中的单个值可以通过它们的索引（indexes）访问，索引始终从零 开始，而不是从\
  \ 1。这是几乎所有编程语言（如 Python 和 Java）的共同做法。数组的第一个值的索引为 0，下一个索引为 1，依此类推。\n\n如果我们输入\n\n\
  ```\nConsole.WriteLine(userAge[0]);\n```\n\n屏幕上将显示值“21”。\n\n如果我们输入\n\n```\nuserAge[2]\
  \ = userAge[2] + 20;\n```\n\n数组变成了 `{21, 22, 43, 24, 25}`。也就是说，第三个元素被加了 20。\n\n\
  ### 数组属性和方法\n\nC# 提供了许多我们可以与数组一起使用的属性（properties）和方法（methods）。\n\n我们将在第 7 章讨论类时学习更多关于属性和方法的知识。现在，我们只需要知道，要使用属性或方法，我们需要使用点（`.`）运算符。要使用属性，我们在点之后输入属性名。\n\
  \n### Length\n\n数组的 `Length` 属性告诉我们项目的数量。例如，如果我们有\n\n```\nint[] userAge = {21, 22,\
  \ 23, 24, 25};\n```\n\n`userAge.Length` 是 5。\n\n#### Copy\n\n`Copy()` 方法允许我们将从一个数组复制到另一个数组。例如，如果我们有\n\
  \n```\nint[] source = {12, 5, -2, 16, 14};\nint[] dest = new int[3];\n```\n\n我们可以使用\
  \ `Array.Copy(source, dest, 3);` 将 `source` 的三个元素复制到 `dest`。\n\n#### Sort\n\n`Sort()`\
  \ 方法允许我们对数组进行排序。假设你有\n\n```\nint[] numbers = {12, 5, -2, 16, 14};\n```\n\n你可以通过编写\
  \ `Array.Sort(numbers);` 对数组进行排序。因此，`numbers` 变成了 `{-2, 5, 12, 14, 16}`。\n\n####\
  \ IndexOf\n\n我们使用 `IndexOf()` 方法确定某个值是否存在数组中。如果存在，方法返回该值第一次出现的位置索引。如果不存在，方法返回 -1。\n\
  \n例如，如果我们有\n\n```\nint[] numbers = {10, 30, 44, 21, 51, 21, 61, 24, 14};\n```\n\n\
  我们可以通过编写 `Array.IndexOf(numbers, 21);` 来查找值 21 是否存在于数组中。该方法返回找到的第一个值的索引，在这种情况下为\
  \ 3，因为 21 是数组中的第四个元素。然后你可以将答案赋值给一个变量：\n\n```\nint ans = Array.IndexOf(numbers, 21);\n\
  ```\n\n因此 `ans` 的值是 3。如果你写\n\n```\nans = Array.IndexOf(numbers, 100);\n```\n\n`ans`\
  \ 的值为 -1，因为 100 不在 `numbers` 数组中。\n\n### 字符串\n\n接下来，让我们看看 `string` 数据类型。字符串是文本。字符串的一个示例是文本“Hello\
  \ World”。\n\n要声明并初始化 `string` 变量，你写\n\n```\nstring message = “Hello World”;\n```\n\
  \n其中 `message` 是 `string` 变量的名称，“Hello World”是赋值给它的字符串。注意你需要将字符串包含在双引号内内。\n\n你也可以给变量赋值一个空字符串，如下所示：\n\
  \n```\nstring emptyString = \"\";\n```\n\n\n\n\n```cs\nstring anotherMessage = \"\
  \";\n```\n\n最后，我们可以使用连接符号（`+`）连接两个或多个字符串，并将它们赋值给变量。例如，我们可以写：\n\n```cs\nstring myName\
  \ = \"Hello World, \" + \"my name is Jamie\";\n```\n\n这等于：\n\n```cs\nstring myName\
  \ = \"Hello World, my name is Jamie\";\n```\n\n## 字符串属性和方法\n\n与数组一样，字符串带有许多属性和方法。\n\
  \n### Length\n\n字符串的 `Length` 属性告诉我们字符串包含的字符总数。\n\n要找到字符串“Hello World”的长度，我们写：\n\
  \n```cs\n\"Hello World\".Length\n```\n\n我们将得到值 11，因为“Hello”和“World”各有 5 个字符。当你在这两个单词之间加上空格时，得到的总长度为\
  \ 11。\n\n### Substring()\n\n`Substring()` 方法用于从较长的字符串中提取子字符串。\n\n它需要两个参数。第一个告诉编译器要提取的起始位置索引，第二个告诉编译器长度。\n\
  \n假设我们声明了一个 `string` 变量 `message` 并并将字符串“Hello World”赋值给它。\n\n```cs\nstring message\
  \ = \"Hello World\";\n```\n\n我们然后可以使用 `message` 调用如下所示的 `Substring()` 方法。\n\n```cs\n\
  string newMessage = message.Substring(2, 5);\n```\n\n`Substring(2, 5)` 从 `message`\
  \ 中从索引 2 开始提取 5 个字符的子字符串（索引始终从 0 开始，所以它是第三个字母）。\n\n生成的子字符串随后赋值给 `newMessage`。\n\n\
  因此，`newMessage` 等于“llo W”。\n\n另一方面，`message` 没有改变。它仍然保持为“Hello World”。\n\n### Equals()\n\
  \n我们可以使用 `Equals()` 方法比较两个字符串是否相同。\n\n如果我们有两个所示的字符串：\n\n```cs\nstring firstString\
  \ = \"This is Jamie\";\nstring secondString = \"Hello\";\nfirstString.Equals(\"\
  This is Jamie\");\n```\n\n返回 `true`，而：\n\n```cs\nfirstString.Equals(secondString);\n\
  ```\n\n返回 `false`，因为这两个字符串（`firstString` 和 `secondString`）不等。\n\n### Split()\n\n\
  `Split()` 方法根据用户定义的分隔符数组将字符串拆分为子字符串。分割字符串后，`Split()` 方法返回一个包含结果子字符串的数组。\n\n`Split()`\
  \ 方法需要两个参数——作为分隔符的字符串数组，以及第二个指定指定是否要从结果中删除空字符串。\n\n假设你想将字符串“Peter, John; Andy, ,David”拆分为子字符串，你可以如下所示操作（为了参考添加了行号）：\n\
  \n```cs\n1 string [] separator = {\", \", \";\"};\n2 string names = \"Peter, John;\
  \ Andy, , David\";\n3 string [] substrings = names.Split(separator, StringSplitOptions.None);\n\
  ```\n\n在第 1 行，我们首先声明一个两个字符串的数组作为分隔符。第一个字符串是逗号后加空格，第二个是分号后加空格。\n\n在第 2 行，我们将想要分割的字符串赋值给\
  \ `names` 变量。在第 3 行，我们使用 `names` 变量调用 `Split()` 方法并将结果赋值给 `substrings` 数组。\n\n上述代码的结果是以下数组：\n\
  \n```cs\n{\"Peter\", \"John\", \"Andy\", \"\", \"David\"}\n```\n\n该数组包含一个空字符串，因为在原始字符串中，“Andy”后面的逗号和“David”之前的逗号之间有一个空格。如果你想从结果中删除空字符串，必须将第\
  \ 3 行改为：\n\n```cs\nstring [] substrings = names.Split(separator, StringSplitOptions.RemoveEmptyEntries);\n\
  ```\n\n因此 `substrings` 数组变为：\n\n```cs\n{\"Peter\", \"John\", \"Andy\", \"David\"\
  }\n```\n\n通常，我们已经涵盖了许多常用的字符串方法。有关 C# 中所有可用字符串方法的完整列表，请查看页面 [`msdn.microsoft.com/en-us/library/system.string_methods(v=10)`](https://msdn.microsoft.com/en-us/library/system.string_methods(v=10))\n\
  \n## Lists\n\n现在让我们看看本节的最后数据类型——列表。列表存储值的方式与数组类似，但可以添加或删除元素。\n\n数组只能持有固定数量的值。如果你声明：\n\
  \n```cs\nint [] myArray = new int[10];\n```\n\n`myArray` 只能持有 10 个值。如果你写 `myArray[10]`（由于索引从\
  \ 0 开始，这指的是第 11 个值），将得到错误。\n\n如果你在程序需要更大的灵活性，可以使用列表。要声明整数列表，我们写：\n\n```cs\nList<int>\
  \ userAgeList = new List<int>();\n```\n\n`userAgeList` 是列表名。\n\n`List` 是表示你正在声明列表的关键字。\n\
  \n数据类型在角括号 `<>` 中。你可以在声明时初始化列表：\n\n```cs\nList<int> userAgeList = new List<int>\
  \ {1, 2, 3, 4};\n```\n\n要访问列表中的单个元素，我们使用与访问数组时相同的符号。例如，访问第一个元素，我们写 `userAgeList[0]`。（注意：原文说的是\
  \ `userAgeList`，这指的是索引访问）。\n\n实际上，原文说：“要访问第一个元素，你写 `userAgeList`。”我将遵循原文并添加反引号：`userAgeList`。\n\
  \n\n\n目前我们对引用类型了解的只有这些了。由于这是一本面向初者的书籍，我们不会详细讨论为什么引用类型是必要的。只需注意值类型和引用类型之间存在区别：前者存储值，而后者存储地址。\n\
  \n# 第 5 章：让我们的程序交互起来\n\n现在我们已经涵盖了变量和数据类型的基础知识，让我们写一个利用它们的程序吧。在本章中，我们将学习如何接收用户输入、将数据存储在变量以及向用户显示消息。准备好了吗？\n\
  \n## 向用户显示消息\n\n要向用户显示消息，我们使用 C# 提供的 `Write()` 或 `WriteLine()` 方法，它们位于 `System`\
  \ 命名空间。\n\n`WriteLine()` 和 `Write()` 的区别在于，`WriteLine()` 在显示消息后会将光标移动到下一行，而 `Write()`\
  \ 则不会。\n\n如果我们写\n\n```\nConsole.WriteLine(“Hello ”);\nConsole.WriteLine(“How are\
  \ you?”);\n```\n\n我们将得到：\n\n```\nHello\nHow are you?\n```\n\n如果我们写\n\n```\nConsole.Write(“Hello\
  \ ”);\nConsole.Write(“How are you?”);\n```\n\n我们将得到：\n\n```\nHello How are you?\n\
  ```\n\n注意，在上面的示例中，每当我们调用 `WriteLine()` 或 `Write()` 方法时，都在方法名前面加上了 `Console`。这是因为这两个方法都是\
  \ `Console` 类的静态方法。我们将在第 7 章详细讨论静态方法。\n\n如果你觉得每次使用这两个方法都添加 `Console` 单词很麻烦，可以在程序的开头添加指令\n\
  \n```\nusing static System.Console;\n```\n\n如果你这样做了，每当你使用 `Console` 类中的任何静态方法时，你只需要写\n\
  \n```\nWriteLine(“Hello World”);\n```\n\n而不是\n\n```\nConsole.WriteLine(“Hellow World”);\n\
  ```\n\n这是 C# 6（C# 的最新版本）中的新功能，并且只有在你使用最新的 IDE（即 Visual Studio 2015）时才可用。在后续示例中，为了向下兼容，我们将坚持第一种方法。\n\
  \n在第 2 章编写“Hello World”程序时，我们已经见过如何使用 `WriteLine()` 方法的例子。现在让我们看更多例子。在下面的示例中，我们将关注\
  \ `WriteLine()` 方法。`Write()` 方法的作用完全相同。\n\n### 示例 1\n\n要显示一个简单的字符串，我们写道\n\n```\n\
  Console.WriteLine(“Hello, how are you?”);\n```\n\n输出\n\n```\nHello, how are you?\n\
  ```\n\n### 示例 2\n\n要显示变量的值，我们将变量名作为参数传递。例如，假设我们有\n\n```\nint userAge = 30;\n```\n\
  \n我们通过写来显示 `userAge` 的值\n\n```\nConsole.WriteLine(userAge);\n```\n\n输出\n\n```\n\
  30\n```\n\n注意，我们没有将变量名（`userAge`）括在双引号中。如果我们写\n\n```\nConsole.WriteLine(“userAge”);\n\
  ```\n\n我们将得到输出为：\n\n```\nuserAge\n```\n\n### 示例 3\n\n要组合两个或多个字符串并显示它们，我们使用上一章提到的拼接符号（`+`）。\n\
  \n例如，如果我们写\n\n```\nConsole.WriteLine(“Hello, ” + “how are you?” + “ I love C#.”);\n\
  ```\n\n我们将得到\n\n```\nHello, how are you? I love C#.\n```\n\n### 示例 4\n\n我们还可以使用拼接符号来组合字符串和变量。假设我们有\n\
  \n```\nint results = 79;\n```\n\n语句\n\n```\nConsole.WriteLine(“You scored ” + results\
  \ + “ marks for your test.”);\n```\n\n给了我们\n\n```\nYou scored 79 marks for your\
  \ test.\n```\n\n再次，我们没有将变量名括在双引号中。否则我们将得到\n\n```\nYou scored results marks for your\
  \ test.\n```\n\n### 示例 5\n\n除了使用拼接符号组合字符串和变量外，我们还可以使用占位符。假设我们有\n\n```\nint results\
  \ = 79;\n```\n\n如果我们写\n\n```\nConsole.WriteLine(“{0}! You scored {1} marks for your\
  \ test.”, “Good morning\", results);\n```\n\n我们将得到\n\n```\nGood morning! You scored\
  \ 79 marks for your test.\n```\n\n在这个示例中，我们向 `WriteLine()` 方法传递了三个参数，并用逗号分隔。\n\n\
  这三个参数是\n\n1) `“{0}! You scored {1} marks for your test.”`\n2) `“Good morning”`\n\
  3) `results`\n\n第一个是将要显示的字符串。在字符串内部，大括号充当占位符，并将替换随后的参数。\n\n`{0}` 是下一个参数的占位符，在这种情况下是字符串“Good\
  \ morning”。\n\n`{1}` 是变量 `results` 的占位符。\n\n因此，输出是\n\n```\nGood morning! You scored\
  \ 79 marks for your test.\n```\n\n如果你写\n\n```\nConsole.WriteLine(“{1}! You scored\
  \ {0} marks for your test.”, “Good morning”, results);\n```\n\n你将得到\n\n```\n79!\
  \ You scored Good morning marks for your test.\n```\n\n当然，这样的语句毫无。然而，它演示了占位符是如何被相应的参数替换的。\n\
  \n在使用占位符时，我们可以指定希望显示数值的方式。这是通过使用格式规格符实现的，例如 `C` 和 `F` 规格符。\n\n`F` 规格符指定小数位数。`C`\
  \ 规格符将数字格式化为货币。\n\n### 示例 6\n\n我们还可以使用拼接符号来组合字符串和变量。假设我们有\n\n```\nint results =\
  \ 79;\n```\n\n如果我们写\n\n```\nConsole.WriteLine(“You scored ” + results + “ marks\
  \ for your test.”);\n```\n\n我们将得到\n\n```\nYou scored 79 marks for your test.\n```\n\
  \n\n\n\n`Read()` 和 `ReadLine()` 方法都以字符串形式读取用户输入。因此，在上面的示例中，我们将 `Console.ReadLine()`\
  \ 的结果赋值给一个名为 `userInput` 的 `string` 变量。\n\n然后我们可以使用：\n\n```\nConsole.WriteLine(userInput);\n\
  ```\n\n来打印出用户输入的输入。\n\n## 将字符串转换为数字\n\n有时候，有必要将用户输入的内容转换为数值数据类型，以便对其进行计算。C# 为我们提供了许多进行此类转换的方法。我们使用的方法位于\
  \ `Convert` 类中，该类也归类在 `System` 命名空间下。\n\n要将字符串转换为整数，我们使用 `ToInt32()` 方法。例如，如果我们有：\n\
  \n```\nstring userInput = Console.ReadLine();\n```\n\n如果用户输入了 20，`userInput` 将等于“20”（由于有双引号，它是一个字符串而不是整数）。\n\
  \n然后我们可以使用：\n\n```\nint newUserInput = Convert.ToInt32(userInput);\n```\n\n将字符串转换为整数\
  \ 20 并赋值给一个 `int` 变量。现在我们可以对这个新的 `int` 变量执行通常的数学运算了。\n\n除了将字符串转换为整数外，我们还可以分别使用 `ToDecimal()`、`ToSingle()`\
  \ 和 `ToDouble()` 方法将字符串转换为 `decimal`、`float` 或 `double`。\n\n## 整合一切\n\n现在让我们把所学到的知识结合起来，编写一个完整的程序。我们将修改在第\
  \ 2 章编写的“Hello World”程序。我们不仅向世界问好，还想让世界知道我们的名字和年龄。\n\n首先，启动 Visual Studio Community\
  \ 并创建一个 Visual C# 控制台应用程序项目。将项目命名为“HelloWorldAgain”。\n\n在 `Main()` 方法中输入以下代码段（添加行号以便参考）。\n\
  \n```\n1 string userName = \"\";\n2 int userAge = 0;\n3 int currentYear = 0;\n4\n\
  5 Console.Write(\"Please enter your name: \");\n6 userName = Console.ReadLine();\n\
  7 Console.Write(\"Please enter your age: \");\n8 userAge = Convert.ToInt32(Console.ReadLine());\n\
  9 Console.Write(\"Please enter the current year: \");\n10 currentYear = Convert.ToInt32(Console.ReadLine());\n\
  11\n12 Console.WriteLine(\"Hello World! My name is {0} and I am {1} years old. I\
  \ was born in {2}.\", userName, userAge, currentYear - userAge);\n```\n\n运行程序并输入以下信息：\n\
  \n```\nPlease enter your name: Jamie\nPlease enter your age: 39\nPlease enter the\
  \ current year: 2015\n```\n\n程序应该给出以下输出：\n\n```\nHello World! My name is Jamie and\
  \ I am 39 years old. I was born in 1976.\n```\n\n这个程序应该非常容易理解。然而，关于这个程序有两个点需要说明。\n\
  \n首先，第 10 行展示了我们如何在同一个语句中使用两个方法的示例。当我们写下：\n\n```\nuserAge = Convert.ToInt32(Console.ReadLine());\n\
  ```\n\n`Console.ReadLine()` 方法会先执行，因为它位于一对括号 `()` 之中。这与我们在评估数学表达式时，括号内的操作具有更高优先级相似。例如，当我们评估\
  \ `3 * (5 + 9)` 时，我们必须先将 5 加到 9，然后再将结果乘以 3（即 `3*14`）。\n\n在 `Console.ReadLine()`\
  \ 执行后，用户输入的值将使用 `Convert.ToInt32()` 转换为整数。\n\n假设用户输入了 39。\n\n```\nConvert.ToInt32(Console.ReadLine())\n\
  ```\n\n变为\n\n```\nConvert.ToInt32(“39”)\n```\n\n`Convert.ToInt32(“39”)` 的结果是整数 39。该整数随后被赋值给变量\
  \ `userAge`。\n\n程序的下一个要指出的点是第 12 行，如下：\n\n```\nConsole.WriteLine(“Hello World! My\
  \ name is {0} and I am {1} years old. I was born in {2}.”, userName, userAge, currentYear\
  \ - userAge);\n```\n\n注意最后一个参数 `(currentYear - userAge)` 涉及一个数学运算？这在 C# 中是允许的。`WriteLine()`\
  \ 将执行减法并显示计算结果。\n\n# 第 6 章：选择与决策\n\n恭喜你走到这里。我们已经走了很远。你现在已经了 C# 中不同的数据类型，并能够编写一个与用户交互的简单程序。\n\
  \n在本章中，我们将涵盖编程中的另一个基本概念；我们将学习如何使用控制流语句来控制程序的流程。\n\n具体来说，我们将学习 `if` 语句、内联 `if` 语句、`switch`\
  \ 语句、`for` 循环、`foreach` 循环、`while` 循环和 `do while` 循环。此外，我们还将学习在发生错误时控制流程的 `try-catch-finally`\
  \ 语句。\n\n然而，在这些控制工具之前，我们必须首先查看条件语句。\n\n### 条件语句\n\n大多数控制流语句涉及评估条件语句。程序将根据条件是否满足以不同的方式运行。\n\
  \n常见的条件语句是比较语句。如果我们想比较变量是否相同，我们使用 `==` 符号。例如，如果你写 `x == y`，你是在要求程序检查 `x` 是否等于 `y`。如果它们相等，则条件满足，语句求值为\
  \ `true`。\n\n除了评估一个值是否等于另一个值外，我们还可以在语句中使用其他比较操作运算符：\n\n- 不等于 (`!=`)：如果左侧不等于右侧，则返回\
  \ `true`。\n- 大于 (`>`)：如果左侧大于右侧，则返回 `true`。\n- 小于 (`<`)：如果左侧小于右侧，则返回 `true`。\n- 大于或等于\
  \ (`>=`)：如果左侧大于等于右侧，则返回 `true`。\n- 小于或等于 (`<=`)：如果左侧小于等于右侧，则返回 `true`。\n\n我们还有三个逻辑运算符\
  \ (`&&`、`||`、`!`)，当我们想要组合条件时它们非常有用。\n\n- 与逻辑运算符 (`&&`)：如果所有条件都满足，则返回 `true`。\n-\
  \ 或逻辑运算符 (`||`)：如果至少满足一个条件，则返回 `true`。\n- 非逻辑运算符 (`!`)：（在逻辑运算符的上下文中提到）\n\n### 控制流语句\n\
  \n现在我们已经熟悉了条件语句，让我们继续学习如何使用这些语句来控制流程。\n\n### If 语句\n\n`if` 语句是最常用的控制流语句之一。它允许程序评估条件是否满足，并根据结果执行相应的操作。`if`\
  \ 语句的结构如下（添加行号以便参考）：\n\n```\n1 if (condition 1 is met)\n2 {\n3 Task A\n4 }\n5 else\
  \ if (condition 2 is met)\n6 {\n7 Task B\n8 }\n9 else if (condition 3 is met)\n\
  10 {\n11 Task C\n12 }\n13 else\n14 {\n15 Task E\n16 }\n```\n\n第 1 行测试第一个条件。如果条件满足，后续大括号内的内容（第\
  \ 2 到 4 行）将执行。`if` 语句的剩余部分（从 5 到 16 行）将被跳过。\n\n如果第一个条件不满足，可以使用后续的 `else if` 语句测试更多条件（第\
  \ 5 到 12 行）。可以有多个 `else if` 语句。最后，可以使用 `else` 语句（第 13 到 16 行）在之前的条件都不满足时执行某些代码。\n\
  \n为了完全理解 `if` 语句的工作原理，请向 VSC 模板中的 `Main()` 程序中添加以下代码：\n\n```\nint userAge;\n```\n\
  \n\n\n\n\n```cs\nConsole.Write(\"Please enter your age: \");\nuserAge = Convert.ToInt32(Console.ReadLine());\n\
  if (userAge < 0 || userAge > 100)\n{\n    Console.WriteLine(\"Invalid Age\");\n\
  \    Console.WriteLine(\"Age must be between 0 and 100\");\n}\nelse if (userAge\
  \ < 18)\n    Console.WriteLine(\"Sorry you are underage\");\nelse if (userAge <\
  \ 21)\n    Console.WriteLine(\"You need parental consent\");\nelse\n{\n    Console.WriteLine(\"\
  Congratulations!\");\n    Console.WriteLine(\"You may sign up for the event!\");\n\
  }\n```\n\n程序首先提示用户输入年龄，并将结果存储在 `userAge` 变量中。\n\n接下来，语句 `if (userAge < 0 || userAge\
  \ > 100)` 检查 `userAge` 的值是否小于 0 或大于 100。如果其中任一个条件为 `true`，程序将执行后续大括号内的所有语句。在本例中，它将先打印“Invalid\
  \ Age”，然后打印“Age must be between 0 and 100”。\n\n另一方面，如果两个条件都为 `false`，程序将测试下一个条件\
  \ - `else if (userAge < 18)`。如果 `userAge` 小于 18（但由于第一个条件未满足，它必然大于或等于 0），程序将打印“Sorry\
  \ you are underage”。\n\n你可能会注意到，我们没有将语句 `Console.WriteLine(“Sorry you are underage”)`\
  \ 括在大括号中。这是因为如果只有一个语句需要执行，那么大括号是可选的。\n\n如果用户没有输入小于 18 的值，而是输入了一个大于或等于 18 但小于 21\
  \ 的值，将执行下一个 `else if` 语句。在这种情况下，将打印消息“You need parental consent”。\n\n最后，如果用户输入的值大于或等于\
  \ 21 且小于或等于 100，程序将执行 `else` 块中的代码。在这种情况下，它将打印“Congratulations!”，然后打印“You may sign\
  \ up for the event!”。\n\n运行程序五次，并分别每次运行时输入 -1、8、20、23 和 121。你将得到以下输出：\n\n`Please\
  \ enter your age: -1`\n`Invalid Age`\n`Age must be between 0 and 100`\n\n`Please\
  \ enter your age: 8`\n`Sorry you are underage`\n\n`Please enter your age: 20`\n\
  `You need parental consent`\n\n`Please enter your age: 23`\n`Congratulations!`\n\
  `You may sign up for the event!`\n\n`Please enter your age: 121`\n`Invalid Age`\n\
  `Age must be between 0 and 100`\n\n## 内联 If (Inline If)\n\n内联 `if` 语句是 `if` 语句的一种更简单的形式，如果你想根据条件的结果为变量赋值，它会非常方便。其语法如下：\n\
  \n`条件 ? 条件为真时的值 : 条件为假时的值;` \n\n例如，语句 `3>2 ? 10 : 5;` 返回值 10，因为 3 大于 2（即条件 `3 >\
  \ 2` 为真）。该值随后可以赋值给变量。\n\n如果我们写 `int myNum = 3>2 ? 10 : 5;`，`myNum` 将被赋值为 10。\n\n\
  ## Switch 语句 (Switch Statement)\n\n`switch` 语句与 `if` 语句类似，不同之处在于不适用于值的范围。`switch`\
  \ 语句要求每个 `case` 都基于单个值。根据用于切换的变量的值，程序将执行正确的代码块。\n\n`switch` 语句的语法如下：\n\n```cs\n\
  switch (用于切换的变量)\n{\n    case 第一种:\n        执行 A;\n        break (或其他跳转语句);\n  \
  \  case 第二种:\n        执行 B;\n        break (或其他跳转语句);\n    case default:\n     \
  \   执行 C;\n        break (或其他跳转语句);\n}\n```\n\n在使用 `switch` 语句时，你可以根据需要拥有任意数量的 `case`。`default`\
  \ 情况是可选的，如果没有任何其他 `case` 适用，则执行它。\n\n当满足某个 `case` 时，从下一行开始的所有内容都会被执行，直到遇到跳转语句。跳转语句是种指示编译器跳转到程序中另一行的语句。最常用的跳转语句是\
  \ `break;` 语句。\n\n让我们来看 `switch` 语句是如何工作的示例。\n\n```cs\n1 Console.Write(\"Enter your\
  \ grade: \");\n2 string userGrade = Console.ReadLine();\n3\n4 switch (userGrade)\n\
  5 {\n6 case \"A+\":\n7 case \"A\":\n8 Console.WriteLine(\"Distinction\");\n9 break;\n\
  10 case \"B\":\n11 Console.WriteLine(\"B Grade\");\n12 break;\n13 case \"C\":\n\
  14 Console.WriteLine(\"C Grade\");\n15 break;\n16 default:\n17 Console.WriteLine(\"\
  Fail\");\n18 break;\n19 }\n```\n\n程序首先提示用户输入成绩。\n\n如果成绩是“A+”（第 6 行），程序将执行下一个语句直到遇到\
  \ `break;` 语句。这意味着它将执行第 7 到第 9 行。因此，输出是“Distinction”。\n\n如果成绩是“A”（第 7 行），程序将执行第\
  \ 8 和第 9 行。同样地，输出是“Distinction”。\n\n如果成绩不是“A+或“A”，程序将检查下一个 `case`。它会从上到下持续检查直到满足某个\
  \ `case`。如果没有 `case` 适用，则执行 `default` 情况。\n\n如果你运行上面的代码，对于所示的输入，你将得到以下输出：\n\n`Enter\
  \ your grade: A+`\n`Distinction`\n\n`Enter your grade: A`\n`Distinction`\n\n`Enter\
  \ your grade: B`\n`B Grade`\n\n`Enter your grade: C`\n`C Grade`\n\n`Enter your grade:\
  \ D`\n`Fail`\n\n## For 循环 (For Loop)\n\n`for` 循环反复执行代码块，直到条件不再有效。`for` 的语法为：\n\n\
  `for (初始值; 测试条件; 修改)`\n\n`{`\n`//执行任务`\n`}`\n\n为了理解 `for` 循环是如何工作的，让我们考虑这个示例。\n\n\
  ```cs\n1 for (int i = 0; i < 5; i++)\n2 {\n3 Console.WriteLine(i);\n4 }\n```\n\n\
  `for` 主要由三个部分组成，用分号分隔。第一部分声明并初始化 `int` 变量 `i` 为零。该变量作为循环计数器。第二部分测试 `i` 是否小于 5。如果是，则执行大括号内的语句。在执行完\
  \ `WriteLine()` 语句后，程序返回第 1 行。`i++` 将 `i` 的值增加 1。因此，`i` 从 0 增加到 1。增加后，程序测试 `i` 的新值是否仍然小于\
  \ 5。如果是，则再次执行 `WriteLine()`。这种测试和增加计数器的过程重复进行，直到 `i < 5` 不再成立。此时，程序退出 `for` 循环并继续执行后续命令。\n\
  \n该代码的输出为：\n\n`0`\n`1`\n`2`\n`3`\n`4`\n\n当 i 为 5 时，`WriteLine()`语句不再执行。\n\n`for`\
  \ 循环通常用于遍历数组或列表。例如，如果我们有\n\n`int[] myNumbers = { 10, 20, 30, 40, 50 };`\n\n我们可以使用\
  \ `for` 循环和数组的 `Length` 属性来遍历数组：\n\n```cs\nfor (int i = 0; i < myNumbers.Length;\
  \ i++)\n{\n    Console.WriteLine(myNumbers[i]);\n}\n```\n\n由于 `myNumbers.Length`\
  \ 等于 5，这段代码从 `i = 0` 运行到 `i = 4`。如果我们运行代码，将得到以下输出：\n\n`10`\n`20`\n`30`\n`40`\n`50`\n\
  \n## Foreach 循环 (Foreach Loop)\n\n除了 `for` 循环外，我们在处理数组和列表时还可以使用 `foreach` 循环。如果你想从数组或列表中获取信息而不对其进行任何更改，`foreach`\
  \ 循环非常有用。\n\n假设你有\n\n`char[] message = { ‘H’, ‘e’, ‘l’, ‘l’, ‘o’ };`\n\n你可以使用以下代码显示数组的元素：\n\
  \n```cs\nforeach (char i in message)\n    Console.Write(i);\n```\n\n\n\n\n在上面的代码中，我们有一个用于循环的\
  \ `char` 变量 `i`。每次循环运行时，`message` 数组中的一个元素会被赋值给变量 `i`。例如，循环第一次运行时，字符‘H’被赋值给 `i`。\n\
  \n接下来这一行\n```cs\nConsole.Write(i);\n```\n会打印出字母‘H’。\n\n循环第二次运行时，字符‘e’被赋值给 `i`。这一行\n\
  ```cs\nConsole.Write(i);\n```\n打印出字母‘e’。\n\n此过程一直持续，直到数组中的所有元素都被打印完毕。\n\n## while\
  \ 循环\n\n顾如名，`while` 循环在特定条件仍然有效时重复执行循环内部的指令。`while` 语句的结构如下：\n\n```\nwhile (condition\
  \ is true)\n{\n    do A\n}\n```\n\n在使用 `while` 循环时，通常我们需要先声明一个变量作为循环计数器。让我们把这个变量为\
  \ `counter`。下面的代码展示了 `while` 循环工作的示例。\n\n```cs\nint counter = 5;\nwhile (counter\
  \ > 0)\n{\n    Console.WriteLine(“Counter = {0}”, counter);\n    counter = counter\
  \ – 1;\n}\n```\n\n如果你运行这段代码，将得到以下输出\n```\nCounter = 5\nCounter = 4\nCounter = 3\n\
  Counter = 2\nCounter = 1\n```\n\n`while` 语句的语法相对简单。只要 `counter > 0`，大括号内的语句就会执行。\n\
  \n注意到我们在大括号内部有一行 `counter = counter – 1` 吗？这一行至关重要。它在每次循环运行时都会将 `counter` 的值减 1。\n\
  \n我们需要将 `counter` 的值减 1，这样循环条件（`counter > 0`）最终会求结果为 `false`。如果我们忘记这样做，循环将一直运行下去，导致死循环。程序将一直打印\
  \ `counter = 5` 直到你以某种方式杀死程序。这并不是一种愉快的体验，特别是当你有一个大型程序且不知道哪段代码导致了死循环时。\n\n## do while\n\
  \n`do while` 循环与 `while` 循环相似，但主要区别在于——`do while` 循环大括号内的代码至少会执行一次。这里有一个 `do while`\
  \ 循环工作的示例。\n\n```cs\nint counter = 100;\ndo {\n    Console.WriteLine(“Counter =\
  \ {0}”, counter);\n    counter++;\n} while (counter<0);\n```\n\n由于测试条件（`while (counter<0)`）被放置在右大括号之后，它在大括号内的代码至少执行一次后才会进行测试。\n\
  \n如果你运行上面的代码，将得到\n```\nCounter = 100;\n```\n\n在第一次执行 `WriteLine()` 语句后，`counter`\
  \ 增加了 1。现在 `counter` 的值是 101。当程序到达测试条件时，由于 `counter` 不小于 0，测试失败。程序随后将退出循环。即使 `counter`\
  \ 的原始值不满足测试条件（`counter < 0`），大括号内的代码仍然执行了一次。\n\n注意，对于 `do while` 语句，测试条件后需要一个分号（`;`）。\n\
  \n## 跳转语句\n\n我们现在涵盖了 C# 中大部分的控制流语句。接下来，让我们来看看跳转语句。\n\n跳转语句是一种指令程序偏离正常执行序列并跳转到另一行代码的语句。跳转语句通常用于循环和其他控制流语句中。\n\
  \n### break\n\n`break` 关键字会导致程序在满足特定条件时提前退出循环。我们已经见过 `break` 关键字如何在 `switch` 语句中使用。现在，让我们来看看\
  \ `break` 关键字如何在 `for` 循环中使用的示例。\n\n考虑下面的代码段：\n\n```cs\n1 int i = 0;\n2\n3 for (i\
  \ = 0; i < 5; i++)\n4 {\n5     Console.WriteLine(\"i = {0}\", i);\n6     if (i ==\
  \ 2)\n7         break;\n8 }\n```\n\n在这个示例中，我们在 `for` 循环内部使用了一个 `if` 语句。在编程中，“混合使用”各种控制工具是非常常见的，例如在\
  \ `if` 语句内部使用 `while` 循环，或在 `while` 循环内部使用 `for` 循环。这被称为嵌套控制语句。\n\n如果你运行上面的代码段，将得到以下输出。\n\
  ```\ni = 0\ni = 1\ni = 2\n```\n\n注意到循环在 `i = 2` 时提前结束了吗？\n\n如果没有 `break` 关键字，循环应该从\
  \ `i = 0` 运行到 `i = 4`，因为循环条件是 `i < 5`。但有了 `break` 关键字，当 `i = 2` 时，第 6 行的条件评估为 `true`。第\
  \ 7 行的 `break` 关键字导致循环提前结束。\n\n### continue\n\n另一个常用的跳转关键字是 `continue` 关键字。当我们使用\
  \ `continue` 时，关键字之后的循环剩余部分将被跳过。一个示例会让它变得更清晰。\n\n```cs\nfor (int i = 0; i < 5; i++)\n\
  {\n    if (i == 2)\n        continue;\n    Console.WriteLine(\"i = {0}\", i);\n\
  }\n```\n\n如果你运行上面的代码，将得到：\n```\ni = 0\ni = 1\ni = 3\ni = 4\n```\n由于 `continue` 关键字，i\
  \ = 2 被跳过了。\n\n## 异常处理\n\n我们现在学习了如何使用控制语句和跳转语句在正常情况下控制程序流。在本章结束之前，我们需要查看最后一种控制语句，`try-catch-finally`。`try-catch-finally`\
  \ 语句控制程序在发生错误时的运行方式。语法如下：\n\n```\ntry\n{\n    do something\n}\ncatch (type of error)\n\
  {\n    do else\n}\nfinally\n{\n    do this\n}\n```\n\n你可以有多个 `catch` 块。此外，`finally`\
  \ 块是可选的。让我们考虑一个示例。\n\n```cs\nint numerator, denominator;\nConsole.Write(\"Please\
  \ enter the numerator: \");\nnumerator = Convert.ToInt32(Console.ReadLine());\n\
  Console.Write(\"Please enter the denominator: \");\ndenominator = Convert.ToInt32(Console.ReadLine());\n\
  try\n{\n    Console.WriteLine(\"The result is {0}.\", numerator/denominator);\n\
  }\ncatch (Exception e)\n{\n    Console.WriteLine(e.Message);\n}\nfinally\n{\n  \
  \  Console.WriteLine(\"---- End of Error Handling ----\");\n}\n```\n\n如果你运行代码并输入\
  \ 12 和 4，你将得到\n```\nThe result is 3.\n---- End of Error Handling ----\n```\n在这个示例中，`try`\
  \ 块的代码执行成功。在 `try` 块代码执行后，执行 `finally` 块的代码。\n\n现在假设你输入 12 和 0。你将得到\n```\nAttempted\
  \ to divide by zero.\n---- End of Error Handling ----\n```\n在这种情况下，执行的是 `catch`\
  \ 块。这是因为当程序尝试执行 `try` 块中的语句时发生了错误，因为你不能除以零。因此，执行了 `catch` 块中的语句。此外，`finally` 块的代码也会执行。\n\
  \n`Exception` 类处理所有通用错误，并有一个名为 `Message` 的属性，用于解释异常的原因。要显示该属性，我们写：\n```cs\nConsole.WriteLine(e.Message);\n\
  ```\n\n\n\n\n除了处理通用错误的 `Exception` 类外，我们还有其他可以处理更特定错误的类。如果你想根据捕获到的特定错误执行特定任务，这就会非常有用。例如，你可能想要显示自己的错误消息。\n\
  \n尝试运行下面的代码：\n\n```sharp\nint choice = 0;\nint[] numbers = { 10, 11, 12, 13, 14,\
  \ 15 };\nConsole.Write(\"Please enter the index of the array: \");\ntry\n{\n   \
  \ choice = Convert.ToInt32(Console.ReadLine());\n    Console.WriteLine(\"numbers[{0}]\
  \ = {1}\", choice, numbers[choice]);\n}catch (IndexOutOfRangeException)\n{\n   \
  \ Console.WriteLine(\"Error: Index should be from 0 to 5.\");\n}catch (FormatException)\n\
  {\n    Console.WriteLine(\"Error: You did not enter an integer.\");\n}catch (Exception\
  \ e)\n{\n    Console.WriteLine(e.Message);\n}\n```\n\n如果你输入 `10`，你将得到：\n`Index was\
  \ outside the bounds of the array.`\n`Index should be from 0 to 5.`\n\n如果你输入 `Hello`，你将得到：\n\
  `Input string was not in a correct format.`\n`You did not enter an integer.`\n\n\
  第一个错误是 `IndexOutOfRangeException` 异常，并由第一个 `catch` 块处理。当你尝试访问超出数组范围的元素时，就会发生此异常。\n\
  \n第二个错误是 `FormatException` 异常，并由第二个 `catch` 块处理。当参数格式无效时，会发生 `FormatException` 异常。在我们的示例中，`Convert.ToInt32(\"\
  Hello\")` 生成了 `FormatException` 异常，因为参数“Hello”无法转换为整数。相反，如果你输入 `4`，`Convert.ToInt32(“4”)`\
  \ 将产生 `FormatException` 异常，因为字符串“4”可以转换为整数。\n\n在两个特定的 `catch` 块之后，我们还有一个 `catch`\
  \ 块来捕获我们没有预先的任何通用错误。\n\n上面的示例展示了 C# 中许多异常中的两个。要查看所有异常的完整列表，请参阅 [`msdn.microsoft.com/en-us/library/system.systemexception.aspx`](https://msdn.microsoft.com/en-us/library/system.systemexception.aspx)。\n\
  \n# 第 7 章：面向对象编程基础\n\n到目前为止我们涵盖了相当的内容。在接下来的两个章节中，我们将介绍编程中的另一个重要概念——面向对象编程概念。\n\n\
  在本章中，我们将学习什么是面向对象编程，以及如何编写自己的类并从类创建对象。此外，我们还将讨论字段、属性、构造函数和方法的概念。\n\n## 什么是面向对象编程？\n\
  \n简单来说，面向对象编程是一种编程方法，它将编程问题分解为相互作用的对象。\n\n对象是从被称为“类”（classes）的模板创建的。你可以将类比为建筑的蓝图。而对象就是我们根据蓝图建造的实际“建筑”。\n\
  \n## 编写我们自己的类\n\n要编写自己的类，我们使用 `class` 关键字，后面跟着类名。\n\n例如，要创建一个 `Staff` 类，我们写道：\n\n\
  ```sharp\nclass Staff {\n    //类的内容\n    //包括字段、属性和方法\n}\n```\n\n在命名类名时使用 PascalCasing（帕斯卡命名法）是一种常见做法。PascalCasing\
  \ 指将每个单词的首字母（包括第一个单词）大写的做法（例如 `ThisIsAClassName`）。这是我们将在书中遵循的规范。\n\n类的内容封装在类名后的大括号对内。类的内容包括构造函数、析构函数、常量、字段、方法、属性、索引器、操作符、事件、委托、接口、结构体和其他类。\n\
  \n我们将在本章中涵盖类的一些常用元素，即字段、方法、属性和构造函数。\n\n为了理解这些是什么，让我们从零开始构建一个类。\n\n首先，在 Visual Studio\
  \ Community 中创建一个新的控制台应用程序项目，并命名为“ClassDemo”。\n\n学习自动为你生成的代码。注意在 `ClassDemo` 命名空间内部，VSC\
  \ 已经为你创建了一个名为 `Program` 的类？在 `Program` 类内部，我们有 `Main()` 方法。\n\n默认情况下，`Main()` 方法（所有\
  \ C# 应用程序的起点）被放在 VSC 创建的 `Program` 类中。如果我们需要，可以将 `Program` 类的名称改为其他名称，但 `Main()`\
  \ 方法必须命名为 `Main()`。所有 C# 程序都必须存在 `Main()` 方法。\n\n在本章中，我们将向 `ClassDemo` 命名空间添加第二个类。我们将这个新类命名为\
  \ `Staff`，并向类添加字段、属性和方法。本章的完整可以在 [`www.learncodingfast.com/csharp`](http://www.learncodingfast.com/csharp)\
  \ 下载。\n\n让我们先声明该类。在自动生成的代码中 `class Program` 行之前添加以下代码：\n\n```sharp\nclass Staff\n\
  {\n}\n```\n\n现在我们的项目中有两个类：`Staff` 和 `Program`。\n\n### 字段 (Fields)\n\n在 `Staff` 类内部，添加以下行：\n\
  \n```sharp\nprivate string nameOfStaff;\nprivate const int hourlyRate = 30;\nprivate\
  \ int hWorked;\n```\n\n在这里，我们声明了一个 `string` 变量 (`nameOfStaff`) 和两个 `int` 变量 (`hourlyRate`\
  \ 和 `hWorked`)。这些变量被称为类的字段。字段就是定义在类内部的变量。与其他变量一样，它们用于存储数据。\n\n注意每个声明前面都有 `private`\
  \ 单词？这被称为访问修饰符。访问修饰符就像守门员，它们控制谁可以访问该字段。字段可以是 `private`（私有的）、`public`（公共的）、`protected`（保护的）或\
  \ `internal`（内部的）。在我们的情况下，我们将这三个字段都声明为 `private`。这意味着它们只能在 `Staff` 类内部访问。\n\n我们不希望字段对类开放有两个原因。\n\
  \n第一个原因是其他类不需要了解这些字段。在我们的情况下，`hourlyRate` 字段仅在 `Staff` 类内部需要。我们在 `Staff` 类内部有一个方法使用\
  \ `hourlyRate` 来计算员工的月薪。其他类完全不使用 `hourlyRate` 字段。因此，将 `hourlyRate` 声明为 `private`\
  \ 以向其他类隐藏此字段是合适的。\n\n被称为封装。封装允许对象向不需要它的类隐藏数据和行为。这使得我们在以后需要时更容易更容易修改代码。我们可以安全地在 `Staff`\
  \ 类内部更改 `hourlyRate` 的值，而不影响其他类。\n\n将字段声明为 `private` 的第二个原因是我们不希望其他类随意修改它们。这有助于防止字段被损坏。\n\
  \n我们将在下一章详细讨论访问修饰符。\n\n除了 `private` 关键字外，我们在声明 `hourlyRate` 字段时还添加了 `const` 关键字：\n\
  \n`private const int hourlyRate = 30;`\n\n### 属性 (Properties)\n\n接下来，让我们看看属性。\n\n\
  属性通常用于在其他类需要字段的情况下，为私有字段提供访问。这听起来像是一个矛盾。在此之前，我们提到使用私有字段是为了让其他类无法访问它们。如果是这样，我们为什么要通过属性允许访问它们呢？\n\
  \n\n\n\n其中主要原因之一是使用属性让我们对其他类在评估这些私有字段时的权利拥有了更大的控制权。稍后我们将看到如何这样做。\n\n现在，让我们先学习如何声明属性。\n\
  \n在我们的 `Staff` 类中，紧接 `private int hWorked;` 这一行添加以下代码。\n\n```csharp\npublic int\
  \ HoursWorked\n{\n    get\n    {\n        return hWorked;\n    }\n    set\n    {\n\
  \        if (value > 0)\n            hWorked = value;\n        else\n          \
  \  hWorked = 0;\n    }\n}\n```\n\n我们将属性声明为：\n\n```csharp\npublic int HoursWorked\n\
  {\n}\n```\n\n访问修饰符为 `public`，因为我们希望其他类能够访问此属性。\n\n数据类型是 `int`，因为该属性用于提供对私有 `int`\
  \ 字段 `hWorked` 的访问。`hWorked` 被称为属性的支持字段（backing field）。\n\n属性的名称是 `HoursWorked`。我们通常对属性名使用大驼命名法（PascalCasing）。\n\
  \n属性包含两个特殊的方法，称为访问器（accessors）。第一个访问器是获取器（getter），第二个是设置器（setter）。\n\n基础获取器简单地返回私有字段的值。因此，我们写道：\n\
  \n```csharp\nget\n{\n    return hWorked;\n}\n```\n\n其中 `return` 是一个关键字，`hWorked`\
  \ 是支持字段的名称。\n\n设置器设置私有字段的值。我们写道：\n\n```csharp\nset\n{\n    if (value > 0)\n    \
  \    hWorked = value;\n    else\n        hWorked = 0;\n}\n```\n\n`value` 在设置器内部使用时是一个关键字。它指的是当用户使用属性为私有字段赋值时，赋值语句右侧的值。我们稍后将学习如何这样做。\n\
  \n在设置器内部，我们使用 `if` 语句进行了一个简单的检查。我们检查了 `value` 是否大于零。如果是，我们就将其赋值给 `hWorked`。否则，我们将\
  \ `hWorked` 设为 0。这个设置器演示了我们如何使用属性来控制可以赋值给我们私有字段的值。\n\n默认情况下，获取器和设置器的访问级别与属性本身相同（在本例中为\
  \ `public`）。因此，我们不需要显式指定它们。但是，如果你不想让设置器的访问级别与属性相同，可以将设置器声明为 `private`，这样其他类无法修改你的私有字段：\n\
  \n```csharp\nprivate set\n{\n}\n```\n\n那么，该属性在 `Staff` 类之外就是一个只读属性。它的值只能在 `Staff`\
  \ 类内部被设置。\n\n### 自动实现属性\n\n注意，在获取器和设置器不需要额外逻辑的情况下，C# 为我们提供了声明属性的简写形式。这被称为自动实现属性（auto-implemented\
  \ property）。\n\n要声明自动实现属性，我们写道：\n\n```csharp\npublic int HoursWorked { get; set;\
  \ }\n```\n\n这等于：\n\n```csharp\nprivate int hWorked;\npublic int HoursWorked\n{\n\
  \    get\n    {\n        return hWorked;\n    }\n    set\n    {\n        hWorked\
  \ = value;\n    }\n}\n```\n\n当你使用这种简写形式时，你不需要声明私有字段。编译器会自动为你创建一个匿名的私有支持字段。\n\n如果你想让属性变为只读，可以这样将设置器设为\
  \ `private`：\n\n```csharp\npublic int HoursWorked { get; private set; }\n```\n\n\
  ### 方法\n\n接下来，让我们来看看方法。\n\n方法是执行特定任务的代码块。\n\n让我们为 `Staff` 类添加一个简单的方法。\n\n```csharp\n\
  public void PrintMessage()\n{\n    Console.WriteLine(“Calculating Pay…”);\n}\n```\n\
  \n该方法被声明为：\n\n```csharp\npublic void PrintMessage()\n{\n}\n```\n\n方法声明首先说明了方法的访问性级别。在这里，我们将方法声明为\
  \ `public`，以便该方法在程序的任何地方都可以访问（而不仅仅是在 `Staff` 类内部）。\n\n接下来，我们说明方法的返回类型。方法在执行其任务后可能会返回特定结果。如果方法不返回任何结果，我们像示例中那样使用\
  \ `void` 关键字。\n\n最后，我们说明方法的名称（示例中为 `PrintMessage`）。\n\n方法名后的括号 `()` 是我们包含方法参数的地方。参数是传递给方法的数据名称，以便其执行任务。如果方法不需要数据（如我们的示例），我们只需要在方法名后添加一对空括号即可。\n\
  \n声明方法后，我们在随后的花括号内定义它的功能。这被称为实现方法（implementing the method）。在我们的示例中，`PrintMessage()`\
  \ 方法只是打印行“Calculating Pay…”。\n\n`PrintMessage()` 方法就是这些。\n\n接下来，让我们转向一个更复杂的方法。第二个方法计算每个员工的薪水并返回计算结果。在\
  \ `Staff` 中添加以下代码。\n\n```csharp\npublic int CalculatePay()\n{\n    PrintMessage();\n\
  \    int staffPay;\n    staffPay = hWorked * hourlyRate ;\n    if (hWorked > 0)\n\
  \        return staffPay;\n    else\n        return 0;\n}\n```\n\n该方法被声明为：\n\n```csharp\n\
  public int CalculatePay()\n{\n}\n```\n\n`int` 关键字表示此方法返回一个 `int` 类型的值。\n\n在花括号内部，我们有\
  \ `PrintMessage();`。这被称为调用 `PrintMessage()` 方法。在我们的示例中，`PrintMessage()` 方法在执行方法的其余部分之前首先打印行“Calculating\
  \ Pay…”。\n\n接下来，我们声明了一个局部变量 `staffPay`并将 `hWorked` 和 `hourlyRate` 的乘积赋值给它。这些被称为局部变量（local\
  \ variables），仅存在于方法内部。\n\n方法可以访问类内部声明的所有字段和属性。在赋值 `staffPay` 变量后，我们使用 `if` 语句来确定方法应该返回什么结果。\n\
  \n方法通常至少有一个返回语句。`return` 是一个用于从方法返回答案的关键字。方法中可以有多个返回语句。但是，一旦方法执行了返回语句，方法就会退出。\n\n\
  在我们的示例中，如果 `hWorked` 大于零，程序将执行语句\n\n`return staffPay;`\n\n并退出方法。此返回值可以赋值给变量。例如，如果\
  \ `hWorked` 为 10 且 `hourlyRate` 为 20，我们可以使用语句\n\n`int pay = CalculatePay();`\n\n\
  将 `CalculatePay()` 的结果赋值给变量 `pay`。此时 `pay` 的值为 200。\n\n另一方面，如果 `hWorked` 小于等于零，程序将执行语句\n\
  \nreturn 0;\n\n并退出方法。`pay` 的值为 0。\n\n### 重载\n\n在 C#（以及大多数其他语言）中，只要签名不同，你可以创建同名的方法。这被称为重载（overloading）。方法的签名指的是方法的名称及其它拥有的参数。\n\
  \n在之前的 `CalculatePay()` 方法下方添加以下方法。\n\n```csharp\npublic int CalculatePay(int bonus,\
  \ int allowance)\n{\n    PrintMessage();\n    if (hWorked > 0)\n        return hWorked\
  \ * hourlyRate + bonus + allowance;\n    else\n        return 0;\n}\n```\n\n第一个方法的签名是\
  \ `CalculatePay()`，而第二个方法的签名是 `CalculatePay(int bonus, int allowance)`。\n\n第二个方法有两个参数\
  \ - `bonus` 和 `allowance`。它通过将这两个参数的值加上 `hWorked` 和 `hourlyRate` 的乘积来计算员工的薪水。在这个示例中，我们没有使用局部变量来存储\
  \ `hWorked * hourlyRate + bonus + allowance` 的结果。我们直接返回计算结果。这完全没问题。稍后我们将学习如何使用这个方法。\n\
  \n### ToString() 方法\n\n最后，在进入下一节之前，我们需要再写一个方法—— `ToString()` 方法。\n\n\n\n\n`ToString()`\
  \ 方法是一个特殊的方法，它返回一个表示当前类的字符串。在 C# 中，所有类都带有一个预定义的 `ToString()` 方法。然而，按照惯例（这也是对我们要求的），我们应该重写这个方法。重写方法简单来说意味着编写我们自己的方法版本。\n\
  \n通常情况下，我们编写的 `ToString()` 方法会显示类的字段和属性的值。请向 `Staff` 类中添加以下代码：\n\n```csharp\npublic\
  \ override string ToString()\n{\n    return \"Name of Staff = \" + nameOfStaff +\
  \ \", hourlyRate = \" + hourlyRate + \", hWorked = \" + hWorked;\n}\n```\n\n如你所见，`ToString()`\
  \ 方法返回一个 `string` 类型。它返回的字符串包含了关于 `Staff` 类的信息。方法声明中的 `override` 关键字表示此方法重写了默认方法。我们将在下一章详细讨论\
  \ `override` 关键字。\n\n### 构造函数\n\n现在，让我们来看构造函数。\n\n构造函数是一种特殊的方法，用于从类模板中“构造”对象。每当我们从类中创建对象时，它是第一个被调用的方法。构造函数通常用于初始化类的字段。\n\
  \n构造函数始终与类同名（在我们的案例中为 `Staff`），并且不返回任何值。在声明构造函数时，我们不需要使用 `void` 关键字。\n\n向我们的 `Staff`\
  \ 类添加以下行。\n\n```csharp\npublic Staff(string name)\n{\n    nameOfStaff = name;\n\
  \    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"--------------------------\"\
  );\n}\n```\n\n在这个构造函数中，我们首先用传入构造函数的字符串（`name`）初始化字段 `nameOfStaff`。然后，我们在屏幕上显示 `nameOfStaff`\
  \ 的值，并用一系列横线对其进行下划。\n\n与任何其他方法一样，只要签名不同，我们就可以有多个构造函数。我们可以为类添加另一个构造函数。\n\n```csharp\n\
  public Staff(string firstName, string lastName)\n{\n    nameOfStaff = firstName\
  \ + \" \" + lastName;\n    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"\
  --------------------------\");\n}\n```\n\n这个构造函数有两个参数——`firstName` 和 `lastName`。第一行将两个字符串拼接并将结果字符串赋值给\
  \ `nameOfStaff`。接下来的两行在屏幕上打印 `nameOfStaff` 并用一系列横线对其进行下划。\n\n声明构造函数是可选的。如果你不声明自己的构造函数，C#\
  \ 会自动为你创建一个。默认构造函数只是将类中的所有字段初始化为默认值，对于数值字段，通常为 0；对于字符串字段，则为空字符串。\n\n## 实例化对象\n\n\
  现在我们已经知道了如何创建类，让我们看看如何利用该类来创建对象。这个过程被称为实例化对象。对象也被称为实例。\n\n回顾一下，我们的 `Staff` 类包含以下组件：\n\
  \n### 字段\n- `private const int hourlyRate`\n- `private string nameOfStaff`\n- `private\
  \ int hWorked`\n\n### 属性\n- `public int HoursWorked`\n\n### 方法\n- `public void PrintMessage()`\n\
  - `public int CalculatePay()`\n- `public int CalculatePay(int bonus, int allowance)`\n\
  - `public override string ToString()`\n\n### 构造函数\n- `public Staff(string name)`\n\
  - `public Staff(string firstName, string lastName)`\n\n我们将在 `Program` 类的 `Main()`\
  \ 方法中实例化 `Staff` 对象。\n\n实例化对象的语法为：\n`ClassName objectName = new ClassName(arguments);`\n\
  \n在 `Program` 类的 `Main()` 方法的大括号内添加以下几行。\n\n```csharp\nint pay;\nStaff staff1 =\
  \ new Staff(\"Peter\");\nstaff1.HoursWorked = 160;\npay = staff1.CalculatePay(1000,\
  \ 400);\nConsole.WriteLine(\"Pay = {0}\", pay);\n```\n\n在这里，我们使用第一个构造函数（带有一个参数）来创建我们的\
  \ `staff1` 对象。\n\n一旦创建了对象，我们就可以对象名称后的点运算符（.）来访问 `Staff` 类中的任何公共字段、属性或方法。注意，我们需要在这里使用点运算符，因为我们正尝试从\
  \ `Program` 类访问 `Staff` 类的成员。当我们想要从另一个类访问字段、属性或方法时，点运算符是必要的。\n\n如果你访问的是同一个类的成员，则不需要使用点运算符。一个例子是我们之前从\
  \ `CalculatePay()` 方法中调用 `PrintMessage()` 方法。我们没有使用点运算符，因为这两个方法都属于同一个类。\n\n在创建 `staff1`\
  \ 对象后，下一行显示了我们如何使用公共 `EmployeeType` 属性来给 `hWorked` 字段赋值。\n\n```csharp\nstaff1.HoursWorked\
  \ = 160;\n```\n\n如果我们尝试通过编写以下代码直接访问私有字段 `hWorked`：\n\n```csharp\nstaff1.hWorked\
  \ = 160;\n```\n\n我们将得到错误，因为 `hWorked` 是私有字段，因此只能在 `Staff` 类内部访问。\n\n要调用 `CalculatePay()`\
  \ 方法，我们写道：\n\n```csharp\nstaff1.CalculatePay(1000, 400);\n```\n\n在这个示例中，由于我们有数字\
  \ 1000 和 400（注：此处原文似乎有逻辑重复，翻译已按语意保留）。\n\n\n\n\n`MyClass` 包含一个非静态字段 `message`、一个非静态属性\
  \ `Name` 和一个非静态方法 `DisplayName()`（第 4 到 9 行）。\n\n它还包含一个静态字段 `greetings`、一个静态属性 `Age`\
  \ 和一个静态方法 `DisplayAge()`（第 12 到 17 行）。\n\n要从另一个类访问 `MyClass` 的非静态成员，我们需要像以前一样实例化一个对象：\n\
  \n```csharp\nMyClass classA = new MyClass();\nConsole.WriteLine(classA.message);\n\
  classA.Name = “Jamie”;\nclassA.DisplayName();\n```\n\n然而，要访问静态成员，我们不需要创建任何对象。我们只需要使用类名来访问它们，如下所示。\n\
  \n```csharp\nConsole.WriteLine(MyClass.greetings);\nMyClass.Age = 39;\nMyClass.DisplayAge();\n\
  ```\n\n如果你运行上述代码，你将得到以下输出\n\n```Hello World\nName = Jamie\nGood Morning\nAge = 39\n\
  ```\n\n除了有静态方法、字段、属性和构造函数之外，我们还可以有静态类。静态类只能包含静态成员。下文所示。\n\n```csharp\nstatic class\
  \ MyStaticClass\n{\n    public static int a = 0;\n    public static int B{get; set;}\n\
  }\n```\n\nC# 中的一些预定义类被声明为静态类。`Console` 类就是一个例子。在使用 `Console` 类的方法时，我们不需要创建 `Console`\
  \ 对象。我们只需要编写 `Console.WriteLine(“Hello World”);`。\n\n# 高级方法概念\n\n现在你已经熟悉了类，让我们进入关于类方法声明和使用的一些高级概念。这些概念更加复杂，可能需要阅读多次才能完全理解。\n\
  \n## 使用数组和列表\n\n之前，我们学习了如何使用 `int` 和 `float` 等基本数据类型作为方法的参数。除了使用基本数据类型外，我们还可以使用数组和列表。\n\
  \n要将数组作为参数使用，我们在方法声明中在参数的数据类型后添加一个方括号 `[]`。下文所示示例。\n\n```csharp\npublic void PrintFirstElement(int[]\
  \ a)\n{\n    Console.WriteLine(\"The first element is {0}.\\n\", a[0]);\n}\n```\n\
  \n要调用此方法，我们需要声明一个数组并将其作为参数传递给方法：\n\n```csharp\nint[] myArray = {1, 2, 3, 4, 5};\n\
  PrintFirstElement(myArray);\n```\n\n下一个示例展示了我们如何将列表作为参数使用。\n\n```csharp\npublic\
  \ void PrintFirstListElement(List<int> a)\n{\n    Console.WriteLine(“The first list\
  \ element is {0}.\\n”, a[0]);\n}\n```\n\n要调用该方法，我们需要声明一个列表并将其作为参数传递给方法。\n\n```csharp\n\
  List<int> myList = new List<int> {1, 2, 3};\nPrintFirstListElement(myList);\n```\n\
  \n除了将数组或列表作为方法的参数外，我们还可以从方法返回数组或列表。要从方法返回数组，我们在返回类型后添加方括号 `[]`。\n\n```csharp\npublic\
  \ int[] ReturnUserInput()\n{\n    int[] a = new int[3];\n    for (int i = 0; i <\
  \ a.Length; i++)\n    {\n        Console.Write(\"Enter an integer: \");\n      \
  \  a[i] = Convert.ToInt32(Console.ReadLine());\n        Console.WriteLine(\"Integer\
  \ added to array.\\n\");\n    }\n    return a;\n}\n```\n\n要使用此方法，我们需要声明一个数组并将方法的赋值赋值给它。\n\
  \n```csharp\nint[] myArray2 = ReturnUserInput();\n```\n\n要从方法返回列表，我们使用 `List<>`\
  \ 关键字作为返回类型。示例下：\n\n```csharp\npublic List<int> ReturnUserInputList()\n{\n    List<int>\
  \ a = new List<int>();\n    int input;\n    for (int i = 0; i < 3; i++)\n    {\n\
  \        Console.Write(\"Enter an integer: \");\n        input = Convert.ToInt32(Console.ReadLine());\n\
  \        Console.WriteLine(\"Integer added to list.\\n\");\n        a.Add(input);\n\
  \    }\n    return a;\n}\n```\n\n要使用此方法，我们需要声明一个列表并将方法的赋值赋值给它。\n\n```csharp\nList<int>\
  \ myList2 = ReturnUserInputList();\n```\n\n## 使用 params 关键字\n\n接下来，让我们探索 `params`\
  \ 关键字。当我们不知道方法有多少个参数时，`params` 关键字非常有用。例如，我们可能有一个方法可以打印一系列名称，但我们事先不知道有多少个名字。在这种情况下，我们可以使用数组作为参数并在其前面添加\
  \ `params` 关键字。示例下：\n\n```csharp\npublic void PrintNames(params string[] names)\n\
  {\n    for (int i = 0; i < names.Length; i++)\n    {\n        Console.Write(names[i]\
  \ + “ “);\n    }\n    Console.WriteLine();\n}\n```\n\n要调用此方法，我们可以传递任意数量的字符串。\n\n\
  示例\n\n```csharp\nPrintNames(“Peter”);\nPrintNames(“Yvonne”);\nPrintNames(“Jamie”);\n\
  ```\n\n输出\n\n```\nPeter \nYvonne \nJamie \n```\n\n在方法声明中，`params` 关键字之后可以跟任意数量的参数。注意，在方法声明中，`params`\
  \ 后面只能跟一个数组，且必须是最后一个参数。\n\n## 值类型 vs 引用类型\n\n我希望你现在已经很好理解了类是如何工作的。在结束本章之前，我想回顾一下值类型和引用类型的概念。在第\
  \ 4 章中，我们学习了 C# 中的两种主要数据类型——值类型和引用类型。在传递值类型变量和引用类型变量之间存在区别。\n\n当你传递值类型变量时，对该变量的更改仅在方法内部有效。一旦程序退出方法，更改将不再有效。\n\
  \n另一方面，如果你传递的是引用类型变量，对该变量的任何更改在方法结束后仍然有效。\n\n考虑下面的类：\n\n```csharp\nclass MethodDemo\n\
  {\n    public void PassByValue(int a)\n    {\n        a = 10;\n        Console.WriteLine(\"\
  a inside method = {0}\", a);\n    }\n    public void PassByReference(int[] b)\n\
  \    {\n        b[0] = 5;\n        Console.WriteLine(\"b[0] inside method = {0}\"\
  , b[0]);\n    }\n}\n```\n\n在类内部有两个方法。第一个方法接受值类型变量并尝试更改该变量的值。它随后打印变量的值。第二个方法接受一个数组（引用类型）并尝试更改数组第一个元素的值。它随后打印该元素的值。\n\
  \n在我们的 `Main()` 程序中，假设有以下几行代码：\n\n```csharp\nint a = 2;\nint[] b = {1, 2, 3 };\n\
  MethodDemo obj = new MethodDemo();\nConsole.WriteLine(\"a before = {0}\", a);\n\
  obj.PassByValue(a);\nConsole.WriteLine(\"a after = {0}\", a);\nConsole.WriteLine(\"\
  \\n\\n\");\nConsole.WriteLine(\"b[0] before = {0}\", b[0]);\nobj.PassByReference(b);\n\
  Console.WriteLine(\"b[0] after = {0}\", b[0]);\n```\n\n如果你运行该程序，你将得到\n\n```\na before\
  \ = 2\na inside method = 10\na after = 2\n\nb[0] before = 1\nb[0] inside method\
  \ = 5\nb[0] after = 5\n```\n\n\n\n\n继承是面向对象编程的核心概念之一。简单来说，继承允许我们从现有的类创建一个新类，从而能够有效地复用现有代码。\n\
  \n## 编写父类\n\n假设我们正在为一家健身俱乐部编写程序，该俱乐部有两种类型的会员：VIP 和普通会员（Normal）。为了实现这一点，我们先创建一个名为\
  \ `Member` 的类。\n\n```csharp\nclass Member\n{\n  protected int annualFee;\n  private\
  \ string name;\n  private int memberID;\n  private int memberSince;\n}\n```\n\n\
  `Member` 包含一个受保护字段（protected）和三个私有字段（private）。受保护字段只能在声明它的类以及任何派生自它的类中访问。我们很快就会讨论派生类。\n\
  \n接下来，让我们写一个 `ToString()` 方法来显示这四个字段的值。\n\n```csharp\npublic override string ToString()\n\
  {\n  return \"\\nName: \" + name + \"\\nMember ID: \" + memberID + \"\\nMember Since:\
  \ \" + memberSince + \"\\nTotal Annual Fee: \" + annualFee;\n}\n```\n\n最后，我们为 `Member`\
  \ 类添加两个构造函数。\n\n```csharp\npublic Member()\n{\n  Console.WriteLine(\"Parent Constructor\
  \ with no parameter\");\n}\npublic Member(string pName, int pMemberID, int pMemberSince)\n\
  {\n  Console.WriteLine(\"Parent Constructor with 3 parameters\");\n  name = pName;\n\
  \  memberID = pMemberID;\n  memberSince = pMemberSince;\n}\n```\n\n第一个构造函数仅仅打印一行“Parent\
  \ Constructor with no parameter”。\n\n第二个构造函数则更有趣。它打印“Parent Constructor with 3 parameters”，并将其参数赋值给\
  \ `Member` 类中的三个私有字段。\n\n## 编写子类\n\n现在，让我们学习如何从 `Member` 类派生出一个类。派生类被称为子类（child\
  \ classes），而它们派生自的类则被称为父类（parent classes）或基类（base classes）。\n\n派生类继承父类的所有的公共和受保护成员。换句话说，它可以使用这些字段、属性和方法，就像它们是自己代码的一部分一样。\n\
  \n我们的父类（`Member`）包含以下内容：\n\n### 字段\n- `protected int annualFee`\n- `private string\
  \ name`\n- `private int memberID`\n- `private int memberSince`\n\n### 方法\n- `public\
  \ override string ToString()`\n\n### 构造函数\n- `public Member()`\n- `public Member(string\
  \ pName, int pMemberID, int pMemberSince)`\n\n我们将从 `Member` 类派生出两个类——`NormalMember`\
  \ 和 `VIPMember`。\n\n首先，我们声明子类 `NormalMember`。我们使用冒号（`:`）来指示它派生自 `Member` 类：\n\n\
  ```csharp\nclass NormalMember : Member\n{\n}\n```\n\n现在，我们需要为子类编写构造函数。子类的构造函数是基于父构造函数构建的。每当我们创建一个子对象时，父类的构造函数总是会被调用。\n\
  \n创建子类构造函数有两种方法。第一种是像其他构造函数一样简单地声明。\n\n```csharp\npublic NormalMember()\n{\n  Console.WriteLine(\"\
  Child constructor with no parameter\");\n}\n```\n\n当我们像上面那样声明构造函数时，C#会在父类中查找无参数构造函数（即没有参数的构造函数），并在执行子类构造函数中的代码之前先调用它。如果你使用这个构造函数创建子对象，屏幕上将显示以下两行：\n\
  \n`Parent Constructor with no parameter`\n`Child constructor with no parameter`\n\
  \n第一行来自父构造函数，第二行来自子构造函数。\n\n声明子类构造函数的第二种方法是使用冒号（`:`）和 `base` 关键字来调用父类中的非参数构造函数。示如下所示：\n\
  \n```csharp\npublic NormalMember(string remarks) : base (“Jamie”, 1, 2015)\n{\n\
  \  Console.WriteLine(\"Remarks = {0}\", remarks);\n}\n```\n\n当我们调用父类中的非参数构造函数时，我们需要向其参数传递值。在上面的示例中，我们将值“Jamie”、1\
  \ 和 2015 传递给父构造函数。这些值随后会被分别赋值给基类中的 `name`、`memberID` 和 `memberSince` 字段。\n\n在例例中，我们将固定值作为参数传递给基构造函数。然而，更好的方法是通过子类构造函数传递参数。下面的示例显示了如何这样做。将之前的构造函数替换为下面的构造函数：\n\
  \n```csharp\npublic NormalMember(string remarks, string name, int memberID, int\
  \ memberSince) : base (name, memberID, memberSince)\n{\n  Console.WriteLine(\"Child\
  \ Constructor with 4 parameters\");\n  Console.WriteLine(\"Remarks = {0}\", remarks);\n\
  }\n```\n\n这个新的子构造函数有四个参数。第一个参数是一个名为 `remarks` 的 `string` 参数。该参数在子类构造函数内部使用。\n\n\
  第二、第三和第四个参数在子类构造函数中没有使用。相反，它们根据名称作为参数传递给父构造函数。例如，子类构造函数的第二个参数（`string name`）被传递给父构造函数的第一个参数（`name`）。\n\
  \n当我们使用此构造函数创建子对象时，编写如下代码：\n\n```csharp\nNormalMember myChildMember = new NormalMember(“Special\
  \ Rate”, \"James\", 1, 2010);\n```\n\n带 3 个参数的父构造函数会被调用。“James”、1 和 2010 被传递给基构造函数。在幕后，这些值被赋值给基类的\
  \ `name`、`memberID` 和 `memberSince`。\n\n执行基构造函数后，子构造函数将执行。字符串“Special Rate”被赋值给\
  \ `remarks` 并显示在屏幕上。\n\n当你运行代码时，将得到以下输出：\n\n`Parent Constructor with 3 parameters`\n\
  `Child Constructor with 4 parameters`\n`Remarks = Special Rate`\n\n为我们的子类创建构造函数后，让我们创建一个计算普通会员年费的方法。代码如下：\n\
  \n```csharp\npublic void CalculateAnnualFee()\n{\n  annualFee = 100 + 30;\n}\n```\n\
  \n在上面的代码中编写 `annualFee` 时，我们正在访问父类中的受保护字段 `annualFee`。记得子类不需要创建父类的实例即可访问其受保护字段。\n\
  \n这就是子类 `NormalMember` 的全部。该类包含以下内容：\n\n### 字段\n继承自父类：\n- `protected int annualFee`\n\
  \n### 方法\n继承自父类：\n- `public override string ToString()`\n在子类中声明：\n- `public void\
  \ CalculateAnnualFee()`\n\n### 构造函数\n- `public NormalMember()`\n- `public NormalMember(string\
  \ remarks, string name, int memberID, int memberSince)`\n\n接下来，让我们编写另一个继承自 `Member`\
  \ 的类。这次，派生类被称为 `VIPMember`。代码如下：\n\n```csharp\nclass VIPMember : Member\n{\n  public\
  \ VIPMember(string name, int memberID, int memberSince) : base (name, memberID,\
  \ memberSince)\n  {\n    Console.WriteLine(\"Child Constructor with 3 parameters\"\
  );\n  }\n  public void CalculateAnnualFee()\n  {\n    annualFee = 1200;\n  }\n}\n\
  ```\n\n该类有一个构造函数（带 3 个参数）和一个方法 `CalculateAnnualFee()`。这里的 `CalculateAnnualFee()`\
  \ 方法使用的计算年费的公式与 `NormalMember` 类中的 `CalculateAnnualFee()` 方法不同。这两个方法共享相同的名称（和签名）是可以的，因为它们位于不同的类中。\n\
  \n`VIPMember` 类包含以下内容：\n\n### 字段\n继承自父类：\n- `protected int annualFee`\n\n### 方法\n\
  继承自父类：\n- `public override string ToString()`\n在子类中声明：\n- `public void CalculateAnnualFee()`\n\
  \n\n\n\n\n```csharp\npublic void CalculateAnnualFee()\n```\n\n### 构造函数\n\n```csharp\n\
  public VIPMember(string name, int memberID, int memberSince)\n```\n\n## Main() 方法\n\
  \n现在我们已经写好了所需的三个类，让我们来编写 `Main()` 方法的代码。\n\n首先，我们将从两个派生类中创建两个对象。\n\n```csharp\n\
  NormalMember mem1 = new NormalMember(\"Special Rate\", \"James\", 1, 2010);\nVIPMember\
  \ mem2 = new VIPMember(\"Andy\", 2, 2011);\n```\n\n`mem1` 是使用 `NormalMember` 类中的\
  \ 4 参数构造函数创建的。`mem2` 是使用 `VIPMember` 类中的 3 参数构造函数创建的。\n\n接下来，我们将使用类中的 `CalculateAnnualFee()`\
  \ 方法。\n\n```csharp\nmem1.CalculateAnnualFee();\nmem2.CalculateAnnualFee();\n```\n\
  \n由于 `mem1` 是 `NormalMember` 类的实例，因此执行了该类中的 `CalculateAnnualFee()` 方法。因此，`mem1`\
  \ 的年费为 `100 + 12*30 = 460`。对于 `mem2`，年费为 1200，因为它使用了来自 `VIPMember` 类的方法。\n\n最后，让我们使用父类（`Member`）的\
  \ `ToString()` 方法在屏幕上显示信息。我们写下：\n\n```csharp\nConsole.WriteLine(mem1.ToString());\n\
  Console.WriteLine(mem2.ToString());\n```\n\n由于 `ToString()` 方法属于父类且是公共的，`mem1` 和\
  \ `mem2` 均继承了该方法，因此可以在 `Main()` 方法中使用它。这有助于代码重用，因为我们不需要为两个子类重复重写 `ToString()` 方法。\n\
  \n运行程序时，你将得到以下输出：\n\n```\nParent Constructor with 3 parameters\nChild Constructor\
  \ with 4 parameters\nMessage = Special Rate\nParent Constructor with 3 parameters\n\
  Child Constructor with 3 parameters\nName: James\nMember ID: 1\nMember Since: 2010\n\
  Total Annual Fee: 460\nName: Andy\nMember ID: 2\nMember Since: 2011\nTotal Annual\
  \ Fee: 1200\n```\n\n### 多态\n\n现在我们已经看到了继承是如何工作的示例，让我们来讨论另一个与继承紧密相关的话题——多态概念。多态指的是程序根据对象的运行时类型为对象使用正确方法的能力。\n\
  \n解释多态最好的方法是通过例子。让我们扩展一下上面的健身俱乐部的例子。\n\n首先，删除上一个 `Main()` 方法中的所有代码，并添加以下几行：\n\n\
  ```csharp\nMember[] clubMembers = new Member[5];\nclubMembers[0] = new NormalMember(\"\
  Special Rate\", \"James\", 1, 2010);\nclubMembers[1] = new NormalMember(\"Normal\
  \ Rate\", \"Andy\", 2, 2011);\nclubMembers[2] = new NormalMember(\"Normal Rate\"\
  , \"Bill\", 3, 2011);\nclubMembers[3] = new VIPMember(\"Carol\", 4, 2012);\nclubMembers[4]\
  \ = new VIPMember(\"Evelyn\", 5, 2012);\n```\n\n在这里，我们声明了一个 `Member` 类型的数组并向其添加了\
  \ 5 个成员。前三个成员是 `NormalMember` 类的实例，后两个是 `VIPMember` 类的实例。\n\n尽管 `clubMembers` 被声明为\
  \ `Member` 类型的数组，但我们可以将 `NormalMember` 和 `VIPMember` 的实例赋值给它，因为它们是 `Member` 类的子类。我们不需要为\
  \ `NormalMember` 和 `VIPMember` 对象分别声明数组。\n\n接下来，我们将使用 `foreach` 循环计算每个成员的年费并显示信息。为了做到这一点，我们写道：\n\
  \n```csharp\nforeach (Member m in clubMembers)\n{\n    m.CalculateAnnualFee();\n\
  \    Console.WriteLine(m.ToString());\n}\n```\n\n如果你在此阶段尝试运行程序，你会得到错误，提示 `Member`\
  \ 不包含 `CalculateAnnualFee`。这是因为 `clubMembers` 被声明为 `Member` 类型的数组。因此，当我们写 `m.CalculateAnnualFee()`\
  \ 时，编译器尝试执行 `Member` 类中的 `CalculateAnnualFee()` 方法。发生错误是因为我们在 `Member` 父类中没有这样的方法；我们只在两个子类中有该方法。为了修正此错误，我们必须向父类中添加以下方法。\n\
  \n```csharp\npublic void CalculateAnnualFee()\n{\n    annualFee = 0;\n}\n```\n\n\
  现在运行程序并注意每个成员的“Total Annual Fee”。你注意到什么了？它们应该都显示 $0。这意味着被调用的 `CalculateAnnualFee()`\
  \ 方法是父类中的那个。这并不意外，因为 `clubMembers` 被声明为 `Member` 类型。\n\n如果你想调用子类方法，则需要做两处更改。\n\n\
  首先，你需要将父类方法声明为 `virtual`，如下：\n\n```csharp\npublic virtual void CalculateAnnualFee()\n\
  {\n    annualFee = 0;\n}\n```\n\n`virtual` 关键字告诉编译器该方法可以在派生类中重写。接下来，在子类中，你必须使用 `override`\
  \ 关键字重写该方法：\n\n```csharp\n// 在 VIPMember 类\npublic override void CalculateAnnualFee()\n\
  {\n    annualFee = 1200;\n}\n\n// 在 NormalMember 类\npublic override void CalculateAnnualFee()\n\
  {\n    annualFee = 100 + 12*30;\n}\n```\n\n现在如果你运行程序，前三个成员（`NormalMember`）的年费将是\
  \ 460，后两个（`VIPMember`）将对应的为 1200。这就是多态的结果。多态简单来说意味着在运行时，即使对象被声明为 `Member` 类型，程序也足够智能到可以使用正确子类的\
  \ `CalculateAnnualFee()` 方法。\n\n### 抽象类和方法\n\n现在我们已经熟悉了继承和多态，让我们来讨论 C# 中两种特殊的“父类”——抽象类和接口。\n\
  \n首先，让我们看看抽象类。\n\n抽象类是一种特殊的类，专门创建用于作为其他类派生的基类。它们不能被实例化。也就是说，如果 `FourWheelVehicles`\
  \ 是一个抽象类，语句\n\n```csharp\nFourWheelVehicle myVeh = new FourWheelVehicle();\n```\n\
  \n将为你报错，因为你不能创建抽象类的对象。\n\n\n\n\n抽象类可以像其他类一样拥有字段、属性和方法。然而，它们不能拥有静态成员。此外，抽象类可以有一种特殊类型的方法，称为抽象方法。抽象方法是没有方法体的方法，并且必须在派生类中实现。它们只能存在于抽象类中。在某种程度上，抽象方法就像一份合同。如果你想确保任何继承你类的类都实现了某个方法，你可以将类声明为抽象类，并将该方法声明为抽象方法。\n\
  \n要声明抽象类，只需在 `class` 关键字之前添加 `abstract` 关键字，如下：\n\n```csharp\nabstract class MyClass\n\
  {\n}\n```\n\n在抽象类内部声明抽象方法，在返回类型之前添加 `abstract` 关键字，如下：\n\n```csharp\npublic abstract\
  \ void MyAbstractMethod();\n```\n\n由于抽象方法没有方法体，我们用分号 (;) 结束声明。\n\n要在派生类中实现抽象方法，我们使用\
  \ `override` 关键字，如下：\n\n```csharp\npublic override void MyAbstractMethod()\n{\n\
  }\n```\n\n下面的代码展示了抽象类的示例。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
  \ AbstractClassDemo\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            //MyAbstractClass abClass = new MyAbstractClass();\n\
  \            ClassA a = new ClassA();\n            a.PrintMessage();\n         \
  \   a.PrintMessageAbstract();\n            Console.Read();\n        }\n    }\n\n\
  \    abstract class MyAbstractClass\n    {\n        private string message = \"\
  Hello C#\";\n        public void PrintMessage()\n        {\n            Console.WriteLine(message);\n\
  \        }\n        public abstract void PrintMessageAbstract();\n    }\n\n    class\
  \ ClassA : MyAbstractClass\n    {\n        public override void PrintMessageAbstract()\n\
  \        {\n            Console.WriteLine(\"C# is fun!\");\n        }\n    }\n}\n\
  ```\n\n抽象类位于第 21 行到第 29 行。它包含一个私有字段 `message` 和一个公共方法 `PrintMessage()`。它在第 28 行还包含一个抽象方法\
  \ `PrintMessageAbstract()`。第 31 行到第 37 行显示了实现抽象方法的派生类（第 33 行到第 36 行）。\n\n如果你运行上述程序，将得到：\n\
  \n```\nHello C#\nC# is fun!\n```\n\n注意第 13 行用 `//` 符号注释掉了？如果你移除两个斜杠，将会得到一个错误，因为抽象类不能实例化。\n\
  \n### 接口\n\n接下来，让我们来看接口。接口与抽象类相似，不能实例化且必须继承。然而，接口比抽象类更具概念性。它们只能包含没有方法体的方法。此外，它们不能包含字段，但可以包含属性。接口不能有静态成员。当子类继承接口时，我们说它实现了接口。\n\
  \n抽象类和接口之间的关键区别之一是，类只能继承一个抽象类，但可以实现多个接口。我们不会展示多个接口实现的示例，因为那是超出本书范围的高级主题。\n\n接面的代码展示了类如何实现一个接口的示例。接口名称通常以字母\
  \ `I` 开头。接口中的所有属性和方法都是公共的，因此不需要为它们添加任何访问修饰符。\n\n```csharp\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
  \nnamespace InterfaceDemo\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            ClassA a = new ClassA();\n            a.MyNumber\
  \ = 5;\n            a.InterfaceMethod();\n            Console.Read();\n        }\n\
  \    }\n\n    interface IShape\n    {\n        int MyNumber\n        {\n       \
  \     get;\n            set;\n        }\n        void InterfaceMethod();\n    }\n\
  \n    class ClassA : IShape\n    {\n        private int myNumber;\n        public\
  \ int MyNumber\n        {\n            get\n            {\n                return\
  \ myNumber;\n            }\n            set\n            {\n                if (value\
  \ > 0)\n                {\n                    myNumber = value;\n             \
  \   }\n                else\n                {\n                    myNumber = 0;\n\
  \                }\n            }\n        }\n\n        public void InterfaceMethod()\n\
  \        {\n            Console.WriteLine(\"The number is \" + MyNumber);\n    \
  \    }\n    }\n}\n```\n\n接口位于第 20 行到第 28 行。`ClassA` 在第 30 行实现了 `IShape`。属性 `MyNumber`\
  \ 在第 33 行到第 47 行实现，`InterfaceMethod` 在第 49 行到第 52 行实现。\n\n\n\n在第 3 章和第 4 章中，我们查看了\
  \ C# 提供的一些内置数据类型。这些包括如 `int`、`float` 和 `double` 等值类型，以及数组、字符串和列表等引用数据类型。此外，我们在第\
  \ 7 章和第 8 章中还学习了如何编写自己的类。类（Class）可以被视为一种高级的用户定义数据类型，它将一组相关的字段、属性和方法分组到一个逻辑单元中。\n\
  \n在本章中，我们将查看 C# 中的另外两种用户定义数据类型——`enum`（枚举）和 `struct`（结构体）。\n\n## Enum (枚举)\n\n`enum`（enumeration\
  \ type 的缩写）是一种特殊的数据类型，允许程序员为一组整数常量提供有意义名称。\n\n要声明一个枚举，我们使用 `enum` 关键字，后跟枚举的名称。枚举的成员包含在大括号中，并用逗号分隔。\n\
  \n下文是一个示例：\n\n```csharp\nenum DaysOfWeek\n{\nSun, Mon, Tues, Wed, Thurs, Fri, Sat\n\
  }\n```\n\n注意，我们不在最后一个成员的末尾加分号。\n\n在声明 `DaysOfWeek` 枚举后，我们可以像这样声明并初始化一个 `DaysOfWeek`\
  \ 变量：\n\n```csharp\nDaysOfWeek myDays = DaysOfWeek.Mon;\n```\n\n变量的名为 `myDays`。如果我们写下\n\
  \n```csharp\nConsole.WriteLine(myDays);\n```\n\n我们将得到\n\n`Mon`\n\n默认情况下，枚举中的每个成员都被分配一个整数值，从零开始。也就是说，在我们的示例中，`Sun`\
  \ 被赋值为 0，`Mon` 为 1，`Tues` 为 2，依此类推。\n\n由于枚举的成员本质上是整数，我们可以我们可以将 `DaysOfWeek` 变量强制转换为\
  \ `int`，反之亦然。例如，\n\n```csharp\nConsole.WriteLine((int)myDays);\n```\n\n将得到整数 `1`，而通过\n\
  \n```csharp\nConsole.WriteLine((DaysOfWeek)1);\n```\n\n将得到 `Mon`。\n\n如果你想为枚举成员分配一组不同的整数，可以执行以下操作：\n\
  \n```csharp\nenum DaysOfWeekTwo\n{\nSun = 5, Mon = 10, Tues, Wed, Thurs, Fri, Sat\n\
  }\n```\n\n现在，`Sun` 被赋值为 5，`Mon` 被赋值为 10。由于我们没有为 `Tues` 到 `Sat` 赋值，10 之后的连续数字将被分配给它们。即\
  \ `Tues` = 11，`Wed` = 12，依此类推。\n\n所有枚举在内部都存储为整数（`int`）。如果你想将底层数据类型从 `int` 更改其他数据类型，可以在枚举名称后添加冒号，然后是所需的数据类型。除了\
  \ `char` 之外，允许任何整数数据类型。例如：\n\n```csharp\nenum DaysOfWeekThree : byte\n{\nSun, Mon,\
  \ Tues, Wed, Thurs, Fri, Sat\n}\n```\n\n当然，如果你使用 `byte` 数据类型，你无法执行如下操作：\n\n```csharp\n\
  enum DaysOfWeekFour : byte\n{\nSun = 300, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\
  \n因为 `byte` 的范围是从 0 到 255。\n\n使用枚举有两个主要原因。第一个是提高代码的可读性。`myDays = DaysOfWeek.Mon;`\
  \ 语句比 `myDays = 1;` 更具自解释性。第二个原因是限制变量可以取的值的值。如果我们有一个存储星期几日的变量，可能会无意中给它赋值为 10。当我们使用枚举时可以防止这种情况，因为我们只能分配枚举中预定义的成员。\n\
  \n## Struct (结构体)\n\n现在，让我们来看 `struct` 数据类型。\n\n`struct` 在许多方面与 `class` 相似。像类一样，它们包含属性、构造函数、字段等元素，并允许你将相关的成员分组到单个包中，以便你将其作为一个整体进行操作。\n\
  \n要声明一个结构体，你使用 `struct` 关键字。一个示例是：\n\n```csharp\nstruct MyStruct\n{\n    //字段\n\
  \    private int x, y;\n    private AnotherClass myClass;\n    private Days myDays;\n\
  \n    // 构造函数\n    public MyStruct(int a, int b, int c)\n    {\n        myClass\
  \ = new AnotherClass();\n        myClass.number = a;\n        x = b;\n        y\
  \ = c;\n        myDays = Days.Mon;\n    }\n\n    // 方法\n    public void PrintStatement()\n\
  \    {\n        Console.WriteLine(\"x = {0}, y = {1}, myDays = {2}\", x, y, myDays);\n\
  \    }\n}\n\nclass AnotherClass\n{\n    public int number;\n}\n\nenum Days { Mon,\
  \ Tues, Wed }\n```\n\n结构体从第 1 行到第 23 行。在第 4 行，我们为结构体声明了两个 `private int` 字段。在第 5\
  \ 行，我们声明了另一个名为 `myClass` 的私有字段。该字段是类 `AnotherClass` 的实例。在第 6 行，我们声明了一个枚举变量 `myDays`。这两个字段（`myClass`\
  \ 和 `myDays`）特别包含示例中，用于演示如何将类实例和枚举变量作为结构体的字段。结构体（以及类）可以包含枚举变量以及其他结构体的类实例作为字段。\n\n\
  在声明字段后，我们声明了构造函数（第 9 行到第 16 行）。在第 19 行到第 22 行，我们声明了方法。\n\n在第 25 行到第 28 行，我们声明了结构体。在第\
  \ 30 行，我们声明了类。在第 31 行到第 33 行，我们声明了枚举。\n\n# 第 10 章 LINQ\n\nLINQ 代表语言查询（Language Integrated\
  \ Query），是 C# 的一项强大功能，允许你在程序中查询数据。在本章中，我们将涵盖 LINQ 的简要介绍，以及如何使用 LINQ 的示例。\n\n让我们先学习如何编写\
  \ LINQ 查询。LINQ 查询的典型语法是 `from... where... select`。\n\n假设我们有一个数组，并想从数组中选择所有的偶数。我们可以通过\
  \ LINQ 轻松实现。\n\n首先，让我们声明数组。\n\n```csharp\nint[] numbers = { 0, 1, 2, 3, 4, 5, 6\
  \ };\n```\n\n接下来，我们编写如下的 LINQ 查询：\n\n```csharp\nvar evenNumQuery =\nfrom num in\
  \ numbers\nwhere (num % 2) == 0\nselect num;\n```\n\n查询位于第 2 行到第 4 行。有 SQL 经验的读者可能会觉得这个查询非常熟悉。查询由三个部分组成。第一部分\
  \ `from num in numbers` 表明我们正在对 `numbers` 数组执行查询。`num` 是我们表示数组中单个元素的名称。下一行 `where\
  \ (num % 2) == 0` 测试单个元素，判断 `num` 除以 2 的余数是否为零。如果是，则 `num` 是偶数。第三行 `select num`\
  \ 选择所有符合条件的元素。\n\n此结果被赋值给变量 `evenNumQuery`，它被声明为 `var` 类型。每当我们希望编译器自己确定数据类型时，就会使用\
  \ `var` 这种特殊数据类型。这是必要的，因为在我们的示例中，`evenNumQuery` 的数据类型非常复杂；最好让 C# 为我们推断数据类型。\n\n\
  创建查询语句后，我们可以通过编写以下代码来执行查询：\n\n```csharp\nforeach (int i in evenNumQuery)\n{\n  \
  \  Console.WriteLine(\"{0} is an even number\", i);\n}\n```\n\n\n\n如果你运行这段代码，你将得到：\n\
  \n`0 is an even number`\n`2 is an even number`\n`4 is an even number`\n`6 is an\
  \ even number`\n\n就是这样。使用 LINQ 这么简单。现在让我们来看一个更复杂的 LINQ 示例。\n\n假设你有一个 `Customer`\
  \ 类，其中包含 `Name`、`Phone`、`Address` 和 `Balance` 属性，并有一个用于初始化这些属性的构造函数。\n\n我们可以在 `Main()`\
  \ 方法中使用下面的代码创建一个 `Customer` 对象的列表。\n\n```csharp\nList<Customer> customers = new\
  \ List<Customer>();\ncustomers.Add(new Customer(\"Alan\", \"80911291\", \"ABC Street\"\
  , 25.60m));\ncustomers.Add(new Customer(\"Bill\", \"19872131\", \"DEF Street\",\
  \ -32.1m));\ncustomers.Add(new Customer(\"Carl\", \"29812371\", \"GHI Street\",\
  \ -12.2m));\ncustomers.Add(new Customer(\"David\", \"78612312\", \"JKL Street\"\
  , 12.6m));\n```\n\n现在，假设我们想要搜索所有余额为负数的客户，我们可以使用下面的 LINQ 查询。\n\n```csharp\nvar overdue\
  \ =\nfrom cust in customers\nwhere cust.Balance < 0\norderby cust.Balance ascending\n\
  select new { cust.Name, cust.Balance };\n```\n\n这个查询与第一个查询相似，但有两个主要区别。在这里，我们使用了两个额外的关键字\
  \ `orderby` 和 `ascending` 来按升序排列查询结果。\n\n此外，我们在 `select` 语句中使用了 `new` 关键字。当我们想要从对象中选择多个一个字段时，就需要\
  \ `new` 关键字。\n\n要执行并打印结果，我们可以使用下下面的 `foreach` 循环：\n\n```csharp\nforeach (var cust\
  \ in overdue)\n    Console.WriteLine(\"Name = {0}, Balance = {1}\", cust.Name, cust.Balance);\n\
  ```\n\n我们将得到：\n\n`Name = Bill, Balance = -32.1`\n`Name = Carl, Balance = -12.2`\n\
  \n# 第 11 章：文件处理\n\n太棒了！我们已经来到了书中项目之前的最后一章。在本章中，我们将学习如何读取和写入外部文件。\n\n在之前的第 5 章中，我们学习了如何使用\
  \ `ReadLine()` 方法获取用户输入。然而，在某些情况下，让用户向我们的程序输入数据可能并不实际，特别是当我们的程序需要处理大量数据时。在这种情况下，更方便的方法是将所需信息准备为外部文件，并让我们的程序从文件中读取信息。\n\
  \nC# 为我们提供了许多类来处理文件。我们在本章中将看到的类是 `File`、`StreamWriter` 和 `StreamReader` 类。这三个类都位于\
  \ `System.IO` 命名空间。要使用本章中的方法，你需要添加指令：\n\n```csharp\nusing System.IO;\n```\n\n##\
  \ 读取文本文件\n\n要从文本文件中读取数据，我们使用 `StreamReader` 类。\n\n假设我们要从位于 C 盘的“myFile.txt”文件读取数据。下面的示例展示了如何操作。\n\
  \n```csharp\n1 string path = \"c:\\\\myFile.txt\";\n2 using (StreamReader sr = new\
  \ StreamReader(path))\n3 {\n4 while (sr.EndOfStream != true)\n5 {\n6 Console.WriteLine(sr.ReadLine());\n\
  7 }\n9 sr.Close();\n10 }\n```\n\n在第 1 行，我们首先声明了一个 `string` 变量 `path`并将文件路径赋值给该变量。\n\
  \n`string path = \"c:\\\\myFile.txt\";`\n\n注意，在编写路径时我们必须使用双斜杠 `\\\\`。这是因为如果我们只使用单斜杠，编译器会认为单斜杠是转义序列的开头，并将\
  \ `\\m` 解释为转义序列。这将导致错误。\n\n在第 2 行，我们创建了一个 `StreamReader` 实例。`StreamReader` 构造函数接受一个参数——要读取的文件路径。\n\
  \n```csharp\nStreamReader sr = new StreamReader(path)\n```\n\n注意我们是否在第 2 行 `using`\
  \ 关键字后面的括号对中创建了这个 `StreamReader` 实例？\n\n这里的 `using` 关键字与我们在编写指令（directive）时使用的那个不同。\n\
  \n这里的 `using` 关键字确保 `Dispose()` 方法始终能被调用。`Dispose()` 方法是 `System` 命名空间中的一个预写方法，一旦不再需要文件和流等未托管资源，它就会关闭或释放这些资源。当我们使用\
  \ `using` 关键字时，我们确保即使发生异常，`Dispose()` 方法也会被调用，并防止我们的代码到达第 9 行（那里我们手动关闭文件）。在处理文件时，始终使用\
  \ `using` 关键字是一个良好的习惯。读取和关闭文件的代码包含在 `using` 语句后的大括号 `{ }` 中。\n\n从第 4 行到第 7 行，我们使用\
  \ `while` 循环逐行读取文本文件。\n\n```csharp\nwhile (sr.EndOfStream != true)\n{\n    Console.WriteLine(sr.ReadLine());\n\
  }\n```\n\n`EndOfStream` 是 `StreamReader` 类的一个属性，当到达文件末尾时它返回 `true`。只要没有到达文件末尾，`while`\
  \ 循环就会继续。\n\n```csharp\nConsole.WriteLine(sr.ReadLine());\n```\n\n### 选项 1：try…catch\n\
  \n第一个选项如下所示使用 `try…catch`：\n\n```csharp\n1 try\n2 {\n3 using (StreamReader sr =\
  \ new StreamReader(path))\n4 {\n5 while (sr.EndOfStream != true)\n6 {\n7 Console.WriteLine(sr.ReadLine());\n\
  8 }\n9 sr.Close();\n10 }\n11 catch (FileNotFoundException e)\n12 {\n13 Console.WriteLine(e.Message);\n\
  14 }\n```\n\n从第 1 行到第 11 行，我们在 `try` 块中尝试打开、读取并关闭文件。从第 11 行到第 14 行，如果文件未找到，我们使用\
  \ `catch` 块捕获 `FileNotFoundException` 异常。在 `catch` 块中，我们告知用户文件缺失。\n\n### 选项 2：File.Exists()\n\
  \n处理“找不到文件”场景的第二种方法是使用 `File` 类中的 `Exists()` 方法。正如名称所示，`Exists()` 方法检查文件是否存在。\n\n\
  使用 `Exists()` 方法，我们在使用 `StreamReader` 打开并读取文件之前，使用 `if` 语句检查文件是否存在。\n\n```csharp\n\
  if (File.Exists(path))\n{\n    using (StreamReader sr = new StreamReader(path))\n\
  \    {\n        while (sr.EndOfStream != true)\n        {\n            Console.WriteLine(sr.ReadLine());\n\
  \        }\n        sr.Close();\n    }\n}\nelse\n{\n    // 执行其他操作\n}\n```\n\n在 `else`\
  \ 块中，我们可以编写代码在文件未找到时创建它。\n\n## 写入文本文件\n\n接下来，让我们看看如何写入文本文件。\n\n写入文本文件，我们使用 `StreamWriter`\
  \ 类。\n\n如果你想将数据追加到现有文件中，可以这样创建 `StreamWriter` 实例：\n\n```csharp\nStreamWriter sw\
  \ = new StreamWriter(path, true);\n```\n\n其中 `path` 是文件路径，`true` 表示我们要追加数据。\n\n\
  如果你想覆盖文件中的任何现有数据，可以这样创建 `StreamWriter` 实例：\n\n```csharp\nStreamWriter sw = new StreamWriter(path);\n\
  ```\n\n当我们创建 `StreamWriter` 实例时，构造函数会在给定路径查找文件。如果未找到文件，它将创建该文件。\n\n\n\n在我们实例化 `StreamWriter`\
  \ 对象后，可以使用下所示的 `WriteLine()` 方法开始向文件写入内容：\n\n```\nsw.WriteLine(“It is easy to write\
  \ to a file.”);\n```\n\n当我们完成对文件的写入后，必须通过写入以下代码来关闭文件：\n\n```c\nsw.Close();\n```\n\
  \n请注意，当你写入文本文件时，将代码封装在 `using` 语句中也是良好的习惯。下面的代码展示了这些内容如何结合在一起的完整示例。\n\n```c\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Threading.Tasks;\nusing System.IO;\n\nnamespace FileDemo\n{\n    class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
