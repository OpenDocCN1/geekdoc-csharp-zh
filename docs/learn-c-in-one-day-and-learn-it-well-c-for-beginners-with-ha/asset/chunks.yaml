  trans: "\n在第 3 章和第 4 章中，我们查看了 C# 提供的一些内置数据类型。这些包括如 `int`、`float` 和 `double` 等值类型，以及数组、字符串和列表等引用数据类型。此外，我们在第\
    \ 7 章和第 8 章中还学习了如何编写自己的类。类（Class）可以被视为一种高级的用户定义数据类型，它将一组相关的字段、属性和方法分组到一个逻辑单元中。\n\
    \n在本章中，我们将查看 C# 中的另外两种用户定义数据类型——`enum`（枚举）和 `struct`（结构体）。\n\n## Enum (枚举)\n\n\
    `enum`（enumeration type 的缩写）是一种特殊的数据类型，允许程序员为一组整数常量提供有意义名称。\n\n要声明一个枚举，我们使用 `enum`\
    \ 关键字，后跟枚举的名称。枚举的成员包含在大括号中，并用逗号分隔。\n\n下文是一个示例：\n\n```csharp\nenum DaysOfWeek\n\
    {\nSun, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\n注意，我们不在最后一个成员的末尾加分号。\n\n在声明\
    \ `DaysOfWeek` 枚举后，我们可以像这样声明并初始化一个 `DaysOfWeek` 变量：\n\n```csharp\nDaysOfWeek myDays\
    \ = DaysOfWeek.Mon;\n```\n\n变量的名为 `myDays`。如果我们写下\n\n```csharp\nConsole.WriteLine(myDays);\n\
    ```\n\n我们将得到\n\n`Mon`\n\n默认情况下，枚举中的每个成员都被分配一个整数值，从零开始。也就是说，在我们的示例中，`Sun` 被赋值为\
    \ 0，`Mon` 为 1，`Tues` 为 2，依此类推。\n\n由于枚举的成员本质上是整数，我们可以我们可以将 `DaysOfWeek` 变量强制转换为\
    \ `int`，反之亦然。例如，\n\n```csharp\nConsole.WriteLine((int)myDays);\n```\n\n将得到整数 `1`，而通过\n\
    \n```csharp\nConsole.WriteLine((DaysOfWeek)1);\n```\n\n将得到 `Mon`。\n\n如果你想为枚举成员分配一组不同的整数，可以执行以下操作：\n\
    \n```csharp\nenum DaysOfWeekTwo\n{\nSun = 5, Mon = 10, Tues, Wed, Thurs, Fri,\
    \ Sat\n}\n```\n\n现在，`Sun` 被赋值为 5，`Mon` 被赋值为 10。由于我们没有为 `Tues` 到 `Sat` 赋值，10 之后的连续数字将被分配给它们。即\
    \ `Tues` = 11，`Wed` = 12，依此类推。\n\n所有枚举在内部都存储为整数（`int`）。如果你想将底层数据类型从 `int` 更改其他数据类型，可以在枚举名称后添加冒号，然后是所需的数据类型。除了\
    \ `char` 之外，允许任何整数数据类型。例如：\n\n```csharp\nenum DaysOfWeekThree : byte\n{\nSun,\
    \ Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\n当然，如果你使用 `byte` 数据类型，你无法执行如下操作：\n\
    \n```csharp\nenum DaysOfWeekFour : byte\n{\nSun = 300, Mon, Tues, Wed, Thurs,\
    \ Fri, Sat\n}\n```\n\n因为 `byte` 的范围是从 0 到 255。\n\n使用枚举有两个主要原因。第一个是提高代码的可读性。`myDays\
    \ = DaysOfWeek.Mon;` 语句比 `myDays = 1;` 更具自解释性。第二个原因是限制变量可以取的值的值。如果我们有一个存储星期几日的变量，可能会无意中给它赋值为\
    \ 10。当我们使用枚举时可以防止这种情况，因为我们只能分配枚举中预定义的成员。\n\n## Struct (结构体)\n\n现在，让我们来看 `struct`\
    \ 数据类型。\n\n`struct` 在许多方面与 `class` 相似。像类一样，它们包含属性、构造函数、字段等元素，并允许你将相关的成员分组到单个包中，以便你将其作为一个整体进行操作。\n\
    \n要声明一个结构体，你使用 `struct` 关键字。一个示例是：\n\n```csharp\nstruct MyStruct\n{\n    //字段\n\
    \    private int x, y;\n    private AnotherClass myClass;\n    private Days myDays;\n\
    \n    // 构造函数\n    public MyStruct(int a, int b, int c)\n    {\n        myClass\
    \ = new AnotherClass();\n        myClass.number = a;\n        x = b;\n       \
    \ y = c;\n        myDays = Days.Mon;\n    }\n\n    // 方法\n    public void PrintStatement()\n\
    \    {\n        Console.WriteLine(\"x = {0}, y = {1}, myDays = {2}\", x, y, myDays);\n\
    \    }\n}\n\nclass AnotherClass\n{\n    public int number;\n}\n\nenum Days { Mon,\
    \ Tues, Wed }\n```\n\n结构体从第 1 行到第 23 行。在第 4 行，我们为结构体声明了两个 `private int` 字段。在第\
    \ 5 行，我们声明了另一个名为 `myClass` 的私有字段。该字段是类 `AnotherClass` 的实例。在第 6 行，我们声明了一个枚举变量 `myDays`。这两个字段（`myClass`\
    \ 和 `myDays`）特别包含示例中，用于演示如何将类实例和枚举变量作为结构体的字段。结构体（以及类）可以包含枚举变量以及其他结构体的类实例作为字段。\n\
    \n在声明字段后，我们声明了构造函数（第 9 行到第 16 行）。在第 19 行到第 22 行，我们声明了方法。\n\n在第 25 行到第 28 行，我们声明了结构体。在第\
    \ 30 行，我们声明了类。在第 31 行到第 33 行，我们声明了枚举。\n\n## 第 10 章 LINQ\n\nLINQ 代表语言查询（Language\
    \ Integrated Query），是 C# 的一项强大功能，允许你在程序中查询数据。在本章中，我们将涵盖 LINQ 的简要介绍，以及如何使用 LINQ\
    \ 的示例。\n\n让我们先学习如何编写 LINQ 查询。LINQ 查询的典型语法是 `from... where... select`。\n\n假设我们有一个数组，并想从数组中选择所有的偶数。我们可以通过\
    \ LINQ 轻松实现。\n\n首先，让我们声明数组。\n\n```csharp\nint[] numbers = { 0, 1, 2, 3, 4, 5,\
    \ 6 };\n```\n\n接下来，我们编写如下的 LINQ 查询：\n\n```csharp\nvar evenNumQuery =\nfrom num\
    \ in numbers\nwhere (num % 2) == 0\nselect num;\n```\n\n查询位于第 2 行到第 4 行。有 SQL\
    \ 经验的读者可能会觉得这个查询非常熟悉。查询由三个部分组成。第一部分 `from num in numbers` 表明我们正在对 `numbers` 数组执行查询。`num`\
    \ 是我们表示数组中单个元素的名称。下一行 `where (num % 2) == 0` 测试单个元素，判断 `num` 除以 2 的余数是否为零。如果是，则\
    \ `num` 是偶数。第三行 `select num` 选择所有符合条件的元素。\n\n此结果被赋值给变量 `evenNumQuery`，它被声明为 `var`\
    \ 类型。每当我们希望编译器自己确定数据类型时，就会使用 `var` 这种特殊数据类型。这是必要的，因为在我们的示例中，`evenNumQuery` 的数据类型非常复杂；最好让\
    \ C# 为我们推断数据类型。\n\n创建查询语句后，我们可以通过编写以下代码来执行查询：\n\n```csharp\nforeach (int i in\
    \ evenNumQuery)\n{\n    Console.WriteLine(\"{0} is an even number\", i);\n}\n\
    ```\n"
- fmt: "\nIf you run this code, you will get\n\n`0 is an even number`\n`2 is an even\
    \ number`\n`4 is an even number`\n`6 is an even number`\n\nThat’s it. That’s how\
    \ easy it is to use LINQ. Let us now move on to a more complex example of LINQ.\n\
    \nSuppose you have a `Customer` class with `Name`, `Phone`, `Address` and `Balance`\
    \ as its properties and a constructor to initialize each of these properties.\n\
    \nWe can create a list of `Customer` objects in our `Main()` method using the\
    \ code below.\n\n```csharp\nList<Customer> customers = new List<Customer>();\n\
    customers.Add(new Customer(\"Alan\", \"80911291\", \"ABC Street\", 25.60m));\n\
    customers.Add(new Customer(\"Bill\", \"19872131\", \"DEF Street\", -32.1m));\n\
    customers.Add(new Customer(\"Carl\", \"29812371\", \"GHI Street\", -12.2m));\n\
    customers.Add(new Customer(\"David\", \"78612312\", \"JKL Street\", 12.6m));\n\
    ```\n\nNow suppose we want to search for all customers with negative account balances,\
    \ we can use the following LINQ query.\n\n```csharp\nvar overdue =\nfrom cust\
    \ in customers\nwhere cust.Balance < 0\norderby cust.Balance ascending\nselect\
    \ new { cust.Name, cust.Balance };\n```\n\nThis query is similar to the first\
    \ query, with two main differences. Here, we used two additional keywords, `orderby`\
    \ and `ascending`, to arrange the results in ascending order.\n\nIn addition,\
    \ we used the `new` keyword in the select statement. The `new` keyword is needed\
    \ whenever we want to select more than one field from the objects.\n\nTo execute\
    \ and print the results, we can use the `foreach` loop below:\n\n```csharp\nforeach\
    \ (var cust in overdue)\n    Console.WriteLine(\"Name = {0}, Balance = {1}\",\
    \ cust.Name, cust.Balance);\n```\n\nWe will get\n\n`Name = Bill, Balance = -32.1`\n\
    `Name = Carl, Balance = -12.2`\n\n# Chapter 11: File Handling\n\nCool! We’ve come\
    \ to the last chapter of the book before the project. In this chapter, we’ll learn\
    \ how to read and write to an external file.\n\nIn Chapter 5 previously, we learned\
    \ how to get input from users using the `ReadLine()` method. However, in some\
    \ cases, getting users to enter data into our program may not be practical, especially\
    \ if our program needs to work with large amounts of data. In cases like this,\
    \ a more convenient way is to prepare the needed information as an external file\
    \ and get our programs to read the information from the file.\n\nC# provides us\
    \ with a number of classes to work with files. The classes that we are going to\
    \ look at in this chapter are the `File`, `StreamWriter` and `StreamReader` classes.\
    \ All three classes are available in the `System.IO` namespace. To use the methods\
    \ in this chapter, you have to add the directive\n\n```csharp\nusing System.IO;\n\
    ```\n\n## Reading a Text File\n\nTo read data from a text file, we use the `StreamReader`\
    \ class.\n\nSuppose we want to read data from the file “myFile.txt” located on\
    \ the C drive. The example below shows how to do it.\n\n```csharp\n1 string path\
    \ = \"c:\\\\myFile.txt\";\n2 using (StreamReader sr = new StreamReader(path))\n\
    3 {\n4 while (sr.EndOfStream != true)\n5 {\n6 Console.WriteLine(sr.ReadLine());\n\
    7 }\n9 sr.Close();\n10 }\n```\n\nOn line 1, we first declare a `string` variable\
    \ `path` and assign the path of the file to the variable.\n\n`string path = \"\
    c:\\\\myFile.txt\";`\n\nNote that we have to use double slashes `\\\\` when writing\
    \ the path. This is because if we only use a single slash, the compiler will think\
    \ the single slash is the beginning of an escape sequence and interpret `\\m`\
    \ as an escape sequence. This will result in an error.\n\nOn line 2, we create\
    \ a `StreamReader` instance. The `StreamReader` constructor takes in one argument\
    \ – the path of the file to be read.\n\n```csharp\nStreamReader sr = new StreamReader(path)\n\
    ```\n\nNotice that we create this `StreamReader` instance inside a pair of parenthesis\
    \ that follows the word `using` on line 2?\n\nThe `using` keyword here is different\
    \ from the one that we use when writing a directive.\n\nThe `using` keyword here\
    \ ensures that the `Dispose()` method is always called. The `Dispose()` method\
    \ is a pre-written method in the `System` namespace that closes or releases any\
    \ unmanaged resources such as files and streams once they are no longer needed.\
    \ When we use the `using` keyword, we ensure that the `Dispose()` method is called\
    \ even if an exception occurs and prevents our code from reaching Line 9 where\
    \ we manually close the file. It is good practice to always use the `using` keyword\
    \ whenever you are dealing with files. The code to read and close the file is\
    \ enclosed within curly braces `{ }` after the `using` statement.\n\nFrom lines\
    \ 4 to 7, we use a `while` loop to read the text file line by line.\n\n```csharp\n\
    while (sr.EndOfStream != true)\n{\n    Console.WriteLine(sr.ReadLine());\n}\n\
    ```\n\n`EndOfStream` is a property of the `StreamReader` class that returns `true`\
    \ when the end of file is reached. As long as the end of file is not reached,\
    \ the `while` loop will continue.\n\n```csharp\nConsole.WriteLine(sr.ReadLine());\n\
    ```\n\n### Option 1: try…catch\n\nThe first option is to use `try…catch` as shown\
    \ below:\n\n```csharp\n1 try\n2 {\n3 using (StreamReader sr = new StreamReader(path))\n\
    4 {\n5 while (sr.EndOfStream != true)\n6 {\n7 Console.WriteLine(sr.ReadLine());\n\
    8 }\n9 sr.Close();\n10 }\n11 catch (FileNotFoundException e)\n12 {\n13 Console.WriteLine(e.Message);\n\
    14 }\n```\n\nFrom lines 1 to 11, we try to open, read and close the file in the\
    \ `try` block. From lines 11 to 14, we use a `catch` block to catch the `FileNotFoundException`\
    \ exception if the file is not found. Inside the `catch` block, we print an error\
    \ to inform users that the file is missing.\n\n### Option 2: File.Exists()\n\n\
    The second method to deal with a “file not found” scenario is to use the `Exists()`\
    \ method in the `File` class. As the name suggests, the `Exists()` method checks\
