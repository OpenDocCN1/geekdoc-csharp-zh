    `memberID = pMemberID;`


    `memberSince = pMemberSince;`


    `}`


    The first constructor merely prints the line “Parent Constructor with no parameter”.


    The second constructor is more interesting. It prints the line “Parent Constructor
    with 3 parameters” and assigns its parameters to the three private fields in the
    `Member` class.


    Writing the Child Class


    Now, let us learn how to derive a class from the `Member` class. Derived classes
    are known as child classes, while the classes from which they are derived are
    known as parent classes or base classes.


    A derived class inherits all the public and protected members from the parent
    class. In other words, it can use those fields, properties and methods as if they
    are part of its own code.


    Our parent class (`Member`) has the following contents:


