    \ an integer.`\n\n第一个错误是 `IndexOutOfRangeException` 异常，并由第一个 `catch` 块处理。当你尝试访问超出数组范围的元素时，就会发生此异常。\n\
    \n第二个错误是 `FormatException` 异常，并由第二个 `catch` 块处理。当参数格式无效时，会发生 `FormatException`\
