    \ to check if the file exists before using a `StreamReader` to open and read the\
    \ file.\n\n```csharp\nif (File.Exists(path))\n{\n    using (StreamReader sr =\
    \ new StreamReader(path))\n    {\n        while (sr.EndOfStream != true)\n   \
