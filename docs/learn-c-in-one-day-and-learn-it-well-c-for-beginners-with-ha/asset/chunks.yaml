    Most programming languages also have the `++` and `--` operators. The `++` operator
    is used when you want to increase the value of a variable by 1. For instance,
    suppose


    ```

    int x = 2;

    ```


    If you write


    ```

    x++;

    ```


    the value of `x` becomes 3.


    There is no need to use the `=` sign when you use the `++` operator. The statement
    `x++;` is equivalent to


    ```

    x = x + 1;

    ```


    The `++` operator can be placed in front of or behind the variable name. This
    affects the order in which tasks are performed.


    Suppose we have an integer named `counter`. If we write


    ```

    Console.WriteLine(counter++);

    ```


    the program first prints the original value of `counter` before incrementing `counter`
    by 1. In other words, it executes the tasks in this order


    ```

    Console.WriteLine(counter);

    counter = counter + 1;

    ```


    On the other hand, if we write


    ```

    Console.WriteLine(++counter);

    ```


    the program first increments `counter` by 1 before printing the new value of `counter`.
    In other words, it executes the tasks in this order


    ```

    counter = counter + 1;

    Console.WriteLine(counter);

    ```


    In addition to the `++` operator, we also have the `--` operator (two minus signs).
    This operator decreases the value of the variable by 1.


    ## Type Casting In C#


    Sometimes in our program, it is necessary to convert from one data type to another,
    such as from a `double` to an `int`. This is known as type casting.


    To convert one numeric data type to another, we just need to add `(new data type)`
    in front of the data that we want to convert.


    For instance, we can cast a non integer into an integer like this:


    ```

    int x = (int) 20.9;

    ```


    When we cast 20.9 into an integer, the resulting value is 20, not 21. The decimal
    portion is truncated after the conversion.


    We can also cast a `double` into a `float` or a `decimal`. Recall that we mentioned
    earlier that all non integers are treated as `double` by default in C#? If we
    want assign a number like 20.9 to a `float` or `decimal`, we need to add the `f`
    and `m` suffixes respectively. Another way to do it is to use a cast, like this:


    ```

    float num1 = (float) 20.9;

    decimal num2 = (decimal) 20.9;

    ```


    The values of `num1` and `num2` will both be 20.9.


    In addition to casting between numeric types, we can also do other types of casting.
    We’ll explore some of these conversions in subsequent chapters.


    ## Chapter 4: Arrays, Strings and Lists


    In the previous chapter, we covered some of the basic data types that are commonly
    used in C#. Besides these basic data types, C# also comes with a few advanced
    data types. In this chapter, we are going to cover three advanced data types:
    arrays, strings and lists. In addition, we are going to discuss the difference
    between a value data type and a reference data type.


    ### Array


    An array is simply a collection of data that are normally related to each other.
    Suppose we want to store the ages of 5 users. Instead of storing them as `user1Age`,
    `user2Age`, `user3Age`, `user4Age` and `user5Age`, we can store them as an array.


    An array can be declared and initialized as follows:


    ```

    int[] userAge = {21, 22, 23, 24, 25};

    ```


    - `int` indicates that this variable stores `int` values.

    - `[]` indicates that the variable is an array instead of a normal variable.

    - `userAge` is the name of the array.

    - `{21, 22, 23, 24, 25}` are the five integers that the array stores.


    In addition to declaring and initializing an array at the point of declaration,
    we can declare an array first and initialize it later. To do that, we need to
    use the `new` operator:


    ```

    int[] userAge = new int[5];

    userAge = new [] {21, 22, 23, 24, 25};

    ```


    The first statement declares and creates an array for storing 5 integers. The
    second statement initializes the array.


    Individual values in the array are accessible by their indexes, and indexes always
    start with a value of ZERO, not 1. This is a common practice in almost all programming
    languages, such as Python and Java. The first value of the array has an index
    of 0, the next has an index of 1 and so forth.


    If we type


    ```

    Console.WriteLine(userAge[0]);

    ```


    the value ‘21’ will be displayed on the screen.


    If we type


    ```

    userAge[2] = userAge[2] + 20;

    ```


    the array becomes `{21, 22, 43, 24, 25}`. That is, 20 is added to the third element.


    ### Array Properties and Methods


    C# comes with a number of useful properties and methods that we can use with an
    array.


    We’ll learn more about properties and methods in Chapter 7 when we discuss classes.
    For now, all we have to know is that to use a property or method, we need to use
    the dot (`.`) operator. To use a property, we type the property name after the
    dot. To use a property, we type the property name after the dot.


    #### Length


    The `Length` property of an array tells us the number of items. For instance,
    if we have


    ```

    int[] userAge = {21, 22, 23, 24, 25};

    ```


    `userAge.Length` is 5.


    #### Copy


    The `Copy()` method allows us to copy one array into another. For instance, if
    we have ``````

    int[] source = {12, 5, -2, 16, 14};

    int[] dest = new int[3];

    ```


    you can copy three elements of `source` into `dest` using


    ```

    Array.Copy(source, dest, 3);

    ```


    #### Sort


    The `Sort()` method allows us to sort our arrays. Suppose you have


    ```

    int[] numbers = {12, 5, -2, 16, 14};

    ```


    You can sort this array by writing


    ```

    Array.Sort(numbers);

    ```


    The array will be sorted in ascending order. Thus, `numbers` becomes `{-2, 5,
    12, 14, 16}`.


    #### IndexOf


    We use the `IndexOf()` method to determine if a certain value exists in an array.
    If it exists, the method returns the index of the first occurrence of that value.
    If it does not exist, the method returns -1.


    For instance, if we have


    ```

    int[] numbers = {10, 30, 44, 21, 51, 21, 61, 24, 14};

    ```


    you can find if the value 21 exists in the array by writing


    ```

    Array.IndexOf(numbers, 21);

    ```


    The method returns the index of the first value found, which is 3 in this case
    since 21 is the fourth element in the array. You can then assign the answer to
    a variable like this:


    ```

    int ans = Array.IndexOf(numbers, 21);

    ```


    The value of `ans` is thus 3. If you write


    ```

    ans = Array.IndexOf(numbers, 100);

    ```


    the value of `ans` is -1 as 100 does not exist in the `numbers` array.


    ### String


    Next, let us look at the `string` data type. A string is a piece of text. An example
    of a string is the text “Hello World”.


    To declare and initialize a `string` variable, you write


    ```

    string message = “Hello World”;

    ```


    where `message` is the name of the `string` variable and “Hello World” is the
    string assigned to it. Note that you need to enclose the string in double quotes
    (“).


    You can also assign an empty string to a variable, like this:

