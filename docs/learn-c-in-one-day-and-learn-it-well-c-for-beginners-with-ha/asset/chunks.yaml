  raw: 'In addition to the `Exception` class that handles general errors, we also
    have other classes that can handle more specific errors. This is useful if you
    want to perform specific tasks depending on the error caught. For instance, you
    may want to display your own error message.


    Try running the code below:


    `int choice = 0;`


    `int[] numbers = { 10, 11, 12, 13, 14, 15 };`


    `Console.Write("Please enter the index of the array: ");`


    `try`


    `{`


    `choice = Convert.ToInt32(Console.ReadLine());`


    `Console.WriteLine("numbers[{0}] = {1}", choice, numbers[choice]);`


    `}catch (IndexOutOfRangeException)`


    `{`


    `Console.WriteLine("Error: Index should be from 0 to 5.");`


    `}catch (FormatException)`


    `{`


    `Console.WriteLine("Error: You did not enter an integer.");`


    `}catch (Exception e)`


    `{`


    `Console.WriteLine(e.Message);`


    `}`


    If you enter


    `10`


    You will get


    `Index was outside the bounds of the array.`


    `Index should be from 0 to 5.`


    If you enter


    `Hello`


    You will get


    `Input string was not in a correct format.`


    `You did not enter an integer.`


    The first error is a `IndexOutOfRangeException` exception and was handled by the
    first `catch` block. This exception occurs when you try to access an element of
    an array with an index that is outside its bounds.


    The second error is a `FormatException` exception and was handled by the second
    `catch` block. The `FormatException` exception occurs when the format of an argument
    is invalid. In our example, `C``onvert.ToInt32("Hello")` generated a `FormatException`
    exception as the argument “Hello” cannot be converted into an integer. In contrast,
    if you entered `4`, `Convert.ToInt32(“4”)` will not generate a `FormatException`
    exception as the string “4” can be converted into an integer.


    After the two specific `catch` blocks, we have one more `catch` block to catch
    any general errors that we did not pre-empt.


    This example above shows two of the many exceptions in C#. For a complete list
    of all exceptions, refer to [https://msdn.microsoft.com/en-us/library/system.systemexception.aspx](https://msdn.microsoft.com/en-us/library/system.systemexception.aspx).


    ## Chapter 7: Object-Oriented Programming Part 1


    We have covered a fair bit so far. In the next two chapters, we are going to look
    at another important concept in programming – the concept of object-oriented programming.


    In this chapter, we’ll learn what object-oriented programming is and how to write
    our own classes and create objects from them. In addition, we’ll also discuss
    the concept of fields, properties, constructors and methods.


    What is Object-Oriented Programming?


    Simply stated, object-oriented programming is an approach to programming that
    breaks a programming problem into objects that interact with each other.


    Objects are created from templates known as classes. You can think of a class
    as the blueprint of a building. An object is the actual “building” that we build
    based on the blueprint.


    Writing our own class


    To write our own class, we use the `class` keyword, following by the name of the
    class.


    For instance, to create a `Staff` class, we write


    `class Staff {`


    `//Contents of the class`


    `//including fields, properties and methods`


    `}`


    It is common practice to use PascalCasing when naming our classes. PascalCasing
    refers to the practice of capitalizing the first letter of each word, including
    the first word (e.g. `ThisIsAClassName`). This is the convention that we’ll be
    following in the book.


    The content of the class is enclosed within the pair of curly braces that follow
    the class name. Contents of a class include constructors, destructors, constants,
    fields, methods, properties, indexers, operators, events, delegates, interfaces,
    structs and other classes.


    We’ll cover some of the more common elements of a class in this chapter, namely
    fields, methods, properties and constructors.


    To understand what these are, let’s build a class from scratch.


    First, create a new Console Application project in Visual Studio Community and
    name this project “ClassDemo ”.


    Study the code that is automatically generated for you. Notice that inside the
    `ClassDemo` namespace, VSC has already created a class called `Program` for you?
    Inside the `Program` class, we have the `Main()` method.


    By default, the `Main()` method (which is the starting point for all C# applications)
    is put into the `Program` class created by VSC. If we want, we can change the
    name of the `Program` class to something else, but the `Main()` method must be
    called `Main()`. The `Main()` method must be present in all C# programs.


    In this chapter, we are going to add a second class to the `ClassDemo` namespace.
    We’ll call this new class `Staff` and add fields, properties and methods to the
    class. The complete code for this chapter can be downloaded at [http://www.learncodingfast.com/csharp](http://www.learncodingfast.com/csharp).


    Let’s first declare the class. Add the following code just before the line `class
    Program` in our auto-generated code.


    `class Staff`


    `{`


    `}`


    We now have two classes in our project: `Staff` and `Program`.


    Fields


    Inside the `Staff` class, add the following lines:


    `private string nameOfStaff;`


    `private const int hourlyRate = 30;`


    `private int hWorked;`


    Here, we declare one `string` variable (`nameOfStaff`) and two `int` variables
    (`hourlyRate` and `hWorked`). These variables are known as fields of the class.
    A field is simply a variable that is declared inside a class. Like any other variables,
    they are used to store data.


    Notice that there is a word `private` in front of each declaration statement?
    This is known as an access modifier. Access modifiers are like gate keepers, they
    control who has access to that field (i.e. who can read and modify the value of
    that field).


    A field can either be `private`, `public`, `protected` or `internal`. In our case,
    we declared the three fields as `private`. This means they can only be accessed
    from within the `Staff` class itself.


    There are two reasons why we do not want the three fields to be accessible outside
    the class.


    The first reason is that there is no need for other classes to know about those
    fields. In our case, the field `hourlyRate` is only needed within the `Staff`
    class. We have a method inside the `Staff` class that uses the field `hourlyRate`
    to calculate the monthly salary of an employee. Other classes do not use the `hourlyRate`
    field at all. Hence, it is appropriate to declare `hourlyRate` as `private` so
    as to hide this field from other classes.


    This is known as encapsulation. Encapsulation enables an object to hide data and
    behaviour from other classes that do not need to know about them. This makes it
    easier for us to make changes to our code in future if necessary. We can safely
    change the value of `hourlyRate` inside `Staff` class without affecting other
    classes.


    The second reason for declaring a field as `private` is that we do not want other
    classes to freely modify them. This helps to prevent the fields from being corrupted.


    We’ll talk more about access modifiers in the next chapter.


    In addition to the `private` keyword, we also added the `const` keyword when we
    declared the `hourlyRate` field.


    `private const int hourlyRate = 30;`


    The `const` keyword indicates that the value cannot be changed after it is created.
    Any variable that is declared as `const` must be initialized at the point of declaration.
    In our example, we initialized `hourlyRate` to 30\. This value cannot be changed
    subsequently anywhere in the code.


    Properties


    Next, let us look at properties.


    A property is commonly used to provide access to a private field in cases where
    the field is needed by other classes. This may sound like a contradiction. Earlier,
    we mentioned that we use private fields so that other classes do not have access
    to them. If that is the case, why are we allowing access to them via properties?'
