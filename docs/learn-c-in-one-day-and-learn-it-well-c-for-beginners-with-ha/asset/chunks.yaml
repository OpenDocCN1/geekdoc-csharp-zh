    `0 is an even number`


    `2 is an even number`


    `4 is an even number`


    `6 is an even number`


    That’s it. That’s how easy it is to use LINQ. Let us now move on to a more complex
    example of LINQ.


    Suppose you have a `Customer` class with `Name`, `Phone`, `Address` and `Balance`
    as its properties and a constructor to initialize each of these properties.


    We can create a list of `Customer` objects in our `Main()` method using the code
    below.


    `List<Customer> customers = new List<Customer>();`


    `customers.Add(new Customer("Alan", "80911291", "ABC Street", 25.60m));`


    `customers.Add(new Customer("Bill", "19872131", "DEF Street", -32.1m));`


    `customers.Add(new Customer("Carl", "29812371", "GHI Street", -12.2m));`


    `customers.Add(new Customer("David", "78612312", "JKL Street", 12.6m));`


    Now suppose we want to search for all customers with negative account balances,
    we can use the following LINQ query.


    `var overdue =`


    `from cust in customers`


    `where cust.Balance < 0`


    `orderby cust.Balance ascending`


    `select new { cust.Name, cust.Balance };`


    This query is similar to the first query, with two main differences. Here, we
    used two additional keywords, `orderby` and `ascending`, to arrange the results
    in ascending order.


    In addition, we used the `new` keyword in the select statement. The `new` keyword
    is needed whenever we want to select more than one field from the objects.


    To execute and print the results, we can use the `foreach` loop below:


    `foreach (var cust in overdue)`


    `Console.WriteLine("Name = {0}, Balance = {1}", cust.Name, cust.Balance);`


    We will get


    `Name = Bill, Balance = -32.1`


    `Name = Carl, Balance = -12.2`


    ## Chapter 11: File Handling


    Cool! We’ve come to the last chapter of the book before the project. In this chapter,
    we’ll learn how to read and write to an external file.


    In Chapter 5 previously, we learned how to get input from users using the `ReadLine()`
    method. However, in some cases, getting users to enter data into our program may
    not be practical, especially if our program needs to work with large amounts of
    data. In cases like this, a more convenient way is to prepare the needed information
    as an external file and get our programs to read the information from the file.


    C# provides us with a number of classes to work with files. The classes that we
    are going to look at in this chapter are the `File`, `StreamWriter` and `StreamReader`
    classes. All three classes are available in the `System.IO` namespace. To use
    the methods in this chapter, you have to add the directive


    `using System.IO;`


    to the start of your code.


    Reading a Text File


    To read data from a text file, we use the `StreamReader` class.


    Suppose we want to read data from the file “myFile.txt” located on the C drive.
    The example below shows how to do it.


    `1 string path = “c:\\myFile.txt”;`


    `2 using (StreamReader sr = new StreamReader(path))`


    `3 {`


    `4``while (sr.EndOfStream != true)`


    `5``{`


    `6``Console.WriteLine(sr.ReadLine());`


    `7``}`


    `8`


    `9``sr.Close();`


    `10 }`


    On line 1, we first declare a `string` variable `path` and assign the path of
    the file to the variable.


    `string path = “c:\\myFile.txt”;`


    Note that we have to use double slashes `\\` when writing the path. This is because
    if we only use a single slash, the compiler will think the single slash is the
    beginning of an escape sequence and interpret \m as an escape sequence. This will
    result in an error.


    On line 2, we create a `StreamReader` instance. The `StreamReader` constructor
    takes in one argument – the path of the file to be read.


    `StreamReader sr = new StreamReader(path)`


    Notice that we create this `StreamReader` instance inside a pair of parenthesis
    that follows the word `using` on line 2?


    The `using` keyword here is different from the one that we use when writing a
    directive.


    The `using` keyword here ensures that the `Dispose()` method is always called.
    The `Dispose()` method is a pre-written method in the `System` namespace that
    closes or releases any unmanaged resources such as files and streams once they
    are no longer needed. When we use the `using` keyword, we ensure that the `Dispose()`
    method is called even if an exception occurs and prevents our code from reaching
    Line 9 where we manually close the file. It is good practice to always use the
    `using` keyword whenever you are dealing with files. The code to read and close
    the file is enclosed within curly braces { } after the `using` statement.


    From lines 4 to 7, we use a `while` loop to read the text file line by line.


    `while (sr.EndOfStream != true)`


    `{`


    `Console.WriteLine(sr.ReadLine());`


    `}`


    `EndOfStream` is a property of the `StreamReader` class that returns `true` when
    the end of the file is reached. As long as the end of file is not reached, the
    `while` loop will continue to run.


    Inside the `while` loop, we have the statement


    `Console.WriteLine(sr.ReadLine());`


    `sr.ReadLine()` reads a line from the text file and returns it as a string. This
    string is then printed onto the screen using the `Console.WriteLine()` method.


    Finally, after we finish reading the file, we close the file so that other programs
    may use it. You should always close your file once you no longer need it.


    `sr.Close();`


    That’s it. That’s how you read a text file in C#. Pretty straightforward right?


    However, there is one problem with the code above. This code will generate an
    error if the file “myFile.txt” cannot be found. We have two options here.


    Option 1: try…catch


    The first option is to use a `try…catch` statement as shown below:


    `1 try`


    `2 {`


    `3``using (StreamReader sr = new StreamReader(path))`


    `4``{`


    `5``while (!sr.EndOfStream)`


    `6``{`


    `7``Console.WriteLine(sr.ReadLine());`


    `8``}`


    `9``sr.Close();`


    `10``}`


    `11 }catch (FileNotFoundException e)`


    `12 {`


    `13``Console.WriteLine(e.Message);`


    `14 }`


    From lines 1 to 11, we try to open, read and close the file in the `try` block.


    From lines 11 to 14, we use a `catch` block to catch the `FileNotFoundException`
    exception if the file is not found. Inside the `catch` block, we print an error
    statement to inform users that the file is not found.


    Option 2: File.Exists()


    The second method to deal with a “file not found” scenario is to use the `Exists()`
    method in the `File` class. As the name suggests, the `Exists()` method checks
    if a file exists. The `File` class is a pre-written class in the `System.IO` namespace
    that provides static methods for the creation, copying, deletion, moving, and
    opening of a single file.


    To use the `Exists()` method, we use an `if` statement to check if the file exists
    before using a `StreamReader` to open and read the file.


    `if (File.Exists(path))`


    `{`


    `using (StreamReader sr = new StreamReader(path))`


    `{`


    > `while (!sr.EndOfStream)`


    > `{`


    > `Console.WriteLine(sr.ReadLine());`


    > `}`


    > `sr.Close();`


    > `}`


    `}``else`


    `{`


    `//Do something else`


    `}`


    In the `else` block, we can write code to create the file if it is not found.


    As you can see, the two methods for dealing with cases where the file is missing
    are quite similar. However, the `File.Exists()` method is the preferred method
    as it is faster than the `try…catch` statement.


    Writing to a Text File


    Next, let us look at how to write to a text file.


    To write to a text file, we use the `StreamWriter` class.


    If you want to append data to an existing file, you create a `StreamWriter` instance
    like this


    `StreamWriter sw = new StreamWriter(path, true)``;`


    where `path` is the path of the file and `true` indicates that we want to append
    the data.


    If you want to overwrite any existing data in the file, you create a `StreamWriter`
    instance like this


    `StreamWriter sw = new StreamWriter(path)``;`


    When we create the `StreamWriter` instance, the constructor looks for the file
    at the given path. If the file is not found, it creates the file.'
