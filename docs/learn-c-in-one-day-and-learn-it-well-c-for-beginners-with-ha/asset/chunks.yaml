    Andy\", 2, 2011);\n```\n\n`mem1` is created using the 4 parameters constructor\
    \ from the `NormalMember` class. `mem2` is created using the 3 parameters constructor\
    \ from the `VIPMember` class.\n\nNext, we’ll use the `CalculateAnnualFee()` methods\
    \ in the respective classes.\n\n```csharp\nmem1.CalculateAnnualFee();\nmem2.CalculateAnnualFee();\n\
    ```\n\nAs `mem1` is an instance of the `NormalMember` class, the `CalculateAnnualFee()`\
    \ method from that class is executed. The annual fee for `mem1` is thus `100 +\
    \ 12*30 = 460`. For `mem2`, the annual fee is 1200 as it uses the method from\
    \ the `VIPMember` class.\n\nFinally, let’s use the `ToString()` method from the\
    \ parent class (`Member`) to display the information on our screen. We write\n\
    \n```csharp\nConsole.WriteLine(mem1.ToString());\nConsole.WriteLine(mem2.ToString());\n\
    ```\n\nSince the `ToString()` method belongs to the parent class and is public,\
    \ both `mem1` and `mem2` have inherited the method and are thus able to use it\
    \ in the `Main()` method. This facilitates code reuse as we do not need to rewrite\
    \ the `ToString()` method for both the child classes.\n\nYou’ll get the following\
    \ output when you run the program:\n\n```\nParent Constructor with 3 parameters\n\
    Child Constructor with 4 parameters\nMessage = Special Rate\nParent Constructor\
    \ with 3 parameters\nChild Constructor with 3 parameters\nName: James\nMember\
    \ ID: 1\nMember Since: 2010\nTotal Annual Fee: 460\nName: Andy\nMember ID: 2\n\
    Member Since: 2011\nTotal Annual Fee: 1200\n```\n\n### Polymorphism\n\nNow that\
    \ we have seen an example of how inheritance works, let us move on to discuss\
    \ another topic that is closely related to inheritance - the concept of polymorphism.\
    \ Polymorphism refers to a program’s ability to use the correct method for an\
    \ object based on its run-time type.\n\nThe best way to explain polymorphism is\
    \ through an example. Let’s expand on our Fitness club example above.\n\nFirst,\
    \ delete all the code in the previous `Main()` method and add the following lines:\n\
    \n```csharp\nMember[] clubMembers = new Member[5];\nclubMembers[0] = new NormalMember(\"\
    Special Rate\", \"James\", 1, 2010);\nclubMembers[1] = new NormalMember(\"Normal\
    \ Rate\", \"Andy\", 2, 2011);\nclubMembers[2] = new NormalMember(\"Normal Rate\"\
    , \"Bill\", 3, 2011);\nclubMembers[3] = new VIPMember(\"Carol\", 4, 2012);\nclubMembers[4]\
    \ = new VIPMember(\"Evelyn\", 5, 2012);\n```\n\nHere, we declare an array of `Member`\
    \ type and add 5 members to it. The first three members are instances of the `NormalMember`\
    \ class while the last two are instances of the `VIPMember` class.\n\nAlthough\
    \ `clubMembers` is declared to be an array of `Member` type, we can assign instances\
    \ of `NormalMember` and `VIPMember` to it as they are child classes of the `Member`\
    \ class. We do not need to declare separate arrays for `NormalMember` and `VIPMember`\
    \ objects.\n\nNext, we’ll use a `foreach` loop to calculate the annual fee of\
    \ each member and display the information. To do that, we write\n\n```csharp\n\
    foreach (Member m in clubMembers)\n{\n    m.CalculateAnnualFee();\n    Console.WriteLine(m.ToString());\n\
    }\n```\n\nIf you try to run the program at this stage, you’ll get an error that\
    \ says `Member` does not contain a definition for `CalculateAnnualFee`. This is\
    \ because `clubMembers` is declared to be an array of `Member` type. Hence, the\
    \ compiler tries to execute the `CalculateAnnualFee()` method in the `Member`\
    \ class when we write `m.CalculateAnnualFee()`. An error occurs because we do\
    \ not have such a method in our `Member` parent class; we only have it in the\
    \ two child classes. To rectify this error, we have to add the following method\
    \ to our parent class.\n\n```csharp\npublic void CalculateAnnualFee()\n{\n   \
    \ annualFee = 0;\n}\n```\n\nNow run the program and pay attention to the “Total\
    \ Annual Fee” for each member. What do you notice? It should all show $0. This\
    \ means the `CalculateAnnualFee()` method that is invoked is the one in the parent\
    \ class. This is not surprising as `clubMembers` is declared to be of `Member`\
    \ type.\n\nIf you want the child method to be invoked instead, you have to make\
    \ two changes.\n\nFirst, you need to declare the parent method as virtual, like\
    \ this\n\n```csharp\npublic virtual void CalculateAnnualFee()\n{\n    annualFee\
    \ = 0;\n}\n```\n\nThe `virtual` keyword tells the compiler that this method may\
    \ be overridden in derived classes. Next, in the child class, you have to override\
    \ the method using the `override` keyword:\n\n```csharp\n// In VIPMember class\n\
    public override void CalculateAnnualFee()\n{\n    annualFee = 1200;\n}\n\n// In\
    \ NormalMember class\npublic override void CalculateAnnualFee()\n{\n    annualFee\
    \ = 100 + 12*30;\n}\n```\n\nNow if you run the program, the annual fee for the\
    \ first three members (`NormalMember`) will be 460 and the last two (`VIPMember`)\
    \ will be 1200 respectively. This is the result of polymorphism. Polymorphism\
    \ simply means that at run time, the program is smart enough to use the `CalculateAnnualFee()`\
    \ method from the correct child class even when that object is declared to be\
    \ `Member` type.\n\n### Abstract Classes and Methods\n\nNow that we are familiar\
    \ with inheritance and polymorphism, let us move on to discuss two special types\
    \ of “parent class” in C# - abstract classes and interfaces.\n\nFirst, let’s look\
    \ at abstract classes.\n\nAn abstract class is a special type of class that is\
    \ created strictly to be a base class for other classes to derive from. They cannot\
    \ be instantiated. In other words, if `FourWheelVehicles` is an abstract class,\
    \ the statement\n\n```csharp\nFourWheelVehicle myVeh = new FourWheelVehicle();\n\
    ```\n\nwill give you an error as you cannot create an object of an abstract class.\n"
