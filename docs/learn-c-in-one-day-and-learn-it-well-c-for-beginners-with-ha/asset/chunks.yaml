    \ myNumbers = { 10, 20, 30, 40, 50 };`\n\n我们可以使用 `for` 循环和数组的 `Length` 属性来遍历数组：\n\
    \n```cs\nfor (int i = 0; i < myNumbers.Length; i++)\n{\n    Console.WriteLine(myNumbers[i]);\n\
    }\n```\n\n由于 `myNumbers.Length` 等于 5，这段代码从 `i = 0` 运行到 `i = 4`。如果我们运行代码，将得到以下输出：\n\
    \n`10`\n`20`\n`30`\n`40`\n`50`\n\n## Foreach 循环 (Foreach Loop)\n\n除了 `for` 循环外，我们在处理数组和列表时还可以使用\
    \ `foreach` 循环。如果你想从数组或列表中获取信息而不对其进行任何更改，`foreach` 循环非常有用。\n\n假设你有\n\n`char[]\
    \ message = { ‘H’, ‘e’, ‘l’, ‘l’, ‘o’ };`\n\n你可以使用以下代码显示数组的元素：\n\n```cs\nforeach\
    \ (char i in message)\n    Console.Write(i);\n```\n\n"
- fmt: "\nIn the code above, we have a `char` variable `i` that is used for looping.\
    \ Each time the loop runs, an element in the `message` array is assigned to the\
    \ variable `i`. For instance, the first time the loop runs, the character ‘H’\
    \ is assigned to `i`.\n\nThe line\n```cs\nConsole.Write(i);\n```\nthen prints\
    \ out the letter ‘H’.\n\nThe second time the loop runs, the character ‘e’ is assigned\
    \ to `i`. The line\n```cs\nConsole.Write(i);\n```\nprints out the letter ‘e’.\n\
    \nThis continues until all the elements in the array have been printed.\n\n##\
    \ While Loop\n\nLike the name suggests, a `while` loop repeatedly executes instructions\
    \ inside the loop while a certain condition remains valid. The structure of a\
    \ `while` statement is as follows:\n\n```\nwhile (condition is true)\n{\n    do\
    \ A\n}\n```\n\nMost of the time when using a `while` loop, we need to first declare\
    \ a variable to function as a loop counter. Let’s call this variable `counter`.\
    \ The code below shows an example of how a `while` loop works.\n\n```cs\nint counter\
    \ = 5;\nwhile (counter > 0)\n{\n    Console.WriteLine(“Counter = {0}”, counter);\n\
    \    counter = counter – 1;\n}\n```\n\nIf you run the code, you’ll get the following\
    \ output\n```\nCounter = 5\nCounter = 4\nCounter = 3\nCounter = 2\nCounter = 1\n\
    ```\n\nA `while` statement has a relatively simple syntax. The statements inside\
    \ the curly braces are executed as long as `counter > 0`.\n\nNotice that we have\
    \ the line `counter = counter – 1` inside the curly braces? This line is crucial.\
    \ It decreases the value of `counter` by 1 each time the loop is run.\n\nWe need\
    \ to decrease the value of `counter` by 1 so that the loop condition (`counter\
    \ > 0`) will eventually evaluate to `false`. If we forget to do that, the loop\
    \ will keep running endlessly, resulting in an infinite loop. The program will\
    \ keep printing `counter = 5` until you somehow kill the program. Not a pleasant\
    \ experience especially if you have a large program and you have no idea which\
    \ code segment is causing the infinite loop.\n\n## Do while\n\nThe `do while`\
    \ loop is similar to the `while` loop with one main difference - the code within\
    \ the curly braces of a `do while` loop is executed at least once. Here’s an example\
    \ of how a `do while` loop works.\n\n```cs\nint counter = 100;\ndo {\n    Console.WriteLine(“Counter\
    \ = {0}”, counter);\n    counter++;\n} while (counter<0);\n```\n\nAs the test\
    \ condition (`while (counter<0)`) is placed after the closing curly brace, it\
    \ is tested after the code inside the curly braces is executed at least once.\n\
    \nIf you run the code above, you will get\n```\nCounter = 100;\n```\n\nAfter the\
    \ `WriteLine()` statement is executed for the first time, `counter` is incremented\
    \ by 1. The value of `counter` is now 101. When the program reaches the test condition,\
    \ the test fails as `counter` is not smaller than 0. The program will then exit\
    \ the loop. Even though the original value of `counter` does not meet the test\
    \ condition (`counter < 0`), the code inside the curly braces is still executed\
    \ once.\n\nNote that for a `do while` statement, a semi-colon (`;`) is required\
    \ after the test condition.\n\n## Jump Statements\n\nWe’ve now covered most of\
    \ the control flow statements in C#. Next, let us look at jump statements.\n\n\
    A jump statement is a statement that instructs the program to deviate from its\
    \ normal flow sequence and jump to another line of code. Jump statements are commonly\
    \ used in loops and other control flow statements.\n\n### Break\n\nThe `break`\
    \ keyword causes the program to exit a loop prematurely when a certain condition\
    \ is met. We have already seen how the `break` keyword can be used in a `switch`\
    \ statement. Now, let us look at an example of how the `break` keyword can be\
    \ used in a `for` loop.\n\nConsider the code segment below:\n\n```cs\n1 int i\
    \ = 0;\n2\n3 for (i = 0; i < 5; i++)\n4 {\n5     Console.WriteLine(\"i = {0}\"\
    , i);\n6     if (i == 2)\n7         break;\n8 }\n```\n\nIn this example, we used\
    \ an `if` statement inside a `for` loop. It is very common for us to ‘mix-and-match’\
    \ various control tools in programming, such as using a `while` loop inside an\
    \ `if` statement or using a `for` loop inside a `while` loop. This is known as\
    \ a nested control statement.\n\nIf you run the code segment above, you will get\
    \ the following output.\n```\ni = 0\ni = 1\ni = 2\n```\n\nNotice that the loop\
    \ ends prematurely at `i = 2`?\n\nWithout the `break` keyword, the loop should\
    \ run from `i = 0` to `i = 4` because the loop condition is `i < 5`. However with\
    \ the `break` keyword, when `i = 2`, the condition on line 6 evaluates to `true`.\
    \ The `break` keyword on line 7 then causes the loop to end prematurely.\n\n###\
    \ Continue\n\nAnother commonly used jump keyword is the `continue` keyword. When\
    \ we use `continue`, the rest of the loop after the keyword is skipped. An example\
    \ will make it clearer.\n\n```cs\nfor (int i = 0; i < 5; i++)\n{\n    if (i ==\
    \ 2)\n        continue;\n    Console.WriteLine(\"i = {0}\", i);\n}\n```\n\nIf\
    \ you run the code above, you will get:\n```\ni = 0\ni = 1\ni = 3\ni = 4\n```\n\
    Notice that `i = 2` is skipped because of the `continue` keyword.\n\n## Exception\
    \ Handling\n\nWe’ve now learned how to control the flow of program under normal\
    \ circumstances using control statements and jump statements. Before we end this\
    \ chapter, we need to look at one last control statement, `try-catch-finally`.\
    \ The `try-catch-finally` statement controls how the program proceeds when an\
    \ error occurs. The syntax is as follows:\n\n```\ntry\n{\n    do something\n}\n\
    catch (type of error)\n{\n    do else\n}\nfinally\n{\n    do this\n}\n```\n\n\
    You can have more than one `catch` blocks. In addition, the `finally` block is\
    \ optional. Let’s consider an example.\n\n```cs\nint numerator, denominator;\n\
    Console.Write(\"Please enter the numerator: \");\nnumerator = Convert.ToInt32(Console.ReadLine());\n\
    Console.Write(\"Please enter the denominator: \");\ndenominator = Convert.ToInt32(Console.ReadLine());\n\
    try\n{\n    Console.WriteLine(\"The result is {0}.\", numerator/denominator);\n\
    }\ncatch (Exception e)\n{\n    Console.WriteLine(e.Message);\n}\nfinally\n{\n\
    \    Console.WriteLine(\"---- End of Error Handling ----\");\n}\n```\n\nIf you\
    \ run the code and enter 12 and 4, you’ll get the message\n```\nThe result is\
    \ 3.\n---- End of Error Handling ----\n```\nIn this example, the code in the `try`\
    \ block executes successfully. After the code in the `try` block is executed,\
    \ the code in the `finally` block is executed.\n\nNow suppose you enter 12 and\
    \ 0 instead. You’ll get\n```\nAttempted to divide by zero.\n---- End of Error\
    \ Handling ----\n```\nIn this case, the code in the `catch` block is executed\
    \ instead. This is because when the program tries to execute the statement in\
    \ the `try` block, an error occurs since you cannot divide a number by zero. Hence,\
    \ the statement in the `catch` block is executed. In addition, the code in the\
    \ `finally` block is also executed.\n\nThe `Exception` class handles all general\
    \ errors and has a property called `Message` that explains the reason for the\
    \ exception. To display that property, we write\n```cs\nConsole.WriteLine(e.Message);\n\
    ```\n\n## Specific Errors\n"
  raw: 'In the code above, we have a `char` variable `i` that is used for looping.
    Each time the loop runs, an element in the `message` array is assigned to the
    variable `i`. For instance, the first time the loop runs, the character ‘H’ is
    assigned to `i`.


    The line


    `Console.Write(i);`


    then prints out the letter ‘H’.


    The second time the loop runs, the character ‘e’ is assigned to `i`. The line


    `Console.Write(i);`


    prints out the letter ‘e’.


    This continues until all the elements in the array have been printed.


    While Loop


    Like the name suggests, a `while` loop repeatedly executes instructions inside
    the loop while a certain condition remains valid. The structure of a `while` statement
    is as follows:


    `while (condition is true)`


    `{`


    `do A`


    `}`


    Most of the time when using a `while` loop, we need to first declare a variable
    to function as a loop counter. Let’s call this variable `counter`. The code below
    shows an example of how a `while` loop works.


    `int counter = 5;`


    `while (counter > 0)`


    `{`


    `Console.WriteLine(“Counter = {0}”, counter);`


    `counter = counter – 1;`


    `}`


    If you run the code, you’ll get the following output


    `Counter = 5`


    `Counter = 4`


    `Counter = 3`


    `Counter = 2`


    `Counter = 1`


    A `while` statement has a relatively simple syntax. The statements inside the
    curly braces are executed as long as `counter > 0`.


    Notice that we have the line `counter = counter – 1` inside the curly braces?
    This line is crucial. It decreases the value of `counter` by 1 each time the loop
    is run.


    We need to decrease the value of `counter` by 1 so that the loop condition (`counter
    > 0`) will eventually evaluate to `false`. If we forget to do that, the loop will
    keep running endlessly, resulting in an infinite loop. The program will keep printing
    `counter = 5` until you somehow kill the program. Not a pleasant experience especially
    if you have a large program and you have no idea which code segment is causing
    the infinite loop.


    Do while


    The `do while` loop is similar to the `while` loop with one main difference -
    the code within the curly braces of a `do while` loop is executed at least once.
    Here’s an example of how a `do while` loop works.


    `int counter = 100;`


    `do {`


    `Console.WriteLine(“Counter = {0}”, counter);`


    `counter++;`


    `} while (counter<0);`


    As the test condition (`while (counter<0)`) is placed after the closing curly
    brace, it is tested after the code inside the curly braces is executed at least
    once.


    If you run the code above, you will get


    `Counter = 100;`


    After the `WriteLine()` statement is executed for the first time, `counter` is
    incremented by 1\. The value of `counter` is now 101\. When the program reaches
    the test condition, the test fails as `counter` is not smaller than 0\. The program
    will then exit the loop. Even though the original value of `counter` does not
    meet the test condition (`counter < 0`), the code inside the curly braces is still
    executed once.


    Note that for a `do while` statement, a semi-colon (`;`) is required after the
    test condition.


    Jump Statements


    We’ve now covered most of the control flow statements in C#. Next, let us look
    at jump statements.


    A jump statement is a statement that instructs the program to deviate from its
    normal flow sequence and jump to another line of code. Jump statements are commonly
    used in loops and other control flow statements.


    Break


    The `break` keyword causes the program to exit a loop prematurely when a certain
    condition is met. We have already seen how the `break` keyword can be used in
    a `switch` statement. Now, let us look at an example of how the `break` keyword
    can be used in a `for` loop.


    Consider the code segment below:


    `1 int i = 0;`


    `2`


    `3 for (i = 0; i < 5; i++)`


    `4 {`


    `5``Console.WriteLine("i = {0}", i);`


    `6``if (i == 2)`


    `7``break;`


    `8 }`


    In this example, we used an `if` statement inside a `for` loop. It is very common
    for us to ‘mix-and-match’ various control tools in programming, such as using
    a `while` loop inside an `if` statement or using a `for` loop inside a `while`
    loop. This is known as a nested control statement.


    If you run the code segment above, you will get the following output.


    `i = 0`


    `i = 1`


    `i = 2`


    Notice that the loop ends prematurely at `i = 2`?


    Without the `break` keyword, the loop should run from `i = 0` to `i = 4` because
    the loop condition is `i < 5`. However with the `break` keyword, when `i = 2`,
    the condition on line 6 evaluates to `true`. The `break` keyword on line 7 then
    causes the loop to end prematurely.


    Continue


    Another commonly used jump keyword is the `continue` keyword. When we use `continue`,
    the rest of the loop after the keyword is skipped for that iteration. An example
    will make it clearer.


    If you run the code segment below


    `for (int i = 0; i<5; i++)`


    `{`


    `Console.WriteLine(“i = {0}”, i);`


    `if (i == 2)`


    > `continue;`


    `Console.WriteLine(“I will not be printed if i=2.\n”);`


    `}`


    You will get the following output:


    `i = 0`


    `I will not be printed if i=2.`


    `i = 1`


    `I will not be printed if i=2.`


    `i = 2`


    `i = 3`


    `I will not be printed if i=2.`


    `i = 4`


    `I will not be printed if i=2.`


    When `i = 2`, the line after the `continue` keyword is not executed. Other than
    that, everything runs as per normal.


    Exception Handling


    We’ve now learned how to control the flow of a program under ‘normal’ circumstances
    using control flow statements and jump statements. Before we end this chapter,
    we need to look at one last control statement, the `try-catch-finally` statement.
    The `try-catch-finally` statement controls how the program proceeds when an error
    occurs. The syntax is as follows:


    `try`


    `{`


    `do something`


    `}`


    `catch (type of error)`


    `{`


    `do something else when an error occurs`


    `}`


    `finally`


    `{`


    `do this regardless of whether the try or catch condition is met.`


    `}`


    You can have more than one `catch` blocks. In addition, the `finally` block is
    optional.


    Let’s consider an example.


    `int numerator, denominator;`


    `Console.Write("Please enter the numerator: ");`


    `numerator = Convert.ToInt32(Console.ReadLine());`


    `Console.Write("Please enter the denominator: ");`


    `denominator = Convert.ToInt32(Console.ReadLine());`


    `try`


    `{`


    `Console.WriteLine("The result is {0}.", numerator/denominator);`


    `}`


    `catch (Exception e)`


    `{`


    `Console.WriteLine(e.Message);`


    `}`


    `finally`


    `{`


    `Console.WriteLine(“``---- End of Error Handling Example ----``”);`


    `}`


    If you run the code and enter 12 and 4, you’ll get the message


    `The result is 3\.`


    `---- End of Error Handling Example ----`


    In this example, the code in the `try` block executes successfully. After the
    code in the `try` block is executed, the code in the `finally` block is executed.


    Now suppose you enter 12 and 0 instead. You’ll get


    `Attempted to divide by zero.`


    `---- End of Error Handling Example ----`


    In this case, the code in the `catch` block is executed instead. This is because
    when the program tries to execute the statement in the `try` block, an error occurs
    since you cannot divide a number by zero. Hence, the statement in the `catch`
    block is executed. In addition, the code in the `finally` block is also executed.
    The `finally` block is always executed regardless of whether the `try` or `catch`
    block is executed.


    The `catch` block allows us to specify the type of error that it should catch.
    In this case, we are trying to catch a general error. Therefore, we write


    `catch (Exception e)`


    where `Exception` refers to the class that the error belongs to and `e` is the
    name given to the error.


    The `Exception` class handles all general errors and has a property called `Message`
    that explains the reason for the exception. To display that property, we write


    `Console.WriteLine(e.Message);`


    Specific Errors'
