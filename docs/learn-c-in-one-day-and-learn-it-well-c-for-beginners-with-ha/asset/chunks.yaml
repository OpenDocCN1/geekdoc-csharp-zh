    (i.e. a constructor with no parameter) in the parent class and calls that first
    before executing the code in the child constructor. If you use this constructor
    to create a child object, the following two lines will be displayed on the screen


    `Parent Constructor with no parameter`


    `Child constructor with no parameter`


    The first line is from the parent constructor while the second line is from the
    child constructor.


    The second way to declare a child constructor is to use the colon sign (:) and
    the `base` keyword to call a non parameterless constructor in the parent class.
    An example is shown below:


    `public NormalMember(string remarks) :` `base (“Jamie”, 1, 2015)`


    `{`


    `Console.WriteLine("Remarks = {0}", remarks);`


    `}`


    When we call a non parameterless constructor in the parent class, we need to pass
    in values to its parameters. In the example above, we passed in the values “Jamie”,
    1 and 2015 to the parent constructor. These values are then assigned to the fields
    `name`, `memberID` and `memberSince` in the base class respectively.


    In this example, we passed in fixed values as arguments to the base constructor.
    However, a better way is to pass in the arguments through the child constructor.
    The example below shows how this can be done. Replace the previous constructor
    with the constructor below:


    `public NormalMember(string remarks, string name, int memberID, int memberSince)
    : base (name, memberID, memberSince)`


    `{`


    `Console.WriteLine("Child Constructor with 4 parameters");`


    `Console.WriteLine("Remarks = {0}", remarks);`


    }


    This new child constructor has four parameters. The first parameter is a `string`
    parameter called `remarks`. This parameter is used inside the child constructor.


    The second, third and fourth parameters are not used in the child constructor.
    Instead, they are passed in as arguments to the parent constructor based on their
    names. For instance, the second parameter in the child constructor (`string name`)
    is passed in as the first argument to the parent constructor (`name`).


    When we create a child object with this constructor, we write something like


    `NormalMember myChildMember = new NormalMember(“Special Rate”,` `"James", 1, 2010``);`


    The base constructor with 3 parameters is called and executed first. The values
    “James”, 1 and 2010 are passed to the base constructor. Behind the scene, these
    values are assigned to the fields `name`, `memberID` and `memberSince` in the
    base class respectively.


    After executing the base constructor, the child constructor will be executed.
    The string “Special Rate” is assigned to `remarks` and displayed on the screen.


    When you run the code, you will get the following output


    `Parent Constructor with 3 parameters`


    `Child Constructor with 4 parameters`


    `Remarks = Special Rate`


    Now that we have created the constructors for our child class, let us move on
    to create a method to calculate the annual fee of a normal member. The code is
    simply


    `public void CalculateAnnualFee()`


    `{`


    `annualFee = 100 + 12*30;`


    `}`


    When we write “annualFee” in the code above, we are accessing the protected field
    `annualFee` in the parent class. Recall that a child class has access to all public
    and protected fields in its parent class? Hence, the child class can use this
    field as if it is its own field. The child class does not need to create an instance
    of the parent class in order to access its protected fields.


    That’s all for our child class `NormalMember`. The class has the following contents:


    Fields


    Inherited from parent class:


    `protected int annualFee`


    Methods


