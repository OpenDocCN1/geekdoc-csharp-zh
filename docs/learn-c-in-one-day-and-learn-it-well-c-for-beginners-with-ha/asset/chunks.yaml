  trans: "\n在我们实例化 `StreamWriter` 对象后，可以使用下所示的 `WriteLine()` 方法开始向文件写入内容：\n\n```\n\
    sw.WriteLine(“It is easy to write to a file.”);\n```\n\n当我们完成对文件的写入后，必须通过写入以下代码来关闭文件：\n\
    \n```c\nsw.Close();\n```\n\n请注意，当你写入文本文件时，将代码封装在 `using` 语句中也是良好的习惯。下面的代码展示了这些内容如何结合在一起的完整示例。\n\
    \n```c\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\n\nnamespace\
    \ FileDemo\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            //声明文件的路径\n            string path = \"myfile.txt\";\n\
    \            // 写入文件\n            using(StreamWriter sw=new StreamWriter(path,\
    \ true))\n            {\n                sw.WriteLine(\"ABC\");\n            \
    \    sw.WriteLine(\"DEF\");\n                sw.Close();\n            }\n    \
    \        // 从文件中读取\n            if (File.Exists(path))\n            {\n      \
    \          using(StreamReader sr=new StreamReader(path))\n                {\n\
    \                    while (!sr.EndOfStream)\n                    {\n        \
    \                Console.WriteLine(sr.ReadLine());\n                    }\n  \
    \                  sr.Close();\n                }\n            }\n           \
    \ Console.Read();\n        }\n    }\n}\n```\n\n在这个示例中，我们选择在写入文件时向其追加数据。当你第一次运行此程序时，你将得到\n\
    \n`ABC`\n`EFG`\n\n作为文件输出和屏幕显示。如果你运行第二次，你将得到\n\n`ABC`\n`EFG`\n`ABC`\n`EFG`\n\n\
    由于此例中中没有给出“myfile.txt”的完整路径，文本文件将在 `.exe` 文件相同的文件夹中创建，该文件夹位于 `FileDemo` > `FileDemo`\
    \ > `Debug` > `Bin` 文件夹下。\n\n# 项目 – 一个简单的工资管理软件\n\n## 恭喜！\n\n我们现在已经完成了 C# 的核心概念。在最后一章中，我们将通过编写一个完整的控制台应用程序来尝试，该程序将生成一家小公司的工资单。\n\
    \n准备好了吗？\n\n## 概述\n\n首先，让我们创建一个新的控制台应用程序并将其命名为 `CSProject`。\n\n该应用程序由六个类组成，如下：\n\
    \n* `Staff`\n* `Manager : Staff`\n* `Admin : Staff`\n* `FileReader`\n* `PaySlip`\n\
    * `Program`\n\n`Staff` 类包含公司中每个员工的信息。它还包含一个名为 `CalculatePay()` 的虚方法，用于计算每位员工的工资。\n\
    \n`Manager` 和 `Admin` 类继承自 `Staff` 类并重写了 `CalculatePay()` 方法。\n\n`FileReader`\
    \ 类包含一个简单的方法，用于从 `.txt` 文件读取内容，并根据文件内容创建 `Staff` 对象列表。\n\n`PaySlip` 类生成生成工资单生成每月工作时间少于\
    \ 10 小时的员工详情摘要。\n\n最后，`Program` 类包含 `Main()` 方法，该方法作为我们应用程序的主入口。\n\n## Staff 类\n\
    \n首先，让我们从 `Staff` 类开始。`Staff` 类包含了员工的基本信息，并提供了一个计算基本工资的方法。它作为一个父类，另外两个类将派生自它。\n\
    \n### 字段\n\n该类有一个名为 `hourlyRate` 的 `private` `float` 字段和一个名为 `hWorked` 的 `private\
    \ int` 字段。尝试你自己来声明这些字段。\n\n### 属性\n\n接下来，为该类声明三个 `public` 自动实现属性。这些属性是 `TotalPay`、`BasicPay`\
    \ 和 `NameOfStaff`。\n\n`TotalPay` 是一个 `float` 属性，并有一个 `protected` setter。`BasicPay`\
    \ 是一个 `float` 属性，有一个 `private` setter。`NameOfStaff` 是一个 `string` 属性，并有一个 `private`\
    \ setter。所有三个属性的 getter 都是 `public`。因此，你不需要为这些 getter 声明访问修符，因为它们与属性的访问级别相同。\n\
    \n除了这三个自动实现的方法外，`Staff` 类还有一个名为 `HoursWorked` 的 `public` 属性。该属性的备份字段是 `hWorked`\
    \ 字段。\n\n该属性有一个 getter，简单返回 `hWorked` 的值。setter 会检查为 `HoursWorked` 设置的值是否大于 0。如果是，则将\
    \ `value` 赋值给 `hWorked`。如果不是，则将 0 赋值给 `hWorked`。尝试自己声明此属性。你可以参考第 7 章寻求帮助。\n\n\
    ### 构造函数\n\n`Staff` 类有一个带有两个参数的 `public` 构造函数：`name` (`string`) 和 `rate` (`float`)。在构造函数内部，我们将这两个参数分别赋值给属性\
    \ `NameOfStaff` 和字段 `hourlyRate`。尝试自己编写这个构造函数。\n\n### 方法\n\n现在，让我们为该类编写方法。\n\n\
    首先，我们将编写一个名为 `CalculatePay()` 的虚方法。\n\n`CalculatePay()` 是 `public` 的，没有参数也没有返回值。该方法做了三件事：首先，它在屏幕上打印“Calculating…”。接下来，它将\
    \ `hourlyRate` 赋值给 `BasicPay` 属性。最后，它将 `BasicPay` 赋值给 `TotalPay` 属性。尝试编写这个方法。\n\
    \n最后，编写一个 `ToString()` 方法来显示 `Staff` 类的值。下表显示了 `Staff` 类的内容。\n\n#### 字段\n`private\
    \ float hourlyRate`\n`private int hWorked`\n\n#### 属性\n`public float TotalPay`\n\
    `public float BasicPay`\n`public string NameOfStaff`\n`public int HoursWorked`\n\
    \n#### 构造函数\n`public Staff(string name, float rate)`\n\n#### 方法\n`public virtual\
    \ void CalculatePay()`\n`public string ToString()`\n\n## Manager : Staff 类\n\n\
    接下来，让我们编写 `Manager` 类。\n\n### 字段\n\n`Manager` 类是 `Staff` 的子类。它有一个名为 `managerHourlyRate`\
    \ 的 `private` 字段。尝试声明此字段并将其初始化为 50。\n\n### 属性\n\n`Manager` 还有一个名为 `Allowance`\
    \ 的 `public` 自动实现属性。`Allowance` 是 `int` 类型并有一个 `private` setter。尝试编写此属性。\n\n###\
    \ 构造函数\n\n现在，让我们为 `Manager` 声明构造函数。`Manager` 类有一个带有 `string` 参数 `name` 的 `public`\
    \ 构造函数。构造函数的任务是调用基构造函数并将参数 `name` 和字段 `managerHourlyRate` 传递。。除此之外子构造函数什么都不做。因此，子构造函数的大括号内为空。尝试编写此构造函数。\n\
    \n### 方法\n\n接下来，让我们编写一个方法来重写 `Staff` 类中的 `CalculatePay()` 方法。由于 `Manager` 派自 `Staff`，它可以访问\
    \ `Staff` 类中定义的 `BasicPay`、`TotalPay` 和 `HoursWorked` 属性。\n\n此外，`Manager` 还有自己的属性\
    \ – `Allowance`。我们将在方法中使用这四个属性。\n\n首先，让我们声明该方法。`CalculatePay()` 是 `public` 的且没有返回值。声明此方法时必须使用\
    \ `override` 关键字，因为它重写了 `Staff` 类中的 `CalculatePay()` 方法。\n\n在 `Manager` 类的 `CalculatePay()`\
    \ 方法中，我们首先调用父类的 `CalculatePay()` 方法并用它来设置 `BasicPay` 和 `TotalPay` 的值。要调用父类的虚方法，必须使用\
    \ `base` 关键字。将以下行添加到你的 `CalculatePay()` 方法中。\n\n```csharp\nbase.CalculatePay();\n\
    ```\n\n这调用了基类的 `CalculatePay()` 方法，设置了 `BasicPay` 和 `TotalPay` 的值。在设置了这两个属性值后，让我们继续设置\
    \ `Allowance` 的值。我们将该值设置为 1000。\n"
