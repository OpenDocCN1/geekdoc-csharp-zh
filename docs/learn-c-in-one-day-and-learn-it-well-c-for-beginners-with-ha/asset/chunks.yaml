    \ 第 1 章：C# 简介\n\n欢迎学习 C# 编程，感谢你选择这本书！\n\n无论你是经验丰富的程序员还是完全初学者，这本书的编写都是为了帮助你快速学习\
    \ C# 编程。书主题经过精心挑选，旨在让你对 C# 有广泛的了解，同时不会让信息过载让你感到无从从。\n\n读完本书后，你应该能够毫无问题地编写自己的 C#\
    \ 程序。事实上，我们将在书末的项目中一起编写一个简单的薪资软件。准备好开始了吗？\n\n首先，让我们来回答几个问题：\n\n### 什么是 C#？\n\n\
    `C#`（读作 C Sharp）是由 Anders Hejlsberg 领导的微软在 2000 年初开发的面向对象的编程语言。它是 .Net 框架的一部分，旨在成为一种简单的通用编程语言，用于开发不同类型的应用程序，包括控制台、窗口、Web\
    \ 和移动应用程序。\n\n与所有现代编程语言一样，`C#` 代码类似于计算机无法理解的英语。因此，`C#` 代码必须使用所谓的“编译器”（参见脚注）转换为机器语言。我们在本书书中将使用的编译器是微软提供的免费版\
    \ `Visual Studio Community 2015`。\n\n### 为什么要学习 C#？\n\n\n\n`C#` 的语法和特性与 `Java`\
    \ 和 `C++` 等其他编程语言相似。因此，如果你有任何编程经验，你会发现学习 `C#` 是一件轻而易举的事。即使你对编程一无从，`C#` 的设计也易于学习（不像\
    \ `C` 或 `C++`），是一门非常棒的入门门语言。\n\n此外，`C#` 是 .Net 框架的一部分。该框架包含大型预写代码库，程序员可以使用这些代码，而不需要从头开始编写一切。这允许程序员在\
    \ `C#` 中快速开发应用程序，使得 `C#` 成为你在时间紧迫时工作的理想语言。\n\n最后，`C#` 是一门面向对象编程 (`OOP`) 的语言。面向对象编程是一种将问题分解为相互作用的对象的方法。一旦你掌握了\
    \ `C#`，你就能熟悉这些概念，这将使你将来更容易地掌握其他面向对象的编程语言。\n\n脚注：将 `C#` 程序转换为机器语言实际上要稍微复杂一些。Visual\
    \ Studio Community 仅仅将 `C#` 程序转换为 `MIL`，代表微软中间语言（Microsoft Intermediate Language）。这些\
    \ `MIL` 代码然后由一个称为通用语言运行时（Common Language Runtime）的虚拟执行系统转换为机器语言。更多信息，请检查 `https://msdn.microsoft.com/en-us/library/z1zx92`。尽管如此，对于我们的目的，不需要了解这些复杂的细节来编写自己的\
    \ `C#` 程序。\n\n# 第 2 章：为 C# 做好准备\n\n### 安装 Studio Community\n\n在开始用 `C#` 开发应用程序之前，我们需要下载\
    \ `Visual Studio Community`。正如第 1 章提到的，`Visual Studio Community` (`VSC`) 是微软提供的一个免费编译器。事实上，`VSC`\
    \ 不仅仅是一个编译器。它是一个集成开发环境 (`IDE`)，包含一个用于编写代码的文本编辑器和一个帮助我们识别编程错误的调试器。\n\n要下载 `VSC`，请访问\
    \ `https://www.visualstudio.com/en-us/products/visual-studio-community`。\n\n![](img/00004.jpg)\n\
    \n点击 `Download Community 2015` 下载文件。下载完成后，双击安装 `VSC`。安装后，系统将提示你重启电脑。重启电脑后，你就可以开始编写你的第一个\
    \ `C#` 程序了。\n\n### 你的第一个 C# 程序\n\n为了编写我们的第一个程序，让我们在桌面上创建一个文件夹并将其命名为 `C# Projects`。我们将所有的\
    \ `C#` 项目都保存在这个文件夹中。\n\n接下来，启动 `VSC` 并选择 `File` > `New` > `Project…`（如果你找不到 `VSC`，可能需要搜索\
