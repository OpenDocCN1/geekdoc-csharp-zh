    `Enter your grade: Hello`


    `Fail`


    For Loop


    The `for` loop executes a block of code repeatedly until the test condition is
    no longer valid.


    The syntax for a `for` loop is as follows:


    `for (initial value; test condition; modification to value)`


    `{`


    `//Do Some Task`


    `}`


