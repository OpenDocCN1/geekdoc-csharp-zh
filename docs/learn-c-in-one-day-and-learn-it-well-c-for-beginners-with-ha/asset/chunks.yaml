    \ language is actually a bit more complicated. Visual Studio Community merely\
    \ converts `C#` program into `MIL`, which stands for Microsoft Intermediate Language.\
    \ This `MIL` code is then converted into machine language by a virtual execution\
    \ system known as the Common Language Runtime. For more information, you can check\
    \ `https://msdn.microsoft.com/en-us/library/z1zx92`. Nonetheless, for our purpose,\
    \ we do not need to know these intricate details to develop our own `C#` programs.\n\
    \n# Chapter 2: Getting ready for C#\n\n### Installing Studio Community\n\nBefore\
