  trans: "\n\n继承是面向对象编程的核心概念之一。简单来说，继承允许我们从现有的类创建一个新类，从而能够有效地复用现有代码。\n\n## 编写父类\n\n\
    假设我们正在为一家健身俱乐部编写程序，该俱乐部有两种类型的会员：VIP 和普通会员（Normal）。为了实现这一点，我们先创建一个名为 `Member` 的类。\n\
    \n```csharp\nclass Member\n{\n  protected int annualFee;\n  private string name;\n\
    \  private int memberID;\n  private int memberSince;\n}\n```\n\n`Member` 包含一个受保护字段（protected）和三个私有字段（private）。受保护字段只能在声明它的类以及任何派生自它的类中访问。我们很快就会讨论派生类。\n\
    \n接下来，让我们写一个 `ToString()` 方法来显示这四个字段的值。\n\n```csharp\npublic override string ToString()\n\
    {\n  return \"\\nName: \" + name + \"\\nMember ID: \" + memberID + \"\\nMember\
    \ Since: \" + memberSince + \"\\nTotal Annual Fee: \" + annualFee;\n}\n```\n\n\
    最后，我们为 `Member` 类添加两个构造函数。\n\n```csharp\npublic Member()\n{\n  Console.WriteLine(\"\
    Parent Constructor with no parameter\");\n}\npublic Member(string pName, int pMemberID,\
    \ int pMemberSince)\n{\n  Console.WriteLine(\"Parent Constructor with 3 parameters\"\
    );\n  name = pName;\n  memberID = pMemberID;\n  memberSince = pMemberSince;\n\
    }\n```\n\n第一个构造函数仅仅打印一行“Parent Constructor with no parameter”。\n\n第二个构造函数则更有趣。它打印“Parent\
    \ Constructor with 3 parameters”，并将其参数赋值给 `Member` 类中的三个私有字段。\n\n## 编写子类\n\n现在，让我们学习如何从\
    \ `Member` 类派生出一个类。派生类被称为子类（child classes），而它们派生自的类则被称为父类（parent classes）或基类（base\
    \ classes）。\n\n派生类继承父类的所有的公共和受保护成员。换句话说，它可以使用这些字段、属性和方法，就像它们是自己代码的一部分一样。\n\n我们的父类（`Member`）包含以下内容：\n\
    \n### 字段\n- `protected int annualFee`\n- `private string name`\n- `private int\
    \ memberID`\n- `private int memberSince`\n\n### 方法\n- `public override string\
    \ ToString()`\n\n### 构造函数\n- `public Member()`\n- `public Member(string pName,\
    \ int pMemberID, int pMemberSince)`\n\n我们将从 `Member` 类派生出两个类——`NormalMember` 和\
    \ `VIPMember`。\n\n首先，我们声明子类 `NormalMember`。我们使用冒号（`:`）来指示它派生自 `Member` 类：\n\n\
    ```csharp\nclass NormalMember : Member\n{\n}\n```\n\n现在，我们需要为子类编写构造函数。子类的构造函数是基于父构造函数构建的。每当我们创建一个子对象时，父类的构造函数总是会被调用。\n\
    \n创建子类构造函数有两种方法。第一种是像其他构造函数一样简单地声明。\n\n```csharp\npublic NormalMember()\n{\n \
    \ Console.WriteLine(\"Child constructor with no parameter\");\n}\n```\n\n当我们像上面那样声明构造函数时，C#会在父类中查找无参数构造函数（即没有参数的构造函数），并在执行子类构造函数中的代码之前先调用它。如果你使用这个构造函数创建子对象，屏幕上将显示以下两行：\n\
    \n`Parent Constructor with no parameter`\n`Child constructor with no parameter`\n\
    \n第一行来自父构造函数，第二行来自子构造函数。\n\n声明子类构造函数的第二种方法是使用冒号（`:`）和 `base` 关键字来调用父类中的非参数构造函数。示如下所示：\n\
    \n```csharp\npublic NormalMember(string remarks) : base (“Jamie”, 1, 2015)\n{\n\
    \  Console.WriteLine(\"Remarks = {0}\", remarks);\n}\n```\n\n当我们调用父类中的非参数构造函数时，我们需要向其参数传递值。在上面的示例中，我们将值“Jamie”、1\
    \ 和 2015 传递给父构造函数。这些值随后会被分别赋值给基类中的 `name`、`memberID` 和 `memberSince` 字段。\n\n在例例中，我们将固定值作为参数传递给基构造函数。然而，更好的方法是通过子类构造函数传递参数。下面的示例显示了如何这样做。将之前的构造函数替换为下面的构造函数：\n\
    \n```csharp\npublic NormalMember(string remarks, string name, int memberID, int\
    \ memberSince) : base (name, memberID, memberSince)\n{\n  Console.WriteLine(\"\
    Child Constructor with 4 parameters\");\n  Console.WriteLine(\"Remarks = {0}\"\
    , remarks);\n}\n```\n\n这个新的子构造函数有四个参数。第一个参数是一个名为 `remarks` 的 `string` 参数。该参数在子类构造函数内部使用。\n\
    \n第二、第三和第四个参数在子类构造函数中没有使用。相反，它们根据名称作为参数传递给父构造函数。例如，子类构造函数的第二个参数（`string name`）被传递给父构造函数的第一个参数（`name`）。\n\
    \n当我们使用此构造函数创建子对象时，编写如下代码：\n\n```csharp\nNormalMember myChildMember = new NormalMember(“Special\
    \ Rate”, \"James\", 1, 2010);\n```\n\n带 3 个参数的父构造函数会被调用。“James”、1 和 2010 被传递给基构造函数。在幕后，这些值被赋值给基类的\
    \ `name`、`memberID` 和 `memberSince`。\n\n执行基构造函数后，子构造函数将执行。字符串“Special Rate”被赋值给\
    \ `remarks` 并显示在屏幕上。\n\n当你运行代码时，将得到以下输出：\n\n`Parent Constructor with 3 parameters`\n\
    `Child Constructor with 4 parameters`\n`Remarks = Special Rate`\n\n为我们的子类创建构造函数后，让我们创建一个计算普通会员年费的方法。代码如下：\n\
    \n```csharp\npublic void CalculateAnnualFee()\n{\n  annualFee = 100 + 30;\n}\n\
    ```\n\n在上面的代码中编写 `annualFee` 时，我们正在访问父类中的受保护字段 `annualFee`。记得子类不需要创建父类的实例即可访问其受保护字段。\n\
    \n这就是子类 `NormalMember` 的全部。该类包含以下内容：\n\n### 字段\n继承自父类：\n- `protected int annualFee`\n\
    \n### 方法\n继承自父类：\n- `public override string ToString()`\n在子类中声明：\n- `public void\
    \ CalculateAnnualFee()`\n\n### 构造函数\n- `public NormalMember()`\n- `public NormalMember(string\
    \ remarks, string name, int memberID, int memberSince)`\n\n接下来，让我们编写另一个继承自 `Member`\
    \ 的类。这次，派生类被称为 `VIPMember`。代码如下：\n\n```csharp\nclass VIPMember : Member\n{\n \
    \ public VIPMember(string name, int memberID, int memberSince) : base (name, memberID,\
    \ memberSince)\n  {\n    Console.WriteLine(\"Child Constructor with 3 parameters\"\
    );\n  }\n  public void CalculateAnnualFee()\n  {\n    annualFee = 1200;\n  }\n\
    }\n```\n\n该类有一个构造函数（带 3 个参数）和一个方法 `CalculateAnnualFee()`。这里的 `CalculateAnnualFee()`\
    \ 方法使用的计算年费的公式与 `NormalMember` 类中的 `CalculateAnnualFee()` 方法不同。这两个方法共享相同的名称（和签名）是可以的，因为它们位于不同的类中。\n\
    \n`VIPMember` 类包含以下内容：\n\n### 字段\n继承自父类：\n- `protected int annualFee`\n\n### 方法\n\
    继承自父类：\n- `public override string ToString()`\n在子类中声明：\n- `public void CalculateAnnualFee()`\n\
    \n"
- fmt: "\n```csharp\npublic void CalculateAnnualFee()\n```\n\n### Constructors\n\n\
    ```csharp\npublic VIPMember(string name, int memberID, int memberSince)\n```\n\
    \n### The Main() method\n\nNow that we have written the three classes that we\
    \ need, let’s write the code for the `Main()` method.\n\nFirst, we’ll create two\
    \ objects from the two derived classes.\n\n```csharp\nNormalMember mem1 = new\
