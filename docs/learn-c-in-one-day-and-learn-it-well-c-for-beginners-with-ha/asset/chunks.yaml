    在给 `path` 变量赋值后，我们想要实例化一个 `StreamWriter` 对象，以向 `path` 变量指定的路径写入文件。这会覆盖文件中已有的任何内容，以确保生成的每份工资单都不包含上个月的内容。如果你忘记了如何使用
    `StreamWriter` 类，请参阅第 11 章。我们将 `StreamWriter` 对象命名为 `sw`。


    随后，我们可以使用一系列 `sw.WriteLine()` 语句来生成每位员工的工资单。


    经理的典型工资单如下所示：


    ```

    1 PAYSLIP FOR DEC 2010

    2==========================

    3 Name of Staff: Yvonne

    4 Hours Worked: 1231

    5

    6 Basic Pay: $61,550.00

    7 Allowance: $1,000.00

    8

    9==========================

    10 Total Pay: $62,550.00

    11 ==========================

    ```


    左侧的数字是为了参考添加的，并不是实际工资单的一部分。


    行政人员的典型工资单与上述类似，但第 7 行不同。对于行政人员，第 7 行的内容类似于：


    ```

    Overtime Pay: $1,286.50

    ```


    现在让我们来看看如何生成此份工资单。


    要编写第 1 行，我们需要访问类中的 `month` 和 `year` 字段。由于 `month` 是整数，我们需要将其强制转换为 `MonthsOfYear`
    枚举类型值，这样它会被写入为 `DEC` 而不是 `12`。下面的语句显示了如何编写第 1 行。


    ```

    sw.WriteLine("PAYSLIP FOR {0} {1}", ((MonthsOfYear)month, year);

    ```


    第 2 行很容易编写。它仅仅由一系列等号（=）组成。尝试自己写一下代码。


    要编写第 3 行和第 4 行，我们需要访问 `Staff` 类中的 `NameOfStaff` 和 `HoursWorked` 属性。下面的语句显示了如何处理第
    3 行。


    ```

    sw.WriteLine("Name of Staff: {0}", f.NameOfStaff);

    ```


    尝试自己编写第 4 行。


    接下来，我们使用 `sw.WriteLine("");` 语句来打印一个空行。


    要编写第 6 行，我们需要访问 `Staff` 类中的 `BasicPay` 属性。此外，我们还需要使用 `C` 格式说明符以货币符号显示 `BasicPay`
    属性（参阅第 5 章）。尝试自己操作一下。


    第 7 行编写较困难，因为我们需要确定 `foreach` 循环中当前对象的运行时类型。我们在第 8 章中学习了如何做到这一点。如果当前实例是 `Manager`
    对象，我们访问并打印 `Manager` 类中的 `Allowance` 属性。为了访问 `Manager` 类中的 `Allowance` 属性，我们需要通过编写以下代码将
    `f` 强制转换为 `Manager` 对象：


    ```

    ((Manager)f).Allowance

    ```


    如果当前实例是行政人员对象，我们将访问并打印其加班费。

