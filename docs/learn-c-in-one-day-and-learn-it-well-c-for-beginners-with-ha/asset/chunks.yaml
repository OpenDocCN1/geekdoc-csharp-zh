    Array Properties and Methods


    C# comes with a number of useful properties and methods that we can use with an
    array.


    We’ll learn more about properties and methods in Chapter 7 when we discuss classes.
    For now, all we have to know is that to use a property or method, we need to use
    the dot (`.`) operator. To use a property, we type the property name after the
    dot. To use a method, we type the method name after the dot operator, followed
    by a pair of parenthesis ().


    Length


    The `Length` property of an array tells us the number of items the array has.


    For instance, if we have


    `int [] userAge = {21, 22, 26, 32, 40};`


    `userAge.Length` is equal to 5 as there are 5 numbers in the array.


    Copy()


    The `Copy()` method allows you to copy the contents of one array into another
    array, starting from the first element.


    In C#, a method may have many different variations. For instance, the `Copy()`
    method comes in four different variations. The example below discusses one of
    the four variations. If you learn how to use one variation, you can figure out
    how to use the other `Copy()` methods with relative ease.


    Whenever we use a method, we need to put a pair of parenthesis () after the method
    name. Some methods require certain data for it to work. These data are known as
    arguments. We include these arguments in the pair of parenthesis. The `Copy()`
    method requires three arguments.


    Suppose you have


    `int [] source = {12, 1, 5, -2, 16, 14};`


    and


    `int [] dest = {1, 2, 3, 4};`


    You can copy the first three elements of `source` into `dest` by using the statement
    below:


    `Array.Copy(source, dest, 3);`


    The first argument is the array that provides the values to be copied. The second
    is the array where the values will be copied into. The last argument specifies
    the number of items to copy.


    In our example, our `dest` array becomes `{12, 1, 5, 4}` while the `source` array
    remains unchanged.


    Sort()


    The `Sort()` method allows us to sort our arrays. It takes in an array as the
    argument.


    Suppose you have


    `int [] numbers = {12, 1, 5, -2, 16, 14};`


    You can sort this array by writing


    `Array.Sort(numbers);`


    The array will be sorted in ascending order. Thus, `numbers` becomes `{-2, 1,
    5, 12, 14, 16}`.


    IndexOf()


    We use the `IndexOf()` method to determine if a certain value exists in an array.
    If it exists, the method returns the index of the first occurrence of that value.
    If it does not exist, the method returns -1\.


    For instance, if you have


    `int [] numbers = {10, 30, 44, 21, 51, 21, 61, 24, 14};`


    you can find if the value 21 exists in the array by writing


    `Array.IndexOf(numbers, 21);`


    The method returns the index of the first value found, which is 3 in this case
    since 21 is the fourth element in the array. You can then assign the answer to
    a variable like this:


    `int ans = Array.IndexOf(numbers, 21);`


    The value of `ans` is thus 3\. If you write


    `ans = Array.IndexOf(numbers, 100);`


    the value of `ans` is -1 as 100 does not exist in the `numbers` array.


