  trans: "\n\n`ToString()` 方法是一个特殊的方法，它返回一个表示当前类的字符串。在 C# 中，所有类都带有一个预定义的 `ToString()`\
    \ 方法。然而，按照惯例（这也是对我们要求的），我们应该重写这个方法。重写方法简单来说意味着编写我们自己的方法版本。\n\n通常情况下，我们编写的 `ToString()`\
    \ 方法会显示类的字段和属性的值。请向 `Staff` 类中添加以下代码：\n\n```csharp\npublic override string ToString()\n\
    {\n    return \"Name of Staff = \" + nameOfStaff + \", hourlyRate = \" + hourlyRate\
    \ + \", hWorked = \" + hWorked;\n}\n```\n\n如你所见，`ToString()` 方法返回一个 `string` 类型。它返回的字符串包含了关于\
    \ `Staff` 类的信息。方法声明中的 `override` 关键字表示此方法重写了默认方法。我们将在下一章详细讨论 `override` 关键字。\n\
    \n#### 构造函数\n\n现在，让我们来看构造函数。\n\n构造函数是一种特殊的方法，用于从类模板中“构造”对象。每当我们从类中创建对象时，它是第一个被调用的方法。构造函数通常用于初始化类的字段。\n\
    \n构造函数始终与类同名（在我们的案例中为 `Staff`），并且不返回任何值。在声明构造函数时，我们不需要使用 `void` 关键字。\n\n向我们的 `Staff`\
    \ 类添加以下行。\n\n```csharp\npublic Staff(string name)\n{\n    nameOfStaff = name;\n\
    \    Console.WriteLine(\"\\n\" + nameOfStaff);\n    Console.WriteLine(\"--------------------------\"\
    );\n}\n```\n\n在这个构造函数中，我们首先用传入构造函数的字符串（`name`）初始化字段 `nameOfStaff`。然后，我们在屏幕上显示\
    \ `nameOfStaff` 的值，并用一系列横线对其进行下划。\n\n与任何其他方法一样，只要签名不同，我们就可以有多个构造函数。我们可以为类添加另一个构造函数。\n\
    \n```csharp\npublic Staff(string firstName, string lastName)\n{\n    nameOfStaff\
    \ = firstName + \" \" + lastName;\n    Console.WriteLine(\"\\n\" + nameOfStaff);\n\
    \    Console.WriteLine(\"--------------------------\");\n}\n```\n\n这个构造函数有两个参数——`firstName`\
    \ 和 `lastName`。第一行将两个字符串拼接并将结果字符串赋值给 `nameOfStaff`。接下来的两行在屏幕上打印 `nameOfStaff`\
    \ 并用一系列横线对其进行下划。\n\n声明构造函数是可选的。如果你不声明自己的构造函数，C# 会自动为你创建一个。默认构造函数只是将类中的所有字段初始化为默认值，对于数值字段，通常为\
    \ 0；对于字符串字段，则为空字符串。\n\n## 实例化对象\n\n现在我们已经知道了如何创建类，让我们看看如何利用该类来创建对象。这个过程被称为实例化对象。对象也被称为实例。\n\
    \n回顾一下，我们的 `Staff` 类包含以下组件：\n\n### 字段\n- `private const int hourlyRate`\n- `private\
    \ string nameOfStaff`\n- `private int hWorked`\n\n### 属性\n- `public int HoursWorked`\n\
    \n### 方法\n- `public void PrintMessage()`\n- `public int CalculatePay()`\n- `public\
    \ int CalculatePay(int bonus, int allowance)`\n- `public override string ToString()`\n\
    \n### 构造函数\n- `public Staff(string name)`\n- `public Staff(string firstName, string\
    \ lastName)`\n\n我们将在 `Program` 类的 `Main()` 方法中实例化 `Staff` 对象。\n\n实例化对象的语法为：\n\
    `ClassName objectName = new ClassName(arguments);`\n\n在 `Program` 类的 `Main()`\
    \ 方法的大括号内添加以下几行。\n\n```csharp\nint pay;\nStaff staff1 = new Staff(\"Peter\");\n\
    staff1.HoursWorked = 160;\npay = staff1.CalculatePay(1000, 400);\nConsole.WriteLine(\"\
    Pay = {0}\", pay);\n```\n\n在这里，我们使用第一个构造函数（带有一个参数）来创建我们的 `staff1` 对象。\n\n一旦创建了对象，我们就可以对象名称后的点运算符（.）来访问\
    \ `Staff` 类中的任何公共字段、属性或方法。注意，我们需要在这里使用点运算符，因为我们正尝试从 `Program` 类访问 `Staff` 类的成员。当我们想要从另一个类访问字段、属性或方法时，点运算符是必要的。\n\
    \n如果你访问的是同一个类的成员，则不需要使用点运算符。一个例子是我们之前从 `CalculatePay()` 方法中调用 `PrintMessage()`\
    \ 方法。我们没有使用点运算符，因为这两个方法都属于同一个类。\n\n在创建 `staff1` 对象后，下一行显示了我们如何使用公共 `EmployeeType`\
    \ 属性来给 `hWorked` 字段赋值。\n\n```csharp\nstaff1.HoursWorked = 160;\n```\n\n如果我们尝试通过编写以下代码直接访问私有字段\
    \ `hWorked`：\n\n```csharp\nstaff1.hWorked = 160;\n```\n\n我们将得到错误，因为 `hWorked`\
    \ 是私有字段，因此只能在 `Staff` 类内部访问。\n\n要调用 `CalculatePay()` 方法，我们写道：\n\n```csharp\nstaff1.CalculatePay(1000,\
    \ 400);\n```\n\n在这个示例中，由于我们有数字 1000 和 400（注：此处原文似乎有逻辑重复，翻译已按语意保留）。\n\n"
- fmt: "\n`MyClass` contains one non static field `message`, one non static property\
    \ `Name` and one non static method `DisplayName()` (lines 4 to 9).\n\nIt also\
    \ contains one static field `greetings`, one static property `Age` and one static\
    \ method `DisplayAge()` (lines 12 to 17).\n\nTo access the non static members\
    \ of `MyClass` from another class, we need to instantiate an object as before:\n\
    \n```csharp\nMyClass classA = new MyClass();\nConsole.WriteLine(classA.message);\n\
    classA.Name = “Jamie”;\nclassA.DisplayName();\n```\n\nHowever, to access the static\
    \ members, we do not need to create any object. We simply use the class name to\
    \ access them as shown below.\n\n```csharp\nConsole.WriteLine(MyClass.greetings);\n\
    MyClass.Age = 39;\nMyClass.DisplayAge();\n```\n\nIf you run the code above, you\
    \ will get the following output\n\n```Hello World\nName = Jamie\nGood Morning\n\
    Age = 39\n```\n\nIn addition to having static methods, fields, properties and\
    \ constructors, we can also have static classes. A static class can only contain\
    \ static members. An example is shown below.\n\n```csharp\nstatic class MyStaticClass\n\
    {\n    public static int a = 0;\n    public static int B{get; set;}\n}\n```\n\n\
    Some of the pre-written classes in C# are declared as static classes. An example\
    \ is the `Console` class. We do not need to create a `Console` object when using\
    \ methods from the `Console` class. We simply write `Console.WriteLine(“Hello\
    \ World”);`.\n\n# Advanced Method Concepts\n\nNow that you are familiar with classes,\
    \ let us move on to some advanced concepts regarding the declaration and use of\
    \ methods in a class. These concepts are more complex and may require more than\
    \ one reading to fully understand them.\n\n## Using Arrays and Lists\n\nPreviously,\
    \ we learned how to use basic data types like `int` and `float` as parameters\
    \ to a method. In addition to using basic data types, we can also use arrays and\
    \ lists.\n\nTo use an array as a parameter, we add a square bracket `[]` after\
    \ the parameter’s data type in the method declaration. An example is shown below.\n\
    \n```csharp\npublic void PrintFirstElement(int[] a)\n{\n    Console.WriteLine(\"\
    The first element is {0}.\\n\", a[0]);\n}\n```\n\nTo call this method, we need\
    \ to declare an array and pass it in as an argument to the method:\n\n```csharp\n\
    int[] myArray = {1, 2, 3, 4, 5};\nPrintFirstElement(myArray);\n```\n\nThe next\
    \ example shows how we can use a list as a parameter.\n\n```csharp\npublic void\
    \ PrintFirstListElement(List<int> a)\n{\n    Console.WriteLine(“The first list\
    \ element is {0}.\\n”, a[0]);\n}\n```\n\nTo call the method, we need to declare\
    \ a list and pass it in as an argument to the method.\n\n```csharp\nList<int>\
    \ myList = new List<int> {1, 2, 3};\nPrintFirstListElement(myList);\n```\n\nIn\
    \ addition to using arrays or lists as parameters to a method, we can also return\
    \ an array or list from a method. To return an array from a method, we add square\
    \ bracket `[]` after the return type.\n\n```csharp\npublic int[] ReturnUserInput()\n\
    {\n    int[] a = new int[3];\n    for (int i = 0; i < a.Length; i++)\n    {\n\
    \        Console.Write(\"Enter an integer: \");\n        a[i] = Convert.ToInt32(Console.ReadLine());\n\
    \        Console.WriteLine(\"Integer added to array.\\n\");\n    }\n    return\
    \ a;\n}\n```\n\nTo use this method, we need to declare an array and assign the\
    \ method’s result to it.\n\n```csharp\nint[] myArray2 = ReturnUserInput();\n```\n\
    \nTo return a list from a method, we use the `List<>` keyword as the return type.\
    \ An example is\n\n```csharp\npublic List<int> ReturnUserInputList()\n{\n    List<int>\
    \ a = new List<int>();\n    int input;\n    for (int i = 0; i < 3; i++)\n    {\n\
    \        Console.Write(\"Enter an integer: \");\n        input = Convert.ToInt32(Console.ReadLine());\n\
    \        Console.WriteLine(\"Integer added to list.\\n\");\n        a.Add(input);\n\
    \    }\n    return a;\n}\n```\n\nTo use this method, we need to declare a list\
    \ and assign the method’s result to it.\n\n```csharp\nList<int> myList2 = ReturnUserInputList();\n\
    ```\n\n## Using params keyword\n\nNext, let’s explore the `params` keyword. The\
    \ `params` keyword is useful when we do not know the number of arguments a method\
    \ has. For instance, we may have a method that prints a series of names, but we\
    \ do not know how many names are in advance. In cases like this, we can use an\
    \ array as the parameter and add the `params` keyword in front of it. An example\
    \ is\n\n```csharp\npublic void PrintNames(params string[] names)\n{\n    for (int\
    \ i = 0; i < names.Length; i++)\n    {\n        Console.Write(names[i] + “ “);\n\
    \    }\n    Console.WriteLine();\n}\n```\n\nTo use this method, we can pass in\
    \ any number of strings.\n\nExample\n\n```csharp\nPrintNames(“Peter”);\nPrintNames(“Yvonne”,\
    \ “Jamie”);\nPrintNames(“Abigail”, “Carol”, “David”);\n```\n\nOutput\n\n```\n\
    Peter\nYvonne Jamie\nAbigail Carol David\n```\n\nNote that no additional parameters\
    \ are permitted after the `params` keyword in a method declaration, and only one\
    \ `params` keyword is permitted in a method declaration. Hence, the following\
    \ method declaration is fine\n\n```csharp\npublic void PrintNames2(int a, double\
    \ b, params int[] ages)\n```\n\nbut the following declarations are not\n\n```csharp\n\
    public void PrintNames3(int a, params string[] names, double b)\npublic void PrintNames4(params\
    \ string[] names, params int[] ages)\n```\n\n`PrintNames3` is not allowed because\
    \ `double b` comes after `params[] names`. `PrintNames4` is not allowed because\
    \ there are two `params` keywords.\n\n## Passing Value Type vs Reference Type\n\
    \nI hope you now have a good understanding of how classes and methods work. Before\
    \ we end this chapter, I’d like to revisit the concept of value data types and\
    \ reference data types. In Chapter 4, we learnt that there are two main categories\
    \ of data types in C# - value types and reference types. There is a difference\
    \ when you pass in a value type variable to a method vs a reference type variable.\n\
    \nWhen you pass in a value type variable, any change made to the value of that\
    \ variable is only valid within the method itself. Once the program exits the\
    \ method, the change is no longer valid.\n\nOn the other hand, if you pass in\
    \ a reference type variable, any change made to the variable is valid even after\
    \ the method ends.\n\nConsider the class below:\n\n```csharp\nclass MethodDemo\n\
    {\n    public void PassByValue(int a)\n    {\n        a = 10;\n        Console.WriteLine(\"\
    a inside method = {0}\", a);\n    }\n    public void PassByReference(int[] b)\n\
    \    {\n        b[0] = 5;\n        Console.WriteLine(\"b[0] inside method = {0}\"\
    , b[0]);\n    }\n}\n```\n\nWithin the class, we have two methods. The first method\
    \ accepts a value type variable and tries to change the value of that variable.\
    \ It then prints the value of the variable. The second method accepts an array\
    \ (reference type) and tries to change the value of the first element in the array.\
    \ It then prints the value of that element.\n\nIn our `Main()` program, suppose\
    \ we have the following lines of code:\n\n```csharp\nint a = 2;\nint[] b = {1,\
    \ 2, 3 };\nMethodDemo obj = new MethodDemo();\nConsole.WriteLine(\"a before =\
    \ {0}\", a);\nobj.PassByValue(a);\nConsole.WriteLine(\"a after = {0}\", a);\n\
    Console.WriteLine(\"\\n\\n\");\nConsole.WriteLine(\"b[0] before = {0}\", b[0]);\n\
    obj.PassByReference(b);\nConsole.WriteLine(\"b[0] after = {0}\", b[0]);\n```\n\
    \nIf you run the program, you will get\n\n```\na before = 2\na inside method =\
    \ 10\na after = 2\n\nb[0] before = 1\nb[0] inside method = 5\nb[0] after = 5\n\
    ```\n"
