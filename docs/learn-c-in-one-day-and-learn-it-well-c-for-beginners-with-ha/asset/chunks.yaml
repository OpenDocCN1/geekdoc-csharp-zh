    \ [`msdn.microsoft.com/en-us/library/system.systemexception.aspx`](https://msdn.microsoft.com/en-us/library/system.systemexception.aspx)。\n\
    \n# 第 7 章：面向对象编程基础\n\n到目前为止我们涵盖了相当的内容。在接下来的两个章节中，我们将介绍编程中的另一个重要概念——面向对象编程概念。\n\
    \n在本章中，我们将学习什么是面向对象编程，以及如何编写自己的类并从类创建对象。此外，我们还将讨论字段、属性、构造函数和方法的概念。\n\n## 什么是面向对象编程？\n\
    \n简单来说，面向对象编程是一种编程方法，它将编程问题分解为相互作用的对象。\n\n对象是从被称为“类”（classes）的模板创建的。你可以将类比为建筑的蓝图。而对象就是我们根据蓝图建造的实际“建筑”。\n\
    \n## 编写我们自己的类\n\n要编写自己的类，我们使用 `class` 关键字，后面跟着类名。\n\n例如，要创建一个 `Staff` 类，我们写道：\n\
    \n```sharp\nclass Staff {\n    //类的内容\n    //包括字段、属性和方法\n}\n```\n\n在命名类名时使用 PascalCasing（帕斯卡命名法）是一种常见做法。PascalCasing\
    \ 指将每个单词的首字母（包括第一个单词）大写的做法（例如 `ThisIsAClassName`）。这是我们将在书中遵循的规范。\n\n类的内容封装在类名后的大括号对内。类的内容包括构造函数、析构函数、常量、字段、方法、属性、索引器、操作符、事件、委托、接口、结构体和其他类。\n\
    \n我们将在本章中涵盖类的一些常用元素，即字段、方法、属性和构造函数。\n\n为了理解这些是什么，让我们从零开始构建一个类。\n\n首先，在 Visual\
    \ Studio Community 中创建一个新的控制台应用程序项目，并命名为“ClassDemo”。\n\n学习自动为你生成的代码。注意在 `ClassDemo`\
    \ 命名空间内部，VSC 已经为你创建了一个名为 `Program` 的类？在 `Program` 类内部，我们有 `Main()` 方法。\n\n默认情况下，`Main()`\
    \ 方法（所有 C# 应用程序的起点）被放在 VSC 创建的 `Program` 类中。如果我们需要，可以将 `Program` 类的名称改为其他名称，但\
    \ `Main()` 方法必须命名为 `Main()`。所有 C# 程序都必须存在 `Main()` 方法。\n\n在本章中，我们将向 `ClassDemo`\
    \ 命名空间添加第二个类。我们将这个新类命名为 `Staff`，并向类添加字段、属性和方法。本章的完整可以在 [`www.learncodingfast.com/csharp`](http://www.learncodingfast.com/csharp)\
    \ 下载。\n\n让我们先声明该类。在自动生成的代码中 `class Program` 行之前添加以下代码：\n\n```sharp\nclass Staff\n\
    {\n}\n```\n\n现在我们的项目中有两个类：`Staff` 和 `Program`。\n\n### 字段 (Fields)\n\n在 `Staff`\
    \ 类内部，添加以下行：\n\n```sharp\nprivate string nameOfStaff;\nprivate const int hourlyRate\
    \ = 30;\nprivate int hWorked;\n```\n\n在这里，我们声明了一个 `string` 变量 (`nameOfStaff`)\
    \ 和两个 `int` 变量 (`hourlyRate` 和 `hWorked`)。这些变量被称为类的字段。字段就是定义在类内部的变量。与其他变量一样，它们用于存储数据。\n\
    \n注意每个声明前面都有 `private` 单词？这被称为访问修饰符。访问修饰符就像守门员，它们控制谁可以访问该字段。字段可以是 `private`（私有的）、`public`（公共的）、`protected`（保护的）或\
    \ `internal`（内部的）。在我们的情况下，我们将这三个字段都声明为 `private`。这意味着它们只能在 `Staff` 类内部访问。\n\n\
    我们不希望字段对类开放有两个原因。\n\n第一个原因是其他类不需要了解这些字段。在我们的情况下，`hourlyRate` 字段仅在 `Staff` 类内部需要。我们在\
    \ `Staff` 类内部有一个方法使用 `hourlyRate` 来计算员工的月薪。其他类完全不使用 `hourlyRate` 字段。因此，将 `hourlyRate`\
    \ 声明为 `private` 以向其他类隐藏此字段是合适的。\n\n被称为封装。封装允许对象向不需要它的类隐藏数据和行为。这使得我们在以后需要时更容易更容易修改代码。我们可以安全地在\
    \ `Staff` 类内部更改 `hourlyRate` 的值，而不影响其他类。\n\n将字段声明为 `private` 的第二个原因是我们不希望其他类随意修改它们。这有助于防止字段被损坏。\n\
    \n我们将在下一章详细讨论访问修饰符。\n\n除了 `private` 关键字外，我们在声明 `hourlyRate` 字段时还添加了 `const` 关键字：\n\
    \n`private const int hourlyRate = 30;`\n\n### 属性 (Properties)\n\n接下来，让我们看看属性。\n\
    \n属性通常用于在其他类需要字段的情况下，为私有字段提供访问。这听起来像是一个矛盾。在此之前，我们提到使用私有字段是为了让其他类无法访问它们。如果是这样，我们为什么要通过属性允许访问它们呢？\n\
    \n"
- fmt: "\nOne of the main reasons is that using properties gives us greater control\
    \ over what rights other classes have when assessing these private fields. We’ll\
    \ see how to do that later.\n\nFor now, let us first learn how to declare a property.\n\
    \nAdd the following lines of code to our `Staff` class, just after the line `private\
    \ int hWorked;`.\n\n```csharp\npublic int HoursWorked\n{\n    get\n    {\n   \
    \     return hWorked;\n    }\n    set\n    {\n        if (value > 0)\n       \
    \     hWorked = value;\n        else\n            hWorked = 0;\n    }\n}\n```\n\
    \nWe declared our property as\n\n```csharp\npublic int HoursWorked\n{\n}\n```\n\
    \nThe access modifier is `public` as we want other classes to have access to this\
    \ property.\n\nThe data type is `int` because this property is used to provide\
    \ access to the private `int` field `hWorked`. `hWorked` is known as the backing\
    \ field of the property.\n\nThe name of the property is `HoursWorked`. We normally\
    \ use PascalCasing for property names.\n\nA property contains two special methods\
    \ known as accessors. The first accessor is a getter and the second is a setter.\n\
    \nThe basic getter simply returns the value of the private field. Hence, we write\n\
    \n```csharp\nget\n{\n    return hWorked;\n}\n```\n\nwhere `return` is a keyword\
    \ and `hWorked` is the name of the backing field.\n\nThe setter sets the value\
    \ of the private field. We write\n\n```csharp\nset\n{\n    if (value > 0)\n  \
    \      hWorked = value;\n    else\n        hWorked = 0;\n}\n```\n\n`value` is\
    \ a keyword when it used inside a setter. It refers to the value that is on the\
    \ right side of the assignment statement when users use the property to set the\
    \ value of the private field. We’ll learn how to do that later.\n\nInside the\
    \ setter, we did a simple check using an `if` statement. We checked if `value`\
    \ is more than zero. If it is, we assign it to `hWorked`. Else, we set `hWorked`\
    \ to zero. This setter demonstrates how we can use properties to control what\
    \ values can be assigned to our private field.\n\nBy default, getter and setter\
    \ have the same access level as the property itself (`public` in this case). Hence,\
    \ we do not need to specify them. However, if you do not want the setter to have\
    \ the same access level as the property, you can declare the setter as `private`\
    \ so that other classes cannot modify your private field:\n\n```csharp\nprivate\
    \ set\n{\n}\n```\n\nThe property is then a read-only property outside the `Staff`\
    \ class. Its value can only be set within the `Staff` class itself.\n\n### Auto-implemented\
    \ Properties\n\nNote that in cases where no additional logic is required in the\
    \ getter and setter, C# provides us with a shorthand to declare the property.\
    \ This is known as an auto-implemented property.\n\nTo declare an auto-implemented\
    \ property, we write\n\n```csharp\npublic int HoursWorked { get; set; }\n```\n\
    \nThis is equivalent to\n\n```csharp\nprivate int hWorked;\npublic int HoursWorked\n\
    {\n    get\n    {\n        return hWorked;\n    }\n    set\n    {\n        hWorked\
    \ = value;\n    }\n}\n```\n\nWhen you use this shorthand, you do not have to declare\
    \ a private field. The compiler will create an anonymous private backing field\
    \ for you automatically.\n\nIf you want to make the property read-only, you can\
    \ set the setter to `private` like this:\n\n```csharp\npublic int HoursWorked\
    \ { get; private set; }\n```\n\n### Methods\n\nNext, let us look at methods.\n\
    \nA method is a code block that performs a certain task.\n\nLet’s add a simple\
    \ method to our `Staff` class.\n\n```csharp\npublic void PrintMessage()\n{\n \
    \   Console.WriteLine(“Calculating Pay…”);\n}\n```\n\nThis method is declared\
    \ as\n\n```csharp\npublic void PrintMessage()\n{\n}\n```\n\nThe method declaration\
    \ first states the accessibility level of the method. Here we declared the method\
    \ as `public` so that the method is accessible everywhere in the program (not\
    \ just within the `Staff` class).\n\nNext, we state the return type of the method.\
    \ A method may return a certain result after performing its task. If the method\
    \ does not return any result, we use the `void` keyword like in our example.\n\
    \nFinally, we state the name of the method (`PrintMessage` in our example).\n\n\
    The parenthesis `()` after the method name is where we include the parameters\
    \ of the method. Parameters are names given to data that we pass in to the method\
    \ in order for it to perform its task. If the method requires no data (like in\
    \ our example), we just add a pair of empty parenthesis after the method name.\n\
    \nAfter we declare the method, we define what it does inside the pair of curly\
    \ braces that follow. This is known as implementing the method. In our example,\
    \ the `PrintMessage()` method simply prints the line “Calculating Pay…”.\n\nThat’s\
    \ all there is to the `PrintMessage()` method.\n\nNext, let us move on to a more\
    \ complex method. This second method calculates the pay of each employee and returns\
    \ the result of the calculation. Add the following lines of code to `Staff`.\n\
    \n```csharp\npublic int CalculatePay()\n{\n    PrintMessage();\n    int staffPay;\n\
    \    staffPay = hWorked * hourlyRate ;\n    if (hWorked > 0)\n        return staffPay;\n\
    \    else\n        return 0;\n}\n```\n\nThis method is declared as\n\n```csharp\n\
    public int CalculatePay()\n{\n}\n```\n\nThe `int` keyword indicates that this\
    \ method returns a value of `int`.\n\nInside the curly braces, we have the `PrintMessage();`\
    \ This is known as calling the `PrintMessage()` method. In our example, the `PrintMessage()`\
    \ method first prints the line “Calculating Pay…” before executing the rest of\
    \ the method.\n\nNext, we declare a local variable `staffPay` and assign the product\
    \ of `hWorked` and `hourlyRate` to it. These are known as local variables and\
    \ only exist within the method.\n\nA method can access all the fields and properties\
    \ that are declared inside the class. After assigning the `staffPay` variable,\
    \ we use an `if` statement to determine what result the method should return.\n\
    \nA method usually has at least one return statement. `return` is a keyword that\
    \ is used to return an answer from the method. There can be more than one return\
    \ statement in a method. However, once the method executes a return statement,\
    \ the method will exit.\n\nIn our example, if `hWorked` is greater than zero,\
    \ the program will execute the statement\n\nreturn staffPay;`\n\nand exit the\
    \ method. This return value can then be assigned to a variable. For instance,\
    \ if `hWorked` is 10 and `hourlyRate` is 20, we can use the statement\n\n`int\
    \ pay = CalculatePay();`\n\nto assign the result of `CalculatePay()` to the variable\
    \ `pay`. The value of `pay` will then be 200.\n\nOn the other hand, if `hWorked`\
    \ is less than or equal to zero, the program will execute the statement\n\nreturn\
    \ 0;\n\nand exit the method. The value of `pay` will be 0.\n\n### Overloading\n\
    \nIn C# (and most other languages), you can create two methods of the same name\
    \ as long as they have different signatures. This is known as overloading. The\
    \ signature of a method refers to the name of the method and the parameters that\
    \ it has.\n\nAdd the following method below the previous `CalculatePay()` method.\n\
    \n```csharp\npublic int CalculatePay(int bonus, int allowance)\n{\n    PrintMessage();\n\
    \    if (hWorked > 0)\n        return hWorked * hourlyRate + bonus + allowance;\n\
    \    else\n        return 0;\n}\n```\n\nThe signature of the first method is `CalculatePay()`\
    \ while that of the second method is `CalculatePay(int bonus, int allowance)`.\n\
    \nThis second method has two parameters - `bonus` and `allowance`. It calculates\
    \ the pay of the employees by adding the values of these two parameters to the\
    \ product of `hWorked` and `hourlyRate`. In this example, we did not use a local\
    \ variable to store the result of `hWorked * hourlyRate + bonus + allowance`.\
    \ We simply return the result of the computation directly. This is perfectly fine.\
    \ We’ll learn how to use this method later.\n\n### The ToString() method\n\nFinally,\
    \ before we move on to the next section, we need to write one more method – the\
    \ `ToString()` method.\n"
  raw: 'One of the main reasons is that using properties gives us greater control
    over what rights other classes have when assessing these private fields. We’ll
    see how to do that later.


    For now, let us first learn how to declare a property.


    Add the following lines of code to our `Staff` class, just after the line `private
    int hWorked;`.


    `public int HoursWorked`


    `{`


    `get`


    `{`


    > `return hWorked;`


    `}`


    `set`


    `{`


    `if (value > 0)`


    `hWorked = value;`


    `else`


    `hWorked = 0;`


    `}`


    `}`


    We declared our property as


    `public int HoursWorked`


    `{`


    `}`


    The access modifier is `public` as we want other classes to have access to this
    property.


    The data type is `int` because this property is used to provide access to the
    private `int` field `hWorked`. `hWorked` is known as the backing field of the
    property.


    The name of the property is `HoursWorked`. We normally use PascalCasing for property
    names.


    A property contains two special methods known as accessors. The first accessor
    is a getter and the second is a setter.


    The basic getter simply returns the value of the private field. Hence, we write


    `get`


    `{`


    `return` `hWorked``;`


    `}`


    where `return` is a keyword and `hWorked` is the name of the backing field.


    The setter sets the value of the private field. We write


    `set`


    `{`


    `if (value > 0)`


    `hWorked = value;`


    `else`


    `hWorked = 0;`


    `}`


    `value` is a keyword when it used inside a setter. It refers to the value that
    is on the right side of the assignment statement when users use the property to
    set the value of the private field. We’ll learn how to do that later.


    Inside the setter, we did a simple check using an `if` statement. We checked if
    `value` is more than zero. If it is, we assign it to `hWorked`. Else, we set `hWorked`
    to zero. This setter demonstrates how we can use properties to control what values
    can be assigned to our private field.


    By default, getter and setter have the same access level as the property itself
    (`public` in this case). Hence, we do not need to specify them. However, if you
    do not want the setter to have the same access level as the property, you can
    declare the setter as `private` so that other classes cannot modify your private
    field:


    `private set`


    `{`


    `}`


    The property is then a read-only property outside the `Staff` class. Its value
    can only be set within the `Staff` class itself.


    Auto-implemented Properties


    Note that in cases where no additional logic is required in the getter and setter,
    C# provides us with a shorthand to declare the property. This is known as an auto-implemented
    property.


    To declare an auto-implemented property, we write


    `public int HoursWorked { get; set; }`


    This is equivalent to


    `private int hWorked;`


    `public int HoursWorked`


    `{`


    `get`


    `{`


    > `return hWorked;`


    `}`


    `set`


    `{`


    > `hWorked = value;`


    `}`


    `}`


    When you use this shorthand, you do not have to declare a private field. The compiler
    will create an anonymous private backing field for you automatically.


    If you want to make the property read-only, you can set the setter to `private`
    like this:


    `public int HoursWorked { get; private set; }`


    Methods


    Next, let us look at methods.


    A method is a code block that performs a certain task.


    Let’s add a simple method to our `Staff` class.


    `public void PrintMessage()`


    `{`


    `Console.WriteLine(“Calculating Pay…”);`


    `}`


    This method is declared as


    `public void PrintMessage()`


    `{`


    `}`


    The method declaration first states the accessibility level of the method. Here
    we declared the method as `public` so that the method is accessible everywhere
    in the program (not just within the `Staff` class).


    Next, we state the return type of the method. A method may return a certain result
    after performing its task. If the method does not return any result, we use the
    `void` keyword like in our example.


    Finally, we state the name of the method (`PrintMessage` in our example).


    The parenthesis () after the method name is where we include the parameters of
    the method. Parameters are names given to data that we pass in to the method in
    order for it to perform its task. If the method requires no data (like in our
    example), we just add a pair of empty parenthesis after the method name.


    After we declare the method, we define what it does inside the pair of curly braces
    that follow. This is known as implementing the method. In our example, the `PrintMessage()`
    method simply prints the line “Calculating Pay…”.


    That’s all there is to the `PrintMessage()` method.


    Next, let us move on to a more complex method. This second method calculates the
    pay of each employee and returns the result of the calculation. Add the following
    lines of code to `Staff`.


    `public int CalculatePay()`


    `{`


    `PrintMessage();`


    `int staffPay;`


    `staffPay = hWorked * hourlyRate ;`


    `if (``hWorked` `> 0)`


    > `return` `staffPay``;`


    `else`


    `return 0;`


    `}`


    This method is declared as


    `public int CalculatePay()`


    `{`


    `}`


    The `int` keyword indicates that this method returns a value that is of `int`
    type.


    Inside the curly braces, we have the statement


    `PrintMessage();`


    This is known as calling the `PrintMessage()` method. When the program reaches
    this statement, it will execute the `PrintMessage()` method first and print the
    line “Calculating Pay…” before executing the rest of the `CalculatePay()` method.
    This example demonstrates how you can call one method inside another method.


    Next, we declare a local variable called `staffPay` and assign the product of
    the private fields `hourlyRate` and `hWorked` to it.


    A method can access all the fields and properties that are declared inside the
    class. In addition, it can declare its own variables. These are known as local
    variables and only exist within the method. An example is the `staffPay` variable
    in our example.


    After assigning the `staffPay` variable, we use an `if` statement to determine
    what result the method should return.


    A method usually has at least one return statement. `return` is a keyword that
    is used to return an answer from the method. There can be more than one return
    statement in a method. However, once the method executes a return statement, the
    method will exit.


    In our example, if `hWorked` is greater than zero, the program will execute the
    statement


    `return staffPay;`


    and exit the method. This return value can then be assigned to a variable. For
    instance, if `hWorked` is 10 and `hourlyRate` is 20, we can use the statement


    `int pay = CalculatePay();`


    to assign the result of `CalculatePay()` to the variable `pay`. The value of `pay`
    will then be 200.


    On the other hand, if `hWorked` is less than or equal to zero, the program will
    execute the statement


    `return 0;`


    and exit the method. The value of `pay` will be 0.


    Overloading


    In C# (and most other languages), you can create two methods of the same name
    as long as they have different signatures. This is known as overloading. The signature
    of a method refers to the name of the method and the parameters that it has.


    Add the following method below the previous `CalculatePay()` method.


    `public int CalculatePay(int bonus, int allowance)`


    `{`


    `PrintMessage();`


    `if (``hWorked` `> 0)`


    > `return` `hWorked` `* hourlyRate + bonus + allowance;`


    `else`


    > `return 0;`


    `}`


    The signature of the first method is `CalculatePay()` while that of the second
    method is `CalculatePay(int bonus, int allowance)`.


    This second method has two parameters - `bonus` and `allowance`. It calculates
    the pay of the employees by adding the values of these two parameters to the product
    of `hWorked` and `hourlyRate`. In this example, we did not use a local variable
    to store the result of `hWorked * hourlyRate + bonus + allowance`. We simply return
    the result of the computation directly. This is perfectly fine. We’ll learn how
    to use this method later.


    The ToString() method


    Finally, before we move on to the next section, we need to write one more method
    – the `ToString()` method.'
