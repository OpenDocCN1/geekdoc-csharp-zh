    \ Your First C# Program\n\nTo write our first program, let’s create a folder on\
    \ our desktop and name it `C# Projects`. We will save all `C#` projects to this\
    \ folder.\n\nNext, launch `VSC` and select `File` > `New` > `Project…` (You may\
