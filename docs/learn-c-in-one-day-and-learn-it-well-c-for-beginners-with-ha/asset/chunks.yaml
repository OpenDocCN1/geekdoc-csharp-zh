    \ classes. However, they cannot have static members. In addition, abstract classes\
    \ can have a special type of method known as abstract methods. Abstract methods\
    \ are methods that have no body and MUST be implemented in the derived class.\
    \ They can only exist in abstract classes. In a way, an abstract method is like\
    \ a contract. If you want to ensure that any class that inherits your class implements\
    \ a certain method, you can declare the class as an abstract class and the method\
    \ as an abstract method.\n\nTo declare an abstract class, simply add the `abstract`\
    \ keyword before the keyword `class` like this:\n\n```csharp\nabstract class MyClass\n\
    {\n}\n```\n\nTo declare an abstract method inside an abstract class, add the `abstract`\
    \ keyword before the return type, like this:\n\n```csharp\npublic abstract void\
    \ MyAbstractMethod();\n```\n\nAs abstract methods have no body, we end the declaration\
    \ with a semi-colon (;).\n\nTo implement an abstract method in the derived class,\
    \ we use the `override` keyword, like this:\n\n```csharp\npublic override void\
    \ MyAbstractMethod()\n{\n}\n```\n\nThe code below shows an example of an abstract\
    \ class.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ AbstractClassDemo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            //MyAbstractClass abClass = new MyAbstractClass();\n\
    \            ClassA a = new ClassA();\n            a.PrintMessage();\n       \
    \     a.PrintMessageAbstract();\n            Console.Read();\n        }\n    }\n\
    \n    abstract class MyAbstractClass\n    {\n        private string message =\
    \ \"Hello C#\";\n        public void PrintMessage()\n        {\n            Console.WriteLine(message);\n\
    \        }\n        public abstract void PrintMessageAbstract();\n    }\n\n  \
    \  class ClassA : MyAbstractClass\n    {\n        public override void PrintMessageAbstract()\n\
    \        {\n            Console.WriteLine(\"C# is fun!\");\n        }\n    }\n\
    }\n```\n\nThe abstract class is from Line 21 to 29. It contains a private field\
    \ `message` and a public method `PrintMessage()`. It also contains an abstract\
    \ method `PrintMessageAbstract()` on line 28. Lines 31 to 37 show the derived\
    \ class which implements the abstract method (lines 33 to 36).\n\nIf you run the\
    \ program above, you will get:\n\n```\nHello C#\nC# is fun!\n```\n\nNotice that\
    \ Line 13 is commented out with the `//` sign? If you remove the two slashes,\
    \ you will get an error as an abstract class cannot be instantiated.\n\n### Interfaces\n\
    \nNext, let’s look at interfaces. Interfaces are much like abstract classes in\
    \ that they cannot be instantiated and must be inherited. However, interfaces\
    \ are more conceptual than abstract classes. They can only contain methods with\
    \ no bodies. In addition, they cannot contain fields but can contain properties.\
    \ Interfaces also cannot have static members. When a child class inherits an interface,\
    \ we say that it implements the interface.\n\nOne of the key differences between\
    \ an abstract class and an interface is that a class can only inherit one abstract\
    \ class but can implement multiple interfaces. We won’t be showing an example\
    \ of multiple interfaces implementation as that is an advanced topic beyond the\
    \ scope of this book.\n\nThe code below shows an example of how a class can implement\
    \ one interface. It is common to start the name of an interface with the letter\
    \ `I`. All properties and methods in an interface are public, so there is no need\
    \ to add any access modifiers to them.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ InterfaceDemo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            ClassA a = new ClassA();\n            a.MyNumber\
    \ = 5;\n            a.InterfaceMethod();\n            Console.Read();\n      \
    \  }\n    }\n\n    interface IShape\n    {\n        int MyNumber\n        {\n\
    \            get;\n            set;\n        }\n        void InterfaceMethod();\n\
    \    }\n\n    class ClassA : IShape\n    {\n        private int myNumber;\n  \
    \      public int MyNumber\n        {\n            get\n            {\n      \
    \          return myNumber;\n            }\n            set\n            {\n \
    \               if (value > 0)\n                {\n                    myNumber\
    \ = value;\n                }\n                else\n                {\n     \
    \               myNumber = 0;\n                }\n            }\n        }\n\n\
    \        public void InterfaceMethod()\n        {\n            Console.WriteLine(\"\
    The number is \" + MyNumber);\n        }\n    }\n}\n```\n\nThe interface is from\
    \ lines 20 to 28. `ClassA` implements `IShape` on line 30. The property `MyNumber`\
    \ is implemented on lines 33 to 47, and the `InterfaceMethod` is implemented on\
    \ lines 49 to 52.\n"
