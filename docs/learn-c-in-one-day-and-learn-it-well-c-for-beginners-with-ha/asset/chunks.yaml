    \n就这样！你已经成功编写了你的第一个程序。拍拍鼓励自己吧。\n\n如果你现在导航到你的“C# Projects”文件夹，你会发现一个名为“HelloWorld”的文件夹。在文件夹中，你会找到另一个“HelloWorld”文件夹和一个\
    \ `HelloWorld.sln` 文件。这个 `.sln` 文件是解决方案文件。每当你需要重新打开项目时，都要打开这个文件。如果打开解决方案文件时文本编辑器没有显示你的代码，只需双击右侧“解决方案管理器”（Solution\
    \ Explorer）（参考之前的图片）中的 `Program.cs` 文件即可打开它。\n\n你的代码的可执行文件（`.exe`）可以在 `HelloWorld\
    \ > HelloWorld > bin > Debug` 文件夹中找到。\n\n# C 程序的基本结构\n\n现在，让我们快速回顾一下你刚刚编写的基础程序。\n\
    \n## 指令\n\n从第 1 行到第 5 行，我们有几个以单词 `using` 开头的语句。这些语句被称为指令。它们告诉编译器我们的程序使用了某个命名空间。\n\
    \n例如，第一行\n\n```cs\nusing System;\n```\n\n告诉编译器我们的程序使用了 `System` 命名空间。\n\n## 命名空间\n\
    \n命名空间简单来说相关代码元素的分组。这些元素包括类、接口、枚举和结构体等（我们将在后续章节中介绍这些每个元素）。\n\nC# 带有大量的预写代码，它们被组织在不同的命名空间中。`System`\
    \ 命名空间允许让我们与用户交互的方法代码。我们在程序使用了其中两个方法——`WriteLine()` 和 `Read()` 方法。其他命名空间在我们的程序中不需要。但是，由于这些命名空间包含在默认模板中，我们将它们留在代码中。\n\
    \n除了 Microsoft 提供的预写命名空间外，我们也可以声明自己的命名空间。\n\n声明命名空间的一个优势是可以防止命名冲突。只要属于不同的命名空间，两个或多个代码元素可以同名。例如，下面的代码定义了两个命名空间，它们都包含一个名为\
    \ `MyClass` 的类。这在 C# 中是被允许的，因为这两个类属于不同的命名空间（`First` 和 `Second`）。\n\n```cs\nnamespace\
    \ First\n{\n    class MyClass\n    {\n    }\n}\n\nnamespace Second\n{\n    class\
    \ MyClass\n    {\n    }\n}\n```\n\n在我们的示例中，我们声明了一个命名空间——`HelloWorld`。\n\n`HelloWorld`\
    \ 命名空间从第 7 行开始，第 8 行有一个左大括号。它在第 20 行用右大括号结束。大括号在 C# 中被广泛用于表示代码元素的开始和结束。C# 中的所有左大括号必须用相应的右大括号关闭。\n\
    \n在 `HelloWorld` 命名空间内，我们有 `Program` 类，它从第 12 行开始到第 19 行结束。在 `Program` 类中，我们有\
    \ `Main()` 方法，它从第 14 行开始到第 18 行结束。\n\n# Main() 方法\n\n`Main()` 方法是所有 C# 控制台应用程序的入口点。（注：原文此处存在大量重复句子，翻译已保留核心含义说明）。\n\
    \n在我们的示例中，我们声明了一个命名空间——`HelloWorld`。\n\n"
