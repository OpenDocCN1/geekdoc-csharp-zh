    \n```csharp\n1 string path = \"c:\\\\myFile.txt\";\n2 using (StreamReader sr =\
    \ new StreamReader(path))\n3 {\n4 while (sr.EndOfStream != true)\n5 {\n6 Console.WriteLine(sr.ReadLine());\n\
    7 }\n9 sr.Close();\n10 }\n```\n\n在第 1 行，我们首先声明了一个 `string` 变量 `path`并将文件路径赋值给该变量。\n\
    \n`string path = \"c:\\\\myFile.txt\";`\n\n注意，在编写路径时我们必须使用双斜杠 `\\\\`。这是因为如果我们只使用单斜杠，编译器会认为单斜杠是转义序列的开头，并将\
    \ `\\m` 解释为转义序列。这将导致错误。\n\n在第 2 行，我们创建了一个 `StreamReader` 实例。`StreamReader` 构造函数接受一个参数——要读取的文件路径。\n\
    \n```csharp\nStreamReader sr = new StreamReader(path)\n```\n\n注意我们是否在第 2 行 `using`\
    \ 关键字后面的括号对中创建了这个 `StreamReader` 实例？\n\n这里的 `using` 关键字与我们在编写指令（directive）时使用的那个不同。\n\
    \n这里的 `using` 关键字确保 `Dispose()` 方法始终能被调用。`Dispose()` 方法是 `System` 命名空间中的一个预写方法，一旦不再需要文件和流等未托管资源，它就会关闭或释放这些资源。当我们使用\
    \ `using` 关键字时，我们确保即使发生异常，`Dispose()` 方法也会被调用，并防止我们的代码到达第 9 行（那里我们手动关闭文件）。在处理文件时，始终使用\
    \ `using` 关键字是一个良好的习惯。读取和关闭文件的代码包含在 `using` 语句后的大括号 `{ }` 中。\n\n从第 4 行到第 7 行，我们使用\
    \ `while` 循环逐行读取文本文件。\n\n```csharp\nwhile (sr.EndOfStream != true)\n{\n    Console.WriteLine(sr.ReadLine());\n\
    }\n```\n\n`EndOfStream` 是 `StreamReader` 类的一个属性，当到达文件末尾时它返回 `true`。只要没有到达文件末尾，`while`\
    \ 循环就会继续。\n\n```csharp\nConsole.WriteLine(sr.ReadLine());\n```\n\n### 选项 1：try…catch\n\
    \n第一个选项如下所示使用 `try…catch`：\n\n```csharp\n1 try\n2 {\n3 using (StreamReader sr\
    \ = new StreamReader(path))\n4 {\n5 while (sr.EndOfStream != true)\n6 {\n7 Console.WriteLine(sr.ReadLine());\n\
    8 }\n9 sr.Close();\n10 }\n11 catch (FileNotFoundException e)\n12 {\n13 Console.WriteLine(e.Message);\n\
    14 }\n```\n\n从第 1 行到第 11 行，我们在 `try` 块中尝试打开、读取并关闭文件。从第 11 行到第 14 行，如果文件未找到，我们使用\
    \ `catch` 块捕获 `FileNotFoundException` 异常。在 `catch` 块中，我们告知用户文件缺失。\n\n### 选项 2：File.Exists()\n\
    \n处理“找不到文件”场景的第二种方法是使用 `File` 类中的 `Exists()` 方法。正如名称所示，`Exists()` 方法检查文件是否存在。\n\
    \n使用 `Exists()` 方法，我们在使用 `StreamReader` 打开并读取文件之前，使用 `if` 语句检查文件是否存在。\n\n```csharp\n\
    if (File.Exists(path))\n{\n    using (StreamReader sr = new StreamReader(path))\n\
    \    {\n        while (sr.EndOfStream != true)\n        {\n            Console.WriteLine(sr.ReadLine());\n\
    \        }\n        sr.Close();\n    }\n}\nelse\n{\n    // 执行其他操作\n}\n```\n\n\
    在 `else` 块中，我们可以编写代码在文件未找到时创建它。\n\n## 写入文本文件\n\n接下来，让我们看看如何写入文本文件。\n\n写入文本文件，我们使用\
    \ `StreamWriter` 类。\n\n如果你想将数据追加到现有文件中，可以这样创建 `StreamWriter` 实例：\n\n```csharp\n\
    StreamWriter sw = new StreamWriter(path, true);\n```\n\n其中 `path` 是文件路径，`true`\
    \ 表示我们要追加数据。\n\n如果你想覆盖文件中的任何现有数据，可以这样创建 `StreamWriter` 实例：\n\n```csharp\nStreamWriter\
    \ sw = new StreamWriter(path);\n```\n\n当我们创建 `StreamWriter` 实例时，构造函数会在给定路径查找文件。如果未找到文件，它将创建该文件。\n"
- fmt: "\nAfter we instantiate our `StreamWriter` object, we can start writing to\
    \ our file using the `WriteLine()` method as shown below:\n\n```\nsw.WriteLine(“It\
    \ is easy to write to a file.”);\n```\n\nAfter we finish writing to the file,\
    \ we have to close the file by writing\n\n```c\nsw.Close();\n```\n\nNote that\
    \ when you write to a text file, it is also good practice to enclose your code\
    \ in a `using` statement. The code below shows a complete example of how all these\
    \ come together.\n\n```c\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.IO;\n\
    \nnamespace FileDemo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            //declaring the path to the file\n           \
    \ string path = \"myfile.txt\";\n            //Writing to the file\n         \
    \   using(StreamWriter sw=new StreamWriter(path, true))\n            {\n     \
    \           sw.WriteLine(\"ABC\");\n                sw.WriteLine(\"DEF\");\n \
    \               sw.Close();\n            }\n            //Reading from the file\n\
    \            if (File.Exists(path))\n            {\n                using(StreamReader\
    \ sr=new StreamReader(path))\n                {\n                    while (!sr.EndOfStream)\n\
    \                    {\n                        Console.WriteLine(sr.ReadLine());\n\
    \                    }\n                    sr.Close();\n                }\n \
    \           }\n            Console.Read();\n        }\n    }\n}\n```\n\nIn this\
    \ example, we choose to append data to our file when we write to it. When you\
    \ run this program for the first time, you will get\n\n`ABC`\n`EFG`\n\nas the\
    \ file output and screen display. If you run it for the second time, you will\
    \ get\n\n`ABC`\n`EFG`\n`ABC`\n`EFG`\n\nAs the full path of “myfile.txt” is not\
    \ given in this example, the text file will be created in the same folder as the\
    \ `.exe` file, which is in the `FileDemo` > `FileDemo` > `Debug` > `Bin` folder.\n\
    \n# Project – A Simple Payroll Software\n\n## Congratulations!\n\nWe have now\
    \ completed the core concepts in C#. In this final chapter, we are going to get\
    \ our feet wet by coding a complete console application that generates the salary\
    \ slips of a small company.\n\nReady?\n\n## Overview\n\nFirst, let’s create a\
    \ new console application and name it `CSProject`.\n\nThis application consists\
    \ of six classes as shown below.\n\n* `Staff`\n* `Manager : Staff`\n* `Admin :\
    \ Staff`\n* `FileReader`\n* `PaySlip`\n* `Program`\n\nThe `Staff` class contains\
    \ information about each staff in the company. It also contains a virtual method\
    \ called `CalculatePay()` that calculates the pay of each staff.\n\nThe `Manager`\
    \ and `Admin` classes inherit the `Staff` class and override the `CalculatePay()`\
    \ method.\n\nThe `FileReader` class contains a simple method that reads from a\
    \ `.txt` file and creates a list of `Staff` objects based on the contents in the\
    \ `.txt` file.\n\nThe `PaySlip` class generates the pay slip of each employee\
    \ in the company. In addition, it also generates a summary of the details of staff\
    \ who worked less than 10 hours in a month.\n\nFinally, the `Program` class contains\
    \ the `Main()` method which acts as the main entry point of our application.\n\
    \n## The Staff Class\n\nFirst, let’s start with the `Staff` class. The `Staff`\
    \ class contains basic information about an employee and provides a method for\
    \ calculating basic pay. It serves as a parent class from which two other classes\
    \ will be derived.\n\n### Fields\n\nThis class has one `private` `float` field\
    \ called `hourlyRate` and one `private int` field called `hWorked`. Try declaring\
    \ these fields yourself.\n\n### Properties\n\nNext, declare three `public` auto-implemented\
    \ properties for the class. The properties are `TotalPay`, `BasicPay` and `NameOfStaff`.\n\
    \n`TotalPay` is a `float` property and has a `protected` setter. `BasicPay` is\
    \ a `float` property and has a `private` setter. `NameOfStaff` is a `string` property\
    \ and has a `private` setter. The getters of all three properties are `public`.\
    \ Hence, you do not need to declare the access modifiers of these getters as they\
    \ have the same access level as the properties.\n\nIn addition to these three\
    \ auto-implemented methods, the `Staff` class also has a `public` property called\
    \ `HoursWorked`. The backing field for this property is the `hWorked` field.\n\
    \nThis property has a getter that simply returns the value of `hWorked`. The setter\
    \ checks if the value set for `HoursWorked` is greater than 0. If it is, it assigns\
    \ `value` to `hWorked`. If it is not, it assigns 0 to `hWorked`. Try declaring\
    \ this property yourself. You can refer to Chapter 7 for help.\n\n### Constructor\n\
    \nThe `Staff` class has a `public` constructor with two parameters, `name` (`string`)\
    \ and `rate` (`float`). Inside the constructor, we assign the two parameters to\
    \ the property `NameOfStaff` and the field `hourlyRate` respectively. Try coding\
    \ this constructor yourself.\n\n### Method\n\nNow, let’s write the methods for\
    \ the class.\n\nFirst, we’ll code a virtual method called `CalculatePay()`.\n\n\
    `CalculatePay()` is `public`, has no parameters and does not return a value. The\
    \ method does three things: First, it prints “Calculating…” on the screen. Next,\
    \ it assigns `hourlyRate` to the `BasicPay` property. Finally, it assigns `BasicPay`\
    \ to the `TotalPay` property. Try coding this method.\n\nFinally, write a `ToString()`\
    \ method to display the values of the `Staff` class. The table below shows a summary\
    \ of the `Staff` class.\n\n#### Fields\n`private float hourlyRate`\n`private int\
    \ hWorked`\n\n#### Properties\n`public float TotalPay`\n`public float BasicPay`\n\
    `public string NameOfStaff`\n`public int HoursWorked`\n\n#### Constructor\n`public\
    \ Staff(string name, float rate)`\n\n#### Methods\n`public virtual void CalculatePay()`\n\
    `public override string ToString()`\n\n## Manager : Staff Class\n\nNext, let’s\
    \ move on to code the `Manager` class.\n\n### Fields\n\nThe `Manager` class is\
    \ a child class of `Staff`. It has one `private` field called `managerHourlyRate`.\
    \ Try declaring this field and initializing it with 50.\n\n### Properties\n\n\
    `Manager` also has a `public` auto-implemented property called `Allowance`. `Allowance`\
    \ is of `int` type and has a `private` setter. Try coding this property.\n\n###\
    \ Constructor\n\nNow, let’s declare the constructor for `Manager`. The `Manager`\
    \ class has a `public` constructor with a `string` parameter, `name`. The task\
    \ of the constructor is to call the base constructor and pass the parameter `name`\
    \ and the field `managerHourlyRate` to the base constructor. Other than that,\
    \ the child constructor does nothing. Hence, there is nothing within the curly\
    \ braces of the child constructor. Try coding this constructor.\n\n### Method\n\
    \nNext, let’s code a method to override the `CalculatePay()` method in the `Staff`\
    \ class. As `Manager` is derived from `Staff`, it has access to the `BasicPay`,\
    \ `TotalPay` and `HoursWorked` properties declared in the `Staff` class.\n\nIn\
    \ addition, `Manager` also has its own property – `Allowance`. We’ll be making\
    \ use of these four properties in this method.\n\nFirst, let’s declare the method.\
    \ `CalculatePay()` is `public` and does not return any value. We have to use the\
    \ `override` keyword when declaring this method as it overrides the `CalculatePay()`\
    \ method in the `Staff` class.\n\nWithin the `CalculatePay()` method in the `Manager`\
    \ class, we shall first call the `CalculatePay()` method in the parent class and\
    \ use it to set the values of `BasicPay` and `TotalPay`. To call a virtual method\
    \ in the parent class, you have to use the `base` keyword. Add the following line\
    \ to your `CalculatePay()` method.\n\n```csharp\nbase.CalculatePay();\n```\n\n\
    This calls the `CalculatePay()` method in the base (parent) class, which sets\
    \ the values of `BasicPay` and `TotalPay`. After setting the values of these two\
    \ properties, let’s go on to set the value of `Allowance`. We’ll set the value\
    \ to 1000.\n"
