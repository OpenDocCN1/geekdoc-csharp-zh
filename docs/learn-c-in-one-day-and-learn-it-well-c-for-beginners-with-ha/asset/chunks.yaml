- fmt: "\nInheritance is one of the key concepts of object-oriented programming. Simply\
    \ stated, inheritance allows us to create a new class from an existing class so\
    \ that we can effectively reuse existing code.\n\n## Writing the Parent Class\n\
    \nSuppose we are writing a program for a fitness club that has two types of membership\
    \ – VIP and Normal. To do that, let’s create a class called `Member` first.\n\n\
    ```csharp\nclass Member\n{\n  protected int annualFee;\n  private string name;\n\
    \  private int memberID;\n  private int memberSince;\n}\n```\n\n`Member` contains\
    \ one protected field and three private fields. A protected field is a field that\
    \ is only accessible within the class in which it is declared and any class that\
    \ is derived from it. We’ll talk about derived classes very soon.\n\nNext, let\
    \ us write a `ToString()` method to display the values of the four fields.\n\n\
    ```csharp\npublic override string ToString()\n{\n  return \"\\nName: \" + name\
    \ + \"\\nMember ID: \" + memberID + \"\\nMember Since: \" + memberSince + \"\\\
    nTotal Annual Fee: \" + annualFee;\n}\n```\n\nFinally, let’s add two constructors\
    \ to the `Member` class.\n\n```csharp\npublic Member()\n{\n  Console.WriteLine(\"\
    Parent Constructor with no parameter\");\n}\npublic Member(string pName, int pMemberID,\
    \ int pMemberSince)\n{\n  Console.WriteLine(\"Parent Constructor with 3 parameters\"\
    );\n  name = pName;\n  memberID = pMemberID;\n  memberSince = pMemberSince;\n\
    }\n```\n\nThe first constructor merely prints the line “Parent Constructor with\
    \ no parameter”.\n\nThe second constructor is more interesting. It prints the\
    \ line “Parent Constructor with 3 parameters” and assigns its parameters to the\
    \ three private fields in the `Member` class.\n\n## Writing the Child Class\n\n\
    Now, let us learn how to derive a class from the `Member` class. Derived classes\
    \ are known as child classes, while the classes from which they are derived are\
    \ known as parent classes or base classes.\n\nA derived class inherits all the\
    \ public and protected members from the parent class. In other words, it can use\
    \ those fields, properties and methods as if they are part of its own code.\n\n\
    Our parent class (`Member`) has the following contents:\n\n### Fields\n- `protected\
    \ int annualFee`\n- `private string name`\n- `private int memberID`\n- `private\
    \ int memberSince`\n\n### Methods\n- `public override string ToString()`\n\n###\
    \ Constructors\n- `public Member()`\n- `public Member(string pName, int pMemberID,\
    \ int pMemberSince)`\n\nWe shall derive two classes – `NormalMember` and `VIPMember`\
    \ – from the `Member` class.\n\nFirst, let’s declare the child class `NormalMember`.\
    \ We indicate that it is derived from the `Member` class using a colon (`:`) like\
    \ this\n\n```csharp\nclass NormalMember : Member\n{\n}\n```\n\nNow, we need to\
    \ write the constructor for the child class. The constructor of a child class\
    \ is built upon the parent’s constructor. Whenever we create a child object, the\
    \ parent class constructor is always called first.\n\nThere are two ways to create\
    \ a child constructor. The first way is to simply declare it like any other constructor.\n\
    \n```csharp\npublic NormalMember()\n{\n  Console.WriteLine(\"Child constructor\
    \ with no parameter\");\n}\n```\n\nWhen we declare our constructor as above, C#\
    \ looks for a parameterless constructor (i.e. a constructor with no parameter)\
    \ in the parent class and calls that first before executing the code in the child\
    \ constructor. If you use this constructor to create a child object, the following\
    \ two lines will be displayed on the screen\n\n`Parent Constructor with no parameter`\n\
    `Child constructor with no parameter`\n\nThe first line is from the parent constructor\
    \ while the second line is from the child constructor.\n\nThe second way to declare\
    \ a child constructor is to use the colon sign (:) and the `base` keyword to call\
    \ a non parameterless constructor in the parent class. An example is shown below:\n\
    \n```csharp\npublic NormalMember(string remarks) : base (“Jamie”, 1, 2015)\n{\n\
    \  Console.WriteLine(\"Remarks = {0}\", remarks);\n}\n```\n\nWhen we call a non\
    \ parameterless constructor in the parent class, we need to pass in values to\
    \ its parameters. In the example above, we passed in the values “Jamie”, 1 and\
    \ 2015 to the parent constructor. These values are then assigned to the fields\
    \ `name`, `memberID` and `memberSince` in the base class respectively.\n\nIn this\
    \ example, we passed in fixed values as arguments to the base constructor. However,\
    \ a better way is to pass in the arguments through the child constructor. The\
    \ example below shows how this can be done. Replace the previous constructor with\
    \ the constructor below:\n\n```csharp\npublic NormalMember(string remarks, string\
    \ name, int memberID, int memberSince) : base (name, memberID, memberSince)\n\
    {\n  Console.WriteLine(\"Child Constructor with 4 parameters\");\n  Console.WriteLine(\"\
    Remarks = {0}\", remarks);\n}\n```\n\nThis new child constructor has four parameters.\
    \ The first parameter is a `string` parameter called `remarks`. This parameter\
    \ is used inside the child constructor.\n\nThe second, third and fourth parameters\
    \ are not used in the child constructor. Instead, they are passed in as arguments\
    \ to the parent constructor based on their names. For instance, the second parameter\
    \ in the child constructor (`string name`) is passed in as the first argument\
    \ to the parent constructor (`name`).\n\nWhen we create a child object with this\
    \ constructor, we write something like\n\n```csharp\nNormalMember myChildMember\
    \ = new NormalMember(“Special Rate”, \"James\", 1, 2010);\n```\n\nThe base constructor\
    \ with 3 parameters is called and executed first. The values “James”, 1 and 2010\
    \ are passed to the base constructor. Behind the scene, these values are assigned\
    \ to the fields `name`, `memberID` and `memberSince` in the base class respectively.\n\
    \nAfter executing the base constructor, the child constructor will be executed.\
    \ The string “Special Rate” is assigned to `remarks` and displayed on the screen.\n\
    \nWhen you run the code, you will get the following output\n\n`Parent Constructor\
    \ with 3 parameters`\n`Child Constructor with 4 parameters`\n`Remarks = Special\
    \ Rate`\n\nNow that we have created the constructors for our child class, let\
    \ us move on to create a method to calculate the annual fee of a normal member.\
    \ The code is simply\n\n```csharp\npublic void CalculateAnnualFee()\n{\n  annualFee\
    \ = 100 + 12*30;\n}\n```\n\nWhen we write “annualFee” in the code above, we are\
    \ accessing the protected field `annualFee` in the parent class. Recall that a\
    \ child class has access to all public and protected fields in its parent class?\
    \ Hence, the child class can use this field as if it is its own. The child class\
    \ does not need to create an instance of the parent class in order to access its\
    \ protected fields.\n\nThat’s all for our child class `NormalMember`. The class\
    \ has the following contents:\n\n### Fields\nInherited from parent class:\n- `protected\
    \ int annualFee`\n\n### Methods\nInherited from parent class:\n- `public override\
    \ string ToString()`\nDeclared in child class:\n- `public void CalculateAnnualFee()`\n\
    \n### Constructors\n- `public NormalMember()`\n- `public NormalMember(string remarks,\
    \ string name, int memberID, int memberSince)`\n\nNext, let us write another class\
    \ that inherits from `Member`. This time, the derived class is called `VIPMember`.\
    \ The code is shown below.\n\n```csharp\nclass VIPMember : Member\n{\n  public\
    \ VIPMember(string name, int memberID, int memberSince) : base (name, memberID,\
    \ memberSince)\n  {\n    Console.WriteLine(\"Child Constructor with 3 parameters\"\
    );\n  }\n  public void CalculateAnnualFee()\n  {\n    annualFee = 1200;\n  }\n\
    }\n```\n\nThis class has one constructor (with 3 parameters) and one method `CalculateAnnualFee()`.\
    \ The `CalculateAnnualFee()` method here uses a different formula for calculating\
    \ annual fee from the `CalculateAnnualFee()` method in the `NormalMember` class.\
    \ It is alright for the two methods to share the same name (and signature) as\
    \ they are in different classes.\n\n`VIPMember` class has the following contents:\n\
    \n### Fields\nInherited from parent class:\n- `protected int annualFee`\n\n###\
    \ Methods\nInherited from parent class:\n- `public override string ToString()`\n\
    Declared in child class:\n- `public void CalculateAnnualFee()`\n"
