    ## Chapter 5: Making our Program Interactive


    Now that we have covered the basics of variables and data types, let us write
    a program that makes use of them. In this chapter, we’ll learn how to accept input
    from users, store the data in a variable and display messages to our users. Ready?


    Displaying Messages to Users


    To display messages to our users, we use the `Write()` or `WriteLine()` method
    provided by C#, available in the `System` namespace.


    The difference between `WriteLine()` and `Write()` is that `Writeline()` moves
    the cursor down to the next line after displaying the message while `Write()`
    does not.


    If we write


    `Console.WriteLine(“Hello ”);`


    `Console.WriteLine(“How are you?”);`


    we’ll get


    `Hello`


    `How are you?`


    If we write


    `Console.Write(“Hello ”);`


    `Console.Write(“How are you?”);`


    we’ll get


    `Hello How are you?`


    Note that in the examples above, we added the word `Console` in front of the method
    name whenever we call the `WriteLine()` or `Write()` method. This is because both
    methods are static methods of the `Console` class. We’ll talk more about static
    methods in Chapter 7.


    If you find it troublesome to add the word `Console` whenever you use these two
    methods, you can add the directive


    `using static System.Console;`


    to the start of your program. If you do that, you can simply write


    `WriteLine(“Hello World”);`


    instead of


    `Console.WriteLine(“Hellow World”);`


    whenever you use any of the static methods in the `Console` class. This is a new
    feature in C# 6 (the latest version of C#) and is available only if you use the
    latest IDE (i.e. Visual Studio 2015). For the rest of our examples, we’ll stick
    to the first method for backwards compatibility.


    We have already seen an example of how we can use the `WriteLine()` method when
    we wrote the “Hello World” program in Chapter 2\. Let us now look at more examples.
    In the examples below, we’ll focus on the `WriteLine()` method. The `Write()`
    method works exactly the same way.


    Example 1


    To display a simple string, we write


    `Console.WriteLine(“Hello, how are you?”);`


    Output


    `Hello, how are you?`


    Example 2


    To display the value of a variable, we pass in the variable name as an argument.
    For instance, suppose we have


    `int userAge = 30;`


    we display the value of `userAge` by writing


    `Console.WriteLine(userAge);`


    Output


    `30`


    Note that we do not enclose the variable name (`userAge`) in double quotes. If
    we write


    `Console.WriteLine(“userAge”);`


    we’ll get


    `userAge`


    as the output instead.


    Example 3


    To combine two or more strings and display them, we use the concatenation (`+`)
    sign mentioned in the previous chapter.


    For instance, if we write


    `Console.WriteLine(“Hello, ” + “how are you?” + “ I love C#.”);`


    we’ll get


    `Hello, how are you? I love C#.`


    Example 4


    We can also use the concatenation sign to combine a string and a variable. Suppose
    we have


    `int results = 79;`


    The statement


    `Console.WriteLine(“You scored ” + results + “ marks for your test.”);`


    gives us


    `You scored 79 marks for your test.`


    Again, we do not enclose the variable name in double quotes. Else we will get


    `You scored results marks for your test.`


    Example 5


    In addition to using the concatenation sign to combine strings and variables,
    we can use placeholders. Suppose we have


    `int results = 79;`


    If we write


    `Console.WriteLine(“{0}! You scored {1} marks for your test.”, “Good morning”,
    results);`


    we will get


    `Good morning! You scored 79 marks for your test.`


    In this example, we passed in three arguments to the `WriteLine()` method, separated
    by commas.


    The three arguments are


    1) `“{0}! You scored {1} marks for your test.”`


    2) `“Good morning”`


    3) `results`


    The first is the string that will be displayed. Within the string, the curly braces
    act as placeholders and will be replaced by the arguments that follow.


    `{0}` is a placeholder for the next argument, which is the string “Good morning”
    in this case.


    `{1}` is a placeholder for the variable `results`.


    Therefore the output is


    `Good morning! You scored 79 marks for your test.`


    If you wrote


    `Console.WriteLine(“{1}! You scored {0} marks for your test.”, “Good morning”,
    results);`


    you’ll get


    `79! You scored Good morning marks for your test.`


    Of course, such a statement makes no sense. However, it demonstrates how placeholders
    are replaced by the corresponding arguments.


    We can specify how we want numeric values to be displayed when using placeholders.
    This is done using a format specifier, such as the `C` and `F` specifiers.


    The `F` specifier specifies the number of decimal places a number should be displayed
    with.


    If we write


    `Console.WriteLine(“The number is {0:F3}.”, 123.45678);`


    we’ll get


    `The number is 123.457`.


    The `F3` specifier rounds the number 123.45678 off to 123.457\. Note that there
    should not be any space before the specifier. In other words, it has to be `{0:F3}`
    and not `{0: F3}`.


    The `C` specifier is for formatting currencies; it adds the “$” symbol in front
    of the number and displays the number with 2 decimal places. In addition, it separates
    every thousand with a comma.


    If you write


    `Console.WriteLine(“Deposit = {0:C}. Account balance = {1:C}.”, 2125, 12345.678);`


    you’ll get


    `Deposit = $2,125.00\. Account balance = $12,345.68`


    Example 6


    We can also use `Console.WriteLine()` to print the result of a method.


    In Chapter 4, we learned how to use the `Substring()` method to extract a substring
    from a longer string. In that example, we assigned the result to another string.
    Alternatively, we can use `Console.WriteLine()` to display the result without
    assigning it a variable.


    For instance, if you write


    `Console.WriteLine(“Microsoft”.Substring(1, 3));`


    The output


    `icr`


    will be displayed on the screen.


    Besides displaying the result of a method, `Console.WriteLine()` can also be used
    to display the value of a property. If we write


    `Console.WriteLine(“Hello World”.Length);`


    the value


    `11`


    will be displayed on the screen.


    Escape Sequences


    Sometimes in our programs, we may need to print some special “unprintable” characters
    such as a tab or a newline. In this case, you need to use the `\` (backslash)
    character to escape characters that otherwise have a different meaning.


    For instance to print a tab, we type the backslash character before the letter
    t, like this: `\t`.


    Without the `\` character, the letter “t” will be printed. With it, a tab is printed.
    Hence, if you type


    `Console.WriteLine(“Hello\tWorld”);`


    you’ll get


    `Hello``World`


    Other common uses of the backslash character include:


    To prints a newline (\n)


    Example


    `Console.WriteLine(“Hello\nWorld”);`


    Output


    `Hello`


    `World`


    To print the backslash character itself (\\)


    Example


    `Console.WriteLine(“\\”);`


    Output


    `\`


    To print double quotes (\”) so that the double quote does not end the string


    Example


    `Console.WriteLine(“I am 5’9\” tall”);`


    Output


    `I am 5’9” tall`


    Accepting User Input


    Now that we know how to display messages to our users, let us look at how we can
    accept input from them.


    To accept user input, we can use either the `Read()` or `ReadLine()` method.


    `Read()`reads the next character from standard input while `ReadLine()` reads
    a line of characters. Standard input refers to the standard device that users
    use to enter data, which is usually the keyboard.


    The example below shows how we can use the `ReadLine()` method to read input from
    users. The `Read()` method works the same way.


    `string userInput = Console.ReadLine();`'
