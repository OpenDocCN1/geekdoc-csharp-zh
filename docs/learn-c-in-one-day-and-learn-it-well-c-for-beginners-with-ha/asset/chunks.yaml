    Fail\");\n18 break;\n19 }\n```\n\n程序首先提示用户输入成绩。\n\n如果成绩是“A+”（第 6 行），程序将执行下一个语句直到遇到\
    \ `break;` 语句。这意味着它将执行第 7 到第 9 行。因此，输出是“Distinction”。\n\n如果成绩是“A”（第 7 行），程序将执行第\
    \ 8 和第 9 行。同样地，输出是“Distinction”。\n\n如果成绩不是“A+或“A”，程序将检查下一个 `case`。它会从上到下持续检查直到满足某个\
    \ `case`。如果没有 `case` 适用，则执行 `default` 情况。\n\n如果你运行上面的代码，对于所示的输入，你将得到以下输出：\n\n\
    `Enter your grade: A+`\n`Distinction`\n\n`Enter your grade: A`\n`Distinction`\n\
    \n`Enter your grade: B`\n`B Grade`\n\n`Enter your grade: C`\n`C Grade`\n\n`Enter\
    \ your grade: D`\n`Fail`\n\n## For 循环 (For Loop)\n\n`for` 循环反复执行代码块，直到条件不再有效。`for`\
    \ 的语法为：\n\n`for (初始值; 测试条件; 修改)`\n\n`{`\n`//执行任务`\n`}`\n\n为了理解 `for` 循环是如何工作的，让我们考虑这个示例。\n\
    \n```cs\n1 for (int i = 0; i < 5; i++)\n2 {\n3 Console.WriteLine(i);\n4 }\n```\n\
    \n`for` 主要由三个部分组成，用分号分隔。第一部分声明并初始化 `int` 变量 `i` 为零。该变量作为循环计数器。第二部分测试 `i` 是否小于\
    \ 5。如果是，则执行大括号内的语句。在执行完 `WriteLine()` 语句后，程序返回第 1 行。`i++` 将 `i` 的值增加 1。因此，`i`\
    \ 从 0 增加到 1。增加后，程序测试 `i` 的新值是否仍然小于 5。如果是，则再次执行 `WriteLine()`。这种测试和增加计数器的过程重复进行，直到\
    \ `i < 5` 不再成立。此时，程序退出 `for` 循环并继续执行后续命令。\n\n该代码的输出为：\n\n`0`\n`1`\n`2`\n`3`\n\
