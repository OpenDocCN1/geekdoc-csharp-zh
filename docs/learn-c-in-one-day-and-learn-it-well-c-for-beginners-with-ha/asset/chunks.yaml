    Inline If


    An inline `if` statement is a simpler form of an `if` statement that is very convenient
    if you want to assign a value to a variable depending on the result of a condition.
    The syntax is:


    `condition ? value if condition is true : value if condition is false;`


    For instance, the statement


    `3>2 ? 10 : 5;`


    returns the value 10 since 3 is greater than 2 (i.e. the condition `3 > 2` is
    true). This value can then be assigned to a variable.


    If we write


    `int myNum = 3>2 ? 10 : 5;`


    `myNum` will be assigned the value 10.


    Switch Statement


    The `switch` statement is similar to an `if` statement except that it does not
    work with a range of values. A `switch` statement requires each case to be based
    on a single value. Depending on the value of the variable used for switching,
    the program will execute the correct block of code.


    The syntax of a `switch` statement is as follows:


    `switch (variable used for switching)`


    `{`


    `case firstCase:`


    `do A;`


    `break (or other jump statements);`


    `case secondCase:`


    `do B;`


    `break (or other jump statements);`


    `case default:`


    `do C;`


    `break (or other jump statements);`


    `}`


    You can have as many cases as you want when using a `switch` statement. The `default`
    case is optional and is executed if no other case applies.


    When a certain case is satisfied, everything starting from the next line is executed
    until a jump statement is reached. A jump statement is a statement that instructs
    the compiler to jump to another line in the program. We’ll look at jump statements
    in greater depth later. The most commonly used jump statement is the `break;`
    statement.


    Let’s look at an example of how the `switch` statement works.


    `1 Console.Write("Enter your grade: ");`


    `2 string userGrade = Console.ReadLine();`


    `3`


    `4 switch (userGrade)`


