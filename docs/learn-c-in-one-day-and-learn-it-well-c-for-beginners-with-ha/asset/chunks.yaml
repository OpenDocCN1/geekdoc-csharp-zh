  trans: "\n在上面的代码中，我们有一个用于循环的 `char` 变量 `i`。每次循环运行时，`message` 数组中的一个元素会被赋值给变量 `i`。例如，循环第一次运行时，字符‘H’被赋值给\
    \ `i`。\n\n接下来这一行\n```cs\nConsole.Write(i);\n```\n会打印出字母‘H’。\n\n循环第二次运行时，字符‘e’被赋值给\
    \ `i`。这一行\n```cs\nConsole.Write(i);\n```\n打印出字母‘e’。\n\n此过程一直持续，直到数组中的所有元素都被打印完毕。\n\
    \n## while 循环\n\n顾如名，`while` 循环在特定条件仍然有效时重复执行循环内部的指令。`while` 语句的结构如下：\n\n```\n\
    while (condition is true)\n{\n    do A\n}\n```\n\n在使用 `while` 循环时，通常我们需要先声明一个变量作为循环计数器。让我们把这个变量为\
    \ `counter`。下面的代码展示了 `while` 循环工作的示例。\n\n```cs\nint counter = 5;\nwhile (counter\
    \ > 0)\n{\n    Console.WriteLine(“Counter = {0}”, counter);\n    counter = counter\
    \ – 1;\n}\n```\n\n如果你运行这段代码，将得到以下输出\n```\nCounter = 5\nCounter = 4\nCounter =\
    \ 3\nCounter = 2\nCounter = 1\n```\n\n`while` 语句的语法相对简单。只要 `counter > 0`，大括号内的语句就会执行。\n\
    \n注意到我们在大括号内部有一行 `counter = counter – 1` 吗？这一行至关重要。它在每次循环运行时都会将 `counter` 的值减\
    \ 1。\n\n我们需要将 `counter` 的值减 1，这样循环条件（`counter > 0`）最终会求结果为 `false`。如果我们忘记这样做，循环将一直运行下去，导致死循环。程序将一直打印\
    \ `counter = 5` 直到你以某种方式杀死程序。这并不是一种愉快的体验，特别是当你有一个大型程序且不知道哪段代码导致了死循环时。\n\n## do\
    \ while\n\n`do while` 循环与 `while` 循环相似，但主要区别在于——`do while` 循环大括号内的代码至少会执行一次。这里有一个\
    \ `do while` 循环工作的示例。\n\n```cs\nint counter = 100;\ndo {\n    Console.WriteLine(“Counter\
    \ = {0}”, counter);\n    counter++;\n} while (counter<0);\n```\n\n由于测试条件（`while\
    \ (counter<0)`）被放置在右大括号之后，它在大括号内的代码至少执行一次后才会进行测试。\n\n如果你运行上面的代码，将得到\n```\nCounter\
    \ = 100;\n```\n\n在第一次执行 `WriteLine()` 语句后，`counter` 增加了 1。现在 `counter` 的值是 101。当程序到达测试条件时，由于\
    \ `counter` 不小于 0，测试失败。程序随后将退出循环。即使 `counter` 的原始值不满足测试条件（`counter < 0`），大括号内的代码仍然执行了一次。\n\
    \n注意，对于 `do while` 语句，测试条件后需要一个分号（`;`）。\n\n## 跳转语句\n\n我们现在涵盖了 C# 中大部分的控制流语句。接下来，让我们来看看跳转语句。\n\
    \n跳转语句是一种指令程序偏离正常执行序列并跳转到另一行代码的语句。跳转语句通常用于循环和其他控制流语句中。\n\n### break\n\n`break`\
    \ 关键字会导致程序在满足特定条件时提前退出循环。我们已经见过 `break` 关键字如何在 `switch` 语句中使用。现在，让我们来看看 `break`\
    \ 关键字如何在 `for` 循环中使用的示例。\n\n考虑下面的代码段：\n\n```cs\n1 int i = 0;\n2\n3 for (i = 0;\
    \ i < 5; i++)\n4 {\n5     Console.WriteLine(\"i = {0}\", i);\n6     if (i == 2)\n\
    7         break;\n8 }\n```\n\n在这个示例中，我们在 `for` 循环内部使用了一个 `if` 语句。在编程中，“混合使用”各种控制工具是非常常见的，例如在\
    \ `if` 语句内部使用 `while` 循环，或在 `while` 循环内部使用 `for` 循环。这被称为嵌套控制语句。\n\n如果你运行上面的代码段，将得到以下输出。\n\
    ```\ni = 0\ni = 1\ni = 2\n```\n\n注意到循环在 `i = 2` 时提前结束了吗？\n\n如果没有 `break` 关键字，循环应该从\
    \ `i = 0` 运行到 `i = 4`，因为循环条件是 `i < 5`。但有了 `break` 关键字，当 `i = 2` 时，第 6 行的条件评估为\
    \ `true`。第 7 行的 `break` 关键字导致循环提前结束。\n\n### continue\n\n另一个常用的跳转关键字是 `continue`\
    \ 关键字。当我们使用 `continue` 时，关键字之后的循环剩余部分将被跳过。一个示例会让它变得更清晰。\n\n```cs\nfor (int i =\
    \ 0; i < 5; i++)\n{\n    if (i == 2)\n        continue;\n    Console.WriteLine(\"\
    i = {0}\", i);\n}\n```\n\n如果你运行上面的代码，将得到：\n```\ni = 0\ni = 1\ni = 3\ni = 4\n```\n\
    由于 `continue` 关键字，i = 2 被跳过了。\n\n## 异常处理\n\n我们现在学习了如何使用控制语句和跳转语句在正常情况下控制程序流。在本章结束之前，我们需要查看最后一种控制语句，`try-catch-finally`。`try-catch-finally`\
    \ 语句控制程序在发生错误时的运行方式。语法如下：\n\n```\ntry\n{\n    do something\n}\ncatch (type of\
    \ error)\n{\n    do else\n}\nfinally\n{\n    do this\n}\n```\n\n你可以有多个 `catch`\
    \ 块。此外，`finally` 块是可选的。让我们考虑一个示例。\n\n```cs\nint numerator, denominator;\nConsole.Write(\"\
    Please enter the numerator: \");\nnumerator = Convert.ToInt32(Console.ReadLine());\n\
    Console.Write(\"Please enter the denominator: \");\ndenominator = Convert.ToInt32(Console.ReadLine());\n\
    try\n{\n    Console.WriteLine(\"The result is {0}.\", numerator/denominator);\n\
    }\ncatch (Exception e)\n{\n    Console.WriteLine(e.Message);\n}\nfinally\n{\n\
    \    Console.WriteLine(\"---- End of Error Handling ----\");\n}\n```\n\n如果你运行代码并输入\
    \ 12 和 4，你将得到\n```\nThe result is 3.\n---- End of Error Handling ----\n```\n在这个示例中，`try`\
    \ 块的代码执行成功。在 `try` 块代码执行后，执行 `finally` 块的代码。\n\n现在假设你输入 12 和 0。你将得到\n```\nAttempted\
    \ to divide by zero.\n---- End of Error Handling ----\n```\n在这种情况下，执行的是 `catch`\
    \ 块。这是因为当程序尝试执行 `try` 块中的语句时发生了错误，因为你不能除以零。因此，执行了 `catch` 块中的语句。此外，`finally` 块的代码也会执行。\n\
    \n`Exception` 类处理所有通用错误，并有一个名为 `Message` 的属性，用于解释异常的原因。要显示该属性，我们写：\n```cs\nConsole.WriteLine(e.Message);\n\
    ```\n"
- fmt: "\nIn addition to the `Exception` class that handles general errors, we also\
    \ have other classes that can handle more specific errors. This is useful if you\
    \ want to perform specific tasks depending on the error caught. For instance,\
    \ you may want to display your own error message.\n\nTry running the code below:\n\
    \n```sharp\nint choice = 0;\nint[] numbers = { 10, 11, 12, 13, 14, 15 };\nConsole.Write(\"\
    Please enter the index of the array: \");\ntry\n{\n    choice = Convert.ToInt32(Console.ReadLine());\n\
    \    Console.WriteLine(\"numbers[{0}] = {1}\", choice, numbers[choice]);\n}catch\
    \ (IndexOutOfRangeException)\n{\n    Console.WriteLine(\"Error: Index should be\
    \ from 0 to 5.\");\n}catch (FormatException)\n{\n    Console.WriteLine(\"Error:\
    \ You did not enter an integer.\");\n}catch (Exception e)\n{\n    Console.WriteLine(e.Message);\n\
    }\n```\n\nIf you enter `10`, you will get:\n`Index was outside the bounds of the\
    \ array.`\n`Index should be from 0 to 5.`\n\nIf you enter `Hello`, you will get:\n\
    `Input string was not in a correct format.`\n`You did not enter an integer.`\n\
    \nThe first error is a `IndexOutOfRangeException` exception and was handled by\
    \ the first `catch` block. This exception occurs when you try to access an element\
    \ of an array with an index that is outside its bounds.\n\nThe second error is\
    \ a `FormatException` exception and was handled by the second `catch` block. The\
    \ `FormatException` exception occurs when the format of an argument is invalid.\
    \ In our example, `Convert.ToInt32(\"Hello\")` generated a `FormatException` exception\
    \ as the argument “Hello” cannot be converted into an integer. In contrast, if\
    \ you entered `4`, `Convert.ToInt32(“4”)` will not generate a `FormatException`\
    \ exception as the string “4” can be converted into an integer.\n\nAfter the two\
    \ specific `catch` blocks, we have one more `catch` block to catch any general\
    \ errors that we did not pre-empt.\n\nThis example above shows two of the many\
    \ exceptions in C#. For a complete list of all exceptions, refer to [https://msdn.microsoft.com/en-us/library/system.systemexception.aspx](https://msdn.microsoft.com/en-us/library/system.systemexception.aspx).\n\
    \n# Chapter 7: Object-Oriented Programming Part 1\n\nWe have covered a fair bit\
    \ so far. In the next two chapters, we are going to look at another important\
    \ concept in programming – the concept of object-oriented programming.\n\nIn this\
    \ chapter, we’ll learn what object-oriented programming is and how to write our\
    \ own classes and create objects from them. In addition, we’ll also discuss the\
    \ concept of fields, properties, constructors and methods.\n\n## What is Object-Oriented\
    \ Programming?\n\nSimply stated, object-oriented programming is an approach to\
    \ programming that breaks a programming problem into objects that interact with\
    \ each other.\n\nObjects are created from templates known as classes. You can\
    \ think of a class as the blueprint of a building. An object is the actual “building”\
    \ that we build based on the blueprint.\n\n## Writing our own class\n\nTo write\
    \ our own class, we use the `class` keyword, following by the name of the class.\n\
    \nFor instance, to create a `Staff` class, we write:\n\n```sharp\nclass Staff\
    \ {\n    //Contents of the class\n    //including fields, properties and methods\n\
    }\n```\n\nIt is common practice to use PascalCasing when naming our classes. PascalCasing\
    \ refers to the practice of capitalizing the first letter of each word, including\
    \ the first word (e.g. `ThisIsAClassName`). This is the convention that we’ll\
    \ be following in the book.\n\nThe content of the class is enclosed within the\
    \ pair of curly braces that follow the class name. Contents of a class include\
    \ constructors, destructors, constants, fields, methods, properties, indexers,\
    \ operators, events, delegates, interfaces, structs and other classes.\n\nWe’ll\
    \ cover some of the more common elements of a class in this chapter, namely fields,\
    \ methods, properties and constructors.\n\nTo understand what these are, let’s\
    \ build a class from scratch.\n\nFirst, create a new Console Application project\
    \ in Visual Studio Community and name this project “ClassDemo ”.\n\nStudy the\
    \ code that is automatically generated for you. Notice that inside the `ClassDemo`\
    \ namespace, VSC has already created a class called `Program` for you? Inside\
    \ the `Program` class, we have the `Main()` method.\n\nBy default, the `Main()`\
    \ method (which is the starting point for all C# applications) is put into the\
    \ `Program` class created by VSC. If we want, we can change the name of the `Program`\
    \ class to something else, but the `Main()` method must be called `Main()`. The\
