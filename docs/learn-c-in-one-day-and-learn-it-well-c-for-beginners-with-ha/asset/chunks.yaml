    `double` is the default floating point data type in C#. In other words, if you
    write a number like 2.34, C# treats it as a `double` by default.


    ### decimal

    `decimal` stores a decimal number but has a smaller range than `float` and `double`.
    However, it has a much greater precision of approximately 28-29 digits.


    If your program requires a high degree of precision when storing non integral
    numbers, you should use a `decimal` data type. An example is when you are writing
    a financial application where precision is very important.


    ### char

    `char` stands for character and is used to store single Unicode characters such
    as ‘A’, ‘%’, ‘’ and ‘p’ etc.


    ### bool

    `bool` stands for boolean and can only hold two values: `true` and `false`. It
    is commonly used in control flow statements. We’ll cover control flow statements
    in Chapter 6.


    ### Naming a Variable

    A variable name in C# can only contain letters, numbers or underscores (`_`).
    However, the first character cannot be a number. Hence, you can name your variables
    `userName`, `user_name` or `userName2` but not `2userName`.


    In addition, there are some reserved words that you cannot use as a variable name
    because they already have preassigned meanings in C#. These reserved words include
    words like `Console`, `if`, `while` etc. We’ll learn about each of them in subsequent
    chapters.


    Finally, variable names are case sensitive. `username` is not the same as `userName`.


    There are two conventions when naming a variable in C#. We can either use the
    camel case notation or use underscores. Camel casing is the practice of writing
    compound words with mixed casing, capitalising the first letter of each word except
    the first word (e.g. `thisIsAVariableName`). This is the convention that we’ll
    be using in the rest of the book. Alternatively, another common practice is to
    use underscores (`_`) to separate the words. If you prefer, you can name your
    variables like this: `this_is_a_variable_name`.


    ### Initializing a Variable

    Every time you declare a new variable, you need to give it an initial value. This
    is known as initializing the variable. You can change the value of the variable
    in your program later.


    There are two ways to initialize a variable. You can initialize it at the point
    of declaration or initialize it in a separate statement.


    The examples below show how you can initialize a variable at the point of declaration:


    #### Example 1

    These examples show how you can initialize `byte` and `int` variables.


    ```c

    byte userAge = 20;

    int numberOfEmployees = 510;

    ```

    As `byte` and `int` are for data with no decimal places, you will get an error
    if you write something like


    ```c

    byte userAge2 = 20.0;

    ```

    20.0 is not the same as 20 in C#.


    #### Example 2

    The next examples show how you can initialize `double`, `float` and `decimal`
    variables with integral values. Although these data types are for numbers with
    decimal parts, we can also use them to store integral values as shown below.


    ```c

    double intNumberOfHours = 5120;

    float intHourlyRate = 60;

    decimal intIncome = 25399;

    ```


    #### Example 3

    The examples below show how you can initialize `double`, `float` and `decimal`
    variables with non integers.


    ```c

    double numberOfHours = 5120.5;

    float hourlyRate = 60.5f;

    decimal income = 25399.65m;

    ```

    As mentioned previously, the default data type for a number with decimal places
    is `double`.


    Hence, in the examples above, when you initialize `hourlyRate`, you need to add
    ‘f’ as a suffix after 60.5 to explicitly tell the complier to change 60.5 to a
    `float`.


    Similarly, when you initialize `income`, you need to add ‘m’ as a suffix to change
    25399.65 into a `decimal` data type.


    #### Example 4

    A `char` data type can only contain a single character. When we initialize a `char`
    variable, we need to enclose that character in single quotes. An example is:


    ```c

    char grade = ‘A’;

    ```


    #### Example 5

    A `bool` variable can only be either `true` or `false`. The example below shows
    how you can initialize a `bool` variable.


    ```c

    bool promote = true;

    ```


    #### Example 6

    In addition to initializing variables individually, you can also initialize multiple
    variables in the same statement as long as they are of the same data type. The
    following example shows how this can be done. Note that the two variables are
    separated with a comma and the statement ends with a semi-colon.


    ```c

    byte level = 2, userExperience = 5;

    ```

    The six examples above show how you can initialize a variable at the point of
    declaration. Alternatively, you can choose to initialize a variable in a separate
    statement. An example is shown below:


    ```csharp

    byte year; //declare the variable

    year = 20; //initialize it

    ```


    ### The Assignment Sign

    The `=` sign in programming has a different meaning from the `=` sign we learned
    in Math. In programming, the `=` sign is known as an assignment sign. It means
    we are assigning the value on the right side of the `=` sign to the variable on
    the left. A good way to understand a statement like `year = 20` is to think of
    it as `year <- 20`.


    In programming, the statements `x = y` and `y = x` are different.


    ### Basic Operators

    Besides assigning an initial value to a variable or assigning another variable
    to it, we can also perform the usual operations on variables. Basic operators
    in C# include `+`, `-`, `*`, `/` and `%` which represent addition, subtraction,
    multiplication, division and modulus respectively.


    #### Example

    Suppose x = 7, y = 2


    Addition: x + y = 9

    Subtraction: x - y = 5

    Multiplication: x*y = 14

    Division: x/y = 3 (rounds down the answer to the nearest integer)

    Modulus: x%y = 1 (gives the remainder when 7 is divided by 2)


    In C#, division gives an integer answer if both `x` and `y` are integers. However,
    if either `x` or `y` is a non integer, we will get a non integer answer. For instance,


    ```7 / 2 = 3

    7.0 / 2 = 3.5

    7 / 2.0 = 3.5

    7.0 / 2.0 = 3.5

    ```

    In the first case, when an integer is divided by another integer, you get an integer
    as the answer. The decimal portion of the answer, if any, is truncated. Hence,
    we get 3 instead of 3.5.


    In all other cases, the result is a non integer as at least one of the operands
    is a non integer.


    ### More Assignment Operators

    Besides the `=` sign, there are a few more assignment operators in C# (and most
    programming languages). These include operators like `+=`, `-=` and `*=`.


    Suppose we have the variable `x`, with an initial value of 10. If we want to increment
    `x` by 2, we can write


    ```c

    x = x + 2;

    ```

    The program will first evaluate the expression on the right (`x + 2`) and assign
    the answer to the left. So eventually the statement above becomes `x <- 12`.


    Instead of writing `x = x + 2`, we can also write `x += 2` to express the same
    meaning. The `+=` sign is actually a shorthand that combines the assignment sign
    with the addition operator. Hence, `x += 2` simply means `x = x + 2`.


    Similarly, if we want to do a subtraction, we can write `x = x - 2` or `x -= 2`.
    The same works for all the 5 operators mentioned in the section above.

