  trans: "\n抽象类可以像其他类一样拥有字段、属性和方法。然而，它们不能拥有静态成员。此外，抽象类可以有一种特殊类型的方法，称为抽象方法。抽象方法是没有方法体的方法，并且必须在派生类中实现。它们只能存在于抽象类中。在某种程度上，抽象方法就像一份合同。如果你想确保任何继承你类的类都实现了某个方法，你可以将类声明为抽象类，并将该方法声明为抽象方法。\n\
    \n要声明抽象类，只需在 `class` 关键字之前添加 `abstract` 关键字，如下：\n\n```csharp\nabstract class MyClass\n\
    {\n}\n```\n\n在抽象类内部声明抽象方法，在返回类型之前添加 `abstract` 关键字，如下：\n\n```csharp\npublic abstract\
    \ void MyAbstractMethod();\n```\n\n由于抽象方法没有方法体，我们用分号 (;) 结束声明。\n\n要在派生类中实现抽象方法，我们使用\
    \ `override` 关键字，如下：\n\n```csharp\npublic override void MyAbstractMethod()\n{\n\
    }\n```\n\n下面的代码展示了抽象类的示例。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ AbstractClassDemo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            //MyAbstractClass abClass = new MyAbstractClass();\n\
    \            ClassA a = new ClassA();\n            a.PrintMessage();\n       \
    \     a.PrintMessageAbstract();\n            Console.Read();\n        }\n    }\n\
    \n    abstract class MyAbstractClass\n    {\n        private string message =\
    \ \"Hello C#\";\n        public void PrintMessage()\n        {\n            Console.WriteLine(message);\n\
    \        }\n        public abstract void PrintMessageAbstract();\n    }\n\n  \
    \  class ClassA : MyAbstractClass\n    {\n        public override void PrintMessageAbstract()\n\
    \        {\n            Console.WriteLine(\"C# is fun!\");\n        }\n    }\n\
    }\n```\n\n抽象类位于第 21 行到第 29 行。它包含一个私有字段 `message` 和一个公共方法 `PrintMessage()`。它在第\
    \ 28 行还包含一个抽象方法 `PrintMessageAbstract()`。第 31 行到第 37 行显示了实现抽象方法的派生类（第 33 行到第 36\
    \ 行）。\n\n如果你运行上述程序，将得到：\n\n```\nHello C#\nC# is fun!\n```\n\n注意第 13 行用 `//` 符号注释掉了？如果你移除两个斜杠，将会得到一个错误，因为抽象类不能实例化。\n\
    \n### 接口\n\n接下来，让我们来看接口。接口与抽象类相似，不能实例化且必须继承。然而，接口比抽象类更具概念性。它们只能包含没有方法体的方法。此外，它们不能包含字段，但可以包含属性。接口不能有静态成员。当子类继承接口时，我们说它实现了接口。\n\
    \n抽象类和接口之间的关键区别之一是，类只能继承一个抽象类，但可以实现多个接口。我们不会展示多个接口实现的示例，因为那是超出本书范围的高级主题。\n\n接面的代码展示了类如何实现一个接口的示例。接口名称通常以字母\
    \ `I` 开头。接口中的所有属性和方法都是公共的，因此不需要为它们添加任何访问修饰符。\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
    \nnamespace InterfaceDemo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            ClassA a = new ClassA();\n            a.MyNumber\
    \ = 5;\n            a.InterfaceMethod();\n            Console.Read();\n      \
    \  }\n    }\n\n    interface IShape\n    {\n        int MyNumber\n        {\n\
    \            get;\n            set;\n        }\n        void InterfaceMethod();\n\
    \    }\n\n    class ClassA : IShape\n    {\n        private int myNumber;\n  \
    \      public int MyNumber\n        {\n            get\n            {\n      \
    \          return myNumber;\n            }\n            set\n            {\n \
    \               if (value > 0)\n                {\n                    myNumber\
    \ = value;\n                }\n                else\n                {\n     \
    \               myNumber = 0;\n                }\n            }\n        }\n\n\
    \        public void InterfaceMethod()\n        {\n            Console.WriteLine(\"\
    The number is \" + MyNumber);\n        }\n    }\n}\n```\n\n接口位于第 20 行到第 28 行。`ClassA`\
    \ 在第 30 行实现了 `IShape`。属性 `MyNumber` 在第 33 行到第 47 行实现，`InterfaceMethod` 在第 49 行到第\
    \ 52 行实现。\n"
- fmt: "\nIn Chapter 3 and 4, we looked at some built in data types provided by C#.\
    \ These include value types like `int`, `float` and `double` and reference data\
    \ types like arrays, strings and lists. In addition, we also looked at how you\
    \ can write your own classes in Chapter 7 and 8. A class can be considered to\
    \ be an advanced user-defined data type that groups a set of related fields, properties\
    \ and methods into a logical unit.\n\nIn this chapter, we are going to look at\
    \ two more user-defined data types in C# – `enum` and `struct`.\n\n## Enum\n\n\
    An `enum` (which stands for enumerated type) is a special data type that allows\
    \ programmers to provide meaningful names for a set of integral constants.\n\n\
    To declare an enum, we use the `enum` keyword followed by the name of the enum.\
    \ The members of the enum are enclosed in a set of curly braces and separated\
    \ by commas.\n\nAn example is shown below:\n\n```csharp\nenum DaysOfWeek\n{\n\
    Sun, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\nNote that we do not put a semi-colon\
    \ at the end of the last member.\n\nAfter declaring the `DaysOfWeek` enum, we\
    \ can declare and initialize a `DaysOfWeek` variable like this:\n\n```csharp\n\
    DaysOfWeek myDays = DaysOfWeek.Mon;\n```\n\nThe name of the variable is `myDays`.\
    \ If we write\n\n```csharp\nConsole.WriteLine(myDays);\n```\n\nwe’ll get\n\n`Mon`\n\
    \nBy default, each member in the enum is assigned an integer value, starting from\
    \ zero. That is, in our example, `Sun` is assigned a value of 0, `Mon` is 1, `Tues`\
    \ is 2 and so on.\n\nAs members of an enum are essentially integers, we can cast\
    \ a `DaysOfWeek` variable into an `int` and vice versa. For instance,\n\n```csharp\n\
    Console.WriteLine((int)myDays);\n```\n\ngives us the integer `1` while\n\n```csharp\n\
    Console.WriteLine((DaysOfWeek)1);\n```\n\ngives us `Mon`.\n\nIf you want to assign\
    \ a different set of integers to your enum members, you can do the following\n\
    \n```csharp\nenum DaysOfWeekTwo\n{\nSun = 5, Mon = 10, Tues, Wed, Thurs, Fri,\
    \ Sat\n}\n```\n\nNow, `Sun` is assigned a value of 5 and `Mon` is assigned 10.\
    \ As we did not assign values for `Tues` to `Sat`, consecutive numbers after 10\
    \ will be assigned to them. That is `Tues` = 11, `Wed` = 12 and so on.\n\nAll\
    \ enums are stored internally as integers (`int`). If you want to change the underlying\
    \ data type from `int` to another data type, you add a colon after the enum name,\
    \ followed by the desired data type. Any integer data type is allowed except for\
    \ `char`. An example is\n\n```csharp\nenum DaysOfWeekThree : byte\n{\nSun, Mon,\
    \ Tues, Wed, Thurs, Fri, Sat\n}\n```\n\nOf course, if you use a `byte` data type,\
    \ you cannot do something like\n\n```csharp\nenum DaysOfWeekFour : byte\n{\nSun\
    \ = 300, Mon, Tues, Wed, Thurs, Fri, Sat\n}\n```\n\nas the range for `byte` is\
    \ from 0 to 255.\n\nThere are two main reasons for using enums. The first is to\
    \ improve the readability of your code. The statement `myDays = DaysOfWeek.Mon;`\
    \ is more self-explanatory than `myDays = 1;`. The second reason is to restrict\
    \ the values that a variable can take. If we have a variable that stores the days\
    \ of a week, we may accidentally assign the value 10 to it. This can be prevented\
    \ when we use enum as we can only assign the pre-defined members of the enum.\n\
    \n## Struct\n\nNow, let’s look at the `struct` data type.\n\nA `struct` is similar\
    \ to a `class` in many aspects. Like classes, they contain elements like properties,\
    \ constructors, fields and allow you to group related members into a single package\
    \ so you can manipulate them as a group.\n\nTo declare a struct, you use the `struct`\
    \ keyword. An example is:\n\n```csharp\nstruct MyStruct\n{\n    //Fields\n   \
    \ private int x, y;\n    private AnotherClass myClass;\n    private Days myDays;\n\
    \n    //Constructor\n    public MyStruct(int a, int b, int c)\n    {\n       \
    \ myClass = new AnotherClass();\n        myClass.number = a;\n        x = b;\n\
    \        y = c;\n        myDays = Days.Mon;\n    }\n\n    //Method\n    public\
    \ void PrintStatement()\n    {\n        Console.WriteLine(\"x = {0}, y = {1},\
    \ myDays = {2}\", x, y, myDays);\n    }\n}\n\nclass AnotherClass\n{\n    public\
    \ int number;\n}\n\nenum Days { Mon, Tues, Wed }\n```\n\nThe struct is declared\
    \ from lines 1 to 23. On line 4, we declared two `private int` fields for the\
    \ struct. On line 5, we declared another private field called `myClass`. This\
    \ field is an instance of the class `AnotherClass`. On line 6, we declared an\
    \ enum variable `myDays`. The two fields (`myClass` and `myDays`) are specially\
    \ included in this example to demonstrate how we can include a class instance\
    \ and an enum variable as fields of a struct. Structs (and classes) can contain\
    \ enum variables and instances of other structs and classes as fields.\n\nAfter\
    \ declaring the fields, we declared the constructor for the struct (lines 9 to\
    \ 16), followed by a method to print the values of `x`, `y` and `myDays` (lines\
    \ 19 to 22).\n\nAfter declaring the struct, we declared the class `AnotherClass`\
    \ on lines 25 to 28 and the enum `Days` on line 30. In this example, we declared\
    \ the class and enum outside the struct `MyStruct`. However, it is possible for\
    \ us to declare the enum or class inside the struct itself. An enum, struct or\
    \ class can be nested inside another struct or class. We’ll look at an example\
    \ of an enum inside a class when we work through the project at the end of the\
    \ book.\n\nTo use the struct above, we can add the following code to our `Main()`\
    \ method:\n\n```csharp\nMyStruct example = new MyStruct(2, 3, 5);\nexample.PrintStatement();\n\
    ```\n\nIf we run the code, we’ll get `x = 3, y = 5, myDays = Mon`.\n\nThere are\
    \ two main differences between a struct and a class. Firstly, the struct data\
    \ type does not support inheritance. Hence you cannot derive one struct from another.\
    \ However, a struct can implement an interface. The way to do it is identical\
    \ to how it is done with classes. Refer to Chapter 8 for more information.\n\n\
    The second difference between structs and classes is that structs are value types\
    \ while classes are reference types.\n\nFor a complete list of differences between\
    \ a struct and a class, check out the following page: https://msdn.microsoft.com/en-us/library/saxz13w4.aspx\n\
    \n## Chapter 10: LINQ\n\nLINQ stands for Language-Integrated Query and is an interesting\
    \ feature of C# that allows you to query data in your program. In this chapter,\
    \ we’ll cover a brief introduction to LINQ followed by examples of how LINQ can\
    \ be used.\n\nLet’s first learn how to write a LINQ query. The typical syntax\
    \ for a LINQ query is `from... where... orderby... select`.\n\nLet’s suppose we\
    \ have an array of numbers and we want to select all even numbers from the array.\
    \ We can do that easily with LINQ.\n\nFirst, let’s declare the array.\n\n```csharp\n\
    int[] numbers = { 0, 1, 2, 3, 4, 5, 6 };\n```\n\nNext, we write a LINQ query as\
    \ follows:\n\n```csharp\nvar evenNumQuery =\nfrom num in numbers\nwhere (num %\
    \ 2) == 0\nselect num;\n```\n\nThe query is from the second to the fourth line.\
    \ Readers who have experience with SQL will probably find this query quite familiar.\
    \ The query consists of three parts. The first part `from num in numbers` states\
    \ that we are performing the query on the `numbers` array. `num` is the name that\
    \ we use to represent the individual items in the array. The next line `where\
    \ (num % 2) == 0` tests the individual items to determine if the remainder of\
    \ `num` divided by 2 is zero. If it is, `num` is an even number. The third line\
    \ `select num;` selects all elements that satisfy this criteria.\n\nThis result\
    \ is then assigned to the variable `evenNumQuery`, which is declared to be of\
    \ `var` type. `var` is a special data type that we use whenever we want the complier\
    \ to determine the data type itself. This is necessary because in our example,\
    \ the data type of `evenNumQuery` is quite complex; we are better off letting\
    \ C# figure the data type out for us.\n\nAfter we create the query statement,\
    \ we can execute the query by writing\n\n```csharp\nforeach (int i in evenNumQuery)\n\
    {\n    Console.WriteLine(\"{0} is an even number\", i);\n}\n```\n"
  raw: 'In Chapter 3 and 4, we looked at some built in data types provided by C#.
    These include value types like `int`, `float` and `double` and reference data
    types like arrays, strings and lists. In addition, we also looked at how you can
    write your own classes in Chapter 7 and 8\. A class can be considered to be an
    advanced user-defined data type that groups a set of related fields, properties
    and methods into a logical unit.


    In this chapter, we are going to look at two more user-defined data types in C#
    – enum and struct.


    Enum


    An enum (which stands for enumerated type) is a special data type that allows
    programmers to provide meaningful names for a set of integral constants.


    To declare an enum, we use the `enum` keyword followed by the name of the enum.
    The members of the enum are enclosed in a set of curly braces and separated by
    commas.


    An example is shown below:


    `enum DaysOfWeek`


    `{`


    `Sun, Mon, Tues, Wed, Thurs, Fri, Sat`


    `}`


    Note that we do not put a semi-colon at the end of the last member.


    After declaring the `DaysOfWeek` enum, we can declare and initialize a `DaysOfWeek`
    variable like this:


    `DaysOfWeek myDays = DaysOfWeek.Mon;`


    The name of the variable is `myDays`. If we write


    `Console.WriteLine(myDays);`


    we’ll get


    `Mon`


    By default, each member in the enum is assigned an integer value, starting from
    zero. That is, in our example, Sun is assigned a value of 0, Mon is 1, Tues is
    2 and so on.


    As members of an enum are essentially integers, we can cast a `DaysOfWeek` variable
    into an `int` and vice versa. For instance,


    `Console.WriteLine((int)myDays);`


    gives us the integer `1` while


    `Console.WriteLine((DaysOfWeek)1);`


    gives us `Mon`.


    If you want to assign a different set of integers to your enum members, you can
    do the following


    `enum DaysOfWeekTwo`


    `{`


    `Sun = 5, Mon = 10, Tues, Wed, Thurs, Fri, Sat`


    `}`


    Now, Sun is assigned a value of 5 and Mon is assigned 10\. As we did not assign
    values for Tues to Sat, consecutive numbers after 10 will be assigned to them.
    That is Tues = 11, Wed = 12 and so on.


    All enums are stored internally as integers (`int`). If you want to change the
    underlying data type from `int` to another data type, you add a colon after the
    enum name, followed by the desired data type. Any integer data type is allowed
    except for `char`. An example is


    `enum DaysOfWeekThree : byte`


    `{`


    `Sun, Mon, Tues, Wed, Thurs, Fri, Sat`


    `}`


    Of course, if you use a `byte` data type, you cannot do something like


    `enum DaysOfWeekFour : byte`


    `{`


    `Sun = 300, Mon, Tues, Wed, Thurs, Fri, Sat`


    `}`


    as the range for `byte` is from 0 to 255.


    There are two main reasons for using enums. The first is to improve the readability
    of your code. The statement


    `myDays = DaysOfWeek.Mon;`


    is more self-explanatory than the statement


    `myDays = 1;`


    The second reason is to restrict the values that a variable can take. If we have
    a variable that stores the days of a week, we may accidentally assign the value
    10 to it. This can be prevented when we use an enum as we can only assign the
    pre-defined members of the enum to the variable.


    Struct


    Now, let’s look at the `struct` data type.


    A struct is similar to a class in many aspects. Like classes, they contain elements
    like properties, constructors, methods and fields and allow you to group related
    members into a single package so that you can manipulate them as a group.


    To declare a struct, you use the `struct` keyword. An example is:


    `1 struct MyStruct`


    `2 {`


    `3``//Fields`


    `4``private int x, y;`


    `5``private AnotherClass myClass;`


    `6``private Days myDays;`


    `7`


    `8``//Constructor`


    `9``public MyStruct(int a, int b, int c)`


    `10``{`


    `11``myClass = new AnotherClass();`


    `12``myClass.number = a;`


    `13``x = b;`


    `14``y = c;`


    `15``myDays = Days.Mon;`


    `16``}`


    `17`


    `18``//Method`


    `19``public void PrintStatement()`


    `20``{`


    `21``Console.WriteLine("x = {0}, y = {1}, myDays = {2}", x, y, myDays);`


    `22``}`


    `23 }`


    `24`


    `25 class AnotherClass`


    `26 {`


    `27``public int number;`


    `28 }`


    `29`


    `30 enum Days { Mon, Tues, Wed }`


    The struct is declared from lines 1 to 23\. On line 4, we declared two `private`
    `int` fields for the struct. On line 5, we declared another private field called
    `myClass`. This field is an instance of the class `AnotherClass`. On line 6, we
    declared an enum variable `myDays`. The two fields (`myClass` and `myDays`) are
    specially included in this example to demonstrate how we can include a class instance
    and an enum variable as the fields of a struct. Structs (and classes) can contain
    enum variables and instances of other structs and classes as fields.


    After declaring the fields, we declared the constructor for the struct (lines
    9 to 16), followed by a method to print the values of `x`, `y` and `myDays`. (lines
    19 to 22).


    After declaring the struct, we declared the class `AnotherClass` on lines 25 to
    28 and the enum `Days` on line 30\. In this example, we declared the class and
    enum outside the struct `myStruct`. However, it is possible for us to declare
    the enum or class inside the struct itself. An enum, struct or class can be nested
    inside another struct or class. We’ll look at an example of an enum declared inside
    a class when we work through the project at the end of the book.


    To use the struct above, we can add the following code to our `Main()` method:


    `MyStruct example = new MyStruct(2, 3, 5);`


    `example.PrintStatement();`


    If we run the code, we’ll get


    `x = 3, y = 5, myDays = Mon`


    There are two main differences between a struct and a class. Firstly, the struct
    data type does not support inheritance. Hence you cannot derive one struct from
    another. However, a struct can implement an interface. The way to do it is identical
    to how it is done with classes. Refer to Chapter 8 for more information.


    The second difference between structs and classes is that structs are value types
    while classes are reference types.


    For a complete list of differences between a struct and a class, check out the
    following page:


    [https://msdn.microsoft.com/en-us/library/saxz13w4.aspx](https://msdn.microsoft.com/en-us/library/saxz13w4.aspx)


    ## Chapter 10: LINQ


    LINQ stands for Language-Integrated Query and is an interesting feature of C#
    that allows you to query data in your program. In this chapter, we’ll cover a
    brief introduction to LINQ followed by two examples of how LINQ can be used.


    Let’s first learn how to write a LINQ query. The typical syntax for a LINQ query
    is


    `from… where… orderby… select`


    Let’s suppose we have an array of numbers and we want to select all even numbers
    from the array. We can do that easily with LINQ.


    First, let’s declare the array.


    `int[] numbers = { 0, 1, 2, 3, 4, 5, 6 };`


    Next, we write a LINQ query as follows:


    `var evenNumQuery =`


    `from num in numbers`


    `where (num % 2) == 0`


    `select num;`


    The query is from the second to the fourth line. Readers who have experience with
    SQL will probably find this query quite familiar. The query consists of three
    parts. The first part


    `from num in numbers`


    states that we are performing the query on the `numbers` array. `num` is the name
    that we use to represent the individual items in the array. The next line


    `where (num % 2) == 0`


    tests the individual items to determine if the remainder of `num` divided by 2
    is zero. If it is, `num` is an even number. The third line


    `select num;`


    selects all elements that satisfy this criteria.


    This result is then assigned to the variable `evenNumQuery`, which is declared
    to be of `var` type. `var` is a special data type that we use whenever we want
    the complier to determine the data type itself. This is necessary because in our
    example, the data type of `evenNumQuery` is quite complex; we are better off letting
    C# figure the data type out for us.


    After we create the query statement, we can execute the query by writing


    `foreach (int i in` `evenNumQuery``)`


    `{`


    `Console.WriteLine("{0} is an even number", i);`


    `}`'
