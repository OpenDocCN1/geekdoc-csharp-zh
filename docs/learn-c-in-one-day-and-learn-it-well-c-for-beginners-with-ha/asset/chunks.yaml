  raw: 'The `ToString()` method is a special method that returns a string that represents
    the current class. In C#, all classes come with a pre-defined `ToString()` method.
    However, it is customary (and expected of us) to override this method. Overriding
    a method simply means writing our own version of the method.


    Typically, the `ToString()` method that we write displays the values of the fields
    and properties of the class. Add the following code to the `Staff` class:


    `public override string ToString()`


    `{`


    `return "Name of Staff = " + nameOfStaff + ", hourlyRate = " + hourlyRate + ",
    hWorked = " + hWorked;`


    `}`


    As you can see, the `ToString()` method returns a `string` type. The string that
    it returns contains information about the `Staff` class. The `override` keyword
    in the method declaration indicates that this method overrides the default method.
    We’ll discuss more about the `override` keyword in the next chapter.


    Constructors


    Now, let us look at constructors.


    A constructor is a special method that is used to ‘construct’ an object from the
    class template. It is the first method that is called whenever we create an object
    from our class. Constructors are commonly used to initialize the fields of the
    class.


    A constructor always has the same name as the class (`Staff` in our case) and
    does not return any value. We do not need to use the `void` keyword when declaring
    a constructor.


    Add the following lines to our `Staff` class.


    `public Staff(string name)`


    `{`


    `nameOfStaff = name;`


    `Console.WriteLine("\n" + nameOfStaff);`


    `Console.WriteLine("--------------------------");`


    `}`


    In this constructor, we first initialize the field `nameOfStaff` with the string
    that is passed in to the constructor (`name`). We then display the value of `nameOfStaff`
    on the screen and underline it with a series of dashes.


    Like any other methods, we can have more than one constructor as long as the signature
    is different. We can add another constructor to our class.


    `public Staff(string firstName, string lastName)`


    `{`


    `nameOfStaff = firstName +` `" "` `+ lastName;`


    `Console.WriteLine("\n" + nameOfStaff);`


    `Console.WriteLine("--------------------------");`


    `}`


    This constructor has two parameters - `firstName` and `lastName.` The first line
    concatenates the two strings and assigns the resulting string to `nameOfStaff`.
    The next two lines print `nameOfStaff` on the screen and underline it with a series
    of dashes.


    Declaring a constructor is optional. If you do not declare your own constructor,
    C# creates one for you automatically. The default constructor simply initializes
    all the fields in the class to default values, which is normally zero for numeral
    fields and empty string for string fields.


    Instantiating an Object


    Now that we know how to create a class, let’s look at how we can make use of the
    class to create an object. This process is known as instantiating an object. An
    object is also known as an instance.


    To recap, our `Staff` class has the following components:


    Fields


    `private const int hourlyRate`


    `private string nameOfStaff`


    `private int hWorked`


    Properties


    `public int HoursWorked`


    Methods


    `public void PrintMessage()`


    `public int CalculatePay()`


    `public int CalculatePay(int bonus, int allowance)`


    `public override string ToString()`


    Constructors


    `public Staff(string name)`


    `public Staff(string firstName, string lastName)`


    We shall instantiate a `Staff` object in the `Main()` method inside the `Program`
    class.


    The syntax for instantiating an object is


    `ClassName objectName = new ClassName(arguments);`


    Add the following lines inside the curly braces of the `Main()` method in the
    `Program` class.


    `int pay;`


    `Staff staff1 = new Staff("Peter");`


    `staff1.HoursWorked = 160;`


    `pay = staff1.CalculatePay(1000, 400);`


    `Console.WriteLine("Pay = {0}", pay);`


    Here, we use the first constructor (with one parameter) to create our `staff1`
    object.


    Once we create the object, we can use the dot operator after the object’s name
    to access any public field, property or method in the `Staff` class. Note that
    we need to use the dot operator here as we are trying to access members of the
    `Staff` class from the `Program` class. The dot operator is necessary whenever
    we want to access a field, property or method from another class.


    If you are accessing members of the same class, you do not need to use the dot
    operator. An example is when we called the `PrintMessage()` method from the `CalculatePay()`
    method earlier. We did not use the dot operator as both methods are from the same
    class.


    After creating our `staff1` object, the next line shows how we can use the public
    `EmployeeType` property to assign a value to the `hWorked` field.


    `staff1.HoursWorked = 160;`


    If we try to access the private field `hWorked` directly by writing


    `staff1.hWorked = 160;`


    we will get an error as `hWorked` is a private field and is therefore only accessible
    within the `Staff` class.


    To call the `CalculatePay()` method, we write


    `staff1.CalculatePay(1000, 400);`


    In this example, as we have the numbers 1000 and 400 inside the parenthesis, we
    are using the second `CalculatePay()` method. We are passing in the values 1000
    and 400 to the parameters `bonus` and `allowance` respectively. The values that
    we passed in are known as arguments. The program then uses that method to calculate
    the pay and return the answer. This answer is assigned to the variable `pay`.


    Finally, we use the `Console.WriteLine()` method to display the value of `pay`
    on the screen.


    If you run the code above, you will get


    `Peter`


    `--------------------------`


    `Calculating Pay...`


    `Pay = 6200`


    Play around with the code a bit to get a better feel of how classes work. Try
    adding the following lines of code


    `Staff staff2 = new Staff("Jane", "Lee");`


    `staff2.HoursWorked = 160;`


    `pay = staff2.CalculatePay();`


    `Console.WriteLine("Pay = {0}", pay);`


    If you run the code above, you will get


    `Jane Lee`


    `--------------------------`


    `Calculating Pay...`


    `Pay = 4800`


    Finally, let’s create a third object to demonstrate how data validation works
    when we use properties. Add the following lines of code.


    `Staff staff3 = new Staff("Carol");`


    `staff3.HoursWorked = -10;`


    `pay = staff3.CalculatePay();`


    `Console.WriteLine("Pay = {0}", pay);`


    Here, we tried to set the `HoursWorked` property to -10, which is an invalid value.
    The setter of that property sets the value to zero instead. If you run this code,
    you will get


    `Carol`


    `--------------------------`


    `Calculating Pay...`


    `Pay = 0`


    Static Keyword


    We’ve covered some pretty complicated concepts in this chapter. I strongly suggest
    that you download the complete program for this chapter from [http://www.learncodingfast.com/csharp](http://www.learncodingfast.com/csharp)
    and play around with it. Study the code and make sure you fully understand the
    topics covered in this chapter so far before moving on.


    In this section, we’ll look at another keyword that is sometimes used when we
    declare classes or class members (i.e. methods, fields, properties, constructors
    etc).


    Previously, we looked at how we can use the `Staff` class to create our `staff1`,
    `staff2` and `staff3` objects. However, there are some classes or class members
    that can be accessed without the need to create any objects. These are known as
    static classes or class members and are declared using the `static` keyword.


    Consider the following class:


    `1 class MyClass`


    `2 {`


    `3``//Non static members`


    `4``public string message = "Hello World";`


    `5``public string Name { get; set; }`


    `6``public void DisplayName()`


    `7``{`


    `8``Console.WriteLine(“Name = {0}”, Name);`


    `9``}`


    `10`


    `11``//Static members`


    `12``public static string greetings = "Good morning";`


    `13``public static int Age { get; set; }`


    `14``public static void DisplayAge()`


    `15``{`


    `16``Console.WriteLine("Age = {0}", Age);`


    `17``}`


    `18 }`'
