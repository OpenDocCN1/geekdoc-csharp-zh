    `Age must be between 0 and 100`\n\n## 内联 If (Inline If)\n\n内联 `if` 语句是 `if` 语句的一种更简单的形式，如果你想根据条件的结果为变量赋值，它会非常方便。其语法如下：\n\
    \n`条件 ? 条件为真时的值 : 条件为假时的值;` \n\n例如，语句 `3>2 ? 10 : 5;` 返回值 10，因为 3 大于 2（即条件 `3\
