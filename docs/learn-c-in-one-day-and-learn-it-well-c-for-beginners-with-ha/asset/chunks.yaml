    Project – A Simple Payroll Software


    Congratulations!


    We have now completed the core concepts in C#. In this final chapter, we are going
    to get our feet wet by coding a complete console application that generates the
    salary slips of a small company.


    Ready?


    Overview


    First, let’s create a new console application and name it `CSProject`.


    This application consists of six classes as shown below.


    `Staff`


    `Manager : Staff`


    `Admin : Staff`


    `FileReader`


    `PaySlip`


    `Program`


    The `Staff` class contains information about each staff in the company. It also
    contains a virtual method called `CalculatePay()` that calculates the pay of each
    staff.


    The `Manager` and `Admin` classes inherit the `Staff` class and override the `CalculatePay()`
    method.


    The `FileReader` class contains a simple method that reads from a .txt file and
    creates a list of `Staff` objects based on the contents in the .txt file.


    The `PaySlip` class generates the pay slip of each employee in the company. In
    addition, it also generates a summary of the details of staff who worked less
    than 10 hours in a month.


    Finally, the `Program` class contains the `Main()` method which acts as the main
    entry point of our application.


    The Staff Class


    First, let’s start with the `Staff` class. The `Staff` class contains basic information
    about an employee and provides a method for calculating basic pay. It serves as
    a parent class from which two other classes will be derived.


    Fields


    This class has one `private` `float` field called `hourlyRate` and one `private
    int` field called `hWorked`. Try declaring these fields yourself.


    Properties


    Next, declare three `public` auto-implemented properties for the class. The properties
    are `TotalPay`, `BasicPay` and `NameOfStaff`.


    `TotalPay` is a `float` property and has a `protected` setter. `BasicPay` is a
    `float` property and has a `private` setter. `NameOfStaff` is a `string` property
    and has a `private` setter. The getters of all three properties are `public`.
    Hence, you do not need to declare the access modifiers of these getters as they
    have the same access level as the properties.


    In addition to these three auto-implemented methods, the `Staff` class also has
    a `public` property called `HoursWorked`. The backing field for this property
    is the `hWorked` field.


    This property has a getter that simply returns the value of `hWorked`. The setter
    checks if the value set for `HoursWorked` is greater than 0\. If it is, it assigns
    `value` to `hWorked`. If it is not, it assigns 0 to `hWorked`. Try declaring this
    property yourself. You can refer to Chapter 7 for help.


    Constructor


    The `Staff` class has a `public` constructor with two parameters, `name` (`string`)
    and `rate` (`float`). Inside the constructor, we assign the two parameters to
    the property `NameOfStaff` and the field `hourlyRate` respectively. Try coding
    this constructor yourself.


    Method


    Now, let’s write the methods for the class.


    First, we’ll code a virtual method called `CalculatePay()`.


    `CalculatePay()` is `public`, has no parameters and does not return a value. The
    method does three things:


    First, it prints the line “Calculating Pay…” on the screen. Next, it assigns the
    value of `hWorked*hourlyRate` to the `BasicPay` property. Finally, it assigns
    the value of `BasicPay` to the `TotalPay` property. In other words, `BasicPay`
    and `TotalPay` will have the same value. Try coding this method yourself.


    Finally, write a `ToString()` method to display the values of the fields and properties
    of the `Staff` class. That’s all there is to the `Staff` class.


    The table below shows a summary of the `Staff` class.


    Fields


    `private float hourlyRate`


    `private int hWorked` `(backing field for HoursWorked)`


    Properties


    `public float TotalPay`


    `public float BasicPay`


    `public string NameOfStaff`


    `public int HoursWorked`


    Constructor


    `public Staff(string name, float rate)`


    Methods


    `public virtual void CalculatePay()`


    `public override string ToString()`


    The Manager : Staff Class


    Next, let’s move on to code the `Manager` class.


    Fields


    The `Manager` class is a child class of the `Staff` class. It has one `private
    const` field called `managerHourlyRate` that is of `float` type. Try declaring
    this field and initializing it with a value of 50.


    Properties


    `Manager` also has a `public` auto-implemented property called `Allowance`. `Allowance`
    is of `int` type and has a `private` setter. Try coding this property.


    Constructor


    Now, let’s declare the constructor for `Manager`. The `Manager` class has a `public`
    constructor with a `string` parameter, `name`.


    The task of the constructor is to call the base constructor and pass the parameter
    `name` and the field `managerHourlyRate` to the base constructor. Other than that,
    the child constructor does nothing. Hence, there is nothing within the curly braces
    of the child constructor. Try coding this constructor yourself. You can refer
    to the `Manager` class summary below for help if you have problems coding the
    constructor.


    Method


    Next, let’s code a method to override the `CalculatePay()` method in the `Staff`
    class. As `Manager` is derived from `Staff`, it has access to the `BasicPay`,
    `TotalPay` and `HoursWorked` properties declared in the `Staff` class.


    In addition, `Manager` also has its own property – `Allowance`. We’ll be making
    use of these four properties in this method.


    First, let’s declare the method. `CalculatePay()` is `public` and does not return
    any value. We have to use the `override` keyword when declaring this method as
    it overrides the `CalculatePay()` method in the `Staff` class.


    Within the `CalculatePay()` method in the `Manager` class, we shall first call
    the `CalculatePay()` method in the parent class and use it to set the values of
    `BasicPay` and `TotalPay`. To call a virtual method in the parent class, you have
    to use the `base` keyword. Add the following line to your `CalculatePay()` method.


    `base.CalculatePay();`


    This calls the `CalculatePay()` method in the base (parent) class, which sets
    the values of `BasicPay` and `TotalPay`. After setting the values of these two
    properties, let’s go on to set the value of `Allowance`. We’ll set the value to
    1000.'
