    `classA.Name = “Jamie”;`


    `classA.DisplayName();`


    However, to access the static members, we do not need to create any object. We
    simply use the class name to access them as shown below.


    `Console.WriteLine(MyClass.greetings);`


    `MyClass.Age = 39;`


    `MyClass.DisplayAge();`


    If you run the code above, you will get the following output


    `Hello World`


    `Name = Jamie`


    `Good Morning`


    `Age = 39`


    In addition to having static methods, fields, properties and constructors, we
    can also have static classes. A static class can only contain static members.
    An example is shown below.


    `static class MyStaticClass`


    `{`


    `public static int a = 0;`


    `public static int B{get; set;}`


    `}`


    Some of the pre-written classes in C# are declared as static classes. An example
    is the `Console` class. We do not need to create a `Console` object when using
    methods from the `Console` class. We simply write `Console.WriteLine(“Hello World”);`.


    Advanced Method Concepts


    Now that you are familiar with classes, let us move on to some advanced concepts
    regarding the declaration and use of methods in a class. These concepts are more
    complex and may require more than one reading to fully understand them.


    Using Arrays and Lists


    Previously, we learned how to use basic data types like `int` and `float` as parameters
    to a method. In addition to using basic data types, we can also use arrays and
    lists.


    To use an array as a parameter, we add a square bracket [] after the parameter’s
    data type in the method declaration. An example is shown below.


    `public void PrintFirstElement(``int[] a``)`


    `{`


    `Console.WriteLine("The first element is {0}.\n", a[0]);`


    `}`


    To call this method, we need to declare an array and pass it in as an argument
    to the method:


    `int[] myArray = {1, 2, 3, 4, 5};`


    `PrintFirstElement``(``myArray``);`


    The next example shows how we can use a list as a parameter.


    `public void PrintFirstListElement(``List<int> a``)`


    `{`


    `Console.WriteLine(“The first list element is {0}.\n”, a[0]);`


    `}`


    To call the method, we need to declare a list and pass it in as an argument to
    the method.


    `List<int> myList = new List<int> {1, 2, 3};`


    `PrintFirstListElement(``myList``);`


    In addition to using arrays or lists as parameters to a method, we can also return
    an array or list from a method. To return an array from a method, we add a square
    bracket [] after the return type in the method declaration.


    `public` `int[]` `ReturnUserInput()`


    `{`


    `int[] a = new int[3];`


    `for (int i = 0; i < a.Length; i++)`


    `{`


    > `Console.Write("Enter an integer: ");`


    > `a[i] = Convert.ToInt32(Console.ReadLine());`


    > `Console.WriteLine("Integer added to array.\n");`


    `}`


    `return a;`


    `}`


    To use this method, we need to declare an array and assign the method’s result
    to it.


    `int[] myArray2 =` `ReturnUserInput` `();`


    To return a list from a method, we use the `List<>` keyword as the return type
    in the method declaration. An example is


    `public` `List<int>` `ReturnUserInputList()`


    `{`


    `List<int> a = new List<int>();`


    `int input;`


    `for (int i = 0; i < 3; i++)`


    `{`


    > `Console.Write("Enter an integer: ");`


    > `input = Convert.ToInt32(Console.ReadLine());`


    > `Console.WriteLine("Integer added to list.\n");`


    > `a.Add(input);`


    `}`


    `return a;`


    `}`


    To use this method, we need to declare a list and assign the method’s result to
    it.


    `List<int> myList2 =` `ReturnUserInput``List();`


    Using params keyword


    Next, let’s explore the `params` keyword. The `params` keyword is useful when
    we do not know the number of arguments a method has. For instance, we may have
    a method that prints a series of names, but we do not know how many names there
    are in advance. In cases like this, we can use an array as the parameter and add
    the `params` keyword in front of it.


    An example is


    `public void PrintNames(``params string[]` `names)`


    `{`


    `for (int i = 0; i < names.Length; i++)`


    `{`


    > `Console.Write(names[i] + “ “);`


    `}`


    `Console.WriteLine();`


    `}`


    To use this method, we can pass in any number of strings as arguments.


    Example


    `PrintNames(“Peter”);`


    `PrintNames(“Yvonne”, “Jamie”);`


    `PrintNames(“Abigail”, “Betty”, “Carol”, “David”);`


    Output


    `Peter`


    `Yvonne Jamie`


    `Abigail Betty Carol David`


    Note that no additional parameters are permitted after the `params` keyword in
    a method declaration, and only one `params` keyword is permitted in a method declaration.


    Hence, the following method declaration is fine


    `public void PrintNames2(int a, double b, params int[] ages)`


    but the following declarations are not


    `public void PrintNames3(int a, params string[] names, double b)`


    `public void PrintNames4(params string[] names, params int[] ages)`


    `PrintNames3` is not allowed because `double b` comes after `params string[] names`.


    `PrintNames4` is not allowed because there are two `params` keywords.


    Passing Value Type vs Reference Type Parameters


    I hope you now have a good understanding of how classes and methods work. Before
    we end this chapter, I’d like to revisit the concept of value data types and reference
    data types. In Chapter 4, we learnt that there are two main categories of data
    types in C# - value types and reference types. There is a difference when you
    pass in a value type variable to a method vs a reference type variable.


    When you pass in a value type variable, any change made to the value of that variable
    is only valid within the method itself. Once the program exits the method, the
    change is no longer valid.


    On the other hand, if you pass in a reference type variable, any change made to
    the variable is valid even after the method ends.


    Consider the class below:


    `class MethodDemo`


    `{`


    `public void PassByValue(int a)`


    `{`


    > `a = 10;`


    > `Console.WriteLine("a inside method = {0}", a);`


    `}`


    `public void PassByReference(int[] b)`


    `{`


    > `b[0] = 5;`


    > `Console.WriteLine("b[0] inside method = {0}", b[0]);`


    `}`


    `}`


    Within the class, we have two methods. The first method accepts a value type variable
    and tries to change the value of that variable. It then prints the value of the
    variable.


    The second method accepts an array (reference type) and tries to change the value
    of the first element in the array. It then prints the value of that element.


    In our `Main()` program, suppose we have the following lines of code:


    `int a = 2;`


    `int[] b = { 1, 2, 3 };`


    `MethodDemo obj = new MethodDemo();`


    `Console.WriteLine("a before = {0}", a);`


    `obj.PassByValue(a);`


    `Console.WriteLine("a after = {0}", a);`


    `Console.WriteLine("\n\n");`


    `Console.WriteLine("b[0] before = {0}", b[0]);`


    `obj.PassByReference(b);`


    `Console.WriteLine("b[0] after = {0}", b[0]);`


    If you run the program, you will get


    `a before = 2`


    `a inside method = 10`


    `a after = 2`


    `b[0] before = 1`


    `b[0] inside method = 5`


    `b[0] after = 5`


    The value of `a` stays the same before and after the method call; the change is
    only valid inside the method itself.


    On the other hand, the value of `b[0]` changes after the method call.


    Be aware of this difference when you pass in a value type variable to a method
    (e.g. `int`, `float` etc) vs a reference type variable (such as an array or list).


    ## Chapter 8: Object-Oriented Programming Part 2


    Now, let us move on to some of the more advanced topics in object-oriented programming.
    In this chapter, we’ll learn about inheritance, polymorphism, abstract classes
    and interfaces.


    Inheritance'
