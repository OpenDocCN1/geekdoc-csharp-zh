    2 string names = “Peter, John; Andy, , David”;

    3 string [] substrings = names.Split(separator, StringSplitOptions.None);

    ```


    On Line 1, we first declare an array of two strings to act as separators. The
    first string is a comma followed by a space and the second is a semi-colon followed
    by a space.


    On Line 2, we assign the string that we want to split to the `names` variable.
    On Line 3, we use the `names` variable to call the `Split()` method and assign
    its result to the `substrings` array.


    The result of the code above is the following array


    ```cs

    {“Peter”, “John”, “Andy”, “” , “David”}

    ```


    This array contains an empty string as there is a space between the comma after
    “Andy” and the comma before “David” in the original string. If you want to remove
    the empty string from the result, you have to change Line 3 to


    ```cs

    string [] substrings = names.Split(separator, StringSplitOptions.RemoveEmptyEntries);

    ```


    The `substrings` array thus becomes


    ```cs

    {“Peter”, “John”, “Andy”, “David”}

    ```


