    \ i < myStaff.Count; i++)\n{\n    try\n    {\n    }\n    catch (Exception e)\n\
    \    {\n    }\n}\n```\n\n在 `for` 循环内部，我们使用 `try catch` 语句。在 `try` 块中，我们执行以下操作：\n\
    \n首先，提示用户输入每位员工的工作小时数。提示信息的示例为：\n\n`Enter hours worked for Yvonne:`\n\n其中“Yvonne”是员工的名字。你需要通过编写\
    \ `myStaff[i].NameOfStaff` 来访问每位员工的 `NameOfStaff` 属性。\n\n接下来，读取输入，尝试将其转换为整数，并赋值给\
    \ `Staff` 对象的 `HoursWorked` 属性。\n\n之后，我们调用 `Staff` 对象的 `CalculatePay()` 方法来计算该员工的工资。\n\
    \n最后，我们使用 `ToString()` 方法获取 `Staff` 对象的信息，并使用 `Console.WriteLine()` 方法将这些信息显示在屏幕上。\n\
    \n尝试自己编写这个 `try` 块。\n\n接下来在 `catch` 块中，我们尝试捕获可能发生的任何错误。在这个 `catch` 块中，我们只需显示错误消息并将\
    \ `i` 的值减一（`i--;`），这样 `for` 循环就会针对当前的 `Staff` 对象再次迭代，而不是移动到 `myStaff` 中的下一个元素。\n\
    \n尝试自己编写这个 `catch` 块。\n\n这样，`for` 循环结束了。我们现在准备好为每位员工生成工资单了。为了做到这一点，我们需要首先声明并实例化\
    \ `PaySlip` 对象。我们将该对象命名为 `ps`。在实例化对象时，我们将变量 `month` 和 `year` 传递给构造函数。\n\n接下来，我们使用\
    \ `ps` 对象调用 `GeneratePaySlip()` 和 `GenerateSummary()` 方法，并将 `myStaff` 作为参数传递。最后，我们添加\
    \ `Console.Read();` 语句防止控制台在程序结束后立即关闭。\n\n### 完成了吗？\n\n如果你成功编写了 `Main()` 程序，请为自己拍拍掌。你刚刚用\
    \ C# 编写了一个完整的程序！非常好！\n\n如果你在编写过程中遇到问题，请继续尝试。你可以参考附录 A 中的建议解决方案作为参考。\n\n一旦你完成了\
    \ `Main()` 方法的编写，就可以运行你的程序了。兴奋吗？让我们开始吧！\n\n点击“Start”按钮运行程序并输入请求的值。生成的工资单可以在与 `.exe`\
    \ 文件相同的文件夹中找到，该文件夹位于 `CSProject > CSProject > Bin > Debug`。尝试制造一些错误，输入字母而不是数字。玩一玩这个程序，看看它是如何运行的。一切都符合预期吗？如果是的话，太棒了！你做得非常出色！尝试思考改进软件的方法。例如，你可以包含更多的检查，以确保用户为\
    \ `year` 和 `HoursWorked` 输入了正确的值。\n\n如果你的代码无法运行，请将其与示例答案进行对比，并找出哪里出了问题。通过分析错误，你会学到很多。解决问题正是乐趣所在，也是回报最高的地方。享受其中并永远不要放弃！示例答案可以在附录\
