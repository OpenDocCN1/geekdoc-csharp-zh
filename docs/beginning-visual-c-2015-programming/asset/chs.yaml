  \      Diamond,\n      Heart,\n      Spade,\n   }\n}\n```\n\n你可以在 `Ch10CardLib 文件夹/Rank.cs`\
  \ 中找到此示例的完整代码：\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nnamespace Ch10CardLib\n{\n   public enum Rank\n   {\n      Ace\
  \ = 1,\n      Deuce,\n      Three,\n      Four,\n      Five,\n      Six,\n     \
