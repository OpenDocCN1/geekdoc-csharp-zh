  \n如果你决定自己创建此项目，请添加名为 `Cards` 的新类并按如下方式修改 `Cards.cs` 中的代码：\n\n```\nusing System;\n\
  using System.Collections;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\nnamespace Ch11CardLib\n{\n  \
