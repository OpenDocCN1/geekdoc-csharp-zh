  \ to this Forum”图标。\n\n\n\n\n\n它从对 `.NET Framework` 的通用讨论开始。这项技术包含许多最初难以掌握的概念。这意味着由于需要，讨论在很短的空间内涵盖了许多概念。然而，快速了解基础知识对于理解如何使用\
  \ `C#` 编程至关重要。在书的后面，你将再次访问这里涵盖的许多主题，并对其进行更详细的探索。\n\n在介绍介绍之后，本章对 `C#` 本身进行了基础描述，包括它的起源以及与\
  \ `C++` 的相似之处。最后，你将查看本书书中使用的主要工具：`Visual Studio 2015` (`VS`)。`Visual Studio 2015`\
  \ 是微软产的一系列开发环境中的最新版本，它包含了各种功能（包括对 Windows Store 程序的完整支持），你将在整本书中学习到这些功能。\n\n## 什么是\
  \ .NET Framework？\n\n`.NET Framework`（目前版本为 `4.6`）是微软为开发应用程序创建的一个革命性平台。这段陈述中最有趣的地方在于它是如此模糊——但对此有充分的理由。首先，请注意，它并不是“在\
  \ Windows 操作系统上开发应用程序”。虽然微软发布的 `.NET Framework` 运行在 Windows 和 Windows Phone 操作系统上，但可以在其他系统上运行的替代版本。其中的例子是\
  \ `Mono`，它是 `.NET Framework` 的开源版本（包含一个 `C#` 编译器），运行在多个操作系统上，包括各种版本的 Linux 和 Mac\
  \ OS；你可以在 [`http://www.mono-project.com`](http://www.mono-project.com) 查到更多关于它的信息。还有\
  \ `Mono` 的变体运行在 iPhone (`MonoTouch`) 和安卓 (`Mono for Android`，又名 `MonoDroid`) 手机上。`.NET\
  \ Framework` 的核心动力之一是它被意图用作整合异构操作系统的手段。\n\n此外，上述对 `.NET Framework` 的定义对可能生成的应用程序类型没有限制。这是因为没有限制——`.NET\
  \ Framework` 允许创建桌面应用程序、Windows Store 应用程序、云/Web 应用程序、Web API 以及你所想象的几乎任何其他。此外，对于\
  \ Web、云和 Web API 应用程序，值得注意的是，根据定义这些都是多平台应用程序，因为任何带有网络浏览器的系统都可以访问它们。\n\n`.NET Framework`\
  \ 的设计使其可以在任何语言中使用，包括 `C#`（本书的主题）以及 `C++`、`Visual Basic`、`JScript`，甚至像 `COBOL` 这样较老的语言。为了实现这一点，这些语言的特定\
  \ `.NET` 版本也出现了，并且不断发布。有关语言列表，请访问此站点 [`msdn.microsoft.com/library/aa292164.aspx`](https://msdn.microsoft.com/library/aa292164.aspx)。所有语言不仅可以访问\
  \ `.NET Framework`，而且还可以相互通信。`C#` 开发者可以利用 `Visual Basic` 程序员编写的代码，反之亦然。\n\n这一切提供了极高的灵活性，这也是为什么使用\
  \ `.NET Framework` 具有如此巨大吸引力的原因之一。\n\n## .NET Framework 包含什么？\n\n`.NET Framework`\
  \ 主要由一个巨大的代码库组成，你使用面向对象编程 (OOP) 技术从你的客户端语言（如 `C#`）调用该库。该库被分为不同的模块——你根据想要实现的结果使用它的部分。例如，一个模块包含\
  \ Windows 应用程序的构建块，另一个用于网络编程，另一个用于 Web 开发。某些模块被划分为更具体的子模块，例如在 Web 开发模块中有一个用于构建 Web\
  \ 服务的模块。\n\n其意图是让不同的操作系统根据其特性支持这些模块的部分或全部。例如，智能手机包含了对所有核心 .NET 功能的支持，但可能不需要某些较冷门的模块。\n\
  \n`.NET Framework` 库的一部分定义了一些基础 `类型` (`types`)。类型是数据的表示，指定其中一些最基础的类型（例如“一个 32 位符号整数”）有助于使用\
  \ `.NET Framework` 的语言之间的互操作性。这被称为`通用类型系统` (`CTS`)。\n\n除了提供此库外，`.Net Framework`\
  \ 还包含了 `.NET 通用语言运行时` (`CLR`)，它负责执行所有使用 [`the.NET`](http://the.NET) 库开发的所有应用程序。\n\
  \n## 使用 .NET Framework 编写应用程序\n\n使用 `.NET Framework` 编写应用程序意味着使用 .NET 代码库（使用支持该框架的任何语言）编写代码。在本书中，你使用\
  \ `Visual Studio` 进行开发。`Visual Studio` 是一个强大的集成开发环境，支持 `C#`（以及托管和非托管的 `C++`、`Visual\
  \ Basic` 以及其他语言）。该环境的优势在于可以将 .NET 特性轻松集成到你的代码中。你创建的代码将完全是 `C#`，但贯穿使用 `.NET Framework`，你将在需要时利用\
  \ `Visual Studio` 中的额外工具。\n\n为了让 `C#` 代码执行，它必须转换为目标操作系统理解的语言，称为`原生代码` (`native code`)。这种转换被称为`编译`代码，该操作由`编译器`\
  \ (`compiler`) 执行。在 `.NET Framework` 下，这是一个阶段的过程。\n\n### CIL 和 JIT\n\n当你编译使用 `.NET\
  \ Framework` 库的代码时，你不会立即创建特定操作系统的原生代码。相反，你将代码编译为`中间语言` (`CIL`)。这种代码不特定于任何操作系统 (OS)，也不特定于\
  \ `C#`。其他 .NET 语言（例如 `Visual Basic .NET`）也作为第一阶段编译到这种语言。这一编译步骤是在开发 `C#` 应用时完成。\n\
  \n显然，执行应用程序还需要更多工作。那是`即时编译` (`JIT`) 编译器的工作，它将 `CIL` 编译为特定于 OS 和机器架构的原生代码。只有在此时，操作系统才能执行应用程序。名称中的“即时”部分反映了\
  \ `CIL` 代码仅在需要时才被编译的事实。这种编译可以在应用程序运行时动态进行，尽管幸运的是，这通常不是开发者需要担心的事情。\n\n过去，通常需要将代码编译成多个应用程序，每个程序针对特定的操作系统和\
  \ CPU 架构。通常，这是一种优化（例如让代码在 AMD 芯片上运行得更快），但有时它是至关重要的（例如让应用程序在 Win9x 和 WinNT/2000 环境中运行）。现在这已不再必要，因为\
  \ JIT 编译器（如其名所示）使用 `CIL` 代码，这种代码独立于机器、操作系统和 CPU。存在多个 JIT 编译器，每个针对不同的架构，`CLR` 使用适当的一个来创建所需的原生代码。\n\
  \n这一切的奇之处在于它为你减少了大量方面的工作——事实上，你可以忘记与系统相关的细节，专注于代码中更有趣的功能。\n\n### 程序集\n\n\n\n\n\n\
  当你编译应用程序时，CIL 代码被存储在 `assembly`（程序集）中。程序集包含了可以直接在 Windows 中运行而无需任何其他程序的可执行应用程序文件（这些文件具有\
  \ `.exe` 扩展名）以及供其他应用程序使用的库（具有 `.dll` 扩展名）。\n\n除了包含 CIL，程序集还包含 `meta` 信息（即关于程序集所包含信息的信息，也称为\
  \ `metadata` 元数据）和可选的 `resources` 资源（CIL 使用的额外数据，如声音文件和图片）。元信息使得程序集能够完全自描述。你使用程序集时不需要其他信息，这意味着你避免了诸诸如未能向系统注册表中添加所需数据等情况，这在使用其他平台开发时通常是一个问题。\n\
  \n这意味着部署应用程序通常只需要将文件复制到远程计算机的目录中即可。因为目标系统不需要额外信息，你只需要运行该目录下的可执行文件，并且（假设已安装了 `.NET\
  \ CLR`）就可以开始工作了。\n\n当然，你并不一定想将运行应用程序所需的所有内容都放在一个地方。你可能会编写一些执行多个应用程序所需任务的代码。在这种情况下，将可重用的代码放置在所有应用程序都可以访问的地方通常很有用。在\
  \ .NET Framework 中，这就是 `global assembly cache`（GAC，全局程序集缓存）。将代码放入 GAC 非常简单——你只需包含代码的程序集放在包含此缓存的目录中。\n\
  \n### 托管代码\n\n在你将代码编译为 CIL 并且 `JIT compiler` 将其编译为原生代码之后，`CLR` 的作用并没有结束。使用 .NET\
  \ Framework 编写的代码在执行时（通常称为 `runtime` 运行时阶段）是 `managed`（托管）的。这意味着 `CLR` 通过管理内存、处理安全、允许跨语言调试等来维护你的应用程序。相比之下，不不在\
  \ `CLR` 控制下运行的应用程序被称为 `unmanaged`（非托管的），某些语言（如 `C++`）可以编写此类应用程序，例如，这些程序可以访问操作系统的底层函数。然而，在\
  \ `C#` 中，你只能编写运行在托管环境中的代码。你将利用 `CLR` 的托管功能，并允许 `.NET` 本身处理与操作系统的任何交互。\n\n### 垃圾收回\n\
  \n托管代码最重要的功能之一是 `garbage collection`（垃圾收回）概念。这是 .NET 的一种方法，确保在应用程序不再使用时完全释放应用程序所占用的内存。在\
  \ .NET 之前，这很大程度上是程序员的责任，代码中的几个简单错误就会导致大块内存由于分配到内存中的错误位置而神秘地消失。这通常意味着你的计算机运行逐渐变慢，然后发生系统崩溃。\n\
  \n`.NET` 垃圾收回的工作原理是定期检查你的计算机内存，并移除其中不再需要的任何内容。这没有固定的时间范围；它可能每秒发生数千次，每几秒发生一次，或者随时发生，但你可以放心它一定会发生。\n\
  \n这对程序员来说这里有一些影响。因为这项工作是在不可预测的时间为你完成的，所以应用程序的设计必须考虑到这一点。需要大量 `memory`（内存）来运行的代码应该自己清理，而不是等待垃圾收回的发生，但这听起来并没有那么复杂。\n\
  \n### 整合在一起\n\n在继续之前，让我们总结一下之前讨论过的创建 .NET 应用程序所需的步骤：\n\n1. 使用 .NET 兼容的语言编写应用程序代码，例如\
  \ `C#`（参见图 1.1）。![使用 .NET 兼容语言的 C# 应用程序代码示意图](img/c01f001.jpg)\n   **图 1.1\n\n2.\
  \ 该代码被编译为 CIL，存储在程序集中（参见图 1.2）。![带有标记为“Compilation”的右箭头指向程序集的 C# 应用程序代码示意图](img/c01f002.jpg)\n\
  \   **图 1.2\n\n3. 当执行代码代码（如果是可执行文件则独立运行，当从其他代码中调用时），它必须首先使用 `JIT compiler` 编译为原生代码（参见图\
  \ 1.3）。![带有标记为“JIT Compilation”的右箭头指向原生代码的程序集示意图](img/c01f003.jpg)\n   **图 1.3\n\
  \n4. 原生代码在托管 `CLR` 的环境中执行，与其他任何正在运行的应用程序或进程一起，如图 1.4 所示。\n   ![显示 .NET CLR 下三个原生代码的系统运行时示意图](img/c01f004.jpg)\n\
  \   **图 1.4\n\n### 链接\n\n关于此过程，注意另一点。在第 2 步中编译为 CIL 的 `C#` 代码不需要包含在单个文件中。可以将应用程序代码拆分到多个文件中，然后将它们编译成程序集。这种非常有用的过程被称为\
  \ `linking`（链接）。这是必要的，因为处理几个小文件比处理一个巨大的文件要容易得多，这让开发团队可以将编程负担分解成可管理的区块。\n\n## 什么是\
  \ C#？\n\n如前所述，`C#` 是你可以用来创建运行在 `CLR` 中的应用程序的语言之一。它是 `C` 和 `C++` 语言的演进，由微软专门为了与 .NET\
  \ 平台协作而创建。\n\n使用 `C#` 开发应用程序比使用 `C++` 更简单，因为语言语法更简单。尽管如此，`C#` 是一种强大的语言，你可能在 `C++`\
  \ 中想做的几乎没有什么做不到的。作为一种 `typesafe`（类型安全）语言，在类型之间转换时必须遵守严格规则，这意味着为了执行相同的任务，你通常在 `C#`\
  \ 中需要比 `C++` 写更多代码。然而，这样做有好处——代码更健壮，调试更简单，并且 `.NET` 始终可以跟踪任何数据的类型。\n\n\n\n\nC# 只是\
  \ .NET 开发的可用语言之一，但它无疑是最好的。它的优势是唯一一种从底层开始为 .NET Framework 设计的语言，并且是移植到其他操作系统的 .NET\
  \ 版本中使用的主要语言。为了让像 .NET 版 Visual Basic 这样的语言与其前身尽可能相似，同时兼容 `CLR`，.NET 代码库的某些功能没有被完全支持，或者至少需要不寻常的语法。\n\
  \n相比之下，C# 可以利用 .NET Framework 代码库提供的每一个功能。此外，.NET 的每个新版本都包含了 C# 语言的扩展，这部分是为了响应开发者的需求，使其更加强大。\n\
  \n### 你可以用 C# 编写的应用程序\n\n如前所述，.NET Framework 对可能的应用程序类型没有限制。C# 使用该框架，因此对可能的应用程序也没有限制。然而，这里有几种较为常见的应用程序类型：\n\
  \n*   **桌面应用程序** — 诸如 Microsoft Office 等，具有熟悉 Windows 视觉和感受的应用程序。通过使用 .NET Framework\
  \ 的 Windows Presentation Foundation (`WPF`) 模块，这变得非常简单，该模块是一个由 `controls`（如按钮、工具栏、菜单等）组成的库，你可以用它构建\
  \ Windows 用户界面 (UI)。\n\n*   **Windows 商店应用程序** — Windows 8 引入了一种新类型的应用程序，称为 Windows\
  \ 商店应用程序。这类应用程序主要为触摸设备设计，通常全屏运行，杂乱最少，并强调简单。你可以通过多种方式创建这些应用程序，包括使用 `WPF`。\n\n*  \
  \ **云/Web 应用程序** — .NET Framework 包含一个名为 `ASP.NET` 的强大系统，用于动态生成 Web 内容，实现个性化、安全等许多功能。此外，这些应用程序可以在云端托管和访问，例如在\
  \ Microsoft Azure 平台上。\n\n*   **Web APIs** — 构建 RESTful HTTP 服务的理想框架，支持广泛的客户端，包括移动设备和浏览器。\n\
  \n*   **WCF 服务** — 创建多功能分布式应用程序的方法。使用 `WCF`，你可以在本地网络或 Internet 上交换任何数据，无论使用什么创建服务的语言或其所处的系统，都使用相同的简单语法。\n\
  \n这些类型中的任何一种可能都需要某些形式的数据库访问，这可以通过 .NET Framework 的 [`ADO.NET`](http://ADO.NET)（活动数据对象\
  \ .NET）部分、通过 [`ADO.NET`](http://ADO.NET) Entity Framework 或 C# 的 `LINQ`（集成语言查询）能力来实现。还可以利用许多其他资源，例如创建网络组件的工具、输出图形、执行复杂的数学任务的工具等。\n\
  \n### 本书中的 C#\n\n本书的第一部分处理 C# 语言的语法和用法，不过分强调 .NET Framework。这是必要的，因为如果你在 C# 编程方面没有坚实的基础，就完全无法使用\
  \ .NET Framework。事实上，你将从更简单的地方开始，并在涵盖基础知识之后，再讨论更复杂的 `OOP` 主题。这些内容将从原理开始教授，假设读者完全没有编程知识。\n\
  \n之后，你就准备好开发更复杂（更有用）的应用程序了。第二部分处理基于云的 Web 应用程序编程，第三部分研究数据访问（用于 ORM 数据库概念、文件系统和 XML\
  \ 数据）以及 `LINQ`。本书的第四部分介绍桌面和 Windows 商店应用程序编程。\n\n## Visual Studio 2015\n\n在书中，你使用\
  \ Visual Studio 2015 开发工具进行所有的 C# 编程，从简单的命令行应用程序到更复杂的项目类型。开发工具或集成开发环境 (`IDE`)（如\
  \ Visual Studio）并不是开发 C# 应用程序所必需的，但它让事情变得简单得多。你可以（如果你愿意的话）在基础文本编辑器（如随处可见记事本应用程序）中操作\
  \ C# 源代码文件，并使用 .NET Framework 部分的命令行编译器将代码编译为程序集。然而，既然你有 `IDE` 的力量来帮助你，何必这么做呢？\n\
  \n### Visual Studio Express 2015 产品\n\n除了 Visual Studio 2015 之外，微软还提供了几种更简单的开发工具，称为\
  \ Visual Studio Express 或 Community 2015 产品。这些工具可以在 `https://www.visualstudio.com/en-us/downloads/download-visual-studio-vs`\
  \ 免费获取。\n\n### 各种 Express 产品让你能够创建可能需要的几乎任何 C# 应用程序。它们作为 Visual Studio 的精简版运行，并保留了相同的视觉和感受。虽然它们提供了与\
  \ Visual Studio 许多相同的功能，但缺少了一些显著功能，尽管并不多到阻碍你使用这些工具来完成本书的章节。\n\n### 解决方案\n\n当你使用\
  \ Visual Studio 开发应用程序时，你是通过创建 `solutions`（解决方案）来实现的。在 Visual Studio 术语中，解决方案不仅仅是一个应用程序。解决方案包含\
  \ `projects`（项目），这些可能是 `WPF` 项目、云/Web 应用程序项目等。因为解决方案可以包含多个项目，你可以将相关的代码组合在一起，即使它们最终会编译到硬盘上不同位置的多个程序集。\n\
  \n这非常有用，因为它允许你在开发使用该代码的应用程序的同时处理共享代码（可能放置在 `GAC` 中）。当只使用一个开发环境时，调试代码要容易得多，因为你可以在多个代码中单步执行指令。\n\
  \n\n\n\n既然你已经花了一些时间学习了 `C#` 是什么以及它是如何融入 `.NET Framework` 的，现在是时候大干身手写一些代码了。在本书中你将一直使用\
  \ `Visual Studio 2015` (`VS`)，因此首先要点的是查看该开发环境的一些基础知识。\n\nVisual Studio 是一个庞大且复杂的产品，对于初学者来说可能望而生畏，但使用它来创建基础应用程序可以出奇地简单。当你在本章开始使用\
  \ `Visual Studio` 时，你会发现你不需要对它非常了解就可以开始编写 `C#` 代码。在书的后后部分，你将看到 Visual Studio 可以执行的一些更复杂的操作，但目前，只需要基础的操作知识就足够了。\n\
  \n在查看 IDE 之后，你将整合两个简单的应用程序。目前你不需要太担心这些程序中的代码；你只需要证明它们可以正常运行。通过学习这些早期示例中的应用程序创建流程，这些操作很快就会变成你的本能。\n\
  \n你将在本章中学习如何创建两种基本的应用程序：`console application`（控制台应用程序）和 `desktop application`（桌面应用程序）。\n\
  \n你创建的第一个应用程序是一个简单的 `console application`。控制台应用程序不使用图形窗口环境，所以你不需要担心按钮、菜单、与鼠标指针的交互等问题。相反，你在命令提示符窗口中运行应用程序，并以更简单的方式与它交互。\n\
  \n第二个应用程序是 `desktop application`，你使用 `Windows Presentation Foundation` (`WPF`) 创建它。桌面应用程序的外观和感受对\
  \ Windows 用户来说非常熟悉，而且（令人惊讶的是）创建它并不需要花费更多精力。然而，所需的代码语法要更复杂，尽管在许多情况下你实际上并不需要担心细节。\n\
  \n你将在本书的 `Part III` 和 `Part IV` 中使用这两种类型的应用程序，并在开始时更侧重于控制台应用程序。在学习 `C#` 语言时，桌面应用程序额外的灵活性并不是必须的，而控制台应用程序的简单性让你能够专注于学习语法，而无需担心应用程序的外观和感受。\n\
  \n## Visual Studio 2015 开发环境\n\n当首次加载 `Visual Studio` 时，它会立即向你提供使用 `Microsoft Account`\
  \ 登录 Visual Studio 的选项。通过这样做，你的 Visual Studio 设置将在设备之间同步，这样你在多个工作站上使用它时就无需配置 IDE\
  \ 了。如果你没有 `Microsoft Account`，请按照创建流程建立一个，然后使用它登录。如果你不想登录，点击“Not now, maybe later”链接，并继续\
  \ `Visual Studio` 的初始配置。在某个时刻，建议你登录并获取开发者许可证。\n\n如果这是你第一次运行 `Visual Studio`，你将看到一组针对具有该开发环境以前版本经验的用户的偏好列表。你在此处做出的选择会影响许多事情，例如窗口布局、控制窗口的运行方式等。因此，请从下拉菜单中选择\
  \ `Visual C# Development Settings`；否则，你可能会发现某些运行与书中描述的不符。请注意，可用选项取决于你安装 `Visual\
  \ Studio` 时选择的选项，但只要你选择了安装 `C#`，此选项就是可用的。\n\n如果这不是你第一次运行 `Visual Studio`，但你第一次选择了不同的选项，请不要慌。要将设置重置为\
  \ `Visual C# Development` 设置，你只需要导入它们。要执行此操作，选择 `Tools` ![1](img/arrow.png) `Import\
  \ and Export Settings`，并选择 图 2.1 所示的 `Reset All Settings` 选项。\n\n![导入和导出设置向导对话框截图，显示了选中的\
  \ Reset 设置选项以及底部 Next 和 Cancel 按钮。](img/c02f001.jpg)\n\n**图 2.1\n\n点击 `Next`，并指示在继续之前是否要保存现有的设置。如果你自定义了某些内容，你可能想这样做；否则，选择\
  \ `No` 并再次点击 `Next`。从下一个对话框中，选择图 2.2 所示的 `Visual C#`。同样，可用的选项可能会有所不同。\n\n![导入和导出设置向导对话框，显示了设置集合，左侧选了\
  \ Visual C#，右侧是其描述。底部显示了 Previous 和 Finish 按钮。](img/c02f002.jpg)\n\n**图 2.2\n\n\
  最后，点击 `Finish`，然后点击 `Close` 以应用设置。\n\nVisual Studio 环境布局是完全可以自定义的，但此处使用默认设置即可。选中\
  \ `C# Developer Settings` 后，其布局如图 2.3 所示。\n\n![Microsoft Visual Studio 2015 窗口截图，显示左侧的\
  \ Toolbox 和 Start 页，右侧的 Solution Explorer 窗口和 Team explorer 标签。](img/c02f003.jpg)\n\
  \n**图 2.3\n\n主窗口在 `Visual Studio` 启动时默认显示 `Start Page`，它是显示所有代码的地方。此窗口可以包含许多文档，每个文档由一个标签标识，因此你可以轻松地切换文件。它还有其他功能：它可以显示你为项目设计的\
  \ GUI、纯文本文件以及内置 Visual Studio 的各种工具。你将在学习过程中遇到所有这些。\n\n主窗口上方是工具栏和 Visual Studio\
  \ 菜单。可以放置若干工具栏，功能涵盖从保存和加载文件到生成和运行项目以及调试控制。再次，你将在需要使用时被介绍这些内容。\n\n以下是你最常使用的每个主要功能的简要描述：\n\
  \n- Toolbox 窗口在你点击其标签时弹出。它提供了（等）桌面应用程序的用户界面构建块。另一个标签 Server Explorer 也可以在这里（通过 `View\
  \ ![1](img/arrow.png)`Server Explorer` 菜单选项），并包含了各种附加功能，例如 Azure 订阅详细，访问数据源、服务器设置和服务等。\n\
  \n- Solution Explorer 窗口显示当前加载的*solution*（解决方案）的信息。正如你在上一章中学到的，解决方案是 Visual Studio\
  \ 的术语，指一个或多个项目及其配置。Solution Explorer 窗口显示解决方案项目的各种视图，例如它们包含哪些文件以及文件中包含的内容。\n\n-\
  \ Team Explorer 窗口显示当前 Team Foundation Server 或 Team Foundation 服务连接。这允许你访问源码控制、缺陷跟踪、构建自动化和其他功能。然而，这是一个高级主题，本书未涉及。\n\
  \n- 在 Solution Explorer 窗口下方，你可以显示 Properties 窗口，它未在图 2.3 中显示，因为它只在你处理项目时出现（你也可以通过\
  \ `View ![1](img/arrow.png)`Properties Window` 切换其显示）。此窗口提供了项目内容的更详细视图，允许你对单个元素进行额外的配置。例如，你可以使用此窗口更改桌面应用程序中按钮的外观。\n\
  \n\n\n\n\n* 此外，截图中没有显示另一个重要的窗口：错误列表（Error List）窗口，你可以通过`View ![1](img/arrow.png)Error\
  \ List` 显示它。它显示了错误、警告和其他项目相关信息。该窗口会持续更新，尽管某些信息只在编译项目时才会出现。\n\n这看起来有很多内容需要吸收，但很快就能上手。你将从构建第一个示例项目开始，这涉及到许多描述过的\
  \ Visual Studio 元素。\n\n## 控制台应用程序\n\n在书中你会经常使用控制台应用程序，特别是在开始阶段，因此接下来的“试一试”（Try It\
  \ Out）提供了创建一个简单控制台程序的的分步指南。\n\n### 解决方案\n\n默认情况下，解决方案（Solution Explorer）窗口停靠在屏幕的右上角。与其他窗口一样，你可以将其移动到任何喜欢的地方，也可以点击大针图标将其设置为自动隐藏。解决方案窗口与另一个名为类视图（Class\
  \ View）的实用窗口共享空间，你可以通过`View ![1](img/arrow.png) Class View` 显示它。图 2.7 显示了这两个窗口，并且所有节点都已展开（当窗口停靠时，可以通过点击窗口底部的标签在它们之间切换）。\n\
  \n![解决方案窗口（左侧）和类视图窗口（右侧）的截图，所有节点已展开。](img/c02f007.jpg)\n\n图 2.7\n\n此解决方案视图显示了组成\
  \ `ConsoleApplication1` 项目的文件。你添加代码的文件 `Program.cs` 与另一个代码文件 `AssemblyInfo.cs` 以及几个引用一起显示。\n\
  \n目前你不需要担心 `AssemblyInfo.cs` 文件。它包含了关于你项目的额外信息，这些信息目前对你来说并不重要。\n\n你可以通过双击 `.cs`\
  \ 文件来更改主窗口中显示的代码；通过右键点击文件并选择“查看代码”（View Code）；或者通过选择它们并点击窗口顶部出现的工具栏按钮来更改主窗口中显示的代码。你还可以在这里对文件执行其他操作，例如重命名或从项目中删除它们。其他文件类型也可能出现在这里，例如项目资源（资源是项目使用的文件，可能不是\
  \ C# 文件，例如位图图像和声音文件）。同样，你可以通过相同的界面对它们进行操作。\n\n你还可以展开 `Program.cs` 等代码项以查看其内容。这种对代码结构的概述是一个非常有用的工具；它还能让你直接导航到代码文件的特定部分，而无需打开代码文件并滚动到你想要的部分。\n\
  \n`References`（引用）条目包含你在项目中使用的 .NET 库列表。你稍后会查看此处；目前标准引用足够了。类视图通过显示你创建的代码结构提供了项目的另一种视图。你将在书的稍后部分回到这里这里；目前解决方案的显示是合适的。当你点击这些窗口中的文件或其他图标时，注意属性窗口（显示在图\
  \ 2.8 中）的内容发生了变化。\n\n![显示项目中选中的 Program.cs 文件的属性窗口截图。](img/c02f008.jpg)\n\n图 2.8\n\
  \n### 属性窗口\n\n属性窗口（如果尚未显示，请选择 `View ![1](img/arrow.png) Properties Window`）显示了对上方窗口中选中的任何内容的附加信息。例如，当选择项目中的\
  \ `Program.cs` 文件时，会显示图 2.8 所示视图。此窗口还显示有关其他所选项目的信息，例如用户界面组件（如本章“桌面应用程序”部分所示）。\n\n\
  通常，你在属性窗口条目中进行的更改直接影响你的代码，添加代码行或更改文件中的内容。对于某些项目，你通过此窗口进行操作花费的时间与手动修改代码一样多。\n\n###\
  \ 错误列表窗口\n\n目前，错误列表窗口（`View ![1](img/arrow.png) Error List`）没有显示任何有趣的内容，因为应用程序没有错误。然而，这确实是一个非常有用的窗口。作为一个测试，从你在上一节中添加的代码行中删除分号。过了一会儿，你应该看到类似图\
  \ 2.9 所示的显示。\n\n![错误列表窗口截图，显示错误、警告和消息的标签，以及 CS1002 代码错误，描述为 ConsoleApplication1\
  \ 项目和 Program.cs 文件。](img/c02f009.jpg)\n\n图 2.9\n\n此外，项目将不再编译。\n\n此窗口帮助你消除代码中的错误，因为它跟踪了编译项目时需要执行的操作。如果你双击此处显示的错误，光标将跳转到源代码中的错误位置（如果包含错误的源文件尚未打开，则会打开它），这样你可以快速修复它。代码中的错误位置会出现红色波浪线，因此你可以快速扫描代码查看问题所在。Visual\
  \ Studio 默认不显示行号，但这是非常值得开启的。要这样做，在选项框（通过 `Tools ![1](img/arrow.png) Options` 菜单选择）中勾选行号复选框。它出现在文本编辑器（Text\
  \ Editor）通用（General）类别下。你还可以通过对话框中的特定语言页面来更改此设置。对话框中还可以找到许多其他选项，你稍后会使用其中一些。\n\n\
  ## 桌面应用程序\n\n通过桌面应用程序运行代码通常比通过控制台窗口或命令行提示更容易。你可以使用用户界面构建块来拼接到用户界面。接下来的“试一试”仅显示了基础知识，你将看到如何在没有大量细节的情况下启动桌面应用程序。你在这里将使用\
  \ WPF，它是微软创建桌面应用程序的推荐技术。之后，你将详细查看桌面应用程序并更多了解 WPF 是什么以及它可以做什么。\n\n## ![image](img/c02g003.jpg)\
  \ 本章学习内容\n\n| **主题** | **关键概念** |\n| :--- | :--- |\n| Visual Studio 2015 设置 | 本书需要\
  \ C# 开发设置，你在首次运行 Visual Studio 或重置设置时选择该选项。 |\n| 控制台应用程序 | 控制台应用程序是简单的命令行应用程序，在书中大部分用于说明技术。在\
  \ Visual Studio 创建新项目时使用控制台应用程序模板创建新的控制台应用程序。要调试模式运行项目，使用 `Debug ![1](img/arrow.png)Start\
  \ Debugging` 菜单项，或按 F5。 |\n| IDE 窗口 | 项目内容显示在解决方案窗口。属性显示在属性窗口中。错误显示在错误列表中。 |\n|\
  \ 桌面应用程序 | 桌面应用程序具有标准 Windows 应用程序的外观和感受，包括熟悉的最大化、最小化和关闭应用程序图标。它们使用新项目对话框中的 WPF\
  \ 应用程序模板创建。 |\n\n\n\n\n\n你可以在 [`wrox.com`](http://wrox.com) 的 [`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 的“下载代码”选项卡中找到本章节的代码下载。代码位于第 3 章下载中，并根据整个章节中的名称进行单独命名。\n\n为了有效使用 `C#`，理解你在创建计算机程序时实际上在做什么至关重要。计算机程序最基础的描述可能是：它是一系列处理数据的操作。即使对于最复杂的例子，包括功能多样的\
  \ `Windows` 应用程序（例如 `Microsoft Office 软件套`），事实也是如此。尽管这通常对应用程序用户来说是完全隐藏的，但它始终在后台运行。\n\
  \n为了进一步说明这一点，请考虑你计算机的显示单元。你在屏幕上看到的内容往往是非常熟悉的，以至于很难想象它是“动态画面”之外的东西。事实上，你看到的只是某些数据的表示，而其原始形式仅仅是存储在计算机内存某处的\
  \ 0 和 1 的流。屏幕上的任何操作 —— 移动鼠标指针、点击图标、在文字处理器中输入文本 —— 都会导致内存中数据的移动。\n\n当然，更简单的情况也能很好地说明这一点。当你使用计算器应用程序时，你提供数字形式的数据并对这些数字进行操作，这与你使用纸和笔的方式非常相似\
  \ ——但要快得多！\n\n如果计算机程序从根本上是对数据执行操作，这意味着你需要一种存储这些数据的方法以及一些操作它们的方法。这两个功能分别由 `variables`（变量）和\
  \ `expressions`（表达式）提供，本章将从通用和具体的方面探讨这意味着什么。\n\n首先，你将看一眼涉及 `C#` 编程的基本语法，因为你需要一个语境，以便在\
  \ `C#` 语言中学习和使用变量和表达式。\n\n## 基础 C# 语法\n\n`C#` 代码的外观和感觉类似于 `C++` 和 `Java`。这种语法起初看起来可能相当非常令人困惑，而且比其他语言更不像书面英语。然而，当你沉浸在\
  \ `C#` 编程的世界时，你会发现所使用的风格是非常合乎逻辑的，不需要费力就能写出可读性很高的代码。\n\n与 `Python` 等其他语言的编译器不同，`C#`\
  \ 编译器会忽略代码中额外的间距，无论这些间距是由空格、换行符还是制表符引起的（统称为 `whitespace characters`）。这意味着你在格式化代码的方式上有很多自由度，尽管遵循某些规则可以帮助你的代码更易读。\n\
  \n`C#` 代码由一系列 `statements`（语句）组成，每条语句都以分号结束。因为忽略了空白字符，多个语句可以出现在同一行，但为了可读性，通常会在分号后添加换行符，以避免在同一行出现多个语句。然而，使用跨越几行代码的语句完全可以接受（而且非常正常）。\n\
  \n`C#` 是一种 `block-structured language`（块结构语言），这意味着语句是代码块的一部分。这些块由大括号（`{` 和 `}`）分隔，可以包含任意数量的语句，也可以没有任何语句。注意，大括号字符不需要分号。\n\
  \n例如，一个简单的 `C#` 代码块如下：\n\n```\n{\n   <code line 1, statement 1>;\n   <code line\
  \ 2, statement 2>\n      <code line 3, statement 2>;\n}\n```\n\n在这里，`<code` `line`\
  \ `x,` `statement` `y>` 部分并不是实际的 `C#` 代码；这段文本用作占位符，用于放置 `C#` 语句。在这种情况下，第二和第三行代码是同一个语句的一部分，因为第二行之后没有分号。对第三行代码进行缩进有助于识别它实际上是第二行的延续。\n\
  \n接下来的简单示例使用 `indentation`（缩进）来清晰 `C#` 本身。这实际上是标准做法，而且事实上 `Visual Studio` 默认就会为你完成这一点。通常情况下，每个代码块都有自己的缩进级别，即它向右偏移的距离。代码块可以相互嵌套（即块可以包含其他块），在这种情况下，嵌套的块将进一步缩进：\n\
  \n```\n{\n   <code line 1>;\n   {\n      <code line 2>;\n      <code line 3>;\n\
  \   }\n   <code line 4>;\n}\n```\n\n此外，作为前行延续的代码行通常也会进一步缩进，正如第一个代码示例中的第三行代码所示。\n\
  \n当然，这种风格绝不是强制性的。然而，如果你不使用它，当你读完这本书时，你会很快发现事情会变得非常混乱！\n\n`Comments`（注释）是你在 `C#`\
  \ 代码中经常看到的其他内容。严格来说，注释完全不是 `C#` 代码，但它们很乐意与代码共存。注释是自解释其义的：它们允许你向代码中添加描述性文本 —— 使用纯英语（或法语、德语、蒙古语等）\
  \ —— 而这些文本会被编译器忽略。当你开始处理很长的代码段时，添加一些关于你具体在做什么的提醒是有用的，例如“这行代码要求……”。\n\n`C#` 提供了两种方法来进行注释。你可以在注释的开头和结尾标记，或者使用一种意味着“该行剩下的都是注释”的标记。\n\
  \n要使用第一种方法指示注释，你在开头使用 `/*` 字符，在结尾使用 `*/` 字符。这些可以出现在同一行，也可以出现在多行，在这种情况下它们之间的所有行都是注释。你在注释体中不能输入的内容是\
  \ `*/`，因为那被解释为结束标记。例如，以下是允许的：\n\n```\n/* 这条注释 */\n/* 所以……               ……是！ */\n\
  ```\n\n然而，以下会导致问题：\n\n```\n/* 注释通常以 */结束 */\n```\n\n在这里，注释的结尾（*/ 之后的字符）将被解释为 `C#`\
  \ 代码，并会导致错误。\n\n另一种注释方法涉及以 `//` 开始注释。之后，你可以编写任何内容 —— 只要保持在一行！以下是允许的：\n\n```\n//\
  \ 这是一种不同的注释。\n```\n\n然而，以下会失败，因为第二行被解释为 `C#` 代码：\n\n```\n// 所以是这样，\n   但这部分不是。\n\
  ```\n\n这种注释方式对于记录语句很有用，因为两者都可以放在同一行：\n\n```\n<一个语句>;         // 语句的说明\n```\n\n\n\
  \n\nC# 代码的一个非常重要的一点是它是区分大小写的。与其他某些语言不同，你必须使用完全正确的大小输入代码，因为使用大写字母代替小写字母会导致项目无法编译。例如，考虑取自第\
  \ 2 章的以下行代码：\n\n```\nConsole.WriteLine(\"The first app in Beginning C# Programming!\"\
  );\n```\n\n这段代码可以被 C# 编译器识别，因为 `Console.WriteLine()` 命令的大小写是正确的。然而，以下任何一行代码都无法工作：\n\
  \n```\nconsole.WriteLine(\"The first app in Beginning C# Programming!\");\nCONSOLE.WRITELINE(\"\
  The first app in Beginning C# Programming!\");\nConsole.Writeline(\"The first app\
  \ in Beginning C# Programming!\")\n```\n\n在这里，使用的字母是错误的，因此 C# 编译器不知道你想做什么。幸运的是，正如你很快发现的，Visual\
  \ Studio 在输入代码方面非常有帮助，大多数时候，它知道（在程序所能知道的范围内）你正在尝试做什么。当你输入时，它会建议你可能喜欢的命令，并尝试纠正大小写问题。\n\
  \n## 基本 C# 控制台应用程序结构\n\n在这里，你将更仔细地观察第 2 章中的控制台应用程序示例 (`ConsoleApplication1`) 并对其结构进行分解。以下是代码：\n\
  \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing\
  \ System.Text;\nusing System.Threading.Tasks;\nnamespace ConsoleApplication1\n{\n\
  \   class Program\n   {\n      static void Main(string[] args)\n      {\n      \
  \   // 将文本输出到屏幕。\n         Console.WriteLine(\"The first app in Beginning C# Programming!\"\
  );\n         Console.ReadKey();\n      }\n   }\n}\n```\n\n你可以立即看到上一节中讨论的所有语法元素都出现在这里——分号、大括号和注释，以及适当的缩进。\n\
  \n目前最重要的代码部分是以下：\n\n```\nstatic void Main(string[] args)\n{\n   // 将文本输出到屏幕。\n \
  \  Console.WriteLine(\"The first app in Beginning C# Programming!\");\n   Console.ReadKey();\n\
  }\n```\n\n这是当你运行控制台应用程序时执行的代码。更准确地说，执行的是大括号包含的代码块。正如前面提到的，注释行不起任何作用；它只是为了清晰。另外两行代码分别向控制台窗口输出某些文本并等待响应，尽管这些的具体机制目前你不需要担心。\n\
  \n注意如何实现上一章所示的代码大纲功能，尽管它是针对 Windows 应用程序，因为这是一个非常有用的功能。你可以使用 `#region` 和 `#endregion`\
  \ 关键字来实现这一点，它们定义了一个可以展开和折叠的代码区域的开始和结束。例如，你可以这样修改 `ConsoleApplication1` 的生成代码：\n\n\
  ```\n#region Using directives\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n#endregion\n\
  ```\n\n这允许你将此代码折叠为单行，并在以后想查看细节时再次展开。这里包含的 `using` 语句以及紧下方的 `namespace` 语句将在本末尾解释。\n\
  \n目前，不要担心示例中的其他代码，因为前几章的目的是解释基本的 C# 语法，所以应用程序执行到调用 `Console.WriteLine()` 点的具体方法并不重要。稍后，这段额外代码的意义将会变得明确。\n\
  \n## 变量\n\n正如前面提到的，变量涉及数据的存储。本质上，你可以将计算机内存中的变量想象成放在架子上的盒子。你可以把东西放在盒子里并再次取出来，或者只需查看盒子内部看看里面是否有东西。变量也是如此；你根据需要将数据放入其中，并可以将其取出或查看。\n\
  \n虽然计算机中的所有数据实际上都是同一种东西（一系列 0 和 1），但变量有不同的“风味”，被称为“类型”（types）。再次使用盒子的类比，盒子有不同的形状和大小之，因此某些物品只适合某些特定的盒子。这种类型系统背后的逻辑是不同类型的数据可能需要不同的处理方法，通过将变量限制为单个类型，你可以避免将它们混淆。例如，将组成数字图片的\
  \ 0 和 1 序列视为音频文件是没有意义的。\n\n要使用变量，你必须声明它们。这意味着你必须为它们分配一个名称和一个类型。声明变量后，你就可以将它们作为你声明要持有的数据类型的存储单元。\n\
  \n声明变量的 C# 语法仅指定类型和变量名：\n\n```\n<type> <name>;\n```\n\n如果你尝试使用一个未声明的变量，你的代码将无法编译，但在情况下，编译器会准确告诉你问题所在，所以这并不是一个灾难性的错误。尝试在不赋值的情况下使用变量也会导致错误，但同样，编译器会检测到这一点。\n\
  \n### 简单类型\n\n简单类型包括数字和布尔（真或假）值等类型，它们构成了你应用程序的基础构建模块。与复杂类型不同，简单类型不能有子项或属性。大多数简单类型都是数值。这种类型系统的原因是不同类型的数据可能需要不同的处理方法，通过将变量限制为单个类型，你可以避免将它们混淆。例如，将组成数字图片的\
  \ 0 和 1 序列视为音频文件是没有意义的。\n\n要使用变量，你必须声明它们。这意味着你必须为它们分配一个名称和一个类型。声明变量后，你就可以将它们作为你声明要持有的数据类型的存储单元。\n\
  \n声明变量的 C# 语法仅指定类型和变量名：\n\n```\n<type> <name>;\n```\n\n如果你尝试使用一个未声明的变量，你的代码将无法编译，但在情况下，编译器会准确告诉你问题所在，所以这并不是一个灾难性的错误。尝试在不赋值的情况下使用变量也会导致错误，但同样，编译器会检测到这一点。\n\
  \n简单类型包括数字和布尔（真或假）值等类型，它们构成了你应用程序的基础构建模块。与复杂类型不同，简单类型不能有子项或属性。大多数简单类型都是数值。这种类型系统的原因是不同类型的数据可能需要不同的处理方法，通过将变量限制为单个类型，你可以避免将它们混淆。例如，将组成数字图片的\
  \ 0 和 1 序列视为音频文件是没有意义的。\n\n[注：提供的文本包含了一些重复部分。）\n\n相反，可以使用许多不同的整数类型来存储各种范围的数字，它们占用不同的内存（最高\
  \ 64 位）。这些类型见表 3.1。\n\n| **类型** | **别名** | **允许的值** |\n| :--- | :--- | :--- |\n\
  | `sbyte` | `System.SByte` | 整数从 -128 到 127 |\n| `byte` | `System.Byte` | 整数从 0\
  \ 到 255 |\n| `short` | `System.Int16` | 整数从 -32768 到 32767 |\n| `ushort` | `System.UInt16`\
  \ | 整数从 0 到 65535 |\n| `int` | `System.Int32` | 整数从 -2147483648 到 2147483647 |\n\
  | `uint` | `System.UInt32` | 整数从 0 到 4294967295 |\n| `long` | `System.Int64` | 整数从\
  \ -9223372036854775808 到 9223372036854775807 |\n| `ulong` | `System.UInt64` | 整数从\
  \ 0 到 18446744073709551615 |\n\n\n\n\n\n某些变量名之前的 `u` 字符是 *unsigned*（无符号）的缩写，意味着你不能在这些类型的变量存储负数，如前表的“允许值”列所示。\n\
  \n当然，你还需要存储 *floating-point*（浮点）值，即非整数。你可以使用三种浮点变量类型：`float`、`double` 和 `decimal`。前两种以\
  \ 6`m` × `2`^e 的形式存储浮点，其中 `m` 和 `e` 的允许值因每个类型而异。`decimal` 使用另一种形式 6`m` × `10`^e。这三种类型在表\
  \ 3.2 中显示，以及它们 `m` 和 `e` 的允许值以及这些限制在实际数值中的表示。\n\n| **类型** | **别名** | **M 最小值** |\
  \ **M 最大值** | **E 最小值** | **E 最大值** | **最小值** | **近似最大值** |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- |\n| `float` | `System.Single` | 0 | 22⁴ |\
  \ −149 | 104 | 1.5 × 10^(−45) | 3.4 × 10³⁸ |\n| `double` | `System.Double` | 0 |\
  \ 25³ | −1075 | 970 | 5.0 × 10^(−324) | 1.7 × 10³⁰⁸ |\n| `decimal` | `System.Decimal`\
  \ | 0 | 29⁶ | −28 | 0 | 1.0 × 10^(−28) | 7.9 × 10²⁸ |\n\n**表 3.2**](#c03.xhtml_c03-tbl-anc-0002)\
  \ 浮点类型\n\n除了数值类型外，还有其他三种简单类型（参见表 3.3）。\n\n| **类型** | **别名** | **允许值** |\n| :---\
  \ | :--- | :--- |\n| `char` | `System.Char` | 单个 Unicode 字符，存储为 0 到 65535 之间的整数\
  \ |\n| `bool` | `System.Boolean` | 布尔值，`true` 或 `false` |\n| `string` | `System.String`\
  \ | 字符序列 |\n\n**表 3.3**](#c03.xhtml_c03-tbl-anc-0003) 文本和布尔类型\n\n注意，`string` 的字符数量没有上限，因为它可以使用不同数量的内存。\n\
  \n布尔类型 `bool` 是 C# 中常用的变量类型之一，事实上，类似的类型在其他语言的代码中同样常见。拥有一个可以为 `true` 也可以为 `false`\
  \ 的变量对于应用程序中的逻辑流具有重要影响。作为一个简单的例子，考虑有多少问题可以用真或假（或是与否）来回答。在变量值之间进行比较或验证输入是你很快就会检查的布尔变量在编程中的两种用途。\n\
  \n现在你已经看到了这些类型，请考虑一个声明并使用它们的简短示例。在下面的“尝试一下”中，你将使用一些简单的代码声明两个变量，为它们赋值，然后输出这些值。\n\n\
  ### 变量命名\n\n如前一节所述，你不能任意选择字符序列作为变量名。然而，这听起来并不像那么糟糕，因为你仍然拥有一套灵活的命名系统。\n\n变量命名的基本规则如下：\n\
  \n* 变量名的第一个字符必须是字母、下划线字符（`_`）或 `@` 符号（@`）。\n* 后续字符可以是字母、下划线或数字。\n\n还有某些对 C# 编译器具有特殊含义的关键字，例如之前所示的\
  \ `using` 和 `namespace` 关键字。不过，如果你误用了其中一个，编译器会报错，所以不用担心。\n\n例如，以下变量名是合法的：\n\n```\n\
  myBigVar\nVAR1\n_test\n```\n\n但这些是不合法的：\n\n```\n99BottlesOfBeer\nnamespace\nIt's-All-Over\n\
  ```\n\n### 字面量值\n\n之前的“尝试一下”展示了两个字面量值的示例：整数（`17`）和字符串（`\"\\\"myInteger\\\" is\"\
  `）。其他变量类型也有关联的字面量值，如表 3.4 所示。其中许多涉及*后缀*，即通过在字面量值末尾添加一个字符序列来指定所需的类型。某些字面量具有多种类型，由编译器在编译时根据其上下文确定（同样在表\
  \ 3.4 中所示）。\n\n| **类型(s)** | **类别** | **后缀** | **示例/允许值** |\n| :--- | :--- | :---\
  \ | :--- |\n| `bool` | 布尔 | 无 | `True` 或 `false` |\n| `int`, `uint`, `long`, `ulong`\
  \ | 整数 | 无 | `100` |\n| `uint`, `ulong` | 整数 | `u` 或 `U` | `100U` |\n| `long`, `ulong`\
  \ | 整数 | `l` 或 `L` | `100L` |\n| `ulong` | 整数 | `u` 或 `U` | `100U` |\n| `float`\
  \ | 实数 | `f` 或 `F` | `1.5f` |\n| `double` | 实数 | `d` 或 `D` | `1.5d` |\n| `decimal`\
  \ | 实数 | `m` 或 `M` | `1.5m` |\n| `char` | 字符 | 无 | `'a'` |\n| `string` | 字符串 | 无\
  \ | `\"a\"` |\n\n**表 3.4**](#c03.xhtml_c03-tbl-0004) 字面量值\n\n#### 字面量值\n\n之前的“尝试一下”展示了两个字面量值的示例：整数（`17`）和字符串（`\"\
