  {\n   protected IList<T> innerCollection;\n   protected int maxSize = 10;\n   public\
  \ ShortList()\n      : this(10)\n   {\n   }\n   public ShortList(int size)\n   {\n\
  \      maxSize = size;\n      innerCollection = new List<T>();\n   }\n   public\
  \ ShortList(IEnumerable<T> list)\n      : this(10, list)\n   {\n   }\n   public\
  \ ShortList(int size, IEnumerable<T> list)\n   {\n      maxSize = size;\n      innerCollection\
  \ = new List<T>(list);\n      if (Count > maxSize)\n      {\n         ThrowTooManyItemsException();\n\
  \      }\n   }\n   protected void ThrowTooManyItemsException()\n   {\n      throw\
  \ new IndexOutOfRangeException(\n         \"Unable to add any more items, maximum\
  \ size is \" + maxSize.ToString()\n         + \" items.\");\n   }\n   #region IList<T>\
  \ Members\n   public int IndexOf(T item) => innerCollection.IndexOf(item);\n   public\
  \ void Insert(int index, T item)\n   {\n      if (Count < maxSize)\n      {\n  \
  \       innerCollection.Insert(index, item);\n      }\n      else\n      {\n   \
  \      ThrowTooManyItemsException();\n      }\n   }\n   public void RemoveAt(int\
  \ index)\n   {\n      innerCollection.RemoveAt(index);\n   }\n   public T this[int\
  \ index]\n   {\n      get\n      {\n         return innerCollection[index];\n  \
  \    }\n      set\n      {\n         innerCollection[index] = value;\n      }\n\
  \   }\n   #endregion\n   #region ICollection<T> Members\n   public void Add(T item)\n\
  \   {\n      if (Count < maxSize)\n      {\n         innerCollection.Add(item);\n\
