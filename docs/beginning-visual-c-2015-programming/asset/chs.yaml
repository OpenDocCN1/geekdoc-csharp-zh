  \n除了可以在这里查看这些信息外，你还可以访问许多这些项目的相关代码。双击单击项目或右键点击并选择`Go To Definition`（转到定义），将直接带你进入项目中定义该项目的代码（如果可用）。如果代码不可，例如无法访问的基类型中的代码（例如\
  \ `System.Object`），你也可以选择`Browse Definition`（浏览定义），这将带你进入`Object Browser`（对象体系）视图（在下一节中描述）。\n\
  \n图 9.3 中出现的另一个条目是`Project References`（项目引用）。它让你能够看到项目引用了哪些程序集，在这种情况下，它包括但不限于`mscorlib`和`System`中的核心\
  \ .NET 类型、`System.Data`中的数据访问类型以及`System.Xml`中的 XML 操作类型。这里的引用可以展开，显示这些程序集中包含的命名空间和类型。\n\
  \n你可以通过右键点击条目并选择`Find All References`（查找所有引用）来查找代码中类型和成员的存在；搜索结果列表将在`Find Symbol\
  \ Results`（符号查找结果）窗口中显示，该窗口作为标签页出现在屏幕底部的`Error List`（错误列表）显示区域。你也可以使用`Class View`窗口重命名项目。如果你这样做，将获得重命名代码中任何位置该条目引用的选项。这意味着你没有类名拼写错误的借口了，因为你可以随心所欲地更改它们！\n\
  \n此外，你可以使用名为`Call Hierarchy`（调用层次结构）的视图导航代码，可以通过`Class View`窗口的右键菜单选项`View Call\
  \ Hierarchy`（查看调用层次结构）访问。此功能对于查看类成员之间如何交互非常有用，你将在下一章中查看它。\n\n### 对象体系\n\n`Object\
  \ Browser`（对象层次结构）是`Class View`窗口的扩展版本，让你能够查看项目可用的其他类，甚至是外部类。它可以自动进入（例如在上一节所述的情况下），也可以通过`View`![1](img/c09f003.jpg)手动进入。\n\
  \n*(注：原文后续部分存在大量重复段落，已按要求去重复处理)*\n\n\n\n\n此类 `MyNewClass` 定义在与入口点类 `Program` 相同的命名空间中，因此你可以在代码中使用它，就像它定义在同一个文件中一样。正如代码所示，为你生成的类不包含构造函数。请记住，如果类定义没有包含构造函数，那么编译器会在你编译代码时添加一个默认构造函数。\n\
  \n### 类图\n\nVisual Studio 中一个你尚未查看过的强大功能是可以根据代码生成类图并使用它们来修改项目。Visual Studio 中的类图编辑器允许你轻松地生成代码的类\
  \ UML 图表。在接下来的“尝试”中，当你为你之前创建的 `Ch09Ex01` 项目生成类图时，就能看到它的用法。\n\n## 类库项目\n\n除了将类放在项目中的单独文件中外，你还可以将它们放在完全不同的项目中。仅包含类（以及其他相关的类型定义，但没有入口点）的项目被称为类库。\n\
  \n类库项目被编译为 `.dll` 程序集，你可以通过从其他项目向它们添加引用来访问其内容（这些项目可以是同一个解决方案的一部分，但不必须）。这扩展了对象提供的封装性，因为可以在不触碰使用类库的项目的情况下对其进行修订和更新。这意味着你可以轻松升级类提供的服务（这可能会影响多个消费者应用程序）。\n\
  \n接下来的“尝试”提供了类库项目以及一个使用其包含的类的独立项目示例。\n\n## 接口与抽象类\n\n本章演示了如何同时创建接口和抽象类（目前暂不包含成员——你将在第\
  \ 10 章中遇到它们）。这两种类型在许多方面都是相似的，因此了解何时应该使用其中一种技术或另一种技术将很有用。\n\n首先是相似之处：抽象类和接口都可以包含被派生类继承的成员。接口和抽象类都不能被直接实例化，但可以声明这些类型的变量。如果你这样做，就可以利用多态将继承自这些类型的对象赋值给这些类型的变量。在这两种情况下，你都可以通过这些变量使用这些类型的成员，尽管你无法直接访问派生对象的其他成员。\n\
  \n现在来看不同之处：派生类只能继承自单个基类，这意味着只能直接继承一个抽象类（尽管继承链可以包含多个抽象类）。相反，类可以使用任意数量的接口，但这并不会产生巨大差异——通过任何一种方式都可以实现类似的结果。只是接口处理问题的方式略有不同。\n\
  \n抽象类可以同时拥有抽象成员（这些成员没有代码体，必须在派生类中实现，除非派生类本身也是抽象的）和非抽象成员（这些成员拥有代码体，并且可以是虚新的以便在派生类中被重写）。相反，接口成员必须在使用接口的类中实现——它们没有代码体。此外，接口成员定义上是公共的（因为它们供外部使用），但抽象类的成员也可以是私有的（只要它们不是抽象的）、保护的、内部的或保护内部的（其中保护内部成员仅从应用程序内部的代码或从派生类访问）。此外，接口不能包含字段、构造函数、析构函数、静态成员或常量。\n\
  \n例如，考虑一个代表火车的对象族。基类 `Train` 包含了火车的的核心定义，例如轮距和引擎类型（可以是蒸汽动力、柴油等）。然而，此类是抽象的，因为不存在所谓的“通用”火车。要创建一个“实际”的火车，你需要添加特定于该火车的特征。例如，如图\
  \ 9.11 所示所示你派生出 `PassengerTrain`、`FreightTrain` 和 `424DoubleBogey` 等类。\n\n![树图显示了四个框，分别标记为\
  \ Train（顶部）、PassengerTrain、FreightTrain 和 424DoubleBogey（底部）。](img/c09f011.jpg)\n\
  \n图 9.11\n\n一组汽车对象可能以相同的方式定义，具有一个抽象基类 `Car` 以及如 `Compact`、`SUV` 和 `PickUp` 等派生类。`Car`\
  \ 和 `Train` 甚至可能派自一个共同基类，例如 `Vehicle`。这在图 9.12 所示。\n\n![图显示了 9 个标记的框。Vehicle（顶部）显示了\
  \ 2 个分支，即 Car 和 Train，产生了类派生类，即：Compact, SUV, Pickup, PassengerTrain, FreightTRAIN\
  \ 和 424DoubleBogey。](img/c09f012.jpg)\n\n图 9.12\n\n层级结构中较低的一些类可以因为其目的而共享特征，而不仅仅是因为它们派自什么。例如，`PassengerTrain`、`Compact`、`SUV`\
  \ 和 `Pickup` 都能携带乘客，因此它们可能拥有一个 `IPassengerCarrier` 接口。`FreightTrain` 和 `Pickup`\
  \ 可以运载重物，因此它们可能也都有 `IHeavyLoadCarrier` 接口。这在图 9.13 中所示。\n\n![与图 9.12 相同，带有虚线和标记为\
  \ IPassengerCarrier 和 IHeavyLoadCarrier 的两个框。从特定的类（上方），线条指向底部的两个框。](img/c09f013.jpg)\n\
  \n图 9.13\n\n通过在分配具体内容之前这样分解对象系统，你可以清楚地看到哪些情况应该使用抽象类而不是接口，反之亦然。此示例的结果无法仅通过接口或仅通过继承来实现。\n\
  \n## 结构体类型\n\n第 8 章提到结构体和类非常相似，但结构体是值类型而类是引用类型。这对你实际上意味着什么？嗯，观察这一简单方法是使用示例，例如下面的“尝试”。\n\
  \n## 浅拷贝深拷贝\n\n通过值而不是引用将对象从一个拷贝到另一个（即以结构体的方式复制）是非常复杂的。因为单个对象可能包含指向许多其他对象的引用，例如字段成员等，可能涉及大量的处理。简单地将每个成员从一个对象复制到另一个可能无效，因为这些成员本身可能是引用类型。\n\
  \n.NET Framework 取了了。你可以使用继承自 `System.Object` 的 `MemberwiseClone()` 方法创建对象的简单副本，每个成员都被复制到新对象。这是一个保护方法，但在对象上定义一个调用该方法的公共方法很容易。这种复制方法被称为浅拷贝，因为它没有考虑引用类型成员。这意味着新对象中的引用成员与源对象中的对应成员指向相同的对象，这在许多情况下是不理想的。\n\
  \n\n\n\n\n你可以实现一个接口，允许你以标准的方式进行深拷贝：`ICloneable`。如果你使用此接口，则必须实现它包含的唯一方法 `Clone()`。该方法返回一个\
  \ `System.Object` 类型的值。你可以通过任何你选择的方式实现方法体，并使用任何你需要的处理来获取此对象。这意味着如果你愿意，你可以实现一个深拷贝，尽管具体的行为并不是强制性的，因此根据需要，你也可以执行浅拷贝。对于从该方法实际返回的内容，没有任何规则或限制，因此许多人建议避免使用它。相反，他们建议实现你自己的深拷贝方法。你可以在第\
  \ 11 章中详细查看此接口。\n\n## ![image](img/c02g003.jpg) 你在本章中学到的内容\n\n| 主题 | 核心概念 |\n| :---\
  \ | :--- |\n| **类和接口定义** | 类使用 `class` 关键字定义，接口使用 `interface` 关键字定义。你可以使用 `public`\
  \ 和 `internal` 关键字来定义类和接口的访问性，并可以将类定义为 `abstract`（抽象）或 `sealed`（密封）以控制继承。父类和接口在类或接口名称后的冒号后面，以逗号分隔的列表形式指定。在类定义中只能指定一个父类，且它必须是列表中的第一项。\
  \ |\n| **构造函数和析构函数** | 类自带默认的构造函数和析构函数实现，你很少需要提供自己的析构函数。你可以使用访问修饰符、类名和任何所需的参数来定义构造函数。基类的构造函数在派生类的构造函数之前执行，你可以通过\
  \ `this` 和 `base` 构造函数初始化关键字来控制类内部的执行顺序。 |\n| **类库** | 你可以创建仅包含类定义的类库项目。这些项目无法直接执行；它们必须通过可执行应用程序中的客户端代码来访问。Visual\
  \ Studio 提供了各种用于创建、修改和检查类的工具。 |\n| **类族** | 类可以将类分组为具有共同行为或共享共同特征的族。你可以通过继承一个共享的基类（可以是抽象的）或通过实现接口来实现。\
  \ |\n| **结构体定义** | 结构体（struct）的定义方式与类非常相似，但请记住结构体是值类型，而类是引用类型。 |\n| **复制对象** | 当你复制一个对象时，必须小心复制它可能包含的任何对象，而不是简单地复制指向对象的引用。复制引用被称为浅拷贝，而完全拷贝被称为深拷贝。你可以使用\
  \ `ICloneable` 接口作为框架，在类定义中提供深拷贝能力。 |\n\n# 第 10 章\n\n## 定义类成员\n\n### 本章的 Wrox.com\
  \ 代码下载\n\n你可以在“Download Code”选项卡中的 `[`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)`\
  \ 找到本章的 [`wrox.com`](http://wrox.com) 代码下载。代码位于第 10 章 下载中，并根据整个章节中的各个名称进行单独命名。\n\
  \n本章通过查看如何定义字段、属性和方法类成员，继续探索 C# 中的类定义。你首先检查每种类型所需的代码，并学习如何生成这些代码的结构。你还学习了如何通过编辑属性来快速修改成员。\n\
  \n在涵盖成员定义的基础知识后，你将学习一些涉及成员的高级技术：隐藏基类成员、调用重写的基类成员、嵌套类型定义和部分类定义。\n\n最后，你通过创建一个可以在后续章节中进行构建和使用的类库，将理论付诸实践。\n\
  \n### 成员定义\n\n在类定义内部，你为类的所有成员（包括字段、方法和属性/属性）提供定义。所有成员都有它们自己的访问性级别，在所有情况下都由以下关键字之一定义：\n\
  \n* `public` — 成员可以从任何代码访问。\n* `private` — 成员仅可以从该类一部分的代码访问（如果不使用任何修饰符，则是默认值）。\n\
  * `internal` — 成员仅可以从定义所在程序集（项目）内部的代码访问。\n* `protected` — 成员仅可以从该类或其派生类一部分的代码访问。\n\
  \n后两个可以组合使用，因此 `protected internal` 成员也是可能的。这些成员仅从项目内（更准确地说，是程序集内）的派生类派生类代码访问。\n\
  \n字段、方法和属性也可以使用 `static` 关键字进行声明，正如第 8 章中所述，这意味着它们是类拥有的静态成员，而不是对象实例拥有的。\n\n####\
  \ 定义字段\n\n字段使用标准的变量声明格式（带有可选初始化）以及之前讨论过的修饰符来定义：\n\n```\nclass MyClass\n{\n   public\
  \ int MyInt;\n}\n```\n\n字段还可以使用 [`readonly`](http://readonly) 关键字，这意味着该字段只能在构造函数执行期间或通过初始赋值赋值：\n\
  \n```cs\nclass MyClass\n{\n   public readonly int MyInt = 17;\n}\n```\n\n正如章节引言所述，字段可以使用\
  \ [`static`](http://static) 关键字声明为静态：\n\n```cs\nclass MyClass\n{\n   public static\
  \ int MyInt;\n}\n```\n\n静态字段通过定义它们的类进行访问（如上例中的 ``MyClass.MyInt``），而不是通过该类的对象实例。你可以使用\
  \ [`const`](http://const) 关键字创建常量值。`const` 成员在定义上是静态的，因此你不需要使用 `static` 修饰符（事实上，这样做是错误的）。\n\
  \n#### 定义方法\n\n方法使用标准的函数格式，加上访问性和可选的 `static` 修饰符，如下例所示：\n\n```cs\nclass MyClass\n\
  {\n   public string GetString() => return \"Here is a string.\";\n}\n```\n\n记住，如果你使用\
  \ `static` 关键字，则该方法只能通过类访问，而不是通过对象实例访问。你还可以在方法定义中使用以下关键字：\n\n* `virtual` — 方法可以被重写。\n\
  * `abstract` — 方法必须在非抽象的派生类中被重写（仅在抽象类中允许）。\n* `override` — 方法重写基类方法（如果正在重写方法，则必须使用它）。\n\
  * `extern` — 方法定义在别处。\n\n这是一个方法重写的示例：\n\n```cs\npublic class MyBaseClass\n{\n  \
  \ public virtual void DoSomething()\n   {\n      // 基类实现。\n   }\n}\npublic class\
  \ MyDerivedClass : MyBaseClass\n{\n   public override void DoSomething()\n   {\n\
  \      // 派生类实现，重写了基类实现。\n   }\n}\n```\n\n如果使用了 `override`，则也可以使用 `sealed` 来指定派生类中不能对此方法进行进一步修改——即该方法不能被派生类再次重写。这是一个示例：\n\
  \n```cs\npublic class MyDerivedClass : MyBaseClass\n{\n   public override sealed\
  \ void DoSomething()\n   {\n      // 派生类实现，重写了基类实现。\n   }\n}\n```\n\n使用 `extern`\
  \ 允许你在项目外部提供方法的实现，但这是此处未涵盖的高级主题。\n\n### 定义属性\n\n\n\n\n属性的定义方式与字段类似，但它们包含更多功能。正如讨论过的，属性比字段更复杂，因为它们在修改状态之前可以执行额外的处理——而且，实际上它们可能完全不修改状态。它们通过两个类似于函数的代码块来实现这一点：一个用于获取属性值，另一个用于设置属性值。\n\
  \n这些块也被称为 `accessors`（访问器），它们分别使用 `get` 和 `set` 关键字定义，并用于控制属性的访问级别。你可以省略这两个块中的任何一个来创建只读或只写属性（省略\
  \ `get` 块将获得只写访问权限，而省略 `set` 块将获得只读访问权限）。当然，这仅适用于外部代码，因为类内部的其他代码将访问与这些代码块相同的数据。你还可以在访问器上包含访问权限修饰符——例如，将\
  \ `get` 块设为公共（public），将 `set` 块设为受保护（protected）。你必须包含这些块中的至少一个才能获得有效的属性（坦率地说，一个既不能读又不能改的属性是非常没用的）。\n\
  \n### 基本结构\n\n属性的基本结构由标准的访问修饰关键字（`public`、`private` 等）组成，紧接着是类型名、属性名以及包含属性处理的一个或两个\
  \ `get` 和 `set` 块：\n\n```cpp\npublic int MyIntProp\n{\n   get\n   {\n      // Property\
  \ get code.\n   }\n   set\n   {\n      // Property set code.\n   }\n}\n```\n\n定义的第一行与字段定义非常相似。区别在于行尾没有分号；取而代之的是一个包含嵌套\
  \ `get` 和 `set` 块的代码块。\n\n`get` 块的返回值类型必须与属性的类型一致。简单属性通常与一个控制该字段访问的私有字段相关联，在这种情况下，`get`\
  \ 块可以直接返回字段的值：\n\n```cs\n// Field used by property.\nprivate int myInt;\n// Property.\n\
  public int MyIntProp\n{\n   get { return myInt; }\n   set { // Property set code.\
  \ }\n}\n```\n\n由于访问级别的限制（它是私有的），类外部代码无法访问此 `myInt` 字段。相反，外部代码必须使用属性来访问该字段。`set`\
  \ 函数也以类似的方式为字段赋值。在这里，你可以使用关键字 `value` 来引用从属性用户处接收的值：\n\n```cs\n// Field used by\
  \ property.\nprivate int myInt;\n// Property.\npublic int MyIntProp\n{\n   get {\
  \ return myInt; }\n   set { myInt = value; }\n}\n```\n\n`value` 等于与属性相同类型的值，因此如果属性使用的类型与字段相同，那么你永远不需要担心这种情况下的类型转换。\n\
  \n这个简单属性的作用仅仅是屏蔽对 `myInt` 字段的直接访问。属性的真正威力在你对过程施加更多控制时就会显现出来。例如，你可能会这样实现你的 `set`\
  \ 块：\n\n```cs\n set\n   {\n      if (value >= 0 && value <= 10)\n         myInt\
  \ = value;\n   }\n```\n\n在这里，只有当给属性的值在 0 到 10 之间时，才会修改 `myInt`。在这种情况下，你有一个重要的设计选择需要做出。如果使用了无效值，该怎么办？你有四个选项：\n\
  \n* 什么都不做（如前面的代码所示）。\n* 给字段分配一个默认值。\n* 继续执行仿佛没有发生错误一样，但记录事件以便以后分析。\n* 抛出一个异常。\n\n\
  通常情况下，后两个选项是优的。在它们之间决定取决于类如何被使用，以及应该给类用户分配多少控制权。抛出异常赋予了用户相当的控制权，并让他们知道发生了什么，以便他们做出适当反应。你可以为此使用\
  \ `System` 命名空间中的标准异常之一：\n\n```cs\n set\n   {\n      if (value >= 0 && value <=\
  \ 10)\n         myInt = value;\n      else\n         throw (new ArgumentOutOfRangeException(\"\
  MyIntProp\", value,\n                   \"MyIntProp must be assigned a value between\
  \ 0 and 10.\"));\n   }\n```\n\n正如你在第 7 章(#c07.xhtml) 中看到的，这可以使用使用属性的代码中的 `try`…`catch`…`finally`\
  \ 逻辑来处理。\n\n记录数据（也许写入文本文件）可能是很有用的，例如在确实不应该出现问题的生产代码中。它允许开发者检查性能，并在必要时可能调试现有代码。\n\
  \n属性可以像方法一样使用 `virtual`、`override` 和 `abstract` 关键字，而这对字段是不可能的。最后，正如前面提到的，访问器可以有自己的访问权限，如下所示：\n\
  \n```cs\n// Field used by property.\nprivate int myInt;\n// Property.\npublic int\
  \ MyIntProp\n{\n   get { return myInt; }\n   protected set { myInt = value; }\n\
  }\n```\n\n在这里，只有类内部或派生类的代码可以使用 `set` 访问器。\n\n允许访问器的访问权限取决于属性的访问权限，并且禁止访问器的权限高于其所属的属性。这意味着私有属性不能包含任何访问权限修饰符，而公共属性可以在其访问器上使用所有修饰符。\n\
  \nC# 6 引入了一个名为表达式属性（expression based properties）的特性。与第 6 章(#c6.xhtml) 中讨论的基于表达式的方法类似，该功能将属性范围缩小到单行。例如，返回单行数学计算的属性可以使用\
  \ lambda 箭头后跟方程。\n\n```cs\n// Field used by property.\nprivate int myDoubledInt\
  \ = 5;\n// Property.\npublic int DoubledIntProp => myDoubledInt * 2;\n```\n\n###\
  \ 重构成员\n\n在添加属性时，一种实用的技术是从字段生成属性的能力。这是代码重构（refactoring）的一个示例，重构简单意味着使用工具修改你的代码，而不是手动修改。这可以通过在类图或代码视图中右键点击类成员来实现。\n\
  \n例如，如果 `MyClass` 类包含以下字段：\n\n```cs\npublic string myString;\n```\n\n你可以右键点击该字段并选择“快速操作（Quick\
  \ Actions）……”这将显示图 10.2(#c10.xhtml_c10-anc-0002）所示的对话框。\n\n![右键点击 public string\
  \ myString 字段并选择快速操作后的对话框截图](img/c10f002.jpg)\n\n接受默认选项将修改 `MyClass` 代码如下：\n\n```cs\n\
  public string myString;\npublic string MyString\n{\n   get { return myString; }\n\
  \   set { myString = value; }\n}\nprivate string myString;\n```\n\n在这里，`myString`\
  \ 字段的访问权限已改为私有（private），并且创建了一个名为 `MyString` 的公共属性并将其自动与 `myString` 关联。显然，减少单调地为字段创建属性的时间是一个巨大的优势！\n\
  \n### 自动属性\n\n属性是访问对象状态的首选方式，因为它们将外部代码与对象内部的数据存储实现隔离开。它们还让你对内部数据的访问拥有更大的控制权，正如你在本章中多次看到的。然而，你通常会以非常标准的方式定义属性——即你有一个私有成员通过公共属性进行直接访问。这种代码几乎与上一节的代码相似，后者是由\
  \ Visual Studio 重构工具自动生成的。\n\n\n\n\n重构在输入代码时确实可以提高速度，但 C# 还有另一个杀手锏：自动属性（automatic\
  \ properties）。通过`automatic property`，你可以使用简化的语法声明一个属性，而 C# 编译器会为你填补空白。具体而言，编译器会声明一个用于存储的私私有字段，并在你的属性的\
  \ `get` 和 `set` 块中使用该字段——而你无需担心这些细节。\n\n使用以下代码结构来定义自动属性：\n\n```\npublic int MyIntProp\n\
  {\n   get;\n   set;\n}\n```\n\n你甚至可以在单行代码上定义自动属性以节省空间，且不会显著降低属性的可读性：\n\n```go\n\
  public int MyIntProp { get; set; }\n```\n\n你按照通常的方式定义属性的访问修器、类型和名称，但你不需要为 `get`\
  \ 或 `set` 块提供任何实现。相反，编译器会提供这些块的实现（以及底层字段）。\n\n当你使用自动属性时，你只能通过该属性访问其数据，而无法通过其底层的私有字段访问。这是因为在不知道该私有字段名称（该名称是在编译期间定义的）的情况下，你无法访问它。然而，这并不是真正的限制，因为直接使用属性名称是没问题的。自动属性的唯一限制是它们必须同时包含\
  \ `get` 和 `set` 访问器——你无法通过这种方式定义只读或只写属性。不过，你可以更改这些访问器的访问修饰符。例如，这意味着你可以如下方式创建一个外部只读属性：\n\
  \n```\npublic int MyIntProp { get; private set; }\n```\n\n在这里，你只能从类定义中的代码访问 `MyIntProp`\
  \ 的值。\n\nC# 6 引入了两个与自动属性的新概念，称为只读自动属性（getter-only auto-properties）和自动属性初始化器（initializers\
  \ for auto-properties）。在 C# 6 之前，自动属性需要 setter，这限制了不可变数据类型的利用。不可变数据类型的简单定义是它一旦被创建就不会改变状态，最著名的不可变类型是\
  \ `System.String`。使用不可变数据类型有许多好处，例如简化并发编程和线程同步。\n\n并发编程和线程同步是高级主题，本书将不再进一步讨论；但是，了解只读自动属性是非常重要的。它们通过以下语法创建，注意此时不再需要\
  \ setter：\n\n```\npublic int MyIntProp { get; }\n```\n\n自动属性的初始化功能通过以下方式实现，其方法与声明字段的方式相似：\n\
  \n```\npublic int MyIntProp { get; } = 9;\n```\n\n# 额外的类成员主题\n\n现在你准备好查看一些更高级的成员主题了。本节将以下内容：\n\
  \n*   隐藏基类方法\n*   调用重写或隐藏的基类方法\n*   使用嵌套类型定义\n\n### 隐藏基类方法\n\n当你从基类继承一个（非抽象）成员时，你也继承了一个实现。如果被继承的成员是虚的（virtual），那么你就可以用\
  \ `override` 关键字重写该实现。无论继承的成员是否为虚的，只要你愿意，都可以隐藏该实现。这在某些情况下非常有用，例如，当一个公共继承成员的工作方式不完全符合你的预期时。\n\
  \n你可以简单地使用如下代码来实现这一点：\n\n```\npublic class MyBaseClass\n{\n   public void DoSomething()\n\
  \   {\n      // 基类实现。\n   }\n}\npublic class MyDerivedClass : MyBaseClass\n{\n \
  \  public void DoSomething()\n   {\n      // 派生类实现，隐藏了基类实现。\n   }\n}\n```\n\n虽然这段代码可以运行，但它会生成一个警告，提示你正在隐藏基类成员。如果你不小心隐藏了想要使用的成员，该警告给了你修正的机会。如果你确实想隐藏该成员，可以使用\
  \ `new` 关键字显式地表示这是你想做的操作：\n\n```\npublic class MyDerivedClass : MyBaseClass\n{\n\
  \   new public void DoSomething()\n   {\n      // 派生类实现，隐藏了基类实现。\n   }\n}\n```\n\
  \n这种方式的工作完全相同，但不会显示警告。此时，值得注意隐藏（hiding）和重写（overriding）基类成员之间的区别。考虑以下代码：\n\n```\n\
  public class MyBaseClass\n{\n   public virtual void DoSomething() => WriteLine(\"\
  Base imp\");\n}\npublic class MyDerivedClass : MyBaseClass\n{\n   public override\
  \ void DoSomething() => WriteLine(\"Derived imp\");\n}\n```\n\n在这里，重写的方法替换了基类中的实现，使得下面的代码尽管是通过基类类型调用的（使用多态），但使用的是新版本：\n\
  \n```\nMyDerivedClass myObj = new MyDerivedClass();\nMyBaseClass myBaseObj;\nmyBaseObj\
  \ = myObj;\nmyBaseObj.DoSomething();\n```\n\n这导致如下输出：\n\n```\nDerived imp\n```\n\
  \n或者，你可以隐藏基类方法：\n\n```\npublic class MyBaseClass\n{\n   public virtual void DoSomething()\
  \ => WriteLine(\"Base imp\");\n}\npublic class MyDerivedClass : MyBaseClass\n{\n\
  \   new public void DoSomething() => WriteLine(\"Derived imp\");\n}\n```\n\n基类方法不需要是虚的也可以起作用，但效果完全相同，且前面的代码只需要更改一行。虚方法或非虚基类方法的结果如下：\n\
  \n```\nBase imp\n```\n\n尽管基类实现被隐藏了，你仍然可以通过基类访问它。\n\n### 调用重写或隐藏的基类方法\n\n无论你是重写还是隐藏了成员，你仍然可以从派生类访问基类。在许多情况下这非常有用，例如：\n\
  \n*   当你想要向派生类的用户隐藏一个继承的成员，但又想在类内部访问其功能时\n*   当你想要扩展继承的虚方法的实现，而不是简单地替换它时\n\n要实现这一点，你可以使用\
  \ `base` 关键字，它指向派生类内部的基类实现（与上一章在构造函数中的用法类似）：\n\n```\npublic class MyBaseClass\n\
  {\n   public virtual void DoSomething()\n   {\n      // 基类实现。\n   }\n}\npublic class\
  \ MyDerivedClass : MyBaseClass\n{\n   public override void DoSomething()\n   {\n\
  \      // 派生类实现，扩展了基类实现。\n      base.DoSomething();\n      // 更多派生类实现。\n   }\n}\n\
  ```\n\n\n\n\n在这里，实例化的 `MyTargetClass` 实例（`myObj`）有一个名为 `DoSomethingWith()` 的方法，该方法接受一个参数，其类型与包含该方法的类兼容。该参数类型可能是此类的类型、该类派生的基类类型、该类实现的接口，或者（当然）`System.Object`。\n\
  \n`this` 关键字的另一个常见用法是用它来修饰本地类型成员，例如：\n\n```csharp\npublic class MyClass\n{\n   private\
  \ int someData;\n   public int SomeData\n   {\n      get\n      {\n         return\
  \ this.someData;\n      }\n   }\n}\n```\n\n许多开发者喜欢这种语法，它可以用于任何成员类型，因为它让人一眼就能看出你引用的是一个成员而不是局部变量。\n\
  \n### 使用嵌套类型定义\n\n你可以在命名空间中定义类等类型，也可以在其他类内部定义类型。这时，你可以为定义使用全范围的访问性修饰符，而不仅仅是 `public`\
  \ 和 `internal`，并且你可以使用 `new` 关键字来隐藏继承自基类的类型定义。例如，以下定义 `MyClass` 的代码还定义了一个名为 `MyNestedClass`\
  \ 的嵌套类：\n\n```csharp\npublic class MyClass\n{\n   public class MyNestedClass\n \
  \  {\n      public int NestedClassField;\n   }\n}\n```\n\n要从 `MyClass` 外部实例化 `MyNestedClass`，你必须限定名称，如下：\n\
  \n```csharp\nMyClass.MyNestedClass myObj = new MyClass.MyNestedClass();\n```\n\n\
  然而，你可能无法这样做，例如如果嵌套类被声明为 `private`。该功能存在的一个镜是为了定义仅对包含类私有的类，这样命名空间中的其他代码代码就无法访问它们。另一个原因是嵌套类可以访问其包含类的私有和保护成员。接下来的“尝试一下”将探讨这一特性。\n\
  \n### 接口实现\n\n本节将详细介绍如何定义和实现接口。在上一章中，你学习了接口的定义方式类似于类，使用了如下代码：\n\n```csharp\ninterface\
  \ IMyInterface\n{\n   // 接口成员。\n}\n```\n\n接口成员的定义方式类似于类成员，但有几个重要的不同点：\n\n- 不允许使用访问修饰符（`public`、`private`、`protected`\
  \ 或 `internal`）——所有接口成员隐式为公共。\n- 接口成员不能包含代码体。\n- 接口不能定义字段成员。\n- 接口成员不能使用 `static`、`virtual`、`abstract`\
  \ 或 `sealed` 关键字定义。\n- 禁止类型定义成员。\n\n然而，如果你想隐藏继承自基接口的成员，可以使用 `new` 关键字定义成员：\n\n```csharp\n\
  interface IMyBaseInterface\n{\n   void DoSomething();\n}\ninterface IMyDerivedInterface\
  \ : IMyBaseInterface\n{\n   new void DoSomething();\n}\n```\n\n它的工作方式与隐藏继承的类成员完全相同。\n\
  \n在接口中定义的属性定义了允许该属性的一个或两个访问访问块——`get` 和 `set`，如下所示：\n\n```csharp\ninterface IMyInterface\n\
  {\n   int MyInt { get; set; }\n}\n```\n\n在这里，`int` 属性 `MyInt` 同时具有 `get` 和 `set`\
  \ 访问器。对于访问权限限制更严格的属性，可以省略其中任何一个。\n\n接口不指定属性数据应如何存储。例如，接口无法指定可能用于存储属性数据的字段。最后，接口像类一样，可以定义为类的成员（但不能作为其他接口的成员，因为接口不能包含类型定义）。\n\
  \n字体 在类实现接口\n\n实现接口的类必须包含该接口所有成员的实现，这些实现必须匹配指定的签名（包括匹配指定的 `get` 和 `set` 块），并且必须是公共的，如下所示：\n\
  \n```csharp\npublic interface IMyInterface\n{\n   void DoSomething();\n   void DoSomethingElse();\n\
  }\npublic class MyClass : IMyInterface\n{\n   public void DoSomething() {}\n   public\
  \ void DoSomethingElse() {}\n}\n```\n\n可以使用 `virtual` 或 `abstract` 关键字实现接口成员，但不能使用\
  \ `static` 或 `const`。接口成员也可以基类上实现：\n\n```csharp\npublic interface IMyInterface\n\
  {\n   void DoSomething();\n   void DoSomethingElse();\n}\npublic class MyBaseClass\n\
  {\n   public void DoSomething() {}\n}\npublic class MyDerivedClass : MyBaseClass,\
  \ IMyInterface\n{\n   public void DoSomethingElse() {}\n}\n```\n\n从实现给定接口的基类继承意味着派生类隐式地支持该接口。这里有一个示例：\n\
  \n```csharp\npublic interface IMyInterface\n{\n   void DoSomething();\n   void DoSomethingElse();\n\
  }\npublic class MyBaseClass : IMyInterface\n{\n   public virtual void DoSomething()\
  \ {}\n   public virtual void DoSomethingElse() {}\n}\npublic class MyDerivedClass\
  \ : MyBaseClass\n{\n   public override void DoSomething() {}\n}\n```\n\n显然，在基类中将实现定义为\
  \ `virtual` 是很有用的，这样派生类就可以替换实现而不是隐藏它。如果你使用 `new` 关键字隐藏基类成员，而不是通过这种方式重写，那么方法 `IMyInterface.DoSomething()`\
  \ 即使在使用派生类也会始终指向基类版本。\n\n#### 显式接口实现\n\n接口成员也可以由类*显式地*实现。如果你这样做，该成员只能通过接口访问，而不能通过类访问。*隐式*成员（你在上一节中使用的）可以通过两种方式访问。\n\
  \n例如，如果 `MyClass` 隐式地实现了 `IMyInterface` 的 `DoSomething()` 方法，那么下面的代码是有效的：\n\n```csharp\n\
  MyClass myObj = new MyClass();\nmyObj.DoSomething();\n```\n\n这种方式也是有效的：\n\n```csharp\n\
  MyClass myObj = new MyClass();\nIMyInterface myInt = myObj;\nmyInt.DoSomething();\n\
  ```\n\n或者，如果 `MyDerivedClass` 显式地实现 `DoSomething()`，那么只有后一种技术是允许的。这样做的代码如下：\n\n\
  ```csharp\npublic class MyClass : IMyInterface\n{\n   void IMyInterface.DoSomething()\
  \ {}\n   public void DoSomethingElse() {}\n}\n```\n\n在这里，`DoSomething()` 是显式的，`DoSomethingElse()`\
  \ 是隐式的。只有后者可以直接访问。\n\n#### 额外的属性访问器\n\n之前你学过，如果你实现一个带有属性的接口，必须实现匹配的 `get/set` 访问器。这并不完全正确——对于接口仅包含\
  \ `set` 块的属性，你可以在类中为其添加一个 `get` 块，反之亦然。然而，这只有在隐式实现接口时才可行。此外，在大多数情况下，你会希望添加一个访问权限比接口定义的访问器访问权限更严格的访问性修饰符。由于接口定义的访问器根据定义是公共的，这意味着你添加的是非公共访问器。这里有一个示例：\n\
  \n```csharp\npublic interface IMyInterface\n{\n   int MyIntProperty { get; }\n}\n\
  public class MyBaseClass : IMyInterface\n{\n   public int MyIntProperty { get; protected\
  \ set; }\n}\n```\n\n如果你将额外的访问器定义为 `public`，那么拥有实现接口类的代码就可以访问它。然而，仅访问接口的代码将无法访问它。\n\
  \n\n\n\n当你创建一个包含许多类型成员的类时，代码可能会变得非常混乱，代码文件也会变得非常长。一种可以帮助解决问题的技术（你在之前的章节中已经接触过）是使用代码大纲。通过在代码中定义区域（regions），你可以折叠和展开部分，使代码更易读。例如，你可能定义了这样一个类：\n\
  \n```java\npublic class MyClass\n{\n   #region Fields\n   private int myInt;\n \
  \  #endregion\n   #region Constructor\n   public MyClass() { myInt = 99; }\n   #endregion\n\
  \   #region Properties\n   public int MyInt\n   {\n      get { return myInt; }\n\
  \      set { myInt = value; }\n   }\n   #endregion\n   #region Methods\n   public\
  \ void DoSomething()\n   {\n      // Do something..\n   }\n   #endregion\n}\n```\n\
  \n在这里，你可以展开和收叠类的字段、属性、构造函数和方法，让你只关注你感兴趣的内容。这种方法还可以嵌套区域，因此某些区域只在包含它们的区域被展开时才可见。\n\
  \n使用区域的替代方案是使用 `partial class definitions`（部分类定义）。简单来说，你使用部分类定义将类的定义拆分到多个文件中。例如，你可以将字段、属性和构造函数放在一个文件中，将方法放在另一个文件中。要实现这一点，你只需要在包含定义部分的每个文件的类中使用\
  \ `partial` 关键字，如下：\n\n```java\npublic partial class MyClass {  …}\n```\n\n如果你使用部分类定义，则\
  \ `partial` 关键字必须出现在每个包含定义部分的文件中的该位置。\n\n例如，在名为 `MainWindow` 的类中的 WPF 窗口的代码存储在 `MainWindow.xaml.cs`\
  \ 和 `MainWindow.g.i.cs` 中（如果在解决方案窗口中选择了“显示所有文件”并深入到 `obj\\Debug` 文件夹，就可以看到它们）。这让你能够专注于表单的功能，而无需担心代码被那些你并不感兴趣的信息所扰乱。\n\
  \n关于部分类的最后一点说明：应用于一个部分类部分的接口将应用于整个类，这意味着如下定义：\n\n```java\npublic partial class MyClass\
  \ : IMyInterface1 {  … }\npublic partial class MyClass : IMyInterface2 {  … }\n\
  ```\n\n等同于：\n\n```java\npublic class MyClass : IMyInterface1, IMyInterface2 { …\
  \ }\n```\n\n部分类定义可以在单个部分类定义中包含一个基类，也可以包含多个部分类定义。然而，如果在多个定义中指定了基类，它必须是**同一个**基类；请记住，C#\
  \ 中的类只能继承自一个基类。\n\n## 部分方法定义 (Partial Method Definitions)\n\n部分类还可以定义部分方法。部分方法定义在一个部分类定义中，且没有方法体，并在另一个部分类定义中实现。在在这两个地方，都使用了\
  \ `partial` 关键字：\n\n```java\npublic partial class MyClass\n{\n   partial void MyPartialMethod();\n\
  }\npublic partial class MyClass\n{\n   partial void MyPartialMethod()\n   {\n  \
  \    // 方法实现\n   }\n}\n```\n\n部分方法也可以是静态的，但它们始终是私有的，且不能有返回值。它们使用的任何参数不能是 `out` 参数，但可以是\
  \ `ref` 参数。它们不能使用 `virtual`、`abstract`、`override`、`new`、`sealed` 或 `extern` 修饰符。\n\
  \n鉴于这些限制，部分方法起到什么作用并不显而易见。事实上，它们在代码编译而非使用方面是非常重要的。请考虑以下代码：\n\n```java\npublic partial\
  \ class MyClass\n{\n   partial void DoSomethingElse();\n   public void DoSomething()\n\
  \   {\n      WriteLine(\"DoSomething() execution started.\");\n      DoSomethingElse();\n\
  \      WriteLine(\"DoSomething() execution finished.\");\n   }\n}\npublic partial\
  \ class MyClass\n{\n   partial void DoSomethingElse() =>\n      WriteLine(\"DoSomethingElse()\
  \ called.\");\n}\n```\n\n在这里，部分方法 `DoSomethingElse()` 在第一个部分类定义中定义并调用，在第二个定义中实现。当从控制应用程序调用\
  \ `DoSomething()` 时，输出将是你预期的：\n\n```\nDoSomething() execution started.\nDoSomethingElse()\
  \ called.\nDoSomething() execution finished.\n```\n\n如果你完全删除了第二个部分类定义或部分方法实现（或者注释掉该部分代码），输出将如下：\n\
  \n```\nDoSomething() execution started.\nDoSomething() execution finished.\n```\n\
  \n你可能认为这里发生的情况是：当调用 `DoSomethingElse()` 时，运行时发现该方法没有实现，因此继续执行下一行代码。实际上发生的情况要微妙得多。当你编译包含没有实现的部分方法的代码时，编译器实际上会完全移除该方法。它还会移除任何对该方法的调用。当你执行代码时，不会对实现进行检查，因为没有可供检查的调用。这导致了性能的微小但尽管是显著的提升。\n\
  \n与部分类一样，部分方法在自定义自动生成或设计器创建的代码时非常有用。设计器可能会声明部分方法，你可以根据情况选择是否实现它们。如果你没有实现它们，就不会产生性能影响，因为该方法在编译后的代码中实际上并不存在。\n\
  \n到此，请考虑为什么部分方法不能有返回值。如果你能用自己满意的答案来回答这个问题，你就可以确定自己完全理解了这一主题——所以就把这个问题留给你自己作为练习题。\n\
  \n## 示例应用程序 (Example Application)\n\n为了说明你目前为止所使用的一些技术，在本节中你将开发一个类模块，你可以在此基础上进行构建并在后续章节中使用。该类模块包含两个类：\n\
  \n*   `Card` —— 代表标准扑克牌，具有黑花、方片、红心或梅桃花花色，以及介于 A 和 K 之间的等级。\n*   `Deck` —— 代表一副 52\
  \ 张的牌组，可以通过组中的位置访问牌，并具有洗牌组的能力。\n\n你还将开发一个简单的客户端以确保一切运行正常，但你还不会在完整的游戏应用程序中使用牌组。\n\
  \n### 规划应用程序 (Planning the Application)\n\n此应用程序的类库 `Ch10CardLib` 将包含你的类。然而，在编写任何代码之前，你应该规划好类所需的结构和功能。\n\
  \n#### Card 类 (The Card Class)\n\n`Card` 类基本上是一个包含两个只读字段的容器：`suit`（花色）和 `rank`（等级）。将字段设置为只读的原因是创建一个“空白”牌没有意义，而且牌在创建后不应该改变。为了方便这一点，你把默认构造函数设为私有，并提供另一种构造函数，根据提供的花色和等级来构建牌。\n\
  \n除此之外，`Card` 类将重写 `System`.`Object` 的 `ToString()` 方法，以便你轻松获取表示牌的可读字符串。为了让事情更简单，你将为两个字段\
  \ `suit` 和 `rank` 提供枚举。\n\n`Card` 类如图图 10-4 所示。\n\n[content]\n```\n![示意图标记为 Card\
  \ 的框，带有两个部分 +suit 和 +rank，以及 +ToString()。](img/c10f004.jpg)\n```\n**图 10.4**\n[/content]\n\
  \n#### Deck 类 (The Deck Class)\n\n\n\n\n`Deck` 类将维护 52 个 `Card` 对象。你可以使用一个简单的数组类型来实现此。。数组不会被直接访问，因为对\
  \ `Card` 对象的访问是通过 `GetCard()` 方法实现的，该方法返回给定索引的 `Card` 对象。此类还应该暴露一个 `Shuffle()` 方法，以重新排列数组中的卡片。`Deck`\
  \ 类如 图 10-5 所示。\n\n![两个标记为 Card 和 Deck 的框的示意图。Deck 类显示了两个用于卡片的区域：-cards:Cards[]\
  \ 和 +GetCard(),+Deck(), 和 +Shuffled()。两个框通过一条标记为 0...* 和 1\\. 的线连接。](images/c10f005.jpg)\n\
  \n`图 10.5**\n\n## 编写类库\n\n为了本示例，假设你对 IDE 足够熟悉，可以跳过标准的“试用下”（Try It Out）格式，因此没有没有列出具体步骤，因为这些是你已经使用过许多次的步骤。这里的重点是对代码进行详细查看。尽管如此，文中包含了一些提示，以确保你在此过程中不会遇到任何问题。\n\
  \n你的类和枚举将包含在一个名为 `Ch10CardLib` 的类库项目中。该项目将包含四个 `.cs` 文件：`Card.cs`（包含 `Card` 类的定义）、`Deck.cs`（包含\
  \ `Deck` 类的定义）以及包含枚举的 `Suit.cs` 和 `Rank.cs` 文件。\n\n你可以使用 Visual Studio 类图工具组合出许多代码。\n\
  \n要开始之前，你需要执行以下操作：\n\n1. 创建一个名为 `Ch10CardLib` 的新类库项目，并将其保存到目录 `C:\\BegVCSharp\\\
  Chapter10` 中。\n2. 从项目中删除 `Class1.cs`。\n3. 使用解决方案管理器（Solution Explorer）窗口打开项目的类图（右键点击项目，然后点击\
  \ View ![1](img/arrow.png) View Class Diagram）。类图开始时应该是空的，因为项目不包含任何类。\n\n### 添加\
