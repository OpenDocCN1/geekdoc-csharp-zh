  \ 代码下载可以在“下载代码”选项卡中的 `www.wrox.com/go/beginningvisualc#2015programming` 找到。代码位于第\
  \ 17 章下载中，并根据章节中的名称单独命名。\n\n现在你已经花了一些时间学习云和云编程，让我们继续，编写一些比上一章稍微复杂一点的 `C#` 代码。在本章中，你将继续探索\
