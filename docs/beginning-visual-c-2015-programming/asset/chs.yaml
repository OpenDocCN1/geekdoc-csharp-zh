  \ Wiley & Sons, Inc. 与书中提到的任何产品均无关。\n\n# 关于作者\n\n**Benjamin Perkins** (MBA, MCSD,\
  \ ITIL) 目前在德国慕尼黑微软担任 `IIS`、`ASP.NET` 和 Azure 服务的高级顾问。他在 IT 行业已工作了二十年。他在 11 岁时用 Atari1200\
  \ 桌面电脑开始学习编程 `QBasic`。高中毕业后加入了美国陆军。成功完成兵役后，他就读于德克萨斯州 A&M 大学，获得信息系统管理学学士学位。\n\n他在\
  \ IT 行业的角色涵盖了从程序员、系统架构师、技术支持工程师到团队负责人和中层管理。在惠普公司工作期间，他获得了许多奖项、学位和认证。他热爱技术和客户服务，并期待解决故障和编写更多世界级的解决方案。\n\
  \n“我的方法是从支持的角度来编写代码，并一次性到位，这样我们就不需要回来，除非对其进行增强。”\n\nBenjamin 与 Andrea 有两个可爱的孩子 Lea\
  \ 和 Noa。\n\n**Jacob Vibe Hammer** 是 Kamstrup 的软件架构师和开发者，在那里他帮助公司开发世界级的智能电网解决方案。他开始编程的时间大约是在他能拼出“BASIC”这个词的时候——碰巧，这也是他使用的第一种编程语言。从那时，他处理过许多编程语言和解决方案架构；但自本世纪以来，他主要处理\
  \ .NET 平台。如今，他的编程时间主要用于处理 `C#` 和 `WPF`，并尝试 NoSQL 数据库。Jacob 是丹麦公民，与妻子和两个儿子住在丹麦奥尔胡萨。\n\
  \n**Jon D. Reid** 是 IFS 现场服务的产品解决方案经理 ([www.IFSWORLD.com`](http://www.IFSWORLD.com))。他合著过多本书，包括\
  \ *Beginning Visual C# 2010*、*Fast Track C#*、*Pro Visual Studio .NET* 等等。\n\n# 关于技术编辑\n\
  \n\n\n\nJohn Mueller 是一位自由职业作家和技术编辑。他血液里流淌着写作的基因，迄今已编写了 99 本书和 600 多篇文章。他涵盖的主题从网络技术到人工智能，从数据库管理到潜心编程。他目前编写的一些书籍包括关于初学者\
