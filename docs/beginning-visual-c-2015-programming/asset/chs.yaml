  \ | 返回以 `XmlNodeList` 类形式表示的节点集合。 |\n\n**表 19.7** (#c19.xhtml_c19-tbl-0007) 选择节点的方法\n\
  \n## 将 XML 转换为 JSON\n\n我们在本章的引言中提到了 JSON 数据语言。C# 系统库对 JSON 的支持有限，但你可以使用免费的第三方 JSON\
  \ 库来处理 JSON，将 XML 转换为 JSON 反之亦然，并进行类似于 .NET XML 类的其他 JSON 操作。通过 Visual Studio 中的\
  \ NuGet 包管理器可以获取的可用库之一是 Newtonsoft JSON.NET 包。该包的帮助文档和完整教程可以在 [`www.json.net`](http://www.json.net)\
  \ 获取。\n\n接下来的简短“试一试”扩展了你在本章之前示例中创建的应用程序，包含将 XML 转换为 JSON 的功能。\n\n## 使用 XPath 搜索\
  \ XML\n\nXPath 是一种用于 XML 文档的查询语言，类似于 SQL 之于关系数据库。它用于表 19.7 中描述的两个方法，这两个方法让你能够避免遍历\
  \ XML 文档整个树的麻烦。不过，这确实需要一点适应，因为语法与 SQL 或 C# 完全不同。\n\n为了正确看到 XPath 的作用，你将使用一个名为 `Elements.xml`\
  \ 的 XML 文件，它包含了元素表中化学元素的部分列表。你将在本章稍后的“选择节点”“试一试”示例中找到该 XML 的子集，并可以在本书网站的本章节下载代码中找到\
  \ `Elements.xml`。\n\n[表 19.8] (#c19.xhtml_c19-tbl-anc-0008) 列出了你使用 XPath 时可以执行的一些最常见操作。如果没有另有说明，XPath\
  \ 查询示例所做的选择是相对于执行该查询的节点的。在需要节点名称时，你可以假设当前节点是 XML 文档中的 `<element>` 节点。\n\n| **目的**\
  \ | **XPath 查询示例** |\n| :--- | :--- |\n| 选择当前节点。 | `.` |\n| 选择当前节点的父节点。 | `..` |\n\
  | 选择当前节点的所有子节点。 | `*` |\n| 选择具有特定名称的所有子节点——在本例中为 `title`。 | `Title` |\n| 选择当前节点的属性。\
  \ | `@Type` |\n| 选择当前节点的所有属性。 | `@*` |\n| 通过索引选择子节点——在本例中为第二个元素。 | `element[2]`\
  \ |\n| 选择当前节点的所有文本节点。 | `text()` |\n| 选择当前节点的一个或多个孙节点。 | `element/text()` |\n| 选择文档中具有特定名称的所有节点——在本例中为所有\
  \ `mass` 节点。 | `//mass` |\n| 选择文档中具有特定名称和特定父节点名称的节点——在本例中父节点名称为 `element`，节点名称为\
  \ `name`。 | `//element/name` |\n| 选择符合值标准的节点——在本例中元素名为 `Hydrogen` 的元素。 | `//element[name='Hydrogen']`\
  \ |\n| 选择符合属性标准的节点——在本例中 `Type` 属性为 `Noble Gas`。 | `//element[@Type='Noble Gas']`\
