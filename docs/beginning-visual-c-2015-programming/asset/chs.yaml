  \ `ASP.NET Web Site` 中消费它。\n\n在创建、部署和消费了 `ASP.NET Web API` 之后，你将学习如何扩展它。如果你创建的云程序变得流行，理解扩展的概念至关重要。本章的示例使用了免费的\
  \ `Microsoft Azure` 云资源。这些免费资源具有较低的 `CPU`、内存和带宽阈值，在高用量下很容易被突破。你将学习如何在适当的情况下进行扩展，以避免因资源阈值突破而导致云程序被挂起。\n\
  \n## 创建 ASP.NET Web API\n\n应用程序编程接口（`API`）计算机编程概念已经存在几十年了，通常被描述为包含一组构建软件程序有用函数的模块。\n\
  \n最初，从 Windows 客户端应用程序的角度来看，这些模块是动态链接库（`.dll`），并暴露了可以通过编程访问的接口，将内部函数暴露给其他程序。在这样的系统中，当消费程序使用\
  \ `API` 时，它就依赖于接口的模式。接口的更改会导致消费程序出现异常和失败，因为当前访问和执行模块内函数的程序不再有效。一旦程序依赖于接口，就不应该被更改，而当发生更改时，该事件通常被称为\
  \ `DLL 地狱`。有关 `DLL 地狱` 的更多信息，请参阅此文章：`http://www.desaware.com/tech/dllhell.aspx`。\n\
  \n随着时间的推移，互联网和内部网解决方案的实现成为主流，对 Web 服务和 Windows 通信基础（`WCF`）等技术的依赖产生了。Web 服务和 `WCF`\
  \ 都暴露了正式的合约接口，将它们包含的函数暴露给其他程序。与之前提到的模块与消费程序位于同一台计算机上的 `DLL API` 不同，Web 服务和 `WCF`\
  \ 托管在 Web 服务器上。由于托管在互联网或内部网 Web 服务器上，对 Web 接口的访问不再局限于单台计算机，从任何设备、任何具有 Internet 或网络化内部网连接的地方都可以进行。\n\
  \n回想上一章中对云优化栈的分析。从你学到的讨论中可以得知，为了实现云优化，程序必须具有较小的资源占用、能够处理高吞吐量并且支持跨平台。`ASP.NET Web\
  \ API` 基于 `ASP.NET MVC`（模型、视图、控制器）概念，这直接符合新的云优化栈定义。如果你在过去创建和/或使用过 Web 服务或 `WCF`，你将发现相比之下，`ASP.NET\
  \ Web API` 要简单紧凑得多。如果你从未用过任何一种，请听我的：确实如此。\n\n在下面的“尝试一下”中，你将创建一个牌的 `ASP.NET Web API`。\n\
  \n现在你已经创建了 `ASP.NET Web API`，请进入下一节以学习 Web API 的部署和消费。\n\n## 在 Microsoft Azure 上部署和消费\
  \ ASP.NET Web API\n\n\n\n\n将您的 Web App 部署到 Microsoft Azure 平台有许多选择。最流行的方法之一是通过本地\
  \ Git 仓库或托管在 GitHub 上的公共 Git 仓库。本地和公共 Git 仓库都提供版本控制功能，这是一个非常实用的特性。有了版本控制，开发者和发布人员就可以了解进行了哪些具体的更改、何时进行的以及由谁执行。如果在编译二进制文件或将更改部署到活动环境时出现问题或意外异常，可以很容易找到联系人进行处理。其他可以集成到\
  \ Microsoft Azure 的部署平台还包括 Team Foundation Services、CodePlex 和 Bitbucket 等。\n\n\
  由于上一个“尝试一下”中的代码是不包含在版本控制仓库中的独立项目，因此部署直接在 IDE 中完成的，在本例中为 Visual Studio 2015。部署未包含源代码仓库的解决方案的其他方法还包括\
  \ Web Deploy（`msdeploy.exe`）和 FTP。\n\n完成下面的“尝试一下”，将 ASP.NET Web API 部署到 Microsoft\
  \ Azure Web App。\n\n您可能考虑利用上一个“尝试一下”中学到的知识，将此 ASP.NET Web 站点部署到 Microsoft Azure\
  \ 平台。例如，只需右键点击 `Ch17Ex02` 解决方案，选择 `Publish Web App` 并按照发布向导操作即可。创建一个名为 `handofcards-consumer`\
  \ 的 Web App 后，即可通过 `http://handofcards-consumer.azurewebsites.net/` 访问。由于 ASP.NET\
  \ Web API 和 Microsoft Azure Blob 容器都可以从世界任何地方通过互联网访问，将 ASP.NET Web 站点放置在 Azure 上将产生相同的结果（获得一组牌牌）。\n\
  \n随着时间的推移，如果消费者或 API 变得流行并开始接收大量请求，在免费模式下运行 Web Apps 可能会导致资源阈值突破，从而使资源不可用。这并不理想。在下一节中，您将学习如何扩展在\
  \ Microsoft Azure 平台上作为 Web App 运行的 ASP.NET Web API，以便用户和客户在需要时访问您的响应式 Web 资源。\n\
  \n## 在 Microsoft Azure 上扩展 ASP.NET Web API\n\n扩展以满足用户需求过去曾是一项非常繁琐、耗时且昂贵的活动。在历史上，当公司想要增加服务器容量以支持更多流量时，需要将物理硬件进行采购、组装并配置到数据中心中。然后，一旦硬件接入网络，就会交给应用程序所有者安装并配置操作系统、所需的组件以及应用程序源代码。执行此类任务所需的时间导致公司必须安装大量的物理容量来管理高峰期间的使用情况；然而，在非高峰期间，额外的容量完全没有被使用并处于闲置，这非常昂贵且非最优的资源分配方式。\n\
  \n更好的方法是使用如 Microsoft Azure 之类的云平台，这些平台提供了在需要资源时优化利用物理资源进行向上、向下和水平扩展的能力。当您需要 CPU、磁盘空间或内存等物理资源时，您可以向上或水平扩展以满足需求；而当对您的云托管服务的需求减少时，您可以缩小规模，并将资金留作用于其他项目和服务。\n\
  \n本章的剩余部分将说明如何根据 CPU 需求以及在特定时间段内扩展 ASP.NET Web API。\n\n自动缩放功能对于管理 Web App 的意外使用峰值和请求非常有用。然而，如果您已经知道客户或用户何时与您的\
  \ Web App 交互，您可以提前计划，并在实际需要之前稍早准备好额外的实例。这样做的好处是，您无需根据 CPU 使用情况逐渐增加或减少实例，而可以在该特定时间段内立即扩展到所需的\
  \ CPU 数量和内存量。例如，如果您知道营销部门在 10 月份正在开展活动，您可以安排在那个月提供额外的资源。通过让所需的资源就绪并预热，您可以避免在为用户或客户分配资源时出现任何延迟。执行后续“尝试一下”中描述的步骤查看如何操作。\n\
  \n当您为扩展 Web App 创建计划时，需要提供名称、开始日期、开始时间、结束日期和结束时间。有了这些信息，Microsoft Azure 平台将管理可用实例的数量，这些实例是在配置的时间范围内为您的\
  \ Web App 提供服务的虚拟机。由于可以创建许多计划，每个计划都有自己的实例数量和缩放设置。只需创建计划并保存，在需要时从计划下拉菜单中选择，资源将如预期般可用。\n\
  \n## ![image](img/c02g003.jpg) 您在本章中学习到的知识\n\n| 主题 | 核心概念 |\n| :--- | :--- |\n|\
  \ ASP.NET Web API | ASP.NET Web API 是一种互联网或局域网接口，暴露外部程序调用的方法。 |\n| 部署到云端 | 使用 Visual\
  \ Studio、WebDeploy、Git 或 FTP 等工具将您的程序部署到云端。 |\n| 调用 Web API | ASP.NET Web API 在\
  \ JSON 文件中返回方法的输出。使用 `Newtonsoft.Json` 类库来解析并使用其内容。 |\n| 在云端扩展 | Microsoft Azure\
  \ Web Apps 允许您根据定义的计划或 CPU 使用情况进行自动扩展。在需要更多资源时向上扩展，在不再需要时向下扩展是云最有价值的优势之一。 |\n\n\
  # 第四部分\n\n## 数据访问\n\n* 第 18 章: 文件\n* 第 19 章: XML 和 JSON\n* 第 20 章: LINQ\n* 第 21\
  \ 章: 数据库\n\n# 第 18 章：文件\n\n## Wrox.com 本章代码下载\n\n您可以在 [`www.wrox.com/go/beginningc#2015programming`](http://www.wrox.com/go/beginningc#2015programming)\
  \ 下载选项卡找到本章的 Wrox.com 代码。代码位于第 18 章](#c18.xhtml) 下载包中，程序名称与示例中的名称一致。\n\n文件是存储应用程序实例之间数据的极佳方法，也可用于应用程序之间的数据传输。用户和应用程序设置可以被存储以便下次运行应用程序时检索。\n\
  \n本章将介绍如何在应用程序中有效使用文件，涉及用于创建、读取和写入文件的主要类，以及用于 C# 代码操作文件系统的辅助类。虽然我们不会详细检查所有类，但本章提供的深度足以让您对概念和基础知识有良好的了解。\n\
  \n\n\n\n| `Directory` | 一个静态工具类，它暴露了许多用于移动、复制和删除目录的静态方法。 |\n| `Path` | 一个用于处理路径名称的工具类。\
  \ |\n| `FileInfo` | 代表磁盘上的物理文件，并拥有操作该文件的方法。对于对该文件的任何读取或写入，必须创建一个 `Stream` 对象。 |\n\
  | `DirectoryInfo` | 代表磁盘上的物理目录，并拥有操作该目录的方法。 |\n| `FileSystemInfo` | 作为 `FileInfo`\
  \ 和 `DirectoryInfo` 的基类，它允许通过多态性同时处理文件和目录。 |\n| `FileSystemWatcher` | 你在本章中检查的类中最高先进的类类。它被用于监控文件和目录，并暴露了某些事件，当这些位置发生更改时，你的应用程序可以捕获这些事件。\
  \ |\n\n#### **表 18.1**](#c18.xhtml_c18-tbl-anc-0001) 文件系统访问类\n\n你还将查看 `System.IO.Compression`\
  \ 命名空间，它允许你从压缩文件中读取并向其写入。特别是，你将查看以下两个流类：\n\n* `DeflateStream` — 代表一个流，数据在写入时自动压缩，或在读取时自动解压缩。压缩使用\
  \ Deflate 算法实现。\n* `GZipStream` — 代表一个流，数据在写入时自动压缩，或在读取时自动解压缩。压缩使用 GZIP (GNU Zip)\
  \ 算法实现。\n\n### 文件和目录类\n\n`File` 和 `Directory` 工具类暴露了许多静态方法，令人惊讶的是，这些方法用于操作文件和目录。这些方法使得移动文件、查询和更新属性以及创建\
  \ `FileStream` 对象成为可能。正如你在第 8 章中所学习的，静态方法可以在类上调用，而无需创建它们的实例。\n\n`File` 类的一些最用的静态方法如表\
  \ 18.2 所示。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `Copy()` | 将文件从源位置复制到目标位置。 |\n| `Create()`\
  \ | 在指定的路径上创建文件。 |\n| `Delete()` | 删除文件。 |\n| `Open()` | 返回指定路径处的 `FileStream` 对象。\
  \ |\n| `Move()` | 将指定的文件移动到新位置。你可以为新位置上的文件指定不同的名称。 |\n\n#### **表 18.2**](#c18.xhtml_c18-tbl-anc-0002)\
  \ File 类的静态方法\n\n`Directory` 类的一些实用静态方法如表 18.3 所示。\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `CreateDirectory()` | 创建指定路径的目录。 |\n| `Delete()` | 删除指定的目录及其内部的所有文件。 |\n\
  | `GetDirectories()` | 返回一个 `string` 对象数组，表示指定目录下的子目录的名称。 |\n| `EnumerateDirectories()`\
  \ | 类似于 `GetDirectories()`，但返回一个包含目录名称的 `IEnumerable<string>` 集合。 |\n| `GetFiles()`\
  \ | 返回一个 `string` 对象数组，表示指定目录中的文件的名称。 |\n| `EnumerateFiles()` | 类似于 `GetFiles()`，但返回一个包含文件名的\
  \ `IEnumerable<string>` 集合。 |\n| `GetFileSystemEntries()` | 返回一个 `string` 对象数组，表示指定目录中的文件和目录的名称。\
  \ |\n| `EnumerateFileSystemEntries()` | 类似于 `GetFileSystemEntries()`，但返回一个包含文件和目录名称的\
  \ `IEnumerable<string>` 集合。 |\n| `Move()` | 将目录移动到新位置。你可以为新位置上的目录指定不同的名称。 |\n\n\
  #### **表 18.3**](#c18.xhtml_c18-tbl-anc-0003) Directory 类的静态方法\n\n\n\n\n\n| `Directory`\
  \ | 获取表示包含当前文件的目录的 `DirectoryInfo` 对象。此属性是只读的。 |\n| `DirectoryName` | 返回文件目录的路径。此属性是只读的。\
  \ |\n| `IsReadOnly` | 文件只读属性的快捷方式。此属性也可以通过 `Attributes` 访问。 |\n| `Length` | 获取以字节为单位的文件大小，以\
  \ `long` 类型返回。此属性是只读的。 |\n\n**表 18.5** FileInfo 属性\n\n### DirectoryInfo 类\n\n`DirectoryInfo`\
  \ 类的工作方式与 `FileInfo` 类完全相同。它是一个实例化的对象，代表机器上的单个目录。与 `FileInfo` 类一样，许多方法调用在 `Directory`\
  \ 和 `DirectoryInfo` 之间是重复的。选择使用 `File` 方法还是 `FileInfo` 方法的准则同样适用于 `DirectoryInfo`\
  \ 方法：\n\n* 如果你只进行单次调用，请使用静态 `Directory` 类。\n* 如果你正在进行一系列调用，请使用实例化的 `DirectoryInfo`\
  \ 对象。\n\n`DirectoryInfo` 类从 `FileSystemInfo` 继承了大部分属性，`FileInfo` 也是如此，尽管这些属性操作的是目录而不是文件。还有两个\
  \ `DirectoryInfo` 特有的属性，如 表 18.6 所示。\n\n| **属性** | **描述** |\n| :--- | :--- |\n|\
  \ `Parent` | 获取表示包含当前目录的目录的 `DirectoryInfo` 对象。此属性是只读的。 |\n| `Root` | 获取表示当前卷根目录的\
  \ `DirectoryInfo` 对象——例如 `C:\\` 目录。此属性是只读的。 |\n\n**表 18.6** DirectoryInfo 类有的属性\n\
  \n### 路径名称和相对路径\n\n在 .NET 代码中指定路径名时，可以使用绝对路径名或相对路径名。绝对路径名显式指定来自已知位置（例如 `C:` 驱动器）的文件或目录。例如\
  \ `C:\\Work\\LogFile.txt` —— 此路径精确定义了文件所在的位置，没有任何歧义。\n\n相对路径名相对于一个起始位置。通过使用相对路径名，不需要指定驱动器或已知位置。你之前见过过这一点，即当前工作目录就是起始点，这是相对路径名的默认行为。例如，如果你的应用程序在\
  \ `C:\\Development\\FileDemo` 目录中运行并使用相对路径 `LogFile.txt`，则文件引用将是 `C:\\Development\\\
  FileDemo\\LogFile.txt`。要“向上”移动一个目录，可以使用字符串 `..`。因此，在同一个应用程序中，路径 `..\\Log.txt` 指向文件\
  \ `C:\\Development\\Log.txt`。\n\n如前所示，工作目录最初被设置为应用程序运行的目录。当你使用 Visual Studio 进行开发时，这意味着应用程序位于你创建的项目文件夹下方的几级目录之下。它通常位于\
  \ `ProjectName\\bin\\Debug`。若要访问项目根文件夹中的文件，你必须通过 `..\\..\\` 向上移动两个目录。你将在本章中经常看到这种情况。\n\
  \n如果需要，你可以使用 `Directory.GetCurrentDirectory()` 确定工作目录，或者使用 `Directory.SetCurrentDirectory()`\
  \ 将其设置为新路径。\n\n## 流 (Streams)\n\n.NET Framework 中的所有输入输出都涉及流的使用。流是串行设备的抽象表示。串行设备是以线性方式存储和/或访问数据的设备，即一次一个字节，按顺序进行。这种设备可以是磁盘文件、网络通道、内存位置或任何支持线性读取、写入或两者兼具的对象。通过保持设备的抽象性，可以隐藏流的底层目标/源。这种抽象级别使得代码可以被重用，并允许你编写更通用的例程，因为你不需要担心数据传输实际发生的细节。因此，当应用程序从文件输入流、网络输入流或任何其他流读取数据时，相似的代码可以被传输和重用。由于你可以忽略每个设备的物理机制，因此在处理文件流时，你不需要担心例如硬盘头或内存分配问题。\n\
  \n流可以代表几乎任何源，如键盘、物理磁盘文件、网络位置、打印机，甚至是另一个程序，但本章侧重于读取和写入磁盘文件。应用于读取/写入磁盘文件的概念适用于大多数设备，因此你将获得流的基本了解，并学习一种可以应用于许多情况的成熟方法。\n\
  \n### 使用流的类\n\n用于流的类包含在与 `File` 和 `Directory` 类相同的 `System.IO` 命名空间中。这些类列在 表 18.7\
  \ 中。\n\n| **类** | **描述** |\n| :--- | :--- |\n| `FileStream` | 表示可以写入、读取或两者兼具的文件。该文件可以异步或同步地进行写入和读取。\
  \ |\n| `StreamReader` | 从流读取字符数据，可以使用 `FileStream` 为基类创建。 |\n| `StreamWriter` |\
  \ 向流写入字符数据，可以使用 `FileStream` 为基类创建。 |\n\n**表 18.7** 流类\n\n现在来看如何使用这些类。\n\n### FileStream\
  \ 对象\n\n`FileStream` 对象代表指向磁盘或网络路径文件的流。虽然该类暴露了读写字节的方法，但你通常会使用 `StreamReader` 或 `StreamWriter`\
  \ 来执行这些功能。这是因为 `FileStream` 类操作字节和字节数组，而 `Stream` 类操作字符数据。字符数据更容易处理，但某些操作（如对文件某处进行随机访问）只能通过\
  \ `FileStream` 对象执行。你将在本章稍后部分学习更多。\n\n有几种方法可以创建 `FileStream` 对象。构造函数有很多重载，但简单的接受两个参数：文件名和一个\
  \ `FileMode` 枚举值：\n\n```\nFileStream aFile = new FileStream(filename, FileMode.<Member>);\n\
  ```\n\n`FileMode` 枚举有多个成员指定如何打开或创建文件。你很快就会看到这些可能性。另一个常用的构造函数如下：\n\n```\nFileStream\
  \ aFile = new FileStream(filename, FileMode.<Member>, FileAccess.<Member>);\n```\n\
  \n第三个参数是 `FileAccess` 枚举的成员，用于指定流的目的。`FileAccess` 枚举的成员如 表 18.8 所示。\n\n| **成员**\
  \ | **描述** |\n| :--- | :--- |\n| `Read` | 仅用于读取文件 |\n| `Write` | 仅用于写入文件 |\n| `ReadWrite`\
  \ | 以读写方式打开文件 |\n\n尝试执行由 `FileAccess` 枚举成员指定之外的操作将导致抛出异常。此属性通常被用于根据用户的授权级别来更改用户对文件的访问。\n\
  \n在不使用 `FileAccess` 枚举参数的 `FileStream` 构造函数版本中，将使用默认值，即 `FileAccess.ReadWrite`。\n\
  \n\n\n\n\n`FileMode` 枚举成员列如表 18.9 所示。当使用这些值之一时，实际发生的情况取决于文件名是否指向一个存在的文件。请注意，表中的条目指的是流在创建时所指向的文件位置，你将在下一节中学习更多关于该主题。除非另有说明，否则流指向文件的开头。\n\
  \n| 成员 | 文件存在的行为 | 文件不存在的行为 |\n| :--- | :--- | :--- |\n| `Append` | 打开文件，并将流置于文件末尾。只能与\
  \ `FileAccess.Write` 配合使用。 | 创建新文件。只能与 `FileAccess.Write` 配合使用。 |\n| `Create` |\
  \ 销毁文件，并在原位置创建一个新文件。 | 创建新文件。 |\n| `CreateNew` | 抛出异常。 | 创建新文件。 |\n| `Open` | 打开文件，并将流置于文件开头。\
  \ | 抛出异常。 |\n| `OpenOrCreate` | 打开文件，并将流置于文件开头。 | 创建新文件。 |\n| `Truncate` | 打开文件并擦除。流置于文件开头。保留原始文件的创建日期。\
  \ | 抛出异常。 |\n\n**表 18.9**](#c18.xhtml_c18-tbl-anc-0009) FileMode 枚举成员\n\n`File`\
  \ 和 `FileInfo` 类都公开了 `OpenRead()` 和 `OpenWrite()` 方法，这使得创建 `FileStream` 对象变得更加简单。前者以只读方式打开文件，后者允许只写访问。这些方法提供了快捷方式，因此你不需要以参数的形式提供向\
  \ `FileStream` 构造函数所需的所有信息。例如，以下这行代码以只读方式打开 `Data.txt` 文件：\n\n```\nFileStream aFile\
  \ = File.OpenRead(\"Data.txt\");\n```\n\n以下代码执行相同的功能：\n\n```\nFileInfo aFileInfo\
  \ = new FileInfo(\"Data.txt\");\nFileStream aFile = aFileInfo.OpenRead();\n```\n\
  \n### 文件位置\n\n`FileStream` 类维护了一个内部文件指针，该指针指向文件内下一次读取或写入操作将发生的位置。在大多数情况下，当文件被打开时，它指向文件的开头，但此指针可以被修改。这使得应用程序能够读取或写入文件中的任何位置，从而实现了对文件的随机访问，并具备了直接跳转到文件中特定位置的能力。在处理非常大的文件时，由于这可以节省大量时间，因为你可以立即移动到你想要的位置。\n\
  \n实现此功能的方法是 `Seek()` 方法，它接受两个参数。第一个参数指定文件指针移动的距离（单位为字节）。第二个参数指定从哪里开始计数，格式为 `SeekOrigin`\
  \ 枚举中的值。`SeekOrigin` 枚举包含三个值：`Begin`（起始）、`Current`（当前）和 `End`（结束）。\n\n例如，以下行代码将文件指针移动到文件的第八个字节处，从文件的第一个字节开始计算：\n\
  \n```\naFile.Seek(8, SeekOrigin.Begin);\n```\n\n以下行代码将文件指针从当前位置向前移动两个字节。如果直接在上一行之后执行它，那么文件指针现在将指向文件的第十个字节：\n\
  \n```\naFile.Seek(2, SeekOrigin.Current);\n```\n\n当你从文件读取或向文件写入时，文件指针也会发生变化。在你读取\
  \ 10 个字节后，文件指针将指向读取的第 10 个字节之后的字节。\n\n你也可以指定负的寻址位置，将其与 `SeekOrigin.End` 枚举值结合可以跳转到文件末尾附近。以下跳转到文件末尾第五个字节：\n\
  \n```\naFile.Seek(-5, SeekOrigin.End);\n```\n\n以这种方式访问的文件有时被称为*随机访问文件*，因为应用程序可以访问文件中的任何位置。稍后描述的\
  \ `StreamReader` 和 `StreamWriter` 类按顺序访问文件，不允许你以这种方式操纵文件指针。\n\n### 读取数据\n\n使用 `FileStream`\
  \ 读取数据并不像使用 `StreamReader` 类那么简单，后者将在本章后面介绍。`FileStream` 类专门处理字节。这种字节处理使得 `FileStream`\
  \ 类适用于任何类型的文件，而不仅仅是文本文件。`StreamWriter` 类允许你写入字符和字符串，由该类处理底层转换并写入 `FileStream` 对象。\n\
  \n有许多方法可以创建 `StreamWriter` 对象。如果你已经有一个 `FileStream` 对象，则可以使用它来创建一个 `StreamWriter`：`StreamWriter`\
  \ 也可以直接从文件创建：\n\n```\n\nFileStream aFile = new FileStream(\"Log.txt\", FileMode.CreateNew);\n\
  StreamWriter sw = new StreamWriter(aFile);\n```\n\n`StreamWriter` 对象也可以直接通过文件创建：\n\
  \n```\nStreamWriter sw = new StreamWriter(\"Log.txt\", true);\n```\n\n此构造函数接受文件名和一个布尔值，该值指定是附加到文件还是创建一个新文件：\n\
  \n*   如果设置为 `false`，则创建一个新文件，或对现有文件进行截断后打开。\n*   如果设置为 `true`，则打开文件并保留数据。如果没有文件，则创建一个新的。\n\
  \n使用 `FileStream` 读取数据并不像使用 `StreamReader` 类那么简单，后者将在本章后面介绍。`FileStream` 类专门处理字节。这种字节处理使得\
  \ `FileStream` 类适用于任何类型的文件，而不仅仅是文本文件。`StreamWriter` 类允许你写入字符和字符串，由该类处理底层转换并写入 `FileStream`\
  \ 对象。\n\n`FileStream.Read()` 方法是访问数据的主要手段。它有三个参数，第一个是字节数组，用于接收数据。第二个是 `FileStream`\
  \ 对象指向的位置。最后一个参数是要从文件中读取的字节数。下面的代码演示了从随机访问文件读取数据。\n\n### 写入数据\n\n向随机访问文件写入数据的非常相似；必须创建一个字节数组。最简单的方法是首先构建要写入文件的字符数组。接下来，使用\
  \ `Encoder` 对象将其转换为字节数组，就像你使用 `Decoder` 对象一样。最后，调用 `Write()` 方法将数组发送到文件。\n\n这是一个简单的示例，演示了如何操作。\n\
  \n### StreamWriter 对象\n\n处理字节数组不是大多数人喜欢的想法——在处理了 `FileStream` 对象后，你可能会怀疑是否有更简单的方法。别担心，一旦你有了\
  \ `FileStream` 对象，你通常会创建一个 `StreamWriter` 或 `StreamReader` 并使用它的方法来操作文件。如果你不需要将文件指针更改到任意位置的功能，这些类会让处理文件变得简单得多。\n\
  \n`StreamWriter` 类允许你向文件写入字符和字符串，由该类处理底层转换并写入 `FileStream` 对象。\n\n有许多方法可以创建 `StreamWriter`\
  \ 对象。如果你已经有一个 `FileStream` 对象，则可以使用它来创建一个 `StreamWriter`：\n\n```\nFileStream aFile\
  \ = new FileStream(\"Log.txt\", FileMode.CreateNew);\nStreamWriter sw = new StreamWriter(aFile);\n\
  ```\n\n`StreamWriter` 对象也可以直接从文件创建：\n\n```\nStreamWriter sw = new StreamWriter(\"\
  Log.txt\", true);\n```\n\n\n\n\n\n与创建 `FileStream` 对象不同，创建 `StreamWriter` 并没有提供类似范围的选项——除了用于追加或创建新文件的布尔值外，你无法像使用\
  \ `FileStream` 类时那样指定 `FileMode` 属性。你也没有设置 `FileAccess` 属性的选项，因此你始终对文件具有读/写权限。若要使用任何高级参数，你必须先在\
  \ `FileStream` 构造函数中指定它们，然后从该 `FileStream` 对象创建 `StreamWriter`，正如你在接下来的“尝试运行”中所做的那样。\n\
  \n### StreamReader 对象\n\n输入流用于从外部源读取数据。通常，这将是磁盘或网络位置上的一个文件，但请记住，该源可以是任何可以发送数据的对象，例如网络应用程序甚至\
  \ `Console`。\n\n`StreamReader` 类是你将用来从文件中读取数据的类类。和 `StreamWriter` 类一样，这是一个可以与任何流配合使用的通用类。在下一个“尝试运行”中，你再次将围绕一个\
  \ `FileStream` 对象来构造它，以便它指向正确的文件。\n\n`StreamReader` 对象的创建方式与 `StreamWriter` 对象非常相似。最常用的创建方法是使用之前创建的\
  \ `FileStream` 对象：\n\n```\nFileStream aFile = new FileStream(\"Log.txt\", FileMode.Open);\n\
  StreamReader sr = new StreamReader(aFile);\n```\n\n像 `StreamWriter` 一样，`StreamReader`\
  \ 类可以直接从包含特定文件路径的字符串进行创建：\n\n```\nStreamReader sr = new StreamReader(\"Log.txt\"\
  );\n```\n\n### 读取数据\n\n`ReadLine()` 方法并不是访问文件中数据的唯一方法。`StreamReader` 类有许多读取数据的方法。\n\
  \n最简单的读取方法是 `Read()`。它将流中的下一个字符作为正整数值返回，如果到达末尾，则返回 `-1`。可以使用 `Convert` 工具类将此值转换为字符。在之前的示例示例中，程序的主部分可以重写如下如下：\n\
  \n```\nStreamReader sr = new StreamReader(aFile);\nint charCode;\ncharCode = sr.Read();\n\
  while(charCode != -1)\n{\n   Write(Convert.ToChar(charCode));\n   charCode = sr.Read();\n\
  }\nsr.Close();\n```\n\n对于较小文件，一个非常方便的方法是 `ReadToEnd()` 方法。它读取整个文件并将其作为字符串返回。在这种情况下，早的应用程序可以简化如下：\n\
  \n```\nStreamReader sr = new StreamReader(aFile);\nline = sr.ReadToEnd();\nWriteLine(line);\n\
  sr.Close();\n```\n\n虽然这看起来简单又方便，但请小心。通过将所有数据读取到字符串对象中，你正在强制文件中的数据存在于内存中。取决于数据文件的大小，这可能是无法接受的。如果数据文件非常大，那么将数据留在文件中并使用\
  \ `StreamReader` 的方法进行访问会更好。\n\n处理大文件的另一种方法是在 .NET 4 中引入的，即使用静态的 `File.ReadLines()`\
  \ 方法。事实上，`File` 类有几个静态方法可以用来简化文件数据的读取和写入，但其中这一个特别有趣，因为它返回了一个 `IEnumerable<string>`\
  \ 集合。你可以遍历此集合中的字符串，从而逐行读取文件。使用这种方法，你可以将先的示例示例重写为如下所示：\n\n```\nforeach (string alternativeLine\
  \ in File.ReadLines(\"Log.txt\"))\n   WriteLine(alternativeLine);\n```\n\n如你所见，.NET\
  \ 中有多种方法可以实现相同的结果——即从文件中读取数据。选择最适合你的技术。\n\n### 异步文件访问\n\n有时——例如，当你一次性执行大量文件访问操作或正在处理非常大的文件时——读取和写入文件系统数据可能会很慢。如果是这样，你可能希望在等待时执行其他操作。这对于桌面应用程序尤为重要，因为你希望在后台执行工作时，你的应用程序对用户保持响应状态。\n\
  \n为了方便这一点，.NET 4.5 引入了处理流的异步方法。这适用于 `FileStream` 类，也适用于 `StreamReader` 和 `StreamWriter`。如果你浏览过这些类的定义，你可能会注意到一些以\
  \ `Async` 后缀结尾的方法——例如，`StreamReader` 有名为 `ReadLineAsync()` 的方法，它是 `ReadLine()` 的异步版本。这些方法设计用于与基于任务的异步编程模型配合。\n\
  \n异步编程是一种高级技术，本书中没有详细介绍。然而，如果你对异步文件系统访问感兴趣，那么这里就是开始的地方。你可能还想阅读 Christian Nagel、Jay\
  \ Glynn 和 Morgan Skinner 编写的*Professional C# 5.0 and .NET 4.5.1* (Wrox, 2014) 以获取更多细节。\n\
  \n### 读取和写入压缩文件\n\n通常在处理文件时，磁盘上会消耗大量的空间。这对于图形和声音文件尤其是如此。你可能遇到过允许你压缩和解压缩文件的工具，这些工具在你想要移动或通过电子邮件发送它们时非常有用。`System.IO.Compression`\
  \ 命名空间包含了这些类，允许你从代码压缩文件，使用 GZIP 或 Deflate 算法——这两种都是公开的。\n\n压缩文件不仅仅是压缩它们本身。你可能见过商业应用程序如何将多个文件放置在一个压缩文件中，这通常称为压缩包。`System.IO.Compression`\
  \ 命名空间中的类可以实现类似的功能。然而，为了保持简单，我们将只查看一个场景：将数据保存到压缩文件中。你可能无法通过外部工具访问此文件，但它会比未压缩的版本小得多！\n\
  \n我们在此处查看的 `System.IO.Compression` 命名空间中的两个流类 `DeflateStream` 和 `GZipStream` 工作非常相似。在两种情况下，你都使用一个现有流来初始化它们，对于文件来说，这将\
  \ `FileStream` 对象。之后，你可以像其他流一样将它们与 `StreamReader` 和 `StreamWriter` 使用。你只需要额外指定该流是用于压缩（保存文件）还是解压缩（加载文件），以便类知道如何处理通过它的数据。通过下面的示例说明最好。\n\
  \n## 监控文件系统\n\n有时应用程序不仅仅是向文件系统读取和写入文件。例如，知道文件或目录何时被修改可能是重要的。.NET Framework 可以轻松创建此类此类自定义应用程序。\n\
  \n帮助你完成此点的类是 `FileSystemWatcher` 类。它暴露了你的应用程序可以捕获的几个事件这使得你的应用程序对文件系统事件做出响应。\n\n\
  使用 `FileSystemWatcher` 的基本步骤很简单。首先，你必须设置一些属性，这些属性指定监控哪里、监控什么以及何时引发你的应用程序处理的事件。然后，你给它自定义事件处理程序的地址，以便它在发生重大事件时调用这些。最后，你开启它并等待事件。\n\
  \n启用 `FileSystemWatcher` 对象之前必须设置的属性如表 18.10 (#c18.xhtml_c18-tbl-0010) 所示。\n\n|\
  \ 属性 | 描述 |\n| :--- | :--- |\n| `Path` | 必须设置为要监控的文件位置或目录。 |\n\n\n\n\n\n| `NotifyFilter`\
  \ | `NotifyFilters` 枚举值的组合，用于指定在监控的文件内要关注的内容。这些值代表被监控的文件或文件夹的属性。如果指定的任何属性发生变化，则会引发事件。可能的枚举值为\
  \ `Attributes`、`CreationTime`、`DirectoryName`、`FileName`、`LastAccess`、`LastWrite`、`Security`\
  \ 和 `Size`。注意这些值可以使用二进制 `OR` 运算符组合。 |\n| `Filter` | 指定要监控哪些文件的过滤器——例如 `*.txt`。 |\n\
  \n**表 18.10** (#c18.xhtml_c18-tbl-anc-0010) FileSystemWatcher 属性\n\n一旦设置了这些属性，你就必须为四个事件编写事件处理程序：`Changed`、`Created`、`Deleted`\
  \ 和 `Renamed`。如第 13 章所示，这简单只需创建一个你自己的方法并将其分配给对象的事件。通过将你自己的事件处理程序分配给这些方法，当事件触发时，你的方法就会被调用。当与\
  \ `Path`、`NotifyFilter` 和 `Filter` 属性匹配的文件或目录被修改时，每个事件都会触发。\n\n一旦设置了属性和事件，将 `EnableRaisingEvents`\
  \ 属性设置为 `true` 以开始监控。在接下来的“尝试一试”中，你将在简单的客户端应用程序中使用 `FileSystemWatcher` 来跟踪你选择的目录。\n\
  \n## ![image](img/c02g003.jpg) 你在本章中学到的内容\n\n| 主题 | 核心概念 |\n| :--- | :--- |\n| **流\
  \ (Streams)** | 流是串行设备的抽象表示，你可以一次一个字节地对其读取或写入。文件是此类设备的一个示例。有两种流——输入和输出——分别用于从设备读取和向设备写入。\
  \ |\n| **文件类** | .NET Framework 中有许多类抽象了文件系统访问，包括通过静态方法处理文件和目录的 `File` 和 `Directory`，以及可以实例化以表示特定文件和目录的\
  \ `FileInfo` 和 `DirectoryInfo`。当你对文件和目录执行多次操作时，后两个类非常有用，因为这些类的每次方法调用都不需要路径。你对文件和目录可以执行的典型操作包括查询和更改属性、创建、删除和复制。\
  \ |\n| **文件路径** | 文件和目录路径可以是绝对路径或相对路径。绝对路径提供了从包含它的驱动器根目录开始的位置的完整描述；所有父目录与子目录之间用反斜杠分隔。相对目录也类似，但它们从文件系统中定义的点开始，例如应用程序执行所在的目录（工作目录）。要导航文件系统，你通常使用\
  \ `..` 父目录别名。 |\n| **FileStream 对象** | `FileStream` 对象提供了对文件内容的访问，用于读取和写入目的。它在字节层级上访问文件数据，因此并不总是访问文件数据的最佳选择。`FileStream`\
  \ 实例在文件中维护一个位置字节索引，以便你能够浏览文件内容。以这种方式在任何点访问文件被称为随机访问。 |\n| **对流进行读和写写** | 读取和写入文件数据的更简单方法是使用\
  \ `StreamReader` 和 `StreamWriter` 类配合 `FileStream`。这些类允许你读取和写入字符和字符串数据，而不是处理字节。这些类型暴露了用于处理字符串的熟悉方法，包括\
  \ `ReadLine()` 和 `WriteLine()`。由于它们处理的是字符串数据，这些类使得处理逗号分隔的文件变得简单，而这是表示结构化数据的常用方式。\
  \ |\n| **压缩文件** | 你可以使用 `DeflateStream` 和 `GZipStream` 压缩流类从文件和向文件读写压缩数据。这些类处理字节数据的方式与\
  \ `FileStream` 非常相似，但与 `FileStream` 一样，你可以通过 `StreamReader` 和 `StreamWriter` 类访问数据以简化代码。\
  \ |\n| **监控文件系统** | 你可以使用 `FileSystemWatcher` 类来监控文件系统数据的变化。你可以监控文件和目录，并在需要时提供过滤器以仅修改具有特定文件扩展的文件。`FileSystemWatcher`\
  \ 实例通过引发你可以在代码中处理的事件来通知你更改。 |\n\n# 第 19 章 XML 和 JSON\n\n## 本章的 Wrox.com 代码下载\n\n\
  你可以在“下载代码”选项卡中的 [wrox.com](http://wrox.com) 代码下载处通过 [www.wrox.com/go/beginningvisualc#2015programming](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 找到本章的下载代码。代码位于第 19 章 下载中，并根据全章中的名称进行单独命名。\n\n就像 C# 等编程语言以机器和人类都能读懂的格式描述计算机逻辑一样，XML\
  \ 和 JSON 都是数据语言，用于以简单的文本格式存储数据，这种格式可以被人类和几乎任何计算机读取。\n\n大多数 C# .NET 应用程序以某种形式使用 XML\
  \ 来存储数据，例如用于存储配置详细的 `.config` 文件以及用于 WPF 和 Windows Store 应用程序的 XAML 文件。由于这一重要事实，我们将在本章中大部分时间花在\
  \ XML 上，仅对 JSON 进行简要回顾。\n\n在本章中，你将学习 XML 和 JSON 的基础知识，然后学习如何创建 XML 文档。你将学习 `XmlDocument`\
  \ 类的基础知识、如何读写 XML、如何插入和删除节点，最后如何使用 XPath 搜索 XML。\n\n## XML 基础\n\n可扩展标记语言 (XML) 是一种数据语言，用于以简单的文本格式存储数据，可以被人类和几乎任何计算机读取。它像\
  \ HTML 一样是 W3C 标准（[www.w3.org/XML](http://www.w3.org/XML)）。微软已经在 .NET Framework\
  \ 和其他产品中完全采用了它。甚至新版本的 Office 文档格式也是基于 XML 的。\n\nXML 的细节非常复杂，所以我们在这里不会查看每一个。幸运的是，Visual\
  \ Studio 通常会处理大部分工作——你很少需要手动编写 XML 文档。如果你想深入 XML，可以阅读 Joe Fawcett、Danny Ayers 和\
  \ Liam Quin 编写的 *Beginning XML* (Wrox, 2012) 或许多在线教程，如 [www.xmlnews.org/docs/xml-basics.html](http://www.xmlnews.org/docs/xml-basics.html)\
  \ 或 [`www.w3schools.com/xml/`](http://www.w3schools.com/xml/)。\n\n基本格式非常简单，如下例所示显示了一个共享书籍数据的\
  \ XML 格式：\n\n```\n <book>\n    <title>Beginning Visual C# 2015</title>\n    <author>Benjamin\
  \ Perkins et al</author>\n    <code>096689</code>\n  </book>\n```\n\n在例示例中，每个书籍都有标题、作者和一个标识书籍的唯一代码。每个书籍的数据都包含在书籍元素中，以\
  \ `<book>` 标签开始并以 `</book>` 结束标签结束。标题、作者和代码值存储在书籍元素内部的元素中。\n\n可选地，元素在标签内部还可以具有属性。如果书籍代码是书籍元素的属性而不是它自己的元素，那么你会看到书籍元素开始类似于：`<book\
  \ code=096689>`。为了保持简单，我们在本章的示例中坚持使用元素。\n\n## JSON 基础\n\n\n\n\n\n你在开发 C# 应用程序时可能会遇到的另一种数据语言是\
  \ JSON。JSON 代表 JavaScript 对象表示（JavaScript Object Notation）。像 XML 一样，它也是一种标准（[`www.json.org`](http://www.json.org)），但从名称上可以看出，它源自\
  \ JavaScript 语言而非 C#。虽然不像 XML 那样在整个 .NET 中使用，但它是从 Web 服务和网络浏览器传输数据的常用格式。\n\nJSON\
  \ 也具有非常简单的格式。我们之前在 XML 中展示的相同书籍数据在这里以 JSON 格式呈现出来：\n\n```json\n{\"book\":[{\"title\"\
  :\"Beginning Visual C# 2015\",\n          \"author\":\"Benamin Perkins et al\",\n\
  \          \"code\":\"096689\"}]\n```\n\n与之前的 XML 示例一样，我们看到了具有标题、作者和唯一代码的书籍。JSON\
  \ 使用大括号（`{}`）分隔数据块，使用方括号（`[]`）分隔数组，这与 C#、JavaScript 和其他 C 类语言使用大括号表示代码块、方括号表示数组的方式类似。\n\
  \nJSON 是比 XML 更紧凑的格式，但对人类来说更难阅读，尤其是当大括号和小括号在复杂数据中层层嵌套时。\n\n## XML Schema\n\nXML\
  \ 文档可以用一个 `schema` 来描述，schema 是另一个 XML 文件，用于描述特定文档中允许的元素和属性。你可以根据 `schema` 对 XML\
  \ 文档进行验证（`validate`），确保你的程序不会遇到它未准备好处理的数据。C# 使用的标准 schema XML 格式是 XSD（XML Schema\
  \ 定义）。\n\n图 19.1 包含了 Visual Studio 识别的系列 schema 列表，但它不会自动记住你使用过的 schema。如果你反复使用某个\
  \ schema 而不想在每次需要时都浏览它，可以将其复制到以下位置：`C:\\Program Files\\Microsoft Visual Studio 14.0\\\
  Xml\\Schemas`。复制到该位置的任何 schema 将出现在 XML Schemas 对话框中。\n\n![周围文本描述的图像。](img/c19f001.jpg)\n\
  \n**图 19.1**\n\n## XML 文档对象模型\n\nXML 文档对象模型（XML DOM）是一组类，用于以非常直观的方式访问和操作 XML。DOM\
  \ 可能不是读取 XML 数据最快的方法，但一旦你理解了类与 XML 文档元素之间的关系，你就会发现它非常易用。\n\n构成 DOM 的类可以在 `System.Xml`\
  \ 命名空间中找到。该命名空间中有几个类和命名空间，但本章重点关注几个让你能够轻松操作 XML 的类。这些类在表 19.1 中描述。\n\n| **类** |\
  \ **描述** |\n| :--- | :--- |\n| `XmlNode` | 表示文档树中的单个节点。它是本章所示许多类的基类。如果此节点代表 XML\
  \ 文档的根，你可以从它导航到文档中的任何位置。 |\n| `XmlDocument` | 扩展了 `XmlNode` 类，但它通常是你使用 XML 时使用的第一个对象。这是因为该类用于从磁盘或其他地方加载和保存数据。\
  \ |\n| `XmlElement` | 表示 XML 文档中的单个元素。`XmlElement` 派自 `XmlLinkedNode`，而后者又派自 `XmlNode`。\
  \ |\n| `XmlAttribute` | 表示单个属性。与 `XmlDocument` 类一样，它派自 `XmlNode` 类。 |\n| `XmlText`\
  \ | 表示起始标签和结束标签之间的文本。 |\n| `XmlComment` | 表示一种特殊的节点，除了向读者提供有关文档部分的信息外，它不被视为文档的一部分。\
  \ |\n| `XmlNode List` | 表示节点集合。 |\n\n**表 19.1** 常用 DOM 类\n\n### XmlDocument 类\n\n\
  通常，你的应用程序想要对 XML 做的第一件事是从磁盘中读取它。如表 19.1 所示，这是 `XmlDocument` 类的领域。你可以将 `XmlDocument`\
  \ 视为磁盘上文件的内存表示。一旦你使用 `XmlDocument` 类将文件加载到内存中，你就可以从它获取文档的根节点，并开始读取和操作 XML：\n\n```xml\n\
  using System.Xml;\n.\n.\n.\nXmlDocument document = new XmlDocument();\ndocument.Load(@\"\
  C:\\BegVCSharp\\Chapter19\\XML and Schema\\books.xml\");\n```\n\n这两行代码创建了 `XmlDocument`\
  \ 类的新实例并将文件 `books.xml` 加载到其中。\n\n记住 `XmlDocument` 类位于 `System.Xml` 命名空间，你应该在代码开头的\
  \ `using` 部分插入 `using System.Xml;`。\n\n除了加载和保存 XML 之外，`XmlDocument` 类还负责维护 XML 结构本身。因此，你将发现该类上有许多方法用于创建、修改和删除树中的节点。我们很快就会查看其中一些方法。\n\
  \n### XmlElement 类\n\n现在文档已加载到内存中，你想对它进行一些操作。`XmlDocument` 的 `DocumentElement` 属性返回一个表示根元素的\
  \ `XmlElement` 实例。\n\n```xml\nXmlDocument document = new XmlDocument();\ndocument.Load(@\"\
  C:\\BegVCSharp\\Chapter19\\XML and Schema\\books.xml\");\nXmlElement element = document.DocumentElement;\n\
  ```\n\n`XmlElement` 类包含了操作节点的方法和属性。让我们检查导航 XML 元素的属性，如表 19.2 所示。\n\n| **属性** | **描述**\
  \ |\n| :--- | :--- |\n| `FirstChild` | 返回此节点之后的第一个节点。如果你还记得之前的 `books.xml` 文件，根节点是\
  \ \"books\"。在该文档中，根节点 \"books\" 的第一个节点是 \"book\"。`FirstChild` 返回一个 `XmlNode` 对象，你应该测试返回节点的类型，因为它不太可能总是\
  \ `XmlElement`。在书籍示例中，`title` 元素的节点实际上是一个代表文本 `Beginning Visual C#` 的 `XmlText`\
  \ 节点。 |\n| `LastChild` |其工作方式与 `FirstChild` 属性完全相同，但它返回当前节点的最后一个节点。在书籍示例中，“books”\
  \ 节点的最后一个节点仍然是一个 \"book\" 节点，但它将是代表“Beginning XML”书籍的节点。 |\n| `ParentNode` | 返回当前节点的父节点。在书籍示例中，“books\"\
  \ 节点是两个 \"book\" 节点的父节点。 |\n| `NextSibling` | 在 `FirstChild` 和 `LastChild` 属性返回当前节点的叶节点时，`NextSibling`\
  \ 节点返回具有相同父节点的下一个节点。在书籍示例中，这意味着获取 `title` 元素的 `NextSibling` 将返回 `author` 元素，对该元素调用\
  \ `NextSibling` 将返回 `code` 元素。 |\n| `HasChildNodes` | 允许你检查当前元素是否具有子元素，而无需实际从 `FirstChild`\
  \ 获取值并将其与 `null` 进行比较。 |\n\n\n\n\n\n# 表 19.2 (c19.xhtml_c19-tbl-anc-0002) XmlElement\
  \ 属性\n\n使用 表 19.2 中的五个属性，可以遍历整个 `XmlDocument`，如下面的“尝试一试”所示。\n\n## 更改节点的值\n\n在检查如何更改节点的值之前，重要的一点是意识到，节点的值很少是简单的东西。事实上，你会发现，尽管所有派自\
  \ `XmlNode` 的类都包含一个名为 `Value` 的属性，但它极少向你返回任何有用的内容。虽然这在起初可能让你感到有些失望，但你会发现这其实非常符合逻辑。回顾一下之前的书籍示例：\n\
  \n```\n<books>\n  <book>\n    <title>Beginning Visual C# 2015</title>\n    <author>Benjamin\
  \ Perkins et al</author>\n    <code>096689</code>\n  </book>\n  <book>\n</books>\n\
  ```\n\n文档中的每一个标签对都会解析为 DOM 中的一个节点。记住，当你遍历文档中的所有节点时，你遇到了许多 `XmlElement` 节点和三个 `XmlText`\
  \ 节点。此 XML 中的 `XmlElement` 节点是 `<books>`、`<book>`、`<title>`、`<author>` 和 `<code>`。`XmlText`\
  \ 节点是 title、author 和 code 的起始标签与结束标签之间的文本。虽然可以认为 title、author 和 code 的值是标签之间的文本，但该文本本身是一个节点；而实际上是该节点持有该值。其他标签除了其他节点之外，显然没有关联的值。\n\
  \n下面这行代码位于较早 `FormatText` 方法顶部的 `if` 块中。当当前节点是 `XmlText` 节点时，执行该代码。\n\n```\ntext\
  \ += node.Value;\n```\n\n你可以看到，`XmlText` 节点实例的 `Value` 属性用于获取节点的值。\n\n如果你使用 `XmlElement`\
  \ 类型节点的 `Value` 属性，它们会返回 `null`，但如果你使用另外两个方法之一：`InnerText` 和 `InnerXml`，就可以获取 `XmlElement`\
  \ 起始标签和结束标签之间的信息。这意味着你可以使用两种方法和一个属性来操作节点的值，如 表 19.3 所示。\n\n| 属性 | 说明 |\n| :--- |\
  \ :--- |\n| `InnerText` | 获取当前节点所有子节点的文本，并将其作为单个连接的字符串返回。这意味着如果你从前述 XML 中的 book\
  \ 节点获取 `InnerText` 的值，将返回字符串 `Beginning Visual C# 2015#Benjamin Perkins et al096689`。如果你获取\
  \ title 节点的 `InnerText`，则只返回 `\"Beginning Visual C# 2015\"`。你可以使用此方法设置文本，但这样做时要加小心，因为如果你设置了错误节点的文本，可能会覆盖掉你不想更改的信息。\
  \ |\n| `InnerXml` | 返回与 `InnerText` 类似的文本，但它还返回所有的标签。因此，如果你在 book 节点上获取 `InnerXml`\
  \ 的值，结果是以下字符串：`<title>Beginning Visual C# 2015</title><author>Benjamin Perkins et\
  \ al</author><code>096689</code>`。 | 正如你所见，如果你有一个包含 XML 的字符串并想将其直接注入到你的 XML 文档中，这将非常有用。然而，你对该字符串本身完全负责，如果你插入了格式错误的\
  \ XML，应用程序将产生异常。 |\n| `Value` | 操作文档中信息的“最纯净”方式，但如前所述，当你获取值时，只有少数类实际上会返回任何有用的内容。将返回所需文本的类如下：`XmlText`、`XmlComment`、`XmlAttribute`\
  \ |\n\n# 表 19.3 (c19.xhtml_c19-tbl-anc-0003) 获取节点值的三种方法\n\n## 插入新节点\n\n现在你已经看到可以在\
