  \n```cs\n x = Manipulate(y, z);\n```\n\n如果没有为部分方法（partial method）提供实现，编译器将将其连同所有使用它的地方一起移除。在前面的代码中，这将导致\
  \ `x` 的结果变得不确定，因为没有可用的 `Manipulate()` 方法的替代方案。可能会是，如果没有这个方法，你可能只是想忽略整行代码，但编译器无法判断这是否是你的意愿。\n\
  \n没有返回值的方法不会作为表达式的一部分被调用，因此编译器移除所有对部分方法调用的引用是安全的。\n\n同样，`out` 参数是被禁止的，因为用作 `out`\
  \ 参数的变量在方法调用之前必须是未定义的，并在方法调用之后被定义。移除方法调用将破坏这种行为。\n\n### 练习 4\n\n```cs\nclass MyCopyableClass\n\
