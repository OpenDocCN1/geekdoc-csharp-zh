  \   }\n   public void Clear()\n   {\n      innerCollection.Clear();\n   }\n   public\
  \ bool Contains(T item) => innerCollection.Contains(item);\n   public void CopyTo(T[]\
  \ array, int arrayIndex)\n   {\n      innerCollection.CopyTo(array, arrayIndex);\n\
  \   }\n   public int Count\n   {\n      get\n      {\n         return innerCollection.Count;\n\
  \      }\n   }\n   public bool IsReadOnly\n   {\n      get\n      {\n         return\
  \ innerCollection.IsReadOnly;\n      }\n   }\n   public bool Remove(T item) => innerCollection.Remove(item);\n\
  \   #endregion\n   #region IEnumerable<T> Members\n   public IEnumerator<T> GetEnumerator()\
  \ =>\n           innerCollection.GetEnumerator();\n   #endregion\n   #region IEnumerable\
  \ Members\n   IEnumerator IEnumerable.GetEnumerator() => GetEnumerator();\n   #endregion\n\
