  \ .NET XML 类的其他 JSON 操作。 |\n\n第 20 章\n\nLINQ\n\n## Wrox.com 本章代码下载\n\n\n\n\n\n你可以在\
  \ [`wrox.com`](http://wrox.com) 的 [`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 的“Download Code”标签页找到本章节的代码下载。代码位于第 20 章下载中，并根据章节中的名称进行单独命名。\n\n本章介绍了语言集成查询（LINQ）。LINQ\
  \ 是 C# 语言的一种扩展，它将数据查询直接集成到编程语言本身中。\n\n在 LINQ 出现之前，这类工作需要编写大量的循环代码，对找到的对象进行额外处理（如排序或分组）还需要更多代码，这些代码会根据数据源的不同而不同。LINQ\
  \ 提供了一种通用且一致的方法，用于查询、排序和分组许多类型的数据（XML、JSON、SQL 数据库、对象集合、Web 服务、企业目录等）。\n\n首先，你将在前一章的基础上，学习\
  \ `system.xml.linq` 命名空间为创建 XML 添加的额外功能。然后，你将通过使用查询语法、方法语法、Lambda 表达式、排序、分组以及连接相关结果，进入\
  \ LINQ 的核心。\n\nLINQ 的规模非常大，在入门书中完全涵盖所有功能和方法是超出范围的。然而，你将看到作为 LINQ 用户可能需要的各种类型语句和操作符的示例，并且我们将根据情况向你推荐用于进行更深入介绍的资源。\n\
  \n## LINQ to XML\n\nLINQ to XML 是 XML 的一组替代类，它允许使用 LINQ 处理 XML 数据，并且即使你不使用 LINQ，也能让某些\
  \ XML 操作变得更容易。我们将查看两个特定的案例，在这些案例中，LINQ to XML 比上一章介绍 XML DOM（文档对象模型）更有优势。\n\n###\
  \ LINQ to XML 函数式构造函数\n\n虽然可以使用 XML DOM 在代码中创建 XML 文档，但 LINQ to XML 提供了一种更容易创建 XML\
  \ 文档的方法，称为`函数式构造`。在形式构造中，构造函数的调用可以嵌套，从而自然地反映 XML 文档的结构。在下面的“尝试一下”中，你将使用函数式构造函数创建一个包含客户和订单的简单\
  \ XML 文档。\n\n### 处理 XML 片段\n\n与 XML DOM 不同，LINQ to XML 处理 XML 片段（部分或不完整的 XML 文档的方式与处理完整\
  \ XML 文档非常相似。在处理片段时，你只需将 `XElement` 作为顶层 XML 对象，而不是 `XDocument`。\n\n在下面的“尝试一下”中，你将加载、保存并操作一个\
  \ XML 元素及其子节点，就像你处理 XML 文档一样。\n\n## LINQ Providers\n\nLINQ to XML 只是 `LINQ provider`\
  \ 的示例。Visual Studio 2015 和 .NET Framework 4.5 带有许多内置的 LINQ Provider，为不同类型的数据提供查询解决方案：\n\
  \n*   **LINQ to Objects** — 对任何类型的 C# 内存对象（如数组、列表和其他集合类型）进行查询。上一章中的所有示例都使用了 LINQ\
  \ to Objects。然而，你可以将本章中学到的技术应用于所有的 LINQ 类型。\n*   **LINQ to XML** — 正如你所看到的，它与其他\
  \ LINQ 类型使用相同的语法和通用查询机制对 XML 文档进行创建和操作。\n*   **LINQ to Entities** — Entity Framework\
  \ 是 .NET 4 中最新的数据接口类集，由微软推荐用于新开发。在本章中，你将为 Visual C# 项目添加一个 ADO.NET Entity Framework\
  \ 数据源，然后使用 LINQ to Entities 对其进行查询。\n*   **LINQ to Data Set** — `DataSet` 对象在 .NET\
  \ Framework 第一版本中引入。这种 LINQ 类型允许使用 LINQ 轻松查询旧的 .NET 数据。\n*   **LINQ to SQL** — 这是另一种\
  \ LINQ 接口，已被 LINQ to Entities 取代。\n*   **PLINQ** — PLINQ（并行 LINQ）通过并行编程库扩展了 LINQ\
  \ to Objects，该库可以拆分并在多核处理器上同时执行。\n*   **LINQ to JSON** — 包含在上章使用的 Newtonsoft 包中，该库使用与其他\
  \ LINQ 类型相同的语法和通用查询机制对 JSON 文档进行创建和操作。\n\n由于 LINQ 类型如此，在入门书中涵盖所有是不可能的，但你看到的语法和方法适用于所有类型。让我们来看使用\
  \ LINQ to Objects Provider 的 LINQ 查询语法。\n\n## LINQ 查询语法\n\n在下面的“尝试一下”中，你将使用 LINQ\
  \ 创建一个查询，以从简单的内存对象数组中查找某些数据并将其打印到控制台。\n\n### 使用 `var` 关键字为结果声明变量\n\nLINQ 查询首先声明一个变量来存储查询结果，这通常通过使用\
  \ `var` 关键字声明变量完成：\n\n```\nvar queryResult =\n```\n\n`var` 是 C# 中的一个关键字，用于声明一种通用变量类型，非常适合存储\
  \ LINQ 查询的结果。`var` 关键字告诉 C# 编译器根据查询推断出结果的类型。这样，你就不需要提前声明 LINQ 查询将返回什么类型的对象——编译器会为你处理好。如果查询可以返回多个项，那么它的作用就像是查询数据源中对象的集合。\n\
  \n### 指定数据源：from 子句\n\nLINQ 查询的下一部分是 `from` 子句，它指定了你正在查询的数据：\n\n```\nfrom n in names\n\
  ```\n\n在本例中，你的数据源是 `names`，即之前声明的字符串数组。变量 `n` 只是源中单个元素的占位符，类似于 `foreach` 语句后面的变量名。\n\
  \n### 指定条件：where 子句\n\n在 LINQ 查询的后续部分，你使用 `where` 子句指定查询条件，其形式如下：\n\n```\nwhere\
  \ n.StartsWith(\"S\")\n```\n\n### 选择项目：select 子句\n\n最后，`select` 子句指定结果集中显示哪些项。`select`\
  \ 子句的形式如下：\n\n```\nselect n\n```\n\n\n\n\n`select` 子句是必须的，因为你必须指定查询中的哪些项显示在结果集中。对于这组数据，它并不十分有趣，因为结果集中的每个元素都只有一个项，即名称。你将看到一些结果集中包含更复杂对象的示例，在那些情况下\
  \ `select` 子句的用处将更加明显，但首先，你需要完成这个示例。\n\n### 结束工作：使用 foreach 循环\n\n现在你打印查询结果。就像作为数据源的数组一样，这类\
  \ LINQ 查询结果是可枚举的（`enumerable`），这意味着你可以使用 `foreach` 语句遍历结果：\n\n```\nWriteLine(\"\
  Names beginning with S:\");\nforeach (var item in queryResults) {\n       WriteLine(item);\n\
  }\n```\n\n在这种情况下，你匹配了五个名称 —— Smith、Smythe、Small、Singh 和 Samba —— 所以你在 `foreach`\
  \ 循环中显示的就是这些内容。\n\n### 延迟查询执行\n\n你可能在想 `foreach` 循环实际上不是 LINQ 本身的一部分——它只是在遍历你的结果。虽然\
  \ `foreach` 结构本身确实不是 LINQ 的一部分，但它仍然是你代码中实际执行 LINQ 查询的部分！查询结果变量的赋值只是保存了执行查询的计划；在\
  \ LINQ 中，在访问结果之前，不会检索数据本身。这被称为 `deferred query execution`（延迟查询执行）或查询的 `lazy evaluation`（惰性求）。对于任何产生结果序列（即列表）的查询，执行都将推迟。\n\
  \n现在，回到代码。你已经打印了结果；是时候完成程序了：\n\n```\nWrite(\"Program finished, press Enter/Return\
  \ to continue:\");\nReadLine();\n```\n\n这些行仅用于确保控制台程序的结果留在屏幕上，直到你按下任意键，即使你按的是 F5\
  \ 而不是 Ctrl+F5。你在大多数其他 LINQ 示例中也会使用这种结构。\n\n## LINQ 方法语法\n\n在 LINQ 中实现相同功能有多种，这在编程中很常见。正如提到的，上一个示例是使用\
  \ LINQ `query syntax;`（查询语法）编写的；在下一个示例中，你将使用 LINQ 的 `method syntax`（方法语法，也称为显式语法，但这里使用方法语法一术）编写相同的程序。\n\
  \n### LINQ 扩展方法\n\nLINQ 被实现为集合、数组、查询结果以及任何实现 `IEnumerable<T>` 接口对象的的一系列扩展方法。你可以通过\
  \ Visual Studio 的 IntelliSense 功能查看这些方法。例如，在 Visual Studio 2015 中，打开你刚刚完成的 `FirstLINQquery`\
  \ 程序中的 `Program.cs` 文件，并在它下方输入对 `names` 数组的新新引用：\n\n```\nstring[] names = { \"Alonso\"\
  , \"Zheng\", \"Smith\", \"Jones\", \"Smythe\", \"Small\",\n\"Ruiz\", \"Hsieh\",\
  \ \"Jorgenson\", \"Ilyich\", \"Singh\", \"Samba\", \"Fatimah\" };\nnames.\n```\n\
  \n当你输入 `names` 后的句号时，你将看到 Visual Studio IntelliSense 功能列出的 `names` 可用方法。\n\n`Where<T>`\
  \ 方法以及大多数其他可用方法都是扩展方法（如 `Where<T>` 方法右侧显示的文档所示，它以 `extension` 开头）。你可以通过注释掉顶部的 `using\
  \ System.Linq` 指令来看到它们是 LINQ 扩展；你会发现 `Where<T>`、`Union<T>`、`Take<T>` 以及列表中的大多数其他方法不再出现。你在上一个示例中使用的\
  \ `from…where…select` 查询表达式会被 C# 编译器翻译为对这些方法的系列调用。当使用 LINQ 方法语法时，你可以直接调用这些方法。\n\n\
  ### 查询语法与方法语法\n\n查询语法是 LINQ 中编写查询的首选方式，因为它通常更易读，且对于最常见的查询来说使用起来更简单。然而，对方法语法有基本的理解是重要的，因为某些\
  \ LINQ 功能在查询语法中并不可用，或者在方法语法中使用起来更易用。\n\n在本章中，你将主要使用查询语法，但在需要的地方会指出方法语法，并且你学习如何使用方法语法来解决问题。\n\
  \n大多数使用方法语法的 LINQ 方法要求你传递一个方法或函数来评估查询表达式。方法/函数参数以委托（delegate）的形式传递，它通常引用一个匿名方法。\n\
  \n幸运的是，LINQ 让这变得比听起来简单得多！你通过使用 `lambda expression`（Lambda 表达式）创建方法/函数，它以优雅的方式封装了委托。\n\
  \n### Lambda 表达式\n\nLambda 表达式是一种为你的 LINQ 查询即时创建方法的简单方法。它使用 `=>` 运算符，该运算符声明了你方法的参数，随后是方法逻辑，全部在同一行内！\n\
  \n例如，考虑 Lambda 表达式：\n\n`n => n < 0`\n\n这声明了一个名为 `n` 的单个参数的方法。如果 `n` 小于 0，方法返回 `true`，否则返回\
  \ `false`。这非常简单。你不需要想方法名称，不需要写返回语句，也不用用括号包裹任何代码。\n\n像这样返回一个真/假值对于用于 LINQ Lambda\
  \ 的方法来说是典型的，但并非必须如此。例如，这里有一个 Lambda 创建了一个返回两个变量之和的方法。此 Lambda 使用了多个参数：\n\n`(a, b)\
  \ => a + b`\n\n这声明了一个具有参数 `a` 和 `b` 的。方法逻辑返回 `a + b`。你不需要声明 `a` 和 `b` 的类型。它们可以是\
  \ int、double 或 string。C# 编译器会推断类型。\n\n最后，考虑这个 Lambda 表达式：\n\n`n => n.StartsWith(\"\
  S\")`\n\n如果 `n` 以字母 S 开头，此方法返回 `true`，否则返回 `false`。在实际程序中尝试一下以更清楚地看到。\n\n## 查询查询结果\n\
  \n一旦你使用 `where` 子句（或 `Where()` 方法调用）定位了感兴趣的数据，LINQ 可以轻松地对结果进行进一步处理——例如重新排序。在接下来的\
  \ Try Out 中，你对你的第一个查询结果按字母顺序排序。\n\n### 理解 orderby 子句\n\n`orderby` 子句如下：\n\n```\n\
  orderby n\n```\n\n与 `where` 子句一样，`orderby` 子句是可选的。只需添加一行，你就可以对任意查询的结果进行排序，否则这至少需要几行额外代码以及可能用于存储重排序结果的方法或集合，取决于你选择的排序算法。如果有多个类型需要排序，你需要为每种类型实现一组排序方法。有了\
  \ LINQ，你不需要担心这些；只需在查询语句中添加一个子句即可。\n\n默认情况下，`orderby` 按升序排序（从 A 到 Z），但你可以通过简单添加 `descending`\
  \ 关键字来指定降序（从 Z 到 A）：\n\n```\norderby n descending\n```\n\n这将示例结果排序如下：\n\n```\nSmythe\n\
  Smith\nSmall\nSingh\nSamba\n```\n\n此外，你无需重写查询即可对任意表达式进行排序；例如，要按名称的最后一个字母而不是正常的字母顺序排序，只需将\
  \ `orderby` 子句更改为：\n\n```\n orderby n.Substring(n.Length - 1)\n```\n\n这将产生以下输出：\n\
  \n```\nSamba\nSmythe\nSmith\nSingh\nSmall\n```\n\n## 查询大型数据集\n\n\n\n\n\n你可能会说，这些\
  \ LINQ 语法虽然很好，但意义何在？仅仅通过查看源数组就能清晰地看到预期的结果，那么为什么要费这么劲去查询一个一眼就能看出的东西呢？正如前面提到的，有时查询结果并不那么显而易见。在接下来的“尝试一下”（Try\
  \ It Out）中，你将创建一个非常大的数字数组并使用 LINQ 对其进行查询。\n\n## 使用聚合操作符\n\n通常，查询的结果比你预期的要多。例如，如果你将刚刚创建的大数字查询的条件更改为列出大于\
  \ 1,000 的数字，而不是小于 1,000 的数字，那么查询结果将多到数字打印不下来！\n\n幸运的是，LINQ 提供了一系列聚合操作符，使你无需遍历所有结果即可分析查询结果。表\
  \ 20.1 显示了针对数值结果集（如大数字查询的结果）最常用的聚合操作符。如果你使用过 SQL 等数据库查询语言，这些操作符可能会让你感到熟悉。\n\n| 操作符\
  \ | 说明 |\n| :--- | :--- |\n| `Count()` | 结果计数 |\n| `Min()` | 结果中的最小值 |\n| `Max()`\
  \ | 结果中的最大值 |\n| `Average()` | 数值结果的平均值 |\n| `Sum()` | 所有数值结果的总和 |\n\n**表 20.1**-\
  \ `数值结果的聚合操作符`\n\n还有更多的聚合操作符，例如 `Aggregate()`，用于以某种方式执行任意代码，允许你编写自己的聚合函数。然而，这些是为高级用户设计的，因此超出了本书的范围。\n\
  \n在接下来的“尝试一下”中，你将修改大数字查询并使用聚合操作符，利用 LINQ 探索大于版本的大数字查询的结果集。\n\n## 使用 Select Distinct\
  \ 查询\n\n对于熟悉 SQL 数据查询语言的读者来说，另一种可以识别查询类型是 `SELECT DISTINCT` 查询，在该查询中，你搜索数据中的唯一值——也就是说，查询会从结果集中移除任何重复的值。这在处理查询时是一个相当常见的需求。\n\
  \n假设你需要从之前示例中使用的客户数据中找到不同的地区。在你刚刚使用的数据中没有单独的地区列表，因此你需要从客户列表本身找到唯一的、不重复的地区列表。LINQ\
  \ 提供了一个 `Distinct()` 方法，可以轻松地找到这些数据。你将在接下来的“尝试一下”中使用它。\n\n## 按多级排序\n\n现在你正在处理具有多个属性的对象，你可能会想象出一种情况：仅通过单个字段对查询结果排序是不够的。如果你想查询客户并按地区字母顺序排序，然后在每个地区内部按国家或城市名称字母顺序排序呢？LINQ\
  \ 让这变得非常简单，正如你在接下来的“尝试一下”中所看到的。\n\n## 使用分组查询\n\n分组查询将数据分为组，并允许你按组进行排序、计算聚合值和比较。这些通常是业务背景下最有趣的查询（那些真正驱动决策的查询）。例如，你可能想按国家或地区比较销售额，以决定在哪里开设另一家商店或招聘更多员工。你将在下一个“尝试一下”中完成操作。\n\
  \n## 使用连接\n\n你刚刚创建的如 `customers` 和 `orders` 列表等具有共享键字段（ID）的数据集允许执行 `join` 查询，你可以通过单个查询查询两个列表中的相关数据，并通过键字段将结果连接在一起。这与\
  \ SQL 数据查询语言中的 `JOIN` 操作类似；正如你所预期的，LINQ 在查询语法中提供了 `join` 命令，你将在接下来的“尝试一下”中使用它。\n\
