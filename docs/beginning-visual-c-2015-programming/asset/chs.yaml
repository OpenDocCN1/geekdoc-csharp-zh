  \n在本章中，你继续通过查看一些在其他地方尚未完全合适的片段来探索 C# 语言。Anders Hejlsberg（C# 的发明者）以及微软的其他人员继续更新和完善该语言。在编写本文时，最新的更改是\
  \ C# 语言第 6 版本的一部分，该版本作为 Visual Studio 2015 产品线以及 .NET 4.6 一起发布。在书的这里，你可能在想还需要什么；事实上，以前版本的\
  \ C# 在功能方面已经非常完善。然而，这并不意味着无法让 C# 编程的某些方面变得更容易，或者 C# 与与其他技术之间的关系不能被简化。\n\n你还对过去几章一直在构建的\
  \ `CardLib` 代码进行了一些最后的修改，并使用 `CardLib` 创建了一个游戏。\n\n## :: 运算符与全局命名空间\n\n`::` 运算符提供了访问命名空间的另一种方式。如果你想使用命名别名且该别名与命名空间之间存在冲突，这可能是必要的。在这种情况下，命名空间类的优先级高于别名。为了理解这意味着，请考虑以下代码：\n\
  \n```cs\nusing MyNamespaceAlias = MyRootNamespace.MyNestedNamespace;\nnamespace\
  \ MyRootNamespace\n{\n   namespace MyNamespaceAlias\n   {\n      public class MyClass\
  \ {}\n   }\n   namespace MyNestedNamespace\n   {\n      public class MyClass {}\n\
  \   }\n}\n```\n\n`MyRootNamespace` 中的代码可能使用以下方式引用类：\n\n```\nMyNamespaceAlias.MyClass\n\
  ```\n\n此代码引用的类是 `MyRootNamespace.MyNamespaceAlias.MyClass`，而不是 `MyRootNamespace.MyNestedNamespace.MyClass`。也就是说，命名空间\
  \ `MyRootNamespace.MyNamespaceAlias` 隐藏了 `using` 语句定义的别名（该别名指向 `MyMyNestedNamespace`）。你仍然可以访问\
  \ `MyNestedNamespace` 命名空间及其包含的类，但需要不同的语法：\n\n```\nNestedNamespace.MyClass\n```\n\
  \n或者，你可以使用 `::` 运算符：\n\n```\nMyNamespaceAlias::MyClass\n```\n\n使用该运算符强制编译器使用 `using`\
  \ 语句定义的别名，因此代码指向 `MyRootNamespace.MyNestedNamespace.MyClass`。\n\n你还可以配合 `::` 运算符使用\
  \ `global` 关键字，它本质上是根命名空间的别名。这对于明确你所引用的命名空间非常有用，如下所示：\n\n```\nglobal::System.Collections.Generic.List<int>\n\
  ```\n\n这是你预期的类，即泛型 `List<T>` 集合类。它绝对不是以下代码定义的类：\n\n```cs\nnamespace MyRootNamespace\n\
  {\n   namespace System\n   {\n      namespace Collections\n      {\n         namespace\
  \ Generic\n         {\n            class List<T> {}\n         }\n      }\n   }\n\
  }\n```\n\n当然，你应该避免为自己的命名空间命名与 .NET 命名空间相同的名称，尽管类似的问题可能在大型项目中出现，特别是当你在大团队中工作时。使用\
  \ `::` 运算符和 `global` 关键字可能是你访问所需类型的唯一方法。\n\n\n\n\n\n# 自定义异常\n\n第 7 章 介绍了异常，并解释了如何使用\
  \ `try`…`catch`…`finally` 块来处理它们。你还看到了一些标准的 .NET 异常，包括异常的基类 `System.Exception`。有时，从此基类派生你自己的异常类并在应用程序中使用它们是很有用的，而不是使用标准异常。这可以使你能够向任何捕获异常的代码发送更具体的信息，并让捕获异常的代码能够更精确地指定它处理哪些哪些异常。例如，你可能会为异常类添加一个新属性，允许访问某些底层信息，从而使异常的接收者做出必要的更改，或者仅仅提供有关异常原因的更多信息。\n\
  \n## 在 CardLib 中添加自定义异常\n\n如何使用自定义异常，再次通过升级 `CardLib` 项目得到了最佳说明。`Deck.GetCard()`\
  \ 方法目前在尝试访问索引小于 0 或大于 51 的卡片时会抛出标准的 .NET 异常，但你将对其修改为使用自定义异常。\n\n首先，你需要创建一个名为 `Ch13CardLib`\
  \ 的新类库项目，将其保存到 `BegVCSharp\\Chapter13` 目录下，并像以前一样从 `Ch12CardLib` 复制类，根据需要将命名空间改为\
  \ `Ch13CardLib`。接下来，定义异常。你通过名为 `CardOutOfRangeException.cs` 的新类文件中定义一个新类来完成此，你可以通过“添加类”将其添加到\
  \ `Ch13CardLib` 项目中（你可以在 `Ch13CardLib\\CardOutOfRangeException.cs` 中找到此代码）：\n\n\
  ```c\n public class CardOutOfRangeException : Exception\n   {\n      private Cards\
  \ deckContents;\n      public Cards DeckContents\n      {\n         get { return\
  \ deckContents; }\n      }\n      public CardOutOfRangeException(Cards sourceDeckContents)\n\
  \         : base(\"There are only 52 cards in the deck.\")\n      {\n         deckContents\
  \ = sourceDeckContents;\n      }\n   }\n```\n\n该类的构造函数需要一个 `Cards` 类的实例。它允许通过 `DeckContents`\
  \ 属性访问此 `Cards` 对象，并向基类 `Exception` 构造函数提供合适的错误消息，以便通过类的 `Message` 属性可以使用。\n\n接下来，向\
  \ `Deck.cs` 添加抛出此异常的代码，以替换旧的标准异常（你可以在 `Ch13CardLib\\Deck.cs` 中找到此代码）：\n\n```csharp\n\
  \ public Card GetCard(int cardNum)\n      {\n         if (cardNum >= 0 && cardNum\
  \ <= 51)\n            return cards[cardNum];\n         else\n            throw new\
  \ CardOutOfRangeException(cards.Clone() as Cards);\n      }\n```\n\n`DeckContents`\
  \ 属性以 `Cards` 对象的形式通过 `Deck` 对象当前内容的深拷贝进行初始化。这意味着你看到的是异常抛出时的内容，因此随后对牌组内容的修改将不会“丢失”这些信息。\n\
  \n要测试这一点，请使用以下客户端代码（你可以在 `Ch13CardClient\\Program.cs` 中找到此代码）：\n\n```csharp\nDeck\
  \ deck1 = new Deck();\ntry\n{\n   Card myCard = deck1.GetCard(60);\n}\ncatch (CardOutOfRangeException\
  \ e)\n{\n   WriteLine(e.Message);\n   WriteLine(e.DeckContents[0]);\n}\nReadKey();\n\
  ```\n\n这段代码产生的输出如 图 13.1 所示。\n\n![命令行窗口显示了 CardOutOfRangeException.cs 的文本“牌组中只有\
  \ 52 张牌。黑梅桃。”](img/c13f001.jpg)\n\n**图 13.1**\n\n在这里，捕获代码将 `Message` 属性写入了屏幕。你还显示了通过\
  \ `DeckContents` 获取的 `Cards` 对象中的第一个卡片，以此证明你可以通过你的自定义异常对象访问 `Cards` 集合。\n\n# 事件\n\
  \n本节涵盖了 .NET 中最常用的 OOP 技术之一：事件。你像往常一样从基础开始——查看事件到底是什么。之后，你将看到一些简单事件的运行，并学习可以使用它们可以做什么。然后，你将学习如何创建和使用自己的事件。\n\
  \n在本章中，你将通过添加事件来完成你的 `CardLib` 类库。最后，由于这是到达某些高级主题之前的最后一站，你将尽情创建一个使用此类库的牌游戏应用程序。\n\
  \n## 什么是事件？\n\n事件与异常相似，因为它们是由对象引发（抛出）的，你可以提供处理它们的代码。然而，它们之间有几个重要的区别，其中最重要的一点是没有用于处理事件的\
  \ `try`…`catch` 结构。相反，你必须订阅它们。订阅事件意味着提供在事件引发时执行的代码，其形式为事件处理程序。\n\n单个事件可以订阅多个处理程序，当事件引发时，所有处理程序都会被调用。这可能包括作为引发事件的对象的类的一部分的事件处理器，但在其他类中也同样可能找到事件处理器。\n\
  \n事件处理程序本身仅仅是方法。对事件处理器的唯一限制是它必须与事件指定的返回类型和参数相匹配。应用程序通过定义一个可以与事件指定的委托匹配的方法来订阅事件，并将该方法的引用传递给事件。事件的基本处理序列如下：首先，应用程序创建一个可以引发事件的对象。例如，假设一个即时消息应用程序创建一个表示连接的对象。该连接对象在消息到达时可能会引发事件（参见\
  \ 图 13.2）。\n\n![流程图显示了两个框 Application 和 Connection，带有一个标记 Creates 的箭头](img/c13f002.jpg)\n\
  \n**图 13.2**\n\n接下来，应用程序订阅事件。你的即时消息应用程序通过定义一个可以使用事件指定的委托的方法来实现这一点，并将该方法传递给事件。事件处理器可能在另一个对象上，例如一个在消息到达时显示显示设备的对象（参见\
  \ 图 13.3）。\n\n![图像与 13.2 相同，但箭头指向底部的添加框 Display。Display 有连接指向 Connection](img/c13f003.jpg)\n\
  \n**图 13.3**\n\n当事件引发时，订阅者会被通知。当消息通过连接到达时，显示设备对象上的事件处理方法会被调用。由于你使用的是标准方法，引发事件的对象可以通过参数传递任何相关信息，这使得事件非常灵活。在示例案例中，一个参数可能是即时消息的文本，事件处理器可以在显示设备对象上显示它。这如\
  \ 图 13.4 所示。\n\n![示意图显示了三个框，即 Application、Connection 和 Display，其中 Connection 有标记\
  \ Raises Event 的箭头，显示调用指向 Display 的圆](img/c13f004.jpg)\n\n**图 13.4**\n\n### 处理事件\n\
  \n正如之前过的，要处理事件，你需要通过提供一个返回类型和参数与事件指定的委托匹配的事件处理方法来订阅它。下面的示例使用了一个简单的定时器对象来引发事件，这导致处理方法被调用。\n\
  \n\n\n\n现在是时候定义并使用你自己的事件了。接下来的“尝试一下”（Try It Out）实现了在本章之前介绍的即时消息场景的示例版本，它创建了一个 `Connection`\
  \ 对象，该对象抛出事件并由 `Display` 对象进行处理。\n\n### 多用途事件处理器\n\n你之前看到的用于 `Timer.Elapsed` 事件的委托包含了两个参数，这两个参数的类型在事件处理器中很常见：\n\
  \n* `object` `source` — 触发事件的对象的引用\n* `ElapsedEventArgs` `e` — 由事件发送的参数\n\n在该事件中（实际上在许多其他事件中）使用\
  \ `object` 类型参数的原因是，你通常需要使用单一的事件处理器来处理由不同对象生成的多个相同事件，并且仍然能够识别出究竟是哪一个对象生成了该事件。\n\n\
  为了解释并阐明这一概念，下一个“尝试一下”对上一个示例进行了稍微扩展。\n\n### EventHandler 和泛型 EventHandler<T> 类型\n\
  \n在大多数情况下，你将遵循上一节概述的模式，使用返回类型为 `void` 带有两个参数的事件处理器。第一个参数类型为 `object`，将是事件源。第二个参数类型将派自\
  \ `System.EventArgs`，并将包含任何事件参数。由于这种情况非常常见，.NET 提供了两种委托类型以便于定义事件：`EventHandler`\
  \ 和 `EventHandler<T>`。这两者都是使用标准事件处理器模式的委托。泛型版本允许你指定想要使用的事件参数类型。\n\n在在上一个“尝试一下”中，你通过如下方式使用泛型\
  \ `EventHandler<T>` 委托类型看到了它的实际应用：\n\n```\n public class Connection\n   {\n    \
  \  public event EventHandler<MessageArrivedEventArgs> MessageArrived;\n      …\n\
  \   }\n```\n\n这显然是件很好的做法，因为它简化了你的代码。通常，每当你定义事件时使用这些委托类型都是最佳实践。请注意，如果你有一个不需要事件参数数据的事件，仍然可以使用\
  \ `EventHandler` 委托类型。你只需要将 `EventArgs.Empty` 作为参数值传递即可。\n\n### 返回值与事件处理器\n\n到目前为止你看到的所有事件处理器返回类型都是\
  \ `void`。可以为事件提供返回类型，但这可能会导致问题，因为给定的事件可能会导致多个事件处理器被调用。如果所有这些处理器都返回值，那么可能不清楚实际返回的是哪个值。\n\
  \n系统通过允许你只访问事件处理器返回的最后一个值来解决这个问题。这将是订阅该事件的最后一个事件处理器所返回的值。虽然此功能在某些情况下可能有用，但建议使用 `void`\
  \ 类型事件处理器，并避免使用 `out` 类型参数（这将导致关于参数返回值来源的相同歧义）。\n\n### 匿名方法\n\n与其定义事件处理器方法，你也可以选择使用匿名方法。匿名方法在传统意义上并不真正作为一种方法存在——也就是说，它不是任何特定类上的方法。相反，匿名方法纯粹是为了作为委托的目标而创建的。\n\
  \n要创建一个匿名方法，你需要以下代码：\n\n```\ndelegate(parameters)\n{\n   // 匿名方法代码。\n};\n```\n\n\
  `parameters` 是参数列表，与你正在实例化的委托类型中的参数匹配，并被匿名方法代码使用：\n\n```\ndelegate(Connection source,\
  \ MessageArrivedEventArgs e)\n{\n   // 与 Ch13Ex03 中的 MessageHandler 事件匹配的匿名方法代码。\n\
  };\n```\n\n例如，你可以使用这段代码完全跳过 Ch13Ex03 中的 `Display.DisplayMessage()` 方法：\n\n```\n\
  \ myConnection1.MessageArrived +=\n            delegate(Connection source, MessageArrivedEventArgs\
  \ e)\n            {\n               WriteLine($\"Message arrived from: {source.Name}\"\
  );\n               WriteLine($\"Message Text: {e.Message}\");\n            };\n\
  ```\n\n关于匿名方法的一个有趣点是，它们实际上局部于包含它们的代码块，并且它们可以访问该作用范围内的局部变量。如果你使用这样的变量，它就会变成一个 `outer`（外部层）变量。外部变量在离开作用范围时不会像其他局部变量那样被释放；相反，它们会一直存在到使用它们的匿名方法被销毁为止。这可能比你预期的要晚，所以这绝对是需要注意的事情。如果外部变量占用了大量内存，或者它使用了在其他方面昂贵的资源（例如，数量有限的资源），那么可能会导致内存或性能问题。\n\
  \n## 扩展和使用 CardLib\n\n现在你已经查看了事件的定义和使用，你可以在 Ch13CardLib 中使用它们。你将添加到库中的事件将在通过 `GetCard`\
  \ 获取 `Deck` 对象中的最后一个 `Card` 对象时生成，它将被命名为 `LastCardDrawn`。该事件允许订阅者自动重新洗牌，减少了客户端所需的处理工作。该事件将使用\
  \ `EventHandler` 委托类型，并将 `Deck` 对象的引用作为源传递，这样在处理程序所在的任何地方访问 `Shuffle()` 方法。将以下代码添加到\
  \ `Deck.cs`（你可以在 `Ch13CardLib\\Deck.cs` 中找到这段代码）以定义并抛出事件：\n\n```\nnamespace Ch13CardLib\n\
  {\n      public class Deck : ICloneable\n      {\n        public event EventHandler\
  \ LastCardDrawn;\n        …\n        public Card GetCard(int cardNum)\n        {\n\
  \           if (cardNum >= 0 && cardNum <= 51)\n           {\n              if (cardNum\
  \ == 51 && LastCardDrawn != null)\n                 LastCardDrawn(this, EventArgs.Empty);\n\
  \              return cards[cardNum];\n           }\n           else\n         \
  \     throw new CardOutOfRangeException((Cards)Clone());\n        }\n        …\n\
  \       }\n```\n\n这就是向 `Deck` 类添加事件所需的所有代码。\n\n在花了这么多时间开发 CardLib 库之后，如果不使用它就太遗憾了。在完成关于\
  \ C# 和 .NET Framework 的面向对象编程章节之前，是时候玩玩了，编写一个使用熟悉的扑克牌类的纸牌游戏基础程序。\n\n与之前的章节一样，你将为\
  \ Ch13CardLib 解决方案添加客户端控制台应用程序，为 Ch13CardLib 项目添加引用，并将其设置为启动项目。该应用程序将命名为 Ch13CardClient。\n\
  \n首先，你将在 Ch13CardClient 的文件 `Player.cs` 中创建一个名为 `Player` 的新类。你可以在本章在线下载的 `Ch13CardClient\\\
  Player.cs` 中找到这段代码。该类将包含两个自动属性：`Name`（字符串类型）和 `PlayHand`（Cards 类型）。这两个属性都具有私有的 `set`\
  \ 访问器，但尽管如此，`PlayHand` 提供了对其内容的写访问，允许你修改玩家手中的牌牌。\n\n你还将通过将其设为私有来隐藏默认构造函数，并提供一个公共的非默认构造函数，为\
  \ `Player` 实例的 `Name` 属性接收初始值。\n\n最后，你将提供一个 `bool` 类型的方法名为 `HasWon()`，如果玩家手中的所有牌花色相同，该方法将返回\
  \ `true`（一个简单的获胜条件，但这并不重要）。\n\n以下是 `Player.cs` 的代码：\n\n\n\n\n```cs\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Threading.Tasks;\nusing Ch13CardLib;\nnamespace Ch13CardClient\n{\n   public\
  \ class Player\n   {\n      public string Name { get; private set; }\n      public\
  \ Cards PlayHand { get; private set; }\n      private Player()\n      {\n      }\n\
  \      public Player(string name)\n      {\n         Name = name;\n         PlayHand\
  \ = new Cards();\n      }\n      public bool HasWon()\n      {\n         bool won\
  \ = true;\n         Suit match = PlayHand[0].suit;\n         for (int i = 1; i <\
  \ PlayHand.Count; i++)\n         {\n            won &= PlayHand[i].suit == match;\n\
  \         }\n         return won;\n      }\n   }\n}\n```\n\n接下来，定义一个处理扑牌游戏本身的类，称为\
  \ `Game`。该类位于 `Ch13CardClient` 项目的 `Game.cs` 文件中。该类有四个私有成员字段：\n\n- `playDeck` —\
  \ 一个 `Deck` 类型的变量，包含要使用的牌堆\n- `currentCard` — 一个 `int` 类型的值，用作指向牌中下一张抽牌的指针\n- `players`\
  \ — 一个 `Player` 对象的数组，代表游戏的玩家\n- `discardedCards` — 一个 `Cards` 集合，用于存放玩家丢弃但尚未洗回牌堆的牌\n\
  \n该类的默认构造函数会初始化并洗牌存储在 `playDeck` 中的 `Deck`，将 `currentCard` 指针变量设置为 0（`playDeck`\
  \ 中的第一张牌），并将名为 `Reshuffle()` 的事件处理程序绑定到 `playDeck.LastCardDrawn` 事件。该处理程序简单地重新洗牌牌，初始化\
  \ `discardedCards` 集合，并将 `currentCard` 重置为 0，准备从新牌中读取牌。\n\n`Game` 类还包含两个实用方法：`SetPlayers()`\
  \ 用于设置游戏玩家（`Player` 对象的数组），以及 `DealHands()` 用于向玩家发牌（每人七张）。允许的玩家人数限制在 2 到 7 人之间，以确保有足够的牌供使用。\n\
  \n最后，有一个 `PlayGame()` 方法，它包含了游戏逻辑本身。在你查看过 `Program.cs` 中的代码后，很快就会回到这个方法。`Game.cs`\
  \ 中的其余代码如下（你可以在 `Ch13CardClient\\Game.cs` 中找到这些代码）：\n\n```cs\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
  using Ch13CardLib;\nusing static System.Console;\nnamespace Ch13CardClient\n{\n\
  \   public class Game\n   {\n      private int currentCard;\n      private Deck\
  \ playDeck;\n      private Player[] players;\n      private Cards discardedCards;\n\
  \      public Game()\n      {\n         currentCard = 0;\n         playDeck = new\
  \ Deck(true);\n         playDeck.LastCardDrawn += Reshuffle;\n         playDeck.Shuffle();\n\
  \         discardedCards = new Cards();\n      }\n      private void Reshuffle(object\
  \ source, EventArgs args)\n      {\n         WriteLine(\"丢弃牌重新洗入牌堆.\");\n      \
  \   ((Deck)source).Shuffle();\n         discardedCards.Clear();\n         currentCard\
  \ = 0;\n      }\n      public void SetPlayers(Player[] newPlayers)\n      {\n  \
  \       if (newPlayers.Length > 7)\n            throw new ArgumentException(\n \
  \              \"此游戏最多允许 7 名玩家参与.\");\n         if (newPlayers.Length < 2)\n   \
  \         throw new ArgumentException(\n               \"此游戏至少需要 2 名玩家参与.\");\n\
  \         players = newPlayers;\n      }\n      private void DealHands()\n     \
  \ {\n         for (int p = 0; p < players.Length; p++)\n         {\n           \
  \ for (int c = 0; c < 7; c++)\n            {\n               players[p].PlayHand.Add(playDeck.GetCard(currentCard++));\n\
  \            }\n         }\n      }\n      public int PlayGame()\n      {\n    \
  \     // 后续代码。\n      }\n   }\n}\n```\n\n`Program.cs` 包含 `Main()` 方法，该方法负责初始化并运行游戏。该方法执行以下步骤：\n\
  \n1. 显示介绍信息。\n2. 提示用户输入 2 到 7 之间的玩家人数。\n3. 相应地设置 `Player` 对象的数组。\n4. 提示每个玩家输入名称，用于初始化数组中的一个\
  \ `Player` 对象。\n5. 创建 `Game` 对象并使用 `SetPlayers()` 方法分配玩家。\n6. 使用 `PlayGame()` 方法启动游戏。\n\
  7. 使用 `PlayGame()` 的 `int` 返回值显示胜利信息（返回的值是 `Player` 对象数组中获胜玩家的索引）。\n\n以下是代码，为了清晰起见添加了注释（你可以在\
  \ `Ch13CardClient\\Program.cs` 中找到这些代码）：\n\n```cs\n static void Main(string[] args)\n\
  \      {\n         // 显示介绍。\n         WriteLine(\"BenjaminCards: 一款新又令人有趣的扑牌游戏.\"\
  );\n         WriteLine(\"要赢得，你手中必须有 7 张同花色的牌.\");\n         WriteLine();\n     \
  \    // 询问玩家人数。\n         bool inputOK = false;\n         int choice = -1;\n   \
  \      do\n         {\n            WriteLine(\"几位玩家 (2–7)?\");\n            string\
  \ input = ReadLine();\n            try\n            {\n               // 尝试将输入转换为有效的人数。\n\
  \               choice = Convert.ToInt32(input);\n               if ((choice >=\
  \ 2) && (choice <= 7))\n                  inputOK = true;\n            }\n     \
  \       catch\n            {\n               // 忽略转换失败，继续循环。\n            }\n  \
  \       } while (inputOK == false);\n         // 初始化 Player 对象数组。\n         Player[]\
  \ players = new Player[choice];\n         // 获取玩家名称。\n         for (int p = 0; p\
  \ < players.Length; p++)\n         {\n            WriteLine($\"玩家 {p + 1},请输入你的名字:\"\
  );\n            string playerName = ReadLine();\n            players[p] = new Player(playerName);\n\
  \         }\n         // 启动游戏。\n         Game newGame = new Game();\n         newGame.SetPlayers(players);\n\
  \         int whoWon = newGame.PlayGame();\n         // 显示胜利者。\n         WriteLine($\"\
  {players[whoWon].Name} 赢得了游戏!\");\n         ReadKey();\n      }\n```\n\n\n\n\n```csharp\n\
  \ public int PlayGame()\n      {\n         // 只有存在玩家时才进行游戏。\n         if (players\
  \ == null)\n            return -1;\n         // 发发牌。\n         DealHands();\n  \
  \       // 初始化游戏变量，包括一个放在桌\n         // 上的初始牌：playCard。\n         bool GameWon =\
  \ false;\n         int currentPlayer;\n         Card playCard = playDeck.GetCard(currentCard++);\n\
  \         discardedCards.Add(playCard);\n         // 主游戏循环，直到 GameWon 为 true 为止。\n\
  \         do\n         {\n            // 遍历每轮游戏中的玩家。\n            for (currentPlayer\
  \ = 0; currentPlayer < players.Length;\n                 currentPlayer++)\n    \
  \        {\n               // 输出当前玩家、玩家手牌以及桌\n               // 上的牌。\n         \
  \      WriteLine($\"{players[currentPlayer].Name}'s turn.\");\n               WriteLine(\"\
  Current hand:\");\n               foreach (Card card in players[currentPlayer].PlayHand)\n\
  \               {\n                  WriteLine(card);\n               }\n      \
  \         WriteLine($\"Card in play: {playCard}\");\n               // 提示玩家拿桌上的牌或抽新牌。\n\
  \               bool inputOK = false;\n               do\n               {\n   \
  \               WriteLine(\"Press T to take card in play or D to draw:\");\n   \
  \               string input = ReadLine();\n                  if (input.ToLower()\
  \ == \"t\")\n                  {\n                     // 将桌上的牌加入玩家手牌。\n       \
  \              WriteLine(\"Drawn: {playCard}\");\n                     // 如果可能，从弃牌堆中移除（如果牌\n\
  \                     // 重新洗牌，它就不再那里了）\n                     if (discardedCards.Contains(playCard))\n\
  \                     {\n                        discardedCards.Remove(playCard);\n\
  \                     }\n                     players[currentPlayer].PlayHand.Add(playCard);\n\
  \                     inputOK = true;\n                  }\n                  if\
  \ (input.ToLower() == \"d\")\n                  {\n                     // 从牌组抽取新牌加入玩家手牌。\n\
  \                     Card newCard;\n                     // 只有当牌不在玩家手牌中\n     \
  \                // 或不在弃牌堆中时才添加。\n                     bool cardIsAvailable;\n \
  \                    do\n                     {\n                        newCard\
  \ = playDeck.GetCard(currentCard++);\n                        // 检查牌是否在弃牌堆中\n  \
  \                      cardIsAvailable = !discardedCards.Contains(newCard);\n  \
  \                      if (cardIsAvailable)\n                        {\n       \
  \                    // 遍历所有玩家手牌查看 newCard\n                           // 是否已在手牌中。\n\
  \                           foreach (Player testPlayer in players)\n           \
  \                {\n                              if (testPlayer.PlayHand.Contains(newCard))\n\
  \                              {\n                                 cardIsAvailable\
  \ = false;\n                                 break;\n                          \
  \    }\n                           }\n                        }\n              \
  \       } while (!cardIsAvailable);\n                     // 将找到的牌加入玩家手牌。\n    \
  \                 WriteLine($\"Drawn: {newCard}\");\n                     players[currentPlayer].PlayHand.Add(newCard);\n\
  \                     inputOK = true;\n                  }\n               } while\
  \ (inputOK == false);\n               // 显示编号的新手牌。\n               WriteLine(\"\
  New hand:\");\n               for (int i = 0; i < players[currentPlayer].PlayHand.Count;\
  \ i++)\n               {\n                  WriteLine($\"{i + 1}: \" +\n       \
  \                     $\"{ players[currentPlayer].PlayHand[i]}\");\n           \
  \    }\n               // 提示玩家选择一张牌要弃掉。\n               inputOK = false;\n     \
  \          int choice = -1;\n               do\n               {\n             \
  \     WriteLine(\"Choose card to discard:\");\n                  string input =\
  \ ReadLine();\n                  try\n                  {\n                    \
  \ // 尝试将输入转换为有效的牌号。\n                     choice = Convert.ToInt32(input);\n   \
  \                  if ((choice > 0) && (choice <= 8))\n                        inputOK\
  \ = true;\n                  }\n                  catch\n                  {\n \
  \                    // 忽略失败转换，继续提示。\n                  }\n               } while\
  \ (inputOK == false);\n               // 将移除的牌引用放入 playCard（将牌\n               //\
  \ 放在桌上），然后从玩家手牌中移除该牌并\n               // 加入弃牌堆。\n               playCard = players[currentPlayer].PlayHand[choice\
  \ - 1];\n               players[currentPlayer].PlayHand.RemoveAt(choice - 1);\n\
  \               discardedCards.Add(playCard);\n               WriteLine($»Discarding:\
  \ {playCard}»);\n               // 为玩家留出空行\n               WriteLine();\n      \
  \         // 检查玩家是否赢得游戏，如果是则退出\n               // 玩家循环。\n               GameWon\
  \ = players[currentPlayer].HasWon();\n               if (GameWon == true)\n    \
  \              break;\n            }\n         } while (GameWon == false);\n   \
  \      // 游戏结束，记录获玩家。\n         return currentPlayer;\n      }\n```\n```\n\n图 13.8\
  \ 显示了正在进行的游戏。\n\n![显示正在进行的牌游戏文本的命令提示符窗口。](img/c13f008.jpg)\n\n图 13.8\n\n作为最后一个练习，请仔细查看\
  \ `Player.HasWon()` 中的代码。你能想出一种方法让这段代码更高效吗？也许不需要在每次调用此方法时都检查玩家手牌中的每张牌？\n\n## 属性\
  \ (Attributes)\n\n本节简要介绍为使用你创建的类型的代码提供额外信息的有用方法：属性（attributes）。属性允许你用信息标记代码段落，这些信息可以从外部读取并以多种方式影响对类型的使用。这通常被称为装饰代码（decorating\
  \ the code）。你可以在本章的 `CustomAttributes\\Program.cs` 中找到该部分的代码。\n\n例如，假设你创建一个类并有一个非常简单的方法。事实上，它简单到你对调试它并不感兴趣。不幸的是（让你非常困扰的是），你在调试应用程序时一直在这样做。在这种情况下，可以在方法上添加一个属性，告诉\
  \ Visual Studio 在调试时不要进入代码；相反，Visual Studio 应该跳过它并到下一个语句。代码如下：\n\n```\n[DebuggerStepThrough]\n\
  public void DullMethod() { … }\n```\n\n代码中的属性是 `DebuggerStepThrough]`。所有属性都以此方式添加，即将属性名称放在方括号中，放在应用的目标之前。你可以向单个目标添加多个属性，方法是用逗号分隔或将每个属性都放在方括号中。\n\
  \n上述代码使用的属性实际上实现在名为 `DebuggerStepThroughAttribute` 的类中，位于 `System.Diagnostics` 命名空间，因此如果你想使用此属性，需要对该命名空间的\
  \ `using` 语句。你可以通过全名引用此属性，或者像你看到的那样，使用不包含 `Attribute` 后缀的缩写名称。\n\n当你以此方式添加属性时，编译器会创建属性类的实例并将其与类关联。某些属性可以通过构造函数参数或属性进行自定义，你可以在添加属性时指定这些内容，例如：\n\
  \n\n\n\n\n```\n[DoesInterestingThings(1000, WhatDoesItDo = \"voodoo\")]\npublic\
  \ class DecoratedClass {}\n```\n\n此属性将值 `1000` 传递给 `DoesInterestingThingsAttribute`\
  \ 的构造函数，并将名为 `WhatDoesItDo` 的属性值设置为字符串 `\"voodoo\"`。\n\n## 读取属性\n\n为了读取属性值，你必须使用一种称为“反射”（reflection）的技术。这是一种相当高级的技术，允许你在运行时动态地检查类型信息，甚至可以让你在不知道这些对象是什么的情况下创建对象并调用方法。本书将不会详细介绍这种技术，但为了使用属性，你确实需要了解一些基础知识。\n\
  \n从本质上说，反射涉及使用存储在 `Type` 对象中的信息（你已经在本书的多个地方见过这些对象）并结合 `System.Reflection` 命名空间中的类型来处理类型信息。你已经看到了通过\
  \ `typeof` 运算符从类获取类型信息的快捷方法，以及通过 `GetType()` 方法从对象实例获取类型信息的方法。通过反射，你可以继续从 `Type`\
  \ 对象查询成员信息。然后，你可以从类或其各种成员中获取属性信息。\n\n实现这一点的最简单的方法（也是你在书中看到的唯一方法）是使用 `Type.GetCustomAttributes()`\
  \ 方法。该方法接受最多两个参数，并返回一个 `object` 实例数组，每个实例都是一个属性实例。首先，你可以可选地传递你感兴趣的属性类型或类型（任何其他属性将被忽略）。如果你省略此参数，将返回所有属性。其次，你必须传递一个布尔值，指示是只查看类本身，还是查看类以及类派生的所有类。\n\
  \n例如，以下代码将列出 `DecoratedClass` 类的属性：\n\n```\nType classType = typeof(DecoratedClass);\n\
  object[] customAttributes = classType.GetCustomAttributes(true);\nforeach (object\
  \ customAttribute in customAttributes)\n{\n   WriteLine($\"Attribute of type {customAttribute}\
  \ found.\");\n}\n```\n\n一旦你通过这种方式找到了属性，就可以对该属性执行适当的操作。这正是 Visual Studio 在遇到之前讨论过的\
  \ `DebuggerStepThroughAttribute` 属性时所做的。\n\n## 创建属性\n\n你只需通过派生自 `System.Attribute`\
  \ 类即可创建自己的属性。有时，你不需要做任何其他操作，因为如果代码只关心属性的存在或缺失，那么就不需要额外信息。但是，如果你希望属性是可自定义的，可以提供非默认构造函数和/或可写属性。\n\
  \n你还需要对你的属性决定两件事：它可以被应用于什么类型的目标（类、属性等），以及它是否可以多次应用于同一个目标。你通过一个应用到你的属性上的属性来指定这些信息，这个属性被称为\
  \ `AttributeUsageAttribute`（这具有某种禅意般的正确感！）。该属性有一个类型为 `AttributeTargets` 的构造函数参数，这是一个枚举，允许你使用\
  \ `|` 运算符组合它的值。它还有一个名为 `AllowMultiple` 的布尔属性，指定该属性是否可以多次应用。\n\n例如，以下代码指定了一个可以（一次）应用到类或属性的属性：\n\
  \n```\n[AttributeUsage(AttributeTargets.Class | AttributeTargets.Method,\n     \
  \           AllowMultiple = false)]\nclass DoesInterestingThingsAttribute : Attribute\n\
  {\n   public DoesInterestingThingsAttribute(int howManyTimes)\n   {\n      HowManyTimes\
  \ = howManyTimes;\n   }\n   public string WhatDoesItDo { get; set; }\n   public\
  \ int HowManyTimes { get; private set; }\n}\n```\n\n此属性 `DoesInterestingThingsAttribute`\
  \ 可以像前面的代码段中那样使用：\n\n```\n[DoesInterestingThings(1000, WhatDoesItDo = \"voodoo\"\
  )]\npublic class DecoratedClass {}\n```\n\n通过修改上一一节中的代码，你可以访问属性的属性：\n\n```\nType\
  \ classType = typeof(DecoratedClass);\nobject[] customAttributes = classType.GetCustomAttributes(true);\n\
  foreach (object customAttribute in customAttributes)\n{\n   WriteLine($\"Attribute\
  \ of type {customAttribute} found.\");\n   DoesInterestingThingsAttribute interestingAttribute\
  \ =\n      customAttribute as DoesInterestingThingsAttribute;\n   if (interestingAttribute\
  \ != null)\n   {\n      WriteLine($\"This class does {interestingAttribute.WhatDoesItDo}\
  \ x \" +\n                $\" {interestingAttribute.HowManyTimes}!\");\n   }\n}\n\
  ```\n\n将本节的所有内容结合起来使用此代码，你将得到图 13.9 所示的结果。\n\n![命令提示符窗口显示文本：Attribute of type CustomAttributes.DoesInterestingThingsAttribute\
  \ found. This class does voodoo x 1000!.](img/c13f009.jpg)\n\n**图 13.9**](#c13.xhtml_c13-fig-anc-0009)\n\
  \n属性可以非常有用，并且遍布于 .NET 应用程序——特别是 WPF 和 Windows Store 应用程序。你将在本书的剩余部分反复遇到它们。\n\n##\
  \ 初始化器\n\n到为止，你已经学习了以各种方式实例化和初始化对象。这无一不要求你在类定义中添加代码以启用初始化，或者通过单独的语句实例化并初始化对象。你还学习了如何创建各种类型的集合类，包括泛型集合类。再次，你可能注意到，没有简单的方法可以将集合的创建与添加结合起来。\n\
  \n对象初始化器提供了一种简化代码的方法，允许你将对象的实例化和初始化结合。集合初始化器提供了一种简单、优雅的语法来到位创建并填充集合。本节将解释如何使用这两个功能。\n\
  \n### 对象初始化器\n\n考虑以下简单的类定义：\n\n```\npublic class Curry\n{\n   public string MainIngredient\
  \ { get; set; }\n   public string Style { get; set; }\n   public int Spiciness {\
  \ get; set; }\n}\n```\n\n此类有三个使用第 10 章所示的自动属性定义的属性。如果你想实例化并初始化该类的实例，必须执行多条语句：\n\n\
  ```\nCurry tastyCurry = new Curry();\ntastyCurry.MainIngredient = \"panir tikka\"\
  ;\ntastyCurry.Style = \"jalfrezi\";\ntastyCurry.Spiciness = 8;\n```\n\n这段代码使用了在类定义中没有构造函数时编译器提供的默认无参数构造函数。为了简化这种初始化，你可以提供适当的非默认构造函数：\n\
  \n```\npublic class Curry\n{\n   public Curry(string mainIngredient, string style,\n\
  \                int spiciness)\n   {\n      MainIngredient = mainIngredient;\n\
  \      Style = style;\n      Spiciness = spiciness;\n   }\n   …\n}\n```\n\n这允许你编写结合实例化与初始化的代码：\n\
  \n```Curry tastyCurry = new Curry(\"panir tikka\", \"jalfrezi\", 8);\n```\n\n这运行良好，尽管它强制使用该类的代码使用此构造函数，这会阻止之前使用无参数构造函数的代码工作。在许多情况下，特别是当类必须可序列化时，有必要提供一个无参数构造函数：\n\
  \n```\npublic class Curry\n{\n   public Curry() {}\n   …\n}\n```\n\n现在你可以以任何你喜欢的方式实例化和初始化\
  \ `Curry` 类。然而，你在初始类定义中添加了几行代码，这些代码除了为这种灵活性提供基础结构外，并没做什么。\n\n\n\n\n输入对象初始化器，这是一种实例化和初始化对象的方法，而无需向类中添加代码（例如此处详细说明的构造函数）。当你实例化一个对象时，可以使用每个想要初始化的属性的名称/值对，为公共可访问的属性或字段提供值。其语法如下：\n\
  \n```\n<ClassName> <variableName> = new <ClassName>\n{\n   <propertyOrField1> =\
  \ <value1>,\n   <propertyOrField2> = <value2>,\n   …\n   <propertyOrFieldN> = <valueN>\n\
  };\n```\n\n例如，你可以如下所示重写之前展示的代码，以实例化并初始化 `Curry` 类型的对象：\n\n```\nCurry tastyCurry\
  \ = new Curry\n{\n   MainIngredient = \"panir tikka\",\n   Style = \"jalfrezi\"\
  ,\n   Spiciness = 8\n};\n```\n\n通常，你可以将此类代码写在单行，而不会严重降低可读性。\n\n当你使用对象初始化器时，你不需要显式地调用类的构造函数。如果你省略了构造函数的括号（如前面的代码所示），则会自动调用默认的无参数构造函数。这发生在初始化器设置任何参数值之前，从而允许你根据需要为默认构造函数中的参数提供默认值。或者，你也可以调用特定的构造函数。同样，该构造函数会被调用，因此在构造函数中对公共属性进行的任何初始化可能会被你在初始化器中提供的值所覆盖。你必须能够访问所使用的构造函数（如果没有显式指定，则为默认构造函数），以便对象初始化器工作。\n\
  \n如果你想要用对象初始化器初始化的属性比此示例中使用的简单类型更复杂，你可能会发现自己在使用嵌套对象初始化器。这简单意味着使用你已经看到的完全相同的语法：\n\
  \n```\nCurry tastyCurry = new Curry\n{\n   MainIngredient = \"panir tikka\",\n \
  \  Style = \"jalfrezi\",\n   Spiciness = 8,\n   Origin = new Restaurant\n   {\n\
  \      Name = \"King's Balti\",\n      Location = \"York Road\",\n      Rating =\
  \ 5\n   }\n};\n```\n\n在这里，初始化了一个类型为 `Restaurant` 的名为 `Origin` 的属性（此处未显示）。代码对 `Origin`\
  \ 属性的三个属性——`Name`、`Location` 和 `Rating`——分别初始化了类型为 `string`、`string` 和 `int` 的值。这种初始化使用了嵌套对象初始化器。\n\
  \n注意，对象初始化器并非默认构造函数的替代品。你可以在实例化对象时使用对象初始化器设置属性和字段值，这一事实并不意味着你总是知道需要初始化什么状态。通过构造函数，你可以精确指定对象运行所需的哪些值，然后立即执行响应于这些值的代码。\n\
  \n此外，在之前的示例中，使用嵌套对象初始化器和使用构造函数之间存在另一个（尽管非常微妙）的区别。这种区别在于对象创建的顺序。使用嵌套初始化器时，顶层对象（`Curry`）首先创建。接下来，创建嵌套对象（`Restaurant`）并将其分配给属性\
  \ `Origin`。如果你使用构造函数，将反转这种构造顺序并将 `Restaurant` 实例传递给给 Curry` 的构造函数。在这个简单的示例中，没有实际区别，但在某些情况下，这可能是重要的。\n\
  \n### 集合初始化器\n\n第 5 章 描述了如何使用以下语法用值初始化数组：\n\n```\nint[] myIntArray = new int[5]\
  \ { 5, 9, 10, 2, 99 };\n```\n\n这是结合数组实例化和初始化的一种快速简便的方法。集合初始化器仅是将此语法扩展到集合：\n\n```\n\
  List<int> myIntCollection = new List<int> { 5, 9, 10, 2, 99 };\n```\n\n通过结合对象初始化器和集合初始化器，可以使用简单优雅的代码来配置集合。而不是像这样的代码：\n\
  \n```\nList<Curry> curries = new List<Curry>();\ncurries.Add(new Curry(\"Chicken\"\
  , \"Pathia\", 6));\ncurries.Add(new Curry(\"Vegetable\", \"Korma\", 3));\ncurries.Add(new\
  \ Curry(\"Prawn\", \"Vindaloo\", 9));\n```\n\n你可以使用以下代码：\n\n```\nList<Curry> moreCurries\
  \ = new List<Curry>\n{\n   new Curry\n   {\n      MainIngredient = \"Chicken\",\n\
  \      Style = \"Pathia\",\n      Spiciness = 6\n   },\n   new Curry\n   {\n   \
  \   MainIngredient = \"Vegetable\",\n      Style = \"Korma\",\n      Spiciness =\
  \ 3\n   },\n   new Curry\n   {\n      MainIngredient = \"Prawn\",\n      Style =\
  \ \"Vindaloo\",\n      Spiciness = 9\n   }\n};\n```\n\n这对于主要用于数据表示的类型非常有效，因此，集合初始化器是书中后面描述的\
  \ LINQ 技术的绝佳辅助。\n\n下面的“尝试一下”说明了如何使用对象初始化器和集合初始化器。\n\n## 类型推断\n\n在本书的前面，你看到了 C# 是一门强类型语言，这意味着每个变量都有固定的类型，并且只能在考虑该类型的代码中使用。在目前为止你看到的每个代码示例中，你通过两种方式之一声明了变量：\n\
  \n```\n<type> variableName;\n<type> variableName = <value>;\n```\n\n\n\n如果应用了这些规则中的最后一条，那么元素可以转换的类型将被称为数组元素的\
  \ `best` 类型。如果对于这个“最佳类型”是什么存在任何歧义——也就是说，如果有两个或多个所有元素都可以隐式转换的类型——那么你的代码将无法编译。相反，你将收到一个指示没有可用最佳类型的错误，如下代码所示：\n\
  \n```\nvar myArray = new[] { 4, \"not an int\", 2 };\n```\n\n另请注意，数值值永远不会被解释为可空类型，因此以下代码将无法编译：\n\
  \n```\nvar myArray = new[] { 4, null, 2 };\n```\n\n不过，你可以使用标准数组初始化器来使其工作：\n\n```\n\
  var myArray = new int?[] { 4, null, 2 };\n```\n\n最后一点：标识符 `var` 并不是禁止用于类名的标识符。这意味着，例如，如果你的代码在作用域内有一个名为\
  \ `var` 的类（在同一个命名空间或引用的命名空间中），那么你就不能使用 `var` 关键字进行隐式类型声明。\n\n类型推断本身并不特别有用，因为在你这一节看到的代码中，它只是起到了复杂问题的作用。使用\
  \ `var` 使得更难一眼看出给定变量的类型。然而，正如你将在本章后面部分看到的，推断类型的概念是非常重要的，因为它是其他技术的基础。下一个主题是匿名类型，这是一个对推断类型至关重要的主题。\n\
  \n## 匿名类型\n\n在编程一段时间后，你可能会发现，特别是在数据库应用程序中，你花费了大量时间创建用于数据表示的简单单调的类。拥有一系列除了暴露属性外什么都不做的类是并不少见常的。在本章之前展示的\
  \ `Curry` 类就是一个完美的例子：\n\n```\npublic class Curry\n{\n   public string MainIngredient\
  \ { get; set; }\n   public string Style { get; set; }\n   public int Spiciness {\
  \ get; set; }\n}\n```\n\n这个类什么都不做——它仅仅存储了结构化数据。在数据库或电子表格术语中，你可以将此类类认为是表格中的行。一个能够持有此类类实例的集合类则是表格或电子表格中多行的表示。\n\
  \n这是类的一种完全可以用法，但为这些类编写代码可能会变得单调，而且对底层数据模式的任何修改都要求你添加、删除或修改定义类的代码。\n\n匿名类型是简化这种编程模型的方法。匿名类型背后的想法是，与其定义这些简单的数据存储类型，你反而可以使用\
  \ C# 编译器根据你想存储在它们中的数据自动创建类型。\n\n上述的 `Curry` 类型可以如下方式实例化：\n\n```\nCurry curry = new\
  \ Curry\n{\n   MainIngredient = \"Lamb\",\n   Style = \"Dhansak\",\n   Spiciness\
  \ = 5\n};\n```\n\n或者，你可以使用匿名类型，如下代码所示：\n\n```\nvar curry = new\n{\n   MainIngredient\
  \ = \"Lamb\",\n   Style = \"Dhansak\",\n   Spiciness = 5\n};\n```\n\n这里有两个不同。第一，是\
  \ `var` 关键字。第二，编译器根据数据创建类型。\n\n## 动态查找\n\n如前所述，`var` 关键字本身并不是一种类型。然而，从 C# 4 开始，情况变得稍微有点固定了。C#\
  \ 4 引入了动态变量（dynamic variables）的概念，正如其名所示，它们是没有固定类型的变量。这样做的主要动机是，在许多情况下，你将想要从另一种语言访问对象。这包括与旧技术（如组件对象模型\
  \ COM）的互操作性，以及与 JavaScript、Python 和 Ruby 等动态语言的互操作性。在不涉及过多实现细节的情况下，过去的方法非常繁琐。例如，假设你有一个来自\
  \ JavaScript 的对象，其名为 `Add()` 的方法可以两个两个。如果没有动态查找，你调用此方法的代码可能像这样：\n\n```\nScriptObject\
  \ jsObj = SomeMethodThatGetsObject();\nint sum = Convert.ToInt32(jsObj.Invoke(\"\
  Add\", 2));\n```\n\n动态查找改变一切——允许你像前面一样编写代码。然而，正如你将在后面的章节中看到的，这种力量是有代价的。\n\n另一种动态查找可以帮助你的情况是，当你处理一个未知类型的\
  \ C# 对象时。这听起来可能是一个奇怪的情况，但它发生的频率比你想象的要得多。在编写可以处理任何接收输入的泛型代码时，这也是一种重要的能力。处理这种情况的“旧”方法是反射，它涉及使用类型信息来访问类型和成员。使用反射访问方法等成员的语法与访问对象的语法非常相似。换句话说，它很杂乱。\n\
  \n在底层，动态查找由动态运行时（DLR）支持。它是 .NET 4.5 的一部分，就像 CLR 一样。关于 DLR 以及它如何使互操作变得简单的准确描述超出了本书的范围；这里你更感兴趣如何在\
  \ C# 中使用它。\n\n### dynamic 类型\n\nC# 4 引入了 `dynamic` 关键字，你可以使用它来定义变量，如下例所示：\n\n```\n\
  dynamic myDynamicVar;\n```\n\n与之前引入的 `var` 关键字不同，确实存在 `dynamic` 类型，因此在声明 `myDynamicVar`\
  \ 时不需要初始化它的值。\n\n一旦你有了一个动态变量，你就可以访问它的成员（此处未显示获取变量的代码）：\n\n```\nmyDynamicVar.DoSomething(\"\
  With this!\");\n```\n\n\n\n无论 `myDynamicVar` 包含什么值，这段代码都可以编译。然而，如果请求的成员不存在，在执行此代码时将得到一个类型为\
  \ `RuntimeBinderException` 的异常。\n\n实际上，你通过此类代码所做的是提供一个在运行时应用的“配方”。程序将检查 `myDynamicVar`\
  \ 的值，并在需要该方法的地方，查找并调用一个带有单个字符串参数的名为 `DoSomething()` 方法。\n\n通过一个示例可以很好地说明这一点。\n\n\
  在这里学到的教训是，动态类型非常强大，但也有一个警示需要学习。如果你使用强类型而不是动态类型，那么这类异常是完全可以避免的。对于你编写的大多数 C# 代码，请避免使用\
  \ `dynamic` 关键字。然而，如果出现了需要使用它的情况，尽管去使用并爱上它吧——顺便为过去那些没有这种强大工具可用的可怜程序员们想一想。\n\n# 高级方法参数\n\
  \nC# 4 扩展了定义和使用方法参数时的可能性。这主要是为了解决在使用外部定义的接口（例如 Microsoft Office 编程模型）时出现的特定问题。在这里，某些方法暴露了大量的参数，其中许多参数在每次调用中都不是必需的。在过去，这意味着需要一种指定缺失参数的方法，或者代码中会出现大量的\
  \ `null`：\n\n```\nRemoteCall(var1, var2, null, null, null, null, null);\n```\n\n\
  在这段代码中，完全不清楚这些 `null` 值指的是什么，或者为什么它们被省略了。\n\n也许，在一个理想的世界里，这个 `RemoteCall()` 方法会有多个重载，其中一个仅需要两个参数，如下所示：\n\
  \n```\nRemoteCall(var1, var2);\n```\n\n然而，这将需要更多具有替代参数组合的方法，这本身就会导致更多问题（需要维护的代码更多、代码复杂性增加等）。\n\
  \n像 Visual Basic 等语言通过不同的方式处理了这种情况，即允许命名参数和可选参数。从 4 版本开始，这在 C# 中变得可能，展示了所有 .NET\
  \ 语言演进融合的一种趋势。\n\n在接下来的章节中，你将看到如何使用这些参数类型。\n\n## 可选参数\n\n当你调用方法时，通常会为特定参数传递相同的值。例如，可以是一个布尔值，可能控制方法操作的非本质部分。更具体地说，考虑以下方法定义：\n\
  \n```\npublic List<string> GetWords(string sentence, bool capitalizeWords)\n{\n\
  \   …\n}\n```\n\n无论传递给 `capitalizeWords` 参数的值是什么，此方法都会返回一个 `string` 值的列表，其中每个值都是输入句子中的一个单词。根据该方法的使用方式，你可能偶尔想要返回的单词列表大写化（也许你正在格式化一个像本节标题“可选参数”那样的标题）。但在大多数情况下，你可能不想这样做，因此大多数调用将如下：\n\
  \n```\nList<string> words = GetWords(sentence, false);\n```\n\n为了使这种行为成为“默认”行为，你可以如下所示声明第二个方法：\n\
  \n```\npublic List<string> GetWords(string sentence) => GetWords(sentence, false);\n\
  ```\n\n此方法调用第二个方法，并为 `capitalizeWords` 传递一个 `false` 值。\n\n这样做没有问题，但你可能可以想象，在使用了更多参数的情况下，情况会变得多么复杂。\n\
  \n另一种方法是将 `capitalizeWords` 参数设为可选参数。这涉及到在方法定义中通过提供默认值（如果未提供则使用该值）来该参数定义为可选，如下：\n\
  \n```\npublic List<string> GetWords(string sentence, bool capitalizeWords = false)\n\
  {\n   …\n}\n```\n\n如果你这样定义一个方法，那么你就可以提供一个或两个参数，只有在你希望 `capitalizeWords` 为 `true`\
  \ 时，第二个参数才是必需的。\n\n### 可选参数值\n\n如上一节所述，方法定义定义可选参数的语法如下：\n\n```\n<parameterType>\
  \ <parameterName> = <defaultValue>\n```\n\n对于 `<defaultValue>` 默认值的使用存在限制。默认值必须是字面量值、常量值或类型的默认值。因此，以下内容将无法编译：\n\
  \n```\npublic bool CapitalizationDefault;\npublic List<string> GetWords(string sentence,\n\
  \   bool capitalizeWords = CapitalizationDefault)\n{\n   …\n}\n```\n\n为了使此起作用，`CapitalizationDefault`\
  \ 值必须定义为常量：\n\n```cs\npublic const bool CapitalizationDefault = false;\n```\n\n\
  这样做是否有意义取决于情况；在大多数情况下，你可能像上一节中一样提供字面量值会更好。\n\n### OptionalAttribute 特性\n\n作为前几节描述的语法的替代，你可以使用\
  \ `OptionalAttribute` 特性如下定义可选参数：\n\n```\n[Optional] <parameterType> <parameterName>\n\
  ```\n\n此特性位于 `System.Runtime.InteropServices` 命名空间。注意，如果你使用这种语法，没有办法为参数提供默认值。\n\n\
  ### 可选参数顺序\n\n当你使用可选值时，它们必须出现在方法参数列表的末尾。任何没有默认值的参数不能出现在任何带有默认值的参数之后。\n\n因此，以下代码是非法的：\n\
  \n```\npublic List<string> GetWords(bool capitalizeWords = false, string sentence)\n\
  {\n   …\n}\n```\n\n在这里，`sentence` 是必需参数，必须出现在 `capitalizeWords` 参数之前。\n\n## 命名参数\n\
  \n当你使用可选参数时，你可能会遇到一种情况，即特定方法有多个可选参数。那么，想象力范围内可以设想这样一种情况：你想为，例如第三个可选参数传递一个值。仅使用上一节的语法，在不提供前两个可选参数值的情况下无法做到这一点。\n\
  \nC# 4 还引入了命名参数，允许你指定任何你想要的参数。这不需要你在方法定义中进行任何特殊操作；它是你在调用方法时使用的一种技术。语法如下：\n\n```\n\
  MyMethod(\n   <param1Name>: <param1Value>,\n   …\n   <paramNName>: <paramNValue>);\n\
  ```\n\n参数名称是方法定义中使用的变量名称。\n\n你可以这种方式指定你喜欢的任何数量的参数，只要命名参数存在，并且可以任何顺序进行。命名参数也可以是可选的。\n\
  \n如果你愿意，你也可以只对方法调用中的部分参数使用命名参数。这在方法签名中具有多个可选参数但包含某些必需参数时特别有用。你可能先指定必需参数，然后用命名的可选参数结束。例如：\n\
  \n```\nMyMethod(\n   requiredParameter1Value,\n   optionalParameter5: optionalParameter5Value);\n\
  ```\n\n如果你混合使用命名参数和位置参数，请注意必须先包含所有位置参数，然后再包含命名参数。然而，如果你喜欢，可以使用不同的顺序，只要处处都使用命名参数，如例所示：\n\
  \n```\nMyMethod(\n   optionalParameter5: optionalParameter5Value,\n   requiredParameter1:\
  \ requiredParameter1Value);\n```\n\n这样做，你必须包含所有必需参数的值。\n\n\n\n\n在接下来的“尝试”（Try It\
  \ Out）中，你将看到如何使用命名参数和可选参数。\n\n这是一个非常有用的工具提示，因为它不仅显示了可用参数名称，还显示了可选参数的默认值，因此你可以一眼看出是否需要覆盖特定的默认值。\n\
  \n## Lambda 表达式\n\nLambda 表达式是 C# 3 中引入的一种结构，你可以用它简化 C# 编程的某些方面，特别是在与 LINQ 结合时。起初它们可能很难理解，主要是因为它们的用法非常灵活。Lambda\
  \ 表达式与其它 C# 语言特征（如匿名方法）结合使用时非常有用。在不看 LINQ（这是本书在后后部分才会讨论的主题）的情况下，匿名方法是研究该主题的最佳切入点。让我们从快速的复习开始。\n\
  \n### 匿名方法回顾\n\n在本章之前的节文中，你学习了匿名方法——即你内联提供的方法，而在其他情况下，这需要一个 `delegate` 类型的变量。当你向事件添加事件处理程序时，事件的序列如下：\n\
  \n1. 定义一个事件处理方法，其返回类型和参数必须与你想要订阅的事件所需的 `delegate` 匹配。\n2. 声明一个用于事件的 `delegate` 类型变量。\n\
  3. 将 `delegate` 变量初始化为 `delegate` 类型的实例，该实例指向事件处理方法。\n4. 将 `delegate` 变量添加到该事件的订阅者列表中。\n\
  \n在实践中，情况比这要简单一点，因为你通常不会费心使用变量来存储委托——你会在订阅事件时直接使用 `delegate` 的实例。\n\n你之前使用以下代码时就是如此：\n\
  \n```\nTimer myTimer = new Timer(100);\nmyTimer.Elapsed += new ElapsedEventHandler(WriteChar);\n\
  ```\n\n这段代码订阅了 `Timer` 对象的 `Elapsed` 事件。该事件使用 `ElapsedEventHandler` 委托类型，该类型通过方法标识符\
  \ `WriteChar` 实例化。结果是，当 `Timer` 触发 `Elapsed` 事件时，会调用 `WriteChar()` 方法。传递给 `WriteChar()`\
  \ 的参数取决于 `ElapsedEventHandler` 委托定义的参数类型，以及触发事件的 `Timer` 中的代码所传递的值。\n\n事实上，C# 编译器可以通过方法组语法用更少的代码实现相同的结果：\n\
  \n```\nmyTimer.Elapsed += WriteChar;\n```\n\nC# 编译器知道 `Elapsed` 事件所需的委托类型，因此它可以填充空白。然而，你应该谨慎地使用这种语法，因为它可能会让你的代码更难读，并让你无法确切知道发生了什么。当你使用匿名方法时，之前显示的事件序列将简化为单个步骤：\n\
  \n1. 使用内联的匿名方法来订阅事件，该方法必须匹配该事件所需的 `delegate` 的返回类型和参数。\n\n内联匿名方法是通过使用 `delegate`\
  \ 关键字定义的：\n\n```\nmyTimer.Elapsed +=\n   delegate(object source, ElapsedEventArgs\
  \ e)\n   {\n      WriteLine(\"Event handler called after {0} milliseconds.\",\n\
  \         (source as Timer).Interval);\n   };\n```\n\n这段代码的效果与单独使用事件处理程序一样好。主要的区别在于，这里使用的匿名方法实际上对你代码的其他部分是隐藏的。例如，你无法在应用程序的其他地方重用此事件处理程序。此外，这里使用的语法（如果能找到更好的描述的话）有点笨拙。`delegate`\
  \ 关键字立即让人产生困惑，因为它实际上被重载了——你既将其用于匿名方法，又将其用于定义委托类型。\n\n### 用于匿名方法的 Lambda 表达式\n\n\
  这引出了 Lambda 表达式。Lambda 表达式简化匿名方法语法的一种方式。事实上，它们不仅于此，但本节目前将保持简单。使用 Lambda 表达式，你可以如下所示重写上一节末尾的代码：\n\
  \n```\nmyTimer.Elapsed += (source, e) => WriteLine(\"Event handler called after\
  \ \" +\n                      $\"{(source as Timer).Interval} milliseconds.\");\n\
  ```\n\n乍看去，这看起来……嗯，有点费解（除非你熟悉如 Lisp 或 Haskell 这种所谓的函数式编程语言）。然而，如果你仔细观察，就可以看到（或至少推推出）它是如何工作的，以及它与被取代的匿名方法之间是什么关系。Lambda\
  \ 表达式由三部分组成：\n\n* 括号中的一组（无类型）参数列表\n* `=>` 运算符\n* 一个 C# 语句\n\n参数的类型是从上下文中推断出来的，使用的逻辑在本章早些时候“匿名类型”节所示的相同。`=>`\
  \ 运算符仅将参数列表与表达式体隔开。当调用 Lambda 表达式时，会执行表达式体。\n\n编译器获取此 Lambda 表达式并创建一个匿名方法，其工作方式与上一节中的匿名方法完全相同。事实上，它将被编译成相同或类似的公共中间语言\
  \ (CIL) 代码。\n\n接下来的“尝试”（Try It Out）将澄清 Lambda 表达式中发生了什么。\n\n## 本章学习内容\n\n| 主题 |\
  \ 核心概念 |\n| :--- | :--- |\n| 命名空间限定 | 为了避免命名空间限定中的歧义，你可以使用 `::` 运算符强制编译器使用你创建的别名。你也可以使用\
  \ `global` 命名空间作为顶层命名空间的别名。 |\n| 自定义异常 | 你可以通过派生根类 `Exception` 来创建自己的异常类。这很有帮助，因为这让你对捕获特定异常有更大的控制力，并允许你自定义异常中包含的数据。\
  \ |\n| 事件处理 | 许多类暴露了在触发器发生时触发的事件。你可以为这些事件编写处理程序以便在事件触发时执行代码。这种双向通信是响应式代码的一种极佳机制，防止了你编写可能轮询对象的复杂代码。\
  \ |\n| 事件定义 | 你可以定义自己的事件类型，这涉及创建一个命名事件和一个用于该事件处理程序的委托类型。你可以使用没有返回类型的标准委托以及派生自 `EventArgs`\
  \ 的自定义事件参数来实现多用途事件处理程序。你还可以使用 `EventHandler` 和 `EventHandler<T>` 委托类型来定义代码简单的事件。\
  \ |\n| 匿名方法 | 通常，为了使代码更具可读性，可以使用匿名方法而不是完整的事件处理方法。这意味着在添加事件处理程序的地方内联定义在事件触发时要执行的代码。你通过\
  \ `delegate` 关键字来实现这一点。 |\n| 特性 | 有时，可能是因为你使用的框架要求，或者是因为你自己的选择，你会在代码中使用特性。你可以使用\
  \ `[AttributeName]` 语法将特性添加到类、方法和其他成员中，并通过派生自 `System.Attribute` 创建自己的特性。你可以通过反射读取属性值。\
  \ |\n| 初始化器 | 你可以使用初始化器在创建对象或集合的同时对其进行初始化。这两种初始化器都由大括号围绕的代码块组成。对象初始化器允许通过提供逗号分隔的属性名/值对来设置属性值。集合初始化器仅需要一个逗号分隔的值列表。当你使用对象初始化器时，还可以使用非默认构造函数。\
  \ |\n\n\n\n\n| 类型推断 | `var` 关键字允许你在声明变量时省略其类型。然而，这只有在类型可以在编译时确定的情况下才是可行的。使用 `var`\
  \ 不会破坏 `C#` 的强类型方法论，因为使用 `var` 声明的变量有一个且仅有一个可能的类型。 |\n| 匿名类型 | 对于许多用于结构化数据存储简单类型，定义类型并非必要。相反，你可以使用匿名类型，其成员根据使用情况推断得出。你使用对象初始化器语法定义匿名类型，并且设置的每个属性都会被定义为只读属性。\
  \ |\n| 动态查找 | 使用 `dynamic` 关键字来定义一个可以持有任何值的动态类型变量。然后你可以使用普通的属性或方法语法访问所包含的值的成员，而这些成员仅在运行时进行检查。如果在运行时尝试访问不存在的成员，则会抛出异常。这种动态类型极大地简化了访问非\
  \ .NET 类型（或在编译时无法获取其类型信息的 .NET 类型）所需的所需的语法。然而，必须谨慎地使用动态类型，因为你将失去编译时的代码检查。你可以通过实现\
  \ `IDynamicMetaObjectProvider` 接口来控制动态查找的行为。 |\n| 可选方法参数 | 通常情况下，你可以定义一个带有大量参数的方法，其中许多参数很少被使用。与其强制客户端代码为很少使用的参数指定值，你可能提供多个方法重载。或者，你可以将这些参数定义为可选的（并为未指定的参数提供默认值）。调用你方法的客户端代码随后只需要指定所需数量的参数。\
  \ |\n| 命名方法参数 | 客户端代码可以通过位置或名称来指定方法参数值（或两者的结合，即先指定位置参数）。命名参数可以以任何顺序指定。这在与可选参数结合使用时特别有用。\
  \ |\n| Lambda 表达式 | Lambda 表达式本质上是定义匿名方法的简写方式，尽管它们具有诸如隐式类型等额外功能。你通过用逗号分隔的参数列表（或在没有参数时使用空括号）、`=>`\
  \ 运算符和一个表达式来定义 Lambda 表达式。该表达式可以是花括号包围的代码块。带有最多八个参数和可选返回类型的 Lambda 表达式可以用 `Action`、`Action<>`\
  \ 和 `Func<>` 委托类型表示。许多与集合配合 LINQ 扩展方法都使用了 Lambda 表达式参数。 |\n\n# 第二部分\n\n## Windows\
  \ 编程\n\n- 第 14 章: 基础桌面编程\n- 第 15 章: 高级桌面编程\n\n# 第 14 章：基础桌面编程\n\n## 本章的 Wrox.com\
  \ 代码下载\n\n你可以在“Download Code”选项卡中通过[`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 下载本章的 [`wrox.com`](http://wrox.com) 代码。代码位于第 14 章下载中，并根据章节中的名称单独命名。\n\n本书的第一部分关注\
  \ `C#` 的细节，但现在是离开编程语言的细节，进入图形用户界面 (GUI) 世界了。\n\n在过去的 10 年里，Visual Studio 为 Windows\
  \ 开发者提供了两种创建用户界的选择：Windows Forms，它是创建针对经典 Windows 应用程序的基础工具；以及 Windows Presentation\
  \ Foundations (WPF)，它提供了更广泛的应用类型，并尝试解决 Windows Forms 的许多问题。WPF 在技术上是平台无关的，其灵活性之一体现在名为\
  \ Silverlight 的 WPF 子集被用于创建交互式 Web 应用程序。在本章和下一章，你将学习如何使用 WPF 创建 Windows 应用程序，并在第\
  \ 23 章中，你将在这些知识的基础上创建通用 Windows 应用 (Universal Windows Apps)。\n\n大多数图形 Windows 应用程序的核心是窗口设计器\
  \ (Window Designer)。你通过从工具箱拖放控件到你的窗口来创建用户界面，将它们放置在你运行应用程序时希望出现的地方。对于 WPF 来说，这部分正确，因为用户界面实际上完全是用另一种语言——扩展应用程序标记语言\
  \ (XAML，发音为 *zammel*) 编写的。Visual Studio 允许你兼顾这两者，随着你对 WPF 越来越熟悉，你可能会将拖放控件与编写原始 XAML\
  \ 结合。\n\n在本章中，你通过 Visual Studio WPF 设计器为你之前章节中编写的卡牌游戏创建多个窗口。你将学习使用 Visual Studio\
  \ 自带的许多控件，这些控件涵盖了广泛的功能。通过 Visual Studio 的设计能力，开发用户界面和处理用户交互非常简单——而且有趣！在本书的范围内介绍\
  \ Visual Studio 的所有控件是不可能的，因此本章将介绍一些常用的控件，从标签和文本框到菜单栏和布局面板。\n\n## XAML\n\nXAML 是一种使用\
  \ XML 语法的语言，它允许以声明性和分层次的方式将控件添加到用户界面中。也就是说，你可以以 XML 元素的形式添加控件，并用 XML 属性指定控件属性。你还可以拥有包含其他控件的控件，这对于布局和功能来说都是关重要的。\n\
  \nXAML 的设计考虑了当今强大的显卡，因此它允许你通过 DirectX 使用这些显卡提供的所有高级功能。以下列出了其中一些能力：\n\n- 浮点坐标和矢量图形，提供了可以进行缩放、旋转以及其他方式的变换而不会损失质量的布局\n\
  - 用于高级渲染的 2D 和 3D 能力\n- 高级字体处理和渲染\n- 具有可选透明度的 UI 对象的填充，包括纯色填充、渐变填充和纹理填充\n- 动画故事板，可用于各种情况，包括点击按钮等用户触发的事件\n\
  - 可重用的资源，你可以用它们来动态设置控件样式\n\n### 关注点分离\n\n多年来维护 Windows 应用程序时存在的一个问题是，它们经常将生成用户界面的代码与根据用户操作执行的代码混合。这使得多个开发人员和设计师在同一个项目上变得困难。WPF\
  \ 通过两种方式解决了这个问题。首先，通过使用 XAML 描述 GUI 而不是 C#，GUI 变得平台无关，你实际上不需要任何代码就可以渲染 XAML。其次，这意味着将\
  \ C# 代码放在与 GUI 代码不同的文件中是自然而。Visual Studio 使用了称为*后置代码* (code-behind) 文件，这些是与 XAML\
  \ 文件动态链接的 C# 文件。\n\n\n\n\n由于 GUI 与代码是分离的，因此可以为 GUI 设计创建定制的应用程序，而这正是微软所做的。用于 Visual\
  \ Studio 的设计工具 `Blend` 是设计师在为 `WPF` 创建 GUI 时首选的工具。该工具可以加载与 Visual Studio 相同的项目，但如果说\
  \ Visual Studio 更多地面向开发者而非设计师，那么 `Expression Blend` 则恰恰相反。这意味着在包含设计师和开发者的大型项目中，每个人都可以在同一个项目上共同工作，使用他们偏好的工具，而不必担心无意中影响他人。\n\
  \n## 实战中的 XAML\n\n如所述，`XAML` 是 `XML`，这意味着只要文件足够小，就能立即看出它所描述的内容。看一眼这个小示例，看看你是否能看出它是做什么的：\n\
  \n```xml\n<Window x:Class=\"Ch14Ex01.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:WpfApplication1\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"Hello World\" Height=\"350\" Width=\"525\">\n    <Grid>\n \
  \   <Button Content=\"Hello World\"\n            HorizontalAlignment=\"Left\"\n\
  \            Margin=\"220,151,0,0\"\n            VerticalAlignment=\"Top\"\n   \
  \         Width=\"75\"/>\n  </Grid>\n</Window>\n```\n\n此示例中的 `XAML` 创建了一个带有单个按钮的窗口。窗口和按钮都显示文本\
  \ \"Hello World\"。`XML` 允许你在其他标签内部放置标签，只要你正确地关闭它们即可。在 `XAML` 中，当一个元素放在另一个元素内部时，该元素就变成了包含性元素的内容，这意味着\
  \ `Button` 也可以这样写：\n\n```xml\n <Button HorizontalAlignment=\"Left\"\n          \
  \  Margin=\"220,151,0,0\"\n            VerticalAlignment=\"Top\"\n            Width=\"\
  75\">\n      Hello World\n    </Button>\n```\n\n在这里，`Button` 的 `Content` 属性被移除，文本现在是\
  \ `Button` 控件的子节点。在 `XAML` 中，`Content` 可以是任何内容，示例也演示了这一点：`Button` 元素是 `Grid` 元素的内容，而\
  \ `Grid` 元素又是 `Window` 元素的内容。\n\n大多数（不是所有）控件都可以拥有内容，并且对于更改内置控件外观的操作限制非常少。第 15 章\
  \ 对此进行了更详细的探讨。\n\n### 命名空间\n\n上一个示例中的 `Window` 元素是 `XAML` 文件的根元素。该元素通常包含若干个命名空间声明。默认情况下，Visual\
  \ Studio 设计器包含了两个你应该注意的命名空间：`http://schemas.microsoft.com/winfx/2006/xaml/presentation`\
  \ 和 `http://schemas.microsoft.com/winfx/2006/xaml`。第一个是 `WPF` 的默认命名空间，声明了你将用于创建用户界面的许多控件。第二个声明了\
  \ `XAML` 语言本身。命名空间不需要在根标签上声明，但这样做可以确保其内容在整个 `XAML` 文件中都能轻松访问，因此很少需要移动声明。\n\n当你在\
  \ Visual Studio 中创建新窗口时，显示命名空间始终被声明为默认空间，语言命名空间声明为 `xmlns:x`。正如 `Window`、`Button`\
  \ 和 `Grid` 标签所示，这确保了你不需要为添加到窗口的控件添加前缀，但你指定的语言元素必须带有 `x` 前缀。\n\n你将经常看到的最后一个命名空间是系统命名空间：`xmlns:sys=\"\
  clr-namespace:System;assembly=mscorlib\"`。此命名空间允许你在 `XAML` 中使用 `.NET Framework`\
  \ 的内置类型。通过这种方式，你编写的标记可以显式声明你正在创建的元素类型。例如，可以在标记中声明一个数组并说明该数组的成员是字符串：\n\n```xml\n\
  \ <Window.Resources>\n    <ResourceDictionary>\n      <x:Array Type=\"sys:String\"\
  \ x:Key=\"localArray\">\n        <sys:String>\"Benjamin Perkins\"</sys:String>\n\
  \        <sys:String>\"Jacob Vibe Hammer\"</sys:String>\n        <sys:String>\"\
  Job D. Reid\"</sys:String>\n      </x:Array>\n    </ResourceDictionary>\n  </Window.Resources>\n\
  ```\n\n### 后代码文件\n\n尽管 `XAML` 是声明用户界面的强大方式，但它并不是编程语言。每当你想要做演示以外的操作时，就需要 `C#`。可以将\
  \ `C#` 代码直接嵌入 `XAML` 中，但从不建议将代码和标记混合，你将在书中不会看到这样做。你会经常看到使用后代码文件。这些文件是普通的 `C#` 文件，名称与\
  \ `XAML` 文件相同，并带有 `.cs` 扩展名。尽管你可以随意为它们命名，但最好遵循命名规范。\n\n\n\n\n控件（Controls）结合了预封装的代码和\
  \ GUI，可以被重用以创建更复杂的应用程序。它们可以定义默认的自绘方式以及一组标准行为。某些控件，如 `Label`、`Button` 和 `TextBox`\
  \ 控件很容易识别，并且已经在 Windows 应用程序中使用了约 20 年。其他控件，如 `Canvas` 和 `StackPanel` 则不显示任何内容，仅仅是帮助你创建\
  \ GUI。\n\n开箱即用的控件看起来与你预期的标准 Windows 应用程序中的控件外观一模一样，并使用当前的 Windows 主题来绘制自身。所有这些内容都是高度可定制的，只需点击几次，你就可以完全改变控件的显示方式。这种自定义是通过定义在控件上的属性完成的。WPF\
  \ 使用你以前见过的普通属性，并添加了一种名为 `dependency property`（依赖属性）的新类型属性。这些属性将在第 15 章中进行详细介绍，但目前只需要知道\
  \ WPF 的许多属性不仅仅是获取和设置一个值；例如，它们能够通知观察者变化。\n\n定义定义某物在屏幕上的外观外，控件还定义了标准行为，例如点击按钮和在列表中选择内容的能力。你可以通过“处理”控件定义的事件来更改用户在控件上执行操作时发生的情况。你何时以及如何实现事件处理程序会根据应用程序和控件的不同而异，但通常情况下你始终会处理按钮的\
  \ `Click` 事件；对于 `ListBox` 控件，你通常需要在用户更改选择时做出反应，因此应该处理 `SelectionChanged` 事件。在其他控件上（如\
  \ `Label` 或 `TextBlock` 控件），你将很少实现任何事件处理。\n\n你可以通过多种方式向窗口中添加控件，但最常见的方法是从工具箱（Toolbox）中将它们拖放并释放到设计\
  \ 视图（Design View）或 XAML 视图中。\n\n### 属性（Properties）\n\n如所述，所有控件都有许多用于操作控件行为的属性。其中一些很容易理解，例如\
  \ `height` 和 `width`，而另一些则不那么直观，例如 `RenderTransform`。所有属性都可以使用属性面板、直接在 XAML 中或通过在设计\
  \ 视图中操作控件来设置。\n\n#### 依赖属性（Dependency Properties）\n\n在大多数情况下，普通的 .NET 属性是简单的 getter（get\
  \ 器）和 setter（set 器），这对于大多数情况都是足够的。然而，当你处理一个在属性更改时可以并且应该发生更改的动态用户界面时，你必须在这些 get 和\
  \ set 方法中编写大量重复的代码。`dependency property` 是一种注册到 WPF 属性系统中的属性，允许实现扩展功能。这种扩展功能包括但不限于自动属性更改通知。具体来说，依赖属性具有以下特性：\n\
  \n*   你可以使用样式（styles）来更改依赖属性的值。\n*   你可以通过资源（resources）或数据绑定（data binding）来设置依赖属性的值。\n\
  *   你可以在动画中更改依赖属性的值。\n*   你可以在 XAML 中层次设置依赖属性——即在父元素上设置的依赖属性值可以用于设置子元素相同依赖属性的默认值。\n\
  *   你可以使用定义的编码模式配置属性值更改的通知。\n*   你可以配置一组相关的属性，以便它们在响应其中一个属性的更改时同时更新。这被称为强制（coercion）。被更改的属性被称为强制了其他属性的值。\n\
  *   你可以对依赖属性应用元数据（metadata）以指定其他行为特征。例如，你可能指定如果给定属性发生变化，则可能需要重新排列用户界面。\n\n在实践中，由于依赖属性的实现方式，你可能发现与普通属性没有太大区别。然而，当你创建自己的控件时，你会很快发现当使用普通的\
  \ .NET 属性时，很多功能突然消失了。\n\n第 15 章 展示了如何实现新的依赖属性。\n\n#### 附加属性（Attached Properties）\n\
  \n附加属性是一种提供给定义属性的类的实例的每个子对象的属性。例如，正如你将在本章后面看到的，你在之前的示例中使用的 `Grid` 控件允许你定义列和行，以便对\
  \ `Grid` 的子控件进行排序。每个子控件可以使用附加属性 `Column` 和 `Row` 来指定它在网格中的位置：\n\n```\n<Grid HorizontalAlignment=\"\
  Left\" Height=\"167\" VerticalAlignment=\"Top\" Width=\"290\">\n  <Button Content=\"\
  Button\" HorizontalAlignment=\"Left\" Margin=\"10,10,0,0\"\nVerticalAlignment=\"\
  Top\" Width=\"75\" Grid.Column=\"0\" Grid.Row=\"0\"\nHeight=\"22\"/>\n…\n  </Grid>\n\
  ```\n\n在这里，使用父元素的名称、点以及附加属性的名称来引用附加属性。\n\n在 WPF 中，附加属性有多种用途。当你查看“控件布局”（Control Layout）部分中如何定位控件时，很快就会很多附加属性。你将学习容器控件如何定义附加属性，允许子控件定义（例如）停靠在容器的哪些边缘上。\n\
  \n### 事件（Events）\n\n在第 13 章。\n\n| 事件 |  |\n| :--- | :--- |\n| `Click` | 当控件被点击时发生。在某些情况下，用户按下\
  \ Enter 键也会触发此事件。 |\n| `Drop` | 当拖放操作完成时——换句话说，当对象被拖到控件上方且用户释放鼠标按钮时发生。 |\n| `DragEnter`\
  \ | 当被拖的对象进入控件边界时发生。 |\n| `DragLeave` | 当被拖的对象离开控件边界时发生。 |\n| `DragOver` | 当对象被拖过控件上方时发生。\
  \ |\n| `KeyDown` | 当控件具有焦点时按下按键时。此事件始终发生在 `KeyPress` 和 `KeyUp` 之前。 |\n| `KeyUp`\
  \ | 当控件具有焦点时释放按键时发生。此事件始终发生在 `KeyDown` 事件之后。 |\n| `GotFocus` | 当控件接收焦点时发生。不要使用此事件执行控件的验证。请使用\
  \ `Validating` 和 `Validated`。 |\n| `LostFocus` | 当控件失去焦点时发生。不要使用此事件执行控件的验证。请使用 `Validating`\
  \ 和 `Validated`。 |\n| `MouseDoubleClick` | 当控件被双击时发生。 |\n\n\n\n\n\n| `MouseDown`\
  \ | 当鼠标指针悬停在控件上并按下鼠标键时触发。这与 `Click` 事件不同，因为 `MouseDown` 在按钮按下时立即触发，且在释放*之前*触发。 |\n\
  | `MouseMove` | 当鼠标在控件上移动时持续触发。 |\n| `MouseUp` | 当鼠标指针悬停在控件上并释放鼠标键时触发。 |\n\n**表\
  \ 14.1** 常用控件事件\n\n你将在本章示例示例看到许多此类事件。\n\n#### 处理事件\n\n添加事件处理程序的基本方法有两种。一种方法是使用 `Properties`（属性）窗口中的\
  \ `Events` 列表，如图图 14.2 所示，该窗口会在你点击闪电按钮时显示。\n\n![属性窗口的截图，其中显示了 17 个数据输入字段，例如 name,\
  \ click, contextmenuclosing, contextmenuopening, datacontextchanged, dragenter 和\
  \ dragleave。](img/c14f002.jpg)\n\n**图 14.2**\n\n要为特定事件添加处理程序，可以输入事件名称并按 `Return`，或者在\
  \ `Events` 列表中双击事件名称右侧。这会导致事件被添加到 `XAML` 标签中。处理该事件的方法签名会被添加到 `C#` 后代码文件中。\n\n```\n\
  \ <Button x:Name=\"rotatedButton\" Content=\"2nd Button\" Width=\"75\"\n       \
  \     Height=\"22\" FontWeight=\"Bold\" Margin=\"218,138,224,159\"\n           \
  \ RenderTransformOrigin=\"0.5,0.5\"\n            Click=\"rotatedButton_Click\">\n\
  \      …\n    </Button>\nprivate void rotatedButton_Click(object sender, RoutedEventArgs\
  \ e)\n    {\n    }\n```\n\n你也可以直接在 `XAML` 中输入事件名称并在那里添加处理程序的名称。如果你这样做，可以右键点击事件并选择\
  \ `Navigate to Event Handler`（导航到事件处理程序）。这将事件处理程序添加到后代码文件中。\n\n#### 路由事件\n\nWPF\
  \ 使用称为 `路由事件`（routed events）的事件。标准的 `.NET` 事件由显式订阅了它的代码处理，并且只发送给这些订阅者。路由事件的不同之处在于，它们可以将事件发送到该控件所参与的层次结构中的所有控件。\n\
  \n路由事件可以在发生事件的控件的层次结构中向上和向下传递。因此，如果你右键点击按钮，`MouseRightButtonDown` 事件将首先发送给按钮本身，然后发送给控件的父级——在前面的示例中，是\
  \ `Grid` 控件。如果未被处理，事件最终将发送到窗口。相反，如果你不希望事件继续沿层次结构向上传递，只需将 `RoutedEventArgs` 属性 `Handled`\
  \ 设置为 `true`，此时将不会进行任何额外的调用。当事件像这样沿控件层次结构向上传递时，它被称为`冒泡事件`（bubbling event）。\n\n路由事件也可以沿另一个方向传递，即从根元素到执行操作的控件。这被称为`隧道事件`（tunneling\
  \ event），按照习惯，所有此类事件都以单词 `Preview` 为前缀，并且始终在其冒泡对应事件之前发生。一个例子是 `PreviewMouseRightButtonDown`\
  \ 事件。\n\n最后，路由事件的行为可以完全像普通的 `.NET` 事件一样，只被发送到执行操作的控件。\n\n#### 路由命令\n\n路由命令的作用与事件非常相似，它们都会导致某些代码的执行。事件是直接绑定到\
  \ `XAML` 中的单个元素和代码中的处理程序上的，而路由命令则更为复杂。\n\n事件和命令之间的关键区别在于它们的用途。每当你有一段代码必须响应发生在应用程序中仅一处的用户操作时，就应该使用事件。此类事件的例子可能是用户点击窗口中的“确定”以保存并关闭窗口时。当你有一段代码将执行以响应发生在许多位置的操作时，则可以使用命令。这方面的例子是保存应用程序的内容。通常会有一个带有\
  \ `Save`（保存）命令的菜单可以选择，以及用于相同目的的工具栏按钮。可以使用事件处理程序来实现这一点，但这意味着要在许多地方实现相同的代码——而命令允许你只写一次代码。\n\
  \n当你创建一个命令时，还必须实现代码来回答“目前，这段代码是否可以对用户可用？”的问题。这意味着当命令与按钮关联时，该按钮可以询问命令是否可以执行，并据此设置其状态。\n\
  \n命令的实现比事件要复杂得多，因此在第 15 章之前不会看到它们的使用，在那里它们将与菜单项一起使用。\n\n#### 控件类型\n\n所述，WPF 有许多控件供选择。感兴趣的两种类型是内容（Content）控件和项目（Items）控件。内容控件（如\
  \ `Button` 控件）有一个 `Content` 属性，可以将其设置为任何其他控件。这意味着你可以决定控件的显示方式，但只能直接指定单个控件。也就是说，你可以指定一个项目控件，它允许插入多个控件。这方面的例子是\
  \ `Grid` 控件。\n\n除了内容和项目控件外，还有许多其他类型的控件不允许使用其他控件作为内容。其中一个例子是 `Image` 控件，它用于显示图像。\n\
  \n#### 控件布局\n\n在这一章中，你已经使用了 `Grid` 元素来布局几个控件，因为这是创建新应用程序时提供的控件。然而，你还没有检查该类的完整功能，也没有学习其他可以使用的布局容器。本节将详细介绍控件布局，它是\
  \ WPF 的一个基本概念。\n\n所有内容布局控件都派自抽象的 `Panel` 类。该类仅定义了一个包含派自 `UIElement` 的对象的容器。所有 WPF\
  \ 控件都派自 `UIElement`。你不能直接使用 `Panel` 类进行布局，但如果你需要，可以派自它。或者，你可以使用以下派自 `Panel` 的布局控件：\n\
  \n*   `Canvas`：该控件允许你按需要放置子控件。它对子控件的位置没有任何限制，也没有提供任何定位帮助。\n*   `DockPanel`：该控件允许你将子控件在其四个边缘之一固定。最后一个子控件填充剩余空间。\n\
  *   `Grid`：该控件允许灵活定位子控件。你可以将该控件的布局分为行和列，从而可以在网格布局中对齐控件。\n*   `StackPanel`：该控件按水平或垂直顺序排列其子控件。\n\
  *   `WrapPanel`：该控件按水平或垂直顺序排列其子控件，类似于 `StackPanel`，但它不是单行或单列控件，而是根据可用空间将其子换行到多行或多列。\n\
  \n稍后我们将详细查看如何使用这些控件。但是，首先有一些基本概念需要理解：\n\n*   控件在堆栈顺序中的显示\n*   如何使用对齐、外边距和内边距来定位控件及其内容\n\
  *   如何使用 `Border` 控件\n\n\n\n\n\n当一个容器控件包含多个子控件时，它们按照特定的堆叠顺序（stack order）进行绘制。你可能在绘图软件包中熟悉这个概念。理解堆叠顺序最好的方法是想象每个控件都包含在一块玻璃板上，而容器包含了了一叠这样的玻璃板。因此，容器的外观就是你从顶部向下看穿这些玻璃层时会看到的内容。容器包含的控件会重叠，所以你看到的内容取决于玻璃板的顺序。如果某个控件在堆栈中的位置较高，那么它就是你在重叠区域看到的那个控件。下方的控件可能会被上方的控件部分或完全遮挡。\n\
  \n这也会影响当你用鼠标点击窗口时的命中测试（hit testing）。在考虑重叠控件时，目标控件始终是堆栈中最位于上方的那个。控件的堆叠顺序由它们在容器子列表中的出现顺序决定。容器中的第一个子控件放在堆栈的最底层，最后一个子控件放在最顶层。第一个和最后一个控件之间的子控件放置在越来越高的层上。控件的堆叠顺序对你在\
  \ WPF 中使用的某些布局控件还有额外的影响，你稍后就会看到。\n\n## 对齐、外边距、内边距与尺寸\n\n之前的示例使用了 `Margin`、`HorizontalAlignment`\
  \ 和 `VerticalAlignment` 属性在 `Grid` 容器中为控件定位，但没有详细介绍它们的用法。你也看到过如何使用 `Height` 和 `Width`\
  \ 来指定尺寸。这些属性以及你尚未查看过的 `Padding`，对于所有的布局控件（或大多数控件，正如你所见到的）都是有用的，但方式不同。不同的布局控件还可以为这些属性设置默认值。你将在后续章节中通过示例看到很多内容，但在那之前，涵盖基础知识是值得的。\n\
  \n两个对齐属性 `HorizontalAlignment` 和 `VerticalAlignment` 决定了控件的对齐方式。`HorizontalAlignment`\
  \ 可以设置为 `Left`、`Right`、`Center` 或 `Stretch`。`Left` 和 `Right` 倾向于将控件位于容器的左边缘或右边缘，`Center`\
  \ 将控件置于中间，而 `Stretch` 则改变控件的宽度，使其边缘延伸容器的侧边。`VerticalAlignment` 类似，其值为 `Top`、`Bottom`、`Center`\
  \ 或 `Stretch`。\n\n`Margin` 和 `Padding` 分别指定了控件边缘周围和控件边缘内部的空白空间。之前的示例使用 `Margin`\
  \ 相对于窗口边缘来定位控件。这之所以有效，是因为当 `HorizontalAlignment` 设置为 `Left` 且 `VerticalAlignment`\
  \ 设置为 `Top` 时，控件被紧贴左上角定位，而 `Margin` 在控件边缘插入了一个间隙。`Padding` 的用法类似，但它是将控件的内容与其边缘隔开。这对于\
  \ `Border` 来说特别有用，正如你将在下一节中看到的。`Padding` 和 `Margin` 都可以以四部分的形式（`leftAmount`、`topAmount`、`rightAmount`、`bottomAmount`）或单个值（一个\
  \ `Thickness` 值）指定。\n\n稍后你将看到 `Height` 和 `Width` 经常受到其他属性的控制。例如，当 `HorizontalAlignment`\
  \ 设置为 `Stretch` 时，控件的 `Width` 属性随着容器宽度的变化而变化。\n\n## Border\n\n`Border` 控件是一个非常简单且非常有用的容器控件。它包含一个子控件，而不是像你稍后将看到的更复杂的控件那样包含多个子控件。这个子控件的大小将调整为完全填充\
  \ `Border` 控件。这看起来可能并不特别有用，但请记住，你可以使用 `Margin` 和 `Padding` 属性在容器内定位 `Border`，并在\
  \ `Border` 边缘内定位 `Border` 的内容。你还可以设置例如设置 `Border` 的 `Background` 属性使其可见。你稍后将看到这个控件的实际应用。\n\
  \n## Canvas\n\n如前所述，`Canvas` 控件提供了控件定位的完全自由。关于 `Canvas` 的另一点是，与子元素一起使用的 `HorizontalAligment`\
  \ 和 `VerticalAlignment` 属性对这些元素的定位没有任何影响。\n\n你可以像之前的示例中那样使用 `Margin` 在 `Canvas`\
  \ 中定位元素，但更好的方法是使用 `Canvas` 类暴露的 `Canvas.Left`、`Canvas.Top`、`Canvas.Right` 和 `Canvas.Bottom`\
  \ 附加属性：\n\n```\n<Canvas…>\n  <Button Canvas.Top=\"10\" Canvas.Left=\"10\"…>Button1</Button>\n\
  </Canvas>\n```\n\n上述代码将 `Button` 置于位置，使其顶边缘距离 `Canvas` 的顶边缘 10 像素，左边缘距离 `Canvas`\
  \ 的左边缘 10 像素。注意，`Top` 和 `Left` 属性优先于 `Bottom` 和 `Right`。例如，如果你同时指定了 `Top` 和 `Bottom`，则\
  \ `Bottom` 属性被忽略。\n\n图 14.3 显示了置于 `Canvas` 控件中的两个 `Rectangle` 控件，窗口被调整为两种大小。\n\n\
  ![周围文字描述的图像。](img/c14f003.jpg)\n\n图 14.3 一个 `Rectangle` 相对于左上角定位，另一个相对于右下角定位。当你调整窗口大小时，这些相对位置保持。你还可以看到\
  \ `Rectangle` 控件堆叠顺序的重要性。右下角的 `Rectangle` 在堆叠顺序中更高。此示例的代码如下（你可以在 `LayoutExamples\\\
  Canvas.xaml` 中找到它）：\n\n```\n<Window x:Class=\"LayoutExamples.Canvas\"\n        xmlns=\"\
  http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n        xmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\
  \n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"Canvas\" Height=\"300\" Width=\"300\">\n    <Canvas Background=\"\
  AliceBlue\">\n        <Rectangle Canvas.Left=\"50\" Canvas.Top=\"50\" Height=\"\
  40\" Width=\"100\"\n                   Stroke=\"Black\" Fill=\"Chocolate\"/>\n \
  \       <Rectangle Canvas.Right=\"50\" Canvas.Bottom=\"50\" Height=\"40\" Width=\"\
  100\"\n                   Stroke=\"Black\" Fill=\"Bisque\"/>\n    </Canvas>\n</Window>\n\
  ```\n\n## DockPanel\n\n`DockPanel` 控件正如其名，允许你将控件靠在它的边缘上。这种布局你应该很熟悉，即使你以前停下来注意到它。例如，这就是\
  \ Word 中的 `Ribbon` 控件保持在 Word 窗口顶部的方式，或者 Visual Studio 中各种窗口定位的方式。在 Visual Studio\
  \ 中，你还可以通过拖动来更改窗口的停靠。\n\n`DockPanel` 有一个子控件可以使用的附加属性来指定控件停靠的边缘：`DockPanel.Dock`。你可以将此属性设置为\
  \ `Left`、`Top`、`Right` 或 `Bottom`。\n\n`DockPanel` 中控件的堆叠顺序极其重要，因为每当你将控件靠在边缘时，你也会减少后续子控件的可用空间。例如，你可能会将一个工具栏靠在\
  \ `DockPanel` 的顶部，然后将另一个工具栏靠在 `DockPanel` 的左侧。第一个控件将横跨整个 `DockPanel` 显示区域的顶部，但第二个控件将仅从第一个工具栏的底部延伸到\
  \ `DockPanel` 的底部，沿左边缘延伸。\n\n\n\n你指定的最后一个子控件将（通常）填充所有之前的子控件定位后剩余的区域。（你可以控制这种行为，这就是为什么这个表述是带有限定的。）\n\
  \n当你在 `DockPanel` 中放置控件时，该控件占据的区域可能比 `DockPanel` 为该控件预留的区域要小。例如，如果你将一个 `Width` 为\
  \ 100、`Height` 为 50 且 `HorizontalAlingment` 为 `Left` 的 `Button` 停靠在 `DockPanel`\
  \ 的顶部，那么 `Button` 右侧将留有未被其他停靠子控件使用的空间。此外，如果 `Button` 控件具有 20 的 `Margin`，那么 `DockPanel`\
  \ 顶部总共将预留 90 像素的空间（该控件的高度加上顶部和底部的外边距）。在用 `DockPanel` 进行布局时，需要考虑这种行为；否则，可能会导致意料之外的结果。\n\
  \n图 14.4 显示了一个示例的 `DockPanel` 布局。\n\n![Dockpanels 窗口截图，显示 Dockpanel.Dock=”Top”、DockPanel.Dock=”Left”、最后一个控件以及\
  \ DockPanel.”Bottom”。 ](img/c14f004.jpg)\n\n图 14.4\n\n该布局的代码如下（你可以在可下载的 `LayoutExamples\\\
  DockPanels.xaml` 代码中找到它）：\n\n```\n<Window x:Class=\"LayoutExamples.DockPanels\"\n\
  \        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n \
  \       xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"DockPanels\" Height=\"300\" Width=\"300\">\n    <DockPanel\
  \ Background=\"AliceBlue\">\n        <Border DockPanel.Dock=\"Top\" Padding=\"10\"\
  \ Margin=\"5\"\n    Background=\"Aquamarine\" Height=\"45\">\n            <Label>1)\
  \ DockPanel.Dock=\"Top\"</Label>\n        </Border>\n        <Border DockPanel.Dock=\"\
  Top\" Padding=\"10\" Margin=\"5\"\n    Background=\"PaleVioletRed\" Height=\"45\"\
  \ Width=\"200\">\n            <Label>2) DockPanel.Dock=\"Top\"</Label>\n       \
  \ </Border>\n        <Border DockPanel.Dock=\"Left\" Padding=\"10\" Margin=\"5\"\
  \n    Background=\"Bisque\" Width=\"200\">\n            <Label>3) DockPanel.Dock=\"\
  Left\"</Label>\n        </Border>\n        <Border DockPanel.Dock=\"Bottom\" Padding=\"\
  10\" Margin=\"5\"\n    Background=\"Ivory\" Width=\"200\" HorizontalAlignment=\"\
  Right\">\n            <Label>4) DockPanel.Dock=\"Bottom\"</Label>\n        </Border>\n\
  \        <Border Padding=\"10\" Margin=\"5\" Background=\"BlueViolet\">\n      \
  \      <Label Foreground=\"White\">5) Last control</Label>\n        </Border>\n\
  \    </DockPanel>\n</Window>\n```\n\n此代码使用了之前介绍的 `Border` 控件来清晰地标出示例布局中的停靠控件区域，并使用\
  \ `Label` 控件输出简单的信息文本。要理解此布局，你必须从上到下逐一查看控件：\n\n1. 第一个 `Border` 控件停靠在 `DockPanel`\
  \ 的顶部。在 `DockPanel` 中占据的总区域是顶部 55 像素（`Height` + 2 × `Margin`）。注意，`Padding` 属性不影响此布局，因为它在\
  \ `Border` 边缘内部，但该属性确实控制嵌入的 `Label` 控件的位置。如果没有 `Height` 或 `Width` 属性的限制，`Border`\
  \ 控件将填充其停靠边缘的任何可用空间，这就是为什么它横跨了整个 `DockPanel`。\n\n2. 第二个 `Border` 控件也停靠在 `DockPanel`\
  \ 的顶部，从显示区域顶部再次占据了 55 像素。此 `Border` 控件还包含 `Width` 属性，导致边框仅占据 `DockPanel` 宽度的部分。它是居中位置的，因为\
  \ `DockPanel` 中 `HorizonalAlignment` 的默认值为 `Center`。\n\n3. 第三个 `Border` 控件停靠在 `DockPanel`\
  \ 的左侧，占据了显示区域左侧 210 像素。\n\n4. 第四个 `Border` 控件停靠在 `DockPanel` 的底部，占据了 30 像素加上其包含的\
  \ `Label` 控件的高度（无论是多少）。该高度由 `Border` 控件的 `Margin`、`Padding` 和内容决定，因为它没有显式指定。`Border`\
  \ 控件锁定在 `DockPanel` 的右下角，因为它的 `HorizontalAlignment` 为 `Right`。\n\n5. 第五个也是最后一个 `Border`\
  \ 控件填充了剩余空间。\n\n### WrapPanel\n\n`WrapPanel` 本质上是 `StackPanel` 的扩展版本；“放不下”的控件会被移动到额外的行（或列）。图\
  \ 14.6 显示了一个包含多个形状的 `WrapPanel` 控件，窗口已调整为两种大小。\n\n\n\n\n\n图 14.6\n\n实现此效果的代码显示此处（你可以在下载的代码的\
  \ `LayoutExamples\\WrapPanel.xaml` 中找到它）：\n\n```xml\n<Window x:Class=\"LayoutExamples.WrapPanel\"\
  \n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
  \        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"WrapPanel\" Height=\"92\" Width=\"260\">\n    <WrapPanel Background=\"\
  AliceBlue\">\n        <Rectangle Fill=\"#FF000000\" Height=\"50\" Width=\"50\" Stroke=\"\
  Black\"\n    RadiusX=\"10\" RadiusY=\"10\"/>\n        <Rectangle Fill=\"#FF111111\"\
  \ Height=\"50\" Width=\"50\" Stroke=\"Black\"\n    RadiusX=\"10\" RadiusY=\"10\"\
  />\n        <Rectangle Fill=\"#FF222222\" Height=\"50\" Width=\"50\" Stroke=\"Black\"\
  \n    RadiusX=\"10\" RadiusY=\"10\"/>\n        <Rectangle Fill=\"#FFFFFFFF\" Height=\"\
  50\" Width=\"50\" Stroke=\"Black\"\n    RadiusX=\"10\" RadiusY=\"10\"/>\n    </WrapPanel>\n\
  </Window>\n```\n\n`WrapPanel` 控件是创建动态布局的一种极方法，它可以使用户精确控制内容的显示方式。\n\n### Grid\n\n\
  `Grid` 控件可以有多个行和列，你可以用它们来布局子控件。在本章中你已经多次使用过 `Grid` 控件，但在所有情况下，你使用的都是单行单列的 `Grid`。要添加更多行和列，你必须使用\
  \ `RowDefinitions` 和 `ColumnDefinitions` 属性，它们分别是 `RowDefinition` 和 `ColumnDefinition`\
  \ 对象的集合，并使用属性元素语法指定：\n\n```xml\n<Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition/>\n\
  \    <RowDefinition/>\n  </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n  \
  \  <ColumnDefinition/>\n    <ColumnDefinition/>\n  </Grid.ColumnDefinitions>\n …\n\
  </Grid>\n```\n\n这段代码定义了一个具有两行两列的 `Grid` 控件。注意，这里不需要额外信息；通过这段代码，当 `Grid` 控件调整大同时，每行每列都会自动调整大小。每行的高度是\
  \ `Grid` 高度的三分之一，每列的宽度的一半。你可以通过将 `Grid.ShowGridlines` 属性设置为 `true` 来在 `Grid` 单元格之间显示线条。\n\
  \n你可以通过 `Width`、`Height`、`MinWidth`、`MaxWidth`、`MinHeight` 和 `MaxHeight` 属性来控制调整大小。例如，设置列的\
  \ `Width` 属性可以确保列保持该宽度。你还可以将列的宽度设置为 `*`，这意味着“在计算所有其他列的宽度后填充剩余空间”。这实际上是默认值。当你有多个\
  \ `Width` 为 `*` 的列时，剩余空间将平均分配给它们。`*` 值也可以用于行的 `Height` 属性。`Height` 和 `Width` 的另一个可能值是\
  \ `Auto`，它根据内容调整行或列的大小。你还可以使用 `GridSplitter` 控件，使用户通过点击和拖拽来自定义行和列的尺寸。\n\n`Grid`\
  \ 控件的子控件可以使用附加属性 `Grid.Column` 和 `Grid.Row` 来指定它们位于哪个单元格。这两个属性的默认值都是 `0`，因此如果你省略了它们，子控件将放置在左角的单元格。子控件还可以使用\
  \ `Grid.ColumnSpan` 和 `Grid.RowSpan` 将自己跨越表格中的多个单元格，其中左上角的单元格由 `Grid.Column` 和 `Grid.Row`\
  \ 指定。\n\n## 游戏客户端\n\n现在你已经了解了使用 WPF 和 Visual Studio 的基础，是时候开始使用控件创建一些实用的东西了。本章的剩余部分以及第\
  \ 15 章 将致力于为你之前几章节中开发的卡牌游戏编写游戏客户端。你将使用大量的控件来编写游戏客户端，你甚至会自己写一个。\n\n在本章中，你将编写游戏的辅助对话框——这包括“关于”、“选项”和“新游戏”窗口。\n\
  \n### 关于窗口\n\n“关于”窗口（有时称为“关于框”）用于显示有关应用程序开发者和应用程序本身的信息。某些“关于”窗口非常复杂，比如 Microsoft\
  \ Office 应用程序和 Visual Studio 中的那些，它们会显示版本和许可信息。按照惯例，可以通过帮助菜单访问“关于”窗口，它通常是列表中的最后一项。\n\
  \n图 14.8 显示了你即将创建的完成对话框的截图。\n\n![关于窗口的截图，显示 Karli (c) 2012 由 Wrox Press 以及](img/c14f008.jpg)\n\
  \n图 14.8\n\n#### 设计界面\n\n“关于”窗口并不是用户经常看到的东西。事实上，它通常位于帮助菜单是因为用户只有在需要查找应用程序版本信息或出错时需要联系人时才会使用它。\n\
  \n当你设计一个应用程序时，应努力保持视觉效果尽可能一致。这意味着你应该坚持使用几种颜色并在处使用相同的控件样式。在 Karli Cards 的情况下，你将使用三种主要的颜色：红、黑、白。\n\
  \n如果你查看图 14.8，你会发现窗口的左上角被 Wrox 标志占据。你之前未使用过图像，但为你的应用程序添加特定的图像可以使界面更加专业。\n\n### Image\
  \ 控件\n\n`Image` 是一个非常简单的控件，但使用效果非常好。它允许你显示单张图像并根据需要对其调整大小。该控件暴露两个属性，如表 14.2 所示。\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `Source` | 使用此属性指定图像的位置。可以是磁盘上的位置或网络上的位置。正如你将在第\
  \ 15 章中看到的，也可以创建一个静态资源并将其作为源。 |\n| `Stretch` | 实际上，很少有图像的大小完全符合你的需求，有时图像的大小需要随着应用程序窗口的调整而改变。你可以使用此属性来控制图像的行为。有四种可能：`None`\
  \ —— 图像不调整大小。`Fill` —— 图像调整大小以填充整个空间。这可能会导致图像变形。`Uniform` —— 图像保持宽高比例，如果填充可用空间会改变比例，则不填充。`UniformToFill`\
  \ —— 图像保持宽高比例并填充可用空间。如果保持比例意味着图像部分超出了可用空间，则图像将被裁剪以适应。 |\n\n**表 14.2** Image 控件\n\
  \n#### Label 控件\n\n\n\n\n\n你已经在之前的某些示例中见过这种最简单的控件了。它向用户显示简单的文本信息，在某些情况下还会传递快捷键信息。该控件使用\
  \ `Content` 属性来显示文本。`Label` 控件在单行上显示文本。如果你在字母前加上下划线字符 `_`，该字母将变为带有下划线，并且你就可以通过前缀字母和\
  \ `Alt` 直接访问该控件。例如，`_Name` 会为紧跟在标签后面的任何控件分配快捷键 `Alt+N`。\n\n## TextBlock 控件\n\n与\
  \ `Label` 一，该控件显示没有任何复杂格式的简单文本。与 `Label` 不同，`TextBlock` 控件能够显示多行文本。无法对文本的各个部分进行格式化。\n\
  \n即使文本无法放入分配给控件的空间，`TextBlock` 也会显示。在这种情况下，控件本身不提供任何滚动条，但在需要时可以将其包装在一个方便的视图控件中：`ScrollViewer`。\n\
  \n## Button 控件\n\n与 `Label` 控件一样，你已经见过很多 `Button` 控件的内容。这种控件无处可见，在用户界面上很容易识别。你的用户会期望他们可以通过左键点击它来执行操作——不多如此。改变这种行为极可能导致糟糕的界面设计和用户感到沮丧。\n\
  \n默认情况下，按钮显示单行短文本或描述描述点击它时会发生情况的图像。\n\n按钮不包含任何显示图像或文本的属性，但你可以使用 `Content` 属性显示简单文本，或者在内容中嵌入\
  \ `Image` 控件来显示图像。你可以在下载的代码 `Ch14Ex01\\ImageButton.xaml` 中找到这段代码：\n\n```\n<Button\
  \ HorizontalAlignment=\"Left\" VerticalAlignment=\"Top\" Width=\"75\" Margin=\"\
  10\" >\n      <StackPanel Orientation=\"Horizontal\">\n        <Image Source=\"\
  .\\Images\\Delete_black_32x32.png\" Stretch=\"UniformToFill\"\nWidth=\"16\" Height=\"\
  16\"/>\n        <TextBlock>Delete</TextBlock>\n      </StackPanel>\n    </Button>\n\
  ```\n\n图 14.9 显示了带有文本和图像的删除（Delete）按钮。\n\n![由周围文本描述的图像。](img/c14f009.jpg)\n\n图 14.9\n\
  \n## 选项窗口（Options Window）\n\n你将要创建的下一个窗口是选项窗口。此窗口允许玩家设置若干可以更改游戏玩法的参数。它还将允许你使用一些尚未用过的控件：`CheckBox`、`RadioButton`、`ComboBox`、`TextBox`\
  \ 和 `TabControl` 控件。\n\n图 14.10 显示了选中第一个标签页（tab）的窗口。乍一看，该窗口看起来非常像“关于”（About）窗口，但这个窗口上有更多事情要做。\n\
  \n![选项对话框的截图，显示了选中的游戏（Game）标签页，带有“与电脑游戏”的复选框和“玩家人数”的数据输入字段。](img/c14f010.jpg)\n\n\
  图 14.10\n\n### TextBox 控件\n\n在本章前面的部分，你使用了 `Label` 和 `TextBlock` 控件。这些控件专门设计用于向用户显示文本。`TextBox`\
  \ 控件允许用户向应用程序中输入文本。虽然它也可以显示文本，但你不应将其用于此目的，除非允许用户编辑显示的文本。如果你决定要使用文本框显示文本，请务必将其 `IsEnabled`\
  \ 属性设置为 `false`，以防止用户编辑它。\n\n你可以使用表 14.3 所示的若干属性来控制文本在 `TextBox` 中的显示方式以及输入方式。\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `Text` | 当前在 `TextBox` 控件中显示的文本。 |\n| `IsEnabled`\
  \ | 当设置为 `true` 时，用户可以编辑 `TextBox` 中的文本。当其为 `false` 时，文本显示为灰色，用户无法获取控件的焦点。 |\n|\
  \ `TextWrapping` | 有时你希望 `TextBox` 只显示单行文本。在这种情况下，你可以将此属性设置为 `NoWrap`。这是默认值。如果你希望文本在多行上显示，可以将其设置为\
  \ `Wrap` 或 `WrapWithOverflow`。`Wrap` 会导致超出框边缘的文本移动到下一行。`WrapWithOverflow` 在某些情况下，如果无法确定合适的断行点，将允许非常长的单词超出边缘。\
  \ |\n| `VerticalScrollBarVisibility` | 如果你的 `TextBox` 允许用户输入多行文本，那么用户可能会输入消失在框下边缘下方的文本。在这种情况下，显示滚动条是一个好主意。如果你希望只有在文本过长无法显示时才出现滚动条，请将其设置为\
  \ `Auto`。将其设置为 `Visible` 以始终显示，将其设置为 `Hidden` 或 `Disabled` 则永远不显示滚动条。 |\n| `AcceptsReturn`\
  \ | 此属性控制如何向 `TextBox` 输入文本。如果你将其设置为 `false`（默认值），则用户无法通过换行键输入。 |\n\n表 14.3 TextBox\n\
  \n### CheckBox 控件\n\n在本章之前，你使用了 `Label` 和 `TextBlock` 控件。这些控件专门设计用于向用户显示文本。`TextBox`\
  \ 控件允许用户向应用程序中输入文本。虽然它也可以显示文本，但除非允许用户编辑显示的文本，否则你不应将其用于此目的。如果你决定要使用文本框显示文本，请务必将其\
  \ `IsEnabled` 属性设置为 `false`，以防止用户编辑它。\n\n你可以使用表 14.3 所示的若干属性来控制文本在 `TextBox` 中的显示方式以及输入方式。\n\
  \n`CheckBox` 用于向用户提供可以选择或取消选择的选项。如果你需要提供一个可以开启或关闭的选项，或者让用户对问题回答“是”或“否”，则应该使用 `CheckBox`（此处应为\
  \ `CheckBox`）。例如，在选项对话框中，你希望用户回答是否要与电脑对战。为此，使用了一个带有“与电脑游戏”文本的 `CheckBox`。\n\n`CheckBox`\
  \ 设计为单个实体使用，不受其他 `CheckBox` 的影响。有时你会看到 `CheckBox` 以链接的方式使用，使得选中一个会导致另一个取消选择，但这并不是该控件的意用途。如果你想要这种功能，应该使用在下一节中描述的\
  \ `RadioButton`。\n\n`CheckBox` 还可以显示第三种状态，称为“不确定”（indeterminate），表示无法给出“是/否”回答。这种状态通常用于\
  \ `CheckBox` 显示其他事物信息的情况。例如，`CheckBox` 有时用于指示树视图中的子节点是否被选中。在这种情况下，如果所有节点都已选中，`CheckBox`\
  \ 将被选中；如果一个都没有选中，则为取消选中；如果部分选中但未全部，则显示为不确定状态。\n\n表 14.4 列出了控制 `CheckBox` 控件的常用属性。\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `Content` | `CheckBox` 是一个 `Content` 控件，因此可以进行深度自定义。向\
  \ `Content` 属性添加文本即可产生默认视图。 |\n| `IsThreeState` | 用于指示控件是否具有两个或三个状态。默认值为 `false`，意味着只有两个可能的值。\
  \ |\n| `IsChecked` | 该值为 `true` 或 `false`。默认情况下，将其设置为 `true` 会显示一个标记。如果 `IsThreeState`\
  \ 为 `true`，则可能为 `null`，表示状态是不确定的。 |\n\n表 14.4 CheckBox 属性\n\n\n\n\n\n`RadioButtons`\
  \ 通常与其他 `RadioButtons` 配合使用，允许用户在多个选项中选择，且任何时间只能选择一个。当你想让用户回答一个可能值非常少的问题时，应该使用 `RadioButtons`。如果可能值超过四个或五个，你应该考虑使用\
  \ `ListBox` 或 `ComboBox`。在稍后创建的“选项”窗口中，用户可以选择计算机玩家的技能水平。有三个选项：笨（Dumb）、好（Good）和作弊（Cheats）。在任何给定时间内只能选择其中一个。\n\
  \n当在同一个视图中显示多个 `RadioButton` 时，它们默认会相互感知，一旦其中任何一个被选中，所有其他的都会被清除。如果你在同一个视图中有多个不无关的\
  \ `RadioButtons`，可以将它们分组，以避免某些控件清除了无关控件的值。\n\n你可以通过表 14.5 中列出的属性来控制 `RadioButtons`。\n\
  \n| 属性 | 说明 |\n| :--- | :--- |\n| `Content` | `RadioButtons` 是 `Content` 控件，因此可以修改它们的显示。默认情况下，你在\
  \ `Content` 中输入文本。 |\n| `IsChecked` | 这是 `true` 或 `false`。如果 `IsThreeState` 为 `true`，则可能是\
  \ `null`，表示状态是不不确定的。 |\n| `GroupName` | 控件所属组的名称。默认情况下此为空，任何没有 `GroupName` 的 `RadioButtons`\
  \ 都被视为同一组。 |\n\n**表 14.5** RadioButton 属性\n\n### ComboBox 控件\n\n与 `RadioButton`\
  \ 和 `CheckBox` 控件一样，`ComboBoxes` 允许用户仅选择一个选项。然而，`ComboBoxes` 在两个方面与另外两个控件有本质区别：\n\
  \n*   `ComboBoxes` 在下拉列表中显示可能的选择。\n*   可以允许用户输入新值。\n\n`ComboBoxes` 通常用于显示长值列表，例如国家或州名称，但它们也可以用于许多目的。在“选项”对话框中，一个\
  \ `ComboBox` 用于显示一个列表，用户可以从列表中选择人数。虽然这也可以使用 `RadioButtons` 来实现，但使用 `ComboBox` 节省了视图中的空间。\n\
  \n`ComboBox` 可以被更改为在顶部带有 `TextBox` 的方式显示自己，允许用户输入他们认为缺失的任何值。本章的练习之一要求你向“选项”对话框添加一个\
  \ `ComboBox`，用户可以在其中输入他们的名字，也可以从列表中选择他们的名字。\n\n两个属性——`IsReadOnly` 和 `IsEditable`——对控件的行为非常重要，并共同工作，为用户提供了四种使用键盘选择\
  \ `ComboBox` 值的可能方法（参见表 14.6）：\n\n| | IsReadOnly 为 true | IsReadOnly 为 false |\n\
  | :--- | :--- | :--- |\n| `IsEditable` 为 `true` | 显示 `TextBox` 但控件对按键按下没有反应。如果在列表中选择了某项，则可以在\
  \ `TextBox` 中选中该文本。 | 显示 `TextBox` 用户可以输入她任何想要的内容。如果输入了列表中的内容，则会被选中。当用户输入时，控件将显示最佳的匹配项。\
  \ |\n| `IsEditable` 为 `false` | 当 `IsEditable` 为 `false` 时，`IsReadOnly` 不再产生影响，因为\
  \ `TextBox` 不显示。当选中控件时，用户可以通过输入从列表中选择一个值，但无法输入列表中不存在的值。 | |\n\n**表 14.6** IsReadOnly\
  \ 和 IsEditable 组合\n\n一个 `ComboBox` 是一个 Items 控件，这意味着你可以向它添加多个项目。表 14.7 显示了 ComboBox\
  \ 控件的附加属性。\n\n| ComboBox 属性 | 说明 |\n| :--- | :--- |\n| `Text` | `Text` 属性表示在 `ComboBox`\
  \ 开头显示的文本。它它是列表中的一个元素，或者是用户输入的新文本。 |\n| `SelectedIndex` | 代表列表中选中项的索引。如果为 –1，则没有进行选择。如果用户输入了不在列表中的内容，情况也是如此。\
  \ |\n| `SelectedItem` | 代表列表的实际项目，而不仅仅是索引或文本。如果没有选中任何内容或用户输入了新内容，则返回 null。 |\n\n\
  **表 14.7** 其他 ComboBox 属性\n\n### TabControl 控件\n\n`TabControl` 与本节介绍的其他控件有本质不同。它是一种布局控件，用于将控件分组在页面上，可以通过点击页面来选择它们。\n\
  \n当你想在单个窗口中显示大量信息但不想让视图太混乱时，就会使用标签控件。在这种情况下，你应该将信息分成相关项目的组，并为每个组创建一个单独的页面。通常情况下，每个页面由\
  \ `TabItems` 构建，但你可以将 `Grid` 更改为任何控件。每个 `TabItem` 都有一个用于显示的 `Header`，因此它可以不仅仅是文本。\n\
  \n#### 在选项窗口中处理事件\n\n窗口目前看起来还可以，尽管当设置更改时不会发生任何事情。用户期望他们选择的选项会被存储并供应用程序。你可以通过存储窗口中控件的值来实现此，但这并不灵活，并将数据与\
  \ GUI 混合在了一起。相反，你应该创建一个类来存储用户所做的选择。\n\n### 数据绑定\n\n数据绑定是声明式连接控件与数据的方法。在“选项”窗口中，你处理了\
  \ `RadioButtons` 的 `Checked` 事件以便设置 `GameOptions` 类中 `ComputerSkillLevel` 属性的值。这种方法很好，你可以使用代码和事件处理来设置窗口中的所有值，但通常直接将控件属性绑定到数据更好。\n\
  \n一个绑定包含四个组件：\n\n*   绑定目标，指定使用绑定的对象\n*   目标属性，指定要设置的属性\n*   绑定源，指定绑定使用的对象\n*   源属性，指定哪个属性持有数据\n\
  \n你不总是显式地设置这些元素；特别是绑定目标，通常由于你正在对某个属性设置绑定而成为隐式指定的。\n\n绑定源总是为了使绑定工作而设置，但可以通过多种方式设置。在接下来的章节和第\
  \ 15 章中，你将看到几种从源绑定数据的方法。\n\n#### DataContext\n\n`DataContext` 控件定义了一个数据源，供所有子元素用于绑定。你通常有一个类实例，持有视图中使用的大部分数据。如果是这样，你可以将窗口的\
  \ `DataContext` 设置为该对象的实例，从而使你能够在视图中绑定该类的属性。这在“动态绑定到外部对象”部分进行了演示。\n\n#### 绑定到本地对象\n\
  \n\n\n\n\n只要编译器能够定位该对象，你就可以绑定到任何包含你所需数据的 .NET 对象。如果该对象在相同的上下文中（即与使用该对象的同一个 XAML\
  \ 块中），你可以通过设置绑定的 `ElementName` 属性来指定绑定源。请查看来自“选项”窗口的这个更改后的 `ComboBox`：\n\n```\n\
  <ComboBox HorizontalAlignment=\"Left\" Margin=\"196,58,0,0\" VerticalAlignment=\"\
  Top\"\nWidth=\"86\" Name=\"numberOfPlayersComboBox\" SelectedIndex=\"0\"\nIsEnabled=\"\
  {Binding ElementName=playAgainstComputerCheck, Path=IsChecked}\" >\n```\n\n注意 `IsEnabled`\
  \ 属性。现在不是指定 `true` 或 `false`，而是在大括号内有一段长文本。这种指定属性值的方式被称为标记扩展语法（markup extension\
  \ syntax），它是指定属性的简写。同样也可以这样写：\n\n```xml\n <ComboBox HorizontalAlignment=\"Left\"\
  \ Margin=\"196,58,0,0\"\nVerticalAlignment=\"Top\" Width=\"86\" Name=\"numberOfPlayersComboBox\"\
  \nSelectedIndex=\"0\" >\n              <ComboBox.IsEnabled>\n                <Binding\
  \ ElementName=\"playAgainstComputerCheck\"\nPath=\"IsChecked\"/>\n             \
  \ </ComboBox.IsEnabled>\n```\n\n这两个示例都将绑定源设置为 `playAgainstComputerCheck` `CheckBox`。源源属性通过\
  \ `Path` 指定为 `IsChecked` 属性。\n\n绑定目标被设置为 `IsEnabled` 属性。这两个示例都通过将绑定指定为属性的内容来实现此——它们只是使用了不同的语法。最后，绑定目标通过绑定是在\
  \ `ComboBox` 上进行的这一事实被隐式指定。\n\n此示例中的绑定会根据 `CheckBox` 的 `IsChecked` 属性的值，设置或清除 `ComboBox`\
  \ 的 `IsEnabled` 属性。结果是，在不编写任何代码的情况下，当用户更改 `CheckBox` 的值时，`ComboBox` 会被启用或禁用。\n\n\
  ### 外部对象的静态绑定\n\n可以通过指定某个类在 XAML 中用作资源来即时创建对象实例。这是通过向 XAML 添加命名空间以允许定位该类，然后在 XAML\
  \ 中的某个元素上将该类声明为资源来实现的。\n\n你可以在想要进行数据绑定的对象的父元素上创建资源引用。\n\n### 外部对象的动态绑定\n\n现在，你可以绑定到为了提供某些数据而按需动态创建的对象。如果你已经有一个想要用于数据绑定的实例化对象，会怎样？在这种情况下，你需要在代码中做一些衔接工作。\n\
  \n在“选项”窗口的情况下，你不希望每次打开窗口时都清空选项，并且你希望用户所做的选择能够持久化并用于应用程序的其他部分。\n\n你可以通过代码中将 `DataContext`\
  \ 属性的值设置为该实例来实现这一点。\n\n### 使用 ListBox 控件启动游戏\n\n你现在离创建游戏所有支持窗口只差一个窗口了。在创建游戏板之前的最后一个窗口是一个玩家可以在其中添加新玩家并选择参与新游戏玩家的窗口。此窗口将使用\
  \ `ListBox` 来显示玩家名称。\n\n`ListBoxes` 和 `ComboBoxes` 经常可以用于相同的目的，但 `ComboBox` 通常只允许你选择单个条目，而\
  \ `ListBoxes` 通常允许用户选择多个项目。另一个关键区别是，`ListBox` 将在一个始终展开的列表中显示其内容。这意味着它占据了窗口上更多的空间，但它允许用户立即看到可用的选项。\n\
  \n表 14.8 列出了 ListBox 控件的几个特别有趣的属性。\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `SelectionMode`\
  \ | 此属性控制用户如何从列表中选择项目。有三个可能的值：`Single`，允许用户选择一个项目；`Multiple`，允许用户选择多个项目；`Extended`，允许用户通过按住键选择连续的项目。\
  \ |\n| `SelectedItem` | 获取或设置第一个选中的项目，如果未选中任何内容则返回 null。 |\n| `SelectedItems` |\
  \ 获取一个包含所选项目的列表。 |\n| `SelectedIndex` | 作用类似于 `SelectedItem`，但返回的是索引而不是项目；如果没有选中，则返回\
  \ -1。 |\n\n### 有趣的 ListBox 属性\n\n* * *\n\n# 练习\n\n1. **14.1** `TextBlock` 控件可以用于显示大量文本，但如果文本超出了视口，它不提供任何滚动文本的方法。通过将\
  \ `TextBlock` 与另一个控件结合，创建一个文本内容超出视口的窗口。\n2. **14.2** `Slider` 和 `Progress` 控件有一些共同点，例如最小值、最大值和当前值。在\
  \ `ProgressBar` 上使用数据绑定，创建一个由滑块控制最小值、最大值和当前值的窗口。\n3. **14.3** 将上一个问题中的 `ProgressBar`\
  \ 更改为从左下角到右上角对角显示。\n4. **14.4** 创建一个名为 `PersistentSlider` 的新类并带有三个属性。该类必须参与数据绑定，并且所有属性都能够通知绑定的控件更改。\n\
  \    - 在你之前的练习中创建的窗口的后台代码中，创建一个 `PersistentSlider` 类型的新字段并对其进行初始化值。\n    - 在构造函数中，将该实例绑定到数据源。\n\
  \    - 将滑块的 `Minimum`、`Maximum` 和 `Value` 属性绑定到数据源。\n\n练习答案可以在 附录 A。\n\n* * *\n\n\
  ## 本章所学\n\n| 核心概念 |  |\n| :--- | :--- |\n| XAML | XAML 是一种使用 XML 语法的语言，能够以声明的方式将控件添加到用户界面。\
  \ |\n| 数据绑定 | 你可以使用数据绑定将控件的属性连接到其他控件的值。你还可以定义资源，并在视图之外的类中定义代码，作为属性值和控件内容的数据源。`DataContext`\
  \ 可用于指定现有实例的绑定源，从而允许你绑定到应用程序其他部分创建实例。 |\n| 路由事件 | 路由事件是 WPF 中的特殊事件。它们有两种形式：冒泡和隧道。冒泡事件首先在激活它们的控件上调用，然后向上冒泡通过视图树到达根元素。隧道事件向相反移动，从根元素移动到用户激活的控件。通过将将事件参数的\
  \ `Handled` 属性设置为 `true` 可以停止冒泡和隧道。 |\n| INotifyPropertyChanged | `INotifyPropertyChanged`\
  \ 接口由用于 WPF 视图类实现。当类的属性设置器被调用时，它们会触发 `PropertyChanged` 事件，并带有更改了值的属性名称。任何绑定到触发事件属性的控件属性都会收到更改通知并相应更新。\
  \ |\n\n\n\n\n\n| ObservableCollections | `ObservableCollection` 是一种集合，它其中一个特性实现了\
  \ `INotifyPropertyChanged` 接口。当你想要为 WPF 视图提供列表类型的属性或值进行数据绑定时，就会使用这种特殊集合。 |\n| Content\
  \ controls | 内容控件在其内容中可以包含一个单个控件。此类控件的示例是 `Button`。该控件可以是 `Grid` 或 `StackPanel`；它们允许你创建复杂的自定义内容。\
  \ |\n| Items controls | 列表控件在其内容中可以包含一个控件列表。此类控件的示例是 `ListBox`。列表中的每个控件都可以进行自定义。\
  \ |\n| Layout controls | 你学习了使用一些帮助创建视图的控件：\n1. `Canvas` 允许对控件进行显式定位，但其他功能较少。\n\
  2. `StackPanel` 在水平或垂直方向上堆叠控件。\n3. `WrapPanel` 堆叠控件并根据面板的方向将它们换行到下一行或下一列。\n4. `DockPanel`\
  \ 允许你将控件停靠在控件的边缘或填充整个内容。\n5. `Grid` 允许你定义行和列，并使用这些行列来定位控件。 |\n| UI controls | UI\
  \ 控件在视图上显示自身，通常使用布局控件来引导它们的位置。这些控件用于：\n1. `Label` 控件显示短文本。\n2. `TextBlock` 控件显示可能需要多行显示的文本。\n\
  3. `TextBox` 控件允许用户提供文本输入。\n4. `Button` 控件允许用户执行单个操作。\n5. `Image` 控件用于显示图像。\n6.\
  \ `CheckBoxes` 让用户回答是/否问题，例如“与电脑对战？”。\n7. `RadioButtons` 让用户从多个选项中恰好选择一个。\n8. `ComboBoxes`\
  \ 显示项的下拉列表，用户可以从中选择单项。该控件还可以显示一个 `TextBox`，允许用户输入新选项。\n9. `ListBox` 控件显示项目列表。与 `ComboBox`\
  \ 不同，列表始终是展开状态。该控件允许选择多个项目。\n10. `TabControls` 允许你在页上对控件进行分组。 |\n\n# 第 15 章：高级桌面编程\n\
  \n## 本章的 Wrox.com 代码下载\n\n你可以在下载代码选项卡中找到本章的 `wrox.com` (`http://wrox.com`) 代码下载，地址为\
  \ `www.wrox.com/go/beginningvisualc#2015programming` (`http://www.wrox.com/go/beginningvisualc#2015programming`)。代码位于\
  \ 第 15 章 下载中，并根据整个章节中的名称进行单独命名。\n\n到目前，你使用 Windows Presentation Foundation (WPF)\
  \ 的方式与你在 Visual Studio 中创建窗口应用程序的另一种主要技术——Windows Forms——非常相似。但这种情况即将发生变化。WPF 可以为任何控件设置样式，并使用模板更改现有控件，使其看起来与默认状态完全不同。此外，你将开始越来越多地通过输入\
  \ XAML 来工作。尽管起初看起来可能像是一种负担，但通过设置属性来移动和精调显示的能力将很快变成本能，你会发现 XAML 中有很多东西是在设计器中无法完成的，例如创建动画。\n\
  \n现在是时候继续你在 第 14 章 停止的地方，继续编写游戏客户端了。\n\n## 主窗口\n\n应用程序的主窗口是玩游戏的地方，因此它上面的控件并不多。你将在本章构建游戏，但在开始之前，有三件事是你必须做的。你需要将主窗口添加到项目中，为窗口添加菜单，并将你已经构建的窗口绑定到菜单项上。\n\
  \n### 菜单控件\n\n大多数应用程序都包含某种类型的菜单和工具栏。两者都是实现相同目的手段：为应用程序内容提供方便的导航。工具栏通常包含菜单提供的相同条目的子集，可以被视为菜单项的快捷方式。\n\
  \nVisual Studio 同时带了 `Menu` 和 `Toolbar` 控件。这里的示例显示了 `Menu` 控件的使用，但使用工具栏非常相似。\n\n\
  默认情况下，菜单项显示为一条水平条，你可以从其下拉出项目列表。该控件是一个 `Items` 控件，因此可以更改内容中包含的默认项目；但是你通常会以某种形式使用\
  \ `MenuItems`，如下例所示。每个 `MenuItem` 都可以包含其他菜单项，你可以通过在彼此之间嵌套 `MenuItems` 来构建复杂的菜单，但你应该尝试尽可能保持菜单结构尽可能简单。\n\
  \n你可以使用许多属性控制 `MenuItem` 的显示方式（参见 表 15.1 显示 MenuItem 属性\n\n### 菜单中的路由命令\n\n路由命令在\
  \ 第 14 章 中简要讨论过，现在你将第一次看到它们的运行。回想一下这些命令类似于事件，在用户执行操作时执行代码，并且可以返回一个指示是否随时可以执行的状态。\n\
  \n你想使用路由命令而不是事件的原因至少有三个：\n\n1. 引起事件的操作可以从多个位置触发。\n2. UI 元素应仅在某些条件下可用，例如在没有可保存内容时禁用保存按钮。\n\
  3. 你将处理事件的代码与后台代码文件分离。\n\n如果这些场景中任何一个符合你的情况，请考虑使用路由命令。在游戏案例中，菜单中的某些项也应该在工具栏可用。此外，保存操作应仅在游戏进行时可用，并且应该同时来自菜单和工具栏。\n\
  \n## 创建和样式化\n\n现在是时候离开游戏的客户端实现，更多地关注游戏本身了。图形牌游戏的一个关键特性是……牌牌。显然，你不会在 WPF 自带的标准控件中找到“纸牌”控件，所以你必须自己创建它。\n\
  \nWPF 的最佳功能之一是为设计人员提供了对用户界面外观和感觉的完全控制。其核心是可以按照两个或三个维度对控件进行任何所需的样式。到为止，你一直在使用 .NET\
  \ 提供的控件基本样式，但实际可能性是无限的。\n\n本节介绍了两种基本技术：\n\n* **样式** —— 批量应用于控件的属性集\n* **模板** ——\
  \ 用于构建控件显示的控件\n\n这里存在某些重叠，因为样式可以包含模板。\n\n### 样式\n\n\n\n\nWPF 控件有一个名为 `Style` 的属性（继承自\
  \ `FrameworkElement`），该属性可以设置为 `Style` 类的实例。`Style` 类非常复杂，并能够实现高级的样式功能，但其核心本质上是一组\
  \ `Setter` 对象。每个 `Setter` 对象都负责根据其 `Property` 属性（要设置的属性名称）和其 `Value` 属性（要设置的属性值）来设置属性的值。你可以将在\
  \ `Property` 中使用的名称完全限定到控件类型（例如 `Button.Foreground`），或者你也可以设置 `Style` 对象的 `TargetType`\
  \ 属性（例如 `Button`），这样它就能够解析属性名称。\n\n以下代码展示了如何使用 `Style` 对象设置 `Button` 控件的 `Foreground`\
  \ 属性：\n\n```xml\n<Button>\n  Click me!\n  <Button.Style>\n    <Style TargetType=\"\
  Button\">\n      <Setter Property=\"Foreground\">\n        <Setter.Value>\n    \
  \      <SolidColorBrush Color=\"Purple\"/>\n        </Setter.Value>\n      </Setter>\n\
  \    </Style>\n  </Button.Style>\n</Button>\n```\n\n显然，在这种情况下，直接用通常的方法设置按钮的 `Foreground`\
  \ 属性要简单得多。当你将样式转换为资源时，样式会变得有用得多，因为资源是可以重复使用的。你将在本章节后面的“WPF 用户控件”部分学习如何这样做。\n\n###\
  \ 模板 (Templates)\n\n控件是通过模板构建的，你可以自定义这些模板。模板由用于构建控件显示的控件层级结构组成，其中可能包含一个用于按钮等显示内容的控件的内容呈现器。\n\
  \n控件的模板存储在它的 `Template` 属性中，该属性是 `ControlTemplate` 类的实例。`ControlTemplate` 类包含一个\
  \ `TargetType` 属性，你可以将其设置为正在定义模板的控件类型，并且它可以包含单个控件。该控件可以是像 `Grid` 这样的容器，因此这并没有完全限制你能做的操作。\n\
  \n通常情况下，你通过使用样式来设置类的模板。这仅涉及以以下方式为 `Template` 属性提供要使用的控件：\n\n```xml\n<Button>\n \
  \ Click me!\n  <Button.Style>\n    <Style TargetType=\"Button\">\n      <Setter\
  \ Property=\"Template\">\n        <Setter.Value>\n          <ControlTemplate TargetType=\"\
  Button\">\n            …\n          </ControlTemplate>\n        </Setter>\n    </Style>\n\
  \  </Button.Style>\n</Button>\n```\n\n某些控件可能需要多个模板。例如，`CheckBox` 控件使用一个模板用于复选框 (`CheckBox.Template`)，并使用另一个模板用于在复选框旁边输出文本\
  \ (`CheckBox.ContentTemplate`)。\n\n需要内容呈现器的模板可以在你想要输出内容的地方包含一个 `ContentPresenter`\
  \ 控件。某些控件——特别是那些输出项目集合的控件——使用了替代技术，这些技术在本章中未被涵盖。\n\n再次，替换模板在与资源结合时最有用处。然而，由于控件样式化是一种非常常用的技术，在“尝试一试（Try\
  \ It Out）”中查看如何实现它是它是值得的。\n\n### 值转换器 (Value Converters)\n\n你可能对目前为止在示例中使用的某些赋值感到奇怪：例如，你如何将字符串值“true”赋值给一个布尔（Boolean）属性？你已经学过\
  \ C# 是类型安全的，编译器不应该允许那种事情发生！幸运的是，现实情况是它并不会发生。XAML 和 WPF 广泛使用了被称为值转换器（value converters）的东西，它们可以在后台从一种类型转换为另一种类型。\n\
  \nWPF 自带了几乎涵盖你想到的所有标准场景的转换器，因此你可以始终将 `int` 转换为 `string` 或 `bool` 和整数。但当你想要转换某个未包含的内容时会发生什么？你必须自己实现转换器。\n\
  \n让我们来看一个非常常见的例子：反转布尔转换器。假设你在对话框上有一个复选框。根据它是否被勾选，对话框的另一个部分将禁用或启用。很多时候，为了使其有意义，答案必须反过来。以选项（Options）对话框为例，它有一个复选框，问题是“与电脑游戏？”选择此选项应该禁用对话框上的\
  \ `ComboBox` 和 `TextBoxes`。`IsChecked` 的值为 `true`，因此将其绑定到另外两个控件的 `IsEnabled` 将不起作用。输入\
  \ `InversedBoolConverter`。此转换器将简单地反转布尔值。\n\n#### IValueConverter 接口\n\n为了创建一个 `ValueConverter`，你必须实现\
  \ `IValueConverter` 接口。该接口有两个方法：`Convert` 和 `ConvertBack`。这些看起来可能自而易明，但实际上实际上有点复杂。\n\
  \n```csharp\nobject Convert(object value, Type targetType,\n    object parameter,\
  \ CultureInfo culture);\nobject ConvertBack(object value, Type targetType,\n   \
  \ object parameter, CultureInfo culture);\n```\n\n当你转换为目标类型时使用 `Convert` 方法，并在反向操作时使用\
  \ `ConvertBack` 方法。`value` 参数表示要转换的值，`targetType` 是它应该转换到的类型。`parameter` 可用于设置辅助工具。本章末的练习\
  \ 15.1 要求你使用此参数创建一个特定的值转换器。\n\n#### ValueConversionAttribute (值转换属性)\n\n除了实现接口外，你还可以在实现转换器的类上设置属性。这并不是必须的，但对工具和用户非常有帮助。`ValueConversionAttribute`\
  \ 取两个参数，都是 `Type` 对象。这意味着你显式设置了转换器转换和和的类型\n\n### 触发器 (Triggers)\n\nWPF 中的事件可以包括各种事情，例如点击、应用程序启动和关闭事件等。事实上，WPF\
  \ 中有多种触发器，它们都继承自基类 `TriggerBase`。其中一种触发器是 `EventTrigger` 类，它包含一组操作，每个操作都是派自 `TriggerAction`\
  \ 类。这些操作在触发器被激活时执行。\n\nWPF 中并没有许多类派自 `TriggerAction`，但你可以定义自己的。你可以使用 `EventTrigger`\
  \ 使用 `BeginStoryboard` 动作触发动画，使用 `ControllableStoryboardAction` 操作故事板，并使用 `SoundPlayerAction`\
  \ 触发音效。由于这种触发器主要用于动画，你将在下一节查看。\n\n每个控件都有一个 `Triggers` 属性，你可以在其上面定义触发器。你也可以在更高层级上定义触发器——例如之前所示的\
  \ `Window` 对象。你在样式化控件时常用的触发器类型是 `Trigger`（尽管你仍然使用 `EventTrigger` 来触发控件动画）。`Trigger`\
  \ 类用于响应属性的变化来设置属性，在 `Style` 对象中使用时特别有用。\n\n触发器的配置方式如下：\n\n*   要定义 `Trigger` 对象监控哪个属性，你使用\
  \ `Trigger.Property` 属性。\n*   要定义 `Trigger` 对象何时激活，你设置 `Trigger.Value` 属性。\n*  \
  \ 要定义触发器采取的动作，你将 `Trigger.Setters` 属性设置为 `Setter` 对象的集合。\n\n这里提到的 `Setter` 对象与你之前在“样式（Styles）”部分中看到的对象完全相同。\n\
  \n例如，以下触发器检查名为 `MyBooleanValue` 的属性值，当该属性为 `true` 时，它将 `Opacity` 属性的值设置为 `0.5`：\n\
  \n\n\n\n\n```xml\n<Trigger Property=\"MyBooleanValue\" Value=\"true\">\n  <Setter\
  \ Property=\"Opacity\" Value=\"0.5\"/>\n</Trigger>\n```\n\n这段代码本身并没有告诉你太多信息，因为它没有与任何控件或样式关联。接下来的代码更具解释性；它展示了在\
  \ `Style` 对象中如何使用 `Trigger`：\n\n```xml\n<Style TargetType=\"Button\">\n  <Style.Triggers>\n\
  \    <Trigger Property=\"IsMouseOver\" Value=\"true\">\n      <Setter Property=\"\
  Foreground\" Value=\"Yellow\"/>\n    </Trigger>\n  </Style.Triggers>\n</Style>\n\
  ```\n\n当 `Button.IsMouseOver` 属性为 `true` 时，这段代码会将 `Button` 控件的 `Foreground` 属性更改为\
  \ `Yellow`。`IsMouseOver` 是几个非常有用的属性之一，你可以使用它们作为快捷方式来获取有关控件和控件状态的信息。正如其名称所示，当鼠标悬停在控件上时，它的值为\
  \ `true`。这允许你编写处理鼠标悬停效果的代码。其他类似的属性包括：`IsFocused`（用于确定控件是否拥有焦点）、`IsHitTestVisible`（指示是否可以点击控件，即它没有被堆叠顺序中更靠后的控件遮挡）以及\
  \ `IsPressed`（指示按钮是否被按下）。最后一个属性仅适用于继承自 `ButtonBase` 的按钮，而其他属性在所有控件上可用。\n\n你还可以通过使用\
  \ `ControlTemplate.Triggers` 属性来实现许多功能，它允许你创建包含触发器的控件模板。这就是默认的 `Button` 模板能够通过其模板响应鼠标悬停、点击和焦点变化的原因。你也必须修改它来为自己实现这些功能。\n\
  \n## 动画 (Animations)\n\n动画是通过使用故事板（storyboards）创建的。定义动画最好的方法无疑是使用如 Expression Blend\
  \ 这样的设计工具。然而，你也可以通过直接编辑 XAML 代码来定义它们，间接通过后置代码来定义（因为 XAML 只是构建 WPF 对象模型的一种方式）。\n\n\
  故事板使用 `Storyboard` 对象定义，该对象包含一个或多个时间线（timelines）。你可以通过关键帧（key frames）或使用几个封装了整个动画的简单对象之一来定义时间线。复杂的故事板甚至可以包含嵌套的故事板。\n\
  \n`Storyboard` 包含在资源字典（resource dictionary）中，因此你必须使用 `x:Key` 属性来标识它。\n\n在故事板的时间线上，你可以对应用程序中任何类型为\
  \ `double`、`Point` 或 `Color` 的元素的属性进行动画处理。这涵盖了你可能更改的大部分内容，因此非常灵活。有些是你无法实现的，例如用一种画刷替换另一种，但给定这三种类型，有办法实现你想象的任何效果。\n\
  \n这三种类型中的每种都有两个关联的时间线控件，你可以将其作为 `Storyboard` 的子元素。这六个控件是 `DoubleAnimation`、`DoubleAnimationUsingKeyFrames`、`PointAnimation`、`PointAnimationUsingKeyFrames`、`ColorAnimation`\
  \ 和 `ColorAnimationUsingKeyFrames`。每个时间线控件都可以附加属性 `Storyboard.TargetName` 和 `Storyboard.TargetProperty`\
  \ 与特定控件的特定属性。例如，如果你想对 `Name` 属性为 `MyRectangle` 的 `Rectangle` 控件的 `Width` 属性制作动画，则可以将这些属性设置为\
  \ `MyRectangle` 和 `Width`。你将使用 `DoubleAnimation` 或 `DoubleAnimationUsingKeyFrames`\
  \ 来对该属性制作动画。随着本章的进展，你会看到使用故事板的示例。\n\n接下来，你将查看不带关键帧的简单动画时间线，然后查看使用关键帧的时间线。\n\n###\
  \ 不带关键帧的时间线 (Timelines without Key Frames)\n\n不带关键帧的时间线是 `DoubleAnimation`、`PointAnimation`\
  \ 和 `ColorAnimation`。这些时间线具有相同的属性名称，尽管这些属性的取决于时间线的类型（注意 XAML 代码中所有时长属性都以 `[days.]hours:minutes:seconds`\
  \ 的形式指定）。表 15.2 描述了这些属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 时间线的名称，你可以从其他地方引用它。\
  \ |\n| `BeginTime` | 故事板触发后多久开始时间线。 |\n| `Duration` | 时间线持续多长时间。 |\n| `AutoReverse`\
  \ | 时间线在完成时是否反转并将属性恢复到原始值。此属性是一个 `Boolean` 值。 |\n| `RepeatBehavior` | 将此设置为指定的持续时间以使时间线按指示重复——整数后跟\
  \ `x`（例如 `5x`）以重复时间线指定的次数；或使用 `Forever` 让时间线一直重复直到故事板暂停或停止。 |\n| `FillBehavior`\
  \ | 如果时间线在故事板继续运行时完成，其行为如何。你可以使用 `HoldEnd` 让属性保持在时间线完成时的值（默认值），或使用 `Stop` 将其恢复到原始值。\
  \ |\n| `SpeedRatio` | 控制动画相对于其他属性中指定值的速度。默认值为 `1`，但你可以从其他代码更改它以加速或减慢动画。 |\n| `From`\
  \ | 动画开始时为属性设置的初始值。你可以省略此值以使用属性的当前值。 |\n| `To` | 动画结束时属性的最终值。你可以省略此值以使用属性的当前值。 |\n\
  | `By` | 使用此值从当前值动画到你指定的值。 |\n\n表 15.2 时间线属性\n\n例如，以下时间线将在五秒内为 `Name` 属性为 `MyRectangle`\
  \ 的 `Rectangle` 控件的 `Width` 属性制作动画：\n\n```xml\n<Storyboard x:Key=\"RectangleExpander\"\
  >\n<DoubleAnimation Storyboard.TargetName=\"MyRectangle\"\n  Storyboard.TargetProperty=\"\
  Width\" Duration=\"00:00:05\"\n  From=\"100\" To=\"200\"/>\n</Storyboard>\n```\n\
  \n### 使用关键帧的时间线 (Timelines with Key Frames)\n\n使用关键帧的时间线是 `DoubleAnimationUsingKeyFrames`、`PointAnimationUsingKeyFrames`\
  \ 和 `ColorAnimationUsingKeyFrames`。这些时间线类与上一节的时间线类具有相同的属性，但它们没有 `From`、`To` 或 `By`\
  \ 属性。相反，它们有一个关键帧对象的集合 `KeyFrames`。\n\n这些时间线包含任意数量的关键帧，每个关键帧都可以以不同的方式处理正在动画的值。\n\n\
  *   **离散 (Discrete)** —— 离散关键帧使值跳转到指定值，没有过渡。\n*   **线性 (Linear)** —— 线性关键帧使正在动画的值以线性过渡动画到指定值。\n\
  *   **样条 (Spline)** —— 样条关键帧使正在动画的值通过三次贝塞尔曲线定义的非线性过渡动画到指定值。\n\n因此，有九种类型的关键帧对象：`DiscreteDoubleKeyFrame`、`LinearDoubleKeyFrame`、`SplineDoubleKeyFrame`、`DiscreteColorKeyFrame`、`LinearColorKeyFrame`、`SplineColorKeyFrame`、`DiscretePointKeyFrame`、`LinearPointKeyFrame`\
  \ 和 `SplinePointKeyFrame`。\n\n关键帧类具有上一节检查的三个属性。四个样条关键帧类增加了一个额外属性：`KeySpline`（参见表\
  \ 15.3）。\n\n| 属性 | 用法 |\n| :--- | :--- |\n| `Name` | 关键帧的名称，你可以从其他地方引用它。 |\n\n\n\
  \n\n\n| `KeyTime` | 关键帧的位置，表示为时间轴开始后的持续时间。 |\n| `Value` | 当到达关键帧时，属性将达到或被设置的值。 |\n\
  | `KeySpline` | 两组以 `cp1x,cp1y,cp2x,cp2y` 形式表示的数字，用于定义用于属性动画化的的三次贝塞尔函数。（*仅适用于曲线关键帧*。）\
  \ |\n\n**表 15.3** (#c15.xhtml_c15-tbl-anc-0003) 曲线关键帧类的属性\n\n例如，你可以通过对 `Ellipse`\
  \ 的 `Center` 属性（类型为 `Point`）进行动画处理来实现使其在正方形中移动，如下所示：\n\n```\n<Storyboard x:Key=\"\
  EllipseMover\">\n  <PointAnimationUsingKeyFrames Storyboard.TargetName=\"MyEllipse\"\
  \n    Storyboard.TargetProperty=\"Center\" RepeatBehavior=\"Forever\">\n    <LinearPointKeyFrame\
  \ KeyTime=\"00:00:00\" Value=\"50,50\"/>\n    <LinearPointKeyFrame KeyTime=\"00:00:01\"\
  \ Value=\"100,50\"/>\n    <LinearPointKeyFrame KeyTime=\"00:00:02\" Value=\"100,100\"\
  />\n    <LinearPointKeyFrame KeyTime=\"00:00:03\" Value=\"50,100\"/>\n    <LinearPointKeyFrame\
  \ KeyTime=\"00:00:04\" Value=\"50,50\"/>\n  </PointAnimationUsingKeyFrames>\n</Storyboard>\n\
  ```\n\n值在 XAML 代码中以 `x,y` 形式指定。\n\n# WPF 控件\n\nWPF 提供了一系列在许多情况下都用的控件。然而，与所有 .NET\
  \ 开发框架一样，它也允许你扩展此功能。具体来说，你可以通过派生自 WPF 类来创建自己的控件。\n\n你可以派生的最有用控件之一是 `UserControl`。该类为你提供了\
  \ WPF 控件可能需要的基础功能，并允许你的控件无缝地接入现有的 WPF 控件套。\n\n你可以通过使用 ![1](img/arrow.png) Add Control\
  \ 项将控件添加到你的项目中。这为你提供了一个空白的画布（实际上是一个空白的 `Grid`）来工作。控件使用 XAML 中的顶层 `UserControl` 元素定义，而后台代码派生自\
  \ `System.Windows.Controls.UserControl` 类。\n\n一旦你将控件添加到项目中，就可以通过后台代码来布局控件。完成操作后，你可以在整个应用程序中使用它，甚至在其他应用程序中重用它。\n\
  \n创建控件时需要知道的关键事项之一是如何实现依赖属性。第 14 章简要讨论了依赖属性，现在你正接近编写自己的控件，是时候仔细查看它们了。\n\n## 实现依赖属性\n\
  \n你可以向任何派生自 `System.Windows.DependencyObject` 的类添加依赖属性。要为类实现依赖属性，你需要在类定义中添加一个类型为\
  \ `DependencyProperty` 的公共静态成员。该成员的名称由你决定，但最佳实践是遵循命名约定 `<PropertyName>Property`：\n\
  \n```\npublic static DependencyProperty MyStringProperty;\n```\n\n该属性被定义为静态似乎很奇怪，因为你为类的每个实例得到了唯一的属性。WPF\
  \ 属性框架会为你跟踪这些事项，所以你暂时不需要担心。\n\n你添加的成员必须使用静态 `DependencyProperty.Register()` 方法进行配置：\n\
  \n```\npublic static DependencyProperty MyStringProperty =\n   DependencyProperty.Register(…);\n\
  ```\n\n该方法接受三个到五个参数，如表 15.4 所示（按顺序显示，前三个是性的）。\n\n| **参数** | **用法** |\n| `string\
  \ name` | 属性的名称 |\n| `Type propertyType` | 属性的类型 |\n| `Type ownerType` | 包含属性的类类型\
  \ |\n| `PropertyMetadata typeMetadata` | 额外的属性设置：属性的默认值以及用于属性更改和强制转换的回调方法 |\n| `ValidateValueCallback\
  \ validateValueCallback` | 用于验证属性值的回调方法 |\n\n**表 15.4** (#c15.xhtml_c15-tbl-anc-0004)\
  \ Register() 方法的参数\n\n还有其他方法可以注册依赖属性，例如 `RegisterAttached()`，你可以用它来实现附加属性。在本章中不会查看这些其他方法，但值得阅读一下。\n\
  \n例如，你可以使用三个参数来注册 `MyStringProperty` 依赖属性，如下：\n\n```\npublic class MyClass : DependencyObject\n\
  {\n   public static DependencyProperty MyStringProperty = DependencyProperty.Register(\n\
  \      \"MyString\",\n      typeof(string),\n      typeof(MyClass));\n}\n```\n\n\
  你也可以包含一个可以直接访问依赖属性的 .NET 属性（尽管这不是强制性的）。然而，由于依赖属性被定义为静态，不能使用与普通属性相同的语法。要访问依赖属性的值，你必须使用继承自\
  \ `DependencyObject` 的方法，如下所示：\n\n```\n public string MyString\n    {\n        get\
  \ { return (string)GetValue(MyStringProperty); }\n        set { SetValue(MyStringProperty,\
  \ value); }\n    }\n```\n\n在这里，`GetValue()` 和 `SetValue()` 方法分别获取和设置当前实例的依赖属性 `MyStringProperty`。这两个方法是公共的，因此客户端代码可以使用它们直接操作依赖属性值。这就是为什么访问依赖属性的\
  \ .NET 属性不是强制性的。\n\n如果你想为属性设置元数据，则必须使用派生自 `PropertyMetadata` 的对象（例如 `FrameworkPropertyMetadata`），并将此实例作为第四个参数传递给\
  \ `Register()`。`FrameworkPropertyMetadata` 构造函数有 11 个重载，它们接受表 15.5 所示的一个或多个参数。\n\
  \n| **参数类型** | **用法** |\n| `object` `defaultValue` | 属性的默认值。 |\n| `FrameworkPropertyMetadataOptions`\
  \ `flags` | 来自 `FrameworkPropertyMetadataOptions` 枚举的标志组合，可以用它为属性指定额外的元数据。例如，你可能使用\
  \ `AffectsArrange` 来声明属性的变化可能会影响控件布局。这将导致属性更改时窗口的布局引擎重新计算控件布局。请查看 MSDN 文档获取这里的完整列表。\
  \ |\n| `PropertyChangedCallback` `propertyChangedCallback` | 属性值更改时使用的回调方法。 |\n\
  | `CoerceValueCallback` `coerceValueCallback` | 属性值被强制转换时使用的回调方法。 |\n| `bool` `isAnimationProhibited`\
  \ | 指定此属性是否可以由动画更改。 |\n\n\n\n\n\n| `UpdateSourceTrigger` | `defaultUpdateSourceTrigger`\
  \ | 当属性值进行数据绑定时，此属性根据 `UpdateSourceTrigger` 枚举中的值决定数据源更新的时机。默认值为 `PropertyChanged`，这意味着只要属性发生变化，绑定源就会更新。这并不总是恰当的——例如`TextBox.Text`\
  \ 属性对该属性使用的值是 `LostFocus`（失去焦点）。这确保了绑定源不会被过早更新。你还可以使用 `Explicit` 值来指定仅在请求时（通过调用派生自\
  \ `DependencyObject` 的类的 `UpdateSource()` 方法）才更新绑定源。 |\n\n### 表 15.5 `FrameworkPropertyMetadata`\
  \ 构造函数的重载\n\n使用 `FrameworkPropertyMetadata` 的一个简单示例是使用它来设置属性的默认值：\n\n```cpp\n public\
  \ static DependencyProperty MyStringProperty =\n         DependencyProperty.Register(\n\
  \         \"MyString\",\n         typeof(string),\n         typeof(MyClass),\n \
  \        new FrameworkPropertyMetadata(\"Default value\"));\n```\n\n到目前为止，你已经学习了三种可以指定的的回调方法，分别用于属性更改通知、属性强制转换和属性值验证。这些回调与依赖属性本身一样，必须全部实现为公共静态方法。每个回调都有特定的返回类型和参数列表，你必须在你的回调方法中使用这些定义。\n\
  \n现在是时候回到正轨，继续开发 Karli Cards 游戏客户端了。在接下来的“尝试一下”（Try It Out）中，你将创建一个可以代表应用程序中游戏卡牌的用户控件。\n\
  \n## 整合一切\n\n在游戏开发的这个阶段，你已经有了两个独立的对话框、一个卡牌库以及一个提供游戏显示空白区域的主窗口。这仍然留下了大量工作，但基础已经打好，是时候开始构建游戏了。`CardLib`\
  \ 中的类描述了游戏的“领域模型”，即游戏可以被拆分的对象，这些对象需要进行一些重构，以便更好地与 Windows 应用程序协同工作。接下来，你将编写游戏的“视图模型”（View\
  \ Model），它是一个能够控制游戏显示的类。然后，你将创建两个额外的用户控件，它们使用 `Card` 用户控件来视觉化地显示游戏。最后，你将在游戏客户端将它们全部绑定在一起。\n\
  \n### 重构领域模型\n\n如所述，领域模型是描述游戏对象的代码。目前，你在 `CardLib` 项目中拥有这些描述游戏对象的类：\n\n* `Card`\n\
  * `Deck`\n* `Rank`\n* `Suit`\n\n除了这些类之外，游戏还需要 `Player`（玩家）和 `ComputerPlayer`（电脑玩家）类，因此你需要添加它们。你还需要稍微修改\
  \ `Card` 和 `Deck` 类，以便它们在 Windows 应用程序中运行得更好。\n\n有很多工作要做，让我们开始吧。\n\n### 视图模型（View\
  \ Models）\n\n视图模型的目的是持有显示视图的状态。在 Karli Cards 的案例中，这意味着你已经有一个视图模型类：`GameOptions`\
  \ 类。该类持有 `Options` 和 `StartGame` 窗口的状态。目前，你无法从选项中获取选定的玩家，所以你必须添加该功能。游戏客户端窗口的视图模型缺失，这是下一个要执行的任务。\n\
  \n游戏执行的视图模型必须反映游戏运行时的所有部分。游戏部分包括：\n\n* 当前玩家从中抽牌的牌牌\n* 当前玩家可以取而不用抽牌的卡牌\n* 当前玩家\n\
  * 参与玩家人数\n\n视图模型还应该能够通知观察者变化，这意味着再次实现 `INotifyPropertyChanged`。\n\n除了这些能力外，视图模型还应该提供一种启动新游戏的方法。你将通过为菜单创建一个新的路由命令（routed\
  \ command）来实现这一点。该命令在视图模型中创建，但从视图中调用。\n\n### 完成游戏\n\n你现在有了一个完整的游戏，但你无法玩它，因为游戏客户端中没有显示任何内容。为了让游戏运行，你需要两个额外的用户控件，它们将通过一个停靠面板（dock\
  \ panel）放置在游戏客户端上。\n\n这两个用户控件分别称为 `CardsInHand`（显示玩家手牌）和 `GameDecks`（显示主牌堆和可用卡牌）。\n\
  \n## ![image](img/c02g003.jpg) 你在本章中学习到的内容\n\n| 主题 | 核心概念 |\n| :--- | :--- |\n|\
  \ 样式 (Styles) | 你可以使用样式为 XAML 元素创建样式，这些样式可以在许多元素上复用。样式允许你设置元素的属性。当你将元素的 `Style`\
  \ 属性指向你定义的样式时，元素的属性将使用你在 `Style` 属性中指定的值。 |\n| 模板 (Templates) | 模板用于定义控件的内容。使用模板，你可以更改标准控件的显示方式。你还可以用它们构建复杂的自定义控件。\
  \ |\n| 值转换器 (Value converters) | 值转换器用于两种类型之间的转换。要创建值转换器，你必须在类上实现 `IValueConverter`\
  \ 接口。 |\n| 用户控件 (User controls) | 用户控件用于创建可以在你自己的项目中轻松复用的代码和 XAML。这些代码和 XAML 还可以导出供其他项目使用。\
  \ |\n\n\n\n\n\n通过网络浏览器访问并响应 REST API 或 WCF 服务请求的程序是云端运行的良好候选者。创建此类类型程序时使用的开发技术不需要对调用它们的设备有任何内置依赖。在通常情况下，这些程序类型仅在它们之间交换信息，并以易读且易于用户的方式渲染数据。此外，接收和处理大量数据的程序也是云端运行的良好候选者，因为利用资源的超扩展性来接收和处理数据是云本身的一项基本特性。\n\
  \n本章概述了什么是云、某些在云端成功运行程序的的模式和技术示例，以及从 ASP.NET 网站创建和使用云资源的示例。\n\n## 云、云计算与云优化堆栈\n\n\
  你开始创建完全或部分运行在云端的应用程序只是时间问题了。这不再是“是否”的问题，而是“何时”的问题。决定你的程序中哪些组件将运行在云端、使用何种云类型以及云服务模型，需要进行一些研究、理解和规划。首先，你需要明确什么是云。云简单来说就是运行在数据中心内部的大量商品化计算机硬件，它们可以运行程序并存储大量数据。其区别在于弹性，即动态扩展向上（例如，增加\
  \ CPU 和内存）和/或向下扩展（例如，增加虚拟服务器实例的数量）的能力，然后以看似最小或无需努力地缩小规模。这与当前的 IT 运营格局有着巨大的差异，在当前格局中，差异化的计算机资源往往在公司的一个区域部分或完全未被使用，而在其他区域又极缺乏计算机资源。云通过在您需要时提供计算机资源的访问权限来解决这个问题，当您不需要它们时，这些资源就会提供给其他人。对于个人开发者来说，云是一个部署你的程序并将其向世界展示的地方。如果程序偶然变得流行，你可以进行扩展以满足你的资源需求；如果程序失败了，那么你不会在设置专用计算机硬件和基础设施上花费大量的金钱或时间。\n\
  \n让我们更详细地探讨云类型和云服务模型。常见的云类型有公共云、私有云和混合云，下述的项目符号进行了描述，并在图 16.1 中进行了说明。\n\n*   **公有云**是由\
  \ `Microsoft Azure`、`Amazon AWS`、`Rackspace` 或 `IBM Cloud` 等云提供者拥有并运营的共享计算机硬件和基础设施。这种云类型对于需要管理客户和用户需求波动的中小型是理想的。\n\
  *   **私有云**是存在于现场或外包数据中心的专用计算机硬件和基础设施。这种云类型对于较大的公司或必须提供更高水平数据安全或政府合规性的公司来说是理想的。\n\
  *   **混合云**是公有云和私有云类型的结合，你可以选择 IT 解决方案的哪些部分运行在私有云上，哪些部分运行在公有云上。理想的解决方案是将需要更高安全性的业务关键程序运行在私有云中，并将非敏感的、可能激增的任务运行在公有云中。\n\
  \n![3 种云示意图：混合云（上方中央）被描绘为一个大云和两个小云，之间由标有“Bridge”的双头箭头连接；公有云（右下角）和私有云（左下角），下方列出了它们的优缺点。](img/c16f001.jpg)\n\
  \n图 16.1\n\n云服务模型的数量持续增加，但最常见的云服务模型在述的项目符号中描述，并在图 16.2 中进行了说明。\n\n*   **基础设施即服务\
  \ (IaaS)** —— 你负责从操作系统及以上的部分。你不负责硬件或网络基础设施；然而，你负责操作系统的补丁和第三方依赖库。\n*   **平台即服务 (PaaS)**\
  \ —— 你仅负责运行在所选操作系统上的程序及其依赖项。你不负责操作系统的维护、硬件或网络基础设施。\n*   **软件即服务 (SaaS)** —— 通过 Internet\
  \ 访问的设备使用的软件程序或服务。例如，`O365`、`Salesforce`、`OneDrive` 或 `Box`，所有这些都可以从任何有 Internet\
  \ 连接的地方访问，且不需要在客户端上安装软件即可运行。你只负责运行在平台上的软件，不负责其他任何内容。\n\n![云服务模型示意图，显示了四个标有 Clients、SaaS、PaaS\
  \ 和 IaaS 的矩形，Clients 和 SaaS 之间有一个双头箭头。](img/c16f002.jpg)\n\n图 16.2\n\n总结来说，云是一种运行程序的商品化计算机硬件的弹性结构。这些程序运行在混合、公有或私有云类型的\
  \ `IaaS`、`PaaS` 或 `SaaS` 服务模型上。\n\n云编程是运行在任何云服务模型上的代码逻辑开发。云程序应该整合移植性、可扩展性和韧性模式，提高程序的性能和稳定性。未实现这些移植性、可扩展性和韧性模式的程序可能会在云中运行，但某些情况（如硬件故障或网络延迟问题）可能会导致程序执行意外之外的代码路径并终止。\n\
  \n回过来看，云弹性作为最有利的优势之一，不仅平台能够扩展，重要的是云程序也能扩展。例如，代码是否依赖于后端资源、数据库、读取或打开文件，或解析大型数据对象？云程序中的此类功能操作可能会降低其扩展能力，从而导致吞吐量支持较低。\n\
  \n云优化堆栈是一个概念，用于指代能够处理高吞吐量、小 footprint、可以在同一台服务器上与其他应用程序并行运行并且支持跨平台的代码。具有小 footprint\
  \ 涉及到将你的云程序中存在依赖的组件进行打包，使部署尺寸尽可能小。云程序是否需要 .NET Framework 才能运行？与其需要整个 .NET Framework，不如包含运行你的云程序所需的库，然后将你的云程序编译成自包含应用程序。云程序可以与任何其他云程序并行运行，因为它二进制文件包本身包含了依赖项。最后，通过使用名为\
  \ `Mono` 的开源 C# 版本，云程序可以被打包、编译并部署到非微软的操作系统上，例如 `Mac OS X`、`Linux` 或 `UNIX`。\n\n\n\
  \n\n在云端，短暂的延迟增加或停机是预料之中的，你的代码必须为此做好准备，并包含能够从这些平台异常中成功恢复的逻辑。如果你一直以来都是为本地或现场执行环境的程序编写代码，这将是一个重大的思维转变。你需要忘记许多过去掌握的关于异常处理的知识，并学会接受失败，创建你的代码来从此类失败中恢复。\n\
  \n在上一节中，我们已经在集成计划在云端运行的程序背景下，简要提到了可移植性、可扩展性和伸缩性等词汇。但在这里，`可移植性`具体意味着什么？如果一个程序可以在多个平台（例如\
  \ Windows、Linux 和 Mac OS X）上移动或执行，那么它就是可移植的。以某些 `ASP.NET 4.6` 功能为例，它们构建在新的开源技术栈上，为开发者提供了将代码编译为可以在任何一个平台上运行的二进制文件的选项。传统上，使用\
  \ `ASP.NET` 并以 `C#` 为背景编写程序的开发者，会在使用 `Internet Information Server (IIS)` 的 Windows\
  \ 服务器上运行它。然而，从以云为核心的角度来看，你的程序及其所有依赖项在无需手动或程序干预的情况下从一台虚拟机移动到另一台虚拟机的能力，是这种背景下最具意义的可移植形式。记住，云端的失败是预料之中的，运行你程序的虚拟机（VM）可能在任何时候被擦除，然后在另一台虚拟机上重新构建。因此，你的程序需要是可移植的，并能够从此类事件中恢复。\n\
  \n`可扩展性`意味着当多个客户使用你的代码时，它的响应良好。例如，如果你每分钟有 1,500 次请求，如果每个请求在 1 秒内完成并响应，那么大约每秒有 25\
  \ 个并发请求。然而，如果你每分钟有 15,000 次请求，这意味着每秒有 250 个并发请求。云程序会对 25 或 250 个并发请求以相同的方式响应吗？2,550\
  \ 个呢？以下是一些有助于管理可扩展性的云端编程模式：\n\n- `命令查询职责分离模式 (CQRS pattern)` — 该模式涉及将读取数据的操作与修改或更新数据的操作的分离。\n\
  - `物化视图模式 (Materialized View pattern)` — 它修改存储结构以反映数据查询模式。例如，为特定的高频查询创建视图可以实现更高效的查询。\n\
  - `分片模式 (Sharding pattern)` — 它将你的数据拆分为多个水平分片，每个分片包含独特的数据子集，而不是通过增加硬件容量进行垂直扩展。\n\
  - `管家密钥模式 (Valet Key pattern)` — 它允许客户端直接访问数据存储，以流传输或上传大文件。它不是让 Web 客户端管理数据存储的门禁，而是为客户端提供一个\
  \ `Valet Key` 以及直接访问数据存储的权限。\n\n`伸缩性`指的是你的程序对服务故障和异常的响应及恢复能力。长期以来，IT 基础设施侧重于预防故障，对停机的接受度极低，且预期是\
  \ 99.99% 或 99.999% 的 SLA（服务水平协议）。然而，在云端运行程序需要一种可靠性的思维转变，这种转变接受失败并明确面向恢复而非预防。拥有数据库、存储、网络和第三方服务等多个依赖项（其中某些没有\
  \ SLA），需要这种视角的转变。对于停机或不被视为正常运行的情况，做出友好的响应可以使你的云程序具有伸缩性。以下是一些有助于将伸缩性嵌入你的云程序中的云编程模式：\n\
  \n- `断路器模式 (Circuit Breaker pattern)` — 这种代码设计能够感知远程服务的状态，并且仅在服务可用时才尝试建立连接。这避免了在通过之前的故障已知远程服务不可用的情况下尝试请求并浪费\
  \ CPU 周期。\n- `健康端点监控模式 (Health Endpoint Monitoring pattern)` — 通过实现端点监控，检查云应用程序在功能上是否可用。\n\
  - `重试模式 (Retry pattern)` — 在瞬态异常或失败后重试请求。该模式在给定时间内重试多次，并在超过重试尝试阈值时停止。\n- `节流模式 (Throttling\
  \ pattern)` — 管理云程序的消耗，以确保满足 SLA 并让程序在高负载下保持功能正常。\n\n使用本节描述的一种或多个模式将有助于使你的云迁移更加成功。所讨论的模式通过提高程序的可扩展性和伸缩性，增强了程序的可用性。这反过来为用户或客户带来了更愉快的体验。\n\
  \n## 使用 Microsoft Azure C# 库创建存储容器\n\n尽管有许多云提供商，但本节和下一节示例使用的云提供商是 Microsoft。Microsoft\
  \ 提供的云平台称为 `Azure`。Azure 有许多不同的功能。例如，IaaS 方案称为 `Azure VM`，PaaS 方案称为 `Azure Cloud\
  \ Services`。此外，Microsoft 还拥有用于数据库的 `SQL Azure`、用于用户验证的 `Azure Active Directory`\
  \ 以及用于存储 blob 的 `Azure Storage` 等。\n\n以下两个练习将引导你使用针对 `.NET` 的 `C# ` Microsoft Azure\
  \ Storage Client Library` 创建 Azure 存储账户和 Azure 存储容器。在下一节中，你将使用 `Visual Studio` 创建一个\
  \ `ASP.NET 4.6 Web Site` 来访问存储在 Azure 存储容器中的图像。按照书籍的流程，`ASP.NET 4.6 Web Site` 将处理一副扑牌。牌图像就是存储在\
  \ Azure 存储容器中的 blob。\n\n现在 Microsoft Azure 存储账户和容器已经创建并加载了 52 张牌的图像，你可以创建一个 ASP.NET\
  \ 站点来引用 Azure 存储容器。\n\n## 使用存储容器的 ASP.NET 4.6 站点\n\n到为止，还没有对 Web 应用程序进行深入检查，也没有讨论\
  \ `ASP.NET` 的基本方面。本节为这些技术视角提供了一些见解。\n\nWeb 应用程序导致服务器向客户端发送 HTML 代码。该代码在 Internet\
  \ Explorer 等浏览器中显示。当用户在浏览器中输入 URL 字符串时，会向服务器发送一个 HTTP 请求。HTTP 请求包含所请求的文件，以及附加信息，如标识客户端的字符串、支持的语言以及属于请求的附加数据。Web\
  \ 服务器返回包含 HTML 代码的 HTTP 响应，浏览器解释这些代码并在用户显示文本框、按钮和列表。\n\n\n\n在客户端系统上使用 ASP.NET Web\
  \ 应用程序只需要一个简单的网络浏览器。你可以使用 Internet Explorer、Chrome、Firefox 或任何支持 HTML 的网络浏览器。客户端系统不需要安装\
  \ `.NET`。\n\n在服务器系统上，需要 ASP.NET 运行时。如果系统上安装了 Internet 信息服务（`IIS`），那么在安装 `.NET Framework`\
  \ 时，系统就会为服务器配置 ASP.NET 运行时。在开发过程中，不需要处理 Internet 信息服务，因为 `Visual Studio` 提供了了自己的\
  \ `ASP.NET Web Development server`，你可以用它来测试和调试应用程序。\n\n为了理解 ASP.NET 运行时是如何工作的，请考虑来自浏览器的典型网络请求（参见图\
  \ 16.11）。客户端向服务器请求文件，例如 `default.cshtml`。ASP.NET Web 表单页面通常具有 `.aspx` 扩展（尽管 ASP.NET\
  \ MVC 没有特定的文件扩展名），而 `.cshtml` 用于基于 Razor 的网站。由于这些文件扩展名已在 `IIS` 中注册或被 `ASP.NET Web\
  \ Development Server` 识别，ASP.NET 运行时和 ASP.NET 工作进程便介入其中。`IIS` 工作进程的名为 `w3wp.exe`，它是\
  \ Web 服务器上你的应用程序的宿主机。当对 `default.cshtml` 文件发出首次请求时，ASP.NET 解析器启动，编译器将该文件连同 `.cshtml`\
  \ 文件相关的 C# 代码一起编译并创建一个程序集。然后，`.NET` 运行时的 `JIT` 编译器将程序集编译为原生代码。接着 `Page` 对象被销毁。不过，程序集会被保留用于后续请求，因此没有必要再次编译该程序集。\n\
