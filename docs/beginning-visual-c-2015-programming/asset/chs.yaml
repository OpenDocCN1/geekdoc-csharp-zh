  \n\n\n\n\n| 成员定义 | 你可以在类中定义字段、方法和属性成员。字段通过访问修符、名称和类型进行定义。方法通过访问修符、返回类型、名称和参数进行定义。属性通过访问修符、名称以及\
  \ `get` 和/或 `set` 访问器进行定义。单个属性访问器可以自己的访问修符，但其访问权限必须低于属性本身的访问权限。 |\n| 成员隐藏与重写 | 属性和方法可以在基类中被定义为\
  \ `abstract`（抽象）或 `virtual`（虚），以定义继承。派生类必须实现抽象成员并可以使用 `override` 关键字重写虚成员。它们还可以使用\
  \ `new` 关键字提供新的实现，并使用 `sealed` 关键字防止对 `virtual` 成员的进一步重写。可以使用 `base` 关键字调用基类的实现。\
  \ |\n| 接口实现 | 实现接口的类必须以 `public`（公共）形式实现该接口定义的所有成员。你可以隐式或显式地实现接口，其中显式实现只能通过 `interface`\
  \ 引用使用。 |\n| 部分定义 | 你可以使用 `partial` 关键字将类定义拆分多个代码文件中。你还可以使用 `partial` 关键字创建部分方法。部分方法有某些限制，包括没有返回值或\
  \ `out` 参数，并且在未提供实现时不会被编译。 |\n\n# 第 11 章：集合、比较与转换\n\n## 本章的 Wrox.com 代码下载\n\n你可以在“Download\
  \ Code”选项卡中找到本章的 [`wrox.com`](http://wrox.com) 代码下载，地址为 `[`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)`。代码位于第\
  \ 11 章 下载中，并根据章节中的名称进行单独命名。\n\n现在你已经涵盖了 C# 中所有的基础 OOP 技术，但还有一些更高级的技术值得熟悉。这些技术与你在编写代码时必须经常解决的某些问题有关。学习这些技术将使进展变得容易得多，并让你专注于应用程序的其他可能更重要的方面。在本章中，你将看到以下内容：\n\
  \n* **集合（Collections）** —— 集合允许你维护对象组。与你在前面章节中使用的数组不同，集合可以包含更高级的功能，例如控制对所包含对象的访问、搜索和排序等。你将学习如何使用和创建集合类，并学习一些强大的技术以最大限度地发挥它们的威力。\n\
  * **比较（Comparisons）** —— 在处理对象时，你通常想在它们之间进行比较。这在集合中尤为重要，因为这是排序的基础。你将查看如何以多种方式比较对象，包括运算符重载，以及如何使用\
  \ `IComparable` 和 `IComparer` 接口对集合排序。\n* **转换（Conversions）** —— 之前的章节向你展示了如何将对象从一种类型转换为另一种类型。在本章中，你将学习如何自定义类型转换以满足你的需求。\n\
  \n## 集合\n\n在第 5 章中，你学习了如何使用数组创建包含数量对象或值的变量类型。然而，数组有其局限性。最大的局限性是一旦创建数组，它们的大小就是固定的，因此在不创建新数组的情况下无法向现有数组末尾添加新项。这通常意味着用于操作数组的语法可能会变得过于复杂。OOP\
  \ 技术允许你创建在内部执行许多此类操作的类，从而简化了使用项目列表或数组的代码。\n\nC# 中的数组实现为 `System.Array` 类的实例，它们只是被称为“集合类”的一种类型。通常，集合类用于维护对象列表，它们可能提供比简单数组更多的功能。这些功能大部分通过实现来自\
  \ `System.Collections` 命名空间中的接口来实现，从而标准化了集合语法。该命名空间还包含一些其他有趣的内容，例如以 `System.Array`\
  \ 其他方式实现这些接口的类。\n\n由于集合的功能（包括通过使用 `[index]` 语法访问集合项等基本功能）是通过接口提供的，因此你不局限于使用 `System.Array`\
  \ 等基础集合类。相反，你可以创建自己的自定义集合类。这些类可以针对你想要枚举的对象（即你想要维护其为集合的对象）变得更具特定性。这样做的优势之一是（正如你将看到的），自定义集合类可以是强类型的。也就是说，当你从集合中提取项时，不需要将它们转换为正确的类型。另一个优势是能够暴露专门的方法。例如，你可以提供一种快速获取项的子集的方法。在牌牌示例中，你可以添加一个方法来获取特定花色的所有\
  \ `Card` 项。\n\n`System.Collections` 命名空间中的几个接口提供了基本的集合功能：\n\n* `IEnumerable` ——\
  \ 提供遍历集合中项的能力\n* `ICollection` —— 提供获取集合项数量以及将项复制到简单数组类型的能力（继承自 `IEnumerable`）\n\
  * `IList` —— 为集合提供项列表，以及访问这些项的能力和其他一些与项列表相关的基本能力（继承自 `IEnumerable` 和 `ICollection`）\n\
  * `IDictionary` —— 与 `IList` 类似，但它提供了一个通过键值访问的项列表，而不是索引（继承自 `IEnumerable` 和 `ICollection`）\n\
  \n`System.Array` 类实现了 `IList`、`ICollection` 和 `IEnumerable`。然而，它不支持 `IList` 的某些高级功能，并且它以固定大小表示项列表。\n\
  \n### 使用集合\n\n`System.Collections` 命名空间中的类之一 `System.Collections.ArrayList` 也实现了\
  \ `IList`、`ICollection` 和 `IEnumerable`，但其实现方式比 `System.Array` 更复杂。虽然数组的大小是固定的（不能添加或删除元素），但该类可以用于表示可变长度的项列表。为了让你更好地感受这种高级集合的用法，接下来的“Try\
  \ It Out”使用了该类，同时也使用了一个简单的数组。\n\n### 定义集合\n\n现在你已经知道了使用高级集合类可以实现的功能，现在是学习如何创建自己的强类型集合了。实现此目标的方法是手动实现所需的方法，但这是一个耗时且复杂的过程。或者，你可以让你的集合派自某个类，例如\
  \ `System.Collections.CollectionBase`，这是一个为你提供大部分集合实现的抽象类。这种方案是被强烈建议的。\n\n`CollectionBase`\
  \ 类暴露了 `IEnumerable`、`ICollection` 和 `IList` 接口，但仅提供了某些实现——特别是 `IList` 的 `Clear()`\
  \ 和 `RemoveAt()` 方法，以及 `ICollection` 的 `Count` 属性。如果你想要提供的功能，你需要自己实现其他所有内容。\n\n\
  为了方便，`CollectionBase` 提供了两个保护属性，允许访问存储的对象本身。你可以使用 `List` 通过 `IList` 接口访问项，并使用 `InnerList`\
  \ 用于存储项的 `ArrayList` 对象。\n\n\n\n\n例如，用于存储 `Animal` 对象的集合类的基础可以定义如下（稍后你将看到更完整的实现）：\n\
  \n```\npublic class Animals : CollectionBase\n{\n   public void Add(Animal newAnimal)\n\
  \   {\n      List.Add(newAnimal);\n   }\n   public void Remove(Animal oldAnimal)\n\
  \   {\n      List.Remove(oldAnimal);\n   }\n   public Animals() {}\n}\n```\n\n在这里，`Add()`\
  \ 和 `Remove()` 被实现为强类型方法，它们使用了用于访问项的 `IList` 接口的标准 `Add()` 方法。现在暴露的方法将仅适用于 `Animal`\
  \ 类或派生自 `Animal` 的类，这与之前展示的 `ArrayList` 实现不同，`ArrayList` 是可以处理任何对象（object）的。\n\n\
  `CollectionBase` 类允许你你的派生集合上使用 `foreach` 语法。例如，你可以使用如下代码：\n\n```\nWriteLine(\"Using\
  \ custom collection class Animals:\");\nAnimals animalCollection = new Animals();\n\
  animalCollection.Add(new Cow(\"Lea\"));\nforeach (Animal myAnimal in animalCollection)\n\
  {\n   WriteLine($\"New { myAnimal.ToString()} object added to custom \" +\n    \
  \         $\"collection, Name = {myAnimal.Name}\");\n}\n```\n\n然而，你无法执行以下操作：\n\n\
  ```\nanimalCollection[0].Feed();\n```\n\n要通过这种方式通过索引访问项，你需要使用索引器（indexer）。\n\n####\
  \ 索引器 (Indexers)\n\n`indexer` 是一种特殊的属性，你可以将其添加到类中以提供类似数组的访问。事实上，你可以通过索引器提供更复杂的访问，因为你可以随心意欲使用方括号语法定义并使用复杂的参数类型。然而，为项实现简单的数字索引是最常见的用法。\n\
  \n你可以按照如下方式为 `Animal` 对象的 `Animals` 集合添加索引器：\n\n```\n public class Animals : CollectionBase\n\
  \   {\n      …\n      public Animal this[int animalIndex]\n      {\n         get\
  \ { return (Animal)List[animalIndex]; }\n         Set { List[animalIndex] = value;\
  \ }\n      }\n   }\n```\n\n`this` 关键字配合方括号中的参数一起使用，但在其他情况下，索引器看起来与其他任何属性非常相似。这种语法是逻辑性的，因为你通过使用对象名称后跟方括号中的索引参数来访问索引器（例如，`MyAnimals[0]`）。\n\
  \n索引器代码使用了 `List` 属性上的索引器（即在 `CollectionBase` 中提供对存储项的 `ArrayList` 访问的 `IList` 接口）：\n\
  \n```\nreturn (Animal)List[animalIndex];\n```\n\n这里显式类型转换是必要的，因为 `IList.List` 属性返回一个\
  \ `System.Object` 对象。这里需要注意的重要点是，你为此索引器定义了一个类型。当你使用此索引器访问项时将获得该类型。这种强类型意味着你可以编写如下代码：\n\
  \n```\nanimalCollection[0].Feed();\n```\n\n而不是：\n\n```\n((Animal)animalCollection[0]).Feed();\n\
  ```\n\n这是强类型自定义集合的另一个方便特性。在接下来的“尝试一试”（Try It Out）中，你将扩展之前的“尝试一试”以此付诸实践。\n\n####为\
  \ CardLib 添加 Cards 集合\n\n在上一章中，你创建了一个名为 `Ch10CardLib` 的类库项目，其中包含一个代表扑克牌的 `Card`\
  \ 类和一个代表牌组的 `Deck` 类 —— 即 `Card` 类的集合。该集合被实现为简单的数组。\n\n在本章中，你将向此库添加一个新类，并重命名为 `Ch11CardLib`。这个新类\
