  \ |\n| 连接 | 使用 `join` 操作符通过单个查询查询多个集合中的相关数据。 |\n\n# 第 21 章\n\n数据库\n\n## 本章 Wrox.com\
  \ 代码下载\n\n本章的 `wrox.com` 代码下载位于“下载代码”选项卡中的 `www.wrox.com/go/beginningvisualc#2015`。代码位于第\
  \ 21 章，并根据名称进行了单独命名。\n\n上一章介绍了 LINQ 并展示了 LINQ 如何与对象和 XML 协作。本章将教你如何将对象存储在数据库中并使用\
  \ LINQ 查询数据。\n\n## 使用数据库\n\n*数据库*是数据的持久化结构化存储库。有许多类型的数据库，但你在存储和查询数据时最常见的类型是*关系型数据库*，例如\
  \ Microsoft SQL Server 和 Oracle。关系型数据库使用 SQL 数据库语言（SQL 代表*结构化查询语言*）来查询和处理数据。传统上，处理此类数据库需要知道一些\
  \ SQL，要么在编程语言中嵌入 SQL 语句，要么向面向 SQL 的数据库类库 API 调用或方法传递包含 SQL 语句的字符串。\n\n听起来很复杂，对吧？好消息是，使用\
  \ Visual C# 2015 你可以使用*代码优先*方法在 C# 中创建对象，将其存储在数据库中，并使用 LINQ 查询对象。\n\n## 安装 SQL Server\
  \ Express\n\n要运行本章所示的示例，你必须安装 Microsoft SQL Server Express（Microsoft SQL Server\
  \ 的免费轻量版）。你将使用 SQL Server Express 的 LocalDB 选项，它允许 Visual Studio 2015 直接创建和打开数据库文件，而无需连接到单独的服务器。带有\
  \ LocalDB 的 SQL Server Express 支持与 Microsoft SQL Server 相同的 SQL 语法，因此它是初者的合适版本。可以通过此链接下载\
  \ SQL Server express：\n\n`http://www.microsoft.com/en-us/server-cloud/products/sql-server-editions/sql-server-express.aspx`\n\
  \n## Entity Framework\n\n\n\n\n\n支持 Code First 的 .NET 类库是 `Entity Framework` 的最新版本。该名称源于一个名为\
  \ `entity-relationship`（实体关系）模式的数据库概念，在该模型中，`entity`（实体）是数据对象的抽象概念，例如客户，它在关系型数据库中与其他实体（如订单和产品）相关（例如，客户为产品下订单）。\n\
  \n`Entity Framework` 将你程序中的 C# 对象映射到关系型数据库中的实体。这被称为 `object-relational mapping`（对象-关系映射）。对象-关系映射是将你在\
  \ C# 中的类、对象和属性映射到组成关系型数据库的表、行和列的代码。手动创建这些映射代码既枯燥又耗时，但 `Entity Framework` 让这一切变得简单！\n\
  \n`Entity Framework` 构建在 .NET 内置的底层数据访问库 `ADO.NET` 之上。`ADO.NET` 需要一些 SQL 知识，但幸运的是\
  \ `Entity Framework` 也为你处理了这些问题，让你专注于 C# 代码。\n\n此外，通过 `Entity Framework` 你还获得了 `LINQ\
  \ to Entities`，这是 `Entity Framework` 的 `LINQ` 提供程序，让在 C# 中查询数据库变得简单。现在，你将从在数据库中创建一些对象开始。\n\
  \n## Code First 数据库\n\n在接下来的“尝试一下”中，你将使用 `Entity Framework` 通过 `Code First` 在数据库中创建一些对象，然后使用\
  \ `LINQ to Entities` 查询你创建的对象。\n\n## 我的数据库在哪里？\n\n但等一下，”你说，“你创建的数据库在哪里呢？你从未指定过文件名或文件夹位置——这一切都是魔法！你可以通过\
  \ Visual Studio 2015 中的“服务器资源管理器”（Server Explorer）查看数据库。转到工具 ![1](img/arrow.png)\
  \ 连接到数据库。`Entity Framework` 将你计算机上找到的第一个本地 SQL Server 实例中创建一个数据库。\n\n如果你之前在计算机上没有过任何数据库，Visual\
  \ C# 2015 会为你创建一个名为 `(localdb)\\MSSQLLocalDB` 的本地 SQL Server 实例。要连接到此类数据库类型，请在“服务器名称”字段中输入\
  \ `(localdb)\\MSSQLLocalDB`，如图 21.8 所示。\n\n![添加连接对话框截图，显示了选的数据源、服务器名称以及登录服务器并连接数据库的选项。](img/c21f008.jpg)\n\
  \n图 21.8\n\n包含你数据的数据库将被命名为 `BegVCSharp_21_1_CodeFirstDatabase.BookContext`，假设你按照章节所示准确输入了示例名称。在连接片刻后，它出现在“选择或输入数据库名称”字段中。\n\
  \n现在你可以按确定，数据库将显示在 Visual C# 2015 的“服务器资源管理器”的“数据连接”窗口中，如图 21.9 所示。\n\n![服务器资源管理器数据连接窗口截图，显示了展开的\
  \ Books 节点，其中包含 Code、Title 和 Author 项目。](img/c21f009.jpg)\n\n图 21.9\n\n从这里你可以直接浏览数据库。例如，你可以右键点击\
  \ Books 表并选择“显示表数据”，以查看你输入的数据，如图 21.10 所示。\n\n![服务器资源管理器数据连接窗口截图，显示了展开的 Books 节点，右键菜单中有“显示表数据”选项。右侧是一个列出每个代码的标题和作者的表格。](img/c21f010.jpg)\n\
  \n图 21.10\n\n## 导航数据库关系\n\n`Entity Framework` 最强大的功能之一是它能够自动创建 `LINQ` 对象，帮助你导航数据库中相关表之间的关系。\n\
  \n在接下来的“尝试一下”中，你添加了与 `Book` 类相关的两个新类，以制作简单的书店库存报告。这两个新类被称为 `Store`（代表每家书店）和 `Stock`（代表现有库存（书店架子上的书）以及向出版社订购的图书）。这些新类和关系的类图如图\
  \ 21.11 所示。\n\n![类框 Store、Stock 和 Book 的关系图，它们分别通过 Inventory 和 Item 项目连接。](img/c21f011.jpg)\n\
  \n图 21.11\n\n每家书店都有一个名称、地址和一个 `Inventory` 集合，该集合由一个或多个库存对象组成，每个对象对应书店经营的每种不同书籍（标题）。`Store`\
  \ 和 `Stock` 之间的关系是一对多。每条 `stock` 记录对应唯一一个 `book`。`Stock` 和 `Book` 之间的关系是一一对一。你需要\
  \ stock 记录，是因为一家书店可能有某本特定书籍的三份，而另一家书店可能有同一本书的六份。\n\n你将看到通过 `Code First`，你所做的就是创建\
  \ C# 对象，`Entity Framework` 就会为你处理好一切。\n\n## 处理迁移 (Migrations)\n\n在开发代码时，不可避免地你会改变你的想法。保持数据库与类之间的同步是很复杂的，但\
  \ `Entity Framework` 引入了一项功能使其变得简单。如果你通过 `Entity Framework` 修改了类，运行时会遇到如图 21.14\
  \ 所示的错误消息。\n\n![错误消息截图。](img/c21f014.jpg)\n\n图 21.14\n\n正如错误消息所示，你需要程序中添加 `Code\
  \ First Migrations` 包。要执行此操作，转到工具 ![1](img/arrow.png) NuGet 包管理器 ![1](img/arrow.png)\
  \ 包管理器控制台。这将弹出一个窗口，如图 21.15 所示。\n\n```\nEnable-Migrations -AutomaticMigrations\n\
  ```\n\n![显示 nuget.org 代码的窗口截图。](img/c21f015.jpg)\n\n图 21.15\n\n这为你的项目添加了一个 `Migrations`\
  \ 类，如图 21.16 所示。\n\n![解决方案资源管理器窗口截图，显示了 BegSharp_21_2_DatabaseRelations 下的文件树视图。高亮了\
  \ Migrations 文件夹及其配置文件。](img/c21f016.jpg)\n\n图 21.16\n\n`Entity Framework` 将比较数据库的时间戳和你的程序，并在数据库与类不同时提示你。要更新数据库，只需在包管理器控制台的\
  \ `PM>` 提示符下输入此命令：\n\n```\nUpdate-Database\n```\n\n## 从现有数据库创建并查询 XML\n\n在最后一个示例中，你将结合学过的关于\
  \ `LINQ`、数据库和 `XML` 的知识。\n\n`XML` 通常用于客户端与服务器机器之间或多层应用程序“层”之间的数据通信。从数据库中查询某些数据，然后根据这些数据生成\
  \ `XML` 文档或片段传递给另一层是非常常见的做法。\n\n在接下来的“尝试一下”中，你将创建一个查询以查找示例数据库中的某些数据，使用 `LINQ to\
  \ Entities` 查询数据，然后使用 `LINQ to XML` 类将数据转换为 `XML`。这是一个 `Database First`（数据库优先）的示例，区别于\
  \ `Code First` 编程（后者是你从现有数据库生成 C# 对象）。\n\n\n\n\n\n| 使用数据库 | 数据库是一个持久的、结构化的数据存储库。虽然有很多种数据库，但用于业务数据的最常见类型是关系型数据库。\
  \ |\n| Entity Framework | `Entity Framework` 是一组 `.NET` 类，用于 `C#` 对象与关系型数据库之间的对象-关系映射。\
  \ |\n| 如何使用 Code First 创建数据 | 通过使用 `Entity Framework` 中的 `Code First` 类，你可以利用对象-关系映射直接从\
  \ `C#` 类和集合中创建数据库。 |\n| 如何在数据库上配合使用 LINQ | `LINQ` to Entities 允许你使用与创建数据时相同的 `Entity\
  \ Framework` 类对数据库进行强大的查询。 |\n| 如何导航数据库关系 | `Entity Framework` 允许你通过在 `C#` 代码中使用虚拟属性和集合，在数据库中创建和导航相关实体。\
  \ |\n| 如何从数据库创建和查询 XML | 你可以通过在单个查询中组合 `LINQ` to Entities、`LINQ` to Objects 和 `LINQ`\
  \ to XML，从数据库中构建 XML。 |\n\n# 第 V 部分\n\n## 附加技术\n\n- 第 22 章: Windows 通信框架 (Windows\
  \ Communication Foundation)\n- 第 23 章: Windows Store 应用程序\n\n# 第 22 章\n\n## Windows\
  \ 通信框架 (WCF)\n\n### 本章 Wrox.com 代码下载\n\n本章的 `wrox.com` 代码下载可以在下载代码选项卡中的 `www.wrox.com/go/beginningvisualc#2015programming`\
  \ 找到。代码位于 第 22 章 下载中，并根据章节中的名称进行单独命名。\n\n近年来，随着互联网使用的无处不在，网络服务迅速增长。网络服务就像是供计算机而非人类使用的网站。例如，你可能不需要浏览关于你喜爱的电视节目的网站，而是使用一个桌面应用程序通过网络服务拉取相同的信息。这里的用处是，同一个网络服务可以被各种应用程序（实际上也是网站）使用。此外，你还可以编写使用第三方网络服务的自己的应用程序或网站。也许你可能会将你喜欢的电视节目信息与地图服务相结合，以显示拍摄地点。\n\
  \n`.NET Framework` 支持 Web 服务已经有一段时间了。然而，在框架的较新版本中，Web 服务与另一种称为远程调用（remoting）的技术相结合，创建了\
  \ Windows 通信框架 (`WCF`)，这是一个用于应用程序之间通信的通用基础结构。\n\n远程调用使得在一个进程中创建对象实例并在另一个进程中使用它们成为——即使该对象是在使用它的其他计算机上创建的。然而，单用远程调用是有局限性的，而且对于初级程序员来说并不是容易学习的。\n\
  \nWCF 吸收了 Web 服务中的服务和平台无关的 SOAP 消息等概念，并将这些概念与远程调用中的主机服务器应用程序和高级绑定能力等概念相结合。其结果是一种你可以理解为超集的技术，它既包含了\
  \ Web 服务也包含了远程调用，但它比 Web 服务强大得多，且比远程调用更易使用。通过使用 `WCF`，你可以从简单的应用程序过渡到使用面向服务架构 (`SOA`)\
  \ 的应用程序。`SOA` 意味着你去中心化处理，通过在本地局域网和互联网上按需要连接和服务及数据来利用分布式处理。\n\n本章将引导你了解如何从应用程序代码中创建和消费\
  \ WCF 服务。但同样重要的是，它还涵盖了 WCF 背后的原理，以便你理解这些工作是如何这样运行的。\n\n### 什么是 WCF？\n\nWCF 是一种允许你创建可以跨越进程、机器和网络边界从其他应用程序访问的服务的技术。你可以使用这些服务在多个应用程序之间共享功能、暴露数据源或抽象复杂的过程。\n\
  \nWCF 服务提供的功能被封装为由服务暴露的单个方法。每个方法——或者在 WCF 术语中，称为每个操作——都有一个端点（endpoint），你通过它交换数据以使用它。这种数据交换由一个或多个协议定义，取决于你连接到服务时使用的网络以及你的特定需求。\n\
  \n在 `WCF` 中，端点可以有多个绑定（bindings），每种绑定指定了一种通信方式。绑定还可以指定额外信息，例如与端点通信时必须满足哪些安全要求。例如，绑定可能要求用户名和密码认证或\
  \ Windows 用户帐户令牌。当你连接到端点时，绑定所使用的协议将影响你所使用的地址，正如你很快将看到的。。\n\n一旦你连接到端点，你就可以使用简单对象访问协议\
  \ (`SOAP`) 消息与它进行通信。你使用的消息形式取决于你正在使用的操作以及向该操作发送消息（以及从该操作接收消息）所需的数据结构。WCF 使用合约来指定所有这一切。你可以通过与服务的元数据交换来发现合约。服务发现的一种常用格式是\
  \ Web 服务描述语言 (`WSDL`)，它最初用于 Web 服务，尽管 WCF 服务也可以用其他方式进行描述。\n\n当你确定了想要使用的服务和端点，并且知道你要使用哪种绑定以及遵循哪些合约后，你就可以像处理本地对象一样简单地与\
  \ WCF 服务通信。与 WCF 通信可以是简单的单向事务、请求/响应消息，或者是可以从通信通道任一端发起的双工通信。你还可以使用消息负载优化技术（例如消息传输优化\
  \ (`MTOM`)）在需要时封装数据。\n\nWCF 服务本身可能运行在托管它的计算机上的多个不同进程之一。与始终运行在 `IIS` 中的 Web 服务不同，你可以选择适合你情况的主机进程。你可以使用\
  \ `IIS` 托管 WCF 服务，也可以使用 Windows 服务或可执行文件。如果你在局域网上通过 TCP 与 WCF 服务通信，则甚至在托管服务的 PC\
  \ 上不需要安装 `IIS`。\n\nWCF 框架的设计允许你自定义在本节中读到的几乎所有内容。然而，这是一个高级主题，在本章中你将仅使用 `.4.5` 提供的技术。\n\
  \n现在你已经掌握了 WCF 服务的基础知识，将在后续章节中详细介绍这些概念。\n\n## WCF 概念\n\n本节描述了 WCF 的以下方面：\n\n- WCF\
  \ 通信协议\n- 地址、端点和绑定\n- 合约\n- 消息模式\n- 行为\n- 托管\n\n### WCF 通信协议\n\n如前，你可以通过多种传输协议与\
  \ WCF 服务通信。事实上，`.NET 4.5 Framework` 定义了五种：\n\n- **HTTP** —— 允许你从任何地方（访问 WCF 服务。你可以使用\
  \ HTTP 通信创建 WCF Web 服务。\n- **TCP** —— 允许你在局域网内或在适当配置防火墙的情况下跨互联网与 WCF 服务通信。TCP 比\
  \ HTTP 更高效且功能更强大，但配置可能更复杂。\n\n\n\n\n\n- `UDP` — 用户数据报协议与 TCP 的相似之处在于它允许通过本地网络或 Internet\
  \ 进行通信，但其实现方式略有不同。这种实现方式产生的结果是服务可以同时向多个客户端广播消息。\n- `Named pipe` — 命名管道——允许你与调用代码在同一台机器上但在不同进程中的\
  \ WCF 服务进行通信。\n- `MSMQ` — 微软消息队列是一种队列技术，它允许应用程序发送的消息通过队列路由并到达目的地。`MSMQ` 是一种可靠的消息传递技术，可以确保发送到队列的消息到达该队列。`MSMQ`\
  \ 本质上是异步的，因此只有当队列中前面的消息被处理完毕且有处理服务可用时，队列中的消息才会被处理。\n\n这些协议通常可以允许你建立安全连接。例如，你可以使用\
  \ `HTTPS` 协议在互联网上建立 `SSL` 连接。`TCP` 通过使用 Windows 安全框架为本地网络的安全提供了广泛的可能性。`UDP` 不支持安全性。\n\
  \n为了连接到 WCF 服务，你必须知道它在哪里。在实践中，这意味着需要知道端点（endpoint）的地址。\n\n### 地址、端点和绑定\n\n你用于服务的地址类型取决于你所使用的协议。服务地址按照本章描述的三种协议（不涵盖\
  \ `MSMQ`）的格式化如下：\n\n- `HTTP` — `HTTP` 协议的地址是常见形式 `http://<server>:<port>/<service>`\
  \ 的 URL。对于 `SSL` 连接，你也可以使用 `https://<server>:<port>/<service>`。如果你在 `IIS` 中托管服务，`<service>`\
  \ 将是一个带有 `.svc` 扩展名的文件。`IIS` 地址可能包含此示例中更多的子目录——即在 `.svc` 文件之前有更多由 `/` 字符分隔的节。\n\
  - `TCP` — `TCP` 的地址格式为 `net.tcp://<server>:<port>/<service>`。\n- `UDP` — `UDP` 的地址格式为\
  \ `soap.udp://<server>:<port>/<service>`。多播通信（multicast）需要特定的 `<server>` 值，但这超出了本章的讨论范围。\n\
  - `Named pipe` — 命名管道连接的地址类似，但没有端口号。它们的格式为 `net.pipe://<server>/<service>`。\n\n\
  服务的地址是一个基础地址，你可以用它创建表示操作的端点地址。例如，你可能有一个位于 `net.tcp://<server>:<port>/<service>/operation1`\
  \ 的操作。\n\n例如，假设你创建了一个只有一个操作的 WCF 服务，该操作具有此处列出的所有三种协议的绑定。你可能会使用以下基础地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc\n\
  net.tcp://myhugeserver:8080/mygreatservice\nnet.pipe://localhost/mygreatservice\n\
  ```\n\n然后你可以对操作使用以下地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc/greatop\n\
  net.tcp://myhugeserver:8080/mygreatservice/greatop\nnet.pipe://localhost/mygreatservice/greatop\n\
  ```\n\n从 `.NET 4` 开始，已经可以使用操作使用默认端点，而无需显式地配置它们。这简化了配置，特别是在你想像前面的示例中那样使用标准端点地址的情况下。\n\
  \n如前所述，绑定（Bindings）指定的不仅仅是操作将使用的传输协议。你还可以使用它们来指定通过传输协议进行通信的安全需求、端点的事务能力、消息编码等许多内容。\n\
  \n由于绑定提供了如此巨大的灵活性，.NET Framework 提供了一些你可以使用的预定义绑定。你也可以将这些绑定作为起点，对它们进行微调以获得你完全需要的绑定类型——只要在一定范围内即可。预定义绑定具有你必须遵循的某些功能。每种绑定类型由\
  \ `System.ServiceModel` 命名空间中的一个类表示。表 22.1 列出了最常用的绑定以及关于它们的一些基本信息。\n\n| 绑定 | 描述\
  \ |\n| :--- | :--- |\n| `BasicHttpBinding` | 最简单的 HTTP 绑定，也是 Web 服务使用的默认绑定。它的安全能力有限，且没有事务支持。\
  \ |\n| `WSHttpBinding` | 一种更高级的 HTTP 绑定，能够使用 WSE 中引入的所有额外功能。 |\n| `WSDualHttpBinding`\
  \ | 扩展了 `WSHttpBinding` 功能以包含双向通信能力。通过双向通信，服务器除了普通的消息交换外，还可以与客户端发起通信。 |\n| `WSFederationHttpBinding`\
  \ | 扩展了 `WSHttpBinding` 功能以包含联合（federation）能力。联合允许第三方实现单点登录和其他专利安全措施。这是一个本章未涵盖的高级主题。\
  \ |\n| `NetTcpBinding` | 用于 TCP 通信，允许你配置安全、事务等。 |\n| `NetNamedPipeBinding` | 用于命名管道通信，允许你配置安全、事务等。\
  \ |\n| `NetMsmqBinding` | 与 MSMQ 使用，本章未涵盖 MSMQ。 |\n| `NetPeerTcpBinding` | 用于对等绑定，本章未涵盖该内容。\
  \ |\n| `WebHttpBinding` | 用于使用 HTTP 请求而不是 SOAP 消息的 Web 服务。 |\n| `UdpBinding` | 允许绑定到\
  \ UDP 协议。 |\n\n### 绑定类型\n\n许多绑定类具有相似的属性，你可以使用它们进行额外配置。例如，它们拥有你可以用来来配置超时值的属性。当你之后查看本章稍后的代码时，将学习更多相关知识。\n\
  \n从 `.NET 4` 开始，端点具有根据所用协议而不同的默认绑定。这些默认值在表 22.2 所示。\n\n| 协议 | 默认绑定 |\n| :--- | :---\
  \ |\n| HTTP | `BasicHttpBinding` |\n| TCP | `NetTcpBinding` |\n| UDP | `UdpBinding`\
  \ |\n| 命名管道 | `NetNamedPipeBinding` |\n| MSMQ | `NetMsmqBinding` |\n\n### 合约（Contracts）合约定义了如何使用\
  \ WCF 服务。可以定义几种类型的合约：\n\n- **服务合约 (Service contract)** — 包含有关服务以及服务暴露的操作的通用信息。这包括服务使用的命名空间。服务具有唯一的命名空间，用于在定义\
  \ SOAP 消息架构时避免与其他服务的可能冲突。\n- **操作合约 (Operation contract)** — 定义了如何使用操作。这包括操作方法的参数和返回类型，以及附加信息，例如方法是否会返回响应消息。\n\
  - **消息合约 (Message contract)** — 允许你自定义 SOAP 消息内部信息的格式——例如，数据应该包含在 SOAP 头部还是 SOAP\
  \ 消息正文中。这在创建必须与遗留系统集成的 WCF 服务时非常有用。\n- **故障合约 (Fault contract)** — 定义了操作可以返回的故障。当你使用\
  \ .NET 客户端时，故障会导致异常，你可以以正常方式捕获并处理异常。\n- **数据合约 (Data contract)** — 如果你将复杂类型（例如自定义结构体和对象）作为操作的参数或返回类型，那么你必须为这些类型定义数据合约。数据合约根据类型通过属性暴露的数据来定义类型。\n\
  \n\n\n\n\n你通常会通过属性为服务类和方法添加合约，你将在本章稍后部分看到这一点。\n\n### 消息模式\n\n在上一节中，你看到操作合约可以定义操作是否返回值。你还读到了关于通过\
  \ `WSDualHttpBinding` 绑定实现的双工通信。这些都是消息模式的各种，总共有三种类型：\n\n*   **请求/响应消息（Request/response\
  \ messaging）** —— 交换消息的“普通”方式，发送到服务的每条消息都会返回响应。这并不意味着客户端必须等待响应，因为你可以以异步方式调用操作。\n\
  *   **单向消息（One-way, or simplex messaging）** —— 消息从客户端发送到 WCF 操作，但不发送响应。\n*   **双向或双工消息（Two-way,\
  \ or duplex messaging）** —— 一种更高级的方案，客户端既作为服务器也作为客户端。一旦设置，双工消息允许客户端和服务器相互发送消息。\n\
  \n你将在本章稍后看到这些消息模式如何在实践中使用的。\n\n### 行为（Behaviors）\n\n行为是一种应用于直接暴露给客户端的服务和操作额外配置的方法。通过向服务添加行为，你可以控制它是如何被实例化的、如何参与事务的、服务中如何处理多线程问题等。操作行为可以控制执行时是否使用身份模拟、如何影响事务等。\n\
  \n自 `.NET 4` 起，你可以在各个级别指定默认行为，这样就不需要为每个服务的每个操作指定每个方面的行为。你可以在需要时覆盖设置，从而减少配置量。\n\n\
  ### 托管（Hosting）\n\n在本章的介绍中，你学习了 WCF 服务可以在不同的进程中托管。这些可能性如下：\n\n*   **Web 服务器（Web\
  \ server）** —— IIS 托管的 WCF 服务是 WCF 提供的最接近 Web 服务的形式。此外，可以使用 IIS 等高级功能和安全特性。\n* \
  \  **可执行文件（Executable）** —— 你可以在 .NET 创建的任何应用程序类型中托管 WCF 服务，例如控制台应用程序、Windows Forms\
  \ 应用程序和 WPF 应用程序。\n*   **Windows 服务（Windows service）** —— 你可以在 Windows 服务中托管 WCF\
  \ 服务，这意味着可以使用 Windows 服务提供的自动启动和故障恢复等有用特性。\n*   **Windows 激活服务（Windows Activation\
  \ Service）** —— 专门为托管 WCF 服务设计，WAS 基本上是无法使用 IIS 时 IIS 的简单版本。\n\n上述两个选项——IIS 和 WAS——为\
  \ WCF 服务提供了有用特性，如激活、进程回收和对象池。如果你使用另外两个托管选项，WCF 服务被称为 `自托管（self-hosted）`。你会偶尔为了测试而自托管服务，但创建生产级服务也有非常好的理由。例如，你可能处于无法在运行服务的计算机上安装\
  \ Web 服务器的情况下，或者组织的本地策略禁止运行 IIS。在这种情况下，你可以在 Windows 服务中托管服务，它的工作方式完全一样。\n\n## WCF\
  \ 编程\n\n现在你已经涵盖了所有基础知识，是时候开始编写代码了。在本节中你将从查看简单的服务器托管 WCF 服务和控制台应用程序开始。在查看了创建的代码后，将学习\
  \ WCF 服务和客户端的基本结构。然后你将详细查看一些关键主题：\n\n*   定义 WCF 服务合约\n*   自托管 WCF 服务\n\n### WCF\
  \ 测试客户端\n\n在之前的“尝试”中，你创建了服务和客户端，以观察基本 WCF 架构如何工作以及如何实现 WCF 服务的配置。然而在实践中，你想要使用的客户端应用程序可能是复杂的，正确测试服务可能会很困难。\n\
  \n为了方便 WCF 服务的开发，Visual Studio 提供了一个你可以使用的测试工具来确保你的 WCF 操作正常工作。该工具已配置为与你的 WCF 服务项目配合，因此如果你运行项目，该工具就会出现。你只需要确保要测试的服务（即\
  \ `.svc` 文件）被设置为 WCF 服务项目的启动页。或者，你也可以将客户端作为独立应用程序运行。在 64 位操作系统上，你可以通过 `C:\\Program\
  \ Files (x86)\\Microsoft Visual Studio 14.0\\Common7\\IDE\\WcfTestClient.exe` 找到测试客户端。\n\
  \n如果你使用的是 32 位操作系统，路径相同，但根文件夹是 `Program Files`。\n\n该工具允许你调用服务操作并以其他方式检查服务。接下来的“尝试”说明了这一点。\n\
  \n定义 定义 WCF 服务合约\n\n之前的示例展示了 WCF 基础设施如何让你能够通过结合类、接口和属性轻松地为 WCF 服务定义合约。本节将深入探讨这种技术。\n\
  \n#### 数据合约（Data Contracts）\n\n要为服务定义数据合约，你需要在类定义上应用 `DataContractAttribute`。该属性位于\
  \ `System.Runtime.Serialization` 命名空间中。你可以使用表 22.3 所示的属性配置此属性。\n\n| 属性 | 描述 |\n\
  | :--- | :--- |\n| `Name` | 为数据合约命名，使用与类定义不同的不同的名称。此名称将用于 SOAP 消息和从服务元数据定义的客户端数据对象。\
  \ |\n| `Namespace` | 定义数据合约在 SOAP 消息使用的命名空间。 |\n| `IsReference` | 影响对象的序列化方式。如果设置为\
  \ `true`，则如果一个对象实例被多次引用，它只会被序列化一次，这在某些情况下非常重要。默认值为 `false`。 |\n\nDataContractAttribute\
  \ 属性\n\n数据数据的每个类成员必须使用 `DataMemberAttribute`，该属性同样位于 `System.Runtime.Serialization`\
  \ 命名空间中。表 22.4 列出了此属性的属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 指定序列化时数据成员的名称（默认成员名称）。\
  \ |\n| `IsRequired` | 指定成员是否必须出现在 SOAP 消息中。 |\n| `Order` | 一个指定序列化或反序列化成员顺序的 `int`\
  \ 值，如果一个成员必须在另一个成员被理解之前存在，则可能是需要的。较低的 `Order` 成员先处理。 |\n| `EmitDefaultValue` | 将此设置为\
  \ `false`，则如果成员的值为成员的默认值，则防止将其包含在 SOAP 消息中。 |\n\nDataMemberAttribute 属性\n\n####\
  \ 服务合约\n\n\n\n\n\n服务合约是通过在接口定义上应用 `System.ServiceModel.ServiceContractAttribute`\
  \ 属性来定义的。你可以通过表 22.5 所示的属性来自定义服务合约。\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Name` |\
  \ 指定 WSDL 中 `<portType>` 元素中定义的服务合约名称。 |\n| `Namespace` | 定义 WSDL 中 `<portType>`\
  \ 元素所使用的服务合约命名空间。 |\n| `ConfigurationName` | 配置文件中服务合约名称。 |\n| `HasProtectionLevel`\
  \ | 决定服务使用的消息是否具有显式定义的保护级别。保护级别允许你对消息进行签名，或同时进行签名和加密。 |\n| `ProtectionLevel` | 用于消息保护的保护级别。\
  \ |\n| `SessionMode` | 决定是否为消息启用会话。如果你使用会话，则可以确保发送到服务不同端点的消息是相关联的——也就是说，它们使用同一个服务实例，因此可以共享状态等。\
  \ |\n| `CallbackContract` | 对于双向消息传递，客户端和服务一样暴露一个合约。这是因为如前所述，双向通信中的客户端也充当服务器的角色。此属性允许你指定客户端使用的合约。\
  \ |\n\n**表 22.5**](#c22.xhtml_c22-tbl-anc-0005) ServiceContractAttribute 属性\n\n\
  ### 操作合约\n\n在定义服务合约的接口内部，你通过应用 `System.ServiceModel.OperationContractAttribute`\
  \ 属性将成员定义为操作。该属性具有在表 22.6 中描述的属性。\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Name` | 指定服务操作的名称。默认值为成员名称。\
  \ |\n| `IsOneWay` | 指定操作是否返回响应。如果你将其设置为 `true`，则客户端将不会等待操作完成即可继续。 |\n| `AsyncPattern`\
  \ | 如果设置为 `true`，则操作被实现为两个方法，你可以使用这两个方法来异步调用操作：`Begin<methodName>()` 和 `End<methodName>()`。\
  \ |\n| `HasProtectionLevel` | 参见上一节。 |\n| `ProtectionLevel` | 参见上一节。 |\n| `IsInitiating`\
  \ | 如果使用了会话，则此属性决定调用此操作是否可以启动新会话。 |\n| `IsTerminating` | 如果使用了会话，则此属性决定调用此操作是否终止当前会话。\
  \ |\n| `Action` | 如果你使用寻址（WCF 服务的一种高级功能），则操作有一个关联的操作名称，你可以通过此属性指定它。 |\n| `ReplyAction`\
  \ | 与 `Action` 类似，但指定操作响应的名称。 |\n\n**表 22.6**](#c22.xhtml_c22-tbl-anc-0006) OperationContractAttribute\
  \ 属性\n\n### 消息合约\n\n之前的示例没有使用消息合约规范。如果你使用这些规范，可以通过定义一个表示消息的类并在该类上应用 `MessageContractAttribute`\
  \ 属性来实现。然后对该类的成员应用 `MessageBodyMemberAttribute`、`MessageHeaderAttribute` 或 `MessageHeaderArrayAttribute`\
  \ 属性。所有这些属性都在 `System.ServiceModel` 命名空间中。除非你需要对 WCF 服务使用的 SOAP 消息进行极高级的控制，否则你可能不想这样做，因此此处不提供相关细节。\n\
  \n### 故障合约\n\n如果你有一个特定的异常类型（例如自定义异常）希望其对客户端应用程序可用，那么可以在可能生成此异常的操作上应用 `System.ServiceModel.FaultContractAttribute`\
  \ 属性。\n\n### 自托管 WCF 服务\n\n到本章为止，你已经看到了托管在 Web 服务器上的 WCF 服务。这使你能够跨越互联网进行通信，但对于本地网络通信，这并不是最有效的方法。首先，你需要在托管服务的计算机上准备一个\
  \ Web 服务器。此外，你应用程序的架构可能导致拥有一个独立的 WCF 服务并不总是尽如人意。\n\n相反，你可能想要使用自托管的 WCF 服务。自托管的 WCF\
  \ 服务存在于你创建的进程中，而不是特制的托管应用程序（如 Web 服务器）的进程中。这意味着例如，你可以使用控制台应用程序或 Windows 应用程序来托管你的服务。\n\
  \n要自托管 WCF 服务，你使用 `System.ServiceModel.ServiceHost` 类。你通过要托管的服务的类型或服务类的实例来实例化此类。你可以通过属性或方法配置服务主机，或者（这是最巧妙的部分）通过配置文件配置。事实上，主机进程（如\
  \ Web 服务器）使用 `ServiceHost` 实例来执行托管。自托管的区别在于你直接与此类进行交互。然而，你放置在主机应用程序的 `app.config`\
  \ 文件`<system.serviceModel>` 部分的配置，与你在本章中已经看到的配置部分的语法完全相同。\n\n你可以通过你喜欢的任何协议暴露自托管服务，尽管在在此类应用程序中，你通常会使用\
  \ TCP 或命名管道绑定。通过 HTTP 访问的服务更有可能存在于 Web 服务器进程内部，因为你可以获得 Web 服务器提供的额外功能。\n\n如果你想托管一个名为\
  \ `MyService` 的服务，可以使用如下代码创建 `ServiceHost` 实例：\n\n```\nServiceHost host = new ServiceHost(typeof(MyService));\n\
  ```\n\n如果你想托管一个名为 `myServiceObject` 的 `MyService` 实例，可以编写如下代码创建 `ServiceHost` 实例：\n\
  \n```\nMyService myServiceObject = new MyService();\nServiceHost host = new ServiceHost(myServiceObject);\n\
  ```\n\n在创建 `ServiceHost` 实例后，你可以通过属性配置服务及其端点和绑定。或者，如果你将配置放在 `.config` 文件中，`ServiceHost`\
  \ 实例将自动配置。\n\n一旦配置了 `ServiceHost` 实例，你使用 `ServiceHost.Open()` 方法开始托管服务。同样地，通过 `ServiceHost.Close()`\
  \ 方法停止托管服务。当你首次开始托管 TCP 绑定的服务时，如果启用了该功能，可能会收到来自 Windows 防火墙服务的警告，因为它默认会阻止 TCP 端口。你必须为服务打开\
  \ TCP 端口以便在该端口开始监听。\n\n在接下来的“尝试一试”中，你将使用自托管技术通过 WCF 服务暴露 WPF 应用程序的功能。\n\n## 本章所学\n\
  \n| 主题 | 核心概念 |\n| :--- | :--- |\n| **WCF 基础** | WCF 提供了一个创建和通信远程服务的框架。它结合了 Web\
  \ 服务和远程调用架构的元素并结合新技术实现了这一点。 |\n| **通信协议** | 你可以通过多种协议之一（包括 HTTP 和 TCP）与 WCF 服务通信。这意味着你可以使用本地客户端应用程序的服务，也可以使用跨越机器或网络边界的服务。要实现这一点，你通过与协议和功能对应的绑定访问服务的特定端点。你可以通过行为控制这些功能，例如使用会话状态或暴露元数据。.NET\
  \ 4.5 包含了许多默认设置，使得定义简单的服务变得非常容易。 | |\n\n\n\n\n\n| **通信负载** | 通常，对 WCF 服务的响应调用被编码为\
  \ SOAP 消息。然而，也有其他替代方案，例如纯 HTTP 消息，如果你有需要，还可以从头开始定义自己的负载类型。 |\n| **托管** | WCF 服务可能托管在\
  \ IIS 或 Windows 服务中，也可以是自托管的。使用 IIS 等宿主机可以让你利用宿主机的内置功能，包括安全性和应用程序池。自托管更加灵活，但可能需要更多的配置和编码。\
  \ |\n| **合约** | 你通过合约来定义 WCF 服务与客户端代码之间的接口。服务本身及其暴露的任何操作都通过服务合约和操作合约来定义。数据类型通过数据合约定义。通过消息和故障合约实现对通信的进一步定制化。\
  \ |\n| **客户端应用程序** | 客户端应用程序通过代理类与 WCF 服务进行通信。代理类实现了该服务的服务合约接口，对该接口操作方法的任何调用都会重定向到服务。你可以使用“添加服务引用”工具生成代理类，也可以通过通道工厂方法程序化地创建。为了确保通信成功，客户端必须配置为与服务配置匹配。\
  \ |\n\n# 第 23 章：通用应用\n\n## 本章的 Wrox.com 代码下载\n\n你可以在“下载代码”选项卡中的 `www.wrox.com/go/beginningvisualc#2015programming`\
  \ 本章的 `wrox.com` 代码下载。代码位于第 23 章下载，并根据章节中的名称单独命名。\n\nWindows 通用应用是全球 Windows 开发者的热点。随着\
  \ Windows 8 的发布，微软发生了巨大的跨越，从几乎完全针对桌面电脑和笔记本电脑转变为平板电脑和智能手机市场的真正参与者。Windows 8 配带了一个用于开发应用的新\
  \ API 以及 Windows Store，允许用户以安全且预测的方式下载应用。通过 Windows 10 和通用 Windows Platform (UWP)，微软通过引入通用应用将应用生产力提升了一个新高度。这些应用可以针对从手机、Xbox\
  \ 到 Windows 桌面的所有平台。\n\n## 快速上手\n\n编写通用应用在开始之前需要完成几个初始步骤。在之前的 Visual Studio 版本中，你需要获取\
  \ Windows 8 开发者许可，并且该许可需要经常更新。对于 Windows 10，开发时不再需要这种许可，但你仍然需要一个商店账户才能发布应用。在开发应用时，你可以只需将你的\
  \ Windows 10 设备注册用于开发。\n\n在开始制作 Windows 通用应用之前，你必须在设备上启用开发功能，除非已安装，否则你必须安装通用 Windows\
  \ 应用开发工具。\n\n如果你使用的是 Windows 10 版 Visual Studio Express，或者在另一个版本的 Visual Studio\
  \ 中打开解决方案创建 Windows 通用应用，你将看到图 23.1 所示对话框提示启用开发者模式。当你看到此对话框时，点击“开发者设置”链接，选择“开发者模式”选项，然后对你正在选择安全性较低选项的警告点击“是”。\n\
  \n![开发者模式对话框截图，显示设备必须正确设置以便在提交到 Windows Store 之前安装和测试应用，并带有指向开发者设置的链接。](img/c23f001.jpg)\n\
  \n**图 23.1**\n\n你可能没有安装通用 Windows 应用开发工具。这些工具随某些版本的 Visual Studio 会自动提供，但如果你没有，只需打开新建项目对话框\
  \ ![1](img/arrow.png)Visual C# ![1](img/arrow.png)Windows ![1](img/arrow.png)Universal，你应该就能看到指向安装程序的链接。点击此链接安装工具。\n\
  \n## 通用应用\n\nWindows 通用应用是可以针对多种设备类型的应用。传统的应用程序（如你在书中之前编写的 WPF 桌面游戏）针对单一设备类型，例如\
  \ PC。随着通用 Windows Platform 的引入，微软使得编写能够在多个设备上运行的应用程序成为可能，并付出了大量努力让开发此类应用成为开发人员的一种愉快的体验。\n\
  \n开发在大量异构设备上运行的应用面临的主要挑战是，你无法预先知道屏幕有多大，或者用户将如何与设备交互。如果你简单地将书中之前的 Karli Card WPF\
  \ 应用挤进手机屏幕尺寸，它即使在尺寸最大的手机上看起来也会很糟糕。这方面的另一个方面是手机用户期望你的应用能够调整其在屏幕上的方向。在本章中，我们将引入响应式\
  \ UI 和自适应触发器的概念来解决这些问题。\n\n通用应用通过 Windows Store 部署，这为应用打包带来了自身的挑战。为了让你的应用进入商店，你必须经过相当严格的测试过程并通过微软设置的多项要求。在本章的最后部分，我们将检查这一过程，以便你准备发布自己的应用。\n\
  \n## 应用概念与设计\n\n应用程序在手机和 Windows 桌面上的显示方式存在巨大差异。自 Windows 95 引入以来，运行在 Windows 桌面上的应用程序设计在很大程度上没有变化，尽管有了更好的图形效果。设计特征具有一个带有标题栏的窗口，右上角的三个用于最大化、最小化和关闭应用程序的按钮，以及使用按钮、单选按钮、复选框等来显示内容。Windows\
  \ 8 引入的应用设计方式有所不同。\n\n当微软发布 Windows 8 时，还发布了一份相当详尽的应用设计指南，你应该了解这份指南，尽管你并不总是要遵循它。尽管应用运行在多样化的设备上，但它们具有许多你应该了解的共同特征，因此让我们来看看这些特征，并对比一下商店应用与桌面应用程序。\n\
  \n### 屏幕方向\n\n\n\n\n\n# 磁片\n\nWindows 使用称为“实时磁片”（live tiles）的功能在开始菜单和页面上显示应用程序。名称中的“实时”部分源于磁片可以根据应用程序的当前内容或状态发生变化。例如，你将看到照片应用在开始页上轮播照片，邮件客户端显示未读邮件数量，游戏显示上次保存的截图等。这种可能性几乎是无尽的。\n\
  \n对于你的应用程序，提供一个良好的磁片比为桌面应用程序提供一个良好的图标更重要，尽管后者也非常重要。磁片嵌入在应用程序的清单（manifest）中，正如你将在本章后面部分看到的，使用\
  \ Visual Studio 可以很容易地包含它们。\n\n`badge`（角标）是磁片的小尺寸版本，Windows 可以在锁定屏幕和其他情况下使用。除非你的应用会在锁定屏幕上显示通知，否则你不需要为应用提供角标。\n\
  \n## 应用生命周期\n\n传统的 Windows 桌面应用程序可以通过点击标题栏右上角的按钮来关闭，但通用应用（Universal apps）通常不显示标题栏，那么你该如何关闭它们呢？通常情况下，你不需要关闭应用程序。每当通用应用失去焦点时，它就会被挂起并完全停止使用处理器资源。这使得许多应用看起来是在同时运行，而实际上它们只是处于挂起状态。Windows\
  \ 在应用程序失去焦点后会自动进行挂起操作。作为用户，你并不会察觉到这一点，但对于应用开发者来说，这是一个需要了解并处理的重要事实。\n\n## 锁定屏幕应用\n\
  \n某些应用在失去焦点时应该保持运行。这类应用的示例包括 GPS 导航和音频流媒体应用。用户期望这类应用即使在开始开车或开始使用其他应用也能继续运行。如果你的应用需要在后台持续运行，你必须将其声明为锁定屏幕应用，并提供用于在锁定屏幕上显示通知的信息。\n\
  \n## 应用开发\n\n当你开始开发 Windows 通用应用时，在编程和 UI 语言方面有许多选择。本书使用 `C#` 和 `XAML`，其他可能性还包括使用\
  \ `JavaScript` 和 `HTML5`、`C++` 和 `DirectX` 或 `Visual Basic` 和 `XAML`。\n\n用于创建通用应用用户界面的\
  \ `XAML` 与 `WPF` 的 `XAML` 不完全相同，但它们足够接近，你应该能放心地使用它。你熟悉的许多控件在通用应用中也存在，尽管它们的外观往往与\
  \ Windows 桌面版本略有不同。还有许多针对触控优化的控件。\n\n### 自适应显示\n\n自适应显示是指能够响应用户操作（如手机侧向放置或窗口大小变化）而改变的显示。你的应用程序应该能够在用户将手机侧放时，优雅地从竖屏模式切换到横屏模式，并且无论部署在笔记本电脑还是手机上都能正常工作且美观。\n\
  \n当你创建一个新的 Windows 通用应用项目时，首先会注意到设计器中显示的页面看起来相当小。这是因为该项目默认使用针对 5 英寸手机显示优化的视图。你可以使用图\
  \ 23.2 中显示的 `Device Preview`面板对其进行更改。你还可以使用此面板将布局从竖屏更改为横屏。\n\n![显示手机、平板电脑、桌面电脑、Xbox、surface\
  \ hub 和 IoT 设备等设备可用 Device Preview 面板选项的级联菜单截图。](img/c23f002.jpg)\n\n**图 23.2\n\n\
  一个表现良好的应用程序能够在 `Device Preview` 面板所示的许多（不是所有）格式下良好地显示自己。考虑到列表中的范围从 569×320 像素的物联网（IoT）设备到\
  \ 3840×2160 像素的 Surface Hub，这是一项艰巨的任务。幸运的是，`Visual Studio` 和 `Universal Windows\
  \ Platform` 框架将为你帮助。当你从下拉列表中更改分辨率（或屏幕尺寸）时，`Visual Studio` 会调整你的应用程序大小，让你立即看到页面的外观。此外，工具箱中包含了辅助为应用程序创建自适应设计的控件，你可以利用它们轻松创建将进行精美转换的\
  \ UI。\n\n#### 相对面板 (Relative Panel)\n\n在第 14 章和第 15 章中，你使用了 `Grid` 和 `StackPanels`\
  \ 控件来创建一个在静态显示上运行良好的 UI。但在必须针对许多显示尺寸的世界里，你希望有一种能够更好地为你移动控件的东西。这时 `RelativePanel`\
  \ 控件登场了。\n\n`relative panel`（相对面板）允许你指定控件之间的相对位置。正如你所预期的，可以将控件放置在其他控件的左侧、右侧、上方或下方，你还可以进行其他其他技巧。你可以将控件相对于另一个控件的左侧、右侧或中心（无论是水平还是垂直方向），并将控件的边缘与面板的边缘对齐。这意味着你不再需要反复调整像素来让两个控件在显示器上完美对齐。\n\
  \n#### 自适应触发器 (Adaptive Triggers)\n\n自适应触发器是 `Visual State Manager`（视觉状态管理器）的新特性。通过使用这些触发器，你可以根据显示器的大小更改应用程序的布局。结合\
  \ `relative panel` 使用，这是一个非常强大的功能，它以非常直观的方式让你构建出网络世界所谓的“响应式 UI”，而微软称之为“自适应显示”。\n\
  \n#### FlipView\n\n`FlipView` 是一个非常好用的小控件，适用于手持设备。它允许用户向左或向右滑动显示内容。它通常用于一次显示一张图片，并允许用户使用滑动手势在图片之间移动。\n\
  \n默认情况下，`FlipView` 允许用户向左或向右滑动移动视图中的内容，但可以更改为向上或向下移动。当使用鼠标时，滚动按钮也可以正常工作。\n\n###\
  \ 沙盒应用\n\n此时，值得后退一步，查看一下 Windows 通用平台平台上 .NET 框架的某些局限性。在移动设备上运行的应用对运行运行的操作系统访问权限有限，这意味着某些类型的应用程序是你根本无法编写的。例如，如果你需要直接访问文件系统以访问\
  \ Windows 系统文件，你必须编写传统的 Windows 桌面应用程序。\n\n当你使用 `C#` 编写通用应用时，你会发现限制因素在于应用程序引用的 `.NET\
  \ Framework`，在其中，常见的命名空间和类完全缺失，或者可用方法比以前更少。如果你打开 `Visual Studio`，创建一个空白应用，然后展开 `References`（引用）节点，你会发现它与\
  \ Windows 桌面应用的引用非常不同。有三个 `ApplicationInsights` 引用，每个都允许你监控应用程序的各个方面，以及两个指向 `.NET`\
  \ 和 `Windows` 的引用。后者第一个是更改过的 `.NET` 版本，第二个是 `Windows Core API`。\n\n\n\n\nWindows\
  \ 通用应用（Universal Apps）的沙箱机制，以及它们在进入 Windows 商店之前必须经过的流程，意味着用户很少需要担心通过商店下载到恶意应用。显然，有人会尝试绕过这一点，用户绝不应该放松警惕；然而，与普通的下载和安装相比，通过\
  \ Windows 商店应用在 Windows 计算机上植入恶意程序要困难得多。\n\n## 磁盘访问\n\n桌面应用程序几乎可以随心所欲地访问磁盘，但也有少数例外。其中一个例外是，它们通常被禁止写入\
  \ `Program Files` 文件夹和其他系统文件夹。Windows 通用应用只能直接访问磁盘上的几个非常特定的位置。这些位置包括应用安装文件夹、与应用关联的\
  \ `AppData` 文件夹，以及如 `Documents` 等几个特殊文件夹。在通用应用的 .NET Framework 中，对文件和文件夹的访问也发生了移动，以确保开发者不会意外写入受限的位置。\n\
  \n为了允许用户控制文件在应用中应存储和读取的位置，Windows 为你提供了三个文件选择器（File Picker）合约：`FolderOpenPicker`、`FileOpenPicker`\
  \ 和 `FileSavePicker`。你可以从应用中使用这些选择器类来获取对本地磁盘的安全访问。\n\n正如你之前看到的，你还可以使用 `KnownFolders`\
  \ 类来访问设备上的资源。当你想要读取或写入用户必须授予应用权限后才能打开的位置时，就应该使用 `KnownFolders` 类。\n\n## 序列化、流与异步编程\n\
  \n在第 14 章中，你使用了 `[Serializable]` 属性来允许类被序列化。通用应用的 .NET 不包含此属性，但你可以改用类似的名为 `[DataContract]`\
  \ 的属性。`DataContract` 属性配合 `DataContractSerializer` 类使用，序列化类的内容。为了将序列化内容写入或读取磁盘，你需要使用某些文件访问类型，但与普通\
  \ .NET 不同，你不能直接创建它们。相反，你使用文件选择器创建流对象，然后可以使用这些对象配合 `DataContractSerializer` 来保存和加载文件。\n\
  \n下一个“尝试”（Try It Out）演示了如何使用由 `FileOpenPicker` 和 `FileSavePicker` 创建的流，配合 `DataContractSerializer`\
  \ 来加载和保存数据模型的 XML 表示形式。\n\n## 页面间的导航\n\n应用内页面之间的导航与 Web 应用程序的导航类似。你可以调用 `Navigate`\
  \ 方法从一个页面跳转到另一个页面；可以通过调用 `Back` 方法返回。接下来的“尝试”演示了如何使用三个基础页面在应用内进行跳转。\n\n## CommandBar\
  \ 控件\n\n`CommandBar` 为用户提供了与桌面应用程序中工具栏非常相似的功能，但你应该让它们保持简单得多，通常将一个栏中的可用选项限制在八项以内。\n\
  \n你可以一次性显示多个 `CommandBar`，但请记住这会让用户界面变得杂乱，你不应该为了显示更多选项而显示超过一个栏。另一方面，如果你想提供多种类型的导航，同时显示顶部和底部的栏有时是有益的。\n\
  \nVisual Studio 自带了 `CommandBar` 控件，这使得创建这种控件变得非常容易。接下来的“尝试”创建了一个带有若干标准项目的应用栏。\n\
  \n## 管理管理\n\n与桌面应用程序不同，应用必须预计随时可能被挂起（suspended）。这发生在用户切换到另一个应用或回到桌面时，这是一个所有应用都必须处理的常见场景。当应用被挂起时，Windows\
  \ 将保存你的变量和数据结构的值，并在应用恢复时恢复它们。然而，你的应用可能会被挂起很长时间，因此如果你有随时间变化的数据（例如新闻源），那么你应该在应用恢复时刷新这些内容。\n\
  \n当应用被挂起时，你还应该考虑保存任何在应用调用之间需要持久的数据，因为如果应用随后被 Windows 或用户终止，你将没有机会再次这样做。\n\n当你的应用即将被挂起时，系统会发送一个\
  \ `Suspending` 事件，你应该处理该事件。当应用重新恢复运行时，它将接收一个 `Resuming` 事件。通过处理这两个事件并保存应用状态，你可以让应用恢复到挂起之前的状态，用户不会察觉到任何异常。\n\
  \n## Windows 商店应用的常用元素\n\n所有 Windows 商店应用都应该提供自己的磁贴（Tiles）和徽章（Badges）。磁贴让你的应用在 Windows\
  \ 的开始屏幕上具有存在感，并允许你显示有关应用的信息。徽章允许 Windows 在锁屏上显示一个代表你应用的小图标。\n\n磁贴非常重要，因为用户往往是反复的，并且倾向于根据应用展示自己的来做出决定。此外，磁贴应该是易于识别的；如果你让用户在一堆磁贴中搜索一个消失的磁贴，等他们最终找到它时，心情可能已经不好了。\n\
  \nWindows 商店应用中有许多可能的磁贴尺寸，如果你的应用针对许多不同的显示尺寸，你应该为所有建议的尺寸提供定制磁贴，或者至少提供缩放良好的磁贴。如果你不提供正确尺寸的磁贴，Windows\
  \ 将把你提供的内容缩放到正确尺寸，这通常看起来很糟糕。因此，对于专业应用，请确保为每个预期的磁贴尺寸定制磁贴。\n\n徽章比磁贴小（24 × 24 像素），用于\
  \ Windows 在锁屏上显示应用时。如果你为应用设置了徽章图像，还必须启用锁屏通知。徽章也可以进行缩放，因此提供所有合适的尺寸。\n\n启动屏幕（Splash\
  \ screens）在应用加载时显示；由于这通常只需要几秒钟，它们不应该太复杂，或提供任何信息，除了明确标识哪个应用正在启动。启动屏幕的大小为 620 × 300\
  \ 像素，但你可以通过使图像部分透明来缩小它。再次，应当提供缩放版本。\n\n最后，你应该提供一个 50 × 50 像素的“商店图标”（Store Logo），当然还有它的缩放版本。\n\
  \n磁贴、徽章和图标嵌入在应用的包清单文件中，可以通过 Visual Studio 的清单包编辑器进行轻松编辑。如果你下载了此书的代码，可以使用代码中提供的磁贴和徽章（在\
  \ `Assets` 文件夹中），否则你可以在画图或其他类似的应用程序中快速创建这些图像。\n\n\n\n\n\n*   **Application（应用）：**\
  \ 为你的应用起个好名字！配合商店图标一起，这可能是潜在用户关于你的应用看到的第一内容，因此使用通用的名称是无效的。尝试选择一个有趣且指示应用用途的名称。\n\
  *   **Visual Assets（视觉资源）：** 在上一个示例中，你为应用添加了磁贴。你应该确保 `Visual Assets` 标签页上的每个类别至少有一张图像。\n\
  *   **Capabilities（功能）：** 在此标签页上，你可以指定应用所需的哪些功能。请注意，如果应用所需的功能看起来不合理，用户将怀疑地查看你的应用。例如，如果你需要访问设备上的聊天消息，最好有一个充分的理由；否则这可能被视为对隐私的潜在侵害。大多数应用不应超过几个功能，但你必须选取所有你用到的功能。如果你没有准确指定需求，那么应用在尝试访问资源时将收到\
  \ `access denied exception`。\n*   **Declarations（声明）：** 在 `Declarations` 标签页上，你可以将应用注册为服务提供者。例如，如果你的应用作为搜索提供者工作，你就可以向应用添加此声明并指定所需的属性。\n\
  *   **Content URIs（内容 URI）：** 如果你的应用导航到远程页面，它对系统的访问将受到。你可以使用 `Content URIs` 让网页获得地理位置设备和剪贴板的访问。\n\
  *   **Packaging（打包）：** 在此标签页上，你可以设置包的属性，包括开发者/发布者名称、应用版本以及用于签名包的证书。\n\n### 创建包 (Creating\
  \ the Package)\n\n一旦你在 `appxmanifest` 中指定了所有需要的内容，就可以打包你的应用了。你可以直接在 Visual Studio\
  \ 中选择 `Create App Packages` 来完成。这将启动 `Create App Packages` 向导。在向导的几步之后，你将被要求使用商店账户登录。如果你没有账户，必须创建一个。你必须拥有商店账户才能发布到应用商店并从你的应用中获。\n\
  \n在向导的某个阶段，你将看到 `Select and Configure Packages` 页面。在这里，重要的是选择三个目标架构（`x86`、`x64`\
  \ 和 `ARM`），以便应用部署到最广泛的设备上。\n\n在最后一个页面，你将获得有关验证应用是否可以提交到商店的选项。启动 `Windows App Certification\
  \ Kit` 并了解你的应用是否准备好提交。如果检测到任何问题，你必须修复它们并再次通过 `Create App Packages` 向导。如果你的应用通过检查，你就可以上传包。\n\
