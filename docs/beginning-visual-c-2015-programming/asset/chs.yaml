  \ `IaaS`、`PaaS` 或 `SaaS` 服务模型上。 |\n| 定义云优化栈 | 云优化栈是一个概念，指能够处理高吞吐量、占用资源较小、可以在同一台服务器上与其他应用程序并行运行并且支持跨平台的代码。\
