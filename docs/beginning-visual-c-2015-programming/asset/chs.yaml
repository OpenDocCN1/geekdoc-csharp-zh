  \n## 选择节点\n\n你现在已经了解了如何在 XML 文档中来回移动、如何操作文档的值、如何创建新节点，以及如何再次删除它们。本节只剩下一件事：如何在不遍历整个树结构的情况下选择节点。\n\
  \n`XmlNode` 类包含两个方法，在表 19.7 中描述，它们通常用于从文档中选择节点，而无需遍历文档中的每个节点：`SelectSingleNode`\
