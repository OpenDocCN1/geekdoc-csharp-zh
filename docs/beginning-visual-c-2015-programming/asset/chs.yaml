  ## 定义类\n\n### 对象与类\n对象是 OOP 程序的构建模块。类是类型定义，用于实例化化对象。对象可以包含数据和/或暴露其他代码可以使用的操作。数据可以通过属性（properties）提供给外部代码，操作可以通过方法（methods）提供给外部代码。属性和方法统称为类成员。属性允许读取访问、写入访问或两者兼有。类成员可以是公共（public，对所有代码可见）或私有的（private，仅对类定义内部的代码可见）。在\
  \ .NET 中，一切都是对象。\n\n### 对象生命周期\n对象通过调用其一个构造函数来实例化。当对象不再需要时，通过执行其析构函数来销毁。为了对对象进行清理，通常需要手动对其进行释放（dispose）。\n\
  \n### 静态成员与实例成员\n实例成员仅对类的对象实例可用。静态成员仅直接通过类定义可用，并且不与特定实例关联。\n\n### 接口\n接口是公共属性和方法的集合，可以在类上实现。实例类型的变量可以被赋值为任何类定义实现了该接口的对象的值。此时，只有接口定义的成员可以通过该变量访问。\n\
  \n### 继承\n继承允许一个类定义派生自另一个类的机制。类继承其父类的成员，且只能有一个父类。子类无法访问父类的私有成员，但可以定义保护（protected）成员，该成员仅在该类或派生该该类的可用。子类可以重写父类中定义为虚（virtual）的成员。所有类都有继承链，并结束于\
  \ `System.Object`，它在 C# 中有一个别名为 `object`。\n\n### 多态\n所有从派生类实例化的对象都可以被视为父类的实例。\n\n\
  ### 对象关系与特性\n对象可以包含其他对象，也可以代表其他对象的集合。在表达式中操作对象时，通常需要通过运算符重载（operator overloading）定义运算符如何与对象工作。对象可以暴露由于某些内部过程触发的事件，客户端代码可以通过提供事件处理器来响应事件。\n\
  \n## 本章 Wrox.com 代码下载\n\n你可以在 [`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 的“Download Code”选项卡中找到本章的 [`wrox.com`](http://wrox.com) 代码下载。代码位于第 9 章 下载中，并根据全章中的名称单独命名。\n\
  \n在第 8 章中，你查看了面向对象编程（OOP）的特性。在本章中，你把理论付实践并在 C# 中定义类。在本章中，你不会定义类成员，但你将集中于类定义本身。\n\
  \n首先，你将探索基本的类定义语法、用于确定类访问性的关键字等，以及指定继承的方法。你还将查看接口定义，因为它们在许多方面与类定义相似。\n\n本章的其余部分涵盖了在\
  \ C# 中定义类时相关的各种主题。\n\n## C# 中的类定义\n\nC# 使用 `class` 关键字来定义类：\n\n```csharp\nclass\
  \ MyClass\n{\n   // 类成员。\n}\n```\n\n这段代码定义了一个名为 `MyClass` 的类。一旦你定义了一个类，你可以在项目中任何可以访问该定义的地方自由实例化它。默认情况下，类被声明为\
  \ `internal`，这意味着只有当前项目中的代码可以访问它们。你可以如下使用 `internal` 访问修饰符关键字显式指定（尽管你没必要这样做）：\n\n\
  ```csharp\ninternal class MyClass\n{\n   // 类成员。\n}\n```\n\n或者，你可以指定该类是公共的（public），并且也应该被其他项目的代码访问。为此，你使用\
  \ `public` 关键字：\n\n```csharp\npublic class MyClass\n{\n   // 类成员。\n}\n```\n\n除了这两个访问修饰符关键字外，你还可以指定类是抽象的（abstract，不能实例化，只能被继承，并且可以有抽象成员）或密封的（sealed，不能被继承）。要实现这一点，你使用两个互斥关键字之一：`abstract`\
  \ 或 `sealed`。抽象类的声明方式如下：\n\n```csharp\npublic abstract class MyClass\n{\n   // 类成员，可以是抽象的。\n\
  }\n```\n\n在这里，`MyClass` 是一个公共抽象类，而内部抽象类也是可能的。\n\n密封类的声明如下：\n\n```csharp\npublic\
  \ sealed class MyClass\n{\n   // 类成员。\n}\n```\n\n与抽象类一样，密封类可以是公共的或内部的。\n\n继承也可以在类定义中指定。你只需要在类名后跟一个冒号，然后是基类名：\n\
  \n```csharp\npublic class MyClass : MyBase\n{\n   // 类成员。\n}\n```\n\nC# 类定义中只允许一个基类；如果你继承自一个抽象类，你必须实现所有继承的抽象成员（除非派生类本身也是抽象的）。\n\
  \n编译器不允许派生类的访问级别比其基类更高。这意味着内部类可以继承一个公共基类，但公共类不能继承自一个内部基类。这段代码是合法的：\n\n```csharp\n\
  public class MyBase\n{\n   // 类成员。\n}\ninternal class MyClass : MyBase\n{\n   //\
  \ 类成员。\n}\n```\n\n以下代码将无法编译：\n\n```csharp\ninternal class MyBase\n{\n   // 类成员。\n\
  }\npublic class MyClass : MyBase\n{\n   // 类成员。\n}\n```\n\n如果没有使用基类，类仅继承自基类 `System.Object`（它在\
  \ C# 中别名为 `object`）。最终，所有类的继承层次结构根部都是 `System.Object`。稍后我们将详细查看这个基础类。\n\n除了以这种方式指定基类外，你还可以在后面指定接口。如果指定了基类，它必须是冒号后的第一个；如果没有指定基类，则直接在冒号后指定接口。使用逗号分隔基类名（如果有）和接口名称。\n\
  \n例如，你可以如下为 `MyClass` 添加一个接口：\n\n```csharp\npublic class MyClass : IMyInterface\n\
  {\n   // 类成员。\n}\n```\n\n支持接口的任何类都必须实现所有接口成员，如果你不想对某个接口成员执行任何操作，也可以提供“空”实现（无功能代码），并且可以在抽象类中将接口实现为抽象。\n\
  \n以下声明是无效的，因为基类 `MyBase` 不是继承列表中的第一个：\n\n```csharp\npublic class MyClass : IMyInterface,\
  \ MyBase\n{\n   // 类成员。\n}\n```\n\n指定基类和接口的方法如下：\n\n```csharp\npublic class MyClass\
  \ : MyBase, IMyInterface\n{\n   // 类成员。\n}\n```\n\n记住可以实现多个接口，因此以下也是有效的：\n\n```csharp\n\
  public class MyClass : MyBase, IMyInterface, IMySecondInterface\n{\n   // 类成员。\n\
  }\n```\n\n表 9.1](#c09.xhtml_c09-tbl-0001) 显示了类定义允许的访问修饰符组合。\n\n| **修饰符** | **描述**\
  \ |\n| :--- | :--- |\n| 无或 `internal` | 类仅对当前项目可见 |\n| `public` | 类从处处可见 |\n\n\n\
  \n\n\n| `abstract` 或 `internal` `abstract` | 类仅可从当前项目内部访问，无法实例化，只能被派生 |\n| `public`\
  \ `abstract` | 类可以从任何地方访问，无法实例化，只能被派生 |\n| `sealed` 或 `internal` `sealed` | 类仅可从当前项目内部访问，不能派生，只能实例化\
  \ |\n| `public` `sealed` | 类可以从任何地方访问，不能派生，只能实例化 |\n\n表 9.1 类定义中的访问修饰符\n\n### 接口定义\n\
  \n接口的声明方式与类类似，但使用的是 `interface` 关键字而不是 `class`：\n\n```csharp\ninterface IMyInterface\n\
  {\n   // 接口成员。\n}\n```\n\n访问修饰符关键字 `public` 和 `internal` 的用法相同；且与类一样，接口默认定义为 `internal`。要让接口可以公开访问，你必须使用\
  \ `public` 关键字：\n\n```csharp\npublic interface IMyInterface\n{\n   // 接口成员。\n}\n\
  ```\n\n关键字 `abstract` 和 `sealed` 是不允许的，因为这两个修饰符在接口的上下文中没有意义（接口不包含实现，因此无法被直接实例化，且它们必须是可继承的才有用）。\n\
  \n接口继承的指定方式也与类继承类似。这里的主要区别是可以使用多个基接口，如下：\n\n```csharp\npublic interface IMyInterface\
  \ : IMyBaseInterface, IMyBaseInterface2\n{\n   // 接口成员。\n}\n```\n\n接口不是类，因此它们不继承自\
  \ `System.Object`。然而，`System.Object` 的成员可以通过接口类型变量来访问，这完全是为了方便。此外，正如前面讨论过的，无法以与类相同的方式实例化接口。接下来的“尝试一下”（Try\
  \ It Out）提供了一些类定义的示例，以及使用这些类的代码。\n\n### System.Object\n\n由于所有类都继承自 `System.Object`，因此所有类都可以访问该类的受保护（protected）和公共（public）成员。因此，值得查看一下其中可用的内容。`System.Object`\
  \ 包含了表 9.2 中描述的方法。\n\n| **方法** | **返回类型** | **虚 (Virtual)** | **静态 (Static)** |\
  \ **描述** |\n| :--- | :--- | :--- | :--- | :--- |\n| `Object()` |/无 | 否 | 否 | `System.Object`\
  \ 类型的构造函数。由派生类型的构造函数自动调用。 |\n| `˜Object()`（也称为 `Finalize()` —— 下一节） |/无 | 否 | 否\
  \ | `System.Object` 类型的析构函数。由派生类型的析构函数自动调用；不能手动调用。 |\n| `Equals(object)` | `bool`\
  \ | 是 | 否 | 比较调用此方法的对象的另一个对象，如果它们相等则返回 `true`。默认实现检查对象参数是否指向同一个对象（因为对象是引用类型）。如果你想以不同的方式比较对象（例如，比较两个对象的状态），可以重写此方法。\
  \ |\n| `Equals(object, object)` | `bool` | 否 | 是 | 比较传递它的两个对象并检查它们是否相等。此检查使用 `Equals(object)`\
  \ 方法执行。如果两个对象都是空引用，则此方法返回 `true`。 |\n| `ReferenceEquals(object, object)` | `bool`\
  \ | 否 | 是 | 比较传递它的两个对象并检查它们是否引用同一个实例。 |\n| `ToString()` | `string` | 是 | 否 | 返回一个与对象实例对应的字符串。默认情况下，这是类类型的限定名称，但可以重写它以提供与类类型合适的实现。\
  \ |\n| `MemberwiseClone()` | `object` | 否 | 否 | 通过创建新对象实例并复制成员来复制对象。这种成员复制不会导致这些成员的新实例。新对象的任何引用类型成员都指向与原始类相同的对象。此方法是受保护的，因此只能在类内部或从派生类中使用。\
  \ |\n| `GetType()` | `System.Type` | 否 | 否 | 以 `System.Type` 对象的形式返回对象的类型。 |\n|\
  \ `GetHashCode()` | `int` | 是 | 否 | 在需要的地方用作对象的哈希函数。哈希函数返回一个以某种压缩形式标识对象状态的值。 |\n\
  \n表 9.2 System.Object 方法\n\n这些是 .NET Framework 对象类型必须支持的基本方法，尽管你可能永远不会使用其中某些（或者你只在特殊情况下使用，例如\
  \ `GetHashCode()`）。\n\n在使用多态时，`GetType()` 很有用，因为它允许你根据对象的类型对对象执行不同的操作，而不是像通常那样对所有对象执行相同的操作。例如，如果你有一个接受\
  \ `object` 类型参数的函数（这意味着你可以传递几乎任何内容），当遇到某些对象时可能会执行额外的任务。通过结合使用 `GetType()` 和 `typeof`（一种\
  \ C# 运算符，将类名转换为 `System.Type` 对象），你可以执行如下的比较：\n\n```csharp\nif (myObj.GetType()\
  \ == typeof(MyClass))\n{\n   // myObj 是 MyClass 的实例。\n}\n```\n\n`System.Type` 对象的功能更多，但这里只涵盖这些。\n\
  \n### 构造函数和析构函数\n\n在 C# 中定义类时，通常不需要定义相关的构造函数和析构函数，因为如果不定义，编译器会为你添加。但是，如果需要，你可以提供自己的，分别用于初始化和清理对象。\n\
  \n你可以使用以下语法为类添加简单的构造函数：\n\n```csharp\nclass MyClass\n{\n   public MyClass()\n  \
  \ {\n      // 构造函数代码。\n   }\n}\n```\n\n此构造函数与包含它的类同名，没有参数（使其成为默认构造函数并且是公共的，因此可以使用它可以实例化（更多信息请参见第\
  \ 8 章）。\n\n你还可以使用有默认构造函数，这意味着无法使用此构造函数创建类实例（再次参见第 8 章中的讨论）：\n\n```csharp\nclass\
  \ MyClass\n{\n   private MyClass()\n   {\n      // 构造函数代码。\n   }\n}\n```\n\n最后，你可以类似地为类添加非默认构造函数，只需提供参数：\n\
  \n```csharp\nclass MyClass\n{\n   public MyClass()\n   {\n      // 默认构造函数代码。\n \
  \  }\n   public MyClass(int myInt)\n   {\n      // 非默认构造函数代码（使用 myInt）。\n   }\n\
  }\n```\n\n你可以提供无限数量的构造函数（直到内存耗尽或没有不同的参数集，所以“几乎无限”可能更准确）。\n\n析构函数的声明语法略有不同。.NET 中使用的（由\
  \ `System.Object` 类提供的）析构函数称为 `Finalize()`，但这不是你声明析构函数时使用的名称。与其重写 `Finalize()`，不如使用以下语法：\n\
  \n```csharp\nclass MyClass\n{\n   ˜MyClass()\n   {\n      // 析构函数体。\n   }\n}\n```\n\
  \n\n\n\n因此，类的析构函数是通过类名声明的（与构造函数一样），并带有波浪号（`˜`）前。析构函数中的代码会在垃圾回收时执行，允许你释放资源。析构函数被调用后，还会隐式地调用基类的析构函数，包括对根类\
  \ `System.Object` 中 `Finalize()` 的调用。这种技术使得 .NET Framework 能够确保这种情况的发生，因为重写 `Finalize()`\
  \ 意味着需要显式地执行基类调用，这具有潜在的危险（你将在下一章中学习如何调用基类方法）。\n\n### 构造函数的执行顺序\n\n如果你在类的构造函数中执行了多个任务，那么将这些代码集中在一个地方会非常方便，这与将代码拆分为函数具有相同的处，如第\
  \ 6 章所示。你可以使用方法来实现这一点（参见第 10 章），但 C# 提供了一个极佳的替代方案。你可以配置任何构造函数在执行其自己的代码之前调用其他构造函数。\n\
  \n不过，你首先需要仔细观察实例化类实例时默认会发生什么。除了前面提到的有助于初始化代码的集中化外，这本身也值得了解。在开发过程中，对象的行为往往由于构造函数调用过程中的错误而并不符合你的预期——通常是你的类继承层次结构中的某个基类没有被正确实例化，或者没有向基类构造函数提供正确的信息。理解对象生命周期中这一阶段发生了什么，可以更容易地解决这类问题。\n\
  \n要实例化派生类，必须先实例化它的基类。要实例化这个基类，必须实例化它自己的基类，以此类推，直到 `System.Object`（所有类的根）。因此，无论你使用哪个构造函数来实例化类，`System.Object.Object()`\
  \ 总是第一个运行。\n\n无论你在派生类中使用哪个构造函数（默认构造函数或非默认构造函数），除非另有指定，否则将使用基类的默认构造函数。（很快就会看到如何更改这种行为。）这里有一个说明执行顺序的短示例。考虑以下对象层次结构：\n\
  \n```\npublic class MyBaseClass\n{\n   public MyBaseClass()\n   {\n   }\n   public\
  \ MyBaseClass(int i)\n   {\n   }\n}\npublic class MyDerivedClass : MyBaseClass\n\
  {\n   public MyDerivedClass()\n   {\n   }\n   public MyDerivedClass(int i)\n   {\n\
  \   }\n   public MyDerivedClass(int i, int j)\n   {\n   }\n}\n```\n\n你可以如下方式实例化\
  \ `MyDerivedClass`：\n\n```\nMyDerivedClass myObj = new MyDerivedClass();\n```\n\n\
  在这种情况下，将发生以下事件序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass()`\
  \ 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass()` 构造函数将执行。\n\n或者，你可以使用：\n\n```\nMyDerivedClass\
  \ myObj = new MyDerivedClass(4);\n```\n\n顺序如下：\n\n* `System.Object.Object()` 构造函数将执行。\n\
  * `MyBaseClass.MyBaseClass()` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int i)`\
  \ 构造函数将执行。\n\n最后，你可以使用：\n\n```\nMyDerivedClass myObj = new MyDerivedClass(4, 8);\n\
  ```\n\n结果是以下序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass()`\
  \ 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数将执行。\n\n该系统在大多数情况下运行良好，但有时你可能希望对发生的事件有更多的控制权。例如，在最后一个实例化示例中，你可能希望有以下序列：\n\
  \n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int i)` 构造函数将执行。\n\
  * `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数将执行。\n\n使用这个序列，你可以将使用 `int i`\
  \ 参数的代码放在 `MyBaseClass(int i)` 中，这意味着 `MyDerivedClass(int i, int j)` 构造函数需要做的工作就会少一些——它只需要处理\
  \ `int j` 参数。（这假设 `int i` 参数在两种情况下具有相同的含义，这并不总是如此的；但在实践中，通过这种安排，通常是成立的。）如果你愿意，C#\
  \ 允许你指定这种行为。\n\n要做到这一点，你可以使用构造函数初始化器，它由放置在方法定义中冒号后面的代码组成。例如，你可以在派生类的构造函数定义中指定使用的基类构造函数，如下：\n\
  \n```\npublic class MyDerivedClass : MyBaseClass\n{\n   …\n   public MyDerivedClass(int\
  \ i, int j) : base(i)\n   {\n   }\n}\n```\n\n`base` 关键字引导 .NET 实例化过程使用具有指定参数的基类构造函数。在这里，你使用单个\
  \ `base` 关键字来指定基类。除了这个 `base` 关键字，你还可以使用另一个关键字作为构造函数初始化器：`this`。该关键字指示 .NET 实例化过程在调用指定的构造函数之前使用当前类上的非默认构造函数：\n\
  \n```\npublic class MyDerivedClass : MyBaseClass\n{\n   public MyDerivedClass()\
  \ : this(5, 6)\n   {\n   }\n   …\n   public MyDerivedClass(int i, int j) : base(i)\n\
  \   {\n   }\n}\n```\n\n在这里，使用 `this` 关键字.MyDerivedClass()` 会给你以下序列：\n\n* `System.Object.Object()`\
  \ 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int i)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int\
  \ i, int j)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass()` 构造函数将执行。\n\n这里的唯一限制是你可以使用构造函数初始化器指定一个构造函数。然而，正如最后所示，这并不是很大的限制，因为你仍然可以构建复杂的执行序列。\n\
  \n在定义构造函数时，要小心不要创建无限循环。例如，考虑以下代码：\n\n```\npublic class MyBaseClass\n{\n   public\
  \ MyBaseClass() : this(5)\n   {\n   }\n   public MyBaseClass(int i) : this()\n \
  \  {\n   }\n}\n```\n\n使用这些构造函数中的任何一个都需要另一个先执行，而后者又需要另一个先执行，以此此类推。这段代码可以编译，但如果你尝试实例化\
  \ `MyBaseClass`，将收到 `SystemOverflowException`。\n\n## Visual Studio 中的 OOP 工具\n\n\
  由于 OOP 是 .NET Framework 的一个如此基本的方面，Visual Studio 提供了几个工具来帮助开发 OOP 应用。本节将介绍其中一些工具。\n\
  \n### 类视图窗口\n\n\n\n\n在第 2 章中，你看到`Solution Explorer`窗口与名为`Class View`（类视图）的窗口共享空间。此窗口显示了应用程序的类层次结构，让你能够一目了然所使用的类的特征。图\
