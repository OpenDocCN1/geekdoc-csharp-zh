  \ |\n\n# 第 4 章\n\n## 控制\n\n## Wrox.com 本章代码下载\n\n你可以在 [`wrox.com`](http://wrox.com)\
  \ 下载代码选项卡中的 [`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 找到本章的代码。代码位于第 4 章 下载包中，并根据章节中的名称单独命名。\n\n\n\n\n上一章引入的 `bool` 类型只能包含两个值之一：`true`\
  \ 或 `false`。这种类型通常用于记录某些操作的结果，以便你能够根据该结果采取行动。特别是，`bool` 类型被用于存储 `comparison`（比较）的结果。\n\
  \n例如，考虑下述中（在章节引言中提到过）的情况：你想要根据变量 `myVal` 是否小于 10 来执行代码。为了做到这一点，你需要某种指示来标明“`myVal`\
  \ 小于 10”这一语句是 `true` 还是 `false`——也就是说，你需要知道比较的布尔结果。\n\n布尔比较需要使用布尔 `comparison operators`（比较运算符，也称为\
  \ `relational operators`），如表 4.1 布尔比较运算符\n\n在表 4.1 中的所有情况下，`var1` 都是 `bool` 类型变量，而\
  \ `var2` 和 `var3` 的类型可能有所不同。\n\n你可以在代码对对数值使用此类运算符：\n\n```c\nbool isLessThan10;\n\
  isLessThan10 = myVal < 10;\n```\n\n上述代码的结果是：如果 `myVal` 存储的值小于 10，则给 `isLessThan10`\
  \ 赋值 `true`；否则赋值为 `false`。\n\n你也可以在其他类型上使用这些比较运算符，例如字符串：\n\n```c\nbool isBenjamin;\n\
  isBenjamin = myString == \"Benjamin\";\n```\n\n在这里，只有当 `myString` 存储字符串 `\"Benjamin\"\
  ` 时，`isBenjamin` 才为 `true`。\n\n你还可以将变量与布尔值进行比较：\n\n```c\nbool isTrue;\nisTrue =\
  \ myBool == true;\n```\n\n在这里，你仅限于使用 `==` 和 `!=` 运算符。\n\n`&` 和 `|` 运算符还有两个类似的运算符，被称为\
  \ `conditional Boolean`（条件布尔）运算符，如表 4.2 条件布尔运算符\n\n这些运算符的结果与 `&` 和 `|` 完全相同，但获取该结果的方式有一个重要区别，这可以带来更好的性能。这两个运算符都会查看其第一个操作数的值（表\
  \ 4.2 中的 `var2`），并根据该操作数的值，可能完全不需要处理第二个操作数（表 4.2 中的 `var3`）。\n\n如果 `&&` 运算符的第一个操作数的值为\
  \ `false`，则没有必要考虑第二个操作数的值，因为结果将是 `false`。同样，如果 `||` 运算符的第一个操作数为 `true`，则它返回 `true`，无论第二个操作数的值如何。\n\
  \n### 布尔位运算和赋值运算符\n\n布尔比较可以通过结合布尔位运算和赋值运算符来实现赋值。`&` 和 `|` 运算符还有两个类似的运算符，被称为 `conditional\
  \ Boolean`（条件布尔）运算符，如表 4.2 所示。\n\n| 运算符 | 类别 | 示例表达式 | 结果 |\n| :--- | :--- | :---\
  \ | :--- |\n| `&&` | 二元 | `var1 = var2 && var3;` | 如果 `var2` 和 `var3` 均为 `true`，则给\
  \ `var1` 赋值 `true`；否则为 `false`。（逻辑“与”） |\n| `||` | 二元 | `var1 = var2 || var3;` |\
  \ 如果 `var2` 或 `var3`（或两者）为 `true`，则给 `var1` 赋值 `true`；否则为 `false`。（逻辑“或”） |\n\n\
  表 4.2 条件布尔运算符\n\n这些运算符的结果与 `&` 和 `|` 完全相同，但获取该结果的方式有一个重要区别，这可以带来更好的性能。这两个运算符都会查看其第一个操作数的值（表\
  \ 4.2 中的 `var2`），并根据该操作数的值，可能完全不需要处理第二个操作数（表 4.2 中的 `var3`）。\n\n如果 `&&` 运算符的第一个操作数的值为\
  \ `false`，则没有必要考虑第二个操作数的值，因为结果将是 `false`。同样，`||` 运算符的第一个操作数为 `true`，则它返回 `true`，无论第二个操作数的值如何。\n\
  \n### 布尔位运算和赋值运算符\n\n布尔比较可以通过结合布尔位运算和赋值运算符来实现赋值。`&` 和 `|` 运算符还有两个类似的运算符，被称为 `conditional\
  \ Boolean`（条件布尔）运算符，如表 4.2 条件布尔运算符\n\n这些运算符的结果与 `&` 和 `|` 完全相同，但获取该结果的方式有一个重要区别，这可以带来更好的性能。这两个运算符都会查看其第一个操作数的值（表\
  \ 4.2 中的 `var2`），并根据该操作数的值，可能完全不需要处理第二个操作数（表 4.2 中的 `var3`）。\n\n### 分支\n\n分支是控制下一步执行哪行代码的行为。要跳转的行由某种条件语句控制。这种条件语句基于测试值与一个或多个值之间的布尔逻辑。\n\
  \n本节介绍了 C# 中的三种分支技术：\n\n*   三元运算符\n\n*   `if` 语句\n\n*   `switch` 语句\n\n### 三元运算符\n\
  \n执行比较的最简单方法是使用上一章提到的三元（或条件）运算符。你已经见过作用于一个操作数的一元运算符以及作用于两个操作数的二元运算符，因此该运算符作用于三个操作数并不意外。语法如下：\n\
  \n```c\n<test> ? <resultIfTrue>: <resultIfFalse>\n```\n\n在这里`<test>` 被计算以获得一个布尔值，根据该值，运算符的结果为\
  \ `<resultIfTrue>` 或 `<resultIfFalse>`。\n\n你可能会如下所示对名为 `myInteger` 的 `int` 变量进行测试：\n\
  \n\n\n\n\n```cs\nstring resultString = (myInteger < 10) ? \"Less than 10\"\n   \
  \                               : \"Greater than or equal to 10\";\n```\n\n三元运算符的结果是两个字符串之一，这两个字符串都可以赋值给\
  \ `resultString`。赋值哪一个字符串是通过比较 `myInteger` 的值与 10 来决定的。在这种情况下，小于 10 的值会导致赋值第一个字符串，而大于或等于\
  \ 10 的值会导致赋值第二个字符串。例如，如果 `myInteger` 等于 `4`，则 `resultString` 将被赋值字符串 `Less` `than`\
  \ `10`。\n\n### if 语句\n\n`if` 语句是一种功能多得多且实用的决策方式。与 `?:` 语句不同，`if` 语句没有结果（因此你不能将它们用于赋值）；相反，你使用该语句来条件条件执行其他语句。\n\
  \n`if` 语句最简单的用法如下，其中 `<test>` 被求值（它必须求值为布尔值才能通过编译），如果 `<test>` 结果为 `true`，则执行语句随后的代码行：\n\
  \n```\nif (<test>)\n   <code executed if <test> is true>;\n```\n\n在执行此代码后，或者由于 `<test>`\
  \ 求值为 `false` 而未执行，程序执行将从下一行代码继续进行。\n\n你还可以使用 `else` 语句结合 `if` 语句来指定额外的代码。当 `<test>`\
  \ 求值为 `false` 时，执行该语句：\n\n```\nif (<test>)\n   <code executed if <test> is true>;\n\
  else\n   <code executed if <test> is false>;\n```\n\n代码的两个部分都可以使用大括号块来跨越多行：\n\n\
  ```\nif (<test>)\n{\n   <code executed if <test> is true>;\n}\nelse\n{\n   <code\
  \ executed if <test> is false>;\n}\n```\n\n作为一个快速示例，你可以重写上一节中使用三元运算符的代码：\n\n```cs\n\
  string resultString = (myInteger < 10) ? \"Less than 10\"\n                    \
  \              : \"Greater than or equal to 10\";\n```\n\n由于 `if` 语句的结果不能赋值给变量，你必须在单独的步骤中为变量赋值：\n\
  \n```cs\nstring resultString;\nif (myInteger < 10)\n   resultString = \"Less than\
  \ 10\";\nelse\n   resultString = \"Greater than or equal to 10\";\n```\n\n这样的代码虽然更冗长，但比等效的三元形式更易阅读和理解，并提供了更大的灵活性。\n\
  \n下面的“Try It Out”演示了 `if` 语句的用法。\n\n#### 使用 if 语句检查更多条件\n\n在前面的示例中，你检查了涉及 `var1`\
  \ 值的三个条件。这涵盖了该变量的所有可能取值。有时，你可能想要检查特定的值——例如，如果 `var1` 等于 1、2、3 或 4 等。使用像前面的代码会导致令人烦恼的嵌套代码：\n\
  \n```cs\nif (var1 == 1)\n{\n   // Do something.\n}\nelse\n{\n   if (var1 == 2)\n\
  \   {\n      // Do something else.\n   }\n   else\n   {\n      if (var1 == 3 ||\
  \ var1 == 4)\n      {\n         // Do something else.\n      }\n      else\n   \
  \   {\n         // Do something else.\n      }\n   }\n}\n```\n\n在这些情况下，考虑使用稍微不同的缩进方案并压缩\
  \ `else` 块的代码部分（即在 `else` 块之后使用单行代码，而不是代码块）。这样，你就会得到一个包含 `else` `if` 语句的结构：\n\n\
  ```cs\nif (var1 == 1)\n{\n   // Do something.\n}\nelse if (var1 == 2)\n{\n   //\
  \ Do something else.\n}\nelse if (var1 == 3 || var1 == 4)\n{\n   // Do something\
  \ else.\n}\nelse\n{\n   // Do something else.\n}\n```\n\n这些 `else` `if` 语句实际上是两个独立的语句，代码在功能上与之前的代码相同，但更易读。在进行此类多次比较时，可以考虑使用\
  \ `switch` 语句作为另一种分支结构。\n\n### switch 语句\n\n`switch` 语句与 `if` 语句相似，它们根据测试的值有条件地执行代码。然而，`switch`\
  \ 允许你一次性测试测试变量的多个值，而不仅仅是单个条件。这种测试限于离散值，而不是“大于 X”之类的子句，因此它的用法略有不同；但是，它可以是一项强大的技术。\n\
  \n`switch` 语句的 기본结构如下：\n\n```cs\nswitch (<testVar>)\n{\n   case <comparisonVal1>:\n\
  \      <code to execute if <testVar> == <comparisonVal1> >\n      break;\n   case\
  \ <comparisonVal2>:\n      <code to execute if <testVar> == <comparisonVal2> >\n\
  \      break;\n   …\n   case <comparisonValN>:\n      <code to execute if <testVar>\
  \ == <comparisonValN> >\n      break;\n   default:\n      <code to execute if <testVar>\
  \ != comparisonVals>\n      break;\n}\n```\n\n`<testVar>` 中的值与每个 `<comparisonValX>`\
  \ 值（通过 `case` 语句指定）进行比较。如果有匹配，则执行为该匹配提供的代码。如果没有匹配，如果存在 `default` 块，则执行 `default`\
  \ 部分中的代码。\n\n在完成每个部分的代码后，你还有一个额外的命令 `break`。在处理一个 `case` 块后，执行流到达第二个 `case` 语句是违法的。\n\
  \n这里的 `break` 语句简单地终止 `switch` 语句，并在结构后的语句上继续处理。\n\n在 C# 代码中，有其他方法可以防止流从一个 `case`\
  \ 语句流到下一个。你可以使用 `return` 语句，这会导致当前函数的终止，而不仅仅是 `switch` 结构（更多信息请参见第 6 章），或使用 `goto`\
  \ 语句。`goto` 语句（如前文所述）在这里有效，是因为 `case` 语句在 C# 代码中实际上定义了标签。这里有一个示例：\n\n```cs\nswitch\
  \ (<testVar>)\n{\n   case <comparisonVal1>:\n      goto comparisonVal2;\n   case\
  \ <comparisonVal2>:\n      <code to execute if <testVar> == <comparisonVal2> >\n\
  \      break;\n   …\n}\n```\n\n这是 case 语句不能自由运行到下一个规则的唯一例外：如果你将多个 `case` 语句放在一起（*堆叠*它们）并在单个代码块之前，那么你实际上是一次检查多个条件。如果满足这些条件中的任何一个，就会执行代码。这里有一个示例：\n\
  \n```cs\nswitch (<testVar>)\n{\n   case <comparisonVal1>:\n   case <comparisonVal2>:\n\
  \      <code to execute if <testVar> == <comparisonVal1> or\n                  \
  \        <testVar> == <comparisonVal2> >\n      break;\n   …\n}\n```\n\n这些条件也适用于\
  \ `default` 语句。没有规定该语句必须是列表中的最后一个，你可以根据需要与 `case` 语句堆叠。添加 `break` 或 `return` 断点可以确保在所有情况下都有有效的执行路径。\n\
  \n下面的“Try It Out”使用 `switch` 语句根据你输入的测试字符串向控制台写入不同的字符串。\n\n### while 循环\n\n`while`\
  \ 循环与 `do` 循环非常相似，但有一个重要的区别：`while` 循环中的布尔测试发生在循环的开始，而不是结束。如果测试结果为 `false`，则循环永远不会执行。相反，程序执行将直接跳转到循环后的代码。\n\
  \n以下是 `while` 循环的指定方式：\n\n```\nwhile (<Test>)\n{\n   <code to be looped>\n}\n```\n\
  \n它们几乎可以以与 `do` 循环相同的方式使用：\n\n```cs\nint i = 1;\nwhile (i <= 10)\n{\n   WriteLine($\"\
  {i++}\");\n}\n```\n\n此代码与早期显示的 `do` 循环结果相同；它列输出数字 1 到 10。下面的“Try It Out”演示了如何修改上一个示例以使用\
  \ `while` 循环。\n\n### for 循环\n\n\n\n\n\n本章介绍的最后一种循环是 `for` 循环。这种类型的循环执行固定次数次数，并维护它自己的计数器。要定义一个\
  \ `for` 循环，你需要以下信息：\n\n*   用于初始化计数器变量的起始值\n*   用于继续循环的条件（涉及计数器变量）\n*   在每个循环周期结束时对计数器变量执行的操作\n\
  \n例如，如果你想要一个计数器从 1 递增到 10 步长为 1 的循环，那么起始值为 1；条件是计数器小于或等于 10；在每个周期结束时执行的操作是将计数器加\
  \ 1。\n\n这些信息必须如下所示放入 `for` 循环的结构中：\n\n```\nfor (<initialization>; <condition>; <operation>)\n\
  {\n   <code to loop>\n}\n```\n\n它的工作原理与下面的 `while` 循环完全相同：\n\n```\n<initialization>\n\
  while (<condition>)\n{\n   <code to loop>\n   <operation>\n}\n```\n\n之前，你使用 `do`\
  \ 和 `while` 循环来写出从 1 到 10 的数字。后续代码展示了使用 `for` 循环实现此操作所需的：\n\n```\nint i;\nfor (i\
  \ = 1; i <= 10; ++i)\n{\n   WriteLine($\"{i}\");\n}\n```\n\n计数器变量是一个名为 `i` 的整数，初始值为\
  \ `1`，并在每个周期的结束时增加 `1`。在每个周期中，`i` 的值会被写入控制台。\n\n当代码在循环后恢复时，`i` 的值为 `11`。这是因为在 `i`\
  \ 等于 10 的周期结束时，`i` 被增加到了 `11`。这发生在处理条件 `i <= 10` 之前，此时循环结束。与 `while` 循环一样，`for`\
  \ 循环只有在第一个周期之前条件评估为 `true` 时才会执行，因此循环中的代码并不一定运行。\n\n最后说明，你可以将计数器变量声明为 `for` 语句的一部分，将之前的代码重写如下：\n\
  \n```\nfor (int i = 1; i <= 10; ++i)\n{\n   WriteLine($\"{i}\");\n}\n```\n\n然而，如果你这样做，变量\
  \ `i` 将无法从循环外部的代码访问（参见第 6 章 中的“变量作用范围”部分）。\n\n### 中断循环\n\n有时，你希望对循环代码的处理有更细粒度的控制。C#\
  \ 提供了以下命令来帮助你：\n\n*   `break` — 立即结束循环\n*   `continue` — 立即结束当前循环周期（继续执行下一个循环周期）\n\
  *   `return` — 跳出循环及其包含的函数（参见第 6 章）\n\n`break` 命令直接退出循环，执行将从循环后的第一行代码继续，如下例所示：\n\
  \n```\nint i = 1;\nwhile (i <= 10)\n{\n   if (i == 6)\n      break;\n   WriteLine($\"\
  {i++}\");\n}\n```\n\n这段代码写出从 1 到 5 的数字，因为 `break` 命令在 `i` 达到 6 时导致循环退出。\n\n`continue`\
  \ 只停止当前周期，而不是整个循环，如下所示：\n\n```\nint i;\nfor (i = 1; i <= 10; i++)\n{\n   if ((i\
  \ % 2) == 0)\n      continue;\n   WriteLine(i);\n}\n```\n\n在前面的示例中，每当 `i` 除以 2 的余数为\
  \ 0 时，`continue` 语句停止当前周期的执行，因此只显示数字 `1`、`3`、`5`、`7` 和 `9`。\n\n### 无限循环\n\n通过编码错误或设计，定义永远结束的循环（可能的无限循环）作为一个简单的例子，考虑以下：\n\
  \n```\nwhile (true)\n{\n   // 循环中的代码\n}\n```\n\n这是很有用的，你始终可以使用 `break` 语句等代码或手动使用\
  \ Windows 任务管理器退出此类循环。然而，当这种情况意外发生时，可能会令人困扰。考虑下面的循环，它与上一节中的 `for` 循环类似：\n\n```\n\
  int i = 1;\nwhile (i = 10)\n{\n   if ((i % 2) == 0)\n      continue;\n   WriteLine($\"\
  {i++}\");\n}\n```\n\n在这里，`i` 直到循环的最后一行代码才增加，而该代码位于 `continue` 语句之后。如果到达这个 `continue`\
  \ 语句（当 `i` 为 2 时就会到达），下一个循环周期将使用相同的 `i` 值，继续循环，测试相同的 `i` 值，继续循环，以此此类推。这会导致应用程序冻结。注意，仍然可以通过正常方式退出冻结的应用程序，所以如果发生这种情况，你不需要重启。\n\
  \n## ![image](img/c02g003.jpg) 你在本章中学习了什么\n\n| 主题 | 核心概念 |\n| :--- | :--- |\n| 布尔逻辑\
  \ | 布尔逻辑涉及使用 `true` 或 `false` 值来确定是否执行一段代码。某些循环只有在被你中断时才会结束；这些是无限循环。 |\n| 分支 | 你可以使用\
  \ `if` 语句或 `?:`（三元）运算符同时检查多个条件。 |\n| 循环 | 循环允许你根据条件执行多次代码。循环可以按周期被中断（使用 `continue`）或完全中断（使用\
  \ `break`）。 |\n\n# 第 5 章\n\n## 关于变量的更多信息\n\n### 本章的 Wrox.com 代码下载\n\n你可以在下载选项卡中找到本章的\
  \ `wrox.com` 代码下载。代码位于第 5 章下载包中，并根据文中的名称单独命名。\n\n现在你已经更多地了解了 C# 语言，可以处理一些关于变量的更复杂的话题。你查看的第一个主题是类型转换，即将值从一种类型转换为另一种类型。你已经见过其中的一部分，但现在你从正式的角度来研究它。掌握这个主题可以让你更好地理解当混合类型（刻意或无意）时会发生什么，并对数据处理方式有更严格的控制。这有助于你精简代码并避免意外状况。\n\
  \n然后，你将查看更多你可以使用的变量类型：\n\n*   **枚举 (Enumerations)** — 具有用户定义的离散可能值的变量类型，可以用人类可读的方式使用。\n\
  *   **结构体 (Structs)** — 由用户定义的其他变量类型的复合变量类型。\n*   **数组 (Arrays)** — 多个同类型变量的类型，允许通过索引访问单个值。\n\
  \n这些类型比你目前为止使用的简单类型稍微复杂一些，但它们可以让你的生活变得简单得多。最后，你将探索字符串的另一个有用主题：基础字符串操作。\n\n### 类型转换\n\
  \n在书的前面，你看到所有数据（无论类型如何）都仅仅是位序列——即零和一的序列。变量的含义取决于解释这些数据的方式。这种类型最简单的例子是 `char` 类型。该类型使用数字表示\
  \ Unicode 字符集中的字符。事实上，该数字的存储方式与 `ushort` 完全相同——它们都存储一个 0 到 65535 之间的数字。\n\n\n\n\n\
  然而，通常情况下，不同类型的变量使用不同的方案来表示数据。这意味着，即使可以将从一个变量的位序列放入另一个不同类型的变量中（可能它们使用的存储空间相同，或者目标类型有足够的存储空间来包含所有源位），结果也可能不是你预期的那样。\n\
  \n与其将位从一个变量到另一个变量进行这种一对一的映射，你需要对数据进行*类型转换*。类型转换有两种形式：\n\n*   **隐式转换** — 在任何情况下，从类型\
  \ `A` 到类型 `B` 的转换都是可能的，而且执行转换的规则足够简单，足以让你信任编译器。\n*   **显式转换** — 从类型 `A` 到类型 `B`\
  \ 的转换仅在某些情况下，或者在转换规则足够复杂、需要进行某种额外处理的情况下才可能。\n\n### 隐式转换\n\n隐式转换不需要你额外工作，也不需要额外的代码。考虑这里的代码：\n\
  \n```\nvar1 = var2;\n```\n\n如果 `var2` 的类型可以隐式转换为 `var1` 的类型，那么此赋值操作可能涉及隐式转换；然而，它也可能涉及两个相同类型的变量，在这种情况下，不需要隐式转换。例如，`ushort`\
  \ 和 `char` 的值实际上是可以互换的，因为它们存储的 0 到 65535 之间的数字。你可以隐式地在这些类型之间转换值，如下代码所示：\n\n```\n\
  ushort destinationVar;\nchar sourceVar = 'a';\ndestinationVar = sourceVar;\nWriteLine($\"\
  sourceVar val: {sourceVar}\");\nWriteLine($\"destinationVar val: {destinationVar}\"\
  );\n```\n\n在这里，存储在 `sourceVar` 中的值被放在 `destinationVar` 中。当你使用两个 `WriteLine()` 命令输出变量时，得到以下输出：\n\
  \n```\nsourceVar val: a\ndestinationVar val: 97\n```\n\n尽管这两个变量存储了相同的信息，但它们根据各自的类型以不同的方式进行解释。\n\
  \n简单类型有许多隐式转换；`bool` 和 `string` 没有隐式转换，但数值类型有几个。作为参考，表 5.1 显示了编译器可以隐式执行的数值转换（记住\
  \ `char` 是存储为数字的，因此 `char` 算作数值类型）。\n\n| 类型 | 可以安全地转换为 |\n| :--- | :--- |\n| byte\
  \ | short, ushort, int, uint, long, ulong, float, double, decimal |\n| sbyte | short,\
  \ int, long, float, double, decimal |\n| short | int, long, float, double, decimal\
  \ |\n| ushort | int, uint, long, ulong, float, double, decimal |\n| int | long,\
  \ float, double, decimal |\n| uint | long, ulong, float, double, decimal |\n| long\
  \ | float, double, decimal |\n| ulong | float, double, decimal |\n| float | double\
  \ |\n| char | ushort, int, uint, long, ulong, float, double, decimal |\n\n****表\
  \ 5.1**](#c05.xhtml_c05-tbl-anc-0001) 隐式数值转换\n\n别担心 — 你不需要背诵这张表，因为实际上推断编译器可以进行哪些隐式转换非常简单。在第\
  \ 3 章中，表 3-1、3-2 和 3-3 显示了每个简单数值类型的可能取值范围。这些类型的隐式转换规则是：任何可能取值范围完全位于类型 `B` 的可能取值范围内的类型\
  \ `A` 都可以隐式转换为该类型。\n\n这种推理的原理很简单。如果你尝试将一个值放入变量，但该值超出了该变量可以取值的范围，那么就会出现问题。例如，`short`\
  \ 类型的变量能够存储高达 32767 的值，而 `byte` 允许的最大值是 255，所以如果你尝试将 `short` 值转换为 `byte` 值，可能会出现问题。如果\
  \ `short` 持有的值在 256 到 32767 之间，那么它就无法放入 `byte` 中。\n\n如果你知道你的 `short` 类型变量中的值小于 255，那么你应该能够转换该值，对吧？简单的答案是，当然，可以。稍微复杂一点的答案是，当然，可以，但你必须使用*显式*转换。执行显式转换有点是在说：“好的，我知道你警告过我不要这样做，但我会对可能发生的情况负责。”\n\
  \n### 显式转换\n\n顾如名，当你显式要求编译器将值从一个数据类型转换为另一种数据类型时，就会发生显式转换。这些转换需要额外的代码，并且这些代码的格式可能会取决于具体的转换方法。在查看任何此类显式转换代码之前，先看看如果*不*添加任何代码会发生什么。\n\
  \n例如，对上一节中的代码进行以下修改尝试将 `short` 值转换为 `byte`：\n\n```\nbyte destinationVar;\nshort\
  \ sourceVar = 7;\ndestinationVar = sourceVar;\nWriteLine($\"sourceVar val: {sourceVar}\"\
  );\nWriteLine($\"destinationVar val: {destinationVar}\");\n```\n\n如果你尝试编译前面的代码，将收到以下错误：\n\
  \n```\n无法将类型 'short' 转换为 'byte'\n```\n\n要让此代码编译，你需要添加强制转换。在这种语境下，最简单的方法是将 `short`\
  \ 强制转换为 `byte`。强制转换基本上是将数据从一种类型转换为另一种类型，并使用以下语法：\n\n```\n(destinationType)sourceVar\n\
  ```\n\n这将 `short` 转换为 `byte`。因此，你可以使用这种语法修改示例：\n\n```\nbyte destinationVar;\nshort\
  \ sourceVar = 7;\ndestinationVar = (byte)sourceVar;\nWriteLine($\"sourceVar val:\
  \ {sourceVar}\");\nWriteLine($\"destinationVar val: {destinationVar}\");\n```\n\n\
  得到以下输出：\n\n```\nsourceVar val: 7\ndestinationVar val: 7\n```\n\n当你尝试将值强制转换为不兼容的类型时会发生什么？例如，你无法将一个大整数放入太小的数值类型。如下修改代码说明了这一点：\n\
  \n```\nbyte destinationVar;\nshort sourceVar = 281;\ndestinationVar = (byte)sourceVar;\n\
  WriteLine($\"sourceVar val: {sourceVar}\");\nWriteLine($\"destinationVar val: {destinationVar}\"\
  );\n```\n\n得到如下结果：\n\n```\nsourceVar val: 281\ndestinationVar val: 25\n```\n\n发生了什么？嗯，看看这两个数字的二进制表示，以及字节中可以存储的最大值（即\
  \ 255）：\n\n```\n281 = 10001101\n 25 = 00011001\n255 = 01111111\n```\n\n你可以看到源数据的最左位丢失了。这立即引发了一个问题：这种情况发生时你如何判断？显然，你会有需要显式将一种类型转换为另一种类型的时候，如果知道过程中是否丢失了任何数据就好了。检测不到这一点可能会导致严重的错误\
  \ — 例如，在会计应用程序或确定月球轨迹的应用程序中。\n\n解决此问题的方法之一是检查源变量的值并与目标变量的已知限制进行比较。另一种技术是强制系统在运行时对转换给予特别关注。当尝试将一个值放入变量但该值对于变量的类型太大时，会导致*溢出*，这正是你想要检查的情况。\n\
  \n有两个关键字用于设置表达式的*溢出检查语境*：`checked` 和 `unchecked`。你按照以下方式使用它们：\n\n```\nchecked(<expression>)\n\
  unchecked(<expression>)\n```\n\n你可以在最后一个示例中强制进行溢出检查：\n\n\n\n\n\n```byte\nbyte destinationVar;\n\
  short sourceVar = 281;\ndestinationVar = checked((byte)sourceVar);\nWriteLine($\"\
  sourceVar val: {sourceVar}\");\nWriteLine($\"destinationVar val: {destinationVar}\"\
  );\n```\n\n当执行此代码时，它将显示图 5.1 所示的错误消息（该代码在一个名为 `OverflowCheck` 的项目中编译）。\n\n![未处理\
  \ overflowException 错误消息对话框，显示故障排除提示、异常设置和操作。](img/c05f001.jpg)\n\n**图 5.1**](#c05.xhtml_c05-fig-anc-0001)\n\
  \n然而，如果你将此代码中的 `checked` 替换为 `unchecked`，你将获得之前显示的结果，且不会发生错误。这与之前显示的默认行为相同。\n\n\
  你还可以配置应用程序，使其表现得好像每个此类类型的表达式都包含了 `checked` 关键字，除非该表达式显式使用了 `unchecked` 关键字（换句话说，你可以更改溢出检查的默认设置）。要做到这一点，你可以通过在解决方案管理器窗口中右键点击项目并选择“属性”选项来修改项目属性。点击窗口左侧的“生成”以打开生成设置。\n\
  \n你要更改的属性是“高级”设置之一，因此请点击“高级”按钮。在出现的对话框中，勾选“检查算术溢出/下溢”（Check for Arithmetic Overflow/Underflow），如图\
  \ 5.2 所示。默认情况下，此设置被禁用；启用它可以提供之前详细介绍的 `checked` 行为。\n\n![高级生成设置对话框截图，显示检查算术溢出/下溢选项的勾选框、调试信息设置为“全部”、文件对齐设置为\
  \ 512 以及底部的“确定”和“取消”按钮。](img/c05f002.jpg)\n\n**图 5.2**](#c05.xhtml_c05-fig-anc-0002)\n\
  \n### 使用 Convert 命令进行显式转换\n\n你在本书的许多“尝试一下”示例中使用的显式转换类型与你在本章中目前看到的类型略有不同。你一直在使用 `ToDouble()`\
  \ 等命令将字符串值转换为数字，这显然对于所有可能的字符串都是行的。\n\n例如，如果你尝试使用 `ToDouble()` 将类似 `Number` 的字符串转换为双精度浮点数，执行代码时，你将看到图\
  \ 5.3 所示的对话框。\n\n![未处理 FormatException 错误消息对话框，显示三个故障排除提示、异常设置和操作。](img/c05f003.jpg)\n\
  \n**图 5.3**](#c05.xhtml_c05-fig-anc-0003)\n\n如你所示，操作失败了。为了让此类转换起，提供的字符串*必须*是数字的有效表示，且该数字必须是不会引起溢出的。数字的有效表示包含一个可选的符号（即加或减）、零或多个数字、一个可选的点后跟一个或多个数字，以及一个可选的“e”或“E”后跟一个可选的符号、一个或多个数字，除该序列前后的空格外没有其他任何内容。使用所有这些可选额外项，你可以识别复杂的字符串如\
  \ `-1.2451e-24` 为数字。\n\n关于这些转换需要注意的重要点是，它们*始终*会进行溢出检查，`checked` 和 `unchecked` 关键字以及项目属性设置无效。\n\
  \n下一个“尝试一下”是一个涵盖了本节中许多转换类型的示例。它声明并初始化了不同类型的多个变量，然后在它们之间进行隐式和显式的转换。\n\n## 复杂变量类型\n\
  \n除了所有简单变量类型外，C# 还提供了三种稍微复杂（但非常有用）的变量：枚举（通常称为 enums）、结构体（偶尔称为 structures）和数组。\n\n\
  ### 枚举\n\n你目前看到的每种类型（`string` 除外）都有明确定义的允许值集合。诚然，在 `double` 等类型中，这个集合非常大，实际上可以被视为连续体，但它仍然是一个固定集合。最简单的例子是\
  \ `bool` 类型，它只能取两个值之一：`true` 或 `false`。\n\n在许多其他情况下，你可能希望一个变量可以取固定结果集中的一个结果。例如，你可能希望有一个\
  \ `orientation` 类型，可以存储 `north`、`south`、`east` 或 `west` 值之一。\n\n在这样的情况下，*枚举*非常有用。枚举在\
  \ `orientation` 类型中完全实现了了你的需求：它们允许定义一种可以取你提供的有限值集之一的类型。因此，你需要创建一个名为 `orientation`\
  \ 的自定义枚举类型，它可以取四个可能值之一。\n\n注意，这里涉及一个额外的步骤——你不只是声明一个给定类型的变量；你声明并详细说明一个用户定义类型，然后声明此新类型的变量。\n\
  \n#### 定义枚举\n\n你可以使用 `enum` 关键字如下定义枚举：\n\n```enum typeName\n{\n   value1,\n   value2,\n\
  \   value3,\n   ...\n   valueN\n}\n```\n\n接下来，你可以声明此类类型的变量：\n\n```declaration\n\
  typeName varName;\n```\n\n你可以使用以下方式赋值：\n\n```assignment\nvarName = typeName;\n```\n\
  \n\n\n\n`struct`（structure 的缩写）顾名如此。也就是说，结构体（structs）是由若干段数据组成的数据结构，这些数据可能具有不同的类型。它们允许你根据这种结构定义自己的变量类型。例如，假设你想存储从起始点到某个地点的路线，该路线由一个方向和英里的距离组成。为了简单起见，你可以假设方向是指南针方位之一（可以使用上一节中的\
  \ `orientation` 枚举来表示），而英里的距离可以用 `double` 类型表示。\n\n你可以使用已经见过的代码用两个独立的变量来实现：\n\n\
  ```\norientation myDirection;\ndouble      myDistance;\n```\n\n使用两个变量并没有错，但将这些信息存储在一个地方要简单得多（特别是特别是当需要多条路线时）。\n\
  \n### 定义结构体 (Defining Structs)\n\n结构体使用 `struct` 关键字进行如下定义：\n\n```\nstruct <typeName>\n\
  {\n   <memberDeclarations>\n}\n```\n\n`<memberDeclarations>` 部分包含变量的声明（称为结构体的 `data\
  \ members`），其格式与通常情况下几乎相同。每个成员声明采用以下形式：\n\n```\n<accessibility> <type> <name>;\n\
  ```\n\n为了允许调用结构体的代码访问结构体的数据成员，你需要在 `<accessibility>` 中使用 `public` 关键字。例如：\n\n```\n\
  struct route\n{\n   public orientation direction;\n   public double      distance;\n\
  }\n```\n\n一旦定义了结构体类型，你就可以通过定义新类型的变量来使用它：\n\n```\nroute myRoute;\n```\n\n此外，你可以通过点符号（`.`）访问此复合变量的数据成员：\n\
  \n```\nmyRoute.direction = orientation.north;\nmyRoute.distance  = 2.5;\n```\n\n\
  这在下方的“尝试一下”中得到了演示，其中上一个“尝试一下”中的 `orientation` 枚举与之前显示的 `route` 结构体一起使用。随后代码对该结构体进行操作，让你感受结构体的工作原理。\n\
  \n### 数组 (Arrays)\n\n你到为止看到的所有类型都有一个共同点：它们都存储一个单一的值（对于结构体来说是存储一组值）。有时，在需要存储大量数据的情况下，这并不方便。你可能想同时存储多个相同类型的值，而无需为每个值使用一个不同的变量。\n\
  \n例如，假设你想对所有朋友的名字进行某些处理。你可以如下使用简单的字符串变量：\n\n```\nstring friendName1 = \"Todd Anthony\"\
  ;\nstring friendName2 = \"Kevin Holton\";\nstring friendName3 = \"Shane Laigle\"\
  ;\n```\n\n但这看起来需要花费大量精力，特别是因为你需要编写不同的代码来处理每个变量。例如，你不能在循环中遍历这个字符串列表。\n\n替代方案是使用 `array`。数组是存储在单个数组类型变量中的索引变量列表。例如，你可能有一个名为\
  \ `friendNames` 的数组，存储了前面字符串变量中的三个名称。你可以通过方括号中指定索引来访问数组的单个成员，如下：\n\n```\nfriendNames[<index>]\n\
  ```\n\n索引简单是一个整数，从第一个条目开始为 0，第二个为 1，以此此类推。这意味着你可以通过循环遍历条目：\n\n```\nint i;\nfor (i\
  \ = 0; i < 3; i++)\n{\n   WriteLine($\"Name with index of {i}: {friendNames[i]}\"\
  );\n}\n```\n\n数组有一个单一的 `base type`（基础类型）——也就是说，数组中的条目都是相同类型。这个 `friendNames` 数组的基础类型是\
  \ `string`，因为它旨在存储 `string` 变量。数组条目通常被称为 `elements`（元素）。\n\n#### 声明数组 (Declaring\
  \ Arrays)\n\n数组如下如下声明：\n\n```\n<baseType>[] <name>;\n```\n\n在这里，`<baseType>`可以是任何变量类型，包括你在本章看到的枚举和结构体类型。在访问数组之前必须对其初始化。你不能像这样访问或给数组元素赋值：\n\
  \n```\nint[] myIntArray;\nmyIntArray[10] = 5;\n```\n\n数组可以通过两种方式初始化。你可以用字面量形式指定数组的完整内容，也可以指定数组的大小并使用\
  \ `new` 关键字初始化所有数组元素。\n\n使用字面量值指定数组只需提供用大括号括起来的逗号分隔的元素值列表：\n\n```\nint[] myIntArray\
  \ = { 5, 9, 10, 2, 99 };\n```\n\n在这里，`myIntArray` 有五个元素，每个元素都分配了一个整数值。\n\n另一种方法需要以下语法：\n\
  \n```\nint[] myIntArray = new int[5];\n```\n\n在这里，你使用 `new` 关键字显式初始化数组，并使用常量值定义大小。这种方法会导致所有数组成员被分配一个默认值，对于数值类型为\
  \ 0。你也可以使用非常量变量进行此类初始化：\n\n```\nint[] myIntArray = new int[arraySize];\n```\n\n\
  此外，如果你愿意，可以结合这两种初始化方法：\n\n```\nint[] myIntArray = new int[5] { 5, 9, 10, 2, 99 };\n\
  ```\n\n\n\n\n像这所示的二维数组声明方式如下：\n\n```\n<baseType>[,] <name>;\n```\n\n更多维度的数组只需要更多的逗号：\n\
  \n```\n<baseType>[,,,] <name>;\n```\n\n这会声明一个四维数组。赋值也使用类似的语法，用逗号分隔大小。声明并初始化一个基类型为\
  \ `double`、`x` 尺寸为 3、`y` 尺寸为 4 的二维数组 `hillHeight`，需要执行以下操作：\n\n```\ndouble[,] hillHeight\
  \ = new double[3,4];\n```\n\n或者，你可以使用字面量值进行初始赋值。在这里，你使用了嵌套的大括号块，并用逗号进行分隔：\n\n```\n\
  double[,] hillHeight = { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n```\n\
  \n此数组的维度与上一个相同——即三行四列。通过提供字面量值，这些维度是隐式式定义的。\n\n要访问多维数组的单个元素，你只需要指定用逗号分隔的索引：\n\n\
  ```\nhillHeight[2,1]\n```\n\n然后你可以像操作其他元素一样操作此元素。此表达式将访问之前定义的第三个嵌套数组的第二个元素（值将为 4）。记住从\
  \ 0 开始计数，且第一个数字是嵌套数组。换句话说，第一个数字指定一对大括号，第二个数字指定该大括号对内的元素。你可以通过可视化的方式表示此数组，如图 5.10\
  \ 所示。\n\n![多维数组示意图：hillHeight 的第一行从 hillHeight [0,0] 1 到 hillHeight [0,3] 4，第二行从\
  \ hillHeight [1,0] 2 到 hillHeight [1,3] 5，第三行从 hillHeight [2,0] 3 到 hillHeight [2,3]\
  \ 6。](images/c05f010.jpg)\n\n图 5.10\n\n`foreach` 循环允许你以多维的方式访问所有元素，就像处理单维数组一样：\n\
  \n```\ndouble[,] hillHeight = { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n\
  foreach (double height in hillHeight)\n{\n   WriteLine(\"{0}\", height);\n}\n```\n\
  \n输出元素的顺序与赋值字面量值的顺序相同。该序列如下（此处显示的是元素标识符，而非实际值）：\n\n```\nhillHeight[0,0]\nhillHeight[0,1]\n\
  hillHeight[0,2]\nhillHeight[0,3]\nhillHeight[1,0]\nhillHeight[1,1]\nhillHeight[1,2]\n\
  …\n```\n\n### 数组的数组\n\n正如上一节讨论的，多维数组被称为矩形，因为每个“行”的大小都是相同的。使用上上的例子，对于任何可能的 `x` 坐标，你都可以拥有从\
  \ 0 到 3 的 `y` 坐标。\n\n也可能存在交错数组（jagged arrays），其中“行”的大小可能不同。为此，你需要一个数组，其每个元素都是另一个数组。你还可以拥有数组的数组的数组，甚至更复杂的情况。然而，只有当这些数组具有相同的基类型时，这一切才是可能的。\n\
  \n声明数组数组的语法涉及在数组声明中指定多组方括号，如下所示：\n\n```\nint[][] jaggedIntArray;\n```\n\n遗憾的是，初始化这样的数组并没有初始化多维数组那么简单。例如，你不能在前面的声明后直接使用以下代码：\n\
  \n```\njaggedIntArray = new int[3][4];\n```\n\n即使你可以这样做，它也没有那么用，因为你可以用更少的精力通过简单的多维数组来实现相同的效果。你不能使用像如下的代码：\n\
  \n```\njaggedIntArray = { { 1, 2, 3 }, { 1 }, { 1, 2 } };\n```\n\n你有两个选择。你可以初始化包含其他数组的数组（为了清晰起见，我们称这些子数组），然后依次初始化这些子数组：\n\
  \n```\njaggedIntArray = new int[2][];\njaggedIntArray[0] = new int[3];\njaggedIntArray[1]\
  \ = new int[4];\n```\n\n或者，你可以使用前面字面量赋值的修改形式：\n\n```\njaggedIntArray = new int[3][]\
  \ { new int[] { 1, 2, 3 }, new int[] { 1 },\n                                new\
  \ int[] { 1, 2 } };\n```\n\n如果数组在声明的同一行进行初始化，则可以简化如下所示：\n\n```\nint[][] jaggedIntArray\
  \ = { new int[] { 1, 2, 3 }, new int[] { 1 },\n                           new int[]\
  \ { 1, 2 } };\n```\n\n你可以对交错数组使用 `foreach` 循环，但你通常需要嵌套这些循环来获取实际数据。例如，假设你有以下内容：\n\
  \n### 字符串操作\n\n到目前，你对字符串的使用包括向控制台写入字符串、从控制台读取字符串以及使用加 号拼接字符串。在编写更有趣应用程序时，你会发现操作字符串是你经常需要做的事情。因此，值得花几页时间查看\
  \ C# 中一些常用的字符串技术。\n\n首先，`string` 类型变量可以被视为只读的 `char` 数组。这意味着你可以使用如下语法访问单个字符：\n\n\
  ```\nstring myString = \"A string\";\nchar myChar = myString[1];\n```\n\n然而，你不能这样赋值单个字符。为了获取一个可以写的\
  \ `char` 数组，你可以使用以下代码。这使用了变量的 `ToCharArray()` 方法：\n\n```\nstring myString = \"A\
  \ string\";\nchar[] myChars = myString.ToCharArray();\n```\n\n然后你可以按照标准方式操作 `char`\
  \ 数组。你也可以在 `foreach` 循环中使用字符串，如下所示：\n\n```\nforeach (char character in myString)\n\
  {\n   WriteLine($\"{character}\");\n}\n```\n\n与数组一样，你也可以使用 `myString.Length` 获取元素的数量。这提供了字符串中的字符数：\n\
  \n```\nstring myString = ReadLine();\nWriteLine($\"You typed {myString.Length} characters.\"\
  );\n```\n\n\n\n\n\n```\nstring userResponse = ReadLine();\nif (userResponse.ToLower()\
  \ == \"yes\")\n{\n   // 对响应执行操作\n}\n```\n\n此命令与本节中的其他命令一样，实际上并不会更改它所作用的字符串。相反，将此命令与字符串结合会创建一个新字符串，你可以将其与另一个字符串进行比较（如下所示），或将其赋值给另一个变量。另一个变量也可以是正在操作的同一个变量：\n\
  \n```\nuserResponse = userResponse.ToLower();\n```\n\n这是一个重要的备忘点，因为仅仅编写\n\n```\n\
  userResponse.ToLower();\n```\n\n实际上并没起到什么作用！\n\n你还可以通过其他操作来简化对用户输入的解析。如果用户不小心在输入的开头或末尾多了一个空格，该怎么办？在这种情况下，前面的代码将无法工作。你需要修剪输入的字符串，可以使用\
  \ `string.Trim()` 命令来实现：\n\n```\nstring userResponse = ReadLine();\nuserResponse\
  \ = userResponse.Trim();\nif (userResponse.ToLower() == \"yes\")\n{\n   // 对响应执行操作\n\
  }\n```\n\n前面的代码还能检测像这样的字符串：\n\n```\n\" YES\"\n\"Yes \"\n```\n\n你还可以通过在 `char` 数组中指定字符来删除任何其他字符，例如：\n\
  \n```\nchar[] trimChars = {' ', 'e', 's'};\nstring userResponse = ReadLine();\n\
  userResponse = userResponse.ToLower();\nuserResponse = userResponse.Trim(trimChars);\n\
  if (userResponse == \"y\")\n{\n   // 对响应执行操作\n}\n```\n\n这消除了字符串开头或结尾的任何空格以及字母 `\"\
  e\"` 和 `\"s\"`。只要字符串中没有其他字符，这将检测到如下字符串：\n\n```\n\"Yeeeees\"\n\" y\"\n```\n\n以此此类推。\n\
  \n你还可以使用 `string.TrimStart()` 和 `string.TrimEnd()` 命令，它们会分别修剪字符串开头和结尾的空格。这些命令也可以指定\
  \ `char` 数组。\n\n你可以使用另外两个字符串命令来处理字符串的间距：`string.PadLeft()` 和 `string.PadRight()`。它们允许你在字符串的左侧或右侧添加空格，以强制达到所需的长度。使用方法如下：\n\
  \n```\n<string>.PadX(<desiredLength>);\n```\n\n这是一个示例：\n\n```\nmyString = \"Aligned\"\
  ;\nmyString = myString.PadLeft(10);\n```\n\n这会在 `myString` 中的单词 `Aligned` 左侧添加三个空格。这些方法在列对齐字符串时非常有用，特别是对于定位包含数字的字符串。\n\
  \n与修剪命令一样，你还可以另一种方式使用这些命令，即提供用于填充字符串的字符。这涉及到单个 `char`，而不是修剪时的 `char` 数组：\n\n```\n\
  myString = \"Aligned\";\nmyString = myString.PadLeft(10, '-');\n```\n\n这会在 `myString`\
  \ 的开头添加三个字符。\n\n有很多这样的字符串处理命令，其中许多在非常特定的情况下才有用。将在接后的章节中使用它们时对其进行讨论。不过，在继续之前，值得查看\
  \ Visual Studio 2015 中一个你在过去几个章节（特别是本章节）中可能注意的功能。在接下来的“尝试一试”中，你将检查自动完成功能，IDE 会通过建议你可能想要插入的代码来提供帮助。\n\
  \n## ![image](img/c02g003.jpg) 你在本章中学到的知识\n\n| 主题 | 核心概念 |\n| :--- | :--- |\n| 类型转换\
  \ | 你可以将值从一种类型转换为另一种类型，但在执行此操作会有相应的规则。隐式转换会自动发生，但仅当源值类型的所有可能值在目标值类型中可用时。显式转换也是可能的，但你面临着值未按预期赋值甚至导致错误的风险。\
  \ |\n| 枚举 | 枚举（Enums）是具有离散值集的类型，每个值都有一个名称。枚举使用 `enum` 关键字定义。这使得它们在代码中易于理解，因为它们非常易读。枚举有一个底层数值类型（默认是\
  \ `int`），你可以利用枚举值的此属性在枚举值和数值之间进行转换，或识别枚举值。 |\n| 结构体 | 结构体（Structs）同时包含多个不同值的类型。结构体使用\
  \ `struct` 关键字定义。结构体包含的每个值都有名称和类型；并不要求存储在结构体中的每个值都是相同类型。 |\n| 数组 | 数组是相同类型值的集合。数组具有固定的大小或长度，决定了它们可以包含多少值。你可以定义多维数组或锯齿数组来存储不同数量和形状的数据。你还可以使用\
  \ `foreach` 循环遍历数组中的值。 |\n\n# 第 6 章\n\n## 函数\n\n### 本章的 Wrox.com 代码下载\n\n你可以在下载选项卡的\
  \ [www.wrox.com/go/beginningvisualc#2015programming](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 找到本章的 [wrox.com](http://wrox.com) 代码下载。代码位于第 6 下载中，并根据章节中的名称进行单独命名。\n\n到目前为止，看到的所有代码形式都是单个块，可能带有用于重复代码的循环以及用于条件执行语句的分支。对数据执行操作意味着将代码放置在你希望它工作的地方。\n\
  \n这种代码结构是有局限性的。通常，某些任务（例如查找数组中的最大值）可能需要在程序的多个点执行。你可以在需要时在应用程序中放置相同（或相似）的代码段，但这也有它自己的问题。更改有关常见任务的任何微小细节（例如纠正代码错误）可能需要对多个代码段进行更改，这些更改分布在整个应用程序中。遗漏任何一个都可能产生戏剧性的并导致整个应用程序失败。此外，应用程序可能会变得非常长。\n\
  \n解决此问题的方法是使用函数。C# 中的函数是提供可以在应用程序任何一点执行的代码块的手段。\n\n例如，你可以编写一个计算数组中最大值的函数。你可以从代码的任何位置调用该函数，并在每个情况下都使用相同的代码行。由于你只需要提供一次此代码，因此对其所做的任何更改都将影响使用该计算的地方。函数可以被视为包含可重用的代码。\n\
  \n\n\n\n函数还可以用于创建多功能代码，使其能够对不同的数据执行相同的操作。你可以通过参数的形式向函数提供需要处理的信息，并以返回值的形式从函数中获取结果。在之前的示例中，你可以提供一个数组作为参数进行搜索，并获取数组中的最大值作为返回值。这意味着你每次都可以使用同一个函数来处理不同的数组。函数定义由一个名称、一个返回类型和一个参数列表组成，该参数列表指定了函数所需的参数数量和类型。函数的名称和参数（但不包括其返回类型）共同定义了函数的\
  \ `signature`（签名）。\n\n## 定义和使用函数\n\n本节描述了你如何向应用程序中添加函数，然后从代码中调用（使用）它们。从基础知识开始，你将看到一些不与调用它的代码交换任何数据的简单函数，然后查看更高级的函数用法。接下来的“尝试”（Try\
  \ It Out）将帮助你开始练习。\n\n### 返回值\n\n与函数交换数据最简单的方法是使用返回值。带有返回值的函数在表达式中使用时，其求值方式与变量在表达式中求值为其包含的值完全相同。就像变量一样，返回值也有类型。\n\
  \n例如，你可能有一个名为 `GetString()` 的函数，其返回值是一个字符串。你可以在代码中使用它，如下所示：\n\n```\nstring myString;\n\
  myString = GetString();\n```\n\n或者，你可能有一个名为 `GetVal()` 的函数，它返回一个 `double` 类型的值，你可以在数学表达式中使用它：\n\
  \n```double\ndouble myVal;\ndouble multiplier = 5.3;\nmyVal = GetVal() * multiplier;\n\
  ```\n\n当函数返回一个值时，你需要以两种方式修改你的函数：\n\n*   在函数声明中指定返回值的类型，而不是使用 `void` 关键字。\n*   使用\
  \ `return` 关键字结束函数执行，并将返回值传递给调用代码。\n\n在代码术语中，在你所看到的类型控制台应用程序函数中，它看起来如下：\n\n```\n\
  static <returnType> <FunctionName>()\n{\n   …\n   return <returnValue>;\n}\n```\n\
  \n这里的唯一限制是 `<returnValue>` 必须是一个类型为 `<returnType>` 或可以隐式转换为该类型的值。然而，`<returnType>`\
  \ 可以是你想要的任何类型，包括你见过的更复杂的类型。这可能简单如下：\n\n```\nstatic double GetVal()\n{\n   return\
  \ 3.2;\n}\n```\n\n然而，返回值通常是函数执行某些处理的结果；上述操作也可以很容易地使用 `const` 变量来实现。当执行到 `return`\
  \ 语句时，程序执行将立即返回到调用代码。该语句之后的代码行都不会执行，但这并不意味着 `return` 语句只能放置在函数体的最后一行。你可以在代码的更早位置使用\
  \ `return`，也许在执行某些分支逻辑之后。在 `for` 循环、`if` 块或任何其他结构中放置 `return`会导致该结构立即终止并结束函数：\n\n\
  ```\nstatic double GetVal()\n{\n   double checkVal;\n   // checkVal 通过某些逻辑分配了值（此处未显示）。\n\
  \   if (checkVal < 5)\n      return 4.7;\n   return 3.2;\n}\n```\n\n在这里，返回两个值中的一个，取决于\
  \ `checkVal` 的值。在这种情况下，唯一的限制是必须在到达函数结束的大括号 `}` 之前处理 `return` 语句。以下代码是非法的：\n\n```\n\
  static double GetVal()\n{\n   double checkVal;\n   // checkVal 通过某些逻辑分配了值。\n   if\
  \ (checkVal < 5)\n      return 4.7;\n}\n```\n\n如果 `checkVal` `>= 5`，则没有满足 `return`\
  \ 语句，这是不允许的。所有处理路径都必须到达 `return` 语句。在大多数情况下，编译器会检测到这一点并给你错误“并非所有代码路径都返回了”。\n\n执行单行代码的函数可以使用\
  \ C# 6 引入的特性“表达式体方法”（expression-bodied methods）。下面的函数模式使用 `=>`（lambda 箭头）来实现这一特性：\n\
  \n```\nstatic <returnType> <FunctionName>() => <myVal1 * myVal2>;\n```\n\n例如，一个在\
  \ C# 6 之前的 `Multiply()` 函数是这样编写的：\n\n```\nstatic double Multiply(double myVal1,\
  \ double myVal2)\n{\n      return myVal1 * myVal2;\n}\n```\n\n现在可以使用 `=>`（lambda\
  \ 箭头）来编写。这里编写的代码结果以更简单、更整合的方式表达了方法的意图：\n\n```\nstatic double Multiply(double myVal1,\
  \ double myVal2) => mVal1 * MyVal2;\n```\n\n### 参数\n\n当函数需要接受参数时，你必须指定以下内容：\n\n\
  *   在定义中指定函数接受的参数列表，以及这些参数的类型。\n*   在每次函数调用中提供匹配的参数列表。\n\n这涉及以下代码，你可以拥有任意数量的参数，每个参数都有类型和名称：\n\
  \n```\nstatic <returnType> <FunctionName>(<paramType> <paramName>, …)\n{\n   …\n\
  \   return <returnValue>;\n}\n```\n\n参数之间用逗号分隔，其中的每个参数都可以在函数内部作为变量访问。例如，一个简单的函数可能接受两个\
  \ `double` 参数并返回它们的乘积：\n\n```\nstatic double Product(double param1, double param2)\
  \ => param1 * param2;\n```\n\n#### 参数匹配\n\n调用函数时必须提供与函数定义匹配的参数。这意味着要匹配参数类型、参数数量以及参数顺序。例如，函数\n\
  \n```\nstatic void MyFunction(string myString, double myDouble)\n{\n   …\n}\n```\n\
  \n不能使用以下方式调用：\n\n```\nMyFunction(2.6, \"Hello\");\n```\n\n在这里，你尝试将 `double` 值作为第一个参数，将\
  \ `string` 值作为第二个参数，这与定义的顺序不符。代码将无法编译。在本章稍后的“重载函数”部分，你将学习一种绕过此问题的有用技巧。\n\n#### 参数数组\n\
  \nC# 允许你为函数指定一个（且仅一个）特殊参数。该参数必须是定义中的最后一个参数，被称为参数数组。参数数组允许你使用可数量的参数调用函数，并使用 `params`\
  \ 关键字定义。\n\n参数数组可以是简化代码的有用方法，因为你不需要从调用代码传递数组。相反，你传递多个相同类型的参数，它们会被放在函数内部使用的数组中。\n\
  \n定义使用参数数组的函数需要以下代码：\n\n```\nstatic <returnType> <FunctionName>(<p1Type> <p1Name>,\
  \ …,\n                                   params <type>[] <name>)\n{\n   …\n   return\
  \ <returnValue>;\n}\n```\n\n可以使用如下代码调用此函数：\n\n```\n<FunctionName>(<p1>, …, <val1>,\
  \ <val2>, …)\n```\n\n`<val1>`、`<val2>` 等是 `<type>` 类型的值，用于初始化 `<name>` 数组。在这里可以指定的参数数量几乎是无限制的；唯一的限制是它们都必须是\
  \ `<type>` 类型。你甚至可以不指定任何参数。接下来的“尝试”定义并使用了带有 `params` 类型参数的函数。\n\n\n\n\n\n本章到目前为止定义的所有函数都有值参数。这意味着，当你使用参数时，你将一个值传递给了函数中使用的变量。在函数中对该变量所做的任何修改都不会对函数调用中指定的参数产生影响。例如，考虑一个将传递参数的值倍增并显示的函数：\n\
  \n```csharp\nstatic void ShowDouble(int val)\n{\n   val *= 2;\n   WriteLine($\"\
  val doubled = {0}\", val);\n}\n```\n\n在这里，参数 `val` 在此函数中被倍增。如果你这样调用它：\n\n```csharp\n\
  int myNumber = 5;\nWriteLine($\"myNumber = {myNumber}\");\nShowDouble(myNumber);\n\
  WriteLine($\"myNumber = {myNumber}\");\n```\n\n那么输出到控制台的文本如下：\n\n```\nmyNumber =\
  \ 5\nval doubled = 10\nmyNumber = 5\n```\n\n使用 `myNumber` 作为参数调用 `ShowDouble()`\
  \ 不会影响 `Main()` 中 `myNumber` 的值，尽管赋值给它的参数 `val` 被倍增了。\n\n这听起来很好，但如果你*想要*改变 `myNumber`\
  \ 的值，你就遇到问题了。你可以使用一个为 `myNumber` 返回新值的函数，如下：\n\n```csharp\nstatic int DoubleNum(int\
  \ val)\n{\n   val *= 2;\n   return val;\n}\n```\n\n你可以使用以下代码调用此函数：\n\n```csharp\n\
  int myNumber = 5;\nWriteLine($\"myNumber = {myNumber}\");\nmyNumber = DoubleNum(myNumber);\n\
  WriteLine($\"myNumber = {myNumber}\");\n```\n\n然而，这段代码极不直观，而且无法处理作为参数的多个变量的值变化（因为函数只有一个返回值）。\n\
  \n相反，你希望通过*引用*传递参数，这意味着函数将与函数调用中使用的变量完全相同的变量，而不仅仅是一个具有相同值的变量。因此，对该变量所做的任何更改将反映在作为参数使用的变量的值上。为了这一点，你只需使用\
  \ `ref` 关键字来指定参数：\n\n```csharp\nstatic void ShowDouble(ref int val)\n{\n   val *=\
  \ 2;\n   WriteLine($\"val doubled = {val}\");\n}\n```\n\n然后在函数调用中再次指定它（这是强制性的）：\n\
  \n```csharp\nint myNumber = 5;\nWriteLine($\"myNumber = {myNumber}\");\nShowDouble(ref\
  \ myNumber);\nWriteLine($\"myNumber = {myNumber}\");\n```\n\n现在输出到控制台的文本如下：\n\n\
  ```\nmyNumber = 5\nval doubled = 10\nmyNumber = 10\n```\n\n注意用作 `ref` 参数变量有两个局限性。首先，函数可能会导致引用参数值的更改，因此你必须在函数调用中使用*非常量*变量。因此，以下代码是非法的：\n\
  \n```csharp\nconst int myNumber = 5;\nWriteLine($\"myNumber = {myNumber}\");\nShowDouble(ref\
  \ myNumber);\nWriteLine($\"myNumber = {myNumber}\");\n```\n\n其次，你必须使用已初始化的变量。C#\
  \ 不允许你假设 `ref` 参数在使用它的函数中会被初始化。以下代码也是非法的：\n\n```csharp\nint myNumber;\nShowDouble(ref\
  \ myNumber);\nWriteLine(\"myNumber = {myNumber}\");\n```\n\n### 输出参数 (Out Parameters)\n\
  \n除了通过引用传递值外，你还可以使用 `out` 关键字指定给定参数为*输出参数*，它的用法与 `ref` 关键字相同（作为函数定义和函数调用中参数的修饰符）。实际上，这带给你你几乎与引用参数完全相同的行为，即参数在函数执行结束时的值被返回给函数调用中使用的变量。然而，它们存在重要的区别：\n\
  \n*   虽然使用未赋值的变量作为 `ref` 参数是非法的，但你可以使用未赋值的变量作为 `out` 参数。\n*   使用 `out` 参数的函数必须将其视为一个未赋值的值。\n\
  \n这意味着，虽然在调用代码中使用已赋值的变量作为 `out` 参数是允许的，当函数执行时，存储在该变量中的值将会丢失。\n\n作为一个示例，考虑之前显示的 `MaxValue()`\
  \ 函数的扩展，该函数返回数组的最大值。稍微修改该函数，以便获取数组中最大值元素的索引。为了保持简单，当存在多个具有最大值的元素时，仅获取该值第一次出现的索引。为了实现这一点，你通过如下修改函数添加了一个\
  \ `out` 参数：\n\n```csharp\n static int MaxValue(int[] intArray, out int maxIndex)\n\
  \   {\n      int maxVal = intArray[0];\n      maxIndex = 0;\n      for (int i =\
  \ 1; i < intArray.Length; i++)\n      {\n         if (intArray[i] > maxVal)\n  \
  \       {\n            maxVal = intArray[i];\n            maxIndex = i;\n      \
  \   }\n      }\n      return maxVal;\n   }\n```\n\n你可以这样使用该函数：\n\n```csharp\nint[]\
  \ myArray = { 1, 8, 3, 6, 2, 5, 9, 3, 0, 2 };\nint maxIndex;\nWriteLine($\"The maximum\
  \ value in myArray is\n           {MaxValue(myArray, out maxIndex)}\");\nWriteLine($\"\
  The first occurrence of this value is at element\n{maxIndex}\");\n```\n\n结果如下：\n\
  \n```\nThe maximum value in myArray is 9\nThe first occurrence of this value is\
  \ at element 7\n```\n\n你使用 `out` 关键字就像使用 `ref` 关键字一样。\n\n## 变量作用域 (Variable Scope)\n\
  \n在本节之前，你可能一直在想为什么函数之间交换数据是必要的。原因是 C# 中的变量仅在定义它的代码块内可访问。变量作用域是一个重要的主题，并将在下文中介绍。作用域涵盖了定义变量的代码块以及任何直接嵌套的代码块。你可以在\
  \ `VariableScope.cs` 中找到后续讨论的代码。\n\n### 其他结构中的变量作用域 (Variable Scope in Other Structures)\n\
  \n上节提到的这一点也适用于代码块，例如分支和循环中的代码块。考虑以下代码：\n\n```csharp\nint i;\nfor (i = 0; i < 10;\
  \ i++)\n{\n   string text = \"Line \" + Convert.ToString(i);\n   WriteLine($\"{text}\"\
  );\n}\nWriteLine($\"Last text in loop: {text}\");\n```\n\n在这里，字符串变量 `text` 局部于 `for`\
  \ 循环。由于代码在循环之外的 `WriteLine()` 调用尝试使用变量 `text`，而它超出了作用域。尝试如下修改代码：\n\n```csharp\n\
  int i;\nstring text;\nfor (i = 0; i < 10; i++)\n{\n   text = \"Line \" + Convert.ToString(i);\n\
  \   WriteLine($\"{text}\");\n}\nWriteLine($\"Last text in loop: {text}\");\n```\n\
  \n这段代码也会失败，因为变量在使用之前必须声明并初始化，而 `text` 仅在 `for` 循环中初始化。当退出循环块时，赋值给 `text` 的值就会丢失，因为它在块之外没有初始化。然而，你可以进行如下更改：\n\
  \n```csharp\nint i;\nstring text = \"\";\nfor (i = 0; i < 10; i++)\n{\n   text =\
  \ \"Line \" + Convert.ToString(i);\n   WriteLine($\"{text}\");\n}\nWriteLine($\"\
  Last text in loop: {text}\");\n```\n\n这一次 `text` 在循环外进行了初始化，你可以访问它的值。这段简单代码的结果所示图\
  \ 6.6。\n\n\n\n\n这种行为的解释与 `text` 变量（实际上任何变量）的内存分配有关。仅仅声明一个简单的变量类型并不会发生什么。只有当给变量赋值时，这些值会在内存中被分配一个位置进行存储。当这种分配发生在循环内部时，该值本质上被定义为局部值，并在循环结束后超出作用范围。\n\
  \n尽管变量本身没有局部化在循环中，但它包含的值是。然而，在循环外部进行赋值可以确保该值对于主代码来说是局部的，并且在循环内部仍然处于作用范围内。这意味着变量在退出主代码块之前不会超出作用范围，因此你可以在循环外部访问它的值。\n\
  \n幸运的是，C# 编译器会检测到变量作用域问题，通过响应它生成的错误信息，绝对有助于你理解变量作用域这一主题。\n\n## 参数和返回值与全局数据的对比\n\n\
  让我们仔细观察一下如何通过全局数据以及通过参数和返回值与函数交换数据。回顾一下，考虑以下代码：\n\n```\nclass Program\n{\n   static\
  \ void ShowDouble(ref int val)\n   {\n      val *= 2;\n      WriteLine($\"val doubled\
  \ = {val}\");\n   }\n   static void Main(string[] args)\n   {\n      int val = 5;\n\
  \      WriteLine($\"val = {val}\");\n      ShowDouble(ref val);\n      WriteLine($\"\
  val = {val}\");\n   }\n}\n```\n\n现在将其与这段代码对比：\n\n```\nclass Program\n{\n   static\
  \ int val;\n   static void ShowDouble()\n   {\n      val *= 2;\n      WriteLine($\"\
  val doubled = {val}\");\n   }\n   static void Main(string[] args)\n   {\n      val\
  \ = 5;\n      WriteLine($\"val = {val}\");\n      ShowDouble();\n      WriteLine($\"\
  val = {val}\");\n   }\n}\n```\n\n这些 `ShowDouble()` 函数的结果是相同的。\n\n使用其中一种技术而不是另一种技术并没有硬性的规定，这两种技术都是完全有效的，但你可能想要考虑以下准则。\n\
  \n首先，正如在介绍介绍这个主题时所提到的，使用全局值的 `ShowDouble()` 版本只使用全局变量 `val`。要使用这个版本，你必须使用这个全局变量。这略微限制了函数的灵活性，意味着如果你打算存储结果，就必须不断将全局变量的值复制到其他变量中。此外，全局数据可能会被应用程序其他部分的代码修改，这可能导致不可预测的结果（在你意识到为晚之前，值可能在你没有察觉的情况下发生了变化）。\n\
  \n当然，也可以认为这种简单性实际上让你的代码更难以理解。显式地指定参数可以让你一眼看出发生了什么变化。如果你看到一个读取 `FunctionName(val1,\
  \ out val2)` 的调用，你立即知道 `val1` 和 `val2` 是需要考虑的重要变量，并且 `val2` 在函数完成后将被分配一个新值。相反，如果这个函数没有接受参数，那么你就无法对它所操作的数据做任何假设。\n\
  \n请随意使用任何技术来交换数据。通常情况下，请使用参数而不是全局数据；然而，确实存在全局数据可能更合适的情况，使用那种技术当然不是错误。\n\n## `Main()`\
  \ 函数\n\n现在你已经涵盖了创建和使用函数时用的的大简单技术，是时候仔细观察 `Main()` 函数了。\n\n早些时候你看到 `Main()` 是 C#\
  \ 应用程序的入口点，该函数的执行包含了应用程序的执行。也就是说，当启动执行时，`Main()` 函数执行；当 `Main()` 函数结束时，执行结束。\n\n\
  `Main()` 函数可以返回 `void` 或 `int`，并可以可选包含一个 `string[] args` 参数，因此你可以使用以下任何版本：\n\n```\n\
  static void Main()\nstatic void Main(string[] args)\nstatic int Main()\nstatic int\
  \ Main(string[] args)\n```\n\n第三和第四种版本返回一个 `int` 值，该值可以表示应用程序如何终止，通常被用作错误的指示（尽管这绝非强制性的）。通常，返回\
  \ 0 反映正常终止（即应用程序已完成并可以安全退出）。\n\n`Main()` 的可选参数 `args` 为提供了一种从应用程序外部获取运行时指定信息的方法。这些信息以命令行参数的形式存在。\n\
  \n当执行控制台应用程序时，任何指定的命令行参数都会被放在 `args` 数组中。然后你可以在应用程序中使用这些参数。下方的“尝试一下”展示了这一点。你可以指定任意数量的命令行参数，每个参数都将输出到控制台。\n\
  \n## 结构体函数 (Struct Functions)\n\n最后一节涵盖了在一个地方存储多个数据元素的结构体类型。结构体实际上能比这多得多。例如，它们不仅包含数据，还可以包含函数。这起初可能看起来有点奇怪，但实际上它非常有用。作为一个简单的例子，考虑以下结构体：\n\
  \n```\nstruct CustomerName\n{\n   public string firstName, lastName;\n}\n```\n\n\
  如果你有 `CustomerName` 类型的变量，并想向控制台输出全名，你被迫从它的组成部分构建名称。例如，对于一个名为 `myCustomer` 的 `CustomerName`\
  \ 变量，你可能会使用以下语法：\n\n```\nCustomerName myCustomer;\nmyCustomer.firstName = \"John\"\
  ;\nmyCustomer.lastName = \"Franklin\";\nWriteLine($\"{myCustomer.firstName} {myCustomer.lastName}\"\
  );\n```\n\n通过向结构体添加函数，你可以通过集中常用任务来简化这一点。例如，你可以如下所示向结构体类型添加适当的函数：\n\n```\nstruct\
  \ CustomerName\n{\n   public string firstName, lastName;\n   public string Name()\
  \ => firstName + \" \" + lastName;\n}\n```\n\n这看起来与你在本章看到的任何其他函数都很相似，只不过你没有使用 `static`\
  \ 修饰符。这样做的原因在书中后面会变得明朗；目前，只需要知道结构体函数不需要这个关键字即可。你可以如下所示使用此函数：\n\n```\nCustomerName\
  \ myCustomer;\nmyCustomer.firstName = \"John\";\nmyCustomer.lastName = \"Franklin\"\
  ;\nWriteLine(myCustomer.Name());\n```\n\n这种语法比之前的语法简单得多，也更容易理解。`Name()` 函数可以直接访问\
  \ `firstName` 和 `lastName` 结构体成员。在 `customerName` 结构体内部，它们可以被认为是全局的。\n\n## 函数重载\
  \ (Overloading Functions)\n\n在本章的早些时候，你已经了在调用函数时必须匹配函数的签名。这意味着你需要不同的函数来操作不同类型的变量。函数重载使你能够创建同名的多个函数，但每个函数处理不同的参数类型。例如，早些你使用了以下代码，它包含一个名为\
  \ `MaxValue()` 的函数：\n\n```\nclass Program\n{\n   static int MaxValue(int[] intArray)\n\
  \   {\n      int maxVal = intArray[0];\n      for (int i = 1; i < intArray.Length;\
  \ i++)\n      {\n         if (intArray[i] > maxVal)\n            maxVal = intArray[i];\n\
  \      }\n      return maxVal;\n   }\n   static void Main(string[] args)\n   {\n\
  \      int[] myArray = { 1, 8, 3, 6, 2, 5, 9, 3, 0, 2 };\n      int maxVal = MaxValue(myArray);\n\
  \      WriteLine(\"The maximum value in myArray is {maxVal}\");\n      ReadKey();\n\
  \   }\n}\n```\n\n\n\n\n\n此函数仅用于 `int` 值的数组。你可以为不同的参数类型提供不同的命名函数，或许可以将前面的函数重命名为 `IntArrayMaxValue()`，并添加如\
  \ `DoubleArrayMaxValue()` 等函数来处理其他类型。或者，你也可以直接向代码中添加以下函数：\n\n```cs\n static double\
  \ MaxValue(double[] doubleArray)\n   {\n      double maxVal = doubleArray[0];\n\
  \      for (int i = 1; i < doubleArray.Length; i++)\n      {\n         if (doubleArray[i]\
  \ > maxVal)\n            maxVal = doubleArray[i];\n      }\n      return maxVal;\n\
  \   }\n```\n\n这里的区别在于你使用的是 `double` 值。函数名 `MaxValue()` 是相同的，但（关键点在于）它的 `signature`（签名）是不同的。这是因为如前面所示，函数的签名包含了函数名和它的参数。定义两个签名相同的函数是错误，但这两个函数的签名不同，所以这是可以的。\n\
  \n在添加上述代码后，你就有了两个版本的 `MaxValue()`，它们分别接受 `int` 和 `double` 数组，并分别返回 `int` 或 `double`\
  \ 最大值。\n\n这种代码的妙之处在于，你不需要显式指定要使用这两个函数中的哪一个。你只需要提供一个数组参数，系统就会根据使用的参数类型执行正确的函数。\n\n\
  注意 Visual Studio 中 IntelliSense 功能的另一个方面：当你在应用程序中使用前面所示的两个函数并开始输入函数名（例如 `Main()`时，IDE\
  \ 会向你显示该函数可用的重载版本。例如，如果你输入\n\n```cs\n double result = MaxValue(\n```\n\nIDE 会为你提供关于两个版本\
  \ `MaxValue()` 的信息，你可以使用向上和向下方向键在它们之间切换，如 图 6.9 所示。\n\n![Image described by surrounding\
  \ text.](img/c06f009.jpg)\n\n**图 6.9**\n\n在重载函数时，函数签名的所有方面都包含在内。例如，你可以拥有两个不同的函数，分别按值和引用传递参数：\n\
  \n```cs\nstatic void ShowDouble(ref int val)\n{\n   …\n}\nstatic void ShowDouble(int\
  \ val)\n{\n   …\n}\n```\n\n决定使用哪个版本完全取决于函数调用是否包含 `ref` 关键字。以下代码将调用引用版本：\n\n```cs\n\
  ShowDouble(ref val);\n```\n\n这将调用值版本：\n\n```cs\nShowDouble(val);\n```\n\n或者，你也可以拥有在所需参数数量等方面有不同的函数等。\n\
  \n## 使用委托 (Delegates)\n\n`delegate`（委托）是一种允许你存储函数引用的类型。尽管听起来相当复杂，但其机制却惊奇地简单。委托最重要的用途将在本书后后当你查看事件和事件处理时变得明朗，但在这里简要考虑它们是有帮助的。委托的声明方式与函数相似，但没有函数体，并使用\
  \ `delegate` 关键字。委托声明指定了返回类型和参数列表。\n\n定义委托后，你可以声明一个类型为该委托的变量。你可以将该变量初始化为任何返回类型和参数列表与该委托相同的函数引用。一旦完成此操作，你就可以像使用函数一样使用委托变量来调用该函数。\n\
  \n当你有一个引用函数的变量时，还可以执行其他在 otherwise 无法的操作。例如，你可以将委托变量作为参数传递给函数，然后该函数可以使用该委托来调用它所引用的任何函数，而无需在运行时知道将调用哪个函数。下面的\
  \ Try It Out 演示了如何使用委托访问两个函数之一。\n\n## ![image](img/c02g003.jpg) 你在这一章中学到的内容\n\n\
  | **主题** | **核心概念** |\n| :--- | :--- |\n| 定义函数 | 函数通过名称、零或多个参数以及返回类型来定义。函数的名称和参数共同定义了函数的签名。可以定义多个名称相同但签名不同的函数——这被称为\
  \ `function overloading`（函数重载）。函数也可以定义在 `struct` 结构类型中。 |\n| 返回值和参数 | 函数的返回类型可以是任何类型，如果函数不返回结果，则为\
  \ `void`。参数也可以是任何类型，由类型和名称对的逗号分隔的列表组成。可以通过参数数组指定指定类型的可变数量参数。可以将参数指定为 `ref` 或 `out`\
  \ 参数，以便向调用者返回值。在调用函数时，指定的任何参数在类型和顺序上都必须与定义中的参数匹配，并且如果参数定义中使用了 `ref` 和 `out` 关键字，则必须包含匹配的关键字。\
  \ |\n| 变量作用域 | 变量的作用域根据其定义的代码块。代码块包括方法以及其他结构（例如循环体）。可以在不同的作用域级别定义多个同名的独立变量。 |\n\
  | 命令行参数 | 控制台应用程序中的 `Main()` 函数可以接收执行时传递给程序的命令行参数。在执行应用程序时，这些参数通过空格分隔的参数指定，较长的参数可以用引号传递。\
  \ |\n| 委托 | 除了直接调用函数外，还可以通过委托调用函数。委托是使用返回类型和参数列表定义的变量。给定的委托类型可以匹配任何返回类型和参数匹配的方法。\
  \ |\n\n\n\n\n\n通常，在用户抱怨某些功能运行不正常之前，你并不知道这些细微的错误。这让你面临一项任务：追踪代码以找出发生了什么，并修复它使其能够按照预期工作。在这些情况下，Visual\
  \ Studio 的调试功能是非常有的。本章的第一部分将介绍一些可用技术，并将它们应用于一些常见问题中。\n\n然后，你将学习 C# 中提供的错误处理技术。这些技术允许你在可能发生错误的情况下采取预防措施，并编写足够健壮的代码来处理可能导致致命的错误。这些技术是\
  \ C# 语言的一部分，而不是调试功能，但 IDE 也提供了一些工具来帮助你。\n\n## 在 Visual Studio 中调试\n\n在此之前，你已经学习了可以通过两种方式执行应用程序：启用调试或不启用调试。默认情况下，当你从\
  \ Visual Studio (VS) 运行应用程序时，它会在启用调试的情况下运行。例如，当你按下 `F5` 或点击工具栏上的绿色启动箭头时就会发生。若要在不启用调试的情况下执行应用程序，请选择\
  \ `调试` ![1](img/arrow.png)启动（无调试），或按下 `Ctrl+F5`。\n\nVisual Studio 允许你多种配置下生成应用程序，包括\
  \ `Debug`（默认）和 `Release`。你可以使用标准工具栏中的解决方案配置下拉菜单在这些配置之间切换。\n\n当你在调试配置中生成应用程序并在调试模式下执行时，发生的操作比执行你的代码要多。调试生成维护着有关应用程序的`符号信息`（symbolic\
  \ information），这样 IDE 在执行每行代码时都能确切知道正在发生什么。符号信息意味着跟踪（例如）未编译代码中使用的变量名称，以便它们可以与编译后的机器代码应用程序中的值进行匹配，而机器代码中不包含此类人类可读的信息。这些信息包含在\
  \ `.pdb` 文件中，你可能在计算机的 `Debug` 目录中见过它们。\n\n在发布配置中，应用程序代码经过了优化，你无法执行这些操作。然而，发布版本的运行速度更快；当你完成应用程序的开发后，通常会向用户提供发布版本，因为它们不需要调试版本中包含的符号信息。\n\
  \n本节描述了你可以用于识别和修复不符合预期代码区域的调试技术，这一过程被称为调试。这些技术根据其使用方式分为两个部分。通常，调试是通过中断程序执行或记录笔记以备日后分析完成的。在\
  \ Visual Studio 术语中，应用程序要么正在运行，要么处于断点模式——即正常执行已停止。你将首先查看非断点模式（运行时或正常模式）技术。\n\n###\
  \ 在非断点（正常）模式下调试\n\n你在整书中一直在使用的命令之一是 `WriteLine()` 函数，它向控制台输出文本。在你开发应用程序时，此函数对于获取操作的额外反馈非常有用：\n\
  \n```\nWriteLine(\"MyFunc() Function about to be called.\");\nMyFunc(\"Do something.\"\
  );\nWriteLine(\"MyFunc() Function execution completed.\");\n```\n\n这段代码段显示了你如何获取有关调用函数\
  \ `MyFunc()` 的额外信息。这虽然很好，但可能会让你的控制台输出变得有些杂乱；而且当你开发其他类型的应用程序（如桌面应用程序）时，你将没有控制台来输出信息。作为替代方案，你可以将文本输出到单独的位置——IDE\
  \ 中的输出窗口。\n\n第 2 章输出。此窗口提供了与代码编译和执行相关的信息，包括编译期间遇到的错误。你也可以使用图 7.1 所示的窗口，通过直接向其写入来显示自定义诊断信息。\n\
  \n![输出窗口的截图，带有不同模式的下拉菜单，即生成、生成顺序、调试和部署。](img/c07f001.jpg)\n\n**图 7.1：输出窗口**\n\n\
  或者，你可能想要创建一个日志文件，在应用程序执行时向其追加信息。实现此操作的技术与向输出窗口写入文本相似，尽管该过程需要理解如何从 C# 应用程序访问文件系统。目前，请将该功能搁置一边，因为在不陷入文件访问技术细节的情况下，你还有很多事情可以做。\n\
  \n#### 输出调试信息\n\n在运行时向输出窗口写入文本很容易。你只需将对 `WriteLine()` 的调用替换为在你想要写入文本的地方所需的调用即可。你可以使用两个命令来实现这一点：\n\
  \n* `Debug.WriteLine()`\n* `Trace.WriteLine()`\n\n这些命令的功能几乎几乎完全相同，但有一个关键区别——第一个命令仅在调试生成版本中工作；后者也适用于发布生成版本。事实上，`Debug.WriteLine()`\
  \ 命令甚至不会被编译到发布版本中；它会直接消失，这无疑有其优势（例如，编译后的代码量会更小）。\n\n这些函数的工作方式与 `WriteLine()` 不完全相同。它们只接受一个用于输出消息的单个字符串参数，而不是允许你使用\
  \ `{X}` 语法插入变量值。这意味着你必须使用替代技术将变量值嵌入字符串中——例如使用 `+` 拼接运算符。你还可以（可选地）提供第二个字符串参数，作为输出的类别。这让你能够一目看出显示了哪些输出消息，当从不同地方输出相似的消息时非常有用。\n\
  \n这些函数的通用输出如下：\n\n```\n<类别>: <消息>\n```\n\n例如，以下语句带有可选类别参数 `\"MyFunc\"`，\n\n```\n\
  Debug.WriteLine(\"Added 1 to i\", \"MyFunc\");\n```\n\n结果将是\n\n```\nMyFunc: Added\
  \ 1 to i\n```\n\n下一个尝试将演示如何以这种方式输出调试信息。\n\n#### 跟踪点\n\n向输出窗口写入信息的替代方案是使用跟踪点（Tracepoints）。这些是\
  \ Visual Studio 的功能，而不是 C# 的，但它们的作用与使用 `Debug.WriteLine()` 相同。基本上，它们允许你在不修改代码的情况下输出调试信息。\n\
  \n为了演示跟踪点，你可以用它们替换之前示例中的调试命令。（请查看本章下载的代码中的 `Ch07Ex01TracePoints` 文件。）添加跟踪点的过程如下：\n\
  \n1. 将光标置于想要插入跟踪点的行上。跟踪点将在该行代码执行*之前*被处理。\n2. 右键点击代码行并选择`断点` ![1](img/arrow.png)插入跟踪点。右键点击代码行旁边的红圈并选择`设置`菜单项。\n\
  3. 勾选`操作`复选框，并在`日志消息`部分的文本框中输入要输出的字符串。如果你想输出变量值，请将变量名放在花括号中。\n4. 点击确定。包含跟踪点的代码行左侧会出现红色菱形，代码行本身将显示为红色。\n\
  \n\n\n\n\n正如添加跟踪点（tracepoints）的对话框标题以及创建所需的菜单选择所暗示的那样，跟踪点是断点的一种形式（如果需要，它可以像断点一样导致应用程序执行暂停）。在章的稍后部分将介绍断点，它们通常用于更高级的调试目的。\n\
  \n图 7.4 显示了 `Ch07Ex01TracePoints` 第 32 行所需的跟踪点，其中行号是在移除现有的 `Debug.WriteLine()` 语句后应用于代码的。\n\
  \n![断点设置窗口截图，显示了位置。Actions 复选框已勾选，并附有指向输出窗口的消息。底部的 Continue execution 复选框已勾选。](img/c07f004.jpg)\n\
  \n**图 7.4**\n\n还有另一个窗口可以快速查看应用程序中的跟踪点。要显示此窗口，从 Visual Studio 菜单中选择 `Debug` ![1](img/arrow.png)`Windows`\
  \ ![1](img/arrow.png)`Breakpoints`。这是一个显示断点的通用窗口（如前所述，跟踪点是断点的一种形式）。你可以通过在此窗口的 `Columns`\
  \ 下拉菜单中添加 `When Hit` 列来自定义显示，以显示更多特定于跟踪点的信息。图 7.5 显示了配置了此列并向 `Ch07Ex01TracePoints`\
  \ 添加了所有跟踪点的显示情况。\n\n![代码窗口截图，左侧显示跟踪点，中间显示代码。底部是 Breakpoints 窗口，显示了带有左侧复选框的跟踪点。](img/c07f005.jpg)\n\
  \n**图 7.5**\n\n在调试模式下运行此应用程序的结果与之前相同。你可以通过在代码窗口中右键点击跟踪点或通过 Breakpoints 窗口来删除或临时禁用跟踪点。在\
  \ Breakpoints 窗口中，跟踪点左侧的复选框指示跟踪点是否启用；禁用的跟踪点未勾选，并在代码窗口中显示为菱形轮廓，而不是实心菱形。\n\n## 诊断输出与跟踪点\n\
  \n现在你已经看到了两种输出本质上相同信息的方法，考虑每种优缺点。首先，跟踪点没有等同于 `Trace` 命令的内容；也就是说，无法在发布版本（release\
  \ build）中使用跟踪点输出信息。这是因为跟踪点没有被包含在你的应用程序中。跟踪点由 Visual Studio 处理，因此在应用程序的编译版本中不存在。只有当你的应用程序在\
  \ Visual Studio 调试器中运行时，你才会看到跟踪点在执行操作。\n\n跟踪点的主要缺点也是它们的主要优势，即它们存储在 Visual Studio\
  \ 中。这使得你可以根据需要快速方便地将其添加到应用程序中，但也使得它们太容易被删除了。删除跟踪点只需点击指示其位置的红色菱形，如果你正在输出一段复杂的信息字符串，这可能会令人困恼。\n\
  \n不过，跟踪点的一个优点是可以轻松地添加额外信息，例如 `$FUNCTION`，它将当前函数名称添加到输出消息中。虽然使用 `Debug` 和 `Trace`\
  \ 命令编写的代码也可以获取这些信息，但获取起来更为棘手。总之，请按如下方式使用这两种输出调试信息的方法：\n\n*   **诊断输出（Diagnostics\
  \ output）** —— 当调试输出是你始终想从应用程序输出的内容时使用，特别是你想输出的字符串很复杂，涉及多个变量或大量信息时。此外，如果你希望在发布模式构建的应用程序执行期间获得输出，`Trace`\
  \ 命令通常是唯一的选择。\n*   **跟踪点（Tracepoints）** —— 在调试应用程序时使用这些工具，快速输出可能帮助你解决语义错误的重要信息。\n\
  \n## 在中断模式下调试\n\n本章描述的其余调试技术都在中断模式（break mode）下工作。可以通过几种方式进入此模式，所有方式都会导致程序以某种方式暂停。\n\
  \n### 进入中断模式\n\n进入中断模式最简单的方法是在应用程序运行时点击 IDE 中的暂停（Pause）按钮。该暂停按钮位于 Debug 工具栏上，你应该将其添加到\
  \ Visual Studio 默认显示的工具栏中。要这样做，请在工具栏区域点击右键并选择 `Debug`。图 7.6 显示了出现的 Debug 工具栏。\n\n\
  ![Debug 工具栏截图，前三个按钮（暂停、停止和重启）显示为灰色。](img/c07f006.jpg)\n\n**图 7.6**\n\n工具栏上的前三个按钮允许手动控制中断。在图\
  \ 7.6 中，它们是灰色的，因为它们对当前未执行的程序不起。后续章节将根据需要描述其余按钮。\n\n当应用程序运行时，工具栏会变为像图 7.7 那样的样子。\n\
  \n![Debug 工具栏截图，前三个按钮（暂停、停止和重启）已启用。](img/c07f007.jpg)\n\n**图 7.7**\n\n之前灰色的三个按钮现在允许你执行：\n\
  \n*   暂停应用程序并进入中断模式。\n*   完全停止应用程序。\n*   重启应用程序。\n\n### 断点（Breakpoints）\n\n断点是源代码中的一个标记，用于触发自动进入中断模式。断点可以配置为：\n\
  \n*   当到达断点时立即进入中断模式。\n*   当到达断点且布尔表达式为 `true` 时进入中断模式。\n*   在达到指定的次数后进入中断模式。\n\
  *   当到达断点且自上次到达以来变量值发生变化时进入中断模式。\n\n这些功能仅在调试版本可用。如果你编译发布版本，所有断点都会被忽略。\n\n添加断点有多种方法。要添加到达行时的的断点，只需点击代码行的左侧。或者，你可以右键点击该行并选择\
  \ `Breakpoint` ![1](img/arrow.png)`Insert Breakpoint`，从菜单中选择 `Debug` ![1](img/arrow.png)`Toggle\
  \ Breakpoint`，或者按 `F9`。\n\n断点显示为代码行旁边的一个红色圆圈，如图 7.8 所示。\n\n![代码窗口截图，左侧显示代码行，中间显示代码，第\
  \ 21 行代码旁边的圆圈表示断点。](img/c07f008.jpg)\n\n**图 7.8**\n\n你还可以使用 Breakpoints 窗口查看文件的断点信息（你之前已经见过如何启用此窗口）。你可以使用\
  \ Breakpoints 窗口禁用断点（移除描述左侧的标记；禁用的断点显示为空心红色圆圈）、删除断点以及编辑断点的属性。你还可以为断点添加标签，这是对选定断点进行分组的方法。你可以在\
  \ `Labels` 列中查看标签，并根据标签过滤此窗口显示的项目。\n\n\n\n\n此窗口中显示的其他列（`Condition` 和 `Hit Count`）只是可用列中的两个，但它们是最实用的。你可以通过右键点击断点（在代码中或在此窗口中）并选择\
  \ `Condition` 或 `Hit Count` 来编辑这些项。\n\n选择 `Condition` 会打开一个对话框，你可以在其中输入任何布尔表达式，该表达式可能涉及断点作用范围内的任何变量。例如，你可以通过输入表达式\
  \ `\"maxVal` `>` `4\"` 并选择 `Is` `true` 选项，配置一个在达到此处且 `maxVal` 的值大于 4 时触发的断点。你还可以检查此表达式的值是否发生了变化，并仅在变化时才触发断点（例如，如果在两次遇到断点之间，`maxVal`\
  \ 从 2 变为 6，你可能会触发它）。\n\n选择 `Hit Count` 会打开一个对话框，你可以在其中指定断点在触发前需要命中多少次。下拉列表提供了以下选项：\n\
  \n*   始终中断 (Break always)\n*   当命中计数等于时中断 (Break when the hit count is equal to)\n\
  *   当命中计数是...的倍数时中断 (Break when the hit count is a multiple of)\n*   当命中计数大于或等于时中断\
  \ (Break when the hit count is greater than or equal to)\n\n你选择的选项结合选项旁文本框中输入的值，决定了断点的行为。命中计数在长循环中非常有用，例如，你可能希望在运行\
  \ 5,000 次循环后中断。如果你不能做到这一点，手动中断并重启 5,000 次将是痛苦！\n\n### 进入断点模式的其他方法\n\n进入断点模式还有另外两种方法。一种是在抛出未处理的异常时进入。该主题将在本章节稍后查看错误处理时进行介绍。另一种方法是在生成断言（assertion）时进行中断。\n\
  \n断言是特殊的指令，可以带有一个用户定义的消息来中断应用程序的执行。它们通常在应用程序开发期间使用，用于测试程序运行是否顺畅。例如，在应用程序的某处，你可能要求给定变量的值小于\
  \ 10。你可以使用断言来确认这一点是否成立，如果不成立则中断程序。当断言发生时，你有权选择：`Abort`（中止），这将终止应用程序；`Retry`（重试），这将进入断点模式；或\
  \ `Ignore`（忽略），这将使应用程序继续运行。\n\n与之前显示的调试输出函数一样，断言函数有两个版本：\n\n*   `Debug.Assert()`\n\
  *   `Trace.Assert()`\n\n再次，调试版本仅被编译到调试生成中。\n\n这些函数接受三个参数。第一个是布尔值，值为 `false` 时会触发断言。第二个和第三个是字符串参数，用于将信息写入弹出对话框和输出（Output）窗口。上一个示例需要如下的函数调用：\n\
  \n```\nDebug.Assert(myVar < 10, \"myVar is 10 or greater.\",\n             \"Assertion\
  \ occurred in Main().\");\n```\n\n断言在用户采用应用程序的早期阶段通常有用。你可以分发包含 `Trace.Assert()`\
  \ 函数的应用程序发布版本以监控情况。如果触发了断言，用户将收到通知，并且这些信息可以传递给你。这样，即使你不知道错误是如何发生的，也可以确定可能出了什么问题。\n\
  \n例如，你可以在第一个字符串中提供错误的错误的简要描述，并在第二个字符串中提供后续操作的指示：\n\n```\nTrace.Assert(myVar < 10,\
  \ \"Variable out of bounds.\",\n             \"Please contact vendor with the error\
  \ code KCW001.\");\n```\n\n如果发生此断言，用户将看到图 7.9 所示的对话框。\n\n![断言失败的对话框截图，包含三个按钮：Abort、Retry\
  \ 和 Ignore。](img/c07f009.jpg)\n\n**图 7.9**](#c07.xhtml_c07-fig-anc-0009)\n\n诚然，这并不是世界上最对用户友对话框，因为它包含了许多可能会让用户困惑的信息，但如果他们向你发送错误截图，你就可以快速追踪问题。\n\
  \n现在是时候看看在应用程序执行停止且你处于断点模式后实际上可以做些什么。通常情况下，你进入断点模式是为了找到代码中的错误（或让你确信一切运行正常）。一旦进入断点模式，你就可以使用各种技术，所有这些都能允许你分析代码以及应用程序在执行暂停点处的确切状态。\n\
  \n### 监控变量内容\n\n监控变量内容只是 Visual Studio 通过简化操作来极力帮助你的一个示例。检查变量值最简单的方法是在断点模式下，将鼠标悬停在源代码中的变量名称上。这时会出现一个显示变量信息的提示框，包括变量的当前值。\n\
  \n你还可以以相同的方式高亮整个表达式以获取有关其结果的信息。对于更复杂的值（如数组），你甚至可以扩展提示框中的值以查看单个元素条目。\n\n可以将这些提示框窗口固定（pin）到代码视图，如果你有一个特别感兴趣的变量，这会很有用。固定的提示框会持续存在，因此即使你停止并重启调试，它们仍然可用。你还可以为固定的提示框添加注释、移动它们，并即使在应用程序未运行时查看上一个变量的值。\n\
  \n你可能已经注意到，当你运行应用程序时，各种窗口的布局会发生变化。默认情况下，可能会发生以下情况：\n\n*   `Properties` 窗口消失，包括 `Solution\
  \ Explorer` 在内的其他窗口消失。\n*   `Error List` 窗口被底部的两个新窗口取代。\n*   新窗口出现了几个新标签页。\n\n新布局如图\
  \ 7.10 所示。这可能与你的显示不匹配，某些标签页看起来也不完全一样，但稍后介绍这些窗口的功能是相同的，这种显示可以通过拖动窗口进行自定义。\n\n![调试窗口截图，底部有\
  \ Locals 和 Output 窗口。](img/c07f010.jpg)\n\n**图 7.10**](#c07.xhtml_c07-fig-010)\n\
  \n左下出现的新窗口对调试特别有用。它允许你在断点模式下监控应用程序变量的值\n\n*   `Autos` —— 当前和之前语句使用的变量（`Ctrl+D`,\
  \ `A`）\n*   `Locals` —— 范围内的所有变量（`Ctrl+D`, `L`）\n*   `Watch` N —— 自定义变量和表达式显示（`N`\
  \ 为 1 到 4，位于 `Debug` `Watch`）\n\n所有这些标签页的工作大体相同，根据其特定功能具有各种附加功能。通常，每个标签页包含变量列表，以及变量名称、值和类型的信息。更复杂的变量（如数组）可以通过名称左侧的\
  \ `+` 和 `–` 树展开/折叠符号进一步检查，从而内容的树视图。例如，图 7.11 显示了在示例代码中放置断点后获得的 `Locals` 标签页。它显示了数组变量\
  \ `maxValIndices` 的展开视图。\n\n\n\n\n你也可以从此视图编辑变量的内容。这有效地绕过了早先代码中可能发生的任何其他变量赋值。要执行此操作，只需在你想要编辑的变量的\
  \ `Value` 列中输入新值即可。例如，你可以这样做来尝试某些在其他需要更改代码才能测试的场景。\n\n监视（Watch）窗口允许你监控特定的变量，或涉及特定变量的表达式。要使用此窗口，在\
  \ `Name` 列中输入变量或表达式的名称并查看结果。注意，应用程序中的所有变量并非始终处于作用范围内，它们在监视窗口中会被标记为此类。例如，图 7.12 显示了一个包含几个示例变量和表达式的监视窗口，这是在到达\
  \ `Maxima()` 函数结束之前的断点时获取的。\n\n![周围文字描述的图像。](img/c07f012.jpg)\n\n图 7.12\n\n`testArray`\
  \ 数组是 `Main()` 的局部变量，因此你在这里看不到它的值，它是呈灰色的。\n\n### 逐行执行代码\n\n到为止，你已经学习了如何在进入断点模式时发现你的应用程序中发生了什么。现在是时候如何可以使用\
  \ IDE 在保持断点模式的同时逐行执行代码了，这让你能够看到执行代码的准确结果。对于我们这些思考速度没有计算机那么快的人来说，这是一项非常有价值的技术。\n\n\
  当 Visual Studio 进入断点模式时，代码视图左侧会出现一个黄色箭头光标（如果最初使用断点进入断点模式，它最初可能出现在断点的红圈内），位于即将执行的代码行旁边，如图\
  \ 7.13 所示。\n\n![Visual Studio 在断点模式和代码视图的截图，显示代码行 int[] testArray = { 4, 7, 4, 2,\
  \ 7, 3, 7, 8, 3, 9, 1, 9 };，左侧箭头指向此处。所有 int 类型都已高亮。](images/c07f013.jpg)\n\n图 7.13\n\
  \n这显示了进入断点模式时执行已到了哪个点。在此时，你可以逐行执行程序。要执行此操作，你可以使用图 7.14 所示的某些调试工具栏按钮。\n\n![调试工具栏按钮的截图。](img/c07f014.jpg)\n\
  \n图 7.14\n\n第六、第七和第八个图标控制断点模式下的程序流。它们按顺序如下：\n\n*   **单步进入（Step Into）** — 执行并移动到下一个要执行的语句。\n\
  *   **逐过程（Step Over）** — 与单步进入类似，但不会进入嵌套的代码块（包括函数）。\n*   **单步跳（Step Out）** — 运行到代码块结束，并在后续语句处恢复断点模式。\n\
  \n为了查看应用程序执行的每项操作，你可以使用单步进入按顺序跟踪指令。这包括移动函数内部，例如前一个示例中的 `Maxima()`。当光标到达第 17 行（即调用\
  \ `Maxima()` 的行）时点击此图标，光标将移动到 `Maxima()` 函数内部的第一行。或者，当到达第 17 行时点击逐过程，光标将直接移动到第 18\
  \ 行，而不通过 `Maxima()` 中的代码（尽管这些代码仍会被执行）。如果你进入了一个你不感兴趣的函数，可以点击单步跳返回到调用该函数的代码。当你逐行执行代码时，变量的值可能会改变。如果你密切关注刚才讨论的监控窗口，就可以清楚地看到这种变化的发生。\n\
  \n你还可以通过右键点击代码行并选择`设置下一语句（Set Next Statement）`，或者通过将黄色箭头拖到不同的代码行来更改下一个将执行的代码行。这并不总是有效，例如跳过变量初始化。然而，它对于跳过问题的代码行以查看会发生什么，或者通过将箭头向后移动来重复执行代码非常有用。\n\
  \n在存在语义错误的代码中，这些技术可能是你手头最有用的工具。你可以逐行执行代码，直到你预期问题发生点，错误将像你正常运行程序一样生成。或者，你可以通过更改执行的代码来使语句执行多次。在此过程中，你可以观察数据以看到底哪里出了问题。在本章的后半部分，你将逐行执行一些代码以找出示例应用程序中发生了什么。\n\
  \n### 命令窗口和立即窗口\n\n命令（Command）窗口和立即（Immediate）窗口（在“调试窗口”菜单中找到）允许你在应用程序运行时执行命令。命令窗口允许你手动执行\
  \ Visual Studio 操作（如菜单和工具栏操作），立即窗口允许你在执行正在执行的源代码行之外执行额外代码并评估表达式。\n\n这些窗口在本质上是关联的。你甚至可以通过输入命令在它们之间切换——输入\
  \ `immed` 从命令窗口移动到立即窗口，输入 `cmd` 移动回来。\n\n\n\n\n`Error handling` 是此类所有技术的统称，本节将介绍异常以及你如何处理它们。异常是在你的代码中或在你代码所调用的函数中运行时产生的错误。这里对“错误”（error）的定义比此之前的更模糊，因为异常可能是手动生成的、在函数中生成的等等。例如，如果一个函数的某个字符串参数没有以字母“a”开头，你可能会在该函数中生成一个异常。严格来说，这在函数语境之外并不算作一个错误，尽管调用该函数的代码将其视为一个错误。\n\
  \n你已经在书中见过几次异常了。也许最简单的例子是尝试访问一个超出范围的数组元素：\n\n```\nint[] myArray = { 1, 2, 3, 4 };\n\
  int myElem = myArray[4];\n```\n\n这会输出以下异常消息，然后终止应用程序：\n\n```\nIndex was outside\
  \ the bounds of the array.\n```\n\n异常定义在命名空间中，大多数异常的名称都能清楚说明其用途。在这个示例中，生成的异常被称为\
  \ `System.IndexOutOfRangeException`，这是很合理的，因为你提供的索引不在 `myArray` 允许的索引范围内。只有当异常未被处理时，此消息才会出现，应用程序才会终止。在下一节中，你将看到处理异常具体需要做什么。\n\
  \n### try…catch…finally\n\nC# 语言包含了用于结构化异常处理（SEH）的语法。三个关键字标记代码能够处理异常，并带有指定发生异常时执行何操作的指令：`try`、`catch`\
  \ 和 `finally`。这些每个关键字都有一个关联的代码块，并且必须在连续的代码中使用。其基本结构如下：\n\n```\ntry\n{\n   …\n}\n\
  catch (<exceptionType> e) when (filterIsTrue)\n{\n   <await methodName(e);>\n  \
  \ …\n}\nfinally\n{\n   <await methodName;>\n   …\n}\n```\n\nC# 6 引入了在 `catch` 或\
  \ `finally` 块中可选地使用 `await` 功能。`await` 关键字用于支持高级的异步编程技术，这些技术可以避免瓶颈并提高应用程序的整体性能和响应能力。利用\
  \ `async` 和 `await` 关键字的异步编程在书中并未讨论；尽管如此，由于这些关键字确实简化了这种编程技术的实现，因此强烈建议学习它们。\n\n然而，也可以拥有没有\
  \ `catch` 块的 `try` 块和 `finally` 块，或者带有多个 `catch` 块的 `try` 块。如果存在一个或多个 `catch` 块，则\
  \ `finally` 块是可选的；否则，它是强制。这些块的使用如下：\n\n* `try` — 包含可能抛出异常的代码（`throw` 是 C# 在讨论异常时表示“生成”或“引起”的方式）。\n\
  * `catch` — 包含在抛出异常时执行的代码。`catch` 块只能使用 `<exceptionType>` 对特定的异常类型（例如 `System.IndexOutOfRangeException`）做出响应，因此能够提供多个\
  \ `catch` 块。也可以完全省略此参数，以获得一个响应所有异常的通用 `catch` 块。C# 6 引入了一个名为“异常过滤”（exception filtering）的概念，通过在异常类型表达式后添加\
  \ `when` 关键字来实现。只有当该异常类型发生且过滤表达式为真时，`catch` 块中的代码才会执行。\n* `finally` — 包含始终会被执行的代码，可以在\
  \ `try` 块未发生异常后执行，在异常被处理后执行（catch 块之后），或者在未处理的异常向“调用堆栈”移动之前执行。这个短语意味着 SEH 允许将 `try…catch…finally`\
  \ 块嵌套在一起，无论是直接嵌套，还是因为在 `try` 块中调用了函数。例如，如果异常没有被被调用函数中的任何 `catch` 块处理，它可能会被调用代码中的\
  \ `catch` 块处理。最终，如果没有匹配到任何 `catch` 块，应用程序将终止。`finally` 块在此发生之前被处理的这一事实就是它存在的原因；否则，你大可以可以将代码放在\
  \ `try…catch…finally` 结构之外。这种嵌套功能将在稍后的“异常处理注意事项”部分中进一步讨论，所以如果听起来有点困惑请不要担心。\n\n以下是\
  \ `try` 块中的代码发生异常后的事件顺序，如图 7.18 所示。\n\n* `try` 块在异常发生点终止。\n* 如果存在 `catch` 块，则将进行检查以确定该块是否匹配抛出的异常类型。如果没有\
  \ `catch` 块，则执行 `finally` 块（如果没有 `catch` 块，则它必须存在）。\n* 如果存在 `catch` 块但没有匹配，则将检查其他\
  \ `catch` 块。\n* 如果 `catch` 块匹配异常类型且存在结果为 `true` 的异常过滤器，则执行其内部的代码，然后执行 `finally`\
  \ 块（如果存在的话）。\n* 如果 `catch` 块匹配异常类型且没有异常过滤器，则执行其包含的代码，然后执行 `finally` 块。\n* 如果没有 `catch`\
  \ 块匹配异常类型，则执行 `finally` 块。\n\n![try 块中的代码发生异常后的事件流程图。](img/c07f18.jpg)\n\n### 列出和配置异常\n\
  \n.NET Framework 包含了大量的异常类型，你可以自由地在代码中抛出并处理这些任何异常。IDE 提供了一个对话框用于查看和编辑可用异常，可以通过“异常设置”菜单（或按\
  \ Ctrl+D, E）调用。图 7.20 显示了异常设置对话框。\n\n![选择了常见运行时异常的异常设置对话框截图。(images/c07f20.jpg)\n\
  \n异常按类别和 .NET 库命名空间列出。通过展开常见运行时异常加号，你可以看到之前使用的 `System.IndexOutOfRangeException`\
  \ 异常。\n\n每个异常都可以使用类型旁边的复选框进行配置。勾选后，调试器将在“抛出”（Thrown）时中断，即使是对于已处理的异常也会进入调试器。\n\n\n\
  \n\n\n| 中断模式 | 你可以手动进入中断模式（本质上是应用程序暂停的状态），也可以通过断点、断言，或在发生未处理的异常时进入该模式。你可以在代码的任何地方添加断点，并配置断点仅在特定条件下中断执行。在中断模式下，你可以检查变量的内容（借助各种调试信息窗口），并逐行步进代码，以帮助你确定错误所在的位置。\
  \ | |\n| 异常 | 异常是在运行时发生的错误，你可以通过程序化的捕获和处理这些错误，以防止应用程序终止。在调用函数或操作变量时，可能会发生许多类型的异常。你还可以使用\
  \ `throw` 关键字生成异常。 |\n| 异常处理 | 代码中未处理的异常将导致应用程序终止。你使用 `try`、`catch` 和 `finally`\
  \ 代码块来处理异常。`try` 块标记了一段启用了异常处理的代码。`catch` 块包含仅在发生异常时才执行的代码，并可以匹配特定类型的异常。你可以包含多个\
  \ `catch` 块。`finally` 块指定了在异常处理发生后或在未发生异常且 `try` 块完成后执行的代码。你只能包含一个 `finally` 块，而且如果你包含了任何\
  \ `catch` 块，则 `finally` 块是可选的。 |\n\n# 第 8 章：面向对象编程简介\n\n## 本章的 Wrox.com 代码下载\n\n\
  你可以在“下载代码”（Download Code）选项卡中，通过 [`www.wrox.com/go/beginningvisualc#2015programming`](http://www.wrox.com/go/beginningvisualc#2015programming)\
  \ 找到本章的 `wrox.com` 下载中，并根据章节中的名称单独命名。\n\n在书的目前阶段，你已经涵盖了 C# 语法和编程的所有基础，并学会了如何调试你的应用程序。你已经能够装配可用的控制台应用程序。然而，要发挥\
  \ C# 语言和 .NET Framework 的真正威力，你需要利用面向对象编程（OOP）技术。事实上，正如你很快看到的，你已经在使用这些技术了，尽管为了保持简单，我们还没有重点介绍这一点。\n\
  \n本章暂时避开代码，转而关注 OOP 背后的原理。这引导你回到 C# 语言，因为它与 OOP 具有共生关系。本章介绍的所有概念将在后面的章节中重新回顾，并配有说明性代码——所以如果你在第一次阅读这些材料时没有理解所有内容，请不要恐慌。\n\
  \n首先，你将学习 OOP 的基础，包括回答那个最基本的问题：“什么是对象？”你会很快发现，许多与 OOP 相关的术语起初可能会令人困惑，但书中提供了大量的解释。你还会发现，使用\
  \ OOP 要求你以不同的方式来看待编程。\n\n在讨论 OOP 通用原则的同时，本章还研究了一个需要深入理解 OOP 的领域：桌面应用程序。这种类型的应用程序依赖于\
  \ Windows 环境，具有菜单、按钮等功能。因此，它提供了大量的描述空间，你能够在 Windows 环境中有效地观察 OOP 的要点。\n\n## 什么是面向对象编程？\n\
  \n面向对象编程旨在解决传统编程技术中的许多问题。你到为止所看到的编程类型被称为过程化编程，它通常会导致所谓的“单体式应用程序”，意味着所有功能都包含在少数代码模块中（通常只有一个）。使用\
  \ OOP 技术时，你通常会使用更多的代码模块，每个模块提供特定的功能。此外，每个模块都可以与其他模块隔离，甚至完全独立。这种模块化的编程方法赋予了你更强的灵活性，并提供了更多代码重用的机会。\n\
  \n为了进一步说明这一点，想象你电脑上的一款高性能应用程序是一辆顶级的赛车。用传统的编程技术编写的这辆跑车基本上是一个单一单元。如果你想改进这辆车，就必须将整个单元送回制造商，让他们的专家技师进行升级，或者直接买一辆新的。然而，如果使用了\
  \ OOP 技术，你只需要从制造商那里买一个新引擎，并按照他们的说明自行更换，而无需用电锯去割车身。\n\n在更传统的应用程序中，执行流通常是简单且线性的。应用程序被加载到内存中，从\
  \ A 点开始执行，在 B 点结束，然后从内存中卸载。在此过程中可能会使用各种其他实体，例如存储介质上的文件或显卡的功能，但处理主体发生在一个地方。沿途的代码通常关注于通过各种数学和逻辑手段操作数据。操作方法通常非常简单，使用整数和布尔值等基本类型来构建更复杂的数据表示。\n\
  \n使用 OOP，情况很少是这样线性的。尽管实现了相同的的结果，但实现的方法往往非常不同。OOP 技术深根于数据的结构和含义，以及数据与其他数据之间的交互。这通常意味着要在项目设计阶段投入更多精力，但它具有可扩展的优点。一旦对特定类型的数据表示达成共识，这种协议就可以应用应用程序的后续版本中，甚至是完全全新的应用程序中。这种协议的存在可以极地缩短开发时间。这解释了赛车的例子是如何运作的。这里的协议是“引擎”代码的结构方式，使得新代码（新引擎）可以轻松地替换，而无需返回制造商。这也意味着引擎一旦创建，就可以用于其他用途。例如，你可以把它放在另一辆车上，或者用它来驱动潜水艇。\n\
  \nOOP 通过提供关于数据表示以及更抽象实体的结构和用法的协议，通常可以简化问题。例如，可以对发送到打印机等设备输出的数据格式达成协议，还可以对与该设备的数据交换方法达成协议，包括它理解的指令等。在赛车的类比中，协议将包括引擎如何连接到油箱、如何将驱动力传递给轮子等。\n\
  \n正如技术的名称所言，这是通过对象实现的。\n\n### 什么是对象？\n\n对象是 OOP 应用程序的构建块。这个构建块封装了应用程序的一部分，可以是一个过程、一段数据或一个更抽象的实体。\n\
  \n在最简单的意义上，一个对象可以与书中之前显示的 struct 类型非常相似，包含变量和函数类型的成员。包含的变量构成了存储在对象中的数据，包含的函数允许访问对象的功能。稍微复杂的对象可能不维护任何数据；相反，它们通过仅包含函数来表示一个过程。例如，代表打印机的对象可能会被使用，它将拥有控制打印机的函数（这样你可以打印文档、测试页等）。\n\
  \n\n\n\n\nC# 中的对象是根据类型创建的，就像你见过的变量一样。在面向对象编程（OOP）中，对象的类型有一个特殊的名称，即 `class`（类）。你可以使用类定义来\
  \ `instantiate`（实例化）对象，这意味着创建一个类的真实的、具名的 `instance`（实例）。在这里在这里，`instance of a class`\
  \ 和 `object`（对象）的意思是一样的；但 `class` 和 `object` 在本质上是完全不同的。\n\n在本章中，你将使用统一建模语言（Unified\
  \ Modeling Language，简称 UML）来处理类和对象。UML 用于建模应用程序，从构建应用的对象的，到它们执行的操作，再到预期的用例。在这里，你仅使用该语言的基础知识，我们会在学习过程中进行解释。UML\
  \ 是一门专门的学科，有整本书都在介绍，因此这里不会涵盖其更复杂的方面。\n\n图 8.1 显示了你的打印机类 `Printer` 的 UML 表示。类名显示在此框的顶部部分（你稍后会学习底部的两个部分）。\n\
  \n![由周围文本描述的图像](img/c08f001.jpg)\n\n**图 8.1**\n\n图 8.2 显示了该 `Printer` 类的一个名为 `myPrinter`\
  \ 的实例 UML 表示。\n\n![由周围文本描述的图像](img/c08f002.jpg)\n\n**图 8.2**\n\n在这里，实例名首先显示在顶部部分，然后是它的类名。两个名称之间用冒号隔开。\n\
  \n### 属性（Properties）和字段（Fields）\n\n属性和字段提供了对对象中包含数据的访问。这些对象数据区分了不同的对象，因为同一类中的不同对象在属性和字段中可能存储不同的值。\n\
  \n对象中包含的各种数据共同构成了该对象的 `state`（状态）。想象一个代表咖啡的对象的类，名为 `CupOfCoffee`。当你实例化这个类（即创建该类的对象）时，你必须为其提供一个状态使其具有意义。在这种情况下，你可能使用属性和字段使使用该对象的代码能够设置咖啡的类型、咖啡是否包含牛奶和/或糖、咖啡是否是速溶的等。那么一个特定的咖啡杯对象将具有特定的状态，例如“加了牛奶和两个糖的哥伦比亚滤咖啡”。\n\
  \n字段和属性都有类型，因此你可以在它们中存储如 `string` 值、`int` 值等信息。然而，属性与字段的区别在于，它们不提供对数据的直接访问。对象可以保护用户免受其数据细节的困扰，而这些细节不需要在现有属性中以一一对应的方式表示。如果你使用一个字段来表示\
  \ `CupOfCoffee` 实例中糖的数量，那么用户就可以在字段中放置任何他们想要的值，仅限于存储此信息的类型限制。例如，如果你使用一个 `int` 来存储这些数据，那么用户就可以使用\
  \ −2147483648 到 2147483647 之间的任何值，如 第 3 章 所示。显然，并非所有值都是合理的，特别是负值，而且某些巨大的正数可能需要一个大得离谱的杯。如果你使用属性来进行此信息，你可以将此值限制为例如\
  \ 0 到 2 之间的数字。\n\n通常情况下，为状态访问提供属性而非字段更好，因为你对各种行为有更多的控制权。这种选择不会影响使用对象实例的代码，因为使用属性和字段的语法是相同的。\n\
  \n对象还可以清晰地定义对属性的读写访问。某些属性可以是只读的，允许你看到它们但不能更改它们（至少不能直接更改）。这通常是同时读取几项状态时的一项很有用的技术。你可能在\
  \ `CupOfCoffee` 类中拥有一个名为 `Description` 的只读属性，它在被请求时返回代表该类实例状态的字符串（如之前给出的字符串）。你可能通过查询多个属性来组合相同的数据，但像这样的属性可能会为你节省精力和时间。你还可能拥有以类似方式的只写属性。\n\
  \n除了属性的这种读写访问外，你还可以为字段和属性指定不同类型的访问权限，被称为 `accessibility`（可访问性）。访问性决定了哪些代码可以访问这些成员——即它们是对所有代码可用（`public`，公共），仅对类内部代码可用（`private`，私有），还是应该使用更复杂的方案（在本章后面相关时会有更详细的介绍）。一种做法是将字段设为私有，并通过公共属性对其提供访问。这意味着类内部的代码可以直接访问存储在字段中的数据，而公共属性则保护外部用户不受这些数据的影响并防止他们向那里放置无效内容。公共成员被说是类\
  \ `exposed`（暴露）。\n\n可视化这种现象的一种方法将其与变量作用范围等同。例如，私有字段和属性可以被认为是属于拥有它们的对象的局部，而公共字段和属性的作用范围也包含了对象外部的代码。\n\
  \n在类的 UML 表示中，你使用第二部分来显示属性和字段，如 图 8.3 所示。\n\n![名为 CupOfCoffee 的类的 UML 表示，第二部分显示属性和字段](img/c08f003.jpg)\n\
  \n**图 8.3**\n\n这是 `CupOfCoffee` 类的表示，具有前面讨论过的五个成员（属性或字段，因为 UML 中没有区分）。每个条目包含以下信息：\n\
  \n*   `Accessibility`（访问性）—— `+` 符号用于公共成员，`-` 符号用于私有成员。通常，图中不显示私有成员，因为这些信息是类内部的。没有提供读写权限。\n\
  *   成员名。\n*   成员类型。\n*   使用冒号（:）分隔成员名和类型。\n\n### 方法（Methods）\n\n*   `Method` 是用于对象的函数的术语。它们可以像任何其他函数一样被调用，并可以使用返回值和参数——你在\
  \ 第 6 章 中详细查看过函数。\n\n方法用于提供对象的功能。与字段和属性一样，它们可以是公共或私有的，根据需要限制外部访问。它们通常利用对象的状态来影响其操作，并在需要访问私有成员（如私有字段）。例如，`CupOfCoffee`\
  \ 类可能会定义一个名为 `AddSugar()` 的方法，与设置相应的 `Sugar` 属性相比，它提供了一种具可读性的语法来增加糖量。\n\n在 UML 中，类框在第三部分显示方法，如\
  \ 图 8.4 所示。\n\n![名为 CupOfCoffee 的类的 UML 表示，第二部分显示属性和字段，第三部分显示方法](img/c08f004.jpg)\n\
  \n**图 8.4**\n\n\n\n\n\n这里的语法与字段和属性的语法相似，不同之处最后显示的类型是返回类型，并且显示了方法参数。每个参数在 UML 中都使用以下标识符之一显示：`return`、`in`、`out`\
  \ 或 `inout`。这些标识符用于表示数据流的方向，其中 `out` 和 `inout` 大致对应于第 6 章中描述的 C# 关键字 `out` 和 `ref`。`in`\
  \ 大致对应 C# 的默认行为，即既不使用 `out` 不使用 `ref` 关键字，而 `return` 表示将值传回给调用方法。\n\n### 一切皆对象\n\
  \n到此为止，是时候坦白了：在整本书中，你一直在使用对象、属性和方法。事实上，C# 和 .NET 框架中的一切都是对象！控制台应用程序中的 `Main()` 函数是一个类的方法。你见过的每一个变量类型都是类。你使用过的每一个命令都有一个属性或方法，例如\
  \ `String.Length`、`String.ToUpper()` 等。（这里的句号字符将对象实例名与属性或方法名隔开，方法在末尾带有 `()` 以区别于属性。）\n\
  \n对象确实无处不在，而且使用它们的语法通常非常简单。到目前为止，它已经足够简单，让你专注于 C# 的一些更基础的方面。从现在开始，你将开始详细观察对象。记住，这里引入的概念具有深远的影响——甚至适用于你一直愉快玩耍的那个简单的\
  \ `int` 变量。\n\n### 对象的生命周期\n\n每个对象都有明确定义的生命周期。除了“使用中”的正常状态外，该生命周期包含两个重要阶段：\n\n*\
  \   **构造** — 当对象首次被实例化时，需要对其初始化。这种初始化被称为构造，由构造函数执行，为了方便起见，通常简称为*构造函数*（constructor）。\n\
  *   **析构** — 当对象被销毁时，通常需要执行一些清理任务，例如释放内存。这是析构函数的工作，也称为*析构函数*（destructor）。\n\n####\
  \ 构造函数\n\n对象的的基础初始化是自动的。例如，你不需要担心寻找容纳新对象的内存。然而，有时你可能希望在对象的初始化阶段执行额外的任务，例如初始化对象存储的数据。构造函数就是你用来执行此操作的工具。\n\
  \n所有类定义都至少包含一个构造函数。这些构造函数可以包含*默认构造函数*（default constructor），即与类本身同名且无参数的方法。类定义还可能包含多个带参数的构造方法，称为*非默认构造函数*（nondefault\
  \ constructors）。这些使得实例化对象的代码能够以许多方式进行，可能为存储在对象中的数据提供初始值。\n\n在 C# 中，使用 `new` 关键字调用构造函数。例如，你可以通过以下方式使用默认构造函数实例化\
  \ `CupOfCoffee` 对象：\n\n```\nCupOfCoffee myCup = new CupOfCoffee();\n```\n\n对象也可以使用非默认构造函数实例化。例如，`CupOfCoffee`\
  \ 类可能有一个非默认构造函数，它使用参数在实例化时设置豆种类：\n\n```\nCupOfCoffee myCup = new CupOfCoffee(\"\
  Blue Mountain\");\n```\n\n构造函数像字段、属性和方法一样，可以是公共的也可以是私有的。类的外部代码无法使用私有构造函数实例化对象；它必须使用公共构造函数。通过这种方式，你可以强制类的类的用户使用非默认构造函数（通过将默认构造函数设为私有）。\n\
  \n某些类没有公共构造函数，这意味着外部代码无法实例化它们（它们被称为*不可实例化的*，noncreatable）。然而，正如你很快就会看到的，这并不意味着它们完全没用。\n\
  \n#### 析构函数\n\n.NET 框架使用析构函数来清理对象。通常情况下，你不需要为析构函数方法提供代码；相反，默认操作会为你完成这些工作。但是，如果在对象实例删除之前需要执行任何重要操作，你可以提供特定的指令。\n\
  \n例如，当变量超出作用范围时，你的代码可能无法访问它；但它可能仍然存在于计算机内存的某处。只有当 .NET 运行时执行垃圾回收清理时，实例才会被完全销毁。\n\
  \n### 静态和实例类成员\n\n除了特定于对象实例的属性、方法和字段等成员外，还可以拥有*静态*（static，也称为*共享*shared，特别是对于我们\
  \ Visual Basic 的兄弟们）成员，这些可以是方法、属性或字段。静态成员在类的实例之间共享，因此它们可以被视为给定类对象的全局变量。静态属性和字段允许你访问独立于任何对象实例的数据，而静态方法允许你执行与类类型相关但并非特定于对象实例的命令。事实上，在使用静态成员时，你甚至不需要实例化对象。\n\
  \n例如，你一直在使用的 `Console.WriteLine()` 和 `Convert.ToString()` 方法是静态的。在任何时候，你都不需要实例化\
  \ `Console` 或 `Convert` 类（事实上，如果你尝试这样做，你会发现做不到，因为正如前面讨论的，这些类的构造函数不是公开可见的）。\n\n在许多此类情况下，静态属性和方法可以产生很好的效果。例如，你可能使用一个静态属性来跟踪创建了多少实例。在\
  \ UML 语法中，类的静态成员带有下划线显示，如图 8.5 所示。\n\n![由周围文字描述的图像](img/c08f005.jpg)\n\n**图 8.5**\n\
  \n#### 静态构造函数\n\n在使用类的静态成员时，你可能希望提前初始化这些成员。你可以在声明时为静态成员提供初始值，但有时你可能希望执行更复杂的初始化，或者在赋值或允许静态方法执行之前执行某些操作。\n\
  \n你可以使用静态构造函数来执行此类初始化任务。一个类可以有一个静态构造函数，它没有访问修饰符且不能有任何参数。静态构造函数永远无法直接调用；相反，它在发生以下情况时执行：\n\
  \n*   创建了包含静态构造类的实例。\n*   访问了包含静态构造类的静态成员。\n\n在这两种情况下，静态构造函数都会在类实例化或访问静态成员之前调用。无论创建了多少个实例，其静态构造函数只会被调用一次。为了区分静态构造函数和本章之前描述的构造函数，所有非静态构造函数也称为实例构造函数。\n\
  \n#### 静态类\n\n通常，你希望使用只包含静态成员且无法实例化对象的类（例如 `Console`）。实现此点的简便方法不是将类的构造函数设为私有，而是使用静态类。静态类只能包含静态成员，并且没有实例构造函数，因为隐含意味着它永远无法被实例化。然而，静态类可以拥有静态构造函数，如前节所述。\n\
  \n\n\n\n既然你已经了解了基础知识，以及对象以及它们如何工作，你可以花些时间查看对象的其他特性。本节涵盖了以下内容：\n\n* 接口\n* 继承\n* 多态\n\
  * 对象之间的关系\n* 运算符重载\n* 事件\n* 引用类型与值类型\n\n### 接口\n\n接口（Interface）是公共实例（即非静态）方法和属性的集合，它们被组合在一起以封装特定的功能。在定义了接口后，你可以在类中实现它。这意味着该类将支持接口中指定的所有属性和成员。\n\
  \n接口不能独立存在。你不能像实例化类那样“实例化接口”。此外，接口不能包含任何实现其成员的代码；它只是定义了这些成员。实现必须来自实现该接口的类。\n\n在较早的咖啡示例中，你可能将许多更通用的属性和方法分组到一个接口中，例如\
  \ `AddSugar()`、`Milk`、`Sugar` 和 `Instant`。你可以将此接口命名为类似 `IHotDrink` 的名称（接口名称通常以大写\
  \ `I` 开头）。你可以在其他对象上使用此接口，也许是 `CupOfTea` 类的对象。因此，你可以以类似的方式处理这些对象，而它们仍然可以拥有各自的属性（例如，`CupOfCoffee`\
  \ 的 `BeanType` 和 `CupOfTea` 的 `LeafType`）。\n\nUML 中在对象上实现的接口使用棒棒糖语法表示。在图 8.6 中，`IHotDrink`\
  \ 的成员使用类类语法被分在一个独立的框中。\n\n![由周围文本描述的图像。](img/c08f006.jpg)\n\n图 8.6\n\n一个类可以支持多个接口，多个类也可以支持同一个接口。因此，接口的概念让用户和其他开发者的生活变得更简单。例如，你可能有一些代码使用了具有特定接口的对象。只要你不使用该对象的其他属性和方法，就可以将一个对象替换为另一个（例如，之前所示使用\
  \ `IHotDrink` 接口的代码可以与 `CupOfCoffee` 和 `CupOfTea` 共同工作）。此外，对象本身的开发者可以为你提供对象的更新版本，只要它支持已使用的接口，在你的代码中使用此新版本就会很容易。\n\
  \n一旦接口被发布——即它已对其他开发人员或终端用户可用——那么不更改它是一个良好的做法。考虑这种问题的一种方法是将接口想象成类创建者和类消费者之间的合同。你实际上是在说：“每个支持接口\
  \ `X` 的类都将支持这些方法和属性。”如果以后发生了更改（可能是由于底层代码的升级），这可能会导致该接口的消费者运行不当，甚至失败。相反，你应该创建一个扩展旧接口的新接口，可能包含一个版本号，例如\
  \ `X2`。这已成为处理此类问题的标准，你可能会频繁遇到带编号的接口。\n\n#### 可销毁对象\n\n一个特别感兴趣的接口是 `IDisposable`。支持\
  \ `IDisposable` 接口的对象必须实现 `Dispose()` 方法——即它必须为该方法提供代码。当对象不再需要时（例如在它离开作用范围之前），可以调用此方法，并应该用于释放任何关键资源，否则这些资源可能会一直留到垃圾回收调用析构方法。这让你对对象使用的资源有更多的控制。\n\
  \nC# 允许你使用一种能够很好利用此方法的结构。`using` 关键字允许你在代码块中初始化一个使用关键资源的对象，在代码块结束时会自动调用 `Dispose()`：\n\
  \n```\n<ClassName> <VariableName> = new <ClassName>();\n…\nusing (<VariableName>)\n\
  {\n   …\n}\n```\n\n或者，你可以在 `using` 语句中直接实例化对象 `<VariableName>`：\n\n```\nusing (<ClassName>\
  \ <VariableName> = new <ClassName>())\n{\n   …\n}\n```\n\n在这两种情况下，变量 `<VariableName>`\
  \ 在 `using` 代码块内都是可用的，并在结束时自动进行销毁处理（即在代码块执行完毕时调用 `Dispose()`）。\n\n### 继承\n\n继承（Inheritance）是面向对象编程（OOP）最重要的特性之一。任何类都可以继承自另一个类，这意味着它将拥有其所继承的类的所有成员。在\
  \ OOP 术语中，被继承（派生）的类被称为父类（也称为基类）。C# 中的类只能直接派自单个基类，尽管当然该基类也可以有它自己的基类，依此类推。\n\n继承允许你从一个单一的、更通用的基类扩展或创建更具体的类。例如，考虑一个代表农场动物的类（正如\
  \ 80 岁的老开发者 Old MacDonald 在他的牲畜应用程序中使用那样）。该类可能被命名 `Animal`，并拥有如 `EatFood()` 或 `Breed()`\
  \ 等方法。你可以创建一个名为 `Cow` 的派生类，它将支持所有这些方法，但也可能提供自己的方法，如 `Moo()` 和 `SupplyMilk()`。你还可以创建另一个派生类\
  \ `Chicken`，它具有 `Cluck()` 和 `LayEgg()`。\n\n在 UML 中，你使用箭头指示继承，如图 8.7 所示。\n\n![由周围文本描述的图像。](img/c08f007.jpg)\n\
  \n图 8.7\n\n在使用基类继承时，成员的访问性问题变得很重要。基类的私有成员在派生类中是不可访问的，但公共成员是可以的。然而，公共成员对于派生类和外部代码都是可见的。因此，如果你只能使用这两个访问级别，你就无法拥有一个既能被基类和派生类访问但对外部代码不可见的成员。\n\
  \n为了解决这个问题，存在第三种访问级别：受保护（protected），即只有派生类可以访问该成员。对于外部代码而言，这与私有成员是完全相同的——在两种情况下外部代码都无法访问。\n\
  \n除了定义成员的保护级别外，你还可以为它定义继承行为。基类的成员可以是虚的（virtual），这意味着该成员可以被继承它的类重写。因此，派生类可以为该成员提供替代实现。这种替代实现并没有删除原始代码（原始代码在类内部仍然可以访问），但它对外部代码屏蔽了它。如果没有提供替代，那么任何通过派生类使用该成员的外部代码将自动使用基类的实现。\n\
  \n在动物示例中，你可以将 `EatFood()` 为虚，并在任何派生类上对其提供新的实现——例如，仅在 `Cow` 类上，如图 8.8 所示。这在 `Animal`\
  \ 和 `Cow` 类上都显示了 `EatFood()` 方法，以表示它们拥有自己的实现。\n\n![显示抽象类 Animal 具有 EatFood() 和 Breed()，以及两个派生类（Chicken\
  \ 和 Cow），Chicken 具有 Cluck() 和 LayEgg()，Cow 具有 Moo(), SupplyMilk() 和 EatFood() 的\
  \ UML 图](img/c08f008.jpg)\n\n图 8.8\n\n\n\n基类也可以被定义为抽象类。抽象类不能被直接实例化；要使用它，你需要继承自它。抽象类可以拥有抽象成员，这些成员在基类中没有实现，因此必须在派生类中提供实现。如果\
  \ `Animal` 是一个抽象类，那么 UML 图将如图 8.9 所示。\n\n![图像与图 8-8 相似，但在 Chicken 中增加了方法 EatFood，并在\
  \ Chicken 和 Cow 中都添加了 Breed。](img/c08f009.jpg)\n\n图 8.9\n\n在图 8.9 中，`EatFood()`\
  \ 和 `Breed()` 都显示在派生类 `Chicken` 和 `Cow` 中，这意味着这些方法要么是抽象的（因此，必须在派生类中重写），要么是虚拟的（在这种情况下，它们已经在\
  \ `Chicken` 和 `Cow` 中被重写）。当然，抽象基类可以提供成员的实现，这是非常常见的。不能实例化抽象类的事实并不意味着你不能在其中封装功能。\n\
  \n最后，类可以是密封的（sealed）。被密封的类不能被用作基类，因此不存在可能的派生类。\n\nC# 为所有对象提供了一个公共基类，称为 `object`（它是\
  \ .NET Framework 中 `System.Object` 类的别名）。你可以在第 9 章中详细地查看此类。\n\n### 多态\n\n继承的结果之一是，派生自基类的类在它们公开的方法和属性上存在重叠。正如此，通常可以使用相同的语法来处理从具有共同基类型的类实例化的对象。例如，如果一个名为\
  \ `Animal` 的基类有一个名为 `EatFood()` 的方法，那么从派生类 `Cow` 和 `Chicken` 此该方法的语法将是类似的：\n\n```\n\
  Cow myCow = new Cow();\nChicken myChicken = new Chicken();\nmyCow.EatFood();\nmyChicken.EatFood();\n\
  ```\n\n多态更进了一步。你可以将一个派生类型的变量赋值给其中一个基类型的变量，如下所示：\n\n```\nAnimal myAnimal = myCow;\n\
  ```\n\n这不需要类型转换。然后你可以通过此变量调用基类的方法：\n\n```\nmyAnimal.EatFood();\n```\n\n这会导致调用派生类中的\
  \ `EatFood()` 实现。注意，你不能以相同的方式调用在派生类上定义的方法。以下代码无法运行：\n\n```\nmyAnimal.Moo();\n```\n\
  \n然而，你可以将基类型变量强制转换为派生类变量，并用那样调用派生类的方法：\n\n```\nCow myNewCow = (Cow)myAnimal;\nmyNewCow.Moo();\n\
  ```\n\n如果原始变量的类型不是 `Cow` 或派生自 `Cow` 的类，此转换将抛出异常。有方法可以确定对象的类型，你将在下一章学习。\n\n多态是一种极其有用的技术，用于在派生自单个类的不同对象上以最少的代码执行任务。不仅仅是共享相同父类的类可以使用多态。只要在它们的继承层次结构中有一个共同类，就可以以相同的方式处理（例如）子类和孙子类。\n\
  \n在此进一步说明，记住在 C# 中，所有类都派生自继承层次结构根部的基类 `object`。因此，可以将所有对象视为 `object` 类的实例。这就是为什么\
  \ `WriteLine()` 在构建字符串时可以处理几乎无限的参数组合。第一个参数之后的每个参数都被视为 `object` 实例，允许将任何对象的输出写入屏幕。为了实现这一点，会调用\
  \ `ToString()` 方法（`object` 的成员）。你可以重写此方法为你的类提供合适的实现，或简单地使用默认值，它返回根据所属任何命名空间限定的类名。\n\
  \n### 接口多态\n\n虽然你不能像实例化对象那样实例化接口，但你可以拥有一个接口类型的变量。你可以使用该变量访问支持该接口的对象上公开的方法和属性。\n\n\
  例如，假设不是使用 `Animal` 基类来提供 `EatFood()` 方法，而是将此 `EatFood()` 方法放在一个名为 `IConsume` 的接口上。`Cow`\
  \ 和 `Chicken` 类都可以支持此接口，唯一的区别是它们强制为 `EatFood()` 提供实现，因为接口不包含实现。你可以使用下面的代码访问此方法：\n\
  \n```\nCow myCow = new Cow();\nChicken myChicken = new Chicken();\nIConsume consumeInterface;\n\
  consumeInterface = myCow;\nconsumeInterface.EatFood();\nconsumeInterface = myChicken;\n\
  consumeInterface.EatFood();\n```\n\n这为多个对象以相同方式调用提供了一种简单的方法，并且不依赖于共同基类。例如，此接口可以由派生自\
  \ `Vegetable` 而不是 `Animal` 的 `VenusFlyTrap` 类实现：\n\n```\nVenusFlyTrap myVenusFlyTrap\
  \ = new VenusFlyTrap();\nIConsume consumeInterface;\nconsumeInterface = myVenusFlyTrap;\n\
  consumeInterface.EatFood();\n```\n\n在上述代码段中，取决于分配给接口类型的实例，调用 `Cow`、`Chicken` 或 `VenusFlyTrap`\
  \ 类的 `EatFood()` 方法。\n\n在此注意派生类继承其基类支持的接口。在前面的示例中，可能是 `Animal` 支持 `IConsume`，或者是\
  \ `Cow` 和 `Chicken` 支持 `IConsume`。记住，具有共同基类的类并不一定共同接口，反之亦然。\n\n### 对象之间的关系\n\n继承是对象之间简单的关系，导致基类被派生类完全公开，其中派生类还可以访问其基类的内部工作机制（通过保护成员）。在其他情况下，对象之间的关系变得重要。\n\
  \n本节简要查看以下内容：\n\n- **包含 (Containment)**——一个类包含另一个类。这类似于继承，但允许包含类控制对包含类成员的访问并在使用包含类成员之前进行额外处理。\n\
  - **集合 (Collections)**——一个类作为另一个类的多个实例的容器。这类似于对象数组，但集合具有额外功能，包括索引、排序、调整大小等。\n\n\
  #### 包含\n\n通过使用成员字段持有对象实例可以简单实现包含。此字段可以是公共的，在这种情况下，容器用户可以访问其公开的方法和属性，就像继承一样。然而，你无法通过派生类访问该类的内部，就像通过继承那样。\n\
  \n或者，你可以将包含的成员对象变为私有成员。如果你这样做，它的任何成员都无法被用户直接访问，即使它们是公共的。相反，你可以使用包含类的成员提供访问这些成员的方法。这意味着你可以完全控制包含类的哪些成员（如果有），并且在访问包含类成员之前在包含类成员中执行额外处理。\n\
  \n例如，`Cow` 类可能包含一个带有公共方法 `Milk()` 的 `Udder` 类。`Cow` 对象可以根据需要调用此方法，也许作为其 `SupplyMilk()`\
  \ 方法的一部分，但这些细节对于 `Cow` 对象的用户来说并不明显（或重要）。\n\n\n\n\n包含类可以使用 UML 中的关联线进行视觉化表示。对于简单的包含关系，你可以在线的末端标记为\
  \ 1，表示一对一的关系（一个 `Cow` 实例将包含一个 `Udder` 实例）。为了清晰起见，你也可以将被包含的 `Udder` 类实例显示为 `Cow`\
  \ 类的私有字段（参见图 8.10）。\n\n![周围文字描述的图像。](img/c08f010.jpg)\n\n图 8.10\n\n### 集合\n\n第 5\
  \ 章描述了你如何使用数组来存储多个相同类型的变量。这对于对象同样有效（记住，你一直使用的变量类型实际上是对象，所以这并不意外）。这里有一个示例：\n\n```\n\
  Animal[] animals = new Animal[5];\n```\n\n*集合*基本上是一个带有很多额外功能的数组。集合的实现方式与其他对象非常相似。它们通常以其所存储对象的复数形式命名——例如，一个名为\
  \ `Animals` 的类可能包含一个 `Animal` 对象集合。\n\n与数组的主要区别在于，集合通常实现了额外的功能，例如 `Add()` 和 `Remove()`\
  \ 方法，用于向集合添加和删除项目。通常 true 一个 `Item` 属性，根据其索引返回对象。通常情况下，该属性的实现方式允许更复杂的访问。例如，可以设计\
  \ `Animals` 类，使其可以通过名称访问给定的 `Animal` 对象。\n\n在 UML 中，你可以像图 8.11 所示对其进行视觉化处理。图 8.11\
  \ 中没有包含成员，因为图中展示的是这种关系。连接线末端的数字显示一个 `Animals` 对象将包含零个或多个 `Animal` 对象。你可以在第 11 章中更详细地查看集合。\n\
  \n![周围文字描述的图像。](img/c08f011.jpg)\n\n图 8.11\n\n### 运算符重载\n\n在书前面的部分，你已经看到如何使用运算符来处理简单变量类型。有时，对从你自定义类实例化的对象使用运算符是有逻辑的。这是可能的，因为类可以包含有关如何处理运算符的指令。\n\
  \n例如，你可能会为 `Animal` 类添加一个名为 `Weight` 的新属性。然后你可以使用以下代码比较动物重量：\n\n```\nif (cowA.Weight\
  \ > cowB.Weight)\n{\n   …\n}\n```\n\n通过运算符重载，你可以提供在代码中隐式使用 `Weight` 属性的逻辑，这样你就可以编写如下代码：\n\
  \n```\nif (cowA > cowB)\n{\n   …\n}\n```\n\n在这里，大于运算符（`>`）被重载了。重载运算符是指你编写了代码来执行相关操作的运算符——这些代码被添加到它所操作的其中一个类的定义中。在先前的示例中，你使用了两个\
  \ `Cow` 对象，因此运算符重载定义包含在 `Cow` 类中。你还可以重载运算符以以相同的方式处理不同的类，其中一个（或两个）类定义包含了实现此操作的代码。\n\
  \n你只能通过这种方式重载现有的 C# 运算符；你不能创建新的。然而，你可以为 `+` 或 `>` 等运算符的一元（单操作数）和二元（双操作数）用法提供实现。你可以在第\
  \ 13 章中看到如何在 C# 中这样操作。\n\n### 事件\n\n对象可以作为处理的一部分触发（并消耗）事件。事件是重要的发生情况，你可以在代码的其他部分对其采取操作，类似于异常（但比异常更强大）。例如，你可能希望在向\
  \ `Animals` 集合添加 `Animal` 对象时，执行某些特定代码，而这些代码不属于 `Animals` 类，也不属于调用 `Add()` 方法的代码。要实现这一点，你需要向代码中添加一个事件处理程序，这是一种特殊的函数，在事件发生时被调用。你还需要配置此处理程序以监听你感兴趣的事件。\n\
  \n你可以创建事件驱动的应用程序，其应用比你想象的丰富得多。例如，请记住 Windows 应用程序完全依赖于事件。你执行的每一次按钮点击或滚动条拖都是通过事件处理实现的，因为事件是由鼠标或键盘触发的。\n\
  \n在本章稍后，你将看到这在 Windows 应用程序中是如何运作的，第 13 章中对事件有更深入的讨论。\n\n### 引用类型与值类型\n\nC# 中的数据以两种方式存储在变量中，取决于变量的类型。这种类型分为两类：引用或值。其区别如下：\n\
  \n- 值类型在内存中的一处存储其自身及其内容。\n- 引用类型持有指向内存中另一个地方（称为堆）的引用，内容存储在该处。\n\n事实上，在使用 C# 时不需要过于担心这一点。到目前为止，你使用的\
  \ `string`（引用类型）和其他值类型几乎以相同的方式使用。值类型和引用类型的一个关键区别是，值类型始终包含值，而引用类型可以为 `null`。然而，通过可空类型，可以创建一个像引用类型那样的值类型。在第\
  \ 12 章中查看泛型高级技术时会介绍这些类型（包括可空类型）。\n\n引用类型的简单类型只有 `string` 和 `object`，尽管数组也是隐式的引用类型。你创建的每个类都将是引用类型，这就是在这里强调它的。\n\
  \n## 桌面应用程序中的 OOP\n\n在第 2 章中，你使用 Windows Presentation Foundation (WPF) 创建了一个简单的桌面应用程序。WPF\
