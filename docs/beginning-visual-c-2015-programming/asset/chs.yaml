  \ = value; }\n      }\n      /// <summary>\n      /// 将卡实例拷贝到另一个 Cards 实例的实用方法\n\
  \      /// 用于洗牌（Shuffle）。\n      /// </summary>\n      public void CopyTo(Cards\
  \ targetCards)\n      {\n         for (int index = 0; index < Count; index++)\n\
  \         {\n            targetCards[index] = this[index];\n         }\n      }\n\
  \      /// <summary>\n      /// 检查集合是否包含特定的卡。\n      /// </summary>\n      public\
  \ bool Contains(Card card) => InnerList.Contains(card);\n   }\n}\n```\n\n接下来，修改\
  \ `Deck.cs` 使用这个新集合而不是数组：\n\n```\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nnamespace Ch11CardLib\n{\n   public class\
  \ Deck\n   {\n      private Cards cards = new Cards();\n      public Deck()\n  \
  \    {\n         for (int suitVal = 0; suitVal < 4; suitVal++)\n         {\n   \
  \         for (int rankVal = 1; rankVal < 14; rankVal++)\n            {\n      \
  \         cards.Add(new Card((Suit)suitVal, (Rank)rankVal));\n            }\n  \
  \       }\n      }\n      public Card GetCard(int cardNum)\n      {\n         if\
  \ (cardNum >= 0 && cardNum <= 51)\n            return cards[cardNum];\n        \
  \ else\n            throw (new System.ArgumentOutOfRangeException(\"cardNum\", cardNum,\n\
  \                   \"值必须在 0 到 51 之间。\"));\n      }\n      public void Shuffle()\n\
  \      {\n         Cards newDeck = new Cards();\n         bool[] assigned = new\
  \ bool[52];\n         Random sourceGen = new Random();\n         for (int i = 0;\
  \ i < 52; i++)\n         {\n            int sourceCard = 0;\n            bool foundCard\
  \ = false;\n            while (foundCard == false)\n            {\n            \
  \   sourceCard = sourceGen.Next(52);\n               if (assigned[sourceCard] ==\
  \ false)\n                  foundCard = true;\n            }\n            assigned[sourceCard]\
  \ = true;\n            newDeck.Add(cards[sourceCard]);\n         }\n         newDeck.CopyTo(cards);\n\
  \      }\n   }\n}\n```\n\n这里不需要许多更改。大部分更改涉及修改洗牌逻辑，以允许从 `cards` 的随机索引添加到新 `Cards`\
  \ 集合 `newDeck` 的开头，而不是从 `cards` 的顺序位置添加到 `newDeck` 的随机索引。\n\n`Ch10CardLib` 解决方案的客户端控制台应用程序\
  \ `Ch10CardClient` 仍可以使用此新库，并获得与之前相同的结果，因为 `Deck` 的方法签名没有变化。然而，此类库的客户端现在可以利用 `Cards`\
  \ 集合类，而不是依赖 `Card` 对象的数组 —— 例如，在纸牌应用程序中定义手牌。\n\n### 键值集合 (Keyed Collections) 和 IDictionary\n\
  \n\n\n\n除了实现 `IList` 接口外，集合也可以实现类似的 `IDictionary` 接口，这允许通过键值（如字符串名称）而不是索引对项进行索引。这同样通过使用索引器（indexer）来实现，尽管这里使用的索引器参数是与所存储项关联的键，而不是\
  \ `int` 索引，这可以使集合变得更加用户友好。\n\n与索引集合一样，你可以使用一个基类来简化 `IDictionary` 接口的实现：`DictionaryBase`。该类还实现了\
  \ `IEnumerable` 和 `ICollection`，提供了任何集合通用的基本集合操作能力。\n\n`DictionaryBase` 与 `CollectionBase`\
  \ 一样，实现了通过其支持的接口获取的部分（并非全部）成员。与 `CollectionBase` 类似，`Clear` 和 `Count` 成员被实现了，但 `RemoveAt()`\
  \ 没有实现，因为它是 `IList` 接口上的方法，没有出现在 `IDictionary` 接口上。然而，`IDictionary` 确实有一个 `Remove()`\
  \ 方法，这是你在基于 `DictionaryBase` 自定义自定义集合类时应该实现的方法之一。\n\n下面的代码显示了 `Animals` 类的另一种版本，这次派生自\
  \ `DictionaryBase`。其中包含了 `Add()`、`Remove()` 和通过键访问的索引器的实现：\n\n```csharp\npublic\
  \ class Animals : DictionaryBase\n{\n   public void Add(string newID, Animal newAnimal)\n\
  \   {\n      Dictionary.Add(newID, newAnimal);\n   }\n   public void Remove(string\
  \ animalID)\n   {\n      Dictionary.Remove(animalID);\n   }\n   public Animals()\
  \ {}\n   public Animal this[string animalID]\n   {\n      get { return (Animal)Dictionary[animalID];\
  \ }\n      set { Dictionary[animalID] = value; }\n   }\n}\n```\n\n这些成员之间的差异如下：\n\
  \n*   `Add()` — 接收两个参数，一个键和一个值，以便一起存储。字典集合有一个继承自 `DictionaryBase` 的名为 `Dictionary`\
  \ 的成员，它是一个 `IDictionary` 接口。该接口有它自己的 `Add()` 方法，接收两个对象参数。你的实现接收一个字符串值作为键，接收一个 `Animal`\
  \ 对象作为与该键一起存储的数据。\n*   `Remove()` — 接收一个键参数，而不是对象引用。具有指定键值的项将被移除。\n*   `Indexer`\
  \ — 使用字符串键值而不是索引，通过继承的 `Dictionary` 成员访问存储的项。同样，这里需要进行类型转换。\n\n基于 `DictionaryBase`\
  \ 的集合与基于 `CollectionBase` 的集合之间的另一个区别是 `foreach` 的工作方式略有不同。上一节中的集合允许你直接从集合中提取 `Animal`\
  \ 对象。在派生自 `DictionaryBase` 的类上使用 `foreach` 会得到 `DictionaryEntry` 结构体，这是 `System.Collections`\
  \ 命名空间定义的另一种类型。要获取 `Animal` 对象本身，必须使用该结构体的 `Value` 成员，或者可以使用该结构体的 `Key` 成员来获取关联的键。要获得与早期等效的代码\n\
  \n```csharp\nforeach (Animal myAnimal in animalCollection)\n{\n   WriteLine($\"\
  New {myAnimal.ToString()} object added to custom \" +\n             $\"collection,\
  \ Name = {myAnimal.Name}\");\n}\n```\n\n你需要以下代码：\n\n```csharp\nforeach (DictionaryEntry\
  \ myEntry in animalCollection)\n{\n   WriteLine($\"New {myEntry.Value.ToString()}\
  \ object added to \" +\n      $\"custom collection, Name = {((Animal)myEntry.Value).Name}\"\
  );\n}\n```\n\n可以覆盖这种行为，以便通过 `foreach` 直接访问 `Animal` 对象。有几种方法可以实现，最简单的是实现迭代器（iterator）。\n\
  \n### 迭代器\n\n在本章前面的部分，你看到 `IEnumerable` 接口允许你使用 `foreach` 循环。在 `foreach` 循环中使用你的类通常是有益的，而不仅仅是像之前节中显示的集合类。\n\
  \n然而，覆盖这种行为或提供你自己的自定义实现并不总是那么简单。为了说明这一点，有必要详细查看 `foreach` 循环。以下步骤显示了在遍历名为 `collectionObject`\
  \ 集合的 `foreach` 循环中实际上发生了什么：\n\n1.  调用 `collectionObject.GetEnumerator()`，它返回一个\
  \ `IEnumerator` 引用。该方法通过实现 `IEnumerable` 接口可用，尽管它是可选的。\n2.  调用返回的 `IEnumerator`\
  \ 接口的 `MoveNext()` 方法。\n3.  如果 `MoveNext()` 返回 `true`，则使用 `IEnumerator` 接口的 `Current`\
  \ 属性获取对象的引用，并将其用于 `foreach` 循环。\n4.  重复上述 `两个` 步骤，直到 `MoveNext()` 返回 `false`，此时循环终止。\n\
  \n为了在你的类中启用这种行为，你必须覆盖多个方法、跟踪索引、维护 `Current` 属性等。为了实现极少的功能，这可能需要大量工作。\n\n一种更简单的替代是使用迭代器。实际上，使用迭代器会在后台为你生成大量代码并将它们全部正确地连接起来。此外，使用迭代器的语法要更容易掌握。\n\
  \n迭代器的良好定义是一个代码块，它按顺序提供 `foreach` 块中使用的所有值。通常，此代码块是一个方法，尽管你也可以使用属性访问器。无论该代码块如何，其返回类型都是限制的。可能与预期相反，返回类型并不与枚举对象的类型相同。例如，在表示\
  \ `Animal` 的类中，返回类型不能是 `Animal`。两种可能的返回类型是提到的接口 `IEnumerable` 或 `IEnumerator`。你可以如下所示使用这些类型：\n\
  \n*   遍历类，使用返回类型为 `IEnumerator` 的方法。\n*   遍历类成员（例如方法），使用 `IEnumerable`。\n\n在迭代器块中，你通过\
  \ `yield` 关键字来选择要用于 `foreach` 循环的值。此操作语法如下：\n\n```csharp\nyield return <value>;\n\
  ```\n\n这些信息足够你构建如下的简单示例（你可以在 `SimpleIterators/Program.cs` 中找到此代码）：\n\n```csharp\n\
  \ public static IEnumerable SimpleList()\n      {\n         yield return \"string\
  \ 1\";\n         yield return \"string 2\";\n         yield return \"string 3\"\
  ;\n      }\n      static void Main(string[] args)\n      {\n         foreach (string\
  \ item in SimpleList())\n            WriteLine(item);\n         ReadKey();\n   \
  \   }\n```\n\n在这里，静态方法 `SimpleList()` 是迭代器块。因为它是一个方法，所以你使用 `IEnumerable` 返回类型。`SimpleList()`\
  \ 使用 `yield` 关键字为使用它的 `foreach` 块提供三个值，每个值都打印到屏幕上。结果如图 11.3 所示。\n\n![命令提示窗口显示三个代码：string\
  \ 1, string 2 和 string 3。](img/c11f003.jpg)\n\n**图 11.3**]\n\n显然，这个迭代器并不是特别有用，但它确实展示了它是如何运行的以及实现可以有多简单。查看代码，你可能会奇怪代码如何知道返回\
  \ `string` 类型的项目。实际上，它并不知道；返回的是 `object` 类型的值。如你所知，`object` 是所有类型的基类，因此你可以从 `yield`\
  \ 语句返回任何内容。\n\n\n\n然而，编译器足够智能，在 `foreach` 循环的语境下，你可以将返回值解释为你需要的任何类型。在这里，代码请求的是 `string`\
  \ 类型的值，因此你得到的是用于处理的值。如果你修改其中一条 `yield` 行使其返回（例如）一个整数，你将在 `foreach` 循环中得到一个类型转换异常（bad\
  \ cast exception）。\n\n关于迭代器还有一点。你可以使用以下语句来中断向 `foreach` 循环的信息的返回：\n\n```\nyield\
  \ break;\n```\n\n当在迭代器中遇到此语句时，迭代器的处理将立即终止，使用它的 `foreach` 循环也会之终止。\n\n现在是时候来看一个更复杂且更有用——例子了。在这次“尝试一下”（Try\
  \ It Out）中，你将实现一个获取质数的迭代器。\n\n## 迭代器与集合\n\n之前我们向你承诺过解释如何使用迭代器来遍历字典类型集合中存储的对象，而无需处理\
  \ `DictionaryItem` 对象。在本章的可下载代码中，你将在 `DictionaryAnimals` 文件夹中找到下一个项目的代码。回想集合类 `Animals`：\n\
  \n```\npublic class Animals : DictionaryBase\n{\n   public void Add(string newID,\
  \ Animal newAnimal)\n   {\n      Dictionary.Add(newID, newAnimal);\n   }\n   public\
  \ void Remove(string animalID)\n   {\n      Dictionary.Remove(animalID);\n   }\n\
  \   public Animal this[string animalID]\n   {\n      get { return (Animal)Dictionary[animalID];\
  \ }\n      set { Dictionary[animalID] = value; }\n   }\n}\n```\n\n你可以将此简单的迭代器添加到代码中，以获得所需的行为：\n\
  \n```\n public new IEnumerator GetEnumerator()\n      {\n         foreach (object\
  \ animal in Dictionary.Values)\n            yield return (Animal)animal;\n     \
  \ }\n```\n\n现在，你可以使用以下代码来遍历集合中的 `Animal` 对象：\n\n```\n foreach (Animal myAnimal in\
  \ animalCollection)\n         {\n            WriteLine($\"New {myAnimal.ToString()}\
  \ object added to \" +\n                      $\" custom collection, Name = {myAnimal.Name}\"\
  );\n         }\n```\n\n## 深拷贝\n\n第 9 章 描述了如何通过受保护方法 `System.Object.MemberwiseClone()`\
  \ 执行浅拷贝，并使用此处所示的 `GetCopy()` 方法：\n\n```\npublic class Cloner\n{\n   public int Val;\n\
  \   public Cloner(int newVal)\n   {\n      Val = newVal;\n   }\n   public object\
  \ GetCopy() => MemberwiseClone();\n}\n```\n\n假设你拥有字段是引用类型而不是值类型（例如，对象）：\n\n```\n\
  public class Content\n{\n   public int Val;\n}\npublic class Cloner\n{\n   public\
  \ Content MyContent = new Content();\n   public Cloner(int newVal)\n   {\n     \
  \ MyContent.Val = newVal;\n   }\n   public object GetCopy() => MemberwiseClone();\n\
  }\n```\n\n在这种情况下，通过 `GetCopy()` 获得的浅拷贝具有一个指向与原始对象相同对象的字段。以下代码使用了此 `Cloner` 类，说明了浅拷贝引用类型的后果：\n\
  \n```\nCloner mySource = new Cloner(5);\nCloner myTarget = (Cloner)mySource.GetCopy();\n\
  WriteLine($\"myTarget.MyContent.Val = {myTarget.MyContent.Val}\");\nmySource.MyContent.Val\
  \ = 2;\nWriteLine($\"myTarget.MyContent.Val = {myTarget.MyContent.Val}\");\n```\n\
  \n第四行给 `mySource.MyContent.Val` 赋值（即原始对象中 `MyContent` 公有字段的 `Val` 公有字段），也更改了 `myTarget.MyContent.Val`\
  \ 的值。这是因为 `mySource.MyContent` 指向与 `myTarget.MyContent` 相同的对象实例。上述代码的输出如下：\n\n```\n\
  myTarget.MyContent.Val = 5\nmyTarget.MyContent.Val = 2\n```\n\n为了解决这个问题，你需要执行深拷贝。你可以直接修改之前使用的\
  \ `GetCopy()` 方法来实现此点，但最好是使用 .NET Framework 的标准方法：实现 `ICloneable` 接口，它有一个单一方法 `Clone()`。该方法不接受参数并返回一个\
  \ `object` 类型的结果，其签名与之前使用的 `GetCopy()` 方法相同。\n\n要修改前面的类，请尝试使用以下深拷贝代码：\n\n```\npublic\
  \ class Content\n{\n   public int Val;\n}\npublic class Cloner : ICloneable\n{\n\
  \   public Content MyContent = new Content();\n   public Cloner(int newVal)\n  \
  \ {\n      MyContent.Val = newVal;\n   }\n   public object Clone()\n   {\n     \
  \ Cloner clonedCloner = new Cloner(MyContent.Val);\n      return clonedCloner;\n\
  \   }\n}\n```\n\n这通过使用原始 `Cloner` 对象 (`MyContent`) 中 `Content` 对象的 `Val` 字段创建了一个新的\
  \ `Cloner` 对象。该字段是值类型，因此不需要更深层的拷贝。\n\n使用与刚才所示相似的代码测试浅拷贝——但使用 `Clone()` 代替 `GetCopy()`——你会得到以下结果：\n\
  \n```\nmyTarget.MyContent.Val = 5\nmyTarget.MyContent.Val = 2\n```\n\n这一次，包含的对象是独立的。注意，在更复杂的对象系统中，有时会递归调用\
  \ `Clone()`。例如，如果 `Cloner` 类的 `MyContent` 字段需要深拷贝，那么你需要在 `Content` 类上实现 `ICloneable`。\n\
  \n### 为 Card 添加拷贝功能\n\n通过实现 `ICloneable` 接口对 `Card`、`Cards` 和 `Deck` 对象进行拷贝能力，可以将此付诸实践。这在某些扑牌游戏中可能有用，那时你并不需要两个具有相同\
  \ `Card` 对象的牌组。在 `Ch11Lib` 的 `Card` 类中实现克隆是简单的（因为 `Card` 只包含字段的值类型数据）。首先对 `class`\
  \ 定义进行以下更改：\n\n```\n public class Card : ICloneable\n   {\n      object Clone()\
  \ => MemberwiseClone();\n```\n\n此 `ICloneable` 实现只是浅拷贝。没有规则规定 `Clone()` 方法应该发生什么，但这对于你的目的已经足够。\n\
  \n接下来，在 `Cards` 集合类上实现 `ICloneable`。这要复杂一些，因为涉及到克隆原始集合中的每个 `Card` 对象——你需要进行深拷贝：\n\
  \n```\n public class Cards : CollectionBase, ICloneable\n   {\n      public object\
  \ Clone()\n      {\n         Cards newCards = new Cards();\n         foreach (Card\
  \ sourceCard in List)\n         {\n            newCards.Add((Card)sourceCard.Clone());\n\
  \         }\n         return newCards;\n      }\n```\n\n最后，在 `Deck` 类上实现 `ICloneable`。注意这里有一个小问题：`Ch11Lib`\
  \ 中的 `Deck` 类没有方法修改它包含的牌，除非洗牌。例如，没有方法可以修改一个 `Deck` 实例使其具有给定的牌序。为了解决这个问题，为 `Deck`\
  \ 类定义一个新的私有构造函数，允许在实例化 `Deck` 对象时传入特定的 `Cards` 集合。以下是在该类中实现克隆的代码：\n\n```\n public\
  \ class Deck : ICloneable\n   {\n      public object Clone()\n      {\n        \
  \ Deck newDeck = new Deck(cards.Clone() as Cards);\n         return newDeck;\n \
  \     }\n      private Deck(Cards newCards)\n      {\n         cards = newCards;\n\
  \      }\n}\n```\n\n\n\n\n再次，你可以通过一些简单的客户端代码来测试这一点。与之前一样，将此代码放置在客户端项目的 `Main()`\
  \ 方法中进行测试（你可以在章节在线下载包的 `Ch11CardClient\\Program.cs` 中找到这段代码）：\n\n```\nDeck deck1\
  \ = new Deck();\nDeck deck2 = (Deck)deck1.Clone();\nWriteLine($\"The first card\
  \ in the original deck is: {deck1.GetCard(0)}\");\nWriteLine($\"The first card in\
  \ the cloned deck is: {deck2.GetCard(0)}\");\ndeck1.Shuffle();\nWriteLine(\"Original\
  \ deck shuffled.\");\nWriteLine($\"The first card in the original deck is: {deck1.GetCard(0)}\"\
  );\nWriteLine($\"The first card in the cloned deck is: {deck2.GetCard(0)}\");\n\
  ReadKey();\n```\n\n输出将与图 11.5 所示所示。\n\n![执行代码后显示特定卡牌名称代码的命令提示符窗口](img/c11f005.jpg)\n\
  \n图 11.5\n\n## 比较\n\n本节涵盖了对象之间的两种比较：\n\n*   类型比较\n*   值比较\n\n类型比较——即确定一个对象是什么，或者它继承自什么——在\
  \ C# 编程的所有领域都至关重要。通常当你传递一个对象时（例如传递给一个方法），接下来的发生情况取决于对象的类型。你在本章及之前的章节中已经简要地见过这一点，但在这里你将看到一些更实用的技巧。\n\
  \n值比较也是你经常看到的内容，至少对于简单类型是这样。涉及到比较对象的值时，情况会变得复杂一些。首先，你必须定义什么是比较，以及如 `>` 等运算符在你的类语境下意味着什么。这在集合中尤为重要，因为你可能想要根据某些条件（也许是字母顺序，或根据更复杂的算法）对对象进行排序。\n\
  \n### 类型比较\n\n在比较对象时，你通常需要知道它们的类型，这让你能够判断是否可以进行值比较。在第 9 章中，你看到了 `GetType()` 方法，所有类都继承自\
  \ `System.Object`，以及该方法如何与 `typeof()` 运算符结合使用，以确定（并根据对象类型采取行动）：\n\n```\nif (myObj.GetType()\
  \ == typeof(MyComplexClass))\n{\n   // myObj 是类 MyComplexClass 的实例。\n}\n```\n\n\
  你还见过 `ToString()` 的默认实现（它也继承自 `System.Object`），它将为你提供对象类型的字符串表示。你也可以比较这些字符串，尽管这种实现目标的方法相当杂乱。\n\
  \n本节演示了一种方便的简写方式：`is` 运算符。该运算符允许编写更具读性的代码，并且正如你将看到的，它具有检查基类的优势。在在查看 `is` 运算符之前，你需要了解在处理值类型（相对于引用类型）时，背后经常发生什么：装箱和拆箱。\n\
  \n#### 装箱与拆箱\n\n在第 8 章中，你学习了引用类型和值类型之间的区别，这在第 9 章中通过比较结构体（值类型）和类（引用类型）进行了说明。装箱是将值类型转换为\
  \ `System.Object` 类型或该值类型实现的接口类型的行为。拆箱则是相反的转换。\n\n例如，假设你有如下的结构体类型：\n\n```\nstruct\
  \ MyStruct\n{\n   public int Val;\n}\n```\n\n你可以通过将该类型的结构体放入 `object` 类型的变量中对其装箱：\n\
  \n```\nMyStruct valType1 = new MyStruct();\nvalType1.Val = 5;\nobject refType =\
  \ valType1;\n```\n\n在这里，你创建了一个 `MyStruct` 类型的新变量（`valType1`），给该结构体的 `Val` 成员赋值，然后将其装箱到\
  \ `object` 类型的变量（`refType`）中。\n\n通过这种方式对变量装箱创建的对象包含一个对值类型变量副本的引用，而不是对原始值类型变量的引用。你可以通过修改原始结构体的内容，然后将对象中的结构体拆箱到一个新变量并检查其内容来验证这一点：\n\
  \n```\nvalType1.Val = 6;\nMyStruct valType2 = (MyStruct)refType;\nWriteLine($\"\
  valType2.Val = {valType2.Val}\");\n```\n\n这段代码给出了以下输出：\n\n```\nvalType2.Val = 5\n\
  ```\n\n然而，当你将引用类型赋值给对象时，会有不同的行为。你可以通过将 `MyStruct` 改为类（忽略该类名现在并不合适）来看这一点：\n\n```\n\
  class MyStruct\n{\n   public int Val;\n}\n```\n\n在之前显示的客户端代码不做更改的情况下（再次忽略命名错误的变量），你得到如下输出：\n\
  \n```\nvalType2.Val = 6\n```\n\n你也可以将值类型装箱为接口类型，只要它们实现了该接口。例如，假设 `MyStruct` 类型如下所示实现了\
  \ `IMyInterface` 接口：\n\n```\ninterface IMyInterface {}\nstruct MyStruct : IMyInterface\n\
  {\n   public int Val;\n}\n```\n\n然后你可以将结构体装箱为 `IMyInterface` 类型：\n\n```\nMyStruct\
  \ valType1 = new MyStruct();\nIMyInterface refType = valType1;\n```\n\n你可以通过强制类型转换将其拆箱：\n\
  \n```\nMyStruct valType2 = (MyStruct)refType;\n```\n\n#### is 运算符\n\n尽管名字里有 `is`，但该运算符并不是用来判断对象是否是某种类型。相反，`is`\
  \ 运算符允许你检查对象是否是或可以转换为给定类型。如果是，则运算符求值为 `true`。\n\n早期的示例展示了 `Cow` 和 `Chicken` 类，它们都继承自\
  \ `Animal`。使用 `is` 运算符与 `Animal` 进行比较对于这三种类型都会返回 `true`。\n\n`is` 运算符的语法如下：\n\n```\n\
  <operand> is <type>\n```\n\n该表达式的可能结果如下：\n\n*   如果 `<type>` 是类类型，如果 `<operand>`\
  \ 是该类型、继承自该类型或可以装箱为该类型，结果为 `true`。\n*   如果 `<type>` 是接口类型，如果 `<operand>` 是该类型或它是实现了该接口的类型，结果为\
  \ `true`。\n*   如果 `<type>` 是值类型，如果 `<operand>` 是该类型或它是可以拆箱为该类型的类型，结果为 `true`。\n\n\
  ### 值比较\n\n考虑两个代表人的 `Person` 对象，每个对象都有一个整数 `Age` 属性。你可能想要比较它们以查看谁的年龄更大。你可以直接使用以下代码：\n\
  \n```\nif (person1.Age > person2.Age)\n{\n   …\n}\n```\n\n这种方法完全可行，但也有其他方案。你可能更喜欢使用如下的语法：\n\
  \n```\nif (person1 > person2)\n{\n   …\n}\n```\n\n\n\n\n通过 `operator overloading`（运算符重载）可以实现，你将在本节中介绍它。这是一项强大的技术，但应该谨慎使用。在前面的代码中，并不能立刻看出比较的是年龄——它也可能是身高、体重、IQ\
  \ 或仅仅是通用的“卓越程度”。\n\n另一个选项是使用 `IComparable` 和 `IComparer` 接口，它们允许你以标准的方式定义对象之间如何进行比较。这种技术受\
  \ .NET Framework 中各种集合类的支持，它是对集合进行排序的极佳方法。\n\n## 运算符重载\n\n`operator overloading`\
  \ 允许你对你自己设计的类使用标准运算符，如 `+`、`>` 等。这被称为“重载”，因为当这些运算符与特定参数类型配合时，你为它们提供了自己的实现，这与你通过为同名方法提供不同的参数来重载方法非常相似。\n\
  \n运算符重载非常有用，因为你可以在运算符重载的实现中执行任何你需要的处理，这可能并不像例如 `+`（意味着“将这两个操作数相加”）那么简单。稍，你将在 `CardLib`\
  \ 库的进一步升级中看到一个很好的例子，届时你将为比较运算符提供实现，通过比较两张牌来判断哪一张在回合（纸牌游戏的一轮）中能胜过另一张。\n\n由于许多纸牌游戏中的回合取决于涉及的牌的花色，这并不像比较牌上的数字那么简单。如果第二出的牌花色与第一张不同，那么无论点数如何，第一张牌都获胜。你可以通过考虑两个操作数的顺序来实现这一点。你还可以考虑王牌，即使王牌不是第一个出的花色，它也能击败其他花色。这意味着计算\
  \ `card1` > `card2` 为 `true`（即，如果 `card1` 先出，则 `card1` 将胜过 `card2`）并不一定意味着 `card2`\
  \ > `card1` 为 `false`。如果 `card1` 和 `card2` 都不是王牌且它们属于不同的花色，那么这两项比较都将为 `true`。\n\n\
  不过，我们先来看运算符重载的基本语法。可以通过向类中添加运算符类型成员（必须是 `static` 静态）来重载运算符。某些运算符有多种用途（例如 `-`，它具有一元和二元能力）；因此，你还需要指定你处理的几个操作数以及这些操作数的类型。通常情况下，操作数的类型与定义运算符的类类型相同，尽管也可以定义作用于混合类型的运算符，正如你很快将看到的。\n\
  \n作为一个示例，考虑如下定义的简单类型 `AddClass1`：\n\n```\npublic class AddClass1\n{\n   public int\
  \ val;\n}\n```\n\n这只是对 `int` 值的封装，但它说明了原理。使用此类，如下代码将无法编译：\n\n```\nAddClass1 op1\
  \ = new AddClass1();\nop1.val = 5;\nAddClass1 op2 = new AddClass1();\nop2.val =\
  \ 5;\nAddClass1 op3 = op1 + op2;\n```\n\n你得到的错误告知你 `+` 运算符无法应用于 `AddClass1` 类型的操作数。这是因为你还没有定义要执行的操作。如下代码可以运行，但它不会带给你可能想要的结果：\n\
  \n```\nAddClass1 op1 = new AddClass1();\nop1.val = 5;\nAddClass1 op2 = new AddClass1();\n\
  op2.val = 5;\nbool op3 = op1 == op2;\n```\n\n在这里，`op1` 和 `op2` 通过 `==` 二元运算符进行比较，以判断它们是否引用同一个对象，而不是验证它们的值是否相等。在前面的代码中，`op3`\
  \ 将为 `false`，尽管 `op1.val` 和 `op2.val` 相同的。要重载 `+` 运算符，请使用以下代码：\n\n```\npublic class\
  \ AddClass1\n{\n   public int val;\n   public static AddClass1 operator +(AddClass1\
  \ op1, AddClass1 op2)\n   {\n      AddClass1 returnVal = new AddClass1();\n    \
  \  returnVal.val = op1.val + op2.val;\n      return returnVal;\n   }\n}\n```\n\n\
  如你所示，运算符重载看起来非常标准的 `static` 方法声明，区别在于它们使用 `operator` 关键字和运算符本身，而不是方法名。你现在可以成功地对该类使用\
  \ `+` 运算符，如上一个示例所示：\n\n```\nAddClass1 op3 = op1 + op2;\n```\n\n重载所有二元运算符遵循相同的模式。一元运算符看起来相似，但只有一个参数：\n\
  \n```\npublic class AddClass1\n{\n   public int val;\n   public static AddClass1\
  \ operator +(AddClass1 op1, AddClass1 op2)\n   {\n      AddClass1 returnVal = new\
  \ AddClass1();\n      returnVal.val = op1.val + op2.val;\n      return returnVal;\n\
  \   }\n   public static AddClass1 operator -(AddClass1 op1)\n   {\n      AddClass1\
  \ returnVal = new AddClass1();\n      returnVal.val = -op1.val;\n      return returnVal;\n\
  \   }\n}\n```\n(注：原文中存在大量重复和断裂的代码块，已根据逻辑进行了清理，以确保文档的专业性和读性。)\n\n\n\n\n```cs\npublic\
  \ class AddClass1\n{\n   public int val;\n   public static bool operator >=(AddClass1\
  \ op1, AddClass1 op2)\n          => (op1.val >= op2.val);\n   public static bool\
  \ operator <(AddClass1 op1, AddClass1 op2)\n          => !(op1 >= op2);\n   // Also\
  \ need implementations for <= and > operators.\n}\n```\n\n在更复杂的运算符定义中，这可以减少代码行数。这也意味着如果你以后决定修改这些运算符的实现，你需要更改的代码也会更少。\n\
  \n同样的情况适用于 `==` 和 `!=`，但对于这些运算符，重写（override）`Object.Equals()` 和 `Object.GetHashCode()`\
  \ 通常是值得的，因为这两个函数也可以用于用于比较对象。通过重写这些方法，你可以确保该类的用户使用任何种技术，都能得到相同的结果。这并非必须的，但为了完整性，加上它是好的。它需要以下非静态重写（override）方法：\n\
  \n```sharp\npublic class AddClass1\n{\n   public int val;\n   public static bool\
  \ operator ==(AddClass1 op1, AddClass1 op2)\n          => (op1.val == op2.val);\n\
  \   public static bool operator !=(AddClass1 op1, AddClass1 op2)\n          => !(op1\
  \ == op2);\n   public override bool Equals(object op1) => val == ((AddClass1)op1).val;\n\
  \   public override int GetHashCode() => val;\n}\n```\n\n`GetHashCode()` 用于根据对象的状态为对象实例获取一个唯一的\
  \ `int` 值。在这里，使用 `val` 是可以的，因为它也是一个 `int` 值。\n\n注意，`Equals()` 使用了 `object` 类型参数。你需要使用此签名，否则你将是在重载（overload）而不是重写（override）该方法，且类的用户仍然可以访问默认实现。相反，你必须使用类型转换来获取所需的结果。在像下面的代码中使用之前讨论过的\
  \ `is` 运算符检查对象类型通常是值得的：\n\n```sharp\n public override bool Equals(object op1)\n\
  \   {\n      if (op1 is AddClass1)\n      {\n         return val == ((AddClass1)op1).val;\n\
  \      }\n      else\n      {\n         throw new ArgumentException(\n         \
  \   \"Cannot compare AddClass1 objects with objects of type \"\n            + op1.GetType().ToString());\n\
  \      }\n   }\n```\n\n在这段代码中，如果传递给 `Equals` 的操作数类型错误或无法转换为正确的类型，将抛出一个异常。当然，这种行为可能不是你所想要的。你可能希望能够比较一种类型的对象与另一种类型的对象，在这种情况下，就需要更多的分支处理。或者，你可能希望将比较限制在两个对象都是完全相同类型的情况下，这需要对第一个\
  \ `if` 语句进行如下更改：\n\n```sharp\n if (op1.GetType() == typeof(AddClass1))\n```\n\n\
  ## 为 CardLib 添加运算符重载\n\n现在，你将再次升级你的 `Ch11CardLib` 项目，为 `Card` 类添加运算符重载。同样，你可以在本章代码下载的\
  \ `Ch11CardLib` 文件夹中找到后续类的代码。不过，你首先将向 `Card` 类添加额外的字段，以允许王牌花色（trump suits）以及将牌置大的选项。将它们设置为静态（static），因为当它们被设置时，它们适用于所有的\
  \ `Card` 对象：\n\n```sharp\n public class Card\n   {\n      /// <summary>\n      ///\
  \ 王牌使用的标记。如果为真，则王牌的价值高于\n      /// 其他花色的牌。\n      /// </summary>\n      public static\
  \ bool useTrumps = false;\n      /// <summary>\n      /// 如果 useTrumps 为真，则使用的王牌花色。\n\
  \      /// </summary>\n      public static Suit trump = Suit.Club;\n      /// <summary>\n\
  \      /// 决定王牌是比王大还是比 2（deuces）小的标记。\n      /// </summary>\n      public static\
  \ bool isAceHigh = true;\n```\n\n这些规则适用于应用程序中每个 `Deck` 中的所有 `Card` 对象。不可能让两副牌中各自包含的牌遵守不同的规则。不过，对于这个类库来说没关系，因为你可以安全地假设，如果单个应用程序想要使用不同的规则，它可以自己维护这些规则，例如在切换牌组时设置\
  \ `Card` 的静态成员。\n\n由于你已经这样做了，在 `Deck` 类中添加几个更多的构造函数来初始化具有不同特征的牌组是值得的：\n\n```sharp\n\
  \ /// <summary>\n      /// 非默认构造函数。允许将王牌置大。\n      /// </summary>\n      public\
  \ Deck(bool isAceHigh) : this()\n      {\n         Card.isAceHigh = isAceHigh;\n\
  \      }\n      /// <summary>\n      /// 非默认构造函数。允许使用王牌花色。\n      /// </summary>\n\
  \      public Deck(bool useTrumps, Suit trump) : this()\n      {\n         Card.useTrumps\
  \ = useTrumps;\n         Card.trump = trump;\n      }\n      /// <summary>\n   \
  \   /// 非默认构造函数。允许将王牌置大并使用王牌花色。\n      /// </summary>\n      public Deck(bool isAceHigh,\
  \ bool useTrumps, Suit trump) : this()\n      {\n         Card.isAceHigh = isAceHigh;\n\
  \         Card.useTrumps = useTrumps;\n         Card.trump = trump;\n      }\n```\n\
  \n这些构造函数每一个都是通过 第 9 章 所示的 `this()` 语法定义的，因此在所有情况下，在初始化牌组之前都会调用默认构造函数。\n\n现在为 `Card`\
  \ 类添加你的运算符重载（以及建议的重写）：\n\n```sharp\n public static bool operator ==(Card card1,\
  \ Card card2)\n         => card1?.suit == card2?.suit && (card1?.rank == card2?.rank);\n\
  \      public static bool operator !=(Card card1, Card card2)\n             => !(card1\
  \ == card2);\n      public override bool Equals(object card) => this == (Card)card;\n\
  \      public override int GetHashCode()\n                      => 13 * (int)suit\
  \ + (int)rank;\n      public static bool operator >(Card card1, Card card2)\n  \
  \    {\n         if (card1.suit == card2.suit)\n         {\n            if (isAceHigh)\n\
  \            {\n               if (card1.rank == Rank.Ace)\n               {\n \
  \                 if (card2.rank == Rank.Ace)\n                     return false;\n\
  \                  else\n                     return true;\n               }\n \
  \              else\n               {\n                  if (card2.rank == Rank.Ace)\n\
  \                     return false;\n                  else\n                  \
  \   return (card1.rank > card2.rank);\n               }\n            }\n       \
  \     else\n            {\n               return (card1.rank > card2.rank);\n  \
  \          }\n         }\n         else\n         {\n            if (useTrumps &&\
  \ (card2.suit == Card.trump))\n               return false;\n            else\n\
  \               return true;\n         }\n      }\n      public static bool operator\
  \ <(Card card1, Card card2)\n             => !(card1 >= card2);\n      public static\
  \ bool operator >=(Card card1, Card card2)\n      {\n         if (card1.suit ==\
  \ card2.suit)\n         {\n            if (isAceHigh)\n            {\n         \
  \      if (card1.rank == Rank.Ace)\n               {\n                  return true;\n\
  \               }\n               else\n               {\n                  if (card2.rank\
  \ == Rank.Ace)\n                     return false;\n                  else\n   \
  \                  return (card1.rank >= card2.rank);\n               }\n      \
  \      }\n            else\n            {\n               return (card1.rank >=\
  \ card2.rank);\n            }\n         }\n         else\n         {\n         \
  \   if (useTrumps && (card2.suit == Card.trump))\n               return false;\n\
  \            else\n               return true;\n         }\n      }\n      public\
  \ static bool operator <=(Card card1, Card card2)\n             => !(card1 > card2);\n\
  ```\n\n这里没什么特别需要注意的，也许 `>` 和 `>=` 重载运算符的代码稍微长。通过单步执行 `>` 代码，你可以看到它是如何工作的以及为什么这些步骤是必要的。\n\
  \n\n\n\n\n你正在比较两张牌，`card1` 和 `card2`，其中假设 `card1` 是先放在桌上的那张牌。正如之前讨论的，这在你在使用王牌时非常重要，因为即使非王牌的点数更高，王牌也会胜过非王牌。当然，如果两张牌的花色相同，那么该花色是否为王牌就无关了，这是你进行的第一次比较：\n\
  \n```csharp\npublic static bool operator >(Card card1, Card card2)\n{\n   if (card1.suit\
  \ == card2.suit)\n   {\n```\n\n如果静态标志位 `isAceHigh` 为 `true`，则你不能直接通过 `Rank` 枚举中的值来比较牌的点数，因为在这个枚举中，Ace\
  \ 的点值为 `1`，这小于所有其他点数。相反，请使用以下步骤：\n\n- 如果第一张牌是 Ace，则检查第二张牌是否也是 Ace。如果是，那么第一张牌将不会胜过第二张牌；如果第二张牌不是\
  \ Ace，则第一张牌胜出：\n\n```csharp\n     if (isAceHigh)\n                {\n          \
  \         if (card1.rank == Rank.Ace)\n                   {\n                  \
  \    if (card2.rank == Rank.Ace)\n                         return false;\n     \
  \                 else\n                         return true;\n                \
  \   }\n```\n\n- 如果第一张牌不是 Ace，那么你还需要检查第二张牌是否是 Ace。如果是，则第二张牌胜出；否则，你可以比较点数值，因为你已经知道\
  \ Ace 不是问题：\n\n```csharp\n     else\n                   {\n                    \
  \  if (card2.rank == Rank.Ace)\n                         return false;\n       \
  \               else\n                         return (card1.rank > card2?.rank);\n\
  \                   }\n                }\n```\n\n- 如果 Ace 不是大牌，那么你只需要比较点数值：\n\n\
  ```csharp\n     else\n                {\n                   return (card1.rank >\
  \ card2.rank);\n                }\n```\n\n代码剩余涉及 `card1` 和 `card2` 花色不同的情况。在这里，静态标志位\
  \ `useTrumps` 至关重要。如果该标志为 `true` 且 `card2` 是王牌花色，那么你可以确定地说 `card1` 不是王牌（因为两张牌花色不同）；而王牌总是获胜，所以\
  \ `card2` 是更大的牌：\n\n```csharp\n else\n   {\n      if (useTrumps && (card2.suit ==\
  \ Card.trump))\n         return false;\n```\n\n如果 `card2` 不是王牌（或 `useTrumps` 为 `false`），则\
  \ `card1` 胜出，因为它是先放下的那张牌：\n\n```csharp\n else\n         return true;\n   }\n}\n\
  ```\n\n只有另一个运算符（`>=`）使用了类似的代码，其他运算符非常简单，因此没有必要对它们进行更详细的介绍。\n\n简单的客户端代码测试了这些运算符。只需将其置于客户端项目的\
  \ `Main()` 方法中即可测试，就像之前 `CardLib` 示例中所示客户端代码一样（你可以在 `Ch11CardClient\\Program.cs`\
  \ 中找到这段代码）：\n\n```csharp\nCard.isAceHigh = true;\nWriteLine(\"Aces are high.\");\n\
  Card.useTrumps = true;\nCard.trump = Suit.Club;\nWriteLine(\"Clubs are trumps.\"\
  );\nCard card1, card2, card3, card4, card5;\ncard1 = new Card(Suit.Club, Rank.Five);\n\
  card2 = new Card(Suit.Club, Rank.Five);\ncard3 = new Card(Suit.Club, Rank.Ace);\n\
  card4 = new Card(Suit.Heart, Rank.Ten);\ncard5 = new Card(Suit.Diamond, Rank.Ace);\n\
  WriteLine($\"{card1.ToString()} == {card2.ToString()} ? {card1 == card2}\");\nWriteLine($\"\
  {card1.ToString()} != {card3.ToString()} ? {card1 != card3}\");\nWriteLine($\"{card1.ToString()}.Equals({card4.ToString()})\
  \ ? \" +\n      $\" { card1.Equals(card4)}\");\nWriteLine($\"Card.Equals({card3.ToString()},\
  \ {card4.ToString()}) ? \" +\n      $\" { Card.Equals(card3, card4)}\");\nWriteLine($\"\
  {card1.ToString()} > {card2.ToString()} ? {card1 > card2}\");\nWriteLine($\"{card1.ToString()}\
  \ <= {card3.ToString()} ? {card1 <= card3}\");\nWriteLine($\"{card1.ToString()}\
  \ > {card4.ToString()} ? {card1 > card4}\");\nWriteLine($\"{card4.ToString()} >\
  \ {card1.ToString()} ? {card4 > card1}\");\nWriteLine($\"{card5.ToString()} > {card4.ToString()}\
  \ ? {card5 > card4}\");\nWriteLine($\"{card4.ToString()} > {card5.ToString()} ?\
  \ {card4 > card5}\");\nReadKey();\n```\n\n结果如图 11.7 所示。\n\n![执行代码后的命令行提示窗口，显示了客户端代码，最后\
  \ 4 行展示了王牌和非王牌牌。 ](img/c11f007.jpg)\n\n**图 11.7**\n\n\n\n\n在使用 `Comparer` 时，你必须使用可以比较的类型。例如，尝试将\
  \ `firstString` 与 `firstNumber` 进行比较将产生异常。\n\n关于此类的行为还有以下几点：\n\n*   传递给 `Comparer.Compare()`\
  \ 的对象将经过检查，以确定它们是否支持 `IComparable`。如果支持，则将使用该实现。\n*   允许空值，并将其解释为“小于”任何其他对象。\n*\
  \   字符串根据当前文化进行处理。若要根据不同的文化（或语言）处理字符串，必须使用其构造函数实例化 `Comparer` 类，这允许你传递一个指定要用文化的\
  \ `System.Globalization.CultureInfo` 对象。\n*   字符串是以区分大小写的方式处理的。若要以不区分大小写的方式处理它们，你需要使用\
  \ `CaseInsensitiveComparer` 类，它的工作方式与之前完全相同。\n\n### 排序集合\n\n许多集合类都允许排序，可以通过对象之间的默认比较或自定义方法来实现。`ArrayList`\
  \ 就是其中一个示例。它包含 `Sort()` 方法，该方法可以在不带参数的情况下（此时将使用默认比较），或者可以传递一个 `IComparer` 接口来比较对象对。\n\
  \n当你有一个填充了简单类型（如整数或字符串）的 `ArrayList` 时，默认比较器就足够了。对于你自己的类，你必须在类定义中实现 `IComparable`，或者创建一个支持\
  \ `IComparer` 的独立类来用于比较。\n\n注意，`System.Collections` 命名空间中的某些类（包括 `CollectionBase`）没有暴露排序方法。如果你想对派生自此类的集合进行排序，你必须做更多工作，自己对内部的\
  \ `List` 集合进行排序。\n\n接下来的“尝试”（Try It Out）展示了如何使用默认和非默认比较器对列表进行排序。\n\n## 转换\n\n到为止，你每当需要将一种类型转换为另一种类型时都会强制类型转换，但这并不是唯一的实现方法。就像\
  \ `int` 可以在计算过程中隐式地转换为 `long` 或 `double` 一样，你也可以定义你创建的类如何转换为其他类（隐式地或显式地）。要做到这一点，你需要重载转换运算符，就像在本章早些部分重载其他运算符一样。你将在本节的第一部分看到这些。你还会看到另一个有用的运算符\
  \ `as` 运算符，通常在使用引用类型时，它比强制类型转换更优。\n\n### 重载转换运算符\n\n如前所示，除了重载数学运算符外，你还可以定义类型之间的隐式和显式转换。如果你想在没有关系的类型之间进行转换，这是必要的——例如，如果它们之间没有继承关系，也没有共享的接口。\n\
  \n假设你在这 `ConvClass1` 和 `ConvClass2` 之间定义了隐式转换。这意味着你可以编写如下代码：\n\n```\nConvClass1\
  \ op1 = new ConvClass1();\nConvClass2 op2 = op1;\n```\n\n或者，你可以定义一个显式转换：\n\n```\n\
  ConvClass1 op1 = new ConvClass1();\nConvClass2 op2 = (ConvClass2)op1;\n```\n\n作为一个示例，考虑以下代码：\n\
  \n```csharp\npublic class ConvClass1\n{\n   public int val;\n   public static implicit\
  \ operator ConvClass2(ConvClass1 op1)\n   {\n      ConvClass2 returnVal = new ConvClass2();\n\
  \      returnVal.val = op1.val;\n      return returnVal;\n   }\n}\npublic class\
  \ ConvClass2\n{\n   public double val;\n   public static explicit operator ConvClass1(ConvClass2\
  \ op1)\n   {\n      ConvClass1 returnVal = new ConvClass1();\n      checked {returnVal.val\
  \ = (int)op1.val;};\n      return returnVal;\n   }\n}\n```\n\n在这里，`ConvClass1` 包含一个\
  \ `int` 值，而 `ConvClass2` 包含一个 `double` 值。由于 `int` 值可以隐式地转换为 `double` 值，你可以在 `ConvClass1`\
  \ 和 `ConvClass2` 之间定义隐式转换。然而，反之则不然，你应该将 `ConvClass2` 和 `ConvClass1` 之间的转换运算符定义为显式。\n\
  \n你如所示使用 `implicit` 和 `explicit` 关键字来指定此。使用这些类，以下代码是正常的：\n\n```\nConvClass1 op1\
  \ = new ConvClass1();\nop1.val = 3;\nConvClass2 op2 = op1;\n```\n\n然而，另一个方向的转换需要以下显式强制转换转换：\n\
  \n```\nConvClass2 op1 = new ConvClass2();\nop1.val = 3e15;\nConvClass1 op2 = (ConvClass1)op1;\n\
  ```\n\n因为你在显式转换中使用了 `checked` 关键字，在上述代码中将得到异常，因为 `op1` 的 `val` 属性太大，无法放入 `op2` 的\
  \ `val` 属性中。\n\n### as 运算符\n\n`as` 运算符使用以下语法将类型转换为指定的引用类型：\n\n```\n<operand> as\
  \ <type>\n```\n\n这只在某些情况下可行：\n\n*   如果 `<operand>` 是类型 `<type>`\n*   如果 `<operand>`\
  \ 可以隐式转换为类型 `<type>`\n*   如果 `<operand>` 可以装箱为类型 `<type>`\n\n注意，`System.Collections`\
  \ 命名空间中的某些类（包括 `CollectionBase`）没有暴露排序方法。如果你想对派生自此类的集合进行排序，你必须做更多工作，自己对内部的 `List`\
  \ 集合进行排序。\n\n接下来的“尝试”展示了如何使用默认和非默认比较器对列表进行排序。\n\n[注：原始文本中存在重复段落，已在翻译时进行去重处理]\n\n\
  这种功能使得 `as` 运算符非常有用，因为下面的代码（使用简单强制转换）会导致抛出异常。这意味着像如下的代码（使用本章早些部分开发的类 `Animal` 和派生自\
  \ `Animal` 的类 `Cow`）在 C# 应用程序中非常常见：\n\n```csharp\npublic void MilkCow(Animal myAnimal)\n\
  {\n   Cow myCow = myAnimal as Cow;\n   if (myCow != null)\n   {\n      myCow.Milk();\n\
  \   }\n   else\n   {\n     WriteLine($\"{myAnimal.Name} 不是牛，所以不能挤奶。\");\n   }\n\
  }\n```\n\n这比检查异常简单得多！\n\n![image](img/c02g003.jpg) 本章收获\n\n| **核心概念** | **描述** |\n\
  | :--- | :--- |\n| 定义集合 | 集合是包含其他类的实例。你可以通过派生 `CollectionBase` 来定义集合，或者自己实现 `IEnumerable`、`ICollection`\
  \ 和 `IList` 等集合接口。通常，你会为你的集合定义索引器，以便使用 `collection[index]` 语法访问成员。 |\n| 字典 | 你还可以定义键值集合（即字典），每个项目都有一个关联的键。在这种情况下，可以使用键来标识项目，而不是使用项目的索引。你可以通过实现\
  \ `IDictionary` 或派生自 `DictionaryBase` 类来定义字典。 |\n\n\n\n\n| 迭代器 | 你可以实现一个迭代器来控制循环代码在循环周期中获取值的方式。要对类进行迭代，请实现一个名为\
  \ `GetEnumerator()` 的方法，其返回类型为 `IEnumerator`。要对类的成员（如方法）进行迭代，请使用返回类型 `IEnumerable`\
  \ 的方法。在迭代器代码块中，使用 `yield` 关键字返回值。 |\n| 类型比较 | 你可以使用 `GetType()` 方法来获取对象的类型，或使用 `typeof()`\
  \ 运算符获取类的类型。然后你可以对这些类型值进行比较。你还可以使用 `is` 运算符判断对象是否与某个类类型兼容。 |\n| 值比较 | 如果你想让其实例类可以使用标准\
  \ C# 运算符进行比较的类，则你必须在类定义中重载这些运算符。对于其他类型的值比较，你可以使用实现了 `IComparable` 或 `IComparer`\
  \ 接口的类。这些接口对于排序集合特别有用。 |\n| `as` 运算符 | 你可以使用 `as` 运算符将值转换为引用类型。如果无法进行转换，`as` 运算符将返回\
  \ `null` 值。 |\n\n# 第 12 章：泛型\n\n## 本章的 Wrox.com 代码下载\n\n你可以在“下载代码”选项卡中，通过 `www.wrox.com/go/beginningvisualc#2015programming`\
  \ 找到本章的 `wrox.com` 代码下载。代码位于第 12 章 下载中，并根据章节中的名称进行单独命名。\n\n本章从泛型是什么开始。起初你会以相当抽象的术语学习泛型，因为学习泛型背后的概念对于能够有效地使用它们至关重要。\n\
  \n接下来，你将看到 .NET Framework 中一些泛型的实际应用。这将帮助你理解它们的功能和威力，以及代码中所需的新语法。然后，你将定义自己的泛型类型，包括泛型类、接口、方法和委托。你还学习了进一步自定义泛型的额外技术：`default`\
  \ 关键字和类型约束。\n\n最后，你将查看协变和逆变，这是 C# 4 引入的两种类型变异性形式，它们在使用泛型类时提供了更大的灵活性。\n\n## 什么是泛型？\n\
  \n为了最好说明泛型是什么以及它们为什么如此有用，请回想上一章中的集合类。你看到基本集合可以包含在 `ArrayList` 等类中，但此类集合受到由于没有类型而带来的限制。这要求你将\
  \ `object` 项强制转换为你实际存储在集合中的任何类型对象。由于任何继承自 `System.Object` 的内容（即几乎任何内容）都可以存储在 `ArrayList`\
  \ 中，因此你需要非常小心。假设集合中只包含某些类型会导致异常的抛出和代码逻辑的崩溃。你学习了一些处理此问题的技术，包括检查对象类型所需的代码。\n\n然而，你发现一个更好的解决方案是最初使用强类型集合类。通过派生自\
  \ `CollectionBase` 并提供自己的方法来添加、删除和其他方式访问集合成员，你学习了如何将集合成员限制为派自某个基类型或支持某个接口的成员。这时你遇到了一个问题。每当你创建一个需要放入集合中的新类时，你必须执行以下操作之一：\n\
  \n* 使用你已经创建的、可以包含新类型项的集合类。\n* 创建一个新的可以持有新类型项的集合类，并实现所有需要的方法。\n\n通常情况下，对于新类型你需要额外的功能，因此大多数时候，你仍然需要一个新的集合类。因此，创建集合类会占用你大量的时间！\n\
  \n相反，`泛型类` 让代码编写变得简单得多。泛型类是围绕你在实例化期间提供的任何类型或多个类型构建的，使你能够几乎不费力地对对象进行强类型处理。在集合上下文中，创建一个“`T`\
  \ 类型对象的集合”就像口口说一样简单——并且可以通过一行代码实现。与其使用如下代码，\n\n```\nCollectionClass items = new\
  \ CollectionClass();\nitems.Add(new ItemClass());\n```\n\n你可以使用这种：\n\n```\nCollectionClass<ItemClass>\
  \ items = new CollectionClass<ItemClass>();\nitems.Add(new ItemClass());\n```\n\n\
  尖括号语法是将类型参数传递给泛类型的方法。在前面的代码中，将 `CollectionClass<ItemClass>` 读作 `ItemClass` 类型的 `CollectionClass`。当然，你将在本章的晚些部分更详细地检查这种语法。\n\
  \n泛型主题不仅限于集合，但它们特别适用于这一领域，正如你将在本章稍后查看 `System.Collections.Generic` 命名空间时所看到的。通过创建泛型类，你可以生成签名可以强类型为任何所需类型的方法，甚至可以适应类型可以是值类型或引用类型的事实，并处理发生的个别情况。你甚至可以允许使用部分类型，通过将实例化泛型类使用的类型限制为支持给定接口或派生自特定类型的类型。此外，你不局限于泛型类——你可以创建泛型接口、泛型方法（可以在非泛型类上定义），甚至是泛型委托。这一切都为你的代码增加了大量的灵活性，明智地使用泛型可以节省数小时开发时间。\n\
  \n你可能在好奇这一切是如何可能的。通常，当你创建一个类时，它会被编译成一种你可以在代码中使用的类型。你可能认为，当你创建一个泛型类时，它必须被编译成大量的类型以便你进行实例化。幸运的是，事实并非如此——考虑到\
  \ .NET 中无限可能的类，这样最好。在后台，.NET 运行时允许根据需要动态生成泛型类。给定的 `B` 类型的泛型类 `A` 在你实例化它之前是不存在的。\n\
  \n## 使用泛型\n\n在查看如何创建自己的泛型类型之前，查看 .NET Framework 提供的泛型是值得的。这些包括 `System.Collections.Generic`\
  \ 命名空间中的类型，你在代码中多次看到这个命名空间，因为它是默认包含的。你尚未使用该命名空间中的任何类型，但情况即将发生。本节将介绍该命名空间中的类型以及你如何使用它们创建强类型集合并改进现有集合的功能。\n\
  \n首先，你将查看另一个简单的泛型类型，它绕过了值类型的一个小问题：`可空类型`。\n\n### 可空类型\n\n在前面的章节中，你看到值类型（包括 `int`\
  \ 和 `double` 等大多数基本类型以及所有结构体）与引用类型（`string` 和任何类）的区别之一是，它们必须包含一个值。它们在声明之后、赋值之前可以处于未赋值状态，但你无法以任何方式在该状态利用值类型。相反，引用类型可以为\
  \ `null`。\n\n在某些情况下，且出现频率比你想象的要高（特别是当你与数据库交互时），拥有一个可以为 `null` 的值类型是有用的。泛型为你提供了一种使用\
  \ `System.Nullable<T>` 类型来实现的方法，如下例所示：\n\n\n\n\n\n```\nSystem.Nullable<int> nullableInt;\n\
  ```\n\n这段代码声明了一个名为 `nullableInt` 的变量，它可以拥有 `int` 变量可以拥有的任何值，外加 `null` 值。这允许你编写如下代码：\n\
  \n```\nnullableInt = null;\n```\n\n如果 `nullableInt` 是一个 `int` 类型变量，那么前面的代码将无法编译。\n\
  \n前面的赋值等同于以下代码：\n\n```\nnullableInt = new System.Nullable<int>();\n```\n\n与任何其他变量一样，你不能在进行某种初始化之前直接使用它，无论是初始化为\
  \ `null`（通过之前显示的任一种语法）还是赋值一个值。\n\n你可以测试可空类型来确定它们是否为 `null`，就好像测试引用类型一样：\n\n```\n\
  if (nullableInt == null)\n{\n   …\n}\n```\n\n或者，你可以使用 `HasValue` 属性：\n\n```\nif\
  \ (nullableInt.HasValue)\n{\n   …\n}\n```\n\n这对于引用类型是无效的，即使该类型本身有 `HasValue` 属性也是，因为一个值为\
  \ `null` 的引用类型变量意味着不存在任何可以访问该属性的对象，这将抛出异常。\n\n你还可以通过 `Value` 属性查看可空类型的值。如果 `HasValue`\
  \ 为 `true`，则可以保证 `Value` 有一个非 `null` 值；但如果 `HasValue` 为 `false` —— 即给变量赋值了 `null`\
  \ ——那么访问 `Value` 将导致类型为 `System.InvalidOperationException` 的异常。\n\n注意，可空类型非常有用，以至于\
  \ C# 语法的修改。与其使用之前显示的语法来声明可空类型变量，不如使用如下：\n\n```\nint? nullableInt;\n```\n\n`int?`\
  \ 只是 `System.Nullable<int>` 的简写，但可读性更高。在随后的章节中你将使用这种语法。\n\n## 运算符与可空类型\n\n对于简单类型（如\
  \ `int`），你可以使用 `+`、`-` 等运算符来处理值。对于可空等等类型，没有区别：可空类型包含的值会被隐式转换为所需的类型，并使用相应的运算符。这也适用于你提供的带有运算符的结构体：\n\
  \n```\nint? op1 = 5;\nint? result = op1 * 2;\n```\n\n注意这里 `result` 变量的类型也是 `int?`。以下代码将无法编译：\n\
  \n```\nint? op1 = 5;\nint result = op1 * 2;\n```\n\n要让此代码工作，你必须执行显式转换或通过 `Value`\
  \ 属性访问值，这需要如下：\n\n```\nint? op1 = 5;\nint result = (int)op1 * 2;\n```\n\n或者：\n\n\
  ```\nint? op1 = 5;\nint result = op1.Value * 2;\n```\n\n只要 `op1` 有值，这样做就可以正常工作 ——\
  \ 如果它是 `null`，你将得到一个类型为 `System.InvalidOperationException` 的异常。\n\n这引出了明显的问题：当涉及两个可空值的运算符求值其中一个或两个值都是\
  \ `null` 时（例如下面的代码中的 `op1`），会发生什么？\n\n```\nint? op1 = null;\nint? op2 = 5;\nint?\
  \ result = op1 * op2;\n```\n\n答案是，对于 `bool?` 之外的所有简单可空类型，操作的结果都是 `null`，你可以将其解释为“无法计算”。对于结构体，你可以定义自己的运算符来处理这种情况（如本章稍后所示），而对于\
  \ `bool?`，定义了 `&` 和 `|` 运算符，它们可能会产生非 `null` 返回值。表格中的结果在逻辑上是完全合理的 —— 如果有足够的信息可以计算出结果而不需要知道其中一个操作数的值，那么该操作数是否为\
  \ `null` 就无关了。\n\n## ?? 运算符\n\n为了进一步减少处理可空类型所需的代码量，并更容易处理可能为 `null` 的变量，你可以使用 `??`\
  \ 运算符。它被称为空合并运算符，是一个二元运算符，允许为可能求值为 `null` 的表达式提供备用值。如果第一个操作数不是 `null`，则运算符求值为第一个操作数；如果第一个操作数是\
  \ `null`，则求值为第二个操作数。在功能上，以下两个表达式是等价的：\n\n```\nop1 ?? op2\nop1 == null ? op2 : op1\n\
  ```\n\n在代码中，`op1` 可以是任何可空表达式，包括引用类型，重要的是，还包括可空类型。这意味着你可以使用 `??` 运算符在可空类型为 `null`\
  \ 时提供使用的默认值，如下所示：\n\n```\nint? op1 = null;\nint result = op1 * 2 ?? 5;\n```\n\n\
  因为在示例中 `op1` 是 `null`，所以 `op1 * 2` 也会是 `null`。然而，`??` 运算符检测到了这一点并将值 `5` 赋值给 `result`。重要的是，注意这里不需要将结果放入\
  \ `int` 类型变量 `result` 中进行显式转换。`??` 运算符为你处理了这种转换。或者，你也可以将 `??` 求值的结果传递给 `int?` 而没有任何问题：\n\
  \n```\nint? result = op1 * 2;\n```\n\n## ?. 运算符\n\n该运算符通常被称为 Elvis 运算符或空条件运算符，有助于克服由空检查引起的歧义。例如，如果你想获取特定客户的订单计数，你需要检查\
  \ `null`：\n\n```\nint count = 0;\nif (customer.orders != null)\n{\n  count = customer.orders.Count();\n\
  }\n```\n\n如果你只是这样写，并且该客户没有订单（即为 `null`），则会抛出 `System.ArgumentNullException`：\n\n\
  ```\nint count = customer.orders.Count();\n```\n\n使用 `?.` 运算符可以防止这种情况：\n\n```\n\
  int? count = customer.orders?.Count();\n```\n\n使用 `?.` 运算符会导致 `int?` 的 `count` 被设置为\
  \ `null` 而不是发生异常。\n\n```\nint? count = customer.orders?.Count();\n```\n\n将上一节讨论的空合并运算符\
  \ `??` 与空条件运算符 `?.` 结合起来，可以在结果为 `null` 时设置默认值。\n\n```\nint count = customer.orders?.Count()\
  \ ?? 0;\n```\n\n## 使用可空类型\n\n使用下面的 Try It Out 来实验一个可空的 `Vector` 类型。\n\n### System.Collections.Generic\
  \ 命名空间\n\n在目前为止使用的几乎每个应用程序中，你都看到了以下命名空间：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n```\n\n\n\
  \n\n`System` 命名空间包含了 .NET 应用中使用的大多数基本类型。`System.Text` 命名空间包含了与字符串处理和编码相关的类型。你将在本书的后续部分查看\
  \ `System.Linq` 命名空间。`System.Threading.Tasks` 命名空间包含了帮助你编写异步代码的类型，本书将涵盖这部分。但 `System.Collections.Generic`\
  \ 又是怎样的？为什么它默认包含在控制台应用程序中？\n\n答案是，该命名空间包含了用于处理集合的泛型，由于它被使用的频率非常高，因此默认配置了 `using`\
  \ 语句，以便你无需限定符即可直接使用。\n\n现在你将查看这些类型，它们保证会让你的工作变得更轻松。它们让你能够几乎不费吹灰地创建强类型集合类。表 12.1\
  \ 列出了 `System.Collections.Generic` 命名空间在本节中介绍两个类型。该命名空间中的更多类型将在本章稍后部分介绍。\n\n| `Type`\
  \ | `Description` |\n| :--- | :--- |\n| `List<T>` | 类型 `T` 对象的集合 |\n| `Dictionary<K,\
  \ V>` | 与类型 `K` 的键相关的类型 `V` 项集合 |\n\n**表 12.1**](#c12.xhtml_c12-tbl-anc-0001) 泛型集合类型\n\
  \n本节还描述了用于这些类的各种接口和委托。\n\n### List<T>\n\n与其像上一节那样从 `CollectionBase` 派生类并实现所需的方法，直接使用\
  \ `List<T>` 泛型集合类型可能会更快、更简单。这里的一个额外好处是，许多你通常需要实现的方法（例如 `Add()`）已经为你实现了。\n\n创建一个类型为\
  \ `T` 对象的集合需要以下代码：\n\n```\nList<T> myCollection = new List<T>();\n```\n\n就这些。你不需要定义任何类、实现任何方法，或进行任何其他操作。你还可以通过向构造函数传递一个\
  \ `List<T>` 对象来在集合中设置初始项列表。`List<T>` 还具有一个 `Item` 属性，允许类似数组的访问：\n\n```\nT itemAtIndex2\
  \ = myCollectionOfT[2];\n```\n\n该类支持其他几个方法，但这些已足够让你入门了。接下来的“尝试一下”演示了如何在实践中使用 `List<T>`。\n\
  \n### 泛型列表的排序和搜索\n\n排序泛型列表与排序任何其他列表非常相似。上一节描述了如何使用 `IComparer` 和 `IComparable` 接口来比较两个对象，从而对该类型的对象列表进行排序。这里的区别在于你可以使用泛型接口\
  \ `IComparer<T>` 和 `IComparable<T>`，它们暴露了略有不同且特定类型的方法。表 12.2 解释了这些差异。\n\n| `Generic\
  \ Method` | `Nongeneric Method` | `Difference` |\n| :--- | :--- | :--- |\n| `Int\
  \ IComparable<T>.CompareTo(T otherObj)` | `int IComparable.CompareTo(object otherObj)`\
  \ | 泛型版本是强类型的。 |\n| `Bool IComparable<T>.Equals(T otherObj)` | N/A | 非泛型接口上不存在；可以使用继承的\
  \ `object.Equals()` 代替。 |\n| `Int IComparer<T>.Compare(T objectA, T objectB)` |\
  \ `int IComparer.Compare(object objectA, object objectB)` | 泛型版本是强类型的。 |\n| `Bool\
  \ IComparer<T>.Equals(T objectA, T objectB)` | N/A | 非泛型接口上不存在；可以使用继承的 `object.Equals()`\
  \ 代替。 |\n| `Int IComparer<T>.GetHashCode(T objectA)` | N/A | 非泛型接口上不存在；可以使用继承的 `object.GetHashCode()`\
  \ 代替。 |\n\n**表 12.2**](#c12.xhtml_c12-tbl-anc-0002) 使用泛型类型排序\n\n要排序 `List<T>`，你可以为待排序的类型提供\
  \ `IComparable<T>` 接口，或者提供一个 `IComparer<T>` 接口。或者，你可以提供一个泛型委托作为排序方法。从观察代码如何工作的角度来看，这要有得多，因为实现这里描述的接口所花费的精力并不比实现它们的非泛型版本多。\n\
  \n总的来说，排序列表只需要一个比较两个类型为 `T` 对象的方法；而搜索只需要一个检查类型为 `T` 对象以判断其是否符合某些标准的方法。定义此类方法是一件简单的事，为了帮助你，你可以使用两种泛型委托类型：\n\
  \n*   `Comparison<T>` — 用于排序的方法的委托类型，具有以下返回类型和参数：\n\n```\nint method(T objectA,\
  \ T objectB)\n```\n\n*   `Predicate<T>` — 用于搜索的方法的委托类型，具有以下返回类型和参数：\n\n```\nbool\
  \ method(T targetObject)\n```\n\n你可以定义任意数量的此类方法，并使用它们“插拔”到 `List<T>` 的搜索和排序方法中。下一个“尝试一下”将阐述这种技术。\n\
  \n### Dictionary<K, V>\n\n`System.Collections.Generic` 命名空间包含了用于处理集合的泛型，由于它被使用的频率非常高，因此默认配置了\
  \ `using` 语句，以便你无需限定符即可直接使用。\n\n现在你将查看这些类型，它们保证会让你的工作变得更轻松。它们让你能够几乎不费吹灰地创建强类型集合类。表\
  \ 12.1 列出了 `System.Collections.Generic` 命名空间在本节中介绍两个类型。该命名空间中的更多类型将在本章稍后部分介绍。\n\n\
  本节还描述了用于这些类的各种接口和委托。\n\n`Dictionary<K, V>` 类是键值对的集合，每个键与唯一一个值关联。`Dictionary<K, V>`\
  \ 类提供了一种通过键快速查找值的方法。`Dictionary<K, V>` 类使用哈希表实现，这意味着查找、插入和删除的平均时间复杂度均为 O(1)。\n\n\
  `Dictionary<K, V>` 类对于并发写入不是线程安全的。如果有多个线程同时访问并写入字典，你必须使用同步机制（如 `lock` 语句）来确保线程安全。`Dictionary<K,\
  \ V>` 类属于 `System.Collections.Generic` 命名空间，并适用于 .NET 2.0 及更高版本。\n\n\n\n\n你对最近几个章节中构建的\
  \ `CardLib` 项目可以进行的一个简单修改，是将 `Cards` 集合类更改为使用泛型集合类，从而节省许多行代码。`Cards` 类定义所需的修改如下（你可以在\
  \ `Ch12CardLib\\Cards.cs` 中找到此代码）：\n\n```\n public class Cards : List<Card>, ICloneable\
  \ { … }\n```\n\n你也可以移除 `Cards` 的所有方法，但 `Clone()`（`ICloneable` 所需的）和 `CopyTo()` 除外，因为\
  \ `List<Card>` 提供的 `CopyTo()` 版本适用于 `Card` 对象的数组，而不是 `Cards` 集合。`Clone()` 需要细小的修改，因为\
  \ `List<T>` 类没有定义可使用的 `List` 属性：\n\n```c\npublic object Clone()\n{\n    Cards newCards\
  \ = new Cards();\n    foreach (Card sourceCard in this)\n    {\n        newCards.Add((Card)sourceCard.Clone());\n\
  \    }\n    return newCards;\n}\n```\n\n与其在这里展示这个非常简单的修改的代码，`CardLib` 的更新版本（称为 `Ch12CardLib`）已包含在该章节的可下载代码中，以及上一章节的客户端代码。\n\
  \n## 定义泛型类型\n\n你现在已经学习了足够的泛型知识来创建自己的泛型。你已经看到了许多涉及泛型类型的代码，并大量练习了泛型语法。本节将介绍以下内容的：\n\
  \n* 泛型类\n* 泛型接口\n* 泛型方法\n* 泛型委托\n\n你还将查看以下处理定义泛型类型时出现的问题的更高级的技术：\n\n* `default`\
  \ 关键字\n* 约束类型\n* 继承自泛型类\n* 泛型操作符\n\n### 定义泛型类\n\n要创建一个泛型类，只需在类定义中包含角括号语法即可：\n\n\
  ```\nclass MyGenericClass<T> { … }\n```\n\n在这里，`T` 可以是你喜欢的任何标识符，遵循通常的 C# 命名规则（例如不以数字开头等）。不过，通常你直接使用\
  \ `T`。泛型类可以在定义中包含任意数量的类型参数，用逗号分隔：\n\n```\nclass MyGenericClass<T1, T2, T3> { … }\n\
  ```\n\n一旦定义了这些类型，你就可以像使用其他类型一样在类定义中使用它们。你可以将其作为成员变量的类型、属性或方法等成员的返回类型，以及方法参数的参数类型：\n\
  \n```sharp\nclass MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n\
  \   public MyGenericClass(T1 item)\n   {\n      innerT1Object = item;\n   }\n  \
  \ public T1 InnerT1Object\n   {\n      get { return innerT1Object; }\n   }\n}\n\
  ```\n\n在这里，类型为 `T1` 的对象可以传递给构造函数并通过属性 `InnerT1Object` 对该对象的只读访问。注意，你几乎无法对传递给类的类型做任何假设。例如，下面的代码将无法编译：\n\
  \n```sharp\nclass MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n\
  \   public MyGenericClass()\n   {\n      innerT1Object = new T1();\n   }\n   public\
  \ T1 InnerT1Object\n   {\n      get { return innerT1Object; }\n   }\n}\n```\n\n\
  因为你不知道 `T1` 是什么，你无法使用它的任何构造函数——它可能根本没有构造函数，或者可能没有公开访问的默认构造函数。在不涉及本节后面所示技巧的更复杂代码的情况下，你只能对\
  \ `T1` 做出如下假设：你可以将其视为要么继承自 `System.Object` 或者可以装箱为 `System.Object` 的类型。\n\n显然，这意味着你无法对该类型的实例或提供给泛型类\
  \ `MyGenericClass` 的其他类型执行任何有趣的操作。在不使用 `reflection`（一种用于在运行时检查类型的高级技术，本章未涵盖）的情况下，你仅限于不比以下代码复杂的代码：\n\
  \n```sharp\n public string GetAllTypesAsString()\n   {\n      return \"T1 = \" +\
  \ typeof(T1).ToString()\n         + \", T2 = \" + typeof(T2).ToString()\n      \
  \   + \", T3 = \" + typeof(T3).ToString();\n   }\n```\n\n你可以做的更多，特别是集合方面，因为处理对象组是一个简单的过程，不需要对对象类型做任何假设——这就是你在本章中看到的泛型集合类存在的一个良好理由。\n\
  \n你需要注意的另一个限制是，只有在将提供给泛型类型的值与 `null` 进行比较时，才允许使用运算符 `==` 或 `!=`。也就是说下面的代码运行正常：\n\
  \n```sharp\n public bool Compare(T1 op1, T1 op2)\n   {\n      if (op1 != null &&\
  \ op2 != null)\n      {\n         return true;\n      }\n      else\n      {\n \
  \        return false;\n      }\n   }\n```\n\n在这里，如果 `T1` 是值类型，那么它始终被假设为非 `null`，因此在前面的代码中\
  \ `Compare` 将返回 `true`。\n\n```sharp\n public bool Compare(T1 op1, T1 op2)\n   {\n\
  \      if (op1 != null && op2 != null)\n      {\n         return true;\n      }\n\
  \      else\n      {\n         return false;\n      }\n   }\n```\n\n\n\n\n```cs\n\
  class MyGenericClass<T1, T2> : MyBaseClass, IMyInterface\n   where T1 : constraint1\
  \ where T2 : constraint2 { … }\n```\n\n可用的约束见表 12.3。\n\n| 约束 | 定义 | 示例用法 |\n| :---\
  \ | :--- | :--- |\n| `struct` | 类型必须是值类型。 | 在一个需要值类型才能运行的类中——例如，类型为 `T` 的成员变量为 `0`\
  \ 意味着某种含义 |\n| `class` | 类型必须是引用类型。 | 在一个需要引用类型才能运行的类中——例如，类型为 `T` 的成员变量为 `null`\
  \ 意味着某种含义 |\n| `base-class` | 类型必须是 `base-class` 或自 `base-class`。你可以提供任何类名作为此约束。\
  \ | 在一个需要从 `base-class` 继承某些基础功能才能运行的类中 |\n| `interface` | 类型必须是 `interface` 或实现\
  \ `interface`。 | 在一个需要由 `interface` 暴露某些基础功能才能运行的类中 |\n| `new()` | 类型必须具有公共的无参数构造函数。\
  \ | 在一个需要实例化类型为 `T` 的变量类中，可能在构造函数 |\n\n**表 12.3**](#c12.xhtml_c12-tbl-anc-0003)\
  \ 泛型类型约束\n\n可以通过基类约束将一个类型参数作为另一个参数的约束，如下所示：\n\n```cs\nclass MyGenericClass<T1, T2>\
  \ where T2 : T1 { … }\n```\n\n在这里，`T2` 必须与 `T1` 相同的类型，或者继承自 `T1`。这被称为裸类型约束（naked\
  \ type constraint），意味着一个泛型类型参数被用作另一个参数的约束。\n\n不允许此处所示的循环类型约束：\n\n```cs\nclass MyGenericClass<T1,\
  \ T2> where T2 : T1 where T1 : T2 { … }\n```\n\n此代码将无法编译。在接下来的“尝试”（Try It Out）中，你将定义并使用一个泛型类，该类使用了前面章节中所示的\
  \ `Animal` 类族。\n\n### 继承泛型类\n\n前面的示例中的 `Farm<T>` 类以及你在本章中看到的其他几个类都继承自一个泛型类型。在 `Farm<T>`\
  \ 的情况下，该类型是一个接口：`IEnumerable<T>`。在这里，`Farm<T>` 为 `T` 提供的约束导致了在 `IEnumerable<T>`\
  \ 中使用的 `T` 的额外约束。这对于约束原本无边界的类型是一种非常有用的技术。但是，你确实遵循一些规则。\n\n首先，你不能“取消约束”从你正在继承的类型中已经受约束的类型。换句话说，在你继承的类型中使用的类型\
  \ `T`，其约束程度至少要与在该类型中的约束一样多。例如，以下代码是好的：\n\n```cs\nclass SuperFarm<T> : Farm<T>\n\
  \      where T : SuperCow {}\n```\n\n这之所以行得通，是因为 `T` 在 `Farm<T>` 中被约束为 `Animal`，而将其约束为\
  \ `SuperCow` 是将 `T` 约束为这些值的一个子集。然而，以下代码将无法编译：\n\n```cs\nclass SuperFarm<T> : Farm<T>\n\
  \      where T : struct{}\n```\n\n在这里，你可以明确表示提供给 `SuperFarm<T>` 的类型 `T` 不能转换为 `Farm<T>`\
  \ 可用的 `T`，因此代码将无法编译。\n\n即使约束是超集的情况也存在相同的问题：\n\n```cs\nclass SuperFarm<T> : Farm<T>\n\
  \      where T : class{}\n```\n\n尽管 `Animal` 等类型会被 `SuperFarm<T>` 允许，但其他满足类约束的类型在\
  \ `Farm<T>` 中是不被允许的。再次，编译将失败。此规则适用于本章前面显示的所有约束类型。\n\n还要注意，如果你继承自泛型类型，则必须提供所有所需的类型信息，要么通过泛型类型参数的形式（如所示），要么显式提供。这同样适用于自泛型类型的非泛型类，正如你在其他地方看到的那样。这是一个示例：\n\
  \n```cs\npublic class Cards : List<Card>, ICloneable{}\n```\n\n### 是好的，但尝试以下操作将失败：\n\
  \n```cs\npublic class Cards : List<T>, ICloneable{}\n```\n\n在这里，没有为 `T` 提供信息，因此无法进行编译。\n\
  \n### 泛型运算符\n\n运算符重载在 C# 中的实现方式与其他方法一样，并且可以在泛型类中实现。例如，你可以在 `Farm<T>` 中定义以下隐式转换运算符：\n\
  \n```cs\npublic static implicit operator List<Animal>(Farm<T> farm)\n{\n   List<Animal>\
  \ result = new List<Animal>();\n   foreach (T animal in farm)\n   {\n      result.Add(animal);\n\
  \   }\n   return result;\n}\n```\n\n这允许在需要时将 `Farm<T>` 中的 `Animal` 对象直接作为 `List<Animal>`\
  \ 。如果你想将两个 `Farm<T>` 实例相加，这将非常有用，例如使用以下运算符：\n\n```cs\npublic static Farm<T> operator\
  \ +(Farm<T> farm1, List<T> farm2)\n```\n\n### 泛型结构体\n\n你在前面的章节中学习到，结构体（structs）本质上与类相同，除了一些微小的差别以及结构体是值类型而非引用类型。正因为如此，可以像这里所示，以与泛型类相同的方式创建泛型结构体：\n\
  \n```cs\npublic struct MyStruct<T1, T2>\n{\n   public T1 item1;\n   public T2 item2;\n\
  }\n```\n\n### 定义泛型接口\n\n你现在已经见过了泛型接口的使用——特别是 `System.Collections.Generic` 命名空间中的接口，如上一个示例中的\
  \ `IEnumerable<T>`。定义泛型接口涉及与定义泛型类相同的技术：\n\n```cs\ninterface MyFarmingInterface<T>\n\
  \   where T : Animal\n{\n   bool AttemptToBreed(T animal1, T animal2);\n   T OldestInHerd\
  \ { get; }\n}\n```\n\n在这里，泛型参数 `T` 被用作 `AttemptToBreed()` 参数的类型以及 `OldestInHerd`\
  \ 属性的类型。\n\n适用于相同的继承规则。如果你继承自泛型接口，必须遵守规则，例如保持基接口泛型类型参数的约束。\n\n\n\n\n\n```\nint myDefaultInt\
  \ = GetDefault<int>();\n```\n\n类型参数 `T` 在调用方法时提供的。\n\n此 `T` 与用于为类提供泛型类型参数的类型是分开的。事实上，泛型方法可以通过非泛型类来实现：\n\
  \n```csharp\npublic class Defaulter\n{\n   public T GetDefault<T>() => default(T);\n\
  }\n```\n\n但是，如果类是泛型的，则你必须为泛型方法类型使用不同的标识符。以下代码将无法编译：\n\n```csharp\npublic class Defaulter<T>\n\
  {\n   public T GetDefault<T>() => default(T);\n}\n```\n\n必须重命名方法或类使用的类型 `T`。\n\n\
  泛型方法参数使用约束（Constraints）的方式与类相同，在这种情况下，你可以使用任何类类型参数：\n\n```csharp\npublic class Defaulter<T1>\n\
  {\n   public T2 GetDefault<T2>()\n      where T2 : T1\n   {\n      return default(T2);\n\
  \   }\n}\n```\n\n在这里，提供方法的类型 `T2` 必须与提供给类的 `T1` 相同或继承自 `T1`。这是约束泛型方法的常用方法。\n\n在之前显示的\
  \ `Farm<T>` 类中，你可以包含以下方法（在下载的 `Ch12Ex04` 代码中包含但被注释掉了）：\n\n```csharp\npublic Farm<U>\
  \ GetSpecies<U>() where U : T\n{\n   Farm<U> speciesFarm = new Farm<U>();\n   foreach\
  \ (T animal in animals)\n   {\n      if (animal is U)\n      {\n         speciesFarm.Animals.Add(animal\
  \ as U);\n      }\n   }\n   return speciesFarm;\n}\n```\n\n这可以替换 `GetCows()` 以及任何其他相同类型的方法。这里使用的泛型类型参数\
  \ `U` 受到 `T` 的约束，而 `T` 又被 `Farm<T>` 类约束为 `Animal`。这使得你可以在需要时，将 `T` 的实例视为 `Animal`\
  \ 的实例。\n\n在 `Ch12Ex04` 的客户端代码 `Program.cs` 中，使用此新方法需要一次修改：\n\n```csharp\nFarm<Cow>\
  \ dairyFarm = farm.GetSpecies<Cow>();\n```\n\n类似地，你可以这样写：\n\n```csharp\nFarm<Chicken>\
  \ poultryFarm = farm.GetSpecies<Chicken>();\n```\n\n你可以对任何继承自 `Animal` 的类采用相同的方法。\n\
  \n注意，在方法上使用泛型类型参数会改变方法的签名。这意味着你可以有多个仅在泛型类型参数上不同的方法重载，如示例所示：\n\n```csharp\npublic\
  \ void ProcessT<T>(T op1){ … }\npublic void ProcessT<T, U>(T op1){ … }\n```\n\n\
  应该使用哪种方法取决于调用方法时指定的泛型类型参数数量。\n\n### 定义泛型委托\n\n最后一个需要考虑的泛型类型是*泛型委托*（generic delegate）。你在本章稍之前学习如何排序和搜索泛型列表时，已经看到这些委托的作用了。你分别为此使用了\
  \ `Comparison<T>` 和 `Predicate<T>` 委托。\n\n第 6 章 描述了如何使用方法的参数和返回值、`delegate` 关键字以及委托的名称来定义委托：\n\
  \n```csharp\npublic delegate int MyDelegate(int op1, int op2);\n```\n\n要定义泛型委托，只需声明并使用一个或多个泛型类型参数：\n\
  \n```csharp\npublic delegate T1 MyDelegate<T1, T2>(T2 op1, T2 op2) where T1: T2;\n\
  ```\n\n如你所示，这里也可以应用约束。你将在下一章学习更多关于委托的知识，包括如何在一个常用的 C# 编程技术——事件中使用它们。\n\n## 变变性\n\
  \n变性（Variance）是*协变*（covariance）和*逆协变*（contravariance）的统称，这两个概念是在 .NET 4 中引入的。事实上，它们出现比这更早（在\
  \ .NET 2.0 中就可用），但在 .NET 4 之前实现它们非常困难，因为这需要自定义的编译程序。\n\n理解这些术语含义的最简单方法是将它们与多态性进行比较。正如你记得，多态性允许你将派生类型的对象放入基类型的变量中，例如：\n\
  \n```csharp\nCow myCow = new Cow(\"Geronimo\");\nAnimal myAnimal = myCow;\n```\n\
  \n在这里，类型为 `Cow` 的对象被放在类型为 `Animal` 的变量中——这是因为 `Cow` 继承自 `Animal`。\n\n然而，接口的情况并非如此。也就是说，以下代码无法运行：\n\
  \n```csharp\nIMethaneProducer<Cow> cowMethaneProducer = myCow;\nIMethaneProducer<Animal>\
  \ animalMethaneProducer = cowMethaneProducer;\n```\n\n第一行代码没有问题，假设 `Cow` 支持 `IMethaneProducer<Cow>`\
  \ 接口。然而，第二行代码假定两个接口类型之间存在一种并不的关系，因此没有方法将一个转换为另一个。或者有方法吗？使用你在本章中为止看到的技巧，确实没有这种方法，因为泛型类型的所有类型参数都是*不变的*（invariant）。但是，在泛型接口和泛型委托上定义变体类型参数恰恰是为了满足这一点。\n\
  \n### 协变\n\n要将泛型类型参数定义为协变，你在类型定义中使用 `out` 关键字，如下所示：\n\n```csharp\npublic interface\
  \ IMethaneProducer<out T>{ … }\n```\n\n对于接口定义，协变类型参数只能作为方法的返回值或属性的 `get` 访问器。\n\n\
  这种用性的良好示例可以在 .NET 框架中使用的 `IEnumerable<T>` 接口中找到。该接口中的项类型 `T` 被定义为协变的。这意味着你可以将一个支持（例如）`IEnumerable<Cow>`的对象放入\
  \ `IEnumerable<Animal>` 变量中。\n\n这使得代码可行：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n   List<Cow> cows = new List<Cow>();\n   cows.Add(new Cow(\"Geronimo\"\
  ));\n   cows.Add(new SuperCow(\"Tonto\"));\n   ListAnimals(cows);\n   ReadKey();\n\
  }\nstatic void ListAnimals(IEnumerable<Animal> animals)\n{\n   foreach (Animal animal\
  \ in animals)\n   {\n      WriteLine(animal.ToString());\n   }\n}\n```\n\n在这里，`cows`\
  \ 变量类型为 `List<Cow>`，它支持 `IEnumerable<Cow>` 接口。该变量可以通过协变传递给需要 `IEnumerable<Animal>`\
  \ 参数的方法。\n\n### 逆协变\n\n要将泛型类型参数定义为逆协变，你在类型定义中使用 `in` 关键字：\n\n\n\n\n\n```cs\npublic\
  \ interface IGrassMuncher<in T>{ … }\n```\n\n对于接口定义，逆变类型参数（contravariant type parameters）只能作为方法参数，而不能作为返回值。\n\
  \n再次，理解这一点的最佳方法是查看 .NET Framework 中逆变变的示例。一个具有逆变类型参数的接口（也是你已经用过的一个）是 `IComparer<T>`。你可以像这样为动物实现此接口：\n\
  \n```cs\npublic class AnimalNameLengthComparer : IComparer<Animal>\n{\n    public\
  \ int Compare(Animal x, Animal y)\n         => x.Name.Length.CompareTo(y.Name.Length);\n\
  }\n```\n\n这个比较器通过名称长度比较动物，因此你可以用它来排序，例如 `List<Animal>` 的实例。然而，通过逆变，你也可以用它来排序 `List<Cow>`\
  \ 的实例，尽管 `List<Cow>.Sort()` 方法期望的是 `IComparer<Cow>` 实例：\n\n```cs\nList<Cow> cows\
  \ = new List<Cow>();\ncows.Add(new Cow(\"Geronimo\"));\ncows.Add(new SuperCow(\"\
  Tonto\"));\ncows.Add(new Cow(\"Gerald\"));\ncows.Add(new Cow(\"Phil\"));\ncows.Sort(new\
  \ AnimalNameLengthComparer());\n```\n\n在大多数情况下，逆变是自然发生的现象——它被集成到 .NET Framework\
  \ 中，正是为了帮助这类操作。然而，在 .NET 4 及以上版本中，两种变异类型的用处在于，你现在可以根据需要使用本节所示的技术来实现它们。\n\n# 本章你学到了什么\n\
  \n| 主题 | 核心概念 |\n| :--- | :--- |\n| 使用泛型 | 泛型类型需要一个或多个类型参数才能工作。你可以在声明变量时传递所需的类型参数，将泛型类型作为变量的类型。这是通过在角括号中包含逗号分隔的类型名称列表来实现的。\
  \ |\n| 可空类型 | 可空类型是可以取指定值类型的任何值或 `null` 值的类型。你可以使用 `Nullable<T>` 或 `T?` 语法来声明可空类型变量。\
  \ |\n| ?? 运算符 | 空合并运算符返回其第一个操作数的值；如果第一个操作数是 `null`，则返回第二个操作数。 |\n| 泛型集合 | 泛型集合非常有用，因为它们内置了强类型检查。你可以使用\
  \ `List<T>`、`Collection<T>` 和 `Dictionary<K, V>` 等其他集合类型。这些类型还暴露了泛型接口。要排序和搜索泛型集合，你需要使用\
  \ `IComparer<T>` 和 `IComparable<T>` 接口。 |\n| 定义泛型类 | 定义泛型类型就像定义任何其他类型一样，在指定类型名称的地方增加了泛型类型参数。与使用泛型类型一样，你将这些指定为角括号内的逗号分隔列表。你可以在代码中任何使用类型名称的地方使用泛型类型参数，例如在方法的返回值和参数中。\
  \ |\n| 泛型类型参数约束 | 为了在泛型代码中更有效地使用泛型类型参数，你可以约束在使用该类型时可以提供的类型。你可以通过基类、支持的接口、是否必须是值类型或引用类型，以及是否支持无参数构造函数来约束类型参数。如果没有此类约束，你必须使用\
  \ `default` 关键字来实例化泛型类型的变量。 |\n| 其他泛型类型 | 除了类之外，你还可以定义泛型接口、委托和方法。 |\n| 变异 | 变异（Variance）是一个类似于多态的概念，但应用于类型参数。它允许你用一个泛型类型替代另一个，这些泛型类型仅在使用的泛型类型参数上不同。协变（Covariance）允许在类型之间转换，其中目标类型的类型参数是源类型参数的基类。逆变（Contravariance）允许在该关系反转的情况下转换。协变类型参数通过\
  \ `out` 参数定义，只能作为返回值和属性 `get` 访问器的类型。逆变类型参数通过 `in` 参数定义，只能作为方法参数。 |\n\n# 第 13 章：额外的\
