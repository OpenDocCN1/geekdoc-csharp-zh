  \" is\"`）。其他变量类型也有关联的字面量值，如表 3.4 所示。其中许多涉及*后缀*，即通过在字面量值末尾添加一个字符序列来指定所需的类型。某些字面量具有多种类型，由编译器在编译时根据其上下文确定（同样在表\
  \ 3.4 所示）。\n\n（注：用户文本在末尾有大量重复。我根据“保留核心内容”和“优化格式”的指令进行了清理。）\n\n\n\n运算符大致可以分为三类：\n\
  \n*   **一元运算符 (Unary)** —— 作用单个操作数\n*   **二元运算符 (Binary)** —— 作用两个操作数\n*   **三元运算符\
  \ (Ternary)** —— 于三个操作数\n\n大多数运算符属于二元类，只有几个一元运算符，和一个称为`条件运算符`的三元运算符（该运算符是一个逻辑运算符，将在第\
  \ 4 章“流程控制”中讨论）。让我们先看数学运算符，它们跨越了一元和二元类。\n\n## 数学运算符\n\n有五种简单的数学运算符，其中两个（`+` 和 `-`）同时具有二元和一元形式。表\
  \ 3.6 列出了这些运算符的每一个，以及它们的简短示例以及与简单数值类型（整数和浮点数）使用时的结果。\n\n| **运算符** | **类别** | **示例表达式**\
  \ | **结果** |\n| :--- | :--- | :--- | :--- |\n| `+` | 二元 | `var1 = var2 + var3;`\
  \ | `var1` 被赋值为 `var2` 和 `var3` 的和。 |\n| `-` | 二元 | `var1 = var2 - var3;` | `var1`\
  \ 被赋值为 `var2` 的值减去 `var3` 的值。 |\n| `*` | 二元 | `var1 = var2 * var3;` | `var1` 被赋值为\
  \ `var2` 和 `var3` 的乘积。 |\n| `/` | 二元 | `var1 = var2 / var3;` | `var1` 被赋值为 `var2`\
  \ 除以 `var3` 的结果。 |\n| `%` | 二元 | `var1 = var2 % var3;` | `var1` 被赋值为 `var2` 除以 `var3`\
  \ 的余数。 |\n| `+` | 一元 | `var1 = +var2;` | `var1` 被赋值为 `var2` 的值。 |\n| `-` | 一元 |\
  \ `var1 = -var2;` | `var1` 被赋值为 `var2` 的值乘以 `-1`。 |\n\n**表 3.6**](#c03.xhtml_c03-tbl-anc-0006)\
  \ 简单数学运算符\n\n示例使用了简单的数值类型，因为当使用其他简单类型时，结果可能不明。例如，如果你将两个布尔值相加会预期什么？在这种情况下，什么都没有，因为如果你尝试在\
  \ `bool` 变量上使用 `+`（或任何其他数学运算符），编译器会报错。相加 `char` 变量也稍微有些困惑。记住 `char` 变量实际上是以数字存储的，所以相加两个\
  \ `char` 变量也会得到一个数字（准确来说，是 `int` 类型）。这是隐式转换的一个例子，你很快就会学到更多关于它的知识（以及显式转换），因为它也适用于\
  \ `var1`、`var2` 和 `var3` 为混合类型的情况。\n\n二元 `+` 运算符在与字符串类型变量一起使用时*确实是有意义的。在这种情况下，表格条目应如表\
  \ 3.7 所示。\n\n| **运算符** | **类别** | **示例表达式** | **结果** |\n| :--- | :--- | :--- | :---\
  \ |\n| `+` | 二元 | `var1 = var2 + var3;` | `var1` 被赋值为存储在 `var2` 和 `var3` 中的两个字符串的拼接结果。\
  \ |\n\n**表 3.7**](#c03.xhtml_c03-tbl-anc-0007) 字符串拼接运算符\n\n其他数学运算符都不适用于字符串。\n\n\
  这里你应该关注的另外两个运算符是自增和自减运算符，它们都是一元运算符，有两种用法：在操作数的紧之前或之后。在简单表达式中获得的结果见表 3.8。\n\n| **运算符**\
  \ | **类别** | **示例表达式** | **结果** |\n| :--- | :--- | :--- | :--- |\n| `++` | 一元 |\
  \ `var1 = ++var2;` | `var1` 被赋值为 `var2` 加 `1` 的值。 |\n| `--` | 一元 | `var1 = --var2;`\
  \ | `var1` 被赋值为 `var2` 减 `1` 的值。 |\n| `++` | 一元 | `var1 = var2++;` | `var1` 被赋值为\
  \ `var2` 的值。 |\n| `--` | 一元 | `var1 = var2--;` | `var1` 被赋值为 `var2` 的值。 |\n\n**表\
  \ 3.8**](#c03.xhtml_c03-tbl-anc-0008) 自增和自减运算符\n\n这些运算符会导致操作数存储的值：\n\n*   `++` 总是导致其操作数加\
  \ 1。\n*   `--` 总是导致其操作数减 1。\n\n### 赋值运算符\n\n到目前为止，你一直在使用简单的 `=` 运算符。然而，还有更多，它们的工作方式类似。表\
  \ 3.9 描述了这些运算符。\n\n| **运算符** | **类别** | **示例表达式** | **结果** |\n| :--- | :--- | :---\
  \ | :--- |\n| `=` | 二元 | `var1 = var2;` | `var1` 被赋值为 `var2` 的值。 |\n| `+=` | 二元\
  \ | `var1 += var2;` | `var1` 被赋值为 `var1` 和 `var2` 的和。 |\n| `-=` | 二元 | `var1 -=\
  \ var2;` | `var1` 被赋值为 `var1` 的值减去 `var2` 的值。 |\n| `*=` | 二元 | `var1 *= var2;` |\
  \ `var1` 被赋值为 `var1` 和 `var2` 的乘积。 |\n| `/=` | 二元 | `var1 /= var2;` | `var1` 被赋值为\
  \ `var1` 除以 `var2` 的结果。 |\n| `%=` | 二元 | `var1 %= var2;` | `var1` 被赋值为 `var1` 除以\
  \ `var2` 的余数。 |\n\n**表 3.9**](#c03.xhtml_c03-tbl-anc-0009) 赋值运算符\n\n如你所示，额外的运算符会导致\
  \ `var1` 被包含在计算中，因此如下代码：\n\n```cpp\nvar1 += var2;\n```\n\n的结果与\n\n```cpp\nvar1 =\
  \ var1 + var2;\n```\n\n完全相同。\n\n使用这些运算符（特别是在使用长变量名时）可以使代码更易读。\n\n### 运算符优先级\n\n\
  当求值表达式时，每个运算符都按顺序处理，但这并不意味着从左到右评估这些运算符。作为一个显而易见的例子，考虑以下内容：\n\n```cpp\nvar1 = var2\
  \ + var3;\n```\n\n在这里，`+` 运算符在 `=` 运算符之前作用。在其他情况下，运算符优先级并不显而易见，如下：\n\n```cpp\nvar1\
  \ = var2 + var3 * var4;\n```\n\n在前面的示例中，`*` 运算符先作用，然后是 `+` 运算符，最后是 `=` 运算符。这是标准的数学顺序，它提供的结果与你在纸上进行等代数计算的预期结果相同。\n\
  \n同样，你可以通过括号来控制运算符优先级，如示例所示：\n\n\n\n\n\n```\nvar1 = (var2 + var3) * var4;\n```\n\
  \n在这里，括号中的内容会被评估，这意味着 `+` 运算符的执行在 `*` 运算符之前。\n\n表 3.10 显示了你目前为止遇到的运算符的优先级顺序。优先级相等的运算符（例如\
  \ `*` 和 `/`）从左到右评估。\n\n| `Precedence` | `Operators` |\n| :--- | :--- |\n| 最高 | `++`,\
  \ `--` (作为前缀使用); `+`, `-` (一元) |\n| | `*`, `/`, `%` |\n| | `+`, `-` |\n| | `=`,\
  \ `*=`, `/=`, `%=`, `+=`, `-=` |\n| 最低 | `++`, `--` (作为后缀使用) |\n\n表 3.10 **运算符优先级**\n\
  \n### 命名空间\n\n在继续之前，值得考虑另一个重要的主题——*命名空间*（namespaces）。这些是 .NET 为应用程序代码提供的容器方法，使得代码及其内容可以被唯一标识。命名空间也被用作\
  \ .NET Framework 中项目的分类手段。这些项目大部分是类型定义，例如在本章中的简单类型（`System.Int32` 等）。\n\nC# 代码默认包含在*全局命名空间*（global\
  \ namespace）中。这意味着此代码中的项可以通过名称直接从全局命名空间中的其他代码访问。然而，你可以使用 `namespace` 关键字显式地定义大括号包含的代码块的命名空间。如果在该命名空间外部的代码中使用此类命名空间中的名称，则必须进行*限定*（qualified）。\n\
  \n限定名包含其所有的层级信息，基本上意味着如果你在一个命名空间中的代码需要使用在另一个命名空间中定义的名称，你必须包含对该命名空间的引用。限定名在命名空间级之间使用点字符（`.`），所示：\n\
  \n```\nnamespace LevelOne\n{\n   // LevelOne 命名空间中的代码\n   // 定义名称 \"NameOne\"\n\
  }\n// 全局命名空间中的代码\n```\n\n这段代码定义了一个命名空间 `LevelOne` 以及该命名空间中的一个名称 `NameOne`（为了保持讨论的通用性，此处没有显示实际代码；相反，在定义处有一个注释）。在\
  \ `LevelOne` 命名空间内部编写的代码可以直接使用 `NameOne` 引用此名称——不需要分类。然而，全局命名空间中的代码必须使用限定名 `LevelOne.NameOne`\
  \ 来引用此名称。\n\n这里还有一点重要的需要注意：`using` 语句本身并不能提供访问另一个命名空间中名称的权限。除非命名空间中的代码以某种方式与你的项目链接（通过定义在项目中的源文件中，或定义在与项目链接的其他代码中），否则你无法访问其中包含的名称。此外，如果包含命名空间的代码已链接到你的项目，那么无论你是否使用\
  \ `using`，你都可以访问该代码包含的名称。`using` 只是让你更容易访问这些名称，并可以缩短冗长的代码以提高其可读性。\n\n回到本章开头所示的 `ConsoleApplication1`\
  \ 代码，出现了以下适用于命名空间的行：\n\n```\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nnamespace\
  \ ConsoleApplication1\n{\n   …\n}\n```\n\n以 `using` 关键字开头的五行用于声明 `System`、`System.Collections.Generic`、`System.Linq`、`System.Text`\
  \ 和 `System.Threading.Tasks` 命名空间将在此 C# 代码中使用，并且可以在文件的所有命名空间中访问。`System` 命名空间是 .NET\
  \ Framework 应用程序的根命名空间，包含了控制台应用程序所需的所有功能。其他四个命名空间在控制台中非常常用，所以它们在那里以备不一。此外，请注意为应用程序代码本身\
  \ `ConsoleApplication1` 也声明了一个命名空间。\n\nC# 6 新引入了 `using static` 关键字。该关键字允许将静态成员直接引入\
  \ C# 程序的作用域中。例如，本章中的两个“尝试”（Try It Out）代码演示都使用了 `System.Console.WriteLine()` 方法，它是\
  \ `System.Console` 静态类的一部分。注意，在这些示例中，必须包含 `Console` 类结合 `WriteLine()` 方法。当将 `using\
  \ static System.Console` 命名空间添加到包含的命名空间列表时，访问 `WriteLine()` 方法就不再需要之前的静态类名。\n\n\
  从现在起，所有需要 `System.Console` 静态类的代码示例都包含了 `using static System.Console` 关键字。\n\n##\
