  \n\n\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\nnamespace Ch10CardLib\n{\n  \
  \ public class Deck\n   {\n      private Card[] cards;\n      public Deck()\n  \
  \    {\n         cards = new Card[52];\n         for (int suitVal = 0; suitVal <\
  \ 4; suitVal++)\n         {\n            for (int rankVal = 1; rankVal < 14; rankVal++)\n\
  \            {\n               cards[suitVal * 13 + rankVal -1] = new Card((Suit)suitVal,\n\
  \                                                           (Rank)rankVal);\n  \
  \          }\n         }\n      }\n```\n\n实现 `GetCard()` 方法，该方法返回请求索引的 `Card` 对象，或者像之前所示抛出异常：\n\
  \n```csharp\n public Card GetCard(int cardNum)\n      {\n         if (cardNum >=\
  \ 0 && cardNum <= 51)\n            return cards[cardNum];\n         else\n     \
  \       throw (new System.ArgumentOutOfRangeException(\"cardNum\", cardNum,\n  \
  \                    \"Value must be between 0 and 51.\"));\n      }\n```\n\n最后，你实现\
  \ `Shuffle()` 方法。该方法的工作原理创建一个临时卡牌数组，并将牌从现有的 `cards` 数组随机复制到该数组。此函数的主体是一个从 0 数到 51\
  \ 的循环。在每次循环中，你使用 .NET Framework 中的 `System.Random` 类实例生成一个 `0` 到 `51` 之间的随机数。一旦实例化，该类的对象使用\
  \ `Next(X)` 方法生成 `0` 到 `X` 之间的随机数。当你得到一个随机数时，只需将其作为临时数组中 `Card` 对象的索引，从而 `cards`\
  \ 数组中复制一张牌。\n\n为了记录已分配的牌，你还有一个 `bool` 变量数组，并在复制每张牌时将这些赋值为 `true`。在生成随机数时，你会检查此数组，查看你是否已经将牌复制到随机数所指定的临时数组位置。如果是，则只需生成另一个。\n\
  \n这并不是做事最高效的方法，因为在找到可以复制牌的空隙之前，会生成很多随机数。然而，它是可行的，它非常简单，而且 C# 代码执行速度非常快，你几乎察觉不到延迟。代码如下：\n\
  \n```csharp\n public void Shuffle()\n      {\n         Card[] newDeck = new Card[52];\n\
  \         bool[] assigned = new bool[52];\n         Random sourceGen = new Random();\n\
  \         for (int i = 0; i < 52; i++)\n         {\n            int destCard = 0;\n\
  \            bool foundCard = false;\n            while (foundCard == false)\n \
  \           {\n               destCard = sourceGen.Next(52);\n               if\
  \ (assigned[destCard] == false)\n                  foundCard = true;\n         \
  \   }\n            assigned[destCard] = true;\n            newDeck[destCard] = cards[i];\n\
  \         }\n         newDeck.CopyTo(cards, 0);\n      }\n   }\n}\n```\n\n该方法的最后一行使用\
  \ `System.Array` 类的 `CopyTo()` 方法（每当你创建数组时都会使用）将 `newDeck` 中的每张牌复制回 `cards`。这意味着你正在相同的\
  \ `cards` 对象中使用同一组 `Card` 对象，而不是创建任何新实例。如果你改用 `cards = newDeck`，那么你将用另一个对象替换 `cards`\
  \ 所引的对象实例。如果代码在其他地方保留了对原始 `cards` 实例的引用，这可能会导致问题 —— 因为它并没有被洗牌！\n\n类库代码到此结束。\n\n\
