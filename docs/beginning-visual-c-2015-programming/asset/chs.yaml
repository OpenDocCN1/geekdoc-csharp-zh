  \ 属性\n- 表 22.5 ServiceContractAttribute 属性\n- 表 22.6 OperationContractAttribute\
  \ 属性\n\n# 引言\n\nC# 是一种相对较新的语言，微软在 2000 年 7 月发布第一版本的 `.NET Framework` 时向世界推出了它。从那时起，它的人气直线飙升，并成为使用\
  \ `.NET Framework` 的桌面、Web 和云开发者的首选语言。C# 的魅力之处在于它清晰的语法，这种语法源自 C/C++，但简化了一些以前让某些程序员望而却步的问题。尽管进行了这些简化，C#\
  \ 仍然保留了 C++ 的强大，现在没有理由不转向 C#。这门语言并不困难，而且是学习基础编程技术的绝佳工具。这种易用性结合 `.NET Framework`\
  \ 的功能，使得 C# 成为开启编程生涯的极佳选择。\n\nC# 的最新版本 `C# 6` 包含在 `.NET Framework` 4.6 版本中，它在现有成功的基础上增加了更多特性。\n\
  \n## 本书目标读者\n\n本书适合所有想要学习如何使用 `.NET Framework` 编写 C# 程序的人。它适合想要尝试编程的绝对初学者，但同时也适合熟悉其他语言并想要探索的人士。\n\
  \n## 本书涵盖内容\n\n前面的章节涵盖了语言本身，假设读者没有编程经验。如果你用其他语言编写过程序，这些章节中的大部分内容对你来说是熟悉的。\n\n如果你是编程初学者，应该从开始看，在那里你将学习基础编程概念，并熟悉\
  \ C# 以及支撑它的 `.NET 平台`。如果你熟悉编程但不熟悉 `.NET Framework`，应该阅读第 1 章，然后快速浏览接几章，再继续学习 C#\
  \ 语言的应用。如果你会编程但从未接触过面向对象的编程语言，你应该从第 8 章开始读起。\n\n或者，如果你已经熟悉 C# 语言，你可能想关注处理最新 .NET\
  \ Framework 和 C# 语言开发的章节，特别是关于集合、泛型和 C# 语言增强的章节（第 11 至 13 章），或者完全跳过书的第一部分直接从第 14\
  \ 章开始。\n\n本书的章节编写了双重目的：它们可以顺序阅读以提供完整的 C# 语言教程，也可以在需要时作为参考资料。\n\n除了核心内容外，从第 3 章开始，每章末尾都包含了一些练习，你可以通过完成这些练习来确保自己理解了内容。练习的范围从简单的多选题或判断题，到需要你修改或构建应用程序的复杂练习。所有练习的答案都提供在附录\
  \ A 中。你也可以在 `www.wrox.com/go/beginningvisualc#2015programming` 为本书的 `wrox.com` 代码下载中找到这些练习。\n\
  \n\n\n\n本书也配合 `C#` 6 和 `.NET` 4.6 的发布投入了大量的关注和精力。每一章都经过了重写，删除了不相关的材料并添加了新内容。所有代码均已针对使用的最新版本开发工具进行了测试，所有截图均在\
  \ Windows 8.1/10 中重新拍摄，以提供最新的窗口界面和对话框。\n\n本版的新亮点包括：\n\n*   提供了更多额外的且改进后的代码示例供你尝试\n\
  *   涵盖了 `C#` 6 和 `.NET` 4.6 中的所有新特性，包括如何创建通用 Windows 应用（Universal Windows Apps）\n\
  *   云应用程序编程以及使用 `Azure SDK` 创建和访问云资源的示例\n\n## 本书的结构\n\n本书分为六部分：\n\n*   **引言** —\
  \ 本书内容的目的和总体大纲概述\n*   **C# 语言** — 涵盖 `C#` 语言的所有方面，从基础知识到面向对象的技术\n*   **Windows 编程**\
  \ — 如何使用 Windows Presentation Foundation 库 (`WPF`) 编写和部署桌面应用程序\n*   **云编程** — 云应用程序的开发和部署，包括\
  \ Web API 的创建和消费\n*   **数据访问** — 如何在应用程序中使用数据，包括存储在硬盘文件中的数据、`XML` 格式的数据以及数据库中的数据\n\
  *   **其他技术** — 探讨使用 `C#` 和 `.NET Framework` 的一些额外方法，包括 Windows Communication Foundation\
  \ (`WCF`) 和通用 Windows 应用\n\n接下来的章节描述了书中五个主要部分的章节。\n\n### C# 语言 (第 1 章–第 13 章)\n\n\
  第 1 章 向你介绍了 `C#` 以及它如何融入 `.NET` 领域。你将学习在该环境下的编程基础知识，以及 `Visual Studio 2015` (`VS`)\
  \ 是如何其中的。\n\n第 2 章 带你从编写 `C#` 开始。你将学习 `C#` 的语法，并通过示例命令行和 Windows 应用程序来实践语言。这些示例演示了启动和运行是多么的快速简单，在此过程中，你将熟悉\
  \ `Visual Studio` 开发环境以及贯穿书中使用的基本窗口和工具。\n\n接下来你将学习更多关于 `C#` 语言的基础知识。你将在第 3 章 中学习什么是变量以及如何操作它们。在第\
  \ 4 章 中你将通过流程控制（循环和分支）增强应用程序的结构，并在第 5 章 中看到一些高级的变量类型，例如数组。在第 6 章 中你将开始以函数的格式封装代码，这使得执行重复操作变得容易得多，并让你的代码更易读。\n\
  \n到第 7 章 开始，你已经掌握了 `C#` 语言的基础知识，并将专注于调试你的应用程序。这涉及查看应用程序执行时输出的跟踪信息，以及如何利用 `Visual\
  \ Studio` 强大的调试环境来捕获错误并引导你找到解决方案。\n\n从第 8 章 开始，你将学习面向对象编程 (`OOP`)，首先了解这个术语的含义，并对永恒的问题“什么是对象？”给出解答。整个第\
  \ 8 章 都致力于揭开它的神秘面纱并解释它为何如此伟大，在章节结束之前你实际上不会处理大量的 `C#` 代码。\n\n第 9 章 一切发生了变化，你将理论付诸实践，并在\
  \ `C#` 应用程序中使用 `OOP`。这是 `C#` 真正的威力所在。你将从学习如何定义类和接口开始，然后在第 10 章 进入类成员（包括字段、属性和方法）。在该章节结束，你将开始构建一个纸牌游戏应用程序，该程序将在几个章节中开发，并将有助于说明\
  \ `OOP`。\n\n一旦你学会了 `OOP` 在 `C#` 中如何工作，第 11 章 将转向常见的 `OOP` 场景，包括处理对象集合以及比较和转换对象。第\
  \ 12 章 查看了 `C#` 在 `.NET` 2.0 中引入的一个非常有用的特性：泛型，它允许你创建非常灵活的类。接下来，第 13 章 通过一些额外技术继续讨论\
  \ `C#` 语言和 `OOP`，特别是事件，这在例如 Windows 编程等场景中变得非常重要。第 13 章 通过重点关注该语言 3.0、4、5 和 6 版本引入的语言特性，总结了基础知识。\n\
  \n### Windows 编程 (第 14 章–第 15 章)\n\n第 14 章 开始向你介绍什么是 Windows 编程，并介绍如何在 `Visual Studio`\
  \ 中实现它。它侧重于将 `WPF` 作为一种工具，让你能够以最简化的工作构建构建桌面应用程序。你将在本章开始学习 `WPF` 的基础，并在第 15 章 中完善知识，后者展示了\
  \ `.NET Framework` 提供的丰富控件。\n\n### 云编程 (第 16 章–第 17 章)\n\n第 16 章 从描述什么是云编程开始，并讨论云栈。云环境与传统的编程方式并不相同，因此讨论并定义了一些云编程模式。为了完成本章，你需要一个\
  \ Azure 账户（免费的），以便创建一个 App Services Web App，然后使用 `Azure SDK` 和 `C#` 从 ASP.NET 4.6\
  \ 应用程序访问存储账户。\n\n在第 17 章 中，你学习如何创建并部署 ASP.NET Web API 到云端，然后从类似的 4.6 应用程序消费该 Web\
  \ API。该章节结束于云中最价值的两个特性：扩展性和硬件资源的优化利用。\n\n### 数据访问 (第 18 章–第 21 章)\n\n第 18 章 研究应用程序如何在磁盘上保存和检索数据，你还将学习如何压缩数据以及如何监控并响应文件系统的变化。\n\
  \n在第 19 章 中，你将学习数据交换的事实标准——即 `XML` ——以及一种快速兴起的格式 JSON。到本书此处，你已经在之前的章节中多次接触过 `XML`，但本章概述了基本规则并让你了解它为何如此关注。\n\
  \n本部分的其余介绍了 `LINQ`，它是基于版本 `.NET Framework` 构建的查询语言。你在第 20 章 开始学习 `LINQ` 的通用介绍，然后在第\
  \ 21 章 中使用 `LINQ` 访问数据库和其他数据。\n\n### 其他技术 (第 22 章–第 23 章)\n\n第 22 章 是 Windows Communication\
  \ Foundation (`WCF`) 的介绍，它为你提供了跨本地网络和互联网进行企业级编程访问信息和功能所需的工具。你将看到如何使用 `WCF` 以平台无关的方式向\
  \ Web 和桌面应用程序暴露复杂的数据和功能。\n\n\n\n\n第 23 章向你展示如何创建通用 Windows 应用（Universal Windows\
  \ Apps），这是 Windows 的新特性。本章基于第 14 章和第 15 章的基础，介绍如何创建可以在所有 Windows 平台上运行的 Windows\
  \ 应用。\n\n## 使用本书所需的条件\n\n书中关于 `C#` 和 `.NET Framework` 的代码和描述适用于 `C# 6` 和 `.NET 4.6`。理解书的这部分内容不需要\
  \ Framework 以外的任何东西，但许多示例需要开发工具。本书使用 `Visual Studio 2015` 作为主要开发工具；但是，如果你没有这个工具，也可以可以使用免费的\
