    \ score.\");\n}\n```\n\n在这里，程序检查多个条件，并根据 `score` 提供相应的消息。\n\n## 循环：重复操作\n\n想象你被指派打印五次“Hello,\
    \ World!”。与其编写五行相同的代码，不如使用循环来自动执行重复任务。\n\n### `for` 循环\n\n`for` 循环是按指定次数重复代码块的常用方法。\n\
    \n```csharp\nfor (int i = 0; i < 5; i++)\n{\n    Console.WriteLine(\"Hello, World!\"\
    );\n}\n```\n\n在这个例子中，循环将执行五次 `Console.WriteLine` 语句，每次增加 `i` 的值。\n\n### `while`\
    \ 循环\n\n`while` 循环只要指定的条件保持为 `true`，就会继续执行代码块。\n\n```csharp\nint countdown = 10;\n\
    while (countdown > 0)\n{\n    Console.WriteLine(\"Countdown: \" + countdown);\n\
    \    countdown--;\n}\n```\n\n这段代码将显示倒计时 10。\n\n### `do while` 循环\n\n与 `while`\
    \ 循环类似，`do while` 循环只要条件保持为 `true` 就会执行代码块。关键区别在于条件是在执行后检查的。\n\n```csharp\nint\
    \ count = 0;\ndo\n{\n    Console.WriteLine(\"Count: \" + count);\n    count++;\n\
    } while (count < 5);\n```\n\n此循环将显示 0 到 4\n\n## 结合控制结构\n\n你可以结合条件语句和循环来创建更复杂、多功能的程序。\n\
    \n```csharp\nfor (int i = 1; i <= 100; i++)\n{\n    if (i % 3 == 0 && i % 5 ==\
    \ 0)\n    {\n        Console.WriteLine(\"FizzBuzz\");\n    }\n    else if (i %\
    \ 3 == 0)\n    {\n        Console.WriteLine(\"Fizz\");\n    }\n    else if (i\
    \ % 5 == 0)\n    {\n        Console.WriteLine(\"Buzz\");\n    }\n    else\n  \
    \  {\n        Console.WriteLine(i);\n    }\n}\n```\n\n在这个例子中，我们使用循环遍历 1 到 100。根据数字是否被\
    \ 3、5 或两者都能整除，我们显示“Fizz”、“Buzz”、“FizzBuzz”或数字本身。\n\n## 结论\n\n在本章中，我们深入了 C# 控制流与决策的世界。我们探索了\
    \ `if`、`else` 和 `else if` 等条件语句，它们允许程序根据条件做出决策。我们还揭示了 `for`、`while` 和 `do while`\
    \ 等循环结构的力量，使我们能够自动重复任务并迭代数据。\n\n通过结合这些控制结构，你可以创建复杂的程序。当你继续 C# 编程之旅时，请记住，掌握控制流对于构建高效、灵活且健壮的应用程序至关重要。所以，拥抱决策和循环的力量，让你的代码活跃起来！\n\
    \n# 第 4 章：循环与迭代\n\n欢迎来到循环与迭代的世界，在这里我们将能够在 C# 程序中重复操作并高效处理数据的能力。循环是本质工具，允许我们节省时间、减少冗余并优雅地处理重复任务。在本章中，我们将探索不同类型的循环，学习如何控制它们的行为，并发现迭代在现代编程中起着至关重要的作用。\n\
    \n## 循环的力量\n\n"
