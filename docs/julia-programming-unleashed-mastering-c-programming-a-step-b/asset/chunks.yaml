    ```


    In this code snippet, we''ve declared a variable named `x` and assigned it the
    value `42`. Julia''s flexible type system allows it to automatically infer the
    data type of the variable based on the assigned value.


    You can also explicitly specify the data type when declaring a variable:


    ```julia


    y::Float64 = 3.14


    ```


    In this case, we''ve declared a variable `y` and explicitly specified that it
    should be of type `Float64`, a 64-bit floating-point number.


    ### Dynamic Typing


    Julia is known for its dynamic typing, which means that you don''t always need
    to specify the data type explicitly. Instead, Julia can often infer the data type
    for you. This feature, combined with type annotations when needed, makes Julia
    code concise and readable.


    For example, consider this code:


    ```julia


    a = 42


    b = 3.14


    c = "Hello, Julia!"


