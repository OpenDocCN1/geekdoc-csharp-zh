    \ 调用函数\n\n一旦定义了函数，你就可以通过使用它的名称并提供必要的参数来调用它。以下是调用 `square` 函数的方式：\n\n```julia\n\
    result = square(5)  # 使用参数 5 调用 square 函数\nprintln(result)     # 打印 25\n```\n\n\
    `square` 函数被带参数 `5` 调用，返回结果 `25`，然后将其打印出来。\n\n## 函数方法与多重分发\n\nJulia 以其多重分发（multiple\
    \ dispatch）系统而闻名，它允许函数根据参数的类型有不同的实现。这种被称为方法分发（method dispatch）的特性让你能够编写通用且高效的代码。\n\
    \n### 方法分发\n\n在 Julia 中，函数可以有多个方法，每个方法对应一组不同的参数类型。当你调用一个函数时，Julia 会根据参数类型分发到最特定的方法，以确保执行正确的实现。\n\
    \n这里有一个方法分发的示例：\n\n```julia\n# 为整数定义一个 add 函数\nfunction add(a::Int, b::Int)\n\
    \    return a + b\nend\n\n# 为浮点数定义一个 add 函数\nfunction add(a::Float64, b::Float64)\n\
    \    return a + b\nend\n\n# 使用不同类型的参数调用函数\nresult1 = add(2, 3)         # 调用整数的\
    \ add 函数\nresult2 = add(2.0, 3.0)    # 调用浮点数的 add 函数\nprintln(result1)  # 打印 5\n\
    println(result2)  # 打印 5.0\n```\n\n在这个示例中，我们有两个版本的 `add` 函数——一个用于整数，另一个用于浮点数。Julia\
    \ 会根据参数类型自动分发到相应的方法。\n\n### 通用函数\n\nJulia 的多重分发系统允许你创建适用于各种数据类型的通用函数。你可以定义一个单一的函数，它会根据参数的类型以不同的方式运行。\n\
    \n这里有一个通用 `add` 函数的示例：\n\n```julia\n# 定义一个适用于多种类型的通用 add 函数\nfunction add(a, b)\n\
    \    return a + b\nend\n\n# 使用不同类型的参数调用函数\nresult1 = add(2, 3)         # 调用整数的通用\
    \ add 函数\nresult2 = add(2.0, 3.0)    # 调用浮点数的通用 add 函数\nprintln(result1)  # 打印\
    \ 5\nprintln(result2)  # 打印 5.0\n```\n\n在这段代码中，`add` 函数没有限于特定的参数类型。它可以处理整数、浮点数甚至其它类型，具有高度的通用性。\n\
    \n## 可选参数与关键字参数\n\nJulia 允许你定义带有可选参数和关键字参数的函数，增强了函数的灵活性。\n\n### 可选参数\n\n可选参数是在调用函数时不需要提供值的参数。你可以为这些参数指定默认值，如果未提供，将使用默认值。\n\
    \n这里有一个带有可选参数的示例：\n\n```julia\n# 定义一个带有可选参数的函数\nfunction greet(name, greeting=\"\
    Hello\")\n    return \"$greeting, $name!\"\nend\n\n# 分带和不带可选参数调用函数\nmessage1 =\
    \ greet(\"Alice\")             # 使用默认问候语\nmessage2 = greet(\"Bob\", \"Hi\")  \
    \      # 使用提供的问候语\nprintln(message1)  # 打印 \"Hello, Alice!\"\nprintln(message2)\
    \  # 打印 \"Hi, Bob!\"\n```\n\n在这个示例中，`greet` 函数有一个可选参数 `greeting`，其默认值为 \"Hello\"\
    。你可以提供或不提供 `greeting` 参数来调用函数。\n\n### 关键字参数\n\n关键字参数允许你在调用函数时通过名称指定参数，从而清楚地知道哪个参数对应哪个值。\n\
    \n这里有一个带有关键字参数的示例：\n\n```julia\n# 定义一个带有关键字参数的函数\nfunction compute_total(price;\
    \ tax_rate=0.10, discount=0.0)\n    total = price * (1 + tax_rate) * (1 - discount)\n\
    \    return total\nend\n\n# 使用关键字参数调用函数\ntotal1 = compute_total(100.0, tax_rate=0.08)\
    \           # 将 tax_rate 指定为关键字参数\ntotal2 = compute_total(100.0, discount=0.15)\
    \           # 将 discount 指定为关键字参数\ntotal3 = compute_total(100.0, tax_rate=0.08,\
    \ discount=0.15)  # 同时指定两个参数\nprintln(total1)  # 打印 108.0\nprintln(total2)  #\
    \ 打印 85.0\nprintln(total3)  # 打印 92.4\n```\n\n在这段代码中，`compute_total` 函数使用了关键字参数。\n\
    \n## 匿名函数 (Lambdas)\n\nJulia 允许使用 `->` 语法创建匿名函数，也称为 lambda 函数。这些函数没有名称，通常用于短操作。\n\
    \n这里有一个匿名函数的示例：\n\n```julia\n# 定义一个计算平方的匿名函数\nsquare = x -> x²\n\n# 调用函数\nresult\
    \ = square(5)\n```\n\n在这个示例中，我们创建了一个匿名函数 `square`。\n\n## 广播\n\nJulia 提供了一了一种名为广播（broadcasting）的强大功能，允许你对数组或集合逐元素地应用函数。这简化了数组操作。\n\
    \n这里有一个广播的示例：\n\n```julia\n# 定义一个计算平方的函数\nsquare(x) = x²\n\n# 创建一个数组\nnumbers\
    \ = [1, 2, 3, 4, 5]\n\n# 使用广播对数组求平方\nsquared_numbers = square.(numbers)\n\nprintln(squared_numbers)\
