- fmt: "\nIn this chapter, we've explored the world of collections and generics in\
    \ C#. We've learned how collections allow us to manage groups of data efficiently\
    \ using various data structures, including lists, dictionaries, queues, and stacks.\
    \ We've also delved into the power of generics, which enable us to write reusable\
    \ and type-safe code that can work with different data types.\n\nBy mastering\
    \ collections and generics, you'll be equipped with essential skills to manipulate\
    \ data effectively and create versatile and maintainable code. Whether you're\
    \ building data-driven applications or creating reusable components, these concepts\
    \ will play a vital role in your programming journey. So, embrace the power of\
    \ collections and generics, and let your code flourish with flexibility, reusability,\
    \ and efficiency!\n\n# Chapter 12: Delegates, Events, and Lambdas\n\nWelcome to\
    \ the world of delegates, events, and lambdas in C#! In this chapter, we'll explore\
    \ powerful tools that enable you to create more flexible and responsive programs.\
    \ We'll dive into delegates, which allow you to treat methods as objects, events\
    \ that facilitate communication between components, and lambdas that enable concise\
    \ and expressive code. By mastering these concepts, you'll elevate your programming\
    \ skills and design applications that are more modular, interactive, and elegant.\n\
    \n## Delegates: Function Pointers in C#\n\nDelegates are a fundamental concept\
    \ in C# that allow you to treat methods as first-class objects. They provide a\
    \ way to encapsulate and pass methods as parameters, enabling dynamic and modular\
    \ programming.\n\n### Defining and Using Delegates\n\nA delegate is a type that\
    \ represents a reference to a method with a specific signature. It provides a\
    \ way to invoke methods indirectly through the delegate instance.\n\n```csharp\n\
    using System;\n\ndelegate int Calculator(int a, int b);\n\nclass Program\n{\n\
    static int Add(int x, int y)\n{\n    return x + y;\n}\n\nstatic int Multiply(int\
    \ x, int y)\n{\n    return x * y;\n}\n\nstatic void Main()\n{\n    Calculator\
    \ calc = Add;\n    int result = calc(5, 3);\n    Console.WriteLine(\"Addition\
    \ result: \" + result);\n\n    calc = Multiply;\n    result = calc(5, 3);\n  \
    \  Console.WriteLine(\"Multiplication result: \" + result);\n}\n}\n```\n\nIn this\
    \ example, we define a delegate `Calculator` that represents methods with two\
    \ `int` parameters and an `int` return type. We then assign methods `Add` and\
    \ `Multiply` to the delegate instance and invoke them dynamically.\n\n### Multicast\
    \ Delegates\n\nA multicast delegate is a delegate that can hold references to\
    \ multiple methods. When invoked, all the methods are called in the order they\
    \ were added.\n\n```csharp\nusing System;\n\ndelegate void Logger(string message);\n\
    \nclass Program\n{\nstatic void LogToFile(string message)\n{\n    Console.WriteLine(\"\
    Logging to file: \" + message);\n}\n\nstatic void LogToConsole(string message)\n\
    {\n    Console.WriteLine(\"Logging to console: \" + message);\n}\n\nstatic void\
    \ Main()\n{\n    Logger log = LogToFile;\n    log += LogToConsole;\n    log(\"\
    Hello, delegates!\");\n\n    log -= LogToConsole;\n    log(\"Console logger removed.\"\
    );\n}\n}\n```\n\nHere, we define a multicast delegate `Logger` that can hold references\
    \ to methods `LogToFile` and `LogToConsole`. We add both methods to the delegate\
    \ instance and observe their execution when the delegate is invoked.\n\n## Events:\
    \ Enabling Component Communication\n\nEvents are a mechanism for communication\
    \ between different components in a program. They allow objects to subscribe to\
    \ and receive notifications when certain actions occur.\n\n### Defining and Using\
    \ Events\n\nAn event is a delegate with restrictions on how it can be used. It\
    \ can only be invoked within the class where it is defined and can be subscribed\
    \ to from outside the class.\n\n```csharp\nusing System;\n\nclass Publisher\n\
    {\npublic event Action<string> NewMessage;\n\npublic void PublishMessage(string\
    \ message)\n{\n    NewMessage?.Invoke(message);\n}\n}\n\nclass Subscriber\n{\n\
    public void OnNewMessage(string message)\n{\n    Console.WriteLine(\"Received\
    \ message: \" + message);\n}\n}\n\nclass Program\n{\nstatic void Main()\n{\n \
    \   Publisher publisher = new Publisher();\n    Subscriber subscriber = new Subscriber();\n\
    \    publisher.NewMessage += subscriber.OnNewMessage;\n    publisher.PublishMessage(\"\
    Hello, events!\");\n    publisher.NewMessage -= subscriber.OnNewMessage;\n}\n\
    }\n```\n\nIn this example, we define an event `NewMessage` in the `Publisher`\
    \ class and subscribe to it using the `Subscriber` class. When the `PublishMessage`\
    \ method is called, the event is invoked, and the `OnNewMessage` method in the\
    \ subscriber is executed.\n\n## Lambdas: Concise Anonymous Functions\n\nLambdas\
    \ provide a concise way to define anonymous functions in C#. They are particularly\
    \ useful when you need to provide a short piece of code as an argument to a method\
    \ or delegate.\n\n### Using Lambdas with Delegates\n\nLambdas can be used to define\
    \ inline methods that match the signature of a delegate.\n\n```csharp\nusing System;\n\
    \ndelegate int Operation(int a, int b);\n\nclass Program\n{\nstatic void Main()\n\
    {\n    Operation add = (x, y) => x + y;\n    Operation multiply = (x, y) => x\
    \ * y;\n    Console.WriteLine(\"Addition: \" + add(5, 3));\n    Console.WriteLine(\"\
    Multiplication: \" + multiply(5, 3));\n}\n}\n```\n\nIn this example, we define\
    \ delegates `add` and `multiply` using lambdas. The lambda expressions define\
    \ inline methods that perform addition and multiplication.\n\n### Using Lambdas\
