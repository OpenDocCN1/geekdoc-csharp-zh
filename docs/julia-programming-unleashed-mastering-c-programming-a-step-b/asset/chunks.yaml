    \n# 第 11 章：集合与泛型\n欢迎来到 C# 集合和泛型的世界！在本章中，我们将探索如何使用各种集合类型有效地管理数据组，以及如何使用泛型创建多功能且类型代码。通过掌握这些概念，你将能够轻松地操作和组织程序中的数据，并创建更健壮、灵活的代码。\n\
    \n## 集合：管理数据组\n集合是允许你存储和操作一组相关数据项的数据结构。它们提供了一种高效管理、搜索和操作数据的强大方式。\n\n### 列表：动态数组\n\
    `List` 是一种动态数组，可以根据需要增大或收小。它提供了添加、删除和访问元素的方法。\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\n\nclass Program\n{\n    static void Main()\n  \
    \  {\n        List<int> numbers = new List<int>();\n        numbers.Add(5);\n\
    \        numbers.Add(10);\n        numbers.Add(15);\n        foreach (int number\
    \ in numbers)\n        {\n            Console.WriteLine(number);\n        }\n\
    \    }\n}\n```\n\n在这个示例中，我们创建了一个整数 `List` 并向其添加了三个数字。然后 `foreach` 循环遍历列表并打印每个数字。\n\
    \n### 字典：键值对\n`Dictionary` 是一种存储键值对的集合。它允许你根据关联的键快速检索值。\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\n\nclass Program\n{\n    static void Main()\n\
    \    {\n        Dictionary<string, int> ages = new Dictionary<string, int>();\n\
    \        ages[\"Alice\"] = 25;\n        ages[\"Bob\"] = 30;\n        ages[\"Charlie\"\
    ] = 28;\n        Console.WriteLine(\"Alice's age: \" + ages[\"Alice\"]);\n   \
    \ }\n}\n```\n\n在这里，我们创建了一个将名称映射到年龄的 `Dictionary`。我们使用名字作为键来检索并打印年龄。\n\n### 队列与栈：先进先出和后进出\n\
    `Queue` 和 `Stack` 是专门的集合，分别实现了先进先出 (FIFO) 和后进出 (LIFO) 数据结构。\n\n```csharp\nusing\
    \ System;\nusing System.Collections.Generic;\n\nclass Program\n{\n    static void\
    \ Main()\n    {\n        Queue<string> queue = new Queue<string>();\n        queue.Enqueue(\"\
    First\");\n        queue.Enqueue(\"Second\");\n        while (queue.Count > 0)\n\
    \        {\n            string item = queue.Dequeue();\n            Console.WriteLine(item);\n\
    \        }\n\n        Stack<string> stack = new Stack<string>();\n        stack.Push(\"\
    First\");\n        stack.Push(\"Second\");\n        while (stack.Count > 0)\n\
    \        {\n            string item = stack.Pop();\n            Console.WriteLine(item);\n\
    \        }\n    }\n}\n```\n\n在这个示例中，我们展示了 `Queue` 和 `Stack` 的用法。\n\n## 泛型：类型安全的重用性\n\
    泛型允许你创建处理不同类型的类、方法和接口。\n\n### 泛型类\n泛型类是处理任何类型的类。例如，`List<T>` 可以持有任何类型的元素。\n\n\
    ```csharp\nusing System;\nusing System.Collections.Generic;\n\nclass GenericContainer<T>\n\
    {\n    public T Content { get; set; }\n}\n\nclass Program\n{\n    static void\
    \ Main()\n    {\n        GenericContainer<int> intContainer = new GenericContainer<int>();\n\
    \        intContainer.Content = 42;\n        Console.WriteLine(intContainer.Content);\n\
    \n        GenericContainer<string> stringContainer = new GenericContainer<string>();\n\
    \        stringContainer.Content = \"Hello\";\n        Console.WriteLine(stringContainer.Content);\n\
    \    }\n}\n```\n\n在这个示例中，我们使用了泛型类 `GenericContainer<T>`。\n\n### 泛型方法\n泛型方法允许你创建无需重写代码的方法。\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static void Swap<T>(ref T\
    \ a, ref T b)\n    {\n        T temp = a;\n        a = b;\n        b = temp;\n\
    \    }\n\n    static void Main()\n    {\n        int x = 5, y = 10;\n        Console.WriteLine(\"\
    Before: x = \" + x + \", y = \" + y);\n        Swap(ref x, ref y);\n        Console.WriteLine(\"\
    After: x = \" + x + \", y = \" + y);\n    }\n}\n```\n\n在这里，`Swap` 方法是泛型的，允许交换不同类型的值。\n\
    \n## 泛型约束\n你可以对泛型类型参数应用约束以限制可类型。常见的约束包括 `where T : class`（引用类型）、`where T : struct`（值类型）和\
    \ `where T : new()`（无参数构造函数）。\n\n```csharp\nusing System;\n\nclass Program\n{\n\
    \    static T FindMax<T>(T[] array) where T : IComparable<T>\n    {\n        T\
    \ max = array[0];\n        foreach (T item in array)\n        {\n            if\
    \ (item.CompareTo(max) > 0)\n            {\n                max = item;\n    \
    \        }\n        }\n        return max;\n    }\n\n    static void Main()\n\
    \    {\n        int[] numbers = { 5, 10, 3, 8, 2 };\n        int maxNumber = FindMax(numbers);\n\
    \        Console.WriteLine(\"Maximum number: \" + maxNumber);\n\n        string[]\
    \ words = { \"apple\", \"banana\", \"cherry\" };\n        string maxWord = FindMax(words);\n\
    \        Console.WriteLine(\"Maximum word: \" + maxWord);\n    }\n}\n```\n\n在这个示例中，`FindMax`\
    \ 方法使用了 `where T : IComparable<T>` 约束，确保泛型类型参数 `T` 实现了 `IComparable<T>` 接口以便进行比较。\n\
