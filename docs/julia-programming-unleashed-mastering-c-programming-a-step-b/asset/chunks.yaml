    \ `false` 的条件。\n\n## 总结\n在本章中，我们开启了 C# 循环和迭代的旅程。我们探索了循环在自动化重复性任务和处理各种场景方面的威力。我们深入研究了\
    \ `for`、`while` 和 `do while` 循环，每种循环都提供了控制重复的独特方式。\n\n我们学习了如何通过调整初始化、条件和迭代表达式来自定义循环行为。此外，我们发现了如\
    \ `break` 和 `continue` 这样的循环控制语句，它们提供了改变循环内执行流的方法。\n\n通过掌握循环和迭代，你可以创建高效且动态的程序，以响应变化的数据和需求。当你继续\
    \ C# 编程之旅时，请记住，循环是你解决复杂问题、提高效率以及让代码活起来的伙伴。因此，拥抱迭代的艺术，让你的程序蓬勃发展吧！\n\n# 第 5 章：函数与方法\n\
    欢迎来到函数和方法的世界，这是 C# 中模块化和组织化编程的基石。函数和方法允许我们将复杂任务分解为更小、易于管理的代码段。在本章中，我们将探索函数的各种、其语法以及它们如何增强代码的可用性、可读性和可维护性。\n\
    \n## 函数的本质\n想象你正在烤蛋糕。与其一次性完成混合原料、烘焙蛋糕和抹奶油，不如将过程拆分为几个步骤。每一步都专注于一个特定的任务，使得整个过程变得更加顺畅。同样，函数允许我们将程序拆分为执行特定任务的更小、自包含模块。\n\
    \n## 创建函数\n在 C# 中，函数使用 `function` 关键字定义，后面紧跟名称、括号中的参数列表以及大括号中的代码块。\n\n```csharp\n\
    // 函数定义\nint Add(int a, int b)\n{\n    int sum = a + b;\n    return sum;\n}\n\n\
    // 函数调用\nint result = Add(5, 3);\nConsole.WriteLine(\"Result: \" + result); //\
    \ Output: 8\n```\n\n在例中，我们定义的 `Add` 接收参数 `a` 和 `b`。它计算和。\n\n## 参数与返回值\n### 参数\n\
    参数是在调用函数时传递的值。它们为函数提供了输入，使其根据这些执行操作。\n\n```csharp\nstring Greet(string name)\n\
    {\n    return \"Hello, \" + name + \"!\";\n}\n\nstring message = Greet(\"Alice\"\
    );\nConsole.WriteLine(message); // Output: Hello, Alice!\n```\n\n在这里，`Greet` 函数接收字符串参数\
    \ `name` 并返回问候。\n\n### 返回值\n函数还可以返回值，将输出返回给调用者。\n\n```csharp\nint Square(int number)\n\
    {\n    return number * number;\n}\n\nint result = Square(4);\nConsole.WriteLine(\"\
    Square: \" + result); // Output: 16\n```\n\n`Square` 函数返回数字的平方。\n\n## 方法重载\nC#\
    \ 允许你定义名称相同但参数列表不同的函数。这被称为方法重载。\n\n```csharp\nint Add(int a, int b)\n{\n    return\
    \ a + b;\n}\n\ndouble Add(double a, double b)\n{\n    return a + b;\n}\n\nint\
    \ intResult = Add(3, 5);\ndouble doubleResult = Add(2.5, 3.7);\nConsole.WriteLine(\"\
    Integer Result: \" + intResult); // Output: 8\nConsole.WriteLine(\"Double Result:\
    \ \" + doubleResult); // Output: 6.2\n```\n\n在这里，我们定义了两个 `Add` 函数——一个针对整数，一个针对双精度浮。根据参数的数据类型，调用相应的函数。\n\
    \n## Void 函数\n并不是所有函数返回值。某些函数的设计是为了执行任务而不产生输出。这些被称为 void 函数。\n\n```csharp\nvoid\
    \ DisplayMessage(string message)\n{\n    Console.WriteLine(\"Message: \" + message);\n\
    }\n\nDisplayMessage(\"Welcome to the world of C#!\"); // Output: Message: Welcome\
    \ to the world of C#!\n```\n\n在例中，`DisplayMessage` 函数显示消息但不返回任何值。\n\n## 局部作用域与全局作用域\n\
    在函数内部定义的变量具有局部作用域。它们仅在该函数内部是可用的。\n\n```csharp\nvoid Calculate()\n{\n    int x\
    \ = 10; // 局部变量\n    int y = 5;  // 局部变量\n    int result = x + y;\n    Console.WriteLine(\"\
    Result: \" + result);\n}\n\nCalculate(); // Output: Result: 15\n// Console.WriteLine(x);\
    \ // 错误：'x' 在此处不可访问\n```\n\n在任何函数外部定义的变量（通常在文件顶部）具有全局作用域。它们可以从代码的任何部分访问和修改。\n\n"
