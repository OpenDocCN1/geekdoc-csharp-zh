    select num;


    foreach (int number in evenNumbers)


    {


    Console.WriteLine(number);


    }


    }


    }


    ```


    In this example, we use LINQ to filter even numbers from a list. The query expression
    uses the `from`, `where`, and `select` clauses to perform the operation.


    ### Projection and Transformation


    ```csharp


    using System;


    using System.Linq;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    List<string> fruits = new List<string> { "apple", "banana", "cherry" };


    var uppercaseFruits = from fruit in fruits


