    \n# 第 14 章：异步编程\n\n欢迎来到 C# 异步编程的世界！在本章中，我们将探索如何编写可以并发执行任务的代码，以提高应用程序的性能和响应能力。我们将深入探讨异步编程的概念、异步方法以及如何有效地处理异步操作。通过掌握异步编程，你将能够创建同时处理多个任务的应用程序，从而带来流畅的用户体验和更好的资源利用。\n\
    \n## 理解异步编程\n\n异步编程是一种允许你的应用程序并发执行任务而不阻塞主执行线程的技术。这对于涉及等待的任务（例如 I/O 操作或网络请求）尤为重要，因为如果管理不当，会导致应用程序变得无响应。\n\
    \n### 同步 vs 异步\n\n在同步编程中，任务按顺序一个接一个地执行。如果一个任务花费了大量时间，它可能会阻塞整个程序，导致糟糕的用户体验。\n\n\
    相比之下，异步编程允许任务并发执行。当一个任务在等待缓慢的操作时，其他任务可以继续执行。这使得系统资源的利用和响应得到了提高。\n\n## 异步方法与 `async`\
    \ 关键字\n\n在 C# 中，你可以使用 `async` 和 `await` 关键字创建异步方法。`async` 关键字用于标记方法为异步的，而 `await`\
    \ 关键字用于指示方法应该等待异步操作完成的点。\n\n### 创建异步方法\n\n```csharp\nusing System;\nusing System.Net.Http;\n\
    using System.Threading.Tasks;\n\nclass Program\n{\n    static async Task Main()\n\
    \    {\n        await DownloadContentAsync();\n        Console.WriteLine(\"Website\
    \ downloaded.\");\n    }\n    static async Task DownloadContentAsync()\n    {\n\
    \        using (HttpClient client = new HttpClient())\n        {\n           \
    \ string content = await client.GetStringAsync(\"https://www.example.com\");\n\
    \            Console.WriteLine(content.Substring(0, 100)); // 显示前 100 个字符\n  \
    \      }\n    }\n}\n```\n\n在这个示例中，我们使用 `async` 和 `await` 关键字创建一个名为 `DownloadContentAsync`\
    \ 的异步方法。该方法使用 `HttpClient` 异步下载网站内容。\n\n## 异步编程模式\n\n异步编程引入了一些模式来有效地管理异步操作。\n\n\
    ### 放即忘 (Fire and Forget)\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        Console.WriteLine(\"\
    Starting task...\");\n        FireAndForget();\n        Console.WriteLine(\"Task\
    \ started.\");\n    }\n    static async void FireAndForget()\n    {\n        await\
    \ Task.Delay(1000);\n        Console.WriteLine(\"Fire and forget task completed.\"\
    );\n    }\n}\n```\n\n在这个示例中，`FireAndForget` 方法被标记为 `async void`，这意味着它是一个发即忘的方法。`Main`\
    \ 方法调用它时没有进行等待，允许其独立执行。\n\n### Task.Run\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        Console.WriteLine(\"\
    Starting task...\");\n        await Task.Run(() => DelayAndPrint());\n       \
    \ Console.WriteLine(\"Task completed.\");\n    }\n    static async Task DelayAndPrint()\n\
    \    {\n        await Task.Delay(1000);\n        Console.WriteLine(\"Delayed task\
    \ completed.\");\n    }\n}\n```\n\n在这个示例中，`Task.Run` 方法用于在单独线程上运行方法。这对于可能会阻塞主线程的\
    \ CPU 密集型操作非常。\n\n## 异步代码中的异常处理\n\n在异步代码中处理异常需要注意，因为在异步任务中抛出的异常可能无法被传统的 `try-catch`\
    \ 块捕获。\n\n### 处理异常\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        try\n       \
    \ {\n            await ThrowExceptionAsync();\n        }\n        catch (Exception\
    \ ex)\n        {\n            Console.WriteLine(\"Exception caught: \" + ex.Message);\n\
    \        }\n    }\n    static async Task ThrowExceptionAsync()\n    {\n      \
    \  await Task.Delay(100);\n        throw new Exception(\"An async exception occurred.\"\
    );\n    }\n}\n```\n\n在这个示例中，我们使用 `try-catch` 块来捕获异步方法抛出的异常。注意，来自异步方法的异常在被捕获时会自动包装在\
    \ `AggregateException` 中。\n\n"
