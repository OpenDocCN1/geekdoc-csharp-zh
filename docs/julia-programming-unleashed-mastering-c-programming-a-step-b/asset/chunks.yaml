  trans: "\n\n在本章中，我们探索了 C# 中集合（collections）和泛型（generics）的世界。我们学习了如何使用各种数据结构（包括列表、字典、队列和栈）来高效地管理数据组。我们还深入研究了泛型的威力，它允许我们编写可以与不同数据类型工作的可重用且类型安全的代码。\n\
    \n通过掌握集合和泛型，你将具备有效操纵数据以及创建多功能且易维护代码的必备技能。无论你是在构建数据驱动的应用，还是在创建可重用的组件，这些概念在你的编程之旅中都将发挥至关重要的作用。因此，请拥抱集合和泛型的力量，让你的代码在灵活性、可重用效率上蓬勃发展！\n\
    \n# 第 12 章：委托、事件和 Lambda 表达式\n\n欢迎来到 C# 委托（Delegates）、事件（Events）和 Lambda 表达式（Lambdas）的世界！在本章中，我们将探索能够帮助你创建更灵活、响应更快的程序的强大工具。我们将深入研究委托（它允许你将方法视为对象）、促进组件间通信的事件，以及能够编写简洁且表达力强的代码的\
    \ Lambda 表达式。通过掌握这些概念，你将提升编程技能，并设计出更模块化、交互性且优雅的应用程序。\n\n## 委托：C# 中的函数指针\n\n委托是\
    \ C# 中的一个基本概念，允许你将方法视为一等对象。它们提供了一种封装方法并将方法作为参数传递的方法，实现了动态和模块化编程。\n\n### 定义和使用委托\n\
    \n委托是一种表示具有特定签名方法的引用类型。它提供了一种通过委托实例间接调用方法的方法。\n\n```csharp\nusing System;\n\n\
    delegate int Calculator(int a, int b);\n\nclass Program\n{\nstatic int Add(int\
    \ x, int y)\n{\n    return x + y;\n}\n\nstatic int Multiply(int x, int y)\n{\n\
    \    return x * y;\n}\n\nstatic void Main()\n{\n    Calculator calc = Add;\n \
    \   int result = calc(5, 3);\n    Console.WriteLine(\"Addition result: \" + result);\n\
    \n    calc = Multiply;\n    result = calc(5, 3);\n    Console.WriteLine(\"Multiplication\
    \ result: \" + result);\n}\n}\n```\n\n在这个示例中，我们定义了一个委托 `Calculator`，它表示具有两个 `int`\
    \ 参数和一个 `int` 返回类型的方法。然后，我们将方法 `Add` 和 `Multiply` 赋值给委托实例并动态地调用它们。\n\n### 多路委托\n\
    \n多路委托是一种可以持有多个方法引用的委托。当调用时，所有方法都会按照它们添加的顺序被调用。\n\n```csharp\nusing System;\n\n\
    delegate void Logger(string message);\n\nclass Program\n{\nstatic void LogToFile(string\
    \ message)\n{\n    Console.WriteLine(\"Logging to file: \" + message);\n}\n\n\
    static void LogToConsole(string message)\n{\n    Console.WriteLine(\"Logging to\
    \ console: \" + message);\n}\n\nstatic void Main()\n{\n    Logger log = LogToFile;\n\
    \    log += LogToConsole;\n    log(\"Hello, delegates!\");\n\n    log -= LogToConsole;\n\
    \    log(\"Console logger removed.\");\n}\n}\n```\n\n在这里，我们定义了一个多路委托 `Logger`，它可以持有方法\
    \ `LogToFile` 和 `LogToConsole` 的引用。我们将这两个方法都添加到委托实例中，并在委托被调用时观察它们的执行情况。\n\n##\
    \ 事件：实现组件通信\n\n事件是程序中不同组件之间通信的机制。它们允许对象订阅并在特定操作发生时接收通知。\n\n### 定义和使用事件\n\n事件是一个对使用方式有限制的委托。它只能在定义它的类内部调用，并且可以在类外部进行订阅。\n\
    \n```csharp\nusing System;\n\nclass Publisher\n{\npublic event Action<string>\
    \ NewMessage;\n\npublic void PublishMessage(string message)\n{\n    NewMessage?.Invoke(message);\n\
    }\n}\n\nclass Subscriber\n{\npublic void OnMessage(string message)\n{\n    Console.WriteLine(\"\
    Received: \" + message);\n}\n}\n\nclass Program\n{\nstatic void Main()\n{\n  \
    \  Publisher publisher = new Publisher();\n    Subscriber subscriber = new Subscriber();\n\
    \n    publisher.NewMessage += subscriber.OnMessage;\n    publisher.PublishMessage(\"\
    Hello, events!\");\n\n    publisher.NewMessage -= subscriber.OnMessage;\n}\n}\n\
    ```\n\n## Lambda 表达式：C# 中的匿名函数\n\nLambda 表达式提供了一种简洁定义匿名函数的方法。\n\n### 配合委托使用 Lambda\n\
    \nLambda 表达式可以用于定义委托，使代码非常简洁。\n\n```csharp\nusing System;\n\ndelegate int Operation(int\
    \ a, int b);\n\nclass Program\n{\nstatic void Main()\n{\n    Operation add = (a,\
    \ b) => a + b;\n    Console.WriteLine(\"Addition: \" + add(5, 3));\n\n    Operation\
    \ multiply = (a, b) => a * b;\n    Console.WriteLine(\"Multiplication: \" + multiply(5,\
    \ 3));\n}\n}\n```\n\n### 配合 LINQ 使用 Lambda\n\nLambda 表达式常与 LINQ 使用，用于过滤数据。\n\n\
    ```csharp\nusing System;\nusing System.Linq;\nusing System.Collections.Generic;\n\
    \nclass Program\n{\nstatic void Main()\n{\n    List<int> numbers = new List<int>\
    \ { 1, 2, 3, 4, 5 };\n    var evenNumbers = numbers.Where(x => x % 2 == 0);\n\n\
    \    foreach (int number in evenNumbers)\n    {\n        Console.WriteLine(number);\n\
    \    }\n}\n}\n```\n\n"
- fmt: "\n## LINQ to Objects: Querying Collections\n\nLINQ to Objects allows you to\
    \ query and manipulate data stored in collections, such as arrays, lists, and\
    \ dictionaries.\n\n### Querying with LINQ\n\n```csharp\nusing System;\nusing System.Linq;\n\
    using System.Collections.Generic;\n\nclass Program\n{\n    static void Main()\n\
    \    {\n        List<int> numbers = new List<int> { 1, 2, 3, 4, 5 };\n       \
    \ var evenNumbers = from num in numbers\n        where num % 2 == 0\n        select\
    \ num;\n        foreach (int number in evenNumbers)\n        {\n            Console.WriteLine(number);\n\
    \        }\n    }\n}\n```\n\nIn this example, we use LINQ to filter even numbers\
    \ from a list. The query expression uses the `from`, `where`, and `select` clauses\
    \ to perform the operation.\n\n### Projection and Transformation\n\n```csharp\n\
    using System;\nusing System.Linq;\nusing System.Collections.Generic;\n\nclass\
    \ Program\n{\n    static void Main()\n    {\n        List<string> fruits = new\
    \ List<string> { \"apple\", \"banana\", \"cherry\" };\n        var uppercaseFruits\
    \ = from fruit in fruits\n        select fruit.ToUpper();\n        foreach (string\
    \ fruit in uppercaseFruits)\n        {\n            Console.WriteLine(fruit);\n\
    \        }\n    }\n}\n```\n\nIn this example, we use LINQ to transform the elements\
    \ of a list to uppercase using the `select` clause.\n\n## LINQ to SQL: Querying\
    \ Databases\n\nLINQ to SQL enables you to query and manipulate data stored in\
    \ relational databases using LINQ queries.\n\n### Connecting to Database\n\n```csharp\n\
    using System;\nusing System.Linq;\n\nclass Program\n{\n    static void Main()\n\
    \    {\n        string connectionString = \"Data Source=(localdb)\\\\MSSQLLocalDB;Initial\
    \ Catalog=SampleDB;Integrated Security=True\";\n        DataContext dataContext\
    \ = new DataContext(connectionString);\n        var employees = from emp in dataContext.Employees\n\
    \        where emp.Department == \"IT\"\n        select emp;\n        foreach\
    \ (var employee in employees)\n        {\n            Console.WriteLine(employee.Name);\n\
    \        }\n    }\n}\n```\n\nIn this example, we use LINQ to query a database\
    \ table named `Employees` and retrieve employees from the IT department.\n\n##\
    \ LINQ to XML: Querying XML Data\n\nLINQ to XML allows you to query and manipulate\
    \ XML data using LINQ queries.\n\n### Querying XML\n\n```csharp\nusing System;\n\
    using System.Linq;\nusing System.Xml.Linq;\n\nclass Program\n{\n    static void\
    \ Main()\n    {\n        string xml = @\"<books>\n        <book>\n        <title>Introduction\
    \ to LINQ</title>\n        <author>John Smith</author>\n        </book>\n    \
    \    <book>\n        <title>Mastering C#</title>\n        <author>Jane Doe</author>\n\
    \        </book>\n        </books>\";\n        XDocument doc = XDocument.Parse(xml);\n\
    \        var bookTitles = from book in doc.Descendants(\"book\")\n        select\
    \ book.Element(\"title\").Value;\n        foreach (string title in bookTitles)\n\
    \        {\n            Console.WriteLine(title);\n        }\n    }\n}\n```\n\n\
    In this example, we use LINQ to query XML data and retrieve book titles from an\
    \ XML document.\n\n## Conclusion\n\nIn this chapter, we've explored the power\
    \ of LINQ (Language Integrated Query) in C#. We've seen how LINQ provides a consistent\
    \ and expressive way to query and manipulate data from various sources, including\
    \ collections, databases, and XML. Whether you're working with arrays, databases,\
    \ or XML documents, LINQ offers a unified query language that simplifies complex\
    \ data operations and enhances code readability.\n\nBy mastering LINQ, you'll\
    \ gain the ability to retrieve, transform, and filter data with ease, creating\
    \ more efficient and maintainable code. So, embrace the capabilities of LINQ,\
    \ and let your programming journey be marked by data-driven efficiency, expressive\
    \ queries, and code that's a joy to work with!\n\n# Chapter 14: Asynchronous Programming\n\
    \nWelcome to the world of asynchronous programming in C#! In this chapter, we'll\
    \ explore how to write code that can perform tasks concurrently, improving performance\
    \ and responsiveness in your applications. We'll delve into the concept of asynchronous\
    \ programming, asynchronous methods, and how to handle asynchronous operations\
    \ effectively. By mastering asynchronous programming, you'll be able to create\
    \ applications that can handle multiple tasks simultaneously, resulting in smoother\
    \ user experiences and better resource utilization.\n\n## Understanding Asynchronous\
    \ Programming\n\nAsynchronous programming is a technique that allows your application\
    \ to perform tasks concurrently, without blocking the main execution thread. This\
    \ is particularly important for tasks that involve waiting, such as I/O operations\
    \ or network requests, which can cause your application to become unresponsive\
    \ if not managed properly.\n\n### Synchronous vs. Asynchronous\n\nIn synchronous\
    \ programming, tasks are executed one after the other, in a sequential manner.\
    \ If one task takes a significant amount of time, it can block the entire program,\
    \ leading to poor user experience.\n\nIn contrast, asynchronous programming allows\
    \ tasks to execute concurrently. While one task is waiting for a slow operation,\
    \ other tasks can continue executing. This enables better utilization of system\
    \ resources and responsiveness.\n\n## Asynchronous Methods and the `async` Keyword\n\
    \nIn C#, you can create asynchronous methods using the `async` and `await` keywords.\
    \ The `async` keyword is used to mark a method as asynchronous, and the `await`\
    \ keyword is used to indicate a point where the method should wait for an asynchronous\
    \ operation to complete.\n\n### Creating Asynchronous Methods\n\n```csharp\nusing\
    \ System;\nusing System.Net.Http;\nusing System.Threading.Tasks;\n\nclass Program\n\
    {\n    static async Task Main()\n    {\n        await DownloadWebsiteContentAsync();\n\
    \        Console.WriteLine(\"Website content downloaded.\");\n    }\n    static\
    \ async Task DownloadWebsiteContentAsync()\n    {\n        using (HttpClient client\
    \ = new HttpClient())\n        {\n            string content = await client.GetStringAsync(\"\
    https://www.example.com\");\n            Console.WriteLine(content.Substring(0,\
    \ 100)); // Display first 100 characters\n        }\n    }\n}\n```\n\nIn this\
    \ example, we use the `async` and `await` keywords to create an asynchronous method\
    \ named `DownloadWebsiteContentAsync`. The method downloads the content of a website\
    \ using `HttpClient` asynchronously.\n\n## Asynchronous Programming Patterns\n\
    \nAsynchronous programming introduces some patterns to manage asynchronous operations\
    \ effectively.\n\n### Fire and Forget\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        Console.WriteLine(\"\
    Starting task...\");\n        FireAndForget();\n        Console.WriteLine(\"Task\
    \ started.\");\n    }\n    static async void FireAndForget()\n    {\n        await\
    \ Task.Delay(1000);\n        Console.WriteLine(\"Fire and forget task completed.\"\
    );\n    }\n}\n```\n\nIn this example, the `FireAndForget` method is marked as\
    \ `async void`, which means it's a fire-and-forget method. The `Main` method calls\
    \ this method without awaiting it, allowing it to execute independently.\n\n###\
    \ Task.Run\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\nclass\
    \ Program\n{\n    static async Task Main()\n    {\n        Console.WriteLine(\"\
    Starting task...\");\n        await Task.Run(() => DelayAndPrint());\n       \
    \ Console.WriteLine(\"Task completed.\");\n    }\n    static async Task DelayAndPrint()\n\
    \    {\n        await Task.Delay(1000);\n        Console.WriteLine(\"Delayed task\
    \ completed.\");\n    }\n}\n```\n\nIn this example, the `Task.Run` method is used\
    \ to run a method on a separate thread. This can be useful for CPU-bound operations\
    \ that might otherwise block the main thread.\n\n## Handling Exceptions in Asynchronous\
    \ Code\n\nHandling exceptions in asynchronous code requires some attention, as\
    \ exceptions thrown in asynchronous tasks may not be caught by traditional `try`-`catch`\
    \ blocks.\n\n### Handling Exceptions\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        try\n       \
    \ {\n            await ThrowExceptionAsync();\n        }\n        catch (Exception\
    \ ex)\n        {\n            Console.WriteLine(\"Exception caught: \" + ex.Message);\n\
    \        }\n    }\n    static async Task ThrowExceptionAsync()\n    {\n      \
    \  await Task.Delay(100);\n        throw new Exception(\"An async exception occurred.\"\
    );\n    }\n}\n```\n\nIn this example, we use a `try`-`catch` block to catch an\
    \ exception thrown by an asynchronous method. Note that exceptions from asynchronous\
    \ methods are automatically wrapped in an `AggregateException` when caught.\n"
