    # **Chapter 11: Working with Collections and Generics**


    Welcome to the realm of collections and generics in C#! In this chapter, we''ll
    explore how to effectively manage groups of data using various collection types
    and how to create versatile and type-safe code using generics. By mastering these
    concepts, you''ll be able to manipulate and organize data in your programs with
    ease and create more robust and flexible code.


    ## Collections: Managing Groups of Data


    Collections are data structures that allow you to store and manipulate groups
    of related data items. They provide a powerful way to manage, search, and manipulate
    data efficiently.


    ### Lists: Dynamic Arrays


    A `List` is a dynamic array that can grow or shrink as needed. It provides methods
    for adding, removing, and accessing elements.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    List<int> numbers = new List<int>();


    numbers.Add(5);


    numbers.Add(10);


    numbers.Add(15);


    foreach (int number in numbers)


    {


    Console.WriteLine(number);


    }


    }


    }


    ```


    In this example, we create a `List` of integers and add three numbers to it. The
    `foreach` loop then iterates through the list and prints each number.


    ### Dictionaries: Key-Value Pairs


    A `Dictionary` is a collection that stores key-value pairs. It allows you to quickly
    retrieve values based on their associated keys.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    Dictionary<string, int> ages = new Dictionary<string, int>();


    ages["Alice"] = 25;


    ages["Bob"] = 30;


    ages["Charlie"] = 28;


    Console.WriteLine("Alice''s age: " + ages["Alice"]);


    }


    }


    ```


    Here, we create a `Dictionary` that maps names to ages. We retrieve and print
    Alice''s age using her name as the key.


    ### Queues and Stacks: First-In-First-Out and Last-In-First-Out


    `Queue` and `Stack` are specialized collections that implement the first-in-first-out
    (FIFO) and last-in-first-out (LIFO) data structures, respectively.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    Queue<string> queue = new Queue<string>();


    queue.Enqueue("First");


    queue.Enqueue("Second");


    queue.Enqueue("Third");


    while (queue.Count > 0)


    {


    string item = queue.Dequeue();


    Console.WriteLine(item);


    }


    }


    }


    ```


    In this example, we create a `Queue` of strings and enqueue three items. The `while`
    loop dequeues and prints each item in the order they were enqueued.


    ## Generics: Type-Safe Reusability


    Generics allow you to create classes, methods, and interfaces that work with different
    data types while maintaining type safety. They provide a way to create reusable
    code that adapts to different data requirements.


    ### Creating Generic Classes


    A generic class is a class that can work with different types. For example, a
    `List<T>` class can hold elements of any type `T`.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    List<int> intList = new List<int>();


    intList.Add(5);


    intList.Add(10);


    List<string> stringList = new List<string>();


    stringList.Add("Hello");


    stringList.Add("World");


    foreach (int number in intList)


    {


    Console.WriteLine(number);


    }


    foreach (string str in stringList)


    {


    Console.WriteLine(str);


    }


    }


    }


    ```


    In this example, we demonstrate the use of the generic `List<T>` class for both
    integers and strings.


    ### Creating Generic Methods


    Generic methods allow you to create methods that can work with different data
    types without rewriting code.


    ```csharp


    using System;


    class Program


    {


    static void Swap<T>(ref T a, ref T b)


    {


    T temp = a;


    a = b;


    b = temp;


    }


    static void Main()


    {


    int x = 5, y = 10;


    Console.WriteLine("Before: x = " + x + ", y = " + y);


    Swap(ref x, ref y);


    Console.WriteLine("After: x = " + x + ", y = " + y);


    }


    }


    ```


    Here, the `Swap` method is generic, allowing us to swap values of different types
    using the same code.


    ## Constraints in Generics


    You can apply constraints to generic type parameters to limit the types that can
    be used. Common constraints include `where T : class` (reference type), `where
    T : struct` (value type), and `where T : new()` (parameterless constructor).


    ```csharp


    using System;


    class Program


    {


    static T FindMax<T>(T[] array) where T : IComparable<T>


    {


    T max = array[0];


    foreach (T item in array)


    {


    if (item.CompareTo(max) > 0)


    {


    max = item;


    }


    }


    return max;


    }


    static void Main()


    {


    int[] numbers = { 5, 10, 3, 8, 2 };


    int maxNumber = FindMax(numbers);


    Console.WriteLine("Maximum number: " + maxNumber);


    string[] words = { "apple", "banana", "cherry" };


    string maxWord = FindMax(words);


    Console.WriteLine("Maximum word: " + maxWord);


    }


    }


    ```


    In this example, the `FindMax` method uses the `where T : IComparable<T>` constraint
    to ensure that the generic type parameter `T` implements the `IComparable<T>`
    interface, allowing comparisons.


