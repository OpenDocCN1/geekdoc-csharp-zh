    ## Loops


    Loops are used to repeatedly execute a block of code. Julia provides several types
    of loops, including `for` loops and `while` loops, to cater to various looping
    requirements.


    ### The `for` Loop


    A `for` loop is typically used when you want to iterate over a collection of items,
    such as an array or a range of numbers. Here''s a simple `for` loop that iterates
    through an array:


    ```julia


    fruits = ["apple", "banana", "cherry"]


    for fruit in fruits


    println("I love $fruit")


    end


    ```


    In this example, the `for` loop iterates through each element in the `fruits`
    array and prints a message for each fruit.


    ### The `while` Loop


    A `while` loop continues executing a block of code as long as a specified condition
    is `true`. Here''s an example:


    ```julia


    n = 1


    while n <= 5


    println("Count: $n")


    n += 1


    end


    ```


    In this code, the `while` loop runs as long as `n` is less than or equal to 5\.
    It prints the value of `n` and increments it in each iteration.


    ### Loop Control Statements


    Julia provides loop control statements to control the flow of loops. These statements
    include:


    - `break`: Terminates the loop prematurely.


    - `continue`: Skips the current iteration and moves to the next one.


    Here''s an example that uses `break` to exit a `for` loop early:


    ```julia


    fruits = ["apple", "banana", "cherry", "date"]


    for fruit in fruits


    if fruit == "cherry"


    break


    end


    println("I love $fruit")


    end


    ```


    In this code, when the loop encounters "cherry," the `break` statement is executed,
    and the loop terminates.


    ### Looping with Ranges


    Ranges are often used in loops to specify a sequence of values. Julia provides
    the `1:n` range syntax to create a range from 1 to `n`. Here''s an example:


    ```julia


    for i in 1:5


    println("Number: $i")


    end


    ```


    This `for` loop iterates through the range from 1 to 5 and prints the numbers.


    ## The `do` Block


    In Julia, you can use a `do` block to define anonymous functions or operations
    to be applied to elements iterated by loops like `map`, `filter`,


    and `reduce`. This functional style of programming is a powerful feature in Julia.


    Here''s an example that uses a `do` block with `map` to square each element of
    an array:


    ```julia


    numbers = [1, 2, 3, 4, 5]


    squared = map(numbers) do x


    x^2


    end


    println(squared)  # Prints [1, 4, 9, 16, 25]


    ```


    In this code, the `map` function applies the `do` block to each element of the
    `numbers` array and returns a new array with the squared values.


