    如果你正在寻找一种轻量级的选择，Visual Studio Code 是一个流行的选择。它是一个带有 C# 扩展的多功能代码编辑器，可以将 Visual Studio\
    \ 的许多功能带到更简洁环境中。\n\n## 总结\n\n在本章中，我们开启了探索 C# 编程世界的旅程。我们学习了 C# 的起源及其创建背后的愿景。我们讨论了\
