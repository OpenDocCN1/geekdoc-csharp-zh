  trans: "\n在本章中，我们探索了 C# 异步编程的世界。我们学习了如何使用 `async` 和 `await` 关键字创建异步方法，允许任务并发执行并提高我们应用程序的响应能力。我们讨论了诸如“发后不管”（fire\
    \ and forget）模式以及使用 `Task.Run` 有效管理异步任务的模式。\n\n异步编程对于构建能够同时处理多个任务的现代应用程序至关重要，无论是从互联网下载数据、处理大型数据集，还是与外部服务交互。通过掌握异步编程，你将能够创建提供流畅用户体验和高效资源利用的应用程序。因此，请拥抱异步编程的力量，让你的应用程序在响应性和并发方面大放异彩！\n\
    \n# 第 15 章：使用 WPF (Windows Presentation Foundation) 构建用户界面\n\n欢迎来到使用 C# 和 WPF\
    \ (Windows Presentation Foundation) 进行现代用户界面开发的世界！在本章中，我们将深入探索为应用程序创建丰富且交互性用户界的世界。我们将探索\
    \ WPF 的核心概念、创建布局、设计控件以及处理事件。通过掌握 WPF，你将能够构建出视觉吸引力且用户友好的界面，增强应用程序的整体用户体验。\n\n##\
    \ WPF 简介\n\nWPF 是 Windows 中的一个图形子系统，为创建桌面应用程序的用户界面提供了一个强大的框架。它提供了一种灵活且基于 XAML\
    \ 的界面设计方法，允许开发者将 UI 设计与逻辑分离。\n\n### WPF 的主要特性\n\n1. **XAML (可扩展应用程序标记语言)**：WPF\
    \ 使用 XAML 定义用户界面，实现了 UI 与后置代码的清晰。\n2. **丰富的控件**：WPF 提供了广泛的可定制控件，这些控件可以进行样式以匹配你的应用程序设计。\n\
    3. **布局灵活性**：WPF 引入了强大的布局控件，如 `Grid`、`StackPanel` 和 `DockPanel`，用于创建响应式和动态布局。\n\
    4. **数据绑定**：WPF 支持数据绑定，允许你轻松同步 UI 与后端逻辑之间的数据。\n\n## 创建简单的 WPF \n\n让我们从创建一个具有基础界面的简单\
    \ WPF 程序开始。\n\n```xaml\n<Window x:Class=\"WpfApp.MainWindow\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nTitle=\"My First WPF\
    \ App\" Height=\"300\" Width=\"400\">\n<Grid>\n  <TextBlock HorizontalAlignment=\"\
    Center\" VerticalAlignment=\"Center\" FontSize=\"20\">\n    Welcome to WPF!\n\
    \  </TextBlock>\n</Grid>\n</Window>\n```\n\n在这个示例中，我们定义了一个包含具有居中 `TextBlock` 的\
    \ `Grid` 布局的窗口。这段 XAML 标记代表了我们应用程序的用户界面。\n\n## WPF 中的布局控件\n\nWPF 提供了各种布局控件来组织和结构化用户界面中的元素。\n\
    \n### Grid 布局\n\n```xaml\n<Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition\
    \ Height=\"*\"/>\n    <RowDefinition Height=\"2*\"/>\n  </Grid.RowDefinitions>\n\
    \  <TextBlock Grid.Row=\"0\" Text=\"Top Area\"/>\n  <TextBlock Grid.Row=\"1\"\
    \ Text=\"Bottom Area\"/>\n</Grid>\n```\n\n在这个示例中，我们使用 `Grid` 布局创建了具有比例高度的两行。`TextBlock`\
    \ 元素被放置在不同的行中。\n\n### StackPanel\n\n```xaml\n<StackPanel>\n  <Button Content=\"\
    Click Me\"/>\n  <Button Content=\"Or Click Me\"/>\n  <Button Content=\"Or Even\
    \ Click Me\"/>\n</StackPanel>\n```\n\n`StackPanel` 将其子元素在单列或单行中排列，一个接一个地堆叠。\n\n\
    ## 样式与模板\n\nWPF 允许你使用样式和模板自定义控件的外观。\n\n### 应用样式\n\n```xaml\n<Window.Resources>\n\
    \  <Style TargetType=\"Button\">\n    <Setter Property=\"Background\" Value=\"\
    LightBlue\"/>\n    <Setter Property=\"FontSize\" Value=\"14\"/>\n  </Style>\n\
    </Window.Resources>\n<StackPanel>\n  <Button Content=\"Styled Button 1\"/>\n \
    \ <Button Content=\"Styled Button 2\"/>\n</StackPanel>\n```\n\n在这个示例中，我们为 `Window`\
    \ 内的所有 `Button` 控件定义了一个样式。该样式更改了按钮的背景颜色和字体大小。\n\n## 数据绑定\n\nWPF 的数据绑定能力允许你将 UI\
    \ 元素绑定到数据源，实现自动同步。\n\n### 绑定数据\n\n```xaml\n<StackPanel>\n  <TextBlock Text=\"\
    {Binding UserName}\" FontSize=\"18\"/>\n  <TextBox Text=\"{Binding UserName, Mode=TwoWay}\"\
    />\n</StackPanel>\n```\n\n在这个示例中，我们将一个 `TextBlock` 和 `TextBox` 绑定到 `UserName`\
    \ 属性。`TextBox` 中的更改会自动反映到 `TextBlock` 中。\n\n## 处理事件\n\nWPF 提供了一个健壮的事件系统来处理用户交互。\n\
    \n### 事件处理\n\n```xaml\n<Button Content=\"Click Me\" Click=\"Button_Click\"/>\n\
    ```\n\n```csharp\nprivate void Button_Click(object sender, RoutedEventArgs e)\n\
    {\n  MessageBox.Show(\"Button clicked!\");\n}\n```\n\n在这个示例中，我们在 XAML 中定义了一个 `Button`\
    \ 并在后置代码中处理它的 `Click` 事件。\n\n## 总结\n\n在本章中，我们探索了使用 C# 和 WPF (Windows Presentation\
    \ Foundation) 构建用户界的世界。我们涵盖了 WPF 的基本概念，包括 XAML 标记、布局控件、样式、数据绑定和事件处理。WPF 为你的桌面应用程序创建视觉吸引力且交互式的界面提供了一个强大且灵活的框架。\n\
    \n通过掌握 WPF，你将能够设计出兼顾用户体验和功能的界面。无论你是在构建小工具还是复杂的应用程序，WPF 都能赋予你创建吸引用户并增强软件整体易用性界的能力。因此，请潜入\
    \ WPF 的领域，让你的用户界面在创意、交互和现代设计的下焕发生机！\n\n感谢\n\n"
