    </Window>


    ```


    In this example, we define a window containing a `Grid` layout with a centered
    `TextBlock`. This XAML markup represents the user interface of our application.


    ## Layout Controls in WPF


    WPF provides a variety of layout controls to organize and structure the elements
    in your user interface.


    ### Grid Layout


    ```xaml


    <Grid>


    <Grid.RowDefinitions>


    <RowDefinition Height="*"/>


    <RowDefinition Height="2*"/>


    </Grid.RowDefinitions>


    <TextBlock Grid.Row="0" Text="Top Area"/>


    <TextBlock Grid.Row="1" Text="Bottom Area"/>


    </Grid>


    ```


    In this example, we use a `Grid` layout to create two rows with proportional heights.
    The `TextBlock` elements are placed in different rows.


    ### StackPanel


    ```xaml


    <StackPanel>


    <Button Content="Click Me"/>


    <Button Content="Or Click Me"/>


    <Button Content="Or Even Click Me"/>


    </StackPanel>


    ```


    A `StackPanel` arranges its children in a single column or row, stacking them
    one after the other.


    ## Styling and Templates


    WPF allows you to customize the appearance of controls using styles and templates.


    ### Applying Styles


    ```xaml


    <Window.Resources>


    <Style TargetType="Button">


    <Setter Property="Background" Value="LightBlue"/>


    <Setter Property="FontSize" Value="14"/>


    </Style>


    </Window.Resources>


    <StackPanel>


    <Button Content="Styled Button 1"/>


    <Button Content="Styled Button 2"/>


    </StackPanel>


    ```


    In this example, we define a style for all `Button` controls within the `Window`.
    This style changes the background color and font size of the buttons.


    ## Data Binding


    WPF''s data binding capabilities allow you to bind UI elements to data sources,
    enabling automatic synchronization.


    ### Binding to Data


    ```xaml


    <StackPanel>


    <TextBlock Text="{Binding UserName}" FontSize="18"/>


    <TextBox Text="{Binding UserName, Mode=TwoWay}"/>


    </StackPanel>


    ```


    In this example, we bind a `TextBlock` and a `TextBox` to a `UserName` property.
    Changes in the `TextBox` are automatically reflected in the `TextBlock`.


    ## Handling Events


    WPF provides a robust event system to handle user interactions.


    ### Event Handling


    ```xaml


    <Button Content="Click Me" Click="Button_Click"/>


    ```


    ```csharp


    private void Button_Click(object sender, RoutedEventArgs e)


    {


    MessageBox.Show("Button clicked!");


    }


    ```


    In this example, we define a `Button` in XAML and handle its `Click` event in
    the code-behind.


    ## Conclusion


    In this chapter, we''ve explored the world of building user interfaces with WPF
    (Windows Presentation Foundation) in C#. We''ve covered the fundamental concepts
    of WPF, including XAML markup, layout controls, styling, data binding, and event
    handling. WPF provides a powerful and flexible framework for creating visually
    appealing and interactive user interfaces for your desktop applications.


    By mastering WPF, you''ll be able to design interfaces that cater to both user
    experience and functionality. Whether you''re building small utilities or complex
    applications, WPF empowers you to create interfaces that engage users and enhance
    the overall usability of your software. So, dive into the realm of WPF, and let
    your user interfaces come to life with creativity, interactivity, and a touch
    of modern design!


    THANK YOU'
