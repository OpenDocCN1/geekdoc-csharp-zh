    - `Console.WriteLine(\"Hello, World!\");`：这一行使用 `System` 命名空间中的 `Console` 类在屏幕上显示文本“Hello,\
    \ World!”。\n\n## 集成开发环境 (IDEs)\n\n为了编写和运行 C# 程序，你需要一个集成开发环境 (IDE)。微软提供了 Visual\
