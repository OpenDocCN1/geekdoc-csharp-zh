    # **Chapter 3: Control Flow and Decision Making**


    In the previous chapters, we explored the basics of C# programming and wrote our
    first "Hello, World!" program. Now, it''s time to take a deeper dive into the
    heart of programming: control flow and decision making. These concepts empower
    us to create dynamic and responsive programs that adapt to different situations.
    In this chapter, we will unravel the mysteries of branching and looping, enabling
    us to write more sophisticated and efficient code.


    ## Conditional Statements: Making Decisions


    Imagine you''re writing a program to determine if a student has passed an exam.
    This is where conditional statements come into play. Conditional statements allow
    your program to make decisions based on certain conditions.


    ### The `if` Statement


    The simplest form of a conditional statement is the `if` statement. It evaluates
    a condition, and if the condition is `true`, the code block associated with it
    is executed.


    Let''s consider an example:


    ```csharp


    int score = 85;


    if (score >= 60)


    {


    Console.WriteLine("Congratulations! You passed the exam.");


    }


    ```


    In this example, the `if` statement checks if the `score` is greater than or equal
    to 60\. If it is, the message "Congratulations! You passed the exam." will be
    displayed.


    ### The `else` Clause


    Often, you''ll want to provide an alternative action when the condition is `false`.
    This is where the `else` clause comes in.


    ```csharp


    int score = 45;


    if (score >= 60)


    {


    Console.WriteLine("Congratulations! You passed the exam.");


    }


    else


    {


    Console.WriteLine("Unfortunately, you did not pass.");


    }


    ```


    Here, if the `score` is less than 60, the program will display "Unfortunately,
    you did not pass."


    ### The `else if` Clause


    In some cases, you might have multiple conditions to check. This is where the
    `else if` clause is useful.


    ```csharp


    int score = 75;


    if (score >= 90)


    {


    Console.WriteLine("You received an A.");


    }


    else if (score >= 80)


    {


    Console.WriteLine("You received a B.");


    }


    else if (score >= 70)


    {


    Console.WriteLine("You received a C.");


    }


    else


    {


    Console.WriteLine("You need to improve your score.");


    }


    ```


    Here, the program checks multiple conditions and provides a corresponding message
    based on the `score`.


    ## Looping: Repeating Actions


    Imagine you''re tasked with printing "Hello, World!" five times. Instead of writing
    the same line of code five times, you can use loops to automate repetitive tasks.


    ### The `for` Loop


    The `for` loop is a common way to repeat a block of code a specific number of
    times.


    ```csharp


    for (int i = 0; i < 5; i++)


    {


    Console.WriteLine("Hello, World!");


    }


    ```


    In this example, the loop will execute the `Console.WriteLine` statement five
    times, each time incrementing the value of `i`.


    ### The `while` Loop


    The `while` loop continues executing a block of code as long as a specified condition
    remains `true`.


    ```csharp


    int countdown = 10;


    while (countdown > 0)


    {


    Console.WriteLine("Countdown: " + countdown);


    countdown--;


    }


    ```


    This code will display a countdown from 10 to 1.


    ### The `do while` Loop


    Similar to the `while` loop, the `do while` loop also repeats a block of code
    as long as a condition remains `true`. The key difference is that the condition
    is checked after the code block is executed, ensuring the code runs at least once.


    ```csharp


    int count = 0;


    do


    {


    Console.WriteLine("Count: " + count);


    count++;


    } while (count < 5);


    ```


    This loop will display the numbers 0 to 4.


    ## Combining Control Structures


    You can combine conditional statements and loops to create more complex and versatile
    programs.


    ```csharp


    for (int i = 1; i <= 100; i++)


    {


    if (i % 3 == 0 && i % 5 == 0)


    {


    Console.WriteLine("FizzBuzz");


    }


    else if (i % 3 == 0)


    {


    Console.WriteLine("Fizz");


    }


    else if (i % 5 == 0)


    {


    Console.WriteLine("Buzz");


    }


    else


    {


    Console.WriteLine(i);


    }


    }


    ```


    In this example, we use a loop to iterate through numbers from 1 to 100\. Depending
    on whether the number is divisible by 3, 5, or both, we display "Fizz," "Buzz,"
    "FizzBuzz," or the number itself.


    ## Conclusion


    In this chapter, we delved into the world of control flow and decision making
    in C#. We explored conditional statements like `if`, `else`, and `else if`, which
    allow our programs to make decisions based on conditions. We also uncovered the
    power of looping constructs such as `for`, `while`, and `do while`, enabling us
    to automate repetitive tasks and iterate over data.


    By combining these control structures, you can create sophisticated programs that
    respond dynamically to different scenarios. As you continue your journey through
    C# programming, remember that mastering control flow is essential for building
    efficient, flexible, and robust applications. So, embrace the power of decision
    making and looping, and let your code come to life!


    # **Chapter 4: Loops and Iteration**


    Welcome to the world of loops and iteration, where we unlock the ability to repeat
    actions and process data efficiently in our C# programs. Loops are essential tools
    that allow us to save time, reduce redundancy, and handle repetitive tasks gracefully.
    In this chapter, we''ll explore different types of loops, learn how to control
    their behavior, and discover how iteration plays a crucial role in modern programming.


