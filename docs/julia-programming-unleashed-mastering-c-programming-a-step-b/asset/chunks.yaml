    \n# 第 6 章：面向对象编程概念\n\n欢迎来到面向对象编程（OOP）的世界，这种范式为 C# 程序带来了新层级的结构和组织。面向对象编程允许你在代码中对现实世界的实体、其属性和行为进行建模。在本章中，我们将探索\
    \ OOP 的核心概念，如类、对象、继承和封装，以及它们如何塑造我们设计和构建软件的方式。\n\n## 理解面向对象编程\n\n面向对象编程的核心是将一切视为一个“对象”。对象是类的实例，而类本质上是创建对象的蓝图或模板。OOP\
    \ 鼓励我们从实体及其交互的角度来思考代码，镜像了现实世界。\n\n## 类与对象\n\n### 类：对象的蓝图\n\n类是一种用户定义的数据类型，定义了对象的属性（字段）和行为（方法）。将类类比一个描述该类型对象应该如何结构的蓝图。\n\
    \n```csharp\nclass Person\n{\n    public string Name;\n    public int Age;\n \
    \   public void SayHello()\n    {\n        Console.WriteLine(\"Hello, my name\
    \ is \" + Name + \" and I am \" + Age + \" years old.\");\n    }\n}\n```\n\n在这个示例中，我们定义了一个\
    \ `Person` 类，具有属性 `Name` 和 `Age`，以及一个方法 `SayHello`。\n\n### 对象：类的实例\n\n对象是类的实例。它是使用类提供的蓝图创建的，并可以拥有它自己的属性值。\n\
    \n```csharp\nPerson alice = new Person();\nalice.Name = \"Alice\";\nalice.Age\
    \ = 25;\nalice.SayHello(); // 输出：Hello, my name is Alice and I am 25 years old.\n\
    ```\n\n在这里，我们创建了 `Person` 类的对象 `alice` 并设置了它的属性。然后我们在 `alice` 对象上调用了 `SayHello`\
    \ 方法。\n\n## 封装：数据保护\n\n封装是将数据（属性）和操作这些数据的方法组合成单个单元（类）的原则。它通过控制对对象内部状态的访问来提供数据保护。\n\
    \n```csharp\nclass BankAccount\n{\n    private double balance;\n    public void\
    \ Deposit(double amount)\n    {\n        if (amount > 0)\n        {\n        \
    \    balance += amount;\n        }\n    }\n    public void Withdraw(double amount)\n\
    \    {\n        if (amount > 0 && amount <= balance)\n        {\n            balance\
    \ -= amount;\n        }\n    }\n    public double GetBalance()\n    {\n      \
    \  return balance;\n    }\n}\n```\n\n在这个示例中，`balance` 字段被封装在 `BankAccount` 类中，其值只能通过\
    \ `Deposit` 和 `Withdraw` 方法进行修改。\n\n## 继承：构建层次结构\n\n继承允许你基于现有类创建新类，并继承其属性和行为。新类被称为派生类，现有类被称为基类。\n\
