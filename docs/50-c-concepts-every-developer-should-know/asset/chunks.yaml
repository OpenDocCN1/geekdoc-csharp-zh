  trans: "\n\nBlazor 是一个多功能的 Web 开发框架，在客户端和服务器端都提供了 C# 的优势。无论是使用 Blazor WebAssembly\
    \ 构建 Web 应用，还是利用 Blazor Server 的实时能力，开发者都可以使用熟悉的工具和语言创建现代且交互式的 Web 。\n\n# 37.\
    \ 使用 Web API 创建 RESTful 服务\n\nASP.NET Web API 是一个用于构建 HTTP 框架，它可以被多种客户端（包括 Web\
    \ 浏览器、移动设备和桌面应用程序）消费。本指南概述了如何使用 C# 通过 ASP.NET Web API 创建 RESTful 服务。\n\n## Web\
    \ API 简介\n\n### 什么是 REST？\n\n表现层转移（REST）是一种设计网络的架构风格。RESTful 服务使用标准的 HTTP 方法（`GET`、`POST`、`PUT`、`DELETE`）对资源执行操作，数据通常以\
    \ JSON 或 XML 格式交换。\n\n### RESTful 服务的主要特性\n\n* **无状态**：客户端的每个请求都包含理解和满足请求所需的所有信息。\n\
    * **基于资源**：资源通过 URI 标识，客户端使用标准的 HTTP 方法与资源进行交互。\n* **表现层**：资源可以有多种表现形式（如 JSON\
    \ 或 XML），客户端可以选择它们偏好的表现形式。\n\n## 创建一个简单的 Web API\n\n### 创建新的 Web API 项目\n\n####\
    \ 使用 Visual Studio：\n\n* 打开 Visual Studio。\n* 选择“创建新项目”。\n* 选择“ASP.NET Core Web\
    \ Application”。\n* 选择“API”模板并点击“创建”。\n\n#### 使用 .NET CLI：\n\n* 打开命令提示符。\n* 运行以下命令：\n\
    \n```bash\ndotnet new webapi -n MyWebApi\ncd MyWebApi\ndotnet run\n```\n\n###\
    \ 创建控制器 (Controller)\n\n添加一个新控制器：\n\n* 右键点击 `Controllers` 文件夹。\n* 选择“添加” -> “控制器”。\n\
    * 选择“API 控制器 - 空”并进行命名，例如 `ValuesController`。\n* 实现处理 HTTP 方法的操作（Actions）。\n\n\
    ```csharp\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class ValuesController\
    \ : ControllerBase\n{\n    // GET api/values\n    [HttpGet]\n    public ActionResult<IEnumerable<string>>\
    \ Get()\n    {\n        return new string[] { \"value1\", \"value2\" };\n    }\n\
    \n    // GET api/values/5\n    [HttpGet(\"{id}\")]\n    public ActionResult<string>\
    \ Get(int id)\n    {\n        return \"value\";\n    }\n\n    // POST api/values\n\
    \    [HttpPost]\n    public void Post([FromBody] string value)\n    {\n      \
    \  // 处理 POST 请求\n    }\n\n    // PUT api/values/5\n    [HttpPut(\"{id}\")]\n\
    \    public void Put(int id, [FromBody] string value)\n    {\n        // 处理 PUT\
    \ 请求\n    }\n\n    // DELETE api/values/5\n    [HttpDelete(\"{id}\")]\n    public\
    \ void Delete(int id)\n    {\n        // 处理 DELETE 请求\n    }\n}\n```\n\n### 运行\
    \ Web API\n\n运行应用程序：\n\n* 按 F5 或使用“启动”按钮运行应用程序。\n* 在 Web 浏览器或使用 Postman 等工具访问\
    \ API。\n\n测试 API 端点：\n\n* 使用类似 `http://localhost:port/api/values` 的 URL 进行 `GET`\
    \ 请求。\n* 向相应的端点发送 `POST`、`PUT` 和 `DELETE` 请求。\n\n## 在 Web API 中处理数据\n\n### 模型类\
    \ (Model Classes)：创建模型类来表示 API 所处理的数据。\n\n```csharp\npublic class Item\n{\n  \
    \  public int Id { get; set; }\n    public string Name { get; set; }\n}\n```\n\
    \n### 使用依赖注入 (Dependency Injection)：将服务注入控制器中以处理数据操作。\n\n```csharp\n[ApiController]\n\
    [Route(\"api/[controller]\")]\npublic class ItemsController : ControllerBase\n\
    {\n    private readonly IItemService _itemService;\n\n    public ItemsController(IItemService\
    \ itemService)\n    {\n        _itemService = itemService;\n    }\n\n    // GET\
    \ api/items\n    [HttpGet]\n    public ActionResult<IEnumerable<Item>> Get()\n\
    \    {\n        var items = _itemService.GetItems();\n        return Ok(items);\n\
    \    }\n\n    // GET api/items/5\n    [HttpGet(\"{id}\")]\n    public ActionResult<Item>\
    \ Get(int id)\n    {\n        var item = _itemService.GetItemById(id);\n     \
    \   if (item == null)\n        {\n            return NotFound();\n        }\n\
    \        return Ok(item);\n    }\n\n    // POST api/items\n    [HttpPost]\n  \
    \  public ActionResult<Item> Post([FromBody] Item item)\n    {\n        _itemService.AddItem(item);\n\
    \        return CreatedAtAction(nameof(Get), new { id = item.Id }, item);\n  \
    \  }\n\n    // PUT api/items/5\n    [HttpPut(\"{id}\")]\n    public IActionResult\
    \ Put(int id, [FromBody] Item item)\n    {\n        if (id != item.Id)\n     \
    \   {\n            return BadRequest();\n        }\n        _itemService.UpdateItem(item);\n\
    \        return NoContent();\n    }\n\n    // DELETE api/items/5\n    [HttpDelete(\"\
    {id}\")]\n    public IActionResult Delete(int id)\n    {\n        _itemService.DeleteItem(id);\n\
    \        return NoContent();\n    }\n}\n```\n\n### 服务接口与实现：为服务定义接口并提供一个实现。\n\n\
    ```csharp\npublic interface IItemService\n{\n    IEnumerable<Item> GetItems();\n\
    \    Item GetItemById(int id);\n    void AddItem(Item item);\n    void UpdateItem(Item\
    \ item);\n    void DeleteItem(int id);\n}\n\npublic class ItemService : IItemService\n\
    {\n    private readonly List<Item> _items = new List<Item>\n    {\n        new\
    \ Item { Id = 1, Name = \"Item 1\" },\n        new Item { Id = 2, Name = \"Item\
    \ 2\" }\n    };\n\n    public IEnumerable<Item> GetItems()\n    {\n        return\
    \ _items;\n    }\n\n    public Item GetItemById(int id)\n    {\n        return\
    \ _items.FirstOrDefault(item => item.Id == id);\n    }\n\n    public void AddItem(Item\
    \ item)\n    {\n        item.Id = _items.Count + 1;\n        _items.Add(item);\n\
    \    }\n\n    public void UpdateItem(Item item)\n    {\n        var existingItem\
    \ = _items.FirstOrDefault(i => i.Id == item.Id);\n        if (existingItem !=\
    \ null)\n        {\n            existingItem.Name = item.Name;\n        }\n  \
    \  }\n\n    public void DeleteItem(int id)\n    {\n        var itemToRemove =\
    \ _items.FirstOrDefault(item => item.Id == id);\n        if (itemToRemove != null)\n\
    \        {\n            _items.Remove(itemToRemove);\n        }\n    }\n}\n```\n\
    \n### 安全 Web API\n\n**身份验证与授权**：通过实现身份验证和授权机制来保护您的 Web API。ASP.NET Core 支持多种方案的身份验证和授权，例如\
    \ JWT（JSON Token）和 OAuth。\n\n**基于角色的授权**：实现基于角色的授权，根据用户的角色控制对特定端点的访问。\n\n```csharp\n\
    [Authorize(Roles = \"Admin\")]\n[ApiController]\n[Route(\"api/[controller]\")]\n\
    public class AdminController : ControllerBase\n{\n    // 仅允许“Admin”角色的用户访问的控制器\n\
    }\n```\n\n# 38. 使用 ADO.NET 操作数据库\n\nADO.NET（ActiveX Data Objects for .NET）是 .NET\
    \ Framework 中一组用于从关系型数据库访问和操作数据的类。本指南概述了如何使用 C# 通过 ADO.NET 操作数据库。\n\n## ADO.NET\
    \ 简介\n\n### ADO.NET 的组件\n\n* **连接 (Connection)**：管理与数据库的连接。\n* **命令 (Command)**：执行\
    \ SQL 查询或存储过程。\n* **读取器 (DataReader)**：从数据库读取只读的行数据流。\n* **适配器 (DataAdapter)**：为\
    \ DataSet 填充数据并更新数据库。\n* **数据集 (DataSet)**：表示内存中的数据缓存。\n* **数据表 (DataTable)**：表示内存中的单张表。\n\
    * **数据视图 (DataView)**：表示 DataTable 的可绑定的、自定义视图。\n\n### ADO.NET 工作流\n\n**建立连接**：使用\
    \ `SqlConnection` 对象打开与数据库的连接。\n\n**执行命令**：使用 `SqlCommand` 对象执行 SQL 查询或存储过程。\n\
    \n"
