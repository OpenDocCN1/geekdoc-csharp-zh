    \n# Update Database Use a `SqlDataAdapter` to update the database with changes\
    \ made to a `DataSet`.\n\n# Connecting to a Database\n\n### Connection String\n\
    ```csharp\nstring connectionString = \"Data Source=ServerName;Initial Catalog=DatabaseName;User\
    \ Id=Username;Password=Password;\";\n```\n\n### Opening and Closing Connection\n\
    ```csharp\nusing (SqlConnection connection = new SqlConnection(connectionString))\n\
    {\n    connection.Open();\n    // Perform database operations\n} // Connection\
    \ is automatically closed when leaving the using block\n```\n\n# Executing SQL\
    \ Queries\n\n### SqlCommand\n```csharp\nstring queryString = \"SELECT * FROM Customers\"\
    ;\nusing (SqlConnection connection = new SqlConnection(connectionString))\n{\n\
    \    connection.Open();\n    using (SqlCommand command = new SqlCommand(queryString,\
    \ connection))\n    {\n        using (SqlDataReader reader = command.ExecuteReader())\n\
    \        {\n            while (reader.Read())\n            {\n               \
    \ // Process data\n                string customerName = reader[\"CustomerName\"\
    ].ToString();\n            }\n        }\n    }\n}\n```\n\n# Executing Stored Procedures\n\
    \n### Calling Stored Procedure with Parameters\n```csharp\nstring procedureName\
    \ = \"GetCustomerById\";\nint customerId = 1;\nusing (SqlConnection connection\
    \ = new SqlConnection(connectionString))\n{\n    connection.Open();\n    using\
    \ (SqlCommand command = new SqlCommand(procedureName, connection))\n    {\n  \
    \      command.CommandType = CommandType.StoredProcedure;\n        command.Parameters.Add(new\
    \ SqlParameter(\"@CustomerId\", customerId));\n        using (SqlDataReader reader\
    \ = command.ExecuteReader())\n        {\n            while (reader.Read())\n \
    \           {\n                // Process data\n            }\n        }\n   \
    \ }\n}\n```\n\n# Working with DataSets and DataAdapters\n\n### Populating DataSet\
    \ with DataAdapter\n```csharp\nstring queryString = \"SELECT * FROM Customers\"\
    ;\nusing (SqlConnection connection = new SqlConnection(connectionString))\n{\n\
    \    connection.Open();\n    using (SqlDataAdapter adapter = new SqlDataAdapter(queryString,\
    \ connection))\n    {\n        DataSet dataSet = new DataSet();\n        adapter.Fill(dataSet,\
    \ \"Customers\");\n        // Access data in the DataSet\n        DataTable customersTable\
    \ = dataSet.Tables[\"Customers\"];\n        foreach (DataRow row in customersTable.Rows)\n\
    \        {\n            // Process data\n            string customerName = row[\"\
    CustomerName\"].ToString();\n        }\n    }\n}\n```\n\n### Updating Database\
    \ with DataAdapter\n```csharp\nstring queryString = \"SELECT * FROM Customers\"\
    ;\nusing (SqlConnection connection = new SqlConnection(connectionString))\n{\n\
    \    connection.Open();\n    using (SqlDataAdapter adapter = new SqlDataAdapter(queryString,\
    \ connection))\n    {\n        DataSet dataSet = new DataSet();\n        adapter.Fill(dataSet,\
    \ \"Customers\");\n        // Modify data in the DataSet\n        // Update changes\
    \ to the database\n        adapter.Update(dataSet, \"Customers\");\n    }\n}\n\
    ```\n\n# Handling Transactions\n\n### Managing Transactions\n```csharp\nusing\
    \ (SqlConnection connection = new SqlConnection(connectionString))\n{\n    connection.Open();\n\
    \    SqlTransaction transaction = connection.BeginTransaction();\n    try\n  \
    \  {\n        // Perform multiple database operations within the transaction\n\
    \        transaction.Commit();\n    }\n    catch (Exception ex)\n    {\n     \
    \   // Handle exceptions and rollback the transaction\n    }\n}\n```\n"
