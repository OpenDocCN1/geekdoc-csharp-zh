- fmt: "\n.NET Core is a free, open-source, cross-platform framework for building\
    \ modern, cloud-based, and connected applications. It serves as the foundation\
    \ for various application types, including web, desktop, mobile, cloud, gaming,\
    \ IoT, and AI applications.\n\n## Key Features\n\n- **Cross-Platform**: `.NET\
    \ Core` is designed to run on multiple platforms, including Windows, macOS, and\
    \ Linux, allowing developers to build applications that can run seamlessly across\
    \ different operating systems.\n- **Open Source**: The framework is open source,\
    \ encouraging community contributions and providing transparency in its development.\
    \ Developers can access the source code, contribute to its improvement, and explore\
    \ its internals.\n- **Command-Line Interface (CLI)**: `.NET Core` includes a powerful\
    \ command-line interface (`CLI`) that enables developers to build, run, test,\
    \ and publish applications directly from the command line, offering a flexible\
    \ and efficient development experience.\n- **Microservices Architecture**: `.NET\
    \ Core` is well-suited for microservices-based architectures, enabling developers\
    \ to build and deploy scalable and modular applications that consist of small,\
    \ independently deployable services.\n\n## Creating a .NET Core Application\n\n\
    ### Installing .NET Core SDK\nDownload and install the `.NET Core SDK` from the\
    \ official website: `https://dotnet.microsoft.com/download`\n\n### Creating a\
    \ Console Application\n#### Create a new console application\n```bash\ndotnet\
    \ new console -n MyConsoleApp\n```\n\n#### Running the Application\n#### Navigate\
    \ to the application directory\n```bash\ncd MyConsoleApp\n```\n#### Run the application\n\
    ```bash\ndotnet run\n```\n\n## .NET Core vs .NET Framework\n`.NET Core` differs\
    \ from the traditional `.NET Framework` in several ways. While `.NET Framework`\
    \ is primarily designed for Windows applications, `.NET Core` is cross-platform.\
    \ `.NET Core` is also modular, allowing developers to include only the components\
    \ they need, reducing the size of deployed applications.\n\n## .NET 5 and Beyond\n\
    `.NET 5` is the next version of the framework after `.NET Core`, and it unifies\
    \ the previously separate `.NET Core` and `.NET Framework`. It continues to improve\
    \ cross-platform support, performance, and developer productivity.\n\n`.NET Core`\
    \ is a versatile and modern framework that empowers developers to create high-performance,\
    \ scalable, and cross-platform applications. Its open-source nature, cross-platform\
    \ capabilities, and support for microservices architecture make it a popular choice\
    \ for a wide range of development scenarios.\n\n# 21. Memory Management and Garbage\
    \ Collection\n\nMemory management is a critical aspect of programming, ensuring\
    \ efficient allocation and deallocation of memory resources. In `C#`, automatic\
    \ memory management is provided by the `.NET` runtime through a process called\
    \ `Garbage Collection`.\n\n## Automatic Memory Management in C#\n\n- **Stack and\
    \ Heap**: In `C#`, memory is divided into two main areas: the `stack` and the\
    \ `heap`. The `stack` is used for storing value types and method call information,\
    \ while the `heap` is used for dynamically allocated memory, primarily for reference\
    \ types.\n- **Value Types vs Reference Types**: Value types (e.g., `int`, `float`)\
    \ are stored on the `stack`, while reference types (e.g., `classes`, `arrays`)\
    \ are allocated on the `heap`. Reference types store a reference to the actual\
    \ data on the heap.\n\n## Garbage Collection\n`Garbage Collection` (`GC`) is a\
    \ process where the runtime automatically reclaims memory occupied by objects\
    \ that are no longer in use, preventing memory leaks and promoting efficient memory\
    \ utilization.\n\n- **Generation-Based GC**: `GC` in `.NET` is generational, dividing\
    \ objects into three generations (young, middle-aged, and old). Newly created\
    \ objects start in the young generation and, if they survive multiple collections,\
    \ they are promoted to older generations.\n- **Garbage Collection Algorithms**:\
    \ The `.NET` `GC` uses different algorithms, including:\n    - **Mark-and-Sweep**:\
    \ Identifies and marks objects that are still reachable.\n    - **Compact**: Compacts\
    \ memory by moving live objects together, reducing fragmentation.\n\n## IDisposable\
    \ Interface and using Statement\n\n**Managing Unmanaged Resources**: The `IDisposable`\
    \ interface is used for releasing unmanaged resources such as file handles, database\
    \ connections, or network sockets.\n\n```csharp\npublic class MyResource : IDisposable\n\
    {\n    private bool disposed = false;\n\n    // Implement IDisposable pattern\n\
    \    public void Dispose()\n    {\n        Dispose(true);\n        GC.SuppressFinalize(this);\n\
    \    }\n\n    protected virtual void Dispose(bool disposing)\n    {\n        if\
    \ (!disposed)\n        {\n            if (disposing)\n            {\n        \
    \        // Release managed resources\n            }\n            // Release unmanaged\
    \ resources\n            disposed = true;\n        }\n    }\n\n    ~MyResource()\n\
    \    {\n    }\n}\n```\n\n**Using Statement**: The `using` statement ensures that\
    \ `Dispose` is called, even if an exception occurs.\n\n```csharp\nusing (MyResource\
    \ resource = new MyResource())\n{\n    // Use resource\n}\n```\n\n## Memory Profiling\
    \ and Optimization\nTools for Memory Profiling: Tools such as Visual Studio Profiler\
    \ and third-party profilers help analyze memory usage.\n\n### Best Practices for\
    \ Memory Management\n- Minimize the use of global variables.\n- Avoid unnecessary\
    \ object creation.\n- Release resources using `Dispose` or `using` statement.\n\
    - Be cautious with large object graphs and circular references.\n\nEffective memory\
    \ management is crucial for creating high-performance applications. `C#`'s garbage\
    \ collection, combined with proper resource management through `IDisposable` and\
    \ `using`, helps build robust software. Regular profiling and optimization further\
    \ contribute to optimal memory utilization.\n\n# 22. Working with Dates and Times\n\
    \nWorking with dates and times is a common requirement in software development,\
    \ and `C#` provides a rich set of features in `System.DateTime` and related classes\
    \ to handle these scenarios.\n\n## DateTime Structure\n\n### Creating a DateTime\
    \ Object\n```csharp\nDateTime currentDateTime = DateTime.Now;\nDateTime specificDateTime\
    \ = new DateTime(2024, 2, 3, 12, 30, 0);\n```\n\n### Formatting and Parsing\n\
    ```csharp\nstring formattedDate = currentDateTime.ToString(\"yyyy-MM-dd HH:mm:ss\"\
    );\nDateTime parsedDate = DateTime.Parse(\"2024-02-03 12:30:00\");\n```\n\n###\
    \ Adding and Subtracting Time\n```csharp\nDateTime futureDate = currentDateTime.AddHours(24);\n\
    DateTime pastDate = currentDateTime.AddMonths(-1);\n```\n\n## TimeSpan Structure\n\
    \n### Creating a TimeSpan Object\n```csharp\nTimeSpan duration = new TimeSpan(1,\
    \ 30, 0); // 1 hour and 30 minutes\n```\n\n### Operations with TimeSpan\n```csharp\n\
    DateTime futureTime = currentDateTime + duration;\nDateTime pastTime = currentDateTime\
    \ - duration;\n```\n\n## DateTimeOffset Structure\n\n### Working with Time Zones\n\
    ```csharp\nDateTimeOffset utcDateTime = DateTimeOffset.UtcNow;\nDateTimeOffset\
    \ specificDateTimeZone = new DateTimeOffset(2024, 2, 3, 12, 30, 0, TimeSpan.FromHours(5));\n\
    ```\n\n## TimeZoneInfo Class\n### Working with Time Zones\n```csharp\nTimeZoneInfo\
    \ easternTimeZone = TimeZoneInfo.FindSystemTimeZoneById(\"Eastern Standard Time\"\
    );\nDateTime easternTime = TimeZoneInfo.ConvertTime(currentDateTime, easternTimeZone);\n\
    ```\n\n## Formatting Date and Time for Display\n```csharp\nstring customFormattedDate\
    \ = currentDateTime.ToString(\"MMMM dd, yyyy\");\n```\n"
