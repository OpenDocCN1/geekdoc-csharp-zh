    \ = 0;\nif (num > 0) {\n    Console.WriteLine(\"The number is positive.\");\n\
    } else if (num < 0) {\n    Console.WriteLine(\"The number is negative.\");\n}\
    \ else {\n    Console.WriteLine(\"The number is zero.\");\n}\n```\n\n## Loops\n\
