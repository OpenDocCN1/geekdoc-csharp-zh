    \ 引入机器学习和人工智能（AI）。\n\n# 机器学习简介\n\n## 什么是机器学习？\n\n* `机器学习 (ML)`：人工智能的一个子集，使系统能够从经验中学习并不断改进。\n\
    * `监督学习`：在带有标记的数据上进行训练模型。\n* `无监督学习`：从未标记的数据中提取模式。\n* `强化学习`：通过基于奖励的系统来训练模型。\n\
    \n## ML.NET 基础知识\n\n* `ML.NET` 库：为机器学习任务提供工具和库。\n* `数据流水线 (Data Pipeline)`：为模型训练对数据进行预处理和转换。\n\
    * `模型训练`：创建并训练机器学习模型。\n* `模型评估`：评估已训练模型的性能。\n\n## ML.NET 数据流水线\n\n### 数据加载与准备\n\
    \n* `IDataView` 接口：表示对数据集的可变、惰性视图。\n* `LoadFromEnumerable`：从内存集合中加载数据。\n* `数据预处理`：清洗和转换数据。\n\
    \n```sharp\nvar data = new List<MyData>\n{\n    new MyData { Feature1 = 1.2F,\
    \ Feature2 = 2.3F, Label = true },\n    // 添加更多数据...\n};\n\nvar context = new\
    \ MLContext();\nvar dataView = context.Data.LoadFromEnumerable(data);\n```\n\n\
    ### 数据转换\n\n* `特征化`：将原始数据转换为特征。\n* `归一化`：缩放特征以保持范围一致性。\n\n```csharp\nvar pipeline\
    \ = context.Transforms.Conversion.MapValueToKey(\"Label\")\n    .Append(context.Transforms.Concatenate(\"\
    Features\", \"Feature1\", \"Feature2\"))\n    .Append(context.Transforms.NormalizeMinMax(\"\
    Features\"));\n```\n\n## 使用 ML.NET 进行模型训练\n\n### 选择模型\n\n* `算法`：`ML.NET` 支持用于分类、回归、聚类等的各种算法。\n\
    * `模型配置`：设置超参数和选项。\n\n```csharp\nvar trainer = context.BinaryClassification.Trainers.SdcaLogisticRegression();\n\
    ```\n\n### 模型训练与评估\n\n* `Fit` 方法：使用训练数据训练模型。\n* `Evaluate` 方法：评估模型的性能。\n\n```csharp\n\
    var model = pipeline.Append(trainer)\n    .Fit(dataView);\n\nvar metrics = context.BinaryClassification.Evaluate(model.Transform(dataView));\n\
    ```\n\n## ML.NET 模型消费\n\n### 模型保存与加载\n\n* `保存模型`：持久化已训练的模型以供将来使用。\n* `加载模型`：加载预训练模型。\n\
    \n```csharp\ncontext.Model.Save(model, data.Schema, \"model.zip\");\nvar loadedModel\
    \ = context.Model.Load(\"model.zip\", out var modelSchema);\n```\n\n### 进行预测\n\
    \n* `预测引擎 (Prediction Engine)`：创建一个用于进行预测的引擎。\n* `Predict` 方法：从新数据获取预测结果。\n\n\
    ```csharp\nvar predictionEngine = context.Model.CreatePredictionEngine<MyData,\
    \ MyPrediction>(model);\nvar prediction = predictionEngine.Predict(new MyData\
