  trans: "\n\n事件（Events）了一种类在发生感兴趣事件时通知其他类或对象机制。它们基于委托，并遵循发布-订阅模式。\n\n### 事件声明\n\n\
    ```csharp\n// Event declaration\n\npublic class EventPublisher\n{\n    public\
    \ event MyDelegate MyEvent;\n}\n```\n\n### 订阅事件\n\n```csharp\n// Subscribing to\
    \ events\npublic class EventSubscriber\n{\n    public void Subscribe(EventPublisher\
    \ publisher)\n    {\n        publisher.MyEvent += HandleEvent;\n    }\n    public\
    \ void HandleEvent(string message)\n    {\n        Console.WriteLine($\"Event\
    \ handled: {message}\");\n    }\n}\n```\n\n### 发布事件\n\n```csharp\n// Publishing\
    \ events\nEventPublisher publisher = new EventPublisher();\nEventSubscriber subscriber\
    \ = new EventSubscriber();\nsubscriber.Subscribe(publisher);\npublisher.MyEvent?.Invoke(\"\
    Event message\"); // Raising the event\n```\n\n### 事件处理器和 EventArgs\n\n```csharp\n\
    // Event handlers and EventArgs\npublic class CustomEventArgs : EventArgs\n{\n\
    \    public string EventMessage { get; }\n    public CustomEventArgs(string message)\n\
    \    {\n        EventMessage = message;\n    }\n}\n\npublic class EventPublisher\n\
    {\n    public event EventHandler<CustomEventArgs> MyEvent;\n    public void RaiseEvent(string\
    \ message)\n    {\n        OnMyEvent(new CustomEventArgs(message));\n    }\n \
    \   protected virtual void OnMyEvent(CustomEventArgs e)\n    {\n        MyEvent?.Invoke(this,\
    \ e);\n    }\n}\n```\n\n委托和事件在实现 C# 事件驱动编程中起着至关重要的作用。委托允许你创建灵活且可扩展的回调机制，而事件提供了一种处理和响应通知的标准方式。理解并使用委托和事件是构建响应式模块化\
    \ C# 应用程序的关键技能。\n\n# 14. Lambda 和 LINQ\n\nLambdas 和 LINQ（语言集成查询）是 C# 中强大的特性，它们增强了代码的简洁性并方便了数据的查询和操作。\n\
    \n### Lambdas\n\nLambdas 是简洁的匿名函数，允许你为短生命周期的操作编写内联代码，对于委托类型特别有用。\n\n#### Lambda\
    \ 表达式语法\n\n```csharp\n// Lambda expression syntax\nFunc<int, int, int> add = (a,\
    \ b) => a + b;\nConsole.WriteLine(add(3, 5)); // Output: 8\n```\n\n#### Lambda\
    \ 语句\n\n```csharp\n// Lambda with statements\nFunc<int, int> square = x =>\n{\n\
    \    int result = x * x;\n    return result;\n};\nConsole.WriteLine(square(4));\
    \ // Output: 16\n```\n\n#### 在 LINQ 中使用 Lambda\n\n```csharp\n// Using Lambdas\
    \ with LINQ\nList<int> numbers = new List<int> { 1, 2, 3, 4, 5 };\nvar squaredNumbers\
    \ = numbers.Select(x => x * x);\n```\n\n### LINQ (语言集成查询)\n\nLINQ 提供了一种声明性语法，用于从各种来源（如集合、数据库、XML\
    \ 等）查询和操作数据。\n\n#### LINQ 查询语法\n\n```csharp\n// LINQ query syntax\nvar evenNumbers\
    \ = from number in numbers\n                  where number % 2 == 0\n        \
    \          select number;\n```\n\n#### LINQ 方法语法\n\n```csharp\n// LINQ method\
    \ syntax\nvar oddNumbers = numbers.Where(x => x % 2 != 0);\n```\n\n#### LINQ 中的投影\n\
    \n```csharp\n// Projection in LINQ\nvar squaredAndFiltered = numbers\n    .Select(x\
    \ => x * x)\n    .Where(x => x > 10);\n```\n\n#### LINQ 中的连接\n\n```csharp\n//\
    \ Joining in LINQ\nvar persons = new List<Person> { /* ... */ };\nvar orders =\
    \ new List<Order> { /* ... */ };\nvar query = from person in persons\n       \
    \       join order in orders on person.Id equals order.PersonId\n            \
    \  select new { person.Name, order.ProductName };\n```\n\n#### 结合 Lambda 表达式的\
    \ LINQ\n\n```csharp\n// LINQ with lambda expressions\nvar products = new List<Product>\
    \ { /* ... */ };\nvar expensiveProducts = products.Where(p => p.Price > 1000);\n\
    ```\n\nLambda 和 LINQ 为 C# 带来了表现力且简洁的语法，使代码更具可读性和维护性。Lambda 允许创建内联函数，而 LINQ 则简化了查询和转换。\n\
    \n# 15. 类型系统\n\n委托和事件在实现 C# 事件驱动编程中起着至关重要的作用。委托允许你创建灵活且可扩展的回调机制，而事件提供了一种处理和响应通知的标准方式。理解并使用委托和事件是构建响应式模块化\
    \ C# 应用程序的关键技能。\n\n### 值类型与 引用类型\n\n值类型：值类型直接包含数据并存储在栈上。\n引用类型：引用类型存储数据的引用，位于堆上。\n\
    \n### 隐式和显式类型转换\n\n隐式转换：隐式转换自动将一种类型转换为另一种。\n显式转换需要手动强制转换。\n\n### 可空值类型\n\n可空类型表示值的缺失。\n\
    \n### 类型推断 (var 和 dynamic)\n\n`var` 关键字：编译器推断变量的类型。\n`dynamic` 关键字：将类型确定推到运行时。\n\
    \n### 类型系统中的泛型\n\n泛型引入了一种创建灵活可重用代码的方法。\n\n### 装箱与拆箱\n\n装箱涉及将值类型转换为引用类型，拆箱是反向操作。\n\
    \n### 类型别名 (using 指令)\n\n类型别名允许为类型创建更短的名称，提高代码的可读性。\n\n理解 C# 类型系统对于编写高效且无错误的代码至关重要。无论是处理值类型、引用类型、泛型还是类型转换，牢固掌握这些概念都能让开发者设计出稳健灵活的应用程序。\n\
    \n# 16. 字符串与正则表达式\n\n处理字符串和正则表达式是 C# 编程中常见且重要的方面。字符串操作和模式匹配是各种应用程序中频繁使用的任务。\n\n\
    ### 处理字符串\n\n#### 字符串声明与初始化\n\n```csharp\n// String declaration and initialization\n\
    string greeting = \"Hello, C#!\";\n```\n\n#### 字符串拼接\n\n```csharp\n// String concatenation\n\
    string firstName = \"John\";\nstring lastName = \"Doe\";\nstring fullName = firstName\
    \ + \" \" + lastName;\n```\n\n#### 字符串插值\n\n```csharp\n// String interpolation\n\
    string interpolatedGreeting = $\"Welcome, {firstName}!\";\n```\n\n#### 常用字符串方法\n\
    \n```csharp\n// Common string methods\nstring text = \"  C# Programming  \";\n\
    string trimmedText = text.Trim();\nstring upperCaseText = text.ToUpper();\nstring\
    \ lowerCaseText = text.ToLower();\n```\n\n#### 字符串比较\n\n```csharp\n// String comparison\n\
    string apple = \"apple\";\nstring orange = \"orange\";\nbool areEqual = String.Equals(apple,\
    \ orange, StringComparison.OrdinalIgnoreCase);\n```\n\n### 正则表达式\n\n#### 正则表达式基础\n\
    \n```csharp\n// Regular expression basics\nusing System.Text.RegularExpressions;\n\
    string input = \"C# is powerful!\";\nstring pattern = @\"\\bC#\\b\";\nbool isMatch\
    \ = Regex.IsMatch(input, pattern);\n```\n\n#### 正则表达式匹配\n\n```csharp\n// Regular\
    \ expression matching\nstring input = \"123-456-7890\";\nstring pattern = @\"\\\
    d{3}-\\d{3}-\\d{4}\";\nbool isPhoneNumber = Regex.IsMatch(input, pattern);\n```\n\
    \n"
- fmt: "\n```c\n// Regular expression replacement\nstring input = \"C# is awesome!\"\
    ;\nstring pattern = @\"C#\";\nstring replacement = \"CSharp\";\nstring result\
    \ = Regex.Replace(input, pattern, replacement);\n```\n\n## Regular Expression\
    \ Groups\n\n```c\n// Regular expression groups\nstring input = \"Name: John, Age:\
    \ 30\";\nstring pattern = @\"Name: (?<Name>\\w+), Age: (?<Age>\\d+)\";\nMatch\
    \ match = Regex.Match(input, pattern);\nstring name = match.Groups[\"Name\"].Value;\n\
    string age = match.Groups[\"Age\"].Value;\n```\n\nWorking with strings and regular\
    \ expressions is an integral part of C# development. Whether manipulating strings,\
    \ performing pattern matching, or utilizing regular expressions for complex text\
    \ processing, mastering these concepts enhances your ability to handle and process\
    \ textual data effectively in C#.\n\n# 17. File I/O and Serialization\n\nFile\
    \ I/O (Input/Output) and Serialization are essential aspects of C# programming\
    \ that involve reading from and writing to files, as well as converting objects\
    \ into a format suitable for storage or transmission.\n\n## File I/O\n\n### Reading\
    \ Text from a File\n```c\n// Reading text from a file\nstring filePath = \"example.txt\"\
    ;\nstring content = File.ReadAllText(filePath);\n```\n\n### Writing Text to a\
    \ File\n```c\n// Writing text to a file\nstring filePath = \"example.txt\";\n\
    string content = \"Hello, File I/O!\";\nFile.WriteAllText(filePath, content);\n\
    ```\n\n### Reading Lines from a File\n```c\n// Reading lines from a file\nstring\
    \ filePath = \"example.txt\";\nstring[] lines = File.ReadAllLines(filePath);\n\
    ```\n\n### Writing Lines to a File\n```c\n// Writing lines to a file\nstring filePath\
    \ = \"example.txt\";\nstring[] lines = { \"Line 1\", \"Line 2\", \"Line 3\" };\n\
    File.WriteAllLines(filePath, lines);\n```\n\n### Checking if a File Exists\n```c\n\
    // Checking if a file exists\nstring filePath = \"example.txt\";\nbool fileExists\
    \ = File.Exists(filePath);\n```\n\n### Deleting a File\n```c\n// Deleting a file\n\
    string filePath = \"example.txt\";\nFile.Delete(filePath);\n```\n\n## Serialization\n\
    \nSerialization is the process of converting an object or data structure into\
    \ a format that can be easily stored or transmitted.\n\n### Binary Serialization\n\
    ```c\n// Binary serialization\nusing System.Runtime.Serialization.Formatters.Binary;\n\
    [Serializable]\npublic class Person\n{\n    public string Name { get; set; }\n\
    \    public int Age { get; set; }\n}\nPerson person = new Person { Name = \"John\"\
    , Age = 30 };\nBinaryFormatter binaryFormatter = new BinaryFormatter();\nusing\
    \ (FileStream stream = new FileStream(\"person.bin\", FileMode.Create))\n{\n \
    \   binaryFormatter.Serialize(stream, person);\n}\n```\n\n### Binary Deserialization\n\
    ```c\n// Binary deserialization\nusing System.Runtime.Serialization.Formatters.Binary;\n\
    BinaryFormatter binaryFormatter = new BinaryFormatter();\nusing (FileStream stream\
    \ = new FileStream(\"person.bin\", FileMode.Open))\n{\n    Person deserializedPerson\
    \ = (Person)binaryFormatter.Deserialize(stream);\n    Console.WriteLine($\"Name:\
    \ {deserializedPerson.Name}, Age: {deserializedPerson.Age}\");\n}\n```\n\n###\
    \ JSON Serialization\n```c\n// JSON serialization\nusing System.Text.Json;\nPerson\
    \ person = new Person { Name = \"Alice\", Age = 25 };\nstring jsonString = JsonSerializer.Serialize(person);\n\
    File.WriteAllText(\"person.json\", jsonString);\n```\n\nFile I/O and Serialization\
    \ are crucial for interacting with external storage and exchanging data between\
    \ applications. Whether reading from or writing to files, or serializing and deserializing\
    \ objects, these techniques enable effective data handling in C# applications.\n\
    \n# 18. C# Multithreading and Parallel Programming\n\nMultithreading and parallel\
    \ programming in C# allow you to execute multiple threads simultaneously, enhancing\
    \ the performance and responsiveness of your applications. These concepts are\
    \ crucial for efficient utilization of modern hardware with multiple cores.\n\n\
    ## Multithreading Basics\n\n### Creating Threads\n```c\n// Creating threads\n\
    using System.Threading;\nvoid MyThreadFunction()\n{\n    // Thread logic\n}\n\
    Thread myThread = new Thread(MyThreadFunction);\nmyThread.Start();\n```\n\n###\
    \ Thread Synchronization\n```c\n// Thread synchronization\nlock (lockObject)\n\
    {\n    // Code protected by the lock\n}\n```\n\n### Thread Sleep\n```c\n// Thread\
    \ sleep\nThread.Sleep(1000); // Sleep for 1 second\n```\n\n## Asynchronous Programming\
    \ with async and await\n\n### Async Method\n```c\n// Async method\nasync Task\
    \ MyAsyncMethod()\n{\n    // Asynchronous logic\n}\n```\n\n### Await Operator\n\
    ```c\n// Await operator\nawait MyAsyncMethod();\n```\n\n### Task Parallel Library\
    \ (TPL)\n```c\n// Task Parallel Library\nusing System.Threading.Tasks;\nList<Task>\
    \ tasks = new List<Task>();\ntasks.Add(Task.Run(() => MyMethod1()));\ntasks.Add(Task.Run(()\
    \ => MyMethod2()));\nawait Task.WhenAll(tasks);\n```\n\n## Parallel Programming\n\
    \n### Parallel For Loop\n```c\n// Parallel For loop\nParallel.For(0, 10, i =>\n\
    {\n    // Parallelized loop body\n});\n```\n\n### Parallel ForEach Loop\n```c\n\
    // Parallel ForEach loop\nList<int> numbers = new List<int> { /* ... */ };\nParallel.ForEach(numbers,\
    \ number =>\n{\n    // Parallelized loop body\n});\n```\n\n### PLINQ (Parallel\
    \ LINQ)\n```c\n// PLINQ\nList<int> numbers = new List<int> { /* ... */ };\nvar\
    \ result = numbers.AsParallel().Where(n => n == 0).ToArray();\n```\n\n# 19. Asynchronous\
    \ Programming with async/await\n\nynchronous programming with async and await\
    \ in C# allows you to write responsive and efficient code, particularly useful\
    \ for tasks that involve I/O.\n\n### Async Method\n```csharp\n// Async method\n\
    async Task MyAsyncMethod()\n{\n    // Asynchronous logic\n}\n```\n\n### Await\
    \ Operator\n```csharp\n// Await operator\nawait MyAsyncMethod();\n```\n\n### Await\
    \ and Task Continuation\n```csharp\n// Using await and task continuation\nasync\
    \ Task<int> MyAsyncMethod()\n{\n    int result = await SomeOperation();\n    //\
    \ Continue with logic\n    return result;\n}\n```\n\n### Error Handling in async\
    \ Methods\n```csharp\n// try/catch in async methods\nasync Task<int> MyAsyncMethod()\n\
    {\n    try\n    {\n        int result = await SomeOperation();\n        return\
    \ result;\n    }\n    catch (Exception ex)\n    {\n        // Handle exception\n\
    \        return -1;\n    }\n}\n```\n\n### Asynchronous Streams (C# 8 and later)\n\
    ```csharp\n// Asynchronous streams\nasync IAsyncEnumerable<int> GenerateNumbersAsync()\n\
    {\n    for (int i = 0; i < 10; i++)\n    {\n        await Task.Delay(100); //\
    \ Simulating asynchronous operation\n        yield return i;\n    }\n}\n```\n\n\
