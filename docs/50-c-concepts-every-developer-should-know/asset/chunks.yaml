    }


    Array vs. List


    Arrays: Fixed size, less flexibility, direct access by index.


    Lists: Dynamic size, more functionality, slower access by index.


    LINQ with Lists


    LINQ (Language Integrated Query) provides powerful querying capabilities for collections.


    // LINQ with Lists


    var result = names.Where(n => n.Length > 4).ToList();


    Arrays and lists are crucial for managing collections of data in C#. Arrays provide
    a fixed-size, low-level structure, while lists offer dynamic sizing and additional
    features. Knowing when to use each depends on your specific requirements. As you
    work with these structures, you''ll find them indispensable for various scenarios
    in C# programming.


    # 11\. C# Dictionaries and HashSets


    Dictionaries and HashSets are important data structures in C# that allow efficient
    storage and retrieval of data. They provide different functionalities and are
    suitable for different use cases.


    Dictionaries


    Dictionaries in C# are collections that store key-value pairs, providing fast
    access to values based on their associated keys.


    Declaration and Initialization


    // Declaration and Initialization


    Dictionary<string, int> ages = new Dictionary<string, int>()


    {


        {"Alice", 25},


        {"Bob", 30},


        {"Charlie", 22}


    };


    Adding and Accessing Elements


    // Adding and Accessing Elements


    ages["David"] = 28; // Add a new key-value pair


    int bobAge = ages["Bob"]; // Access the value using the key


    Iterating Through Dictionaries


    // Iterating Through Dictionaries


    foreach (var pair in ages)


    {


        Console.WriteLine($"{pair.Key}: {pair.Value}");


    }


    Checking for Key Existence


    // Checking for Key Existence


    bool hasAlice = ages.ContainsKey("Alice"); // true


    bool hasEve = ages.ContainsKey("Eve"); // false


    HashSets


    HashSets in C# are collections that store unique elements without any specific
    order. They are based on hash codes, providing fast membership tests.


    Declaration and Initialization


    // Declaration and Initialization


    HashSet<int> uniqueNumbers = new HashSet<int>() { 1, 2, 3, 4, 5 };


    Adding and Removing Elements


    // Adding and Removing Elements


    uniqueNumbers.Add(6); // Add a new element


    uniqueNumbers.Remove(3); // Remove an element


    Checking for Element Existence


    // Checking for Element Existence


    bool hasThree = uniqueNumbers.Contains(3); // false


    bool hasFive = uniqueNumbers.Contains(5); // true


    Set Operations


    // Set Operations


    HashSet<int> otherNumbers = new HashSet<int>() { 4, 5, 6, 7, 8 };


    // Union


    HashSet<int> unionSet = new HashSet<int>(uniqueNumbers);


    unionSet.UnionWith(otherNumbers); // {1, 2, 3, 4, 5, 6, 7, 8}


    // Intersection


    HashSet<int> intersectionSet = new HashSet<int>(uniqueNumbers);


    intersectionSet.IntersectWith(otherNumbers); // {4, 5}


    // Difference


    HashSet<int> differenceSet = new HashSet<int>(uniqueNumbers);


    differenceSet.ExceptWith(otherNumbers); // {1, 2, 3}


    Dictionaries and HashSets provide efficient ways to manage and query data in C#.
    Dictionaries are suitable for key-value pairs with fast access based on keys,
    while HashSets are ideal for maintaining unique elements and performing set operations.
    Choosing the right data structure depends on the specific requirements of your
    application. As you work with these structures, you''ll enhance your ability to
    store and manipulate data effectively in C#.


    # 12\. Generics


    Generics in C# provide a powerful mechanism for creating classes, interfaces,
    and methods that work with any data type while maintaining type safety. They enable
    you to write flexible and reusable code by parameterizing types.


    Introduction to Generics


    Generics allow you to write classes and methods that operate on a type specified
    by the developer at compile time. This enables the creation of flexible and type-safe
    components.


    Generic Class


    // Generic class


    public class Box<T>


    {


        private T _value;


        public Box(T value)


        {


            _value = value;


        }


        public T GetValue()


        {


            return _value;


        }


    }


    Using Generic Class: Generics can also be applied to methods, allowing them to
    work with multiple data types.


    Generic Method


    // Generic method


    public T Maximum<T>(T a, T b) where T : IComparable<T>


    {


        return a.CompareTo(b) > 0 ? a : b;


    }


    Using Generic Method


    // Using Generic Method


    int maxInt = Maximum(5, 10); // Returns 10


    string maxString = Maximum("apple", "orange"); // Returns "orange"


    Constraints on Generics


    Constraints can be applied to generics to restrict the types that can be used
    as arguments. Common constraints include implementing interfaces or having a parameterless
    constructor.


    public class Example<T> where T : IComparable<T>


    {


        // Class implementation


    }


    Covariance and Contravariance


    Generics in C# support covariance and contravariance, enabling more flexible relationships
    between types.


    Covariance


    // Covariant interface


    public interface ICovariant<out T>


    {


        T GetItem();


    }


    Nullable Value Types with Generics


    // Nullable value types with generics


    public class Nullable<T> where T : struct


    {


        private T? _value;


        public Nullable(T? value)


        {


            _value = value;


        }


        public T? GetValue()


        {


            return _value;


        }


    }


    Generics in C# enhance code reusability and maintainability by providing a mechanism
    for creating flexible and type-safe components. Whether working with generic classes,
    methods, or interfaces, understanding generics is crucial for building efficient
    and adaptable software solutions in C#.


    # 13\. Delegates and Events


    Delegates and events are essential concepts in C# that facilitate the implementation
    of event-driven programming. They provide a way to handle and respond to events
    in a decoupled and extensible manner.


    Delegates


    A delegate in C# is a type that represents a method signature, allowing you to
    treat methods as first-class objects. Delegates are often used to implement callbacks
    and event handling.


    Delegate Declaration


    // Delegate declaration


    public delegate void MyDelegate(string message);


    Using Delegates


    // Using delegates


    public class MessageProcessor


    {


        public void ProcessMessage(string message)


        {


            Console.WriteLine($"Processing message: {message}");


        }


    }


    MessageProcessor processor = new MessageProcessor();


    MyDelegate delegateInstance = processor.ProcessMessage;


    delegateInstance("Hello, Delegate!"); // Invoking the delegate


    Multicast Delegates


    // Multicast delegates


    public class Calculator


    {


        public void Add(int a, int b)


        {


            Console.WriteLine($"Sum: {a + b}");


        }


        public void Multiply(int a, int b)


        {


            Console.WriteLine($"Product: {a * b}");


        }


    }


    Calculator calculator = new Calculator();


    MyDelegate addDelegate = calculator.Add;


    MyDelegate multiplyDelegate = calculator.Multiply;


    MyDelegate multicastDelegate = addDelegate + multiplyDelegate;


    multicastDelegate(3, 4); // Invoking both methods


