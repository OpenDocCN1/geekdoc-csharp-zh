    \ matrix = new int[3, 3]\n{\n    {1, 2, 3},\n    {4, 5, 6},\n    {7, 8, 9}\n};\n\
    ```\n\n## 列表\n\n### 声明与初始化\n列表提供了具有额外功能的动态数组。\n\n### 声明与初始化\n```csharp\nList<string>\
    \ names = new List<string>() { \"Alice\", \"Bob\", \"Charlie\" };\n```\n\n###\
    \ 添加和删除元素\n\n### 添加和删除元素\n```csharp\nnames.Add(\"David\"); // 添加一个元素\nnames.Remove(\"\
    Bob\"); // 按值删除元素\nnames.RemoveAt(0); // 按索引删除元素\n```\n\n### 访问元素\n\n### 访问元素\n\
    ```csharp\nstring firstElement = names[0]; // 访问第一个元素 (索引 0)\n```\n\n### 遍历列表\n\
    \n### 遍历列表\n```csharp\nforeach (string name in names)\n{\n    Console.WriteLine(name);\n\
    }\n```\n\n## 数组 vs. 列表\n\n- **数组**：固定大小，灵活性较低，通过索引直接访问。\n- **列表**：动态大小，功能更多，通过索引访问较慢。\n\
    \n## 结合列表的 LINQ\n\n### 结合列表的 LINQ\nLINQ（语言集成查询）为集合提供了强大的查询能力。\n\n### 结合列表的 LINQ\n\
    ```csharp\nvar result = names.Where(n => n.Length > 4).ToList();\n```\n\n数组和列表对于管理\
    \ C# 中的数据至关重要。数组提供了固定大小的低级结构，而列表提供了动态大小调整和额外功能。何时使用每种结构取决于你的具体需求。在你处理这些结构时，你会发现它们在\
    \ C# 编程的各种场景中不可不可缺的。\n\n# 11. C# 字典和 HashSet\n\n字典和 HashSet 是 C# 中重要的数据结构，允许高效地存储和检索数据。它们提供了不同的功能并适用于不同的用场景。\n\
    \n## 字典\n\nC# 中的字典是存储键值对的集合，允许根据关联的键快速访问值。\n\n### 声明与初始化\n\n### 声明与初始化\n```csharp\n\
    Dictionary<string, int> ages = new Dictionary<string, int>()\n{\n    {\"Alice\"\
    , 25},\n    {\"Bob\", 30},\n    {\"Charlie\", 22}\n};\n```\n\n### 添加和访问元素\n\n\
    ### 添加和访问元素\n```csharp\nages[\"David\"] = 28; // 添加一个新的键值对\nint bobAge = ages[\"\
    Bob\"]; // 使用键访问值\n```\n\n### 遍历字典\n\n### 遍历字典\n```csharp\nforeach (var pair in\
    \ ages)\n{\n    Console.WriteLine($\"{pair.Key}: {pair.Value}\");\n}\n```\n\n\
    ### 检查键是否存在\n\n### 检查键是否存在\n```csharp\nbool hasAlice = ages.ContainsKey(\"Alice\"\
    ); // true\nbool hasEve = ages.ContainsKey(\"Eve\"); // false\n```\n\n## HashSet\n\
    \nC# 中的 HashSet 是存储唯一元素且无任何特定顺序的集合。它们基于哈希码，提供了快速的成员身份测试。\n\n### 声明与初始化\n\n###\
    \ 声明与初始化\n```csharp\nHashSet<int> uniqueNumbers = new HashSet<int>() { 1, 2, 3,\
    \ 4, 5 };\n```\n\n### 添加和删除元素\n\n### 添加和删除元素\n```csharp\nuniqueNumbers.Add(6);\
    \ // 添加一个新元素\nuniqueNumbers.Remove(3); // 删除一个元素\n```\n\n### 检查元素是否存在\n\n### 检查元素是否存在\n\
    ```csharp\nbool hasThree = uniqueNumbers.Contains(3); // false\nbool hasFive =\
    \ uniqueNumbers.Contains(5); // true\n```\n\n### 集操作\n\n### 集操作\n```csharp\nHashSet<int>\
    \ otherNumbers = new HashSet<int>() { 4, 5, 6, 7, 8 };\n\n// 并集\nHashSet<int>\
    \ unionSet = new HashSet<int>(uniqueNumbers);\nunionSet.UnionWith(otherNumbers);\
    \ // {1, 2, 3, 4, 5, 6, 7, 8}\n\n// 交集\nHashSet<int> intersectionSet = new HashSet<int>(uniqueNumbers);\n\
    intersectionSet.IntersectWith(otherNumbers); // {4, 5}\n\n// 差集\nHashSet<int>\
    \ differenceSet = new HashSet<int>(uniqueNumbers);\ndifferenceSet.ExceptWith(otherNumbers);\
    \ // {1, 2, 3}\n```\n\n字典和 HashSet 为 C# 提供了高效管理和查询数据的方法。字典适用于根据键快速访问的键值对，而 HashSet\
    \ 则是维护唯一元素和执行集操作的理想选择。选择正确的数据结构取决于你应用程序的具体需求。在你处理这些结构时，你将增强在 C# 中有效存储和操作数据的能力。\n\
    \n# 12. 泛型\n\nC# 中的泛型为创建类、接口和方法提供了一种强大的机制，使其能够在保持类型安全的同时与任何数据类型协同工作。它们允许你编写灵活且可重用的代码。\n\
    \n### 泛型简介\n泛型提供了一种机制，用于创建与任何数据类型协同工作的同时保持类型安全的类、接口和方法。它们允许你编写灵活且可重用的代码。\n\n###\
    \ 泛型类\n### 泛型类\n```csharp\npublic class Box<T>\n{\n    private T _value;\n   \
    \ public Box(T value)\n    {\n        _value = value;\n    }\n\n    public T GetValue()\n\
    \    {\n        return _value;\n    }\n}\n```\n\n### 使用泛型\n约束可以应用于泛型，以限制可以使用的类型。\n\
    \n### 泛型方法\n```csharp\npublic T Maximum<T>(T a, T b) where T : IComparable<T>\n\
    {\n    return a.CompareTo(b) > 0 ? a : b;\n}\n```\n\n### 协变与逆变\n泛型支持协变和逆变，能够建立类型之间的灵活关系。\n\
    \n### 协变\n```csharp\npublic interface ICariant<out T>\n{\n    T GetItem();\n}\n\
    ```\n\n### 泛型可空值类型\n泛型可空值类型\n```csharp\npublic class Nullable<T> where T : struct\n\
    {\n    private T _value;\n    public Nullable(T value)\n    {\n        _value\
    \ = value;\n    }\n\n    public T GetValue()\n    {\n        return _value;\n\
    \    }\n}\n```\n\nC# 中的泛型通过提供创建灵活且类型安全的机制提高了代码的可用性和维护性。无论是处理泛型类、方法还是接口，理解泛型对于构建高效适应的软件至关重要。\n\
    \n# 13. 委托和事件\n\n委托和事件是 C# 中的基本概念，促进了事件驱动编程的实现。它们提供了一种解耦且扩展的方式来处理和响应事件。\n\n##\
    \ 委托\n\nC# 中的委托是一种方法签的类型，允许将方法作为对象对待。委托通常用于实现回调和事件处理。\n\n### 委托声明\n\n### 委托声明\n\
    ```csharp\ndelegate void MyDelegate(string message);\n```\n\n### 使用委托\n\n### 使用委托\n\
    ```csharp\npublic class MessageProcessor\n{\n    public void ProcessMessage(string\
    \ message)\n    {\n        Console.WriteLine($\"Processing message: {message}\"\
    );\n    }\n}\n```\nMessageProcessor processor = new MessageProcessor();\nMyDelegate\
    \ delegateInstance = processor.ProcessMessage;\ndelegateInstance(\"Hello, Delegate!\"\
    ); // 运行委托\n\n### 多播委托\n\n### 多播委托\n```csharp\npublic class Calculator\n{\n  \
    \  public void Add(int a, int b)\n    {\n        Console.WriteLine($\"Sum: {a\
    \ + b}\");\n    }\n    public void Multiply(int a, int b)\n    {\n        Console.WriteLine($\"\
    Product: {a * b}\");\n    }\n}\n```\nCalculator calculator = new Calculator();\n\
    MyDelegate addDelegate = calculator.Add;\nMyDelegate multiplyDelegate = calculator.Multiply;\n\
    MyDelegate multicastDelegate = addDelegate + multiplyDelegate;\n\nmulticastDelegate(3,\
    \ 4); // 调用两个方法\n\n## 事件\n\n"
- fmt: "\nEvents provide a way for a class to notify other classes or objects when\
    \ something of interest happens. They are based on delegates and follow the publisher-subscriber\
    \ pattern.\n\n### Event Declaration\n\n```csharp\n// Event declaration\n\npublic\
    \ class EventPublisher\n{\n    public event MyDelegate MyEvent;\n}\n```\n\n###\
    \ Subscribing to Events\n\n```csharp\n// Subscribing to events\npublic class EventSubscriber\n\
    {\n    public void Subscribe(EventPublisher publisher)\n    {\n        publisher.MyEvent\
    \ += HandleEvent;\n    }\n    public void HandleEvent(string message)\n    {\n\
    \        Console.WriteLine($\"Event handled: {message}\");\n    }\n}\n```\n\n\
    ### Publishing Events\n\n```csharp\n// Publishing events\nEventPublisher publisher\
    \ = new EventPublisher();\nEventSubscriber subscriber = new EventSubscriber();\n\
    subscriber.Subscribe(publisher);\npublisher.MyEvent?.Invoke(\"Event message\"\
    ); // Raising the event\n```\n\n### Event Handlers and EventArgs\n\n```csharp\n\
    // Event handlers and EventArgs\npublic class CustomEventArgs : EventArgs\n{\n\
    \    public string EventMessage { get; }\n    public CustomEventArgs(string message)\n\
    \    {\n        EventMessage = message;\n    }\n}\n\npublic class EventPublisher\n\
    {\n    public event EventHandler<CustomEventArgs> MyEvent;\n    public void RaiseEvent(string\
    \ message)\n    {\n        OnMyEvent(new CustomEventArgs(message));\n    }\n \
    \   protected virtual void OnMyEvent(CustomEventArgs e)\n    {\n        MyEvent?.Invoke(this,\
    \ e);\n    }\n}\n```\n\nDelegates and events play a crucial role in implementing\
    \ event-driven programming in C#. Delegates allow you to create flexible and extensible\
    \ callback mechanisms, while events provide a standardized way to handle and respond\
    \ to notifications. Understanding and using delegates and events are key skills\
    \ for building responsive and modular applications in C#.\n\n# 14. Lambdas and\
    \ LINQ\n\nLambdas and LINQ (Language Integrated Query) are powerful features in\
    \ C# that enhance code conciseness and facilitate data querying and manipulation.\n\
    \n### Lambdas\n\nLambdas are concise, anonymous functions that allow you to write\
    \ inline code for short-lived operations, especially useful for delegate types.\n\
    \n#### Lambda Expression Syntax\n\n```csharp\n// Lambda expression syntax\nFunc<int,\
    \ int, int> add = (a, b) => a + b;\nConsole.WriteLine(add(3, 5)); // Output: 8\n\
    ```\n\n#### Lambda Statements\n\n```csharp\n// Lambda with statements\nFunc<int,\
    \ int> square = x =>\n{\n    int result = x * x;\n    return result;\n};\nConsole.WriteLine(square(4));\
    \ // Output: 16\n```\n\n#### Using Lambdas with LINQ\n\n```csharp\n// Using Lambdas\
    \ with LINQ\nList<int> numbers = new List<int> { 1, 2, 3, 4, 5 };\nvar squaredNumbers\
    \ = numbers.Select(x => x * x);\n```\n\n### LINQ (Language Integrated Query)\n\
    \nLINQ provides a declarative syntax for querying and manipulating data from various\
    \ sources, such as collections, databases, XML, and more.\n\n#### LINQ Query Syntax\n\
    \n```csharp\n// LINQ query syntax\nvar evenNumbers = from number in numbers\n\
    \                  where number % 2 == 0\n                  select number;\n```\n\
    \n#### LINQ Method Syntax\n\n```csharp\n// LINQ method syntax\nvar oddNumbers\
    \ = numbers.Where(x => x % 2 != 0);\n```\n\n#### Projection in LINQ\n\n```csharp\n\
    // Projection in LINQ\nvar squaredAndFiltered = numbers\n    .Select(x => x *\
    \ x)\n    .Where(x => x > 10);\n```\n\n#### Joining in LINQ\n\n```csharp\n// Joining\
    \ in LINQ\nvar persons = new List<Person> { /* ... */ };\nvar orders = new List<Order>\
    \ { /* ... */ };\nvar query = from person in persons\n              join order\
    \ in orders on person.Id equals order.PersonId\n              select new { person.Name,\
    \ order.ProductName };\n```\n\n#### LINQ with Lambda Expressions\n\n```csharp\n\
    // LINQ with lambda expressions\nvar products = new List<Product> { /* ... */\
    \ };\nvar expensiveProducts = products.Where(p => p.Price > 1000);\n```\n\nLambdas\
    \ and LINQ bring expressive and concise syntax to C#, making code more readable\
    \ and maintainable. Lambdas enable the creation of inline functions, while LINQ\
    \ simplifies the querying and transformation.\n\n# 15. The Type System\n\nDelegates\
    \ and events play a crucial role in implementing event-driven programming in C#.\
    \ Delegates allow you to create flexible and extensible callback mechanisms, while\
    \ events provide a standardized way to handle and respond to notifications. Understanding\
    \ and using delegates and events are key skills for building responsive and modular\
    \ applications in C#.\n\n### Value Types vs. Reference Types\n\nValue Types: Value\
    \ types directly contain data and are stored on the stack.\nReference Types: Reference\
    \ types store references to data, located on the heap.\n\n### Implicit and Explicit\
    \ Type Conversion\n\nImplicit Conversion: Implicit conversion automatically converts\
    \ one type to another.\nExplicit Conversion requires manual casting.\n\n### Nullable\
    \ Value Types\n\nNullable types represent the absence of a value.\n\n### Type\
    \ Inference (var and dynamic)\n\n`var` Keyword: The compiler infers the type of\
    \ a variable.\n`dynamic` Keyword: delays type determination until runtime.\n\n\
    ### Generics in the Type System\n\nGenerics introduce a way to create flexible\
    \ and reusable code.\n\n### Boxing and Unboxing\n\nBoxing involves converting\
    \ a value type to a reference type, and unboxing is the reverse operation.\n\n\
    ### Type Aliases (using Directive)\n\nType aliases allow creating shorter names\
    \ for types, improving code readability.\n\nUnderstanding the C# type system is\
    \ crucial for writing efficient and error-free code. Whether dealing with value\
    \ types, reference types, generics, or type conversion, a solid grasp of these\
    \ concepts enables developers to design robust and flexible applications.\n\n\
    # 16. Working with Strings and Regular Expressions\n\nWorking with strings and\
    \ regular expressions is a common and essential aspect of C# programming. String\
    \ manipulation and pattern matching are frequently used tasks in various applications.\n\
    \n### Working with Strings\n\n#### String Declaration and Initialization\n\n```csharp\n\
    // String declaration and initialization\nstring greeting = \"Hello, C#!\";\n\
    ```\n\n#### String Concatenation\n\n```csharp\n// String concatenation\nstring\
