    \ XAML 提供丰富的样式和主题能力。\n\n### 布局系统\n*   **WinForms**：使用基于控件的布局系统。\n*   **WPF**：采用更先进布局系统，支持数据绑定和控件模板等功能。\n\
    \n### 图形与动画\n*   **WinForms**：具有基础图形能力。\n*   **WPF**：支持高级图形和动画处理。\n\n"
- fmt: "\n* `WinForms`: Limited data binding.\n* `WPF`: Robust data binding capabilities.\n\
    \nBoth Windows Forms and WPF offer ways to create desktop applications in `C#,\
    \ but they differ in terms of UI design, styling, and capabilities. Windows Forms\
    \ is simpler and well-suited for quick development, while WPF provides a more\
    \ modern and feature-rich approach for creating sophisticated user interfaces.\
    \ The choice between `WinForms` and `WPF` depends on the specific requirements\
    \ and complexity of the application you are developing.\n\n# 35. Creating Web\
    \ Applications with ASP.NET\n\nASP.NET is a web framework developed by Microsoft\
    \ for building dynamic web applications. It supports a variety of programming\
    \ languages, including `C#`. This guide provides an overview of creating web applications\
    \ with ASP.NET using the Model-View-Controller (`MVC`) pattern.\n\n## Introduction\
    \ to ASP.NET MVC\n\n### MVC Architecture\n\n* `Model`: Represents the application's\
    \ data and business logic.\n* `View`: Displays the user interface and presents\
    \ data to users.\n* `Controller`: Handles user input, processes requests, and\
    \ manages the flow of data between the model and view.\n\n### Creating a Simple\
    \ ASP.NET MVC Application\n\nCreate a new ASP.NET `MVC` project:\n\n1. Open `Visual\
    \ Studio`.\n2. Select \"Create a new project.\"\n3. Choose \"ASP.NET Web Application\"\
    \ and select \"MVC.\"\n\nUnderstand the project structure:\n\n* `Models`: Contains\
    \ classes representing data and business logic.\n* `Views`: Contains the user\
    \ interface components.\n* `Controllers`: Contains classes handling user input\
    \ and requests.\n\nAdd a controller:\n\n1. Right-click on the `Controllers` folder.\n\
    2. Select \"Add\" -> \"Controller.\"\n3. Choose \"MVC 5 `Controller` - Empty\"\
    \ and name it, e.g., `HomeController`.\n4. Implement actions (methods) for handling\
    \ requests.\n\n```csharp\npublic class HomeController : Controller\n{\n    public\
    \ ActionResult Index()\n    {\n        return View();\n    }\n}\n```\n\nAdd a\
    \ view:\n\n* Right-click on the `Views` folder within the `Home` folder.\n* Select\
    \ \"Add\" -> \"View.\"\n* Name it, e.g., `Index.cshtml`.\n* Write HTML and use\
    \ Razor syntax to display dynamic data.\n\n```html\n<h2>Welcome to ASP.NET MVC!</h2>\n\
    ```\n\nConfigure routing:\n\n* Open the `RouteConfig.cs` file in the `App_Start`\
    \ folder.\n* Define routes to map URLs to controllers and actions.\n\n```csharp\n\
    public class RouteConfig\n{\n    public static void RegisterRoutes(RouteCollection\
    \ routes)\n    {\n        routes.IgnoreRoute(\"{resource}.axd/{*pathInfo}\");\n\
    \        routes.MapRoute(\n            name: \"Default\",\n            url: \"\
    {controller}/{action}/{id}\",\n            defaults: new { controller = \"Home\"\
    , action = \"Index\", id = UrlParameter.Optional }\n        );\n    }\n}\n```\n\
    \nRun the application:\n\n* Press `F5` or use the \"Start\" button to run the\
    \ application.\n* Access the application in a web browser, e.g., `http://localhost:port/`.\n\
    \n## ASP.NET Core and Razor Pages\n\n### Introduction to ASP.NET Core\n\nASP.NET\
    \ Core is a cross-platform, high-performance, and open-source framework for building\
    \ modern, cloud-based, and internet-connected applications. It is the evolution\
    \ of `ASP.NET` and supports cross-platform development.\n\n### Creating a Simple\
    \ ASP.NET Core Razor Pages Application\n\n1. Create a new `ASP.NET Core Razor\
    \ Pages` project:\n* Open `Visual Studio`.\n* Select \"Create a new project.\"\
    \n* Choose \"ASP.NET Core Web Application\" and select \"Razor Pages.\"\n\n2.\
    \ Understand the project structure:\n* `Pages`: Contains Razor Pages, similar\
    \ to views in `MVC`.\n* `Model`: Contains classes representing data and business\
    \ logic.\n\n3. Add a Razor Page:\n* Right-click on the `Pages` folder.\n* Select\
    \ \"Add\" -> \"Razor Page.\"\n* Name it, e.g., `Index.cshtml`.\n\n4. Write Razor\
    \ Page content:\n* Open the `Index.cshtml` file.\n* Write HTML and use Razor syntax\
    \ to display dynamic data.\n\n```html\n<h2>Welcome to ASP.NET Core Razor Pages!</h2>\n\
    ```\n\n5. Run the application:\n* Press `F5` or use the \"Start\" button to run\
    \ the application.\n* Access the application in a web browser, e.g., `http://localhost:port/`\n\
    \n## Key ASP.NET Concepts\n\n* **Middleware**: `Middleware` is software components\
    \ that are assembled into an application pipeline to handle requests and responses.\
    \ `Middleware` components are executed sequentially, and each can perform operations\
    \ on the request or response.\n* **Dependency Injection**: `ASP.NET` provides\
    \ a built-in dependency injection (`DI`) container to manage the dependencies\
    \ of application components. `DI` promotes loose coupling between components and\
    \ improves testability and maintainability.\n* **ASP.NET Identity**: `ASP.NET\
    \ Identity` is a membership system that adds login functionality to your application.\
    \ It includes user registration, password recovery, and role-based authorization.\n\
    \n`ASP.NET` provides powerful tools for building web applications.\n\n# 36. Introduction\
    \ to Blazor for Web Development\n\nBlazor is a framework for building interactive\
    \ web applications using `C#` instead of JavaScript. It enables developers to\
    \ create web interfaces. This guide provides an overview of Blazor and its key\
    \ concepts.\n\n## Understanding Blazor\n\n### Blazor Hosting Models\n\nBlazor\
    \ supports two hosting models:\n\n* `Blazor WebAssembly (Wasm)`: Client-side model\
    \ where the application runs in the browser using `WebAssembly`.\n* `Blazor Server`:\
    \ Server-side model where the application runs on the server, and the UI updates\
    \ are sent to the browser over `SignalR`.\n\n### Components and Pages\n\n* `Components`:\
    \ Reusable building blocks of a Blazor application. `Components` can have a UI,\
    \ logic, and be nested within each other.\n* `Pages`: Specialized components used\
    \ for defining the pages of a web application.\n* `Razor Syntax`: Blazor uses\
    \ Razor syntax for creating dynamic content. `Razor syntax` allows developers\
    \ to embed `C#` code within HTML.\n\n```html\n<!-- Example of Razor syntax in\
    \ a Blazor component -->\n<h1>Hello, @name!</h1>\n\n@code {\n    string name =\
    \ \"Blazor\";\n}\n```\n\n## Creating a Blazor Application\n\n### Creating a Blazor\
    \ WebAssembly Application\n\n* Using `Visual Studio`:\n* Open `Visual Studio`.\n\
    * Select \"Create a new project.\"\n* Choose \"Blazor App\" and select \"Blazor\
    \ WebAssembly App.\"\n\n* Using `.NET CLI`:\n* Open a command prompt.\n* Run the\
    \ following commands:\n\n```bash\ndotnet new blazorsasm -n MyBlazorApp\ncd MyBlazorApp\n\
    dotnet run\n```\n\n## Key Features of Blazor\n\n* **Code Sharing**: `Blazor` allows\
    \ code sharing between the client and server components. Shared code can include\
    \ models, services, and other logic.\n* **Component-Based Architecture**: `Blazor`\
    \ applications are built using a component-based architecture, making it easy\
    \ to create reusable and modular UI components.\n* **Dependency Injection**: `Blazor`\
    \ supports dependency injection, allowing developers to inject services and dependencies\
    \ into components for better modularity and testability.\n* **Blazor WebAssembly**:\
    \ `Blazor WebAssembly` enables running `C#` code directly in the browser using\
    \ `WebAssembly`, providing a full client-side development experience.\n* **Real-Time\
    \ Communication**: `Blazor Server` supports real-time communication between the\
    \ server and clients using `SignalR`, enabling live updates and dynamic content.\n\
    \n## Blazor vs. Other Frameworks\n\n* **Blazor vs. Angular/React/Vue**: `Blazor`\
    \ allows using `C#` for both client and server, while `Angular`, `React`, and\
    \ `Vue` are primarily JavaScript-based frameworks.\n* **Blazor vs. ASP.NET MVC**:\
    \ `Blazor` is a component-based framework for building interactive web applications,\
    \ while `ASP.NET MVC` is designed for building server-rendered web applications.\n"
