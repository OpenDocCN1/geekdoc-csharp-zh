    applications.


    Key Features


    *   Cross-Platform: .NET Core is designed to run on multiple platforms, including
    Windows, macOS, and Linux, allowing developers to build applications that can
    run seamlessly across different operating systems.


    *   Open Source: The framework is open source, encouraging community contributions
    and providing transparency in its development. Developers can access the source
    code, contribute to its improvement, and explore its internals.


    *   Command-Line Interface (CLI): .NET Core includes a powerful command-line interface
    (CLI) that enables developers to build, run, test, and publish applications directly
    from the command line, offering a flexible and efficient development experience.


    *   Microservices Architecture: .NET Core is well-suited for microservices-based
    architectures, enabling developers to build and deploy scalable and modular applications
    that consist of small, independently deployable services.


    Creating a .NET Core Application


    Installing .NET Core SDK


    Download and install the .NET Core SDK from the official website: https://dotnet.microsoft.com/download


    Creating a Console Application


    # Create a new console application


    dotnet new console -n MyConsoleApp


    Running the Application


    # Navigate to the application directory


    cd MyConsoleApp


    # Run the application


    dotnet run


    .NET Core vs .NET Framework


    .NET Core differs from the traditional .NET Framework in several ways. While .NET
    Framework is primarily designed for Windows applications, .NET Core is cross-platform.
    .NET Core is also modular, allowing developers to include only the components
    they need, reducing the size of deployed applications.


    .NET 5 and Beyond


    .NET 5 is the next version of the framework after .NET Core, and it unifies the
    previously separate .NET Core and .NET Framework. It continues to improve cross-platform
    support, performance, and developer productivity.


    .NET Core is a versatile and modern framework that empowers developers to create
    high-performance, scalable, and cross-platform applications. Its open-source nature,
    cross-platform capabilities, and support for microservices architecture make it
    a popular choice for a wide range of development scenarios.


    # 21\. Memory Management and Garbage Collection


    Memory management is a critical aspect of programming, ensuring efficient allocation
    and deallocation of memory resources. In C#, automatic memory management is provided
    by the .NET runtime through a process called Garbage Collection.


    Automatic Memory Management in C#


    Stack and Heap: In C#, memory is divided into two main areas: the stack and the
    heap. The stack is used for storing value types and method call information, while
    the heap is used for dynamically allocated memory, primarily for reference types.


    Value Types vs Reference Types: Value types (e.g., int, float) are stored on the
    stack, while reference types (e.g., classes, arrays) are allocated on the heap.
    Reference types store a reference to the actual data on the heap.


    Garbage Collection


    Garbage Collection (GC) is a process where the runtime automatically reclaims
    memory occupied by objects that are no longer in use, preventing memory leaks
    and promoting efficient memory utilization.


    *   Generation-Based GC: GC in .NET is generational, dividing objects into three
    generations (young, middle-aged, and old). Newly created objects start in the
    young generation and, if they survive multiple collections, are promoted to older
    generations.


    *   Garbage Collection Algorithms: The .NET GC uses different algorithms, including:


    *   Mark-and-Sweep: Identifies and marks objects that are still reachable.


    *   Compact: Compacts memory by moving live objects together, reducing fragmentation.


    IDisposable Interface and using Statement


    Managing Unmanaged Resources: The IDisposable interface is used for releasing
    unmanaged resources such as file handles, database connections, or network sockets.


    public class MyResource : IDisposable


    {


        private bool disposed = false;


        // Implement IDisposable pattern


        public void Dispose()


        {


            Dispose(true);


            GC.SuppressFinalize(this);


        }


        protected virtual void Dispose(bool disposing)


        {


            if (!disposed)


            {


                if (disposing)


                {


                    // Release managed resources


                }


                // Release unmanaged resources


                disposed = true;


            }


        }


        ~MyResource()


        {


            Dispose(false);


        }


    }


    Using Statement: The using statement ensures that the Dispose method is called,
    even if an exception occurs.


    using (MyResource resource = new MyResource())


    {


        // Use the resource


    }


    Memory Profiling and Optimization


    Tools for Memory Profiling: Various tools, such as Visual Studio Profiler and
    third-party profilers, help analyze memory usage and identify potential issues.


    Best Practices for Memory Management


    *   Minimize the use of global variables.


    *   Avoid unnecessary object creation.


    *   Release resources using Dispose or using statement.


    *   Be cautious with large object graphs and circular references.


    Effective memory management is crucial for creating high-performance and reliable
    applications. C#''s garbage collection mechanism, combined with proper resource
    management through IDisposable and using, helps developers build robust and memory-efficient
    software. Regular profiling and optimization practices further contribute to achieving
    optimal memory utilization.


    # 22\. Working with Dates and Times


    Working with dates and times is a common requirement in software development,
    and C# provides a rich set of features in the System.DateTime and related classes
    to handle these scenarios.


    DateTime Structure


    Creating a DateTime Object


    // Creating a DateTime object


    DateTime currentDateTime = DateTime.Now;


    DateTime specificDateTime = new DateTime(2024, 2, 3, 12, 30, 0);


    Formatting and Parsing


    // Formatting and parsing DateTime


    string formattedDate = currentDateTime.ToString("yyyy-MM-dd HH:mm:ss");


    DateTime parsedDate = DateTime.Parse("2024-02-03 12:30:00");


    Adding and Subtracting Time


    // Adding and subtracting time


    DateTime futureDate = currentDateTime.AddHours(24);


    DateTime pastDate = currentDateTime.AddMonths(-1);


    TimeSpan Structure


    Creating a TimeSpan Object


    // Creating a TimeSpan object


    TimeSpan duration = new TimeSpan(1, 30, 0); // 1 hour and 30 minutes


    Operations with TimeSpan


    // Operations with TimeSpan


    DateTime futureTime = currentDateTime + duration;


    DateTime pastTime = currentDateTime - duration;


    DateTimeOffset Structure


    Working with Time Zones


    // Working with DateTimeOffset and time zones


    DateTimeOffset utcDateTime = DateTimeOffset.UtcNow;


    DateTimeOffset specificDateTimeZone = new DateTimeOffset(2024, 2, 3, 12, 30, 0,
    TimeSpan.FromHours(5));


    Working with Time Zones


    TimeZoneInfo Class


    // Working with TimeZoneInfo


    TimeZoneInfo easternTimeZone = TimeZoneInfo.FindSystemTimeZoneById("Eastern Standard
    Time");


    DateTime easternTime = TimeZoneInfo.ConvertTime(currentDateTime, easternTimeZone);


    Date and Time Calculations


    Date and Time Calculations


    // Date and time calculations


    TimeSpan difference = futureDate - currentDateTime;


    int daysDifference = (int)difference.TotalDays;


    Formatting Date and Time for Display


    Custom Date and Time Formatting


    // Custom date and time formatting


    string customFormattedDate = currentDateTime.ToString("MMMM dd, yyyy");'
