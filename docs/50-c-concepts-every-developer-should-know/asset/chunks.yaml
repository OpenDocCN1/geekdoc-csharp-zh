        {


            // Create context with Strategy A


            var context = new Context(new ConcreteStrategyA());


            context.ExecuteStrategy();


            // Change strategy to Strategy B


            context.SetStrategy(new ConcreteStrategyB());


            context.ExecuteStrategy();


        }


    }


    # 34\. Windows Forms and WPF Applications


    Windows Forms (WinForms) and Windows Presentation Foundation (WPF) are two popular
    frameworks for developing graphical user interfaces (GUIs) in C#. This guide provides
    an overview of both technologies and their key concepts.


    Windows Forms (WinForms)


    Introduction to Windows Forms: Windows Forms is a graphical application programming
    interface (API) created by Microsoft for developing applications for the Microsoft
    Windows operating system. It provides a set of controls and libraries for building
    desktop applications with a traditional, event-driven programming model.


    Creating a Simple WinForms Application


    using System;


    using System.Windows.Forms;


    public class MainForm : Form


    {


        private Button myButton;


        public MainForm()


        {


            InitializeComponents();


        }


        private void InitializeComponents()


        {


            myButton = new Button


            {


                Text = "Click me!",


                Location = new System.Drawing.Point(50, 50)


            };


            myButton.Click += MyButton_Click;


            Controls.Add(myButton);


        }


        private void MyButton_Click(object sender, EventArgs e)


        {


            MessageBox.Show("Button clicked!");


        }


        [STAThread]


        public static void Main()


        {


            Application.EnableVisualStyles();


            Application.Run(new MainForm());


        }


    }


    Windows Presentation Foundation (WPF)


    Windows Presentation Foundation is a UI framework for building Windows desktop
    applications. It provides a more modern and flexible approach to designing user
    interfaces compared to WinForms. WPF uses Extensible Application Markup Language
    (XAML) for defining UI elements and their relationships.


    Creating a Simple WPF Application


    <Window x:Class="WpfApp.MainWindow"


            xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"


            xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"


            Title="WPF App" Height="200" Width="300">


        <Grid>


            <Button Content="Click me!" HorizontalAlignment="Center" VerticalAlignment="Center"
    Click="Button_Click"/>


        </Grid>


    </Window>


    using System.Windows;


    namespace WpfApp


    {


        public partial class MainWindow : Window


        {


            public MainWindow()


            {


                InitializeComponent();


            }


            private void Button_Click(object sender, RoutedEventArgs e)


            {


                MessageBox.Show("Button clicked!");


            }


        }


        public class App


        {


            [STAThread]


            public static void Main()


            {


                Application app = new Application();


                app.Run(new MainWindow());


            }


        }


    }


    Key Differences Between WinForms and WPF


    UI Definition


    *   WinForms: UI elements are defined programmatically in C#.


    *   WPF: UI elements are defined using XAML, allowing a separation of UI design
    and logic.


    Styling and Theming


    *   WinForms: Limited styling options.


    *   WPF: Rich styling and theming capabilities with XAML.


    Layout System


    *   WinForms: Uses a control-based layout system.


    *   WPF: Employs a more advanced layout system with features like data binding
    and control templating.


    Graphics and Animation


    *   WinForms: Basic graphics capabilities.


    *   WPF: Advanced graphics and animation support.


