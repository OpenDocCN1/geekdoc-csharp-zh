    \ 和 `TimeZoneInfo` 处理时区，C# 都提供了一套全面的特性来满足各种需求。理解这些特性允许开发者创建能够有效管理、显示和操作日期时间信息的应用程序。\n\
    \n# 23. 反射与特性\n\nC# 中的反射（Reflection）和特性（Attributes）提供了在运行时检查和操作代码的强大机制。反射允许你动态检查并交互类型、成员和对象，而特性允许你向代码中附加元数据。\n\
    \n## 反射\n\n### 获取类型信息\n```csharp\n// 获取类型信息\nType type = typeof(MyClass);\nType\
    \ anotherType = obj.GetType();\n```\n\n### 获取类型的成员\n```csharp\n// 获取类型的成员\nMethodInfo[]\
    \ methods = type.GetMethods();\nFieldInfo[] fields = type.GetFields();\nPropertyInfo[]\
    \ properties = type.GetProperties();\n```\n\n### 动态创建实例\n```csharp\n// 动态创建实例\n\
    object instance = Activator.CreateInstance(type);\n```\n\n### 动态调用方法\n```csharp\n\
    // 动态调用方法\nMethodInfo method = type.GetMethod(\"MyMethod\");\nmethod.Invoke(instance,\
    \ parameters);\n```\n\n### 访问并修改字段和属性\n```csharp\n// 访问并修改字段和属性\nFieldInfo field\
    \ = type.GetField(\"myField\");\nfield.SetValue(instance, value);\n\nPropertyInfo\
    \ property = type.GetProperty(\"MyProperty\");\nproperty.SetValue(instance, value);\n\
    ```\n\n### 检查特性\n```csharp\n// 检查特性\nobject[] attributes = type.GetCustomAttributes(typeof(MyAttribute),\
    \ true);\n```\n\n## 特性\n\n### 创建自定义特性\n```csharp\n// 创建自定义特性\n[AttributeUsage(AttributeTargets.Class\
    \ | AttributeTargets.Method, AllowMultiple = true)]\npublic class MyAttribute\
    \ : Attribute\n{\n    public string Description { get; }\n    public MyAttribute(string\
    \ description)\n    {\n        Description = description;\n    }\n}\n```\n\n###\
    \ 应用特性\n```csharp\n// 应用特性\n[My(\"This is my class\")]\npublic class MyClass\n\
    {\n    [My(\"This is my method\")]\n    public void MyMethod() { /* Method logic\
    \ */ }\n\n    [My(\"This is my property\")]\n    public string MyProperty { get;\
    \ set; }\n}\n```\n\n### 获取特性信息\n```csharp\n// 获取特性信息\nMyAttribute classAttribute\
    \ = (MyAttribute)Attribute.GetCustomAttribute(type, typeof(MyAttribute));\nMyAttribute\
    \ methodAttribute = (MyAttribute)Attribute.GetCustomAttribute(method, typeof(MyAttribute));\n\
    ```\n\n反射和特性提供了一种运行时处理代码的动态且可扩展的方式。反射允许动态检查和操作类型、成员和对象，而特性允许你向代码中附加元数据以提供额外信息或行为。适当使用反射和特性可以在各种场景下产生更灵活、可复用的代码。然而，应该注意以确保性能和可维护性。\n\
    \n# 24. C# 网络与 Web 开发\n\nC# 为网络和 Web 开发提供了强大的能力，能够创建与互联网交互、与远程服务器通信以及构建动态 Web\
    \ 解决方案的应用程序。\n\n## 网络基础\n\n**System.Net 命名空间**：C# 网络功能主要由 `System.Net` 命名空间提供，提供了用于处理\
    \ `HTTP`、`FTP`、`TCP` 和 `UDP` 等协议的类。\n\n```csharp\nusing System.Net;\nusing System.Net.Sockets;\n\
    ```\n\n### 使用 IP 地址\n```csharp\n// 使用 IP 地址\nIPAddress ipAddress = IPAddress.Parse(\"\
    192.168.1.1\");\nIPAddress localAddress = IPAddress.Loopback;\n```\n\n### TCP\
    \ 客户端与服务器\n```csharp\n// TCP 客户端和服务器\nTcpListener tcpListener = new TcpListener(IPAddress.Any,\
    \ 12345);\ntcpListener.Start();\nTcpClient tcpClient = new TcpClient(\"localhost\"\
    , 12345);\n```\n\n### 使用 ASP.NET 进行 Web 开发\n\n- **ASP.NET 简介**：ASP.NET 是一个 Web\
    \ 开发框架，允许开发者构建动态的数据驱动 Web 应用程序。\n- **ASP.NET MVC**：ASP.NET MVC（模型-视图-控制器）是一个遵循\
    \ MVC 架构模式构建 Web 应用程序的框架。\n- **ASP.NET Core**：ASP.NET Core 是 ASP.NET 框架的下一代跨平台版本，专为现代\
    \ Web 开发设计。\n\n## 消费与创建 Web API\n\n### 消费 Web API\n```csharp\n// 消费 Web API\n\
    using (HttpClient httpClient = new HttpClient())\n{\n    HttpResponseMessage response\
    \ = await httpClient.GetAsync(\"https://api.example.com/data\");\n    if (response.IsSuccessStatusCode)\n\
    \    {\n        string content = await response.Content.ReadAsStringAsync();\n\
    \        // 处理内容\n    }\n}\n```\n\n### 使用 ASP.NET Core 创建 Web API\n```csharp\n\
    // 使用 ASP.NET Core 创建简单的 Web API\n[ApiController]\n[Route(\"api/[controller]\"\
    )]\npublic class MyController : ControllerBase\n{\n    [HttpGet]\n    public IActionResult\
    \ Get()\n    {\n        return Ok(\"Hello, API!\");\n    }\n}\n```\n\n## C# 库\n\
    \n- **SignalR**：`SignalR` 是一个为 Web 应用程序添加实时功能的库。\n- **gRPC**：`gRPC` 是一个用于远程过程调用\
    \ (RPC)的高性能框架。\n\n## 最佳实践\n\n- **安全套接层 (SSL/TLS)**：使用 `SSL/TLS` 确保网络安全通信。\n- **数据加密**：在传输过程中加密敏感数据。\n\
    - **输入验证**：验证输入以防止 SQL 注入等漏洞。\n\n# 25. 消费与创建 Web API\n\nWeb API（应用程序接口）在现代软件开发中起着至关重要的作用，允许应用程序交互并共享数据。\n\
    \n## 消费 Web API\n\n#### 使用 HttpClient 进行请求\n```csharp\n// 使用 HttpClient 进行请求\n\
    using (HttpClient httpClient = new HttpClient())\n{\n    HttpResponseMessage response\
    \ = await httpClient.GetAsync(\"https://api.example.com/data\");\n    if (response.IsSuccessStatusCode)\n\
    \    {\n        string content = await response.Content.ReadAsStringAsync();\n\
    \    }\n}\n```\n\n#### 反序列化 JSON 响应\n```csharp\n// 反序列化 JSON 响应\nusing (HttpClient\
    \ httpClient = new HttpClient())\n{\n    HttpResponseMessage response = await\
    \ httpClient.GetAsync(\"https://api.example.com/data\");\n    if (response.IsSuccessStatusCode)\n\
    \    {\n        string jsonContent = await response.Content.ReadAsStringAsync();\n\
    \        MyObject myObject = JsonConvert.DeserializeObject<MyObject>(jsonContent);\n\
    \    }\n}\n```\n\n## 使用 ASP.NET Core 创建 Web API\n\n#### 设置 ASP.NET Core Web API\n\
    ```csharp\n// 设置 ASP.NET Core Web API\n[ApiController]\n[Route(\"api/[controller]\"\
    )]\npublic class MyController : ControllerBase\n{\n    [HttpGet]\n    public IActionResult\
    \ Get()\n    {\n        return Ok(\"Hello, API!\");\n    }\n}\n```\n\n#### 处理\
    \ HTTP 请求和响应\n```csharp\n// 在 Web API 中处理 HTTP 请求和响应\n[ApiController]\n[Route(\"\
    api/[controller]\")]\npublic class MyController : ControllerBase\n{\n    [HttpGet]\n\
    \    public IActionResult Get()\n    {\n        return Ok(\"Hello, API!\");\n\
    \    }\n\n    [HttpPost]\n    public IActionResult Post([FromBody] MyObject myObject)\n\
    \    {\n        // 处理迁入的数据\n        return CreatedAtAction(nameof(Get), new {\
    \ id = myObject.Id }, myObject);\n    }\n}\n```\n\n## 为 API 文档添加 Swagger\n\n"
- fmt: "\n```csharp\n// Adding Swagger for API documentation\n\nservices.AddSwaggerGen(c\
    \ =>\n{\n    c.SwaggerDoc(\"v1\", new OpenApiInfo { Title = \"My API\", Version\
    \ = \"v1\" });\n});\n```\n\n# C# Web API Libraries\n\nSignalR for Real-Time Communication:\
    \ `SignalR` enables real-time communication between clients and servers in web\
    \ applications.\n\nRefit for Type-Safe API Consumption: `Refit` simplifies the\
    \ process of consuming web APIs by providing a type-safe way to define and call\
    \ RESTful APIs.\n\n## Security Considerations\n\nAuthentication and Authorization:\
    \ Implement secure authentication and authorization mechanisms, such as `OAuth`\
    \ or `API keys`, to control access to your API.\n\nHTTPS Usage: Always use `HTTPS`\
    \ to encrypt data during transmission and enhance the overall security of your\
    \ web API.\n\nConsuming and creating web APIs are essential skills for C# developers.\
    \ Whether using `HttpClient` for HTTP requests, deserializing `JSON` responses,\
    \ building `ASP.NET Core Web APIs`, or leveraging libraries like `SignalR` and\
    \ `Refit`, C# provides a comprehensive set of tools for effective API interaction.\
    \ Security considerations, such as authentication, authorization, and `HTTPS`\
    \ usage, are crucial for ensuring the integrity and confidentiality of data in\
    \ API communications.\n\n# 26. Introduction to Entity Framework\n\nEntity Framework\
    \ (`EF`) is a powerful and widely-used Object-Relational Mapping (`ORM`) framework\
    \ in the .NET ecosystem. It simplifies database operations by allowing developers\
    \ to interact with databases using `.NET` objects, eliminating the need for complex\
    \ `SQL` queries.\n\n## Key Concepts\n\nDbContext: The `DbContext` is a core class\
    \ in Entity Framework that represents a session with the database and allows developers\
    \ to query and interact with data.\n\n```csharp\npublic class MyDbContext : DbContext\n\
    {\n    public DbSet<MyEntity> MyEntities { get; set; }\n}\n```\n\nDbSet: `DbSet`\
    \ is a property on the `DbContext` representing a collection of entities in the\
    \ database.\n\n```csharp\npublic class MyDbContext : DbContext\n{\n    public\
    \ DbSet<Product> Products { get; set; }\n}\n```\n\nCode-First and Database-First\
    \ Approaches: Entity Framework supports both `Code-First`, where the database\
    \ schema is generated based on your C#` classes, and `Database-First`, where the\
    \ C#` classes` are generated based on an existing database schema.\n\nMigrations:\
    \ `Migrations` in Entity Framework enable developers to evolve the database schema\
    \ over time by applying incremental changes.\n\n## Create a new migration\n\n\
    ```bash\ndotnet ef migrations add InitialCreate\n```\n\n# Apply the pending migration\
    \ to the database\n\n```bash\ndotnet ef database update\n```\n\n## Code-First\
    \ Example\n\n### Define Entity Classes\n\n```csharp\npublic class Product\n{\n\
    \    public int Id { get; set; }\n    public string Name { get; set; }\n    public\
    \ decimal Price { get; set; }\n}\n```\n\n### Create DbContext\n\n```csharp\npublic\
    \ class MyDbContext : DbContext\n{\n    public DbSet<Product> Products { get;\
    \ set; }\n}\n```\n\n### Configure Connection String\n\n```csharp\npublic class\
    \ Startup\n{\n    public void ConfigureServices(IServiceCollection services)\n\
    \    {\n        services.AddDbContext<MyDbContext>(options =>\n            options.UseSqlServer(Configuration.GetConnectionString(\"\
    DefaultConnection\")));\n    }\n}\n```\n\n### Querying Data\n\nLINQ Queries: Entity\
    \ Framework supports `LINQ` (`Language-Integrated Query`) for querying data in\
    \ a strongly-typed manner.\n\n```csharp\nvar expensiveProducts = dbContext.Products.Where(p\
    \ => p.Price > 100);\n```\n\n### Updating Data\n\n#### Adding and Updating Entities\n\
    \n```csharp\n// Adding a new entity\nvar newProduct = new Product { Name = \"\
    New Product\", Price = 50 };\ndbContext.Products.Add(newProduct);\n\n// Updating\
    \ an existing entity\nvar existingProduct = dbContext.Products.Find(1);\nexistingProduct.Price\
    \ = 75;\n```\n\n#### Deleting Entities\n\n```csharp\nvar productToDelete = dbContext.Products.Find(2);\n\
    dbContext.Products.Remove(productToDelete);\n```\n\nEntity Framework simplifies\
    \ database interactions in C# applications, allowing developers to focus on the\
    \ application logic rather than dealing with raw `SQL` queries. With support for\
    \ `Code-First`, `Database-First`, migrations, and `LINQ` queries, Entity Framework\
    \ provides a flexible and efficient way to work with databases in the .NET ecosystem.\n\
    \n# 27. Dependency Injection and Inversion of Control\n\nDependency Injection\
    \ (`DI`) and Inversion of Control (`IoC`) are fundamental concepts in software\
    \ development that promote modularity, testability, and maintainability by decoupling\
    \ components and managing dependencies more effectively. In the context of C#\
    \ and .NET, these concepts are often used together to achieve loosely coupled\
    \ and extensible architectures.\n\n## Inversion of Control (IoC)\n\nIn `IoC`,\
    \ the control of the flow of a program is inverted, meaning the responsibility\
    \ of managing object creation and lifetimes is delegated to an external container.\n\
    \nDependency Inversion Principle (`DIP`): `DIP` is a principle that states high-level\
    \ modules should not depend on low-level modules, but both should depend on abstractions.\
    \ Additionally, abstractions should not depend on details; details should depend\
    \ on abstractions.\n\n## Dependency Injection (DI)\n\nDependency Injection is\
    \ a design pattern and a specific implementation of `IoC`, where the dependencies\
    \ of a component (class or function) are injected from the outside, typically\
    \ through constructor parameters or property setters.\n\n### Benefits:\n\n- **Decoupling**:\
    \ Components become independent, making it easier to replace or extend functionality.\n\
    - **Testability**: Easier unit testing with the ability to substitute dependencies\
    \ with mocks or stubs.\n- **Maintainability**: Changes to one component have minimal\
    \ impact on others.\n\n### Dependency Injection in C# with .NET\n\nService Collection:\
    \ In .NET Core, the built-in `IServiceCollection` is used to register and resolve\
    \ dependencies.\n\n```csharp\npublic class Startup\n{\n    public void ConfigureServices(IServiceCollection\
    \ services)\n    {\n        services.AddDbContext<MyDbContext>(options =>\n  \
    \          options.UseSqlServer(Configuration.GetConnectionString(\"DefaultConnection\"\
    )));\n    }\n}\n```\n\n### Constructor Injection\n\n```csharp\npublic class MyClass\n\
    {\n    private readonly IMyService _myService;\n    private readonly IOtherService\
    \ _otherService;\n\n    public MyClass(IMyService myService, IOtherService otherService)\n\
    \    {\n        _myService = myService;\n        _otherService = otherService;\n\
    \    }\n    // Use _myService and _otherService in class methods\n}\n```\n\n##\
    \ Inversion of Control Containers\n\nPopular IoC Containers\n\n- `Microsoft.Extensions.DependencyInjection`:\
    \ Built into .NET Core.\n- `Autofac`: A popular third-party container.\n- `Unity`:\
    \ From Microsoft's Patterns and Practices.\n\n## Registering and Resolving Dependencies\n\
    \n```csharp\n// Microsoft.Extensions.DependencyInjection\nIServiceCollection services\
    \ = new ServiceCollection();\nservices.AddTransient<IMyService, MyService>();\n\
    services.AddScoped<IOtherService, OtherService>();\n```\n\n```csharp\n// Autofac\n\
    ContainerBuilder builder = new ContainerBuilder();\nbuilder.RegisterType<MyService>().As<IMyService>().InstancePerDependency();\n\
    builder.RegisterType<OtherService>().As<IOtherService>().InstancePerLifetimeScope();\n\
    ```\n\n```csharp\n// Unity\nIUnityContainer container = new UnityContainer();\n\
    container.RegisterType<IMyService, MyService>();\ncontainer.RegisterType<IOtherService,\
    \ OtherService>();\n\nDependency Injection and Inversion of Control are powerful\
    \ concepts that enhance the flexibility, testability, and maintainability of software\
    \ systems. In C# and .NET, these concepts are widely used, with built-in support\
    \ in .NET Core and various third-party IoC containers available.\n\n# 28. Unit\
    \ Testing with NUnit and MSTest\n\nUnit testing is a crucial practice in software\
    \ development to ensure the reliability and correctness of individual components\
    \ or units of code. NUnit and MSTest are two popular testing frameworks in the\
    \ C# ecosystem, providing a structured and efficient way to write and execute\
    \ tests.\n\n## Introduction to Unit Testing\n"
