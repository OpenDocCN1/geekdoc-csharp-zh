  trans: "\n\n要开始编写 C# 代码，你需要一个开发环境。Microsoft Visual Studio 是一个用于 C# 开发的流行集成开发环境 (IDE)。它提供了一个用户友好的界面、强大的调试工具以及与\
    \ .NET Framework 的无缝集成。\n\n## 你的第一个 C# 程序\n\n让我们写一个简单的“Hello, World!”程序来开始你的 C#\
    \ 之旅：\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void Main()\n\
    \    {\n        Console.WriteLine(\"Hello, World!\");\n    }\n}\n```\n\n这个基础示例演示了\
    \ C# 程序的结构，包括 `using` 指令和 `Main` 方法，后者是程序的入口。\n\n这段介绍为理解 C# 及其与 .NET Framework\
    \ 的关系奠定了基础。当你深入学习后续主题时，你将探索该语言的特性及其构建各种应用程序的庞大生态系统。\n\n# 2. C# 数据类型与变量\n\n## 数据类型\n\
    \n在 C# 中，每个变量都有一个数据类型，规定了它可以存储的数据种类。C# 中常见的数据类型包括：\n\n- 整数类型：`int`、`long`、`short`、`byte`\n\
    - 浮点类型：`float`、`double`\n- 小数类型：`decimal`\n- 字符类型：`char`\n- 布尔类型：`bool`\n- 字符串类型：`string`\n\
    \n选择正确的数据类型对于高效的内存使用和数据的准确表示至关重要。\n\n## 声明变量\n\n变量用于存储程序中的数据。在 C# 中，你通过指定数据类型和名称来声明变量。\n\
    \n例如：\n\n```csharp\nint age;\nfloat price;\nstring name;\n```\n\n## 变量初始化\n\n\
    变量可以在声明时或程序稍后进行初始化（赋一个初始值）。\n\n以下是两种者的示例：\n\n```csharp\nint quantity = 10; //\
    \ 声明时初始化\nfloat temperature; // 声明但不初始化\ntemperature = 98.6f; // 程序中稍后初始化\n```\n\
    \n## 类型推断 (var 关键字)\n\nC# 支持使用 `var` 关键字进行类型推断，允许编译器根据赋值的值自动确定数据类型。\n\n例如：\n\n\
    ```csharp\nvar count = 5; // 编译器推断为 int\nvar price = 19.99; // 编译器推断为 double\n\
    ```\n\n## 常量\n\n常量是在赋值后值无法更改的变量。它们使用 `const` 关键字声明：\n\n```csharp\nconst double\
    \ PI = 3.14159;\n```\n\n## 数据类型之间的转换\n\nC# 支持兼容数据类型之间的隐式和显式转换。隐式转换自动完成，而显式转换需要使用强制类型转换。\n\
    \n例如：\n\n```csharp\nint numInt = 10;\ndouble numDouble = numInt; // 隐式转换\nint\
    \ newInt = (int)numDouble; // 显式转换（强制转换）\n```\n\n## 可空类型\n\n在 C# 中，值类型不能赋予 `null`\
    \ 值。然而，通过使用可空类型，你可以显式允许值类型为 `null`。\n\n例如：\n\n```csharp\nint? nullableInt = null;\n\
    ```\n\n理解 C# 数据类型和变量是编写健壮且高效程序的基础。随着学习的深入，你会遇到选择正确的数据类型和有效管理变量对于成功应用开发至关重要的情况。\n\
    \n# 3. C# 中的运算符与表达式\n\n## 运算符简介\n\nC# 中的运算符是是对变量和值执行操作的符号。理解这些运算符对于在程序中处理数据和执行计算至关重要。\n\
    \n## 算术运算符\n\n算术运算符用于基础数学运算。它们包括：\n\n- 加法 (`+`)：将两个操作数相加。\n- 减法 (`-`)：从左操作数减去右操作数。\n\
    - 乘法 (`*`)：两个操作数相乘。\n- 除法 (`/`)：将左操作数除以右操作数。\n- 取模 (`%`)：返回除法的余数。\n\n```csharp\n\
    int a = 10;\nint b = 3;\nint sum = a + b; // 13\nint difference = a - b; // 7\n\
    int product = a * b; // 30\nint quotient = a / b; // 3\nint remainder = a % b;\
    \ // 1\n```\n\n## 比较运算符\n\n比较运算符用于比较值。它们包括：\n\n- 等于 (`==`)：检查两个操作数是否相等。\n- 不等于\
    \ (`!=`)：检查两个操作数是否不等。\n- 大于 (`>`)：检查左操作数是否大于右操作数。\n- 小于 (`<`)：检查左操作数是否小于右操作数。\n\
    - 大于等于 (`>=`)：检查左操作数是否大于或等于右操作数。\n- 小于等于 (`<=`)：检查左操作数是否小于或等于右操作数。\n\n```csharp\n\
    int x = 5;\nint y = 8;\nbool isEqual = x == y; // false\nbool isNotEqual = x !=\
    \ y; // true\nbool isGreaterThan = x > y; // false\nbool isLessThan = x < y; //\
    \ true\nbool isGreaterOrEqual = x >= y; // false\nbool isLessOrEqual = x <= y;\
    \ // true\n```\n\n## 逻辑运算符\n\n逻辑运算符用于执行逻辑操作。它们包括：\n\n- 逻辑与 (`&&`)：如果两个操作数都为真则返回真。\n\
    - 逻辑或 (`||`)：如果至少有一个操作数为真则返回真。\n- 逻辑非 (`!`)：如果操作数为假则返回真，反之亦然。\n\n```csharp\nbool\
    \ condition1 = true;\nbool condition2 = false;\nbool resultAnd = condition1 &&\
    \ condition2; // false\nbool resultOr = condition1 || condition2; // true\nbool\
    \ resultNot = !condition1; // false\n```\n\n## 赋值运算符\n\n赋值运算符用于赋予值。它们包括：\n\n-\
    \ 赋值 (`=`)：将右值赋给变量。\n- 加赋值 (`+=`)：将右值加到变量。\n\n```csharp\nint num = 10;\nnum +=\
    \ 5; // num 为 15\n```\n\n## 增减运算符\n\n增减运算符用于将变量增加或减少 1。\n\n- 递增 (`++`)：增加 1。\n\
    - 递减 (`--`)：减少 1。\n\n```csharp\nint counter = 5;\ncounter++; // counter 为 6\n\
    counter--; // counter 为 5\n```\n\n## 条件运算符 (三元运算符)\n\n条件运算符 (`? :`) 是 `if-else`\
    \ 语句的简写。它根据条件的求值返回两个值之一。\n\n```csharp\nint a = 10;\nint b = 5;\nint max = (a >\
    \ b) ? a : b; // max 为 10\n```\n\n运算符是 C# 中执行操作的基础构建块。通过掌握这些运算符，你将获得创建复杂表达式、决策和有效管理变量的能力。\n\
    \n# 4. 控制结构 (if-else, 循环)\n\nC# 中的控制结构用于管理程序的执行流。它们允许根据条件进行决策。两种主要的控制结构是 if-else\
    \ 语句和循环。\n\n## if-else 语句\n\nif-else 语句用于条件执行。它们允许程序根据条件的真假采取不同的路径。\n\n### if\
    \ 语句\n\n```csharp\nint num = 10;\nif (num > 0) {\n    Console.WriteLine(\"这是一个正数.\"\
    );\n}\n```\n\n### if-else 语句\n\n```csharp\nint num = -5;\nif (num > 0) {\n   \
    \ Console.WriteLine(\"这是一个正数.\");\n}\nelse {\n    Console.WriteLine(\"这不是正数.\"\
    );\n}\n```\n\n### if-else-else 语句\n\n```csharp\nint num = 0;\nif (num > 0) {\n\
    \    Console.WriteLine(\"这是一个正数.\");\n} else if (num < 0) {\n    Console.WriteLine(\"\
    这是一个负数.\");\n} else {\n    Console.WriteLine(\"这是一个零.\");\n}\n```\n\n## 循环\n\n\
    循环允许重复执行某个代码块。C# 中有多种类型的循环。\n\n### for 循环\n\n`for` 循环在迭代次数已知时使用。\n\n```csharp\n\
    for (int i = 1; i <= 5; i++) {\n    Console.WriteLine($\"迭代 {i}\");\n}\n```\n\n\
    ### while 循环\n\n`while` 循环在迭代次数预先知时使用。\n\n```csharp\nint count = 0;\nwhile (count\
    \ < 3) {\n    Console.WriteLine($\"计数: {count}\");\n    count++;\n}\n```\n\n"
- fmt: "\n### Do-While Loop\nThe do-while loop is similar to the while loop but guarantees\
    \ that the loop body is executed at least once.\n\n```csharp\nint attempt = 0;\n\
    \ndo\n{\n    Console.WriteLine($\"Attempt: {attempt}\");\n    attempt++;\n} while\
    \ (attempt < 3);\n```\n\n### Foreach Loop\nThe foreach loop is used to iterate\
    \ over elements in a collection (e.g., arrays or lists).\n\n```csharp\nint[] numbers\
    \ = { 1, 2, 3, 4, 5 };\n\nforeach (int number in numbers)\n{\n    Console.WriteLine(number);\n\
    }\n```\n\n### Nested Control Structures\nYou can nest control structures within\
    \ each other to create more complex logic.\n\n```csharp\nint x = 10;\nint y =\
    \ 5;\nif (x > 0)\n{\n    if (y > 0)\n    {\n        Console.WriteLine(\"Both x\
    \ and y are positive.\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
    x is positive, but y is non-positive.\");\n    }\n}\nelse\n{\n    Console.WriteLine(\"\
    x is non-positive.\");\n}\n```\n\nControl structures are crucial for determining\
    \ the flow of your C# programs. Mastering if-else statements and loops empowers\
    \ you to create dynamic and responsive applications.\n\n# 5. Methods and Functions\n\
    \nIn C#, methods are blocks of code that perform a specific task and can be called\
    \ from other parts of the program. Methods promote code reuse, readability, and\
    \ modularization.\n\n## Declaring and Calling Methods\n\n#### Method Declaration\n\
    ```csharp\npublic class Calculator\n{\n    // Method declaration\n    public int\
    \ Add(int a, int b)\n    {\n        return a + b;\n    }\n}\n```\n\n#### Calling\
    \ a Method\n```csharp\nCalculator calculator = new Calculator();\nint result =\
    \ calculator.Add(3, 5);\nConsole.WriteLine(result); // Output: 8\n```\n\n####\
    \ Method Parameters\n\n##### Required Parameters\n```csharp\npublic class MathOperations\n\
    {\n    public int Multiply(int x, int y)\n    {\n        return x * y;\n    }\n\
    }\n```\n\n##### Optional Parameters\n```csharp\npublic class Printer\n{\n    //\
    \ Optional parameter with a default value\n    public void PrintMessage(string\
    \ message, bool uppercase = false)\n    {\n        if (uppercase)\n        {\n\
    \            Console.WriteLine(message.ToUpper());\n        }\n        else\n\
    \        {\n            Console.WriteLine(message);\n        }\n    }\n}\n```\n\
    \n#### Return Types\n\n##### Methods with Return Values\n```csharp\npublic class\
    \ Circle\n{\n    public double CalculateArea(double radius)\n    {\n        return\
    \ Math.PI * radius * radius;\n    }\n}\n```\n\n##### Void Methods\n```csharp\n\
    public class Logger\n{\n    // Void method (no return value)\n    public void\
    \ LogError(string errorMessage)\n    {\n        Console.WriteLine($\"Error: {errorMessage}\"\
    );\n    }\n}\n```\n\n#### Method Overloading\nMethod overloading allows you to\
    \ define multiple methods with the same name but different parameter lists.\n\n\
    ```csharp\npublic class OverloadedMethods\n{\n    public int Add(int a, int b)\n\
    \    {\n        return a + b;\n    }\n    public double Add(double a, double b)\n\
    \    {\n        return a + b;\n    }\n}\n```\n\n#### Recursive Methods\nA method\
    \ can call itself, creating a recursive function.\n\n```csharp\npublic class FactorialCalculator\n\
    {\n    public int CalculateFactorial(int n)\n    {\n        if (n == 0 || n ==\
    \ 1)\n        {\n            return 1;\n        }\n        else\n        {\n \
    \           return n * CalculateFactorial(n - 1);\n        }\n    }\n}\n```\n\n\
    Methods and functions play a pivotal role in structuring C# programs. They allow\
    \ you to encapsulate logic, promote reusability, and enhance the readability of\
    \ your code. As you continue your C# journey, mastering the art of method declaration,\
    \ parameter handling, and understanding return types will empower you to design\
    \ robust and modular applications.\n\n# 6. Classes and Objects\n\nIn C#, classes\
    \ are the building blocks of object-oriented programming. A class is a blueprint\
    \ for creating objects, and objects are instances of classes. This paradigm allows\
    \ you to model real-world entities and behaviors.\n\n#### Class Declaration\n\n\
    ##### Basic Structure\n```csharp\npublic class Car\n{\n    // Fields (attributes)\n\
    \    public string Model;\n    public string Color;\n    // Constructor\n    public\
    \ Car(string model, string color)\n    {\n        Model = model;\n        Color\
    \ = color;\n    }\n    // Methods (behaviors)\n    public void Start()\n    {\n\
    \        Console.WriteLine($\"{Color} is starting.\");\n    }\n    public void\
    \ Drive()\n    {\n        Console.WriteLine($\"{Color} is on the move.\");\n \
    \   }\n}\n```\n\n##### Creating Objects (Instantiation)\n```csharp\nclass Program\n\
    {\n    static void Main()\n    {\n        // Creating objects\n        Car myCar\
    \ = new Car(\"Toyota\", \"Blue\");\n        Car anotherCar = new Car(\"Honda\"\
    , \"Red\");\n        // Accessing fields\n        Console.WriteLine($\"My car\
    \ is {myCar.Color} {myCar.Model}.\");\n        // Calling methods\n        myCar.Start();\n\
    \        anotherCar.Drive();\n    }\n}\n```\n\n##### Constructors\nConstructors\
    \ are special methods called when an object is created. They initialize the object's\
    \ state.\n\n##### Default Constructor\n```csharp\npublic class Person\n{\n   \
    \ public string Name;\n    // Default constructor\n    public Person()\n    {\n\
    \        Name = \"John Doe\";\n    }\n}\n```\n\n##### Parameterized Constructor\n\
    ```csharp\npublic class Book\n{\n    public string Title;\n    public string Author;\n\
    \    // Parameterized constructor\n    public Book(string title, string author)\n\
    \    {\n        Title = title;\n        Author = author;\n    }\n}\n```\n\n#####\
    \ Properties\nProperties provide controlled access to the fields of a class.\n\
    \n```csharp\npublic class Student\n{\n    // Private field\n    private int _age;\n\
    \    // Public property with get and set accessors\n    public int Age\n    {\n\
    \        get { return _age; }\n        set\n        {\n            if (value >=\
    \ 0 && value <= 120)\n            {\n                _age = value;\n         \
    \   }\n            else\n            {\n                Console.WriteLine(\"Invalid\
    \ age value.\");\n            }\n        }\n    }\n}\n```\n\n##### Encapsulation\n\
    Encapsulation is the practice of bundling the data (fields) and methods that operate\
    \ on the data within a single unit (class).\n\n```csharp\npublic class BankAccount\n\
    {\n    private decimal _balance;\n    public void Deposit(decimal amount)\n  \
    \  {\n        _balance += amount;\n    }\n    public void Withdraw(decimal amount)\n\
    \    {\n        if (amount <= _balance)\n        {\n            _balance -= amount;\n\
    \        }\n        else\n        {\n            Console.WriteLine(\"Insufficient\
    \ funds.\");\n        }\n    }\n    public decimal GetBalance()\n    {\n     \
    \   return _balance;\n    }\n}\n```\n"
  raw: 'Do-While Loop: The do-while loop is similar to the while loop but guarantees
    that the loop body is executed at least once.


    int attempt = 0;


    do


    {


        Console.WriteLine($"Attempt: {attempt}");


        attempt++;


    } while (attempt < 3);


    Foreach Loop: The foreach loop is used to iterate over elements in a collection
    (e.g., arrays or lists).


    int[] numbers = { 1, 2, 3, 4, 5 };


    foreach (int number in numbers)


    {


        Console.WriteLine(number);


    }


    Nested Control Structures: You can nest control structures within each other to
    create more complex logic.


    int x = 10;


    int y = 5;


    if (x > 0)


    {


        if (y > 0)


        {


            Console.WriteLine("Both x and y are positive.");


        }


        else


        {


            Console.WriteLine("x is positive, but y is non-positive.");


        }


    }


    else


    {


        Console.WriteLine("x is non-positive.");


    }


    Control structures are crucial for determining the flow of your C# programs. Mastering
    if-else statements and loops empowers you to create dynamic and responsive applications.


    # 5\. Methods and Functions


    In C#, methods are blocks of code that perform a specific task and can be called
    from other parts of the program. Methods promote code reuse, readability, and
    modularization.


    Declaring and Calling Methods


    Method Declaration


    public class Calculator


    {


        // Method declaration


        public int Add(int a, int b)


        {


            return a + b;


        }


    }


    Calling a Method


    Calculator calculator = new Calculator();


    int result = calculator.Add(3, 5);


    Console.WriteLine(result); // Output: 8


    Method Parameters


    Required Parameters


    public class MathOperations


    {


        public int Multiply(int x, int y)


        {


            return x * y;


        }


    }


    Optional Parameters


    public class Printer


    {


        // Optional parameter with a default value


        public void PrintMessage(string message, bool uppercase = false)


        {


            if (uppercase)


            {


                Console.WriteLine(message.ToUpper());


            }


            else


            {


                Console.WriteLine(message);


            }


        }


    }


    Return Types


    Methods with Return Values


    public class Circle


    {


        public double CalculateArea(double radius)


        {


            return Math.PI * radius * radius;


        }


    }


    Void Methods


    public class Logger


    {


        // Void method (no return value)


        public void LogError(string errorMessage)


        {


            Console.WriteLine($"Error: {errorMessage}");


        }


    }


    Method Overloading


    Method overloading allows you to define multiple methods with the same name but
    different parameter lists.


    public class OverloadedMethods


    {


        public int Add(int a, int b)


        {


            return a + b;


        }


        public double Add(double a, double b)


        {


            return a + b;


        }


    }


    Recursive Methods


    A method can call itself, creating a recursive function.


    public class FactorialCalculator


    {


        public int CalculateFactorial(int n)


        {


            if (n == 0 || n == 1)


            {


                return 1;


            }


            else


            {


                return n * CalculateFactorial(n - 1);


            }


        }


    }


    Methods and functions play a pivotal role in structuring C# programs. They allow
    you to encapsulate logic, promote reusability, and enhance the readability of
    your code. As you continue your C# journey, mastering the art of method declaration,
    parameter handling, and understanding return types will empower you to design
    robust and modular applications.


    # 6\. Classes and Objects


    In C#, classes are the building blocks of object-oriented programming. A class
    is a blueprint for creating objects, and objects are instances of classes. This
    paradigm allows you to model real-world entities and their behaviors in your programs.


    Class Declaration


    Basic Class Structure


    public class Car


    {


        // Fields (attributes)


        public string Model;


        public string Color;


        // Constructor


        public Car(string model, string color)


        {


            Model = model;


            Color = color;


        }


        // Methods (behaviors)


        public void Start()


        {


            Console.WriteLine($"{Color} {Model} is starting.");


        }


        public void Drive()


        {


            Console.WriteLine($"{Color} {Model} is on the move.");


        }


    }


    Creating Objects


    Object Instantiation


    class Program


    {


        static void Main()


        {


            // Creating objects


            Car myCar = new Car("Toyota", "Blue");


            Car anotherCar = new Car("Honda", "Red");


            // Accessing fields


            Console.WriteLine($"My car is a {myCar.Color} {myCar.Model}.");


            // Calling methods


            myCar.Start();


            anotherCar.Drive();


        }


    }


    Constructors


    Constructors are special methods called when an object is created. They initialize
    the object''s state.


    Default Constructor


    public class Person


    {


        public string Name;


        // Default constructor


        public Person()


        {


            Name = "John Doe";


        }


    }


    Parameterized Constructor


    public class Book


    {


        public string Title;


        public string Author;


        // Parameterized constructor


        public Book(string title, string author)


        {


            Title = title;


            Author = author;


        }


    }


    Properties


    Properties provide controlled access to the fields of a class.


    public class Student


    {


        // Private field


        private int _age;


        // Public property with get and set accessors


        public int Age


        {


            get { return _age; }


            set


            {


                if (value >= 0 && value <= 120)


                {


                    _age = value;


                }


                else


                {


                    Console.WriteLine("Invalid age value.");


                }


            }


        }


    }


    Encapsulation


    Encapsulation is the practice of bundling the data (fields) and methods that operate
    on the data within a single unit (class).


    public class BankAccount


    {


        private decimal _balance;


        public void Deposit(decimal amount)


        {


            _balance += amount;


        }


        public void Withdraw(decimal amount)


        {


            if (amount <= _balance)


            {


                _balance -= amount;


            }


            else


            {


                Console.WriteLine("Insufficient funds.");


            }


        }


        public decimal GetBalance()


        {


            return _balance;


        }


    }


    Inheritance


    Inheritance allows a class (subclass) to inherit the properties and behaviors
    of another class (base class).


     public class Animal


    {


        public void Eat()


        {


            Console.WriteLine("Animal is eating.");


        }


    }


    public class Dog : Animal


    {


        public void Bark()


        {


            Console.WriteLine("Dog is barking.");


        }


    }


    Understanding classes and objects is fundamental to object-oriented programming
    in C#. Classes encapsulate data and behavior, providing a clean and modular way
    to structure your code. As you delve deeper into OOP concepts, you''ll find that
    classes and objects form the basis for creating scalable, maintainable, and reusable
    software solutions.


    # 7\. Inheritance and Polymorphism in C#


    Inheritance and polymorphism are fundamental concepts in object-oriented programming
    that enable code reuse, extensibility, and flexibility. In C#, classes can inherit
    from other classes, and objects can exhibit different forms through polymorphism.


    Inheritance


    Inheritance allows a class (derived or child class) to inherit properties and
    behaviors from another class (base or parent class).


    Base Class (Parent Class)


    public class Animal


    {


        public string Species { get; set; }


        public void Eat()


        {


            Console.WriteLine("Animal is eating.");


        }


    }


    Derived Class (Child Class)


    public class Dog : Animal


    {


        public void Bark()


        {


            Console.WriteLine("Dog is barking.");


        }


    }


    Accessing Base Class Members


    Dog myDog = new Dog();


    myDog.Species = "Canine";


    myDog.Eat(); // Accessing the Eat method from the base class


    myDog.Bark();


    Polymorphism'
