    # 39\. Working with NoSQL Databases in C#


    NoSQL databases provide flexible and scalable storage solutions for different
    types of data. This guide covers working with NoSQL databases in C#, focusing
    on MongoDB, a popular document-oriented NoSQL database.


    Introduction to NoSQL Databases


    Characteristics of NoSQL Databases


    *   Schema-less: No fixed schema, allowing for flexible data structures.


    *   Scalability: Designed to scale horizontally to handle large amounts of data
    and traffic.


    *   Variety of Models: NoSQL databases support various data models, including
    document, key-value, column-family, and graph databases.


    MongoDB as a Document Database


    MongoDB is a widely-used NoSQL database that stores data in flexible, JSON-like
    BSON (Binary JSON) documents. Each document can have a different structure, making
    it suitable for a variety of applications.


    Connecting to MongoDB


    MongoDB Connection String


    string connectionString = "mongodb+srv://<username>:<password>@cluster0.mongodb.net/<database>?retryWrites=true&w=majority";


    MongoDB Client


    using MongoDB.Driver;


    IMongoClient client = new MongoClient(connectionString);


    Working with Collections


    MongoDB Database and Collection


    IMongoDatabase database = client.GetDatabase("MyDatabase");


    IMongoCollection<BsonDocument> collection = database.GetCollection<BsonDocument>("MyCollection");


    Inserting Documents


    BsonDocument document = new BsonDocument


    {


        { "name", "John Doe" },


        { "age", 30 },


        { "city", "New York" }


    };


    collection.InsertOne(document);


    Querying Documents


    var filter = Builders<BsonDocument>.Filter.Eq("city", "New York");


    var result = collection.Find(filter).ToList();


    Updating Documents


    var filter = Builders<BsonDocument>.Filter.Eq("name", "John Doe");


    var update = Builders<BsonDocument>.Update.Set("age", 31);


    collection.UpdateOne(filter, update);


    Deleting Documents


    var filter = Builders<BsonDocument>.Filter.Eq("name", "John Doe");


    collection.DeleteOne(filter);


    Using Object-Document Mapping (ODM)


    MongoDB C# Driver


    The MongoDB C# Driver provides an Object-Document Mapping (ODM) library called
    MongoDB .NET Driver that allows working with .NET objects directly.


    using MongoDB.Bson;


    using MongoDB.Bson.Serialization.Attributes;


    public class Person


    {


        [BsonId]


        public ObjectId Id { get; set; }


        public string Name { get; set; }


        public int Age { get; set; }


        public string City { get; set; }


    }


    Inserting, Querying, Updating, and Deleting Documents with ODM


    IMongoCollection<Person> personCollection = database.GetCollection<Person>("Persons");


    // Insert


    Person person = new Person { Name = "Jane Doe", Age = 25, City = "Los Angeles"
    };


    personCollection.InsertOne(person);


    // Query


    var query = Builders<Person>.Filter.Eq(p => p.City, "Los Angeles");


    List<Person> result = personCollection.Find(query).ToList();


    // Update


    var update = Builders<Person>.Update.Set(p => p.Age, 26);


    personCollection.UpdateOne(query, update);


    // Delete


    personCollection.DeleteOne(query);


    Working with NoSQL databases, such as MongoDB, in C# involves connecting to the
    database, manipulating collections, and performing CRUD operations. The MongoDB
    C# Driver, along with an Object-Document Mapping library, provides a convenient
    way to interact with NoSQL databases and seamlessly integrate .NET objects with
    document-oriented data stores. Understanding the basics of NoSQL databases and
    their specific features is essential for developing scalable and flexible data
    storage solutions in C#.


