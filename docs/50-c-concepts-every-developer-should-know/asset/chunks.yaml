  trans: "\n多态允许将对象被视为其基类的实例，即使它们实际上是派生类的实例。\n\n### 方法重写\n\n```csharp\npublic class\
    \ Cat : Animal\n{\n    // 方法重写\n    public override void Eat()\n    {\n      \
    \  Console.WriteLine(\"Cat is eating.\");\n    }\n}\n```\n\n### 使用多态\n\n```csharp\n\
    Animal myAnimal = new Dog();\nmyAnimal.Eat(); // 调用 Dog 类中重写的 Eat 方法\nmyAnimal\
    \ = new Cat();\nmyAnimal.Eat(); // 调用 Cat 类中重写的 Eat 方法\n```\n\n### virtual 和 override\
    \ 关键字\n\n```csharp\npublic class Shape\n{\n    // 虚方法\n    public virtual void\
    \ Draw()\n    {\n        Console.WriteLine(\"Drawing a shape.\");\n    }\n}\n\n\
    public class Circle : Shape\n{\n    // 重写方法\n    public override void Draw()\n\
    \    {\n        Console.WriteLine(\"Drawing a circle.\");\n    }\n}\n```\n\n###\
    \ 抽象类和方法\n\n```csharp\npublic abstract class Shape\n{\n    // 抽象方法\n    public\
    \ abstract void Draw();\n}\n\npublic class Circle : Shape\n{\n    // 抽象方法的实现\n\
    \    public override void Draw()\n    {\n        Console.WriteLine(\"Drawing a\
    \ circle.\");\n    }\n}\n```\n\n继承和多态是强大的概念，它们增强了你 C# 代码的结构和灵活性。利用这些特性允许你构建类层次结构、创建可重用的代码并设计能够适应不断变化的系统。\n\
    \n# 8. 接口和抽象类\n\n接口和抽象类是 C# 面向对象编程的核心组件。它们提供了一种为类定义约的方法，强制执行共同行为并确保代码库的一致性。\n\n\
    ### 接口\n\n接口是一种约，定义了类必须实现的一组方法和属性。它允许多继承，使一个类可以实现多个接口。\n\n#### 声明接口\n\n```csharp\n\
    public interface ILogger\n{\n    void LogMessage(string message);\n    void LogError(string\
    \ errorMessage);\n}\n```\n\n#### 实现接口\n\n```csharp\npublic class ConsoleLogger\
    \ : ILogger\n{\n    public void LogMessage(string message)\n    {\n        Console.WriteLine($\"\
    Message: {message}\");\n    }\n\n    public void LogError(string errorMessage)\n\
    \    {\n        Console.WriteLine($\"Error: {errorMessage}\");\n    }\n}\n```\n\
    \n#### 使用接口\n\n```csharp\nILogger logger = new ConsoleLogger();\nlogger.LogMessage(\"\
    Informational message\");\nlogger.LogError(\"Critical error\");\n```\n\n### 抽象类\n\
    \n抽象类是一种不能独立实例化的类，它可能包含抽象方法（没有体的方法），这些方法必须由派生类实现。\n\n#### 声明抽象类\n\n```csharp\n\
    public abstract class Shape\n{\n    // 抽象方法\n    public abstract void Draw();\n\
    \    // 普通方法\n    public void Move()\n    {\n        Console.WriteLine(\"Moving\
    \ the shape.\");\n    }\n}\n```\n\n#### 实现抽象类\n\n```csharp\npublic class Circle\
    \ : Shape\n{\n    // 实现抽象方法\n    public override void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a circle.\");\n    }\n}\n```\n\n#### 抽象属性\n\n```csharp\npublic abstract\
    \ class Animal\n{\n    // 抽象属性\n    public abstract string Species { get; }\n\
    \    // 普通方法\n    public void Eat()\n    {\n        Console.WriteLine(\"Animal\
    \ is eating.\");\n    }\n}\n```\n\n#### 使用抽象类\n\n```csharp\nShape myShape = new\
    \ Circle();\nmyShape.Draw(); // 调用 Circle 类中重写的 Draw 方法\nmyShape.Move(); // 调用抽象类中的\
    \ Move 方法\n\nAnimal myAnimal = new Dog();\nConsole.WriteLine($\"Species: {myAnimal.Species}\"\
    ); // 调用 Dog 类中重写的属性\nmyAnimal.Eat(); // 调用抽象类中的 Eat 方法\n\n### 什么时候使用接口和抽象类\n\n\
    接口：当你想要定义一个多个类都可以实现的约时（无论继承关系如何），请使用它。\n抽象类：当你想要为基类提供共享功能并强制派生类实现某些方法时，请使用它。\n\
    \n# 9. 异常处理\n\n异常处理是编写健壮且可靠的 C# 应用程序的关键部分。通过使用 try-catch 块、在需要时抛出异常以及实施适当的错误处理策略，你可以确保代码能够优雅地处理意外情况。\n\
    \n### 理解异常\n\n在 C# 中，异常是破坏程序正常执行流的运行时错误。\n\n### Try-Catch 块\n\n`try-catch` 块用于处理异常。\n\
    \n```csharp\ntry\n{\n    // 可能抛出异常的代码\n    int result = 10 / int.Parse(\"0\");\n\
    }\ncatch (DivideZeroException ex)\n{\n    // 处理特定异常\n    Console.WriteLine($\"\
    Error: {ex.Message}\");\n}\ncatch (Exception ex)\n{\n    // 处理任何其他异常\n    Console.WriteLine($\"\
    Unexpected error: {ex.Message}\");\n}\nfinally\n{\n    // 始终执行的代码\n    Console.WriteLine(\"\
    This always executes.\");\n}\n```\n\n### 抛出异常\n\n你可以使用 `throw` 关键字手动抛出异常。当你想要指示发生了某些特定条件或错误时，这非常有用。\n\
    \n```csharp\npublic class Calculator\n{\n    public int Divide(int dividend, int\
    \ divisor)\n    {\n        if (divisor == 0)\n        {\n            throw new\
    \ DivideZeroException(\"Cannot divide by zero.\");\n        }\n        return\
    \ dividend / divisor;\n    }\n}\n```\n\n### 自定义异常\n\n你可以通过派生 `Exception` 类来创建自己的异常类。这使你能够为应用程序定义特定的异常类型。\n\
    \n```csharp\npublic class CustomException : Exception\n{\n    public CustomException(string\
    \ message) : base(message)\n    {\n    }\n}\n```\n\n### 异常过滤器\n\n异常过滤器允许你根据特定条件捕获异常。此功能在\
    \ C# 6.0 中引入。\n\n```csharp\ntry\n{\n    // 可能抛出异常的代码\n    int result = 10 / int.Parse(\"\
    0\");\n}\ncatch (DivideZeroException ex) when (ex.Message == \"Attempted to divide\
    \ by zero.\")\n{\n    // 使用过滤器处理特定异常\n    Console.WriteLine($\"Error: {ex.Message}\"\
    );\n}\n```\n\n### 全局异常处理\n\n在较大的应用程序中，你可以实现全局异常处理来捕获未处理的异常并记录或显示它们的信息。\n\n```csharp\n\
    static void Main()\n{\n    AppDomain.CurrentDomain.UnhandledException += GlobalExceptionHandler;\n\
    \    // 程序的其余代码\n}\n\nprivate static void GlobalExceptionHandler(object sender,\
    \ UnhandledExceptionEventArgs e)\n{\n    Exception exception = (Exception)e.ExceptionObject;\n\
    \    Console.WriteLine($\"Global Exception Handler: {exception.Message}\");\n\
    }\n```\n\n# 10. C# 数组和列表\n\n数组和列表是 C# 中的基础数据结构，允许你存储和操作元素集合。理解它们的用法对于程序中处理结构化数据至关重要。\n\
    \n### 数组\n\n声明和初始化：C# 中的数组是相同数据类型的固定大小集合。\n\n"
- fmt: "\n```csharp\nint[] numbers = new int[5] { 1, 2, 3, 4, 5 };\n```\n\n## Accessing\
    \ Elements\n\n### Accessing Elements\n```csharp\nint firstElement = numbers[0];\
    \ // Accessing the first element (index 0)\n```\n\n## Iterating Through Arrays\n\
    \n### Iterating Through Arrays\n```csharp\nforeach (int number in numbers)\n{\n\
    \    Console.WriteLine(number);\n}\n```\n\n## Multidimensional Arrays\n\n### Multidimensional\
    \ Arrays\n```csharp\nint[,] matrix = new int[3, 3]\n{\n    {1, 2, 3},\n    {4,\
    \ 5, 6},\n    {7, 8, 9}\n};\n```\n\n## Lists\n\n### Declaration and Initialization\n\
    Lists provide dynamic arrays with additional functionality.\n\n### Declaration\
    \ and Initialization\n```csharp\nList<string> names = new List<string>() { \"\
    Alice\", \"Bob\", \"Charlie\" };\n```\n\n### Adding and Removing Elements\n\n\
    ### Adding and Removing Elements\n```csharp\nnames.Add(\"David\"); // Add an element\n\
    names.Remove(\"Bob\"); // Remove an element by value\nnames.RemoveAt(0); // Remove\
    \ an element by index\n```\n\n### Accessing Elements\n\n### Accessing Elements\n\
    ```csharp\nstring firstElement = names[0]; // Accessing the first element (index\
    \ 0)\n```\n\n### Iterating Through Lists\n\n### Iterating Through Lists\n```csharp\n\
    foreach (string name in names)\n{\n    Console.WriteLine(name);\n}\n```\n\n##\
    \ Array vs. List\n\n- **Arrays**: Fixed size, less flexibility, direct access\
    \ by index.\n- **Lists**: Dynamic size, more functionality, slower access by index.\n\
    \n## LINQ with Lists\n\n### LINQ with Lists\nLINQ (Language Integrated Query)\
    \ provides powerful querying capabilities for collections.\n\n### LINQ with Lists\n\
    ```csharp\nvar result = names.Where(n => n.Length > 4).ToList();\n```\n\nArrays\
    \ and lists are crucial for managing collections of data in C#. Arrays provide\
    \ a fixed-size, low-level structure, while lists offer dynamic sizing and additional\
    \ features. Knowing when to use each depends on your specific requirements. As\
    \ you work with these structures, you'll find them indispensable for various scenarios\
    \ in C# programming.\n\n# 11. C# Dictionaries and HashSets\n\nDictionaries and\
    \ HashSets are important data structures in C# that allow efficient storage and\
    \ retrieval of data. They provide different functionalities and are suitable for\
    \ different use cases.\n\n## Dictionaries\n\nDictionaries in C# are collections\
    \ that store key-value pairs, providing fast access to values based on their associated\
    \ keys.\n\n### Declaration and Initialization\n\n### Declaration and Initialization\n\
    ```csharp\nDictionary<string, int> ages = new Dictionary<string, int>()\n{\n \
    \   {\"Alice\", 25},\n    {\"Bob\", 30},\n    {\"Charlie\", 22}\n};\n```\n\n###\
    \ Adding and Accessing Elements\n\n### Adding and Accessing Elements\n```csharp\n\
    ages[\"David\"] = 28; // Add a new key-value pair\nint bobAge = ages[\"Bob\"];\
    \ // Access the value using the key\n```\n\n### Iterating Through Dictionaries\n\
    \n### Iterating Through Dictionaries\n```csharp\nforeach (var pair in ages)\n\
    {\n    Console.WriteLine($\"{pair.Key}: {pair.Value}\");\n}\n```\n\n### Checking\
    \ for Key Existence\n\n### Checking for Key Existence\n```csharp\nbool hasAlice\
    \ = ages.ContainsKey(\"Alice\"); // true\nbool hasEve = ages.ContainsKey(\"Eve\"\
    ); // false\n```\n\n## HashSets\n\nHashSets in C# are collections that store unique\
    \ elements without any specific order. They are based on hash codes, providing\
    \ fast membership tests.\n\n### Declaration and Initialization\n\n### Declaration\
    \ and Initialization\n```csharp\nHashSet<int> uniqueNumbers = new HashSet<int>()\
    \ { 1, 2, 3, 4, 5 };\n```\n\n### Adding and Removing Elements\n\n### Adding and\
    \ Removing Elements\n```csharp\nuniqueNumbers.Add(6); // Add a new element\nuniqueNumbers.Remove(3);\
    \ // Remove an element\n```\n\n### Checking for Element Existence\n\n### Checking\
    \ for Element Existence\n```csharp\nbool hasThree = uniqueNumbers.Contains(3);\
    \ // false\nbool hasFive = uniqueNumbers.Contains(5); // true\n```\n\n### Set\
    \ Operations\n\n### Set Operations\n```csharp\nHashSet<int> otherNumbers = new\
    \ HashSet<int>() { 4, 5, 6, 7, 8 };\n\n// Union\nHashSet<int> unionSet = new HashSet<int>(uniqueNumbers);\n\
    unionSet.UnionWith(otherNumbers); // {1, 2, 3, 4, 5, 6, 7, 8}\n\n// Intersection\n\
    HashSet<int> intersectionSet = new HashSet<int>(uniqueNumbers);\nintersectionSet.IntersectWith(otherNumbers);\
    \ // {4, 5}\n\n// Difference\nHashSet<int> differenceSet = new HashSet<int>(uniqueNumbers);\n\
    differenceSet.ExceptWith(otherNumbers); // {1, 2, 3}\n```\n\nDictionaries and\
    \ HashSets provide efficient ways to manage and query data in C#. Dictionaries\
    \ are suitable for key-value pairs with fast access based on keys, while HashSets\
    \ are ideal for maintaining unique elements and performing set operations. Choosing\
    \ the right data structure depends on the specific requirements of your application.\
    \ As you work with these structures, you'll enhance your ability to store and\
    \ manipulate data effectively in C#.\n\n# 12. Generics\n\nGenerics in C# provide\
    \ a powerful mechanism for creating classes, interfaces, and methods that work\
    \ with any data type while maintaining type safety. They enable you to write flexible\
    \ and reusable code by parameterizing types.\n\n### Introduction to Generics\n\
    Generics allow you to write classes and methods that operate on a type specified\
    \ by the developer at compile time. This enables the creation of flexible and\
    \ type-safe components.\n\n### Generic Class\n\n### Generic class\n```csharp\n\
    public class Box<T>\n{\n    private T _value;\n    public Box(T value)\n    {\n\
    \        _value = value;\n    }\n\n    public T GetValue()\n    {\n        return\
    \ _value;\n    }\n}\n```\n\n### Using Generic\nConstraints can be applied to generics\
    \ to restrict the types that can be used.\n\n### Generic Method\n```csharp\npublic\
    \ T Maximum<T>(T a, T b) where T : IComparable<T>\n{\n    return a.CompareTo(b)\
    \ > 0 ? a : b;\n}\n```\n\n### Covariance and Contravariance\nGenerics in C# support\
    \ covariance and contravariance, enabling flexible relationships between types.\n\
    \n### Covariance\n```csharp\npublic interface ICariant<out T>\n{\n    T GetItem();\n\
    }\n```\n\n### Nullable Types with Generics\nNullable value types with generics\n\
    ```csharp\npublic class Nullable<T> where T : struct\n{\n    private T _value;\n\
    \    public Nullable(T value)\n    {\n        _value = value;\n    }\n\n    public\
    \ T GetValue()\n    {\n        return _value;\n    }\n}\n```\n\nGenerics in C#\
    \ enhance code reusability and maintainability by providing a mechanism for creating\
    \ flexible and type-safe components. Whether working with generic classes, methods,\
    \ or interfaces, understanding generics is crucial for building efficient and\
    \ adaptable software in C#.\n\n# 13. Delegates and Events\n\nDelegates and events\
    \ are essential concepts in C# that facilitate the implementation of event-driven\
    \ programming. They provide a way to handle and respond to events in a decoupled\
    \ and extensible manner.\n\n## Delegates\n\nA delegate in C# is a type that represents\
    \ a method signature, allowing you to treat methods as first-class objects. Delegates\
    \ are often used to implement callbacks and event handling.\n\n### Delegate Declaration\n\
    \n### Delegate declaration\n```csharp\ndelegate void MyDelegate(string message);\n\
    ```\n\n### Using Delegates\n\n### Using delegates\n```csharp\npublic class MessageProcessor\n\
