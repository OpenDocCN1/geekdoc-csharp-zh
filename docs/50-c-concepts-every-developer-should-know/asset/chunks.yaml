    ## CI/CD 简介\n## 设置持续集成\n## 实现自动化测试\n## 持续部署\n## 处理密钥与安全性\n## 监控与回滚\n\n# 引言\n这本书非常出色，因为它不仅包含了基础概念，还涵盖中级和高级概念。\n\
    \n* 基础数据类型\n* C# 中的持续集成与部署 (CI/CD)\n* C# 代码最佳实践\n* C# 中的国际化与本地化\n* C# 与原生代码的互操作性\n\
    * C# 设计模式\n\n以及许多其他概念，这些概念将帮助你对 C# 编程语言更有信心。\n通过了解这些概念，你将开始更高效地处理 `# Syntax`，并能帮助你快速处理大部分的\
    \ `Code`。\n\n# 1. 基础数据类型\n### 什么是 C#？\n`C# (读作 C-sharp)` 是一种由微软开发的现代面向对象编程语言。它最初为构建\
    \ Windows 应用程序而设计，但已演变为一种多用途语言，用于各种软件开发，包括 Web 应用、移动应用等。\n\n### C# 的核心特性\n* 面向对象：`C#`\
    \ 支持面向对象编程原则，使得代码的组织和结构更加容易。\n* 类型安全：`C#` 是一种静态类型语言，意味着变量必须声明特定的数据类型，增强了代码安全性。\n\
    * 互操作性：`C#` 可以与其他语言无缝互操作，特别是 `.NET` 生态系统中的语言。\n* 内存管理：它通过垃圾回收实现了自动内存管理，减少了内存泄漏的风险。\n\
    \n### .NET Framework\n`C#` 与 `.NET Framework` 密切相关，这是一个用于构建、部署和运行应用程序的综合平台。`.NET\
    \ Framework` 为 `C#` 和其他语言提供了运行时环境、大型类库以及各种开发工具。\n\n### C# 和 .NET Framework 版本\n\
    `C#` 和 `.NET Framework` 在多年来一直在演进，每个版本都引入了新功能和改进。开发者应该注意他们正在使用的版本，因为这可能会影响语言特性和兼容性。\n\
    \n### 设置开发环境\n\n"
- fmt: "\nTo start coding in C#, you need a development environment. Microsoft Visual\
    \ Studio is a popular integrated development environment (IDE) for C# development.\
    \ It provides a user-friendly interface, powerful debugging tools, and seamless\
    \ integration with the .NET Framework.\n\n## Your First C# Program\n\nLet's write\
    \ a simple \"Hello, World!\" program to get started with C#:\n\n```csharp\nusing\
    \ System;\n\nclass Program\n{\n    static void Main()\n    {\n        Console.WriteLine(\"\
    Hello, World!\");\n    }\n}\n```\n\nThis basic example demonstrates the structure\
    \ of a C# program, including the using directive and the `Main` method, which\
    \ serves as the entry point.\n\nThis introduction lays the foundation for understanding\
    \ C# and its relationship with the .NET Framework. As you delve into the subsequent\
    \ topics, you'll explore the language's features and its vast ecosystem for building\
    \ diverse applications.\n\n# 2. C# Data Types and Variables\n\n## Understanding\
    \ Data Types\n\nIn C#, every variable has a data type, specifying the kind of\
    \ data it can hold. The common data types in C# include:\n\n- Integer Types: `int`,\
    \ `long`, `short`, `byte`\n- Floating-Point Types: `float`, `double`\n- Decimal\
    \ Type: `decimal`\n- Character Type: `char`\n- Boolean Type: `bool`\n- String\
    \ Type: `string`\n\nChoosing the right data type is crucial for efficient memory\
    \ usage and accurate representation of data.\n\n## Declaring Variables\n\nVariables\
    \ are used to store data in a program. In C#, you declare a variable by specifying\
    \ its data type and a name.\n\nFor example:\n\n```csharp\nint age;\nfloat price;\n\
    string name;\n```\n\n## Initializing Variables\n\nVariables can be initialized\
    \ (assigned an initial value) at the time of declaration or later in the program.\n\
    \nHere's an example of both:\n\n```csharp\nint quantity = 10; // Initialization\
    \ at declaration\nfloat temperature; // Declaration without initialization\ntemperature\
    \ = 98.6f; // Initialization later in the program\n```\n\n## Type Inference (var\
    \ keyword)\n\nC# supports type inference using the `var` keyword, allowing the\
    \ compiler to automatically determine the data type based on the assigned value.\n\
    \nFor example:\n\n```csharp\nvar count = 5; // Compiler infers int\nvar price\
    \ = 19.99; // Compiler infers double\n```\n\n## Constants\n\nConstants are variables\
    \ whose values cannot be changed once assigned. They are declared using the `const`\
    \ keyword:\n\n```csharp\nconst double PI = 3.14159;\n```\n\n## Conversion between\
    \ Data Types\n\nC# supports implicit and explicit conversion between compatible\
    \ data types. Implicit conversion is done automatically, while explicit conversion\
    \ requires the use of casting.\n\nFor example:\n\n```csharp\nint numInt = 10;\n\
    double numDouble = numInt; // Implicit conversion\nint newInt = (int)numDouble;\
    \ // Explicit conversion (casting)\n```\n\n## Nullable Types\n\nIn C#, value types\
    \ cannot be assigned a value of `null`. However, by using nullable types, you\
    \ can explicitly allow a value type to be `null`.\n\nFor example:\n\n```csharp\n\
    int? nullableInt = null;\n```\n\nUnderstanding C# data types and variables is\
    \ fundamental for writing robust and efficient programs. As you progress, you'll\
    \ encounter situations where choosing the right data type and managing variables\
    \ effectively is critical for successful application development.\n\n# 3. Operators\
    \ and Expressions in C#\n\n## Introduction to Operators\n\nOperators in C# are\
    \ symbols that perform operations on variables and values. Understanding these\
    \ operators is essential for manipulating data and performing calculations in\
    \ your programs.\n\n## Arithmetic Operators\n\nArithmetic operators are used for\
    \ basic mathematical operations. They include:\n\n- Addition (`+`): Adds two operands.\n\
    - Subtraction (`-`): Subtracts the right operand from the left operand.\n- Multiplication\
    \ (`*`): Multiplies two operands.\n- Division (`/`): Divides the left operand\
    \ by the right operand.\n- Modulus (`%`): Returns the remainder of the division.\n\
    \n```csharp\nint a = 10;\nint b = 3;\nint sum = a + b; // 13\nint difference =\
    \ a - b; // 7\nint product = a * b; // 30\nint quotient = a / b; // 3\nint remainder\
    \ = a % b; // 1\n```\n\n## Comparison Operators\n\nComparison operators are used\
    \ to compare values. They include:\n\n- Equal to (`==`): Checks if two operands\
    \ are equal.\n- Not equal to (`!=`): Checks if two operands are not equal.\n-\
    \ Greater than (`>`): Checks if the left operand is greater than the right operand.\n\
    - Less than (`<`): Checks if the left operand is less than the right operand.\n\
    - Greater than or equal to (`>=`): Checks if the left operand is greater than\
    \ or equal to the right operand.\n- Less than or equal to (`<=`): Checks if the\
    \ left operand is less than or equal to the right operand.\n\n```csharp\nint x\
    \ = 5;\nint y = 8;\nbool isEqual = x == y; // false\nbool isNotEqual = x != y;\
    \ // true\nbool isGreaterThan = x > y; // false\nbool isLessThan = x < y; // true\n\
    bool isGreaterOrEqual = x >= y; // false\nbool isLessOrEqual = x <= y; // true\n\
    ```\n\n## Logical Operators\n\nLogical operators are used to perform logical operations.\
    \ They include:\n\n- Logical AND (`&&`): Returns true if both operands are true.\n\
    - Logical OR (`||`): Returns true if at least one operand is true.\n- Logical\
    \ NOT (`!`): Returns true if the operand is false, and vice versa.\n\n```csharp\n\
    bool condition1 = true;\nbool condition2 = false;\nbool resultAnd = condition1\
    \ && condition2; // false\nbool resultOr = condition1 || condition2; // true\n\
    bool resultNot = !condition1; // false\n```\n\n## Assignment Operators\n\nAssignment\
    \ operators are used to assign values. They include:\n\n- Assignment (`=`): Assigns\
    \ the value on the right to the variable.\n- Addition assignment (`+=`): Adds\
    \ the right to the variable and assigns the result.\n\n```csharp\nint num = 10;\n\
    num += 5; // num is 15\n```\n\n## Increment and Decrement Operators\n\nIncrement\
    \ and decrement operators are used to increase or decrease the value of a variable\
    \ by 1.\n\n- Increment (`++`): Increases the value by 1.\n- Decrement (`--`):\
    \ Decreases the value by 1.\n\n```csharp\nint counter = 5;\ncounter++; // counter\
    \ is 6\ncounter--; // counter is 5\n```\n\n## Conditional Operator (Ternary Operator)\n\
    \nThe conditional operator (`? :`) is a shorthand way of writing an `if-else`\
    \ statement. It returns one of two values based on the evaluation of a condition.\n\
    \n```csharp\nint a = 10;\nint b = 5;\nint max = (a > b) ? a : b; // max is 10\n\
    ```\n\nOperators are fundamental building blocks for performing operations in\
    \ C#. By mastering these operators, you gain the ability to create complex expressions,\
    \ make decisions, and manipulate variables effectively.\n\n# 4. Control Structures\
    \ (if-else, loops)\n\nControl structures in C# are used to manage the flow of\
