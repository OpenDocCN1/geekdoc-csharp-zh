  trans: "\n\n# 用于 UI 的 XAML\n`XAML` (可扩展应用程序标记语言) 用于以声明式方式定义 UI。它允许创建 UI 元素并定义它们的属性。\n\
    \n```xml\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\n     \
    \        xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n          \
    \   x:Class=\"MyApp.MainPage\">\n    <StackLayout>\n        <Label Text=\"Welcome\
    \ to Xamarin.Forms!\"\n               VerticalOptions=\"CenterAndExpand\"\n  \
    \             HorizontalOptions=\"CenterAndExpand\" />\n        <Button Text=\"\
    Click me\" Clicked=\"OnButtonClicked\" />\n    </StackLayout>\n</ContentPage>\n\
    ```\n\n# 数据绑定\nXamarin.Forms 支持数据绑定，允许根据底层数据的变化动态更新 UI 元素。\n\n```xml\n<Label Text=\"\
    {Binding WelcomeMessage}\" />\n```\n\n```csharp\npublic class MyViewModel : INotifyPropertyChanged\n\
    {\n    private string welcomeMessage;\n    public string WelcomeMessage\n    {\n\
    \        get { return welcomeMessage; }\n        set\n        {\n            welcomeMessage\
    \ = value;\n            OnPropertyChanged(nameof(WelcomeMessage));\n        }\n\
    \    }\n    public event PropertyChangedEventHandler PropertyChanged;\n    protected\
    \ virtual void OnPropertyChanged(string propertyName)\n    {\n        PropertyChanged?.Invoke(this,\
    \ new PropertyChangedEventArgs(propertyName));\n    }\n}\n```\n\n# Xamarin.Native\n\
    ## Xamarin.iOS 和 Xamarin.Android\n针对特定平台的需求，Xamarin 允许开发者使用 `Xamarin.iOS` 进行 iOS\
    \ 开发使用 `Xamarin.Android` 进行 Android 开发编写原生代码。\n\n### iOS 示例\n```csharp\npublic\
    \ class MyiOSViewController : UIViewController\n{\n    public override void ViewDidLoad()\n\
    \    {\n        base.ViewDidLoad();\n        var label = new UILabel\n       \
    \ {\n            Text = \"Welcome to Xamarin.iOS!\",\n            Frame = new\
    \ CoreGraphics.CGRect(50, 50, 200, 20)\n        };\n        View.AddSubview(label);\n\
    \    }\n}\n```\n\n### Android 示例\n```csharp\n[Activity(Label = \"MyAndroidActivity\"\
    , MainLauncher = true, Icon = \"@mipmap/icon\")]\npublic class MyAndroidActivity\
    \ : Activity\n{\n    protected override void OnCreate(Bundle savedInstanceState)\n\
    \    {\n        base.OnCreate(savedInstanceState);\n        SetContentView(Resource.Layout.Main);\n\
    \        var label = FindViewById<TextView>(Resource.Id.myLabel);\n        label.Text\
    \ = \"Welcome to Xamarin.Android!\";\n    }\n}\n```\n\n# Xamarin.Essentials\n\
    `Xamarin.Essentials` 是一个为常用设备功能提供跨平台 API 的库。它简化了对相机、GPS、联系人等功能的访问。\n\n### 示例：定位\n\
    ```csharp\nvar location = await Geolocation.GetLastKnownLocationAsync();\n```\n\
    \n# Xamarin.Forms vs. Xamarin.Native\n- `Xamarin.Forms`: 跨平台共享 UI 和业务逻辑，适用于简单的应用程序。\n\
    - `Xamarin.Native`: 适用于具有复杂且特定 UI 需求的应用程序。\n\n# Xamarin 社区与工具\nXamarin 拥有活跃的社区，开发者可以使用带有\
    \ `Xamarin` 扩展的 `Visual Studio` 或 `Visual Studio Code` 进行开发。`Xamarin.Forms` 提供了一系列预构建的\
    \ UI 控件，社区社区贡献。\n\n# Unity 引擎\nUnity 是一个使用 C# 创建游戏的强大引擎。\n\n## GameObject 与组件\n\
    `GameObject` 代表场景中的实体。`Transform` 组件管理位置、旋转和缩放。`Collider` 组件启用碰撞检测。`Rigidbody`\
    \ 组件添加物理行为。\n\n## 物理与动画\n### Unity 中的物理\n物理交互。`Physics.Raycast` 发射射线以检测物体。当碰撞器发生作用时，会触发\
    \ `Collision Events`（碰撞事件）。\n```csharp\nvoid OnCollisionEnter(Collision collision)\n\
    {\n}\n```\n\n### Unity 中的动画\n`Animator` 组件控制动画。`Animation Clips` 定义了单个动画片段。`Blend\
    \ Trees`（混合树）根据参数混合多个动画。\n\n## UI 与用户输入\n### Unity UI 系统\n`Canvas`: UI 元素的容器。`UI\
    \ Text`、`Image`、`Button`: 普通 UI 组件。`Event System` 处理用户输入。\n\n### Unity 中的用户输入\n\
    `Input` 类捕获用户输入。`Input Manager` 为输入提供可配置设置。\n```csharp\nvoid Update()\n{\n   \
    \ float horizontalInput = Input.GetAxis(\"Horizontal\");\n    float verticalInput\
    \ = Input.GetAxis(\"Vertical\");\n}\n```\n\n## 场景与预制体 (Prefabs)\n`Scenes`: 代表\
    \ Unity 的关卡或章节。`Prefabs`: 可复用的游戏对象模板。\n\n## C# 脚本\n`MonoBehaviour`: Unity 脚本的基类。`Start`\
    \ 和 `Update` 等生命周期方法每帧调用一次。\n```csharp\nusing UnityEngine;\n\npublic class MyScript\
    \ : MonoBehaviour\n{\n    void Start()\n    {\n    }\n    void Update()\n    {\n\
    \    }\n}\n```\n\n## 最佳实践\n### 代码组织\n- `Separation of Concerns`（关注分离）：将代码分为逻辑组件。\n\
    - `ScriptableObjects`: 独立于 `MonoBehaviour` 实例存储数据。\n\n### 性能优化\n- `Object Pooling`（对象池）：重用对象而不是实例化和销毁它们。\n\
    - `Batching`（批）：将多次渲染调用合并到一个批次。\n\n## 协作开发\n### 版本控制\n- `Unity Collaborate`: Unity\
    \ 内置的版本控制。\n- `Git`、`SVN`: 外部版本控制系统。\n\n### 工具\n- `Unity Collab`: 基于云的协作开发。\n\
    - `Photon Unity Networking (PUN)`: 多人网络解决方案。\n\n# 构建与部署\n### 平台构建\n- `Build Settings`:\
    \ 配置目标平台。\n- `Build Process`: 生成用于部署的可执行文件。\n\n### 平台\n- PC/Mac/Linux 独立\n- iOS\
    \ 和 Android\n- WebGL\n- 主机平台 (PlayStation, Xbox)\n\n# 46. 使用 ML.NET 进行机器学习与人工智能\n\
    \n"
- fmt: "\nML.NET is an open-source machine learning framework developed by Microsoft\
    \ for building custom machine learning models using `C#` and `.NET`. This guide\
    \ provides an introduction to machine learning and AI using `ML.NET`.\n\n# Introduction\
    \ to Machine Learning\n\n## What is Machine Learning?\n\n* `Machine Learning (ML)`:\
    \ A subset of artificial intelligence that enables systems to learn and improve\
    \ from experience.\n* `Supervised Learning`: Training models on labeled data.\n\
    * `Unsupervised Learning`: Extracting patterns from unlabeled data.\n* `Reinforcement\
    \ Learning`: Training models through reward-based systems.\n\n## ML.NET Basics\n\
    \n* `ML.NET` Libraries: Provides tools and libraries for machine learning tasks.\n\
    * `Data Pipeline`: Preprocessing and transforming data for training models.\n\
    * `Model Training`: Creating and training machine learning models.\n* `Model Evaluation`:\
    \ Assessing the performance of trained models.\n\n## ML.NET Data Pipeline\n\n\
    ### Data Loading and Preparation\n\n* `IDataView` Interface: Represents a mutable,\
    \ lazy view over a set of data.\n* `LoadFromEnumerable`: Loading data from in-memory\
    \ collections.\n* `Data Preprocessing`: Cleaning and transforming data.\n\n```sharp\n\
    var data = new List<MyData>\n{\n    new MyData { Feature1 = 1.2F, Feature2 = 2.3F,\
    \ Label = true },\n    // Add more data...\n};\n\nvar context = new MLContext();\n\
    var dataView = context.Data.LoadFromEnumerable(data);\n```\n\n### Data Transformation\n\
    \n* `Featurization`: Converting raw data into features.\n* `Normalization`: Scaling\
    \ features for consistent ranges.\n\n```csharp\nvar pipeline = context.Transforms.Conversion.MapValueToKey(\"\
    Label\")\n    .Append(context.Transforms.Concatenate(\"Features\", \"Feature1\"\
    , \"Feature2\"))\n    .Append(context.Transforms.NormalizeMinMax(\"Features\"\
    ));\n```\n\n## Model Training with ML.NET\n\n### Choosing a Model\n\n* `Algorithms`:\
    \ `ML.NET` supports various algorithms for classification, regression, clustering,\
    \ and more.\n* `Model Configuration`: Setting hyperparameters and options.\n\n\
    ```csharp\nvar trainer = context.BinaryClassification.Trainers.SdcaLogisticRegression();\n\
    ```\n\n### Model Training and Evaluation\n\n* `Fit` Method: Training the model\
    \ with training data.\n* `Evaluate` Method: Assessing the model's performance.\n\
    \n```csharp\nvar model = pipeline.Append(trainer)\n    .Fit(dataView);\n\nvar\
    \ metrics = context.BinaryClassification.Evaluate(model.Transform(dataView));\n\
    ```\n\n## ML.NET Model Consumption\n\n### Model Saving and Loading\n\n* `Save\
    \ Model`: Persisting trained models for future use.\n* `Load Model`: Loading pre-trained\
    \ models.\n\n```csharp\ncontext.Model.Save(model, data.Schema, \"model.zip\");\n\
    var loadedModel = context.Model.Load(\"model.zip\", out var modelSchema);\n```\n\
    \n### Making Predictions\n\n* `Prediction Engine`: Creating an engine for making\
    \ predictions.\n* `Predict` Method: Obtaining predictions from new data.\n\n```csharp\n\
    var predictionEngine = context.Model.CreatePredictionEngine<MyData, MyPrediction>(model);\n\
    var prediction = predictionEngine.Predict(new MyData { Feature1 = 0.8F, Feature2\
    \ = 1.5F });\n```\n\n## Advanced ML.NET Features\n\n### Model Explainability\n\
    \n* `Explainability`: Understanding and interpreting model predictions.\n* `Global\
    \ and Local Interpretability`: Insights into model behavior.\n\n```csharp\nvar\
    \ explainer = context.Model.LoadTreeEnsembleClassificationModel(modelPath);\n\
    var globalExplanation = explainer.GetOverallFeatureContribution();\nvar localExplanation\
    \ = explainer.GetPerInstanceFeatureContribution(dataView, 0);\n```\n\n### Automated\
    \ Machine Learning (AutoML)\n\n* `AutoML Experiment`: Automated model selection\
    \ and tuning.\n* `Exploration vs. Exploitation`: Balancing exploration and exploitation\
    \ in the search space.\n\n```csharp\nvar experiment = context.Auto().CreateBinaryClassificationExperiment(500);\n\
    var result = experiment.Execute(dataView);\n```\n\n## ML.NET and Integration with\
    \ .NET Applications\n\n### .NET Core and ASP.NET Integration\n\n* `ML.NET` in\
    \ Web Applications: Embedding `ML.NET` models in `ASP.NET` applications.\n* `Real-time\
    \ Predictions`: Serving predictions in real-time.\n\n```csharp\npublic IActionResult\
    \ Predict([FromBody] MyData input)\n{\n    var prediction = predictionEngine.Predict(input);\n\
    \    return Ok(prediction);\n}\n```\n\n### Integration with Azure\n\n* `Azure\
    \ Machine Learning Services`: Deploying and managing `ML.NET` models on `Azure`.\n\
    * `Azure Functions`: Serverless execution of `ML.NET` models.\n\n```csharp\n[FunctionName(\"\
    PredictFunction\")]\npublic static async Task<IActionResult> Run(\n    [HttpTrigger(AuthorizationLevel.Function,\
    \ \"post\", Route = null)] HttpRequest req,\n    ILogger log)\n{\n    // ML.NET\
    \ prediction logic\n    return new OkObjectResult(prediction);\n}\n```\n\n`ML.NET`\
    \ simplifies the process of incorporating machine learning and AI capabilities\
    \ into `.NET` applications. Understanding the basics of machine learning, data\
    \ preparation, model training, and model consumption is crucial for successfully\
    \ implementing `ML.NET` in real-world scenarios. Leveraging advanced features\
    \ like model explainability and automated machine learning enhances the capabilities\
    \ of `ML.NET`. Integration with `.NET Core`, `ASP.NET`, and cloud services further\
    \ extends the reach and applicability of `ML.NET` in diverse application scenarios.\n\
    \n# 47. C# Interoperability with Native Code\n\n`C#` provides powerful features\
    \ for interoperability with native code, allowing developers to seamlessly integrate\
    \ and use components written in other languages like `C` or `C++`. This guide\
    \ explores various aspects of `C#` interoperability with native code.\n\n## Introduction\
    \ to Interoperability\n\n### Why Interoperability?\n\n* `Reusing Existing Code`:\
    \ Incorporate legacy or performance-critical code written in native.\n* `Platform\
    \ Integration`: Interact with system APIs.\n* `Cross-Language Development`: Collaborate\
    \ with projects.\n\n### Interoperability Approaches\n\n* `Platform Invocation\
    \ Services (P/Invoke)`: Call native functions from managed code.\n* `C++/CLI (Managed\
    \ C++)`: Create mixed-mode assemblies.\n* `COM Interop`: Interact with components.\n\
    \n## P/Invoke (Platform Invocation Services)\n\n### Basics of P/Invoke\n\n* `DllImport`\
    \ Attribute: Import native functions into `C#`.\n* `Calling Conventions`: Specify\
    \ how parameters are passed between managed and native code.\n\n```csharp\nusing\
    \ System.InteropServices;\n\nclass Program\n{\n    [DllImport(\"User32.dll\")]\n\
    \    public static extern int MessageBox(IntPtr hWnd, string text, string caption,\
    \ uint type);\n\n    static void Main()\n    {\n        MessageBox(IntPtr.Zero,\
    \ \"Hello from P/Invoke!\", \"Greetings\", 0);\n    }\n}\n```\n\n### Handling\
    \ Data Types\n\n* `Primitive Types`: Pass integers, booleans, strings, and structures.\n\
    * `Arrays and Pointers`: Work with arrays and pointers in native code.\n* `Struct\
    \ Layouts`: Ensure proper memory alignment.\n\n```csharp\n[StructLayout(LayoutKind.Sequential)]\n\
    public struct Point\n{\n    public int X;\n    public int Y;\n}\n\n[DllImport(\"\
    NativeLibrary.dll\")]\npublic static extern void ProcessPoint(Point point);\n\
    ```\n\n## C++/CLI (Managed C++)\n\n### Mixed-Mode Assemblies\n\n* `Create a Mixed-Mode\
    \ Project`: Blend `C#` and `C++`.\n* `Managed and Unmanaged Code`: Interact between\
    \ the two.\n\n```cpp\n// NativeCode.cpp\nextern \"C\" __declspec(dllexport) int\
    \ AddNumbers(int a, int b)\n{\n    return a + b;\n}\n```\n\n```csharp\n// ManagedCode.cs\n\
    class Program\n{\n    [DllImport(\"NativeCode.dll\")]\n    public static extern\
    \ int AddNumbers(int a, int b);\n\n    static void Main()\n    {\n        int\
    \ result = AddNumbers(3, 4);\n        Console.WriteLine(result); // Outputs: 7\n\
    \    }\n}\n```\n\n### Ref and Value Classes\n\n* `Ref Classes`: Managed classes\
    \ with native features.\n* `Value Classes`: Lightweight structures for interoperability.\n\
    \n```cpp\n// NativeClass.h\npublic ref class NativeRefClass\n{\npublic:\n    int\
    \ AddNumbers(int a, int b);\n};\n\n// NativeStruct.h\npublic value struct NativeValueStruct\n\
    {\n    int X;\n    int Y;\n};\n```\n\n```csharp\n// ManagedCode.cs\nNativeRefClass^\
    \ nativeRefInstance = gcnew NativeRefClass();\nint result = nativeRefInstance->AddNumbers(3,\
    \ 4);\n\nNativeValueStruct valueStruct;\nvalueStruct.X = 10;\nvalueStruct.Y =\
    \ 20;\n```\n\n## COM Interop\n\n### COM Components\n\n* `Component Object Model\
    \ (COM)`: Standard for software components on Windows.\n"
