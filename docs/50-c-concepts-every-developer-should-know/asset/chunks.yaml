  raw: 'Events provide a way for a class to notify other classes or objects when something
    of interest happens. They are based on delegates and follow the publisher-subscriber
    pattern.


    Event Declaration


    // Event declaration


    public class EventPublisher


    {


        public event MyDelegate MyEvent;


    }


    Subscribing to Events


    // Subscribing to events


    public class EventSubscriber


    {


        public void Subscribe(EventPublisher publisher)


        {


            publisher.MyEvent += HandleEvent;


        }


        public void HandleEvent(string message)


        {


            Console.WriteLine($"Event handled: {message}");


        }


    }


    Publishing Events


    // Publishing events


    EventPublisher publisher = new EventPublisher();


    EventSubscriber subscriber = new EventSubscriber();


    subscriber.Subscribe(publisher);


    publisher.MyEvent?.Invoke("Event message"); // Raising the event


    Event Handlers and EventArgs


    // Event handlers and EventArgs


    public class CustomEventArgs : EventArgs


    {


        public string EventMessage { get; }


        public CustomEventArgs(string message)


        {


            EventMessage = message;


        }


    }


    public class EventPublisher


    {


        public event EventHandler<CustomEventArgs> MyEvent;


        public void RaiseEvent(string message)


        {


            OnMyEvent(new CustomEventArgs(message));


        }


        protected virtual void OnMyEvent(CustomEventArgs e)


        {


            MyEvent?.Invoke(this, e);


        }


    }


    Delegates and events play a crucial role in implementing event-driven programming
    in C#. Delegates allow you to create flexible and extensible callback mechanisms,
    while events provide a standardized way to handle and respond to notifications.
    Understanding and using delegates and events are key skills for building responsive
    and modular applications in C#.


    # 14\. Lambdas and LINQ


    Lambdas and LINQ (Language Integrated Query) are powerful features in C# that
    enhance code conciseness and facilitate data querying and manipulation.


    Lambdas


    Lambdas are concise, anonymous functions that allow you to write inline code for
    short-lived operations, especially useful for delegate types.


    Lambda Expression Syntax


    // Lambda expression syntax


    Func<int, int, int> add = (a, b) => a + b;


    Console.WriteLine(add(3, 5)); // Output: 8


    Lambda Statements


    // Lambda with statements


    Func<int, int> square = x =>


    {


        int result = x * x;


        return result;


    };


    Console.WriteLine(square(4)); // Output: 16


    Using Lambdas with LINQ


    // Using Lambdas with LINQ


    List<int> numbers = new List<int> { 1, 2, 3, 4, 5 };


    var squaredNumbers = numbers.Select(x => x * x);


    LINQ (Language Integrated Query)


    LINQ provides a declarative syntax for querying and manipulating data from various
    sources, such as collections, databases, XML, and more.


    LINQ Query Syntax


    // LINQ query syntax


    var evenNumbers = from number in numbers


                      where number % 2 == 0


                      select number;


    LINQ Method Syntax


    // LINQ method syntax


    var oddNumbers = numbers.Where(x => x % 2 != 0);


    Projection in LINQ


    // Projection in LINQ


    var squaredAndFiltered = numbers


        .Select(x => x * x)


        .Where(x => x > 10);


    Joining in LINQ


    // Joining in LINQ


    var persons = new List<Person> { /* ... */ };


    var orders = new List<Order> { /* ... */ };


    var query = from person in persons


                join order in orders on person.Id equals order.PersonId


                select new { person.Name, order.ProductName };


    LINQ with Lambda Expressions


    // LINQ with lambda expressions


    var products = new List<Product> { /* ... */ };


    var expensiveProducts = products.Where(p => p.Price > 1000);


    Lambdas and LINQ bring expressive and concise syntax to C#, making code more readable
    and maintainable. Lambdas enable the creation of inline functions, while LINQ
    simplifies the querying and transformation of data. Combining these features allows
    for elegant and efficient data manipulation in various scenarios, enhancing the
    developer''s productivity and code clarity.


    # 15\. The C# Type System


    The C# type system is a fundamental aspect of the language that defines the various
    data types, their relationships, and the rules governing their interactions. Understanding
    the type system is crucial for writing robust and maintainable code.


    Value Types vs. Reference Types


    Value Types: Value types directly contain their data and are stored on the stack.
    Examples include integers (int), floating-point numbers (float), and structs.


    int intValue = 42;


    Reference Types: Reference types store references to their data, which is stored
    on the heap. Examples include classes, interfaces, arrays, and strings.


    string stringValue = "Hello, C#";


    Implicit and Explicit Type Conversion


    Implicit Type Conversion: Implicit conversion occurs when the compiler automatically
    converts one type to another without the need for explicit casting.


    int intValue = 42;


    float floatValue = intValue; // Implicit conversion


    Explicit Type Conversion: Explicit conversion requires the use of casting and
    may result in loss of data if the conversion is not safe.


    float floatValue = 42.5f;


    int intValue = (int)floatValue; // Explicit conversion


    Nullable Value Types


    Nullable value types allow value types to represent the absence of a value using
    the Nullable<T> structure.


    int? nullableInt = null;


    Type Inference (var and dynamic)


    var Keyword: The var keyword allows the compiler to infer the type of a variable
    based on the assigned value.


    var name = "John";


    dynamic Keyword: The dynamic type delays the determination of the type until runtime,
    allowing for dynamic typing.


    dynamic dynamicValue = 42;


    Generics in the Type System


    Generics introduce a way to create flexible and reusable code that operates on
    various data types.


    List<int> numbers = new List<int>();


    Boxing and Unboxing


    Boxing involves converting a value type to a reference type, and unboxing is the
    reverse operation.


    int intValue = 42;


    object boxedValue = intValue; // Boxing


    int unboxedValue = (int)boxedValue; // Unboxing


    Type Aliases (using Directive)


    Type aliases allow creating shorter names for types, improving code readability.


    using MyInt = System.Int32;


    MyInt myValue = 42;


    Understanding the C# type system is crucial for writing efficient and error-free
    code. Whether dealing with value types, reference types, generics, or type conversion,
    a solid grasp of these concepts enables developers to design robust and flexible
    applications. The type system provides a foundation for creating maintainable,
    scalable, and high-performance software solutions in C#.


    # 16\. Working with Strings and Regular Expressions


    Working with strings and regular expressions is a common and essential aspect
    of C# programming. String manipulation and pattern matching are frequently used
    tasks in various applications.


    Working with Strings


    String Declaration and Initialization:


    // String declaration and initialization


    string greeting = "Hello, C#!";


    String Concatenation:


    // String concatenation


    string firstName = "John";


    string lastName = "Doe";


    string fullName = firstName + " " + lastName;


    String Interpolation:


    // String interpolation


    string interpolatedGreeting = $"Welcome, {firstName}!";


    Common String Methods:


    // Common string methods


    string text = "   C# Programming   ";


    string trimmedText = text.Trim();


    string upperCaseText = text.ToUpper();


    string lowerCaseText = text.ToLower();


    String Comparison:


    // String comparison


    string apple = "apple";


    string orange = "orange";


    bool areEqual = String.Equals(apple, orange, StringComparison.OrdinalIgnoreCase);


    Regular Expressions


    Regular Expression Basics


    // Regular expression basics


    using System.Text.RegularExpressions;


    string input = "C# is powerful!";


    string pattern = @"\bC#\b";


    bool isMatch = Regex.IsMatch(input, pattern);


    Regular Expression Matching


    // Regular expression matching


    string input = "123-456-7890";


    string pattern = @"\d{3}-\d{3}-\d{4}";


    bool isPhoneNumber = Regex.IsMatch(input, pattern);


