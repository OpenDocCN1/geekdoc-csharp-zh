    \ 添加服务引用\n\n1. 打开一个新或现有的 C# 项目。\n2. 在 `Solution Explorer`（解决方案资源管理器）中右键点击项目。\n\
    3. 添加服务引用。\n* 选择 `\"Add\"` -> `\"Service Reference.\"。\n* 输入服务端点地址（例如，`http://localhost:8733/Design_Time_Addresses/WcfServiceLibrary1/Service1/`）并点击\
    \ `\"Go.\"。\n* 提供命名空间并点击 `\"OK.\"。\n\n### 使用生成的代理类\n\n* 在你的代码中，创建生成代理类的实例并调用服务方法。\n\
    \n```csharp\nusing (ServiceReference1.Service1Client client = new ServiceReference1.Service1Client())\n\
    {\n    string result = client.GetData(42);\n    Console.WriteLine(result);\n \
    \   ServiceReference1.CompositeType composite = new ServiceReference1.CompositeType\n\
    \    {\n        BoolValue = true,\n        StringValue = \"Hello\"\n    };\n \
    \   ServiceReference1.CompositeType resultComposite = client.GetDataUsingDataContract(composite);\n\
    \    Console.WriteLine($\"Result: {resultComposite.StringValue}\");\n}\n```\n\n\
    ### 运行客户端应用程序\n\n* 执行客户端应用程序并观察结果。\n\n在 C# 中创建和消费 WCF 服务允许开发者构建可扩展和互操作的分布式系统。服务合约定义了服务提供的操作，客户端可以生成代理类与服务进行交互。配置服务端点并使用生成的代理类使得在\
    \ C# 中构建和消费 WCF 服务变得简单。\n\n# 43. C# 与云计算 (Azure, AWS, GCP)\n\n`Azure`、`AWS` (Amazon\
    \ Web Services) 和 `GCP` (Google Cloud Platform) 等云平台提供了用于构建、部署和管理应用程序各种服务。本指南介绍了如何利用\
    \ C# 在这些平台上进行云开发。\n\n## 云计算简介\n\n### 关键云概念\n\n* `基础设施即服务 (IaaS)`：通过互联网提供虚拟化的计算资源。\n\
    * `平台即服务 (PaaS)`：提供一个包含基础设施、运行时和中间件组件的平台。\n* `软件即服务 (SaaS)`：以订阅方式通过互联网交付软件应用程序。\n\
    \n### 云服务模型\n\n* `计算服务`：虚拟机、容器和无服务器计算。\n* `存储服务`：Blob 存储、文件存储和数据库。\n* `网络服务`：虚拟网络、负载均衡器和内容分发。\n"
- fmt: "\n# XAML for UI\n`XAML` (eXtensible Application Markup Language) is used to\
    \ define the UI in a declarative way. It allows creating UI elements and defining\
    \ their properties.\n\n```xml\n<ContentPage xmlns=\"http://xamarin.com/schemas/2014/forms\"\
    \n             xmlns:x=\"http://schemas.microsoft.com/winfx/2009/xaml\"\n    \
    \         x:Class=\"MyApp.MainPage\">\n    <StackLayout>\n        <Label Text=\"\
    Welcome to Xamarin.Forms!\"\n               VerticalOptions=\"CenterAndExpand\"\
    \n               HorizontalOptions=\"CenterAndExpand\" />\n        <Button Text=\"\
    Click me\" Clicked=\"OnButtonClicked\" />\n    </StackLayout>\n</ContentPage>\n\
    ```\n\n# Data Binding\nXamarin.Forms supports data binding, allowing UI elements\
    \ to be dynamically updated based on changes to underlying data.\n\n```xml\n<Label\
    \ Text=\"{Binding WelcomeMessage}\" />\n```\n\n```csharp\npublic class MyViewModel\
    \ : INotifyPropertyChanged\n{\n    private string welcomeMessage;\n    public\
    \ string WelcomeMessage\n    {\n        get { return welcomeMessage; }\n     \
    \   set\n        {\n            welcomeMessage = value;\n            OnPropertyChanged(nameof(WelcomeMessage));\n\
    \        }\n    }\n    public event PropertyChangedEventHandler PropertyChanged;\n\
    \    protected virtual void OnPropertyChanged(string propertyName)\n    {\n  \
    \      PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(propertyName));\n\
    \    }\n}\n```\n\n# Xamarin.Native\n## Xamarin.iOS and Xamarin.Android\nFor platform-specific\
    \ requirements, Xamarin allows developers to write native code using `Xamarin.iOS`\
    \ for iOS development and `Xamarin.Android` for Android development.\n\n### Example\
    \ iOS\n```csharp\npublic class MyiOSViewController : UIViewController\n{\n   \
    \ public override void ViewDidLoad()\n    {\n        base.ViewDidLoad();\n   \
    \     var label = new UILabel\n        {\n            Text = \"Welcome to Xamarin.iOS!\"\
    ,\n            Frame = new CoreGraphics.CGRect(50, 50, 200, 20)\n        };\n\
    \        View.AddSubview(label);\n    }\n}\n```\n\n### Example Android\n```csharp\n\
    [Activity(Label = \"MyAndroidActivity\", MainLauncher = true, Icon = \"@mipmap/icon\"\
    )]\npublic class MyAndroidActivity : Activity\n{\n    protected override void\
    \ OnCreate(Bundle savedInstanceState)\n    {\n        base.OnCreate(savedInstanceState);\n\
    \        SetContentView(Resource.Layout.Main);\n        var label = FindViewById<TextView>(Resource.Id.myLabel);\n\
    \        label.Text = \"Welcome to Xamarin.Android!\";\n    }\n}\n```\n\n# Xamarin.Essentials\n\
    `Xamarin.Essentials` is a library that provides cross-platform APIs for common\
    \ device features. It simplifies accessing functionality such as camera, GPS,\
    \ contacts, and more.\n\n### Example: Geolocation\n```csharp\nvar location = await\
    \ Geolocation.GetLastKnownLocationAsync();\n```\n\n# Xamarin.Forms vs. Xamarin.Native\n\
    - `Xamarin.Forms`: Ideal for shared UI and business logic across platforms, suitable\
    \ for simpler apps.\n- `Xamarin.Native`: Suitable for apps with complex and platform-specific\
    \ UI requirements.\n\n# Xamarin Community and Tooling\nXamarin has an active community,\
    \ and developers can use `Visual Studio` with `Xamarin` extensions or `Visual\
    \ Studio Code` for development. `Xamarin.Forms` provides a range of pre-built\
    \ UI controls, and the community contributes to.\n\n# Unity Engine\nUnity is a\
    \ powerful engine for creating games using C#.\n\n## GameObject and Components\n\
    `GameObject` represents entities in the scene. `Transform` component manages position,\
    \ rotation, and scale. `Collider` component enables collision detection. `Rigidbody`\
    \ component adds physics behavior.\n\n## Physics and Animation\n### Physics in\
    \ Unity\nPhysics interactions. `Physics.Raycast` casts a ray to detect objects.\
    \ `Collision Events` are triggered when colliders interact.\n```csharp\nvoid OnCollisionEnter(Collision\
    \ collision)\n{\n}\n```\n\n### Animation in Unity\n`Animator` component controls\
    \ animations. `Animation Clips` define individual animations. `Blend Trees` blend\
    \ multiple animations based on parameters.\n\n## UI and User Input\n### Unity\
    \ UI System\n`Canvas`: Container for UI elements. `UI Text`, `Image`, `Button`:\
    \ Common UI components. `Event System` handles user input.\n\n### User Input in\
    \ Unity\n`Input` class captures user input. `Input Manager` provides configurable\
    \ settings for input.\n```csharp\nvoid Update()\n{\n    float horizontalInput\
    \ = Input.GetAxis(\"Horizontal\");\n    float verticalInput = Input.GetAxis(\"\
    Vertical\");\n}\n```\n\n## Scenes and Prefabs\n`Scenes`: Represent levels or sections\
    \ of Unity. `Prefabs`: Reusable game object templates.\n\n## C# Scripting\n`MonoBehaviour`:\
    \ The base class for Unity scripts. Lifecycle methods like `Start` and `Update`\
    \ called once per frame.\n```csharp\nusing UnityEngine;\n\npublic class MyScript\
    \ : MonoBehaviour\n{\n    void Start()\n    {\n    }\n    void Update()\n    {\n\
    \    }\n}\n```\n\n## Best Practices\n### Code Organization\n- `Separation of Concerns`:\
    \ Divide code into logical components.\n- `ScriptableObjects`: Store data independently\
    \ of `MonoBehaviour` instances.\n\n### Performance Optimization\n- `Object Pooling`:\
    \ Reuse objects instead of instantiating and destroying them.\n- `Batching`: Combine\
    \ multiple render calls into a single batch.\n\n## Collaborative Development\n\
    ### Version Control\n- `Unity Collaborate`: Unity's built-in version control.\n\
    - `Git`, `SVN`: External version control systems.\n\n### Tools\n- `Unity Collab`:\
    \ Cloud-based collaborative development.\n- `Photon Unity Networking (PUN)`: Multiplayer\
    \ networking solution.\n\n# Building and Deploying\n### Building for Platforms\n\
    - `Build Settings`: Configure target platforms.\n- `Build Process`: Generate executable\
    \ files for deployment.\n\n### Platforms\n- PC/Mac/Linux Standalone\n- iOS and\
    \ Android\n- WebGL\n- Console Platforms (PlayStation, Xbox)\n\n# 46. Machine Learning\
    \ and AI with ML.NET\n"
