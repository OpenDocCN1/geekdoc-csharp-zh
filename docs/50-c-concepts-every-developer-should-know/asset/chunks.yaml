    \ `WinForms` 和 `WPF` 之间进行选择取决于你正在开发的应用程序的具体需求和复杂性。\n\n# 35. 使用 ASP.NET 创建 Web\
    \ 应用程序\n\nASP.NET 是微软开发的一个用于构建动态 Web 应用程序的框架。它支持多种编程语言，包括 `C#`。本指南概述了如何使用模型-视图-控制器\
    \ (`MVC`) 模式使用 ASP.NET 创建 Web 应用程序。\n\n## ASP.NET MVC 简介\n\n### MVC 架构\n\n* `Model`（模型）：代表应用程序的数据和业务逻辑。\n\
    * `View`（视图）：显示用户界面并向用户呈现数据。\n* `Controller`（控制器）：处理用户输入、处理请求并管理模型与视图之间的数据流。\n\
    \n### 创建简单的 ASP.NET MVC \n\n创建一个新的 ASP.NET `MVC` 项目：\n\n1. 打开 `Visual Studio`。\n\
    2. 选择“创建新项目”。\n3. 选择“ASP.NET Web 应用程序”并选择“MVC”。\n\n理解项目结构：\n\n* `Models`：包含表示数据和业务逻辑的类。\n\
    * `Views`：包含用户界面组件。\n* `Controllers`：包含处理用户输入和请求的类。\n\n添加控制器：\n\n1. 右键点击 `Controllers`\
    \ 文件夹。\n2. 选择“添加” -> “控制器”。\n3. 选择“MVC 5 `Controller` - 空”并对其进行命名，例如 `HomeController`。\n\
    4. 实现处理请求的动作（方法）。\n\n```csharp\npublic class HomeController : Controller\n{\n\
    \    public ActionResult Index()\n    {\n        return View();\n    }\n}\n```\n\
    \n添加视图：\n\n* 右键点击 `Home` 文件夹内的 `Views` 文件夹。\n* 选择“添加” -> “视图”。\n* 为其命名，例如 `Index.cshtml`。\n\
    * 编写 HTML 并使用 Razor 语法显示动态数据。\n\n```html\n<h2>Welcome to ASP.NET MVC!</h>\n```\n\
    \n配置路由：\n\n* 打开 `App_Start` 文件夹中的 `RouteConfig.cs` 文件。\n* 定义路由将 URL 映射到控制器和动作。\n\
    \n```csharp\npublic class RouteConfig\n{\n    public static void RegisterRoutes(RouteCollection\
    \ routes)\n    {\n        routes.IgnoreRoute(\"{resource}.axd/{*pathInfo}\");\n\
    \        routes.MapRoute(\n            name: \"Default\",\n            url: \"\
    {controller}/{action}/{id}\",\n            defaults: new { controller = \"Home\"\
    , action = \"Index\", id = UrlParameter.Optional }\n        );\n    }\n}\n```\n\
    \n运行应用程序：\n\n* 按 `F5` 或使用“启动”按钮运行应用程序。\n* 在网络浏览器中访问应用程序，例如 `http://localhost:port/`。\n\
    \n## ASP.NET Core 和 Razor Pages\n\n### ASP.NET Core 简介\n\nASP.NET Core 是一个跨平台、高性能且开源的框架，用于构建现代、云和连接互联网的应用程序。它是\
    \ `ASP.NET` 的演进，并支持跨平台开发。\n\n### 创建简单的 ASP.NET Core Razor Pages 应用程序\n\n1. 创建一个新的\
    \ `ASP.NET Core Razor Pages` 项目：\n* 打开 `Visual Studio`。\n* 选择“创建新项目”。\n* 选择“ASP.NET\
    \ Core Web 应用程序”并选择“Razor Pages”。\n\n2. 理解项目结构：\n* `Pages`：包含 Razor Pages，类似于\
    \ `MVC` 中的视图。\n* `Model`：包含表示数据和业务逻辑的类。\n\n3. 添加一个 Razor Page：\n* 右键点击 `Pages`\
    \ 文件夹。\n* 选择“添加” -> “Razor 页”。\n* 为其命名，例如 `Index.cshtml`。\n\n4. 编写内容：\n* 打开 `Index.cshtml`。\n\
    * 编写 HTML 并使用 Razor 语法显示动态数据。\n\n```html\n<h2>Welcome to ASP.NET Core Razor Pages!</h2>\n\
    ```\n\n5. 运行应用程序：\n* 按 `F5` 或使用“启动”按钮运行应用程序。\n* 在 Web 浏览器中访问应用程序，例如 `http://localhost:port/`。\n\
    \n## ASP.NET Core 核心概念\n\n* **Middleware**（中间件）：用于处理请求和响应的软件组件。\n* **Dependency\
    \ Injection**（依赖注入）：允许将服务和依赖注入组件中，提高模块化和可测试性。\n* **ASP.NET Identity**：为应用程序添加登录功能，包括注册、密码恢复和角色授权。\n\
    \n# 36. 使用 Blazor 进行 Web 开发\n\nBlazor 是一个使用 `C#` 代替 JavaScript 构建交互式 Web 应用程序的框架。本指南提供了\
    \ Blazor 的概述。\n\n## 理解 Blazor\n\n### Blazor 托管模型\n\nBlazor 支持两种托管模型：\n\n* `Blazor\
    \ WebAssembly (Wasm)`：客户端模型，在浏览器中通过 `WebAssembly` 运行。\n* `Blazor Server`：服务端模型，通过\
    \ `SignalR` 向浏览器发送 UI 更新。\n\n### 组件与页面\n\n* `Components`：Blazor 应用程序的可复用构建块，可以相互嵌套。\n\
    * `Pages`：用于定义 Web 应用程序的特殊组件。\n* `Razor Syntax`：Blazor 使用 Razor 语法创建动态内容。该语法允许在\
    \ HTML 中嵌入 `C#` 代码。\n\n```html\n<!-- Blazor 组件中的 Razor 语法 -->\n<h1>Hello, @name!</h1>\n\
    \n@code {\n    string name = \"Blazor\";\n}\n```\n\n## 创建 Blazor \n\n### 创建 Blazor\
    \ WebAssembly 应用程序\n\n* 使用 `Visual Studio`：\n* 打开 `Visual Studio`。\n* 选择“创建新项目”。\n\
    * 选择“Blazor App”并选择“Blazor WebAssembly App”。\n\n* 使用 `.NET CLI`：\n* 打开命令行。\n*\
    \ 运行以下命令：\n\n```bash\ndotnet new blazorsasm -n MyBlazorApp\ncd MyBlazorApp\ndotnet\
    \ run\n```\n\n## Blazor 的关键特性\n\n* **代码共享**：`Blazor` 允许客户端和服务组件之间共享代码。共享代码可以包括模型、和服务和其他逻辑。\n\
    * **组件架构**：`Blazor` 应用程序基于组件架构构建，便于创建可复用的模块化 UI 组件。\n* **依赖注入**：`Blazor` 支持依赖注入，允许开发者将服务和依赖项注入组件。\n\
    * **Blazor WebAssembly**：`Blazor WebAssembly` 允许通过 `WebAssembly` 直接在浏览器中运行 `C#`\
    \ 代码，提供完整的客户端开发体验。\n* **实时通信**：`Blazor Server` 支持通过 `SignalR` 实现服务器与客户端之间的实时通信，实现实时更新和动态内容。\n\
    \n## Blazor 与其他框架对比\n\n* **Blazor vs. Angular/React/Vue**：`Blazor` 允许客户端和服务端使用\
    \ `C#`，而 `Angular`、`React` 和 `Vue` 主要是基于 JavaScript 的框架。\n* **Blazor vs. ASP.NET\
    \ MVC**：`Blazor` 是用于构建交互式 Web 应用程序的组件化框架，而 `ASP.NET MVC` 设计用于构建服务器渲染的 Web 应用程序。\n\
    \n"
- fmt: "\nBlazor is a versatile framework for web development, offering the benefits\
    \ of C# on both the client and server sides. Whether building web applications\
    \ with Blazor WebAssembly or leveraging the real-time capabilities of Blazor Server,\
    \ developers can create modern and interactive web experiences using familiar\
    \ tools and languages.\n\n# 37. Creating RESTful Services with Web API\n\nASP.NET\
    \ Web API is a framework for building HTTP services that can be consumed by a\
    \ variety of clients, including web browsers, mobile devices, and desktop applications.\
    \ This guide provides an overview of creating RESTful services with ASP.NET Web\
    \ API using C#.\n\n## Introduction to Web API\n\n### What is REST?\n\nRepresentational\
    \ State Transfer (REST) is an architectural style for designing networked applications.\
    \ RESTful services use standard HTTP methods (`GET`, `POST`, `PUT`, `DELETE`)\
    \ to perform operations on resources, and data is typically exchanged in JSON\
    \ or XML format.\n\n### Key Characteristics of RESTful Services\n\n* **Stateless**:\
    \ Each request from a client contains all the information needed to understand\
    \ and fulfill the request.\n* **Resource-Based**: Resources are identified by\
    \ URIs, and clients interact with resources using standard HTTP methods.\n* **Representation**:\
    \ Resources can have multiple representations, such as JSON or XML, and clients\
    \ can choose the representation they prefer.\n\n## Creating a Simple Web API\n\
    \n### Creating a New Web API Project\n\n#### Using Visual Studio:\n\n* Open Visual\
    \ Studio.\n* Select \"Create a new project.\"\n* Choose \"ASP.NET Core Web Application.\"\
    \n* Select \"API\" template and choose \"Create.\"\n\n#### Using .NET CLI:\n\n\
    * Open a command prompt.\n* Run the following commands:\n\n```bash\ndotnet new\
    \ webapi -n MyWebApi\ncd MyWebApi\ndotnet run\n```\n\n### Creating a Controller\n\
    \nAdd a new controller:\n\n* Right-click on the `Controllers` folder.\n* Select\
    \ \"Add\" -> \"Controller.\"\n* Choose \"API Controller - Empty\" and name it,\
    \ e.g., `ValuesController`.\n* Implement actions for handling HTTP methods.\n\n\
    ```csharp\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class ValuesController\
    \ : ControllerBase\n{\n    // GET api/values\n    [HttpGet]\n    public ActionResult<IEnumerable<string>>\
    \ Get()\n    {\n        return new string[] { \"value1\", \"value2\" };\n    }\n\
    \n    // GET api/values/5\n    [HttpGet(\"{id}\")]\n    public ActionResult<string>\
    \ Get(int id)\n    {\n        return \"value\";\n    }\n\n    // POST api/values\n\
    \    [HttpPost]\n    public void Post([FromBody] string value)\n    {\n      \
    \  // Handle POST request\n    }\n\n    // PUT api/values/5\n    [HttpPut(\"{id}\"\
    )]\n    public void Put(int id, [FromBody] string value)\n    {\n        // Handle\
    \ PUT request\n    }\n\n    // DELETE api/values/5\n    [HttpDelete(\"{id}\")]\n\
    \    public void Delete(int id)\n    {\n        // Handle DELETE request\n   \
    \ }\n}\n```\n\n### Running the Web API\n\nRun the application:\n\n* Press F5 or\
    \ use the \"Start\" button to run the application.\n* Access the API in a web\
    \ browser or using a tool like Postman.\n\nTest the API endpoints:\n\n* Use URLs\
    \ like `http://localhost:port/api/values` for `GET` requests.\n* Send `POST`,\
    \ `PUT`, and `DELETE` requests to corresponding endpoints.\n\n## Handling Data\
    \ in Web API\n\n### Model Classes: Create model classes to represent the data\
    \ that the API deals with.\n\n```csharp\npublic class Item\n{\n    public int\
    \ Id { get; set; }\n    public string Name { get; set; }\n}\n```\n\n### Using\
    \ Dependency Injection: Inject a service into the controller to handle data operations.\n\
    \n```csharp\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class ItemsController\
    \ : ControllerBase\n{\n    private readonly IItemService _itemService;\n\n   \
    \ public ItemsController(IItemService itemService)\n    {\n        _itemService\
    \ = itemService;\n    }\n\n    // GET api/items\n    [HttpGet]\n    public ActionResult<IEnumerable<Item>>\
    \ Get()\n    {\n        var items = _itemService.GetItems();\n        return Ok(items);\n\
    \    }\n\n    // GET api/items/5\n    [HttpGet(\"{id}\")]\n    public ActionResult<Item>\
    \ Get(int id)\n    {\n        var item = _itemService.GetItemById(id);\n     \
    \   if (item == null)\n        {\n            return NotFound();\n        }\n\
    \        return Ok(item);\n    }\n\n    // POST api/items\n    [HttpPost]\n  \
    \  public ActionResult<Item> Post([FromBody] Item item)\n    {\n        _itemService.AddItem(item);\n\
    \        return CreatedAtAction(nameof(Get), new { id = item.Id }, item);\n  \
    \  }\n\n    // PUT api/items/5\n    [HttpPut(\"{id}\")]\n    public IActionResult\
    \ Put(int id, [FromBody] Item item)\n    {\n        if (id != item.Id)\n     \
    \   {\n            return BadRequest();\n        }\n        _itemService.UpdateItem(item);\n\
    \        return NoContent();\n    }\n\n    // DELETE api/items/5\n    [HttpDelete(\"\
    {id}\")]\n    public IActionResult Delete(int id)\n    {\n        _itemService.DeleteItem(id);\n\
    \        return NoContent();\n    }\n}\n```\n\n### Service Interface and Implementation:\
    \ Define an interface for the service and provide an implementation.\n\n```csharp\n\
    public interface IItemService\n{\n    IEnumerable<Item> GetItems();\n    Item\
    \ GetItemById(int id);\n    void AddItem(Item item);\n    void UpdateItem(Item\
    \ item);\n    void DeleteItem(int id);\n}\n\npublic class ItemService : IItemService\n\
    {\n    private readonly List<Item> _items = new List<Item>\n    {\n        new\
    \ Item { Id = 1, Name = \"Item 1\" },\n        new Item { Id = 2, Name = \"Item\
    \ 2\" }\n    };\n\n    public IEnumerable<Item> GetItems()\n    {\n        return\
    \ _items;\n    }\n\n    public Item GetItemById(int id)\n    {\n        return\
    \ _items.FirstOrDefault(item => item.Id == id);\n    }\n\n    public void AddItem(Item\
    \ item)\n    {\n        item.Id = _items.Count + 1;\n        _items.Add(item);\n\
    \    }\n\n    public void UpdateItem(Item item)\n    {\n        var existingItem\
    \ = _items.FirstOrDefault(i => i.Id == item.Id);\n        if (existingItem !=\
    \ null)\n        {\n            existingItem.Name = item.Name;\n        }\n  \
    \  }\n\n    public void DeleteItem(int id)\n    {\n        var itemToRemove =\
    \ _items.FirstOrDefault(item => item.Id == id);\n        if (itemToRemove != null)\n\
    \        {\n            _items.Remove(itemToRemove);\n        }\n    }\n}\n```\n\
    \n### Securing Web API\n\n**Authentication and Authorization**: Secure your Web\
    \ API by implementing authentication and authorization mechanisms. ASP.NET Core\
    \ provides built-in support for authentication and authorization using various\
    \ schemes, such as JWT (JSON Web Tokens) and OAuth.\n\n**Role-Based Authorization**:\
    \ Implement role-based authorization to control access to specific endpoints based\
    \ on the user's role.\n\n```csharp\n[Authorize(Roles = \"Admin\")]\n[ApiController]\n\
    [Route(\"api/[controller]\")]\npublic class AdminController : ControllerBase\n\
    {\n    // Controller actions accessible only to users with the \"Admin\" role\n\
    }\n```\n\n# 38. Working with Databases using ADO.NET\n\nADO.NET (ActiveX Data\
    \ Objects for .NET) is a set of classes in the .NET Framework for accessing and\
    \ manipulating data from relational databases. This guide provides an overview\
    \ of working with databases using ADO.NET in C#.\n\n## Introduction to ADO.NET\n\
    \n### Key Components of ADO.NET\n\n* **Connection**: Manages the connection to\
    \ the database.\n* **Command**: Executes SQL queries or stored procedures.\n*\
    \ **DataReader**: Reads a forward-only stream of rows from a database.\n* **DataAdapter**:\
    \ Populates a DataSet with data and updates the database.\n* **DataSet**: Represents\
    \ an in-memory cache of data.\n* **DataTable**: Represents one table of in-memory\
    \ data.\n* **DataView**: Represents a databindable, customized view of a DataTable.\n\
    \n### ADO.NET Workflow\n\n**Establish Connection**: Open a connection to the database\
    \ using a `SqlConnection` object.\n\n**Execute Command**: Use a `SqlCommand` object\
    \ to execute SQL queries or stored procedures.\n"
