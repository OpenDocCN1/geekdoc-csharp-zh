    控制结构对于确定 C# 程序的流至关重要。掌握 if-else 语句和循环让你能够创建动态且响应的应用程序。\n\n# 5. 方法和函数\n\n在 C# 中，方法是执行特定任务的代码块，可以从程序的其他部分调用。方法促进了代码重用、可读性和模块化。\n\
    \n## 方法的声明与调用\n\n#### 方法声明\n```csharp\npublic class Calculator\n{\n    // 方法声明\n\
    \    public int Add(int a, int b)\n    {\n        return a + b;\n    }\n}\n```\n\
    \n#### 调用方法\n```csharp\nCalculator calculator = new Calculator();\nint result\
    \ = calculator.Add(3, 5);\nConsole.WriteLine(result); // 输出: 8\n```\n\n#### 方法参数\n\
    \n##### 必需参数\n```csharp\npublic class MathOperations\n{\n    public int Multiply(int\
    \ x, int y)\n    {\n        return x * y;\n    }\n}\n```\n\n##### 可选参数\n```csharp\n\
    public class Printer\n{\n    // 带有默认值的可选参数\n    public void PrintMessage(string\
    \ message, bool uppercase = false)\n    {\n        if (uppercase)\n        {\n\
    \            Console.WriteLine(message.ToUpper());\n        }\n        else\n\
    \        {\n            Console.WriteLine(message);\n        }\n    }\n}\n```\n\
    \n#### 返回类型\n\n##### 有返回值的方法\n```csharp\npublic class Circle\n{\n    public double\
    \ CalculateArea(double radius)\n    {\n        return Math.PI * radius * radius;\n\
    \    }\n}\n```\n\n##### Void 方法\n```csharp\npublic class Logger\n{\n    // Void\
    \ 方法（无返回值）\n    public void LogError(string errorMessage)\n    {\n        Console.WriteLine($\"\
    Error: {errorMessage}\");\n    }\n}\n```\n\n#### 方法重载\n方法重载允许你定义多个具有相同名称但不同参数列表方法。\n\
    \n```csharp\npublic class OverloadedMethods\n{\n    public int Add(int a, int\
    \ b)\n    {\n        return a + b;\n    }\n    public double Add(double a, double\
    \ b)\n    {\n        return a + b;\n    }\n}\n```\n\n#### 递归方法\n方法可以调用自己，创建一个递归函数。\n\
    \n```csharp\npublic class FactorialCalculator\n{\n    public int CalculateFactorial(int\
    \ n)\n    {\n        if (n == 0 || n == 1)\n        {\n            return 1;\n\
    \        }\n        else\n        {\n            return n * CalculateFactorial(n\
    \ - 1);\n        }\n    }\n}\n```\n\n方法和函数在构建 C# 程序结构中起着关键作用。它们允许你封装逻辑、提高重用性并增强代码的可读性。在你继续\
    \ C# 之旅时，掌握方法声明、参数处理以及理解返回类型将使你能够设计出稳健且模块化的应用程序。\n\n# 6. 类和对象\n\n在 C# 中，类是面向对象编程的基石。类是创建对象的蓝图，而对象是类的实例。这种范式允许你对现实世界的实体和行为进行建模。\n\
    \n#### 类声明\n\n##### 基础结构\n```csharp\npublic class Car\n{\n    // 字段（属性）\n    public\
    \ string Model;\n    public string Color;\n    // 构造函数\n    public Car(string\
    \ model, string color)\n    {\n        Model = model;\n        Color = color;\n\
    \    }\n    // 方法（行为）\n    public void Start()\n    {\n        Console.WriteLine($\"\
    {Color} is starting.\");\n    }\n    public void Drive()\n    {\n        Console.WriteLine($\"\
    {Color} is on the move.\");\n    }\n}\n```\n\n##### 创建对象（实例化）\n```csharp\nclass\
    \ Program\n{\n    static void Main()\n    {\n        // 创建对象\n        Car myCar\
    \ = new Car(\"Toyota\", \"Blue\");\n        Car anotherCar = new Car(\"Honda\"\
    , \"Red\");\n        // 访问字段\n        Console.WriteLine($\"My car is {myCar.Color}\
    \ {myCar.Model}.\");\n        // 调用方法\n        myCar.Start();\n        anotherCar.Drive();\n\
    \    }\n}\n```\n\n##### 构造函数\n构造函数是在对象创建时调用的特殊方法。它们初始化对象的的状态。\n\n##### 默认构造函数\n\
    ```csharp\npublic class Person\n{\n    public string Name;\n    // 默认构造函数\n  \
    \  public Person()\n    {\n        Name = \"John Doe\";\n    }\n}\n```\n\n#####\
    \ 参数构造函数\n```csharp\npublic class Book\n{\n    public string Title;\n    public\
    \ string Author;\n    // 参数构造函数\n    public Book(string title, string author)\n\
    \    {\n        Title = title;\n        Author = author;\n    }\n}\n```\n\n#####\
    \ 属性\n属性提供了对类字段的控制访问。\n\n```csharp\npublic class Student\n{\n    // 私有字段\n   \
    \ private int _age;\n    // 带有 get 和 set 访问器的公共属性\n    public int Age\n    {\n\
    \        get { return _age; }\n        set\n        {\n            if (value >=\
    \ 0 && value <= 120)\n            {\n                _age = value;\n         \
    \   }\n            else\n            {\n                Console.WriteLine(\"Invalid\
    \ age value.\");\n            }\n        }\n    }\n}\n```\n\n##### 封装\n封装是将数据（字段）和操作数据的方法封装在单个单元（类）中的实践。\n\
    \n```csharp\npublic class BankAccount\n{\n    private decimal _balance;\n    public\
    \ void Deposit(decimal amount)\n    {\n        _balance += amount;\n    }\n  \
    \  public void Withdraw(decimal amount)\n    {\n        if (amount <= _balance)\n\
    \        {\n            _balance -= amount;\n        }\n        else\n       \
    \ {\n            Console.WriteLine(\"Insufficient funds.\");\n        }\n    }\n\
    \    public decimal GetBalance()\n    {\n        return _balance;\n    }\n}\n\
    ```\n\n"
- fmt: "\nPolymorphism allows objects to be treated as instances of their base class,\
    \ even if they are actually instances of derived classes.\n\n### Method Overriding\n\
    \n```csharp\npublic class Cat : Animal\n{\n    // Method overriding\n    public\
    \ override void Eat()\n    {\n        Console.WriteLine(\"Cat is eating.\");\n\
    \    }\n}\n```\n\n### Using Polymorphism\n\n```csharp\nAnimal myAnimal = new Dog();\n\
    myAnimal.Eat(); // Calls the overridden Eat method in Dog class\nmyAnimal = new\
    \ Cat();\nmyAnimal.Eat(); // Calls the overridden Eat method in Cat class\n```\n\
    \n### Virtual and Override Keywords\n\n```csharp\npublic class Shape\n{\n    //\
    \ Virtual method\n    public virtual void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a shape.\");\n    }\n}\n\npublic class Circle : Shape\n{\n    // Override\
    \ method\n    public override void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a circle.\");\n    }\n}\n```\n\n### Abstract Classes and Methods\n\n```csharp\n\
    public abstract class Shape\n{\n    // Abstract method\n    public abstract void\
    \ Draw();\n}\n\npublic class Circle : Shape\n{\n    // Implementation of the abstract\
    \ method\n    public override void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a circle.\");\n    }\n}\n```\n\nInheritance and polymorphism are powerful\
    \ concepts that enhance the structure and flexibility of your C# code. Leveraging\
    \ these features allows you to build hierarchies of classes, create reusable code,\
    \ and design systems that can adapt to changing requirements.\n\n# 8. Interfaces\
    \ and Abstract Classes\n\nInterfaces and abstract classes are key components of\
    \ object-oriented programming in C#. They provide a way to define contracts for\
    \ classes, enforcing common behavior and ensuring consistency in your codebase.\n\
    \n### Interfaces\n\nAn interface is a contract that defines a set of methods and\
    \ properties that a class must implement. It allows for multiple inheritance,\
    \ enabling a class to implement multiple interfaces.\n\n#### Declaring an Interface\n\
    \n```csharp\npublic interface ILogger\n{\n    void LogMessage(string message);\n\
    \    void LogError(string errorMessage);\n}\n```\n\n#### Implementing an Interface\n\
    \n```csharp\npublic class ConsoleLogger : ILogger\n{\n    public void LogMessage(string\
    \ message)\n    {\n        Console.WriteLine($\"Message: {message}\");\n    }\n\
    \n    public void LogError(string errorMessage)\n    {\n        Console.WriteLine($\"\
    Error: {errorMessage}\");\n    }\n}\n```\n\n#### Using Interfaces\n\n```csharp\n\
    ILogger logger = new ConsoleLogger();\nlogger.LogMessage(\"Informational message\"\
    );\nlogger.LogError(\"Critical error\");\n```\n\n### Abstract Classes\n\nAn abstract\
    \ class is a class that cannot be instantiated on its own and may contain abstract\
    \ methods (methods without a body) that must be implemented by derived classes.\n\
    \n#### Declaring an Abstract Class\n\n```csharp\npublic abstract class Shape\n\
    {\n    // Abstract method\n    public abstract void Draw();\n    // Regular method\n\
    \    public void Move()\n    {\n        Console.WriteLine(\"Moving the shape.\"\
    );\n    }\n}\n```\n\n#### Implementing an Abstract Class\n\n```csharp\npublic\
    \ class Circle : Shape\n{\n    // Implementing the abstract method\n    public\
    \ override void Draw()\n    {\n        Console.WriteLine(\"Drawing a circle.\"\
    );\n    }\n}\n```\n\n#### Abstract Properties\n\n```csharp\npublic abstract class\
    \ Animal\n{\n    // Abstract property\n    public abstract string Species { get;\
    \ }\n    // Regular method\n    public void Eat()\n    {\n        Console.WriteLine(\"\
    Animal is eating.\");\n    }\n}\n```\n\n#### Using Abstract Classes\n\n```csharp\n\
    Shape myShape = new Circle();\nmyShape.Draw(); // Calls the overridden Draw method\
    \ in Circle class\nmyShape.Move(); // Calls the Move method from the abstract\
    \ class\n\nAnimal myAnimal = new Dog();\nConsole.WriteLine($\"Species: {myAnimal.Species}\"\
    ); // Calls the overridden property in Dog class\nmyAnimal.Eat(); // Calls the\
    \ Eat method from the abstract class\n\n### When to Use Interfaces and Abstract\
    \ Classes\n\nInterfaces: Use when you want to define a contract that multiple\
    \ classes can implement, regardless of inheritance.\nAbstract Classes: Use when\
    \ you want to provide a base class with shared functionality and enforce that\
    \ derived classes implement certain methods.\n\n# 9. Exception Handling\n\nException\
    \ handling is a critical part of writing robust and reliable C# applications.\
    \ By using try-catch blocks, throwing exceptions when necessary, and implementing\
    \ appropriate error-handling strategies, you can ensure that your code gracefully\
    \ handles unexpected situations.\n\n### Understanding Exceptions\n\nIn C#, an\
    \ exception is a runtime error that disrupts the normal flow of program.\n\n###\
    \ Try-Catch Blocks\n\nThe `try-catch` block is used to handle exceptions.\n\n\
    ```csharp\ntry\n{\n    // Code that may throw an exception\n    int result = 10\
    \ / int.Parse(\"0\");\n}\ncatch (DivideZeroException ex)\n{\n    // Handling specific\
    \ exception\n    Console.WriteLine($\"Error: {ex.Message}\");\n}\ncatch (Exception\
    \ ex)\n{\n    // Handling any other exception\n    Console.WriteLine($\"Unexpected\
    \ error: {ex.Message}\");\n}\nfinally\n{\n    // Code that always execute\n  \
    \  Console.WriteLine(\"This always executes.\");\n}\n```\n\n### Throwing Exceptions\n\
    \nYou can manually throw exceptions using the `throw` keyword. This is useful\
    \ when you want to indicate a certain condition or error has occurred.\n\n```csharp\n\
    public class Calculator\n{\n    public int Divide(int dividend, int divisor)\n\
    \    {\n        if (divisor == 0)\n        {\n            throw new DivideZeroException(\"\
    Cannot divide by zero.\");\n        }\n        return dividend / divisor;\n  \
    \  }\n}\n```\n\n### Custom Exceptions\n\nYou can create your own exception classes\
    \ by deriving from the `Exception` class. This allows you to define specific exception\
    \ types for your application.\n\n```csharp\npublic class CustomException : Exception\n\
