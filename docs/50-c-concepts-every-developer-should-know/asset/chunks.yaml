  raw: 'Polymorphism allows objects to be treated as instances of their base class,
    even if they are actually instances of derived classes.


    Method Overriding


    public class Cat : Animal


    {


        // Method overriding


        public override void Eat()


        {


            Console.WriteLine("Cat is eating.");


        }


    }


    Using Polymorphism


    Animal myAnimal = new Dog();


    myAnimal.Eat(); // Calls the overridden Eat method in Dog class


    myAnimal = new Cat();


    myAnimal.Eat(); // Calls the overridden Eat method in Cat class


    Virtual and Override Keywords


    public class Shape


    {


        // Virtual method


        public virtual void Draw()


        {


            Console.WriteLine("Drawing a shape.");


        }


    }


    public class Circle : Shape


    {


        // Override method


        public override void Draw()


        {


            Console.WriteLine("Drawing a circle.");


        }


    }


    Abstract Classes and Methods


    public abstract class Shape


    {


        // Abstract method


        public abstract void Draw();


    }


    public class Circle : Shape


    {


        // Implementation of the abstract method


        public override void Draw()


        {


            Console.WriteLine("Drawing a circle.");


        }


    }


    Inheritance and polymorphism are powerful concepts that enhance the structure
    and flexibility of your C# code. Leveraging these features allows you to build
    hierarchies of classes, create reusable code, and design systems that can adapt
    to changing requirements.


    # 8\. Interfaces and Abstract Classes


    Interfaces and abstract classes are key components of object-oriented programming
    in C#. They provide a way to define contracts for classes, enforcing common behavior
    and ensuring consistency in your codebase.


    Interfaces


    An interface is a contract that defines a set of methods and properties that a
    class must implement. It allows for multiple inheritance, enabling a class to
    implement multiple interfaces.


    Declaring an Interface


    public interface ILogger


    {


        void LogMessage(string message);


        void LogError(string errorMessage);


    }


    Implementing an Interface


    public class ConsoleLogger : ILogger


    {


        public void LogMessage(string message)


        {


            Console.WriteLine($"Message: {message}");


        }


        public void LogError(string errorMessage)


        {


            Console.WriteLine($"Error: {errorMessage}");


        }


    }


    Using Interfaces


    ILogger logger = new ConsoleLogger();


    logger.LogMessage("Informational message");


    logger.LogError("Critical error");


    Abstract Classes


    An abstract class is a class that cannot be instantiated on its own and may contain
    abstract methods (methods without a body) that must be implemented by derived
    classes.


    Declaring an Abstract Class


    public abstract class Shape


    {


        // Abstract method


        public abstract void Draw();


        // Regular method


        public void Move()


        {


            Console.WriteLine("Moving the shape.");


        }


    }


    Implementing an Abstract Class


    public class Circle : Shape


    {


        // Implementing the abstract method


        public override void Draw()


        {


            Console.WriteLine("Drawing a circle.");


        }


    }


    Abstract Properties


    public abstract class Animal


    {


        // Abstract property


        public abstract string Species { get; }


        // Regular method


        public void Eat()


        {


            Console.WriteLine("Animal is eating.");


        }


    }


    Using Abstract Classes


    Shape myShape = new Circle();


    myShape.Draw(); // Calls the overridden Draw method in Circle class


    myShape.Move(); // Calls the Move method from the abstract class


    Animal myAnimal = new Dog();


    Console.WriteLine($"Species: {myAnimal.Species}"); // Calls the overridden property
    in Dog class


    myAnimal.Eat(); // Calls the Eat method from the abstract class


    When to Use Interfaces and Abstract Classes


    Interfaces: Use when you want to define a contract that multiple classes can implement,
    regardless of their inheritance hierarchy.


    Abstract Classes: Use when you want to provide a common base class with shared
    functionality and enforce that derived classes implement certain methods.


    Interfaces and abstract classes are crucial tools for designing flexible and maintainable
    C# code. They allow you to create contracts, establish common behaviors, and structure
    your code in a way that promotes extensibility and reusability. As you explore
    more advanced topics in C#, you''ll find these concepts playing a vital role in
    creating well-organized and scalable software systems.


    # 9\. Exception Handling


    Exception handling is a critical aspect of writing robust and reliable code. It
    allows you to gracefully handle errors and unexpected situations that may arise
    during the execution of your C# programs.


    Understanding Exceptions


    In C#, an exception is a runtime error that occurs during the execution of a program.
    When an exception occurs, it disrupts the normal flow of the program and can be
    caught and handled by appropriate code.


    Try-Catch Blocks


    The try-catch block is used to handle exceptions. Code that might throw an exception
    is placed inside the try block, and the corresponding exception-handling code
    is placed inside the catch block.


    try


    {


        // Code that may throw an exception


        int result = 10 / int.Parse("0");


    }


    catch (DivideByZeroException ex)


    {


        // Handling specific exception


        Console.WriteLine($"Error: {ex.Message}");


    }


    catch (Exception ex)


    {


        // Handling any other exception


        Console.WriteLine($"An unexpected error occurred: {ex.Message}");


    }


    finally


    {


        // Code that will be executed regardless of whether an exception occurred


        Console.WriteLine("This code always executes, even if an exception occurred.");


    }


    Throwing Exceptions


    You can manually throw exceptions using the throw keyword. This is useful when
    you want to indicate that a certain condition or error has occurred.


    public class Calculator


    {


        public int Divide(int dividend, int divisor)


        {


            if (divisor == 0)


            {


                throw new DivideByZeroException("Cannot divide by zero.");


            }


            return dividend / divisor;


        }


    }


    Custom Exceptions


    You can create your own custom exception classes by deriving from the Exception
    class. This allows you to define specific exception types for your application.


    public class CustomException : Exception


    {


        public CustomException(string message) : base(message)


        {


        }


    }


    Exception Filters


    Exception filters allow you to catch exceptions based on a specific condition.
    This feature was introduced in C# 6.0.


    try


    {


        // Code that may throw an exception


        int result = 10 / int.Parse("0");


    }


    catch (DivideByZeroException ex) when (ex.Message == "Attempted to divide by zero.")


    {


        // Handling specific exception with a filter


        Console.WriteLine($"Error: {ex.Message}");


    }


    Global Exception Handling


    In larger applications, you may implement global exception handling to catch unhandled
    exceptions and log or display information about them.


    static void Main()


    {


        AppDomain.CurrentDomain.UnhandledException += GlobalExceptionHandler;


        // Rest of the application code


    }


    private static void GlobalExceptionHandler(object sender, UnhandledExceptionEventArgs
    e)


    {


        Exception exception = (Exception)e.ExceptionObject;


        Console.WriteLine($"Global Exception Handler: {exception.Message}");


    }


    Exception handling is a crucial part of writing robust and reliable C# applications.
    By using try-catch blocks, throwing exceptions when necessary, and implementing
    appropriate error-handling strategies, you can ensure that your code gracefully
    handles unexpected situations, improving the overall stability of your software.


    # 10\. C# Arrays and Lists


    Arrays and lists are fundamental data structures in C# that allow you to store
    and manipulate collections of elements. Understanding their usage is essential
    for working with structured data in your programs.


    Arrays


    Declaration and Initialization: Arrays in C# are fixed-size collections of elements
    of the same data type.


