    \ 访问元素\n\n### 访问元素\n```csharp\nint firstElement = numbers[0]; // 访问第一个元素 (索引 0)\n\
    ```\n\n## 遍历数组\n\n### 遍历数组\n```csharp\nforeach (int number in numbers)\n{\n  \
