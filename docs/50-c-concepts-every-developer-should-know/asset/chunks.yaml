        }


        // PUT api/items/5


        [HttpPut("{id}")]


        public IActionResult Put(int id, [FromBody] Item item)


        {


            if (id != item.Id)


            {


                return BadRequest();


            }


            _itemService.UpdateItem(item);


            return NoContent();


        }


        // DELETE api/items/5


        [HttpDelete("{id}")]


        public IActionResult Delete(int id)


        {


            _itemService.DeleteItem(id);


            return NoContent();


        }


    }


    Service Interface and Implementation: Define an interface for the service and
    provide an implementation.


    public interface IItemService


    {


        IEnumerable<Item> GetItems();


        Item GetItemById(int id);


        void AddItem(Item item);


        void UpdateItem(Item item);


        void DeleteItem(int id);


    }


    public class ItemService : IItemService


    {


        private readonly List<Item> _items = new List<Item>


        {


            new Item { Id = 1, Name = "Item 1" },


            new Item { Id = 2, Name = "Item 2" }


        };


        public IEnumerable<Item> GetItems()


        {


            return _items;


        }


        public Item GetItemById(int id)


        {


            return _items.FirstOrDefault(item => item.Id == id);


        }


        public void AddItem(Item item)


        {


            item.Id = _items.Count + 1;


            _items.Add(item);


        }


        public void UpdateItem(Item item)


        {


            var existingItem = _items.FirstOrDefault(i => i.Id == item.Id);


            if (existingItem != null)


            {


                existingItem.Name = item.Name;


            }


        }


        public void DeleteItem(int id)


        {


            var itemToRemove = _items.FirstOrDefault(item => item.Id == id);


            if (itemToRemove != null)


            {


                _items.Remove(itemToRemove);


            }


        }


    }


    Securing Web API


    Authentication and Authorization: Secure your Web API by implementing authentication
    and authorization mechanisms. ASP.NET Core provides built-in support for authentication
    and authorization using various schemes, such as JWT (JSON Web Tokens) and OAuth.


    Role-Based Authorization: Implement role-based authorization to control access
    to specific API endpoints based on the user''s role.


    [Authorize(Roles = "Admin")]


    [ApiController]


    [Route("api/[controller]")]


    public class AdminController : ControllerBase


    {


        // Controller actions accessible only to users with the "Admin" role


    }


    Creating RESTful services with ASP.NET Web API allows developers to build scalable
    and flexible web applications that can be consumed by various clients. Whether
    building a simple CRUD API or implementing more complex data operations, ASP.NET
    Web API provides the tools and conventions needed for designing RESTful services
    in C#.


    # 38\. Working with Databases using ADO.NET


    ADO.NET (ActiveX Data Objects for .NET) is a set of classes in the .NET Framework
    for accessing and manipulating data from relational databases. This guide provides
    an overview of working with databases using ADO.NET in C#.


    Introduction to ADO.NET


    Key Components of ADO.NET


    *   Connection: Manages the connection to the database.


    *   Command: Executes SQL queries or stored procedures.


    *   DataReader: Reads a forward-only stream of rows from a database.


    *   DataAdapter: Populates a DataSet with data and updates the database.


    *   DataSet: Represents an in-memory cache of data.


    *   DataTable: Represents one table of in-memory data.


    *   DataView: Represents a databindable, customized view of a DataTable.


    ADO.NET Workflow


    Establish Connection: Open a connection to the database using a SqlConnection
    object.


    Execute Command: Use a SqlCommand object to execute SQL queries or stored procedures.'
