    \ based on conditions. Two primary control structures are if-else statements and\
    \ loops.\n\n## If-Else Statements\n\nIf-else statements are used for conditional\
    \ execution. They allow your program to take different paths based on whether\
    \ a condition is true or false.\n\n### If Statement\n```csharp\nint num = 10;\n\
    if (num > 0) {\n    Console.WriteLine(\"The number is positive.\");\n}\n```\n\n\
    ### If-Else Statement\n```csharp\nint num = -5;\nif (num > 0) {\n    Console.WriteLine(\"\
    The number is positive.\");\n}\nelse {\n    Console.WriteLine(\"The number is\
