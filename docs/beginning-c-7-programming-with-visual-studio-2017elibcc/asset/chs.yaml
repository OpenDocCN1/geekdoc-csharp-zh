  \ .NET Standard 和 .NET Core\n\n## 跨平台基础和关键“必须掌握”术语\n\n跨平台程序是指运行在多个操作系统上的程序，其中操作系统可以是\
  \ Microsoft Windows、Android、Mac OS 和 Linux。目标是程序编写一次，在支持的操作系统上编译，并在部署时，代码在每个目标操作系统上的执行、性能和行为一致。这在历史上很难实现，即使使用像\
  \ `Mono` 或 `Java` 这样的开源库也是如此，并且如前，使用完整的 `.NET Framework` 并不可行。许多复杂性来自于跨平台代码接口应对操作系统服务（如磁盘\
  \ I/O、安全协议和网络访问）细微差异的方式。\n\n当程序员开始投入更多精力编写可以跨平台运行的 C# 代码时，请考虑这些许多必须掌握的概念和术语，以建立坚实的基础。这些关键术语在表\
  \ 18-1 中标识并描述。\n\n| 关键术语 |  |\n| --- | --- |\n| 硬件平台 | `X86`、`64-bit`、`Itanium`、`ARM`\
  \ 等 |\n| 软件平台 | 操作系统：Windows、Linux、Android、Mac OS、`iOS` 等 |\n\n\n\n\n\n| 跨平台 | 代码在编译为目标平台后，编写一次即可在任何支持的硬件和软件平台组合上运行\
  \ |\n| 生态系统 | 社区资源、开发工具和运行时软件的结合 |\n| 技术栈 | 共同用于构建和运行程序的硬件、软件和生态系统（例如：Windows 技术栈、Linux\
  \ 技术栈等） |\n| API | 应用程序编程接口（API），它暴露了类、委托、枚举、接口和结构，供其他程序调用。 |\n| 程序集 | 一个 `.dll`\
  \ 文件，暴露了可供其他程序集或可执行文件利用的 API |\n| 标准 | API 的正式规范，或称为契约 |\n| 垂直领域 | Windows Forms、ASP.NET、WPF、UWP\
  \ 等；通常称为应用模型 |\n| 框架/库 | 一组以程序集形式存在的包含性 API 集合，用于创建专注于特定垂直领域的程序 |\n| 开源 | 由软件开发者组成的开放社区编写并支持的框架和代码库。这些库可以根据特定开源库的许可证进行使用。\
  \ |\n| GitHub | 一个在线开源代码托管平台，用于共享、更新和分叉公开可用及社区支持的代码 |\n| 分叉 (Forking) | 也称为 `branch`（分支），但同时也意味着开发社区的分裂。它是现有源代码仓库的副本，用于开始新的独立开发。例如，.NET\
  \ Core 是 .NET Framework 的分支。 |\n| 版本 | 框架的每个版本都包含新的或增强的 API 以及可能的错误修复。 |\n| 语义版本化\
  \ | 一种描述更改规模和类型的格式概念：`[MAJOR].[MINOR].[PATCH]`。如果 `MAJOR` 主版本号变化，其影响比 `MINOR` 次版本变化更大。\
  \ |\n| 目标框架 | 程序所依赖的 API 集合，例如：`dotnet-sdk-2.0.4-win10-x64` |\n| TFM | 目标框架标识符（TFM）是目标框架的简缩版本，例如：`netstandard2.0`\
  \ 或 `netcoreapp2.0`。TFM 通常用于将程序指向特定的框架版本。 |\n| 依赖 | 程序编译或完成某任务所需的特定程序集组 |\n| 元数据\
  \ | 提供其他数据信息的数据，例如：创建日期、作者和文件大小 |\n| 包 | 一组程序集和元数据 |\n| 元包 | 一组相互依赖的包，但其本身没有库或程序集\
  \ |\n| NuGet | 适用于 .NET 的包管理器，帮助开发者创建和消费包 |\n| BCL | 基础类库（BCL，Base Class Libraries）是类、接口和值类型的常用集合。例如，`System.*`\
  \ 指令中的类、接口、方法和值类型。 |\n| PCL | 可移植类库（PCL，Portable Class Library）是一种可以在许多 .NET 垂直领域中运行而无需重新编译的类库。\
  \ |\n| 运行时 | 通用运行时（CLR）。CLR 管理内存分配（垃圾收集）、编译和执行。 |\n| CoreCLR | 与 CLR 相同但可以跨平台。这是\
  \ .NET Core 的通用语言运行时引擎。 |\n| CoreFX | .NET Core 的 `System.*` 命名空间，它们对运行时有强依赖。 |\n\
  | CoreRT | 类似于 CoreCLR 的运行时，但没有 JIT 编译器。程序通过 AOT 编译（参见 .NET Native），在此期间所有不必要的代码和元数据都会被移除。\
  \ |\n| .NET Native | 创建经 AOT 编译的原生代码，通常用于 UWP 开发 |\n\n**表 18‐1：** 跨平台关键术语\n\n在充分理解这些关键术语后，是时候进入名为\
  \ .NET Standard 和 .NET Core 的微软新型跨平台库和框架了。\n\n什么是 .NET STANDARD 以及为什么需要它？\n\n如图\
  \ 18‐1 所示，开发者和公司可以针对许多垂直领域或应用模型来让程序运行。例如，Windows Forms、ASP.NET 和 WPF 基于完整的 .NET\
  \ Framework，而 Windows Phone 使用 .NET Compact Framework，Universal Windows Apps（通用\
  \ Windows 应用）则基于 `.NET Native` 库。\n\n![一张显示 .NET Compact Framework、.NET Core、.NET\
  \ Microframework 等的示意图。](img/Image00218.jpg)\n\n**图 18‐1**\n\n图 18‐1 所示的 .NET Compact\
  \ Framework、.NET Core、.NET Microframework 等都包含了某些从完整 .NET Framework 分叉而来的基础类库（BCL）能力。\n\
  \n以 .NET Microframework 分支为例。该分支带有精简的 BCL，专门为在小型物联网（IoT）设备的限制内工作而创建，因为在这些硬件平台上，完整的\
  \ .NET Framework 占用空间太大，无法作为一个可行的库。该框架版本对于这些小型设备来说消耗了太多的驱动和内存空间。该分支的制作降低了尺寸和内存要求，以便在该平台上适配并运行。为了减小\
  \ .NET Microframework 的尺寸，移除了一些完整 .NET Framework 中常见的某些功能。这些被最小化和/或修改的能力需要开发者学习特定框架垂直领域\
  \ BCL 的细微差别。每个应用模型都有略有不同的需求，这就是从 .NET Framework 产生大多数分支的原因。\n\n在历史上，当开发者想要让程序在 Windows\
  \ PC 上运行、在 Windows Phone 上运行并作为通用 Windows 应用运行时时，需要为这三个垂直领域中的每个领域准备多个项目和源码。如前所述，在大多数情况下，功能的实现差异在每个垂直\
  \ BCL 中是不同的，特别是在安全、网络、远程调用、反射和文件访问等方面。这要求开发者需要学习、开发和支持每个垂直领域的 BCL 限制，这也为公司增加了额外成本。这些成本是由于必须对同一个程序的多个版本进行开发、测试、部署和支持而产生的。\n\
  \n同样注意图 18‐1，每个应用模型使用的 .NET Framework 运行时（Compact、Micro、Silverlight、Core 等）对于在目标垂直领域和平台上成功运行程序都是必需的。当开发者决定针对某个垂直领域时，会在\
  \ Visual Studio 中创建解决方案和项目时选择目标框架。因此，每个垂直领域将在其自己的运行时或虚拟机中执行，并针对目标应用模型进行编译、随相关组件一起部署，并使用\
  \ .NET Framework 支持的语言编程。在针对 .NET Standard 类库时也是如此。\n\n### 共享项目、PCL 和 .NET Standard\n\
  \n\n\n\n\n在后文中描述 `.NET Standard` 和可移植类库（`PCL`）之前，存在过*共享项目*（shared projects），在这些项目中，人们通常使用\
  \ `#if`、`#else` 和 `#endif` 指令来标识代码运行的软件或硬件平台，然后为该平台加载正确的程序集。例如，下面的代码段检查平台是否为 `.NET\
  \ Framework 4.0`。如果是，则引用 `System.Net`；如果不是，则引用 `System.Net.Http`。（该代码确实假设没有早于 4.0\
  \ 的 .NET Framework 版本。）在代码或类文件的后半部分，开发者 必须再次检查平台依赖项，并调用这些类中的方法以实现程序目标，例如使用 `WebClient()`\
  \ 或 `HttpClient()` 方法。这些方法处理传出或传入的 HTTP 请求和响应。这两个方法的实现方式根据所加载的 `.NET Framework`\
  \ 版本而有所不同。\n\n```\n #if NET40\n\n   using System.Net;\n\n#else\n\n   using System.Net.Http;\n\
  \n   using System.Threading.Tasks;\n\n#endif \n```\n\n除了软件运行时验证外，开发者还可以使用这些指令（`#if`、`#else`\
  \ 和 `#endif`）来确定不同的硬件平台并根据结果加载特定的二进制文件。\n\n```\n #if PLATFORM_X64\n\n   [DllImport(\"\
  BLIB64.dll\", CallingConvention=CallingConvention.Cdecl)]\n\n#else\n\n   [DllImport(\"\
  BLIB32.dll\", CallingConvention=CallingConvention.Cdecl)]\n\n#endif \n```\n\n使用\
  \ `#if`、`#else` 和 `#endif` 指令提供跨平台支持从来不是一种稳健、可扩展、可维护或易支持的方法。程序最终会有许多代码路径，当软件或硬件组件发生变化时，需要大量的更新和复杂的测试程序。随着针对多个垂直领域和平台的需求增加，市场迫切需要一种新的跨平台支持解决方案。由于这种需求，可移植类库（`PCL`）的概念应运而生。`PCL`\
  \ 在很大程度上解决了扩展性、维护、测试和支持性问题。在创建 `PCL` 时，开发者可以从目标垂直列表中进行选择（参见[图 18-2](https://example.org#text00023.html_c18-fig-0002)），工具（例如\
  \ `Visual Studio`）会为每个不同的应用模型生成特定 `BCL` 的 API。注意，你还可以安装额外的目标，如 `Xamarin`、`Unity`\
  \ 以及其他支持的完整版 `.NET Framework` 版本。\n\n![截图说明，显示创建 PCL 时，开发者可以从目标垂直列表中进行选择，工具（Visual\
  \ Studio）会生成 API。](img/Image00219.jpg)\n\n[**图 18-2**](https://example.org#text00023.html_R_c18-fig-0002)\n\
  \n如果你留在 Windows 栈和生态系统中，`PCL` 运行得良好。问题在于，Windows 操作系统具有该操作系统特有的功能。其中一个功能是注册表，其他操作系统要么没有注册表，要么有类似但差异很大的东西，导致无法与为读写\
  \ Windows 注册表而设计的 `PCL`get。此外，Windows 实现反射的方式与其他操作系统不同，并且在应用程序域（即 `AppDomain`）方面有不同的概念。`AppDomain`\
  \ 是进程内部的一层隔离。因此，使用 `PCL` 确实有助于解决为多个 Windows 垂直领域开发的问题，但无法实现完全的软件硬件跨平台支持。\n\n解决方案是结合\
  \ `.NET Core` 创建 `.NET Standard` 库。（`.NET Core` 的详情请见下一节）。`.NET Standard` 是一组 `.NET`\
  \ API，旨在用于所有 `.NET` 垂直领域。如[图 18-3](https://example.org#text00023.html_c18-fig-0003)\
  \ 所示，它替换了每个分支或框架垂直领域中所有各种 `BCL` 特定实现细节。`.NET Standard` 类库统一了所有 `.NET Framework`\
  \ 垂直领域的 `BCL`。\n\n![结合 .NET Core 创建 .NET Standard 库的图示性说明。](img/Image00220.jpg)\n\
  \n[**图 18-3**](https://example.org#text00023.html_R_c18-fig-0003)\n\n与 `PCL` 类似，在创建类期间，程序员选择要目标的\
  \ `.NET Framework` 分支（Compact、Micro、Silverlight、Core 等），而在创建 `.NET Standard` 类库时，选择的是\
  \ `.NET Standard` 目标版本。正如在接下来的“引用和目标框架”章节中详细讨论的那样，程序员根据所需的目标框架选择 `.NET Standard`\
  \ 版本，版本越高，应用程序模型可以运行的平台数量就越少。\n\n最后，`.NET Standard` `1.0` 暴露的 API 很少；但随着 `.NET Standard`\
  \ `2.0` 的发布，API 的数量增加到大约 `33,000` 个。你可以将这些 API 视为 `.NET Framework` 命名空间中的方法。支持的命名空间简要概述及其内部可用\
  \ API 的数量见[表 18-2](https://example.org#text00023.html_c18-tbl-0002)。\n\n| **命名空间**\
  \ | **API 数量** |\n\n| --- | --- |\n| `System` | 1,087 |\n| `System.Collections`\
  \ | 292 |\n| `System.Data` | 1,399 |\n| `System.IO` | 275 |\n| `System.Net` | 1,271\
  \ |\n| `System.Security.Authentication` | 11 |\n| `System.Web` | 32 |\n| `System.XML`\
  \ | 1,011 |\n\n[**表 18-2**](https://example.org#text00023.html_R_c18-tbl-0002)：.NET\
  \ Standard 2.0 命名空间和 API 数量摘要\n\n要查看 `.NET Standard` `2.0` 中可用 API 的详细列表，请查看此页面：[`https://github.com/dotnet/standard/blob/master/versions/netstandard2.md`](https://github.com/dotnet/standard/blob/master/versions/netstandard2.md)。`.NET\
  \ Standard` 类库的目的以及行业向更大的跨平台支持演进的历史现在应该已经明确了。但它仍然偏向 Windows，而这正是 `.NET Core` 框架出现的地方。\n\
  \n## 引用和目标框架\n\n决定哪个 `.NET Standard` 的关键因素是类库必须运行的平台和框架。如[表 18-3](https://example.org#text00023.html_c18-tbl-0003)\
  \ 所示，所选择的 `.NET Standard` 版本越高，可用的 API ([表 18-2](https://example.org#text00023.html_c18-tbl-0002)）就越多，但因此运行的平台越少。\n\
  \n| **框架** | | | | | |\n| --- | --- | --- | --- | --- |\n| `.NET Standard` | 1.1\
  \ | 1.2 | 1.4 | 1.5 | 2.0 |\n| `.NET Core` | 1.0 | 1.0 | 1.0 | 1.0 | 2.0 |\n| `.NET\
  \ Framework (.NET Core 2.0)` | 4.5 | 4.5.1 | 4.6.1 | 4.6.1 | 4.6.1 |\n| `Mono` |\
  \ 4.6 | 4.6 | 4.6 | 4.6 | 5.4 |\n| `Xamarin.iOS` | 10 | 10 | 10 | 10 | 10.14 |\n\
  | `Xamarin.Android` | 7.0 | 7.0 | 7.0 | 7.0 | 8.0 |\n| `UWP` | 10 | 10 | 10 | vNext\
  \ | vNext |\n\n想象这样一个场景：你的 `.NET Standard` 类库需要运行，目标是 `.NET Core` `1.0`、`.NET Framework`\
  \ `4.5.1` 和 `Xamarin.Android` `7.0` 框架。在这种情况下，`.NET Standard` 类库必须目标 `.NET Standard`\
  \ 版本 `1.2`，因为该版本支持所有这些框架。考虑一个其他框架保持不变，但 `.NET Framework` 需要目标为 `4.6.1` 的场景。因此，`.NET\
  \ Standard` 类库应该目标为版本 `1.4`。如果 `.NET Framework` 需要关注版本 `4.5`，请知道 `4.6.1` 中已存在 `4.5`\
  \ 的功能；因此不需要向下兼容，因为 API 已经包含在更高版本中了。\n\n\n\n\n\n.NET Standard 版本之间暴露的 API 有巨大差异。如表\
  \ 18‐2 所示，.NET Standard 2.0 中的 API 数量很大，大约有 33,000 个，而 1.0 版本暴露的 API 要少得多。因此，与目标\
  \ 2.0 相比，目标 1.0 获取执行程序所需 API 的概率较低。在许多情况下，这些“旧的”共享项目或 PCL（程序类库）针对较旧的 .NET Framework\
  \ 版本，而这些版本并未迁移到 .NET Standard。这意味着这些项目中的代码将无法运行，因为这些 API 不存在、发生了巨大变化，或者根本不受支持。\n\
  \n# 什么是 .NET CORE？\n\n在前面的章节中，你已经了解到 .NET Standard 是一个用于所有 Windows 应用程序垂直领域的类库，其中一个垂直领域就是\
  \ .NET Core。.NET Core 是完整且功能丰富的 .NET Framework 的分支，并且是跨平台开源的。此外，.NET Core 针对云平台（如\
  \ Microsoft Azure）进行了优化，具有极高的性能、模块化特征，并采用了真正的自包含部署模型。\n\n.NET Core 框架是微软开发垂直领域的最新新增，注定成为未来所有开发的首选框架。\n\
  \n在接下来的“尝试一下”中，你将安装 .NET Core 2.0，它额外包含了 .NET Standard 2.0。\n\n本章的剩余部分将讨论使 .NET\
  \ Core 2.0 成为微软新领域的特定元素。\n\n## 跨平台\n\n如表 18‐1 所示，`cross platform`意味着代码编写一次，即可在任何支持的硬件和软件平台上运行。尽管如此，仍需要针对特定的硬件和软件平台为这些特定平台编译代码并包含特定的运行时。然而，代码只需要编写一次。如图\
  \ 18‐5 所示，可以下载 Windows (x64)、Windows (x86)、MacOS 和 Linux 的 .NET Core 2.0 SDK。\n\n\
  要在 Windows、MacOS 或 Linux 上使用 .NET Core SDK，你需要一台运行其中一种操作系统的计算机，以及一个支持 .NET Core\
  \ SDK 以供你的代码使用的 IDE。用于 .NET Core 开发非常流行的 IDE 是 Visual Studio Code，可以从 `https://code.visualstudio.com`\
  \ 下载（参见图 18‐6）。Visual Studio Code 具有强大的调试功能并支持 IntelliSense。\n\n![截图插图，显示一个用于 .NET\
  \ Core 开发非常流行的 IDE 是 Visual Studio Code，可以从 https://code.visualstudio.com 下载](img/Image00223.jpg)\n\
  \n**图 18‐6**\n\n书中到为止的练习使用了 Visual Studio Community。由于这是一本以微软为核心的书籍，Visual Studio\
  \ Community 将被继续使用，因为练习是在运行 Windows 操作系统的计算机上执行的。但请不要怀疑，在 Windows 计算机上使用针对 windows\
  \ 的 .NET Core 框架编写的代码，可以在 Mac 或 Linux 机器上进行编译并在那里执行。\n\n有一个已经讨论过但值得再次提及的话题是：特定于操作系统的功能（例如存在于\
  \ `System.IO` 命名空间中的功能）必须针对目标操作系统编译编译的 `System.IO.dll` 进行编译。因此，如果你在 Linux 计算机的 Visual\
  \ Studio Code 中创建一个项目并包含 `System.IO` 命名空间，它将是 Linux OS 运行所需的那个。在本节稍后解释的 NuGet 将帮助确保你的项目获得正确的二进制平台版本。\n\
  \n## 开源\n\n.NET Core 框架的源代码位于 `https://github.com/dotnet/core`。任何开发者（或任何能阅读代码的人）都可以查看它并具体了解它的功能。此外，个人还可以与其他协作，搜索、识别甚至修复代码中的错误或问题。注意，完整\
  \ .NET Framework 的源代码可以在 `http://referencesource.microsoft.com` 找到，但它不是开源的，因此无法对其进行分支，也无法构建/编译该完整框架的版本。不要假设你需要克隆或下载\
  \ .NET Core GitHub 仓库并进行构建和编译才能使用它。如之前所述（参考图 18‐5），可以下载并安装由微软创建的稳定编译版本。\n\n如果在 .NET\
  \ Core 源代码中发现某个方法或类缺失，或者你的应用程序为了优化运行需要某些内容（这就是开源的酷之处）——你可以添加它。在创建分支时，添加代码优化并让社区知道已完成。如果优化被接受，它就可以被放入主分支并包含在下一个版本中。如果优化未被接受，也可以将其编译并构建一个版本。最后，通过使\
  \ .NET 框架开源，微软真正参与了开发者和设计师的开放社区，为他们提供了贡献和职业发展的绝佳机会。\n\n## 针对云优化\n\n回顾第 16 章，该章节讨论了针对云的栈。定义云优化栈的属性是：\n\
  \n*   可移植性\n*   可扩展性\n*   紧凑性\n*   模块化（侧边执行）\n*   弹性\n\n.NET Core 是可移植的，并且完全跨平台。与\
  \ .NET Framework 相比，它也具有可扩展性。当 .NET Core 程序编译时，所需的二进制文件被封装在程序集或执行文件中，使其非常便于复制和运行。由于代码是完整\
  \ .NET Framework 的分支（后者是一个经过时间测试和高度工程化的库），代码对瞬态故障具有弹性。有关方面的更多信息，请参考第 16 章](#text00023.html_Page_533)\
  \ 中的“云模式和最佳实践”部分。\n\n## 性能\n\n与完整的 .NET Framework 相比.NET Core 提供了许多性能改进。许多优化想法来自开源社区。现在，开发者不再绕过性能问题，而是查看导致速度缓慢的源代码并进行优化。检查\
  \ COREFX 和 CORECLR GitHub 仓库中包含“performance”的请求，你会发现数以千计的变化。某些示例如表 18‐4 所示。\n\n\
  | **命名空间 / 模块** | **性能提升** |\n| --- | --- |\n| `System.Runtime.Serialization` |\
  \ 12x |\n| `System.Security.Cryptography` | 2x |\n| `System.IO.Compression` | 4x\
  \ |\n| `System.Linq` | 高达 30x |\n| `System.Collections.Concurrent.CollectionBag<T>`\
  \ | 30% |\n| `System.Collections.Generic.List<T>` | 25% |\n| `System.Collections.Generic.SortedSet<T>`\
  \ | 600x |\n| `System.Collections.Generic.Queue<T>` | 2x |\n| `System.Text.RegularExpressions`\
  \ | 25% |\n\n\n\n\n\n# 表 18‐4 : .NET Core 相对于 .NET Framework 的性能改进\n\n已经有了许多优化，随着越来越多的开发者和公司采用并对其贡献，该库将继续变得越来越好。访问\
  \ [`https://blogs.msdn.microsoft.com/dotnet/2017/06/07/performance‐improvements‐in‐net‐core/`](https://blogs.msdn.microsoft.com/dotnet/2017/06/07/performance&#8208;improvements&#8208;in&#8208;net&#8208;core/)\
  \ 可以讨论 .NET Core 的性能改进。\n\n## 模块化设计\n\n当创建一个新的 .NET Core 2.0 项目时（这将在接下来的“尝试试用”章节中完成），该项目包含一组“标准”依赖项，当你展开依赖项\
  \ ![image](img/Image00008.gif) SDK ![image](img/Image00008.gif) `Microsoft.NetCore.App`\
  \ 时，所示如 图 18‐7。虽然项目包含 100 多个程序集，但在编译时，只有程序运行所需且被引用的程序集会被包含在程序或可执行文件中。\n\n![一个新的\
  \ .NET Core 2.0 项目的截图说明，当我们展开依赖项&#10154;SDK &#10154;Microsoft.NetCore.App 时，包含一组“标准”依赖项。](img/Image00224.jpg)\n\
  \n**图 18‐7**\n\n.NET Core 通过一组 NuGet 包交付。 “标准”或默认项目程序集的存在是为了支持某些场景，例如，开发者的计算机没有连接到互联网，因此无法下载和安装基础\
  \ NuGet 包。然而，这些默认程序集确保了在创建 .NET Core 2.0 项目后，不会在取得进展时遇到阻碍。\n\n在接下来的“尝试试用”中，你将创建一个控制台应用程序\
  \ (.NET Core) 并使用 NuGet 添加一个不属于默认项目程序集的 .NET Core 包。\n\n使用具命的程序集和版本号通过 NuGet 安装包是\
  \ .NET Core 实现模块化的原因。这种模块化设计对下一节中讨论的应用程序部署和框架更新功能具有巨大影响。\n\n## 自包含部署模型\n\n完整的 .NET\
  \ Framework 通常被安装在运行开发者创建的程序的计算机或服务器上。这样做的好处是框架只需安装一次，所有应用程序都可以根据需要引用和使用该框架，从而节省本地存储空间。然而，当所有应用程序引用相同的框架程序集并且执行了意外更新时，可能会发生不利的情况，破坏某些代码功能。\n\
  \n在完整 .NET Framework 的背景下，有两种可区分的升级类型。它们并存（side-by-side）和原地（in-place）升级。并存是主版本的更改。例如，安装\
  \ .NET Framework 2.0 和 .NET Framework 4.0 将支持目标为 2.0 或 4.0 的程序。当 CLR 和框架组件有重大修改或优化时，这种情况很常见。如果安装了目标为\
  \ .NET Framework 2.0 和 .NET Framework 4.0 的程序，受影响的风险很小，因为它是并存安装。相比之下，原地升级（例如从 .NET\
  \ Framework 4.5 升级到 .NET Framework 4.6.2）可能会包含对 `mscorlib.dll` 以及其他 .NET 程序集的更改，这些程序集会在目标为\
  \ .NET Framework 4.x 的程序运行时运行。\n\n.NET Core 通过自包含解决了这个问题。这意味着目标为 .NET Framework\
  \ 4.x 的程序运行时，`mscorlib.dll` 和其他 .NET 程序集的更改可能会包含。\n\n\n\n\n微软创建了一个名为 `API Portability\
  \ Analyzer` 的工具。该工具可以分析程序及其程序集，然后生成一份报告，识别出程序中使用的任何尚未属于 .NET Core 框架的 API。你可以从 [`https://github.com/Microsoft/dotnet‐apiport/`](https://github.com/Microsoft/dotnet-apiport/)\
  \ 下载该工具。该报告可以作为代码迁移到 .NET Core 的起点。\n\n从 .NET Framework 迁移到 .NET Core 时，还需要考虑其他几点：\n\
  \n*   识别任何第三方依赖\n*   了解哪些功能是不可用的\n*   升级当前的 .NET Framework 目标版本\n*   为程序选择目标平台\n\
  \n### 识别第三方依赖\n\n如前所述，.NET Core 框架跨平台（Windows、Linux、MacOS）并支持跨多个芯片组（x64、x86、ARM）运行。`.NET\
  \ Core` 程序集的设计在针对这些目标进行编译时，能够在这些平台上运行和工作。然而，这并不意味着项目中所包含的所有程序集都是如此的。可能某个第三方包仅支持在\
  \ 32 位（x86）进程模式下运行，或者没有适用于 Linux 操作系统运行的包。在这种情况下，开发者必须找到替代方案，或者联系第三方询问是否有提供此类支持的计划。\n\
  \n### 了解哪些功能是不可用的\n\n如果第三方程序集利用 Windows 操作系统特定的技术，如 `AppDomains`、`Remoting`、`File\
  \ Access` 等，那么包含的第三方程序集将无法按预期运行。这里有一个不支持的 API 列表：[`https://github.com/dotnet/corefx/wiki/ApiCompat`](https://github.com/dotnet/corefx/wiki/ApiCompat)。通过对比此列表并对\
  \ .NET Framework 程序中的代码进行审查，你可以更深入地了解迁移到 .NET Core 的工作量可行性，并意识到跨平台运行的收益。\n\n###\
  \ 升级当前的 .NET Framework 目标\n\n除了将开发 IDE 升级到至少 `Visual Studio 2017` 之外，计划迁移到 .NET\
  \ Core 的个人或团队还应该考虑目标最高 .NET Framework 版本。目前，在 .NET Core 1.1 SDK 中运行时，NET Core 支持的最高\
  \ .NET Framework 版本是 `.NET Framework 4.6.2`。对于 .NET Core 2.0，最高支持的版本是 `4.6.1`。请参见\
  \ 表 18‐3 的摘要，或在此查看完整列表：[`https://docs.microsoft.com/en‐us/dotnet/standard/net‐standard`](https://docs.microsoft.com/en‐us/dotnet/standard/net-standard)。\n\
  \n通过这种方式升级可以确保程序中的大部分代码对于之前的 .NET Framework 目标都有支持的 .NET Core API。如果由于某些原因，原始程序中的\
  \ API 在 .NET Core 项目中不存在，有以下几种选项：\n\n*   参考上一节，“了解哪些功能是不可用的”。\n*   确认 `ApiPort`\
  \ 报告中已识别该 API。\n*   保留当前的框架版本，直到该 API 被添加。回想 表 18‐2，API 正在不断添加中。\n*   寻找替代 API、第三方程序集或有助于解决问题并满足要求的\
  \ `NuGet` 包。\n\n### 为程序选择目标平台\n\n.NET Core 一个新颖且令人兴奋的功能是它是跨平台的。迁移过程的很大一部分是决定目标目标平台：Windows、Mac、Linux\
  \ 还是三者兼顾？你应该认真考虑将大部分代码放入 `.NET Standard` 类库中。这样做可以为开发者和公司提供最大的机会，使其能够在多个 Windows\
  \ 应用垂直领域中同时运行该代码并跨平台执行。\n\n结论是，`.NET Standard` 是一个类库，用于编写可以跨多个应用垂直领域运行的 BCL（基础类库）。这些垂直领域之一是\
  \ .NET Core，它是跨平台且开源的。.NET Core 的模块化设计通过使用 `NuGet` 包有助于减小占用大小，并针对在云平台上运行进行了进一步优化。启动新项目的开发者应该认真考虑将这一领域视为编程的未来，因为它可以在许多垂直领域和许多平台上运行。\n\
  \n## ![image](img/Image00002.gif) 你在本章中学到的知识\n\n| **主题** | **核心概念** |\n| --- | ---\
  \ |\n| 关键跨平台术语 | 请参 表 18‐1 获取你应该了解的重要跨平台术语列表。 |\n| .NET Standard APIs | 在 .NET Framework\
  \ 命名空间中的一组类和方法，供跨平台或跨垂直程序内部使用。 |\n| 目标 | 版本越高，平台越少，但 API 越多；这是一种权衡。 |\n| .NET Core\
  \ | 一种跨平台且开源的编程领域。 |\n| 开源 | 由开放开发者社区编写并支持的代码或框架。 |\n| NuGet 包 | 一种安装程序依赖的模块化方法。与创建程序集引用相反，请直接安装程序集的\
  \ NuGet。 |\n\n# 19 ASP.NET 和 ASP.NET Core\n\n## WEB 应用概述\n\nWeb 导致 Web 服务器向客户端发送\
  \ HTML 和 JavaScript。\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\
  \n\n\n当解决方案架构师或程序员决定运行其程序的最佳平台是网站后，下一个问题就是目标是哪个版本的 ASP.NET。微软 Web 开发平台的第一个迭代是 Active\
  \ Server Pages（简称 ASP）。ASP 使用包含在 `.asp` 文件中的类似剃片（razor）的语法，并且通常包含一个使用 `Service.CreateObject()`\
  \ 进行初始化的嵌入 VB COM 对象，该对象提供了通过 API 暴露的方法引用。尽管 ASP 仍然是一项受支持的技术，但它不会是创建任何新基于 Web 的程序的推荐类型。\n\
  \n当 .NET Framework 在 21 世纪初 00 年代创建时，ASP 的自然演进是在更新 ASP 时利用该框架，并将其重命名为 ASP.NET。主要的变化是表示层（`.aspx`\
  \ 文件）与业务逻辑层（`aspx.cs` 或 `aspx.vb` 文件）的分离，这通常被称为 `code-behind`（代码后）。代码后中支持的语言是 C#\
  \ 和 VB.NET，而 ASP.NET 模型被称为 Web Forms（表单）。ASP.NET Web Forms 过去是、现在仍然是针对 IIS 和 Windows\
  \ Server 操作系统创建功能丰富且高度复杂的应用程序的有效且完全支持的技术。在多年的工程和功能改进中，事实证明 ASP.NET Web Forms 有些“沉重”。“沉重”的具体含义稍后描述，但这种“沉重”的标签导致了一种新\
  \ ASP.NET 版本的开发，被称为 ASP.NET MVC。\n\nASP.NET MVC 中的 MVC 代表“模型-视图-控制器”（Model-View-Controller）。如之前所述，ASP.NET\
  \ Web Forms 将 ASP 代码拆分为两个不同的层：表示层和业务逻辑层。现在，MVC 将其拆分为第三层，这三层分别是：\n\n*   `Model` —\
  \ 业务层\n*   `View` — 表示层\n*   `Controller` — 输入控制层\n\nASP.NET MVC 是从 ASP.NET Web\
  \ Form 模型的逻辑演进，但请注意 ASP.NET MVC 在设计、支持概念和实践方面显著不同。某些具有 ASP.NET Web Form 背景的程序员在开始时可能认为这些变化具有挑战性，但在深入研究并使用该模型后，清晰感就会开始生根。在本章详细讨论每个\
  \ ASP.NET 版本的章节中会有更多相关介绍。\n\nASP.NET 家族最近新增成员是 ASP.NET Core，它与 .NET Core 对齐，就像 ASP.NET\
  \ 对齐 .NET Framework 一样。ASP.NET Core 与 .NET Core 都是开源框架和平台，可以针对 Microsoft Windows\
  \ 以外的操作系统，例如 Linux 和 MacOS。ASP.NET Core 支持 Web Applications 和 Web Applications（模型-视图-控制器）项目类型。ASP.NET\
  \ Core Web Applications 类似于 ASP.NET Web Pages 版本，为小型网站的程序员提供了更简单、不复杂的实现；而 ASP.NET\
  \ Core Web Applications (MVC) 为跨平台运行 Web 应用程序提供了完整的 MVC 能力。\n\n总结来说，ASP.NET Web\
  \ API 就像一个暴露 API 的 `.dll`。它没有表示层，只有调用暴露的 API 方法并传递所需参数的功能。API 方法调的结果是一个字符串，在 ASP.NET\
  \ Web API 的语境下，该字符串是 JSON 格式。调用客户端随后需要解析并以可用的形式呈现 JSON 数据。现在已经描述了微软 Web 应用程序框架的进展和演变，请继续阅读以了解为什么要使用其中一个而不是另一个。\n\
  \n### ASP.NET Web Forms\n\n选择 ASP.NET Web Forms 而不是其他框架的原因是 Web Forms ：\n\n*   最适合中小型开发团队和项目\n\
  *   对于需要在 HTTP 上维护会话（session）和状态的 Web 应用程序有用\n*   基于一组非常主动的请求流水线事件\n\n与其它 ASP.NET\
  \ 版本相比，ASP.NET Web Forms 是快速开发和部署功能丰富且高性能 Web 应用程序的最佳且最简单的方法。表示逻辑与业务逻辑之间的分离与前端、用户界面开发者和代码编写者的目标技能集高度契合。这是最优的，因为团队可以由专家并行处理项目的各个方面。\n\
  \nASP.NET Web Forms 通常被认为是“沉重的”，是因为一个名为 `viewstate` 的功能。`viewstate` 是 ASP.NET Web\
  \ Form 中维护状态的一种方式。例如，考虑一个需要完成一系列页面并提交以订单的 Web 应用程序。如果客户端在过程中的某处点击了后退按钮，`viewstate`\
  \ 是让上一个表单的内容重新填充入最初输入的值的方式。`viewstate` 功能的问题在于它可能被滥用（即过度使用），导致页面大小变得非常大，并在客户端和服务器之间来回。此外，`viewstate`\
  \ 默认对 `Page` 启用，而不是只在需要维护状态的 页面控件上启用。\n\n避免 `viewstate` 问题的最佳方法是在 `Page` 级别通过将 `EnableViewState`\
  \ 属性设置为 `false` 来禁用它。如果你接需要在 `TextBox` 上维护状态（例如），请使用以下代码段专门启用它。此外，监控 `.aspx` 文件的大小，以确保它们不会变得太大。\n\
  \n```\n<asp:TextBox EnableViewState=\"true\" ID=\"Name\"  runat=\"server\"/>\n```\n\
  \n在没有会话（session）的情况下是不可能维护状态的。维护会话来自客户端计算时代的概念，当时计算机和服务器之间的连接是持久的。HTTP 协议与无状态等同，它最适用于静态（即非动态）内容。\n\
  \nASP.NET Web Forms 是动态的，因为有代码后文件（例如 `Default.aspx.cs`）中的 C# 代码，它在文件被请求时执行。返回给浏览器的\
  \ HTML 通常由执行的 C# 代码根据客户端/用户的输入进行更改。使用以下语法在会话存储信息：\n\n```\nSession[\"username\"]\
  \ = TextBoxUID.Text;\n```\n\n然后可以使用代码在后续的 HTTP 请求中访问名为 `username` 的会话变量：\n\n```\n\
  var username = Session[\"username\"];\n```\n\n最后，ASP.NET Web Forms 执行过程中的事件（例如 `BeginRequest`、`AuthenticateRequest`、`Init`、`Load`、`ProcessRequest`\
  \ 和 `EndRequest` 等）在命名上完全直观。这很重要，因为当程序员想要对客户端采取某些特殊操作或在请求完成之前清理任何数据时，很容易找到代码的位置。\n\
  \n### ASP.NET MVC\n\n选择 ASP.NET MVC 而不是其他 ASP.NET 类型的一些原因是它：\n\n*   适合更大更复杂的 Web\
  \ 应用程序\n*   与 Entity Framework (EF) 和模型绑定紧耦合\n*   与测试驱动开发 (TDD) 深度集成\n\n之前提到 Web\
  \ Forms 被拆分为两个独立的模块，而 ASP.NET MVC 被拆分为三部分：模型、视图和控制器（参见 图 19-2 ）。由于帮助 ASP.NET Web\
  \ Forms 的相同原因，这种分离也有助于 ASP.NET MVC。组件的分离允许大型团队根据专业化分工并并行处理应用程序，从而产生更快的开发周期。\n\n\n\
  \n\n\n![ASP.NET MVC 分为三个模块的示意图：模型 Model、视图 View 和控制器 Controller。](img/Image00233.jpg)\n\
  \n**图 19-2**\n\nEntity Framework (EF) 是一种对象关系映射（ORM）技术，在第 23 章中讨论过，它与 ASP.NET MVC\
  \ 架构和模型绑定紧密耦合。ORM（因此 EF）赋予了开发者以面向对象的方式设计数据库。例如，如果一个 ASP.NET MVC 应用程序旨在存储关于人员的信息，那么像下面的\
  \ `Person` 类就可以存储和检索这些信息。\n\n```cs\n public class Person\n{\n  public string Name\
  \ { get; set; }\n  public int Age { get; set; }\n} \n```\n\n一旦设计了数据模型，开发者就可以将该模型和数据结构部署到数据库（如\
  \ `SQL Server`）中。数据库表、主键和外键是根据 C# 类中的描述生成的。在 Visual Studio 中创建 ASP.NET MVC 应用程序时，默认解决方案的一部分是一个名为\
  \ `Models` 的文件夹。这是 C# 类表示数据库表的地方。这些类用于将从数据库的数据存储在内存中，以便控制器从视图更新时进行修改。每个类在默认的 ASP.NET\
  \ MVC 应用程序中也有名为 `Controllers` 和 `Views` 的文件夹。\n\n`controller`（控制器）是开发者通过 EF 逻辑通过绑定的\
  \ `Model` 对象（如 `Person`）创建、读取、更新或删除数据库内容的地方。控制器也是执行任何业务逻辑、身份验证或应用程序所需的任何活动的地方。`view`（视图）是表现层，将从客户端触发并在控制器中使用面向对象模型执行的动作输出呈现给客户端。\n\
  \nASP.NET MVC 与测试驱动开发（TDD）技术深度集成，与 ASP.NET Web Forms 相比，单元测试要简单得多。如图 19-3 所示，当您创建\
  \ ASP.NET 应用程序时，有一个复选框可以选择，这将创建一个专门用于程序单元测试的第二个项目。\n\n![选择复选框的示意图，在创建 ASP.NET 应用程序时这将创建一个第二个项目。](img/Image00234.jpg)\n\
  \n**图 19-3**\n\n通过将测试代码放置在 `Tests` 项目中，可以将 `IIS`、数据库和外部类等依赖项从测试用例中抽象出来。这是一个重要且非常有益的特性，因为生产实例之间的数据通常不同，且运行\
  \ `IIS` 的服务器构建可能会在生产环境和测试环境之间产生不一致的行为。移除这些依赖项——仅测试控制器内的逻辑，而不考虑依赖状态——可以提高测试的速度和效率。其原因是，开发者不需要将所有依赖项保持在有效且稳定的测试状态下（这非常耗时），而只需要专注于确保测试场景能够成功完成。\n\
  \nASP.NET MVC 使用`无扩展名的 URL`（extension-less URLs）：请求中不包含特定的文件名。ASP.NET Web Form 应用程序请求\
  \ `.aspx` 文件，但 ASP.NET MVC 并非如此。ASP.NET MVC 使用`routes`（路由）或`routing`（路由）的概念，使用 URL\
  \ 段而不是文件名来将请求路由到正确的控制器和视图。例如，对 `/Home/About` 的请求将执行位于 `Controllers` 文件夹中的 `HomeController`\
  \ 控制器的 `About()` 方法。`About()` 方法的结果将使用位于 `Views\\Home` 目录下的 `About.cshtml` 视图呈现给客户端。\n\
  \n### ASP.NET Web API\n\n选择 ASP.NET Web API 的优势与选择 ASP.NET MVC 应用程序类似，因为应用程序类型与\
  \ EF 紧密耦合，深度集成到 TDD 概念中，并且适用于大型复杂的 Web 应用程序。主要区别在于，ASP.NET Web API Visual Studio\
  \ 项目中没有视图组件或 `Views` 文件夹。这从 API 概念来看完全合理，该概念在第 17 章中描述：客户端调用由 API 暴露的方法，该方法返回某些数据。客户端负责消费、响应和/或呈现\
  \ API 的结果，该结果通常是 JSON 格式。\n\n### ASP.NET Core\n\n.NET Core 和 .NET Standard 的优势在第\
  \ 18 章中进行了讨论。通过 .NET Core 实现的优势也存在于 ASP.NET Core 应用程序类型中。以下是优势示例：\n\n*   ASP.NET\
  \ Core 跨平台运行。\n*   ASP.NET Core 不依赖于 `IIS`。\n*   ASP.NET Core 不依赖完整的 .NET Framework。\n\
  *   ASP.NET Core 针对云进行了优化，性能更高。\n\n与 .NET Core 一样，ASP.NET Core 可以在 Microsoft Windows\
  \ 以外的操作系统上运行，如 `MacOS` 和 `Linux`。历史上提到任何 ASP.NET 应用程序类型时，它无疑与 Internet 信息服务 (`IIS`)\
  \ 相关。ASP.NET Core 包含一个名为 `Kestrel` 的新 Web 服务器。\n\nRPS 性能测试是在相同的操作系统 Windows Server\
  \ 2012 R2 上进行的，具有相同的内存、CPU 速度和网络接口。因此，性能差异源于应用程序类型中特定的优化和执行效率。\n\n| **栈** | **每秒请求数\
  \ (RPS)** |\n| :--- | :--- |\n| `ASP.NET Web Forms 4.6` | ~57,000 |\n| `ASP.NET\
  \ Core on Kestrel` | ~310,000 |\n| `Node.js` | ~105,000 |\n\n**表 19-1: Kestrel \
  \ ASP.NET Core 基准**\n\n### ASP.NET Web Site 与 ASP.NET Web Application 项目类型\n\n如图\
  \ 19-4 所示，新的 ASP.NET Web 应用程序有两种类型：项目（Projects）和站点（Web Sites）。\n\n![ASP.NET Web\
  \ 应用程序的两种类型：项目和站点的示意图。](img/Image00235.jpg)\n\n**图 19-4**\n\n它们之间的差异如表 19-2 所示。\n\
  \n| **差异** | **项目 (Projects)** | **站点 (Web Sites)** |\n| :--- | :--- | :--- |\n\
  | **文件结构** | C# 项目有一个 `.csproj` 文件，其中包含运行程序所需的文件列表和程序集引用。 | C# 创建的 Web 站点没有 `.csproj`\
  \ 文件。目录结构中的所有文件都包含在站点中。 |\n| **编译** | 代码后台文件被编译成单个程序集（.dll`）。 | 源代码在首次被请求时动态编译。通常会产生多个程序集（.dll`）。\
  \ |\n\n\n\n\n\n| 部署 | 程序集 (.dll)、.aspx 和 .ascx 文件被部署到运行应用程序的 Web 服务器上。 | Web 应用程序源码副本被部署到\
  \ Web 服务器（.aspx、.ascx 和 aspx.cs）。 |\n\n**表 19-2 ：项目与 Web 站点（Web Sites）之间的差异**\n\n\
  ## 文件结构\n\nASP.NET 项目的 `.csproj`（项目文件）提供了从项目中移除文件的功能，该文件不会被包含在部署中，但也不会被永久删除。该文件从项目中排除，但未被删除。如果需要进行部署但某些文件尚未准备就绪，这种方法非常有帮助。此外，正如你在上一章中学习到的，项目文件用于存储关于用于创建\
  \ NuGet 包的 `.NET Standard` 类的信息。在 Web 站点（Web Sites）上下文中，如果没有 `.csproj` 文件，站点目录结构内的所有文件都被视为解决方案的一部分。\n\
  \n## 编译\n\n在部署之前编译好 Web 应用程序项目，可以节省部署后第一次请求时编译 `.aspx` 文件及其后置代码（code-behind）所需的时间。虽然\
  \ Web 可以使用 `NGEN` 进行预编译，但那种预部署活动比简单地手动发起第一次请求以让 `ASP.NET 运行时` 编译 ASP.NET 文件要复杂得多。\n\
  \n当编译后的程序集或 ASP.NET 项目加载到内存中时，整个 Web 应用程序都会消耗内存。相反，只有被请求的 Web 站点的文件会被编译并加载到内存中。因此，随着时间的推移，一个实际只使用少数页面的项目消耗的内存会比\
  \ Web 站点更多，因为正如之前提到的，只有被请求的文件会被编译并加载到内存中。当客户为云平台上的资源消耗付费时，这是一个重要的概念。\n\n## 部署\n\n\
  当部署 Web 站点（Web Site）时，后置代码（`.aspx.cs`）中的源码以明文形式部署，具有人类可读性。只要部署 Web 站点的位置是安全的，这就不是问题，但某些开发者或企业可能不希望这样。相反，使用项目时没有人类可读的代码被部署到服务器，因为它们都已编译成了程序集（`.dll`）。\n\
  \n此外，在属于 ASP.NET Web 应用程序项目的编译后程序集（`.dll`）加载到 `ASP.NET 运行时` 之后，如果要对项目进行更改，必须停止 `ASP.NET\
  \ 运行时` 进程并从内存中卸载，更改才能对使用 Web 站点的生效。如果进程持有程序集的句柄，则无法更改，因此必须停止以释放句柄。Web 站点（Web Sites）的情况不同，`.aspx.cs`\
  \ 或 `.aspx` 文件可以在不停止 `ASP.NET 运行时` 的情况下更新，并在下次有请求它们时被编译并加载到内存中。\n\n现在你已经了解了 ASP.NET\
  \ Web 应用程序类型之间的区别，以及项目与 Web 站点之间的许多差异。请继续阅读，以深入了解 ASP.NET Web Forms 和 ASP.NET Core。\n\
  \n# 使用 ASP.NET WEB FORMS\n\n在本节中，将更详细讨论几个重要的 ASP.NET Web Form 概念。每种 ASP.NET 应用程序类型都有其独特之处（具体细节之前讨论过）。阅读本节后，你将对以下\
  \ ASP.NET Web Form 特性有深入理解：\n\n* 服务器控件\n* 输入验证\n* 状态管理\n* 身份验证与授权\n\n### 服务器控件\n\
  \n在本节中，你将学习 ASP.NET 页面框架提供的服务器控件。这些控件旨在为 Web 应用程序编程提供一种结构化的、事件驱动的、面向对象的模型。表 19-3\
  \ 列出了 ASP.NET 可用的一些 Web 服务器控件以及这些控件返回的 HTML 代码。\n\n| **控件** | **HTML** | **描述**\
  \ |\n| --- | --- | --- |\n| `Label` | `<span>` | 返回一个包含文本的 `span` 元素。 |\n| `TextBox`\
  \ | `<input type=\"text\">` | 返回 HTML `<input type=\"text\">`，用户可以在其中输入某些值。当文本更改时，你可以编写服务器端事件处理器。\
  \ |\n| `Button` | `<input type=\"submit\">` | 将表单值发送到服务器。 |\n| `HyperLink` | `<a>`\
  \ | 创建引用 Web 页的简单锚点标签。 |\n| `DropDownList` | `<select>` | 创建 `select` 标签，用户可以看到一个项目，并通过点击下拉列表选择多个项目中的一个。\
  \ |\n| `CheckBox` | `<input type=\"checkbox\">` | 返回一个类型为 `check box` 的 `input`\
  \ 元素，显示一个可以选中或取消选的按钮。可以使用 `CheckBoxList` 代替 `CheckBox`，它创建一个由多个 `check box` 元素组成的表格。\
  \ |\n| `RadioButton` | `<input type=\"radio\">` | 返回一个类型为 `radio` 的 `input` 元素。对于单选按钮，一组中只能选择一个按钮。类似于\
  \ `CheckBoxList`，`RadioButtonList` 提供了按钮列表。 |\n| `Image` | `<img src=\"\">` | 返回\
  \ `img` 标签以在客户端显示 GIF 或 JPG 文件。 |\n\n**表 19-3 ：ASP.NET 服务器控件示例**\n\n表中未显示许多其他控件。然而，这些控件的共同点是能够触发由用户调用的事件，无论是自动触发还是页面生命周期的一部分。这些事件会执行服务器端处理器。你会发现\
  \ ASP.NET 应用程序很大程度上基于这种事件驱动模型。\n\n### 输入验证\n\n当用户输入数据时，应该检查其有效性。检查可以在客户端和服务器端同时进行。你可以使用\
  \ JavaScript 在客户端检查数据。然而，如果已经在客户端检查了数据，也应该在服务器端进行检查，因为你永远无法信任客户端。浏览器可以禁用 JavaScript，且黑客可以使用接受错误输入的不同\
  \ JavaScript 函数。在客户端检查数据可以获得更好的性能，因为在数据通过客户端验证之前，不会发生往返服务器的交互。\n\n使用 ASP.NET 没必要自己编写验证函数。存在许多验证控件，可以同时创建客户端和服务器端的验证。下面的示例显示了与文本框\
  \ `playerTextBox` 关联的 `RequiredFieldValidator` 验证控件。所有验证控件都通用 `ErrorMessage` 和 `ControlToValidate`\
  \ 属性。如果输入不正确，则由 `ErrorMessage` 定义显示的消息。默认情况下，错误消息显示在验证控件的位置。`ControlToValidate`\
  \ 属性定义了检查输入的控件。\n\n```\n <asp:TextBox ID=\"player1TextBox\" runat=\"server\"></asp:TextBox>\n\
  \n<asp:RequiredFieldValidator ID=\"RequiredFieldValidator1\" runat=\"server\"\n\
  \    ErrorMessage=\"为玩家 1 输入名称\" ControlToValidate=\"player1TextBox\">\n\n</asp:RequiredFieldValidator>\n\
  ```\n\n表 19-4 列出并描述了所有验证控件。\n\n| **控件** | **描述** |\n| --- | --- |\n| `RequiredFieldValidator`\
  \ | 指定被验证的控件必须输入。如果被验证的控件设置了初始值且用户必须更改它，你可以使用验证控件的 `InitialValue` 属性设置此初始值。 |\n\
  | `RangeValidator` | 定义了允许输入的最小值和最大值。控件的特定属性为 `MinimumValue` 和 `MaximumValue` .\
  \ |\n\n\n\n\n\n## ASP.NET 验证示例\n\n`CompareValidator` 用于比较多个值（例如密码）。该验证器不仅支持比较两个值的相等性，还可以通过\
  \ `Operator` 属性设置额外选项。`Operator` 属性的类型为 `Operator`，它定义了枚举值如 `Equal`、`NotEqual`、`GreaterThan`\
  \ 和 `DataTypeCheck`。使用 `DataTypeCheck` 可以对输入值进行检查，以确定其是否为特定类型，例如正确的输入。\n\n表 19-4\n\
  \n## ASP.NET 状态管理\n\nHTTP 协议是无状态的。从客户端到服务器发起的连接在每次请求后都会关闭。然而，通常需要从一个页面记住一些客户端信息。有多种方法可以实现这一点。保持状态的不同方法之间的区别在于状态存储在客户端上还是服务器上。表\
  \ 19-5 显示了状态管理技术的概述以及状态的有效期。\n\n| 状态类型 | 客户端或服务器 | 有效时间 |\n| --- | --- | --- |\n\
  | 视图状态 (View State) | 客户端 | 仅限单个页面内。 |\n| Cookie | 客户端 | 浏览器关闭时删除临时 Cookie；持久 Cookie\
  \ 存储在客户端磁盘上。 |\n| 会话 (Session) | 服务器 | 会话状态与浏览器关联。会话会在超时后失效（默认为 20 分钟）。 |\n| 应用\
  \ (Application) | 服务器 | 应用状态在所有客户端之间共享。该状态持续到服务器重启。 |\n| 缓存 (Cache) | 服务器 | 与应用状态类似，缓存是共享的。开发者可以控制缓存何时失效。\
  \ |\n\n### 身份验证与授权\n\n为了确保网站安全，使用身份验证来验证用户是否已有效登录，而授权则确认通过身份验证的用户可以使用该资源。Web 应用常用的身份验证技术是\
  \ Forms 和 Windows 身份验证。Windows 身份验证利用账户和 IIS 来验证用户，而 Forms 则需要一个包含用户信息的数据库。\n\n\
  ASP.NET 有许多用于用户身份验证的类。提供了如 `Login` 和 `PasswordRecovery` 这样的安全控件。这些控件使用 `Membership\
  \ API`。通过 `Membership API`，可以创建和删除用户、验证登录信息或获取当前登录用户的信息。`Membership API` 使用成员提供程序（membership\
  \ provider）。从 ASP.NET 4.5 开始，存在不同的提供程序来访问 SQL Server 数据库或 Active Directory 中的用户。也可以创建一个访问\
  \ XML 文件或任何自定义存储的自定义提供程序。\n\n在接下来的尝试中，你将创建一个处理卡片的 ASP.NET Web Forms 应用程序。ASP.NET\
  \ Web Forms 仍然创建功能完备、资源丰富的 Web 应用程序的非常有效选项。这种版本的 ASP.NET 使用完整版本的 .NET Framework，这意味着应用程序将仅运行在\
  \ Windows 平台上。如果 Web 应用需要运行在多个操作系统上，那么 ASP.NET Core（在下一节中讨论）可能是更好的选择。\n\n## 创建 ASP.NET\
  \ Core Web 应用程序\n\n本节讨论了许多 ASP.NET Core 概念。本节最重要的核心概念是 ASP.NET Core 可以跨平台运行。与 .NET\
  \ Core 应用一样，ASP.NET Core 网站除了 Microsoft Windows 之外，还可以在 Linux 和 MacOS 上运行。因此，如果\
  \ Web 应用需要跨平台运行，那么这就是你应该选择的 ASP.NET 版本。然而，如果 Web 应用的目标仅运行在 Microsoft Windows 上，则你应该考虑\
  \ ASP.NET Web Forms 或 ASP.NET MVC。在编写本文时，ASP.NET Core 是 ASP.NET 的最新版本，但并非所有功能已包含在二进制文件中。这将在未来发生变化。\n\
  \n你将在本节中学习到以下 ASP.NET Core 细节：\n\n* IIS 和 Kestrel\n* Razor 语法\n* 输入验证\n* 状态管理\n\
  * 身份验证与授权\n* 依赖注入\n\n### IIS 和 Kestrel\n\n到目前为止，当开发者谈论 ASP.NET 版本时，人们通常认为 Web 应用将运行在带有\
  \ Internet 信息服务（IIS）的 Microsoft Windows 服务器上，IIS 是由微软开发的 Web 服务器，用于响应客户端的 HTTP 和\
  \ HTTPS 请求。然而，由于 IIS 不支持在 Linux 或 MacOS 上运行，因此需要一种方法让 IIS 将请求发送到运行在这些操作系统上的 Web\
  \ 服务器。答案是使用 `Kestrel`，这是一个包含在 ASP.NET Core 项目中的新型跨平台 Web 服务器。\n\n如图 19-8 所示，当 `Kestrel`\
  \ 配置为与 `IIS` 一起运行时，客户端的 HTTP 请求将直接转发到 `Kestrel` Web 服务器。然后 `Kestrel` 通过传递 `HttpContext`\
  \ 类与 ASP.NET Core 源代码交互，该类包含了有关 HTTP 请求的特定 HTTP 信息（例如会话管理信息、查询字符串、文化信息、客户端证书等更多信息）。\n\
  \n![图示说明：当 Kestrel 配置为与 IIS 一起运行时，客户端的 HTTP 请求将直接转发到 Kestrel Web 服务器。](img/Image00239.jpg)\n\
  \n除了 `IIS` 之外，`Apache` 和 `Nginx` 也是功能性 Web 服务器，它们仅运行在它们目标操作系统上（如 Windows、Linux 或\
  \ MacOS）。ASP.NET Core 可以在没有任何特定操作系统 Web 服务器的情况下运行，因为 `Kestrel` 本身就是一个 Web 服务器。这种运行方式通常被称为自托管（self-hosting），因为\
  \ Web 应用及其运行所需的组件被封装在一个专用容器中。以这种方式将 Web 应用打包在一起使其易于使用例如 `XCOPY` 进行部署，而移植性是云优化程序的根本特性，如第\
  \ 16 章所述。\n\n### Razor 语法\n\n与其 ASP.NET Web Forms 的基本设计原则，在创建 ASP.NET Core 应用的 Razor\
  \ 页面时，应使用 HTML 渲染功能。在页面中引用变量时，历史上使用的标记语法是 `<%= %>`，这有五个字符。Razor 的改进在于使用 `@` 符号表示代码的起点或设置变量引用。例如，`@Html.Hidden`\
  \ 是将隐藏字段添加到 Razor 页面的方法。`Html` 对象提供了对 `System.Web.Mvc.HtmlHelper` 类构造函数、属性、字段和方法的引用。表\
  \ 19-6 列出了从 Razor Web 页面可以访问的一些 `HtmlHelper` 方法。其 HTML 输出与 ASP.NET Web Forms 控件输出非常相似。\n\
  \n| 控件 | HTML | 描述 |\n| --- | --- | --- |\n| `Html.Label` | `<label>` | 返回包含文本的\
  \ `label` 元素。 |\n| `Html.TextBox` | `<input type=\"text\">` | 返回 HTML `<input type=\"\
  text\">`，用户可以在其中输入值。 |\n| `Html.ActionLink` | `<a href>` | 创建引用页面的简单锚标签。 |\n| `Html.DropDownList`\
  \ | `<select>` | 创建 `select` 标签，用户可以看到一个项目，并通过点击下拉列表从多个项目中选择一个。 |\n| `Html.CheckBox`\
  \ | `<input type=\"checkbox\">` | 返回类型为 `checkbox` 的 `input` 元素，显示一个可以选择或取消选择的按钮。\
  \ |\n\n\n\n\n\n| `Html.RadioButton` | `<input type=\"radio\">` | 返回一个类型为 `radio`\
  \ 的 `input` 元素。对于单选按钮，一组中只能选择一个。 |\n\n**表 19-6 :** Razor HtmlHelper 方法示例\n\n还有许多未包含在此表中的\
  \ `HtmlHelper` 方法。\n\n## 输入验证\n\nASP.NET Core 应用程序验证是使用 `System.ComponentModel.DataAnnotations`\
  \ 命名空间下的验证属性进行配置的。验证器在特定模型的类定义中配置。\n\n```cs\n public class Player\n{\n    [StringLength(20,\
  \ MinimumLength = 3)]\n    [Required]\n    public string Name { get; set; }\n} \n\
  ```\n\n当向绑定了定义的 `Player` 模型的页面发送请求时，ASP.NET Core 运行时会生成 jQuery 客户端侧验证语法。然后，如果用户尝试提交一个没有\
  \ `Name` 值的表单，将在客户端进行验证并渲染错误。\n\n表 19-7 列出并描述了一些 ASP.NET Core 数据注解验证属性。\n\n| **控件**\
  \ | **描述** |\n| --- | --- |\n| `Required` | 表示该属性是必需的。 |\n| `StringLength` | 定义用户必须遵守的最大值和可选的最小值。\
  \ |\n| `Range` | 对于数值字段，可以设置最大值和最小值。 |\n| `EmailAddress` | 确认输入的值为电子邮件地址。 |\n| `DataType`\
  \ | 确认输入的值为特定类型，如 `Date` 或 `Currency`。 |\n| `RegularExpression` | 确认输入的值匹配正则表达式。\
  \ |\n\n**表 19-7 :** ASP.NET Core 验证属性示例\n\n## 状态管理\n\n如前所述，HTTP 协议是无状态的，这意味着一旦服务器成功响应请求，连接就会关闭并被遗忘。然而，在管理多个请求时，经常需要对客户端的一些信息进行持久化和重用。在使用\
  \ ASP.NET 变体时，有多种方法可以实现状态管理。表 19-8 显示了状态管理概述以及状态的有效期。\n\n| **状态类型** | **客户端或服务器**\
  \ | **有效期** |\n| --- | --- | --- |\n| TempData | 服务器 | 一旦被应用程序读取即移除。 |\n| Query\
  \ strings | 双方 | 作为 URL 元素在客户端服务器之间传递，仅在单个请求期间有效。 |\n| Cookie | 客户端 | 关闭浏览器时删除临时\
  \ Cookie；永久 Cookie 存储在磁盘上。 |\n| `HttpContext.Items` | 双方 | 在客户端服务器之间传递，存储在 `HttpContext`\
  \ 对象中，仅在单个请求期间有效。 |\n| Cache | 服务器 | 与应用程序状态类似，缓存是共享的。但提供了更好的控制。 |\n| Session |\
  \ 服务器 | Session 状态与浏览器关联。Session 通过配置的超时设置失效。 |\n| Application | 服务器 | 状态在所有客户端之间共享。该状态持续到服务器重启。\
  \ |\n\n**表 19-8 :** ASP.NET Core 状态管理技术\n\n## 身份验证与授权\n\n由于 ASP.NET Core 不关注单一操作系统，身份验证和授权必须跨平台工作。流行的开源身份提供程序是\
  \ `OWIN` 和 `OAuth`。`OWIN`（代表 .NET Open Web Interface）本身并不是身份提供程序；但它通常与 `Katana`\
  \ 相关。`OWIN` 规范了 Web 服务器和 Web 应用程序如何解耦。`OWIN` 消除了 ASP.NET Core 对 `IIS` 的依赖，并帮助通过\
  \ `Kestrel` 实现自托管概念。`Katana` NuGet 包包含了实现 Windows 和 Forms 等多种身份验证所需的库。\n\n`OAuth`\
  \ 是由 `Microsoft`、`Facebook`、`Twitter`、`Google` 等公司提供的接口，用于移动设备或浏览器上的应用程序提示客户端使用\
  \ `Facebook` 或 `Microsoft` 凭据访问网站。在这种情况下，使用的是 `OAuth` 协议。在 ASP.NET Core Web 应用程序中实现\
  \ `OAuth` 的类和方法位于 `AspNet.Security.OAuth.Providers` 命名空间。\n\n身份验证是确认个人确实如其所言的过程。通常当有人创建一个新账户时，它与电子邮件地址和密码相关。验证电子邮件会发送到提供的邮箱，一旦点击，注册即完成。从那时起使用该电子邮件和密码访问资源验证了其确实是创建账户的人。过程的另一部分是授权。授权是定义授权人员可以访问的功能或内容的过程。这通常被称为“声明”（claims）。\n\
  \n在最简单的形式中，某些源代码检查声明的存在（例如 `DealerID`），如果声明存在，则可以从请求中调用该方法。\n\n```cs\npolicy.RequireClaim(\"\
  DealerID\");\n```\n\n声明也可以由键值对表示，为资源提供更细粒度的访问。\n\n```cs\npolicy.RequireClaim(\"\
  DealerID\", \"1\", \"2\", \"3\", \"4\", \"5\");\n```\n\n这表明 `DealCard()` 仅适用于具有\
  \ `DealerID` 的发牌员。\n\n## 依赖注入\n\n依赖注入（DI）是一个非常高级的主题，但由于它是 ASP.NET Core 构建的基础概念，因此在这里会被提及。涉及\
  \ DI 需要理解的基本点是避免使用 `new` 关键字。\n\n```cs\nPlayer[] players = new Player[2];\n```\n\
  \n避免 `new` 的原因是它将程序永久绑定到它所引用的类上。在某些情况下，当修改该类的可能性很小时，使用 `new` 是可以的，在这种情况下使用关键字是一种设计决策。另一种方案是实现接口，这在\
  \ 第 9 章、第 10 章 和 第 12 章 中讨论过。接口松散耦合或解除消费者与提供者的耦合，其中程序是消费者而类是提供者。如下代码片段所示，在不使用 `new`\
  \ 关键字的情况下创建了 `Player`。\n\n```cs\npublic interface ICardGameClient\n{\n    void Player(string\
  \ Name);\n}\n\npublic class PlaySomeCards\n{\n    private readonly ICardGameClient\
  \ _cardGameClient;\n\n    public PlaySomeCards(ICardGameClient cardGameClient)\n\
  \    {\n        _cardGameClient = cardGameClient;\n    }\n\n    public void PlayHand\n\
  \    {\n        _cardGameClient.Player(\"Benjamin\");\n    }\n}\n```\n\n依赖注入通过被称为工厂或容器的机制更进一步了一。ASP.NET\
  \ Core 默认支持 DI，并配置在 `Startup.cs` 文件中，该文件是在创建 ASP.NET Core 应用程序时生成的。该文件包含一个名为 `ConfigureServices()`\
  \ 的方法，是配置提供者的地方。\n\n```cs\npublic void ConfigureServices(IServiceCollection services)\n\
  {\n    services.AddMvc();\n    services.AddDbContext<ClassName>(options => ...\n\
  \    services.AddIdentity<ClassName1, ClassName2>()...\n    ...\n}\n```\n\n\n\n\n\
  \n在 `ConfigureServices()` 方法中配置的服务提供程序会在程序内运行的代码请求时提供 `className`。\n\n在接下来的“试运行（Try\
  \ It Out）”中，你将在 ASP.NET Core 中创建一个 Razor Page，为两个玩家分发扑牌。\n\n## 本章你学到的内容\n\n| 主题\
  \ | 核心概念 |\n| --- | --- |\n| ASP.NET 变体 | 存在多种 ASP.NET 应用类型，每种都有特定的适用场景和优势。 |\n\
  | 项目与 Web 网站 | 项目被编译为 `.dll` 并部署，而 Web 网站则部署源代码并在首次请求时进行编译。 |\n| 服务器控件和 HtmlHelper\
  \ | Web 服务器控件是服务器端控件，用于为 ASP.NET Web Forms 应用程序生成 HTML 代码。`HtmlHelper` 类提供了在 Razor\
  \ 页面中创建 `Label`、`Textbox` 等对象的方法。 |\n| 使用验证控件和数据注解程序（Data Annotations）验证用户输入 | ASP.NET\
  \ 提供了多种验证控件，可以轻松地在客户端和服务器端验证用户输入。客户端验证是出于性能考虑的，但由于 Web 客户端永远不可信，因此必须在服务器端进行验证。 |\n\
  | 状态管理 | 在 Web 应用中，必须考虑存储状态的地方。状态可以存储在客户端的 Cookie 或视图状态（view state），也可以存储在服务器的 Session、缓存和应用程序对象。\
  \ |\n| 身份验证与授权 | 身份验证是确定客户端是否确实为其所称的身份的过程。授权为已验证客户端提供了其有权访问的功能和服务。 |\n| Kestrel\
  \ | Kestrel 是一种新的 Web 服务器，可以自托管 ASP.NET Core Web 应用并支持跨平台运行。 |\n| 依赖注入 (DI) | DI\
  \ 解耦了消费者和提供者。 |\n\n# 第四部分：数据访问\n\n* 第 20 章：文件\n* 第 21 章：XML 和 JSON\n* 第 22 章：LINQ\n\
  * 第 23 章：数据库\n\n# 20：文件\n\n## 输入和输出的文件类\n\n读写文件是让数据进入 C# 程序（`input`）以及将数据传出程序（`output`）的重要方式。由于文件被用于输入和输出，文件类包含在\
  \ `System.IO` 命名空间中（`IO` 是 Input/Output 的缩写）。\n\n`System.IO` 包含了用于在文件之间读写数据的类，你可以在\
  \ C# 应用中引用此命名空间，以便在不完全限定类型名称的情况下访问这些类。\n\n本章涵盖的类描述在 表 20-1 中。\n\n| 类 | 描述 |\n| ---\
  \ | --- |\n| `File` | 静态工具类，公开了许多用于移动、复制和删除文件的静态方法。 |\n| `Directory` | 静态工具类，公开了许多用于移动、复制和删除目录的静态方法。\
  \ |\n| `Path` | 用于处理路径名称的工具类。 |\n| `FileInfo` | 代表磁盘上的物理文件，并具有操作该文件的方法。对于对文件的任何读取和写入，都必须创建一个\
  \ `Stream` 对象。 |\n| `DirectoryInfo` | 代表磁盘上的物理目录，并具有操作该目录的方法。 |\n| `FileSystemInfo`\
  \ | 作为 `FileInfo` 和 `DirectoryInfo` 的基类，使得可以使用多态同时处理文件和目录。 |\n| `FileSystemWatcher`\
  \ | 你在本章中检查的最高级的类。它用于监控文件和目录，并公开了当这些位置发生变化时你的应用程序可以捕获的事件。 |\n\n**表 20-1 ：文件系统访问类**\n\
  \n你还将查看 `System.IO.Compression` 命名空间，它允许你读写压缩文件（`ZIP` 扩展名）。特别是，你将查看以下两个流类：\n\n*\
  \ `DeflateStream` — 代表一种流，数据在写入时自动压缩，在读取时自动解压缩。压缩使用 Deflate 算法实现。 |\n* `GZipStream`\
  \ — 代表一种流，数据在写入时自动压缩，在读取时自动解压缩。压缩使用 GZIP (GNU Zip) 算法实现。 |\n\n### 文件和目录类\n\n`File`\
  \ 和 `Directory` 工具类公开了许多静态方法来操作文件和目录（令人惊讶的是如此多）。这些方法使得移动文件、查询和更新属性以及创建 `FileStream`\
  \ 对象变得可能。正如你在 第 8 章 中学到的，可以在无需创建实例的情况下对类调用静态方法。\n\n`File` 类的一些最实用的静态方法如 表 20-2 所示。\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `Copy()` | 将文件从源位置复制到目标位置。 |\n| `Create()` | 在指定路径下创建文件。\
  \ |\n| `Delete()` | 删除文件。 |\n| `Open()` | 返回指定路径的 `FileStream` 对象。 |\n| `Move()`\
  \ 将文件移动到新位置。 |\n\n**表 20-2 ：文件的类的静态方法**\n\n`Directory` 类的一些实用的静态方法如 表 20-3 所示。\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `CreateDirectory()` 在指定路径创建目录。 |\n| `Delete()` 删除指定目录及其内部的所有文件。\
  \ |\n| `GetDirectories()` 返回一个表示指定目录下的目录名称的 `string` 数组。 |\n| `EnumerateDirectories()`\
  \ 类似于 `GetDirectories()`，但返回目录名称的 `IEnumerable<string>`集合。 |\n| `GetFiles()` 返回一个表示指定目录内文件的\
  \ `string` 数组。 |\n| `EnumerateFiles()` 类似于 `GetFiles()`，但返回文件名的 `IEnumerable<string>`集合。\
  \ |\n| `GetFileSystemEntries()` 返回一个表示指定目录内文件和目录名称的 `string` 数组。 |\n| `EnumerateFileSystemEntries()`\
  \ 类似于 `GetFileSystemEntries()`，但返回文件和目录名称的 `IEnumerable<string>`集合。 |\n| `Move()`\
  \ 将指定目录移动到新位置。你可以为新位置的文件夹指定新名称。 |\n\n**表 20-3 ：目录类的静态方法**\n\n当存在大量文件或目录时，三个 `EnumerateXxx()`\
  \ 方法的性能优对应的 `GetXxx()` 方法。\n\n### FileInfo 类\n\n与 `File` 类不同，`FileInfo` 类不是静态的，也没有静态方法。该类只有在实例化时有用。`FileInfo`\
  \ 对象代表磁盘或网络位置上的文件，你可以通过提供文件路径来创建一个：\n\n```csharp\nFileInfo aFile = new FileInfo(@\"\
  C:\\Log.txt\");\n```\n\n你也可以将目录名称传递给 `FileInfo` 构造函数，尽管在实际操作中这并不有用。这样做会导致 `FileInfo`\
  \ 的基类 `FileSystemInfo` 初始化所有目录信息，但任何与文件专门相关的 `FileInfo` 方法或属性将无法工作。\n\n\n\n\n\n\
  `FileInfo` 类公开的许多方法与 `File` 类的方法相似，但由于 `File` 是一个静态类，因此每次方法调用都需要一个指定文件位置的字符串参数。因此，以下调用实现的作用是相同的：\n\
  \n```\nFileInfo aFile = new FileInfo(\"Data.txt\");\n\nif (aFile.Exists)\n   WriteLine(\"\
  File Exists\");\n\nif (File.Exists(\"Data.txt\"))\n   WriteLine(\"File Exists\"\
  ); \n```\n\n在这段代码中，程序会检查文件 `Data.txt` 是否存在。注意，这里没有指定任何目录信息，这意味着当前的*工作目录*（working\
  \ directory）是唯一检查的位置。该目录是调用此代码的应用程序所在的目录。你稍后将在“路径名称和相对路径”章节中更详细地了解这一点。\n\n大多数 `FileInfo`\
  \ 方法都以这种方式镜像了 `File` 方法。在大多数情况下，使用哪种技术并不重要，但以下标准可以帮助你判断哪种更合适：\n\n- 如果你只进行单次方法调用，使用静态\
  \ `File` 类上的方法是有意义的——因为单次调用会更快，因为 .NET Framework 不需要经过实例化新对象然后调用方法的过程。\n- 如果你的应用程序对一个文件执行若干项操作，那么实例化一个\
  \ `FileInfo` 对象并使用它的方法更有意义——这可以节省时间，因为该对象已经引用了文件系统上的正确文件，而静态类每次都必须查找它。\n\n`FileInfo`\
  \ 类还公开了与底层文件相关的属性，其中某些属性可以通过操作来更新文件。这些属性中的许多继承自 `FileSystemInfo`，因此同时适用于 `FileInfo`\
  \ 和 `DirectoryInfo` 类。`FileSystemInfo` 的属性如表 20-4 所示。\n\n| 属性 | 说明 |\n| --- | ---\
  \ |\n| `Attributes` | 使用 `FileAttributes` 枚举获取或设置当前文件或目录的属性。 |\n| `CreationTime,\
  \ CreationTimeUtc` | 获取或设置当前文件的创建日期和时间，提供协调世界时 (UTC) 和非 UTC 版本。 |\n| `Extension`\
  \ | 获取文件的扩展名。此属性是只读的。 |\n| `Exists` | 确定文件是否存在。这是一个只读抽象属性，在 `FileInfo` 和 `DirectoryInfo`\
  \ 中被重写。 |\n| `FullName` | 获取文件的完整路径。此属性是只读的。 |\n| `LastAccessTime, LastAccessTimeUtc`\
  \ | 获取或设置当前文件最后访问的日期时间，提供 UTC 和非 UTC 版本。 |\n| `LastWriteTime, LastWriteTimeUtc`\
  \ | 获取或设置当前文件最后写入的日期时间，提供 UTC 和非 UTC 版本。 |\n| `Name` | 获取文件的完整路径。这是一个只读抽象属性，在 `FileInfo`\
  \ 和 `DirectoryInfo` 中被重写。 |\n\n**表 20-4 :** FileSystemInfo 属性\n\n`FileInfo` 特有的属性如表\
  \ 20-5 所示。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Directory` | 获取表示包含当前文件的目录的 `DirectoryInfo`\
  \ 对象。此属性是只读的。 |\n| `DirectoryName` | 返回文件目录的路径。此属性是只读的。 |\n| `IsReadOnly` | 文件只读属性的快捷方式。此属性也可以通过\
  \ `Attributes` 访问。 |\n| `Length` | 获取以字节为单位的文件大小，返回 `long` 值。此属性是只读的。 |\n\n**表 20-5\
  \ :** FileInfo 属性\n\n### DirectoryInfo 类\n\n`DirectoryInfo` 类的工作方式与 `FileInfo` 类完全相同。它是一个实例化的对象，代表机器上的单个目录。与\
  \ `FileInfo` 类一样，许多方法调用在 `Directory` 和 `DirectoryInfo` 之间重复。选择使用 `File` 或 `FileInfo`\
  \ 方法的指南也适用于 `DirectoryInfo` 方法：\n\n- 如果你进行单次调用，使用静态 `Directory` 类。\n- 如果你进行一系列调用，请使用实例化的\
  \ `DirectoryInfo` 对象。\n\n`DirectoryInfo` 大部分属性继承自 `FileSystemInfo`，`FileInfo` 如此，尽管这些属性作用于目录而不是文件。还有两个\
  \ `DirectoryInfo` 特有的属性，如表 20-6 所示。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Parent` |\
  \ 获取表示包含当前目录的目录的 `DirectoryInfo` 对象。此属性是只读的。 |\n| `Root` | 获取表示当前卷根目录的 `DirectoryInfo`\
  \ 对象——例如 `C:\\` 目录。此属性是只读的。 |\n\n**表 20-6 :** DirectoryInfo 特有属性\n\n### 路径名称和相对路径\n\
  \n在 .NET 代码中指定路径名称时，可以使用绝对路径或相对路径。*绝对*路径显式指定了驱动器或已知位置——例如 `C:\\`。一个例子是 `C:\\Work\\\
  File.txt`。\n\n*相对*路径相对于起始位置。使用相对路径不需要指定驱动器或已知位置。例如，如果你的应用程序运行在 `C:\\Development\\\
  FileDemo` 目录并使用相对路径 `LogFile.txt`，那么文件将位于该目录。\n\n如前所示，工作目录最初被设置为应用程序运行的目录。当你使用 Visual\
  \ Studio 开发时，这意味着应用程序位于你创建的项目文件夹的下方。它通常位于 `ProjectName\\bin\\Debug`。要访问项目根文件夹中的文件，你需要通过\
  \ `..\\` 向上移动两个目录。你将在本书中经常看到这种情况。\n\n如果需要，可以使用 `Directory.GetCurrentDirectory()`\
  \ 获取工作目录，或使用 `Directory.SetCurrentDirectory()` 将设置为新路径。\n\n## 流 (STREAMS)\n\n.NET\
  \ Framework 中的所有输入和输出都涉及流的使用。流是*串行设备*的抽象表示。串行设备是以线性方式存储和或访问数据的设备，即每次一个字节，按顺序进行。这种设备可以是磁盘文件、网络通道、内存位置或任何支持线性读取、写入或两者都有的对象。通过保持设备的抽象，流的底层目标/源可以被隐藏。这种抽象级别允许代码复用，并让你能够编写更通用的例程，因为你不需要担心数据传输实际发生的细节。因此，当应用程序从文件输入流、网络输入流或任何其他流读取数据时，相似的代码可以被传输和复用。\n\
  \n\n\n\n\n流可以表示几乎任何源，例如键盘、物理磁盘文件、网络位置、打印机，甚至是另一个程序，但本章侧重于读取和写入磁盘文件。应用于读取/写入磁盘文件的概念适用于大多数设备，因此你将对流有一个基本的理解，并学习一种可以应用于许多情况的成熟方法。\n\
  \n## 使用流的类\n\n用于流的类包含相同的 `System.IO` 命名空间中，与 `File` 和 `Directory` 类一起。这些类列在表 20‐7\
  \ 中。\n\n| 类 | 描述 |\n| --- | --- |\n| `FileStream` | 表示可以写入、读取或二者兼之的文件。该文件可以以异步或同步的方式进行写入和读取。\
  \ |\n| `StreamReader` | 从流中读取字符数据，可以使用 `FileStream` 作为基类进行创建。 |\n| `StreamWriter`\
  \ | 向流写入字符数据，可以使用 `FileStream` 作为基类进行创建。 |\n\n**表 20‐7:** 流类\n\n现在让我们看看如何使用这些类中的每一个。\n\
  \n### FileStream 对象\n\n`FileStream` 对象表示指向磁盘或网络路径上文件的流。虽然该类确实暴露了从文件向文件读写字节的方法，但你通常会使用\
  \ `StreamReader` 或 `StreamWriter` 来执行这些功能。这是因为 `FileStream` 类对字节和字节数组进行操作，而 `Stream`\
  \ 类对字符数据进行操作。字符数据更容易处理，但某些操作（例如随机文件访问，访问文件中间某处的数据）只能通过 `FileStream` 对象完成。你将在本章稍后的部分学习更多相关内容。\n\
  \n创建 `FileStream` 对象有几种方法。构造函数有许多不同的重载，但最简单的只需要两个参数：文件名和一个 `FileMode` 举枚举值：\n\n\
  ```\nFileStream aFile = new FileStream(filename, FileMode.<Member>); \n```\n\n`FileMode`\
  \ 枚举有几个成员，它们指定了如何打开或创建文件。你很快就会看到这些可能性。另一个常用的构造函数如下：\n\n```\nFileStream aFile = new\
  \ FileStream(filename, FileMode.<Member>, FileAccess.<Member>);\n```\n\n第三个参数是 `FileAccess`\
  \ 枚举的成员，是指定流目的的方法。`FileAccess` 枚举的成员显示在表 20‐8 中。\n\n| 成员 | 描述 |\n| --- | --- |\n\
  | `Read` | 以仅读模式打开文件 |\n| `Write` | 以仅写模式打开文件 |\n| `ReadWrite` | 以读或写模式打开文件 |\n\n\
  **表 20‐8:** FileAccess 枚举成员\n\n尝试执行 `FileAccess` 枚举成员指定以外的操作将导致抛出异常。此属性通常用作根据用户的授权级别改变用户对文件的访问的方式。\n\
  \n在不使用 `FileAccess` 枚举参数的 `FileStream` 构造函数版本中使用的是默认值，即 `FileAccess.ReadWrite`。\n\
  \n`FileMode` 枚举成员显示在表 20‐9 中。使用这些值值时实际发生了什么取决于指定的文件名是否指向一个存在的文件。注意，表中的条目指的是流在创建时所指向的文件位置，你将在下一节学习更多关于该主题。除非另有说明，否则流指向文件的开头。\n\
  \n| 成员 | 文件存在时的行为 | 文件不存在的行为 |\n| --- | --- | --- |\n| `Append` | 打开文件，流置于文件末尾。只能配合\
  \ `FileAccess.Write` 使用。 | 创建一个新文件。只能配合 `FileAccess.Write` 使用。 |\n| `Create` | 销毁该文件，并在原位置创建一个新文件。\
  \ | 创建一个新文件。 |\n| `CreateNew` | 抛出异常。 | 创建一个新文件。 |\n| `Open` | 打开文件，流位于文件开头。 | 抛出异常。\
  \ |\n| `OpenOrCreate` | 打开文件，流置于文件开头。 | 创建一个新文件。 |\n| `Truncate` | 打开并擦除文件。流位于文件开头。保留原始文件的创建日期。\
