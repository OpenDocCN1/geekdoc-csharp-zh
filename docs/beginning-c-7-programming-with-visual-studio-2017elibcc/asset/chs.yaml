  \n这看起来可能需要很多吸收，但很快就能适应。你从构建第一个示例项目开始，这涉及许多 Visual Studio 元素。\n\n## 控制台应用程序\n\n你在本书中经常使用控制台应用程序，特别是在开头，因此下面的“尝试”提供了创建一个简单应用程序的步骤指南。\n\
