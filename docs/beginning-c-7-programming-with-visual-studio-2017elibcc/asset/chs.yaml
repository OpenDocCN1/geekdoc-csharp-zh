  \n### 练习 8\n\n实现此操作的方法如下：\n\n```cs\n public static string ToAcronym(this string\
  \ inputString) => \n\n    inputString.Trim().Split(' ').Aggregate<string, string>(\"\
  \",\n\n          (a, b) => a + (b.Length > 0 ?\n\n          b.ToUpper()[0].ToString()\
  \ : \"\")); \n```\n\n在这里，三元运算符防止了多个空格引起错误。注意，需要带有两个泛型类型参数的 `Aggregate()` 版本，因为需要种子值。\n\
