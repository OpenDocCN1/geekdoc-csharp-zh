  \ 和 `OpenWrite()` 方法。\n\n#### 读取数据\n\n\n\n\n使用 `FileStream` 类读取数据并不像使用 `StreamReader`\
  \ 类那么简单，你将在本章的稍后部分介绍后者。这是因为 `FileStream` 类专门处理原始字节（raw bytes）。以原始字节方式工作使得 `FileStream`\
  \ 类适用于任何类型的数据文件，不仅仅是文本文件。通过读取字节数据，`FileStream` 对象可以用于读取图像或声音文件等。这种灵活性的代价是，你无法像使用\
  \ `StreamReader` 类那样使用 `FileStream` 将数据直接读取到字符串中。然而，有几个转换类可以很方便地将字节数组转换为字符数组，反之亦然。\n\
  \n`FileStream.Read()` 方法是从 `FileStream` 对象指向的文件中访问数据的主要手段。该方法从文件中读取数据，然后将这些数据写入\
  \ `byte` 数组中。它有三个参数，第一个是传入的 `byte` 数组，用于接收来自 `FileStream` 对象的数据。第二个参数是 `byte` 数组中开始写入数据的位置——这通常为\
  \ 0，以便从数组的开头开始写入文件数据。最后一个参数指定了从文件中读取多少字节。\n\n接下来的“尝试一试”演示了如何从随机访问文件中读取数据。你将读取的文件实际上是你为该示例创建的类文件。\n\
  \n### 写入数据\n\n向随机访问文件写入数据的过程非常相似；必须创建一个 `byte` 数组。此此最简单的方法是首先构建要写入文件的字符数组。接下来，使用\
  \ `Encoder` 对象将其转换为字节数组，就像你之前使用 `Decoder` 对象那样样。最后，调用 `Write()` 方法将数组发送到文件。\n\n\
  接下来的“尝试一试”是一个演示如何实现此操作简单示例。\n\n### StreamWriter 对象\n\n处理字节数组并不是大多数人认为很有趣的事——在在用过\
  \ `FileStream` 对象后，你可能会怀疑是否有更简单的方法。不要担心，一旦你有了一个 `FileStream` 对象，你通常会创建一个 `StreamWriter`\
  \ 或 `StreamReader`，并使用它的方法来操作文件。如果你不需要将文件指针更改到任意位置的能力，这些类将使文件操作变得简单得多。\n\n`StreamWriter`\
  \ 类允许你向文件写入字符和字符串，由该类处理底层的转换并为你写入 `FileStream` 对象中。\n\n创建 `StreamWriter` 对象有许多方法。如果你已经有一个\
  \ `FileStream` 对象，那么你可以使用它来创建一个 `StreamWriter`：\n\n```\nFileStream aFile = new FileStream(\"\
  Log.txt\", FileMode.CreateNew);\nStreamWriter sw = new StreamWriter(aFile); \n```\n\
  \n也可以直接从文件创建 `StreamWriter` 对象：\n\n```\nStreamWriter sw = new StreamWriter(\"Log.txt\"\
  , true); \n```\n\n此构造函数接收文件名和一个布尔值，该布尔值指定是否追加：\n\n* 如果设置为 `false`，则从文件开始写入数据。\n\
  * 如果设置为 `true`，则在文件末尾追加数据。\n\n与 `StreamReader` 不同，`StreamWriter` 允许你以特定的编码写入文件。如果你不指定编码，它将使用默认的编码：\n\
  \n```\nStreamWriter sw = new StreamWriter(\"Log.txt\", true, Encoding.UTF8);\n```\n\
  \n`StreamWriter` 还可以允许你指定缓冲区的大小。如果你不指定，它将使用默认的 4 KB：\n\n```\nStreamWriter sw = new\
  \ StreamWriter(\"Log.txt\", true, Encoding.UTF8, 4096);\n```\n\n`StreamWriter` 还允许你设置\
  \ `AutoFlush` 属性。如果设置为 `true`，则每次调用 `Write()` 方法后都会刷新缓冲区：\n\n```\nStreamWriter sw\
  \ = new StreamWriter(\"Log.txt\", true);\nsw.AutoFlush = true;\n```\n\n调用 `Flush()`\
  \ 方法可以让你手动将缓冲区中的所有数据写入文件：\n\n```\nStreamWriter sw = new StreamWriter(\"Log.txt\"\
  , true);\nsw.Flush();\n```\n\n最后，调用 `Close()` 方法将关闭文件并释放资源：\n\n```\nStreamWriter\
  \ sw = new StreamWriter(\"Log.txt\", true);\nsw.Close();\n```\n\n在实际开发中，通常使用 `using`\
  \ 语句来确保对象在使用完毕后被正确关闭：\n\n```csharp\nusing (StreamWriter sw = new StreamWriter(\"\
  Log.txt\", true))\n{\n    sw.WriteLine(\"Hello World\");\n}\n```\n\n### StreamReader\
  \ 对象\n\n`StreamReader` 类允许你从文件中读取字符和字符串。与 `StreamWriter` 不同，你可以通过 `FileStream` 创建它：\n\
  \n```\nFileStream aFile = new FileStream(\"Log.txt\", FileMode.Open);\nStreamReader\
  \ sr = new StreamReader(aFile);\n```\n\n你也可以直接从文件创建它：\n\n```\nStreamReader sr =\
  \ new StreamReader(\"Log.txt\");\n```\n\n`StreamReader` 构造函数还允许你指定编码：\n\n```\nStreamReader\
  \ sr = new StreamReader(\"Log.txt\", Encoding.UTF8);\n```\n\n你还可以指定缓冲区的大小：\n\n```\n\
  StreamReader sr = new StreamReader(\"Log.txt\", Encoding.UTF8, 4096);\n```\n\n`StreamReader`\
  \ 允许你设置 `DetectEndOfStream` 属性。如果设置为 `false`，当到达文件末尾时将抛出异常：\n\n```csharp\nStreamReader\
  \ sr = new StreamReader(\"Log.txt\");\nsr.DetectEndOfStream = false;\n```\n\n`EndOfStream`\
  \ 属性可以检查是否已经到达文件末尾：\n\n```csharp\nStreamReader sr = new StreamReader(\"Log.txt\"\
  );\nif (!sr.EndOfStream)\n{\n    // 读取数据\n}\n```\n\n`Peek()` 方法允许你查看下一个字符而不读取它：\n\
  \n```\nStreamReader sr = new StreamReader(\"Log.txt\");\nint nextChar = sr.Peek();\n\
  ```\n\n`Read()` 方法读取一个字符并返回其整数值：\n\n```csharp\nStreamReader sr = new StreamReader(\"\
  Log.txt\");\nint charCode = sr.Read();\nwhile (charCode != -1)\n{\n   Console.Write((char)charCode);\n\
  \   charCode = sr.Read();\n}\n```\n\n`ReadLine()` 方法读取一行并返回字符串：\n\n```sharp\nStreamReader\
  \ sr = new StreamReader(\"Log.txt\");\nstring line;\nwhile ((line = sr.ReadLine())\
  \ != null)\n{\n   Console.WriteLine(line);\n}\n```\n\n`Read()` 方法还可以将字符读取到缓冲区中：\n\
  \n```java\nStreamReader sr = new StreamReader(\"Log.txt\");\nchar[] buffer = new\
  \ char[100];\nint charsRead;\nwhile ((charsRead = sr.Read(buffer, 0, buffer.Length))\
  \ > 0)\n{\n   // 处理 buffer\n}\n```\n\n`ReadToEnd()` 方法读取整个文件并返回字符串：\n\n```csharp\n\
  StreamReader sr = new StreamReader(\"Log.txt\");\nstring content = sr.ReadToEnd();\n\
  Console.WriteLine(content);\n```\n\n`StreamReader` 还可以允许你跳过指定数量的字符：\n\n```csharp\n\
  StreamReader sr = new StreamReader(\"Log.txt\");\nsr.Read(10);\n```\n\n`StreamReader`\
  \ 还可以允许你跳转到文件的特定位置：\n\n```csharp\nStreamReader sr = new StreamReader(\"Log.txt\"\
  );\nsr.BaseStream.Position = 0;\n```\n\n最后，调用 `Close()` 方法将关闭文件并释放资源：\n\n```csharp\n\
  StreamReader sr = new StreamReader(\"Log.txt\");\nsr.Close();\n```\n\n在实际开发中，通常使用\
  \ `using` 语句来确保对象在使用完毕后被正确关闭：\n\n```csharp\nusing (StreamReader sr = new StreamReader(\"\
  Log.txt\"))\n{\n    string line = sr.ReadLine();\n}\n```\n\n\n\n\n为了方便操作，.NET 4.5\
  \ 引入了处理流的异步方法。这不仅适用于 `FileStream` 类，也适用于 `StreamReader` 和 `StreamWriter`。如果你浏览过这些类的定义，可能会注意到一些以后缀\
  \ `Async` 结尾的方法——例如，`StreamReader` 有一个名为 `ReadLineAsync()` 的方法，它是 `ReadLine()` 的异步版本。这些方法设计用于基于任务的异步编程模型（task-based\
  \ asynchronous programming model）。\n\n异步编程是一项高级技术，本书中未进行详细介绍。然而，如果你对异步文件系统访问感兴趣，这里是一个很好的开始。你可能还想阅读\
  \ Christian Nagel 编写的 *Professional C# 7.0 and .NET Core 2.0*（Wrox, 2018）以获取更多详细信息。\n\
  \n## 读和写入压缩文件\n\n在处理文件时，通常会占用大量的磁盘空间。这对于图形和音频文件尤其如此。你可能遇到过允许你压缩和解压缩文件的工具，这些工具在你想移动或通过电子邮件发送文件时非常有用。`System.IO.Compression`\
  \ 命名空间包含了若干类，允许你在代码中使用 GZIP 或 Deflate 算法压缩文件——这两种算法都是公开的，任何人都可以免费使用。\n\n不过，压缩文件不仅仅是压缩本身。你可能已经看到过商业应用程序如何将多个文件放在单个压缩文件中，这通常被称为*归档*（archive）。`System.IO.Compression`\
  \ 命名空间中的某些类可以实现类似的功能。然而，为了保持本书内容的简单性，你将只查看一种场景：将文本数据保存到压缩文件中。你可能无法在外部工具中访问此文件，但该文件会比其未压缩的副本小得多！\n\
  \n在这里我们将介绍的 `System.IO.Compression` 命名空间中的两个压缩流类 `DeflateStream` 和 `GZipStream`\
  \ 的工作方式非常相似。在两种情况下，你都用一个现有的流来初始化它们，对于文件来说，就是一个 `FileStream` 对象。之后，你可以像使用其他流一样配合\
  \ `StreamReader` 和 `StreamWriter` 使用它们。除此，你只需要指定该流是用于压缩（保存文件）还是解压缩（加载文件），以便该类知道如何处理通过它的数据。下面的示例可以很好地说明这一点。\n\
  \n## 监控文件系统\n\n有时，应用程序必须执行比向文件系统读写文件更多的操作。例如，知道文件或目录何时被修改可能非常重要。.NET Framework 能够轻松创建执行此类操作自定义应用程序。\n\
  \n帮助你实现此点的类是 `FileSystemWatcher` 类。它暴露了几个应用程序可以捕获的事件。这使得你的应用程序能够响应文件系统事件。\n\n使用\
  \ `FileSystemWatcher` 的基本程序非常简单。首先，你必须设置若干属性，这些属性指定了监控哪里、监控什么以及何时触发你的应用程序处理的事件。然后，你给它提供自定义事件处理程序的地址，以便在发生重大事件时调用这些处理程序。最后，你开启它并等待事件发生。\n\
  \n在启用 `FileSystemWatcher` 对象之前必须设置的属性如 表 20-10 所示。\n\n| **属性** | **描述** |\n| ---\
  \ | --- |\n| `Path` | 必须设置为监控的文件位置或目录。 |\n| `NotifyFilter` | `NotifyFilters` 枚举值的组合，用于指定监控文件内要关注的内容。这些代表了被监控的文件或文件夹的属性。如果任何指定的属性发生变化，就会触发事件。可能的枚举值有\
  \ `Attributes`、`CreationTime`、`DirectoryName`、`FileName`、`LastAccess`、`LastWrite`、`Security`\
  \ 和 `Size`。注意这些值可以使用二进制 `OR` 运算符组合。 |\n| `Filter` | 指定要监控哪些文件的过滤器——例如 `*.txt`。 |\n\
  \n**表 20-10 ：FileSystemWatcher 属性**\n\n一旦设置这些属性，你必须为四个事件编写事件处理器：`Changed`、`Created`、`Deleted`\
  \ 和 `Renamed`。如第 13 章 本章学到的知识\n\n| **主题** | **关键概念** |\n| --- | --- |\n| 流 | 流是序列设备的抽象表示，你可以按字节对其进行读取或写入。文件是此类设备的一个示例。有两种类型的流——输入和输出——分别用于从设备读取和写入设备。\
  \ |\n| 文件类 | .NET Framework 中有许多抽象文件系统的类，包括通过静态方法处理文件和目录的 `File` 和 `Directory` 类，以及\
  \ `FileInfo` 和 `DirectoryInfo` 可以实例化以表示特定的文件和目录。后两类类在对文件和目录执行多次操作时非常有用，因为这些类不需要为每个方法调用都提供路径。\
  \ |\n| 文件路径 | 文件和目录路径可以是绝对的或相对的。绝对路径提供了从驱动器根开始的完整描述；所有父目录之间用反斜杠分隔。相对路径类似，但它们从文件系统中的定义点开始，例如应用程序运行的目录（工作目录）。为了导航文件系统，你经常使用\
  \ `..` 父目录别名。 |\n| FileStream 对象 | `FileStream` 对象提供对文件内容的读写访问。它在字节级别上访问文件数据，因此并不总是访问文件数据的最佳选择。`FileStream`\
  \ 实例维护文件内部的偏移字节索引，以便你遍历文件内容。以这种方式在文件的任何位置进行访问被称为*随机访问*（random access）。 |\n\n\n\n\
  \n\n| 向流读写数据 | 读写文件数据的一种简单方法是结合使用 `StreamReader`、`StreamWriter` 类和 `FileStream`。这些类允许你读取和写入字符数据及字符串数据，而不是处理字节数据。这些类型暴露了用于处理字符串的熟悉方法，包括\
  \ `ReadLine()` 和 `WriteLine()`。由于它们处理的是字符串数据，这些类使得处理逗号分隔的文件变得简单，而这是表示结构化数据的常用方式。\
  \ |\n| 压缩文件 | 你可以使用 `DeflateStream` 和 `GZipStream` 压缩流类来从文件和向文件读写压缩数据。这些类处理字节数据的方式与\
  \ `FileStream` 非常相似，但与使用 `FileStream` 一样，你可以通过 `StreamReader` 和 `StreamWriter` 类访问数据以简化你的代码。\
  \ |\n| 监控文件系统 | 你可以使用 `FileSystemWatcher` 类来监控文件系统数据的更改。你可以监控文件和目录，并在需要时提供过滤器，仅修改具有特定文件扩展名的文件。`FileSystemWatcher`\
  \ 实例通过触发你可以在代码中处理的事件来通知你更改。 |\n\n# 21 XML 和 JSON\n\n## XML 基础\n\n可扩展标记语言 (XML) 是一种\
  \ `data language`，它是以简单的文本格式存储数据的方法，这种格式可以被人类和几乎任何计算机读取。它是一种 W3C 标准格式，类似于 HTML（[www.w3.org/XML](http://www.w3.org/XML)）。它已被微软在\
  \ .NET Framework 和其他微软产品完全采用。即使是新版本的 Microsoft Office 引入的文档格式也是基于 XML 的，尽管 Office\
  \ 本身并不是 .NET 应用程序。\n\nXML 的细节可能非常复杂，因此你在这里不会查看每一个细节。幸运的是，大多数任务不需要对 XML 有详细的了解，因为\
  \ Visual Studio 通常会处理大部分工作——你很少需要手写 XML 文档。如果你想更深入地学习 XML，可以阅读诸如 Joe Fawcett、Danny\
  \ Ayers 和 Liam Quin 写的 *Beginning XML* (Wrox, 2012)，或者查看许多在线教程之一，例如 [`www.xmlnews.org/docs/xml‐basics.html`](http://www.xmlnews.xmlnews.org/docs/xml-basics.html)\
  \ 或 [`http://www.w3schools.com/xml/`](http://www.w3schools.com/xml/)。\n\n基本格式非常简单，如下例所示，该示例显示了共享书籍信息的\
  \ XML 格式。\n\n```xml\n <book>\n    <title>Beginning Visual C# 7</title>\n    <author>Benjamin\
  \ Perkins et al</author>\n    <code>458685</code>\n  </book> \n```\n\n在数数例中，每本书书都有一个标题、一个作者和一个标识书籍的唯一代码。每本书的数据都包含在一个以\
  \ `<book>` `tag` 开始并以 `</book>` 结束标签结束的 book `element` 中。标题、作者和代码的值值存储在 book 元素内部的嵌套元素中。\n\
  \n可选情况下，元素在标签内部还可能拥有 `attributes`（属性）。如果书籍代码是 book 元素的属性而不是它自己的元素，你将看到 book 元素开头如下所示：`<book\
  \ code=458685>`。为了保持简单，我们在本章的示例中坚持使用元素。通义地说，属性和元素都被称为 `nodes`（节点），就像图的节点一样。\n\n\
  ## JSON 基础\n\n你在开发 C# 时可能会遇到的另一种数据语言是 JSON。JSON 代表 JavaScript 对象表示（JavaScript Object\
  \ Notation）。像 XML 一样，它也是一种标准（[www.json.org](http://www.json.org)），但从名称中看出，它源自 JavaScript\
  \ 语言而不是 C#。虽然不像 XML 那样用于整个 .NET，但它是从 Web 服务和网络浏览器传输数据的常用格式。\n\nJSON 也有非常简单的格式。之前在\
  \ XML 中展示的相同书籍数据在这里以 JSON 形式呈现：\n\n```json\n {\"book\":[{\"title\":\"Beginning Visual\
  \ C# 2017\",\n          \"author\":\"Benamin Perkins et al\",\n          \"code\"\
  :\"458685\"}] \n```\n\n与之前的 XML 示例一样，我们看到了具有相同标题、作者和唯一代码的书籍。JSON 使用大括号 `{}` 来分隔数据块，使用方括号\
  \ `[]` 来分隔数组，类似于 C#、JavaScript 和其他类 C 语言使用大括号表示代码块、使用方括号表示数组的方式。\n\nJSON 是比 XML\
  \ 更紧凑的格式，但对人类来说读起来要困难得多，尤其是当大括号和括号在复杂数据中深度嵌套时。\n\n## XML 架构\n\nXML 文档可以用 `schema`（架构）来描述，架构是另一个\
  \ XML 文件，描述了特定文档中允许哪些元素和属性。你可以根据架构 `validate`（验证）XML 文档，确保你的程序不会遇到它未准备好处理的数据。C#\
  \ 使用的标准架构 XML 格式是 XSD（XML Schema Definition）。\n\n图 21‐1 包含了 Visual Studio 识别的架构列表（你可以通过从\
  \ Visual Studio 菜单选择 XML ![image](img/Image00008.gif) Schemas… 来查看此列表）。然而，Visual\
  \ Studio 不会自动记住你使用过的架构。如果你反复使用某个架构且不想每次都浏览它，可以将其复制到以下位置：`C:\\Program Files (x86)\\\
  Microsoft Visual Studio\\2017\\Community\\Xml\\Schemas`。任何复制到该位置的架构都会出现在对话框中。\n\n\
  ![Visual Studio 识别的架构列表截图](img/Image0251.jpg)\n**图 21‐1**](#text00027.html_c21-fig-0001)\
  \ 你可以从 XML 文件创建 XML 架构并使用它。\n\n## XML 模型\n\nXML 模型（XML DOM）是一组用于直观方式访问和操作 XML 的类。DOM\
  \ 可能不是读取 XML 最快的方法，但一旦你理解了类与 XML 元素之间的关系，就会发现它非常好用。\n\n构成 DOM 的类可以在 `System.Xml`\
  \ 命名空间中找到。该命名空间有很多类，但本章重点关注用于操作 XML 的少数类。这些类在表 21 ไว้1 中描述。\n\n| 类 | 描述 |\n| ---\
  \ | --- |\n| `XmlNode` | 文档树中的单个节点。它是本章许多类的基类。如果此节点代表 XML 文档的根，你可以从它导航到文档的任何位置。\
  \ |\n| `XmlDocument` | 扩展了 `XmlNode` 类，但通常是你使用的对象。这是因为该类用于从磁盘或其他地方加载和保存数据。 |\n|\
  \ `XmlElement` | XML 文档中的单个元素。`XmlElement` 派生自 `XmlLinkedNode`，后者又派生自 `XmlNode`。\
  \ |\n| `XmlAttribute` | 单个属性。与 `XmlDocument` 类一样，它派生自 `XmlNode` 类。 |\n| `XmlText`\
  \ | 起始标签和结束标签之间的文本。 |\n| `XmlComment` | 代表一种特殊的节点，除了向读者提供文档部分的信息外，不被视为文档的一部分。 |\n\
  | `XmlNodeList` | 代表节点集合。 |\n\n**表 21-1](#text00027.html_R_c21-tbl-0001) :** 常用\
  \ DOM 类\n\n### XmlDocument 类\n\n\n\n\n\n[content]\n通常，你的应用程序对 XML 想要的第一件事就是从磁盘读取它。正如\
  \ 表 21-1 所示，这是 `XmlDocument` 类的领域。你可以将 `XmlDocument` 视为磁盘上文件的内存中的表示。一旦你使用 `XmlDocument`\
  \ 类将文件加载到内存，你就可以从它获取文档的根节点，并开始读取和操作 XML：\n\n```xml\nusing System.Xml;\n\n.\n\n.\n\
  \n.\n\nXmlDocument document = new XmlDocument();\n\ndocument.Load(@\"C:\\BeginningCSharp7\\\
  Chapter21\\XML and Schema\\books.xml\"); \n```\n\n这两行代码创建了 `XmlDocument` 类的一个新实例并将文件\
  \ `books.xml` 加载到该实例中。\n\n记住，`XmlDocument` 类位于 `System.Xml` 命名空间，你应该在代码开头的 `using`\
  \ 部分插入 `using System.Xml;`。\n\n除了加载和保存 XML 之外，`XmlDocument` 类还负责维护 XML 结构本身。因此，你会在该类中发现许多用于在树中创建、修改和删除节点的方法。你很快就会查看其中一些方法，但为了正确演示这些方法，你需要更多地了解另一个类：`XmlElement`。\n\
  \n### XmlElement 类\n\n现在文档已经加载到内存中，你想要对它进行一些操作。你在前面的代码中创建的 `XmlDocument` 实例的 `DocumentElement`\
  \ 属性返回 `XmlElement` 实例，该实例代表 `XmlDocument` 的根元素。这个元素很重要，因为它允许你访问文档中的每一比特信息：\n\n\
  ```xml\nXmlDocument document = new XmlDocument();\n\ndocument.Load(@\"C:\\BeginningCSharp7\\\
  Chapter21\\\nXML and Schema\\books.xml\");\n\nXmlElement element = document.DocumentElement;\
  \ \n```\n\n在获取文档的根元素后，你就可以使用这些信息了。`XmlElement` 类包含了用于操作树节点和属性的方法和属性。让我们先检查导航 XML\
  \ 元素的属性，它们在 表 21-2 中。\n\n| **属性** | **描述** |\n| --- | --- |\n| `FirstChild` | 返回此元素之后的第一个子元素。如果你记得本章节较早之前的\
  \ `books.xml` 文件，文档的根节点名为“books”，之后的下一个节点是“book”。那么在该文档中，根节点“books”的第一个孩子就是“book”。`<books>\
  \ Root node` `<book> FirstChild` `FirstChild` 返回一个 `XmlNode` 对象，你应该测试返回节点的类型，因为因为它并不总是是\
  \ `XmlElement` 实例。在书籍示例中，`Title` 元素的子节点实际上是一个代表文本 `Beginning Visual C#` 的 `XmlText`\
  \ 节点。 |\n| `LastChild` | 操作方式与 `FirstChild` 属性完全相同，但它返回的是当前节点的最后一个子节点。在书籍示例中，“books”节点的最后一个子节点仍然是一个“book”节点，但它将是代表“Beginning\
  \ XML”书籍的节点。`<books> Root node` `<book> FirstChild` `<title>Beginning Visual C#\
  \ 2017</title>` `<author>Benjamin Perkins et al</author>` `<code>458685</code>`\
  \ `</book>` `<book> LastChild` `<title>Beginning XML</title>` `<author>Joe Fawcett\
  \ et al</author>` `<code>162132</code>` `</book>` `</books>` |\n| `ParentNode` |\
  \ 返回当前节点的父节点。在书籍示例中，“books”节点是两个“book”节点的父节点。 |\n| `NextSibling` | `FirstChild`\
  \ 和 `LastChild` 属性返回当前节点的叶子节点时，`NextSibling` 节点返回具有相同父节点的下一个节点。在书籍示例中，这意味着获取 `title`\
  \ 元素的 `NextSibling` 将返回 `author` 元素，对该元素调用 `NextSibling` 将返回 `code` 元素。 |\n| `HasChildNodes`\
  \ | 允许你检查当前元素是否有子元素，而无需实际从 `FirstChild` 获取值并将其与 `null` 进行比较。 |\n\n**表 21-2 :** XmlElement\
  \ 属性\n\n使用 表 21-2 中的五个属性，可以遍历整个 `XmlDocument`，如下面的“试一试”所示。\n\n### 修改节点的值\n\n在检查如何更改节点的值之前，重要的是意识到节点的值极少是简单东西。事实上，你会发现尽管所有派生自\
  \ `XmlNode` 的类都包含一个名为 `Value` 的属性，但它极少返回对你有用的内容。\n\n```xml\n<books>\n  <book>\n\
  \    <title>Beginning Visual C# 2017</title>\n    <author>Benjamin Perkins et al</author>\n\
  \    <code>458685</code>\n  </book>\n  <book>\n    <title>Beginning XML</title>\n\
  \    <author>Joe Fawcett et al</author>\n    <code>162132</code>\n  </book>\n</books>\n\
  ```\n\n\n\n\n# 插入新节点\n\n现在你已经了解到可以在 XML 文档中移动，甚至获取元素的值，让我们来看如何通过向你一直使用的 `books`\
  \ 文档添加节点来更改文档的结构。\n\n要在列表中插入新元素，你需要检查位于 `XmlDocument` 和 `XmlNode` 类上的新方法，如表 21-4\
  \ 所示。`XmlDocument` 类具有允许你创建新的 `XmlNode` 和 `XmlElement` 实例的方法方法，这很棒，因为这两个类都只有一个受保护的构造函数，这意味着你不能直接通过\
  \ `new` 创建其中任何一个类的实例。\n\n| 方法 | 描述 |\n| --- | --- |\n| `CreateNode` | 创建任何类型的节点。该方法有三个重载，其中两个允许你创建在\
  \ `XmlNodeType` 枚举中找到的类型的节点，另一个允许你以字符串形式指定要使用的节点类型。除非你非常确定要指定枚举中以外的节点类型，否则请使用使用枚举的两个重载。该方法返回一个\
  \ `XmlNode` 实例，然后可以显式强制转换为相应的类型。 |\n| `CreateElement` | `CreateNode` 的版本，仅创建 `XmlElement`\
  \ 类型的节点。 |\n| `CreateAttribute` | `CreateNode` 的版本，仅创建 `XmlAttribute` 类型的节点。 |\n\
  | `CreateTextNode` | 创建——是的，你猜对了——`XmlTextNode` 类型的节点。 |\n| `CreateComment` | 此处包含此方法是为了突出可以创建的节点类型的多样性。此方法不会创建一个实际上作为\
  \ XML 文档所表示的数据部分的节点，而是为了任何可能读取数据的肉眼准备的注释。在你的应用程序中读取文档时，也可以获取注释。 |\n\n**表 21-4 :**\
  \ 创建节点的方法\n\n表 21-4 中的方法都用于创建节点本身，但在调用其中任何一个方法后，在它们变得有用之前，你必须对它们进行某些操作。在创建后紧立即，节点不包含任何额外信息，而且尚未插入文档。要执行其中任何一项，你应该使用任何派自\
  \ `XmlNode` 的类（包括 `XmlDocument` 和 `XmlElement`）上的方法，如表 21-5 所示所示。\n\n| 方法 | 描述 |\n\
  | --- | --- |\n| `AppendChild` | 向 `XmlNode` 类型或其派生类型的节点添加子节点。记住，你添加的节点将出现在调用方法的节点的子节点列表的底部。如果你不在乎子节点的顺序，没问题；如果你在意，请记住按照正确的顺序添加节点。\
  \ |\n| `InsertAfter` | 精确控制你想插入新节点的位置。该方法接受两个参数——第一个是新节点，第二个是新节点应该插入在其之后的节点。 |\n\
  | `InsertBefore` | 工作原理与 `InsertAfter` 完全相同，区别是新节点被插入到你提供的作为引用的节点之前。 |\n\n**表 21-5\
  \ :** 插入节点的方法\n\n在接下来的“尝试一下”中，你将在之前的示例的基础上构建并在 `books.xml` 文档中插入一个书籍节点。示例中还没有清理文档的代码（目前），所以如果你运行它几次，最后可能会得到许多相同的节点。\n\
  \n# 删除节点\n\n现在你已经学会了如何创建新节点，剩下的就是学习如何再次删除它们了。所有派自 `XmlNode` 的类都包含两个方法，如表 21-6 所示所示，这些方法允许你从文档中移除节点。\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `RemoveAll` | 移除调用方法节点中的所有子节点。稍不明显的是，它还会移除该节点上的所有属性，因为它们也被视为子节点。\
  \ |\n| `RemoveChild` | 移除调用方法节点中的单个子节点。该方法返回已从文档中移除的节点，但如果你改变了主意，可以重新插入它。 |\n\n\
  **表 21-6 :** 删除节点的方法\n\n接下来的简短“尝试一下”扩展了你在过去两个示例中创建的应用程序，包含了删除节点的功能。目前，它只找到最后一个书籍节点实例并将其移除。\n\
  \n# 选择节点\n\n你现在已经知道了如何在 XML 文档中来回移动，如何操作文档的值，如何创建新节点，以及如何再次删除它们。本节仅剩一件事：如何在不需要遍历整个树的情况下选择节点。\n\
  \n`XmlNode` 类包含两个方法，如表 21-7 所示所示，通常用于在不运行整个文档的情况下选择节点：`SelectSingleNode` 和 `SelectNodes`，它们都使用一种特殊的语言\
  \ XPath，稍后介绍。\n\n| 方法 | 描述 |\n| --- | --- |\n| `SelectSingleNode` | 选择单个节点。如果你创建一个获取多个节点的查询，将返回第一个节点。\
  \ |\n| `SelectNodes` | 返回 `XmlNodeList` 形式的节点集合。 |\n\n**表 21-7 :** 选择节点的方法\n\n#\
  \ 将 XML 转换为 JSON\n\n我们在本引言中提到了 JSON 数据语言。C# 库对 JSON 的支持有限，但你可以使用第三方 JSON 库来处理 JSON\
  \ 以转换 XML 以及反之，并进行其他 JSON 操作。通过 Visual Studio 包管理器可用的此类库是 Newtonsoft JSON。该包的完整教程可以在\
  \ `www.json.net`。\n\n接下来的简短“尝试一下”扩展了你一直在创建的应用程序，包含了将 XML 转换为 JSON 的功能。\n\n# 使用 XPath\
  \ 搜索 XML\n\nXPath 是 XML 文档的查询语言，就像 SQL 之于关系数据库。它被表 21-7 所示所示的方法，允许你避免遍历整个树的麻烦。然而，这需要一点适应，因为语法不像\
  \ SQL 或 C#。\n\n为了正确看到 XPath 的作用，你将使用一个名为 `Elements.xml` 的 XML 文件，它包含了周期表的部分列表。你将在稍后部分的“选择节点”尝试一下示例中找到该\
  \ XML 的子集，并可以在本书网站下载的代码中找到它。\n\n表 21-8 列出了你可以使用 XPath 执行的一些常用操作。如果没有另有说明，XPath 查询示例相对于相对于执行它的节点进行选择。在必须有节点名称的情况下，你可以假设当前节点是\
  \ XML 文档中的 `<element>` 节点。\n\n| 目的 | XPath 查询示例 |\n| --- | --- |\n| 选择当前节点 | `.`\
  \ |\n| 选择当前节点的父 | `..` |\n| 选择当前节点的所有子节点 | `*` |\n| 选择特定名称的子节点——在此情况下，是 `title`\
  \ | `Title` |\n| 选择当前节点的属性 | `@Type` |\n| 选择当前节点的所有属性 | `@*` |\n| 按索引选择子节点——在此情况下，是第二个元素节点\
  \ | `element[2]` |\n| 选择当前节点的所有文本节点 | `text()` |\n\n\n\n\n\n| 选择当前节点的一个或多个孙子节点。\
  \ | `element/text()` |\n| 选择文档中具有特定名称的所有节点——在此情况下，是所有的 `mass` 节点。 | `//mass` |\n\
  | 选择文档中具有特定名称且具有特定父节点的所有节点——在此情况下，父节点名称为 `element`，节点名称为 `name`。 | `//element/name`\
  \ |\n| 选择符合值准则的节点——在此情况下，元素名称为 `Hydrogen` 的元素。 | `//element[name='Hydrogen']` |\n\
  | 选择符合属性值准则的节点——在此情况下，`Type` 属性为 `Noble Gas`（稀气体）。 | `//element[@Type='Noble Gas']`\
  \ |\n\n**表 21-8:** 常见的 XPath 操作\n\n在接下来的“尝试用用”（Try It Out）中，你将创建一个小型应用程序，该程序让你能够执行并查看多个预定义查询的结果，还可以输入你自己的查询。\n\
