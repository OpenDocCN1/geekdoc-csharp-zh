- "# C# 7 编程入门指南：Visual Studio 2017\n\n\n\n![](img/Image00000.jpg)\n![](img/Image00000.jpg)\n\
  \n# 引言\n\n**C# 语言在 2000 年 7 月微软发布首个版本的 .NET 框架时向世界揭开了面纱**。从那时起，它的热度飙升，可以说它已成为使用\
  \ .NET 框架的桌面、Web、云端和跨平台开发者的首选语言。C# 的魅力之处源于它清晰的语法，这种语法源自 C/C++，但简化了一些以前让某些程序员望而却步的问题。尽管经过了这些简化，C#\
  \ 仍然保留了 C++ 的强大，现在没有理由不转向 C#。这种语言并不困难，是学习基础编程技术的绝佳工具。这种易用性结合 .NET 框架的功能，使得 C# 成为开启编程生涯的极佳方式。\n\
  \nC# 的最新版本是 C# 7（包含在 .NET 框架 4.7 版本中），它在现有成功的基础上增加了更具吸引力的特性。Visual Studio 的最新版本（Visual\
  \ Studio 2017）以及 Visual Studio Code 2017 开发工具系列也带来了许多调整和改进，让你的生活更轻松，并大幅提高你的效率。\n\
  \n本书旨在教你关于 C# 编程的所有方面，包括语言本身、桌面、云端和跨平台编程、数据源的使用以及一些新的高级技术。你还将学习 Visual Studio 2017\
  \ 的功能以及该产品辅助你应用程序开发的所有方法。\n\n本书以友好的、导师式的风格编写，每一章都建立在前章的基础上，并尽力让你无痛地过渡到高级技术。在任何时候，技术术语都不会凭空出现而打击你继续学习的积极性；每个概念都会根据需要进行介绍和讨论。技术术语被降至最低，但在必要时，也会在文中进行适当的定义和布局。\n\
  \n本书的作者都是各自领域的专家，并且对 C# 语言和 .NET 框架都充满热情。你在任何地方都找不到比他们更合适的人来带领你，并在他们的指导下培养你从基本原理到高级技术的对\
  \ C# 的理解。除了书中提供的基础知识外，书中还充满了实用的提示、技巧、练习题和完整的示例代码（可以在本书的网页 [`www.wrox.com`](http://www.wrox.com)\
  \ 以及 [`https://github.com/benperk/BeginningCSharp7`](https://github.com/benperk/BeginningCSharp7)\
  \ 上下载），随着你职业的进步，你会发现自己会反复查阅这些内容。\n\n我们毫不吝啬地传递这些知识，并希望你能够利用它们成为你最优秀的程序员。祝你好运，一切顺利！\n\
  \n## 本书适合的读者\n\n本书适合所有想要学习如何使用 .NET 框架用 C# 编程的人。它适合想要通过学习一种简洁、现代、优雅的编程语言来尝试编程的初学者。但同时也适合熟悉其他编程语言并想要探索\
  \ .NET 平台的人，以及想要尝试微软 .NET 旗舰语言的现有 .NET 开发者。\n\n## 本书涵盖的内容\n\n早期章节涵盖了语言本身，假设你没有之前的编程经验。如果你以前用其他语言编写过程序，这些章节大部分内容对你来说是熟悉的。C#\
  \ 语法的许多方面与其他语言共享，许多结构在几乎所有编程语言中都是通用的（例如循环和分支结构）。然而，即使你是一个经验丰富的程序员，通过阅读这些章节来学习这些技术在\
  \ C# 中的具体应用，也将受益匪浅。\n\n如果你是编程新手，应该从开始学习，在里面将学习基础编程概念，并熟悉 C# 及其支撑它的 .NET 平台。如果你是\
  \ .NET 框架的新手但知道如何编程，你应该阅读第 1 章，然后快速浏览接下来的几章，再继续 C# 语言的应用。如果你知道编程但以前没有接触过面向对象的编程语言，你应该从第\
  \ 8 章开始阅读后续章节。\n\n或者，如果你已经熟悉 C# 语言，你可能想集中在处理最新 .NET 框架和 C# 语言进展的章节，特别是关于集合、泛型和 C#\
  \ 语言增强的章节（第 11 章和第 12 章）。\n\n本书的章节设计有两个目的：它们可以按顺序阅读以提供完整的 C# 语言教程，也可以根据需要作为参考资料。\n\
  \n除了核心内容外，从第 3 章开始，大多数章节末尾还包含了一些练习，你可以通过完成这些练习来确保理解了材料内容。练习从简单的单选题或判断题到需要你构建应用程序的复杂练习不等。所有练习的答案都可以在附录中找到。你也可以在\
  \ [wrox](http://wrox.com/) 上找到这些练习。\n\n本书还关注了 C# 7 和 .NET 4.7 的发布。每一章都经过了修订，删除了相关的材料并添加了新内容。所有代码都针对最新版本的开发工具进行了测试，所有的截图都在\
  \ Windows 10 中重新拍摄过，以提供最新的窗口和对话框。本书版本的的新亮点包括：\n\n* 供你尝试的额外和改进的代码示例\n* C# 7 和 .NET\
  \ 4.7 所有新内容的覆盖\n* .NET Core 和 ASP.NET Core 跨平台编程示例\n* 使用 Azure 创建和访问云资源的示例\n\n##\
  \ 本书结构\n\n本书分为六部分：\n\n* **引言**——本书的目的和内容概述\n* **C# 语言**——涵盖 C# 语言的所有方面，从基础到面向对象的技术\n\
  * **Windows 编程**——使用 Windows Presentation Foundation (WPF) 库编写和部署桌面应用程序\n* **云端和跨平台编程**——云端和跨平台应用程序开发与部署，包括\
  \ Web API 的创建和消费\n* **数据访问**——如何在中使用数据，包括存储在硬盘上的文件、XML 格式数据和数据库数据\n* **额外技术**——研究\
  \ C# 和 .NET 框架的一些额外用法，包括 Windows Communication Foundation (WCF) 和通用应用程序\n\n以下章节介绍了书中五个主要部分的章节。\n\
  \n### C# 语言（第 1 章 – 第 13 章））\n\n第 1 章向你介绍了 C# 以及它如何融入 .NET 领域。你将学习该环境下的编程基础知识，以及\
  \ Visual Studio 2017 (VS) 的角色。\n\n\n\n\n\n第 2 章 将带你开始编写 C# 应用程序。你将学习 C# 的语法，并通过示例命令行应用程序和\
  \ Windows 应用程序来使用这种语言。这些示例展示了上手并运行是多么的快速简单，而且在此过程中，你将熟悉 Visual Studio 开发环境以及贯本书书中将用到的基础窗口和工具。\n\
  \n接下来，你将学习更多关于 C# 语言的基础知识。在第 3 章中，你将学习变量以及如何操作它们。在第 4 章中，你将通过流程控制（循环和分支）增强应用程序的结构，并在第\
  \ 5 章中看到一些更高级的变量类型，例如数组。在第 6 章中，你将开始以函数的形式封装代码，这使得执行重复操作变得简单得多，并让你的代码更具可读性。\n\n\
  到第 7 章开始时，你已经掌握了 C# 语言的基础知识，并将专注于应用程序的调试。这涉及查看应用程序执行时输出的跟踪信息，以及如何利用 Visual Studio\
  \ 强大的调试环境来捕获错误并引导你找到解决方案。\n\n从第 8 章开始，你将学习面向对象编程（OOP），首先了解这个术语的含义，并回答那个永恒的问题：“什么是对象？”OOP\
  \ 初初看起来可能非常困难。整个第 8 章都致力于揭开它的神秘面纱并解释它为什么如此伟大，在章节最后结束之前，你实际上不会处理太多的 C# 代码。\n\n在第\
  \ 9 章中一切都发生了变化，你将理论付诸实践，并开始在 C# 应用程序中使用 OOP。这正是 C# 的真正威力所在。你将从学习如何定义类和接口开始，然后在第\
  \ 10 章中学习类成员（包括字段、属性和方法）。在该章节结束时，你将开始组装一个牌牌应用程序，该程序将跨多个章节开发，并将有助于说明 OOP。\n\n一旦你学会了\
  \ OOP 在 C# 中如何工作，第 11 章将转向研究常见的 OOP 场景，包括处理对象集合以及比较和转换对象。第 12 章介绍了 C# 在 .NET 2.0\
  \ 中引入的一项非常实用的特性：泛型，它允许你创建非常灵活的类。接下来，第 13 章通过一些额外技术继续讨论 C# 语言和 OOP，特别是事件，这在 Windows\
  \ 编程中变得非常重要。第 13 章通过关注随语言 3.0、4、5 和 6 版本引入的 C# 语言特性来总结基础知识。\n\n### Windows 编程（第\
  \ 14 章 – 15 章））\n\n第 14 章首先介绍什么是 Windows 编程，并介绍如何在 Visual Studio 中实现它。它重点关注 WPF，这是一个工具允许你以图形化的方式构建桌面应用程序，并以最小的精力和时间组装高级应用程序。你将从\
  \ WPF 编程的基础开始，在本章以及第 15 章中积累知识，后一章将阐述你如何在应用程序中使用 .NET Framework 提供的丰富控件。\n\n###\
  \ 云计算与跨平台编程（第 16 章 – 19 章））\n\n第 16 章首先描述了什么是云编程，并讨论了云优化的技术栈。云环境与传统的代码编写方式并不相同，因此讨论并定义了一些云编程模式。为了完成本章，你需要一个免费的\
  \ Azure 账户，以便创建一个 App Service Web App。然后，使用带有 C# 的 Azure SDK，从 ASP.NET 4.7 Web 应用程序创建并访问存储帐户。\n\
  \n在第 17 章中，你将学习如何创建并部署 ASP.NET Web API 到云端，然后从类似的 ASP.NET 4.7 Web 应用程序调用该 Web API。该章节结束时讨论了云端两个最有价值的特性：扩展和。\n\
  \n第 18 章引入了 .NET Standard 和 .NET Core，这些是针对任何应用程序的工具。第 19 章描述了 ASP.NET Webforms、ASP.NET\
  \ MVC 和 .NET Core。\n\n### 数据访问（第 20 章 – 23 章查看应用程序如何保存和检索数据，既可以是简单的文本文件，也可以是复杂的数据表示。你还将学习如何压缩数据以及如何监控。\n\
  \n在第 21 章中，你将学习数据交换的事实标准——XML，以及一种新兴的格式 JSON。\n\n本部分的剩余内容将介绍 LINQ，它是内置版本 .NET 中的查询语言。你将在第\
  \ 22 章从 LINQ 概述开始，然后在第 23 章中通过 LINQ 访问数据库和其他数据。\n\n### 额外技术（第 24 章 – 25 章））\n\n\
  第 24 章是 Windows 通信基础（WCF）的介绍，它提供了跨本地网络和互联网进行企业级程序化访问所需的工具。你将看到如何使用 WCF 以平台无关的方式向\
  \ Web 和桌面应用程序暴露复杂的数据和功能。\n\n第 25 章向你展示如何创建通用 Windows 应用（Universal Windows Apps），这是\
  \ Windows 的新特性。本章基于第 14 章和 15 章的基础，展示你如何创建适用于所有 Windows 平台的 Windows 应用。\n\n## 使用本书所需的条件\n\
  \n书中 C# 和 .NET Framework 的代码和描述适用于 C# 7 和 .NET 4.7。理解书的这部分不需要 Framework 以外的任何内容，但许多示例需要开发工具。本书使用\
  \ Visual Studio Community 2017 作为主要开发工具。使用 Visual Studio Community 2017 创建 Windows、云和跨平台应用程序，并为访问数据库的应用程序使用\
  \ SQL Server Express。某些功能仅在 Visual Studio 2017 可用，但这不会阻止你完成书中的任何示例。\n\n\n\n\n示例的源代码可以从本书在\
  \ [`www.wrox.com`](http://www.wrox.com) 上的页面以及 [`https://github.com/benperk/BeginningCSharp7`](https://github.com/benperk/BeginningCSharp7)\
  \ 下载。\n\n## 约定\n\n为了帮助你从书中获得最大益处并跟踪内容进展，我们在整本书中使用了一些约定。\n\n关于正文中的样式：\n\n- 当我们介绍新术语和重要词汇时，会对它们进行*斜体*处理。\n\
  - 我们像这样显示键盘按键组合：`Ctrl+A`。\n- 我们在文中这样显示文件名、URL 和代码：`persistence.properties`\n\n我们通过两种不同的方式来展示代码：\n\
  \n```\n对于大多数代码示例，我们使用不带语法高亮的等宽字体类型。\n\n我们使用**粗体**来强调当前语境下特别重要的代码，或者显示与之前的代码片段相比的变化。\n\
  ```\n\n## 源代码\n\n在学习本书中的示例时，你可以选择手动输入所有代码，也可以使用随书附带的源代码文件。书中使用的所有源代码都可以本书在[`www.wrox.com`](http://www.wrox.com/)\
  \ 上的页面以及 [`https://github.com/benperk/BeginningCSharp7`](https://github.com/benperk/BeginningCSharp7)\
  \ 下载。\n\n你也可以通过 ISBN（本书的 ISBN 为 978‐1‐119‐45868‐5）在[`www.wrox.com`](http://www.wrox.com/)\
  \ 上搜索本书以找到代码。所有当前 Wrox 书籍的代码下载列表可以在[`www.wrox.com/dynamic/books/download.aspx`](http://www.wrox.com/dynamic/books/download.aspx)\
  \ 获取。\n\n[`www.wrox.com`](http://www.wrox.com/) 上的大部分代码都压缩为 `.ZIP`、`.RAR` 或适用于平台的类似存档格式。一旦下载代码，只需使用适当压缩工具将其解压缩。\n\
  \n## 勘误\n\n我们尽力确保文本或代码中没有错误。然而，没有人是完美的，错误在所避免。如果你在我们的某本书中发现错误（例如拼写错误或错误的代码），我们将非常感谢你的反馈。通过提交勘误，你可以为其他读者节省数小时的挫败时间，同时帮助我们提供更高质量的信息。\n\
  \n要找到本书的勘误页面，请前往本书在[`www.wrox.com`](http://www.wrox.com) 上的页面并点击 `Errata` 链接。在该页面，你可以查看所有提交本书并由\
  \ Wrox 编辑器发布的勘误。\n\n如果你在书籍勘误页面上没有发现“你的”错误，请前往[`www.wrox.com/contact/techsupport.shtml`](http://www.wrox.com/contact/techsupport.shtml)\
  \ 并填写那里的表格向我们发送你发现的错误。我们将检查信息，并在适当的情况下书籍勘误页面发布消息，并在书籍的后续版本中修复问题。\n\n# 第一部分：C# 语言\n\
  \n- 第 1 章：引言 C#\n- 第 2 章：编写 C# 程序\n- 第 3 章：变量与表达式\n- 第 4 章：流程控制\n- 第 5 章：更多关于变量\n\
  - 第 6 章：函数\n- 第 7 章：调试与错误处理\n- 第 8 章：面向对象编程简介\n- 第 9 章：定义类\n- 第 10 章：定义类成员\n- 第\
  \ 11 章：集合、比较与转换\n- 第 12 章：泛型\n- 第 13 章：额外的 C# 技术\n\n# 1. 引言 C#\n\n欢迎来到本书第一部分的第一章。本节为你提供了上手并运行最新版本\
  \ C# 所需的基础知识。具体来说，本章概述了 `.NET Framework` 和 C#，包括这些技术是什么、使用它们的动机以及它们之间如何相互关系。\n\n\
  它从对 `.NET Framework` 的通用讨论开始。这项技术包含许多初难以掌握的的概念。这意味着，由于需要，讨论在很短的空间内涵盖了许多概念。然而，快速浏览一下基础知识对于理解如何用\
  \ C# 编程至关重要。在这一通用介绍之后，本章对 C# 本身进行了基本描述，包括它的起源以及与 C++ 的相似之处。最后，你将了解到本书使用的主要工具：`Visual\
  \ Studio` (`VS`)。\n\n## 什么是 .NET Framework？\n\n`.NET Framework`（现在为 `4.7`）是微软创建用于开发的革命性平台。这个陈述最有趣的地方在于它是如此模糊且局限——但这有其理由。首先，请注意它并不只在\
  \ Windows 上开发。虽然微软版本的 `.NET Framework` 运行在 Windows 系统上，但可以找到其他系统的替代版本。一个例子是 `Mono`，它是\
  \ `.NET Framework`（包含 C# 编译器）的开源版本，可以在多个系统上运行，包括各种发行版的 Linux 和 macOS；你可以在 [`www.mono-project.com`](http://www.mono-project.com)\
  \ 获取更多信息。\n\n`Mono` 是 .NET 生态系统中非常的一部分，特别是对于使用 `Xamarin` 创建客户端。微软还创建了一个名为 `.NET\
  \ Core` ([`github.com/dotnet/core`](https://github.com/dotnet/core)) 的跨平台开源库，他们希望这对\
  \ Mono 和 .NET Core 框架产生积极影响。这两个生态系统的程序员可以使用对方的示例。\n\n此外，`.NET Framework` 的定义对应用程序类型没有限制。它可以创建桌面应用程序、Windows\
  \ Store 应用程序、云应用程序、Web API 以及你可以想象的几乎任何类型。此外，Web、云和 Web API 应用程序根据定义就是平台应用程序，因为任何带有网络浏览器的系统都可以访问它们。\n\
  \n这一切都提供了极高的灵活性，这也是为什么使用 `.NET Framework` 如此具有吸引力的原因之一。\n\n### .NET Framework 包含什么？\n\
  \n\n\n\n\n`.NET Framework` 主要由一个巨大的代码库组成，你可以通过客户端或服务器端语言（如 `C#`）利用面向对象编程（OOP）技术来使用该代码库。该库被划分为不同的模块——你可以根据想要实现的结果使用其中的部分。例如，一个模块包含构建\
  \ Windows 应用程序的构建组件，另一个模块用于网络编程，还有一个模块用于 Web 开发。某些模块被细分为更具体的子模块，例如在 Web 开发模块中有一个用于构建\
  \ Web 服务的模块。\n\n其意图是让不同的操作系统根据其特性支持这些模块的部分或全部。例如，智能手机包含了对所有基础 .NET 功能的支持，但可能不需要某些较冷门的模块。\n\
  \n`.NET Framework` 库的一部分定义了一些基础 `types`（类型）。类型是数据的表示，通过指定一些最基础的类型（例如“ 32 位有符号整数”）可以方便使用\
  \ `.NET Framework` 的语言之间的互操作性。这被称为公用类型系统（`CTS`）。\n\n除了提供此库外，`.NET Framework` 还包含了\
  \ `.NET 通用语言运行时`（`CLR`），它负责执行所有使用 `.NET` 库开发的应用程序。\n\n### .NET Standard 和 .NET Core\n\
  \n当 `.NET Framework` 最初创建时，尽管它被设计为运行在多个平台上，但当时还没有行业认可的开源分支概念。如今，通常在 `GitHub` 上，一个项目可以被分叉然后进行定制以运行在多个平台上。例如，`.NET\
  \ Compact Framework` 和 `.NET Micro Framework` 是 `.NET Framework` 的分支，也如 `.NET Core`，它是作为跨平台代码开发的的最优化解决方案而创建的。这些\
  \ `.NET Framework` “变体”或“垂直领域”中的每一个都有特定的需求和目标，这些需求触发了创建该分支的。\n\n`.NET Framework`\
  \ 包含一组基类库（`BCL`），其中包含了大多数开发者需要程序执行的基础操作的 API。这些操作包括：例如文件访问、字符串处理、流管理、在集合中存储数据、安全属性以及许多其他内容。这些基础能力在每种\
  \ `.NET Framework` 变体中的实现方式往往有所不同。这要求开发者根据应用程序运行的平台，为每个分支或变体学习、开发和管理多个 `BCL`。这就是\
  \ `.NET Standard` 所解决的问题。\n\n人们预计很快，这种分支概念将产生更多 `.NET Framework` 的变体。这种增加将需要一组能够与每个分支和变体工作的标准基础编程\
  \ API。如果没有这个跨平台基础库，开发和支持的复杂性将阻止分支版本的快速采用。简而言之，`.NET Standard` 是一个类库，它暴露了支持任何使用 `.NET`\
  \ 平台的应用程序分支或变体的 API。\n\n### 使用 .NET Framework 和 .NET Core 编写应用程序\n\n使用 `.NET Framework`\
  \ 或 `.NET Core` 编写应用程序意味着使用 `.NET` 代码库编写代码（使用支持该框架的任何语言）。在本书中，你将使用 `Visual Studio`\
  \ 进行开发。`Visual Studio` 是一个强大的集成开发环境，它支持 `C#`（以及托管和非托管的 `C++`、`Visual Basic` 以及其他语言）。该环境的优势在于可以将\
  \ `.NET` 特性轻松集成到你的代码中。你创建的代码将完全是 `C#`，但整个过程中都会使用 `.NET Framework`，你会在必要时利用 `Visual\
  \ Studio` 中的额外工具。\n\n为了让 `C#` 代码执行，它必须转换为目标操作系统能够理解的语言，即 `native code`（原生代码）。这种转换被称为代码\
  \ `compiling`（编译），是由 `compiler`（编译器）执行的操作。在 `.NET Framework` 和 `.NET Core` 下，这是一个阶段阶段。\n\
  \n#### CIL 和 JIT\n\n当你编译使用 `.NET Framework` 或 `.NET Core` 库的代码时，你不会立即创建特定操作系统的原生代码。相反，你将代码编译为通用中间语言（`CIL`）代码。这种代码不特定于任何操作系统（OS），也不特定于\
  \ `C#`。其他 .NET 语言——例如 `Visual Basic .NET` 或 `F#`——第一阶段也会编译为这种语言。当你开发 `C#` 应用程序时，这一编译步骤是由\
  \ `Visual Studio` 完成的。\n\n显然，执行应用程序还需要更多工作。这就是即时编译（`just-in-time`）编译的工作，它将 `CIL`\
  \ 编译为特定目标操作系统和机器架构的原生代码。只有在此时，操作系统才能执行应用程序。名称中的 `just-in-time` 部分反映了 `CIL` 代码仅在需要时才被编译。这种编译可以在你的应用程序运行时动态发生，尽管幸运的是，作为开发者，你通常不需要担心这一点。除非你正在编写性能至关重要的极高级代码，否则只需要知道这个编译过程会在后台愉快地运行，而不会产生干扰就足够。\n\
  \n在过去，通常需要将你的代码编译为几个应用程序，每个程序都针对特定的操作系统和 CPU 架构。通常，这是优化的一种（例如让代码在 AMD 芯片组上运行得更快），但在某些情况下它是至关重要的（例如让应用程序同时在\
  \ `Win9x` 和 `WinNT/2000` 环境中运行）。现在这是不必要的，因为 `JIT` 编译器（正如其名称所示）使用 `CIL` 代码，这种代码独立于机器、操作系统和\
  \ CPU。存在多个 `JIT` 编译器，每个针对不同的架构，`CLR`/`CoreCLR` 使用相应的那个来创建所需的原生代码。\n\n这一切的妙之处在于它为你减少了大量工作——事实上，你可以忘记依赖系统的细节，专注于代码更有趣的功能。\n\
  \n#### 程序集\n\n当你编译应用程序时，`CIL` 代码被存储在 `assembly`（程序集）中。程序集包含了可以直接从 Windows 运行而不需要其他程序的的可执行应用程序文件（扩展名为\
  \ `.exe`）以及可供其他程序使用的库（扩展名为 `.dll`）。\n\n除了包含 `CIL` 之外，程序集还包含 `meta` 信息（即程序集所包含的信息，也称为元数据）和可选的\
  \ `resources`（CIL 使用的额外数据，如声音文件和图片）。元数据使得程序集能够完全自描述。使用程序集不需要其他信息，这意味着你避免了诸如未能将必要数据添加到系统注册表等情况，这在用其他平台开发时通常是一个问题。\n\
  \n这意味着部署应用程序通常只需要将文件复制到远程计算机的目录中。由于目标系统不需要额外信息，你只需从该目录运行可执行文件，并且对于针对 `.NET Framework`\
  \ 的应用程序，假设已安装了 `.NET CLR`，就可以运行。对于针对 `.NET Core` 的应用程序，运行程序所需的所有模块都包含在部署包中，因此不需要额外的配置。\n\
  \n\n\n\n\n从 .NET Framework 的角度来看，你不一定想将运行应用程序所需的所有内容都放在一个地方。你可能会编写一些执行多个应用程序所用任务的代码。在这种情况下，将可重用的代码放置在所有应用程序都可以访问的地方通常很有用。在\
  \ .NET Framework 中，这就是“全局程序集缓存”（`global assembly cache`，`GAC`）。将代码放入 `GAC` 非常简单——你只需要将包含代码的程序集放在该缓存所在的目录中。\n\
  \n### 托管代码\n`CLR/CoreCLR` 的作用并不在你将代码编译为 `CIL` 且 `JIT` 编译器将其编译为原生代码后就结束。使用 .NET Framework\
  \ 和 .NET Core 编写的代码在执行时是“托管的”（`managed`）（这一阶段通常被称为运行时 `runtime`）。这意味着 `CLR/CoreCLR`\
  \ 通过管理内存、处理安全、允许跨语言调试等来维护你的应用程序。相比之下，不运行 `CLR/CoreCLR` 控制下运行的应用程序被称为“非托管的”（`unmanaged`），某些语言（如\
  \ `C++`）可以编写此类应用程序，例如访问操作系统的低级函数。然而，在 `C#` 中，你只能编写运行在托管环境的代码。你将利用 `CLR/CoreCLR`\
  \ 的托管功能，并允许 `.NET` 本身处理与操作系统的任何交互。\n\n### 垃圾回收\n托管代码最重要的特性之一是“垃圾回收”（`garbage collection`）概念。这是\
  \ .NET 的一种方法，确保在应用程序不再使用时完全释放其所使用的内存。在 .NET 之前，这大部分是程序员的责任，代码中的几个简单错误就会导致大块内存由于被分配到内存中的错误位置而神秘消失。这通常意味着你的计算机逐渐变慢，然后导致系统崩溃。\n\
  \n`.NET` 垃圾回收通过定期检查计算机的内存并移除其中不再需要的内容来工作。这没有固定的时间范围；可能每秒发生数千次，每几秒发生一次，或者随时发生，但你可以放心它会发生。\n\
  \n这对程序员来说有一些影响。由于这项工作是在不可预测的时间为你完成的，因此设计应用程序时必须考虑到这一点。需要大量内存运行的代码应该自己清理，而不是等待垃圾回收的发生，但这听起来并没有那么复杂。\n\
  \n### 整合在一起\n在继续之前，让我们总结一下之前讨论过的创建 .NET 应用程序所需的步骤：\n\n1. 使用 .NET 兼容语言（如 `C#`）编写应用程序代码（参见图\
  \ 1-1）。\n2. 将该代码编译为 `CIL`，并存储在程序集中（参见图 1-2）。\n3. 当执行此代码时（如果是可执行文件则独立运行，或者从其他代码中调用时），它必须首先使用\
  \ `JIT` 编译器将其编译为原生代码（参见图 1-3）。\n4. 原生代码在托管的 `CLR/CoreCLR` 上下文中任何其它正在运行的应用程序或进程一起执行，如图图\
  \ 1-4 所示。\n\n![使用 .NET 兼容语言（如 C#）编写的应用程序代码图示。](img/Image00003.jpg)\n\n**图 1-1**\n\
  \n![编译为 CIL 并存储在程序集中的 C# 应用程序代码图示。](img/Image00004.jpg)\n\n**图 1-2**\n\n![使用 JIT\
  \ 编译为原生代码的代码图示。](img/Image00005.jpg)\n\n**图 1-3**\n\n![在托管的 CLR/CoreCLR（通用语言运行时）上下文中执行的原生代码图示。](img/Image00006.jpg)\n\
  \n**图 1-4**\n\n### 链接\n注意关于此过程的另外一点。在步骤 2 中编译为 `CIL` 的 `C#` 代码不需要包含在单个文件中。可以将应用程序代码拆分为多个源代码文件，然后将它们编译成单个程序集。这一极其有用的过程被称为“链接”（`linking`）。需要这一步是因为处理几个较小文件比处理一个巨大的文件要容易得多。你可以将逻辑相关的代码分到单独的文件中，以便独立地进行开发，并在完成后几乎完全忘记它。这也使得在需要时易于找到特定的代码段，并允许开发团队将编程负担划分为多个可管理的块，以便个人可以“检出”代码段进行工作，而不会冒着损坏其他满意的部分或其他人正在编写部分的风险。\n\
  \n## 什么是 C#？\n\n如前所述，`C#` 是用于创建运行在 .NET 上的应用程序的语言之一。`C#` 是 `C` 和 `C++` 语言的演进，专门为配合\
  \ .NET 而创建的。\n\n使用 `C#` 开发应用程序比 `C++` 更简单，因为语言语法更简单。尽管如此，`C#` 是一门强大的语言，你在 `C++`\
  \ 中可能想做的事情在 `C#` 中几乎都能做。话虽如此，`C#` 中那些与 `C++` 高级功能对应的功能（例如直接访问和操作内存）可以使用标记为 `unsafe`\
  \ 的代码执行。这种高级技术具有潜在危险（名副其实），因为它可能会覆盖系统关键内存块导致灾难性结果。由于由于等原因，本书不涵盖该主题。\n\n有时 `C#` 代码比\
  \ `C++` 稍微冗长。这是因为 `C#` 是一门类型安全的语言（不像 `C++`）。用通俗的话说，这意味着一旦数据分配给某种类型，它就不能转换为另一种类型。因此，在类型之间转换时必须遵守严格规则，这意味着在\
  \ `C#` 中执行相同任务通常比在 `C++` 中需要更多代码。然而，这样做也有好处——代码更健壮，调试更简单，并且 `.NET` 随时可以跟踪数据的类型。因此在\
  \ `C#` 中，你可能无法执行诸如“提取内存中从 4 个字节开始的 10 个字节的数据并解释为 X”的操作，但这并不不是好事。\n\n`C#` 只是 .NET\
  \ 开发的语言之一，但它无疑是最好的。它的优势是唯一专为 .NET Framework 设计的语言，并且移植到其他操作系统的 .NET 版本中的主要语言。相比之下，`C#`\
  \ 可以利用 .NET Framework 代码库提供的所有功能，但并非所有功能都移植到了 `.NET Core`。此外，每个新版本的 `.NET` 都包含了\
  \ `C#` 语言的新增，部分是为了响应开发者的请求，使其变得更加强大。\n\n### 你用 C# 编写的应用程序\n\n\n\n\n\n如前所述，.NET Framework\
  \ 对可能实现的应用程序类型没有限制。C# 使用该框架，因此对可能实现的应用程序也没有限制。（不过，目前使用 .NET Core 只能编写控制台和 ASP.NET\
  \ 应用程序。）不过，这里有几种常见的应用程序类型：\n\n*   `Desktop applications`（桌面应用程序）——如 Microsoft Office\
  \ 之类的应用程序，具有熟悉的 Windows 外观和感受。通过使用 .NET Framework 的 Windows Presentation Foundation（`WPF`）模块，这变得简单，它是一个包含\
  \ `controls`（如按钮、工具栏、菜单等）的库，你可以使用它们来构建 Windows 用户界面（UI）。\n*   `Windows Store applications`（Windows\
  \ Store 应用）——Windows 8 引入了一种新的应用程序类型，即 Windows Store 应用。此类应用程序主要为触控设备设计，通常全屏运行，干扰极少，并强调简洁。你可以通过多种方式创建这些应用程序，包括使用\
  \ `WPF`。\n*   `Cloud/Web applications`（云/Web 应用程序）-.NET Framework 和 .NET Core 包含一个名为\
  \ `ASP.NET` 的强大系统，用于动态生成 Web 内容，实现个性化、安全等许多功能。此外，这些应用程序可以在云端托管和访问，例如在 Microsoft\
  \ Azure 平台上运行。\n*   `Web APIs`（Web API）——构建支持各种客户端（包括移动设备和浏览器）的 RESTful HTTP 服务的理想框架。\n\
  *   `WCF services`（WCF 服务）——创建多功能分布式应用程序的方法。使用 `WCF`，无论用于创建服务的语言或其所在的系统，你都可以使用相同的简单语法在本地网络或\
  \ Internet 上交换任何数据。\n\n这些类型中的任何都可能需要某种形式的数据库访问，可以通过 .NET Framework 的 `ADO.NET`（活动数据对象\
  \ .NET）部分、通过 `Entity Framework` 或通过 C# 的 `LINQ`（集成查询）能力来实现。对于需要数据库访问的 .NET Core\
  \ 应用程序，你将使用 `Entity Framework Core` 库。还可以利用许多资源，例如创建网络组件的工具、输出图形、执行复杂的数学任务等。\n\n\
  ### 本书中的 C#\n\n本书的第一部分涉及 C# 语言的语法和用法，不过并不强调 .NET Framework 或 .NET Core。这是必要的，因为如果你没有\
  \ C# 编程的坚实基础，就完全无法使用 .NET Framework 或 .NET Core。事实上，你将从更简单的开始，并在涵盖基础知识之前，留到更复杂的面向对象编程（OOP）话题。这些内容是从基本原理开始教授的，假设完全没有编程知识。\n\
  \n之后，你就准备好开发更复杂（但更有用）的应用程序了。第二部分处理 Windows 编程，第三部分探索云和跨平台编程，第四部分检查数据访问（用于 ORM 数据库概念、文件系统和\
  \ XML 数据）以及 `LINQ`。本书的第五部分将介绍 `WCF` 和 Windows Store 应用编程。\n\n## VISUAL STUDIO 2017\n\
  \n在书中，你使用 `Visual Studio 2017` 开发工具进行所有的 C# 编程，从简单的命令行应用程序到更复杂的项目类型。开发工具或集成开发环境（IDE），如\
  \ `Visual Studio`，对于开发 C# 应用程序并非必不可少，但它让事情变得简单得多。如果需要，你可以在基础文本编辑器（如无处不在的 `Notepad`\
  \ 应用程序）中操作 C# 源代码文件，并使用 .NET Framework 和 .NET Core 部分的命令行编译器将代码编译为程序集。然而，既然你有 IDE\
  \ 的力量来帮助你你还要这么做呢？\n\n### Visual Studio 2017 产品\n\n微软提供了多个版本的 `Visual Studio`，例如：\n\
  \n*   `Visual Studio Code`\n*   `Visual Studio Community`\n*   `Visual Studio Professional`\n\
  *   `Visual Studio Enterprise`\n\n`Visual Studio Code` 和 `Community` 可以在 `https://www.visualstudio.com/en-us/downloads/download-visual-studio-vs`\
  \ 免费获取。`Professional` 和 `Enterprise` 版本具有额外的功能，并且需要付费。\n\n各种 `Visual Studio` 产品允许你创建任何可能需要的\
  \ C# 应用程序。`Visual Studio Code` 是一个简单而强大的代码编辑器，运行在 Windows、Linux 和 iOS 上。`Visual\
  \ Studio Community` 与 `Visual Studio Code` 不同，它保留了与 `Visual Studio Professional`\
  \ 和 `Enterprise` 相同的外观和感受。微软在 `Visual Studio Community` 中提供了许多与 `Professional` 和\
  \ `Enterprise` 版本相同的功能；但是，缺少了一些显著的功能，例如深度调试能力和代码优化工具。不过，缺失的功能并不至于让你无法使用 `Community`\
  \ 来完成本书的章节。`Visual Studio Community 2017` 是用于完成书中示例的 IDE 版本。\n\n### 解决方案\n\n当你使用\
  \ `Visual Studio` 开发应用程序时，你是通过创建 `solutions`（解决方案）来实现的。在 `Visual Studio` 术语中，解决方案是一个应用程序。解决方案包含\
  \ `projects`（项目），这些可能是 `WPF` 项目、云/Web 应用程序项目、`ASP.NET Core` 项目等。因为解决方案可以包含多个项目，所以你可以将相关代码组合在一起，即使它们最终会编译到硬盘上不同位置的多个程序集。\n\
  \n这非常有用，因为允许你在开发使用该代码的应用程序的同时处理共享代码（可能放在 `GAC` 中）。当只使用一个开发环境时，调试代码要容易得多。\n\n## ![image](img/Image0002.gif)\
