  \ `View Code`（查看代码），或选择文件并点击窗口顶部出现的工具栏按钮，使用此窗口更改主窗口中显示的代码。你还可以在此对文件执行其他操作，例如重命名文件或从项目中删除它们。其他文件类型也会出现在这里，例如项目资源（资源是项目使用的文件，可能不是\
  \ C# 文件，例如位图图像和声音文件）。同样，你仍然可以通过相同的界面对它们进行操作。\n\n你还可以展开如 `Program.cs` 等代码项以查看其内容。这种对代码结构的概览是一个非常有用的工具；它还允许你直接导航到代码文件的特定部分，而无需打开代码文件并滚动到想要的部分。\n\
  \n`References`（引用）条目包含你在项目中使用的 .NET 库列表。你稍后会查看此内容；目前使用标准引用即可。类视图（Class View）通过显示你创建的代码结构提供了提供了项目的另一种视图。你将在本书的稍后部分回到这里；现在使用解决方案管理器（Solution\
  \ Explorer）的显示就足够。当你点击这些窗口中的文件或其他图标时，注意 `Properties`（属性）窗口（如 图 2-9 所示）的内容发生了变化。\n\
  \n![截图说明，显示了点击两个窗口中的文件或其他图标时，属性窗口的内容。](img/Image00016.jpg)\n\nFIGURE 2‐9\n\n###\
  \ 属性窗口\n\n`Properties`（属性）窗口（选择 `View` ![image](img/Image00008.gif)`Properties Window`，如果尚未显示）显示了有关你在其上方窗口中所选的任何内容的附加信息。例如，当选中项目的\
  \ `Program.cs` 文件时，会显示如 图 2-9 所示的视图。此窗口还显示有关其他选中项的信息，例如用户界面组件（如本章“桌面应用程序”部分所示）。\n\
  \n通常，你对 `Properties` 窗口中条目的进行的更改会直接影响你的代码，添加代码行或更改你文件中的内容。对于某些项目，你通过此窗口操作花费的时间与手动修改代码一样多。\n\
  \n### 错误列表窗口\n\n目前，`Error List`（错误列表）窗口（`View` ![image](img/Image00008.gif)`Error\
  \ List`）没有显示任何有趣的内容，因为应用程序没有错误。然而，这确实是一个非常有用的窗口。作为测试，从你在上一节中添加的代码行中删除分号。过了一会儿，你应该会看到类似于\
  \ 图 2-10 所示的显示。\n\n![截图说明，显示错误列表窗口（View&#10154;Error List）的界面。](img/Image00017.jpg)\n\
  \nFIGURE 2‐10\n\n此外，项目将不再能够编译。\n\n此窗口帮助你消除代码中的错误，因为它跟踪了编译项目时需要执行的操作。如果你双击此处显示的错误，光标将跳转到源代码中错误的位置（如果包含错误的源文件尚未打开，则会打开它），这样你可以快速修复它。代码中的错误位置会出现红色波浪线，因此你可以快速扫描源代码以查看问题所在之处。\n\
  \n错误位置指定为行号。默认情况下，Visual Studio 文本编辑器不显示行号，但那是非常值得开启的。要为此操作，请在 `Options`（选项）对话框中勾选\
  \ `Line numbers`（行号）复选框（通过 `Tools` ![image](img/Image00008.gif)`Options` 菜单项选择）。它出现在\
  \ `Text Editor`（文本编辑器） ![image](img/Image00008.gif)`All Languages` ![image](img/Image00008.gif)`General`（常规）类别下。\n\
  \n你还可以通过对话框中的特定语言设置页面按语言更改此设置。通过此对话框可以找到许多其他实用选项，你将在本书稍后部分使用其中几个。\n\n## 桌面应用程序\n\
  \n通过作为桌面应用程序的一部分来运行代码，通常比通过控制台窗口或命令行提示符更容易。你可以使用用户界面构建模块来拼凑出一个用户界面。\n\n下面的“尝试一下”（Try\
  \ It Out）仅显示了这种操作的基本知识，你将看到如何在不大量了解应用程序实际在做什么细节的情况下，让桌面应用程序运行起来。你在这里将使用 WPF，它是微软推荐的创建桌面应用程序的技术。稍后，你将详细查看桌面应用程序，并学习更多关于\
  \ WPF 是什么以及它的功能。\n\n## ![image](img/Image00002.gif) 本章你学到的知识\n\n| **主题** | **核心概念**\
  \ |\n| --- | --- |\n| Visual Studio 2017 设置 | 本书需要 C# 开发设置选项，你在第一次运行 Visual Studio\
  \ 时或通过重置设置选择该选项。 |\n| 控制台应用程序 | 控制台应用程序是简单的命令行应用程序，在本书的大部分用于说明技术。在 Visual Studio\
  \ 中创建项目时，使用 Console Application 模板创建一个控制台应用程序。调试模式下运行项目，使用 Debug ![image](img/Image00008.gif)`Start\
  \ Debugging` 菜单项，或按 F5。 |\n| IDE 窗口 | 项目内容显示在解决方案中。选中项目的属性显示在属性窗口中。错误显示在错误列表窗口。\
  \ |\n| 桌面应用程序 | 桌面应用程序具有标准 Windows 应用程序的外，包括熟悉的最大化、最小化和关闭应用程序的图标。它们是在新项目对话框中的 WPF\
  \ Application 模板创建的。 |\n\n# 基础\n\nC# 代码的外观和感觉类似于 C++ 和 Java。这种语法初看之下可能很困惑，不像某些语言那样接近书面英语。然而当你沉浸在\
  \ C# 编程世界时，你会发现这种风格是合理的，而且不需要费力就能编写出非常易读的代码。\n\n与 Python 等其他语言的编译器不同，C# 编译器忽略代码中额外的间距，无论它是由空格、换行符还是制表符引起的（统称为*空白字符*）。这意味着你在格式化代码方面有很大的自由，尽管遵循某些规则有助于代码更易读。\n\
  \nC# 代码由一系列语句组成，每条语句都以分号终止。因为忽略了空格，多个语句可以出现在同一行，但为了可读性，通常会在分号后添加换行符，以避免多个语句出现在同一行。然而，使用跨越几行的语句也是完全可以的也很常见的。\n\
  \nC# 是一种块结构语言，意味着语句是代码块的一部分。这些块由大括号（`{` 和 `}`）界定，可以包含任意数量的语句，或者都没有。注意大括号字符不需要伴随分号。\n\
  \n例如，一个简单的 C# 代码块可以采取以下形式：\n\n```\n {\n   <code line 1, statement 1>;\n\n   <code\
  \ line 2, statement 2>\n\n       <code line 3, statement 2>;\n\n}\n```\n\n\n\n\n\
  \n这里的 `<code line x, statement y>` 并不是真实的 C# 代码；这段文字仅用作占位符，用于表示 C# 语句所在的位置。在这种情况下，代码的第二行和第三行是同一个语句的一部分，因为第二行末尾没有分号。对第三行代码进行缩进可以更容易识别出它实际上是第二行的延续。\n\
  \n下面的简单示例使用了 `indentation`（缩进）来清晰 C# 本身。这实际上是标准做法，事实上，Visual Studio 默认会自动为你完成这一点。通常情况下，每个代码块都有自己的缩进层级，意味着它向右偏移的程度。代码块可以相互嵌套（即块可以包含其他块），在这种情况下，嵌套块将会进一步缩进：\n\
  \n```\n {\n\n   <code line 1>;\n\n   {\n\n      <code line 2>;\n\n      <code line\
  \ 3>;\n\n   }\n\n   <code line 4>;\n} \n```\n\n此外，作为前几行延续的代码行通常也会进一步缩进，正如第一个代码示例中的第三行代码那样。\n\
  \n当然，这种风格绝非强制性的。但如果你不使用它，当你阅读这本书时，会很快发现事情变得非常混乱！\n\n`Comments`（注释）是 C# 代码中经常看到的其他内容。严格来说，注释完全不是\
  \ C# 代码，但它们与代码和谐地共存。注释是自解释解释的：它们允许你向代码中添加描述性文本——使用纯英语（或法语、德语、蒙古语等）——而这些内容会被编译器忽略。当你开始处理很长的代码段时，添加关于你具体在做什么的提醒是非常用的，例如“这行代码向用户请求一个数字”或“这段代码是由\
  \ Bob 编写的”。\n\nC# 提供了两种方法来实现此功能。你可以在注释的开头和结尾放置标记，或者使用一个表示“此行剩余的所有内容都是注释”的标记。后者方法是前述提到的关于\
  \ C# 编译器忽略换行符规则的例外，但它是一个特殊情况。\n\n要使用第一种方法指示注释，你在注释的开头使用 `/*` 字符，结尾使用 `*/` 字符。这些字符可以出现在单行中，也可以出现在不同的行，在这种情况下，中间的所有行都是注释的一部分。你无法在注释体中输入的字符是\
  \ `*/`，因为它会被解释为结束标记。例如，以下内容都是正确的：\n\n```\n /* This is a comment */\n\n/* And so…\n\
  \n               … is this! */ \n```\n\n然而，以下内容会导致问题：\n\n```\n /* Comments often\
  \ end with \"*/\" characters */ \n```\n\n在这里，注释的结束（`\"*/` 之后的字符）将被解释为 C# 代码，并会发生错误。\n\
  \n另一种注释方法涉及以 `//` 开始注释。此后，你可以写任何你喜欢的内容——只要你保持在同一行即可！以下内容是正确的：\n\n```\n // This is\
  \ a different sort of comment. \n```\n\n然而，以下内容会失败，因为第二行被解释为 C# 代码：\n\n```\n //\
  \ So is this,\n\n   but this bit isn't. \n```\n\n这种类型的注释对于记录语句很有用，因为它们都可以放在同一行：\n\
  \n```\n <A statement>;         // Explanation of statement \n```\n\n前面提到过注释 C# 代码有两种方法，但\
  \ C# 中还有第三种类型的注释——虽然严格来说这是对 `//` 语法的扩展。你可以使用以三个 `/` 符号开头而不是两个的单行注释，如下所示：\n\n```\n\
  \ /// A special comment \n```\n\n在正常情况下，它们会被编译器忽略——就像其他注释一样——但你可以配置 Visual Studio\
  \ 在编译项目时提取这些注释后的文本并创建一个特殊格式的文本文件。然后你可以用它来创建文档。为了创建此文档，注释必须遵循此处描述的 XML 文档规则 [`https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/xmldoc/xml-documentation-comments`](https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/xmldoc/xml-documentation-comments)\
  \ —— 这个主题在书中未涵盖，但如果你有空闲，非常值得学习。\n\nC# 代码中一个`very`重要的点是它是 `case sensitive`（区分大小写的）。与其他某些语言不同，你必须使用完全正确的大小输入代码，因为使用大写字母代替小写字母将阻止项目编译。例如，考虑取自第二章\
  \ 的以下行代码：\n\n```\n Console.WriteLine(\"The first app in Beginning C# Programming!\"\
  ); \n```\n\n这段代码可以被 C# 编译器理解，因为 `Console.WriteLine()` 命令的大小写是正确的。然而，以下任何一行代码无法工作：\n\
  \n```\n console.WriteLine(\"The first app in Beginning C# Programming!\");\n\nCONSOLE.WRITELINE(\"\
  The first app in Beginning C# Programming!\");\n\nConsole.Writeline(\"The first\
  \ app in Beginning C# Programming!\"); \n```\n\n在这里，使用的大小写是错误的，所以 C# 编译器不知道你想做什么。幸运的是，正如你很快发现的，Visual\
  \ Studio 在输入代码方面非常有帮助，大多数时候它知道（在程序所能的范围内）你正在尝试做什么。\n\n## C# 结构\n\n在这里，我们将仔细观察第二章\
  \ 中的控制台示例 (`ConsoleApplication1`) 并稍微拆解其结构。这里是代码：\n\n```\n using System;\n\nusing\
  \ System.Collections.Generic;\n\nusing System.Linq;\n\nusing System.Text;\n\nusing\
  \ System.Threading.Tasks;\n\nnamespace ConsoleApplication1\n\n{\n\n   class Program\n\
  \n   {\n      static void Main(string[] args)\n\n      {\n         // Output text\
  \ to the screen.\n\n         Console.WriteLine(\"The first app in Beginning C# Programming!\"\
  );\n\n         Console.ReadKey();\n\n      }\n\n   }\n\n} \n```\n\n你可以立即看到在前一节讨论的所有语法元素都在这里——分号、大括号和注释，以及适当的缩进。\n\
  \n目前最重要的代码部分是：\n\n```\n static void Main(string[] args)\n\n{\n   // Output text\
  \ to the screen.\n\n   Console.WriteLine(\"The first app in Beginning C# Programming!\"\
  );\n\n   Console.ReadKey();\n\n} \n```\n\n这是当你运行控制台应用程序时执行的代码。嗯，更准确地说，在大括号内的代码块被执行了。注释行不起任何作用，正如之前提到的；它只是为了清晰。另外两行代码分别向控制台输出某些文本并等待响应，尽管目前不需要担心具体的机制。\n\
  \n注意如何实现上一章所示的代码大纲功能，尽管这是一个 Windows 应用程序，但这是一个非常有用的功能。你可以使用 `#region` 和 `#endregion`\
  \ 关键字来实现，它们定义了可以展开和折叠的代码区域的开始和结束。例如，你可以这样修改 `ConsoleApplication1` 的生成代码：\n\n```\n\
  \ #region Using directives\n\nusing System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\nusing System.Threading.Tasks;\n\n\
  #endregion \n```\n\n这允许你将这些代码折叠为单行，并在以后想查看细节时再次展开。这里包含的 `using` 语句以及其下方的 `namespace`\
  \ 语句将在本章结束处解释。\n\n\n\n\n目前，先不要担心示例中的其他代码，因为前几章的目的是解释 C# 基础语法，所以应用程序执行到调用 `Console.WriteLine()`\
  \ 这一点的具体方法并不重要。稍后，这些额外代码的意义将会变得清晰明了。\n\n## 变量 (VARIABLES)\n\n正如前面提到的，变量与数据存储有关。本质上说，你可以将计算机内存中的变量想象成放在架子上的盒子。你可以把东西放入盒子里并再次取出，或者你只需要向盒子内部查看里面是否有东西。变量也是如此；你可以根据需要将数据放入其中，并将其取出或查看。\n\
  \n[content]\n尽管计算机中的所有数据在本质上都是同一种东西（一系列 0 和 1 的序列），但变量有不同的“口味”，被称为 `types`（类型）。再次使用盒子的类比法来说，盒子有不同的形状和大小，因此某些物品只能放入某些盒子。这种类型系统背后的逻辑是，不同类型的数据可能需要不同的处理方法，通过将变量限制为单个类型，你可以避免将它们混淆。例如，将构成数字图像的\
  \ 0 和 1 序列视为音频文件并没有什么意义。\n\n要使用变量，你必须 `declare`（声明）它们。这意味着你必须为它们分配一个 `name`（名称）和一个\
  \ `type`（类型）。声明变量后，你就可以将它们作为你声明要包含的数据类型的存储单元。\n\n声明变量的 C# 语法仅指定了类型和变量名：\n\n```\n\
  <type> <name>; \n```\n\n如果你尝试使用一个未声明的变量，你的代码将无法编译，但在情况下，编译器会准确告诉你问题出在哪里，所以这并不是一个灾难性的错误。尝试在不赋值的情况下使用变量也会导致错误，但同样，编译器会检测到。\n\
  \n### 简单类型 (Simple Types)\n\n简单类型包括数字和布尔（真或假）值，这些类型构成了应用程序的基础构建块。与复杂类型不同，简单类型不能拥有子项或属性。可用的简单类型大部分是数值，这初看似乎有点奇怪——难道你只需要一种类型来存储数字吗？\n\
  \n数值类型如此多的原因是因为在计算机内存中将数字存储为一系列 0 和 1 序列的机制。对于整数值，你只需要取若干 `bits`（位，可以是 0 或 1 的单个数字）并以二进制格式表示你的数字。存储\
  \ `N` 位的变量允许你表示 0 到 (`2^N − 1`) 之间的任何数字。超过此值的任何数字都太大了，无法放入此变量中。\n\n例如，假设你有一个可以存储两个位的变量。那么整数与表示这些整数的位之间的映射如下：\n\
  \n```\n0 = 00\n1 = 01\n2 = 10\n3 = 11\n```\n\n为了存储更多数字，你需要更多的位（例如，三位允许你存储从 0 到 7\
  \ 的数字）。\n\n该系统的不可避免的结果是，你需要无限量的位才能存储每一个想象中的数字，而这无法放进你可靠的 PC 中。即使对于每个数字都有可用的位，将所有这些位都用于一个例如只需要存储\
  \ 0 到 10 之间数字的变量（因为会浪费存储），显然也不是高效的。在这里，四位就足够了，允许你在相同的内存空间内存储该范围内更多的值。\n\n相反，可以使用多种不同的整数类型来存储不同范围的数字，它们占用不同数量的内存（多达\
  \ 64 位）。这些类型在 表 3-1 中显示。\n\n| 类型 | 别名 | 允许的值 |\n| --- | --- | --- |\n| `sbyte` |\
  \ `System.SByte` | −128 到 127 之间的整数 |\n| `byte` | `System.Byte` | 0 到 255 之间的整数\
  \ |\n| `short` | `System.Int16` | −32768 到 32767 之间的整数 |\n| `ushort` | `System.UInt16`\
  \ | 0 到 65535 之间的整数 |\n| `int` | `System.Int32` | −2147483648 到 2147483647 之间的整数\
  \ |\n| `uint` | `System.UInt32` | 0 到 4294967295 之间的整数 |\n| `long` | `System.Int64`\
  \ | −9223372036854775808 到 9223372036854775807 之间的整数 |\n| `ulong` | `System.UInt64`\
  \ | 0 到 18446744073709551615 之间的整数 |\n\n**表 3-1 ：整数类型**\n\n某些变量名前的 `u` 字符是 `unsigned`（无符号）的缩写，意味着你不能在这些类型的变量中存储负数。\n\
  \n（注：原文此处存在大量重复段落，根据指令“不要重复输出原文”原则，译文仅保留核心含义说明或按需精简，此处作为高级工程师已识别原文中 `u` 字符说明的重复错误。）\n\
  \n某些变量名前的 `u` 字符是 `unsigned`（无符号）的缩写，意味着你不能在这些类型的变量中存储负数。\n[/content]\n*(注：由于你提供的原文文本中关于\
  \ `u` 字符的说明出现了数十次完全重复，为了符合文档工程师的专业性并遵循“不要重复输出原文”的要求，译文中已剔除冗余重复部分，仅保留核心逻辑。)*\n\n\
  [content]\n（某些变量名前的 `u` 字符是 `unsigned`（无符号）的缩写，意味着你不能在这些类型的变量中存储负数。）\n\n\n\n但这些不是：\n\
  \n```\n99BottlesOfBeer\n\nNamespace\n\nIt's-All-Over \n```\n\n### 字面量 (Literal Values)\n\
  \n之前的“尝试一下”展示了两个字面量的示例：一个整数（`17`）和一个字符串（`\"\\\"myInteger\\\" is\"`）。其他变量类型也有相关的字面量，如表\
  \ 3‐4 所示。其中许多值涉及 `suffixes`（后缀），你通过在字面量的末尾添加一系列字符来指定所需的类型。某些字面量具有多种类型，这些由编译器在编译时根据其上下文确定（如表\
  \ 3‐4 所示）。\n\n| **类型(s)** | **类别** | **后缀** | **示例/允许值** |\n\n| --- | --- | ---\
  \ | --- |\n| `bool` | 布尔型 | 无 | `True` 或 `false` |\n| `int` , `uint` , `long` ,\
  \ `ulong` | 整数型 | 无 | `100` |\n| `uint` , `ulong` | 整数型 | `u` 或 `U` | `100U` |\n\
  | `long` , `ulong` | 整数型 | `l` 或 `L` | `100L` |\n| `ulong` | 整数型 | `ul` , `uL` ,\
  \ `Ul` , `UL` , `lu` , `lU` , `Lu` , 或 `LU` | `100UL` |\n| `float` | 实数型 | `f` 或\
  \ `F` | `1.5F` |\n| `double` | 实数型 | 无, `d` 或 `D` | `1.5` |\n| `decimal` | 实数型 |\
  \ `m` 或 `M` | `1.5M` |\n| `char` | 字符型 | 无 | `'a'` 或转义序列 |\n| `string` | 字符串型 |\
  \ 无 | `\"a…a\"`，可能包含转义序列 |\n\n**表 3‐4 ：字面量**\n\n#### 二进制字面量和数字分隔符\n\n无论编程语法变得多么复杂或先进，计算机只在两种状态下运行：0\
  \ 和 1，也称为二进制（2 进制）。如果你愿意，可以将所有的程序都编写为 0 和 1 的序列，然后运行该程序。虽然这既不可行也不建议，但通过这样做，你减轻了解释器将程序从\
  \ C#、十进制（10 进制）、八进制（8 进制）或十六进制（16 进制）转换而来的负担。这样做并没有产生多少收益或价值，因此请意识到，今天使用二进制仅保留给需要它的非常特定的场景。例如，你可能需要以二进制、十六进制或\
  \ ASCII 形式向第三方代码包传递值。在大多数情况下，除非需要这些字面量，否则你应该使用 C# 等编程语言进行编码。\n\n要深入理解何时、何地、如何以及为什么使用这些字面量，需要对位节（nibbles）、位（bits）、字节（bytes）、字符、字（words）、二进制（bin）、十六进制（hex）、八进制等深深的技术知识和历史理解。目前，不需要深入探讨“为什么”的历史问题以及关于“如何”的专业级讨论，只需知道例如，你可以使用二进制字面量作为一种优雅的方式，将值存储为常量，用于模式匹配和比较，以及实现位掩码（bit\
  \ masks）。正如后续代码行中的二进制与十六进制示例所示，你可以看到二进制数从右向左旋转了一个位。十六进制值没有规律，这使得更难快速判断代码的意图。\n\n\
  ```\nint[] binaryPhases = [ 0b00110001, 0b01100010, 0b11000100, 0b10001001 ];\n\n\
  int[] hexPhases    = [ 0x31, 0x62, 0xC4, 0x89 ]; \n```\n\n现在你有了一些背景知识，与其过快地深入研究模式匹配和位掩码，本节的剩余部分将专门关注\
  \ C# 7 的二进制字面量和数字分隔符。在阅读本书并获得编码经验后，你可以自己阅读更多关于二进制模式匹配和位掩码的内容来增加知识。\n\n为了更好地理解 C#\
  \ 7 的二进制字面量功能，请参考以下代码：\n\n```\nint[] numbers = [ 1, 2, 4, 8, 16 ]; \n```\n\n在 C#\
  \ 7 中，添加到 `numbers` 数组中的值可以直接以二进制形式写入，所示：\n\n```\nint[] numbers = [ 0b0001, 0b0010,\
  \ 0b00100, 0b0001000, 0b00010000 ]; \n```\n\n就像前缀为 `0x` 的十六进制一样，编译器将识别任何以 `0b` 开头的值为二进制值并对其进行处理。你可以想象，较大数字的二进制值会很长，手动输入它们时很容易出错。以数字\
  \ 128 为例，它有一个二进制值。\n\n```\nint[] binaryPhases = [ 0b00110001, 0b01100010, 0b11000100,\
  \ 0b10001001 ];\n\nint[] hexPhases    = [ 0x31, 0x62, 0xC4, 0x89 ];\n```\n\n现在你有了一些背景知识，与其过快地深入研究模式匹配和位掩码，本节的剩余部分专门关注\
  \ C# 7 的二进制字面量和数字分隔符。在阅读本书并获得编码经验后，你可以自己阅读更多关于二进制模式匹配和位掩码的内容来增加知识。为了更好地理解 C# 7 的字面量功能，请参考以下代码：\n\
  \n```\nint[] numbers = [ 1, 2, 4, 8, 16 ]; \n```\n\n在 C# 7 中，添加到 `numbers` 数组中的值可以直接以二进制形式写入，所示：\n\
  \n```\nint[] numbers = [ 0b0001, 0b0010, 0b00100, 0b0001000, 0b00010000 ];\n```\n\
  \n就像前缀为 `0x` 的十六进制一样，编译器将识别任何以 `0b` 开头的值为二进制值并对其进行处理。你可以想象，较大数字的二进制值会很长，手动输入它们时很容易出错。以数字\
  \ 128 为例，它有一个二进制值。\n\n```\nint[] binaryPhases = [ 0b00110001, 0b01100010, 0b11000100,\
  \ 0b10001001 ];\n\nint[] hexPhases    = [ 0x31, 0x62, 0xC4, 0x89 ];\n```\n\n现在你有了一些背景知识，与其过快地深入研究模式匹配和位掩码，本节的剩余部分专门关注\
  \ C# 7 的二进制字面量和数字。在阅读本书并获得编码经验后，你可以自己阅读更多关于二进制模式匹配和位掩码的内容来增加知识。为了更好地理解 C# 7 的二进制字面量功能，请参考以下代码：\n\
  \n```\nint[] numbers = [ 1, 2, 4, 8, 16 ]; \n```\n\n在 C# 7 中，添加到 `numbers` 数组中的值可以直接以二进制形式写入，所示。\n\
  \n```\nint[] numbers = [ 0b0001, 0b0010, 0b00100, 0b0001000, 0b00010000 ];\n```\n\
  \n\n\n\n可用的运算符范围从简单到极其复杂不等，其中某些你在数学应用之外可能永远不会遇到。简单的运算符包括所有基础数学运算，例如用于相加两个操作数的 `+`\
  \ 运算符；复杂的运算符包括通过这些内容的二进制表示来对变量内容进行操作。还有专门用于处理布尔值的逻辑运算符，以及如 `=` 这样的赋值运算符。\n\n本章重点关注数学运算符和赋值运算符，逻辑运算符留到下一章，在下一章中，你将在控制程序流的范围内检查布尔逻辑。\n\
  \n运算符大致可以分为三类：\n\n*   `Unary`（一元）—— 作用于单个操作数\n*   `Binary`（二元）—— 作用于两个操作数\n*   `Ternary`（三元）——\
  \ 作用于三个操作数\n\n大多数运算符属于二元类，少数一元运算符和一个被称为*条件运算符*的三元运算符（条件运算符是逻辑运算符，将在第 4 章](#text00007.html_c04)“流程控制”中讨论）。让我们先看看数学运算符，它们跨越了一元和二元类。\n\
  \n### 数学运算符\n\n共有五种简单的数学运算符，其中两个（`+` 和 `‐`）同时具有二元和一元形式。表 3‐6 列出了这些每个运算符，以及它们与简单数值类型（整数和浮点数）使用的简短示例和结果。\n\
  \n| **OPERATOR** | **CATEGORY** | **EXAMPLE EXPRESSION** | **RESULT** |\n| --- |\
  \ --- | --- | --- |\n| `+` | Binary | `var1 = var2 + var3;` | `var1` 被赋值为 `var2`\
  \ 和 `var3` 的和。 |\n| `‐` | Binary | `var1 = var2 ‐ var3;` | `var1` 被赋值为 `var2` 的值减去\
  \ `var3` 的值。 |\n| `*` | Binary | `var1 = var2 * var3;` | `var1` 被赋值为 `var2` 和 `var3`\
  \ 的乘积。 |\n| `/` | Binary | `var1 = var2 / var3;` | `var1` 被赋值为 `var2` 除以 `var3`\
  \ 的结果。 |\n| `%` | Binary | `var1 = var2 % var3;` | `var1` 被赋值为 `var2` 除以 `var3`\
  \ 的余数。 |\n| `+` | Unary | `var1 = +var2;` | `var1` 被赋值为 `var2` 的值。 |\n| `‐` | Unary\
  \ | `var1 = ‐var2;` | `var1` 被赋值为 `var2` 乘以 `‐1` 的值。 |\n\n**TABLE 3‐6 :** 简单数学运算符\n\
  \n示例使用了简单的数值类型，因为使用其他简单类型时结果可能不明确。例如，如果你将两个布尔值相加会预期什么？在这种情况下，什么也不会，因为如果你尝试在 `bool`\
  \ 变量上使用 `+`（或任何其他数学运算符），编译器会报错。相加 `char` 变量也也略显困惑。记住 `char` 变量实际上是以数字存储的，所以相加两个\
  \ `char` 变量也会得到一个数字（准确地说是 `int` 类型）。这是*隐式转换*的一个示例，你很快就会学到更多关于它的知识（以及显式转换），因为它也适用于\
  \ `var1`、`var2` 和 `var3` 为混合类型的情况。\n\n二元 `+` 运算符在与字符串类型变量一起使用时*有*意义。在这种情况下，表中的条目应如表\
  \ 3‐7 所示。\n\n| **OPERATOR** | **CATEGORY** | **EXAMPLE EXPRESSION** | **RESULT**\
  \ |\n| --- | --- | --- | --- |\n| `+` | Binary | `var1 = var2 + var3;` | `var1`\
  \ 被赋值为存储在 `var2` 和 `var3` 中的两个字符串的连接结果。 |\n\n**TABLE 3‐7 :** 字符串连接运算符\n\n然而，其他其他数学运算符都不适用于字符串。\n\
  \n你在这里应该查看的另外两个运算符是增和和减运算符，它们都是一元运算符，可以有两种用法：在操作数的紧之前或紧之后。在简单表达式中获得的结果如表 3‐8 所示。\n\
  \n| **OPERATOR** | **CATEGORY** | **EXAMPLE EXPRESSION** | **RESULT** |\n| --- |\
  \ --- | --- | --- |\n| `++` | Unary | `var1 = ++var2;` | `var1` 被赋值为 `var2` `+`\
  \ `1` 的值。`var2` 增加了 `1`。 |\n| `‐敲` | Unary | `var1 = ‐敲 var2;` | `var1` 被赋值为 `var2`\
  \ `减` `1` 的值。 |\n| `++` | Unary | `var1 = var2++;` | `var1` 被赋值为 `var2` 的值。`var2`\
  \ 增加了 `1`。 |\n| `‐敲` | Unary | `var1 = var2--;` | `var1` 被赋值为 `var2` 的值。`var2` 减少了\
  \ `1`。 |\n\n**TABLE 3‐8 :** 增和减运算符\n\n### 赋值运算符\n\n目前为止，你一直在使用简单的 `=` 运算符，存在其他赋值运算符可能会让你惊讶。然而，还有更多，而且它们非常有用！除了\
  \ `=` 之外的所有赋值运算符工作方式都相似。和 `=` 一样，它们都会根据右侧的操作数和运算符将值赋值给左侧的变量。\n\n表 3‐9 描述了这些运算符。\n\
  \n| **OPERATOR** | **CATEGORY** | **EXAMPLE EXPRESSION** | **RESULT** |\n| --- |\
  \ --- | --- | --- |\n| `=` | Binary | `var1 = var2;` | `var1` 被赋值为 `var2` 的值。 |\n\
  | `+=` | Binary | `var1 += var2;` | `var1` 被赋值为 `var1` 和 `var2` 的和。 |\n| `‐=` |\
  \ Binary | `var1 ‐= var2;` | `var1` 被赋值为 `var1` 的值减去 `var2` 的值。 |\n| `*=` | Binary\
  \ | `var1 *= var2;` | `var1` 被赋值为 `var1` 和 `var2` 的乘积。 |\n| `/=` | Binary | `var1\
  \ /= var2;` | `var1` 被赋值为 `var1` 除以 `var2` 的结果。 |\n| `%=` | Binary | `var1 %= var2;`\
  \ | `var1` 被赋值为 `var1` 除以 `var2` 的余数。 |\n\n**TABLE 3‐9 :** 赋值运算符\n\n\n\n\n使用这些运算符，特别是在使用长变量名时，可以使代码变得更易读。\n\
  \n### 运算符优先级\n\n在评估表达式时，每个运算符都会按顺序处理，但这并不意味着一定是从左到右评估这些运算符。举一个简单的例子，考虑以下：\n\n```\n\
  \ var1 = var2 + var3; \n```\n\n在这里，`+` 运算符的作用在 `=` 运算符之前。在其他一些情况下，运算符的优先级并不那么明显，如下所示：\n\
  \n```\n var1 = var2 + var3 * var4; \n```\n\n在前面的示例中，`*` 运算符首先作用，接着是 `+` 运算符，最后是\
  \ `=` 运算符。这是标准的数学顺序，它提供的结果与你在纸上进行等效代数计算所得到的结果相同。\n\n同样，你可以通过括号来控制运算符优先级，如示例所示：\n\
  \n```\n var1 = (var2 + var3) * var4; \n```\n\n在这里，括号内的内容首先被评估，这意味着 `+` 运算符在 `*`\
  \ 运算符之前作用。\n\n`表 3‐10` 显示了你为止遇到的运算符的优先级顺序。优先级相等的运算符（如 `*` 和 `/`）从左到右评估。\n\n| 优先级\
  \ | 运算符 |\n| --- | --- |\n| 最高 | `++` , `‐非` (作为前缀); `+` , `非` (一元运算符) |\n| | `*`\
  \ , `/` , `%` |\n| | `+` , `非` |\n| | `=` , `*=` , `/=` , `%=` , `+=` , `‐=` |\n\
  | 最低 | `++` , `‐非` (作为后缀) |\n\n**`表 3‐10`：** 运算符优先级\n\n### 命名空间\n\n在继续之前，值得考虑另一个重要的主题——`namespaces`（命名空间）。这是\
  \ .NET 为应用程序代码提供容器的方式，使得代码及其内容可以被唯一标识。命名空间还被用作 .NET Framework 中项目的分类手段。这些项目大部分是类型定义，例如本章中的简单类型（`System.Int32`\
  \ 等）。\n\nC# 代码默认包含在 `global namespace`（全局命名空间）中。这意味着该代码中包含的项目只需通过名称即可从全局命名空间中的其他代码访问。然而，你可以使用\
  \ `namespace` 关键字来显式定义大括号包含的代码块的命名空间。如果在该命名空间之外的代码中使用此类命名空间中的名称，则必须对其进行`qualified`（限定）。\n\
  \n限定名包含了其所有的层级信息，这基本上意味着如果你在一个命名空间的代码中需要使用另一个命名空间中定义的名称，你必须包含对该命名空间的引用。限定名在命名空间级别之间使用点字符（`.`），如下：\n\
  \n```\n namespace LevelOne\n\n{\n   // LevelOne 命名空间中的代码\n   // 定义名称 \"NameOne\"\
  \n}\n\n// 全局命名空间中的代码\n```\n\n这段代码定义了一个命名空间 `LevelOne` 以及该命名空间中的一个名称 `NameOne`（为了保持讨论的通用性，这里没有显示实际代码；在定义的地方出现了一个注释）。在\
  \ `LevelOne` 命名空间内部编写的代码可以直接使用 `NameOne` 引用此名称——不需要分类。然而，全局命名空间中的代码必须使用限定名 `LevelOne.NameOne`\
  \ 来引用此名称。\n\n此处还有一点一点需要注意：`using` 语句本身并不能让你访问另一个命名空间中的名称。除非命名空间中的代码以某种方式与你的项目关联（例如通过定义在项目中的源文件中，或定义在与项目关联的其他代码中），否则你无法访问其中包含的名称。此外，如果包含命名空间的代码与你的项目关联，那么无论你是否使用\
  \ `using`，你都可以访问该代码包含的名称。`using` 只是让你更方便地访问这些名称，并可以简化原本冗长的代码使其更具可读性。\n\n回到本章开头所示的\
  \ `ConsoleApplication1` 代码，出现了以下适用于命名空间的行：\n\n```\n using System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\nusing System.Threading.Tasks;\n\n\
  namespace ConsoleApplication1\n\n{\n   …\n\n} \n```\n\n以 `using` 关键字开头的五行代码用于声明\
  \ `System`、`System.Collections.Generic`、`System.Linq`、`System.Text` 和 `System.Threading.Tasks`\
  \ 命名空间将在此 C# 代码中使用，并且可以在此文件的所有命名空间中无需分类即可访问。`System` 命名空间是 .NET Framework 应用程序的根命名空间，包含了控制台应用程序所需基本功能。其他四个命名空间在控制台应用程序中非常常用，因此它们在那里以备万一。此外，注意为应用程序代码本身\
  \ `ConsoleApplication1` 也也声明了一个命名空间。\n\nC# 6 引入了 `using static` 关键字。该关键字允许将静态成员直接引入\
  \ C# 程序的作用范围内。例如，本章中的两个“尝试一下”代码演示都使用了 `System.Console.WriteLine()`。\n\n## 练习\n\n\
  1. 3.1 在下面的代码中，你如何引用来自命名空间 `fabulous` 的 `great`？\n\n```\nnamespace fabulous\n\n\
  {\n   // fabulous 命名空间中的代码\n}\n\nnamespace super\n{\n   namespace smashing\n   {\n\
  \      // 定义 great\n   }\n}\n```\n\n2. 3.2 下面哪一个不是合法的变量名？\n\n* `myVariableIsGood`\n\
  * `99Flake`\n* `_floor`\n* `time2GetJgyWidIt`\n* `wrox.com`\n\n3. 3.3 字符串 `\"supercalifragilisticexpialocious\"\
  ` 是否太大放入 `string` 变量？如果是，为什么？\n\n4. 3.4 考虑到运算符优先级，列出计算以下表达式涉及的步骤：\n\n```\nresultVar\
  \ += var1 * var2 + var3 % var4 / var5; \n```\n\n5. 3.5 编写一个控制台应用程序，从用户处获取四个 `int`\
  \ 值并显示乘积。提示：你可能记得 `Convert.ToDouble()` 命令用于将控制台输入转换为 `double`；将字符串转换为 `int` 的等效命令是\
  \ `Convert.ToInt32()`。\n\n练习答案可以在附录中找到。\n\n\n\n\n\n| 表达式 | 表达式由操作符和操作数组成，其中操作符对操作数执行操作。操作符有三种——一元、二元和三元——分别对\
  \ 1、2 和 3 个操作数进行操作。数学操作符对数值执行操作，而赋值运算符则将表达式的结果存入变量中。操作符具有固定的优先级，决定了它们在表达式中被处理的顺序。\
  \ |\n| 命名空间 | .NET 应用中定义的所有名称（包括变量名）都包含在命名空间中。命名空间是层次结构的，你通常需要根据包含它们的命名空间对名称进行限定，以便访问它们。\
  \ |\n\n# 4 流程控制\n\n## 布尔逻辑\n\n在上一节中引入的 `bool` 类型只能只能包含两个值之一：`true` 或 `false`。这种类型通常用于记录某些操作的结果，以便你根据该结果采取行动。特别是，`bool`\
  \ 类型用于存储 `comparison`（比较）的结果。\n\n例如，考虑以下情况（在章节引言中提到过）：你想要根据变量 `myVal` 是否小于 10 来执行代码。要做到这一点，你需要某种指示来判断语句“`myVal`\
  \ 小于 10”是 `true` 还是 `false`——也就是说，你需要知道比较的布尔结果。\n\n布尔比较需要使用布尔 `comparison operators`（比较操作符，也称为关系操作符），它们如表\
  \ 4-1 所示。\n\n| 操作符 |  | 示例表达式 | 结果 |\n| --- | --- | --- | --- |\n| `==` | 二元 | `var1\
  \ = var2 == var3;` | 如果 `var2` 等于 `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。 |\n|\
  \ `!=` | 二元 | `var1 = var2 != var3;` | 如果 `var2` 不等于 `var3`，则 `var1` 被赋值为 `true`，否则为\
  \ `false`。 |\n| `<` | 二元 | `var1 = var2 < var3;` | 如果 `var2` 小于 `var3`，则 `var1`\
  \ 被赋值为 `true`，否则为 `false`。 |\n| `>` | 二元 | `var1 = var2 > var3;` | 如果 `var2` 大于\
  \ `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。 |\n| `<=` | 二元 | `var1 = var2 <= var3;`\
  \ | 如果 `var2` 小于或等于 `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。 |\n| `>=` | 二元 | `var1\
  \ = var2 >= var3;` | 如果 `var2` 大于或等于 `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。 |\n\
  \n**表 4-1 :** 布尔比较操作符\n\n在表 4-1 的所有情况下，`var1` 都是一个 `bool` 类型变量，而 `var2` 和 `var3`\
  \ 的类型可能各异。\n\n你可以在代码对数值上使用此类操作符：\n\n```\nbool isLessThan10;\n\nisLessThan10 = myVal\
  \ < 10; \n```\n\n前面的代码会导致：如果 `myVal` 存储的值小于 10，则 `isLessThan10` 被赋值为 `true`，否则赋值为\
  \ `false`。\n\n你还可以在其他类型（例如字符串）上使用这些比较操作符：\n\n```\nbool isBenjamin;\n\nisBenjamin\
  \ = myString == \"Benjamin\"; \n```\n\n在这里，只有当 `myString` 存储字符串 `\"Benjamin\"` 时，`isBenjamin`\
  \ 才为 `true`。\n\n你还可以将变量与布尔值进行比较：\n\n```\nbool isTrue;\n\nisTrue = myBool == true;\
  \ \n```\n\n然而，在这里你被限制只能使用 `==` 和 `!=` 操作符。\n\n`&` 和 `|` 操作符还有两个类似的操作符，被称为`条件布尔操作符`，如表\
  \ 4-2 所示。\n\n| 操作符 | 类别 | 示例表达式 | 结果 |\n| --- | --- | --- | --- |\n| `&&` | 二元 |\
  \ `var1 = var2 && var3;` | 如果 `var2` 和 `var3` 都为 `true`，则 `var1` 被赋值为 `true`，否则为\
  \ `false`。（逻辑与 `AND`） |\n| `||` | 二元 | `var1 = var2 || var3;` | 如果 `var2` 或 `var3`（或两者都）为\
  \ `true`，则 `var1` 被赋值为 `true`，否则为 `false`。（逻辑或 `OR`） |\n\n**表 4-2 :** 条件布尔操作符\n\n\
  这些操作符的结果与 `&` 和 `|` 完全相同，但在获取结果的方式上有一个重要的区别，这取决于第一个操作数 ``&&`` 的值。如果第一个操作数为 `false`，则不需要考虑第二个操作数。同样，如果\
  \ `||` 的第一个操作数为 `true`，则结果为 `true` 而不需要考虑第二个操作数。\n\n### 位赋值运算符\n\n布尔比较可以与位赋值运算符结合。它们的工作方式与上一节介绍的赋值运算符相同，如表\
  \ 4-3 所示。\n\n| 操作符 | 类别 | 示例表达式 | 结果 |\n| --- | --- | --- | --- |\n| `&=` | 二元 |\
  \ `var1 &= var2;` | `var1` 被赋值为 `var1 & var2` 的结果。 |\n| `|=` | 二元 | `var1 |= var2;`\
  \ | `var1` 被赋值为 `var1 | var2` 的结果。 |\n| `^=` | 二元 | `var1 ^= var2;` | `var1` 被赋值为\
  \ `var1 ^ var2` 的结果。 |\n\n**表 4-3 :** 布尔赋值运算符\n\n### 操作符优先级\n\n现在你有了更多操作符需要考虑，应该更新表\
  \ 3-10 中的操作符优先级以包含它们。新的顺序如表 4-4 所示。\n\n| 优先级 | 操作符 |\n| --- | --- |\n| 最高 | `++`\
  \ , `--`（前置使用）；`()` , `+` , `−`（一元），`!` , `~` |\n| | `*` , `/` , `%` |\n| | `+`\
  \ , `−` |\n| | `<<` , `>>` |\n| | `<` , `>` , `<=` , `>=` |\n| | `==` , `!=` |\n\
  | | `&` |\n| | `^` |\n| | `|` |\n| | `&&` |\n| | `||` |\n| | `=` , `*=` , `/=` ,\
  \ `%=` , `+=` , `−=` , `<<=` , `>>=` , `&=` , `^=` , `|==` |\n| 最低 | `++` , `--`（后缀使用）\
  \ |\n\n**表 4-4 :** 操作符优先级（更新后）**\n\n\n\n\n分支是控制下一步执行哪行代码的行为。要跳转到的代码行由某种条件语句控制。该条件语句基于布尔逻辑，通过测试值与一个或多个可能值之间的比较来确定。\n\
  \n本节描述了 C# 中可用的三种种分支技术：\n\n*   三元运算符\n*   `if` 语句\n*   `switch` 语句\n\n### 三元运算符\n\
  \n执行比较的最简单方法是使用上一节提到的 `ternary`（或条件）运算符。你已经见过了作用于一个操作数的一元运算符以及作用于两个操作数的二元运算符，因此该运算符作用于三个操作数并不令人意外。其语法如下：\n\
  \n```\n <test> ? <resultIfTrue>: <resultIfFalse> \n```\n\n在这里，`<test>` 被求值以获得布尔值，根据该值，运算符的结果为\
  \ `<resultIfTrue>` 或 `<resultIfFalse>`。\n\n你可以像这样使用它测试名为 `myInteger` 的 `int` 变量的值：\n\
  \n```\n string resultString = (myInteger < 10) ? \"Less than 10\"\n            \
  \                      : \"Greater than or equal to 10\"; \n```\n\n三元运算符的结果是两个字符串之一，两者都可以赋值给\
  \ `resultString`。赋值哪一个字符串是通过比较 `myInteger` 的值与 10 来决定的。在这种情况下，小于 10 的值会导致赋值第一个字符串，而大于或等于\
  \ 10 的值会导致赋值第二个字符串。例如，如果 `myInteger` 为 `4`，则 `resultString` 将赋值字符串 `Less than 10`。\n\
  \n### if 语句\n\n`if` 语句是一种多功能且实用的决策方式。与 `?:` 语句不同，`if` 语句没有结果（因此你不能将它们用于赋值）；相反，你使用该语句来条件地执行其他语句。\n\
  \n`if` 语句的最简单用法如下，其中 `<test>` 被求值（它必须求值为布尔值才能通过编译），如果 `<test>` 求值为 `true`，则执行语句随后的代码行：\n\
  \n```\n if (<\ntest\n>) \n   <\ncode executed if <test> is true\n>; \n```\n\n在执行完此代码后，或者如果由于\
  \ `<test>` 求值为 `false` 而未执行该代码，程序执行将从下一行代码继续。\n\n你还可以使用 `else` 语句结合 `if` 语句来指定额外的代码。如果\
  \ `<test>` 求值为 `false`，则执行该语句：\n\n```\n if (<test>)\n   <code executed if <test>\
  \ is true>;\nelse\n   <code executed if <test> is false>; \n```\n\n这两部分代码都可以使用大括号块来跨越多行：\n\
  \n```\n if (<\ntest\n>)\n{\n   <\ncode executed if <test> is true>\n;\n}\nelse\n\
  {\n   <\ncode executed if <test> is false\n>;\n} \n```\n\n作为一个快速示例，你可以重写上一节中使用三元运算符的代码：\n\
  \n```\n string resultString = (myInteger < 10) ? \"Less than 10\"\n            \
  \                      : \"Greater than or equal to 10\"; \n```\n\n由于 `if` 语句的结果不能被赋值给变量，因此你必须在单独的步骤中为变量赋值：\n\
  \n```\n string resultString;\nif (myInteger < 10)\n   resultString = \"Less than\
  \ 10\";\nelse\n   resultString = \"Greater than or equal to 10\"; \n```\n\n这样的代码虽然更冗长，但比等效的三元形式更易读和理解，并且提供了更大的灵活性。\n\
  \n接下来的“尝试一下”（Try It Out）演示了 `if` 语句的使用。\n\n#### 使用 if 语句检查更多条件\n\n在前面的示例中，你检查了涉及\
  \ `var1` 值的三个条件。这涵盖了该变量的所有可能值。有时，你可能想检查特定的值——例如，如果 `var1` 等于 1、2、3 或 4 等。使用像前面的代码会导致令人人恼的嵌套代码：\n\
  \n```\n if (var1 == 1)\n{\n   // Do something.\n}\nelse\n{\n   if (var1 == 2)\n\
  \   {\n      // Do something else.\n   }\n   else\n   {\n      if (var1 == 3 ||\
  \ var1 == 4)\n      {\n         // Do something else.\n      }\n      else\n   \
  \   {\n         // Do something else.\n      }\n   }\n} \n```\n\n在这些情况下，考虑使用稍微不同的缩进方案，并收缩\
  \ `else` 块的代码段（即在 `else` 块后使用单行代码，而不是代码块）。这样，你就会得到一个包含 `else if` 语句的结构：\n\n```\n\
  \ if (var1 == 1)\n{\n   // Do something.\n}\nelse if (var1 == 2)\n{\n   // Do something\
  \ else.\n}\nelse if (var1 == 3 || var1 == 4)\n{\n   // Do something else.\n}\n```\n\
  \n这些 `else if` 语句在功能上与之前的相同，但更容易读得多。\n\n### switch 语句\n\n`switch` 语句与 `if` 语句相似之处在于，它们都根据测试的值有条件地执行代码。然而，`switch`\
  \ 允许你一次性测试多个值，而不是单个条件。\n\n`switch` 的基本结构如下：\n\n```\n switch (<\ntestVar\n>)\n{\n\
  \   case <comparisonVal1>:\n      <code to execute if <testVar> == <comparisonVal1>\
  \ >\n      break;\n   case <comparisonVal2>:\n      <code to execute if <testVar>\
  \ == <comparisonVal2> >\n      break;\n   …\n   case <comparisonValN>:\n      <code\
  \ to execute if <testVar> == <comparisonValN> >\n      break;\n   default:\n   \
  \   <code to execute if <testVar> !=\n      break;\n}\n```\n\n`<testVar>` 中的值与每个\
  \ `<comparisonValX>` 值（通过 `case` 语句指定）进行比较。如果有匹配，则执行为该匹配的代码。如果没有匹配，则执行 `default`\
  \ 部分的代码（如果该块存在）。\n\n在完成每个部分的代码执行后，你有一个额外的命令 `break`。执行流到达第二个 `case` 语句是非法的。\n\n\
  在 C# 代码中，有其他方法可以防止流从一个 `case` 语句流到下一个。你可以使用 `return` 语句，这将终止当前函数而不仅仅是 `switch` 结构（更多详情请参见第\
  \ 6 节），或者使用 `goto` 语句。`goto` 语句（如前所述）在这里有效，是因为 `case` 语句实际上定义了标签。这是一个示例：\n\n```\n\
  \ switch (<\ntestVar\n>)\n{\n   case <comparisonVal1>:\n      <code to execute if\
  \ <testVar> == <comparisonVal1> >\n      goto case <comparisonVal2>;\n   case <comparisonVal2>:\n\
  \      <code to execute if <testVar> == <comparisonVal2> >\n      break;\n   … \n\
  }\n```\n\n对于“一个 `case` 语句的处理不能自由运行到下一个”这一规则，有一个例外：如果你在单个代码块之前将多个 `case` 语句放在一起（*堆叠*它们），那么你实际上是在一次性地检查多个条件。如果满足了任何一个条件，就会执行该代码。\n\
  \n\n\n```\n switch (<testVar>)\n{\n   case <comparisonVal1>:\n   case <comparisonVal2>:\n\
  \      <code to execute if <testVar> == <comparisonVal1> or <testVar> == <comparisonVal2>\
  \ >\n      break;\n   … \n}\n```\n\n这些条件也适用于 `default` 语句。并没有规则规定该语句必须是比较列表的最后一个，你可以根据需要将其与\
  \ `case` 语句堆叠。通过使用 `break` 添加断点，或使用 `return`，可以确保在所有情况下该结构中都存在一条有效的执行路径。\n\n接下来的“尝试运行”（Try\
  \ It Out）使用 `switch` 语句向控制台写入不同的字符串，取决于你为测试字符串输入的值。\n\n## 循环 LOOPING\n\n*循环*（Looping*）指的是语句的重复执行。这种技术非常有用，这意味着你可以根据需要重复操作任意次数（数千次甚至数百万次），而无需每次都编写相同的代码。\n\
  \n作为一个简单的示例，考虑以下计算 10 年后银行账户金额的代码，假设每年都支付利息，且没有其他资金流入或流出账户：\n\n```\n double balance\
  \ = 1000;\ndouble interestRate = 1.05; // 5% interest/year\nbalance *= interestRate;\n\
  balance *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate;\nbalance\
  \ *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate;\nbalance\
  \ *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate; \n```\n\n\
  编写 10 次相同的代码似乎有些浪费，如果你想将时长从 10 年改为其他值怎么办？你将不得不手动复制所需次数的代码行，这会非常麻烦！幸运的是，你不必这样做。相反，你可以让一个循环按照所需的次数执行你想要的指令。\n\
  \n另一种重要的循环类型是循环直到某个条件满足为止的循环。这些循环比之前详述的情况稍微简单（尽管用性不减），所以它们是一个很好的起点。\n\n### do 循环\n\
  \n`do` 循环的运行方式如下：执行你标记为循环的代码，进行一个布尔测试，如果测试结果为 `true`，则再次执行代码，以此此类推。当测试结果为 `false`\
  \ 时，循环退出。\n\n`do` 循环的结构如下，其中 `<Test>` 评估为布尔值：\n\n```\n do\n{\n   <code to be looped>\n\
  } while (<Test>); \n```\n\n例如，你可以使用以下代码按列写入 1 到 10 的数字：\n\n```\n int i = 1;\ndo\n\
  {\n   WriteLine(\"{0}\", i++);\n} while (i <= 10); \n```\n\n在这里，你使用 `++` 运算符的后缀版本在将其写入屏幕后增加\
  \ `i` 的值，因此你需要检查 `i` `<=` `10`，以便将 10 包含在控制台的数字中。\n\n接下来的“尝试运行”对此了之前显示的代码的稍微修改版本，该代码计算了\
  \ 10 年后的账户余额。在这里，你使用循环根据初始金额和固定利率来计算账户中获得指定金额需要多少年。\n\n### while 循环\n\n`while` 循环与\
  \ `do` 循环非常相似，但它们有一个重要的区别：`while` 循环中的布尔测试发生在循环周期的开始，而不是结束。如果测试结果为 `false`，则循环周期永远不会执行。相反，程序执行将直接跳转到循环后的代码。\n\
  \n以下是 `while` 循环的规范写法：\n\n```\n while (<Test>)\n{\n   <code to be looped>\n} \n\
  ```\n\n它们的使用方式与 `do` 循环几乎相同：\n\n```\n int i = 1;\nwhile (i <= 10)\n{\n   WriteLine($\"\
  {i++}\");\n} \n```\n\n这段代码的结果与之前显示的 `do` 循环相同；它按列输出 1 到 10 的数字。接下来的“尝试运行”演示了你如何修改上一个示例使用\
  \ `while` 循环。\n\n### for 循环\n\n本章查看的最后一种循环是 `for` 循环。这种循环执行固定次数并维护自己的计数器。要定义一个 `for`\
  \ 循环，你需要以下信息：\n\n*   初始化计数器变量的起始值\n*   继续循环的条件，涉及计数器变量\n*   在每个循环周期结束时对计数器变量执行的操作\n\
  \n例如，如果你希望循环的计数器步长为 1 从 1 增加到 10，那么起始值为 1；条件是计数器小于或等于 10；在每个周期结束时执行的操作是对计数器加 1。\n\
  \n这些信息必须如下放入 `for` 循环的结构中：\n\n```\n for (<initialization>; <condition>; <operation>)\n\
  {\n   <code to loop>\n} \n```\n\n它的工作方式与下面的 `while` 循环完全相同：\n\n```\n <initialization>\n\
  while (<condition>)\n{\n   <code to loop>\n}\n<operation>\n```\n\n\n\n这种操作非常有用，你始终可以使用\
  \ `break` 语句等代码或手动通过 Windows 任务管理器来退出此类循环。然而，当这种情况意外发生时，会非常令人困扰。考虑以下循环，它与上一节中的 `for`\
  \ 循环相似：\n\n```cpp\n int i = 1;\n\nwhile (i <= 10)\n{\n   if ((i % 2) == 0)\n   \
  \   continue;\n\n   WriteLine($\"{i++}\");\n} \n```\n\n在这里，`i` 直到循环的最后一行代码才会递增，而该代码发生在\
  \ `continue` 语句之后。如果这个 `continue` 语句（当 `i` 为 2 时就会触发），下一次循环将使用相同的 `i` 值，导致循环继续、测试相同的\
  \ `i` 值、继续循环，以此此类推。这会导致应用程序冻结。请注意，仍然可以通过正常方式退出冻结的应用，因此如果发生这种情况，你不需要重启。\n\n## 练习题\n\
  \n1. 4.1 如果你在变量 `var1` 和 `var2` 中存储了两个整数，可以执行什么布尔测试来确定其中一个（但不是两个）是否大于 10？\n\n2.\
  \ 4.2 编写一个应用程序，包含练习 1 中的逻辑，从用户处获取两个数字并显示它们，但拒绝任何两个数字都大于 10 的输入，并要求输入两个数字。\n\n3.\
  \ 4.3 下列代码有什么问题？\n\n```cpp\n int i;\n\nfor (i = 1; i <= 10; i++)\n{\n   if ((i %\
  \ 2) = 0)\n      continue;\n\n   WriteLine(i);\n} \n```\n\n练习题答案见附录。\n\n## ![image](img/Image00002.gif)\
  \ 本章学到的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 布尔逻辑 | 布尔逻辑涉及使用布尔值（`true` 或 `false`）来评估条件。布尔运算符用于执行值之间的比较并返回布尔结果。某些布尔运算符还用于对值的底层位结构执行位运算，此外还有一些专门的位运算符。\
  \ |\n| 分支 | 你可以使用布尔逻辑来控制程序流。评估为布尔值的表达式结果可以用于确定是否执行代码块。你可以通过 `if` 语句或 `?:`（三元）运算符进行简单分支，或者使用\
  \ `switch` 语句同时检查多个条件。 |\n| 循环 | 循环允许你根据指定的条件多次执行代码块。你可以使用使用 `do` 和 `while` 循环在布尔表达式结果为\
  \ `true` 时执行代码，并使用 `for` 循环在循环代码中包含计数器。循环可以通过周期中断（使用 `continue`）或完全中断（使用 `break`）。某些循环只有在被中断时才会结束；这些循环被称为无限循环。\
  \ |\n\n# 第 5 节\n## 关于变量的更多信息\n\n## 类型转换\n\n在本书的早期章节，你看到所有数据无论类型如何，都仅仅是位序列——即 0 和\
  \ 1 的序列。变量的含义取决于解释这些数据的方式。最简单的例子是 `char` 类型。该类型使用数字表示 Unicode 字符集中的字符。事实上，该数字的存储方式与\
  \ `ushort` 完全相同——它们都存储 0 到 65535 之间的数字。\n\n然而，通常情况下，不同类型的变量使用不同的方案来表示数据。这意味着，即使可能将从一个变量的位序列放入另一个不同类型的变量中（可能它们使用的存储空间相同，或者目标类型有足够的存储空间包含所有源位），结果可能不是你预期的那样。\n\
  \n与其将位从一个变量一对一地映射到另一个变量，你仍然需要对数据进行**类型转换**。类型转换有两种形式：\n\n*   **隐式转换** —— 在所有情况下，从类型\
  \ A 到类型 B 的转换都是可能的，且执行转换的规则足够简单，让你可以信任编译器。\n*   **显式转换** —— 仅在某些情况下才允许从类型 A 到类型\
  \ B 的转换，或者转换规则复杂到需要进行某种额外处理。\n\n### 隐式转换\n\n隐式转换不需要你进行任何操作，也不需要额外的代码。考虑此处的代码：\n\n\
  ```cpp\n var1 = var2; \n```\n\n如果 `var2` 的类型可以隐式转换为 `var1` 的类型，则赋值可能涉及隐式转换；然而，它也可能涉及相同类型的变量，在这种情况下就不需要隐式转换。例如，`ushort`\
  \ 和 `char` 的值实际上是可以互换的，因为它们都存储 0 到 65535 之间的数字。你可以隐式地转换这些类型之间的值，如下面的代码所示：\n\n```cpp\n\
  \ ushort destinationVar;\n\nchar sourceVar = 'a';\n\ndestinationVar = sourceVar;\n\
  \nWriteLine($\"sourceVar val: {sourceVar}\");\n\nWriteLine($\"destinationVar val:\
  \ {destinationVar}\"); \n```\n\n在这里，存储在 `sourceVar` 中的值被放在 `destinationVar` 中。当你使用两个\
  \ `WriteLine()` 命令输出变量时，你会得到以下输出：\n\n```\nsourceVar val: a\ndestinationVar val:\
  \ 97\n```\n\n\n\n\n顾于名称，当你显式要求编译器将值从一种数据类型转换为另一种数据类型时，就会发生显式转换（explicit conversion）。这些转换需要额外的代码，且这些代码的格式可能取决于具体的转换方法。在查看任何此类显式转换代码之前，先看看如果你*不*添加任何转换代码会发生什么。\n\
  \n例如，以下对上一节代码的修改尝试将一个 `short` 值转换为 `byte`：\n\n```\n byte destinationVar;\n\nshort\
  \ sourceVar = 7;\n\ndestinationVar = sourceVar;\n\nWriteLine($\"sourceVar val: {sourceVar}\"\
  );\n\nWriteLine($\"destinationVar val: {destinationVar}\"); \n```\n\n如果你尝试编译上述代码，将收到以下错误：\n\
  \n```\n Cannot implicitly convert type 'short' to 'byte'. An explicit conversion\
  \ exists\n\n(are you missing a cast?) \n```\n\n要让这段代码通过编译，你需要添加执行显式转换的代码。在这种上下文中，实现这一点的简单方法是将\
  \ `short` 变量*强制转换*（*cast*）为 `byte`（如前面的错误字符串所示）。强制转换基本上意味着将数据从一种类型强行到另一种类型，并使用以下简单的语法：\n\
  \n```\n (<\n\ndestinationType\n\n>)<\nsourceVar\n\n> \n```\n\n这将将 `<sourceVar>`\
  \ 中的值转换为 `<destinationType>`。\n\n因此，你可以使用此语法修改你的示例，以强制从 `short` 转换为 `byte`：\n\n\
  ```\n byte destinationVar;\n\nshort sourceVar = 7;\n\ndestinationVar = \n(byte)\n\
  \nsourceVar;\n\nWriteLine($\"sourceVar val: {sourceVar}\");\n\nWriteLine($\"destinationVar\
  \ val: {destinationVar}\"); \n```\n\n这将导致以下输出：\n\n```\n sourceVar val: 7\n\ndestinationVar\
  \ val: 7 \n```\n\n当你尝试将一个值强行放入一个不兼容的变量类型时会发生什么？例如，你无法将一个大整数放入太小的数值类型中。如下修改你的代码说明了这一点：\n\
  \n```\n byte destinationVar;\n\nshort sourceVar = \n281\n\n;\n\ndestinationVar =\
  \ (byte)sourceVar;\n\nWriteLine($\"sourceVar val: {sourceVar}\");\n\nWriteLine($\"\
  destinationVar val: {destinationVar}\"); \n```\n\n这会导致如下结果：\n\n```\n sourceVar val:\
  \ 281\n\ndestinationVar val: 25 \n```\n\n发生了什么？嗯，看看这两个数字的二进制表示，以及 `byte` 能够存储的最大值（即\
  \ 255）：\n\n```\n 281 = 100011001\n\n 25 = 000011001\n\n255 = 011111111 \n```\n\n\
  你可以看到源数据的左侧位丢失了。这立即引发了一个问题：你如何判断这种情况何时发生？显然，你会有需要显式将一种类型转换为另一种类型的时候，如果知道在此过程中是否丢失了数据将会很好。检测不到这一点可能会导致严重的错误——例如，在会计应用程序或确定月球火箭轨迹的应用程序中。\n\
  \n实现此点的方法方法是检查源变量的值并将其与目标变量的已知限制进行比较。另一种技术是强制系统在运行时特别注意转换。当一个值对于该变量的类型太大时，尝试将该值放入变量中会导致*溢出*（*overflow*），这正是你想要检查的情况。\n\
  \n有两个关键字用于设置表达式所谓的*溢出检查上下文*（*overflow checking context*）：`checked` 和 `unchecked`。你按照以下方式使用它们：\n\
  \n```\n checked(\n\n<expression>\n\n)\n\nunchecked(\n\n<expression>\n\n) \n```\n\
  \n你可以在最后一个示例中强制进行溢出检查：\n\n```\n byte destinationVar;\n\nshort sourceVar = 281;\n\
  \ndestinationVar = \nchecked(\n\n(byte)sourceVar\n)\n\n;\n\nWriteLine($\"sourceVar\
  \ val: {sourceVar}\");\n\nWriteLine($\"destinationVar val: {destinationVar}\");\
  \ \n```\n\n当执行此代码时，它将带有在 图 5-1 中所示的错误消息而崩溃（该代码在一个名为 `OverflowCheck` 的项目中编译的）。\n\n\
  ![在名为“OverflowCheck.”的项目中编译的执行代码时的错误消息插图](img/Image00033.jpg)\n\n**图 5-1**\n\n然而，如果你在这些代码中将\
  \ `checked` 替换为 `unchecked`，你将得到之前的结果，且不会发生错误。这与之前显示的默认行为完全相同。\n\n你还可以配置你的应用程序，使其表现就像此类类型的每个表达式都包含了\
  \ `checked` 关键字，除非该表达式显式使用了 `unchecked` 关键字（换句话说，你可以更改溢出检查的默认设置）。要为此操作，可以在解决方案管理器窗口中右键点击项目并选择“属性”选项来修改项目属性。点击窗口左侧的“生成”以打开生成设置。\n\
  \n你想要更改的属性是高级设置之一，因此点击“高级”按钮。在出现的对话框中，启用“检查算术溢出/下串”（Check for Arithmetic Overflow/Underflow）复框，如\
  \ 图 5-2` 等命令将字符串值转换为数字。例如，如果你尝试使用 `ToDouble()` 将像 `Number` 字符串转换为 double 值，你将看到在\
  \ [图 5-3](#text00008.html_c05-fig-0003）所示的对话框（当你执行代码时）。\n\n正如你看到的，操作失败了。为了使这种转换工作，提供的字符串*必须*是数字的有效表示，且该数字不能导致溢出。数字的有效表示是指包含一个可选符号（即加或减）、零或多个数字、一个可选的点后跟一个或多个数字、以及可选的“`e`\
  \ ”或“`E` ”后跟可选符号、一个或多个数字，除此序列外没有其他。使用所有这些可选部分，你可以识别出如 `毫不 1.2451e‐24` 的字符串为数字。\n\
  \n关于这些转换的重要一点是，它们*总是*经过溢出检查的，`checked` 和 `unchecked` 关键字以及项目设置没有影响。\n\n下一个 Try Out\
  \ 是一个涵盖本节许多转换类型的示例。它声明并初始化了不同类型的变量，并在它们之间进行隐式和显式的转换。\n\n## 复合类型\n\n除了你看到的所有简单类型外，C#\
  \ 还提供了三种稍微复杂（但非常有用）的变量类型：枚举（enumerations）、结构体（structs）和数组（arrays）。\n\n### 枚举\n\n\
  你之前看到的每种类型（`string` 除外）都有明确定义的允许值集合。诚然，在 `double` 等类型中，这个集合大到几乎可以被认为是连续的，但它仍然是一个固定的集合。最简单的例子是\
  \ `bool` 类型，它只能取两个值之一：`true` 或 `false` 。\n\n\n\n\n\n在许多其他情况下，你可能希望有一个变量可以取固定结果中的某一个。例如，你可能希望有一个\
  \ `orientation` 类型，可以存储 `north`、`south`、`east` 或 `west` 中的值之一。\n\n在这样的情况下，`enumerations`（枚举）会非常有用。枚举恰好实现了你在这个\
  \ `orientation` 类型中想要的功能：它们允许定义一种类型，该类型可以取你提供的有限值集中的一个值。那么，你需要做的是创建一个名为 `orientation`\
  \ 的自定义枚举类型，它可以取四个可能值之一。\n\n请注意，这里涉及一个额外的步骤——你不仅仅是声明一个给定类型的变量；而是声明并详细说明一个用户定义类型，然后声明一个该新类型的变量。\n\
  \n## 定义枚举\n\n你可以使用 `enum` 关键字如下所示定义枚举：\n\n```c\nenum <typeName>\n{\n   <value1>,\n\
  \   <value2>,\n   <value3>,\n   …\n   <valueN>\n} \n```\n\n接下来，你可以按照如下方式声明这种新类型的变量：\n\
  \n```csharp\n<typeName> <varName>; \n```\n\n你可以使用以下方式进行赋值：\n\n```csharp\n<varName>\
  \ = <typeName>.<value>; \n```\n\n枚举有一个用于存储的`underlying type`（底层类型）。枚举类型可以取的每个值都存储为该底层类型的值，默认情况下是\
  \ `int`。你可以通过在枚举声明中添加类型来指定不同的底层类型：\n\n```csharp\nenum <typeName> : <underlyingType>\n\
  {\n   <value1>,\n   <value2>,\n   <value3>,\n   …\n   <valueN>\n} \n```\n\n枚举的底层类型可以是\
  \ `byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long` 和 `ulong`。\n\n默认情况下，每个值根据定义的顺序自动分配相应的底层类型值，从零开始。这意味着\
  \ `<value1>` 获得值 0，`<value2>` 获得 1，`<value3>` 获得 2，以此此类推。你可以通过 `=` 运算符并为每个枚举值指定实际值来覆盖此赋值：\n\
  \n```csharp\nenum <typeName> : <underlyingType>\n{\n   <value1> = <actualVal1>,\n\
  \   <value2> = <actualVal2>,\n   <value3> = <actualVal3>,\n   …\n   <valueN> = <actualValN>\n\
  } \n```\n\n此外，你可以通过使用一个值作为另一个值的底层值，为多个枚举值指定相同的值：\n\n```csharp\nenum <typeName> :\
  \ <underlyingType>\n{\n   <value1> = <actualVal1>,\n   <value2> = <value1>,\n  \
  \ <value3>,\n   …\n   <valueN> = <actualValN>\n} \n```\n\n任何未赋值的值都会自动获得一个底层值，其中使用的值是从上一个显式声明的值加\
  \ 1 开始的序列。在前面的代码中，例如，`<value3>` 将获得值 `<value1>` + 1。\n\n注意，这可能会导致问题，在定义之后指定的的值（如\
  \ `<value2>` = `<value1>`）与其他值相同。例如，在下面的代码中，`<value4>` 的值与 `<value2>` 相同：\n\n```csharp\n\
  enum <typeName> : <underlyingType>\n{\n<value1> = <actualVal1>,\n<value2>,\n<value3>\
  \ = <value1>,\n<value4>,\n   …\n<valueN> = <actualValN>\n} \n```\n\n当然，如果这是你想要的行为，那么这段代码就是没问题的。还要注意，以循环方式赋值会导致错误：\n\
  \n```csharp\nenum <typeName> : <underlyingType>\n{\n<value1> = <value2>,\n<value2>\
  \ = <value1>\n} \n```\n\n接下来的“Try It Out”展示了这一切的示例。代码定义了并使用了一个名为 `orientation` 的枚举。\n\
  \n## 结构体 (Structs)\n\n`struct`（structure 的缩写）就是如此。也就是说，结构体是由几部分数据组成的数据结构，这些数据可能具有不同的类型。它们允许你根据这种结构定义自己的变量类型。例如，假设你想存储从起始点到某个地点的路线，该路线由方向和英里单位距离组成。为了简单起见，你可以假设方向是指南针的一个点（可以使用上一节中的\
  \ `orientation` 枚举来表示），且英里单位的距离可以用 `double` 类型表示。\n\n你可以使用已经见过的代码用两个独立的变量来实现：\n\n\
  ```csharp\norientation myDirection;\ndouble myDistance; \n```\n\n使用这样的两个变量没有问题，但将这些信息存储在一个地方要简单得多（特别是在需要多条路线时）。\n\
  \n### 定义结构体\n\n结构体使用 `struct` 关键字定义：\n\n```csharp\nstruct <typeName>\n{\n   public\
  \ <type> <memberName>;\n}\n```\n\n一旦你有了一个结构体，你就可以通过定义如下内容来使用它：\n\n```csharp\n<typeName>\
  \ myRoute;\n```\n\n此外，你可以通过点符号访问成员：\n\n```csharp\nmyRoute.direction = north;\nmyRoute.distance\
  \ = 2.5;\n```\n\n## 数组 (Arrays)\n\n到目前为止看到的所有类型都有一个共同点：每个类型都存储一个值（对于结构体来说是存储一组值）。有时，在需要存储大量数据时，这种方式并不方便。你可能希望同时存储多个相同类型的值，而无需为每个值使用不同的变量。\n\
  \n例如，假设你想对所有朋友的名字进行某些处理。你可以使用简单的字符串变量：\n\n```csharp\nstring friendName1 = \"Todd\
  \ Anthony\";\nstring friendName2 = \"Kevin Holton\";\nstring friendName3 = \"Shane\
  \ Laigle\";\n```\n\n但这看起来需要大量的精力，因为你需要为每个变量编写不同的代码。例如，你无法通过循环遍历此列表。\n\n替代方案是使用 `array`（数组）。数组是存储在类型变量中的索引列表。例如，你可能有一个名为\
  \ `friendNames` 的数组，存储了这三个名字。你可以通过指定索引来访问数组的各个成员，如下：\n\n```csharp\nfriendNames[index]\n\
  ```\n\n索引简单来说是一个整数，从 0 开始表示第一个，1 表示第二个，以此此类推。这意味着你可以使用循环遍历条目：\n\n```csharp\nint\
  \ i;\nfor (i = 0; i < 3; i++)\n{\n   WriteLine($\"Name with index of {i}: {friendNames[i]}\"\
  );\n} \n```\n\n数组有一个 `base type`（基类型）——也就是说，数组中的元素都是相同类型。这个 `friendNames` 数组的基类型是\
  \ `string`，因为它旨在存储 `string` 变量。数组项通常被称为 `elements`（元素）。\n\n### 声明数组\n\n数组以如下方式声明：\n\
  \n```csharp\n<baseType>[] <name>; \n```\n\n在这里，`baseType` 可以是任何变量类型，包括在本章中看到的枚举类型和结构体类型。在访问数组之前必须对其进行初始化。你不能像这样直接访问或为数组元素赋值：\n\
  \n```csharp\nint[] myIntArray;\nmyIntArray[10] = 5; \n```\n\n\n\n数组可以通过两种方式初始化。你可以使用字面量形式（literal\
  \ form）指定数组的完整内容，也可以指定数组的大小并使用 `new` 关键字初始化所有数组元素。\n\n使用字面量值指定数组只需在花括号内提供一个用逗号分隔的元素值列表即可：\n\
  \n```\n int[] myIntArray = { 5, 9, 10, 2, 99 }; \n```\n\n在这里，`myIntArray` 有五个元素，每个元素都分配了一个整数值。\n\
  \n另一种方法需要使用以下语法：\n\n```\n int[] myIntArray = new int[5]; \n```\n\n在这里，你使用 `new`\
  \ 关键字显式地初始化数组，并使用常量值来定义大小。这种方法会导致所有数组成员被分配一个默认值，对于数值类型，该默认值是 0。你也可以使用非常量变量进行此类初始化：\n\
  \n```\n int[] myIntArray = new int[arraySize]; \n```\n\n此外，如果你愿意，还可以结合这两种初始化方法：\n\
  \n```\n int[] myIntArray = new int[5] { 5, 9, 10, 2, 99 }; \n```\n\n使用这种方法时，大小必须匹配。例如，你不能写以下代码：\n\
  \n```\n int[] myIntArray = new int[10] { 5, 9, 10, 2, 99 }; \n```\n\n在这里，数组被定义为有\
  \ 10 个成员，但只定义了五个，因此编译将失败。这种做法的副作用是，如果你使用变量定义大小，那么该变量必须是一个常量：\n\n```\n const int\
  \ arraySize = 5;\n\nint[] myIntArray = new int[arraySize] { 5, 9, 10, 2, 99 }; \n\
  ```\n\n如果省略了 `const` 关键字，这段代码将执行失败。\n\n与其他变量类型一样，不需要在声明数组的同一行进行初始化。以下代码是完全合法的：\n\
  \n```\n int[] myIntArray;\n\nmyIntArray = new int[5]; \n```\n\n在接下来的“尝试一试”中，你将使用本节引言中的示例创建并使用一个字符串数组。\n\
  \n### foreach 循环\n\n`foreach` 循环允许你使用这种简单的语法处理数组中的每个元素：\n\n```\nforeach (<baseType>\
  \ <name> in <array>)\n{\n   // 可以对每个元素使用 <name>\n} \n```\n\n该循环将遍历每个元素，并轮流将其放入变量\
  \ `<name>` 中，而无担心访问非法元素的风险。你不需要担心数组中有多少个元素，可以确定你将在循环中使用每一个元素。使用这种方法，你可以按照如下方式修改上一个示例中的代码：\n\
  \n```csharp\n static void Main(string[] args)\n{\n   string[] friendNames = { \"\
  Todd Anthony\", \"Kevin Holton\",\n                            \"Shane Laigle\"\
  \ };\n\n   WriteLine($\"Here are {friendNames.Length} of my friends:\");\n\n   foreach\
  \ (string friendName in friendNames)\n   {\n      WriteLine(friendName);\n   }\n\
  \n   ReadKey();\n}\n```\n\n这段代码的输出将与那个“尝试一试”的结果完全相同。使用这种方法与标准 `for` 循环的主要区别在于，`foreach`\
  \ 提供了对数组内容的只读访问，因此你不能更改任何元素的值。例如，你无法执行以下操作：\n\n```csharp\nforeach (string friendName\
  \ in friendNames)\n{\n    friendName = \"Rupert the bear\";\n}\n```\n\n如果你尝试这样做，编译将失败。然而，如果你使用简单的\
  \ `for` 循环，则可以给元素赋值。\n\n### 使用 switch case 进行模式匹配\n\n在第 4 章中，引入了 `switch` 语句。在当时的讨论中，`case`\
  \ 是基于特定变量的值。回以下代码，其中 `testVar` 是已知类型，例如 `integer`、`string` 或 `boolean`。例如，`integer`\
  \ 有一个数值值，而 `case` 会检查特定的值（1, 2, 3 等），并在匹配时执行某些代码。\n\n```c\nswitch (testVar)\n{\n\
  \   case comparison1:\n      // 如果 testVar == comparison1，执行代码\n      break;\n \
  \  case comparison2:\n      // 如果 testVar == comparison2，执行代码\n      break;\n  \
  \ case comparisonN:\n      // 如果 testVar == comparisonN，执行代码\n      break;\n   default:\n\
  \      // 如果 testVar != comparisonVals，执行代码\n      break;\n}\n```\n\n在 C# 7 中，可以在\
  \ `switch case` 中根据变量类型匹配模式，例如 `string` 或 `integer` 数组。然后，因为你知道类型，就可以访问该类型公开的方法和属性。参考下面的\
  \ `switch` 结构：\n\n```csharp\nswitch (testVar)\n{\n   case int value:\n      // 如果\
  \ testVar 是 int，执行代码\n      break;\n   case string s when s.Length == 0:\n     \
  \ // 如果 testVar 是长度为 0 的 string，执行代码\n      break;\n   case null:\n      // 如果 testVar\
  \ == null，执行代码\n      break;\n   default:\n      // 如果 testVar != comparisonVals，执行代码\n\
  \      break;\n}\n```\n\n紧接 `case` 关键字之后的是你想要检查的变量类型，例如 `string` 或 `integer` 数组。然后，因为你知道类型，就可以访问该类型公开的方法和属性。参考下面的\
  \ `switch` 结构：\n\n```csharp\nswitch (testVar)\n{\n   case int value:\n      // 如果\
  \ testVar 是 int，执行代码\n      break;\n   case string s when s.Length == 0:\n     \
  \ // 如果 testVar 是长度为 0 的 string，执行代码\n      break;\n   case null:\n      // 如果 testVar\
  \ == null，执行代码\n      break;\n   default:\n      // 如果 testVar != comparisonVals，执行代码\n\
  \      break;\n}\n```\n紧接 `case` 关键字之后的是你想要检查的变量类型，例如 `string` 或 `integer` 数组。然后，因为你知道类型，就可以访问该类型公开的方法和属性。参考下面的\
  \ `switch` 结构：\n\n```csharp\nswitch (testVar)\n{\n   case int value:\n      // 如果\
  \ testVar 是 int，执行代码\n      break;\n   case string s when s.Length == 0:\n     \
  \ // 如果 testVar 是长度为 0 的 string，执行代码\n      break;\n   case null:\n      // 如果 testVar\
  \ == null，执行代码\n      break;\n   default:\n      // 如果 testVar != comparisonVals，执行代码\n\
  \      break;\n}\n```\n紧接 `case` 关键字之后的是你想要检查的变量类型，例如 `string` 或 `integer` 数组。然后，因为你知道类型，就可以访问该类型公开的方法和属性。参考下面的\
  \ `switch` 结构：\n\n```csharp\nswitch (testVar)\n{\n   case int value:\n      // 如果\
  \ testVar 是 int，执行代码\n      break;\n   case string s when s.Length == 0:\n     \
  \ // 如果 testVar 是长度为 0 的 string，执行代码\n      break;\n   case null:\n      // 如果 testVar\
  \ == null，执行代码\n      break;\n   default:\n      // 如果 testVar != comparisonVals，执行代码\n\
  \      break;\n}\n```\n（注：由于原文中部分内容出现了重复，翻译时已根据逻辑进行了整合处理，确保内容流畅且无冗余）\n\n### 多维数组\n\
  \n多维数组简单来说是通过多个索引来访问元素。例如，假设你想绘制山丘的高度。你可能会使用两个坐标指定位置，`x` 和 `y`。你想使用这两个坐标作为索引，这样名为\
  \ `hillHeight` 的数组将存储每对坐标的高度。这涉及到使用多维数组。\n\n如下所示数组二维数组：\n\n```\n<baseType>[,] <name>;\n\
  ```\n\n更多维度的数组只需需要更多的逗号：\n\n```\n<baseType>[,,,] <name>;\n```\n\n这将声明一个四维数组。赋值也使用类似的语法，用逗号分隔大小。声明并初始化二维数组\
  \ `hillHeight`，其基类型为 `double`，`x` 大小为 3，`y` 大小为 4，需要：\n\n```csharp\ndouble[,] hillHeight\
  \ = new double[3,4];\n```\n\n或者，你可以使用字面量值进行初始赋值。在这里，你使用逗号分隔的嵌套花括号：\n\n```csharp\n\
  double[,] hillHeight = { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n```\n\
  \n该数组的维度与之前的相同——即三行四列。通过提供字面量，这些维度是隐式定义的。\n\n要访问多维数组的元素，只需指定用逗号分隔的索引即可：\n\n```csharp\n\
  hillHeight[2,1]\n```\n\n你可以像操作其他元素一样操作这个元素。该表达式将访问之前定义的第三个嵌套数组的第二个元素（值将为 4）。记住，我们从\
  \ 0 开始计数，并且第一个数字是嵌套数组。换句话说，第一个数字指定花括号对，第二个数字指定该花括号内的元素。你可以以可视方式表示此数组，如图 5-11 所示。\n\
  \n\n\nThe `foreach` loop gives you access to all elements in a multidimensional\
  \ way, just as with single-dimensional arrays:\n\n```\ndouble[,] hillHeight = {\
  \ { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n\nforeach (double height in\
  \ hillHeight)\n{\n   WriteLine($\"{height}\");\n} \n```\n\nThe order in which the\
  \ elements are output is the same as the order used to assign literal values. This\
  \ sequence is as follows (the element identifiers are shown here rather than the\
  \ actual values):\n\n```\nhillHeight[0,0]\nhillHeight[0,1]\nhillHeight[0,2]\nhillHeight[0,3]\n\
  hillHeight[1,0]\nhillHeight[1,1]\nhillHeight[1,2]\n… \n```\n\n### Arrays of Arrays\n\
  \nMultidimensional arrays, as discussed in the last section, are said to be `rectangular`\
  \ because each “row” is the same size. Using the last example, you can have a `y`\
  \ coordinate of 0 to 3 for any of the possible `x` coordinates.\n\nIt is also possible\
  \ to have `jagged` arrays, whereby “rows” may be varied sizes. For this, you need\
  \ an array in which each element is another array. You could also have arrays of\
  \ arrays of arrays, or even more complex situations. However, all this is possible\
  \ only if the arrays have the same base type.\n\nThe syntax for declaring arrays\
  \ of arrays involves specifying multiple sets of square brackets in the declaration\
  \ of the array, as shown here:\n\n```\nint[][] jaggedIntArray; \n```\n\nUnfortunately,\
  \ initializing arrays such as this isn't as simple as initializing multidimensional\
  \ arrays. You can't, for example, follow the preceding declaration with this:\n\n\
  ```\njaggedIntArray = new int[3][4]; \n```\n\nEven if you could do this, it wouldn't\
  \ be that useful because you can achieve the same effect with simple multidimensional\
  \ arrays with less effort. Nor can you use code such as this:\n\n```\njaggedIntArray\
  \ = { { 1, 2, 3 }, { 1 }, { 1, 2 } }; \n```\n\nYou have two options. You can initialize\
  \ the array that contains other arrays (let's call these sub-arrays for clarity)\
  \ and then initialize the sub-arrays in turn:\n\n```\njaggedIntArray = new int[2][];\n\
  jaggedIntArray[0] = new int[3];\njaggedIntArray[1] = new int[4]; \n```\n\nAlternatively,\
  \ you can use a modified form of the preceding literal assignment:\n\n```\njaggedIntArray\
  \ = new int[3][] { new int[] { 1, 2, 3 }, new int[] { 1 },\n                   \
  \             new int[] { 1, 2 } }; \n```\n\nThis can be simplified if the array\
  \ is initialized on the same line as it is declared, as follows:\n\n```\nint[][]\
  \ jaggedIntArray = { new int[] { 1, 2, 3 }, new int[] { 1 },\n                 \
  \          new int[] { 1, 2 } }; \n```\n\nYou can use `foreach` loops with jagged\
  \ arrays, but you often need to nest these to get to the actual data. For example,\
  \ suppose you have the following jagged array that contains 10 arrays, each of which\
  \ contains an array of integers that are divisors of an integer between 1 and 10:\n\
  \n```\nint[][] divisors1To10 = { new int[] { 1 },\n                          new\
  \ int[] { 1, 2 },\n                          new int[] { 1, 3 },\n             \
  \             new int[] { 1, 2, 4 },\n                          new int[] { 1, 5\
  \ },\n                          new int[] { 1, 2, 3, 6 },\n                    \
  \      new int[] { 1, 7 },\n                          new int[] { 1, 2, 4, 8 },\n\
  \                          new int[] { 1, 3, 9 },\n                          new\
  \ int[] { 1, 2, 5, 10 } }; \n```\n\nThe following code will fail:\n\n```\nforeach\
  \ (int divisor in divisors1To10)\n{\n   WriteLine(divisor);\n} \n```\n\nThe failure\
  \ occurs because the array `divisors1To10` contains `int[]` elements, not `int`\
  \ elements. Instead, you must loop through every sub-array, as well as through the\
  \ array itself:\n\n```\nforeach (int[] divisorsOfInt in divisors1To10)\n{\n   foreach(int\
  \ divisor in divisorsOfInt)\n   {\n      WriteLine(divisor);\n   }\n} \n```\n\n\
  As you can see, the syntax for using jagged arrays can quickly become complex! In\
  \ most cases, it is easier to use rectangular arrays or a simpler storage method.\
  \ Nonetheless, there may well be situations in which you are forced to use this\
  \ method, and a working knowledge can't hurt. An example of this happens when working\
  \ with XML documents where some elements have sub-children and other do not.\n\n\
  ### 字符串 MANIPULATION\n\nYour use of strings so far has consisted of writing strings\
  \ to the console, reading strings from the console, and concatenating strings using\
  \ the `+` operator. In the course of programming more interesting applications,\
  \ you will discover that manipulating strings is something you end up doing a lot.\
  \ Therefore, it is worth spending a few pages looking at some of the more common\
  \ string-manipulation techniques available in C#.\n\nTo start with, a `string` type\
  \ variable can be treated as a read-only array of `char` variables.\n\n\n\n\n```\n\
  \ \"Yeeeees\"\n\n\" y\" \n```\n\n以此类推。\n\n你还可以使用 `string.TrimStart()` 和 `string.TrimEnd()`\
  \ 命令，它们分别会删除字符串开头和结尾的空格。这些命令也可以指定 `char` 数组。\n\n你可以使用另外两个字符串命令来处理字符串的间距：`string.PadLeft()`\
  \ 和 `string.PadRight()`。它们允许你在字符串的左侧或右侧添加空格，以强制达到所需的长度。你的使用方法如下：\n\n```\n <string>.PadX(<desiredLength>);\
  \ \n```\n\n这是一个示例：\n\n```\n myString = \"Aligned\";\n\nmyString = myString.PadLeft(10);\
  \ \n```\n\n这将导致在 `myString` 中的单词 `Aligned` 左侧添加三个空格。这些方法在列对齐字符串时非常有用，特别是对于包含数字的字符串进行定位尤为方便。\n\
  \n与修剪命令一样，你也可以以第二种方式使用这些命令，即提供用于填充字符串的字符。这涉及到单个 `char`，而不是像修剪那样的 `char` 数组：\n\n\
  ```\n myString = \"Aligned\";\n\nmyString = myString.PadLeft(10, '-'); \n```\n\n\
  这会在 `myString` 的开头添加三个连字符。\n\n还有许多此类字符串处理命令，其中许多仅在非常特定的情况下有用。你将在接下来的章节中使用它们时对其进行讨论。不过，在继续之前，值得查看\
  \ Visual Studio 2017 中包含的一个特性，你可能在过去的几个章节中特别是本章中注意到它。在接下来的“尝试一下”（Try It Out）中，你将检查自动补全，IDE\
  \ 会通过建议你可能想要插入的代码来提供帮助。\n\n## 练习\n\n1. 5.1 下列转换哪些不能隐式执行？\n    1. `int` 到 `short`\n\
