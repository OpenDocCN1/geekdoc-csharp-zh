  \n*(注：由于提供的文本中存在大量重复段落，根据指令“一定不要重复输出原文”的原则，此处仅对互不重复的内容进行了逻辑处理。若需完整去重后的翻译，请告知。)*\n\
  \n\n\n\n在本章之前的内容中，你使用了 `Label` 和 `TextBlock` 控件。这些控件专门设计用于向用户显示文本。`TextBox` 控件允许用户向应用程序中输入文本。虽然它也可以显示文本，但除非允许用户编辑显示的文本，否则你不应将其用于此目的。如果你决定要使用文本框显示文本，请务必将其\
  \ `IsEnabled` 属性设置为 `false`，以防止用户能够编辑它。\n\n你可以通过多个属性来控制文本的显示方式以及文本输入到 `TextBox`\
  \ 的方式，这些属性如表 14-4 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Text` | `TextBox` 控件中当前显示的文本。\
  \ |\n| `IsEnabled` | 当此设置为 `true` 时，用户可以编辑 `TextBox` 中的文本。当设置为 `false` 时，文本显示为灰色，用户无法向该控件获取焦点。\
  \ |\n| `TextWrapping` | 有时你希望 `TextBox` 只显示单行文本。在这种情况下，你可以将此属性设置为 `NoWrap`。这是默认值。如果你想让文本分多行显示，可以将其设置为\
  \ `Wrap` 或 `WrapWithOverflow`。`Wrap` 会导致超出框边界的文本移动到下一行。`WrapWithOverflow` 在某些情况下，如果无法确定合适的断点点，将允许非常长的单词超出框边界。\
  \ |\n| `VerticalScrollBarVisibility` | 如果你的 `TextBox` 允许用户输入多行文本，那么用户可能会输入消失在框边缘下方的文本。在这种情况下，显示滚动条是一个好主意。如果你希望仅在文本过长无法显示时才出现滚动条，请将其设置为\
  \ `Auto`。将其设置为 `Visible` 则始终显示滚动条，将其设置为 `Hidden` 或 `Disabled` 则永远不显示滚动条。 |\n| `AcceptsReturn`\
  \ | 此属性控制如何输入文本到控件中。如果你将其设置为 `false`（默认值），则用户无法通过回车键换行。 |\n\n**表 14-4 :** TextBox\
  \ 属性\n\n### CheckBox 控件\n\n`CheckBoxes` 为用户提供了可以选择或取消选择的选项。如果你想向用户提供一个可以开启或关闭的选项，或者希望用户对问题回答“是”或“否”，你应该使用\
  \ `CheckBox`。例如，在选项对话框中，你希望用户回答以决定他们是否应该与电脑对战。为此，使用了带有“与电脑对战”文本的 `CheckBox`。\n\n\
  `CheckBox` 设计为作为一个单一实体使用，不受视图上其他 `CheckBoxes` 的影响。你有时会看到 `CheckBoxes` 以一种将它们链接在一起的方式使用，使得选择其中一个导致另一个被取消选择，但这不是该控件的意图用途。如果你需要此功能，应该使用在下一节中描述的\
  \ `RadioButton`。\n\n`CheckBoxes` 还可以显示第三种状态，称为“不确定”（indeterminate），用于用于指示可能无法回答“是/否”答案。当\
  \ `CheckBox` 用于显示关于其他事物的信息时，这种状态非常常用。例如，`CheckBoxes` 有时被用于指示树形视图（Tree View）中的所有子节点是否都被选中。在这种情况下，如果所有节点都被选中，则\
  \ `CheckBox` 将被选中；如果一个都没有被选中，则取消选中；如果部分但并非全部被选中，则处于不确定状态。\n\n表 14-5 列出了常用于控制 `CheckBox`\
  \ 控件的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Content` | `CheckBox` 是一个 `Content` 控件，因此其显示可以高度自定义。向\
  \ `Content` 属性添加文本将产生默认视图。 |\n| `IsThreeState` | 用于指示控件是否具有两个或三个状态。默认值为 `false`，意味着只有两个可能值。\
  \ |\n| `IsChecked` | 值为 `true` 或 `false`。默认情况下，将其设置为 `true` 会显示勾选标记。如果 `IsThreeState`\
  \ 为 `true`，则可能是 `null`，表示状态是不确定的。 |\n\n**表 14-5 :** CheckBox 属性\n\n### RadioButton\
  \ 控件\n\n`RadioButtons` 与其他 `RadioButtons` 一起使用，允许用户在多个选项中进行选择，其中任何时候只能选择一个。当你希望用户回答一个可能值数量非常少的问题时，你应该使用\
  \ `RadioButtons`。如果可能值超过四个或五个，你应该考虑改用 `ListBox` 或 `ComboBox`。在稍后将创建的选项窗口中，用户可以选择电脑玩家的技能水平。有三个选项：愚蠢（Dumb）、良好（Good）和作弊（Cheats）。在任何给定时间内只能选择其中一个。\n\
  \n当在同一视图中显示多个 `RadioButton` 时，它们默认会感知彼此，一旦选择了其中任何一个，其他就会被取消选择。你可以通过通过表 14-6 中列出的属性来控制\
  \ `RadioButtons`。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Content` | `RadioButtons` 是\
  \ `Content` 控件，因此其显示可以高度自定义。默认情况下在 `Content` 中输入文本。 |\n| `IsChecked` | 值为 `true`\
  \ 或 `false`。如果 `IsThreeState` 为 `true`，则可能是 `null`，表示状态是不确定的。 |\n| `GroupName` |\
  \ 控件所属组的名称。默认情况下为空，任何没有 `GroupName` 的 `RadioButtons` 都视为同一组。 |\n\n**表 14-6 :** RadioButton\
  \ 属性\n\n### ComboBox 控件\n\n与 `RadioButton` 和 `CheckBox` 控件一样，`ComboBoxes` 允许用户选择一个选项。然而，`ComboBoxes`\
  \ 在两个方面与另外两个有本质区别：\n\n* `ComboBoxes` 以下拉列表显示可能的选择。\n* 可以允许用户输入新值。\n\n`ComboBoxes`\
  \ 通常用于显示长列表，例如国家或州名称，但它们可以用于许多目的。在选项对话框中，使用 `ComboBox` 显示一个用户可以从中选择人数的列表。这完全可以使用\
  \ `RadioButtons` 实现，但使用 `ComboBox` 节省了视图空间。\n\n`ComboBox` 可以更改为带有顶部 `TextBox` 的形式显示，允许用户输入任何他们认为缺失的值。本章的一个练习要求你向选项对话框添加一个\
  \ `ComboBox`，用户可以从中输入姓名或从列表中选择。\n\n这两个属性——`IsReadOnly` 和 `IsEditable`——对于控件的行为非常重要，它们协同工作，为用户提供了使用键盘选择\
  \ `ComboBox` 值的四种可能方式（见表 14-7）：\n\n| | ISREADONLY 为 TRUE | ISREADONLY 为 FALSE |\n\
  | --- | --- | --- |\n| `IsEditable` 为 `true` | 显示 `TextBox`，但控件对按键没有响应。如果列表中选择了某项，则文本可以在\
  \ `TextBox` 中被选中。 | 显示 `TextBox`，且用户可以输入任何她想要的内容。如果输入的内容在列表中，则会被选中。当用户输入时，控件将显示最匹配的项。\
  \ |\n\n\n\n\n\n| `IsEditable` 为 `false` | 当 `IsEditable` 为 `false` 时，`IsReadOnly`\
  \ 不再起作用，因为 `TextBox` 不显示。当控件被选中时，用户可以通过输入从列表中选择一个值，但无法输入列表中不存在的值。 |\n\n**表 14‐7:**\
  \ `IsReadOnly` 和 `IsEditable` 的组合\n\n`ComboBox` 是一个项目控件（Items control），这意味着你可以向它添加多个项目。表\
  \ 14‐8 显示了 `ComboBox` 控件的附加属性。\n\n| COMBOBOX 属性 | 描述 |\n| --- | --- |\n| `Text`\
  \ | `Text` 属性表示显示在 `ComboBox` 头部显示的文本。它可以是列表中的元素，也可以用户输入的新文本。 |\n| `SelectedIndex`\
  \ | 代表列表中被选中项目的索引。如果此值为 –1，则没有进行任何选择。如果用户输入了不在列表的内容，情况也是如此。 |\n| `SelectedItem`\
  \ | 代表列表的实际项目，而不仅仅是索引或文本。如果没有选中内容或用户输入了新内容，则返回 null。 |\n\n**表 14‐8:** 其他 ComboBox\
  \ 属性\n\n#### TabControl（选项卡控件）\n\n`TabControl` 与本节介绍的其他控件截然不同。它是一种布局控件，用于将控件分组在可以通过点击选择的页面上。\n\
  \n当你想在一个窗口中显示大量信息，但不想让视图过于混乱时，就会选项卡控件。在这种情况下，你应该将信息划分为相关项目的组，并为每个组创建一个单独的页面。通常，你不应该允许一个页面上的控件影响另一个页面上的控件。即使你这样做这样做，用户也不会意识到另一个页面上发生了变化，并在设置在他们不知情的情况下发生改变时会感到困惑。\n\
  \n默认情况下，每个页面由 `TabItems` 组成，默认情况下它们由单个 `Grid` 控件填充，但你可以根据需要将 `Grid` 更改为任何其他控件。在每个选项卡上，你可以布局\
  \ UI，并通过选择 `TabItems` 在不同选项卡之间切换。每个 `TabItem` 都有一个 `Header`，可以显示选项卡本身。这可以作为一个 `Content`\
  \ 控件，这意味着你可以自定义头部的显示方式，使其不仅仅是文本。\n\n#### 在选项窗口中处理事件\n\n该窗口目前看起来还可以，用户甚至可以对其进行一些操作，尽管在更改设置时什么都不会发生。用户期望他们所选择的选项会被应用程序存储并使用。你可以通过在窗口中存储控件的取值来实现这一点，但这并不灵活，并且将应用程序的数据与\
  \ GUI 混合在了一起，这不是一个好主意。相反，你应该创建一个类来存储用户所做的选择。\n\n在下面的“试一试”（Try It Out）中，你为选项窗口添加了事件处理程序，这些程序会在用户与控件交互时执行。\n\
  \n#### 数据绑定（Data Binding）\n\n数据绑定是以声明方式连接控件与数据的方法。在选项窗口中，你处理了 `RadioButtons` 的 `Checked`\
  \ 事件，以便设置 `GameOptions` 类中 `ComputerSkillLevel` 属性的值。这种效果良好，你可以使用代码和事件处理来设置窗口中的所有值，但很多情况下，直接将控件的属性绑定到数据会更好。\n\
  \n一个绑定由四个部分组成：\n\n* 绑定目标（binding target），指定使用绑定的对象。\n* 目标属性（target property），指定要设置的属性。\n\
  * 绑定源（binding source），指定绑定使用的对象。\n* 源属性（source property），指定哪个属性持有数据。\n\n你不总是显式地设置所有这些元素；特别是绑定目标，通常通过你正在对控件上的属性设置绑定这一事实被隐式指定。\n\
  \n为了使绑定生效，始终设置绑定源，但可以通过多种方式进行设置。在接下来的章节以及第 15 章中，你将看到从源绑定数据的多种方法。\n\n#### DataContext（数据上下文）\n\
  \n`DataContext` 控件定义了一个数据源，可以用于该元素的所有子元素的数据绑定。你通常会有一个类的实例，它持有在视图中使用的大部分数据。如果是这种情况，你可以将窗口的\
  \ `DataContext` 设置为该对象的实例，从而能够在视图中绑定来自该类的属性。这在“对外部对象的动态绑定”章节中得到了演示。\n\n#### 绑定到本地对象\n\
  \n只要编译器能够找到该对象，你就可以绑定到任何具有所需数据的 .NET 对象。如果在与使用该对象的控件相同的上下文中（即相同的 XAML 块）找到了对象，你可以通过设置绑定的\
  \ `ElementName` 属性来指定绑定源。看看选项窗口中更改过的 `ComboBox`：\n\n```\n <ComboBox HorizontalAlignment=\"\
  Left\" Margin=\"196,58,0,0\" VerticalAlignment=\"Top\" \nWidth=\"86\" Name=\"numberOfPlayersComboBox\"\
  \ SelectedIndex=\"0\" \nIsEnabled=\"{Binding ElementName=playAgainstCheck}\" >\n\
  ```\n\n注意 `IsEnabled` 属性。与其指定 `true` 或 `false`，现在括号内是长文本。这种指定方式被称为标记扩展（markup extension），是指定的简写。同样的内容可以写成这样：\n\
  \n```\n <ComboBox HorizontalAlignment=\"Left\" Margin=\"196,58,0,0\" VerticalAlignment=\"\
  Top\"\nWidth=\"86\" Name=\"numberOfPlayersComboBox\" SelectedIndex=\"0\" >\n\n \
  \             <ComboBox.IsEnabled>\n                <Binding ElementName=\"playAgainstCheck\"\
  \ Path=\"IsChecked\"/>\n              </ComboBox.IsEnabled>\n```\n\n这两个示例都将绑定源设置为\
  \ `playAgainstCheck`。源属性在 `Path` 中指定为 `IsChecked`。\n\n绑定目标设置为 `IsEnabled` 属性。这两个示例都通过将绑定作为属性的内容来实现——只是使用的语法不同。最后，绑定目标通过你在控件上执行绑定这一事实被隐式指定。\n\
  \n此示例中的绑定根据 `IsChecked` 属性的值设置或清除 `ComboBox` 的 `IsEnabled` 属性。结果是，无需代码，当用户更改 `CheckBox`\
  \ 的值时，`ComboBox` 就会启用或禁用。\n\n#### 对外部对象的静态绑定\n\n通过指定将类用作 XAML 中的资源，可以在需要时动态创建对象实例。这是通过向\
  \ XAML 添加命名空间以允许定位类，然后在 XAML 中的元素上声明该类为资源来实现的。接下来的“试一试”展示了如何在要数据绑对象的父元素上创建资源引用。\n\
  \n### 使用 ListBox 控件开始游戏\n\n\n\n\n你现在离完成游戏的所有支持窗口只差最后一个窗口了。在创建游戏板之前的最后一个窗口是玩家可以在其中添加新玩家并选择参与新游戏的玩家的窗口。此窗口将使用\
  \ `ListBox` 来显示玩家名称。\n\n`ListBoxes` 和 `ComboBoxes` 经常可以用于相同的目的，但 `ComboBox` 通常只允许你选择单个条目，而\
  \ `ListBoxes` 通常允许用户选择多个项目项。另一个关键区别是，`ListBox` 将以始终展开的列表形式显示其内容。这意味着它占据了窗口上更多的空间，但它允许用户立即看到所有可用选项。\n\
  \n表 14-9 列出了 `ListBox` 控件的几个特别有趣的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `SelectionMode`\
  \ |此属性控制用户如何从列表中选择项目。有三个可能的值：`Single`，允许用户仅选择一个项目；`Multiple`，允许用户在不按住 Ctrl 键的情况下选择多个项目；以及\
  \ `Extended`，允许用户通过按住 Shift 键选择多个连续项目，通过按住 Ctrl 键选择非连续项目。 |\n| `SelectedItem` |\
  \ 获取或设置第一个选中的项目，如果未选择任何内容则返回 null。即使选择了多个项目，也只返回第一个项目。 |\n| `SelectedItems` | 获取一个包含当前所选项目的列表。\
  \ |\n| `SelectedIndex` | 功能与 `SelectedItem` 类似，但返回索引而不是项目本身，如果未选择任何内容则返回 -1。 |\n\
  \n**表 14-9 :** 有趣 ListBox 属性\n\n在接下来的“试一试”（Try It Out）中，你将创建一个当用户想要开始新游戏时显示的窗口。\n\
  \n## 练习题\n\n1. 14.1 `TextBlock` 控件可以用于显示大量文本，但如果文本超出视口，控件本身不提供任何滚动文本的方法。通过将 `TextBlock`\
  \ 与另一个控件结合，创建一个包含带有大量文本的 `TextBlock` 的窗口，该文本是可以滚滚的，并且只有在文本超出视口时才出现滚动条。\n\n2. 14.2\
  \ `Slider` 和 `Progress` 控件有几个共同点，例如最小值、最大值和当前值。仅在 `ProgressBar` 上使用数据绑定，创建一个带有滑块和进度条的窗口，其中\
  \ `Slider` 控件控制进度条的最小值、最大值和当前值。\n\n3. 14.3 修改上一个问题中的 `ProgressBar`，使其从窗口的左下角到右上角对角线显示。\n\
  \n4. 14.4 创建一个名为 `PersistentSlider` 的新类，具有三个属性：`MinValue`、`MaxValue` 和 `CurrentValue`。该类必须参与数据绑定，且所有属性必须能够通知绑定控件的变化。\n\
  \n    1. 在前两个练习中创建的窗口的代码后台（code-behind）中，创建一个 `PersistentSlider` 类型的新字段并用某些默认值对其初始化。\n\
  \    2. 在构造函数中，将实例绑定到窗口的数据源。\n    3. 将滑块的 `Minimum`、`Maximum` 和 `Value` 属性绑定到数据源。练习题的答案可以在附录中找到。\n\
  \n## ![image](img/Image00002.gif) 本章所学\n\n| 概念 | 描述 |\n| --- | --- |\n| XAML | XAML\
  \ 是一种使用 XML 语法的语言，能够以声明性和分层次的方式将控件添加到用户界面中。 |\n| 数据绑定 | 你可以使用数据绑定将控件的属性连接到其他控件的值。你还可以定义资源，并在视图外部类中定义的代码作为属性值的数据源以及控件的内容。`DataContexts`\
  \ 可用于指定现有对象实例的绑定源，从而允许你绑定到应用程序其他部分创建的实例。 |\n| 路由事件 | 路由事件是 WPF 中使用的特殊事件。它们有两种形式：冒泡（bubbling）和隧道（tunneling）。冒泡事件首先在激活它的控件上触发，然后通过视图树向上移动到根元素。隧道事件方向相反，从根元素移动到用户激活的控件。通过将事件参数的\
  \ `Handled` 属性设置为 `true`可以停止冒泡或隧道事件。 |\n| INotifyPropertyChanged | `INotifyPropertyChanged`\
  \ 接口由 WPF 视图类实现。当类的属性设置程序被调用时，它们会触发 `PropertyChanged` 事件，并带有值发生变化的属性的名称。任何绑定到触发事件属性的控件属性都会收到更改通知并相应地更新自身。\
  \ |\n| ObservableCollections | `ObservableCollection` 是一种集合，其中实现了 `INotifyPropertyChanged`\
  \ 接口。当你需要为 WPF 视图提供列表形式的属性或值进行数据绑定时，请使用这种特殊集合。 |\n| 内容控件 | 内容控件可以在其内容中包含单个控件。此类控件的示例是\
  \ `Button`。此控件可以是 `Grid` 或 `StackPanel`； |\n| 项目控件 | 项目控件可以在其内容中包含一个控件列表。此类控件的示例是\
  \ `ListBox`。列表中的每个控件都可以自定义。 |\n| 布局控件 | 你学习了使用许多帮助你创建视图的控件：1. `Canvas` 允许控件的显式定位，除此之外几乎没有功能。2.\
  \ `StackPanel` 水平或垂直地堆叠控件。3. `WrapPanel` 堆叠控件并根据面板的方向将其换到下一行或下一列。4. `DockPanel`\
  \ 允许将控件停靠在边缘或填充内容。5. `Grid` 允许你定义行和列并利用这些来定位控件。 |\n| UI 控件 | UI 控件显示在视图上，通常使用布局控件引导它们的位置。使用了这些控件：1.\
  \ `Label` 控件显示短文本。2. `TextBlock` 控件显示可能需要多行的文本。3. `TextBox` 控件允许用户提供文本输入。4. `Button`\
  \ 控件允许用户执行单一操作。5. `Image` 控件用于显示图像。6. `CheckBoxes` 允许用户回答如“对电脑玩？”之类的是否问题。7. `RadioButtons`\
  \ 允许用户从多个选项中仅选择一个。8. `ComboBoxes` 显示一个下拉项目列表，用户可以从中选择单个条目。该控件还可以显示 `TextBox`，让用户输入新选项。9.\
  \ `ListBox` 控件显示项目列表。 |\n\n\n\n\n\nWPF 控件有一个名为 `Style` 的属性（继承自 `FrameworkElement`），该属性可以设置为\
  \ `Style` 类的实例。`Style` 类非常复杂，并支持高级的样式功能，但其核心是一组 `Setter` 对象。每个 `Setter` 对象负责根据其\
  \ `Property` 属性（要设置的属性的名称）和 `Value` 属性（要为该属性设置的值）来设置属性的值。你可以将用在 `Property` 属性中的名称完全限定限定到控件类型（例如\
  \ `Button.Foreground`），也可以设置 `Style` 对象的 `TargetType` 属性（例如 `Button`），这样它就能够解析属性名称。\n\
  \n下面的代码展示了如何使用 `Style` 对象来设置 `Button` 控件的 `Foreground` 属性：\n\n```xml\n <Button>\n\
  \  Click me!\n  <Button.Style>\n    <Style TargetType=\"Button\">\n      <Setter\
  \ Property=\"Foreground\">\n        <Setter.Value>\n          <SolidColorBrush Color=\"\
  Purple\"/>\n        </Setter.Value>\n      </Setter>\n    </Style>\n  </Button.Style>\n\
  </Button>\n```\n\n显然，在这种情况下，直接用通常的方法设置按钮的 `Foreground` 属性要简单得多。当你将样式转换为资源时，样式会变得有用得多，因为资源是可以重复复用的。\n\
  \n### 模板 (Templates)\n\n控件是通过模板构建的，你可以对其进行自定义。模板由一组用于构建控件显示的控件层级组成，其中可能包含一个用于按钮等显示内容的内容的\
  \ `ContentPresenter`。\n\n控件的模板存储在它的 `Template` 属性中，该属性是 `ControlTemplate` 类的一个实例。`ControlTemplate`\
  \ 类包含 `TargetType` 属性，你可以将其设置为为定义模板的控件类型。\n\n通常，你通过使用样式为类设置模板。这仅涉及以如下方式提供用于 `Template`\
  \ 属性的控件：\n\n```xml\n <Button>\n  Click me!\n  <Button.Style>\n    <Style TargetType=\"\
  Button\">\n      <Setter Property=\"Template\">\n        <Setter.Value>\n      \
  \    <ControlTemplate TargetType=\"Button\">\n            …\n          </ControlTemplate>\n\
  \        </Setter.Value>\n      </Setter>\n    </Style>\n  </Button.Style>\n</Button>\n\
  ```\n\n某些控件可能需要多个模板。例如，`CheckBox` 控件使用一个模板用于复选框（`CheckBox.Template`），使用另一个模板在复选框旁边输出文本（`CheckBox.ContentTemplate`）。\n\
  \n允许你更改控件内容的模板可以通过在你想要输出内容的位置包含一个 `ContentPresenter` 来实现\n\n在上一章中，你开发了三个外观和感受相似的对话框。对话框的共同元素之一是页头，你在其中更改了每个对话框中标签的文本。你可以将该页头定义为一个标签，在下次“尝试”中，你将开发一个新的\
  \ `Label` 样式并使用它来替换四个对话框中的页头。\n\n### 触发器 (Triggers)\n\nWPF 中的事件可以包含各种内容，包括按钮点击、应用程序启动和关闭事件等。WPF\
  \ 使用几种类型的触发器来提供事件等的功能，所有触发器都继承自基类 `TriggerBase`。其中一种触发器是 `EventTrigger` 类，它包含一个动作集合，每个动作都是派生自基类\
  \ `TriggerAction` 的对象。当触发器激活时，就会执行这些动作。\n\n你可以使用 `EventTrigger` 通过 `BeginStoryboard`\
  \ 动作触发动画，使用 `ControllableStoryboardAction` 操作故事板，并通过 `SoundPlayerAction` 触发音效。\n\
  \n每个控件都有 `Triggers` 属性，你可以用它直接在控件上定义触发器。你还可以在层级更高的地方定义触发器——例如，在 `Window` 对象上。当你为控件设置样式时最常用的触发器类型是\
  \ `Trigger`（尽管你仍然会使用 `EventTrigger` 来触发控件动画）。`Trigger` 类用于响应其他属性的变化来设置属性，在在 `Style`\
  \ 对象中使用时特别有用。\n\n触发器对象的配置如下：\n\n*   要定义 `Trigger` 对象监控哪个属性，你使用 `Trigger.Property`\
  \ 属性。\n*   要定义 `Trigger` 对象在何时激活，你设置 `Trigger.Value` 属性。\n*   要定义由 `Trigger` 采取的动作，你将\
  \ `Trigger.Setters` 属性设置为 `Setter` 对象的集合。\n\n这里提到的 `Setter` 对象与你之前在“样式”部分看到的对象完全相同。\n\
  \n下面的代码展示了你在 `Style` 对象中使用的 `Trigger`：\n\n```xml\n <Style TargetType=\"Button\"\
  >\n  <Style.Triggers>\n    <Trigger Property=\"IsMouseOver\" Value=\"true\">\n \
  \     <Setter Property=\"Foreground\" Value=\"Yellow\"/>\n    </Trigger>\n  </Style.Triggers>\n\
  </Style>\n```\n\n当 `Button.IsMouseOver` 属性为 `true` 时，此代码会将 `Button` 控件的 `Foreground`\
  \ 属性更改为 `Yellow`。`IsMouseOver` 是非常有用的属性之一，你可以用它作为快捷来获取有关控件和控件状态的信息。正如名称所示，如果鼠标悬停在控件上，它为\
  \ `true`。这允许你编写处理鼠标悬停的代码。其他类似的属性包括 `IsFocused`（用于判断控件是否具有焦点）、`IsHitTestVisible`（指示是否可以点击控件，即它未被上层的控件遮挡）以及\
  \ `IsPressed`（指示按钮是否被按下）。最后一种属性仅适用于继承自 `ButtonBase` 的按钮，而其他属性适用于所有控件。\n\n你还可以通过使用\
  \ `ControlTemplate.Triggers` 属性来实现很多功能，该属性允许你创建包含触发器的模板。这就是默认 `Button` 模板能够响应鼠标悬停、点击和焦点变化的方式。这也是你自己实现此类功能时必须修改的地方。\n\
  \n### 动画 (Animations)\n\n动画是通过使用故事板（storyboards）创建的。定义复杂动画的最佳方法是使用 Expression Blend\
  \ 等设计工具。然而，你也可以通过编辑 XAML 代码和 C# 代码来定义它们。\n\nWPF 中的动画是使用名为 `Storyboard` 的对象定义的。使用故事板，你可以动画属性的值——例如按钮的背景颜色。非常重要的一点是，你可以以这种方式动画几乎任何属性，而不只是影响控件显示的属性。\n\
  \n故事板可以单独定义在 `Resource Dictionary` 中，也可以通过事件触发器的 `BeginStoryboard` 属性定义在控件内部。在故事板内部，你定义了一个或多个动画，或时间轴。\n\
  \n\n\n\n\n```xml\n <Button Content=\"Animation\" HorizontalAlignment=\"Left\" Margin=\"\
  197,63,0,0\" \n                                                VerticalAlignment=\"\
  Top\" Width=\"75\">\n            <Button.Triggers>\n                <EventTrigger\
  \ RoutedEvent=\"Button.MouseEnter\">\n                    <BeginStoryboard>\n  \
  \                      <Storyboard>\n                            <ColorAnimation\
  \ To=\"Yellow\" \n                                    Storyboard.TargetProperty=\"\
  (Button.Foreground)\n                                                         .(SolidColorBrush.Color)\"\
  \n                                    FillBehavior=\"HoldEnd\" \n              \
  \                      Duration=\"0:0:1\" AutoReverse=\"False\"/>\n            \
  \            </Storyboard>\n                    </BeginStoryboard>\n           \
  \     </EventTrigger>\n                <EventTrigger RoutedEvent=\"Button.MouseLeave\"\
  >\n                    <BeginStoryboard>\n                        <Storyboard>\n\
  \                            <ColorAnimation To=\"Black\" \n                   \
  \                 Storyboard.TargetProperty=\"(Button.Foreground)\n            \
  \                                             .(SolidColorBrush.Color)\"\n     \
  \                               FillBehavior=\"HoldEnd\" \n                    \
  \                Duration=\"0:0:1\"/>\n                        </Storyboard>\n \
  \                   </BeginStoryboard>\n                </EventTrigger>\n      \
  \      </Button.Triggers>\n        </Button> \n```\n\n`Button` 包含两个触发器，一个用于 `MouseEnter`，另一个用于\
  \ `MouseLeave`。每个触发器都包含一个 `ColorAnimation`，分别将文本的前景色颜色改为黄色和黑色。使用 `Trigger` 直接设置\
  \ `Foreground` 属性与使用 storyboard 的区别在于细节：使用 storyboard 可以让你获得一个持续 1 秒的平滑过渡效果，而当你直接设置属性时，变化是瞬间发生的。这两者都是非常有价值的工具，应该在适当的情况下使用——过多的动画可能会让用户感到厌，但几个位置恰当的动画可以让应用程序看起来惊艳。\n\
  \n# WPF 控件\n\n图形卡牌游戏的一个关键特性是……卡牌。显然，你不会在 WPF 自带的标准控件中找到“扑克牌”控件，因此你必须自己创建它。\n\nWPF\
  \ 提供了一组在很多情况下都用的控件。然而，与所有的 .NET 开发框架一样，它也允许你扩展这些功能。具体来说，你可以通过从 WPF 类层次结构中的类派生来创建你自己的控件。\n\
  \n你可以派生的最实用的控件之一是 `UserControl`。该类为你提供了你可能需要的 WPF 控件所需的所有基本功能，并使你的控件能够无缝地接入现有的 WPF\
  \ 控件套件。你希望通过 WPF 控件实现的所有内容——如动画、样式和模板——都可以通过用户控件来实现。\n\n你可以通过项目 ![image](img/Image00008.gif)\
  \ 添加用户控件菜单项将用户控件添加到你的项目中。这为你提供了一个空白的画布（实际上是一个空白的 `Grid`）供你工作。用户控件使用 XAML 中的顶层 `UserControl`\
  \ 元素定义，后台代码中的类派生自 `System.Windows.Controls.UserControl` 类。\n\n一旦你向项目中添加了用户控件，你就可以添加控件来布局视觉外观，并使用后台代码来配置控件。完成后，你可以在整个应用程序中使用它，甚至可以在其他应用程序中复用它。\n\
  \n创建用户控件时需要知道的关键点之一是如何实现依赖属性。第 14 章 简要讨论过这种属性，现在你已经越来越接近编写自己的控件了，是时候仔细了解一下它们了。\n\
  \n## 实现依赖属性\n\n你可以向任何继承自 `System.Windows.DependencyObject` 的类添加依赖属性。该类位于 WPF 中许多类的继承层次结构中，包括所有的控件和\
  \ `UserControl`。\n\n要向类实现依赖属性，你需要在类定义中添加一个类型为 `System.Windows.DependencyProperty`\
  \ 的公共静态成员。该成员的名称由你决定，但最佳实践是遵循命名约定 `<PropertyName>Property`：\n\n```cs\n public static\
  \ DependencyProperty MyStringProperty; \n```\n\n该属性被定义为静态的看起来可能很奇怪，因为你最终得到的是一个可以为你的类的每个实例唯一定义的属性。WPF\
  \ 属性框架会为你跟踪这些事务，所以你暂时不需要担心这个。\n\n你添加的成员必须通过使用静态的 `DependencyProperty.Register()`\
  \ 方法进行配置：\n\n```cs\n public static DependencyProperty MyStringProperty =\n\n   DependencyProperty.Register(…);\
  \ \n```\n\n该方法接受三个到五个参数，如 表 15-1 所示（这些参数按顺序显示，前三个参数是强制性的）。\n\n| 参数 | 用法 |\n| ---\
  \ | --- |\n| `string name` | 属性的名称 |\n| `Type propertyType` | 属性的类型 |\n| `Type ownerType`\
  \ | 包含属性的类的类型 |\n| `PropertyMetadata` `typeMetadata` | 额外的属性设置：属性的默认值以及用于属性更改通知和强制转换的回调方法\
  \ |\n| `ValidateValueCallback` `validateValueCallback` | 用于验证属性值的回调方法 |\n\n**表 15-1：**\
  \ `Register( )` 方法的参数\n\n例如，你可以使用三个参数注册 `MyStringProperty` 依赖属性：\n\n```cs\n public\
  \ class MyClass : DependencyObject\n\n{\n   public static DependencyProperty MyStringProperty=DependencyProperty.Register(\n\
  \n      \"MyString\",\n\n      typeof(string),\n\n      typeof(MyClass));\n\n} \n\
  ```\n\n你还可以包含一个可以直接访问依赖属性的 .NET 属性（尽管这不是强制要求的，很快就会看到）。然而，由于依赖属性被定义为静态成员，你不能使用与普通属性相同的语法。要访问依赖属性的值，你必须使用继承自\
  \ `DependencyObject` 的方法，如下：\n\n```cs\n public string MyString\n\n    {\n      \
  \  get { return (string)GetValue(MyStringProperty); }\n\n        set { SetValue(MyStringProperty,\
  \ value); }\n    } \n```\n\n在这里，`GetValue()` 和 `SetValue()` 方法分别获取和设置当前实例的 `MyStringProperty`\
  \ 属性的值。这两个方法是公共的，因此客户端代码可以直接使用它们来操作依赖属性值。这就是为什么添加访问依赖属性的 .NET 属性不是强制要求的。\n\n如果你想为属性设置元数据，则必须使用派生自\
  \ `PropertyMetadata` 的对象（例如 `FrameworkPropertyMetadata`），并将此实例作为第四个参数传递给 `Register()`。`FrameworkPropertyMetadata`\
  \ 构造函数有 11 个重载，它们接受一个或多个如 表 15-2 所示的参数。\n\n| 参数类型 | 用法 |\n| --- | --- |\n| `object`\
  \ `defaultValue` | 属性的默认值。 |\n\n\n\n\n\n| `FrameworkPropertyMetadataOptions` | `flags`\
  \ | 标志（来自 `FrameworkPropertyMetadataOptions` 枚举）的组合，可以使用它为属性指定额外的元数据。例如，您可以使用 `AffectsArrange`\
  \ 来声明属性的更改可能会影响控件布局。这将导致窗口的布局引擎在属性更改时重新计算控件布局。请参阅 MSDN 文档获取此处可用选项的列表。 |\n| `PropertyChangedCallback`\
  \ | `propertyChangedCallback` | 当属性值更改时使用的回调方法。 |\n| `CoerceValueCallback` | `coerceValueCallback`\
  \ | 当属性值被强制转换时使用的回调方法。 |\n| `bool` | `isAnimationProhibited` | 指定此属性是否可以通过动画进行更改。\
  \ |\n| `UpdateSourceTrigger` | `defaultUpdateSourceTrigger` | 当属性值进行数据绑定时，此属性根据\
  \ `UpdateSourceTrigger` 枚举中的值决定更新数据源的时机。默认值为 `PropertyChanged`，这意味着只要属性发生变化，绑定源就会更新。这并不总是合适的——例如，`TextBox.Text`\
  \ 属性在此属性上使用了 `LostFocus` 值。这确保了绑定源不会过早更新。您还可以使用 `Explicit` 值来指定仅在请求时（通过调用派自 `DependencyObject`\
  \ 的类的 `UpdateSource()` 方法）更新绑定源。 |\n\n**表 15‐2:** FrameworkPropertyMetadata 构造函数的重载\n\
  \n使用 `FrameworkPropertyMetadata` 的简单示例是使用它来设置属性的默认值：\n\n```cpp\npublic static DependencyProperty\
  \ MyStringProperty = \n         DependencyProperty.Register(\n         \"MyString\"\
  ,\n         typeof(string),\n         typeof(MyClass),\n         new FrameworkPropertyMetadata(\"\
  Default value\"));\n```\n\n到目前为止，您已经学习了三个指定的回调方法，用于属性更改通知、属性强制转换和属性值验证。这些回调与依赖属性本身一样，必须全部实现为公共静态方法。每个回调都有特定的返回类型和参数列表，您必须在回调方法中使用它们。\n\
  \n现在是时候回到正轨，继续开发 Karli Cards 的游戏客户端了。在接下来的“尝试一试”中，您将创建一个可以表示应用程序中扑克牌的用户控件。\n\n#\
  \ 主窗口\n\n应用程序的主窗口是玩游戏的地方，因此它上只有几个控件。您将在此部分构建游戏，但在开始之前，有几件事需要处理。您需要为游戏客户端窗口添加菜单，并将您已经构建的窗口绑定到菜单项。\n\
  \n### 菜单控件\n\n大多数应用程序都包含某种类型的菜单和工具栏。两者都是实现同一个目的的手段：提供应用程序内容的便捷导航。工具栏通常包含菜单提供的相同条目的子集，并可以被视为菜单项的快捷方式。\n\
  \nVisual Studio 同时带了 `Menu` 和 `Toolbar` 控件。这里的示例显示了 `Menu` 控件的使用，但使用 `Toolbar` 的方法非常相似。\n\
  \n默认情况下，菜单项以水平条的形式出现，您可以从这里下拉项目列表。该控件是一个 `Items` 控件，因此可以更改内容包含的默认项目；但是，您通常会以某种形式使用\
  \ `MenuItems`，如下例所示。每个 `MenuItem` 都可以包含其他菜单项，您可以通过相互嵌套 `MenuItems` 来构建复杂的菜单，但您应该尽量保持菜单结构尽可能简单。\n\
  \n您可以使用多个属性来控制 `MenuItem` 的显示方式（参见 表 15‐3）。\n\n| PROPERTY | DESCRIPTION |\n| ---\
  \ | --- |\n| `Icon` | 在控件左侧显示图标 |\n| `IsCheckable` | 在控件左侧显示一个 `CheckBox` |\n| `IsChecked`\
  \ | 获取或设置 `MenuItem` 上 `CheckBox` 的值 |\n\n**表 15‐3:** 显示 MenuItem 属性\n\n### 带有菜单的路由命令\n\
  \n*路由命令*在第 14 章中简要讨论过，但现在您将第一次看到它的运行。记住，这些命令与事件类似，因为它们在用户执行操作时执行代码，并且它们可以返回一个指示在任何给定时间是否可以执行的状态。\n\
  \n至少有三个原因让您可能想使用路由命令而不是事件：\n\n1. 引起事件发生的操作可以从应用程序的多个位置触发。\n2. UI 元素应该仅在特定条件下可访问，例如，如果没有可保存的内容，则禁用保存按钮。\n\
  3. 您希望将处理事件的代码与后台代码文件分离。\n\n如果这些场景中的任何一个符合您的情况，请考虑使用路由命令。在游戏的情况下，菜单中的某些项也可能可以从工具栏可用。此外，“保存”操作应该只在游戏进行时才可用，并且它可能同时从菜单和工具栏可用。\n\
  \n# 整合一切\n\n在游戏开发的这个阶段，您已经有两个对话框、一个卡牌库和一个提供游戏显示空白区域的主窗口。这仍然留下了大量工作，但由于基础已经打好，现在是时候开始制作游戏了。\n\
  \n### 重构领域模型\n\n如所述，领域模型是描述游戏对象的代码。目前，您在 CardLib 项目中拥有了这些描述游戏对象的类：\n\n*   `Card`\n\
  *   `Deck`\n*   `Rank`\n*   `Suit`\n\n除了这些类之外，游戏还需要一个 `Player` 和 `ComputerPlayer`\
  \ 类，因此您将添加这些类。您还需要稍微修改 `Card` 和 `Deck` 类，以便它们能更好地在 Windows 应用程序中工作。有很多工作要做，让我们让我们开始吧。\n\
  \n### 视图模型 (ViewModel)\n\n视图模型的目的是持有显示显示它的视图的状态。在 Karli Cards 的情况下，这意味着您已经有了一个视图模型类：`GameOptions`\
  \ 类。该类持有 `Options` 和 `StartGame` 窗口的状态。目前，您无法从选项中获取所选的玩家，因此您必须添加该功能。游戏客户端窗口的视图模型是缺失的，所以这是下一个要执行的任务。\n\
  \n执行游戏的视图模型必须反映游戏运行时的所有部分。游戏部分包括：\n\n*   当前玩家从中抽牌的牌组\n*   一张当前玩家可以代替抽牌而获取的牌牌\n*\
  \   当前玩家\n*   若干位参与的玩家\n\n视图模型还应该能够通知观察者更改，这意味着再次实现 `INotifyPropertyChanged`。\n\n\
  除了这些功能外，视图模型还应该提供一种启动新游戏的方法。您将通过为菜单创建一个新的路由命令来实现这一点。该命令创建在视图模型中，但从视图中调用。\n\n###\
  \ 完成游戏\n\n\n\n\n你现在有了一个完整的游戏，但你无法运行，因为游戏客户端中没有显示任何内容。为了让游戏运行，你需要两个额外的用户控件并通过停靠面板（dock\
  \ panel）放置在游戏客户端上。\n\n这两个用户控件分别被称为 `CardsInHand`（显示玩家手牌）和 `GameDecks`（显示主牌堆和可用卡牌）。\n\
