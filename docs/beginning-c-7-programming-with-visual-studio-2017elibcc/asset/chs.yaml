  \ blob、文件或数据的名称。 |\n\n# 17\n\n高级云编程与部署\n\n## 创建 ASP.NET Web API\n\n*应用程序编程接口*（API）这一计算机编程概念已经存在了几十年，它通常被描述为包含一组用于构建软件程序的有用函数的模块。\n\
  \n最初，从 Windows 客户端应用程序的角度来看，这些模块是动态链接库（`.dll`），它们揭示了可以通过程序访问的接口，将内部函数暴露给其他程序。在这样的系统中，当调用程序使用\
  \ API 时，它就依赖于接口的模式。接口的更改会导致调用程序内部出现异常和失败，因为访问和执行模块内函数的当前不再有效。一旦程序依赖于某个接口，就不应该被更改。当发生更改时，这种事件通常被称为“DLL\
  \ 地狱”（DLL Hell）。关于 DLL 地狱的更多信息，请阅读文章：[`http://www.desaware.com/tech/dllhell.aspx`](http://www.desaware.com/tech/dllhell.aspx)。\n\
  \n随着时间的推移，互联网和局域网解决方案成为主流，对 Web 服务和 Windows Communication Foundation (WCF) 等技术的依赖产生了。Web\
  \ 服务和 WCF 都暴露了正式的接口，将它们包含的函数暴露给其他程序。与之前提到的位于调用程序所在同一台计算机上的 DLL API 相比，Web 服务和 WCF\
  \ 托管在 Web 服务器上。由于托管在互联网或局域网 Web 服务器上，对 Web 接口的访问不再限于单台计算机，可以在任何连接互联网或网络局域网的设备上进行访问。\n\
  \n回顾上一章对云优化栈的分析。从该讨论中，你了解到为了被认为是*云优化*，程序必须具有较小的占用、能够处理高吞吐量并且支持跨平台。ASP.NET Web API\
  \ 基于 ASP.NET MVC（模型、视图、控制器）概念，这直接对应于新的云优化栈定义。如果你过去创建过或使用过 Web 服务或 WCF，你将发现 ASP.NET\
  \ Web API 比它们要简单且紧凑得多。如果你从未用过任何一种，听我的：它确实如此。\n\n在接下来的“尝试一下”中，你将创建一个发牌的 ASP.NET Web\
  \ API。\n\n\n\n\n有许多选项可以将 Web App 部署到 Microsoft Azure 平台。最流行的方法之一是通过本地 Git 仓库或托管在\
  \ GitHub 上的公共 Git 仓库。本地和公共 Git 仓库都提供了版本控制功能，这是一项非常有用的特性。通过版本控制，开发者和发布经理可以了解哪些具体的更改、何时修改的以及由谁修改的。如果在编译二进制文件或将更改部署到活动环境时出现问题或意外异常，很容易找到应该联系联系人。其他可以集成到\
  \ Microsoft Azure 的部署平台包括 Visual Studio Team Services、`OneDrive` 和 `Bitbucket` 等。\n\
  \n由于上一个“尝试一试”（Try It Out）中的代码是一个未包含在版本控制仓库中的独立项目，因此部署是直接在 IDE 内部执行的（例中为 Visual Studio\
  \ 2017）。部署未包含在源代码仓库中的解决方案的其他方法还包括：Web Deploy（`msdeploy.exe`）和 FTP。\n\n完成以下“尝试一试”（Try\
  \ It Out），将 ASP.NET Web API 部署到 Microsoft Azure Web App。\n\n现在，ASP.NET Web API 已经部署，任何具有发送\
  \ HTTP 请求和解析 JSON 文件能力的客户端都可以进行调用。接下来的“尝试一试”提供了所需的所有指令，教你如何从 ASP.NET 网页调用刚刚发布的 ASP.NET\
  \ Web API。\n\n你可以考虑使用从上一个“尝试一试”中获得的知识，将此 ASP.NET 网站部署到 Microsoft Azure 平台。例如，只需右键点击\
  \ `Ch17Ex02` 解决方案，选择 `Publish Web App` 并按照发布向导操作。创建一个名为 `handofcards-consumer` 的\
  \ Web App 后，可以通过 `http://handofcards-consumer.azurewebsites.net/` 进行访问。由于 ASP.NET\
  \ Web API 和 Microsoft Azure Blob Container 都从世界任何地方通过互联网访问，将 ASP.NET 网站放置在 Azure\
  \ 上将获得相同的结果（获得手牌）。\n\n随着时间的推移，如果消费者或 API 变得流行并开始接收大量请求，在 FREE 模式下运行 Web Apps 可能导致资源阈值突破，从而暂停可用可用。这并不理想。在下一节中，你将学习如何对\
  \ Microsoft Azure 平台上的作为 Web App 运行的 ASP.NET Web API 进行扩展，以便用户和客户在需要时访问你的响应式网络资源。\n\
  \n## 在 MICROSOFT AZURE 上扩展 ASP.NET WEB API\n\n扩展以满足用户需求曾是一项非常繁琐、耗时且昂贵的活动。在历史上，当公司想要增加服务器容量以支持更多流量时，需要向数据中心采购、组装和配置物理硬件。然后，一旦硬件连接到网络，就会交由应用程序所有者，让他们安装和配置操作系统、所需的组件以及应用程序源代码。执行此类任务所需的时间导致公司安装了大量的物理容量以管理峰值使用；然而，在非峰值期间，额外的容量完全没有被使用并闲置，这非常昂贵且非优的资源分配方式。\n\
  \n更好的方法是使用像 Microsoft Azure 这样的云平台，这些平台提供了在需要资源时优化利用物理资源进行向上、向下和向外扩展的能力。当你需要如 `CPU`、磁盘空间或内存等物理资源时，你可以向上或向外扩展以满足需求；当对你的云托管服务的需求减少时，你可以向下缩小，并节省你的财务资源用于其他项目和服务。\n\
  \n本章的剩余部分将说明如何根据 `CPU` 需求在特定时间段内扩展 ASP.NET Web API。\n\n自动扩展功能对于管理 Web App 的意外使用峰值和请求非常有用。然而，如果你已经知道客户或用户何时与你的\
  \ Web App 交互，你可以提前计划，并在实际需要之前稍早准备好额外的实例。这样做的处是，不需要根据 `CPU` 使用情况逐渐增加或减少实例，而是可以立即扩展到在该特定时间段内所需的\
  \ `CPUs` 数量和内存量。例如，如果你知道你的营销部门在 10 月份运行一项活动，你可以安排额外资源在该月期间可用。通过让所需的资源就绪并预热，你可以避免在为用户或客户分配资源时出现任何延迟。执行以下“尝试一试”中描述的步骤查看如何操作。\n\
  \n当你为扩展 Web App 创建计划时，需要名称、开始日期、开始时间、结束日期和结束时间。通过这些信息，Microsoft Azure 平台会管理可用实例的数量，这些实例是在配置的时间段内为你的\
  \ Web App 提供服务的虚拟虚拟机。你可以创建许多计划，每个计划都有自己的实例数量和扩展设置。只需创建计划并保存它，在需要时从计划下拉菜单中选择它，资源将如预期般可用。\n\
