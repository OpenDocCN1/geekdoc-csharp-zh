  \ |\n\n# 第三部分\n\n## 云计算与跨平台编程\n\n* 第 16 章：基础云编程\n* 第 17 章：高级云编程与部署\n* 第 18 章：.NET\
  \ Standard 和 .NET Core\n* 第 19 章：ASP.NET 和 ASP.NET Core\n\n# 16\n\n## 基础云编程\n\n\
  ### 云、云计算与云优化技术栈\n\n开始创建完全或部分在云端运行的应用程序只是时间问题。这不再是“是否”的问题，而是“何时”的问题。决定程序的哪些组件将在将在云端运行、云的类型以及云服务模型，需要一些调查、理解和规划。首先，你需要明确什么是云。云简单来说运行在数据中心内部的大量商品化计算机硬件，它可以运行程序并存储大量数据。其区别在于**弹性**（elasticity），即动态向上扩展（例如增加\
  \ CPU 和内存）和/或水平扩展（例如增加虚拟服务器实例的数量）的能力，然后以极小或无需努力缩回。这与当前的 IT 运营格局有巨大的区别，在当前的格局中，差异化的计算机资源往往在公司的一个区域部分或完全处于闲置，而在其他区域又严重缺乏计算机资源。云通过在你需要时提供计算机资源的访问来解决这个问题，而当你不需要它们时，这些资源就会提供给其他人。对于个人开发者来说，云是一个部署你的程序并将其向世界展示的地方。如果程序碰好变得流行，你可以扩展以满足你的资源需求；如果程序一失败了，那么你不会在设置专用计算机硬件和基础设施上花费大量金钱或时间。\n\
  \n让我们更详细地探讨云类型和云服务模型。常见的云类型有公有云、私有云和混合云，在下面的要点中进行了描述，并在图 16-1 中进行了说明。\n\n* **公有云\
  \ (Public cloud)**是由 Microsoft Azure、Amazon AWS、Rackspace 或 IBM Cloud 等云提供商拥有并运营的共享计算机硬件和基础设施。这种云类型对于需要管理客户和用户需求波动的中小企业非常理想。\n\
  \n* **私有云 (Private cloud)**是存在于现场或外包数据中心的专用计算机硬件和基础设施。这种云类型对于大型公司或必须交付更高水平数据安全或政府合规性的公司非常理想。\n\
  \n* **混合云 (Hybrid cloud)**是公有云和私有云类型的组合，你可以选择 IT 解决方案的哪些部分在私有云上运行，哪些部分在公有云上运行。理想的解决方案是将需要更高安全业务关键程序运行在私有云中，并将非敏感的、可能突发的任务运行在公有云中。\n\
  \n![描述常见云类型的图示说明：公有云、私有云和混合云。](img/Image00191.jpg)\n\n图 16-1\n\n云服务模型的数量在不断增加，但最常见的云服务模型在下面的要点中进行了描述，并在图\
  \ 16-2 中进行了说明。\n\n![描述一些常见云服务模型的图示说明。](img/Image00192.jpg)\n\n图 16-2\n\n* **基础设施即服务\
  \ (IaaS)** ——你负责从操作系统及以上的部分。你不负责硬件或网络基础设施；然而，你负责操作系统补丁和第三方依赖库。\n\n* **平台即服务 (PaaS)**\
  \ ——你仅负责运行在所选操作系统上的你的程序及其依赖项。你不负责操作系统的维护、硬件或网络基础设施。\n\n* **软件即服务 (SaaS)** ——从通过\
  \ Internet 的设备使用的软件程序或服务。例如，O365、Salesforce、OneDrive 或 Box，所有这些都可以从任何有 Internet\
  \ 连接的地方访问，且不需要在客户端上安装软件即可运行。你只负责运行在平台上的软件，不负责其他任何内容。\n\n总结，云是用于运行程序的商品化硬件的弹性结构。这些程序运行在混合云、公有云或私有云类型，以及\
  \ IaaS、PaaS 或 SaaS 服务模型上。\n\n云编程是在任何云服务模型上运行的代码逻辑开发。云程序应该包含移植性、可扩展性和恢复性模式，以提高程序的性能和稳定性。没有实现这些移植性、可扩展性和恢复性模式的程序可能会在云中运行，但某些情况（如硬件故障或网络延迟问题）可能会导致程序执行意外的代码路径并终止。\n\
  \n\n\n\n回顾云的扩展性作为其最有利的优势之一，不仅平台能够扩展，云程序同样如此，这一点至关重要。例如，代码是否依赖于后端资源、数据库、读取或打开文件，或者解析大型数据对象？云程序中的此类功能性操作可能会降低其扩展能力，从而导致对吞吐量的支持度较低。确保你的云程序管理了执行长时间运行方法的代码路径，并可能将它们放入离线处理机制中。\n\
  \n云优化堆栈（cloud optimized stack）是一个概念，用于指能够处理高吞吐量、具有小资源占用（small footprint）、能够在同一台服务器上与其他应用程序并排运行并且支持跨平台的代码。`small\
  \ footprint` 指的是在你的云程序中仅打包存在依赖项的组件，从而使部署大小尽可能小。考虑你的云程序是否需要整个 `.NET Framework` 才能运行。如果不需要，那么不要打包整个\
  \ `.NET Framework`，而是仅包含运行云程序所需的库，然后将你的云程序编译为自包含应用程序（self-contained application）以支持并排执行。云程序可以与任何其他云程序一起运行，因为它在二进制包内部包含了所需的依赖项。最后，通过使用\
  \ `Mono`、`.NET Core` 或 `ASP.NET Core` 的开源版本，云程序可以打包、编译并部署到微软以外的操作系统上——例如 Mac OS\
  \ X、iOS 或 Linux。\n\n## 云模式与最佳实践\n\n在云中，短暂的延迟增加或停机是预料之中的，你的代码必须为此做好准备，并包含逻辑以从这些平台异常中成功恢复。如果你以前一直是为现场（ons）或本地执行程序编写代码，那么这是一个重大的观念转变。你需要忘记许多你已知的关于管理异常的知识，并学会接受失败，创建你的代码以从此类失败中恢复。\n\
  \n在上一节中，可移植性（portability）、可扩展性（scalability）和韧性（resiliency）等词已经在将这些概念集成到计划在云中运行程序的范围内有所提及。但\
  \ `portability` 在这里具体意味着什么？如果一个程序可以移动或在多个平台（例如 Windows、Linux 和 Mac OS X）上执行，那么它就是可移植的。以某些\
  \ `ASP.NET Core` 特性为例，它们构建在新的开源技术栈之上，为开发者提供了选项，可以将代码编译为能够在任何一个平台上运行的二进制文件。传统上，一个使用\
  \ `ASP.NET` 并以 `C#` 为背景编写程序的开发者会在 Windows 服务器上使用 Internet 信息服务器 (`IIS`) 运行它。然而，从核心以云为中心的视角来看，你的程序及其所有依赖项在没有手动或程序干预的情况下从一个虚拟机移动到另一个虚拟机的能力，是这种背景下最适用于移植性形式。记住，云中的失败是预料之中的，运行你程序的虚拟机（`VM`）可能在任何时候被擦除，然后在另一个\
  \ `VM` 上重新构建。因此，你的程序需要是可移植的，并能够从此类事件中恢复。\n\n`Scalability` 意味着你的代码在多个客户使用时能够良好响应。例如，如果你每分钟有\
  \ 1,500 次请求，如果请求在 1 秒内完成并响应，那么大约是每秒 25 次并发请求。然而，如果你每分钟有 15,000 次请求，意味着每秒 250 次并发请求。云程序会在\
  \ 25 个或 250 个并发请求时以相同的方式响应吗？2,550 个呢？以下是一些对管理扩展性有效的云编程模式：\n\n*   **命令和查询职责分离 (CQRS)\
  \ 模式** ——此模式涉及读取数据的操作与修改或更新数据的操作分离。\n*   **物化视图模式 (Materialized View pattern)**\
  \ —— 它修改存储结构以反映数据查询模式。例如，为特定的高频查询创建视图可以实现更高效的查询。\n*   **分片模式 (Sharding pattern)**\
  \ —— 它将你的数据拆分为多个水平分片，每个分片包含独特的数据子集，而不是通过增加硬件容量进行垂直扩展。\n*   **管家密钥模式 (Valet Key pattern)**\
  \ —— 这允许客户端直接访问数据存储，以流传输或上传大文件。而不是让 Web 客户端管理数据存储的门禁，而是为客户端提供一个 `Valet Key` 并直接访问数据存储。\n\
  \n`Resiliency` 指你的程序对服务故障和异常的响应及恢复能力。从历史上看，IT Infrastructure 一直关注故障预防，对停机的接受度最低，且\
  \ 99.99% 或 99.999% 的 SLA（服务水平协议）是预期。然而，在云中运行程序需要可靠性的观念转变，一种接受失败并明确面向恢复而非预防的观念。拥有数据库、存储、网络和第三方服务等多个依赖项（其中某些项没有\
  \ SLA）需要这种视角的转变。对于停机或不被视为正常运行的情况，提供友好的响应可以使你的云程序具有韧性。以下是一些有助于将韧性嵌入你的云程序中的有效云编程模式：\n\
  \n*   **断路器模式 (Circuit Breaker pattern)** —— 这是一种代码设计，能够感知远程服务的状态，并且仅在服务可用时才尝试建立连接。这避免了在通过之前的故障已知远程服务不可用的情况下仍尝试尝试请求并浪费\
  \ CPU 周期。\n*   **健康端点监控模式 (Health Endpoint Monitoring pattern)** —— 它通过实现端点监控检查云应用程序在功能上是可用的。\n\
  *   **重试模式 (Retry pattern)** —— 在瞬态异常或失败后重试请求。该模式在给定的时间内重试多次，并在超过重试尝试阈值时停止。\n* \
  \  **节流模式 (Throttling pattern)** —— 它管理云程序的消耗，以满足 SLA 并确保程序在高负载下保持功能。\n\n使用本节描述的一个或多个模式将帮助你的云迁移更加成功。\n\
  \n## 使用 MICROSOFT AZURE C# 库创建存储容器\n\n尽管有许多云提供商，本节和下一节示例使用的云提供商是微软。微软提供的云平台是 `Azure`。`Azure`\
  \ 有许多不同的功能。例如，IaaS 供给被称为 `Azure VM`，PaaS 供给被称为 `Azure Cloud Services`。此外，微软拥有用于数据库的\
  \ `SQL Azure`、用于用户身份验证的 `Azure Active Directory` 以及用于存储 blob 的 `Azure Storage`。\n\
  \n以下两个练习介绍了如何创建 Azure 存储账户和 Azure 存储容器。\n\n\n\n\n既然 Microsoft Azure 存储账户和容器已经创建，并加载了\
  \ 52 张扑克牌镜像，现在你可以创建一个 ASP.NET 网站来引用该 Microsoft Azure 存储容器。\n\n## 创建使用存储容器的 ASP.NET\
  \ 4.7 网站\n\n到目前为止，还没有对什么是 Web 应用程序进行深入检查，也没有对 ASP.NET 的基本方面进行过讨论。本节将对这些技术视角提供一些见解。\n\
  \nWeb 应用程序会导致 Web 服务器向客户端发送 HTML 代码。这些代码显示在 Microsoft Edge 或 Google Chrome 等网络浏览器中。当用户在浏览器中输入\
  \ URL 字符串时，会向 Web 服务器发送一个 HTTP 请求。HTTP 请求包含所请求的文件名以及其他信息，如标识应用程序的字符串、客户端支持的语言以及属于请求的额外数据。Web\
  \ 服务器返回一个包含 HTML 代码的 HTTP 响应，网络浏览器解释这些代码并向用户显示文本框、按钮和列表。\n\nASP.NET 是一项用于服务器端代码动态创建网页的技术。这些网页的开发方式与客户端\
  \ Windows 程序有许多相似之处。你不需要直接处理 HTTP 请求和响应，并手动创建 HTML 代码发送给客户端，而是可以使用如 `TextBox`、`Label`、`ComboBox`\
  \ 和 `Calendar` 等控件，它们会生成 HTML 代码。\n\n在客户端系统使用 ASP.NET 开发 Web 应用程序只需要简单的网络浏览器。你可以使用\
  \ Internet Explorer、Edge、Chrome、Firefox 或任何支持 HTML 的浏览器。客户端系统不需要安装 .NET。\n\n在服务器系统上，需要\
  \ ASP.NET 运行时。如果你在系统中安装了 Internet 信息服务 (IIS)，在安装 .NET Framework 时，ASP.NET 运行时就会配置在服务器上。在开发期间，不需要处理\
  \ Internet 信息服务，因为 Visual Studio 提供了了自己的 ASP.NET Web 开发服务器，你可以用它来测试和调试应用程序。\n\n\
  要理解 ASP.NET 运行时是如何运行的，请考虑来自浏览器的典型 Web 请求（参见图 16-11）。客户端从服务器请求一个文件，例如 `default.aspx`\
  \ 或 `default.cshtml`。ASP.NET Web 表单页面通常具有 `.aspx` 文件扩展名（ASP.NET MVC 没有特定的文件扩展名），而\
  \ `.cshtml` 用于基于 Razor 的网站。由于这些文件扩展名已在 IIS 中注册或被 ASP.NET Web 开发服务器识别，ASP.NET 运行时和\
  \ ASP.NET 工作进程便进入了场景。IIS 工作进程名为 `w3wp.exe`，它是你在 Web 服务器上应用程序的宿主机。当第一次请求 `default.cshtml`\
  \ 文件时，ASP.NET 解析器启动，编译器将该文件与与 `.cshtml` 文件相关的 C# 代码一起编译成程序集。然后，.NET 运行时的 JIT 编译器将程序集编译为原生代码。接着，`Page`\
  \ 对象被销毁。不过，程序集会被保留用于后续请求，因此没有必要再次编译程序集。\n\n![浏览器的典型 Web 请求示意图。](img/Image00201.jpg)\n\
