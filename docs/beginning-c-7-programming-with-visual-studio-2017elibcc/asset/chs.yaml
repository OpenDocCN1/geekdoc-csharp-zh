  \ 类必须实现 `INotifyPropertyChanged` 接口。\n\n创建一个字段来存储三个属性中每个的值。\n\n在每个属性的设置器（setter）中，实现对\
  \ `PropertyChanged` 事件订阅者的调用。建议为此创建一个名为 `OnPropertyChanged` 的辅助方法。\n\n`PersistentSlider.cs`:\n\
  \n```cs\nusing System.\n\nnamespace Answers\n\n{\n  public class PersistentSlider\
  \ : INotifyPropertyChanged\n\n  {\n    private int _minValue;\n    private int _maxValue;\n\
  \    private int _currentValue;\n\n    public int MinValue\n    {\n      get { return\
  \ _minValue; }\n      set { _minValue = value; OnPropertyChanged(nameof(MinValue));\
  \ }\n    }\n\n    public int MaxValue\n    {\n      get { return _maxValue; }\n\
  \      set { _maxValue = value; OnPropertyChanged(nameof(MaxValue)); }\n    }\n\n\
  \    public int CurrentValue\n    {\n      get { return _currentValue; }\n     \
  \ set { _currentValue = value; OnPropertyChanged(nameof(CurrentValue)); }\n    }\n\
  \n    public event PropertyChangedEventHandler PropertyChanged;\n\n    protected\
  \ void OnPropertyChanged(string propertyName) =>\nPropertyChanged?.Invoke(this,\
  \ new PropertyChangedEventArgs(propertyName));\n  }\n}\n```\n\n1.  在代码后台文件中，添加如下字段：\n\
  \n```cs\nprivate PersistentSlider _sliderData = new PersistentSlider { MinValue\
