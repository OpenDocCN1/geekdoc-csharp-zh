  \ 同样使用 `Newtonsoft` 库实现 JSON 转换为 XML 的按钮（本章所示示例的反向操作）。\n\n练习答案可以在附录中找到。\n\n## ![image](img/Image00002.gif)\
  \ 本章学到的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| XML 基础 | XML 文档由 XML 声明、XML 命名空间、XML\
  \ 元素和属性创建。XML 声明定义 XML 版本。XML 命名空间用于定义词汇，XML 元素和属性用于定义 XML 文档内容。 |\n| JSON 基础 |\
  \ JSON 是一种用于 JavaScript 和 Web 服务的数据语言。JSON 比 XML 更紧凑，但更难阅读。 |\n| XML Schema | XML\
  \ Schema 用于定义 XML 文档的结构。当你需要与第三方交换信息时，Schema 特别有用。通过对交换的数据达成 Schema 一致，你和第三方就可以检查文档是否有效。\
  \ |\n| XML DOM | 文对象模型 (XML DOM) 是提供的创建和操作 XML 的 `.NET Framework` 类的基础。 |\n| JSON\
  \ 包 | 你可以使用如 `Newtonsoft` 之类的 JSON 包将 XML 转换为 JSON 反之亦然，并进行与 `.NET` 的 XML 类相似的其它\
  \ JSON 操作。 |\n| XPath | XPath 是查询 XML 文档中数据的可能方法之一。要使用 XPath，你必须熟悉 XML 文档的结构，以便从中选择单个元素。虽然\
  \ XPath 可以用于任何良好的 XML 文档，但你在创建查询时必须知道文档结构这一事实意味着，确保文档有效也就能确保查询在不同文档之间都能工作，只要这些文档符合相同的\
  \ Schema 即可。 |\n\n# 22 LINQ\n\n## LINQ TO XML\n\nLINQ to XML 是针对 XML 的一组备选类，它允许使用\
  \ LINQ 处理 XML 数据，并且即使在不使用 LINQ 的情况下，也能让某些 XML 操作变得更简单。我们将查看两个特定案例，在这些案例中，LINQ to\
  \ XML 相比上一节引入的 XML DOM（文档对象模型）具有优势。\n\n### LINQ to XML 函数构造函数\n\n虽然你可以使用 XML DOM\
  \ 在代码中创建 XML 文档，但 LINQ to XML 提供了一种更简单的创建 XML 文档的方法，称为“函数式构造”。在函数构造中，构造函数的调用可以嵌套，自然地反映\
  \ XML 文档的结构。在接下来的“尝试用用”中，你使用函数构造函数创建一个包含客户和订单的简单 XML 文档。\n\n### 处理 XML 片段\n\n与 XML\
  \ DOM 不同，LINQ to XML 处理 XML 片段（部分或不完整的 XML 文档）的方式与完整 XML 文档非常相似。在处理片段时，你只需将 `XElement`\
  \ 作为顶层 XML 对象，而不是 `XDocument`。\n\n在接下来的“尝试用用”中，你加载、保存并操作一个 XML 元素及其子节点，就像你处理 XML\
  \ 文档一样。\n\n## LINQ 提供程序\n\nLINQ to XML 只是 `LINQ provider` 的示例之一。Visual Studio 2017\
  \ 和 `.NET Framework` 4.7 带有内置的 LINQ 提供程序，为不同类型的数据提供查询解决方案：\n\n* **LINQ to Objects**\
  \ —提供对任何内存对象（如数组、列表）的查询。上一节中的所有示例都使用了 LINQ to。\n* **LINQ to XML** —正如你刚刚看到的，它使用相同的语法和通用机制提供\
  \ XML 文档的创建和操作。\n* **LINQ to Entities** —`Entity Framework` 是 .NET 最新的类集，受微软推荐。\n\
  * **LINQ to Data Set** — `DataSet` 对象是在 `.NET Framework` 的第一个版本中引入的。这种 LINQ 变体能够轻松查询\
  \ legacyNET 数据。\n* **LINQ to SQL** —这是 LINQ 的替代接口，已被 LINQ to Entities 取代。\n* **PLINQ**\
  \ —PLINQ（并行 LINQ）扩展了 LINQ to Objects 的并行编程库，可以在多内核处理器上分解查询。\n* **LINQ to JSON**\
  \ —包含在上一节使用的 `Newtonsoft` 包中，该库使用相同的语法和机制支持 JSON 文档的创建和操作。\n\n由于有许多 LINQ 变体，在入门书中无法涵盖所有内容，但你将看到的语法和方法适用于所有。接下来让我们查看使用\
  \ LINQ 提供程序的 LINQ 查询语法。\n\n\n\n\n\nLINQ 查询的下一部分是 `from` 子句，它指定了你正在查询的数据：\n\n```\n\
  from n in names \n```\n\n在这种情况下，你的数据源是 `names`，即之前声明的字符串数组。变量 `n` 只是数据源中单个元素的占位符，类似于\
  \ `foreach` 语句后面的变量名。通过指定 `from`，你表示你将要对集合的子集进行*查询*（query），而不是遍历所有元素。\n\n说到迭代，LINQ\
  \ 数据源必须是*可枚举的*（enumerable）——也就是说，它必须是一个数组或项的集合，你可以从中任选一个或多个元素进行迭代。\n\n数据源不能是一个单个值或对象，例如一个单独的\
  \ `int` 变量。你已经拥有了这样一个单项了，所以查询它没有意义！\n\n### 指定条件：where 子句\n\n在 LINQ 查询的下部分中，你使用 `where`\
  \ 子句来指定查询的条件，它的形式如下：\n\n```\nwhere n.StartsWith(\"S\") \n```\n\n任何可以应用于数据源中项的布尔（真或假）表达式都可以指定在\
  \ `where` 子句中。实际上，`where` 子句是可选的，甚至可以省略，但在几乎所有情况下，你都会指定一个 `where` 条件来将结果限制为你所想要的数据。`where`\
  \ 子句在 LINQ 中被称为*限制运算符*（restriction operator），因为它限制了查询的结果。\n\n在这里，你指定名称字符串以字母 S 开头，但也可以指定字符串的任何其他属性——例如长度大于\
  \ 10（`where n.Length > 10`）或包含 Q（`where n.Contains(\"Q\")`）。\n\n### 选择项目：select\
  \ 子句\n\n最后，`select` 子句指定了哪些项出现在结果集中。`select` 子句的形式如下：\n\n```\nselect n \n```\n\n\
  `select` 子句是必须，因为你必须指定查询中的哪些项出现在结果集中。对于这组数据来说，它并不十分有趣，因为结果集的每个元素都只有一个项，即名称。你将看到一些结果集中包含更复杂对象的示例，那时\
  \ `select` 子句的用处将更加明显，但首先你需要完成这个示例。\n\n### 结束：使用 foreach 循环\n\n现在你打印查询的结果。与用作数据源的数组一样，这种\
  \ LINQ 查询的结果也是*可枚举的*，这意味着你可以使用 `foreach` 语句遍历结果：\n\n```\nWriteLine(\"Names beginning\
  \ with S:\");\n\nforeach (var item in queryResults) {\n       WriteLine(item);\n\
  } \n```\n\n在这种情况下，你匹配了五个名称——Smith、Smythe、Small、Singh 和 Samba——所以你在 `foreach` 循环中显示这些内容。\n\
  \n### 延迟查询执行\n\n你可能在想 `foreach` 循环实际上并不是 LINQ 本身的一部分——它只是在遍历你的结果。虽然 `foreach` 结构本身不是\
  \ LINQ 的一部分，但它确实是你代码中实际执行 LINQ 查询的部分！查询结果变量的赋值仅仅保存了一份执行查询的计划；在 LINQ 中，在访问结果之前，数据本身不会被检索。这被称为*延迟查询执行*（deferred\
  \ query execution）或查询的*惰性求*（lazy evaluation）。对于任何产生结果序列（即列表）的查询，执行将被延迟。\n\n回到代码。你已经打印了结果；是时候结束程序了：\n\
  \n```\nWrite(\"Program finished, press Enter/Return to continue:\");\n\nReadLine();\
  \ \n```\n\n这些行只是确保控制台程序的结果留在屏幕上，直到你按下键，即使你按下的是 F5 而不是 Ctrl+F5。你将在大多数其他 LINQ 示例中使用这种结构。\n\
  \n## LINQ 方法语法\n\n正如编程中常见的情况一样， LINQ 有多种方法可以实现相同的功能。如所述，上一个示例是使用 LINQ*查询语法*（query\
  \ syntax）编写的；在下一个示例中，你将使用 LINQ 的*方法语法*（method syntax，也称为*显式语法*，但这里使用了方法语法）编写相同的程序。\n\
  \n### LINQ 扩展方法\n\nLINQ 实现为针对集合、数组、查询结果以及任何实现 `IEnumerable<T>` 接口对象的系列扩展方法。你可以通过\
  \ Visual Studio 的 IntelliSense 功能查看这些方法。例如，在 Visual Studio 2017 中，打开你刚刚完成的 `FirstLINQquery`\
  \ 程序中的 `Program.cs` 文件，并在 `names` 数组下方输入一个新引用：\n\n```\nstring[] names = { \"Alonso\"\
  , \"Zheng\", \"Smith\", \"Jones\", \"Smythe\", \"Small\", \"Ruiz\", \"Hsieh\", \"\
  Jorgenson\", \"Ilyich\", \"Singh\", \"Samba\", \"Fatimah\" };\n\nnames. \n```\n\n\
  当你在 `names` 后面输入点时，你会看到 Visual Studio IntelliSense 功能列出了 `names` 可用的方法。\n\n`Where<T>`\
  \ 方法和大多数其他可用方法都是扩展方法（如 `Where<T>` 方法右侧出现的文档所示，它以 `extension` 开头）。你可以通过注释掉顶部的 `using\
  \ System.Linq` 指令来确认它们是 LINQ 扩展。\n\n### 查询语法与方法语法\n\n查询语法是 LINQ 编程的优选方式，因为它通常更易读且使用更简单。然而，对方法语法有一个基本的了解是非常重要的，因为某些\
  \ LINQ 功能在查询语法中不可用，或者在方法语法中使用起来更简便。在本章中，你将主要使用查询语法，但在需要的地方会指出方法语法。\n\n### Lambda\
  \ 表达式\n\nLambda 表达式是一种在 LINQ 查询中即时创建方法的简单方法。它使用 `=>` 运算符，该运算符声明方法的参数，后面跟着方法逻辑全部在一行内！\n\
  \n例如，考虑以下 Lambda 表达式：\n\n`n => n < 0`\n\n这声明了一个带名为 `n` 的参数的方法。如果 `n` 小于 0，方法返回*true*，否则返回*false*。这非常简单。你不需要想方法名称，不需要写返回语句，也不需要用大括号包裹代码。\n\
  \n返回这样的真/假值对于用于 LINQ 的方法来说是典型的，但也不非这样做。例如，这里有一个返回两个变量之和方法的 Lambda。此 Lambda 使用了多个参数：\n\
  \n`(a, b) => a + b`\n\n这声明了一个有两个名为 `a` 和 `b` 的参数的方法。方法逻辑返回 `a` 和 `b` 之和。你不需要声明 `a`\
  \ 和 `b` 的类型。它们可以是 int、double 或 string。C# 编译器会推断这些类型。\n\n最后，考虑这个 Lambda 表达式：\n\n\
  `n => n.StartsWith(\"S\")`\n\n如果 `n` 以字母 S 开头，该方法返回*true*，否则返回*false*。在实际程序中尝试这种操作以更清楚地看到它。\n\
  \n\n\n\n\n一旦你使用 `where` 子句（或调用 `Where()` 方法）定位了某些感兴趣的数据，LINQ 就能轻松地对生成的数据进行进一步处理——例如重新排列结果。在接下来的“尝试一试”（Try\
  \ It Out）中，你将把第一次查询结果按字母顺序排序。\n\n## 理解 ORDERBY 子句\n\n`orderby` 子句的形式如下：\n\n```\n\
  \ orderby n \n```\n\n与 `where` 子句一样，`orderby` 子句是可选的。只需添加一行，你就可以对任何任意查询的结果进行排序；否则，这可能至少需要额外的几行代码，并且取决于你选择选择的排序算法，可能还需要额外的方法或集合来存储重排后的结果。如果需要对多个类型进行排序，你将不得不为每种类型实现一组排序方法。使用\
  \ LINQ，你不需要担心这些问题；只需在查询语句中添加一个额外的子句即可完成。\n\n默认情况下，`orderby` 按升序（从 A 到 Z）排序，但你可以通过简单添加\
  \ `descending` 关键字来指定降序（从 Z 到 A）：\n\n```\n orderby n descending \n```\n\n这将示例结果按如下顺序排序：\n\
  \n```\n Smythe\n\nSmith\n\nSmall\n\nSingh\n\nSamba \n```\n\n此外，你可以按任何任意表达式进行排序，而无需重写查询；例如，要按名称的最后一个字母而不是普通的字母顺序进行排序，你只需将\
  \ `orderby` 子句更改为如下：\n\n```\n orderby n.Substring(n.Length - 1) \n```\n\n这将产生以下输出：\n\
  \n```\n Samba\n\nSmythe\n\nSmith\n\nSingh\n\nSmall \n```\n\n## 查询大型数据集\n\n你可能会说，这些\
  \ LINQ 语法固然很好，但意义何在？通过查看源数组就能清楚地看到预期的结果，那么为什么要费这么大劲去查询一个一眼就能显而易见的东西呢？正如前面提到的，有时查询结果并不那么显而易见。在接下来的“尝试一试”中，你创建了一个非常大的数字数组并使用\
  \ LINQ 对其进行查询。\n\n## 使用聚合运算符\n\n通常，查询返回的结果比你预期的要多。例如，如果你将刚刚创建的大数字查询程序的条件更改为列出大于\
  \ 1,000 的数字，而不是小于 1,000 的数字，那么查询结果将多到数字根本不会停止打印！\n\n幸运的是，LINQ 提供了一组聚合运算符，使你能够在无需遍历所有结果的情况下分析查询结果。表\
  \ 22-1 显示了针对数值结果（如来自大数字查询的结果）常用的聚合运算符。如果你使用过 SQL 等数据库查询语言，这些对你来说可能熟悉。\n\n| 运算符 |\
  \ 说明 |\n| --- | --- |\n| `Count()` | 结果计数 |\n| `Min()` | 结果中的最小值 |\n| `Max()` |\
  \ 结果中的最大值 |\n| `Average()` | 数值结果的平均值 |\n| `Sum()` | 所有数值结果的总和 |\n\n**表 22-1 :**\
  \ 数值结果的聚合运算符\n\n还有更多的聚合运算符，例如 `Aggregate()`，用于以某种方式执行任意代码，从而允许你编写自己的聚合函数。然而，这些是为高级用户设计的，因此超出了本书的范围。\n\
  \n在接下来的“尝试一试”中，你修改大数字查询，并使用聚合运算符通过 LINQ 探索大数字查询的大于版本的结果集。\n\n## 使用 SELECT DISTINCT\
  \ 查询\n\n熟悉 SQL 数据查询语言的人可能还会认识另一种查询，即 `SELECT DISTINCT` 查询，在那种查询中，你在数据中搜索唯一值——也就是说，查询会从结果集中移除任何重复值。这在处理查询时是一个相当的需求。\n\
  \n假设你需要找到之前示例中使用的客户数据中的不重复地区。在你刚刚使用的数据中没有单独的地区列表，因此，你需要从客户列表本身找到唯一的、不重复的地区列表。LINQ\
  \ 提供了一个 `Distinct()` 方法，可以轻松地找到这些数据。你将在接下来的“尝试一试”中使用它。\n\n## 按多级排序\n\n现在你正在处理具有多个属性的对象，你可能可以想象这样一种情况：仅通过单个字段对查询结果进行排序是不够的。如果你想查询客户并按地区字母顺序对结果排序，然后在每个地区内按国家或城市名称字母顺序排序怎么办？LINQ\
  \ 让这变得非常简单，正如你将在接下来的“尝试一试”中看到的。\n\n## 使用分组查询\n\n分组查询将数据分为若干组，并允许你按组进行排序、计算聚合和进行比较。这些通常是业务背景下最有趣的查询（那些驱动决策的查询）。例如，你可能想按国家或地区比较销售情况以决定开设另一家商店或雇用更多员工。你将在下一个“尝试一试”中这样做。\n\
  \n## 使用连接 (JOIN)\n\n对于 `customers` 和 `orders` 列表这样的数据集，通过共享键字段进行单次查询，这类似于 `JOIN`\
  \ 操作。\n\n## 练习题\n\n1. 22.1 修改第三方程序 (`BeginningCSharp7_3_QuerySyntax`) 以降序排序。\n2.\
  \ 22.2 修改大数字程序 (`BeginningCSharp7_6_LargeNumberQuery`) 中的 `GenerateOfNumbers()`\
  \ 方法以创建不同大小的结果集。\n3. 22.3 在大数字查询 (`BeginningCSharp7_6_LargeNumberQuery`) 中添加 `orderby`\
  \ 子句，查看其对性能的影响。\n4. 22.4 修改大数字查询 (`BeginningCSharp7_6_LargeNumberQuery`) 中的查询条件，以选择更大或更小的子集。这如何影响性能？\n\
  5. 22.5 修改方法语法示例 (`BeginningCSharp7_4_MethodSyntax`) 以完全消除 `where` 子句。它生成了多少输出？\n\
  6. 22.6 为第三方程序 (`BeginningCSharp7_3_QuerySyntax`) 添加聚合运算符。对于非数值结果可以使用哪些简单的聚合运算符？\n\
  \n练习题答案见附录。\n\n## 本章学习内容\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 什么是 LINQ 以及何时使用 | LINQ\
  \ 是内置于 C# 的查询语言。使用 LINQ 从对象集合、XML 或数据库查询数据。 |\n| LINQ 查询的组成部分 | LINQ 查询包含 `from`,\
  \ `where`, `select` 和 `orderby` 子句。 |\n| 如何获取 LINQ 查询的结果 | 使用 `foreach` 语句遍历 LINQ\
  \ 查询的结果。 |\n| 延迟执行 | LINQ 查询的执行被延迟到 `foreach` 语句执行时。 |\n| 方法语法和查询语法 | 大多数 LINQ 查询使用查询语法，需要时使用方法查询。对于任何查询，查询语法或方法语法都会得到相同的结果。\
  \ |\n| Lambda 表达式 | Lambda 表达式允许你在使用方法语法进行 LINQ 查询时即时声明方法。 |\n| 聚合运算符 | 使用 LINQ\
  \ 聚合运算符获取大型数据集的信息，而无需遍历每个结果。 |\n| 分组查询 | 使用分组查询将数据分组，然后按组进行排序、计算聚合和比较。 |\n\n\n\n\
  \n\n| 排序 | 使用 `orderby` 运算符对查询结果进行排序。 |\n| 联 | 使用 `join` 运算符在单次查询中查询多个集合中的相关数据。\
  \ |\n\n# 23 数据库\n\n## 使用数据库\n\n就本书而言，`database`（数据库）是一个持久的结构化数据存储库。有许多不同类型的数据库，但你在存储和查询业务数据时会遇到的最常见类型是`关系型数据库`，例如\
  \ Microsoft SQL Server 和 Oracle。关系型数据库使用 SQL 数据库语言（`SQL` 代表结构化查询语言）来查询和操作其数据。传统上，处理此类数据库工作需要需要了解一些\
  \ `SQL`，要么在你的编程语言中嵌入 `SQL` 语句，要么将包含 `SQL` 语句的字符串传递给 SQL 导向数据库类库中的 API 调用或方法。\n\n\
  听起来很复杂，不是吗？嗯，好消息是，通过 Visual Studio 2017，你可以使用 `Code First`（代码优先）方法在 C# 中创建对象，将其存储在数据库中，并使用\
  \ `LINQ` 查询这些对象，而无需使用 `SQL` 等其他语言。\n\n## 安装 SQL SERVER EXPRESS\n\n要运行本章所示的示例，你必须安装\
  \ Microsoft SQL Server Express，这是 Microsoft SQL Server 的免费量版本。你将使用 SQL Server Express\
  \ 的 `LocalDB`选项，它可以允许 Visual Studio 2017 直接创建和打开数据库文件，无需连接到单独的服务器。\n\n带有 `LocalDB`\
  \ 的 SQL Server Express 支持与完整版 Microsoft SQL Server 相同的 `SQL` 语法，因此它是初学者学习的合适版本。从此链接下载\
  \ SQL Server express：[`https://www.microsoft.com/sql-server/sql-server-editions-express`](https://www.microsoft.com/sql-server/sql-server-editions-express)。\n\
  \n## Entity Framework\n\n.NET 中支持 `Code First` 的类库是 `Entity Framework` 框架最新版本。该名称源于名为\
  \ `entity-relationship`（实体关系）的数据库概念，其中 `entity` 是数据对象的抽象概念（例如客户），它在关系型数据库中与订单和产品等实体相关（例如，客户为产品下订单）。\n\
  \n`Entity Framework` 将你程序中的 C# 对象映射到关系型数据库中的实体。这被称为 `object-relational mapping`（对象关系映射）。`Object-relational\
  \ mapping` 是将你的 C# 类、对象和属性映射到构成关系型数据库的表、行和列的代码。手动创建这些映射代码是枯燥且耗时的，但 `Entity Framework`\
  \ 让这一切变得简单！\n\n`Entity Framework` 构建在 `ADO.NET` 之上，它是 .NET 内的底层数据访问库。`ADO.NET` 需要一些\
  \ `SQL` 知识，但幸运的是，`Entity Framework` 也为你处理了这些问题，让你专注于你的 C# 代码。\n\n## 代码优先数据库\n\n\
  在接下来的“尝试一试”中，你将使用 `Entity Framework` 通过 `Code First` 方法在数据库中创建一些对象，然后使用 `LINQ Entities`\
  \ 查询你创建的对象。\n\n## 但我的数据库在哪里？\n\n但等一下，你说。你创建的数据库在儿儿？你从未指定过文件名或文件夹位置——这一切都是魔法！你可以通过\
  \ Visual Studio 2017 中的“服务器资源管理器”查看数据库。转到工具 ![image](img/Image00008.gif) 连接到数据库。`Entity\
  \ Framework` 将在你计算机上找到第一个本地 SQL Server 实例中创建一个数据库。\n\n如果你之前在计算机上没有任何数据库，Visual Studio\
  \ 2017 会为你创建一个名为 `(localdb)\\MSSQLLocalDB` 的本地 SQL Server 实例。要连接到此类数据库，请将 `(localdb)\\\
  MSSQLLocalDB` 输入到服务器名称字段中，如图 23-8 所示。\n\n![显示包含名为 BeginningCSharp7_23_1_CodeFirstDatabase.BookContext\
  \ 数据的数据库插图。](img/Image00266.jpg)\n\n**图 23-8**\n\n包含你数据的数据库将命名为 `BeginningCSharp7_23_1_CodeFirstDatabase.BookContext`，假设你完全按照章节所示输入了示例名称。在连接片刻后，它将出现在“选择或输入数据库名称”字段中。\n\
  \n现在你可以点击“确定”，数据库将出现在 Visual Studio 2017 的服务器资源管理器“数据连接”窗口中，如图 23-9 所示。\n\n![插图说明点击“确定”以便数据库出现在服务器资源管理器“数据连接”窗口中。](img/Image00267.jpg)\n\
  \n**图 23-9**\n\n从这里起你可以直接探索数据库。例如，你可以右键点击 `Books` 表并选择“显示表数据”以查看你输入的数据，如图 23-10\
  \ 所示。\n\n![插图说明通过右键点击 Books 表并选择“显示表数据”来直接探索数据库以查看输入的数据。](img/Image00268.jpg)\n\n\
  **图 23-10**\n\n## 导航数据库关系\n\n`Entity Framework` 强大方面之一是能够自动创建 `LINQ` 对象来帮助你导航相关表之间的关系。\n\
  \n在接下来的“尝试一试”中，你为 `Book` 类添加了两个类以创建一个简单的库存报告。新类是 `Store`（代表书店）和 `Stock`（代表库存）。这些关系如图\
  \ 23-11 所示。\n\n![与 Book 类相关的 Store 和 Stock 类图](img/Image00269.jpg)\n\n每个 `store`\
  \ 有一个名称、地址和一个由多个 `stock` 对象组成的集合，对应不同的书。`Store` 和 `Stock` 之间的关系是一对多。每条 `stock` 记录对应一个\
  \ `book`。`Stock` 和 `Book` 之间的关系一对一。你需要 `stock` 记录是因为一家书店可能有三本特定的书，而另一家书店可能有六本。\n\
  \n你会发现通过 `Code First`，你只需要创建 C# 对象和集合，`Entity Framework` 就会为你创建数据库结构并让你轻松导航数据库对象之间的关系。\n\
  \n## 处理迁移\n\n在开发代码时，不可避免地你会改变主意。你会为某个属性想出一个更好的名称，或者你意识到需要一个新的类或关系。如果你通过 `Entity\
  \ Framework` 修改了连接到数据库的类，当你首次运行更改后的程序时，将遇到图 23-14 所示的 `Invalid Operation Exception`。\n\
  \n![通过 Entity Framework 修改连接到数据库的类时遇到 Invalid Operation Exception 的插图。](img/Image00272.jpg)\n\
  \n**图 23-14**\n\n保持数据库与更改后的类同步是复杂的，但再次 `Entity Framework` 提供了一项使其相对简单的功能。正如错误消息所示，你需要在程序中添加\
  \ `Code First Migrations` 包。\n\n要执行此操作，转到工具 ![image](img/Image00008.gif) NuGet 包管理器\
  \ ![image](img/Image00008.gif) 包管理器控制台。这将弹出一个命令窗口，如图 23-15 所示。\n\n\n\n\n\n![截图说明：通过向程序中添加\
  \ Code First Migrations 包并转到工具 &#10154; NuGet 包管理器&#10154; 程序包管理器控制台。](img/Image00273.jpg)\n\
  \n图 23‐15\n\n要启用数据库自动迁移到你更新后的类结构，请在 `Package Manager Console` 的 `PM>` 提示符下输入此命令：\n\
  \n```\n Enable‐Migrations –EnableAutomaticMigrations \n```\n\n这将为你的项目添加一个 `Migrations`\
  \ 类，如图 23‐16 所示。\n\n![截图说明：显示了向项目添加 Migrations 类的后续步骤。](img/Image00274.jpg)\n\n\
  图 23‐16\n\n`Entity Framework` 将将数据库的时间戳与你的程序进行比较，并在数据库与你的类不同步时提示你。要更新数据库，只需在 `Package\
  \ Manager Console` 的 `PM>` 提示符下输入此命令：\n\n```\n Update-Database -Force \n```\n\n\
  ## 从现有数据库创建并查询 XML\n\n在最后一个示例中，你将结合已学的关于 `LINQ`、数据库和 `XML` 的所有知识。\n\n`XML` 通常用于在客户端和服务器机器之间，或在多层应用程序的不同“层”之间进行数据通信。在数据库中查询某些数据，然后根据这些数据生成\
  \ `XML` 文档或片段并传递给另一个层，是非常常见的操作。\n\n在接下来的“尝试一下”（Try It Out）练习中，你将创建一个查询来查找上一个示例数据库中的某些数据，使用\
  \ `LINQ to Entities` 查询数据，然后使用 `LINQ to XML` 类将数据转换为 `XML`。这是“数据库优先”（Database First）编程的示例，相对于“代码优先”（Code\
  \ First）编程，后者是你获取一个现有的数据库并从中生成 C# 对象。\n\n## 练习题\n\n1. 23.1 修改第一个示例 `BeginningCSharp7_23_1_CodeFirstDatabase`，提示用户输入标题和作者，并将用户输入的数据存储到数据库中。\n\
