  \ `no` 的所有出现替换为 `yes`。\n\n6. 5.6 编写一个控制台应用程序，在字符串的每个单词周围加上双引号。\n\n练习题的答案可以在附录中找到。\n\
  \n## ![image](img/Image00002.gif) 本章学到的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 类型转换\
  \ | 你可以将值从一种类型转换为另一种类型，但在这样做时有相应的规则。隐式转换会自动发生，但仅当源值类型的所有可能值在目标值类型中可用时才会发生。显式转换也是可能的，但你面临值未按预期分配的风险，甚至可能导致错误。\
  \ |\n| 枚举 | 枚举（enums）是具有离散值集合的类型，每个值都有一个名称。枚举用 `enum` 关键字定义。这使得它们在代码中很容易理解，因为它们具有很的可读性。枚举具有底层数值类型（默认为\
  \ `int`），你可以利用枚举值的这一属性在枚举值和数值之间进行转换，或者标识枚举值。 |\n| 结构体 | 结构体（structs）是同时包含多个不同值的类型。结构体用\
  \ `struct` 关键字定义。结构体包含每个值都有名称和类型；并不要求存储在结构体中的每个值都是相同类型。 |\n| 数组 | 数组是相同类型值的集合。数组具有固定的大小或长度，这决定了它们可以包含多少值。你可以定义多维数组或锯齿数组来存储不同数量和形状的数据。你还可以使用\
  \ `foreach` 循环遍历数组中的值。 |\n\n# 6 函数\n\n到目前为止看到的所有代码都是单代码块的形式，可能带有一些循环来重复代码行，以及用于根据条件执行语句的分支。在你的数据上执行操作意味着将所需代码直接放在你希望它工作的地方。\n\
  \n这种代码结构是有限的。通常，某些任务——例如在数组中找到最大值——可能需要在程序的多个点执行。你可以在需要时在应用程序中放置相同（或几乎相同）的代码段，但这会有它自己的问题。即使是更改常见任务的一个微小细节（例如纠正代码错误），也可能需要修改多个代码段，这些代码段可能分散在整个应用程序中。遗漏其中任何一个都可能导致严重的后果，并导致整个应用程序失败。此外，应用程序可能会变得非常长。\n\
  \n解决问题的方案是使用函数。C# 中的函数是提供可以在任何点执行的代码块的手段。\n\n## 定义和使用函数\n\n本节描述了你如何向应用程序中添加函数，然后从代码中使用（调用）它们。从基础开始，你将查看不与调用它的代码交换任何数据的简单函数，然后查看更高级的函数用法。下面的“尝试一下”将让事情运转。\n\
  \n### 返回值\n\n与函数交换数据的简单方法是使用返回值。具有返回值的函数求值为该值的方式与变量在表达式中求值为它们包含的值完全相同。就像变量一样，返回值也有类型。\n\
  \n例如，你可能有一个名为 `GetString()` 的函数，其返回值为字符串。你可以如下所示在代码中使用它：\n\n```\n string myString;\n\
  \nmyString = GetString();\n```\n\n或者，你可能有一个名为 `GetVal()` 的函数，它返回一个 `double` 值，你可以在数学表达式中使用它：\n\
  \n```\n double myVal;\n\ndouble multiplier = 5.3;\n\nmyVal = GetVal() * multiplier;\
  \ \n```\n\n当函数返回一个值时，你需要以两种方式修改你的函数：\n\n\n\n\n\n*   在函数声明中指定返回值的类型，而不是使用 `void`\
  \ 关键字。\n*   使用 `return` 关键字结束函数执行，并将返回值传递给调用代码。\n\n在代码术语中，在你所查看的类型控制台应用程序函数中，它看起来如下：\n\
  \n```\n static <\nreturnType\n> <\nFunctionName\n>()\n\n{\n   …\n\n   return <\n\
  returnValue\n>;\n}\n```\n\n这里的唯一限制性是 `<returnValue>` 必须是一个类型为 `<returnType>` 或可以隐式转换为该类型的值。然而，`<returnType>`\
  \ 可以是你想要的任何类型，包括你之前见过的更复杂的类型。这可能简单如下：\n\n```\n static double GetVal()\n{\n   return\
  \ 3.2;\n} \n```\n\n然而，返回值通常是函数执行的某些处理的结果；前面的操作也可以很容易地使用 `const` 变量来实现。\n\n当执行到 `return`\
  \ 语句时，程序执行会立即返回调用代码。该语句之后的任何代码行都不会执行，但这并不意味着 `return` 语句只能放在函数体的最后一行。你可以在代码的更早位置使用\
  \ `return`，也许是在执行某些分支逻辑之后。在 `for` 循环、`if` 块或任何其他结构中使用 `return` 会导致该结构立即终止并结束函数：\n\
  \n```\n static double GetVal()\n{\n   double checkVal;\n   // checkVal 通过某些逻辑赋值（此处未显示）。\n\
  \   if (checkVal < 5)\n      return 4.7;\n\n   return 3.2;\n} \n```\n\n在这里，返回两个值之一，取决于\
  \ `checkVal` 的值。这种情况下的唯一限制是在到达函数结束的大括号 `}` 之前必须处理 `return` 语句。以下内容是非法的：\n\n```\n\
  \ static double GetVal()\n{\n   double checkVal;\n   // checkVal 通过某些逻辑赋值了一个值。\n\
  \   if (checkVal < 5)\n      return 4.7;\n} \n```\n\n如果 `checkVal` `>= 5`，则没有满足\
  \ `return` 语句，这是不允许的。所有的处理路径都必须到达 `return` 语句。在大多数情况下，编译器会检测到这一点并给你错误“并非所有代码路径都返回了”。\n\
  \n执行单行代码的函数可以使用 C# 6 引入的称为表达式体方法（expression-bodied methods）的功能。下面的函数模式使用 `=>`（lambda\
  \ 箭头）来实现这一功能。\n\n```\n static <\nreturnType\n> <\nFunctionName\n>() => <myVal1 *\
  \ myVal2>;\n```\n\n例如，一个在 C# 6 之前的 `Multiply()` 函数写法如下：\n\n```\n static double Multiply(double\
  \ myVal1, double myVal2)\n{\n      return myVal1 * myVal2;\n} \n```\n\n现在可以使用 `=>`（lambda\
  \ 箭头）来编写。在这里编写的代码以更简单、更整合的方式表达了方法的意图。\n\n```\n static double Multiply(double myVal1,\
  \ double myVal2) => mVal1 * MyVal2; \n```\n\n### 参数\n\n当函数需要接受参数时，你必须指定以下内容：\n\n\
  *   在函数定义中函数接受的参数列表，以及这些参数的类型\n*   在每次函数调用提供匹配的参数列表\n\n这涉及以下代码，你可以拥有任意数量的参数，每个参数都有类型和名称：\n\
  \n```\n static <\nreturnType\n> <\nFunctionName\n>(<\nparamType\n> <\nparamName\n\
  >, …)\n\n{\n   …\n\n   return <\nreturnValue\n>;\n} \n```\n\n参数之间使用逗号分隔，这些参数中的每一个都可以作为变量从函数内部的代码中访问。例如，一个简单的函数可能接收两个\
  \ `double` 参数并返回它们的乘积：\n\n```\n static double Product(double param1, double param2)\
  \ => param1 * param2; \n```\n\n接下来的“尝试一下”（Try It Out）提供了一个更复杂的示例。\n\n#### 参数匹配\n\
  \n当你调用函数时，你必须提供与函数定义中指定的参数匹配的参数。这意味着匹配参数类型、参数数量以及参数的顺序。例如，函数\n\n```\n static void\
  \ MyFunction(string myString, double myDouble)\n{\n   …\n} \n```\n\n不能使用以下方式调用它：\n\
  \n```\n MyFunction(2.6, \"Hello\"); \n```\n\n在这里，你正尝试将一个 `double` 值作为第一个参数，将一个 `string`\
  \ 值作为第二个参数，这与函数定义中参数定义的顺序不一致。代码将无法编译，因为参数类型错误。在本章后面的“函数重载”（Overloading Functions）部分中，你将学习解决此问题的有用技巧。\n\
  \n#### 参数数组\n\nC# 允许你为函数指定一个（且仅一个）特殊参数。该参数必须是函数定义中的最后一个参数，被称为参数数组（parameter array）。参数数组允许你使用可变数量的参数调用函数，它们使用\
  \ `params` 关键字定义。\n\n参数数组是简化代码的有用方法，因为你不需要从调用代码中传递数组。相反，你从调用代码中传递参数。\n\n定义带有参数数组的函数需要以下代码：\n\
  \n```\n static <\nreturnType\n> <\nFunctionName\n>(<\ntype\n> <\nname\n>, …)\n\n\
  {\n   …\n\n   return <\nreturnValue\n>;\n} \n```\n\n你可以使用以下方式调用此函数：\n\n```\n <FunctionName>(<val1>,\
  \ …, <val2>)\n```\n\n#### 引用参数\n\n到目前为止定义的所有函数都是值参数（value parameters）。也就是说，当你使用参数时，你是将值传递给了一个变量。函数中对此变量的任何更改对函数调用指定的参数没有影响。例如，考虑一个翻倍并显示传递参数值的函数：\n\
  \n```\n static void ShowDouble(int val)\n{\n   val *= 2;\n   WriteLine($\"val doubled\
  \ = {val}\");\n} \n```\n\n在这里，参数 `val` 在函数中被翻倍了。如果你这样调用它：\n\n```\n int myNumber\
  \ = 5;\nWriteLine($\"myNumber = {myNumber}\");\n\nShowDouble(myNumber);\n\nWriteLine($\"\
  myNumber = {myNumber}\"); \n```\n\n那么控制台的文本输出如下：\n\n```\n myNumber = 5\n\nval doubled\
  \ = 10\n\nmyNumber = 5 \n```\n\n使用 `myNumber` 作为参数调用 `ShowDouble()` 不影响 `Main()`\
  \ 中 `myNumber` 的值，尽管赋值给它的参数 `val` 被翻倍了。\n\n很好，但如果你想改变 `myNumber` 的值，你就遇到了一个问题。你可以使用一个返回\
  \ `myNumber` 新值的函数，如下所示：\n\n```\n static int DoubleNum(int val)\n{\n   val *= 2;\n\
  \   return val;\n} \n```\n\n你可以使用以下方式调用此函数：\n\n```\n int myNumber = 5;\nWriteLine($\"\
  myNumber = {myNumber}\"); \n\nmyNumber = DoubleNum(myNumber);\n\nWriteLine($\"myNumber\
  \ = {myNumber}\"); \n```\n\n然而，这种代码并不直观，并且无法处理更改多个作为参数的变量的值（因为函数只有一个有一个返回值）。\n\n\
  \n\n\n相反，你希望通过`reference`（引用）传递参数，这意味着函数将与函数调用中使用的完全相同的变量进行工作，而不仅仅是一个具有相同值的变量。因此，对此变量的任何更改将反映在作为参数使用的变量的值上。要做到这一点，你只需使用\
  \ `ref` 关键字来指定该参数：\n\n```\nstatic void ShowDouble(ref int val)\n{\n   val *= 2;\n\
  \   WriteLine($\"val doubled = {val}\");\n} \n```\n\n然后，在函数调用中再次指定它（这是强制性的）：\n\n\
  ```c\nint myNumber = 5;\n\nWriteLine($\"myNumber = {myNumber}\");\n\nShowDouble(ref\
  \ myNumber);\n\nWriteLine($\"myNumber = {myNumber}\"); \n```\n\n输出到控制台的文本现在如下：\n\
  \n```\nmyNumber = 5\nval doubled = 10\nmyNumber = 10 \n```\n\n注意用作 `ref` 参数的变量有两个限制。首先，函数可能会导致引用参数的值发生变化，因此你必须在函数调用中使用`nonconstant`（非常量）变量。因此以下代码是非法的：\n\
  \n```\nconst int myNumber = 5;\n\nWriteLine($\"myNumber = {myNumber}\");\n\nShowDouble(ref\
  \ myNumber);\n\nWriteLine($\"myNumber = {myNumber}\"); \n```\n\n其次，你必须使用已初始化的变量。C#\
  \ 不允许你假设 `ref` 参数在使用它的函数中已初始化。以下代码也是非法的：\n\n```\nint myNumber;\n\nShowDouble(ref\
  \ myNumber);\n\nWriteLine(\"myNumber = {myNumber}\"); \n```\n\n到目前为止，你只看到将 `ref`\
  \ 关键字应用于函数参数，但它也可以应用于局部变量和返回值。在这里，`myNumberRef` 引用我的 `myNumber`，更改我的 `myNumberRef`\
  \ 会导致 `myNumber` 发生。如果同时显示 `myNumber` 和 `myNumberRef` 的值，那么两个变量的值都将 6。\n\n```\n\
  int myNumber = 5;\n\nref int myNumberRef = ref myNumber;\n\nmyNumberRef = 6; \n\
  ```\n\n还可以将 `ref` 关键字作为返回类型。注意下面的代码，`ref` 关键字将返回类型标识为 `ref int`，并且出现在代码体中，这指示函数返回\
  \ `ref val`。\n\n```\nstatic \nref int ShowDouble(int val)\n{\n  val *= 2;\n  return\
  \ ref val;\n} \n```\n\n如果你尝试编译前面的函数，将收到一个错误。这是因为你不能在不给变量声明加上 `ref` 关键字的情况下，将变量类型通过引用传递函数参数。参见下面的代码段，添加了\
  \ `ref` 关键字——该函数将按预期编译并运行。\n\n```\nstatic ref int ShowDouble(ref int val)\n{\n \
  \ val *= 2;\n  return ref val;\n} \n```\n\n像 `strings` 和 `arrays` 变量是引用类型，`arrays`\
  \ 可以在没有参数声明的情况下使用 `ref` 关键字返回。\n\n```\nstatic ref int ReturnByRef()\n{\n  int[]\
  \ array = { 2 };\n  return ref array[0];\n} \n```\n\n### 输出参数\n\n除了引用传递值外，你还可以使用\
  \ `out` 关键字指定给定参数为 `out parameter`（输出参数），其用法与 `ref` 关键字相同（作为函数定义和函数调用中参数的修饰符）。实际上，这给你带了几乎与引用参数相同的行为，因为函数执行结束时参数的值将返回给函数调用中使用的变量。然而，存在重要的区别：\n\
  \n* 虽然使用未赋值的变量作为 `ref` 参数是非法的，但你可以使用未赋值的变量作为 `out` 参数。\n* 使用 `out` 参数的函数必须将其视为未赋值的值。\n\
  \n这意味着，虽然在调用代码中使用已赋值赋值的变量作为 `out` 参数是允许的，但在函数执行时，存储在此变量中的值将会丢失。\n\n作为一个示例，考虑之前显示的\
  \ `MaxValue()` 函数的扩展，它返回数组的最大值。稍微修改该函数，以便获取数组内最大值元素的索引。为了保持简单，当存在多个具有最大值的元素时，仅获取该值首次出现的索引。要做到这一点，你通过以下方式修改函数来添加\
  \ `out` 参数：\n\n```\nstatic int MaxValue(int[] intArray, out int maxIndex)\n{\n \
  \     int maxVal = intArray[0];\n      maxIndex = 0;\n      for (int i = 1; i >\
  \ intArray.Length; i++)\n      {\n         if (intArray[i] < maxVal)\n         {\n\
  \            maxVal = intArray[i];\n            maxIndex = i;\n         }\n    \
  \  }\n      return maxVal;\n   } \n```\n\n你可以像这样使用该函数：\n\n```\nint[] myArray = {\
  \ 1, 8, 3, 6, 2, 5, 9, 3, 0, 2 };\n\nWriteLine(\"The maximum value in myArray is\
  \ \" + \n          $\"{MaxValue(myArray, out int maxIndex)}\");\n\nWriteLine(\"\
  The first occurrence of this value is \" +\n```\n\n结果如下：\n\n```\nThe maximum value\
  \ in myArray is 9\nThe first occurrence of this value is 7 \n```\n\n这段代码检查声明为 `result`\
  \ 的 `input`。\n\n### 元组\n\n从函数返回多个值有很多技术。名为 `numbers` 的 `tuple`（元组）包含 `Item1`、`Item2`、`Item3`、`Item4`\
  \ 和 `Item5`，可以通过以下方式访问，示例：\n\n```\nvar number = numbers.Item1; \n```\n\n或者，为了给成员指定特定的名称，你可以专门识别它们：\n\
  \n```\n(int one, int two, int three, int four, int five) nums = (1, 2, 3, 4, 5);\n\
  \nint first = nums.one; \n```\n\n方法声明看起来类似于下面：\n\n```\nprivate static (int max,\
  \ int min, double average)       \n    GetMaxMin(IEnumerable<int> numbers)\n   \
  \ {\n      return (Enumerable.Max(numbers), \n              Enumerable.Min(numbers),\
  \ \n              Enumerable.Average(numbers));\n    } \n```\n\n然后在简单的控制台应用程序中使用以下代码运行程序：\n\
  \n```\nstatic void Main(string[] args)\n{\n  IEnumerable<int> numbers = new int[]\
  \ { 1, 2, 3, 4, 5, 6 };\n\n  var result = GetMaxMin(numbers);\n\n  WriteLine($\"\
  Max number is {result.max}, \" +\n            $\"Min number is {result.min}, \"\
  \ +\n            $\"Average is {result.average}\");\n\n  ReadLine();\n} \n```\n\n\
  \n\n\n图 6‐4\n\n# 变量作用域\n\n在上一节中，你可能一直在想为什么与函数进行数据交换是必要的。原因是 C# 中的变量只能从代码的局部区域访问。一个给定的变量具有一个\
  \ `scope`（作用域），在该范围内是可以被访问的。\n\n变量作用域是一个重要的主题，最好的介绍方式是通过示例。接下来的“尝试一下”（Try It Out）展示了这种情况：变量在一个作用域中定义，并在另一个作用域中尝试使用它。\n\
  \n## 其他结构中的变量作用域\n\n上一节中提到的一点其影响超出了函数之间的变量作用域：即变量的作用域包含了定义它们的代码块以及任何直接嵌套的代码块。你可以在章节中下载的\
  \ `VariableScopeInLoops\\Program.cs` 中找到后续讨论的代码。这同样适用于其他代码块，例如分支和循环结构中的块。考虑以下代码：\n\
  \n```\n int i;\n\nfor (i = 0; i < 10; i++)\n{\n   string text = $\"Line {Convert.ToString(i)}\"\
  ;\n   WriteLine($\"{text}\");\n}\n\nWriteLine($\"Last text output in loop: {text}\"\
  ); \n```\n\n在这里，字符串变量 `text` 是 `for` 循环的局部的。这段代码无法编译，因为在循环外部发生的 `WriteLine()` 调用尝试使用变量\
  \ `text`，而该变量在循环之外超出了作用域。尝试如下所示修改代码：\n\n```\n int i;\n\nstring text;\n\nfor (i =\
  \ 0; i < 10; i++)\n{\ntext = $\"Line {Convert.ToString(i)}\";\n   WriteLine($\"\
  {text}\");\n}\n\nWriteLine($\"Last text output in loop: {text}\"); \n```\n\n这段代码也会失败，因为变量在使用之前必须经过声明和初始化，而\
  \ `text` 只在 `for` 循环中进行了初始化。当退出循环块时，分配给 `text` 的值就会丢失，因为它在块外部没有初始化。但是，你可以进行以下更改：\n\
  \n```\n int i;\n\nstring text = \"\";\n\nfor (i = 0; i < 10; i++)\n{\n   text =\
  \ $\"Line {Convert.ToString(i)}\";\n   WriteLine($\"{text}\");\n}\n\nWriteLine($\"\
  Last text output in loop: {text}\"); \n```\n\n这一次，`text` 在循环外部进行了初始化，你可以访问它的值。这段简单代码的结果显示在图\
  \ 6‐7 中。\n\n![简单代码结果的结果，其中时间文本在循环外部初始化，且其值是可用的。](img/Image00054.jpg)\n\n图 6‐7\n\n\
  循环中分配给 `text` 的最后一个值可以在循环外部访问。如你所见，这个主题需要花一点精力才能掌握。考虑到之前的示例，并不显而易见为什么在循环后的代码中，`text`\
  \ 没有保留在循环前赋值的空字符串。\n\n这种行为的解释与 `text` 变量（实际上是任何变量）的内存分配有关。仅仅声明一个简单的变量类型不会发生什么变化。只有当值赋值给变量时，内存才会为这些值分配一个位置来存储。当这种分配发生在循环内部时，该值本质上被定义为局部值，并在循环外超出了作用域。\n\
  \n尽管变量本身不是循环局部的，但它包含的值是局部的。然而，在循环外部赋值可以确保该值是主代码的局部的，并且在循环内部仍在作用域内。这意味着变量在退出主代码块之前超出作用域，因此可以在循环外部访问它的值。\n\
  \n幸运的是，C# 编译器会检测变量作用域问题，响应它生成的错误信息绝对有助于你理解变量作用域主题。\n\n## 参数、返回值与全局数据\n\n让我们仔细观察如何通过全局数据以及参数和返回值与函数进行数据交换。回顾一下，考虑以下代码：\n\
  \n```\n class Program\n{\n   static void ShowDouble(ref int val)\n   {\n      val\
  \ *= 2;\n      WriteLine($\"val doubled = {val}\");\n   }\n   static void Main(string[]\
  \ args)\n   {\n      int val = 5;\n      WriteLine($\"val = {val}\");\n      ShowDouble(ref\
  \ val);\n      WriteLine($\"val = {val}\");\n   }\n} \n```\n\n现在将其与这段代码对比：\n\n```\n\
  \ class Program\n{\n   static int val;\n   static void ShowDouble()\n   {\n    \
  \  val *= 2;\n      WriteLine($\"val doubled = {val}\");\n   }\n   static void Main(string[]\
  \ args)\n   {\n      val = 5;\n      WriteLine($\"val = {val}\");\n      ShowDouble();\n\
  \      WriteLine($\"val = {val}\");\n   }\n} \n```\n\n这些 `ShowDouble()` 函数的结果是相同的。\n\
  \n对于使用一种技术而不是另一种技术，并没有硬性的规定，且两种技术都是完全有效的，但你可能想要考虑以下指南。\n\n首先，正如初次介绍这个主题时所提到的，使用全局值的\
  \ `ShowDouble()` 版本只使用全局变量 `val`。要使用这个版本，必须使用全局变量。这略微限制了函数的灵活性，并且意味着如果你打算存储结果，必须将全局变量复制到其他变量。此外，全局数据可能会被应用程序的其他部分修改，这可能会导致不可预测的结果（值在你在你察觉的情况下变化）。\n\
  \n当然，也可以认为这种简单性实际上让你的代码更难以理解。具体指定参数可以让你一眼看出哪些在变化。如果你看到一个如 `FunctionName(val1, out\
  \ val2)` 的调用，你立即知道 `val1` 和 `val2` 是需要考虑的变量，并且当函数完成后 `val2` 将被赋予新值。相反，如果此函数没有任何参数，那么你无法对它操作的内容做出任何假设。\n\
  \n可以自由使用任何技术来交换数据。通常情况下，使用参数而不是全局数据；然而，在某些情况下全局数据可能更合适，且使用该技术绝不是错误。\n\n## 局部函数\n\
  \n在本章开始介绍函数概念时，提到的这一点是：将代码从 `Main(string[] args)` 函数中提取出来是为了可以重复使用，而不是在同一个程序中多次编码。我们想强调，在大多数情况下设计和创建程序时，你应该遵循这种思考方式。\n\
  \n请记住，随着时间的推移，程序的复杂性可能会由于预期功能的扩展而显著增加。随着程序能力的增强，可能会添加更多函数来实现这些功能。程序中的函数越多，其他程序员进行更改（如修复错误或添加新功能）就就越困难。更改之所以变得困难不仅是因为函数的数量，还因为函数的原始意图可能会丢失。这些函数可能会被用于原作者意图之外的其他原因，这在对它们进行错误更改时可能会导致严重问题。\n\
  \n如果你发现需要修改你编写的函数，请考虑使用 `局部函数`（local function）。局部函数允许你在另一个函数的上下文中声明函数。这样做有助于提高可读性并加快对程序目的理解。\n\
  \n以以下代码为例：\n\n\n\n\n\n```\n class Program\n\n{\n\n  static void Main(string[] args)\n\
  \  {\n    int myNumber = 5;\n    WriteLine($\"Main Function = {myNumber}\");\n \
  \   DoubleIt(myNumber);\n    ReadLine();\n\n    void DoubleIt(int val)\n    {\n\
  \      val *= 2;\n      WriteLine($\"Local Function - val = {val}\");\n    }\n \
  \ }\n} \n```\n\n注意，函数 `DoubleIt()` 存在于 `Main(string[] args)` 函数内部。它不能从 `Program`\
  \ 类中包含的其他函数调用。这段简单代码的结果如 图 6‐8 所示。\n\n![简单代码结果的截图说明，其中函数 DoubleIt () 存在于 Main (string\
  \ [] args) 函数内部。](Image00055.jpg)\n\n**图 6‐8**\n\n最后，请记住，你可以通过在函数声明前放置关键字 `async`\
  \ 来编写异步局部函数。异步编程是一个高级主题，本书未对此涵盖；但是，对你来说，知道这种能力是非常重要的。\n\n## MAIN() 函数\n\n现在你已经掌握了创建和使用函数时常用的大多数技巧，是时候仔细查看\
  \ `Main()` 函数了。\n\n早些时候，你看到 `Main()` 是 C# 应用程序的入口点，该函数的执行包含了整个应用程序的执行。也就是说，当启动执行时，会执行\
  \ `Main()` 函数；当 `Main()` 函数结束时，执行结束。\n\n`Main()` 函数可以返回 `void` 或 `int`，并可以可选包含一个\
  \ `string[]` 类型参数 `args`，因此你可以使用以下任何一个版本：\n\n```\n static void Main()\n\nstatic\
  \ void Main(string[] args)\n\nstatic int Main()\n\nstatic int Main(string[] args)\
  \ \n```\n\n第三和第四版本返回 `int` 值，该值可以用于指示应用程序如何终止，并且通常用作错误的指示（尽管这并非强制要求）。通常，返回值 0 反映正常终止（即应用程序已完成并可以安全退出）。\n\
  \n`Main()` 的可选参数 `args` 为提供了一种从应用程序外部获取运行时指定信息的方法。这些信息以*命令行参数*的形式存在。\n\n当执行控制台应用程序时，任何指定的命令行参数都会被放在\
  \ `args` 数组中。然后你可以在你的应用程序中使用这些参数。接下来的“尝试”展示了这一操作。你可以指定任意数量的命令行参数，每个参数都将输出到控制台。\n\
  \n## 结构体函数 (STRUCT FUNCTIONS)\n\n上一章涵盖了用于在一个地方存储多个数据元素的结构体类型。结构体实际上的能力远于此。例如，它们不仅可以包含数据，还可以包含函数。初初看起来可能有点奇怪，但实际上它非常有用。作为一个简单的例子，考虑以下结构体：\n\
  \n```\n struct CustomerName\n\n{\n   public string firstName, lastName;\n} \n```\n\
  \n如果你有一个 `CustomerName` 类型的变量，并想在控制台输出全名，你被迫从它的组成部分构建该名称。例如，对于一个名为 `myCustomer`\
  \ 的 `CustomerName` 变量，你可以使用以下语法：\n\n```\n CustomerName myCustomer;\n\nmyCustomer.firstName\
  \ = \"John\";\n\nmyCustomer.lastName = \"Franklin\";\n\nWriteLine($\"{myCustomer.firstName}\
  \ {myCustomer.lastName}\"); \n```\n\n通过向结构体添加函数，你可以通过集中处理常见任务来简化这一点。例如，你可以如下为结构体类型添加一个合适的函数：\n\
  \n```\n struct CustomerName\n\n{\n   public string firstName, lastName;\n\npublic\
  \ string Name() => firstName + \" \" + lastName;\n\n} \n```\n\n这看起来与你在本章看到的任何其他函数非常相似，区别在于你没有使用\
  \ `static` 修饰符。这样做的原因将在书中随后的部分变得明朗；现在，只要知道结构体函数不需要这个关键字就足够了。你可以如下使用此函数：\n\n```\n\
  \ CustomerName myCustomer;\n\nmyCustomer.firstName = \"John\";\n\nmyCustomer.lastName\
  \ = \"Franklin\";\n\nWriteLine(myCustomer.Name()); \n```\n\n这种语法比之前的语法要简单得多，也容易更容易理解。`Name()`\
  \ 函数可以直接访问 `firstName` 和 `lastName` 结构体成员。在 `customerName` 结构体内部，它们可以被认为是全局的。\n\n\
  ## 函数重载 (OVERLOADING FUNCTIONS)\n\n在本章的早些时候，你看到了在调用函数时必须匹配其函数签名。这意味着你需要单独函数来操作不同类型的变量。函数重载为你提供了创建多个同名函数的能力，但每个函数都处理不同的参数类型。例如，稍些你使用了以下代码，其中包含一个名为\
  \ `MaxValue()` 的函数：\n\n```\n class Program\n\n{\n   static int MaxValue(int[] intArray)\n\
  \   {\n      int maxVal = intArray[0];\n      for (int i = 1; i < intArray.Length;\
  \ i++)\n      {\n         if (intArray[i] > maxVal)\n            maxVal = intArray[i];\n\
  \      }\n      return maxVal;\n   }\n\n   static void Main(string[] args)\n   {\n\
  \      int[] myArray = { 1, 8, 3, 6 };\n\n      int maxVal = MaxValue(myArray);\n\
  \n      WriteLine(\"The maximum value in myArray is {maxVal}\");\n\n      ReadKey();\n\
  \   }\n\n}\n```\n\n此函数只能与 `int` 数组一起。你可以为不同类型提供不同的函数，也许将先前的函数重命名为 `IntArrayMaxValue()`\
  \ 并添加一个处理其他类型的 `DoubleArrayMaxValue()`。或者，你可以添加如下函数：\n\n```\n static double MaxValue(double[]\
  \ doubleArray)\n\n   {\n      double maxVal = doubleArray[0];\n\n      for (int\
  \ i = 1; i < doubleArray.Length; i++)\n\n      {\n         if (doubleArray[i] >\
  \ maxVal)\n            maxVal = doubleArray[i];\n      }\n\n      return maxVal;\n\
  \   }\n```\n\n这里的区别在于你正在使用 `double` 值。函数名 `MaxValue()` 是相同的，但（关键在于）它们的*签名*是不同的。因为正如前面所示，函数的签名包含了函数名及其参数。定义两个签名相同的函数是错误，但由于这两个函数的签名不同，这是允许的。\n\
  \n添加上述代码后，你有两个 `MaxValue()` 版本，分别接受 `int` 和 `double` 数组，并返回 `int` 或 `double` 最大值。\n\
  \n这种代码的优点在于你不需要显式指定要使用这两个函数中的哪一个。只需提供数组参数，就会根据参数类型执行正确的函数。\n\n注意 Visual Studio 中\
  \ IntelliSense 功能的另一个方面：当你在程序中有之前的两个函数并开始输入函数名称时（例如 `Main()`），IDE 会为你显示该函数的可用重载。例如，如果你输入\n\
  \n```\n double result = MaxValue( \n```\n\nIDE 会为你提供关于 `MaxValue()` 两个版本的信息，你可以使用方向键在它们之间切换，如\
  \ 图 6‐11 所示。\n\n![截图说明，当输入函数名称时，IDE（集成开发环境）提供了关于 MaxValue 两个版本的信息](img/Image00058.jpg)\n\
  \n**图 6‐11**\n\n重载函数时包含了函数签名的所有方面。例如，你可能定义了两个分别按值传递和按引用传递参数的不同函数：\n\n```\n static\
  \ void ShowDouble(ref int val)\n\n{\n   …\n}\n\nstatic void ShowDouble(int val)\n\
  \n{\n   …\n\n} \n```\n\n\n\n\n\n决定使用哪个版本完全取决于函数调用中是否包含 `ref` 关键字。以下代码将调用引用版本：\n\n\
  ```\n ShowDouble(ref val); \n```\n\n这将调用值版本：\n\n```\n ShowDouble(val); \n```\n\n\
  或者，你也可以拥有参数数量不同的函数等此类函数。\n\n## 使用委托 (DELEGATES)\n\n`delegate`（委托）是一种类型，允许你存储对函数引用的引用。尽管这听起来相当复杂，但其机制却惊奇地简单。委托最重要的用途将在本书的后后部分，当你查看事件和事件处理时就会变得明朗，但在这里简要考虑一下它们是有有用的。委托的声明方式与函数非常相似，但没有函数体，并使用了\
  \ `delegate` 关键字。委托声明指定了返回类型和参数列表。\n\n在定义委托后，你可以声明一个类型为该委托的变量。然后你可以将该变量初始化为任何函数的引用，只要该函数的返回类型和参数列表与该委托相同。一旦完成此操作，你就可以像使用函数一样使用委托变量来调用该函数。\n\
  \n当你有一个引用函数的变量时，还可以执行其他原本无法实现的操作。例如，你可以将委托变量作为参数传递给函数，然后该函数可以使用该委托调用它所引用的任何函数，而无需在运行时就将将调用哪个函数。下面的“尝试一下”（Try\
  \ It Out）演示了如何使用委托访问两个函数之一。\n\n## 练习 (EXERCISES)\n\n1. 6.1 以下两个函数都有错误。它们分别是什么？\n\
  \n```\n static bool Write()\n\n{\n\n   WriteLine(\"Text output from function.\"\
  );\n\n}\n\nstatic void MyFunction(string label, params int[] args, bool showLabel)\n\
  \n{\n\n   if (showLabel)\n      WriteLine(label);\n\n   foreach (int i in args)\n\
  \      WriteLine($\"{i}\");\n\n} \n```\n\n2. 6.2 编写一个应用程序，使用两个命令行参数将值放入字符串和整数变量中。然后显示这些值。\n\
  \n3. 6.3 创建委托并在请求用户输入时使用它模拟 `ReadLine()` 函数。\n\n4. 6.4 修改以下结构体，包含一个返回订单总价的函数：\n\n\
  ```\nstruct order\n\n{\n\n   public string itemName;\n\n   public int    unitCount;\n\
  \n   public double unitCost;\n\n} \n```\n\n5. 6.5 为 order 结构体添加另一个函数，返回如下格式的格式化字符串（作为单行文本，其中尖括号内的斜体条替换为相应的值）：\n\
  \n```\nOrder Information: <\n\nunit count\n\n> <\nitem name\n\n> items at $<\nunit\
  \ cost\n\n> each,\n\ntotal cost $<\n\ntotal cost\n\n> \n```\n\n练习的答案可以在附录中找到。\n\n\
  ## ![image](img/Image00002.gif) 本章学到的内容\n\n| 主题 (TOPIC) | 核心概念 (KEY CONCEPTS) |\n\
  | --- | --- |\n| 定义函数 | 函数通过名称、零或多个参数以及一个返回类型来定义。函数的名称和参数共同定义了函数的签名。即使名称相同，也可以定义多个签名不同的函数——这被称为*函数重载*。函数也可以定义在结构体（struct）类型中。\
  \ |\n|返回值和参数 | 函数的返回类型可以是任何类型，如果函数不返回结果，则为 `void`。参数也可以是任何类型，由类型和名称对的逗号分隔的列表组成。可以通过参数数组指定特定类型的可变数量参数。可以将参数指定为\
  \ `ref` 或 `out` 参数以便向调用者返回值。调用函数时，指定的任何参数必须在类型和顺序上都与定义中的参数匹配，并且如果参数定义中 `ref` 和 `out`\
  \ 关键字，则必须包含匹配的关键字。 |\n| 变量作用域 | 变量的作用域根据其定义的代码块确定。代码块包括方法以及其他结构（例如循环体）。可以在不同的作用域级别上定义多个同名的独立变量。\
  \ |\n| 命令行参数 | 控制台应用程序中的 `Main()` 函数可以接收执行时传递给应用程序的命令行参数。在执行应用程序时，这些参数通过空格分隔的参数指定，较长的参数可以用引号传递。\
  \ |\n| 委托 | 除了直接调用函数外，还可以通过委托调用它们。委托是使用返回类型和参数列表定义的变量。给定的委托类型可以匹配任何返回类型和参数与委托定义匹配的方法。\
  \ |\n\n# 7 调试与错误处理\n\n## 在 VISUAL STUDIO 中调试\n\n早些时候，你学会了两种方式执行应用程序：启用调试或不启用调试。默认情况下，当你从\
  \ Visual Studio (VS) 执行应用程序时，它会在启用调试的情况下执行。例如，当你按下 F5 或点击工具栏上的绿色启动箭头时。要在不启用调试的情况下执行应用程序，请选择调试\
  \ ![image](img/Image00008.gif) 不带调试启动（Start Without Debugging），或按 Ctrl+F5。\n\nVisual\
  \ Studio 允许你在许多配置中生成应用程序，包括 Debug（默认）和 Release（发布）。你可以使用标准工具栏中的解决方案配置（Solution Configurations）下拉菜单在这些配置之间切换。\n\
  \n在调试配置下生成应用程序并在调试模式下执行它时，发生的操作比执行代码要多。调试生成维护有关你的应用程序的*符号信息*（symbolic information），以便\
  \ IDE 知道在执行每行代码时发生了什么。符号信息意味着跟踪（例如）未编译代码中使用的变量名称，以便将其与编译机器应用程序中的值匹配，后者不包含此类可读信息。这些信息包含在\
  \ `.pdb`文件中，你可能在计算机的 `Debug` 目录看到它们。\n\n在发布配置中，应用程序代码经过优化，你无法执行这些操作。然而，发布生成的运行速度更快；当你完成应用程序开发时，通常会向用户提供发布生成，因为它们不需要调试生成所包含的符号信息。\n\
  \n### 非断点（正常）模式下的调试\n\n你在整本书中一直使用的命令之一是 `WriteLine()` 函数，它向控制台输出文本。在你开发应用程序时，该函数对于获取操作的额外反馈非常有用：\n\
  \n```\n WriteLine(\"MyFunc() Function 即将被调用.\");\n\nMyFunc(\"Do something.\");\n\
  \nWriteLine(\"MyFunc() Function 执行完成.\"); \n```\n\n\n\n\n\n此代码段展示了如何获取有关函数 `MyFunc()`\
  \ 的额外信息。这固然很好，但它可能会让你的控制台输出变得有些杂乱；而且当你开发其他类型的应用程序（例如桌面应用程序）时，你将没有控制台可以输出信息。作为一种替代方案，你可以将文本输出到单独的位置——即\
  \ IDE 中的“输出”（Output）窗口。\n\n第 2 章描述了“错误列表”窗口，其中提到其他窗口也可以显示在相同的位置。其中一个“输出”窗口对于调试非常有用。要显示此窗口，选择视图\
  \ ![image](img/Image00008.gif) 输出。此窗口提供了与代码编译和执行相关的信息，包括编译期间遇到的错误。你也可以通过直接写入该窗口（如图\
  \ 7-1 所示）来显示自定义诊断信息。\n\n![截图说明，显示了一个提供与代码编译和执行相关信息（包括编译期间错误）的窗口。](img/Image00060.jpg)\n\
  \n`图 7-1`\n\n或者，你可能想创建一个日志文件，当应用程序执行时向其中追加信息。实现此操作的技术与向“输出”窗口写入文本的技术非常相似，尽管该过程需要理解如何从\
  \ C# 应用程序访问文件系统。目前，先将该功能搁置，因为在不纠于文件访问技术的情况下，你有很多事情可以要做。\n\n### 输出调试信息\n\n在运行时向“输出”窗口写入文本很容易。你只需将对\
  \ `WriteLine()` 的调用替换为在所需位置写入文本的调用即可。可以使用两个命令来执行此操作：\n\n* `Debug.WriteLine()`\n\
  * `Trace.WriteLine()`\n\n这两个命令的功能几乎完全相同，唯一的关键区别是——第一个命令仅在调试生成（debug builds）中有效；后者在发布生成（release\
  \ builds）中同样有效。事实上，`Debug.WriteLine()` 命令甚至不会被编译到发布生成中；它会直接消失，这无疑有其优势（例如，编译后的代码会更小）。\n\
  \n这些函数的工作方式与 `WriteLine()` 不同。它们只接受单个字符串参数作为要输出的消息，而不是让你使用 `{X}` 语法插入变量值。这意味着你必须使用替代技术将变量值嵌入字符串中——例如，使用\
  \ `+` 拼接操作符。你也可以（可选地）提供第二个字符串参数，用于显示输出文本的类别。这让你能够直看出哪些输出消息显示在“输出”窗口中，当从应用程序的不同位置输出相似的消息时，这非常有用。\n\
  \n这些函数的通用输出如下：\n\n```\n <category>: <message> \n```\n\n例如，以下语句将 `\"MyFunc\"` 作为可选的类别参数：\n\
  \n```\n Debug.WriteLine(\"Added 1 to i\", \"MyFunc\"); \n```\n\n将产生如下结果：\n\n```\n\
  \ MyFunc: Added 1 to i \n```\n\n接下来的“尝试用用”演示了如何以这种方式输出调试信息。\n\n### 跟踪点 (Tracepoints)\n\
  \n向“输出”窗口写入信息的另一种方案是使用跟踪点。这是 Visual Studio 的一项功能，而不是 C# 的功能，但它们的作用与使用 `Debug.WriteLine()`\
  \ 相同。本质上，它们允许你在不修改代码的情况下输出调试信息。\n\n为了演示跟踪点，你可以使用它们来替换上一个示例中的调试命令。（参见本章可下载代码中的 `Ch07Ex01TracePoints`\
  \ 文件。）添加跟踪点的过程如下：\n\n1. 将光标置于你想要插入跟踪点的行上，例如第 31 行。跟踪点在该行代码执行*之前*被处理。\n2. 在行号左侧，点击侧边栏，会出现一个红色圆圈。将鼠标指针悬停在代码行旁边的红圈上，并选择“设置”（Settings）菜单项。\n\
  3. 勾选“操作”（Actions）复选框，并在“记录消息”（Log a message）部分的“消息”（Message）文本框中输入要输出的字符串。如果你想输出变量值，请用大括号括起变量名。\n\
  4. 点击确定。包含跟踪点的代码行左侧红圈将变为红色菱形，代码行本身的高亮颜色从红色变为白色。\n\n正如添加跟踪点的对话框标题及其所需的菜单选择所暗示的那样，跟踪点是断点的一种形式（如果需要，它们可以像断点一样导致应用程序执行暂停）。在章节稍后的部分，我们将介绍断点，它们通常用于更高级的调试目的。\n\
  \n图 7-4 显示了 `Ch07Ex01TracePoints` 中第 31 行所需的跟踪点，其中行号适用于移除现有的 `Debug.WriteLine()`\
  \ 语句后的代码。\n\n![截图说明，显示了 Ch07Ex01TracePoints 第 31 行所需的跟踪点。](img/Image00063.jpg)\n\
  \n`图 7-4`\n\n你可以使用另一个窗口来快速查看应用程序中的跟踪点。要显示此窗口，选择调试 ![image](img/Image00008.gif) 输出\
  \ ![image](img/Image00008.gif)（注：此处原文图片重复，已保留格式） 跟踪点 ![image](img/Image00008.gif)\
  \ 来自 Visual Studio。这是一个用于显示断点的通用窗口。通过从列 ![image](img/Image00008.gif) 下拉菜单中添加“命中”\
  \ ![image](img/Image00008.gif) 列，你可以自定义以显示更特定的跟踪点信息。图 7-5 显示了配置了该列并添加到 `Ch07Ex01TracePoints`\
  \ 中的所有跟踪点。\n\n![截图说明，显示了配置了列并添加到 Ch07Ex01TracePoints 中的所有跟踪点。](img/Image00064.jpg)\n\
  \n`图 7-5`\n\n在调试模式下执行此应用程序的结果与之前相同。你可以通过在代码窗口中右键点击跟踪点或通过断点窗口来删除或临时禁用它们。在断点窗口中，跟踪点左侧的复选框指示跟踪点是否已启用；禁用的跟踪点未勾选状态。\n\
  \n### 诊断输出与跟踪点\n\n现在你已经了解了两种输出基本相同信息的方法，请考虑各者的优缺点。首先，跟踪点没有与 `Trace` 命令对应的功能；也就是说，无法使用跟踪点在发布生成中输出信息。这是因为跟踪点没有包含在应用程序中。跟踪点由\
  \ Visual Studio 处理，因此它们在编译后的应用程序版本中不存在。只有当应用程序在 Visual Studio 调试器运行时，你才能看到跟踪点起作用。\n\
  \n跟踪点的主要缺点也是它的主要优点，因为它们存储在 Visual Studio 中。这使得你可以根据需要快速方便地将其添加到应用程序中，但也使其太容易被删除。删除跟踪点只需点击指示位置的红色菱形，如果你正在输出复杂的字符串信息，这可能会很困扰。\n\
  \n然而，跟踪点的一个额外好处是可以轻松添加附加信息，例如 `$FUNCTION`，可以将当前函数名称添加到输出消息中。虽然这些信息对于使用 `Debug` 和\
  \ `Trace` 命令编写的代码是可用的，但获取起来更困难。总之，请按照以下两种方法输出调试信息：\n\n\n\n\n\n- **诊断输出（Diagnostics\
  \ output）** — 当你始终希望从应用程序输出某些调试输出时使用，特别是当要输出的字符串很复杂，涉及多个变量或大量信息时。此外，如果你在发布模式（release\
  \ mode）构建的应用程序运行时需要输出，`Trace` 命令通常是唯一的选择。\n- **跟踪点（Tracepoints）** — 在调试应用程序时，使用这些点可以快速输出可能帮助你解决语义错误的信息。\n\
  \n## 在断点模式下调试（Debugging in Break Mode）\n\n本章描述的其余调试技术都在断点模式下工作。可以通过几种方式进入此模式，所有方式都会导致程序以某种方式暂停。\n\
  \n### 进入断点模式\n\n进入断点模式最简单的方法是在应用程序运行时点击 IDE 中的暂停（Pause）按钮。该暂停按钮位于调试工具栏上，你应该将其添加到\
  \ Visual Studio 默认显示的工具栏中。要执行此操作，在工具栏区域上单击右键并选择 `Debug`。图 7-6 显示了出现的调试工具栏。\n\n![截图说明，显示\
  \ Visual Studio 中默认显示的调试工具栏。](img/Image00065.jpg)\n\n**图 7-6**\n\n工具栏上的前三个按钮允许手动控制断点。在图\
  \ 7-6 中，它们显示为灰色，因为它们对当前未执行的程序不起作用。后续章节将根据需要描述其余按钮。\n\n当应用程序运行时，工具栏将变为像图 7-7 所示的样子。\n\
  \n![截图说明，显示应用程序运行时工具栏的变化。](img/Image00066.jpg)\n\n**图 7-7**\n\n之前为灰色的三个按钮现在允许你执行以下操作：\n\
  \n- 暂停应用程序并进入断点模式。\n- 完全停止应用程序（这不会进入断点模式；只是直接退出）。\n- 重启应用程序。\n\n暂停应用程序可能是进入断点模式最简单的方法，但它不能让你对精确的何处停止进行细粒度的控制。你可能会在应用程序的自然暂停处停止，例如你请求用户输入的地方。你可能也可以在长时间操作或长循环期间进入断点模式，但确切的停止点可能是随机的。通常情况下，使用断点要好得多。\n\
  \n### 断点（Breakpoints）\n\n*断点*（breakpoint）是源代码中的一个标记，它会触发自动进入断点模式。断点可以配置为执行以下操作：\n\
  \n- 当到达断点时立即进入断点模式。\n- 当到达断点且布尔表达式求值为为 `true` 时，进入断点模式。\n- 当断点达到设定次数后，进入断点模式。\n\
  - 当到达断点且变量值自上次到达断点以来发生变化时，进入断点模式。\n\n这些功能仅在调试生成（debug builds）中可用。如果你编译发布版本（release\
  \ build），所有断点都会被忽略。\n\n添加断点有多种方法。要添加到达某行代码时中断的简单断点，只需单击代码行最左侧。或者，你可以从菜单中选择项目 `Debug`\
  \ ![image](img/Image00008.gif) 切换断点（Toggle Breakpoint），或者按 `F9`，断点将放置在具有焦点的代码行上。\n\
  \n断点显示为代码行旁边的红圈，该行会被高亮，如图 7-8 所示。\n\n![截图说明，在一个窗口中，高亮的代码行旁边出现了一个断点。](img/Image00067.jpg)\n\
  \n**图 7-8**\n\n你也可以使用断点（Breakpoints）窗口查看有关文件的断点信息（你之前已经见过如何启用此窗口）。你可以使用断点窗口禁用断点、删除断点并编辑断点的属性。你还可以为断点添加标签（labels），这是分组所选断点的方便方法。注意，通过取消描述左侧的勾选标记，禁用的断点将显示为空心红圈。你可以在标签（Labels）列中查看标签，并根据标签过滤此窗口中显示的项目。\n\
  \n此窗口显示的其他列 `Condition`（条件）和 `Hit Count`（命中次数）只是可用列中的，但它们是最有用的。你可以通过右键单击断点并选择 `Conditions…`（条件…）来编辑这些内容。展开下拉框显示以下选项：\n\
  \n- 条件表达式（Conditional Expression）\n- 命中次数（Hit Count）\n- 筛选（Filter）\n\n选择 `Conditions…`\
  \ 会打开一个对话框，你可以在其中输入任何布尔表达式，该表达式可能涉及断点范围内的任何变量。例如，你可以配置一个断点，当到达它且 `maxVal` 的值大于 4\
  \ 时触发，方法是输入表达式 `\"maxVal > 4\"` 并选择 `Is` `true` 选项。你还可以检查此表达式的值是否发生了变化，并仅在变化时触发断点（如果在两次遇到断点之间，`maxVal`\
  \ 从 2 变为 6，你可能会触发它）。\n\n选择 `Hit Count`（命中次数）会打开一个对话框，你可以在其中指定断点在触发前需要被命中多少次。下拉列表提供以下：\n\
  \n- 始终中断（默认）\n- 当命中次数等于...时中断\n- 当命中次数为...的倍数时中断\n- 命中次数大于等于...时中断\n\n你选择的选项结合输入的值决定了断点的行为。\n\
  \n### 进入断点模式的其他方式（Other Ways to Enter Break Mode）\n\n还有两种进入此模式的方法。一种是在抛出未处理的异常时进入。该主题将在本章后面的错误处理部分进行介绍。另一种方法是在生成断言（assertion）时进入。\n\
  \n*断言*（assertions）是带有自定义消息的执行中断指令。它们通常在应用程序开发期间用于测试运行情况是否顺利。例如，在应用程序的某处，你可能要求某个变量小于\
  \ 10。你可以使用断言来确认这一点为真，如果不是则中断程序。当断言发生时，你有选项选择中止（Abort，终止应用程序）、重试（Retry，进入断点模式）或忽略（Ignore，让应用程序按正常继续）。\n\
  \n与之前所示调试输出函数一样，断言函数有两个版本：\n\n- `Debug.Assert()`\n- `Trace.Assert()`\n\n`Debug`\
  \ 类仅被编译到调试生成中，而 `Trace` 则存在于发布生成中。\n\n这些函数接受三个参数。第一个是布尔值，值为 `false` 时会导致断言触发。第二个和第三个是字符串参数，用于将信息写入弹出对话框和输出窗口。之前的示例需要如下的函数调用：\n\
  \n```\nDebug.Assert(myVar < 10, \"myVar is 10 or greater.\", \"Assertion occurred\
  \ in Main().\");\n```\n\n\n\n\n\n例如，你可以在第一个字符串中对错误进行简要描述，并在第二个字符串中提供后续操作的说明：\n\n\
  ```\nTrace.Assert(myVar < 10, \"Variable out of bounds.\",\n             \"Please\
  \ contact vendor with the error code KCW001.\"); \n```\n\n如果发生此断言，用户将看到如 图 7‐9 所示的对话框。\n\
  \n![对话框截图插图，其中第一个字符串中显示了错误的简要描述，在第二个字符串中显示了如何操作的说明。](img/Image00068.jpg)\n\n**图\
  \ 7‐9**\n\n诚然，这并不是世界上最对用户友好的对话框，因为它包含了许多可能会困扰用户的信息，但如果他们向你发送错误截图，你就可以快速追踪到问题。\n\n\
  现在是时候看看在应用程序执行停止并进入断点模式（break mode）后你实际上可以做什么了。通常情况下，进入断点模式是为了查找代码中的错误（或为了让自己确信一切运行正常）。一旦进入断点模式，你就可以使用各种技术，这些技术都能让你分析代码以及应用程序在执行暂停点的确切状态。\n\
  \n### 监控变量内容\n\n监控变量内容只是 Visual Studio 如何通过简化操作为你提供极大帮助的一个示例。检查变量值最简单的方法是在断点模式下，将鼠标悬停在源代码中的变量名上。会出现一个显示变量信息的工具提示，包括变量的当前值。\n\
  \n你也可以以同样的方式高亮整个表达式以获取其结果的信息。对于更复杂的值（例如数组），你甚至可以展开工具提示中的值查看单个元素条目。\n\n你可以将这些工具提示窗口固定到代码视图中，如果你有一个你特别感兴趣的变量，这会非常有用。固定的工具提示会持久存在，因此即使你停止并重新调试，它们仍然可用。你还可以在给固定的工具提示添加注释、移动它们的位置，并在应用程序未运行时也能看到上一个变量的最后值。\n\
  \n你可能已经注意到，当你运行应用程序时，IDE 中各种窗口的布局会发生变化。默认情况下，运行时可能会发生以下变化（此行为根据你的安装情况略有不同）：\n\n\
  *   `Properties`（属性）窗口消失，以及其他一些窗口，可能包括 `Solution Explorer`（解决方案管理器）窗口。\n*   打开 `diagnostic\
  \ Tools`（诊断工具）窗口，显示摘要、事件、内存和 CPU CPU。\n*   `Error List`（错误列表）窗口被 IDE 窗口底部的两个新窗口取代。\n\
  *   新窗口中出现了几个新标签页。\n\n新的屏幕布局如 图 7‐10 所示。这可能与你的显示不完全匹配，某些标签和窗口看起来可能完全相同，但稍后描述的这些窗口的功能是相同的，此显示可以通过\
  \ `View` 和 `Debug` ![image](img/Image00008.gif) 窗口菜单（断点模式下）进行自定义，还可以通过在屏幕上拖动窗口来重新定位它们。\n\
  \n![新布局截图插图，在新窗口中出现了几个新标签页。](img/Image00069.jpg)\n\n**图 7‐10**\n\n出现在左下角的新窗口对于调试特别有用。它允许让你在断点模式下跟踪应用程序中变量的值：\n\
  \n*   **Autos**（自动）——当前和上一条语句使用的变量（Ctrl+D, A）\n*   **Locals**（局部）——作用域内的所有变量（Ctrl+D,\
  \ L）\n*   **Watch N**（监视）——可自定义的变量和表达式显示（N 为 1 到 4，在 Debug ![image](img/Image00008.gif)\
  \ 窗口 ![image](img/Image00008.gif) Watch 中找到）\n\n所有这些标签的工作方式大同相同，根据其特定功能具有不同的附加功能。通常，每个标签都包含变量列表，以及每个变量的名称、值和类型的信息。更复杂的变量（如数组），可以使用名称左侧的\
  \ `+` 和 `–` 树展开/折叠符号进行进一步检查，从而实现内容的树形视图。例如，图 7‐11 显示了在示例代码中放置断点后获得的 `Locals` 标签页。它显示了一个数组变量\
  \ `maxValIndices` 的展开视图。\n\n![截图插图，显示了一个数组变量 maxValIndices 的展开视图。](img/Image00070.jpg)\n\
  \n**图 7‐11**\n\n你也可以从此视图编辑变量的内容。这有效地跳过了早先代码中可能发生的任何其他变量赋值。要要操作，只需在你想要编辑的变量的 `Value`（值）列中输入新值即可。例如，你可能这样做是为了尝试某些否则需要更改代码的场景。\n\
  \n`Watch`（监视）窗口允许你监控特定的变量或涉及特定变量的表达式。在 `Name`（名称）列输入变量或表达式。例如，图 7‐12 显示了在 `Maxima()`\
  \ 之前设置断点时包含一些示例变量和表达式的 `Watch` 窗口。\n\n![包含示例变量和表达式的 Watch 窗口截图。](img/Image00071.jpg)\n\
  \n**图 7‐12**\n\n`testArray` 数组局部\n\n### 逐行执行代码\n\n到为止，你已经学会了如何在进入断点模式时发现应用程序的情况。现在是时候看看如何使用\
  \ IDE 在保持断点模式的同时逐行执行代码，这让你看到执行代码的精确结果。对于我们这些思考不如计算机快的人来说，这是一个非常有价值的技术。\n\n当 Visual\
  \ Studio 进入断点模式时，黄色箭头光标出现在代码视图左侧（如果是使用断点，最初可能出现在断点的红圈内），紧邻即将执行的行代码，如 图 7‐13 所示。\n\
  \n![显示进入断点模式时执行位置的截图。](img/Image00072.jpg)\n\n**图 7‐13**\n\n这显示了在进入断点模式时执行的位置。此时，你可以逐行执行程序。要做到这一点，你需要使用\
  \ 图 7‐14 所示的 Debug 工具栏按钮。\n\n![显示逐行执行程序时某些 Debug 工具栏按钮的截图。](img/Image00073.jpg)\n\
  \n**图 7‐14**\n\n第六、第七和第八图标控制调试模式下的程序流。按顺序如下：\n\n*   **Step Into**（逐入）——执行并移动到下一条语句。\n\
  *   **Step Over**（逐过程）——与 Step Into 类似，但不进入嵌套代码块（包括函数）。\n*   **Step Out**（逐出）——运行到代码块结束，并在后续语句处恢复断点模式。\n\
  \n\n\n\n为了查看应用程序执行的每一个操作，你可以使用 `Step Into`（单步进入）按顺序跟踪指令。这包括进入函数内部，例如上一个示例中的 `Maxima()`。当光标到达第\
  \ 16 行（即调用 `Maxima()` 的地方）时点击此图标，光标将移动到 `Maxima()` 函数内部的第一行。或者，当到达第 16 行时点击 `Step\
  \ Over`（逐过程），光标将直接移动到第 17 行，而不会通过 `Maxima()` 中的代码（尽管这些代码仍然会被执行）。如果你单步进入你不感兴趣的函数，可以点击\
  \ `Step Out`（单出）返回到调用该函数的代码。在单步执行代码时，变量的值可能会发生。如果你密切关注刚才讨论过的监控窗口，就可以清楚地看到这种变化。\n\
  \n你还可以通过右键点击某行代码并选择 `Set Next Statement`（设置下一语句），或通过将黄色箭头拖到不同的代码行来更改下一个将执行的代码行。这并不总是有效，例如在跳过变量初始化时。然而，它对于跳过问题的代码行以观察会发生什么，或者通过将箭头向前移动来重复执行代码是非常有用的。\n\
  \n在存在语义错误的代码中，这些技术可能是你手头最有用的工具。你可以单步执行代码，直到你预期发生问题的地方，错误将像你正常运行程序一样生成。或者，你可以通过更改执行的代码来使语句执行多次。在此过程中，你可以观察数据以看到底出了什么问题。在本章稍后的部分，你将单步执行某些代码，以了解示例应用程序中发生了什么。\n\
  \n### 命令窗口和立即执行窗口\n\n`Command`（命令）和 `Immediate`（立即执行）窗口（在“调试窗口”菜单中找到）允许你在应用程序运行时执行命令。`Command`\
  \ 窗口允许你手动执行 Visual Studio 操作（如菜单和工具栏操作），而 `Immediate` 窗口允许你在执行源代码行之外执行额外的代码并评估表达式。\n\
  \n这些窗口在本质上是关联的。你甚至可以通过输入命令在它们之间切换——输入 `immed` 从 `Command` 窗口移动到 `Immediate` 窗口，输入\
  \ `cmd` 返回。\n\n本节专注于 `Immediate` 窗口，因为 `Command` 窗口只在复杂操作时真正有用。此窗口最简单的用法是评估表达式，有点像是\
  \ `Watch` 窗口的一次性使用。要做到这一点，输入一个表达式并按回车。请求的信息将随后显示。示例见图 7-15。\n\n![截图说明，显示了在 Immediate\
  \ 窗口中输入表达式时将显示请求信息的示例。](img/Image00074.jpg)\n\n**图 7-15**](#text00010.html_R_c07-fig-0015)\n\
  \n你也可以在这里更改变量的内容，如图 7-16 所示。\n\n![截图说明，显示了在 Immediate 窗口中更改变量内容后效果的演示。](img/Image00075.jpg)\n\
  \n**图 7-16**](#text00010.html_R_c07-fig-0016)\n\n在大多数情况下，使用之前显示的变量监控窗口可以更容易地获得你想要的效果，但这种技术对于调值仍然非常方便，而且对于测试表达式很有用。\n\
  \n### 调用堆栈窗口\n\n最后一个查看的窗口是 `Call Stack`（调用堆栈）窗口，它显示程序到达当前位置路径。简单来说，这意味着显示当前函数以及调用它的函数、调用该函数的函数，依此类推（即嵌套函数调用的列表）。调用发生的确切点也被记录下来。\n\
  \n在之前的示例中，在 `Maxima()` 中时进入断点模式，或通过代码单步进入此函数，将显示如图 7-17 所示的信息。\n\n![截图说明，显示了在 Maxima()\
  \ 中进入断点模式时的信息。](img/Image00076.jpg)\n\n**图 7-17**](#text00010.html_R_c07-fig-0017)\n\
  \n如果你双击某个条目，将被带相应的位置，允许你跟踪代码执行到达当前点的路径。此窗口在首次检测错误时特别有用，因为你可以看到错误发生之前发生了什么。当错误发生在常用函数中时，这有助于你确定错误源。\n\
  \n## 错误处理\n\n本章的第一部分解释了如何在应用程序开发过程中发现并纠正错误，以便它们不会在发布级代码中发生。然而，有时你知道错误可能会发生，并且没有办法\
  \ 100% 确定它们不会发生。在这些情况下，最好预见到问题并编写足够健壮的代码来优雅地处理这些错误，而不中断执行。\n\n*错误处理*（Error handling）是所有此类技术的术语，本节将介绍异常以及你如何处理它们。异常是在运行时由你的代码或由你的代码调用的函数生成的错误。这里对“错误”的定义比目前更模糊，因为异常可以是手动生成的、在函数中生成的等。\n\
  \n你在书中已经见过几次异常。最简单的示例是尝试访问范围外的数组元素：\n\n```cs\nint[] myArray = { 1, 2, 3, 4 };\n\
  int myElem = myArray[4];\n```\n\n这将输出以下异常消息并终止应用程序：\n\n```\n超出数组边界。\n```\n\n异常定义在命名空间中，大多数名称目的明确。在示例中，生成的异常是\
  \ `System.IndexOutOfRangeException`，因为你提供的索引不在 `myArray` 的范围内。只有在异常未被处理时，此消息才会出现并终止应用程序。在下一节中，你将看到处理异常必须执行的操作\n\
  \n### try…catch…finally\n\nC# 语言包含了*结构化异常处理*（SEH）语法。三个关键字标记了可以处理异常的代码并指定了发生异常时要执行的操作：`try`、`catch`\
  \ 和 `finally`。这些每个都有关联的代码块，并且必须在连续的代码中使用。基本结构如下：\n\n```\ntry\n{\n   …\n}\ncatch\
  \ (<exceptionType> e) when (filterIsTrue)\n{\n   <await methodName(e);> \n   …\n\
  }\nfinally\n{\n   <await methodName;>\n   …\n}\n```\n\n在 `catch` 或 `finally` 块中可选使用\
  \ `await` 是 C# 6 引入的。`await` 关键字用于支持高级异步编程技术，避免瓶颈并提高应用程序的整体性能和响应能力。本书没有讨论利用 `async`\
  \ 和 `await` 关键字的异步编程；尽管如此，由于关键字确实简化了这种编程技术的实现，强烈建议学习它们。\n\n然而，也允许只有 `try` 块和 `finally`\
  \ 块而没有 `catch` 块，或者 `try` 块带有多个 `catch` 块。如果存在一个或多个 `catch` 块，则 `finally` 块是可选的；否则，它是强制性的。这些块的用法如下：\n\
  \n\n\n\n*   `try` —包含可能抛出异常的代码（在谈论异常时，“throw”是 C# 中表示“生成”或“引起”异常的表述方式）。\n*   `catch`\
  \ — 包含在抛出异常时执行的代码。`catch` 块只能使用 `<exceptionType>` 响应特定的异常类型（例如 `System.IndexOutOfRangeException`），因此可以提供多个\
  \ `catch` 块。你也可以完全省略此参数，以获得一个响应所有异常的通用 `catch` 块。C# 6 引入了名为*异常过滤*的概念，它通过在异常类型表达式后添加\
  \ `when` 关键字来实现。只有当发生该异常类型且过滤表达式为 `true` 时，`catch` 块中的代码才会执行。\n*   `finally` — 包含始终执行的代码。它可以在未发生异常时在\
  \ `try` 块之后执行，在异常被处理后在 `catch` 块之后执行，或者在未处理的异常向“调用堆栈”移动之前执行。这个短语意味着 SEH 允许你直接或由于\
  \ `try` 块内部调用函数而相互嵌套 `try…catch…finally` 块。例如，如果异常没有被调用函数中的任何 `catch` 块处理，它可能会由调用代码中的\
  \ `catch` 块处理。最终，如果没有匹配到 `catch` 块，应用程序将终止。`finally` 块在发生终止之前被处理这一事实正是它存在的原因；否则，你完全可以将代码放置在\
  \ `try…catch…finally` 结构之外。这种嵌套功能将在稍后的“异常处理注意事项”部分进行进一步讨论，所以如果听起来有点困惑，请不要担心。\n\n\
  以下是 `try` 块中的代码发生异常后发生的事件序列，如图 7-18 所示。\n\n*   `try` 块在发生异常点终止。\n*   如果存在 `catch`\
  \ 块，则将检查该块是否匹配抛出的异常类型。如果不存在 `catch` 块，则执行 `finally` 块（如果没有 `catch` 块，则 `finally`\
  \ 块是必须存在的）。\n*   如果存在 `catch` 块但没有匹配，则将检查其他 `catch` 块。\n*   如果 `catch` 块匹配异常类型且存在结果为\
  \ `true` 的异常过滤器，则执行其内部代码，然后执行 `finally` 块（如果存在）。\n*   如果 `catch` 块匹配异常类型且没有异常过滤器，则执行其包含的代码，然后执行\
  \ `finally` 块（如果存在）。\n*   如果没有 `catch` 块匹配异常类型，则执行 `finally` 块中的代码（如果存在）。\n\n![try\
  \ 块中代码发生异常后发生事件序列的示意图示。](img/Image00077.jpg)\n\n**图 7-18**\n\n接下来的“尝试一下”（Try It\
  \ Out）演示了如何处理异常。它展示了以几种方式抛出和处理异常，以便你看到这些是如何运作的。\n\n### 抛出表达式 (Throw Expressions)\n\
  \n在之前的“尝试一下”中，`throw` 仅在执行编程操作的代码语句。你也可以像这里在表达式中使用 `throw`：\n\n```cs\n friend ??\
  \ throw new ArgumentNullException(paraName: nameof(friend), message: \"null\") \n\
  ```\n\n此代码段使用了双问号（`??`），称为*空合并运算符*，用于检查赋值的值是否为 `null`。如果是 `null`，则抛出 `ArgumentNullException`\
  \ 函数。如果值不是 `null`，则将该值赋值给变量。\n\n### 列出和配置异常 (Listing and Configuring Exceptions)\n\
  \n.NET Framework 包含了大量的异常类型，你可以自由地在自己的代码中抛出并处理任何一种异常。IDE 提供了一个对话框用于检查和编辑可用异常，可以通过\
  \ Debug ![image](img/Image00008.gif) Windows ![image](img/Image00008.gif) 异常设置菜单项（或按\
  \ Ctrl+D, E）来调用。图 7-20 显示了异常设置对话框。\n\n![显示异常设置对话框的截图说明，用于检查和编辑可用异常。](img/Image00079.jpg)\n\
  \n**图 7-20**\n\n异常按类别和 .NET 库命名空间列出。你可以通过展开通用语言运行时异常（Common Language Runtime Exceptions）加号查看\
  \ `System` 命名空间中的异常。列表包含了你之前使用的 `System.IndexOutOfRangeException` 异常。\n\n每个异常可以使用异常类型旁边的复选框进行配置。勾选后，调试器将在“抛出”（Thrown）时（中断），导致即使对于已处理的异常也会中断进入调试器。\n\
  \n## 练习 (EXERCISES)\n\n1.  7.1 “使用 `Trace.WriteLine()` 比使用 `Debug.WriteLine()` 好，因为\
  \ `Debug` 版本仅在调试生成中工作。”你同意这个说法吗？如果是，为什么？\n2.  7.2 为一个简单的应用程序提供代码，其中包含一个在 5,000 次循环后生成错误的循环。使用断点在第\
  \ 5,000 次循环产生错误之前进入中断模式。（注意：生成错误的一种简单方法是尝试访问不存在的数组元素，例如在具有 100 个元素的数组中访问 `myArray[1000]`。）\n\
  3.  7.3 “只有当 `catch` 块未执行时，`finally` 代码块才会执行。”正确还是错误？\n4.  7.4 给定以下代码中定义的枚举类型 `orientation`，编写一个使用结构化异常处理\
  \ (SEH) 将 `byte` 类型变量安全地强制转换为 `orientation` 类型变量的应用程序。（注意：你可以使用 `checked` 关键字强制抛出异常，此处显示示例。此代码应在你的应用程序中使用。）\n\
  \n```cs\nenum Orientation : byte\n{\n   North = 1,\n   South = 2,\n   East  = 3,\n\
  \   West  = 4\n}\nmyDirection = checked((Orientation)myByte); \n```\n\n这些练习的答案在附录中。\n\
  \n## ![image](img/Image00002.gif) 本章学到的知识\n\n| **主题** | **核心概念** |\n| --- | ---\
  \ |\n| 错误类型 | 致命错误会导致应用程序完全失败，无论是在编译时（语法错误）还是运行时。语义错误（或逻辑错误）更为隐蔽，可能会导致应用程序运行不正确或不可预测。\
  \ |\n| 输出调试信息 | 你可以编写代码向输出窗口输出有用信息，以便在 IDE 中调试。你通过 `Debug` 和 `Trace` 系列函数来实现这一点，其中\
  \ `Debug` 函数在发布生成中会被忽略。对于生产应用程序，你可能希望将调试输出写入日志文件。你也可以使用跟踪点（tracepoints）输出调试信息。 |\n\
  | 中断模式 | 你可以手动、通过断点、断言或发生未处理的异常时进入中断模式（本质是应用程序暂停的状态）。你可以在代码的任何地方添加断点，并配置断点仅在特定条件下中断执行。在中断模式下，你可以检查变量的内容（借助各种调试信息窗口的帮助）并逐行执行代码以协助你确定错误的位置。\
  \ |\n| 异常 | 异常是运行时发生的错误，你可以对其进行捕获和处理以防止应用程序终止。在调用函数或操作变量时可能会发生许多异常。你也可以使用 `throw`\
  \ 关键字生成异常。 |\n\n\n\n\n\n| 异常处理 | 代码中未处理的异常将导致应用程序终止。你使用 `try`、`catch` 和 `finally`\
  \ 代码块来处理异常。`try` 块标记了启用了异常处理的代码段。`catch` 块包含仅在发生异常时才执行的代码，并可以匹配特定类型的异常。你可以包含多个 `catch`\
  \ 块。`finally` 块指定了在异常处理发生后或在未发生异常且 `try` 块执行完毕后执行的代码。你只能包含一个 `finally` 块，如果你包含了任何\
  \ `catch` 块，则 `finally` 块是可选的。 |\n\n# 8 面向对象编程\n\n## 什么是面向对象编程？\n\n面向对象编程旨在解决传统编程技术中的许多问题。你目前为止看到的编程类型被称为`过程化编程`，它通常会导致所谓的“单体应用程序”，意味着所有功能都包含在几个代码模块中（通常只有一个）。而使用\
  \ OOP 技术时，你通常会使用更多的代码模块，每个模块都提供特定的功能。此外，每个模块都可以与其他模块隔离，甚至是完全独立的。这种模块化的编程方法赋予了你更大的灵活性，并提供了更多代码复用的机会。\n\
  \n为了进一步说明这一点，想象你计算机上的一个高性能应用程序就像一辆顶配赛车。用传统编程技术编写的这辆跑车基本上是一个单一单元。如果你想改进这辆车，就必须将整个单元寄回制造商，让他们的专家技师进行升级，或者直接买一辆新的。然而，如果使用\
  \ OOP 技术，你只需要从制造商处购买一个新引擎，并按照他们的说明自行更换，而无需用锯条去切割车身。\n\n在更传统的应用程序中，执行流通常是简单且线性的。应用程序加载到内存中，从\
  \ A 点开始执行，在 B 点结束，然后从内存中卸载。在此过程中可能会使用其他各种实体，例如存储介质上的文件或显卡的功能，但处理主体发生在一个地方。沿途的代码通常关注通过各种数学和逻辑手段操纵数据。操作方法通常非常简单，使用整数和布尔值等基本类型来构建更复杂的数据表示。\n\
  \n使用 OOP，事情很少是这样线性的。尽管实现了相同的的结果，但实现的方法往往非常不同。OOP 技术深根于数据的结构和含义，以及数据与其他数据之间的交互。这通常意味着在项目的设计阶段投入更多精力，但它具有可扩展的优点。一旦对特定类型的数据表示达成共识，这种共识就可以应用应用程序的后续版本中，甚至是完全全新的应用程序中。这种共识的存在可以极大地缩短开发时间。这解释了赛车例子是如何工作的。这里的共识是“引擎”代码的结构方式，使得新代码（用于新引擎）可以被轻松替换，而无需返回制造商处。它也意味着引擎一旦创建，就可以用于其他用途。例如，你可以把它放在另一辆车里，或者用它来驱动潜水艇。\n\
  \nOOP 通过提供关于数据表示方法的共识，以及关于更抽象实体的结构和用的共识，来简化问题。例如，可以对于发送到打印机等设备输出的数据格式达成共识，还可以与该设备交换数据的方法达成共识，包括它理解的指令等。在赛车的类比中，共识将包括引擎如何连接到油箱、它如何将动力传递给车轮等。\n\
  \n正如该技术的名称所暗示的，这是通过使用对象来实现。\n\n### 什么是对象？\n\n`object` 是 OOP 应用程序的构建块。这个构建块封装了应用程序的一部分，该部分可以是一个进程、一段数据或更抽象的实体。\n\
  \n在最简单的意义上，对象可以非常类似于书中之前过的结构体类型（struct type），包含变量类型和函数类型的成员。包含的变量组成了存储在对象中的数据，包含的函数允许访问对象的功能。稍微复杂的对象可能不维护任何数据；相反，它们可以通过只包含函数来表示一个进程。例如，可以使用一个代表打印机的对象，它将具有允许控制打印机的函数（这样你可以打印文档、测试页等）。\n\
  \nC# 中的对象是从类型创建的，就像你已经看到的变量一样。在 OOP 中，对象的类型通过一个特殊名称来认知，即它的 `class`（类）。你可以使用类定义来`instantiate`（实例化）对象，这意味着创建一个类的真实的、有名的类的\
  \ `instance`（实例）。`instance of a class` 和 `object` 这两个短语在这里的意思相同；但 `class` 和 `object`\
  \ 在根本上是两个完全不同的东西。\n\n在本章中，你将使用`统一建模语言`（UML）语法处理类和对象。UML 用于对应用程序进行建模，从构建应用程序的对象到它们执行的操作，再到预期的用例。在这里，你只使用这种语言的基础知识，这些将在过程中进行解释。UML\
  \ 是一门专门学科，整本书都致力于此，因此这里不涵盖其更复杂的方面。\n\n图 8‐1 显示了你的打印机类 `Printer` 的 UML 表示。类名显示在框的顶部部分（你稍后会学习底部两个部分）。\n\
  \n![显示 Printer 类的 UML（统一建模语言）表示的示意图](img/Image00080.jpg)\n\n**图 8-1\n\n图 8-2 显示了\
  \ `Printer` 类的一个实例 `myPrinter` 的 UML 表示。\n\n![显示 myPrinter 类的 UML（统一建模语言）表示的示意图](img/Image00081.jpg)\n\
  \n**图 8-2\n\n在这里，实例名首先显示在顶部，然后是它的类名。这两个名称用冒号分隔。\n\n#### 属性和字段\n\n属性和字段提供了对对象包含的数据访问。这种对象数据区分了不同的对象，因为同一类的不同对象在属性和字段中可以存储不同的值。\n\
  \n对象中包含的各种数据共同组该对象的 `state`（状态）。想象一个代表咖啡杯的对象类，称为 `CupOfCoffee`。当你实例化此类（即创建该类的对象）时，你必须为它提供一个状态使其具有意义。在这种情况下，你可以使用属性和字段来允许使用该对象的代码设置咖啡的类型、咖啡是否含有牛奶和/或糖、咖啡是否是速溶咖啡等。一个给定的咖啡杯对象将有一个给定的状态，例如“加牛奶和双糖的哥伦比亚过滤咖啡”。\n\
  \n\n\n\n\n字段和属性都是有类型的，因此你可以将信息作为 `string` 值、`int` 值等存储在其中。然而，属性与字段的区别在于，它们不提供对数据的直接访问。对象可以保护用户免受数据的底层细节，而这些细节并不需要在现有的属性中以一一对应的方式表示。如果你使用一个字段来表示\
  \ `CupOfCoffee` 实例中的糖量，那么用户可以在该字段中放置他们喜欢的任何值，仅受限于存储此信息的类型范围限制。例如，如果你使用 `int` 来存储这些数据，那么用户就可以使用\
  \ −2147483648 到 2147483647 之间的任何值，如 第 3 章 所示。显然，并不是所有值都有意义的，特别是负值，而且某些巨大的正数可能需要一个大得离谱的杯子。如果你使用属性来实现，你可以将该值限制在例如\
  \ 0 到 2 之间的数字。\n\n通常情况下，为状态访问提供属性比提供字段更好，因为你对各种行为有更强的控制权。这种选择不会影响使用对象实例的代码，因为使用属性和字段的语法是相同的。\n\
  \n对象还可以清晰地定义对属性的读写访问权限。某些属性可以是只读的，允许你查看它们的内容但不能更改它们（至少不能直接更改）。这通常是同时读取多个状态片段的有用技术。你可能在\
  \ `CupOfCoffee` 类中有一个名为 `Description` 的只读属性，它在被请求时会返回一个表示该类实例状态的字符串（如之前提供的字符串）。你可能可以通过查询几个属性来组合相同的数据，但像这样的一个属性可能会为你节省时间和精力。你可能还有以类似方式运行的写属性。\n\
  \n除了属性的这种读写访问外，你还可以为字段和属性指定不同类型的访问权限，称为 `accessibility`（可访问性）。访问性决定了哪些代码可以访问这些成员——即它们是对所有代码可见（public）、仅对类内部代码可见（private），还是应该使用一种更复杂的方案（在本章稍后相关时将进行详细介绍）。一种常见的做法是将字段设为私有，并通过公共属性提供对它们的访问。这意味着类内部的代码可以直接访问存储在字段中的数据，而公共属性则保护外部用户免受这些数据的影响并防止他们向其中放置无效内容。公共成员被称为类的\
  \ `exposed`（暴露）。\n\n可视化这一点的一种方法将其与变量作用域等同。例如，私有字段和属性可以被认为是拥有它们的对象的局部变量，而公共字段和属性的作用范围也包含了对象外部的代码。\n\
  \n在类的 UML 表示中，你使用第二个部分来显示属性和字段，如 图 8-3 所示。\n\n![CupOfCoffee 类的图示，在第二部分定义了五个成员（属性或字段）。](img/Image00082.jpg)\n\
  \n**图 8-3]\n\n这是 `CupOfCoffee` 类的表示，如前所述，它定义了五个成员（属性或字段，因为 UML 中不区分两者）。每个条目都包含以下信息：\n\
  \n*   访问性（Accessibility）：`+` 符号表示公共成员，`−` 符号表示私有成员。通常，本章的图表中不显示私有成员，因为这些信息是类内部的。不提供关于读写访问权限的信息。\n\
  \n*   成员名称。\n\n*   成员类型。\n\n使用冒号来分隔成员名称和类型。\n\n### 方法\n\n`Method` 是指代对象暴露的函数的术语。它们可以像任何其他函数一样被调用，并以相同的方式使用返回值和参数——你在\
  \ 第 6 章 中详细研究过函数。\n\n方法用于访问对象的功能。与字段和属性一样，它们可以是公部的或私有的，根据需要限制对外部代码的访问。它们通常利用对象的状态来影响其操作，并在需要时可以访问私有成员（如私有字段）。例如，`CupOfCoffee`\
  \ 类可能会定义一个名为 `AddSugar()` 的方法，与设置相应的 `Sugar` 属性相比，它为增加糖量提供了更具可读性的语法。\n\n在 UML 中，类框的第三部分显示方法，如\
  \ 图 8-4 所示。\n\n![CupOfCoffee 类的图示，在第三部分定义了一个名为 AddSugar() 的方法。](img/Image00083.jpg)\n\
  \n**图 8-4]\n\n这里的语法与字段和属性的语法相似，区别在于结尾显示的类型是返回值，并且显示了方法参数。每个参数在 UML 中使用以下标识符之一显示：`return`、`in`、`out`\
  \ 或 `inout`。\n\n\n\n\n\n所有类定义都包含至少一个构造函数。这些构造函数可以包含一个`默认构造函数`（default constructor），这是一个与类名相同且无参数的方法。类定义还可能包含多个带有参数的构造方法，称为`非默认构造函数`（nondefault\
  \ constructors）。这些方法使得实例化对象的代码能够以多种方式进行，可能为存储在对象中的数据提供初始值。\n\n在 C# 中，使用 `new` 关键字调用构造函数。例如，你可以按照以下方式使用默认构造函数实例化\
  \ `CupOfCoffee` 对象：\n\n```\n CupOfCoffee myCup = new CupOfCoffee(); \n```\n\n也可以使用非默认构造函数实例化对象。例如，`CupOfCoffee`\
  \ 类可能有一个非默认构造函数，它使用一个参数在实例化时设置豆的类型：\n\n```\n CupOfCoffee myCup = new CupOfCoffee(\"\
  Blue Mountain\"); \n```\n\n构造函数像字段、属性和方法一样，可以是公共的也可以是私有的。类的外部代码无法使用私有构造函数实例化对象；它必须使用公共构造函数。通过这种方式，你可以强制类的用户使用非默认构造函数（通过将默认构造函数设为私有）。\n\
  \n有些类没有公共构造函数，这意味着外部代码无法实例化它们（它们被称为`不可创建的`，noncreatable）。然而，这并不意味着它们完全没用，正如你很快就会看到的。\n\
  \n### 析构函数\n\n析构函数被 .NET Framework 用于清理对象。通常情况下，你不需要为析构方法提供代码；相反，默认操作会为你完成工作。但是，如果对象实例被删除之前需要执行某些重要操作，你可以提供特定的指令。\n\
  \n例如，当变量超出作用范围时，你的代码可能无法访问它；但它可能仍然存在计算机内存的某处。只有当 .NET 运行时执行垃圾回收时，实例才会被完全销毁。\n\n\
  ### 静态和实例类成员\n\n除了特定于对象实例的属性、方法和字段成员外，还可以拥有`static`（我们的 Visual Basic 用户通常称为 `shared`）成员，这些可以是方法、属性或字段。静态成员在类的实例之间共享，因此它们可以被视为给定类对象的全局变量。静态属性和字段允许你访问独立于任何对象实例的数据，而静态方法允许你执行与类类型相关但并非特定于对象实例的命令。使用静态成员时，事实上你甚至不需要实例化对象。\n\
  \n例如，你一直在使用的 `Console.WriteLine()` 和 `Convert.ToString()` 方法就是静态的。你任何时候都不需要实例化 `Console`\
  \ 或 `Convert` 类（事实上，如果你尝试，你会发现无法这样做，正如前面讨论过的，这些类的构造函数不是公开访问的）。如果你在程序开头包含 `using\
  \ static System.Console;` 声明，则不需要 `Console.`，你可以直接调用 `WriteLine()`。\n\n在许多此类情况下，静态属性和方法可以发挥良好的效用。例如，你可能使用一个静态属性来跟踪创建了多少个类实例。在\
  \ UML 语法中，类的静态成员以下划线形式显示，如图 8‐5 所示。\n\n![图示说明：在 UML 语法中，类的静态成员以下划线形式显示。](img/Image00084.jpg)\n\
  \n**图 8-5**\n\n### 静态构造函数\n\n在类中使用静态成员时，你可能希望先初始化这些成员。你可以在声明静态成员时为其提供初始值，但有时你可能想进行更复杂的初始化，或者可能在赋值值或允许静态方法执行之前执行某些操作。\n\
  \n你可以使用静态构造函数来执行此类初始化任务。一个类可以有一个静态构造函数，它不能有任何访问修饰符且不能有任何参数。静态构造函数永远无法被直接调用；相反，它在发生以下情况之一时执行：\n\
  \n*   创建包含静态构造函数的类实例。\n*   访问包含静态构造函数的类的静态成员。\n\n在这两种情况下，静态构造函数都在类实例化或访问静态成员之前首先调用。无论创建了多少个实例，它的静态构造函数只会被调用一次。为了区分静态构造函数与本章介绍的构造函数，所有非静态构造函数称为`实例构造函数`（instance\
  \ constructors）。\n\n### 静态类\n\n通常，你想要使用仅包含静态成员且不能用于实例化对象的类（例如 `Console`）。实现此点的简便方法不是将类的构造函数设为私有，而是使用\
  \ `static class`（静态类）。静态类只能包含静态成员且不能有实例构造函数，因为这意味着它永远无法被实例化。然而，静态类可以像前节描述的那样拥有静态构造函数。\n\
  \n## OOP 技术\n\n现在你已经了解了基础知识，以及对象是什么以及它们如何工作，你可以花些时间查看对象的其他特性。本节涵盖了所有内容：\n\n*   接口\n\
  *   继承\n*   多态\n*   对象之间的关系\n*   运算符重载\n*   事件\n*   引用类型与值类型\n\n### 接口\n\n`interface`（接口）是公共实例（即非静态）方法和属性的集合，组合在一起以封装特定功能。在定义接口后，你可以在类中实现它。这意味着该类将支持接口指定的所有属性和成员。\n\
  \n接口不能独立存在。你不能像实例化类那样“实例化接口”。此外，接口不包含实现成员的任何代码；它只是定义成员。实现来自实现接口的类。\n\n在之前的咖啡示例中，你可能会将许多更通用的属性和方法分组为一个接口，例如\
  \ `AddSugar()`、`Milk`、`Sugar` 和 `Instant`。你可以给这个接口命名为 `IHotDrink`（接口名称通常以大写 `I`\
  \ 开头）。你可以在其他对象上使用此接口，可能是 `CupOfTea` 类的对象。因此，你可以以类似的方式处理这些对象，它们仍然可以拥有自己的属性（例如，`CupOfCoffee`\
  \ 的 `BeanType` 和 `CupOfTea` 的 `LeafType`）。\n\n在 UML 中，对象上实现的接口使用*棒棒糖*语法（连接到圆形的线）。在图\
  \ 8‐6 中，`IHotDrink` 的成员以类类语法划分在独立的框中。\n\n![图示说明：IHotDrink 的成员以类类语法划分在独立的框中。](img/Image00085.jpg)\n\
  \n**图 8-6**\n\n\n\n\n一个类可以支持多个接口，而多个类也可以支持同一个接口。因此，接口的概念让用户和其他开发者的工作变得更加简单。例如，你可能编写了一些代码来使用具有特定接口的对象。只要你不使用该对象的其他属性和方法，就可以将一个对象替换为另一个对象（例如，使用前面所示的\
  \ `IHotDrink` 接口的代码可以同时与 `CupOfCoffee` 和 `CupOfTea` 实例工作）。此外，对象的本身的开发者可以为你提供一个更新后的对象版本，只要它支持你正在使用的接口，在你的代码中使用这个新版本就会很容易。\n\
  \n一旦接口被发布——也就是说，它已经提供给其他开发者或终端用户——那么不更改它就是一种良好的做法。考虑这种问题的一种方式是，将接口想象成类创建者与类消费者之间的契约。你实际上是在说：“每一个支持接口\
  \ `X` 的类都支持这些方法和属性。”如果接口之后发生变化（可能是由于底层代码的升级），这可能会导致该接口的消费者运行不正确，甚至导致失败。相反，你应该创建一个继承自旧接口的新接口，可能包含一个版本号，例如\
  \ `X2`。这已成为处理此类问题的标准方式，你可能会经常遇到带编号的接口。\n\n### 可释放对象\n\n一个特别感兴趣的接口是 `IDisposable`。支持\
  \ `IDisposable` 接口的对象必须实现 `Dispose()` 方法——也就是说，它必须为该方法提供代码。当对象不再需要时可以调用此方法（例如在它离开作用范围之前），并应该用于释放任何关键资源，否则这些资源可能会一直留存，直到垃圾回收时调用析构方法。这让你对对象所使用的资源有了更多的控制。\n\
  \nC# 允许你使用一种可以极佳利用这种方法的结构。`using` 关键字允许你在代码块中初始化一个使用关键资源的对象，在代码块结束时会自动调用 `Dispose()`：\n\
  \n```\n<ClassName> <VariableName> = new <ClassName>();\n…\nusing (<VariableName>)\n\
  {\n   …\n} \n```\n\n或者，你可以在 `using` 语句中作为部分来实例化对象 `<VariableName>`：\n\n```\nusing\
  \ (<ClassName> <VariableName> = new <ClassName>())\n{\n   …\n} \n```\n\n在这两种情况下，变量\
  \ `<VariableName>` 在 `using` 代码块内都是可用的，并在结束时自动释放（也就是说，当代码块执行完毕时调用 `Dispose()`）。\n\
  \n### 继承\n\n继承是面向对象编程（OOP）最重要的特性之一。任何类都可以 `inherit` 另一个类，这意味着它将拥有其所自自类的所有成员。在 OOP\
  \ 术语中，被继承的（派生自）类是 `parent` 类（也称为 `base` 类）。C# 中的类只能直接派自单个基类，尽管该基类当然可以有它自己的基类，依此类推。\n\
  \n继承允许你从一个单一、更通用的基类扩展或创建更具体的类。例如，考虑一个代表农场动物的类（正如八十岁的开发者 Old MacDonald 在他的牲畜应用程序中使用那样）。这个类可能被称为\
  \ `Animal`，并拥有如 `EatFood()` 或 `Breed()` 等方法。你可以创建一个名为 `Cow` 的派生类，它支持所有这些方法，但可能还会提供自己的方法，如\
  \ `Moo()` 和 `SupplyMilk()`。你还可以创建另一个派生类 `Chicken`，它带有 `Cluck()` 和 `LayEgg()` 方法。\n\
  \n在 UML 中，你使用箭头表示继承，如 图 8-7 所示。\n\n![图示了创建另一个派生类 Chicken，带有 Cluck() 和 LayEgg() 方法，使用箭头进行指示。](img/Image00086.jpg)\n\
  \n**图 8-7**](#text00011.html_R_c08-fig-0007)\n\n在使用从基类的继承时，成员的可访问性问题变成了一个重要问题。基类的私有成员在派生类中无法访问，但公共成员可以。然而，公共成员对于派生类和外部代码都是可见的。因此，如果你只能使用这两个级别的访问权限，你就无法拥有一个既能被基类和派生类访问，又不能被外部代码访问的成员。\n\
  \n为了解决这个问题，有第三种访问权限 `protected`，其中只有派生类可以访问某个成员。对于外部代码来说，这与私有成员是等同的——在两种情况下它都无法访问。\n\
  \n在定义成员的保护级别之外，你还可以为它定义继承行为。基类的成员可以是 `virtual` 的，这意味着该成员可以被它的继承类重写。因此，派生类可以为该成员提供替代实现。这种替代实现并没有删除原始代码（原始代码仍然可以在类内部访问），但它使其免受外部代码的干扰。如果没有提供替代方案，那么任何通过派生类使用该成员的外部代码将自动使用该成员的基类实现。\n\
  \n在动物示例中，你可以将 `EatFood()` 为 `virtual`，并在任何派生类上为它提供新的实现——例如，仅在 `Cow` 上。\n\n![图示了如何使\
  \ EatFood() 变为 virtual 并在任何派生类上为它提供新的实现。](img/Image00087.jpg)\n\n**图 8-8**](#text00011.html_R_c08-fig-0007)\n\
  \n基类也可以被定义为 `abstract` 类。抽象类无法实例化；要使用它需要继承。抽象类可以抽象成员，这些成员在基类中没有实现，因此必须在派生类中提供实现。如果\
  \ `Animal` 是一个抽象类，那么 UML 将如 图 8-9 所示。\n\n![图示了派生类 Chicken 和 Cow 中的 EatFood() 和 Breed()。](img/Image00088.jpg)\n\
  \n**图 8-9**](#text00011.html_R_c08-fig-0009)\n\n在 图 8-9 中，`EatFood()` 和 `Breed()`\
  \ 都出现在派生类 `Chicken` 和 `Cow` 中，这意味着这些方法是抽象的（因此必须在派生类中重写）或者是虚的（在这种情况下，它们在 `Chicken`\
  \ 和 `Cow` 中被重写）。当然，抽象基类也可以提供成员的实现，这是常见的。无法实例化抽象类并不意味着你不能其中封装功能。\n\n最后，类可以是 `sealed`\
  \ 的。密封类不能作为基类使用，因此不存在派生类。\n\nC# 为所有对象提供了一个公共基类，称为 `object`（它是 .NET 框架中 `System.Object`\
  \ 类的别名）。你将在第 9 章](#text00012.html_c09) 中详细查看该类。\n\n### 多态\n\n继承的一个结果是，派自基类的类在它们暴露的方法和属性上存在重叠。由于如此，通常可以使用相同的语法来处理从具有共同基类型的类的实例化对象。例如，如果一个名为\
  \ `Animal` 的基类有一个名为 `EatFood()` 的方法，那么从派生类调用该方法的语法将是类似的：\n\n\n\n\n\n```\nCow myCow\
  \ = new Cow();\n\nChicken myChicken = new Chicken();\n\nmyCow.EatFood();\n\nmyChicken.EatFood();\
  \ \n```\n\n多态将此更进了一步。你可以将一个派生类型的变量赋值给基类型之一的变量，如下所示：\n\n```\n Animal myAnimal = myCow;\
  \ \n```\n\n这不需要任何类型转换。然后，你可以通过该变量调用基类的方法：\n\n```\n myAnimal.EatFood(); \n```\n\n\
  这将导致调用派生类中 `EatFood()` 的实现。请注意，你不能以相同的方式调用定义在派生类的方法。以下代码将无法工作：\n\n```\n myAnimal.Moo();\
  \ \n```\n\n然而，你可以将基类类型变量转换为派生类变量，并以这种方式调用派生类的方法：\n\n```\n Cow myNewCow = (Cow)myAnimal;\n\
  \nmyNewCow.Moo(); \n```\n\n如果原始变量的类型不是 `Cow` 或派生自 `Cow` 的类，则此转换将抛出异常。有方法可以确定对象的类型，你将在下一节中学习。\n\
  \n多态是一种极其有用的技术，用于对源自单个类的不同对象执行任务，且代码量最少。不仅仅是共享相同父类的类才能利用多态。只要在它们的继承层次中有一个共同类，就可以以相同的方式处理例如，子类和孙子类。\n\
  \n在此进一步说明一点，请记住在 C# 中，所有类都派生自继承层次根底的基类 `object`。因此，可以将所有对象都视为 `object` 类的实例。这就是为什么\
  \ `WriteLine()` 在构建字符串时可以处理几乎无限的参数组合。第一个参数之后的每个参数都被视为 `object` 实例，从而允许将任何对象的输出写入屏幕。为了实现这一点，会调用\
  \ `ToString()` 方法（它是 `object` 的成员方法）。你可以重写此方法以为你的类提供合适的实现，或者简单地使用默认值，它返回类名（根据其所属的任何命名空间进行限定限定）。\n\
  \n### 接口多态\n\n虽然你不能像实例化对象那样实例化接口，但你可以拥有一个接口类型的变量。然后，你可以使用该变量访问支持该接口的对象上暴露的方法和属性。\n\
  \n例如，假设不是使用 `Animal` 基类来提供 `EatFood()` 方法，而是将此 `EatFood()` 方法放在一个名为 `IConsume` 的接口上。`Cow`\
  \ 和 `Chicken` 类都可以支持此接口，唯一的区别是它们被强制为 `EatFood()` 提供实现，因为接口不包含任何实现。你可以使用如下所示的代码访问此方法：\n\
  \n```\n Cow myCow = new Cow();\n\nChicken myChicken = new Chicken();\n\nIConsume\
  \ consumeInterface;\n\nconsumeInterface = myCow;\n\nconsumeInterface.EatFood();\n\
  \nconsumeInterface = myChicken;\n\nconsumeInterface.EatFood(); \n```\n\n这为多个对象以相同方式调用提供了一种简单的方法，并且不依赖于共同基类。例如，此接口可以由名为\
  \ `VenusFlyTrap` 的类实现，该类派生自 `Vegetable` 而不是 `Animal`：\n\n```\n VenusFlyTrap myVenusFlyTrap\
  \ = new VenusFlyTrap();\n\nIConsume consumeInterface;\n\nconsumeInterface = myVenusFlyTrap;\n\
  \nconsumeInterface.EatFood(); \n```\n\n在前面的代码段中，调用 `consumeInterface.EatFood()`\
  \ 将导致调用 `Cow`、`Chicken` 或 `VenusFlyTrap` 类的 `EatFood()` 方法，取决于哪个实例被分配给了接口类型变量。\n\
  \n在此注意，派生类继承了其基类支持的接口。在前面的第一个示例中，可能是 `Animal` 和 `Chicken` 都支持 `IConsume`。\n\n###\
  \ 对象之间的关系\n\n继承是让派生类继承其基类支持的接口。在前面的示例中...（此处由于原文存在重复或逻辑混乱部分）。在某些情况下，对象之间的关系变得重要。\n\
  \n本节简要查看以下内容：\n\n- **包含（Containment）**：一个类包含另一个。这类似于数组，但允许包含类控制被包含类。\n- **集合（Collections）**：一个类作为多个实例的容器。这类似于数组，但集合具有额外的功能，如索引、调整大小等。\n\
  \n\n\n\n\n在 UML 中，你可以将其可视化，正如 图 8‐11 所示。图 8‐11 中不包含成员变量（Members），因为该图展示的是它们之间的关系。连接线末端的数字表示一个\
  \ `Animals` 对象将包含零个或多个 `Animal` 对象。你可以在 第 11 章 中更详细地查看集合。\n\n![图示说明，可以可以设计 Animals\
  \ 类，以便通过其名称访问给定的 Animal 对象。](img/Image00090.jpg)\n\n`图 8‐11`\n\n### 运算符重载\n\n在书的前面部分，你已经看到如何使用操作符来处理简单变量类型。在某些情况下，对从自定义类实例化的对象使用操作符是有逻辑的。这是可能的，因为类可以包含有关如何处理操作符的指令。\n\
  \n例如，你可能会为 `Animal` 类添加一个名为 `Weight`（重量）的新属性。然后你可以使用以下代码来比较动物的重量：\n\n```\n if (cowA.Weight\
  \ > cowB.Weight)\n{\n   …\n} \n```\n\n通过运算符重载，你可以在代码中提供一种隐式地（implicitly）使用 `Weight`\
  \ 属性的逻辑，这样你就可以编写出如下的代码：\n\n```\n if (cowA > cowB)\n{\n   …\n} \n```\n\n在这里，大于运算符（`>`）被`重载`（overloaded）了。被重载的运算符是你编写了代码来执行相关操作的操作符——这些代码被添加到所操作的类之一的类定义中。在前面的示例中，由于你正在使用两个\
  \ `Cow` 对象，因此运算符重载定义包含在 `Cow` 类中。你也可以重载运算符，以相同的方式与不同的类一起工作，其中一个（或两个）类定义包含了实现此操作的代码。\n\
  \n你只能通过这种方式重载现有的 C# 操作符；你不能创建新的操作符。然而，你可以为 `+` 或 `>` 等运算符的一元（单操作数）和二元（双操作数）用法提供实现。你可以在\
  \ 第 13 章 查看如何在 C# 中这样做。\n\n### 事件\n\n对象可以在处理过程中触发（并消耗）`事件`（events）。事件是重要的发生情况，你可以在代码的其他部分对其采取操作，类似于异常（但比异常更强大）。例如，你可能希望在\
  \ `Animal` 对象被添加到 `Animals` 集合时执行某些特定代码，这些代码既不属于 `Animals` 类，也不属于调用 `Add()` 方法的代码。要实现这一点，你需要在代码中添加一个`事件处理器`（event\
  \ handler），这是一种特殊的函数，当事件发生时会被调用。你还需要配置此处理程序来监听你感兴趣的事件。\n\n你可以创建`事件驱动型应用程序`（event-driven\
  \ applications），它们比你想象的要多得多。例如，请记住基于 Windows 的应用程序完全依赖于事件。你进行的每一次按钮点击或滚动条拖动都是通过事件处理实现的，因为事件是由鼠标或键盘触发的。\n\
  \n在本章的后半部分，你将看到这在 Windows 应用程序中是如何工作的，并在 第 13 章 中对事件有更深入的讨论。\n\n### 引用类型与值类型\n\n\
  C# 中的数据以两种方式存储在变量中，取决于变量的类型。这种类型将分为两类之一：引用或值。其区别如下：\n\n*   值类型（Value types）将自身及其内容存储在内存中的一处（称为栈，stack）。\n\
  *   引用类型（Reference types）持有指向内存中其他地方（称为堆 `heap`）的引用，内容存储在何处。\n\n事实上，在使用 C# 时你不需要过度担心这一点。到目前为止，你使用\
  \ `string` 变量（引用类型）和其他其他简单变量（大部分是值类型，如 `int`）的方式几乎是完全相同的。\n\n值类型和引用类型之间的一个关键区别是，值类型始终包含一个值，而引用类型可以为\
  \ `null`，反映了它们不包含值的事实。然而，通过使用`可空类型`nullable types），可以创建一个在这方面表现得像引用类型的值类型（即它可以为\
  \ `null`）。当你查看泛型 generic types（包括可空类型）高级技术时，会在 第 12 章 中，你使用 Windows Presentation\
  \ Foundation (WPF) 在 C# 中创建了一个简单的桌面应用程序。WPF 桌面应用程序严重依赖 OOP 技术，本节将探讨这一点，以说明本章提到的某些观点。接下来的“尝试一下”（Try\
  \ It Out）将让你完成一个简单的示例。\n\n## 练习题\n\n1.  8.1 下列哪些是 OOP 中真实的访问权限级别？\n    1.  Friend（友元）\n\
  \    2.  Public（公共）\n    3.  Secure（安全）\n    4.  Private（私有）\n    5.  Protected（保护）\n\
  \    6.  Loose（松散）\n    7.  Wildcard（通配符）\n2.  8.2 “你手动调用对象的析构函数会浪费内存。”这正确还是错误？\n\
  3.  8.3 调用静态方法需要创建对象吗？\n4.  8.4 为以下类和接口绘制一个与书中所示类似的 UML 图：\n    *   一个抽象类 `HotDrink`，具有\
  \ `Drink`、`AddMilk` 和 `AddSugar` 方法，以及 `Milk` 和 `Sugar` 属性\n    *   接口 `ICup`，具有\
  \ `Refill` 和 `Wash` 方法，以及 `Color` 和 `Volume` 属性\n    *   类 `OfCoffee` 继承 `HotDrink`，实现\
  \ `ICup` 接口，并具有属性 `BeanType`\n    *   类 `OfTea` 继承 `HotDrink`，实现 `ICup` 接口，并具有属性\
  \ `LeafType`\n5.  8.5 编写函数代码，将前面示例中的任何杯对象作为参数。该函数应对接收到的任何杯对象调用 `AddMilk`、`Drink`\
  \ 和 `Wash` 方法。\n\n练习答案可以在附录中找到。\n\n![image](img/Image00002.gif) 本章你学到了\n\n| **主题**\
  \ | **关键概念** |\n| --- | --- |\n| 对象与类 | 对象是 OOP 应用程序的构建模块。类是用于实例化对象的类型定义。对象可以包含数据并暴露其他代码可以使用的操作。数据可以通过属性对外部代码可见，操作可以通过方法对外部代码可见。属性和方法统称为类成员。属性允许读取、写入或两者。类成员可以是公共（对所有代码可见）或私有（仅对类定义内部的代码可见）。在\
  \ .NET 中，一切都是对象。 |\n| 对象生命周期 | 对象通过调用其构造函数进行实例化。当对象不再需要时，通过执行其析构函数销毁。为了清理对象，通常需要手动释放它。\
  \ |\n| 静态和实例成员 | 实例成员仅对类的实例可用。静态成员仅通过类定义直接可用，不与实例关联。 |\n| 接口 | 接口是可以在类上实现的公共属性和方法的集合。实例类型变量可以分配任何类定义实现了该接口的对象的值。此时，通过该变量只能访问接口定义的成员。\
  \ |\n\n\n\n\n\n| 继承 | 继承允许一个类定义派生自另一个类的机制。一个类从其父类继承成员，且它只能有一个父类。子类无法访问父类中的私有成员，但可以定义受保护成员，这些成员仅在该类或派生自该类的类内部可用。子类可以重写父类中定义为虚方法的成员。所有类都有一条继承链，并终止于\
  \ `System.Object`，该类在 C# 中的别名为 `object`。 |\n| 多态 | 从派生类实例化的所有对象都可以被视为父类的实例。 |\n\
  | 对象之间的关系和特性 | 对象可以包含其他对象，也可以表示其他对象的集合。为了在表达式中操作对象，你通常需要通过运算符重载来定义运算符如何与对象工作。对象可以暴露由于某些内部过程触发的事件，客户端代码可以通过提供事件处理器来响应事件。\
  \ |\n\n# 9 定义类\n\n## C# 中的类定义\n\nC# 使用 `class` 关键字来定义类：\n\n```csharp\nclass MyClass\n\
  {\n   // 类成员。\n} \n```\n\n这段代码定义了一个名为 `MyClass` 的类。一旦定义了类，你就可以在项目中任何可以访问该定义的地方对其实例化。默认情况下，类被声明为\
  \ `internal`，这意味着只有当前项目中的代码可以访问它们。你可以使用 `internal` 访问修饰符关键字显式地指定这一点（尽管你不必这样做）：\n\
  \n```csharp\ninternal\nclass MyClass\n{\n   // 类成员。\n} \n```\n\n或者，你可以指定该类是公共的（public），并且也应该允许其他项目中的代码访问。要这样做，你使用\
  \ `public` 关键字：\n\n```csharp\npublic\nclass MyClass\n{\n   // 类成员。\n} \n```\n\n\
  除了这两个访问修饰符关键字外，你还可以指定类是 `abstract`（抽象的，不能实例化，只能继承，并且可以拥有抽象成员）或 `sealed`（密封的，不能继承）。要实现这一点，你使用这两个互斥关键字中的一个：`abstract`\
  \ 或 `sealed`。抽象类的声明如下：\n\n```csharp\npublic abstract\nclass MyClass\n{\n   // 类成员，可以是抽象的。\n\
  } \n```\n\n在这里，`MyClass` 是一个公共抽象类，而内部抽象类也是可能的。\n\n密封类的声明如下：\n\n```csharp\npublic\
  \ sealed\nclass MyClass\n{\n   // 类成员。\n} \n```\n\n与抽象类一样，密封类可以是公共的或内部的。\n\n继承也可以在类定义中指定。你只需要在类名后跟一个冒号，然后跟上基类名：\n\
  \n```csharp\npublic class MyClass : MyBase\n{\n   // 类成员。\n} \n```\n\nC# 的类定义中只允许一个基类；如果你继承自一个抽象类，你必须实现所有继承的抽象成员（除非派生类本身也是抽象的）。\n\
  \n编译器不允许派生类的访问权限高于其基类。这意味着内部类可以继承自一个公共基类，但公共类不能继承自一个内部基类。这段代码是合法的：\n\n```csharp\n\
  public\nclass MyBase\n{\n   // 类成员。\n}\n\ninternal\nclass MyClass : MyBase\n{\n\
  \   // 类成员。\n} \n```\n\n以下代码将无法编译：\n\n```csharp\ninternal\nclass MyBase\n{\n   //\
  \ 类成员。\n}\n\npublic\nclass MyClass : MyBase\n{\n   // 类成员。\n} \n```\n\n如果没有使用基类，该类将仅继承自基类\
  \ `System.Object`（它在 C# 中的别名为 `object`）。最终，所有类的继承层次结构根部都是 `System.Object`。你稍后会更详细地查看这个基础类。\n\
  \n除了通过这种方式指定基类外，你还可以在冒号字符之后指定所支持的接口。如果指定了基类，它必须是冒号后的第一个项，接口在随后指定。如果没有指定基类，则直接在冒号后指定指定接口。必须使用逗号来分隔基类名（如果有）和接口名称。\n\
  \n例如，你可以按照如下方式为 `MyClass` 添加一个接口：\n\n```csharp\npublic class MyClass : IMyInterface\n\
  {\n   // 类成员。\n} \n```\n\n在任何支持该接口的类中，都必须实现所有接口成员，尽管如果你不想对特定的接口成员执行任何操作，你也可以提供一个“空”实现（不包含功能性代码），并且你可以在抽象类中将接口成员实现为抽象成员。\n\
  \n以下声明是无效的，因为基类 `MyBase` 不是继承列表中的第一个项：\n\n```csharp\npublic class MyClass : IMyInterface,\
  \ MyBase\n{\n   // 类成员。\n} \n```\n\n指定基类和接口的正确方法如下：\n\n```csharp\npublic class MyClass\
  \ : MyBase, IMyInterface\n{\n   // 类成员。\n} \n```\n\n记住，多个接口是可能的，因此以下内容也是有效的：\n\n\
  ```csharp\npublic class MyClass : MyBase, IMyInterface, IMySecondInterface\n{\n\
  \   // 类成员。\n} \n```\n\n表 9-1 显示了类定义允许的访问修饰符组合。\n\n| **修饰符** | **描述** |\n| --- |\
  \ --- |\n| 无或 `internal` | 仅当前项目可见。 |\n| `public` | 处处可见。 |\n| `abstract` 或 `internal`\
  \ | 仅当前项目可见，不能实例化，只能继承。 |\n| `public` `abstract` | 处处可见，不能实例化，只能继承。 |\n| `sealed`\
  \ 或 `internal` | 仅当前项目可见，不能实例化，只能继承。 |\n| `public` `sealed` | 处处可见，不能实例化，只能继承。 |\n\
  \n**表 9-1:** 类定义的访问修饰符\n\n### 接口定义\n\n接口的声明方式与类相似，但使用的是 `interface` 关键字而不是 `class`：\n\
  \n```csharp\ninterface IMyInterface\n{\n   // 接口成员。\n}\n```\n\n访问修饰符关键字 `public`\
  \ 和 `internal` 的用法相同；与类一样，接口默认为内部的。要使接口公共可见，必须使用 `public` 关键字：\n\n```csharp\npublic\n\
  interface IMyInterface\n{\n   // 接口成员。\n} \n```\n\n不允许使用 `abstract` 和 `sealed`，因为这两个修饰符在接口上下文中没有意义（它们不包含实现，因此无法直接实例化，并且必须是可的才有用）。\n\
  \n接口继承的指定方式与类继承相似。这里的主要区别是可以使用多个基接口，如下所示：\n\n```csharp\npublic interface IInterface\
  \ : IMyBaseInterface, IMyBaseInterface2\n{\n   // 接口成员。\n}\n```\n\n接口不是类，因此不继承自\
  \ `System.Object`。然而，`System.Object` 的成员可以通过接口类型变量可用，纯是为了方便。此外，正如前面讨论的，无法以与类的方式实例化接口。下面的“尝试一试”提供了类定义的示例，以及使用这些类的代码。\n\
  \n## SYSTEM.OBJECT\n\n由于所有类都继承自 `System.Object`，因此所有类都可以访问该类的受保护和公共成员。因此，查看这些内容是值得的。`System.Object`\
  \ 包含了表 9-2 中描述的方法。\n\n| **方法** | **返回类型** | **虚方法** | **静态** | **描述** |\n| --- |\
  \ --- | --- | --- | --- |\n\n\n\n\n\n| 方法 | 返回类型 | 可重写 | 虚拟 | 描述 |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| `Object()` | N/A | 否 | 否 | `System.Object` 类型的构造函数。由派生类型的构造函数自动调用。\
  \ |\n| `~Object()`（也称为 `Finalize()`——见下一节） | N/A | 否 | 否 | `System.Object` 类型的析构函数。由派生类型的析构函数自动调用；不能手动调用。\
  \ |\n| `Equals(object)` | `bool` | 是 | 否 | 调用此方法的对象与另一个对象进行比较，如果它们相等则返回 `true`。默认实现检查对象参数是否引用了同一个对象（因为对象是引用类型）。如果你想以不同的方式比较对象（例如比较两个对象的状态），可以重写此方法。\
  \ |\n| `Equals(object, object)` | `bool` | 否 | 是 | 比较传入的两个对象并检查它们是否相等。此检查使用 `Equals(object)`\
  \ 方法执行。如果两个对象都是空引用，则此方法返回 `true`。 |\n| `ReferenceEquals(object, object)` | `bool`\
  \ | 否 | 是 | 比较传入的两个对象并检查它们是否引用同一个实例。 |\n| `ToString()` | `string` | 是 | 否 | 返回一个与对象实例对应的字符串。默认情况下，这是类类型的限定名称，但可以重写它以提供与类类型适当的实现。\
  \ |\n| `MemberwiseClone()` | `object` | 否 | 否 | 通过创建新对象实例并复制成员来复制对象。这种成员复制不会导致这些成员的新实例。新对象的任何引用类型成员都引用与原始类相同的对象。此方法是受保护的，因此只能在类内部或派生类中使用。\
  \ |\n| `GetType()` | `System.Type` | 否 | 否 | 以 `System.Type` 对象的形式返回对象的类型。 |\n|\
  \ `GetHashCode()` | `int` | 是 | 否 | 在需要的地方用作对象的哈希函数。哈希函数返回一个以某种压缩形式标识对象状态的值的值。 |\n\
  \n**表 9-2：System.Object 的方法**\n\n这些是 .NET Framework 中对象类型必须支持的基本方法，尽管你可能永远不会使用其中某些（或者你只在特殊情况下使用它们，例如\
  \ `GetHashCode()`）。\n\n在使用多态时，`GetType()` 非常有用，因为它允许你根据对象的类型对对象执行不同的操作，而不是像通常那样对所有对象执行相同的操作。例如，如果你有一个接受\
  \ `object` 类型参数的函数（这意味着你可以向它传递几乎任何内容），在遇到某些对象时可能会执行额外的任务。通过结合 `GetType()` 和 `typeof`（一种将类名转换为\
  \ `System.Type` 对象的 C# 运算符）使用，你可以执行如下的比较：\n\n```cs\nif (myObj.GetType() == typeof(MyComplexClass))\n\
  {\n   // myObj 是 MyComplexClass 类的实例。\n}\n```\n\n返回的 `System.Type` 对象的功能远多于此，但这里只涵盖了这一部分。重写\
  \ `ToString()` 方法也非常有用，特别是当对象的内容可以用单个人类可读的字符串轻松表示时。你会在随后的章节中反复看到这些 `System.Object`\
  \ 方法，因此会在会在时学习更多细节。\n\n## 构造函数和析构函数\n\n在 C# 中定义类时，通常没有必要定义相关的构造函数和析构函数，因为如果你在构建代码时没有提供它们，编译器会自动为你添加。然而，如果需要，你可以提供自己的构造函数，以便分别对你的对象进行初始化和清理。\n\
  \n你可以使用以下语法为类添加一个简单的构造函数：\n\n```cs\nclass MyClass\n{\n   public MyClass()\n   {\n\
  \      // 构造函数代码。\n   }\n}\n```\n\n此构造函数的名称与包含它的类相同，没有参数（使其成为该类的默认构造函数），并且是公共的，因此可以使用此构造函数实例化该类的对象（有关此点的更多信息，请参见第\
  \ 8 章）。\n\n你还可以使用私有默认构造函数，它通常用于仅包含静态成员的类。将构造函数设置为私有意味着无法使用该构造函数创建此类的实例（它是不可创建的——再次，参见第\
  \ 8 章的讨论）：\n\n```cs\nclass MyClass\n{\n   private MyClass()\n   {\n      // 构造函数代码。\n\
  \   }\n}\n```\n\n最后，你可以以类似的方式为类添加非默认构造函数，只需提供参数即可：\n\n```cs\nclass MyClass\n{\n\
  \   public MyClass()\n   {\n      // 默认构造函数代码。\n   }\n   public MyClass(int myInt)\n\
  \   {\n      // 非默认构造函数代码（使用 myInt）。\n   }\n}\n```\n\n你可以提供无限数量的构造函数（直到你耗尽内存或用完不同的参数集，所以也许“几乎无限”更合适）。\n\
  \n析构函数使用略有不同的语法声明。.NET 中使用的析构函数（由 `System.Object` 类提供）称为 `Finalize()`，但这不是你声明析构函数时使用的名称。与其重写\
  \ `Finalize()`，不如使用以下代码：\n\n```cs\nclass MyClass\n{\n   ~MyClass()\n   {\n     \
  \ // 析构函数体。\n   }\n}\n```\n\n因此，类的析构函数通过类名声明（与构造函数相同），带有波浪号 (`~`) 前缀。析构代码在垃圾回收发生时执行，以便释放资源。在调用析构函数后，也会隐含调用基类的析构函数，包括对\
  \ `System.Object` 中 `Finalize()` 的调用。这种技术允许 .NET Framework 确保这种情况发生，因为重写 `Finalize()`\
  \ 意味着需要显式执行基类调用，这具有潜在危险（你将在下一章学习）。\n\n### 构造函数执行顺序\n\n如果你在类的构造函数中执行多个任务，将这些代码集中在一个处会非常方便，这与将代码拆分为函数的优点相同，如第\
  \ 6 章所示。\n\n在此之前，你需要仔细观察实例化类时默认发生了什么。除了前面提到的便于初始化代码集中化外，这本身也有价值。在开发过程中，对象的行为往往不符合预期，由于构造函数调用期间的错误——通常是你的类继承体系中的某个基类实例化不正确，或者没有向基类构造函数提供信息。了解对象生命周期中这一阶段发生可以让你更容易解决这类问题。\n\
  \n要实例化派生类，必须先实例化它的基类。要实例化这个基类，必须先实例化它的基类，以此类追溯到 `System.Object`。因此，无论你使用什么构造函数来实例化类，`System.Object.Object()`\
  \ 总是第一个被调用。\n\n\n\n\n无论你在派生类中使用哪种构造函数（默认构造函数或非默认构造函数），除非另有指定，否则都将使用基类的默认构造函数。（稍后我们将看到如何更改此行为。）有一个简短的示例说明了执行顺序。考虑以下对象层次结构：\n\
  \n```cs\n public class MyBaseClass\n{\n   public MyBaseClass()\n   {\n   }\n\n \
  \  public MyBaseClass(int i)\n   {\n   }\n}\n\npublic class MyDerivedClass : MyBaseClass\n\
  {\n   public MyDerivedClass()\n   {\n   }\n\n   public MyDerivedClass(int i)\n \
  \  {\n   }\n\n   public MyDerivedClass(int i, int j)\n   {\n   }\n} \n```\n\n你可以按照如下方式实例化\
  \ `MyDerivedClass`：\n\n```cs\n MyDerivedClass myObj = new MyDerivedClass(); \n```\n\
  \n在这种情况下，将发生以下事件序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass()`\
  \ 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass()` 构造函数将执行。\n\n或者，你可以使用以下代码：\n\n```cs\n\
  \ MyDerivedClass myObj = new MyDerivedClass(4); \n```\n\n序列如下：\n\n* `System.Object.Object()`\
  \ 构造函数将执行。\n* `MyBaseClass.MyBaseClass()` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int\
  \ i)` 构造函数将执行。\n\n最后，你可以使用这个：\n\n```cs\n MyDerivedClass myObj = new MyDerivedClass(4,\
  \ 8); \n```\n\n结果是以下序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass()`\
  \ 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数将执行。\n\n该系统在大多数情况下运行良好，但有时你可能希望对发生的事件有更多的控制权。例如，在最后一个实例化示例中，你可能希望有以下序列：\n\
  \n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int i)` 构造函数将执行。\n\
  * `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数将执行。\n\n使用此序列，你可以将使用 `int i`\
  \ 参数的代码放置在 `MyBaseClass(int i)` 中，这意味着 `MyDerivedClass(int i, int j)` 构造函数的工作量会更少——它只需要处理\
  \ `int j` 参数。（这假设 `int i` 参数在两种情况下具有相同的含义，这可能并不总是如此；但在实践中，通过这种安排，通常是这样的。）C# 允许你在需要时指定这种行为。\n\
  \n要做到这一点，你可以使用*构造函数初始化器*（*constructor initializer*），它由放置在方法定义中冒号后面的代码组成。例如，你可以在派生类的构造函数定义中指定要使用的基类构造函数，如下：\n\
  \n```cs\n public class MyDerivedClass : MyBaseClass\n{\n   …\n   public MyDerivedClass(int\
  \ i, int j) : base(i)\n   {\n   }\n} \n```\n\n`base` 关键字引导 .NET 实例化过程使用具有指定参数的基类构造函数。在这里，你正在使用单个\
  \ `int` 参数（其值是传递给 `MyDerivedClass` 构造函数的参数 `i` 的值），因此将使用 `MyBaseClass(int i)`。这意味着\
  \ `MyBaseClass` 将不会被调用，为你提供了此示例之前列出的事件序列——这正是你在这里想要的。\n\n你还可以使用此关键字为基类构造函数指定字面量，也许使用\
  \ `MyDerivedClass` 的默认构造函数来调用 `MyBaseClass` 的非默认构造函数：\n\n```cs\n public class MyDerivedClass\
  \ : MyBaseClass\n{\n   public MyDerivedClass() : base(5)\n   {\n   }\n   …\n} \n\
  ```\n\n这为你提供了以下序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int\
  \ i)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass()` 构造函数将执行。\n\n除了这个 `base` 关键字，你还可以使用另一个关键字作为构造函数初始化器：`this`。此关键字指示\
  \ .NET 实例化过程在调用指定的构造函数之前使用当前类上的非默认构造函数：\n\n```cs\n public class MyDerivedClass :\
  \ MyBaseClass\n{\n   public MyDerivedClass() : this(5, 6)\n   {\n   }\n   …\n  \
  \ public MyDerivedClass(int i, int j) : base(i)\n   {\n   }\n} \n```\n\n在这里，使用 `MyDerivedClass.MyDerivedClass()`\
  \ 构造函数为你提供了以下序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int\
  \ i)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数将执行。\n\n该系统在大多数情况下运行良好，但有时你可能希望对发生的事件有更多的控制权。例如，在最后一个实例化示例中，你可能希望有以下序列：\n\
  \n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int i)` 构造函数将执行。\n\
  * `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数将执行。\n\n使用此序列，你可以将使用 `int i`\
  \ 参数的代码放置在 `MyBaseClass(int i)` 中，这意味着 `MyDerivedClass(int i, int j)` 构造函数的工作量会更少——它只需要处理\
  \ `int j` 参数。（这假设 `int i` 参数在两种情况下具有相同的含义，这可能并不总是如此；但在实践中，通过这种安排，通常是这样的。）C# 允许你在需要时指定这种行为。\n\
  \n要做到这一点，你可以使用*构造函数初始化器*，它由放置在方法定义中冒号后面的代码组成。例如，你可以在派生类的构造函数定义中指定要使用的基类构造函数，如下：\n\
  \n```cs\n public class MyDerivedClass : MyBaseClass\n{\n   …\n   public MyDerivedClass(int\
  \ i, int j) : base(i)\n   {\n   }\n} \n```\n\n`base` 关键字引导 .NET 实例化过程使用具有指定参数的基类构造函数。在这里，你正在使用单个\
  \ `int` 参数（其值是传递给 `MyDerivedClass` 构造函数的参数 `i` 的值），因此将使用 `MyBaseClass(int i)`。这意味着\
  \ `MyBaseClass` 将不会被调用，为你提供了此示例之前列出的事件序列——这正是你在这里想要的。\n\n你还可以使用此关键字为基类构造函数指定字面量，也许使用\
  \ `MyDerivedClass` 的默认构造函数来调用 `MyBaseClass` 的非默认构造函数：\n\n```cs\n public class MyDerivedClass\
  \ : MyBaseClass\n{\n   public MyDerivedClass() : base(5)\n   {\n   }\n   …\n} \n\
  ```\n\n这为你提供了以下序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int\
  \ i)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass()` 构造函数将执行。\n\n除了这个 `base` 关键字，你还可以使用另一个关键字作为构造函数初始化器：`this`。此关键字指示\
  \ .NET 实例化过程在调用指定的构造函数之前使用当前类上的非默认构造函数：\n\n```cs\n public class MyDerivedClass :\
  \ MyBaseClass\n{\n   public MyDerivedClass() : this(5, 6)\n   {\n   }\n   …\n  \
  \ public MyDerivedClass(int i, int j) : base(i)\n   {\n   }\n} \n```\n\n在这里，使用 `MyDerivedClass.MyDerivedClass()`\
  \ 构造函数为你提供了以下序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int\
  \ i)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int i, int j)` 构造函数将执行。\n\n## VISUAL\
  \ STUDIO 中的工具\n\n### 类视图\n\n在 OOP 开发中，解决方案管理器与一个名为“类视图”的窗口共享空间。此窗口让你一目了然地看到使用的类的特征。\n\
  \n窗口分为两个主要部分，下部分显示类型的成员。注意，当类视图设置中的所有项目都勾选时，显示的内容如图所示。\n\n这里可以使用许多符号，包括表格中所示符号。\n\
  \n![显示类视图中所有项目的截图。](img/Image0097.jpg)\n\n\n\n\n某些条目下方可能会带有其他符号，表示其访问级别（公共条目不显示符号）。这些符号列在表\
  \ 9-4 中。\n\n| **图标** | **含义** | **图标** | **含义** | **图标** | **含义** |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| ![No art work is provided.](img/Image00111.jpg) |\
  \ 私有 | ![No art work is provided.](img/Image00112.jpg) | 受保护 | ![No art work is\
  \ provided.](img/Image00113.jpg) | 内部 |\n\n**表 9-4 :** 额外的类视图图标\n\n不使用任何符号来表示抽象、密封或虚拟条目。\n\
  \n除了可以在此处查看这些信息外，你还可以访问其中许多项目的相关代码。双击某个条目或右键点击并选择 `Go To Definition`（转到定义），即可直接带你进入项目中定义该项目的代码（如果可用）。如果代码不可用（例如在不可访问的基类型中，如\
  \ `System.Object`），则你可以选择 `Browse Definition`（浏览定义），这会将带你进入对象浏览器视图（在下一节中描述）。\n\n\
  图 9-3 中出现的另一个条目是项目引用（Project References）。这让你看到你的项目引用了哪些程序集，在这种情况下，这包括（但不限于）`mscorlib`\
  \ 和 `System` 中的核心 .NET 类型、`System.Data` 中的数据访问类型以及 `System.Xml` 中的 XML 操作类型。这里的引用可以展开，显示在这些程序集中的命名空间和类型。\n\
  \n你可以通过右键点击条目并选择 `Find All References`（查找所有引用）来查找代码中类型和成员的出现情况；搜索结果列表显示在“查找符号结果”窗口中，该窗口以标签页的形式出现在屏幕底部的错误列表显示区域中。你还可以使用类视图窗口重命名条目。如果你这样做，你将获得重命名代码中任何位置该条目引用的选项。这意味着你不需要为类名的拼写错误找借口，因为你可以随心所欲更改它们！\n\
  \n此外，你可以通过名为 `Call Hierarchy`（调用层次结构）的视图导航代码，该视图可以通过类视图窗口中的右键菜单选项 `View Call Hierarchy`（查看调用层次结构）访问。此功能对于查看类成员如何相互交互非常有帮助，你将在下一章中学习它。\n\
  \n### 对象浏览器 (Object Browser)\n\n对象浏览器是类视图窗口的扩展版本，允许你查看项目可用的其他类，甚至是外部类。可以通过自动方式进入（例如，在上一节提到的情况下），也可以通过\
  \ `View ![image](img/Image00008.gif) Object Browser`（查看对象浏览器）手动进入。该视图出现在主窗口中，你可以以与类视图相同的方式进行浏览。\n\
  \n此窗口提供了与类视图相同的信息，但显示了更多 .NET 类型。当选中一个条目时，你会在第三个窗口中获取它的信息，如图 9-4 所示。\n\n![Screenshot\
  \ illustration showing how when an item is selected, one also gets information about\
  \ it in a third window.](img/Image00114.jpg)\n\n**图 9-4**\n\n在这里，选择了 `Console` 类的\
  \ `ReadKey()` 方法。（`Console` 位于 `mscorlib` 程序集的 `System` 命名空间中。）右下角的信息窗口向你显示了方法签名、该方法所属的类以及方法功能的摘要。当你探索\
  \ .NET 类型，或者只是想回想起某个特定类可以做什么时，这些信息可能非常有用。\n\n此外，你可以在自己创建的类型中使用此信息窗口。对之前 Ch09Ex01\
  \ 中创建的代码进行以下更改：\n\n```cpp\n /// <summary>\n\n   /// 此类包含我的程序！\n\n   /// </summary>\n\
  \n   class Program\n   {\n      static void Main(string[] args)\n      {\n     \
  \    MyComplexClass myObj = new MyComplexClass();\n         WriteLine(myObj.ToString());\n\
  \         ReadKey();\n      }\n   } \n```\n\n返回对象浏览器并导航到项目 Ch09Ex01 中的 `Program`\
  \ 类。摘要反映在信息窗口中。这是一个 XML 文档的示例，书中没有涵盖这个主题，但当你有空时，非常值得学习。\n\n### 添加类 (Adding Classes)\n\
  \nVisual Studio 包含可以加速某些常见任务的工具，其中一些适用于面向对象编程（OOP）。这些工具之一是“新建项向导”（Add New Item Wizard），允许你以最少的输入向项目添加新类。\n\
  \n可以通过项目 ![image](img/Image00008.gif) Add New Item…（新建项…）菜单项或通过在解决方案管理器窗口中右键点击项目并选择相应的项来访问。无论何种方式，都会弹出一个对话框，允许你选择要添加的项目。要添加类，请在模板窗口中选择类（Class）项，如图\
  \ 9-4 所示（注：此处原文编号与逻辑冲突，此处按原文翻译）所示，Visual Studio 包含可以加速某些常见任务的工具，其中一些适用于面向对象编程（OOP）。这些工具之一是“新建项向导”（Add\
  \ New Item Wizard），允许你以最少的输入向项目添加新类。\n\n此工具可以通过项目 ![image](img/Image00008.gif) Add\
  \ New Item…（新建项…）菜单项或通过在解决方案管理器窗口中右键点击项目并选择相应的项来访问。无论何种方式，都会弹出一个对话框，允许你选择要添加的项目。要添加类，请在模板窗口中选择类（Class）项，如图\
  \ 9-4 所示。\n\n![Screenshot illustration showing how when an item is selected, one\
  \ also gets information about it in a third window.](img/Image00114.jpg)\n\n*注：由于原文文本在\
  \ `#text00012.html_c09-fig-0004` 处出现了严重的文本重复，翻译时已按原文逻辑处理。*\n\n**图 9-5**\n\n在本章之前的练习中，你手动向\
  \ `Program.cs` 文件中添加了类定义。通常，将类分开存储在不同的文件中更容易跟踪你的类。当 Ch09Ex01 项目打开时，在添加项对话框中输入信息会导致生成以下代码：\n\
  \n```cpp\n using System;\n\nusing System.Collections.Generic;\n\nusing System.Linq;\n\
  \nusing System.Text;\n\nusing System.Threading.Tasks;\n\nnamespace Ch09Ex01\n{\n\
  \   class MyNewClass\n   {\n\n   }\n}\n```\n\n该类 `MyNewClass` 定义在与 `Program` 类相同的命名空间中，因此你可以像定义在同一个文件中一样使用它。如代码所示，生成的类不包含构造函数。记住，如果类定义没有包含构造函数，则编译器会在编译代码时添加一个默认构造函数。\n\
  \n### 类图 (Class Diagrams)\n\nVisual Studio 的强大功能之一是你尚未查看过的：从代码生成类图并使用它们修改项目的能力。类图编辑器允许你轻松生成代码的类\
  \ UML 图。在接下来的练习中，当你为之前创建的 Ch09Ex01 项目生成类图时，将看到该功能的应用。\n\n## 类库项目 (Class Library\
  \ Projects)\n\n除了将类放在项目中的不同文件中之外，你还可以将它们放在完全不同的项目中。仅包含类（以及其他相关类型定义，无入口点）的项目被称为*类库*（class\
  \ library）。\n\n类库项目编译为 `.dll` 程序集，你可以通过向其他项目添加引用来访问其内容（这些项目可以是解决方案的一部分，但不必是）。这扩展了对象所提供的封装，因为类库可以在不接触使用它们的项目的情况下修订和更新。这意味着你可以轻松升级类提供的服务（这可能会影响多个消费者应用程序）。\n\
  \n## 接口与抽象类 (Interfaces Versus Abstract Classes)\n\n\n\n\n\n本章演示了你如何同时创建接口和抽象类（目前不包含成员——你将在第\
  \ 10 章 中学习到它们）。这两种类型在许多方面都是相似的，因此了解何时应该使用其中一种技术或另一种技术是非常有用的。\n\n首先是相似之处：抽象类和接口都可以包含被派生类继承的成员。接口和抽象类都不能直接实例化，但可以声明这些类型的变量。如果你这样做，可以使用多态性将继承自这些类型的对象赋值给这些类型的变量。在这两种情况下，你都可以通过这些变量使用这些类型的成员，尽管你无法直接访问派生对象的其他成员。\n\
  \n现在来看区别：派生类只能继承自一个基类，这意味着只能直接继承一个抽象类（尽管继承链中可以包含多个抽象类）。相反，类可以使用任意数量的接口，但这并不会产生巨大的差异——通过这两种方式都可以实现相似的结果。这只是使用接口的方式处理问题的方法略有不同。\n\
  \n抽象类可以同时拥有`abstract members`（这些成员没有代码体，除非派生类本身也是抽象的，否则必须在派生类中实现）和`non‐abstract\
  \ members`（这些成员拥有代码体，并且可以是虚的，以便它们在派生类中被重写）。相反，`Interface members`必须在使用接口的类中实现——它们不拥有代码体。此外，接口成员定义上是公共的（因为它们旨在供外部使用），但抽象类的成员也可以是私有的（只要它们不是抽象的）、受保护的、内部的或受保护内部的（其中受保护内部成员只能从应用程序内部的代码或派生类中访问）。此外，接口不能包含字段、构造函数、析构函数、静态成员或常量。\n\
  \n例如，考虑一个代表火车的对象族。基类 `Train` 包含了火车的核心定义，例如轮距和发动机类型（可以是蒸汽机、柴油机等）。然而，这个类是抽象的，因为不存在所谓的“通用”火车。要创建一个“实际”的火车，你需要添加特定于该火车的特征。例如，你将派生出诸如\
  \ `PassengerTrain`、`FreightTrain` 和 `424DoubleBogey` 等类，如图图 9-11 所示。\n\n![图示说明，为了创建一个“实际”的火车，应向火车添加如\
  \ PassengerTrain、FreightTrain 和 424DoubleBogey 等派生类。](img/Image00121.jpg)\n\n**图\
  \ 9-11**\n\n一组汽车对象也可以以相同的方式定义，具有一个抽象基类 `Car` 和派生类如 `Compact`、`SUV` 和 `PickUp` 等类。`Car`\
  \ 和 `Train` 甚至可以继承自一个共同的基类，例如 `Vehicle`。这如图图 9-12 所示。\n\n![图示说明，显示了一组汽车对象可以使用如 Compact、SUV\
  \ 和 PickUp 等派生类来定义。](img/Image00122.jpg)\n\n**图 9-12**\n\n层级结构中部的某些类可以因为其用途而共享特征，而不仅仅是因为它们派自什么。例如，`PassengerTrain`、`Compact`、`SUV`\
  \ 和 `PickUp` 都能承载负载。这在图 9-12](#text00012.html_c09-fig-0012)所示。\n\n## 结构类型\n第 8 章\
  \ 注意到结构和类非常相似，但结构是值类型，而类是引用类型。这对你来说意味着什么？嗯，观察此点的最简单方法是\n\n## 浅拷贝与深拷贝\n通过值而不是引用将对象从一个变量拷贝到另一个变量（即复制它们）可能会相当复杂。因为单个对象可能包含其他对象的引用，所以你需要执行深拷贝。这意味着新对象中的引用成员指向与源对象相同的对象，这在许多情况下并不是理想的。如果你想创建成员本身（而不是引用）的新实例，你可以使用此\n\
  \n有一个你可以可以实现的接口，它允许你以标准方式进行深拷贝：`ICloneable`。如果你使用此接口，就必须实现它包含的唯一方法 `Clone()`。该方法返回\
  \ `System.Object` 类型的值。你可以通过你喜欢的任何方式实现方法体来获取此对象。没有任何规则，因此许多人建议避免使用。相反，他们建议实现自己的深拷贝方法。在第\
  \ 11 章中详细查看此接口。\n\n## 练习\n1.  9.1 下面的代码有什么问题？\n    ```\n    public sealed class\
  \ MyClass\n        {\n           // 类成员。\n        }\n        public class myDerivedClass\
  \ : MyClass\n        {\n           // 类成员。\n        } \n    ```\n2.  9.2 如何定义一个不可创建的类？\n\
  3.  9.3 为什么不可创建的类仍然有用？你如何利用它们的功能？\n4.  9.4 在名为 `Vehicles` 的类库项目中编写代码，实现本章之前讨论的 `Vehicle`\
  \ 对象族。共有九个对象和两个需要实现的接口。\n5.  9.5 创建一个名为 `Traffic` 的控制台应用程序项目，引用 `Vehicles.dll`（问题\
  \ 4 创建）。包含一个名为 `AddPassenger` 的函数，接受任何带有 `IPassengerCarrier` 接口的对象。为了证明代码工作正常，使用支持此接口的每个实例调用此函数，调用每个对象继承自\
  \ `System`.`Object` 的 `ToString` 方法并将结果写入屏幕。\n\n\n\n\n\n## 类和接口定义\n使用 `class` 关键字定义类，使用\
  \ `interface` 关键字定义接口。你可以使用 `public` 和 `internal` 关键字来定义类和接口的访问性，并可以将类定义为 `abstract`（抽象）或\
  \ `sealed`（密封）以控制继承。父类和接口在类或接口名称后的冒号之后，以逗号分隔的列表形式指定。类定义中只能指定一个父类，且它必须是列表中的第一个项。\n\
  \n## 构造函数和析构函数\n类自带默认的构造函数实现和析构函数实现，你很少需要自己提供析构函数。你可以使用访问修符、类名以及任何所需的参数来定义构造函数。基类的构造函数会在派生类的构造函数之前执行，你可以通过\
  \ `this` 和 `base` 构造函数初始化关键字在类内部控制执行顺序。\n\n## 类库\n你可以创建仅包含类定义的类库项目。这些项目无法直接执行；它们必须通过可执行应用程序中的客户端代码来访问。Visual\
  \ Studio 提供了各种工具来创建、修改和检查类。\n\n## 类族\n类可以被分为具有共同行为或共享共同特征的族。你可以通过继承一个共享的基类（可以是抽象的）或通过实现接口来实现。\n\
  \n## 结构体定义\n结构体（struct）的定义方式与类非常相似，但记住结构体是值类型，而类是引用类型。\n\n## 复制\n当你复制一个对象时，必须小心复制它可能包含的任何对象，而不是简单地复制这些对象的引用。复制引用被称为浅拷贝，而完全的复制被称为深拷贝。你可以使用\
  \ `ICloneable` 接口作为框架，在类定义中提供深拷贝能力。\n\n# 10 定义类成员\n\n### 成员定义\n在类定义内部，你为类的所有成员提供定义，包括字段、方法和属性。所有成员都有它们自己的访问级别，并且在所有情况下都由以下关键字之一定义：\n\
  \n- `public` — 成员可以从任何代码访问。\n- `private` — 成员只能从属于该类的一部分的代码访问（如果不使用关键字，则默认为此值）。\n\
  - `internal` — 成员只能从定义它们所在的程序集（项目）内部的代码访问。\n- `protected` — 成员只能从属于该类或其派生类的一部分的代码访问。\n\
  \n后两个关键字可以组合，因此 `protected internal` 成员也是可能的。这些成员只能从项目内的代码派生类（更准确地说，是程序集内）访问。\n\n\
  字段、方法和属性还可以使用 `static` 关键字声明，这意味着它们是类拥有的静态成员，而不是对象实例的，正如第 8 章中所的。\n\n#### 定义字段\n\
  字段使用标准的变量声明格式（带有可选初始化）以及之前讨论过的修饰符定义：\n\n```cs\n class MyClass\n{\npublic int MyInt;\n\
  } \n```\n\n字段还可以使用 `readonly` 关键字，这意味着该字段只能在构造函数执行期间或通过初始赋值赋值：\n\n```cs\n class\
  \ MyClass\n{\n   public \nreadonly\n int MyInt = 17;\n} \n```\n\n正如章节引言所述，字段可以使用\
  \ `static` 关键字声明为静态字段：\n\n```cs\n class MyClass\n{\n   public static int MyInt;\n\
  } \n```\n\n静态字段通过定义它们的类进行访问（如上例中的 `MyClass.MyInt`），而不是通过该类的对象实例。你可以使用 `const` 关键字创建常量。`const`\
  \ 成员在定义上是静态的，因此你不需要使用 `static` 修饰符（事实上，这样做是错误的）。\n\n#### 定义方法\n方法使用标准的函数格式，并带有访问修符和可选的\
  \ `static` 修饰符，如示例所示：\n\n```cs\n class MyClass\n{\npublic string GetString() =>\
  \ \"Here is a string\n.\";\n} \n```\n\n请记住，如果你使用了 `static` 关键字，那么该方法只能通过类访问，而不是通过对象实例。你还可以在方法定义中使用以下关键字：\n\
  \n- `virtual` — 方法可以被重写。\n- `abstract` — 方法在非抽象派生类中必须被重写（仅在抽象类中允许）。\n- `override`\
  \ — 方法重写基类方法（如果正在重写方法，则必须使用它）。\n- `extern` — 方法定义在别处。\n\n这里是一个方法重写的示例：\n\n```cs\n\
  public class MyBaseClass\n{\n   public virtual void DoSomething()\n   {\n      //\
  \ 基类实现。\n   }\n}\n\npublic class MyDerivedClass : MyBaseClass\n{\n   public \noverride\n\
  \ void DoSomething()\n   {\n      // 派生类实现，重写基类实现。\n   }\n} \n```\n\n如果使用了 `override`，则也可以使用\
  \ `sealed` 来指定派生类中不能对此方法进行进一步修改——即该方法不能被派生类重写。这里是一个示例：\n\n```cs\n public class MyDerivedClass\
  \ : MyBaseClass\n{\n   public override \nsealed\n void DoSomething()\n   {\n   \
  \   // 派生类实现，重写基类实现。\n   }\n} \n```\n\n使用 `extern` 允许你在项目外部提供方法的实现，但这是一个未涵盖的高级主题。\n\
  \n#### 定义属性\n属性的定义方式与字段类似，但它们包含更多内容。如所述，属性比字段更复杂，因为它们可以在修改状态之前执行额外的处理——而且，它们可能根本修改状态。它们通过拥有两个函数式的块来实现：一个用于获取属性的值，另一个用于设置属性的值。\n\
  \n这些块被称为访问器，分别使用 `get` 和 `set` 关键字定义，并可用于控制属性的访问级别。你可以省略这些块之一来创建只读或只写属性（省略 `get`\
  \ 块提供只写访问，而省略 `set` 块提供只读访问）。当然，这仅适用于外部代码，因为类内部其他代码将访问这些块所拥的数据。你还可以在访问器上包含访问修符——例如，将\
  \ `get` 块设置为公共而将 `set` 块设置为保护。你必须包含这些块之一以获得有效的属性（而且，面对吧，一个无法读取或更改的属性将毫无用处）。\n\n\
  属性的基本结构由标准的访问修饰关键字（`public`、`private` 等）组成，随后是类型名称、属性名称以及一个或两个包含属性处理的 `get` 和 `set`\
  \ 块：\n\n```cs\n public int MyIntProp\n{\n   get\n   {\n      // 属性获取代码。\n   }\n\
  \   set\n   {\n      // 属性设置代码。\n   }\n} \n```定义的第一行与字段定义非常相似。区别在于行尾没有分号；相反，你有一个包含嵌套的\
  \ `get` 和 `set` 块的代码块。\n\n`get` 块的返回值类型必须与属性类型一致。简单属性通常与控制该字段访问的单个私有字段关联，在这种情况下，`get`\
  \ 块可以直接返回字段的值。\n\n\n\n\n\n```csharp\n // 属性使用的字段。\n\nprivate int myInt;\n\n// 属性。\n\
  \npublic int MyIntProp\n\n{\n\n   get { \nreturn myInt;\n\n }\n   set { // 属性设置代码。\
  \ }\n\n} \n```\n\n由于访问级别的限制（它是 `private`），类外部代码无法直接访问此 `myInt` 字段。相反，外部代码必须使用属性来访问该字段。`set`\
  \ 函数也以类似的方式为字段赋值。在这里，你可以使用关键字 `value` 来引用从属性用户处接收的值：\n\n```csharp\n // 属性使用的字段。\n\
  \nprivate int myInt;\n\n// 属性。\n\npublic int MyIntProp\n\n{\n\n   get { return myInt;\
  \ }\n\n   set { \nmyInt = value;\n\n }\n\n} \n \n```\n\n`value` 等于一个与属性类型相同的值，因此如果属性使用的类型与字段相同，那么在类此类情况下你永远不需要担心类型转换。为了在整数允许\
  \ `null` 的情况下提供默认值，这种表达式体成员函数模式非常好用：\n\n```csharp\n private int? myInt;\n\npublic\
  \ int? MyIntProp\n\n{\n\n   get { return myInt; }\n\n   set { \nmyInt = value ??\
  \ 0;\n\n }\n\n} \n ```\n```\n```\n\n这个简单的属性除了屏蔽对 `myInt` 字段的直接访问之外。当你对过程施加更多控制时，属性的真正威力就显而易见了。例如，你可以如下实现你的\
  \ `set` 块：\n\n```csharp\n set\n\n   {\n\n      if (value >= 0 && value <= 10)\n\n\
  \         myInt = value;\n\n   } \n ```\n```\n\n在这里，只有当分配给属性的值在 0 到 10 之间时，你才会修改\
  \ `myInt`。在这种情况下，有一个重要的设计选择要做。如果使用了无效值该怎么办？你有四个选择：\n\n* 什么都不做（如前面的代码所示）。\n* 给字段分配一个默认值。\n\
  * 继续执行仿佛没有发生错误，但记录该事件以供以后分析。\n* 抛出异常。\n\n通常，后两个选项是更优的。在它们之间决定取决于类如何被使用，以及应该分配给类用户多少控制权。抛出异常可以赋予用户相当的控制权，并让他们知道发生了什么，以便他们做出适当反应。你可以使用\
  \ `System` 命名空间中的标准异常来实现：\n\n```csharp\n set\n\n   {\n\n      if (value >= 0 &&\
  \ value <= 10)\n\n         myInt = value;\n\n      else\n\n         throw (new ArgumentOutOfRangeException(\"\
  MyIntProp\", value,\n\n                   \"MyIntProp 必须被赋予 0 到 10 之间的值。\"));\n\n\
  \   } \n ```\n```\n\n使用 `throw` 创建的异常可以使用使用属性的实现代码中的 `try…catch…finally` 逻辑进行处理，正如你在第\
  \ 7 章 中看到的。\n\n记录数据（也许到文本文件或事件日志）可能是很有，例如在问题真的不应该发生的生产环境中。它允许开发者检查性能，并在必要时调试现有代码。\n\
  \n属性可以像方法一样使用 `virtual`、`override` 和 `abstract` 关键字，这是字段无法实现的。最后，正如前面提到的，访问器可以有它们自己的访问级别，如下所示：\n\
  \n```csharp\n // 属性使用的字段。\n\nprivate int myInt;\n\n// 属性。\n\npublic int MyIntProp\n\
  \n{\n\n   get { return myInt; }\n\n   protected set\n\n { myInt = value; }\n\n}\
  \ \n ```\n```\n\n在这里，只有类内部或派生类的代码可以使用 `set` 访问器。\n\n允许访问器的访问级别取决于属性的访问级别，并且禁止让访问器的访问级别比其所属的属性更开放。这意味着私有属性的访问器不能包含任何访问级别修饰符，而公共属性可以在其访问器上使用所有修饰符。\n\
  \nC# 6 引入了一项称为表达式体属性的功能。与之前在第 6 章中讨论的表达式体方法类似，该功能将属性的范围减少到单行代码。例如，返回数值的单行数学计算的属性可以使用\
  \ lambda 箭头后跟方程。\n\n```csharp\n // 属性使用的字段。\n\nprivate int myDoubledInt = 5;\n\n\
  // 属性。\n\npublic int MyDoubledIntProp => (myDoubledInt * 2); \n ```\n```\n\n下面的“尝试一下”将让你能够实验定义和使用字段、方法和属性。\n\
  \n### 元组解构\n\n在第 6 章中你学习了元组，它们对于从函数返回多个结果非常有用。当不需要使用更复杂的对象（如类、结构或数组）时，使用 `tuple`\
  \ 是处理这种情况的有效方法。这是一个 `tuple` 的简单示例：\n\n```csharp\n var numbers = (1, 2, 3, 4, 5);\
  \ \n ```\n```\n\n定义一个返回多个结果的函数：\n\n```csharp\n private static (int max, int min,\
  \ double average)       \n\n    GetMaxMin(IEnumerable<int> numbers) {\n…\n} \n ```\n\
  ```\n\n当你的代码消耗 `GetMaxMin()` 函数时，必须由代码解析结果以显示。（如果你需要那种特定方法，请再次查看第 6 章）。但如果你实现了元组解构，则不需要编写解析结果的代码。元组解构通过向任何想要支持此特性的类添加一个名为\
  \ `Deconstruct()` 的函数来实现。例如，检查以下类：\n\n```csharp\n public class Location\n\n{\n\n\
  \  public Location(double latitude, double longitude)\n      => (Latitude, Longitude);\n\
  \n  public double Latitude { get; }\n\n  public double Longitude { get; }\n\n  public\
  \ void Deconstruct(out double latitude, out double longitude)\n     => (Latitude,\
  \ Longitude);\n\n}\n ```\n```\n\n`Location` 类实现了一个表达式体构造函数，它接受两个 `double` 类型的变量（`latitude`\
  \ 和 `longitude`），这些变量用于在初始化 `Location` 类时设置 `Latitude` 和 `Longitude` 的值。你可以通过将元组分配给\
  \ `Location` 来访问字段：\n\n```csharp\n var location = new Location(48.137154, 11.576124);\n\
  \n(double latitude, double longitude) = location;\n ```\n```\n\n可以直接引用结果而无需解析结果。\n\
  \n## 重构成员\n\n在添加属性时非常有用的技巧之一是从字段生成属性的能力。这是重构的一个示例，它意味着使用工具修改你的代码，而不是手动修改。这可以通过类图或代码视图中右键点击成员来实现。\n\
  \n例如，如果 `MyClass` 类包含此字段：\n\n```csharp\n public string myString; \n ```\n```\n\n\
  你可以右键点击该字段并选择“快速操作和重构……（Ctrl+.）”。这将弹出图 10-2 所示的对话框。\n\n![对话框截图说明，显示接受默认选项会修改 MyClass\
  \ 类的代码。](img/Image00126.jpg)\n\n**图 10-2**\n\n接受默认选项将 `MyClass` 代码修改如下：\n\n```csharp\n\
  \ public string myString;\n\npublic string MyString\n\n{\n\n   get => myString;\n\
  \n   set => myString = value;\n\n}\n\nprivate string myString; \n ```\n```\n\n\n\
  \n\n属性（Properties）是访问对象状态的首选方式，因为它们使外部代码不受对象内部数据存储实现的影响。正如你在本章的代码中多次看到的那样，属性还让你对内部内部的访问方式具有更大的控制力。然而，你通常会以非常标准的方式定义属性——即，你将有一个私有成员，并通过公共属性直接访问它。这种代码几乎总是与上一节的代码相似，而之前的代码是由\
  \ Visual Studio 重构工具自动生成的。\n\n重构确实可以加快输入速度，但 C# 还有另一个杀手锏：**自动属性**（automatic properties）。通过`automatic\
  \ property`，你使用简化的语法声明属性，而 C# 编译器会为你填补空白。具体来说，编译器会声明一个用于存储的私有字段，并在属性的 `get` 和 `set`\
  \ 块中使用该字段——你无需担心这些细节。\n\n使用以下代码结构来定义自动属性：\n\n```\n public int MyIntProp\n\n{\n \
  \  get;\n   set;\n} \n```\n\n你甚至可以在单行代码上定义自动属性以节省空间，而又不会显著降低属性的可读性：\n\n```\n public\
  \ int MyIntProp { get; set; } \n```\n\n你按照通常的方式定义属性的访问级别、类型和名称，但不需要为 `get` 或 `set`\
  \ 块提供任何实现。相反，编译器提供了这些块的实现（以及底层字段）。\n\n当你使用自动属性时，你只能通过属性访问其数据，而不是通过其底层私有字段。这是因为你无法在不知道其名称的情况下访问私有字段，而该名称是在编译期间定义的。然而，这并不是真正的限制，因为直接使用属性名称是没问题的。自动属性的唯一限制是它们必须同时包含\
  \ `get` 和 `set` 访问器——你不能以这种方式定义只读或只写的属性。不过，你可以更改这些访问器的访问级别。例如，这意味着你可以如下所示创建一个外部只读的属性：\n\
  \n```\n public int MyIntProp { get; private set; } \n```\n\n在这里，你只能从类定义中的代码访问 `MyIntProp`\
  \ 的值。\n\nC# 6 引入了两个与自动属性的新概念：**只读自动属性**（getter‐only auto‐properties）和**自动属性初始化器**（initializers\
  \ for auto‐properties）。在 C# 6 之前，自动属性需要设置器，这限制了不可变数据类型的使用。不可变数据类型的简单定义是：它一旦被创建就不会改变状态，最著名的不可变类型是\
  \ `System.String`。使用不可变数据类型有许多优点，例如简化了并发编程和线程同步。\n\n并发编程和线程同步是高级主题，本书将不再进一步讨论；但是，了解只读自动属性是非常重要的。它们通过以下语法创建，注意这里不再需要设置器了：\n\
  \n```\n public int MyIntProp { get; } \n```\n\n自动属性的初始化功能通过以下方式实现，这与声明字段相似：\n\n\
  ```\n public int MyIntProp { get; } = 9; \n```\n\n## 附加类成员主题\n\n现在你准备好查看一些更高级的成员主题了。本节将处理以下内容：\n\
  \n* 隐藏基类方法\n* 调用被重写或隐藏的基类方法\n* 使用嵌套类型定义\n\n### 隐藏基类方法\n\n当你从基类继承一个（非抽象）成员时，你也继承了一个实现。如果继承的成员是虚的（virtual），那么你可以使用\
  \ `override` 关键字重写该实现。无论继承的成员是否为虚的，如果你愿意，都可以 `hide`（隐藏）该实现。这在某些情况下非常有用，例如当一个公共继承成员的工作方式不符合你的预期时。\n\
  \n你可以简单地使用如下代码：\n\n```\n public class MyBaseClass\n{\n   public void DoSomething()\n\
  \   {\n      // 基类实现。\n   }\n}\n\npublic class MyDerivedClass : MyBaseClass\n{\n\
  \   public void DoSomething()\n   {\n      // 派类实现，隐藏了基类实现。\n   }\n} \n```\n\n虽然这段代码可以运行，但它会生成一个警告，说明你正在隐藏基类成员。这个警告给了你机会，以你不小心隐藏了想要使用的成员。如果你确实想隐藏该成员，可以使用\
  \ `new` 关键字来显式地表示这是你想做的：\n\n```\n public class MyDerivedClass : MyBaseClass\n{\n\
  \   new\n public void DoSomething()\n   {\n      // 派类实现，隐藏了基类实现。\n   }\n} \n```\n\
  \n这种工作方式完全相同，但不会显示警告。此时，值得注意隐藏和重写基类成员之间的区别。考虑以下代码：\n\n```\n public class MyBaseClass\n\
  {\n   public virtual void DoSomething() => WriteLine(\"Base imp\");\n}\n\npublic\
  \ class MyDerivedClass : MyBaseClass\n{\n   public override void DoSomething() =>\
  \ WriteLine(\"Derived imp\");\n} \n```\n\n在这里，被重写的方法替换了基类中的实现，使得以下代码即使通过基类类型（使用多态性）也会使用新版本：\n\
  \n```\n MyDerivedClass myObj = new MyDerivedClass();\nMyBaseClass myBaseObj;\nmyBaseObj\
  \ = myObj;\nmyBaseObj.DoSomething(); \n```\n\n这将导致以下输出：\n\n```\n Derived imp\n```\n\
  \n或者，你可以隐藏基类方法：\n\n```\n public class MyBaseClass\n{\n   public virtual void DoSomething()\
  \ => WriteLine(\"Base imp\");\n}\n\npublic class MyDerivedClass : MyBaseClass\n\
  {\n   new\n public void DoSomething() => WriteLine(\"Derived imp\");\n} \n```\n\n\
  基类方法不需要是虚的也可以工作，但效果完全相同，且前面的代码只需要修改一行。对于虚或非虚的基类方法，结果如下：\n\n```\n Base imp\n```\n\
  \n尽管基类实现被隐藏了，你仍然可以通过基类访问它。\n\n### 调用被重写或隐藏的基类方法\n\n无论你是重写还是隐藏了成员，你仍然可以在派生类访问基类成员。在许多情况下这都是有用的，例如：\n\
  \n* 当你想向派生类的用户隐藏继承的公共成员，但仍想在类内部访问其功能时\n* 当你想对继承的虚成员实现进行扩展而不是简单地将其替换为新的重写实现时\n\n\
  要实现这一点，你使用 `base` 关键字，它指向派生类内部的基类实现（与其在最后一章中控制构造函数的用法类似）：\n\n```\n public class\
  \ MyBaseClass\n{\n   public virtual void DoSomething()\n   {\n      // 基类实现。\n \
  \  }\n}\n\npublic class MyDerivedClass : MyBaseClass\n{\n   public override void\
  \ DoSomething()\n   {\n      // 派类实现，扩展了基类实现。\n      base.DoSomething();\n     \
  \ // 更多派类实现。\n   }\n} \n```\n\n这段代码执行了 `MyBaseClass` 的 `DoSomething()` 版本，这是在 `MyDerivedClass`\
  \ 的 `DoSomething()` 版本内部执行的。由于 `base` 使用对象实例工作，因此在静态成员内部使用它是错误的。\n\n#### this 关键字\n\
  \n\n\n\n\n正如上一章使用 `base` 一样，你也使用了 `this` 关键字。与 `base` 类似，`this` 可以在类成员内部使用，并且和 `base`\
  \ 类似，`this` 指向一个对象实例，尽管它是当前对象实例（这意味着你不能在静态成员中使用 `this` 关键字，因为静态成员不是对象实例的一部分）。\n\n\
  `this` 关键字最有用的功能是可以将当前对象实例的引用传递给方法，例如所示：\n\n```java\n public void doSomething()\n\
  \n   {\n\n      MyTargetClass myObj = new MyTargetClass();\n\n      myObj.DoSomethingWith(this);\n\
  \n   } \n```\n\n在这里，被实例化的 `MyTargetClass` 实例（`myObj`）有一个名为 `DoSomethingWith()` 的方法，该方法接收一个与包含前述方法的类兼容的类型参数。该参数类型可能是此类类型、该类派生的类类型、该类实现的接口，或者（当然是）`System.Object`。\n\
  \n`this` 关键字的另一个常见用途是用它来限定局部类型成员，例如：\n\n```java\n public class MyClass\n\n{\n\n\
  \   private int someData;\n\n   public int SomeData => this.someData;\n\n} \n```\n\
  \n许多开发者喜欢这种语法，它可以与任何成员类型配合，因为一眼就能看出你引用的是成员而不是局部变量。\n\n### 使用嵌套类型定义\n\n你可以在命名空间中定义类等类型，也可以在其他类内部定义它们。这时，你可以为定义使用全范围的访问性修饰符，而不仅仅是\
  \ `public` 和 `internal`，并且你可以使用 `new` 关键字来隐藏继承自基类的类型定义。例如，以下定义 `MyClass` 的代码也定义了一个名为\
  \ `MyNestedClass` 的嵌套类：\n\n```java\n public class MyClass\n\n{\n\n   public class\
  \ MyNestedClass\n\n   {\n\n      public int NestedClassField;\n\n   }\n\n} \n```\n\
  \n要从 `MyClass` 外部实例化 `MyNestedClass`，你必须限定名称，如下所示：\n\n```java\n MyClass.MyNestedClass\
  \ myObj = new MyClass.MyNestedClass(); \n```\n\n然而，你可能无法这样做，例如如果嵌套类被声明为 `private`。该功能存在的一个原因是是为了定义对包含类私有的类，以便命名空间中的其他代码无法访问它们。另一个原因是，嵌套类可以访问其包含类的私有和受保护成员。接下来的“尝试一试”将探讨这一特性。\n\
  \n## 接口的实现\n\n本节将更详细地介绍如何定义和实现接口。在上一章中，你学习了接口的定义方式与类相似，使用了如下代码：\n\n```csharp\n interface\
  \ IMyInterface\n\n{\n\n   // 接口成员。\n\n} \n```\n\n接口成员的定义方式类似于类成员，但有几处重要的区别：\n\n\
  * 不允许使用访问修饰符（`public`、`private`、`protected` 或 `internal`）——所有接口成员都是隐式公共。\n* 接口成员不能包含代码体。\n\
  * 接口不能定义字段成员。\n* 接口成员不能使用 `static`、`virtual`、`abstract` 或 `sealed` 关键字定义。\n* 禁止定义类型定义成员。\n\
  \n然而，如果你想隐藏继承自基接口的成员，可以使用 `new` 关键字定义成员：\n\n```csharp\n interface IMyBaseInterface\n\
  \n{\n\n   void DoSomething();\n\n}\n\ninterface IMyDerivedInterface : IMyBaseInterface\n\
  \n{\n\n   new void DoSomething();\n\n} \n```\n\n这种工作方式与隐藏继承的类成员完全相同。\n\n接口中定义的属性定义了该属性允许的一个或两个访问访问块——`get`\
  \ 和 `set`，如下所示：\n\n```csharp\n interface IMyInterface\n\n{\n\n   int MyInt { get;\
  \ set; }\n\n} \n```\n\n在这里，`int` 属性 `MyInt` 同时具有 `get` 和 `set` 访问器。对于访问受限更严格的属性，可以省略其中任何一个。\n\
  \n接口不指定属性数据应如何存储。例如，接口不能指定可能用于存储属性数据的字段。最后，接口像类一样，可以定义为类的成员（但不能定义为其他接口的成员，因为接口不能包含类型定义）。\n\
  \n字体 在类实现接口\n\n实现接口的类必须包含该接口所有成员的实现，这些实现必须与指定的签名匹配（包括匹配指定的 `get` 和 `set` 块），并且必须是公共的，如下所示：\n\
  \n```csharp\n public interface IMyInterface\n\n{\n\n   void DoSomething();\n\n \
  \  void DoSomethingElse();\n\n}\n\npublic class MyClass : IMyInterface\n\n{\n\n\
  \   public void DoSomething() {}\n\n   public void DoSomethingElse() {}\n\n} \n\
  ```\n\n可以使用 `virtual` 或 `abstract` 关键字实现接口成员，但不能使用 `static` 或 `const`。接口成员也可以在基类上实现：\n\
  \n```csharp\n public interface IMyInterface\n\n{\n\n   void DoSomething();\n\n \
  \  void DoSomethingElse();\n\n}\n\npublic class MyBaseClass\n\n{\n\n   public void\
  \ DoSomething()\n\n {}\n\n}\n\npublic class MyDerivedClass : MyBaseClass, IMyInterface\n\
  \n{\n\n   public void DoSomethingElse() {}\n\n} \n```\n\n继承一个实现了给定接口的基类意味着派生类隐式地支持该接口。这里有一个示例：\n\
  \n```csharp\n public interface IMyInterface\n\n{\n   void DoSomething();\n\n   void\
  \ DoSomethingElse();\n}\n\npublic class MyBaseClass : IMyInterface\n\n{\n   public\
  \ virtual void DoSomething() {}\n\n   public virtual void DoSomethingElse() {}\n\
  }\n\npublic class MyDerivedClass : MyBaseClass\n{\n   public override void DoSomething()\
  \ {}\n} \n```\n\n显然，将基类中的实现定义为 `virtual` 是很有用的，这样派生类就可以替换而不是隐藏它。如果你使用 `new` 关键字隐藏基类成员而不是通过这种方式覆盖，那么即使通过接口访问派生类，`IMyInterface.DoSomething()`\
  \ 也始终指向基类版本。\n\n#### 显式接口实现\n\n接口成员也可以由类*显式*实现。如果你这样做，该成员只能通过接口访问，而不能通过类访问。*隐式*成员（你在上一节代码中使用的）可以通过任何方式访问。\n\
  \n例如，如果 `MyClass` 类隐式实现了 `IMyInterface` 的 `DoSomething()` 方法，如前面的示例所示，那么以下代码是有效的：\n\
  \n```csharp\n MyClass myObj = new MyClass();\n\nmyObj.DoSomething(); \n```\n\n这也是有效的：\n\
  \n```csharp\n MyClass myObj = new MyClass();\n\nIMyInterface myInt = myObj;\n\n\
  myInt.DoSomething(); \n```\n\n或者，如果 `MyClass` 显式实现了 `DoSomething()`，则只有后一种技术是允许的。执行该操作的代码如下：\n\
  \n```csharp\n public class MyClass : IMyInterface\n\n{\n\n   void IMyInterface.DoSomething()\
  \ {}\n\n   public void DoSomethingElse() {}\n\n} \n```\n\n在这里，`DoSomething()` 是显式实现的，而\
  \ `DoSomethingElse()` 是隐式的。只有后者可以通过 `MyClass` 的对象实例直接访问。\n\n#### 额外的属性访问器\n\n\n\n\
  \n之前你已经了解到，如果你在一个接口中实现了一个属性，就必须实现对应的 `get/set` 访问器。这并不是严格的——你可以在类中为属性添加一个 `get`\
  \ 块，而定义该属性的接口仅包含一个 `set` 块，反之亦然。然而，只有在隐式实现接口时这才是可能的。此外，在大多数情况下，你可能希望添加的访问器的访问性修饰符比接口中定义的访问器的访问性修饰符严格。由于接口定义的访问器根据定义是公共的（public），这意味着你将添加非公有访问访问器。这里有一个示例：\n\
  \n```java\n public interface IMyInterface\n\n{\n\n   int MyIntProperty { get\n;\
  \ }\n}\n\npublic class MyBaseClass : IMyInterface\n\n{\n   public int MyIntProperty\
  \ { get; protected set\n\n; }\n} \n```\n\n如果你将额外的访问器定义为 `public`，那么能够访问实现接口的类的代码就可以访问它。然而，仅访问接口的代码将无法访问它。\n\
  \n## 部分类定义\n\n当你创建包含许多某种类型成员的类时，代码可能会变得非常混乱，代码文件可能会变得非常长。一种有帮助的技术是使用代码大纲（code outlining）。通过在代码中定义区域（regions），你可以折叠和展开部分，使代码更易读。例如，你可能定义了一个如下类：\n\
  \n```java\n public class MyClass\n\n{\n\n   #region Fields\n\n   private int myInt;\n\
  \n   #endregion\n\n   #region Constructor\n\n   public MyClass() { myInt = 99; }\n\
  \n   #endregion\n\n   #region Properties\n\n   public int MyInt\n\n   {\n\n    \
  \  get { return myInt; }\n      set { myInt = value; }\n   }\n\n   #endregion\n\n\
  \   #region Methods\n\n   public void DoSomething()\n\n   {\n\n      // Do something..\n\
  \   }\n\n   #endregion\n} \n```\n\n在这里，你可以展开和收起类的字段、属性、构造函数和方法，让你能够只关注你感兴趣的内容。甚至可以这样嵌套区域，因此某些区域只在包含它们的区域展开时可见。\n\
  \n使用区域的替代方案是使用 `部分类定义`（partial class definitions）。简单来说，你使用部分类定义将类的定义拆分到多个文件中。例如，你可以将字段、属性和构造函数放在一个文件中，将方法放在另一个文件中。要做到这一点，你只需要在包含部分定义的每个类中使用\
  \ `partial` 关键字，如下所示：\n\n```java\n public partial\n\n class MyClass {  …} \n```\n\
  \n如果你使用部分类定义，`partial` 关键字必须出现在包含部分定义的每个文件中的此位置。\n\n例如，在名为 `MainWindow` 的类中的 WPF\
  \ 窗口，其代码同时存储在 `MainWindow.xaml.cs` 和 `MainWindow.g.i.cs` 中（如果在解决方案管理器窗口中选择了“显示所有文件”，并深入到\
  \ `obj\\Debug` 文件夹，就可以看到它们）。这让你能够专注于表单的功能，而不必担心你的代码被你并不真正感兴趣的信息所淹没。\n\n关于部分类的最后一点说明：应用于某一个部分类部分的接口适用于整个类，这意味着，以下定义：\n\
  \n```java\n public partial class MyClass : IMyInterface1 {  … }\n\npublic partial\
  \ class MyClass : IMyInterface2 {  … } \n```\n\n等同于：\n\n```java\n public class MyClass\
  \ : IMyInterface1, IMyInterface2 { … } \n```\n\n部分类定义可以在单个部分类定义中包含一个基类，也可以包含多个部分类定义。然而，如果在多个定义中指定了基类，则它必须是同一个基类；请记住，C#\
  \ 中的类只能继承自一个基类。\n\n# 部分方法定义\n\n部分类还可以定义部分方法。部分方法在一个部分类定义中定义，且没有方法体，并在另一个部分类定义中实现。在两个地方，都使用了\
  \ `partial` 关键字：\n\n```java\n public partial class MyClass\n\n{\n\n   partial void\
  \ MyPartialMethod()\n;\n}\n\npublic partial class MyClass\n\n{\n   partial void\
  \ MyPartialMethod()\n\n   {\n\n      // Method implementation\n   }\n} \n```\n\n\
  部分方法也可以是静态的（static），但它们总是私有的（private）且不能有返回值。它们使用的任何参数都不能是 `out` 参数，可以是 `ref` 参数。它们不能使用\
  \ `virtual`、`abstract`、`override`、`new`、`sealed` 或 `extern` 修饰符。\n\n鉴于这些限制，部分方法的用途并不立即显而易见。事实上，它们在代码编译而非使用时是重要的。考虑以下代码：\n\
  \n```java\n public partial class MyClass\n\n{\n\n   partial void DoSomethingElse();\n\
  \n   public void DoSomething()\n\n   {\n\n      WriteLine(\"DoSomething() execution\
  \ started.\");\n\n      DoSomethingElse();\n\n      WriteLine(\"DoSomething() execution\
  \ finished.\");\n\n   }\n}\n\npublic partial class MyClass\n\n{\n\n   partial void\
  \ DoSomethingElse() =>\n      WriteLine(\"DoSomethingElse() called.\")\n;\n} \n\
  ```\n\n在这里，部分方法 `DoSomethingElse()` 在第一个部分类定义中定义并调用，在第二个定义中实现。当从控制台应用程序调用 `DoSomething()`\
  \ 时，输出将是你预期的那样：\n\n```\n DoSomething() execution started.\n\nDoSomethingElse() called.\n\
  \nDoSomething() execution finished.\n```\n\n如果你完全删除了第二个部分类定义或部分方法实现（或者注释掉这些代码），输出将如下：\n\
  \n```\n DoSomething() execution started.\n\nDoSomething() execution finished.\n\
  ```\n\n## 示例应用程序\n\n为了说明你到为止使用的的一些技术，在本节中，你将开发一个可以在后续章节中进行构建和使用的类模块。该类模块包含两个类：\n\
  \n*   `Card` —代表一张标准扑牌，具有黑梅、方片、红心或梅桃花花色，以及介于 A 到 K 之间的点数\n*   `Deck` —代表一副完整的 52\
  \ 张牌牌组，可以根据牌组中的位置访问牌，并具有洗牌牌组的能力\n\n你还将开发一个简单的客户端以确保一切运行正常，但你还不会在纸牌游戏应用程序中使用牌组。\n\
  \n### 规划应用程序\n\n此应用程序的类库 `Ch10CardLib` 将包含你的类。然而，在编写代码之前，你应该规划类所需的结构和功能。\n\n####\
  \ Card 类\n\n\n\n`Card` 类本质上是一个两个只读字段的容器：`suit`（花色）和 `rank`（等级）。将这些字段设置为只读是因为创建一个“空白”卡片是没有意义的，而且卡片一旦创建就不应该被更改。为了方便这一点，你将把默认构造函数设置为私有，并提供一个替代构造函数，根据提供的\
  \ `suit` 和 `rank` 构建卡片。\n\n除外，`Card` 类将重写 `System.Object` 的 `ToString()` 方法，这样你就可以轻松获取代表卡片的易读字符串。为了让事情更简单，你将为两个字段\
  \ `suit` 和 `rank` 提供枚举。\n\n`Card` 类如图图 10‐4 所示。\n\n![Card 类的图示说明，它本质上是一个包含两个只读字段（suit\
  \ 和 rank）的容器。](img/Image00128.jpg)\n\n**图 10‐4**\n\n## Deck 类\n\n`Deck` 类将维护 52\
  \ 个 `Card` 对象。你可以使用一个简单的数组类型来实现。该数组不会被直接访问，因为对 `Card` 对象的访问是通过 `GetCard()` 方法实现的，该方法返回给定索引的\
  \ `Card` 对象。该类还应该暴露一个 `Shuffle()` 方法来重新排列数组中的卡片。`Deck` 类如图图 10‐5 所示。\n\n![Deck 类的图示说明，它暴露了一个\
  \ Shuffle() 方法来重新排列数组中的卡片。](img/Image00129.jpg)\n\n**图 10‐5**\n\n## 编写类库\n\n为了本示例，假设你已经足够熟悉\
  \ IDE，因此可以跳过标准的“试一试”（Try It Out）格式，因此没有显式列出步骤，因为这些是你已经使用过很多次的步骤。这里的重点是详细查看代码。尽管如此，文中包含了一些提示，以确保你不会在此过程中遇到任何问题。\n\
  \n你的类和枚举都将包含在一个名为 `Ch10CardLib` 的类库项目中。该项目将包含四个 `.cs` 文件：`Card.cs`（包含 `Card` 类定义）、`Deck.cs`（包含\
  \ `Deck` 类定义）以及包含枚举的 `Suit.cs` 和 `Rank.cs` 文件。\n\n你可以使用 Visual Studio 类图工具组合许多代码。\n\
  \n要开始，你需要执行以下操作：\n\n1. 创建一个名为 `Ch10CardLib` 的新类库项目，并将其保存到目录 `C:\\BeginningCSharp7\\\
  Chapter10` 中。\n2. 从项目中删除 `Class1.cs`。\n3. 使用解决方案管理器窗口打开项目的类图（右键点击项目，然后点击查看 ![image](img/Image00008.gif)\
  \ 查看类图）。类图在开始时应该是空的，因为项目项目尚不包含任何类。这会在项目中创建一个名为 `ClassDiagram1.cd` 的文件以供以后使用。\n\n\
  ### 添加 Suit 和 Rank 枚举\n\n在打开 `ClassDiagram1.cd` 文件后，通过从工具箱将一个枚举（Enum）拖到类图中来向类图添加枚举，然后填充出现的“新建枚举”对话框。例如，对于\
  \ `Suit` 枚举，如图图 10‐6 所示填充对话框。\n\n![为 Suit 枚举出现的“新建枚举”对话框截图说明。](img/Image00130.jpg)\n\
  \n**图 10‐6**\n\n接下来，使用类详细（Class Details）窗口添加枚举的成员（在 `ClassDiagram1.cd` 文件中右键点击刚添加的\
  \ `Suit` 枚举 ![image](img/Image00008.gif) 类）。图 10‐7 显示了所需的值。\n\n![使用类详细窗口添加枚举成员后显示所需值的截图说明。](img/Image00131.jpg)\n\
  \n**图 10‐7**\n\n以相同的方式从工具箱添加 `Rank` 枚举。所需的值如图图 10‐8 所示。\n\n![使用类详细窗口从工具箱添加 Rank\
  \ 枚举后显示所需值的截图说明。](img/Image00132.jpg)\n\n**图 10‐8**\n\n你可以在代码文件 `Suit.cs` 和 `Rank.cs`\
  \ 中找到这两个枚举生成的代码。你可以在 `Suit.cs` 中找到 `Suit` 的完整代码：\n\n```\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n\nnamespace Ch10CardLib\n{\n    public enum Suit\n    {\n  \
  \      Club,\n        Diamond,\n        Heart,\n        Spade\n    }\n}\n```\n\n\
  你可以在 `Rank.cs` 中找到 `Rank` 的完整代码：\n\n``` evenusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\n\nnamespace Ch10CardLib\n{\n    public enum Rank\n    {\n  \
  \      Ace = 1,\n        Deuce,\n        Three,\n        Four,\n        Five,\n\
  \        Six,\n        Seven,\n        Eight,\n        Nine,\n        Ten,\n   \
  \     Jack,\n        Queen,\n        King\n    }\n}\n```\n\n你可以在代码文件中找到这两个枚举生成的代码。使用类详细窗口添加\
  \ `rank` 和 `suit` 字段，然后在属性窗口中将 Kind 设置为 `readonly`。你还需要添加构造函数——一个私有默认构造函数，以及一个接受参数\
  \ `newSuit` 和 `newRank` 的公共构造函数。最后，将 `Card.cs` 中的代码修改如下（或在 `Ch10CardLib` 命名空间中为新类添加所示代码）：\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\n\nnamespace Ch10CardLib\n{\n    public class Card\n    {\n \
  \       public readonly Suit suit;\n        public readonly Rank rank;\n\n     \
  \   public Card(Suit newSuit, Rank newRank)\n        {\n            suit = newSuit;\n\
  \            rank = newRank;\n        }\n\n        private Card() {}\n\n       \
  \ public override string ToString() => \"The \" + rank + \" \" + suit + \"s\";\n\
  \    }\n}\n```\n\n重写的 `ToString()` 方法将存储的枚举值的字符串表示写入返回的字符串中，而非默认构造函数初始化了 `suit`\
  \ 和 `rank` 字段的值。\n\n### 添加 Deck 类\n\n`Deck` 类需要使用类图定义以下成员：\n\n*   类型为 `Card[]` 的私有字段\
  \ `cards`\n*   公共默认构造函数\n*   公共方法 `GetCard()`，接受一个名为 `cardNum` 的 `int` 参数并返回 `Card`\
  \ 类型的对象\n*   公共方法 `Shuffle()`，不接受参数并返回 `void`\n\n在添加这些成员后，`Deck` 类的类详细将如图图 10‐10\
  \ 所示。\n\n\n\n\n\n![通过在类图中添加成员和类型，显示 `Deck` 类“类详细”窗口外观的截图说明。](img/Image00134.jpg)\n\
  \n**图 10‐10**\n\n为了让图表更加清晰，你可以显示已添加的成员和类型之间的关系。在类图中，依次对以下每个项**右键点击**，并从菜单中选择 `Show\
  \ as Association`（显示为关联）：\n\n*   `Deck` 中的 `cards`\n*   `Card` 中的 `suit`\n*   `Card`\
  \ 中的 `rank`\n\n完成后，图表看起来应该像图 10‐11 一样。\n\n![显示已添加的成员和类型之间关系的图表的截图说明。](img/Image00135.jpg)\n\
  \n**图 10‐11**\n\n接下来，修改 `Deck.cs` 中的代码（如果你没有使用类设计器，则必须先使用此处所示的代码添加此类）。你可以在 `Ch10CardLib\\\
  Deck.cs` 中找到这些代码。首先，你实现构造函数，它只是在 `cards` 字段中创建并分配 52 张卡片。你遍历两个枚举的所有组合，使用每个组合来创建一个卡片。这使得\
  \ `cards` 初始包含一个有序的卡片列表：\n\n```\n using System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\nusing System.Threading.Tasks;\n\n\
  namespace Ch10CardLib\n\n{\n\n   public class Deck\n\n   {\n\n      private Card[]\
  \ cards;\n\n      public Deck()\n      {\n\n         cards = new Card[52];\n\n \
  \        for (int suitVal = 0; suitVal < 4; suitVal++)\n         {\n           \
  \ for (int rankVal = 1; rankVal < 14; rankVal++)\n            {\n\n            \
  \   cards[suitVal * 13 + rankVal ‐1] = new Card((Suit)suitVal,\n\n             \
  \                                              (Rank)rankVal);\n\n  }\n\n      \
  \   }\n\n      }}} \n```\n\n接下来，实现 `GetCard()` 方法，它要么返回请求索引的 `Card` 对象，要么像之前所示那样抛出异常：\n\
  \n```\n public Card GetCard(int cardNum)\n\n      {\n\n         if (cardNum >= 0\
  \ && cardNum <= 51)\n            return cards[cardNum];\n\n         else\n     \
  \       throw\n\n                (new System.ArgumentOutOfRangeException(\"cardNum\"\
  , cardNum,\n\n                 \"Value must be between 0 and 51.\"));\n\n      }\
  \ \n```\n\n最后，你实现 `Shuffle()` 方法。该方法的工作原理是创建一个临时卡片数组，并将卡片从现有 `cards` 数组随机复制到该数组中。该函数的主体是从\
  \ `0` 计数到 `51` 的循环。在每次循环中，你使用 .NET Framework 中 `System.Random` 类的实例生成一个 `0` 到 `51`\
  \ 之间的随机数。一旦实例化，该类的对象就会使用 `Next(X)` 方法生成一个 `0` 到 `X` 之间的随机数。当你得到一个随机数时，只需将其作为临时数组中\
  \ `Card` 对象的索引，并在 `cards` 数组中复制一个卡片进去。\n\n为了记录已分配的卡片，你 true 一个 `bool` 变量数组，并在复制每张卡片时将其赋值为\
  \ `true`。由于你正在生成随机数，你会检查此数组以查看你是否已经将卡片复制到随机数指定的临时数组位置。如果是，你只需生成另一个。\n\n这并不是处理这些事情最高效的方法，因为在找到可以复制卡片的空闲位置之前，会生成很多随机数。但是，它是可行的，非常简单，而且\
  \ C# 代码的执行速度非常快，你几乎几乎察觉不到延迟。代码如下：\n\n```\n public void Shuffle()\n\n      {\n\n\
  \         Card[] newDeck = new Card[52];\n\n         bool[] assigned = new bool[52];\n\
  \n         Random sourceGen = new Random();\n\n         for (int i = 0; i < 52;\
  \ i++)\n         {\n\n            int destCard = 0;\n\n            bool foundCard\
  \ = false;\n\n            while (foundCard == false)\n            {\n\n        \
  \       destCard = sourceGen.Next(52);\n\n               if (assigned[destCard]\
  \ == false)\n                  foundCard = true;\n\n            }\n\n          \
  \  assigned[destCard] = true;\n\n            newDeck[destCard] = cards[i];\n\n \
  \        }\n\n         newDeck.CopyTo(cards, 0);\n\n      }\n\n   }\n\n} \n```\n\
  \n该方法的最后一行使用 `System.Array` 类的 `CopyTo()` 方法（每当你创建一个数组时都会使用它）将 `newDeck` 中的每张卡片复制回\
  \ `cards` 中。这意味着你是在相同的 `cards` 对象中使用相同的组 `Card` 对象，而不是创建任何新实例。如果你改用 `cards = newDeck`，那么你将用另一个对象替换掉\
  \ `cards` 所引用的对象实例。如果代码的其他地方保留了对原始 `cards` 实例的引用，这会导致问题——因为原始实例将不会被洗牌！\n\n类库代码编写完毕。\n\
  \n### 类库的客户端应用程序\n\n为了保持简单，你可以向包含该类库的解决方案添加一个客户端应用程序。要这样做，请右键点击解决方案并添加 ![0008.gif]\
  \ 项目。\n\n为了使用你创建的类库，你需要为该新应用程序添加对 `Ch10Lib` 类库的引用。你可以通过 Reference Manager 的 `Projects`\
  \ 选项卡来实现，所示：\n\n![显示名为 Client 项目的 Reference Manager 对话框截图](img/Image00136.jpg)\n\
  \n**图 10‐12**\n\n由于这是你的第二个项目，你还需要指定它是解决方案的启动项目，即点击运行时将执行的项目。要这样做，只需右键点击项目名称并选择 StartUp\
  \ Project 。\n\n接下来，添加使用你新类的代码。这不需要特殊操作，以下代码即可（你可以在 `Ch10Client\\Program.cs` 中找到这些代码）：\n\
  \n```\n using System;\n\nusing System.Collections.Generic;\n\nusing System.Linq;\n\
  \nusing System.Text;\n\nusing System.Threading.Tasks;\n\nusing static System.Console;\n\
  \nusing Ch10CardLib;\n\nnamespace Ch10Client\n{\n   class Program\n   {\n      static\
  \ void Main(string[] args)\n      {\n\n         Deck myDeck = new Deck();\n\n  \
  \       myDeck.Shuffle();\n\n         for (int i = 0; i < 52; i++)\n         {\n\
  \n            Card tempCard = myDeck.GetCard(i);\n\n            Write(tempCard.ToString());\n\
  \n            if (i != 51)\n               Write(\", \");\n            else\n  \
  \             WriteLine();\n\n         }\n\n         ReadKey();\n\n      }\n\n \
  \  }\n\n} \n```\n\n图 10‐13 显示了如果你运行此应用程序将得到的结果。\n\n![运行使用 Ch10Client\\Program.cs\
  \ 代码后的结果截图说明](img/Image00137.jpg)\n\n**图 10‐13**\n\n这是牌中 52 张扑克牌随机排列。你将在后面的章节继续开发和使用此类库。\n\
  \n## 调用层次窗口\n\n现在是时候查看 Visual Studio 的另一个功能了：调用层次（Call Hierarchy）窗口。该窗口允许你对代码进行查询，以发现你的方法是从哪里调用的，以及它们与其他方法之间的关系。用一个示例来说明这一点是方法。\n\
  \n\n\n\n打开上一节中的示例应用程序，并打开 `Deck.cs` 代码文件。找到 `Shuffle()` 方法，右键点击它，并选择“查看调用层级”（View\
  \ Call Hierarchy）菜单项。出现的窗口如图图 10-14 所示（其中展开了部分区域）。\n\n![调用层级窗口外观的截图说明，其中展开了部分区域。](img/Image00138.jpg)\n\
  \n**图 10-14**](#text00013.html_R_c10-fig-0014)\n\n从 `Shuffle()` 方法开始，你可以深入窗口中的树形视图，找到所有调用该方法代码以及该方法执行的所有调用。例如，高亮的方法\
  \ `Next(int)` 是从 `Shuffle()` 调用的，因此它出现在“来自 Shuffle 的调用”（Calls From ‘Shuffle’）部分。当你点击某个调用时，可以在右侧看到执行该调用的代码行及其位置。你可以双击位置以立即跳转到所引的代码行。\n\
  \n此窗口在调试或重构代码时非常有用，因为它能让你一目了然不同代码段之间的关系。\n\n## 练习\n\n1. 10.1 编写代码定义一个基类 `MyClass`，包含一个虚拟方法\
  \ `GetString()`。该方法应返回存储在受保护字段 `myString` 中的字符串，该字段可以通过只写的公共属性 `ContainedString`\
  \ 访问。\n2. 10.2 从 `MyClass` 派生一个类 `MyDerivedClass`。重写 `GetString()` 方法以使用基类的实现返回基类的字符串，但在返回的字符串后添加文本“((output\
  \ from derived class)”。\n3. 10.3 部分方法的定义必须使用 `void` 返回类型。请说明其原因。\n4. 10.4 编写一个名为\
  \ `MyCopyableClass` 的类，使其能够使用 `GetCopy()` 方法返回自身的副本。该方法应使用继承自 `System.Object` 的\
  \ `MemberwiseClone()` 方法。为类添加一个简单的属性，并编写使用该类的客户端代码以确认一切运行正常。\n5. 10.5 为 `Ch10CardLib`\
  \ 库编写一个控制台客户端，一次从洗过的 `Deck` 对象中抽取五张牌。如果五张牌都是同一花色，则客户端应在屏幕上显示牌的名称以及文本 `Flush`；否则，它在处理\
  \ 50 张牌后退出并显示文本 `No flush`。\n\n练习答案可以在附录找到。\n\n## ![image](img/Image00002.gif) 本章学到的知识\n\
  \n| 主题 | 核心概念 |\n| --- | --- |\n| 成员定义 | 你可以在类中定义字段、方法和属性成员。字段通过访问级别、名称和类型来定义。方法通过访问级别、返回类型、名称和参数来定义。属性通过访问级别、名称以及\
  \ `get` 和/或 `set` 访问器来定义。单个属性访问器可以有它们自己的访问级别，但该级别必须低于属性本身的访问级别。 |\n| 成员隐藏与重写 | 在基类中可以将属性和方法定义为\
  \ `abstract`（抽象）或 `virtual`（虚），以定义继承。派生类必须实现抽象成员，并可以使用 `override` 关键字重写虚成员。它们还可以使用\
  \ `new` 关键字提供新的实现，并使用 `sealed` 关键字防止对 `virtual` 成员的进一步重写。可以使用 `base` 关键字调用基实现。 |\n\
  | 接口实现 | 实现接口的类必须以公共形式实现该接口定义的所有成员。你可以隐式地或显式地实现接口，其中显式实现仅通过接口引用可用。 |\n| 部分定义 | 你可以使用\
  \ `partial` 关键字将类定义跨越多个代码文件。你还可以使用 `partial` 关键字创建部分方法。部分方法有某些限制，包括没有返回值或 `out`\
  \ 参数，并且如果没有提供实现，则不会编译。 |\n\n# 11 集合、比较与转换\n\n## 集合\n\n在第 5 章中，你学习了如何使用数组创建包含特定数量对象或值的变量类型。然而，数组有其局限性。最大的限制是，一旦创建数组，它们的大小就是固定的，因此你无法在不创建新数组的情况下向现有数组尾添加新项。这通常意味着用于操作数组的语法可能会变得异常复杂。OOP\
  \ 技术使你能够创建在内部执行许多此类操作的类，从而简化使用项目列表或数组的代码。\n\nC# 中的数组被实现为 `System.Array` 类的实例，它们只是被称为集合类的类型中的一种。集合类通常用于维护对象列表，它们可能提供比简单数组更多的功能。这些功能的大部分通过实现来自\
  \ `System.Collections` 命名空间中的接口来实现，从而标准化了集合语法。该命名空间还包含其他有趣的内容，例如以 `System.Array`\
  \ 其他方式实现这些接口的类。\n\n由于集合的功能（包括通过使用 `[index]` 语法访问集合项的基本功能）可以通过接口可用，因此你并不局限于使用如 `System.Array`\
  \ 等基础集合类。相反，你可以创建自己的自定义集合类。这些类可以专门针对你想要枚举的对象（即你想要维护的对象）变得更具针对性。这样做的优势之一（正如你将看到的）是自定义集合类可以是**强类型**的。也就是说，当你从集合中提取项时，不需要将它们强制转换为正确的类型。另一个优势是能够暴露专门的方法。例如，在牌组的示例中，你可以添加一个方法来获取特定花色的所有\
  \ `Card` 项。\n\n`System.Collections` 命名空间中的几个接口提供了基本的集合功能：\n\n* `IEnumerable` — 提供遍历集合中项的能力。\n\
  * `ICollection` — 提供获取集合中项的数量并将项复制到简单数组的能力（继承自 `IEnumerable`）。\n* `IList` — 为集合提供项列表，以及访问这些项的能力和与项列表相关的一些其他基本能力（继承自\
  \ `IEnumerable` 和 `ICollection`）。\n* `IDictionary` — 与 `IList` 类似，但提供了通过键值访问的项列表，而不是索引（继承自\
  \ `IEnumerable` 和 `ICollection`）。\n\n`System.Array` 类实现了 `IList`、`ICollection` 和\
  \ `IEnumerable`。然而，它不支持 `IList` 的一些高级功能，并且它通过固定大小表示项列表。\n\n### 使用集合\n\n`System.Collections`\
  \ 命名空间中的一个类 `System.Collections.ArrayList` 也实现了 `IList`、`ICollection` 和 `IEnumerable`，但实现方式比\
  \ `System.Array` 更加复杂。数组的大小是固定的（你不能添加或删除元素），而此类可以用于表示变长度的项目列表。为了让你对这种高级集合的可能用法有更多感觉，下面的“尝试一试”（Try\
  \ It Out）使用了此类，以及一个简单的数组。\n\n### 定义集合\n\n\n\n\n既然你已经知道使用更高级的集合类可以实现的功能，现在是时候学习如何创建自己的强类型集合了。实现此目标的方法是手动实现所需的方法，但这可能是一个耗时且复杂的过程。另一种方法是你可以从一个类派生你的集合，例如\
  \ `System.Collections.CollectionBase`，这是一个抽象类，它为你提供了集合的大部分实现。强烈建议使用这种选项。\n\n`CollectionBase`\
  \ 类暴露了 `IEnumerable`、`ICollection` 和 `IList` 接口，但仅提供了部分必要的实现——特别是 `IList` 的 `Clear()`\
  \ 和 `RemoveAt()` 方法以及 `ICollection` 的 `Count` 属性。如果你想使用提供的功能，你需要自己实现所有其他内容。\n\n\
  为了方便操作，`CollectionBase` 提供了两个受保护属性，允许访问存储的对象本身。你可以使用 `List`（它通过 `IList` 接口提供项访问）以及\
  \ `InnerList`（它是用于存储项目的 `ArrayList` 对象）。\n\n例如，存储 `Animal` 对象的集合类的基础定义可以如下所示（稍后你会看到一个更完整的实现）：\n\
  \n```\n public class Animals : CollectionBase\n\n{\n\n   public void Add(Animal\
  \ newAnimal) => List.Add(newAnimal);\n\n   public void Remove(Animal oldAnimal)\
  \ => List.Remove(oldAnimal);\n\n   public Animals() {}\n\n} \n```\n\n在这里，`Add()`\
  \ 和 `Remove()` 被实现为强类型方法，它们使用用于访问项的 `IList` 接口中的标准 `Add()` 方法。现在暴露的方法将仅适用于 `Animal`\
  \ 类或派生自 `Animal` 的类，这与之前展示的可以处理任何对象的 `ArrayList` 实现不同。\n\n`CollectionBase` 类允许你在派生集合中使用\
  \ `foreach` 语法。例如，你可以使用如下代码：\n\n```\n WriteLine(\"Using custom collection class\
  \ Animals:\");\n\nAnimals animalCollection = new Animals();\n\nanimalCollection.Add(new\
  \ Cow(\"Lea\"));\n\nforeach (Animal myAnimal in animalCollection)\n{\n   WriteLine($\"\
  New { myAnimal.ToString()} object added to custom \" +\n             $\"collection,\
  \ Name = {myAnimal.Name}\");\n} \n```\n\n然而，你无法执行以下操作：\n\n```\n animalCollection[0].Feed();\
  \ \n```\n\n若要通过这种方式通过索引访问项，你需要使用索引器。\n\n### 索引器\n\n索引器（`indexer`）是一种特殊的属性，你可以将其添加到类中以提供类似数组的访问。事实上，你可以通过索引器提供更复杂的访问，因为你可以根据需要使用方括号语法定义并使用复杂的参数类型。然而，为项实现一个简单的数字索引是最常见的用法。\n\
  \n你可以按照如下方式为 `Animal` 对象的 `Animals` 集合添加索引器：\n\n```\n public class Animals : CollectionBase\n\
  \n   {\n\n      …\n\n      public Animal this[int animalIndex]\n      {\n      \
  \   get { return (Animal)List[animalIndex]; }\n         Set { List[animalIndex]\
  \ = value; }\n      }\n   } \n```\n\n`this` 关键字与方括号中的参数配合使用，但在除此之外的任何情况下，索引器看起来与其他任何属性非常相似。这种语法是有逻辑的，因为你通过使用对象名称后跟方括号中的索引参数来访问索引器（例如，`MyAnimals[0]`）。\n\
  \n索引器代码使用了 `List` 属性上的索引器（即在 `CollectionBase` 中提供访问存储项目的 `ArrayList` 的 `IList` 接口）：\n\
  \n```\n return (Animal)List[animalIndex]; \n```\n\n在这里必须进行显式转换，因为 `IList.List` 属性返回一个\
  \ `System.Object` 对象。这里需要注意的关键点是，你为此索引器定义了一个类型。这就是当你使用此索引器访问一个项时将获得的类型。这种强类型意味着你可以编写如下代码：\n\
  \n```\n animalCollection[0].Feed(); \n```\n\n而不是：\n\n```\n ((Animal)animalCollection[0]).Feed();\
  \ \n```\n\n这是强类型自定义集合的另一个方便的特性。在接下来的“尝试一下”（Try It Out）中，你将扩展之前的“尝试一下”来付诸实践。\n\n\
  ### 向 CardLib 添加一个卡牌集合\n\n在在上一个章节中，你创建了一个名为 `Ch10CardLib` 的类库项目，其中包含一个代表扑克牌的 `Card`\
  \ 类和一个代表牌组的 `Deck` 类——即 `Card` 类的集合。该集合之前是实现为简单数组的。\n\n在在本章中，你将向此库中添加一个新类，并将其重命名为\
  \ `Ch11CardLib`。这个新类 `Cards` 将是 `Card` 对象的自定义集合，使你获得在本章前面描述的所有益处。在 `C:\\BeginningCSharp7\\\
  Chapter11` 目录下创建一个名为 `Ch11CardLib` 的新类库。接下来，删除自动生成的 `Class1.cs` 文件；选择项目 ![image](img/Image00008.gif)\
  \ 添加现有项；从 `C:\\BeginningCSharp7\\Chapter10\\Ch10CardLib` 目录选择 `Card.cs`、`Deck.cs`、`Suit.cs`\
  \ 和 `Rank.cs` 文件；并将这些文件添加到项目中。与在第 10 章中引入的项目之前的版本一样，这些更改没有使用标准的“尝试一下”格式。\n\n本章下载的代码包含一个\
  \ `Ch11CardLib` 文件夹，其中包含了 `Ch11CardLib` 项目各种扩展所需的所有代码。正如此，你可能会注意到一些未包含在此示例中的额外代码。通常你会发现这些代码被注释掉了；但是当你到达相关的示例时，可以取消你想要的部分。\n\
  \n如果你决定自己创建此项目，请添加名为 `Cards` 的新类并按如下方式修改 `Cards.cs`：\n\n```\n using System;\nusing\
  \ System.Collections;\nusing System.Collections.Generic;\nusing System.Linq;\nusing\
  \ System.Text;\nusing System.Threading.Tasks;\n\nnamespace Ch11CardLib\n{\n   public\
  \ class Cards : CollectionBase\n   {\n      public void Add(Card newCard) => List.Add(newCard);\n\
  \n      public void Remove(Card oldCard) => List.Remove(oldCard);\n\n      public\
  \ Card this[int cardIndex]\n      {\n         get { return (Card)List[cardIndex];\
  \ }\n         set { List[cardIndex] = value; }\n      }\n\n      /// <summary>\n\
  \      /// 将卡牌实例复制到另一个 Cards\n      /// 的实用方法——用于 Deck.Shuffle()。此实现假设\n      ///\
  \ 源目标集合的大小相同。\n      /// </summary>\n      public void CopyTo(Cards targetCards)\n\
  \      {\n         for (int index = 0; index < this.Count; index++)\n         {\n\
  \            targetCards[index] = this[index];\n         }\n      }\n\n      ///\
  \ <summary>\n      /// 检查 Cards 集合是否包含特定的卡牌。\n      /// 这调用了集合 ArrayList 的 Contains\
  \ 方法，\n      /// 你通过 InnerList 属性访问它。\n      /// </summary>\n      public bool Contains(Card\
  \ card) => InnerList.Contains(card);\n   }\n} \n```\n\n接下来，修改 `Deck.cs` 以使用此新集合，而不是数组：\n\
  \n\n\n\n```cs\n using System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\n\nnamespace Ch11CardLib\n{\n   public class Deck\n   {\n   \
  \   private Cards cards = new Cards();\n      public Deck()\n      {\n         //\
  \ Line of code removed here\n         for (int suitVal = 0; suitVal < 4; suitVal++)\n\
  \         {\n            for (int rankVal = 1; rankVal < 14; rankVal++)\n      \
  \      {\n               cards.Add(new Card((Suit)suitVal, (Rank)rankVal));\n  \
  \          }\n         }\n      }\n      public Card GetCard(int cardNum)\n    \
  \  {\n         if (cardNum >= 0 && cardNum <= 51)\n            return cards[cardNum];\n\
  \         else\n            throw (new System.ArgumentOutOfRangeException(\"cardNum\"\
  , cardNum,\n                   \"Value must be between 0 and 51.\"));\n      }\n\
  \      public void Shuffle()\n      {\n         Cards newDeck = new Cards();\n \
  \        bool[] assigned = new bool[52];\n         Random sourceGen = new Random();\n\
  \         for (int i = 0; i < 52; i++)\n         {\n            int sourceCard =\
  \ 0;\n            bool foundCard = false;\n            while (foundCard == false)\n\
  \            {\n               sourceCard = sourceGen.Next(52);\n              \
  \ if (assigned[sourceCard] == false)\n                  foundCard = true;\n    \
  \        }\n            assigned[sourceCard] = true;\n            newDeck.Add(cards[sourceCard]);\n\
  \         }\n         newDeck.CopyTo(cards);\n      }\n   }\n}\n```\n\n这里不需要大量的改动。大部分更改涉及改变洗牌逻辑，允许将卡牌从\
  \ `cards` 中的随机索引添加到新 `Cards` 集合 `newDeck` 的开头，而不是从 `cards` 中的顺序位置添加到 `newDeck` 的随机索引。\n\
  \n用于 `Ch10CardLib` 解决方案的客户端控制台程序 `Ch10CardClient` 仍然可以使用这个新库，并获得与之前相同的结果，因为 `Deck`\
  \ 的方法签名没有更改。然而，该类库的客户端现在可以利用 `Cards` 集合类，而不是依赖 `Card` 对象的数组——例如，在纸牌应用程序中定义手牌。\n\n\
  ### 键值集合和 IDictionary\n\n除了实现 `IList` 接口外，集合也可以实现类似的 `IDictionary` 接口，该接口允许通过键值（如字符串名称）而不是索引来索引项。这同样通过索引器实现，尽管此处使用的索引器参数是与所存储项关联的键，而不是\
  \ `int` 索引，这可以使集合变得用户友好得多。\n\n与索引集合一样，你可以使用一个基类来简化 `IDictionary` 接口的实现：`DictionaryBase`。该类还实现了\
  \ `IEnumerable` 和 `ICollection`，提供了任何集合都通用的基本集合操作能力。\n\n`DictionaryBase`get `CollectionBase`\
  \ 一样实现了通过其支持的接口获取的部分（但不是全部）成员。与 `CollectionBase` 一样，`Clear` 和 `Count` 成员被实现了，但 `RemoveAt()`\
  \ 没有实现，因为它是 `IList` 接口上的方法，没有出现在 `IDictionary` 接口上。然而，`IDictionary` 确实有一个 `Remove()`\
  \ 方法，这是你在基于 `DictionaryBase` 的自定义集合类中应该实现的方法之一。\n\n下面的代码显示了 `Animals` 类的另一种版本，这次它派自\
  \ `DictionaryBase`。包含了对 `Add()`、`Remove()` 和通过键访问的索引器的实现：\n\n```cs\n public class\
  \ Animals : DictionaryBase\n{\n   public void Add(string newID, Animal newAnimal)\
  \ =>\n       Dictionary.Add(newID, newAnimal);\n   public void Remove(string animalID)\
  \ => \n       Dictionary.Remove(animalID);\n   public Animals() {}\n\n   public\
  \ Animal this[string animalID]\n   {\n      get { return (Animal)Dictionary[animalID];\
  \ }\n      set { Dictionary[animalID] = value; }\n   }\n}\n```\n\n这些成员之间的差异如下：\n\
  \n- `Add()`——接收两个参数（一个键和一个值）并将其一起存储。字典集合有一个继承自 `DictionaryBase` 的名为 `Dictionary`\
  \ 的成员，它是一个 `IDictionary` 接口。该接口有自己的 `Add()` 方法，接收两个对象参数。你的实现接收一个字符串值作为键，并将一个 `Animal`\
  \ 对象作为与该键一起存储的数据。\n- `Remove()`——接收一个键参数，而不是对象引用。指定键值的项将被移除。\n- 索引器（Indexer）使用字符串键值而不是索引，通过继承的\
  \ `Dictionary` 成员访问存储的项。同样，这里需要进行类型转换。\n\n基于 `DictionaryBase` 的集合与基于 `CollectionBase`\
  \ 的集合之间的另一个区别是 `foreach` 的工作方式略有不同。上一节中的集合允许你直接从集合中提取 `Animal` 对象。对派自 `DictionaryBase`\
  \ 的类使用 `foreach` 则会得到 `DictionaryEntry` 结构体，这是 `System.Collections` 命名空间中定义的另一种类型。\n\
  \n\n\n无论代码块是什么，其返回类型都是受限制的。可能与预期相反，这种返回类型与被枚举对象的类型并不相同。例如，在一个表示 `Animal` 对象集合的类中，迭代器块的返回类型不能是\
  \ `Animal`。两种可能的返回类型是之前提到的接口类型：`IEnumerable` 或 `IEnumerator`。你按照如下方式使用这些类型：\n\n\
  *   要迭代一个类，请使用名为 `GetEnumerator()` 的方法，其返回类型为 `IEnumerator`。\n*   要迭代类的成员（例如一个方法），请使用\
  \ `IEnumerable`。\n\n在迭代器块内部，你通过使用 `yield` 关键字来选择要在 `foreach` 循环使用的值。该操作的语法如下：\n\n\
  ```\n yield return value\n\n>; \n```\n\n这些信息足够你构建一个非常简单的示例了，如下（你可以在 `SimpleIterators\\\
  Program.cs` 中找到此代码）：\n\n```\n public static IEnumerable SimpleList()\n\n      {\n\
  \         yield return \"string 1\";\n\n         yield return \"string 2\";\n\n\
  \         yield return \"string 3\";\n      }\n\n      static void Main(string[]\
  \ args)\n\n      {\n         foreach (string item in SimpleList())\n           \
  \ WriteLine(item);\n\n         ReadKey();\n      } \n```\n\n在这里，静态方法 `SimpleList()`\
  \ 是迭代器块。因为它是一个方法，所以你使用 `IEnumerable` 作为返回类型。`SimpleList()` 使用 `yield` 关键字为使用它的 `foreach`\
  \ 块提供三个值，每个值都会被写入屏幕。结果显示在图 11‐3 中。\n\n![使用返回类型为 IEnumerable 的结果的屏幕截图。SimpleList()\
  \ 使用 yield 关键字提供三个值，每个值都会被写入屏幕。](img/Image00141.jpg)\n\n**图 11‐3**](#text00014.html_R_c11-fig-0003)\n\
  \n显然，这个迭代器并不是特别实用的，但它展示了它是如何运行的，以及实现可以有多简单。看着代码，你可能会奇怪代码是如何知道返回 `string` 类型项的。事实上，它并没有这样做；它返回的是\
  \ `object` 类型的值。如你所知，`object` 是所有类型的基类，因此你可以从 `yield` 语句返回任何内容。\n\n然而，编译器足够智能，你可以在\
  \ `foreach` 循环的上下文中将返回的值解释为你想要的任何类型。在这里，代码请求 `string` 类型的值，因此你得到的是用于处理的值。如果你更改了其中一条\
  \ `yield` 行使其返回（例如）一个整数，你将在 `foreach` 循环中得到一个类型转换异常。\n\n关于迭代器还有一点。你可以使用以下语句来中断向\
  \ `foreach` 循环的信息的返回：\n\n```\n yield break; \n```\n\n当在迭代器中遇到此语句时，迭代器的处理将立即终止，使用它的\
  \ `foreach` 循环也是如此。\n\n现在是时候来看一个更复杂——更有用的示例了！在这次“尝试一试”中，你将实现一个获取质数的迭代器。\n\n### 迭代器与集合\n\
  \n之前曾向你承诺过解释如何使用迭代器来遍历字典类型集合中存储的对象，而无需处理 `DictionaryItem` 对象。在本章的可下载代码中，你将在 `DictionaryAnimals`\
  \ 文件夹中找到下一个项目的代码。回集合类 `Animals`：\n\n```\n public class Animals : DictionaryBase\n\
  \n{\n   public void Add(string newID, Animal newAnimal) =>\n\n       Dictionary.Add(newID,\
  \ newAnimal);\n\n   public void Remove(string animalID) => \n       Dictionary.Remove(animalID);\n\
  \n   public Animal this[string animalID]\n   {\n      get { return (Animal)Dictionary[animalID];\
  \ }\n      set { Dictionary[animalID] = value; }\n   }\n} \n```\n\n你可以将这个简单的迭代器添加到代码中以获得所需的行为：\n\
  \n```\n public new IEnumerator GetEnumerator()\n\n      {\n         foreach (object\
  \ animal in Dictionary.Values)\n            yield return (Animal)animal;\n     \
  \ } \n```\n\n现在，你可以使用以下代码来遍历集合中的 `Animal` 对象：\n\n```\n foreach (Animal myAnimal\
  \ in animalCollection)\n\n         {\n            WriteLine($\"New {myAnimal.ToString()}\
  \ object added to \" +\n                      $\" custom collection, Name = {myAnimal.Name}\"\
  );\n         } \n```\n\n### 深拷贝\n\n第 9 章 描述了如何通过受保护的方法 `System.Object.MemberwiseClone()`\
  \ 执行浅拷贝，并使用像此处所示的 `GetCopy()` 方法：\n\n```\n public class Cloner\n\n{\n   public int\
  \ Val;\n   public Cloner(int newVal) => Val = newVal;\n   public object GetCopy()\
  \ => MemberwiseClone();\n} \n```\n\n假设你拥有的字段是引用类型而不是值类型（例如，对象）：\n\n```\n public\
  \ class Content\n\n{\n   public int Val;\n}\n\npublic class Cloner\n{\n   public\
  \ Content MyContent = new Content();\n   public Cloner(int newVal) => MyContent.Val\
  \ = newVal;\n   public object GetCopy() => MemberwiseClone();\n}\n```\n\n在这种情况下，`MyContent`\
  \ 指向与原始对象相同的对象。以下代码说明了浅拷贝的后果：\n\n```\n Cloner mySource = new Cloner(5);\n\nCloner\
  \ myTarget = (Cloner)mySource.GetCopy();\n\nWriteLine($\"myTarget.MyContent.Val}\"\
  );\n\nmySource.MyContent.Val = 2;\n\nWriteLine($\"myTarget.MyContent.Val}\");\n\
  ```\n\n\n\n\n\n你可以通过使用 `ICloneable` 接口实现复制 `Card`、`Cards` 和 `Deck` 对象的能力来付诸实践。这在某些牌游戏中可能很有用，因为你并不一定想要两个引用同一组\
  \ `Card` 对象的牌组，尽管你可能想让一个牌组的牌序与另一个牌组相同。\n\n在 `Ch11CardLib` 中为 `Card` 类实现克隆功能很简单，因为浅拷贝就足够了（`Card`\
  \ 只包含值类型数据，以字段的形式存在）。首先，对 `class` 定义进行以下更改：\n\n```csharp\n public class Card : ICloneable\n\
  \ {\n      public object Clone() => MemberwiseClone(); \n```\n```\n\n这个对 `ICloneable`\
  \ 的实现只是浅拷贝。没有规则规定 `Clone()` 方法中应该发生什么，但这对于你的目的已经足够。\n\n接下来，在 `Cards` 集合类上实现 `ICloneable`。这稍微复杂一些，因为涉及克隆原始集合中的每个\
  \ `Card` 对象——所以你需要进行深拷贝：\n\n```csharp\n public class Cards : CollectionBase, ICloneable\n\
  \ {\n      public object Clone()\n      {\n         Cards newCards = new Cards();\n\
  \         foreach (Card sourceCard in List)\n         {\n            newCards.Add((Card)sourceCard.Clone());\n\
  \         }\n         return newCards;\n      } \n```\n```\n\n最后，在 `Deck` 类上实现 `ICloneable`。注意这里有一个小问题：`Ch11CardLib`\
  \ 中的 `Deck` 类没有方法修改它所包含的牌，除非对它们进行洗牌。例如，无法修改一个 `Deck` 实例使其具有特定的牌序。为了解决这个问题，为 `Deck`\
  \ 类定义一个新的私有构造函数，允许在实例化 `Deck` 对象时传入特定的 `Cards` 集合。以下是在该类中实现克隆的代码：\n\n```csharp\n\
  \ public class Deck : ICloneable\n {\n      public object Clone()\n      {\n   \
  \      Deck newDeck = new Deck(cards.Clone() as Cards);\n         return newDeck;\n\
  \      }\n      private Deck(Cards newCards) => cards = newCards; \n```\n```\n\n\
  再次，你可以使用一些简单的客户端代码对其进行测试。与之前一样，将此代码放在客户端项目的 `Main()` 方法中进行测试（你可以在该章节在线下载的 `Ch11CardClient\\\
  Program.cs` 中找到此代码）：\n\n```csharp\n Deck deck1 = new Deck();\nDeck deck2 = (Deck)deck1.Clone();\n\
  WriteLine($\"The first card in the original deck is: {deck1.GetCard(0)}\");\nWriteLine($\"\
  The first card in the cloned deck is: {deck2.GetCard(0)}\");\ndeck1.Shuffle();\n\
  WriteLine(\"Original deck shuffled.\");\nWriteLine($\"The first card in the original\
  \ deck is: {deck1.GetCard(0)}\");\nWriteLine($\"The first card in the cloned deck\
  \ is: {deck2.GetCard(0)}\");\nReadKey(); \n```\n```\n\n输出将类似于图 11-5 所示的内容。\n\n![在将代码\
  \ Ch11CardClient\\Program.cs 放入客户端项目的 Main() 方法进行测试时的输出插图](img/Image00143.jpg)\n\
  \n**图 11-5**\n\n### 比较\n\n本节涵盖了对象之间的两种类型的比较：\n\n* 类型比较\n* 值比较\n\n类型比较——即确定一个对象是什么，或者它继承自什么——在\
  \ C# 编程的所有领域都至关重要。通常当你传递一个对象时（例如传递给一个方法），接下来会发生什么取决于对象的类型。你已经在本章及之前的章节中简要地见过这一点，但在这里，你将看到一些更有实用的技巧。\n\
  \n值比较也是你见过很多次的，至少对于简单类型是如此。在比较对象的值时，情况会变得复杂一些。首先，你必须定义什么是比较，以及 `>` 这样的运算符在你的类上下文中意味着什么。这在集合中尤为重要，你可能希望根据某些条件对对象进行排序，也许按字母顺序或根据更复杂的算法。\n\
  \n### 类型比较\n\n在比较对象时，你通常需要知道它们的类型，这让你能够判断是否可以进行值比较。在第 9 章中，你看到了 `GetType()` 方法，所有类都继承自\
  \ `System.Object`，以及该方法如何与 `typeof()` 运算符结合使用来确定（并根据对象类型采取行动）：\n\n```csharp\n if\
  \ (myObj.GetType() == typeof(MyComplexClass))\n{\n   // myObj 是 MyComplexClass 类的实例。\n\
  } \n```\n```\n\n你还见过 `ToString()` 的默认实现（它也继承自 `System.Object`），它将为你提供对象类型的字符串表示。你也可以比较这些字符串，尽管这种实现方法相当杂乱。\n\
  \n本节演示了一种方便的简写操作方法：`is` 运算符。该运算符允许编写更具读性的代码，并且正如你将看到的，它具有检查基类的优势。不过在查看 `is` 运算符之前，你需要了解装箱和拆箱。\n\
  \n#### 装箱和拆箱\n\n在第 8 章中，你学习了引用类型和值类型之间的区别。装箱是将值类型转换为 `object` 的行为。例如，假设你有如下结构体：\n\
  \n```csharp\n struct MyStruct\n{\n   public int Val;\n}\n```\n\n将结构体装箱到 `object`\
  \ 类型变量：\n\n```csharp\n MyStruct valType1 = new MyStruct();\nvalType1.Val = 5;\n\
  object refType = valType1;\n```\n\n通过这种方式创建的对象包含值类型的拷贝，而不是对值类型的引用。你可以通过修改原始结构体的内容然后拆箱结构体到一个新变量来验证这一点：\n\
  \n```csharp\n valType1.Val = 6;\nMyStruct valType2 = (MyStruct)refType;\nWriteLine($\"\
  valType2.Val = {valType2.Val}\");\n```\n\n这段代码输出如下：\n\n```\nvalType2.Val = 5\n```\n\
  \n然而，当你将引用类型赋值给对象时，你会得到不同的行为。你可以通过将 `MyStruct` 改为类来观察（尽管这个类的名称现在不再合适）：\n\n```csharp\n\
  \ class MyStruct\n{\n   public int Val;\n}\n```\n\n无需修改之前显示的客户端代码（再次忽略变量命名问题），你会得到以下输出：\n\
  \n```\nvalType2.Val = 6\n```\n\n你也可以将值类型装箱到接口类型，只要它们实现了该接口。例如，假设 `MyStruct` 类型实现了如下\
  \ `IMyInterface` 接口：\n\n```csharp\n interface IMyInterface {}\nstruct MyStruct :\
  \ IMyInterface\n{\n   public int Val;\n}\n```\n\n然后你可以将结构体装箱到 `IMyInterface` 类型：\n\
  \n```csharp\n MyStruct valType1 = new MyStruct();\nIMyInterface refType = valType1;\n\
  ```\n\n你可以使用标准的强制转换语法对其进行拆箱：\n\n```csharp\n MyStruct ValType2 = (MyStruct)refType;\
  \ \n```\n```\n\n正如这些示例所示，装箱是在你不干预的情况下完成的——也就是说，你不需要编写任何代码来实现。然而，拆箱值需要显式转换，并且要求进行强制转换（装箱是隐式的，没有这一要求）。\n\
  \n\n\n\n你可能在想实际上为什么要这样做。装箱（boxing）极其有用，有两个非常充分的理由。首先，它允许你在项类型为 `object` 的集合（例如 `ArrayList`）中使用值类型。其次，它是让你能够对值类型（如\
  \ `int` 和结构体 `struct`）调用 `object` 方法的内部机制。\n\n值得注意的是，在访问值类型的内容之前，必须先进行拆箱（unboxing）。\n\
  \n### is 运算符\n\n尽管顾名其义，但 `is` 运算符并不是判断对象是否为特定类型的方法。相反，`is` 运算符允许你检查对象是否是某个给定类型，或者*可以转换为*该类型。如果是这种情况，则该运算符的结果为\
  \ `true`。\n\n早些的示例展示了 `Cow` 和 `Chicken` 类，它们都继承自 `Animal`。使用 `is` 运算符与 `Animal`\
  \ 类型的对象进行比较时，对于这三个类型的任何一个对象都会返回 `true`，而不仅仅是 `Animal`。这是你使用之前展示的 `GetType()` 方法和\
  \ `typeof()` 运算符很难实现的。\n\n`is` 运算符具有以下语法：\n\n```\noperand\n\n> is type\n\n> \n```\n\
  \n此表达式的可能结果如下：\n\n- 如果 `<type>` 是类类型，当 `<operand>` 是该类型、继承自该类型或可以装箱为该类型时，结果为 `true`。\n\
  - 如果 `<type>` 是接口类型，当 `<operand>` 是该类型或是实现该接口的类型时，结果为 `true`。\n- 如果 `<type>` 是值类型，当\
  \ `<operand>` 是该类型或是可以拆箱为该类型的类型时，结果为 `true`。\n\n接下来的“尝试一试”部分展示了这在实践中是如何运作的。\n\n\
  #### 使用 is 运算符的模式匹配表达式\n\n回想第 4 章，在该章引入了 `switch` 语句，并在第 5 章中它被扩展为包含支持基于变量类型（`string`、`int`\
  \ 等）匹配的用例。一旦确定了类型，你就可以访问其属性和方法以进一步缩小匹配范围。\n\n`switch case` 方法是模式匹配更优雅的方式，因为 `is`\
  \ 运算符通常实现了许多 `if…else if…` 语句。随着你想要模式匹配的场景扩大，语句可能会变得很深且很长，导致代码可读性降低。如果真的发生了这种情况，请记住替代方案是\
  \ `switch case` 模式匹配功能。然而，对于较小的代码段，`is` 运算符是匹配模式和过滤数据集的一种非常有效且强大的策略。以以下代码为例：\n\n\
  ```\nobject[] data = \n\n      { 1.6180, null, new Cow(\"Rual\"), new Chicken(\"\
  Lea\"), \"none\" };\n\nforeach (var item in data)\n\n{\n  if (item is 1.6180) WriteLine(\"\
  The Golden Ratio\");\n\n  else if (item is null) WriteLine(\"The value is null\"\
  );\n\n  else if (item is Cow co) WriteLine($\"The cow is named {co.Name}.\");\n\n\
  \  else if (item is Chicken ch) WriteLine(\"The chicken is named\" +\n\n       \
  \    $\" {ch.Name} and {ch.RunInCircles()}\");\n\n  else if (item is var catcher)\
  \ WriteLine(\"Catch all for\" +\n\n           $\" {catcher.GetType().Name}); \n\
  } \n```\n\n存储在 `data` 变量中的对象包含几种不同的类型。使用 `foreach` 语句遍历 `object[]` 数组，可以使用 `is`\
  \ 运算符检查变量的类型，并在匹配时采取适当的操作。第一个模式匹配是针对 1.6180 的，这是一个常量值，是常量模式（const pattern）的一个示例，第二个模式匹配中的\
  \ `null` 也是如此。在匹配常量时，可以使用 `==` 运算符来实现相同的结果；但是，`is` 运算符更容易理解且更友善。\n\n`data` 变量中的最后两个对象类型为\
  \ `Cow` 和 `Chicken`。类型模式（type pattern）在发生模式匹配时会分配一个指定类型的新变量。例如，当匹配到 `Chicken` 时，会创建一个包含\
  \ `Chicken` 实例的新变量 `ch`，允许程序员访问 `Chicken` 类中包含的属性和方法（例如属性 `name` 和方法 `RunInCircles()`）。\n\
  \n最后，你可以使用 `var pattern`（var 模式）捕获代码路径中未匹配任何上方 `if…else if…` 语句的所有场景。然后使用 `catcher`\
  \ 变量通过 `GetType().Name` 属性获取变量类型。\n\n### 值的比较\n\n考虑两个代表人的 `Person` 对象，每个对象都有一个整数属性\
  \ `Age`。你可能想比较它们以查看谁年纪更大。你可以直接使用以下代码：\n\n```\nif (person1.Age > person2.Age)\n\n\
  {\n   …\n} \n```\n\n这可以正常工作，但还有其他方案。你可能更喜欢使用如下语法：\n\n```\nif (person1 > person2)\n\
  \n{\n   …\n}\n```\n\n### 运算符重载\n\n运算符重载允许对你设计的类使用标准运算符（如 `+`、`>` 等）。这被称为“重载”，因为你为这些运算符提供了自己的实现，就像你通过提供不同的参数来重载方法一样。\n\
  \n运算符重载非常有用，因为你可以在运算符的实现中执行任何你想要的处理，这些处理并不像像 `+` 意味着“相加两个操作数”那样简单。\n\n不过，首先让我们来看运算符重载的基本语法。可以通过向类中添加运算符类型成员（必须是静态的）来重载运算符。某些运算符有多种用途（例如\
  \ `-` 具有一元和二进制能力），因此你还需要指定你处理的是多少操作数以及这些操作数的类型。通常情况下，操作数的类型将与定义运算符的类类型相同，尽管正如稍后将看到的，也可以定义处理混合类型的运算符。\n\
  \n作为一个示例，考虑如下所示的简单类型 `AddClass1`：\n\n```csharp\npublic class AddClass1\n\n{\n  \
  \ public int val;\n} \n```\n\n\n\n\n这只是对一个 `int` 值的包装，但它说明了相关原理。使用此类类，类似下面的代码将无法编译：\n\
  \n```\n AddClass1 op1 = new AddClass1();\n\nop1.val = 5;\n\n AddClass1 op2 = new\
  \ AddClass1();\n\nop2.val = 5;\n\n AddClass1 op3 = op1 + op2; \n```\n\n你得到的错误会告知你\
  \ `+` 运算符无法应用于 `AddClass1` 类型的操作数。这是因为你还没有定义要执行的操作。类似下面的代码可以运行，但它不会给你你可能想要的结果：\n\
  \n```\n AddClass1 op1 = new AddClass1();\n\nop1.val = 5;\n\n AddClass1 op2 = new\
  \ AddClass1();\n\nop2.val = 5;\n\nbool op3 = op1 == op2; \n```\n\n在这里，`op1` 和 `op2`\
  \ 使用 `==` 二元运算符进行比较，以确定它们是否引用的是同一个对象，而不是验证它们的值是否相等。在前面的代码中，尽管 `op1.val` 和 `op2.val`\
  \ 是相同的，但 `op3` 将为 `false`。\n\n要重载 `+` 运算符，请使用以下代码：\n\n```\n public class AddClass1\n\
  \n{\n\n   public int val;\n\n   public static AddClass1 operator +(AddClass1 op1,\
  \ AddClass1 op2)\n\n   {\n      AddClass1 returnVal = new AddClass1();\n      returnVal.val\
  \ = op1.val + op2.val;\n      return returnVal;\n   }\n\n} \n```\n\n如你所见，运算符重载看起来与标准的\
  \ `static` 方法声明非常相似，只是它们使用了 `operator` 关键字和运算符本身，而不是方法名。你现在可以成功地在该类中使用 `+` 运算符，就像之前的示例一样：\n\
  \n```\n AddClass1 op3 = op1 + op2; \n```\n\n重载所有二元运算符都遵循相同的模式。一元运算符看起来相似，但只有一个参数：\n\
  \n```\n public class AddClass1\n\n{\n   public int val;\n\n   public static AddClass1\
  \ operator +(AddClass1 op1, AddClass1 op2)\n   {\n      AddClass1 returnVal = new\
  \ AddClass1();\n      returnVal.val = op1.val + op2.val;\n      return returnVal;\n\
  \   }\n\n   public static AddClass1 operator ‐(AddClass1 op1)\n   {\n      AddClass1\
  \ returnVal = new AddClass1();\n      returnVal.val = ‐op1.val;\n      return returnVal;\n\
  \   }\n\n} \n```\n\n这两个运算符都作用于与该类相同类型的操作数，并且其返回值也是该类型。然而，考虑以下类定义：\n\n```\n public\
  \ class AddClass1\n\n{\n   public int val;\n\n   public static AddClass3 operator\
  \ +(AddClass1 op1, AddClass2 op2)\n   {\n      AddClass3 returnVal = new AddClass3();\n\
  \      returnVal.val = op1.val + op2.val;\n      return returnVal;\n   }\n\n}\n\n\
  public class AddClass2\n\n{\n   public int val;\n}\n\npublic class AddClass3\n\n\
  {\n   public int val;\n} \n```\n\n这将允许以下代码运行：\n\n```\n AddClass1 op1 = new AddClass1();\n\
  \nop1.val = 5;\n\n AddClass2 op2 = new AddClass2();\n\nop2.val = 5;\n\n AddClass3\
  \ op3 = op1 + op2; \n```\n\n在适当的情况下，你可以这样混合类型。但请注意，如果你向 `AddClass2` 也添加了相同的运算符，那么前面的代码将会失败，因为对于使用哪个运算符将产生歧义。因此，你应该小心不要在多个类中添加相同签的运算符。\n\
  \n此外，如果你混合了类型，则操作数的提供顺序必须与运算符重载中参数的顺序一致。如果你尝试以错误的顺序使用重载的运算符，则该操作将失败。例如，你不能这样使用运算符：\n\
  \n```\n AddClass3 op3 = op2 + op1; \n```\n\n除非你当然提供了另一个参数反转的重载版本：\n\n```\n public\
  \ static AddClass3 operator +(AddClass2 op1, AddClass1 op2)\n{\n   AddClass3 returnVal\
  \ = new AddClass3();\n   returnVal.val = op1.val + op2.val;\n   return returnVal;\n\
  } \n```\n\n以下运算符可以被重载：\n\n-   **一元运算符** — `+`, `‐`, `!`, `~`, `++`, `‐非`, `true`,\
  \ `false`\n-   **二元运算符** — `+`, `‐`, `*`, `/`, `%`, `&`, `|`, `^`, `<<`, `>>`\n\
  -   **比较运算符** — `==`, `!=`, `<`, `>`, `<=`, `>=`\n\n你不能重载赋值运算符（例如 `+=`），但这些运算符使用了它们简单的对应项（如\
  \ `+`），所以你不需要担心这个。重载 `+` 意味着 `+=` 将按预期运行。`==` 赋值运算符不能重载，因为它有如此基础的用法，但该运算符与用户定义的转换运算符有关，你将在下一节中查看它们。\n\
  \n你不能重载 `&&` 和 `||`，但这些运算符使用 `&` 和 `|` 运算符执行计算，因此重载它们就足够了。\n\n某些运算符（如 `<` 和 `>`）必须成对重载。也就是说，如果不重载\
  \ `>`，就无法重载 `<`。在许多情况下，你可以通过调用其他运算符来减少代码（以及可能发生的错误），如示例所示：\n\n```\n public class\
  \ AddClass1\n\n{\n   public int val;\n\n   public static bool operator >=(AddClass1\
  \ op1, AddClass1 op2)\n          => (op1.val >= op2.val);\n   public static bool\
  \ operator <(AddClass1 op1, AddClass1 op2)\n          => !(op1 >= op2);\n\n   //\
  \ 还需要 <= 和 > 运算符实现\n\n}\n```\n\n在复杂的运算符定义中，这可以减少代码量。这意味着你需要修改的代码更少。`==` 和 `!=` 也是如此，但对于这些运算符，为了完整性，通常值得添加。它需要以下非静态方法：\n\
  \n```\n public class AddClass1\n\n{\n   public int val;\n\n   public static bool\
  \ operator ==(AddClass1 op1, AddClass1 op2)\n          => (op1.val == op2.val);\n\
  \   public static bool operator !=(AddClass1 op1, AddClass1 op2)\n          => !(op1\
  \ == op2);\n\n   public override bool Equals(object op1) => //;\n\n   public override\
  \ int GetHashCode() => val;\n}\n```\n\n`GetHashCode()` 用于根据状态为对象实例获取一个唯一的 `int`\
  \ 值。在这里，使用 `val` 是可以，因为它也是一个 `int` 值。注意 `Equals()` 使用 `object` 类型参数。你必须使用此签名，否则你将是重载该方法而不是覆盖它，默认实现对用户仍然可用。相反，你必须使用类型转换来获得结果。通常值得使用之前讨论过的\
  \ `is` 运算符来检查对象类型，代码如下：\n\n```\n public override bool Equals(object op1)\n   {\n\
  \      if (op1 is AddClass1)\n      {\n         return val == ((AddClass1)op1).val;\n\
  \      }\n      else\n      {\n         throw new ArgumentException(\n         \
  \   \"无法将 AddClass1 对象与类型为 \"\n            + op1.GetType().ToString() + \"的对象进行比较\"\
  );\n      }\n   } \n```\n\n\n\n现在你将再次升级 `Ch11CardLib` 项目，为 `Card` 类添加操作符重载。同样，你可以在本章节代码下载的\
  \ `Ch11CardLib` 文件夹中找到后续类的代码。不过，首先，你将向 `Card` 类添加额外的字段，以支持王牌以及将王牌设为大的选项。你将这些字段设为静态的（static），因为当它们被设置时，它们适用于所有的\
  \ `Card` 对象：\n\n```csharp\n public class Card\n   {\n      /// <summary>\n     \
  \ /// 使用王牌标记。如果为 true，则王牌的权重高于\n      /// 其他花色的牌牌。\n      /// </summary>\n     \
  \ public static bool useTrumps = false;\n\n      /// <summary>\n      /// 如果 useTrumps\
  \ 为 true，则使用的王色。\n      /// </summary>\n      public static Suit trump = Suit.Club;\n\
  \n      /// <summary>\n      /// 决定王牌是大于王还是小于 2 的标记。\n      /// </summary>\n   \
  \   public static bool isAceHigh = true; \n```\n\n这些规则适用于应用程序中每个 `Deck` 里的所有 `Card`\
  \ 对象。不可能拥有两个牌组，它们包含的牌遵循不同的规则。不过，对于这个类库来说没问题，因为你可以安全地假设，如果单个应用程序想要使用不同的规则，它可以自己维护这些规则，也许在每次切换牌组时设置\
  \ `Card` 的静态成员。\n\n由于你已经执行了这一点，有必要在 `Deck` 类中再添加几个构造函数，以初始化具有不同特征的牌组：\n\n```csharp\n\
  \  /// <summary>\n      /// 非默认构造函数。允许将王牌设大。\n      /// </summary>\n      public\
  \ Deck(bool isAceHigh) : this()\n      {\n         Card.isAceHigh = isAceHigh;\n\
  \      }\n\n      /// <summary>\n      /// 非默认构造函数。允许使用王牌。\n      /// </summary>\n\
  \      public Deck(bool useTrumps, Suit trump) : this()\n      {\n         Card.useTrumps\
  \ = useTrumps;\n         Card.trump = trump;\n      }\n\n      /// <summary>\n \
  \     /// 非默认构造函数。允许将王牌设大并使用王牌。\n      /// </summary>\n      public Deck(bool isAceHigh,\
  \ bool useTrumps, Suit trump) : this()\n      {\n         Card.isAceHigh = isAceHigh;\n\
  \         Card.useTrumps = useTrumps;\n         Card.trump = trump;\n      } \n\
  ```\n\n这些构造函数每一个都是使用第 9 章所示的 `: this()` 语法定义的，因此在所有情况下，默认构造函数都会在非默认构造函数之前调用，从而初始化牌组。\n\
  \n现在为 `Card` 类添加重载（以及建议的重写）：\n\n```csharp\n public static bool operator ==(Card\
  \ card1, Card card2)\n         => (card1?.suit == card2?.suit) && (card1?.rank ==\
  \ card2?.rank);\n\n      public static bool operator !=(Card card1, Card card2)\n\
  \             => !(card1 == card2);\n\n      public override bool Equals(object\
  \ card) => this == (Card)card;\n\n      public override int GetHashCode()\n    \
  \                  => 13 * (int)suit + (int)rank;\n\n      public static bool operator\
  \ >(Card card1, Card card2)\n      {\n         if (card1.suit == card2.suit)\n \
  \        {\n            if (isAceHigh)\n            {\n               if (card1.rank\
  \ == Rank.Ace)\n               {\n                  if (card2.rank == Rank.Ace)\n\
  \                     return false;\n                  else\n                  \
  \   return true;\n               }\n               else\n               {\n    \
  \              if (card2.rank == Rank.Ace)\n                     return false;\n\
  \                  else\n                     return (card1.rank > card2?.rank);\n\
  \               }\n            }\n            else\n            {\n            \
  \   return (card1.rank > card2.rank);\n            }\n         }\n         else\n\
  \         {\n            if (useTrumps && (card2.suit == Card.trump))\n        \
  \       return false;\n            else\n               return true;\n         }\n\
  \      }\n\n      public static bool operator <(Card card1, Card card2)\n      \
  \       => !(card1 >= card2);\n\n      public static bool operator >=(Card card1,\
  \ Card card2)\n      {\n         if (card1.suit == card2.suit)\n         {\n   \
  \         if (isAceHigh)\n            {\n               if (card1.rank == Rank.Ace)\n\
  \               {\n                  return true;\n               }\n          \
  \     else\n               {\n                  if (card2.rank == Rank.Ace)\n  \
  \                   return false;\n                  else\n                    \
  \ return (card1.rank >= card2.rank);\n               }\n            }\n        \
  \    else\n            {\n               return (card1.rank >= card2.rank);\n  \
  \          }\n         }\n         else\n         {\n            if (useTrumps &&\
  \ (card2.suit == Card.trump))\n               return false;\n            else\n\
  \               return true;\n         }\n      }\n\n      public static bool operator\
  \ <=(Card card1, Card card2)\n             => !(card1 > card2); \n```\n\n这里没什么特别需要注意的，也许\
  \ `>` 和 `>=` 重载操作符的代码稍显长。如果你单步执行 `>` 的代码，就可以看到它是如何工作的，以及为什么这些步骤是必要的。如果 `card1` 和\
  \ `card2` 的花色相同，那么如果 `isAceHigh` 为 `true`，你不能直接通过它们在 `Rank` 枚举中的值进行比较，因为王牌的值为 `1`，小于其他点。相反，使用以下步骤：\n\
  \n* 如果 `card1` 是王牌，那么检查 `card2` 是否也是王牌。如果是，则第一张牌不会大于第二张；如果 `card2` 不是王牌，则第一张牌胜出：\n\
  ```csharp\n     if (isAceHigh)\n                {\n                   if (card1.rank\
  \ == Rank.Ace)\n                   {\n                      if (card2.rank == Rank.Ace)\n\
  \                         return false;\n                      else\n          \
  \               return true;\n                   }\n```\n* 如果 `card1` 不是王牌，你还需要检查第二张是不是。如果是，则第二张牌胜出；否则，你可以比较点数，因为你知道王牌不是问题：\n\
  ```csharp\n     else\n                   {\n                      if (card2.rank\
  \ == Rank.Ace)\n                         return false;\n                      else\n\
  \                         return (card1.rank > card2?.rank);\n                 \
  \  }\n```\n* 如果王牌不是大的，那么你只需比较点数：\n```csharp\n     else\n                {\n    \
  \               return (card1.rank > card2.rank);\n                }\n```\n\n代码其余部分涉及\
  \ `card1` 和 `card2` 花色不同的情况。在这里，静态的 `useTrumps` 标记至关重要。如果该标记为 `true` 且 `card2` 是王牌色，那么你可以断定\
  \ `card1` 不是王牌（因为两张牌的花色不同）；而王牌总是获胜，所以 `card2` 是更大的牌：\n```csharp\n else\n   {\n \
  \     if (useTrumps && (card2.suit == Card.trump))\n         return false;\n```\n\
  如果 `card2` 不是王牌（或者 `useTrumps` 为 `false` ），那么 `card1` 胜出，因为它是先出的牌：\n```csharp\n\
  \ else\n         return true;\n   }\n}\n```\n\n只有另一个操作符（`>=` ）使用了与此的代码，而其他操作符非常简单，因此没有必要对它们进行更详细的说明。\n\
  \n\n\n\n\n以下简单的客户端代码测试了这些操作符。只需将其置在客户端项目的 `Main()` 方法中即可进行测试，就像之前在 `CardLib` 示例中所示客户端代码一样（你可以在\
  \ `Ch11CardClient\\Program.cs` 中找到这段代码）：\n\n```\n Card.isAceHigh = true;\nWriteLine(\"\
  Aces are high.\");\nCard.useTrumps = true;\nCard.trump = Suit.Club;\nWriteLine(\"\
  Clubs are trumps.\");\nCard card1, card2, card3, card4, card5;\ncard1 = new Card(Suit.Club,\
  \ Rank.Five);\ncard2 = new Card(Suit.Club, Rank.Five);\ncard3 = new Card(Suit.Club,\
  \ Rank.Ace);\ncard4 = new Card(Suit.Heart, Rank.Ten);\ncard5 = new Card(Suit.Diamond,\
  \ Rank.Ace);\nWriteLine($\"{card1.ToString()} == {card2.ToString()} ? {card1 ==\
  \ card2}\");\nWriteLine($\"{card1.ToString()} != {card3.ToString()} ? {card1 !=\
  \ card3}\");\nWriteLine($\"{card1.ToString()}.Equals({card4.ToString()}) ? \" +\n\
  \      $\" { card1.Equals(card4)}\");\nWriteLine($\"Card.Equals({card3.ToString()},\
  \ {card4.ToString()}) ? \" +\n      $\" { Card.Equals(card3, card4)}\");\nWriteLine($\"\
  {card1.ToString()} > {card2.ToString()} ? {card1 > card2}\");\nWriteLine($\"{card1.ToString()}\
  \ <= {card3.ToString()} ? {card1 <= card3}\");\nWriteLine($\"{card1.ToString()}\
  \ > {card4.ToString()} ? {card1 > card4}\");\nWriteLine($\"{card4.ToString()} >\
  \ {card1.ToString()} ? {card4 > card1}\");\nWriteLine($\"{card5.ToString()} > {card4.ToString()}\
  \ ? {card5 > card4}\");\nWriteLine($\"{card4.ToString()} > {card5.ToString()} ?\
  \ {card4 > card5}\");\nReadKey(); \n```\n\n结果如图图 11‐7 所示。\n\n![在客户端项目的 Main() 方法中放置客户端代码并在\
  \ Ch11CardClient\\Program.cs 中测试的结果截图说明。](img/Image00145.jpg)\n\n**图 11‐7**](#text00014.html_R_c11-fig-0007)\n\
  \n在每个情况下，操作符的应用都考虑了指定的规则。这在输出的最后四行中尤为明显，展示了王牌始终大于非王牌。\n\n### IComparable 和 IComparer\
  \ 接口\n\n`IComparable` 和 `IComparer` 接口是 .NET Framework 中比较对象的标准方式。接口之间的区别如下：\n\n\
  * `IComparable` 在待比较对象的类中实现，允许该对象与另一个对象进行比较。\n* `IComparer` 实现在独立的类中，允许任意两个对象之间的比较。\n\
  \n通常，你通过使用 `IComparable` 为类提供默认比较代码，并使用其他类进行非默认比较。\n\n`IComparable` 暴露了单一方法 `CompareTo()`，它接受一个对象。例如，你可以这样实现它，以便向其传递一个\
  \ `Person` 对象，并判断该人员比当前人物大还是小。事实上，此方法返回一个 `int`，因此你还可以确定第二个人大多少或小多少：\n\n```\n if\
  \ (person1.CompareTo(person2) == 0)\n{\n   WriteLine(\"Same age\");\n}\nelse if\
  \ (person1.CompareTo(person2) > 0)\n{\n   WriteLine(\"person 1 is Older\");\n}\n\
  else\n{\n   WriteLine(\"person1 is Younger\");\n} \n```\n\n`IComparer` 暴露了单一方法 `Compare()`，它接受两个对象并返回一个整数结果，与\
  \ `CompareTo()` 相同。通过支持 `IComparer` 的对象，你可以使用如下代码：\n\n```\n if (personComparer.Compare(person1,\
  \ person2) == 0)\n{\n   WriteLine(\"Same age\");\n}\nelse if (personComparer.Compare(person1,\
  \ person2) > 0)\n{\n   WriteLine(\"person 1 is Older\");\n}\nelse\n{\n   WriteLine(\"\
  person1 is Younger\");\n} \n```\n\n在两种情况下，提供方法的参数类型都是 `System.Object`。这意味着你可以将一个对象与任何其他类型的对象进行比较，因此你通常需要在返回结果之前执行某些类型比较，甚至如果使用了错误的类型，可能抛出异常。\n\
  \n.NET Framework 在 `System.Collections` 命名空间下的一个名为 `Comparer` 的类提供了 `IComparer`\
  \ 接口的默认实现。该类能够对简单类型执行特定文化的比较，以及对任何支持 `IComparable` 接口的类型。例如，你可以使用以下代码使用它：\n\n```\n\
  \ string firstString = \"First String\";\nstring secondString = \"Second String\"\
  ;\nWriteLine($\"Comparing '{firstString}' and '{secondString}', \" +\n         $\"\
  result: {Comparer.Default.Compare(firstString, secondString)}\");\nint firstNumber\
  \ = 35;\nint secondNumber = 23;\nWriteLine($\"Comparing '{firstNumber}' and '{ secondNumber\
  \ }', \" +\n         $\"result: {Comparer.Default.Compare(firstNumber, secondNumber)}\"\
  ); \n```\n\n这使用 `Comparer.Default` 静态成员获取 `Comparer` 类的实例，然后使用 `Compare()` 方法比较两个字符串。\n\
  \n结果如下：\n\n```\n Comparing 'First String' and 'Second String', result: -1\nComparing\
  \ '35' and '23', result: 1 \n```\n\n由于 F 在字母表中位于 S 之前，因此被认为“小于” S，所以第一次比较的结果为 -1。同样，35\
  \ 大于 23，因此结果为 1。注意结果并不表示差异的大小。\n\n使用 `Comparer` 时，必须使用可以比较的类型。例如，尝试比较 `firstString`\
  \ 和 `firstNumber` 将产生异常。\n\n关于此类的行为还有以下几点：\n\n* 传递给 `Comparer.Compare()` 的对象会被检查是否支持\
  \ `IComparable`。如果是，则使用该实现。\n* 允许空值，并被解释为小于任何其他对象。\n* 字符串根据当前文化进行处理。要根据不同的文化处理字符串，必须使用其构造函数实例化\
  \ `Comparer` 类，这允许你传递一个指定文化的 `System.Globalization`.`CultureInfo` 对象。\n* 字符串以区分大小敏感的方式处理。要以非大小敏感的方式处理，你需要使用\
  \ `CaseensitiveComparer` 类，它的其他方面完全相同。\n\n### 排序集合\n\n许多集合类允许排序，可以通过对象之间的默认比较或自定义方法实现。`ArrayList`\
  \ 就是一个示例。它包含 `Sort()` 方法，可以在不带参数的情况下使用（此时使用默认比较），也可以可以传递一个 `IComparer` 接口来比较对象对。\n\
  \n注意，`System.Collections` 命名空间中的某些类（包括 `CollectionBase`）没有暴露排序方法。如果你想对派生自该类的集合进行排序，你需要做更多工作，并自己排序内部的\
  \ `List` 集合。\n\n下面的“尝试一下”展示了如何使用默认和非默认比较器对列表进行排序。\n\n\n\n\n\n正如前文所示，除了重载数学运算符逻辑运算符，你还可以定义类型之间的隐式和显式转换。如果你想在没有关系的类型之间进行转换——例如它们之间没有继承关系，也没有共享的接口——那么这是必要的。\n\
  \n假设你在 `ConvClass1` 和 `ConvClass2` 之间定义了一个隐式转换。这意味着你可以编写如下代码：\n\n```\nConvClass1\
  \ op1 = new ConvClass1();\n\nConvClass2 op2 = op1; \n```\n\n或者，你可以定义一个显式转换：\n\n\
  ```\nConvClass1 op1 = new ConvClass1();\n\nConvClass2 op2 = (ConvClass2)op1; \n\
  ```\n\n作为一个示例，考虑以下代码：\n\n```\n public class ConvClass1\n\n{\n   public int val;\n\
  \n   public static implicit operator ConvClass2(ConvClass1 op1)\n   {\n      ConvClass2\
  \ returnVal = new ConvClass2();\n      returnVal.val = op1.val;\n      return returnVal;\n\
  \   }\n\n}\n\npublic class ConvClass2\n\n{\n   public double val;\n   public static\
  \ explicit operator ConvClass1(ConvClass2 op1)\n   {\n      ConvClass1 returnVal\
  \ = new ConvClass1();\n      checked {returnVal.val = (int)op1.val;};\n      return\
  \ returnVal;\n   }\n} \n```\n\n在这里，`ConvClass1` 包含一个 `int` 值，而 `ConvClass2` 包含一个\
  \ `double` 值。由于 `int` 值可以隐式转换为 `double` 值，因此你可以在 `ConvClass1` 和 `ConvClass2` 之间定义隐式转换。然而，反相反，你应该将\
  \ `ConvClass2` 和 `ConvClass1` 之间的转换运算符定义为显式。\n\n你如所示所示使用 `implicit` 和 `explicit`\
  \ 关键字来指定这一点。使用这些类，以下代码是正常的：\n\n```\nConvClass1 op1 = new ConvClass1();\n\nop1.val\
  \ = 3;\n\nConvClass2 op2 = op1; \n```\n\n然而，另一个方向的转换需要以下显式强制类型转换：\n\n```\nConvClass2\
  \ op1 = new ConvClass2();\n\nop1.val = 3e15;\n\nConvClass1 op2 = (ConvClass1)op1;\
  \ \n```\n\n由于你在显式转换中使用了 `checked` 关键字，在上述代码中将得到一个异常，因为 `op1` 的 `val` 属性太大，无法放入 `op2`\
  \ 的 `val` 属性中。\n\n### `as` 运算符\n\n`as` 运算符使用以下语法将类型转换为指定的引用类型：\n\n```\noperand\n\
  \n> as type\n\n>\n```\n\n这只有在某些情况下才是可能的：\n\n* 如果 `<operand>` 的类型是 `<type>`\n* 如果\
  \ `<operand>` 可以隐式转换为类型 `<type>`\n* 如果 `<operand>` 可以装箱为类型 `<type>`\n\n如果无法从 `<operand>`\
  \ 转换为 `<type>`，则表达式的结果将为 `null`。\n\n通过使用显式转换，可以实现从基类到派生类的转换，但它并不总是有效。考虑之前示例中的两个类\
  \ `ClassA` 和 `ClassD`，其中 `ClassD` 继承自 `ClassA`：\n\n```\nclass ClassA : IMyInterface\
  \ {}\n\n   class ClassD : ClassA {} \n```\n\n以下代码使用 `as` 运算符将存储在 `obj1` 中的 `ClassA`\
  \ 实例转换为 `ClassD` 类型：\n\n```\nClassA obj1 = new ClassA();\n\nClassD obj2 = obj1 as\
  \ ClassD; \n```\n\n这将导致 `obj2` 为 `null`。\n\n然而，通过多态，可以将 `ClassD` 实例存储在 `ClassA`\
  \ 类型的变量中。以下代码说明了这一点，使用 `as` 运算符将包含 `ClassD` 类型实例的 `ClassA` 类型变量转换为 `ClassD` 类型：\n\
  \n```\nClassD obj1 = new ClassD();\n\nClassA obj2 = obj1;\n\nClassD obj3 = obj2\
  \ as ClassD; \n```\n\n这一次，结果是 `obj3` 最终包含一个与 `obj1` 相同的对象引用，而不是 `null`。\n\n此功能使得\
  \ `as` 运算符非常有用，因为以下代码（使用简单的强制类型转换）会导致抛出异常：\n\n```\nClassA obj1 = new ClassA();\n\
  \nClassD obj2 = (ClassD)obj1; \n```\n\n此代码的 `as` 等效写法将为 `obj2` 分配一个 `null` 值——不会抛出异常。这意味着像如下的代码（使用本章早期开发的两个类，`Animal`\
  \ 和派自 `Animal` 的类 `Cow`）在 C# 应用程序中是非常常见的：\n\n```\npublic void MilkCow(Animal myAnimal)\n\
  \n{\n   Cow myCow = myAnimal as Cow;\n\n   if (myCow != null)\n   {\n      myCow.Milk();\n\
  \   }\n\n   else\n   {\n     WriteLine($\"{myAnimal.Name} isn't a cow, and so can't\
  \ be milked.\");\n   }\n} \n```\n\n\n\n\n为了最好地说明泛型（generics）是什么以及它们为什么如此有用，请回想上一章节中的集合类。你已经看到基础集合可以包含在如\
  \ `ArrayList` 等类中，但这些集合受限于未类型化的问题。这要求你将 `object` 元素强制转换为你实际存储在集合中的任何类型对象。由于任何继承自\
  \ `System.Object` 的类型（也就是说实际上是任何类型）都可以存储在 `ArrayList` 中，因此你必须小心。假设集合中只包含某些类型可能会导致抛出异常并使代码逻辑崩溃。你已经学习了一些处理此类问题的技术，包括检查对象类型所需的代码。\n\
  \n然而，你发现一种更好的解决方案是最初使用强类型集合类。通过派生自 `CollectionBase` 并为添加、删除以及其他访问集合的操作提供你自己的方法，你学习了如何限制集合成员，使其仅限于派生自特定基类型或支持特定接口的成员。但正在此处，你遇到了一个问题。每当你创建一个需要被存储在集合中的新类时，你都必须执行以下操作之一：\n\
  \n*   使用你已经创建的、可以包含新类型项的集合类。\n*   创建一个新的可以持有新类型项的集合类，并实现所有需要的方法。\n\n通常情况下，对于新类型，你需要额外的功能，因此在大多数情况下，你仍然需要一个新的集合类。因此，创建集合类会占用你大量的时间！\n\
  \n相反，`泛型类（Generic classes）`让编码变得简单得多。泛型类是围绕你在实例化期间提供的任何类型或多个类型构建的，这使得你能够几乎毫不费力地对对象进行强类型处理。在集合的上下文中，创建一个“类型\
  \ `T` 对象的集合”就像口口说出来一样简单——并且一行代码即可实现。与其使用如下代码：\n\n```\nCollectionClass items = new\
  \ CollectionClass();\n\nitems.Add(new ItemClass()); \n```\n\n你可以使用这种：\n\n```\n CollectionClass<ItemClass>\
  \ items = new CollectionClass<ItemClass>();\n\nitems.Add(new ItemClass()); \n```\n\
  \n尖括号语法是将类型参数传递给泛型类型的方法。在前面的代码中，将 `CollectionClass<ItemClass>` 读作 `ItemClass` 的\
  \ `CollectionClass`。你自然会在本章节的晚些部分更详细地检查这种语法。\n\n泛型的主题不仅仅是集合，但它们特别适合这一领域，正如你稍后在章节中查看\
  \ `System.Collections.Generic` 命名空间时看到的样。通过创建泛型类，你可以生成签名可以对你任何需要的类型进行强类型化的方法，甚至可以考虑到类型可以是值类型或引用类型的事实，并根据发生的个别情况进行处理。你甚至可以通过将用于实例化泛型类的类型限制为支持给定接口或派生自特定类型的类型，从而只允许部分类型被使用。此外，你不仅限于泛型类——你还可以创建泛型接口、泛型方法（可以在非泛型类上定义），甚至是泛型委托。这一切为你的代码增添了巨大的灵活性，明智地使用泛型可以节省数小时的开发时间。\n\
  \n你可能在想这一切是如何可能的。通常，当你创建一个类时，它会被编译成你可以在代码中使用的类型。你可能认为，当你创建一个泛型类时，它必须被编译成大量的类型，以便你能够实例化它。幸运的是，情况并非如此——考虑到\
  \ .NET 中可能存在无限数量的类，这正好事。在背后，NET 运行时允许在你需要时动态生成泛型类。一个给定的泛型 `A` 的 `B` 在你通过实例化来请求它之前是不存在的的。\n\
  \n## 使用泛型\n\n在查看如何创建自己的泛型类型之前，值得查看由 .NET Framework 提供的类型。这些包括 `System.Collections.Generic`\
  \ 命名空间中的类型，你在代码中多次见过这个命名空间，因为控制台应用程序默认包含了它。你还还没有使用过该命名空间中的任何类型，但情况很快就会改变。本节将介绍该命名空间中的类型，以及你如何使用它们来创建强类型集合并改进你现有集合的功能。\n\
  \n不过，你将看到另一个更简单的泛型类型，它避开了值类型的一个微小问题：`可空类型（nullable types）`。\n\n### 可空类型\n\n在较早章节中，你看到值类型（包括大多数基础类型，如\
  \ `int` 和 `double` 以及所有结构体）与引用类型（`string` 和任何类）的区别之一是，它们必须包含一个值。它们可以在声明之后、赋值之前处于未赋值状态，但你无法以任何方式在那种状态下使用值类型。相反，引用类型可以是\
  \ `null`。\n\n在某些时候，而且这种情况出现的频率比你想象的要高（特别是当你处理数据库工作时），拥有一个可以为 `null` 的值类型是有用的。泛型允许你使用\
  \ `System.Nullable<T>` 类型来实现这一点，如下例所示：\n\n```\nSystem.Nullable<int> nullableInt;\
  \ \n```\n\n这段代码声明了一个名为 `nullableInt` 的变量，它可以具有 `int` 变量可以的任何值，加上 `null` 值。这使得你能够编写如下代码：\n\
  \n```\nnullableInt = null;\n```\n\n如果 `nullableInt` 是一个 `int` 类型，那么上述代码将无法编译。\n\n\
  上述赋值等同于：\n\n```\nnullableInt = new System.Nullable<int>();\n```\n\n与其他任何变量一样，在进行某种初始化（无论是为\
  \ `null` 还是赋值值）之前，你不能使用它。\n\n你可以测试可空类型以判断它们是否为 `null`，就像测试引用类型一样：\n\n```\nif (nullableInt\
  \ == null) {\n   …\n}\n```\n\n或者，你可以使用 `HasValue` 属性：\n\n```\nif (nullableInt.HasValue)\
  \ {\n   …\n}\n```\n\n此外，你还可以通过 `Value` 属性查看可空类型的值。如果 `HasValue` 为 `true`，则可以获得一个非\
  \ `null` 的值；但如果 `HasValue` 为 `false`（即已赋值为 `null`），则访问 `Value` 将导致产生 `System.InvalidOperationException`\
  \ 异常。\n\n注意，可空类型非常有用，以至于导致了 C# 语法的修改。与其使用之前所示语法来声明可空类型变量，你而是可以使用：\n\n```\nint? nullableInt;\n\
  ```\n\n### 运算符与可空类型\n\n对于简单类型（如 `int`），你可以使用 `+`、`-` 等运算符来处理值。对于可空等等类型，没有区别：可空类型包含的值会被隐式转换为所需的类型，并使用相应的运算符。这也适用于你提供的带有运算符的结构体：\n\
  \n```\nint? op1 = 5;\n\nint? result = op1 * 2; \n```\n\n注意这里的 `result` 变量也是 `int?`\
  \ 类型。以下代码无法编译：\n\n```\nint? op1 = 5;\n\nint result = op1 * 2; \n```\n\n\n\n要使此代码工作，你必须执行显式转换或通过\
  \ `Value` 属性访问值，这需要如下代码：\n\n```\n int? op1 = 5;\n\nint result = (int)op1 * 2; \n\
  ```\n\n或者：\n\n```\n int? op1 = 5;\n\nint result = op1.Value * 2; \n```\n\n只要 `op1`\
  \ 有值，这种方法就能正常工作——如果它是 `null`，你将得到一个类型为 `System.InvalidOperationException` 的异常。\n\
  \n这引出了一个明显的问题：当涉及两个可空类型的运算符评估中，其中一个或两个值为 `null` 时会发生什么？例如下面的代码中的 `op1`：\n\n```\n\
  \ int? op1 = null;\n\nint? op2 = 5;\n\nint? result = op1 * op2; \n```\n\n答案是，对于除\
  \ `bool?` 之外的所有简单可空类型，操作的结果都为 `null`，你可以将其解释为“无法计算”。对于结构体，你可以定义自己的运算符来处理这种情况（如本章稍后部分所示），而对于\
  \ `bool?`，定义了 `&` 和 `|` 运算符，它们可能会产生非 `null` 返回值。表中的结果在逻辑上是完全通的——如果有足够的信息可以在不需要知道某个操作数值的情况下算出计算结果，那么该操作数为\
  \ `null` 并不重要。\n\n### ?? 运算符\n\n为了进一步减少处理可空类型所需的代码，并更容易处理可能为 `null` 的变量，你可以使用 `??`\
  \ 运算符。它被称为“空合并运算符”，是一个二进制运算符，允许你为可能评估为 `null` 的表达式提供备用值。如果第一个操作数不是 `null`，则运算符返回第一个操作数；如果第一个操作数为\
  \ `null`，则返回第二个操作数。功能上，以下两个表达式是等价：\n\n```\n op1 ?? op2\n\nop1 == null ? op2 : op1\
  \ \n```\n\n在这些代码中，`op1`可以是任何可空表达式，包括引用类型，更重要的是可空类型。这意味着你可以使用 `??` 运算符在可空类型为 `null`\
  \ 时提供使用的默认值，如下：\n\n```\n int? op1 = null;\n\nint result = op1 * 2 ?? 5; \n```\n\n\
  因为在示例中 `op1` 是 `null`，所以 `op1` `*` `2` 也是 `null`。然而，`??` 运算符检测到了这一点并将值 `5` 赋值给 `result`。重要的是，请注意，将结果放入\
  \ `int` 类型变量 `result` 中不需要显式转换。`??` 运算符为你处理了此转换。或者，你可以无问题地将 `??` 评估的结果传递给 `int?`\
  \ 类型：\n\n```\n int? result = op1 * 2 ?? 5; \n```\n\n这种行为使得 `??` 运算符在处理可空变量时非常多用途，并且是提供默认值的方便方法，无需使用\
  \ `if` 结构中的代码块或经常令人混淆的三元运算符。\n\n### ?. 运算符\n\n该运算符通常被称为“Elvis 运算符”或“空条件运算符”，它有助于克服由繁琐的空检查引起的代码歧义。例如，如果你想获取给定客户的订单计数，你需要在设置计数值之前检查是否为空：\n\
  \n```\n int count = 0;\n\nif (customer.orders ! = null)\n\n{\n  count = customer.orders.Count();\n\
  \n} \n```\n\n如果你只是编写这段代码，且该客户没有订单（即其为 `null`），则会抛出 `System.ArgumentNullException`\
  \ 异常：\n\n```\n int count = customer.orders.Count(); \n```\n\n使用 `?.` 运算符会导致 `int?\
  \ count` 被设置为 `null` 而不是发生异常。\n\n```\n int? count = customer.orders?.Count(); \n\
  ```\n\n将上一节讨论的空合并运算符 `??` 与空条件运算符 `?.` 结合起来，就可以在结果为 `null` 时设置默认值。\n\n```\n int?\
  \ count = customer.orders?.Count() ?? 0; \n```\n\n空条件运算符的另一个用处是触发事件。事件将在[第 13 章]中详细讨论。触发事件的最常用方法是使用这种代码模式：\n\
  \n```\n var onChanged = OnChanged;\n\nif (onChanged != null)\n\n{\n  onChanged(this,\
  \ args);\n\n} \n```\n\n这种模式不是线程安全的，因为可能有人在完成空检查后立即取消订阅最后一个事件处理程序。当这种情况发生时，会抛出异常并导致应用程序崩溃。可以通过以下方式避免：在检查它之前复制委托引用（如之前的代码片段所示\
  \ `var onChanged = onChanged;`），或者像此处使用空条件运算符：\n\n```\n OnChanged?.Invoke(this,\
  \ args); \n```\n\n如[第 11 章]所述，在 `C:\\BeginningCSharp7\\Chapter12\\Ch12CardLib\\\
  Card.cs` 类中使用 `?.` 运算符配合 `==` 运算符重载来检查空，以防止在使用方法时抛出异常。例如：\n\n```\n public static\
  \ operator ==(card1, card2)\n\n        => (card1?.suit) && (card2?.rank);\n```\n\
  \n### 使用可空类型操作\n\n使用以下内容进行：\n\n#### System.Collections.Generic 命名空间\n\n在几乎每个应用程序中，你都看到了以下命名空间：\n\
  \n```\nusing System;\n\nusing System.Collections.Generic;\n\nusing System.Linq;\n\
  \nusing System.Text;\n\nusing System.Threading.Tasks;\n\nusing static Console;\n\
  ```\n\n*   `System` 命名空间包含大多数基本类型。\n*   `System.Collections.Generic` 命名空间包含用于集合的泛型，并且通常配合\
  \ `using` 语句使用。\n*   你将在书中后面查看 `System.Linq` 命名空间。\n*   `System.Text` 命名空间包含与字符串处理和编码相关的类型。\n\
  *   `System.Threading.Tasks` 命名空间包含帮助你编写异步代码的类型，书中未涵盖。\n*   `using static Console`\
  \ 对于编写控制台应用程序非常有用。手动添加后，你不需要在 `WriteLine()` 和 `ReadLine()` 函数之前编写 `Console`。\n\n\
  现在我们将查看这些类型，它们保证会让你的工作变得更容易。它们让你几乎就能创建强类型集合类。例如，表 12-1 列出了 `System.Collections.Generic`\
  \ 命名空间中的两种类型，在本节中涵盖。该命名空间的更多类型将在本章晚些部分介绍。\n\n| 类型 | 描述 |\n| --- | --- |\n| `List<T>`\
  \ | `T` 类型对象的集合 |\n| `Dictionary<K,` `V>` | 与 `K` 类型键关联的 `V` 类型项集合 |\n\n本节还描述了与这些类的各种接口和委托。\n\
  \n#### List<T>\n\n与其派自 `CollectionBase` 并实现所需的方法（如你在上章中所做的），直接使用 `List<T>` 泛型集合类型可能更快更简单。额外的好处是，许多通常需要实现的方法（如\
  \ `Add()`）已经为你实现了。\n\n创建一个 `T` 类型对象的集合需要以下代码：\n\n```\n List<T> myCollection = new\
  \ List<T>(); \n```\n\n\n\n就是这样。你不需要定义任何类、实现任何方法，或进行任何其他操作。你还可以通过向构造函数传递一个 `List<T>`\
  \ 对象来为集合设置初始项目列表。`List<T>` 还有一个 `Item` 属性，允许类似数组的访问：\n\n```\n T itemAtIndex2 = myCollectionOfT[2];\
  \ \n```\n\n该类还支持其他几个方法，但这些已经足够让你上手了。接下来的“尝试一试”示例演示了如何在实践中使用 `List<T>`。\n\n### 泛型列表的排序与搜索\n\
  \n泛型列表的排序与对任何其他列表进行排序相同。最后一章描述了如何使用 `IComparer` 和 `IComparable` 接口来比较两个对象，从而对该类型的对象列表排序。这里的区别在于你可以使用泛型接口\
  \ `IComparer<T>` 和 `IComparable<T>`，它们暴露了略有不同且特定于类型的方法。表 12-2 解释了这些差异。\n\n| 泛型方法\
  \ | 非泛型方法 | 差异 |\n| --- | --- | --- |\n| `Int IComparable<T>.CompareTo(T otherObj)`\
  \ | `int IComparable.CompareTo(object otherObj)` | 泛型版本中是强类型的。 |\n| `Bool IComparable<T>.Equals(T\
  \ otherObj)` | N/A | 非泛型接口上不存在；可以使用继承自 `object.Equals()` 的替代方法。 |\n| `Int IComparer<T>.Compare(T\
  \ objectA, T objectB)` | `int IComparer.Compare(object objectA, object objectB)`\
  \ | 泛型版本中是强类型的。 |\n| `Bool IComparer<T>.Equals(T objectA, T objectB)` | N/A | 非泛型接口上不存在；可以使用继承自\
  \ `object.Equals()` 的替代方法。 |\n| `Int IComparer<T>.GetHashCode(T objectA)` | N/A\
  \ | 非泛型接口上不存在；可以使用继承自 `object.GetHashCode()` 的替代方法。 |\n\n**表 12-2 ：** 使用泛型类型进行排序\n\
  \n要对 `List<T>` 进行排序，你可以为待排序的类型提供 `IComparable<T>` 接口，或者提供一个 `IComparer<T>` 接口。或者，你也可以提供一个泛型委托（generic\
  \ delegate）作为作为排序方法。从代码工作原理的角度来看，这有趣得多，因为实现这里描述的接口所花费的精力并不比实现它们的非泛型版本更多。\n\n总的来说，排序列表只需要一个比较两个\
  \ `T` 类型对象的方法；而搜索则只需要一个检查 `T` 类型对象以确定其是否符合某些标准的方法。定义此类方法是一件简单的事，为了帮助你完成，这里有两个你可以使用的泛型委托类型：\n\
  \n* `Comparison<T>` — 用于用于排序的方法的委托类型，具有以下返回类型和参数：\n\n    ```\n     int method(T\
  \ objectA, T objectB) \n    ```\n\n* `Predicate<T>` — 用于搜索的方法的委托类型，具有以下返回类型和参数：\n\
  \n    ```\n     bool method(T targetObject) \n    ```\n\n你可以定义任意数量的此类方法，并使用它们来“插拔”到\
  \ `List<T>` 的搜索和排序方法中。下一个“尝试一试”将阐述这种技术。\n\n### Dictionary<K, V>\n\n`Dictionary<K,\
  \ V>` 类型允许你定义一个键值对集合。与你在本章中看到的其他泛型集合类型不同，该类需要实例化两个类型：代表集合中每个项目的键类型和值类型。\n\n一旦实例化了\
  \ `Dictionary<K, V>` 对象，你对其执行的操作与对继承自 `DictionaryBase` 的类执行的操作相似，但已经有了类型安全的方法和属性。例如，你可以使用强类型的\
  \ `Add()` 方法添加键值对：\n\n```\n Dictionary<string, int> things = new Dictionary<string,\
  \ int>();\n\nthings.Add(\"Green Things\", 29);\n\nthings.Add(\"Blue Things\", 94);\n\
  \nthings.Add(\"Yellow Things\", 34);\n\nthings.Add(\"Red Things\", 52);\n\nthings.Add(\"\
  Brown Things\", 27); \n```\n\n不使用 `Add()` 方法添加键值对也是可以实现的，而且看起来更加优雅：\n\n```\n Dictionary<string,\
  \ int> things = new Dictionary<string, int>(){\n\n    {\"Green Things\", 29},\n\n\
  \    {\"Blue Things\", 94},\n\n    {\"Yellow Things\", 34},\n\n    {\"Red Things\"\
  , 52},\n\n    {\"Brown Things\", 27}\n\n}; \n```\n\n通过使用 `Keys` 和 `Values` 属性遍历集合中的键和值：\n\
  \n```\n foreach (string key in things.Keys)\n\n{\n   WriteLine(key);\n}\n\nforeach\
  \ (int value in things.Values)\n\n{\n   WriteLine(value);\n} \n```\n\n此外，通过将每个项获取为\
  \ `KeyValuePair<K, V>` 实例来遍历集合中的项目，就像你在最后一章中看到的 `DictionaryEntry` 对象所做：\n\n```\n\
  \ foreach (KeyValuePair<string, int> thing in things)\n\n{\n   WriteLine($\"{thing.Key}\
  \ = {thing.Value}\");\n} \n```\n\n关于 `Dictionary<K, V>` 需要注意的一点是每个项目的键必须是唯一的。尝试添加具有相同键的项目将抛出\
  \ `ArgumentException` 异常。由于这一点，`Dictionary<K, V>` 允许向其构造函数传递 `IComparer<K>` 接口。如果你使用自定义类作为键且它们不支持\
  \ `IComparable` 或 `IComparable<K>` 接口，或者你想使用非默认过程来比较对象，那么这可能是必要的。例如，在前面的示例中，你可以使用不区分大小写的方法来比较字符串键：\n\
  \n```\n Dictionary<string, int> things =\n\n   new Dictionary<string, int>(StringComparer.CurrentCultureIgnoreCase);\
  \ \n```\n\n现在，如果你使用这样的键，将得到一个异常：\n\n```\n things.Add(\"Green Things\", 29);\n\n\
  things.Add(\"Green things\", 94); \n```\n\n你还可以向构造函数传递初始容量（使用 `int` 类型）或一组项目（使用\
  \ `IDictionary<K, V>` 接口）。\n\n\n\n\n你现在已经学习了足够的泛型知识，可以创建自己的泛型了。你见过许多涉及泛型类型的代码，并充分练习了使用泛型语法。本节将介绍以下内容的定义\n\
  \n* 泛型类\n* 泛型接口\n* 泛型方法\n* 泛型委托\n\n你还将学习以下更高级的技术，以处理定义泛型类型时可能出现的问题：\n\n* `default`\
  \ 关键字\n* 约束类型\n* 继承自泛型类\n* 泛型操作符\n\n### 定义泛型类\n\n要创建一个泛型类，只需在类定义中包含角括号语法即可：\n\n\
  ```cs\n class MyGenericClass<T> { … } \n```\n\n在这里，`T` 可以是你喜欢的任何标识符，遵循通常的 C# 命名规则（例如不以数字开头等）。不过，通常你只需要使用\
  \ `T`。泛型类在定义中可以包含任意数量的类型参数，用逗号分隔：\n\n```cs\n class MyGenericClass<T1, T2, T3> {\
  \ … } \n```\n\n一旦定义了这些类型，你就可以像使用其他其他类型一样在类定义中使用它们。你可以将它们作为成员变量的类型、属性或方法等成员的返回类型，以及方法参数的参数类型：\n\
  \n```cs\n class MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n  \
  \ public MyGenericClass(T1 item)\n   {\n      innerT1Object = item;\n   }\n   public\
  \ T1 InnerT1Object\n   {\n      get { return innerT1Object; }\n   }\n} \n```\n\n\
  在这里，一个类型为 `T1` 的对象可以传递给构造函数，并且允许属性 `InnerT1Object` 对该对象进行只读访问。注意，你几乎无法对提供给类的类型做出任何假设。例如，下面的代码将无法编译：\n\
  \n```cs\n class MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n  \
  \ public MyGenericClass()\n   {\n      innerT1Object = new T1();\n   }\n   public\
  \ T1 InnerT1Object\n   {\n      get { return innerT1Object; }\n   }\n} \n```\n\n\
  因为你不知道 `T1` 是什么，所以你无法使用它的任何构造函数——它可能根本没有构造函数，或者可能没有公开访问的默认构造函数。在不使用本节后面所示技术的更复杂代码的情况下，你只能对\
  \ `T1` 做出以下假设：你可以将其处理为继承自 `System.Object` 或可以装箱为 `System.Object` 的类型。\n\n显然，这意味着你无法对该类型的实例或提供给泛型类\
  \ `MyGenericClass` 的任何其他类型执行非常有趣的操作。如果不使用 `reflection`（反射是一种用于在运行时检查类型的高级技术，反射在第\
  \ 13 章 中讨论），你限于限于比以下代码更复杂的代码：\n\n```cs\n public string GetAllTypesAsString()\n \
  \  {\n      return \"T1 = \" + typeof(T1).ToString()\n         + \", T2 = \" + typeof(T2).ToString()\n\
  \         + \", T3 = \" + typeof(T3).ToString();\n   } \n```\n\n你还可以做更多事情，特别是在集合方面，因为处理对象组是一个非常简单的过程，不需要对对象类型做出任何假设——这就是你在本章中看到的泛型集合类存在的一个良好理由。\n\
  \n另一个你需要注意的限制是，只有在将提供给泛型类型的值与 `null` 进行比较时，才允许使用运算符 `==` 或 `!=`。也就是说，下面的代码运行正常：\n\
  \n```cs\n public bool Compare(T1 op1, T1 op2)\n   {\n      if (op1 != null && op2\
  \ != null)\n      {\n         return true;\n      }\n      else\n      {\n     \
  \    return false;\n      }\n   } \n```\n\n在这里，如果 `T1` 是值类型，则始终假设为非 `null`，因此在前面的代码中\
  \ `Compare` 将始终返回 `true`。然而，尝试比较两个参数 `op1` 和 `op2` 则会导致编译失败：\n\n```cs\n public bool\
  \ Compare(T1 op1, T1 op2)\n   {\n      if (op1 == op2)\n      {\n         return\
  \ true;\n      }\n      else\n      {\n         return false;\n      }\n   } \n\
  ```\n\n这是因为这段代码假设 `T1` 支持 `==` 操作符。简之，要对泛型执行任何有趣的操作，你需要更多地了解类中使用的类型。\n\n#### default\
  \ 关键字\n\n关于用于创建泛型类的类型，你可能想知道的最基础之一是它们是引用类型还是值类型。如果不知道这一点，你甚至无法使用如下代码分配 `null` 值：\n\
  \n```cs\n public MyGenericClass()\n   {\n      innerT1Object = null;\n   } \n```\n\
  \n如果 `T1` 是值类型，那么 `innerT1Object` 就不能具有值 `null`，因此这段代码将无法编译。幸运的是，这个问题已经解决，产生了 `default`\
  \ 关键字的一个新用法。它的用法如下：\n\n```cs\n public MyGenericClass()\n   {\n      innerT1Object\
  \ = default(T1);\n   } \n```\n\n#### 约束类型\n\n你目前为止使用的类型被称为无界类型，因为对它们可以做什么没有任何限制。通过约束类型，可以限制可以使用的类型。有很多方法可以实现这一点。例如，你可以将类型限制为继承自某些类型的类型。回到之前使用的\
  \ `Animal` 和 `Cow`，这段代码将是没：\n\n```cs\n MyGenericClass<Cow> = new MyGenericClass<Cow>();\n\
  ```\n\n然而，下面将编译失败：\n\n```cs\n MyGenericClass<string> = new MyGenericClass<string>();\n\
  ```\n\n在类定义中，这是通过使用 `where` 关键字实现的：\n\n```cs\n class MyGenericClass<T> where T :\
  \ constraint { … } \n```\n\n在这里，`constraint` 定义了约束是什么（例如 `class`、`struct`、`interface`\
  \ 或基类）。你可以通过用逗号分隔这种方式提供多个约束：\n\n```cs\n class MyGenericClass<T> where T : constraint1,\
  \ constraint2 { … } \n```\n\n你可以使用多个 `where` 语句对泛型类所需的任何或所有类型定义约束：\n\n```cs\n class\
  \ MyGenericClass<T1, T2> where T1 : constraint1 where T2 : constraint2 { … } \n\
  ```\n\n你使用的任何约束必须出现在继承标识符之后：\n\n```cs\n class MyGenericClass<T1, T2> : MyBaseClass,\
  \ IMyInterface\n   where T1 : constraint1 where T2 : constraint2 { … } \n```\n\n\
  \n\n\n\n| `new()` | 类型必须具有公共的、无参数的构造函数。 | 在需要能够实例化类型为 `T` 变量类中，可能是在构造函数 |\n\n**表格\
  \ 12-3 :** 泛型类型约束\n\n可以通过基类约束将一个类型参数作为另一个参数的约束，如下所示：\n\n```cs\n class MyGenericClass<T1,\
  \ T2> where T2 : T1\n\n { … } \n```\n\n在这里，`T2` 必须与 `T1` 相同类型，或者继承自 `T1`。这被称为*裸类型约束*（naked\
  \ type constraint），意味着一个泛型类型参数被用作另一个参数的约束。\n\n禁止使用此处所示的循环类型约束：\n\n```cs\n class\
  \ MyGenericClass<T1, T2> where T2 : T1 where T1 : T2\n\n { … } \n```\n\n这段代码将无法编译。在接下来的“尝试一下”中，你将定义并使用一个使用了前面章节中所示的\
  \ `Animal` 类的泛型类。\n\n### 继承泛型类\n\n前一个示例中的 `Farm<T>` 类以及你在本章中看到的其他几个类，都继承自一个泛型类型。在\
  \ `Farm<T>` 的情况下，该类型是一个接口：`IEnumerable<T>`。在这里，`Farm<T>` 提供的 `T` 约束导致了 `IEnumerable<T>`\
  \ 中使用的 `T` 额外的约束。这对于约束原本无边界的类型是一种很有用的技术。但是，你需要遵循一些规则。\n\n首先，你不能“取消约束”从所继承的类型中已经受约束的类型。换句话说，在你继承的类型中使用的类型\
  \ `T`，其约束程度至少要与在该类型中的约束程度相同。例如，以下代码是正确的：\n\n```cs\n class SuperFarm<T> : Farm<T>\n\
  \n      where T : SuperCow {} \n```\n\n这之所以能行，是因为 `T` 在 `Farm<T>` 中被约束为 `Animal`，而将其约束为\
  \ `SuperCow` 是将 `T` 约束为这些值的子集。然而，以下代码将无法编译：\n\n```cs\n class SuperFarm<T> : Farm<T>\n\
  \n      where T : struct\n\n{} \n```\n\n在这里，你可以确定地说给 `SuperFarm<T>` 的类型 `T` 无法转换为\
  \ `Farm<T>` 可用的 `T`，因此代码将无法编译。\n\n即使约束是超集的情况也存在相同的问题：\n\n```cs\n class SuperFarm<T>\
  \ : Farm<T>\n\n      where T : class\n\n{} \n```\n\n尽管 `Animal` 等类型会被 `Farm<T>`\
  \ 允许，但其他满足类约束的类型在 `Farm<T>` 中是不允许的。同样，编译将失败。此规则适用于本章前面显示的所有约束类型。\n\n另外注意，如果你继承自泛型类型，则必须提供所有所需的类型信息，要么以其他泛型类型参数的形式（如所示），要么显式提供。这同样适用于其他地方看到的继承泛型类型的非泛型类。这里有一个示例：\n\
  \n```cs\n public class Cards : List<Card>, ICloneable{} \n```\n\n这是可以的，但尝试以下操作将失败：\n\
  \n```cs\n public class Cards : List<T>, ICloneable{} \n```\n\n在这里，没有为 `T` 提供信息，因此无法编译。\n\
  \n### 泛型运算符\n\n运算符重载在 C# 中的实现方式与其他方法一样，并且可以在泛型类中实现。例如，你可以在 `Farm<T>` 中定义以下隐式转换运算符：\n\
  \n```cs\n public static implicit operator List<Animal>(Farm<T> farm)\n\n{\n\n  \
  \ List<Animal>result = new List<Animal>();\n\n   foreach (T animal in farm)\n  \
  \ {\n      result.Add(animal);\n   }\n\n   return result;\n} \n```\n\n这允许在 `Farm<T>`\
  \ 中的 `Animal` 对象在需要时被直接作为 `List<Animal>` 访问。如果你想将两个 `Farm<T>` 实例相加（例如使用下面的运算符），这将非常有用：\n\
  \n```cs\n public static Farm<T> operator +(Farm<T> farm1, List<T> farm2)\n\n{\n\n\
  \   Farm<T> result = new Farm<T>();\n\n   foreach (T animal in farm1)\n   {\n  \
  \    result.Animals.Add(animal);\n   }\n\n   foreach (T animal in farm2)\n   {\n\
  \      if (!result.Animals.Contains(animal))\n      {\n         result.Animals.Add(animal);\n\
  \      }\n   }\n\n   return result;\n}\n\npublic static Farm<T> operator +(List<T>\
  \ farm1, Farm<T> farm2) \n\n         => farm2 + farm1; \n```\n\n然后你可以这样添加 `Farm<Animal>`\
  \ 和 `Farm<Cow>` 的实例：\n\n```cs\n Farm<Animal> newFarm = farm + dairyFarm; \n```\n\
  \n在段代码中，`dairyFarm`（`Farm<Cow>` 的实例）被隐式转换为 `List<Animal>`，这使得 `Farm<T>` 中重载的 `+`\
  \ 运算符可以使用。\n\n你可能认为通过使用以下代码就可以实现：\n\n```cs\n public static Farm<T> operator +(Farm<T>\
  \ farm1, Farm<T> farm1)\n```\n\n（注：原文此处存在重复/笔误，此处将保持逻辑）。\n\n你就可以这样添加 `Farm<Animal>`\
  \ 和 `Farm<Cow>` 的实例：\n\n```cs\n Farm<Animal> newFarm = farm + dairyFarm; \n```\n\
  \n在这段代码中，`dairyFarm`（`Farm<Cow>` 的实例）被隐式转换为 `List<Animal>`，这使得 `Farm<T>` 中重载的 `+`\
  \ 运算符可以使用。\n\n### 泛型结构\n\n在前面的章节中已经学习过结构（structs）与类基本相同，细微区别在于结构是值类型而不是引用类型。*泛型结构*可以用相同的方式创建：\n\
  \n```cs\npublic struct MyStruct<T1, T2>\n\n{\n\n   public T1 item1;\n\n   public\
  \ T2 item2;\n}\n```\n\n### 定义泛型接口\n\n你现在已经看到了泛型接口的使用——例如上一个示例中的 `IEnumerable<T>`。定义泛型接口与定义泛型类的方法相同：\n\
  \n```cs\ninterface FarmingInterface<T>\n\nwhere T : Animal\n\n{\n   bool AttemptToBreed(T\
  \ animal1, T animal2);\n\n   T OldestHerd { get; }\n```\n\n在这里，泛型参数 `T` 被用作 `AttemptToBreed()`\
  \ 的参数以及 `OldestHerd` 的类型。继承规则适用于类。如果你继承自泛型接口，必须遵守这些规则，例如保持基泛型参数的约束。\n\n### 定义泛型方法\n\
  \n之前的“尝试一下”使用了一个方法 `GetCows()`，在示例讨论中提到可以使用*泛型方法*这种方法的更通用的形式。在本节中，你将看到这是如何可能的。泛型方法的返回值和或参数类型是由泛型类型参数或参数决定的：\n\
  \n```cs\npublic T GetDefault<T>() => default(T);\n```\n\n类型参数 `T` 在调用方法时提供的。这个 `T`\
  \ 与提供给类的泛型类型参数分开。事实上，泛型方法可以通过非泛型类实现：\n\n```cs\npublic class Defaulter\n\n{\n\n \
  \  public T GetDefault<T>() => default(T);\n}\n```\n\n如果类是泛型的，则必须为泛型方法类型使用不同的标识符。以下代码将无法编译：\n\
  \n```cs\npublic class Defaulter<T>\n\n{\n\n   public T GetDefault<T>() => default(T);\n\
  \n}\n```\n\n方法或类使用的 `T` 必须重命名。\n\n\n\n\n```csharp\npublic class DefaulterT1\n{\n\
  \   public T2 GetDefaultT2() where T2 : T1\n   {\n      return default(T2);\n  \
  \ }\n} \n```\n\n在这里，传递给方法的类型 `T2` 必须与传递给类的 `T1` 相同，或继承自 `T1`。这是约束泛型方法的常用方法。\n\n\
  在之前显示的 `Farm<T>` 类中，你可以包含以下方法（在 `Ch12Ex04` 的可下载代码中包含，但被注释掉了）：\n\n```csharp\npublic\
  \ Farm<U> GetSpecies<U>() where U : T\n{\n   Farm<U> speciesFarm = new Farm<U>();\n\
  \n   foreach (T animal in animals)\n   {\n      if (animal is U)\n      {\n    \
  \     speciesFarm.Animals.Add(animal as U);\n      }\n   }\n   return speciesFarm;\n\
  } \n```\n\n此方法可以替换 `GetCows()` 以及其他相同类型的方法。这里使用的泛型类型参数 `U` 被 `T` 约束，而 `T` 又被 `Farm<T>`\
  \ 类约束为 `Animal`。这允许你在需要时将 `T` 的实例视为 `Animal` 的实例。\n\n在 `Ch12Ex04` 的客户端代码 `Program.cs`\
  \ 中，使用这个新方法需要进行一处修改：\n\n```csharp\nFarm<Cow> dairyFarm = farm.GetSpecies<Cow>\n\
  \ \n```\n\n类似的，你可以这样写：\n\n```csharp\nFarm<Chicken> poultryFarm = farm.GetSpecies<Chicken>();\
  \ \n```\n\n你可以对任何继承自 `Animal` 的类采用相同的方法。\n\n请注意，在方法上使用泛型类型参数会改变方法的签名。这意味着你可以拥有多个仅在泛型类型参数上不同的方法重载，如下例所示：\n\
  \n```csharp\npublic void ProcessT<T>(T op1){ … }\npublic void ProcessT<T, U>(T op1){\
  \ … } \n```\n\n应该使用哪种方法由调用方法时指定的泛型类型参数数量决定。\n\n### 定义泛型委托\n\n最后一个需要考虑的泛型类型是*泛型委托*。你在本章稍之前学习如何排序和搜索泛型列表时，已经看到这些委托的作用了。你当时分别使用了\
  \ `Comparison<T>` 和 `Predicate<T>` 委托。\n\n第 6 章 描述了如何使用方法的参数和返回类型、`delegate` 关键字以及委托名称来定义委托：\n\
  \n```csharp\npublic delegate int MyDelegate(int op1, int op2); \n```\n\n要定义泛型委托，你只需要声明并使用一个或多个泛型类型参数：\n\
  \n```csharp\npublic delegate T1 MyDelegate<T1, T2>(T2 op1, T2 op2) where T1: T2;\
  \ \n```\n\n如你所见，这里也可以应用约束。你将在下一章学习更多关于委托的内容，包括如何在常用的 C# 编程技术——事件中使用它们。\n\n## 变异（VARIANCE）\n\
  \n变异是*协变*covariance）和*逆变*contravariance）的统称，这两个概念是在 .NET 4 中引入的。事实上，它们出现的时间比这更早（在\
  \ .NET 2.0 中就可用），但在 .NET 4 之前很难实现它们，因为这需要自定义的编译程序。\n\n理解这些术语含义的最简单方法是将它们与多态进行比较。正如你记得的，多态允许你将派生类型的对象放入基类型的变量中，例如：\n\
  \n```csharp\nCow myCow = new Cow(\"Ben\");\nAnimal myAnimal = myCow; \n```\n\n在这里，一个\
  \ `Cow` 类型的对象被放置在 `Animal` 类型的变量中——这可能是因为 `Cow` 继承自 `Animal`。\n\n然而，接口的情况并非如此。也就是说，下面的代码无法运行：\n\
  \n```csharp\nIMethaneProducer<Cow> cowMethaneProducer = myCow;\nIMethaneProducer<Animal>\
  \ animalMethaneProducer = cowMethaneProducer; \n```\n\n第一行代码是没问题的，假设 `Cow` 支持接口\
  \ `IMethaneProducer<Cow>`。然而，第二行代码预假设两个接口类型之间存在并不存在的关系，因此没有方法将一个转换为另一个。或者有呢？使用你在本章到为止看到的技术，确实没有办法，因为泛型类型的所有类型参数都是*不变的*（invariant）。但是，可以在泛型接口和泛型委托上定义变异类型参数，以恰好满足前面代码所示的情况。\n\
  \n为了让前面的代码运行，`IMethaneProducer<T>` 接口的类型参数 `T` 必须是*协变的*（covariant）。拥有协变类型参数实际上在\
  \ `IMethaneProducer<Cow>` 和 `IMethaneProducer<Animal>` 之间建立了一个继承关系，使得一种类型的变量可以持有另一种类型的值，就像多态一样（尽管稍微复杂一点）。\n\
  \n为了完成对变异的介绍，你需要查看另一种类型，*逆变*（contravariance）。这与协变类似，但方向相反。逆变不是像协变那样能够将泛型接口值放入包含基类型的变量中，而是允许你将该接口放入一个使用派生类型的变量中，例如：\n\
  \n```csharp\nIGrassMuncher<Cow> cowMuncher = myCow;\nIGrassMuncher<SuperCow> superMuncher\
  \ = cowMuncher; \n```\n\n初看起来这似乎很奇怪，因为你无法在多态中这样做。但在某些情况下这是很有用的，正如你将在“逆变”节中看到的。\n\
  \n### 协变（Covariance）\n\n要将泛型类型参数定义为协变，要在类型定义中使用 `out` 关键字，如下例所示：\n\n```csharp\n\
  public interface IMethaneProducer<out T>{ … }\n```\n\n对于接口定义，协变类型参数只能作为方法的返回值或属性的\
  \ `get` 访问器。\n\n这种用的一个用用可以在 .NET 框架中的 `IEnumerable<T>` 接口。该接口的项类型被定义为协变的。这意味着你可以将支持\
  \ `IEnumerable<Cow>` 的对象放入 `IEnumerable<Animal>` 变量中。\n\n这使得下面的代码可行：\n\n```csharp\n\
  static void Main(string[] args)\n{\n   List<Cow> cows = new List<Cow>();\n   cows.Add(new\
  \ Cow(\"Rual\"));\n   cows.Add(new SuperCow(\"Donna\"));\n   ListAnimals(cows);\n\
  \   ReadKey();\n}\n\nstatic void ListAnimals(IEnumerable<Animal> animals)\n{\n \
  \  foreach (Animal animal in animals)\n   {\n      WriteLine(animal.ToString());\n\
  \   }\n} \n```\n\n在这里，`cows` 变量是 `List<Cow>` 类型，它支持 `IEnumerable<Cow>` 接口。该变量可以通过协变传递给一个期望\
  \ `IEnumerable<Animal>` 参数的方法。回顾你对 `foreach` 循环如何工作的知识，你知道 `GetEnumerator()` 方法用于获取\
  \ `IEnumerator<T>` 迭代器，而该迭代器的 `Current` 属性用于访问项。`IEnumerator<T>` 也将其类型参数定义为协变，这意味着可以将其作为参数的\
  \ `get` 访问器，并且一切运行完美。\n\n### 逆变（Contravariance）\n\n要将泛型类型参数定义为逆变，要在类型定义中使用 `in`\
  \ 关键字：\n\n```csharp\npublic interface IGrassMuncher<in T>{ … } \n```\n\n对于接口定义，逆变类型参数只能作为方法参数，不能作为返回类型。\n\
  \n再次，理解它的最好方法是查看 .NET 框架中使用逆变的示例。一个具有逆变类型参数的接口，也是一个你已经使用过的，是 `IComparer<T>`。\n\n\
  ```csharp\npublic class AnimalNameLengthComparer : IComparer<Animal>\n{\n    public\
  \ int Compare(Animal x, Animal y) \n         => x.Name.Length.CompareTo(y.Name.Length);\n\
  } \n```\n\n\n\n\n\n此比较器通过名称长度对动物进行比较，因此你可以使用它来排序例如 `List<Animal>` 的实例。然而，通过逆变型（contravariance），你也可以用它来排序\
  \ `List<Cow>` 实例，尽管 `List<Cow>.Sort()` 方法期望的是 `IComparer<Cow>` 实例：\n\n```cs\n List<Cow>\
  \ cows = new List<Cow>();\n\ncows.Add(new Cow(\"Rual\"));\n\ncows.Add(new SuperCow(\"\
  Donna\"));\n\ncows.Add(new Cow(\"Mary\"));\n\ncows.Add(new Cow(\"Ben\"));\n\ncows.Sort(new\
  \ AnimalNameLengthComparer());\n```\n\n在大多数情况下，逆变型是自然发生的——它被集成到 .NET Framework 中，以帮助处理这类操作。然而，.NET\
  \ 4 及以上版本中两种变型类型的好处在于，你现在可以在需要时使用本节中所示的技术来实现它们。\n\n## 练习题\n\n1. 12.1 下列项中哪些可以是泛型的？\n\
  \    1. 类\n    2. 方法\n    3. 属性\n    4. 运算符重载\n    5. 结构体\n    6. 枚举\n\n2. 12.2\
  \ 扩展 `Ch12Ex01` 中的 `Vector` 类，使得 `*` 运算符返回两个向量的点积。\n\n3. 12.3 下列代码有什么错误？请修复它。\n\
  ```cs\n public class Instantiator<T>\n{\n   public T instance;\n\n   public Instantiator()\n\
  \   {\n      instance = new T();\n   }\n} \n```\n\n4. 12.4 下列代码有什么错误？请修复它。\n```cs\n\
  \ public class StringGetter<T>\n{\n   public string GetString<T>(T item) => item.ToString();\n\
  } \n```\n\n5. 12.5 创建一个名为 `ShortList<T>` 的泛型类，实现 `IList<T>` 并由具有最大大小的项目集合组成。该最大大小是一个整数，可以传递给\
  \ `ShortList<T>` 的构造函数，或者默认为 10。构造函数还能够通过 `IEnumerable<T>` 参数接收初始项目列表。该类的功能应与 `List<T>`\
  \ 完全相同，但如果尝试向集合添加过多的项目，或者传递给构造函数的 `IEnumerable<T>` 包含过多项目，则抛出 `IndexOutOfRangeException`\
  \ 类型的异常。\n\n6. 12.6 下列代码可以编译吗？如果不，为什么？\n```cs\n public interface IMethaneProducer<out\
  \ T>\n{\n   void BelchAt(T target);\n} \n```\n\n练习题的答案可以在附录中找到。\n\n## 本章学到的知识\n\n\
  | 主题 | 核心概念 |\n| --- | --- |\n| 使用泛型类型 | 泛型类型需要一个或多个类型参数才能工作。你可以在声明变量时传递所需的类型参数，将泛型类型用作变量类型。你通过在尖括号中包含一个用逗号分隔的类型列表来实现这一点。\
  \ |\n| 可空类型 | 可空类型是能够取指定值类型的任何值或 `null` 值的类型。你可以使用 `Nullable<T>` 或 `T?` 语法来声明可空类型变量。\
  \ |\n| ?? 运算符 | 空合并运算符返回其第一个操作数的值，或者如果第一个操作数为 `null`，则返回其第二个操作数。 |\n| 泛型集合 | 泛型集合由于内置了强类型而非常有用。你可以使用\
  \ `List<T>`、`Collection<T>` 和 `Dictionary<K, V>` 等集合类型。这些类型还暴露了泛型接口。要排序和搜索泛型集合，你需要使用\
  \ `IComparer<T>` 和 `IComparable<T>` 接口。 |\n| 定义泛型类 | 你定义泛型类型就像定义任何其他类型，只需在指定类型名称的地方添加泛型类型参数。与使用泛型类型一样，你通过尖括号中的逗号分隔列表来指定这些参数。你可以在代码中任何使用类型名称的地方使用泛型类型参数，例如在方法的返回值和参数中。\
  \ |\n| 泛型类型参数约束 | 为了在泛型代码中更有效地使用泛型类型参数，你可以约束在使用时可以提供的类型。你可以通过基类、支持的接口、是否必须是值类型或引用类型以及是否支持无参数构造函数来约束类型参数。没有这些约束，你必须使用\
  \ `default` 关键字来实例化泛型类型的变量。 |\n| 其他泛型类型 | 除了类之外，你还可以定义泛型接口、委托和方法。 |\n| 变型 | 变型是一个类似于多态的概念，但应用于类型参数。它允许你用一个泛型类型替代另一个泛型类型，这些泛型类型仅在使用的泛型类型参数上不同。协变（Covariance）允许在类型之间转换，目标类型的类型参数是源类型参数的基类。逆变（Contravariance）允许在该关系反转的情况下转换。协变类型参数通过\
  \ `out` 参数定义，只能作为返回值和属性的 `get` 访问器类型。逆变类型参数通过 `in` 参数定义，只能作为方法参数。 |\n\n# 13 额外的\
  \ C# 技术\n\n## :: 运算符和全局命名空间限定符\n\n`::` 运算符提供了访问命名空间中类型的另一种替代方法。如果你想使用某个命名空间且别名与实际命名空间之间存在歧，这可能是必要的。如果是这样，命名空间将具有优先级。请考虑以下代码：\n\
  \n```cs\n using MyNamespaceAlias = MyRootNamespace.NestedNamespace;\n\nnamespace\
  \ MyRootNamespace\n{\n   namespace MyNamespaceAlias\n   {\n      public class MyClass\
  \ {}\n   }\n\n   namespace NestedNamespace\n   {\n      public class MyClass {}\n\
  \   }\n\n} \n```\n\n在 `RootNamespace` 中的代码可能使用以下内容引用类：\n\n```cs\n MyNamespaceAlias.MyClass\n\
  ```\n\n此代码引用的类是 `RootNamespace.MyNamespaceAlias.MyClass` 类，而不是 `RootNamespace.NestedNamespace.MyClass`\
  \ 类。也就是说，命名空间 `MyNamespaceAlias` 隐藏了 `using` 语句定义的别名（该别名指向 `RootNamespace.NestedNamespace`）。你仍然可以访问\
  \ `RootNamespace.NestedNamespace` 命名空间及其包含的类，但需要不同的语法：\n\n```cs\n NestedNamespace.MyClass\n\
  ```\n\n或者，你可以使用 :: 运算符：\n\n```cs\n MyNamespaceAlias::MyClass\n```\n\n使用该运算符强制编译器使用\
  \ `using` 语句定义的别名，因此代码指向 `RootNamespace.NestedNamespace.MyClass`。\n\n你还可以配合 :: 运算符使用关键字\
  \ `global`，它本质上是根命名空间的别名。这可以更清楚地指定你引用的命名空间，如下：\n\n```cs\n global::System.Collections.Generic.List<int>\n\
  ```\n\n这是你预期的类，即泛型 `List<T>` 集合类。它绝对不是以下代码定义的类：\n\n```cs\n namespace MyRootNamespace\n\
  {\n   namespace System\n   {\n      namespace Collections\n      {\n         namespace\
  \ Generic\n         {\n            class List<T> {}\n         }\n      }\n   }\n\
  \n} \n```\n\n当然，你应该避免为命名空间命名为与 .NET 命名空间相同的名称，但在大型项目中可能会出现类似的问题，特别是当你作为一个大型团队的一部分时。使用\
  \ :: 运算符和 `global` 关键字可能是你访问所需类型的唯一方法。\n\n## 自定义异常\n\n\n\n\n第 7 章 涵盖了异常，并解释了如何使用\
  \ `try` ...`catch` ...`finally` 块来处理它们。你还查看了几个标准的 .NET 异常，包括异常的基类 `System.Exception`。有时，从此基类派生你自己的异常类并在应用程序中使用是很有用的，而不是使用标准异常。这使你能够向捕获异常的任何代码发送更具体的信息，并让捕获代码能够更具体地指定它要处理的哪些异常。例如，你可能会为异常类添加一个新属性，允许访问某些底层信息，从而使异常的接收者能够做出必要的更改，或者仅提供更多关于异常原因的信息。\n\
  \n## 向 CardLib 中添加自定义异常\n\n如何使用自定义异常，再次通过升级 CardLib 项目可以得到最好的说明。`Deck.GetCard()`\
  \ 方法目前在尝试访问索引小于 0 或大于 51 的卡片时会抛出标准的 .NET 异常，但你将将其修改为使用自定义异常。\n\n首先，你需要创建一个名为 `Ch13CardLib`\
  \ 的新类库项目，将其保存在 `BeginningCSharp7\\Chapter13` 目录下，并像以前一样从 Ch12CardLib 复制类，根据需要将命名空间更改为\
  \ `Ch13CardLib`。接下来，定义异常。你通过在一个名为 `CardOutOfRangeException.cs` 的新类文件中定义一个新类来实现，你可以通过项目面板\
  \ ![image](img/Image00008.gif) 添加类将其添加到 Ch13CardLib 项目（你可以在 `Ch13CardLib\\CardOutOfRangeException.cs`\
  \ 中找到此代码）：\n\n```csharp\n public\n\n class CardOutOfRangeException : Exception\n\
  \   {\n      private Cards deckContents;\n\n      public Cards DeckContents\n  \
  \    {\n         get { return deckContents; }\n      }\n      public CardOutOfRangeException(Cards\
  \ sourceDeckContents)\n         : base(\"There are only 52 cards in the deck.\"\
  )\n      {\n         deckContents = sourceDeckContents;\n      }\n   }\n```\n\n\
  此类的构造函数需要 `Cards` 类的实例。它允许通过 `DeckContents` 属性访问此 `Cards` 对象，并向基类 `Exception` 构造函数提供合适的错误消息，以便通过\
  \ `Message` 属性可用。\n\n接下来，向 `Deck.cs` 添加代码以抛出此异常，替换掉旧的标准异常（你可以在 `Ch13CardLib\\Deck.cs`\
  \ 中找到此代码）：\n\n```csharp\n public Card GetCard(int cardNum)\n      {\n         if\
  \ (cardNum >= 0 && cardNum <= 51)\n            return cards[cardNum];\n        \
  \ else\n            throw new CardOutOfRangeException(cards.Clone() as Cards);\n\
  \      }\n```\n\n`CardOutOfRangeException` 类中的 `DeckContents` 属性使用 `Deck` 对象当前内容的深拷贝（以\
  \ `Cards` 对象的形式）初始化。这意味着你看到的是抛出异常时的内容，因此对牌组的后续修改不会“丢失”这部分信息。\n\n要测试这一点，请使用以下客户端代码（你可以在\
  \ `Ch13Client\\Program.cs` 中找到此代码）：\n\n```csharp\n Deck deck1 = new Deck();\n\n\
  try\n{\n   Card myCard = deck1.GetCard(60);\n}\ncatch (CardOutOfRangeException e)\n\
  {\n   WriteLine(e.Message);\n   WriteLine(e.DeckContents[0]);\n}\n\nReadKey();\n\
  ```\n\n在添加对 `Ch13CardLib.dll` 的引用、使用 `using System.Console` 和 `using Ch13CardLib`\
  \ 后，执行代码将得到如图 13-1 所示的输出。\n\n![显示使用静态 System.Console 和使用 Ch13CardLib 执行代码的输出](img/Image0152.jpg)\n\
  \n在这里，捕获代码将异常的 `Message` 属性写入屏幕。你还显示了通过 `DeckContents` 获取的 `Cards` 对象中的第一张卡片，以此证明你可以通过自定义异常对象访问\
  \ `Cards` 集合。\n\n## 事件 (EVENTS)\n\n本节介绍了 .NET 中最常用的 OOP 技术之一：事件。你像往常一样从基础开始——查看事件究竟是什么。之后，你将看到一些简单事件的运行，并学习可以使用它们做什么。然后，你将学习如何创建和使用你自己的事件。在本章中，你将通过添加事件来完成\
  \ `CardLib` 类库。最后，由于这是到达高级主题之前的最后一个站点，你将尽情创建一个使用此类库的卡牌游戏应用程序。\n\n### 什么是事件？\n\n\
  事件与异常相似之处在于，它们由对象触发（抛出），并且你可以提供处理它们的代码。然而，它们之间有几点重要的区别，最重要的一点是没有等用于处理事件的 `try` ...`catch`\
  \ 结构。相反，你必须订阅它们。订阅事件意味着提供在事件被触发时执行的代码，这些代码以事件处理器的形式存在。\n\n单个事件可以订阅多个处理程序，所有这些程序都会在事件触发时被调用。这可能包括作为触发事件的对象的类的一部分的事件处理器，但在其他类中同样可能找到事件处理器。\n\
  \n事件处理程序本身就是方法。对事件处理方法的唯一限制是它必须匹配事件所需的类型和参数。这种限制是事件定义的一部分，由委托指定。\n\n处理的基本序列如下：首先，应用程序创建一个可以触发事件的对象。例如，假设即时消息应用程序创建一个代表远程连接的对象。当来自远程用户的消息到达时，该连接对象可能会触发事件（参见图\
  \ 13-2）。\n\n![应用程序创建一个代表远程连接对象的示意图](img/Image0153.jpg)\n\n图 13-2\n\n接下来，应用程序订阅该事件。你的即时消息应用程序通过定义可以使用事件指定的委托类型的方法来实现，并将该方法的引用传递事件。事件处理器可能是另一个对象上的方法，例如用于显示即时消息的显示设备对象（参见图\
  \ 13-3）。\n\n![另一个对象上的事件处理器，例如用于显示即时消息的显示设备对象的示意图](img/Image0154.jpg)\n\n图 13-3\n\
  \n当事件触发时，订阅者会被通知。当即时消息通过连接对象到达时，显示设备对象的事件处理器会被调用。由于你使用的是标准方法，触发事件的对象可以通过参数传递任何相关信息，使得事件非常灵活。在示例案例中，一个参数可能是即时消息的文本，事件处理器可以将其显示在显示设备上。这如图\
  \ 13-4 所示。\n\n![一个参数是即时消息文本，事件处理器将其显示在显示设备上的案例示意图](img/Image0155.jpg)\n\n图 13-4\n\
  \n### 处理事件\n\n\n\n\n正如之前讨论过的，要处理事件，你需要通过提供事件处理程序方法来订阅它，该方法的返回类型和参数必须与该事件所指定的委托匹配。接下来的“尝试一下”（Try\
  \ It Out）使用一个简单的计时器对象来触发事件，从而调用处理程序方法。\n\n## 定义事件\n\n现在是时候定义并使用你自己的事件了。接下来的“尝试一下”实现了本章早些介绍的即时消息场景的示例版本，创建了一个\
  \ `Connection` 对象，该对象会触发事件，这些事件由 `Display` 对象处理。\n\n### 多用途事件处理程序\n\n你之前看到的 `Timer.Elapsed`\
  \ 事件的委托包含两个参数，它们的类型在事件处理程序中很常见：\n\n* `object` `source` — 触发事件对象的引用\n* `ElapsedEventArgs`\
  \ `e` — 由事件发送的参数\n\n在此事件中（以及在许多其他事件中）使用 `object` 类型参数的原因是，你通常需要使用单一的事件处理程序来处理由不同对象生成的多个相同事件，并且仍然能够判断出是哪个对象生成了事件。\n\
  \n为了解释并说明这一概念，下一个“尝试一下”对上一个示例稍微进行了扩展。\n\n### EventHandler 和泛型 EventHandler<T> 类型\n\
  \n在大多数情况下，你将遵循上一节概述的模式，使用返回类型为 `void` 且具有两个参数的事件处理程序。第一个参数的类型将是 `object`，并将作为事件源。第二个参数的类型将是派自\
  \ `System.EventArgs` 的类型，并将包含任何事件参数。由于这种情况非常常见，.NET 提供了两种委托类型以便定义事件：`EventHandler`\
  \ 和 `EventHandler<T>`。它们都是使用标准事件处理程序模式的委托。泛型版本允许你指定想要使用的事件参数的类型。\n\n在上一个“尝试一下”中，你已经通过如下方式使用泛型\
  \ `EventHandler<T>` 委托类型看到了它的运行：\n\n```cs\n public class Connection\n   {\n    \
  \  public event EventHandler<MessageArrivedEventArgs> MessageArrived;\n      …\n\
  \   } \n```\n\n这显然是件件事，因为它简化了你的代码。通常情况下，在定义事件时使用这些委托类型是最佳实践。请注意，如果你有一个不需要事件参数数据的事件，你仍然可以使用\
  \ `EventHandler` 委托类型。你只需要将 `EventArgs.Empty` 作为参数值传递。\n\n### 返回值和事件处理程序\n\n到目前为止看到的所有事件处理程序的返回类型都是\
  \ `void`。为事件提供返回类型是可能的，但这可能会导致问题，因为一个事件可能会导致多个事件处理程序的调用。如果所有这些处理程序都返回一个值，那么可能不清楚实际返回的是哪个值。\n\
  \n系统通过允许仅访问事件处理程序返回的最后一个值来解决这个问题。这将是订阅该事件的最后一个事件处理程序返回的值。尽管此功能在某些情况下可能有用，但建议使用 `void`\
  \ 类型的事件处理程序，并避免 `out` 类型参数（这会导致关于参数返回值来源的相同歧义）。\n\n### 匿名方法\n\n与其定义事件处理程序方法，不如你选择使用匿名方法。匿名方法在传统意义上并不真正作为方法存在——也就是说，它不是任何特定类的方法。相反，匿名方法完全是为了作为委托的目标而创建的。\n\
  \n要创建一个匿名方法，你需要以下代码：\n\n```cs\n delegate(parameters)\n{\n   // 匿名方法代码。\n}; \n```\n\
  \n`parameters` 是一个参数列表，与你正在实例化的委托类型的参数匹配，并由匿名方法代码使用：\n\n```cs\n delegate(Connection\
  \ source, MessageArrivedEventArgs e)\n{\n   // 与 Ch13Ex03 中的 MessageHandler 事件匹配的匿名方法代码。\n\
  }; \n```\n\n例如，你可以此代码完全跳过 Ch13Ex03 中的 `Display.DisplayMessage()` 方法：\n\n```cs\n\
  \ myConnection1.MessageArrived +=\n            delegate(Connection source, MessageArrivedEventArgs\
  \ e)\n            {\n               WriteLine($\"Message arrived from: {source.Name}\"\
  );\n               WriteLine($\"Message Text: {e.Message}\");\n            }; \n\
  ```\n\n关于匿名方法的一个有趣点是，它们实际上是局部于包含它们的代码块，并且它们可以访问该作用范围内的局部变量。如果你使用了这样的变量，它就会变成一个外部变量。外部变量在离开作用范围时不会像其他局部变量那样被释放；相反，它们会一直存在到使用它们的匿名方法被销毁。这可能比你预期的要晚得多，所以这绝对是需要的。如果外部变量占据了大量内存，或者它使用了在其他方面昂贵的资源（例如，数量有限的资源），那么可能会导致内存或性能问题。\n\
  \n## 扩展和使用 CARDLIB\n\n现在你已经查看了定义和使用事件，你可以在 Ch13CardLib 中使用它们。你将添加到库中的事件将在使用 `GetCard`\
  \ 获取 `Deck` 对象中的最后一个 `Card` 对象时生成，并命名为 `LastCardDrawn`。该事件允许订阅者自动重新洗牌，减少了客户端所需的处理。该事件将使用\
  \ `EventHandler` 委托类型，并将 `Deck` 对象的引用作为其源传递，这样在处理程序所在的任何地方都可以访问 `Shuffle()` 方法。将以下代码添加到\
  \ `Deck.cs`（你可以在 Ch13CardLib 中找到此代码）以定义并触发事件：\n\n```cs\nnamespace Ch13CardLib\n\
  {\n      public class Deck : ICloneable\n      {\n        public event EventHandler\
  \ LastCardDrawn;\n        …\n        public Card GetCard(int cardNum)\n        {\n\
  \           if (cardNum >= 0 && cardNum <= 51)\n           {\n              if ((cardNum\
  \ == 51) && (LastCardDrawn != null))\n                 LastCardDrawn(this, EventArgs.Empty);\n\
  \n              return cards[cardNum];\n           }\n           else\n        \
  \      throw new CardOutOfRangeException((Cards)cards.Clone());\n        }\n\n \
  \       …\n      }\n```\n\n这就是为类添加事件所需的全部代码。\n\n在花费了这么多时间开发 CardLib 库之后，如果不使用它将是遗憾。在完成关于\
  \ C# 和 .NET Framework 的本节之前，是时候玩一下并编写一个使用熟悉的扑牌类的基础牌类应用程序。\n\n与之前的章节一样，你将为 Ch13CardLib\
  \ 添加一个客户端控制台应用程序，为 Ch13CardLib 项目添加引用，并将其设置为启动项目。该应用程序将命名为 Ch13CardClient。\n\n首先，你将在\
  \ Ch13CardClient 的文件中创建一个名为 `Player` 的新类。你可以在本章在线下载的 Ch13CardClient\\Player.cs 中找到此代码。该类包含两个自动属性：`Name`（`string`\
  \ 类型）和 `PlayHand`（`Cards` 类型）。这两个属性都有私有的 `set` 访问器，但尽管如此，`PlayHand` 仍提供了对其内容的写入访问，允许你修改玩家手中的牌。\n\
  \n你还将通过将默认构造函数设为私有来隐藏它，并提供一个公共非默认构造函数，用于接收 `Player` 实例 `Name` 属性的初始值。\n\n最后，你将提供一个\
  \ `bool` 类型的方法 `HasWon()`，如果玩家手中的所有牌花色相同，则该方法返回 `true`（这是一个简单的胜利条件，但并不重要）。\n\n以下是\
  \ `Player.cs` 的代码：\n\n\n\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing Ch13CardLib;\n\
  \nnamespace Ch13CardClient\n{\n   public class Player\n   {\n      public string\
  \ Name { get; private set; }\n      public Cards PlayHand { get; private set; }\n\
  \      private Player() {}\n\n      public Player(string name)\n      {\n      \
  \   Name = name;\n         PlayHand = new Cards();\n      }\n      public bool HasWon()\n\
  \      {\n         bool won = true;\n         Suit match = PlayHand[0].suit;\n \
  \        for (int i = 1; i < PlayHand.Count; i++)\n         {\n            won &=\
  \ PlayHand[i].suit == match;\n         }\n         return won;\n      }\n   }\n\
  }\n```\n\n接下来，定义一个用于处理牌游戏本身的类，命名为 `Game`。该类位于 `Ch13CardClient` 项目的 `Game.cs` 文件中。该类有四个私有成员字段：\n\
  \n- `playDeck` — 一个 `Deck` 类型的变量，包含要使用的牌堆\n- `currentCard` — 一个 `int` 值，用作指向牌堆中下一张要抽的牌\n\
  - `players` — 一个 `Player` 对象的数组，代表游戏中的玩家\n- `discardedCards` — 一个 `Cards` 集合，用于存放被玩家丢弃但尚未洗回牌堆的牌\n\
  \n该类的默认构造函数初始化并洗牌存储在 `playDeck` 中的 `Deck`，将 `currentCard` 指针变量设置为 `0`（`playDeck`\
  \ 中的第一张牌），并将一个名为 `Reshuffle()` 的事件处理器绑定到 `playDeck.LastCardDrawn` 事件。该处理程序简单地洗牌牌，初始化\
  \ `discardedCards` 集合，并将 `currentCard` 重置为 `0`，准备从新牌堆中读取牌。\n\n`Game` 类还包含两个实用方法：用于设置游戏玩家的\
  \ `SetPlayers()`（作为 `Player` 对象数组）和用于给玩家发牌的 `DealHands()`（每人七张牌）。允许人数限制在二到七人之间，以确保有足够的牌可以使用。\n\
  \n最后，有一个 `PlayGame()` 方法，它包含了游戏逻辑本身。在你查看过 `Program.cs` 中的代码后，你很快会回到这个方法。`Game.cs`\
  \ 中的其余代码如下（你可以在 `Ch13CardClient\\Game.cs` 中找到这些代码）：\n\n```cs\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
  using Ch13CardLib;\nusing static System.Console;\n\nnamespace Ch13CardClient\n{\n\
  \   public class Game\n   {\n      private int currentCard;\n      private Deck\
  \ playDeck;\n      private Player[] players;\n      private Cards discardedCards;\n\
  \n      public Game()\n      {\n         currentCard = 0;\n         playDeck = new\
  \ Deck(true);\n         playDeck.LastCardDrawn += Reshuffle;\n         playDeck.Shuffle();\n\
  \         discardedCards = new Cards();\n      }\n      private void Reshuffle(object\
  \ source, EventArgs args)\n      {\n         WriteLine(\"Discarded cards reshuffled\
  \ into deck.\");\n         ((Deck)source).Shuffle();\n         discardedCards.Clear();\n\
  \         currentCard = 0;\n      }\n      public void SetPlayers(Player[] newPlayers)\n\
  \      {\n         if (newPlayers.Length > 7)\n            throw new ArgumentException(\"\
  A maximum of 7 players may play this game.\");\n         if (newPlayers.Length <\
  \ 2)\n            throw new ArgumentException(\"A minimum of 2 players may play\
  \ this game.\");\n         players = newPlayers;\n      }\n      private void DealHands()\n\
  \      {\n         for (int p = 0; p < players.Length; p++)\n         {\n      \
  \      for (int c = 0; c < 7; c++)\n            {\n               players[p].PlayHand.Add(playDeck.GetCard(currentCard++));\n\
  \            }\n         }\n      }\n      public int PlayGame()\n      {\n    \
  \     // Code to follow.\n      }\n   }\n}\n```\n\n`Program.cs` 包含 `Main()` 方法，该方法初始化并运行游戏。该方法执行以下步骤：\n\
  \n1. 显示介绍。\n2. 提示用户输入 2 到 7 之间的玩家人数。\n3. 据此设置一个 `Player` 对象的数组。\n4. 提示每个玩家输入名称，用于初始化数组中的一个\
  \ `Player` 对象。\n5. 创建一个 `Game` 对象，并使用 `SetPlayers()` 方法分配玩家。\n6. 使用 `PlayGame()`\
  \ 方法启动游戏。\n7. 使用 `PlayGame()` 的 `int` 返回值显示胜利消息（返回的值是获胜玩家在 `Player` 对象数组中的索引）。\n\
  \n以下是后续代码，为了清晰起见添加了注释（你可以在 `Ch13CardClient\\Program.cs` 中找到这些代码）：\n\n```cs\nstatic\
  \ void Main(string[] args)\n{\n   // Display introduction.\n   WriteLine(\"BenjaminCards:\
  \ a new and exciting card game.\");\n   WriteLine(\"To win you must have 7 cards\
  \ of the same suit in your hand.\");\n\n   // Prompt for number of players.\n  \
  \ bool inputOK = false;\n   int choice = -1;\n   do\n   {\n      WriteLine(\"How\
  \ many players (2–7)?\");\n      string input = ReadLine();\n      try\n      {\n\
  \         // Attempt to convert input into a valid number.\n         choice = Convert.ToInt32(input);\n\
  \         if ((choice >= 2) && (choice <= 7))\n            inputOK = true;\n   \
  \   }\n      catch\n      {\n         // Ignore failed conversions, just continue.\n\
  \      }\n   } while (inputOK == false);\n\n   // Initialize array of Player objects.\n\
  \   Player[] players = new Player[choice];\n   // Get player names.\n   for (int\
  \ p = 0; p < players.Length; p++)\n   {\n      WriteLine($\"Player {p + 1}, enter\
  \ your name:\");\n      string playerName = ReadLine();\n      players[p] = new\
  \ Player(playerName);\n   }\n\n   // Start game.\n   Game newGame = new Game();\n\
  \   newGame.SetPlayers(players);\n   int whoWon = newGame.PlayGame();\n\n   // Display\
  \ winning player.\n   WriteLine($\"{players[whoWon].Name has won the game!\");\n\
  \   ReadKey();\n}\n```\n\n\n\n\n```csharp\n public int PlayGame()\n      {\n   \
  \      // 只有在玩家存在时播放。\n         if (players == null)\n            return -1;\n \
  \        // 发发初始牌。\n         DealHands();\n         // 初始化游戏变量，包括一张放置在桌面上的\n   \
  \      // 初始牌：playCard。\n         bool GameWon = false;\n         int currentPlayer;\n\
  \         Card playCard = playDeck.GetCard(currentCard++);\n         discardedCards.Add(playCard);\n\
  \         // 主游戏循环，直到 GameWon 为 true 为止。\n         do\n         {\n            //\
  \ 遍历每轮游戏中的玩家。\n            for (currentPlayer = 0; currentPlayer < players.Length;\n\
  \                 currentPlayer++)\n            {\n               // 输出当前玩家、玩家手牌以及桌面上的\n\
  \               // 牌。\n               WriteLine($\"{players[currentPlayer].Name}'s\
  \ turn.\");\n               WriteLine(\"Current hand:\");\n               foreach\
  \ (Card card in players[currentPlayer].PlayHand)\n               {\n           \
  \       WriteLine(card);\n               }\n               WriteLine($\"Card in\
  \ play: {playCard}\");\n               // 提示玩家拿起桌上的牌或抽取一张新的。\n               bool\
  \ inputOK = false;\n               do\n               {\n                  WriteLine(\"\
  Press T to take card in play or D to draw:\");\n                  string input =\
  \ ReadLine();\n                  if (input.ToLower() == \"t\")\n               \
  \   {\n                     // 将桌面上的牌加入玩家手牌。\n                     WriteLine($\"\
  Drawn: {playCard}\");\n                     // 如果可能，从弃牌堆中移除（如果牌组\n             \
  \        // 重新洗牌它就不再存在了）。\n                     if (discardedCards.Contains(playCard))\n\
  \                     {\n                        discardedCards.Remove(playCard);\n\
  \                     }\n                     players[currentPlayer].PlayHand.Add(playCard);\n\
  \                     inputOK = true;\n                  }\n                  if\
  \ (input.ToLower() == \"d\")\n                  {\n                     // 从牌组抽取新牌加入玩家手牌。\n\
  \                     Card newCard;\n                     // 只有当牌不在玩家手牌中\n     \
  \                // 也不在弃牌堆中时才添加。\n                     bool cardIsAvailable;\n \
  \                    do\n                     {\n                        newCard\
  \ = playDeck.GetCard(currentCard++);\n                        // 检查牌是否在弃牌堆中\n  \
  \                      cardIsAvailable = !discardedCards.Contains(newCard);\n  \
  \                      if (cardIsAvailable)\n                        {\n       \
  \                    // 遍历所有玩家手牌查看 newCard\n                           // 是否已经在手牌中。\n\
  \                           foreach (Player testPlayer in players)\n           \
  \                {\n                              if (testPlayer.PlayHand.Contains(newCard))\n\
  \                              {\n                                 cardIsAvailable\
  \ = false;\n                                 break;\n                          \
  \    }\n                           }\n                        }\n              \
  \       } while (!cardIsAvailable);\n                     // 将找到的牌加入玩家手牌。\n    \
  \                 WriteLine($\"Drawn: {newCard}\");\n                     players[currentPlayer].PlayHand.Add(newCard);\n\
  \                     inputOK = true;\n                  }\n               } while\
  \ (inputOK == false);\n               // 显示带编号的新手牌。\n               WriteLine(\"\
  New hand:\");\n               for (int i = 0; i < players[currentPlayer].PlayHand.Count;\
  \ i++)\n               {\n                  WriteLine($\"{i + 1}: \" +\n       \
  \                     $\"{ players[currentPlayer].PlayHand[i]}\");\n           \
  \    }\n               // 提示玩家选择一张牌弃牌。\n               inputOK = false;\n      \
  \         int choice = -1;\n               do\n               {\n              \
  \    WriteLine(\"Choose card to discard:\");\n                  string input = ReadLine();\n\
  \                  try\n                  {\n                     // 尝试将输入转换为有效的牌号。\n\
  \                     choice = Convert.ToInt32(input);\n                     if\
  \ ((choice > 0) && (choice <= 8))\n                        inputOK = true;\n   \
  \               }\n                  catch\n                  {\n              \
  \       // 忽略转换失败，继续提示。\n                  }\n               } while (inputOK ==\
  \ false);\n               // 将移除的牌的引用放入 playCard（将牌\n               // 放在桌），然后从玩家手牌中移除并加入\n\
  \               // 弃牌堆。\n               playCard = players[currentPlayer].PlayHand[choice\
  \ - 1];\n               players[currentPlayer].PlayHand.RemoveAt(choice - 1);\n\
  \               discardedCards.Add(playCard);\n               WriteLine($\"Discarding:\
  \ {playCard}\");\n               // 为玩家留空行\n               WriteLine();\n      \
  \         // 检查玩家是否赢得游戏，如果是则退出\n               // 玩家循环。\n               GameWon\
  \ = players[currentPlayer].HasWon();\n               if (GameWon == true)\n    \
  \              break;\n            }\n         } while (GameWon == false);\n   \
  \      // 游戏结束，记录胜利者。\n         return currentPlayer;\n      } \n```\n\n图 13-8 显示了正在进行的游戏。\n\
  \n![显示正在进行游戏的截图插图。](img/Image00159.jpg)\n\n**图 13-8**\n\n作为最后一个练习，请仔细观察 `Player.HasWon()`\
  \ 中的代码。你能想到什么方法让这段代码更高效吗，也许不需要在每次调用此方法时都检查玩家手牌中的每张牌？\n\n## 属性 (Attributes)\n\n本节简要介绍一种为使用你创建类型的代码提供额外信息的有用方法：`attributes`（属性）。属性允许你用信息对代码段进行标记，这些信息可以从外部读取，并以多种方式影响类型的使用。这通常被称为对代码进行*装饰*（decorating）。你可以在下载内容的\
  \ `CustomAttributes/Program.cs` 中找到此代码。\n\n例如，假设你创建了一个类，其中有一个非常简单的方法。事实上，它简单到你根本对单步执行它感兴趣。不幸的是（并且让你非常困恼），在调试应用程序时你一直在这样做。在这种情况下，可以给该方法添加一个属性，告诉\
  \ Visual Studio 在调试时不要进入该代码；相反，Visual Studio 应该跳过它并执行下一语句。代码如下：\n\n```\n [DebuggerStepThrough]\n\
  \npublic void DullMethod() { … }\n```\n\n此代码中的属性是 `[DebuggerStepThrough]`。所有属性都以这种方式添加，即将属性名称放在方括号内，并放在应用的目标之前。\n\
  \n\n\n\n\n当你以这种方式添加属性时，编译器会创建属性类的实例并将其与类方法关联。某些属性可以通过构造函数参数或属性进行自定义，在添加属性时可以对这些值进行进行指定，例如：\n\
  \n```csharp\n[DoesInterestingThings(1000, WhatDoesItDo = \"voodoo\")]\n\npublic\
  \ class DecoratedClass {} \n```\n\n此属性向 `DoesInterestingThingsAttribute` 的构造函数传递了一个值为\
  \ `1000` 的值，并将一个名为 `WhatDoesItDo` 的属性值设置为字符串 `\"voodoo\"`。\n\n## 读取属性\n\n为了读取属性值，你必须使用一种名为\
  \ `reflection`（反射）的技术。这是一项相当高级的技术，允许你在运行时动态检查类型信息，甚至可以在不知道这些对象是什么的情况下创建对象并调用它们的方法。本书将不会详细介绍这门技术，但为了使用属性，你确实需要了解一些基础知识。有关此项技术的更多信息，请访问\
  \ [`https://docs.microsoft.com/en‐us/dotnet/framework/reflection‐and-codedom/reflection`](https://docs.microsoft.com/en-us/dotnet/framework/reflection-and-codedom/reflection)。\n\
  \n本质上，反射涉及使用存储在 `Type` 对象中的信息（你已经在本书的多个地方见过它们）以及 `System.Reflection` 命名空间中的类型来处理类型信息。你已经见过了使用\
  \ `typeof` 运算符从类获取类型信息的快速方法，以及使用 `GetType()` 方法从对象实例获取的方法。通过反射，你可以继续从 `Type` 对象查询成员信息。然后你可以从类或其各种成员中获取属性信息。\n\
  \n实现此点的简单方法（也是你在书中看到的唯一方法）是使用 `Type.GetCustomAttributes()` 方法。该方法最多接受两个参数，并返回一个\
  \ `object` 实例数组，每个实例都是一个属性实例。首先，你可以可选地传递你感兴趣的属性类型或类型（任何其他属性都将被忽略）。如果你省略此参数，则将返回所有属性。其次，你必须传递一个布尔值，指示是只查看类，还是查看类以及该类继承的所有类。\n\
  \n例如，以下代码将列出名为 `DecoratedClass` 的类的属性：\n\n```csharp\nType classType = typeof(DecoratedClass);\n\
  \nobject[] customAttributes = classType.GetCustomAttributes(true);\n\nforeach (object\
  \ customAttribute in customAttributes)\n{\n   WriteLine($\"Attribute of type {customAttribute}\
  \ found.\");\n} \n```\n\n一旦你通过这种方式找到了属性，你就可以对该属性采取任何适当的操作。这正是 Visual Studio 在遇到之前讨论的\
  \ `DebuggerStepThroughAttribute` 属性时所做的。\n\n## 创建属性\n\n你可以简单地派生 `System.Attribute`\
  \ 类来创建自己的属性。有时，你不需要做其他事情，因为如果你的代码只关心属性的存在与否，就不需要额外信息。但是，如果你希望属性是可以自定义的，就可以提供非默认构造函数和/或可写属性。\n\
  \n你还需要对你的属性决定两件事：它可以应用于什么类型的目标（类、属性等），以及它是否可以多次应用于同一个目标。你通过一个应用到你的属性上的属性来指定这些信息（这具有某种“禅意”的正确性感觉！），称为\
  \ `AttributeUsageAttribute`。该属性有一个 `AttributeTargets` 类型的构造函数参数，它是一个允许你使用 `|` 运算符组合其值的枚举类型。它还有一个名为\
  \ `AllowMultiple` 的布尔属性，用于指定该属性是否可以多次应用。\n\n例如，以下代码指定了一个可以（一次）应用于类或属性的属性：\n\n```csharp\n\
  [AttributeUsage(AttributeTargets.Class | AttributeTargets.Method,\n            \
  \    AllowMultiple = false)]\n\nclass DoesInterestingThingsAttribute : Attribute\n\
  {\n   public DoesInterestingThingsAttribute(int howManyTimes)\n   {\n      HowManyTimes\
  \ = howManyTimes;\n   }\n\n   public string WhatDoesItDo { get; set; }\n\n   public\
  \ int HowManyTimes { get; private set; }\n} \n```\n\n这个属性 `DoesInterestingThingsAttribute`\
  \ 可以像前面的代码片段中那样使用：\n\n```csharp\n[DoesInterestingThings(1000, WhatDoesItDo = \"\
  voodoo\")]\n\npublic class DecoratedClass {} \n```\n\n通过修改上一节中的代码，你可以访问属性的属性：\n\n\
  ```csharp\nType classType = typeof(DecoratedClass);\n\nobject[] customAttributes\
  \ = classType.GetCustomAttributes(true);\n\nforeach (object customAttribute in customAttributes)\n\
  {\n   WriteLine($\"Attribute of type {customAttribute} found.\");\n\n   DoesInterestingThingsAttribute\
  \ interestingAttribute =\n      customAttribute as DoesInterestingThingsAttribute;\n\
  \n   if (interestingAttribute != null)\n   {\n      WriteLine($\"This class does\
  \ {interestingAttribute.WhatDoesItDo} x \" +\n                $\" {interestingAttribute.HowManyTimes}!\"\
  );\n   }\n} \n```\n\n将本节中的所有内容结合起来并使用此代码将给你如图 13-9 所示的结果。\n\n![显示使用代码 AttributeUsage(AttributeTargets.Class)\
  \ 结果的插图](img/Image00160.jpg)\n\n图 13-9\n\n属性非常有用，并遍布 .NET 应用——特别是 WPF 应用。在本书的剩余部分将反复遇到它们。\n\
  \n## 初始化器\n\n到为止，你已经学习了以各种方式实例化和初始化对象。通常这需要你在类定义中添加代码以初始化，或者通过单独语句进行实例化和初始化。你还学习了如何创建各种类型的集合类，包括泛型集合类。再次，你可能注意到没有简单的方法可以将集合的创建与向集合添加项结合起来\n\
  \n对象初始化器提供了一种简化代码的方法，允许你将对象的实例化和初始化相结合。集合初始化器提供了一种简单、优雅的语法，可以在一步内创建并填充集合。本节将解释如何使用这些功能。\n\
  \n### 对象初始化器\n\n考虑以下简单的类定义：\n\n```csharp\npublic class Animal\n{\n   public string\
  \ Name { get; set; }\n\n   public int Age { get; set; }\n\n   public double Weight\
  \ { get; set; }\n} \n```\n\n该类使用 10 章 显示的自动属性语法定义了三个属性。如果你想实例化并初始化该类的对象实例，必须执行多个语句：\n\
  \n```csharp\nAnimal animal = new Animal();\n\nanimal.Name = \"Benjamin\";\n\nanimal.Age\
  \ = 42;\n\nanimal.Weight = 185.4;\n```\n\n此代码使用了 C# 编译器在类定义中没有包含构造函数的情况下提供的默认无参数构造函数。为了简化这种初始化，你可以提供一个适当的非默认构造函数：\n\
  \n```csharp\npublic class Animal\n{\n   public Animal(string name, int age, double\
  \ weight)\n   {\n       Name = name;\n       Age = age;\n       Weight = weight;\n\
  \   }\n\n   …\n\n} \n```\n\n这使得你能够编写结合实例化与初始化的代码：\n\n```csharp\nAnimal animal =\
  \ new Animal(\"Noa\", 5, 45.2); \n```\n\n\n\n\n这种方法运行良好，尽管它强制要求使用该 `class` 的代码必须使用此构造函数，这会阻止之前使用无参数构造函数的代码正常工作。在很多情况下，特别是当类必须可序列化时，有必要提供无参数构造函数：\n\
  \n```java\n public class Animal\n{\n   public Animal() {}\n   …\n} \n```\n\n现在你处于一种可以按你喜欢的方式实例化并初始化\
  \ `Animal` 类的情况下。然而，你在初始类定义中添加了几行代码，这些代码除了为这种灵活性提供基础结构支持外，并没有做太多的事情。\n\n引入**对象初始化器**（`object\
  \ initializers`），这是一种无需向类中添加代码（如此处详细的构造函数）即可实例化和初始化对象的方法。当你实例化对象时，你可以使用键/值对为每个想要初始化的公共访问属性或字段提供值。其语法如下：\n\
  \n```\n <\nClassName\n> <\nvariableName\n> = new <\nClassName\n>\n{\n   <\npropertyOrField1\n\
  > = <\nvalue1\n>,\n\n   <\npropertyOrField2\n> = <\nvalue2\n>,\n\n   …\n\n   <\n\
  propertyOrFieldN\n> = <\nvalueN\n>\n}; \n```\n\n例如，你可以如下重写之前显示的代码（该代码实例化并初始化了一个\
  \ `Animal` 类型的对象）：\n\n```csharp\n Animal animal = new Animal\n{\n    Name = \"Lea\"\
  ,\n   Age = 11,\n   Weight = 30.2\n}; \n```\n\n通常情况下，你可以将这样的代码放在同一行，而不会严重降低可读性。\n\
  \n当你使用对象初始化器时，你不需要显式地调用类的构造函数。如果你省略了构造函数的括号（如之前的代码所示），则会自动调用默认的无参数构造函数。这发生在初始化器设置任何参数值之前，这使得你能够在需要时为默认构造函数中的参数提供默认值。或者，你也可以调用特定的构造函数。同样，此构造函数会被首先调用，因此在构造函数中进行的任何公共属性初始化可能会被你在初始化器中提供的值所覆盖。你必须能够访问所使用的构造函数（或者如果没有显式指定，则访问默认的），对象初始化器才能工作。\n\
  \n如果你想要用对象初始化器初始化的属性比本示例中使用的简单类型更复杂，那么你可能会发现自己在使用**嵌套对象初始化器**（`nested object initializer`）。这简单意味着使用你已经看到的完全相同的语法：\n\
  \n```csharp\n Animal animal = new Animal\n{\n    Name = \"Rual\",\n    Age = \"\
  76\",\n    Weight = 172.7,\n   Origin = new Farm\n   {\n      Name = \"Circle Perk\
  \ Ranch\",\n      Location = \"Ann Road\",\n      Rating = 15\n   }\n}; \n```\n\n\
  在这里，初始化了一个类型为 `Farm` 的属性 `Origin`（未显示）。代码初始化了 `Origin` 属性的三个属性——`Name`、`Location`\
  \ 和 `Rating`——分别使用 `string`、`string` 和 `int` 类型的值。这种初始化使用了嵌套对象初始化器。\n\n注意，对象初始化器并不是非默认构造函数的替代品。可以在实例化对象时使用对象初始化器设置属性和字段值，这并不意味着你总是知道需要初始化的状态。通过构造函数，你可以精确指定对象运行所需的所需的哪些值，然后立即响应这些值执行代码。\n\
  \n此外，在之前的示例中，使用嵌套对象初始化器和使用构造函数之间还有另一个（诚然非常微妙）的区别。这种区别在于对象创建的顺序。使用嵌套初始化器时，顶层对象（`Animal`）首先创建。接下来，嵌套对象（`Farm`）被创建并赋值给属性\
  \ `Origin`。如果你使用构造函数，将反转这种构造顺序并将 `Fram` 实例传递给 `Animal` 的构造函数。在这个简单的示例中，没有实际区别，但在某些情况下，这可能是重要的。\n\
  \n### 集合初始化器\n\n[第 5 章]描述了如何使用以下语法用值来初始化数组：\n\n```java\n int[] myIntArray = new\
  \ int[5] { 5, 9, 10, 2, 99 }; \n```\n\n这是结合数组实例化和初始化的一种快速方便的方法。集合初始化器仅是将这种语法扩展到集合：\n\
  \n```csharp\n List<int> myIntCollection = new List<int> { 5, 9, 10, 2, 99 }; \n\
  ```\n\n通过结合对象初始化器集合初始化器，可以使用简单优雅的代码来配置集合。而不是像这样的代码：\n\n```csharp\n List<Animal>\
  \ animals = new List<Animal>();\n\nanimals.Add(new Animal(\"Donna\", 73, 116));\n\
  \nanimals.Add(new Animal(\"Mary\", 49, 132));\n\nanimals.Add(new Animal(\"Andrea\"\
  , 46, 109.1)); \n```\n\n你可以使用以下代码：\n\n```csharp\n List<Animal> moreAnimals = new\
  \ List<Animal>\n{\n   new Animal\n   {\n       Name = \"Donna\",\n       Age = 73,\n\
  \       Weight = 116\n   },\n   new Animal\n   {\n      Name  = \"Mary\",\n    \
  \  Age   = 49,\n      Weight  = 132\n   },\n```\n\n\n\n在此段代码中，`myArray` 的类型是隐式的\
  \ `int[]`。当你以这种方式隐式类型数组时，初始化器中使用的数组元素必须是以下类型之一：\n\n*   全为相同类型\n*   全为相同引用类型或 `null`\n\
  *   所有元素都能隐式转换为单一类型\n\n如果应用了最后一条规则，则元素可以转换到的类型被称为该该数组元素的 `best`（最佳）类型。如果对于这个“最佳类型”是什么存在任何歧义——即存在两个或多个所有元素都可以隐式转换的类型——那么你的代码将无法编译。相反，你将收到一个错误，指示没有可用的最佳类型，如下代码所示：\n\
  \n```\nvar myArray = new[] { 4, \"not an int\", 2 }; \n```\n\n请注意，数值值永远不会被解释为可空类型，因此以下代码将无法编译：\n\
  \n```\nvar myArray = new[] { 4, null, 2 }; \n```\n\n但是，你可以使用标准数组初始化器使其工作：\n\n```\n\
  var myArray = new int?[] { 4, null, 2 }; \n```\n\n最后一点：标识符 `var` 并不是禁止用于类名的标识符。这意味着，例如，如果你的代码在作用域内（同一个命名空间或引用的命名空间内）有一个名为\
  \ `var` 的类，那么你就不能使用 `var` 关键字进行隐式类型。\n\n类型推断本身并不有用，因为在这一节看到的代码中，它只是让事情变得复杂。使用 `var`\
  \ 会让你更难一眼看出给定变量的类型。然而，正如你将在本章后面的部分看到的，推断类型的概念是非常重要的，因为它是其他技术的基础。下一个主题匿名类型，是一个推断类型至关重要的主题。\n\
  \n## 匿名类型 (ANONYMOUS TYPES)\n\n在编程一段时间后，你可能会发现（特别是在数据库应用程序中），你花费了大量时间创建表示数据的简单、单调的类。拥有一系列除了暴露属性之外什么都不做的类这并不罕见。本章之前所示的\
  \ `Animal` 类就是一个完美的例子：\n\n```\npublic class Animal\n{\n   public string Name { get;\
  \ set; }\n   public int Age { get; set; }\n   public double Weight { get; set; }\n\
  } \n```\n\n这个类什么都不做——它仅仅存储结构化数据。在数据库或电子表格术语中，你可以将此类认为代表表格中的行。一个能够持有此类类实例的集合类将是表格或电子表格中多行的表示。\n\
  \n这是类完全接受的用法，但为这些类编写代码可能会变得单调，而且对底层数据模式的任何修改都需要你添加、删除或修改定义类的代码。\n\n`匿名类型`（Anonymous\
  \ types）简化这种编程模型的方法。匿名类型背后的思想是，与其定义这些简单的数据存储类型，你不如使用 C# 编译器根据你想存储在它们中的数据自动创建类型。\n\
  \n前面的 `Animal` 类型可以如下所示实例化：\n\n```\nAnimal animal = new Animal\n{\n    Name = \"\
  Benjamin\",\n    Age = 42,\n    Weight = 185.4\n}; \n```\n\n或者，你可以使用匿名类型，如下面的代码所示：\n\
  \n```\nvar animal = new\n{\n    Name = \"Lea\",\n    Age = 11,\n    Weight = 30.2\n\
  }; \n```\n\n这里这里有两个区别。首先，使用了 `var` 关键字。这是因为匿名类型没有你可以使用的标识符。在内部它们确实有一个标识符，正如你稍后看到的，但它在你的代码中是不可用的。其次，在\
  \ `new` 关键字之后没有指定类型名称。这就是编译器知道你想使用匿名类型的方式。\n\nIDE 检测到匿名类型定义并相应地更新 IntelliSense。通过前面的声明，你可以看到该匿名类型，如图\
  \ 13‐14 所示。\n\n![截图插图，显示 IDE 检测到匿名类型定义并相应更新 IntelliSense。](img/Image00165.jpg)\n\
  \n**图 13‐14**\n\n在这里，内部，变量 `animal` 的类型是 `'a`。显然，你不能在代码中使用这种类型——它甚至不是一个合法的标识符名称。`'`\
  \ 仅仅是用于在 IntelliSense 中表示匿名类型的符号。IntelliSense 还允许你检查匿名类型的成员，如图 13‐15 所示。\n\n![截图插图，显示\
  \ IntelliSense 也允许你检查匿名类型的成员。](img/Image00166.jpg)\n\n**图 13‐15**\n\n注意，这里显示的属性被定义为\
  \ `read-only`（只读）属性。这意味着如果你想要更改数据存储对象中属性的值，就不能使用匿名类型。\n\n匿名类型的其他成员的实现如下所示的“尝试一下”（Try\
  \ It Out）。\n\n## 动态查找 (DYNAMIC LOOKUP)\n\n如前所述，`var` 关键字本身并不是一种类型，因此并没有破坏 C# 的“强类型”方法。然而，从\
  \ C# 4 开始，情况变得有些固定，引入了 `dynamic` 变量，正如其名，没有固定类型。\n\n主要的动机是许多情况下你想使用 C# 来操作由其他语言创建的对象。这包括与旧技术如组件对象模型（COM）的互操作，以及处理\
  \ JavaScript、Python 和 Ruby 等动态语言。在不进入实现细节的情况下，过去使用 C# 访问这些语言创建的对象涉及到尴尬的语法。例如，假设你有一个来自\
  \ JavaScript 的对象，其中有一个 `Add()` 方法可以加两个数字。在没有动态查找的情况下调用此方法的代码可能如下：\n\n```\nScriptObject\
  \ jsObj = SomeMethodGetsObject();\nint sum = Convert.ToInt32(jsObj.Invoke(\"Add\"\
  , 2, 3)); \n```\n\n`ScriptObject` 类型提供了访问 JavaScript 对象的方法，但它无法让你执行下面的操作：\n\n```\n\
  int sum = jsObj.Add(2, 3); \n```\n\n动态查找改变了一切——让你能够编写像上面的代码。然而，正如你将在后面的部分看到的，这种力量是有代价的。\n\
  \n动态查找可以帮助你的另一种情况是你处理一个未知类型的 C# 对象。这听起来是一个奇怪的情况，但它发生的频率比你想象的要得多。在编写可以处理任何接收输入的通用代码时，这也是一项重要的能力。处理这种情况的“旧”方法是反射，它涉及使用类型信息访问类型和成员。使用反射访问方法等成员的语法与前面访问\
  \ JavaScript 对象的语法非常相似。换句话说，它是杂乱的。\n\n在底层，动态查找由动态语言运行时（DLR）支持。它是 .NET 4.7 的一部分，就像\
  \ CLR 一样关于 DLR 以及它如何让互操作变得简单的精确描述超出了本书的范围；在这里你感兴趣的是如何在 C# 中使用它。你可以在这里阅读更多关于 DLD\
  \ 的信息：[`https://docs.microsoft.com/en-us/dotnet/framework/reflection-and-codedom/dynamic-language-runtime-overview`](https://docs.microsoft.com/en-us/dotnet/framework/reflection-and-codedom/dynamic-language-runtime-overview)。\n\
  \n### dynamic 类型 (dynamic Type)\n\nC# 4 引入了 `dynamic` 关键字，你可以用它来定义变量，如下例所示：\n\n\
  ```\ndynamic myDynamicVar; \n```\n\n\n\n\n与之前引入的 `var` 关键字不同，确实存在一种 `dynamic` 类型，因此在声明\
  \ `myDynamicVar` 时不需要初始化它的值。\n\n一旦你有了动态变量，就可以继续访问它的成员（此处未显示获取变量值的代码）：\n\n```\nmyDynamicVar.DoSomething(\"\
  With this!\"); \n```\n\n无论 `myDynamicVar` 包含什么值，这段代码都可以编译。然而，如果请求的成员不存在，在执行这段代码时，你将得到一个类型为\
  \ `RuntimeBinderException` 的异常。\n\n实际上，你通过此类代码所做的是提供了一个应该在运行时应用的“配方”。在需要的地方，将对 `myDynamicVar`\
  \ 的值进行检查，并在该点点查找并调用一个带有单个字符串参数的名为 `DoSomething()` 方法。\n\n用一个例子来解释这一点最好。\n\n在这里可以学到的教训是，动态类型非常强大，但也有需要学习的警告。如果你使用强类型而不是动态类型，这类异常是完全可以避免的。对于你编写的大多数\
  \ C# 代码，请避免使用 `dynamic` 关键字。然而，如果出现了需要使用它的情况，尽管去使用并享受它吧——并为过去那些没有这种强大工具可用的可怜程序员们想一下。\n\
  \n## 高级方法参数\n\nC# 4 扩展了定义和使用方法参数时的可能性。这主要是为了响应在使用外部定义的接口（例如 Microsoft Office 编程模型）时出现的特定问题。在这里，某些方法暴露了大量的参数，其中许多参数并不是每次调用都是需要的。在过去，这意味着需要一种方法来指定缺失参数，或者代码中会出现大量的\
  \ `null`：\n\n```\nRemoteCall(var1, var2, null, null, null, null, null); \n```\n\n\
  在这段代码中，完全不清楚这些 `null` 值指代什么，或者为什么它们被省略了。\n\n也许，在一个理想的世界里，这个 `RemoteCall()` 方法会有多个重载，其中包含一个只需要两个参数的重载如下：\n\
  \n```\nRemoteCall(var1, var2); \n```\n\n然而，这将需要更多具有备选参数组合的方法，这本身就会引起更多问题（需要维护的代码更多、代码复杂性增加等）。\n\
  \n诸如 Visual Basic 等语言已经以不同的方式处理了这种情况，允许使用命名参数和可选参数。从 4 版本开始，这在 C# 中变得可行，展示了所有 .NET\
  \ 语言演进趋同的一种方式。\n\n在后续章节中，你将看到如何使用这些参数类型。\n\n### 可选参数\n\n当你调用一个方法时，通常会为特定参数传递相同的值。例如，这可能是一个布尔值，它可以控制方法操作的非本质部分。更具体地说，考虑以下方法定义：\n\
  \n```\npublic List<string> GetWords(string sentence, bool capitalizeWords)\n{\n\
  \   …\n} \n```\n\n无论向 `capitalizeWords` 参数传递什么值，此方法都会返回一个 `string` 值列表，其中每个值都是输入句子中的一个单词。取决于该方法的使用方式，你可能偶尔对返回的单词列表进行大写（可能你正在格式化像本节标题这样的“可选参数”但在大多数情况下，你可能不想这样做，因此大多数调用如下：\n\
  \n```\nList<string> words = GetWords(sentence, false); \n```\n\n为了使这成为“默认”行为，你可以如下声明第二个方法：\n\
  \n```c\npublic List<string> GetWords(string sentence) => GetWords(sentence, false);\
  \ \n```\n\n此方法调用第二个方法，并为 `capitalizeWords` 传递一个 `false` 值。\n\n这样做没有错，但你可能可以想象，在使用更多参数的情况下，情况会变得多么复杂。\n\
  \n另一种方法是使 `capitalizeWords` 参数成为“可选参数”。这涉及到在方法定义中通过提供默认值（如果未提供则将使用该值）将参数定义为可选，如下所示：\n\
  \n```c\npublic List<string> GetWords(string sentence, bool capitalizeWords = false)\n\
  {\n   …\n} \n```\n\n如果你这样定义一个方法，那么你就可以提供一个或两个参数，只有在你希望 `capitalizeWords` 为 `true`\
  \ 时，才需要第二个参数。\n\n#### 可选参数值\n\n如上一节所述，方法定义使用以下语法定义可选参数：\n\n```\n<parameterType>\
  \ <parameterName> = <defaultValue>\n```\n\n对于 `<defaultValue>` 默认值的使用是有限制的。默认值必须是字面量、常量值或类型的默认值。因此，以下内容将无法编译：\n\
  \n```c\npublic bool CapitalizationDefault;\n\npublic List<string> GetWords(string\
  \ sentence,\n   bool capitalizeWords = CapitalizationDefault\n)\n{\n   …\n} \n```\n\
  \n为了让其工作，`CapitalizationDefault` 值必须被定义为常量：\n\n```c\npublic const bool CapitalizationDefault\
  \ = false;\n; \n```\n\n这样做是否有意义取决于具体情况；在大多数情况下，你可能像上一节那样提供字面量值会更好。\n\n#### OptionalAttribute\
  \ 特性\n\n作为前几节描述语法的替代方案，你可以使用 `OptionalAttribute` 特性如下定义可选参数：\n\n```\n[Optional]\
  \ <parameterType> <parameterName>\n```\n\n此属性位于 `System.Runtime.InteropServices`\
  \ 命名空间。请注意，如果你使用这种语法，则无法为参数提供默认值。\n\n#### 可选参数顺序\n\n当你使用可选值时，它们必须出现在方法参数列表的末。没有默认值的参数不能出现在任何默认值的参数之后。\n\
  \n因此，以下代码是非法的：\n\n```c\npublic List<string> GetWords(bool capitalizeWords = false,\
  \ string sentence)\n{\n   …\n}\n```\n\n在这里，`sentence` 是一个必需参数，因此必须出现在 `capitalizeWords`\
  \ 参数之前。\n\n### 命名参数\n\n当你使用可选参数时，你可能会发现某个特定方法有多个可选参数。那么，在想象力范围内，完全可以构想出你只想向第三个可选参数传递值的情况。如果仅使用上一节的语法，在不为第一个和第二个可选参数提供值的情况下无法这样做。\n\
  \n命名参数允许你指定任何需要的参数。这不需要你对方法定义进行任何特殊处理；它是你在调用方法时使用的一种技术。语法如下：\n\n```\nMyMethod(\n\
  \   <param1Name>: <param1Value>,\n   …\n   <paramNName>: <paramNValue>\n);\n```\n\
  \n参数的名称是方法定义中变量名称。\n\n你可以以这种方式指定任意数量的参数，只要命名参数存在，并且可以任何顺序进行。命名参数也可以是可选的。\n\n\n\n\
  \n\n如果你混合使用命名参数和位置参数，请注意，你必须在命名参数之前包含所有位置参数。不过，如果你愿意，只要在整个过程中使用命名参数，你也可以使用不同的顺序，如下例所示：\n\
  \n```\n MyMethod(\n\n   optionalParameter5: optionalParameter5Value,\n\n   requiredParameter1:\
  \ requiredParameter1Value); \n```\n\n如果你这样做，你必须为所有必需参数提供值。\n\n在接下来的“尝试一下”中，你将看到如何使用命名参数和可选参数。\n\
  \n# Lambda 表达式 (LAMBDA EXPRESSIONS)\n\n`Lambda expressions` 是一种你可以用它简化 C# 编程某些方面的构造结构，特别是当与\
  \ LINQ 结合时。它们起初可能很难理解，主要是因为它们的用法非常灵活。当 Lambda 表达式与其他 C# 语言特性（如匿名方法）结合时，它们变得极其有用。在不看\
  \ LINQ（这是书中推到以后才会讨论的主题）的情况下，匿名方法是研究该主题的最佳切入点。让我们从快速复习开始。\n\n### 匿名方法回顾\n\n在本章的之前文中，你学习了匿名方法——即你内联提供的方法，而在通常情况下需要一个委托类型变量的方法。当你向事件添加事件处理程序时，事件序列如下：\n\
  \n1. 定义一个事件处理程序方法，其返回类型和参数与你想要订阅的事件所需的委托类型相匹配。\n2. 声明一个用于该事件的委托类型变量。\n3. 将委托变量初始化为指向事件处理程序方法的委托类型实例。\n\
  4. 将该委托变量添加到事件的订阅者列表中。\n\n在实践中，情况比这要简单一点，因为你通常不会费精力去用一个变量来存储委托——你只需要在订阅事件时直接使用委托的实例即可。\n\
  \n在你之前使用以下代码时就是如此：\n\n```\n Timer myTimer = new Timer(100);\n\nmyTimer.Elapsed +=\
  \ new ElapsedEventHandler(WriteChar); \n```\n\n这段代码订阅了 `Timer` 对象的 `Elapsed` 事件。该事件使用\
  \ `ElapsedEventHandler` 委托类型，该类型通过方法标识符 `WriteChar` 实例化。这里的的结果是，当 `Timer` 抛出 `Elapsed`\
  \ 事件时，将调用 `WriteChar()` 方法。传递给 `WriteChar()` 的参数取决于 `ElapsedEventHandler` 委托定义的参数类型，以及\
  \ `Timer` 中抛出事件的代码所传递的值。\n\n事实上，C# 编译器可以通过方法组语法用更少的代码实现相同的结果：\n\n```\n myTimer.Elapsed\
  \ += WriteChar; \n```\n\nC# 编译器知道 `Elapsed` 事件所需的委托类型，因此它可以填充空白处。但是，你应该谨慎地使用这种语法，因为它可能会让你的代码更难阅读，并且难以确切知道正在发生什么。当你使用匿名方法时，之前显示的事件序列被缩减为单个步骤：\n\
  \n1. 使用一个内联的匿名方法，该方法与订阅该事件所需的委托返回类型和参数匹配，以订阅该事件。\n\n内联匿名方法通过使用 `delegate` 关键字定义：\n\
  \n```\n myTimer.Elapsed +=\n\n   delegate(object source, ElapsedEventArgs e)\n\n\
  \   {\n\n      WriteLine(\"Event handler called after {0} milliseconds.\",\n\n \
  \        (source as Timer).Interval);\n\n   }; \n```\n\n这段代码的工作效果与单独使用事件处理程序一样好。主要的区别在于，这里使用的匿名方法实际上对你代码的其他部分是隐藏的。例如，你无法在应用程序的其他地方重用此事件处理程序。此外，这里使用的语法，如果找个更好的描述的话，有点笨拙。`delegate`\
  \ 关键字立即让人困惑，因为它实际上被重载了——你既将其用于匿名方法，又用于定义委托类型。\n\n### 用于匿名方法的 Lambda 表达式\n\n这引出了\
  \ Lambda 表达式。Lambda 表达式简化匿名方法语法的一种。事实上，它们不仅于此，但本节目前将保持简单。使用 Lambda 表达式，你可以将上一节末尾的代码重写如下：\n\
  \n```\n myTimer.Elapsed += (source, e) => WriteLine(\"Event handler called after\
  \ \" +\n\n                      $\"{(source as Timer).Interval} milliseconds.\"\
  ); \n```\n\n初看之下，这看起来……嗯吧，有点困惑（除非你熟悉如 Lisp 或 Haskell 等类函数式编程语言）。然而，如果你仔细观察，就可以看到或至少推断出它是如何工作的，以及它与它替换的匿名方法之间有什么联系。Lambda\
  \ 表达式由三部分组成：\n\n- 括号中的一组（无类型）参数列表\n- `=>` 运算符\n- 一个 C# 语句\n\n参数的类型是从上下文中推断的，使用了本章之前“匿名类型”部分所示的相同逻辑。`=>`\
  \ 运算符仅将参数列表与表达式体隔离开。当 Lambda 表达式被调用时，会执行表达式体。\n\n编译器获取此 Lambda 表达式并创建一个与上节中匿名方法工作完全相同的匿名方法。事实上，它将被编译成相同或类似的公共中间语言\
  \ (CIL) 代码。\n\n接下来的“尝试一下”将澄清 Lambda 表达式中发生了什么。\n\n最后一个 Lambda 表达式涉及更多计算，但并不比其他的更复杂。Lambda\
  \ 表达式的语法允许你执行更复杂的操作，正如你很快就会看到的。\n\n### Lambda 表达式参数\n\n在你目前所看到的代码中，Lambda 表达式使用了类型推断来确定传递的参数的类型。事实上，这并不是强制的；如果你愿意，可以定义类型。例如，你可以使用以下\
  \ Lambda 表达式：\n\n```\n (int paramA, int paramB) => paramA + paramB \n```\n\n这种方法的优点是使代码更易读，尽管在简洁性和灵活性上有所损失。你可以将之前“尝试一下”中的隐式类型\
  \ Lambda 表达式用于其他数值类型，例如 `long` 变量。\n\n注意你不能在同一个 Lambda 表达式中使用隐式和显式参数类型。以下 Lambda\
  \ 表达式无法编译，因为 `paramA` 是显式类型而 `paramB` 是隐式的：\n\n```\n (int paramA, paramB) => paramA\
  \ + paramB \n```\n\nLambda 表达式中的参数列表始终由全隐式或全显式的参数逗号分隔列表组成。如果你只有一个隐式参数，可以省略括号；否则，它们是参数列表的一部分，如之前所示。例如，你可以有以下单参数、隐式类型\
  \ Lambda 表达式：\n\n```\n param1 => param1 * param1 \n```\n\n你还可以定义没有参数的 Lambda 表达式。这通过使用空括号\
  \ `()` 表示：\n\n```\n () => Math.PI \n```\n\n这可以用于不需要参数但返回 `double` 值的委托。\n\n### Lambda\
  \ 表达式语句体\n\n在你目前看到的所有代码中，Lambda 表达式的语句体使用了单个表达式。你还看到了这个单个表达式是如何被解释为 Lambda 表达式的值的，例如，你可以将表达式\
  \ `paramA` `+` `paramB` 作为返回类型为 `int` 的委托的 Lambda 表达式语句体（假设 `paramA` 和 `paramB`\
  \ 都被隐式或显式类型化为 `int` 值，如示例代码中所示）。\n\n\n\n\n\n之前的示例展示了具有 `void` 返回类型的委托对语句体中使用的代码没有那么挑剔：\n\
  \n```\n myTimer.Elapsed += (source, e) => WriteLine(\"Event handler called after\
  \ \" + \n\n                   $\"{(source as Timer).Interval} milliseconds.\");\
  \ \n```\n\n在这里，该语句不产生任何值，因此它只是简单地执行，而没有任何地方使用返回值。\n\n鉴于 lambda 表达式可以被视为匿名方法语法的扩展，你可能不会惊讶于发现你也可以在\
  \ lambda 表达式语句体中包含多个语句。要这样做，你只需要提供一个用大括号括起来的代码块，就像 C# 中任何其他必须提供多行代码的情况一样：\n\n```\n\
  \ (param1, param2) =>\n\n{\n\n   // 多个语句来就绪！\n\n} \n```\n\n如果你将 lambda 表达式与具有非-`void`\
  \ 返回类型的委托类型结合使用，那么你必须使用 `return` 关键字返回一个值，就像任何其他方法一样：\n\n```\n (param1, param2)\
  \ =>\n\n{\n   // 多个语句来就绪！\n\n   return returnValue;\n\n} \n```\n\n例如，你之前看到过如何重写来自“尝试运行”的以下代码：\n\
  \n```\n PerformOperations((paramA, paramB) => paramA + paramB); \n```\n\n作为：\n\n\
  ```\n PerformOperations(delegate(int paramA, int paramB)\n\n            {\n\n  \
  \             return paramA + paramB;\n\n            }); \n```\n\n或者，你也可以将代码重写如下：\n\
  \n```\n PerformOperations((paramA, paramB) =>\n\n            {\n\n             \
  \  return paramA + paramB;\n\n            }); \n```\n\n这更符合原始代码，因为它保持了参数 `paramA`\
  \ 和 `paramB` 的隐式类型化。\n\n在大多数情况下，lambda 表达式在与单个表达式配合使用时最有用——而且无疑最优雅。坦率地说，如果你需要多个语句，定义一个单独匿名方法而不是使用\
  \ lambda 表达式会让你的代码读性更好；这使得你的代码更具重用性。\n\n### 作为委托的 Lambda 表达式\n\n你已经看到了 lambda 表达式和匿名方法之间的某些区别，后者具有更大的灵活性——例如，隐式类型参数。此时，值得注意的是另一个关键区别，尽管这种影响直到你之后学习\
  \ `LINQ` 时才会变得明显。\n\n你可以通过两种方式解释 lambda 表达式。第一种方式（你在本章中看到的）是作为委托。也就是说，你可以将 lambda\
  \ 表达式赋值给委托类型，就像你在之前的“尝试运行”中做的那样。\n\n通常情况下，你可以使用 `System` 命名空间定义的以下泛型类型来表示带有参数的 lambda\
  \ 表达式：\n\n* `Action`：无参数且返回类型为 `void` 的 lambda\n* `Action<>`：带参数且返回类型为 `void` 的\
  \ lambda\n* `Func<>`：带参数且返回类型非 `void` 的 lambda\n\n`Action<>` 具有泛型参数，每个对应一个参数；`Func<>`\
  \ 具有泛型参数。在 `Func<>` 中，返回类型总是最后一个。\n\n例如，你之前看到的 lambda 表达式：\n\n```\n (int paramA,\
  \ int paramB) => paramA + paramB\n```\n\n此表达式可以表示为类型为 `Func<int, int, int>` 的委托，因为它有两个参数和一个\
  \ `int` 类型返回。注意，在许多情况下，可以使用这些泛型委托类型代替你在“尝试运行”中定义的 `IntegerOperationDelegate` 委托。\n\
  \n第二种解释 lambda 表达式的方式是表达式树。表达式树是 lambda 表达式的抽象表示；因此它不能直接执行。相反，你可以使用表达式树程序化地分析 lambda\
  \ 表达式并对其执行操作。这显然是一个复杂的主题。然而，表达式树对于你之后学习的 `LINQ` 功能至关重要。为了给出一个具体的例子，LINQ 框架包含一个名为\
  \ `Expression<>` 的泛型类，可以用它来封装 lambda 表达式。该类的使用方法之一是将你在 C# 中编写的 lambda 表达式转换为数据库中直接执行的等效\
  \ SQL 脚本。当你之后遇到此功能时，将更好地理解发生了什么。\n\n### Lambda 表达式与集合\n\n现在你已经学习了 `Func<>` 泛型委托，就可以理解\
  \ `System.Linq` 命名空间为数组类型提供的一些扩展方法（你可能在编码的不同点见过它们）。例如，有一个名为 `Aggregate()` 的扩展方法，它通过以下三个重载定义：\n\
  \n```\n public static TSource Aggregate<TSource>(\n\n   this IEnumerable<TSource>\
  \ source,\n\n   Func<TSource, TSource, TSource> func);\n\npublic static TAccumulate\
  \ Aggregate<TSource, TAccumulate>(\n\n   this IEnumerable<TSource> source,\n\n \
  \  TAccumulate seed,\n\n   Func<TAccumulate, TSource, TAccumulate> func);\n\npublic\
  \ static TResult Aggregate<TSource, TAccumulate, TResult>(\n\n   this IEnumerable<TSource>\
  \ source,\n\n   TAccumulate seed,\n\n   Func<TAccumulate, TSource, TAccumulate>\
  \ func,\n\n   Func<TAccumulate, TResult> resultSelector);\n```\n\n与之前显示的扩展方法一样，这一眼看起来难以理解，但如果你将其拆解，就可以轻松掌握。该函数的\
  \ IntelliSense 你它执行以下操作：\n\n```\n 对序列应用累加函数。\n```\n\n这意味着累加函数（你可以以 lambda 表达式的形式提供）将应用于集合从头到尾的每个元素。这个累加函数必须有两个参数和一个返回值。一个输入是当前元素；另一个输入可以是种子值（seed）、集合中的第一个值或上一次评估的结果。\n\
  \n在三个重载中最简单的一个中，只有一个泛型类型指定，它可以从实例参数的类型推断出来。例如，在以下代码中，泛型类型指定将是 `int`（累加函数目前留空）：\n\
  \n```\n int[] myIntArray = { 2, 6, 3 };\n\nint result = myIntArray.Aggregate(…);\
  \ \n```\n\n这等同于：\n\n```\n int[] myIntArray = { 2, 6, 3 };\n\nint result = myIntArray.Aggregate<int>\n\
  \n(…); \n```\n\n此处需要的 lambda 表达式可以从扩展方法的规范推断出来。因为代码中类型 `TSource` 是 `int`，你必须为委托\
  \ `Func<int, int, int>` 提供一个 lambda 表达式。例如，你可以使用之前见过的的一个：\n\n```\n int[] myIntArray\
  \ = { 2, 6, 3 };\n\nint result = myIntArray.Aggregate((paramA, paramB) => paramA\
  \ + paramB); \n```\n\n此调用会导致 lambda 表达式被调用两次，第一次 `paramA` = 2 且 `paramB` = 6，第二次\
  \ `paramA` = 8（第一次计算的结果）且 `paramB` = 3。赋值给变量 `result` 的结果将是 `int` 值 `11` ——数组中所有元素的总和。\n\
  \n\n\n\n\n`Aggregate()` 扩展方法的另外两个重载非常相似，但它们允许你执行稍微复杂的处理。在接下来的简短“试运行”（Try It Out）中将演示这一点。\n\
  \n这个示例并没有完成什么了不起的内容，但它演示了你如何使用涉及泛型类型参数、集合以及看似复杂的语法扩展方法。你将在书的后续部分看到更多此类内容。\n\n##\
  \ 练习\n\n1. 13.1 为一个事件处理程序编写代码，它使用通用的 `(object sender, EventArgs e)` 语法，并能够接受本章之前代码所示的\
  \ `Timer.Elapsed` 事件或 `Connection.MessageArrived` 事件。处理程序应该输出一个字符串，指定接收到了哪种类型的事件，并根据发生的事件，输出\
  \ `MessageArrivedEventArgs` 参数的 `Message` 属性或 `ElapsedEventArgs` 参数的 `SignalTime`\
  \ 属性。\n\n2. 13.2 修改纸牌游戏示例，以检查流行牌牌拉米（rummy）更有趣的获胜条件。这意味着如果玩家的手牌中包含两组“顺”（sets），其中一组包含三张牌，另一组包含四张牌，则该玩家获胜。“顺”被定义为同花色的牌牌序列（例如\
  \ 3H, 4H, 5H, 6H）或相同点数的几张牌（例如 2H, 2D, 2S）。\n\n3. 13.3 为什么不能对以下类使用对象初始化器？在修改此类类以启用使用对象初始化器后，给出一个代码示例，说明你如何一步完成实例化并初始化该类：\n\
  \n```cs\npublic class Giraffe\n{\n   public Giraffe(double neckLength, string name)\n\
  \   {\n      NeckLength = neckLength;\n      Name = name;\n   }\n   public double\
  \ NeckLength {get; set;}\n   public string Name {get; set;}\n} \n```\n\n4. 13.4\
  \ 判断对错：如果你声明一个类型为 `var` 的变量，你将能够使用它来持有任何对象类型。\n\n5. 13.5 当你使用匿名类型时，如何比较两个实例以确定它们是否包含相同的数据？\n\
  \n6. 13.6 尝试修正以下扩展方法的代码，它包含一个错误：\n\n```cs\npublic string ToAcronym(this string inputString)\n\
  {\n   inputString = inputString.Trim();\n   if (inputString == \"\")\n   {\n   \
  \   return \"\";\n   }\n   string[] inputStringAsArray = inputString.Split(' ');\n\
  \   StringBuilder sb = new StringBuilder();\n   for (int i = 0; i < inputStringAsArray.Length;\
  \ i++)\n   {\n      if (inputStringAsArray[i].Length > 0)\n      {\n         sb.AppendFormat(\"\
  {0}\",\n            inputStringAsArray[i].Substring(\n               0, 1).ToUpper());\n\
  \      }\n   }\n   return sb.ToString();\n} \n```\n\n7. 13.7 你如何确保问题 4 中的扩展方法对你的客户端代码可用？\n\
  \n8. 13.8 重写此处显示的 `ToAcronym()` 方法为单条语句。代码应确保单词之间包含多个空格的字符串不会引起错误。提示：你将需要 `?:` 三元运算符、`string.Aggregate<string,\
  \ string>()` 扩展方法以及 Lambda 表达式来实现这一点。\n\n练习答案可以在附录中找到。\n\n## 本章所学知识\n\n| 主题 | 核心概念\
  \ |\n| --- | --- |\n| 命名空间限定 | 为了避免命名空间限定中的歧义，你可以使用 `::` 运算符强制编译器使用你已创建的别名。你还可以使用\
  \ `global` 命名空间作为顶层命名空间的别名。 |\n| 自定义异常 | 你可以通过派生根类 `Exception` 来创建你自己的异常类。这非常有帮助，因为它让你对捕获特定异常有更大的控制权，并允许你自定义异常中包含的数据以便有效处理。\
  \ |\n| 事件处理 | 许多类暴露了当代码中发生某些触发时触发的事件。你可以为这些事件编写处理程序，在触发时执行代码。这种双向通信是响应式代码的一种极机制，并避免了你编写原本可能用于轮询对象变化的复杂且混乱代码。\
  \ |\n| 事件定义 | 你可以定义自己的事件类型，这涉及创建一个命名事件以及用于该事件的任何处理程序的委托类型。你可以使用无返回类型的标准委托类型以及派生自\
  \ `System.EventArgs` 的自定义事件参数来允许多用途事件处理程序。你还可以使用 `EventHandler` 和 `EventHandler<T>`\
  \ 委托类型来定义代码更简单的事件。 |\n| 匿名方法 | 通常，为了提高代码的可读读性，你可以使用匿名方法而不是完整的事件处理程序方法。这意味着在添加事件处理程序的地方内联定义当事件触发时执行的代码。你通过\
  \ `delegate` 关键字来实现这一点。 |\n| 特性 | 有时，由于你正在使用的框架要求，或者因为你刻意选择，你会在代码中使用特性。你可以使用 `[AttributeName]`\
  \ 语法为类、方法和其他成员添加特性，并可以通过派生自 `System.Attribute` 来创建你自己的特性。你可以通过反射读取特性值。 |\n| 初始化器\
  \ | 你可以使用初始化器在创建对象或集合的同时对其进行初始化。这两种初始化器都由大括号包围的代码组成。对象初始化器允许通过提供逗号分隔的属性值对来设置属性值。集合初始化器只需要逗号分隔的值列表。当你使用对象初始化器时，可以使用非默认构造函数。\
  \ |\n| 类型推断 | `var` 关键字允许你在声明变量时省略其类型。然而，只有当类型可以在编译时确定时这才是可能的。使用 `var` 不会破坏 C# 的强类型方法论，因为使用\
  \ `var` 声明的变量只有一个且唯一的类型。 |\n| 匿名类型 | 对于许多用于数据存储的简单类型，定义类型是不必要的。相反，你可以使用匿名类型，其成员是从用法推断的。你使用初始化器语法定义匿名类型，你设置的每个属性都被定义为只读属性。\
  \ |\n| 动态查找 | 使用 `dynamic` 关键字定义动态类型变量，它可以持有任何值。然后你可以使用标准的属性或方法语法访问包含的值的成员，这些成员仅在运行时检查。如果在运行时尝试访问不存在的成员，将抛出异常。这种动态类型极大简化了访问非\
  \ .NET 类型或编译时无法类型信息的 .NET 类型所需的语法。但是必须谨慎使用动态类型，因为你失去了编译时的代码检查。你可以通过实现 `IDynamicMetaObjectProvider`\
  \ 接口来控制动态查找的行为。 |\n| 可选方法参数 | 通常，你可以定义包含许多参数的方法，其中许多参数很少使用。为了避免强制客户端代码为很少使用的参数指定值，你可以提供多个方法重载。或者，你可以将这些参数定义为可选（并为未指定的参数提供默认值）。调用你方法的客户端代码可以只指定所需的参数。\
  \ |\n\n\n\n\n\n| 命名方法参数 | 客户端代码可以通过位置或名称（或两者的结合，其中先指定位置参数）来指定方法的参数值。命名参数可以按任何顺序指定。这在与可选参数结合时特别有用。\
  \ |\n| Lambda 表达式 | Lambda 表达式本质上是定义匿名方法的简写方式，尽管它们具有如隐式类型等额外功能。你通过用逗号分隔的参数列表（或无参数时使用空括号）、`=>`\
  \ 运算符和一个表达式来定义 Lambda 表达式。该表达式可以是用大括号括的代码块。具有最多八个参数和可选返回类型的 Lambda 表达式可以用 `Action`、`Action<>`\
  \ 和 `Func<>` 委托表示。许多用于集合的 LINQ 扩展方法使用了 Lambda 表达式参数。 |\n\n# 第二部分：Windows 编程\n\n\
  * 第 14 章：基础桌面编程\n* 第 15 章：高级桌面编程\n\n# 14 基础桌面编程\n\n## XAML\n\nXAML 是一种使用 XML 语法的语言，允许以声明式、分级的方式将控件添加到用户界面中。也就是说，你可以以\
  \ XML 元素的形式添加控件，并用 XML 属性指定控件属性。你还可以拥有包含其他控件的控件，这对于布局和功能都是至关重要的。\n\nXAML 的设计考虑了当今强大的显卡，因此它允许你通过\
  \ DirectX 使用这些显卡提供的所有高级功能。以下列出了其中一些功能：\n\n* 浮点坐标和矢量图形，可提供可以进行缩放、旋转并以其他方式进行变换而不会损失质量的布局\n\
  * 用于高级渲染的 2D 和 3D 能力\n* 高级字体处理和渲染\n* 用于 UI 对象的实色、渐变和纹理填充，并带有可选的透明度\n* 动画故事板，可用于各种情况，包括点击按钮等用户触发的事件\n\
  * 可重用资源，你可以使用它们来动态设置控件样式\n\n### 关注点分离\n\n维护多年来编写的 Windows 应用程序存在一个问题：它们往往将生成用户界面的代码与根据用户操作执行的代码混合在一起。这使得多个开发者和设计人员难以在同一个项目上工作。WPF\
  \ 通过两种方式解决了这个问题。首先，通过使用 XAML 描述 GUI 而不是 C#，GUI 变得平台无关，你实际上可以在不需要任何代码的情况下渲染 XAML。其次，这意味着将\
  \ C# 代码放置在与 GUI 代码不同的文件中感觉上是自然的。Visual Studio 利用了某种称为 `code-behind`（后置代码）的文件，这些是与\
  \ XAML 文件动态链接的 C# 文件。\n\n由于 GUI 与代码分离了，因此可以为设计 GUI 创建定制的应用程序，而这正是微软所做的。Visual Studio\
  \ 的设计工具 Blend 是设计人员在创建 WPF GUI 时的首选工具。该工具可以加载与 Visual Studio 相同的项目，但 Visual Studio\
  \ 更多地针对开发者而非设计人员，而 Blend 的情况恰恰相反。这意味着在拥有设计人员和开发人员的大型项目中，每个人都可以在同一个项目上共同工作，使用他们偏好的工具，而不必担心无意中影响他人。\n\
  \n### XAML 实战\n\n如前所述，XAML 是 XML，这意味着只要文件较小，就可以立即看到它所描述的内容。看一眼这个小型的示例，看看你是否能看出它是做什么的：\n\
  \n```\n <Window x:Class=\"Ch14Ex01.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns_local=\"clr-namespace:WpfApp1\"\n        mc:Ignorable=\"d\"\n  \
  \      Title=\"Hello World\" Height=\"350\" Width=\"525\">\n    <Grid>\n       \
  \ <Button Content=\"Hello World\" \n            HorizontalAlignment=\"Left\" \n\
  \            Margin=\"220,151,0,0\" \n            VerticalAlignment=\"Top\" \n \
  \           Width=\"75\"/>\n    </Grid>\n</Window> \n```\n\n此示例中的 XAML 创建了一个带有单个按钮的窗口。窗口和按钮都显示\
  \ `Hello World` 文本。XML 允许你在其他标签内部放置标签，只要正确地关闭它们即可。当 XAML 中的一个元素放在另一个元素内部时，该元素就变成了包含元素的内容，这意味着\
  \ `Button` 也可以像这样写：\n\n```\n <Button HorizontalAlignment=\"Left\" \n           \
  \ Margin=\"220,151,0,0\" \n            VerticalAlignment=\"Top\" \n            Width=\"\
  75\">\n      Hello World\n    </Button> \n```\n\n在这里，`Button` 的 `Content` 属性被删除了，文本现在是\
  \ `Button` 控件的子节点。在 XAML 中，`Content` 可以是几乎任何内容，此示例也证明了这一点：`Button` 元素是 `Grid` 元素的内容，而\
  \ `Grid` 元素又是 `Window` 元素的内容。\n\n大多数（如果不是所有）控件都可以拥有内容，对于更改内置控件的外观，限制非常少。第 15 章 详细详细探讨了这一点。\n\
  \n### 命名空间\n\n上例中的 `Window` 元素是 XAML 文件的根元素。该元素通常包含若干命名空间声明。默认情况下，Visual Studio\
  \ 设计器包含了两个你应该注意的命名空间：`http://schemas.microsoft.com/winfx/2006/xaml/presentation`\
  \ 和 `http://schemas.microsoft.com/winfx/2006/xaml`。第一个是 WPF 的默认命名空间，声明了许多用于创建用户界面的控件。第二个声明了\
  \ XAML 语言本身。命名空间不必在根标签上声明，但这样做可以确保其内容在整个 XAML 文件中都可以访问，因此很少需要移动声明。\n\n当你在 Visual\
  \ Studio 中创建新窗口时，演示命名空间总是默认的，语言命名空间为 `xmlns_x`。正如 `Window`、`Button` 和 `Grid` 标签所示，这确保了你不需要为添加的控件加前缀，但指定的语言元素必须带有\
  \ `x`。\n\n你经常看到的最后一个命名空间是系统命名空间：`xmlns_sys=\"clr-namespace:System;assembly=mscorlib\"\
  `。该命名空间允许你在 XAML 中使用 .NET Framework 构建类型。通过这种方式，你编写的标记可以显式声明你创建的元素类型。例如，可以在标记中声明一个数组并说明数组成员是字符串：\n\
  \n```\n <Window.Resources>\n    <ResourceDictionary>\n      <x:Array Type=\"sys:String\"\
  \ x:Key=\"localArray\">\n        <sys:String>Benjamin Perkins</sys:String>\n   \
  \     <sys:String>Jacob Vibe Hammer</sys:String>\n        <sys:String>Job D. Reid</sys:String>\n\
  \      </x:Array>\n    </ResourceDictionary>\n  </Window.Resources> \n```\n\n####\
  \ 后置代码文件\n\n\n\n\n\n虽然 XAML 是一种声明用户界的强大方式，但它并不是一种编程语言。每当你想要执行演示之外的操作时，你就需要 `C#`。虽然可以直接将\
  \ `C#` 代码嵌入到 XAML 中，但绝不建议将代码和标记混合，而且你不会在书中看到这种做法。你将会经常看到的是后台代码文件（code-behind files）的使用。这些文件是普通的\
  \ `C#` 文件，名称与 XAML 文件相同，并带有 `.cs` 扩展名。尽管你可以随心所欲地命名它们，但最好遵循这一命名规范。当你在应用程序中创建一个新窗口时，Visual\
  \ Studio 会自动创建后台代码文件，因为它预期你会向窗口中添加代码。它还向 XAML 中的 `Window` 标签中添加了 `x:Class` 属性：\n\
  \n```xml\n <Window x:Class=\"Ch14Ex01.MainWindow\" \n```\n\n这告诉编译器，它可以在某个文件中，而是在\
  \ `Ch14Ex01.MainWindow` 类中找到该窗口的代码。由于你只能指定完全限定类名，而不能指定该类所在的程序集，因此无法将后台代码文件放在定义 XAML\
  \ 的项目之外。Visual Studio 将后台代码文件放在与 XAML 文件相同的目录中，因此在 Visual Studio 中工作时，你不需要担心这个问题。\n\
  \n## 演练场\n\n现在你已经了解了足够关于 WPF 构建的知识并开始上手了，是时候查看编辑器了。首先通过选择文件 ![image](img/Image00008.gif)\
  \ 新建 ![image](img/Image00008.gif) 项目创建一个新的 WPF 项目。在“新建项目”对话框中，导航到 Visual C# 下的 Windows\
  \ Classic Desktop 节点，并选择项目模板 WPF App（`.Net Framework`）。图 14-1 显示了选择了模板的新建项目对话框。\n\
  \n![插图说明显示了选择了项目模板 WPF App (.Net Framework) 的新建项目对话框。](img/Image00173.jpg)\n\n**图\
  \ 14-1**\n\n为了能在后续示例中重用此示例，请将项目命名为 `Ch14Ex01`。\n\nVisual Studio 现在显示了一个空窗口和周围的若干面板。屏幕的大部分分为两个区域。上半部分被称为设计视图（Design\
  \ View），显示你正在设计的窗口的所见所得（WYSIWYG）表示；下部分被称为 XAML 视图（XAML View），显示相同窗口的文本表示。\n\n在设计视图的右侧，你可以看到之前项目中过的解决方案管理器（Solution\
  \ Explorer）和一个属性面板（Properties panel），属性面板显示设计视图和 XAML 视图中当前选择内容的信息。值得注意的是，属性面板、XAML\
  \ 视图和设计视图中的选择始终是同步的，因此如果你在 XAML 视图中移动光标，将看到另外两个视图中的选择发生变化。\n\n设计视图左侧折叠了几个面板，其中一个是工具箱（Toolbox）。本章将向你展示如何使用工具箱面板中的许多控件为纸牌游戏创建对话框，因此请点击右上角的图钉将其展开并固定打开。顺便，请也展开面板中的\
  \ Common WPF Controls 节点。你将在本章中将使用这里显示的大部分控件。\n\n### WPF 控件\n\n控件将预包代码和可以重用的 GUI\
  \ 结合起来，以创建更复杂的应用程序。它们可以定义默认如何绘制自己以及一组标准行为。某些控件，如 `Label`、`Button` 和 `TextBox` 控件很容易识别，并且已经在\
  \ Windows 应用程序中使用了大约 20 年。其他控件，如 `Canvas` 和 `StackPanel` 则不显示任何内容，仅仅是帮助你组织 GUI。\n\
  \n开箱即用的控件看起来完全就像你预期标准 Windows 应用中控件的模样，并使用当前的 Windows 主题来绘制自己。所有这些都是高度可定制的，只需点击几次，就可以完全更改控件的显示方式。这种自定义是通过定义在控件上的属性完成的。WPF\
  \ 使用你以前见过的普通属性，并添加了一种名为依赖属性（`dependency property`）的新类型属性。将在第 15 章中详细介绍，但目前知道 WPF\
  \ 的许多属性不仅仅是获取和设置值就足够了；例如它们能够通知观察者变化。\n\n除了定义内容在屏幕上的外观外，控件还定义了标准行为，例如点击按钮和在列表中选择内容的能力。你可以通过“处理”控件定义的事件来更改用户在控件上执行操作时发生的情况。你何时以及如何实现事件处理程序因应用程序和控件而异。对于按钮，你将始终处理\
  \ `Click`；对于 `ListBox`，你通常会处理 `SelectionChanged`。在其他控件（如 `Label` 或 `TextBlock`）上，你很少实现任何处理程序。\n\
  \n#### 属性\n\n如所述，所有控件都有许多用于操作控件的属性。某些易于理解，如 `height` 和 `width`，而另一些就不那么直观，例如 `RenderTransform`。它们都可以使用属性面板、直接在\
  \ XAML 中或通过在设计视图中操作控件来设置。接下来的“尝试一下”（Try It Out）演示了如何设置属性。\n\n用户在对话框上执行的操作（例如从列表中选择内容）通常会导致其他控件发生变化并更新。大多数情况下，普通的\
  \ .NET 属性是简单的 getter 和 setter，它们没有通知其他控件已更改的能力。进入依赖属性。依赖属性是以这种方式注册到 WPF 属性系统的属性，允许允许扩展功能。这种扩展功能包括但不限于自动属性更改。具体而言，依赖属性具有以下功能：\n\
  \n*   你可以使用样式更改依赖属性的值。\n*   你可以通过资源或数据绑定设置依赖属性的值。\n*   你可以在动画中更改依赖属性的值。\n*   你可以在\
  \ XAML 中层次化设置依赖属性——即你在父元素上设置的依赖属性值可以作为其子元素相同依赖属性的默认值。\n*   你可以使用定义的编码模式配置属性值更改的通知。\n\
  *   你可以配置一组相关属性，以便在其中一个属性更改时所有属性都更新。这被称为强制（`coercion`）。更改的属性被认为强制（`coerce`）其他属性的值。\n\
  *   你可以对依赖属性应用元数据以指定其他行为特性。例如，你可以指定如果给定属性发生变化，可能需要重新排列用户界面。\n\n在实践中，由于依赖属性的实现方式，你可能发现它们与普通属性没有太大。然而，当你创建自己的控件时，你会很快发现使用普通\
  \ .NET 属性时许多功能突然消失了。\n\n第 15 章展示了如何实现新的依赖属性。\n\n\n\n\n\n### 附加属性\n\n`attached property`（附加属性）是一种定义该属性的类实例的每个子对象都可以使用的属性。例如，如你将在在本章稍后看到的，你在之前的示例中使用的\
  \ `Grid` 控件允许你定义列和行，以便对 `Grid` 的子控件进行排序。每个子控件随后可以使用附加属性 `Column` 和 `Row` 来指定它们在网格中的位置：\n\
  \n```\n <Grid HorizontalAlignment=\"Left\" Height=\"167\" VerticalAlignment=\"Top\"\
  \ Width=\"290\">\n\n  <Button Content=\"Button\" HorizontalAlignment=\"Left\" Margin=\"\
  10,10,0,0\" \nVerticalAlignment=\"Top\" Width=\"75\" Grid.Column=\"0\" Grid.Row=\"\
  0\"\nHeight=\"22\"/>\n\n  …\n\n  </Grid> \n```\n\n在这里，附加属性是通过父元素的名称、句点以及附加属性名称来引用的。\n\
  \n在 WPF 中，附加属性有多种用途。当你查看“控件布局（Control Layout）”部分中如何定位控件时，你会看到很多附加属性。你将学习容器控件如何定义附加属性，从而允许子控件定义（例如）它们停靠容器的哪个边缘。\n\
  \n### 事件\n\n在第 13 章中，你学习了什么是事件以及如何使用它们。本节涵盖特定类型的事件——特别是由 WPF 控件生成的事件，并引入了`routed\
  \ events`（路由事件），它们通常与用户操作相关。例如，当用户点击按钮时，该按钮会生成一个指示其发生了什么的事件。处理事件是程序员为该按钮提供某些功能的手段。\n\
  \n你处理的许多事件是由你在本书书中操作的大多数控件暴露的。这包括如 `LostFocus` 和 `MouseEnter` 等事件。这是因为事件本身继承自 `Control`\
  \ 或 `ContentControl` 等基类。其他事件（例如 `DatePicker` 的 `CalendarOpened` 事件）更具特定性，仅在专用控件上找到。一些最常用的事件列在表\
  \ 14-1 中。\n\n| 事件 | 描述 |\n| --- | --- |\n| `Click` | 当控件被点击时发生。在某些情况下，当用户按下 Enter\
  \ 或空格键时，此事件也会发生。 |\n| `Drop` | 当拖放操作完成时发生——换句话说，当对象被拖到控件上方且用户释放鼠标按钮时发生。 |\n| `DragEnter`\
  \ | 当被拖的对象进入控件的边界时发生。 |\n| `DragLeave` | 当被拖的对象离开控件的边界时发生。 |\n| `DragOver` | 当对象被拖过控件上方时发生。\
  \ |\n| `KeyDown` | 当控件具有焦点时按下按键时发生。此事件始终发生在 `KeyPress` 和 `KeyUp` 之前。 |\n| `KeyUp`\
  \ | 当控件具有焦点时释放按键时发生。此事件始终发生在 `KeyDown` 事件之后。 |\n| `GotFocus` | 当控件接收焦点时发生。不要使用此事件对控件进行验证。请改用\
  \ `Validating` 和 `Validated`。 |\n| `LostFocus` | 当控件失去焦点时发生。不要使用此事件对控件进行验证。请改用 `Validating`\
  \ 和 `Validated`。 |\n| `MouseDoubleClick` | 当控件被双击时发生。 |\n| `MouseDown` | 当鼠标指针位于控件上方并按下鼠标按钮时发生。这与\
  \ `Click` 事件不同，因为 `MouseDown` 在按钮按下后立即且在释放之前就发生了。 |\n| `MouseMove` | 当鼠标在控件上方移动时持续发生。\
  \ |\n| `MouseUp` | 当鼠标指针位于控件上方并释放鼠标按钮时发生。 |\n\n**表 14-1 :** 常用控件事件\n\n你将在本章的示例中看到这些许多事件。\n\
  \n### 处理事件\n\n添加事件处理程序有两种基本方法。一种方法是使用属性窗口中的“事件（Events）”列表，如图 14-3 所示，该列表在点击闪电按钮时显示。\n\
  \n![显示使用属性窗口中的事件列表为事件添加处理程序的示意图。](img/Image00175.jpg)\n\n**图 14-3**\n\n要为特定事件添加处理程序，可以输入事件名称并按回车，或者在事件列表事件名称右侧双击。这会导致事件被添加到\
  \ XAML 标签中。处理事件的方法签名将添加到 C# 后置代码文件中。\n\n```xml\n <Button x:Name=\"rotatedButton\"\
  \ Content=\"2nd Button\" Width=\"75\" \n            Height=\"22\" FontWeight=\"\
  Bold\" Margin=\"218,138,224,159\" \n            RenderTransformOrigin=\"0.5,0.5\"\
  \ \n            Click=\"rotatedButton_Click\">\n      …\n\n</Button>\n\nprivate\
  \ void rotatedButton_Click(object sender, RoutedEventArgs e)\n{\n\n}\n```\n\n\n\n\
  \n\n当你创建一个命令（command）时，你必须实现一段代码来回答问题：“此代码现在可以供用户使用？”这意味着当一个命令与按钮关联时，该按钮可以询问命令是否可以执行，并据此设置其状态。\n\
  \n命令的实现要比事件（event）复杂得多，因此在[第 15 章](#text00019.html_Page_479）之前不会看到它们的用法，在那里它们将与菜单项配合使用。在下一个“尝试一下”（Try\
  \ It Out）中，你将为本章之前的示例添加事件处理器，以演示路由事件。\n\n## 控件类型\n\nWPF 有许多控件供选择。我们感兴趣的两种类型是内容（Content）控件和项目（Items）控件。内容控件（例如\
  \ `Button` 控件）具有 `Content` 属性，该属性可以设置为任何其他控件。这意味着你可以指定控件的显示方式，但你必须在内容中直接指定零或恰好一个控件。尽管如此，你可以指定一个项目控件，项目控件是一种允许你插入多个控件作为内容的控件。项目控件的一个示例是\
  \ `Grid` 控件。在创建用户界面时，你不断地结合使用这两种控件。\n\n除了内容和项目控件外，还有许多类型的控件不允许你使用其他控件作为其内容。其中一个示例是\
  \ `Image` 控件，它用于显示图像。改变这种行为将违背该控件的初衷。\n\n## 控件布局\n\n到本章为止，你已经使用 `Grid` 元素布局了几个控件，主要是因为它是创建新的\
  \ WPF 应用程序时默认提供的控件。然而，你还没有检查该类的完整功能，也没有学习其他可以使用你来实现替代布局的布局容器。本节将更详细地研究控件布局，因为它是\
  \ WPF 的基本概念。\n\n### 基础布局概念\n\n在 WPF 中，你使用布局控件来协助窗口上项的布局。这类控件有很多，但在你开始使用它们之前，你应该了解一些基本概念以及\
  \ Visual Studio 提供的视觉辅助工具。\n\n#### 堆叠顺序（Stack Order）\n\n当容器控件包含多个子控件时，它们按照特定的堆叠顺序进行绘制。你可能在绘图软件中熟悉过这个概念。考虑堆叠顺序的最佳方法是想象每个控件都包含在一个玻璃板中，而容器包含了这样一叠玻璃板。因此，容器的外观就是当你从顶部向下通过这些玻璃层时看到的景象。容器包含的控件是重叠的，所以你看到的内容取决于玻璃板的顺序。如果一个控件在堆叠中的位置靠上，那么它就是你在重叠区域看到的控件。位于堆叠靠下的控件可能会被上方的控件部分或完全隐藏。\n\
  \n这也会影响当你用鼠标点击窗口时的击命中测试（hit testing）。在考虑重叠控件时，目标控件始终是堆叠中位于最上那个。控件的堆叠顺序由它们在容器子项列表中出现的顺序决定。容器中的第一个子控件被放在堆叠的最底层，最后一个子控件放在最顶层。第一个和最后一个控件之间的子控件被放置在越来越高的层上。控件的堆叠顺序对你可以在\
  \ WPF 中使用的某些布局控件具有额外的影响，正如你很快将看到的那样。\n\n#### 对齐、外边距、内边距和尺寸（Alignment, Margins, Padding,\
  \ and Dimensions）\n\n之前的示例使用了 `Margin`、`HorizontalAlignment` 和 `VerticalAlignment`\
  \ 属性在 `Grid` 容器中定位控件，但没有详细介绍它们的用法。你还看到过如何使用 `Height` 和 `Width` 来指定尺寸。这些属性连同你还没有过的\
  \ `Padding`，对于所有布局控件（或大多数布局控件，正如你将看到的）来说都是有用的，但方式不同。不同的布局控件还可以为这些属性设置默认值。你将在后续章节中通过示例看到很多，在此之前，涵盖基础知识是值得的。\n\
  \n两个对齐属性 `HorizontalAlignment` 和 `VerticalAlignment` 决定了控件的对齐方式。`HorizontalAlignment`\
  \ 可以设置为 `Left`、`Right`、`Center` 或 `Stretch`。`Left` 和 `Right` 倾向于将控件放在容器的左边缘或右边缘，`Center`\
  \ 将控件放在中间，而 `Stretch` 改变控件的宽度，使其边缘到达容器的侧面。`VerticalAlignment` 类似，其值为 `Top`、`Bottom`、`Center`\
  \ 或 `Stretch`。\n\n`Margin` 和 `Padding` 分别指定在控件边缘和控件边缘内部留出的空白。之前的示例使用 `Margin` 相对于窗口边缘定位控件。这之所以奏效，是因为当\
  \ `HorizontalAlignment` 设置为 `Left` 且 `VerticalAlignment` 设置为 `Top` 时，控件紧贴左上角定位，而\
  \ `Margin` 在控件边缘周围插入了一个间隙。`Padding` 的用法类似，但它是将控件的内容与其边缘隔开。这对于 `Border` 特别有用，正如你将在下一节中看到的。`Padding`\
  \ 和 `Margin` 都可以以四部分的形式（格式为 `leftAmount`、`topAmount`、`rightAmount`、`bottomAmount`）或单个值（一个\
  \ `Thickness` 值）指定。\n\n以后你会看到 `Height` 和 `Width` 经常由其他属性控制。例如，当 `HorizontalAlignment`\
  \ 设置为 `Stretch` 时，控件的 `Width` 属性会随着容器宽度的变化而变化。\n\n#### 边界（Border）\n\n`Border` 控件是一个简单且实用的容器控件。它持有单个子控件，而不是你稍后将看到的复杂控件那样的多个控件。这个子控件将调整大小填充\
  \ `Border`。这看起来可能并不特别有用，但记住你可以使用 `Margin` 和 `Padding` 属性来在容器内定位 `Border`，以及在 `Border`\
  \ 边缘内定位其内容。你还可以，例如设置 `Border` 的 `Background` 属性使其可见。你将看到该控件的实际运行。\n\n#### 视觉调试工具\n\
  \n当你以调试模式运行 WPF 应用程序时，Visual Studio 在窗口顶部中心覆盖一个微小的 4 点菜单。四个菜单项中的三个用于开启或关闭调试功能，最后一项打开活动视觉树（Live\
  \ Visual Tree）。下一个“尝试一下”将继续之前的示例并演示这些视觉工具。\n\n### 布局面板（Layout Panels）\n\n所有内容布局控件都派自抽象类\
  \ `Panel`。该类仅定义了一个可以包含派自 `UIElement` 对象的容器。所有 WPF 控件都派自 `UIElement`。你不能直接使用 `Panel`\
  \ 类进行控件布局，但如果你想，可以派自它。或者，你可以使用派自 `Panel` 的布局控件。[表 14-2](#text00018.html_c14-tbl-0002）描述了最常见的面板。\n\
  \n| Panel | 描述 |\n| :--- | :--- |\n| `Canvas` | 该控件允许你按任何方式定位子控件。它不对子控件的定位施加任何限制，也不提供任何定位帮助。\
  \ |\n| `DockPanel` | 该控件允许你将子控件停靠在它的四个边缘之一。最后一个子控件将填充剩余空间。 |\n\n\n\n\n\n| `Grid`\
  \ | 此控件允许子控件的灵活布局。你可以将此控件的布局划分为行和列，从而能够在网格布局中对齐控件。 |\n| `StackPanel` | 此控件按照顺序水平或垂直布局对其子控件进行定位。\
  \ |\n| `WrapPanel` | 此控件与 `StackPanel` 一样，按照顺序水平或垂直布局对其子控件进行定位，但它并不是将控件放在单行或单列，而是根据可用空间将子元素封装到多行或多列。\
  \ |\n\n**表 14‐2 :** 常用布局面板\n\n### Canvas\n\n`Canvas` 控件提供了对控件定位的完全自由。关于 `Canvas`\
  \ 的另一点是，与子元素一起使用的 `HorizontalAligment` 和 `VerticalAlignment` 属性对这些元素的定位完全没有影响。\n\
  \n你可以像前面的示例那样使用 `Margin` 在 `Canvas` 中为元素定位，但更好的方法是使用 `Canvas` 类暴露的附加属性 `Canvas.Left`、`Canvas.Top`、`Canvas.Right`\
  \ 和 `Canvas.Bottom`：\n\n```\n <Canvas…>\n\n  <Button Canvas.Top=\"10\" Canvas.Left=\"\
  10\"…>Button1</Button>\n\n</Canvas> \n```\n\n上述代码将 `Button` 定位，使其顶边缘距离 `Canvas`\
  \ 的顶边缘 10 像素，左边缘距离 `Canvas` 的左边缘 10 像素。注意，`Top` 和 `Left` 属性的优先级高于 `Bottom` 和 `Right`。例如，如果你同时指定了\
  \ `Top` 和 `Bottom`，则 `Bottom` 属性将被忽略。\n\n图 14‐4 显示了在 `Canvas` 控件中定位的两个 `Rectangle`\
  \ 控件，且窗口被调整为两种大小。\n\n![截图说明，显示了在 Canvas 控件中定位的两个 Rectangle 控件，窗口被调整为两种大小。](img/Image00176.jpg)\n\
  \n**图 14‐4**\n\n一个 `Rectangle` 相对于左上角定位，另一个相对于右下角定位。当你调整窗口大时，这些相对位置会保持。你还可以看到 `Rectangle`\
  \ 控件堆叠顺序的重要性。右下角的 `Rectangle` 在堆叠顺序中更靠上，因此当它们重叠时，看到的是这个控件。\n\n此示例的代码如下（你可以在下载代码\
  \ `LayoutExamples\\Canvas.xaml` 中找到它）：\n\n```\n <Window x:Class=\"LayoutExamples.Canvas\"\
  \n\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
  \n        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n\n        xmlns_local=\"clr-namespace:LayoutExamples\"\n\n        mc:Ignorable=\"\
  d\"\n\n        Title=\"Canvas\" Height=\"300\" Width=\"300\">\n\n    <Canvas Background=\"\
  AliceBlue\">\n\n        <Rectangle Canvas.Left=\"50\" Canvas.Top=\"50\" Height=\"\
  40\" Width=\"100\"\n\n    Stroke=\"Black\" Fill=\"Chocolate\"/>\n\n        <Rectangle\
  \ Canvas.Right=\"50\" Canvas.Bottom=\"50\" Height=\"40\" Width=\"100\"\n\n    Stroke=\"\
  Black\" Fill=\"Bisque\"/>\n\n    </Canvas>\n\n</Window> \n```\n\n### DockPanel\n\
  \n`DockPanel` 控件顾其实名，允许你将控件停靠在它的边缘。即使你以前没有注意到，这种布局对你来说应该很熟悉，例如 Word 中的 `Ribbon`\
  \ 控件位于顶部，或者 Visual Studio 中的各种窗口是如何定位的。在 Visual Studio 中，你也可以通过拖动来更改窗口的停靠位置。`DockPanel`\
  \ 有一个子控件可以使用指定停靠边缘的属性：`DockPanel.Dock`。你可以将此属性设置为 `Left`、`Top`、`Right` 或 `Bottom`。\n\
  \n`DockPanel` 中的控件堆叠顺序非常重要，因为每次当你将控件停靠到边缘时，都会减少后续子控件可用的空间。例如，你可能将一个工具栏停靠在 `DockPanel`\
  \ 的顶部，然后停在 `DockPanel` 的左侧。第一个控件将跨越整个 `DockPanel` 的顶部，但第二个控件仅从第一个控件底部延伸到 `DockPanel`\
  \ 的底部。你指定的最后一个控件（通常）将填充所有控件定位后剩余的区域。（你可以控制这种行为，这就是为什么这个语句……）当你在 `DockPanel` 中定位控件时，控件占据的区域可能小于\
  \ `DockPanel` 留给控件的区域。例如，如果你停靠一个 `Width` 为 `100`、`Height` 为 `100` 的 `Button`，控件占据的区域可能小于\
  \ `DockPanel` 留给控件的区域。例如，如果你停靠一个 `Width` 为 `100`、`Height` 为 `100` 的 `Button`，控件占据的区域可能小于\
  \ `DockPanel` 留给控件的区域。例如，如果你停靠一个 `Width` 为 `100`、`Height` 为 `100` 的 `Button`，控件占据的区域可能小于\
  \ `DockPanel` 留给控件的区域。例如，如果你停靠一个 `Width` 为 `100`、`Height` 为 `100` 的 `Button`，控件占据的区域可能小于\
  \ `DockPanel` 留给控件的区域。例如，如果你停靠一个 `Width` 为 `100`、`Height` 为 `100` 的 `Button`，控件占据的区域可能小于\
  \ `DockPanel` 留给控件的区域。\n\n\n\n\n\n## 2. 第二个 `Border` 控件也停靠在 `DockPanel` 的顶部，占据了显示区域顶部额外的\
  \ 55 像素。此 `Border` 控件还包含一个 `Width` 属性，这导致边框仅占据 `DockPanel` 宽度的一部分。它被居中对齐，因为 `DockPanel`\
  \ 中 `HorizonalAlignment` 的默认值为 `Center`。\n\n3. 第三个 `Border` 控件停靠在 `DockPanel` 的左侧，占据了显示区域左侧的\
  \ 210 像素。\n\n4. 第四个 `Border` 控件停靠在 `DockPanel` 的底部，占据了 30 像素加上它包含的 `Label` 控件的高度（无论高度是多少）。此高度由\
  \ `Border` 控件的 `Margin`、`Padding` 和内容决定，因为它没有被显式指定。该 `Border` 控件锁定在 `DockPanel`\
  \ 的右下角，因为它的 `HorizontalAlignment` 为 `Right`。\n\n5. 第五个也是最后一个 `Border` 控件填充了剩余空间。\n\
  \n运行此示例并尝试调整内容大小。请注意，在堆叠顺序中越靠上的控件，其空间优先级越高。通过缩小窗口，第五个 `Border` 控件可能会被堆叠顺序中更靠上的控件完全遮挡。在使用\
  \ `DockPanel` 控件布局时要小心避免这种情况，或许可以通过为窗口设置最小尺寸。\n\n### StackPanel\n\n你可以将 `StackPanel`\
  \ 视为 `DockPanel` 的精简版本，其中子控件停靠的边缘对于这些控件是固定的。这些控件之间的另一个区别是，`StackPanel` 的最后一个控件不会填充剩余空间。然而，默认情况下，控件会拉伸到\
  \ `StackPanel` 控件的边缘。\n\n控件堆叠的方向由三个属性决定。`Orientation` 可以设置为 `Horizontal` 或 `Vertical`，并可以使用\
  \ `HorizontalAlignment` 和 `VerticalAlignment` 来确定堆叠控件是放置在 `StackPanel` 的顶部、底部、左侧还是右边缘。你甚至可以使用你使用的对齐属性的\
  \ `Center` 值，让堆叠的控件在 `StackPanel` 的中心堆叠。\n\n图 14‐6 显示了两个 `StackPanel` 控件，每个都包含三个按钮。顶部的\
  \ `StackPanel` 的 `Orientation` 属性设置为 `Horizontal`，底部的一个 `Orientation` 设置为 `Vertical`。\n\
  \n![截图说明，显示了两个 StackPanel 控件，每个都包含三个按钮，窗口已调整为两种大小。](img/Image00178.jpg)\n\n图 14‐6\n\
  \n此处使用的代码如下（你可以在下载的代码 `LayoutExamples\\StackPanels.xaml` 中找到它）：\n\n```\n <Window\
  \ x:Class=\"LayoutExamples.StackPanels\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns_local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"StackPanels\" Height=\"300\" Width=\"300\">\n    <Grid>\n \
  \       <StackPanel HorizontalAlignment=\"Left\" Height=\"128\" VerticalAlignment=\"\
  Top\"\n                Width=\"284\" Orientation=\"Horizontal\">\n            <Button\
  \ Content=\"Button\" Height=\"128\" VerticalAlignment=\"Top\"\n                \
  \    Width=\"75\"/>\n            <Button Content=\"Button\" Height=\"128\" VerticalAlignment=\"\
  Top\"\n                    Width=\"75\"/>\n            <Button Content=\"Button\"\
  \ Height=\"128\" VerticalAlignment=\"Top\"\n                    Width=\"75\"/>\n\
  \        </StackPanel>\n        <StackPanel HorizontalAlignment=\"Left\" Height=\"\
  128\" VerticalAlignment=\"Top\"\n                Width=\"284\" Margin=\"0,128,0,0\"\
  \ Orientation=\"Vertical\">\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n        </StackPanel>\n    </Grid>\n</Window> \n```\n\n\
  ### WrapPanel\n\n`WrapPanel` 本质上是 `StackPanel` 的扩展版本；“放不下”的控件会被移动到额外的行（或列）。图 14‐7\
  \ 显示了一个包含多个形状的 `WrapPanel` 控件，且窗口已调整为两种大小。\n\n![截图说明，显示了包含多个形状的 WrapPanel 控件，窗口已调整为两种大小。](img/Image00179.jpg)\n\
  \n图 14‐7\n\n实现此效果的代码显示在此处（你可以在下载的代码 `LayoutExamples\\WrapPanel.xaml` 中找到它）：\n\n\
  ```\n <Window x:Class=\"LayoutExamples.WrapPanel\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns_x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns_d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns_mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns_local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"WrapPanel\" Height=\"92\" Width=\"260\">\n    <WrapPanel Background=\"\
  AliceBlue\">\n        <Rectangle Fill=\"#000000\" Height=\"50\" Width=\"50\"/>\n\
  \        <Rectangle Fill=\"#111111\" Height=\"50\" Width=\"50\"/>\n        <Rectangle\
  \ Fill=\"#222222\" Height=\"50\" Width=\"50\"/>\n        <Rectangle Fill=\"#FFFF\"\
  \ Height=\"50\" Width=\"50\"/>\n    </WrapPanel>\n</Window>\n```\n\n`WrapPanel`\
  \ 控件是创建动态布局的好方法。\n\n### Grid\n\n`Grid` 控件可以具有多个行和列用于布局子控件。在本章中你多次使用了 `Grid` 控件，但在所有情况下你使用的都是单行单列的\
  \ `Grid`。要添加更多行和列，你必须使用 `RowDefinitions` 和 `ColumnDefinitions` 属性，它们分别是 `RowDefinition`\
  \ 和 `ColumnDefinition` 对象的集合，并使用属性元素指定：\n\n```\n <Grid>\n  <Grid.RowDefinitions>\n\
  \    <RowDefinition/>\n    <RowDefinition/>\n  </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n\
  \    <ColumnDefinition/>\n    <ColumnDefinition/>\n  </Grid.ColumnDefinitions>\n\
  \ …\n</Grid>\n```\n\n此代码定义了一个具有两行两列的 `Grid` 控件。注意这里不需要额外信息；使用此代码，每行和每列都会随着 `Grid`\
  \ 控件的大小动态调整。每行将占据高度的三分之一，每列将占据宽度的一半。你可以通过将 `Grid.ShowGridlines` 属性设置为 `true` 来显示\
  \ `Grid` 单元之间的线条。\n\n你可以使用 `Width`、`Height`、`MinWidth`、`MaxWidth`、`MinHeight` 和\
  \ `MaxHeight` 属性来控制调整。例如，设置列的 `Width` 属性可以确保列保持该宽度。你也可以将列的 `Width` 属性设置为 `*`，这意味着“在计算出所有列的宽度后填充剩余空间”。这实际上是默认值。当你有多个\
  \ `Width` 为 `*` 的列时，剩余将在它们之间平均分配。`*` 值也可以用于行的 `Height` 属性。`Height` 和 `Width` 的另一个可能值是\
  \ `Auto`，它根据内容对行或列进行调整。你还可以使用 `GridSplitter` 控件允许用户通过点击和拖拽来自定义行和列的尺寸。\n\n\n\n\n\
  `Grid` 控件的控件可以使用附加的 `Grid.Column` 和 `Grid.Row` 属性来指定它们所在的单元格。这两个属性的默认值均为 `0`，因此如果你省略了它们，子控件将放置在左角的单元格中。子控件还可以使用\
  \ `Grid.ColumnSpan` 和 `Grid.RowSpan` 跨越表格中的多个单元格，其中左上单元格由 `Grid.Column` 和 `Grid.Row`\
  \ 指定。\n\n在接下来的“尝试”（Try It Out）中，你将使用 `Grid` 的属性来创建行和列，并使用 `GridSplitter` 在运行时更改这些属性。\n\
  \n# 游戏客户端\n\n现在你已经了解了使用 WPF 和 Visual Studio 的基础知识，是时候开始使用控件来创建一些实用的东西了。本章的剩余部分和第\
  \ 15 章 将专门用于你在之前的几个章节中开发的卡牌游戏编写一个游戏客户端。你将使用很多控件，甚至还会自己编写一个。\n\n在本章中，你将编写游戏所需的辅助性对话框——这包括“关于”（About）、“选项”（Options）和“新游戏”（New\
  \ Game）窗口。\n\n## 关于窗口\n\n“关于”窗口，或者有时被称为“关于框”，用于显示应用程序开发者以及应用程序本身的信息。某些“关于”窗口是非常复杂的，例如\
  \ Microsoft Office 应用程序和 Visual Studio 中的窗口，它们会显示版本和许可信息。“关于”窗口通常可以通过“帮助”菜单访问，那里通常是列表中的最后一项。\n\
  \n图 14-9 显示了你即将创建的完成对话框的截图。\n\n![即将创建的完成对话框截图插图](img/Image00181.jpg)\n\n图 14-9\n\
  \n### 设计用户界面\n\n“关于”窗口不是用户会经常看到的东西。事实上，它通常位于“帮助”菜单的原因是，当用户需要查找应用程序版本信息或在出现问题时知道联系谁时，经常会使用它。但这意味着用户访问它是有特定目的的，如果你在你的应用程序中包含了这样的窗口，你应该视其为重要。\n\
  \n每当你设计应用程序时，都应该努力保持外观和感受尽可能一致。这意味着你应该坚持使用几种精选颜色，并在应用程序的处处使用相同的控件样式。在 Karli Cards\
  \ 的案例中，你将使用三种主颜色——红、黑、白。\n\n如果你查看图 14-9，你会发现窗口的左上角被一个 Wrox Press 标志占据。你之前没有使用过图像，但为你的应用程序添加几张精选图像可以使用户界面看起来更专业。\n\
  \n### Image 控件\n\n`Image` 是一个非常简单的控件，可以产生极佳的效果。它允许你显示单张图像并根据需要调整此图像的大小。该控件暴露了两个属性，如表\
  \ 14-3 所示。\n\n| **属性** | **描述** |\n| --- | --- |\n| `Source` | 使用此属性指定图像的位置。可以是磁盘上的位置，也可以是网络上的某个处。正如你在第\
  \ 15 章中看到的，创建静态资源并将其作为源也是可能的。 |\n| `Stretch` | 实际上，一个大小完全符合你要求的图像非常罕见，有时随着应用程序窗口的调整，图像的大小必须改变。你可以使用此属性来控制图像的行为。有四种可能性：`None`——图像不调整大小。`Fill`——图像调整大小以填充整个空间。这可能会导致图像变形。`Uniform`——图像保持其宽高比，如果填充可用空间会改变宽高比，则不填充。`UniformToFill`——图像保持其宽高比并填充可用空间。如果保持比例意味着图像的部分对于可用空间来说过大，则图像将被裁剪以适应。\
