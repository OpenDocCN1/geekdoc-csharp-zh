  \n## ![image](img/Image00002.gif) 本章所学\n\n| **主题** | **核心概念** |\n| --- | --- |\n\
  | 使用数据库 | 数据库是持久的、结构化的数据存储库。虽然有许多类型的数据库，但用于业务数据最常见的类型是关系型数据库。 |\n| Entity Framework\
  \ | `Entity Framework` 是一组 `.NET` 类，用于 C# 对象与关系型数据库之间的对像-关系映射。 |\n| 如何使用 Code First\
  \ 创建数据 | 通过使用 `Entity Framework` 中的 `Code First` 类，你可以通过对象-关系映射直接从 C# 类和集合创建数据库。\
  \ |\n| 如何在数据库上使用 LINQ | `LINQ to Entities` 允许使用用于创建数据的相同 `Entity Framework` 类对数据库进行强大的查询。\
  \ |\n| 如何导航数据库关系 | `Entity Framework` 允许通过在 C# 代码中使用虚拟属性和集合，在数据库中创建和导航相关实体。 |\n\
  | 如何从数据库创建和查询 XML | 你可以通过在单个查询中结合 `LINQ to Entities`、`LINQ to Objects` 和 `LINQ to\
  \ XML` 来从数据库构建 `XML`。 |\n\n# 第五部分\n\n其他技术\n\n* 第 24 章：Windows 通信框架\n* 第 25 章：通用应用\n\
  \n# 24\n\nWindows 通信框架\n\n## 什么是 WCF？\n\nWCF 是一项技术，允许你创建可以可以跨越进程、机器和网络边界从其他应用程序访问的服务。你可以使用这些服务在多个应用程序之间共享功能、暴露数据源或抽象复杂的过程。\n\
  \nWCF 服务提供的功能被封装为由服务暴露的单个方法。每个方法——或者在 WCF 术语中称为每个 *operation*（操作）——都有一个用于与你交换数据的\
  \ `endpoint`（端点）。这种数据交换可以由一个或多个协议定义，取决于你用于连接到服务的网络以及你的特定需求。\n\n在 WCF 中，一个 `endpoint`\
  \ 可以有多个 *bindings*（绑定），每种绑定都指定了某种通信方式。`Bindings` 还可以指定附加信息，例如与 `endpoint` 通信必须满足哪些安全要求。例如，`binding`\
  \ 可能需要用户名和密码身份验证或 Windows 用户帐户令牌。当你连接到 `endpoint` 时，`binding` 使用的协议可能会影响你使用的地址，这一点稍后可见。\n\
  \n## WCF 概念\n\n本节详细描述了 WCF 的以下方面：\n\n* WCF 通信协议\n* 地址、端点和绑定\n* 合约\n* 消息模式\n* 行为\n\
  * 托管\n\n### WCF 通信协议\n\n正如前面所述，你可以通过各种传输协议与 WCF 服务通信。事实上，.NET 4.7 框架定义了五种：\n\n*\
  \ **HTTP** —允许你从任何地方（包括互联网）访问 WCF 服务。你可以使用 HTTP 通信创建 WCF Web 服务。\n\n\n\n\n\n- `TCP`\
  \ —如果你正确配置了防火墙，它可以允许你通过本地网络或跨互联网与 WCF 服务进行通信。`TCP` 比 `HTTP` 更高效且具有更多功能，但配置起来可能更复杂。\n\
  - `UDP` —用户数据报协议与 `TCP` 类似，都允许通过本地网络或互联网进行通信，但其实现方式略有不同。这种实现产生的结果之一是服务可以同时向多个客户端广播消息。\n\
  - `Named pipe`（命名管道）—允许你与调用代码在同一台机器上但位于单独进程中的 WCF 服务进行通信。\n- `MSMQ` —微软消息队列是一种队列技术，它允许应用程序发送的消息通过队列进行路由并到达目的地。`MSMQ`\
  \ 是一种可靠的消息传递技术，它能确保发送到队列的消息能够到达该队列。`MSMQ` 本质上是异步的，因此只有当队列中排前面的消息被处理并且有可用的处理服务时，队列中的消息才会被处理。\n\
  \n这些协议通常能够允许你建立安全连接。例如，你可以使用 `HTTPS` 协议在跨互联网上建立 TLS 连接。`TCP` 通过使用 Windows 安全框架为本地网络的安全提供了广泛的可能。`UDP`\
  \ 不支持安全性。\n\n为了连接到 WCF 服务，你必须知道它在哪里。在实践中，这意味着需要知道端点的地址。\n\n### 地址、端点和绑定\n\n你为服务使用的地址类型取决于你所使用的协议。服务地址的格式化方式对于本章中描述的三种协议（不涵盖\
  \ `MSMQ`）如下格式如下：\n\n- `HTTP` —`HTTP` 协议的地址是常见形式 `http://<server>:<port>/<service>`\
  \ 的 URL。对于 TLS 连接，你也可以使用 `https://<server>:<port>/<service>`。如果你在 IIS 中托管服务，`<service>`\
  \ 将是一个带有 `.svc` 扩展的文件。IIS 地址可能会包含比此示例更多的子目录——即在 `.svc` 文件之前有更多由 `/` 字符分隔的节段。\n-\
  \ `TCP` —`TCP` 地址格式为 `net.tcp://<server>:<port>/<service>` 形式。\n- `UDP` —`UDP` 地址格式为\
  \ `soap.udp://<server>:<port>/<service>` 形式。多组播通信需要特定的 `<server>` 值，但这超出了本章的范围。\n\
  - `Named pipe` —命名管道连接的地址与之类似，但没有端口号。它们的格式为 `net.pipe://<server>/<service>` 形式。\n\
  \n服务的地址是一个基地址，你可以用它创建表示操作的端点的地址。例如，你可能有一个位于 `net.tcp://<server>:<port>/<service>/operation1`\
  \ 的操作。\n\n假设你创建了一个只有一个操作的 WCF 服务，该操作对此处列出的所有三种协议都具有绑定。你可能会使用以下基地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc\n\
  net.tcp://myhugeserver:8080/mygreatservice\nnet.pipe://localhost/mygreatservice\
  \ \n```\n\n然后你可以对操作使用以下地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc/greatop\n\
  net.tcp://myhugeserver:8080/mygreatservice/greatop\nnet.pipe://localhost/mygreatservice/greatop\
  \ \n```\n\n自 `.NET` 4 以来，已经可以为操作使用默认端点，而无需显式配置它们。这简化了配置，特别是当你想要使用标准端点地址时（如前面的示例所示）。\n\
  \n如前所述，绑定指定的不仅是操作将要使用的传输协议。你还可以使用它们来指定通过传输协议进行通信的安全性要求、端点的事务能力、消息编码以及许多等许多内容。\n\n\
  由于绑定提供了如此大的灵活性，`.NET` 框架提供了一些你可以使用的预定义绑定。你也可以将这些绑定作为起点，对它们进行微调以获得你完全需要的绑定类型——这在一定程度上可行。预定义绑定具有你必须遵守的某些功能。每种绑定类型由\
  \ `System.ServiceModel` 命名空间中的一个类表示。表 24-1 列出了最常用的绑定以及关于它们的一些基本信息。\n\n| 绑定 | 描述\
  \ |\n| --- | --- |\n| `BasicHttpBinding` | 最简单的 HTTP 绑定，也是 Web 服务使用的默认绑定。它具有有限的安全能力且不支持事务。\
  \ |\n| `WSHttpBinding` | 一种更高级的 HTTP 绑定，能够使用 WSE 中引入的所有额外功能。 |\n| `WSDualHttpBinding`\
  \ | 扩展了 `WSHttpBinding` 的功能，包含双向通信能力。通过双向通信，服务器除了普通的消息交换外，还可以与客户端发起通信。 |\n| `WSFederationHttpBinding`\
  \ | 扩展了 `WSHttpBinding` 的功能，包含联邦能力。联邦允许第三方实现单点登录和其他专有的安全措施。这是一个本章未涵盖的高级主题。 |\n|\
  \ `NetTcpBinding` | 用于 TCP 通信，并允许你配置安全、事务等。 |\n| `NetNamedPipeBinding` | 用于命名管道通信，并允许你配置安全、事务等。\
  \ |\n| `NetMsmqBinding` | 用于 MSMQ，本章未涵盖。 |\n| `NetPeerTcpBinding` | 用于点对点绑定，本章未涵盖。\
  \ |\n| `WebHttpBinding` | 用于使用 HTTP 请求而非 SOAP 消息的 Web 服务。 |\n| `UdpBinding` | 允许绑定到\
  \ UDP 协议。 |\n\n表 24-1 绑定类型 许多绑定类具有类似的属性，你可以使用这些属性进行配置。例如，它们具有可以用于配置超时值的属性。你将在稍后查看代码时了解更多信息。\n\
  \n端点根据所使用的协议具有不同的默认绑定。这些默认值所示 表 24-2 中。\n\n| 协议 | 默认绑定 |\n| --- | --- |\n| HTTP\
  \ | `BasicHttpBinding` |\n| TCP | `NetTcpBinding` |\n| UDP | `UdpBinding` |\n| 命名管道\
  \ | `NetNamedPipeBinding` |\n\n表 24-2 NET 默认绑定\n\n### 合约\n\n合约定义了如何使用 WCF 服务。可以定义多种合约：\n\
  \n- **服务合约**—包含有关服务及其暴露的操作的通用信息。这包括服务使用的命名空间。服务具有唯一的命名空间，在定义 SOAP 消息方案时使用这些命名空间，以避免与其他服务的可能冲突。\n\
  - **操作合约**—定义了如何使用操作。这包括操作方法的参数类型和返回类型，以及附加信息，例如方法是否会返回响应消息。\n- **消息合约**—允许你自定义信息在\
  \ SOAP 消息内部的格式化——例如，数据应该包含在 SOAP 头中还是 SOAP 正文中。这在创建必须与遗留系统集成的 WCF 服务时非常有用。\n- **故障合约**—定义了操作可以返回的故障。当你使用\
  \ .NET 客户端时，故障会导致异常，你可以以正常方式捕获并处理这些异常。\n\n\n\n\n## **数据契约** —如果你将复杂类型（例如用户定义的结构和对象）作为操作的参数或返回类型，那么你必须为这些类型定义数据契约。数据契约根据类型通过属性暴露的数据来定义类型。\n\
  \n你通常会通过特性（attributes）为服务类和方法添加契约，你将在本章稍后的部分看到。\n\n## 消息模式\n\n在上一节中，你已经看到操作契约可以定义操作是否返回结果。你还读过通过\
  \ `WSDualHttpBinding` 绑定实现的双工通信。这两种都是消息模式的形式，总共有三种类型：\n\n*   **请求/响应消息** — 交换消息的“普通”方式，发送到服务的每条消息都会向客户端返回一个响应。这并不意味着客户端必须等待响应，因为你可以按照通常的方式异步调用操作。\n\
  *   **单向（或单工）消息** — 消息从客户端发送到 WCF 操作，但不会发送任何响应。\n*   **双向（或双工）消息** — 一种更高级方案，其中客户端实际上既当服务器又当客户端，服务器也既当客户端又当服务器。一旦设置好，双工消息允许客户端和服务器互相发送消息，这些消息可能没有响应。\n\
  \n你将在本章稍后看到这些消息模式在实践中是如何使用的。\n\n## 行为（Behaviors）\n\n行为为服务和操作应用额外配置的方法。通过向服务添加行为，你可以控制托管进程如何实例化和使用它、它如何参与事务、服务中如何处理多线程问题等。操作行为可以控制在操作执行期间是否使用身份模拟（impersonation）、单个操作如何影响事务等。\n\
  \n你可以在各个层级指定默认行为，这样你就不需要为每个服务和操作指定每个行为的每个方面。相反，你可以提供默认值并在必要时覆盖设置，从而减少所需配置的量。\n\n\
  ## 托管\n\n在本章的引言中，你学习了 WCF 服务可以托管在几种不同的进程中。你的选项如下：\n\n*   **Web 服务器** — IIS 托管的 WCF\
  \ 服务是 WCF 提供的最接近纯 Web 服务。然而，你可以在 WCF 服务中使用高级功能和安全特性，这些特性在 Web 服务中实现困难得多。你还可以与 IIS\
  \ 特性（如 IIS 安全）进行集成。\n*   **可执行文件** — 你可以在 .NET 中创建的任何应用程序类型中托管 WCF 服务，例如控制台应用程序、Windows\
  \ Forms 应用程序和 WPF 应用程序。\n*   **Windows 服务** — 你可以在 Windows 服务中托管 WCF 服务，并利用 Windows\
  \ 服务提供的有用功能，例如自动启动和故障恢复。\n*   **Windows 激活服务 (WAS)** — WAS 专为托管 WCF 服务而设计，它基本上是\
  \ IIS 的简化版本，在无法使用 IIS 的地方可以使用它。\n\n上述列表中的两个选项（IIS 和 WAS）为 WCF 服务提供了有用的功能，如激活、进程回收和对象池。如果你使用另外两个托管选项之一，则\
  \ WCF 服务被称为`自托管`（`self‐hosted`）。你有时会为了测试目的而自托管服务，但创建自托管的生产级服务也有充分的理由。例如，你可能处于这样的情况：不允许允许在运行服务的计算机上安装\
  \ Web 服务器。如果服务运行在域控制器上，或者你组织的本地策略简单地禁止运行 IIS，可能会出现这种情况。在这种情况下，你可以将服务托管在 Windows\
  \ 服务中，它的效果与其他情况下完全一样。\n\n## WCF 编程\n\n现在你已经涵盖了所有基础知识，是时候开始编写代码了。在本节中，你将从查看一个简单的\
  \ Web 服务器托管的 WCF 服务和一个控制台应用程序客户端开始。在查看创建的代码结构后，你将学习 WCF 服务和客户端应用程序的基本结构。然后你将更详细地查看一些关键主题：\n\
  \n*   定义 WCF 服务契约\n*   自托管 WCF 服务\n\n在接下来的“尝试一下”（Try It Out）中，你将创建一个简单的 WCF 服务，它暴露两个方法以及一个使用这些方法的客户端。\n\
  \n## WCF 测试客户端\n\n在之前的“尝试一下”中，你同时创建了服务和客户端，以观察基本 WCF 架构如何工作以及如何实现 WCF 服务的配置。但在实践中，你想使用的客户端应用程序可能是复杂的，且正确测试服务可能会很困难。\n\
  \n为了方便开发 WCF 服务，Visual Studio 提供了一个你可以使用的测试工具，以确保你的 WCF 操作正常运行。该工具会自动配置为与你的 WCF\
  \ 服务项目配合，因此当你运行项目时，该工具就会出现。你只需要确保要测试的服务（即 `.svc` 文件）被设置为 WCF 服务项目的启动页即可。\n\n该工具允许你调用服务操作并以其他方式检查服务。接下来的“尝试一下”说明了这一点。\n\
  \n## 定义 WCF 服务契约\n\n之前的示例展示了 WCF 基础结构如何通过类、接口和特性的组合，方便你为 WCF 服务定义契约。本节将深入探讨这种技术。\n\
  \n### 数据契约\n\n要为服务定义数据契约，你需要在类定义上应用 `DataContractAttribute` 特性。该特性位于 `System.Runtime.Serialization`\
  \ 命名空间。你可以使用`表 24‐3`所示的属性来配置此特性。\n\n| **属性** | **描述** |\n| :--- | :--- |\n| `Name`\
  \ | 使用与类不同的名称为数据契约命名。此名称将用于 SOAP 消息和从元数据定义的客户端数据对象。 |\n| `Namespace` | 定义数据契约在 SOAP\
  \ 消息使用的命名空间。 |\n| `IsReference` | 影响对象的序列化方式。如果设置为 `true`，则如果对象被多次引用，则只序列化一次，这在某些情况下非常重要。默认值为\
  \ `false`。 |\n\n数据契约的每个类成员都必须使用 `DataMemberAttribute` 特性，该特性也位于 `System.Runtime.Serialization`\
  \ 命名空间中。\n\n| **属性** | **描述** |\n| :--- | :--- |\n| `Name` | 指定序列化时数据成员的名称（默认值为成员名称）。\
  \ |\n| `IsRequired` | 指定该成员是否必须出现在 SOAP 消息中。 |\n| `Order` | `int` 值，用于指定序列化或反序列化成员的顺序，如果一个成员必须在另一个成员之前存在，则可能是必要的。`Order`\
  \ 较小的成员先被处理。 |\n| `EmitDefaultValue` | 将此设置为 `false`，可以防止在成员的值为成员默认值时将其包含在 SOAP\
  \ 消息中。 |\n\n\n\n\n服务约是通过在接口定义上应用 `System.ServiceModel.ServiceContractAttribute`\
  \ 属性来定义的。你可以通过表 24-5 所示的属性来自定义服务约。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Name` | 指定在\
  \ WSDL 的 `<portType>` 元素定义的服务约名称。 |\n| `Namespace` | 定义 WSDL 中 `<portType>` 元素所使用的服务约命名空间。\
  \ |\n| `ConfigurationName` | 配置文件中服务约名称。 |\n| `HasProtectionLevel` | 确定服务使用的消息是否显式定义了保护级别。保护级别允许你对消息进行签名，或进行签名和加密。\
  \ |\n| `ProtectionLevel` | 用于消息保护的保护保护级别。 |\n| `SessionMode` | 决定是否为消息启用会话。如果你使用会话，则可以确保发送到服务的不同端点的消息是关联的——也就是说它们使用同一个服务实例，因此可以共享状态等。\
  \ |\n| `CallbackContract` | 对于双工消息，客户端像服务一样暴露一个约。这是因为如前所述，双工通信中的客户端也充当服务器。此属性允许你指定客户端使用的约。\
  \ |\n\n**表 24-5 : ServiceContractAttribute 属性**\n\n### 操作约约\n\n在定义服务约的接口内部，你通过应用\
  \ `System.ServiceModel.OperationContractAttribute` 属性将成员定义为操作。该属性具有表 24-6 中描述的属性。\n\
  \n| 属性 | 描述 |\n| --- | --- |\n| `Name` | 指定服务操作的名称。默认值是成员名称。 |\n| `IsOneWay` | 指定操作是否返回响应。如果你将其设置为\
  \ `true`，则客户端在继续之前不会等待操作完成。 |\n| `AsyncPattern` | 如果设置为 `true`，则操作被实现为两个方法，你可以使用这两个方法来异步调用操作：`Begin<methodName>()`\
  \ 和 `End<methodName>()`。 |\n| `HasProtectionLevel` | 参见上一节。 |\n| `ProtectionLevel`\
  \ | 参见上一节。 |\n| `IsInitiating` | 如果使用了会话，此属性决定调用此操作是否可以启动新会话。 |\n| `IsTerminating`\
  \ | 如果使用了会话，此属性决定调用此操作是否会终止当前会话。 |\n| `Action` | 如果你使用寻（WCF 服务的高级功能），则操作有一个关联的操作名称，你可以通过此属性指定该名称。\
  \ |\n| `ReplyAction` | 与 `Action` 类似，但指定操作响应的名称。 |\n\n**表 24-6 : OperationContractAttribute\
  \ 属性**\n\n### 消息约\n\n早期的示例没有使用消息约规范。如果你使用这些规范，则通过定义一个表示消息的类并在该类上应用 `MessageContractAttribute`\
  \ 属性来实现。然后，你对该类的成员应用 `MessageBodyMemberAttribute`、`MessageHeaderAttribute` 或 `MessageHeaderArrayAttribute`\
  \ 属性。所有这些属性都在 `System.ServiceModel` 命名空间下。除非你需要对 WCF 服务使用的 SOAP 消息进行极高程度的控制，否则你可能不想这样做，因此此处不提供细节。\n\
  \n### 故障约\n\n如果你有一个特定的异常类型（例如自定义异常）并希望它对客户端应用程序可用，那么你可以在可能生成此异常的操作上应用 `System.ServiceModel.FaultContractAttribute`\
  \ 属性。\n\n### 自托管 WCF 服务\n\n到本章目前为止，你已经看到了托管在 Web 服务器中的 WCF 服务。这使你能够跨越互联网进行通信，但对于本地网络通信，这并不是最有效的方法。首先，你需要在托管服务的计算机上有一个\
  \ Web 服务器。此外，你应用程序的架构可能导致拥有独立的 WCF 服务并不理想。\n\n相反，你可能想要使用自托管 WCF 服务。自托管 WCF 服务存在于你创建的进程中，而不是专门的托管应用程序（如\
  \ Web 服务器）的进程中。这意味着例如你可以使用控制台应用程序或 Windows 应用程序来托管你的服务。\n\n要自托管 WCF 服务，你需要使用 `System.ServiceModel.ServiceHost`\
  \ 类。你通过要托管的服务类型或服务类的实例来实例化此类。你可以通过属性或方法配置服务主机，或者（这是最巧妙的部分）通过配置文件。事实上，主机进程（如 Web\
  \ 服务器）使用 `ServiceHost` 实例来执行托管。自托管时的区别在于你直接与此类交互。然而，你放在主机应用程序的 `app.config` 文件的\
  \ `<system.serviceModel>` 部分的配置，与你已经在本章中见过的配置部分使用完全相同的语法。 |\n\n你可以通过你喜欢的任何协议暴露自托管服务。如果你想托管一个名为\
  \ `MyService` 的服务，可以使用代码创建 `ServiceHost` 实例：\n\n```\nServiceHost host = new ServiceHost(typeof(MyService));\n\
  ```\n\n如果你想托管一个名为 `myService` 的 `MyService` 实例，可以使用以下代码：\n\n```\nMyService myService\
  \ = new MyService();\nServiceHost host = new ServiceHost(myService);\n```\n\n创建\
  \ `ServiceHost` 实例后，你可以通过属性配置服务及其绑定。或者，如果你将配置放在 `.config` 文件中，`ServiceHost` 将自动进行配置。\n\
  \n在使用配置好的 `ServiceHost` 实例后，使用 `ServiceHost.Open()` 方法开始托管服务。同样，通过 `ServiceHost.Close()`\
  \ 方法停止托管服务。当你首次托管 TCP 绑定服务时，如果启用了防火墙，可能会收到 Windows 防火墙的警告，因为它会阻止 TCP 端口。你必须开放 TCP\
  \ 端口以便服务开始监听。\n\n在接下来的尝试中，你将使用自托管技术暴露 WPF 应用程序的一些功能。\n\n## 练习\n\n1. 24.1 下列哪些可以托管\
  \ WCF 服务？\n   - Web 应用程序\n   - Windows Forms 应用程序\n   - Windows 服务\n   - COM+ 应用程序\n\
  \   - 控制台应用程序\n\n2. 24.2 如果你想与 WCF 服务交换类型为类的类型的参数，你应该实现哪种约？你需要哪些属性？\n\n3. 24.3 如果你在\
  \ Web 应用程序中托管 WCF 服务，服务的基端点将使用什么扩展名？\n\n4. 24.4 自托管 WCF 服务时，你必须通过设置 `ServiceHost`\
  \ 类的属性和调用方法来配置服务。错误？\n\n5. 24.5 为服务约 `IMusicPlayer` 提供代码，其中包含 `Play()`、`Stop()`\
  \ 和 `GetTrackInformation()` 操作。在适当的地方使用单向方法。为了让此服务工作，你可能还会定义哪些约？\n\n\n\n练习题的答案可以在附录中找到。\n\
  \n## 本章所学知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| WCF 基础 | WCF 提供了一个用于创建和与远程服务的框架。它结合了\
  \ Web 服务和远程架构的元素，并利用新技术来实现这一目标。 |\n| 通信协议 | 你可以通过多种协议之一（包括 HTTP 和 TCP）与 WCF 服务进行通信。这意味着你可以使用与客户端应用程序本地的服务，也可以使用跨越机器或网络边界的服务。要实现这一点，你通过与所需的协议和功能对应的绑定来访问服务的特定端点。你可以通过行为（behaviors）来控制这些功能，例如使用会话状态或公开元数据。.NET\
  \ 包含了许多默认设置，使得定义简单服务变得非常容易。 |\n| 通信负载 | 通常，对 WCF 服务的调用和响应被编码为 SOAP 消息。不过也有其他替代方案，例如纯\
  \ HTTP 消息，如果你需要，你也可以从头定义自己的负载类型。 |\n| 托管 | WCF 服务可能托管在 IIS 或 Windows 服务中，也可以是自托管。使用\
  \ IIS 等宿主机可以让你利用主机的内置功能，包括安全性和应用程序池。自托管更加灵活，但可能需要更多的配置和编码。 |\n| 契约 | 你通过合约（contracts）定义\
  \ WCF 服务与客户端代码之间的接口。服务本身以及你公开的任何操作都通过服务合约和操作合约定义。数据类型通过数据合约定义。通信的进一步定制通过消息合约和故障合约来实现。\
  \ |\n| 客户端应用程序 | 客户端应用程序通过代理类（proxy class）与 WCF 服务通信。代理类实现了该服务的服务合约接口，对此接口操作方法的任何调用都会重定向到服务。你可以使用\
  \ `Add Service Reference`（添加服务引用）工具生成代理类，也可以通过通道工厂方法通过编程创建一个。为了确保通信成功，客户端必须配置为与服务配置匹配。\
  \ |\n\n# 25 通用应用\n\n## 入门\n\n在编写通用应用之前，需要完成几个初始步骤。在 Visual Studio 的之前的版本中，你需要获得\
  \ Windows 8 开发者许可，并且该许可通常需要经常更新。对于 Windows 10，开发时不再需要它，但你仍然需要一个商店账户来发布应用。在开发应用时，你可以简单地将你的\
  \ Windows 10 设备注册为开发设备。\n\n在开始编写 Windows 通用应用之前，你必须在设备上启用开发功能，除非已安装，否则你必须安装 Universal\
  \ Windows 应用开发工具。\n\n当你在 Visual Studio 中打开解决方案以创建 Windows 通用应用时，可能会收到如图 25-1 所示对话框的启用开发者模式。当你看到此对话框时，点击“开发者设置”链接，选择“开发者模式”选项，然后对你正在选择安全性较低选项的警告点击“是”。\n\
  \n![截图说明，显示了在 Visual Studio 中创建 Windows 通用应用的对话框启用开发者模式的步骤。](img/Image00284.jpg)\n\
  \n图 25-1\n\n你可能没有安装 Universal Windows 应用开发工具。要进行安装，你必须重新运行 Visual Studio Installer。你可以从开始菜单通过输入\
  \ `Visual Studio Installer` 来。当你看到已安装产品列表时，点击“修改”，然后勾选“通用 Windows 平台开发”选项，最后再次点击“修改”以安装所选选项。\n\
  \n## Windows 通用应用\n\n传统的应用程序（如你在本书之前编写的 WPF 桌面游戏）针对的是单一设备类型，例如 PC。随着通用 Windows 平台（UWP）的引入，微软使得编写可以在多个设备上运行的应用程序成为可能，并付出了大量精力使此类应用的开发成为开发者来说的一种愉快的体验。\n\
  \n开发可在大量异构设备上运行的应用程序的主要挑战在于，你无法预知屏幕有多大或用户将如何与设备交互。如果你简单地将书中之前的 Karli Card WPF 应用压缩到平板电脑屏幕尺寸，它看起来会非常糟糕。另一个方面是平板电脑用户期望你的应用能够调整其在屏幕上的方向。在本章中，我们将引入响应式\
  \ UI 和自适应触发器（adaptive triggers）的概念来解决这些问题。\n\n通用应用通过 Windows 商店部署，这为应用打包带来了各自的挑战。为了让你的应用进入商店，你必须经过相当严格的测试过程，并通过微软设置的多项要求。在本章的最后部分，我们将检查这一过程，以便你准备好发布自己的应用。\n\
  \n## 应用概念与设计\n\n应用程序在平板电脑和 Windows 桌面上的显示方式存在巨大差异。自 Windows 95 引入以来，运行在 Windows\
  \ 桌面上的应用程序设计很大程度上没有变化，尽管图形得到了极大提升。其设计特点是一个带有标题栏的窗口，右上角的三个用于最大化、最小化和关闭应用程序的按钮，以及显示内容的按钮、单选按钮、复选框等。随\
  \ Windows 8 引入的应用生成方式略有不同。它们被设计为通过而非鼠标和键盘进行工作，可能也可能没有标题栏，并且可以旋转以适应其运行的设备方向，这只是其中的几点区别。\n\
  \n微软为 UWP 应用发布了一份相当详尽的设计指南，你应该了解这份指南，即使你并不总是要遵守它。尽管应用将运行在多样化的设备上，但它们具有许多你应该注意的共同特征，因此让我们来看看其中的一些特征，并对比一下商店应用与桌面应用的差异。\n\
  \n### 屏幕方向\n\n### 磁贴与徽标\n\n\n\n\nWindows 使用一种被称为 `live tiles`（动态磁贴）的功能在开始菜单和页面上显示应用程序。名称中的“动态”部分源于磁贴可以根据应用程序的当前内容或状态发生变化。例如，你会在开始菜单上看到照片应用轮播你的照片、邮件客户端显示未读邮件数量、游戏显示上次保存的截图等。这种可能性几乎是无尽的。\n\
  \n对于你的应用程序来说，提供一个良好的磁贴比为桌面应用程序提供一个良好的图标更重要，尽管后者也非常重要。磁贴嵌入在应用程序的清单文件（manifest）中，正如你将在本章稍后看到的，使用\
  \ `Visual Studio` 可以很容易地包含它们。\n\n`badge`（徽标）是磁贴的小尺寸版本，Windows 可以在锁定屏幕和其他情况下使用。除非你的应用会在锁定屏幕上显示通知，否则你不需要为应用提供徽标。\n\
  \n### 应用生命周期\n\n经典的 Windows 桌面应用程序可以通过标题栏右上角的按钮来关闭，但通用应用（Universal apps）通常不显示标题栏，那么你该如何关闭它们呢？通常情况下，你不需要关闭应用程序。每当一个通用应用失去焦点时，它就会被挂起并完全停止使用处理器资源。这使得许多应用看起来在同时运行，而实际上它们只是被挂起了。一旦应用失去焦点，Windows\
  \ 就会自动执行挂起操作。作为用户，这并不是你会察觉到的事情，但作为应用开发者，这是一个需要知道并处理的重要事实。\n\n### 锁定屏幕应用\n\n某些应用程序在失去焦点时应该保持运行。这类应用的示例包括\
  \ GPS 导航和音频流媒体应用。用户期望这类应用即使他们开始开车或开始使用其他应用时也能继续运行。如果你的应用需要在后台持续运行，你必须将其声明为锁定屏幕应用，并提供在锁定屏幕上显示通知的信息。\n\
  \n## 应用程序开发\n\n当你开始开发 Windows 通用应用时，在编程和 UI 语言方面你有许多选择。本书使用 `C#` 和 `XAML`，其他可能性还包括使用\
  \ `JavaScript` 和 `HTML5`、`C++` 和 `DirectX` 或 `Visual Basic` 和 `XAML`。\n\n用于创建通用应用用户界面的\
  \ `XAML` 与 `WPF` 使用的 `XAML` 不完全相同，但它们足够接近，让你在操作它时感到自在。你熟悉的许多控件在通用应用中也存在，尽管它们的外观与\
  \ Windows 桌面对应的版本略有不同。还有许多针对触摸优化的控件。\n\n### 自适应显示\n\n自适应显示是指能够根据响应用户操作（例如平板电脑侧放或窗口大小变化）而改变的显示。你的应用应该能够在用户侧放平板电脑时，优雅地从竖屏模式切换到横屏模式，并在所有设备上运行良好且显示正常。\n\
  \n当你创建一个新的 Windows 通用应用项目时，首先会注意到设计器中显示的页面看起来相当小。这是因为该项目默认使用针对 13.5 英  `Surface\
  \ Book` 显示优化的视图。你可以使用图 25-2 中显示的 `Device Preview` 面板进行更改。你还可以使用此面板将布局从竖屏更改为横屏。\n\
  \n![显示 Device Preview 面板布局的截图说明。](img/Image00285.jpg)\n\n**图 25-2**\n\n表现良好的应用程序能够在\
  \ `Device Preview` 面板中显示的许多（如果不是所有）形式良好的良好地显示自己。考虑到列表中的范围从 4 英的物联网（IoT）设备到 84 英的\
  \ `Surface Hub` 不等，这是一项艰巨的任务。幸的是，`Visual Studio` 和 `UWP` 框架将为你提供帮助。当你从下拉菜单更改分辨率（或屏幕尺寸）时，`Visual\
  \ Studio` 会调整你的应用程序的大小，你将立即看到页面的样子。此外，工具箱中还包含了辅助创建应用程序自适应设计的控件，你可以利用它们轻松创建出能够精美转换的\
  \ UI。\n\n#### 相对面板 (Relative Panel)\n\n在第 14 章和第 15 章中，你使用了 `Grid` 和 `StackPanel`\
  \ 控件来在静态显示上运行良好的 UI。但在你必须针对多种显示尺寸的世界里，你想要一个能更好地移动控件的东西。这就是 `RelativePanel` 控件登场了。\n\
  \n相对面板允许你指定控件之间的相对位置方式。正如你所预期的，你可以将控件放置在其他控件的左侧、右侧、上方或下方，你还可以进行一些其他很棒的操作。可以将一个控件相对于另一个控件的左侧、右侧或中心（无论水平还是垂直方向），并将控件的边缘与面板的边缘对齐。这意味着不再需要通过微调像素来让两个控件在显示器上完美对齐。\n\
  \n#### 自适应触发器 (Adaptive Triggers)\n\n自适应触发器是 `Visual State Manager`（视觉状态管理器）中的新特性。使用这些触发器，你可以根据显示器的大小更改应用程序的布局。与相对面板结合时，这是一个非常强大的功能，它以非常直观的方式让你构建出网络世界所说的“响应式\
  \ UI”。在下一个练习中，你将使用 `RelativePanel` 创建一个随窗口大小变化的显示。\n\n#### 翻页视图 (FlipView)\n\n`FlipView`\
  \ 是一种在手持设备上运行良好的的小型控件。它允许用户左右滑动来显示内容。它通常用于一次显示图像，并允许用户使用滑动手在图像之间移动。\n\n默认情况下，`FlipView`\
  \ 允许用户左右滑动来移动内容，但可以更改为上下移动。当使用鼠标时，滚动按钮同样有效。下一个练习将演示如何使用 `FlipView` 显示本地设备图片文件夹的内容。\n\
  \n### 沙箱应用 (Sandboxed Apps)\n\n在此处，值得后退一步，看看 Windows 通用平台 `.NET` 框架的一些局限性。在移动设备上运行的应用对其运行的操作系统访问有限，这意味着某些类型的应用程序是你无法编写的。例如，如果你需要直接访问文件系统以访问系统文件，你必须编写经典的\
  \ Windows 桌面应用程序。当你使用 `C#` 编写通用应用时，你会发现限制在于应用程序引用的 `.NET Framework`，其中常见的命名空间和类完全缺失，或者可用方法比以前更少。如果你打开\
  \ `Visual Studio`，创建一个空白应用，然后展开 `References` 节点，你会发现引用与 Windows 桌面应用非常不同。有一个对 `analyzers`\
  \ 的引用，它们有助于监控应用程序的各个方面：对 `UWP` 的 `.NET Core` 的引用，以及对 Universal Windows 的引用。此时你可能认为可以简单地更改引用使用标准的\
  \ `.NET Framework`，事实上这是可以的。也就是说，它可以一直直到你尝试将应用发布到 Windows 商店，那时它将因为不符合规范而被拒绝。\n\n\
  \n\n\nWindows 通用应用具有沙箱机制，并且它们在进入 Windows 商店之前必须经过一系列流程，这意味着用户很少需要担心通过商店下载到恶意应用。显然，确实有人尝试绕过这一点，因此用户绝不应该掉以警惕；然而，通过\
  \ Windows 商店应用在 Windows 计算机上放置恶意程序，其难度远比通过普通的下载和安装要高得多。\n\n### 磁盘访问\n\n桌面应用程序几乎可以随心所欲地访问磁盘，但也有少数例外。其中一个例外是，它们通常被禁止写入\
  \ `Program Files` 文件夹和其他系统文件夹。Windows 通用应用只能直接访问磁盘上的几个非常特定的位置。这些位置包括应用安装文件夹、与应用关联的\
  \ `AppData` 文件夹，以及如“文档”等几个特殊文件夹。在 `.NET Core Framework` 中，对文件和文件夹的访问也发生了变化，以确保开发者不会意外写入受限的位置。\n\
  \n为了让用户控制文件的存储和读取位置，Windows 为你提供了三个文件选择器（File Picker）合约：`FolderOpenPicker`、`FileOpenPicker`\
  \ 和 `FileSavePicker`。你可以从应用中使用这些选择器类来获得对本地磁盘的安全访问。\n\n正如你之前看到的，你还可以使用 `KnownFolders`\
  \ 类来访问设备上的资源。当你想要读取或写入用户必须授予应用访问权限才能让应用打开的位置时，你应该使用 `KnownFolders` 类。\n\n### 序列化、流与异步编程\n\
  \n在第 14 章中，你使用了 `[Serializable]` 特性来允许类被序列化。UWP 的 .NET Core 不包含此特性，但你可以改用名为 `[DataContract]`\
  \ 的类似特性。`DataContract` 特性与 `DataContractSerializer` 类配合使用，对类的内容进行序列化。为了从磁盘交换序列化内容，你需要使用某些文件访问类型，但与普通的\
  \ .NET 不同，你不能直接创建这些类型。相反，你使用文件选择器创建流对象，并将这些对象配合 `DataContractSerializer` 来保存和加载你的文件。\n\
  \n下一个“尝试一下”（Try It Out）演示了如何使用 `FileOpenPicker` 和 `FileSavePicker` 创建的流配合 `DataContractSerializator`\
  \ 来加载和保存数据模型的 XML 表示。\n\n### 页面间的导航\n\n在应用内页面之间的导航与 Web 应用程序的导航类似。你可以调用 `Navigate`\
  \ 方法从一个页面跳转到另一个页面；可以通过调用 `Back` 方法返回。接下来的“尝试一下”演示了如何使用三个基础页面在应用内进行跳转。\n\n### CommandBar\
  \ 控件\n\n`CommandBar` 为用户提供了与桌面应用程序中工具栏非常相似的功能，但你应该让它们保持简单得多，通常将一个栏目中的可用选项限制在 8 个项目以内。\n\
  \n你可以同时显示多个 `CommandBar`，但请记住，这会弄乱用户界面，你不应该仅仅为了显示更多选项而显示多个栏目。另一方面，如果你想提供多种类型的导航，有时同时显示顶部和底部的栏目是有有益的。\n\
  \nVisual Studio 自带了 `CommandBar` 控件，这使得创建这种控件变得非常容易。接下来的“尝试一下”创建了一个包含若干标准项的应用栏（App\
  \ Bar）。\n\n### 状态管理\n\n与桌面应用不同，应用必须预见到随时会被挂起。这发生在用户切换到另一个应用或返回桌面时，因此这是一个所有应用都必须处理的常见场景。当应用被挂起时，Windows\
  \ 将保存你的变量和数据结构的值，并在应用恢复时恢复它们。然而，你的应用可能被挂起很长一段时间，所以如果你有随时间变化的数据（例如新闻源），那么你应该在应用恢复时刷新这些内容。\n\
  \n当应用被挂起时，你还应该考虑保存任何在应用调用之间需要持久化的数据，因为如果应用随后被 Windows 或用户终止，你将没有机会这样做。\n\n当你的应用即将被挂起时，系统会发送一个\
  \ `Suspending` 事件，你应该处理该事件。当应用“复活”时，它将接收一个 `Resuming` 事件。通过处理这两个事件并保存应用状态，你可以让应用恢复到挂起前的状态，用户应该察觉不到任何异常。\n\
  \n## Windows 商店应用的共同元素\n\n所有 Windows 商店应用都应该提供自己的磁贴（Tiles）和徽章（Badges）。磁贴让能让你的应用在\
  \ Windows 的启动屏幕上存在，并允许你显示有关应用的信息。徽章允许 Windows 在锁界面上显示代表你应用的小图标。\n\n磁贴非常重要，因为用户往往是反复无常的，倾向于根据应用的展示方式来做出决定。此外，磁贴应该是易于识别的；如果你让用户在其他磁贴中寻找一个消失的磁贴，那么当他们最终找到它时，心情可能不会很好。\n\
  \nWindows 商店应用中有许多可能的磁贴尺寸，如果你的应用针对许多不同的显示尺寸，你应该为所有建议的尺寸提供定制磁贴，或者至少提供缩放良好的磁贴。如果你不提供正确尺寸的磁贴，Windows\
  \ 将把你提供的内容缩放到正确尺寸，这通常看起来很很看。因此，对于专业应用，请确保为每种预期的磁贴尺寸定制磁贴。\n\n徽章比磁贴小（24 × 24 像素），用于\
  \ Windows 在锁界面显示应用时。如果你为应用设置了徽章图像，还必须开启锁界面通知。徽章也可以进行缩放，请提供所有合适的尺寸。\n\n启动屏幕（Splash\
  \ screens）在应用加载时显示；由于加载通常只需要几秒钟，它们不应该太复杂或提供任何信息，除非告知哪个应用正在启动。启动屏幕至少为 620 × 300 像素，但你可以通过使部分图像透明来缩小它。再次，应该提供缩放版本。\n\
  \n最后，你应该提供一个恰好为 50 × 50 像素的包图标（Package Logo），以及对应的缩放版本，该图标将在 Windows 商店中显示。\n\n\
  磁贴、徽章和图标嵌入在应用的清单文件中，可以在 Visual Studio 清单编辑器中轻松编辑。如果你下载了本书的代码，可以使用代码中提供的磁贴和徽章（在 `Assets`\
  \ 文件夹中），否则你可以在画图或其他应用程序中快速创建图像。在接下来的“尝试一下”中，你为 Windows 通用应用添加磁贴、图标和启动屏幕图像。\n\n##\
  \ Windows 商店\n\n创建应用后，你可能想将其分发出去，而方法是使用 Windows 商店。微软付出了巨大精力创建一个安全的商店，让 Windows\
  \ 用户从那里下载应用而不必担心下载到恶意代码。遗憾的是，这意味着为了进入商店，你必须忍受长时间的过程。\n\n### 应用打包\n\n当你指定图片查看器访问图片库以及为应用添加磁贴时，已经见过了\
  \ `package.appxmanifest` 文件的部分内容。当你准备好为应用商店打包应用时，必须返回此文件并设置许多其他值。\n\n\n\n\n在打包应用之前，您应该检查六个标签页中的每一个来配置\
  \ `package.appxmanifest`，并考虑您的每一个选项：\n\n*   **应用程序（Application）：** 为您的应用起一个好名字！除了商店图标外，这可能是潜在用户对您的应用看到的第一个内容，因此起一个通用的名称是没有效果的。尝试选择一个既有趣又能指示应用用途的名字。\n\
  *   **视觉资产（Visual Assets）：** 在上一个示例中，您为应用添加了磁贴。您确保“视觉资产”标签页上的每个类别至少有一张图像。\n*   **功能（Capabilities）：**\
  \ 在此标签页上，你可以指定应用所需的各项功能。注意，如果你的应用所需的功能看起来不合理，用户将怀疑地查看你的应用。例如，如果你需要访问设备上的聊天消息，最好有一个充分的理由；否则这可能会被视为对隐私的潜在侵害。大多数应用程序不应超过几个功能，但你必须勾选所有你用到的功能。如果你没有准确指定所需的内容，那么应用程序在尝试访问资源时将收到拒绝访问的异常。\n\
  *   **声明（Declarations）：** 在“声明”标签页上，你可以将应用注册为服务提供者。例如，如果你的应用作为搜索提供者，你可以向应用添加此声明并指定所需的属性。\n\
  *   **内容 URI（Content URIs）：** 如果你的应用导航到远程页面，它对系统的访问将受到限制。你可以使用内容 URI 让网页访问地理设备和剪贴板。\n\
  *   **打包（Packaging）：** 在此标签页上，你可以设置包的属性，包括开发者/发布者名称、应用版本以及用于签名包的证书。\n\n### 创建包\n\
  \n一旦您在 `appxmanifest` 中指定了所需的所有内容，就可以打包您的应用了。你可以直接在 Visual Studio 中操作，选择项目 ![image](img/Image00008.gif)\
  \ 商店 ![image](img/Image00008.gif) 创建应用包。这将启动“创建应用包”向导。在向导的几步之后，你将被要求使用商店账户登录。如果你没有账户，必须创建一个。你必须拥有商店账户才能发布到应用商店并为你的应用获得报酬。\n\
  \n在向导运行的某个点，你将看到“选择并配置包”页面。在此，重要的是选择三个目标架构（`x86`、`x64` 和 `ARM`），以便允许应用部署到最广泛的设备上。\n\
  \n在最后一页，你将获得有关验证应用是否可以提交到应用商店的选项。启动 Windows 应用认证工具并了解你的应用是否准备好提交。如果检测到任何问题，你必须修复它们并重新运行“创建应用包”向导。如果你的应用通过检查，就可以上传包。\n\
  \n## 练习\n\n1. 25.1 扩展 Ch25Ex06 示例，在页面 `BlankPage1` 上添加一个 `WebView` 控件，并使用 `navigate`\
  \ 方法显示你选择的网页。在页面上添加一个事件处理程序，当应用从挂起恢复时，将 `WebView` 导航到另一个网页。\n2. 25.2 如果你想让你的应用作为录音器工作，必须确保应用有权访问设备上的麦克风。如何确保应用在尝试使用设备上的麦克风时不会得到\
  \ `UnauthorizedAccessException`？\n\n练习题的答案可以在附录。\n\n## ![image](img/Image00002.gif)\
  \ 本章学到的知识\n\n| 核心概念 | 描述 |\n| --- | --- |\n| Windows Universal App XAML | Windows\
  \ Universal app XAML 配合 C# 创建 Windows Universal 应用的 GUI。它包含了许多你从 WPF 中熟悉的控件，但其中一些发生了变化，另一些则缺失，并且引入了新的控件。\
  \ |\n| 视觉状态管理器（Visual State manager） | 你学习了如何通过简单更改控件的视觉状态来更改控件和页的外观。这大大减少了代码，换来的是稍微复杂的\
  \ XAML。 |\n| 应用状态（App state） | 当用户切换到另一个应用或桌面时，Windows Universal 应用会被挂起，因此，处理这种挂起状态并在发生时保存应用状态是非常重要的。\
