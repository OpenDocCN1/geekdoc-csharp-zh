    为了创建一个类型为 `Point` 的对象，可以使用如下语句：


    ```cpp

    Point myPoint = new Point();

    ```


    该语句将对象的所有成员（在本例中为 `x` 和 `y`）初始化为值 `0`。这被称为结构体的确定赋值。我们将在本书的后面部分详细讨论结构体。


    ## 引用类型


    引用类型变量不包含数据本身；它实际上包含数据的内存地址。它与 `C++` 中的指针和引用相似，但使用起来要简单得多。


    变量本身存储在栈上（就像值类型变量一样），但它指向存储在堆（heap）的数据。


    注意：堆是内存中存储引用类型变量所指向数据的区域。


    ### C# 引用类型


    以下是 C# 的引用类型：

    - `Class`（类）

    - `Interface`（接口）

    - `Delegate`（委托）

    - `Object`（对象）

    - `String`（字符串）


    可以通过装箱（boxing）将值类型转换为引用类型，通过拆箱（unboxing）将引用类型转换为值类型。


    ## 装箱与拆箱


    装箱操作通过将值类型变量赋值给类型为 `object` 的变量来实现：


    ```cpp

    int myInt = 123;

    object myObj = myInt; // 装箱

    ```


    这意味着将值 `123` 从栈移动到堆，如图所示。


    ![](img/00027.jpeg)

    ![](img/00028.jpeg)


    为了将变量转换回值类型，你需要使用拆箱操作，该操作通过对引用类型变量进行强制转换 `(int)` 来完成。以下语句将 `myObj` 所指向的值赋给一个新的值类型变量
    `yourInt`：


    ```cpp

    yourInt = (int) myObj; // 拆箱

    ```


    该语句创建了一个新的值类型变量，其包含与相同的值 `123`，如图 3-3 所示。


    ![](img/00029.jpeg)


    注意，在拆箱操作中，你可以使用同一个变量 `myInt`，而不是使用第三个变量 `yourInt`。


    注意：当你需要在集合（第 11 章将解释）中使用值类型时，如果集合的项类型为 `object`，则必须进行装箱。拆箱也用于访问对象的值类型内容。


    下面的示例演示了装箱和拆箱。


    ![](img/00030.jpeg)


    在这个示例中，我们在装箱操作期间在原始值上加上了 `321`。重要的是，这并没有改变原始变量 `myInt` 的值，该变量在拆箱操作后仍然包含相同的值。


    然而，变量 `yourInt` 包含了引用变量所指向的值。你可以在示例输出中看到这些值。


    输出：

    ![](img/00031.jpeg)


    虽然引用类型变量的概念与 `C++` 中的指针相同，但引用类型让你省去了处理指针操作的麻烦，特别是删除分配给指针的内存。这些操作在后台由系统为你完成。


    ## 简单数据类型


    下表显示了 C# 的简单数据类型以及每种类型的范围和字节大小。简单类型包括整数（`int`）、浮点型（`float`）、布尔型（`bool`）和字符（`char`）。


    这些类型被称为“简单”类型，是为了区分它们与如 `structs`（结构体）和 `enums`（枚举）等用户定义类型。当然，所有的简单类型都是值类型。


    ![avatar_medium](img/00005.jpeg) ![avatar_medium](img/00005.jpeg) ![avatar_medium](img/00005.jpeg)


    表 3-4：简单数据类型

    ![](img/00032.jpeg)


    注意，不像 `C++` 那样存在从 `char` 类型到任何整数类型的隐式转换。换句话说，`false` 不等于零，且 `true` 也一个非零值。


    以下是在声明中使用简单类型的示例：


    ```cpp

    int myInt;

    char aChar;

    long theLongNumber;

    ```


    如之前提到的，你还可以在声明变量的同时对其进行赋值：


    ```cpp

    byte myBite = 5;

    short myShort = -223;

    char myChar = ''A'';

    ```


    ## 创建和操作算术表达式


    在接下来的章节中，你将学习如何创建和操作算术表达式。你可以通过字面量（数据值）、变量和算术运算符来构建算术表达式。表达式可以赋值给变量。


    ### 3-6-1 基本算术运算符 (+, –, *, /)


    简单的算术表达式是通过使用 `+`、`–`、`*` 和 `/` 等运算符构建的，这些运算符用于加、减、乘、除。


    通常情况下，当评估表达式时，乘法和除法会在加法之前计算，因为它们的优先级更高。考虑以下表达式：


    ```

    6 + 4 * 5

    ```


    在这个表达式中，`4 * 5` 首先计算，然后将其值加到 `6` 上。结果将为 `26`。你可以使用括号来改变操作的优先级：


    ```cpp

    (6 + 4) * 5

    ```


    在这个表达式中，加法首先计算，因为括号的优先级高于其他运算符。加法结果为 `10`，然后乘以 `5`，得到结果 `50`。


    （注：由于提供的原文后续似乎存在乱码或重复占位符，已根据逻辑翻译并清理了算术部分）

