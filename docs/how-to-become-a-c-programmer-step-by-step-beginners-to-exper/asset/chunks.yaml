    Resizing an Array (Array.Resize)


    One of the biggest problems beginners struggle with involves setting the size
    of an array. Does the program need to use a fixed size right at the start? What
    happens if it needs to be made larger? The .NET Framework


    Version 2.0 introduced a solution to this problem by adding the Array.Resize method,
    which is used to change the size of an array. Because the array size is immutable
    (the size cannot be changed at run time), this method actually copies the elements
    of the array to another array and then renames the new array and discards the
    old one.


    This is a generic method, which means it can work with any array type. (Generics
    are explained in detail in Chapter 12.) For example, if you have an array named
    myArray initialized with three elements, you can extend its size to six elements
    by using the following statement:


    Array.Resize<int>(ref myArray, 6);


    In this statement, <int> is the type argument. (The type argument is explained
    in Chapter 12, Section 12-1.) You can also use the following statement to extend
    the size to six:


    Array.Resize (ref myArray, 6);


    In the following example, the sizes of two arrays —an int array and a string array
    — are increased from three to six. When the newly sized arrays are displayed,
    the null elements of the string array are filled with the string “empty.” This
    is done by using the ?? operator.


    yourArray[i] = yourArray[i] ?? "empty";


    ![](images/00093.jpeg)


    ![](images/00094.jpeg)


    The foreach Loop-


    The foreach loop is used with arrays and collections. The topic will be revisited
    after we discuss collections in Chapter 11\. The foreach loop accesses arrays
    in a unique way without using counters.


    The foreach statement takes the form:


    foreach (type identifier in expression) statement(s);


    where:


    type is the data type, such as int or string.


    identifier is the variable name.


    expression is the name of the array (or collection).


    statement(s) is the statement or block of statements to be executed.


    Consider, for example, the following array:             


    int[,] myIntArray = { {1, 3, 5},{2, 4, 6} };


    You can display the elements of this array by using the following statement:


    foreach(int i in myIntArray)


    Console.Write("{0} ", i);


    The result should be:


    1 3 5 2 4 6


    It is important to notice that the number of dimensions doesn’t matter because
    foreach accesses all the elements sequentially. If the array is a one-dimensional
    array like this:


    int[] myIntArray = {1, 3, 5, 2, 4, 6};


    you can still display it by using the same statement. If the array is a string
    array, you need only to change the type from int to string:


    foreach(string i in myIntArray)


    Console.Write("{0} ", i);


    Note -


    The foreach loop can be applied to your custom data structures to do more advanced
    data processing. This will be covered in Chapter 11\.


    In the following example, you create a string array and display it along with
    the rank and number of elements using foreach.


