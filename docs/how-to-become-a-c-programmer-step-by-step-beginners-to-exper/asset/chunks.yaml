  trans: "\n\n当方法返回变量时，`myVariable` 将保留其在 `MyMethod` 中发生的更改。\n\n### 使用 `out`\n\n当\
    \ `out` 关键字作为参数修饰符时，它的作用与 `ref` 关键字相同。它不需要在将变量传递给方法之前进行初始化，但要求在方法内部对变量进行初始化。例如，该方法可能如下所示：\n\
    \n```csharp\nvoid MyMethod(out string myVariable)\n{\n    myVariable = \"This\
    \ is my string\";\n}\n```\n\n要调用此方法，请使用 `out` 关键字：\n\n```csharp\nMyMethod(out\
    \ myVariable);\n```\n\n变量 `myVariable` 可能完全没有初始化。当方法返回给调用者时，它将被赋值为值 `\"This is\
    \ my string\"`。注意，`out` 关键字在方法头和和调用处都被使用了。可以使用多个参数，如本例所示：\n\n```csharp\nvoid YourMethod(out\
    \ int x, out int y, out int z)\n{\n    ...\n}\n```\n\n该方法的调用方式相同：\n\n```csharp\n\
    YourMethod(out m, out n, out l);\n```\n\n**注意**- 仅具有不同的参数修饰符不足以重载方法。方法在所使用的参数类型上也必须有所不同。\n\
    \n在下面的示例中，`out` 关键字用于将一个未初始化的数组传递给方法 `MyMethod`。当方法返回到 `Main` 时，它的元素被初始化。\n\n\
    ![](img/00154.jpeg)\n![](img/00155.jpeg)\n![](img/00156.jpeg)\n\n### 使用 `params`\n\
    \n`params` 关键字用于数组。它允许你向方法传递任意数量的参数，而不需要在数组中声明它们。该关键字仅在方法声明中需要。例如，方法：\n\n```csharp\n\
    static void MyMethod(params object[] myObjArray)\n```\n\n可以这样调用：\n\n```csharp\n\
    MyMethod(123, 'A', \"My original string\");\n```\n\n在此调用中传递的参数类型都是 `object` 类型，这意味着它们可以包含任何继承自\
    \ `object` 类的类型。同样考虑以下方法：\n\n```csharp\nstatic void MyMethod(params int[] myIntArray)\n\
    ```\n\n此方法可以通过传递一组构成整数数组的整数来调用，无论其长度如何，例如：\n\n```csharp\nMyMethod(2, 4, 7);\n\
    ```\n\n任何使用 `params` 关键字的方法都不能使用多个参数。在下面的示例中，演示了在方法声明中使用 `params` 关键字的方法。它还演示了对两个同名但参数不同的方法的重载。\n\
    \n一个方法使用对象数组，第二个方法使用整数数组。两个方法都更改了传递给它们的数组的内容。每个数组的内容在方法内部更改发生前后都会显示。\n\n![](img/00157.jpeg)\n\
    ![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg)\n\
    ![](img/00158.jpeg)\n![](img/00159.jpeg)\n![](img/00160.jpeg)\n![](img/00161.jpeg)\n\
    ![](img/00162.jpeg)\n\n### 索引器 (Indexers)\n\n使用索引器，你可以将类视为数组或集合；也就是说，你可以通过方括号（`[]`）访问索引器的元素。索引器与属性相似，因为它也使用访问访问器\
    \ `get` 和 `set` 来表述其特性的。索引器的声明形式如下：\n\n```csharp\nindexer-type this [parameter-type\
    \ parameter]\n{\n    get {};\n    set {};\n}\n```\n\n其中：\n\n* `indexer-type` 是索引器的类型。\n\
    * `parameter-type` 是参数的类型。\n* `parameter` 是参数或参数列表。\n\n关键字 `this` 指向索引器所属的对象。尽管索引器没有名称，但它通过其签名（参数的类型和数量）被识别。\n\
    \n可以使用 `new` 关键字或其中一个访问修饰符来修改索引器的声明。\n\n在下面的示例中，你声明了一个数组和一个 `string` 类型的索引器。然后，使用索引器来访问对象的元素，就像它们是数组元素一样。\n\
    \n![](img/00163.jpeg)\n![](img/00164.jpeg)\n![](img/00165.jpeg)\n![](img/00166.jpeg)\n\
    \n### 自定义运算符 (User-defined Operators)\n\n通过重载，你可以为某些运算符发明新的角色。当你处理对象时，就会产生此功能的需求。在某些情况下，你可能想使用相等运算符（`==`）测试两个对象之间的相等性。在这种情况下，你在程序中重新定义相等运算符，以使其与对象一起工作。\n\
    \n运算符重载通过使用 `operator` 关键字来实现，如下例所示：\n\n```csharp\npublic static Point operator+(Point\
    \ p1, Point p2)\n{\n    // + 运算符的实现：\n}\n```\n\n此示例重载了 `+` 运算符，以便用于相两个 `Point`\
    \ 类型的对象。加两个点意味着加上每个点的 `x` 和 `y` 坐标。如果第一个点的坐标为 `(x1, y1)`，第二个点的坐标为 `(x2, y2)`，则结果是位于\
    \ `(x1+x2, y1+y2)` 位置的新新点。这些细节应该包含在重载运算符 `+` 的实现中。\n\n注意语法中，重新定义的 `+` 运算符紧跟在 `operator`\
    \ 关键字之后。其他示例还有：\n\n* `Operator +`\n* `Operator –`\n* `Operator ==`\n\n用于运算符重载的方法始终是\
    \ `static` 的。下表列出了可以重载的运算符。分类为二元的运算符作用作用于两个操作数，例如 `+` 和 `*`。分类为单元的运算符作用作用于一个操作数，例如\
    \ `++` 和 `--`。\n\n![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg)\
    \ ![fractal-tree2](img/00055.jpeg)\n![](img/00167.jpeg)\n![](img/00168.jpeg)\n\
    ![](img/00169.jpeg)\n![](img/00170.jpeg)\n![](img/00171.jpeg)\n\n### 重写 ToString\
    \ 方法\n\n`ToString` 方法是 .NET 库中最重要的方法之一，因为它在后台配合 `Console.Write` 或 `Console.WriteLine`。它用于将表达式转换为字符串。如你所知，你可以显式地这样使用它：\n\
    \n```csharp\nConsole.WriteLine(myVariable.ToString());\n```\n\n但如果你省略了 `ToString`\
    \ 方法（由于它是嵌入的），你仍然会得到的结果。该方法在 `System.Object` 类中定义如下：\n\n```csharp\npublic override\
    \ string ToString();\n```\n\n在某些情况下，你可能需要重写它以更改行为，例如当你想像普通变量一样显示对象时。与其像上面的示例那样显示\
    \ `Point` 对象：\n\n```csharp\nConsole.WriteLine(\"Point #1: ({0},{1})\", p1.x, p1.y);\n\
    ```\n\n你可以这样显示它：\n\n```csharp\nConsole.WriteLine(\"Point #1: {0}\", p1);\n```\n\
    \n为了实现这一点，你需要重写 `ToString` 方法以便显示 `Point` 类型的对象。这里是实现此操作的代码示例：\n\n```csharp\n\
    // 重写 ToString 方法：\npublic override string ToString()\n{\n    return (String.Format(\"\
    ({0}, {1})\", x, y));\n}\n```\n\n在此代码段中，`String.Format` 方法将格式项目 `{0}` 和 `{1}`\
    \ 替换为指定对象 `x` 和 `y` 的值的文本。因此，该方法的输出将是点 `(x, y)` 的值。你可以将此方法添加到之前的示例中，并直接作为单个变量显示\
    \ `Point` 对象。\n\n![](img/00172.jpeg)\n![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg)\
    \ ![fractal-tree2](img/00055.jpeg)\n\n**总结：**\n\n![](img/00173.jpeg)\n![avatar_medium](img/00174.jpeg)\
    \ ![avatar_medium](img/00174.jpeg) ![avatar_medium](img/00174.jpeg) ![avatar_medium](img/00174.jpeg)\n\
    \n"
- fmt: "\nThe word “struct,” originally an abbreviation of structure, has become a\
    \ part of the programming terminology. In C#, the `struct` is a user-defined value\
    \ type. It might, however, contain members of both reference types and value types.\n\
    \n### Note to C++ programmers\nThe concept of `struct` is totally different in\
    \ the C++ and C# languages. In C++, it is possible to declare a class by using\
    \ the word `struct`. In C#, this is not the case. The `struct` is used to represent\
    \ lightweight objects such as a `point`, which contains two fields (`x` and `y`).\n\
    \nIt can also represent a color, which contains three fields (`red`, `blue`, and\
    \ `green`). Although we use the `Point` class in the examples, the `struct` is\
    \ a more suitable type for such objects as it consumes a small amount of memory.\n\
    \nYou can see the difference if you create a large array of points represented\
    \ as classes. In this case, the required memory would be huge because each point\
    \ is using a reference that points to it.\n\n### Declaring and Using Structs\n\
    \nTo declare a `struct`, use the `struct` keyword like this example:\n\n```csharp\n\
    struct MyStruct\n{\n    // The struct members\n}\n```\n\nYou can modify the declaration\
    \ with any valid combination of access modifiers or the `new` keyword. When you\
    \ use a `struct`, keep in mind the following points:\n\nUnlike classes, the fields\
    \ of a `struct` cannot be initialized. That means that the following statements\
    \ will generate error messages:\n\n```csharp\nstruct MyStruct\n{\n    int x =\
    \ 0; // error\n    int y = 0; // error\n}\n```\n\nA `struct` can use one or more\
    \ constructors, but you cannot declare a default constructor (parameterless constructor)\
    \ for a `struct`. Thus, the following constructor is invalid:\n\n```csharp\nstruct\
    \ MyStruct\n{\n    MyStruct() // error\n    {\n        //...\n    } \n}\n```\n\
    \nThe compiler always provides a default constructor to initialize the members\
    \ of a `struct` to their default values.\n\nLike classes, you can use the `new`\
    \ operator to create struct objects as shown in the following example:\n\n```csharp\n\
    MyStruct ms = new MyStruct();\n```\n\nUnlike classes, you can declare an object\
    \ without the `new` operator, like this:\n\n```csharp\nMyStruct ms;\n```\n\nIn\
    \ the latter case, you must initialize the struct fields before using it.\n\n\
    As mentioned in the preceding chapters, a `struct` cannot be inherited or inherit\
    \ from another type, but it can implement one or more interfaces.\n\nFor example:\n\
    \n```csharp\nstruct MyStruct: IMyInterface\n{\n    // ...\n}\n```\n\nAlthough\
    \ structs cannot inherit other types, the struct type itself descends from the\
    \ `Object` class.\n\nThe following example demonstrates the `Color` struct, which\
    \ contains three fields (`r`, `g`, and `b`) representing the three basic colors\
    \ (red, green, and blue). The program uses a constructor to create two objects\
    \ with different colors.\n\n![](images/00175.jpeg)\n![](images/00176.jpeg)\n![](images/00177.jpeg)\n\
    \nIn the above example, two struct instances, `c1` and `c2`, were used. The first\
    \ one uses a default constructor; therefore, all of its fields contain the value\
    \ zero.\n\nThe second instance is constructed using the parameters `100`, `100`,\
    \ and `0`. These values are assigned to the fields `r`, `g`, and `b`. The objects\
    \ are displayed directly by using the statement:\n\n```csharp\nConsole.WriteLine(\"\
    The colors are: {0}\", c1);\n```\n\nThis requires overriding the `ToString` method\
    \ to display objects in the appropriate format. In the following example, the\
    \ three properties `R`, `G`, and `B` are used to access the private fields `r`,\
    \ `g`, and `b`. This makes it possible to access the fields directly through the\
    \ properties, which is an alternative to using constructors.\n\n![](images/00178.jpeg)\n\
    ![](images/00179.jpeg)\n![](images/00180.jpeg)\n![](images/00181.jpeg)\n\nNotice\
    \ in the above example that we used one object created with the default constructor.\
    \ Then we used the color properties to assign color values to the corresponding\
    \ fields:\n\n```csharp\nc1.R = 100;\nc1.G = 100;\nc1.B = 0;\n```\n\nThe object\
    \ was displayed twice — once with the default values and once after assigning\
    \ the values to the properties. You can, of course, use a constructor with three\
    \ parameters to achieve the same result.\n\n### Passing Structs and Classes to\
    \ Methods\n\nYou learned in Chapter 6 that you can pass variables to methods either\
    \ by value or by reference. You also learned that passing variables by reference\
    \ reflects any changes that occur to them on their original values, while passing\
    \ them by value results in modification of only their copies in the method, and\
    \ the original variables stay the same. Structs, being value types, are created\
    \ on the stack.\n\nWhen passed to methods, they are passed by value. Since classes\
    \ are reference types, they are created on the heap. When passed to methods, they\
    \ are passed by reference.\n\nThe following example demonstrates this concept.\
    \ In the example, you declare a class called `MyClass` and a struct called `MyStruct`.\n\
    \nThen you instantiate the class and the struct and initialize the field in each\
    \ with the value `555`. You pass both objects to the methods `MyMethod1` and `MyMethod2`\
    \ to change their fields to `100`.\n\nThe output, however, indicates that the\
    \ field of the class has changed but not that of the struct.\n\n![](images/00182.jpeg)\n\
    ![](images/00183.jpeg)\n![](images/00184.jpeg)\n![](images/00185.jpeg)\n\n![avatar_medium](images/00186.jpeg)\
    \ ![avatar_medium](images/00186.jpeg) ![avatar_medium](images/00186.jpeg)\n\n\
    Result / Output.\n\n![](images/00187.jpeg)\n![](images/00188.jpeg)\n\n### Enumerations\n\
    \nThe enumeration type is a value type used to store a set of named constants\
    \ such as days of the week, months of the year, and so forth. Each enumeration\
    \ has an underlying type (also called the base type), which can be any one of\
    \ the integral types (`byte`, `sbyte`, `short`, `ushort`, `int`, `uint`, `long`,\
    \ or `ulong`). The default underlying type is `int`. The enumeration is usually\
    \ referred to as `enum`.\n\n#### Declaring Enumerations\n\nYou can declare the\
    \ enumeration by using the `enum` keyword, as shown in the following example that\
    \ enumerates the seasons of the year:\n\n```csharp\nenum Seasons { Summer, Fall,\
    \ Winter, Spring };\n```\n\nEach enumeration element (enumerator) has a value.\
    \ The value of the first enumerator is `0` by default. The value of each successive\
    \ element is incremented by `1`. Thus the values of the elements:\n\n```csharp\n\
    enum Seasons\n{\n    Summer, // 0\n    Fall, // 1\n    Winter, // 2\n    Spring\
    \ // 3\n};\n```\n\nYou can force the elements to start at `1` as in this example:\n\
    \n```csharp\nenum Seasons { Summer = 1, Fall, Winter, Spring };\n```\n\nIn this\
    \ enumeration, the values of the successive elements are indicated below:\n\n\
    ```csharp\nenum Seasons\n{\n    Summer = 1,\n    Fall, // 2\n    Winter, // 3\n\
    \    Spring // 4\n};\n```\n\nYou can assign a value to any element —not necessarily\
    \ the first one:\n\n```csharp\nenum WeekDays { Sat, Sun, Mon = 9, Tue, Wed, Thu,\
    \ Fri };\n```\n\nThis will make the values of the elements that follow `Mon` `10`,\
    \ `11`, `12`, and `13`. However, `Sat` and `Sun` will still be `0` and `1`. You\
    \ can also assign integers to the elements as appropriate. In this example, scores\
    \ that correspond to grades are assigned:\n\n```csharp\nenum Grades { Pass = 65,\
    \ Good = 75, VeryGood = 85, Distinct = 100 };\n```\n\nYou can choose another underlying\
    \ type rather than `int`, such as `long`, if you need to use numbers in that range\
    \ for the elements:\n\n```csharp\nenum Color: long { Red, Green, Blue };\n```\n\
    \n#### Using Enumerations\n\nIn order to use one of the enumerators, you must\
    \ qualify it with the enumeration name. For example, the elements of the `WeekDays`\
    \ enumeration are `WeekDays.Sun`, `WeekDays.Mon`, and so forth.\n\nHowever, to\
    \ convert an enum element to an integral type you must use a cast. For example:\n\
    \n```csharp\nint monday = (int) WeekDays.Mon;\nlong monday = (long) WeekDays.Mon;\n\
    ```\n\nIn the following example, you declare three enumerations for `WeekDays`,\
    \ `Seasons`, and `Grades`. This example demonstrates the various enumeration rules\
    \ explained in the preceding sections.\n\n![](images/00189.jpeg)\n\n### Attributes\n"
  raw: 'The word “struct,” originally an abbreviation of structure, has become a part
    of the programming terminology. In C#, the struct is a user-defined value type.
    It might, however, contain members of both reference types and value types.


    Note to C++ programmers: 


    The concept of struct is totally different in the C++ and C# languages. In C++,
    it is possible to declare a class by using the word struct. In C#, this is not
    the case. The struct is used to represent lightweight objects such as a point,
    which contains two fields (x and y).


    It can also represent a color, which contains three fields (red, blue, and green).
    Although we use the Point class in the examples, the struct is a more suitable
    type for such objects as it consumes a small amount of memory.


    You can see the difference if you create a large array of points represented as
    classes. In this case, the required memory would be huge because each point is
    using a reference that points to it.


    Declaring and Using Structs-             


    To declare a struct, use the struct keyword like this example:


    struct MyStruct


    {


    // The struct members


    }


    You can modify the declaration with any valid combination of access modifiers
    or the new keyword. When you use a struct, keep in mind the following points:


    Unlike classes, the fields of a struct cannot be initialized. That means that
    the following statements will generate error messages:


    struct MyStruct


    {


    int x = 0; // error


    int y = 0; // error


    }


    A struct can use one or more constructors, but you cannot declare a default constructor
    (parameterless constructor) for a struct. Thus, the following constructor is invalid:


    struct MyStruct


    {


    MyStruct() // error


    {


    //...


    } }


    The compiler always provides a default constructor to initialize the members of
    a struct to their default values.


    Like classes, you can use the new operator to create struct objects as shown in
    the following example:


    MyStruct ms = new MyStruct();


    Unlike classes, you can declare an object without the new operator, like this:


    MyStruct ms;


    In the latter case, you must initialize the struct fields before using it.


    As mentioned in the preceding chapters, a struct cannot be inherited or inherit
    from another type, but it can implement one or more interfaces.


    For example:


    struct MyStruct: IMyInterface


    {


    // ...


    }


    Although structs cannot inherit other types, the struct type itself descends from
    the Object class.


    The following example demonstrates the Color struct, which contains three fields
    (r, g, and b) representing the three basic colors (red, green, and blue). The
    program uses a constructor to create two objects with different colors.


    ![](images/00175.jpeg)


    ![](images/00176.jpeg)


    ![](images/00177.jpeg)


    In the above example, two struct instances, c1 and c2, were used. The first one
    uses a default constructor; therefore, all of its fields contain the value zero.


    The second instance is constructed using the parameters 100, 100, and 0\. These
    values are assigned to the fields r, g, and b. The objects are displayed directly
    by using the statement:


    Console.WriteLine("The colors are: {0}", c1);


    This requires overriding the ToString method to display objects in the appropriate
    format. In the following example, the three properties R, G, and B are used to
    access the private fields r, g, and b. This makes it possible to access the fields
    directly through the properties, which is an alternative to using constructors.


    ![](images/00178.jpeg)


    ![](images/00179.jpeg)


    ![](images/00180.jpeg)


    ![](images/00181.jpeg)


    Notice in the above example that we used one object created with the default constructor.
    Then we used the color properties to assign color values to the corresponding
    fields:


    c1.R = 100;


    c1.G = 100;             


    c1.B = 0;


    The object was displayed twice — once with the default values and once after assigning
    the values to the properties. You can, of course, use a constructor with three
    parameters to achieve the same result.


    Passing Structs and Classes to Methods-


    You learned in Chapter 6 that you can pass variables to methods either by value
    or by reference. You also learned that passing variables by reference reflects
    any changes that occur to them on their original values, while passing them by
    value results in modification of only their copies in the method, and the original
    variables stay the same. Structs, being value  types, are created on the stack.


    When passed to methods, they are passed by value. Since classes are reference
    types, they are created on the heap. When passed to methods, they are passed by
    reference.


    The following example demonstrates this concept. In the example, you declare a
    class called MyClass and a struct called MyStruct.


    Then you instantiate the class and the struct and initialize the field in each
    with the value 555\. You pass both objects to the methods MyMethod1 and MyMethod2
    to change their fields to 100\.


    The output, however, indicates that the field of the class has changed but not
    that of the struct.


    ![](images/00182.jpeg)


    ![](images/00183.jpeg)


    ![](images/00184.jpeg)


    ![](images/00185.jpeg)


    ![avatar_medium](images/00186.jpeg) ![avatar_medium](images/00186.jpeg) ![avatar_medium](images/00186.jpeg)


    Result / Output.


    ![](images/00187.jpeg)


    ![](images/00188.jpeg)


    Enumerations-


    The enumeration type is a value type used to store a set of named constants such
    as days of the week, months of the year, and so forth. Each enumeration has an
    underlying type (also called the base type), which can be any one of the integral
    types (byte, sbyte, short, ushort, int, uint, long, or ulong). The default underlying
    type is int. The enumeration is usually referred to as enum.


    Declaring Enumerations-


    You can declare the enumeration by using the enum keyword, as shown in the following
    example that enumerates the seasons of the year:


    enum Seasons { Summer, Fall, Winter, Spring };


    Each enumeration element (enumerator) has a value. The value of the first enumerator
    is 0 by default. The value of each successive element is incremented by 1\. Thus
    the values of the elements in this enum are:


    enum Seasons


    {


    Summer, // 0


    Fall, // 1


    Winter, // 2


    Spring // 3


    };


    You can force the elements to start at 1 as in this example:


    enum Seasons { Summer = 1, Fall, Winter, Spring };


    In this enumeration, the values of the successive elements are indicated below:             


    enum Seasons


    {


    Summer = 1,


    Fall, // 2


    Winter, // 3


    Spring // 4


    };


    You can assign a value to any element —not necessarily the first one:


    enum WeekDays { Sat, Sun, Mon = 9, Thu, Wed, Thu, Fri };


    This will make the values of the elements that follow Mon 10, 11, 12, and 13\.
    However, Sat and Sun will still be 0 and 1\. You can also assign integers to the
    elements as appropriate. In this example, scores that correspond to grades are
    assigned:


    enum Grades { Pass = 65, Good = 75, VeryGood = 85, Distinct = 100 };             


    You can choose another underlying type rather than int, such as long, if you need
    to use numbers in that range for the elements:


    enum Color: long { Red, Green, Blue };


    The enumeration identifier is followed by a colon and then the underlying type.


    Using Enumerations-


    In order to use one of the enumerators, you must qualify it with the enumeration
    name. For example, the elements of the WeekDays enumeration are WeekDays.Sun,
    WeekDays.Mon, and so forth.


    However, to convert an enum element to an integral type you must use a cast. For
    example:


    int monday = (int) WeekDays.Mon;


    long monday = (long) WeekDays.Mon;


    In the following example, you declare three enumerations for WeekDays, Seasons,
    and Grades. This example demonstrates the various enumeration rules explained
    in the preceding sections.


    ![](images/00189.jpeg)


