    The class implementation (or class body) goes between the braces ({ }). You can
    declare a struct in the same way by using the keyword struct:


    struct MyStruct


    {


    // Struct implementation


    }


    Structs are discussed in detail in Chapter 7.


    Field Initialization-


    In the following example, you declare the class Point, which contains two fields
    — x and y:


    class Point


    {


    int x;


    int y;


    }


    You can initialize the fields with values like this example:


    class Point


    {


    int x = 0;


    int y = 0;


    }


    This declaration initializes the fields x and y to their default values. Of course,
    you can use any other values to initialize the fields.


    Class Instantiation-


    To create objects from the Point class, use the following statement:


    Point myPoint; // create the object


    You can also create the object and initialize the fields in the same statement:


    Point myPoint = new Point();


    Notice, however, that you cannot use an uninitialized object —this is the same
    rule that applies to uninitialized variables. In the second statement, when the
    object is created the default constructor is invoked to initialize fields to their
    default values. You can, of course, create more than one instance from the class:


    Point p1 = new Point();


    Point p2 = new Point();


    Then you can assign each object its own coordinates:


    p1.x = 15;


    p1.y = 22;


    p2.x = 10;


    p2.y = 12;


    As you can see from these statements, the fields x and y are associated with the
    objects p1 and p2\. In the following example, you see the complete picture of
    the class and the object created from it.


    In this example, the object is created in the Main method, but you can create
    objects inside any other method. You cannot, however, create an object inside
    the class itself.


    ![](images/00099.jpeg)


    Namespaces-


    A namespace is a container that includes classes and other types. You can place
    the class inside a namespace. The benefit of using namespaces is being able to
    fully qualify members included in the same namespace. If two classes in two different
    namespaces have the same name, you can refer to each one by using the fully qualified
    name, for example:


    MyNameSpace.Class1


    YourNameSpace.Class1


    Nesting Namespaces-


    It is also possible to nest namespaces inside other namespaces. In that case,
    you need to use the fully qualified names to distinguish between similar class
    names:


    MyParentNameSpace.MyNestedNamespace.MyClass1


    MyParentNameSpace.MyClass1


    In the following example, you declare two classes that have the same name, MyClass.
    One class is contained in a namespace called  MyNameSpace, and the other is contained
    in a namespace called YourNameSpace.


    In the Main method, which lies in MyNameSpace, you instantiate both classes and
    create the objects mc1 and mc2\. In order to instantiate the class in YourNameSpace
    you have to use the fully qualified name of the class.


    ![](images/00100.jpeg)


    ![](images/00101.jpeg)


    ![](images/00102.jpeg)


    The Namespace Alias Qualifier-


    There may be times when you want to use special names for your classes, such as
    System or Console. It is obvious that these names will cause conflicts with the
    .NET classes that have similar names.


    For example, a class named System would hide the System class of the .NET library.
    Although this is not a common case, C# 2005 allowed for this possibility by adding
    the namespace alias qualifier operator (::). You can use this operator to search
    the global namespace for identifiers hidden by types or members in your code.


    The :: operator goes between two identifiers, like this:


    global::System.Console.WriteLine("Hello, World!");


    The left-hand identifier that precedes the :: operator is where the search starts.
    The right-hand identifier is the identifier to look for. When the left-hand identifier
    is the word “global,” the search starts at the global namespace. Consider the
    following example in which a class named System is used. This class name causes
    a problem that is solved only by using the namespace alias qualifier, like this:


    global::System.Console.WriteLine(mc.myClassNumber);


    global::System.Console.WriteLine(ms.mySystemNumber);


    If you try to use the following statements instead, you get a compiler error:


    System.Console.WriteLine(mc.myNumber); // error


    System.Console.WriteLine(ms.myNumber); // error


    ![](images/00103.jpeg)


    ![](images/00104.jpeg)


    Access Levels-


    It is a common practice that one programmer creates a class, and then other programmers
    use that class in their code. This code is usually called the client. One important
    feature of OOP is encapsulation, which enables you, as a class creator, to protect
    your class fields by restricting access to them.


    The clients in this case can access those fields only through public methods.
    You probably noticed that the keyword public was used in most class declarations
    in the previous chapters. In this section you learn about public and other keywords
    used for protecting types and members. The following keywords can be used to restrict
    or permit access to types and members:


    *   _ public


    *   _ private


    *   _ protected


    *   _ internal


    These keywords are referred to as access modifiers because they are used to modify
    the declarations. For example:


    public int MyMethod()


    Note; The set of access modifiers is a subset of the C# modifiers, which are used
    for different purposes. Access modifiers are used to create five access levels,
    which are explained in the following table.


    ![](images/00105.jpeg)


    The following table shows the default access levels and the allowed access levels
    to use with different type members. (More on types in chapter 7 and 8)


    Note: In the following example, the Point class is used to demonstrate access
    levels.


    ![](images/00106.jpeg)


    Notes:


    *   There are no access levels for namespaces.


    *   For classes nested inside other classess, the default access level


            is internal. The allowed access levels are public or internal.


    ![](images/00107.jpeg)


    ![](images/00108.jpeg)


    ![](images/00109.jpeg)


    There are several parts of this example worth discussing:


    The example contains three classes: Point, MainClass, and the containing class,
    OuterClass. The Main method is placed inside a class other than the Point class
    in order to test the effect of the access levels. Note that you could not access
    the fields of the Point class if they did not have the public modifier. To test
    that, change the public modifier to private or protected and see the error message
    from the compiler.


    The containing class, OuterClass, is used as a container to the other classes
    so that we can give the Point class the private access level (see Table 5-2).
    If you remove the outer class, the compiler will complain about using the word
    private. The access level of the outer class has no effect on the program though.


    Properties-


    The easiest way to protect the fields of a class is to use properties. The properties
    are in fact methods like other member functions, but they facilitate the access
    of the private fields by the client. The client can use the properties in the
    same way it uses fields. The traditional method that is used in C++ is to dedicate
    some functions for accessing the private fields.


    For example:


    set_MyPoint_x(); // C++


    get_MyPoint_x(); // C++


    The job of the first function is to assign a value to the field x, and the job
    of the second function is to read the value of that field. The C# properties are
    used like the following example:


    private string item;


    public string Item


    {


    get


    {


    return item;


    }


    set


    {


    item = value;


    }


    }


    The field “item” is declared private, and the property “Item” is declared public.
    (This naming system is not mandatory but is a common convention.) A property contains
    the method get to read the field and the method set to assign a value to the field.'
