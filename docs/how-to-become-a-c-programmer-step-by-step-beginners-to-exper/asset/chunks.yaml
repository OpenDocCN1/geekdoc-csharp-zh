  trans: "\n\n注意，方法和委托的返回类型以及参数类型是相同的（它们由**粗体**标出）。\n\n### 3. 创建委托对象\n\n```cs\nMyDelegate\
    \ delegObj = new MyDelegate(MyMethod);\n```\n\n注意，委托的参数是所封装方法的名称。你也可以在不使用 `new`\
    \ 运算符的情况下创建委托对象，只需将方法赋值给委托即可：\n\n```cs\nMyDelegate delegObj = MyMethod;\n```\n\
    \n#### 调用委托\n\n使用与调用关联方法时相同的参数来调用委托。你可以像下面这样调用上一节中创建的委托：\n\n```\ndelegObj(119,\
    \ \"Jane Doe\");\n```\n\n或者，你也可以从方法内部调用委托，如下例所示：\n\n```cs\npublic static void\
    \ CallDelegate(MyDelegate meth)\n{\n    meth(119, \"Jane Doe\");\n}\n```\n\n注意，该方法使用了类型为\
    \ `MyDelegate` 的参数 `meth`。显而易见，方法的名称并不重要，但签名（signature）很重要；它必须与所封装的方法 `MyMethod`\
    \ 相同的签名。你也可以使用 `.NET` 方法 `Invoke` 这样调用委托：\n\n```cs\ndelegObj.Invoke(119, \"Jane\
    \ Doe\");\n```\n\n在这个特定的示例中，我们使用了修饰符 `static` 仅为了操作方便。然而，委托可以使用实例方法也可以使用静态方法。在下面的示例中，委托被付诸。\n\
    \n![](img/00260.jpeg)\n\n![](img/00261.jpeg) ![](img/00262.jpeg)\n\n#### 将委托与多个方法关联\n\
    \n委托与方法之间的关联是在运行时动态定义的。换句话说，委托在编译期间不知道它将封装哪种方法。\n\n重要的是该方法的签名和返回类型。这意味着你可以在程序中将同一个委托关联到多个方法。在下面的示例中，声明了两个\
    \ double 类型的方法，一个用于计算平均值，另一个用于计算和。\n\n声明并实例化了一个类型为 `double` 的委托。该委托对象与每个方法关联并逐个被调用。\n\
    \n![](img/00263.jpeg)\n\n![](img/00264.jpeg)\n\n![](img/00265.jpeg)\n\n#### 添加和移除委托\n\
    \n可以使用 `+` 运算符组合委托以创建一个复合委托。调用复合委托会触发其组成委托。组合委托的目的是通过同一个委托封装多个方法。\n\n这种操作被称为多路调用（multicasting）。也可以使用\
    \ `-` 运算符从复合委托中移除委托。你可以使用 `+=` 和 `-=` 来实现相同的操作。\n\n同样，你可以使用 `.NET` 方法 `Combine`\
    \ 和 `Remove` 来添加和移除委托，它们是 `System.Delegate` 成员。下面的示例演示了委托的多路调用。\n\n![avatar_medium](img/00005.jpeg)\
    \ ![avatar_medium](img/00005.jpeg) ![avatar_medium](img/00005.jpeg)\n\n![](img/00266.jpeg)\
    \ ![](img/00267.jpeg) ![](img/00268.jpeg)\n\n#### 匿名方法\n\n匿名方法是 C# 2005 的新功能，允许你直接将代码段作为委托参数传递，而无需声明单独的方法。考虑以下委托声明：\n\
    \n```cs\ndelegate void MyDelegate(string s);\n```\n\n与其像这样声明一个单独的方法 `MyMethod`：\n\
    \n```cs\npublic void MyMethod(string s)\n{\n    Console.WriteLine(s);\n}\n```\n\
    \n你可以直接将委托与方法的代码关联：\n\n```cs\nMyDelegate delegObject = delegate(string s) { Console.WriteLine(s);\
    \ };\n```\n\n注意代码块末尾的分号。在下面的示例中，演示了一个带有两个对象参数的匿名方法的委托。\n\n![](img/00269.jpeg)\n\
    \n![](img/00270.jpeg)\n\n#### 协变 (Covariance)\n\n协变是 C# 2005 添加的一项新功能，旨在为匹配委托类型和封装方法的返回类型提供某种灵活性。协变不再要求委托和方法的返回值使用相同类型，而是允许方法使用一个特化为（即派生自）委托类型的返回类型。\n\
    \n在在下面的示例中，一个类型为 `Person` 的委托封装了两个方法：`MyMethodP` 和 `MyMethodE`。`MyMethodP` 的返回类型为\
    \ `Person`。`MyMethodE` 的返回类型为 `Employee`。\n\n![](img/00271.jpeg) ![](img/00272.jpeg)\
    \ ![](img/00273.jpeg)\n\n```cs\nMyDelegate d = mc;\n```\n\n#### 逆变 (Contravariance)\n\
    \n逆变是 C# 2005 添加的另一项新功能，旨在为匹配委托类型和封装方法的返回类型提供某种灵活性。逆变不再要求委托和方法的返回值使用相同类型，而是允许方法使用一个特化为（即派生自）委托类型的返回类型。\n\
    \n在在下面的示例中，一个类型为 `Person` 的委托封装了两个方法……例如：\n\n```cs\ndelegate void MyDelegate(string\
    \ s);\n```\n\n#### 事件 (Events)\n\n委托最重要的用途之一是事件。当你点击按钮时，会触发一个事件。例如，如果你创建了一个 Windows\
    \ 应用程序，你只需要提供以下代码：\n\n```cs\nprivate void button1_Click(object sender, EventArgs\
    \ e)\n{\n    textBox1.Text = \"Hello, World!\";\n}\n```\n\n这行代码的意思是：“当你点击按钮时，在文本框中写入‘Hello,\
    \ World!’。”方法本身是在双击按钮时由 IDE 提供的。\n\n"
