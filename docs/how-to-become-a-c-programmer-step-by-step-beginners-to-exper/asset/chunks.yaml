    Summary: In this chapter:


    You wrote your first program in C# and learned about its building blocks, including
    the declaration of a class, the Main method, and directives.


    You learned how to display the output by using the .NET methods Write and WriteLine.


    You also know how directives can save time and effort when using the .NET methods.


    You now know how to declare and initialize local variables inside a method.


    You also know that the C# language doesn’t allow you to use a variable before
    initializing it.


    In the examples, you learned how to assign values to variables and perform some
    basic operations such as numeric variable addition.


    You know that the ToString method is used to convert other types to strings and
    that it is embedded in the WriteLine (or Write) method so you don’t need to use
    it explicitly in displaying numeric output.


    You learned about the C# program architecture and how the building blocks work
    together to build the application.


    You were introduced to fully qualified names and their role in resolving name
    conflicts in the program.


    You learned about common conventions for writing your code that make it easy for
    others to read and understand.


    Finally, you learned how to create an XML documentation file for your code.


