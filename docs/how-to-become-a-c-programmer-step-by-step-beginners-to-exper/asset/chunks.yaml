    `B.TECH CS`、`IT`、`BCA`、`MCA` 以及 `BSC IT` 的所有方面。


    随着 `.NET` 平台——一种全新的、令人兴奋的编程语言的诞生，`C#` 现在是在 `.NET` 平台上进行开发的首选语言，作者甚至使用 `Visual
    C#` 编写了大部分的 `.NET Framework`。`C#` 是一种现代的面向对象语言，从零开始根据精益求精的理念进行设计和开发，实现了并扩展了其他语言中存在的优秀特性和功能。`Visual
    C#` 结合了 `C++` 的强大和灵活性以及 `Visual C#` 的某些简单性。


    ## 读者群体与结构


    本书针对那些几乎或没有编程经验，或者可能将 `C#` 作为第二语言学习的人。本书的结构和编写有一个明确的目的：让你尽可能快进入生产状态。我利用了使用 `C#`
    编写应用程序和教学 `C#` 的经验，编写了这本书，希望它能够拨除冗余，教你需要需要的知识。作者往往会陷入只关注技术本身而非技术实际应用的陷阱中。我努力让这本书专注于教你可以立即应用到开发项目中的实用技能。


    本书分为十章，每章都侧重于使用 `C#` 开发应用程序的不同方面。这些部分通常遵循你从开始使用 `C#` 创建自己的程序时将要执行的任务流。我建议你按照它们出现的顺序来阅读。


    当 `C#` 编程语言的第一版本随 `.NET Framework` 在 2002 年发布时，它取得了巨大的成功，并成为全球许多程序员的首选编程语言。


    `C#` 作为 `C++` 的演进，简化了 `C++` 的许多特性，但保留了 `C++` 的强大。事实上，`C#` 的强大和易于学习的语法说服许多开发者从
    `C++` 或 `Java` 切换到它。


    `C# 2005` 版本（也称为 `C# 2.0`）为语言添加了更强大的特性，如泛型、部分类等。在 `Technology. Preview` 中发布的 `C#
    3.0` 新功能将程序员带入了一个名为“函数式编程”的新时代。`C# 3.0` 侧重于弥合编程语言与数据库之间的鸿沟。本书涵盖了从第一版到 `C# 3.0`
    的所有语言特性。它还提供了使用 `Visual Studio 2005` 的精要知识，让你能够享受它的功能，并通过使用 `IntelliSense` 等功能为你节省时间。


    学习一种新编程语言可能会令人敬畏。如果你以前从未写过程序，通过输入看似晦涩的文本来产生精美且强大的应用程序可能看起来像是一门黑术，你可能会好奇自己如何能学会所需的一切。答案当然是：一步一步来。


    学习语言的第一步与任何其他活动相同：建立信心。编程既是艺术也是科学。虽然它看起来像魔法，但它更像是一种幻术：当你了解了事物是如何运作的后，许多神秘感就会消失，让你能够专注于产生任何给定所需结果所需的力学。


    生产大型商业解决方案是通过一系列小步骤完成的。在完成这一小时内创建的创建后，你将对整个开发过程有一个直感受，并向成为一名出色的程序员迈出了第一步。事实上，你将在后续章节中基于这个
    `Picture Viewer` 程序进行构建。当你完成这本书时，你将已经构建了一个可分发的应用程序，具有可缩放的屏幕、包括菜单和工具栏在内的直观界面以及带有专业错误处理的健壮代码。但我说得太早了！


    `C#` 编程语言是早期的 `C`、`C++` 和 `Java` 语言强大且较新的后代。用它进行编程非常有趣，正如你将在本书中所发现的那样。微软创建 `C#`
    是为了其 `.NET` 计划的一个部分。


    可能出于政治原因，微软在 2000 年夏天将 `C#` 语言的规范交给了 `ECMA`（发音为 ek-ma）国际标准委员会，这远在 `.NET` 成为现实之前。理论上讲，任何公司都可以编写自己的
    `C#` 版本，并运行在任何操作系统、任何比计算器大的机器上。


