  trans: "\n\n`get` 和 `set` 方法被称为访问器（accessors）。它们被归类为上下文关键字（contextual keywords），即在与属性或索引器配合使用具有特殊含义的单词。注意\
    \ `get` 访问器中 `return` 关键字的使用。同样注意另一个上下文关键字 `value` 的使用，它用于更改字段的值。下面的示例展示了如何使用属性来读取或写入字段名：\n\
    \n```csharp\nItem = \"C# book\"; // 使用 set 方法\nConsole.Write(Item); // 使用 get\
    \ 方法\n```\n\n如你在第一个示例所示，使用 `set` 访问器意味着为属性分配一个值（上下文关键字 `value` 从没有被显式使用）。在第二个示例中，`get`\
    \ 访问器也被隐式地用于检索属性值（读取它）。\n\n### 注意事项\n尽管关键字（keywords）是保留字，但上下文关键字不是。你不能在不加 `@`\
    \ 符号前缀的情况下将关键字用作标识符，但上下文关键字可以用作标识符。除非你需要在 `set` 访问器中编写额外的代码，否则你可以通过这种方式编写属性来偏离常见的编码规范：\n\
    \n```csharp\npublic string Item\n{\n    get { return item; }\n    set { item =\
    \ value; }\n}\n```\n\n### 使用属性\n属性提供了一种方便的公共方式来读取和设置字段值，而不是直接处理字段。与直接使用字段相比，使用属性的一个优势是你可以在更改字段值之前对数据进行验证。\n\
    \n例如，如果字段包含特定的日期，你可以检查要分配给字段的值是否在特定范围内。在下面的示例中，名为 `number` 的字段的有效值应该在 100 到 1000\
    \ 之间。\n\n如果你尝试分配一个小于 100 或大于 1000 的值，它将不会被接受，你将收到来自 `set` 访问器的消息，告知你错误。无论输入的值是否被接受，程序都会显示字段的当前值。\n\
    \n![](img/00110.jpeg)\n![](img/00111.jpeg)\n![](img/00112.jpeg)\n\n### 只读属性\n\
    有时，你需要保护字段免受用户的任何更改。例如，包含公司名的字段不应被更改。在这种情况下，你省略 `set` 访问器并保留 `get` 访问器以读取字段。\n\
    \n这种属性被称为只读属性（read-only property），而普通属性被称为读写属性（read-write property）。在下面的示例中，两种类型的属性都使用了。人的姓名是读写属性，而公司名是只读属性。\n\
    \n![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg)\n\
    \n#### 示例 5-6\n![](img/00113.jpeg)\n![](img/00114.jpeg)\n\n### 访问器的访问权限\n在 C#\
    \ 2002 中，两个访问器 `set` 和 `get` 的访问权限与其作用的属性具有相同。在 C# 2005 中，每个访问器都可以有自己的访问权限级别。\n\
    \n通过这种方式，你可以限制 `set` 访问器的访问权限，同时保持 `get` 访问器为公共。在这种情况下，属性的值只能由类设计者更改。下面的示例展示了一个具有公共\
    \ `get` 和保护 `set` 的属性。\n\n```csharp\npublic string EmployeeName\n{\n    get {\
    \ return employeeName; }\n    protected set { employeeName = value; }\n}\n```\n\
    \n然而，在使用此功能时存在一些限制：\n* 访问修饰符仅允许用于其中一个访问器——通常是 `set` 访问器。\n* 如果只使用一个访问器（如只读属性所示），则不能在访问器上使用访问修饰符。当然，在这种情况下，访问器的访问权限与属性的访问权限相同。\n\
    * 在接口上（第 8 章解释），访问器不允许使用访问修饰符。\n* 访问器的访问权限必须比属性本身的访问权限更严格。\n\n### 静态成员和静态类\n假设你正在构建一个类，代表如示例\
    \ 5-6 所示公司的员工组。员工姓名会随着类的每个实例而变化，而公司名保持不变。\n\n换句话说，员工姓名属于相应的员工对象，而公司名属于类。\n\n在这种情况下，你可以使用修饰符\
    \ `static` 修改公司名的声明，使其能够属于类而不是特定对象。以下是新的声明：\n\n```csharp\nprivate static string\
    \ companyName = \"Microsoft\";\nprivate string name;\n```\n\n当你使用静态字段时，将其与类名而不是特定对象相关：\n\
    \n```csharp\nConsole.WriteLine(\"Company Name: {0}\", Employee.CompanyName);\n\
    ```\n\n这导致类成员分为两类：\n* 实例成员。\n* 静态成员。\n\n这种分类适用于方法和字段。在下面的示例中，类 `Employee` 被修改为包含公司名以及与其关联的属性作为静态成员。\n\
    \n![](img/00115.jpeg)\n![](img/00116.jpeg)\n![](img/00117.jpeg)\n\n我们之前在书中使用的静态成员示例是\
    \ `Math` 类的方法。`Math` 类的方法如 `Math.Tan` 和 `Math.Round` 这些成员总是与类相关。`Math` 类本身是一个静态类，无法实例化。\n\
    \n### 常量\n常量是一个表示常量值的名称。`const` 修饰符用于声明声明后无法更改的字段或局部变量。例如，我们之前使用的 `PI` 常量无法更改。这里是一个使用常量字段的类：\n\
    \n```csharp\nclass MyClass\n{\n    public const field1 = 3, field2 = 10;\n}\n\
    ```\n\n注意此声明中的常量字段已初始化。这也适用于常量变量。如果你像下面的示例一样使用了常量：\n\n```csharp\nconst doubleDoubleConst\
    \ = 3.1;\nconst int myIntConst = 25;\n```\n\n你不能通过其他语句更改它们的值：\n\n```csharp\nint\
    \ x = ++myIntConst; //错误\nmyIntConst = 26; // \n```\n\n你可以使用常量来构建其他常量，如下：\n\n\
    ```csharp\nconst string language = \"C#\";\nconst string productName = language\
    \ + \" \"+ \"2005\";\n```\n常量 `productName` 的值为“C# 2005”。当你在程序中声明转换率的变量时，最好使用\
    \ `const` 声明。在下面的程序中，转换率 `convRatio` 用于公里转换为英里。\n\n![](img/00118.jpeg)\n\n###\
    \ 构造函数\n类可以包含一个或多个方法来构建和初始化对象。这些方法被称为构造函数。构造函数分为三类：\n* 实例构造函数。\n* 私有构造函数。\n* 静态构造函数。这些构造函数将在后续章节解释。\n\
    \n### 实例构造函数\n实例构造函数是最常见的，有时简称为构造函数。构造函数的命名与类相同。它在创建新对象时被调用。例如：\n\n```csharp\n\
    Point myPoint = new Point();\n```\n\n类也可能包含带有参数的构造函数，例如：\n\n```csharp\nPoint myPoint\
    \ = new Point(int x, y);\n```\n\n正如你在之前的示例中可能注意到的，如果类没有构造函数，则调用默认构造函数。默认构造函数是无参数构造函数，如\
    \ `Point()`。该构造函数用默认参数初始化创建的对象——整数字段为零。\n\n![](img/00119.jpeg)\n![](img/00120.jpeg)\n\
    ![](img/00121.jpeg)\n![](img/00122.jpeg)\n"
- fmt: "\n![](images/00123.jpeg)\n\n## Declaring Constructors\n\nAlthough the default\
    \ parameterless constructor is automatically created by the compiler, you cannot\
    \ declare one constructor with parameters without declaring the parameterless\
    \ constructor. The compiler provides the default constructor only if the class\
    \ does not have any constructors. In other words, in order to use the statement:\n\
    \n```\nPoint p1 = new Point();\n```\n\nyou must declare a parameterless constructor.\n\
    \n### Using this\n\nAs in C++, in C# the `this` keyword is used to access data\
    \ members in instance constructors (methods or accessors). For example, you can\
    \ declare the constructor in the preceding example like this:\n\n```csharp\npublic\
    \ Point(int x, int y)\n{\n    this.x = x;\n    this.y = y;\n}\n```\n\nIn this\
    \ case, you can use the same names for both fields and parameters (`x` and `y`).\
    \ This is because the expression `this.x` represents the field `x` of the current\
    \ object, while `x` is the method parameter. It is obvious that the keyword `this`\
    \ cannot be used with static constructors or fields.\n\n#### Note\nIn C++, the\
    \ `this` keyword is classified as a pointer, but in C#, it is called “this-access.”\
    \ The word “pointer” is used only in unsafe code.\n\n### Private Constructors\n\
    \nPrivate constructors are used with classes that contain only static members.\
    \ Other classes, except those nested in the same class, are not allowed to create\
    \ instances of that class. Consider the following example:\n\n```csharp\npublic\
    \ class MyClass\n{\n    private MyClass() {} // private constructor\n    public\
    \ string companyName;\n    public string employmentDate;\n}\n```\n\nIn this example,\
    \ the private constructor is an empty constructor whose job is to prevent the\
    \ generation of a default constructor for the class. Notice that the private constructor\
    \ uses the access modifier `private`, which is a common convention but not necessary\
    \ because the default access level is private. It is recommended to declare the\
    \ class as a static class when its members are all static.\n\n### Static Constructors\n\
    \nA static constructor is used to initialize a class. It is called before any\
    \ objects are created and before any call to any static member of the class. In\
    \ the following example, the static constructor `MyClass` contains two printing\
    \ statements. There is also a method, `MyMethod`, that contains another printing\
    \ statement. Notice that when `MyMethod` is called, the static constructor is\
    \ automatically invoked.\n\n![](images/00124.jpeg)\n![](images/00125.jpeg)\n![](images/00126.jpeg)\n\
    \n#### Note\nIn Next Chapters, you are going to learn about object initializers\
    \ that let you save the time and effort of writing redundant code to declare constructors\
    \ that do the same job. For example, if you have a class called `Point` with two\
    \ properties, `X` and `Y`, that are used to set the coordinates `x` and `y`, you\
    \ can declare and initialize its objects like these examples:\n\n```csharp\nPoint\
    \ p = new Point { X = 10, Y = 20 };\n```\n\nOR\n\n```csharp\nvar p = new Point\
    \ { X = 10, Y = 20 };\n```\n\n## Read-only Fields\n\nThe `readonly` keyword is\
    \ used to declare read-only fields. There are only two ways to assign values to\
    \ read-only fields. The first way is to assign the value in the declaration statement,\
    \ as in this example:\n\n```csharp\npublic readonly int intOnlyInt1 = 55;\n```\n\
    \nThe second is to use a constructor, as in this example:\n\n```csharp\npublic\
    \ MyClass()\n{\n    readOnlyInt1 = 66;\n}\n```\n\nThe following example demonstrates\
    \ the read-only fields.\n\n![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg)\
    \ ![](images/00075.jpeg)\n![](images/00127.jpeg)\n![](images/00128.jpeg)\n\nNotice\
    \ in this example that you cannot change the value of the read-only field in the\
    \ main method by using a statement like this:\n\n```csharp\nobj1.readOnlyInt1\
    \ = 55; //error\n```\n\n## Inheritance\n\nIt is possible for a class to inherit\
    \ another class as in the following example:\n\n```csharp\nclass MyDerivedClass\
    \ : MyBaseClass\n{\n    // ...\n}\n```\n\nIn this example, you declared the class\
    \ `MyDerivedClass`, which inherits the class `MyBaseClass`. In the declaration,\
    \ the colon (`:`) is used between the name of the derived class and the name of\
    \ the base class. Inheritance means that the derived class contains all the members\
    \ of the base class. You can also add new members to the inherited members.\n\n\
    For example, the `Employee` class inherits all the characteristics of the `Person`\
    \ class and adds to them the characteristics of an `Employee`. The following rules\
    \ control inheritance:\n\n1. All members of the base class are inherited (except\
    \ instance constructors, destructors, and static constructors).\n2. If you declare\
    \ a member in the derived class with the same name as that in the base class,\
    \ it hides the member in the base class. In that case, the member of the base\
    \ class is not accessible through the derived class.\n3. Function members in the\
    \ base class can be overridden by those in the derived class, making it possible\
    \ to exhibit polymorphism. (Polymorphism is explained in Chapter 6.)\n4. In C#,\
    \ unlike C++, a class can inherit from one class only. However, it can implement\
    \ more than one interface. When a class implements an interface, it “inherits”\
    \ its members. (Interfaces are explained in Chapter 8.)\n5. Structs cannot inherit\
    \ from classes or other structs, but they can implement interfaces. They also\
    \ cannot be inherited.\n\n#### Note\nSometimes the expressions specialization\
    \ and generalization are used to express inheritance. For example, the `Cow` class\
    \ specializes the `Mammal` class, and the `Mammal` class generalizes the `Cow`\
    \ class. The base class is also referred to as the superclass or parent class,\
    \ and the derived class is referred to as the subclass or child class.\n\nIn the\
    \ following example, the class `Employee`, which inherits from the class `Citizen`,\
    \ is demonstrated.\n\n![](images/0129.jpeg)\n![](images/0130.jpeg)\n\nNotice in\
    \ this example that all the member methods have the access level public. This\
    \ is necessary for accessing the class fields.\n\n## Destructors\n\nDestructors\
    \ are used to destruct objects. A destructor is declared as shown in this example:\n\
    \n```csharp\n~MyClass()\n{\n    // Destruction statements.\n}\n```\n\nThe destructor\
    \ of a class uses the same name as the class but is preceded with tilde (`~`).\
    \ You cannot, however, call a destructor as it is called automatically when the\
    \ object finishes its work and goes out of scope. In case of inheritance, the\
    \ destruction starts with the children and goes up in the inheritance tree. The\
    \ following example shows how destructors are called to destruct objects in the\
    \ order of their position in the inheritance hierarchy.\n\n![](images/00075.jpeg)\
    \ ![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg)\n![](images/0131.jpeg)\n\
    ![](images/0132.jpeg)\n\nNotice in this example that the grandkid was destructed\
    \ first, then the kid, and finally the parent. Although destructors play an important\
    \ role in C++ (as you use them to deallocate memory that was allocated for the\
    \ pointers), in C# you don’t need to use them because the garbage collector does\
    \ that task for you when the objects finish their work and are no longer in use.\
    \ In C#, you can still use destructors to clear unmanaged resources such as files\
    \ and network connections.\n\nThis topic, however, will not be discussed here\
    \ as it is beyond the level of this book. For more information on that, read about\
    \ the `Dispose` method on the Microsoft web site: [http://msdn.microsoft.com](http://msdn.microsoft.com).\n\
    \n#### Note\nYou can force the garbage collector to start the cleaning process\
    \ by using the .NET `GC.Collect` method, but this is not recommended as it might\
    \ cause undesirable results.\n"
  raw: '![](images/00123.jpeg)


    Declaring Constructors-


    Although the default parameterless constructor is automatically created by the
    compiler, you cannot declare one constructor with parameters without declaring
    the parameterless constructor. The compiler provides the default constructor only
    if the class does not have any constructors. In other words, in order to use the
    statement:


    Point p1 = new Point();


    you must declare a parameterless constructor.


    Using this-


    As in C++, in C# the this keyword is used to access data members in instance constructors
    (methods or accessors). For example, you can declare the constructor in the preceding
    example like this:


    public Point(int x, int y)


    {


    this.x = x;


    this.y = y;


    }


    In this case, you can use the same names for both fields and parameters (x and
    y). This is because the expression “this.x” represents the field “x” of the current
    object, while “x” is the method parameter. It is obvious that the keyword this
    cannot be used with static constructors or fields.


    Note


    In C++, the this keyword is classified as a pointer, but in C#, it iscalled “this-access.”
    The word “pointer” is used only in unsafe code.


    Private Constructors-


    Private constructors are used with classes that contain only static members. Other
    classes, except those nested in the same class, are not allowed to create instances
    of that class. Consider the following example:


    public class MyClass


    {


    private MyClass() {} // private constructor


    public string companyName;


    public string employmentDate;


    }


    In this example, the private constructor is an empty constructor whose job is
    to prevent the generation of a default constructor for the class. Notice that
    the private constructor uses the access modifier private, which is a common convention
    but not necessary because the default access level is private. It is recommended
    to declare the class as a static class when its members are all static.


    Static Constructors-


    A static constructor is used to initialize a class. It is called before any objects
    are created and before any call to any static member of the class. In the following
    example, the static constructor MyClass contains two printing statements. There
    is also a method, MyMethod, that contains another printing statement. Notice that
    when MyMethod is called, the static constructor is automatically invoked.


    ![](images/00124.jpeg)


    ![](images/00125.jpeg)


    ![](images/00126.jpeg)


    Note


                 In Next Chapters, you are going to learn about object initializers
    that let you save the time and effort of writing redundant code to declare constructors
    that do the same job. For example, if you have a class called Point with two properties,
    X and Y, that are used to set the coordinates x and y, you can declare and initialize
    its objects like these examples:


    Point p = new Point { X = 10, Y = 20 };


    OR


    var p = new Point { X = 10, Y = 20 };


    Read-only Fields-


    The readonly keyword is used to declare read-only fields. There are only two ways
    to assign values to read-only fields. The first way is to assign the value in
    the declaration statement, as in this example:


    public readonly int readOnlyInt1 = 55;


    The second is to use a constructor, as in this example:


    public MyClass()


    {


    readOnlyInt1 = 66;


    }


    The following example demonstrates the read-only fields.


    ![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg)


    ![](images/00127.jpeg)


    ![](images/00128.jpeg)


    Notice in this example that you cannot change the value of the read-only field
    in the main method by using a statement like this:


    obj1.readOnlyInt1 = 55; //error


    Inheritance-


    It is possible for a class to inherit another class as in the following example:


    class MyDerivedClass: MyBaseClass


    {


    // ...


    }


    In this example, you declared the class MyDerivedClass, which inherits the class
    MyBaseClass. In the declaration, the colon (:) is used between the name of the
    derived class and the name of the base class. Inheritance means that the derived
    class contains all the members of the base class. You can also add new members
    to the inherited members.


    For example, the Employee class inherits all the characteristics of the Person
    class and adds to them the characteristics of an Employee. The following rules
    control inheritance:


    1.  All members of the base class are inherited (except instance constructors,
    destructors, and static constructors).


    2.  If you declare a member in the derived class with the same name asthat in
    the base class, it hides the member in the base class. In that case, the member
    of the base class is not accessible through the derived class.


    3.  Function members in the base class can be overridden by those in the derived
    class, making it possible to exhibit polymorphism. (Polymorphism is explained
    in Chapter 6.)


    4.  In C#, unlike C++, a class can inherit from one class only. However, it can
    implement more than one interface. When a class implements an interface, it “inherits”
    its members. (Interfaces are explained in Chapter 8.)


    5.  Structs cannot inherit from classes or other structs, but they can implement
    interfaces. They also cannot be inherited.


    Note- Sometimes the expressions specialization and generalization are used to
    express inheritance. For example, the Cow class specializes the Mammal class,
    and the Mammal class generalizes the Cow class. The base class is also referred
    to as the superclass or parent class, and the derived class is referred to as
    the subclass or the child class.


    In the following example, the class Employee, which inherits from the class Citizen,
    is demonstrated.


    ![](images/00129.jpeg)


    ![](images/00130.jpeg)


    Notice in this example that all the member methods have the access level public.
    This is necessary for accessing the class fields.


    Destructors-


    Destructors are used to destruct objects. A destructor is declared as shown in
    this example:


    ~MyClass()


    {


    // Destruction statements.


    }


    The destructor of a class uses the same name as the class but is preceded with
    the tilde (~) character. You cannot, however, call a destructor as it is called
    automatically when the object finishes its work and goes out of scope. In case
    of inheritance, the destruction starts with the children and goes up in the inheritance
    tree. The following example shows how destructors are called to destruct objects
    in the order of their position in the inheritance hierarchy.


    ![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg)


    ![](images/00131.jpeg)


    ![](images/00132.jpeg)


    Notice in this example that the grandkid was destructed first, then the kid, and
    finally the parent. Although destructors play an important role in C++ (as you
    use them to deallocate memory that was allocated for the pointers),


    In C# you don’t need to use them because the garbage collector does that task
    for you automatically when the objects finish their work and are no longer in
    use. In C#, you can still use destructors to clear unmanaged resources such as
    files and network connections.


    This topic, however, will not be discussed here as it is beyond the level of this
    book. For more information on that, read about the Dispose method on the Microsoft
    web site: [http://msdn.microsoft.com](http://msdn.microsoft.com).


    Note :


    You can force the garbage collector to start the cleaning process by using the
    .NET GC.Collect method, but this is not recommended as it might cause undesirable
    results.


    Partial Classes-'
