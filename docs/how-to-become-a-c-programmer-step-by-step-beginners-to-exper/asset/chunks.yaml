  trans: "\n正如你从这个声明中看到的，该接口仅包含方法的名称、类型和参数。这与 C++ 中的函数原型相似。在实际实现中，我们将讨论实现此接口的类型。一个接口实现一个或多个接口，如下例所示：\n\
    \n```csharp\ninterface IMyInterface: Interface1, Interface2\n{\n    // 接口成员\n\
    }\n```\n\n在这个示例中，`IMyInterface` 实现了 `Interface1` 和 `Interface2`。\n\n### 接口实现\n\
    \n接口可以通过类或结构体来实现，如下例所示：\n\n```csharp\nclass MyClass: IMyInterface1\n{\n    //\
    \ 类实现\n}\n```\n\n通过此声明，类 `MyClass` 有义务实现接口 `IMyInterface` 的所有成员。类也可能实现多个接口：\n\n\
    ```csharp\nclass MyClass: IMyInterface1, IMyInterface2\n{\n    // 类实现\n}\n```\n\
    \n除了接口外，类还可以实现另一个类：\n\n```csharp\nclass MyClass: MyBaseClass, IMyInterface1, IMyInterface2\n\
    {\n    // 类实现\n}\n```\n\n在接下来的示例中，类 `Point` 实现了接口 `IPoint`。注意，所有的字段都包含在类中，但接口中没有包含。\n\
    \n![](img/00197.jpeg)\n![](img/00198.jpeg)\n![](img/00199.jpeg)\n![](img/00200.jpeg)\n\
    ![](img/00201.jpeg)\n\n关于上述示例的说明：\n\n1. 如果你没有实现接口的所有成员，将得到编译错误。尝试注释类中的属性（`Myx`\
    \ 和 `Myy`）以查看编译错误信息。\n2. 注意，类可以包含接口成员之外的成员，例如方法 `DisplayMyPoint`。\n3. 同时注意，可以向方法\
    \ `DisplayMyPoint` 传递类型为 `IPoint`。当然，你也可以传递类型为 `Point`。\n\n### 显式接口实现\n\n考虑一个实现接口\
    \ `IMyInterface` 的类 `MyClass`。可以通过这种方式实现接口成员 `MyMethod`：\n\n```csharp\nstring\
    \ IMyInterface.MyMethod()\n{\n    // 接口实现\n}\n```\n\n在这个示例中，`MyMethod` 由接口名称进行限定，\n\
    \n`IMyInterface:`\n`IMyInterface.MyMethod()`\n\n这被称为显式接口实现。假设你使用以下语句从 `MyClass`\
    \ 创建了一个对象：\n\n```csharp\nMyClass mc = new MyClass();\n```\n\n你也可以通过强制转换类对象来创建一个接口对象：\n\
