  trans: "\n在本节中，我们将使用一个示例来演示计算不同形状的面积。该示例包含了继承以及对基类虚方法的重写。该类包含两个维度，`x` 和 `y`，以及一个计算面积的虚方法：\n\
    \n```csharp\npublic virtual double Area()\n{\n    return 0;\n}\n```\n\n返回的值（零）现在并没有太大意义，因为其他方法将重写此方法并改变其行为。有几个类将继承此类，例如\
    \ `Point`、`Circle`、`Sphere` 和 `Cylinder` 类。所有这些类的共同点是 `x` 和 `y` 维度。\n\n维度 `x`\
    \ 可能代表正方形的边，或者圆或球的半径。维度 `y` 可能是矩形的长度或圆柱的高度。继承这些维度无疑有助于有助于派生类的创建。每个派生类都包含一个同名的方法：`Area`。\n\
    \n这是 `Circle` 类的 `Area` 方法：\n\n```csharp\npublic override double Area()\n{\n \
    \   return Math.PI * x * x;\n}\n```\n\n这是 `Sphere` 类的 `Area` 方法：\n\n```csharp\n\
    public override double Area()\n{\n    return 4 * Math.PI * x * x;\n}\n```\n\n\
    这是 `Cylinder` 类的 `Area` 方法：\n\n```csharp\npublic override double Area()\n{\n \
    \   return 2 * Math.PI * x * x + 2 * Math.PI * x * y;\n}\n```\n\n所有这些方法都使用了 `override`\
    \ 修饰符，使它们能够重写基类中的 `Area` 方法。\n\n点的面积显然是零。它将使用基类返回的值。当你创建这些类时，在构建派生类时先构建基类是非常重要的。\n\
    \n例如：\n\n```csharp\npublic Cylinder(double r, double h): base(r, h)\n{\n}\n```\n\
    \n在这个构造函数中，`base` 关键字用于在构建圆柱对象之前调用基类构造函数。这样做是为了将参数 `h` 和 `r` 传递给基类中相应的字段。以下是完整的示例：\n\
    \n![](img/00139.jpeg)\n![](img/00075.jpeg)\n![](img/00075.jpeg)\n![](img/00140.jpeg)\n\
    ![](img/00141.jpeg)\n![](img/00142.jpeg)\n\n当你运行此程序时，会被要求输入两个代表半径和高度的数字。然后它将显示圆、球和圆柱对应的面积。\n\
    \n![](img/00143.jpeg)\n\n### 抽象类和方法\n\n抽象类的目的是被其他类继承。它不能被实例化。抽象方法默认是虚方法。它只能存在于抽象类内部。如本示例所示，使用\
    \ `abstract` 关键字声明抽象类或抽象方法：\n\n```csharp\nabstract class MyBaseClass // 抽象类\n\
    {\n    public abstract void MyMethod(); // 抽象方法\n    ...\n}\n```\n\n抽象类可能包含抽象方法和属性。当抽象类被继承时，派生类必须实现其所有的方法和属性。如你在上面的代码段所示，抽象方法不包含任何实现。实现位于派生类的重写方法内部。在抽象方法声明中不允许以下关键字：\n\
    \n*   `Static`\n*   `Virtual`\n\n给 C++ 程序员的提示：抽象方法等同于 C++ 中的纯虚函数。抽象属性与抽象方法类似，仅声明方式不同。以下示例演示了抽象类、方法和属性。\n\
    \n![avatar_medium](img/00144.jpeg) ![avatar_medium](img/00144.jpeg) ![avatar_medium](img/00144.jpeg)\n\
    ![](img/00145.jpeg)\n![](img/00146.jpeg)\n\n### 方法重载\n\n方法重载意味着你可以给多个方法赋予相同的名称，并让编译器根据参数的数量和类型加载适当的方法。如果方法的目的相似，那么使用方法重载可能是合适的。例如，如果你想创建一个方法来返回整数的平方根，另一个方法来返回实数的平方根，你将对这两个方法使用相同的名称：\n\
    \n```csharp\nint SquareIt(int x)\ndouble SquareIt(double f)\n```\n\n然后，如果你使用以下调用：\n\
    \n```bash\nSquareIt(3.25);\n```\n\n编译器将调用方法 `SquareIt(double f)`，它使用了实数参数。\n\n\
    当你使用以下调用时：\n\n```bash\nSquareIt(44);\n```\n\n编译器将调用方法 `SquareIt(int x)`，它使用了整数参数。返回类型对重载没有影响。这意味着方法可能具有相似的名称和返回类型，但编译器仍然像下面的示例一样区分它们：\n\
    \n```csharp\nvoid SquareIt(int x)\nvoid SquareIt(double f)\n```\n\n注意：特定方法与调用之间的绑定是在程序运行之前的编译时完成的。这被称为静态绑定或早期绑定，与虚方法使用的动态绑定或晚期绑定相对。也可以重载使用相同类型但不同参数数量的方法。例如：\n\
    \n```csharp\nvoid Method(int a)\nvoid Method(int a, int b)\n```\n"
- fmt: "\nWhen the method returns the variable, `myVariable` will retain the changes\
    \ that occurred to it in `MyMethod`.\n\n### Using `out`\n\nThe `out` keyword does\
    \ the same work as the `ref` keyword when used as a parameter modifier. It does\
    \ not require initializing the variable before passing it to the method, but it\
    \ does require initializing the variable in the method itself. For example, the\
    \ method might look something like this:\n\n```csharp\nvoid MyMethod(out string\
    \ myVariable)\n{\n    myVariable = \"This is my string\";\n}\n```\n\nIn order\
    \ to call this method, use the `out` keyword:\n\n```csharp\nMyMethod(out myVariable);\n\
    ```\n\nThe variable `myVariable` might not be initialized at all. It will be assigned\
    \ the value `\"This is my string\"` when the method returns to the caller. Notice\
    \ that the `out` keyword is used in both the method header and the call. It is\
    \ possible to use more than one parameter, as in this example:\n\n```csharp\n\
    void YourMethod(out int x, out int y, out int z)\n{\n    ...\n}\n```\n\nThis method\
    \ is called in the same way:\n\n```csharp\nYourMethod(out m, out n, out l);\n\
    ```\n\n**Note**- It is not enough to have different parameter modifiers in order\
    \ to overload a method. Methods must also be different in the type of parameters\
    \ they use.\n\nIn the following example the `out` keyword is used to pass an uninitialized\
    \ array to the method `MyMethod`. when the method returns to `Main`, its elements\
    \ are initialized.\n\n![](images/00154.jpeg)\n![](images/00155.jpeg)\n![](images/00156.jpeg)\n\
    \n### Using `params`\n\nThe keyword `params` is used with arrays. It lets you\
    \ pass any number of parameters to a method without the need to declare them in\
    \ an array. This keyword is required only in the method declaration. For example,\
    \ the method:\n\n```csharp\nstatic void MyMethod(params object[] myObjArray)\n\
    ```\n\ncan be called like this:\n\n```csharp\nMyMethod(123, 'A', \"My original\
    \ string\");\n```\n\nThe parameters passed in this call are all of the type `object`,\
    \ which means they can include any types descended from the `object` class. Consider\
    \ also the following method:\n\n```csharp\nstatic void MyMethod(params int[] myIntArray)\n\
    ```\n\nThis method can be called by passing a group of integers that constitute\
    \ an integer array regardless of its length, for example:\n\n```csharp\nMyMethod(2,\
    \ 4, 7);\n```\n\nAny method that uses the `params` keyword cannot use more than\
    \ one parameter. In the following example, the use of the `params` keyword in\
    \ the declaration of the method is demonstrated. It also demonstrates the overloading\
    \ of two methods with the same name and different parameters.\n\nOne method uses\
    \ an object array and the second method uses an integer array. Both methods change\
    \ the content of the array passed to it. The content of each array is displayed\
    \ before and after the change takes place inside the method.\n\n![](images/00157.jpeg)\n\
    ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)\n\
    ![](images/00158.jpeg)\n![](images/00159.jpeg)\n![](images/00160.jpeg)\n![](images/00161.jpeg)\n\
    ![](images/00162.jpeg)\n\n### Indexers\n\nUsing indexers, you can treat classes\
    \ as if they were arrays or collections; that is, you can access the indexer’s\
    \ elements by using square brackets (`[]`). An indexer is similar to properties\
    \ in that it also uses the accessors `get` and `set` to express its characteristics.\
    \ The declaration of the indexer takes the form:\n\n```csharp\nindexer-type this\
    \ [parameter-type parameter]\n{\n    get {};\n    set {};\n}\n```\n\nwhere:\n\n\
    * `indexer-type` is the type of the indexer.\n* `parameter-type` is the type of\
    \ the parameter.\n* `parameter` is a parameter or a parameter list.\n\nThe keyword\
    \ `this` points to the object to which the indexer belongs. Although the indexer\
    \ doesn’t have a name, it is recognized by its signature (types and number of\
    \ parameters).\n\nIt is possible to modify the indexer declaration with the keyword\
    \ `new` or one of the access modifiers.\n\nIn the following example, you declare\
    \ an array and an indexer of the type `string`. Then the indexer is used to access\
    \ the elements of the object as if they were array elements.\n\n![](images/00163.jpeg)\n\
    ![](images/00164.jpeg)\n![](images/00165.jpeg)\n![](images/00166.jpeg)\n\n###\
    \ User-defined Operators\n\nBy using overloading, you can invent new roles for\
    \ some operators. The need for this feature arises when you deal with objects.\
    \ In some cases, you might want to test the equality between two objects using\
    \ the equality operator (`==`). In this case, you redefine the equality operator\
    \ in your program to make it work with objects.\n\nOperator overloading is accomplished\
    \ by using the keyword `operator`, as shown in the following example:\n\n```csharp\n\
    public static Point operator+(Point p1, Point p2)\n{\n    // Implementation of\
    \ the + operator:\n}\n```\n\nThis example overloads the `+` operator in order\
    \ to use it in adding two objects of the type `Point`. Adding two points means\
    \ adding the `x` and `y` coordinates of each point. If the coordinates of the\
    \ first point are `(x1, y1)` and the coordinates of the second point are `(x2,\
    \ y2)`, the result is a new point at the location `(x1+x2, y1+y2)`. These details\
    \ should be included in the implementation of overloading the operator `+`.\n\n\
    Notice in the syntax that the redefined `+` operator follows the keyword `operator`.\
    \ Other examples are:\n\n* `Operator +`\n* `Operator –`\n* `Operator ==`\n\nThe\
    \ method used for operator overloading is always `static`. The following table\
    \ lists the operators that can be overloaded. The operators that are classified\
    \ as binary operate on two operands, such as `+` and `*`. The operators that are\
    \ classified as unary operate on one operand, such as `++` and `--`.\n\n![fractal-tree2](images/00055.jpeg)\
    \ ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)\n![](images/00167.jpeg)\n\
    ![](images/00168.jpeg)\n![](images/00169.jpeg)\n![](images/00170.jpeg)\n![](images/00171.jpeg)\n\
    \n### Overriding the `ToString` Method\n\nThe `ToString` method is one of the\
    \ most important methods in the .NET library as it always works in the background\
    \ with the methods `Console.Write` or `Console.WriteLine`. It is used to convert\
    \ an expression to a string. As you know, you can use it explicitly like this:\n\
    \n```csharp\nConsole.WriteLine(myVariable.ToString());\n```\n\nbut if you omit\
    \ the `ToString` method, which is always the case since it is embedded, you still\
    \ get the same result. This method is an `override` method defined in the class\
    \ `System.AppDomain` as follows:\n\n```csharp\npublic override string ToString();\n\
    ```\n\nIn some cases you might need to override it to change its behavior, such\
    \ as when you would like to display an object as if it were a regular variable.\
    \ Instead of displaying a `Point` object like this (as in the example above):\n\
    \n```csharp\nConsole.WriteLine(\"Point #1: ({0},{1})\", p1.x, p1.y);\n```\n\n\
    you can display it like this:\n\n```csharp\nConsole.WriteLine(\"Point #1: {0}\"\
    , p1);\n```\n\nTo do that, you must override the `ToString` method to be able\
    \ to display objects of type `Point`. Here is an example of the code to do this:\n\
    \n```csharp\n// Overriding the ToString method:\npublic override string ToString()\n\
    {\n    return (String.Format(\"({0}, {1})\", x, y));\n}\n```\n\nIn this code segment,\
    \ the `String.Format` method replaces the format items, `{0}` and `{1}`, with\
    \ the text equivalent to the value of the specified objects, `x` and `y`. Thus,\
    \ the output of this method would be the values of the point `(x, y)`. You can\
    \ add this method to the preceding example and display the `Point` objects directly\
    \ as single variables.\n\n![](images/00172.jpeg)\n![fractal-tree2](images/00055.jpeg)\
    \ ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)\n\n\
    **Summary:**\n\n![](images/00173.jpeg)\n![avatar_medium](images/00174.jpeg) ![avatar_medium](images/00174.jpeg)\
    \ ![avatar_medium](images/00174.jpeg) ![avatar_medium](images/00174.jpeg)\n"
