    USER DEFINED EXCEPTIONS-


    ![](images/00247.jpeg)


    ![](images/00248.jpeg)


    ![](images/00249.jpeg)


    ![](images/00250.jpeg)


    ![](images/00251.jpeg)


    ![](images/00252.jpeg)


    ![](images/00253.jpeg)


    ![](images/00254.jpeg)


    Rethrowing Exceptions-


    Sometimes you need to rethrow an exception. Consider this scenario: An exception
    handler is taking care of an exception inside some method, but in order to get
    more information on the error, it has to throw the exception to another method
    or back to the Main method to get this information or to do further handling.


    To rethrow an exception, use the keyword throw without parameters, as shown in
    this example:


    catch


    {


    throw;


    }


    It is also possible for the catch block to throw the same exception associated
    with a message that adds additional information about the problem:


    catch (DivideByZeroException e)


    {


    throw (new DivideByZeroException("Dividing by zero occurred in


    MyMethod()", e));


    }


    Rethrowing the Exception Back to Main-


