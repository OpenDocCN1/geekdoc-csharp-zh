    # CHAPTER ∞ 1 ∞

    ## ( Introduction To C# & .NET )


    ### Introduction


    ### C#: The OOP Language


    The `C# 2005` version (also referred to as `C# 2.0`) added even more powerful
    features to the language such as generics, partial classes, and much more. The
    new features of `C# 3.0` that were released in the `Technology.`


    `C#` was built from the ground up as an `OOP` language. That means you cannot
    create a program without building your classes first and having the fields and
    methods (the class members) inside their classes. `C#` was an evolution of `C++`,
    and solved a lot of issues that have always faced `C++` programmers. For example,
    it got rid of pointers that wasted programmers’ time and effort in resolving associated
    problems such as memory leaks.


    It also got rid of multiple class inheritance, which caused more problems than
    benefits. In addition, the generics feature that came with `C# 2005` was useful
    and easier to use than `C++ templates`. In the next sections, the differences
    between the two languages are discussed in detail.


    ### The .NET Framework


    The `.NET Framework`, introduced by Microsoft in 2002, is a programming platform
    and set of tools for building and running distributed applications in the Internet
    era. It also contains an object-oriented class library and a collection of reusable
    types (a type is a representation of data such as classes) that enable you to
    accomplish many programming tasks such as file access, string manipulation, and
    database management. The class library is categorized into modules (referred to
    as namespaces) and includes types that support a variety of applications such
    as:


    *   Console applications.

    *   Windows forms.

    *   ASP.NET applications.

    *   XML web services.

    *   Windows services.

    *   SQL Server applications.

    *   Small device applications.


    `C#` is one of the `.NET` languages that Microsoft developed. The other languages
    that use `.NET` are `Visual Basic .NET`, `J#`, and `Managed C++`, in addition
    to languages developed by other companies.

