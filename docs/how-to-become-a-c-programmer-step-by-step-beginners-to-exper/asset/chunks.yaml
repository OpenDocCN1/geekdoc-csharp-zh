    types, and parameters of methods. This is similar to function prototypes in C++.
    In the actual implementation, we will discuss the types that implement this interface.
    An interface might implement one or more interfaces, as shown in the following
    example:


    interface IMyInterface: Interface1, Interface2


    {


    // interface members


    }


    In this example, IMyInterface implements both Interface1 and Interface2.


    Interface Implementation-


    The interface can be implemented by a class or a struct as shown in this example:


    class MyClass: IMyInterface1


    {


    // class implementation


    }


    By this declaration the class MyClass is obligated to implement all members of
    the interface IMyInterface.


    It is also possible for a class to implement more than one interface:


    class MyClass: IMyInterface1, IMyInterface2


    {


    // class implementation


    }


    A class can also implement another class in addition to the interfaces:


    class MyClass: MyBaseClass, IMyInterface1, IMyInterface2


    {


    // class implementation


    }             


    In the following example, the class Point implements the interface IPoint. Notice
    that all the fields are included in the class but none are included in the interface.


    ![](images/00197.jpeg)


    ![](images/00198.jpeg)


    ![](images/00199.jpeg)


    ![](images/00200.jpeg)


    ![](images/00201.jpeg)


    Notes about the preceding example:


    1. If you don’t implement all the members of the interface, you get a compilation
    error. Try commenting the properties (Myx and Myy) in the class to see the compiler
    error message.


    2. Notice that the class can contain members other than the members of the interface,
    such as the method DisplayMyPoint.


    3. Notice also that it is possible to pass a parameter of the type IPoint to the
    method DisplayMyPoint. You can, of course, pass a parameter of the type Point
    instead.


    Explicit Interface Implementation-


    Consider a class, MyClass, that implements an interface, IMyInterface. It is possible
    to implement the interface member, MyMethod, like this:


    string IMyInterface.MyMethod()


    {


    // interface implementation


    }


    In this example, MyMethod is qualified by the interface name,


    IMyInterface:


    IMyInterface.MyMethod()


    This is called explicit interface implementation. Assume that you created an object
    from MyClass using the following statement:


    MyClass mc = new MyClass();


    You can also create an interface object by casting the class object:


    IMyInterface mi = (IMyInterface) mc;


    In this case, you can only access MyMethod through the interface object mi. For
    example:


    Console.Write(mi.MyMethod());


    Attempting to access MyMethod through the class member mc would generate a compilation
    error:


    Console.Write(mc.MyMethod()); // error


    So, when do you need to use this code? There are cases in which the use of explicit
    interface implementation becomes necessary, such as when the class is implementing
    two interfaces and both interfaces contain a method named MyMethod. If the first
    interface object is mi1 and the second interface object is mi2, accessing MyMethod
    through interface objects does not cause any ambiguity. That is:


    Console.Write(mi1.MyMethod());


    Console.Write(mi2.MyMethod());


    In fact, using the class object to access the method will cause ambiguity. The
    following example demonstrates a temperature converter that converts from Fahrenheit
    to Celsius and vice versa. The program contains two interfaces: ITemp1 and ITemp2\.
    Each contains a method named Convert. The class TempConverter explicitly implements
    the two interfaces. In the Main method, two interface objects, iFC and iCF, are
    used to access the Convert method.


    ![](images/00202.jpeg) ![](images/00203.jpeg) ![](images/00204.jpeg)


    Using as to Test Types-


    The operator as is used to convert an expression to a specified reference type.
    It is used according to the form:


    expression as type


    where:


    type is a reference type.


    expression is the object to be converted.


    If the conversion is successful, it returns the value of the expression; null
    otherwise. This expression is equivalent to casting expression with type except
    that it doesn’t throw an exception if the conversion fails. The expression is
    equivalent to the following conditional expression:


    expression is type ? (type) expression : (type) null;


    In the following example, the method TestType is used to test objects of various
    types.


    Notice that only reference-type objects are converted.


    ![](images/00205.jpeg)


    ![](images/00206.jpeg)


    ![](images/00207.jpeg)


    .


    Hiding Members of the Base Class-


    You’ve already used the new operator to create objects. Another use of the new
    operator is to modify declarations of the inherited members in order to hide members
    with the same names in the base class. Suppose that you have a base class that
    contains a method called MyMethod:


    public class MyBaseClass


    {


    public int myInt;


    public void MyMethod() // MyMethod on the base class


    {


    // ...


    }


    }


    When this class is inherited, the derived class will inherit all its members.
    Suppose that you would like to declare a new member with the same name, MyMethod,
    in the derived class. You can do that by using the new modifier, as shown in this
    example:


    public class MyDerivedClass: MyBaseClass


    {


    new public void MyMethod() // MyMethod on the derived class


    {


    // ...


    }


    }


    The job of the new modifier here is to hide the member with the same name in the
    base class. A method that uses the new modifier hides properties, fields, and
    types with the same name. It also hides the methods with the same signatures.
    In general, declaring a member in the base class would hide any members in the
    base class with the same name. If you declare MyMethod in the above example without
    the new modifier, it still works, but you will get a compiler warning:


    ''MyDerivedClass.MyMethod()'' hides inherited member


    ''MyBaseClass.MyMethod()''. Use the new keyword if hiding was intended.


    Notice the following when you use the new modifier:


    You cannot use new and override in the same declaration. If you do that you get
    the compiler error:


    A member ''MyDerivedClass.MyMethod()'' marked as override cannot be marked as
    new or virtual


    .


    It is possible, though, to use virtual and new in the same declaration. This emphasizes
    your intention to hide the member in the base class and start a new point of specialization
    in the inheritance hierarchy.


    Versioning-


    Using the new modifier to hide the inherited members is similar to overriding
    methods using the override modifier. Both are used to design a new version of
    a program while maintaining backward compatibility with previous versions of the
    program. For example, assume that you are inheriting a class produced by Acme
    Company called AcmeClass:


    public class AcmeClass // Acme class


    {


    // ...


    }


    public class MyClass: AcmeClass // your class


    {


    // ...


    }


    Suppose that you needed to add a method of your own named MyMethod,


    like this:


    public class MyClass: AcmeClass


    {


    public virtual MyMethod()


    {


    // The new method in your program.


    }


    // ...


    }


    Your program was working just fine until Acme produced a new version of its program
    that includes a method called MyMethod, which does the same work:


    public class AcmeClass


    {


    public virtual MyMethod()


    {


    // The new method in Acme''s program v2.0.


    }


    // ...


    }


    Now you have a problem. The solution is to just use the new modifier to declare
    MyMethod in your program. This will emphasize your intention to hide the method
    MyMethod in the second version of AcmeClass. For example:


    public class MyClass: AcmeClass


    {


    public new virtual MyMethod()


    {


    // ...


    }


    }


    Problem solved.


    You can, as an alternative, use the override modifier if you plan to override
    MyMethod in the base class. In the following example, the class MyDerivedClass
    inherits the class MyBaseClass. Each class contains a member class called MyClass.'
