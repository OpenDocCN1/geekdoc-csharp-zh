  trans: "\n\n# 支持。\n\n## 在命令行环境中编译程序\n\n在以下两种情况下你可以使用命令行环境：\n\n* 你仅有 .NET Framework\
    \ 自带的编译器。\n* 你拥有了 C# Express 自带的 Visual Studio IDE。\n\n### 如果你有编译器但没有 IDE\n\n\
    如果你只下载了 C# 命令行编译器，在使用之前必须将其包含在路径中。你可以通过将编译器的位置添加到 Windows 环境的 `PATH` 变量中来实现这一点。编译器位于以下目录：\n\
    \n`%windir%\\Microsoft.NET\\Framework\\<version>`，其中：\n\n* `%windir%` 是指示 Windows\
    \ 目录位置的环境变量。如果你使用的是 Windows XP，此变量被替换为 `\"C:\\WINDOWS。`。\n* `<version>` 是 .NET\
    \ Framework 的版本。最新版本是 `v2.0.50727`，这使得位置变为 `%windir%\\Microsoft.NET\\Framework\\\
    v2.0.50727.`。\n\n要将编译器的位置添加到路径，请按照以下步骤操作：\n\n1. 点击“开始”菜单。\n2. 选择“所有程序”。\n3. 选择“辅助工具”。\n\
    4. 点击“命令提示符”。\n5. 当命令提示符窗口打开时，输入以下命令：\n\n```\nset path=%path%;%windir%\\Microsoft.NET\\\
    Framework\\v2.0.50727\n```\n\n图 1-5 显示了设置路径前后 `csc` 命令的响应，假设你正在编译一个名为 `myProg.cs`\
    \ 的文件。\n\n注意，在设置路径之前，操作系统无法识别 `csc` 命令。当输入 `set path` 命令后，编译顺利完成。\n\n![](img/00011.jpeg)\n\
    \n### 如果你有 Visual Studio IDE\n\n如果你下载了 IDE，则就不需要设置路径。只需按照以下步骤打开 Visual Studio\
    \ 命令行提示符：\n\n1. 点击“开始”菜单。\n2. 选择“所有程序”。\n3. 选择“Microsoft Visual Studio”。\n4. 选择“Visual\
    \ Studio 工具”。\n5. 点击“Visual Studio 命令提示符”。\n\n这会打开如图 1-6 所示的窗口。它还将命令行编译器（`csc.exe`）的位置添加到路径中，在这种情况下，你可以从任何目录访问命令行编译器。\n\
    \n图 1-6 显示了 Visual Studio 2005 命令提示符窗口中 `csc` 命令的响应。\n\n![](img/00012.jpeg)\n\n\
    ## C# 与 C++ 的比较\n\n如果你来自 C++ 背景，以下信息对你将非常有用，因为它们包含了这两种语言的比较；\n\n表 1-1：C# 和 C++\
    \ 的比较\n\n![](img/00013.jpeg)\n![](img/00014.jpeg)\n\n## 1-7 C# 2005 的特性\n\n![](img/00015.jpeg)\n\
    ![](img/00016.jpeg)\n\n### 总结：在本章中：\n\n* 你了解了面向对象编程的概述，以及 C# 如何从零开始构建成一种 OOP 语言的。\n\
    * 你学习了 .NET Framework 及其元素：类库和公共语言运行时（`CLR`）。\n* 你还学习了通用语言规范（CLS）和通用类型系统（CTS）以及它们在创建支持\
    \ .NET 的语言中的作用。\n* 你学习了程序集以及它们如何通过程序集元数据（manifest metadata）进行自描述。\n* 你还概述了 C#\
    \ 代码，并检查了 `.dll` 文件和可执行文件的 IL 代码和程序集。\n* 你还看到了从 C++ 演变来的 C# 的比较。\n* 最后，你全局地查看了\
    \ C# 2005 的新特性，这些特性将在书中进行解释。\n\n![STAR-LOGO-2013](img/00004.jpeg)\n\n# 第 ∞ 2 ∞\
    \ 章\n(你的第一个 C# 程序)\n\n## 引言\n\n### 让我们开始你的第一个 C# 程序\n\n用一个在屏幕上显示“Hello, World!”的示例来介绍新语言是很常见的。这里是\
    \ C# 版本：\n\n示例 2-1\n\n```csharp\n// Example 2-1.cs\n// C# 的第一个程序\nclass HelloWorld\n\
    {\n    static void Main()\n    {\n        System.Console.WriteLine(\"Hello, World!\"\
    );\n    }\n}\n```\n\n输出：\n`Hello, World!`\n\n### 编译并运行程序\n\n将程序文本输入记事本文件，或使用任何其他文本编辑器，并将其保存为如\
    \ `First Program.cs` 的名称。某些文本编辑器会强制文件名具有 `.txt` 扩展名。\n\n虽然 C# 编译器不在乎文件扩展名，但 `.cs`\
    \ 通常用于 C# 程序。使用以下命令在命令行环境中编译程序：`csc First Program.cs`\n\n此编译将生成可执行文件 `FirstProgram.exe`。通过输入其名称（`First\
    \ Program`）并按回车运行程序。这将在你的屏幕上显示“Hello, World!”。\n\n**注意-**\n\n如果你使用 Visual Studio\
    \ IDE 构建程序，可以像后续章节说明的那样使用应用程序。\n\n在接下来的部分中将解释“Hello, World!”程序的主要特性。\n\n### 注释--\n\
    \n示例中的前两行包含注释：\n\n```csharp\n// Example 2-1.cs\n// C# 的第一个程序\n```\n\n示例中的 `//`\
    \ 字符是注释，会被编译器忽略。你也可以使用 `/*` 和 `*/` 将多行转换为单条注释。例如：\n\n```csharp\n/* 这是一个注释。\n这是另一行注释。\n\
    这是第三行注释。 */\n\n### 2-1-3 类声明\n\n对于任何 C# 程序，要记住的一点是一切都在类或结构体中。当前示例中的类是 `HelloWorld`。像\
    \ C++ 一样，C# 是区分大小写的。类的体位于大括号（`}`）之间。类包含字段和方法等成员。\n\n```csharp\nclass HelloWorld\n\
    ```\n\n名称位于关键字 `class` 之后，它是小写的。\n\n### Main 方法\n\n如上所述，每个 C# 程序必须有一个名为 `Main`\
    \ 的方法。该方法类似于 C++ 的 `main` 函数。注意 `Main` 方法以大写字母开头。\n\n**注意：**\n\n函数和方法没有区别；它们执行相同的工作。事实上，一些来自\
    \ C++ 背景的作者仍使用“函数”来指代方法。在本书中我们使用“方法”。除非程序包含 `Main` 方法否则无法生成可执行文件。注意 `static` 关键字（后文介绍），它修饰该方法。方法的类型可以是\
    \ `void`，这意味着方法没有返回值，如下：\n\n```csharp\nstatic void Main()\n{\n```\n\n它也可以是 `int`，这意味着它返回一个整数：\n\
    \n```csharp\nstatic int Main()\n{\n    return 0;\n}\n```\n\n`Main` 方法还有其他使用参数的形式，例如：\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n}\n```\n\n以及\n\n```csharp\nstatic\
    \ int Main(string[] args)\n{\n    return 0;\n}\n```\n\n`Main` 方法的参数将在第 4 章解释。\n\
    \n### 使用 .NET 方法显示结果\n\n如示例 2-1 所示，它的目的是使用 `WriteLine` 方法显示字符串“Hello, World!”该方法不是\
    \ C# 语言的一部分。`WriteLine` 是一个 .NET 方法。\n\n如第 1 章所述，.NET 类库被划分为命名空间，命名空间包含类。`WriteLine`\
    \ 方法是 `System` 命名空间中 `Console` 类的成员。因此，在使用此类方法时，你必须使用全称，包括命名空间和类名，如下所示：\n\n```csharp\n\
    System.Console.WriteLine();\n```\n\n要显示文本，你将其包含在方法括号内的双引号中：\n\n```csharp\nSystem.Console.WriteLine(\"\
    Hello, World!\");\n```\n\n"
- fmt: "\nA C# statement ends with a semicolon. This is the way the compiler recognizes\
    \ the statements and separates them from each other. You can also use the method\
    \ `Write`, which belongs to the same `.NET` class and does the same job.\n\nThe\
    \ only difference between the two methods is that `WriteLine` includes a carriage\
    \ return and a linefeed, which makes the cursor move to the next line. Successive\
    \ `WriteLine` statements display each output on a separate line.\n\n![](images/00017.jpeg)\n\
    ![](images/00018.jpeg)\n\n## Using Directives\n\nYou might be wondering, “Do I\
    \ always have to write this long line of text in order to display one string?”\
    \ The answer is no. A shorter way to display a string is by using directives.\n\
    \nFor example: `using System;` Add this directive to the beginning of your program\
    \ outside any of the classes. Notice also that directives, like language statements,\
    \ are followed by a semicolon.\n\nThis directive tells the compiler that you are\
    \ going to use the namespace `System` in your program. You can then use the `WriteLine`\
    \ statement without qualifying, like this:\n\n```\nConsole.WriteLine(\"Hello,\
    \ World!\");\n```\n\nYou still have to use the word `Console`, though, because\
    \ it is the name of the class that contains the method. When you use other `.NET`\
    \ statements that belong to other classes, though, the `using` directives can\
    \ save you a lot of typing.\n\nExample 2-2 shows the Hello, World! Program after\
    \ adding the directive.\n\n### Example 2-2\n\n```csharp\n// Example 2-2.cs\n//\
    \ The second program in C#\nusing System;\n\nclass HelloWorld\n{\n    static void\
    \ Main()\n    {\n        Console.WriteLine(\"Hello, World!\");\n    }\n}\n```\n\
    \nOutput:\n`Hello, World!`\n\n## Using Local Variables\n\nLocal variables are\
    \ declared inside methods. You can use local variables to store data of various\
    \ types. For example, in the previous program you could store the string “Hello,\
    \ World!” in a variable of the type `string`, like this:\n\n```csharp\nstring\
    \ myString = \"Hello, World!\";\n```\n\nThen you can display it by using the `WriteLine`\
    \ method like this:\n\n```csharp\nConsole.WriteLine(myString);\n```\n\nYou can\
    \ also display a message with the same statement:\n\n```csharp\nConsole.WriteLine(\"\
    The string is: \" + myString);\n```\n\nFollowing is a program that uses a local\
    \ variable and a text message. Example 2-3\n\n```csharp\n// Example 2-3.cs\n//\
    \ Local variables.\nusing System;\n\nclass MyClass\n{\n    static void Main()\n\
    \    {\n        string myString = \"Hello, World!\";\n        Console.WriteLine(\"\
    The string is: \"+ myString);\n    }\n}\n```\n\nOutput:\n`The string is: Hello,\
    \ World!`\n\nThe C# language contains many numeric data types, which are explained\
    \ in the following chapters. For example, you can declare an integer variable\
    \ like this:\n\n```csharp\nint myInt;\n```\n\nYou can also declare and initialize\
    \ the variable in the same statement:\n\n```csharp\nint myInt = 123;\n```\n\n\
    As you can see in the example, to initialize a variable you actually assign it\
    \ an initial value. You can declare the variable anywhere inside the method.\n\
    \nThe only rule to follow in using variables is to declare and initialize the\
    \ variable before using it. The C# language doesn’t let you use uninitialized\
    \ variables. If you try to use an uninitialized variable by displaying its value,\
    \ for example, you get the following error message from the compiler:\n\n`\"Use\
    \ of unassigned local variable <variable-name>\"`\n\nLike other languages, in\
    \ C# you can add numeric variables by using the `+` operator like:\n\n```csharp\n\
    int sum = myInt + yourInt;\n```\n\nTo display the value of a variable, use the\
    \ `Console.WriteLine` or `Console.Write` method:\n\n```csharp\nConsole.WriteLine(myInt);\n\
    ```\n\nYou can also display a numeric variable along with a message in one statement:\n\
    \n```csharp\nConsole.WriteLine(\"My integer = \" + myInt.ToString());\n```\n\n\
    The method `ToString`, in this statement, is a `.NET` method that is used to convert\
    \ a numeric data type to the string data type. In fact, you can drop the `ToString`\
    \ method because it is embedded in the `WriteLine` method.\n\nFor example:\n\n\
    ```csharp\nConsole.WriteLine(\"My integer = \" + myInt);\n```\n\nYou can also\
    \ use another form of the `WriteLine` method like this:\n\n```csharp\nConsole.WriteLine(\"\
    My integer = (0)\", myInt);\n```\n\nIn this form, `(0)` is replaced by the value\
    \ of the variable `myInt`. If you would like to display several variables with\
    \ one statement, you can use `(0)`, `(1)`, `(2)`, and so forth.\n\n```csharp\n\
    Console.WriteLine(\"My integer = (0), Your integer = (1)\", myInt,yourInt);\n\
    ```\n\nIn this statement, `(0)` is replaced by `myInt`, and `(1)` is replaced\
    \ by `yourInt`.\n\n**Question Wap:** ( WAP Means write a Program okay !)\n\nWrite\
    \ a C# program to add the values of two integer variables, then display the result\
    \ with an appropriate message.\n\n## The Program Architecture\n\nA C# program\
    \ may contain one or more files. Any file can contain any of the following elements\
    \ (explained in the following chapters):\n\n*   Directives.\n*   Namespaces. (which\
    \ can contain all other elements and namespaces)\n*   Classes.\n*   Structs. (structures)\n\
    *   Interfaces.\n*   Delegates.\n*   Enums. (enumerations)\n*   Function members.\
    \ (like methods, properties, indexers, and so forth)\n\nIf the program consists\
    \ of more than one file, only one `Main` method is required in one of the files.\
    \ In the following example, the program contains most of the elements mentioned\
    \ above. Although the program does not produce any output, it compiles and runs.\n\
    \n### Example\n\n```csharp\n// Example 2-4.cs\nusing System; // Directive\nnamespace\
    \ Namespace1 // Namespace\n{\n    class Class1 // Class\n    {\n    }\n}\n```\n\
    \n## Qualifying Names\n\nIn real life, if you have two coworkers named John, it\
    \ may be hard to distinguish between them unless you include the last name. In\
    \ programming, the complete name is referred to as the fully qualified name. When\
    \ dealing with program elements, using the last name is not enough.\n\nThe fully\
    \ qualified name includes the names of the namespace and the class. By using the\
    \ fully qualified name, you can use two methods that have the same name.\n\nIn\
    \ the following example, there are two classes that have the same name (`MyC2`).\
    \ If you use the fully qualified name for each, you can avoid ambiguity. For example:\n\
    \n`NSNS1.MyC1.MyC2`\n\nand\n\n`MyNS1.MyNS2.MyC2`\n\n### Example 2-5\n\n```csharp\n\
    // Example 2-5.cs\n// Fully qualified names\nnamespace MyNS1 // MyNS1\n{\n   \
    \ class MyC1 // MyNS1.MyC1\n    {\n        class MyC2 // MyNS1.MyC1.MyC2\n   \
    \     {\n        }\n    }\n    namespace MyNS2 // MyNS1.MyNS2\n    {\n       \
    \ class MyC2 // MyNS1.MyNS2.MyC2\n        {\n        }\n    }\n}\nnamespace MyNS3\
    \ // MyNS3\n{\n    class MyC3 // MyNS3.MyC3\n    {\n        static void Main()\n\
    \        {\n        }\n    }\n}\n```\n\n### Notice\n\nIn the above example that\
    \ the qualified name is written as a comment beside each element. The elements\
    \ in this example are described as follows:\n\nThe namespaces `MyNS1` and `MyNS3`\
    \ are contained in the global namespace that represents the root of the tree;\
    \ therefore, their names are already fully qualified.\n\n*   The namespace `MyNS2`\
    \ is contained inside the namespace `MyNS1`; therefore, its fully qualified name\
    \ is `MyNS1.MyNS2`.\n*   The class `MyC1` is contained inside the namespace `MyNS1`;\
    \ therefore, its fully qualified name is `MyNS1.MyC1`.\n*   The first instance\
    \ of class `MyC2` is contained inside the class `MyC1`; therefore, its fully qualified\
    \ name is `MyNS1.MyC1.MyC2`.\n*   The second instance of class `MyC2` is contained\
    \ inside the namespace `MyNS2`; therefore, its fully qualified name is `MyNS1.MyNS2.MyC2`.\n"
