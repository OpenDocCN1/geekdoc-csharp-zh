    ### 读取键盘输入


    要从键盘读取输入，请使用 .NET 方法 `ReadLine()`。它读取你在按下回车键之前在命令行中输入的任何内容。因此，你应该预期该方法会读取字符串。例如，


    以下语句：


    ```csharp

    string myString = Console.ReadLine();

    ```


    从命令行读取数据值并将其存储在变量 `myString` 中。在下面的示例中，你从键盘输入一个数字，程序读取并将其存入变量 `theNumber` 中，然后用适当的消息将其显示。


    ![](img/00051.jpeg)


    尽管程序显示了你从键盘输入的相同数字，但它实际上是一个字符串。如果你尝试将其与整数相，编译器将发出错误：


    Cannot implicitly convert type ‘string’ to ‘int’.


    ### 将字符串转换为数字


    从键盘读取的字符串可以使用后续节中解释的转换方法转换为任何类型。


    ### 使用 `Convert` 类


    `Convert` 类属于 `System` 命名空间。你可以用它将字符串转换为另一种类型（例如整数），如下所示：


    ```csharp

    int myInt = Convert.ToInt32(myString);

    ```


    也可以在同一语句中为数字添加另一个值：


    ```csharp

    int myInt = Convert.ToInt32(myString) + 20;

    ```


    ### 使用 `Parse` 方法


    将字符串转换为数字的第二方法是使用 `Parse()` 方法，这是 .NET 方法之一。它可以这样使用：


    ```csharp

    int myInt = Int32.Parse(myString);

    ```


    在此示例中，字符串 `myString` 被转换为整数 `myInt`。当然，你可以将其转换为其他类型：


    ```csharp

    long myLong = Int64.Parse(myString);

    float myFloat = Single.Parse(myString);

    decimal myDecimal = Decimal.Parse(myString);

    double myDouble = Double.Parse(myString);

    ```


    ![](img/00054.jpeg)


    示例运行：


    Please enter an integer: 12Input from the keyboard


    Your long number is: 12


    Your int number is: 12


    Your double number is: 12


    不用说，在这个程序中你不能输入包含小数点的数字，因为转换为 `int` 和 `long` 类型将产生异常。


    注意：在后续章节中，你将学习一种在不指定类型的情况下声明变量和数组的方法，如下所示：


    ```csharp

    var myVariable = 1.23;


    var yourVariable = "Hello, World!";


    var myArray = new int[] { 1, 2, 4, 8, 64 };

    ```


    在这种情况下，编译器（C# 3.0）将根据初始化时使用的值推断类型。


