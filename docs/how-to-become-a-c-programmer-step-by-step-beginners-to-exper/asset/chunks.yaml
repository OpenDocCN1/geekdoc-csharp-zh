    ![fractal-tree2](images/00019.jpeg) ![fractal-tree2](images/00019.jpeg) ![fractal-tree2](images/00019.jpeg)


    ![](images/00023.jpeg)


    ![STAR-LOGO-2013](images/00004.jpeg)


    CHAPTER


    ∞ 3 ∞


    (The C# Data Types and Use)


    Introduction-


    Data Types-


    In C#, there are two types of data:


    *   Value types: Variables that store data values on the stack.


    *   Reference types: Variables that store memory addresses of the data stored
    on the heap.


    There is also a third type of data, the pointer type, which is used in writing
    unsafe code. The pointer type is not covered in this book as it is added to the
    language for compatibility with C++. Although the C# language does not support
    pointers directly, it is possible for C++ programmers to write unsafe blocks of
    code and use pointers inside these blocks.


    Built-in Data Types-


    The built-in data types are aliases of types originally defined in the .NET class
    library. These types and the corresponding .NET types are shown in the following
    table.


    Table : C# built-in data types


    ![](images/00024.jpeg)


    Notice in the table that the word Object is a class in the .NET class library.
    It represents the root of all types. It is important to notice also that the C#
    object is lowercase. Needless to say, you can use either the C# type or the NET
    type in your code. For example, the following two statements are equivalent; they
    both declare an integer variable and assign the value 25 to it:


    int myInt = 25;


    System.Int32 myInt = 25;


    The following two statements are also equivalent; both declare a variable


    of the object type:


    object myObject;


    System.Object myObject;


    In Table 3-1, all types except the string and object types are called simple data
    types.


    Value Types-


    Value types include the numeric types (integers, floats, and so forth) and the
    Boolean type (bool). They also include user-defined types such as structs and
    enumerations. The following table shows the C# value types and a description of
    each type.


    Table 3-2: Value types-


    ![](images/00025.jpeg)


    Value types are stored on the stack, which is the region in memory used to store
    local variables and their data. All value types are implicitly derived from the
    Value Type class in the System namespace. Value types, however, cannot be inherited.


    Variable Initialization-


    To use a variable you must first initialize it with a value, as shown in the following
    examples:


    int myValue = 123;


    int myValue = 0;


    int myValue = new int();


    In the first example, we initialized the variable myValue with the value 123\.
    In the second example, it is initialized with zero.


    In the third example, the variable is also initialized with zero by using the
    keyword new, which calls the default constructor (a constructor is a method that
    initializes an instance of a class) that initializes the variable with its default
    value —zero in this case. This means that the last two statements are equivalent.


    3-3-2 Default Values-


    Each value type has a constructor that initializes it to its default value. The
    default value for each type is shown in the following table.


    Table 3-3: The default values for each value type


    ![](images/00026.jpeg)


    When using structs, you instantiate the struct by using the keyword new,which
    initializes the instance members with the default values.


    Following is an example of a struct that represents a point at the coordinates
    (x,y):


    struct Point


    {


    int x;


    int y;


