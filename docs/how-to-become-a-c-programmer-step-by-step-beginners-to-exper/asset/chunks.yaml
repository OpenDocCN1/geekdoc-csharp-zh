    All members of a class or a struct (except fields and constants) are classified
    as function members. If you are a c++ programmer you might compare this member
    function, which use the same concept.


    Function members are:


    *   Methods.


    *   Properties.


    *   Events.


    *   Indexers.


    *   User-defined operators.


    *   Constructors.


    *   Destructors.


    You learned about some of these members earlier, In Chapters 1 through 5, The
    rest will be explained in the following Chapters.


    Polymorphism-


    One important benefit of inheritance is code reusability. For example, if another
    programmer already created a class called Person, there is no need for you to
    rewrite the same class in order to create the Employee class or the PoliceMan
    class. Many characteristics of these classes are already included in the Person
    class. All you need to do is inherit the Person class and add to it the characteristics
    of Employee or PoliceMan.


    This will save you the effort of reinventing the wheel. The second benefit of
    inheritance is polymorphism. In programming, you deal with many kinds of user
    interface windows in the Microsoft Windows environment, such as message boxes
    that convey a message or a warning and windows for painting or writing.


    If you wrote, for example, a method called DrawWindow, you can associate this
    method with various objects that represent different kinds of windows. Based on
    the object associated with the method, the result would be different.


    Consider these examples:


    myButton.DrawWindow(); // draws a button


    myMsg.DrawWindow(); // draws a message box


    myPaintSurface.DrawWindow(); // draws a painting window


    The three objects — myButton, myMsg, and myPaintSurface — are not instances of
    the same class, but instances of other classes derived from the base class that
    contains the original DrawWindow method. Each object is used to invoke a new definition
    of the method DrawWindow.


    Virtual and Override Methods-             


    To use the polymorphic methods introduced in the preceding section, declare the
    DrawWindow method with the keyword virtual in the base class:


    public virtual void DrawWindow()


    {


    // The method definition in the base class.


    }


    Then, in each of the classes that inherit the base class, declare a


    DrawWindow method using the keyword override:


    public override void DrawWindow()


    {


    // The method definition in one of the derived classes.


    }


    The method declared with the keyword override is called an override method. It
    can override another method that has the same name, signature, and accessibility
    in the base class.


    When you override a method, you can change its original behavior in the derived
    class. An override method can override any of the methods declared with the following
    modifiers:


    *   Virtual.


    *   Abstract.


    *   Override.


    When a virtual method in a derived class has the same name, accessibility, and
    signature as that of another method in the base class but is not qualified with
    the override modifier, it simply hides the method of the base class. (More on
    hiding members of the base class in Chapter 8.)


    To make the method override the one in the base class, you must modify its declaration
    with the keyword override. An abstract method is implicitly a virtual method,
    and therefore, it can be overridden without using the virtual modifier (since
    it can’t use the virtual modifier anyway).


    Note


    You cannot use the virtual modifier with the following modifiers: Static, Abstract,
    or override.


    You cannot combine the override modifier with the following modifiers: Static,
    Abstract,virtual, or new.


    Calling Members of the Base Class-


    Sometimes when you inherit a class, the methods in the derived class can override
    methods in the base class. What if you wanted to call one of the overridden methods
    from within the derived class?


    The keyword base is the solution to this problem. To call an overridden method,
    such as GetInformation, you can call it by using this statement:


    base.GetInformation();


    This statement calls the original GetInformation method, which was overridden
    by a method with a similar name in the derived class.


    Note-  You cannot use the keyword base inside a static method.


    In other cases, you need to build the object of the class before you build the
    object of the derived class. You can also do that using the base keyword like
    the following example:


    public MyDerived(int x) : base(x)


    {


    // ...


    }


    This is the constructor of the class MyDerived, which builds the base class object
    on the fly. You need to do this in cases when constructing the base class is necessary
    to construct the derived class.


    For example, let’s say the base class represents the area of a circle, and the
    derived class represents an area of a sphere (which uses the area of a circle).
    In this case, you must instantiate the area of the circle before you can instantiate
    the area of the sphere (see Example 6-1).


    Note for C++ Programmers: Notice that this way of building the base class is equivalent
    to the initialization list in c++.


    Overriding Virtual Methods on the Base Class-'
