    Various Ways to Pass Parameters to Methods-


    There is more than one way to pass parameters to a method by reference. There
    are three parameter modifiers, each of which results in saving the changes of
    the variable values after the method returns to the caller. The three modifiers
    are:


    *   Ref.


    *   Out.


    *   Params.


    The three modifiers, however, have different uses, as explained in the following
    sections.


    Using ref-


    As you have seen in the preceding examples, the ref keyword is used to pass variables
    to a method and reflect back the changes that occurred on the original variables.
    When you use ref to pass a variable to a method, the variable must be initialized
    first; otherwise, you will get a compiler error.


    For example:


    string myVariable = "This my string";        // initialize the variable


    MyMethod(ref myVariable);                      // invoke the method'
