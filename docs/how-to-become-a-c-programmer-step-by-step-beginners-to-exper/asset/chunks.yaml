    ![](images/00061.jpeg)


    Nested if-else Statements-


    Although the if-else statement is intended for binary choice, it can be expanded
    to handle more complex choices. It is possible to build a whole ladder of nested
    if-else statements as shown in the following form:


    if (condition_1)


    statement_1;


    else if (condition_2)


    statement_2;


    else if (condition_3)


    statement_3;


    ...


    else


    statement_n;


    The conditions in the ladder are evaluated from the top down, and whenever a condition
    is evaluated as true, the corresponding statement is executed and the rest of
    the construct is skipped. If no condition has been satisfied, the last else will
    be brought into action.


    The switch Construct-


    The switch construct is used to select from multiple choices, such as selecting
