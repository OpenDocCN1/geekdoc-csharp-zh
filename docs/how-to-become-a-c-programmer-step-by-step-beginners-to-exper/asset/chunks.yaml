- fmt: "\n# Class implementation\n\n```csharp\n// Class implementation\n\n}\n```\n\
    \nThe class implementation (or class body) goes between the braces (`{ }`). You\
    \ can declare a struct in the same way by using the keyword `struct`:\n\n```csharp\n\
    struct MyStruct\n{\n\n// Struct implementation\n\n}\n```\n\nStructs are discussed\
    \ in detail in Chapter 7.\n\n## Field Initialization\n\nIn the following example,\
    \ you declare the class `Point`, which contains two fields — `x` and `y`:\n\n\
    ```csharp\nclass Point\n{\n    int x;\n    int y;\n}\n```\n\nYou can initialize\
    \ the fields with values like this example:\n\n```csharp\nclass Point\n{\n   \
    \ int x = 0;\n    int y = 0;\n}\n```\n\nThis declaration initializes the fields\
    \ `x` and `y` to their default values. Of course, you can use any other values\
    \ to initialize the fields.\n\n## Class Instantiation\n\nTo create objects from\
    \ the `Point` class, use the following statement:\n\n```csharp\nPoint myPoint;\
    \ // create the object\n```\n\nYou can also create the object and initialize the\
    \ fields in the same statement:\n\n```csharp\nPoint myPoint = new Point();\n```\n\
    \nNotice, however, that you cannot use an uninitialized object — this is the same\
    \ rule that applies to uninitialized variables. In the second statement, when\
    \ the object is created the default constructor is invoked to initialize fields\
    \ to their default values. You can, of course, create more than one instance from\
    \ the class:\n\n```csharp\nPoint p1 = new Point();\nPoint p2 = new Point();\n\
    ```\n\nThen you can assign each object its own coordinates:\n\n```csharp\np1.x\
    \ = 15;\np1.y = 22;\np2.x = 10;\np2.y = 12;\n```\n\nAs you can see from these\
    \ statements, the fields `x` and `y` are associated with the objects `p1` and\
    \ `p2`. In the following example, you see the complete picture of the class and\
    \ the object created from it.\n\nIn this example, the object is created in the\
    \ `Main` method, but you can create objects inside any other method. You cannot,\
    \ however, create an object inside the class itself.\n\n![](images/00099.jpeg)\n\
    \n## Namespaces\n\nA namespace is a container that includes classes and other\
    \ types. You can place the class inside a namespace. The benefit of using namespaces\
    \ is being able to fully qualify members included in the same namespace. If two\
    \ classes in two different namespaces have the same name, you can refer to each\
    \ one by using the fully qualified name, for example:\n\n`MyNameSpace.Class1`\n\
    `YourNameSpace.Class1`\n\n## Nesting Namespaces\n\nIt is also possible to nest\
    \ namespaces inside other namespaces. In that case, you need to use the fully\
    \ qualified names to distinguish between similar class names:\n\n`MyParentNameSpace.MyNestedNamespace.MyClass1`\n\
    `MyParentNameSpace.MyClass1`\n\nIn the following example, you declare two classes\
    \ that have the same name, `MyClass`. One class is contained in a namespace called\
    \ `MyNameSpace`, and the other is contained in a namespace called `YourNameSpace`.\n\
    \nIn the `Main` method, which lies in `MyNameSpace`, you instantiate both classes\
    \ and create the objects `mc1` and `mc2`. In order to instantiate the class in\
    \ `YourNameSpace` you have to use the fully qualified name of the class.\n\n![](images/00100.jpeg)\n\
    ![](images/00101.jpeg)\n![](images/00102.jpeg)\n\n## The Namespace Alias Qualifier\n\
    \nThere may be times when you want to use special names for your classes, such\
    \ as `System` or `Console`. It is obvious that these names will cause conflicts\
    \ with the .NET classes that have similar names.\n\nFor example, a class named\
    \ `System` would hide the `System` class of the .NET library. Although this is\
    \ not a common case, C# 2005 allowed for this possibility by adding the namespace\
    \ alias qualifier operator (`::`). You can use this operator to search the global\
    \ namespace for identifiers hidden by types or members in your code.\n\nThe `::`\
    \ operator goes between two identifiers, like this:\n\n```csharp\nglobal::System.Console.WriteLine(\"\
    Hello, World!\");\n```\n\nThe left-hand identifier that precedes the `::` operator\
    \ is where the search starts. The right-hand identifier is the identifier to look\
    \ for. When the left-hand identifier is the word “global,” the search starts at\
    \ the global namespace. Consider the following example in which a class named\
    \ `System` is used. This class name causes a problem that is solved only by using\
    \ the namespace alias qualifier, like this:\n\n```csharp\nglobal::System.Console.WriteLine(mc.myClassNumber);\n\
    global::System.Console.WriteLine(ms.mySystemNumber);\n```\n\nIf you try to use\
    \ the following statements instead, you get a compiler error:\n\n```csharp\nSystem.Console.WriteLine(mc.myNumber);\
    \ // error\nSystem.Console.WriteLine(ms.myNumber); // error\n```\n\n![](images/00103.jpeg)\n\
    ![](images/00104.jpeg)\n\n## Access Levels\n\nIt is a common practice that one\
    \ programmer creates a class, and then other programmers use that class in their\
    \ code. This code is usually called the client. One important feature of OOP is\
    \ encapsulation, which enables you, as a class creator, to protect your class\
    \ fields by restricting access to them.\n\nThe clients in this case can access\
    \ those fields only through public methods. You probably noticed that the keyword\
    \ `public` was used in most class declarations in the previous chapters. In this\
    \ section you learn about `public` and other keywords used for protecting types\
    \ and members. The following keywords can be used to restrict or permit access\
    \ to types and members:\n\n- `public`\n- `private`\n- `protected`\n- `internal`\n\
    \nThese keywords are referred to as access modifiers because they are used to\
    \ modify the declarations. For example:\n\n```csharp\npublic int MyMethod()\n\
    ```\n\nNote; The set of access modifiers is a subset of the C# modifiers, which\
    \ are used for different purposes. Access modifiers are used to create five access\
    \ levels, which are explained in the following table.\n\n![](images/00105.jpeg)\n\
    \nThe following table shows the default access levels and the allowed access levels\
    \ to use with different types (More on types in chapter 7 and 8). In the following\
    \ example, the `Point` class is used to demonstrate access levels.\n\n![](images/00106.jpeg)\n\
    \nNotes:\n- There are no access levels for namespaces.\n- For classes nested inside\
    \ others, the default access level is `internal`. The allowed access levels are\
    \ `public` or `internal`.\n\n![](images/00107.jpeg)\n![](images/00108.jpeg)\n\
    ![](images/00109.jpeg)\n\nThere are several parts of this example worth discussing:\
    \ The example contains three classes: `Point`, `MainClass`, and the containing\
    \ class, `OuterClass`. The `Main` method is placed inside a class other than the\
    \ `Point` class in order to test the effect of the access levels. Note that you\
    \ could not access the fields of the `Point` class if they did not have the `public`\
    \ modifier. To test that, change the `public` modifier to `private` or `protected`\
    \ and see the error message from the compiler.\n\nThe containing class, `OuterClass`,\
    \ is used as a container to the other classes so that we can give the `Point`\
    \ class the `private` access level (see Table 5-2). If you remove the outer class,\
    \ the compiler will complain about using the word private. The access level of\
    \ the outer class has no effect on the program though.\n\n## Properties\n\nThe\
    \ easiest way to protect the fields of a class is to use properties. The properties\
    \ are in fact methods like other member functions, but they facilitate the access\
    \ of the private fields by the client. The client can use the properties in the\
    \ same way it uses fields. The traditional method that is used in C++ is to dedicate\
    \ some functions for accessing the private fields.\n\nFor example:\n\n```csharp\n\
    set_MyPoint_x(); // C++\nget_MyPoint_x(); // C++\n```\n\nThe job of the first\
    \ function is to assign a value to the field `x`, and the job of the second function\
    \ is to read the value of that field. The C# properties are used like the following\
    \ example:\n\n```csharp\nprivate string item;\npublic string Item\n{\n    get\n\
    \    {\n        return item;\n    }\n    set\n    {\n        item = value;\n \
    \   }\n}\n```\n\nThe field `item` is declared private, and the property `Item`\
    \ is declared public. (This naming system is not mandatory but is a common convention.)\
    \ A property contains the method `get` to read the field and the method `set`\
    \ to assign a value to the field.\n"
