    ## String Type


    If you are familiar with C or C++, you might be aware of the difficulty of creating
    and manipulating strings. The C language does not contain the `string` keyword;
    instead a string is declared as a character pointer or a character array. This
    can cause some confusion for beginners as well as the possibility of memory leakage.
    C# solved this problem once and for all.


    You declare a string variable by using the `string` keyword and use it the same
    way you use other variable. In the background, the compiler does the chores C
    and C++ require you to do.


    ## String Expressions


    To declare a string variable, use the `string` keyword in a declaration like this:


    ```csharp

    string myString;

    ```


    You can, of course, initialize the string in the same statement:


    ```csharp

    string myString = "Welcome to the string world!";

    ```


    The string literal (data value) is placed between the quotation marks. You can
    also include any of the escape sequence characters, such as the new line character,
    in the string. For example:


    ```csharp

    string myString = "My friend,\nWelcome to the string world!";

    ```


    This statement displays the following:


    My friend,

    Welcome to the string world!


    In order to include any special characters in the string, such as a backslash
    or a quotation mark, you must precede the special character with a backslash.
    For example:


    ```csharp

    string myString = "To go to the next line use the new line character: \"\\n\"";

    ```


    This statement displays the following:


    To go to the next line use the new line character: "\n"


    As in C++, the double backslash is used in folder names (directories). For example:


    ```csharp

    string myDir = "C:\\Documents\\Letters\\friends.doc";

    ```


    ## String Operators


    To manipulate strings, you use the string operators, which are explained in the
    following sections.


