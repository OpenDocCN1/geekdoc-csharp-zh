    file. To generate the documentation file, use the compiler option “/doc” as shown
    below. If you save this program with the name Ex2-6.cs,


    you can compile it using the following command:


    csc /doc:Ex2-6.xml Ex2-6.cs


    The following documentation file (Ex2-6.xml) will be generated:


    <?xml version="1.0" ?>


    - <doc>


    - <assembly>


    <name>Tester</name>


