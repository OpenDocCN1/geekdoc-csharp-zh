    ## The Decimal Format


    To display a number preceded by a specified number of zeroes, use the format character
    `D` or `d`, like this example:


    ```csharp

    Console.WriteLine("{0:D5}", 123);

    ```


    The result of this statement is `00123`. The number following the letter `D` determines
    the number of decimal places in the output.


    ## The Fixed-point Format


    To display a number followed by a specified number of decimal places, use `F`
    or `f`, like these examples. The output of each statement is written next to it
    as a comment.


    ```csharp

    Console.WriteLine("{0:F2}", 12); // 12.00 - two decimal places

    Console.WriteLine("{0:F0}", 12); // 12 - no decimal places

    Console.WriteLine("{0:F0}", 12.3); // 12 - omitting fractions

    Console.WriteLine("{0:F2}", 12.3); // 12.30 - two decimal places

    ```


    ## The General Format


    To display a number in the default format, use the letter `G` or `g` like this:


    ```csharp

    Console.WriteLine("{0:G}", 1.2); // 1.2

    Console.WriteLine("{0:G}", 1.23); // 1.23

    ```


    As you can see in the comments that follow the statements, this is the same output
    produced by no formatting at all. The statements are then equivalent to these
    statements:


    ```csharp

    Console.WriteLine("{0}", 1.2);

    Console.WriteLine("{0}", 1.23);

    ```


    ## The Numeric Format


    To display a number with decimal points and commas, use the letter `N` or `n`,
    like this example:


    ```csharp

    Console.WriteLine("{0:N}", 1230000000);

    ```


    This statement gives the following output:


    `1,230,000,000.00`


    ## The Scientific Format


    To display a number in the exponential form, use the letter `E` or `e`, like this
    example:


    ```csharp

    Console.WriteLine("{0:E}", 12300000);

    ```


    The resulting number is:


    `1.230000E+007`


    ## The Hexadecimal Format


    To display a number in hexadecimal form, use the letter `X` or `x`, like these
    examples:


    ```csharp

    Console.WriteLine("{0:X}", 123); // 7B

    Console.WriteLine("{0:X}", 65535); // FFFF

    ```


    The hexadecimal output of each statement is shown in the comment following it.
