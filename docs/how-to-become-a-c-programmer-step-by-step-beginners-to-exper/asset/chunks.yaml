  trans: "\n在本节中，你将学习如何使用 `if` 和 `switch` 等选择语句在程序中构建条件。选择语句用于确定在程序中何时以及何时执行语句或一组语句。选择语句依赖于关系或逻辑表达式以及运算符。\n\
    \n## 关系运算符\n\n关系运算符（或比较运算符）用于构建关系（或布尔）表达式，以比较字面量、变量或表达式。以下是关系表达式的一些示例：\n\n```\n\
    x > y // x 大于 y\ny < 255 // y 小于 255\nmyInt == x + y // myInt 等于 x + y\n```\n\n\
    下表列出了 C# 中的关系运算符。\n\n![](img/00057.jpeg)\n\n关系表达式求值为真（true）或假（false）。这意味着结果是一个布尔（Boolean）值。如第\
    \ 3 章所述，与 C++ 不同，在 C# 中 `false` 的值不等于零，且 `true` 的值也不代表非零值。下面的示例演示了某些关系表达式的使用。\n\
    \n![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg)\n\
    \n示例 4.1-\n\n![](img/00058.jpeg)\n\n## 逻辑运算符\n\n逻辑运算符用于组合关系表达式以构建逻辑（或布尔）表达式。逻辑表达式也求值为真或假。某些运算符作用于两个操作数（二元），而另一些作用于一个操作数（一元）。\n\
    \n下表包含了常用的 C# 逻辑运算符及其描述。\n\n![](img/00059.jpeg)\n\n假设 `x` 等于 5 且 `y` 等于 10，以下是逻辑表达式的一些示例：\n\
    \n```\n(x > 5) && (y == 10) // false — 第二个操作数未被求值\n(x > 5) & (y ==10) // false\n\
    (x == 5) || (y == 12) // true — 第二个操作数未被求值\n(x == 5) | (y ==12) // true\n! (x\
    \ == 7) // true\n```\n\n这些示例将在后续章节中详细讨论。\n\n### 逻辑与 运算符 (&&, &)\n\n注意第一个示例，只要第一个操作数的求值为假，就不需要评估第二个操作数。这是因为在与逻辑运算中，如果其中一个操作数为假，整个表达式就会变为假。\n\
    \n这被称为“短路求值”。然而，在第二个示例中，两个操作数都会被求值以计算整个表达式。结果为假，是因为第一个操作数为为假，而第二个为真。只有当两个操作数都为真时，结果才可能为真。\n\
    \n### 逻辑或 运算符 (||, |)\n\n注意第三个示例，只要第一个操作数的求值为真，就不需要评估第二个操作数。这是因为在 `||` 操作中，如果其中一个操作数为真，整个表达式就会变为真。\n\
    \n这也称为短路求值。但在 `|` 示例中，两个操作数都会被求值以计算整个表达式。第一个操作数为真；因此，整个表达式求值为真。如果一个操作数为真，结果就可能为真。\n\
    \n### 逻辑非 运算符 (!)\n\n在第五个示例中，非逻辑运算符作用于一个操作数：\n\n```\n!(x == 7)\n```\n\n因为操作数是一个求值为假的表达式（记住\
    \ `x` 等于 5），该操作的结果为真。换句话说，`!true` 求值为假，而 `!false` 求值为真。\n\n该表达式也可以写成：\n\n```\n\
    (x != 7)\n```\n\n### 位运算符运算符\n\n逻辑运算符 `&&` 和 `||` 可以用于整型操作数，在这种情况下，它们计算操作数的位与和位或结果。下面的示例对两个整数（21\
    \ 和 4）执行位与和和位或操作，并以多种格式显示结果：\n\n```c\n// 十六进制:\nConsole.WriteLine(\"0x{0:x}\"\
    ,0x15 | 0x4); // 0x15\nConsole.WriteLine(\"0x{0:x}\",0x15 & 0x4); // 0x4\n\n//\
    \ 十进制:\nConsole.WriteLine(21 | 4); // 21\nConsole.WriteLine(21 & 4); // 4\n```\n\
    \n## if-else 结构\n\nif-else 结构用于构建条件语句。它的形式如下：\n\n```\nif (condition)\n    statement(s)_1\
    \ // 原始结果\nelse\n    statement(s)_2 // 备选结果\n```\n\n其中：\n- `condition` 是一个关系或逻辑表达式。\n\
    - `statement(s)_1` 是当 `condition` 为真时执行的语句（或语句块）。\n- `statement(s)_2` 是当 `condition`\
    \ 为假时执行的语句（或语句块）。\n\n注意，括号 [] 内的内容始终是可选的。正如 if-else 结构所示，你可以使用 `if` 关键字和原始结果来构建条件语句，如下例所示：\n\
    \n```csharp\nif (salary > 2000)\n    Console.Write(\"Salary is greater than 2k\"\
    );\n```\n\n你也可以添加可选部分来表示备选结果：\n\n```csharp\nif (salary > 2000)\n    Console.Write(\"\
    Salary is greater than 2k\");\nelse\n    Console.Write(\"Salary is less than or\
    \ equal to 2k\");\n```\n\n如果使用多个语句，请包含大括号 {} 内。例如：\n\n```csharp\nif (salary >\
    \ 2000)\n{\n    Console.WriteLine(\"Salary is greater than 2k\");\n    Console.WriteLine(\"\
    Bonus is applied\");\n}\nelse\n{\n    Console.WriteLine(\"Salary is less than\
    \ or equal to 2k\");\n}\n```\n\n原始结果可以是另一个 if-else 结构。例如，你可以通过以下算法测试字符是否：\n* 小写：显示相应的消息。\n\
    * 大写：显示相应的消息。\n* 如果字符不是字母，显示相应的消息。\n\n![avatar_medium](img/00055.jpeg) ![avatar_medium](img/00055.jpeg)\
    \ ![avatar_medium](img/00055.jpeg)\n\n该算法在下面的 C# 示例中进行了插图。\n\n示例 4-2-\n\n![](img/00060.jpeg)\n\
    \n![](img/00061.jpeg)\n\n## 嵌套 if-else 语句\n\n虽然 if 语句用于二进制选择，但它可以扩展以处理更复杂的选择。可以构建嵌套\
    \ if-else 语句，如下所示：\n\n```csharp\nif (condition_1)\n    statement_1;\nelse if (condition_2)\n\
    \    statement_2;\nelse if (condition_3)\n    statement_3;\n...\nelse\n    statement_n;\n\
    ```\n\n链中的条件从上到下求值，一旦某个条件求值为真，就会执行相应的语句并跳过结构的其余部分。如果没有条件被满足，将执行最后一个 `else`。\n\n\
    ## switch 结构\n\nswitch 结构用于从多个选择中进行，例如选择电梯楼层、自动售货机物品或从菜单中选择。在这些情况下，你选择可用选项之一。switch\
    \ 结构的形式如下：\n\n```csharp\nswitch (expression)\n{\n    case constant-1:\n      \
    \  statement(s)\n        jump-statement\n    case constant-2:\n        statement(s)\n\
    \        jump-statement\n    case constant-3:\n        ...\n    ...\n    default:\n\
    \        statement(s)\n        jump-statement\n}\n```\n\n其中：\n- `expression` 代表与相关的\
