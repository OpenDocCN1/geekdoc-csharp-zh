    and their descriptions.


    ![](images/00059.jpeg)


    The following are some examples of logical expressions assuming that x equals
    5 and y equals 10:


    (x > 5) && (y == 10) // false —The second operand is not evaluated


    (x > 5) & (y ==10) // false


    (x == 5) || (y == 12) // true — The second operand is not evaluated


    (x == 5) | (y ==12) // true


    ! (x == 7) // true


    These examples are discussed in detail in the following sections.


    The Logical AND Operators (&&, &)


    Notice in the first example that there is no need to evaluate the second operand
    as long as the first one is evaluated false. This is because in an AND operation,
    if one of the operands is false the whole expression becomes false.


    This is called short-circuit evaluation. In the second example, however, both
    operands are evaluated in order to evaluate the whole expression. The result is
    false because the first operand is false and the second is true. The result can
    be true only if both operands are true.


    The Logical OR Operators (||, |)


    Notice in the third example that there is no need to evaluate the second operand
    as long as the first operand is evaluated true. This is because in the || operation,
    if one of the operands is true the whole expression becomes true.


                  This is also called short-circuit evaluation. In the | example,
    however, both operands are evaluated in order to evaluate the whole expression.
    The first operand is true; therefore, the whole expression is evaluated true.
    The result can be true if one operand is true.


    The Logical NOT Operator (!)


    In the fifth example the NOT operator operates on one operand:


    !(x == 7)


    Because the operand is an expression that is evaluated false (remember that x
    equals 5), the result of the operation is true. In other words, “!true” is evaluated
    false and “!false” is evaluated true.


    This expression can also be written like this:


    (x != 7)


    The Bitwise Operators-


    The logical operators && and || can be used with integral operands, in which case
    they compute the bitwise AND and the bitwise OR of their operands. The following
    examples perform bitwise AND and OR operations on two integers (21 and 4) and
    display the results in several formats:


    // Hexadecimal:


    Console.WriteLine("0x{0:x}",0x15 | 0x4); // 0x15


    Console.WriteLine("0x{0:x}",0x15 & 0x4); // 0x4


    // Decimal:


    Console.WriteLine(21 | 4); // 21


    Console.WriteLine(21 & 4); // 4


    The if-else Construct-


    The if-else construct is used to build a conditional statement. It takes the form:


    if (condition)


    statement(s)_1 // The original result


    [else


    statement(s)_2] // The alternative result


    where:


    condition is a relational or logical expression.


    statement(s)_1 is a statement (or a block of statements) that is executed if


    the condition is true.


    statement(s)_2 is a statement (or a block of statements) that is executed if


    the condition is false.


    Notice that what goes inside the brackets ([]) is always optional. As you can
    see in the if-else construct, you can use the if keyword and the original result
    to build the conditional statement, like this example:


    if (salary > 2000)


    Console.Write("Salary is greater than 2k");


