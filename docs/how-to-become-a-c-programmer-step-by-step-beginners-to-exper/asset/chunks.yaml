  trans: "\n属性（Attributes）是额外的声明性信息，可以修改程序实体（类型、成员、参数等）的声明。在运行时，编译器可以通过称为反射（reflection）的过程检索这些信息。属性可以是预定义的，也可以是用户定义的。在大多数情况下，程序员使用预定义的属性。本书未涵盖用户定义的属性。\n\
    \n属性具有不同的用途，例如将方法标记为过用、指示条件编译、设置类型布局等。\n\n属性派自抽象类 `System.Attribute`，该类定义了属性的服务。按照约定，所有属性都带有\
    \ `Attribute` 后缀，例如 `DllImportAttribute`。你可以跳过该后缀，直接使用属性的别名，即 `DllImport`。\n\n\
    属性写在括号之间，如例所示：\n\n```text\n[method: DllImport(\"user32.dll\")]\n```\n\n注意，括号是属性语法的一部分。不要将这些括号与表示语法可选部分的括号混淆。此属性中的单词“method”代表属性所应用的目标。\n\
    \n在这个示例中，所应用的属性应用于 `user32.dll` 库中的一个方法。在大多数情况下，目标是可选的；只有在存在歧义时才是必要的。例如，如果属性可以应用于方法或返回类型，则添加目标。在此示例中，属性在没有目标元素的情况下编写的：\n\
    \n```text\n[DllImport(\"user32.dll\")]\n```\n\n目标元素可以是以下任何一个：\n\n*   `Assembly`\n\
    *   `field`\n*   `event`\n*   `method`\n*   `parameter`\n*   `property`\n*   `return`\n\
    *   `type`\n\n使用属性时，要么对其名称进行限定限定，要么使用适当的 `using` 指令。以下是存在于各种命名空间中的常用属性：\n\n* \
    \  `System.ObsoleteAttribute`\n*   `System.Diagnostics.ConditionalAttribute`\n\
    *   `System.Runtime.InteropServices.DllImportAttribute`\n*   `System.Xml.Serialization.XmlArrayAttribute`\n\
    \n### 属性参数\n\n考虑这个示例，它通过应用 `ObsoleteAttribute` 属性将一个方法标记为过用：\n\n```csharp\n[Obsolete]\n\
    \npublic static void MyMethod()\n{\n    // 过用方法的主体。\n}\n```\n\n当执行 `MyMethod`\
    \ 时，你会得到警告：\n\n`'MyClass.MyMethod()` is obsolete.\n\n某些属性（如 `Obsolete`）允许程序员在使用过用方法时提供额外信息。你可以使用以下包含两个参数的修改版本来此此操作：\n\
    \n```csharp\n[System.Obsolete (\"Use MyNewMethod instead.\", false)]\n\npublic\
    \ static void MyMethod()\n{\n    // 过用方法的主体。\n}\n```\n\n当你编译此方法时，编译器会生成警告：\n\n\
    `'MyClass.MyMethod()' is obsolete: 'Use MyNewMethod instead.'`\n\n第一个参数包含你想要添加的字符串消息。第二个参数根据是\
    \ `false` 还是 `true`，导致编译生成错误或警告。默认值为 `false`。\n\n### Conditional 属性\n\n该属性位于 `System.Diagnostics`\
    \ 命名空间。它被用于在程序中定义了特定常量时执行某个方法。例如：\n\n```csharp\n[Conditional(\"MYCONSTANT\")]\n\
    \npublic void MyMethod(string s) {}\n```\n\n只有当程序中使用预处理器指令定义了常量 `MYCONSTANT` 时，`MyMethod`\
    \ 才会会被执行：\n\n```csharp\n#define MYCONSTANT\n```\n\n如果未定义该常量，执行将继续且属性将被忽略。目标方法必须是\
    \ `void` 类型。\n\n### 组合属性\n\n属性可以被分组或组合。例如，你可以像此示例所示将 `Obsolete` 和 `Conditional`\
    \ 两个属性分组：\n\n```csharp\n[Obsolete]\n\n[Conditional (\"TRACE\")]\n```\n\n你也可以通过将它们列在一对方括号内并用逗号隔开来组合属性：\n\
    \n```csharp\n[Obsolete, Conditional (\"TRACE\")]\n```\n\n你还可以像此示例所示将两种样式结合，该示例使用了三个属性：\n\
    \n```csharp\n[Serializable]\n\n[Obsolete, Conditional (\"TRACE\")]\n```\n\n接下来的示例演示了属性的组合。\n\
    \n![](img/00190.jpeg)\n![](img/00191.jpeg)\n\n### 7-5-4 调用原生函数\n\n要调用原生函数（.NET\
    \ Framework 之外），例如 `MessageBoxA`，请像例所示所示使用 `DllImportAttribute` 属性：\n\n```text\n\
    [ DLLImport(“user32.dll”)]\n```\n\n要在你的 C# 程序中使用此函数，请执行以下操作：\n\n1. 使用两个修饰符 `extern`\
    \ 和 `static` 将函数声明为 C# 方法：\n\n```csharp\nstatic extern int MessageBoxA(int h,\
    \ string m, string c, int type);\n```\n\n![](img/00192.jpeg)\n![](img/00193.jpeg)\n\
    \n输出：\n\n![](img/00194.jpeg)\n\n### 模拟联合体（Unions）\n\n可以使用属性来模拟 C++ 中的联合体，如下例示例所示：\n\
    \n```csharp\n[type: StructLayout(LayoutKind.Explicit)]\npublic struct UnionStruct\n\
    {\n    [field: FieldOffset(0)] // 偏移 #0\n    public int i;\n\n    [field: FieldOffset(0)]\
    \ // 偏移 #0\n    public double d;\n}\n```\n\n在此示例中，使用了两个属性：\n\n```text\n[type:\
    \ StructLayout(LayoutKind.Explicit)]\n\n[field: FieldOffset(0)]\n```\n\n在此示例中，第一个属性指向\
    \ `struct`，第二个指向 `field`。这些属性中的单词“type”和“field”可以省略，因为它们是显而易见的。这两个数字大小不同，但它们都从相同的内存位置（偏移\
    \ 0）开始。当然，可以使用任何偏移，如 `FieldOffset(2)` 或 `FieldOffset(5)`。\n\n![](img/00195.jpeg)\n\
    ![](img/00196.jpeg)\n![](img/0023.jpeg)\n\n# 第 8 章：接口\n\n## 引言\n\n目录\n\n*   声明和使用接口\n\
    *   使用 `is` 运算符\n*   使用 `as` 运算符\n*   隐藏类成员\n*   版本控制\n*   隐藏接口成员\n\n### 什么是接口？\n\
    \n在日常生活中，我们经常接触许多电子设备的接口，如电视机、iPod 和手机。当你在商店里寻找手机时，不需要查看其内部能力。通过观察接口，你可以知道它可以做什么。例如，你可以判断手机是否具有拍照或录制视频的能力。\n\
    \n此外，如果制造商决定添加或删除某些功能，这应该反映在接口上。同样，在编程中，你通过观察接口就可以知道实现接口的类包含了什么。\n\n换句话说，接口是描述实现它的类的行为的契约。将接口描述为契约意味着义务。这意味着制造商不能在手机上添加摄像头按钮，而不添加内部执行实际工作的电子电路。同样，如果接口包含一个方法的名称，实现接口的类就有义务包含该方法的实现。\n\
    \n### 声明接口\n\n使用 `interface` 关键字声明接口，如例所示：\n\n```csharp\ninterface IMyInterface\n\
    {\n    // 接口成员\n}\n```\n\n声明可以使用有效的访问修饰符组合或 `new` 关键字进行修改。它也可以由属性引导。接口的成员可以包括：\n\
    \n*   方法\n*   属性\n*   索引器\n*   事件\n\n然而，接口不能包含字段。接口成员默认是公共的。你不能在它们上使用访问性修饰符。接口成员是方法、属性、索引器或事件的签名。例如：\n\
    \n```csharp\ninterface ICounter\n{\n    void Count(int i);\n    int SetCounter();\n\
    }\n```\n"
- fmt: "\nAs you can see in this declaration, the interface contains only the names,\
    \ types, and parameters of methods. This is similar to function prototypes in\
    \ C++. In the actual implementation, we will discuss the types that implement\
    \ this interface. An interface might implement one or more interfaces, as shown\
    \ in the following example:\n\n```csharp\ninterface IMyInterface: Interface1,\
    \ Interface2\n{\n    // interface members\n}\n```\n\nIn this example, `IMyInterface`\
    \ implements both `Interface1` and `Interface2`.\n\n### Interface Implementation\n\
    \nThe interface can be implemented by a class or a struct as shown in this example:\n\
    \n```csharp\nclass MyClass: IMyInterface1\n{\n    // class implementation\n}\n\
    ```\n\nBy this declaration the class `MyClass` is obligated to implement all members\
    \ of the interface `IMyInterface`. It is also possible for a class to implement\
    \ more than one interface:\n\n```csharp\nclass MyClass: IMyInterface1, IMyInterface2\n\
    {\n    // class implementation\n}\n```\n\nA class can also implement another class\
    \ in addition to the interfaces:\n\n```csharp\nclass MyClass: MyBaseClass, IMyInterface1,\
    \ IMyInterface2\n{\n    // class implementation\n}\n```\n\nIn the following example,\
    \ the class `Point` implements the interface `IPoint`. Notice that all the fields\
    \ are included in the class but none are included in the interface.\n\n![](images/00197.jpeg)\n\
    ![](images/00198.jpeg)\n![](images/00199.jpeg)\n![](images/00200.jpeg)\n![](images/00201.jpeg)\n\
    \nNotes about the preceding example:\n\n1. If you don’t implement all the members\
    \ of the interface, you get a compilation error. Try commenting the properties\
    \ (`Myx` and `Myy`) in the class to see the compiler error message.\n2. Notice\
    \ that the class can contain members other than the members of the interface,\
    \ such as the method `DisplayMyPoint`.\n3. Notice also that it is possible to\
    \ pass a parameter of the type `IPoint` to the method `DisplayMyPoint`. You can,\
    \ of course, pass a parameter of the type `Point` instead.\n\n### Explicit Interface\
    \ Implementation\n\nConsider a class, `MyClass`, that implements an interface,\
    \ `IMyInterface`. It is possible to implement the interface member, `MyMethod`,\
    \ like this:\n\n```csharp\nstring IMyInterface.MyMethod()\n{\n    // interface\
    \ implementation\n}\n```\n\nIn this example, `MyMethod` is qualified by the interface\
    \ name,\n\n`IMyInterface:`\n`IMyInterface.MyMethod()`\n\nThis is called explicit\
    \ interface implementation. Assume that you created an object from `MyClass` using\
    \ the following statement:\n\n```csharp\nMyClass mc = new MyClass();\n```\n\n\
    You can also create an interface object by casting the class object:\n\n```csharp\n\
    IMyInterface mi = (IMyInterface) mc;\n```\n\nIn this case, you can only access\
    \ `MyMethod` through the interface object `mi`. For example:\n\n```csharp\nConsole.Write(mi.MyMethod());\n\
    ```\n\nAttempting to access `MyMethod` through the class member `mc` would generate\
    \ a compilation error:\n\n```csharp\nConsole.Write(mc.MyMethod()); // error\n\
    ```\n\nSo, when do you need to use this code? There are cases in which the use\
    \ of explicit interface implementation becomes necessary, such as when the class\
    \ is implementing two interfaces and both interfaces contain a method named `MyMethod`.\
    \ If the first interface object is `mi1` and the second interface object is `mi2`,\
    \ accessing `MyMethod` through interface objects does not cause any ambiguity.\
    \ That is:\n\n```csharp\nConsole.Write(mi1.MyMethod());\nConsole.Write(mi2.MyMethod());\n\
    ```\n\nIn fact, using the class object to access the method will cause ambiguity.\
    \ The following example demonstrates a temperature converter that converts from\
    \ Fahrenheit to Celsius and vice versa. The program contains two interfaces: `ITemp1`\
    \ and `ITemp2`. Each contains a method named `Convert`. The class `TempConverter`\
    \ explicitly implements the two interfaces. In the `Main` method, two interface\
    \ objects, `iFC` and `iCF`, are used to access the `Convert` method.\n\n![](images/00202.jpeg)\
    \ ![](images/00203.jpeg) ![](images/00204.jpeg)\n\n### Using as to Test Types\n\
    \nThe operator `as` is used to convert an expression to a specified reference\
    \ type. It is used according to the form:\n\n`expression as type`\n\nwhere:\n\
    - `type` is a reference type.\n- `expression` is the object to be converted.\n\
    \nIf the conversion is successful, it returns the value of the expression; null\
    \ otherwise. This expression is equivalent to casting `expression` with `type`\
    \ except that it doesn’t throw an exception if the conversion fails. The expression\
    \ is equivalent to the following conditional expression:\n\n`expression is type\
    \ ? (type) expression : (type) null;`\n\nIn the following example, the method\
    \ `TestType` is used to test objects of various types. Notice that only reference-type\
    \ objects are converted.\n\n![](images/00205.jpeg)\n![](images/00206.jpeg)\n![](images/00207.jpeg)\n\
    \n### Hiding Members of the Base Class\n\nYou’ve already used the `new` operator\
    \ to create objects. Another use of the `new` operator is to modify declarations\
    \ of the inherited members in order to hide members with the same names in the\
    \ base class. Suppose that you have a base class that contains a method called\
    \ `MyMethod`:\n\n```csharp\npublic class MyBaseClass\n{\n    public int myInt;\n\
    \    public void MyMethod() // MyMethod on the base class\n    {\n        // ...\n\
    \    }\n}\n```\n\nWhen this class is inherited, the derived class will inherit\
    \ all its members. Suppose that you would like to declare a new member with the\
    \ same name, `MyMethod`, in the derived class. You can do that by using the `new`\
    \ modifier, as shown in this example:\n\n```csharp\npublic class MyDerivedClass:\
    \ MyBaseClass\n{\n    new public void MyMethod() // MyMethod on the derived class\n\
    \    {\n        // ...\n    }\n}\n```\n\nThe job of the `new` modifier here is\
    \ to hide the member with the same name in the base class. It also hides properties,\
    \ fields, and types with the same name. If you declare `MyMethod` in the above\
    \ example without the new modifier, it still works, but you will get a compiler\
    \ warning:\n\n`'MyDerivedClass.MyMethod()' hides inherited member 'MyBaseClass.MyMethod()'.\
    \ Use the 'new' keyword if hiding was intended.`\n\nNotice the following when\
    \ you use the `new` modifier:\n\nYou cannot use `new` and `override` in the same\
    \ declaration. If you do that you get the compiler error:\n\n`A member 'MyDerivedClass.MyMethod()'\
    \ marked as override cannot be marked as new or virtual.`\n\nIt is possible, though,\
    \ to use `virtual` and `new` in the same declaration. This emphasizes your intention\
    \ to hide the member in the base class and start a new point of specialization\
    \ in the inheritance hierarchy.\n\n### Versioning\n\nUsing the `new` modifier\
    \ to hide inherited members is similar to overriding methods using the `override`\
    \ modifier. Both are used to design a new version of a program while maintaining\
    \ backward compatibility with previous versions of the program. For example, assume\
    \ that you are inheriting a class produced by Acme called `AcmeClass`:\n\n```csharp\n\
    public class AcmeClass // Acme class\n{\n    // ...\n}\n\npublic class MyClass:\
    \ AcmeClass // your class\n{\n    // ...\n}\n```\n\nSuppose that you needed to\
    \ add a method of your own named `MyMethod`, like this:\n\n```csharp\npublic class\
    \ MyClass: AcmeClass\n{\n    public virtual MyMethod()\n    {\n        // The\
    \ new method in your program.\n    }\n    // ...\n}\n```\n\nYour program was working\
    \ just fine until Acme produced a new version of its program that includes a method\
    \ called `MyMethod`, which does the same work:\n\n```csharp\npublic class AcmeClass\n\
    {\n    public virtual MyMethod()\n    {\n        // The new method in Acme's program\
    \ v2.0.\n    }\n    // ...\n}\n```\n\nNow you have a problem. The solution is\
    \ to just use the `new` modifier to declare `MyMethod` in your program. This will\
    \ emphasize your intention to hide the method `MyMethod` in the second version\
    \ of `AcmeClass`. For example:\n\n```csharp\npublic class MyClass: AcmeClass\n\
    {\n    public new virtual MyMethod()\n    {\n        // ...\n    }\n}\n```\n\n\
    Problem solved.\n\nYou can, as an alternative, use the `override` modifier if\
    \ you plan to override `MyMethod` in the base class. In the following example,\
    \ the class `MyDerivedClass` inherits the class `MyBaseClass`. Each class contains\
    \ a member class called `MyClass`.\n"
