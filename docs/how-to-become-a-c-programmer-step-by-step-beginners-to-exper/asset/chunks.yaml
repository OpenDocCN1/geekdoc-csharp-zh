  trans: "\n\n# 类实现\n\n```csharp\n// Class implementation\n\n}\n```\n\n类实现（或类体）位于大括号（`{\
    \ }`）之间。你可以使用 `struct` 关键字以相同的方式声明结构体：\n\n```csharp\nstruct MyStruct\n{\n\n//\
    \ Struct implementation\n\n}\n```\n\n结构体将在第 7 章中进行详细讨论。\n\n## 字段初始化\n\n在接下来的示例中，你定义了类\
    \ `Point`，它包含两个字段——`x` 和 `y`：\n\n```csharp\nclass Point\n{\n    int x;\n    int\
    \ y;\n}\n```\n\n你可以像示例这样用值来初始化字段：\n\n```csharp\nclass Point\n{\n    int x = 0;\n\
    \    int y = 0;\n}\n```\n\n此声明将字段 `x` 和 `y` 初始化为它们的默认值。当然，你可以使用任何其他值来初始化字段。\n\n\
    ## 类实例化\n\n要从 `Point` 类创建对象，请使用以下语句：\n\n```csharp\nPoint myPoint; // 创建对象\n```\n\
    \n你也可以在同一语句中创建对象并初始化字段：\n\n```csharp\nPoint myPoint = new Point();\n```\n\n然而，注意你不能使用未初始化的对象——这与未初始化变量的规则相同。在第二个语句中，当创建对象时，会调用默认构造函数将字段初始化为它们的默认值。当然，你可以从该类创建多个实例：\n\
    \n```csharp\nPoint p1 = new Point();\nPoint p2 = new Point();\n```\n\n然后你可以为每个对象分配它自己的坐标：\n\
    \n```csharp\np1.x = 15;\np1.y = 22;\np2.x = 10;\np2.y = 12;\n```\n\n从这些语句可以看出，字段\
    \ `x` 和 `y` 与对象 `p1` 和 `p2` 关联。在接下来的示例中，你将看到类以及从中创建对象的完整视图。\n\n在这个示例中，对象是在 `Main`\
    \ 方法中创建的，但你可以在任何其他方法内部创建对象。然而，你不能在类内部创建对象。\n\n![](img/00099.jpeg)\n\n## 命名空间\n\
    \n命名空间包含类和其他类型的容器。你可以将类放在命名空间内部。使用命名空间的好处是能够完全限定包含在相同命名空间中的成员。如果两个不同命名空间中的两个类具有相同的名称，你可以通过使用完全限定名来引用每一个，例如：\n\
    \n`MyNameSpace.Class1`\n`YourNameSpace.Class1`\n\n## 嵌套命名空间\n\n也可以将命名空间嵌套在其他命名空间内部。在这种情况下，你需要使用完全限定名来区分相似的类：\n\
    \n`MyParentNameSpace.MyNestedNamespace.MyClass1`\n`MyParentNameSpace.MyClass1`\n\
    \n在接下来的示例中，你定义了两个具有相同名称 `MyClass` 的类。一个类包含名为 `MyNameSpace` 的命名空间，另一个类包含名为 `YourNameSpace`\
    \ 的命名空间。\n\n在位于 `MyNameSpace` 的 `Main` 方法中，你实例化了这两个类并创建了对象 `mc1` 和 `mc2`。为了实例化\
    \ `YourNameSpace` 中的类，你必须使用该类的完全限定名。\n\n![](img/00100.jpeg)\n![](img/00101.jpeg)\n\
    ![](img/00102.jpeg)\n\n## 命名空间别名限定符\n\n有时你可能想为类使用特殊名称，例如 `System` 或 `Console`。显然，这些名称将与具有相似名称的\
    \ .NET 类产生冲突。\n\n例如，名为 `System` 的类将隐藏 .NET 库中的 `System` 类。虽然这不是常见情况，但 C# 2005\
    \ 通过添加命名空间别名限定符运算符（`::`）允许这种可能性。你可以使用该运算符在全局命名空间中搜索由代码中的类型或成员隐藏的标识符。\n\n`::` 运算符位于两个标识符之间，如下：\n\
    \n```csharp\nglobal::System.Console.WriteLine(\"Hello, World!\");\n```\n\n`::`\
    \ 运算符左侧的标识符是搜索开始。右侧标识符是要查找的标识符。当左侧标识符是单词“global”时，搜索从全局命名空间开始。考虑以下示例，其中使用了名为 `System`\
    \ 的类。这个类名导致了一个只有通过使用命名空间别名限定符才能解决的问题，如下：\n\n```csharp\nglobal::System.Console.WriteLine(mc.myClassNumber);\n\
    global::System.Console.WriteLine(ms.mySystemNumber);\n```\n\n如果你尝试使用以下语句，将得到编译错误：\n\
    \n```csharp\nSystem.Console.WriteLine(mc.myNumber); // 错误\nSystem.Console.WriteLine(ms.myNumber);\
    \ // 错误\n```\n\n![](img/00103.jpeg)\n![](img/00104.jpeg)\n\n## 访问级别\n\n程序员创建一个类，然后其他程序员在他们的代码中使用该类是一种常见的做法。这种代码通常被称为客户端。面向对象编程（OOP）的一个重要特性是封装，它允许你作为类的创建者通过限制对字段的访问来保护你的类字段。\n\
    \n在这种情况下，客户端只能通过公共方法访问这些字段。你可能已经注意到在之前的章节中，大多数类声明使用了 `public` 关键字。在本节中，你将学习到 `public`\
    \ 以及其他用于保护类型和成员的关键字。可以使用以下关键字限制或允许对类型和成员的访问：\n\n- `public`\n- `private`\n- `protected`\n\
    - `internal`\n\n这些关键字被称为访问修饰符，因为它们被用于修改声明。例如：\n\n```csharp\npublic int MyMethod()\n\
    ```\n\n注意；访问修饰符集是 C# 修饰符的子集，它们用于不同的用途。访问修饰符用于创建五个访问级别，在下表中解释。\n\n![](img/00105.jpeg)\n\
    \n下表显示了不同类型的默认访问级别和允许使用的访问级别（更多关于类型的信息请见第 7 章和第 8 章）。在接下来的示例中，使用 `Point` 类来演示访问级别。\n\
    \n![](img/00106.jpeg)\n\n说明：\n- 命名空间没有访问级别。\n- 对于嵌套在其他类中的类，默认访问级别是 `internal`。允许的访问级别是\
    \ `public` 或 `internal`。\n\n![](img/00107.jpeg)\n00108.jpeg)\n![](img/0109.jpeg)\n\
    \n示例中有几个值得讨论的部分：该示例包含了三个类：`Point`、`MainClass` 以及包含类 `OuterClass`。`Main` 方法被放置在\
    \ `Point` 类外的类中，以便测试访问级别的影响。注意，如果字段没有 `public` 修饰符，你无法访问 `Point` 类的字段。为了测试这一点，将\
    \ `public` 修饰符改为 `private` 或 `protected` 并查看编译器的错误信息。\n\n包含类 `OuterClass` 用作其他类的容器，但对程序没有影响。\n\
    \n## 属性\n\n保护类字段的最简单方法是使用属性。属性实际上是其他成员函数，但它们方便了客户端对私有字段的访问。客户端可以使用与字段相同的方式属性。C++\
    \ 中的传统方法是专门设立函数来访问私有字段。\n\n例如：\n\n```csharp\nset_MyPoint_x(); // C++\nget_MyPoint_x();\
    \ // C++\n```\n\n第一个函数的作用给字段 `x` 赋值，第二个函数的作用是读取该字段的值。C# 属性用法如下：\n\n```csharp\n\
    private string item;\npublic string Item\n{\n    get\n    {\n        return item;\n\
    \    }\n    set\n    {\n        item = value;\n    }\n}\n```\n\n字段 `item` 被声明为私有，而属性\
    \ `Item` 被声明为公共。（这种命名系统不是强制的，但是一种常见的约定。）属性包含读取字段的 `get` 方法和为字段赋值的 `set` 方法。\n\n"
- fmt: "\nThe methods `get` and `set` are called accessors. They are classified as\
    \ contextual keywords, which are words that have special meaning when used with\
    \ properties or indexers. Notice the use of the `return` keyword in the `get`\
    \ accessor. Notice also the use of another contextual keyword, `value`, which\
    \ is used to change the value of the field. The following example shows how to\
    \ use the property to read or write a field name:\n\n```csharp\nItem = \"C# book\"\
    ; // using the set method\nConsole.Write(Item); // using the get method\n```\n\
    \nAs you can see in the first example, using the `set` accessor means assigning\
    \ a value to the property (The contextual keyword `value` is never used explicitly.).\
    \ In the second example, the `get` accessor is also used implicitly for retrieving\
    \ the property value (reading it).\n\n### Note\nAlthough keywords are reserved\
    \ words, contextual keywords are not. You cannot use a keyword as an identifier\
    \ without prefixing it with the `@` symbol, but contextual keywords can be used\
    \ as identifiers. Unless you need to write additional code in the `set` accessor,\
    \ you can deviate from the common coding convention by writing the property like\
    \ this:\n\n```csharp\npublic string Item\n{\n    get { return item; }\n    set\
    \ { item = value; }\n}\n```\n\n### Using Properties\nProperties expose a convenient\
    \ public way for reading and setting field values instead of dealing directly\
    \ with the fields. One advantage of using properties as opposed to using fields\
    \ directly is that you can validate the data before changing the value of the\
    \ field.\n\nFor example, if the field contains a specific date, you can check\
    \ to see if the value to be assigned to the field is within a specific range.\
    \ In the following example, the valid value for the field called `number` should\
    \ be within the range 100 to 1000.\n\nIf you try to assign a value less than 100\
    \ or greater than 1000, it won’t be accepted and you will get a message from the\
    \ `set` accessor telling you about the error. Regardless of whether or not the\
    \ entered value is accepted, the program displays the current value of the field.\n\
    \n![](images/00110.jpeg)\n![](images/00111.jpeg)\n![](images/00112.jpeg)\n\n###\
    \ Read-only Properties\nSometimes you need to protect the fields from any change\
    \ by the user. For example, a field containing the company name should not be\
    \ changed. In such cases, you omit the `set` accessor and keep the `get` accessor\
    \ to read the field.\n\nThis kind of property is called a read-only property,\
    \ while the regular property is called a read-write property. In the following\
    \ example, both property kinds are used. The person’s name is a read-write property,\
    \ while the company name is a read-only property.\n\n![fractal-tree2](images/00055.jpeg)\
    \ ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)\n\n\
    #### Example 5-6\n![](images/00113.jpeg)\n![](images/00114.jpeg)\n\n### Accessor\
    \ Accessibility\nIn C# 2002, the two accessors, `set` and `get`, have the same\
    \ accessibility as the property they act upon. In C# 2005, each accessor can have\
    \ its own access level.\n\nThis way, you can restrict the accessibility of the\
    \ `set` accessor while keeping the `get` accessor public. In this case, the value\
    \ of the property can only be changed by the class designer. The following example\
    \ shows a property with public `get` and protected `set`.\n\n```csharp\npublic\
    \ string EmployeeName\n{\n    get { return employeeName; }\n    protected set\
    \ { employeeName = value; }\n}\n```\n\nThere are, however, some restrictions when\
    \ using this feature:\n* Access modifiers are allowed only on one of the accessors\
    \ — usually it is the `set` accessor.\n* If you use one accessor only (as in the\
    \ read-only property), you cannot use an access modifier on the accessor. Of course\
    \ in this case, the accessor accessibility is the same as that of the property.\n\
    * On interfaces (explained in Chapter 8), no access modifiers are allowed on accessors.\n\
    * The accessibility of the accessor must be more restrictive than the accessibility\
    \ of the property itself.\n\n### Static Members and Static Classes\nAssume you\
    \ are building a class that represents a group of employees working for a company\
    \ as shown in Example 5-6. The employees’ names change with each instance of the\
    \ class, while the company name stays the same.\n\nIn other words, the employee\
    \ name belongs to the corresponding employee object, while the company name belongs\
    \ to the class.\n\nIn this case you can modify the declaration of the company\
    \ name with the modifier `static`, which qualifies it to belong to the class rather\
    \ than a specific object. Here is the new declaration:\n\n```csharp\nprivate static\
    \ string companyName = \"Microsoft\";\nprivate string name;\n```\n\nWhen you use\
    \ a static field, you associate it with the class name rather than a particular\
    \ object:\n\n```csharp\nConsole.WriteLine(\"Company Name: {0}\", Employee.CompanyName);\n\
    ```\n\nThis leads to classifying the class members into two categories:\n* Instance\
    \ members.\n* Static members.\n\nThis classification applies to methods and fields.\
    \ In the following example, the class `Employee` is modified to include the company\
    \ name and the property associated with it as static members.\n\n![](images/00115.jpeg)\n\
    ![](images/00116.jpeg)\n![](images/00117.jpeg)\n\nExamples of static members that\
    \ we used earlier in this book are the methods of the `Math` class, such as `Math.Tan`\
    \ and `Math.Round`. We also used static fields such as `Math.PI`.\n\nThese members\
    \ are always associated with the class name. All the members of the `Math` class\
    \ are static members. In fact, the `Math` class itself is a static class. A static\
    \ class is a class whose members are all static and cannot be instantiated.\n\n\
    ### Constants\nA constant is a name that represents a constant value. The modifier\
    \ `const` is used to declare a field or local variable whose value cannot be changed\
    \ after declaration. For example, the `PI` constant we used earlier cannot be\
    \ changed and we never need to change it. Here is an example of a class that uses\
    \ constant fields:\n\n```csharp\nclass MyClass\n{\n    public const field1 = 3,\
    \ field2 = 10;\n}\n```\n\nNotice that the constant fields in this declaration\
    \ are initialized as declared. The same applies for constant local variables.\
    \ If you used constants as in the following examples:\n\n```csharp\nconst double\
    \ myDoubleConst = 3.1;\nconst int myIntConst = 25;\n```\n\nyou cannot later change\
    \ their value with other statements such as:\n\n```csharp\nint x = ++myIntConst;\
    \ // error\nmyIntConst = 26; // error\n```\n\nYou can use a constant to build\
    \ other constants, like this example:\n\n```csharp\nconst string language = \"\
    C#\";\nconst string productName = language + \" \"+ \"2005\";\n```\nHere the value\
    \ of the `productName` constant is “C# 2005.” When you declare variables that\
    \ represent conversion ratios in your programs, it is best to declare them using\
    \ the modifier `const`. In the following program, the conversion ratio `convRatio`\
    \ is used to convert kilometers to miles.\n\n![](images/00118.jpeg)\n\n### Constructors\n\
    A class can contain one or more methods to build and initialize objects. These\
    \ methods are called constructors. Constructors are divided into three categories:\n\
    * Instance constructors.\n* Private constructors.\n* Static constructors. These\
    \ constructors are explained in the following sections.\n\n### Instance Constructors\n\
    Instance constructors are the most common and sometimes referred to as just constructors.\
    \ A constructor is named the same as the class. It is invoked when you create\
    \ a new object. For example:\n\n```csharp\nPoint myPoint = new Point();\n```\n\
    \nThe class might also contain a constructor with parameters, such as:\n\n```csharp\n\
    Point myPoint = new Point(int x, y);\n```\n\nAs you might have noticed in the\
    \ previous examples, if the class doesn’t contain a constructor, the default constructor\
    \ is invoked. The default constructor is a parameterless constructor such as `Point()`.\
    \ This constructor initializes the created object with default parameters —zero\
    \ in case of integer fields.\n\n![](images/00119.jpeg)\n![](images/00120.jpeg)\n\
    ![](images/00121.jpeg)\n![](images/00122.jpeg)\n"
  raw: 'The methods get and set are called accessors. They are classified as contextual
    keywords, which are words that have special meaning when used with properties
    or indexers. Notice the use of the return keyword in the get accessor. Notice
    also the use of another contextual keyword, value, which is used to change the
    value of the field. The following example shows how to use the property to read
    or write a field name:


    Item = "C# book"; // using the set method


    Console.Write(Item); // using the get method


    As you can see in the first example, using the set accessor means assigning a
    value to the property. (The contextual keyword value is never used explicitly.).
    In the second example, the get accessor is also used implicitly for retrieving
    the property value (reading it).


    Note :


    Although keywords are reserved words, contextual keywords arenot. You cannot use
    a keyword as an identifier without prefixing it with the @ symbol, but contextual
    keywords can be used as identifiers. Unless you need to write additional code
    in the set accessor, you can deviate from the common coding convention by writing
    the property like this:


    public string Item


    {


    get { return item; }


    set { item = value; }


    }


    Using Properties-


    Properties expose a convenient public way for reading and setting field values
    instead of dealing directly with the fields. One advantage of using properties
    as opposed to using fields directly is that you can validate the data before changing
    the value of the field.


    For example, if the field contains a specific date, you can check to see if the
    value to be assigned to the field is within a specific range. In the following
    example, the valid value for the field called number should be within the range
    100 to 1000.


    If you try to assign a value less than 100 or greater than 1000, it won’t be accepted
    and you will get a message from the set accessor telling you about the error.
    Regardless of whether or not the entered value is accepted, the program displays
    the current value of the field.


    ![](images/00110.jpeg)


    ![](images/00111.jpeg)


    ![](images/00112.jpeg)


    Read-only Properties-


    Sometimes you need to protect the fields from any change by the user. For example,
    a field containing the company name should not be changed. In such cases, you
    omit the set accessor and keep the get accessor to read the field.


    This kind of property is called a read-only property, while the regular property
    is called a read-write property. In the following example, both property kinds
    are used. The person’s name is a read-write property, while the company name is
    a read-only property.


    ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)


    Example 5-6


    ![](images/00113.jpeg)


    ![](images/00114.jpeg)


    Accessor  Accessibility-


    In C# 2002, the two accessors, set and get, have the same accessibility as the
    property they act upon. In C# 2005, each accessor can have its own access level.


    This way, you can restrict the accessibility of the set accessor while keeping
    the get accessor public. In this case, the value of the property can only be changed
    by the class designer. The following example shows a property with public get
    and protected set.


    public string EmployeeName


    {


    get { return employeeName; }


    protected set { employeeName = value; }


    }


    There are, however, some restrictions when using this feature:


    *   Access modifiers are allowed only on one of the accessors — usually it is
    the set accessor.


    *   If you use one accessor only (as in the read-only property), you cannot use
    an access modifier on the accessor. Of course in this case, the accessor accessibility
    is the same as that of the property.


    *   On interfaces (explained in Chapter 8), no access modifiers are allowed on
    accessors.


    *   The accessibility of the accessor must be more restrictive than the accessibility
    of the property itself.


    Static Members and Static Classes-


    Assume you are building a class that represents a group of employees working for
    a company as shown in Example 5-6\. The employees’ names change with each instance
    of the class, while the company name stays the same.


    In other words, the employee name belongs to the corresponding employee object,
    while the company name belongs to the class.


    In this case you can modify the declaration of the company name with the modifier
    static, which qualifies it to belong to the class rather than a specific object.
    Here is the new declaration:


    private static string companyName = "Microsoft";


    private string name;


    When you use a static field, you associate it with the class name rather than
    a particular object:


    Console.WriteLine("Company Name: {0}", Employee.CompanyName);


    This leads to classifying the class members into two categories:


    *   Instance members.


    *   Static members.


    This classification applies to methods and fields. In the following example, the
    class Employee is modified to include the company name and the property associated
    with it as static members.


    ![](images/00115.jpeg)


    ![](images/00116.jpeg)


    ![](images/00117.jpeg)


    Examples of static members that we used earlier in this book are the methods of
    the Math class, such as Math.Tan and Math.Round. We also used static fields such
    as Math.PI.


    These members are always associated with the class name. All the members of the
    Math class are static members. In fact, the Math class itself is a static class.
    A static class is a class whose members are all static and is declared using the
    modifier static. Static classes cannot be instantiated or inherited.


    Constants-


    A constant is a name that represents a constant value. The modifier const is used
    to declare a constant field or local variable whose value cannot be changed after
    declaration. For example, the value of the PI constant we used earlier cannot
    be changed and we never need to change it. Here is an example of a class that
    uses constant fields:


    class MyClass


    {


    public const int field1 = 3, field2 = 10;


    }


    Notice that the constant fields in this declaration are initialized as declared.
    This is a requirement for declaring constants. The same applies for the constant
    local variables. If you used constants as in the following examples:


    const double myDoubleConst = 3.1;


    const int myIntConst = 25;


    you cannot later change their value with other statements such as:


    int x = ++myIntConst; // error


    myIntConst = 26; // error


    You can use a constant to build other constants, like this example:


    const string language = "C#";


    const string productName = language + " "+ "2005";


    Here the value of the productName constant is “C# 2005.”             


    When you declare variables that represent conversion ratios in your programs,
    it is best to declare them using the modifier const. In the following program,
    the conversion ratio convRatio is used to convert kilometers to miles.


    ![](images/00118.jpeg)


    Constructors-


    A class can contain one or more methods to build and initialize objects. These
    methods are called constructors. Constructors are divided into three categories:


    *   Instance constructors.


    *   Private constructors.


    *   Static constructors.


    These constructors are explained in the following sections.


    Instance Constructors-


    Instance constructors are the most common and sometimes referred to as just constructors.
    A constructor is named the same as the class. It is invoked when you create a
    new object. For example:


    Point myPoint = new Point();             


    The class might also contain a constructor with parameters, such as:


    Point myPoint = new Point(int x, int y);             


    As you might have noticed in the previous examples, if the class doesn’t contain
    a constructor, the default constructor is invoked. The default constructor is
    a parameterless constructor such as Point(). This constructor initializes the
    created object with default parameters —zero in case of integer fields.


    ![](images/00119.jpeg)


    ![](images/00120.jpeg)


    ![](images/00121.jpeg)


    ![](images/00122.jpeg)'
