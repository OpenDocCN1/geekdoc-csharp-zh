    C# 的 `switch` 和 C++ 的 `switch` 之间存在差异。在 C++ 中，如果你没有分支语句，控制将直接转移到下一个 `case`。但在
    C# 中，编译器会针对缺失的语句报错。你可以通过使用一些空 `case` 来补偿这一点，使得控制可以直穿（fall through）直到遇到有效的 `case`。例如：


    ```csharp

    switch(n)

    {

    case 1: // 直穿到 case 3

    case 2: // 直穿到 case 3

    case 3:

    Console.WriteLine("cases 1 & 2 come here!");

    break;

    // ...

    }

    ```


    C# 的 `switch` 设计时没有包含“直穿”功能，以避免在你不小心遗漏 `break` 语句时程序中可能出现的问题。在这种情况下，一个或多个 switch
    case 可能会在无意中被执行，导致程序出现 bug。


    ### 条件表达式


    条件表达式用于构建一个简单的条件语句。它的形式为：


    `condition ? expression_1 : expression_2`


    其中：

    - `condition` 是要测试的布尔表达式。

    - `expression_1` 是当条件为真时的表达式求值。

    - `expression_2` 是当条件为假时的表达式求值。


    当然，你可以将整个表达式赋值给变量，如本例所示：


    `result = (x != 0.0) ? Math.Tan(x) : 1.0;`


    （注意，条件周围的括号是可选的。它们用于提高可读性。）


    该语句的意思是：“如果 `x` 不等于零，则将值 `Math.Tan(x)` 赋值给 `result`；否则，将值 1.0 赋值给 `result`。”该语句相当于以下代码段：


    ```csharp

    if (x != 0.0)

    result = Math.Tan(x);

    else

    result = 1.0;

    ```


