    to a method without the need to declare them in an array. This keyword is required
    only in the method declaration. For example, the method:


    static void MyMethod(params object[] myObjArray)


    can be called like this:


    MyMethod(123, ''A'', "My original string");


    The parameters passed in this call are all of the type object, which means they
    can include any types descended from the object class. Consider also the following
    method:


    static void MyMethod(params int[] myIntArray)


    This method can be called by passing a group of integers that constitute an integer
    array regardless of its length, for example:


    MyMethod(2, 4, 7);


    Any method that uses the params keyword cannot use more than one parameter. In
    the following example, the use of the params keyword in the declaration of the
    method is demonstrated. It also demonstrates the overloading of two methods with
    the same name and different parameters.


    One method uses an object array and the second method uses an integer array. Both
    methods change the content of the array passed to it. The content of each array
    is displayed before and after the change takes place inside the method.


