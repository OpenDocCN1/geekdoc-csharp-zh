    ...


    [default:


    statement(s)


    jump-statement]


    }


    where:


    Expression represents a value that corresponds to the associated switch choice.
    statement(s) is a statement or block of statements that is executed if the corresponding
    condition is evaluated true. jump-statement is a branching statement to transfer
    control outside the specific case, such as break or goto (explained later in the
    chapter).


    Default deals with all the other cases. According to the value of the expression,
    the control of the program is transferred to one of the case labels and the corresponding
    statement is executed. The cases actually represent the different possible values
