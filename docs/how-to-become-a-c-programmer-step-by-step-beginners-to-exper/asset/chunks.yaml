    会导致循环跳过计数值 3 并跳转到下一个计数值。也可以使用 `break` 语句完全终止循环，如下语句所示：


    `if (counter == 7) break;`


    这将在计数值等于 7 时结束循环。


    #### for 循环的可用选项


    注意 `for` 循环的所有元素都是可选的，这意味着下面的 `for` 循环将无限运行：


    ```csharp

    for ( ; )

    {

    Console.WriteLine("Hello again!");

    }

    ```


    该循环将继续显示“Hello again!”，直到你通过 Ctrl+C 中断执行。之前的语句相当于以下语句：


    ```csharp

    for ( ; true; )

    {

    Console.WriteLine("Hello again!");

    }

    ```


    可以使用多个计数器来控制循环，只需这样用逗号分隔：


    `for (i = 0, j = 10; i<= j, i++; j--)`

    `{ do something }`


    #### 嵌套循环


    `for` 循环可以嵌套如下示例所示，它显示了从 2 到 10 的素数。素数是那些只能被 1 或自身整除的数字，例如 3、7、43 等。


    在这个程序中，有两个循环，一个使用计数器 `i`（`i` 循环），另一个使用计数器 `j`（`j` 循环）。将 `j` 循环嵌套在 `i` 循环内部意味着对于
    `i` 的每一个值，都会测试整个 `j` 取值范围。


    ![](img/0073.jpeg)


    ![](img/0074.jpeg)


    同样注意使用 `%` 运算符来测试除法的余数，如下语句所示：


    `if (i % j == 0) x = true;`


    该语句的意思是：“如果 `i` 除以 `j` 的余数为 0，则将 `x` 设置为真。”当 `j` 循环退出且 `x` 仍为假时，`i` 的值将包含一个素数。当
    `i` 循环结束时，2 到 10 范围内的所有素数都被显示出来。


    #### while 循环


    `while` 循环用于在满足特定条件时执行语句块。`while` 语句的形式为：


    `while (control_expression)`

