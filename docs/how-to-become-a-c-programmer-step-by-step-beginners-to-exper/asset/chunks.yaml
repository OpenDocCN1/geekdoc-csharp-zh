    \ The following example demonstrates delegate multicasting.\n\n![avatar_medium](images/00005.jpeg)\
    \ ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)\n\n\
    ![](images/00266.jpeg) ![](images/00267.jpeg) ![](images/00268.jpeg)\n\nAnonymous\
    \ Methods-\n\nAnonymous methods, a new feature of C# 2005, enables you to pass\
    \ a code segment as a delegate parameter directly without declaring a separate\
    \ method. Consider the following delegate declaration:\n\ndelegate void MyDelegate(string\
    \ s);\n\nInstead of declaring a separate method, MyMethod, like this:\n\npublic\
    \ void MyMethod(string s)\n\n{\n\nConsole.WriteLine(s);\n\n}\n\nyou can directly\
    \ associate the delegate with the method’s code:\n\nMyDelegate delegObject = delegate(string\
    \ s) { Console.WriteLine(s); };\n\nNotice the semicolon at the end of the block.\
    \ In the following example, a delegate using an anonymous method with two object\
    \ parameters is demonstrated.\n\n![](images/00269.jpeg)\n\n![](images/00270.jpeg)\n\
    \nCovariance-\n\nCovariance is a new feature that was added to C# 2005 to provide\
    \ some flexibility in matching the delegate type and the return type of the encapsulated\
    \ method. Instead of using the same type for both the delegate and the method’s\
    \ return value, covariance permits using a return type for the method that specializes\
    \ (is derived from) the type of the delegate.\n\nIn the following example, a delegate\
    \ of the type Person encapsulates two methods, MyMethodP and MyMethodE. MyMethodP\
    \ has the return type Person, which is the same type as the delegate. MyMethodE\
    \ has the return type Employee, which specializes Person — this is covariance.\n\
    \n![](images/00271.jpeg)\n\n![](images/00272.jpeg) ![](images/00273.jpeg)\n\n\
    ![](images/00274.jpeg)\n\nMyDelegate d1 = mc.MyMethodP;\n\nKeep in mind that if\
    \ the method is static, you don’t need to qualify it with the object mc.\n\nContravariance-\n\
    \nContravariance is another new feature added to C# 2005 in order to give more\
    \ flexibility in matching the signatures of the delegate and the encapsulated\
    \ method. Instead of using the same type of parameters, contravariance allows\
    \ using a method’s parameter of a type that specializes (is derived from) the\
    \ parameter of delegate. The following example demonstrates both covariance and\
    \ contravariance.\n\nFour classes are declared: Person, Employee, Resident, and\
    \ Citizen. The class Employee specializes Person, and the class Citizen specializes\
    \ Resident. A delegate and the associated method are declared like this:\n\ndelegate\
    \ Person MyDelegate(Citizen c);\n\npublic static Employee MyMethod(Resident r)\n\
    \nThe return type of the method (Employee) specializes the type of the delegate\
    \ (Person), which is covariance. The parameter of the delegate (Citizen) specializes\
    \ the parameter of the method (Resident), which is contravariance.\n\n![](images/00275.jpeg)\n\
    \n![](images/00276.jpeg)\n\nEvents-\n\nOne of the most important uses of delegates\
    \ is programming events, especially in the Windows environment. When you click\
    \ a button in a window, an event is fired. The response to that event may take\
    \ several forms. It is your job as a programmer to write the appropriate response\
    \ to that event in your application.\n\nFor example, if you created a Windows\
    \ forms application and you started by adding a button to the application form,\
    \ you can associate the button click to a specific result, such as writing some\
    \ text in a text box.\n\nIn the following figure, you see the phrase “Hello, World!”\
    \ written in a text box as a result of clicking the button.\n\n![](images/00277.jpeg)\n\
    \nThe code written in the background of this operation is the following method:\n\
    \nprivate void button1_Click(object sender, EventArgs e)\n\n{\n\ntextBox1.Text\
    \ = \"Hello, World!\";\n\n}\n\nIf you are familiar with programming Windows applications,\
    \ you know that the only piece of code you are required to provide here is:\n\n\
    textBox1.Text = \"Hello, World!\";\n\nThis line of code means, “When you click\
    \ the button, write the phrase “Hello, World!” in the text box object textBox1.”\
    \ The method itself is provided by the IDE environment when you double-click the\
