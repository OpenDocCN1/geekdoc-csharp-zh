  trans: "\n\n为了在基类中隐藏 `MyClass`，在类声明中使用新的修饰符 `new`。这样，就可以访问两个类中的成员并使用它们的成员。\n\n![avatar_medium](img/00005.jpeg)\
    \ ![avatar_medium](img/00005.jpeg) ![avatar_medium](img/00005.jpeg)\n\n![](img/00208.jpeg)\n\
    \n![](img/00209.jpeg)\n\n![](img/00210.jpeg)\n\n![](img/00211.jpeg)\n\n# 隐藏接口成员\n\
    \n同样可以在接口上应用隐藏基类成员的相同原则。假设你有两个接口：`IBase` 和 `IDerived`。正如名称所示，`IDerived` 派自 `IBase`。以下是接口\
    \ `IBase` 上属性 `M1` 的声明。\n\n```csharp\ninterface IBase\n{\n    int M1 { get; set;\
    \ }\n}\n```\n\n在同一个程序中，你可以在接口 `IDerived` 上声明一个同名 `M1` 的方法：\n\n```csharp\ninterface\
    \ IDerived: IBase\n{\n    new int M1();\n}\n```\n\n通过这种声明，派生接口上的成员 `M1` 隐藏了基类接口上的成员\
    \ `M1`。在这种情况下，在实现这些接口的任何类中都需要使用显式接口实现：\n\n```csharp\nclass MyClass: IDerived\n\
    {\n    private int m1;\n    // 属性 M1 的显式实现：\n    int IBase.M1\n    {\n       \
    \ get { return m1; }\n        set { m1 = value; }\n    }\n    // 方法 M1 的显式实现：\n\
    \    void IDerived.M1() { }\n}\n```\n\n也可以显式实现属性并正常实现方法，如下示例所示：\n\n```csharp\n\
    class MyClass: IDerived\n{\n    private int m1;\n    // 属性的显式实现：\n    int IBase.M1\n\
    \    {\n        get { return m1; }\n        set { m1 = value; }\n    }\n    //\
    \ 方法的正常实现：\n    public void M1() { }\n}\n```\n\n第三种可能性是显式实现方法并正常实现属性，如下所示：\n\n\
    ```csharp\nclass MyClass: IDerived\n{\n    private int m1;\n    // 属性的正常实现：\n\
    \    public int M1\n    {\n        get { return m1; }\n        set { m1 = value;\
    \ }\n    }\n    // 方法的显式实现：\n    void IDerived.M1() { }\n}\n```\n\n在下面的示例中，演示了方法和属性的显式备选实现之一。\n\
    \n![](img/00212.jpeg)\n\n![](img/00213.jpeg)\n\n![](img/00214.jpeg)\n\n![](img/00215.jpeg)\n\
    \n![](img/00216.jpeg)\n\n![STAR-LOGO-2013](img/00004.jpeg)\n\n# 章：∞ 9 ∞ (异常处理)\n\
    \n## 引言\n\n### 错误与异常\n异常是运行时错误，除非妥善处理，否则它们会停止程序的执行。当程序发生某些情况时会生成异常，例如除以零、尝试打开已删除的文件、错误的类型转换或内存耗尽。\n\
    \n在这种情况下，你通过使用适当的处理器来处理异常，以防止程序停止。处理器是一个代码块，它捕获异常并尝试继续执行程序运行。如果你的代码中没有适当的处理器，则将使用默认处理器并终止程序。\n\
    \n在 C# 中，异常是 `System.Exception` 类或其子类之一的实例，代表程序执行期间发生的错误。处理异常时使用的关键字有 `throw`、`catch`\
    \ 和 `finally`。处理异常需要使用使用以下语句之一的特殊结构：\n\n*   `throw`：用于抛出或重新抛出异常。\n*   `try-catch`：捕获并处理异常。\n\
    *   `try-finally`：在抛出异常后清理资源，无论异常是否被捕获均执行。\n*   `try-catch-finally`：捕获并处理异常并清理资源。\n\
    \n这些语句将在后续章节中进行解释。\n\n### 抛出异常\n在本节中，我们故意抛出一个异常来向你展示它的样子。你可以使用 `throw` 语句来实现这一点。`throw`\
    \ 语句采用以下形式：\n\n```csharp\nthrow [expression];\n```\n\n其中：\n*   `expression` 是异常对象。\n\
    \n应用程序可以抛出的某些异常包括：\n\n*   `InvalidCastException`\n*   `OverFlowException`\n* \
    \  `ArgumentNullException`\n*   `ArithmeticException`\n*   `DivideByZeroException`\n\
    \n当异常被抛出时，执行会暂时暂停，寻找适当的异常处理器。如果找到了，它将处理该异常并恢复执行；否则，执行在此处终止。在接下来的示例中，你在为变量 `myString`\
    \ 赋值值 `null` 后，抛出了类 `ArgumentNullException` 的异常对象。\n\n![](img/00217.jpeg)\n\n\
    ![](img/00218.jpeg)\n\n当你运行此程序时，它首先显示文本：\n`The string is Hello.`\n\n然后它会显示以下窗口：\n\
    ![](img/00219.jpeg)\n\n此窗口包含了运行时错误发生时提供的常规选项。当你点击 `Debug` 时，屏幕上会出现以下即时调试器（Just-in-Time\
    \ Debugger）窗口。\n\n![](img/00220.jpeg)\n\n如图 9-1 所示，导致终止的异常名称是 `ArgumentNullException`。你可以使用\
    \ `System.Exception` 类代替 `ArgumentNullException`，在这种情况下你会收到来自程序的另一条消息：\n`Unhandled\
    \ Exception: System.Exception: Exception of type 'System.Exception' was thrown.`\n\
    `at MyClass.Main()`\n\n最后一行代码：\n`Console.Write(\"myString is null.\");`\n将不会执行，因为它跟在抛出异常之后。请注意，当你捕获异常时，`Unhandled\
    \ Exception: ArgumentNullException: Value cannot be null.`\n`at MyClass.Main()`\
    \ 是默认处理器。\n\n### 捕获异常\n你可以使用 `try-catch` 语句来捕获异常，该语句包含两个块。第一个是 `try` 块，在其中插入疑代码。它的形式如下：\n\
    \n```csharp\ntry\n{\n    //\n}\ncatch (declaration)\n{\n    //\n}\n```\n\n其中：\n\
    *   `declaration` 是异常对象的声明，是可选的。\n\n这两个块结合使用构建一个语句。如果你尝试单独使用 `try` 块，将得到编译错误：`error\
    \ CS1524: Expected catch or finally.`。\n\n`catch` 块可以在没有任何参数的情况下使用，在这种情况下它用于捕获任何异常。也可以使用多个\
    \ `catch` 块。在这种情况下，`try-catch` 语句的形式如下：\n\n```csharp\ntry\n{\n    //\n}\ncatch\
    \ (declaration-1)\n{\n    // 第一个处理器\n}\ncatch (declaration-2)\n{\n    // 第二个处理器\n\
    }\ncatch (declaration-3)\n{\n    // 第三个处理器\n}\n```\n\n当程序抛出异常时，运行时引擎开始寻找匹配异常的适当\
    \ `catch` 块。如果找到了 `catch` 块，程序将在处理问题或显示解释执行期间发生问题的适当消息后恢复执行。\n\n示例 9-2 演示了以下内容：\n\
    \n*   抛出异常。\n*   使用 `try` 块尝试疑代码。\n*   使用 `catch` 块处理异常。\n\n![](img/00222.jpeg)\n\
    \n![](img/00223.jpeg)\n\n![](img/00224.jpeg)\n\n注意上面的示例，`catch` 块本身本身就足以恢复程序执行，无论它包含什么代码。\n\
    \n"
- fmt: "\nAs you can see in the program, the `catch` block contains only a printing\
    \ statement to display some information about the exception and that was enough\
    \ to handle it and resume the execution.\n\nIn real applications, however, it\
    \ becomes necessary to fix the problem that took place. If the problem was, for\
    \ example, running out of memory, it might be suitable to warn the user to close\
    \ some of the open applications and retry the operation.\n\n### Note\n\nUsing\
    \ the `Exception` class as a parameter in a `catch` block is equivalent to not\
    \ using a parameter at all.\n\nThat means:\n\n```cs\ncatch (Exception) {}\n```\n\
    \nis equivalent to:\n\n```cs\ncatch {}\n```\n\nYou can use a parameter, such as\
    \ `Exception e`, if you would like to display the exception text that is associated\
    \ with the object `e`.\n\n### Organizing the Handlers\n\nWhen you use more than\
    \ one `catch` block, it is important to catch the most specific exceptions before\
    \ the least specific ones.\n\nIf, for example, the most specific exception is\
    \ `ArithmeticException`, this exception should be the first one to catch. Then\
    \ you organize the rest of the handlers in order, ending with the most general\
    \ exception.\n\nFor example:\n\n```cs\ncatch (ArithmeticException e) // first\
    \ handler\n{\n    //...\n}\n\n...\n\ncatch (Exception e) // last handler\n{\n\
    \    // ...\n}\n```\n\nAlthough the sequence of the exception handlers is totally\
    \ up to your judgment, you cannot have the general handler before the specific\
    \ ones. If you do that, you get the following compiler error:\n\n`error CS0160:\
    \ A previous catch clause already catches all exceptions of this or of a super\
    \ type ('System.Exception').`\n\nIn the following example, you try the expression\
    \ `y/x` (where `y = 0`), which throws the divide-by-zero exception. Two handlers\
    \ are used, one that is a specific exception (`ArithmeticException`) and another\
    \ is the general exception (`Exception`).\n\n![](images/00225.jpeg)\n![](images/00226.jpeg)\
    \ ![](images/00227.jpeg)\n![](images/00228.jpeg)\n\n### Sequence of Events in\
    \ Handling Exceptions\n\nWhen an exception is thrown, the run-time engine stops\
    \ executing the code and starts searching for a `catch` block with a matching\
    \ handler. It then selects the most suitable handler and executes its code. If\
    \ the handler does not exist in the current method, it looks for it in the other\
    \ methods. The following examples demonstrate two scenarios that are worth comparing.\n\
    \nIn the first one (9-4A), an exception is thrown and handled in the same method\
    \ (`MyMethod2`). In the second example (9-4B), an exception is thrown in `MyMethod1`\
    \ and is handled in `MyMethod2`. Therefore, in the second example, you can see\
    \ how the methods are searched for the appropriate handler.\n\n![](images/00229.jpeg)\n\
    \n#### Output\n\nIn the following text, you can see the output of the statements\
    \ that marked the start and end of each method. This enables you to keep track\
    \ of all the events that took place in the program. Notice in this example that\
    \ entering `MyMethod2` is followed by entering the `try` and `catch` blocks, and\
    \ then exiting the method.\n\n![](images/00230.jpeg)\n![](images/00231.jpeg)\n\
    ![](images/00232.jpeg) ![](images/00233.jpeg)\n\nNotice in the output that after\
    \ entering the `try` block in `MyMethod1`, the execution jumped to `MyMethod2`,\
    \ looking for a handler.\n\n![](images/00234.jpeg)\n\nNotice in Example 9-4A and\
    \ 9-4B that the execution entered the `try` block and displayed the sentence:\n\
    \n`Starting the try block.`\n\nHowever, you don't see the exiting statement from\
    \ the `try` block that was supposed to display:\n\n`Exiting the try block.`\n\n\
    This means that the execution never returns back to the point where the exception\
    \ was thrown.\n\n### The finally Block\n\nThe `finally` block is used with the\
    \ `try` block, in which case the statement is called the `try-finally` statement.\
    \ It can also be used with both `try` and `catch`, in which case the statement\
    \ is called the `try-catch-finally` statement.\n\nWhen using the `finally` block\
    \ in your program, control is transferred to that block regardless of whether\
    \ or not the exception was handled. The `finally` block is used to clean up the\
    \ resources, such as closing the open files.\n\n### The try-finally Statement\n\
    \n![](images/00235.jpeg)\n\nWhere:\n\n`try-block` contains the suspicious code\
    \ to be tried.\n\n`finally-block` contains the cleanup statement to be executed\
    \ regardless of the exception.\n\nThe following example demonstrates how the statements\
    \ in the `finally` block are executed. This program throws the exception `InvalidCast-Exception`\
    \ because it uses the cast `int` with an object of the type `string` (which is\
    \ an invalid cast). The `finally` block contains some statements that are executed\
    \ regardless of the thrown exception.\n\n![](images/00236.jpeg)\n![](images/00237.jpeg)\n\
    ![](images/00238.jpeg)\n\n### The try-catch-finally Statement\n\n![](images/00239.jpeg)\n\
    ![](images/00240.jpeg)\n![](images/00241.jpeg)\n![](images/00242.jpeg)\n![](images/00243.jpeg)\n\
    ![](images/00244.jpeg)\n![](images/00245.jpeg)\n![](images/00246.jpeg)\n\n###\
    \ USER DEFINED EXCEPTIONS\n\n![](images/00247.jpeg)\n![](images/00248.jpeg)\n\
    ![](images/00249.jpeg)\n![](images/00250.jpeg)\n\n### Rethrowing Exceptions\n\n\
    Sometimes you need to rethrow an exception. Consider this scenario: An exception\
    \ handler is taking care of an exception, but in order to get more information,\
    \ it has to throw the exception back to Main:\n\n```cs\ncatch (DivideByException\
    \ e)\n{\n    throw new DivideByException(\"Dividing by zero occurred in Main\"\
    , e);\n}\n```\n\n---\n\n# CHAPTER 10: Delegates and Events\n\n### Introduction\n\
    \n#### Inside Contents\n\n*   Delegate Definition.\n*   Declaring and using delegates.\n\
    *   Adding and deleting delegates.\n*   Anonymous methods.\n*   Covariance and\
    \ Contravariance.\n*   Events.\n*   Using events in application.\n\n#### What\
    \ Is a Delegate?\n\nA delegate is one of the reference types in C#. It is used\
    \ to encapsulate a method of a specific signature and pass it as its parameter.\
    \ It is similar to a function pointer in C++ except it is type-safe like all the\
    \ elements of the managed languages under the umbrella of .NET. As the name indicates,\
    \ the delegate does not work alone, but it delegates the associated method to\
    \ do its work.\n\n#### Declaring Delegates\n\nYou can declare a delegate using\
    \ the following form:\n\n`[modifiers] delegate result identifier ([parameters])`\n\
    \nwhere:\n\n*   `modifiers` is a valid combination of access modifiers in addition\
    \ to the `new` modifier.\n*   `result` is the type of the delegate, which is the\
    \ same as the type of the encapsulated method.\n*   `identifier` is the delegate\
    \ name.\n*   `parameters` is an optional list of parameters.\n\nFor example:\n\
    \n`delegate void MyDelegate(object o1, object o2);`\n\nThis delegate can encapsulate\
    \ methods with the same signature, such as:\n\n```cs\nstatic void MyMethod(object\
    \ o1, object o2) { ... }\n```\n\n#### Creating a Delegate\n\nTo Create a Delegate,\
    \ follow these steps:\n\n1. Declare the Delegate where you usually declare types\
    \ (in a namespace or a class) Example: `delegate void MyDelegate(object o1, object\
    \ o2);`\n\n2. Declare the method that will be associated with the delegate. for\
    \ example.\n\n```cs\npublic static void MyMethod(object id, object name) {....}\n\
    ```\n"
