  trans: "\n\nC# 2005 增加了部分类（partial classes），以便将一个类型（类、结构体或接口）拆分为多个部分，每个部分位于单独的文件。这在编写大型项目或使用机器生成的代码时非常有用。此功能还帮助开发团队对同一个应用程序进行协作。要声明部分类，类的所有部分都必须在\
    \ `class` 关键字之前使用 `partial` 修饰符。其他修饰符位于 `partial` 关键字之前。以下示例声明了一个名为 `TimeSheet`\
    \ 的类，它分为两个文件：\n\n```csharp\n// File1.cs\npublic partial class TimeSheet\n{\n \
    \   public void AddWorkingHours()\n    {\n        // ...\n    }\n\n    public\
    \ void CalculateSalary()\n    {\n        // ...\n    }\n}\n\n// File2.cs\npublic\
    \ partial class TimeSheet\n{\n    public void SubtractVacationTime()\n    {\n\
    \        // ...\n    }\n}\n```\n\n在编译时，类的所有部分将被组合以创建该类。当然，所有部分必须包含在同一个 `namespace`\
    \ 中，但不能跨程序集。以下规则和限制控制了部分类的使用：\n\n1. 所有构成一个类的部分类必须使用相同的可访问级别。\n2. 如果类的某部分使用 `abstract`\
    \ 或 `sealed` 修饰符声明，则该修饰符适用于整个类。\n3. 如果一个部分类派自一个基类，则所有其他部分类都继承此基类，即使在它们的声明中没有提到它。这意味着如果你有两个部分类，如示例所示：\n\
    \n```csharp\npartial class Employee: Person\n{\n    // ...\n}\n\npartial class\
    \ Employee: Citizen\n{\n    // ...\n}\n```\n\n那么 `Employee` 类实际上将是：\n\n```csharp\n\
    class Employee: Person, Citizen\n{\n    // ...\n}\n```\n\n4. 适用于类继承的规则也适用于实现接口。以下示例包含两个文件——`file1.cs`\
    \ 和 `file2.cs`，它们包含了 `Employee` 类的定义。每个文件都包含声明为 `partial` 的类部分。要编译程序，使用以下命令：\n\
    \n```bash\ncsc/out:Ex5-14.exe file1.cs file2.cs\n```\n\n这会将两个文件 `file1.cs` 和 `file2.cs`\
    \ 结合，并生成名为 `Ex5-14.exe` 的可执行文件。\n\n![](img/00133.jpeg)\n![](img/00134.jpeg)\n\
    ![](img/00135.jpeg)\n![](img/00136.jpeg)\n![](img/00137.jpeg)\n\n## 总结 :\n\n![](img/00138.jpeg)\n\
    ![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg) ![fractal-tree2](img/00055.jpeg)\n\
    ![](img/00023.jpeg)\n![STAR-LOGO-2013](img/00004.jpeg)\n\n# 第 6 章\n## (函数成员)\n\
    \n### 引言\n\n**目录内容：**\n* 定义函数成员。\n* 多态性。\n* 使用抽象类和方法。\n* 方法重载。\n* 向方法传递参数。\n*\
    \ 声明和使用索引器。\n* 用户自定义运算符。\n* 重写 ToString()。\n\n类或结构体的所有成员（字段和常量除外）都被分类为函数成员。如果你是一个\
    \ `c++` 程序员，你可能会将其与相同概念的成员函数。\n\n函数成员包括：\n* 方法。\n* 属性。\n* 事件。\n* 索引器。\n* 用户自定义运算符。\n\
    * 构造函数。\n* 析构函数。\n\n你在前面的第 1 到第 5 章中学习了其中一些成员，其余将在后续章节中解释。\n\n### 多态性\n\n继承的一个重要益处是代码的可重用。例如，如果另一个程序员已经创建了一个名为\
    \ `Person` 的类，你就不需要重写相同的类来创建 `Employee` 类或 `PoliceMan` 类。这些类的许多特征已经包含在 `Person`\
    \ 类中了。你只需要继承 `Person` 类，并向其添加 `Employee` 或 `PoliceMan` 的特征即可。\n\n这将节省你重复造轮的精力。继承的第二个益处是多态性。在编程中，你在\
    \ Microsoft Windows 环境中处理各种用户界面窗口，例如传递消息或警告的对话框，以及用于绘制或写入的窗口。\n\n如果你写了一个名为 `DrawWindow`\
    \ 的方法，你可以将此方法与代表不同类型窗口的各种对象关联。根据与方法关联的对象，结果也会不同。\n\n考虑这些示例：\n```csharp\nmyButton.DrawWindow();\
    \ // 绘制按钮\nmyMsg.DrawWindow(); // 绘制消息框\nmyPaintSurface.DrawWindow(); // 绘制绘画窗口\n\
    ```\n\n这三个对象——`myButton`、`myMsg` 和 `myPaintSurface`——并不是同一个类的实例，而是派自基类的类的实例，该基类包含了原始的\
    \ `DrawWindow` 方法。每个对象都用于调用 `DrawWindow` 方法的新定义。\n\n### 虚方法和重写方法\n\n要使用上一节中引入的多态方法，请在基类中使用\
    \ `virtual` 关键字声明 `DrawWindow` 方法：\n\n```csharp\npublic virtual void DrawWindow()\n\
    {\n    // 基类中的方法定义。\n}\n```\n\n然后，在继承基类的每个类中，使用 `override` 关键字声明 `DrawWindow`\
    \ 方法：\n\n```csharp\npublic override void DrawWindow()\n{\n    // 基类中的方法定义。\n}\n\
    ```\n\n使用 `override` 关键字声明的方法称为重写方法。它可以覆盖基类中具有相同名称、签名和可访问级别的另一个方法。\n\n"
- fmt: "\nIn this section, we will use an example that demonstrates calculating the\
    \ areas of different shapes. The example includes inheritance and overriding the\
    \ virtual methods on the base class. The class contains two dimensions, `x` and\
    \ `y`, and a virtual method to calculate the area:\n\n```csharp\npublic virtual\
    \ double Area()\n{\n    return 0;\n}\n```\n\nThe returned value (zero) doesn’t\
    \ mean much now because other methods will override this method and change its\
    \ behavior. Several classes will inherit this class, such as the `Point`, `Circle`,\
    \ `Sphere`, and `Cylinder` classes. The common factor among all these classes\
    \ is the `x` and `y` dimensions.\n\nThe dimension `x` might represent a side of\
    \ a square or a radius of a circle or a sphere. The dimension `y` could be the\
    \ length of a rectangle or the height of a cylinder. Inheriting these dimensions\
    \ will certainly facilitate creating the derived classes. Each of the derived\
    \ classes contains a method that has the same name: `Area`.\n\nThis is the `Area`\
    \ method of the `Circle` class:\n\n```csharp\npublic override double Area()\n\
    {\n    return Math.PI * x * x;\n}\n```\n\nThis is the `Area` method of the `Sphere`\
    \ class:\n\n```csharp\npublic override double Area()\n{\n    return 4 * Math.PI\
    \ * x * x;\n}\n```\n\nThis is the `Area` method of the `Cylinder` class:\n\n```csharp\n\
    public override double Area()\n{\n    return 2 * Math.PI * x * x + 2 * Math.PI\
    \ * x * y;\n}\n```\n\nAll these methods use the modifier `override`, which enables\
    \ them to override the `Area` method in the base class.\n\nThe area of the point\
    \ is, of course, zero. It will use the value returned by the base class. When\
    \ you create these classes, it is important to build the base class when you build\
    \ the derived class.\n\nFor example:\n\n```csharp\npublic Cylinder(double r, double\
    \ h): base(r, h)\n{\n}\n```\n\nIn this constructor, the `base` keyword is used\
    \ to call the base class constructor before building the cylinder object. The\
    \ reason for that is to pass the parameters `h` and `r` to the corresponding fields\
    \ in the base class. Here is the complete example:\n\n![](images/00139.jpeg)\n\
    ![](images/00075.jpeg)\n![](images/00075.jpeg)\n![](images/00140.jpeg)\n![](images/00141.jpeg)\n\
    ![](images/00142.jpeg)\n\nwhen you run this program you will be asked to enter\
    \ two numbers that represents the radius and the height. it will then display\
    \ the corresponding areas of the circle, sphere , and cylinder.\n\n![](images/00143.jpeg)\n\
    \n### Abstract Classes and Methods\n\nThe purpose of an abstract class is to be\
    \ inherited by other classes. It cannot be instantiated. The abstract method is,\
    \ by default, a virtual method. It can exist only inside an abstract class. Declare\
    \ abstract classes or abstract methods using the `abstract` keyword as in this\
    \ example:\n\n```csharp\nabstract class MyBaseClass // abstract class\n{\n   \
    \ public abstract void MyMethod(); // abstract method\n    ...\n}\n```\n\nThe\
    \ abstract class might contain abstract methods and properties. When an abstract\
    \ class is inherited, the derived class must implement all of its methods and\
    \ properties. As you can see in the code segment above, the abstract method doesn’t\
    \ contain any implementation. The implementation goes inside the overriding methods\
    \ of the derived classes. The following keywords are not allowed in the abstract\
    \ method declaration:\n\n*   `Static`\n*   `Virtual`\n\nNote for C++ programmers:\
    \ The abstract method is equivalent to the pure virtual function in C++. Abstract\
    \ properties are similar to abstract methods except in the way they are declared.\
    \ The following example demonstrates abstract classes, methods, and properties.\n\
    \n![avatar_medium](images/00144.jpeg) ![avatar_medium](images/00144.jpeg) ![avatar_medium](images/00144.jpeg)\n\
    ![](images/00145.jpeg)\n![](images/00146.jpeg)\n\n### Method Overloading\n\nOverloading\
    \ methods means that you can give the same name to more than one method and let\
    \ the compiler load the appropriate method according to the number and type of\
    \ parameters. It might be suitable to use method overloading if the purposes of\
    \ the methods are similar. For example, if you would like to create one method\
    \ to return the square root of an integer and another to return the square root\
    \ of a real number, you would use the same name for both methods:\n\n```csharp\n\
    int SquareIt(int x)\ndouble SquareIt(double f)\n```\n\nThen if you use the following\
    \ call:\n\n```bash\nSquareIt(3.25);\n```\n\nthe compiler will invoke the method\
    \ `SquareIt(double f)`, which uses a real parameter.\n\nWhen you use the following\
    \ call:\n\n```bash\nSquareIt(44);\n```\n\nThe compiler will invoke the method\
    \ `SquareIt(int x)`, which uses an integer parameter. The return type does not\
    \ have any effect on overloading. That means that methods might have similar names\
    \ and return types, but the compiler can still differentiate between them as in\
    \ the following example:\n\n```csharp\nvoid SquareIt(int x)\nvoid SquareIt(double\
    \ f)\n```\n\nNote: The binding between the specific method and the call is done\
    \ at compile time, before the program runs. This is called static or early binding,\
    \ as opposed to dynamic or late binding used with virtual methods. It is also\
    \ possible to overload methods that use the same type but a different number of\
    \ parameters. For example:\n\n```csharp\nvoid MyMethod(int m1) { }\nvoid MyMethod(int\
    \ m2, int m3) { }\n```\n\nOne important use of overloading is operator overloading\
    \ to invent new uses for operators, as explained in Section 6-8. In the following\
    \ example, three methods use the name `MyMethod`, but each uses different parameters.\
    \ The three methods are called from within the `Main` method and generate three\
    \ different results.\n\n![](images/00147.jpeg)\n![](images/00148.jpeg)\n![](images/00149.jpeg)\n\
    ![](images/00150.jpeg)\n\n### Passing Parameters to Methods\n\nWhen you pass a\
    \ parameter to a method, it is important to know what is going on in the background\
    \ in order to avoid unexpected results. For example, you may create a method to\
    \ change the value of a variable, and then find out in the end that the change\
    \ affected only the local variable and not the original value. One common example\
    \ of this problem is swapping the values of two variables.\n\nIn C#, there are\
    \ two ways to pass a parameter to a method: by value (which is the default) or\
    \ by reference. Passing parameters by reference makes the changes to the variable\
    \ values persist.\n\nTo pass a parameter by reference, modify the parameter with\
    \ the `ref` keyword. The following example demonstrates swapping the values of\
    \ two variables.\n\n![](images/00151.jpeg)\n![](images/00152.jpeg)\n\nAs you can\
    \ see in the preceding example, the `Swap` method is using the `ref` keyword to\
    \ modify the parameters in both the method header and the method call. This method\
    \ did swap the two variables, as indicated in the output. In the following example,\
    \ take a look at how this function will behave if you pass the parameters by value\
    \ —without the keyword `ref`.\n\n![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)\
    \ ![fractal-tree2](images/00055.jpeg)\n![](images/00153.jpeg)\n\nAs you can see\
    \ in the output, the values of `x` and `y` did not change after invoking the `Swap`\
    \ method. The change took place only inside the method, but when the method returned\
    \ to the caller, the values were the same. Recall that in Example 6-4 we passed\
    \ the memory addresses that contain the variables. That is why the `Swap` method\
    \ succeeded.\n\n### Various Ways to Pass Parameters to Methods\n\nThere is more\
    \ than one way to pass parameters to a method by reference. There are three parameter\
    \ modifiers, each of which results in saving the changes of the variable values\
    \ after the method returns to the caller. The three modifiers are:\n\n*   `Ref`\n\
    *   `Out`\n*   `Params`\n\nThe three modifiers, however, have different uses,\
    \ as explained in the following sections.\n\n#### Using ref\n\nAs you have seen\
    \ in the preceding examples, the `ref` keyword is used to pass variables to a\
    \ method and reflect back the changes that occurred on the original variables.\
    \ When you use `ref` to pass a variable to a method, the variable must be initialized\
    \ first; otherwise, you will get a compiler error.\n\nFor example:\n\n```csharp\n\
    string myVariable = \"This my string\"; // initialize the variable\nMyMethod(ref\
    \ myVariable); // invoke the method\n```\n"
