  trans: "\n正如你在程序中所看到的，`catch` 块仅包含一个打印语句，用于显示某些关于异常的信息，这已经足够处理异常并继续执行程序。\n\n然而，在实际应用程序中，有必要修复发生的问题。如果问题是例如内存耗尽，可能需要警告用户关闭一些已打开的应用程序并重试操作。\n\
    \n### 注意\n\n在 `catch` 块中使用 `Exception` 类作为参数等同于完全不使用参数。\n\n这意味着：\n\n```cs\ncatch\
    \ (Exception) {}\n```\n\n等同于：\n\n```cs\ncatch {}\n```\n\n如果你想显示与对象 `e` 关联的异常文本，可以使用参数，例如\
    \ `Exception e`。\n\n### 组织处理程序\n\n当你使用多个 `catch` 块时，重要的是在捕获最通用的异常之前，先捕获最具体的异常。\n\
    \n例如，如果最具体的异常是 `ArithmeticException`，那么该异常应该是第一个被捕获的。然后，你按照顺序组织其余的处理器，并以最通用的异常结束。\n\
    \n例如：\n\n```cs\ncatch (ArithmeticException e) // 第一个处理程序\n{\n    //...\n}\n\n\
    ...\n\ncatch (Exception e) // 最后一个处理程序\n{\n    // ...\n}\n```\n\n虽然异常处理程序的顺序完全取决于你的判断，但你不能将通用处理器放在特定处理器之前。如果你这样做，你将得到以下编译器错误：\n\
    \n`error CS0160: A previous catch clause already catches all exceptions of this\
    \ or of a super type ('System.Exception').`\n\n在在接示例示例中，你尝试执行表达式 `y/x`（其中 `y =\
    \ 0`），这会抛出除以零的异常。使用了两个处理器，一个是特定异常（`ArithmeticException`），另一个是通用异常（`Exception`）。\n\
    \n![](img/00225.jpeg)\n![](img/00226.jpeg) ![](img/00227.jpeg)\n![](img/00228.jpeg)\n\
    \n### 异常处理中的事件序列\n\n当异常被抛出时，运行时引擎停止执行代码，并开始寻找具有匹配处理器的 `catch` 块。它会选择最合适的处理器并执行其代码。如果当前方法中不存在该处理器，它将在其他方法中查找。以下示例演示了两个值得比较的场景。\n\
    \n在第一个示例（9-4A）中，异常在同一个方法（`MyMethod2`）中抛出并处理。在第二个示例（9-4B）中，异常在 `MyMethod1` 中抛出并在\
    \ `MyMethod2` 中处理。因此，在第二个示例中，你可以看到如何在方法间搜索适当处理器。\n\n![](img/00229.jpeg)\n\n####\
    \ 输出\n\n在下文中你可以看到标记每个方法开始和结束的语句的输出。这让你能够跟踪程序中发生的所有事件。注意在此示例中，进入 `MyMethod2` 之后进入了\
    \ `try` 和 `catch` 块，然后退出方法。\n\n![](img/00230.jpeg)\n![](img/00231.jpeg)\n![](img/00232.jpeg)\
    \ ![](img/00233.jpeg)\n\n注意输出中，在进入 `MyMethod1` 的 `try` 块后，执行跳转到了 `MyMethod2` 寻找处理程序。\n\
    \n![](img/00234.jpeg)\n\n注意示例 9-4A 和 9-4B，执行进入了 `try` 块并显示了句子：\n\n`Starting the\
    \ try block.`\n\n然而，你没有看到本应该显示的的退出 `try` 块的语句：\n\n`Exiting the try block.`\n\n\
    这意味着执行从未返回到抛出异常的位点。\n\n### finally 块\n\n`finally` 块与 `try` 块一起使用，这种情况下该语句被称为 `try-finally`\
    \ 语句。它也可以同时与 `try` 和 `catch` 使用，这种情况下该语句被称为 `try-catch-finally` 语句。\n\n在程序中使用\
    \ `finally` 块时，无论异常是否被处理，控制都会转移到该块。`finally` 块用于清理资源，例如关闭已打开的文件。\n\n### try-finally\
    \ 语句\n\n![](img/00235.jpeg)\n\n其中：\n\n`try-block` 包含要尝试的可疑代码。\n\n`finally-block`\
    \ 包含无论异常如何都会执行的清理语句。\n\n接下来的示例演示了 `finally` 块中的语句是如何执行的。该程序抛出了 `InvalidCast-Exception`\
    \ 异常，因为它对类型为 `string`的对象使用了 `int` 转换（这是一个无效转换）。`finally` 块包含了一些无论抛出异常如何都会执行的语句。\n\
    \n![](img/00236.jpeg)\n![](img/00237.jpeg)\n![](img/00238.jpeg)\n\n### try-catch-finally\
    \ 语句\n\n![](img/00239.jpeg)\n![](img/00240.jpeg)\n![](img/00241.jpeg)\n![](img/00242.jpeg)\n\
    ![](img/00243.jpeg)\n![](img/00244.jpeg)\n![](img/00245.jpeg)\n### 定义异常\n\n###\
    \ 定义异常\n\n---\n\n# 第 10 章：委托与事件\n\n### 引言\n\n#### 目录\n\n*   委托定义。\n*   声明和使用委托。\n\
    *   添加和删除委托。\n*   匿名方法。\n*   协变与逆协变。\n*   事件。\n*   在应用程序中使用事件。\n\n#### 什么是委托？\n\
    \n委托是 C# 中的一种引用类型。它用于封装特定签名的方法并作为参数传递。它类似于 C++ 中的函数指针，但像 .NET 伞下的所有托管语言元素一样是类型安全的。正如名称所示，委托并不独立工作，而是委托给关联的方法来执行工作。\n\
    \n#### 声明委托\n\n你可以使用以下格式声明委托：\n\n`[modifiers] delegate result identifier ([parameters])`\n\
    \n其中：\n\n*   `modifiers` 是除 `new` 修饰符外的有效访问修饰符。\n*   `result` 是委托的类型，与封装方法的类型相同。\n\
    *   `identifier` 是委托名称。\n*   `parameters` 是可选的参数列表。\n\n例如：\n\n`delegate void MyDelegate(object\
    \ o1, object o2);`\n\n该委托可以封装具有相同签名的方法，例如：\n\n```cs\nstatic void MyMethod(object\
    \ o1, object o2) { ... }\n```\n\n#### 创建委托\n\n要创建委托，遵循以下步骤：\n\n1. 在通常声明类型的地方（命名空间或类中）声明委托。例如：`delegate\
    \ void MyDelegate(object o1, object o2);`\n\n2. 声明与委托关联的方法。例如：\n\n```cs\npublic\
    \ static void MyMethod(object id, object name) {....}\n```\n\n### 重新抛出异常\n\n你需要重新抛出异常。考虑此场景：异常处理器处理了异常，但为了获取更多信息，它必须将其抛回给\
    \ Main：\n\n```cs\ncatch (DivideByException e)\n{\n    throw new DivideByException(\"\
    Dividing by zero occurred in Main\", e);\n}\n```\n"
- fmt: "\nNotice that the return type and parameter types are identical for both the\
    \ methods and the delegate (they are indicated by the boldfaces).\n\n### 3. Create\
    \ a delegate object\n\n```cs\nMyDelegate delegObj = new MyDelegate(MyMethod);\n\
    ```\n\nNotice that the parameter of the delegate is the name of the encapsulated\
    \ method. you can also create a delegate object without using the `new` operator,\
    \ simply by assigning the method to the delegate:\n\n```cs\nMyDelegate delegObj\
    \ = MyMethod;\n```\n\n#### Invoking the Delegate\n\nInvoke the delegate using\
    \ the same parameters you would use when calling the associated method. You can\
    \ invoke the delegate created in the preceding section like this:\n\n```\ndelegObj(119,\
    \ \"Jane Doe\");\n```\n\nAlternatively, you can invoke the delegate from a method,\
    \ as shown in the following example:\n\n```cs\npublic static void CallDelegate(MyDelegate\
    \ meth)\n{\n    meth(119, \"Jane Doe\");\n}\n```\n\nNotice that this method is\
    \ using a parameter, `meth`, of the type `MyDelegate`. It is obvious that the\
    \ name of the method is not important, but the signature is; it must have the\
    \ same signature as the encapsulated method, `MyMethod`. You can also invoke the\
    \ delegate by using the `.NET` method `Invoke` like this:\n\n```cs\ndelegObj.Invoke(119,\
    \ \"Jane Doe\");\n```\n\nIn this specific example, we used the modifier `static`,\
    \ just to make things simpler. However, delegates can use both instance and static\
    \ methods. In the following example, delegates are brought into action.\n\n![](images/00260.jpeg)\n\
    \n![](images/00261.jpeg) ![](images/00262.jpeg)\n\n#### Associating a Delegate\
    \ with More Than One Method\n\nThe association between a delegate and a method\
    \ is defined dynamically at run time. In other words, the delegate doesn’t know,\
    \ during the compilation, which method it will encapsulate.\n\nWhat matters is\
    \ the signature and the return type of that method. This means that you can associate\
    \ the same delegate with more than one method in your program. In the following\
    \ example, two double methods are declared, one to calculate the average and one\
    \ to calculate the sum.\n\nA delegate of the type `double` is declared and instantiated.\
    \ The delegate object is associated with each method and invoked, one at a time.\n\
    \n![](images/00263.jpeg)\n\n![](images/00264.jpeg)\n\n![](images/00265.jpeg)\n\
    \n#### Adding and Removing Delegates\n\nDelegates can be combined by using the\
    \ `+` operator to create a compound delegate. Invoking the compound delegate invokes\
    \ the constituent delegates. The purpose of combining delegates is to encapsulate\
    \ more than one method by the same delegate.\n\nThis operation is called multicasting.\
    \ It is also possible to remove a delegate from a compound delegate by using the\
    \ `-` operator. You can use `+=` and `-=` to do the same thing.\n\nSimilarly,\
    \ you can add and remove delegates by using the `.NET` methods `Combine` and `Remove`,\
    \ which are members of the class `System.Delegate`. The following example demonstrates\
    \ delegate multicasting.\n\n![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)\
    \ ![avatar_medium](images/00005.jpeg)\n\n![](images/00266.jpeg) ![](images/00267.jpeg)\
    \ ![](images/00268.jpeg)\n\n#### Anonymous Methods\n\nAnonymous methods, a new\
    \ feature of C# 2005, enables you to pass a code segment as a delegate parameter\
    \ directly without declaring a separate method. Consider the following delegate\
    \ declaration:\n\n```cs\ndelegate void MyDelegate(string s);\n```\n\nInstead of\
    \ declaring a separate method, `MyMethod`, like this:\n\n```cs\npublic void MyMethod(string\
    \ s)\n{\n    Console.WriteLine(s);\n}\n```\n\nyou can directly associate the delegate\
    \ with the method’s code:\n\n```cs\nMyDelegate delegObject = delegate(string s)\
    \ { Console.WriteLine(s); };\n```\n\nNotice the semicolon at the end of the block.\
    \ In the following example, a delegate using an anonymous method with two object\
    \ parameters is demonstrated.\n\n![](images/00269.jpeg)\n\n![](images/00270.jpeg)\n\
    \n#### Covariance\n\nCovariance is a new feature that was added to C# 2005 to\
    \ provide some flexibility in matching the delegate type and the return type of\
    \ the encapsulated method. Instead of using the same type for both the delegate\
    \ and the method’s return value, covariance permits using a return type for the\
    \ method that specializes (is derived from) the type of the delegate.\n\nIn the\
    \ following example, a delegate of the type `Person` encapsulates two methods,\
    \ `MyMethodP` and `MyMethodE`. `MyMethodP` has the return type `Person`. `MyMethodE`\
    \ has the return type `Employee`.\n\n![](images/00271.jpeg) ![](images/00272.jpeg)\
    \ ![](images/00273.jpeg)\n\n```cs\nMyDelegate d = mc;\n```\n\n#### Contravariance\n\
    \nContravariance is another new feature added to C# 2005 to provide some flexibility\
    \ in matching the delegate type and the return type of the encapsulated method.\
    \ Instead of using the same type for both the delegate and the method’s return\
    \ value, contravariance permits using a return type for the method that specializes\
    \ (is derived from) the type of the delegate.\n\nIn the following example, a delegate\
    \ of the type `Person` encapsulates two methods... like:\n\n```cs\ndelegate void\
    \ MyDelegate(string s);\n```\n\n#### Events\n\nOne of the most important uses\
    \ of delegates is events. When you click a button, an event is fired. For example,\
    \ if you created a Windows application, the only code you are required to provide\
    \ here is:\n\n```cs\nprivate void button1_Click(object sender, EventArgs e)\n\
    {\n    textBox1.Text = \"Hello, World!\";\n}\n```\n\nThis line of code means:\
    \ “When you click the button, write the phrase ‘Hello, World!’ in the text box.”\
    \ The method itself is provided by the IDE when you double-click the button.\n"
