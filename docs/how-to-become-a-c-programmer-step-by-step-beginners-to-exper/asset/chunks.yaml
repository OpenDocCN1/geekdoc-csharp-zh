- fmt: "\nIn order to hide `MyClass` in the base class, the new modifier is used in\
    \ the class declaration. This way, it becomes possible to access members in both\
    \ classes and use their members.\n\n![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)\
    \ ![avatar_medium](images/00005.jpeg)\n\n![](images/00208.jpeg)\n\n![](images/00209.jpeg)\n\
    \n![](images/00210.jpeg)\n\n![](images/00211.jpeg)\n\n# Hiding Interface Members\n\
    \nIt is also possible to apply the same principle of hiding base class members\
    \ on interfaces. Suppose that you have two interfaces: `IBase` and `IDerived`.\
    \ As the name indicates, `IDerived` is derived from `IBase`. The following is\
    \ a declaration of a property `M1` on the interface `IBase`.\n\n```csharp\ninterface\
    \ IBase\n{\n    int M1 { get; set; }\n}\n```\n\nIn the same program, you can declare\
    \ a method with the same name, `M1`, on the interface `IDerived`:\n\n```csharp\n\
    interface IDerived: IBase\n{\n    new int M1();\n}\n```\n\nWith this declaration,\
    \ the member `M1` on the derived interface hides the member `M1` on the base interface.\
    \ In this case, it is necessary to use explicit interface implementation in any\
    \ class that implements these interfaces:\n\n```csharp\nclass MyClass: IDerived\n\
    {\n    private int m1;\n    // Explicit implementation of the property M1:\n \
    \   int IBase.M1\n    {\n        get { return m1; }\n        set { m1 = value;\
    \ }\n    }\n    // Explicit implementation of the method M1:\n    void IDerived.M1()\
    \ { }\n}\n```\n\nIt is also possible to implement the property explicitly and\
    \ the method normally, as shown in this example:\n\n```csharp\nclass MyClass:\
    \ IDerived\n{\n    private int m1;\n    // Explicit implementation of the property:\n\
    \    int IBase.M1\n    {\n        get { return m1; }\n        set { m1 = value;\
    \ }\n    }\n    // Normal implementation of the method:\n    public void M1()\
    \ { }\n}\n```\n\nA third possibility is to implement the method explicitly and\
    \ the property normally, as shown below:\n\n```csharp\nclass MyClass: IDerived\n\
    {\n    private int m1;\n    // Normal implementation of the property:\n    public\
    \ int M1\n    {\n        get { return m1; }\n        set { m1 = value; }\n   \
    \ }\n    // Explicit implementation of the method:\n    void IDerived.M1() { }\n\
    }\n```\n\nIn the following example, one of the explicit alternative implementations\
    \ of method and property is demonstrated.\n\n![](images/00212.jpeg)\n\n![](images/00213.jpeg)\n\
    \n![](images/00214.jpeg)\n\n![](images/00215.jpeg)\n\n![](images/00216.jpeg)\n\
    \n![STAR-LOGO-2013](images/00004.jpeg)\n\n# CHAPTER: ∞ 9 ∞ (Exceptions Handling)\n\
    \n## Introduction\n\n### Errors and Exceptions\nExceptions are run-time errors\
    \ that can stop the program execution unless they are handled properly. Exceptions\
    \ are generated when certain conditions occur in your program, such as dividing\
    \ by zero, trying to open a file that was erased, incorrect casting, or running\
    \ out of memory.\n\nIn such cases, you deal with the exception by using the appropriate\
    \ handler in order to prevent the program from stopping. The handler is a block\
    \ of code that catches the exception and tries to continue the program execution.\
    \ If the appropriate handler is not available in your code, the default handler\
    \ is used and the program is terminated.\n\nIn C#, an exception is an object of\
    \ the class `System.Exception` or one of its subclasses, which represents an error\
    \ that occurred during the program execution. The keywords used in handling exceptions\
    \ are `throw`, `catch`, and `finally`. Handling exceptions requires using a special\
    \ construct that uses one of the following statements:\n\n*   `throw`: To throw\
    \ or rethrow an exception.\n*   `try-catch`: To catch and handle the exception.\n\
    *   `try-finally`: To clean up the resources after throwing the exception regardless\
    \ of whether or not the exception was caught.\n*   `try-catch-finally`: To catch\
    \ and handle the exception and clean up resources.\n\nThese statements are explained\
    \ in the following sections.\n\n### Throwing an Exception\nIn this section, we\
    \ deliberately throw an exception to show you what one looks like. You can do\
    \ this using the `throw` statement. The `throw` statement takes the following\
    \ form:\n\n```csharp\nthrow [expression];\n```\n\nwhere:\n*   `expression` is\
    \ the exception object.\n\nSome of the exceptions that can be thrown by an application\
    \ are:\n\n*   `InvalidCastException`\n*   `OverFlowException`\n*   `ArgumentNullException`\n\
    *   `ArithmeticException`\n*   `DivideByZeroException`\n\nWhen an exception is\
    \ thrown, the execution pauses momentarily, searching for the appropriate exception\
    \ handler. If one is found, it handles the exception and the execution resumes;\
    \ otherwise, the execution is terminated at this point. In the following example,\
    \ you throw an exception object of the class `ArgumentNullException` after assigning\
    \ the value `null` to the variable `myString`.\n\n![](images/00217.jpeg)\n\n![](images/00218.jpeg)\n\
    \nWhen you run this program, it first display the text:\n`The string is Hello.`\n\
    \nIt then displays the following window:\n![](images/00219.jpeg)\n\nThis window\
    \ contains the regular options that are available when a runtime error occurs.\
    \ When you click `Debug`, the following Just-in-Time Debugger window appears on\
    \ the screen.\n\n![](images/00220.jpeg)\n\nAs you see in Figure 9-1, the name\
    \ of the exception that caused the termination is `ArgumentNullException`. You\
    \ can use the class `System.Exception` instead of `ArgumentNullException`, in\
    \ which case you get another message from the program:\n`Unhandled Exception:\
    \ System.Exception: Exception of type 'System.Exception' was thrown.`\n`at MyClass.Main()`\n\
    \nThe last line of code:\n`Console.Write(\"myString is null.\");`\nWill not be\
    \ executed because it followed throwing the exception. Note that the\n`Unhandled\
    \ Exception: ArgumentNullException: Value cannot be null.`\n`at MyClass.Main()`\n\
    is the default handler when you catch the exception.\n\n### Catching an Exception\n\
    You can catch exceptions by using the `try-catch` statement, which contains two\
    \ blocks. The first is the `try` block, inside which the suspicious code is inserted.\
    \ It takes the form:\n\n```csharp\ntry\n{\n    //\n}\ncatch (declaration)\n{\n\
    \    //\n}\n```\n\nwhere:\n*   `declaration` is the exception object declaration\
    \ and is optional.\n\nThe two blocks are used together to build one statement.\
    \ If you attempt to use the `try` block alone, you will get the compilation error:\
    \ `error CS1524: Expected catch or finally.`\n\nThe `catch` block can be used\
    \ without any parameters at all, in which case it is used to catch any exceptions.\
    \ It is also possible to use more than one `catch` block. In this case, the `try-catch`\
    \ statement takes the form:\n\n```csharp\ntry\n{\n    //\n}\ncatch (declaration-1)\n\
    {\n    // first handler\n}\ncatch (declaration-2)\n{\n    // second handler\n\
    }\ncatch (declaration-3)\n{\n    // third handler\n}\n```\n\nWhen the program\
    \ throws an exception, the run-time engine starts looking for the suitable `catch`\
    \ block that matches the exception. If the `catch` block is found, the program\
    \ resumes execution after handling the problem or displaying the appropriate message\
    \ that explains the problem that took place during the program execution.\n\n\
    Example 9-2 demonstrates the following:\n\n*   Throwing the exception.\n*   Trying\
    \ the suspicious code using the `try` block.\n*   Handling the exception by using\
    \ the `catch` block.\n\n![](images/00222.jpeg)\n\n![](images/00223.jpeg)\n\n![](images/00224.jpeg)\n\
    \nNotice in the above example that the existence of the `catch` block itself was\
    \ enough to resume the program execution, regardless of the code it contains.\n"
