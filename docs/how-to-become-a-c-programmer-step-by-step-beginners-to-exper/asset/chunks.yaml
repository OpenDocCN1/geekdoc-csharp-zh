    ## The Nullable Types


    The nullable types were added to value types with C# 2005. This feature enables
    you to assign the value `null` to a value-type variable. You need this with databases
    where a variable can assume any value including `null`. The nullable variable
    is declared by using the `?` symbol next to the type name, like this:


    ```csharp

    myType? myVariable;

    ```


    where `myType` is one of the value types including the `struct` type. It is called
    the underlying type of the nullable type. For example, consider the following
    statement:


    ```csharp

    int myInt? = null;

    ```


    In this statement, the underlying type is `int`. This means the variable `myInt`
    can accept all the values that can be assigned to `int` in addition to `null`,
    which means “not used” or “empty.” In the following example,


    ```csharp

    bool myBool?;

    ```


    `myBool` can assume one of the values `true`, `false`, or `null`. In databases,
    this feature is important because a database field may contain `null` to indicate
    that the variable is not defined.


    This is the same concept used with reference types where the value `null` has
    been used to indicate that a variable is not initialized.


    In the following example, you declare some nullable-type variables, assign them
    various values, and display the result. Notice that the values of the variables
    that were assigned `null` are displayed as blanks.


