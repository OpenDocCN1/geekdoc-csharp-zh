    (6 + 4) * 5


    In this expression, the addition is evaluated first because the parentheses higher
    precedence than the other operators. The addition evaluates to 10, which is multiplied
    by 5, giving the result 50.


    It is possible to assign an expression to a variable, as in this example:


    x = y * (2/3) – 1.0;


    These operators are called binary operators because they operate on two operands.             


    The Modulus Operator (%) -


    The modulus operator (%) is used to get the remainder of division.


    For example, the following expression:


    5 % 2


    gives the result 1, while the expression:


    4 % 2


    gives the result 0.


    Note: The modulus operator in C# can be applied to all numeric types.


    For example, the expression 5.2 % 5 evaluates to 0.2.


    The Assignment Operators-


    The= assignment operator is used for assigning a value, expression, or variable
    to a variable. The following table shows the use of assignment operators combined
    with arithmetic operators.


    ![](images/00033.jpeg)


    As you can see in the above table, each example in the Example Statement column
    is equivalent to a statement in the Equivalent Statement column.


    For example, the statement:


    x *= y; means multiply x by y and store the result in x.


    The statement:  x %= y;


    means divide x by y and store the remainder of the division in y. Increment and
    Decrement Operators(++, – –)


    Increment and decrement operators are classified as unary or primary arithmetic
    operators because they have only one operand. Consider the following statements:


    x++;


    y--;


    The first statement increments the value of x by 1, while the second decrements
    the value of y by 1\.


    The value of the expression that contains this kind of operator changes according
    to whether the ++ or –– operator comes before (prefix) or after (postfix) the
    variable.


    For example, the expression:


    --y + x             


    Means decrement y before adding its value to x.


    The expression:


    y-- + x


    Means decrement y after adding its value to x.


    ![](images/00034.jpeg)


    Operator Associativity-


    Associativity is the direction in which an expression is evaluated. Consider an
    expression that contains two operators of the same precedence, like the following:


    80 / 4 * 2


    How can the compiler decide which operator to apply first? If you apply the division
    first (left-to-right associativity), the result would be evaluated as follows:


    (80 / 4) * 2 = 40


    But if you apply the multiplication first (right-to-left associativity), the result
    would be evaluated as follows:


    80 / (4 * 2) = 10


    It is clear that the direction of evaluation changes the result. As you can see
    in this example, using parentheses changes the order in which expressions are
    evaluated. But if you leave out the parentheses, the rule for the compiler is
    to evaluate operators by using left-to-right associativity.


    In this case, the expression 80 / 4 * 2 is evaluated as 40\. In general, binary
    arithmetic operators use left-to-right associativity, while primary and unary
    arithmetic operators use right-to-left associativity.'
