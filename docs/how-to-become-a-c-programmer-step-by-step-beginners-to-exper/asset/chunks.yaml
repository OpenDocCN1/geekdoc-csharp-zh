  trans: "\n“struct”一词最初是 structure（结构）的缩写，已成为编程术语的一部分。在 C# 中，`struct` 是一个用户定义的值类型。然而，它可能同时包含引用类型和值类型的成员。\n\
    \n### 给 C++ 程序员的说明\n`struct` 的概念在 C++ 和 C# 语言中完全不同。在 C++ 中，可以使用 `struct` 关键字来声明一个类。而在\
    \ C# 中，情况并非如此。`struct` 用于表示轻量级对象，例如 `point`，它包含两个字段（`x` 和 `y`）。\n\n它也可以表示一种颜色，包含三个字段（`red`、`blue`\
    \ 和 `green`）。尽管我们在示例中使用了 `Point` 类，但对于此类对象来说，`struct` 是一种更合适的类型，因为它消耗的内存较少。\n\n\
    如果你创建一个由类表示的大型点数组，就能看到这种区别。在这种情况下，所需的内存将是巨大的，因为每个点都使用一个指向它的引用。\n\n### 声明和使用 struct\n\
    \n要声明一个 `struct`，像例示例一样使用 `struct` 关键字：\n\n```csharp\nstruct MyStruct\n{\n   \
    \ // struct 成员\n}\n```\n\n你可以使用任何有效的访问修饰符组合或 `new` 关键字来修改声明。当你使用 `struct` 时，请记住以下点：\n\
    \n与类不同，`struct` 的字段不能被初始化。这意味着以下语句将产生错误信息：\n\n```csharp\nstruct MyStruct\n{\n\
    \    int x = 0; // 错误\n    int y = 0; // 错误\n}\n```\n\n`struct` 可以使用一个或多个构造函数，但你不能为\
    \ `struct` 声明默认构造函数（无参数构造函数）。因此，以下构造函数是无效的：\n\n```csharp\nstruct MyStruct\n{\n\
    \    MyStruct() // 错误\n    {\n        //...\n    } \n}\n```\n\n编译器始终提供一个默认构造函数，将\
    \ `struct` 的成员初始化为它们的默认值。\n\n与类一样，你可以使用 `new` 运算符来创建 struct 对象，如下所示：\n\n```csharp\n\
    MyStruct ms = new MyStruct();\n```\n\n与类不同，你可以在不使用 `new` 运算符的情况下声明对象，如下所示：\n\n\
    ```csharp\nMyStruct ms;\n```\n\n在后一种情况下，你必须在使用它之前初始化 struct 字段。\n\n如前面的章节所述，`struct`\
    \ 不能被继承或继承自其他类型，但它可以实现一个或多个接口。\n\n例如：\n\n```csharp\nstruct MyStruct: IMyInterface\n\
    {\n    // ...\n}\n```\n\n虽然 struct 不能继承其他类型，但 struct 类型本身派自 `Object` 类。\n\n接下来的示例演示了\
    \ `Color` struct，它包含三个字段（`r`、`g` 和 `b`），代表三种基本色（红、绿、蓝）。该程序使用构造函数来创建两个不同颜色的对象。\n\
    \n![](img/00175.jpeg)\n![](img/00176.jpeg)\n![](img/00177.jpeg)\n\n在上面的示例中，使用了两个\
    \ struct 实例 `c1` 和 `c2`。第一个使用默认构造函数；因此，它的所有字段都包含值 0。\n\n第二个实例是使用参数 `100`、`100`\
    \ 和 `0` 构建的。这些值被分配给字段 `r`、`g` 和 `b`。通过使用语句直接显示对象：\n\n```csharp\nConsole.WriteLine(\"\
    The colors are: {0}\", c1);\n```\n\n这需要重写 `ToString` 方法以以相应的格式显示对象。在接下来的示例中，使用了三个属性\
    \ `R`、`G` 和 `B` 来访问私有字段 `r`、`g` 和 `b`。这使得通过属性直接访问字段成为可能，这是使用构造函数的替代方案。\n\n![](img/00178.jpeg)\n\
    ![](img/00179.jpeg)\n![](img/00180.jpeg)\n![](img/00181.jpeg)\n\n注意上面的示例，我们使用了一个用默认构造函数创建的对象。然后我们使用颜色属性将颜色值分配给相应的字段：\n\
    \n```csharp\nc1.R = 100;\nc1.G = 100;\nc1.B = 0;\n```\n\n该对象显示了两次——一次是默认值，一次是在给属性赋值后。你，，你可以使用一个带有三个参数的构造函数来实现相同的结果。\n\
    \n### 将 struct 和类传递给方法\n\n你在第 6 章中学习了可以按值或按引用将变量传递给方法。你还学习了按引用传递变量会反映它们在原始值上发生的任何更改，而按值传递则只会修改它们在方法中的副本，原始变量保持不变。struct\
    \ 由于是值类型，被创建在栈上。\n\n当传递给方法时，它们是按值传递的。由于类是引用类型，它们创建在堆上。当传递给方法时，它们是按引用传递的。\n\n接下来的示例演示了这一概念。在示例中，你声明了一个名为\
    \ `MyClass` 的类和一个名为 `MyStruct` 的 struct。\n\n然后你实例化该类和 struct，并将每个中的字段初始化为值 `555`。你将两个对象传递给方法\
    \ `MyMethod1` 和 `MyMethod2` 以将它们的字段更改为 `100`。\n\n然而，输出表明类的字段已经更改，但 struct 的字段没有。\n\
    \n### 枚举 (enum)\n\n枚举是一种用于存储一组命名常量的类型，例如星期几、月份等。枚举元素都是值类型，其底层类型可以是整数类型（`byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long`\
    \ 或 `ulong`）中的任何一种。默认底层类型是 `int`。\n\n#### 声明枚举\n\n你可以通过使用 `enum` 关键字来声明枚举，如下例所示列举了季节：\n\
    \n```csharp\nenum Seasons { Summer, Fall, Winter, Spring };\n```\n\n每个枚举元素都有值。第一个元素的默认值为\
    \ `0`。后续元素的值递增 `1`。元素的值：\n\n```csharp\nenum Seasons\n{\n    Summer, // 0\n   \
    \ Fall, // 1\n    Winter, // 2\n    Spring // 3\n};\n```\n\n你可以像这样强制元素从 `1` 开始：\n\
    \n```csharp\nenum Seasons { Summer = 1, Fall, Winter, Spring };\n```\n\n在这个枚举中，元素的值如下：\n\
    \n```csharp\nenum Seasons\n{\n    Summer = 1,\n    Fall, // 2\n    Winter, //\
    \ 3\n    Spring // 4\n};\n```\n\n你可以为任何元素赋值——而不一定是第一个：\n\n```csharp\nenum WeekDays\
    \ { Sat, Sun, Mon = 9, Tue, Wed, Thu, Fri };\n```\n\n这将使得 `Mon` 之后的元素值为 `10`、`11`、`12`\
    \ 和 `13`。然而，`Sat` 和 `Sun` 仍为 `0` 和 `1`。你也可以根据情况为元素分配整数。在这个示例中，分配了相应的成绩：\n\n```csharp\n\
    enum Grades { Pass = 65, Good = 75, VeryGood = 85, Distinct = 100 };\n```\n\n\
    你可以选择 `int` 以外的底层类型，例如 `long`，如果你需要在元素中使用范围内的数字：\n\n```csharp\nenum Color: long\
    \ { Red, Green, Blue };\n```\n\n#### 使用枚举\n\n为了使用其中一个枚举器，必须使用枚举名称对其进行限定。例如，`WeekDays`\
    \ 枚举的元素是 `WeekDays.Sun`、`WeekDays.Mon` 等。\n\n然而，要将枚举元素转换为整数类型，你必须使用强制转换。例如：\n\n\
    ```csharp\nint monday = (int) WeekDays.Mon;\nlong monday = (long) WeekDays.Mon;\n\
    ```\n\n在接下来的示例中，你声明了三个枚举 `WeekDays`、`Seasons` 和 `Grades`。该示例演示了前面章节解释的所有各种枚举规则。\n\
    \n![](img/00189.jpeg)\n"
- fmt: "\nAttributes are additional declarative information that can modify the declarations\
    \ of program entities (types, members, parameters, and so forth). At run time\
    \ the compiler can retrieve this information through a process called reflection.\
    \ Attributes can be either predefined or user-defined. In most cases, programmers\
    \ use the predefined attributes. The user-defined attributes are not covered in\
    \ this book.\n\nAttributes serve different purposes, such as marking a method\
    \ as deprecated, indicating conditional compilation, setting a type layout, and\
    \ so forth.\n\nAttributes are derived from the abstract class `System.Attribute`,\
    \ which defines the services of attributes. By convention, all attributes have\
    \ the suffix `Attribute`, such as `DllImportAttribute`. You can skip the suffix\
    \ and just use the attribute alias, which is `DllImport`.\n\nThe attribute is\
    \ written between brackets like this example:\n\n```text\n[method: DllImport(\"\
    user32.dll\")]\n```\n\nNotice that the brackets are part of the attribute syntax.\
    \ Do not confuse these brackets with those that indicate the optional part of\
    \ the syntax. The word “method” in this attribute represents the target to which\
    \ the attribute is applied.\n\nIn this example, the attribute applied is to a\
    \ method in the library `user32.dll`. In most cases, the target is optional; it\
    \ is necessary only if there is ambiguity. For instance, add the target if the\
    \ attribute can be applied to a method or a return type. In this example, the\
    \ attribute is written without the target element:\n\n```text\n[DllImport(\"user32.dll\"\
    )]\n```\n\nTarget elements can be any of the following:\n\n*   `Assembly`\n* \
    \  `field`\n*   `event`\n*   `method`\n*   `parameter`\n*   `property`\n*   `return`\n\
    *   `type`\n\nWhen using an attribute, either qualify its name or use the appropriate\
    \ using directive. The following are some commonly used attributes that exist\
    \ in various namespaces:\n\n*   `System.ObsoleteAttribute`\n*   `System.Diagnostics.ConditionalAttribute`\n\
    *   `System.Runtime.InteropServices.DllImportAttribute`\n*   `System.Xml.Serialization.XmlArrayAttribute`\n\
    \n### Attribute Parameters\n\nConsider this example, which indicates a deprecated\
    \ method by applying the `ObsoleteAttribute` attribute:\n\n```csharp\n[Obsolete]\n\
    \npublic static void MyMethod()\n{\n    // The body of the obsolete method.\n\
    }\n```\n\nWhen `MyMethod` is executed, you get the warning:\n\n`'MyClass.MyMethod()`\
    \ is obsolete.\n\nSome attributes such as `Obsolete` allow the programmer to provide\
    \ extra information on using the deprecated method. You can do this by using the\
    \ following modified version, which includes two parameters:\n\n```csharp\n[System.Obsolete\
    \ (\"Use MyNewMethod instead.\", false)]\n\npublic static void MyMethod()\n{\n\
    \    // The body of the obsolete method.\n}\n```\n\nWhen you compile this method,\
    \ the compiler generates the warning:\n\n`'MyClass.MyMethod()' is obsolete: 'Use\
    \ MyNewMethod instead.'`\n\nThe first parameter contains the string message that\
    \ you would like to add. The second parameter causes the compilation to generate\
    \ either an error or a warning, depending on whether it is `false` or `true`.\
    \ The default value is `false`.\n\n### The Conditional Attribute\n\nThis attribute\
    \ is in the namespace `System.Diagnostics`. It is used to execute a method if\
    \ a specific constant is defined in the program. For example:\n\n```csharp\n[Conditional(\"\
    MYCONSTANT\")]\n\npublic void MyMethod(string s) {}\n```\n\n`MyMethod` is only\
    \ executed if the constant `MYCONSTANT` is defined in the program with a preprocessor\
    \ directive:\n\n```csharp\n#define MYCONSTANT\n```\n\nIf the constant is not defined,\
    \ the execution resumes and the attribute is ignored. The target method must be\
    \ of the `void` type.\n\n### Combining Attributes\n\nAttributes can be grouped\
    \ or combined. For example, you can group the two attributes `Obsolete` and `Conditional`\
    \ as shown in this example:\n\n```csharp\n[Obsolete]\n\n[Conditional (\"TRACE\"\
    )]\n```\n\nYou can also combine the attributes by listing them inside a pair of\
    \ square brackets and separating them with commas:\n\n```csharp\n[Obsolete, Conditional\
    \ (\"TRACE\")]\n```\n\nYou can also combine the two styles together as shown in\
    \ this example, which uses three attributes:\n\n```csharp\n[Serializable]\n\n\
    [Obsolete, Conditional (\"TRACE\")]\n```\n\nThe following example demonstrates\
    \ combining attributes.\n\n![](images/00190.jpeg)\n![](images/00191.jpeg)\n\n\
    ### 7-5-4 Calling Native Functions\n\nTo call a native function (Outside the .NET\
    \ Framework), Such as `MessageBoxA`, use the `DllImportAttribute` attributes like\
    \ this example- \n\n```text\n[ DLLImport(“user32.dll”)]\n```\n\nTo use this function\
    \ in your C# Program, do the following:\n\n1. Declare the function as a C# method\
    \ by using the two modifiers `extern` and `static`:\n\n```csharp\nstatic extern\
    \ int MessageBoxA(int h, string m, string c, int type);\n```\n\n![](images/00192.jpeg)\n\
    ![](images/00193.jpeg)\n\nOutput:\n\n![](images/00194.jpeg)\n\n### Emulating Unions\n\
    \nIt is possible to use attributes to emulate unions in C++, as shown in the following\
    \ example:\n\n```csharp\n[type: StructLayout(LayoutKind.Explicit)]\npublic struct\
    \ UnionStruct\n{\n    [field: FieldOffset(0)] // offset #0\n    public int i;\n\
    \n    [field: FieldOffset(0)] // offset #0\n    public double d;\n}\n```\n\nIn\
    \ this example, two attributes are used:\n\n```text\n[type: StructLayout(LayoutKind.Explicit)]\n\
    \n[field: FieldOffset(0)]\n```\n\nThe first attribute targets the `struct`, and\
    \ the second targets a `field` of the `struct`. Notice that the words “type” and\
    \ “field” in these attributes can be omitted because they are obvious. Using these\
    \ two attributes, it is possible to store two numbers, an `int` and a `double`,\
    \ in the same memory location.\n\nThe two numbers are different in size but they\
    \ both start at offset 0. It is possible, of course, to use any offset, such as\
    \ `FieldOffset(2)` or `FieldOffset(5)`.\n\n![](images/00195.jpeg)\n![](images/00196.jpeg)\n\
    ![](images/00023.jpeg)\n\n# CHAPTER 8: Interfaces\n\n## Introduction\n\nInside\
    \ Contents\n\n*   Declaring and using interfaces.\n*   Using the `is` operator.\n\
    *   Using the `as` operator.\n*   Hiding class members\n*   Versioning.\n*   Hiding\
    \ interface members\n\n### What Is an Interface?\n\nIn daily life we deal with\
    \ the interfaces of many electronic devices such as TVs, iPods, and mobile phones.\
    \ When you browse in a store looking for a mobile phone, you don’t need to see\
    \ inside its capabilities. By looking at its interface you can see what it can\
    \ do. For example, you can tell if the phone has the ability to take pictures\
    \ or record video.\n\nAlso, if the manufacturer decides to add or remove some\
    \ features, it should be reflected on the interface. Similarly, in programming\
    \ you can tell by looking at the interface what is contained in the class that\
    \ implements this interface.\n\nIn other words, the interface is a contract that\
    \ describes the behavior of the class that implements this interface. Describing\
    \ an interface as a contract implies obligation. That means that a manufacturer\
    \ cannot add a camera button to a mobile phone without adding the implementing\
    \ electronic circuit that does the actual job internally. Similarly, if an interface\
    \ contains the name of a method, the class implementing this interface is obligated\
    \ to include the implementation of this method.\n\n### Declaring an Interface\n\
    \nDeclare an interface using the `interface` keyword as shown in this example:\n\
    \n```csharp\ninterface IMyInterface\n{\n    // interface members\n}\n```\n\nThe\
    \ declaration can be modified with a valid combination of access modifiers or\
    \ the `new` keyword. It can also be preceded by attributes. The members of an\
    \ interface can include:\n\n*   Methods\n*   Properties\n*   Indexers\n*   Events\n\
    \nThe interface cannot, however, contain fields. Interface members are public\
    \ by default. You cannot use accessibility modifiers on them. The members of an\
    \ interface are the signatures of methods, properties, indexers, or events. For\
    \ example:\n\n```csharp\ninterface ICounter\n{\n    void Count(int i);\n    int\
    \ SetCounter();\n}\n```\n"
  raw: 'Attributes are additional declarative information that can modify the declarations
    of program entities (types, members, parameters, and so forth). At run time the
    compiler can retrieve this information through a process called reflection. Attributes
    can be either predefined or user-defined. In most cases, programmers use the predefined
    attributes. The user-defined attributes are not covered in this book.


    Attributes serve different purposes, suchas marking a method as deprecated, indicating
    conditional compilation, setting a type layout, and so forth.


    Attributes are derived from the abstract class System.Attribute, which defines
    the services of attributes. By convention, all attributes have the suffix Attribute,
    such as DllImportAttribute. You can skip the suffix and just use the attribute
    alias, which is DllImport.


    The attribute is written between brackets like this example:


    [method: DllImport("user32.dll")]


    Notice that the brackets are part of the attribute syntax. Do not confuse these
    brackets with those that indicate the optional part of the syntax. The word “method”
    in this attribute represents the target to which the attribute is applied.


    In this example, the attribute applied is to a method in the library user32.dll.
    In most cases, the target is optional; it is necessary only if there is ambiguity.
    For instance, add the target if the attribute can be applied to a method or a
    return type. In this example, the attribute is written without the target element:


    [DllImport("user32.dll")]


    Target elements can be any of the following:


    *   Assembly.


    *   field.


    *   event.


    *   method.


    *   parameter.


    *   property.


    *   return.


    *   type.


    When using an attribute, either qualify its name or use the appropriate using
    directive. The following are some commonly used attributes that exist in various
    namespaces:


    System.ObsoleteAttribute.


    System.Diagnostics.ConditionalAttribute.


    System.Runtime.InteropServices.DllImportAttribute.


    System.Xml.Serialization.XmlArrayAttribute.


    Attribute Parameters-


    Consider this example, which indicates a deprecated method by applying the ObsoleteAttribute
    attribute:


    [Obsolete]


    public static void MyMethod()


    {


    // The body of the obsolete method.


    }


    When MyMethod is executed, you get the warning:


    ''MyClass.MyMethod()'' is obsolete.


    Some attributes such as Obsolete allow the programmer to provide extra information
    on using the deprecated method. You can do this by using the following modified
    version, which includes two parameters:


    [System.Obsolete ("Use MyNewMethod instead.", false)]


    public static void MyMethod()


    {


    // The body of the obsolete method.


    }


    When you compile this method, the compiler generates the warning:


    ''MyClass.MyMethod()'' is obsolete: ''Use MyNewMethod instead.''


    The first parameter contains the string message that you would like to add. The
    second parameter causes the compilation to generate either an error or a warning,
    depending on whether it is false or true. The default value is false.


    The Conditional Attribute-


    This attribute is in the namespace System.Diagnostics. It is used to execute a
    method if a specific constant is defined in the program. For example:


    [Conditional("MYCONSTANT")]


    public void MyMethod(string s) {}


    MyMethod is only executed if the constant MYCONSTANT is defined in the program
    with a preprocessor directive:


    #define MYCONSTANT


    If the constant is not defined, the execution resumes and the attribute is ignored.
    The target method must be of the void type.


    Combining Attributes-


    Attributes can be grouped or combined. For example, you can group the two attributes
    Obsolete and Conditional as shown in this example:


    [Obsolete]


    [Conditional ("TRACE")]


    You can also combine the attributes by listing them inside a pair of square brackets
    and separating them with commas:


    [Obsolete, Conditional ("TRACE")]


    You can also combine the two styles together as shown in this example, which uses
    three attributes:


    [Serializable]


    [Obsolete, Conditional ("TRACE")]


    The following example demonstrates combining attributes.


    ![](images/00190.jpeg)


    ![](images/00191.jpeg)


    7-5-4 Calling Native Functions;


    To call a native function ( Outside the .NET Framework ), Such as MessageBoxA,
    use the DLLImportAttribute attributes like this example- 


    [ DLLImport(“user32.dll”)]


    To use this function in your  C# Program, do the following:


    1.  Declare the function as a C# method by using the two modifiers extern and
    Static:


    Static extern int MessageBoxA(int h, string m, string c, int type);


    ![](images/00192.jpeg)


    ![](images/00193.jpeg)


    Output:


    ![](images/00194.jpeg)


    Emulating Unions-


    It is possible to use attributes to emulate unions in C++, as shown in the following
    example:


    [type: StructLayout(LayoutKind.Explicit)]


    public struct UnionStruct


    {


    [field: FieldOffset(0)] // offset #0


    public int i;


    [field: FieldOffset(0)] // offset #0


    public double d;


    }


    In this example, two attributes are used:


    [type: StructLayout(LayoutKind.Explicit)]


    [field: FieldOffset(0)]


    The first attribute targets the struct, and the second targets a field of the
    struct. Notice that the words “type” and “field” in these attributes can be omitted
    because they are obvious. Using these two attributes, it is possible to store
    two numbers, an int and a double, in the same memory location.


    The two numbers are different in size but they both start at offset 0\. It is
    possible, of course, to use any offset, such as FieldOffset(2) or FieldOffset(5).
    It is also possible to store any number of different types in the same location
    as long as you don’t use them at the same time. In the following example, more
    types are added to the union.


    ![](images/00195.jpeg)


    ![](images/00196.jpeg)


    ![](images/00023.jpeg)


    ![STAR-LOGO-2013](images/00004.jpeg)


    CHAPTER


    ∞ 8 ∞


    (Interfaces)


    Introduction-


    Inside Contents:


    *   Declaring and using interfaces.


    *   Using the “is operator”.


    *   Using the “as operator”.


    *   Hiding base class members


    *   Versioning.


    *   Hiding interface members


    What Is an Interface?


    In daily life we deal with the interfaces of many electronic devices such as TVs,
    iPods, and mobile phones. When you browse in a store looking for a mobile phone,
    you don’t need to see inside to know its capabilities. By looking at its interface
    you can see what it can do. For example, you can tell if the phone has the ability
    to take pictures or record video clips.


    Also, if the manufacturer decides to add or remove some features, it should be
    reflected on the interface. Similarly, in programming you can tell by looking
    at the interface what is contained in the class that implements this interface.


    In other words, the interface is a contract that describes the behavior of the
    class that implements this interface. Describing an interface as a contract implies
    obligation.


    That means that a manufacturer cannot add a camera button to a mobile phone without
    adding the implementing electronic circuit that does the actual job internally.
    Similarly, if an interface contains the name of a method, the class implementing
    this interface is obligated to include the implementation of this method.


    Declaring an Interface-


    Declare an interface by using the interface keyword as shown in thisexample:


    interface IMyInterface


    {


    // interface members


    }


    The declaration can be modified with a valid combination of access modifiers or
    the new keyword. It can also be preceded by attributes. The members of an interface
    can include:


    *   Methods.


    *   Properties.


    *   Indexers.


    *   Events.


    The interface cannot, however, contain fields. Interface members are public by
    default. You cannot use accessibility modifiers on them. The members of an interface
    are the signatures of methods, properties, indexers, or events. For example:


    interface ICounter


    {


    void Count(int i);


    int SetCounter();


    }'
