  trans: "\n\n所有这些语言都在 .NET 框架下工作并使用其库。实际上，你可以使用支持 .NET 的不同语言编写模块来编写应用程序。除了类库之外，\n\
    \n.NET Framework 包含了公共语言运行时（`CLR`），这是一个用于执行使用 .NET 库应用程序的集成环境。.NET Framework 还有其他版本可以在\
    \ Microsoft Windows 以外的操作系统上运行，例如 `Mono`。\n\n`Mono` 可以运行在 Mac OS X 和 Linux 等操作系统上。.NET\
    \ Framework 还有一个子集称为微软 .NET 紧凑型框架（Microsoft .NET Compact Framework），用于小型设备和智能手机。\n\
    \n### MSIL 和 JIT\n\n当你编译 C# 程序时，编译并不会直接生成原生（特定操作系统的）代码；它生成用微软中间语言（`MSIL` 或 `IL`）编写的代码。`MSIL`\
    \ 代码在运行时翻译成原生代码。这个编译阶段被称为即时编译（`JIT` ）。\n\n### 元数据 (Metadata)\n\n在编译期间，`CLR` 会创建有关你应用程序的信息。它包括类名、字段名、方法名和方法参数。这些信息被称为元数据（`metadata`），意味着关于数据的信息。\n\
    \n`metadata` 被 `CLR` 和 `Jitter`（`JIT` 编译器）用于许多用途，例如调试和类型检查。你也可以使用 `metadata` 创建类实例并使用类成员，无论源代码语言是什么。\n\
    \n### 程序集 (Assemblies)\n\n程序的编译结果创建一个程序集，它可以是一个 `.exe` 文件（可执行文件）或 `.dll` 文件（库）。\n\
    \n### 垃圾回收 (Garbage Collection)\n\n使用托管应用程序最大的优点之一是使用垃圾回收器（`GC`）。`CLR` 的作用在将 `IL`\
    \ 代码编译成原生代码并没有结束。事实上，`CLR` 负责在代码执行期间管理内存。\n\n它确保程序退出后，程序使用的内存被完全释放。对于非托管应用程序，程序员负责管理内存，并解决如果内存块在程序结束后仍保持分配状态可能会发生的问题。\n\
    \n![avatar_medium](img/00005.jpeg) ![avatar_medium](img/00005.jpeg) ![avatar_medium](img/00005.jpeg)\n\
    \n### 整合在一起\n\n.NET 应用程序按照以下步骤处理：\n\n1. 你首先使用一种 .NET 兼容语言（如 `C#`）编写你的应用程序。\n2.\
    \ `C#` 代码被编译成 `MSIL` 并存储在程序集中。`C#` 代码可能分布在多个源文件中，这些文件在编译期间被链接在一起。\n3. 在执行代码时，使用\
    \ `JIT` 编译器将其编译为特定操作系统的（原生）代码。\n4. 应用程序在 `CLR` 的控制下执行。当程序退出时，`GC` 释放分配的内存。\n\n\
    ### ILASM 和 ILDASM\n\n通过 Visual Studio，你有两个用于 IL 编译的程序：\n\n* `ilasm.exe`：用于编译用\
    \ `IL` 编写的程序并转换为 `.exe` 或 `.dll` 文件。\n* `ildasm.exe`：相反相反，读取 `.exe` 或 `.dll` 文件并检索包含清单（manifest）和元数据的\
    \ `IL` 文件。\n* 在下一节中，我们将使用 `ildasm.exe` 查看程序集的内容，并了解它的属性。\n\n![avatar_medium](img/00006.jpeg)\
    \ ![avatar_medium](img/00006.jpeg) ![avatar_medium](img/00006.jpeg)\n\n### 初探\
    \ C# 代码\n\n在接下来的章节中，我们将查看一下 `C#` 代码以及编译和执行它的各种方式，而不会深入探讨语法细节。\n\n#### C# 代码\n\n\
    下面的代码是一个可以编译为 `.dll` 文件的 `C#` 类的示例：\n\n```cs\n// EmployeeDLL.cs\n\npublic class\
    \ Employee\n{\n    // Fields:\n    public string name;\n    public string id;\n\
    \n    // Methods:\n    public double CalculateSalary(int hoursWorked, double rate)\n\
    \    {\n        double salary;\n        salary = rate * hoursWorked;\n       \
    \ return salary;\n    }\n}\n```\n\n#### 薪资 (Salary)\n\n这个示例包含了 `Employee` 类，该类包含以下员工数据字段：\n\
    \n* `id`\n* `name`\n\n代码还包含 `CalculateSalary` 方法。该方法接收两个参数：`hoursWorked`（工作小时数）和\
    \ `rate`（每小时薪资），用于计算并返回 `salary`（员工的总薪资）。\n\n当然，该类可以包含其他细节，但为了示例起见，这些已经足够了。包含此类的文件（其名称写在第一行的注释中\
    \ `EmployeeDLL.cs`）可以编译为 `.dll`。然后你可以使用 `ildasm.exe` 偷看一下这个 `.dll` 文件。输出如图所示。\n\
    \n![](img/00007.jpeg)\n\n在图 1-1 中，显示了 `Employee` 类的内容（字段和方法定义）。想要使用此类的程序员即使不看源代码也能获得足够的信息。\n\
    \n#### IL 代码\n\n如果你点击类的任何成员（例如方法 `CalculateSalary`），你就能看到它的 `IL` 代码，如图 1-2 所示。\n\
    \n![](img/00008.jpeg)\n\n忽略大括号之间的文本，并检查以点开头的代码（这被称为指令）。你会注意到 `CalculateSalary`\
    \ 方法的定义提供了使用该方法所需的所有信息：`CalculateSalary(int32 hoursWorked, float64 rate)`\n\n\
    `IL` 代码的优美之处在于它是自描述的。\n\n#### 清单 (The Manifest)\n\n通过双击图 1-1 中的 MANIFEST 图标，你可以看到程序集的内容，如文件名、版本和其他信息。\n\
    \n![](img/00009.jpeg)\n\n#### 使用库文件\n\n为了获得整体视图，让我们写一些代码来使用这个库。下面的 `C#` 程序包含了调用该方法并显示结果所需的源代码：\n\
    \n```cs\n// MyProgram.cs\nusing System;\n\nclass MyClass\n{\n    static void Main()\n\
    \    {\n        Employee emp = new Employee();\n        emp.name = \"John Martin\"\
    ;\n        emp.id = \"ABC123\";\n        double weeklyPayment = emp.CalculateSalary(40,\
    \ 55);\n        Console.WriteLine(\"ID: {0}, Name: {1}\", emp.id, emp.name);\n\
    \        Console.WriteLine(\"Payment= {0}\", weeklyPayment);\n    }\n}\n```\n\n\
    当你编译这段代码时，只需将其链接到 `.dll` 文件。这样你就可以这样调用 `CalculateSalary`：`CalculateSalary(40,\
    \ 55)`。\n\n`C#` 代码的细节将详细解释。现在让我们检查该文件的清单。该文件首先编译生成可执行文件（`MyProgram.exe`），然后使用\
    \ `ILDASM` 检查它。`MyProgram.exe` 的清单如图 1-4 所示。\n\n![](img/00010.jpeg)\n\n检查此文件中的指令并注意突出显示的项：`.assembly\
    \ extern employeeDLL`\n\n该指令告诉你在编译期间将源代码链接到了 `employeeDLL` 程序集。\n\n### 如何获取免费的\
    \ C# 编译器\n\n你可以从站点 [`msdn.microsoft.com/netframework/downloads/updates/default.asx`](http://msdn.microsoft.com/netframework/downloads/updates/default.asx)\
    \ 获取命令行编译器（`csc.exe`）。下载 .NET Framework 发行包，其中包含了编译器带有 C# 2005 语法的 .NET Framework。\n\
    \n"
- fmt: "\n# Support.\n\n## Compiling Programs in the Command-Line Environment\n\n\
    There are two cases in which you can use the command-line environment:\n\n* You\
    \ only have the compiler that comes with the .NET Framework.\n* You have the Visual\
    \ Studio IDE that comes with C# Express.\n\n### If You Have the Compiler without\
    \ the IDE\n\nIf you downloaded the C# command-line compiler only, you must include\
    \ it in the path before using it. Do this by adding the location of the compiler\
    \ to the `PATH` variable in the Windows environment. The compiler is located in\
    \ the following directory:\n\n`%windir%\\Microsoft.NET\\Framework\\<version>`\
    \ where:\n\n* `%windir%` is the environment variable that indicates the location\
    \ of the Windows directory. If you are using Windows XP, this variable is replaced\
    \ by `\"C:\\WINDOWS.`.\n* `<version>` is the version of the .NET Framework. The\
    \ latest version is `v2.0.50727`, which makes the location `%windir%\\Microsoft.NET\\\
    Framework\\v2.0.50727.`.\n\nTo add the location of the compiler to the path, use\
    \ the following steps:\n\n1. Click the Start menu.\n2. Select All Programs.\n\
    3. Select Accessories.\n4. Click Command Prompt.\n5. When the Command Prompt window\
    \ opens, enter the following command:\n\n```\nset path=%path%;%windir%\\Microsoft.NET\\\
    Framework\\v2.0.50727\n```\n\nFigure 1-5 shows the response to the `csc` command\
    \ before and after setting the path, assuming that you are compiling a file called\
    \ `myProg.cs`.\n\nNotice that before setting the path, the `csc` command was not\
    \ recognized by the operating system. When the `set path` command was entered,\
    \ the compilation completed.\n\n![](images/00011.jpeg)\n\n### If You Have the\
    \ Visual Studio IDE\n\nIf you downloaded the IDE, you don’t need to set up the\
    \ path. Just open the Visual Studio command prompt by using the following steps:\n\
    \n1. Click the Start menu.\n2. Select All Programs.\n3. Select Microsoft Visual\
    \ Studio.\n4. Select Visual Studio Tools.\n5. Click Visual Studio Command Prompt.\n\
    \nThis opens up the window shown in Figure 1-6. It also adds the location of the\
    \ command-line compiler (`csc.exe`) to the path, in which case you can access\
    \ the command-line compiler from any directory.\n\nFigure 1-6 shows the response\
    \ to the `csc` command in the Visual Studio 2005 Command Prompt window.\n\n![](images/00012.jpeg)\n\
    \n## Comparison of C# and C++\n\nIf you are coming from a C++ background, the\
    \ following information will be useful for you as it contains a comparison of\
    \ the two languages;\n\nTable 1-1: Comparison of C# and C++\n\n![](images/00013.jpeg)\n\
    ![](images/00014.jpeg)\n\n## 1-7 The Features of C# 2005\n\n![](images/00015.jpeg)\n\
    ![](images/00016.jpeg)\n\n### Summary: In this chapter:\n\n* You saw an overview\
    \ of object-oriented programming and how C# was built from the ground up as an\
    \ OOP language.\n* You learned about the .NET Framework and its elements: the\
    \ class library and the Common Language Runtime (`CLR`).\n* You also learned about\
    \ the Common Language Specification (`CLS`) and Common Type System (`CTS`) and\
    \ their role in creating .NET-supported languages.\n* You learned about assemblies\
    \ and how they are self described by using the manifest metadata.\n* You also\
    \ had an overview of the C# code, and examined the IL code and the manifest of\
    \ a `.dll` and an executable file.\n* You also have seen a comparison of C# and\
    \ C++, from which C# evolved.\n* Finally, you took a global look at the new features\
    \ of C# 2005, which are explained throughout this book.\n\n![STAR-LOGO-2013](images/00004.jpeg)\n\
    \n# CHAPTER ∞ 2 ∞\n(Your First Approach @ C# Program)\n\n## Introduction\n\n###\
    \ Let’s Start your First C# Program\n\nIt is common to introduce a new language\
    \ with an example that displays the phrase “Hello, World!” on the screen. Here\
    \ is the C# version:\n\nExample 2-1\n\n```csharp\n// Example 2-1.cs\n// The first\
    \ program in C#\nclass HelloWorld\n{\n    static void Main()\n    {\n        System.Console.WriteLine(\"\
    Hello, World!\");\n    }\n}\n```\n\nOutput:\n`Hello, World!`\n\n### Compiling\
    \ and Running the Program\n\nType the program text as a Notepad file, or use any\
    \ other text editor, and save it with a name such as `First Program.cs`. Some\
    \ text editors force the filename to have a `.txt` extension.\n\nAlthough the\
    \ C# compiler doesn’t care about the file extension, the `.cs` extension is typically\
    \ used for C# programs. Compile the program in the command environment by using\
    \ the following command: `csc First Program.cs`\n\nThis compilation generates\
    \ the executable file `FirstProgram.exe`. Run the program by typing its name (`First\
    \ Program`) and pressing Enter. This displays the phrase “Hello, World!” on your\
    \ screen.\n\n**Note-**\n\nIf you are using the Visual Studio IDE to build the\
    \ program, you can use the console applications, as explained in Next Chapters.\n\
    \nIn the following sections the main features of the “Hello, World!” program are\
    \ explained.\n\n### Comments--\n\nThe first two lines in the example contain comments:\n\
    \n```csharp\n// Example 2-1.cs\n// The first program in C#\n```\n\nThe two forward\
    \ slash characters (`//`) at the beginning of the line convert the entire line\
    \ into a comment, which is ignored by the compiler. You can place the `//` characters\
    \ anywhere in the line, in which case they convert the text that follows into\
    \ a comment.\n\nYou can also use the characters `/*` and `*/` to convert a group\
    \ of lines into a single comment. For example:\n\n```csharp\n/* This is a comment\
    \ line.\nThis is another comment line.\nThis is a comment line. */\n```\n\n###\
    \ 2-1-3 Class Declaration\n\nThe main thing to remember about any C# program is\
    \ that everything is inside a class or struct. The class used in the current example\
    \ is `HelloWorld`. Like C++, the C# language is case sensitive. The body of the\
    \ entire class lies between braces (`{}`). The class contains members such as\
    \ fields and methods.\n\n```csharp\nclass HelloWorld\n```\n\nThe name goes after\
    \ the keyword `class`, which is written in lowercase.\n\n### 2-1-4 The Main Method\n\
    \nAs stated above, every C# program must have a method called `Main`. This method\
    \ is similar to the C++ `main` function. Notice that the name of the `Main` method\
    \ starts with an uppercase letter.\n\n**Note:**-\n\nThere is no difference between\
    \ a function and a method; they both do the same job. In fact, some authors who\
    \ come from a C++ background still use the word “function” to refer to a method.\
    \ Throughout this book we use the word “method.” You cannot generate the executable\
    \ file unless your program contains the `Main` method. Notice also the keyword\
    \ `static` (explained later), which modifies the method. The type of the method\
    \ can be `void`, which means the method does not return a value, like this:\n\n\
    ```csharp\nstatic void Main()\n{\n}\n```\n\nIt can also be `int`, which means\
    \ it returns an integer:\n\n```csharp\nstatic int Main()\n{\n    return 0;\n}\n\
    ```\n\nThere are other forms for the `Main` method that use arguments, such as:\n\
    \n```csharp\nstatic void Main(string[] args)\n{\n}\n```\n\nand\n\n```csharp\n\
    static int Main(string[] args)\n{\n    return 0;\n}\n```\n\nThe arguments of the\
    \ `Main` method are explained in Chapter 4.\n\n### Using the .NET Methods for\
    \ Displaying Results\n\nAs you can see in Example 2-1, its purpose is to display\
    \ the string “Hello, World!” by using the method `WriteLine`, which is not part\
    \ of the C# language. `WriteLine` is a .NET method.\n\nAs mentioned in Chapter\
    \ 1, the .NET class library is divided into namespaces, which contain classes.\
    \ The `WriteLine` method is a member of the `Console` class in the `System` namespace.\
    \ Therefore, when using such methods you have to use the full name, including\
    \ the namespace and the class name, like this:\n\n```csharp\nSystem.Console.WriteLine();\n\
    ```\n\nTo display text, you enclose it in quotation marks inside the method’s\
    \ parentheses:\n\n```csharp\nSystem.Console.WriteLine(\"Hello, World!\");\n```\n"
