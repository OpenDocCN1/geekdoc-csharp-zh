- fmt: "\n`control_expression` is a condition be satisfied during the loop execution.\
    \ `statement(s)` is a statement (or the block of statements) to be executed. Because\
    \ the `while` loop starts with testing the condition, the statement block might\
    \ not execute at all if the condition fails. The following code segment displays\
    \ the numbers from 1 to 5, each on a separate line. Notice that you must initialize\
    \ the counter before the loop starts.\n\n```csharp\nwhile (counter < 6)\n{\n \
    \   Console.WriteLine(counter);\n    counter++;\n}\n```\n\nThe following example\
    \ also displays the counter numbers, but by using a different logic. The control\
    \ expression says, “if counter is not equal to zero.” This condition is always\
    \ true because the counter is initialized to the value 1. Inside the loop, the\
    \ `break` statement is used to terminate the loop when a specified condition is\
    \ satisfied.\n\n![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg)\
    \ ![](images/00075.jpeg)\n![](images/00076.jpeg)\n![](images/00077.jpeg)\n\nIn\
    \ the example above, notice that the `continue` statement is used to resume the\
    \ loop execution after skipping the value 2 according to the condition:\n\n```csharp\n\
    if (counter == 2) continue;\n```\n\nThe `break` statement causes the loop to terminate\
    \ when the counter exceeds the value 5:\n\n```csharp\nif (counter > 5) break;\n\
    ```\n\n![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg) ![](images/00075.jpeg)\n\
    \n## The do-while Loop\n\nThe `do-while` loop is used to repeatedly execute a\
    \ block of statements as long as some condition is satisfied. This loop takes\
    \ the following form:\n\n```csharp\ndo statement(s)\nwhile (control_expression);\n\
    ```\n\nwhere:\n`control_expression` is a condition to be satisfied during the\
    \ loop execution. `statement(s)` is a statement (or the block of statements) to\
    \ be executed. The `do-while` loop is distinguished by being executed at least\
    \ once regardless of the condition.\n\nThis is because the condition is tested\
    \ after executing the statement(s). The following example displays the even numbers\
    \ from 1 to 10 using a `do-while` loop. Notice the use of the `continue` statement\
    \ to skip the odd numbers and the use of the `return` statement to terminate the\
    \ loop early.\n\nIn this example, the `return` statement is doing the same job\
    \ that the `break` statement does. Although both statements terminate the loop,\
    \ there is a difference between them.\n\nThe `break` statement transfers control\
    \ to the statement that follows the loop, if one exists. The `return` statement\
    \ transfers control to the calling method. Suppose that the loop exists inside\
    \ a method named `MyMethod`, which is invoked from another method named `YourMethod`.\n\
    \nWhen the `return` statement is encountered in `MyMethod`, the program control\
    \ will be transferred to `YourMethod`. In this example, `return` ends the execution\
    \ of the `Main` method; therefore, if you add any statement immediately after\
    \ the loop, it will not be executed.\n\n![](images/00075.jpeg) ![](images/00075.jpeg)\
    \ ![](images/00075.jpeg) ![](images/00075.jpeg)\n![](images/00078.jpeg)\n![](images/00079.jpeg)\n\
    ![](images/00080.jpeg)\n![](images/00081.jpeg)\n\n## Branching Statements\n\n\
    The following statements are used to exit repetition loops:\n*   `Break`\n*  \
    \ `Goto`\n*   `Return`\n*   `Throw`\n\nYou have seen already some examples of\
    \ `return` and `break` in the preceding sections. In many languages, including\
    \ C#, the statement `goto` is not recommended because it corrupts the program\
    \ structure.\n\nHowever, it can be used in some cases to exit from deeply nested\
    \ loops. It is also used in the `switch` construct to jump from one case to another.\
    \ For example:\n\n```csharp\ncase 1:\n    // do something\n    goto case 3;\n\
    ```\n\nIn general, the `goto` statement takes the following forms:\n\n![](images/00082.jpeg)\n\
    \nwhere:\n`label` is a label name.\n\nThe label is an identifier followed by a\
    \ colon, as in the following example that contains the label “Finish.”:\n\n```csharp\n\
    goto Finish;\n...\nFinish:\nConsole.WriteLine(\"You are done here!\");\n```\n\n\
    The `throw` statement is used in catching exceptions that may occur during the\
    \ program execution. Exceptions are explained in depth in Chapter 9.\n\n## Arrays\n\
    \nAn array represents a group of elements of the same type. The array can be of\
    \ one or more dimensions. The single-dimensional array can represent a group of\
    \ people lining up in a queue.\n\nThe two-dimensional array can represent students\
    \ in a classroom whose positions are organized in rows and columns. The array\
    \ elements might be arrays themselves, in which case the array is called a jagged\
    \ array or an array of arrays.\n\nArrays descend from the `System.Array` class,\
    \ which serves as the base class for all arrays in the Common Language Runtime.\
    \ The use of some methods of this class will be demonstrated in the following\
    \ sections.\n\n### One-Dimensional Arrays\n\nYou can declare a one-dimensional\
    \ array like this example:\n\n```csharp\nint[] myIntArray = new int [10];\n```\n\
    \nThis declaration allocates memory for ten integers under the name `myIntArray`.\
    \ The array elements start from the element `myIntArray[0]` up to the element\
    \ `myIntArray[9]`.\n\nThe `new` operator is used here to initialize the array\
    \ elements to their default values —zero in this case. It is possible to declare\
    \ an array of any type (reference or value type), as in this example, which declares\
    \ an array of strings:\n\n### Initializing and Declaring Arrays\n\nLike any other\
    \ variable, you can declare an array without initializing it, in which case you\
    \ must initialize it before using it:\n\n```csharp\nint[] myIntArray;\n```\n\n\
    It is also possible to declare an array and initialize it simultaneously:\n\n\
    ```csharp\nint[] myIntArray = {1, 2, 3, 4, 5};\n```\n\nOr you can specify the\
    \ size and use the `new` keyword:\n\n```csharp\nint[] myIntArray = new int[5]\
    \ {1, 2, 3, 4, 5};\n```\n\nThe only difference between value-type and reference-type\
    \ is that value elements are initialized to their default values, while reference\
    \ elements are initialized to `null`.\n\n### Multi-Dimensional Arrays\n\nYou can\
    \ declare and initialize a two-dimensional array by statement like this:\n\n```csharp\n\
    int[,] myTwoDimArray = new int[3,2] {{1,2}, {3,4}, {5,6}};\n```\n\nThis declares\
    \ an array with dimensions [3,2] named `myTwoDimArray`. You can visualize the\
    \ two-dimensional array as a table that contains rows and columns. In the following\
    \ example, you declare a string array with dimensions [2,4]:\n\n```csharp\nstring[,]\
    \ grades = new string[2,4] {{pass\",\"Good\",\"Very good\",\"Distinct\"},{\"55%\"\
    ,\"65%\",\"75%\",\"85%\"}};\n```\n\nThis array stores the grade names and corresponding\
    \ percentages. As with one dimensional arrays, you can omit the dimensions as\
    \ long as you initialize the array:\n\n```csharp\nstring[,] grades = {{pass\"\
    ,\"Good\",\"Very good\",\"Distinct\"},{\"55%\",\"65%\",\"75%\",\"85%\"}};\n```\n\
    \nYou can also omit the `new` operator:\n\n```csharp\nint[,] myTwoDimArray = {{1,2},\
    \ {3,4}, {5,6}};\nstring[,] grades = {{pass\",\"Good\",\"Very good\",\"Distinct\"\
    },{\"55%\",\"65%\",\"75%\",\"85%\"}};\n```\n"
