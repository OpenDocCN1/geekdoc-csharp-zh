    下表显示了 C# 算术运算符及其优先级和结合性。在表中，运算符被分为四类。每一类中的运算符具有相同的优先级。第一行的运算符优先级最高，而最后一行的运算符优先级最低。


    ![](img/00035.jpeg)


    ![](img/00036.jpeg)


    注意，表达式：


    ```

    y+++x

    ```


    等同于表达式：


    ```

    y++ +x

    ```


    这是因为递增和递减运算符的结合性是从右向左的，而二元运算符则不是如此。然而，最好使用空格或括号来使代码更易于读。


    ### 如何获取类型名称


    通过使用 .NET 方法 `GetType`，你可以获取任何局部变量或对象的类型名称。其使用方法如下：


    ```csharp

    Console.WriteLine(myVariable.GetType());

    ```


    在该语句中，`myVariable` 是你想要获取类型名称的局部变量、表达式或对象。


    ![](img/00037.jpeg)


    ### 评估混合类型的表达式


    如果你编写了一个包含不同实数型（浮点型）类型和整数类型的表达式，其求值方式如下：


    - 如果表达式包含一个 `double` 值，结果将是 `double`。

    - 如果表达式不包含 `double` 值，结果将是 `float`。

    - 如果表达式包含任何整数类型和一个实数类型，则 `integraltype` 将转换为实数类型，结果将是该实数类型。

    - 在接下来的示例中，一个包含整数类型和浮点类型的表达式被求值为为 `double`。


    ![](img/00038.jpeg)


    ### 为数值数据添加后缀


    对于某些数据类型，必须为数字字面量添加后缀以将其与其他类型区分开。接下来的章节将对此进一步解释。


    #### 实数类型


    编译器会将实数视为 `double` 类型，除非你添加后缀来显式定义其类型如下：


    - 对 `decimal` 类型使用 `M` 或 `m`。例如，`23.4M`。

    - 对 `float` 类型使用 `F` 或 `f`。例如，`23.4F`。

    - 当你声明实数型变量时，必须使用正确的后缀；


    否则，编译器会发出错误信息。例如，以下声明将产生错误信息：


    ```csharp

    decimal myAmount = 23.4; // error

    float myRealNumber = 23.4 // error

    ```


