    ### 示例运行：


    假设程序名为 "example"，在命令行中输入以下内容：


    > example 2 1.1


    输出结果应该是：


    Your Long number is : 2


    Your double number is : 1.1


    The result of multiplication is : 2.2


    ### 在数组上使用 .NET 属性和方法-


    如前所述，数组继承自 `System.Array` 类，该类包含了几个用于操作数组的方法和属性。在接下来的章节中，将介绍其中的一些属性和方法。


    #### 数组的长度 (Length)


    `Length` 属性是数组中元素的数量。考虑以下数组：


    ```csharp

    int[,] myArray= new int[10,4]; // 数组声明

    ```


    以下语句显示数字 40，它代表元素的数量：


    ```csharp

    Console.WriteLine(myArray.Length); // 获取并显示长度

    ```


    #### 数组的秩 (Rank)


    `Rank` 属性是数组的维度数。考虑以下声明：


    ```csharp

    int[,] myArray= new int[1, 3]; // 二维

    int[,,] yourArray= new int[10, 4, 5]; // 三维

    ```


    以下语句显示数字 2 和 3，分别代表 `myArray` 和 `yourArray` 的秩：


    ```csharp

    // 显示秩：

    Console.WriteLine(myArray.Rank); // 2

    Console.WriteLine(yourArray.Rank); // 3

    ```


    #### 数组排序 (Array.Sort)


    `Array.Sort` 方法用于对数组进行排序。考虑以下声明：


    ```csharp

    int[] myArray = { 3, 4, 56, 8 };

    ```


    为了对此数组进行排序，使用语句：


    ```csharp

    Array.Sort(myArray);

    ```


    结果是排序后的数组：3, 4, 8, 56。


    #### 数组反转 (Array.Reverse)


    `Array.Reverse` 方法用于反转数组。考虑以下声明：


    ```csharp

    int[] myArray = { 3, 4, 8, 56 };

    ```


    为了反转此数组，使用语句：


    ```csharp

    Array.Reverse(myArray);

    ```


    结果是反转后的数组：56, 8, 4, 3。


    在接下来的示例中，你创建了一个一维数组并显示它。然后你应用 `Array.Sort` 和 `Array.Reverse` 方法，并在每次更改后显示数组。


    ![](img/00091.jpeg) ![](img/00092.jpeg)


    #### 调整数组大小 (Array.Resize)


    初学者挣扎的最大问题之一涉及设置数组的大小。程序是否需要从一开始就使用固定大小？如果需要变大会发生什么？.NET Framework 版本 2.0 通过引入
    `Array.Resize` 方法解决了这个问题，该方法用于更改数组的大小。由于数组的大小是不可变的（在运行时无法更改大小），此方法实际上是将数组的元素复制到另一个数组，然后重命名新数组并丢旧数组。


    这是一个泛型方法，意味着它可以适用于任何数组类型。（泛型在第 12 节中有详细介绍）。例如，如果你有一个名为 `myArray` 且初始化了三个元素的数组，可以使用以下语句将其大小扩展到六元素：


    ```csharp

    Array.Resize<int>(ref myArray, 6);

    ```


    在该语句中，`<int>` 是类型参数。（类型参数在第 12 节第 12-1 节中解释）。你也可以使用以下语句将大小扩展到六：


    ```csharp

    Array.Resize (ref myArray, 6);

    ```


    在接下来的示例中，两个数组（一个 int 数组和一个字符串数组）的大小从三个增加到六。当显示新大小的数组时，字符串数组中的空元素将用字符串“empty”填充。这是通过使用
    `??` 运算符实现的。


    ```csharp

    yourArray[i] = yourArray[i] ?? "empty";

    ```


    ![](img/00093.jpeg)


    ![](img/00094.jpeg)


    ### foreach 循环-


    `foreach` 循环用于数组和集合。在我们讨论第 11 节的集合后将再次回到此主题。`foreach` 循环以独特的方式访问数组，而不使用计数器。


    `foreach` 语句的形式为：


    ```csharp

    foreach (type identifier in expression) statement(s);

    ```


    其中：

    - `type` 是数据类型，如 `int` 或 `string`。

    - `identifier` 是变量名。

    - `expression` 是数组（或集合）的名称。

    - `statement(s)` 是要执行的语句或语句块。

