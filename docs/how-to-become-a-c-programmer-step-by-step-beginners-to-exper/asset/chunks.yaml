    CHAPTER


    ∞ 10 ∞


    (Delegates and Events)


    Introduction-


    Inside Contents-


    *   Delegate Definition.


    *   Declaring and using delegates.


    *   Adding and deleting delegates.


    *   Anonymous methods.


    *   Covariance and Contravariance.


    *   Events.


    *   Using events in application.


    What Is a Delegate?


    A delegate is one of the reference types in C#. It is used to encapsulate a method
    of a specific signature and pass it as its parameter. It is similar to a function
    pointer in C++ except it is type-safe like all the elements of the managed languages
    under the umbrella of .NET. As the name indicates, the delegate does not work
    alone, but it delegates the associated method to do its work.


    Declaring Delegates-


    You can declare a delegate using the following form:


    [modifiers] delegate result identifier ([parameters])


    where:


    *   modifiers is a valid combination of access modifiers in addition to the new
    modifier.


    *   result is the type of the delegate, which is the same as the type of the encapsulated
    method.


    *   identifier is the delegate name.


    *   parameters is an optional list of parameters.


    For example:


    delegate void MyDelegate(object o1, object o2);


    This delegate can encapsulate methods with the same signature, such as:


    static void MyMethod(object o1, object o2) { ... }


    Creating a Delegate.


    To Create a Delegate, follow these steps:


    1. Declare the Delegate where you usually declare types (in a namespace or a class) 
    Example:  delegate void MyDelegate( object o1, object o2);


    2. Declare the method that will be associated with the delegate. for example.


    public static void MyMethod(object id, object name) {....}'
