    使用 `C#`，本书以一种循序渐进、逐步的方式，开发了构建程序逻辑与接口分析、异常、委托和事件等重要内容的概念和理论，从具体示例过渡到抽象原理。Standish
    涵盖了从传统到现代软件工程的广泛主题。


