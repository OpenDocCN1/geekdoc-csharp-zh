    Using Local Variables-


    Local variables are declared inside methods. You can use local variables to store
    data of various types. For example, in the previous program you could store the
    string “Hello, World!” in a variable of the type string, like this:


    string myString = "Hello, World!";


    Then you can display it by using the WriteLine method like this:


    Console.WriteLine(myString);


    You can also display a message with the same statement:


    Console.WriteLine("The string is: " + myString);


    Following is a program that uses a local variable and a text message. Example
    2-3


    // Example 2-3.cs


    // Local variables.


    using System;


    class MyClass


    {


    static void Main()


    {


    string myString = "Hello, World!";


    Console.WriteLine("The string is: "+ myString);


    }


    }


    Output:


    The string is: Hello, World!


    The C# language contains many numeric data types, which are explained in the following
    chapters. For example, you can declare an integer variable like this:


    int myInt;


    You can also declare and initialize the variable in the same statement:


    int myInt = 123;


    As you can see in the example, to initialize a variable you actually assign it
    an initial value. You can declare the variable anywhere inside the method.


    The only rule to follow in using variables is to declare and initialize the variable
    before using it. The C# language doesn’t let you use uninitialized variables.
    If you try to use an uninitialized variable by displaying its value, for example,


    you get the following error message from the compiler:


    "Use of unassigned local variable <variable-name>"


    Like other languages, in C# you can add numeric variables by using the “+” operator
    like:


    int sum = myInt + yourInt;


    To display the value of a variable, use the Console.WriteLine or Console.Write
    method:


    Console.WriteLine(myInt);


    You can also display a numeric variable along with a message in one statement:


    Console.WriteLine("My integer = " + myInt.ToString());


    The method ToString, in this statement, is a .NET method that is used to convert
    a numeric data type to the string data type. In fact, you can drop the ToString
    method because it is embedded in the WriteLine method.


    For example:


    Console.WriteLine("My integer = " + myInt);


    You can also use another form of the WriteLine method like this:


    Console.WriteLine("My integer = (0)", myInt);


    In this form, (0) is replaced by the value of the variable myInt. If you would
    like to display several variables with one statement, you can use (0), (1), (2),
    and so forth.


    Console.WriteLine("My integer = (0), Your integer = (1)", myInt,yourInt);


    In this statement, (0) is replaced by myInt, and (1) is replaced by yourInt.


    Question Wap: ( WAP Means write a Program okay !)


    Write a C# program to add the values of two integer variables, then display the
    result with an appropriate message.


    The Program Architecture-


    A C# program may contain one or more files. Any file can contain any of the following
    elements (explained in the following chapters):


    *   Directives.


    *   Namespaces. (which can contain all other elements and namespaces)


    *   Classes.


    *   Structs. (structures)


    *   Interfaces.


    *   Delegates.


    *   Enums. (enumerations)


    *   Function members. (like methods, properties, indexers, and so forth)


    If the program consists of more than one file, only one Main method is required
    in one of the files. In the following example, the program contains most of the
    elements mentioned above. Although the program does not produce any output, it
    compiles and runs.


    Example-


    // Example 2-4.cs


    using System; // Directive


    namespace Namespace1 // Namespace


    {


    class Class1 // Class


    {


    }


    ![fractal-tree2](images/00019.jpeg) ![fractal-tree2](images/00019.jpeg) ![fractal-tree2](images/00019.jpeg)


    ![avatar_medium](images/00020.jpeg) ![avatar_medium](images/00020.jpeg) ![avatar_medium](images/00020.jpeg)


    ![](images/00021.jpeg)


    Qualifying Names-


    In real life, if you have two coworkers named John, it may be hard to distinguish
    between them unless you include the last name. At times, even using the last name
    is not enough.


    In programming, the complete name is referred to as the fully qualified name.
    When dealing with program elements, using the fully qualified name resolves any
    possible name conflicts.


    The fully qualified name includes the names of the containing namespace and the
    containing class. By using the fully qualified names you can use two methods that
    have the same name but belong to different classes in the same program and still
    be able to distinguish between them.


    In the following example, there are two classes that have the same name (MyC2).
    If you use the fully qualified name for each, you can avoid any ambiguity. For
    example:


    MyNS1.MyC1.MyC2


    and


    MyNS1.MyNS2.MyC2


    The first name above represents the class MyC2 that is contained in the class
    MyC1 that is contained in the namespace MyNS1\. The second name represents the
    same class, MyC2, that is contained inside the namespace MyNS2 that is contained
    inside the namespace MyNS1.


    Example –


    // Example 2-5.cs


    // Fully qualified names


    namespace MyNS1 // MyNS1


    {


    class MyC1 // MyNS1.MyC1


    {


    class MyC2 // MyNS1.MyC1.MyC2


    {


    }


    }


    namespace MyNS2 // MyNS1.MyNS2


    {


    class MyC2 // MyNS1.MyNS2.MyC2


    {


    }


    }


    }


    namespace MyNS3 // MyNS3


    {


    class MyC3 // MyNS3.MyC3


    {


    static void Main()


    {


    }


    }


    }


    Notice-


    In the above example that the qualified name is written as a comment beside each
    element. The elements in this example are described as follows:


    The namespaces MyNS1 and MyNS3 are contained in the global namespace that represents
    the root of the tree; therefore, their names are already fully qualified.


    *   The namespace MyNS2 is contained inside the namespace MyNS1; therefore, its
    fully qualified name is MyNS1.MyNS2.


    *   The class MyC1 is contained inside the namespace MyNS1; therefore, its fully
    qualified name is MyNS1.MyC1.


    *   The first instance of class MyC2 is contained inside the class MyC1; therefore,
    its fully qualified name is MyNS1.MyC1.MyC2.


    *   The second instance of class MyC2 is contained inside the namespace MyNS2;
    therefore, its fully qualified name is MyNS1.MyNS2.MyC2.


    Common Conventions for Writing Code-'
