    ### Note for C++ programmers –


    There is a difference between the C# `switch` and the C++ `switch`. In C++, if
    you don’t have a branching statement, control is transferred directly to the next
    `case`. But in C#, the compiler will complain about the missing statement. You
    can compensate for this by using some empty cases so control can fall through
    until it reaches a valid case. For example:


    ```c

    switch(n)

    {

    case 1: // fall through to case 3

    case 2: // fall through to case 3

    case 3:

    Console.WriteLine("cases 1 & 2 come here!");

    break;

    // ...

    }

    ```


    The C# `switch` was designed without the fall through feature in order to avoid
    problems that might occur in the program if you mistakenly omit a `break` statement.
    In that case, one or more switch cases might be executed unintentionally, causing
    bugs in the program.


    ### The Conditional Expression


    The conditional expression is used to build a simple conditional statement. It
    takes the form:


    `condition ? expression_1 : expression_2`


    where:

    - `condition` is the Boolean expression to test.

    - `expression_1` is the expression evaluation if the condition is true.

    - `expression_2` is the expression evaluation if the condition is false.


    Of course, you can assign the entire expression to a variable, as in this example:


    `result = (x != 0.0) ? Math.Tan(x) : 1.0;`


    (Notice that the parentheses around the condition are optional. They are used
    for better readability.)


    This statement says, “if `x` is not equal to zero, assign the value `Math.Tan(x)`
    to `result`; otherwise, assign the value 1.0 to `result`.” This statement is equivalent
    to the following code segment:


    ```csharp

