    is in fact a string. If you try to add it to another integer, the compiler will
    issue the error message:


    Cannot implicitly convert type ‘string’ to ‘int’.


    Converting Strings to Numbers-


    A string read from the keyboard can be converted to any type of data by using
    the conversion methods explained in the following sections.


    Using the Convert Class-


    The class Convert belongs to the System namespace. You can use it to convert a
    string to another type, such as an integer, like this example:


    int myInt = Convert.ToInt32(myString); // convert to int


    In this statement, myString is converted to the type Int32, which is equivalent
    to the C# type int. Similar conversions to various types are shown in the examples
    below:


    long myLong = Convert.ToInt64(myString); // convert to long


    float myFloat = Convert.ToSingle(myString); // convert to float


    double myDouble = Convert.ToDouble(myString); // convert to double


    decimal myDecimal = Convert.ToDecimal(myString); // convert to decimal


    It is also possible to add another value to the number in the same statement:


    int myInt = Convert.ToInt32(theNumber) + 20;


