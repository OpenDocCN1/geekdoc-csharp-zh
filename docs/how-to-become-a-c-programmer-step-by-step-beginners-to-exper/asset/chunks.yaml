    #### 整数类型


    对于整数类型，你不需要为数据值后缀，因为在评估表达式时会自动选择合适的存储空间。然而，你可以使用后缀 `L`、`U` 或 `UL` 来确定数值的类型及其对应的存储。在使用后缀时遵循以下规则：


    - 当你使用后缀 `L` 时，根据该数值将其视为 `long` 或 `ulong` 类型。例如，以下数字被视为 `long`，因为它小于 `ulong` 的限制：`4294967296L`

    - 当你使用后缀 `U` 时，根据该数值将其被视为 `long` 或 `uint`。例如，以下数字被视为 `uint`，因为它小于类型 `long` 的限制。`4294967290U`

    - 当你结合使用字母 `U` 和 `L` 时（无论顺序如何），该数字被视为 `ulong`。


    ![](img/00041.jpeg)


    ### 类型之间的转换


    在 C# 中，类型转换有两种方法：隐式和显式转换。例如，你可以编写以下语句来声明实数变量：


    ```csharp

    double myVar = 4;

    float myVar = 33;

    ```


    这些声明包含了从整数类型到 `float` 和 `double` 的隐式转换。此类转换会在后台为你完成。然而，你不能编写以下语句：


    ```csharp

    float myVar = 3.3; // compilation error

    ```


    该语句意味着你想将值 `3.3`（一个 `double` 值，如上一节所述）存储在较小的存储类型（`float`）中。编译器不接受此语句并向你发送错误信息。


    当然，你可以使用后缀 `F` 来指定该数字为 `float`；这会将字面量本身转换为 `float` 类型。类型转换的通用规则是，你可以将较小的存储类型存储到较大的类型中，但反之则不行。考虑以下声明：


    ```csharp

    int x = 4;

    double y = 3.0;

    ```


    有了这些声明，以下语句是不允许的：


    ```csharp

    short z1 = x; // compilation error

    short z2 = y; // compilation error

    ```


    是因为从 `int` 或 `double` 到 `short` 没有隐式转换，因为它们的大小都大于存储空间。要完成此转换，你必须使用强制转换，如下所示所示：


    ```csharp

    short z1 = (short)x;

    short z2 = (short)y;

    ```


    这种转换被称为显式转换。对于整数类型，在赋值之前检查目标存储很重要。例如，以下语句显示了尝试将 `int` 存入 `short`：


    ```csharp

    short x = 32768;

    ```


    #### char 类型


    C# 字符存储为 16 位 Unicode 字符。凭借 Unicode 系统可以表示任何语言，包括中文、日语、希伯来语和阿拉伯语。你可以以多种方式编写字符。以下示例表示字母“A”。你可以将其作为字面量：


