    response to the csc command before and after setting the path, assuming that you
    are compiling a file called myProg.cs.


    Notice  that before setting the path, the csc command was not recognized by the
    operating system. When the set path command was entered, the compilation completed.


    ![](images/00011.jpeg)


    If You Have the Visual Studio IDE-


    If you downloaded the IDE, you don’t need to set up the path. Just open the Visual
    Studio command prompt by using the following steps:


    1. Click the Start menu.


    2. Select All Programs.


    3. Select Microsoft Visual Studio.


    4. Select Visual Studio Tools.


    5. Click Visual Studio Command Prompt.


    This opens up the window shown in Figure 1-6. It also adds the location of the
    command-line compiler (csc.exe) to the path, in which case you can access the
    command-line compiler from any directory.


    Figure 1-6 shows the response to the csc command in the Visual Studio 2005 Command
    Prompt window.


    ![](images/00012.jpeg)


    Comparison of C# and C++


    If you are coming from a C++ background, the following information will be useful
    for you as it contains a comparison of the two languages;


    Table 1-1: Comparison of C# and C++


    ![](images/00013.jpeg)


    ![](images/00014.jpeg)


    1-7 The Features of C# 2005-


    ![](images/00015.jpeg)


    ![](images/00016.jpeg)Summary: In this chapter:


    *   You saw an overview of object-oriented programming and how C# was built from
    the ground up as an OOP language.


    *   You learned about the .NET Framework and its elements: the class library and
    the Common Language Runtime (CLR).


    *   You also learned about the Common Language Specification (CLS) and Common
    Type System (CTS) and their role in creating .NET-supported languages.


    *   You learned about assemblies and how they are self described by using the
    manifest metadata.


    *   You also had an overview of the C# code, and examined the IL code and the
    manifest of a .dll and an executable file.


    *   You also have seen a comparison of C# and C++, from which C# evolved.


    *   Finally, you took a global look at the new features of C# 2005, which are
    explained throughout this book.


    ![STAR-LOGO-2013](images/00004.jpeg)


    CHAPTER


    ∞ 2 ∞


    ( Your First Approach @ C# Program)


    Introduction-


    Let’s Start your First C# Program-


    It is common to introduce a new language with an example that displays the phrase
    “Hello, World!” on the screen. Here is the C# version:


    Example 2-1


    // Example 2-1.cs


    // The first program in C#


    class HelloWorld


    {


    static void Main()


    {


    System.Console.WriteLine("Hello, World!");


    }


    }


    Output:


    Hello, World!


    Compiling and Running the Program-


    Type the program text as a Notepad file, or use any other text editor, and save
    it with a name such as First Program.cs. Some text editors force the filename
    to have a .txt extension.


    Although the C# compiler doesn’t care about the file extension, the .cs extension
    is typically used for C# programs. Compile the program in the command environment
    by using the following command: csc First Program.cs


    This compilation generates the executable file FirstProgram.exe. Run the program
    by typing its name (First Program) and pressing Enter. This displays the phrase
    “Hello, World!” on your screen.


    Note-


    If you are using the Visual Studio IDE to build the program, you can use the console
    applications, as explained in Next Chapters.


    In the following sections the main features of the “Hello, World!” program are
    explained.


    Comments-


    The first two lines in the example contain comments:


    // Example 2-1.cs


    // The first program in C#


    The two forward slash characters (//) at the beginning of the line convert the
    entire line into a comment, which is ignored by the compiler.


    You can place the comment characters anywhere in the line, in which case they
    convert the text that follows into a comment.


    For example: class HelloWorld // This is a class declaration You can also use
    the characters “/*” and “*/” to convert a group of lines into a single comment.
    For example:


    /* This is a comment line.


    This is another comment line.


    This is a third comment line. */


    2-1-3 Class Declaration-


    The main thing to remember about any C# program is that everything is included
    inside a class or a struct. The class used in the current example is called HelloWorld:
    class HelloWorld The class name goes after the keyword class, which is written,
    like all C# keywords, in lowercase letters.


    Like C++, the C# language is case sensitive. The body of the entire class lies
    between braces ({ }). The class contains members such as fields and methods. In
    this example there is only one method, which is called Main. The Main method is
    necessary in all C# programs. The braces are used as delimiters for blocks of
    code, which can also contain other blocks. In fact, the class body might contain
    any number of nested classes.


    2-1-4 The Main Method-


    As stated above, every C# program must have a method called Main. This method
    is similar to the C++ main function. Notice that the name of the Main method starts
    with an uppercase letter.


    Note:


    There is no difference between a function and a method; they both do the same
    job. In fact, some authors who come from a C++ background still use the word “function”
    to refer to a method. Throughout this book we use the word “method.” You cannot
    generate the executable file unless your program contains the Main method. Notice
    also the keyword static (explained later), which modifies the method. The type
    of the method can be void, which means the method does not return a value, like
    this:


    static void Main()


    {


    }             


    It can also be int, which means it returns an integer:


    static int Main()


    {


    return 0;


    }


    There are other forms for the Main method that use arguments, such as:


    static void Main(string[] args)


    {


    }


    and


    static int Main(string[] args)


    {


    return 0;


    }             


    The arguments of the Main method are explained in Chapter 4.


    Using the .NET Methods for Displaying Results-


    As you can see in Example 2-1, its purpose is to display the string “Hello,World!”
    by using the method WriteLine, which is not part of the C# language. WriteLine
    is a .NET method.


    As mentioned in Chapter 1, the .NET class library is divided into namespaces,
    which contain classes. The WriteLine method is a member of the Console class in
    the System namespace. Therefore, when using such methods you have to use the full
    name, including the namespace and the class name, like this:


    System.Console.WriteLine(); To display text, you enclose it in quotation marks
    inside the method’s parentheses:


    System.Console.WriteLine("Hello, World!");'
