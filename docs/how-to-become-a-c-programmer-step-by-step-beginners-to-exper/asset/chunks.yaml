    The variable myVariable might not be initialized at all. It will be assigned the
    value "This is my string" when the method returns to the caller. Notice that the
    out keyword is used in both the method header and the call. It is possible to
    use more than one parameter, as in this example:


    void YourMethod(out int x, out int y, out int z)


    {


    ...


    }


    This method is called in the same way:


    YourMethod(out m, out n, out l);


    Note- It is not enough to have different parameter modifiers in order to overload
    a method. Methods must also be different in the type of parameters they use.


    In the following example the out keyword is used to pass an uninitialized array
