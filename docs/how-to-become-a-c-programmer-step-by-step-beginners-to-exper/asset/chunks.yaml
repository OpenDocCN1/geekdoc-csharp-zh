    in which case, the statement is called the try-catch-finally statement.


    When using the finally block in your program, control is transferred to that block
    regardless of whether or not the exception was handled. The finally block is used
    to clean up the resources, such as closing the open files.


    The try-finally Statement-


    ![](images/00235.jpeg)


    Where:


    try-block contains the suspicious code to be tried.


    finally-block cointains the cleanup statement to be executed regardless of the
    exception.


    The following example demonstrates how the statements in the finally block are
    executed. This program throws the exception InvalidCast-Exception because it uses
    the cast int with an object of the type string (which is an invalid cast). The
    finally block contains some statements that are executed regardless of the thrown
    exception.


    ![](images/00236.jpeg)


    ![](images/00237.jpeg)


    ![](images/00238.jpeg)


    The try-catch-finally Statement-


    ![](images/00239.jpeg)


    ![](images/00240.jpeg)


