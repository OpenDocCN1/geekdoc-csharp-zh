  trans: "\n\n![](img/00123.jpeg)\n\n## 声明构造函数\n\n虽然编译器会自动创建默认的无参数构造函数，但你不能不声明无参数构造函数的情况下声明带参数的构造函数。只有当类没有任何构造函数时，编译器才会提供默认构造函数。换句话说，为了使用语句：\n\
    \n```\nPoint p1 = new Point();\n```\n\n你必须声明一个无参数构造函数。\n\n### 使用 this\n\n就像 C++\
    \ 一样，在 C# 中 `this` 关键字用于访问实例构造函数（方法或访问器）中的数据成员。例如，你可以像下面这样声明示例中的构造函数：\n\n```csharp\n\
    public Point(int x, int y)\n{\n    this.x = x;\n    this.y = y;\n}\n```\n\n在这种情况下，你可以对字段和参数使用相同的名称（`x`\
    \ 和 `y`）。这是因为表达式 `this.x` 表示当前对象的字段 `x`，而 `x` 是方法的参数。很明显，`this` 关键字不能用于静态构造函数或静态字段。\n\
    \n#### 注意\n在 C++ 中，`this` 关键字被分类为指针，但在 C# 中，它被称为“this 访问”。“指针”一词仅在不安全代码中使用。\n\n\
    ### 私有构造函数\n\n私有构造函数用于仅包含静态成员的类。除了嵌套在同一个类中的类外，其他类不允许创建该类的实例。考虑以下示例：\n\n```csharp\n\
    public class MyClass\n{\n    private MyClass() {} // 私有构造函数\n    public string\
    \ companyName;\n    public string employmentDate;\n}\n```\n\n在这个示例中，私有构造函数是一个空构造函数，其作用是防止为类生成默认构造函数。注意，私有构造函数使用了访问修饰符\
    \ `private`，这是一种惯例但并非必须，因为默认访问级别就是私有的。当类的成员都是静态的时，建议将类声明为静态类（static class）。\n\n\
    ### 静态构造函数\n\n静态构造函数用于初始化类。它在创建任何对象之前以及调用类的任何静态成员之前被调用。在下面的示例中，静态构造函数 `MyClass`\
    \ 包含两个打印语句。还有一个方法 `MyMethod`，它包含另一个打印语句。注意，当调用 `MyMethod` 时，静态构造函数会被自动触发。\n\n\
    ![](img/00124.jpeg)\n![](img/00125.jpeg)\n![](img/00126.jpeg)\n\n#### 注意\n在接下来的章节中，你将学习对象初始化器，它能让你节省编写冗余代码来声明相同功能构造函数的精力和。例如，如果你有一个名为\
    \ `Point` 的类，带有两个属性 `X` 和 `Y`，用于设置坐标 `x` 和 `y`，你可以像这些示例一样声明并初始化对象：\n\n```csharp\n\
    Point p = new Point { X = 10, Y = 20 };\n```\n\n或者\n\n```csharp\nvar p = new Point\
    \ { X = 10, Y = 20 };\n```\n\n## 只读字段\n\n`readonly` 关键字用于声明只读字段。为只读字段赋值有两种方法。第一种是在声明语句中赋值，如示例所示：\n\
    \n```csharp\npublic readonly int intOnlyInt1 = 55;\n```\n\n第二种是使用构造函数，如该示例所示：\n\
    \n```csharp\npublic MyClass()\n{\n    readOnlyInt1 = 66;\n}\n```\n\n下面的示例演示了只读字段。\n\
    \n![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg)\n\
    ![](img/00127.jpeg)\n![](img/00128.jpeg)\n\n注意在这个示例中，你不能通过类似下面的语句在主方法中更改只读字段的值：\n\
    \n```csharp\nobj1.readOnlyInt1 = 55; //error\n```\n\n## 继承\n\n类可以继承另一个类，如下例所示：\n\
    \n```csharp\nclass MyDerivedClass : MyBaseClass\n{\n    // ...\n}\n```\n\n在这个示例中，你声明了类\
    \ `MyDerivedClass`，它继承自类 `MyBaseClass`。在声明中，冒号（`:`）用于派生类名和基类名之间。继承意味着派生类包含了基类的所有成员。你也可以在继承的成员基础上添加新成员。\n\
    \n例如，`Employee` 类继承了 `Person` 类的所有特征，并在此基础上增加了 `Employee` 的特征。以下规则控制继承：\n\n1.\
    \ 基类的所有成员都会被继承（实例构造函数、析构函数和静态构造函数除外）。\n2. 如果你在派生类中声明了一个与基类同名的成员，它将隐藏基类中的成员。在这种情况下，无法通过派生类访问基类的成员。\n\
    3. 基类中的函数成员可以被派生类中的成员重写，从而实现多态性。（多态性将在第 6 章中解释。）\n4. 在 C# 中，与 C++ 不同，类只能继承一个类。然而，它可以实现多个接口。当类实现接口时，它就“继承”了它的成员。（接口将在第\
    \ 8 章中解释。）\n5. 结构体不能继承类或其他结构体，但它们可以实现接口。它们也不能被继承。\n\n#### 注意\n有时使用特化（specialization）和泛化（generalization）这两个词来表示继承。例如，`Cow`\
    \ 类特化了 `Mammal` 类，而 `Mammal` 类泛化了 `Cow` 类。基类也被称为超类（superclass）或父类（parent class），派生类则称为子类（subclass）或子类（child\
    \ class）。\n\n在下面的示例中，演示了继承自 `Citizen` 类的 `Employee` 类。\n\n![](img/0129.jpeg)\n\
    ![](img/0130.jpeg)\n\n注意在这个示例中，所有方法的访问级别都是 `public`。这对访问类字段是必要的。\n\n## 析构函数\n\n\
    析构函数用于析构对象。析构函数的声明如所示：\n\n```csharp\n~MyClass()\n{\n    // 析构语句。\n}\n```\n\n类的析构函数名称与类名相同，但前面有一个波浪号（`~`）。然而，你不能手动调用析构函数，因为它在对象完成工作并超出作用域时自动被调用。在继承的情况下，析构从子类开始沿着继承树向上。下面的示例显示了析构函数如何根据继承层次中的顺序被调用来析构对象。\n\
    \n![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg)\n\
    ![](img/0131.jpeg)\n![](img/0132.jpeg)\n\n注意在这个示例中，孙子最先析构，然后是儿子，最后是父亲。虽然析构函数在\
    \ C++ 中起着重要作用（你使用它们来释放为指针分配的内存），但在 C# 中你不需要使用它们，因为垃圾回收器会在对象完成工作且不再使用时替你完成该任务。在\
    \ C# 中，你仍然可以使用析构函数来清理非托管资源，如文件和网络连接。\n\n然而，这个主题将在这里进行讨论，因为它超出了本书的范围。关于该主题的更多信息，请阅读微软网站上关于\
    \ `Dispose` 方法的内容：[`msdn.microsoft.com`](http://msdn.microsoft.com)。\n\n#### 注意\n\
    你可以使用 .NET `GC.Collect` 方法强制垃圾回收器开始清理过程，但是不建议的，因为它可能会导致不理想的结果。\n\n"
- fmt: "\nPartial classes were added to C# 2005 to facilitate breaking a type (class,\
    \ struct, or interface) into more than one section and each in a separate file.\
    \ This is useful when writing large projects or using machine-generated code.\
    \ This feature also helps developer teams to collaborate on the same application.\
    \ To declare a partial class, all sections of the class must use the modifier\
    \ `partial` right before the word `class`. Other modifiers can precede the keyword\
    \ `partial`. The following example declares a class called `TimeSheet` divided\
    \ into two files:\n\n```csharp\n// File1.cs\npublic partial class TimeSheet\n\
    {\n    public void AddWorkingHours()\n    {\n        // ...\n    }\n\n    public\
    \ void CalculateSalary()\n    {\n        // ...\n    }\n}\n\n// File2.cs\npublic\
    \ partial class TimeSheet\n{\n    public void SubtractVacationTime()\n    {\n\
    \        // ...\n    }\n}\n```\n\nOn compilation, all sections of the class are\
    \ put together to create the class. All the sections of course must be included\
    \ in the same `namespace`, but cannot span assemblies. The following rules and\
    \ restrictions control the use of partial classes:\n\n1. All partial classes that\
    \ constitute one class must use the same accessibility level.\n2. If one part\
    \ of the class is declared using the modifiers `abstract` or `sealed`, the modifier\
    \ will apply to the whole class.\n3. If one partial class is derived from a base\
    \ class, all the other partial classes will inherit this base class even if it\
    \ is not mentioned in their declarations. This means that if you have two partial\
    \ classes, as in this example:\n\n```csharp\npartial class Employee: Person\n\
    {\n    // ...\n}\n\npartial class Employee: Citizen\n{\n    // ...\n}\n```\n\n\
    the class `Employee` would effectively be:\n\n```csharp\nclass Employee: Person,\
    \ Citizen\n{\n    // ...\n}\n```\n\n4. What applies to inheritance from classes\
    \ applies to implementing interfaces. The following example consists of two files\
    \ —file1.cs` and `file2.cs` —that contain a definition of the `Employee` class.\
    \ Each file contains part of the class declared as `partial`. To compile the program,\
    \ use the following command:\n\n```bash\ncsc/out:Ex5-14.exe file1.cs file2.cs\n\
    ```\n\nThis combines the two files, `file1.cs`, and `file2.cs`, and generates\
    \ an executable file named `Ex5-14.exe`.\n\n![](images/00133.jpeg)\n![](images/00134.jpeg)\n\
    ![](images/00135.jpeg)\n![](images/00136.jpeg)\n![](images/00137.jpeg)\n\n## Summary\
    \ :\n\n![](images/00138.jpeg)\n![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)\
    \ ![fractal-tree2](images/00055.jpeg)\n![](images/00023.jpeg)\n![STAR-LOGO-2013](images/00004.jpeg)\n\
    \n# CHAPTER ∞ 6 ∞\n## (Function Members)\n\n### Introduction\n\n**Inside Contents:**\n\
    * Defining function members.\n* Polymorphism.\n* Using abstract classes and methods.\n\
    * Method Overloading.\n* Passing parameters to methods.\n* Declaring and using\
    \ indexers.\n* User-defined operators.\n* Overriding ToString()\n\nAll members\
    \ of a class or a struct (except fields and constants) are classified as function\
    \ members. If you are a `c++` programmer you might compare this member function,\
    \ which use the same concept.\n\nFunction members are:\n* Methods.\n* Properties.\n\
    * Events.\n* Indexers.\n* User-defined operators.\n* Constructors.\n* Destructors.\n\
    \nYou learned about some of these members earlier, In Chapters 1 through 5, The\
    \ rest will be explained in the following Chapters.\n\n### Polymorphism\n\nOne\
    \ important benefit of inheritance is code reusability. For example, if another\
    \ programmer already created a class called `Person`, there is no need for you\
    \ to rewrite the same class in order to create the `Employee` class or the `PoliceMan`\
    \ class. Many characteristics of these classes are already included in the `Person`\
    \ class. All you need to do is inherit the `Person` class and add to it the characteristics\
    \ of `Employee` or `PoliceMan`.\n\nThis will save you the effort of reinventing\
    \ the wheel. The second benefit of inheritance is polymorphism. In programming,\
    \ you deal with many kinds of user interface windows in the Microsoft Windows\
    \ environment, such as message boxes that convey a message or a warning and windows\
    \ for painting or writing.\n\nIf you wrote, for example, a method called `DrawWindow`,\
    \ you can associate this method with various objects that represent different\
    \ kinds of windows. Based on the object associated with the method, the result\
    \ would be different.\n\nConsider these examples:\n```csharp\nmyButton.DrawWindow();\
    \ // draws a button\nmyMsg.DrawWindow(); // draws a message box\nmyPaintSurface.DrawWindow();\
    \ // draws a painting window\n```\n\nThe three objects — `myButton`, `myMsg`,\
    \ and `myPaintSurface` — not instances of the same class, but instances of other\
    \ classes derived from the base class that contains the original `DrawWindow`\
    \ method. Each object is used to invoke a new definition of the method `DrawWindow`.\n\
    \n### Virtual and Override Methods\n\nTo use the polymorphic methods introduced\
    \ in the preceding section, declare the `DrawWindow` method with the keyword `virtual`\
    \ in the base class:\n\n```csharp\npublic virtual void DrawWindow()\n{\n    //\
    \ The method definition in the base class.\n}\n```\n\nThen, in each of the classes\
    \ that inherit the base class, declare a `DrawWindow` method using the keyword\
    \ `override`:\n\n```csharp\npublic override void DrawWindow()\n{\n    // The method\
    \ definition in the base class.\n}\n```\n\nThe method declared with the keyword\
    \ `override` is called an override method. It can override another method that\
    \ has the same name, signature, and accessibility in the base class.\n"
