- fmt: "\nAll these languages work under the .NET umbrella and use its libraries.\
    \ Actually, you can write an application with modules written in different languages\
    \ that support .NET. In addition to the class library,\n\nThe .NET Framework includes\
    \ the Common Language Runtime (`CLR`), an integrated environment for executing\
    \ applications using the .NET library. There are other versions of the .NET Framework\
    \ that work with operating systems other than Microsoft Windows, such as `Mono`.\n\
    \n`Mono` can run on operating systems such as Mac OS X and Linux. There is also\
    \ a subset of the .NET Framework called the Microsoft .NET Compact Framework that\
    \ can be used with small devices and smart phones.\n\n### MSIL and JIT\n\nWhen\
    \ you compile a C# program, the compilation does not directly generate native\
    \ (operating system-specific) code; it generates code written in Microsoft Intermediate\
    \ Language (`MSIL` or `IL`). The `MSIL` code is translated to native code at run\
    \ time. This compilation phase is called the just-in-time (`JIT`) compilation.\n\
    \n### Metadata\n\nDuring compilation, the `CLR` creates information about your\
    \ application. It includes class names, field names, method names, and method\
    \ parameters. This information is called `metadata`, which means information on\
    \ data.\n\n`metadata` is used by the `CLR` and the `Jitter` (`JIT` compiler) for\
    \ many purposes such as debugging and type checking. You can also use `metadata`\
    \ to create instances of the classes and use class members regardless of the Source\
    \ code language.\n\n### Assemblies\n\nThe program compilation results in creating\
    \ an assembly, which can be either an `.exe` file (executable) or a `.dll` file\
    \ (library).\n\n### Garbage Collection\n\nOne of the most important benefits of\
    \ using managed applications is the use of the garbage collector (`GC`). The role\
    \ of `CLR` does not end after compiling the `IL` code into native code. In fact,\
    \ the `CLR` is responsible for Managing memory during the code execution.\n\n\
    It assures that the memory used by the program is totally freed up after the program\
    \ exits. With unmanaged applications, programmers are responsible for managing\
    \ the Memory and resolving problems that might occur if a block of memory is left\
    \ allocated after the program ends.\n\n![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)\
    \ ![avatar_medium](images/00005.jpeg)\n\n### Putting Things Together\n\nThe .NET\
    \ applications are handled according to the following procedure:\n\n1. You start\
    \ by coding your application using one of the .NET-compliant languages such as\
    \ `C#`.\n2. The `C#` code is compiled into `MSIL` and stored in an assembly. The\
    \ `C#` code might be split across many source files, which are linked together\
    \ during the compilation.\n3. On executing the code, it is compiled into an operating\
    \ system specific (native) code by using the `JIT` compiler.\n4. The application\
    \ is executed under control of the `CLR`. When the program exits, the `GC` frees\
    \ up the allocated memory.\n\n### ILASM and ILDASM\n\nWith Visual Studio, you\
    \ have two programs for IL compilation: \n\n* `ilasm.exe`: Used to compile programs\
    \ written in `IL` and convert them to `.exe` or `.dll` files.\n* `ildasm.exe`:\
    \ Does the opposite process as it reads an `.exe` or `.dll` file and retrieves\
    \ the `IL` file, which contains the manifest and the metadata.\n* In the next\
    \ section, we use `ildasm.exe` to take a look at the contents of the assembly\
    \ and get an idea about its properties.\n\n![avatar_medium](images/00006.jpeg)\
    \ ![avatar_medium](images/00006.jpeg) ![avatar_medium](images/00006.jpeg)\n\n\
    ### A First Look at the C# Code\n\nIn the following sections we take a look at\
    \ the `C#` code and the various ways to compile it and execute it without going\
    \ into the details of the syntax.\n\n#### The C# Code\n\nThe following code is\
    \ an example of a `C#` class that can be compiled as a `.dll` file:\n\n```cs\n\
    // EmployeeDLL.cs\n\npublic class Employee\n{\n    // Fields:\n    public string\
    \ name;\n    public string id;\n\n    // Methods:\n    public double CalculateSalary(int\
    \ hoursWorked, double rate)\n    {\n        double salary;\n        salary = rate\
    \ * hoursWorked;\n        return salary;\n    }\n}\n```\n\n#### Salary\n\nThis\
    \ example contains the `Employee` class, which contains the following data fields\
    \ of an employee:\n\n* `id`\n* `name`\n\nThe code also contains the method `CalculateSalary`.\
    \ This method takes two parameters, `hoursWorked` (the number of hours worked)\
    \ and `rate` (the payment per hour), and is used to calculate and return `salary`\
    \ (the gross payment of the employee).\n\nThe class can, of course, contain other\
    \ details, but for the sake of the example this would be enough. The file that\
    \ contains this class (its name is written as a comment in the first line: `EmployeeDLL.cs`)\
    \ can be compiled to a `.dll`. Then you can take a peek at this `.dll` file by\
    \ using `ildasm.exe`. The output is shown in the following figure.\n\n![](images/00007.jpeg)\n\
    \nIn Figure 1-1, the contents of the `Employee` class (the fields and the method\
    \ definition) are shown. Programmers who want to use this class would have enough\
    \ information without seeing the source code.\n\n#### The IL Code\n\nIf you click\
    \ on any of the class members, such as the method `CalculateSalary`, you see its\
    \ `IL` code, as shown in Figure 1-2.\n\n![](images/00008.jpeg)\n\nIgnore the text\
    \ between the curly braces and examine the code preceded by a dot (this is called\
    \ a directive). You will notice that the definition of the method `CalculateSalary`\
    \ gives all the information you need to use this method: `CalculateSalary(int32\
    \ hoursWorked, float64 rate)`\n\nThe beauty of the `IL` code is that it is self\
    \ describing.\n\n#### The Manifest\n\nBy double-clicking the MANIFEST icon in\
    \ Figure 1-1, you can see the content of the assembly such as the name of the\
    \ file, the version, and other information.\n\n![](images/00009.jpeg)\n\n####\
    \ Using the Library File\n\nTo get the whole picture, let’s write some code to\
    \ use this library. The following `C#` program contains the source code needed\
    \ to call the method and display the result for one employee.\n\n```cs\n// MyProgram.cs\n\
    using System;\n\nclass MyClass\n{\n    static void Main()\n    {\n        Employee\
    \ emp = new Employee();\n        emp.name = \"John Martin\";\n        emp.id =\
    \ \"ABC123\";\n        double weeklyPayment = emp.CalculateSalary(40, 55);\n \
    \       Console.WriteLine(\"ID: {0}, Name: {1}\", emp.id, emp.name);\n       \
    \ Console.WriteLine(\"Payment= {0}\", weeklyPayment);\n    }\n}\n```\n\nWhen you\
    \ compile this code you only need to link it to the `.dll` file. This way you\
    \ are able to call the method `CalculateSalary` like this: `CalculateSalary(40,\
    \ 55)`. This method uses two parameters. The first is the number of worked hours\
    \ (40) and the second is the rate of the employee (55).\n\nThe details of the\
    \ `C#` code will be explained in detail. Let us now examine the manifest of this\
    \ file. The file is compiled first to generate the executable file (`MyProgram.exe`),\
    \ and then `ILDASM` is used to examine it. The manifest of `MyProgram.exe` is\
    \ shown in Figure 1-4.\n\n![](images/00010.jpeg)\n\nExamine the directives in\
    \ this file and pay attention to the highlighted one: `.assembly extern employeeDLL`\n\
    \nThis directive tells you that the `.dll` file (`employeeDLL.dll`) was linked\
    \ to the source code during compilation.\n\n### How to Get a Free C# Compiler\n\
    \nYou can get the command-line compiler (`csc.exe`) from the site -[http://msdn.microsoft.com/netframework/downloads/updates/default.asx](http://msdn.microsoft.com/netframework/downloads/updates/default.asx).\
    \ Download the redistributable package of the .NET Framework, which includes the\
    \ compiler and the .NET Framework with C# 2005 syntax.\n"
