  trans: "\n一个 C# 语句以分号结束。这是编译器识别语句并将它们相互隔开的方式。你也可以使用 `Write` 方法，它属于同一个 `.NET` 类并执行相同的工作。\n\
    \n这两个方法之间唯一的区别是 `WriteLine` 包含了回车符和换行符，这使得光标移动到下一行。连续的 `WriteLine` 语句会将每个输出显示在单独的一行上。\n\
    \n![](img/00017.jpeg)\n![](img/00018.jpeg)\n\n## 使用指令\n\n你可能在想：“为了显示一个字符串，我难道每次都必须写这一行长长的文本\
    \ 吗？”答案是不定的。显示字符串的更短方法是使用指令。\n\n例如：`using System;` 将此指令添加到程序的开头，位于任何类定义之外。请注意，指令和语言语句一样，句末后面也跟着一个分号。\n\
    \n该指令告诉编译器，你将在程序中使用 `System` 命名空间。然后你就可以在不限定限定名的情况下使用 `WriteLine` 语句，如下所示：\n\n\
    ```\nConsole.WriteLine(\"Hello, World!\");\n```\n\n不过你仍然必须使用 `Console` 词，因为它是包含该方法的类名。但当你使用属于其他类的\
    \ `.NET` 语句时，`using` 指令可以节省大量的输入工作。\n\n示例 2-2 显示了添加指令后的 Hello, World! 程序。\n\n\
    ### 示例 2-2\n\n```csharp\n// Example 2-2.cs\n// C# 中的第二个程序\nusing System;\n\nclass\
    \ HelloWorld\n{\n    static void Main()\n    {\n        Console.WriteLine(\"Hello,\
    \ World!\");\n    }\n}\n```\n\n输出：\n`Hello, World!`\n\n## 使用局部变量\n\n局部变量定义在方法内部。你可以使用局部变量来存储各种类型的数据。例如，在上一个程序中，你可以将字符串“Hello,\
    \ World!”存储在 `string` 类型变量中，如下：\n\n```csharp\nstring myString = \"Hello, World!\"\
    ;\n```\n\n然后你就可以使用 `WriteLine` 方法来显示它：\n\n```csharp\nConsole.WriteLine(myString);\n\
    ```\n\n你也可以用同一条语句显示消息：\n\n```csharp\nConsole.WriteLine(\"The string is: \" + myString);\n\
    ```\n\n下面是一个使用局部变量和文本消息的程序。示例 2-3\n\n```csharp\n// Example 2-3.cs\n// 局部变量。\n\
    using System;\n\nclass MyClass\n{\n    static void Main()\n    {\n        string\
    \ myString = \"Hello, World!\";\n        Console.WriteLine(\"The string is: \"\
    + myString);\n    }\n}\n```\n\n输出：\n`The string is: Hello, World!`\n\nC# 语言包含许多数值数据类型，将在后续章节中进行解释。例如，你可以这样声明一个整数变量：\n\
    \n```csharp\nint myInt;\n```\n\n你也可以在同一语句中声明并初始化变量：\n\n```csharp\nint myInt =\
    \ 123;\n```\n\n正如示例所示，要初始化变量，实际上是给它分配一个初始值。你可以在方法内部任何地方声明变量。\n\n使用变量时遵循的唯一规则是在使用它之前声明并初始化它。C#\
    \ 语言不允许使用未初始化的变量。如果你尝试通过显示其值来使用未初始化的变量，例如，你从编译器处得到以下错误消息：\n\n`\"Use of unassigned\
    \ local variable <variable-name>\"`\n\n与其他语言一样，在 C# 中你可以通过 `+` 运算符添加数值变量，例如：\n\
    \n```csharp\nint sum = myInt + yourInt;\n```\n\n要显示变量的值，使用 `Console.WriteLine`\
    \ 或 `Console.Write` 方法：\n\n```csharp\nConsole.WriteLine(myInt);\n```\n\n你还可以在一条语句中随消息显示数值变量：\n\
    \n```csharp\nConsole.WriteLine(\"My integer = \" + myInt.ToString());\n```\n\n\
    在该语句中，`ToString` 方法是一个 `.NET` 方法，用于将数值数据类型转换为字符串数据类型。事实上，你可以省略 `ToString` 方法，因为它已经嵌入在\
    \ `WriteLine` 方法中。\n\n例如：\n\n```csharp\nConsole.WriteLine(\"My integer = \" +\
    \ myInt);\n```\n\n你还可以使用 `WriteLine` 方法的另一种形式，如下：\n\n```csharp\nConsole.WriteLine(\"\
    My integer = (0)\", myInt);\n```\n\n在这种形式下，`(0)` 被变量 `myInt` 的值替换。如果你想用一条语句显示多个变量，可以使用\
    \ `(0)`、`(1)`、`(2)` 等。\n\n```csharp\nConsole.WriteLine(\"My integer = (0), Your\
    \ integer = (1)\", myInt,yourInt);\n```\n\n在该语句中，`(0)` 被 `myInt` 替换，`(1)` 被 `yourInt`\
    \ 替换。\n\n**问题:** (WAP 的意思是写一个程序，好吗！)\n\n编写一个 C# 程序将两个整数变量的值相加，然后用适当的消息显示结果。\n\n\
    ## 程序架构\n\n一个 C# 程序可能包含一个或多个文件。任何文件都可以包含以下任何元素（将在随后的章节中解释）：\n\n*   指令。\n*   命名空间。（可以包含所有其他元素和命名空间）\n\
    *   类。\n*   结构体（Structs.）。\n*   接口（Interfaces.）。\n*   委托（Delegates.）。\n*   枚举（Enums.）。\n\
    *   成员（如方法、属性、索引器等）。\n\n如果程序包含一个以上的文件，则只需要在其中一个文件中包含一个 `Main` 方法。在下面的示例中，程序包含了上述大部分元素。虽然程序没有产生任何输出，但它可以编译并运行。\n\
    \n### 示例\n\n```csharp\n// Example 2-4.cs\nusing System; // 指令\nnamespace Namespace1\
    \ // 命名空间\n{\n    class Class1 // 类\n    {\n    }\n}\n```\n\n## 限定名命名\n\n在现实生活中，如果你有两个名叫\
    \ John 的同事，除非包含姓氏，否则很难区分他们。在编程中，完整名称被称为“完全限定名”。在处理程序元素时，仅使用姓氏是不够的。\n\n完全限定名包含了命名空间和类的名称。通过使用完全限定名，你可以使用两个同名的方法。\n\
    \n在下面的示例中，有两个同名的类（`MyC2`）。如果你对每个类都使用完全限定名，就可以避免歧义。例如：\n\n`NS1.MyC1.MyC2`\n\n以及\n\
    \n`MyNS1.MyNS2.MyC2`\n\n### 示例 2-5\n\n```csharp\n// Example 2-5.cs\n// 完全限定名\n\
    namespace MyNS1 // MyNS1\n{\n    class MyC1 // MyNS1.MyC1\n    {\n        class\
    \ MyC2 // MyNS1.MyC1.MyC2\n        {\n        }\n    }\n    namespace MyNS2 //\
    \ MyNS1.MyNS2\n    {\n        class MyC2 // MyNS1.MyNS2.MyC2\n        {\n    \
    \    }\n    }\n}\nnamespace MyNS3 // MyNS3\n{\n    class MyC3 // MyNS3.MyC3\n\
    \    {\n        static void Main()\n        {\n    }\n}\n```\n\n### 注意\n\n在上面的示例中，限定名作为注释写在每个元素旁边。示例中的元素描述如下：\n\
    \n命名空间 `MyNS1` 和 `MyNS3` 包含在全局命名空间中，该空间代表树的根；因此它们的名称已经是完全限定的。\n\n*   命名空间 `MyNS2`\
    \ 包含在命名空间 `MyNS1` 中，因此它的完全限定名是 `MyNS1.MyNS2`。\n*   类 `MyC1` 包含在命名空间 `MyNS1` 中，因此它的完全限定名是\
    \ `MyNS1.MyC1`。\n*   第一个类 `MyC2` 包含在类 `MyC1` 中，因此它的完全限定名是 `MyNS1.MyC1.MyC2`。\n\
    *   第二个类 `MyC2` 包含在命名空间 `MyNS2` 中，因此它的完全限定名是 `MyNS1.MyNS2.MyC2`。\n"
- fmt: "\nApart from the language rules, there are common conventions for writing\
    \ code. Using these conventions makes your program consistent and easy to read\
    \ by others. For the compiler, however, it doesn’t matter how you write your code\
    \ as long as you follow the rules.\n\n## Coding Conventions\n\nType names for\
    \ classes, structs, and methods using Pascal casing, which means that they start\
    \ with a capital letter (for example, `Class1` and `Method1`). If the name consists\
    \ of words joined together, capitalize the beginning of each word (for example,\
    \ `MyFirstClass` and `CalculateYourBalance`).\n\nStart interface names with the\
    \ letter “I” (for example, `IMyInterface` and `IInterface1`).\n\nFor local variables,\
    \ use camel case, which means that the name starts with a lowercase letter and\
    \ the first letter of each successive word is capitalized (for example, `myVariable`,\
    \ `yourInt`, and `myDoubleType`). The uppercase bumps in the middle of the compound\
    \ word make the name look like the humps of a camel.\n\nUse expressive names that\
    \ convey the meaning or their use, such as `myAccountNumber` and `yourSSN`. Names\
    \ like `x`, `y`, and `z` should be avoided unless they are used in the proper\
    \ context, such as mathematical equations.\n\nStart the left brace (`{`) on a\
    \ separate line under the class or class member declaration. The right brace (`}`)\
    \ is placed in the same column on a separate line. Notice that the class body\
    \ starts in the fourth column after the left brace (indented by three spaces).\
    \ Leave a blank line after each distinct operation, such as after variable declarations,\
    \ repetition loops, or conditional constructs.\n\n```\nclass HelloWorld\n{\n\n\
    ```\n\n## Code Documentation\n\nThree forward slash characters (`///`) are used\
    \ to provide XML documentation comments in your code. These comments can precede\
    \ types, members, and parameters. This information is especially useful if you\
    \ work as part of a team. You can then describe your classes and how they are\
    \ used as you type the code. If you are writing user documentation such as an\
    \ SDK or a programmer’s reference, this information can also be useful for generating\
    \ the IntelliSense in the IDE environment.\n\nThe following is an example of documenting\
    \ the Hello World! by using XML tags:\n\n```\nusing System;\n\n/// <summary>\n\
    /// A test project to show documentation comments.\n/// </summary>\nclass MyClass\n\
    {\n    /// <summary>\n    /// The Main method of the program.\n    /// </summary>\n\
    \    /// <param name=\"args\">Command-line arguments.</param>\n    /// <returns>Does\
    \ not return a value.</returns>\n    static void Main(string[] args)\n    {\n\
    \        string myString = \"Hello, World!\";\n        Console.WriteLine(myString);\n\
    \    }\n}\n```\n\nC# compiler generates the documentation and exports it to an\
    \ XML file. To generate the documentation file, use the compiler option `/doc`\
    \ as shown below. If you save this program with the name `Ex2.cs`, you can compile\
    \ it using the following command: `csc /doc:Ex2.cs`.\n\nThe following documentation\
    \ file (`Ex2.xml`) will be generated:\n\n```xml\n<?xml version=\"1.0\"?>\n<assembly>\n\
    <name>Tester</name>\n</assembly>\n```\n\n## Summary: In this chapter\n\n- You\
    \ wrote your first program in C# and learned about its building blocks, including\
    \ the declaration of a class, the `Main` method, and directives.\n- You learned\
    \ how to display the output by using .NET methods `Write` and `WriteLine`.\n-\
    \ You also know how directives can save time and effort when using .NET methods.\n\
    - You now know how to declare and initialize local variables inside a method.\n\
    - You also know that the C# language doesn’t allow you to use a variable before\
    \ initializing it.\n- In the examples, you learned how to assign values to variables\
    \ and perform some basic operations such as variable addition.\n- You know that\
    \ the `ToString` method is used to convert other types to strings and that it\
    \ is embedded in the `WriteLine` (or `Write`) method so you don’t need to use\
    \ it explicitly in displaying numeric output.\n- You learned about C# program\
    \ architecture and how the building blocks work together to build the application.\n\
    - You were introduced to fully qualified names and their role in resolving name\
    \ conflicts in the program.\n- You learned about common conventions for writing\
    \ your code that make it easy for others to read and understand.\n- Finally, you\
    \ learned how to create an XML documentation file for your code.\n\n# CHAPTER\
    \ 3: The C# Data Types and Use\n\n## Introduction Data Types\n\nIn C#, there are\
    \ two types of data:\n- **Value types**: Variables that store data values on the\
    \ stack.\n- **Reference types**: Variables that store memory addresses of the\
    \ data stored on the heap.\n\nThere is also a third type of data, the pointer\
    \ type, which is used in writing unsafe code. The pointer type is not covered\
    \ in this book as it is added to the language for compatibility with C++. Although\
    \ the C# language does not support pointers directly, it is possible for C++ programmers\
    \ to write unsafe blocks of code and use pointers inside these blocks.\n\n## Built-in\
    \ Data Types\n\nThe built-in data types are aliases of types originally defined\
    \ in the .NET class library. These types and the corresponding .NET types are\
    \ shown in the following table.\n\n### C# built-in data types\n\nNotice in the\
    \ table that the word `Object` is a class in the .NET class library. It represents\
    \ the root of all types. It is important to notice also that the C# `object` is\
    \ lowercase. Needless to say, you can use either the C# type or the .NET type\
    \ in your code. For example, the following two statements are equivalent; they\
    \ both declare an integer variable and assign the value 25 to it:\n\n```csharp\n\
    int myInt = 25;\nSystem.Int32 myInt = 25;\n```\n\nThe following two statements\
    \ are also equivalent; both declare a variable of the object type:\n\n```csharp\n\
    object myObject;\nSystem.Object myObject;\n```\n\nIn Table 3-1, all types except\
    \ the `string` and `object` types are called simple data types.\n\n## Value Types\n\
    \nValue types include the numeric types (integers, floats, and so forth) and the\
    \ Boolean type (`bool`). They also include user-defined types such as structs\
    \ and enumerations. The following table shows the C# value types and a description\
    \ of each type.\n\nValue types are stored on the stack, which is the region in\
    \ memory used to store local variables and their data. All value types are implicitly\
    \ derived from the `ValueType` class in the `System` namespace. Value types, however,\
    \ cannot be inherited.\n\n### Variable Initialization\n\nTo use a variable you\
    \ must first initialize it with a value, as shown in the following examples:\n\
    \n```csharp\nint myValue = 123;\nint myValue = 0;\nint myValue = new int();\n\
    ```\n\nIn the first example, we initialized the variable `myValue` with the value\
    \ 123. In the second example, it is initialized with zero. In the third example,\
    \ the variable is also initialized with zero by using the `new` keyword, which\
    \ calls the default constructor (a constructor is a method that initializes an\
    \ instance of a class) that initializes the variable with its default value—zero\
    \ in this case. This means that the last two statements are equivalent.\n\n###\
    \ Default Values\n\nEach value type has a constructor that initializes it to its\
    \ default value. The default value for each type is shown in the following table.\n\
    \nWhen using structs, you instantiate the struct by using the keyword `new`, which\
    \ initializes the instance members with the default values.\n\nFollowing is an\
    \ example of a struct that represents a point at the coordinates (x,y):\n\n```csharp\n\
    struct Point\n{\n    int x;\n    int y;\n}\n```\n"
