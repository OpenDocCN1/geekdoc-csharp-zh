    set { m1 = value; }


    }


    // Explicit implementation of the method:


    void IDerived.M1() { }


    }


    In the following example, one of the explicit alternative implementations of method
    and property is demonstrated.


    ![](images/00212.jpeg)


    ![](images/00213.jpeg)


    ![](images/00214.jpeg)


    ![](images/00215.jpeg)


    ![](images/00216.jpeg)


    ![STAR-LOGO-2013](images/00004.jpeg)


    CHAPTER


    ∞ 9 ∞


    (Exceptions Handling)


    Introduction-


    Errors and Exceptions:


    Exceptions are run-time errors that can stop the program execution unless they
    are handled properly. Exceptions are generated when certain conditions occur in
    your program, such as dividing by zero, trying to open a file that was erased,
    incorrect casting, or running out of memory.


    In such cases, you deal with the exception by using the appropriate handler in
    order to prevent the program from stopping. The handler is a block of code that
    catches the exception and tries to continue the program execution. If the appropriate
    handler is not available in your code, the default handler is used and the program
    is terminated.


    In C#, an exception is an object of the class System.Exception or one of its subclasses,
    which represents an error that occurred during the program execution. The keywords
    used in handling exceptions are throw, catch, and finally. Handling exceptions
    requires using a special construct that uses one of the following statements:


    *   throw: To throw or rethrow an exception.


    *   try-catch: To catch and handle the exception.


    *   try-finally: To clean up the resources after throwing the exception regardless
    of whether or not the exception was caught.


    *   try-catch-finally: To catch and handle the exception and clean up resources.


    These statements are explained in the following sections.


    Throwing an Exception-


    In this section, we deliberately throw an exception to show you what one looks
    like. You can do this using the throw statement. The throw statement takes the
    following form:


    throw [expression];


    where:


    expression is the exception object.


    Some of the exceptions that can be thrown by an application are:


    *   InvalidCastException.


    *   OverFlowException.


    *   ArgumentNullException.


    *   ArithmeticException.


    *   DivideByZeroException.


    When an exception is thrown, the execution pauses momentarily, searching for the
    appropriate exception handler. If one is found, it handles the exception and the
    execution resumes; otherwise, the execution is terminated at this point. In the
    following example, you throw an exception object of the class ArgumentNullException
    after assigning the value null to the variable myString.


    ![](images/00217.jpeg)


    ![](images/00218.jpeg)


    When you run this program, it first display the text:


    The string is Hello.


    It then displays the following window:


    ![](images/00219.jpeg)


    This window contains the regular options that are available when a runtime error
    occurs. When you click Debug, the following Just-in-Time Debugger window appears
    on the screen.


    ![](images/00220.jpeg)


    As you can see in Figure 9-2, the name of the exception that caused the termination
    of the application (ArgumentNullException) and the name of the application (Ex9-1.exe)
    are indicated in the first two lines. This screen also contains some details of
    the exception and the available debuggers. Click No to skip the debugger and return
    to the program execution. You will then see the following text:


    Unhandled Exception: System.ArgumentNullException: Value cannot


    be null.


    at MyClass.Main()


    The program execution is ended at this point. Notice that the last line of code:


    Console.Write("myString is null.");


    Will not be executed because it followed throwing the exception. You can use the
    class System.Exception instead of the class ArgumentNullException, in which case
    you get another message from the program that says:


    Unhandled Exception: System.Exception: Exception of type


    ''System.Exception'' was thrown.


    at MyClass.Main()


    The name of the exception object always shows up in the result. This example demonstrates
    the default handler, which is used when you don’t catch the exception. In the
    following sections, you will learn how to catch an exception and use the appropriate
    handler to deal with it in order to continue executing the application.


    Catching an Exception-


    You can catch exceptions by using the try-catch statement, which contains two
    blocks. The first is the try block, inside which the suspicious code is inserted.
    It takes the form:


    ![](images/00221.jpeg)             


    where:


    declaration is the exception object declaration and is optional.


    The two blocks are used together to build one statement. If you attempt to use
    the try block alone, you will get the compilation error:


    error CS1524: Expected catch or finally.


    The catch block can be used without any parameters at all, in which case it is
    used to catch any exceptions. It is also possible to use more than one catch block.
    In this case, the try-catch statement takes the form:


    try


    {


    //


    }


    catch (declaration-1)


    {


    // first handler


    }


    catch (declaration-2)


    {


    // second handler


    }


    catch (declaration-3)


    {


    // third handler


    }


    ...


    When the program throws an exception, the run-time engine starts looking for the
    suitable catch block that matches the exception. If the catch block is found,
    the program resumes execution after handling the problem or displaying the appropriate
    message that explains the problem that took place during the program execution.


    Example 9-2 demonstrates the following:


    *   Throwing the exception.


    *   Trying the suspicious code using the try block.


    *   Handling the exception by using the catch block.


    ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)


    ![](images/00222.jpeg)


    ![](images/00223.jpeg)


    ![](images/00224.jpeg)


    Notice


    In the above example that the existence of the catch block itself was enough to
    resume the program execution, regardless of the code it contains.'
