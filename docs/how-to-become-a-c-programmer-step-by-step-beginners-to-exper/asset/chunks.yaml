    属性是一个布尔值。如果可空变量的 `HasValue` 属性为 `true`，可以通过 `Value` 属性访问该变量的值。`Value` 属性代表可空变量的底层类型。例如：


    ```csharp

    if (myInt.HasValue) yourInt = myInt.Value;

    ```


    在该语句中，检查了 `myInt` 的 `HasValue` 属性以确定它是 `true` 还是 `false`。如果是 `true`，则访问 `myInt`
    的值。


    ## 使用 ?? 运算符


    正如语句后面的注释中所示，这与不进行任何格式化产生的输出相同。这些语句随后等同于以下语句：


    ```csharp

    Console.WriteLine("{0}", 1.2);

    Console.WriteLine("{0}", 1.23);

    ```


    ## 字符串类型


    如果你熟悉 C 或 C++，可能知道创建和操作字符串的困难。C 语言不包含 `string` 关键字；相反，字符串被声明为字符指针或字符数组。这会让初学者感到困惑，并可能导致内存泄漏。C#
    一劳永逸地解决了这个问题。


    你通过使用 `string` 关键字来声明字符串，像使用其他变量一样使用它。在后台，编译器完成了 C 和 C++ 需要你完成的工作。


    ## 字符串表达式


    要声明字符串变量，请像这样使用 `string` 关键字：


    ```csharp

    string myString;

    ```


    你当然可以在同一语句中初始化字符串：


    ```csharp

    string myString = "Welcome to the string world!";

    ```


    字符串字面量（数据值）放在引号之间。你还可以在字符串中包含任何转义序列字符，例如换行符。例如：


    ```csharp

    string myString = "My friend,\nWelcome to the string world!";

    ```


    该语句显示：


    My friend,

    Welcome to the string world!


    为了在字符串中包含任何特殊字符（例如反斜杠或引号），必须在特殊字符前面加一个反斜杠。例如：


    ```csharp

    string myString = "To go to the next line use the new line character: \"\\n\"";

    ```


    该语句显示：


    To go to the next line use the new line character: "\n"


    与 C++ 中，双反斜杠用于文件夹名称（目录）。例如：


    ```csharp

    string myDir = "C:\\Documents\\Letters\\friends.doc";

    ```


    ## 字符串运算符


    要操作字符串，你需要使用字符串运算符，这些运算符将在后续章节中解释。


    ### 字符串拼接 (+, +=)


    要拼接两个字符串，请像本例所示使用 `+` 运算符：


    ```csharp

    string myString = "Hello" + ", " + "World!";

    ```


    通过该语句，字符串 `myString` 将包含“Hello, World!”短语。


    你也可以拼接字符串变量。首先声明并初始化变量：


