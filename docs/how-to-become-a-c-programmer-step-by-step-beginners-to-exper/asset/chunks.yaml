    Overriding the ToString Method-


    The ToString method is one of the most important methods in the .NET library as
    it always works in the background with the methods Console. Write or Console.WriteLine.
    It is used to convert an expression to a string. As you know, you can use it explicitly
    like this:


    Console.WriteLine(myVariable.ToString());


    but if you omit the ToString method, which is always the case since it is embedded,
    you still get the same result. This method is an override method defined in the
    class System.AppDomain as follows:


    public override string ToString();


    In some cases you might need to override it to change its behavior, such as when
    you would like to display an object as if it were a regular variable. Instead
    of displaying a Point object like this (as in the example above):


    Console.WriteLine("Point #1: ({0},{1})", p1.x, p1.y);


    you can display it like this:


    Console.WriteLine("Point #1: {0}", p1);


    To do that, you must override the method ToString to be able to display objects
    of the type Point. Here is an example of the code to do this:


    // Overriding the ToString method:


    public override string ToString()


    {


    return (String.Format("({0}, {1})", x, y));


    }


    In this code segment, the String.Format method replaces the format items, {0}
    and {1}, with the text equivalent to the value of the specified objects, x and
    y. Thus, the output of this method would be the values of the point (x, y). You
    can add this method to the preceding example and display the Point objects directly
    as single variables.


