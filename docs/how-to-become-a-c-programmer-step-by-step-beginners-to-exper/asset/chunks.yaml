    `Main` 方法的一种可能形式如下：


    ```

    static void Main(string[] args)

    ```


    使用这种形式允许 C# 程序接受一系列字符串作为参数。这些参数将以名为 `args[0]`、`args[1]` 等字符串数组元素的形式被接收。


    字符串参数也可以转换为其他数据类型，如第 3 节介绍的那样。在接下来的示例中，程序在运行时接收两个参数。程序将第一个参数转换为 `long` 类型数字，将第二个转换为
    `double` 类型数字，然后显示它们及其乘积。


    ![](img/00089.jpeg)


