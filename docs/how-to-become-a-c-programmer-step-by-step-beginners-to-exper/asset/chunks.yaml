    The following table shows the C# arithmetic operators along with their precedence
    and associativity. In this table, the operators are divided into four categories.
    The operators in each category have the same precedence. The operators in the
    first row have the highest precedence, while those in the last row have the lowest
    precedence.


    ![](images/00035.jpeg)


    ![](images/00036.jpeg)


    Notice that the expression:


    ```

    y+++x

    ```


    is equivalent to the expression:


    ```

    y++ +x

    ```


    This is because the associativity for the increment and decrement operators is
    from right to left, which is not the case with the binary operators. It is preferred,
    however, to use a blank space or parentheses to make the code easier to read.


    ### How to Get the Type Name


    By using the .NET method `GetType`, you can get the type name of any local variable
    or object. This is how to use it:


    ```csharp

    Console.WriteLine(myVariable.GetType());

    ```


    In this statement, `myVariable` is the local variable, expression, or object for
    which you would like to get the type name.


    ![](images/00037.jpeg)


    ### Evaluating Expressions with Mixed Types


    If you write an expression that contains different real (floating-point) types
    and integral types, it is evaluated as follows:


    - If the expression contains a `double` value, the result would be `double`.

    - If the expression doesn’t contain a `double` value, the result would be `float`.

    - If the expression contains any integral type and a real type, the `integraltype`
    would be converted to the real type and the result would be of the real type.

    - In the following example, an expression that contains integral types and floating-point
    types is evaluated as `double`.


    ![](images/00038.jpeg)


    ### Adding a Suffix to Numeric Data


    It is necessary with some data types to add a suffix to the numeric literals to
    distinguish them from other types. This is explained further in the following
    sections.


    #### Real Types


    The compiler treats a real number as a `double` type unless you add a suffix to
    define its type explicitly as follows:


    - Use `M` or `m` with the `decimal` type. For example, `23.4M`.

    - Use `F` or `f` with the `float` type. For example, `23.4F`.

    - When you declare a real type variable you must use the proper suffix;


    Otherwise, the compiler issues an error message. For example, the following declarations
    generate error messages:


    ```csharp

    decimal myAmount = 23.4; // error

    float myRealNumber = 23.4 // error

    ```


    Note Although you can use either lowercase or uppercase letters in suffixes, we
    use uppercase letters in the programs in this book.


    ![](images/00039.jpeg)


    Note The new line character `\n` inside the quotation marks allows the string
    literal to print on more than one line, as shown in the above example.


    ![](images/00040.jpeg)


    #### Integral Types


    With integral types, you don’t have to suffix data values because the appropriate
    storage is automatically chosen for you when the expression is evaluated. You
    can, however, use the suffixes `L`, `U`, or `UL` to determine the type of numeric
    value and the proper storage for it. Follow these rules when using the suffixes:


    - When you use the suffix `L`, the number is considered of the `long` or `ulong`
    type according to its value. For example, the following number is treated as a
    `long` because it is less than the limits of `ulong`: `4294967296L`

    - When you use the suffix `U`, the number is treated as either `long` or `uint`
    according to its value. For example, the following number is treated as a `uint`
    because it is less than the limits of the type `long`. `4294967290U`

    - When you use the letters `U` and `L` together, in any order, the number is treated
    as a `ulong`.


    ![](images/00041.jpeg)


    ### Conversion between Types


    In C# there are two methods of type conversion: implicit and explicit. For example,
    you can write the following statements to declare real variables:


    ```csharp

    double myVar = 4;

    float myVar = 33;

    ```


    These declarations include implicit conversions from the integer type to `float`
    and `double`. Such conversions are performed in the background for you. You cannot,
    however, type the following statement:


    ```csharp

    float myVar = 3.3; // compilation error

    ```


    This statement means that you want to store the value `3.3`, a `double` value
    (as mentioned in the previous section), into a smaller storage type, which is
    of type `float`. The compiler doesn’t accept this statement and sends you an error
    message.


    Of course, you can use the suffix `F` to specify that the number is a `float`;
    this results in converting the literal itself to the `float` type. The general
    rule for type conversion is that you can store the smallerize storage type into
    the larger size, but not the opposite. Consider the following declarations:


    ```csharp

    int x = 4;

    double y = 3.0;

    ```


    With these declarations the following statements are not allowed:


    ```csharp

    short z1 = x; // compilation error

    short z2 = y; // compilation error

    ```


    The reason is that there is no implicit conversion from `int` or `double` to `short`
    they are both larger than the size of the storage. To complete this conversion,
    you must use a cast, as shown in the following statements:


    ```csharp

    short z1 = (short)x;

    short z2 = (short)y;

    ```


    This kind of conversion is called explicit conversion. With integral types, it
    is important to check the destination storage before performing an assignment.
    For example, the following statement shows an incorrect attempt to store an `int`
    into a `short`.


    ```csharp

    short x = 32768;

    ```


    #### char Type


    C# characters are stored as 16-bit Unicode characters. With the Unicode system,
    it is possible to represent characters of any language including Chinese, Japanese,
    Hebrew, and Arabic. You can write characters in multiple ways. The following examples
    represent the letter “A”. You can write it as a literal character:


    ```csharp

    char myChar = ''A'';

    ```


    as hexadecimal code:


    ```csharp

    char myChar = ''\x0041'';

    ```


    as a Unicode character:


    ```csharp

    char myChar = ''\u0041'';

    ```


    or by casting the ASCII code:


    ```csharp

    char myChar = (char)65;

    ```


    The character code is enclosed in single quotes in all instances except you use
    the cast. The following example introduces two methods for coding the letter “A”
    and displaying the results, once as a character and once in ASCII code.


    ![](images/0042.jpeg)


    ### Formatting Results


    In most applications you would want to display the results in the appropriate
    format. For example, in some applications you need to show two decimal places,
    and in other applications you need to display the dollar sign or the pound sign.
    This is all done through the `Write` or `WriteLine` methods, as explained in the
    following sections.


    #### The Currency Format


    To display a number with its associated currency symbol and the appropriate number
    of decimal places, use the currency character `C` or `c`, as in the following
    example:


    ```csharp

    Console.WriteLine ("{0:C}", 1.2);

    ```


    The number `1.2` appears in the output like this: $1.20.


    If the number `1.2` is negative, like this:


    ```csharp

    Console.WriteLine ("{0:C}", -1.2);

    ```


    it appears inside parentheses like this: ($1.20).

