    Console.Write("Salary is less than or equal to 2k"); // The


    alternative result


    If you use more than one statement to express either one of the results, include
    the statements inside block braces ({ }). For example, when the following condition
    becomes true, all the statements in the following block are executed:


    if (salary > 2000)


    {


    Console.WriteLine("Original result_1");


    Console.WriteLine("Original result_2");


    Console.WriteLine("Original result_3");


    }


    It is possible for the original result or the alternative result to be another
    if-else construct. For example, you can test the case of the character entered
    from the keyboard by using the following algorithm:


    If the character is a letter, check to see whether it is:


    *Lowercase: display the appropriate message.


    *Uppercase: display the appropriate message.


    *If the character is not a letter, display the appropriate message.             


