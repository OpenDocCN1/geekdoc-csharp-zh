    nullable variable. Use the ?? operator to assign a default value that will be
    applied when a variable with the value null is assigned to another variable. For
    example:


    int? myInt = null;


    int yourInt = myInt ?? -5;


    The first statement assigns null to myInt, and the second statement assigns the
    default value (–5) to myInt, and then assigns it to yourInt. Now when you display
    yourInt you get –5.


