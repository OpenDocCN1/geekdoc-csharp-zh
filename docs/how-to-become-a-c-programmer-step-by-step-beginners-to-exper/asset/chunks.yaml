  trans: "\n\n`control_expression` 是在循环执行期间需要满足的条件。`statement(s)` 是要执行的语句（或语句块）。由于\
    \ `while` 循环从测试条件开始，如果条件失败，则语句块可能完全不执行。以下代码段显示了从 1 到 5 的数字，每个数字占一行。注意，你必须在循环开始之前初始化计数器。\n\
    \n```csharp\nwhile (counter < 6)\n{\n    Console.WriteLine(counter);\n    counter++;\n\
    }\n```\n\n下面的示例也显示了计数器的值，但使用了不同的逻辑。控制表达式是：“如果 counter 不等于零”。由于计数器被初始化为值 1，因此条件始终为真。在循环内部，使用\
    \ `break` 语句在满足特定条件时终止循环。\n\n![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg)\
    \ ![](img/00075.jpeg)\n![](img/00076.jpeg)\n![](img/00077.jpeg)\n\n在上面的示例中，注意使用\
    \ `continue` 语句在根据条件跳过值 2 后恢复循环执行：\n\n```csharp\nif (counter == 2) continue;\n\
    ```\n\n当计数器超过值 5 时，`break` 语句会导致循环终止：\n\n```csharp\nif (counter > 5) break;\n\
    ```\n\n![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg)\n\
    \n## do-while 循环\n\n`do-while` 循环用于满足某些条件时重复执行语句块。该循环采用以下形式：\n\n```csharp\ndo\
    \ statement(s)\nwhile (control_expression);\n```\n\n其中：\n`control_expression`\
    \ 是在循环执行期间需要满足的条件。`statement(s)` 是要执行的语句（或语句块）。`do-while` 循环的特点是无论条件如何，至少会被执行一次。\n\
    \n这是因为条件是在执行语句后才测试的。下面的示例使用 `do-while` 循环显示了从 1 到 10 的偶数。注意使用 `continue` 语句跳过奇数，以及使用\
    \ `return` 语句提前终止循环。\n\n在这个示例中，`return` 语句的作用与 `break` 语句相同。虽然这两个语句都能终止循环，但它们之间存在差异。\n\
    \n`break` 语句会将控制权转移到循环循环后面的语句（如果存在的话）。`return` 语句会将控制权转移到调用方法。假设循环存在于名为 `MyMethod`\
    \ 的方法内部，该方法由另一个名为 `YourMethod` 的方法调用。\n\n当在 `MyMethod` 中遇到 `return` 语句时，程序控制将转移到\
    \ `YourMethod`。在这个示例中，`return` 结束了 `Main` 方法的执行；因此，如果你在循环之后立即添加任何语句，该语句将不会被执行。\n\
    \n![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg) ![](img/00075.jpeg)\n\
    ![](img/00078.jpeg)\n![](img/00079.jpeg)\n![](img/00080.jpeg)\n![](img/00081.jpeg)\n\
    \n## 分支语句\n\n以下语句用于退出重复循环：\n*   `Break`\n*   `Goto`\n*   `Return`\n*   `Throw`\n\
    \n你已经在前面的章节中看到过 `return` 和 `break` 的一些示例。在许多语言（包括 C#）中，不推荐使用 `goto` 语句，因为它破坏了程序的结构。\n\
    \n然而，在某些情况下可以使用它可以退出深层嵌套循环。它也被用于 `switch` 结构，从一个 case 跳到另一个 case。例如：\n\n```csharp\n\
    case 1:\n    // 执行某些操作\n    goto case 3;\n```\n\n通常情况下，`goto` 语句采用以下形式：\n\n![](img/00082.jpeg)\n\
    \n其中：\n`label` 是标签名称。\n\n标签是一个标识符，后跟一个冒号，如下例包含“Finish”标签的示例所示：\n\n```csharp\n\
    goto Finish;\n...\nFinish:\nConsole.WriteLine(\"You are done here!\");\n```\n\n\
    `throw` 语句用于捕获程序执行过程中可能发生的异常。异常将在第 9 章进行详细解释。\n\n## 数组\n\n数组表示一组相同类型的元素。数组可以是一维或多维的。一维数组可以表示排队的一组人。\n\
    \n二维数组可以表示教室中按行和列组织的学生。数组元素本身也可以是数组，在这种情况下，该数组被称为交错数组或数组的数组。\n\n数组继承自 `System.Array`\
    \ 类，该类是公共语言运行时（CLR）中所有数组的基类。接下来的章节中将演示该类的一些方法的使用。\n\n### 一维数组\n\n你可以像示例所示声明一个一维数组：\n\
    \n```csharp\nint[] myIntArray = new int [10];\n```\n\n此声明为名为 `myIntArray` 的十个整数分配了内存。数组元素从\
    \ `myIntArray[0]` 到 `myIntArray[9]`。\n\n这里使用 `new` 操作符将数组元素初始化为默认值——在这种情况下为零。可以声明任何类型（引用类型或值类型）的数组，如下例所示，它声明了一个字符串数组：\n\
    \n### 数组的初始化与声明\n\n与其他变量一样，你可以声明一个数组而不初始化，在这种情况下，你必须在使用之前对其进行初始化：\n\n```csharp\n\
    int[] myIntArray;\n```\n\n也可以同时声明并初始化数组：\n\n```csharp\nint[] myIntArray = {1,\
    \ 2, 3, 4, 5};\n```\n\n或者你可以指定大小并使用 `new` 关键字：\n\n```csharp\nint[] myIntArray\
    \ = new int[5] {1, 2, 3, 4, 5};\n```\n\n值类型和引用类型之间的区别在于，值元素初始化为默认值，而引用元素初始化为 `null`。\n\
    \n### 多维数组\n\n你可以像下面这样声明并初始化二维数组：\n\n```csharp\nint[,] myTwoDimArray = new int[3,2]\
    \ {{1,2}, {3,4}, {5,6}};\n```\n\n这声明了一个维度为 [3,2] 名为 `myTwoDimArray` 的数组。你可以将二维数组可视化为包含行和列的表格。在下面的示例中，你声明了一个维度为\
