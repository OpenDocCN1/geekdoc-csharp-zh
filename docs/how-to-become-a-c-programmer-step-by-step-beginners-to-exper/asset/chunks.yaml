    ## Using the Nullable Structure Properties


    The C# nullable type is an instance of the `System.Nullable` structure. The two
    essential properties of the `Nullable` structure are `HasValue` and `Value`. The
    `HasValue` property is a Boolean value. If the `HasValue` property of a nullable
    variable is `true`, the value of this variable can be accessed with the `Value`
    property. The `Value` property represents the underlying type of the nullable
    variable. For example:


    ```csharp

    if (myInt.HasValue) yourInt = myInt.Value;

    ```


    In this statement the `HasValue` property of `myInt` is checked to determine whether
    it is `true` or `false`. If it is `true`, the value of `myInt` is accessed.


