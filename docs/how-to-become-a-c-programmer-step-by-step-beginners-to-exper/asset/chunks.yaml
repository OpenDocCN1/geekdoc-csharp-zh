    ## 可空类型


    可空类型在 C# 2005 中被添加到值类型中。此功能允许你将值 `null` 赋值给值类型变量。在数据库中需要此功能，因为变量可以假设包括 `null`
    在内的任何值。可空变量通过在类型名称旁边使用 `?` 符号声明，如下：


    ```csharp

    myType? myVariable;

    ```


    其中 `myType` 是包括 `struct` 类型在内的值类型之一。它被称为可空类型的底层类型。例如，考虑以下语句：


    ```csharp

    int myInt? = null;

    ```


    在该语句中，底层类型是 `int`。这意味着变量 `myInt` 除了接受 `null` 之外，还可以接受赋值给 `int` 的所有值，这意味着“未使用”或“空”。在接下来的示例中，


    ```csharp

    bool myBool?;

    ```


    `myBool` 可以取 `true`、`false` 或 `null` 中的任意值。在数据库中，此功能非常重要，因为数据库字段可能包含 `null` 来表示该变量未定义。


    这与引用类型中使用的相同相同，其中值 `null` 被用来表示变量未初始化。


