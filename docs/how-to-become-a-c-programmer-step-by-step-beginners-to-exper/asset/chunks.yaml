    然后按照顺序拼接这些变量：


    ```csharp

    string myString = hello + commaAndSpace + world;

    ```


    你也可以使用加赋值运算符（`+=`）：


    ```csharp

    hello += commaAndSpace + world;

    ```


    上述语句拼接了三个字符串，并将它们赋值给左侧的变量。也就是说，该语句的意思是：将“hello”拼接到“commaAndSpace”和“world”之后，并将结果存放在变量“hello”中。注意，拼接变量的顺序非常重要。在实践中，你很少使用这种方法来拼接字符串；相反，你应该使用
    `StringBuilder` 类（在下一节中解释）以及及其方法。


    ### 使用 StringBuilder 类


    C# 的 `string` 类型是 `System.String` 类的别名。`String` 对象是不可变的，这意味着一旦你创建了它，就无法更改它的值。当你对字符串进行更改时，实际上是创建了一个带有新内容的新字符串。如果你想修改实际字符串的内容，可以使用
    `StringBuilder` 类（`System.Text` 命名空间下的成员）。例如，你可以这样创建一个包含“Hello,”的字符串：


    ```csharp

    StringBuilder myString = new StringBuilder("Hello,");

    ```


    然后你可以使用 `Append()` 方法通过字符串“World!”将其追加到末后：


    ```csharp

    myString.Append("World!");

    ```


    你还可以使用 `Insert()` 方法在第六位置插入一个空格：


    ```csharp

    myString.Insert(6, " ");

    ```


    现在，当你显示 `myString` 时，它将包含字符串“Hello, World!”


    注意：请参考 Visual Studio 帮助文档以获取更多关于 `StringBuilder` 类及其成员的信息。


    ### 等于运算符 (`==`)


    等于运算符用于判断两个字符串是否相同。例如，以下语句检查存储在 `myString` 和 `yourString` 中的字符串是否相等。


    ```csharp

    Console.WriteLine(yourString == myString);

    ```


    如果它们相等，则该语句的结果为 `true`；否则为 `false`。


    ### `[]` 算符


    该运算符用于访问字符串的单个字符——这与 C++ 中字符数组的概念相同。


    例如，你可以通过访问第七个字符（注意起始索引为 0）在字符串“Hello, World!”中显示字母“W”，如下句所示：


    ```csharp

    Console.WriteLine("Hello, World!"[7]);

    ```


    如果字符串存储在变量中（如 `myString`），你可以这样访问字符：


    ```csharp

    Console.WriteLine(myString[7]);

    ```


    ### `@` 符号


    使用 `@` 符号，你可以显示任何字符串，而无需在字符串内部使用转义字符。例如，与其编写以下语句：


    ```csharp

    string myDoc = "C:\\Documents\\Letters\\friends.doc";

    ```


    你可以在字符串前加上 `@` 符号，如下所示：


    ```csharp

    string myDoc = @"C:\Documents\Letters\friends.doc";

    ```


    两种方法声明的字符串都包含内容“C:\Documents\Letters\friends.doc.”。事实上，引号内的任何内容都会原样显示。例如：


    ```csharp

    string myString = @"Dear Sir,


    I have read your manuscript ''Learn C# in Three Days'', and I would like to inform
    you that we are interested in publishing the book.


    Yours,


    Dylan A. Combel";

    ```


    如果你显示此字符串，将得到以下内容：


    Dear Sir,


    I have read your manuscript ''Learn C# in Three Days'', and I would like to inform
    you that we are interested in publishing the book.


    Yours,


    Dylan A. Combel


    为了在文本内部显示引号，请使用两个双引号而不是一个。例如：


    `@"He said, ""You should stop by when you can,"" OK?"`


    此字符串的显示如下：


    He said, "You should stop by when you can," OK?


    `@` 符号的最后一个用途是作为 C# 关键字的前缀，以便作为变量使用。虽然你不能将 `bool` 和 `int` 等关键字作为变量，但允许使用单词 `@bool`
    和 `@int`。


