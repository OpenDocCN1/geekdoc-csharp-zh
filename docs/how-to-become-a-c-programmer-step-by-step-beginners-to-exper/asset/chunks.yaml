    Relational Operators-


    The relational operators (or comparison operators) are used in building relational
    (or Boolean) expressions to compare literals, variables, or expressions. The following
    are some examples of relational expressions:


    x > y // x is greater than y


    y < 255 // y is less than 255


    myInt == x + y // myInt is equal to x + y


    The following table lists the relational operators in C#.


    ![](images/00057.jpeg)


    Relational expressions are evaluated as either true or false. This means that
    the result is a Boolean value. As mentioned in Chapter 3, unlike C++, in C# the
