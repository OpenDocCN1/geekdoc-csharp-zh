    User-defined Operators-


    By using overloading, you can invent new roles for some operators. The need for
    this feature arises when you deal with objects. In some cases, you might want
    to test the equality between two objects using the equality operator (==). In
    this case, you redefine the equality operator in your program to make it work
    with objects.


    Operator overloading is accomplished by using the keyword operator, as shown in
    the following example:


    public static Point operator+(Point p1, Point p2)


    {


    // Implementation of the + operator:


    }


    This example overloads the + operator in order to use it in adding two objects
    of the type Point. Adding two points means adding the x and y coordinates of each
    point. If the coordinates of the first point are (x1, y1) and the coordinates
    of the second point are (x2, y2), the result is a new point at the location (x1+x2,
    y1+y2). These details should be included in the implementation of overloading
    the operator +.


    Notice in the syntax that the redefined + operator follows the keyword operator.
    Other examples are:


    Operator +


    Operator –


    Operator ==


    The method used for operator overloading is always static. The following table
    lists the operators that can be overloaded. The operators that are classified
    as binary operate on two operands, such as + and *. The operators that are classified
    as unary operate on one operand, such as ++ and ––.


