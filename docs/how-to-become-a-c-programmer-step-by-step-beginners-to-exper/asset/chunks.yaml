- fmt: "\nIn this section, you will learn how to build conditions in your program\
    \ by using selection statements such as `if` and `switch`. Selection statements\
    \ are used to determine which and when a statement or group of statements should\
    \ be executed in your program. Selection statements rely on relational or logical\
    \ expressions and operators.\n\n## Relational Operators\n\nThe relational operators\
    \ (or comparison operators) are used in building relational (or Boolean) expressions\
    \ to compare literals, variables, or expressions. The following are some examples\
    \ of relational expressions:\n\n```\nx > y // x is greater than y\ny < 255 //\
    \ y is less than 255\nmyInt == x + y // myInt is equal to x + y\n```\n\nThe following\
    \ table lists the relational operators in C#.\n\n![](images/00057.jpeg)\n\nRelational\
    \ expressions are evaluated as either true or false. This means that the result\
    \ is a BooleanBoolean value. As mentioned in Chapter 3, unlike C++, in C# the\
    \ value `false` doesn’t equal zero and the value `true` doesn’t mean a non-zero\
    \ value. The following example demonstrates the use of some relational expressions.\n\
    \n![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg) ![fractal-tree2](images/00055.jpeg)\n\
    \nExample 4.1-\n\n![](images/00058.jpeg)\n\n## Logical Operators\n\nLogical operators\
    \ are used to combine relational expressions to build a logical (or Boolean) expression.\
    \ A logical expression is also evaluated as either true or false. Some operators\
    \ operate on two operands (binary), while others operate on one operand (unary).\n\
    \nThe following table contains a list of the commonly used C# logical operators\
    \ and their descriptions.\n\n![](images/00059.jpeg)\n\nThe following are some\
    \ examples of logical expressions assuming that `x` equals 5 and `y` equals 10:\n\
    \n```\n(x > 5) && (y == 10) // false —The second operand is not evaluated\n(x\
    \ > 5) & (y ==10) // false\n(x == 5) || (y == 12) // true — The second operand\
    \ is not evaluated\n(x == 5) | (y ==12) // true\n! (x == 7) // true\n```\n\nThese\
    \ examples are discussed in detail in the following sections.\n\n### The Logical\
    \ AND Operators (&&, &)\n\nNotice in the first example that there is no need to\
    \ evaluate the second operand as long as the first one is evaluated false. This\
    \ is because in an AND operation, if one of the operands is false the whole expression\
    \ becomes false.\n\nThis is called short-circuit evaluation. In the second example,\
    \ however, both operands are evaluated in order to evaluate the whole expression.\
    \ The result is false because the first operand is false and the second is true.\
    \ The result can be true only if both operands are true.\n\n### The Logical OR\
    \ Operators (||, |)\n\nNotice in the third example that there is no need to evaluate\
    \ the second operand as long as the first operand is evaluated true. This is because\
    \ in the `||` operation, if one of the operands is true the whole expression becomes\
    \ true.\n\nThis is also called short-circuit evaluation. In the `|` example, however,\
    \ both operands are evaluated in order to evaluate the whole expression. The first\
    \ operand is true; therefore, the whole expression is evaluated true. The result\
    \ can be true if one operand is true.\n\n### The Logical NOT Operator (!)\n\n\
    In the fifth example the NOT operator operates on one operand:\n\n```\n!(x ==\
    \ 7)\n```\n\nBecause the operand is an expression that is evaluated false (remember\
    \ that `x` equals 5), the result of the operation is true. In other words, `!true`\
    \ is evaluated false and `!false` is evaluated true.\n\nThis expression can also\
    \ be written like this:\n\n```\n(x != 7)\n```\n\n### The Bitwise Operators\n\n\
    The logical operators `&&` and `||` can be used with integral operands, in which\
    \ case they compute the bitwise AND and the bitwise OR of their operands. The\
    \ following examples perform bitwise AND and OR operations on two integers (21\
    \ and 4) and display the results in several formats:\n\n```c\n// Hexadecimal:\n\
    Console.WriteLine(\"0x{0:x}\",0x15 | 0x4); // 0x15\nConsole.WriteLine(\"0x{0:x}\"\
    ,0x15 & 0x4); // 0x4\n\n// Decimal:\nConsole.WriteLine(21 | 4); // 21\nConsole.WriteLine(21\
    \ & 4); // 4\n```\n\n## The if-else Construct\n\nThe if-else construct is used\
    \ to build a conditional statement. It takes the form:\n\n```\nif (condition)\n\
    \    statement(s)_1 // The original result\nelse\n    statement(s)_2 // The alternative\
    \ result\n```\n\nwhere:\n- `condition` is a relational or logical expression.\n\
    - `statement(s)_1` is a statement (or a block of statements) that is executed\
    \ if the `condition` is true.\n- `statement(s)_2` is a statement (or a block of\
    \ statements) that is executed if the `condition` is false.\n\nNotice that what\
    \ goes inside the brackets ([]) is always optional. As you can see in the if-else\
    \ construct, you can use the `if` keyword and the original result to build the\
    \ conditional statement, like this example:\n\n```csharp\nif (salary > 2000)\n\
    \    Console.Write(\"Salary is greater than 2k\");\n```\n\nYou can also add to\
    \ it the optional part to represent the alternative result:\n\n```csharp\nif (salary\
    \ > 2000)\n    Console.Write(\"Salary is greater than 2k\"); // The original result\n\
    else\n    Console.Write(\"Salary is less than or equal to 2k\"); // The alternative\
    \ result\n```\n\nIf you use more than one statement, include the statements inside\
    \ braces ({}). For example:\n\n```csharp\nif (salary > 2000)\n{\n    Console.WriteLine(\"\
    result_1\");\n    Console.WriteLine(\"result_2\");\n}\n```\n\nIt is possible for\
    \ the original result to be another if-else construct. For example, you can test\
    \ the case of the character entered from the keyboard by using the following algorithm:\
    \ If the character is a letter, check whether it is:\n* Lowercase: display the\
    \ appropriate message.\n* Uppercase: display the appropriate message.\n* If the\
    \ character is not a letter, display the appropriate message.\n\n![avatar_medium](images/00005.jpeg)\
    \ ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)\n\n\
    This algorithm is illustrated in the following C# example.\n\nExample 4-2-\n\n\
    ![](images/00060.jpeg)\n\n![](images/00061.jpeg)\n\n## Nested if-else Statements\n\
    \nAlthough the if-else statement is intended for binary choice, it can be expanded\
    \ to handle more complex choices. It is possible to build a whole ladder of nested\
    \ if-else statements as shown in the following form:\n\n```csharp\nif (condition_1)\n\
    \    statement_1;\nelse if (condition_2)\n    statement_2;\nelse if (condition_3)\n\
    \    statement_3;\n...\nelse\n    statement_n;\n```\n\nThe conditions in the ladder\
    \ are evaluated from the top down, and whenever a condition is evaluated as true,\
    \ the corresponding statement is executed and the rest of the construct is skipped.\
    \ If no condition has been satisfied, the last `else` will be brought into action.\n\
    \n## switch Construct\n\nThe switch construct is used to select from multiple\
    \ choices, such as selecting a floor in an elevator, an item from a vending machine,\
    \ or a choice from a menu. In these cases, you select only one of the available\
    \ choices. The switch construct takes the following form:\n\n```csharp\nswitch\
    \ (expression)\n{\n    case constant-1:\n        statement(s)\n        jump-statement\n\
    \    case constant-2:\n        statement(s)\n        jump-statement\n    case\
    \ constant-3:\n        ...\n    ...\n    default:\n        statement(s)\n    \
    \    jump-statement\n}\n```\n\nwhere:\n- `expression` represents a value that\
    \ corresponds to the associated switch choice.\n- `statement(s)` is a statement\
    \ or block of statements that is executed if the corresponding condition is evaluated\
    \ true.\n- `jump-statement` is a branching statement to transfer control outside\
    \ the specific case, such as `break` or `goto` (explained later in the chapter).\n\
    \n- `default` deals with all the other cases. According to the value of the `expression`,\
    \ the control of the program is transferred to one of the case labels and the\
    \ corresponding statement is executed. The cases actually represent the different\
    \ possible values of the `expression`.\n"
