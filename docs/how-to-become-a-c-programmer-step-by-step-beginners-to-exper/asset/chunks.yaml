- fmt: '

    Using `C#`, this book develops the concepts and theory of Building the Program
    Logic and Interfaces analysis, Exceptions, Delegates and Events and other important
    things in a gradual, step-by-step manner, proceeding from concrete examples to
    abstract principles. Standish covers a wide range of Both traditional and contemporary
    software engineering topics.


    This is a handy guide of sorts for any computer science engineering Students,
    `Thinking In C# Programming` is a solution bank for various complex problems related
    to `C#` and `.NET`. It can be used as a reference manual by Computer Science Engineering
    students. this Book also covers all aspects of `B.TECH CS`, `IT`, and `BCA` and
    `MCA`, `BSC IT`.


    The `.NET` platform, a new, exciting programming language was born. `C#` is now
    the language of choice for developing on the `.NET` platform, and Authors has
    even written a majority of the `.NET Framework` using `Visual C#`. `C#` is a modern
    object-oriented language designed and developed from the ground up with a best-of-breed
    mentality, implementing and expanding on the best features and functions found
    in other languages. `Visual C#` combines the power and flexibility of `C++` with
    some of the simplicity of `Visual C#`.


    ## Audience and Organization


    This book is targeted toward those who have little or no programming experience
    or who might be picking up `C#` as a second language. The book has been structured
    and written with a purpose: to get you productive as quickly as possible. I’ve
    used my experiences in writing applications with `C#` and teaching `C#` to create
    a book that I hope cuts through the fluff and teaches you what you need to know.
    All too often, authors fall into the trap of focusing on the technology rather
    than on the practical application of the technology. I’ve worked hard to keep
    this book focused on teaching you practical skills that you can apply immediately
    toward a development project.


    This book is divided into ten Chapters, each of which focuses on a different aspect
    of developing applications with `C#`. These parts generally follow the flow of
    tasks you’ll perform as you begin creating your own programs with `C#`. I recommend
    that you read them in the order in which they appear.


    When the first version of the `C#` programming language was released with the
    `.NET Framework` in 2002, it achieved great success and became the preferred programming
    language for many programmers around the world.


    `C#`, as an evolution of `C++`, simplified many features of `C++` but retained
    the power of `C++`. In fact, the power of `C#` and the easy-to-learn syntax persuaded
    many developers to switch to it from `C++` or `Java`.


    The `C# 2005` version (also referred to as `C# 2.0`) added even more powerful
    features to the language such as generics, partial classes, and much more. The
    new features of `C# 3.0` that were released in the `Technology. Preview` introduced
    programmers to a new era called functional programming. `C# 3.0` focused on bridging
    the gap between programming languages and databases. This book covers all the
    language features from the first version through `C# 3.0`. It also provides you
    with the essentials of using `Visual Studio 2005` to let you enjoy its capabilities
    and save you time by using features such as `IntelliSense`.


    Learning a new programming language can be intimidating. If you’ve never programmed
    before, the act of typing seemingly cryptic text to produce sleek and powerful
    applications probably seems like a black art, and you might wonder how you’ll
    ever learn everything you need to know. The answer is, of course, one step at
    a time.


    The first step to learning a language is the same as that of any other activity:
    building confidence. Programming is part art and part science. Although it might
    seem like magic, it’s more akin to illusion: After you know how things work a
    lot of the mysticism goes away, freeing you to focus on the mechanics necessary
    to produce any given desired result.


    Producing large, commercial solutions is accomplished by way of a series of small
    steps. After you’ve finished creating the project in this hour, you’ll have a
    feel for the overall development process and will have taken the first step toward
    becoming an accomplished programmer. In fact, you will be building upon this `Picture
    Viewer` program in subsequent chapters. By the time you complete this book, you
    will have built a distributable application, complete with resizable screens,
    an intuitive interface including menus and toolbars, and robust code with professional
    error handling. But I’m getting ahead of myself!


    The `C#` programming language is a powerful, relatively new descendant of the
    earlier `C`, `C++`, and `Java` languages. Programming with it is a lot of fun,
    as you’re about to find out in this book. Microsoft created `C#` as a major part
    of its `.NET` initiative.


    For what are probably political reasons, Microsoft turned the specifications for
    the `C#` language over to the `ECMA` (pronounced ek-ma) international standards
    committee in the summer of 2000, long before `.NET` was a reality. In theory,
    any company can come up with its own version of `C#` written to run on any operating
    system, on any machine larger than a calculator.


    Microsoft’s `C# compiler` was the only game in town, and its `Visual Studio .NET`
    suite of tools offered the only way to program `C#` (other than at the `Windows`
    command line).


    It’s now possible to write and compile `C#` programs on a variety of Unix-based
    machines using either the `Mono` or `Portable .NET` implementations of `.NET`
    and `C#`:


    After all, as with `C#` Is a powerful raindrops of technology, Programming isn''t
    inherently good or bad—this determination depends entirely on how it is used.
    The same hammer can be used to either build a wall or knock it down.


    –Harry.


