    Indexers-


    Using indexers, you can treat classes as if they were arrays or collections; that
    is, you can access the indexer’s elements by using square brackets ([]). An indexer
    is similar to properties in that it also uses the accessors get and set to express
    its characteristics. The declaration of the indexer takes the form:


    indexer-type this [parameter-type parameter]


    {


    get {};


    set {};


    }


    where:


    *   indexer-type is the type of the indexer.


    *   parameter-type is the type of the parameter.


    *   parameter is a parameter or a parameter list.


    The keyword this points to the object to which the indexer belongs. Although the
    indexer doesn’t have a name, it is recognized by its signature (types and number
    of parameters).


    It is possible to modify the indexer declaration with the keyword new or one of
    the access modifiers.


