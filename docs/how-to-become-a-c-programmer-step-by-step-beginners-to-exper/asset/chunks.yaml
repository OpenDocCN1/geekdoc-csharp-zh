    # 第 1 章

    ## ( C# 与 .NET 简介 )


    ### 简介


    ### C# 面向对象语言


    ### 简介


    `C# 2005` 版本（也称为 `C# 2.0`）为语言添加了更强大的特性，如泛型、部分类等。在 `Technology. Preview` 中发布的 `C#
    3.0` 新功能将程序员带入了一个名为“函数式编程”的新时代。


    `C#` 从零开始作为一种 `OOP` 语言构建。这意味着你不能不先构建类，并将字段和方法（类成员）放在类中。`C#` 是 `C++` 的演进，解决了长期困扰
    `C++` 程序员的问题。例如，它消除了导致程序员浪费时间和精力解决内存泄漏等问题的指针。


    它还消除了多重继承，这带来的问题多于好处。此外，随 `C# 2005` 发布的泛型功能比 `C++` 模板有用且易用。


    ### .NET 框架


    `.NET Framework` 由微软于 2002 年推出，是一个用于在互联网时代构建和运行分布式应用程序的编程平台和工具。它还包含一个面向对象的类库和一组重用类型（类型是数据的表示），能够完成许多编程任务，如文件访问、字符串处理和数据库管理。类库按模块（称为命名空间）分类，并包含支持各种应用程序的类型，例如：


    *   控制台应用程序。

    *   Windows 窗体。

    *   ASP.NET 应用程序。

    *   XML Web 服务。

    *   Windows 服务。

    *   SQL Server 应用程序。

    *   小型设备应用程序。


    `C#` 是微软开发的 `.NET` 语言之一。其他使用 `.NET` 的语言还有 `Visual Basic .NET`、`J#` 和 `托管 C++`，此外还有其他公司开发的语言。

