    In order to create an object of the type `Point`, use a statement like this:


    ```cpp

    Point myPoint = new Point();

    ```


    This statement initializes all the members of the object (`x` and `y` in this
    case) with the value `0`. This is called definite assignment of the struct. We’ll
    talk more about structs later in this book.


    ## Reference Types


    A reference-type variable does not contain the data itself; it actually contains
    the memory address of the data. It is similar to pointers and references in `C++`,
    but much easier to use.


    The variable itself lives on the stack, like a value-type variable, but points
    to its data that lives on the heap.


    Note: The heap is the region in memory that stores the data pointed to by the
    reference-type variables.


    ### The C# Reference Types


    The following are the C# reference types:

    - `Class`

    - `Interface`

    - `Delegate`

    - `Object`

    - `String`


    It is possible to convert value types to reference types by using boxing and from
    reference types to value types by using unboxing.


    ## Boxing and Unboxing


    The boxing operation is accomplished by assigning the value-type variable to a
    variable of the type `object`:


    ```cpp

    int myInt = 123;

    object myObj = myInt; // boxing

    ```


    This means moving the value `123` from the stack to the heap, as shown in the
    following figures.


    ![](images/00027.jpeg)

    ![](images/00028.jpeg)


    In order to convert the variable back to a value type you use the unboxing operation,
    which is performed by casting the reference-type variable with `(int)`. The following
    statement assigns the value pointed to by `myObj` to a new value-type variable,
    `yourInt`:


    ```cpp

    yourInt = (int) myObj; // unboxing

    ```


    This statement creates a new value-type variable that contains the same value,
    `123`, as shown in Figure 3-3.


    ![](images/00029.jpeg)


    Notice that you can use the same variable, `myInt`, instead of using a third variable,
    `yourInt`, in the unboxing operation.


    Note: Boxing is necessary in cases when you would like to use value types in collections
    (explained in Chapter 11) where items of the collection are of the type `object`.
    Unboxing is also used in accessing the value-type contents of an object.


    The following example demonstrates boxing and unboxing.


    ![](images/00030.jpeg)


    In this example, we added the value `321` to the original value during the boxing
    operation. It is important to notice that this did not change the value of the
    original variable, `myInt`, which contained the same value after the unboxing
    operation.


    The variable `yourInt`, however, contains the value that was pointed to by the
    reference variable. You can see these values in the example output.


    Output:

    ![](images/00031.jpeg)


    Although the concept of reference-type variables is the same as pointers in `C++`,
    reference types save you the trouble of handling pointer operations, especially
    deleting the memory that was allocated to pointers. These operations are done
    for you in the background.


    ## Simple Data Types


    The following table shows the C# simple data types along with the range and size
    in bytes for each type. Simple types include integral (`int`), floating point
    (`float`), Boolean (`bool`), and character (`char`).


    These types are called “simple” to distinguish them from user-defined types such
    as `structs` and `enums`. All simple types are, of course, value types.


    ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)


    Table 3-4: Simple data types

    ![](images/00032.jpeg)


    Notice that there is no implicit conversion from the type `char` to any integral
    type as in `C++`. In other words, `false` does not equal zero and `true` is not
    a non-zero value.


    The following are examples of using simple types in declarations:


    ```cpp

    int myInt;

    char aChar;

    long theLongNumber;

    ```


    As mentioned before, you can also declare a variable and assign it a value at
    the same time:


    ```cpp

    byte myBite = 5;

    short myShort = -223;

    char myChar = ''A'';

    ```


    ## Creating and Manipulating Arithmetic Expressions


    In the following sections, you will learn how to create and manipulate arithmetic
    expressions. You can build arithmetic expressions by using literals (data values),
    variables, and arithmetic operators. Expressions can be assigned to variables.


    ### 3-6-1 The Basic Arithmetic Operators (+, –, *, /)


    Simple arithmetic expressions are built by using operators such as `+`, `–`, `*`,
    and `/`, which are used for addition, subtraction, multiplication, and division.


    In general, when an expression is evaluated, multiplication and division are evaluated
    before addition and subtraction because they have higher precedence. Consider
    the following expression:


    ```

    6 + 4 * 5

    ```


    In this expression, the part `4 * 5` is evaluated first, and then its value is
    added to `6`. The result would be `26`. You can use parentheses to change the
    precedence of operations:


    ```cpp

    (6 + 4) * 5

    ```


    In this expression, the addition is evaluated first because the parentheses higher
    precedence than the other operators. The addition evaluates to `10`, which is
    multiplied by `5`, giving the result `50`.


    It is possible to assign an expression to a variable, as in this example:


    ```cpp

    x = y * (2/3) – 1.0;

    ```


    These operators are called binary operators because they operate on two operands.


    ### The Modulus Operator (%)


    The modulus operator `%` is used to get the remainder of division.


    For example, the following expression:


    ```

    5 % 2

    ```


    gives the result `1`, while the expression:


    ```

    4 % 2

    ```


    gives the result `0`.


    Note: The modulus operator in C# can be applied to all numeric types. For example,
    the expression `5.2` evaluates to `0`.


    ### Assignment Operators


    The assignment operator is used for assigning a value, expression, or variable
    to a variable. The following table shows the use of assignment operators combined
    with arithmetic operators.


    ![](images/00033.jpeg)


    As you can see in the above table, each example in the Example Statement column
    is equivalent to a statement in the Equivalent Statement column. For example,
    the statement:


    ```cpp

    x *= y;

    ```

    means multiply `x` by `y` and store the result in `x`.


    The statement:

    ```cpp

    x %= y;

    ```

    means divide `x` by `y` and store the remainder of the division in `y`.


    ### Increment and Decrement Operators (++, --)


    Increment and decrement operators are classified as unary or primary arithmetic
    operators because they have one operand. Consider the following statements:


    ```cpp

    x++;

    y--;

    ```


    The first statement increments the value of `x` by `1`, while the second decrements
    the value of `y` by `1`.


    The value of the expression that contains this kind of operator changes according
    to whether `++` or `--` comes before (prefix) or after (postfix) the variable.


    For example, the expression:


    ```cpp

    --y + x

    ```

    Means decrement `y` before adding its value to `x`.


    The expression:


    ```cpp

    y-- + x

    ```

    Means decrement `y` after adding its value to `x`.


    ![](images/00034.jpeg)


    ### Operator Associativity


    Associativity is the direction in which an expression is evaluated. Consider an
    expression that contains two operators of the same precedence, like the following:


    ```

    80 / 4 * 2

    ```


    How can the compiler decide which operator to apply first? If you apply the division
    first (left-to-right associativity), the result would be evaluated as follows:


    ```

    (80 / 4) * 2 = 40

    ```


    But if you apply the multiplication first (right-to-left associativity), the result
    would be evaluated as follows:


    ```

    80 / (4 * 2) = 10

    ```


    It is clear that the direction of evaluation changes the result. As you can see
    in this example, using parentheses changes the order in which expressions are
    evaluated. But if you leave out the parentheses, the rule for the compiler is
    to evaluate operators by using left-to-right associativity.


    In this case, the expression `80 / 4 * 2` is evaluated as `40`. In general, binary
    arithmetic operators use left-to-right associativity, while primary and unary
    arithmetic operators use right-to-left associativity.

