    Windows, such as Mono.


    Mono can run on operating systems such as Mac OS X and Linux. There is also a
    subset of the .NET Framework called the Microsoft .NET Compact Framework that
    can be used with small devices and smart phones.


    MSIL and JIT-


    When you compile a C# program, the compilation does not directly generate native
    (operating system-specific) code;


    it generates code written in Microsoft Intermediate Language (MSIL or IL). The
    MSIL code is translated to native code at run time. This compilation phase is
    called the just-in-time (JIT) compilation.


    Metadata-


    During compilation, the CLR creates information about your application. It includes
    class names, field names, method names, and method parameters. This information
    is called metadata, which means information on data.


    Metadata is used by the CLR and the Jitter (JIT compiler) for many purposes such
    as debugging and type checking. You can also use metadata to create instances
    of the classes and use class members regardless of the Source code language.


    Assemblies-


    The program compilation results in creating an assembly, which can be either an
    .exe file (executable) or a .dll file (library).


    Garbage Collection-


    One of the most important benefits of using managed applications is the use of
    the garbage collector (GC). The role of CLR does not end after compiling the IL
    code into native code. In fact, the CLR is responsible for Managing memory during
    the code execution.


    It assures that the memory used by the program is totally freed up after the program
    exits. With unmanaged applications, programmers are responsible for managing the
    Memory and resolving problems that might occur if a block of memory is left allocated
    after the program ends.


    ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg) ![avatar_medium](images/00005.jpeg)


    Putting Things Together:


    The .NET applications are handled according to the following procedure:


    1.  You start by coding your application using one of the .NET-compliant languages
    such as C#.


    2.  The C# code is compiled into MSIL and stored in an assembly. The C# code might
    be split across many source files, which are linked together during the compilation.


    3.  On executing the code, it is compiled into an operating system specific (native)
    code by using the JIT compiler.


    4.  The application is executed under control of the CLR. When the pro -gram exits,
    the GC frees up the allocated memory.


    ILASM and ILDASM:


    With Visual Studio, you have two programs for IL compilation:


    *   ilasm.exe: Used to compile programs written in IL and convert them to .exe
    or .dll files.


    *   ildasm.exe: Does the opposite process as it reads an .exe or .dll file and
    retrieves the IL file, which contains the manifest and the metadata.


    *   In the next section, we use ildasm.exe to take a look at the contents of the
    assembly and get an idea about its properties.


    ![avatar_medium](images/00006.jpeg) ![avatar_medium](images/00006.jpeg) ![avatar_medium](images/00006.jpeg)


    A First Look at the C# Code:


    In the following sections we take a look at the C# code and the various ways to
    compile it and execute it without going into the details of the syntax.


    The C# Code-


    The following code is an example of a C# class that can be compiled as a .dll
    file:


    // EmployeeDLL.cs


    public class Employee


    {


    // Fields:


    public string name;


    public string id;


    // Methods:


    public double


    id


    name


    CalculateSalary(int hoursWorked, double rate)


    {


    double salary;


    salary = rate * hoursWorked;


    return salary;


    }


    }


    Salary


    This example contains the Employee class, which contains the following data fields
    of an employee:


    _ id


    _ name


    The code also contains the method CalculateSalary. This method takes two parameters,
    hoursWorked (the number of hours worked) and rate (the payment per hour), and
    is used to calculate and return salary (the gross payment of the employee).


    The class can, of course, contain other details, but for the sake of the example
    this would be enough. The file that contains this class (its name is written as
    a comment in the first line: EmployeeDLL.cs) can be compiled to a .dll. Then you
    can take a peek at this .dll file by using ildasm.exe. The output is shown in
    the following figure.


    ![](images/00007.jpeg)


    In Figure 1-1, the contents of the Employee class (the fields and the method definition)
    are shown. Programmers who want to use this class would have enough information
    without seeing the source code.


    The IL Code-


    If you click on any of the class members, such as the method CalculateSalary,
    you see its IL code, as shown in Figure 1-2.


    ![](images/00008.jpeg)


    Ignore the text between the curly braces and examine the code preceded by a dot
    (this is called a directive). You will notice that the definition of the method
    CalculateSalary gives all the information you need to use this method: CalculateSalary(int32
    hoursWorked, float64 rate)


    The beauty of the assembly is that it is self describing. Therefore, you can use
    this library file as a component in another program without looking at the source
    code. (The details of the method parameters will be discussed in the next chapters.)


    The Manifest-


    By double-clicking the MANIFEST icon in Figure 1-1, you can see the content of
    the manifest, as shown in Figure 1-3\. Again, ignore the code between the curly
    braces and examine only the directives. The manifest


    Contains important information about the assembly, such as the external class
    library mscorlib, which is the core library that all .NET programs use: .assembly
    extern mscorlib It also contains the name of the file, the version, and other
    important information.


    ![](images/00009.jpeg)


    Using the Library File-


    To get the whole picture, let’s write some code to use this library. The followingC#
    program contains the source code needed to call the method CalculateSalary and
    display the result for one employee.


    // MyProgram.cs


    using System;


    class MyClass


    {


    static void Main()


    {


    Employee emp = new Employee();


    emp.name = “John Martin Smith”;


    emp.id = “ABC123";


    double weeklyPayment = emp.CalculateSalary(40, 55);


    Console.WriteLine(“ID: {0}, Name: {1}”, emp.id, emp.name);


    Console.WriteLine(“Payment= {0}”, weeklyPayment);


    }             


    }


    When you compile this code you only need to link it to the .dll file. This way
    you are able to call the method CalculateSalary like this: CalculateSalary(40,
    55) This method uses two parameters. The first is the number of worked hours (40)
    and the second is the rate of the employee (55).


    The details of the C#55) code will be explained in detail later. Let us now examine
    the manifest of this file. The file is compiled first to generate the executable
    file (MyProgram.exe), and then ILDASM is used to examine it. The manifest of MyProgram.exe
    is shown in Figure 1-4\.


    ![avatar_medium](images/00006.jpeg) ![avatar_medium](images/00006.jpeg) ![avatar_medium](images/00006.jpeg)


    ![](images/00010.jpeg)


    Examine the directives in this file and pay attention to the highlighted one:
    .assembly extern employeeDLL


    This directive tells you that the .dll file (employeeDLL.dll) was linked to the
    source code during compilation.


    How to Get a Free C# Compiler-


    You can get the command-line compiler (csc.exe) from the site -[http://msdn.microsoft.com/netframework/downloads/updates/default.asx](http://msdn.microsoft.com/netframework/downloads/updates/default.asx).
    Download the redistributable package of the .NET Framework, which includes the
    compiler and the .NET Framework with C# 2005 syntax'
