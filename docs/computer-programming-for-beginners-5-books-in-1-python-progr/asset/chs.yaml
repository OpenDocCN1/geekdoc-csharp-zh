  \n### Operators\n\n运算符仅仅是用于执行操作的符号。操作可以是算术的、逻辑的、位运算等的。让我们探索一些 Arduino 运算符：\n\n####\
  \ Arithmetic Operators（算术运算符）\n\n正如我们上面看到的，它们用于执行算术操作。示例：\n\n```\nvoid loop () {\n\
  int k = 8,l = 2, m;\nm = k + l;\nm = k - l;\nm = k * l;\nm = k / l;\nm = k % l;\n\
  }\n```\n\n#### Boolean Operators（布尔运算符）\n\nArduino 支持的各种布尔运算符包括 `&&`（与）、`||`（或）和\
  \ `!`（非）。示例：\n\n```\nvoid loop () {\n  int k = 8,l = 2\n  bool m = false;\n  if((k\
  \ > l)&& (l < k)) {\n    m = true;\n  } else {\n    m = false;\n  }\n  if((k ==\
  \ l)|| (l < k)) {\n    m = true;\n  } else {\n    m = false;\n  }\n  if( !(k ==\
  \ l)&& (l < k)) {\n    m = true;\n  } else {\n    m = false;\n  }\n}\n```\n\n\n\n\
  在决策制定中，程序员指定了要通过程序进行评估和测试的条件。程序员指定了当条件为真时执行的语句。他或她也可能指定当条件为假时执行的语句。让我们探索各种决策语句。\n\
  \n### If 语句\n\n表达式被添加到括号内，后面跟着一个或多个语句。如果表达式为真，则执行该语句（或语句）；否则，什么都不会发生。\n\n**语法：**\n\
  \n```\nif (your_expression)\n  statement;\n```\n\n对于多个语句，语法如下：\n\n```\nif (your_expression)\
  \ {\n  statement(s);\n}\n```\n\n**示例：**\n\n```cpp\nint K = 4 ;\nint L = 8;\n\nvoid\
  \ setup () {\n\n}\n\nvoid loop () {\n  if (K > L)\n    A++;\n  If ( ( K < L ) &&\
  \ ( L != 0 ))  {\n    K += L;\n    L--;\n  }\n}\n```\n\n我们定义了两个全局变量 `K` 和 `L`。在第一个\
  \ `if` 条件中，如果条件为真，我们只需要运行单个语句，因此我们没有使用大括号来表示函数体。在第二个 `if` 条件中，如果条件为真，我们需要运行多个语句，因此我们将它们封装在大括号（`{}`）内。\n\
  \n#### J*J*J*J*J*************\n\n##### 将传感器值映射到特定频率\n\n声明一个名为 `pitch` 的变量；存储在 `pitch`\
  \ 变量中的值从 `sensorValue` 映射。定义 `sensorLow` 和 `sensorHigh` 为接收到的值的边界，同时你可以将 50 到 4000\
  \ 作为起始输出。\n\n#### 播放频率\n\n接要做的事情是调用 `tone()` 函数使其能够播放声音。`tone()` 函数接受三个参数：代表声音的引脚、要播放的频率，以及播放音符的周期。最后，你可以调用\
  \ `delay()` 函数创建一个 10 毫秒的延迟，为声音的播放留出时间。\n\n当你开启 Arduino 时，会有 5 秒钟的间隔来调整传感器。为了实现这一点，请确保你通过改变照射在光敏电阻上的光强度在光敏电阻周围揉搓双手。让你的手动作靠近仪器；这将改善校准。\n\
  \n5 秒后，校准结束，Arduino LED 熄灭。接下来你应该听到的是来自压电蜂的噪声。当照射传感器的光强度变化时，压电蜂的频率也会发生变化。\n\n![](img/00050.jpg)\n\
  \n`map()` 函数定义了 `pitch` 的范围，你可以尝试更改频率以确定最适合你音乐风格的频率。\n\n`tone()` 函数的工作方式与 `analogWrite()`\
  \ 函数中的 PWM 相同，但它有一个主要区别。`analogWrite()` 有固定的频率。然而，使用 `tone()` 时，当你改变速率时会持续发送脉冲。\n\
  \n`tone()` 函数允许在脉冲压电元件或扬声器时定义频率。如果你将传感器应用到分压器电路中，将无法获得完整范围的值。然而，校准传感器允许你将输入映射到特定区域。\n\
  \n### 输入、输出和传感器\n\n![](img/00167.jpg)\n\n正如我们上面提到的，Arduino 传感器的用途和功能多种多化。Arduino\
  \ 的设计包含了多种类型的传感器，这些传感器反过来可以应用于 C 编程语言。Arduino 配备了处理这些传感器的能力，可以在 Arduino 或其他网站廉价地购买到它们。Arduino\
  \ 传感器的示例包括：\n\n* 超声波模块\n* IR 红外避障传感器模块\n* 土壤湿度计检测模块土壤湿度传感器\n* 麦克风传感器\n* 数字气压传感器板\n\
  * 光敏传感器模块光检测光\n* 数字热传感器模块温度传感器模块\n* 旋转编码器模块砖传感器开发板\n* MQ-2 传感器模块烟雾、甲烷、丁烷检测\n* 运动传感器模块振动开关报警\n\
  * 湿度雨检测传感器模块\n* 速度传感器模块\n* IR 红外火焰检测传感器模块\n* 加速度模块\n* Wi-Fi 模块\n\n虽然还有很多，但这些只是其中。有些传感器比其他更容易与不同的\
  \ Arduino 单元连接，因此请注意哪种最适合你的 Arduino。\n\n**你将在本章中学到：**\n\n* 信号简介\n* 使用传感器\n* 理解 PWM\n\
  \n**本章你需要：**\n\n* Arduino UNO 板\n* 多用表\n* 传感器\n* 电阻\n\n信号有两种类型：\n\n![](img/00159.jpg)\n\
  ![](img/00128.jpg)\n\n### 为什么模拟信号很重要？\n\n像某些传感器的电压这样的模拟输入是某些因素变化的结果。例如：\n\n光敏电阻：改变光量。\n\
  ![](img/0073.jpg)\n\n我们可以用万用表测量电压。\n![](img/0088.jpg)\n\n我们可以用此来测量任何因素，如湿度、功率。在\
  \ Arduino UNO (ATMega328) 上，有六个从 `A0` 到 `A5` 的输入引脚，它们可以测量 4.8 毫伏到 5 特。\n![](img/0003.jpg)\n\
  \n**传感器如何产生模拟信号？**\n\n以温度传感器为例：温度传感器包含一种对温度非常敏感的硅，受温度影响。它具有：\n\n1. `Vin` (2v 到 5v)。\n\
  2. `Vout` 信号脚。\n3. `GND` 接地脚。\n![](img/027.jpg)\n\n**此示例需要的组件：**\n\n* 多用表\n* 1.5V\
  \ 电池\n* 温度传感器 (TMP35 或 LM35)\n\n**步骤：**\n\n* 将两个电池一起放入电池盒中，你会得到 3 伏。\n![](img/021.jpg)[](Images/083.jpg)\n\
  * 将电池盒的红线连接到传感器的 `Vin` 脚。\n* 将电池盒的黑线连接到传感器的 `GND` 脚。\n* 将万用表调至电压模式所示：\n![](img/0094.jpg)\n\
  * 将黑探针连接到 `GND` 脚，红探针连接到 `Vin` 脚。\n* 注意万用表的读数。应该是 0.76 伏。\n* 现在将手放在传感器上（这会升高温度），并记录万用表的读数。万用表的读数将上升并变得。\n\
  ![](img/134.jpg)\n\n与任何传感器一样，它取决于环境因素并改变其内部电阻，从而改变可以被模拟传感器测量的输出电压。\n\n#### 示例 4：使用电位器控制光量（接线）\n\
  \n**示例组件：**\n\n* Arduino 板\n* 面板\n* LED\n* 560 欧姆电阻\n* 10 k 欧姆电位器\n* 导线\n\n如所示连接组件：\n\
  ![](img/120.jpg)\n\n#### 示例 4：使用电位器控制光量（编码）\n\n在 Arduino IDE 中创建一个新文件并编写以下代码：\n\n\
  ```cpp\nconst int sensorPin = A0;\nconst int LedPin = 13;\nint sensorValue;\n\n\
  void setup () {\n  PinMode (LedPin, OUTPUT);\n}\n\nvoid loop() {\n  sensorValue\
  \ = analogRead(sensorPin);\n  digitalWrite(LedPin, HIGH);\n  delay(sensorValue);\n\
  \  digitalWrite(LedPin, LOW);\n  delay(sensorValue);\n}\n```\n\n`analogRead(pin\
  \ number)`。该函数读取模拟信号的电压（微控制器可以测量 4.8 毫伏到 5 伏的电压），它还将将这些值转换为 0 到 1024 的数字值。这种转换被称为模拟数字转换\
  \ (ADC)。\n\n\n\n\n# 例如：\n\n如果输入到 `A0` 的电压等于以下值：\n\n- `4.8millivolt` = 数字 1\n- `49millivolt`\
  \ = 数字 10\n- `480millivot` = 数字 100\n- `1volt` = 数字 208.33\n- `2volt` = 数字 416.66\n\
  - `5volt` = 数字 1024\n\n```\nsensorValue = analogRead(sensorPin);\n```\n\n- ● 在此语句中，微控制器将传感器读取的值存储在\
  \ `sensorValue` 变量中，然后微控制器将根据与该变量（`sensorValue`）相等的时间来开启或关闭 LED。\n- ● 在此示例中，我们使用了一个可变电阻，因此我们可以更改电阻值。\n\
  \n![](img/00033.jpg)\n\n## 示例 5：光敏电阻作为光传感器（元件）\n\n- Arduino UNO 开发板\n- 面包板\n- LED\n\
  - 560 欧电阻\n- 光敏电阻\n- 线缆\n\n## 示例 5：光敏电阻作为光传感器（接线）\n\n![](img/00131.jpg)\n\n- ● 如图所示连接元件：\n\
  \n## 示例 5：光敏电阻作为光传感器（编码）\n\n```cpp\n// 从 Arduino IDE 中选择新文件 \nconst int lightPin\
  \ = A0;\nconst int ledPin = 9;\nint lightLevel;\n\nvoid setup ()\n{\n  pinMode(ledPin,\
  \ OUTPUT);\n}\n\nvoid loop ()\n{\n  lightLevel = analogRead(lightPin);\n  lightLevel\
  \ = map(lightLevel, 0, 900, 0 , 255)\n  lightLevel = constrain(lightLevel, 0, 255);\n\
  \  analogWrite(ledPin, lightLevel);\n}\n```\n\n- ● 现在你可以将此代码上传到你的 Arduino 开发板上，观察光线照射在光敏电阻上\
  \ LED 会发生什么变化。然后将手放在光敏电阻上，观察 LED 会发生什么变化。\n- ● `analogWrite(引脚编号, 值);`\n\n此函数产生模拟输出，该函数可以应用于所有带有脉宽调制\
  \ (PWM) 的引脚。它们是 `pin 3`、`pin 5`、`pin 6`、`pin 9`、`pin 10` 和 `pin 11`（带有 `~` 符号的任何引脚）。\n\
  \n![](img/00148.jpg)\n![](img/00162.jpg)\n\n## 如何使用它？\n\n许多元件处理不同的电压值。例如，当你给 LED\
  \  3 伏时，你会得到非常微的光，如果你将电压升高 4 伏，你会发现光变亮，以此此类推。如果你使用电机，例如，增加电压时电机的速度会更快。\n\n## 示例\
  \ 6：带 PWM 的 LED（接线）\n\n![](img/00074.jpg)\n\n如图所示连接元件：\n\n## 示例 6：带 PWM 的 LED（编码）\n\
  \n```cpp\n// 打开 Arduino IDE 并选择新文件然后编写以下代码：\nconst int ledPin = 11;\nint i = 0;\n\
  \nvoid setup( )\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n  for (i =\
  \ 0; i < 255; i++) // LED 会变亮 \n  {\n    analogWrite(ledPin, i);\n    delay(10);\n\
  \  }\n  for (i = 255; i > 0; i--)      //LED 会变暗 \n  {\n    analogWrite(ledPin,\
  \ i);\n    delay(10);\n  }\n}\n```\n\n- `for (i = 0; i < 255; i++)`\n- `I = 0` →\
  \ 初始值\n- `I < 255` → 设置你的条件\n- `I++` → 在此示例中的迭代器将加 1\n- `I++` → `I = I +1`\n\n##\
  \ 问题\n\n为了检查理解情况，请回答以下问题。\n\n1. 描述数字信号和模拟信号之间的区别。\n2. 什么是脉宽调制？\n3. 设计一个电路按顺序开启/关闭五个\
  \ LED。\n4. 编写示例 3 的代码。\n\n## 与 Arduino 接口\n\n![](img/00101.jpg)\n\n你选择如何与计算机接口取决于你可用的电缆类型。记住，每个\
  \ Arduino 都可以通过 USB 端口连接到计算机。将 Arduino 连接到计算机取决于你使用的编程语言以及你需要包含的插件，以便 Arduino 与你的计算机顺畅地交互。\n\
  \n### 你将在本章中学习到：\n- 如何将 Arduino 连接到计算机\n\n### 本章你需要：\n- Arduino UNO 开发板\n- 面包板\n\
  - 传感器\n- 线缆\n\n### FTDI 芯片\n\n- ● 所有的 Arduino 板都具有通过 USB 端口直接与计算机发送接收数据的能力，Mini\
  \ 和 Lilypad Arduino 板除外。但你也可以通过 FTDI 接口将板连接到计算机，FTDI 是用于 Arduino 或任何微控制器与计算机之间交换数据的小芯片。\n\
  \n![](img/0023.jpg)\n\n- ● 在最后的示例中，我们使用串口显示温度。\n- ● 在本章，串口接口将发送数值。\n- ● 转换后我们可以获取温度。\n\
  \n## 示例 7：带串口的温度传感器（元件）\n\n- Arduino 开发板\n- 面包板\n- TMP35 传感器\n- USB 线\n\n## 示例 7：带串口的温度传感器（接线）\n\
  \n![](img/0147.jpg)\n\n## 示例 7：带串口的温度传感器（编码）\n\n```cpp\nconst int sensorPin = A0;\n\
  int reading;\nfloat voltage;\nfloat temperatureC;\n\nvoid setup ()\n{\n  Serial.begin(9600);\n\
  }\n\nvoid loop ()\n{\n  reading = analogRead(sensorPin);\n  voltage = reading *\
  \ 5/1024;\n  temperatureC = (voltage - 0.5) *100;\n  Serial.print(\"Temperature\
  \ is: \");\n  Serial.print(temperatureC);\n  Serial.println(\"degree C\");\n  delay(1000);\n\
  }\n```\n\n- 将代码上传到 Arduino 后，点击串口监视器。\n![](img/0022.jpg)\n- ● 现在尝试以下：\n- 将光照射在光敏电阻上。\n\
  - 用任何衣服遮住光敏电阻。\n![](img/0122.jpg)\n- 你将看到摄氏度温度。\n![](img/0168.jpg)\n- `-` 符号并不代表负数，它是临时错误。\n\
  \n## 示例 7：带串口的温度传感器（解释）\n\n- 我们代码中的两个变量（`voltage`、`temperatureC`）定义为 float 而不是 int，因为结果是浮点数。\n\
  - `reading = analogRead(sensorPin);` 用于记录 A0 的模拟输入。\n- 正如之前提到的，微控制器转换从 0 到 1024\
  \ 的数字，我们使用了 `voltage = reading * 5/1024;`。\n- `Serial.print(voltage)` 用于打印电压。\n\
  - `temperatureC = (voltage - 0.5) *100;` 用于将电压转换为温度度，然后打印“degree C”。\n- `delay(1000);`\
  \ 是最后一行代码，让微控制器等待一秒后再次将电压和温度值发送到计算机。\n\n\n\n\n\n- 用手遮住光敏电阻，确保没有光照射在上面\n- ● 这是你将看到的内容：\n\
  \n![](img/00052.jpg)\n\n- 暗（Dim）→ 光线较小\n- 黑暗（Dark）→ 无光\n- 明亮（Light）→ 有中程度的光\n- 强光（Bright\
  \ light）→ 光亮度很高\n\n## 示例 9：使用电脑控制 LED 的开启/关闭（组件）\n\n- Arduino UNO 板板\n- 面板\n- LED\n\
  - 560 欧姆电阻\n- 导线\n- 在此示例中，我们将使用电脑来控制 LED 而不是开关，Arduino 将通过 USB 端口使用串口监视器接收命令\n\n\
  ## 示例 9：使用电脑控制 LED 的开启/关闭（接线）\n\n![](img/00047.jpg)\n\n## 示例 9：使用电脑控制 LED 的开启/关闭（编码）\n\
  \n```cpp\nint ledPin=13;\n\nint value;\n\nvoid setup ()\n{\n  Serial.begin(9600);\n\
  \  pinMode(ledPin,OUTPUT);\n}\n\nvoid loop ()\n{\n  value = Serial.read();\n  if\
  \ (value == '1') {\n    digitalWrite(ledPin,HIGH);\n  }\n  else if (value == '0')\
  \ {\n    digitalWrite(ledPin,LOW);\n  }\n}\n```\n\n将代码上传到 Arduino 后，点击串口监视器图标，你会发现一个搜索栏。在上面输入“1”并点击发送。然后输入“0”，观察\
  \ LED 会发生什么。\n\n![](img/00186.jpg)\n![](img/00192.jpg)\n\n- 在此示例中，我们使用了 `Serial.Read()`\
  \ 指令来读取从 USB USB 发送到 Arduino 的数据，同时我们添加了变量 `value` 来存储数据。\n- 接着，我们使用了 if else 语句。\n\
  - 如果 `value == 1`，微控制器将开启 LED\n- 如果 `value == 0`，微控制器将关闭 LED\n\n## 问题\n\n1. 你如何让\
  \ Arduino 与电脑通信？\n2. 什么是 FTDI 芯片？你如何使用它？\n3. 设计一个电路将 Arduino 与温度传感器和 LED 连接起来。\n\
  4. 编写示例 3 的代码并根据温度传感器的读取值控制 LED。\n\n## 复习（回顾）\n\n在 Arduino 系列的上一个章节中，我们涵盖了许多帮助你作为\
  \ Arduino 程序员起步的内容。虽然我们不会花费很长的时间，但我们将花一两分钟时间回顾许多这些概念，以防这是你阅读的该系列中的第一本书。到本章结束时，如果你还没有掌握，你将觉得自己已经牢牢掌握了所有与\
  \ Arduino 的基础知识及其相关的底层概念。如果你已经掌握了，可以随时跳到第二章，从那里我们开始拆解更多关于 Arduino 微处理器的信息。\n\n###\
  \ Arduino\n\n我们要讨论的第一点是什么是 Arduino。Arduino 是一种最初在意大利开发的微处理器板。。Arduino 的硬件全都是开源的，并且围绕它形成了一个庞大的开发者社区。因此，它已成为一种极其受欢迎的电路板，被用于全球范围内大量的制作项目。这些制作项目跨越了各种行业和概念。\n\
  \nArduino 的目标是为人们提供一种简单的方法来理解和摆弄计算基础以及基于计算机的硬件，而无需支付普通计算设备的昂贵成本。\n\n### Arduino\
  \ 的结构\n\nArduino 具有极强的扩展性，许多不同的硬件模块可以与你的 Arduino 板配合使用。这些外设备连接到 Arduino，并通过所谓的“引脚”（pins）向\
  \ Arduino 发送接收数据。引脚有两种：数字和模拟。\n\n这些引脚通过运行在 Arduino 上的程序进行控制。这些程序被称为“sketch”（草图）。虽然\
  \ Arduino 程序可以用许多不同的语言编写，但本书特别关注编写 Arduino 代码最常用的语言—— C 语言。\n\nC 语言在历史上是一种非常流行的编程语言，它在实现\
  \ Arduino 提出的非常具体的硬件需求方面也极其出色。Arduino 本身并没有多少处理能力，因此，一种足够接近硬件层面的语言，以便它能够非常轻松地处理\
  \ Arduino 所要求的极底层数据是至关重要的，因为 Arduino 需要的是不消耗太多处理能力或内存的程序。\n\n通过连接到 Arduino 的模块和配件，人们可以完成许多不同的事情。这就是为什么\
  \ Arduino 是制作爱好者的梦想；你可以以非常低的价格完成很多事情。\n\n### C 语言编程基础\n\n为了正确地使用 Arduino，你需要对 C\
  \ 语言编程有一定的了解。正如我所说的，我们不会在本章中花费很长的时间涵盖所有内容，但为了后世考虑，有一些基本内容是我们认为必须涵盖的。我们将讨论构建 C 语言编程的基础概念，这样你就可以非常从容地使用它，并在探索\
  \ Arduino 编程时感到有些自然。\n\n#### 变量与值的操作\n\n对于计算机来说，值（Values）是指任何可以进行数学运算的对象。如果你对计算机稍有了解，你就会意识到这几乎指的是计算机上的所有内容。计算机中的一切都归结为变量和值。\n\
  \n值是指计算机最终可以进行数学解析的任何内容。值指的是字符、数字或计算机原生理解的二进制等。这些内容都是值，因为它们最终代表了计算机的数学值。\n\n这些值具有在被作为原始数据处理之前的类型。在\
  \ Arduino 编程中，某些类型比其他类型使用得频繁，因为 Arduino 编程关乎效率。尽管如此，我们将花一点时间介绍所有类型，以便熟悉这些类型以及如何有效地使用它们。\n\
  \n- **Byte（字节）**：代表 0 到 255 之间的整数值。它只占用 1 字节数据，在 Arduino 编程中特别有用，因为 Arduino 编程中的许多东西都在\
  \ 0 到 255 的范围内。\n- **Int（整数）**：代表平均大小的整数值，大约为四个字节。它可以容较大的值，但要小心，如果你进入两百万范围，你会发现自己超过了整数变量的限制，这意味着它们将从整数能持有的最小值重新开始。\n\
  - **Float（浮点数）**：代表浮点数或小数。这些在 Arduino 编程中并不常见，但比双精度数字常见。它们可以保留大约 5 位小数，数值最大可达 32,000。\n\
  - **Double（双精度）**：代表双精度浮点数。在系统内存方面，它们的尺寸是浮点数的两倍，但它们比普通浮点精确得多，并且拥有比浮点更大的整数。\n- **Unsigned\
  \ values（无符号值）**：它们的大小与其对应的值相同（例如无符号整数和浮点），但它们没有负数容量。这意味着它们从 0 开始，可以存储比普通整数和浮点大一倍的正数，但代价是无法存储任何负数。当你处理非负数时，这些是一个很好的起点。\n\
  \n\n\n\n\n### 类型\n\nShort（短整型） - 这些是整数值，大小是整数值的一半，字节（byte）值的两倍。它们可以存储 30,000 级别的数字，但不会超过这个范围。如果你处理的是较小的数字，你可能希望使用它们而不是整数，因为它们更节省内存。\n\
  \nLong（长整型） - 这些是整数值，大小是普通整数的两倍，这意味着它们可以存储高达二十亿的数字，但除了无符号长整数（unsigned longs，大约可以存储\
  \ 45 亿）之外，没有默认类型足够大用以存储更大的数字。\n\nChar（字符型） - 这些代表 ASCII 字符值。它们本质上是计算机可以解析的任何符号，通常用于存储和打印字符。字符可以是任何内容，从数字的符号表示（如‘7’）、字母（如‘a’）或符号（如‘?’）。基本上，如果你的计算机可以打印它，它可能就是一个字符。\n\
  \n到此，我们已经涵盖了 C 和 Arduino 中可使用的所有主要数据类型。不要误解，还有更多，但这些是你目前现在需要理解的主要类型。\n\n### 赋值与数学\n\
  \n给变量赋值非常简单。你通过赋值运算符：`=` 来完成。如下：\n\n```cpp\nint myVariable = 6;\n```\n\n你也可以以这种方式操作变量。\n\
  \n```\nmyVariable = 7;\n```\n\n你可以执行数学运算来创建新值。你通过使用数学运算符（也称为算术运算符）来实现。C 中的算术运算符如下：\n\
  \n```\nb + c\n```\n这当然，这表示加法。\n\n```\nb - c\n```\n这表示减法。\n\n```\nb * c\n```\n这表示乘法。\n\
  \n```\nb / c\n```\n这表示除法。\n\n```\nb % c\n```\n这表示取模。取模是给定除法题的余数。例如，`5 % 2` 结果为 `1`，因为\
  \ `5 / 2 = 2` 且余数为 `1`。\n\n还有一些简写赋值运算符。你可以通过在上述任何运算符后添加等号来更改单个变量的值，如下：\n\n```\n\
  a += 1\n```\n这等同于 `a = a + 1`。其含义在所有其他符号中都是一致的。\n\n`a += 1` 和 `a -= 1` 本身也有简写形式即\
  \ `a++` 或 `a--`。`++` 和 `--` 表示我们将分别将变量增加一或减少一。\n\n到此，我们已经涵盖了 C 的数学运算符，并准备好进入其他概念。\n\
  \n### 数组\n\n有时，你需要一次性存储多个值。当我们开始讨论字符串时，我们会更多地讨论数组，但现在，我们可以涵盖数组的基本要素。我们在之前的书中已经简要提到过它们，所以我们现在并不真的寻求建立它们的百科全书式知识。无论如何，我们将涵盖足够的内容，让你对这些内容进行一个复习。\n\
  \n那么，数组是什么？数组提供了一种方法，让你本质上通过共同的概念将值分组。正如我们所说的，值存储在计算机内存的随机位置。每当需要时，就会在内存中访问它们。那么在这个领域，数组有两个用途。\n\
  \n首先，它们告诉计算机：“嘿，这些东西是相似的，而且它们经常会在同时被引用，所以我们应该把它们放在一起，这样从一个到另一个的获取总时间就会更短。”\n\n然后，作为结果，它们告诉计算机这些值应该在计算机内存中彼此靠近。这确保了从内存中的上一个值到下一个值有最短的移动和检索时间。它还使我们能够执行通常不会执行的操作，例如以过程方式处理内存中的数据片段，正如我们稍后在这里讨论的。\n\
  \n数组本质上建立了一个连续或连接的内存区域，其大小为数组元素个数 `n` 乘以数据类型的大小 `s`。所以，如果一个数据类型占据 4 字节内存，而该数组有四个元素，它就会清理并分配紧相邻的\
  \ 16 字节内存。\n\n然后，可以根据数组的数据类型单独为这些位置赋值。例如，如果你创建了一个整数数组，你可以为该数组中的元素分配整数。\n\n你可以这样声明数组：\n\
  \n```cpp\ndataType arrayName[size];\n```\n\n你也可以通过在声明数组后在括号中包含值（或者至少是部分填充）来填充它。\n\
  \n```cpp\nint myArray[3] = {0, 2, 7};\n```\n\n数组的索引从 `0` 开始计数。你通过引用索引来引用数组的给定元素。所以，如果你想引用数组的第二个元素，你可以这样做：\n\
  \n```\nmyArray[1];\n```\n// 这会是 2，因为索引为 1 的元素是数组中的第 2 个位置。\n\n你可以看到数组实际上相对容易理解，但尽管如果你想成为一名出色的\
  \ Arduino 程序员，它们仍然是你需要工作并尽可能内化的基础概念。在编写 Arduino 图形（sketches）期间，你不可避免地反复遇到这个概念，所以你需要了解它。\n\
  \n### 真值与逻辑\n\n现在是时候讨论允许我们比较值的工具了。这些被称为比较运算符。在 C 以及扩展到 Arduino 中，比较运算符如下：\n\n```\n\
  s == t\n```\n检查 `s` 和 `t` 是否相等。\n\n```\ns < t\n```\n检查 `s] 是否小于 `t`。\n\n```\ns <=\
  \ t\n```\n检查 `s] 是否小于或等于 `t`。\n\n```\ns > t\n```\n检查 `s] 是否大于 `t`。\n\n```\ns >=\
  \ t\n```\n检查 `s] 是否大于或等于 `t`。\n\n```\ns != t\n```\n检查 `s` 是否不等于 `t`。\n\n真值与逻辑\n\n\
  现在是时候讨论允许我们比较值的工具了。这些被称为比较运算符。在 C 以及扩展到 Arduino 中，比较运算符如下：\n\n```\ns == t\n```\n\
  检查 `s` 和 `t` 是否相等。\n\n```\ns < t\n```\n检查 `s` 是否小于 `t`。\n\n```\ns <= t\n```\n检查\
  \ `s` 是否小于或等于 `t`。\n\n```\ns > t\n```\n检查 `s` 是否大于 `t`。\n\n```\ns >= t\n```\n检查\
  \ `s` 是否大于或等于 `t`。\n\n```\ns != t\n```\n检查 `s` 是否不等于 `t`。\n\n\n\n\n这些比较中的一个有两个名称：语句（statement）和表达式（expression）。在编程中，我们通常将它们称为“表达式”，以避免与计算机科学中的“语句”这一概念混淆，但你实际上可以同时评估多个这样的表达式。这被称为语句算术（statement\
  \ calculus），它是通过所谓的逻辑运算符（logical operators）来实现的。\n\n有很多逻辑运算符，但在 C 语言中你最需要了解的如下：\n\
  \n`A && B`\n检查表达式 `A` 和表达式 `B` 是否都为真。\n\n`A || B`\n\n`!A`\n检查语句 `A` 是否为假。如果它为假，那么我们将返回真，因为语句“非\
  \ `A`”是真的。如果你对离散数学或符号逻辑稍加熟悉，那么你将很容易地看到其中许多概念是从那里过来的。然而，即使你不熟悉，它们对你来说仍然非常容易理解。\n\n\
  ## 条件语句 (Conditionals)\n\n既然我们已经讨论了一些逻辑和真假，我们就可以基于这些知识来讨论所谓的条件语句（conditional statements）。条件语句是控制流（control\
  \ flow）的一个主要部分。控制流在计算机科学中极其重要，你用过的几乎每一个应用程序都内置了某种程度的控制流。毕竟，控制流是你为程序提供某种“智能”的基本方式，如果我们把智能定义为根据给定数据做出决策的能力的话。\n\
  \n这些条件可以有两种形式：被动条件（passive conditional）和主动条件（active conditional）。被动条件是最基本的形式，所以我们将首先介绍它。之所以被称为被动，是因为程序没有义务运行该条件的代码。例如，如果程序运行到条件处且条件不满足，代码将被完全跳过，程序将移动到程序的下一个部分。\n\
  \n被动条件是通过 `if` 语句建立的。`if` 语句只评估给定的条件是否为真，如果是真，则执行 `if` 语句代码块中的代码。否则，代码块将被完全跳过。`if`\
  \ 语句的语法如下：\n\n```\nif (condition) {\n    // 代码位于内部\n}\n```\n\n主动条件是对此的补充。主动条件与被动条件是并行的，因为它在语句不为真的情况下强制程序执行某些代码。所以从本质上，，如果为真，那么该代码块中的代码将运行。否则，将执行编写好的备用代码块。这是通过\
  \ `else` 语句实现的。\n\n```\nif (condition) {\n    // 代码位于内部\n} else {\n    // 备用代码在这里\n\
  }\n```\n\n然而，你可能会发现，有时你想要测试多个一个条件。你可以通过 `else if` 语句来实现，它应该被夹在你的 `if` 和 `else` 语句之间。如果测试的初始条件结果不为真，你可以提供额外的待测试条件。它将按顺序测试条件，如果其中一个都不为真，则将执行\
  \ `else` 语句。`if` 语句的语法如下：\n\n```\nif (condition) {\n} else if (condition) {\n\n\
  } else if (condition) {\n\n} else {\n}\n```\n\n你可以根据需要使用任意数量的 `else if` 语句。它没有上限或下限，所以不用太担心这个。\n\
  \n## 循环 (Loops)\n\n循环是编程中不可或的一部分。在第一本书中我们只真正涵盖了 `for` 循环，但在本书中，我们将同时涵盖 `for` 循环和\
  \ `while` 循环。循环逻辑是我们日常生活的本质部分，但很多时候我们没有考虑到它对我们每天做的事情到底有多重要。例如，考虑从 1 数到 5 的动作。你从数字\
  \ 1 开始；你通过做出正确的口型并呼气大声说出数字，然后给数字加 1；这个过程不断重复，直到你达到数字 6。在数字 6 处，你发现我们现在比数字 5 大了，所以你不再大声说出数字。这是一个相对简单的例子，但它仍然非常重要，因为它实际上勾勒出了循环逻辑是多么微妙和重要。\n\
  \nC 语言中有两种不同的主要循环形式是你需要了解的：`for` 循环和 `while` 循环。我们将首先介绍 `while` 循环，因为它们在概念上要简单得多。`while`\
  \ 循环相对容易理解，但很难准确地知道何时该使用它们。很多时候，你会使用 `for` 循环仅仅是因为它们看起来比 `while` 循环有更明显、更直接的用途。\n\
  \n对于 `for` 循环，你有非常明显的边界，但对于 `while` 循环则没有。由于这个原因，`while` 循环最适用于那些没有实际有限运行次数的情况。`while`\
  \ 循环只需检查一个条件，只要该条件满足，就会运行循环体内的代码。如果该条件变得不再满足，循环将退出。简单足够！\n\n`while` 循环的语法如下：\n\n\
  ```\nwhile (condition) {\n    // 循环内部代码\n}\n```\n\n`while` 循环最适合“游戏循环”（game loop）的概念。当然，这些循环并不局限于游戏；它们只是表达了游戏的思想，因为游戏基于一个真或假变量来执行相同的操作，当这些条件满足时，游戏就会结束。例如，代码可能是：\n\
  \n```\n#define TRUE 1\n#define FALSE 0\n\nint bHasWon = FALSE;\n\nwhile (bHasWon\
  \ == FALSE) {\n    // 代码在这里\n}\n```\n\n## 函数 (Functions)\n\n在进入章节之前，我们最后需要讨论并复习的是函数概念。函数是\
  \ C 语言以及扩展到 Arduino 中的一个基础概念。你会经常遇到它们，所以准确理解它们是如何运作的非常重要。幸运的是，它们并不是一个难以理解的概念！\n\n\
  \n\n\n# 函数 (Functions)\n\n函数包含几个基本部分。首先，它们有声明。在 `C` 中，你必须在文件开头声明一个新函数，这被称为原型声明（prototyping），或者你必须把它放在\
  \ `main` 函数之前。为了简单起见，我们将直接在文件开头对它们进行原型声明，并将放在草图（sketch）主要函数之后。\n\n函数还有返回类型。这是它们在函数结束时返回的值的类型。例如，一个名为\
  \ `convertTemp` 的函数可能会返回一个小数。因此，该函数的类型将是 `float` 或 `double`。\n\n也可以编写没有返回类型的函数。这些函数被称为\
  \ `void` 函数。它们是有效的，特别是对于执行某些需要重复进行但本身并不具有特殊数学意义的操作，例如向串口打印文本、让让电机旋转或类似的操作。\n\n函数还拥有参数（arguments）。函数不一定非要有参数，但你可以给函数提供参数。函数的参数在它的声明中定义。你可以指定参数的类型以及占位符名称。然后，你可以在函数体内将这些参数视为变量，并在程序稍后调用该函数时传入实际值。\n\
  \n再次强调，函数并不一定非要有参数。这并不是运行函数的必要条件。在继续学习时请记住这一点！\n\n函数原型声明语法如下：\n\n```\nfunctionType\
  \ functionName(arguments, if any);\n```\n\n而实际编写函数的语法如下：\n\n```\nfunctionType functionName(arguments,\
  \ if any) {\n\n// 函数内部代码\n\n// 如果必要，返回 valueName;\n\n}\n```\n\n现在，让我们创建一个函数，以 `float`\
  \ 类型返回圆锥的体积。这需要两个参数：`radius`（半径）和 `height`（高度）。它将是一个 `double` 类型，因为我们正在处理 `pi` 并且希望它尽可能准确。我们也将传入\
  \ `doubles` 作为参数。\n\n我们可以像这样在程序开头附近声明函数原型：\n\n```cpp\ndouble volumeOfCone(double\
  \ radius, double height);\n```\n\n然后在在程序之后的某个位置（但不在另一个函数内部），我们可以这样包含函数的实际体体：\n\n\
  ```cpp\ndouble volumeOfCone(double radius, double height) {\n\n  return 0.33333333\
  \ * 3.141569 * (radius * radius) * height;\n\n}\n```\n\n然后我们可以将该函数的返回值视为其本身的值。所以，我们可以创建一个\
  \ `double` 变量并将该函数的返回值赋值给它：\n\n```cpp\ndouble volumeOfConeRThreeHFive = volumeOfCone(3.00,\
  \ 5.00);\n```\n\n这将返回半径为三、高度为五的圆锥体积，并保存到我们创建的变量中。我们也可以将其插入到任何接受该值的地方，例如 `printf`\
  \ 语句或格式化字符串或类似的地方。\n\n到此，我们已经涵盖了在进入书中一些密集且核心的概念之前需要回顾的最后内容。在接下来的章节中，我们将尝试以比以前更高的水平探索\
  \ Arduino 编程的世界，涵盖更深入的编程概念。\n\n# 更深入的计算机主题 (More In-Depth Computer Science Topics)\n\
  \n你看，与计算机工作——尤其是像 Arduino 这样精确且受硬件限制的设备——可以带来巨大的回报，但如果你想精通此道，必须对许多底层概念有非常坚实的理解。\n\
  \n例如，理解变量是什么完全没有问题，但如果你不懂它们是如何工作的，你可能会在在无意的情况下通过它们浪费大量的计算资源。再次强调，当你处理像 Arduino 这样的设备时，这是你最不想看到的事情。\n\
  \n所以，在本章中，我们将基于已经讨论过的一些主题进行，这样你就能成为一个更全面的 Arduino 程序员，反过来也是更好的 `C/C++` 程序员。在本章结束时，你会觉得对许多不同的概念有了更稳固的掌握。\n\
  \n# 内存管理与指针 (Memory Management and Pointers)\n\n在本章中我们要讨论的第一点是内存管理和指针的概念。这是一个极其重要的主题，当我们谈论\
  \ Arduino 时尤其如此。板载内存不多，所以你需要充分利用现有的资源。\n\n![](img/00020.jpg)\n\n对于初学者来说，这可能有点难以理解。事实上，它足够困难，以至于在第一本书中你就被警告要特别避开这一点。这是因为这是一个相对高级的主题。毕竟，指针的理念本身就涉及了一些你可能还没有经验过的非常底层的编程。\n\
  \n让我们回想一下之前关于数据和数据类型的讨论。我们讨论了如何创建变量以及你对它们能做的一切。然而，我们没有真正谈论的是这些变量在计算机内存方面是如何工作的。\n\
  \n计算机将变量存储在名为随机访问内存（RAM）的内存中供整个过程运行。你可以将随机访问内存理解为可以根据程序的当前需求动态按需分配的空间。程序所处理的所有值在某种程度上都存储在随机访问内存中。变量可以被定义，从而分配一段随机访问内存空间。\n\
  \n变量从其本质上说也是计算机内存中值所在位置的引用。但是，当你引用一个变量时，你并不一定是在操作那个值。例如，当你将一个变量传递给函数时，你并没有发送变量本身。相反，你发送的是变量值的副本供新函数处理。当函数结束时，该副本会被丢弃。\n\
  \n在过去的计算时代，这有一定的意义。毕竟，你并不希望在每次将某些变量发送到函数时都更改它们的值。这种情况不成为默认设置是合理的。此外，函数在计算机内存中的存储方式也使得直接发送值比发送内存中其他地方的引用更合理。从某种意义上说，这让它们运行更高效。\n\
  \n然而，在某些情况下，你想引用变量本身的值，而不仅仅是变量所引的值。对于这些情况，你会需要指针。同时请注意，在大多数 Arduino Sketch 中，你完全可以在不使用指针的情况下工作。但是，在某些时候，你会处理数据结构或需要创建数据结构，在这些情况下，指针的实用知识是非常有用的。\n\
  \n\n\n\n那么，从这一切中可以获得的关键点是什么呢？嗯，首先，什么是指针？指针提供了一种方法，让你通过值在内存中的位置而不是仅仅通过其值的副本来引用它。这为什么很重要？因为它允许你传递并处理直接的值，而不是简单地通过变量可能获得的这些值的副本。这是\
  \ C 语言编程的基础，在 Arduino 程序中也可能经常遇到。虽然通常情况下，你可以在完全不使用指针的情况下编写整个程序（sketches），但当你查看他人的程序并从他们编写的代码中学习时，拥有这些知识仍然很有用。\n\
  \n那么，指针是如何工作的呢？指针通过一种被称为引用运算符（reference operators）和解引用运算符（dereference operators）的运算符组合来工作。你可以使用这些运算符来创建新的指针变量，并将它们指向一个已经存在的变量。\n\
  \n你要做的第一件事是创建一个指向你想要的值的类型的新指针。你通过使用引用运算符 `*` 来实现这一点。例如，假设我们有如下代码：\n\n```\nint apples\
  \ = 3;\n```\n\n我们想创建一个指向这个变量的指针。我们要做的第一件事是创建一个新指针：\n\n```\nint *ptr;\n```\n\n你可以将引用运算符放在任何地方。大多数人倾向于将其放在变量名上，但另一些人倾向于将其与类型放在。还有人将其放在两者中间，并在之间留一个空格。这取决于你所工作环境的编码规范，但通常将它放在变量名旁边是稳妥的做法。\n\
  \n之后，你要定义想让它指向的地址。你通过解引用运算符 `&` 来实现这一点。你设置的是指针变量本身指向这里，而不是带有引用运算符的指针变量。就像这样：\n\n\
  ```\nint *ptr;\nptr = &apples;\n```\n\n然后，每当我们通过引用运算符修改 `ptr` 变量时，它就会改变我们所指向的地址上存储的值。如下所示：\n\
  \n```\n*ptr = 4;\nprintf(“%d”, apples);\n```\n\n`//` 这将打印出四，因为我们将变量 `apples` 所引用的地址上的值从\
  \ 3 改为了 4。\n\n你可以很清楚地看到，当你作为程序员试图在函数之间传递变量并以复杂的方式处理变量时，这对你来说会有很多用处。像这样直接操作指针也有很多有益处。当你在一个像\
  \ Arduino 这样内存既有限又至关重要的平台上工作时，你将至少想要直接处理内存的能力。还有一些更本质的事情是你想要的，但它们是高级主题，不在本书的范围内。它们对于\
  \ Arduino 编程本身也并不特别有用，例如通过 `malloc` 函数进行直接内存分配。\n\n无论如何，了解如何使用指针将使你作为 Arduino 程序员更进一步，因为当你在现实中遇到指针或必须创建传递需要直接修改的变量函数时，你可以轻松地做到，而不会因为困惑而抓狂头发。\n\
  \n# 栈 (Stacks)\n\n栈是另一个极其重要的计算机科学概念。它们之所以重要，是因为它们与指针和数组等内容以一种非常关键且整合的方式工作。那么，它们是什么呢？\n\
  \n这比 Arduino 稍微深入一点，但在讨论 Arduino 编程时，你仍然不可避免地遇到基本的栈术语，因此对于栈是什么以及如何使用它有一个坚实的想法是很。\n\
  \n“栈（Stack）”实际上是一个相对多功能的术语。“栈”的概念指的就是它听起来的样子——一堆值。你可以向这个栈中添加变量。想象一个积木塔。这基本上就是栈的工作方式。你可以把东西放在栈的顶部，而这些东西也是最先从栈中移除的东西。这在算法编程中特别有用，但在\
  \ Arduino 编程中也有一些用途。为什么？因为当你处理复杂且有限的内存结构时，你不可避免地遇到许多使用栈作为最佳路径的情况。这是因为栈在内存上非常容易处理。除了栈中最后一个元素的位置和栈中当前元素的位置之外，它不要求任何东西，而这些东西是很容易使用的。它还为你提供了一种极其简单的方式来引用你已经使用过的数据，这本身就非常精妙（nifty）。从本质上说，栈对于任何程序员来说都是一个极其有用的工具，而且\
  \ Arduino IDE 中确实有有一些函数实际上引用了栈的概念并基于该概念进行构建。\n\n栈由两个基本函数组成：推送（pushing）和弹出（popping）。两者都非常容易理解，所以我们不需要花太多时间来回顾它们到底是什么。\n\
  \n**推送（Pushing）**指的是向栈中添加东西。这是一个非常直观的概念。你可以将一个值推入栈中以便以后保存，并立即召回它，而不必担心栈顶变量的名字或其值等问题。**弹出（Popping）**指的是从栈中取出东西。当你从栈中弹出一个值时，你移除了最近添加到栈中的东西并获取其值。然后你可以按照你喜欢的方式使用它的值。如果你想将值返回栈中，只需记住你将再次把它推进去。当你从栈中弹出并移除某个东西时，倒数第二个推入的东西现在是第一个被弹出的东西。\n\
  \n再次，栈是一个相对简单的概念，但它对整个计算机科学仍然非常重要，并能扩展你的视野\n\n# 结构体 (Structures)\n\nArduino 编程和通用\
  \ C 语言的一个微妙之处是，许多人没有花时间学习结构体（structures）的概念。结构体是一个相对保守的秘密，但它们可能非常有用。你可能听过面向对象编程的术语。C\
  \ 语言中的结构体在很多方面都是面向对象编程的想法。虽然它们不能像面向对象概念那样被大量编程，但它们确实为程序员提供了一种将某些想法组合到单一结构中的卓越方法。\n\
  \n那么，结构体到底是什么？提供一些定义将帮助你更好地理解如何使用它。很多时候，编程中的某些概念如果你将它们打包在一起，就会有意义得多。一个很好的例子是考虑一只猫。你可能需要在程序中处理几种不同的猫的想法，为了这一点，你将定义各种不同的变量，尽管它们有许多共同特征。所以，而不是这样做：\n\
  \n```\ncat1Legs = 4;\ncat2Legs = 4;\ncat3Legs = 4;\ncat1Color = ‘brown’;\ncat2Color\
  \ = ‘black’;\ncat3Color = ‘white with black spots’;\ncat1Breed = ‘tabby’;\ncat2Breed\
  \ = ‘persian’;\ncat3Breed = ‘american shorthair’;\n```\n\n你可以用一种方式定义所有这些内容，并在以后通过访问它们的成员数据来处理它们。你通过使用点号来实现这一点。C\
  \ 语言中定义结构的语法如下：\n\n```\nstruct 结构体名称 {\n  // 结构内部的数据\n};\n```\n\n那么，使用猫的例子：\n\n\
  ```\nstruct MyCat {\n  int numberOfLegs;\n  String color;\n  String breed;\n};\n\
  ```\n\n你就可以这样定义猫：\n\n```\nMyCat cat1 = {4, ‘brown’, ‘tabby’};\nMyCat cat2 = {4,\
  \ ‘black’, ‘persian’};\nMyCat cat3  = {4, ‘white with black spots’, ‘american shorthair’};\n\
  ```\n\n\n\n你可以看到，这为程序员提供了一种更简单的方法来将重要数据分组。虽然你可能不会非常频繁地使用这些数据，但它确实允许你拥有这样一种处理方式。了解它是什么重要的，因为你终会遇到它。\n\
  \n所有这些概念对于 Arduino 来说都是非常重要的，因为 Arduino 在内存和处理能力方面的限制远比你的家用电脑多。了解如何使用这些概念至关重要，这样你才能充分利用\
  \ Arduino 的处理能力，并编写出比平时更简单、更优雅的程序（sketches）。例如，你可以创建一个包含名为 `r`、`g` 和 `b` 的三个字节变量的结构体，以便用简单的几行代码编写你的\
  \ RGB 颜色。你可以通过这种方式定义新颜色，以便稍在程序中方便地访问它们，如下：\n\n```cpp\nstruct color {\n  byte r,\
  \ g, b;\n};\n\ncolor blue = {0, 0, 255};\n```\n\n看，这有多简单？但这样做的用处是显而易见的！\n\n在本章中，我们涵盖了三个主要的编程概念，当你处理他人的\
  \ Arduino 代码并学习他们编写的内容时，这些概念是你不可避免会遇到的，因此，培养你解析和处理这些想法的能力非常重要。\n\n## Arduino API\
  \ 函数\n\n在本章中，我们将开始详细介绍由 Arduino API 提供的函数。第一本书涉及很多编程的基础知识。这虽然很棒，但我们并没有通过 Arduino\
  \ API 本身获得太多经验。我们现在的目标是针对 Arduino 接口为程序员提供的众多函数积累一些经验。\n\nArduino API 是为有志的 Arduino\
  \ 程序员提供的一系列丰富的不同的工具，以便在他们的编程中提供更多选择。Arduino 团队做了非常出色的工作，提供了一个功能齐全的 API，让程序员在 Arduino\
  \ 创作的范围内可以执行各种不同的操作。\n\n我们将分章节介绍这些内容，并对每个函数提供更多信息，所以请坐好。你从本章中获得了一个完整的 Arduino 编程参考，可以在需要随时翻阅。\n\
  \n![](img/00102.jpg)\n\n## 数字输入和输出\n\nArduino API 定义了许多函数以允许你处理数字引脚。本节专门介绍这些函数，特别是其中的三个。\n\
  \n`pinMode(pin, INPUT - OUTPUT - or INPUT_PULLUP)`\n\n这允许你指定一个引脚，然后指定该引脚是作为输入还是作为输出。较新的\
  \ Arduino 模型可以通过 `INPUT_PULLUP` 模式通过上拉电阻启用引脚。\n\n## 模拟输入和输出\n\n在数字引脚之外，你还有模拟引脚。这些函数用于从指定的引脚读取电压，范围始终在\
  \ 0 到 5 伏之间。上限会接近 1023，而下限会更接近 0。\n\n`analogRead(pin)`\n\n这将读取指定引脚的电压，并将其作为从 0 到\
  \ 1023 的整数返回。\n\n`analogReference(type)`\n\n这将根据你的 Arduino 类型配置用作参考的电压。\n\n大多数情况下，你可以将“type”指定为\
  \ `DEFAULT` 或 `INTERNAL`。在某些情况下，你可能需要不同的参考电压。\n\n`analogWrite(pin, value)`\n\n这将写入一个从\
  \ 0 到 1023 的电压值，其中 1023 代表 4.99999 伏，0 代表 0 伏。\n\n## 高级输入和输出\n\n这些并不真正属于数字或模拟类别，但它们是更高级的输入输出类别，允许你更泛地操作你的\
  \ Arduino 板。\n\n`tone(pin, frequency, OPTIONAL duration)`\n\n这允许你指定一个频率，然后在指定的引脚上产生该频率的方波。\n\
  \n`noTone(pin)`\n\n这将停止由 `tone` 函数生成的音调。\n\n`pulseIn(pin, value)`\n\n这允许你读取指定引脚的脉冲。如果引脚在高电和低电之间波动，它将返回高电和低电之间的微秒数。由于脉冲可能不完全均匀，你实际上可以指定是想读取\
  \ `HIGH` 脉冲（`HIGH` 值变为 `LOW` 的时间）还是 `LOW` 脉冲（`LOW` 值变为 `HIGH` 的时间）。\n\n`pulseInLong(pin,\
  \ value)`\n\n这与之前的函数相似，但它返回的不是整数微秒数，而是长型（long）微秒数，这本质上为你接收数据提供了一个更大的时间维度。\n\n`shiftIn(dataPin,\
  \ clockPin, bitOrder)`\n\n这将逐位向指定引脚发送一个字节的数据。`dataPin` 是你发送每个位数的引脚，`clock pin` 是指定\
  \ `dataPin` 已读取数据的引脚，而 `bitOrder` 可以是 `MSBFIRST` 或 `LSBFIRST`（分别为最高位优先或最低位优先）。\n\
  \n`shiftOut(dataPin, clockPin, bitOrder, value)`\n\n这与之前的函数非常，但它允许你逐位向引脚发送数据。其他部分都相同。\n\
  \n## 时间\n\n这些函数旨在帮助你处理时间。\n\n`delay(value)`\n\n这将允许程序暂停指定的毫秒。\n\n`delayMicroseconds(value)`\n\
  \n这与 `delay()` 函数功能相同，只是它使用的是微秒。\n\n## 数学\n\n信不信，编程有时涉及大量的数学。Arduino 中的数学函数在许多方面与\
  \ C 库定义的函数相似，但它们让你无需导入任何数学库。即使你并不常用，了解它们的存在也会有益。\n\n`abs(value)`\n\n此函数返回给定数的绝对值，或者说与零之间的距离。\n\
  \n`constrain(variant, lowerBound, upperBound)`\n\n这允许你创建一个函数，使数字始终在上下界限范围内。\n\n\
  `map(number, fromMin, fromMax, toMin, toMax)`\n\n这将数字从一个范围映射到另一个范围。\n\n`max(number1,\
  \ number2)`\n\n返回 `number1` 或 `number2` 中的较大值。非常简单！\n\n`min(number1, number2)`\n\
  \n几乎与 `max` 函数相反。它将返回两个数中的较小值。\n\n`pow(base, exponent)`\n\n这允许你取一个数并进行幂运算。C 没有内置的指数运算符，因此非常需要这个函数。\n\
  \n`sq(number)`\n\n这将返回给定数的平方。`pow(number, 2)` 的简写。\n\n`sqrt(number)`\n\n这将计算给定数的平方根。\n\
  \n`cos(angle)`\n\n这将计算给定角度的余值，角度以弧度为单位。\n\n`sin(angle)`\n\n这将计算给定角度的正弦值，角度以弧度为单位。\n\
  \n`tan(angle)`\n\n这将计算给定角度的正切值，角度以弧度为单位。\n\n## 字符\n\n虽然它们很少用，但在处理字符集时，拥有一组随时可以待命的函数是非常重要的。\n\
  \n`isAlpha(character)`\n\n这将返回该字符是否为字母。\n\n`isAlphaNumeric(character)`\n\n这将返回该字符是否为字母或数字。\n\
  \n`isAscii()`\n\n这将返回该字符是否为 ASCII 字符。\n\n`isControl()`\n\n\n\n\n\n这将返回一个字符是否为控制字符。\n\
  \n`isDigit()`\n\n这将返回一个字符是否为数字。\n\n`isGraph()`\n\n这将返回该字符是否为具有视觉数据的字符。例如，空格就不具有视觉数据。\n\
  \n`isHexadecimalDigit()`\n\n这将返回该字符是否为十六进制数字。\n\n`isLowerCase()`\n\n这将返回该字符是否为小写。\n\
  \n`isPrinable()`\n\n这将返回该字符是否可以打印到控制台。\n\n`isPunct()`\n\n这将返回该字符是否为标点符号。\n\n`isSpace()`\n\
  \n这将返回该字符是否为空格。\n\n`isUpperCase()`\n\n这将返回该字符是否为大写。\n\n`isWhiteSpace()`\n\n这将返回该字符是否为空白字符，如制表符、空格或换行符。\n\
  \n# 随机数\n\n这些函数将允许你在程序中创建随机数。请注意，计算机永远无法实现真正的随机和自发；一切都基于输入，在计算机中没有任何事情可以没有这些输入。因此，随机函数必须设置种子。\n\
  \n`randomSeed(number)`\n\n这会启动随机数生成器。你输入一个数字，它将从伪随机数生成器数值序列中的某个随机点开始。\n\n`random(OPTIONAL\
  \ minimum, maximum)`\n\n这将作为你随机数生成的边界。最大值是你允许的最高随机数，最小输入是你允许的最低值。如果你不指定最小值，则最小值将被假设为\
  \ 0。\n\n# 位运算函数\n\n这些函数允许你处理位（bit）和字节（byte），这是计算机处理的最小数据单元。理论上讲，你可以处理更小的值（从所需的总计算能力而言），但在为\
  \ Arduino 编程时，这些是你将要处理的最小实用值。\n\n`bit(bitNum)`\n\n这将返回给定位的值。\n\n`bitClear(variable,\
  \ bit)`\n\n这将将指定数值变量的给定位设置为 0。\n\n`bitRead(variable, bit)`\n\n这将返回指定数值变量的位。\n\n\
  `bitSet(variable, bit)`\n\n这将将给定变量由 `bit` 所指示的位置的位设置为 1。\n\n`bitWrite(variable,\
  \ bit, 0 or 1)`\n\n这将根据你的指令，将变量中给定位置的位设置为 0 或 1。\n\n`highByte(value)`\n\n这将返回给定值的最高字节。\n\
  \n`lowByte(value)`\n\n这将返回给定值的最低字节。\n\n# 使用 Stream 类（以及处理字符串）\n\n这部分值得单独成一章。虽然它也大量涉及如何有效地使用\
  \ Arduino API，但由于这节内容非常广泛，我们确实有必要将其分成独立的一章，以便进行适当讨论。\n\n![](img/00117.jpg)\n\nStream\
  \ 类（流类）是一个相对容易理解的概念。Stream 类本身是基于从特定源读取信息并将其用于你的 sketch（程序）中的。因为 Stream 关乎读取数据，所以我们有必要在本章中也讨论与键盘和鼠标的操作，尽管这些与\
  \ Stream 类之间没有内在的联系。\n\n当你处理数据时（尤其是读取数据时），你将不可避免地会遇到需要处理一组字符的情况，例如单词、句子或任何类似的内容。字符串（Strings）的概念为你提供了这种操作的机会。\n\
  \n字符串基本上是作为数组连接在一起的一组字符值集合。因此，它们在内存中是连续的，计算机将它们视作一个大型且相互连接的单元。处理字符串意味着学习如何尽所能地操纵这些单元。\n\
  \n字符串本身非常简单。字符串本质上就是字符数组。这意味着我们在技术上处理的是所谓的 C 风格字符串（C-style Strings），它们基本上是抽象程度非常低的字符串。例如，在许多更现代、高级别的语言中，字符串并不是以字符数组的形式呈现的；它们被视为一个更抽象的对象，即使它们的核心是字符数组。\n\
  \n一个字符串由 `n+1` 个字符组成，其中 `n` 在通常意义上是字符串内字母的数量。例如，单词“hello”的字符串大小为六个字符。之所以是 `n+1`，是因为字符串以一个空终止字符\
  \ `\\0` 结尾，该字符表示已到达数组末尾并使其正确终止。\n\n你可以像定义数组一样定义字符串。你也可以让字符串 own 比它们将包含的字符串更大。当你定义一个数组时，可以立即赋予值，但也可以只定义大小并在稍后扩展它们。这在某种程度上也使得字符串具有动态性，并可以在程序后期阶段通过重写字符串内部的数据来更改。\n\
  \n这些信息对你作为程序员非常有用，因为字符串是任何处理信息的程序的根本组成部分，特别是那些处理文件输入输出的程序。\n\n我们已经花了一些时间回顾之前书中的信息，但为了清晰起见，我们现在定义一下字符串：\n\
  \n```cpp\nchar myString[6] = “hello\";\n```\n\n你之后可以通过字符的名称引用这整个字符串。Arduino 处理的大部分数据将以字节的形式处理，而大多数实际文本数据将以字符串的形式处理，因为字符非常容易解析。\n\
  \n涵盖所有这些是非常重要的，这样我们才能建立起在 Arduino 编程背景下如何处理字符串的思路。\n\nSerial\n\n虽然你不一定能实现 Stream\
  \ 类本身，但你可以实现它的派生类，这正是你开始发现许多实用处的地方。Serial 类是 Stream 类的扩展，允许 Arduino 板板与其他设备（如计算机）进行通信。\n\
  \nSerial 通过 Arduino 上的 Serial 端口以及到计算机的 USB 链路来实现。在本节中，我们将列出构成 Serial 类的所有不同函数，以便你能够充分利用这一宝贵的资源。\n\
  \n```cpp\nif (Serial)\n```\n\n`Serial.begin(rate)`\n\n你对这个函数已经熟悉了。它允许你启动数据的串口传输。你可以指定每秒比特数的特定数据传输速率。\n\
  \n`Serial.end()`\n\n这允许你结束串口通信。如果你需要，以后可以通过调用 `Serial.begin()` 函数重启串口通信。在串口通信禁用期间，你可以将串口引脚用于数据的进出。\n\
  \n`Serial.find(string)`\n\n将在串口提供的数据中搜索给定字符串。如果找到字符串，方法将返回 true。如果未找到字符串，方法将返回 false。\n\
  \n`Serial.findUntil(string, OPTIONAL endString)`\n\n将在串口缓冲区中查找字符串，直到找到该字符串或找到指定的终止字符串。如果找到了目标字符串，方法将返回\
  \ true。如果找到了终止字符串或方法超时，它将返回 false。\n\n`Serial.flush()`\n\n这允许你停止进程，直到所有发送到串口的数据发送完毕。简单明了！\n\
  \n`Serial.parseFloat()`\n\n这将返回串口流提供的第一个浮点数。它会被任何非浮点字符终结。\n\n\n\n\n\n### `Serial.parseInt()`\n\
  \n该函数将返回串口流提供的第一个整数。它会在遇到第一个非数字字符时结束。\n\n### `Serial.peek()`\n\n该函数将返回串口缓冲区即将导入的下一个字符。然而，它不会从缓冲区中移除该字符。这与我们稍后将介绍的\
  \ `Serial.read()` 方法有本质区别。这意味着你可以简单地查看下一个进入的字符是什么。\n\n### `Serial.print(value, OPTIONAL\
  \ format)`\n\n你可以选择性指定格式。否则，整数默认将以十进制形式打印；浮点数默认保留两位小数，以此此类推。你可以直接将字符或字符串发送到 `print`\
  \ 语句，它将无问题地打印它们。\n\n### `Serial.println(value, OPTIONAL format)`\n\n这允许你像使用普通的 `print`\
  \ 方法一样打印值。\n\n### `Serial.read()`\n\n该函数将读取通过串口端口进入的数据。简单来说！它被添加到名为串口缓冲器的输入串口数据流中。当你从此缓冲区读取信息时，这些信息会被删除，因此如果你以后需要重用这些数据，请务必将其保存到变量中。\n\
  \n### `Serial.readBytes(serialBuffer, numberOfBytes)`\n\n该函数将字符从串口端口读取到缓冲区中。你可以确定要读取的字节数。你的缓冲区必须是一个字符数组或字节数组。\n\
  \n### `Serial.readBytesUntil(terminatorCharacter, serialBuffer, numberOfBytes)`\n\
  \n该函数将从串口读取字符，直到读取了指定数量的字节或读取到指定的终止字符。无论在何种情况下，该方法都会终止。\n\n### `Serial.write()`\n\
  \n该函数将数据写入串口端口；然而，此特定方法只向串口端口发送二进制数据。如果你需要发送 ASCII 数据，应该使用 `print` 方法。\n\n### `Serial.serialEvent()`\n\
  \n每当串口端口有数据可供时，此函数就会被调用。然后你可以使用 `Serial.read()` 函数从串口端口读取数据。\n\n到此，我们已经涵盖了许多与 `Serial`\
  \ 类相关的特定函数以及它与 Arduino API 编程的关系。我们接下来需要处理的是 `Ethernet` 类。\n\n## 用户定义函数\n\n保持代码整洁、组织良好且模块化（可重用）的方法之一是在代码中使用函数。此外，它们通过使某些部分变得可重用来帮助减小代码量。正如名称所示，函数就像是为了实现特定功能而创建的工具。虽然我们已经遇到过一些用户定义函数，但现在我们将更详细地介绍它们，并解释一些我们在上次遇到它们时可能忽略的特性。现在让我们来看函数的声明：\n\
  \n```cpp\nfloat employeeEarnings (float hoursWorked, float payRate) {\n    float\
  \ result;// 这是我们在调用此函数时返回的值。它应该与我们函数名之前的数据类型匹配。\n    result = hoursWorked * payRate\n\
  \    return result// return 告诉函数一旦被调用就把值发送回调用它的地方\n}\n```\n\n此函数显然接收两个参数，`hoursWorked`\
  \ 和 `payRate`，它们都是 `float` 类型。它对这些参数进行一些简单的数学运算，然后返回一个 `float` 作为值。`return` 意味着终止函数并将\
  \ `return` 单词之后放置的任何值（通常是一个变量）作为计算结果发送回。\n\n现在让我们如何调用这个函数来获取员工的收益：\n\n```cpp\nvoid\
  \ loop () {\n    float hoursWorked = 37.5;\n    float payRate= 18.50;\n    float\
  \ result = employeeEarnings (hoursWorked, payRate)\n    // result 将是 693.75\n}\n\
  ```\n\n首先，函数必须声明在任何其他函数之外。这意味着你需要在 `setup()`、`loop()` 或任何其他自定义函数之外编写你正在创建的函数代码。\n\
  \n让我们另一个可以用于平滑传感器读取值的示例 sketch 代码：\n\n```cpp\nint sensorSmoothing (analogPin) {\n\
  \    int sensorValue = 0;\n    for (int index = 0; index < 5, index++)\n       \
  \ digitalWrite(LED_BUILTIN, HIGH);  //开启 LED 平滑\n        sensorValue = sensorValue\
  \ + analogRead(analogPin)\n        delay(100)// 样本之间延迟 100 毫秒\n    digitalWrite(LED_BUILTIN,\
  \ LOW);//关闭 LED\n    sensorValue = sensorValue / 5 // 平均值采样\n    return sensorValue;\n\
  }\n```\n\n此函数可以用于平滑传感器读取值。\n\n\n\n\n每个 `Arduino` 都有许多传感器和扩展模块，因此请务必检查你想使用哪些。拥有 `Arduino`\
  \ 的奇妙之处在于，你将有机会尝试许多实验。你并不局限于传感器所读取的内容。自己想出一些方法让机器为你工作吧。先尝试编写简单的请求——比如设置闪烁灯光或弄清楚\
  \ `Arduino` 如何监控输入——然后从此开始你还能做什么。我为你包含了许多 `Arduino codes` 供你使用，但也欢迎寻找一些你自己的代码！还有许多指南可以提供帮助。\n\
  \n你还可以查看一些我们在这里没得及接触的更高级的概念，例如头文件、类、更改芯片时钟、添加内核、添加库等，使用这个芯片可以做的事情太多了，这真的非常不可思议。选择一个你感兴趣的方向，看看它会带你走向何方。我希望本指南能为你提供一些小小的灵感，让你出去尝试新事物，看看你的\
  \ sketch 设计能力达到什么水平。\n\n最后，感谢你读完这本书！`Arduinos` 是开启编程之旅的一种有趣方式。既然你购买了这本书，我们希望你有所成长，如果你觉得这本书在任何方面都很有用，在\
