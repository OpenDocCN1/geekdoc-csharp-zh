  \ `SSMS` 基础知识来协助完成这些任务！\n\n### 持续学习\n\n通过运行查询并理解数据，深入研究 `AdventureWorks`、`Company_Db`、`Chinook`\
  \ 和 `Northwind` 数据库。学习 SQL 的一部分也是理解数据库内部的数据。\n\n为了保护数据库，SQL 有一种安全方案允许你指定哪些用户可以查看特定信息。该方案还允许设置每个用户可以执行的操作。这种安全方案（或模型）依赖于授权标识。正如你在第二章中学到的，授权标识是代表可以访问/修改数据库内部信息的一个或多个用户。\n\
