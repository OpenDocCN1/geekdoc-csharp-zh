  \n## Esplora\n\n此板板基于 `Leonardo`，但内置了更多技术，使你不需要学习太多的电子知识就能运行。相反，你可以在观察过程自行运行的过程中学习。\n\
  \n内置的输入传感器包括摇杆、滑块、温度传感器、麦克风、加速度计和光传感器。它还包含了一些音频和光线输出。它可以通过两个 `Tinker kit` 输入/输出连接连接到名为\
  \ `TFT LCD screen` 的其他技术来扩展其功能。\n\n- 价格：$43.89\n\n\n\n\n# Mega 256O\n\n这款微控制器专为机器人和\
  \ 3D 打印机等大型项目设计。它的数字引脚和模拟输入引脚数量是许多倍，PWM 引脚数量几乎是其三倍。结合数倍的闪存存储、SRAM 和 EEPROM，它能够实现需要更多指令的项目。这块\
  \ Arduino 板为更大的复杂性和特殊性留出了空间。\n\n- 价格：$45.95\n- 闪存内存：256kB\n- SRAM: 8kB\n- EEPROM:\
  \ 4kB \n- 处理速度：16MHz\n- 数字引脚：54 个\n- PWM 引脚：15 个\n- 模拟输入：16 个\n- 工作电压：5V\n- 输入电压：7-12V\n\
  - UART：4 路\n\n# Zero（零线版）\n\n这是对已开发的 Arduino Uno 技术的扩展。它是 Uno 的 32 位扩展版，通过极大地提高处理速度、增加\
  \ 16 倍的 SRAM 以及数倍的闪存内存提升了性能。你需要为这些扩展功能付费，价格几乎是 Uno 的两倍，但这些硬件带给你的能力远超两倍。\n\nZero\
  \ 的另一个优势是它内置了一个名为 Atmel 嵌入式调试器的功能，缩写为 `EDBG`，它可以帮助你在不使用额外硬件的情况下调试代码，从而提高你软件编码的效率。\n\
  \n- 价格：$42.90\n- 闪存内存：256kB\n- SRAM: 32kB\n- EEPROM: n/a \n- 处理速度：48MHz\n- 数字引脚：14\
  \ 个\n- PWM 引脚：10 个\n- 模拟输入：6 个\n- 模拟输出：1 个\n- 工作电压：3.3V\n- 输入电压：7-12V\n- UART：2\
  \ 路\n- USB 端口：2 个 micro-USB 端口\n\n# Due（杜线）\n\n这是微控制器板领域的一个新颖，因为它基于 32 位 ARM 核心微控制器构建，赋予了它强大的性能和功能。它拥有极快的处理器和\
  \ 4 个 UART，使其在执行多功能时具有很高的灵活性可用性。它用于大型 Arduino 项目，虽然它可能不是你的第一块板子，但对于你未来的任何大项目，你都会考虑一下。\n\
  \n- 价格：$37.40\n- 闪存内存：512kB\n- SRAM: 96kB\n- EEPROM: n/a\n- 处理速度：84MHz\n- 数字引脚：54\
  \ 个\n- PWM 引脚：12 个\n- 模拟输入：12 个\n- 模拟输出：2 个\n- 工作电压：3.3V\n- 输入电压：7-12V\n- UART：4\
  \ 路\n- USB 端口：2 个 micro-USB 端口\n\n# Mega ADK\n\n该板基于 Mega256O Arduino 板板，具有惊人的内存容量和大量的输入输出可用性。Mega256O\
  \ 和 Mega ADK 的区别在于，Mega ADK 特别兼容 Android 技术，例如三星手机和平板电脑、华硕技术以及其他使用 Android 的非 iOS、非\
  \ Windows 移动设备。它的价格接近 50 美元，但如果你想将 Android 整合到你的项目中，这将是你最想要选择的板子。\n\n- 价格：$47.30\n\
  - 闪存内存：256kB\n- SRAM: 8kB\n- EEPROM: 4kB \n- 处理速度：16MHz\n- 数字引脚：54 个\n- PWM 引脚：15\
  \ 个\n- 模拟输入：16 个\n- 工作电压：5V\n- 输入电压：7-12V\n- UART：4 路\n\n# Arduino Pro (8 MHz)\n\
  \n这是 SparkFun 公司对 ATmega328 板的实现。它基本上是面向专业人士的 Uno，旨在用于在物体或技术中进行半永久安装。8MHz 版本的功率是\
  \ Uno 的一半，但价格也便宜得多。让这块板子工作需要更多硬件知识，因为它没有 USB 端口，也没有通过 USB 为板子供电的方法，因此必须连接 `FTDI`\
  \ 线或扩展板才能与板子通信并上传程序（sketches）。然而，一旦你解决了将板子连接到电脑的技术细节，它的功能就像一个半功率的 Uno。与 16MHz 的\
  \ Arduino Pro 不同，这块 8MHz 的 Pro 可以锂电池供电。\n\n- 价格：$14.95\n- 闪存内存：16kB\n- SRAM: 1kB\n\
  - EEPROM: 0.512kB \n- 处理速度：8MHz\n- 数字引脚：14 个\n- PWM 引脚：6 个\n- 模拟输入：6 个\n- 工作电压：3.3V\n\
  - 输入电压：3.35-12V\n- UART：1 路\n\n# Arduino Pro (16 MHz)\n\n这是 SparkFun 出出的 Arduino\
  \ Pro 的 16MHz 版本。它的功率与 Uno 相同，但具有与 8MHz Pro 相同的缺点：你需要找到一条 `FTDI` 线或从 SparkFun 购买扩展板，以便板子与你的电脑兼容以上传程序。这意味着比起从\
