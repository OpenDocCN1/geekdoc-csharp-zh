  \n## 参考文献\n\n## 引言\n\n“能说话不要写，能点头不要说话。永远不要发邮件任何内容。” – Eliot Spitzer\n\n在硬盘上，数据可以以不同的文件格式存储。它可以以文本文件、Word\
  \ 文件、mp4 文件等形式存储。然而，我们需要一个统一的接口，能够以稳健高效的方式在一个框架下访问不同类型的数据。这时，数据库的角色就体现出来了。\n\n数据库的定义是“存储在计算机中的一组信息，以便能够方便地访问、管理和操作”。\n\
  \n数据库以表集合的形式存储数据，每个表存储有关特定实体的数据。我们想要存储的学生信息将由表的列表示。表的每一行将包含一个特定学生的记录。每个记录将通过特定的列来区分，该列为每行包含一个唯一值。\n\
  \n假设你想存储一个学生的 ID、姓名、年龄、性别和部门。数据库中包含该学生数据的表如下：\n\n| SID | SName | SAge | | SGender\
  \ | SDepartment |\n| --- | --- | --- | --- | --- | --- |\n| 1 | Tom | 14 | | Male\
  \ | Computer |\n| 2 | Mike | 12 | | Male | Electrical |\n| 3 | Sandy | 13 | | Female\
  \ | Electrical |\n| 4 | Jack | 10 | | Male | Computer |\n| 5 | Sara | 11 | | Female\
  \ | Computer |\n\n学生表\n\n在这里，每个列名前都加缀了字母“S”。这只是用于表示列名的惯例之一。你可以给列起任何名称。（我们将在接下来的章节中查看如何在其中创建表和列。）对于以这种形式存储的数据，访问、操作和管理要容易得多。SQL\
  \ 查询可以执行在存储为与其他表具有关系的表的数据上。\n\n数据库并不包含单个表，而是包含多个相关的表。关系维护了数据库的完整性并防止数据冗余。例如，如果学校决定将计算机部门的名称从“Computer”更改为“Comp\
  \ & Soft”，你必须更新计算机部门所有学生的记录。你必须更新学生表中的第 1、第 4 和第 5 条记录。\n\n更新三条记录很容易；但在现实场景中，有成千上万的学生，更新他们所有的记录是一项艰巨的任务。在这种情况下，数据表之间的关系变得非常重要。例如，为了解决上述冗余问题，我们可以创建一个名为\
  \ `Department` 的新表，并在表中存储所有部门的记录。该表如下：\n\n| DID | DName | DCapacity |\n| --- | ---\
  \ | --- |\n| 1 | Computer | 50 |\n| 2 | Electrical | 40 |\n| 3 | Mechanical | 30\
  \ |\n\n部门表\n\n| SID | SName | SAge | | SGender | SDepartment |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| 1 | Tom | 14 | | Male | Computer |\n| 2 | Mike | 12 | |\
  \ Male | Electrical |\n| 3 | Sandy | 13 | | Female | Electrical |\n| 4 | Jack |\
  \ 10 | | Male | Computer |\n| 5 | Sara | 11 | | Female | Computer |\n\n学生表\n\n在这里，每个列名前都加缀了字母“S”。这只是用于表示列名的惯例之一。你可以给列起任何名称。（我们将在接下来的章节中查看如何在其中创建表和列。）对于以这种形式存储的数据，访问、操作和管理要容易得多。SQL\
  \ 查询可以执行在存储为与其他表具有关系的表的数据上。\n\n\n\n\n\n请记住，SQL 语句是不区分大小写的。接下来，我们需要在之前创建的 `customer_details`\
  \ 数据库中创建各种客户表，用于存储相关的客户记录。这就是为什么该系统被称为关系型数据库管理系统，因为所有表都是相互关联的，便于记录检索和信息处理。为了在 `customer_details`\
  \ 数据库中创建不同但相关的客户表，我们应用以下 DDL 语法：\n\n```sql\nCREATE TABLE my_table\n(\ntable_column-1\
  \  data_type,\ntable_column-2  data_type,\ntable_column-3  data_type,\ntable_column-n\
  \  data_type\n)\n\nCREATE TABLE customer_accounts\n(\nacct_no INTEGER, PRIMARY KEY,\n\
  acct_bal  DOUBLE,\nacct_type INTEGER,\nacct_opening_date DATE\n)\n```\n\n属性 `PRIMARY\
  \ KEY` 确保名为 `acct_no` 的列在整个范围内具有唯一值，且没有空值。每个表都应该有一个主键列来唯一标识表中的每条记录。其他列属性包括 `NOT\
  \ NULL`，它确保列不接受空值；以及 `FOREIGN KEY`，它确保另一个表中的相关记录不会被错误或无意地删除。具有 `FOREIGN KEY` 属性的列是另一个相关表中主键列的副本。例如，我们可以在\
  \ `customer_details` 数据库中创建另一个表 `customer_personal_info`，如下：\n\n```sql\nCREATE TABLE\
  \ customer_personal_info\n(\ncust_id         INTEGER PRIMARY KEY,\nfirst_name  \
  \    VARCHAR(100) NOT NULL,\nsecond_name     VARCHAR(100),\nlastname        VARCHAR(100)\
  \ NOT NULL,\nsex             VARCHAR(5),\ndate_of_birth   DATE,\naddress       \
  \  VARCHAR(200)\n)\n```\n\n新创建的 `customer_personal_info` 表有一个名为 `cust_id` 的主键列。`customer_accounts`\
  \ 表需要在字段中包含一个名为 `cust_id` 的列，以链接到 `customer_personal_info` 表，从而访问该表获取有关特定账户客户的更多信息。\n\
  \n因此，确保两个表之间数据完整性（使表中的活动记录永远不会删除）的最佳方法是在 `customer_accounts` 表中插入一个名为 `cust_id`\
  \ 的键作为外键。这确保了 `customer_personal_info` 中与 `customer_accounts` 表中的相关记录不会被意外删除。我们将在下一节中讨论如何操作。\n\
  \n### 添加外键的 Alter DDL\n\n由于 `customer_accounts` 表已经创建，我们需要修改该表以适应新的外键。为了实现这一点，我们使用下文描述的\
  \ SQL 数据定义语言语法：\n\n```sql\nALTER TABLE mytable\nADD FOREIGN KEY (targeted_column)\n\
  REFERENCES related_table(related_column)\n```\n\n现在，要向 `customer_accounts` 表添加外键并使其引用\
  \ `customer_personal_info` 表的键列 `cust_id`，我们使用以下 SQL 语句：\n\n```sql\nALTER TABLE\
  \ customer_accounts\nADD FOREIGN KEY (cust_id)\nREFERENCES customer_personal_info(cust_id)\n\
  ```\n\n### 表中的外键 DDL\n\n在我们需要在创建新表的同时创建外键 的情况下，我们使用以下 DDL 语法：\n\n```sql\nCREATE\
  \ TABLE my_table\n(\nColumn-1 data_type FOREIGN KEY, REFERENCES (related column)\n\
  )\n```\n\n### 表中的唯一约束 DDL\n\n唯一约束可以放置在表列上，以确保存储在列中的值是唯一的，就像主键列一样唯一的区别是，一个表只能有一个主键列，但可以有任意数量的唯一列。创建唯一表列或字段的\
  \ DDL 语法如下所示：\n\n```sql\nCREATE TABLE my_table\n(\nColumn-1 data_type UNIQUE\n)\n\
  ```\n\n### 表中的 Delete 和 Drop DDL\n\n```sql\nDROP TABLE my_table\n```\n\n必须注意的是，此操作是不可逆的，在执行此操作之前必须小心。此外，可以使用以下\
  \ DDL 语法删除数据库：\n\n```sql\nDROP DATABASE my_database\n```\n\n此操作也是不可逆的。在原子层级，你可能决定从数据表中删除一列。要实现这一点，我们使用\
  \ `Delete` DDL 而不是 `DROP`。语法如下：\n\n```sql\nDELETE column_name FROM data_table\n\
  ```\n\n### 创建视图的 DDL\n\n```sql\nCREATE VIEW virtual_table AS\nSELECT column-1, column-2,\
  \ …, column-n\nFROM data_table\nWHERE column-n operator value\n```\n\n例如，要创建 `customer_personal_info`\
  \ 的视图，我们使用以下语句：\n\n```sql\nCREATE VIEW virtual_table AS\nSELECT column-1, column-2,\
  \ …, column-n\nFROM data_table\nWHERE column-n operator value\n```\n\n| cust_id\
  \ | first_nm | second_nm | lastname | sex | date_of_birth |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- |\n| 03051 | Mary | Ellen | Brown | Female | 1980-10-19 |\n\
  | 03231 | Juan | | Maslow | Female | 1978-11-18 |\n| 03146 | John | Ken | Pascal\
  \ | Male | 1983-07-12 |\n| 03347 | Alan | | Basal | Male | 1975-10-09 |\n\n### SQL\
  \ 连接与并集\n\n`INNER JOIN` 可以处理多个表。其语法如下：\n\n```sql\nSELECT column-1, column-2, …,\
  \ column-n\nFROM data-1\nINNER JOIN data-2\nON data-1.key = data-2.key\n```\n\n\
  例如，为了根据匹配的 `cust_id` 从 `customer_accounts`（表 4.1）和 `customer_personal_info`（表 4.2）中选择\
  \ `acct_no`、`first_name`、`surname`、`sex` 和 `acct_bal`，我们使用以下语句：\n\n```sql\nSELECT\
  \ a.acct_no, b.first_name AS first_name, b.lastname AS surname, b.sex, a.acct_bal\n\
  FROM customer_accounts AS a\nINNER JOIN customer_personal_info AS b\nON b.cust_id\
  \ = a.cust_id\n```\n\n表 4.1\n| acct_no | cust_id | acct_bal | acct_type | acct_opening_date\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 0411003 | 03231 | 2540.33 | 100 | 2000-11-04\
  \ |\n| 0412007 | 03146 | 10350.02 | 200 | 2000-09-13 |\n| 0412010 | 03347 | 7500.00\
  \ | 200 | 2002-12-05 |\n\n表 4.2\n| cust_id | first_nm | second_nm | lastname | sex\
  \ | date_of_birth | addr |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\
  | 03051 | Mary | Ellen | Brown | Female | 1980-10-19 | Coventry |\n| 03231 | Juan\
  \ | | Maslow | Female | 1978-11-18 | York |\n| 03146 | John | Ken | Pascal | Male\
  \ | 1983-07-12 | Liverpool |\n| 03347 | Alan | | Basal | Male | 1975-10-09 | Easton\
  \ |\n\n表 4.3\n| acct_no | first_name | surname | sex | acct_bal |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 0411003 | Juan | Maslow | Female | 2540.33 |\n\n\n\n\
  \n\n| 0412007 | John | Pascal | Male | 10350.02 |\n| 0412010 | Alan | Basal | Male\
  \ | 7500.00 |\n\n## 表 4.3\n\n### SQL RIGHT JOIN\n\n当与 SQL `select` 语句配合使用时，`RIGHT\
  \ JOIN` 会包含右数据表中的所有记录，即使在左数据表中没有找到匹配的记录。其用法语法如下：\n\n```sql\nSELECT column-1, column-2…\
  \ column-n\nFROM left-data_table\nRIGHT JOIN right-data-table\nON left-data_table.keyColumn\
  \ = right-data-table.foreign_keycolumn\n```\n\n例如，为了跨 `customer_accounts` 和 `customer_personal_info`\
  \ 两个表选择客户的 `acct_no`、`first_name`、`surname`、`sex` 和 `account_bal` 详情，无论他们是否有活跃账户都显示客户的个人信息。我们使用以下\
  \ SQL `RIGHT JOIN` 查询：\n\n```sql\nSELECT a.acct_no, b.first_nm AS first_name, b.lastname\
  \ AS surname, b.sex, a.acct_bal\nFROM customer_accounts AS a\nRIGHT JOIN customer_personal_info\
  \ AS b\nON b.cust_id = a.cust_id\n```\n\n执行上述 SQL `RIGHT JOIN` 查询的输出结果如表 4.4 所示：\n\
  \n| acct_no | first_name | surname | sex | acct_bal |\n| 0411003 | Juan | Maslow\
  \ | Female | 2540.33 |\n| 0412007 | John | Pascal | Male | 10350.02 |\n| 0412010\
  \ | Alan | Basal | Male | 7500.00 |\n| | Mary | Brown | Female | |\n\n## 表 4.4\n\
  \n### SQL LEFT JOIN\n\n`LEFT JOIN` 与 SQL `select` 语句配合使用，返回左数据表（第一个表）中的所有记录，即使在相关的右表（第二个表）中没有找到匹配项。其用法语法如下：\n\
  \n```sql\nSELECT column-1, column-2… column-n\nFROM left-data_table\nLEFT JOIN right-data-table\n\
  ON left-data_table.keyColumn = right-data-table.foreign_keycolumn\n```\n\n例如，为了跨\
  \ `customer_accounts` 和 `customer_personal_info` 表显示所有活跃账户持有人的详情，我们使用以下 SQL `LEFT\
  \ JOIN` 查询：\n\n```sql\nSELECT a.acct_no, b.first_nm AS first_name, b.lastname AS\
  \ surname, b.sex, a.acct_bal\nFROM customer_accounts AS a\nLEFT JOIN customer_personal_info\
  \ AS b\nON b.cust_id = a.cust_id\n```\n\n上述 SQL `LEFT JOIN` 查询将产生表 4.5 所示的结果集：\n\
  \n| acct_no | first_name | surname | sex | acct_bal |\n| 0411003 | Juan | Maslow\
  \ | Female | 2540.33 |\n| 0412007 | John | Pascal | Male | 10350.02 |\n| 0412010\
  \ | Alan | Basal | Male | 7500.00 |\n\n## 表 4.5\n\n### SQL UNION 命令\n\n两个或多个 SQL\
  \ `select` 语句的结果集可以使用 `UNION` 命令进行合并。其用法语法如下：\n\n```sql\nSELECT column-1, column-2…\
  \ column-n\nFROM data_table-1\nUNION\nSELECT column-1, column-2… column-n\nFROM\
  \ data_table-2\n```\n\n例如，为了显示我们虚拟银行在英国和美国分行的客户列表，你可以根据表 4.6 和表 4.7，为在两个分行都有账户的客户显示一条记录：\n\
  \n| acct_no | first_name | surname | sex | acct_bal |\n| 0411003 | Juan | Maslow\
  \ | Female | 2540.33 |\n| 0412007 | John | Pascal | Male | 10350.02 |\n| 0412010\
  \ | Alan | Basal | Male | 7500.00 |\n\n## 表 4.6 London_Customers\n\n| acct_no |\
  \ first_name | surname | sex | acct_bal |\n| 0413112 | Deborah | Johnson | Female\
  \ | 4500.33 |\n| 0414304 | John | Pascal | Male | 13360.53 |\n| 0414019 | Rick |\
  \ Bright | Male | 5500.70 |\n| 0413014 | Authur | Warren | Male | 220118.02 |\n\n\
  ## 表 4.7 Washington_Customers\n\n我们使用以下 SQL 查询：\n\n```sql\nSELECT first_name, surname,\
  \ sex, acct_bal\nFROM London_Customers\nUNION\nSELECT first_name, surname, sex,\
  \ acct_bal\nFROM Washington_Customers\n```\n\n执行上述 SQL 查询的输出结果如下：\n\n| first_name\
  \ | surname | sex | acct_bal |\n| Juan | Maslow | Female | 2540.33 |\n| John | Pascal\
  \ | Male | 10350.02 |\n| Alan | Basal | Male | 7500.00 |\n| Deborah | Johnson |\
  \ Female | 4500.33 |\n| John | Pascal | Male | 13360.53 |\n| Rick | Bright | Male\
  \ | 5500.70 |\n| Authur | Warren | Male | 220118.02 |\n\n\n\n\n列有一个名为“可空性”（nullability）的属性。该属性显示列是否可以接受未知值。在\
  \ SQL 中，列被设置为接受空值（null）。不过，你可以根据需要更改此属性。要禁用列的可空性，你只需要使用 `NOT NULL` 约束即可。该约束告诉 SQL\
  \ 该列将不接受任何空值。\n\n在此语言中，你需要在列上直接使用 `NOT NULL`。这意味着你不能在断言（assertion）、域约束（domain constraint）或表约束上使用此约束。使用\
  \ `NOT NULL` 是一个简单的过程。只需在你的列定义中添加以下语法即可：\n\n`(列名) [ (域) | (数据类型) ] NOT NULL`\n\n\
  例如，假设你需要创建一个名为 `FICTION_NOVEL_AUTHORS` 的表。该表需要有三列：`AUTHOR_ID`、`AUTHOR_NAME` 和 `AUTHOR_DOB`。你需要确保添加的每条条目在\
  \ `AUTHOR_ID` 和 `AUTHOR_NAME` 上都有值。为了实现这一点，你必须在两个列的定义中都插入 `NOT NULL` 约束。代码如下：\n\n\
  ```\nCREATE TABLE FICTION_NOVEL_AUTHORS\n( AUTHOR_ID      INT      NOT NULL ,\n\
  \  AUTHOR_NAME      CHARACTER(50)   NOT NULL ,\n  AUTHOR_DOB      CHARACTER(50))\
  \ ;\n```\n\n你可以看到，这段代码没有为 `AUTHOR_DOB` 列设置 `NOT NULL`。因此，如果新条目没有 `AUTHOR_DOB` 的任何值，系统将在该列中插入一个空值。\n\
  \n### 唯一约束 (Unique Constraint)\n\n表约束和列约束都接受唯一约束。在 SQL 中，唯一约束属于以下两种类型之一：\n\n1. `UNIQUE`\n\
  2. `PRIMARY KEY`\n\n注意：本书的这部分将重点关注第一类型。你稍会学习第二种。\n\n基本上，你可以使用 `UNIQUE` 来确保某一列不接受重复值。此约束将阻止你输入列中已经存在的值。\n\
  \n假设你想将此约束应用到 `AUTHOR_DOB` 列上。这样，你就可以确保该列中的值都是唯一的。现在，假设你意识到要求出生日期是一个坏主意，因为人们可能出生在同一天。你可以通过将\
  \ `UNIQUE` 约束放置在 `AUTHOR_NAME` 和 `AUTHOR_DOB` 上来调整方法。在这里，表将阻止你重复一个 `AUTHOR_NAME`/`AUTHOR_DOB`\
  \ 组合。你可以在 `AUTHOR_NAME` 和 `AUTHOR_DOB` 列中重复值。但是，你不能重新输入一个表中已存在的完全相同的组合。\n\n请记住，你可以将\
  \ `UNIQUE` 约束标记为表约束或列约束。要生成列约束，请将它们添加到列的定义中。语法如下：\n\n`(列名) [ (域) | (数据类型) ] UNIQUE`\n\
  \n如果你需要在表上使用 `UNIQUE` 约束，你必须将其作为一个元素插入到表定义中。代码如下：\n\n```\n{ CONSTRAINT (约束名) }\n\
  UNIQUE < (列名) { [, (列名) ] … } >\n```\n\n如上述语法所示，在表上使用 `UNIQUE` 比在列上使用该约束要复杂。然而，你不能在多个列上（单独）应用\
  \ `UNIQUE`。无论你如何使用此约束（即无论是作为表约束还是列约束），你可以在每个表定义中定义任意数量的 `UNIQUE` 约束。\n\n让我们在列级上应用此约束：\n\
  \n```\nCREATE TABLE BOOK_LIBRARY\n( AUTHOR_NAME      CHARACTER (50) ,\n  BOOK_TITLE\
  \      CHARACTER (70) UNIQUE,\n  PUBLISHED_DATE  INT ) ;\n```\n\n你也可以在其他列上使用 `UNIQUE`。然而，其结果与我们在多个列上使用表约束的结果不同。以下代码将说明这一观点：\n\
  \n```\nCREATE TABLE BOOK_LIBRARY\n( AUTHOR_NAME      CHARACTER (50) ,\n  BOOK_TITLE\
  \      CHARACTER (70) ,\n  PUBLISHED_DATE  INT,\n  CONSTRAINT UN_AUTHOR_BOOK UNIQUE\
  \ ( AUTHOR_NAME, BOOK_TITLE ) ) ;\n```\n\n现在，为了让表接受新条目，`AUTHOR_NAME` 和 `BOOK_TITLE`\
  \ 列必须具有唯一的值。\n\n正如你之前读过的，`UNIQUE` 约束确保一个或多个列没有重复值。这是一个需要记住的重要规则。但是，你还应该知道 `UNIQUE`\
  \ 对“空值”不起作用。因此，即使你在某一列上设置了 `UNIQUE` 约束，该列也会接受任意数量的空值。\n\n如果你想让你的列不接受空值，必须使用 `NOT\
  \ NULL`。让我们在 `BOOK_TITLE` 的列定义上应用 `NOT NULL`：\n\n```\nCREATE TABLE BOOK_LIBRARY\n\
  ( AUTHOR_NAME      CHARACTER (50) ,\n  BOOK_TITLE      CHARACTER (70) NOT NULL,\n\
  \  PUBLISHED_DATE  INT ) ;\n```\n\n### 主键约束 (PRIMARY KEY Constraint)\n\n`PRIMARY\
  \ KEY` 约束与 `UNIQUE` 约束几乎相同。你可以使用 `PRIMARY KEY` 防止重复条目。此外，你可以将其应用于多个列，并将其作为表约束或列约束使用。唯一的区别是\
  \ `PRIMARY KEY` 有两个不同的限制：\n\n如果你在列上应用 `PRIMARY KEY`，该列将不接受空值。基本上，一个表不能有多个 `PRIMARY\
  \ KEY` 约束。\n\n你需要从数据库的候选键中选择一个主键。基本上，候选键是能够唯一标识标识的列组。你可以使用 `UNIQUE` 或 `PRIMARY KEY`\
  \ 来强制执行候选键的唯一性。然而，即使你没有定义任何约束，也必须在每个表上放置一个主键。\n\n要定义主键，你需要指定你想使用的列。你可以通过 `PRIMARY\
  \ KEY`（即 SQL 关键字）完成此任务。此过程与上一节讨论的过程类似。要在新列上应用 `PRIMARY KEY`，请使用以下语法：\n\n`(列名) [\
  \ (域) | (数据类型) ] PRIMARY KEY`\n\n要在表上使用 `PRIMARY KEY`，你必须将其作为你正在操作的表的元素。检查下面的语法：\n\
  \n```\n{ CONSTRAINT (约束名) }\nPRIMARY KEY < (列名) {, (列名) ] } >\n```\n\nSQL 允许你使用列约束定义主键。然而，你只能在单列上使用此功能。分析以下示例：\n\
  \n```\nCREATE TABLE FICTION_NOVEL_AUTHORS\n( AUTHOR_ID INT,\n  AUTHOR_NAME CHARACTER\
  \ (50) PRIMARY KEY,\n  PUBLISHER_ID INT ) ;\n```\n\n如果你想在多个列上应用 `PRIMARY KEY`（或将其存储为另一种定义），你可以在表级上使用它：\n\
  \n```\nCREATE TABLE FICTION_NOVEL_AUTHORS\n( AUTHOR_ID   INT,\n  AUTHOR_NAME CHARACTER\
  \ (50) ,\n  PUBLISHER_ID INT,\n  CONSTRAINT PK_AUTHOR_ID PRIMARY KEY (AUTHOR_ID,\
  \ AUTHOR_NAME ) ) ;\n```\n\n\n\n这种方法将主键设置在两列上（即 `AUTHOR_ID` 和 `AUTHOR_NAME`）。这意味着这两列的配对值必须是唯一的。然而，任何一列内部都可能存在重复值。经验丰富的数据库用户将这种主键称为“超级键”（superkey）。“超级键”一意味着主键的列数超过了所需的列数。\n\
  \n在大多数情况下，你需要在表上同时设置 `UNIQUE` 和 `PRIMARY KEY` 约束。要实现这一点，你只需要像平时一样定义相关的约束。例如，下面的代码应用了这两个约束：\n\
  \n```sql\nCREATE TABLE FICTION_NOVEL_AUTHORS\n(AUTHOR_ID INT,\nAUTHOR_NAME CHARACTER\
  \ (50) PRIMARY KEY ,\nPUBLISHER_ID INT,\nCONSTRAINT UN_AUTHOR_NAME UNIQUE (AUTHOR_NAME)\
  \ ) ;\n```\n\n接下来的代码将给你相同的结果：\n\n```sql\nCREATE TABLE FICTION_NOVEL_AUTHORS\n(AUTHOR_ID\
  \ INT,\nAUTHOR_NAME CHARACTER (50) -> UNIQUE,\nPUBLISHER_ID INT,\nCONSTRAINT PK_PUBLISHER_ID\
  \ PRIMARY KEY (PUBLISHER_ID) ) ;\n```\n\n## FOREIGN KEY 约束\n\n目前为止讨论的约束侧重于确保表的数据完整性。`NOT\
  \ NULL` 防止列取空值。而 `PRIMARY KEY` 和 `UNIQUE` 则保证了一列或多列的值的值是唯一的。在这方面，`FOREIGN KEY`（即另一种\
  \ SQL 约束）是不同的。`FOREIGN KEY` 也称为“引用约束”，它侧重于表内部的信息如何与另一个表中的信息相互作用。\n\n这种连接确保了整个数据库的信息完整性。此外，不同表之间的连接导致了“引用完整性”。这种完整性确保了在一个表上进行的数据操纵不会影响其他表中的数据。给出的表将帮助你理解这个主题。这里的每一个名为\
  \ `PRODUCT_NAMES` 和 `PRODUCT_MANUFACTURERS` 的表各有一个主键：\n\n### PRODUCT_NAMES\n| PRODUCT_NAME_ID:\
  \ INT | PRODUCT_NAME:CHARACTER (50) | MANUFACTURER_ID: INT |\n| :--- | :--- | :---\
  \ |\n| 1001 | X Pen | 91 |\n| 1002 | Y Eraser | 92 |\n| 1003 | Z Notebook | 93 |\n\
  \n### PRODUCT_MANUFACTURERS\n| MANUFACTURER_ID: INT | BUSINESS_NAME:CHARACTER (50)\
  \ |\n| :--- | :--- |\n| 91 | THE PEN MAKERS INC. |\n| 92 | THE ERASER MAKERS INC.\
  \ |\n| 93 | THE NOTEBOOK MAKERS INC. |\n\n`PRODUCT_NAMES` 表的 `PRODUCT_NAME_ID` 列具有\
  \ `PRIMARY KEY`。`PRODUCT_MANUFACTURERS` 表的 `MANUFACTURER_ID` 具有相同的约束。这些列是黄色（见上表）。\n\
  \n如你所示，`PRODUCT_NAMES` 表有一个名为 `MANUFACTURER_ID` 的列。该列拥有 `PRODUCT_MANUFACTURERS`\
  \ 表中某列的值。实际上，`PRODUCT_NAMES` 表的 `MANUFACTURER_ID` 列只能接受来自 `PRODUCT_MANUFACTURERS`\
  \ 表中 `MANUFACTURER_ID` 列的值。\n\n此外，你对 `PRODUCT_NAMES` 表所做的更改可能会影响存储在 `PRODUCT_MANUFACTURERS`\
  \ 表中的数据。如果你删除了一个制造商，也需要从 `PRODUCT_NAMES` 表的 `MANUFACTURER_ID` 列中删除该条目。你可以通过使用 `FOREIGN\
  \ KEY` 实现这一点。该约束通过防止对任何表的操作影响受保护的信息，确保你的数据库的引用完整性。\n\n**重要说明：** 如果一个表有一个外键，它被称为“引用表”（referencing\
  \ table）。外键指向的表被称为“被引用表”（referenced table）。\n\n在创建这种约束时，你需要遵循以下指南：\n\n1. 你必须使用 `PRIMARY\
  \ KEY` 或 `UNIQUE` 定义一个被引用列。大多数 SQL 程序员为此此目的选择 `PRIMARY KEY`。\n2. 你可以将 `FOREIGN KEY`\
  \ 约束标记为列约束或表约束。如果你将 `FOREIGN KEY` 作为表约束，你可以处理任意数量的列。相反，如果你在列级使用此约束，你只能处理单个列。\n3.\
  \ 引用表的外键应该涵盖你尝试引用的所有列。此外，引用表的列应与其对等的列（即被引用的列）的数据类型匹配。然而，你不需要为引用列和被引用列使用相同的名称。\n\
  4. 你不需要手动指示引用列。如果你没有为约束指定任何列，SQL 将认为被引用表的主键列为引用列。这一过程是自动完成的。一旦你分析了下面提供的示例，你就会理解这些指南了。现在，让我们分析该约束的语法。以下是你在列级应用\
  \ `FOREIGN KEY` 必须使用的格式：\n\n```sql\n(name of column) [ (domain) | (data type) ]\
  \ { NOT NULL }\nREFERENCES (name of the referenced table) { < (the referenced columns)\
  \ > }\n{ MATCH [ SIMPLE | FULL | PARTIAL ] }\n{ (the referential action) }\n```\n\
  \n要将此 `FOREIGN KEY` 作为表约束，你需要将其作为表元素插入。这里是语法：\n\n```sql\n{ CONSTRAINT (name of constraint)\
  \ }\nFOREIGN KEY < (the referencing column) { [, (the referencing column) ] } >\n\
  REFERENCES (the referenced table)\n{ MATCH [ SIMPLE | FULL | PARTIAL ] }\n} \n```\n\
  \n你可能注意到 `FOREIGN KEY` 比你之前看到的约束要复杂。这种复杂性源于约束包含选项的语法。然而，生成这种约束很容易。让我们先分析一个示例：\n\n\
  ```sql\nCREATE TABLE PRODUCT_NAMES\n(PRODUCT_NAME_ID INT,\nPRODUCT_NAME CHARACTER\
  \ (50),\nMANUFACTURER_ID INT) ;\n```\n\n这段代码将约束应用在 `MANUFACTURER_ID` 上。要在表上应用此约束，你只需要输入\
  \ `REFERENCES` 并指示被引用表的名称。此外，外键的列与被引用表的列相等。例如，`REFERENCES PRODUCT_MANUFACTURERS\
  \ (MANUFACTURER_ID)`\n\n**重要说明：** `FOREIGN KEY` 约束需要一个存在的被引用表。此外，该表必须具有 `PRIMARY\
  \ KEY` 或 `UNIQUE` 约束。\n\n对于第二个示例，你使用 `FOREIGN KEY` 作为表约束。你看到的代码指定了被引用列的名称，即使该信息并不是必须的：\n\
  \n```sql\nCREATE TABLE PRODUCT_NAMES\n(PRODUCT_NAME_ID INT,\nPRODUCT_NAME CHARACTER\
  \ (50),\nMANUFACTURER_ID INT,\nCONSTRAINT TS_MANUFACTURER_ID FOREIGN KEY (MANUFACTURER_ID)\n\
  REFERENCES PRODUCT_MANUFACTURERS (MANUFACTURER_ID) ) ;\n```\n\n\n\n\n就是这样。一旦你定义了这个约束，`PRODUCT_NAMES`\
  \ 表的 `MANUFACTURER_ID` 列将只接受在 `PRODUCT_MANUFACTURERS` 表的主键中已列出的值。如你所见，外键不需要持有唯一值。你可以根据意愿在外键中重复这些值，除非你对正在操作的列上设置了\
  \ `UNIQUE`（唯一）约束。\n\n现在，让我们将此约束应用到多个列上。在学习约束语法的其余元素之前，你应该掌握这项技术。对于这个示例，让我们使用两个表：`BOOK_AUTHORS`\
  \ 和 `BOOK_GENRES`。\n\n名为 `BOOK_AUTHORS` 的表在 `AUTHOR_NAME` 和 `AUTHOR_DOB` 列上定义了主键。下方的\
  \ SQL 语句将生成一个名为 `BOOK_GENRES` 的表。该表有一个由 `AUTHOR_DOB` 和 `DATE_OF_BIRTH` 列组成的外键。\n\
  \n```sql\nCREATE TABLE BOOK_GENRES\n(AUTHOR_NAME      CHARACTER (50) ,\nDATE_OF_BIRTH\
  \    DATE,\nGENRE_ID      INT,\nCONSTRAINT TS_BOOK_AUTHORS FOREIGN KEY ( AUTHOR_NAME,\
  \ DATE_OF_BIRTH ) REFERENCES BOOK_AUTHORS (AUTHOR_NAME, AUTHOR_DOB) ) ;\n```\n\n\
  这段代码包含一对被引用列（即 `AUTHOR_NAME`、`AUTHOR_DOB`）和一对引用列（即 `AUTHOR_NAME` 和 `DATE_OF_BIRTH`）。数据表中名为\
  \ `AUTHOR_NAME` 的列包含相同类型的数据。`DATE_OF_BIRTH` 列的数据类型与 `AUTHOR_DOB` 相同。如此示例所示，被引用列的名称不需要与其对应的列列匹配。\n\
  \n## MATCH 部分\n\n现在，让我们讨论约束语法的另一部分：\n\n`{ MATCH [ SIMPLE | FULL | PARTIAL ] }`\n\
  \n大括号表示该子句是可选的。该子句的主要功能允许你在考虑可能向引用列添加的值时，选择如何处理外键列中的空值（null）。该子句不适用于接受空值的列。\n\n\
  这部分语法提供了三种选择：\n\n- **SIMPLE**（简单）—— 如果你选择此选项，并且你的引用列中至少有一个空值，那么你可以在剩余的引用列中放置任何值。如果你在定义\
  \ `FOREIGN KEY` 时没有指定 `MATCH` 部分，系统会自动触发此选项。\n- **FULL**（全）—— 此选项要求你所有的引用列都接受空值；否则，它们中的任何一个不能接受空值。\n\
  - **PARTIAL**（部分）—— 使用此选项，如果其他引用列包含与其各自的被引用列匹配的值，你可以在你的引用列中放置空值。\n\n## (referential\
  \ action 引用操作) 部分\n\n这是 `FOREIGN KEY` 语法的最后部分。与 `MATCH` 部分一样，“引用操作”也是完全可选的。你可以使用此子句来指定在更新或删除一个或多个被引用列中的信息时采取什么操作。\n\
  \n例如，假设你想从某个表的主键中删除一个条目。如果外键引用了你正在操作的主键，你预期的操作将违反约束。因此，你应该始终在被引用列中包含你的引用列的数据。\n\n\
  使用此子句时，你将为引用表的定义设置一个特定的操作。当被引用表发生变化时，该操作就会发生。\n\n`ON UPDATE (the referential action)\
  \ { ON DELETE (the referential action) } | ON DELETE (the referential action) {\
  \ ON UPDATE (the referential action) } (referential action) ::= RESTRICT | SET NULL\
  \ | CASCADE | NO ACTION | SET DEFAULT`\n\n根据此语法，你可以设置 `ON DELETE`、`ON UPDATE` 或两者都有。这些子句可以接受以下操作之一：\n\
  \n- **RESTRICT**（限制）—— 此引用操作防止你执行可能违反 `FOREIGN KEY` 约束的更新或删除。引用列中的信息不能违反 `FOREIGN\
  \ KEY`。\n- **SET NULL**（置空）——如果对应的被引用列被删除或更新，此操作将引用列的值更改为“null”。\n- **CASCADE**（级联）——通过此引用操作，你对被引用列所做的更改也将应用于其引用列。\n\
  - **NO ACTION**（无操作）——与 `RESTRICT` 类似，`NO ACTION` 阻止你执行违反 `FOREIGN KEY` 的操作。主要区别在于\
  \ `NO ACTION` 允许你在执行 `SQL` 命令期间发生违反。然而，一旦命令执行完毕，你的外键信息将不会被违反。\n- **SET DEFAULT**（设置默认值）——通过此选项，你可以通过更新或删除相应被引用列中的数据，将引用列设置为其默认值。如果你的引用列没有默认值，则此引用操作将不起。\n\
  \n要使用此子句，只需将其插入到 `FOREIGN KEY` 定义的最后部分。这里有一个示例：\n\n```sql\nCREATE TABLE AUTHORS_GENRES\n\
  ( AUTHOR_NAME      CHARACTER (50) ,\nDATE_OF_BIRTH    DATE,\nGENRE_ID      INT,\n\
  CONSTRAINT TS_BOOK_AUTHORS FOREIGN KEY ( AUTHOR_NAME, DATE_OF_BIRTH ) REFERENCES\
  \ BOOK_AUTHORS ON DELETE RESTRICT ON UPDATE RESTRICT ) ;\n```\n\n## CHECK 约束\n\n\
  你可以将此约束应用于表、列、域（domain）或断言（assertion）内部。此约束允许你设置值。\n\n根据 SQL 程序员的说法，`CHECK` 约束是最复杂且灵活的。要在列中使用\
  \ `CHECK`，请在列定义中添加以下语法：\n\n`name [ domain | data type ] CHECK condition`\n\n如果你想在表上使用此约束，将以下语法插入到表定义中：\n\
  \n`{ CONSTRAINT name } CHECK condition`\n\n注意：你稍将学习如何在断言上使用此约束。如此语法所示，`CHECK` 很容易理解。然而，它的搜索条件可能涉及复杂的值。此约束会对尝试修改受\
  \ `CHECK` 保护列内部信息的 `SQL` 命令测试指定的条件。如果测试结果为 `TRUE`，命令将运行；如果结果为 `false`，系统将取消命令并显示错误信息。\n\
  \n在下面的示例中，`CHECK` 定义了可以在列中输入的最大值最小值。此表定义生成了一个 CHECK 约束和三列：\n\n```sql\nCREATE TABLE\
  \ BOOK_TITLES\n( BOOK_ID      INT,\nBOOK_TITLE    CHARACTER (50) NOT NULL,\nSTOCK_AVAILABILITY\
  \    INT,\nCONSTRAINT TS_STOCK_AVAILABILITY ( STOCK_AVAILABILITY < 50 AND STOCK_AVAILABILITY\
  \ > 1 ) ) ;\n```\n\n生成的表将拒绝 1-50 范围之外的值。这是该表的另一种写法：\n\n```sql\nCREATE TABLE BOOK_TITLES\n\
  ( BOOK_ID      INT,\nBOOK_TITLE    CHARACTER (50) NOT NULL,\nSTOCK_AVAILABILITY\
  \    INT CHECK ( STOCK_AVAILABILITY < 50 AND STOCK AVAILABILITY > 1 ) ) ;\n```\n\
  \n\n\n\n现在，让我们来分析这些语句的条件句。该子句告诉 SQL，所有添加到 `STOCK_AVAILABILITY` 列的值都必须小于 50。关键字 `AND`\
  \ 告诉 SQL 还有一个必须应用的条件。最后，该子句告诉 SQL，添加到上述列的每个值都应该大于 1。简单来说，每个值都应该小于 50 且大于 1。\n\n\
  这种约束还允许你简单地列出“可接受的值”。对于那些不会经常更改的值，SQL 用户认为这是一项非常强大的选项。在下一个示例中，你将使用 `CHECK` 约束来定义书籍的类型：\n\
  \n```sql\nCREATE TABLE BOOK_TITLES\n( BOOK_ID       INT,\nBOOK_TITLE      CHARACTER\
  \ (50) ,\nGENRE           CHAR (10) ,\nCONSTRAINT TS_GENRE CHECK ( GENRE IN ( '\
  \ DRAMA ' , ' HORROR ' , ' SELF HELP ' , ' ACTION ' , ' MYSTERY ' , ' ROMANCE '\
  \ ) ) ) ;\n```\n\n`GENRE` 列中的每个值都应该包含在条件中列出的类型中。如你所见，这条语句使用了 `IN`（即一种 SQL 算符）。基本上，`IN`\
  \ 确保 `GENRE` 内部的值包含在列出的项目中。\n\n这种约束可能会非常困惑，因为涉及很多括号。你可以通过将 SQL 代码拆分为多行来简化代码。例如，让我们重写一下上面的代码：\n\
  \n```sql\nCREATE TABLE BOOK_TITLES\n(\nBOOK_ID       INT,\nBOOK_TITLE      CHAR\
  \ (50) ,\nGENRE           CHAR (10) ,\nCONSTRAINT TS_GENRE CHECK\n(\nGENRE IN\n\
  ( 'DRAMA ' , ' HORROR ' , ' SELF HELP ' , ' ACTION ' , ' MYSTERY ' , ' ROMANCE '\n\
  )\n)\n) ;\n```\n\n这种编写 SQL 命令的风格确保了代码的可读性。在此处，你需要对括号及其内容进行缩进，以便清晰地显示它们在 SQL 语句不同层次中的位置。通过使用这种风格，你可以快速识别位于每对括号中的子句。此外，这条语句的作用与上一个相同。这种风格的缺点是需要使用大量的空格。\n\
  \n让我们分析另一个示例：\n\n```sql\nCREATE TABLE BOOK_TITLES\n( BOOK_ID       INT,\n  BOOK_TITLE\
  \      CHAR (50) ,\n  STOCK_AVAILABILITY    INT,\n  CONSTRAINT TS_STOCK_AVAILABILITY\
  \ CHECK ( ( STOCK_AVAILABILITY BETWEEN 1 AND 50 ) OR ( STOCK_AVAILABILITY BETWEEN\
  \ 79 AND 90 ) ) ) ;\n```\n\n这段代码使用 `BETWEEN`（即另一种 SQL 算符）来设置一个包含最低和最高点的范围。因为它有两个范围，所以它使用括号将范围规范分开。`OR`\
  \ 关键字连接了这些范围规范。基本上，`OR` 告诉 SQL 需要满足其中一个条件。因此，你在名为 `STOCK_AVAILABILITY` 列中输入的值应该是\
  \ 1 到 50 之间，或者 79 到 90 之间。\n\n## 如何定义断言 (Assertion)\n\n断言（Assertions）是你可以应用于多个表的\
  \ `CHECK` 约束。由于由于，你不能在定义表时创建断言。以下是在创建断言时必须使用的语法：\n\n```sql\nCREATE ASSERTION (name\
  \ of constraint) CHECK (the search conditions)\n```\n\n定义断言与定义表级 `CHECK` 约束类似。在输入\
  \ `CHECK` 后，你需要指定搜索条件。\n\n让我们分析一个新示例。假设 `BOOK_TITLES` 表有一个列用于存储库存书籍的数量。该表的总和应该始终低于你预期的库存。这个示例使用断言来检查\
  \ `STOCK_AVAILABILITY` 列的总和是否小于 3000。\n\n```sql\nCREATE ASSERTION LIMIT_STOCK_AVAILABILITY\
  \ CHECK ( ( SELECT SUM (STOCK_AVAILABILITY) FROM BOOK_TITLES ) < 3000 ) ;\n```\n\
  \n这条语句使用了一个子查询（即 `SELECT SUM (STOCK_AVAILABILITY) FROM BOOK_TITLES`）并将其与 3000 进行比较。子查询以\
  \ SQL 关键字 `SELECT` 开始，它用于从任何表中查询信息。名为 `SUM` 的 SQL 函数累加了 `STOCK_AVAILABILITY` 内部的所有值。另一方面，`FROM`\
  \ 关键字设置了持有该表的列。系统随后会将子查询的结果与 3000 进行比较。如果你向 `STOCK_AVAILABILITY` 列中添加一条使总和超过 3000\
  \ 的记录，你将收到错误消息。\n\n## 如何创建域 (Domain) 和域约束\n\n如前所述，你也可以将 `CHECK` 约束插入到你的域定义中。这种约束与你之前看到的相似。唯一的区别在于你没有将域约束绑定到特定的表或列上。实际上，域约束使用另一个\
  \ SQL 关键字 `VALUE` 来引用为该域指定的列内部的值。现在，让我们讨论一下你生成新域时所需的语法：\n\n```sql\nCREATE DOMAIN\
  \ (name of domain) AS (type of data)\n{ DEFAULT (default value) }\n{ CONSTRAINT\
  \ (name of constraint) } CHECK (the search condition)\n```\n\n这种语法包含你以前见过的元素。在下面的示例中，你将生成一个\
  \ `INT` 类型：\n\n```sql\nCREATE DOMAIN BOOK_QUANTITY AS INT\nCONSTRAINT TS_QUANTITY\
  \ CHECK (VALUE BETWEEN 1 AND 50)\n```\n\n# 第章：如何创建视图 (View)\n\n“你可以通过回答判断一个人是否聪明……你可以通过问题判断一个人是否明智。”\
  \ —— 纳吉布·马哈福\n\n你的数据库使用“持久化”（即永久性）表来存储 SQL 信息。然而，如果你只想检查特定的条目，持久化表可能是不实用的。因此，SQL\
  \ 语言允许你使用“视图”（也称为视图表）。\n\n视图是作为模式对象的虚拟表。视图与持久化表的主要区别在于前者不存储任何数据——只有定义存储。这种定义允许根据查询语句从表中选择特定的数据。调用视图就像调用普通表一样。\n\
  \n## 如何向数据库中添加视图\n\n当你尝试访问各种信息时，视图非常有用。如果你使用视图，可以定义复杂的查询并将它们存在视图定义中。与其每次使用都输入查询，不如直接调用视图。此外，视图允许向其他人展示数据而不显示任何不需要的信息。\n\
  \n例如，你可能需要允许某些用户访问员工记录的部分。但你不希望这些用户访问 `SSN`（即社会安全号）或薪资率。在这里，你可以生成只显示用户数据的视图。\n\n\
  ## 如何定义 SQL 视图\n\n在 SQL 中，你可以创建的最简单视图指向单个表并收集信息而不做更改。这是视图的基本语法：\n\n```sql\nCREATE\
  \ VIEW (name of view) { < (name of the view's columns) }\nAS (the query)\n{ WITH\
  \ CHECK OPTION }\n```\n\n注意：本书这部分关注格式的第一行和第二行。你稍后会学习第三行。\n\n你需要在定义的第一部分设置视图的名称。此外，当你面临以下任何情况时，你应该为视图的列命名：\n\
  \n\n\n\n\n如果你需要执行某些操作来获取列的值，而不仅仅是从表中直接复制它们。\n\n如果你正在处理重复的列名。这种情况通常发生在合并表时。\n\n即使你不需要，你也可以为你的列设置名称。例如，你可以为列分配逻辑名称，这样即使是缺乏经验的用户也能理解它们。\n\
  \n格式的第二部分包含一个强制性关键字（即 `AS`）和一个用于查询的占位符。尽管看起来很简单，但查询占位符可能涉及复杂的 SQL 语句结构，以执行不同的操作。\n\
  \n让我们来分析一个基础示例：\n\n```sql\nCREATE VIEW BOOKS_IN_STOCK\n( BOOK_TITLE, AUTHOR, STOCK_AVAILABILITY\
  \ ) AS\nSELECT BOOK_TITLE, AUTHOR, STOCK_AVAILABILITY\nFROM BOOK_INVENTORY\n```\n\
  \n这个示例是你可以创建的最简单的视图之一。它从一个表中获取三列。记住，SQL 在处理换行符和空格方面并不严格。例如，在创建视图时，你可以将列名（如果适用）列在单独的一行。数据库管理系统不在乎你使用哪种编码技术。然而，你可以通过采用特定的编码风格来确保代码的可读性。\n\
  \n现在，让我们剖析上面的示例代码。第一部分将 `BOOKS_IN_STOCK` 设置为视图名称。第二部分设置了列的名称并包含了 SQL 关键字 `AS`。\n\
  \n如果你不指定想要使用的名称，视图的列将直接复制表列的名称。最后两行持有查询表达式，这是一个 `SELECT` 语句。在这里：\n\n```sql\nSELECT\
  \ BOOK_TITLE, AUTHOR, STOCK_AVAILABILITY\nFROM BOOK_INVENTORY\n```\n\n`SELECT` 是灵活且广泛的：它允许你编写复杂的查询，以提供所需的确切信息。\n\
  \n这个示例的 `SELECT` 语句是基础的。它只有两个句：`SELECT` 和 `FROM`。第一个句设置要返回的列。然而，第二个句设置了提取信息的表。一旦你调用\
  \ `BOOKS_IN_STOCKS` 视图，你实际上是在调用视图中嵌入的 `SELECT` 命令。此操作从正确的表/表中获取信息。\n\n对于第二个示例，让我们创建一个带有额外子句的视图：\n\
  \n```sql\nCREATE VIEW BOOKS_IN_STOCK_80s\n( BOOK_TITLE, YEAR_PUBLISHED, STOCK_AVAILABILITY\
  \ ) AS\nSELECT BOOK_TITLE, YEAR_PUBLISHED, STOCK_AVAILABILITY\nFROM BOOK_INVENTORY\n\
  WHERE YEAR_PUBLISHED >1979 AND YEAR_PUBLISHED < 1990;\n```\n\n最后一个子句设置了系统检索数据时必须满足的标准。唯一的区别是，它不是提取作者信息，而是根据每本书的出版年份过滤搜索结果。\n\
  \n**重要注意：** 最后一个子句的内容不会以任何方式影响源表。它们只对视图返回的信息起作用。\n\n你可以在 `SELECT` 语句中使用 `WHERE`\
  \ 来设置不同类型的标准。例如，你可以使用此子句来合并表。查看以下代码：\n\n```sql\nCREATE VIEW BOOK_PUBLISHERS\n(BOOK_TITLE,\
  \ PUBLISHER_NAME ) AS\nSELECT BOOK_INVENTORY .BOOK_TITLE, TAGS .PUBLISHER_NAME\n\
  FROM BOOK_INVENTORY, TAGS\nWHERE BOOK_INVENTORY .TAG_ID = TAGS .TAG_ID;\n```\n\n\
  这段代码创建了一个名为 `BOOK_PUBLISHERS` 的视图。`BOOK_PUBLISHERS` 视图包含两列：`BOOK_TITLE` 和 `PUBLISHER_NAME`。通过此视图，你从两个不同的来源获取数据：(1)\
  \ `BOOK_INVENTORY` 表的 `BOOK_TITLE` 列和 (2) `TABS` 表的 `PUBLISHER_NAME` 列。\n\n现在，让我们关注第三个子句（即\
  \ `SELECT` 语句）。该子句根据其各自表的名称对列进行限定符说明（例如 `BOOK_INVENTORY .BOOK_TITLE`）。如果你正在连接表，你需要指定每个表的名称以避免混淆。显然，如果列有重复名称，可能会非常困惑。然而，如果你处理的是简单的列名，可以省略表名。例如，你的\
  \ `SELECT` 子句可能像这样：\n\n```sql\nSELECT BOOK_TITLE, PUBLISHER_NAME\n```\n\n现在，让我们讨论语句的\
  \ `FROM` 部分。在合并表时，你需要命名所有想要使用的表并用逗号分隔条目。除了对重复名称的担忧，该子句与之前的示例相同。\n\n`WHERE` 是该语句的最后一个子句，用于匹配数据行。这个子句非常重要，因为如果你不使用它，将无法匹配从不同表中收集的值。在当前示例中，`BOOK_INVENTORY`\
  \ 中 `TAG_ID` 列的值应该与名为 `TAGS` 的表中 `TAG_ID` 列的值匹配。\n\nSQL 允许通过扩展后者的 `WHERE` 子句来限定查询。在下一个示例中，`WHERE`\
  \ 限制返回的行仅为 `BOOK_INVENTORY` 表中 `TAG_ID` 列中包含“999”的行：\n\n```sql\nCREATE VIEW BOOK_PUBLISHERS\n\
  ( BOOK_TITLE, BOOK_PUBLISHER ) AS\nSELECT BOOK_INVENTORY .BOOK_TITLE, TAGS .PUBLISHER\n\
  FROM BOOK_INVENTORY, TAGS\nWHERE BOOK_INVENTORY .TAG_ID = TAGS .TAG_ID\nAND BOOK_INVENTORY\
  \ .TAG_ID = 999;\n```\n\n让我们再看另一个示例。与之前的示例类似，这个视图从一个表中收集信息。然而，它执行计算以返回修改后的信息。这是该语句：\n\
  \n```sql\nCREATE VIEW BOOK_DISCOUNTS\n( BOOK_TITLE, ORIGINAL_PRICE, REDUCED_PRICE\
  \ ) AS\nSELECT BOOK_TITLE, ORIGINAL_PRICE, REDUCED PRICE * 0.8\nFROM BOOK_INVENTORY;\n\
  ```\n\n此语句创建了一个具有三列的视图：`BOOK_TITLE`、`ORIGINAL_PRICE` 和 `REDUCED_PRICE`。在这里，`SELECT`\
  \ 指定了所需的列。该语句使用之前讨论的方法定义了 `BOOK_TITLE` 和 `ORIGINAL_PRICE`。系统将复制 `BOOK_INVENTORY`\
  \ 中 `BOOK_TITLE` 和 `ORIGINAL_PRICE` 列的数据。然后，系统将数据填充到 `BOOK_DISCOUNTS` 视图的同名列中。\n\
  \nSQL 还允许你在 `SELECT` 语句中插入 `WHERE` 子句。这是一个示例：\n\n```sql\nCREATE VIEW BOOK_DISCOUNTS\n\
  ( BOOK_TITLE, ORIGINAL_PRICE, REDUCED_PRICE ) AS\nSELECT BOOK_TITLE, ORIGINAL_PRICE,\
  \ REDUCED PRICE * 0.8\nFROM BOOK_INVENTORY\nWHERE STOCK_AVAILABILITY > 20;\n```\n\
  \n### 如何创建可更新的视图\n\n在 SQL 语言中，某些视图允许你执行更新。简单来说，你可以使用视图来修改正在操作的表中的信息（即添加新行和修改现有信息）。视图的“可更新性”取决于其\
  \ `SELECT` 语句。\n\n记住，SQL 并没有用于创建可更新视图的语法。相反，你需要编写一个符合特定标准的 `SELECT` 语句。\n\n\n\n\n\
  \n你在本章中看到的示例意味着 `SELECT` 语句充当了 `CREATE VIEW` 命令的搜索表达式。准确地说，查询表达式可能属于不同类型的表达式。作为\
  \ SQL 用户，在大多数时候，你处理的都是查询规范。查询表达式是以 `SELECT` 开头并包含不同元素的 SQL 表达式。为了简单起见，让我们假设 `SELECT`\
  \ 是一个查询规范。数据库产品也使用这一假设，因此它确实是有效的。\n\n你不能对视图内部的信息进行汇总、组合或自动删除。\n\n你正在操作的应该至少包含一个可更新的列。\n\
  \n视图中的每一列都应该指向表中的单列。\n\n视图中的每一行都应该指向表中的单行。\n\n## 如何删除视图\n\n在某些情况下，你需要从数据库中删除视图。要做到这一点，你需要使用以下语法：\n\
  \n```\nDROP VIEW (name of the view);\n```\n\n一旦你运行此语句，系统就会删除该视图。然而，该过程不会影响底层信息（即存储在实际表中的数据）。在删除视图后，你可以重新创建它，或者使用它的名称生成另一个视图。让我们来分析一个基础示例：\n\
  \n```\nDROP VIEW BOOK_PUBLISHERS;\n```\n\n此命令将删除数据库中的 `BOOK_PUBLISHERS` 视图。然而，底层信息将不受影响。\n\
  \n## 数据库安全\n\n安全性是每个数据库的重要元素。你需要确保你的数据库免受可能查看或更改数据的未经授权用户的侵害。同时，你还需要确保经过授权的用户能够无问题地访问和/更改数据。解决此问题的最佳方案是为每个用户提供他们完成工作所需的权限。\n\
  \n为了保护数据库，SQL 有一套安全方案，允许你指定哪些数据库用户可以从哪些位置查看特定信息。该方案还允许你设置每个用户可以执行的操作。这种安全方案（或模型）依赖于授权标识符。正如你在第二章中所学到的，授权标识符是代表一个或多个可以访问/修改数据库内部信息的用户的对象。\n\
  \n## SQL 安全模型\n\n你数据库的安全性取决于授权标识符。你可以使用这些标识符允许他人访问和/更改你的数据库条目。如果授权标识符缺乏更改某些对象的相应权限，用户将无法更改该对象内部的信息。此外，你可能为每个标识符配置各种权限。\n\
  \n在 SQL 中，授权标识符可以是用户标识符（即“user”）或角色名称（即“role”）。“用户”是一个可能代表程序、个人或服务的安全配置文件。SQL 对于创建用户没有特定的规则。你可以将该标识符绑定到运行数据库系统的\
  \ OS（即操作系统）。或者，你也可以在数据库系统内部创建用户标识符。\n\n角色是一组访问权限，你可以将将其分配给用户或其他角色。如果某个角色具有对某个对象的访问权限，则所有分配给该角色的用户都可以访问该对象。\n\
  \nSQL 用户经常利用角色为其他授权标识符提供统一的访问权限集。角色提供的主要优势之一是，它可以在没有任何用户标识符的情况下存在。这意味着你可以在创建用户之前先创建一个角色。此外，即使你删除了所有用户标识符，角色仍将留在数据库中。此功能允许你实现一个灵活的过程来管理访问权限。\n\
  \nSQL 语言有一个特殊的授权标识符称为 `PUBLIC`。该标识符涵盖了所有数据库用户。与其他标识符类似，你可能为 `PUBLIC` 配置文件分配访问权限。\n\
  \n**重要提示**：在为 `PUBLIC` 标识符分配访问权限时，你需要小心，因为用户可能会将该标识符用于未经授权的。\n\n## 创建和删除角色\n\n生成新角色是一个简单的过程。该语法包含两个句：一个可选句和一个强制性句。\n\
  \n```\nCREATE ROLE (name of role)\n{ WITH ADMIN [ CURRENT_ROLE | CURRENT_USER ]\
  \ }\n```\n\n如你所示，`CREATE ROLE` 是该语句唯一的强制性部分。你不需要设置语句的 `WITH ADMIN` 部分。实际上，SQL 用户很少设置该句。只有当你的当前角色名/用户标识符对没有任何空值时，`WITH\
  \ ADMIN` 才会变得重要。\n\n让我们使用该语法创建一个角色：\n\n```\nCREATE ROLE READERS;\n```\n\n就是这样。创建此角色后，你将能够将其授予用户或其他角色。\n\
  \n要删除（或移除）一个角色，你只需要使用以下语法：\n\n```\nDROP ROLE (name of role)\n```\n\n此语法有一个唯一的要求：你想要删除的角色的名称。\n\
  \n## 授予和撤销权限\n\n每当你授予一种权限时，你实际上是将一种权限链接到授权标识符上。你将此权限/授权标识符值对放置在对象上，允许前者根据定义的权限访问后者。\n\
  \n```\nGRANT [ (list of privileges) | ALL PRIVILEGES ]\nON (type of object) (name\
  \ of object)\nTO [ (list of authorization identifiers) | PUBLIC ] { WITH GRANT OPTION\
  \ }\n{ GRANTED BY [ CURRENT_ROLE | CURRENT_USER ] }\n```\n\n此语法有三个强制性句，即：`ON`、`TO`\
  \ 和 `GRANT`。后两个句 `GRANTED BY` 和 `WITH GRANT OPTION` 完全可选的。\n\n撤销权限的过程简单快捷。你只需要使用下面提供的语法即可：\n\
  \n```\nREVOKE { GRANT OPTION FOR } [ (list of privileges) | ALL PRIVILEGES ]\nON\
  \ (type of object) (name of object)\nFROM [ (list of authorization identifiers)\
  \ | PUBLIC ]\n```\n\n## 第章 创建数据库\n\n“改进就是改变，完美就是经常改变。” —— 温斯坦·丘吉\n\n数据存储在表中并通过索引来提高查询效率。在创建表之前，你需要一个数据库来存放表。如果你是从零开始，你必须学习创建数据库。\n\
  \n### 创建数据库\n\n要创建数据库，你将使用 `CREATE` 命令配合数据库名称。以下是语法：\n\n```\nCREATE DATABASE database_name;\n\
  ```\n\n为了演示，假设你想创建一个命名为 `xyzcompany` 的数据库：\n\n```\nCREATE DATABASE xyzcompany;\n\
  ```\n\n通过该语句，你刚刚创建了 `xyzcompany` 数据库。在使用此数据库之前，你需要将其指定为活动数据库。你需要运行带有数据库名的 `USE`\
  \ 命令来激活你的新数据库。\n\n这是语句：\n\n```\nUSE xyzcompany;\n```\n\n在后续的会话中，你只需要输入 `USE xyzcompany`\
  \ 即可访问该数据库。\n\n### 删除数据库\n\n如果你需要删除一个现有数据库，可以使用以下语法：\n\n```\nDROPDATABASE databasename;\n\
  ```\n\n因此，在使用 `DROP` 命令删除数据库时必须谨慎。\n\n### 创建模式\n\n`CREATE SCHEMA` 语句用于定义模式。在同一语句中，你还可以创建对象并授予这些对象的权限。\n\
  \n`CREATE SCHEMA` 命令可以嵌入在应用程序中。同样，它可以使用动态 SQL 语句发布。例如，如果你拥有数据库管理权限，可以发布此语句创建一个名为\
  \ `USER1` 的模式，并将 `USER1` 作为其所有者：\n\n```\nCREATE SCHEMA USER1 AUTHORIZATION USER1\n\
  ```\n\n下述语句创建一个带有库存表的模式。它还将对库存表的权限授予 `USER2`：\n\n```\nCREATE SCHEMA INVENTORY\n\
  \    CREATE TABLE ITEMS (IDNO INT(6) NOT NULL,\n        SNAME VARCHAR(40));\n```\n\
  \n\n\n\n\n# 整数类 (CLASS INTEGER)\n\n`GRANT ALL ON ITEMS TO USER2`\n\n## MySQL 5.7\n\
  \n如果你正在使用 `MySQL 5.7`，`CREATE SCHEMA` 与 `CREATE DATABASE` 命令等同的。\n\n以下是语法：\n\n```sql\n\
  CREATE {DATABASE│SCHEMA}[IF NOT EXISTS] db_name [create_specification]…\n```\n\n\
  `create_specification`:\n\n```sql\n[DEFAULT] CHARACTER SET [=] charset_name │ [DEFAULT]\
  \ COLLATE [=] collation_name\n```\n\n## Oracle 11g\n\n在 `Oracle 11g` 中，你可以在一个事务通过\
  \ `CREATE SCHEMA` 语句创建多个视图和表，并执行多次授权（grants）。为了成功执行 `CREATE SCHEMA` 命令，`Oracle`\
  \ 会执行块中的每个语句，并在未遇到错误时提交事务。如果某个语句返回错误，则所有语句将回滚。\n\n`CREATE VIEW`、`CREATE TABLE` 和\
  \ `GRANT` 语句可以包含在 `CREATE SCHEMA` 语句中。因此，你不仅需要创建 schema 的权限，还必须拥有其内部语句所需的权限。\n\n\
  语法如下：\n\n```sql\n{\n  create_table_statement\n│ create_view_statement\n│ grant_statement\n\
  }…;\n```\n\n## SQL Server 2014\n\n在 `SQL Server 2014` 中，`CREATE SCHEMA` 语句用于在当前数据库中创建模式。此事务还可以在新创建的\
  \ schema 中创建视图和表，并对这些对象设置 `GRANT`、`REVOKE` 或 `DENY` 权限。\n\n该语句创建一个 schema 并为每个参数设置规范：\n\
  \n```sql\nCREATE SCHEMA schema schema_name_clause [ <schema_element> [ …n ] ]\n\n\
  <schema_name_clause>::=\n{\n  schema_name\n│ AUTHORIZATION owner_name\n│ schema_name\
  \ AUTHORIZATION owner_name\n}\n\n<schema_element> ::=\n{\n  table_definition │ view_definition\
  \ │ grant_statement │\nrevoke_statement │deny_statement\n}\n```\n\n## PostgreSQL\
  \ 9.3.13\n\n`CREATE SCHEMA` 语句用于向数据库录入一个新的 schema。schema 名称在当前数据库中必须是唯一的。\n\n以下是语法：\n\
  \n```sql\nCREATE SCHEMA schema_name [AUTHORIZATION user_name][schema_element[…]]\n\
  CREATE SCHEMA AUTHORIZATION user_name [schema_element[…]]\nCREATE SCHEMA IF NOT\
  \ EXISTS schema_name [AUTHORIZATION user_name]\nCREATE SCHEMA IF NOT EXISTS AUTHORIZATION\
  \ user_name\n```\n\n## 创建表和向表中插入数据\n\n表是数据库中存储的主要主体。创建表意味着为表指定一个名称，定义它的列以及每列的数据类型。\n\
  \n### 如何创建表\n\n使用 `CREATE TABLE` 关键字来创建新表。其后跟一个唯一标识符和一个定义每种列及其将承载数据类型的列表。\n\n```sql\n\
  CREATE TABLE table_name\n(\n  column1 datatype [NULL│NOT NULL],\n  column2 datatype\
  \ [NULL│NOT NULL],\n  …\n);\n```\n\n这是创建表的基本语法：\n\n### 参数 \n\n- `table_name`: 这是表的标识符。\n\
  - `column1`, `column2`: 这些是你希望表拥有的列。所有列都应该有一个数据类型。列被定义为 `NULL` 或 `NOT NULL`。如果未指定，数据库将假设它为\
  \ `NULL`。\n\n在创建新表时，以下系列问题可以作为指南：\n\n- 此表最合适的名称是什么？\n- 我将处理哪些数据类型？\n- 每个列最合适的名称是什么？\n\
  - 哪些列应该作为主键（main key）？\n- 每一列可以分配什么类型的数据？\n- 每列的最大宽度是多少？\n- 哪些列可以为空，哪些列不应为空？\n\n\
  以下示例在 `xyzcompany` 数据库中创建一个新表。它将被命名为 `EMPLOYEES`：\n\n```sql\nCREATE TABLE EMPLOYEES(\n\
  \  ID INT(6) auto_increment, NOT NULL,\n  FIRST_NAME VARCHAR(35) NOT NULL,\n  LAST_NAME\
  \ VARCHAR(35) NOT NULL,\n  POSITION VARCHAR(35), \n  SALARY DECIMAL(9,2),\n  ADDRESS\
  \ VARCHAR(50),\n  PRIMARY KEY (id)\n);\n```\n\n该代码创建了一个具有 6 列的表。`ID` 字段被指定为主主键。第一列是\
  \ `INT` 数据类型，精度为 6。它不接受 `NULL` 值。第二列 `FIRST_NAME` 是 `VARCHAR` 类型，最大范围为 35 个字符。第三列\
  \ `LAST_NAME` 是另一个 `VARCHAR` 类型，最大为 35 个字符。第四列 `POSITION` 是 `VARCHAR` 类型，设置最大为 35\
  \ 个字符。第五列 `SALARY` 是 `DECIMAL` 类型，精度为 9，小数位为 2。最后，第六列 `ADDRESS` 是 `VARCHAR` 类型，最大为\
  \ 50 个字符。\n\n### 基于现有表创建表\n\n你可以使用 `SELECT` 基于现有表创建新表。\n\n```sql\nCREATE TABLE new_table\
  \ AS\nSELECT ... FROM existing_table;\n```\n\n为了演示，从 `EMPLOYEES` 创建一个名为 `STOCKHOLDERS`\
  \ 的表：\n\n```sql\nCREATE TABLE STOCKHOLDERS AS\nSELECT ID, FIRST_NAME, LAST_NAME,\
  \ POSITION, SALARY, ADDRESS\nFROM EMPLOYEES;\n```\n\n### 向表中插入数据\n\nSQL 数据操语言 (`DML`)\
  \ 用于对数据库进行更改。你可以使用 DML 填充表。\n\n#### 为表填充新数据\n\n填充表有两种方法：\n- **手动输入**：涉及使用键盘进行数据输入。\n\
  - **自动输入**：涉及从外部源加载数据。\n\n与不区分大小写的 SQL 关键字或子句不同，数据是大小敏感的。因此，在使用数据时必须确保一致性。例如，如果你将员工的名存储为\
  \ `Martin`，你应该始终引用它为 `Martin` 而绝不是 `MARTIN`。\n\n#### INSERT 关键字\n\n`INSERT` 关键字用于向表中添加记录。它向现有表插入新的数据行。\n\
  \n使用 `INSERT` 关键字添加数据有两种方法：\n\n1. **第一种格式**：你只需为每个字段提供值，它们将按顺序分配给表的列。这种形式通常用于向所有列添加数据。\n\
  ```sql\nINSERT INTO table_name\nVALUES ('value1', 'value2', 'value3');\n```\n\n\
  2. **第二种格式**：你必须包含列名。值将根据列出现的顺序进行分配。这种形式通常用于向特定列添加数据。\n\n```sql\nINSERT INTO table_name\
  \ (column1, column2, column3)\nVALUES ('value1', 'value2', 'value3');\n```\n\n注意，在两种格式中，都使用逗号分隔列和值。此外，你必须将字符/字符串和日期/时间封装在引号内。\n\
  \n假设你有以下员工记录：\n\n- 名：Robert\n- 姓：Page\n- 职位：Clerk\n- 薪资：5000.00\n- 地址：282 Patterson\
  \ Avenue, Illinois\n\n要将此数据插入 `EMPLOYEES` 表，可以使用以下语句：\n\n```sql\nINSERT INTO EMPLOYEES\
  \ (FIRST_NAME, LAST_NAME, POSITION, SALARY, ADDRESS)\nVALUES ('Robert', 'Page',\
  \ 'Clerk', 5000.00, '282 Patterson Avenue, Illinois');\n```\n\n要查看更新后的表，语法如下：\n\n\
  ```sql\nSELECT * FROM table_name;\n```\n\n要显示存储在 `EMPLOYEES` 表中的数据，使用以下语句：\n\n```sql\n\
  SELECT * FROM EMPLOYEES;\n```\n\n\n\n\n\n通配符 `*` 告诉数据库系统选择表中的所有字段。\n\n这是结果的截图：\n\
  \n![](img/00031.jpg)\n\n现在，尝试为另一组员工编码以下数据：\n\n| 名字 | 姓 | 职位 | 薪资 | 地址 |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| John | Malley | 主管 | 7,000.00 | 5 Lake View,\
  \ New York |\n| Kristen | Johnston | 员 | 4,500.00 | 25 Jump Road, Florida |\n| Jack\
  \ | Burns | 代理 | 5,000.00 | 5 Green Meadows, California |\n\n你将不得不重复使用 `INSERT INTO`\
  \ 关键字将每个员工的数据输入数据库。语句看起来如下：\n\n```sql\nINSERT INTO EMPLOYEES(FIRST_NAME, LAST_NAME,\
  \ POSITION, SALARY, ADDRESS)\nVALUES‘John’, ‘Malley’, ‘Supervisor’, 7000.00, ‘5\
  \ Lake View New York);\n\nINSERT INTO EMPLOYEES(FIRST_NAME, LAST_NAME, POSITION,\
  \ SALARY, ADDRESS)\nVALUES‘Kristen’, ‘Johnston’, ‘Clerk’, 4000.00, ‘25 Jump Road,\
  \ Florida’);\n\nINSERT INTO EMPLOYEES(FIRST_NAME, LAST_NAME, POSITION, SALARY, ADDRESS)\n\
  VALUES‘Jack’, ‘Burns’, ‘Agent’, 5000.00, ‘5 Green Meadows, California’’;\n```\n\n\
  使用带有通配符字符的 `SELECT` 命令获取更新后的 `EMPLOYEES` 表。\n\n```sql\nSELECT * FROM EMPLOYEES:\n\
  ```\n\n这是结果的截图：\n\n注意，SQL 为你输入的每组数据都分配了一个 ID 号。这是因为你使用 `auto_increment` 属性定义了 `ID`\
  \ 列。该属性将防止你在插入数据时使用第一种形式。因此，你必须在 `INSERT INTO table_name` 行中指定其余的列。\n\n### 向特定列插入数据\n\
  \n你也可以向特定列插入数据。你可以通过在列列表中指定列名，并在 `INSERT INTO` 语句的 `VALUES` 列表中指定对应的值来 To 此。例如，如果你只想输入员工的全名和职位，你需要在列列表中指定列\
  \ `FIRST_NAME`、`LAST_NAME` 和 `SALARY`，并在 `VALUES` 列表中指定名字、姓氏和薪资的值。\n\n要查看它是如何工作的，请尝试将以下数据输入\
  \ `EMPLOYEES` 表：\n\n| 名字 | 姓 | 职位 | 薪资 | 地址 |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| James | Hunt | | 7,500.00 | |\n\n这是更新后的 `EMPLOYEES` 表的截图：\n\n![](img/00141.jpg)\n\
  \n### 插入 NULL 值\n\n在某些情况下，你可能需要向列输入 `NULL` 值。例如，你可能没有手头数据来输入新员工的薪资。提供任何一个薪资数字都可能是误导性的。\n\
  \n语法如下：\n\n```sql\nINSERT INTO schem a.table_name\nVALUES (‘colum n1’, NULL, ‘colum\
  \ n3);\n```\n\n你需要这份答案表在每个练习中检查你的语法以确保其正确。如果你在某个练习中卡住了，也非常欢迎使用它。在每个练习结束时，我鼓励你检查自己的答案。\n\
  \n每个练习在开始应用你在每个节中学到的知识之前，都会提供一个概述以及示例。\n\n下面是你将在接下来的几个练习中使用的 `Product` 表示例。\n\n\
  | 产品 ID | 名称 | 产品编号 | 颜色 | 标准成本 | 列表价格格 | 尺寸 |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| 317 | LL Crankarm | CA-5965 | Black | 0 | 0 | NULL |\n| 318\
  \ | ML Crankarm | CA-6738 | Black | 0 | 0 | NULL |\n| 319 | HL Crankarm | CA-7457\
  \ | Black | 0 | 0 | NULL |\n| 320 | Chainring Bolts | CB-2903 | Silver | 0 | 0 |\
  \ NULL |\n| 321 | Chainring Nut | CN-6137 | Silver | 0 | 0 | NULL |\n\n### 查询结构和\
  \ SELECT 语句\n\n理解 `SELECT` 语句的结构至关重要。`WHERE` 子句用于根据特定条件过滤行。\n\n```sql\nSELECT *\
  \ FROM table\n```\n\n### WHERE 子句\n\n`WHERE` 子句用于根据特定条件过滤行。它位于 `FROM` 语句之后。\n\n\
  ```sql\nWHERE condition\n```\n\n- **EQUALS**：用于查找精确匹配。字符串需要单引号，但数值不需要。\n- **BETWEEN**：通常用于查找范围内的值。\n\
  - **GREATER THAN**、**LESS THAN**、**GREATER THAN EQUAL TO**、**LESS THAN EQUAL TO**：这些运算符比较数值。\n\
  - **LIKE**：在列中搜索模式。你可以使用百分号 `%` 来指示字符串是在开头、结尾还是中间。\n- **IS NULL**、**IS NOT NULL**：这些用于处理不包含数据的单元格\
  \ (`NULL`)）。\n\n### 使用 ORDER BY\n\n`ORDER BY` 子句用于按升序或降序排序数据。它位于 `FROM` 语句之后。\n\n\
  ```sql\nORDER BY column_name ASC/DESC```\n\n默认情况下，排序是升序的 (`ASC`)。使用 `DESC` 进行降序排序。\n\
  \n\n\n\n\n从 `Production.Product` 表中选择 `Product ID`、`Name`、`Product Number` 和 `List\
  \ Price`，其中 `List Price` 在于 $100.00 到 $400.00 之间。然后，按列表价格从最小到最大对结果进行排序。（提示：你不需要在查询中使用\
  \ `$` 符号，而且，如果你需要的话，可以回顾你刚刚查看过的排序选项。）\n\n数据定义语言 (DDL)\n\n“没有比积极的愚蠢更糟糕的事情了。” – 约翰·沃尔夫冈·冯歌德\n\
  \nDDL 是用于创建、修改或删除实例本身或数据库内对象的 SQL 语法。以下是一些示例，可以帮助你入门。DDL 分为三类型的命令：\n\n### CREATE\n\
  这将在数据库或实例中创建对象，例如其他数据库、表、视图等。\n\n-- 创建一个数据库\n```sql\nCREATE DATABASE DatabaseName\n\
  ```\n\n--为当前数据库中的表创建一个架构（或容器）\n```sql\nCREATE SCHEMA SchemaName\n```\n\n-- 在指定的架构中创建一个表\n\
  ```sql\nCREATE TABLE SchemaName.TableName\n(\nColumn1 datatype PRIMARY KEY,\nColumn2\
  \ datatype(n),\nColumn3 datatype\n)\n```\n\n-- 创建一个视图\n```sql\nCREATE VIEW ViewName\n\
  AS\nSELECT\nColumn1,\nColumn2\nFROM TableName\n```\n\n### ALTER\n此命令允许你修改现有对象，例如向表添加额外的列或更改数据库名称等。\n\
  \n-- 修改数据库名称\n```sql\nALTER DATABASE DatabaseName MODIFY NAME = NewDatabaseName\n\
  ```\n\n-- 通过添加列来修改表\n```sql\nALTER TABLE TableName\nADD ColumnName datatype(n)\n\
  ```\n\n### DROP\n此命令允许你删除数据库内的对象或数据库本身。这可以用于删除表、触发器、视图、存储过程等。请注意，这些项目将不再存在于你的数据库中——如果你删除了数据库，该数据库也将停止存在。\n\
  \n-- 删除数据库 - 先使用 master 数据库\n```sql\nUSE master\nGO\n-- 然后删除所需的数据库\nDROP DATABASE\
  \ DatabaseName\nGO\n```\n\n-- 删除表；应该在指定表所在的数据库中执行\n```sql\nDROP TABLE Table_Name\n\
  ```\n\n-- 从当前数据库中删除视图\n```sql\nDROP VIEW ViewName\n```\n\n## 应用 DDL 语句\n\n在你的机器上上点击“New\
  \ Query”按钮打开一个新的查询窗口，并确保你正在使用 `master` 数据库。你可以通过检查下方并使用下拉菜单来判断你正在使用哪个数据库，并在数据库之间切换。\n\
