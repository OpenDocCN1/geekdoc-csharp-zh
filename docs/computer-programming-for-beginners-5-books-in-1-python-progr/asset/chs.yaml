  \n### 首先\n我鼓励你检查代码中是否存在空格或大小大小写的简单错误。\n\n有时，如果你习惯了用其他语言编程，可能会在无意中在 C# 中本该用分号的地方使用了句号，甚至在不该使用括号的地方使用了括号。\n\
  \n这些是我认为最令人沮丧的错误类型，通常也是我犯过的错误。基本上，当你遇到一个似乎不断报错且令人沮丧的问题时，务必双双检查你的工作。\n\n此外，如果你尝试了这种策略仍然不起作用，并且正准备放弃——去休息一下！在让自己放松并暂时忘记项目之后，再回到你的项目中。当你回来并用清新的眼光审视它时，你可能会发现错误所在。\n\
