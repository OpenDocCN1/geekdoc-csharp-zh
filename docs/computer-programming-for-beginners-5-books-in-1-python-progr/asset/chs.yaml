  \n## Lilypad Arduino Simple Snap\n\n这是 `Lilypad Simple` 更贵的版本，也旨在创建可穿戴设备和电子纺织品。它解决了之前版本的一个核心问题：清洗嵌入的纺织品。对于其他\
  \ `Lilypad Arduino` 型号和 `Gemma`，你必须移除电源，然后手洗嵌入微控制器的面料。然后，必须等待整个电路干透后再通电，否则会发生短路并损坏技术。\n\
