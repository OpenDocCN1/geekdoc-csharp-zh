  \ egg 语言中所示。\n\n## Functions\n\n一个没有函数的编程语言是真的很糟糕的，尽管插入一个使用其最后一个参数作为函数体的函数是容易的。它还利用在此之前的每个参数用作函数的参数名。\n\
  \n```javascript\nspecialForms.fun = (args, scope) => {\n  if (!args.length) {\n\
  \    throw new SyntaxError(\"Functions need a body\");\n  }\n  let body = args[args.length\
  \ - 1];\n  let param = args.slice(0, args.lengths - 1).map(expr => {\n    if (expr.type\
  \ != \"word\") {\n      throw new SyntaxError(\"Parameter names must be words\"\
  );\n    }\n    return expr.name;\n  });\n\n  return function() {\n    if (arguments.length\
  \ != params.length) {\n      throw new TypeError(\"Wrong number of arguments\");\n\
  \    }\n    let localScope = Object.create(scope);\n    for (let i = 0; i < arguments.length;\
  \ i++) {\n      localScope[params[i]] = arguments[i];\n    }\n    return evaluate(body,\
  \ localScope);\n  };\n};\n```\n\negg 函数有它们自己的局部作用域。由 `fun` 形式提供的函数构建了这个局部作用域并将参数绑定到其上。然后在这个作用域中访问函数体并返回结果。\n\
  \n```javascript\nrun(`\n  do(define(plusOne, fun(a, +(a, 1))),\n  print(plusOne(10)))\n\
  `);\n// → 11\n```\n\n```javascript\nrun(`\n  do(define(pow, fun(base, exp,\n  if(==(exp,\
  \ 0),\n  1,\n  *(base, pow(base, -(exp, 1)))))),\n  print(pow(2, 10)))\n`);\n//\
  \ → 1024\n```\n\n## Summary\n\n在本章涵盖了解析、函数、特殊形式和评估器。符号或语法是编程中一个非常重要的方面。解析器读取文本并提供一种显示文本中程序布局的数据布局方案。如果文本创建了无效程序，解析器将标记错误。\n\
