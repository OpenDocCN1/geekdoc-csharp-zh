  \n## 引言\n\n虽然学习任何新语言都不是容易的，但本书的目标是让你尽可能快速、轻松地掌握并理解。其目的是为你提供完整且全面的技能，帮助你在 C# 中掌握知识。为了让你以最有效的方式学习，我希望你也能进行练习，以加强我们所探索的课程。\n\
  \n本书将涵盖对 C# 的基本描述，并最后提供一些实用的提示和资源，以加强你可能需要一些帮助的任何主题。请记住，这种语言为程序员提供了许多能力，本书可能会从游戏编程的角度提到我希望你也熟悉的某些事宜。\n\
  \n虽然我为你提供了信息和一些基础技能进行练习，但将这些技能付诸实践取决于你。我强烈建议你找到一个要遵守的严格常规，包括研究、对材料的学习以及在你自己的虚拟环境中进行练习，让你熟悉这些技能。众所周知，你可以引马到水边，但不能强迫它喝水！\n\
  \n我可以给你知识和资源，但综合并使用它们来创建你自己的程序和代码将取决于你。\n\n对于像 C# 这样一种面向对象且结构化的语言，我认为你会发现它易于学习且用户友好。这种高级语言在\
  \ C、C++ 甚至 Java 语言的基础上构建并在某些方面补充了它们。然而，即使你是这些语言的专家，这项新任务的学习曲线与任何其他编程语言一样陡峭！\n\n\
  ## 第 1 章：什么是 C#\n\n你发现并购买这本书是为了学习如何成为一名 C# 程序员。\n\n\n\n\n\n在本书中，你将学习如何在你自己的编程项目中应用\
  \ `C#` 的基础规则。`C#`（读作“see sharp”）是一种由微软设计并开发的面向对象的计算机编程语言。\n\n这是一门相当较新的语言，从本质上来说被认为具有很强的功能性和面向对象特性。虽然\
  \ `C#` 绝对与 `C` 或 `C++` 不是同一种语言，但这些语言之间确实存在某些相似之处，对其中一种或两种语言拥有洞察力、知识或经验甚至可能大有益。\n\
  \n与所有编程语言一样，了解它们在基础和功能层面上是如何运作的很有帮助。所有语言都有共同点：它们都是为了告诉计算机设置以及如何设置系统、数据库，或者如何以及何时运行和执行程序。\n\
  \n这种特定的语言根源于程序员安德斯·海尔斯格（Anders Hejlsberg），他曾是微软 `.Net Framework` 开发团队的成员。尽管有些人倾向于批评\
  \ `C#` 是对 `Java` 的某种“抄袭”，但在整个学习手册的课程，你会发现（如果你了解 `Java` 的话）该语言在内容和结构上存在明显的区别，这使其与众不同。\n\
  \n它的设计是针对一个能够使用高级语言并由可执行代码（也称为通用语言体系或 `CLI`）的环境而制定的，这吸引了许多对这种易学语言感兴趣的人。\n\n它将效率作为其目标之一，因此使用它有很多许多优势。在本书中，我将向你介绍如何轻松地掌握这种面向对象和面向组件的语言，作为你使用的一种新语言。\n\
  \n除了是一门结构化语言外，你可以依靠在 `C#` 语言中的编程和编码来获得高效的结果。我将协助你优化性能，以便从你在语言中进行编程和编码所投入的工作中获得预期的输出。\n\
  \n尽管 `C#` 是使用微软平台开发的，但语言本身并不局限于该平台。`C#` 的另一个伟大概念是，这种通用性允许你将面向对象的语言带到不同的平台，创建多维度且可用的程序和软件。\n\
  \n由于我确定你熟悉其他语言，语言的某些方面有助于获得某些预期的结果。在本学习 `C#` 的指南中将涵盖许多优势，这些优势将帮助用户处理可移植性、类型、元编程、属性、内存访问以及方法和函数——这些都是我们将在后续章节中讨论并展示示例的一系列其他积极属性。\n\
  \n这门语言的官方版本自 2002 年以来才出现，因此可以被认为是一门较新的编程语言。然而，不要因此让你认为它不能且不与像 `Java` 这样更久的语言竞争。\n\
  \n这门语言的开发者确实目标是改进并添加不同的功能，这些功能最初专门为 `.Net framework` 设计，但现在已经过扩展，并在许多功能上取得了成功——其中一个许多人喜欢的特征是它所使用的语法。\n\
  \n这门语言有可能被用于专注于游戏玩法。对于玩家来说，游戏不仅要有趣并吸引人的注意力，他们还希望体验本身是令人享受。\n\n由于你可能自己也算是一个程序员（或者至少欣赏计算机的能力），在读完这本书后，我预计你将非常理解游戏程序员为了创造出你作为最终结果所获得的体验而工作得有多辛苦。\n\
  \n尽管我不认为仅读这本书就能让你创作出一款精湛的游戏（你还需要大量的练习！）——但我相信，当你处理图形编程和设计的许多组件时，你将从更层次的程度上理解至关重要的概念。请记住，在整本书中，你正在通过你在这种语言中的编码和编程技能创建并微调一个可能无限的世界。面向对象的组件确实有助于强化这一想法。\n\
  \n在接下来的章节中，你将学习 `C#` 为什么以及如何对你非常有用，以及你如何在一个多月的时间内轻松掌握并熟练运用所有基础知识。\n\n凭借一个与任何其他语言媲美的标准库，在本书结束时，你将知道如何找到可能需要的源代码并执行它，以产生相当一致且精妙的结果。这门语言的另一个积极特性是布尔条件，深受许多人的青睐，以及与\
  \ Windows 的集成，让你能够轻松访问最流行的操作系统之一。\n\n作为在本章初对 `C#` 是什么这一极简解释的最后说明，我只想指出几个在整个过程中最好记住的编程和编码通用概念。\n\
  \n首先，记住计算机没有直觉。这意味着它们将完全按照你告诉它们的方式执行任务。计算机不会像人类那样从你的代码中推断出信息。每当你遇到任何困难时，务始终记住这一点。\n\
  \n还要记住，间距上的微小错误或错误的字母可能会导致大量的头疼。当你陷入一个看似无法逾越的僵局时——也许你只需要快速休息一下，回来再次查看你的代码。\n\n有时，当我们盯着屏幕很长时间后，无法看到自己的错误。\n\
  \n最后，记住，你不是第一个与这门语言作斗争的人，也不会是最后一个。本书的最后一章将提供有关进一步有用资源的指南和提示，以解决我预见你在开始学习这门语言时未来可能遇到的任何困扰。\n\
  \n这本书为你学习 `C#` 设定了合理的预期。我鼓励你尝试按照这种方式进行学习。对你来说，在短时间内让自己过载过多内容是很重要的。\n\n相反，不要在回到工作之前间隔太长时间。你可能会忘记可能让你抓狂的细微差别。允许自己有合理的预期，这书正是为此设计的。\n\
  \n最后，享受其中吧！为你正在学习的新技能感到自豪，准备好进入基础 `C#` 精通课程吧！\n\n## 第 2 章：详细概述\n\n由于你是一个初学者，我们希望专注于建立一个坚实的基础，让你对\
  \ `C#` 的基础有一个整体。\n\n基本上，在第一周结束时，你将牢牢掌握 `C#` 的环境、程序结构、基础语法和数据类型、类型转换、变量、常量和操作符。如果你不熟悉使用的术语或方法，我将尝试对这些术语进行简短的基础的回顾。如果这不能唤起你的记忆，你可能需要从\
  \ Google 或或其他资源寻找快速复习。我还想推荐一个可以在上面测试代码的免费交互式 shell 程序 - `https://www.tutorialspoint.com/compile_csharp_online.php`，这应该帮助你完成书中包含的任何训练练习。\n\
  \n### 环境\n\n\n\n\n\n如你所示，`C#` 是由开发者设计为与微软的 `.Net Framework` 集成的。正如你所预料的，这对你在 `C#`\
  \ 中发现的运行环境产生了巨大影响。理解 `C#` 的重要部分在于你对两者如何相互作用的理解。首先，这里是 `.Net framework` 的简要概述，帮助你更好地理解它们是如何交互的。\n\
  \n正如名称后半部分 framework 所暗示的，`.Net framework` 是一个可以运行应用程序的平台。`.Net framework` 是微软开发的一个软件开发平台。该框架是为了开发可以在\
  \ Windows 平台上运行的应用程序而创建的。第一个版本于 2002 年发布，命名为 `.Net framework 1.0`。从那时起，框架进行了多次更新以保持最新。\n\
  \n我们可以使用 `.Net Framework` 创建基于 Web 和基于表单的应用程序。我们还可以使用它来开发 Web 服务。除了 `C#` 之外，`.Net\
  \ framework` 还支持 Visual Basic 编程语言。这意味着程序员可以选择可以选择使用哪种语言来开发他们的应用程序。\n\n该框架可以帮助你编写三种不同类型的应用程序——Web\
  \ 服务、Web 应用程序和 Windows 应用程序。当人们使用该框架应用程序时，它实际上可以被多种编程语言使用，因为它是一个多平台应用程序。从 Visual\
  \ Basic、Jscript、`C++` 到 `COBOL`，众多语言都具有在框架内相互通信的能力。该框架的另一个伟大特性是广泛的代码库，这些库可以被语言使用，对于我们的目的，我们将讨论\
  \ `C#`。\n\n任何语言或框架的伟大之处之一都是存在一个可以利用的代码库的潜力。对于 `.Net framework` 和 `C#`，有一个巨大的库可以供你访问并将其用于你的代码项目。我总是给人们的一条建议是，尽管这些库是极佳的资源，但务必理解编码本身的“如何”和“为什么”，以确保在出现问题时能够修复。\n\
  \n微软本身也为其用户提供了一个很棒的工具，以协助他们在 `C#` 编程项目的开发。\n\n公司甚至免费提供两个优秀的工具，这是编写任何类型应用程序（从简单到复杂）的优质资源。我推荐的两个（因为它们是免费的！）是\
  \ `Visual C# 2010 Express` 和 `Visual Web Developer`。\n\n如果你觉得这些选项你不熟悉或不喜欢使用，你也可以一直使用文本编辑器来编写你可能需要的源代码。我推荐其他选项，因为我发现它们比简单的代码编辑器在帮助上更胜一。然而，许多人更喜欢那种方法——这完全取决于你以及对程序的熟悉程度。测试它们，看看哪种方法更适合你。\n\
  \n你可以从一个名为 `Microsoft Visual Studio` 的网站下载我提到的那两个微软程序。\n\n最后，你还可以在 `Linux` 或 `Mac\
  \ OS` 上运行 `C#`，这是跨平台编码的一项很棒的能力。但为了这样做，你显然需要在你的不同操作系统上一个非微软的框架来完成。我推荐 `mono`——这是一个同时用于\
  \ `Linux` 和 `Mac` 的开源选项。\n\n掌握了环境的基础知识，去下载或打开你想要熟悉的程序来开始你的编码过程。玩玩这些软件——或者你也可以带着你的新知识睡一，明天再开启下一阶段的项目！\n\
  \n## IDE (集成开发环境)\n\n`IDE` 是一个允许你编写程序的程序。大多数 `.Net` 开发者倾向于使用 `Visual Studio Community`\
  \ 作为 `IDE`。它允许你创建、调试和运行应用程序。这个 `IDE` 可以用于开发基于 Web 和基于表单的应用程序。要使用此 `IDE`，你必须在计算机上下载并安装它。你可以在下面的\
  \ URL 中找到它：\n\nhttps://www.visualstudio.com/downloads/\n\n你允许在 `Visual Studio Community\
  \ Forum`（免费）和 `Visual Studio Professional Edition`（带有 30 天试用期，期满后你必须付费）之间进行选择。\n\
  \n一旦下载完成，双击设置文件开始安装 `visual studio`。按照屏幕上的指令进行操作，直到 `visual studio` 安装完成。\n\n之后，你就可以准备好开始创建自己的\
  \ `C#` 应用程序了。\n\n## 程序结构和基础语法\n\n现在我们已经对 `C#` 环境是如何创建的有了简单了解，让我们来看看实际的结构，以及你将如何通过\
  \ `C#` 语法与程序进行交互。\n\n当我们观察 `C#` 是如何构造时，我们正在看的是组成程序的 7 个基本组件。这些是：类方法和属性、命名空间声明、类、主方法、注释和语句以及表达式。现在，这些内容在你的编程和编码中看起来是什么样子的？我们为什么不拿这个“Hello\
  \ World”示例并将其拆解成部分来观察实际运行呢。\n\n```csharp\nusing System;\n\nnamespace HelloWorldApplication\n\
  {\n    class HelloWorld\n    {\n        static void Main(string[] args)\n      \
  \  {\n            /* my first program working with the */\n            Console.WriteLine(\"\
  Hello World\");\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n![](img/0121.jpg)\n\
  \n所以希望这些对你来说有些熟悉，尽管你可能还不完全理解含义，但你知道所有的符号都是重要的。\n\n当我们使用 `C#` 时，第一行总是包含 `using`，尽管通常情况下你会看到多个语句，第一个关键字是\
  \ `using`。\n\n`C#` 的下一行将用作 `namespace` 的声明。如果你不熟悉，我们应该把 `namespace` 术语视为特定组或集合的描述符。\n\
  \n在我们的 Hello World 示例中，我们将该短语视为 `class`。在命名空间行之后，你会来到类的声明。该类将告知你类的方法。\n\n方法的一个典型特征是单个类中存在多个方法。熟悉类的方法是重要的，因为你就能更此意识到你所处理的类的行为。在\
  \ Hello World 示例中，我们只看一个术语，即 `main method`。\n\n每个类都有一个 `main method`，你可以在类声明后的行找到它。本质上，当你查看这一行时，可以预期\
  \ `main method` 会告诉代码执行时会发生什么。这一点在 `C#` 程序中通常称为入口点。\n\n\n\n\n代码以 `using` 语句开始。该语句的作用是将\
  \ `System` 命名空间添加到程序中。C# 程序通常包含多个 `using` 语句。\n\n在下一行中，我们有一个 `namespace`（命名空间）声明。`namespace`\
  \ 简单就是许多类的集合。上面，我们有一个 `HelloWorld` 命名空间，其中包含了 `Hello` 类。\n\n在下一行中，我们有类声明。`Hello`\
  \ 类包含了程序将要用到的方法和数据定义。一个类通常包含许多方法。方法的作用是描述类的行为。然而，我们上面的 `Hello` 类只有一个方法，即 `Main`\
  \ 方法。\n\n在代码的下几行中，我们有 `Main` 方法的定义，它是所有 C# 程序的入口点。正是 `Main` 方法规定了在执行类后会发生什么。\n\n\
  接下来，我们有 `/* … */` 行。这是一个注释，C# 编译器会忽略这一行。该行的目的仅仅是为了提高人类读者的代码可读性。\n\n接下来，我们有 `Console.WriteLine(…)`\
  \ 行。`WriteLine` 是属于 `Console` 类的一个方法，该类定义在 `System` 命名空间中。这一行将在屏幕上打印 `Hello World!`\
  \ 消息。\n\n最后，我们有 `Console.ReadKey();` 语句。这一行是给 VS.NET 用户使用的。该行会让程序等待按键，防止屏幕在程序从 Visual\
  \ Studio .NET 启动后立即运行并关闭。\n\n除了从 Visual Studio 运行程序外，你还可以从操作系统的命令提示符运行 C# 程序。要实现这一点，请遵循以下步骤：\n\
  \n* 打开你的文本编辑器，然后将上面的代码添加其中。文本编辑器的示例是记事本。\n* 将文件保存为 `helloworld.cs`。\n* 启动操作系统的命令提示符，然后导航到保存文件的目录。\n\
  * 在提示符上输入命令 `csc helloworld.cs` 然后按回车键编译代码。\n* 如果代码没有错误，命令提示符将带你进入下一行并生成 `helloworld.exe`\
  \ 文件。\n* 在提示符上输入 `hello world` 来执行程序。\n* 输出 `Hello World!` 将打印在屏幕上。\n\n你需要确保注意一个细微的区别（如果你熟悉\
  \ Java 的话）：类名和程序文件名可以不同。此外，C# 是区分大小写的，而且它们不是用句号或其他符号结束句子，而是使用分号结束。此外，始终记住主方法是程序执行开始的点。\n\
  \n这四个组成部分需要注意，以避免在编码出现错误时产生令人烦恼和枯燥的问题解决工作。\n\n在虚拟环境中尝试上面的示例。现在我们将稍微讨论一下 C# 的语法，以及我们讨论过的某些概念与结构是如何真正开发和说明语法的。首先，允许你对程序进行注释的\
  \ `/*…*/` 是一个需要记住的重要特征。\n\n此外，记住在为类命名时，名称中的第一个字符只能是字母，不能是数字。虽然你可以在初始数字后加上字母和数字来创建类本身，但始终记住这一点，并且类名中始终不允许使用符号。最后，名称不能包含\
  \ C# 关键字。关键字分为两类：上下文关键字和保留关键字，下面我将在各自的类别中列出它们。\n\n**上下文关键字**—— get、`partial`、`from\
  \ orderby`、`let`、`dynamic`、`set`、`join`、`descending`、`ascending`、`into select`、`alias`、`group`、`remove`、`global`\
  \ 和 `add`。\n\n**保留关键字**—— `case`、`decimal`、`event`、`for`、`int`、`new`、`continue`、`enum`、`in`、`float`、`byte`、`namespace`、`in`、`long`、`else`、`fixed`、`const`、`break`、`finally`、`lock`、`implicit`、`double`、`class`、`is`、`if`、`bool`、`do`、`false`、`checked`、`base`、`goto`、`internal`、`extern`、`delegate`、`as`、`char`、`foreach`、`explicit`、`interface`、`default`、`abstract`、`catch`、`try`、`internal`、`is`、`interface`、`sealed`、`null`、`switch`、`object`、`short`、`protected`、`this`、`operator`、`sizeof`、`is`、`public`、`throw`、`out`、`readonly`、`lock`、`true`、`long`、`red`、`out`、`static`、`override`、`namespace`、`string`、`return`、`typeof`、`params`、`new`、`struct`、`uint`、`sbyte`、`volatile`、`unchecked`、`throw`、`stakalloc`、`ref`、`private`、`while`、`void`、`virtual`\
  \ 和 `sealed`。\n\n**重要提示**：确保你所有的程序都有格式化的代码。这样你就可以保证代码的可读性。\n\n### C# 中不同关键字的分解\n\
  \n关键字是特殊的预定义保留字，每个关键字都分配有唯一的含义。这些关键字可以组织成不同的类别，以便更好地理解。下面是按类型分类的关键字列表。\n\n#### 1)\
  \ 用于类、方法、字段和属性的关键字\n* `abstract`\n* `extern`\n* `internal`\n* `new`\n* `const`\n\
  * `override`\n* `protected`\n* `private`\n* `public`\n* `sealed`\n* `readonly`\n\
  * `static`\n* `virtual`\n* `void`\n\n#### 2) 用于类型转换的关键字\n* `explicit`\n* `implicit`\n\
  * `as`\n* `is`\n* `operator`\n* `sizeof`\n* `typeof`\n\n#### 3) 用于程序流程的关键字\n* `if`\n\
  * `else`\n* `for`\n* `foreach`\n* `in`\n* `case`\n* `break`\n* `continue`\n* `return`\n\
  * `while`\n* `goto`\n* `default`\n* `do`\n* `switch`\n\n#### 4) 用于内置类型和枚举的关键字\n\
  * `bool`\n* `char`\n* `class`\n* `byte`\n* `decimal`\n* `enum`\n* `double`\n* `float`\n\
  * `interface`\n* `long`\n* `int`\n* `object`\n* `sbyte`\n* `short`\n* `string`\n\
  * `uint`\n* `struct`\n* `ulong`\n* `ushort`\n\n#### 5) 用于异常处理的关键字\n* `try`\n* `catch`\n\
  * `throw`\n* `finally`\n* `checked`\n* `unchecked`\n\n#### 6) 用于字面量、方法传递的关键字\n*\
  \ `true`\n* `false`\n* `null`\n* `this`\n* `value`\n* `out`\n* `params`\n* `ref`\n\
  \n#### 7) 用于函数指针、对象分配、托管代码的关键字\n* `delegate`\n* `event`\n* `new`\n* `stackalloc`\n\
  * `unsafe`\n\n\n\n\n一个 C# 程序包含一个或多个 `.cs` 文件，这些文件存储数据类型和类定义。你需要编译这些 `.cs` 文件以获取可执行代码（即以\
  \ `.dll` 或 `.exe` 结尾的文件）。例如，如果你将编译 `HelloCSharp` 程序，你将得到一个名为 `HelloCSharp.exe` 的可执行文件。\n\
  \n# 创建 C# 程序所需的准备\n\n在在使用 C# 编写程序之前，你需要两件重要的东西——文本编辑器（例如，记事本）和 `.NET` 框架。文本编辑器将帮助你编写和编辑代码。而\
  \ `.NET` 框架将帮助你编译和执行程序。\n\n## 什么是 .NET？\n\n基本上，`.NET` 是一个为开发和执行计算机程序而设计的框架。大多数现代\
  \ Windows 系统都内置了 `.NET` 框架。因此，如果你使用的是微软的现代操作系统，就不需要在你的计算机上安装任何软件。\n\n如果你使用的是旧版本的\
  \ Windows 系统，需要先下载 `.NET` 框架。你可以访问此[网站](http://download.microsoft.com)101 并获取最新版本的\
  \ .NET。\n\n**重要提示**：在阅读本书其余内容之前，请确保你的计算机已安装 `.NET`。否则，你在编译和执行稍后看到的示例程序将会遇到问题。\n\n\
  ## 文本编辑器\n\n你应该使用文本编辑器来编写、编辑和保存源代码。你可以使用计算机上安装的任何文本编辑器。如果你不想下载额外的程序，可以仅使用“记事本”（即\
  \ Windows 计算机预装的文本编辑器）。\n\n## 编译和执行程序\n\n你需要执行的操作包括：\n\n1. 生成一个 `.cs` 文件并将其命名为 `HelloCSharp`。\n\
  2. 在该 `.cs` 文件中编写源代码。\n3. 编译代码以获取 `.exe` 文件。\n4. 运行生成的程序。\n\n打开你的计算机，让我们开始编写代码吧。\n\
  \n**重要提示**：本电子书假设你正在使用 Windows 计算机。\n\n# 第 3 章：揭开数据类型的迷秘\n\n现在让我们谈谈数据以及你在 C# 中看到的不同类型，我们将其分为三个基本类别。这些类别分别是值类型、指针类型和引用类型。如果你熟悉编程，那么一定对与数据类型关联的不同值类型非常熟悉。\n\
  \n## 特性\n\n数据类型具有以下特性：\n\n* 名称（例如 `int`、`char`、`bool` 等）\n* 大小（例如 1 字节）\n* 默认值（例如\
  \ 1, 2, 3 等）\n\n## C# 中不同的数据类型\n\nC# 支持以下数据类型：\n\n* 布尔值\n* 字符\n* 对象\n* 浮点数\n* 小数\n\
  * 整数\n* 字符串\n\n由于这些数据类型已预装在 C# 语言中，程序员将它们称为“原始类型”。\n\n### 值类型\n数据的值类型顾如其名，是由值本身组成的数据类型。这些术语如布尔数据、`byte`\
  \ 或 `int`。在你的虚拟环境中运行的一个良好测试是使用 `sizeof(type)` 术语获取给定数据类型的大小，只需将 `type` 替换为你想要大小的数据类型即可。值数据类型的完整列表为\
  \ `decimal`、`double`、`bool`、`float`、`char`、`byte`、`long`、`sbyte`、`short`、`uint`、`int`、`ushort`\
  \ 和 `ulong`。\n\n### 引用类型\n在数据的引用类型中，我们查看的是（你可能猜到了！）对某种数据类型的引用。这些数据类型能够告诉你内存的位置。甚至可以对多个变量有多个引用。对于这类数据，我们使用\
  \ `string`、`dynamic` 和 `object` 作为描述引用数据类型的关键字。\n\n### 指针类型\n最后一种数据类型是指针，它指向不同的变量以引导你到达适当的位置。为了加强你确实知道什么是指针，这里有一个指针变量声明的通用示例——\n\
  \n```\ntype *var-name;\n```\n\n放心地在你自己的字典里玩玩这些变量，看看对这些变量可以得到什么样的输出。我认为在编程和编码中，你还有你应该注意的另一个重要短语。这就是你使用\
  \ `/unsafe` 命令时——\n\n```\ncsc /unsafe darkprog.cs\n```\n\n在上面的示例中，我们指定为安全的程序是 `darkprog.cs`。\n\
  \nC# 是一门强类型语言；因此，它要求你在声明变量时随时标明数据类型。让我们探索一些常见的数据类型以及它们的工作原理：\n\n1. `bool`——这是一个简单的数据类型。它只接受两个值：True（真）或\
  \ False（假）。你需要使用 `bool`（即 C# 关键字）来声明这种数据类型。布尔值只产生 `true` 或 `false`。在 C# 编程语言中，布尔值被自动设置为\
  \ `false`。程序员使用这种数据类型来存储逻辑语句的结果。在使用 `if` 语句等逻辑运算符时非常适用。\n2. `int`——代表整数。它是一种用于存储没有小数值的数字的数据类型。它标记了最常用的数字数据类型。整数还有几种形式。\n\
  3. `string`——这是用于存储文本的字符串序列。C# 中的字符串是不可变的，意味着它们一旦创建就无法更改。\n4. `char`——这用于存储单个字符。你需要使用\
  \ `char`（C# 关键字）来声明这种类型。将字符值写在单引号内（例如 ' '）。\n5. `float`——这是用于存储具有小数数值的数据类型。\n\n\
  ## 对象\n\n程序员将对象视为 C# 语言中最特殊的数据类型。基本上，对象作为 .NET 中其他数据类型的父类。你可以将对象视为指向内存某些部分的地址。\n\
  \n## 实数类型——浮点数\n\n在 C# 语言中，“实类型”指的是你在数学中学习的实际数字。浮点实类型可以是 `float` 或 `double`。\n\n\
  1. `float`——程序员将这种子类型称为“单精度整数”。float 数字的默认值为 `0.0F`（末尾的 f 不区分大小写）。字母 `f` 表示该值为 `float`。\n\
  2. `double`——程序员在引用这种子类型时使用“双精度整数”。它的默认值为 `0.0D`。C# 自动将实数标记为 `double`，所以你不需要在值的末尾添加\
  \ `d`。\n\n## 实数类型——小数\n\n这种编程语言支持“小数运算”，使用使用小数表示数字的数学方法。这种方法在处理数值时会保持其精度。C# 使用 `decimal`\
  \ 数据类型来表示这种实数。该数据类型长度为 128 位，精确到 29 位小数。由于其卓越的精度，这些被程序员用于财务计算（例如支付、税收、利息等）。\n\n\
  ## 整数\n\n该数据类型由 8 个子类型组成，分别是：\n\n* `sbyte`：sbyte 是一种 8 位的有符号整数。这意味着它可以包含多达 256 个值（即\
  \ 2⁸）。此外，sbyte 可以是负或正。\n* `byte`：该子类型包含 8 位的无符号整数。它与 sbyte 几乎相同。唯一的区别是 byte 永远不会为负。\n\
  * `short`：这些整数是有符号的  16 位。\n* `ushort`：这些是长度为 16 位的无符号整数。\n\n\n\n\n\n- `INT`: 这可能是\
  \ C# 中最流行的数据类型。程序员使用这种数据类型是因为它可以完美兼容 32 位处理器，并且足够大用于典型的计算。它是一个长度为 32 位的有符号整数。\n\
  - `UINT`: 这种 32 位整数是无符号的。因此，它只能是正数。\n- `LONG`: 这个整数长度为 64 位。它可以是正数也可以是负数。\n- `ULONG`:\
  \ 这与 `long` 整数类似。唯一的区别是 `ulong` 只能取正值。\n\n# 字符串\n\n字符串是字符的集合或序列。在 C# 中，声明属于此类数据类型的值时，你需要使用\
  \ `string`（即一个关键字）。你必须在对引号之间编写每个字符串。该语言允许你对字符串执行各种操作（例如：拼接、字符替换、字符搜索等）。\n\n`sizeof()`\
  \ 方法允许我们了解变量或数据类型的大小。大小以字节的形式返回。请考虑以下示例：\n\n```csharp\nusing System;\n\nnamespace\
  \ TypeApp {\n\n  class IntType {\n    static void Main(string[] args) {\n      Console.WriteLine(\"\
  Size of int: {0}\", sizeof(int));\n      Console.ReadLine();\n    }\n  }\n}\n```\n\
  \n代码应该返回：\n\n![](img/00179.jpg)\n\n这意味着一个整数占用 4 字节的存储空间吗？\n\n# 第 4 章：变量操作\n\n你可以使用变量来存储、检索和修改可变数据。作为程序员，你需要在存储和处理信息时使用变量。\n\
  \n## 变量的特征\n\n变量具有以下特征：\n\n- 名称（也称为“标识符”）\n- 数据类型\n- 值（即你想存储的信息）\n\n变量是具有名称的计算机内存区域。它们存储值并允许计算机程序访问其内容。你可能将变量存放在栈（即你计算机程序的运行内存）中，或者存放在程序的动态内存中。\n\
  \n字符、布尔值和整数被称为“值类型”，因为它们将数据保留在程序的栈中。相反，字符串、数组和对象被称为“引用类型”，因为它们在内部并不持有值。相反，它们充当标记，指向存储数据的计算机内存部分。\n\
  \n## 如何命名变量\n\n你需要在使用变量之前为它们命名。变量名起当标识符的作用：它帮助程序定位和指定变量。C# 允许你自由选择变量名。然而，就像任何其他语言一样，C#\
  \ 对变量名也有一些规则。这些规则如下：\n\n- 你可以使用下划线（即 `_`）、字母和数字来创建变量名。\n- 你不能用数字开头命名。因此，`FirstSample`\
  \ 是有效的，而 `1stSample` 是无效的。局部变量使用 `camelCase`（驼峰命名法），例如 `cost`、`orderDetail`、`dateOfBirth`\
  \ 和 `firstName`。\n- 在命名变量时不能使用 C# 关键字。这个简单的规则可以防止你的程序中出现编译错误和运行时错误。如果你真的想为变量使用关键字，可以使用\
  \ `@` 符号开头名称（例如 `@bool`、`@int`、`@char` 等）。\n- 仅通过看一眼变量中存储的信息，变量名应该是一个有意义或具有描述性的名称，既不太长也不太短，通过它就能识别变量中存储的信息。\n\
  - 可以包含字母 a–z 和 A–Z、数字 0–9 以及下划线（`_`）字符——不允许其他符号。\n- 不能有空格且不能以数字开头。\n\n### 有效名称\n\
  - `cost`、`name`、`order`、`order1`、`_order1`、`income`\n- `order_Detail`、`orderDetail`、`dateOfBirth`、`hourlyRate`、`firstName`、`first_Name`、`isValid`\n\
  \n### 无效名称\n- `1`（数字）\n- `class`、`while`、`if`、`protected`（关键字）\n- `1order`、`1name`（以数字开头）\n\
  \n## 如何声明变量\n\n你应该在使用变量之前声明它。声明变量时：\n\n1. 指定变量的数据类型（例如 `char`）\n2. 指定变量的（例如 `sample`）\n\
  3. 设置变量的初始值。这一步是完全可选的。\n\n变量声明的格式为：\n`data_type name = initial_value;`\n\n以下是一些有效的变量声明示例：\n\
  \n```csharp\nint year = 2000;\n...\n```\n\n**重要注意**：你需要使用分号结束每个 C# 语句。\n\n## 如何赋值\n\
  \n与任何其他语言一样，C# 允许你赋值。这个过程被称为“赋值”，要求你使用等号。将变量名写在左侧，然后在另一侧指定值。\n\n```csharp\ntest\
  \ = x;\nname = \"John\";\n```\n\n## 如何初始化变量\n\n在编程中，“初始化”是给新变量赋值的过程。\n\n```csharp\n\
  // 这是一个示例\nbyte years = 10;\nshort days = 31;\ndecimal pi = 3.14;\nbool isTasty\
  \ = true;\nchar sample = 'x';\nstring animal = \"dog\";\n```\n\n**重要注意**：以双斜杠（`//`）开行的是“注释”。在编程中，注释是为了提高可读性而添加的描述性文本。编译器会忽略这些行。因此，注释不会影响程序。\n\
  \n## 创建标识符\n\n如果你查看 Microsoft 提供的一些，你会发现他们建议在处理变量时使用 `camelCase`，而当你想处理方法时，建议使用\
  \ `PascalCase`（大驼峰命名法）。使用驼峰命名法意味着你将变量名称的首字母保持小写。如果你创建一个包含复合单词的标识符，请确保第二个单词的首字母大写：\n\
  \n- `completePayment`\n- `mathematicsFirst`\n\n大驼峰命名法的方式略有不同。这种命名风格要求使用大写字母开始第一个单词。序列中其他单词的首字母也应该大写。使用大驼峰命名法的示例包括：\n\
  \n```csharp\nWriteLine()\nReadLine()\nMain()\n```\n\n在命名这些标识符时，你也可以数字和下划线。但是，如果由于某种原因你不能以数字开头这些标识符，你可以写成\
  \ seven books，但不能写 `7books`。\n\n现在，这些命名法并不是强制性的，你可以随心所更改它们。但在使用 C# 时，这被认为是良好的编程规范，因此最好遵循这些规则，以便代码能够按照你想要的方式运行。\n\
  \n正如你所见，C# 是一门相当容易学习的语言。你不需要担心像其他编程语言那样难以记忆的复杂规则，然而你仍然拥有许多的力量和灵活性来充分发挥编程的价值。\n\n\
  确定赋值\n\n\n\n\n\nC# 强制执行确定赋值策略。这意味着在在使用局部变量之前，你需要用一个值对其进行初始化。假设有如下代码：\n\n```csharp\n\
  Console.WriteLine(name);\n```\n\n错误：使用了未赋值的局部变量 `name`\n\n如果你尝试使用一个未声明的变量，你的代码将无法编译。在这种情况下，编译器会提示你某些错误。尝试在没有给变量赋值的情况下使用它也会导致错误。\n\
  \n为了给变量初始化一个值，你只需要使用赋值运算符 `=` 即可。变量名位于运算符的左侧，右侧则是如下所示的值。\n\n```csharp\nname = \"\
  Pirzada\"; age = 35; weight = 70; isMarried = true;\n```\n\n在声明带有特定类型的变量时，不能用新类型重新声明它，也不能分配一个与其声明类型不兼容的值。例如，你不能声明一个\
  \ `int` 类型，然后给它赋值一个 True/False 的布尔值。\n\n```csharp\nage = true;\n```\n\n错误：无法将类型\
  \ `bool` 隐式转换为 `int`\n\n如果我尝试将字符串赋值给 `age` 变量，而它被声明为 `int` 类型。\n\n```csharp\nage\
  \ = \"Pirzada\";\n```\n\n或者\n\n```csharp\nage = name;\n```\n\n上述语句将导致编译时错误，因为字符串值无法赋值给\
  \ `int` 类型变量。\n\n你可以像下面所示，在同一行上同时结合声明和初始化语句，这样更方便。\n\n```csharp\nstring name = \"\
  Pirzada\"; int age = 35; int weight = 70; bool isMarried = true;\n```\n\n你也可以使用数学表达式。\n\
  \n```csharp\nint wowExp = (3 + 2) * 4;  Console.WriteLine(wowExp); \n```\n\n右侧会被求值，然后赋值给左侧的变量。这意味着\
  \ `3+2` 是 `5`，`5 * 4` 是 `20`，这个值会被赋值给 `wowExp` 变量。\n\n你还可以同时给多个不同的变量分配同一个值。\n\n\
  ```csharp\nint a, b, c; a = b = c = 786;  Console.WriteLine(a); Console.WriteLine(b);\
  \ Console.WriteLine(c);\n```\n\n输出：\n786\n786\n786\n\n### 使用类型推断\n\nC# 3.0 引入了带有\
  \ `var` 关键字的隐式类型变量。现在你可以在不给出显式或实际类型的情况下声明局部变量。该变量在编译时仍然接收一个类型，但该类型是由编译器提供的。\n\n\
  实际上，`var` 关键字指示编译器从初始化语句右侧的表达式中推断变量的类型。编译器的任务是确定并分配合适的类型。\n\n```csharp\nvar variableName\
  \ = variableValue; // 语法\n```\n\n`var` 是可选的，仅仅为了方便。\n\n让我们使用上面相同的变量。\n\n```csharp\n\
  var name = \"Pirzada\"; var age = 35; var weight = 70; var isMarried = true;\n```\n\
  \n现在，这些变量是隐式类型局部变量，意味着你不需要显式地指定类型。编译器负责确定并分配合适的类型。字符串变量由双引号表示，`char` 变量由单引号表示，`bool`\
  \ 类型则由 `true` 和 `false` 值表示。\n\n建议：使用 `var` 很方便，但仅当类型从赋值右侧显而易见时才使用它。\n\nDouble 用于表示带有小数点的字面量，除非你添加\
  \ `M/m` 后缀来表示小数变量，或添加 `F/f` 后缀来表示浮点变量。\n\n```csharp\nvar value = 24899.45m; var\
  \ number = 20.8f;\n```\n\n为了初始化 `number`，你需要在 `20.8` 之后添加后缀 `f`，以明确告诉编译器将 `20.8`\
  \ 转换为 `float`。同样，为了初始化 `value`，你需要添加后缀 `m` 来将 `24899.45` 转换为 `decimal` 类型。\n\n你需要遵循的几个规则：\n\
  \n- `var` 只能在单个语句中声明和初始化。否则，编译器将没有任何根据可以推推断类型。\n- `var` 不应用于类作用范围内的字段。\n- 初始化器不能为\
  \ `null` 必须是一个表达式。\n- 多个隐式类型变量不能在同一语句中初始化。\n- 除非在初始化器中创建了新对象，否则无法初始化对象。\n\n### 默认值表达式\n\
  \n默认值表达式在与泛型结合使用时特别有用，当你预先不知道给定类型的默认值将会是什么。\n\n#### default(T) 表达式：旧方法\n\n默认值表达式\
  \ `default(T)` 返回类型 `T` 的默认值，其中 `T` 是引用类型或值类型。\n\n```csharp\nT variableName = default(T);\
  \ // 语法\n```\n\n示例：\n\n```csharp\nvar name = default(string); var age = default(int);\
  \ var weight = default(int); var isMarried = default(bool);\n```\n\n#### default\
  \ 字面量：新方法\n\n默认字面量是 C# 7.1 中的一个新功能，用于获取指定类型的默认值。默认字面量在执行语句时获取默认值。它适用于值类型也适用于引用类型。\n\
  \n注意：默认字面量等同于 `default(T)`。\n\n```csharp\nstring name = default; int age = default;\
  \ int weight = default; bool isMarried = default;  Console.WriteLine(name); Console.WriteLine(age);\
  \ Console.WriteLine(weight); Console.WriteLine(isMarried);\n```\n\n在下文中，打印了空值。\n\
  \n默认字面量的输出：\n0\nFalse\n\n#### new 运算符\n\n使用 `new` 运算符调用值类型的默认构造函数。这允许使用 `new` 关键字设置变量值。\n\
  \n注意：所有值都是特定类型的实例。\n\n```csharp\nvar age = new int(); var isMarried = new bool();\
  \  Console.WriteLine(age); Console.WriteLine(isMarried);\n```\n\n输出：\n0\nFalse\n\
  \n### 第 5 章：什么是类型转换？\n\n通常情况下，运算符适用于相同类型的参数。然而，C# 语言提供了广泛的数据类型供你在某些情况下使用。对不同类型的变量进行任何操作，你必须先对其中一个进行转换。在\
  \ C# 中，类型转换可以是隐式的或显式的。\n\n每个 C# 表达式都有一个类型。该类型源于字面量、变量和结构。基本上，你可能会使用一个类型不匹配的表达式。当这种情况发生时，你会得到以下结果之一：\n\
  \n- 程序将产生编译时错误。\n- 程序将执行自动转换。这意味着程序将获得正确的表达式类型。\n\n将 `s` 类型转换为 `t` 类型允许你在程序运行时将\
  \ `s` 视为 `t`。有时，此过程需要程序员验证类型转换。查看下面的示例：\n\n- 将 `object` 转换为 `string` 需要在程序运行时验证。这种验证确保你确实想将这些值作为字符串使用。\n\
  - 将 `string` 值转换为 `object` 值不需要任何验证。因为 `string` 类型是 `object` 类型的一个分支。你可以将字符串转换为其“父类”而不会丢失数据或产生错误。\n\
  - 将 `int` 值转换为 `long` 值不需要执行验证。`long` 数据类型涵盖了 `int` 类型的所有可能值。这意味着数据可以转换而不会产生任何错误。\n\
  \n显式转换\n\n\n\n\n\n当存在信息丢失的可能性时，请使用此转换。例如，在将浮点值转换为整数时，你会经历信息丢失（即小数部分将消失）。在将宽范围类型转换为窄范围类型时，也可能会丢失某些数据（例如\
  \ `long-to-int` 转换、`double-to-float` 转换等）。要完成此过程，你需要使用“类型”操作符。查看下面的示例：\n\n```csharp\n\
  class Example\n{\n    static void Main()\n    {\n        double yourDouble = 2.1d;\n\
  \        System.Console.WriteLine(yourDouble);\n        long yourLong = (long)yourDouble;\n\
  \        System.Console.WriteLine(yourLong);\n        yourDouble = 2e9d;\n     \
  \   System.Console.WriteLine(yourDouble);\n        int yourInt = (int)yourDouble;\n\
  \        System.Console.WriteLine(yourInt);\n    }\n}\n```\n\n如果正确编译并执行，该程序将给你以下结果：\n\
  \n![](img/00063.jpg)\n\n### 隐式转换\n\n只有在不可能发生数据丢失的情况下，你才能进行此类转换。这种转换被称为“隐式”，因为它不需要任何操作符。每当你将窄范围的值赋值给具有宽范围的变量时，C#\
  \ 编译器将执行隐式转换。\n\n### 字符串转换\n\nC# 允许你将任何数据类型转换为“string”。如果你使用 `+` 且至少包含一个非字符串参数，编译器将自动执行此转换过程。在这里，非字符串参数将变为字符串，`+`\
  \ 操作符将产生一个新值。\n\n隐式类型转换用于执行如从基类到派生类的转换等操作。这些操作是以所谓的“类型安全”的方式进行的。另一种类型的转换是显式转换，需要强制转换操作符来完成其功能。C#\
  \ 中有 16 种函数可以作为转换方法的内置类型使用。以下是你应该在 C# 环境中练习并熟悉的一些示例：\n\n* `ToChar`-允许你获取一个类型并将其转换为单个\
  \ Unicode 字符\n* `ToByte`-允许你通过转换某种类型来获取字节\n* `ToDateTime`-允许你通过转换某种类型（字符串或整数）来获取日期时间结构\n\
  * `ToBoolean`-允许你通过转换某种类型来获取布尔值\n* `ToDouble`-允许你通过转换某种类型来获取 double 类型\n* `ToDecimal`-允许你从浮点数转换为整数或十进制类型\n\
  * `ToInt64`-允许从某种类型转换为 64 位整数\n* `ToInt32`-允许从某种类型转换为 32 位整数\n* `ToInt16`-允许从某种类型转换为\
  \ 16 位整数\n* `ToSbyte`-允许从某种类型转换为有符号字节类型\n* `ToString`-允许从某种类型转换为字符串\n* `ToSingle`-允许从某种类型转换为较小的浮点数\n\
  * `ToUInt64`-允许从某种类型转换为 64 位无符号整数\n* `ToUInt32`-允许从某种类型转换为 32 位无符号整数\n* `ToUInt16`-允许从某种类型转换为\
  \ 16 位无符号整数\n* `ToUSbyte`-允许从某种类型转换为无符号字节类型\n\n\n\n\n逻辑运算符（也称为“布尔”运算符）接受并返回布尔值（即\
  \ `true` 或 `false`）。以下是 C# 的四种逻辑运算符：\n\n*   `&&` – 程序员将此运算符称为“逻辑与”（Logical AND）。如果两个操作数都为真，它将给您返回\
  \ `true`。\n*   `^` – 这被称为“异或或”（Exclusive OR）运算符。如果其中一个操作数为真，它将给你返回 `true`。\n*  \
  \ `||` – 这是“逻辑或”（Logical OR）运算符。如果至少有一个运算符为真，你将得到 `true`。\n*   `!` – 此运算符被称为“逻辑非”（Logical\
  \ Negation）运算符，它会反转操作数的值。\n\n通过学习代码来理解这些运算符的使用：\n\n```cs\nclass Test\n{\n    static\
  \ void Main()\n    {\n        bool x = true, y = false;\n        System.Console.WriteLine(x\
  \ && y);\n        System.Console.WriteLine(x || y);\n        System.Console.WriteLine(!x);\n\
  \        System.Console.WriteLine(x ^ y);\n        // This is an example.\n    }\n\
  }\n```\n\n一旦你编译并运行这段代码，你将看到以下结果：\n\n![](img/00022.jpg)\n\n# 算术运算符\n\n这些运算符可以帮助你执行数学运算。该类别包含以下运算符：\n\
  \n*   `+` – 使用此运算符对两个操作数或值进行加法运算（例如 `int x = 1 + 1`）\n*   `-` – 此运算符允许你在代码中执行减法。它从左操作数的值中减去右操作数的值（例如\
  \ `int x = 2 – 1`）\n*   `*` – 通过此运算符，你可以相乘两个操作数的值（例如 `int r = 6 * 6`）\n*   `/` –\
  \ 使用此运算符在你的 C# 代码中除法数值。基本上，`/` 将左侧操作数的值除以右侧操作数的值。\n*   `++` – 这被称为“递增运算符”。它将操作数的值增加一。与上面讨论的运算符不同，此运算符作用于单个操作数。此外，你也可以将其写在操作数之前或之后（例如\
  \ `99++, 1++, ++5` 等）。\n*   `--` – 此运算符是递增运算符的相反运算符。你可以用它将操作数的值减少一。你可以将其写在你想要修改的操作数之前或之后。\n\
  *   `%` - 这通常被称为余数，或通常被称为“取模”（modulo）运算符。它的功能是将左操作数除以右操作数，然后返回余数。\n\n提供的代码将向你展示这些运算符是如何工作的：\n\
  \n```cs\nclass Test\n{\n    static void Main()\n    {\n        double d = 100, e\
  \ = 3;\n        System.Console.WriteLine(d + e);\n        System.Console.WriteLine(d\
  \ - e);\n        System.Console.WriteLine(d / e);\n        System.Console.WriteLine(d\
  \ * e);\n        System.Console.WriteLine(++d);\n        System.Console.WriteLine(--e);\n\
  \        // This is an example.\n    }\n}\n```\n\n一旦你编译并执行该代码，你将看到以下结果：\n\n![](img/00124.jpg)\n\
  \n# 二元运算符\n\n这些运算符以二元方式工作。在 C# 中，这些运算符的结果将是布尔值。这意味着得到的答案将是 `true` 或 `false`。以下是你可以使用的一些二元运算符：\n\
  \n*   `&` – 这被称为“二元与”（Binary AND）。\n*   `^` – 程序员将此称为“二元异或”（Binary Exclusive OR）。\n\
  *   `|` – 这是“二元或”（Binary OR）。\n*   `~` – 它充当“二元非”（Binary Negation）。\n*   `<<` –\
  \ 这被称为“二元移位”（Binary Shift）。\n\n# 比较运算符\n\n下一类型的运算符允许你比较值。这些运算符的功能是返回布尔结果。当你想要创建条件语句时，这非常有用。以下是一些比较运算符：\n\
  \n*   `==` – 这是相等运算符。如果值最终相等，它会告诉你 `true`。否则，它会告诉你 `false`。\n*   `>` – 这是“大于”运算符。如果左侧的操作数大于右侧，它会告诉你\
  \ `true`。\n*   `<` – 这是“小于”运算符。如果左侧的操作数小于右侧，它会告诉你 `true`。\n*   `>=` – 这是“大于或等于”运算符。如果左侧的值大于或等于右侧，它会告诉你\
  \ `true`。\n*   `<=` – 这是“小于或等于”运算符。如果左侧的值小于或等于右侧，它会告诉你 `true`。\n*   `!=` – 这是“不等于”运算符。如果值最终不相等，它会告诉你\
  \ `true`。\n\n# 条件运算符\n\nC# 用户将 `?` 称为条件运算符。基本上，此运算符使用布尔表达式的结果来确定应该处理哪条语句。这被称为“三元运算符”，因为它作用于三个操作数。\n\
  \n```cs\nfirst_operand ? second_operand : third_operand;\n```\n\n\n\n\nC# 拥有条件语句，主要用于控制执行流。条件语句要求程序员指定一个条件或一组条件，以及当发现条件为真时要执行的相应语句。程序员还可以指定当条件不为真时要执行的语句集。\n\
  \n让我们讨论一下 C# 中支持的各种条件语句。\n\n## if 语句\n\n该语句用于在执行一组语句之前评估布尔表达式。如果条件为真，则将执行一组语句；否则，将执行另一组语句。以下是该语句的语法：\n\
  \n```cs\nif(boolean_expression) {\n  /* 如果上述布尔表达式为真，则执行语句 */\n}\n```\n\n这里是一个示例：\n\
  \n```csharp\nusing System;\n\nnamespace DecisionMaking {\n  class IfStatement {\n\
  \    static void Main(string[] args) {\n      /* 定义局部变量 */\n      int x = 5;\n \
  \     /* 通过 if 语句检查布尔条件 */\n      if (x < 10) {\n          /* 如果条件为真，则打印 */\n  \
  \        Console.WriteLine(\"x is less than 10\");\n      }\n      Console.WriteLine(\"\
  The value of x is : {0}\", x);\n      Console.ReadLine();\n    }\n  }\n}\n```\n\n\
  代码返回以下输出：\n\n![](img/00016.jpg)\n\n发现条件为真，即变量 `x` 的值小于 10，因此执行了条件正下方的语句。如果条件为假会呢？\n\
  \n```csharp\nusing System;\n\nnamespace DecisionMaking {\n  class IfStatement {\n\
  \    static void Main(string[] args) {\n      /* 定义局部变量 */\n      int x = 15;\n\
  \      /* 通过 if 语句检查布尔条件 */\n      if (x < 10) {\n          /* 如果条件为真，则打印 */\n \
  \         Console.WriteLine(\"x is less than 10\");\n      }\n      Console.WriteLine(\"\
  The value of x is : {0}\", x);\n      Console.ReadLine();\n    }\n  }\n}\n```\n\n\
  代码返回：\n\n![](img/00098.jpg)\n\n发现条件为假，因此执行了其块之外的语句。\n\n## if-else 语句\n\n这简单来说是 `if`\
  \ 语句与 `else` 部分的结合。如果条件为真，则执行 `if` 部分；当条件为假时，执行 `else` 部分。这两个部分不能同时执行。以下是该语句的语法：\n\
  \n```cs\nif(boolean_expression)\n{\n  // 如果条件为真，执行代码\n}\nelse\n{\n  // 如果条件为假，执行代码\n\
  }\n```\n\n考虑下面给出的示例：\n\n```csharp\nusing System;\n\nnamespace DecisionMaking {\n\
  \  class IfElseStatement {\n    static void Main(string[] args) {\n      /* 定义局部变量\
  \ */\n      int x = 5;\n      /* 检查布尔条件 */\n      if (x < 10) {\n          /* 如果条件为真，将打印以下内容\
  \ */\n          Console.WriteLine(\"x is less than 10\");\n      } else {\n    \
  \      /* 如果条件为假，将打印以下内容 */\n          Console.WriteLine(\"x greater than 10\");\n\
  \      }\n      Console.WriteLine(\"The value of x is : {0}\", x);\n      Console.ReadLine();\n\
  \    }\n  }\n}\n```\n\n代码返回：\n\n![](img/0015.jpg)\n\n`if` 条件评估为真，因此其块内的语句已执行。如果条件为假会呢？\n\
  \n```csharp\nusing System;\n\nnamespace Making {\n  class IfStatement {\n    static\
  \ void Main(string[] args) {\n      /* 定义局部变量 */\n      int x = 15;\n      /* 检查布尔条件\
  \ */\n      if (x < 10) {\n          /* 如果条件为真，将打印以下内容 */\n          Console.WriteLine(\"\
  x is less than 10\");\n      } else {\n          /* 如果条件为假，将打印以下内容 */\n        \
  \  Console.WriteLine(\"x greater than 10\");\n      }\n      Console.WriteLine(\"\
  The value of x is : {0}\", x);\n      Console.ReadLine();\n    }\n  }\n}\n```\n\n\
  代码给出了：\n\n![](img/0036.jpg)\n\n`if` 条件评估为假，因此 `else` 块内的语句已执行。你一定已经注意到，在两种情况下，两个块之外的部分都已执行了。这就是发生的情况。\n\
  \n## else…if 语句\n\n在某些情况下，我们可能需要检查多个条件。在这种情况下，我们可以使用 `else if` 语句。它采用下面的语法：\n\n\
  ```cs\nif(boolean_expression a) {\n  /* 如果布尔表达式 a 为真，则运行 */\n}\nelse if( boolean_expression\
  \ b) {\n  /* 如果布尔表达式 b 为真，则运行 */\n}\nelse if( boolean_expression c) {\n  /* 如果布尔表达式\
  \ c 为真，则运行 */\n} else {\n  /* 如果上述所有条件均为假，则运行 */\n}\n```\n\n这里是一个示例：\n\n```csharp\n\
  using System;\n\nnamespace DecisionMaking {\n  class ElseIfStatement {\n    static\
  \ void Main(string[] args) {\n      /* 定义局部变量 */\n      int x = 5;\n      /* 检查布尔条件\
  \ */\n      if (x == 1) {\n          /* 如果条件为真，则执行语句 */\n          Console.WriteLine(\"\
  Value of x is 1\");\n      }\n      else if (x == 2) {\n          /* 如果 else if\
  \ 条件为真，则运行 */\n          Console.WriteLine(\"Value of x is 2\");\n      }\n    \
  \  else if (x == 3) {\n          /* 如果 else if 条件为真，则运行 */\n          Console.WriteLine(\"\
  Value of x is 3\");\n      } else {\n          /* 如果上述所有条件均为假，则运行 */\n         \
  \ Console.WriteLine(\"All conditions are false\");\n      }\n      Console.WriteLine(\"\
  The value of x is : {0}\", x);\n      Console.ReadLine();\n    }\n  }\n}\n```\n\n\
  代码打印：\n\n![](img/0080.jpg)\n\n所有条件均为假；因此执行了条件之外的代码块。我们将 `x` 的值设置为 2，看看代码会发生什么：\n\
  \n```csharp\nusing System;\n\nnamespace DecisionMaking {\n  class ElseIfStatement\
  \ {\n    static void Main(string[] args) {\n      /* 定义局部变量 */\n      int x = 2;\n\
  \      /* 检查条件 */\n      if (x == 1) {\n          /* 如果条件为真，则执行语句 */\n         \
  \ Console.WriteLine(\"Value of x is 1\");\n      }\n      else if (x == 2) {\n \
  \         /* 如果 else if 条件为真，则运行 */\n          Console.WriteLine(\"Value of x is\
  \ 2\");\n      }\n      else if (x == 3) {\n          /* 如果 else if 条件为真，则运行 */\n\
  \          Console.WriteLine(\"Value of x is 3\");\n      } else {\n          /*\
  \ 如果上述所有条件均为假，则运行 */\n          Console.WriteLine(\"All conditions are false\");\n\
  \      }\n      Console.WriteLine(\"The value of x is : {0}\", x);\n      Console.ReadLine();\n\
  \    }\n  }\n}\n```\n\n## 嵌套 if 语句\n\nC# 允许我们嵌套条件语句。我们可以嵌套 both `if` 和 `else if`\
  \ 语句，这意味着我们在另一个 `if` 或 `else if` 语句内部使用它们。下面的语法演示了如何在 C# 中嵌套 `if` 语句：\n\n```cs\n\
  if( boolean_expression a) {\n  /* 如果布尔表达式 a 为真，则执行 */\n  if(boolean_expression b)\
  \ {\n    /* 如果布尔表达式 b 为真，则执行 */\n  }\n}\n```\n\n\n\n`else if` 语句可以使用上述语法进行嵌套。\n\n\
  请考虑下面的示例：\n\n```csharp\nusing System;\n\nnamespace DecisionMaking {\n\n  class NestedIf\
  \ {\n\n    static void Main(string[] args) {\n      /* 定义局部变量 */\n      int x =\
  \ 1;\n      int y = 2;\n      /* 检查布尔条件 */\n      if (x == 1) {\n          /* 如果条件为真，则检查下面的\
  \ if 句 */\n          if (y == 2) {\n            /* 如果条件为真，打印以下内容 */\n          \
  \  Console.WriteLine(\"Value of x is 1 and b is 2\");\n          }\n      }\n  \
  \    Console.WriteLine(\"Exact value of x is : {0}\", x);\n      Console.WriteLine(\"\
  Exact value of y is : {0}\", y);\n      Console.ReadLine();\n    }\n  }\n}\n```\n\
  \n该代码返回：\n\n![](img/00017.jpg)\n\n两个 `if` 条件都评估为真，因此嵌套 `if` 内的语句被执行。如果其中一个或两个条件都评估为假，则该语句将无法执行。这里是一个示例：\n\
  \n```csharp\nusing System;\n\nnamespace DecisionMaking {\n\n  class NestedIf {\n\
  \n    static void Main(string[] args) {\n      /* 定义局部变量 */\n      int x = 1;\n\
  \      int y = 2;\n      /* 检查布尔条件 */\n      if (x == 1) {\n          /* 如果条件为真，则检查下面的\
  \ if 句 */\n          if (y == 3) {\n            /* 如果条件为真，打印以下内容 */\n          \
  \  Console.WriteLine(\"Value of x is 1 and b is 2\");\n          }\n      }\n  \
  \    Console.WriteLine(\"Exact value of x is : {0}\", x);\n      Console.WriteLine(\"\
  Exact value of y is : {0}\", y);\n      Console.ReadLine();\n    }\n  }\n}\n```\n\
  \n在上述代码中，嵌套的 `if` 条件检查变量 `y` 的值是否为 3，结果为假。该块内的语句将不会执行。C# 编译器将跳过此部分并继续执行条件外部的代码。它返回以下内容：\n\
  \n![](img/00144.jpg)\n\n## switch 语句\n\n该语句与使用多个 `if` 语句相同。它通过一组可能的情况创建，每种情况对应一个操作，以及一个在任何选项未评估为真时执行的默认部分。以下是该语句的语法：\n\
  \n```csharp\nswitch(expression)\n{\n    case <value_1>\n        // code\n      \
  \  break;\n\n    case <value_2>\n        // code\n        break;\n\n    case <value_N>\n\
  \        // code\n        break;\n    default\n        // code\n        break;\n\
  }\n```\n\n这里是一个示例：\n\n```csharp\nusing System;\n\npublic class SwitchStatement\n\
  {\npublic static void Main()\n{\nint a = 3;\nswitch (a)\n{\n    case 1:\n      \
  \  Console.WriteLine(\"Value of x is 1\");\n        break;\n    case 2:\n      \
  \  Console.WriteLine(\"Value of x is 2\");\n        break;\n    case 3:\n      \
  \  Console.WriteLine(\"Value of x is 3\");\n        break;\n    default:\n     \
  \   Console.WriteLine(\"Unknown value of x\");\n        break;\n}\n}\n}\n```\n\n\
  该代码返回：\n\n![](img/0005.jpg)\n\n变量 `a` 的值被初始化为 3。执行代码后，将匹配 3 的 `case`，因此其块内的语句将被执行。如果没有任何\
  \ `case` 条件为真，则将执行 `default` 部分。下文所示：\n\n```csharp\nusing System;\n\npublic class\
  \ SwitchStatement\n{\npublic static void Main()\n{\nint a = 5;\nswitch (a)\n{\n\
  \    case 1:\n        Console.WriteLine(\"Value of x is 1\");\n        break;\n\
  \    case 2:\n        Console.WriteLine(\"Value of x is 2\");\n        break;\n\
  \    case 3:\n        Console.WriteLine(\"Value of x is 3\");\n        break;\n\
  \    default:\n        Console.WriteLine(\"Unknown value of x\");\n        break;\n\
  \    }\n}\n}\n```\n\n该代码返回下方的输出：\n\n![](img/00034.jpg)\n\n`switch` 语句中的 `case` 标签必须是唯一的。`switch`\
  \ 语句可用于任何类型的表达式，包括字符串、整数、bool、char 等。以下是如何配合字符串使用它：\n\n```csharp\nusing System;\n\
  \npublic class SwitchStatement\n{\npublic static void Main()\n{\nstring firstName\
  \ = \"Nicholas\";\nswitch (firstName)\n{\n    case \"Samuel\":\n        Console.WriteLine(\"\
  Your first name is Samuel\");\n        break;\n    case \"Nicholas\":\n        Console.WriteLine(\"\
  Your first name is Nicholas\");\n        break;\n    case \"Bismack\":\n       \
  \ Console.WriteLine(\"Your first name is Bismack\");\n        break;\n}\n}\n}\n\
  ```\n\n该代码返回以下输出：\n\n![](img/00158.jpg)\n\n## switch 中的 goto\n\n在运行 `switch` 语句的某些情况下，我们可能需要跳转到某个\
  \ `case`。这可以使用跳转语句或 `goto` 语句来实现。如下例所示：\n\n```csharp\nusing System;\n\npublic class\
  \ SwitchStatement\n{\npublic static void Main()\n{\nstring firstName = \"Nicholas\"\
  ;\nswitch (firstName)\n{\n    case \"Samuel\":\n        Console.WriteLine(\"Your\
  \ first name is Samuel\");\n        break;\n    case \"Nicholas\":\n        Console.WriteLine(\"\
  Your first name is Nicholas\");\n        break;\n    case \"Bismack\":\n       \
  \ Console.WriteLine(\"Your first name is Bismack\");\n        break;\n}\n\n## 嵌套\
  \ switch\n\n`switch` 语句可以在另一个 `switch` 语句内部创建。这是一个示例：\n\n```csharp\nusing System;\n\
  \npublic class NestedSwitch\n{\npublic static void Main()\n{\nint x = 10;\nswitch\
  \ (x)\n{\ncase 10:\n    Console.WriteLine(10);\n    switch (x - 1)\n    {\n    case\
  \ 9:\n        Console.WriteLine(9);\n        break;\n    }\n    break;\ncase 20:\n\
  \    Console.WriteLine(20);\n    switch (x - 1)\n    {\n    case 19:\n        Console.WriteLine(19);\n\
  \        break;\n    }\n    break;\ndefault:\n    Console.WriteLine(30);\n    break;\n\
  }\n}\n}\n```\n\n## 8 章：循环\n\n作为一名程序员，你将需要循环语句来重复运行代码。循环在 C# 中起着重要作用，因此，如果你想掌握这种语言，应该仔细学习这些内容。\n\
  \n### 循环——基础\n\n在创建程序时，你经常需要多次执行代码。多次编写相同的代码块是非常无聊的。因此，你需要一种简单重复代码的方法。幸运的是，C 语言支持循环语句。\n\
  \n循环是运行代码片段的工具。你可以使用它运行特定的次数，或者只要满足给定条件一直运行。C# 提供了不同类型的循环语句。让我们详细分析每个类型：\n\n###\
  \ while 循环\n\n这是 C# 中简单的循环语句。其语法如下：\n\n```csharp\nwhile (the_assigned_condition)\n\
  {\n    the_loop_body;\n}\n```\n\n在该语法中，`the_assigned_condition` 是产生布尔值的表达式。它决定了\
  \ `body` 运行的次数。相反，`body` 是你想执行的语句（或语句组）。\n\n下图展示了 while 循环的工作原理：\n\n![](img/0178.jpg)\n\
  \n处理“while”循环时，C# 程序会检查布尔表达式的值。如果值为“真”，程序将运行循环体内的所有语句。然后，程序将检查布尔表达式的值。如果值仍然为真，程序将重新运行循环体。这个过程将持续，直到布尔表达式为假。一旦发生这种情况，程序将处理循环之后的代码块。\n\
  \n\n\n\n重要说明：如果布尔表达式为假，你的 C# 程序将不会运行 while 循环体的内容。因此，如果你在启动程序时布尔值为假，那么循环体内的语句将永远不会执行。\n\
  \n下面的示例将阐明 while 循环的工作原理：\n\n```cs\nint timer = 10;\n\nwhile (timer >= 0)\n{\n \
  \   System.Console.WriteLine(\"Time remaining: \" + timer);\n    timer--;\n}\n```\n\
  \n如果你编译并执行这段代码，命令行提示符将打印此数据：\n\n![](img/00163.jpg)\n\n## Break 运算符\n\n你可以使用 `break`（一种\
  \ C# 运算符）来提前退出循环。如果程序员不想等待循环自然结束，他们就会使用此运算符。基本上，循环一旦遇到 `break` 运算符就会结束。这种情况下会迫使程序跳转到紧随在循环\
  \ 后的代码段。\n\n在 C# 中，你只能在循环体内部使用此运算符。这意味着 `break` 只有在循环运行时才会起作用。\n\n## Do-While 循环\n\
  \n`do-while` 循环与 `while` 循环几乎相同。这两个循环之间唯一的区别是前者在运行循环体之后才分析布尔值。因此，你可以放心，即使布尔表达式为假，你的代码至少也会运行一次。这里是\
  \ `do-while` 循环的语法：\n\n```cs\ndo\n{\n    statements;\n} while (Boolean expression)\n\
  ```\n\n`do-while` 循环按照此模式工作：\n\n![](img/00014.jpg)\n\n程序将执行循环体内的所有语句。然后，它将检查条件（即布尔表达式）。如果条件评估为真，程序将再次执行循环体并执行“值检查”。这个过程将一直持续，直到条件变为假。因此，如果你分配的条件始终为真，你的代码可能会永远运行。\n\
  \n## For 循环\n\n通常情况下，`for` 循环比 `do-while` 和 `while` 循环复杂。然而，`for` 循环可以帮助你用更少的 C#\
  \ 代码完成复杂的任务。`for` 循环的语法为：\n\n```cs\nfor (initializer; Boolean_expression; update)\n\
  {\n    the_loop_body;\n}\n```\n\n一个 `for` 循环包含一个初始化器（即计数器的初始值）、一个布尔表达式、一个更新计数器的\
  \ C# 语句以及循环体。`counter`（即分配给循环的初始值）是 `for` 循环最大的特征。在大多数情况下，计数器的值会一直增加直到达到最终值（例如从\
  \ 1 到 10）。此外，程序员通常知道 `for` 循环将迭代几次。\n\n你可以在 `for` 循环中包含一个或多个变量。这些变量可以降序或升序移动。在编写程序时，你可以在单个\
  \ `for` 循环中组合升序和降序变量。此外，升序变量可以从 1 变 10，因为 `for` 循环支持算术运算（例如加法、乘法等）。\n\n重要说明：`for`\
  \ 循环的所有部分都是可选的。你可以通过留空创建一个创建一个无限 `for` 循环。这是一个示例：\n\n![](img/0137.jpg)\n\n此时，你已经准备好学习\
  \ `for` 循环的不同部分了。\n\n### 初始化\n`for` 循环可以拥有一个初始化片段：\n\n```cs\nfor (double sample\
  \ = 1; …; …)\n{\n    // 你可以在这里使用 sample 变量。\n}\n// 在这里使用该变量。\n```\n\nC# 程序在运行 `for`\
  \ 循环之前执行一次此片段。程序员通常使用初始化片段来创建一个计数器（也称为循环变量）并为其分配其初始值。该计数器在循环体内是可用且可的。C# 允许你使用初始化片段声明多个变量。\n\
  \n### 条件\n显然，`for` 循环需要一个条件表达式。这里有一个示例：\n\n```cs\nfor (double sample = 1; sample\
  \ < 5; …)\n{\n    // 这是循环体。\n}\n```\n\n计算机程序在运行循环体之前会评估条件表达式。如果结果为 `true`，则循环体将运行；否则，相关的程序将跳转到当前循环之后的语句。\n\
  \n### 更新语句\n这是 `for` 循环的最后部分。基本上，更新语句会更新循环的计数器。让我们使用代码片段：\n\n```cs\nfor (double\
  \ sample = 10; sample > 1; sample--)\n{\n    // 这是循环体。\n}\n```\n\n程序在运行循环体后执行这部分。请记住，此语句会更新计数器的值。\n\
  \n### 循环体\n这部分由 C# 语句组成。它可以利用在循环初始化片段中声明的变量。查看下面的示例：\n\n```cs\nfor (double sample\
  \ = 10; sample > 1; sample--)\n{\n    System.Console.WriteLine(sample);\n}\n```\n\
  \n### Continue 运算符\n在某些情况下，你需要停止当前的迭代而不结束循环本身。你可以使用名为 `continue` 的 C# 运算符完成此任务。下面的示例将说明该运算符如何工作：\n\
  \n![](img/0049.jpg)\n\n这段代码计算范围（1 到 n）内所有奇数的总和，这些数除以 7 时有余数。\n\n## Foreach 循环\n\
  最近，C# 引入了 `foreach` 循环的概念（即扩展的 `for` 循环）。这种循环概念也存在于其他编程语言中，如 C、C++ 等。通过这种编程工具你可以运行列表、数组或其他值组的所有元素。`foreach`\
  \ 循环即使对于非索引的数据组也能获取所有元素。\n\n在编写这种循环时，使用以下语法：\n\n```cs\nforeach (type name_of_variable\
  \ in name_of_group)\n{\n    the_statements;\n}\n```\n\n如所示，这种循环比典型的 `for` 循环简单得多。`foreach`\
  \ 循环可以帮助你快速扫描集合中的所有对象。无数程序员在编写代码时使用这种循环并不意外。\n\n## 嵌套 For 循环\nC# 允许将一个 `for` 循环放在另一个\
  \ `for` 循环内部。代码最内层的循环运行次数最多。而最外层的循环重复次数最少。在嵌套 `for` 循环时，你应该使用以下语法：\n\n```cs\nfor\
  \ (initializing_fragment, condition, update_statement)\n{\n    for (initializing_fragment,\
  \ condition, update_statement)\n    {\n        statements;\n    }\n}\n```\n\n在这里，程序运行初始\
  \ `for` 循环，执行其体并触发嵌套循环。程序将检查第二个循环的条件并执行其内部的代码，直到评估变为假。然后，程序会对循环的计数器进行必要的调整。\n\n\n\
  \n\n方法简单来说就是组合在一起以执行共同任务的语句组。每个 `C#` 类都至少有一个方法，即 `Main` 方法。为了能够使用一个方法，你必须先定义它，然后调用它来执行它原本要执行的操作。方法通过表示程序所执行的数据转换来完成任务。此外，方法是完成实际处理的区域。这就是\
  \ `C#` 程序员将方法视为任何计算机程序的基本单元的主要原因。\n\n# 方法提供的优势\n\n在本节中，你将发现 `C#` 方法提供的主要优势。在阅读完这些材料后，你将知道为什么在编写程序时应该这些工具。\n\
  \n## 更好的结构和代码可读性\n\n编程专家声称，编写计算机程序时应该使用方法。即使是最简单的方法也能提高你的 `C#` 代码结构和可读性。\n\n有一个你需要知道的重要事实：程序员花费\
  \ 20%的时间花在编写和检查计算机程序上。剩下的 80% 时间花在维护和改进软件上。显然，如果你的代码可读且结构良好，你工作程序时将会变得轻松。\n\n##\
  \ 防止冗余代码\n\n方法可以帮助你避免程序中的冗余代码。在计算机应用程序中，冗余或重复的代码往往会产生不良的结果。\n\n## 更好的代码重复\n\n如果你的程序需要多次使用某个代码片段，那么将该片段转移到\
  \ `C#` 方法中是一个极好的主意。你可以多次调用方法，这意味着你可以在不重新输入的情况下重复重要的代码。\n\n# 声明、实现和调用 C# 方法\n\n###\
  \ 方法定义\n方法定义简单来说是对构成方法结构的元素的声明。以下是 `C#` 中方法定义的语法：\n\n```text\n<Access_Specifier><The_Return_Type><Your_Method_Name>(Parameter_List)\
  \ {\n    Method Body\n}\n```\n\n此时，你需要了解可以在现有方法上可以执行的过程。这些过程是：\n\n*   **声明 (Declaration)**：在这个过程中，你将方法链接到程序中。此过程允许你在程序的任何部分调用该方法。\n\
  *   **实现 (Implementation)**：这个过程涉及输入代码来完成特定任务。这里涉及的代码存在你正在使用的方法内部。\n*   **调用 (Invocation)**：这是调用已声明方法的过程。在这里，你将使用方法来解决问题或执行操作。\n\
  \n### 方法声明\n在 `C#` 中，你需要在类内部声明方法。此外，你不允许“嵌套”方法（即在另一个方法的体内部编写方法）。此处的完美例子是 `Main()`，你已经使用过多次的方法。下面的代码将说明这一点：\n\
  \n```csharp\nclass DeclaringMethods\n{\n    static void Main()\n    {\n        System.Console.WriteLine(\"\
  Hi C#!\");\n    }\n}\n```\n\n### 语法\n在声明方法时使用以下语法：\n\n```text\nstatic data_type_of_the_result\
  \ name_of_method (list_of_parameters)\n```\n\n让我们使用 `Main()` 方法（即 `static void Main()`）来分析此语法。`Main()`\
  \ 使用 `void` 作为其返回类型，因为它不产生任何结果。`Main` 单词作为它的名称。而括号充当程序员将提供的参数的容器。\n\n**重要提示**：在编写\
  \ `C#` 程序时你必须遵循此语法。不要更改方法各个部分的位置。\n\n`C#` 不要求你在声明中包含参数。这意味着你可以让括号为空（例如 `Main()`）。\n\
  \n### 方法名称\n在声明、调用或实现期间，你需要指定方法的名称。\n\n在命名方法时你需要记住的规则如下：\n\n*   确保首字母大写写。\n*   每个单词都以大写字母开头（例如\
  \ `SampleMethod`、`NewMethod`、`MainLine` 等）。\n*   使用动词和名词作为方法的名称。\n\n**重要提示**：上述讨论的规则是完全可选的。如果你希望在你的\
  \ `C#` 代码中具有良好的结构和可读性，请遵循这些规则。\n\n### 方法实现\n声明方法是不够的。如果你想让它们在程序中运行，你还需要实现你的方法。程序员在引用方法的实现时使用“体”（body）一词。\n\
  \n#### 方法体\n你会在一对大括号内找到方法体。此体由你想要执行的命令、表达式和语句组成。因此，方法体是任何方法的组成部分。\n\n**重要提示**：记住在\
  \ `C#` 中你不能嵌套方法。不要在其他方法内部编写方法。\n\n### 方法调用\n基本上，这是运行方法体内语句的过程。调用方法简单而容易：你只需要指定它的名称，添加一对大括号，并使用分号结束该行。你应该使用的语法如下：\n\
  \n```text\nname_of_method();\n```\n\n下面的示例代码将显示如何调用方法：\n\n```csharp\nclass Animals\n\
  {\n    static void Main()\n    {\n        Console.WriteLine(\"I dogs.\");\n    }\n\
  }\n```\n如果你编译并执行该代码，你的提示符将打印出：I dogs.\n\n#### 你可以调用方法的地方\n`C#` 允许你在以下位置调用方法：\n*\
  \   在主方法内部（即 `Main()`）。\n*   在另一个方法内部。\n*   方法体内部。\n\n方法可以调用自己。这种过程被称为“递归”。考虑以下示例：\n\
  \n```csharp\nusing System;\n\nnamespace MethodApplication {\n    class NumberChecker\
  \ {\n        public int factorial(int x) {\n            /* 声明一个局部变量 */\n       \
  \     int answer;\n            if (x == 1) {\n                return 1;\n      \
  \      } else {\n                answer = factorial(x - 1) * x;\n              \
  \  return answer;\n            }\n        }\n\n        static void Main(string[]\
  \ args) {\n            NumberChecker n = new NumberChecker();\n            // 现在调用\
  \ factorial 方法\n            Console.WriteLine(\"The factorial of 8 is : {0}\", n.factorial(8));\n\
  \            Console.WriteLine(\"The factorial of 9 is : {0}\", n.factorial(9));\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n\n我们创建了阶函数以及名为 `n` 的类实例。代码将返回下面的结果：\n\
  \n(Images/0150.jpg)\n\n代码能够为我们 8 和 9 的阶乘。注意，一个数字的阶乘是除 0 以下的所有数字的乘积。例如，8 的阶乘是 `1\
  \ * 2 * 3 * 4 * 5 * 6 * 7 * 8`，结果为 40320，如上述结果所示。\n\n# 向方法传递参数\n\n如果定义方法时带有参数，那么在调用时应该向它传递参数。可以使用三种方法向方法传递参数。让我们讨论这些方法。\n\
  \n## 值传递 (Pass By Value)\n这种方法涉及将参数的实际值复制到形式函数参数。这是向方法传递参数的默认机制。在这一机制下，调用函数时会为每个值参数在内存中创建一个新位置。然后将实际参数的值复制到其中。这意味着在方法内部对参数所做的更改对参数没有影响。\n\
  \n让我们通过一个示例来演示这一点：\n\n```csharp\nusing System;\n\nnamespace MethodApplication {\n\
  \    class NumberChecker {\n        public void swap(int a, int b) {\n```\n\n\n\n\
  \n```csharp\n          int temp;\n\n          temp = a; /* saving the value of a\
  \ */\n          a = b;    /* putting b into a */\n          b = temp; /* putting\
  \ temp into b */\n      }\n      static void Main(string[] args) {\n          NumberChecker\
  \ n = new NumberChecker();\n          /* defining a local variable */\n        \
  \  int x = 10;\n          int y = 20;\n          Console.WriteLine(\"Before swapping,\
  \ value of x is : {0}\", x);\n          Console.WriteLine(\"Before swapping, value\
  \ of y is : {0}\", y);\n          /* let's swap the values by calling the function\
  \ */\n          n.swap(x, y);\n          Console.WriteLine(\"After swapping, value\
  \ of x is : {0}\", x);\n          Console.WriteLine(\"After swapping, value of y\
  \ is : {0}\", y);\n          Console.ReadLine();\n      }\n  }\n}\n```\n\n该代码给出如下输出：\n\
  \n![](img/00095.jpg)\n\n我们所做的是改变了函数内部的值。然而，上面的输出显示这种更改并没有生效；因此，它没有反映在上方。\n\n这就是我们在\
  \ C# 中按值值传递参数的方式。\n\n## 引用传递\n\n引用参数引用的是变量的内存位置。当参数按引用方式传递时，不会像按值传递那样创建新的内存位置。引用参数实际上引用与提供给方法的实际参数相同的内存位置。\n\
  \n要声明引用参数，我们使用 `ref` 关键字。让我们通过一个示例来演示这一点：\n\n```csharp\nusing System;\n\nnamespace\
  \ MethodApplication {\n\n  class NumberChecker {\n      public void swap(ref int\
  \ a, ref int b) {\n          int temp;\n          temp = a; /* saving the value\
  \ of a */\n          a = b;    /* putting b into a */\n          b = temp; /* putting\
  \ temp into b */\n      }\n      static void Main(string[] args) {\n          NumberChecker\
  \ n = new NumberChecker();\n          /* defining a local variable */\n        \
  \  int x = 10;\n          int y = 20;\n          Console.WriteLine(\"Before swapping,\
  \ value of x is : {0}\", x);\n          Console.WriteLine(\"Before swapping, value\
  \ of y is : {0}\", y);\n          /* let's swap the values by calling the function\
  \ */\n          n.swap(ref x, ref y);\n          Console.WriteLine(\"After swapping,\
  \ value of x is : {0}\", x);\n          Console.WriteLine(\"After swapping, value\
  \ of y is : {0}\", y);\n          Console.ReadLine();\n      }\n  }\n}\n```\n\n\
  该代码返回如下：\n\n![](img/00177.jpg)\n\n在按值传递中，值没有被交换。然而，在这种情况下，值已经如上所示被交换了。上面的更改反映在了\
  \ `Main` 函数中。\n\n## 输出传递\n\n`return` 语句可以帮助我们只从函数返回一个单一值。然而，通过使用输出参数，可以从一个函数返回两个值。输出参数与引用参数相同，区别在于它们是将数据传输到方法外部而不是传递到方法内部。\n\
  \n这里是一个示例：\n\n```csharp\nusing System;\nnamespace MethodApplication {\n  class NumberChecker\
  \ {\n      public void getValue(out int a ) {\n          int temp = 20;\n      \
  \    a = temp;\n      }\n      static void Main(string[] args) {\n          NumberChecker\
  \ n = new NumberChecker();\n          /* defining a local variable */\n        \
  \  int x = 10;\n          Console.WriteLine(\"Before calling the method, value of\
  \ x : {0}\", x);\n          /* call the function to get value */\n          n.getValue(out\
  \ x);\n          Console.WriteLine(\"After calling the method, the value of x is\
  \ : {0}\", x);\n          Console.ReadLine();\n      }\n}\n```\n\n它返回了：\n\n![](img/172.jpg)\n\
  \n为输出参数提供的变量应该被赋值一个值。当想要从方法返回值而无需给参数赋值时，输出参数非常有用。下面的示例将帮助你理解这一点：\n\n```csharp\n\
  using System;\nnamespace MethodApplication {\n  class NumberChecker {\n      public\
  \ void getValues(out int a, out int b ) {\n          Console.WriteLine(\"Enter in\
  \ your first value: \");\n          a = Convert.ToInt32(Console.ReadLine());\n \
  \         Console.WriteLine(\"Enter in your second value: \");\n          b = Convert.ToInt32(Console.ReadLine());\n\
  \      }\n      static void Main(string[] args) {\n          NumberChecker n = new\
  \ NumberChecker();\n          /* defining a local variable */\n          int x ,\
  \ y;\n          /* call a function to obtain the values */\n          n.getValues(out\
  \ x, out y);\n          Console.WriteLine(\"After calling the method, the value\
  \ of x is : {0}\", x);\n          Console.WriteLine(\"After calling the method,\
  \ the value of y is : {0}\", y);\n          Console.ReadLine();\n      }\n}\n```\n\
  \n你将会被提示输入两个值，请执行这些操作。你将获得在调用方法之前和之后的值。\n\n## 第 10 章：数组世界\n\n我们可以将数组定义为一种特殊的数据类型，它通过特殊语法以顺序方式存储固定数量的值。所有数组元素必须属于相同的数据类型，例如字符串、整数、双精度浮点数等。你可以将数组视为相同类型变量的集合。你使用索引来访问数组中的给定元素。\n\
  \n在内存中，最低地址标识数组的第一个元素，而最高地址标识数组的最后一个元素。\n\n### 数组声明\n\n在 C# 中使用以下语法声明数组：\n\n`datatype[]\
  \ arrayName;`\n\n`datatype` 帮助我们指定存储在数组中的元素类型，不要忘记所有元素必须属于相同类型。方括号 `[]` 有助于说明数组的秩，即要存储元素的数量。`arrayName`\
  \ 是数组名称。以下是数组声明的有效示例：\n\n- `int[] intArray;` // 可存储整数\n- `bool[] boolArray;` //\
  \ 可存储布尔值\n- `string[] stringArray;` // 可存储字符串\n- `double[] doubleArray;` // 可存储双精度浮点数\n\
  - `byte[] byteArray;` // 可存储字节值\n- `Employee[] customDepartmentArray;` // 可存储 Employee\
  \ 类的实例\n\n### 数组初始化\n\n当数组被声明后，并不意味着它已经在内存中初始化。在初始化数组后，可以给它赋值。\n\n可以在声明时使用 `new`\
  \ 关键字进行数组初始化。当使用此关键字时，会创建一个数组实例。下文所示：\n\n```csharp\nusing System;\npublic class\
  \ MyArray\n{\n    public static void Main()\n    {\n        string[] array1, array2;\n\
  \        array1 = new string[4]{ \"Nicholas\", \"Michelle\", \"John\", \"Claire\"\
  ,\n    }\n}\n```\n\n\n\n\n\n```csharp\n};\n\narray2 = new string[]{\"Nicholas\"\
  ,\n\n  \"Michelle\",\n  \"John\",\n  \"Claire\",\n  };\n\nConsole.WriteLine(array1.Length);\n\
  \nConsole.WriteLine(array2.Length);\n\n}\n\n}\n```\n\n上述机制被称为后期初始化（late initialization）。在这种情况下，必须使用\
  \ `new` 关键字完成初始化。我们不能通过简单地向其赋值来初始化数组。下面的示例展示了数组的无效初始化：\n\n```csharp\nstring[] myarray;\n\
  \nmyrray = {\"Nicholas\", \"Michelle\", \"John\", \"Claire\"};\n```\n\n## 访问数组元素\n\
  \n数组的元素是在初始化期间赋值的。然而，我们也可以使用单个索引为数组赋值。下例演示所示：\n\n```csharp\nusing System;\n\npublic\
  \ class MyProgram\n\n{\n\npublic static void Main()\n{\n\nint[] array1 = new int[5];\n\
  \narray1[0] = 1;\n\narray1[1] = 2;\n\narray1[2] = 3;\n\narray1[3] = 4;\n\narray1[4]\
  \ = 5;\n\nConsole.WriteLine(array1[0]);\n\nConsole.WriteLine(array1[1]);\n\nConsole.WriteLine(array1[2]);\n\
  \nConsole.WriteLine(array1[3]);\n\nConsole.WriteLine(array1[4]);\n\n}\n\n}\n```\n\
  \n代码将返回以下结果：\n\n![](img/00046.jpg)\n\n对数组值的检索或访问也是通过索引完成的。元素的索引放在括号内。考虑下面的示例：\n\n\
  ```csharp\narray1[0];\n\narray1[1];\n\narray1[2];\n\narray1[3];\n\narray1[4];\n\
  ```\n\n这就是我们访问名为 `array1` 的上述数组元素元素。\n\n### 使用 for 循环\n\n我们可以使用 `for` 循环来访问数组的元素。循环将遍历数组元素，并通过它们的索引访问所需的元素。例如：\n\
  \n```csharp\nusing System;\n\nnamespace ArrayApp {\n\n  class MyArray {\n    static\
  \ void Main(string[] args) {\n\n        int []  n = new int[10]; /* n 是一个包含 10 个整数的数组\
  \ */\n        int x, y;\n        /* 初始化数组 n 的元素 */\n        for ( x = 0; x < 10;\
  \ x++ ) {\n          n[ x ] = x + 50;\n        }\n        /* 输出每个数组元素的值 */\n   \
  \     for (y = 0; y < 10; y++ ) {\n          Console.WriteLine(\"Element at index[{0}]\
  \ = {1}\", y, n[y]);\n        }\n        Console.ReadKey();\n      }\n  }\n}\n```\n\
  \n变量 `x` 的 `for` 循环帮助我们向数组中填充了 10 个值，第一个元素是 50，最后一个是 59。变量 `y` 的 `for` 循环帮助我们从索引\
  \ 0 到最后一个索引访问数组的所有元素。程序的输出如下：\n\n![](img/00155.jpg)\n\n### 使用 foreach 循环\n\n你已经知道如何使用\
  \ `for` 循环来访问数组的所有元素。`foreach` 循环也可以帮助你遍历数组的元素。下面的示例演示了如何使用 `foreach` 循环遍历数组的元素：\n\
  \n```csharp\nusing System;\n\nnamespace ArrayApp {\n\n  class MyArray {\n    static\
  \ void Main(string[] args) {\n\n        int []  n = new int[10]; /* n 是一个包含 10 个整数的数组\
  \ */\n        //int x, y;\n        /* 初始化数组 n 的元素 */\n        for (int x = 0; x\
  \ < 10; x++ ) {\n          n[ x ] = x + 100;\n        }\n        /* 输出所有数组元素的值 */\n\
  \        foreach (int y in n ) {\n          int x = y-100;\n          Console.WriteLine(\"\
  Element[{0}] = {1}\", x, y)\n        }\n        Console.ReadKey();\n      }\n  }\n\
  }\n```\n\n代码给出了以下结果：\n`for` 循环帮助我们向数组填充了 10 个值，第一个元素是 100，最后一个是 109。`foreach` 循环帮助我们从索引\
  \ 0 到最后一个索引访问数组的所有元素。注意，变量 `x` 用于填充数组，而变量 `y` 用于遍历元素。代码返回的输出输出：![](img/0126.jpg)\n\
  \n## 多维数组\n\nC# 支持多维数组的概念。此类数组也被称为矩形数组（rectangular arrays）。多维数组是按行和列形式组织的二维序列。下面是一个多维数组的示例：\n\
  \n```csharp\nint[,] array1 = new int[3,2]{\n  {1, 5},\n  {2, 5},\n  {5, 7}\n};\n\
  // 或\nint[,] array1 = {1, 5}, {2, 5}, {5, 7} };\n```\n\n如上面的示例所示，为了初始化多维数组，必须根据行数和列数来定义它。`[3,2]`\
  \ 表示数组有 3 行 2 列。访问多维数组元素使用两个索引。第一个索引表示行，第二个索引表示列。考虑下面的示例：\n\n```csharp\nusing System;\n\
  \npublic class MyProgram\n{\n\npublic static void Main()\n{\nint[,] array1 = new\
  \ int[3,2]{\n  {1, 5},\n  {2, 5},\n  {5, 7}\n};\nConsole.WriteLine(array1[0,0]);\n\
  \nConsole.WriteLine(array1[0,1]);\n\nConsole.WriteLine(array1[1,0]);\n\nConsole.WriteLine(array1[1,1]);\n\
  \nConsole.WriteLine(array1[2,0]);\n\nConsole.WriteLine(array1[2,1]);\n\n}\n\n}\n\
  ```\n\n## 交错数组 (Jagged Arrays)\n\n交错数组实际上是数组的数组。初始化交错数组使用 `[][]`。在第一个括号中指定数组的大小，第二个括号中指定每个子数组的大小。下例演示：\n\
  \n```csharp\nusing System;\n\npublic class MyProgram\n{\n\npublic static void Main()\n\
  {\nint[][] jaggedArray = new int[2][];\njaggedArray[0] = new int[3]{1, 2, 3};\n\
  jaggedArray[1] = new int[2]{4, 5, 6};\n\nConsole.WriteLine(jaggedArray[0][0]);\n\
  \nConsole.WriteLine(jaggedArray[0][1]);\n\nConsole.WriteLine(jaggedArray[0][2]);\n\
  \nConsole.WriteLine(jaggedArray[1][0]);\n\nConsole.WriteLine(jaggedArray[1][1]);\n\
  \nConsole.WriteLine(jaggedArray[1][2]);\n\n}\n\n}\n```\n\n交错数组允许每行具有不同的长度，这与多维数组（矩形数组）不同。\n\
  \n\n\n\n类可以被看作对象的蓝图。现实世界中的对象具有形状、颜色和功能等特征。例如，`X6` 是一个汽车类型的对象。汽车具有颜色、速度、内饰、形状等特征。这意味着任何创建具有上述特征对象的实体都属于汽车类型。这意味着\
  \ `Car` 是一个类，而每个对象（即每辆物理上的汽车）将是 `Car` 类型的一个对象。\n\n在面向对象编程中（不要忘记 `C#` 是一种面向对象的编程语言），类具有字段、属性、方法、事件等。类应该定义数据类型类型以及对象应该具备的功能。\n\
  \n通过类，你可以通过将其他类型的变量以及方法和事件组合在一起，创建你自己的自定义类型。\n\n在 `C#` 中，我们使用 `class` 关键字来定义类。这里是一个简单的示例：\n\
  \n```csharp\npublic class TestClass\n{\n    public string field1 = string.Empty;\n\
  \n    public TestClass()\n    {\n    }\n\n    public void TestMethod(int param1,\
  \ string param2)\n    {\n        Console.WriteLine(\"The first parameter is {0},\
  \ and second parameter is {1}\",\n                          param1, param2);\n \
  \   }\n\n    public int AutoImplementedPropertyTest { get; set; }\n\n    private\
  \ int propertyVar;\n\n    public int PropertyTest\n    {\n        get { return propertyVar;\
  \ }\n        set { propertyVar = value; }\n    }\n}\n```\n\n类前面的 `public` 关键字是一个访问访问符（Access\
  \ Specifier），指定了类的访问方式。通过设置为 `public`，意味着它可以被同一项目的所有其他类访问。我们给这个类命名为 `TestClass`。\n\
  \n我们还在类中定义了一个名为 `field1` 的字段。下面，我们为该类创建了一个构造函数。注意，构造函数的名称与类本身相同，因此构造函数的名字为 `TestClass()`。在这个类内部，我们还定义了一个名为\
  \ `TestMethod()` 的方法，该方法接收两个参数 `param1` 和 `param2`，前者是整数，后者是字符串。\n\n这是另一个演示声明和使用类的示例：\n\
