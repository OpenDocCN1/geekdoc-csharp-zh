  # 第 12 章：异步编程\n## 回调\n## Promise 集合\n\n# 第 13 章：解析\n## 特殊形式\n## 函数\n\n# 结论\n\n##\
  \ 参考文献\n\n## 引言\n\nJavaScript 是一种卓越且易懂的编程语言，它遵循 `ECMAScript` 规范。该编程语言由强大的类型、大括号语法、高质量的函数以及基于原型的面向对象机制组成。配合\
  \ HTML 和 CSS，JavaScript 是万维网的重要技术之一。JavaScript 促进了交互式交互，是 Web 应用程序的重要部分。几乎每个网站都使用\
  \ JavaScript，所有主要的网页浏览器都包含 `JavaScript` 引擎以正常运行。Brendan Eich 在 1995 年任职于 Netscape\
  \ Communications 时开发了 JavaScript。JavaScript 有助于函数式、事件驱动、基于原型和面向对象的编程风格。JavaScript\
  \ 通过确认用户在客户端执行的操作来升级 Web 用户界面。你可以将 JavaScript 引擎插入到不同类型的宿主软件中，包括数据库、Web 服务器以及与非\
  \ Web 相关的程序（如文字处理器）。\n\n本书将进一步解释 JavaScript 的概念，旨在帮助你在没有压力的情况下学习和理解 JavaScript 语言。学习\
  \ JavaScript 只需要具备 HTML、文本编辑器、网页浏览器和 CSS 的知识。要开始学习过程，必备工具之一是文本编辑器，编写代码是必须的。有不同类型的文本编辑器，如\
  \ `Sublime Text`、`Notepad++` 以及浏览器如 `Firefox`、`Google Chrome` 等。\n\n# 第 1 章：什么是\
  \ JavaScript\n\nJavaScript 简称 `JS`，是一种高级编程语言，用于为网页添加特定的程序，并已被所有主流浏览器采用。JavaScript\
  \ 可用于构建交互式 Web 应用程序，使其在无需每次操作都重新加载页面的情况下正常运行。JavaScript 用于在网页内创建不同形式的活动，它是万维网（`www`）的核心组件之一，分别是\
  \ `HTML`（超文本标记语言）和 `CSS`（层叠样式表）。JavaScript 和 HTML 用于开发网页。JavaScript 通过添加滑块、弹出窗口、表单验证等特殊效果让页面生动。`CSS`\
  \ 决定颜色强度、图像大小、背景颜色、字体、字号等。\n\n## 客户端 JavaScript\n\n客户端 JavaScript 是 JavaScript 语言的常用形式。脚本必须通过\
  \ `HTML` 文档插入或引用，以便浏览器能够解析代码。它允许网页与用户包含交互式程序，动态开发 `HTML` 内容并控制浏览器。用户在提交表单时会使用 JavaScript\
  \ 代码，并在将其传输到服务器之前确定所有输入项是否有效。\n\n### JavaScript 的优势\n\n- 通过 JavaScript，用户可以在页面发送到服务器之前对输入进行组织，这会自动减少服务器的负载。\n\
  - JavaScript 能够对页面访问者做出快速响应。在访问者查看是否存在输入错误之前，页面无需重新加载。\n- JavaScript 用于构建响应式界面，当鼠标悬停在上面时会产生反应。\n\
  \n### JavaScript 的局限性\n\nJavaScript 编程语言缺少以下基本功能。它们是：\n\n- 出于考虑，客户端 JavaScript 不读取或写入文件\n\
  - 用于网络应用的 JavaScript\n- JavaScript 不包含多处理器能力\n\n## JavaScript 开发工具\n\n你不需要昂贵的开发工具来编写\
  \ JavaScript 代码。你可以使用简单的文本编辑器，如 `Microsoft FrontPage`、`Macromedia Dreamweaver MX`、`Macromedia\
  \ HomeSite 5` 等。\n\n## JavaScript 的放置\n\nJavaScript 代码可以插入到 `HTML` 文档的任何位置。然而，你可能这样在\
  \ `HTML` 文件中插入 JavaScript 代码：\n\n- `<head> </head>` 部分内的脚本。\n- `<body>...</body>`\
  \ 部分内的脚本。\n- `<body>...</body>` 和 `<head> </head>` 部分内的脚本。\n- 在 `<head>...</head>`\
  \ 部分中引入外部文件脚本。\n\n### `<head>...</head>` 部分中的 JavaScript\n\n在某些情况下，当你想要让脚本在特殊事件上运行时（例如点击按钮时的动作）时，将脚本放在头部部分，如下所示：\n\
  \n```html\n<html>\n<head>\n<script type=\"text/JavaScript\">\n<!--\nfunction sayHi()\
  \ {\nalert(\"Hello World\")\n}\n//-->\n</script>\n</head>\n<body>\n点击此处获取结果\n<input\
  \ type=\"button\" onclick=\"sayHi()\" value=\"Say Hi\" />\n</body>\n</html>\n```\n\
  \n### `<body>...</body>` 部分中的 JavaScript\n\n有时你希望脚本立即运行并在内容页面上创建脚本，此时应将脚本插入到 `<body>`\
  \ 部分。这行代码看起来应该是这样的：\n\n```html\n<html>\n<head>\n</head>\n<body>\n<script type=\"\
  text/JavaScript\">\n<!--\ndocument.write(\"Hello World\")\n//-->\n</script>\n<p>这是网页正文\
  \ </p>\n</body>\n</html>\n```\n\n### `<body>` 和 `<head>` 部分中的 JavaScript\n\n如下所示将你的\
  \ JavaScript 代码插入到 `<head>` 和 `<body>` 部分：\n\n```html\n<html>\n<head>\n<script type=\"\
  text/JavaScript\">\n<!--\nfunction sayHi() {\nalert(\"Hello World\")\n}\n//-->\n\
  </script>\n</head>\n<body>\n<script type=\"text/JavaScript\">\n<!--\ndocument.write(\"\
  Hello World\")\n//-->\n</script>\n<input type=\"button\" onclick=\"sayHi()\" value=\"\
  Say Hi\" />\n</body>\n</html>\n```\n\n### 外部文件中的 JavaScript\n\n为了避免重复相同的 JavaScript\
  \ 代码，该语言允许你创建一个外部文件并存储代码，然后将其集成到 HTML 中。下面的示例显示了如何利用 `script` 标签和 `src` 属性在 `HTML`\
  \ 中集成外部 JavaScript 文件。\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  \ src=\"filename.js\" ></script>\n</head>\n<body>\n\n.......\n\n</body>\n</html>\n\
  ```\n\n外部文件应以 `.js` 扩展名保存。\n\n## 总结\n\n在本章中，我们解释了 JavaScript 的起源及其在内部和外部文件中的放置。我们讨论了使用\
  \ JavaScript 构建交互式 Web 应用程序，而无需每次操作都重新加载页面。\n\n## 练习\n\n如何在 head 和 body 中插入 JavaScript\
  \ 代码并引入外部文件脚本？\n\n## 答案\n\n- head 中的脚本是 `<head> </head>`。\n- body 中的脚本是 `<body>...</body>`。\n\
  - body 和 head 中的脚本是 `<body>...</body>` 和 `<head> </head>`。\n- 引入 `<head>...</head>`。\n\
  \n# 第 2 章：值、类型和运算符\n\n在计算机世界中，存在数据。你可以创建新数据、读取数据并更改数据，它们都存储为相似的长位序列。\n\n## 值\n\n\
  深呼吸，想象比特海洋。最新的 PC 在数据存储中包含超过 300 亿比特。我们使用比特来创建值。每个值由一个影响其角色的类型，值可以是数字、文本或函数等。要生成值，需要调用它的名称，它会从存储的地方出现。\n\
  \n\n\n\n\n# 算术\n\n算术是处理数字的主要任务。对多个数字进行乘、加、减以产生另一个数字的过程称为算术运算。这是它们在 JavaScript 中形式的示例：\n\
  \n```javascript\n100 + 4 * 11\n```\n\n`+` 和 `*` 符号被称为运算符，第一个表示加法，另一个表示乘法。在两个值之间插入运算符会产生另一个值。`-`\
  \ 运算符用于减法，`/` 运算符用于除法。如果运算符在没有括号的情况下同时出现，运算符的优先级决定了它们的应用方式。如果多个具有相同优先级的运算符相邻出现，如\
  \ `1 - 2 + 1`，则从左到右应用：`(1 - 2) + 1`。\n\n## 特殊数字\n\nJavaScript 包含三个独特的值，它们的行为不像数字但被视为数字。`Infinity`\
  \ 和 `-Infinity` 是前两个，表示正无穷和负无穷，最后一个值是 `NaN`。`NaN` 表示“不是数字”，尽管它是一个数字类型的值。\n\n## 字符串\n\
  \n字符串是数字的序列。字符串是下一个数据类型，代表文本。字符串将其内容限制在引号中。\n\n`Down the walkway path. `\n\n`\"\
  On top of the roof.\"`\n\n`'I am at home.'`\n\n使用不同的引号（如双引号、单引号或反引号）来标记字符串。字符串必须匹配至关重要。JavaScript\
  \ 使用 Unicode 标准为每个需要的字符分配一个数字，包括阿拉伯语、亚美尼亚语、日语等。你不能对字符串进行减法、乘法或除法，但你可以使用 `+` 运算符，它不会相加而是将两个字符串拼接在一起。拼接意味着将字符串粘在一起。\n\
  \n## 一元运算符\n\n符号并不代表所有的运算符。你可以用单词写某些运算符。一个清晰的例子是一种运算符，该运算符根据其所附值的 `typeof` 属性创建一个字符串值。\n\
  \n```javascript\nconsole.log(typeof 4.5)\n// → number\n\nconsole.log(typeof \"x\"\
  )\n// → string\n```\n\n第二个显示的运算符被称为二元运算符，因为它们使用两个值，而使用一个值的运算符是一元运算符。\n\n```javascript\n\
  console.log(- (10 - 2))\n// → -8\n```\n\n## 布尔值\n\n布尔值是一种仅在两种可能性之间区分的值，例如“开”和“关”等。布尔值仅由真（true）和假（false）组成。\n\
  \n## 比较\n\n比较是创建布尔值的方法：\n\n```javascript\nconsole.log(3 > 2)\n// → true\n\nconsole.log(3\
  \ < 2)\n// → false\n```\n\n`>` 和 `<` 分别是表示“大于”和“小于”的符号。你可以在布尔中使用二元运算符来确定包含的值是真还是假。\n\
  \n你可以以相同的方式比较字符串。\n\n```javascript\nconsole.log(\"Aardvark\" < \"Zoroaster\")\n\
  // → true\n```\n\n你可以按照字母顺序指示字符串，大写字母通常比小写字母“小”，所以 `\"Z\" < \"a,\"`，且非字母字符（`!`、`-`\
  \ 等）也存在于排序中。当 JavaScript 想要比较字符串时，它从左到右识别字符，单独区分 Unicode 代码。\n\n这里是其他相关的运算符 `<=`（小于等于）、`>=`（大于等于）、`==`（等于）和\
  \ `!=`（不等于）。\n\n```javascript\nconsole.log(\"Itchy\" != \"Scratchy\")\n// → true\n\
  \nconsole.log(\"Apple\" == \"Orange\")\n// → false\n```\n\n在 JavaScript 中，只有一个值不等于它自己，那就是\
  \ `NaN`（不是数字）。\n\n```javascript\nconsole.log(NaN == NaN)\n// → false\n```\n\n##\
  \ 逻辑运算符\n\nJavaScript 仅支持三种可以应用于布尔值的运算符，即 `and`、`or` 和 `not`。`&&` 运算符表示逻辑与，其结果取决于输入值何为真或假。\n\
  \n```javascript\nconsole.log(true && false)\n// → false\n\nconsole.log(true && true)\n\
  // → true\n```\n\n`||` 运算符表示逻辑或。如果给定的值为真，该运算符输出真。\n\n```javascript\nconsole.log(false\
  \ || true)\n// → true\n\nconsole.log(false || false)\n// → false\n```\n\n感叹号 `!`\
  \ 表示非（Not）。它是一个反转设定值的运算符，它会从真变为假，从假变为真。\n\n`||` 具有所有运算符中优先级最低的，然后是 `&&`、比较运算符（`>`、`==`\
  \ 等）等等。下面的示例说明了括号是必要的：\n\n```javascript\n1 + 1 == 2 && 10 * 10 > 50\n```\n\n## 空值\n\
  \n`Null` 和 `undefined` 是仅有的两种特殊值类型，用于指示重要值的未出现。它们包含零数据。\n\n## 自动类型转换\n\n早些我说 JavaScript\
  \ 几乎接受所有给定的程序，包括行为异常的程序。自动类型转换在以下表达式中体现：\n\n```javascript\nconsole.log(8 * null)\n\
  // → 0\n\nconsole.log(\"5\" - 1)\n// → 4\n\nconsole.log(\"5\" + 1)\n// → 51\n\n\
  console.log(\"five\" * 2)\n// → NaN\n\nconsole.log(false == 0)\n// → true\n```\n\
  \n当你给运算符分配错误的值时，JavaScript 使用类型转换规则返回所需的精确类型。在第一个表达式中，`null` 变为 `0`，第二个中的 `5` 保持为\
  \ `5`（从字符串到数字）。在第三个表达式中，在数字加法之前存在字符串拼接，将 `1` 转换为 `1`（从数字到）。\n\n## 逻辑运算符的短路\n\n`&&`\
  \ 和 `||` 被称为逻辑运算符。它们用于以特定方式持有多个值。它们将左侧转换为布尔以决定，尽管这取决于生成的类型，但总是恢复左侧或右侧。`||` 运算符在左侧为真时返回左侧。\n\
  \n```javascript\nconsole.log(null || \"user\")\n// → user\n\nconsole.log(\"Kate\"\
  \ || \"user\")\n// → Kate\n```\n\n此函数用于返回默认值。字符串和数字的布尔转换规则指示 `0`、`NaN` 和空字符串 `\"\
  \"` 为假，而其他值为真。因此 `0 || -1` 输出 `-1`。`&&` 运算符的操作相同但方向相反。当左侧的值为假时，返回该值，或者发送右侧的值。\n\n\
  ## 总结\n\n本章介绍了 JavaScript 的四种值类型：字符串、数字、undefined 值和布尔。这些值通过插入它们的名称作为 `true`、`null`\
  \ 或值（`13`、`\"ABC\"`）来创建。运算符可以整合并改变值。我们查看了用于算术（`+`、`-`、`*`、`/` 和 `%`）、字符串拼接（`+`）、比较（`==`、`!=`、`===`、`!==`、`<`、\
  \ `>=`, `<=` `<=`）和逻辑（`&&`、`||`）的二元运算符，以及各种一元运算符（`-` 取反数字、`!` 取反逻辑以及 `typeof` 搜索值的类型）和三元运算符（`?:`\
  \ 根据第三个值选择两个值之一）。你将获得足够的信息像小计算器一样使用 JavaScript，并在后续章节中提高。\n\n## 练习\n\n编写一个 JavaScript\
  \ 练习通过用户定义的名称构建变量。\n\n## 答案\n\n![](img/00193.jpg)\n\n\n\n\n\n我们将开始扩展 JavaScript\
  \ 编程命令的范围，使其超出句子短语和名词。\n\n## 表达式与语句\n\n产生一个值的代码块被称为 `expression`（表达式）。一个单一的值精确地写为\
  \ `22`，或者心理分析被称为一个 `expression`。在二元运算符中设置为两个表达式的表达式或在括号内的表达式都是 `expression`。一个可以像人类语言翻译一样容纳其他表达式的\
  \ `expression`。它允许我们开发出描述任意复杂计算的表达式。当一个表达式类似于句子片段时，JavaScript 语句将完成这个句子。语句列表被称为\
  \ `program`（程序），而最易访问的语句类型是以分号结尾的一行代码。\n\n例如：\n\n```\n1;\n!false;\n```\n\n通过此功能，语句可以独立存在，它还可以为屏幕添加偶尔改变颜色的特性，或者修改机器的内部状态以影响其后的后续语句。\n\
  \n## 绑定\n\nJavaScript 使用变量的绑定（binding）来存储值，例如：\n\n```\nlet money = 5 * 5;\n```\n\
  \n`let` 是该语句中的关键字，意味着该句子将指定一个绑定，并可以使用 `=` 运算符和 `expression` 将绑定名称和值关联。将定义的绑定作为表达式使用，即一个包含绑定值的表达式。下面是一个示例：\n\
  \n```\nlet ten = 10;\nconsole.log(ten * ten);\n// → 100\n```\n\n`=` 运算符用于现有的绑定，将绑定从一组值中移除并将其指向新值。\n\
  \n```\nlet mood = \"light\";\nconsole.log(mood);\n// → light\n\nmood = \"dark\"\
  ;\nconsole.log(mood);\n// → dark\n```\n\n在不赋值值的情况下定义绑定将导致无物可持。因此，请求绑定的值会产生 `undefined`\
  \ 值。你可以通过逗号分隔的单个语句定义多个绑定。\n\n```\nlet one = 1, two = 2;\nconsole.log(one + two);\n\
  // → 3\n```\n\n使用 `var` 和 `const` 单词来开发熟悉的绑定：\n\n```\nvar name = \"Ayad\";\nconst\
  \ greeting = \"Hello \";\nconsole.log(greeting + name);\n// → Hello Ayad\n```\n\n\
  `const` 单词意味着常量。它描述了一个坚定的绑定，在其生命周期内指向其设置的值。这些单词通常用于声明一个名称对应一个值，以便以后轻松引用。\n\n###\
  \ 绑定名称\n\n尽管有一些如 `const`、`class`、`default`、`break`、`continue`、`delete`、`do`、`else`\
  \ 等保留字，但任何单词都可以作为绑定名称，它可以包含数字但不能以数字开头。绑定名称也可以包含美元符号（`$`）或下划线（`_`），但不接受任何其他特殊字符或标点符号。\n\
  \n### 环境\n\n在指定时刻存在的绑定和值的组被称为环境（environment）。当你启动一个程序时，环境持有语言标准绑定，并通常包含创建与系统环境交互的绑定。例如，浏览器携带了与启动的网站通信的函数，以及读取键盘和鼠标输入的函数。\n\
  \n## 函数\n\n封装在值中的一部分程序被称为 `function`（函数），这些值被添加以启动封装好的程序。例如，一个为用户输入显示一个小幅对话框的函数。\n\
  \n```\nprompt(\"Enter passcode\");\n```\n\n执行函数的过程被称为调用（calling）、触发（invoking）或应用（applying）。通过在提供函数值的表达式后插入括号来调用函数。将括号值设置为函数内部的程序。将设置为函数的定义作为参数。\n\
  \n### console.log 函数\n\n在上面的示例中，我们使用 `console.log` 来输出值。所有主流浏览器都利用 `console.log`\
  \ 函数将其参数输出到输出文本的设备上。在现代浏览器中，输出通常在默认不可见的 JavaScript 控制台中；你可以轻击键盘上的 `F12` 键或 Mac 上的\
  \ `command-option-I`。绑定名称不包含点字符，但 `console.log` 包含，因为它是一个从 `console` 绑定值中重新索回 `log`\
  \ 属性的表达式。\n\n### 返回值\n\n函数被用于产生副作用（side effects）。它们也可以提供不需要副作用的值。例如，`Calculate.max`\
  \ 函数将取一组数字参数之和并返回最大的一个。\n\n```\nconsole.log(Calculate.max(2, 4));\n// → 4\n```\n\
  \nJavaScript 将任何提供内容的视为 `expression`，这使得函数调用可以附加到实质性表达式中。让我们调用 `Calculate.min`，它是\
  \ `Calculate.max` 的直接反面：\n\n```\nconsole.log(Math.min(2, 4) + 100);\n// → 102\n\
  ```\n\n## 控制流\n\n当程序中包含多个语句时，它们以故事的形式从代码开始到结束执行。这种类型的程序由两种语句组成：第一个向用户请求数字，而第二个显示该数字的平方并在第一个之后立即执行。\n\
  \n```\nlet theNumber = Number(prompt(\"Select a digit \"));\nconsole.log(\"Your\
  \ digit is the square root of \" + theNumber * theNumber);\n```\n\n一个值通过 `number`\
  \ 函数转换为数字并输出一个字符串值。\n\n### 条件执行\n\n键盘用于在 JavaScript 中开发条件执行。你可能希望某些代码仅当特定条件为真时才执行。让我们在输入仅为数字时显示其平方。\n\
  \n```javascript\nlet theNumber = Number(prompt(\"Select a digit \"));\nif (!isNaN(theNumber))\
  \ {\n  console.log(\"Your digit is the square root of \" + theNumber * theNumber);\n\
  }\n```\n\n`Number` 函数将值转换为数字并输出字符串值。\n\n`if` 关键字用于开发条件执行。`if` 关键字根据布尔表达式值执行语句。大括号\
  \ `{}` 用于对不同的数字进行分类。\n\n```javascript\nif (1 + 1 == 2) console.log(\"It's true\"\
  );\n```\n\n`else` 关键字可以与 `if` 语句一起使用，提供两种执行路径。\n\n```javascript\nlet theNumber =\
  \ Number(prompt(\"Select a digit \"));\nif (!isNaN(theNumber)) {\n  console.log(\"\
  Your digit is the square root of \" + theNumber * theNumber);\n} else {\n  console.log(\"\
  Hey. Why didn't you give me a number?\");\n}\n```\n\n如果有多个路径可供，你可以链链多个 `if/else`\
  \ 对。下面是一个示例：\n\n```javascript\nlet num = Number(prompt(\"Pick a number\"));\nif\
  \ (num < 10) {\n  console.log(\"Small\");\n} else if (num < 100) {\n  console.log(\"\
  Medium\");\n} else {\n  console.log(\"Large\");\n}\n```\n\n程序确认 `num` 是否小于 10，如果是，它选择该分支并显示\
  \ \"Small\"。但如果 `num` 大于 10，它会选择 `else` 分支，该分支由自己的第二个 `if` 语句组成。\n\n### while 和\
  \ do 循环\n\n这是编写一个显示 0 到 12 所有偶数的方法。\n\n```javascript\nconsole.log(0);\nconsole.log(2);\n\
  console.log(4);\nconsole.log(6);\nconsole.log(8);\nconsole.log(10);\nconsole.log(12);\n\
  ```\n\n多次运行代码块被称为循环（loop）。\n\n循环控制流允许用户返回编写程序中的某些点并根据当前状态重新执行。将其与如下枚举的绑定集成：\n\n\
  ```javascript\nlet number = 0;\nwhile (number <= 12) {\n  console.log(number);\n\
  \  number = number + 2;\n}\n// → 0\n// → 2\n// … 等等\n```\n\n\n\n\n\n一个以关键字开头并同时产生循环的语句。关键字\
  \ `while` 后面跟着一个括号内的表达式，然后是一个一个类似于 `if` 语句的语句。循环会持续进行，直到表达式提供的值在转换为布尔值时为真。循环每次重复，数字都会变为其之前值的两倍。让我们写一个程序来计算并显示\
  \ `2¹⁰`（2 的 10 次方）的值。我们将使用两个绑定：一个用于监控我们的结果，另一个用于计算 2 乘以结果的次数。它会一直乘直到第二个绑定达到 10：\n\
  \n```javascript\nlet result = 1;\nlet counter = 0;\n\nwhile (counter < 10) {\n \
  \ result = result * 2;\n  counter = counter + 1;\n}\nconsole.log(result);\n// →\
  \ 1024\n```\n\n`do` 循环是一种与 `while` 循环相关的命令结构。`do` 循环在语句中至少执行一次，然后开始检查是否仅在第一次执行后结束。遵循以下步骤：\n\
  \n```javascript\nlet yourName;\n\ndo {\n  yourName = prompt(\"你是谁？\");\n} while\
  \ (!yourName);\n\nconsole.log(yourName);\n```\n\n### for 循环\n\n许多循环遵循 `while` 循环模式，创建一个计数器绑定来跟踪循环的进度。然后使用一个带有测试表达式的\
  \ `while` 循环来查看计数器是否达到了设定值。\n\n```javascript\nfor (let number = 0; number <= 10;\
  \ number = number + 4) {\n  console.log(number);\n}\n// → 0\n// → 4\n// 等\n```\n\
  \n括号内在关键字后必须包含两个分号，第一个分号之前的部分通过描述绑定来分离循环。另一个部分是决定循环是否应该继续的语句。这里是使用 `for` 代替 `while`\
  \ 计算 `2¹⁰` 的代码：\n\n```javascript\nlet result = 1;\nfor (let counter = 0; counter\
  \ < 10; counter = counter + 1) {\n  result = result * 2;\n}\nconsole.log(result);\n\
  // → 1024\n```\n\n### 跳出循环\n\n除了让循环条件变为假之外，还有其他方法可以结束循环。`break` 可以影响跳出限制的循环。`break`\
  \ 语句会在第一个数字大于或等于 20 且能被 7 整除时评估此程序。\n\n```javascript\nfor (let current = 20; current\
  \ = current + 1) {\n  if (current % 7 == 0) {\n    console.log(current);\n    break;\n\
  \  }\n}\n// → 21\n```\n\n`%` 运算符用于检查一个数字是否可以被另一个数字除。如果可以除，那么余数为零。示例中的 `for` 在循环结束时不进行检查，这意味着在执行\
  \ `break` 语句之前，循环将是无限的永远永远停止。\n\n### 简洁地更新绑定\n\n当你处于循环中，程序会定期更新绑定以根据其之前的值存储一个值。\n\
  \n`counter = counter + 1;`\n\nJavaScript 提供了一个快捷方式。\n\n`counter += 1;`\n\n相关的快捷函数也适用于其他几个运算符，例如\
  \ `result *= 2` 用于乘以 `result` 或 `counter -= 1` 用于倒序计数。这使我们能够尽可能简化计数示例。\n\n```javascript\n\
  for (let number = 0; number <= 12; number += 2) {\n  console.log(number);\n}\n```\n\
  \n对于 `counter += 1` 和 `counter -= 1`，这里有更短的等价写法：\n\n`counter++` 和 `counter--`。\n\
  \n### 使用 switch 分发值\n\n使用 `switch` 对值进行分发的代码可能如下：\n\n```javascript\nif (x == \"\
  value1\") action1();\nelse if (x == \"value2\") action2();\nelse if (x == \"value3\"\
  ) action3();\nelse defaultAction();\n```\n\n`switch` 用于直观地表达上述形式的分发。下面是一个很好的示例：\n\
  \n```javascript\nswitch (prompt(\"天气怎么样？\")) {\n  case \"rainy\":\n    console.log(\"\
  别忘了带伞。\");\n    break;\n  case \"sunny\":\n    console.log(\"穿得轻快点。\");\n  case\
  \ \"cloudy\":\n    console.log(\"出去。\");\n    break;\n  default:\n    console.log(\"\
  天气类型未知！\");\n    break;\n}\n```\n\n### 大写字母\n\n名称绑定不允许空格，但它支持使用多个单词来定义绑定值。在用不同单词绑定名称时，可以使用以下几种类型：\n\
  \n- `fuzzylittleturtle`\n- `fuzzy_little_turtle`\n- `FuzzyLittleTurtle`\n- `fuzzyLittleTurtle`\n\
  \n### 注释\n\n有时原始代码并不能传递你想让程序发送给读者的每一个信息，或者以人们认为难以破解的方式传播信息。其他时候，你觉得应该给程序附带一些类似的想法，注释就起到了作用。注释是程序中包含的一部分文本，但计算机会忽略它。要编写单行注释，使用两个斜杠字符（`//`），后跟注释文本。\n\
  \n```javascript\nlet accountBalance = calculateBalance();\n// 这里的报告是结果\nlet report\
  \ = power(2, 10);\n// 这里的报告是结果\n/*\n  多行注释\n*/\n```\n\n`//` 注释只出现在语句的结尾。\n\n# 第\
  \ 4 章：函数\n\n函数是 JavaScript 编程语言的基石。将程序片段封装在值中的概念许多许多。它提供了一种组织更重要的程序、减少重复、将名称与子程序联系以及将程序分离的方法。函数用于描述新词。\n\
  \n### 定义函数\n\n函数是一个系统的绑定，通过函数定义绑定值。以下代码指示了一个提供数字平方的函数：\n\n```javascript\nconst square\
  \ = function(x) {\n  return x * x;\n};\nconsole.log(square(12));\n// → 144\n```\n\
  \n创建一个以关键字 `function` 开头的表达式。函数由函数体和一组参数组成，在调用函数时适应待执行的语句。函数体应该始终在大括号内，即使它只是一个语句。函数可以包含多个参数或零参数。在下面的示例中，`makeNoise`\
  \ 不包含参数名称，`power` 包含两个：\n\n```javascript\nconst makeNoise = function() {\n  console.log(\"\
  Pling!\");\n};\nmakeNoise();\n// → Pling!\n\nconst power = function(base, exponent)\
  \ {\n  let result = 1;\n  for (let count = 0; count < exponent; count++) {\n   \
  \ result *= base;\n  }\n  return result;\n};\nconsole.log(power(2, 10));\n// → 1024\n\
  ```\n\n有些函数可以创建值，如 `square` 和 `power`，而某些结果只产生副作用。结尾不包含表达式的 `return` 关键字将返回 `undefined`。\n\
  \n### 练习\n\n编写一个显示更大的并接收两个整数的 JavaScript 程序。\n\n### 答案\n\n重要的是知道你可以在字符串末尾编写 `.length`\
  \ 来查找长度。\n\n```javascript\nlet abc = \"abc\";\nconsole.log(abc.length);\n// → 3\n\
  ```\n\n### 绑定与作用域\n\n\n\n\n\n每个绑定都包含一个允许该绑定可见的作用域。每当你调用一个函数时，都会开发出新的绑定插图。这在函数之间创建了隔离，每个函数调用都在自己的世界中运行，并且易于理解。在\
  \ 2015 年之前的 JavaScript 中，用 `var` 关键字声明的函数可以在全局作用域内可见。它们在函数内部是不存在的。\n\n```javascript\n\
  let x = 10;\n\nif (true) {\n  let y = 20;\n  var z = 30;\n  console.log(x + y +\
  \ z);\n  // → 60\n}\n\n// y 在这里不可见\nconsole.log(x + z);\n// → 40\n```\n\n### 嵌套作用域\n\
  \nJavaScript 区分全局绑定和局部绑定。你可以在其他函数和块中创建块和函数，从而产生多个程度的局部性。例如，这个函数产生了所需的组件来制作一个鹰嘴豆组，它内部包含另一个函数：\n\
  \n```javascript\nconst hummus = function(factor) {\n  const ingredient = function(amount,\
  \ unit, name) {\n    let ingredientAmount = amount * factor;\n    if (ingredientAmount\
  \ > 1) {\n      unit += \"s\";\n    }\n    console.log(`${ingredientAmount} ${unit}\
  \ ${name}`);\n  };\n  ingredient(1, \"can\", \"chickpeas\");\n  ingredient(0.25,\
  \ \"cup\", \"tahini\");\n  ingredient(0.25, \"cup\", \"lemon juice\");\n  ingredient(1,\
  \ \"clove\", \"garlic\");\n  ingredient(2, \"tablespoon\", \"olive oil\");\n  ingredient(0.5,\
  \ \"teaspoon\", \"cumin\");\n};\n```\n\n组件函数内部的代码可以访问外部函数的 `factor` 绑定。块内可访问的绑定集合由块在程序文本中的位置决定。每个局部作用域都可以访问包含它的局部作用域，每个作用域访问全局作用域。这个概念被称为词法作用域。\n\
  \n### 作为值的函数\n\n函数绑定通常表现为特定程序块的名称。这种绑定在定义后不会改变。函数可以用于任意表达式，也可以用于将函数值保存到新的绑定中。存储函数的绑定是系统绑定，可以像这样分配新值：\n\
  \n```javascript\nlet launchMissiles = function() {\n  missileSystem.launch(\"now\"\
  );\n};\n\nif (safeMode) {\n  launchMissiles = function() {/* 什么都不做 */};\n}\n```\n\
  \n### 声明符号\n\n生成函数绑定的方法非常简单。当你在语句开头使用 `function` 关键字时，它的功能会有不同。\n\n```javascript\n\
  function square(x) {\n  return x * x;\n}\n```\n\n该语句描述了绑定 `square` 并将其指向一个指定的函数。这种类型的函数定义由一个表达式组成。\n\
  \n```javascript\nconsole.log(\"My mind tells me every time:\", future());\n\nfunction\
  \ future() {\n  return \"Ill surpass Bill Gates\";\n}\n```\n\n### 箭头函数\n\n函数包含第三种表示法，看起来与其他并不完全相同。你可以使用箭头\
  \ `=>` 作为 `function` 关键字的替代。箭头 `=>` 包含一个等号和一个大于字符。\n\n```javascript\nconst power\
  \ = (base, exponent) => {\n  let result = 1;\n  for (let count = 0; count < exponent;\
  \ count++) {\n    result *= base;\n  }\n  return result;\n};\n```\n\n如果你只有一个参数名，可以排除参数列表周围的括号。有时函数体是一个单一表达式而不是大括号块，直接返回函数中的表达式。因此，`square`\
  \ 的定义执行了相同的任务。\n\n```javascript\nconst square1 = (x) => {return x * x;};\nconst\
  \ square2 = x => x * x;\n```\n\n当箭头函数没有参数时，它的参数列表将变成一组空闲且无效的括号。\n\n```javascript\n\
  const horn = () => {\n  console.log(\"Toot\");\n};\n```\n\n你不需要在语言中同时使用函数表达式和箭头函数，它们提供并执行的操作是相同的。\n\
  \n### 调用栈\n\n让我们花点时间看看控制是如何通过函数的。下面是一个执行少量函数调用的简单程序：\n\n```javascript\nfunction\
  \ greet(who) {\n  console.log(\"Hello \" + who);\n}\n\ngreet(\"Harry\");\nconsole.log(\"\
  Bye\");\n```\n\ngreet 调用影响控制跳转到函数的开头。`console.log` 调用完成它的工作并获取控制权，然后将控制传回函数。函数循环到此结束并传回调用它的地方。控制流如下：\n\
  \n- 不在函数中\n- 在 greet 中\n- 在 console.log 中\n- 在 greet 中\n- 不在函数中\n- 在 console.log\
  \ 中\n- 不在函数中\n\n计算机必须记住调用序列发生上下文，因为函数会回到被调用的位置。当 `console.log` 完成时，它必须返回程序的结尾。调用栈是计算机存储此上下文的地方。每当你调用一个函数时，当前上下文保存在此栈的顶端。当函数返回时，它消除顶部的上下文并利用该内容继续执行。\n\
  \n栈需要在计算机内存中有空间来保存。下面的代码通过查询计算机解释了这一点，在两个函数往回之间创建零限制。\n\n```javascript\nfunction\
  \ chicken() {\n  return egg();\n}\n\nfunction egg() {\n  return 1;\n}\n\nconsole.log(chicken());\n\
  \n### 可选参数\n\nJavaScript 能够容忍传递的数量。下面的代码在没有干扰的情况下正常工作：\n\n```javascript\nfunction\
  \ square(x) {\n  return x * x;\n}\nconsole.log(square(4)); // → 16\n```\n\n在参数后写入\
  \ `=` 运算符，表达式值将恢复未指定的参数。如果你想传递而不产生第二个参数，默认值会像这样：\n\n```javascript\nfunction power(base,\
  \ exponent = 2) {\n  let result = 1;\n  for (let count = 0; count < exponent; count++)\
  \ {\n    result *= base;\n  }\n  return result;\n}\n\nconsole.log(power(4)); //\
  \ → 16\nconsole.log(power(2, 6)); // → 64\n\n### 闭包\n\n将值的值的能力与每次调用函数时创建局部绑定的事实相结合。下面的代码显示了这个例子；它描述了一个包装值，一个创建局部绑定并返回一个进入并返回局部绑定的函数。\n\
  \n```javascript\nfunction wrapValue(n) {\n  let local = n;\n  return () => local;\n\
  }\n\nlet wrap1 = wrapValue(1);\nlet wrap2 = wrapValue(2);\n\nconsole.log(wrap1());\
  \ // → 1\nconsole.log(wrap2()); // → 2\n```\n\n这个概念被称为闭包。它使用户在限制作用域内引用局部绑定特定实例的能力。添加一些更改，我们之前的示例可以变成一种开发积累任意数量函数的函数。\n\
  \n```javascript\nfunction multiplier(factor) {\n  return number => number * factor;\n\
  }\n\nlet twice = multiplier(2);\nconsole.log(twice(5)); // → 10\n\n### 递归\n\n函数可以调用自己，但不应经常调用自己以避免栈溢出。递归函数是调用自己的函数。递归允许以不同的风格编写少数函数。例如，下面的代码是\
  \ power 的执行。\n\n```javascript\nfunction power(base, exponent) {\n  if (exponent\
  \ == 0) {\n    return 1;\n  } else {\n    return base * power(base, exponent - 1);\n\
  \  }\n}\n\nconsole.log(power(2, 3)); // → 8\n```\n\n\n这种执行方式存在一个问题。与其他循环版本相比，它的速度较慢。使用单个循环被认为比多次调用函数的成本低。尽管这并不意味着递归是循环的无效选择，但很少有问题用递归比使用循环更容易解决。例如那些需要检查或处理多个分支的问题。看这个：我们从数字\
  \ 1 开始，不断地加 5 或乘以 3。例如，数字 13 可以通过乘以 3 和两次加 5 得到，因此我们无法得到 15。代码是递归解决方案：\n\n```javascript\n\
  function findSolution(target) {\n  function find(current, history) {\n    if (current\
  \ == target) {\n      return history;\n    } else if (current > target) {\n    \
  \  return null;\n    } else {\n      return find(current + 5, `(${history} + 5)`)\
  \ ||\n             find(current * 3, `(${history} * 3)`);\n    }\n  }\n  return\
  \ find(1, \"1\");\n}\n\nconsole.log(findSolution(24));\n// → (((1 * 3) + 5) * 3)\n\
  ```\n\n内部函数 `find` 接收两个参数：当前数字和一个记录获取该数字过程的字符串。如果找到了解决方案，它会返回一个显示通目标路径的字符串；如果未找到解决方案，返回的值将是\
  \ `null`。为了实现这一点，函数执行三个操作中的之一。如果你的目标是当前数字，你就可以使用当前历史记录获得该目标并将其返回。有时数字比目标大，但你不需要探索这个选项，因为加法和减法只能增大数字，所以它将作为\
  \ `null` 返回。如果你仍低于目标数字，则通过两次调用自己来尝试从当前数字开始的路径，一次用于加法，另一个用于乘法。如果第一次调用返回了有效内容，那么太棒了；否则，返回第二次调用，无论提供的是字符串还是\
  \ `null` 并不重要。下面是函数如何产生效果的插图。这个示例在为数字 13 寻找解决方案。\n\n```javascript\nfind(1, \"1\"\
  )\nfind(6, \"(1 + 5)\")\nfind(11, \"((1 + 5) + 5)\")\nfind(16, \"(((1 + 5) + 5)\
  \ + 5)\") // 太大了\nfind(33, \"(((1 + 5) + 5) * 3)\") // 太大了\nfind(18, \"((1 + 5)\
  \ * 3)\") // 太大了\nfind(3, \"(1 * 3)\")\nfind(8, \"((1 * 3) + 5)\")\nfind(13, \"\
  (((1 * 3) + 5) + 5)\") // 找到了！\n```\n\n缩进表示了调用栈的深度。\n\n### 增长函数\n\n函数可以通过两种方式引入程序中。第一种是多次编写相似的代码，这会导致更多错误；第二种是寻找尚未编写且值得拥有自己函数的的功能。你可以从命名函数并编写函数体开始。下面是一个示例。我们将编写一个还原两个数字的程序——农场上奶牛和鸡的数量。\n\
  \n007 Cows\n011 Chickens\n\n```javascript\nfunction printFarmInventory(cows, chickens)\
  \ {\n  let cowString = String(cows);\n  while (cowString.length < 3) {\n    cowString\
  \ = \"0\" + cowString;\n  }\n  console.log(`${cowString} Cows`);\n\n  let chickenString\
  \ = String(chickens);\n  while (chickenString.length < 3) {\n    chickenString =\
  \ \"0\" + chickenString;\n  }\n  console.log(`${chickenString} Chickens`);\n}\n\n\
  printFarmInventory(7, 11);\n```\n\n在字符串表达式后写 `length` 决定了特定字符串的长度。循环继续在数字字符串开头添加零，直到它们包含三个字符。\n\
  \n这是一个更好的尝试：\n\n```javascript\nfunction printZeroPaddedWithLabel(number, label)\
  \ {\n  let numberString = String(number);\n  while (numberString.length < 3) {\n\
  \    numberString = \"0\" + numberString;\n  }\n  console.log(`${numberString} ${label}`);\n\
  }\n\nfunction printFarmInventory(cows, chickens, pigs) {\n  printZeroPaddedWithLabel(cows,\
  \ \"Cows\");\n  printZeroPaddedWithLabel(chickens, \"Chickens\");\n  printZeroPaddedWithLabel(pigs,\
  \ \"Pigs\");\n}\n\nprintFarmInventory(7, 11, 3);\n```\n\n与其提取程序中重复的部分，不如尝试按照以下步骤提取单个概念：\n\
  \n```javascript\nfunction zeroPad(number, width) {\n  let string = String(number);\n\
  \  while (string.length < width) {\n    string = \"0\" + string;\n  }\n  return\
  \ string;\n}\n\nfunction printFarmInventory(cows, chickens, pigs) {\n  console.log(`${zeroPad(cows,\
  \ 3)} Cows`);\n  console.log(`${zeroPad(chickens, 3)} Chickens`);\n  console.log(`${zeroPad(pigs,\
  \ 3)} Pigs`);\n}\n\nprintFarmInventory(7, 16, 3);\n```\n\n函数还可以用于打印对齐的数字表格。\n\n\
  ### 函数与副作用\n\n函数可以包含副作用并返回一个值。与产生副作用的函数相比，纯函数产生的值更容易以新的方式进行集成。纯函数是一个不依赖于任何代码副作用的唯一值制造函数。\n\
  \n总结\n在本章中，你现在理解了如何编写函数。通过了解如何使用参数，你可以将数据传递给函数。理解函数的要视角是了解作用域。每个块都是局部的。\n\n练习\n\
  编写一个 JavaScript 程序来检查一个数字是否为偶数。\n\n解决方案\n\n\n\n\n在 JavaScript 中，评估属性的两种主要方法是使用点符号和方括号。`value.x`\
  \ 和 `value[x]` 都可以评估 `value` 上的属性，但并不总是同一个属性。你使用 `x` 的方式与使用点号的方式不同。\n\n如果你想使用点号，你在点号之后输入的文本就是属性名。如果你打算使用方括号，括号内的表达式会被访问以获取属性名。`value.x`\
  \ 交付的是 `value` 中名为“`x`”的属性，而 `value[x]` 访问表达式 `x` 并利用其结果将其转换为字符串作为属性名。如果你想要的属性名为\
  \ `color`，你应该输入 `value.color`。如果你想提取在绑定 `i` 中被调用的值内部的属性，可以输入 `value[i]`。属性名是字符串，但点符号语法仅适用于有效的绑定名。因此，如果你想评估一个名为\
  \ `2` 或 `John Doe` 的属性，请使用方括号：`value[2]` 或 `value[\"John Doe\"]`。\n\n数组中的元素被存储为数组的属性，这些属性使用数字作为属性名。数组的\
  \ `length` 属性决定它包含多少项。该属性名是一个有效的绑定名。输入 `array.length` 来确定数组的长度，这比输入 `array[\"length\"\
  ]` 要容易得多。\n\n### 方法\n\n字符串和数组对象包含几个存储函数值的属性。\n\n```javascript\nlet doh = \"Doh\"\
  ;\n\nconsole.log(typeof doh.toUpperCase);\n// → function\n\nconsole.log(doh.toUpperCase());\n\
  // → DOH\n```\n\n每个字符串都包含一个 `toUpperCase` 属性。当你调用此属性时，它会返回字符串的副本，其中所有的字母都转换为大写。尽管\
  \ `toUpperCase` 不接受参数，但该函数可以评估字符串 `\"Doh,\"`，它是我们上面调用的值的属性。由函数属性被称为方法。下面的示例说明了两个可以影响数组的方法。\n\
  \n```javascript\nlet sequence = [1, 2, 3];\n\nsequence.push(4);\n\nsequence.push(5);\n\
  \nconsole.log(sequence);\n// → [1, 2, 3, 4, 5]\n\nconsole.log(sequence.pop());\n\
  // → 5\n\nconsole.log(sequence);\n// → [1, 2, 3, 4]\n```\n\n`push` 方法用于将值附加到数组末尾，而\
  \ `pop` 方法则完全相反。它移除数组中的最后一个值并将其返回。这些是栈操作的通用术语。栈是一种数据布局，允许用户向某个方向推入值并以相反的方向弹出值，以便后添加的值先被移除。\n\
  \n### 对象\n\n你可以将一组日志条目表示为数组，尽管每个字符串条目都需要保存一份活动列表，以及一个指定 Jacques 是否变身成松鼠的布尔值。我们将这些内容分组为单个值，并将分组后的值放置在日志条目的数组中。属性的任意集合是类型为\
  \ `object`的值。我们将使用大括号作为表达式来开发一个对象。\n\n```javascript\nlet day1 = {\n  squirrel: false,\n\
  \  events: [\"work\", \"touched tree\", \"pizza\", \"running\"]\n};\n\nconsole.log(day1.squirrel);\n\
  // → false\n\nconsole.log(day1.wolf);\n// → undefined\n\nday1.wolf = false;\n\n\
  console.log(day1.wolf);\n// → false\n```\n\n大括号包含由逗号分隔的属性列表。每个属性都包含一个名称、一个值和一个冒号。当你跨行编写对象时，请确保你的缩进良好，因为这可以提高可读性。应该给无效的绑定名属性或有效的数字加上引号。\n\
  \n```javascript\nlet descriptions = {\n  work: \"Went to work,\"\n  \"touched tree\"\
  : \"Touched a tree.\"\n};\n```\n\n在 JavaScript 中有两种方式使用大括号。它可以用于语句的开头，也可以用于开启语句块。你可以使用\
  \ `=` 运算符为属性表达式指定值。它会取代属性值，如果它已存在，则会创建一个。`delete` 运算符是一个一元运算符，用于删除对象的属性名。下面是一个示例：\n\
  \n```javascript\nlet anObject = {left: 1, right: 2};\n\nconsole.log(anObject.left);\n\
  // → 1\n\ndelete anObject.left;\n\nconsole.log(anObject.left);\n// → undefined\n\
  \nconsole.log(\"left\" in anObject);\n// → false\n\nconsole.log(\"right\" in anObject);\n\
  // → true\n```\n\n二元运算符 `in` 决定对象或字符串是否包含具名属性。将属性指定为 `undefined` 与删除它的主要区别在于，对象包含该属性而删除后不再拥有该属性，因此结果返回\
  \ false。要确定对象中包含哪些属性，会返回一个包含对象属性名的字符串数组。\n\n```javascript\nconsole.log(Object.key({x:\
  \ 0, y: 0, c: 2}));\n// → [\"x\", \"y\", \"c\"]\n```\n\n`Object.assign` 函数用于从一个对象的属性拷贝到另一个对象。\n\
  \n```javascript\nlet objectA = {a: 1, b: 2};\n\nObject.assign(objectA, {b: 3, c:\
  \ 4});\n\nconsole.log(objectA);\n// → {a: 1, b: 3, c: 4}\n``` (注：此处根据代码逻辑补全或保持对齐)\n\
