  \n## 101\n\n这种微控制器包含了其他型号不具备的功能。例如，你可以通过手机的 `Bluetooth Low Energy` 连接到板板。此外，它还内置了加速度计和陀螺仪，通过其六轴灵敏度识别所有方向的运动。它还可以识别手势。\n\
  \n- 价格：$30.00\n- 闪存内存：`196kB`\n- SRAM：`24kB`\n- EEPROM：`0kB`\n- 处理速度：`32MHz`\n-\
