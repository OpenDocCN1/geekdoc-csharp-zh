  \    work.push({at: place, route: route.concat(location)});\n      }\n    }\n  }\n\
  }\n```\n\n该函数保存了一个工作列表。这是一个将要检查的地点数组，以及相应的路线。它从空路线和起始位置开始。每个地点都可以从每个地点到达，因此在两点之间也可以找到路线，所以路线不会失败。\n\
