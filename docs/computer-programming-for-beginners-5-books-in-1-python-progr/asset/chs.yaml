  \ new VillageState(\"Post Office\", parcels);\n};\n```\n\n当 `do` 循环获取正确的地址时，它会继续选择新的地点。\n\
  \n让我们启动一个虚拟世界。\n\n```javascript\nrunRobot(VillageState.random(), randomRobot);\n\
  // → 进展到市场\n// → 进展到市政厅\n// →…\n// → 在 63 回后运行\n```\n\n机器人运输包裹花费了太多回合，因为没有提前计划。\n\
  \n### 邮政车的路线\n\n如果你搜索一条经过村庄所有地方的路线，机器人可能会运行两次，但可以保证它会运行。以下是一个示例：\n\n（从邮局开始）：\n\n\
  ```javascript\nconst mailRoute = [\n  \"Alice's House,\" \"Cabin,\" \"Alice's House,\"\
