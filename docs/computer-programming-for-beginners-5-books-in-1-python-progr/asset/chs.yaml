  \n- 价格：$24.95 (可在 `SparkFun` 购买)\n- 闪存内存：`32kB`\n- SRAM：`2.5kB`\n- EEPROM：`1kB`\n\
  - 处理速度：`8MHz`\n- 数字引脚：`9 pins`\n- PWM 引脚：`4 pins`\n- 模拟输入：`4 pins`\n- 工作电压：`3.3V`\n\
  - 输入电压：`3.8-5V`\n\n## Lilypad Arduino Main Board\n\n这是另一个可穿戴的 Arduino 微控制器板。它可以缝在织物中，或与其他传感器、执行器和电源相结合，成为你随身携带的、具有你自行编程的功能的设备。它需要扩展板和\
