  \n## Gemma\n\n这款 Arduino 是由美国的 `Adafruit Technologies` 制造的。`Arduino Gemma` 是一个旨在佩戴的微型微控制器板。它的空间确实比非可穿戴板小，但对于许多可穿戴项目，你不需要其他\
  \ Arduino 微控制器板的坚固性。此板上有一个 `micro-USB` 连接，因此你不需要扩展板或 `TKDI` 线缆。相反，你只需通过 `micr-USB`\
  \ 连接上传草稿，然后通过 `micro-USB` 或电池连接为微控制器供电。\n\n- 价格：$9.95\n- 闪存内存：`8kB`\n- SRAM：`0.5kB`\n\
