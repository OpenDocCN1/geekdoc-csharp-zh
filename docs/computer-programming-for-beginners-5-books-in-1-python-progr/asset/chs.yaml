  \ in the \"以下是需要翻译的文本\" block.\n\n[content]\n在 JavaScript 中，评估属性的两种主要方法是使用点号和方括号。`value.x`\
  \ 和 `value[x]` 都可以评估 `value` 上的属性，但并不总是同一个属性。你使用 `x` 的方式与使用点号的方式不同。\n\n如果你想使用点号，你在点号之后输入的文本就是属性名。如果你打算使用方括号，括号内的表达式会被访问以获取属性名。`value.x`\
  \ 交付的是 `value` 中名为“`x`”的属性，而 `value[x]` 访问表达式 `x` 并利用其结果将其转换为字符串作为属性名。如果你想要的属性名为\
  \ `color`，你应该输入 `value.color`。如果你想提取在绑定 `i` 中被调用的值内部的属性，可以输入 `value[i]`。属性名是字符串，但点符号语法仅适用于有效的绑定名。因此，如果你想评估一个名为\
  \ `2` 或 `John Doe` 的属性，请使用方括号：`value[2]` 或 `value[\"John Doe\"]`。\n\n数组中的元素被存储为数组的属性，这些属性使用数字作为属性名。数组的\
  \ `length` 属性决定它包含多少项。该属性名是一个有效的绑定名。输入 `array.length` 来确定数组的长度，这比输入 `array[\"length\"\
  ]` 要容易得多。\n\n### 方法\n\n字符串和数组对象包含几个存储函数值的属性。\n\n```javascript\nlet doh = \"Doh\"\
  ;\n\nconsole.log(typeof doh.toUpperCase);\n// → function\n\nconsole.log(doh.toUpperCase());\n\
  // → DOH\n```\n\n每个字符串都包含一个 `toUpperCase` 属性。当你调用此属性时，它会返回字符串的副本，其中所有的字母都转换为大写。尽管\
  \ `toUpperCase` 不接受参数，但该函数可以评估字符串 `\"Doh,\"`，它是我们上面调用的值的属性。由函数属性被称为方法。下面的示例说明了两个可以影响数组的方法。\n\
  \n```javascript\nlet sequence = [1, 2, 3];\n\nsequence.push(4);\n\nsequence.push(5);\n\
  \nconsole.log(sequence);\n// → [1, 2, 3, 4, 5]\n\nconsole.log(sequence.pop());\n\
  // → 5\n\nconsole.log(sequence);\n// → [1, 2, 3, 4]\n```\n\n`push` 方法用于将值附加到数组末尾，而\
  \ `pop` 方法则完全相反。它移除数组中的最后一个值并将其返回。这些是栈操作的通用术语。栈是一种数据布局，允许用户向某个方向推入值并以相反的方向弹出值，以便后添加的值先被移除。\n\
  \n### 对象\n\n你可以将一组日志条目表示为数组，尽管每个字符串条目都需要保存一份活动列表，以及一个指定 Jacques 是否变身成松鼠的布尔值。我们将这些内容分组为单个值，并将分组后的值放置在日志条目的数组中。属性的任意集合是类型为\
  \ `object`的值。我们将使用大括号作为表达式来开发一个对象。\n\n```javascript\nlet day1 = {\n  squirrel: false,\n\
  \  events: [\"work\", \"touched tree\", \"pizza\", \"running\"]\n};\n\nconsole.log(day1.squirrel);\n\
  // → false\n\nconsole.log(day1.wolf);\n// → undefined\n\nday1.wolf = false;\n\n\
  console.log(day1.wolf);\n// → false\n```\n\n大括号包含由逗号分隔的属性列表。每个属性都包含一个名称、一个值和一个冒号。当你跨行编写对象时，请确保你的缩进良好，因为这可以提高可读性。应该给无效的绑定名属性或有效的数字加上引号。\n\
  \n```javascript\nlet descriptions = {\n  work: \"Went to work,\"\n  \"touched tree\"\
  : \"Touched a tree.\"\n};\n```\n\n在 JavaScript 中有两种方式使用大括号。它可以用于语句的开头，也可以用于开启语句块。你可以使用\
  \ `=` 运算符为属性表达式指定值。它会取代属性值，如果它已存在，则会创建一个。`delete` 运算符是一个一元运算符，用于删除对象的属性名。下面是一个示例：\n\
  \n```javascript\nlet anObject = {left: 1, right: 2};\n\nconsole.log(anObject.left);\n\
  // → 1\n\ndelete anObject.left;\n\nconsole.log(anObject.left);\n// → undefined\n\
  \nconsole.log(\"left\" in anObject);\n// → false\n\nconsole.log(\"right\" in anObject);\n\
  // → true\n```\n\n二元运算符 `in` 决定对象或字符串是否包含具名属性。将属性指定为 `undefined` 与删除它的主要区别在于，对象包含该属性而删除后不再拥有该属性，因此结果返回\
  \ false。要确定对象中包含哪些属性，会返回一个包含对象属性名的字符串数组。\n\n```javascript\nconsole.log(Object.key({x:\
  \ 0, y: 0, c: 2}));\n// → [\"x\", \"y\", \"c\"]\n```\n\n`Object.assign` 函数用于从一个对象的属性拷贝到另一个对象。\n\
  \n```javascript\nlet objectA = {a: 1, b: 2};\n\nObject.assign(objectA, {b: 3, c:\
  \ 4});\n```\n\n\n\n相关性是分析变量之间脆弱性的评估。它们是范围从 -1 到 1 之间的值。`Unrelated`（不相关）变量被称为零相关。相关性为\
  \ `1` 表示两者相关。负相关表示变量完全相关但相反；一个为真，另一个为假。要计算两个 `Boolean`（布尔）值之间相关性的评估，请使用 Phi 系（`φ`）。该公式的输入是一个频率表，记录了多种变量混合情况出现的次数。公式的输出将是一个介于\
  \ -1 和 1 之间的数字。这就是相关性的最佳定义。\n\n让我们以吃披萨这一事件为例，并将其插入频率表中，其中每个数字都代表总次数，而我们在测量中使用了这种组合。我们将表格命名为\
  \ `n`，并使用以下公式计算 `φ`：\n\n`φ` = $\\frac{n11n00 - n10n01}{\\sqrt{n1•\\cdot n0•\\cdot\
  \ n1•\\cdot n00}}$\n\n符号 `n01` 表示第一个变量变为假（`0`）而第二个变量变为真（`1`）的测量次数。披萨表中的 `n01` 为\
  \ `9`。\n\n值 `n1•` 表示所有第一个变量变为真的测量总和，在表格示例中为 `5`。同样，`n•0` 表示第二个变量变为假的测量数量。\n\n在披萨表中，除线上方部分为\
  \ $1\\times76-4\\times9 = 40$，下方部分为 $5\\times85\\times10\\times80$ 的平方根，即 $\\sqrt{340000}$。结果将是\
  \ `φ \\approx 0.069`，这是一个非常小的值。因此，吃披萨对转换没有影响。\n\n### 计算相关性\n\nJavaScript 允许使用包含四个元素的数组\
  \ `[76, 9, 4, 1]` 来表示一个二二表格。其他表示方法还包括包含两个二元素数组 `[[76, 9], [4, 1]]`，或者包含如 `\"11\"\
  ` 和 `\"01\"` 等属性名的对象，以及能够产生访问椅子简写表达式的平坦数组。我们将数组的索引解释为两位二进制数，其中最高位指的是松鼠变量，最低位指事件表。例如，二进制数\
  \ `10` 指“Jacques 确实变成了松鼠”但事件未出现。它发生了四次，二进制在十进制中为 `2`，该数字被存储为数组的索引 `2`。此函数从数组计算 `φ`\
  \ 系：\n\n```javascript\nfunction phi(chair) {\n  return (chair[3] * chair[0] - chair[2]\
  \ * chair[1]) /\n  Math.sqrt((chair[2] + chair[3]) *\n  (chair[0] + chair[1]) *\n\
  \  (chair[1] + chair[3]) *\n  (chair[0] + chair[2]));\n} // 注意：此处原代码逻辑与公式略有出入，保留原文\n\
  }\n```\n\n表格需要两个字段来获取如 `n1•` 这样的字段，因为总行数和列数间接存储在我们的数据布局中。如果你想为特定事件提取二二表格，你必须遍历所有条目并计算事件发生在松鼠转换的次数。\n\
  \n```javascript\nfunction tableFor(event, journal) {\n  let table = [0, 0, 0, 0];\n\
  \  for (let i = 0; i < journal.length; i++) {\n    let entry = journal[i], index\
  \ = 0;\n    if (entry.events.includes(event)) index += 1;\n    if (entry.squirrel)\
  \ index += 2;\n    table[index] += 1;\n  }\n  return table;\n}\n\nconsole.log(tableFor(\"\
  pizza\", JOURNAL));\n// → [76, 9, 4, 1]\n```\n\n数组包含一个 `include` 方法，用于检查集合值是否存在于数组中。该方法被函数用于判断事件名称是否出现在某天的感兴趣的事件列表中。\n\
  \n### 数组循环\n\n`tableFor` 函数包含如下循环：\n\n```javascript\nfor (let I = 0; I < JOURNAL.length;\
  \ I++) {\n  let entry = JOURNAL[i];\n  // 对 entry 进行某些操作\n}\n```\n\n这种类型的循环用于高级\
  \ JavaScript 中。这是在现代 JavaScript 中编写此类循环的方式。\n\n```javascript\nfor (entrance of JOURNAL)\
  \ {\n  console.log(`${entrance.events.length} events.`);\n}\n```\n\n使用这样的循环，循环将在\
  \ `of` 之后指定的值的元素间继续。此循环用于字符串和其他数据布局。\n\n### 最终分析\n\n为数据集中发生的每种类型的事件计算一个相关性。如果你想实现这一点，请搜索每种类型的事件。\n\
  \n```javascript\nfunction journalEvents(journal) {\n  let events = [];\n  for (let\
  \ entry of journal) {\n    for (let event of entry.events) {\n      if (!events.includes(event))\
  \ {\n        events.push(event);\n      }\n    }\n  }\n  return events;\n}\n```\n\
  \n\n\n在字符串值章节中，我们讨论了 `length` 和 `toUpperCase`，但如果你想添加一个新属性，它是无效的。\n\n```javascript\n\
  let kim = \"Kim\";\nkim.age = 88;\nconsole.log(kim.age);\n// → undefined\n```\n\n\
  所有的字符串值都包含一些方法。其中一些 `slice` 和 `indexOf`，它们在外观和名称上与数组方法相似。\n\n```javascript\nconsole.log(\"\
  coconuts\".slice(4, 7));\n// → nut\n\nconsole.log(\"coconut\".indexOf(\"u\"));\n\
  // → 1\n```\n（注：原文为 5）\n\n字符串的 `indexOf` 可以查找包含多个字符的字符串，而对应的数组方法搜索的是单个元素。\n\n```javascript\n\
  console.log(\"one two three\".indexOf(\"ee\"));\n// → 11\n```\n\n`trim` 方法可以删除字符串开头和结尾的空白。\n\
  \n```javascript\nconsole.log(\" okay \\n \".trim());\n// → okay\n```\n\n`zeroPad`\
  \ 函数也可以称为 `padStart`，它接受首选的填充字符和长度作为参数。\n\n```javascript\nconsole.log(String(6).padStart(3,\
  \ \"0\"));\n// → 006\n```\n\n你可以使用 `split` 在另一个字符串的每个位置拆分字符串，然后使用 `join` 将它们组合在一起。\n\
  \n```javascript\nlet sentence = \"Secretarybirds specialize in stomping\";\nlet\
  \ words = sentence.split(\" \");\nconsole.log(words);\n// → [\"Secretarybirds\"\
  , \"specialize\", \"in\", \"stomping\"]\n\nconsole.log(words.join(\". \"));\n//\
  \ → Secretarybirds. specialize. in. stomping\n```\n\n你可以使用 `repeat` 方法重复字符串，它会生成一个包含多个原始字符串副本的新字符串。\n\
  \n```javascript\nconsole.log(\"LA\".repeat(3));\n// → LALALA\n```\n\n如果你想访问字符串中的单个字符，请看下文：\n\
  \n```javascript\nlet string = \"ABC\";\nconsole.log(string.length);\n// → 3\n\n\
  console.log(string[1]);\n// → B\n```\n（注：原文为 b）\n\n### 剩余参数 (Rest parameters)\n\n\
  函数接收任意数量的参数是非常重要的。如果你想写这样一个函数，在函数的最后一个参数之前添加三个点。\n\n```javascript\nfunction max\
  \ (...numbers) {\n  let result = -Infinity;\n  for (let number of numbers) {\n \
  \   if (number > result) result = number;\n  }\n  return result;\n}\n\nconsole.log(max(4,\
  \ 1, 9, -2));\n// → 9\n```\n\n当你调用函数时，剩余的参数属于一个包含剩余参数的数组。你也可以利用三点表示法在参数数组中调用函数。\n\
  \n```javascript\nlet numbers = [5, 1, 7];\nconsole.log(max(...numbers));\n// → 7\n\
  ```\n\n将数组展开到函数调用中，将元素作为不同的参数传递，例如 `max(9, ...numbers, 2)`。方括号数组表示法允许三点运算符将另一个数组引入新数组。\n\
  \n```javascript\nlet words = [\"never\", \"fully\"];\nconsole.log([\"will\", ...words,\
  \ \"understand\"]);\n// → [\"will\", \"never\", \"fully\", \"understand\"]\n```\n\
  \n### Math 对象\n\n`Math` 对象被用作收集许多相似功能的容器。它产生了一个命名空间，允许在没有全局绑定的情况下使用值和函数。这是全大写写常量值名的旧方法。\n\
  \n```javascript\nfunction randomPointOnCircle(radius) {\n  let angle = Math.random()\
  \ * 2 * Math.PI;\n  return {\n    x: radius * Math.cos(angle),\n    y: radius *\
  \ Math.sin(angle)\n  };\n}\n\nconsole.log(randomPointOnCircle(2));\n// → {x: 0.3667,\
  \ y: 1.966}\n```\n\n每当你调用数学函数时，它都会返回一个零到一之间的新的伪随机数。\n\n```javascript\nconsole.log(Math.random());\n\
  // → 0.36993729369714856\n\nconsole.log(Math.random());\n// → 0.727367032552138\n\
  \nconsole.log(Math.random());\n// → 0.40180766698904335\n```\n\n当你需要一个随机整数而不是小数时，你可以对\
  \ `Math.random` 的结果使用 `Math.floor`。\n\n```javascript\nconsole.log(Math.floor(Math.random()\
  \ * 10));\n// → 2\n```\n\n随机数乘以 10 并输出一个大于等于 0 且 10 的数。记住 `Math.floor` 会向下取整，输出将是\
  \ 0 到 9 任何数字。Math 对象包含几个函数，如 `Math.ceil`（向上取整到整数）、`Math.round`（四舍五入到最近的整数）以及 `Math.abs`（该函数取数字的绝对值）。\n\
  \n### 解构 (Destructuring)\n\n让我们用一下 `phi` 函数。\n\n```javascript\nfunction phi(chair)\
  \ {\n  return (table[3] * chair[0] - table[2] * chair[1]) /\n  Math.sqrt((chair\
  \ [2] + chair [3]) *\n  (table[0] + chair [1]) *\n  (table[1] + chair [3]) *\n \
  \ (table[0] + chair [2]));\n}\n```\n（注：提供的原文后半部分存在大量重复和乱码，此处根据核心逻辑进行整理翻译）\n\n\n\n\
  \n\n当涉及到 JavaScript 语言时，词汇表会使用“抽象”（abstraction）这一术语。抽象用于隐藏细节，并使用户能够在更高的层次上讨论问题。让我们区分两种豌豆汤的配方。第一种：\n\
  \n每人，在容器内放入 `1 cup` 干豌豆。加入足够的水淹没豌豆，让其浸泡约 `12 hours`。将其从水中取出放入用于烹饪的锅中，加入四杯水（`4 cups`）。让它煮沸约\
  \ `two hours`，每人准备半个洋葱，用刀切片并倒入豌豆中，备制 `10 minutes`。\n\n然后是第二种配方：\n\n每人：半个洋葱、一根芹芹、`1\
  \ cup` 干分豌豆和根胡萝卜。\n\n将豌豆浸在水中约 `12 hours`。在水（`4 cups`）中煮沸约 `2 hours`，连接并切片蔬菜。煮 `10\
  \ minutes`。\n\n计算机逐个执行任务，从盲目执行到高层概念。\n\n### 抽象重复\n\n普通函数用于创建抽象。程序习惯于按指定次数重复某个函数。你可以通过这样的循环来实现它：\n\
  \n```\nfor (let i = 0; i < 10; i++) {\n  console.log(i);\n}\n```\n\n在这里，我们写了一个调用\
  \ `console.log` `N` 次的函数。\n\n```javascript\nfunction repeatLog(n) {\n  for (let\
  \ I = 0; I < n; I++) {\n    console.log(I);\n  }\n}\n```\n\n如果你想执行不同于记录数字的任务，可以将动作封装为函数值。\n\
  \n```javascript\nfunction repeat(n, action) {\n  for (let I = 0; I < n; I++) {\n\
  \    action(i);\n  }\n}\n\nrepeat(3, console.log);\n// → 0\n// → 1\n// → 2\n```\n\
  \n有时你不需要在循环中封装一个预定义的函数，而是创建一个函数值作为替代：\n\n```javascript\nlet labels = [];\n\nrepeat(5,\
  \ i => {\n  labels.push(`Unit ${i + 1}`);\n});\n\nconsole.log(labels);\n// → [\"\
  Unit 1\", \"Unit 2\", \"Unit 3\", \"Unit 4\", \"Unit 5\"]\n```\n\n这种方法的布局类似于循环；它定义了循环的类型然后产生循环体。尽管体是写在\
  \ `repeat` 调用的括号内的函数中的。\n\n### 高阶函数\n\n高阶函数是可以处理其他函数的函数，无论是通过参数还是通过返回。这种类型的函数使用户对动作进行抽象。例如，你有一个可以产生函数的函数\n\
  \n```javascript\nfunction greaterThan(n) {\n  return m => m > n;\n}\n\nlet greaterThan10\
  \ = greaterThan(10);\nconsole.log(greaterThan10(11));\n// → true\n```\n\n你也可以拥有转换其他函数的函数。\n\
  \n```javascript\nfunction noisy(f) {\n  return (...args) => {\n    console.log(\"\
  calling with\", args);\n    let result = f(...args);\n    console.log(\"called with\"\
  , args, \", returned\", result);\n    return result;\n  };\n}\n\nnoisy(Math.min)(3,\
  \ 2, 1);\n// → calling with [3, 2, 1]\n// → called with [3, 2, 1], returned 1\n\
  ```\n\n你还可以编写产生新控制流的函数。\n\n```javascript\nfunction unless(test, then) {\n  if (!test)\
  \ then();\n}\n\nrepeat(3, n => {\n  unless(n % 2 == 1, () => {\n    console.log(n,\
  \ \"is even\");\n  });\n});\n// → 0 is even\n// → 2 is even\n```\n\n这种方法是一个内置数组方法\
  \ `forEach`，它作为一个高阶函数产生一个类似于 `for/of` 循环的循环。\n\n```javascript\n[\"A\", \"B\"].forEach(l\
  \ => console.log(l));\n// → A\n// → B\n```\n\n### 过滤数组\n\n要在数据集中搜索脚本，使用以下函数。该函数帮助过滤数组中通过测试的元素。\n\
  \n```javascript\nfunction filter(array, test) {\n  let passed = [];\n  for (let\
  \ element of array) {\n    if (test(element)) {\n      passed.push(element);\n \
  \   }\n  }\n  return passed;\n}\n\nconsole.log(filter(SCRIPTS, script => script.living));\n\
  // → [{name: \"Adlam\", …}, …]\n```\n\n此函数利用名为 `test` 的参数（函数值）来填充计算过程中的空白。它决定了接收哪个元素。\n\
  \n### 使用 map 转换\n\n`map` 方法通过为数组的每一个元素设置一个函数来更改数组，并根据返回的值创建一个新数组。新数组的长度与输入数组相同，但它将通过函数将其内容映射到一个更新后的为（for）中。\n\
  \n```javascript\nfunction map(array, transform) {\n  let mapped = [];\n  for (let\
  \ element of array) {\n    mapped.push(transform(element));\n  }\n  return mapped;\n\
  }\n\nlet rtlScripts = SCRIPTS.filter(s => s.direction == \"rtl\");\nconsole.log(map(rtlScripts,\
  \ s => s.name));\n// → [\"Adlam\", \"Arabic\", …]\n```\n\n类似于 `forEach` 和 `filter`。\n\
  \n### 使用 reduce 汇总\n\n当累加数字时，从零开始并将 `element` 加到 `sum`。`reduce` 的参数是 `map` 函数。\n\
  \n```javascript\nfunction reduce(array, combine, begin) {\n  let result = begin;\n\
  \  for (let element of array) {\n    result = combine(result, element);\n  }\n \
  \ return result;\n}\n\nreduce([1, 2, 3], (total, n) => total + n, 0);\n// → 6\n\
  ```\n\n`reduce` 方法是强大的。它可以用于展平数组：\n\n```javascript\nreduce([[1, 2], [3, 4]], (total,\
  \ n) => {\n  return total.concat(n);\n}, []);\n// → [1, 2, 3, 4]\n```\n\n`reduce`\
  \ 方法还可以用于计数：\n\n```javascript\nreduce([\"1\", \"2\", \"1\", \"2\", \"1\"], (total,\
  \ n) => {\n  total[n] = (total[n] || 0) + 1;\n  return total;\n}, {});\n// → {1:\
  \ 3, 2: 2}\n```\n\n`reduce` 方法还可以用于转换数组：\n\n```javascript\nreduce([1, 2, 3], (total,\
  \ n) => {\n  return total.concat(n * 2);\n}, []);\n// → [2, 4, 6]\n```\n\n`reduce`\
  \ 方法还可以用于排序数组：\n\n```javascript\nreduce([4, 1, 3, 2, 5], (total, n) => {\n  return\
  \ total.concat(n).sort((a, b) => a - b);\n}, []);\n// → [1, 2, 3, 4, 5]\n```\n\n\
  `reduce` 方法还可以用于寻找最大值：\n\n```javascript\nreduce([1, 5, 2, 8, 3], (total, n) => {\n\
  \  return n > total ? n : total;\n}, 0);\n// → 8\n```\n\n`reduce` 方法还可以用于寻找最小值：\n\
  \n```javascript\nreduce([1, 5, 2, 8, 3], (total, n) => {\n  return n < total ? n\
  \ : total;\n}, 1);\n// → 1\n```\n\n`reduce` 方法还可以用于计算平均值：\n\n```javascript\nreduce([1,\
  \ 2, 3, 4, 5], (total, n) => {\n  return total + n;\n}, 0) / 5;\n// → 3\n```\n\n\
  `reduce` 方法还可以用于分组数组：\n\n```javascript\nreduce([\"apple\", \"banana\", \"apple\"\
  , \"orange\", \"banana\"], (total, n) => {\n  total[n] = total[n] || [];\n  total[n].push(n);\n\
  \  return total;\n}, {});\n// {apple: [\"apple\", \"apple\"], banana: [\"banana\"\
  , \"banana\"], orange: [\"orange\"]}\n```\n\n`reduce` 方法还可以用于创建对象：\n\n```javascript\n\
  reduce([\"apple\", \"banana\", \"apple\", \"orange\", \"banana\"], (total, n) =>\
  \ {\n  total[n] = (total[n] || 0) + 1;\n  return total;\n}, {});\n// {apple: 2,\
  \ banana: 2, orange: 1}\n```\n\n### 可组合性\n\n花点时间思考它是如何工作的：\n\n```javascript\nlet\
  \ biggest = null;\n\nfor (let script of SCRIPTS) {\n  if (biggest == null || characterCount(script)\
  \ > characterCount(biggest)) {\n    biggest = script;\n  }\n}\n\nconsole.log(biggest);\n\
  // {name: \"Han\", …}\n```\n\n你可以使用高阶函数组合操作：\n\n```javascript\nfunction compose(...functions)\
  \ {\n  return function(x) {\n    return functions.reduceRight((acc, f) => f(acc),\
  \ x);\n  };\n}\n\nconst add5 = x => x + 5;\nconst multiplyBy3 = x => x * 3;\nconst\
  \ square = x => x * x;\n\nconst compose = compose(square, multiplyBy3, add5);\n\n\
  console.log(compose(2));\n// → 27\n```\n\n### 字符串和字符代码\n\n数据集的重要用途之一是找出文本块使用的是什么脚本。下面是执行该任务的程序。\n\
  \n每个脚本都包含一个相关的字符范围数组。因此，如果你被字符代码，利用此函数查找相应的脚本（如果可用）：\n\n```javascript\nfunction\
  \ characterScript(code) {\n  for (let script of SCRIPTS) {\n    if (script.ranges.some(([from,\
  \ to]) => {\n      return code >= from && code < to;\n    })) {\n      return script;\n\
  \    }\n  }\n  return null;\n}\n\nconsole.log(characterScript(121));\n// → {name:\
  \ \"Latin\", …}\n```\n\nJavaScript 字符串上有一些操作，例如使用 `length` 属性获取长度，通过方括号评估其内容。\n\n\
  // 两个 emoji 字符，马和鞋\n\nlet horseShoe = \"\U0001F434\U0001F45F\";\n\nconsole.log(horseShoe.length);\n\
  // → 4\n\nconsole.log(horseShoe[0]);\n// → (无效的半字符)\n\nconsole.log(horseShoe.charCodeAt(0));\n\
  // → 55357 (半字符的编码)\n\nconsole.log(horseShoe.codePointAt(0));\n```\n\n\n\n\n\n#\
  \ → 128052 (马表情符号的实际代码)\n\nJavaScript 的 `charCodeAt` 方法提供完整的 Unicode 字符。该方法被用于从字符串中提取字符。尽管发送给\
  \ `codePointAt` 的参数仍然是连续代码单元的索引，但如果你使用 `codePointAt` 来遍历字符串，它产生的是真实的字符而不是代码单元。\n\
  \n```javascript\nlet roseDragon = \"\U0001F339\U0001F409\";\n\nfor (let char of\
  \ roseDragon) {\n  console.log(char);\n}\n```\n\n// → \U0001F339\n// → \U0001F409\
  \n\n## 识别文本\n\n你现在有一个 `Script` 函数和一个可以正确遍历字符的方法，现在计算每个脚本拥有的字符数量。这里使用了下面的计数抽象：\n\n\
  ```javascript\nfunction countBy(items, groupName) {\n  let counts = [];\n\n  for\
  \ (let item of items) {\n    let name = groupName(item);\n    let known = counts.findIndex(c\
  \ => c.number == name);\n    if (known == -1) {\n      counts.push({nunber, count:\
  \ 0});\n    } else {\n      counts[know].count++;\n    }\n  }\n  return counts;\n\
  }\n\nconsole.log(countBy([0,1, 2, 3, 4, 5], n => n > 2));\n// → [{number: false,\
  \ count: 2}, {number: true, count: 3}]\n```\n\n`countBy` 函数期望一个集合（一组数字、元素或任何可以用\
  \ `for/of` 遍历的内容）以及一个为指定元素计算组名的名的函数。它返回一个对象列表。每个对象命名一个组并确定该组内包含的元素数量。\n\n`findIndex`\
  \ 方法与 `indexOf` 类似。该方法用于搜索第一个使函数返回 `true` 的值，当未找到元素时返回 `-1`。你可以使用 `countBy` 来确定文本块在使用哪种脚本。\n\
  \n```javascript\nfunction textScripts(text) {\n  let scripts = countBy(text, char\
  \ => {\n    let script = characterScript(char.codePointAt(0));\n    return script?\
  \ script.name : \"none\";\n  }).filter(({name}) => name != \"none\");\n\n  let total\
  \ = scripts.reduce((n, {count}) => n + count, 0);\n  if (total == 0) return \"No\
  \ scripts found\";\n  return scripts.map(({name, count}) => {\n    return `${Math.round(count\
  \ * 100 / total)}% ${name}`;\n  }).join(\", \");\n}\n\nconsole.log(textScripts('`英国的狗`说\"\
  woof\", `俄`罗斯的狗说\"тяв\"'));\n// → 61% Han, 22% Latin, 17% Cyrillic\n```\n\n该函数通过使用\
  \ `characterScript` 附加名称计算字符，并对没有任何脚本的字符返回 `\"none\"`。如果你想计算百分比，你需要确定属于某个脚本的字符总数，以便\
  \ `reduce` 方法进行汇总。如果没有找到字符，函数将返回 `\"none\"` 字符串。\n\n## 总结\n\n将函数值发送到多个函数中是 JavaScript\
  \ 的一个重要方面。它允许编写模拟在它们之间存在“间隙”计算的函数。声明这些函数的代码可以通过提供函数值来包含这些间隙。数组提供了几个重要的高阶方法。使用 `forEach`\
  \ 遍历数组中的元素。使用 `filter` 方法返回一个包含符合谓词元素的新数组。使用 `map` 通过函数设置每个项来更改数组。使用 `reduce` 将数组的每个组件合并为一个单独的值。\n\
  \n## 练习\n\n阐述一个 JavaScript 函数，它接收一个保存的数字数组并搜索第二最低和最高的数字。\n\n## 方案\n\n![](img/00160.jpg)![](img/00139.jpg)\n\
  \n## 第 7 章：对象的秘密生活\n\n在涉及编程语言时，有一套技术将对象作为程序组织的基本思想，它们被称为面向对象编程。它的概念将在本章进一步解释。\n\n\
  ### 封装\n\n面向对象编程的主要重要性是将程序拆分成较小的部分，并确保每个部分都管理自己的区域。几个相似程序的片段通过接口相互通信，接口是一组受限的函数或绑定，它们在更高层次上产生本质功能，同时隐藏了具体的执行过程。通过对象来演示这种程序片段，它们的布局包含一组特定的属性和方法。布局中的属性是公共的，而外部代码是私有的。在注释或文档中定义可访问的布局。通常在属性名开头使用下划线（`_`）字符表示私有属性。同时，将布局从执行中分离被称为封装。\n\
  \n### 方法\n\n方法是获取函数值的属性。\n\n```javascript\nlet rabbit = {};\n\nrabbit.speak = function(line)\
  \ {\n  console.log(`The rabbit says '${line}'`);\n};\n\nrabbit.speak(\"I'm alive.\"\
  );\n// → The rabbit says 'I'm alive.'\n```\n\n当你将函数作为方法调用时，绑定会在其体内调用它，并指向调用它的对象。\n\
  \n```javascript\nfunction speak(line) {\n  console.log(`The ${this.type} rabbit\
  \ says '${line}'`);\n}\n\nlet whiteRabbit = {type: \"white\", speak};\nlet hungryRabbit\
  \ = {type: \"hungry\", speak};\n\nwhiteRabbit.speak(\"Oh my whiskers!\"); // The\
  \ white rabbit says 'Oh my whiskers!'\n\nHungryRabbit.speak(\"I could use a carrot\
  \ now.\"); // The hungry rabbit says 'I could use a carrot now.'\n\n```箭头函数不会绑定它们自己的。你可以写如下：\n\
  \n```javascript\nfunction normal() {\n  console.log(this.coords.length);\n}\n\n\
  normal.call({coords: [0, 2, 3], length: 5}); // → 3\n```\n\n## 原型\n\n关注 `this`。\n\
  \n```javascript\nlet empty = {};\n\nconsole.log(empty.toString);\n// → function\
  \ toString() {}\n\nconsole.log(empty.toString());\n// → [object Object]\n```\n\n\
  属性是从空对象提取的。空对象的原型是 `Object.prototype`。\n\n```javascript\nconsole.log(Object.getPrototypeOf({})\
  \ == Object.prototype);\n// → true\n\nconsole.log(Object.getPrototypeOf(Object.prototype));\n\
  // → null\n```\n\n`Object.getPrototypeOf` 返回对象的原型。该原型产生像 `toString` 方法的方法。许多对象并不包含\
  \ `Object.prototype` 作为原型，而是使用另一个产生默认属性的对象；函数继承 `Function.prototype`，而数组继承 `Array.prototype`。\n\
  \n```javascript\nconsole.log(Object.getPrototypeOf(Math.max) == Function.prototype);\n\
  // → true\n\nconsole.log(Object.getPrototypeOf([]) == Array.prototype);\n// → true\n\
  ```\n\n这种类型的原型对象包含原型，以便它可以间接创建方法。使用 `Object.create` 构建具有特定原型的对象。\n\n```javascript\n\
  let protoRabbit = {\n  speak(line) {\n    console.log(`The ${this.type} rabbit says\
  \ '${line}'`);\n  }\n};\n\nlet killerRabbit = Object.create(protoRabbit);\nkillerRabbit.type\
  \ = \"killer\";\n\nkillerRabbit.speak(\"SKREEEE!\");\n// → The killer rabbit says\
  \ 'SKREEEE!'\n```\n\n对象表达式中的 `speak(line)` 属性产生一个名为 `speak` 的属性并将其设置为函数。它是描述方法的简便方法。\n\
  \n“proto”兔子是所有属性的容器。\n\n## 类\n\nJavaScript 的原型系统可以被描述为一种名为类的面向对象方法的辅助。类描述了对象类型的形状、属性和方法。原型被用于描述属性，使得每个实例共享相似的值（如方法）。如果你想构建一个设置类的实例，创建一个接收普通原型的对象。下面是构造函数。\n\
  \n```javascript\nfunction makeRabbit(type) {\n  let rabbit = Object.create(protoRabbit);\n\
  \  rabbit.type = type;\n  return rabbit;\n}\n```\n\n\n\n\n\nJavaScript 提供了一种轻松描述此函数的方法。只需在函数调用的前面设置关键字即可。在构建对象过程中使用的原型对象，可以通过获取构造函数的\
  \ `prototype` 属性来获得。\n\n```javascript\nfunction Rabbit(type) {\n  this.type = type;\n\
  }\n\nRabbit.prototype.speak = function(line) {\n  console.log(`The ${this.type}\
  \ rabbit says '${line}'`);\n};\n\nlet weirdRabbit = new Rabbit(\"weird\");\n```\n\
  \n`Function.prototype` 是构造函数的原型。它的 `prototype` 属性捕获了通过它构建的实例所使用的原型。\n\n```javascript\n\
  console.log(Object.getPrototypeOf(Rabbit) == Function.prototype);\n// → true\n\n\
  console.log(Object.getPrototypeOf(weirdRabbit) == Rabbit.prototype);\n// → true\n\
  ```\n\n## 类语法\n\nJavaScript 类是具有 `prototype` 属性的构造函数。以下是一个示例：\n\n```javascript\n\
  class Rabbit {\n  constructor(type) {\n    this.type = type;\n  }\n\n  speak(line)\
  \ {\n    console.log(`The ${this.type} rabbit says '${line}'`);\n  }\n}\n\nlet killerRabbit\
  \ = new Rabbit(\"killer\");\nlet blackRabbit = new Rabbit(\"black\");\n```\n\n`class`\
  \ 关键字以类声明开头，它允许你在特定位置描述构造函数和一组方法。类声明允许将包含函数的方法和属性包含在原型中。当你使用一个表达式时，它并不是描述一个绑定，而是将构造函数作为一个值提供。你可以在表达式中省略类名。\n\
  \n```javascript\nlet object = new class {\n  getWord() { return \"hello\"; }\n};\n\
  \nconsole.log(object.getWord());\n// → hello\n```\n\n## 覆盖派生属性\n\n当向对象添加属性时（无论该属性在原型中是否可用），该属性都会被添加到该对象中。如果原型中存在一个同名的赋值属性，它不会影响该对象。\n\
  \n```javascript\nRabbit.prototype.teeth = \"small\";\nconsole.log(killerRabbit.teeth);\n\
  // → small\n\nkillerRabbit.teeth = \"long, sharp, and bloody\";\nconsole.log(killerRabbit.teeth);\n\
  // → long, sharp, and bloody\n\nconsole.log(blackRabbit.teeth);\n// → small\n\n\
  console.log(Rabbit.prototype.teeth);\n// → small\n```\n\n覆盖属性用于为标准函数和数组原型赋予一个独立的\
  \ `toString` 方法。\n\n```javascript\nconsole.log(Array.prototype.toString == Object.prototype.toString);\n\
  // → false\n\nconsole.log([1, 3].toString());\n// → 1,3\n```\n\n在数组上调用 `toString`\
  \ 会赋予一个结果，该结果类似于对对其调用 `join(\",\")`。它在数组包含的值之间放置一个逗号。如果你对数组调用 `Object.prototype.toString`，它会提供一个独立的字符串。\n\
  \n```javascript\nconsole.log(Object.prototype.toString.call([1, 3]));\n// → [object\
  \ Array]\n```\n\n## Map\n\nMap 是一种将值与其他值连接起来的数据布局。如果你想将名称映射到年龄，可以这样写代码：\n\n```javascript\n\
  let ages = {\n  Boris: 39,\n  Liang: 22,\n  Júlia: 62\n};\n\nconsole.log(`Julia\
  \ is ${ages[\"Julia\"]}`);\n// → Julia is 62\n\nconsole.log(\"Is Jack's age known?\"\
  , \"Jack\" in ages);\n// → Is Jack's age known? false\n\nconsole.log(\"Is toString's\
  \ age known?\", \"toString\" in ages);\n// → Is toString's age known? true\n```\n\
  \n对象的属性名应该是字符串。如果你想要一个键不能转换为字符串的 Map，请不要使用 `object` 作为 Map。JavaScript 包含一个名为 `Map`\
  \ 的类。它保存映射并允许不同类型的键。\n\n```javascript\nlet ages = new Map();\nages.set(\"Boris\"\
  , 39);\nages.set(\"Liang\", 22);\nages.set(\"Júlia\", 62);\n\nconsole.log(`Júlia\
  \ is ${ages.get(\"Júlia\")}`);\n// → Júlia is 62\n\nconsole.log(\"Is Jack's age\
  \ known?\", ages.has(\"Jack\"));\n// → Is Jack's age known? false\n\nconsole.log(ages.has(\"\
  toString\"));\n// → false\n```\n\n`get`、`set` 和 `has` 方法是 map 对象布局体。`Object.keys`\
  \ 只返回对象的自身的键。你可以使用 `hasOwnProperty` 方法作为选项。\n\n```javascript\nconsole.log({x: 1}.hasOwnProperty(\"\
  x\"));\n// → true\n\nconsole.log({x: 1}.hasOwnProperty(\"toString\"));\n// → false\n\
  ```\n\n## 多态\n\n当在对象上调用字符串函数时，会调用该对象上的 `toString` 方法以从其构建一个有意义的字符串。你可以定义自己的 `toString`\
  \ 版本，以便它们能够构建比 `\"[object Object]\"` 更重要的字符串。以下是一个示例：\n\n```javascript\nRabbit.prototype.toString\
  \ = function() {\n  return `a ${this.type} rabbit`;\n};\n\nconsole.log(String(blackRabbit));\n\
  // → a black rabbit\n```\n\n当代码与具有特定布局的对象运行时被称为多态。多态代码可以与多种形状的值正常工作。\n\n## Symbol\n\
  \nSymbol 是使用 `Symbol` 函数构建的唯一值，无法构建两次。\n\n```javascript\nlet sym = Symbol(\"name\"\
  );\nconsole.log(sym == Symbol(\"name\"));\n// → false\n\nRabbit.prototype[sym] =\
  \ 55;\nconsole.log(blackRabbit[sym]);\n// → 55\n```\n\n\n\n\n对象包含方法，但你也可以附加存储值而没有函数的属性，例如\
  \ `Map` 对象中包含一个 `size` 属性，该属性决定了其中保存了多少个键。被评估的属性可以隐藏方法调用。这些方法被称为访问器（getters），你可以通过在类声明或对象表达式中在方法名开头编写\
  \ \"get\" 来描述它们。\n\n```javascript\nlet varyingSize = {\n  get size() {\n    return\
  \ Math.floor(Math.random() * 100);\n  }\n};\n\nconsole.log(varyingSize.size);\n\
  // → 73\n\nconsole.log(varyingSize.size);\n// → 49\n```\n\n当你想要使用对象的 `size` 属性时，你调用关联的方法。当你使用设置器（setter）使用属性时，也可以执行类似的任务。\n\
  \n```javascript\nclass Temperature {\n  constructor(celsius) {\n    this.celsius\
  \ = celsius;\n  }\n  get fahrenheit() {\n    return this.celsius * 1.8 + 32;\n \
  \ }\n  set fahrenheit(value) {\n    this.celsius = (value - 32) / 1.8;\n  }\n  static\
  \ fromFahrenheit(value) {\n    return new Temperature((value - 32) / 1.8);\n  }\n\
  }\n\nlet temp = new Temperature(22);\nconsole.log(temp.fahrenheit);\n// → 71.6\n\
  \ntemp.fahrenheit = 86;\nconsole.log(temp.celsius);\n// → 30\n```\n\n`Temperature`\
  \ 类允许你读取和写入摄氏度或华氏度的温度，但它只保存摄氏度并在 `fahrenheit` 访问器和设置器中与摄氏度之间转换。在类声明中，写在名称之前的静态方法保存在构造函数上。因此，你可以编写\
  \ `Temperature.fromFahrenheit(100)` 来通过华氏度构建温度。\n\n### 继承\n\n某些矩阵是对称的。当你通过其左上到右下的对角线反射对称矩阵时，它不会发生变化。设置在\
  \ `x,y` 处的值与 `y,x` 相同。使用 JavaScript 的原型系统来构建新类，新类的原型从旧原型中获取，但为方法设置了新定义。在面向对象编程术语中这被称为继承。下面是一个示例：\n\
  \n```javascript\nclass SymmetricMatrix extends Matrix {\n  constructor(size, element\
  \ = (x, y) => undefined) {\n    super(size, size, (x, y) => {\n      if (x < y)\
  \ return element(y, x);\n      else return element(x, y);\n    });\n  }\n  set(x,\
  \ y, value) {\n    super.set(x, y, value);\n    if (x != y) {\n      super.set(y,\
  \ x, value);\n    }\n  }\n}\n\nlet matrix = new SymmetricMatrix(5, (x, y) => `${x},${y}`);\n\
  console.log(matrix.get(2, 3));\n// → 3,2\n```\n\n### instanceof 运算符\n\n了解一个对象是否来自某个特定的\
  \ `instanceof` 是重要的。\n\n```javascript\nconsole.log(new SymmetricMatrix(2) instanceof\
  \ SymmetricMatrix);\n// → true\n\nconsole.log(new SymmetricMatrix(2) instanceof\
  \ Matrix);\n// → true\n\nconsole.log(new Matrix(2, 2) instanceof SymmetricMatrix);\n\
  // → false\n\nconsole.log([1] instanceof Array);\n// → true\n```\n\n该运算符将扫描所继承的类型。因此，`SymmetricMatrix`\
  \ 是 `Matrix` 的实例。你也可以将此方法应用于标准构造函数（如 `Array`）。\n\n## 总结\n\n在本章中，我们意识到对象的操作不仅仅是持有它们的属性。它们还由也是对象的原型组成。只要原型具有该属性，它们的行为就像它们包含了它们没有提供的属性一样。简单对象使用\
  \ `Object.prototype` 来表示它们的原型。我们还讨论了构造函数，它们是函数，名称通常以大写字母开头，并配合 `new` 运算符用于构建新对象。新对象的原型将是构造函数\
  \ `prototype` 属性中的对象。类语法提供了一种描述构造函数及其原型的方法。我们还接触了访问器、设置器、静态方法以及 `instanceof` 运算符。\n\
