  \n- 价格：$29.95 (可在 `SparkFun` 购买)\n- 闪存内存：`32kB`\n- SRAM：`2kB`\n- EEPROM：`1kB`\n\
  - 处理速度：`8MHz`\n- 数字引脚：`9 pins`\n- PWM 引脚：`5 pins`\n- 模拟输入：`4 pins`\n- 工作电压：`5.5V`\n\
  - 输入电压：`5.5V`\n\n## 其他板\n\n还有其他板，如 `Arduino Mini`、`Pro Mini`、`Arduino Robot Control`、`Arduino\
  \ Robot Motor`、`Arduino BT` 等，且选项正在快速增加。\n\n\n\n\n如果你是一个学者，建议从像 `UNO` 这样的基础开发板开始。当你准备好尝试更高级的项目时，这些其他模型可能是你想要进一步研究的！选择你的\
  \ Arduino 开发板取决于每块板的功能和便利性。如上所述，`UNO` 通常被认为适合初学者的板，但请考虑电压、电流和电阻在你的选择中所起着的作用。每个项目的输入功率取决于你如何使用这块板。\n\
  \n现在，让我们发现如何开始使用 Arduino 。\n\n# 选择和设置 Arduino\n\n设置 Arduino 微控制器的第一步将选择一个你想要使用的\
  \ Arduino 开发板。\n\n## 选择开发板\n\n在查看 Arduino 开发板选项时，在做出选择之前，有几个因素是你需要考虑的。在决定开发板之前，请问自己以下问题：\n\
  \n### 运行我脑海中的应用需要多少功率？\n你可能不知道你的项目所需的闪存内存（flash memory）和处理能力的精确测量，但一个变换颜色的简单夜灯与具有许多运动部件的机器人手之间存在着明显的区别。后者需要一个更健壮的\
  \ Arduino 微控制器板，与简单的夜灯想法相比，更快的处理速度、更多的闪存内存和更多的 SRAM。\n\n### 为了实现我想要的功能需要多少数字引脚和模拟引脚？\n\
  同样，你不需要脑海中有一个非常具体的想法，但知道你需要更多还是更少的引脚将对你选择哪块板子板产生巨大影响。如果你想做一个简单的第一个项目，拥有较少的数字、`PWM`\
  \ 和模拟引脚即可，而如果你想做更复杂的东西，你将想要考虑具有大量引脚的开发板。\n\n### 我想让它成为可穿戴设备吗？\n可穿戴设备有几种选择，所以当然，这个问题不会完全为你做决定。然而，它将帮助缩小选择范围并引导你的方向，`Lilypads`\
  \ 和 `Gemma` 或其他类似的技术将是你的最佳选择。\n\n### 我想连接到物联网吗？如果是，如何连接？\n如果你想连接到物联网，`YÚN`、`Tian`、`Ethernet`、`Leonardo\
  \ ETH` 或 `Industrial 101` 将让你的工作变得简单得多。这些具有以太网连接的能力以及 Wi-Fi 功能，因此你能够连接到互联网等网络，并共享数据或与物联网上的其他设备进行交互和控制。\n\
  \n# 在 Arduino IDE 上开始\n\nArduino 软件运行在一个名为 `IDE` 的环境中。这意味着你要么需要下载桌面 `IDE` 来编写代码，要么在在线\
  \ `IDE` 上在线编程。\n\n你可能访问 `IDE` 的第一个方法是下载桌面应用程序，它有几个选项适用于你可能使用的各种设备。首先，有 `Windows`\
  \ 桌面应用程序。你也可以通过 `Windows` 应用从 `Windows` 平板或 `Windows` 手机访问它。接下来，是 `Macintosh OSX`\
  \ 版本，它允许 `IDE` 在 Apple 笔记本电脑和台式机上运行，但不在 iPhone 和 iPad 等 Apple 移动设备上运行。最后，在 `Linux`\
  \ 上运行 Arduino `IDE` 有三种选项：32 位、64 位和 `Linux ARM` 版本。如果你倾向于此选项而不是网页浏览器选项，你只需访问 `https://www.arduino.cc/en/Main/Software`\
  \ 访问 Arduino `IDE` 网站即可。\n\n在那里，你可以下载适当版本的桌面 `IDE`。接下来，你将运行安装程序，点击呈现的选项，你应该在几分钟内就拥有一个运行中的\
  \ Arduino `IDE` 环境。\n\n这允许你从 `Android` 设备和 Apple 移动设备访问 `IDE` 软件，因为它基于运行在自己的平台上的网页浏览器，而不是在\
  \ `Android` 或 `iOS` 平台上。你还可以在各种类型的计算机上运行网页浏览器，包括 `Linux`、`Microsoft Windows` 和 Apple\
  \ `Macintosh`。这将允许你将 sketch 上传到云端，即把你编写的信息存储在安全的位置，然后你可以通过连接互联网从另一个设备重新访问。\n\n#\
  \ 为你的 Arduino 编写程序\n\n接下来你将为 Arduino 开发板运行的程序编写代码。我们将在下一章介绍如何为 Arduino 开发板编写代码，但现在让我们确保理解代码是在电脑、平板或手机的\
  \ `IDE` 中编写的，无论是桌面应用程序还是网页应用程序。这允许你一次性看到整个代码，以便调试或删除错误。\n\n一旦你写了代码，你将想要运行它并排除或调试你发现的任何错误。最好的方法是将编写的程序应用于\
  \ Arduino 开发板并查看它是否运行。要做到这一点，你将需要进入上传 sketch 的下一步。\n\n# 连接到 Arduino 开发板\n\n某些开发板带有内置\
  \ `USB`、`mini-USB` 或 `micro-USB` 端口。例如，对于你 Arduino 职业的早期阶段，有 `Uno` 和 `Leonardo`。只需将\
  \ `USB` 线的适当端插入你的电脑，另一端插入你所拥有的板上的特定 `USB` 端口，Arduino `IDE` 软件应该就能识别出它是哪种类型的板。如果没有，你始终可以从下拉菜单中选择正确的开发板。\n\
  \n有时你需要使用 `TKDI` 线或开发板来使 Arduino 与计算机兼容。这意味着你把 `TKDI` 插入微控制器板上的 `TKDI` 端口，然后将其连接到计算机。如果你将\
  \ `TKDI` 线连接到开发板，将像处理 `USB` 兼容板那样操作：将线的适当端插入开发板，另一端插入计算机。再次，计算机的软件应该能识别你的 Arduino\
  \ 开发板。\n\n# 上传到 Arduino 开发板\n\n要上传你的 sketch（即刚刚在代码中创建的程序），你需要选择要上传的正确开发板和端口。选择正确的开发板应该是的，因为你只需要寻找与你使用的板类型匹配的板标题。\n\
  \n要选择正确的串口，你可能选择的选项如下：\n\n### Mac\n- `/dev/tty.usbmodem241` 用于 `Uno`、`Mega256O`\
  \ 或 `Leonardo`。\n- `/dev/tty.usbserial-1B1` 用于 `Duemilanove` 或更早的 Arduino 开发板。\n\
  - `/dev/tty.USA19QW1b1P1.1` 用于通过 USB 转串口适配器连接的内容。\n\n### Windows\n- `COM1` 或 `COM2`\
  \ 用于串口。\n- `COM4`、`COM5` 或 `COM7` 及更高用于 USB 连接的板。\n在 Windows 设备管理器中查看你使用的设备在使用哪个端口。\n\
  \n### Linux\n- `/dev/ttyACMx` 用于串口。\n- `/dev/ttyUSBx` 或类似的名称用于 USB 端口。\n\n一旦你选择了正确的开发板和端口，点击上传并从出现的菜单中选择要上传的\
  \ Sketch。如果你有一个较新的 Arduino 开发板，你能够简单地上传新 sketch，但对于旧板，你必须在上传新 sketch 之前重置板子，否则板内存中将存在两个可能冲突的\
  \ sketch，导致其崩溃。\n\n 使用你的程序运行 Arduino\n\n\n\n\n\n一旦你将编写好的程序上传到 Arduino，就有几种方法可以为它供电。首先，你可以通过\
  \ USB 连接到另一个供电设备（例如你的电脑）为其供电。其次，对于具有该功能的板，可以通过以太网供电。这意味着通过连接网络，你将通过以太网连接到电源。最后，你可以使用锂聚合物电池为大多数\
  \ Arduino 供电。\n\n一旦连接了电源并将指定的输入到微控制器，它就会执行其预设的功能。\n\n# 为 Arduino 编程\n\n为 Arduino\
  \ 编写程序意味着学习一种新语言，但它并没有你想象的那么困难。就像数学有自己的符号符号来表示加、减、乘等各种函数一样，在为 Arduino 编程时也使用不同的符号和术语。如果你在过去有编程经验，学习一种新语言很容易的。对于那些从未学过编程的人来说，将一种形式的代码转换为另一种就像将一种语言翻译成另一种语言。尽管这看起来可能很难，但编程的思想是为了以后为其他程序的编程变得更容易。以下是\
  \ Arduino IDE 编程中使用的术语和单词以及它们的用法。\n\n## 结构\n\n### setup()\n\n该函数在 sketch（程序）启动时被调用，并且在启动或重置后仅运行一次。你可以使用它来初始化变量、引脚模式或使用库（可以下载用于额外功能的特定术语）。\n\
  \n### loop()\n\n`loop` 函数要求 Arduino 微控制器板重复执行某项函数，持续执行，直到满足某个变量或条件。你将设置停止循环的条件，或者让它持续循环，直到你从电源上断开\
  \ Arduino 或将其关闭。\n\n## 控制结构\n\n控制结构显示了如何接收输入。正如名称所示，有关控制的各种输入决定了你的数据如何被读取。在数据分析中还会考虑临时语言。下面提到了流行的的各种控制结构。\n\
  \n### If\n\n这是将条件或输入与输出连接起来。这意味着如果满足了某个条件，微控制器将产生特定的输出或响应。例如，如果连接到微控制器的温度计测得温度超过\
  \ 75 度华度，你可能会编写代码引导 Arduino 向你的空调单元发送信号将其开启，以便温度降回 75 度华度。\n\n### If…Else\n\n这类似于\
  \ `If` 条件判断，但它指定了当第一个动作的条件不满足时，微控制器将采取的另一个动作。这让你有机会在一段代码中两种不同的情况下执行两个不同的动作。\n\n\
  ### While\n\n这是一个循环，在所连接的表达式变为假（false）之前会无限持续下去。也就是说，它将执行某项功能，直到满足某个参数且设置为条件的语句变为假。\n\
  \n### Do… While\n\n这类似于 `while` 语句，但它始终至少运行一次，因为它是在函数的末尾测试变量，而不是在开始时测试。\n\n### Break\n\
  \n这是微控制器函数的一种“紧急出口”。它用于退出 `do`、`for` 或 `while` 循环，而无需满足退出该部分功能必须满足的条件。\n\n### Continue\n\
  \n### Return\n\n这是停止函数的方法，它会将函数终止时的值返回给调用它的函数或请求信息的函数。\n\n### Goto\n\n这段代码告诉微控制器移动到编码程序中的另一个（非连续）的位置。它将执行流转移到程序的另一个地方。C\
  \ 语言的程序员通常不建议使用它，但它确实可以简化程序。\n\n## 语法\n\n### ; (分号)\n\n它的作用相当于英语语言中的句号：它结束一个语句。然而，务必确保由分号结束的语句是完整的，否则你的代码将无法正常运行。\n\
  \n### {} (大括号)\n\n这些有许多复杂的功能，但你必须知道的是，当你插入一个起始大括号时，必须紧跟一个结束大括号。这被称为保持大括号平衡，对于让你的程序运行至关重要。\n\
  \n### // (单行注释)\n\n如果你想提醒自己或告诉他人关于你代码如何运行的信息，请使用此代码开始注释，并确保它只占用一行。这不会传输到微控制器的处理器中，而是存在于代码中，作为你以及任何手动阅读代码的人的参考。\n\
  \n### /* */ (多行注释)\n\n这种类型的注释由 `/*` 开头，并跨多行。它本身可以包含单行注释，但不能包含另一个多行注释。务必用 `*/` 关闭注释，否则你代码的其余部分将被视为注释而不执行。\n\
  \n### #define\n\n这会将某个变量定义为常量值。它为该值提供一个名称，作为该值的简写。这些值不占用芯片上的任何内存空间，因此在节省空间方面非常有用。一旦代码被编译或作为一个程序整体处理，编译器会将常量的任何实例替换为定义它所使用的值。\n\
  \n注意：此语句末尾不使用分号。\n\n### #include\n\n这用于在你的 sketch 中包含其他库，即在你的 sketch 中包含原本不会被包含的其他单词和编码语言。例如，你可以包含\
  \ AVR C 库，或者来自各种 C 库的许多工具或代码段。\n\n注意：不要在此语句末尾添加分号，就像你在 `#define` 语句中排除它一样。如果你包含分号结束语句，将收到错误信息且程序无法运行。\n\
  \n## 算术运算符\n\n正如名称所示，算术运算符通过使用数学符号完成代码。每个符号都将一行代码连接到另一行。在寻找测量值的输出时，请务必检查你的 Arduino\
  \ 设置。错误的电压连接 Arduino 可能会导致负值或无关的值。\n\n### = (赋值运算符)\n\n它将值分配给变量，并在它出现的整个操作中替换该变量。这与\
  \ `==` 不同，后者判断两个变量或一个变量与设定值是否相等。双等号的功能更类似于数学和代数中的单等号，而不是 Arduino IDE 中的单等号。\n\n\
  ### + (加法)\n\n它执行你可能预期它执行的操作：将两个值、或一个值和一个变量，或两个值和一个固定常量相加。你必须考虑的一点是，C 语言语言中的变量是有最大值的。这意味着，如果你的变量最大值为\
  \ 32767，那么给变量加 1 将得到一个负结果 -32768。如果你预计值将超过允许的绝对最大值，你仍然可以操作，但你必须指示微控制器在出现负结果时如何处理。在加法、减法、乘法和除法中，你将结果变量放在左侧，将操作放在\
  \ `=` 或 `==` 的右侧。\n\n\n\n\n此外，需要记住的另一点是，你输入到操作中的任何数据类型将决定该操作输出的数据类型。我们稍后会介绍数据类型，但例如，如果你输入整数（整数字），你将得到一个四舍入到最近整数的答案。\n\
  \n### - (减法)\n这种操作与加法号一样，正如你预期的那样：它将两个值相减，无论它们两个都是变量，还是其中一个是常数。同样，你必须注意大于最大整数值的数值。记住将结果变量放在等号或等号的左侧，将操作放在右侧。\n\
  \n### * (乘法)\n特别对于乘法，你需要小心定义如果操作接收到的值大于数据允许的最大值，会发生什么。这是因为乘法尤其会将数字增长到非常非常大的值。\n\n\
  ### / (除法)\n记住将结果变量放在运算符的左侧，将被除的数值放在运算符的右侧。\n\n### % (取模)\n此操作给出一个整数除以另一个整数的余数。例如，如果你执行\
  \ `y = 7 % 5`，则 `y` 的结果将是 `2`，因为 5 进 7 一次，余数为 `2`。记住，你必须对此类操作使用整数值。\n\n## 比较运算符\n\
  比较运算符将等式左侧的值与右侧进行比较。如果左侧运算符与右侧的单位不同，仍然可以使用这些运算符，但结果可能是不可预测的（`Arduino.cc`）。\n\n####\
  \ == (等于)\n此运算符检查双等号左侧的数据是否与右侧的数据匹配，也就是说即它们是否相等。例如，你可能会询问连接到温度计的引脚 `t == 75`，如果温度恰好是\
  \ 75 度，那么微控制器将执行某项任务，无论是关闭加热或冷却，还是关闭风扇。\n\n#### != (不等于)\n这是上一个操作的镜像。你同样可以编写一个程序来测试\
  \ `t != 75`，并在该语句为真时，设置微控制器打开加热灯、打开风扇或点燃壁炉里的木柴。在 `==` 和 `!=` 之间，你可以涵盖输入给微控制器的所有可能条件。\n\
  \n#### < (小于)\n如果此语句为真，你就可以为你的微控制器编写特定的响应，换句话说，为此类输入编写输出。\n\n#### > (大于)\n\n## 输入\n\
  在输入状态下，数字引脚只需要微控制器和电池极少的处理能力和能量。相反，它只是在测量并向微控制器指示它的测量值。\n\n## 输出\n这些非常适合驱动 LED，因为它们处于低阻抗状态，这意味着能量可以自由流过它们而没有多少电阻。输出引脚在微控制器处理完输入引脚提供的信息后接收其指令，输出引脚为执行预期任务的任何机制供电。\n\
  \n## INPUT_PULLUP\n这是当你连接到按钮或开关时想要使用的模式。`INPUT_PULLUP` 状态涉及大量的电阻。这意味着它最适用于类似于布尔值的情况，例如开关的开启或关闭。当只有两种状态且之间没有多少差别时，使用\
  \ `INPUT_PULLUP`。\n\n## LED_BUILTIN\n### true (真)\n在布尔意义上，任何非零整数都是真。1 是真，200 是真，-3\
  \ 是真，等等。当语句符合现实情况时就会这种情况。你的一个引脚可能正在测试一个值，而语句正尝试匹配 `y != 35`，因此如果引脚接收到 `y` 的值为 `25`\
  \ 的信息，那么语句 `25 != 35` 为真。\n\n### false (假)\n这是布尔常量的一部分，意味着语句为假，或者其逻辑不符合现实。例如，你可以有一个语句\
  \ `x > 7`，而微控制器接收到的 `x` 值为 `3`。这将导致语句为假。它随后将被定义为 `0`（零）。\n\n### integer constants\
  \ (整数常量)\n这些是直接由程序（sketch）使用的常量，以 10 进制形式或整数形式存在。你可以通过在整数前加上表示二进制表示（2 进制）、八进制表示（8\
  \ 进制）或十六进制表示（16 进制）的特殊符号来更改整数常量的写法形式。\n\n### floating point constants (浮点常量)\n这些常量通过创建科学计数法中长数字的简写形式来节省程序空间。每当浮点常量出现时，它都会按照你在代码中指定的数值进行求值。\n\
  \n## 数据类型\n数据类型指的是在你应用的每种编程设置中所接收的数据类型。Arduino 接收到的数据被发送到你选择的程序中以确定各种结果。下面列出了一些示例。\n\
  \n### Void (空)\n这用于函数声明，告诉微控制器不期望此函数返回任何信息。例如，你将将其用于 `setup()` 或 `loop()` 函数。\n\n\
  ### Boolean (布尔)\n布尔数据持有两个值之一：true（真）或 false（假）。适用于任何算术运算符函数或其他函数。如果你希望两个条件同时为真时布尔值才为真，将使用\
  \ `&&`；如果你希望两个条件之一为真，则使用 `||`。\n\n### Char (字符)\n这是一个字符，表示一个字符。例如 'A' 或 \"ABC\"\
  。对于有符号字符，范围是 -128 到 127。\n\n### Unsigned Char (无符号字符)\n这与 char 相同，但使用的是 0 到 255\
  \ 而不是有符号字符。这相当于字节。\n\n### Byte (字节)\n这种数据类型在 8 位系统中存储 0 到 255 的数字。例如 `B10010` 是数字\
  \ 18，因为它使用了 2 进制系统。\n\n### Int (整数)\n整数是你存储数字的大部分。因为大多数 Arduino 具有 16 位系统，最小值是 -32768，整数的最大值是\
  \ 32767。Arduino Due 以及其他开发板运行 32 位系统，因此可以携带从 -2147483648 到 2147483647 的整数。在程序尝试算术运算时记住这些数字，任何大于或小于这些值的都会导致代码错误。\n\
  \n### Unsigned Int (无符号整数)\n这在 8 位板上提供了存储 0 到 65535 的能力。如果你有超过有符号整数允许的值，可以切换到无符号整数，并在正范围内获得相同的范围但更高的绝对值。\n\
  \n### Word (字)\n字在 Uno 以及其他开发板上存储 16 位无符号数。在 Due 和 Zero 上，你将使用字存储 32 位数字。字本质上是存储整数的方式。\n\
  \n### Long (长整数)\n如果你需要存储更长的数字，可以使用 4 字节存储，换句话说就是 32 位存储，使用 `long` 变量。你只需要在代码中的整数后面加上大写字母\
  \ `L` 即可。这将实现从 -2147483648 到 2147483647 的数字。\n\n\n\n\n# 无符号长型\n\n实现尽可能大数字和存储最大整数的方法是使用\
  \ `unsigned long` 变量来直接控制微控制器。这为你提供了 32 位（或 4 字节）的使用空间，但由于未分配符号，第 32 位被释放不再表示正负号，从而让你访问从\
  \ 0 到 4,294,967,295 的数字。\n\n# 短型\n\n这仅仅是表示 16 位数据类型的另一种方法。在每种 Arduino 上，你都可以 `short`\
  \ 来表示你期望或使用从 -32,768 到 32,767 之间的整数。这通过不在较小数字上浪费 0 的空间，并减半存储该数字所需的位数，有助于为你的 `Due`\
  \ 或 `Zero` 出空间。\n\n# 浮点型\n\n`float` 数字是一个数字后跟 6 到 7 位小数，乘以 10 的最高 38 次幂。这可以用于存储更精确的数字或更大的数字。`float`\
  \ 数字在计算和处理时需要更多的处理能力，而且它们只有 6 到 7 位的精度，因此它们在所有情况下并不好用。许多程序员实际上尝试尽可能将许多 `float` 运算转换为整数运算以加快处理。此外，这些数字需要\
  \ 32 位存储，而普通的只需要 16 位，所以如果存储空间不足，尝试将你的 `float` 数字转换为整数。\n\n# 双精度型\n\n这仅对 `Due` 有真正意义，在其中双倍精度允许\
  \ `float` 数字的两倍精度。对于所有其他 Arduino 板板，浮点数始终占用 32 位，因此双精度无法增加精度或准确性。\n\n# 将你的 Arduino\
  \ 变成机器\n\n虽然开关和按钮是非常好的东西，但要做的事情远比开关多。尽管 Arduino 是一个数字设备，但它可以从模拟传感器接收信息，从而测量光线、温度等。各种输入和编程语言产生不同的结果，因此输出取决于编码和你选择的传感器。要找到更多传感器，请访问\
  \ Arduino 网站。要创建这个，你使用 Arduino 内置的模数转换器。\n\n你将使用温度传感器来确定皮肤的冷热。该设备根据其检测到的温度释放变化的电压。它带有三个引脚：第一个引脚连接到地，另一个连接到电源。第三个引脚将变量电压传输到\
  \ Arduino。\n\n此项目有一个草图（sketch），可以帮助解释传感器并通过显示温暖程度来开启 LED。温度传感器有不同类型。`TMP36` 是一个合适的型号，因为它可以显示与摄氏度温度不同的电压。\n\
  \nArduino IDE 具有一个串口监视器设备，允许人们记录来自微控制器的结果。使用串口监视器有助于人们发现与传感器状态相关的信息，并培养关于电路及其运行代码的某些知识。\n\
  \n# 创建电路\n\n![](img/00116.jpg)\n\n![](img/00026.jpg)\n\n现在，你正在进行手动操作，但你可以通过校准来实现它。你可以使用按钮来定义参考温度，或者让\
  \ Arduino 在 `loop()` 启动之前选择一个样本并将其作为参考点。\n\n1. 首先，将你的面包板连接到地。\n2. 使用电阻将你有的每个 LED\
  \ 的阴极连接到地。使用 `4` 号引脚将 LED 的正极连接到引脚 `2`。这些是项目的指示器。\n\n将 `TMP36` 放置在面包板上，让圆弧部分背对 Arduino。接下来，将左引脚的平侧连接到电源，右引脚连接到地。将中间引脚连接到\
  \ Arduino 上的 `AO`。\n\n为传感器构建接口以帮助人们使用它。你可以使用类似于良好指示器手的纸剪模型。如果你得没错，你可以为一个人建造一对可以亲吻的嘴并注意它看起来如何。你可能还想标记\
  \ LED 以便揭示某些含义。\n\n![](img/00142.jpg)\n\n1. 在第一图中，拿一张纸并剪裁使其能够放在面包板顶部。在传感器应放置的位置画出一对嘴，并创建几个圆圈允许\
  \ LED 穿过。\n2. 将剪裁的纸片覆盖在面包板上，让嘴包围传感器，并将 LED 插入孔中。按按嘴看看感觉如何。\n\n# 让我们检查代码。\n\n## 有用的常量\n\
  \n常量允许为程序中的事物赋予唯一的名称。这与变量相似，不同在于它们不能改变。为模拟输入分配名称以便于引用，并创建一个唯一的常量来存储参考温度。每超过参考温度\
  \ 2 度，LED 就会开启。温度以浮点数的形式写入并存储。浮点数是带有小数点的数字。\n\n## 串口初始化\n\n在 `setup` 中，你将与一个名为 `Serial.begin()`\
  \ 的新命令交互。此命令将启动 Arduino 和计算机之间的连接。该链接将帮助人们在计算机屏幕上从模拟输入读取值。\n\n参数 `9600` 代表 Arduino\
  \ 的通信速度。你将使用 Arduino IDE 的串口监视器来观察你选择从微控制器发送的信息。\n\n## 初始化数字引脚并将其关闭\n\n下一步是 `for()`\
  \ 循环将几个引脚设置为输出。这些引脚之前连接到了 LED。通过分配唯一的名称并使用 `pinMode()` 函数，你可以选择 `for()` 循环。\n\n\
  ## 读取传感器温度\n\n在 `loop()` 中，使用变量 `sensorVal` 保存读取。如果你想读取传感器，调用 `analogRead()`，它接受单个参数。\n\
  \n## 将传感器值传输到电脑\n\n`Serial.print()` 函数将数据从 Arduino 传输到电脑。你可以在串口监视器中检查这些信息。如果你给 `Serial.print()`\
  \ 分配引号，它将显示文本。此外，如果你使用变量作为参数，它将显示该变量的值。以下是程序的代码：\n\n![](img/00185.jpg)\n\n![](img/00106.jpg)\n\
  \n## 将传感器读取转换为电压\n\n通过一些数学知识，你可以确定引脚电压。电压范围在 0 到 5 伏之间并带有小数。你必须声明一个 `float` 变量来存储它。\n\
  \n## 上传电脑之前将电压转换为温度\n\n传感器数据表具有输出输出类似的信息。数据表是工程师为工程师设计的电子手册。根据传感器数据表，每十毫伏对应约 1 度的变化。此外，传感器可以读取低于度的温度。因此，你需要为冰点以下的值定义偏移。如果你从电压减去\
  \ 0.5 并乘以 100，即可得到真实的摄氏度温度。创建一个浮点变量并存储新数字。\n\n## 低温度时关闭 LED\n\n当你处理原始温度时，可以定义一个\
  \ `if...else` 语句来开启 LED。通过使用参考温度作为点，你将在温度超过 2 度后开启 LED。当你查看温度范围时，你会扫描一个值范围。以下是程序的后续部分。\n\
  \n![](img/00105.jpg) ![](img/00107.jpg)\n\n## 开启 LED 创建低温度\n\n`&&` 运算符在逻辑上表示“和”。它允许人们检查多个条件。\n\
  \n\n\n\n要创建一个中等温度，请打开两个 LED。\n\n当温度在基准以上二到四度之间时，该代码块将打开引脚 `3` 上的 LED。\n\n# C 语言基础与函数\n\
  \n当你编写 Arduino 程序时，了解计算机系统的工作原理是至关重要的，尽管 `C` 编程是接近机器的语言，但程序运行时某些操作的执行方式将变得清晰。为 Arduino\
  \ 工作并与其配合的仪器（如传感器和 LED）取决于特定的输入和输出。许多编程语言都具备这种能力，但 `C` 是我们的选择。\n\n主系统由称为 `CPU` 或微控制控制设备组成。在某些方面存在一些差异，我们稍后将深入探讨。在此提一下，与标准微处理器相比，微控制器可能并不强大。然而，它仍然包含输入、输出端口以及硬件功能。\n\
  \n微处理器连接到外部 `Memory`。通常，微控制器包含足够的板载内存。但需要注意的是，我们指的不是大容量；对于简单的应用程序，微控制器可能只有几百字节的内存。不要忘记一个内存字节有\
  \ `8` 位，每一位可以是真或假、高或低，以及 `I/O`。\n\n`register` 是我们可以执行逻辑数学运算的唯一。例如，如果你想对两个变量进行加法，变量的值必须移动到\
  \ `register`。\n\n# 内存映射\n\n计算机系统中的每个内存字节都有一个连接的地址。现在，如果没有地址，处理器将没有手段识别特定的内存。通常，内存地址从\
  \ `0` 开始增加。尽管我们拥有带有私有或唯一系统的特定地址，但某个地址可能并不指向外部通信的输入和输出端口。\n\n大多数时候，你会发现必要对内存进行映射。这仅仅是一个巨大的内存槽数组。有人负责开发内存映射，并将值最小的地址放置在顶部，而另一些人绘制内存映射并将最小地址分配在底部。每个地址都指向可以存储字节的地方。\n\
  \n`C` 由不同的按位操作符组成。其中包括 `AND`（与）、`XOR`（异或）、`Shift Left`（左移）、`One’s Complement`（反码）和\
  \ `Shift Right`（右移）。\n\n# 逻辑语句\n\n我们的第一个电路非常基础，它只有一个输出，且用户没有可能更改条件。当输入影响输出时，我们开始进入逻辑语句的世界。逻辑语句是你检查\
  \ `variable` 值是否超过某个阈值的有效方法。那个另一个值可以是已知量，也可以是变量量。使用逻辑语句是你控制脚本（sketches）中后续发生情况的方式。接下来，让我们看一个影响输出的类似示例。\n\
  \n在 Arduino IDE 中跟随的路径是：\n\n`File → Examples → 02.Digital → Button`\n\n注意这段代码看起来和上一个有多相似吗？我相信到现在，通过人类可读的代码，你对正在发生的事情已经有了很好的理解，但让我们拆解一下你尚未见过的新元素。\n\
  \n其中一个变量与按钮引脚有关，另一个用于按钮状态（开启或关闭）。在 `setup` 中，我们看到再次使用 `pinMode` 来初始化引脚，但这次我们的按钮引脚方向为\
  \ `INPUT`，告诉芯片将有电流流“入”而不是“出”。\n\n现在在 `loop` 中，我们进入了实际程序，第一行引入了另一个函数 `digitalRead()`，它是\
  \ `digitalWrite()` 的对应项，我们在上一个草稿中提到过后者。然而，此函数只有一个参数：要从中读取的引脚号。\n\n好了，接下来我们遇到了第一段布尔代码，即逻辑语句。这个华丽的说法意味着逻辑表达式的结果将取决于某些条件是否满足。注释已经完美地告诉了我们条件。检查按钮状态是否被按下。按下时，它应该显示\
  \ `HIGH`。该表达式是一个 `if` 语句，只有当括号中的条件为真时，该部分代码才会执行其大括号内的代码。在我们的示例中，`if (buttonState\
  \ == HIGH) {` 我们告诉编译器，当我们的变量 `buttonState` 被按下时，将执行下一对大括号 `{ }` 之间的内容。双等号意味着“是否等于它的值”。当你连续使用两个等号时，你是在要求编译器检查变量处是否记录了某个特定值。在我们的示例中，`buttonState`\
  \ 是 `HIGH` 吗，换句话说按钮按下了？当此条件为真时，将使用现在熟悉的 `digitalWrite()` 函数来打开 LED。\n\n接下来，我们看到一个带有自己大括号的\
  \ `else` 语句。`Else` 意味着如果上一个语句不成立，则将执行大括号内的代码。在我们目前的示例中，这再次使用 `digitalWrite()` 告诉芯片关闭\
  \ LED，与我们的上一段代码相同。注意，虽然这个草稿有一个 `else` 语句，但 `if` 语句并不要求提供 `else` 语句。相反，如果条件不满足，它将不运行该代码并跳过它。\n\
  \n就是这些！这就是让 LED 在按下按钮时闪烁的所有内容。好了，我们已经解决了一些简单的电路。要跟随，请打开：\n\n`File → Examples → 05.Control\
  \ → WhileStatement`\n\n这个草稿的第一部分看起来对你非常熟悉。我们正在声明需要的变量，初始化它们，并设置引脚的正确设置（输入或输出）。一旦进入程序的主循环，我们看到了第一个\
  \ while 语句。让我们现在来看它：\n\n```\nwhile (digitalRead(buttonPin) == HIGH) {\n  calibrate();\n\
  }\n```\n\n这个语句相当复杂，让我们逐个拆解。首先，while 语句意味着只要我的条件为真，就会执行大括号内的内容。那么，首先我们的条件是什么？所以，我们检查与按钮关联的引脚看它是否为高电平或按下。如果是，它将调用\
  \ `calibrate()`；这是一个用户稍后定义的函数。这意味着当程序看到 `calibrate()` 时，它将跳转到该函数的指令，执行它们，然后返回代码中的该点。\n\
  \n现在来看那个函数，因为它正被调用：\n\n```\nvoid calibrate() {\n}\n```\n\n对，所以这看起来对你可能非常熟悉。它与我们已经在使用的\
  \ `setup()` 和 `loop()` 函数极其相似。这行代码告诉编译器，你想要定义一个名为 `calibrate` 的函数，它返回 `void`，且不接受任何\
  \ `arguments`。所有这些术语到底意味着什么？首先，定义 `calibrate` 意味着如果我们在代码其他地方输入该词，编译器将搜索同名的函数，然后像我们现在这样做一样运行它的代码。至于返回\
  \ `void` 又是怎么回事？\n\n\n\n\n我们还没有真正涉及到这一点，之前只是把 `for` 循环视作理所当然，并在设置时在前面加了 `void` 单词。这种函数确实有效，但并不总是如此。当一个函数完成其大括号包含的指令时，它会将一个值返回给最初调用该函数的地方。这可以是\
  \ `void`（无返回）的形式，但也同样可以是一个整数或计算得出的数字。假设这个函数改为计算公司内员工的每周薪资。它完全可以返回一个 `float`（浮点数/小数），其中包含了这些薪资的值，供程序的其他部分使用。该函数看起来是什么样的？这里有一个实现该功能的虚构函数示例。\n\
  \n```\nfloat weeklyPay (name, hours, rate) {}\n```\n\n好了，既然它会返回一个 `float`，那么这个数字去了哪里呢？我们又如何获取它的数据？这与调用函数有关。让我们现在来看这个问题。\n\
  \n```\nemployeeEarnings = weeklyPay (employeeName, hoursWorked, payRate)\n```\n\n\
  这是我们如何调用这个员工工资的任意示例。注意我们是如何将函数 `weeklyPay()` 赋值给变量 `employeeEarnings` 的吗？在函数运行后，那个浮点数将存储在该变量中。我们可以将该变量作为之前在\
  \ `weeklyPay` 函数中进行计算的存储值。如果这对于你来说并不直观，我们将在后面的草图中更详细介绍函数。别担心，后面会有更多例子。\n\n回到我们的\
  \ `WhileStatementConditional` 示例，现在让我们分解一下 `calibrate` 正在做什么。它开启了 `indicatorLED`\
  \ 来告诉用户正在进行校准。然后，我们将位于 `sensorPin` 的传感器值存储到变量 `sensorValue` 中。接下来，我们看看这个新值是比之前记录的任何结果高还是低。我们通过\
  \ `if` 语句来实现这一点。注意这些 `if` 语句没有对应的 `else` 语句吗？我们的许多读取值可能会落在已记录的范围内，因此只有当最大或最小值更高或更低时，我们才需要记录。这些语句仅仅是在检查该条件是否为真。一旦完成所有这些操作，函数\
  \ `calibrates` 将返回 `void`，即不返回任何值。\n\n好了，在 `calibrate` 函数完成后，我们跳回代码中之前的那个，即 `while`\
  \ 语句之后。我们使用 `digitalWrite` 关闭 `indicatorLED`，因为校准已经停止。接下来，我们读取传感器并使用 `analogRead`\
  \ 检查连接到传感器的引脚，将其值赋值给 `sensorValue`。现在，下一行引入了一个我们之前没过的新函数。\n\n在 Arduino IDE 中打开：Help\
  \ → Reference\n\n将打开一个网页，其中列出了所有的关键字、布尔逻辑符号、函数以及 Arduino 为你提供的重要信息，这些都在一个快速、方便的地方。使用该资源找到\
  \ `map` 并点击它。诚然，这并不是世界上最容易理解的函数，但让我们来看看它是做什么的。描述说它将一个数字从一个范围映射到另一个范围。它接受五个参数：值、当前最小值、当前最大值、目标最小值和目标最大值。通过这些信息，它将通过数学计算将\
  \ `value` 缩放到目标范围之间的不同值，以符合我们理想的比例。\n\n在实践中，这起什么作用？在我们的传感器中，我们不知道它会返回什么值，也不真正知道数据集会落在什么范围内。我们知道的是\
  \ Arduino 芯片可以增量地改变一个引脚的输出。这个增量范围是 1 位，或者说是一个 范围 0-255。这意味着我们的传感器读取值必须在 0-255 之间，我们的芯片才能以我们希望的方式做出响应。因此，我们执行此校准程序来查看数据集中的最大、最小值以及当前值，然后将这些值缩放到\
  \ 0 到 255 之间。\n\n现在 `map` 函数说它不会更改指定范围之外的值，因为这可能有预期的用途。为了这一点，你还必须在之前或之后使用 `constraint`\
  \ 函数来对可能的取值进行限制。让我们看看下一行代码的 `constraint` 函数。这个函数要容易理解得多。它接受一个 `value`、一个最小值和一个最大值。如果\
  \ `value` 落在范围内，它将保持不变；如果超出该范围，则根据它最接近哪一个将其设置为 `min` 或 `max`。同样，Arduino 芯片处理引脚输出强度为\
  \ 0-255，因此我们将数据集限制在 0-255 之间。\n\n```\ndo {\n// 大括号之间是需要执行的某些代码\n}\nwhile ( conditional\
  \ statement);\n```\n\n这里的区别在于，该语句在 `do` 块运行之后才会检查其条件。这些 `do while` 语句用于当你需要一个 `while`\
  \ 语句，但需要内部代码至少运行一次的情况。\n\n### For 循环\n\n这对于某些事情非常有用，例如遍历序列的次数，甚至是初始化芯片上的许多引脚，正如你在这里看到的。现在，`for`\
  \ 循环有一个独特的属性，在于它们在创建时会创建它们自己的变量。它们在每次循环时也都会修改该变量。让我们来看一个空的 `for` 循环。\n\n```\nfor\
  \ (variable; condition; increment/decrement) {}\n```\n\n该变量通常是一个整数，你应该根据它的用途来命名。如果是在遍历引脚，`thisPin`\
  \ 是一个很好的名字，因为它符合逻辑。如果你正在索引一个数组（我们稍后会介绍），这个名字就没有意义。在这种情况下，变量名 `index` 可能是合适的。这里的重点是根据循环迭代所的操作或更改来命名变量。接下来是条件语句。它以布尔比较的形式存在。这里的布尔指的是\
  \ `>=`, `<=`, `==`。你将让循环将创建的变量与某个值进行比较。在我们的示例中，它是 8。\n\n最后，我们来到 `for` 循环的递增或递减部分。在\
  \ Arduino 编程语言（基于 C++）中，你可以使用 `++` 符号将变量的值增加 1，并使用 `--` 符号将变量的值减少 1。让我们现在在另一个单独的情况下来看这种情况。\n\
  \n```\nint pizzaSlices = 1// 我们只有一块披萨\npizzaSlices--// 我们吃了一块，现在 pizzaSlices 为 0\n\
  pizzaSlices++// 朋友给了我们一块；现在我们有 1 \n```\n\n希望这能澄清递增和递减的工作原理。关于 `++` 和 `--` 表示法的另一个要说明点是，它们可以放在变量名的之前或之后，其位置对\
  \ `for` 循环的结果有重要影响。如果符号在变量名之前，例如 `++thisPin`，它会在执行大括号内的代码之前更改变量。当符号放在变量名之后，例如 `thisPin++`，它会在执行完大括号内的代码后更改变量。\n\
  \n说到这里，对于 `for` 循环，非常非常重要的一点是确保它们能够终止，或根据你设置的条件结束。否则，你的程序将挂在那里，一直运行相同的代码，直到关闭电源。例如，如果你写了这样的\
  \ `for` 循环：\n\n```\nfor (int index = 2, index > 1, index ++) {\n```\n\n\n\n此 `for`\
  \ 循环中的条件将永远为真，因此它永远不会终止。如果你在理解如何终止某个 `for` 循环遇到困难，请尝试使用相反的变量变化方式，例如将递增改为递减，反之亦然。通常，通过从另一个角度处理计数过程，它可以解决你在\
  \ for 循环中遇到的任何计数问题。\n\n关于在 for 循环内部创建的变量，另一个需要了解的关键点是：它们只在 `for` 循环运行时存在。它们在 `for`\
  \ 循环期间创建，并在循环完成后释放。为什么这很重要？通常情况下你不能拥有两个同名的变量。但在这里你看到我们在代码中初始化了 `thisPin` 三次，每个对应一个独立的\
  \ `for` 循环。这是因为这些名称仍然有效，但在每个循环运行结束后，它们就不存在了。\n\n为了跟上进度，请打开：\n\nFile → Examples →\
  \ 05.Control → ForLoopIteration\n\n在这个示例（sketch）的开头，我们初始化了一个定时器变量，我们现在已经见过很多了。然后我们进入设置部分，看到了我们的第一个\
  \ `for` 循环。\n\n我们声明了一个整数变量 `thisPin`，我们将在条件语句中使用它。我们检查它的条件是否仍然为真，在完成一次循环后，它会将 `thisPin`\
  \ 加 1。\n\n好的，接下来在我们的示例代码中，我们遇到了与 `setup` 中相同的 `for` 循环，但这次我们不是将引脚设置为输出，而是让引脚在 `timer`\
  \ 持续时间内开启，在我们的案例中是 100 毫秒。\n\n这里到了一个不同的 `for` 循环，让我们现在仔细观察它：\n\n```\nfor (int thisPin\
  \ = 7; thisPin >= 2; thisPin--) {\n```\n\n再次，我们的变量是 `thisPin`，它初始化为七。这次的条件是当 `thisPin`\
  \ 小于或等于二。此外，这次我们使用了递减，所以我们将从 7 倒数到该引脚到达 2。现在当你运行这个电路时，LED 将按反序点亮，因为我们正在以相反的方向运行\
  \ `for` 循环。此外，注意这个 `for` 循环有一个会终止的条件语句，我真的无法强调这一点有多重要。其余部分是我们之前看到的相同代码，用于在 `timer`\
  \ 持续时间内点亮 LED。\n\n接下来，让我们来讨论数组，看看它们如何与 for 循环相关。\n\n### 数组\n\n在查看 Arduino IDE 中的任何代码之前，我们先聊聊什么是数组。如果你熟悉数学，你可能以前见过这种东西，但可能被称为“矩阵”（matrix）。正如你所知，矩阵和数组是以组合在一个公共变量下的信息组的形式运行的。假设我们有一组东西，比如名字，想要跟踪它们。了解哪个名字属于哪个类别——例如，给定两个班级的学生，我们可以假设\
  \ A 班的所有名字都属于 A 类，B 班的所有名字都属于 B 类——决定了将每个名字存放在哪个数组中。但是，为了方便起见，我们假设每个名字都是一个变量，受其所在矩阵或数组的限制。我们可以为每个名字创建单独的变量，但这会让记录这些信息变得繁琐且难以跟踪。\n\
  \n```\ndatatype variableName[] = {}\n```\n\n在这里，这种数据类型可以是你已经看到的任何变量类型，如 `int`、`float`、`name`\
  \ 等。变量名应该使用你已经见过的与其他变量相同的命名规范。现在我们看到了一组还没有遇到过的新符号：方括号。\n\n方括号是用来区分这是一个数据数组的方式。在这些方括号内，你可以分配与你放入方括号中的数字相等的不同变量。这意味着你可以拥有相应数量的独立信息块。\n\
  \n假设我们在引脚上 true 5 个 LED：分别是 2, 7, 4, 6, 5 和 3，我们希望按照这个顺序引用它们。我们可以将其写成一个数组。\n\n```\n\
  name ledPins[5] = {2, 7, 4, 6, 5};\n```\n\n在这里，我们告诉编译器留出五个名称变量，并通过直接提供这些名称来初始化数组。那么，我们如何访问数组中的\
  \ 2 号引脚呢？Arduino 使用所谓的“零索引”（zero indexing），这意味着当你在访问数组的元素（数据）时，始终从 0 开始。因此，我们这样访问\
  \ 2 号引脚：\n\n```\nledPins[0]\n```\n\n尽管这听起来可能违背直觉，但程序中使用零索引有一些实用的原因。所以，如果 2 号引脚的索引是\
  \ 0（方括号中的数字被称为索引），那么 7 号引脚就是 1，4 号引脚是 2，6 号引脚是 3，5 号引脚是 4。这需要一些时间你才能习惯，当你无法访问正确元素并忘记零索引时，你可能需要回到这里。\n\
  \n所以，使用数组内数据的一个基本示例将是：\n\n```\ndigitalWrite(ledPins[0], HIGH);  // 开启 2 号引脚\n```\n\
  \n我们也可以声明一个数组而不立即向其中放入数据，而是稍后决定初始化它。让我们使用：\n\n```\nint ledPins[6];\nledPins[0] =\
  \ 2;\nledPins[1] = 7;\nledPins[2] = 4;\nledPins[3] = 6;\nledPins[4] = 5;\nledPins[5]\
  \ = 3;\n```\n\n我们也可以在不指定大小的情况下声明数组：\n\n```\nint ledPins[] = {2, 7, 4, 6, 5};\n```\n\
