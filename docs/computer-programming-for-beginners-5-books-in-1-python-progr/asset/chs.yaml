  \ 脚本\n\n现在，该你下载以下 DML 脚本，以便为 `Company_Db` 数据库填充数据。再次，请确保你已正确完成了之前的练习，否则脚本将无法运行。\n\
  \n这些数据将用于“数据转换”章节中的后续练习。因此，请记住，除非另有说明，每个练习指的都是 `Company_Db` 数据库。\n\n# 第 6 章：数据库管理\n\
  \n“法律过于宽泛则很少被遵守；过于严厉则很少被执行。” – 本杰明·富兰克林\n\n为了开启成为数据库管理员、数据库开发人员甚至数据分析师的道路，你需要了解如何对数据库进行备份、恢复和管理。这些是维护数据库的核心组成部分，也是非常重要的职责。\n\
  \n### 恢复模型\n\nSQL Server 中的每个数据库都可以使用几种不同的恢复模型。恢复模型是数据库的一种选项或模型，它决定了可以进行备份和恢复的类型类型。\n\
  \n根据你的实际情况（例如，你无法承受丢失关键数据的风险，或者你想镜像生产环境），你可以将恢复模型设置为你所需的模式。此外，请记住，你选择的恢复模型还会影响备份或恢复数据库及日志的时间，取决于它们的大小。\n\
  \n以下是各种恢复模型及其简要说明。每个模型末尾的 SQL 语句示例是你用于设置恢复模型的代码。\n\n#### 完整 (Full)\n\n该模型涵盖数据库中的所有数据，以及事务日志历史。\n\
  \n在使用此模型并执行数据库恢复时，它提供“点点”恢复能力。这意味着，如果在恢复过程中某个时间点丢失了数据（例如），它允许你回滚并恢复该数据。\n\n如果你无法承受任何数据的丢失，那么这就是你理想的恢复模型。\n\
  \n根据数据的大小，备份和恢复可能需要更多时间。\n\n* 可以执行完整备份、差异备份和事务日志备份。\n\n```sql\nALTER DATABASE DatabaseName\
  \ SET RECOVERY FULL\n```\n\n#### 简单 (Simple)\n\n该模型也涵盖数据库中的所有数据，但它会回收事务日志。当数据库被恢复时，事务日志将为空，并从现在开始记录新的活动。\n\
  \n与“完整”恢复模型不同，事务日志将被重用于新事务，因此，如果数据意外丢失或删除，将无法通过回滚来恢复。\n\n如果你有一个空白服务器，并且需要快速简单地恢复数据库，或者只是为了镜像另一个环境并将其作为测试实例，这是一个极佳的选择。\n\
  \n* 只能执行完整备份和差异备份，因为根据此恢复模型，事务日志会被回收。\n\n```sql\nALTER DATABASE DatabaseName SET\
  \ RECOVERY SIMPLE\n```\n\n#### 批量日志记录 (Bulk Logged)\n\n这种特殊模型通过跳过 SQL Server 中的批量操作（如\
  \ `BULK INSERT`、`SELECT INTO` 等）来工作，并且不在事务日志中存储这些操作。这将释放你的事务日志，并在备份和恢复过程中使其更容易、更快速。\n\
  \n使用这种方法，你仍然可以使用“点点”恢复，因为它的工作方式类似于“完整”恢复模型。\n\n如果数据对你非常重要，且你的数据库进程经常使用批量语句，这种恢复模型是理想的。但如果你的数据库并不经常使用批量语句，建议使用“完整”恢复模型。\n\
  \n* 可以执行完整备份、差异备份和事务日志备份。\n\n```sql\nALTER DATABASE DatabaseName SET RECOVERY BULK_LOGGED\n\
  ```\n\n假设你正处于一个大型数据库项目中并需要备份数据库。使用 SQL 语法（以及上面的示例）将 `Company_Db` 的恢复模型设置为“完整”，为备份过程做好准备。\n\
  \n### 数据库备份方法\n\nSQL Server 中有几种主要的备份方法可以备份数据库，每种方法都取决于所使用的恢复模型。在之前关于恢复模型的章节中，每个模型的最后一个项目符号都讨论了可以执行的备份类型，即完整、差异和事务日志备份。\n\
  \n注意：如果你不记得每个恢复模型可以执行的备份类型，请给自己留一点时间！你会记住它们的！\n\n每种备份方法将执行以下操作：\n\n**完整 (Full)：**\n\
  备份整个数据库以及事务日志（如果适用）。\n如果需要将相同的数据库添加到新服务器进行测试，这是最理想的。\n如果数据库规模很大，除了备份整个数据库和事务日志外，可能需要更长时间的。\n\
  * 然而，由于你备份的是整个数据库，其执行频率不需要像差异备份那样频繁。\n\n```sql\nBACKUP DATABASE DatabaseName TO\
  \ DISK = 'C:\\SQLBackups\\DatabaseName.BAK'\n```\n\n**差异 (Differential)：**\n它依赖于完整备份，因此必须先执行完整备份。然而，它将备份上一次完整备份到差异备份执行之间的任何数据更改。\n\
  在任何情况下都是理想的，但由于数据库中频繁添加新数据，必须更频繁地执行。\n它比完整备份快得多，占用的存储空间也小。\n* 然而，它没有捕获整个数据库，这就是它必须定期执行的原因。\n\
  \n```sql\nBACKUP DATABASE DatabaseName TO DISK = 'C:\\SQLBackups\\DatabaseName.BAK'\
  \ WITH DIFFERENTIAL\n```\n\n**事务日志 (Transaction Log)：**\n类似于差异备份，它依赖于完整备份。\n备份数据库中发生的所有活动。\n\
  在某些情况下是有用且必要的，例如恢复数据库时。\n由于它们存储了数据库内的活动，频繁备份是明智的。\n* 因此，如果数据库活动较少且频繁备份，日志的备份和恢复会很快。\n\
  \n```sql\nBACKUP LOG DatabaseName TO DISK = 'C:\\SQLBackups\\DatabaseName.TRN'\n\
  ```\n\n在上一个练习中，你将 `Company_Db` 的恢复模型设置为“完整”。现在在这个练习中，你要备份数据库。\n\n首先，使用完整备份方法备份数据库。\n\
  \n接下来，删除 `Sales.Product_Sales` 表中的所有数据（模拟数据丢失）。\n\n最后，查询你刚刚删除数据的表以确保数据已不存在。稍后，我们将恢复数据库并确保数据回到\
  \ `Sales.Product_Sales` 表。\n\n### 数据库恢复\n\n在数据库领域，你可能会听到恢复数据库最重要的部分是使用可靠的备份。这完全正确！这就是为什么确保你使用正确的恢复模型非常重要。\n\
  \n#### 准备恢复数据库\n\n需要注意的一点是，`.bak` 文件通常包含文件组或其中的文件。每个文件可能是完整备份或差异备份。知道你正在恢复的是哪一个是重要的，但你也可以指定想要恢复哪些文件。然而，如果你不指定，SQL\
  \ Server 将选择默认文件，即 1。这是一个典型的完整备份。\n\n首先，使用 `RESTORE HEADERONLY` 来识别 `.BAK` 文件中的文件。这是你在恢复数据库之前应该执行的操作。\n\
  \n```sql\n--查看数据库备份文件\nRESTORE HEADERONLY FROM DISK = 'C:\\SQLBackups\\DatabaseName.BAK'\n\
  ```\n\n\n\n\n一旦运行了上述查询，请查找 `BackupType` 列中的数字。`1` 表示全备份，而 `5` 表示差异备份。\n\n此外，你需要使用的文件编号位于\
  \ `Position` 列中。在下例中，请注意文件编号 `8` 是全备份，文件编号 `9` 是差异备份。\n\n![](img/00109.jpg)\n\n\
  此外，你必须先使用 `master` 数据库，然后将目标数据库设置为非活动状态（`SINGLE_USER`），以便在还原之前只允许一个打开的连接到该数据库。\n\
  \n在下方的语法中，`WITH ROLLBACK IMMEDIATE` 意味着任何未完成的事务都将回滚（不完成），以便将数据库设置为单连接的打开状态。\n\n\
  ```sql\n-- 将数据库设置为仅允许一个打开的连接\n-- 必须关闭到该数据库的所有其他连接，否则还原将失败\nALTER DATABASE DatabaseName\
  \ SET SINGLE_USER WITH ROLLBACK IMMEDIATE\n```\n\n一旦还原完成，你可以像下面所示将数据库设回活动状态（`MULTI_USER`）。此状态允许多个用户连接到数据库，而不仅仅是一个用户。\n\
  \n```sql\n-- 将数据库设置为允许多个连接\nALTER DATABASE DatabaseName SET MULTI_USER\n```\n\n\
  ## 数据库还原类型\n\n以下是根据你的情况/需求可以执行的还原类型概述。\n\n### 全还原 (Full Restore)\n\n还原整个数据库，包括其文件。\n\
  \n如果数据库已存在，则使用 `WITH REPLACE` 选项覆盖数据库。\n\n如果恢复模型设置为 `Full`，则你需要使用 `WITH REPLACE`\
  \ 选项。\n\n使用 `FILE =` 参数选择你想要还原的文件（可以是全备份或差异备份文件）。\n\n如果恢复模型设置为 `Simple`，则不需要 `WITH\
  \ REPLACE` 选项。\n\n如果数据库不存在，它将创建该数据库，包括其文件和数据。\n\n从 `.BAK` 文件还原。\n\n```sql\n-- 如果恢复模型设置为\
  \ Full - 同时也选择了备份集中的 1 号文件\nRESTORE DATABASE DatabaseName FROM DISK = 'C:\\SQLBackups\\\
  DatabaseName.BAK' WITH FILE = 1, REPLACE\n\n-- 如果恢复模型设置为 Simple\nRESTORE DATABASE\
  \ DatabaseName FROM DISK = 'C:\\SQLBackups\\DatabaseName.BAK'\n```\n\n### 差异还原 (Differential\
  \ Restore)\n\n使用 `RESTORE HEADERONLY` 查看你可用的备份文件，即全备份和差异备份文件类型。\n\n你必须先使用 `NORECOVERY\
  \ OPTION` 对 `.BAK` 文件执行全还原，因为 `NORECOVERY` 选项表示其他文件也需要还原。\n\n一旦你指定了要还原的全备份文件并使用\
  \ `WITH NORECOVERY`，你就可以还原差异备份。\n\n最后，你应该在最后一次差异文件还原中包含 `RECOVERY` 选项，以表示没有更多文件需要还原。\n\
  \n作为参考，下方的语法使用了之前 `RESTORE HEADERONLY` 截图中的文件。\n\n```sql\n-- 先对全数据库备份文件执行还原\nRESTORE\
  \ DATABASE DatabaseName FROM DISK = 'C:\\SQLBackups\\DatabaseName.BAK' WITH FILE\
  \ = 8, NORECOVERY\n\n-- 现在对差异备份文件执行还原\nRESTORE DATABASE DatabaseName FROM DISK =\
  \ 'C:\\SQLBackups\\DatabaseName.BAK' WITH FILE = 9, RECOVERY\n```\n\n### 日志还原 (Log\
  \ Restore)\n\n这是执行彻底数据库还原的最后一步。\n\n你必须先还原数据库的 `Full` 或 `Differential` 副本，然后还原日志。\n\
  \n*   最后，在还原数据库备份时必须使用 `NORECOVERY` 选项，以便你的数据库保持在还原状态，并允许你还原事务日志。\n\n由于你已经对数据库进行了备份，并且在\
  \ `Sales.Product_Sales` 表中“丢失”了数据，现在是时候完全还原数据库了。\n\n为了实现这一点，你首先需要使用 `master` 数据库，然后将你的数据库设置为单用户状态，执行还原，最后将其设回多用户状态。\n\
  \n一旦还原了数据库，请从 `Sales.Product_Sales` 表中检索所有数据，以验证数据再次存在。\n\n## 挂载和分离数据库 (Attaching\
  \ and Detaching Databases)\n\n如你所知，由于你已经学习过这部分，挂载和分离数据库的方法与备份和还原类似。\n\n基本上，该方法的详细信息如下：\n\
  \n*   允许你将 `.MDF` 文件和 `.LDF` 文件复制到新的磁盘或服务器上。\n*   执行类似于备份和还原的过程，但根据情况，有时可能会更快。\n\
  *   数据库将离线状态，任何用户或应用程序都无法访问。在重新挂载之前，它将保持离线状态。\n\n所以，你应该选择哪一个？虽然备份是理想选择，但在某些情况下，挂载/分离数据库可能是你的唯一选择。\n\
  \n考虑以下场景：\n\n*   你的数据库包含许多文件组。挂载这些可能会非常繁琐。\n*   最佳解决方案是备份数据库然后将其还原到目标地，因为它在备份过程中会将所有文件分在一起。\n\
  *   根据数据库的大小，备份/还原过程需要很长时间。但是如果需要尽快使用，数据库的挂载/分离可能会快得多。\n    *   在这种情况下，你可以将数据库离线，将其分离，然后挂载到新位置。\n\
  \n如你所知，在执行挂载方法时有两个主要的文件组。这些文件是 `.MDF` 和 `.LDF`。`.MDF` 文件是数据库的主数据文件，存储结构和数据。`.LDF`\
  \ 文件存储事务活动。\n\n然而，备份数据库时创建的 `.BAK` 文件会将文件分组。在使用任何选项之前请考虑你的情况，但也将备份和还原作为你的首选。\n\n\
  ## 挂载和分离数据库\n\n由于你已经挂载了该数据库，现在让我们将其从服务器上分离。之后，你将使用 SQL 语法重新挂载它。\n\n### 分离数据库\n\n\
  在 SQL Server 中，有一个存储过程可以为你分离数据库。该特定的存储过程位于 `master` 数据库中。在底层，可以通过以下操作查看该存储过程的复杂性：\n\
  \n1.  点击展开数据库 (Databases)文件夹\n2.  点击系统数据库 (System Databases)，然后点击主数据库 (Master)\n\
  3.  点击可编程性 (Programmability)\n4.  点击存储过程 (Stored Procedures)，然后点击系统存储过程 (System\
  \ Stored Procedures)\n5.  找到 `sys.sp_detach_db`，右键点击并在 SSMS 中选择“修改”(Modify)。你将看到它的语法。\n\
  \n对于此，直接执行该存储过程即可：\n\n```sql\nUSE master\nGO\nALTER DATABASE DatabaseName SET SINGLE_USER\
  \ WITH ROLLBACK IMMEDIATE\nGO\nEXEC master.dbo.sp_detach_db @dbname = N'DatabaseName',\
  \ @skipchecks = 'false'\nGO\n```\n\n进一步解释一下，你想使用 `master` 数据库将要分离的数据库设置为单用户而不是多用户。\n\
  \n最后，`@dbname` 后面的值允许你指定要分离的数据库名称，而 `@skipchecks` 设置为 `false` 意味着数据库引擎将更新统计信息，标识出数据库已分离。在分离数据库时，将其设置为\
  \ `false` 是理想的。\n\n### 挂载数据库\n\n一旦你分离了数据库，如果你导航到数据目录所在，你会发现 `AdventureWorks2012_Data.MDF`\
  \ 文件仍然存在——它确实应该，因为你只是分离了它而没有删除它。\n\n\n\n\n\n接下来，获取 `.MDF` 文件的路径并将其复制粘贴到你可以轻松访问的地方，例如记事本中。\n\
  \n我的路径是 `C:\\Program Files\\Microsoft SQL Server\\MSSQL13.MSSQLSERVER\\MSSQL\\DATA`。\n\
  \n一旦你连接到实例并打开了新的查询会话，你只需要使用数据文件存储的路径。获取该路径后，你可以在下面的 SQL 语法示例中输入该值以挂载数据库。\n\n以下是用于挂载数据库文件日志文件的语法。在接下来的练习中，你将完全跳过挂载日志文件，因为你并没有挂载到新服务器。因此，你可以省略挂载日志语句。\n\
  \n```sql\nCREATE DATABASE DatabaseName ON (FILENAME = 'C:\\SQL Data Files\\DatabaseName.mdf'),\
  \ (FILENAME = 'C:\\SQL Data Files\\DatabaseName_log.ldf') FOR ATTACH\n```\n\n在上面的示例中，如果有日志文件，我调用了挂载它的语句。但是，如果你没有\
  \ `.LDF` 文件而只有 `.MDF` 文件，也没关系。你只需要挂载 `.MDF` 文件，数据库引擎将创建一个新的日志文件并开始在该特定日志中写入活动。\n\
  \n对于这个练习，假设你已经从旧服务器上分离了此数据库，并准备将其挂载到新服务器上。请使用上面的语法作为示例来挂载 AdventureWorks2012 数据库。\n\
  \n每个练习在你开始应用每个章节中学到的知识之前，都会提供一个概述以及示例。\n\n下面是你将在接下来的几个练习中使用的 `Production.Product`\
  \ 表的示例。\n\n| Product ID | Name | Product Number | Color | Standard Cost | List Price\
  \ | Size |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 317 | LL Crankarm\
  \ | CA-5965 | Black | 0 | 0 | NULL |\n| 318 | ML Crankarm | CA-6738 | Black | 0\
  \ | 0 | NULL |\n| 319 | HL Crankarm | CA-7457 | Black | 0 | 0 | NULL |\n| 320 |\
  \ Chainring Bolts | CB-2903 | Silver | 0 | 0 | NULL |\n| 321 | Chainring Nut | CN-6137\
  \ | Silver | 0 | 0 | NULL |\n\n## 查询结构和 SELECT 语句\n\n理解语法和其结构对你将来非常有帮助。让我们深入研究最常用语句之一——`SELECT`\
  \ 语句，它专门用于检索数据。\n\n```sql\nSELECT Column_Name1, Column_Name2\nFROM Table_Name\n\
  ```\n\n在上面的查询中，你选择了从整个表中的两个列和所有行。由于你只选择了两列，该查询的执行速度会比你像这样选择所有列快得多：\n\n```sql\nSELECT\
  \ *\nFROM Table_Name\n```\n\n从 `Production.Product` 表中选择所有列。\n\n使用相同的表，仅选择 `ProductID`、`Name`、`Product\
  \ Number`、`Color` 和 `Safety Stock Level` 列。\n\n（提示：表中的列名不包含空格！）\n\n### WHERE 子句\n\
  \n`WHERE` 子句用于过滤查询返回的行数。该子句通过使用条件工作，例如某列是否等于、大于、小于、之间或类似于某个值。\n\n在编写语法时，记住 `WHERE`\
  \ 条件位于 `FROM` 语句之后。\n\n**EQUALS（等于）** – 这用于查找精确匹配。下面的语法使用 `WHERE` 子句匹配包含精确字符串 'Value'\
  \ 的列。注意，字符串需要单引号括起来，而数值值不需要。\n\n```sql\nSELECT Column_Name1, Column_Name2\nFROM\
  \ Table_Name\nWHERE Column_Name3 = 'Value'\n```\n\n**BETWEEN（之间）** – 通常用于查找某些数字范围或日期范围之间的值。需要注意的是，`BETWEEN`\
  \ 比较运算符中的第一个值应该小于右侧的值。请注意下面比较 10 和 100 的示例。\n\n```sql\nSELECT Column_Name1, Column_Name2\n\
  FROM Table_Name\nWHERE Column_Name3 BETWEEN 10 AND 100\n```\n\n**GREATER THAN（大于）,\
  \ LESS THAN（小于）, LESS THAN OR EQUAL TO（小于或等于）, GREATER THAN OR EQUAL TO（大于或等于）**\
  \ – SQL Server 提供了你可以使用的比较运算符来比较某些值。\n\n```sql\nSELECT Column_Name1, Column_Name2\n\
  FROM Table_Name\nWHERE Column_Name3 =< 1000 --注意你也可以使用 <, >, >= 甚至 <> 表示不等于\n```\n\
  \n**LIKE（匹配）** – 这用于查找精确匹配。下面的语法使用 `WHERE` 子句匹配包含精确字符串 'Value' 的列。注意，字符串需要单引号括起来，而数值值不需要。\n\
  \n```sql\nSELECT Column_Name1, Column_Name2\nFROM Table_Name\nWHERE Column_Name3\
  \ LIKE 'Value'\n```\n\n\n\n\n用户 A 可能会注意到客户的姓氏错误，并着修改姓名，在修改后立即保存数据。用户 B 可能正在处理客户数据的其他部分，例如客户的地址或电话号码。然而，用户\
  \ A 的更改可能不会反映在用户 B 侧。用户 B 可能仍在使用旧的、错误的姓氏处理客户数据，在保存数据时无意中将姓氏更改为错误的条目。\n\n现在，两名用户都不知道他们工作中的不一致之处，这个问题可能很长一段时间都不会被注意到。当考虑到只发生了一个错误时，这似乎是微不足道的。然而，想象一下这些情况随着时间的推移不断发生，在大量数据上产生不一致之处。等时机到来，你将不得不检查你拥有的所有数据。如果你的数据库很大，这可能会花费你大量的时间。\n\
  \n通过 SQL 事务，连续的动作或更改不会影响另一个用户所看到的数据的有效性。SQL 事务赋予你提交（commit）SQL 语句的能力，这会将这些语句应用于数据库。或者，你还拥有回滚（rollback）的能力，这将从数据库中撤销语句。\n\
  \n在 SQL 事务中，如果一个操作成功通过了四个特征（由缩写 `ACID` 表示），该操作将转换为一个事务。\n\n### 原子性 (Atomic)\n该属性关注事务的“全有或全无”原则。它确保了事务中所有操作的性能。如果某个操作在某一点失败，整个事务将被终止。此外，如果只执行了几条语句，事务将回滚到之前的状态。要成功完成事务并将其数据库，所有操作都应该是正确的，且没有任何缺失。\n\
  \n### 一致性 (Consistent)\n通过该属性，数据库不仅在事务开始时必须保持一致，在完成后也必须保持一致。因此，如果一组操作导致在执行过程的任何点更改了一致性，那么事务将恢复到其原始状态。\n\
  \n### 隔离性 (Isolated)\n当特定事务发生时，数据可能是不一致的。这种不一致性可能会影响数据库，因此在事务完成之前，数据将不可供其他操作使用。它将不受任何外部影响。换句话说，它是被隔离的。此外，其他其他事务不能以任何方式影响或干扰被隔离的事务，从而确保完整性不受损害。\n\
  \n### 持久性 (Durable)\n当所有事务完成后，任何更改或修改都必须保留并维护。在发生硬件或应用程序错误的情况下，不应丢失数据；它应该是可靠且一致可用的。这一特性确保了在发生此类情况下你的数据仍然可用。\n\
  \n必须注意到的是，在任何时候，无论操作是完成还是回滚，事务都维护着数据库的完整性。\n\n### 事务命令\n有七种命令可以管理事务。这些命令是：\n\n-\
  \ `COMMIT`: 保存更改并提交到数据库。\n- `ROLLBACK`: 将更改回滚到特定的 `SAVEPOINT`（保存点）或事务的开始。更改不会应用于数据库。\n\
  - `SAVEPOINT`: 在事务中创建一个保存点——一种标记形式。当你执行 `ROLLBACK` 时，你可以到达该点而不是事务的开始处。\n- `RELEASE\
  \ SAVEPOINT`: 移除或释放保存点。在此命令之后，任何 `ROLLBACK` 将把事务回滚到原始状态。\n- `SET TRANSACTION`: 为特定事务的执行创建特征。\n\
  - `START TRANSACTION`: 设置事务的特征并开始事务。\n- `SET CONSTRAINTS`: 在事务中建立约束模式。约束会创建一个条件，该决策决定是在开始修改数据时立即应用约束，还是延迟约束的应用直到事务完成。\n\
  \n### 示例\n重要的是，当你准备开始事务时，数据库处于其原始状态。在这种状态下，你可以预期数据是一致的。一旦你执行了事务，这些事务中的 SQL 语句就会开始处理。如果处理成功，则使用\
  \ `COMMIT` 命令。该命令导致 SQL 语句更新数据库并结束事务。如果更新过程未成功，则 `ROLLBACK` 命令派上用。这个过程让你对命令有一个简要的概述。然而，我们将深入探讨它们的功能。\n\
  \n#### 提交 (Commit)\n当特定事务中的所有语句都完成后，下一步就是终止事务。终止事务的推荐方法之一是将目前为止所做的所有更改提交到数据库。当你对目前为止执行的更改有信心时，就可以利用\
  \ `COMMIT` 命令。参见下文可用于提交语句的语法语句：\n\n```\nCOMMIT [WORK] [AND CHAIN]\nCOMMIT [WORK]\
  \ [AND NO CHAIN]\n```\n\n你必须记住，`WORK` 条目的用法不是强制的。仅 `COMMIT` 关键字就足够处理 `COMMIT` 命令了。实际上，`COMMIT`\
  \ 和 `COMMIT WORK` 条目具有相同的目的。早期版本的 SQL 曾包含 `WORK` 关键字，某些用户可能对其更熟悉。然而，如果你不习惯它的用法，则无需包含它来执行\
  \ `COMMIT` 命令。\n\n`AND CHAIN` 语句是 `COMMIT` 语句中的另一个可选包含项。它在 SQL 实现中不是一个常用的语句。`AND\
  \ CHAIN` 子句简单地告诉系统在当前事务结束时立即开始新事务。有了这个子句，你将不需要使用 `SET TRANSACTION` 或 `START TRANSACTION`\
  \ 语句，将工作留给系统继续执行。\n\n\n\n通过使用 `ROLLBACK`，你撤销目前为止执行的所有语句，可以将它们恢复到特定的保存点（savepoint）——如果你已经建立了该保存点——或者将它们发送回事务的开头。\n\
  \n让我们来看 `ROLLBACK` 语句的一些参数或包含项：\n\n```\nROLLBACK [WORK] [AND CHAIN]\nROLLBACK [WORK]\
  \ [AND NO CHAIN]\n```\n\n当用户对数据进行更改但不使用 `COMMIT` 语句时，这些更改将存储在一种称为事务日志的临时格式中。用户可以查看这些未保存的数据，对其进行分析以检查其是否符合特定要求。如果更改没有达到用户想要的结果，他们可以执行\
  \ `ROLLBACK`，确保数据不被保存，并重新进行处理。\n\n用户还可以使用 `ROLLBACK` 功能在发生硬件故障或应用程序崩溃时将数据库发送到保存点或事务开头。如果断电中断了你的工作，那么只要系统重启，`ROLLBACK`\
  \ 功能将回顾所有待处理的事务并回滚所有语句。\n\n与 `COMMIT` 语句不同，`ROLLBACK` 具有包含 `TO SAVEPOINT` 参数的选项。使用\
  \ `TO SAVEPOINT` 子句时，系统不会取消事务。你只会被带回到一个特定的点，从那里你可以继续你的工作。\n\n如果你想取消事务，只需从你的语句中删除\
  \ `TO STATEMENT` 参数即可。\n\n这里有一个 `ROLLBACK` 语句最基本形式的示例：\n\n```\nROLLBACK;\n```\n\n\
  注意，我们没有使用 `AND CHAIN` 参数。这是因为如之前在 `COMMIT` 命令部分中提到的，系统默认使用 `AND NO CHAIN` 命令。或者，如果你想在当前事务结束后启动一个新事务，可以使用\
  \ `AND CHAIN` 命令。但是，请记住，你不能同时使用 `TO SAVEPOINT` 和 `AND CHAIN` 参数。这是因为 `TO SAVEPOINT`\
  \ 命令需要终止当前事务。\n\n在包含 `TO SAVEPOINT` 参数时，请确保添加了保存点的名称。下文是此过程的示例：\n\n```\nROLLBACK\
  \ TO SAVEPOINT;\n```\n\n`SAVEPOINT` 值将被替换为保存点的名称，如下例所示所示：\n\n```\nBEGIN\nSELECT\
  \ customer_number, customer_lastname, purchases\n> DELETE FROM customer_number WHERE\
  \ purchases < 10000;\n> SAVEPOINT section_1;\n> ROLLBACK TO section_1;\nEND;\n```\n\
  \n虽然上面的示例是命令的一种非常简单的形式，但它的目的是让你明确 `SAVEPOINT` 的用法和命名。请注意，你可以在 `SAVEPOINT` 命令和 `ROLLBACK`\
  \ 子句之间输入任意数量参数。\n\n如果你指定了保存点名称，那么回滚命令将带你回到那个特定的保存点，无论中间是否存在其他保存点。\n\n```\nBEGIN\n\
  SELECT customer_number, customer_lastname, purchases\nDELETE FROM customer_number\
  \ WHERE purchases < 10000;\nSAVEPOINT section_1;\nSAVEPOINT section_2;\nSAVEPOINT\
  \ section_3;\nSAVEPOINT section_4;\nROLLBACK TO section_1;\nEND;\n```\n\n注意，尽管你有命名为\
  \ `section_2` 到 `section_4` 的 `SAVEPOINTS`，但你仍然要求系统回滚到 `section_1`。这样做，系统将忽略所有其他保存点。\n\
  \n### 保存点 (Savepoint)\n\n既然谈到了保存点，让我们来看看这些命令为什么重要，以及如何使用它们。\n\n从本质上，你将处理一组复杂的事务。为了更容易理解事务，你把不同的部分分组为单元。这种拆分事务的方法允许你轻松地识别问题，并知道应该到达哪个部分来解决问题。\n\
  \n但问题随之产生：如何在不更改整个事务的情况下到达这些部分呢？\n\n当然，你使用 `SAVEPOINT` 命令！\n\n此时，你应该注意一个重要的一点。MySQL\
  \ 和 Oracle 支持 `SAVEPOINT` 参数，但如果你正在使用 SQL Server，你可能正在使用 `SAVE TRANSACTION` 查询。然而，`SAVEPOINT`\
  \ 和 `SAVE TRANSACTION` 参数的功能是相同的。\n\n让我们来看一个示例来理解保存点功能是如何工作的。\n\n- **步骤 1**: 启动事务\n\
  - **步骤 2**: SQL 语句\n- **步骤 3**: 如果 SQL 语句执行成功，则开始执行。如果 SQL 语句执行失败，则回滚到事务开头\n- **步骤\
  \ 4**: 进入 `SAVEPOINT 1`\n- **步骤 5**: SQL 语句\n- **步骤 6**: 如果 SQL 语句执行成功，则开始执行。如果\
  \ SQL 语句执行失败，则回滚到 `SAVEPOINT 1`\n- **步骤 7**: 进入 `SAVEPOINT 2`\n- **步骤 8**: SQL 语句\n\
  - **步骤 9**: 如果 SQL 语句执行成功，则开始执行。如果 SQL 语句执行失败，则回滚到 `SAVEPOINT 2`\n- **步骤 10**: `COMMIT`\n\
  \n在上面的示例中，我们在处理 SQL 语句后设置了保存点。当我们执行此例程时，在跳转到下一个语句之前开始处理特定的 SQL 语句。这确保了我们正确执行了所有语句，如果语句出现错误，我们可以重新处理它们。一旦系统认为语句完全成功，我们就可以使用保存点并继续后续。这种方法让你在不担心其他操作的情况下，处理一组操作。\n\
  \n这种方式，创建保存点的过程非常简单。你只需使用以下命令：\n\nSAVEPOINT <保存点名称>\n\n`SECTION_1` 是示例中的名称。\n\n\
  ### 释放保存点 (Release savepoint)\n\n在事务中完成某些操作后，你可能不再需要建立的保存点。为了移除它们，你可以使用 `RELEASE\
  \ SAVEPOINT` 命令。\n\n然而，请注意，一旦释放了保存点，你将无法再次回滚它。这就是为什么释放保存点的理想方式是检查你对工作是否满意。尽职调查可能是一项额外任务，但它将让你有信心完成工作。\n\
  \n要释放保存点，只需输入以下命令：\n\nRELEASE SAVEPOINT <保存点名称>\n\n让我们来看一个示例，你有以下保存点：\n\n```\nSAVEPOINT\
  \ section_1;\nSAVEPOINT section_2;\nSAVEPOINT section_3;\nSAVEPOINT section_4;\n\
  ```\n\n为了释放所有这些，你必须指定每一个。因此，过程如下：\n\n```\nRELEASE SAVEPOINT section_1;\nRELEASE\
  \ SAVEPOINT section_2;\nRELEASE SAVEPOINT section_3;\nRELEASE SAVEPOINT section_4;\n\
  ```\n\n你可以一次性释放所有保存点，也可以选择释放其中一个而保留其他的。这是可以接受的。你只需要确保使用正确的保存点名称。另一个需要记住的是，你不需要按照创建保存点的顺序使用释放命令。你可以随时以任何顺序释放任何保存点。\n\
  \n### 设置事务 (Set Transaction)\n\n此命令允许你处理事务的不同属性。这些可能是以下内容之一：\n\n*   只读 (Read Only)\n\
  *   读写 (Read Write)\n*   指定隔离级别\n*   将其附加到回滚属性\n\n`SET TRANSACTION` 操作的任何影响只影响你的事务。其他用户在他们的端不会察觉到任何变化。\n\
  \n你可以使用以下命令建立 `SET TRANSACTION`：\n\n```\nSET TRANSACTION <模式>\n```\n\n在上述命令中，`<模式>`\
  \ 指你想要指定的选项类型。你可以在 `SET TRANSACTION` 中使用三种模式。这些是：\n\n\n\n\n* 访问级别 (Access Level)\n\
  * 隔离级别 (Isolation Level)\n* 诊断大小 (Diagnostics Size)\n\n你可以将多个事务模式添加到 `<mode>` 占位符中。如果你这样做，请用逗号分隔不同的模式。但是你不能重复同一个模式。\n\
  \n示例：你可以包含一个隔离级别并处理诊断大小。但是，你不能包含两个诊断大小模式。\n\n现在让我们尝试单独查看每个模式。\n\n## 访问级别 (Access\
  \ Level)\n\n在 `SET TRANSACTION` 中，有两种访问级别：`READ ONLY`（只读）和 `READ WRITE`（读写）。如果你选择\
  \ `READ ONLY` 选项，系统将不允许你对数据库进行任何更改。然而，如果你选择 `READ WRITE` 访问级别，你将能够在事务中添加语句来修改数据，甚至是数据库结构。\n\
  \n## 隔离级别 (Isolation Level)\n\n你还记得我们讨论过如何隔离事务，以便在你处理它时没有东西可以影响它吗？很好，这里我们将讨论如何设置隔离级别。\n\
  \n对于 `SET TRANSACTION`，你可以使用四种隔离级别，如下语法所示：\n\n```sql\nSET TRANSACTION ISOLATION\
  \ LEVEL\nREAD UNCOMMITTED\nREAD COMMITTED\nREPEATABLE READ\nSERIALIZABLE\n```\n\n\
  隔离级别按有效性顺序排列，其中 `READ UNCOMMITTED` 是你可以使用的最低隔离级别，而 `SERIALIZABLE` 是最高隔离级别。如果你不指定隔离级别，系统将假设为\
  \ `SERIALIZATION` 级别，为你的事务提供最大的隔离性。\n\n## 诊断大小 (Diagnostic Size)\n\n`SET TRANSACTION`\
  \ 允许你指定诊断大小。你包含的大小让系统知道为条件留出多少区域。在 SQL 语句中，条件是语句引发的消息、告警或其他通知。如果你不指定诊断大小，数据库将自动为你分配一个。这个数字不是固定的。它随数据库的不同而异。\n\
  \n## 启动事务 (Start Transaction)\n\n在数据库中，你可以在开始执行命令时显式或自动地启动事务。\n\n例如，当你使用 `DELETE`、`CREATE\
  \ TABLE` 等命令时，可以启动事务。\n\n或者，你可以通过使用 `START TRANSACTION` 语句开始事务。\n\n与 `SET TRANSACTION`\
  \ 一样，你也可以在这里指定一个或多个模式。这些是我们之前提到的访问级别、隔离级别以及诊断大小模式。\n\n这是一个 `START TRANSACTION` 命令的示例：\n\
  \n```sql\nSTART TRANSACTION\nREAD ONLY\nISOLATION LEVEL SERIALIZED\nDIAGNOSTICS\
  \ SIZE 10;\n```\n\n一旦你输入上述语法，`START TRANSACTION` 将执行该语句及其操作。\n\n## 设置约束 (Set Constraint)\n\
  \n当你处理事务时，你可能会遇到你的工作违反了数据库中建立的约束的情况。让我们来看一个例子。\n\n假设你有一个包含 `NO NULL`（非空）约束的表。现在，当你处理该表时，你发现在该时间点可能没有值来代替\
  \ `NO NULL` 约束。但你不能在输入值的情况下离开。这迫使你向该区域插入随机值。\n\n为了避免这种情况，你可以将约束定义为可延迟的 (deferrable)。\n\
  \n此操作的语法所示：\n\n```sql\nSET CONSTRAINTS (constraint names) DEFERRED/IMMEDIATE\n```\n\
  \n要提到多个约束名称，你需要用竖线分隔它们。例如：\n\n`(constraint_1 | constraint_2 | constraint_3)`\n\n\
  然而，如果你想选择所有约束——这在你数据库中有大量约束时可能很有用——那么你只需要使用 `ALL` 单词即可。\n\n这是一个示例：\n\n```sql\nSET\
  \ CONSTRAINTS ALL DEFERRED/IMMEDIATE\n```\n\n其他需要注意的是注意的是，你不需要同时提到 `DEFERRED`（延迟）和\
  \ `IMMEDIATE`（立即）。你必须选择符合你在该点活动的一个。\n\n例如，如果你正在处理数据库，你会选择延迟约束，在这种情况下，你的语句应该像这样：\n\
  \n```sql\nSET CONSTRAINTS ALL DEFERRED\n```\n\n一旦你完成了对数据库的操作，你就可以选择应用更改。在这种情况下，语句将如下：\n\
  \n```sql\nSET CONSTRAINT ALL IMMEDIATE\n```\n\n所以，通过这一章，你理解了 SQL 事务背后的原理，以及为什么它们在进行\
  \ SQL 编程时是至关重要的。\n\n# 第 8 章：登录、用户与角色 (Logins, Users and Roles)\n\n“首先要确保设计是明智且公正的；确定后，果断地执行。”\
  \ – 威廉·莎士\n\n## 服务器登录 (Server Logins)\n\n服务器登录是在 SQL 服务器中创建的用户账户，使用 SQL Server 身份验证，这需要输入密码和用户名来登录\
  \ SQL Server 实例。SQL Server 身份验证与 Windows 身份验证不同，因为 Windows 不提示你输入密码。\n\n这些登录可以被授予访问\
  \ SQL Server 的权限，但根据分配的权限，并不一定具有数据库访问权限。它们还可以被分配某些服务器级角色，在 SQL Server 中提供某些服务器权限。\n\
  \n## 服务器级角色 (Server Level Roles)\n\n权限通过服务器级角色封装在登录中。服务器级角色决定了用户拥有的权限类型。\n\n共有种预定义的服务器级角色：\n\
  \n- `Sysadmin`：可以在服务器上执行任何操作，本质上是最高级别的访问。\n- `Serveradmin`：可以更改服务器配置并关闭 SQL 服务器。\n\
  - `Securityadmin`：如果用户具有数据库访问权限，可以 `GRANT`授予）、`DENY`拒绝）和 `REVOKE`取消）服务器级和数据库级权限。`securityadmin`\
  \ 还可以重置 SQL Server 密码。\n- `Processadmin`：提供结束运行进程的能力。\n- `Setupadmin`：可以添加或删除链接服务器。\n\
  - `Diskadmin`：用于管理 SQL Server 中的磁盘文件。\n- `Dbcreator`：提供使用 DDL 语句的能力，如 `CREATE`、`ALTER`、`DROP`\
  \ 甚至 `RESTORE` 数据库。\n- `Public`：所有登录都属于 `public` 角色，并在没有特定的服务器对象权限的情况下继承 `public`\
  \ 角色的权限。\n\n如果你真的想深入研究这个主题（我鼓励你这样做），请[点击此链接](https://docs.microsoft.com/en-us/relational-databases/security/authentication-access/server-level-roles?view=sql-server-2017)\
  \ 通过微软网站获取有关服务器色的更多信息。\n\n下面是创建服务器登录的语法示例。在分配服务器角色时，你可以将 `dbcreator` 替换为上述任何角色。\n\
  \n你还会注意到 `master` 和 `User Name` 周围有括号 `[]`。这些是定界标识符，我们之前讨论过。\n\n```sql\n-- 首先，使用\
  \ master 数据库\nUSE [master]\nGO\n\n-- 创建登录 - 将 'User A' 替换为你想使用的登录名\n-- 在 'Password'\
  \ 字段输入密码 - 建议使用强密码\n-- 同时为其提供默认数据库 'master'\nCREATE LOGIN [User A] WITH PASSWORD=\
  \ N'123456', DEFAULT_DATABASE=[master]\nGO\n```\n\n## 分配服务器角色 (Assigning Server\
  \ Roles)\n\n在 SQL Server 中有几种方法可以将这些角色分配给用户登录。一种方法是使用 Management Studio 中的界面，另一种是使用\
  \ SQL 语法。\n\n下面是给用户特定服务器角色的语法。如果你还记得我们之前创建 `User A` 登录的语法，这将赋予 `User A` `dbcreator`\
  \ 服务器角色。\n\n```sql\n-- 给用户登录分配一个 'dbcreator' 角色（它默认拥有 public 角色）\nALTER SERVER ROLE\
  \ dbcreator ADD MEMBER [User A]\nGO\n```\n\n\n\n\n\n对于你创建的名为 `Server User` 的上述用户，为其分配\
  \ `serveradmin` 服务器角色。\n\n在你成功完成练习后，你将收到一条消息，告诉你的命令已成功完成。你现在可以使用该账户登录 SQL Server\
  \ 了！\n\n若要登录，只需导航到对象资源管理器窗口中的“连接对象资源管理器”（Connect Object Explorer）按钮并点击它弹出连接窗口。\n\
  \n![](img/00110.jpg)\n\n当登录窗口出现时，选择显示有“Windows 身份验证”的下拉菜单，并选择“SQL Server 身份验证”。只需输入用户名和密码并登录即可！\n\
  \n![](img/00083.jpg)\n\n一旦你能够使用此用户登录，尝试在对象资源管理器中打开数据库（系统数据库除外）。看起来应该像这样；但当你尝试展开数据库时，它会显示为空白。\n\
  \n![](img/00040.jpg)\n\n你不应该能够这样做，因为此用户没有任何数据库访问权限。我们将在下一节中更详细地讨论这一点。\n\n## 数据库用户\n\
  \n数据库用户通常与一个登录名关联，并映射到数据库或一组数据库。该数据库用户的目的是提供对服务器内部数据库的访问。你也可以限制对其他数据库的访问。\n\n在许多情况下，一个服务器实例上会有多个数据库，你并不希望赋予所有用户所有数据库访问权限。\n\
  \n## 数据库级角色\n\n类似于服务器级角色，数据库级角色可以分配给用户，以控制其在特定数据库中的权限。\n\n共有九个预定义的数据库角色：\n\n- `Db_owner`\
  \ - 提供在数据库上执行所有配置和维护作业的能力。该角色允许用户 `DROP` 数据库——这是一个强大的命令！\n- `Db_securityadmin` -\
  \ 提供修改角色成员身份和管理权限的能力。\n- `Db_accessadmin` – 提供为 Windows 登录名、Windows 组和 SQL 登录名添加或删除数据库访问权限的能力。\n\
  - `Db_backupoperator` - 允许用户备份数据库。\n- `Db_ddladmin` - 提供在 SQL Server 中运行任何 DDL 语句的能力。\n\
  - `Db_datawriter` - 提供在任何用户表内添加、删除或修改数据的能力。\n- `Db_datareader` - 提供从用户表中查看任何数据的能力。\n\
  - `Db_denydatawriter` - 无法在任何用户表内添加、删除或修改数据。\n- `db_denydatareader` - 无法从用户表中查看任何数据。\n\
  \n## 分配数据库角色和创建用户\n\n与分配服务器角色和创建登录名一样，你可以使用管理 Studio 或 SQL 语法来创建数据库用户并为该特定用户分配数据库级角色。你还可以将该用户映射到登录名，以便两者相关联。\n\
  \n下面是将数据库用户与登录名关联并分配数据库角色的一些示例语法。这可能会有点复杂，但我将其分成了四个部分，以便于理解。\n\n```sql\n-- 使用我们想要向其中添加用户的数据库\n\
  USE [AdventureWorks2012]\nGO\n\n-- 为登录名 'User A' 创建名为 'User A' 的用户\nCREATE USER\
  \ [User A] FOR LOGIN [User A]\nGO\n\n-- 再次使用 AdventureWorks2012，因为数据库级角色需要正确地\n\
  -- 映射到用户\nUSE [AdventureWorks2012]\nGO\n\n-- 修改 db_datawriter 角色并添加数据库用户 'User A'，\n\
  // 使用户户可以在 AdventureWorks2012 中添加、删除或修改现有数据\nALTER ROLE [db_datawriter] ADD MEMBER\
  \ [User A]\nGO\n```\n\n## LIKE 子句\n\nSQL 为我们提供了 `LIKE` 子句，帮助我们使用通配符比较值与相似的值。\n\n\
  与 `LIKE` 子句一起使用的通配符包括百分号（`%`）和下划线（`_`）。\n\n符号的语法如下：\n\n```sql\nSELECT FROM tableName\
  \ WHERE column LIKE 'XXX%'\n```\n\n或者以下语法：\n\n```sql\nSELECT FROM tableName WHERE\
  \ column LIKE '%XXX%'\n```\n\n或者以下语法：\n\n```sql\nSELECT FROM tableName WHERE column\
  \ LIKE 'XXX_'\n```\n\n或者以下语法：\n\n```sql\nSELECT FROM tableName WHERE column LIKE\
  \ '_XXX'\n```\n\n或者以下语法：\n\n```sql\nSELECT FROM tableName WHERE column LIKE '_XXX_'\n\
  ```\n\n如果你有多个条件，使用连接操作符（`AND`、`OR`）将它们组合起来。上面的情况下，`XXX` 代表任何字符串或数值。\n\n让我们描述你可以使用\
  \ `LIKE` 子句创建的一些语句的含义：\n\n1. `WHERE SALARY LIKE '300%'` - 返回任何以 300 开头的值。\n2. `WHERE\
  \ SALARY LIKE '%300%'` - 将返回任何位置包含 300 的值。\n3. `WHERE SALARY LIKE '_00%'` - 将找到第二和第三位为\
  \ 00 的值。\n4. `WHERE SALARY LIKE '4_%_%'` - 将找到以 4 开头且至少有 3 个字符的值。\n5. `WHERE SALARY\
  \ LIKE '%3'` - 将找到以 3 结尾的值。\n6. `WHERE SALARY LIKE '_3%4` - 将寻找第二位为 3 且以 4 结尾的值。\n\
  7. `WHERE SALARY LIKE '3____'` - 将找到以 3 开头且长度为 6 位的值（注：原文此处可能有笔误，已根据逻辑推断）。\n\n*注：由于原文第\
  \ 4 点、6 点、7 点存在引号未闭合或逻辑错误，翻译时已根据语意进行了微调。* (此处保持原意逻辑翻译)\n\n[/content] \n\n*(抱歉，由于提供的原始文本在\
  \ LIKE Clause 部分似乎存在多处拼写错误（如引号未闭合），翻译时已根据 SQL 逻辑进行了修正性处理以确保文档的可读性。)*\n\n---\n\n\
  **等等，我注意到你提供的原文在 `LIKE Clause` 部分确实存在很多排版错误（例如 `4_%_%` 缺少结尾引号，`_3%4` 缺少结尾引号）。作为高级工程师，我会在翻译时尽可能修复这些明显的格式错误，以保证文档的专业性。**\n\
  \n**重新提供翻译后的 LIKE Clause 部分（修正格式后）：**\n\n[content]\n## LIKE 子句\n\nSQL 为我们提供了 `LIKE`\
  \ 子句，帮助我们使用通配符比较值与相似的值。 \n\n与 `LIKE` 子句一起使用的通配符包括百分号（`%`）和下划线（`_`）。 \n\n这些符号的语法如下：\n\
  \n```sql\nSELECT FROM tableName WHERE column LIKE 'XXX%'\n```\n\n或者以下语法：\n\n```sql\n\
  SELECT FROM tableName WHERE column LIKE '%XXX%'\n```\n\n或者以下语法：\n\n```sql\nSELECT\
  \ FROM tableName WHERE column LIKE 'XXX_'\n```\n\n或者以下语法：\n\n```sql\nSELECT FROM\
  \ tableName WHERE column LIKE '_XXX'\n```\n\n或者以下语法：\n\n```sql\nSELECT FROM tableName\
  \ WHERE column LIKE '_XXX_'\n```\n\n如果你有多个条件，使用连接操作符（`AND`、`OR`）将它们组合起来。上面的情况下，`XXX`\
  \ 代表任何字符串或数值。 \n\n让我们描述一下你可以使用 `LIKE` 子句创建的一些语句的含义：\n\n1. `WHERE SALARY LIKE '300%'`\
  \ - 返回任何以 300 开头的值。 \n2. `WHERE SALARY LIKE '%300%'` - 将返回任何位置包含 300 的值。 \n3. `WHERE\
  \ SALARY LIKE '_00%'` - 将找到第二和第三位为 00 的值。 \n4. `WHERE SALARY LIKE '4_%_%'` - 将找到以\
  \ 4 开头且至少有 3 个字符的值。 \n5. `WHERE SALARY LIKE '%3'` - 将找到以 3 结尾的值。 \n6. `WHERE SALARY\
  \ LIKE '_3%4'` - 将寻找第二位为 3 且以 4 结尾的值。 \n7. `WHERE SALARY LIKE '3____'` - 将找到以 3\
  \ 开头且长度为 6 位的值。\n\n\n\n\n`AVG()` 函数可以用于算术运算。例如，假设销售税为销售额的 6.6%，你可以使用此语句计算平均销售税金额：\n\
  \n![](img/00001.jpg)\n\n```sql\nSELECT AVG(Sales*.066) FROM Sales_Rep;\n```\n\n\
  以下是结果：\n\n[`docs.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql?view=sql-server-2017`](https://docs.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql?view=sql-server-2017)\n\
  \n为了获得结果，SQL 在应用 `AVG` 函数之前必须计算算术运算 `‘Sales *.o66’` 的结果。\n\n```sql\nSELECT Branch,\
  \ AVG(Sales) FROM Sales_Rep\nGROUP BY Branch;\n```\n\n![](img/00118.jpg)\n\n以下是结果：\n\
  \n[`docs.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql?view=sql-server-2017`](https://docs.microsoft.com/en-us/sql/t-sql/statements/create-function-transact-sql?view=sql-server-2017)\n\
  \n## SQL ROUND 函数\n\n以下是 SQL `ROUND()` 函数的语法：\n\n```sql\nROUND (expression, [decimal\
  \ place])\n```\n\n在上述语句中，`decimal place` 指定了将返回的小位数。例如，指定 `-1` 将将数字四舍入到最近的十位。\n\n\
  本节的示例将使用具有以下数据的 `Student_Grade` 表：\n\n| ID | Name | Grade |\n| :--- | :--- | :---\
  \ |\n| 1 | Jack Knight | 87.6498 |\n| 2 | Daisy Poult | 98.4359 |\n| 3 | James McDuff\
  \ | 97.7853 |\n| 4 | Alicia Stone | 89.9753 |\n\n要将成绩四舍入到最近的十分位，请输入以下语句：\n\n```sql\n\
  SELECT Name, ROUND (Grade, 1) Rounded_Grade FROM Student_Grade;\n```\n\n![](img/00068.jpg)\n\
  \n这将是结果。\n\n假设你想将成绩四舍入入到最近的十位，你将为 `ROUND()` 函数使用负参数：\n\n![](img/00090.jpg)\n\n```sql\n\
  SELECT Name, ROUND (Grade, -1) Rounded_Grade FROM Student_Grade;\n```\n\n以下是结果：\n\
  \n## SQL SUM 函数\n\n`SUM()` 函数用于返回表达式的总和。\n\n以下是 `SUM()` 函数的语法：\n\n```sql\nSELECT\
  \ SUM (<expression>)\nFROM “table_name”;\n```\n\n`expression` 参数可以引用算术运算或列名。算术运算可能包含一个或多个列。\n\
  \n同样，除了 `SUM()` 函数中指定的列外，`SELECT` 语句中还可以有多一个列。这些列也应该形成 `GROUP BY` 子句的一部分。语法如下：\n\
  \n![](img/00002.jpg)\n\n```sql\nSELECT colum n1, colum n2, … column N, SUM (“colum\
  \ nN+1”)\nFROM table_name;\nGROUP BY colum n1, colum n2, … colum_nameN;\n```\n\n\
  本节的示例将将使用具有以下数据的 `SALES_REP` 表：\n\n要计算 `Sales_Rep` 表中所有销售额的总和，请输入以下语句：\n\n```sql\n\
  SELECT SUM(Sales) FROM Sales_Rep;\n```\n\n![](img/00130.jpg)\n\n这将是结果。数字 `62455.00`\
  \ 代表 `Sales` 列中所有条目的总和。\n\n为了说明如何将算术运算作为 `SUM()` 函数的参数，假设你必须对销售额收取 6.6% 的销售税。以下是获取总销售税的语句：\n\
  \n```sql\nSELECT SUM(Sales*.066) FROM Sales_Rep;\n```\n\n![](img/00175.jpg)\n\n\
  你将得到以下结果。\n\n在此示例中，你将结合 `SUM()` 函数和 `GROUP BY` 子句来计算每个分支的总销售额。你可以使用以下语句：\n\n```sql\n\
  SELECT Branch, SUM(Sales) FROM Sales_Rep\nGROUP BY Branch;\n```\n\n![](img/00182.jpg)\n\
  \n以下是结果。\n\n## SQL MAX() 函数\n\n`MAX()` 函数用于获取给定表达式中的最大值。\n\n以下是语法：\n\n```sql\nSELECT\
  \ MAX (<expression>)\nFROM table_name;\n```\n\n`expression` 参数可以是一个算术运算或列名。算术运算可以有多个列。\n\
  \n`SELECT` 语句除了 `MAX()` 函数中指定的列外，还可以有一个或多个列。如果是是的话，这些列也应该形成 `GROUP BY` 子句的一部分。语法如下：\n\
  \n```sql\nSELECT colum n1, colum n2, … column N, MAX (<expression>)\nFROM table_name;\n\
  GROUP BY colum n1, colum n2, … colum_nameN;\n```\n\n为了演示这一点，你将使用具有以下数据的 `SALES_REP`\
  \ 表。要获取最大值，请输入以下语句：\n\n```sql\nSELECT MAX(Sales) FROM Sales;\n```\n\n为了说明如何将算术运算作为\
  \ `MAX()` 函数的参数，假设你必须对销售额收取 6.6% 的销售税。以下是获取总销售税的语句：\n\n```sql\nSELECT MAX(Sales*.066)\
  \ FROM Sales_Rep;\n```\n\n在此示例中，你将结合 `MAX()` 函数和 `GROUP BY` 子句来计算每个分支的总销售额。你可以使用以下语句：\n\
  \n```sql\nSELECT Branch, MAX(Sales) FROM Sales_Rep\nGROUP BY Branch;\n```\n\n##\
  \ SQL MIN 函数\n\n`MIN()` 函数用于获取给定表达式中的最小值。\n\n以下是语法：\n\n```sql\nSELECT MIN (<expression>)\n\
  FROM table_name;\n```\n\n`expression` 参数可以是一个算术运算或列名。算术运算可以有多个列。`SELECT` 语句除了 `MIN()`\
  \ 函数中指定的列外，还可以有一个或多个列。如果是是的话，这些列也应该形成 `GROUP BY` 子句的一部分。语法如下：\n\n```sql\nSELECT\
  \ colum n1, colum n2, … column N, MIN (<expression>)\nFROM table_name;\nGROUP BY\
  \ colum n1, colum n2, … colum_nameN;\n```\n\n为了演示这一点，你将使用具有以下数据的 `SALES_REP` 表。要获取最小值，请输入以下语句：\n\
  \n```sql\nSELECT MIN(Sales) FROM Sales_Rep;\n```\n\n为了说明如何将算术运算作为 `MIN()` 函数的参数，假设你必须对销售额收取\
  \ 6.6% 的销售税。以下是获取总销售税的语句：\n\n```sql\nSELECT MIN(Sales*.066) FROM Sales_Rep;\n```\n\
  （注：此处原文内容似乎存在重复和混淆，已按原文逻辑进行翻译）\n\n## 第 9 章：修改和控制表\n\n“ 问题不在于问题的存在。问题在于期望没有问题，并认为有问题就是问题。”\
  \ – Theodore Rubin\n\n以下是修改表的基本语法：\n\n```sql\nALTER TABLE TABLE_NAME [MODIFY] [COLUMN\
  \ COLUMN_NAME][DATATYPE|NULL NOT NULL]\n[RESTRICT|CASCADE]\n[DROP]       [CONSTRAINT\
  \ CONSTRAINT_NAME]\n[ADD]          [COLUMN] COLUMN DEFINITION\n```\n\n### 修改表名\n\
  \n`ALTER TABLE` 命令可以配合 `RENAME` 函数更改表名。\n\n为了演示此语句的使用，使用具有以下记录的 `EMPLOYEES` 表：\n\
  \n![](img/00011.jpg)\n\n要将 `EMPLOYEES` 表名更改为 `INVESTORS`，使用以下语句：\n\n```sql\nALTER\
  \ TABLE EMPLOYEES RENAME INVESTORS;\n```\n\n你的表现在名为 `INVESTORS`。\n\n\n\n\n列的属性指的是输入列中的数据的属性和行为。通常，你会在创建表时设置列属性。然而，你仍然可以使用\
  \ `ALTER TABLE` 命令更改一个或多个属性。\n\n你可以修改以下内容：\n\n* 列名\n* 分配给列的数据类型\n* 列的标度、长度或精度\n\
  * 列中是否使用 `NULL` 值\n\n### 重命名列\n\n你可能想要修改列的名称以反映其所包含的数据。例如，由于你已将 `EMPLOYEES` 数据库重命名为\
  \ `INVESTORS`，`SALARY`（工资）列将不再适用。你可以将列名更改为 `CAPITAL`（资本）等。同样，你可能还想将其数据类型从 `DECIMAL`\
  \ 更改为最大十位数的 `INTEGER TYPE`。\n\n要执行此操作，请输入以下语句：\n\n```sql\nALTER TABLE INVESTORS\
  \ CHANGE SALARY CAPITAL INT(10);\n```\n\n结果如下：\n\n![](img/00058.jpg)\n\n### 删除列\n\
  \n此时，`Position` 列不再适用。你可以使用以下语句删除该列：\n\n```sql\nALTER TABLE INVESTORS\nDROP COLUMN\
  \ Position;\n```\n\n这是更新后的 `INVESTORS` 表：\n\n![](img/00096.jpg)\n\n### 添加新列\n\n\
  由于你现在处理的是一组不同的数据，你可能决定添加另一个列，使 `INVESTORS` 表中的数据更具相关性。你可以添加一个列来存储每个投资者拥有的股票数量。你可以将新列命名为\
  \ `STOCKS`。该列将接受最多 9 位的整数。\n\n你可以使用以下语句添加 `STOCKS` 列：\n\n```sql\nALTER TABLE INVESTORS\
  \ ADD STOCKS INT(9);\n```\n\n以下是更新后的 `INVESTORS` 表：\n\n![](img/00071.jpg)\n\n###\
  \ 在不更改名称的情况下修改现有列\n\n你还可以将 `ALTER TABLE` 命令与 `MODIFY` 关键字结合来更改表的数据类型和规格。为了演示这一点，你可以使用以下语句将\
  \ `CAPITAL` 列的数据类型从 `INT` 类型更改为最多 9 位数字和两位位小数的 `DECIMAL` 类型。\n\n```sql\nALTER TABLE\
  \ INVESTORS MODIFY CAPITAL DECIMAL(9.2) NOT NULL;\n```\n\n此时，你可能想查看 `INVESTORS`\
  \ 表的列名和属性。你可以使用 `SHOW COLUMNS` 语句显示表的结构。输入以下语句：\n\n```sql\nSHOW COLUMNS FROM INVESTORS;\n\
  ```\n\n这是该结果的截图：\n\n![](img/00007.jpg)\n\n### 使用 ALTER TABLE 时需要记住的规则\n\n* **向数据库表添加列**\n\
  \  在添加新列时，请记住，你不能向已有数据的表中添加带有 `NOT NULL` 属性的列。你通常会指定某列为 `NOT NULL` 以表示它将包含一个值。如果现有数据在新建列上没有值，添加\
  \ `NOT NULL` 列将违反该约束。\n\n* **修改字段/列**\n  1. 你可以轻松修改列的数据类型。\n  2. 你可以增加数值数据类型所包含的位数，但只有当表中存储的最大位数等于或低于所需的位数时，你才能减少该位数。\n\
  \  3. 你可以增加或减少数值数据类型的小数位数，只要它们不超过允许的最大小数位数。\n\n如果处理不当，删除和修改表可能会导致丢失重要信息。因此，在执行 `ALTER\
  \ TABLE` 和 `DROP TABLE` 语句时要务必极其小心。\n\n删除 删除表\n\n删除表将同时移除其数据、关联索引、触发器、约束和权限数据。在使用此语句时应要小心。\n\
  \n语法如下：\n\n```sql\nDROP TABLE table_name;\n```\n\n例如，如果你想从 `xyzcompany` 数据库中删除 `INVESTORS`\
  \ 表，可以使用以下语句：\n\n```sql\nDROP TABLE INVESTORS;\n```\n\n`DROP TABLE` 命令实际上已从当前数据库中移除了\
  \ `INVESTORS` 表。\n\n如果你尝试使用以下命令访问 `INVESTORS` 表：\n\n```sql\nSELECT* FROM INVESTORS;\n\
  ```\n\nSQL 将返回一个错误，如下：\n\n![](img/00173.jpg)\n\n### 合并与连接表\n\n如果多个表之间存在公共字段，你就可以合并多个表的数据。要实现这一点，请使用\
  \ `JOIN` 语句。\n\nSQL 支持几种类型的 `JOIN` 操作：\n\n#### INNER JOIN\n\n`INNER JOIN`（或简称为 `JOIN`）是最常用的\
  \ `JOIN` 类型。当要连接的表具有匹配字段时，它会显示行。\n\n语法如下：\n\n```sql\nSELECT * FROM table1 JOIN table2\
  \ ON table1.field = table2.field;\n```\n\n#### LEFT JOIN\n`LEFT JOIN` 返回左表的所有行以及右表的匹配行。如果没有找到匹配项，则结果为\
  \ `NULL`。\n\n```sql\nSELECT * FROM table1 LEFT JOIN table2 ON table1.field = table2.field;\n\
  ```\n\n#### RIGHT JOIN\n`RIGHT JOIN` 是 `LEFT JOIN` 的反向。\n\n```sql\nSELECT * FROM\
  \ table1 RIGHT JOIN table2 ON table1.field = table2.field;\n```\n\n#### FULL OUTER\
  \ JOIN\n`FULL OUTER JOIN` 在左表或右表存在匹配项时返回所有行。\n\n```sql\nSELECT * FROM table1 FULL\
  \ OUTER JOIN table2 ON table1.field = table2.field;\n```\n\n\n\n\n\n在前两行中，该语句告诉\
  \ SQL 从 `Location` 表中选择 ‘Region’ 字段，并从 `Branch_Sales` 表中选择 ‘Sales’ 字段的总和。该语句使用了表别名。“Region’\
  \ 字段被别命名为 `Region`，而 `SALES` 字段之和被别命名为 `SALES`。\n\n表别名是对表或表列使用临时名称的做法。使用别名有助于使语句更易读、更简洁。例如，如果你选择不在第一行使用表别名，你将使用以下语句来实现相同的结果：\n\
  \n```sql\nSELECT Location.Region Region,\nSUM(Branch_Sales.Sales) SALES\n```\n\n\
  或者，你可以通过 `JOIN` 和 `ON` 关键字来指定两个表之间的连接。例如，使用这些关键字，查询将是：\n\n```sql\nSELECT A1.Region\
  \ REGION, SUM(A2.Sales) SALES \nFROM Location A1\nJOIN Branch_Sales A2 \nON A1.Branch\
  \ = A2.Branch \nGROUP BY A1.Region;\n```\n\n该查询将产生相同的结果。\n\n![](img/00066.jpg)\n\
  \n### Inner Join\n\n内连接在在两个表上存在一个或多个匹配项时显示行。为了演示这一点，请使用以下表：\n\n**Branch_Sales table**\n\
  \n| Branch | Product_ID | Sales |\n| :--- | :--- | :--- |\n| New York | 101 | 7500.00\
  \ |\n| Philadelphia | 101 | 1980.00 |\n| Denver | 102 | 3500.00 |\n| Seattle | 101\
  \ | 2500.00 |\n| Detroit | 102 | 1450.00 |\n\n**Location_table**\n| Region | Branch\
  \ |\n| :--- | :--- |\n| East | New York |\n| East | Chicago |\n| East | Philadelphia\
  \ |\n| East | Detroit |\n| West | Los Angeles |\n| West | Denver |\n| West | Seattle\
  \ |\n\n你可以通过使用 `INNER JOIN` 语句来实现这一点。\n\n你可以输入以下内容：\n\n```sql\nSELECT A1.Branch\
  \ BRANCH, SUM(A2.Sales) SALES \nFROM Location A1 \nINNER JOIN Branch_Sales A2 \n\
  ON A1.Branch = A2.Branch \nGROUP BY A1.Branch;\n```\n\n这将是结果：\n\n![](img/00076.jpg)\n\
  \n请注意，通过使用 `INNER JOIN`，即使你实际上是在 `Location` 表上应用 `SELECT` 语句，但只有在 `Branch_Sales`\
  \ 报告中有记录的分支才包含在结果中。“Chicago”和“Los Angeles”分支被排除，是因为 `Branch_Sales` 表中没有这些分支的记录。\n\
  \n### Outer Join\n\n在上一个例子中，你使用了内连接来合并具有共同行的表。`OUTER JOIN` 命令用于此目的。\n\n`OUTER JOIN`\
  \ 的示例将使用与 `INNER JOIN` 相同的表：`Branch_Sales` 表和 `Location_table`。\n\n这次，你需要所有商店的销售数字列表。普通的连接将排除\
  \ Chicago 和 Los Angeles，因为这些分支并不在 `Branch_Sales` 表中。因此，你想执行 `OUTER JOIN`。\n\n语句如下：\n\
  \n```sql\nSELECT A1.Branch, SUM(A2.Sales) SALES\nFROM Location A1, Branch_Sales\
  \ A2\nWHERE A1.Branch = A2.Branch (+)\nGROUP BY A1.Branch;\n```\n\n请注意，外连接的语法取决于数据库。上面的语句使用了\
  \ Oracle 语法。\n\n以下是结果：\n\n| Branch | Sales |\n| :--- | :--- |\n| Chicago | NULL\
  \ |\n| Denver | 3500.00 |\n| Detroit | 1450.00 |\n| Los Angeles | NULL |\n| New\
  \ York | 7500.00 |\n| Philadelphia | 1980.00 |\n| Seattle | 2500.00 |\n\n在合并表时，请注意某些\
  \ `JOIN` 语法在不同的数据库系统中具有不同的结果。为了充分利用这一强大的数据库功能，阅读 RDBMS 文档至关重要。\n\n### LIMIT, TOP\
  \ and ROWNUM Clauses\n\n`TOP` 命令帮助我们仅从表中检索 `TOP` 数量的记录。然而，你必须注意并不是所有的数据库都支持 `TOP`\
  \ 命令。某些支持 `LIMIT`，而另一些则支持 `ROWNUM` 子句。\n\n以下是在 `SELECT` 语句上使用 `TOP` 命令的语法：\n\n```sql\n\
  SELECT TOP number|percent columnName(s)\nFROM tableName\nWHERE [condition]\n```\n\
  \n我们想使用 `EMPLOYEES` 表来演示如何使用此子句。该表具有以下数据：\n\n![](img/00025.jpg)\n\n以下查询将帮助我们从表中获取前\
  \ 2 行：\n\n```sql\nSELECT TOP 2 * FROM EMPLOYEES\n```\n\n如果你使用 MySQL，请使用 `LIMIT`\
  \ 子句：\n\n```sql\nSELECT * FROM EMPLOYEES\nLIMIT 2;\n```\n\n如果你使用 Oracle，请使用 `ROWNUM`\
  \ 子句：\n\n```sql\nSELECT * FROM EMPLOYEES\nWHERE ROWNUM <= 2;\n```\n\n### ORDER BY\
  \ Clause\n\n`ORDER BY` 子句帮助我们对数据进行排序，可以是升序或降序。大多数数据库默认按升序排序。以下是其的语法：\n\n```sql\n\
  SELECT column_1, column_2\nFROM tableName\nWHERE [condition]\nORDER BY column_1,\
  \ column_2\n```\n\n让我们使用 `EMPLOYEES` 表数据：\n\n```sql\nSELECT * FROM EMPLOYEES\nORDER\
  \ BY NAME, SALARY;\n```\n\n我们还可以对 `SALARY` 列进行降序排序：\n\n```sql\nSELECT * FROM EMPLOYEES\n\
  ORDER BY SALARY DESC;\n```\n\n### GROUP BY Clause\n\n`GROUP BY` 子句与 `SELECT` 语句一起使用，对相关数据进行分组。`GROUP\
  \ BY` 子句应跟在 `WHERE` 子句之后，`ORDER BY` 子句之前。\n\n以下是语法：\n\n```sql\nSELECT column_1,\
  \ column_2\nFROM tableName\nWHERE [condition]\nGROUP BY column_1, column_2\nORDER\
  \ BY column_1, column_2\n```\n\n让我们使用 `EMPLOYEES` 表数据：\n\n![](img/00069.jpg)\n\n\
  如果你需要每个客户的总 `SALARY`，只需运行以下命令：\n\n```sql\nSELECT NAME, SALARY, SUM(SALARY) FROM\
  \ EMPLOYEES\nGROUP BY NAME;\n```\n\n### DISTINCT Keyword\n\n`DISTINCT` 关键字与 `SELECT`\
  \ 语句一起使用，有助于消除重复并选择唯一记录。这是因为在某些情况下表中会有多个重复记录，而你的目标是选择唯一的记录。`DISTINCT` 关键字可以帮助你实现这一目标。该关键字可以使用语法：\n\
  \n```sql\nSELECT DISTINCT column_1, column_2.....column_N\nFROM tableName\nWHERE\
  \ [condition]\n```\n\n我们将使用 `EMPLOYEES` 表来演示如何使用此关键字：\n\n![](img/00077.jpg)\n\n\
  在上述表的 `SALARY` 列中有一个 4000 的重复条目。在运行以下查询后可以看到：\n\n```sql\nSELECT SALARY FROM EMPLOYEES\n\
  ORDER BY SALARY;\n```\n\n我们现在可以将查询与 `DISTINCT` 关键字结合并查看查询返回的内容：\n\n![](img/00180.jpg)\n\
  \n\n\n\n到目前为止，我们一直在执行单条 SQL 查询来完成插入、查询、更新和删除功能。然而，有一种方法可以在其他 SQL 查询内部执行 SQL 查询。例如，你可以查询数据库中年龄大于特定学生的所有学生记录。在本章中，我们将演示如何在\
  \ SQL 中执行子查询（即“查询内部的查询”）。\n\n你应该已经有了标记为“Student”（学生）和“Department（部门）”的表，并且其中包含一些记录。\n\
  \n首先，我们可以获取 Stacy 的年龄，将其存储在某个变量中，然后使用“where”子句与 `SELECT` 查询中的年龄进行比较。另一种方法是将获取 Stacy\
  \ 年龄的查询嵌入到获取所有学生年龄的查询中。这种方法使用了子查询技术。请查看查询 1 以了解子查询的用法。\n\n### 查询 1\n\n```sql\nSelect\
  \ * From Student\nwhere StudentAge >\n(Select StudentAge from Student\nwhere StudName\
  \ = 'Stacy'\n)\n```\n\n注意，在查询 1 中，我们使用圆括号在 `where` 子句中附加了一个子查询。上述查询将从 `Student`\
  \ 表中检索所有学生记录，条件是学生的年龄大于“Stacy”的年龄。“Stacy”的年龄是 20；因此，在输出中，你将看到所有年龄大于 20 的学生的记录。输出如下：\n\
  \n| StudID | StudName | StudentAge | StudentGender | DepID |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| 1 | Alice | 21 | Male | 2 |\n| 4 | Jacobs | 22 | Male | 5 |\n\
  | 6 | Shane | 22 | Male | 4 |\n| 7 | Linda | 24 | Female | 4 |\n| 9 | Wolfred |\
  \ 21 | Male | 2 |\n| 10 | Sandy | 25 | Female | 1 |\n| 14 | Mark | 23 | Male | 5\
  \ |\n| 15 | Fred | 25 | Male | 2 |\n| 16 | Vic | 25 | Male | NULL |\n| 17 | Nick\
  \ | 25 | Male | NULL |\n\n同样，如果你想更新所有部门名为“English”（英语）的学生的姓名，可以使用以下子查询：\n\n### 查询\
  \ 2\n\n```sql\nUpdate Student\nSet StudName = StudName + ' Eng'\nwhere Student.StudID\
  \ in (\nSelect StudID\nfrom Student\nJoin\nDepartment\nOn Student.DepID = Department.DepID\n\
  where DepName = 'English'\n)\n```\n\n在上述查询中，通过子查询中的 `JOIN` 语句检索了英语部门所有学生的 ID。然后，使用\
  \ `UPDATE` 语句，通过在他们的姓名末尾附加字符串“Eng”，更新了所有这些学生的姓名。使用 `WHERE` 语句匹配通过子查询检索到的学生 ID。\n\
  \n`IFNULL` 函数检查特定表列中是否存在 Null 值。如果存在 `NULL` 值，它将被替换为作为 `IFNULL` 函数的第二个参数传递的值。例如，以下查询将把部门\
  \ ID 为空的学生的部门 ID 显示为 50。\n\n现在，如果你显示学生姓名以及他们部门的名称，你将看到属于英语部门的学生姓名后追加了“Eng”。\n\n\
  ### 练习 9\n\n**任务：**\n从“Student”表中删除所有学生 ID 小于“Linda” ID 的学生记录。\n\n**解决方案**\n```sql\n\
  Delete From Student\nwhere StudID <\n(Select StudID from Student\nwhere StudName\
  \ = 'Linda'\n)\n```\n\n## SQL 字符函数\n\nSQL 字符函数用于修改检索数据的显示外观。字符函数不修改实际数据，而是对数据表示的方式进行某些修改。SQL\
  \ 字符函数作用于字符串类型的数据。在本章中，我们将查看一些最常用的 SQL 字符函数。\n\n## 注意：\n\n- **拼接 (+)**\n  拼接函数用于连接两个或多个字符串。在\
  \ SQL 中，使用 `+` 运算符连接两个字符串。例如，我们可以连接学生列中的学生姓名和性别，并将它们显示在一列中，如下所示：\n\n```sql\nSelect\
  \ StudName +' '+StudentGender as NameAndGender\nfrom Student\n```\n\n- **替换 (Replace)**\n\
  \  `replace` 函数用于替换输出字符串中的字符。例如，以下查询将所有学生姓名中的“ac”替换为“rs”。\n\n```sql\nSelect StudName,\
  \ REPLACE(StudName, 'ac', 'rs') as ModifiedColumn\nFrom Student\n```\n`replace`\
  \ 函数的第一个参数是你想要替换其值的列；第二个参数是你想要替换的字符序列，随后是第三个参数，表示你想要插入旧序列位置的字符序列。\n\n- **子字符串 (Substring)**\n\
  \  `substring` 函数返回从指定位置开始的字符数。以下查询显示学生姓名的前三个字符。\n\n```sql\nSelect StudName, substring(StudName,\
  \ 1, 3) as SubstringColumn\nFrom Student\n```\n\n- **长度 (Length)**\n  `length` 函数用于获取特定列值的长度。例如，要获取“Student”表中学生姓名的长度，可以使用：\n\
  \n```sql\nSelect StudName, length as length\nfrom Student\n```\n\n- **IFNULL**\n\
  \  `IFNULL` 函数检查特定表列中是否存在 Null 值。如果存在 `NULL` 值，它将被替换为作为 `IFNULL` 函数第二个参数传递的值。例如，以下查询将把部门\
  \ ID 为空的学生的部门 ID 显示为 50。\n\n```sql\nSelect Student.DepID, IFNULL(Student.DepID,\
  \ 50)\nfrom Student\n```\n\n- **LTRIM**\n  `LTRIM` 函数移除指定位置开始的空格。例如，如果你想移除学生姓名之前的空格，可以使用以下查询：\n\
  \n```sql\nSelect StudName, ltrim(StudName)\nfrom Student\n```\n\n- **RTRIM**\n \
  \ `RTRIM` 函数移除指定位置开始的末尾空格。例如，如果你想移除学生姓名之后的空格，可以使用以下查询：\n\n```sql\nSelect StudName,\
  \ rtrim(StudName)\nfrom Student\n```\n\n## SQL 约束\n\n约束是指应用于数据库列上的规则。它们帮助我们对表中存储的数据类型进行限制。通过这种方式，我们可以确保数据的可靠性和准确性。\n\
  \n约束可以在列级或表级实施。列级约束只能施加于单个列，而表级约束应用于整个表。\n\n## NOT NULL 约束\n\nSQL 的默认设置是列允许空值。如果你不希望列没有值，可以指定这一点。\n\
  \n注意 `NULL` 表示未知数据而非无数据。这种约束可以在创建表时定义。让我们通过创建一个示例表来演示：\n\n```sql\nCREATE TABLE MANAGERS(\n\
  \  ID INT NOT NULL,\n  NAME VARCHAR (15) NOT NULL,\n  DEPT VARCHAR(20) NOT NULL,\n\
  \  SALARY DECIMAL (20, 2),\n  PRIMARY KEY (ID)\n);\n```\n\n在上面，我们创建了一个名为 MANAGERS\
  \ 的表，包含 4 列，并且 `NOT NULL` 约束已施加于其中三列。这意味着你必须为这些每列指定一个值，否则将抛出错误。\n\n注意我们没有对表的 `SALARY`\
  \ 列实施 `NOT NULL` 约束。即使该列已经创建，我们也可以对该列实施该约束。\n\n```sql\nALTER TABLE MANAGERS\n  MODIFY\
  \ SALARY DECIMAL (20, 2) NOT NULL;\n```\n\n现在，该列不再接受空值。\n\n\n\n\n如果在 `INSERT INTO`\
  \ 语句中未指定列的值，此约束将为该列提供一个默认值。\n\n考虑下面的示例：\n\n```sql\nCREATE TABLE SUPPLIERS(\n  ID\
  \ INT NOT NULL,\n  NAME VARCHAR (15) NOT NULL,\n  ADDRESS CHAR (20) ,\n  ARREARS\
  \ DECIMAL (16, 2) DEFAULT 6000.00,\n  PRIMARY KEY (ID)\n);\n```\n\n假设你已经创建了表，但需要在\
  \ `ARREARS` 列上添加一个默认约束。你可以这样做：\n\n```sql\nMODIFY ARREARS DECIMAL (16, 2) DEFAULT\
  \ 6000.00;\n```\n\n这将更新该表，并为该列创建一个默认约束。\n\n如果你不再需要此默认约束，可以运行下面给出的命令将其删除：\n\n```sql\n\
  ALTER TABLE SUPPLIERS\n  ALTER COLUMN ARREARS DROP DEFAULT;\n```\n\n### 唯一约束 (Unique\
  \ Constraint)\n\n此约束有助于我们避免在某列中出现两个或多个具有相似值记录记录的可能性。例如，在“employees”（员工）表中，我们可能需要防止两个或多个员工共享相同的\
  \ ID。\n\n以下 SQL 查询显示了我们如何创建一个名为“STUDENTS”（学生）的表。我们将在 `ADMISSION` 列上实施 `UNIQUE` 约束：\n\
  \n```sql\nCREATE TABLE STUDENTS(\n  ADMISSION INT NOT NULL UNIQUE,\n  NAME VARCHAR\
  \ (15) NOT NULL,\n  AGE INT NOT NULL,\n  COURSE CHAR (20),\n  PRIMARY KEY (ADMISSION)\n\
  );\n```\n\n![](img/00138.jpg)\n\n创建良好的索引可以提高大型数据库的效率。创建索引的字段选择取决于你经常使用的 SQL 查询。\n\
  \n也许你已经创建了没有带 `UNIQUE` 约束的 `STUDENTS` 表。可以通过运行以下命令在 `ADMISSION` 列上添加约束：\n\n```sql\n\
  ALTER TABLE STUDENTS\nMODIFY ADMISSION INT NOT NULL UNIQUE;\n```\n\n下文进行了演示：\n\n\
  ```sql\nALTER TABLE STUDENTS\nADD CONSTRAINT uniqueConstraint UNIQUE(ADMISSION,\
  \ AGE);\n```\n\n该约束被命名为 `uniqueConstraint`，并分配了两个列：`ADMISSION` 和 `AGE`。\n\n每当你需要删除该约束时，运行组合了\
  \ `ALTER` 和 `DROP` 命令的以下命令：\n\n```sql\nALTER TABLE STUDENTS\n  DROP CONSTRAINT uniqueConstraint;\n\
  ```\n\n该约束将从两个列中删除。对于 MySQL 用户，上述命令将不起作用。只需运行下面给出的命令：\n\n```sql\nALTER TABLE STUDENTS\n\
  \  DROP INDEX uniqueConstraint;\n```\n\n![](img/00086.jpg)\n\n### 主键 (Primary Key)\n\
  \n主键约束有助于我们唯一地标识每一行。被指定为主主键的列必须具有唯一值。此外，该列不允许有 `NULL` 值。\n\n每个表允许只有一个主键，该主键可以由单个或多个字段组成。当我们使用多个字段作为主键时，它们被称为复合键（composite\
  \ key）。如果表的某列被定义为主主键，那么没有两个记录会在该字段上共享相同的值。\n\n主键是一个唯一标识符。在 `STUDENTS` 表中，我们可以定义\
  \ `ADMISSION` 为主键，因为它唯一地标识每个学生。不两个学生应该有相同的 `ADMISSION` 号。以下是该属性的创建方式：\n\n```sql\n\
  CREATE TABLE STUDENTS(\n  ADMISSION INT NOT NULL,\n  NAME VARCHAR (15) NOT NULL,\n\
  \  AGE INT NOT NULL,\n  PRIMARY KEY (ADMISSION)\n);\n```\n\n`ADMISSION` 已被设置为表的主键。如果你描述该表，你会发现该字段是主键，如下所示：\n\
  \n![](img/00004.jpg)\n\n在上面的“Key”（键）字段中，“PRI”表示 `ADMISSION` 字段是主键。\n\n你可能想在一个已经存在的表上施加主键约束。这可以通过运行下面给出的命令来实现：\n\
  \n```sql\nALTER TABLE STUDENTS\n  ADD CONSTRAINT PK_STUDADM PRIMARY KEY (ADMISSION,\
  \ NAME);\n```\n\n在上面的命令中，主键约束被命名为 `PK_STUDADM`，并被分配给两个列，即 `ADMISSION` 和 `NAME`。这意味着没有两个行在这些列上具有相同的值。\n\
  \n可以通过执行下面给出的命令从表中删除主键约束：\n\n```sql\nALTER TABLE STUDENTS DROP PRIMARY KEY;\n```\n\
  \n运行上述命令后，你可以描述 `STUDENTS` 表并查看它是否还具有任何主键：\n\n![](img/00062.jpg)\n\n这表明主键已成功删除。\n\
  \n### 外键 (Foreign Key)\n\n此约束用于将两个表连接在一起。有时，它被称为引用键（referencing key）。外键简单来说就是匹配另一个表中\
  \ `Primary Key`（主键）的列或列集。\n\n考虑下面所示结构的表：\n\nSTUDENTS 表：\n\n```sql\nCREATE TABLE\
  \ STUDENTS(\n  ADMISSION INT NOT NULL,\n  NAME VARCHAR (15) NOT NULL,\n  AGE INT\
  \ NOT NULL,\n  PRIMARY KEY (ADMISSION)\n);\n```\n\nFEE 表：\n\n```sql\nCREATE TABLE\
  \ FEE (\nID INT NOT NULL,\nDATE DATETIME,\nSTUDENT_ADM INT references STUDENTS (ADMISSION),\n\
  AMOUNT float,\nPRIMARY KEY (ID)\n);\n```\n\n在 `FEE` 表中，`STUDENT_ADM` 引用 `STUDENTS`\
  \ 表中的 `ADMISSION` 字段。\n\n如果在创建 `FEE` 表时没有外键，仍然可以通过以下命令添加它：\n\n```sql\nALTER TABLE\
  \ FEE\nADD FOREIGN KEY (STUDENT_ADM) REFERENCES STUDENTS (ADMISSION);\n```\n\n外键将添加到表中。如果你需要删除外键，请运行：\n\
  \n```sql\nALTER TABLE FEE\nDROP FOREIGN KEY;\n```\n\n### CHECK 约束 (CHECK Constraint)\n\
  \n此约束用于创建一种验证输入记录的条件。如果条件为假，则记录将违反约束。\n\n我们想要创建一个名为 `STUDENTS` 的表，并且不希望有小于 12 岁的学生。如果学生不符合此约束，他们将无法加入表中。表可以如下创建：\n\
  \n```sql\nCREATE TABLE STUDENTS (\n  ADMISSION INT NOT NULL,\n  NAME VARCHAR (15)\
  \ NOT NULL,\n  AGE INT NOT NULL,\n  PRIMARY KEY (ADMISSION),\n  CHECK (AGE >= 12)\n\
  );\n```\n\n该表已成功创建。\n\n如果你已经创建了没有约束的 `STUDENTS` 表，但现在需要实施，请运行下面的命令：\n\n```sql\n\
  ALTER TABLE STUDENTS\nADD CONSTRAINT CHECK (AGE >= 12);\n```\n\n约束已成功添加到 `AGE` 列。\n\
  \n你也可以为该约束指定一个名称。可以通过下面的语法实现：\n\n```sql\nALTER TABLE STUDENTS\nADD CONSTRAINT checkAge\
  \ CHECK(AGE >= 12);\n```\n\n### 索引约束 (INDEX Constraint)\n\n索引帮助我们快速地从数据库中检索数据。为了创建索引，我们可以依赖数据库表中的列或一组列。一旦创建了索引，它会在每一行分配一个\
  \ `ROWID`以便排序数据。\n\n假设我们创建了如下具有三个列的表：\n\n```sql\nCREATE TABLE STUDENTS (\n  ADMISSION\
  \ INT NOT NULL,\n  NAME VARCHAR (15) NOT NULL,\n  AGE INT NOT NULL CHECK (AGE >=\
  \ 12),\n  PRIMARY KEY (ADMISSION)\n);\n```\n\n然后我们可以使用下面的语法在列或多个列上实施索引：\n\n```sql\n\
  CREATE INDEX indexName\nON tableName ( column_1, column_2.....);\n```\n\n现在，我们需要在\
  \ `AGE` 列上实施一个索引，以便我们使用特定的年龄进行搜索。该索引可以如下创建：\n\n```sql\nCREATE INDEX age_idx\nON\
  \ STUDENTS (AGE);\n```\n\n\n\n\n\n# 关于学生（年龄）\n\n![](img/00041.jpg)\n\n## 索引\n\n\
  如果不再需要索引，可以通过运行以下命令将其删除：\n\n```sql\nALTER TABLE STUDENTS\nDROP INDEX age_idx;\n\
  ```\n\n![](img/00030.jpg)\n\n## ALTER TABLE 命令\n\nSQL 为我们提供了 `ALTER TABLE` 命令，可用于添加、删除和修改表列。该命令还帮助我们从表中添加和删除约束。\n\
  \n假设你有一张包含以下数据的 `STUDENTS` 表：\n\n![](img/00157.jpg)\n\n```sql\nALTER TABLE STUDENTS\
  \ ADD COURSE VARCHAR(10);\n```\n\n![](img/00165.jpg)\n\n当我们查询表的内容时，会得到以下结果：\n\n\
  ![](img/00057.jpg)\n\n这显示该列已经添加，并且每条记录在 particular 列中都被分配了 `NULL` 值。\n\n若要将 `COURSE`\
  \ 列的数据类型从 `VarChar` 更改为 `Char`，请执行以下命令：\n\n```sql\nALTER TABLE STUDENTS MODIFY COLUMN\
  \ COURSE Char(1);\n```\n\n![](img/00056.jpg)\n\n我们可以将 `ALTER TABLE` 命令与 `DROP TABLE`\
  \ 命令结合起来删除表中的列。要删除 `STUDENTS` 表中的 `COURSE` 列，我们运行以下命令：\n\n```sql\nALTER TABLE STUDENTS\
  \ DROP COLUMN COURSE;\n```\n\n![](img/00043.jpg)\n\n然后我们可以通过 `describe` 命令查看表详情，以确认列是否已成功删除：\n\
  \n![](img/00082.jpg)\n\n上面的图片显示该列已成功删除。\n\n# 结论与后续步骤\n\n希望你喜欢这本书，并从中从中了尽可能多的信息。如果你愿意，可以随时回到书中任何其他章节进行反复学习，以精炼你的技能。\n\
