  \ (route.length == 0) {\n    let parcel = parcel[0];\n    if (parcel.location !=\
  \ place) {\n      route = findRoute(roadGraph, location, parcel.place);\n    } else\
  \ {\n      route = findRoute(roadGrap, location, parcel.address);\n    }\n  }\n\
  \  return {direction: routes[0], memory: route.slice(1)};\n}\n```\n\n## 总结\n\n在本章中，我们接触了使用\
  \ JavaScript 的机器人。我们来到了草地场村庄，讨论了一个拥有 11 个地点和 14 条道路的村庄，然后移动到了持久化数据，在那里数据结构的行为类似于字符串且不会改变。模拟允许你将内存传递给机器人并让它们返回新的内存。\n\
