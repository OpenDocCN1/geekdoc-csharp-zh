  - 工作电压：`3.3V`\n- 输入电压：`4-16V`\n\n## Lilypad Arduino USB\n\n此板是圆形的，基于 `ATmega32u4`\
  \ Arduino 微控制器。它包含一个 `micro-USB` 连接，以便上传草稿和为板供电。它还内置了一个 `JST` 连接，这样如果你决定用电池为板供电，可以通过连接\
