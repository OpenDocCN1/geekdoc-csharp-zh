- "# 初学者计算机编程指南：5本合1：Python 编程 + SQL + Arduino + C# + Javascript，快速成为精通\n\n\n\n![](img/cover.jpeg)\n\
  \n\n\n\n\n\n\n\n\n\n## 引言\nPython 是当今最强大且对初学者友好的语言之一。近年来，它在`机器学习`、`深度学习`和`数据科学`等领域取得了越来越多的进展。《Python\
  \ 编程：零学者终极指南：通过实践练习一步步掌握 Python 编程》的目的是让这种奇的语言变得尽可能易于获取，无论你目前水平如何。在本指南的帮助下，你将很快上手，即使你对该主题一无所知。\n\
  \n书中的每一章都采用了分层设计，旨在逐步教你核心概念。此外，你不仅会学习那些让你昏睡的理论和挑战性定义。你还将并行通过大量的实践示例和练习，并练习你所学的一切。请记住，如果不练习每个概念并编写自己的代码，你将无法走远。编程不需要任何特殊天赋。你需要的只是练习、练习、更多的练习。所以，让这本书引导你吧，并确保你抽空休息进行实验并编写你自己的程序。Python\
  \ 就是未来！\n\n# 第 1 章：入门\n编程正成为从网页设计到`机器学习`等任何领域需求日益增长的技能。由于技术的重要性，它正走向日常化。虽然编程过去是人们为了获得计算机科学学位而学习的科目，但现在它通常从小学就开始教授。\n\
  \n它被广泛使用的主要原因之一是易用性。入门不需要很多东西。得益于`互联网`的力量，你只需要一台电脑和一些可以免费下载并安装的软件工具。此外，还有许多资源可以学习，以及你可以加入并学习的组织社区。\n\
  \n在本章中，你将学习为什么`Python` 是最适合入门的编程语言之一，如果这不是你的第一语言，它如何促进你的职业。此外，你将探索你所需的工具、安装它们并开始你的旅程。本章将一步步引导你，展示入门所需的一切。如果你已经熟悉任何其他编程语言（如\
  \ `C`、`C++` 或 `Java`），你可能想跳过本章或简单浏览一遍以温习知识。\n\n## 为什么选择 Python?\n`Python` 是一种多功能且强大的编程语言，由\
  \ Guido van Rossum 于 1991 年开发。作为一个冷知识，你应该知道，这种语言的名字并不是源于同名的蛇。Guido 将他的项目命名为 `Python`，是因为\
  \ Monty Python（蒙提派剧团），这是一个他非常喜欢的英国喜剧剧团。如果你也是粉丝，你将在语言的官方文档中发现几个“彩蛋”。\n\n\n\n\n自 1991\
  \ 年以来，Python 一直因其语法简单被用于向人们介绍编程，同时也用于创建复杂程序或分析海量数据。作为初学者，通过 Python 你将能够快速编写基础程序。然而，你也可以轻松地进一步扩展并将其转换为商业项目。Python\
  \ 之所以受初学者欢迎的主要原因是这种语言易于阅读和书写。它的结构类似于人类语言且易于理解，因此代码非常用户友好。这意味着你不会发现记住这门语言和结构太困难。此外，Python\
  \ 还带有很多许多库和预定义函数，你可以立即将它们添加到你的代码中。这样你就可以节省时间。在很多方面，它就像在玩乐高积。只要你掌握好节奏，学习并实践此书中的所有内容，并使用其他资源扩展你的知识，你就能写出一个十年后你也能看懂的程序。程序维护是你作为程序员职责中至关重要的一部分，但幸运的是，与其他语言相比，Python\
  \ 代码更容易管理。考虑到这一点，让我们简要探讨一下为什么你应该学习 Python 而不是其他语言的众多原因。毕竟，Python 并不是唯一能带给你你目前所学到的优势的语言。\n\
  \n### 1. 用户友好\n编程语言的目的是建立人与计算机之间的连接。Python 像 `C#` 和 `Java` 一样，是一种高级编程语言，这意味着它离计算机处理的机器语言非常远。此相反的是低级语言，通常指的是汇编语言或机器码。换句话说，Python\
  \ 接近英语。这让你在学习了规则和语法后，可以像写句子一样快速地编写代码。\n\n### 2. 强大\n有时 Python 会被轻视，因为它太容易学习了，而且通常是程序员们探索的第一门语言，无论是自学还是在计算机科学\
  \ 101 课程中。然而，Python 是一门非常强大的语言，它和 `C++` 等更复杂的语言一样多功能且高效。Python 用于 Google、微软、IBM、Xerox、NASA\
  \ 等许多公司的每个技术部门。如果你喜欢以一种更具艺术的方式练习编程语言，你甚至可以在游戏开发中使用 Python。\n\n### 3. OOP\n面向对象的编程在很多时候是解决计算机问题的最佳方案。它提供了一种将数据和动作定义为对象的方法。然而，这种编程方式并非总是必要的，但在处理大型应用程序时，它通常是最佳方法。例如，`C#`\
  \ 和 `Java` 等编程语言就是面向对象的。Python 也可以被认为是一种面向对象的语言，但这一功能是可选的。其他提到的语言并不提供这种灵活性。这意味着通过\
  \ Python，你并不非要从开始就学习面向对象的方法。这就是为什么用 Python 开始编程比用 `C++` 容易得多的原因之一。然而，你可以在触手可及的地方使用\
  \ `OOP` 的巨大优势，但仅在你真正需要的时候。如果你在编写一个基础程序，则不需要它。Python 为你提供了所需的所有力量和多功能。\n\n### 4.\
  \ 计算机友好\n你可以在任何种的计算机上运行 Python。你不需要强大的处理器和大量的内存来开始编程。你甚至可以使用像树莓派 `Raspberry Pi`\
  \ 这样信用卡大小的计算机。事实上，Python 需要的资源如此少，以至于它是用于制作 5 美元计算机操作的小型机器人的顶级语言之一。此外，Python 可运行在任何操作系统上，无论是\
  \ `Linux`、`Windows` 还是 `Mac`。你编写的程序不依赖于平台。你可以在运行 Windows 的电脑上开发应用程序，然后切换到你的 `Mac`\
  \ 上。例如，如果你完成了一个程序的创建并需要测试人员，你可以将项目发邮件给使用 `Linux` 的朋友和另一个使用 `Windows` 的朋友。程序将可以运行。\n\
  \n### 5. 语言适应性\n如果你用其他语言编写过程序，你可以在其中集成 Python。换句话说，你可以在用 `Java` 编写的程序中使用 Python。此外，你还可以将\
  \ Python 与另一种语言结合，以利用两种语言提供的优势。例如，你可以集成 `C` 或 `C++` 以受益它们提供的系统优化和速度。\n\n### 6. 它是免费的\n\
  每个人都喜欢免费的东西，Python 不会花费你一分钱。你可以根据需要无限次免费下载并安装。此外，Python 是一门开源语言，这意味着许可允许你对源代码进行修改。这意味着你可以修改\
  \ Python 然后出售你自己的版本。你现在可能对这些特性不感兴趣，但它是它如此受欢迎的原因之一。\n\n### 7. 社区\n作为一门强大且多功能的开源编程语言，带来了社区的收益。有许多在线社区致力于教学和学习关于\
  \ Python 的一切知识。你可以在在线论坛上提问，或寻求大师级程序员的建议。你还可以寻找同学并一起完成一个项目。Python 的流行在它周围聚集了庞大的群体，你应该利用这一点。\n\
  \n## 安装 Python\n在开始编程之前，你需要在你的机器上下载并安装 Python。无论你运行什么操作系统，安装过程都非常简单，但你确实需要注意几点。\n\
  \n首先，你需要前往 Python 的主页 `www.python.org` 并进入“下载”（Downloads）部分。在那里你会看到许多不同的安装程序，每一个都有不同的版本。请确保下载与你计算机操作系统匹配的安装程序，并选择最新版本。\n\
  \n下载完成后，运行安装程序并按照步骤操作。你只需接受标准设置，一旦安装完成，你就准备绪了。\n\n如果由于某些原因不想安装 Python，你可能会注意到网站主页上有某种控制台。这是一个\
  \ Python 在线控制台，你可以用它练习编程技能或尝试此书中的示例。建议你自己输入代码，即使是从书中复制的，然后尝试进行创造性编写。\n\n## 使用文本编辑器\n\
  \n\n\n\n\nIDE，全集成开发环境（Integrated Development Environment），是一个设计了许多对程序员实用的功能的程序。它具有图形化界面，并且由于自动补全和历史记录功能，使得输入代码变得快得多。无论你使用的是文本编辑器还是\
  \ IDE，编程本身都是一样的，但使用 IDE 时，你将从许多快捷键、提醒、错误指示和代码自动纠正中获益。许多 IDE 甚至会提供如何修复错误的建议。\n\n\
  有很多 IDE 可供选择，但最流行的之一是 `IDLE`。它与 Python 软件包一起提供，因此不需要执行任何额外步骤。请记住它可以在两种模式下运行，即交互模式（interactive）和脚本模式（script）。如果你希望\
  \ Python 立即对你输入的任何命令做出响应，请使用交互模式。\n\n## 你的第一个程序\n\n现在你的工具箱已经准备就绪，是时候编写你的第一个程序了。在这个示例中，我们将使用\
  \ `IDLE`，因为从开始习惯使用 IDE 非常重要，以避免未来出现任何挫败。如果你倾向于使用文本编辑器或在线 Python 控制台，尽管去吧，代码的效果是一样的。\n\
  \n现在，开始以交互模式运行 `IDLE`。你现在将看到一个被称为 Python shell 的窗口。在命令提示符下输入以下行：\n\n```python\n\
  print (“Hello World!\")\n```\n\n现在你应该能在屏幕上看到显示的结果，如下：Hello World!\n\n就是这样！恭喜你，你现在可以称自己为程序员了。现在让我们简要讨论一下这段代码。你首先会注意到的是，Python\
  \ 代码是纯正英语，易于阅读和理解。即使没有编程知识，你可能也知道这行代码的作用，因为它是自解释其义的。这就是使用 Python 的美之处所在。\n\n至于我们使用的命令，`print()`\
  \ 是一个函数，用于显示括号中编写的文本。请记住，该行需要被引号括，否则你将得到错误。此外，注意你如何输入函数，因为在 Python 中所有内容对大小写都敏感。命令\
  \ `print` 可以工作，但如果你将其输入为 `Print`，则无法运行。\n\n现在，让我们创建一个相同的程序，但这次将使用 `IDLE` 的脚本模式。不要忘记交互模式会给你即时结果，它的工作原理与在线\
  \ Python shell 相同。但是，你将无法保存程序以便以后继续进行工作。为了以后保存并编辑它，你需要在脚本模式下工作。你只需点击“文件”并选择“新窗口”即可在脚本模式下运行\
  \ `IDLE`。再次输入相同的行：\n\n```python\nprint (“Hello World!)\n```\n\n按下回车键。你会发现什么都没有发生。这是因为你正在编写一组指令，这些指令将在稍后你运行程序时执行。首先，你需要通过点击“文件”菜单中的“另存为”来保存应用程序。你会注意到，默认情况下文件的扩展名为\
  \ `.py`。务始终确保你的脚本都以这种方式保存，以便被识别为 Python 程序。现在，如果你运行程序，`IDLE` 将打开交互模式窗口并显示结果。\n\n\
  到目前，你已经使用 `IDLE` 运行了你的“Hello World”程序。然而，你通常希望你的应用程序运行像你现在正在使用的那些那样。这意味着你想要一个可执行文件，双击它就能运行。目前，如果你点击\
  \ Python 文件，一个窗口将打开然后突然关闭。你可能认为程序没有运行，因为什么都没有发生，但实际上发生了一些事情。只是速度太快，以至于你无法观察到任何具体内容。程序执行了所有的指令，这意味着它在几分之一秒内显示了消息然后自行终止。你需要做的是在程序执行完所有命令后保持程序运行，以便你可以看到结果并与之交互。但在你这样做之前，让我们花点时间讨论如何注释你的代码，使其变得易于阅读和易于理解。\n\
  \n## 代码注释与你的程序\n\n打开你的脚本并输入以下行：\n\n```python\n# Hello World!\n\n# 这是对 “print” 函数的演示。\n\
  ```\n\n如果你再次运行程序，你会发现什么都没有改变。你添加的这些行不会被作为代码执行。它们被称为注释（comments），其目的是让应用程序的代码更易于理解。你可能认为输入此类信息是浪费时间，因为作为程序员，你已经知道你的代码是关于什么的了。这可能是真的，但当你写了一个复杂的程序然后遗弃它一两周时，你在理解每个函数和变量的目的将遇到一些困难。当然，你可以阅读代码并最终弄明白一切，但那不是利用时间的正确方式。代码注释用于标记和解释复杂的函数，这样你就不需要深入研究代码本身。如果以后有其他程序员要处理你的程序，这些注释将尤为有用。想象一下，一个陌生人必须解读你对应用程序开发的个人方法。在一个大型项目中，他可能会浪费几天时间，而不是通过一些工作来进展。\n\
  \n注释由行前的井号（hash mark）定义。你打算作为注释的每一行都需要自己的标记，否则你将得到错误。如果你担心数百甚至数千条注释会导致程序效率降低，你不应该担心。它们对你的计算机没有影响，因为当执行代码时，机器会忽略所有注释且不使用额外的资源。\n\
  \n此外，为了让你的注释和代码更具读性，你可以留空行。但不要在每行代码后都这样做。在代码块或部分之间留空即可。程序会忽略空白空间。现在让我们回到你的程序。在 print\
  \ 函数之后添加以下行：\n\n```python\ninput (“\\n\\n Hit the Enter key to exit!”)\n```\n\n\
  这一行将显示打印内容的控制台，然后显示“Hit the Enter key to exit!”最后，程序将保持打开直到你按下回车键。这是保持程序运行直到用户操作的一种简单方法。\n\
  \n## 总结\n\n在本章中，我们学习了 Python 的介绍。你学习了这种编程语言的优点以及你可以用它做什么。此外，你在电脑上安装了 Python，并通过编写每个未来程序员都会构建的第一个程序进行了简单的尝试。你学习了如何使用\
  \ Python shell 或 IDE，以及在编写代码后立即进行测试。现在你知道如何使用创建程序所需的工具，并学习了代码注释的重要性。你准备好开始 Python\
  \ 学习之旅了，让我们为你的工具箱添加更多工具吧！\n\n# 第二章：软件设计周期\n\n在继续探索 Python 的语法、数据类型和函数之前，我们将暂时离开，学习程序的设计周期。\n\
  \n\n\n\n在本章中，你将学习如何获取一个问题并弄清楚如何创建一个解决它的程序。开发周期的第一个阶段是处理应用程序的设计方面。你将学习如何将所有的想法转化为微小的、可实现的目标，探索你需要解决的所有问题，并开发出一系列能够产生最佳结果的行动。在本章的第一部分，你将识别问题并开始设计你的解决方案。在这个阶段，你向自己提的每一个问题将为你提供设计粗略程序所需的所有信息，你稍后可以对其进行优化和完善。在章的第二部分，你将把设计转换为实际代码，一旦代码编写完成，你就可以进入测试和完善的循环，直到获得无错误的结果。\n\
  \n此外，你还将学习使用伪代码的技巧，它被称为设计语言。它不是实际的代码，但它可以充当指南，向你展示你下一个需要实现的目标以及你打算如何实现它。这是其他学习材料中经常缺失的一个的话题，但对于让你成为一名高效且有组织能力的程序员至关重要。\n\
  \n## 解决问题\n\n编程的核心在于以最逻辑的方式解决问题。在练习从本书和其他资源中学到的知识的同时，你将编写许多程序，然后由自己开发它们。无论你是为了兴趣创建应用程序，还是作为一种职业，你这样做都是为了解决某种问题，因为没有其他应用程序能够满足你的需求。即使你创建了另一个问题的克隆，你仍然可以在此加入你自己的特色，以根据你的喜味进行改进。你可能已经知道你想解决什么问题了，因为你已经迈出了拿起编程书籍这一大步。也许你对某个游戏有一个极佳的想法，并想与世界分享它。或者你可能想到了一个其他地方提供的服务的应用。也许你对机器人感兴趣，想建立一支军队来接管世界（`Python`\
  \ 完全可以帮上忙）。无论你的目标是什么，第一步都是开始提问。但为什么不直接开始写代码呢？因为程序是复杂的，你很容易在开发过程中迷失。例如，想象一下 J. R.\
  \ R. 托尔金在写《指环王》时，如果没有问自己自己许多关于世界、文化和居民的问题，如果没有大纲，他如何创造出如此庞大且复杂的东西呢？程序也是一样。如果你坐下来写设计，你处理项目将快得多，遇到的问题会更少，而且在故障排除和维护代码时也会更容易。\n\
  \n“我为什么要这么做？”可能是当你看到你的项目想法、函数、模块等时，脑海中浮出的第一个问题。如今，对于你所想象的几乎每件事都有相应的程序，这意味着你可以找到类似的内容并将其添加到你的项目里，而不需要从头开始编写一切。找到别人编写并共享的代码相当容易，你经常会考虑调整它。\n\
  \n脑海中浮出的下一个问题将是“有更简单的方法吗？”大多数程序员不喜欢从零开始，并记忆关于他们所选编程语言的所有已知知识。幸运的是，编程并不是要学习所有的理论、定义和代码。简化是关键。大多数程序员在设计过程中应用\
  \ `KISS` 原则，它的恰恰的意思是“保持简单，愚蠢”（Keep it simple, stupid）。你的第一个障碍是找到通往目标复杂度最低的路径。\n\n\
  ## 问题识别\n\n在开始编码之前，你需要一个想法。产生想法的最简单方法是想一个你经常执行的任务。任何重复的任务都可以通过编写脚本来实现自动化。一旦有了想法，你就面临了第一个问题。你需要找到方法使用\
  \ `Python` 向计算机传达多条指令，然后接收返回的信息。考虑到这一点，让我们来看程序的基本开发周期。只需记住，你不需要遵循任何僵化的结构。你可以为大纲添加你自己的个人特色。\n\
  \n如果没有结构作为开头，开始可能会很困难，而且在进行过程中向项目添加脚本可能会变成一种混乱的体验。幸运的是，你不需要成为专业开发人员来执行以下步骤：\n\n\
  1. **软件的目的**：通过写下你想解决的问题以及你的程序需要具备的功能来开始规划你的项目。由于你此时可能只有很少编程知识，你可以从一些非常基础的任务开始。例如，假设你需要一个向用户打印一些消息的程序。现在你已经知道了问题所在，就可以开始为解决方案进行脑风暴了。\n\
  2. **用户类型**：下一步是确定你的目标观众是谁。即使你只是为了练习而进行一个个人项目，也应该经历每一个步骤。那么，除了你之外还有谁会使用这个程序？你的朋友和家人？客户？用户与程序的交互有多频繁？用户需要具备技术知识才能使用它？你得出的所有答案都将定义你的程序的设计。如果你的用户只是只如何上网、看视频和在文字处理器中打字的普通人，你将不得不限制设计以适应目标受众。\n\
  3. **计算机系统**：你需要考虑的最后一个方面是你的目标观众最可能使用的操作系统。如果你打算让程序运行在 `Linux` 和 `Windows` 等多个系统上，你可能需要进行修改并进行额外的测试。你可能还需要考虑他们可能在使用其他哪些设备或软件。此时，你应该从宏观层面解决这些问题，以便了解未来开发过程中可能面临的情况。\n\
  \n所有这些问题都会影响你对程序设计的决策。通过现在回答这些问题，会让你的旅程更加顺畅。\n\n## 寻找解决方案\n\n现在你有了一些信息，可以继续设计过程。如果你觉得花费的时间比预想的多，不要担心。许多开发者在设计程序上花费的时间比实际编写代码的多。下一步是添加更多关于预期用户需求的信息。一旦你确定了受众，你就需要理解他们的需求。作为专业开发人员，这个阶段将涉及你与客户之间的协议。现在，你只需要查看问题并确保理解所有需要解决的内容。有时解决方案并不显而易见，你在过程中会遇到困难。然而，如果你用自然语言写了尽可能多的细节，那么将这些信息转换为代码将变得更容易，并避免潜在问题。此时是你需要考虑的一些事项：\n\
  \n1. **功能性需求**：换句话说，你正在寻找程序需要做的一切。例如，你需要你的软件打印诸如“Hello World!”之类的消息。通过以你之前开发的第一个程序作为示例，你会意识到它的主要功能需求是系统向显示器上打印消息。\n\
  \n\n\n\n\n## 2. 结果\n在某个时刻，你需要测试你的程序以查看它的运行是否符合预期。起初，只需运行应用程序并确保它正常工作可能足够了，但随着它的开发变得越来越复杂，你也将需要改进你的测试技术。在大多数情况下，创建带有预设数据的测试来观察程序的行为以及它是否给出了预期的结果就足够了。在其他情况下，只需编写一个包含数值的表格，然后查看程序在每次操作中的结果是否与这些数值匹配即可。通常，你希望随着开发的进展对软件进行测试。不要等项目完成后才开始测试。如果你这样做，当测试显示出某种错误或给出了困惑的结果时，你将花费大量时间来查明问题的原因。不过，对于现在，运行程序并查看它是否输出了你计划的输出可能足够了。\n\
  \n## 3. 维护\n在设计程序时，你需要考虑它是否会被多次使用或长期使用。打算在几年内定期使用的软件将需要支持和维护。通常，在涉及到维护时，你需要考虑两点：你需要为更新、更改和扩展做计划，并找到一种方法来跟踪任何报告的问题。此外，如果你正在开发一个基于\
  \ Web 的应用程序，你需要找到一种方法在程序运行的同时整合你的更改。为了使维护尽可能简单，你应该专注于以这种方式编写程序，让任何人都能一目了然。许多创建程序的开发者也是在整个生命周期内对其进行维护和更新的人。然而，在某些情况下，你将会有其他人为你处理这一步，或者至少在某种程度上对此做出贡献。此外，通过不要重复自己的代码来保持你的代码更加清晰。编程中的一条不成文的规则是，如果你必须重复某些信息超过一次，你需要休息一下并审视程序的设计。记住，简化会让一切变得简单得多，包括维护也如此。\n\
  \n以下是一个基于你的“Hello World”程序的软件设计文档示例：\n\n**问题**：系统需要在用户的显示器上显示一条消息。\n\n**用户**：我\n\
  \n**操作系统**：Windows / Linux\n\n**接口**：命令行终端\n\n**功能需求**：打印一行文本\n\n**测试**：执行应用程序运行测试，确保文本已显示。\n\
  \n## 开始设计\n现在你已经准备好采取应用程序设计的第一步实际步骤。最简单、最快的方法是用伪代码编写程序，你之后可以将其翻译成实际编程代码。伪代码涉及使用你自己的语言来表达一系列程序需要执行的逻辑语句和动作，以便为用户提供预期的结果。此外，它允许你对这个特定项目的编码方法进行脑风暴。例如，它可以帮助你理解为了让程序运行你需要编写哪些\
  \ `functions`、`data types` 和 `variables`。\n\n记住，现在你的伪代码可以用你喜欢的任何方式、用你自己的语言来写。然而，当你与其他程序员合作时，你需要遵循一个大家共同使用的标准。但这个标准是如何创建的？通常，在语法和规则方面，伪代码实际上与\
  \ `Python` 代码是相同的，但它不是通过一系列命令和指令编写的，而是通过词汇编写的。现在，不需要担心这些标准。你首先要掌握结构背后的概念。以下是你可以如何编写伪代码：\n\
  \n```\n## Start program\n\n## 输入两个值，X 和 Y\n\n## 将这两个值相加\n\n## 打印和和\n\n## End program\n\
  ```\n\n你会发现，所有的行都都被注释掉了，这样当 `Python` 尝试执行代码时就不会产生任何错误。在这个示例中，我们有了新程序的主设计。它是对你需要采取的所有步骤的基本描述。当你用实际代码执行其中一个步骤时，程序将执行该语句。\n\
  \n## 改进你的伪代码\n正如前面提到的，可读性是编写代码时最重要的因素之一。这在编写伪代码时同样有效。改进你代码的最佳方法之一是使用缩进。然而，记住，`Python`\
  \ 将空格和制表符（tab）都视为缩进，并且它们的解释方式不同。它们不是互换的，所以不要将它们混用。例如，你可以留出整个空行来分隔代码块或章节，这样你就可以不费眼力地识别每个\
  \ `function`。伪代码也是如此。缩进可以用于确定哪些逻辑语句或动作是归在一起的。\n\n请记住，当你编写伪代码时，需要始终对它进行注释。这意味着你可以使用任何你喜欢的缩进类型，因为它不会影响代码。然而，缩进也用于实际代码，并且有你必须遵循的某些规则，否则你的程序将没有响应，或者你会遇到错误。你将在后的章节中学习更多关于这个主题的知识。现在你应该专注于设计和伪代码本身。\n\
  \n代码块的第一行可以在没有任何缩进的情况下编写。然而，每一个属于它的动作都应该缩进到子章节中。这样，在编写 `Python` 代码时，你就知道如何逻辑性地遵循每一步了。现在，你可以创建任何你结构，但随着你学习\
  \ `Python` 代码和语法，你将开始遵循相同的规则来编写伪代码。现在，让我们来看一个改进后的伪代码块：\n\n```\n## 执行第一个任务\n\n##\
  \ 输入第一个值\n\n## 验证该值是否为文本\n\n## 打印该值\n```\n\n如你所见，在编写伪代码时使用缩进会让你的目标更加清晰。接下来，你可以添加空行来分隔此块和下一个块，并以相同的方式编写。就是这样！现在你可以开始编写你列出的每个目标了。\n\
  \n## 总结\n在本章中，你学习了软件设计周期以及如何创建 `Python` 程序。在此过程中，你还识别了通过将问题拆分为一系列目标和任务来发现并分析问题的方法。此外，你学习了伪代码在开发过程中的重要性。本章目的是让你理解计划和概述思路的重要性，以便在编写程序时避免问题和困惑。现在你已经准备好了知识和工具来学习更多关于\
  \ `Python` 本身及其语法的内容。\n\n\n\n\n当你编写代码时，你需要能够通过观察其标识符或标签来清晰地理解和识别每类型数据。你可以将标识符定义为没有被注释掉、也没有写在引号内（以转换为纯文本）的单词。标识符用于命名以提高代码的可读性，前提是你使用了与项目和变量相关的适当名称。只需确保不要尝试对多个变量和函数使用相同的标识符，否则你将导致代码出现冲突，并产生混乱的结果。请始终关注使用唯一的标识符。\n\
  \n请记住，你可以使用几乎你能想到的任何单词，但有很多单词是 Python 保留的，你不能将它们作为标识符。它们是编程语言本身的一部分，不能作为标签。这些单词被称为关键字。以下是许多此类单词：`False`、`lambda`、`class`、`import`、`global`、`while`、`yield`、`continue`\
  \ 等。幸运的是，你不需要立即学习所有的。通过练习你最终会记住它们，但在那之前 Python 会帮助你。如果你将关键字之一用作标识符，Python 会警告你并要求你更改名称。\n\
  \n既然如此，让我们具体看看如何命名你的变量。当你给变量标记时，应该始终以下划线或字母开头。虽然这不是铁成不变的规则，但它是大多数程序员遵循的通用的命名规范。请记住，你也可以在标识符中使用数字，只要它不以数字开头即可。此外，Python\
  \ 是一种大小敏感的编程语言，因此在使用小写或大写字母时你应该始终注意，因为它们是不同的。例如，你可以将变量命名为 `newVariable`、`NewVariable`、`NEWVARIABLE`\
  \ 和 `_newVariable`，它们会被视为完全不同的变量。此外，你应该整个项目中坚持使用这些命名方法之一。如果你选择使用下划线命名变量，那么你应该对所有其他变量也采用相同的方法。这将防止你和其他任何程序员在查看代码时产生任何形式的困惑。\n\
  \n# 变量简介\n\n在大多数编程语言中，定义变量分为两个阶段。第一阶段被称为初始化阶段，涉及创建一个你用适当标识符进行标记的容器。第二阶段是赋值，涉及放置一个值。实际上，这两个阶段都是通过单一操作完成的。它的样子如下：\n\
  \n```\nvariable = value\n```\n\n如你所见，初始化和赋值都是通过等号完成的。\n\n实现某种功能的代码块被称为语句。赋值就是一个例子。另一方面，我们还有表达式，即你可以对其进行求值以获得值的代码。这里有一个赋值语句列表中包含表达式的示例。\n\
  \n```\nnumber = 0\nproduct_weight = 2.1\nprice_per_kilogram = 10\nfilename = 'file.txt'\n\
  trace = False\nsentence = \"this is an example\"\ntotal_price = product_weight *\
  \ price_per_kilogram\n```\n\n编程时，你需要尽可能保持有序。每条语句写在一行。在这个例子中，我们有一个简单的列表。它看起来非常像购物清单。当你编写程序时，需要做的第一件事之一就是定义你将要使用的变量。一旦定义了它们，你就可以对它们执行各种任务。\n\
  \n目前你应该知道变量有不同的形状。它们可以是字符串（文本）、列表、数字、字典或布尔值。这些类型构成了一个程序。它们是你食谱中的配料。然而，在我们开始探索每种变量类型之前，让我们暂时旁而讨论一下动态类型。\n\
  \n## Python 与动态类型\n\n在 Python 中，变量的值是自动确，这意味着你在编写代码时不需要自己定义它。这被称为动态类型。请记住，这与你的打字技巧无关。其他编程语言要求你声明变量是数字、列表还是字典。这意味着你可以专注于代码，而无需思考你正在使用什么类型的数据。你唯一关心的是如何使用它以及确保它执行你希望它做的事情。\n\
  \n请记住，在不被强制声明变量的情况下，你有时可能会在没有察觉的情况下在整个代码中添加各种变量。动态类型的缺点是 Python 不会提醒你，除非你没有为其中一个变量声明任何值。初学者往往苦于跟踪他们的变量以及在何处赋值的值。幸运的是，当你有很多变量时，你可以做两件事来避免这种耗时的情况。你应该做的第一件事是在使用这些变量的代码块开头声明它们的值。这样你就可以将所有变量及其值一起保持在一个部分中。第二个选项是编写你的设计文档。如果你正在处理大量变量，可以创建一个表格，将所有变量及其值一起声明出来。这样你就可以随时跟踪它们。通过这两种方法彻底了解你的变量，将允许你以后解决任何错误并维护你的代码，而不会经历剖析代码时那种挫败感。\n\
  \n动态类型的另一个优势是它允许 Python 标记任何使用错误类型值的变量。如果你对它们执行无效操作，你将收到 `TypeError`。这里有一个示例：\n\n\
  ```\nx = 2\ny = 'text'\ntrace = False\nx + y\nTraceback (most recent call):  \n\
  \  File \"<stdin>\", line 1, in <module>\nTypeError: unsupported operand type(s)\
  \ for +: 'int' and 'str'\n\ny - trace\nTraceback (most recent call last):\n  File\
  \ \"<stdin>\", line 1, in <module>\nTypeError: unsupported operand type(s) for -:\
  \ 'str' and 'bool'\n```\n\n虽然你可能还不理解某些代码，但你会注意到 `x` 变量是数字而 `y` 变量是文本。声明之后，我们尝试计算这两个变量的和。结果自然是错误。你不能将单词或句子相加或对数字进行算术运算，但你不能将它们混合。因此，在这个示例中，你会看到一种被称为\
  \ traceback（回溯）的东西。这是 Python 在告诉你你的程序逻辑存在问题。\n\n\n\n字符串是 Python 中以及通用编程中最常见的数据类型之一。在你创建第一个程序时就已经用过它了。在“Hello\
  \ World”示例中，你学习了如何使用 `print` 函数在显示器上打印一行文本。请记住，你也可以使用同一个函数来打印变量赋值的值以及字符字符串。然而，在你的程序中，只有一个\
  \ `print` 语句。现在问题是，你如何在一行中打印多个语句？如果你继续使用程序中使用的基本方法，你会发现你需要每行单独打印一个语句。让我们为你介绍一下**字符串拼接**（string\
  \ concatenation）的概念。在这种情况下，拼接简单指的是将文本字符串连接在一起。你可以通过几种方法实现这一点。这里有一个通过逗号分隔值来实现的示例：\n\
  \n```python\ncharacterClass = “warrior”\ncharacterGender = “male”\nprint (characterGender,\
  \ characterClass)\n```\n\n输出将是“male warrior”。\n\n还有其他方法可以将文本片段合并成一行。例如，如果你拼接的是字符串本身而不是代表它们的变量，你甚至可以省略逗号。方法如下：\n\
  \n```python\nprint (“male” “warrior”)\n```\n\n输出将是“malewarrior”。请记住，当你使用这种方法时，如果需要空格，需要在字符串内部包含一个空格，否则两个字符串将像这个示例一样没有空格地合并。这是添加空格的方法：\n\
  \n```python\nprint (“male ” “warrior”)\n```\n\n现在结果将是“male warrior”。然而，如果你用这种方法将字符串与变量拼接，就会遇到问题。发生的情况如下：\n\
  \n```python\nprint (characterGender “warrior”)\n```\n\n结果看起来像这样：\n\n```python\n\
  File \"<stdin>\", line 1\nprint (characterGender “warrior”)\n^ SyntaxError: invalid\
  \ syntax\n```\n\n如你所见，如果你尝试在没有任何分隔的情况下将字符串连接到变量，就会得到语法错误。这种方法你只能将两个独立的字符串写入一行，因为这基本上和写一个字符串是一样的。\n\
  \n组合字符串的另一种方法是使用运算符，即加号。在这种情况下，它被称为拼接运算符，它的工作原理类似于方程中使用的算术运算符。这是一个示例：\n\n```python\n\
  x = “male”\ny = “warrior”\nx + y\n```\n\n结果将是“malewarrior”。\n\n请记住，由于加号用于解决数学问题，如果你用这种方式拼接字符串，将迫使\
  \ Python 在后台进行更多工作。这意味着如果你的项目相当大并且使用该运算符执行多次字符串拼接，你的程序将向计算机索要更多资源。这是一个完美的例子，说明了你需要在编写代码之前如何考虑项目的设计。如果你需要拼接许多字符串，你应该使用不涉及此类操作的其他任何方法。\n\
  \n### 引号\n\n在 Python 中，引号具有重要作用。正如你可能从之前所有的示例中推断出的那样，它们被用来标记字符和单词为文本。一个字符被定义为任何单个字母、标点符号、数字甚至空格。文本实际上是一个字符串，因此该变量类型被称为“string”（字符串）。为了将文本与\
  \ Python 命令和关键字隔离开，你需要将其括在引号中。到目前为止，你一直双引号，但在 Python 中，你有超过一种方法可以实现相同的效果。\n\n你可以像在“Hello\
  \ World”程序中那样用双引号括起单行字符串，也可以改用单引号。以下是两个示例：\n\n```python\nprint (“double quote string”)\n\
  print (‘single quote string’)\n```\n\n这两个示例的读取方式是相同的。Python 认为这两种方法没有区别，因此你可以使用任何你喜欢的方法。但当你有一个字符串文本块且它占据很多行时该怎么办？在\
  \ Python 中，你可以使用块引号，它可以包含多行，包括换行和其他空格。你有以下两个选项：\n\n```python\nx = ''''''      this\
  \ is a long line of text\nthat requires multiple lines’’’\ny =””” this is another\
  \ long line of strings\nbut this time we’re using double quotes\nbecause they’re\
  \ cooler ”””\n```\n\n如你所见，两种方法都实现了相同的功能。与单行示例一样，你可以使用双引号或单引号。只要你在字符串开始处使用三个，在字符串结束处再使用三个，这完全取决于偏好。\n\
  \n现在问题是，当你必须在文本字符串中使用实际引号时该怎么办？简单来说，你必须使用不同的引号。例如，你可以用双引号标记字符串，并在内部使用单引号来标记真实的引号。它看起来像这样：\n\
  \n```python\nx = “She told me to ‘quote’ like this”\n```\n\n在这个示例中，看起来我们有一个引用层级结构，双引号标记了字符串的结束而不是单引号。单引号之间的文本变成了主字符串的子字符串。这种引号被称为**嵌套引用**（nested\
  \ quote）。但如果你想在引号内的引号内再加引号呢？这可能是一个不太可能的场景，但在使用三引号标记多行字符串时，你可以同时使用单引号和双引号。\n\n###\
  \ 开发文本应用程序\n\n现在你已经了解了一些软件设计，并对文本和字符串有了基本的理解，是时候将你的知识付诸实践了。我们将创建一个简单的脚本，生成关于多个角色的信息。我们将为他们的名字、性别、种族和描述创建变量，这些变量将存储值。\n\
  \n你已经拥有所需的知识，因此在查看示例之前，你应该尝试开发你自己的程序。考虑到这一点，它看起来像这样：\n\n```pythonmy.py\n\nProblem:\
  \ Generate information on roleplaying characters\nTarget audience: Personal / Friends\
  \ and family\nSystem: Windows / Linux\nInterface: Command Line\nFunctional requirements:\
  \ Print a character sheet.\nUser will input name, gender, race and description.\n\
  Test: Basic execute test.\n\nName = “”\nGender = “”\nRace = “”\nDescription = “”\n\
  \n## Prompt user for information\nName = input (‘what is your name? ‘)\nGender =\
  \ input (‘what gender are you? (male / female / not sure): ‘)\nRace = input (‘what\
  \ race are you? (Human / Elf / Orc / Dwarf / Gnome): ‘)\n\n## Output character sheet\n\
  cool_line = ‘<__==|#|==\\$/**++--==|#|==__>\n\nprint(\"\\n\", cool_line)\nprint(\"\
  \\t\", Name)\nprint(\"\\t\", Race, Gender)\nprint(\"\\t\", Description)\nprint(cool_line,\
  \ \"\\n\")\n```\n\n这个程序是“Hello World”的增强版本。我们使用了相同的概念和技术，增加了一些细节。首先，我们包含了设计文档以便始终记住程序的目的。其次，我们使用了一些转义序列，例如\
  \ `\\t` 和 `\\n`。这些序列用于格式化文本，以便对其进行组织并更容易阅读。\n\n### 数字\n\n给变量赋值数字与赋值字符串或任何类型的值没有区别。让我们来看一个示例：\n\
  \n```python\nx = 5\ny = 2\n```\n\n\n\n在这种情况下，Python 会自动检测到数字字符而不是字母或标点符号，并确定它正在处理一个数字，即整数。请记住这一点，这样你就永远不会编写以数字开头的变量名。现在在我们继续学习数字之前，你只需要对计算机的工作原理有一个基本的了解。\n\
  \n数据是以 0 和 1 的序列存储的，这意味着二进制。所有这些信息通过触发大量只有两种状态（开启或关闭，换句话说就是 `0` 和 `1`）的开关来处理的。然而，其中还有很多细节，但对于操作\
  \ Python 和在运算中使用数字来说，你只需要知道这些。话如此，以下是你将经常会使用的数字类型：\n\n1. **整数 (Integers)**：在编程和数学中，整数有一个专门的名称，那就是整数。如果包含小数点，它就不再是整数了。然而，它们可以是负数、正数或零。整数经常用于许多操作。\n\
  2. **浮点数 (Floats)**：这些数字带有小数点。如果说 `1` 是整数，那么 `1.1` 就是浮点数。和整数一样，它们也可以是负数或正数。它们以相同的方式赋值给变量。简单来说，如果任何数字带有小数点，Python\
  \ 都会自动将其视为浮点数，你不需要做任何其他操作。\n3. **布尔值 (Booleans)**：这是最基础的数值类型，它与计算机的工作方式有关。布尔值只能有两个值：`True`\
  \ (1) 或 `False` (0)。程序员将它们与逻辑运算符（如 `and`、`or` 和 `not`）一起使用。我们将在另一个章节中详细讨论。通过使用 Python\
  \ 的 `True` 或 `False` 关键字为变量分配布尔值。确保第一个字母始终大写，否则含义将无法保留。\n\n## 基础操作 (Basic Operations)\n\
  \n你已经知道如何给变量赋值，现在让我们执行一些操作来处理它们。数字数据的处理是通过使用你在小学时期学过的相同操作完成的。你可以加（`+`）、减（`-`）、乘（`*`）和除（`/`）。执行这些操作中的任何都会创建一个表达式，表达式是计算机需要处理的代码，以获得结果（值）。可以使用语句将表达式赋值给变量。这里有几个例子：\n\
  \n```\nstrength = 10 + 2\ndexterity = 10 - 4\nendurance = 6 * 2\nawesomeness = strength\
  \ + dexterity * endurance\nawesomeness\n84\n```\n\n你可能看到了这个输出并眨了两次眼睛，因为你预期的结果是 `216`。难道\
  \ `12 + 6 = 18` 乘以 `12` 不等于 `216` 吗？答案不是，因为计算过程如下：`(10 + 2) + ((10 - 4) * (6 * 2))`。Python\
  \ 知道处理每个操作时遵循的规则。\n\n这个示例演示了 Python 如何评估特定的表达式，然后决定它的哪些部分与其他部分结合。那么，你如何知道它的内部决策过程呢？简单来说，操作是有顺序的，这被称为运算符优先级（operator\
  \ precedence）。你可以将其视为一条告诉 Python 哪个运算符优先的规则。如果你不想让 Python 使用关于运算符的默认规则，你应该换方式输入代码。这里有一个例子：\n\
  \n```\nawesomeness = (strength + dexterity) * endurance\n```\n\n现在结果是 `216` 了。\n\
  \n到目前为止，我们在示例中只使用了整数值，但你可以简单地将它们替换为浮点数，一切的工作原理完全相同。\n\n在 Python 中，你还可以将一种数值类型转换为另一种类型。以下是最重要的几种：\n\
  \n1. 将任何数字转换为整数：`int(x)`\n2. 将任何数字转换为任何浮点数：`float(x)`\n3. 将任何值转换为字符串：`str(object)`\n\
  \n如你所见，我们现在处理的是函数而不是运算符，你可以通过语法的变化判断出来。在这里，我们处理的值在容器中（由括号决定），即它是函数的一部分。这里是这些转换实际运行的示例：\n\
  \n```\nfloat(12)\n12.0\nint(10.4)\n10\nfloat(int(15.5))\n15\n```\n\n现在你已经有了关于数字数据的足够知识，让我们创建一个简单的数字应用程序，并应用你到为止学到的所有知识。\n\
  \n## 开发一个数字应用程序 (Developing a Number Application)\n\n如果你期待继续你的角色生成程序，你可能还要等一下，因为你需要学习如何比较值和存储数据。换句话说，你需要学习条件语句如何工作，并处理比字符串和数字稍微复杂的数据类型。然而，在追求这些知识之前，你首先需要理解如何使用简单的数学数据类型。\n\
  \n现在让我们在一个简单的示例中使用数学。假设你正打算购买材料来为你的奇幻房屋制作一些定制窗帘。你的第一个问题是知道需要多少材料。\n\n你需要做的第一件事是确定具体的问题，即弄清楚你需要多少材料，你可以根据窗户的大小来计算。然后你需要建立功能性需求，即你需要输入窗户尺寸，并获得你需要购买的材料数量以及成本。下一步是进行研究。请记住，作为软件开发人员或程序员，你经常必须研究你一无所知的领域。在这种情况下，你必须利用你的在线搜索技能来学习如何这样做。\n\
  \n程序看起来应该是这样的：\n\n```python\n## 一卷材料宽度为 150 cm\n## 每米材料的价格为 10 个货币\nmaterial_width\
  \ = 150\nprice_meter = 10\n\n## 提示用户输入以厘米为单位尺寸\nwindow_height = input(' 你的窗户高度是多少(cm):\
  \ ')\nwindow_width = input(' 你的窗户宽度是多少(cm): ')\n\n## 卷边需要额外的材料\n## 将字符串转换为浮点数\n\
  ## 如果不转换，将无法进行数学计算\ncurtain_width = float(window_width) * 0.75 + 20\ncurtain_length\
  \ = float(window_height) + 15\n\n## 计算你需要多少材料\n## 计算是以宽度为单位进行的\nwidths_of_cloth\
  \ = curtain_width / material_width\ntotal_length = curtain_length * widths_of_cloth\n\
  \n## 材料数量翻倍，因为我们有两扇窗帘\n## 记得除以十以计算米\ntotal_length = (total_length * 2) / 10\n\n\
  ## 计算价格\nprice = total_length * price_meter\n\n## 打印结果\nprint(\"你需要\", total_length,\
  \ \"米布料，价格为\", price)\n```\n\n\n\n\n\n请注意，这里的数字并不准确。如果你对窗帘和面料有经验，或者愿意进行必要的研究，你可以获得准确的结果。然而，为了演示的目的，数字本身并不重要。\n\
  \n## 总结\n\n在本章中，你学习了变量以及如何为它们赋值。你探索了基础数据类型，如字符串、整数、浮点数，并练习了它们之间的几次数学运算。此外，你还学习了如何组合字符串以及将一个值转换为另一个值。现在你有足够的信息来创建一个简单的程序，从用户那里获取信息以执行任务。此类应用程序可能非常基础，但随着你的不断进步，你可以不断扩展它们。在下一章中，你将学习如何比较值，并教程序根据这些比较自主做出决策。\n\
  \n# 第 4 章：Python 中的决策\n\n到目前为止，你学习了使用 Python 和设计应用的基础知识。你已经拥有足够的编程知识来处理数字和文本字符串，并可以使用这些简单的数据类型创建有趣的小程序。更重要的是，你现在知道如何设计程序以及如何从一开始就对其结构化，以便在整个开发阶段拥有可以实现的里程碑。接下来，你需要学习如何改进你的设计，并为你的程序添加急需的功能，这些功能只有通过\
  \ Python 提供的更复杂特性来实现。\n\n你对 Python 编程学习得越多，你设计更复杂程序以解决更复杂问题的能力就越强。随着你的进步，你应该经常回顾旧程序，并看看可以做什么来改进它们。更新和改进程序是任何程序员技能包的一部分，但最重要的是，你将注意到自己的进步以及你思维方式的改变。\n\
  \n考虑到这一点，在本章中，我们将探索许多可以改进你迄为止所做一切工作的方法。你将学习如何比较值，然后指示程序根据该结果做出决策。对于每一个决策，将采取不同的行动。这将允许你创建出灵活得多的程序，这些程序具有有限的自主思考能力。它们能够评估情况并在若干可用选择中做出其一。然而，选择也伴随着复杂性。这意味着随着代码不断增长为更大的脚本，你需要调整管理代码的方式。此外，在本章结束时，你还将将学习如何使用循环的力量。\n\
  \n## 条件语句\n\n我们之前讨论的上一个应用程序可能是很有用的，但目前它并不准确，并且缺少某些功能。此外，代码中存在一些逻辑问题，我们需要解决它们以改进程序。获得更高准确结果的最佳方法之一就是使用值比较。如果我们可以比较值，我们就可以指示程序根据结果采取不同的行动。这就是条件语句的用途。\n\
  \n条件语句为程序增加了一层复杂性。到目前为止，我们拥有的只是产生特定结果的命令列表。然而，条件语句允许通过赋予脚本有限的自主思考能力来将其提升到下一个水平。换句话说，如果满足了特定条件，程序将执行某操作。以下是整个过程在伪代码中的形式：\n\
  \n```\n如果条件为真:\n执行这些操作；\n\n如果此条件为真:\n执行另一组操作；\n\n如果此条件为假:\n什么都不做；\n```\n\n听起来很有逻辑，不是吗？将你的想法写成伪代码非常有帮助，你应该始终养成这种习惯。此外，我们在这个示例中的伪代码与\
  \ Python 代码（以及其他几种编程语言）中条件语句的写法非常相似。正如你所见，条件语句遵循简单的逻辑结构：如果 `x`，那么 `y`。\n\n然而，在我们深入研究条件语句之前，你应该知道有几种方法可以强制执行条件。你可以使用任何可用的比较运算符来比较值，即：\n\
  \n1. 小于：`<`\n2. 小于等于：`<=`\n3. 大于：`>`\n4. 大于等于：`>=`\n5. 等于：`=`\n6. 不等于：`!=`\n\n所有这些运算符对数据都有不同的影响，你可以以多种方式使用它们。你甚至可以通过简单的改变逻辑，使用不同的运算符编写相同的条件语句。只需记住，条件语句会给你一个真或假的答案。让我们用数字来看几个例子：\n\
  \n```\n5 < 9\nTrue\n\n-10 >= 10\nFalse\n\n5.5 != 5.5\nFalse\n\n23.56 > 78.2\nFalse\n\
  ```\n\n现在，让我们通过先给变量赋值来查看一个条件表达式：\n\n```\nmyVariable = 10\nmyVariable == 10\nTrue\n\
  ```\n\n注意等号，因为如果我们只有一个等号，它意味着我们正在给变量赋值。当我们连续使用两个等号时，我们是在比较两个值。结果是 True 或 False，取决于这两个值是否相等。许多程序员在开始学习时会混淆这两个符号的作用。幸运的是，如果你使用了错误的符号（例如使用赋值运算符而不是比较运算符），Python\
  \ 将抛出语法错误，你就知道该怎么做了。然而，请记住，如果你在应该使用赋值运算符时使用了比较运算符，你的程序可能仍然可以运行而不显示任何错误。在这种情况下，问题在于你很可能会收到错误的值，这可能导致整个程序受到损害并给你错误的结果。\n\
  \n## 控制流\n\n在大多数情况下，开发应用程序时，你需要能够选择代码段执行的顺序。这就是为什么我们有控制流语句，它们通过评估单个语句和指令来确定它们应该如何执行。到目前为止你主要在比较值，但创建条件语句需要这些结果，而条件语句实际上是一种控制流语句。它们被用于允许程序根据满足的条件启动某些操作。\n\
  \n在 Python 中，以及一般的编程中，我们通过使用以下关键字创建条件语句：`if`、`elif`、`else`。记住，如果你熟悉其他语言，你会发现在 Python\
  \ 中没有 `then` 关键字。话虽如此，让我们来看条件语句的语法：\n\n```\nif condition:\n#执行此操作\nprint “此条件为真”\n\
  \nelif condition != True:\n#否则执行此\nprint “此条件不真”\n\nelse:\n#如果没有满足任何条件，则执行默认操作\n\
  print “此条件既不真也不假”\n```\n\n\n\n\n如你所见，这种语法非常直观且易于理解，因为即使你没有意识到，你已经在用这些术语思考了。现在，让我们来详细拆解。我们的示例从一个\
  \ `if` 条件开始，紧接着是给出结果的表达式。下一个语句是 `elif`，代表“else if”（否则如果）。只有当第一个语句被判定为假（false）时，程序才会评估此语句。最后，我们有\
  \ `else` 语句。如果之前的所有语句未能通过测试，这最后一个语句将作为默认值，或者捕获任何不符合我们所设条件的数据。这样，如果发生了你未考虑到的情况，你的程序也会继续运行，而不会因为需要满足特定条件而报错。请记住，在\
  \ Python 中，你不一定非要使用 `elif` 或 `else` 语句。在某些情况下，你希望在条件满足时不让程序执行任何操作。因此，你只需要 `if` 语句即可。此外，你可以编写任意数量的\
  \ `if` 语句来包含更多选项。\n\n### Python 中的缩进\n\n现在，注意我们示例中的缩进。在 Python 中，缩进至关重要，如果你不遵守缩进，运行代码时就会得到错误。与其他依赖大括号的编程语言不同，Python\
  \ 不使用任何形式的标点符号来建立代码块。如果不遵守缩进，你会从解释器处得到如下错误：\n\n```python\nif x:\nprint (x)\n\nx\
  \ + 1\n\nindent = “terrible”\n\nFile “<stdin>, line 4\nindent = “terrible”\n^\n\
  IndentationError: unindent does not match any outer indentation level\n```\n\n###\
  \ 条件语句的重要性\n\n条件语句的重要性不容忽视。它们赋予程序验证数据的能力，并确保数据符合开发者预期的状态。这种检查被称为“验证”（validation）。想象程序在查看某个项目时拥有一份内部检查清单。它查看每一个特征和属性，如果正常则打上一个勾。使用条件语句来验证所有数据是否已提供、数字是否在某个范围内、数据类型是否是我们需要的等。进行检查是编程最重要的部分之一，无论你用哪种编程语言编写代码，你都会为此原因使用条件语句。\n\
  \n## 错误处理\n\n到目前，你的 Python 脚本非常简单，只需要基础的运行测试。然而，随着你的程序变得越来越复杂，你将需要改进测试以确保你的设计有效。最流行的方法之一是使用跟踪表（trace\
  \ table）来发现项目中的问题。跟踪表用于测试你的算法或程序是否存在任何类型的逻辑错误。它们的作用基本上是模拟应用程序执行的每一步。每个语句都会逐一进行评估。一个简单的跟踪表看起来如下：\n\
  \n| 步骤 | 语句 | 注意事项 | variable1 | variable2 | condition1 | condition2 |\n|---|---|---|---|---|---|---|\n\
  | 1 | | | | | | |\n| 2 | | | | | | |\n| 3 | | | | | | |\n\n现在，我们将回到我们的窗帘应用程序，看看我们哪里错了。我们将跟踪整个应用程序执行过程中的变量值和语句。我们的跟踪表头将用程序中的变量和条件的名称替换。理想情况下，你希望使用不同的数据集进行多次跟踪，以尝试找到每种替代方案和可能性。请记住，在大多数应用程序中，最令人麻烦和耗时的错误是由于异常值（anomalous\
  \ values，也称为关键值）引起的。这些值不受应用程序支持且无法使用。这就是为什么你应该尽早针对这种频繁出现进行测试，以暴露任何大的设计缺陷。\n\n以我们的窗帘示例为例，最重要的值是材料宽度，设置为\
  \ 150 cm。如果我们为卷边留出 20 cm，那么我们可以为窗帘选的最大单幅材料宽度就是 130 cm。对于任何比这更大的尺寸，我们都需要将两幅或更多宽度的材料缝在一起。根据我们的估算，窗帘需要占据窗户宽度的四之三，这意味着一个宽度的材料最多只能覆盖\
  \ 170 cm。这意味着对于较大的窗户，我们需要计算多个宽度。此外，你还需要问自己，如果窗户的宽度比深度大怎么办？这意味着你可以转动材料，提供 15 cm 的卷边空间。然而，窗户的高度必须小于\
  \ 125 cm。如你所见，我们有几个条件需要考虑。为了验证这些条件，简单的方法是为可能的窗户尺寸创建一组值，例如 100 比 100、100 比 200 等。此外，你还必须手动计算结果，以确保程序输出有效结果。让我们来计算一下：\n\
  \n1. 从第一个情况开始，我们取 100 x 100 作为测量值，由于明显的原因，我们不需要担心宽度或高度。如果考虑到卷边，我们需要 115 x 95 cm\
  \ 的材料。现在，请记住，这里有两个额外的情况，因为我们测量的是宽度或长度。\n2. 在第二个示例中，如果窗户是 100 x 200 cm，窗帘需要 150 cm。如果我们选择长度，我们需要更多的材料。\n\
  \n## 跟踪表实现\n\n现在我们有了一些信息，让我们创建一个跟踪表并对比数据。只需使用 `print` 函数，它看起来像这样：\n\n```python\n\
  ## 为跟踪表添加表头\nprint()\nprint(‘twidth\\theight\\twidths\\toal\\tprice’)\n\n## 考虑卷边\n\
  ## 在任何操作之前，你需要将字符串转换为数字变量\n## 如果你不这样做，由于对文本使用数学运算符将会报错\ncurtain_width = (float(window_width)\
  \ * 0.75) + 20\nprint('\\t', curtain_width)\n\ncurtain_length = float(window_height)\
  \ + 15\nprint('\\t\\t', curtain_length)\n\n## 接下来，你需要确定需要多少幅的材料\n## 并计算每个窗帘所需的布长\n\
  ## 保持所有测量单位为厘米\nwidths = curtain_width / roll_width\nprint('\\t\\t\\t', widths)\n\
  \ntotal_length = curtain_length * widths\nprint('\\t\\t\\t\\t', total_length)\n\n\
  ## 不要忘记你有两面窗帘。\n## 将材料翻倍并除以 10，将结果从厘米改为米\ntotal_length = (total_length * 2) / 10\n\
  ```\n\n\n\n\n```python\nprint('\\t\\t\\t\\t', total_length)\n```\n\n## 现在我们需要计算总价\n\
  \n```python\nprice = total_length * price_per_metre\nprint('\\t\\t\\t\\t\\t', price)\n\
  ```\n\n到这里就结束。请记住，我们使用了数量制表符空格 `\\t` 来分隔变量列并安排我们的追踪表。现在我们已经拥有了所需的一切，可以对设计进行测试了。结果应该如下所示：\n\
  \n输入窗户高度 (cm): 100\n输入窗户宽度 (cm): 100\n\nwidth      height      widths      total\
  \       price\n95.0\n115\n0.678571428571\n78.0357142857\n15.6071428571\n78.0357142857\n\
  \n你需要 `15.6071428571` 米布料来制作 `78.0357142857`。\n\n现在我们有了第一次测试，可以发现几个问题。首先，我们的结果不准确，因为转换成米的计算不精确。你应该能够轻松地修复这个问题。此外，我们的小数位太多了，因为在涉及到窗帘和面料时，我们的数字并不需要那么精确。为了解决这个小微问题，我们应该使用\
  \ `round` 函数。它将接受两个参数：我们需要从中删除若干小数点的数字，以及我们想要保留的小位数。在这种情况下，我们确实不需要超过两位小数。但请记住，我们四舍入的是显示的数字，而不是程序内部执行的实际计算。我们不想更改实际值，因为那可能会导致其他问题和更多错误。现在，如果你进行这些小修改后进行另一次测试，结果应该像这样：\n\
  \n你需要 2.92 米布料来制作 14.59。\n\n虽然我们成功改进了结果，但如果我们真的去购买这些数量的材料，可能还是会短一些。由于某种原因，结果比预期的要小。结论是，我们需要确切地知道期望什么样的值，以便确认程序运行正常并提供准确的结果。如果不多次运行测试，几乎不可能让计算精确到对他们真正有用的程度。然而，虽然我们的发现结果令人沮丧，但看到结果与预期之间的差异可以帮助我们找出发生了什么。你现在应该花几分钟时间检查程序，多运行几次测试，并尝试看看哪些没有按预期工作。应用程序的设计需要一些微调，所以让我们看看能做些什么。\n\
  \n## 添加条件判断\n\n改进我们程序的下一步是应用条件条件语句。理想情况下，我们需要赋予程序以超过一种方式测量布料的能力。例如，如果窗帘的长度小于面料卷的宽度，那么我们可以翻转它并仅使用一个幅宽。但如果窗帘需要比面料卷允许的更长且更宽呢？假设我们需要的材料量少于卷宽的一半。这意味着我们必须再买一卷同样长度的材料。然而，如果我们需要超过一半，就必须额外购买两卷。我们刚刚描述的情况就是我们需要编码到程序中的条件。像往常一样，让我们开始将所有这些想法转化为伪代码，但这次要模拟真实的\
  \ Python 语法：\n\n```python\nif curtain width < roll width:\n    total_length = curtain\
  \ width\nelse:\n    total_length = curtain length\n\nif (curtain width > roll width)\
  \ and (curtain length > roll width):\n    if extra material < (roll width / 2):\n\
  \        width +=1\n    if extra material > (roll width / 2):\n        width +=2\n\
  ```\n\n下一步是计算窗帘宽度包含多少个卷宽，以及确定确定一个宽度需要多少面料。这里有一种执行计算的简单方法：\n\n```python\nwidths =\
  \ int(curtain_width/roll_width)\nadditional_material = curtain_width%roll_width\n\
  ```\n\n我们只需要一个整数函数来去掉小数部分，然后通过取模运算符确定我们有多少额外的材料。现在，你可以利用到目前为止所获得的所有知识将这些部分缝合在一起并改进你的程序。\n\
  \n此外，你应该考虑通过应用不同的值来重复整个过程，但你可能不想手动编写所有内容。编程的目的是通过自动化大多数任务并避免重复，让一切变得尽可能顺畅高效。这一切都可以通过循环的帮助来实现，这意味着特定任务被重复执行多次。在\
  \ Python 中，以及通编程中，创建循环有两种方法。你只需使用 `while` 语句或 `for` 语句。\n\n## “While” 循环\n\n`while`\
  \ 循环会验证条件是否为真，只要该条件保持为真，它就会执行语句。这里有一个简单的例子：\n\n```python\nx = 1\nwhile x < 10:\n\
  \    print(x)\n    x += 1\n```\n\n这个简单的循环验证 `x` 是否小于十。只要这个条件为真，循环就会持续执行。在每次迭代中，`x`\
  \ 的值都会加一。当 `x` 达到十时，条件将不再满足，这意味着循环将停止执行，程序的其余部分将继续。顺便提一下，迭代仅仅是若干语句的重复，例如本例中的语句。\n\
  \n当你构建 `while` 循环时，需要考虑两点。在循环执行之前，条件语句中使用的变量需要先初始化。此外，你需要确保变量在每次循环执行时都会更新，否则你最终会陷入死循环。记住，死循环可能会非常棘手，特别是因为\
  \ Python 在创建死循环时不会提醒你。当程序卡在死循环中时，你需要杀死它，但根据程序的复杂性，简单地关闭应用程序可能不起作用。虽然死循环不会损坏你的系统或引起任何严重问题，但应该尽量避免死循环。\n\
  \n当你编写条件语句时，可以使用任何类型的变量。以一个需要计算用户输入的多个值平均值的程序为例。这类应用程序应该关注什么问题？我们需要考虑用户的输入，因为我们不知道他将使用多少值，或者这些值是否为正数。解决方案很简单。我们需要一个包含哨哨兵值（sentinel\
  \ value）的循环。哨兵值用于信号应用程序在测试到该特殊值时打破循环。程序需要验证用户输入的数字是否持有脚本应该接受的值类型。例如，当值为正数时，循环继续迭代，但当引入负值时，程序将打破循环。这里是代码中的示例：\n\
  \n```python\noffset = 0\ntotal = 0\nx = 0\nwhile x >= 0:\n    x = int (input (“输入正数:\
  \ ”))\n    total += x\n    offset += 1\n\nmean = total / offset\nprint (mean)\n\
  ```\n\n正如前面提到的，问题之一是不确定用户插入的值的类型。为了解决这个问题，我们自动将用户的输入转换为整数。如果用户尝试输入字符串，程序将因值错误而终止。\n\
  \n关于循环的下一个问题是如何退出它们。有几种在不引起任何问题的情况下跳出循环的方法，它们是通过 `break` 和 `continue` 关键字实现的。\n\n\
  \n\n\n在另一种情况下，你可能希望程序验证某个条件的有效性，但你并不希望它执行任何操作。这时，你应该使用 `pass` 关键字。它的作用本质上形成一个空语句。这意味着程序将知道跳过此循环并移动到下一个代码块。这是一个示例：\n\
  \n```python\nwhile True:\n    my_input = int (new_input (“$? : >> “))\n    if my_input\
  \ > 0:\n        pass\n    else:\n        print (“This input is negative”)\n```\n\
  \n现在让我们来看一个使用 `break` 和 `continue` 的示例：\n\n```python\noffset = 0\ntotal = 0\nwhile\
  \ True:\n    my_input = float (input (“$? : >> “))\n    if my_input < 0:\n     \
  \   if offset == 0:\n            print (“You need to enter some values!”)\n    \
  \        continue\n        break\n    total += my_input\n    offset += 1\nprint\
  \ (offset, ‘:’, total)\n```\n\n值得提到的是，在 Python 中，你可以嵌套多个循环，还可以嵌套条件语句。事实上，你可以拥有无限层级的循环结构，但不建议做到这种极端。嵌套过多的循环会迅速变得混乱，并可能因为程序员无法理清嵌套在循环中的数十个循环而导致许多错误。在大量选项中知道程序尝试遵循哪一个条件并不是件易事。记住，始终保持简单。此外，缩进会导致可读性问题。每个循环和条件语句都需要缩进，大量复杂的块对于任何程序员来说，无论其水平如何，看起来都是糟糕的。这里通用的不成文规则是，如果你的程序需要超过两层循环，你就应该重新检查设计。没有这么多嵌套。总有一个更简单的解决方案可以大幅改进你的代码。\n\
  \n## For 循环 (For Loops)\n\n创建循环的另一种流行方法是使用 `for` 语句。它的结构类似于 `while` 循环。事实上，在大多数情况下，你可以使用这两种语句编写相同的循环。对于许多程序员来说，这实际上是一个风格问题，但当你必须遍历一个序列（列表、字典、字符串等）时，使用\
  \ `for` 循环是最好的。在第一次迭代中，序列中的第一个元素会被提供，然后在第二次迭代中获取第二个元素，依此类推。\n\n要理解 `for` 循环是如何工作的，你应该了解一些关于序列的基础知识。虽然它们被留到了后面的章节，但你已经处理过一种类型的序列，即字符串。字符串是最简单的形式，因为它们实际上是字符序列。同时，我们还有列表，它们是可以用多种方式进行编辑和操作的数据序列。此外，我们还有元组，它们与列表非常相似，但它们的数据元素不能被编辑。话如此，这里有一个基础\
  \ `for` 循环的示例：\n\n```python\nbuildings = [“store”, “house”, “hospital”, “school”]\n\
  for x in buildings:\n    print (x)\n```\n\n列表中的每个元素都将被打印。同时，你也可以遍历字符串：\n\n```python\n\
  for x in “store”:\n    print (x)\n```\n\n“store”单词中的每个字符都将被单独打印。\n\n跳出 `for` 循环的方法跳出\
  \ `while` 循环相同。你可以像这个示例一样使用 `break` 语句：\n\n```python\nbuildings = [“store”, “house”,\
  \ “hospital”, “school”]\nfor x in buildings:\n    print (x)\n    if x == “hospital”:\n\
  \        break\n```\n\n这允许我们在到达第三次迭代（包括打印“hospital”一词）时跳出循环。记住，在这种情况下，`break` 发生在我们指定的元素打印之后。这里有一个稍微不同的情况：\n\
  \n```python\nbuildings = [“store”, “house”, “hospital”, “school”]\nfor x in buildings:\n\
  \    if x == “hospital”:\n        break\n    print (x)\n```\n\n在这个示例中，我们将在打印“hospital”一词之前跳出循环。接下来，我们可以使用\
  \ `continue` 语句退出当前迭代并本质上跳过它。这是一个示例：\n\n```python\nbuildings = [“store”, “house”,\
  \ “hospital”, “school”]\nfor x in buildings:\n    if x == “hospital”:\n        continue\n\
  \    print (x)\n```\n\n循环将遍历每一个可能的迭代，但包含“hospital”元素的那一次除外。\n\n## 总结 (Summary)\n\
  \n在本章中，你学习了如何让你的应用程序更加智能，并让它们实际上执行各种任务。许多基础操作要求将逻辑运算符、比较运算符和赋值运算符与决策的所有方面结合使用。此外，你还学习了如何利用循环和条件语句来赋予程序选择权。\n\
  \n知道如何用条件语句和循环改进程序设计是编程中最重要的基础方面之一。从现在起，通过始终考虑这些强大的工具来改进你的程序。此外，你还学习了追踪表（trace tables）的力量以及它们如何帮助你发现并解决逻辑错误，以提高结果的准确性。应用程序的开发是一个循环，在其中你进行设计、编程、测试和迭代，直到你……\n\
  \n# 第 5 章：Python 数据结构 (Chapter 5: Python Data Structures)\n\n在本章中，你将学习如何处理数据。数据结构是编程的基础元素之一，因为我们将使用一个游戏。在本章中，我们将专注于创建一个更复杂的程序，即一个角色扮演游戏。游戏是涵盖这个主题的完美选择，因为我们需要使用数据结构来确定角色的属性和库存。此外，我们需要计算战斗结果并将其转换为文本数据。在这个项目中，你将使用从之前的章节中学到的知识，因为我们会经常使用它们。\n\
  \n### 序列 (Sequences)\n\n如之前提到的，字符串、列表和元组都是序列类型。有多种方法访问它们内部的数据，但首先我们应该从另一个角度来分析。序列是可以修改的吗？这被称为可变性。字符串和元组不能被修改，因此它们是不可变的，但它们仍可以用于形成新的元组和字符串。相反，我们的列表是可变序列，因为我们可以通过添加或删除内部的元素来编辑它们。\n\
  \n\n\n现在问题是，我们如何访问序列内部的元素？最简单的方法是使用每个项目的索引。索引代表元素在序列中的位置。它是一个写在方括号内、变量后面的整数。这是一个示例：\n\
  \n```python\nbuilding = “hospital”\nbuilding[0]\n“b”\n```\n\n这是另一个使用列表的示例：\n\n```python\n\
  buildings = [“store”, “house”, “hospital”, “school”]\nbuildings [2]\n“hospital”\n\
  ```\n\n在两个例子中，你都会注意到索引从零开始。在编程中，`zero` 代表第一个元素，而不是一。一切都从零开始。因此，我们的索引 2 将访问列表中的第三个元素。顺便提一下，你也可以使用负整数来访问项目。这是一个示例：\n\
  \n```python\nbuildings[-1]\n“school”\n```\n\n负数索引将从列表或字符串的末尾开始计数。\n\n但如果你想同时访问多个元素呢？你可以使用所谓的“切片”（slicing）。你可以通过编写两个用冒号隔开的索引来切分序列的一部分。第一个索引将作为起点，第二个作为终点。因此，`[0:3]`\
  \ 的切片意味着访问从索引 0 到索引 3 的元素。但请记住，索引 3 的位置是不包含在内的，所以你只会访问元素 0、1 和 2。如果你需要，你也可以反向访问这些元素。此外，你可以忽略起始索引，这样切片将默认从第一个元素开始。如果你省略结束索引，也是如此。\n\
  \n请记住，当你切分序列时，实际上创建了一个新的序列。然而，它内部的数据不会改变。你仍然在使用包含相同信息的相同元素。这意味着，如果你编辑了父序列或切片序列中的其中一个元素，两个序列中的数据都会发生变化。\n\
  \n### 序列检查\n\n有时你必须创建一个序列检查，以验证某个项目是否是序列的一部分。这可以通过借助 `in` 关键字来完成，`in` 是一个布尔值，根据数据片段的成员关系返回真或假值。这里是使用之前代码的简单示例：\n\
  \n```python\n“pear” in buildings\nFalse\n```\n\n如果你想实现相反的操作，也可以添加 `not` 关键字：\n\n\
  ```python\n“pear” not in buildings\nTrue\n```\n\n此外，你还可以使用其他运算符来进行序列组合：\n\n```python\n\
  “sun” + “flower”\n“sunflower”\n```\n\n此外，你可以使用 `join()` 方法来组合字符串。正如你所看到的，我们有不同的方法来组合不同类型的数据。这也适用于我们执行的其他操作。根据数据类型，所需的函数、方法和运算符必须进行调整。然而在大多数情况下，你要么使用加减号等数学运算符，要么使用\
  \ `in`、`or` 等关键字。\n\n虽然我们还没有介绍方法，但你应该知道访问方法是通过跟随某个变量。方法括号内还包含参数。在我们情况下，这种方法的示例是\
  \ `separator.join(seq)`。`Join` 是方法本身，正如你所看到的，它与函数非常相似。然而，它们绑定到特定的对象，例如数据类型。我们将在后面的章节中详细讨论对象和方法。现在你应该知道对象是数据类型的各种实例。\n\
  \n在字符串的情况下，当使用 `join` 方法时，序列将作为参数。结果将是一个单一字符串，它包含序列中的所有项目与初始字符串的副本组合在一起。代码中看起来是这样的：\n\
  \n```python\n“, “.join (buildings)\n“store, house, hospital, school”\n```\n\n如果这看起来有点困惑，你可以通过添加\
  \ `sep = “，”` 来提高可读性，然后调用 `join` 方法。\n\n接下来，我们可以将字符串分成单个元素以创建一个列表。这可以通过 `split`\
  \ 方法完成，看起来如下：\n\n```python\nstring.split(separator, max).\n```\n\n正如你所看到的，在分割时我们必须指定第二个参数，它代表我们可以分割字符串的次数。\n\
  \n```python\nbuildings = \"store, house, hospital, school, church \"\nbuildings\
  \ = buildings.split(\", \")\nbuildings [‘store’, ‘house’, ‘hospital’, ‘school’,\
  \ ‘church’]\n```\n\n现在我们已经将字符串分成元素，可以根据需要进行处理或操纵它们。我们甚至可以将序列转换为其他类型的序列。例如，我们可以使用\
  \ `list` 方法将一个转换为列表。这里是将字符串转换为字符列表的示例：\n\n```python\nlist (‘house’)\n[‘h’, ‘o’,\
  \ ‘u’, ‘s’, ‘e’]\n```\n\n现在让我们将序列转换为元组吧：\n\n```python\ntuple (buildings)\n( ‘store’,\
  \ ‘house’, ‘hospital’, ‘school’, ‘church’)\n```\n\n你也可以像下面的示例一样将列表转换为字符串：\n\n```python\n\
  str (buildings)\n“[ ‘store’, ‘house’, ‘hospital’, ‘school’, ‘church’]”\n```\n\n\
  另一个实用的指令是 `len`，它让你发现某个序列有多少个元素。这对于我们的短序列可能不重要，但想象一个包含数百甚至数千个元素的列表。你不会从一开始计算它们。它的工作方式如下：\n\
  \n```python\nlen (buildings)\n5\n```\n\n另外两个实用的命令是 `max` 和 `min`，它们将获取序列中顺序最大和最小的元素。是这样工作的：\n\
  \n```python\nmax (buildings)\n‘store’\n\nmin (buildings)\nchurch\n```\n\n你可能认为 `max`\
  \ 关键字会返回索引最大的项，而 `min` 会相反？事实并非如此。序列是有顺序，你可能会注意到它们是按字母顺序排列的。因为这种排序，你还可以使用比较运算符来比较多个序列。假设我们有一个名为\
  \ `jobs` 的序列，它也包含五个元素。如果你比较它们，Python 将判断哪一个更大。这在代码中是这样的：\n\n```python\njobs > buildings\n\
  False\n\nbuildings == jobs\nFalse\n```\n\n请记住，如果你尝试与空序列进行比较，结果将始终为假。\n\n### 元组\n\
  \n你之前学过元组是不可变数据结构之一，包含按特定顺序的元素。事实上，它们与列表几乎相同，只是它们不能被修改。本质上，它们是包含内部锁定的数据包。\n\n元组是用逗号分隔并包含在括号之间的值列表。注意，括号并不是总是必要的，但你仍然应该使用它们以避免任何混淆和可能的错误。元组的另一个特点是它包含的值不需要是相同的数据类型。元组甚至可以包含其他元组，或者没有任何元素。这里是一个空元组的示例：\n\
  \n```python\nemptyTuple = ()\n```\n\n这是一个包含一个元素的元组：\n\n```python\nlonelyTuple =\
  \ (‘element’)\n```\n\n\n\n与元组类似，列表包含多个用逗号分隔的元素，但它们被放置在方括号而不是括号之间。列表还可以包含各种数据类型，包括其他列表。此外，我们还可以对它们进行许多操作，例如拼接、索引、切片等。本质上，你可以对其他类型序列执行任何操作都可以对列表执行。然而，与其中某些类型不同，列表是可变结构，这意味着你可以编辑和操作其中包含元素。你还可以对它们进行切片，然后为这些部分赋值或提供数据，从而彻底改变列表本身。这是一个\
  \ Python 中编写列表的简单示例：\n\n```\ncharacter_inventory = [‘sword’, [‘more’, ‘lists’],\
  \ ‘bag of gold’, ‘2 healing potions’]\n```\n\n要编辑列表并添加新项，你可以利用索引执行以下操作：\n\n```\n\
  character_inventory[1] = ‘leather armor’\ncharacter_inventory [‘sword’, ‘leather\
  \ armor’, ‘bag of gold’, ‘2 healing potions’]\n```\n\n接下来，你甚至可以用序列替换列表的某部分。方法如下：\n\
  \n```\ncharacter_inventory[::2] = [‘spell scroll’, ‘healing herb’, ‘pet rock’]\n\
  character_inventory [‘spell scroll’, ‘leather armor’, ‘healing herb’, ‘bag of gold’,\
  \ ‘pet rock’]\n```\n\n当我们定义新的切片时，并没有明确它应该从哪里开始或结束。唯一提到的是它的步长应为二。这意味着列表中的每隔第二个元素都会受到更改的影响。\n\
  \n接下来，我们有很多实用的方法，允许我们向列表中引入新元素。例如，我们有 `append` 和 `extend`。第一个选项将简单地添加新元素，而第二个选项将添加在不同列表中的项。这是一个这两个方法同时生效的示例：\n\
  \n```\ncharacter_inventory.append ('raw meat’)\ncharacter_inventory [‘spell scroll’,\
  \ ‘leather armor’, ‘healing herb’,\n‘bag of gold’, ‘pet rock’, ‘raw meat’]\ncharacter_inventory.extend\
  \ (['mace', 'flask'])\ncharacter_inventory [‘spell scroll’, ‘leather armor’, ‘healing\
  \ herb’,\n‘bag of gold’, ‘pet rock’, ‘raw meat’, ‘mace’, ‘flask’]\n```\n\n现在让我们删除一些元素。这就是\
  \ `del` 关键字的用途，但你需要记住，此操作并不会从列表中删除数据本身。它只是移动了指向某个项的引用，如果它被用于另一个数据结构，那么内部不会发生任何变化。这是一个示例：\n\
  \n```\ndel character_inventory [4:]\ncharacter_inventory\n[‘spell scroll’, ‘leather\
  \ armor’, ‘healing herb’, ‘bag of gold’]\n```\n\n你可以看到，列表从第四个元素开始的整个部分都被删除了。现在，通过输入以下命令向列表添加一个元素：\n\
  \n```\ncharacter_inventory.insert(2,'staff’)\ncharacter_inventory\n[‘spell scroll’,\
  \ ‘leather armor’, ‘staff’, ‘healing herb’, ‘bag of gold’]\n```\n\n在这种情况下，我们在索引为\
  \ 2 的项之后添加了一个新元素。接下来，让我们用以下行从列表中删除一个特定的元素：\n\n```\ncharacter_inventory.remove (‘leather\
  \ armor’)\ncharacter_inventory\n[‘spell scroll’, ‘staff’, ‘healing herb’, ‘bag of\
  \ gold’]\n```\n\n但如果你想在删除一个项的同时返回它的值呢？你当然可以发布两个独立的指令，但这可以通过一个命令完成。记住，如果有方法可以让你的代码更简单、更易读，你就应该这样做。这种操作是通过\
  \ `pop` 方法完成的，它接受元素的位置作为参数。记住，如果你不指定索引，默认将选择最后一个元素。代码中看起来是这样的：\n\n```\ncharacter_inventory.pop(-2)\n\
  ‘healing herb’\ncharacter_inventory\n[‘spell scroll’, ‘staff’, ‘healing herb’, ‘bag\
  \ of gold’]\n```\n\n你可以看到，我们选择了一个负索引位置，这导致了倒第二个元素被删除，并返回了它的值。\n\n最后，让我们看看如何排序列表。有两种常见的方法。第一，你可以使用\
  \ `sort` 方法，它会直接对列表进行修改。第二，你可以使用 `sorted` 方法，它将返回一个新的排序后的列表，而不修改原始源。这两种方法非常相似，所以尽量不要混淆它们。这是一个示例：\n\
  \n```\nsorted(character_inventory)\n[‘bag of gold', 'healing herb', 'staff', 'spell\
  \ scroll']\ncharacter_inventory.sort()\n```\n\n现在，让我们通过 `reverse` 方法反转原始列表的顺序：\n\
  \n```\nreversed (character_inventory)\n<listreverseiterator object at 0x81abf0c>\n\
  character_inventory.reverse()\ncharacter_inventory\n[‘spell scroll’, ‘staff’, ‘healing\
  \ herb’, ‘bag of gold’]\n```\n\n注意，当我们使用某些方法和函数更改序列时，我们有时不会得到新序列，而是返回一个对象。例如，在我们的示例中，有一个迭代器对象。它在\
  \ `for` 循环中的用法就像序列一样。结果，当我们使用 `reversed` 函数时，我们得到了一个反向迭代器对象。它的工作原理如下：\n\n```\nfor\
  \ element in reversed(character_inventory):\n    print element\nspell scroll\nstaff\n\
  healing herb\nbag of gold\n```\n\n## 进入矩阵\n\n不是指电影，而是嵌套列表！这是一种高级说法，表示我们可以嵌套列表，形成矩阵。这样我们可以以表格的形式存储数据。这是一个赋值给变量的列表示例：\n\
  \n```python\nmatrix = [[11, 12, 13], [21, 22, 23], [31, 32, 33]]\n```\n\n这是一个三三矩阵。如果你还记得基础数学课，它看起来可能很熟悉。当你遍历列表时，应该使用\
  \ `for` 循环。为什么？因为你不知道列表中包含多少元素，但系统知道。然而，如果你处理的是矩阵，你应该使用嵌套的 `for` 循环。换句话说，你需要嵌套循环，但每个列表维度都需要。接下来，你可以使用\
  \ `enumerate` 函数来获取索引值。让我们来看一个列表示例，后面是一个矩阵示例：\n\n```\nfor x, value in enumerate(character_inventory):\n\
  \    print x, value\n0 spell scroll\n1 staff\n2 healing herb\n3 bag of gold\n```\n\
  \n现在让我们看看矩阵版本：\n\n```python\nfor row in matrix:\n    for x, value in enumerate(row):\n\
  \        print x, value\n0 11 1 21 2 31\n0 21 1 22 2 32\n0 31 1 32 2 3\n\n这种数据类型类似于黄页电话。只要有一个名字要查询，就能找到他的电话号码和其他信息。在这个示例中，人的名字被称为键，数据以值的形式出现。键本身是不可变的，这意味着它只能是字符串、元组或数字，而值可以是任何类型的数据。然而，字典是可变结构。这意味着你可以编辑许多值。这包括添加、删除以及更改键。\n\
  \n顺便说，字典也被称为映射（mappings），因为它们的键映射到特定的对象。这使得它们与其他序列有显著不同，这也是为什么它们还有另一个名称。\n\n\n\n\
  \n如果你熟悉其他编程语言，你可能会注意到结构与字典相似的数据类型被称为哈希（hashes）或关联数组（associative arrays）。这些是非常重要的区别，因为确定键的值实际上是哈希值。这意味着什么呢？哈希键可以存储更大的键，因为它们实际上是根据键定义的较小值。目前，这些听起来可能非常困惑，但\
  \ Python 是根据哈希键而不是按照字母顺序来排列字典内部的句子的。因此，如果你修改了值，由此产生的哈希也会随之修改，从而程序将无法找到存储其中的值。这就是为什么键是不可变的（not\
  \ mutable）。\n\n现在让我们把理论抛到一边，看看字典在代码中是什么样子的。请记住，它们是由键值值对定义的。它们之间用冒号分隔，并包含在大括号内。确保不要将大括号与中括号和小圆搞混，因为如果你弄错了它们，应用程序将无法正确响应。话虽如此，这是一个示例：\n\
  \n```python\ncharacter_profile = {'Name':\"\",'Description':\"\", 'Race':\"\", 'Sex':\"\
  \",'Strength':0,'Intellect':0,'Dexterity':0,'Charisma':0}\ncharacter_profile['Name']\
  \ = \"Player\"\nprint character_profile['Name'], \"has\", character_profile['Intellect'],\
  \ \"Intellect\"\nPlayer has 0 Intellect\n```\n\n当你传递字典内部其中一个元素的引用时，需要使用方括号。然而，请记住，它的工作方式与列表不同，在列表中，我们可以使用代表元素位置的索引值。字典项没有位置。相反，我们拥有的是与之匹配的键和值。这意味着我们需要调用键来引用它的值。语法看起来像这样\
  \ `[dictionary [key] = value]`。请记住，键的名字必须放在引号之间，否则它将被视为一个变量。遍历字典元素的另一种方法是使用 `for`\
  \ 循环。如你所见，循环在许多情况下都非常有用。这里有一个示例：\n\n```python\nfor key in character_profile:\n \
  \   print key,\nIntellect Name Sex Race Charisma Strength Dexterity Description\n\
  ```\n\n如果你需要访问值，你需要输入 `profile [key]`，但如果你需要检查某个键是否存在，你需要在 profile 中查找该键。检查的结果将为真（true）或假（false）。唯一的另一种可能性就是错误。然而，假设你不确定某个键是否已经存在。在这种情况下，你可以使用以下方法：\n\
  \n```python\nget (key, default)\n```\n\n在这里我们需要使用参数。第一个参数代表你感兴趣的键。第二个参数代表在键不存在时的默认值。现在，让我们来看代码：\n\
  \n```python\ncharacter_profile.get('Name')\n'Player'\ncharacter_profile.get('Sex',\
  \ 'unknown')\n''\ncharacter_profile.get('Health', 'not found')\n'not found'\n```\n\
  \n你会发现我们有这个键，但只有一个空值而不是消息。现在，让我们看看如何从字典中删除一个元素：\n\n```python\ncharacter_profile\
  \ {'Name': 'Player', 'Sex': '', 'Race': '', 'Charisma': 0, 'Strength': 0, 'Dexterity':\
  \ 0, 'Description': ''}\ndel character_profile['Sex']\ncharacter_profile\n{'Name':\
  \ 'Player', 'Race': '', 'Charisma': 0, 'Strength': 0, 'Dexterity': 0, 'Description':\
  \ ''}\n```\n\n如你所见，与其他序列一样，为了删除一个元素，我们必须使用 `del` 方法。此外，如果你需要从字典中删除一个值，可以像之前演示的那样使用\
  \ `pop` 方法。排序的方法与列表类似，通过使用 `sorted` 方法。\n\n本质上，字典是一种重要的数据结构，因为在任何我们需要存储许多属性和值的程序中，都需要它。例如，你甚至可以定义一个来简单地计算某个对象的不同状态。这之所以有效，是因为每一个键实际上上都是唯一的，因此你不会为同一个键得到相同的值。这意味着键可以用来存储输入数据，然后值将存储我们所执行的任何操作的结果。例如，如果你想学习某个字母在特定句子中出现的频率，你可以遍历所有的单个字符，然后将每一个字符都分配给一个键。\n\
  \n## 创建一个基础游戏\n\n正如本章开头提到的，我们将创建一个非常基础的游戏，在其中你将使用你学到的关于序列的所有知识。这本质上是之前我们处理过的简单角色生成器的延续。现在，在我们开始编写代码之前，让我们从设计开始。\n\
  \n代码将分为三个主要块。你将需要能够生成角色的属性、购买一些装备并进行战斗。让我们进一步开发这些想法：\n\n1.  首先，我们需要存储角色属性。由于我们需要一个容器来存放它们，字典可能是理想的选择。玩家将能够决定自己的角色名称、描述、性别和种族。然而，角色属性（即力量、敏捷、魅力以及金币）是随机的。我们还将引入一些次要属性，如生命值、法力和护甲。为了生成数字，我们将引入\
  \ `random` 模块。我们还没有讨论过这个话题，但足够知道模块是用来执行任务的函数编译集。Python 模块在使用之前需要导入。然而，一旦导入了它们，其用法与普通方法和函数一样。\n\
  2.  在代码的下一个部分，我们将定义商人，玩家将在那里花费购买物品。再次，理想的容器将是字典。商人提供的物品将有自己的键，通过这些键连接价格。\n3.  最后，我们将实现战斗系统。角色可以在自己的回合内选择武器并攻击某人。此外，我们不想只看到数字，因此我们将添加文本来描述造成的伤害。为了实现这一点，我们需要使用一些元组。下一个问题是我们将如何处理武器计算。我们将在这里作弊，向商人引入两个更多元素。请记住，这些元素的数字不会改变，因此我们将在程序开始时添加它们，以便尽快解决它们。最后，我们需要战斗阶段进入循环，直到一个角色死亡。\n\
  \n现在我们已经有了程序的总体设计，让我们开始第二阶段的开发：伪代码！\n\n```python\n# 声明不改变值的常量变量\ndefine trader =\
  \ {}\n\n#1 当角色数量 < 2\n#1.1 声明角色配置字典\n#1.2 要求用户输入关于他们角色的信息\n## ('Name', 'Description',\
  \ 'Sex', 'Race')\n#1.3 确认数据\n#1.4 实现随机属性生成\n#('Strength', 'Intellect', 'Dexterity',\
  \ 'Charisma')\n#1.5 实现次要角色属性\n#('health', 'mana', 'armor', 'gold')\n\n## 用户修改某些属性\n\
  \n#1.6 确认角色属性\n#1.7 显示角色属性文档\n#1.8 要求玩家从商人处购买一些装备\n#1.9 当购买不等于 'no' 时循环。\n```\n\n\
  \n\n\n\n### 1.9.1 显示带有价格商人物品列表。\n\n### 1.9.2 请求用户购买物品。\n\n### 1.9.3 如果玩家有足够的金且商人有该物品，则购买物品。\n\
  \n### 1.10 引入另一个玩家\n\n## 战斗章节\n### 准备带有描述文本的列表。\n`hits = ()`, `misses = ()`, `damage_taken\
  \ = ()`, `health_update = ()`\n\n## 2 玩家进入战斗。\n\n## 玩家决定使用哪种武器。\n## 只要武器在他的背包中。\n\
  ## 如果选中的武器不存在，玩家将使用拳头。\n\n## 3 当 `opponent [health] > 0` 且 `target[health] > 0`\
  \ 时循环：\n### 3.1 `for player in battle:`\n### 3.1.1 计算攻击速度\n### 3.1.2 计算攻击伤害\n###\
  \ 3.1.3 打印受到的伤害\n### 3.1.4 `if opponent [health] > 0 and target [health] > 0: break`\n\
  ### 3.2 打印玩家进度\n\n## 4 打印获胜者\n\n如你所示，这个程序比我们目前设计的要复杂一些。在继续之前，请务必注意伪代码的结构和缩进。设计越复杂，你就应该在准备上投入越的时间。不要把一个应用程序看作是一项需要未知多少工时才能开发的巨型任务。相反，应该将其拆分为更小的任务，组织代码块以及你需要解决的问题。然后你就可以一个一个开始处理它们。\n\
  \n话虽如此，我们目前拥有的伪代码可以很容易转换为 Python 代码。首先，我们有常量变量，然后是 `import random` 语句。我们将使用随机方法。接下来，是第一部分，我们在一个名为\
  \ `trader` 的字典中确定物品。每个元素都包含三个元组，分别代表价格、攻击伤害和攻击速度。然后我们有一组元素，将成为角色可以购买的物品（例如护甲和武器），随后是四个额外的元组。它们将持有描述武器命中、未命中、伤害报告和健康更新的文本。因为这毕竟是一个游戏，你应该花一点时间来考虑如何设计你的描述性文本。它需要符合你游戏的氛围以及你为角色设定的任何目标。\n\
  \n接下来，我们有一个存储玩家配置的空白列表，直观地命名为 `players`。这些配置中的每一个随后将临时托管在一个 `character_profile`\
  \ 字典中。在那里，我们四个独立的字段，用户将在其中输入关于他角色的信息。然后我们开始使用随机模块 `random.randint (start, end)`\
  \ 来自动生成玩家的属性。这本质上是一个随机数生成器，等同于掷骰子。次要属性由这些数字生成，并进行验证以确保它们处于 1 到 100 之间的某个值，以保持代码的简单易读。如果数字不在这个范围内，我们会再次投掷骰子，直到获得有效结果。在该代码块的结束处，我们打印玩家的角色属性表。\n\
  \n接下来是物品购买部分，我们实际上可以将其附加到角色生成器中。这样我们可以在某种程度上简化代码编写，并使设计更紧凑一些。此外，我们可以使用 `for` 循环来遍历玩家可以购买的物品列表。然后我们通过索引从元组中访问价格。此时，玩家将能够做出决定，然后将其添加到他或她的背包中。扣除相应数量的金币以交换物品。接下来，玩家被要求选择武器，如果角色的背包中没有武器，则默认使用拳头。背后真正发生的过程是玩家访问\
  \ `trader` 字典中的元组并将其转换为武器值。角色的护甲值也是如此。通过所有这些数据，构建出一个配置。最后，战斗在一个 `while` 循环内部发生，一直执行直到其中一个对手失去了所有生命。在循环内部，我们有另一个循环来切换每个玩家的回合。记住，在这个例子中我们使用了回合制战斗机制。这个概念很简单。嵌套循环通过\
  \ `enumerate` 函数访问玩家索引并将其转换为布尔值。在一个玩家的回合结束后，`not` 运算符反转该值。这意味着我们有一个攻击者和一个目标索引，并在两个玩家之间切换。\n\
  \n接下来是攻击速度计算。只要玩家掷出正数，就会命中目标。负数被转换为未命中。我们将值设置为零到七之间的某个地方，但我们必须限制它，否则将会出现一些意外行为。然后，该值在\
  \ `misses` 和 `hits` 元组中进行验证，并根据结果打印描述性文本。信息取决于攻击是否成功命中对手或未命中。该值也被用于伤害计算。记住，这些值设置在限制内的某种随机范围内，以便为游戏提供趣味性，而不是死板的结果。\n\
  \n在最后部分中，我们定义了根据目标受到的伤害从其健康池中扣除多少健康值。然后更新目标的健康值。只要它不等于零或负值，游戏就会继续。当它达到零时，我们跳出循环并决定胜者。程序在达到结果后将结束执行。\n\
  \n## 代码练习\n\n到此，你已经对 Python 和通用编程学习了许多。我们已经规划了游戏的计划，编写了伪代码，然后进行了非常详细的解释。现在，剩下的交给你了！你拥有自己编写代码所需的一切。你不需要应用所学之外的任何知识。特别是对于这个练习，你应该专注于在本章中学的内容。\n\
  \n你可能会觉得这个练习很有压力，但是如果没有独立练习，初学者会倾向于直接复制代码并看看它是否有效。这不是学习编程的方法。你需要进入战场，独立或在获得帮助的情况下坚持下去。即使你没有成功编写出这个游戏，遇到了错误或在某处卡住了，研究也是程序员工具箱的一部分。如果你卡住了，请利用许多\
  \ Python 编程社区并提问。通过每一次尝试，你都会学到新东西。\n\n## 总结\n\n在本章中，希望你已经积累了大量信息，有时甚至让人无所从。。你已经在早期章节建立的基础上继续构建，现在你能够开始独立迈尝试了。你学会了处理\
  \ Python 最重要的数据结构，如字典、元组和列表，现在你可以通过创建更复杂的应用程序来充分利用它们。\n\n\n\n\n最后，你已经利用了到目前为止所积累的所有知识，开发了一个相当复杂的程序。你通过编写自己的代码并研究过程中遇到的任何问题，独立地迈出了第一步。这次挑战是你\
  \ Python 学习之旅中重要的一步，因为这是你第一次体验真实的编程——它伴随着起伏，以及那些奇妙的“啊如此！”时刻。\n\n# 第 6 章：函数\n\n到目前为止，你一直集中在处理变量、执行基础算术运算、比较以及赋予你的程序有限的选择能力上。你已经拥有足够的\
  \ Python 编程知识来让你的技能提升到下一个水平。\n\n目前，你可以利用所学的知识编写出从上到下精确执行的基础脚本，然而，你还能做的远多得多。你现在面临的最大问题是，如果程序需要重复某部分，它必须重新执行整个部分。反之，这导致了另一个更严重的问题：如果你需要修改代码，除非检查整个脚本，否则你可能会破坏所有内容。这使得维护和更新变成了一项耗时的苦差，但事实并非如此。理想情况下，你希望将代码划分为不同的部分，每个部分只处理一个任务。这正是函数的用处，在本章中，我们将专注于函数，以便编写出优代码。\n\
  \n## 创建函数\n\n到目前为止，你的程序只不过是一个按顺序执行的指令列表。它们运行良好，但随着程序规模的增长，你将越来越难以跟上它的复杂性。这就是为什么你需要学会利用函数的优势来简化你的工作。\n\
  \n你已经在使用许多 Python 内置的函数。然而，在开发具有一定复杂程度的内容时，默认函数是不够的。幸运的是，Python 和其他编程语言一样允许你构建自己的函数。一旦你创建一个，它的使用方法与你已经拥有的函数完全相同。\n\
  \n定义新函数有一系列优势：\n\n1. 通过使用函数，你可以将代码分成任意数量的小代码块。这样，你以后就可以修改代码而不会破坏整个程序。更新和维护小代码块要比处理整个应用程序要容易得多。\n\
  2. 自定义函数将消除任何重复。虽然没有关于代码重复的成文规定，但普遍观点是，如果你必须写某些内容超过两次，就应该将其转换为函数。你希望你的代码尽可能简单、高效且易读。因此，你应该编写包含那些在程序中需要多次使用的代码的函数。当你需要执行它时，不需要再次写一遍该部分，只需调用该函数即可。\n\
  3. 另一个优势是在程序员团队中工作时。通过将应用程序分成可管理的章节，每个程序员可以独立地工作某一部分。这样你就可以快快得的速度完成项目，因为在最后你可以轻松地连接所有部分。\n\
  \n现在，让我们来看一个借助函数帮助编写的新项目。\n\n正如你所知道的，学习最好的方法就是手面对一个项目。在本节中，我们将制作一个简单的井棋（tic tac\
  \ toe）游戏，用户将与电脑对。我们将从游戏说明开始，它被编写为一个独立的程序。我们将分析代码以便更好地理解用户定义的函数。让我们开始吧！这里是代码：\n\n\
  ```python\n## game guide\n\n## illustrating user defined functions\n\ndef gameGuide\
  \ ():\n    '''显示说明。'''\n    print (\n    ''' 欢迎来到你玩过的最史诗的游戏！\n    这将是你——一个肉体之躯，与我——全知全能计算机之间的智力斗争！\n\
  \    你将从输入一个 0 到 8 的数字开始，\n    该数字将对应游戏板上的以下位置：\n    0 | 1 | 2\n    3 | 4 | 5\n\
  \    6 | 7 | 8\n    准备好战斗！ \\n''' )\n\n## main\n\nprint(\"这是井棋的游戏指南：\")\ngameGuide()\n\
  \nprint(\"再次查看一遍：\")\ngameGuide()\nprint(\"你一定理解它是如何运作的。\")\n\ninput(\"\\n\\n 按回车键退出。\"\
  )\n```\n\n现在让我们分析接下来的部分代码，看看函数是如何工作的。\n\n## 函数定义\n\n为了创建你自己的函数，你需要使用 `def` 关键字来定义它。在上面的示例中，这是我们做的第一件事：\n\
  \n```python\ndef gameGuide ():\n```\n\n那么我们说的“定义”是什么意思？我们输入的代码告诉计算机，后续所有的语句都属于这个函数。本质上，我们正在声明一个代码块并给它起名字。这样，我们只需通过调用函数就可以始终访问函数内部的代码。函数内部的信息定义了它的用途以及它所采取的操作。当\
  \ Python 看到函数定义时，它知道它在程序内部，你可以在任何需要的地方调用它。请记住，这意味着函数在定义时并不会自动执行任何任务。你需要在应用程序中的某处调用它。\n\
  \n要调用它，你只需要输入函数名连同它的括号。在我们的示例中，我们通过以下行执行了两次：\n\n```python\ngameGuide ()\n```\n\n\
  现在系统知道它需要启动并执行该函数。在我们的示例中，每当我们调用该函数时，程序都会打印游戏指南。\n\n至于语法，你可以看到它非常简单。你需要的是以 `def`\
  \ 关键字开始，输入一个描述函数的直观名称，后面跟着括号（可以包含参数），最后是冒号。然后你可以根据函数的用途编写任何类型的语句。\n\n## 函数文档\n\n\
  用户定义的函数允许你通过文档字符串（也称为 docstring）对它们进行文档说明。在我们的小游戏指南中它看起来是这样的：\n\n```python\n'''显示说明。'''\n\
  ```\n\n正如你所看到的，我们需要使用三引号，就像我们注释掉一段文本时一样。然而，当你编写 docstring 时，它必须是定义函数后的第一行。在我们的示例中，我们只写了一句描述函数用途的句子。请记住，文档不是必须，但如果你创建了大量函数，你可能希望确保以后知道它们的用途，特别是当你与其他程序员合作时。docstring\
  \ 以后可以在 IDLE 中访问，你可以像查看默认文档函数一样查看你创建的函数。\n\n## 使用参数\n\n正如你可能注意到的，在处理默认 Python 函数时，你可以设置它们的值并让向你返回值。例如，你可以使用\
  \ `len` 函数设置一个序列并返回其长度值。你可以对用户定义的函数做相同的事情。\n\n接下来我们将查看另一个小程序，其中定义了三个新函数。你将学习如何形成获取和返回值的不同组合。换句话说，我们将设置一个函数接收值，另一个函数返回值。最后，第三个函数将能够同时做到。这里是代码：\n\
  \n```python\n## Parameters and Values\n\n## 探索参数的使用\n\ndef show (message):\n   \
  \ print(message)\n\ndef return_me_ten():\n    ten = 10\n    return ten\n\ndef ask_yes_or_no\
  \ (question):\n    \"\"\"询问一个是或否的问题\"\"\"\n    response = None\n    while response\
  \ not in (\"y\", \"n\"):\n        response = input(question).lower()\n    return\
  \ response\n\n## main\n\nshow(\"你有一条消息。\\n\")\n```\n\n\n\n\n```python\nnumber =\
  \ return_me_ten()\n\nprint(\"This is what I received from return_me_ten():\", number)\n\
  \nanswer = ask_yes_or_no (\"\\nPlease enter 'y' or 'n': \")\n\nprint(\"Thank you:\"\
  , answer)\n\ninput(\"\\n\\nPress the enter key to quit.\")\n```\n\n在这个示例中，我们定义了\
  \ `show` 函数，它简单地打印通过其参数接收的值。如果你仍然在理解参数方面存在一些困难，你只需要把它们看作函数内部的变量即可。参数的作用仅仅是获取通过函数调用传递的值。这意味着在我们的第一个函数中，我们有一个\
  \ `message` 参数，并向其分配 le 了一个值，即字符串“You have a message.\\n”。这个字符串随后被 `message` 参数接收，然后函数将在其内部将其作为变量运行。如果没有没有给它分配任何值，我们将会收到一个错误。请记住，在这种情况下，我们的\
  \ `show` 函数只有一个参数，但并不意味着所有函数都需要参数。事实上，它们可以拥有很多参数。你只需要用逗号将所有参数分开列出来即可。\n\n我们在这个脚本中的第二个函数是\
  \ `return_me_ten`，它通过命名恰当的 `return` 语句返回值。当执行 `return ten` 语句时，函数会将该值发送到调用它的应用程序部分。请注意，函数在到达\
  \ `return` 语句时会终止。请记住，一个函数可以包含多个值，并且可以通过逗号分隔来全部返回。\n\n第三个函数命名也很合适 `ask_yes_or_no`\
  \ 将接收一个问题并将用户给出的答案作为简单的“是 (y)”或“否 (n)”返回。问题是通过定义内部定义的参数获取的。然后，问题接收了发送给函数的参数值。在这个脚本中，我们有\
  \ `\"\\nPlease enter 'y' or 'n': \"` 字符串。在函数的下一个部分，我们使用这个参数来要求用户给我们提供答案：\n\n```python\n\
  response = None\n\nwhile response not in (\"y\", \"n\"):\n\nresponse = input(question).lower()\n\
  ```\n\n请记住，我们需要一个循环来重复执行这一部分，直到用户为程序提供答案。一旦响应被插入，参数就会通过函数传回调用它的应用程序部分。答案被返回，函数终止，程序随后将其打印出来。\n\
  \n## 重用函数\n\n让我们暂时离开这些理论和编码，留意用户定义函数的重用性。\n\n创建自己的函数最大的好处之一是，你可以保存它们并在其他脚本中使用它们，而不仅仅是当前的项目。例如，在我们的示例中，我们正在提示用户对一个问题给出肯定或否定的回答。这是一个许多其他程序都会执行的常见任务，即使目的并不完全相同。你可以在许多其他场景中重用这个函数。这将节省你的时间并让你的编码变得不那么累。\n\
  \n重用函数最简单的方法之一就是将它们从旧脚本复制到新脚本中。然而，这不是处理这一过程最有效的方法。还记得我们之前讨论过的 Python 模块吗？你可以导入它们来扩展你的功能。是的，你可以开发自己的模块，并使用它们将你的自定义函数导入到其他程序中。它的工作原理与使用标准模块完全相同。我们将在稍后的章节中详细讨论这一点。现在，你可以坚持使用老式的复制粘贴方法。\n\
  \n现在，在学习过程中，你几乎可以做任何事情，因为没有真正的后果，优化也并不重要。然而，当你准备在现实世界中编程时，你希望尽可能高效。编码需要时间，你不想浪费时间。这就是为什么你不应该尝试重复造轮的原因。大多数软件开发公司倾向于关注可重用代码以及开发将旧事物实现在新事物中的新技术。如果你选择编程作为职业，以下是代码重用如此重要的原因：\n\
  \n1. **提高你以及你团队的生产力。** 以快得的速度完成项目，并创建新的构建块，这可以进一步加速任何未来的项目。\n2. **它允许你保持一致性并熟悉你的开发环境。**\
  \ 人可能适应适应，但切换构建项目的方式会浪费宝贵的时间。即使是使用不同的用户界面这种小事，也显著减慢你的速度甚至让你感到困惑。\n\n## 全局变量\n\n\
  我们到目前创建和使用的函数是相互隔离且完全独立的。这就是为什么它们如此有用。你总是可以移动它们，并将它们连接到你想要的任何组件上。然而，为了访问它们内部的数据，你需要通过分配的参数。为了做到，它们需要返回一个值。虽然通常情况下如此，但还有另一种方法。\n\
  \n通过全局变量也可以在应用程序部分之间共享数据。然而，为了理解全局变量，你首先需要理解作用域。\n\n## 作用域\n\n正如你已经从更复杂的示例中了解的那样，将程序分为可以相互独立访问的各个部分是正常的。这就是我们所说“作用域”时指的内容。我们创建的每一个函数都有一个作用域。这就是为什么一个函数无法直接访问另一个函数的变量。一个简单的表示看起来像这样：\n\
  \n```python\ndef function_1 ():\n    variable_1\n\ndef function_2 ():\n    variable2\n\
  \nvariable()\n```\n\n你可以看到，在这种情况下我们有三个作用域。默认情况下，所有程序都有全局作用域，在我们的示例中，我们由函数定义了另外两个作用域。这意味着什么？\n\
  \n当你不在任何函数内部操作时，你就处于全局作用域中。我们在这里定义的变量被称为全局变量。我们在任何一个函数块内定义的任何其他变量将属于它们，并被称为局部变量。例如，在我们的示例中，我们在第一个函数内部有一个\
  \ `variable1`。这意味着它是局部变量，因此我们无法从另一个作用域（例如第二个函数）访问它。此外，我们无法从全局部分更改该变量。\n\n将作用域想象成一辆带有深色玻璃的汽车。如果你在车内，你可以看到里面的一切。但如果你在车外面，你就看不到内部。这本质上也是函数的工作方式。你只有在函数内部时才能访问函数的变量，如果你在全局空间，这些变量对你是不可见的。此外，如果我们有多个名称相同但属于不同函数的变量，它们将是它们自己的实体，彼此之间没有连接。例如，如果我们我们在示例的第一个函数中添加\
  \ `variable2`，它包含的数据与第二个函数内部的 `variable2` 完全不同。\n\n## 处理全局变量\n\n我们将编写一个短程序，演示你如何使用函数来读取和编辑全局变量。让我们创建这个应用程序，然后分析每个功能：\n\
  \n```python\n#Playing with global variables\n\ndef read_global ():\n    print (\"\
  From within read_global(), value is:\", value)\n\ndef shadow_global ():\n    value\
  \ = -10\n    print (\"From within shadow_global(), value is:\", value)\n\ndef change_global\
  \ ():\n    global value\n```\n\n\n\n\n\n```python\nvalue = -10\n\nprint (\"From\
  \ within change_global(), value is:\", value)\n```\n\n## main\n\n## 从这里开始我们处于全局作用域内\n\
  \n## 值变成一个全局变量\n\n```python\nvalue = 10\n```\n\n```python\nprint (\"Within the global\
  \ scope, value is: \", value, \"\\n\")\n\n```\nread_global ()\n\nprint (\"Within\
  \ the global scope, value is set to: \", value, \"\\n\")\n\nshadow_global ()\n\n\
  print (\"Within the global scope, value is set to: \", value, \"\\n\")\n\nchange_global\
  \ ()\n\nprint (\"Within the global scope, value is now: \", value, \"\\n\")\n\n\
  input(\"\\n\\nPress the enter key to quit.\")\n```\n\n## 读取全局变量\n\n我们讨论了局部变量和全局变量，以及它们如何根据作用域进行访问。现在是让你稍微困惑一下完美时机。无论在什么作用域，都可以读取全局变量。你可以在全局作用域内读取函数的变量，反之亦然。让我们回到那个关于贴色玻璃汽车的类比。当你坐在车内时，你可以看到里面的一切，但你也可以通过窗户看到外面。这意味着当你在函数内部时，你可以读取全局变量的值。\n\
  \n我们之前创建的短程序演示了这种可读性。我们定义了一个名为 `read_global` 的新函数，它打印全局变量的值。这些指令运行得完美，没有任何错误。但请记住，虽然你可以读取函数外部的内容，但你无法进行任何形式的修改，至少不能直接修改因此，如果我们在\
  \ `read_global` 函数内部编写下面这一行，Python 将会抛出一个错误：\n\n```python\nvalue += 1\n```\n\n##\
  \ 遮蔽全局变量\n\n你一定读到了上面示例中的其中一个函数名，并自问：“什么遮蔽？”遮蔽（Shadowing）特指将局部变量命名为与全局变量相同的名称。它们可以有相同的名称，但不要掉入认为你可以编辑全局变量值的陷阱。唯一的变化会发生在局部变量上。之所以被称为“遮蔽”，是因为我们本质上是在用新变量隐藏全局变量。以下是我们在示例中在给\
  \ `shadow_global` 函数赋值时所做的操作：\n\n```python\nvalue = -10\n```\n\n全局的值没有改变。但是，在函数内部定义了相同值的局部版本，且该版本的值为\
  \ `-10`。你可以观察到这一工作原理演示，因为我们指示程序打印该值的全局版本。\n\n记住，在函数内部遮蔽全局变量很少是一个好主意。为什么呢？嗯，你可能已经知道了。你被我们的示例和刚刚读到的解释困扰了吗？如果你感到困惑，并且需要额外的时间来弄清楚状况，那么你可能应该避免使用它们。你可能会实现遮蔽，然后当你想要使用全局变量的值时，你却使用了另一个。\n\
  \n## 修改全局变量\n\n你可以通过 `global` 关键字来访问全局变量。在我们的示例中你可以看到我们是如何使用它将值改为 `-10` 的。当我们执行程序时，将打印出新值。\n\
  \n现在的问题是何时使用全局变量。你可以在任何需要的时候使用它们，但这样做明智吗？在编程中，仅仅仅仅因为你可以以某种方式做某事，并不意味着你实际上应该这样做。你需要权衡你的选择，因为并不是每种可能性都适用于你的项目。全局变量是一个问题的决策示例。正如之前提到的，它们会导致困惑，因为值会变化，然后你就不再确切知道自己正在处理什么了。这就是为什么你应该极少利用它们的主要原因。\n\
  \n另一方面，你还有将全局变量转换为常量选项，常量并不那么难以追踪。例如，如果你开发了一个税收计算器，你自然会有很多函数，但由于某种原因，所有它们都使用 `.45`\
  \ 作为值。这意味着我们可以将此值放在一个全局常量中。这样我们就不再需要在每个函数中调用该值本身了。这看起来不像一个重大的改变，但当你处理一个复杂项目时，拥有清晰的变量而不是对你毫无意义的数字，会让你的编程生活变得轻松得多。\n\
  \n## 编写井字游戏\n\n在本章的开头，我们讨论了开发一个新游戏，即井字棋（Tic Tac Toe）。现在你已经学习了大量关于函数的知识，已经准备好编写更复杂的程序了。然而，让我们先不要直接跳到编写代码。复杂的程序比你目前为止处理过的任何东西都需要更周全的规划。\n\
  \n始终从规划开始！是的，你已经在书中多次读过这个提示、建议甚至命令了。这是因为对于任何项目来说，规划阶段就是了一半的工作。它可能很无聊，但你需要一张带有指针的地图来指引方向。没有了它，你会东撞西撞，花费大量的时间和精力，然后在迷失在赛博丛林中时就此放弃。\n\
  \n既然如此，让我们从伪代码开始。记住，这个程序的目的是练习使用我们已经写过的函数，以及一些你将自己编写的新函数。这意味着伪代码不需要那么详细。看到了吗？这是使用函数的另一个好处。即使你的伪代码也可以被简化，从而节省更多时间。现在让我们来看看我们的大纲：\n\
  \n```python\n## 打印游戏指南\n## 确定谁开始\n## 构建游戏面板并显示它\n## 当没有胜者或平局时\n## 如果是玩家回合\n## 获取他的移动\n\
  ## 更新面板并显示它\n## 否则\n## 获取 AI 的移动\n## 更新面板并显示它\n## 切换回合\n## 宣布获胜者\n```\n\n现在我们对游戏内容有了想法，我们需要思考更具体的定义。如何展示棋盘？如何移动？这些问题需要回答，所以让我们思考整体。首先，我们需要显示棋盘，并用字符来表示棋子。然后面板可以是列表，因为我们可以在玩家移动时对其进行编辑。我们可以这样设计：\n\
  \n```\n0 | 1 | 2\n3 | 4 | 5\n6 | 7 | 8\n```\n\n不要忘记从零开始计数。棋盘的每个部分都有从零到八的编号。玩家的移动也将用数字表示，因为每回合只能移动一个格子。至于表示玩家，人类可以是\
  \ X，计算机可以是 O。然后我们需要一个表示当前回合的变量。\n\n## 添加函数\n\n到目前为止，我们只有设计的一部分。这个游戏是复杂的，我们的伪代码只代表了总体框架。我们需要在开始编写之前创建一个函数列表。这样我们就可以脑暴实际所需以及它们应该接受的参数。这些我们需要：\n\
  \n1. `game_guide()`：显示游戏规则和说明。\n2. `ask_yes_or_no(question)`：询问玩家可以用“是”或“否”回答的问题。\n\
  3. `ask_number(question, low, high)`：要求玩家输入范围内的数字。如你所示，我们有一个用户接收的问题参数，并将返回一个数字。这个数字将在\
  \ `low` 到 `high` 范围内。\n4. `game_piece()`：这个函数将代表棋盘上的棋子。一个属于人类玩家，另一个属于 AI。\n5. `empty_board()`：创建一个新棋盘。\n\
  6. `display_board(board)`：在屏幕上显示棋盘。\n\n\n\n\n\n8. `winner(board)`: 声明胜利者。\n\n9.\
  \ `player_move(board, player)`: 从人类玩家处获取移动。接收 `board` 和玩家的棋子并返回该移动。\n\n10. `computer_move(board,\
  \ computer, player)`: 计算 AI 的移动，接收 `board` 和两个棋子。返回 AI 的移动。\n\n11. `next_turn(turn)`:\
  \ 切换回合。\n\n12. `anounce_winner(winner, computer, player)`: 声明胜利者，也声明平局。\n\n现在我们已经对游戏的结构有了了了解，让我们开始准备工作吧。\n\
  \n## 设置与练习\n\n你需要做的第一件事是定义全局常量。这些常量会被大多数函数使用，由于它们的值不会改变，你可以在刚开始时就声明它们。这样你的函数将更易编写和管理，因为你已经准备好了一切。这里是帮助你入门的代码：\n\
  \n### 全局常量\n\n```python\nX = “X”\nO = “O”\nEMPTY = “  \nTIE = “TIE”\nNUM_POSITIONS\
  \ = 9\n```\n\n`X` 和 `O` 代表属于玩家和电脑的棋子。`EMPTY` 常量指的是棋盘上的空位置。它的值是一个空格，因为当我们打印它时，它看起来需要像一个空位。`TIE`\
  \ 常量代表电脑和玩家之间可能的平局，且不宣布胜利者。最后，我们有 `NUM_POSITIONS` 代表棋盘上所有的方格。\n\n现在你已经拥有了构建井字棋游戏所需的一切。你在这一章中学到的所有知识都为这个项目做好了准备。你有了一个详细的计划，知道需要创建哪些函数以及它们的用途是什么，并且已经准备好了包含所需全局常量的游戏设置。你已经拥有了一些函数，因为之前我们在本书的这一部分之前已经把它们作为示例使用了。利用你掌握的技能来组装创建程序所需的所有组件。这正是函数的真正意义。它们让程序员能够独立地编写和调试，然后将它们连接起来以构建应用程序。\n\
  \n## 总结\n\n在本章中，你学习了用户定义函数的基础以及如何编写它们。你学习了什么是作用域（scopes），以及全局变量与局部变量之间的区别。此外，你学习了为函数注释以及限制使用全局常量频率的重要性。最后，你学习了如何将所有函数组合在一起，构建一个高效、易读且易维护的程序。现在你可以使用组件化开发的方法来创建新项目，而不是编写长混乱的脚本。\n\
  \n## 第 7 章：面向对象编程简介\n\nPython 可以被视为面向对象编程语言，但这意味着什么呢？\n\nOOP（面向对象编程）是一种相对较新的编程方法。在最近几年里，它成为了软件和游戏开发行业的标准，今天大多数程序都是使用这种方法创建的。定义面向对象编程的是对象本身，在这一章中，你将专注于学习其背后的基本概念。以下是你将探索的一些内容：\n\
  \n1. 定义对象并创建类。\n2. 编写方法并声明对象的属性。\n3. 多态。\n4. 创建模块。\n\n## 类\n\n到目前，你已经对使用基本方法获得了一些有限的知识。然而，OOP\
  \ 中最重要的概念之一就是类（class）。类本质上是一个模板，允许你构建自己的数据类型。在这种情况下，不要把数据类型仅仅看作数字或文本。一个新数据类型可以是一个汽车，它将有许多独特的属性，如品牌、型号、颜色等。\n\
  \n类是面向对象编程的基石，因为它们是用来在你项目中所用对象的模板。它们是你适应编程风格的下一步。你从基础的自上而下脚本编写开始，进阶到使用函数，现在你通过关注类达到了顶峰。类的作用是允许你将所有内容放在一个地方，这个地方就是你自己创建的对象。这意味着它将包含以属性形式存在的数据以及以方法形式存在的命令。\n\
  \n虽然你编程旅程中的所有这些变化看起来可能让人应接 overwhelming，但你最终应该向面向对象编程努力。当你必须处理长且复杂的程序时，面向对象的方法将极大地减少你需要的工作量。OOP\
  \ 允许你复用大量的代码，因为对象可以从不同的类继承许多属性和方法。这意味着你可以轻松修改一个对象，或者创建一个包含其他对象部分数据的新对象。这得益于 OOP\
  \ 特有的继承（inheritance）概念。这意味着我们可以从一个通用对象构建一个对象，然后创建一个源自它的整个对象族。它看起来就像一个家族树。\n\n例如，假设我们有\
  \ `Flora`（植物）、`Fauna`（动物）和 `Minerals`（矿物）作为基础类。它们将有许多属性，可以传递给属于任一类的任何对象。这意味着你可以创建子类。例如，`Fish`\
  \ 和 `Bird` 是 `Fauna` 父类的子类，它们将从那里继承许多属性。此外，它们还将拥有不属于父类的独有属性。然后你可以创建另一轮子类，如 `Chicken`\
  \ 和 `Raven`，它们将从 `Bird` 类继承属性。然后我们可以再深入一点。假设我们有一个程序，在其中我们使用 `Fauna` 类创建一个 `Raven`\
  \ 实例，并将其命名为 `charlie`。这只乌鸦将继承所有乌鸦共有的 `caw()` 方法。因此，当我们编写代码时，可以通过输入 `charlie.caw()`\
  \ 来调用该方法，结果将打印字符串“Caw! Caw!”\n\n正如你看到的，在处理对象、类和方法时，我们使用的思维方式与现实完全相同。这是面向对象编程如此流行的主要原因之一。\n\
  \n## Python 命名空间\n\n在我们开始探索类以及如何定义类之前，你需要了解命名空间（namespaces），以便理解面向对象编程的整个概念。\n\n\
  命名空间允许从名称到对象的映射。默认它们以 Python 字典的形式出现，你可能甚至不会注意到它们。命名空间的一个例子是包含各种函数（如 `abs`）的集合。它还包括模块名或本地函数调用。甚至类的属性也会形成一个命名空间。你从中应该领会到，属于多个命名空间的相同名称之间没有任何关系。让我们以模块为例。我们可以有两个定义相同名称函数的不同模块，但它们不会互相混淆。它们是唯一且独立的。\n\
  \nPython 在你运行解释器时就会创建命名空间，但其中一些空间会在不同的时间启用并持续一段时间。例如，Python 内置的命名空间永远不会被删除。此外，当读取模块时，会为它定义一个全局命名空间，但当我们关闭解释器时，它就会消失。\n\
  \n\n\n\n请记住，虽然某些命名空间是预定义的，但我们并不一定能够从任何地方访问它们。这就是作用域（scope）再次发挥作用的地方在这种情况下，作用域也代表了我们可以直接访问命名空间的应用程序部分。在上一章中我们讨论了全局作用域和局部作用域，而通常来说，这里有三种。第一种是函数作用域，它有一个本地命名空间。第二是模块，它创建一个全局命名空间。最后是第三种，即通用作用域，它包含了所有预构建的默认命名空间。\n\
  \n## 定义类\n\n让我们从类的语法开始。这里有一个最基本的类示例：\n\n```python\nclass Raven:\n    <myStatement1>\n\
  \    <myStatement2>\n    <myStatementN>\n```\n\n在某种意义上，定义类的工作与定义函数几乎相同。类定义会在看到实际效果之前执行执行。然而，请记住，定义内部的语句通常以函数定义的形式存在。\n\
  \n关于语法，如你所见，我们需要使用关键字 `class` 后面跟该类的名称。此外，你可能已经注意到名称是以大写字母开头的。类的命名标准并不遵循与变量和函数命名相同的规则。请记住，这不是\
  \ Python 以某种方式强制执行的铁律。如果类名以下划线开头，你不会得到错误。然而，这是程序员和软件开发人员之间通认的约定，世界上大多数公司都遵循这一约定。\n\
  \n现在让我们使用创建的类来构建一个对象：\n\n```python\nmyObject = Raven()\nprint (myObject.x)\n```\n\
  \n我们创建了一个名为 `myObject` 的对象并打印了它的值 `x`。\n\n## 定义方法\n\n对象可以包含方法，实际上这些是属于它们的函数。让我们来看一个例子：\n\
  \n```python\nclass Man:\n    def __init__(self, name, age):\n        self.name =\
  \ name\n        self.age = age\n\n    def myfunction(self):\n        print (“Hi,\
  \ I am “ + self.name)\n\nx = Man (“Thomas”, 25)\nx.myfunction()\n```\n\n注意，我们有一个\
  \ `self` 参数，它指向我们类的当前实例。它被用于访问任何属于它的变量。请记住这并不意味着你可以将其命名为 `self`，它不是一个关键字。但是，拥有它是重要的，因为我们需要它作为属于类的函数的第一个参数。\n\
  \n你可能注意到的此示例与基本语法示例之间的另一个区别是，我们使用了名为 `__init__` 的函数。这种函数被称为构造函数。Python 中还有其他构造函数，你可以根据名称开头和结尾的下划线来识别它们。\n\
  \n基础类和对象在现实世界的应用中并不十分有用，但在这个函数的帮助下，我们可以赋予它们意义。`__init__` 函数在类初始化时执行，用于给对象分配多个值。此外，你还可以分配任何在创建对象时需要执行的其他操作。\n\
  \n## Python 继承\n\n继承是编程中最强大的概念之一。它允许你定义一个类，通过获取其功能来定义一个新类。请记住，你对新类（或子类）的修改不需要是极端的。如果你需要，你甚至可以创建许多相同的子类。\n\
  \n派生自主类的新类被称为子类。考虑到这一点，让我们来看继承的语法：\n\n```python\nclass MainClass:\n    #add functions\
  \ and statements\n\nclass ChildClass (MainClass):\n    #add functions and statements\n\
  ```\n\n这就是在 Python 中重用代码的方式。通过遵循这种结构，你可以通过创建一个它的子类来添加或修改主类的功能。\n\n注意 Python 提供了多种类型的继承：\n\
  \n1. **单继承**：这是我们目前为止一直在操作的。当只有一个子类继承其父类的特征时，它被称为单继承。\n2. **多重继承**：与 C++ 等某些编程语言不同，Python\
  \ 允许多重继承。这是创建一个继承多个父类特征的子类的可能性。语法略有变化，在于你通过逗号分隔它们来声明所有父类。\n3. **多级继承**：假设我们有一个继承父类特征的子类。多级继承是指当我们有第二个子类继承第一个子类的特征时。有时这种类被称为“孙子类”。\n\
  4. **层级继承**：当我们使用一个父类来构建多个子类时，我们就有了层级继承。\n5. **混合继承**：当我们结合几种类型的继承时，我们称之为为混合继承。\n\
  \n## 多态\n\n这翻译为具有多种形式。在编程中，多态代表了语言根据对象的类或数据类型处理对象的能力。在这一概念下，对象可以重新定义派生类的方法，从而使其代码适应其正在处理的数据类型。\n\
  \n由于多态对于初学者来说通常更难理解，因为它是一个相当高级的话题，让我们通过一个非编程的类比来获得更好的理解。想象你告诉某人去给你买午饭。如果你对一个 12\
  \ 岁的孩子这样说，他可能会骑上自行车，花他的钱买几个汉堡加薯条。与此同时，如果你对你的妻子说同样的话，她可能会开车去商店，为你买一些小牛肉排和蔬菜，并用信用卡支付。这本质上就是多态。\n\
  \n多态在面向对象编程中很重要，原因有两个。首先，它允许一个对象根据其参数执行方法的变体实现。其次，你为一种数据类型编写的代码可以使用另一个相关类型。多态是掌握\
  \ Python 编程的关键。\n\n多态试图模拟现实世界的另一个重要方面是编程语言通过类层次结构的能力。换句话说，它在执行它已经经常执行的事情，因为它在过去的某个时间点学会了。\n\
  \n如果你能够读书，你也可以阅读网页，网页与书页一样，但不需要翻页和物理交互。你还可以阅读路牌，可能还有其他语言的文本。所有这些例子都是读书的特殊版本。\n\n\
  在编程语言中，上面的示例展示了多态允许为特定类型编写的代码也可用于不同的派生类型。\n\n## 创建模块\n\n\n\n\n你已经有一些使用 Python 模块的经验了，主要是导入它们。然而，`Python`\
  \ 最强大的功能之一就是编写你自己的模块。\n\n编写自定义模块是复用或重用代码的另一种方式，因此在未来可以节省大量时间。例如，你可以使用已经定义的许多常用类并对其进行复用。假设你正在开发某种纸牌游戏，并且了某些类，如\
  \ `cards`（牌）和 `deck`（牌）。当你需要处理另一个纸牌游戏时，即使它是不同的，仍然需要这些游戏都包含的通用类，例如 `cards` 和 `decks`。\n\
  \n创建自己的模型的另一个用处是程序管理。当程序增长时，很容易在其中迷失。因此，你应该在模块的帮助下将它们拆分成细小的部分。假设你正在处理一个商业项目，有成千万行的代码要处理。这在专业软件中是意料之中的，然而这正是你最能发挥模块作用的时候。此外，如果程序是这样划分，你可以与其他程序员划分不同的部分并同时进行工作，从而节省大量时间。\n\
  \n除了以上优点之外，你还可以与你的朋友和同行程序员分享你的模块。无论你想通过电子邮件发送你的模块还是将其上传到社区论坛，你都可以做到。任何人都可以像处理默认模块一样下载并导入你的模块。\n\
  \n## 编写模块\n\n在本节中，我们将编写一个可以在简单游戏使用的模块。请记住，编写模块与编写任何其他脚本或程序没有区别。然而，当你规划模块时，应该考虑你将需要定义的所有函数和类。此外，一旦你有了它们，你就需要将它们放在一个文件中，稍后可以导入到你的新项目中。\n\
  \n考虑到这一点，让我们创建一个名为 `game` 的简单模块。我们将实现一个类和两个函数，以满足你在基础游戏中可能遇到的常见任务。让我们来看代码：\n\n```python\n\
  ## game\n\n# 编写自定义模块的示例\n\nclass Player(object):\n\n    \"\"\" 一个基础玩家。 \"\"\"\n\
  \    def __init__(self, name, score = 0):\n        self.name = name\n        self.score\
  \ = score\n\n    def __str__(self):\n        rep = self.name + \":\\t\" + str(self.score)\n\
  \        return rep\n\n    def ask_yes_or_no(question):\n        \"\"\"提问一个是或否的问题。\"\
  \"\"\n        response = None\n        while response not in (\"y\", \"n\"):\n \
  \           response = input(question).lower()\n        return response\n\n    def\
  \ ask_number(question, low, high):\n        \"\"\"询问一个范围内的数字。\"\"\"\n        response\
  \ = None\n        while response not in range(low, high):\n            response\
  \ = int(input(question))\n        return response\n\nif __name__ == \"__main__\"\
  :\n    print(\"此模块被直接执行而非导入。\")\n    input(\"\\n\\n 按回车键退出。\")\n```\n\n我们创建的这个模块被称为\
  \ `games`，因为默认情况下模块将以它们的文件命名。如果你查看代码本身，你将已经熟悉几乎所有内容，因为我们实现了一些在其他示例中使用过的函数。我们有一个\
  \ `player` 类，它定义了一个对象。该对象有两个属性，它们在构造函数中设置。然而，这个模块有一个我们之前没有探索过的独特方面。我们有一个 `if` 语句，它会验证程序是否是直接执行的。这意味着如果语句检查为真，应用程序将直接运行；但如果它为假，它将作为模块被导入。\n\
  \n## 总结\n\n在本章中，你学习了 `Python` 最重要的方面之一，那就是面向对象编程。请记住，本章的目的是向你介绍 `OOP`。这个主题对于初学者来说相当高级，所以如果你没有完全理解这些术语或理论，你不应该感到沮丧。\n\
  \n在这个关于 `OOP` 的短介绍章节中，你还学习了类、多态和继承。当你计划开发复杂程序时，所有这些概念都是重要的。此外，你还学习了更多关于模块以及如何编写你自己的模块。不要忘记，让你的代码可复用是你作为程序员的首要任务之一。如果你写了一个很好的函数或模块，请保存它，因为在某一天你会需要它。\n\
  \n# 第 8 章：异常\n\n无论你有多熟练、准备了多少充分、有多大的希望，项目永远不会如你预期的那样顺利。作为一名程序员，你需要预料可能会遇到异常的情况。\n\
  \n在 `Python` 中，异常是当代码出现问题且程序无法执行过问题所在行时出现的错误。修复错误将是你经常需要做的事情，这就是为什么在本章中，我们将专注于学习如何处理异常。\n\
  \n### 当事情变得失控时\n\n由于代码的简单，简单的程序几乎不会显示出任何异常行为。看看你最早的应用程序之一，例如“Hello World”。它背后的编程是简单，以至于如果你运行程序并运行正常，你就可以保证无论进行多少次测试它都将一直运行。然而，你已经积累了足够的知识来扩展你的程序，它们正变得越来越复杂。你写了更多行代码，并且正在使用更高级的编程概念，例如面向对象编程。随着项目复杂性的增加，你遇到异常和错误的机会大大增加。仅仅查看你的代码并认为它在每次执行周期中都能正常工作是不够的。\n\
  \n这是一个常见问题的简单示例。如果你的应用程序的配置文件没有正确的设置会怎样？或者它完全缺失了？请记住，拥有成百甚至上万行代码的复杂程序在某些会包含不再准确甚至不可用的损坏数据。此外，如果代码和数据都是完美的，但你的应用程序设计为连接网络服务器以获取某些信息，但连接不可用怎么办？某些情况下，错误本身并不重要，可以忽略；但当它重要时，你需要处理它。\n\
  \n当 `Python` 遇到阻止正常指令流的异常情况时，你将看到一个异常。目前，如果你遇到了一个，你可能会想要挖掘你的代码并开始编写一些处理该事件的额外行。然而，这涉及繁琐的工作，而且是对你时间的浪费。幸运的是，`Python`\
  \ 为你提供了一种易于编写和维护且不占用你时间的异常处理方法。这是一个简单的概念，虽然其他处理异常的方法，但你很快就会发现你很少需要异常处理以外的其他东西。\n\
  \n## 基础异常\n\n为了演示异常处理，我们将从最基本的错误开始，即除以零。这是一个简单的错误，你可能不会犯，因为它太显而易见，但它足以触发 `Python`\
  \ 的异常处理系统。只需输入以下行然后分析结果：\n\n```python\n1 / 0\n\nTraceback (most recent call last):\n\
  File \"<stdin>\", line 1, in <module>\n\nZeroDivisionError: int division or modulo\
  \ by zero\n```\n\n\n\n\n## 引言\n\n如果你还记得，在之前的某个章节中，你遇到过一个生成的报告与此非常类似的错误。让我们先分析算术操作。正如你所知道的，除法需要一个被除数和一个除数。这是最基础的操作之一，但在深层，Python\
  \ 会经过一系列内部验证。它会检查两个参数是否为数字，以及除数是否不为零。当满足条件时，我们就得到了预期的结果。然而，当由于某项检查失败时，操作将依赖 Python\
  \ 的异常处理机制。除数为零的结果是一个名为 `ZeroDivisionError` 的类，它生成一个异常对象。在编程术语中，这意味着操作抛出（raised）了一个异常。\n\
  \n注意“raised”一词的含义，因为它指的是某个问题通过层级结构传递。发生的情况是：第一个函数调用第二个函数，第二个函数包含除以零的操作，因此运算符会在内部抛出异常。由于第二个函数无法自行处理该异常，它又向第一个函数抛出异常。最后，该异常在任何情况下都无法处理，因此解释器向你抛出该异常。幸运的是，这个异常像任何\
  \ Python 代码一样易于阅读和理解。我们在示例末尾看到的报告被称为回溯（traceback）。\n\n请记住，在某些编程语言中没有“抛出异常”的概念。相反，它们是投掷（throwing）或捕获（catching）异常。这意味着异常被投掷给第二个函数，但如果它未能捕获，则就会将其带到第一个函数。基本上，过程是相同的，但术语不同。\n\
  \n## 异常处理\n\n当你遇到异常时，处理它的最简单方法之一是在脚本中实现 `try` 语句。`try` 块的作用是寻找错误，然后由 `except` 块来处理它。这里有一个导致错误的语句的简单示例：\n\
  \n```python\nprint(x)\n```\n\n由于我们没有定义 `x`，这将导致错误，且如果没有 `try` 语句来抛出它，程序将直接崩溃。现在让我们用以下几行代码处理异常：\n\
  \n```python\ntry:\n    print (x)\nexcept:\n    print (“发生了异常”)\n```\n\n如果你想捕获多个错误，也可以定义多个异常语句。这里有一个示例：\n\
  \n```python\ntry:\n    print (x)\nexcept NameError:\n    print (“变量 x 没有定义”）\nexcept:\n\
  \    print (“发生了其他错误”)\n```\n\n如果我们的 `try` 语句抛出了 `NameError` 异常，程序将打印第一条消息；如果发生了任何其他错误，我们将看到第二条消息。\n\
  \n通过 `try` 语句处理异常时，你还可以使用 `else` 关键字来指定在没有错误时执行代码。这里有一个示例：\n\n```python\ntry:\n\
  \    print (“Hello World”)\nexcept:\n    print (“发生了错误”)\nelse:\n    print (“一切正常”)\n\
  ```\n\n## 异常类\n\n在 Python 中，我们有许多异常类，这些类告知程序员在代码执行期间到底发生了什么问题。请注意，这些内置类实际上是主异常类\
  \ `BaseException` 的子类。这意味着你所处理的每一个异常都是基于该类的。\n\n在下一个示例中，我们将抛出多个异常，以找出它们是从哪些类继承了特性的。为了做到这一点，我们将使用数组来存储异常并处理它们，然后调查它们的主类。代码如下如下：\n\
  \n```python\nstore = []\n\n# 创建多个不同的异常并处理它们\ntry: {}[\"foo\"]\nexcept KeyError as\
  \ e: store.append(e)\n\ntry: 1 / 0\nexcept ZeroDivisionError as e: store.append(e)\n\
  \ntry: \"\".bar()\nexcept AttributeError as e: store.append(e) \n\n# 遍历错误并打印类层级\n\
  for exception_object in store:\n    ec = exception_object.__class__\n    print(ec.__name__)\n\
  \    indent = \" +-\"\n    while ec.__bases__:\n        # 将 ec 的父类赋值给自身并增加\n   \
  \     ec = ec.__bases__[0]\n        print(indent + ec.__name__)\n        indent\
  \ = \"  \" + indent\n```\n\n结果应该像这样：\n\n```\nKeyError\n+-LookupError\n+-Exception\n\
  +-BaseException\n+-object\nZeroDivisionError\n+-ArithmeticError\n+-Exception\n+-BaseException\n\
  +-object\nAttributeError\n+-Exception\n+-BaseException\n+-object\n```\n\n现在我们有了每个异常从主类派生的层级结构。如果你想了解更多关于每个异常的信息，可以在\
  \ Python 文档库中找到这些异常。然而，你很少需要处理一个异常列表。通常情况下，你会尝试捕获特定的异常并单独处理它，或者你为每一个异常创建一个通用的捕获。\n\
  \n虽然 Python 拥有的每个异常类都可以在此层级中找到，但你需要注意，这也包括任何自定义异常。是的，你甚至可以创建自己的异常类，这些类可以从父类继承各种特性。我们不会详细介绍这个主题，因为初级程序员在大多数情况下并不需要它们。\n\
  \n# 断言错误 (Assertion Error)\n\n这种错误的目的是告诉程序员程序出现了一种程序无法恢复的错误。它们不应该显示诸如“变量未定义”之类的报告，因为那通常允许你采取措施。断言（Assertions）本质上是代码中的自检。它们验证程序是否包含任何不可能的条件。如果在执行过程中遇到了这些条件，程序将以断言错误的形式崩溃，并告诉你原因。\n\
  \n断言是很好的工具，可以让你知道有 bug 并需要尽快修复。要放置断言，你需要使用 `assert` 关键字。通常，程序员会将该语句放在函数开头检查输入，或放在函数结尾检查输出。当\
  \ Python 检测到断言语句时，它会分析与其关联的表达式。如果评估结果为真，则函数可以正常运行。然而，如果你得到的读结果为假，就会发现一个断言错误异常。\n\
  \n其语法如下：\n\n```python\nassert Expression [, Arguments]\n```\n\n请记住，断言错误可以用与其他任何异常相同的方式处理。只需使用\
  \ `try / except` 语句。只需确保捕获了断言，否则程序将直接崩溃。\n\n## 总结\n\n在本章中，你学习了基础错误、异常以及处理它们的最常用技术。将异常处理加入你的项目开发阶段并利用\
  \ `try / except` 语句。此外，你还学习了断言错误，这是一个稍微复杂一点，但可以用与其他异常相当的方式解决。\n\n## 参考文献\n\n- Barry,\
