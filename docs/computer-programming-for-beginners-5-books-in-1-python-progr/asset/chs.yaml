  - 模拟输入：`12 pins`\n- 工作电压：`3.3V`\n- 输入电压：`5V`\n\n## Arduino Leonardo ETH\n\n这是一个带有以太网端口的\
  \ `Arduino Leonardo` 微控制器板，允许项目扩展到物联网。你可以通过这种方式使用互联网来控制传感器，将你自己的设备作为服务器或信号提供者，或者作为客户端与微控制器通信以接收指令。它还包含一个\
