  Arduino 简介\n\n如果你从未听说过 Arduino，它是一个开源电子接口，由两部分组成：第一部分是可编程的电路板，另一部分是你选择的用于在计算机上运行的编码程序。Arduino\
  \ 有多种形式，包括 `Arduino Uno`、`LilyPad Arduino`、`Redboard`、`Arduino Mega`、`Arduino Leonardo`\
  \ 等，我们稍后会进行解释。\n\n如果你对编程不熟悉，这是一个很好的入门点。Arduino 可以多种类型的编程语言进行编程，其丰富的 Arduino 选项可以为你提供更多的编程经验。Arduino\
  \ 带有额外的附件，有些是传感器的形式，另一些可以在任何地方获得并连接到 Arduino 的各种端口上。Arduino 是理解编程和传感器交互道路上的绝佳跳脚石。\n\
  \n在编程语言中，总有一个广为人知的程序——显示在屏幕上的“Hello World”。在我们目前所处的微控制器世界中，这个阶段或第一个程序通过灯光的闪烁（“开启”和“关闭”）来表示，证明你设置的所有内容运行正常。\n\
  \n我们将完整地查看这些程序（sketches），并在解释代码后详细说明细节。如果你读到某些内容仍然无法看出头绪，请继续阅读，一切都会变得清晰的。\n\n让我们来看这个程序，向你展示我们将如何拆解代码。\n\
  \n```cpp\nconst int PinkL = 13;\n\nvoid setup ()\n{\n  pinMode (PinkL, OUTPUT);\n\
  }\n\nvoid loop ()\n{\n  digitalWrite(PinkL, HIGH);\n  delay (600);\n  digitalWrite(PinkL,\
  \ LOW);\n  delay(600);\n}\n```\n\n### 第一部分\n```cpp\nconst int PinkL = 13;\n```\n\
  这一行用于定义一个常量，该常量在程序中用于指定特定值。建议所有引脚都使用这种方式，因为如果电路保持不变，软件更改会非常方便。在 Arduino 编程中，常量通常以字母“k”开头。\n\
  \n### 第二部分\n```cpp\nvoid setup ()\n{\n  pinMode (PinkL, OUTPUT);}\n}\n```\n`OUTPUT`\
  \ 指的是第 13 号引脚。\n\n### 第三部分\n```cpp\nvoid loop ()\n{\n  digitalWrite(PinkL, HIGH);\n\
  \  delay (600);\n  digitalWrite(PinkL, LOW);\n  delay(600); }\n```\n在 `digitalWrite(PinkL,\
  \ HIGH)` 中，`digitalWrite` 函数将引脚 `PinkL` 设置为 `HIGH`（高电）。在 `delay(600)` 中，程序暂停 600\
  \ 毫秒。在 `digitalWrite(PinkL, LOW)` 中，它将引脚 `PinkL` 设置为 `LOW`（低电），随后是另一个 `delay(600)`。\n\
  \n\n\n\n\n所有的程序语句**必须**以分号结束。这意味着每个语句除以下两种情况外外：\n\n- 在注释中\n- 在放置大括号 `}` 之后\n\n###\
  \ 测试你所学知识的赋值任务：\n\n1. 修改你的 LED 在重新开启之前的延迟时间，将其固定为 1.5 秒。将 LED 的开启时间限制在 600 毫秒。\n\
  2. 将引脚从 `pin 13` 更改为 `pin 2`，使其成为 LED 的新连接。请记住，电路和程序都会发生变化。\n\n这只是基础 Arduino 编程的基础。在书的其余部分，我们将介绍如何针对不同的功能对\
  \ Arduino 进行编程。如果你是编程初学者，不要被上面的代码吓到。编码需要练习，但它相对容易学习，就像学习一门新语言一样。\n\n# 什么是 Arduino？\n\
  \n随着科技时代的飞速发展，普通人的技术素养正在提高。越来越多的人开始精通现代世界的硬件和软件，无论是作为业余爱好者，还是作为专业工程师。\n\n出于某种原因，你和许多许多人都被\
  \ Arduino 所吸引。也许你曾在网上或现场见过各种基于 Arduino 技术构建的项目，或者也许你听过使用 Arduino 制作设备的灵性和便利性。无论如何，你对学习更多关于\
  \ Arduino 以及如何在自己的生活中利用这项技术感兴趣。首先，让我们来看看 Arduino 是什么及其历史。\n\n## Arduino 的历史\n\n\
  Arduino 技术最初是 2003 年 Hernando Barragán 的一个想法，目的是简化 BASIC 晶片微控制器，并降低意大利伊里亚交互式设计学院的非工程类学生购买此类技术的成本。微控制器是一个小型计算板，可以编程以执行特定功能。当时，BASIC\
  \ 晶片微控制器的价格在 100 美元以上，正如我们后面看到的，Arduino 在保持执行各种功能的能力和编程编程便利性的同时，无疑降低了成本。\n\n在 Massimo\
  \ Banzi 和 Casey Reas 的监督下，Barragán 使用名为 `Processing` 的计算机语言创建了环境 `IDE`（Arduino 的官方编码环境和程序）。他研究了\
  \ `Wiring` 平台技术，开发出了名为 `ATmega168` 的硬件，这是第一个 Arduino 微控制器。\n\n随后在 2003 年，Massimo\
  \ Banzi、David Mellis 和 David Cuartielles 为他们的名为 `ATmega8` 的微控制器板增加了对 `Wiring` 的支持，并重新编写了\
  \ `Wiring` 源码，将其命名为 Arduino。这三个人加上 Tom Igoe 和 Gianluca Martino 继续开发 Arduino 技术。到\
  \ 2013 年，仅纽约纽约市的供应商 Adafruit Industries 一就售出了 70 万块微控制器板。\n\n在建立 Arduino 商标方面遇到一些问题后（这导致公司在几年内发生了分裂），Arduino\
  \ 现在是一家单一的公司，致力于开发普通人或爱好者使用的硬件和软件，但同时也足够灵活，能够引起专业工程师的兴趣。\n\n### 但 Arduino 是什么？\n\
  \n这段 Arduino 的历史听起来可能像技术本身对你来说一样复杂。它包含了许多令人困惑和混乱的元素，你可能会对“微控制器”、“环境”和“语言”等术语感到不知所措。然而，本书旨在消除\
  \ Arduino 的神秘感。我们将从这里开始，从 Arduino 的定义开始。\n\n它的工作原理如下：购买符合其用途的硬件，然后在性能更强大的 Windows、Macintosh\
  \ OSX 或 Linux 计算机上为开发板编写或编写指令，并通过电缆上传这些指令。代码随后存储在微控制器中，并根据指令运行，例如当光线通过打开的门进入时激活蜂鸣声。光线激活连接到微控制器的传感器，如报警器。\n\
  \n# 谁在使用 Arduino？\n\n广泛的人群使用 Arduino 用于各种项目和爱好，以及专业用途。它以简单直接对初学者友好，以深度和丰富可以让初学者成长，并且有足够的潜力供高级用户利用。\n\
  \n教师和学生使用 Arduino，他们确实是这些产品的目标消费群，因为 Arduino 提供了一种低成本构建科学仪器的方法。这允许老师和学生实践和演示化学和物理原理，并开始学习和构建机器人。\n\
  \n设计师和建筑师可能会使用 Arduino 技术来构建他们希望全规模开发的交互式模型和原型。音乐家和艺术家也使用 Arduino 微控制器在他们的艺术中尝试新的乐器或技术。\n\
  \n任何人都可以使用 Arduino，包括想要开始摆弄编码和计算机硬件的孩子，以及只想简单学习软件和微型计算机的爱好者。\n\n## Arduino 的 6 个优势\n\
  \n- 创造 Arduino 微控制器的驱动力是成本效益。其他某些板的价格为 100 美元，而一块预装好的 Arduino 板价格不到 50 美元，而那些可以手动组装的板价格更低。\n\
  - Arduino 环境 `IDE` 跨平台工作。这意味着你可以使用 Windows 计算机（就像任何其他微控制器板可能要求的那样），你也可以使用 Macintosh\
  \ OSX 计算机或运行 Linux 的计算机，并同样轻松地与 Arduino 软件配合。这为 Apple 用户和开源 Linux 用户打开了使用微控制器的大门。\n\
  - Arduino 软件是开源的。用于指示微控制器完成某些功能的工具或代码字符串任何人都可以访问。你不需要购买许可即可使用这些工具，这样老师就可以教学生使用它们，学生无需额外费用即可学习。\n\
  - 开源工具还可以通过 `C++` 库和 `AVR-C` 编码语言进行扩展，这意味着对代码有深入知识的人也可以从这些技术中受益。软件和编程功能具有深度，可以让更投入的人深入探索，同时也提供了简单的编程语言让爱好者进行尝试。\n\
  - 人为微控制器编码的环境是简单清晰的。这意味着你用于为微控制器编写指令的计算机程序`IDE`）是直观且易于理解的。这使得操作软件的过程非常顺畅。\n- 开源硬件。Arduino\
  \ 板技术根据知识共享许可发布。任何有需求且有相关知识的人都可以发现并创建自己的硬件，与 `IDE` 环境中的 Arduino 软件配合使用。即使是没有经验的设计师可以使用面包板创建自己的\
  \ Arduino 电路板。\n\n# 理解 Arduino 的关键术语\n\n在使用 Arduino 技术时，了解 Arduino 的术语非常有帮助。你需要理解术语来选择板子、编写编码指令、设置微控制器以及最后使用\
  \ Arduino 板。在本章中，你将发现一些关键术语，它们对你成为 Arduino 用户将非常有帮助。\n\n\n\n\n\n如前所述，`Arduino` 是开源的，这意味着你可以使用它并教给他人，而不会违反任何版权法。它基于易于使用的硬件（即你将要操作的实际物理电路板）和直观的软件（即你用来引导硬件执行你所选任务的编码指令）。软件也被称为代码，而单条指令被称为工具。\n\
  \n# Arduino 板板结构详解\n\n板板本身包含许多部分。`digital pins`（数字引脚）分布在大多数 `Arduino` 微控制器的边缘，用于输入（或对状态的传感）以及输出（控制器对输入的响应）。例如，输入可以是光传感器感应到黑暗，即缺少光线。随后，它将闭合电路并点亮灯泡作为输出：为你的孩子准备一盏夜灯。\n\
  \n在大多数板板上，会有一个 `Pin LED`，它与特定的引脚关联，例如 `Arduino Uno` 上的 `Pin 13`。这个 `Pin LED` 是板内置的唯一输出选项，它将帮助你完成第一个“闪灯脚本（blink\
  \ sketch）”项目，该项目稍后会解释。`Pin LED` 也用于调试或修复你编写的代码，以确保其中没有错误。`Power LED` 正如其名：当板板接收电源或“开启”时，它会亮起。这对于调试你的代码也有帮助。\n\
  \n每个板板上都存在控制器本身，被称为 `ATmega` 微控制器，它是整个板板的大脑。它接收你的指令并采取行动。没有它，整个板板将没有任何功能。\n\n`Analog\
  \ in pins`（模拟输入引脚）位于 `Arduino Uno` 上相对于 `digital pins` 的对边缘。它是 `Arduino` 系统的输入。`Analog`（模拟）意味着输入的信号不是恒定的，而是随时间变化的，例如音频输入。在音频输入的示例中，房间内的听觉输入会随着房间内人的说话以及从房间外过滤进噪声而变化。\n\
  \n`GND` 和 `5V` 引脚用于为电路和微控制器提供额外的 `5V` 电源。电源接口通常位于 `Arduino` 板板的边缘，用于在未插入 `USB` 时为微控制器供电。`USB`\
  \ 端口也可以作为电源源，但它的主要功能是从你的电脑上上传或传输你的脚本（即你编写的一组指令）到 `Arduino`。\n\n`TX` 和 `RX LED` 用于指示正在发生信息传输。这种通信指示会在你从电脑将脚本上传到\
  \ `Arduino` 时发生，它们在交换期间会快速闪烁。\n\n`reset button`（重位按钮）顾其名：它将微控制器重置为出厂设置，并擦除你上传到 `Arduino`\
  \ 的任何信息。\n\n# 关于使用 Arduino 的其他术\n\n`Arduino` 系统中有三种内存。内存是存储信息的空间。\n\n`Flash memory`（闪存）是存储你编写的程序代码的地方。它也被称为“程序空间”，因为当你将其上传到\
  \ `Arduino` 时，它会被自动用于该程序。当电源断开或 `Arduino` 关闭时，这种类型的内存会保持完整。\n\n`SRAM`（静态随机存取存储器）是你创建的脚本或程序用于创建、存储和处理来自输入源信息以产生输出的空间。这种存储器在电源关闭后会消失。\n\
  \n`EEPROM` 像一个微型硬盘，允许编程器在 `Arduino` 关闭时存储程序本身以外的信息。`EEPROM` 有独立的指令用于读取、写入和擦除，以及其他功能。\n\
  \n某些 `digital pins` 被指定为 `PWM pins`（PWM 引脚），这意味着它们可以使用数字手段创建模拟信号。正如我们记忆的，`Analog`\
  \ 意味着输入（或输出）是变化的而非恒定的。通常，`digital pins` 只能产生恒定的能量流。然而，`PWM pins` 可以改变在 `0` 到 `5\
  \ Volts` 之间的能量“脉冲”。你编写的某些任务只能由 `PWM pins` 完成。\n\n此外，在比较微控制器板时，你可能需要查看时钟频率即微控制器运行的速度。速度越快，板的响应越快，但消耗的电池或能量也越多。\n\
  \n`UART` 设备可以处理的串口通信行数。串口通信行是串行传输数据的行，即按行传输而不是并行或同时传输。处理串行处理事物比并行处理所需的硬件少得多。\n\n\
  某些项目将让你把设备连接到物联网，这本质上描述了除了台式电脑和笔记本电脑以外的设备到各种网络的互连性，以共享信息。从智能冰箱、智能手机到智能电视都连接到了物联网。\n\
  \n# 理解选择\n\n现在我们已经了解了 `Arduino` 微控制器板的一些基础知识，让我们看看在购买 `Arduino` 板时拥有的各种选择。我们将考虑价格、功能、内存量和其他特征，以帮助你做出尽可能简单直接的决策。\n\
  \n## Uno\n\n这是大多数开启 `Arduino` 之之旅的板板。在内存方面它较小，但在功能上非常灵活，是初学者以及那些想要在 `Arduino` 上尝试技巧和思维的人的绝佳工具。此型号有一个\
  \ mini-USB 端口，允许...\n\n- 价格：$24.95\n- 闪存内存：`32kB`\n- SRAM：`2kB`\n- EEPROM：`1kB`\n\
  - 处理速度：`16MHz`\n- 数字引脚：`14 pins`\n- PWM 引脚：`6 pins`\n- 模拟输入引脚：`6 pins`\n- 工作电压：`5V`\n\
  - 输入电压：`7-12V`\n\n## Leonardo\n\n`Leonardo` 微控制器板由于其 `ATmega32U4` 处理器，可以可以被电脑识别为鼠标或键盘。\n\
