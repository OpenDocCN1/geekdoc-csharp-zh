  function printX() {\n  let x = 20;\n  console.log(x);\n}\n\nprintX(); // → 20\n\
  console.log(x); // → 10\n```\n\n### 狼人日志\n\n我们将编写一个简单的日志记录器。\n\n```javascript\n\
  let journal = [];\n\nfunction addEntry(events, squirrel) {\n  journal.push({events,\
