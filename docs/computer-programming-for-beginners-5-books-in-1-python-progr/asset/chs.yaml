  \n# 第 9 章：缺陷与错误\n\n计算机程序的缺陷被称为 bug，即计算机程序犯的错误。\n\n### 严格模式\n\n你可以在严格模式下使用 JavaScript。这可以通过在文件开头添加字符串\
  \ `\"use strict\"` 来实现。以下是一个示例：\n\n```javascript\nfunction canYouSpotTheProblem()\
  \ {\n  \"use strict\";\n  for (counter = 0; counter < 10; counter++) {\n    console.log(\"\
  Happy happy\");\n  }\n}\ncanYouSpotTheProblem();\n// → ReferenceError: counter is\
  \ not defined\n```\n\n当你想要调用构造函数而省略 `new` 关键字时，请使用下面的代码，这样它就不会引入新创建的对象：\n\n```javascript\n\
  function Person(name) {this.name = name;}\nlet Ferdinand = Person(\"Ferdinand\"\
  ); // oops\nconsole.log(name);\n// → undefined\n```\n\n在严格模式下，`\"use strict\"` 会全局绑定并返回\
  \ undefined。\n\n```javascript\nfunction Person(name) {this.name = name;}\nlet Ferdinand\
  \ = Person(\"Ferdinand\"); // oops\n// → TypeError: Cannot set property 'name' of\
  \ undefined\n```\n\n构造函数不允许没有 `new` 的调用。\n\n### 测试\n\n你可以使用此函数来发现程序中的错误。它是通过反复运行。这种过程被称为测试。它允许你验证代码部分。以下是一个示例：\n\
  \n```javascript\nfunction test(label, body) {\n  if (!body()) console.log(`Failed:\
  \ ${label}`);\n}\n\ntest(\"convert Latin to uppercase\", () => {\n  return \"hello\"\
  \ == \"HELLO\";\n});\n\ntest(\"convert Greek to uppercase\", () => {\n  return \"\
  αίτε\" == \"ΧΡΕ\";\n});\n\ntest(\"don't convert case\", () => {\n  return \"��σ\"\
  ;\n});\n```\n\n### 调试\n\n当程序显示错误时，下一步是确定问题并修复它。错误消息将直接指向某行。这个示例尝试将一个整数转换为字符串。\n\n\
  ```javascript\nfunction numberToString(n, base = 10) {\n  let result = \"\", sign\
  \ = \"\";\n  if (n < 0) {\n    sign = \"-\";\n    n = -n;\n  }\n  do {\n    result\
  \ = String(n % base) + result;\n    n /= base;\n  } while (n > 0);\n  return sign\
  \ + result;\n}\n\nconsole.log(numberToString(13));\n// → 13\n```\n\n在程序中添加一些 `console.log`\
  \ 调用是你想要获取更多执行信息的极佳路径。我们希望 `n` 获取值 13、1，然后是 0。我们应该在循环开始时说明值。\n\n13\n1.3\n0.13\n\
  0.013…\n1.5e-323\n\n除以 13 不提供整数。而不是 `n /= base`，我们想要的是 `n = Math.floor(n / base)`，这样数字就可以向右“移动”。\n\
  \n另一种指定断点的绝方法是在程序中插入 `debugger` 语句（关键字）。如果浏览器处于激活状态，开发者工具会在程序运行到该语句时捕获并暂停程序。\n\n\
  ### 异常\n\n当函数无法继续时，异常处理是理解如何修复该问题的地方。异常是一种工具，允许遇到困难的代码块抛出异常，并且异常可以是任何值。你可以故意在你的代码行中创建问题，以便在它的执行过程中捕获异常，这样你就可以用它解决问题并继续工作。\n\
  \n这里是一个示例：\n\n```javascript\nfunction promptDirection(question) {\n  let result\
  \ = prompt(question);\n  if (result.toLowerCase() == \"left\") return \"L\";\n \
  \ if (result.toLowerCase() == \"right\") return \"R\";\n}\n```\n\n\n\n\n```javascript\n\
  throw new Error(\"Invalid direction: \" + result);\n}\n\nfunction look() {\n  if\
  \ (promptDirection(\"Which way?\") == \"L\") {\n    return \"a house\";\n  } else\
  \ {\n    return \"two angry bears\";\n    135\n  }\n}\n\ntry {\n  console.log(\"\
  You see\", look());\n} catch (error) {\n  console.log(\"Something went wrong: \"\
  \ + error);\n}\n```\n\n使用 `throw` 关键字来抛出异常。\n\n## 异常后的清理\n\n异常的影响是一种不同类型的控制流。这表明你的代码可能有不同的副作用，但异常可以阻止这些的发生。以下是一段糟糕的银行代码：\n\
  \n```javascript\nconst accounts = {\n  a: 100,\n  b: 0,\n  c: 20\n};\n\nfunction\
  \ getAccount() {\n  let accountName = prompt(\"Enter an account name\");\n  if (!accounts.hasOwnProperty(accountName))\
  \ {\n    throw new Error(`No such account: ${accountName}`);\n  }\n  return accountName;\n\
  }\n\nfunction transfer(from, amount) {\n  if (accounts[from] < amount) return;\n\
  \  accounts[from] -= amount;\n  accounts[getAccount()] += amount;\n}\n```\n\n`transfer`\
  \ 函数用于将特定金额从一个账户发送到另一个账户，并要求另一个账户的名称。如果你输入错误的账户名称，`getAccount` 会输出异常。如果钱已经从第一个账户发出，但在程序将钱转移到另一个账户之前输出了异常，钱就会消失。解决这个问题，请利用\
  \ `finally` 块代码。如下所示：\n\n```javascript\nfunction transfer(from, amount) {\n  if\
  \ (accounts[from] < amount) return;\n  let progress = 0;\n  try {\n    accounts[from]\
  \ -= amount;\n    progress = 1;\n    accounts[getAccount()] += amount;\n    progress\
  \ = 2;\n  } finally {\n    if (progress == 1) {\n      accounts[from] += amount;\n\
  \    }\n  }\n}\n```\n\n## 选择性捕获\n\n当异常到达代码块底部且没有错误时，它将由环境处理。无效的使用，例如在 null 上检查属性、引用不存在的绑定或调用非函数，将导致抛出异常。这些异常可以被捕获。JavaScript\
  \ 不支持选择性捕获异常。下面的示例尝试继续调用 `promptDirection` 直到它提供有效的答案：\n\n```javascript\nfor (;;)\
  \ {\n  try {\n    let dir = promtDirection(\"Where?\"); // ← 拼写错误！\n    console.log(\"\
  You select \", dir);\n    break;\n  } catch (e) {\n    console.log(\"Invalid direction.\
  \ Try again.\");\n  }\n}\n```\n\n`for (;;)` 结构用于构建一个无法自动终止的循环。当你有一个有效的方向时，可以跳出循环，但拼写错误的\
  \ `promptDirection` 将输出未定义变量错误。如果你想捕获特定类型的异常，可以在 `catch` 块中检查你拥有的异常是否与你想相同的，并重新抛出它。让我们描述一种新错误并利用\
  \ `instanceof` 来识别它。\n\n```javascript\nclass InputError extends Error {}\n\nfunction\
  \ promptDirection(question) {\n  let result = prompt(question);\n  if (result.toLowerCase()\
  \ == \"left\") return \"L\";\n  if (result.toLowerCase() == \"right\") return \"\
  R\";\n  throw new InputError(\"Invalid direction: \" + result);\n}\n```\n\n新的错误类继承自\
  \ `Error`。它没有描述自己的构造函数，而是继承了 `Error` 构造函数，该函数预期一个字符串消息，我们可以通过它识别它。\n\n现在循环可以更仔细地捕获这些异常：\n\
  \n```javascript\nfor (;;) {\n  try {\n    let dir = promptDirection(\"Where?\");\n\
  \    console.log(\"You chose \", dir);\n    break;\n  } catch (e) {\n    if (e instanceof\
  \ InputError) {\n      console.log(\"Invalid direction. Try again.\");\n    } else\
  \ {\n      throw e;\n    }\n  }\n}\n```\n\n## 总结\n\n本章涉及调试。编程的一个基本组成部分是识别和修复错误。有时，你可以本地解决问题。你可以通过特殊的返回值或使用异常跟踪它们。\n\
  \n## 练习\n\n修复下面的损坏代码并指出问题：\n\n```javascript\nfor(var I=0; I > 5; I++){\n  console.log(i)\n\
  }\n```\n\n**解决方案**\n\n问题 – 循环内部条件错误。\n\n# 第 10 章：正则表达式\n\n编程概念和工具以乱无章的方式进步，但它的成功表明这是一项卓越的技术。在本章中，我们将讨论正则表达式。它们用于在字符串数据中定义模式。它们创建了一种小的、不同的语言，由\
  \ JavaScript 以及其他语言组成。\n\n### 创建正则表达式\n\n正则表达式使用 `RegExp` 构造函数构建，或者通过将模式封装在正斜杠（`/`）字符中来写为严格值。\n\
  \n```javascript\nlet re1 = new RegExp(\"ABC\");\nlet re2 = /ABC/;\n```\n\n这两个正则表达式对象代表相同的模式。在使用\
  \ `RegExp` 构造函数时，将模式写为普通字符串，这样规则就适用于反斜杠。\n\n第二种表示法对反斜杠的影响不同，它首先在任何正斜杠之前放置一个反斜杠。\n\
  \n### 测试匹配\n\n正则表达式对象包含 `test` 方法，用于确定字符串是否包含匹配，返回布尔值。\n\n```javascript\nconsole.log(/abc/.test(\"\
  abcde\")); // true\nconsole.log(/abc/.test(\"abxde\")); // false\n```\n\n正则表达式允许在字符串任何地方出现\
  \ `ABC`。\n\n### 字符集\n\n正则表达式允许我们指示模式。如果你想匹配任何数字，在方括号内放置集合。\n\n```javascript\nconsole.log(/[0123456789]/.test(\"\
  in992\")); // true\nconsole.log(/[0-9]/.test(\"in992\")); // true\n```\n\n常用快捷方式：\n\
  - `\\d`: 任何数字（`[0-9]`）\n- `\\w`: 字母数字字符\n- `\\s`: 任何空白字符（空格、制表符、换行符）\n- `\\D`: 不是数字的字符\n\
  - `\\W`: 非字母数字字符\n- `\\S`: 非空白字符\n\n所以，匹配如 `01-30-2003 15:20` 的日期和时间格式：\n\n```javascript\n\
  let dateTime = /\\d\\d-\\d\\d-\\d\\d \\d\\d:\\d\\d/;\nconsole.log(dateTime.test(\"\
  01-30-2003 15:20\")); // true\nconsole.log(dateTime.test(\"30-jan-2003 15:20\"));\
  \ // false\n```\n\n这些反斜杠代码也用于方括号内。例如，`[\\d.]` 表示任何数字或周期字符，但点在这里没有意义，就像其他特殊字符如 `+`\
  \ 一样。\n\n```javascript\nlet notBinary = /[⁰¹]/;\nconsole.log(notBinary.test(\"110010001010110\"\
  )); // false\nconsole.log(notBinary.test(\"110010001020110\")); // true\n```\n\n\
  ### 重复模式\n\n现在你完美理解了如何匹配单个数字。如果你想匹配一个整数或一系列更多的数字，在正则表达式的输入后立即放置一个加号（`+`）。这意味着该元素可以重复多次，`\\\
  d+` 等于一个或多个数字字符。\n\n```javascript\nconsole.log(/\\d+/.test(\"123\")); // true\n\
  console.log(/\\d+/.test(\"\")); // false\nconsole.log(/\\d*/.test(\"123\")); //\
  \ true\nconsole.log(/\\d*/.test(\"\")); // true\n```\n\n星号（`*`）允许模式等于零。在下面的示例中，`u`\
  \ 字符允许出现，但当未找到它时模式也是相等的。\n\n```javascript\nlet neighbor = /neighbour/;\nconsole.log(neighbor.test(\"\
  neighbour\")); // true\nconsole.log(neighbor.test(\"neighbor\")); // true\n```\n\
  \n\n\n\n要确定一个模式是否应该执行特定次数，请使用大括号 `{}`，在元素后插入 `{4}`。如果你想让它精确执行四次，可以定义如下范围：\n\n`{2,4}`\
  \ 表示该元素必须执行两次，且最多执行四次。以下是另一个日期和时间模式，它同时支持单数字和双数字日期、月份和小时。\n\n```javascript\nlet\
  \ dateTime = /\\d{01,2}-\\d{1,2}-\\d{4} \\d{1,2}:\\d{2}/;\n\nconsole.log(dateTime.test(\"\
  01-30-2003 8:45\"));\n// → true\n```\n\n### 子表达式分组 (Grouping subexpressions)\n\n\
  如果你想在一个或多个元素上并发使用如 `*` 或 `+` 这样的运算符，请使用括号。正则表达式中，被用括号引用的部分，只要涉及运算符，就会被视为一个独立的元素。\n\
  \n```javascript\nlet cartoonCrying = /boo+(hoo+)+/i;\n\nconsole.log(cartoonCrying.test(\"\
  Boohoooohoohooo\"));\n\n// → true\n```\n\n第一个和第二个 `+` 字符仅作用于 `boo` 和 `hoo` 中的第二个。第三个\
  \ `+` 指向整个分组 `(hoo+)`，相当于一次或多次连续这样的结构。示例中第一个表达式结尾的 `I` 用于不区分大小写，使其能够匹配字符串中的大写字母\
  \ `B`，尽管该模式完全是小写的。\n\n### 匹配与分组 (Matches and groups)\n\n`test` 方法是匹配正则表达式的最佳方式，它仅确定是否匹配。正则表达式包含一个\
  \ `exec`（执行）方法，如果找不到匹配项，它将输出 `null`，并返回一个包含匹配数据的对象。\n\n```javascript\nlet match\
  \ = /\\d+/.exec(\"one two 100\");\n\nconsole.log(match);\n// → [\"100\"]\n\nconsole.log(match.index);\n\
  // → 8\n```\n\n`exec` 返回的对象包含一个 `index` 属性，它决定了匹配项在字符串中开始起始位置。以下是所需的数字序列：\n\n`String`\
  \ 值包含一个行为相似的 `match` 方法。\n\n```javascript\nconsole.log(\"one two 100\".match(/\\\
  d+/));\n// → [\"100\"]\n```\n\n当正则表达式包含用括号括起的子表达式时，匹配的文本将显示在数组中。第一个是整个匹配项，下一个是第一个分组匹配的部分，然后是后续的分组，以此类推。\n\
  \n```javascript\nlet quotedText = /'([^']*)'/;\n\nconsole.log(quotedText.exec(\"\
  she said 'hello'\"));\n// → [\"'hello'\", \"hello\"]\n```\n\n当一个分组没有完成匹配时（如果它包含问号），它会输出\
  \ `undefined`。当你多次匹配一个分组时，只有最后一次匹配会留在数组中。\n\n```javascript\nconsole.log(/bad(ly)?/.exec(\"\
  bad\"));\n// → [\"bad\", undefined]\n\nconsole.log(/(\\d)+/.exec(\"123\"));\n//\
  \ → [\"123\", \"3\"]\n```\n\n### 日期类 (The Date classes)\n\nJavaScript 包含一个表示日期的标准类；称为\
  \ `Date`。如果你想利用 `new` 构建日期对象，请先获取当前的时间和。\n\n```javascript\nconsole.log(new Date());\n\
  // → Mon Nov 11 2018 16:19:11 GMT+0100 (CET)\n```\n\n你也可以为特定的时间构建对象。\n\n```javascript\n\
  console.log(new Date(2008, 11, 8));\n// → Wed Dec 08 2008 00:00:00 GMT+0100 (CET)\n\
  \nconsole.log(new Date(2008, 11, 9, 12, 59, 59, 999));\n// → Wed Dec 08 2009 12:59:59\
  \ GMT+0100 (CET)\n```\n\n你应当遵循 JavaScript 的日期命名规范，其中月份数字从 0 开始（因此 12 月是 `11`），日期数字从\
  \ 1 开始。\n\n小时、分钟、秒和毫秒秒参数是可选的，未指定时被视为零。时间戳保存为 UTC 时区的毫秒数。后续遵循由“Unix 时间”设定的约定。\n\n\
  ```javascript\nconsole.log(new Date(2016, 11, 14).getTime()); // 注意：原文此处为 getTimes\
  \ 应为 getTime\n// → 1445677600000\n\nconsole.log(new Date(1445677600000));\n// →Mon\
  \ Dec 11 2008 00:01:00 GMT+0100 (CET)\n```\n\n当 `Date` 构造函数被设置单个参数时，该参数被识别为毫秒数。通过构建一个新的\
  \ `Date` 对象并对其调用 `getTime` 或使用 `Date.now` 函数来确定当前的毫秒数。`Date` 对象产生如 `getDate`、`getHours`、`getFullYear`、`getMonth`、`getMinutes`\
  \ 和 `getSeconds` 等方法来获取它们的组件。\n\n```javascript\nfunction getDate(strings) {\n  let\
  \ [_, month, day, year] =\n  /(\\d{01,2})-(\\d{01,2})-(\\d{4})/.exec(strings);\n\
  \  return new Date(year, month - 1, day);\n}\n\nconsole.log(getDate(\"1-30-2003\"\
  ));\n// → Thursday Jan 30 2003 00:00:00 GMT+0100 (CET)\n```\n\n### 字符串与单词边界 (String\
  \ and Word boundaries)\n\n你可以通过添加标记 `^` 和 `$` 来确保匹配跨越整个字符串。脱字符 `^` 表示字符串开头，而美元符号\
  \ `$` 表示结束。使用 `^` 和 `$` 来锚定你的搜索。\n\n### 选择模式 (Choice patterns)\n\n你可以使用管道符 `|` 来匹配多个表达式中的一个。\n\
  \n```javascript\nlet regex = /cat|dog/;\nconsole.log(regex.test(\"cat\")); // true\n\
  console.log(regex.test(\"dog\")); // true\n```\n\n\n\n\n重复运算符（`+`、`*` 和 `{}`）是贪婪的，这意味着它们会尽可能多地匹配，也可以回溯。如果在它们后面放置一个问号（`+?`,\
  \ `*?`, `??`, `{}?`），贪婪性就会消失，并无论多小都开始匹配。能够带来 `*/` 的最小字符范围是星号匹配。它只吸收一个块状注释。\n\n```javascript\n\
  function stripComments(code) {\n  return code.replace(/\\/\\/.*|\\/\\*[^]*?\\*\\\
  //g, \"\");\n}\n\nconsole.log(stripComments(\"1 /* a */+/* b */ 1\"));\n// → 1 +\
  \ 1\n```\n\n动态创建 RegExp 对象\n\n在编写代码时，会有少数情况你无法确定应该匹配的特定模式。如果你想在一段文本中搜索用户名，并用下划线将其括起来以保持唯一性，你可以创建一个字符串并利用\
  \ `RegExp` 构造函数。下面是一个示例：\n\n```javascript\nlet name = \"harry\";\nlet text = \"\
  Harry is a suspicious character.\";\nlet regexp = new RegExp(\"\\\\b(\" + name +\
  \ \")\\\\b\", \"gi\");\nconsole.log(text.replace(regexp, \"_$1_\"));\n// → _Harry_\
  \ is a suspicious character.\n```\n\n如果你想构建 `\\b` 边界标记符，请使用双反斜杠，因为你会在普通字符串中编写它们。`RegExp`\
  \ 构造函数的第二个参数由正则表达式所需的选项组成。\"\"gi\"` 代表全局（global）和不区分大小写（case insensitive）。下面是一个示例：\n\
  \n```javascript\nlet name = \"dea+hl[]rd\";\nlet text = \"This dea+hl[]rd guy is\
  \ super annoying.\";\nlet escaped = name.replace(/[\\\\[.+*?(){|^$]/g, \"\\\\$&\"\
  );\nlet regexp = new RegExp(\"\\\\b\" + escaped + \"\\\\b\", \"gi\");\nconsole.log(text.replace(regexp,\
  \ \"_$&_\"));\n// → This _dea+hl[]rd_ guy is very annoying.\n```\n\nsearch 方法\n\n\
  你不能在正则表达式上调用 `indexOf` 方法。你也可以使用另一个方法 `search`，你可以在其中对正则表达式调用 `search`，它会返回看到该表达式的第一个索引，如果没有看到则返回\
  \ -1。\n\n```javascript\nconsole.log(\" word\".search(/\\S/));\n// → 2\n\nconsole.log(\"\
  \ \".search(/\\S/));\n// → -1\n```\n\nlastIndex 属性\n\n`exec` 方法并没有提供一种更好的从字符串中指定位置开始搜索的方法。正则表达式对象包含属性。其中一个属性叫做\
  \ `source`，它由构建表达式的字符串组成。`lastIndex` 是另一个属性，它影响下一次匹配开始的一些细微情况。正则表达式必须包含全局（`g`）或粘性（`y`）选项，并且匹配将使用\
  \ `exec` 方法进行。如下所示：\n\n```javascript\nlet pattern = /y/g;\npattern.lastIndex = 3;\n\
  let match = pattern.exec(\"xyzzy\");\nconsole.log(match.index);\n// → 4\n\nconsole.log(pattern.lastIndex);\n\
  // → 5\n```\n\n全局（global）和粘性（sticky）选项之间的区别在于，当你启用粘性时，如果匹配从 `lastIndex` 开始则匹配成功；而使用全局模式，它会找到一个可以开始匹配的位置。\n\
  \n```javascript\nlet global = /ABC/g;\nconsole.log(global.exec(\"XYZ ABC\"));\n\
  // → [\"ABC\"]\n\nlet sticky = /ABC/y;\nconsole.log(sticky.exec(\"XYZ ABC\"));\n\
  // → null\n```\n\n如果你在多个 `exec` 调用中使用共享的正则表达式值，那么 `lastIndex` 属性的自动更新将会出现问题。\n\n\
  ```javascript\nlet digit = /\\d/g;\nconsole.log(digit.exec(\"it is here : 1\"));\n\
  // → [\"1\"]\n\nconsole.log(digit.exec(\"and now: 1\"));\n// → null\n```\n\n全局选项也改变了字符串\
  \ `match` 方法的工作方式。\n\n遍历匹配\n\n最好的做法是扫描字符串中模式的所有匹配项，并在循环体中访问匹配对象。使用 `lastIndex` 和\
  \ `exec` 来实现这一点。\n\n```javascript\nlet input = \"A string with three numbers in\
  \ it... 42 and 88.\";\nlet number = /\\b\\d+\\b/g;\nlet match;\n\nwhile (match =\
  \ number.exec(input)) {\n  console.log(\"Found\", match[0], \"at\", match.index);\n\
  }\n// → Found 3 at 14\n// Found 42 at 33\n// Found 88 at 40\n```\n\n赋值表达式的值（`=`）是指定的值。因此，在\
  \ `while` 语句中使用 `match = number.exec(input)` 作为条件，`match` 是我们在每次迭代开始时执行匹配，将结果存储在绑定中，并在无法再找到匹配时停止循环。\n\
  \n解析 INI 文件\n\n```ini\nsearchengine=https://duckduckgo.com/?q=$1\nspitefulness=9.7\n\
  ; 注释前面分号\n; 每个节涉及一个特定的敌人\n[larry]\nfullname=Larry Doe\ntype=kindergarten bully\n\
  website=http://www.google.com/google/\n[davaeorn]\nfullname=Davaeorn\ntype=evil\
  \ witch\noutputdir=/home/margin/enemy/davaeorn\n```\n\n这种格式（一种通用的格式，通常被称为 INI 文件）的规则是：\n\
  \n- 忽略空行和以分号开头的行。\n- `[` 和 `]` 包围的行开始一个新节。\n- 由字母数字标识符带有 `=` 字符组成的行将设置附加到当前节。\n\
  - 其他所有内容均无效。\n\n```javascript\nfunction parseINI(string) {\n  let result = {};\n\
  \  let section = result;\n  string.split(/\\r?\\n/).forEach(line => {\n    let match;\n\
  \    if (match = line.match(/^(\\w+)=(.*)$/)) {\n      section[match[1]] = match[2];\n\
  \    } else if (match = line.match(/^\\[(.*)\\]$/)) {\n      section = result[match[1]]\
  \ = {};\n    } else if (!^\\s*(;)?$/.test(line)) {\n      throw new Error(\"Line\
  \ '\" + line + \"' Invalid.\");\n    }\n  });\n  return result;\n}\n\nconsole.log(parseINI(`\n\
  name=Vasilis\n[address]\ncity=Tessaloniki`));\n// → {name: \"Vasilis\", address:\
  \ {city: \"Tessaloniki\"}}\n```\n\n代码遍历文件行并创建一个对象。顶部的属性直接保存在该对象中，而节中的属性保存在不同的对象中。`section`\
  \ 绑定指向当前节的对象。有两种重要的行类型——节头或属性行。如果行总是属性，则保存在现有节中。如果它是节头，则创建一个新的节对象并将 section 指向它。利用赋值作为\
  \ `while` 循环条件的技巧是相同的。\n\n国际字符\n\n由于 JavaScript 最初的简单实现以及这种方法被固定为标准行为，JavaScript\
  \ 的正则表达式对于英语语言之外的字符相当笨拙。例如，在 JavaScript 中，“单词字符”只是拉丁字母中的 26 个字符（小写或大写）、十进制以及下划线字符。像\
  \ `é` 或 `ß` 这样的字符是单词字符，它们不会匹配 `\\w`，但匹配大写的 `\\W` 非单词类别。这表明由两个代码单元组成的字符。\n\n```javascript\n\
  console.log(/\U0001F34E{3}/.test(\"\U0001F34E\U0001F34E\U0001F34E\"));\n// → false\n\
  \nconsole.log(/<.>/.test(\"<\U0001F339>\"));\n// → false\n\nconsole.log(/<.>/u.test(\"\
  <\U0001F339>\"));\n// → true\n```\n\n这里的问题在于第一行中的 `\U0001F34E` 被视为两个代码单元，而 `{3}`\
  \ 部分仅用于第二个一个。点号也匹配单个代码单元。为你的正则表达式添加 `u` 选项（用于 Unicode），以便它能正确处理这些字符。遗憾的是，错误的行为仍然被设置为默认值，因为转换这可能会为依赖于它的当前代码产生问题。\n\
  \n你可以在正则表达式中使用 `\\p` 来匹配 Unicode 标准赋予任何属性的每个字符。\n\n```javascript\nconsole.log(/\\\
  p{Script=Greek}/u.test(\"α\"));\n// → true\n```\n\n\n\n\n\n```javascript\nconsole.log(/\\\
  p{Script=Arabic}/u.test(\"α\"));\n// → false\n\nconsole.log(/\\p{Alphabetic}/u.test(\"\
  α\"));\n// → true\n\nconsole.log(/\\p{Alphabetic}/u.test(\"!\"));\n// → false\n\
  ```\n\nUnicode 描述了许多重要的属性，尽管寻找你需要的属性并不总是易事的。\n\n## 总结\n\n在本章中，我们关注了正则表达式。代表字符串中模式的对象就是正则表达式。它们由语言组成，并利用该语言来展示这些模式。\n\
  \n- `/ABC/`: 字符的连续\n- `/[abc]/`: 字符范围内的某个字符\n- `/[^abc]/`: 不在字符范围内的任何字符\n- `/ [0-9]/`:\
  \ 字符集合中的任何字符\n- `/x+/`: 模式 `x` 的一次或多次匹配\n- `/x+? /`: 一次或多次匹配，非贪婪模式\n- `/x*/`: 零或多次匹配\n\
  - `/x?`: 零或一次匹配\n- `/x {2,4}/`: 二到四次匹配\n- `/(ABC)/`: 一个分组\n- `/a|b|c/`: 各种模式中的任意一个\n\
  - `/\\d/`: 任意数字字符\n- `/\\w/`: 任意单词字符\n- `/\\s/`: 任意空白字符\n- `.`: 除换行符外的任何字符\n- `/\\\
  b/`: 单词边界\n- `/^/`: 输入开始\n- `/$/`: 输入结束\n\n正则表达式包含一个 `test` 方法，用于检查字符串集是否匹配它。它还包含一个\
  \ `exec` 方法，当它找到匹配项时，会返回一个包含每个匹配组的数组。这种数组包含一个 `index` 属性，指定了匹配开始的位置。字符串使用匹配方法来与正则表达式进行匹配，并使用搜索方法来查找，后者仅返回匹配的起始位置。\n\
  \n### 练习题\n\n编写一个利用正则表达式实现 `trim` 函数（字符串）的 JavaScript 程序。\n\n### 结答案\n\n![](img/00146.jpg)![](img/00156.jpg)\n\
  \n# 第 11 章：模块\n\n这个程序的布局非常简单。解释它的概念非常容易，每个部分都起着精确的作用。布局的组织和维护可能会花费更多工作，但最终在未来有人使用该程序时会有回报。因此，你可能会好奇忽视它并让程序部分相互混合，这将产生两个实际问题。首先，当所有部分都相互接触时，很难单独查看任何一组代码。你必须对整个程序有一个全面的理解。其次，在不同情况下使用程序的任何功能时，你可以重写它，而不是将其从环境中解耦。\n\
  \n## 模块\n\n`Module` 是一种程序类型，它决定了应该依赖哪些部分以及应该为其他部分产生哪些功能。通过限制模块之间通信的方式，系统变得像 LEGO\
  \ 一样，部分使用简单的连接器进行通信，而不是像泥巴那样所有部分混合在一起。依赖是模块之间的关系。当一个模块想要另一个模块的某个部分时，它就依赖该模块。模块本身说明了这一事实，并用于确定哪些其他模块可以供指定的模块使用以及自动加载依赖项。每个模块都需要它的\
  \ `scope`（作用域）与其他模块隔离开。\n\n## 包\n\n由不同部分构建程序并能够单独启动这些部分的一个显著优点是，你可以将同一个部分应用到不同的程序中。当代码开始重复时，包派上了用场。包是一个可以共享的代码块。它可能由一个或多个模块组成，并持有有关其他依赖包的信息。包还包含描述其功能的文档，以便没有编写它的人可以使用它。当包中出现问题或你添加新功能时，包会自动更新。现在程序依赖于其升级到最新版本。像这样工作，你需要基础架构。一个存储和搜索包的地方，以及一种升级和安装它们的简单方法。在\
  \ JavaScript 中，`NPM` 提供了支持。\n\n将 `NPM` 分为两个部分：一个可以上传和下载包的在线服务，以及一个处理安装和管理的程序。`NPM`\
  \ 上的几乎所有代码都经过许可。\n\n## 仿制模块\n\n在 2015 年之前，JavaScript 语言并不包含任何内置的模块系统，但人们使用 JavaScript\
  \ 创建大型系统已经十多年了，而且他们需要模块。他们开发了自己的模块系统并将其集成到语言中。你可以利用 JavaScript 函数来构建局部作用域和代表模块布局的对象。使用这个模块在星期名称和数字之间转换。它的布局包含\
  \ `weekDay.Name` 和 `weekDay.number.`，并将它的本地绑定名称隐藏在函数作用域内部。\n\n该表达式被立即调用。\n\n```javascript\n\
  const weekDay = function() {\n  const names = [\"Sunday\", \"Monday\", \"Tuesday\"\
  , \"Wednesday\",\n  \"Thursday\", \"Friday\", \"Saturday\"];\n  return {\n    name(number)\
  \ {return names[number];},\n    number(name) {return names.indexOf(name);}\n  };\n\
  }();\n```\n\n```javascript\nconsole.log(weekDay.name(weekDay.number(\"Sunday\")));\n\
  // → Sunday\n```\n\n这种风格的模块不声明依赖。它们将布局放入全局作用域。这种风格的模块在某种程度上提供了隔离，但它没有声明依赖。相反，它只是将其接口放入全局作用域。这种风格的模块提供某种程度的隔离，但并没有声明依赖。\n\
  \n### 执行代码\n\n有不同的方法获取数据并作为程序执行。最好的方法是使用 `eval` 运算符，它影响现有作用域。\n\n```javascript\n\
  const x = 1;\nfunction evalReturnX(code) {\n  eval(code);\n  return x;\n}\nconsole.log(evalReturnX(\"\
  var x = 2\"));\n// → 2\nconsole.log(x);\n// → 1\n```\n\n另一种不复杂的方法是使用 `Function`\
  \ 构造函数。它接受两种类型的参数：用逗号分隔的参数列表和函数体字符串。它允许获取自己的作用域。\n\n```javascript\nlet plusOne =\
  \ Function(\"n\", \"return n + 1;\");\nconsole.log(plusOne(4));\n// → 5\n```\n\n\
  你可以将模块的代码封装在函数中并利用相同的函数作用域。\n\n### CommonJS\n\n用于 JavaScript 模块的常用方法是 CommonJS。Node.js\
  \ 使用这种方法以及 NPM 上的许多包。CommonJS 模块的主要思想是 `require` 函数。如果你结合依赖模块名称调用它，它会加载模块并返回其接口。加载器将模块代码封装在函数内部，模块拥有局部作用域。你可以调用\
  \ `require` 查看它们的依赖并将布局放在输出的对象中。这个示例模块提供了一个日期格式化函数。它利用 NPM 的两个包：`ordinal` 将数字转换为\
  \ \"1st\" 和 \"2nd\" 等字符串，`date-names` 获取月份和工作日的英文名称。它导出一个单一函数 `formatDate`，接收一个模板字符串和一个\
  \ Date 对象。模板字符串可以包含控制格式的代码，例如 `YYYY`（全年份）和用于序数日的 `Do`。你可以设置字符串为 \"MMMM Do YYYY\"\
  以获得“December 2nd, 2013”的输出。\n\n```javascript\nconst ordinal = require(\"ordinal\"\
  );\nconst {days, months} = require(\"date-names\");\n\nexports.formatDate = function(date,\
  \ format) {\n  return format.replace(/YYYY|M(MMM)?|Do?|dddd/g, tag => {\n    if\
  \ (tag == \"YYYY\") return date.getFullYear();\n    if (tag == \"M\") return date.getMonth();\n\
  \    if (tag == \"MMMM\") return months[date.getMonth()];\n    if (tag == \"D\"\
  ) return date.getDate();\n    if (tag == \"Do\") return ordinal(date.getDate());\n\
  \    if (tag == \"dddd\") return days[date.getDay()];\n  });\n};\n```\n\n\n\n\n\n\
  `ordinal` 包的布局是一个单函数，其中 `date-names` 导出一个包含其他其他内容的对象，月份和日期是名称的数组。在为导入的布局构建绑定时，重构非常简单。该模块将它的布局函数挂载到导出上，以便依赖它的模块可以访问它。按如下方式使用该模块：\n\
  \n```javascript\nconst {formatDate} = require(\"./format-date\");\n\nconsole.log(formatDate(new\
  \ Date(2017, 9, 13), \"dddd the Do\"));\n// → Friday the 13th\n```\n\n我们可以像下面这样以最小的形式定义\
  \ `require`：\n\n```javascript\nrequire.cache = Object.create(null);\n\nfunction\
  \ require(name) {\n  if (!(name in require.cache)) {\n    let code = readFile(name);\n\
  \    let module = {exports: {}};\n    require.cache[name] = module;\n    let wrapper\
  \ = Function(\"require, exports, module\", code);\n    wrapper(require, module.exports,\
  \ module);\n  }\n  return require.cache[name].exports;\n}\n```\n\n在这段代码中，`readFile`\
  \ 是一个强大的函数，它可以读取文件并将其内容作为字符串返回。标准 JavaScript 没有提供这种功能，但其他 JavaScript 环境（如 Node.js\
  \ 和浏览器）提供了访问文件的独特方式。上面的示例伪装了 `readFile` 的存在。为了避免重复加载同一个模块，你需要一个已加载模块的存储器（缓存）。当被调用时，它会检查请求的模块是否已加载，如果没有，则加载它。它需要读取模块的代码，将其封装在一个函数中并调用它。早先\
  \ `ordinal` 包的布局是一个函数而不是对象。CommonJS 模块使用模块系统为你创建一个空的布局对象供你导出，通过重写 `module.exports`\
  \ 用值来恢复它。模块这样做是为了导出单个值而不是布局对象。通过将 `exports`、`require` 和 `module` 描述为创建的闭包函数的参数（并在调用它时设置正确的值），加载器确保了这些绑定在模块的作用域内是可用的。设置给\
  \ `require` 的字符串在不同的系统中会被解释为文件名或网络地址。当它以 `./` 或 `/` 开头时，通常被翻译为相对于现有模块的文件名。因此，`./format-date`\
  \ 将是相同目录下的名为 `format-date.js` 文件。\n\n如果名称不是相对路径，Node.js 将搜索以该名称安装的包。\n\n现在，与其编写自己的\
  \ INI 文件解析器，你可以利用 NPM 中的一个。\n\n```javascript\nconst {parse} = require(\"ini\");\n\
  \nconsole.log(parse(\"x = 10\\ny = 20\"));\n// → {x: \"10\", y: \"20\"}\n```\n\n\
  ## ECMAScript modules\n\nCommonJS 模块在与 NPM 结合表现良好，它们让 JavaScript 社区能够大规模地共享代码。这种表示法非常奇怪。添加到\
  \ `exports` 中的内容在本地作用域内是不可访问的。在运行模块代码之前，在采取任何参数之前确定其依赖关系是非常困难的。这就是 JavaScript 标准建立它自己的、独立的模块系统的原因。它被称为\
  \ ES 模块，其中 ES 代表 ECMAScript。依赖和接口的初始想法保持不变，但细节不同。这种表示法集成到了语言中。你现在可以使用唯一的 `import`\
  \ 关键字来访问依赖项，而不是调用函数。\n\n```javascript\nimport ordinal from \"ordinal\";\n\nimport\
  \ {days, months} from \"date-names\";\n\nexport function formatDate(date, format)\
  \ { /* ... */ }\n```\n\n使用 `export` 关键字导出内容。它可以显示在类、函数或绑定定义（`let`、`const` 或 `var`）的前。ES\
  \ 模块的布局表示的单个值，而是一组命名绑定。之前的模块将 `formatDate` 挂载到函数上。如果你从不同的模块导入，绑定将随之而来，而不是值，这意味着导出模块的值可以随时更改绑定，而导入模块将识别它的新值。如果绑定被命名为\
  \ `default`，则将其识别为模块的主要导出值。如果像示例中的 `ordinal` 这样的模块导入时，在绑定名称两端省略大括号，你将找到它的默认绑定。要开发默认导出，在表达式、类或函数声明之前编写\
  \ `export default`。\n\n```javascript\nexport default [\"Winter\", \"Spring\", \"\
  Summer\", \"Autumn\"];\n```\n\n你可以使用像这样的单词来重命名导入的绑定。\n\n```javascript\nimport {days\
  \ as dayNames} from \"date-names\";\n\nconsole.log(dayNames.length);\n// → 7\n```\n\
  \n另一个主要区别是 ES 模块的导入发生在模块脚本开始运行之前。导入声明可能显示在函数或块内部，且依赖名称应该是引号字符串而不是任意表达式。许多项目是通过 ES\
  \ 模块编写的，然后在发布时更改为其他格式。在过渡期间，并排使用两个独立的模块系统。\n\n## 模块设计\n\n程序结构化是编程的优秀特性之一。任何未知的功能都可以以不同的方式进行建模。良好的程序设计是个个性化的，这涉及到偏好和品味的问题。要理解良好设计的价值，你需要阅读并处理几个程序，并注意执行型和非执行型函数。模块设计简单易于使用。`ini`\
  \ 包模块遵循标准的 JSON 对象，提供了 `stringify` 和 `parse`（用于写入 INI 文件）函数，并像 JSON 一样，在普通对象和字符串之间转换。NPM\
  \ 上的 INI 文件读取模块提供了一个从磁盘读取文件并进行解析的函数。计算值的集中模块比执行复杂操作的模块适用于更大的范围。状态对象有时是必要且有用的，但如果你可以使用函数，请使用它。从磁盘读取文件的读取器在文件内容来自其他来源的情况下是不实用的。它一种样式需要构建对象，然后将文件加载到对象中并使用特定方法获取结果。在\
  \ JavaScript 中，没有特定的方法表示图。NPM 上有很多路径查找包，但没有使用图格式。它们通常允许图边包含权重，那是与之相关的距离或成本。例如，我们有\
  \ `dijkstrajs` 包。路径查找的一种已知方法相关的 `findRoute` 函数是 Dijkstra 算法，该后缀经常附加到包名上以指定你可以用 JavaScript\
  \ 写。所以，如果你想使用该包，请确保图以预期的格式保存。\n\n```javascript\nconst {find_path} = require(\"dijkstrajs\"\
  );\n\nlet graph = {};\n\nfor (let node of Object.keys(roadGraph)) {\n  let edges\
  \ = graph[node] = {};\n  for (let dest of roadGraph[node]) {\n    edges[dest] =\
  \ 1;\n  }\n}\n\nconsole.log(find_path(graph, \"Post Office\", \"Cabin\"));\n// →\
  \ [\"Post Office\", \"Alice's House\", \"Cabin\"]\n```\n\n当多个包使用单独的数据结构来定义相关内容时，组合可能会遇到障碍，并且很难合并它们。因此，当你为了组合性进行设计时，确切知道别人正在使用什么数据结构，你可以遵循他们的示例。\n\
  \n## 总结\n\n在本章中，我们涵盖了模块。模块通过将代码划分为具有可理解依赖关系和接口的部分，为更大的程序提供了结构。接口是你从其他模块看到的模块，而依赖项是它使用的不同模块。\n\
  \n## 练习\n\n编写一个 JavaScript 程序，以以下格式显示当前的日期和时间。\n\n今天是周二。\n\n当前时间是：晚上 10:30:38\n\n\
  解决方案\n\n\n\n\n\n\n# 第 12 章：异步编程\n\n处理器是计算机中至关重要的部分，负责执行平衡我们程序的各个步骤。像循环这种影响数字完成情况的速度，取决于处理器的速度。许多程序与处理器外部的实体进行通信。例如，它们可能通过计算机网络进行交互，或者要求从硬盘读取数据，而从硬盘获取数据比从内存获取慢得多。在某种程度上，操作系统处理这部分，并在运行的各种程序之间切换处理器。\n\
  \n## 异步性\n\n在异步编程模型中，一切都是一个接一个地发生的。如果你调用了一个执行耗时操作的函数，结果只有在操作完成后才会返回。在执行期间，其他操作将无法进行。异步模型允许几件事同时发生。当一个操作开始时，程序不会停止运行。当任务完成时，它会通知程序并允许访问结果（例如，从磁盘读取的信息）。你可以通过一个简单的示例来区分同步编程和异步编程：一个从网络获取两个资源然后合并结果的程序。\n\
  \n在异步环境中，请求函数在工作完成时返回。执行此任务最简单的方法是一个接一个调用请求。它的缺点是，只有在第一个任务完成后才会开始第二个请求。两个响应时间的总和将是总耗时。要在同步系统中解决这个问题，可以开始添加控制线程。线程是一个运行中的程序，它的执行可以通过操作系统与其他程序共同渲染，因为现代计算机拥有多个处理器，各种线程可以同时在不同的处理器上运行。第二个线程可以开始第二个请求，然后两个线程都等待它们的结果返回，之后，它们会重新同步以合并两个结果。在异步模型中，网络时间是指定控制线程时间线的一部分。在异步模型中，启动一个网络操作在逻辑上会在时间线上创建一个划分。启动操作的程序不会停止运行，然后操作会随之发生，并在操作完成时通知程序。\n\
  \n另一种确定相似性的方法是：在同步模型中，等待任务完成是间接的，而在异步模型中，它是直接受我们控制的。\n\n## 回调函数\n\n异步编程的一种方法是允许执行慢速操作的函数获得一个额外的参数，该参数被称为回调函数。当操作开始和结束时，你应该通过回调函数调用结果。例如，`setTimeout`\
  \ 函数（在浏览器和 Node.js 中均可访问），它会等待指定的毫秒数然后调用一个函数。`setTimeout(() => console.log(\"Tick\"\
  ), 500);` 等待并不是理想的工作类型，但当你运行像动画更新或检查函数执行时间是否超过指定时间之类的程序时，它是适用的。通过回调连续运行多个异步任务意味着你必须继续设置新函数，以控制操作后计算的延续。\n\
  \n许多乌鸦巢计算机由一个长期的存储存储球组成，数据被存储在树枝上，以便以后访问和恢复。存储或搜索某条数据花费的时间很少，因此，长久存储的布局是异步的，并利用了回调函数。存储球在名称下保存可以\
  \ JSON 编码的数据位。乌鸦可以在“food caches”（食物储藏）名称下保存关于它隐藏食物地点的数据，该名称包含一个指向其他数据片段的名称数组，定义了缓存。要在大橡树巢的存储球中搜索食物缓存，乌鸦可以按如下方式运行代码：\n\
  \n```javascript\nimport {bigOak} from \"./crow-tech\";\n\nbigOak.readStorage(\"\
  food caches\", caches => {\n  let firstCache = caches[0];\n  bigOak.readStorage(firstCache,\
  \ info => {\n    console.log(info);\n  });\n});\n```\n\n这种编程风格是可行的，但缩进级别会随着每个异步操作而扩大，因为它会导致另一个函数。执行某些困难任务（如并发运行多个操作）可能会变得很奇怪。乌鸦巢的设计是通过请求-响应对进行交互的。这意味着一个巢向另一个巢发送消息，另一个巢立即返回消息，确认接收并将回复附在消息问题上。每条消息都有一个类型标记，这决定了它如何被控制。你的代码可以为某些请求类型描述处理器，当请求进来时，就会调用处理器来提供回复。由\
  \ `./crow-tech` 模块导出的布局产生了基于回调的交互函数。巢包含一个 `send` 方法，用于发送请求。它将请求类型、目标巢名称和请求内容作为前三个参数，并期望在回复返回时调用一个函数作为第四个也是最后一个参数。\n\
  \n```javascript\nbigOak.send(\"Cow Pasture\", \"note\", \"Let's caw loudly at 7PM\"\
  ,\n() => console.log(\"Note delivered.\"));\n```\n\n但为了确保巢可以接收该请求，你必须指定一个名为 \"note\"\
  \ 的请求类型。控制需要运行的请求以及在所有巢中都能接收这种类型消息的代码。让我们假设一只乌鸦飞过并在所有巢上安装了我们的处理器代码。\n\n```javascript\n\
  import {defineRequestType} from \"./crow-tech\";\n\ndefineRequestType(\"note\",\
  \ (nest, content, source, done) => {\n  console.log(`${nest.name} received note:\
  \ ${content}`);\n  done();\n});\n```\n\n`defineRequestType` 函数描述了一种新类型的请求。示例附加了对\
  \ \"note\" 请求的支持，向指定的巢发送便条。我们的实现调用了 `console.log`，以便我们可以检查请求是否到达。巢包含一个 `name` 属性，存储其名称。传递给处理器的第四个参数\
  \ `done` 是在任务完成时调用的回调函数。\n\n## Promise\n\n当值代表方法时，处理抽象方法会更简单。在异步操作的情况下，与其为未来的某个时刻调用函数做准备，不如返回一个代表未来事件的对象。Promise\
  \ 是可以在某个点完成并提供值的异步操作。构建 Promise 最简单的方法是调用 `Promise.resolve`。\n\n```javascript\n\
  let fifteen = Promise.resolve(15);\n\nfifteen.then(value => console.log(`Got ${value}`));\n\
  // → Got 15\n```\n\n\n\n\n要获取 promise 的结果，请使用它的 `then` 方法。它指示了一个在 promise 解析并提供值时要调用的回调函数。你可以为单个\
  \ promise 附加多个回调函数，它们会调用这些回调，即使它们是在 promise 完成后才附加的。`then` 方法还会返回另一个 promise，该 promise\
  \ 将解析处理函数所返回的值。将 promise 视为一种将值转换为异步现实的设备是非常重要的。承诺值是一个在未来某个时间点可能存在、也可能在那个时刻显示的值。以\
  \ promise 描述的计算在封装的值上运行，并在值可用时异步执行。要构建一个 promise，请使用 `Promise` 作为构造函数。它包含一个特殊的布局，构造函数期望一个函数作为参数，它会立即调用该函数，并传递一个用于解析\
  \ promise 的函数。以下是为 `readStorage` 函数构建基于 promise 的布局：\n\n```javascript\nfunction\
  \ storage(nest, name) {\n  return new Promise(resolve => {\n    nest.readStorage(name,\
  \ result => resolve(result));\n  });\n}\n\nstorage(bigOak, \"enemies\")\n  .then(value\
  \ => console.log(\"Got\", value));\n```\n\n这个异步函数返回了一个重要的值。\n\n### 失败\n\nJavaScript\
  \ 计算可能会通过输出异常而失败。网络请求可能会失败，或者某些异步代码计算可能会产生异常。异步编程回调风格最常见的问题是，它很难确保失败能正确地揭示给回调。一种通用的方法是：回调的第一个参数用于指定失败的操作，第二个参数是操作完成时提供的值。此类回调函数总是检查它们是否获取了异常，并确保任何发生的问题（包括它们所调用的函数输出的异常）都传递给正确的函数。它们可以在成功完成时调用\
  \ `resolve`，在失败时调用 `reject`。`then` 的处理器仅在任务成功完成时被调用，并在失败时自动将返回的新 promise 设置为 `reject`。当处理器输出异常时，这会自动触发其最近调用所提供的\
  \ promise 被拒绝。当异步操作链中的某个元素失败时，整个链的输出都会被拒绝，并且没有成功处理器会调用失败点之后的代码。就像解析一个 promise 会产生一个值一样，拒绝一个\
  \ promise 也会提供一个值，通常被称为拒绝原因。如果处理器函数中的异常创建了拒绝，请使用异常值作为原因。相应地，当处理器返回一个被拒绝的 promise\
  \ 时，该拒绝将进入下一个 promise。有一个 `Promise.reject` 函数，可以创建一个新的、即时被拒绝的 promise。\n\n如果 `catch`\
  \ 处理器输出一个错误，新的 promise 同样会被拒绝。简而言之，`then` 也接受一个拒绝处理器作为第二个参数，因此你应该在单次方法调用中安装两种类型的处理器。发送到\
  \ `Promise` 构造函数的函数接受第二个参数，与 `resolve` 函数一起，它可以使用它来拒绝新的 promise。通过调用 `then` 和 `catch`\
  \ 开发的 promise 值链被视为一条流水线，异步值或失败在其中流水线中移动。由于这些链是通过注册处理器构建的，每个环节都由一个相关的成功处理器或拒绝处理器（或两者都有）组成。与输出拒绝类型不匹配的处理器不会被调用。但与之匹配的处理器会被调用，它们的输出决定了下一个什么类型的值：当返回非\
  \ promise 值时是成功值，当输出异常时是拒绝，当返回其中一个 promise 时，则是该 promise 的结果。\n\n```javascript\n\
  new Promise((_, reject) => reject(new Error(\"Fail\")))\n  .then(value => console.log(\"\
  Handler 1\"))\n  .catch(reason => {\n    console.log(\"Caught failure \" + reason);\n\
  \    return \"nothing\";\n  })\n  .then(value => console.log(\"Handler 2\", value));\n\
  // → Caught failure Error: Fail\n// → Handler 2 nothing\n```\n\n### 网络是困难的\n\n周期性地，乌鸦的镜像系统很少有光线来传达信号阻塞了信号的路径。信号被传输但被拒绝是可能的。通常，传输失败是意外之外的事故，例如汽车大灯遮挡了光信号，重新发送请求可能会使其成功。所以，让我们创建我们的请求函数，并在停止之前多次尝试重试请求。而且，既然我们已经确定了\
  \ promise 是好的，我们还将确保我们的请求函数返回一个 promise。至于它们能指示什么，promise 和回调是等等的。基于回调的函数被封装以揭示基于\
  \ promise 的布局，反之亦然。即使请求及其回复成功传达，回复也可能指定失败，例如，如果请求尝试使用一个未描述的请求类型，或者处理器输了错误。为了协助这一点，`send`\
  \ 和 `defineRequestType` 遵循之前声明的约定，发送到回调的第一个参数是失败的原因（如果有），第二个是确定的结果。我们的封装器将它们解释为\
  \ promise 的解析和拒绝。\n\n```javascript\nclass Timeout extends Error {}\n\nfunction request(nest,\
  \ target, type, content) {\n  return new Promise((resolve, reject) => {\n    let\
  \ done = false;\n    function attempt(n) {\n      nest.send(target, type, content,\
  \ (failed, value) => {\n        done = true;\n        if (failed) reject(failed);\n\
  \        else resolve(value);\n      });\n      setTimeout(() => {\n        if (done)\
  \ return;\n        else if (n < 3) attempt(n + 1);\n        else reject(new Timeout(\"\
  Timed out\"));\n      }, 250);\n    }\n    attempt(1);\n  });\n}\n```\n\n因为 promise\
  \ 只能被接受或拒绝一次，它将会工作。第一次调用 `resolve` 或 `reject` 决定了 promise 的结果，任何其他调用都会被忽略。为了创建一个重试的异步循环，请使用递归函数，高效的循环不允许我们停止并等待异步操作。`attempt`\
  \ 函数创建了一个传输请求的单一尝试。它还指定了一个超时，如果在 250 毫秒后有响应，则开始下一次尝试；如果是第四次尝试，则用 `Timeout` 实例作为原因拒绝\
  \ promise。每四分之一秒重试一次并在一秒后无响应时停止，如果请求出现的话这无疑是任意的，但处理器处理请求传输可能需要好倍的时间。请在考虑这个问题问题时创建你的处理器，耦合的消息是无害的。为了完全脱离回调，为\
  \ `defineRequestType` 定义一个封装，使处理器函数能够返回 promise 或简单值，并接线为我们处理回调。\n\n```javascript\n\
  function requestType(name, handler) {\n  defineRequestType(name, (nest, content,\
  \ source, callback) => {\n    try {\n      Promise.resolve(handler(nest, content,\
  \ source))\n        .then(response => callback(null, response),\n        failure\
  \ => callback(failure));\n    } catch (exception) {\n      callback(exception);\n\
  \    }\n  });\n}\n```\n\n`Promise.resolve` 用于将处理器返回的值转换为 promise（如果它还没有准备好的话）。\n\
  \n### Promise 集合\n\n每个嵌套计算机在它的邻居属性中存储了传输距离内的其他嵌套计算机的数组。为了检查哪些是可用的，写一个函数向它们尝试传输一个“ping”请求（要求响应的请求），并检查哪些返回了结果。如果你正在处理一组同时运行的\
  \ promise，`Promise.all` 函数非常重要。它返回一个 promise，等待数组中的所有 promise 都协调，然后稳定到这些 promise\
  \ 提供的值的数组。如果任何一个 promise 被拒绝，`Promise.all` 的结果也会被拒绝。\n\n```javascript\nrequestType(\"\
  ping\", () => \"pong\");\n\nfunction availableNeighbors(nest) {\n```\n\n\n\n\n```javascript\n\
  let requests = nest.neighbors.map(neighbor => {\n  return request(nest, neighbor,\
  \ \"ping\")\n    .then(() => true, () => false);\n});\n\nreturn Promise.all(requests).then(result\
  \ => {\n  return nest.neighbors.filter((_, i) => result[i]);\n});\n}\n```\n\n# 网络泛洪\n\
  \n巢节点只能与其邻居通信，这极大地影响了该网络的重要性。为了向整个网络广播信息，解决方案是创建一种自动发送给邻居的请求类型。这些邻居随后将其发送给它们的邻居，直到整个网络都收集到消息。\n\
  \n```javascript\nimport {everywhere} from \"./ /crow-tech\";\n\neverywhere(nest\
  \ => {\n  nest.state.gossip = [];\n});\n\nfunction sendGossip(nest, message, exceptFor\
  \ = null) {\n  nest.state.gossip.push(message);\n  for (let neighbor of nest.neighbors)\
  \ {\n    if (neighbor == exceptFor) continue;\n    request(nest, neighbor, \"gossip\"\
  , message);\n  }\n}\n\nrequestType(\"gossip\", (nest, message, source) => {\n  if\
  \ (nest.state.gossip.include(message)) return;\n  console.log(`${nest.name} receive\
  \ gossip '${messages}' from ${source}`);\n  sendGossip(nest, message, source);\n\
  });\n```\n\n你可以避免在网络中永远传输相似的消息，每个巢节点都保存一个它过的 gossip 字符串数组。为了描述这个数组，使用了 `everywhere`\
  \ 函数，它在每个巢节点上运行代码，为巢节点的 state 对象附加一个属性。\n\n# 消息路由\n\n如果一个节点想要与另一个单个节点通信。最好的方法是构建一条路径，让消息在节点之间跳转，直到到达目的地。你需要理解网络的接口。要向远处的巢节点发送请求，知道哪个邻居巢可以完成任务至关重要。每个巢节点只知道它的直接邻居，它无法计算路由，因为它缺乏信息。你必须理解如何将这些连接信息传播到每个巢节点，使其在创建新巢节点时随时间推移发生转换。现在你可以使用泛洪，但不再是检查消息是否被收集，而是检查给定巢节点的新邻居集合是否与当前集合相似。\n\
  \n```javascript\nrequestType(\"connections\", (nest, {name, neighbors}, source)\
  \ => {\n  let connections = nest.state.connections;\n  if (JSON.stringify(connections.get(name))\
  \ == JSON.stringify(neighbors)) return;\n  connections.set(name, neighbors);\n \
  \ broadcastConnections(nest, name, source);\n});\n\nfunction broadcastConnections(nest,\
  \ name, exceptFor = null) {\n  for (let neighbor of nest.neighbors) {\n    if (neighbor\
  \ == exceptFor) continue;\n    request(nest, neighbor, \"connections\", {\n    \
  \  name,\n      neighbors: nest.state.connections.get(name)\n    });\n  }\n}\n\n\
  everywhere(nest => {\n  nest.state.connections = new Map;\n  nest.state.connection.set(nest.name,\
  \ nest.neighbors);\n  broadcastConnections(nest, nest.names);\n});\n```\n\n比较利用\
  \ `JSON.stringify`，因为在对象或数组上使用 `==` 只有当两个值相同时才会返回 true。区分 JSON 字符串是比较它们内容的一种非常成功的方法。节点立即开始传输它们的连接，但无法到达的巢除外，这为它们提供了现有网络图的地图。`findRoute`\
  \ 函数找到在网络内到达目标节点的路径。但它并不返回整个路由，而是只返回下一步。下一个巢节点将使用它关于网络的现有信息，决定在处将消息传输到哪里。\n\n```javascript\n\
  function findRoute(from, to, connections) {\n  let work = [{at: from, via: null}];\n\
  \  for (let I = 0; I < work.length; i++) {\n    let {at, via} = work[i];\n    for\
  \ (let next of connections.get(at) || []) {\n      if (next == to) return via;\n\
  \      if (!work.some(w => w.at == next)) {\n        work.push({at: next, via: via\
  \ || next});\n      }\n    }\n  }\n  return null;\n}\n```\n\n现在你可以创建一个可以发送远距离消息的函数。如果消息附加在直接邻居上，它将像常一样传递。如果不是，它被封装在一个对象中并传输到更靠近目标的邻居，通过\
  \ \"route\" 请求类型，这将使该邻居重复相同的字符。\n\n```javascript\nfunction routeRequest(nest, target,\
  \ types, content) {\n  if (nest.neighbors.includes(target)) {\n    return request(nest,\
  \ target, types, content);\n  } else {\n    let via = findRoute(nest.name, target,\
  \ nest.state.connections);\n    if (!via) throw new Error(`No routes to ${target}`);\n\
  \    return request(nest, via, \"route\", {target, type, content});\n  }\n}\n\n\
  requestType(\"route\", (nest, {target, type, content}) => {\n  return routeRequest(nest,\
  \ target, type, content);\n});\n```\n\n我们在主通信系统的顶部创建了不同层的功能，以便于使用。这是计算机网络工作方式的简化模型。\n\
  \n# 异步函数\n\n为了保存大量信息，乌鸦使用重复方法，它们在跨巢节点进行复制。这种方式，当一个巢节点丢失信息时，通过等待其他巢节点来同步。异步函数是返回一个可以等待其他\
  \ promise 以同步方式定义的函数。\n\n```javascript\nrequestType(\"storage\", (nest, name) =>\
  \ storage(nest, name));\n\nasync function findInStorage(nest, name) {\n  let found\
  \ = await storage(nest, name);\n  if (found != null) return found;\n  else findRemoteStorage(nest,\
  \ name);\n}\n\nfunction network(nest) {\n  return Array.from(nest.state.connections.keys());\n\
  }\n\nfunction findRemoteStorage(nest, name) {\n  let sources = network(nest).filter(n\
  \ != nest.name);\n  function next() {\n    if (sources.length == 0) {\n      return\
  \ Promise.reject(new Error(\"Not found\"));\n    } else {\n      let source = sources[Math.random()\
  \ * sources.length)];\n      sources = sources.filter(n != source);\n      return\
  \ storage(nest, source)\n        .then(value => value != null ? value : next(),\
  \ next);\n    }\n  }\n  return next();\n}\n```\n\nObject.keys 无法作用于 connections，因为它是\
  \ `Map`。它包含 `keys` 方法，但返回的是迭代器而不是数组。迭代器可以使用 `Array.from` 函数转换为数组。各种异步操作以不透明的方式连接在一起。现在你需要一个递归函数来循环跨巢。在同步编程模型中，这很容易表达。JavaScript\
  \ 还允许你编写伪同步代码来定义异步计算。异步函数是返回一个可以同步方式等待其他 promise 的函数。重写 `findInStorage` 如下：\n\n\
  ```javascript\nasync function findInStorage(nest, name) {\n  let local = await storage(nest,\
  \ name);\n  if (local != null) return local;\n  let sources = network(nest).filter(n\
  \ != nest.name);\n  while (sources.length > 0) {\n    let source = sources[Math.floor(Math.random()\
  \ * sources.length)];\n    sources = sources.filter(n != source);\n    try {\n \
  \     let found = await routeRequest(nest, source, \"storage\", name);\n      if\
  \ (found != null) return found;\n    } catch (_) {}\n  }\n  throw new Error(\"Not\
  \ found\");\n}\n```\n\n# 生成器\n\n\n\n\n\n# 生成器 (Generators)\n\n异步函数不需要被暂停后再恢复。JavaScript\
  \ 包含一种名为“生成器函数”（generator functions）的功能。它们与异步函数相似但不包含承诺（promises）。当你使用 `function*`\
  \ 调用函数（在 `function` 单词后加上星号）时，它就变成了一个生成器。当你调用生成器时，它会返回一个迭代器（iterator）。\n\n```javascript\n\
  function* powers(n) {\n  for (let current = n;; current *= n) {\n    yield currently;\n\
  \  }\n}\n\nfor (let power of powers(3)) {\n  if (power > 50) break;\n  console.log(power);\n\
  }\n// → 3\n// → 9\n// → 27\n```\n\n通常情况下，如果你调用 `powers`，函数会在开始处被冻结。每当你在迭代器上调用一次\
  \ `next`，函数就会运行直到遇到 `yield` 表达式为止，这会暂停函数并将 `yield` 出的值作为迭代器提供的下一个值。当函数返回时，迭代器即完成。利用生成器函数时，编写迭代器非常简单。使用此生成器为\
  \ `Group` 类编写迭代器：\n\n```javascript\nGroup.prototype[Symbol.iterator] = function*()\
  \ {\n  for (let i = 0; i < this.members.length; I++) {\n    yield this.members[i];\n\
  \  }\n};\n```\n\n不需要构建一个对象来存储迭代状态，生成器会立即存储它们的局部状态并在每次运行时 `yield`。这个 `yield` 表达式只能直接发生在生成器函数内部，而不能发生在你在内部设置的内部函数中。生成器在\
  \ `yield` 时保存状态。这是它的局部环境以及它 `yield` 的位置。异步函数是一种特殊的生成器。它在被调用时会创建一个 `promise`，该承诺在完成时解析（resolve），在输出异常时被拒绝（decline）。任何时候它\
  \ `yield` 一个承诺，该承诺的结果将是 `await` 表达式的结果。\n\n## 事件循环 (The event loop)\n\n异步程序是按顺序执行的。每个部分可能会开始几个操作，并安排代码在操作完成或失败时执行。在这些部分之间，程序什么都不做，而是等待下一个操作。因此，你无法通过安排它们的代码来调用回调。如果你在函数内部调用\
  \ `setTimeout`，该函数在回调函数被调用之前就已经返回了。异步特性发生在其空的函数调用栈上。由于每个回调都始于一个空栈，因此当异常运行时，你的捕获处理程序（catch\
  \ handlers）不会在栈上。\n\n```javascript\ntry {\n  setTimeout(() => {\n    throw new Error(\"\
  Woosh\");\n  }, 20);\n} catch (_) {\n  // 这不会执行\n  console.log(\"Caught!\");\n}\n\
  ```\n\n无论像超时或入站请求这样的事件如何发生，JavaScript 环境一次只运行一个程序。当无事可做时，循环就会停止。但随着事件的到来，它们会被附加到队列中，它们的代码会一个接一个地执行。因为两个事情不会同时运行，运行较慢的代码可能会阻塞其他事件的处理。下面的示例设置了超时，但一直持续到超时的固定时间点之后，导致超时延迟。\n\
  \n```javascript\nlet start = Date.now();\nsetTimeout(() => {\n  console.log(\"Timeout\
  \ ran at\", Date.now() - start);\n}, 20);\n\nwhile (Date.now() < start + 50) {}\n\
  console.log(\"Wasted time until\", Date.now() - start);\n// → Wasted time until\
  \ 50\n// → Timeout ran at 55\n```\n\n承诺的解析或拒绝被视为一个新事件。即使一个承诺已经解析，等待它也会让你的回调在现有脚本完成后之后运行，而不是立即运行。\n\
  \n```javascript\nPromise.resolve(\"Done\").then(console.log);\nconsole.log(\"Me\
  \ first!\");\n// → Me first!\n// → Done\n```\n\n## 异步 Bug (Asynchronous bugs)\n\n\
  当你同步运行程序时，除了程序自身发生的转换外，没有其他给定的发生转换。但当你运行异步程序时，就是另一种情况。它们在执行期间可能包含其他代码可以利用的间隙。下面是一个说明。我们乌鸦最喜欢的活动之一是统计每年村庄里孵化的小鸟数量。鸟巢在它们的存储球泡中保存此计数。下面的代码尝试统计特定年份每个巢的计数：\n\
  \n```javascript\nfunction anyStorage(nest, source, name) {\n  if (source == nest.names)\
  \ return storage(nest, name);\n  else return routeRequest(nest, source, \"storage\"\
  , name);\n}\n\nasync function chicks(nest, year) {\n  let list = \"\";\n  await\
  \ Promise.all(network(nest).map(async name => {\n    list += `${name}: ${\n    \
  \  await anyStorage(nest, names, `chicks in ${year}`)\n    }\\n`;\n  }));\n  return\
  \ list;\n}\n```\n\n`async name =>` 显示了通过在它们前面放置 `async` 单词，箭头函数也可以变为异步的。代码跨越巢集合绘制异步箭头函数，构建了一个承诺数组，并利用\
  \ `Promise.all` 在返回它们创建的列表之前进行等待。但它是损坏的。它会返回单行输出，列出响应最慢的巢。你知道为什么吗？\n\n问题出在 `+=`\
  \ 运算符上，它在语句开始执行时获取 `list` 的当前值，并在等待结束时，将 `list` 绑定设置为该值加上添加的字符串。但在语句的开始和结束之间，存在一个异步间隙。`map`\
  \ 表达式是第一个运行的。\n\n```javascript\nasync function chicks(nest, year) {\n  let list\
  \ = \"\";\n  let lines = network(nest).map(async name => {\n    return name + \"\
  : \" +\n    await anyStorage(nest, names, `chicks in ${year}`);\n  });\n  return\
  \ (await Promise.all(lines)).join(\"\\n\");\n}\n```\n\n## 总结 (Summary)\n\n在本章中，我们学习了异步编程的一切。异步编程允许等待长时间运行的操作而不会给程序带来问题。JavaScript\
  \ 环境通常通过回调（在操作结束时调用的函数）使用这种编程风格。我们还讨论了事件循环。事件循环在正确的时间一个接地执行回调以避免冲突。\n\n练习\n\n编写一个\
  \ JavaScript 程序，让异步函数返回一个承诺。\n\n\n\n\n\nEgg 语言的一致性意味着 JavaScript 中的操作符（如 `>`）在该语言中被称为“绑定”（bindings），其使用方式与其他函数类似。此外，该语法不包含“块”的概念，因此需要一种结构来表示连续执行多个操作。解析器利用数据布局来定义一个包含表达式对象的程序。每个对象都包含一个\
  \ `type` 属性，表示该表达式的类型，以及其他几个用于确定其内容的属性。类型为 `\"value\"` 的表达式表示字符串或数字。它们的 `value`\
  \ 属性由它们所代表的字符串或数字组成。类型为 `\"word\"` 的表达式用于标识符（名称）。这些类型的对象包含一个 `name` 属性，以字符串形式持有标识符的标题。然后`\"\
  apply\"` 表达式表示应用（applications）。它们包含一个 `operator` 属性用于引用被调用的表达式，以及一个 `args` 属性，其包含一个参数表达式数组。\n\
  \n新程序中的 `>(x, 5)` 部分如下：\n\n```json\n{\n  type: \"apply\",\n  operator: {type: \"\
  word\", name: \">\"},\n  args: [\n    {type: \"word\", name: \"x\"},\n    {type:\
  \ \"value\", value: 5}\n  ]\n}\n```\n\n我们描述了一个函数 `parseExpression`，它识别字符串作为输入并返回一个对象，该对象由字符串开头表达式的数据布局以及解析该表达式后剩余的字符串部分组成。当你解析子表达式时，可以再次调用此函数，并将剩余文本作为参数表达式传递给它。这段文本可能包含更多参数，或者是结束参数列表的右括号。\n\
  \n以下是解析器的第一部分：\n\n```javascript\nfunction parseExpression(program) {\n  program\
  \ = skipSpace(program);\n  let match, expr;\n  if (match = /^\"([^\"]*)\"/.exec(program))\
  \ {\n    expr = {type: \"value\", value: match[1]};\n  } else if (match = /^\\d+\\\
  b/.exec(program)) {\n    expr = {type: \"value\", value: Number(match[0])};\n  }\
