  \ 函数被调用以计算立方体的体积。\n\n### 构造函数\n\n构造函数是类的一种特殊的成员函数，每当我们创建类的对象时就会运行。构造函数假设与类相同，且不应该返回类型。以下示例演示了如何在\
  \ `C#` 中使用构造函数：\n\n```csharp\nusing System;\nnamespace ConstructorApplication {\n\
  \  class Person {\n    private double height; // 人的高度\n    public Person() {\n \
  \     Console.WriteLine(\"We are creating an object\");\n    }\n    public void\
  \ setHeight( double heig ) {\n      height = heig;\n    }\n    public double getHeight()\
  \ {\n      return height;\n    }\n    static void Main(string[] args) {\n      Person\
  \ p = new Person();\n      // 设置高度\n      p.setHeight(7.0);\n      Console.WriteLine(\"\
  The height of the person is: {0}\", p.getHeight());\n      Console.ReadKey();\n\
  \    }\n  }\n}\n```\n\n代码返回：\n(Images/0174.jpg)\n\n默认构造函数没有参数，但可以在构造函数中添加参数。这种构造函数被称为参数构造函数。通过这种技术，人们可以在创建对象时为对象分配初始值。这里有一个示例：\n\
  \n```csharp\nusing System;\nnamespace ConstructorApplication {\n  class Person {\n\
  \    private double height;  // 人的高度\n    public Person(double heig) { // 参数构造函数\n\
  \      Console.WriteLine(\"We are creating an object, height = {0}\", heig);\n \
  \     height = heig;\n    }\n    public void setHeight(double heig ) {\n      height\
  \ = heig;\n    }\n    public double getHeight() {\n      return height;\n    }\n\
  \    static void Main(string[] args) {\n      Person p = new Person(8.0);\n    \
  \  Console.WriteLine(\"The height of the person is: {0}\", p.getHeight());\n   \
  \   // 设置高度\n      p.setHeight(7.0);\n      Console.WriteLine(\"The height of the\
  \ person is: {0}\", p.getHeight());\n      Console.ReadKey();\n    }\n  }\n}\n```\n\
  \n### 析构函数\n\n\n\n析构函数（Destructor）是类的一个特殊成员函数，当类的对象离开作用域时它会被执行。析构函数的名称与类名相同，但前面应有一个波浪号（`~`）。析构函数既不能接受参数，也不能返回值。\n\
  \n析构函数是离开程序之前释放内存资源的有用工具。你可以对析构函数进行重载或继承。以下示例演示了如何使用析构函数：\n\n```csharp\nusing System;\n\
  \nnamespace ConstructorApplication {\n\n  class Person {\n      private double height;\
  \  // 人的身高\n      public Person() {  // 构造函数\n          Console.WriteLine(\"We are\
  \ creating an object\");\n      }\n\n      ~Person() {  // 析构函数\n          Console.WriteLine(\"\
  We are deleting an object\");\n      }\n\n      public void setHeight( double heig\
  \ ) {\n          height = heig;\n      }\n      public double getHeight() {\n  \
  \        return height;\n      }\n      static void Main(string[] args) {\n    \
  \      Person p = new Person();\n          // 设置人的身高\n          p.setHeight(7.0);\n\
  \          Console.WriteLine(\"The height of the person is : {0}\", p.getHeight());\
  \          \n      }\n  }\n}\n```\n\n这里是函数的输出：\n\n![](img/00064.jpg)\n\n## 静态成员\n\
  \n要将类成员定义为静态的，我们使用 `static` 关键字。当类成员被声明为静态时，意味着无论创建了多少个类对象，静态成员只存在一个。\n\n使用 `static`\
  \ 关键字意味着类中只存在一个成员实例。我们需要声明常量时使用此关键字，因为可以通过调用类来获取它们的值，而无需创建该类的实例。我们可以在类定义或成员函数之外初始化静态变量。静态变量也可以在类定义内部初始化。\n\
  \n让我们通过示例演示静态变量的使用：\n\n```csharp\nusing System;\n\nnamespace StaticApp {\n\n  class\
  \ StaticVariables {\n      public static int x;\n      public void count() {\n \
  \         x++;\n      }\n      public int getX() {\n          return x;\n      }\n\
  \  }\n  class StaticTester {\n      static void Main(string[] args) {\n        \
  \  StaticVariables var1 = new StaticVariables();\n          StaticVariables var2\
  \ = new StaticVariables();\n          var1.count();\n          var1.count();\n \
  \         var1.count();\n          var2.count();\n          var2.count();\n    \
  \      var2.count();\n          Console.WriteLine(\"Variable x for var1 is: {0}\"\
  , var1.getX());\n          Console.WriteLine(\"Variable x for vars is: {0}\", var2.getX());\n\
  \          Console.ReadKey();\n      }\n  }\n}\n```\n\n代码返回以下结果：\n\n![](img/00055.jpg)\n\
  \n成员函数也可以被声明为静态的。此类函数只能访问静态变量。静态函数在对象创建之前就已经存在了。静态函数的使用如下例所示：\n\n```csharp\nusing\
  \ System;\n\nnamespace StaticAppli {\n\n  class StaticVariable {\n      public static\
  \ int x;\n      public void count() {\n          x++;\n      }\n      public static\
  \ int getX() {\n          return x;\n      }\n  }\n  class StaticTester {\n    \
  \  static void Main(string[] args) {\n          StaticVariable var = new StaticVariable();\n\
  \          var.count();\n          var.count();\n          var.count();\n      \
  \    Console.WriteLine(\"Variable x is: {0}\", StaticVariable.getX());\n       \
  \   Console.ReadKey();\n      }\n}\n```\n\n代码将返回：\n\n![](img/0045.jpg)\n\n## 第 12\
  \ 章：结构\n\nC# 中的结构（Structure）是一种值类型。通过结构，你可以使用单个变量来持有属于不同数据类型的相关数据。在 C# 中，我们使用 `struct`\
  \ 关键字来创建结构。\n\n结构用于跟踪记录。一个很好的例子是当你需要保留所有学生或所有员工的记录时。在存储学生记录的情况下，你需要跟踪的某些细节包括姓名、年龄、课程、入学日期、完成日期、费用金额、费用余额、监护人地址和手机号码等。所有这些细节都属于不同的数据类型，这意味着你将为每一个细节创建一个变量。然而，通过使用结构，你可以定义单个变量并将这些细节作为一个整体保留起来。\n\
  \n```csharp\nstruct Employee{\n  public string name;\n  public string department;\n\
  \  public string title;\n  public int age;\n  public double salary;\n};\n```\n\n\
  要初始化一个结构体，可以选择使用 `new` 关键字也可以不使用。结构体的成员可以被赋值，如下所示：\n\n```csharp\nusing System;\n\
  \npublic class MyStruct\n{\n    public static void Main()\n    {\n      Employee\
  \ emp = new Employee();\n      emp.name = \"Nicholas Samuel\";\n      emp.department\
  \ = \"Computing\";\n      emp.age = 26;\n      emp.salary = 5000;\n      Console.WriteLine(emp.name);\n\
  \      Console.WriteLine(emp.department);\n      Console.WriteLine(emp.age);\n \
  \     Console.WriteLine(emp.salary);\n    }\n}\npublic struct Employee\n{\n  public\
  \ string name { get; set; }\n  public string department { get; set; }\n  public\
  \ string title { get; set; }\n  public int age { get; set; }\n  public double salary\
  \ { get; set; }\n}\n```\n\n代码给出如下结果：\n\n![](img/0012.jpg)\n\n名为 `Employee` 的结构是通过\
  \ `struct` 关键字定义的。该结构的各种细节已经在其中声明。在类的顶部，我们创建了该结构的实例并将其命名为 `emp`。该实例被用于将结构的各种属性显示在屏幕上。\n\
  \n注意，结构是一种值类型，这使得它与类对象相比速度更快。这使得它们非常适合游戏编程。然而，相比结构，人们可以更容易传输类对象。这意味着在传输数据到其他类时，不应使用结构。\n\
  \n这里是 C# 中另一个结构示例：\n\n```csharp\nusing System;\nstruct Cars {\n  public string model;\n\
  \  public int cc;\n  public int passengers;\n  public int year;\n}; \n\npublic class\
  \ carStructure {\n  public static void Main(string[] args) {\n    Cars Premio; \
  \ /* 类型为 Cars 的 premio */\n    Cars X6;  /* 类型为 Cars 的 X6 */\n    /* 设置 premio 规格\
  \ */\n    Premio.model = \"Saloon\";\n    Premio.cc = 1800;\n    Premio.passengers\
  \ = 5;\n    Premio.year = 2010;\n    /* X6 规格 */\n    X6.model = \"Saloon\";\n \
  \   X6.cc = 3500;\n    X6.passengers = 5;\n    X6.year = 2012;\n    /* 输出 premio\
  \ 信息 */\n    Console.WriteLine(\"Premio model: {0}\", Premio.model);\n    Console.WriteLine(\"\
  Premio CC : {0}\", Premio.cc);\n    Console.WriteLine(\"Premio passengers : {0}\"\
  , Premio.passengers);\n    Console.WriteLine(\"Premio year : {0}\", Premio.year);\n\
  \    /* 输出 X6 信息 */\n    Console.WriteLine(\"X6 model: {0}\", X6.model);\n    Console.WriteLine(\"\
  X6 CC : {0}\", X6.cc);\n    Console.WriteLine(\"X6 passengers : {0}\", X6.passengers);\n\
  \    Console.WriteLine(\"X6 year : {0}\", X6.year);\n    Console.ReadKey();\n  }\n\
  }\n```\n\n\n\n\n到目前，你已经了解了如何使用结构以及它们的一些特性。C# 中的结构与 C 和 C++ 中支持的结构有很大区别。C# 结构具有以下特性：\n\
  \n- 结构可以包含字段、索引器、方法、属性、运算符和事件。\n- 结构可以定义构造函数，但不能定义析构函数。然而，在结构中，我们不允许定义默认构造函数。这是因为它是自动定义的，且无法进行更改。\n\
  - 结构不能继承另一个结构或类。\n- 通过结构，我们可以实现一个或多个接口。\n- 结构的成员不能被指定为虚（virtual）、抽象（abstract）或保护（protected）。\n\
  - 在通过 `New` 关键字创建 `Struct` 对象后，会创建该结构对象并调用相应的构造函数。与类不同，我们可以在不使用 `New` 关键字的情况下实例化结构。\n\
  - 如果不使用 `New` 运算符，字段将不会被赋值，在对所有字段进行赋值之前，无法使用该对象。\n\n## 结构 vs 类 (Struct vs. Class)\n\
  \n这里是结构（`Structs`）与类（`Classes`）的区别：\n\n- `Struct` 被解释为值类型。另一方面，`class` 被定义为引用类型。\n\
  - `Structs` 不支持继承。`Classes` 支持。\n- `Struct` 不能有默认构造函数。`class` 可以有。\n\n让我们根据上述差异创建一个示例：\n\
  \n```csharp\nusing System;\n\nstruct Cars {\n    private string model;\n    private\
  \ int cc;\n    private int passengers;\n    private int year;  \n\n  public void\
  \ getValues(string m, int c, int p, int yr) {\n      model = m;\n      cc = c;\n\
  \      passengers = p;\n      year = yr;\n  }\n  public void show() {\n      Console.WriteLine(\"\
  Car model : {0}\", model);\n      Console.WriteLine(\"CC : {0}\", cc);\n      Console.WriteLine(\"\
  Passengers : {0}\", passengers);\n      Console.WriteLine(\"Year :{0}\", year);\n\
  \  }\n}; \n\npublic class myStructure {\n  public static void Main(string[] args)\
  \ {\n      Cars Premio = new Cars();  /* 声明类型为 Cars 的 Premio */\n      Cars X6 =\
  \ new Cars();   /* 声明类型为 Cars 的 X6 */\n      /* Premio 规格 */\n      Premio.getValues(\"\
  Saloon\", 1800, 5, 2012);\n      /* X6 规格 */\n      X6.getValues(\"Saloon\", 3500,\
  \ 5, 2012);\n      /* 打印 Premio 信息 */\n      Premio.show();\n      /* 打印 X6 信息 */\n\
  \      X6.show();\n      Console.ReadKey();\n  }\n}\n```\n\n代码执行后将给出以下输出：\n\n![](img/00038.jpg)\n\
  \n## 第 13 章：封装 (Encapsulation)\n\n封装是将项目封装在逻辑或物理包中的过程。在面向对象编程中，封装被用于防止对实现细节的访问。\n\
  \n封装和抽象（Abstraction）是面向对象编程中密切相关的特性。抽象的目的是让相关细节对用户可见，而封装的目的是让程序员实现所需的抽象级别。\n\n为了实现封装，我们使用访问修饰符（access\
  \ specifiers）。访问修饰符的作用是说明类成员的可见性和范围。C# 支持不同类型的访问修饰符，它们包括：\n\n- 公共 (Public)\n- 保护\
  \ (Protected)\n- 私有 (Private)\n- 保护内部 (Protected internal)\n- 内部 (Internal)\n\n\
  ### 私有访问修饰符 (Private Access Specifier)\n\n使用 `private` 访问修饰符，类可以向其他对象和函数隐藏其成员函数和变量。只有相似类的函数能够访问其私有成员。类的实例无法访问类的私有成员。考虑下面的示例：\n\
  \n```csharp\nusing System;\n\nnamespace AccessApplication {\n  class Figure {\n\
  \      // 类成员变量\n      private double width;\n      private double length;    \n\
  \n      public void GetDetails() {\n          Console.WriteLine(\"Enter the Length:\
  \ \");\n          length = Convert.ToDouble(Console.ReadLine());\n          Console.WriteLine(\"\
  Enter the Width: \");\n          width = Convert.ToDouble(Console.ReadLine());\n\
  \      }\n      public double CalculateArea() {\n        return length * width;\n\
  \      }\n      public void Show() {\n          Console.WriteLine(\"The Length of\
  \ the figure is: {0}\", length);\n          Console.WriteLine(\"The Width of the\
  \ figure is: {0}\", width);\n          Console.WriteLine(\"The Area of the figure\
  \ is: {0}\", CalculateArea());\n      }\n  }//结束类 Figure \n  class RunFigure {\n\
  \    static void Main(string[] args) {\n        Figure f = new Figure();\n     \
  \   f.GetDetails();\n        f.Show();\n        Console.ReadLine();\n    }\n  }\n\
  ```\n\n运行代码并输入图形的测量值（宽度和长度）。你将获得图形的面积。成员变量，即 `width` 和 `length` 被定义为 `private`。这意味着我们无法从\
  \ `Main()` 函数中访问它们。`GetDetails()` 和 `Show()` 成员函数被声明为 `public`，因此它们能够访问这些变量。在创建\
  \ `Figure` 类实例后，我们也可以从 `Main()` 函数中访问它们。该实例被命名为 `f`。\n\n### 公共访问修饰符 (Public Access\
  \ Specifier)\n\n使用 `public` 访问修饰符，类可以向其他对象和函数暴露其成员函数和变量。任何声明为 `public` 的成员都可以从类外部访问。考虑以下示例：\n\
  \n```csharp\nusing System;\n\nnamespace FigureApplication {\n  class Figure {\n\
  \    // 成员变量\n    public double width;\n    public double length;\n      public\
  \ double CalculateArea() {\n        return length * width;\n      }\n      public\
  \ void Show() {\n          Console.WriteLine(\"The Length of the figure is: {0}\"\
  , length);\n          Console.WriteLine(\"The Width of the figure is: {0}\", width);\n\
  \          Console.WriteLine(\"The Area of the figure is: {0}\", CalculateArea());\n\
  \      }\n  }//结束类 Figure\n  class RunFigure {\n    static void Main(string[] args)\
  \ {\n        Figure f = new Figure();\n        f.length = 5.4;\n        f.width\
  \ = 3.2;\n        f.Show();\n        Console.ReadLine();\n    }\n  }\n}\n```\n\n\
  以下是代码的输出：\n\n![](img/00081.jpg)\n\n类成员变量 `width` 和 `length` 被声明为 `public`，这意味着在创建实例后，我们可以从\
  \ `Main()` 函数中访问它们。`CalculateArea()` 和 `Show()` 成员函数也可以在不使用类实例的情况下访问这些变量。`Show()`\
  \ 成员函数也被声明为 `public`，这意味着我们可以通过实例从 `Main()` 函数中访问它。\n\n### 保护访问修饰符 (Protected Access\
  \ Specifier)\n\n这种访问修饰符允许子类访问基类中定义的成员函数和变量。通过这种方式，实现继承变得更容易。这将在继承中讨论。\n\n### 内部访问修饰符\
  \ (Internal Access Specifier)\n\n这种访问修饰符允许类向当前程序集（assembly）中的其他对象和函数暴露其成员函数和变量。这意味着使用\
  \ `internal` 访问修饰符创建的任何成员都可以从定义该成员应用程序内的任何类或方法访问。这通过以下示例进行了演示：\n\n```csharp\nusing\
  \ System;\n\nnamespace AccesserApplication {\n  class Figure {\n    // 成员变量\n  \
  \  internal double width;\n    internal double length;\n      double CalculateArea()\
  \ {\n        return length * width;\n      }\n      public void Show() {\n```\n\n\
  \n\n\n\n![](img/00188.jpg)\n\n# 第 14 章：继承\n\n通过继承，程序员可以根据另一个类来定义一个类。这使得我们能够重用代码并缩短实现应用程序的时间。\n\
  \n在创建类时，程序员不需要创建完全新的成员函数和数据成员，而是指定新类继承现有类的成员。现有类被称为基类（base class），而新类被称为派生类（derived\
  \ class）。\n\n继承简单来说是“是一个”（IS-A）关系的实现。例如，`Cow`（牛）是一个`Mammal`（哺乳动物）。一个类可以继承多个类或接口，这意味着它可以从多个接口或类继承数据和函数。下面的示例演示了基类和派生类的概念：\n\
  \n```csharp\nusing System;\n\nnamespace InheritanceApp {\n  class Figure {\n   \
  \ public void setWidth(int wid) {\n      width = wid;\n    }\n    public void setHeight(int\
  \ heig) {\n      height = heig;\n    }\n    protected int width;\n    protected\
  \ int height;\n  }\n  // 派生类\n  class Rectangle: Figure {\n    public int calculateArea()\
  \ {\n      return (width * height);\n    }\n  }\n  class TestInheritance {\n   \
  \ static void Main(string[] args) {\n      Rectangle R = new Rectangle();\n    \
  \  R.setWidth(6);\n      R.setHeight(8);\n      // 打印矩形的面积。\n      Console.WriteLine(\"\
  The area is: {0}\", R.calculateArea());\n      Console.ReadKey();\n    }\n  }\n\
  }\n```\n\n代码应返回以下内容：\n\n![](img/189.jpg)\n\n我们定义了 `Figure` 类，它包含两个属性 `width` 和 `height`。该类还两个两个方法`setWidth()`\
  \ 和 `setHeight()`。然后我们定义了一个名为 `Rectangle` 的类。请注意我们创建此类时使用的语法：`class Rectangle: Figure`。\n\
  \n使用完整的冒号表示 `Rectangle` 类正在继承 `Figure` 类。`Rectangle` 类只有一个方法，即 `calculateArea()`\
  \ 方法。然而，由于它继承了 `Figure` 类，这意味着它拥有了 `Figure` 类的所有属性，比如 `width` 和 `height`。\n\n随后我们创建了\
  \ `TestInheritance` 类。在 `Main()` 方法中，创建了一个 `Rectangle` 类的实例并将其命名为 `R`。我们使用该实例来访问在\
  \ `Rectangle` 和 `Figure` 类中定义的属性。继承就是如此！\n\n## 基类初始化\n\n派生类继承基类中定义的成员方法和成员变量。这意味着我们在创建子类之前应该创建父类。父类的初始化指令可以在成员的初始化中给出。下面的程序演示了这一点：\n\
  \n```csharp\nusing System;\n\nnamespace InheritanceApp {\n  class Object {\n   \
  \ // 成员变量\n    protected double width;\n    protected double length;\n    public\
  \ Object(double len, double wid) {\n      width = wid;\n      length = len;\n  \
  \  }\n    public double CalculateArea() {\n      return length * width;\n    }\n\
  \    public void Show() {\n      Console.WriteLine(\"The Width of the figure is:\
  \ {0}\", width);\n      Console.WriteLine(\"The Length of the figure is: {0}\",\
  \ length);\n      Console.WriteLine(\"The Area of the figure is: {0}\", CalculateArea());\n\
  \    }\n  }//end class Figure \n  class Carpet : Object {\n    private double cost;\n\
  \    public Carpet(double len, double wid) : base(len, wid) { }\n    public double\
  \ CalculateCost() {\n      double cost;\n      cost = CalculateArea() * 12;\n  \
  \    return cost;\n    }\n    public void Show() {\n      base.Show();\n      Console.WriteLine(\"\
  The total for the carpet is: {0}\", CalculateCost());\n    }\n  }\n  class RunObject\
  \ {\n    static void Main(string[] args) {\n      Carpet c = new Carpet(7.5, 9.5);\n\
  \      c.Show();\n      Console.ReadLine();\n    }\n  }\n}\n```\n\n代码将返回以下内容：\n\n\
  ![](img/0092.jpg)\n\n## 多重继承\n\nC# 不支持多继承。然而，通过接口，我们可以实现多继承。考虑以下示例：\n\n```csharp\n\
  using System;\n\nnamespace InheritanceApp {\n  class Object {\n    public void setWidth(int\
  \ wid) {\n      width = wid;\n    }\n    public void setHeight(int heig) {\n   \
  \   height = heig;\n    }\n    protected int width;\n    protected int height;\n\
  \  }\n  // 基类的 PaintCost 接口\n  public interface PaintCost {\n    int calculateCost(int\
  \ area);\n  }\n  // 派生类\n  class Board : Object, PaintCost {\n    public int calculateArea()\
  \ {\n      return (width * height);\n    }\n    public int calculateCost(int area)\
  \ {\n      return area * 12;\n    }\n  }\n  class InheritanceTester {\n    static\
  \ void Main(string[] args) {\n      Board B = new Board();\n      int area;\n  \
  \    B.setWidth(5);\n      B.setHeight(7);\n      area = B.calculateArea();\n  \
  \    // 显示对象的面积\n      Console.WriteLine(\"The area of the object is: {0}\", B.calculateArea());\n\
  \      Console.WriteLine(\"The total printing cost is: ${0}\", B.calculateCost(area));\n\
  \      Console.ReadKey();\n    }\n  }\n}\n```\n\n代码给出输出：\n\n![](img/0084.jpg)\n\n\
  # 第 15 章：多态\n\n多态是一个意味着多种形式的术语。在编程中，它表现为“一个接口，多个函数”。多态有两种形式：静态或动态。\n\n对于静态动态的情况，对函数的响应在编译时确定。在动态多态中，对函数的响应在运行时确定。\n\
  \n## 静态多态\n\n如上述，这种类型多态的函数响应在编译时确定。在编译期间将函数绑定到对象的过程被称为早期绑定（early binding），也称为静态绑定。在\
  \ C# 中，静态多态可以通过两种方式实现：\n\n- `Function overloading`（函数重载）\n- `Operator overloading`（运算符重载）\n\
  \n### 函数重载\n\n我们可以在作用范围内对同一个函数名定义多个定义。这些函数之间的差异通过类型或参数的数量来实现。函数不能仅通过改变返回类型来重载。\n\
  \n下面的示例演示了如何在 C# 中重载函数：\n\n```csharp\nusing System;\n\nnamespace PolymorphismApp\
  \ {\n  class DisplayData {\n    void display(int x) {\n      Console.WriteLine(\"\
  Printing an int value: {0}\", x );\n    }\n    void display(double y) {\n      Console.WriteLine(\"\
  Printing a float value: {0}\", y);\n    }\n    void display(string z) {\n      Console.WriteLine(\"\
  Printing a string value: {0}\", z);\n    }\n    static void Main(string[] args)\
  \ {\n      DisplayData dd = new DisplayData();\n      // 调用函数返回一个整数值\n      dd.display(10);\n\
  \      // 调用函数返回一个浮点数值\n      dd.display(11.385);\n    }\n  }\n}\n```\n\n\n\n\n\n\
  ```csharp\n// 调用显示函数返回字符串值\ndd.display(\"Hello Sir/Madam\");\nConsole.ReadKey();\n\
  }\n}\n```\n\n该代码执行后将返回以下内容：\n\n![](img/00161.jpg)\n\n我们对 `display()` 函数有三种定义。在这种情况下，通过更改函数接收的参数类型来实现重载。在其中一个实例中，函数接收一个整数；在另一个实例中接收一个浮点数；最后一个实例中接收一个字符串。\n\
  \n# 运算符重载\n\n运算符重载指的是使用单个运算符来执行各种操作。通过运算符重载，可以在 C# 运算符应用于用户定义类型时为其添加额外功能。当操作数的一个或两个属于用户定义的类时，就是这种情况。\n\
  \n以下是一个演示此点的示例：\n\n```csharp\nusing System;\n\nnamespace PolymorphismApp {\n  class\
  \ Object {\n    private double breadth;  // 盒子的宽度\n    private double length;  //\
  \ 盒子的长度\n    private double height;  // 盒子的高度\n    public double calculateVolume()\
  \ {\n      return breadth * length * height;\n    }\n    public void setLength(\
  \ double l ) {\n      length = l;\n    }\n    public void setBreadth( double b )\
  \ {\n      breadth = b;\n    }\n    public void setHeight( double h ) {\n      height\
  \ = h;\n    }\n    // 重载 + 运算符以相两个对象。\n    public static Object operator+ (Object\
  \ obj1, Object obj2) {\n      Object ob = new Object();\n      ob.length = obj1.length\
  \ + obj2.length;\n      ob.breadth = obj1.breadth + obj2.breadth;\n      ob.height\
  \ = obj1.height + obj2.height;\n      return ob;\n    }\n  }\n  class BoxTester\
  \ {\n    static void Main(string[] args) {\n      Object Object1 = new Object();\
  \  // 声明类型为 Object 的 Object1\n      Object Object2 = new Object();  // 声明类型为 Object\
  \ 的 Object2\n      Object Object3 = new Object();  // 声明类型为 Object 的 Object3\n \
  \     double volume = 0.0;    // 在此处存储对象的体积\n      // 对象 1 尺寸\n      Object1.setLength(7.0);\n\
  \      Object1.setBreadth(8.0);\n      Object1.setHeight(10.0);\n      // 对象 2 尺寸\n\
  \      Object2.setLength(6.0);\n      Object2.setBreadth(9.0);\n      Object2.setHeight(11.0);\n\
  \      // 计算对象 1 的体积\n      volume = Object1.calculateVolume();\n      Console.WriteLine(\"\
  The volume of Object1 : {0}\", volume);\n      // 计算对象 2 的体积\n      volume = Object2.calculateVolume();\n\
  \      Console.WriteLine(\"The volume of Object2 : {0}\", volume);\n      // 将两个对象相\n\
  \      Object3 = Object1 + Object2;\n      // 计算对象 3 的体积\n      volume = Object3.calculateVolume();\n\
  \      Console.WriteLine(\"The volume of Object3 : {0}\", volume);\n      Console.ReadKey();\n\
  \    }\n  }\n}\n```\n\n代码返回了如下：\n\n![](img/0060.jpg)\n\n我们重载了 `+` 运算符。该运算符被用于数值类型的相加。然而，在上面的示例中，我们使用该运算符将两个对象\
  \ `Object1` 和 `Object2` 相加。我们得到了 `Object3`。`Object1` 和 `Object2` 是用户定义类型，这意味着我们使用\
  \ `+` 运算符来相用户定义类型。\n\n注意，在 C# 中可以重载运算符是事实，但并不是所有运算符都可以重载。例如，你不能重载像 `==`、`>`、`!=`、`=`\
  \ 这样的比较运算符。对于 `&&` 和 `||` 等条件运算符，我们可以重载它们，但不能直接重载。\n\n# 动态多态\n\n在 C# 中，我们可以创建抽象类用于接口的部分类实现。一旦派生类继承了它，该实现就会完成。抽象类具有抽象方法，派生类实现这些方法。然而，派生类具有专门的功能。\n\
  \n注意，你不能创建任何抽象类的实例。抽象方法也不能在抽象类之外声明。以下是一个抽象类的示例：\n\n```csharp\nusing System;\n\n\
  namespace PolymorphismApp {\n  abstract class Object {\n    abstract int area();\n\
  \  }\n  class Object1: Object {\n    private int width;\n    private int length;\n\
  \    public Object1( int x = 0, int y = 0) {\n      length = x;\n      width = y;\n\
  \    }\n    public override int area () {\n      Console.WriteLine(\"The Object1\
  \ area is:\");\n      return (width * length);\n    }\n  }\n  class Object1Tester\
  \ {\n    static void Main(string[] args) {\n      Object1 obj = new Object1(8, 6);\n\
  \      double x = obj.area();\n      Console.WriteLine(\"The area is: {0}\",x);\n\
  \      Console.ReadKey();\n    }\n  }\n}\n```\n\n代码将打印以下结果：\n\n![](img/0079.jpg)\n\
  \n在类中定义了你想在派生类中实现的函数后，你应该使用虚函数。为了实现动态多态，我们使用抽象类和虚函数。让我们通过示例来演示这一点：\n\n```csharp\n\
  using System;\n\nnamespace PolymorphismApp {\n  class Object {\n    protected int\
  \ width, height;\n    public Object( int x = 0, int y = 0) {\n      width = x;\n\
  \      height = y;\n    }\n    public virtual int area() {\n      Console.WriteLine(\"\
  The area of the parent class is :\");\n      return 0;\n    }\n  }\n  class Object1:\
  \ Object {\n    public Object1( int x = 0, int y = 0): base(x, y) {}\n    public\
  \ override int area() {\n      Console.WriteLine(\"The area of Object1 class is:\"\
  );\n      return (width * height);\n    }\n  }\n  class Object2: Object {\n    public\
  \ Object2( int x = 0, int y = 0): base(x, y) {}\n    public override int area()\
  \ {\n      Console.WriteLine(\"The area of Object2 class is:\");\n      return (width\
  \ * height / 2);\n    }\n  }\n  class Caller {\n    public void CallArea(Object\
  \ obj) {\n      int x;\n      x = obj.area();\n      Console.WriteLine(\"The Area\
  \ is: {0}\", x);\n    }\n  }\n  class TesterClass {\n    static void Main(string[]\
  \ args) {\n      Caller c = new Caller();\n      Object1 ob1 = new Object1(10, 7);\n\
  \      Object2 ob2 = new Object2(10, 5);\n      c.CallArea(ob1);\n      c.CallArea(ob2);\n\
  \      Console.ReadKey();\n    }\n  }\n}\n```\n\n\n\n\n\n4. `public MatchCollection\
  \ Matches(string input, string replacement)` - 这将输入字符串中的匹配项替换为指定的替换字符串。\n\n5. `public\
  \ string[] Split(string input)` - 此函数有助于将输入字符串拆分为子字符串数组，其拆分位置由 `Regex` 构造函数中所指定的正则表达式模式定义。\n\
  \n考虑下面给出的示例：\n\n```csharp\nusing System.Text.RegularExpressions;\nusing System;\n\
  \nnamespace RegularExpApp {\n  class MyProgram {\n     private static void findMatch(string\
  \ input, string expre) {\n            Console.WriteLine(\"The Expression is: \"\
  \ + expre);\n            MatchCollection mc = Regex.Matches(input, expre);\n   \
  \         foreach (Match x in mc) {\n                Console.WriteLine(x);\n   \
  \         }\n        }\n      static void Main(string[] args) {\n          string\
  \ s = \"Splitting an Input String into Substrings\";\n        Console.WriteLine(\"\
  Match words that begin with 'S': \");\n        findMatch(s, @\"\\bS\\S*\");\n  \
  \      Console.ReadKey();\n      }\n  }\n}\n```\n\n匹配完成后，代码将返回以下内容：\n\n![](img/00113.jpg)\n\
  \n输出显示从输入字符串中匹配了三个单词。我们正在匹配任何以 S 开头的单词，并发现了其中三个。\n\n考虑下面给出的下一个示例：\n\n```csharp\n\
  using System.Text.RegularExpressions;\nusing System;\n\nnamespace RegularExpApp\
  \ {\n  class MyProgram {\n     private static void findMatch(string input, string\
  \ expre) {\n            Console.WriteLine(\"The input expression is: \" + expre);\n\
  \            MatchCollection mc = Regex.Matches(input, expre);\n            foreach\
  \ (Match x in mc) {\n                Console.WriteLine(x);\n            }\n    \
  \    }\n      static void Main(string[] args) {\n          string s = \"so she was\
  \ the same\";\n        Console.WriteLine(\"Match words beginning with 's' and ending\
  \ with 'e':\");\n        findMatch(s, @\"\\bs\\S*e\\b\");\n        Console.ReadKey();\n\
  \      }\n  }\n}\n```\n\n代码将给出以下结果：\n\n![](img/00136.jpg)\n\n在上面的示例中，我们正在匹配以 s 开头并\
  \ e 结尾的单词。我们成功地在输入字符串中匹配了两个单词。这是另一个示例：\n\n```csharp\nusing System;\nusing System.Text.RegularExpressions;\n\
  \nnamespace RegularExpApp {\n  class MyProgram {\n    static void Main(string[]\
  \ args) {\n          string text = \"Hi  learner   \";\n          string pattern\
  \ = \"\\\\s+\";\n          string substitute = \" \";\n          Regex r = new Regex(pattern);\n\
  \          string output = r.Replace(text, substitute);\n          Console.WriteLine(\"\
  The input string is: {0}\", text);\n          Console.WriteLine(\"The string after\
  \ replacement is: {0}\", output);   \n          Console.ReadKey();\n      }\n  }\n\
  }\n```\n\n代码返回如下：\n\n![](img/00067.jpg)\n\n我们在代码中做的是替换额外的空白。“Hi”和“learner”之间有一个很大的空格。多余的空格已经被替换或删除。\n\
  \n# 第 17 章：异常处理过程\n\n应用程序在执行过程中通常会遇到错误。错误发生后，程序会抛出一个包含错误信息的异常。应该对异常进行处理，以防止程序崩溃。\n\
  \n在 C# 中，异常使用 4 个关键字进行处理：\n\n1. `try` - 标识触发了特定异常的代码块。其后紧跟着一个或多个 `catch` 块。\n2.\
  \ `catch` - 程序应该在需要处理问题的地方使用异常处理程序来捕获异常。`catch` 是指示异常将要捕获位置的关键字。\n3. `finally` -\
  \ `finally` 块用于无论是否抛出异常都执行一组语句。例如，文件在打开后必须关闭，无论是否抛出异常。\n4. `throw` - 异常通常在问题发生后被抛出。这是通过\
  \ `throw` 关键字实现的。\n\n`try` 和 `catch` 的组合用于捕获。`try/catch` 块必须放置在可能抛出异常的代码周围。此类代码被称为受保护代码，这里是使用这些关键字的语法：\n\
  \n```csharp\ntry {\n  // 抛出异常的语句\n} catch (Exception1) {\n  // 错误处理代码\n} catch (Exception2)\
  \ {\n  // 错误处理代码\n} catch (ExceptionN) {\n  // 错误处理代码\n} finally {\n  // 要执行的语句\n\
  }\n```\n\n如果 `try` 块抛出了异常，可以使用许多 `catch` 语句来捕获不同的异常。在 C# 中，异常使用类来表示。`System.Exception`\
  \ 是 C# 中所有异常类的基类，因为所有其他类都直接或间接地派生自它。\n\n## 异常处理\n\n在 C# 中，可以使用 `try` 和 `catch` 块处理异常。通过这些块，我们可以将核心程序语句与错误处理分离。我们可以使用\
  \ `try`、`catch` 和 `finally` 关键字处理错误。例如，除以零会抛出异常。让我们编写一些代码来处理这种情况：\n\n```csharp\n\
  using System;\n\nnamespace ExceptionHandlingApp {\n  class DivisionClass {\n   \
  \ int answer;     \n    DivisionClass() {\n      answer = 0;\n    }\n    public\
  \ void division(int x, int y) {\n      try {\n        answer = x / y;\n      } catch\
  \ (DivideZeroException exception) {\n        Console.WriteLine(\"Exception caught:\
  \ {0}\", exception);\n      } finally {\n        Console.WriteLine(\"Answer: {0}\"\
  , answer);\n      }\n    }\n    static void Main(string[] args) {\n      DivisionClass\
  \ dc = new DivisionClass();\n      dc.division(12, 0);\n      Console.ReadKey();\n\
  \    }\n  }\n}\n```\n\n代码应该返回异常：\n\n![](img/0181.jpg)\n\n我们创建了 `division()` 函数，它接收两个整数类型的参数\
  \ `x` 和 `y`。我们向该函数传递了 12 和 0，这意味着我们将 12 除以 0。然而，这将产生异常。\n\n## 自定义异常\n\nC# 允许程序员定义自己的异常。我们从\
  \ `Exception` 类派生此类自定义异常类。考虑下面给出的示例：\n\n```csharp\nusing System;\n\nnamespace ExceptionHandlingApp\
  \ {\n  class TemperatureTest {\n    static void Main(string[] args) {\n      TemperatureClass\
  \ tc = new TemperatureClass();\n      try {\n        tc.displayTemperature();\n\
  \      } catch(TempIsZeroException exception) {\n        Console.WriteLine(\"TempIsZeroException:\
  \ {0}\", exception.Message);\n      }\n      Console.ReadKey();\n    }\n  }\n}\n\
  \npublic class TempIsZeroException: Exception {\n  public TempIsZeroException(string\
  \ msg): base(msg) {\n  }\n}\n\npublic class TemperatureClass {\n  int temp = 0;\n\
  \  public void displayTemperature() {\n    if(temp == 0) {\n      throw (new TempIsZeroException(\"\
  We found Zero Temperature\"));\n    } else {\n      Console.WriteLine(\"Temperature\
  \ is: {0}\", temp);\n    }\n  }\n}\n```\n\n代码将返回：\n\n![](img/0154.jpg)\n\n## 嵌套\
  \ try-catch\n\nC# 允许我们创建一个嵌套的 `try-catch` 块。在这种情况下，异常将在发生异常的 `try` 块随后的 `catch`\
  \ 块中捕获。考虑以下示例：\n\n```csharp\nusing System;\n\npublic class NestedtryCatch\n{\n \
  \ public static void Main()\n  {\n    Employee emp = null;\n    try\n    {\n   \
  \   try\n      {\n        emp.EmployeeName = \"\";\n      }\n      catch\n     \
  \ {\n        Console.WriteLine(\"The inner catch\");\n      }\n    }\n    catch\n\
  \    {\n      Console.WriteLine(\"The outer catch\");\n    }\n  }\n}\n\npublic class\
  \ Employee{\n  public string EmployeeName { get; set; }\n}\n```\n\n代码打印：\n\n![](img/00053.jpg)\n\
  \n\n\n\n如果没有带有相应异常类型的内部 `catch` 块，异常将流向外层的 `catch` 块，直到找到适当的异常过滤器。例如：\n\n```csharp\n\
  using System;\n\npublic class NestedtryCatch\n{\n    public static void Main()\n\
  \    {\n        Employee emp = null;\n        try\n        {\n            try\n\
  \            {\n                // This will throw a NullReferenceException\n  \
  \              emp.EmployeeName = \"\";\n            }\n            catch (InvalidOperationException\
  \ innerException)\n            {\n                Console.WriteLine(\"The inner\
  \ catch\");\n            }\n        }\n        catch\n        {\n            Console.WriteLine(\"\
  The outer catch\");\n        }\n    }\n}\n\npublic class Employee\n{\n    public\
  \ string EmployeeName { get; set; }\n}\n```\n\n在上面的示例中，语句 `emp.EmployeeName` 将生成一个\
  \ `NullReferenceException`，但我们没有能够处理 `NullReferenceException` 或 `Exception` 类型的\
  \ `catch` 块。外部块将处理此异常。代码返回以下结果：\n\n![](img/00151.jpg)\n\n# 第 18 章：文件 I/O\n\n文件的特征是名称和目录路径。一旦你打开一个文件，它就变成了一个流。文件通常是为了读取或写入而打开的。\n\
  \n流简单来说就是通过通信路径的字节序列。流有两种类型：\n\n> ● 输入流\n> ● 输出流\n\n输入流帮助我们从文件中读取数据，即读取操作；而输出流则帮助我们向文件中写入数据，即写入操作。\n\
  \n## 输入/输出类\n\nC# 为我们提供了许多可以用于处理文件的类。这些类可以用于访问目录、文件，创建新文件、打开现有文件以及将文件从一个目录移动到另一个目录。这些类定义在\
  \ `System.IO` 类中。让我们讨论一下其中的一些类：\n\n* `BinaryReader` - 此类帮助我们从二进制流中读取原始数据。\n* `BinaryWriter`\
  \ - 此类帮助我们以二进制格式写入原始数据。\n* `BufferedStream` - 它充当流字节的临时存储器。\n* `Directory` - 此类帮助我们操纵目录的结构。\n\
  * `DriveInfo` - 此类为我们提供有关驱动器的信息。\n* `File` - 此类用于操作文件。\n* `FileInfo` - 帮助对文件执行操作。\n\
  * `FileStream` - 用于从文件的任何位置进行写入和读取。\n* `MemoryStream` - 帮助随机访问存储在内存中的数据。\n* `Path`\
  \ - 用于执行路径信息的操作。\n* `StreamReader` - 从字节流中读取字符。\n* `StreamWriter` - 向流写入字符。\n* `StringReader`\
  \ - 从字符串缓冲区读取。\n* `StringWriter` - 写入字符串缓冲区。\n\n## FileStream 类\n\n此类定义在 `System.IO`\
  \ 命名空间中，它可以帮助我们读写文件。我们也可以用它来关闭文件。\n\n为了使用此类，你必须创建它的对象。该实例可以用于创建新文件和打开现有文件。以下是创建\
  \ `FileStream` 类实例的方法：\n\n```csharp\nFileStream <object> = new FileStream( <file>,\
  \ <FileMode Enumerator>, <FileAccess Enumerator>, <FileShare Enumerator>);\n```\n\
  \n例如，假设我们需要读取名为 `names.txt` 的文件。我们可以创建一个名为 `FS` 的 `FileStream` 对象并将其为此目的。演示如下：\n\
  \n```csharp\nFileStream FS = new FileStream(\"names.txt\", FileMode.Open, FileAccess.Read,\
  \ FileShare.Read);\n```\n\n`FileMode` 是一个枚举器，定义了多种用于打开文件的方法。这些方法包括：\n\n* `Append`\
  \ – 此方法打开现有文件，然后将光标置于文件末尾，或者如果指定的文件不存在则创建一个新文件。\n* `Create` – 用于创建新文件。\n* `CreateNew`\
  \ — 它指示操作系统创建一个新文件。\n* `Open` – 用于打开现有文件。\n* `OpenOrCreate` – 它指示操作系统如果文件存在则打开它，如果不存在则创建一个新文件。\n\
  * `Truncate` – 用于打开现有文件并将其大小截断为零字节字节。\n\n`FileAccess` 是一个包含多个方法的枚举器，包括 `Read`、`Write`\
  \ 和 `ReadWrite`。\n\n`FileShare` 枚举器带有以下成员：\n\n* `Inheritable` – 帮助文件句柄在向子进程传递继承性时。\n\
  * `None` – 它禁用了当前文件的共享。\n* `Read` – 打开文件进行读取。\n* `ReadWrite` – 打开文件进行读写。\n* `Write`\
  \ – 打开文件进行写入。\n\n`FileStream` 类可以如下面所示使用：\n\n```csharp\nusing System.IO;\nusing\
  \ System;\n\nnamespace FileApp {\n  class MyProgram {\n    static void Main(string[]\
  \ args) {\n      FileStream FS = new FileStream(\"names.txt\", FileMode.OpenOrCreate,\
  \ FileAccess.ReadWrite, FileShare.Read);\n      for (int x = 0; x <= 10; x++) {\n\
  \        FS.Write((byte)x);\n      }\n      FS.Close();\n    }\n  }\n}\n```\n\n\n\
  \n\n# StreamReader 类\n\n此类帮助我们从文本文件中读取数据。该类继承自 `Stream` 基类。它还继承了 `TextReader` 类，`TextReader`\
  \ 是用于读取一系列字符的抽象基类。以下是该类提供的常用方法：\n\n* `public override void Close()`- 该方法关闭 `StreamReader`\
  \ 对象和流，然后释放读取器使用的任何系统资源。\n* `public override int Peek()`- 此方法将返回下一个可用的字符而不消耗它。\n\
  * `public override int Read()`- 此方法将读取输入流中的下一个字符，然后将字符位置移动 1 位。\n\n让我们演示如何使用此类来从名为\
  \ `names.txt` 的文件中读取内容：\n\n```csharp\nusing System.IO;\nusing System;\n\nnamespace\
  \ IOApplication {\n  class MyProgram {\n    static void Main(string[] args) {\n\
  \      try {\n          // 创建一个 StreamReader 实例用于从文件读取。\n          // using 语句将关闭\
  \ StreamReader。\n          using (StreamReader sr = new StreamReader(\"c:/names.txt\"\
  )) {\n            string line;\n            // 从文件中读取行，直到\n            // 到文件末尾。\n\
  \            while ((line = sr.ReadLine()) != null) {\n                Console.WriteLine(line);\n\
  \            }\n          }\n      } catch (Exception exception) {\n          //\
  \ 通知用户发生了什么错误\n          Console.WriteLine(\"File couldn't be read:\");\n      \
  \    Console.WriteLine(exception.Message);\n      }\n      Console.ReadKey();\n\
  \    }\n  }\n}\n```\n\n该代码将读取 `names.txt` 文件中编写文本并将其打印。\n\n# StreamWriter 类\n\n\
  此类继承自 `TextWriter` 抽象类，该类表示一种写入，能够写入一系列字符。以下是该类的常用方法：\n\n* `public override void\
  \ Close()`- 此方法将关闭当前的 `StreamWriter` 对象以及底层流。\n* `public override void Flush()`-\
  \ 此方法将清除当前写入器的缓冲区，并将任何缓冲中的数据写入流中。\n* `public virtual void Write(bool value)`- 此方法将\
  \ `Boolean` 值的文本表示形式写入文本流或字符串中。\n* `public override void Write(char value)`- 用于向流写入一个字符。\n\
  * `public virtual void Write(decimal value)`- 此方法将 `decimal` 值的文本表示形式写入文本流或字符串中。\n\
  * `public virtual void Write(double value)`- 将 8 字节浮点值的文本表示写入文本流或字符串中。\n* `public\
  \ virtual void Write(int value)`- 将 4 字节符号整数的文本表示形式写入文本流或字符串中。\n* `public override\
  \ void Write(string value)`- 用于向流写入字符串。\n* `public virtual void WriteLine()`- 用于向文本流或字符串写入行终止符。\n\
  \n让我们演示如何使用 `StreamWriter` 类来写入文本数据：\n\n```csharp\nusing System.IO;\nusing System;\n\
  \nnamespace IOApp {\n  class MyProgram {\n    static void Main(string[] args) {\n\
  \      string[] students = new string[] {\"Nicholas Samuel\", \"Michelle Boss\"\
  };\n      using (StreamWriter sw = new StreamWriter(\"students.txt\")) {\n     \
  \   foreach (string x in students) {\n            sw.WriteLine(x);\n        }\n\
  \      }\n      // 读取并显示文件中的每一行。\n      string text = \"\";\n      using (StreamReader\
  \ sr = new StreamReader(\"students.txt\")) {\n        while ((text = sr.ReadLine())\
  \ != null) {\n            Console.WriteLine(text);\n        }\n      }\n      Console.ReadKey();\n\
  \    }\n  }\n}\n```\n\n该代码将打印以下结果：\n\n![](img/00149.jpg)\n\n# BinaryReader 类\n\n\
  此类可用于从文件中读取数据。我们首先应该通过向其构造函数传递 `FileStream` 对象来创建一个 `BinaryReader` 对象。该类包含许多方法，包括：\n\
  \n* `public override void Close()`- 用于关闭 `BinaryReader` 对象以及底层流。\n* `public virtual\
  \ int Read()`- 用于从底层流中读取字符并移动流的位置。\n* `public virtual bool ReadBoolean()`- 用于从当前流读取一个\
  \ `Boolean` 值并将流的当前位置移动 1 字节。\n* `public virtual byte ReadByte()`- 用于从当前流读取下一个字节到字节数组中，并移动相同数量的字节位置。\n\
  \n# BinaryWriter 类\n\n此类帮助将二进制数据写入流中。要创建 `BinaryWriter` 对象，我们向构造函数传递一个 `FileStream`\
  \ 对象。该类包含许多方法，包括：\n\n* `public override void Close()`- 用于关闭 `BinaryWriter` 对象以及底层流。\n\
  * `public virtual void Flush()`- 此方法将清除当前写入器的缓冲区并将任何缓冲中的数据写入设备。\n* `public virtual\
  \ void Write(bool value)`- 用于向当前流写入一个单字节的 `Boolean` 值。1 代表真，0 代表假。\n\n让我们创建一个示例，演示如何读取和写入二进制数据：\n\
  \n```csharp\nusing System;\nusing System.IO;\n\nnamespace BinaryFileApplication\
  \ {\n  class MyProgram {\n    static void Main(string[] args) {\n      BinaryWriter\
  \ bw;\n      BinaryReader br;\n      int x = 12;\n      double db = 1.24658;\n \
  \     bool bl = false;\n      string st = \"Hello world\";\n      // 创建文件\n    \
  \  try {\n          bw = new BinaryWriter(new FileStream(\"testdata\", FileMode.Create));\n\
  \      } catch (IOException exception) {\n          Console.WriteLine(exception.Message\
  \ + \"\\n Unable to create the file.\");\n          return;\n      }\n      // 写入文件\n\
  \      try {\n          bw.Write(x);\n          bw.Write(db);\n          bw.Write(bl);\n\
  \          bw.Write(st);\n      } catch (IOException exception) {\n          Console.WriteLine(exception.Message\
  \ + \"\\n Unable to the file.\");\n          return;\n      }\n      bw.Close();\n\
  \      // 从文件读取\n      try {\n          br = new BinaryReader(new FileStream(\"\
  testdata\", FileMode.Open));\n      } catch (IOException exception) {\n        \
  \  Console.WriteLine(exception.Message + \"\\n Unable to the file.\");\n       \
  \   return;\n      }\n      try {\n          x = br.ReadInt32();\n          Console.WriteLine(\"\
  Integer data: {0}\", x);\n          db = br.ReadDouble();\n          Console.WriteLine(\"\
  Double data: {0}\", db);\n          bl = br.ReadBoolean();\n          Console.WriteLine(\"\
  Boolean data: {0}\", bl);\n          st = br.ReadString();\n          Console.WriteLine(\"\
  String data: {0}\", st);\n      } catch (IOException exception) {\n          Console.WriteLine(exception.Message\
  \ + \"\\n Unable to read the file.\");\n          return;\n      }\n      br.Close();\n\
  \      Console.ReadKey();\n    }\n  }\n}\n```\n\n# 第 19 章：委托 (Delegates)\n\n我们可以拥有具有多个不同数据类型参数的函数。然而，我们有时可能需要将某个函数作为参数传递。C#\
  \ 如何处理事件处理程序或回调函数？这是通过委托实现的。\n\n\n\n\n\n委托（delegate）被视为指向函数的指针。它是一种引用数据类型，持有方法的引用。所有委托都隐式地继承自\
  \ `System.Delegate` 类。我们使用委托来实现来实现事件和回调方法。\n\n## 声明委托\n\n我们声明委托的方式决定了委托可以引用的方法。委托可以引用一个与委托签名相同的方法。我们使用\
  \ `delegate` 关键字来声明委托。声明时使用以下语法：\n\n`<访问修饰符> delegate <返回类型><委托名称>(<参数>)`\n\n这里这里是一个示例：\n\
  \n```csharp\npublic delegate void Display(int value);\n```\n\n在上面，我们声明了一个 `Display`\
  \ 委托。我们可以使用此委托指向一个与 `Display` 委托声明的、具有相同返回类型和参数的方法。\n\n请考虑下面的示例：\n\n```csharp\n\
  using System;\n\npublic class MyProgram\n{\n    public delegate void Display(int\
  \ num);\n\n    public static void Main()\n    {\n        // Display 委托指向 DisplayNumber\n\
  \        Display displayDel = DisplayNumber;\n        displayDel(100000);\n    \
  \    displayDel(200);\n\n        // Display 委托指向 DisplayMoney\n        displayDel\
  \ = DisplayMoney;\n        displayDel(50000);\n        displayDel(20);\n    }\n\n\
  \    public static void DisplayNumber(int x)\n    {\n        Console.WriteLine(\"\
  Number: {0,-12:N0}\",x);\n    }\n\n    public static void DisplayMoney(int amount)\n\
  \    {\n        Console.WriteLine(\"Money: {0:C}\", amount);\n    }\n}\n```\n\n\
  代码将打印以下内容：\n\n![](img/00028.jpg)\n\n我们创建了一个名为 `Display` 的委托，它接受一个整数类型的参数并返回 `void`。在\
  \ `Main()` 方法中，我们创建了一个 `Display` 类型变量，并将名为 `DisplayNumber` 的方法赋值给它。调用 `Display`\
  \ 委托后，也会调用 `DisplayNumber` 方法；如果 `Display` 委托变量被赋值 `DisplayMoney` 方法，则会调用 `DisplayMoney`\
  \ 方法。\n\n此外，我们可以使用 `new` 关键字创建委托对象。在这种情况下，我们必须像下面一样指定方法的名称：\n\n```csharp\nDisplay\
  \ displayDel = new Display (DisplayNumber);\n```\n\n## 调用委托\n\n委托是对方法的引用；因此，我们可以像调用方法一样简单调用它。当委托被调用时，所引用的方法会被相应的调用。\n\
  \n我们调用委托有两种方法：使用 `()` 运算符或使用委托的 `Invoke()` 方法。让我们通过一个示例来演示：\n\n```csharp\nDisplay\
  \ displayDel = DisplayNumber;\ndisplayDel.Invoke(5000);\n\n//或者\ndisplayDel(10000);\n\
  ```\n\n上面展示了我们调用委托的两种方法。\n\n## 将委托作为参数传递\n\n方法可以有一个委托类型的参数，并且它可以调用该委托参数。这是一个委托参数的示例：\n\
  \n```csharp\npublic static void DisplayHelper(Display delegateFunc, int numToDisplay)\n\
  {\n    delegateFunc(numToDisplay);\n}\n```\n\n在上面的示例中，`DisplayHelper` 函数有一个 `Display`\
  \ 类型的委托参数，并且通过下面的语句被作为函数调用了它：\n\n`delegateFunc(numToDisplay);`\n\n让我们再举一个例子，演示如何使用\
  \ `DisplayHelper` 方法和委托类型参数：\n\n```csharp\nusing System;\n\npublic class MyProgram\n\
  {\n    public delegate void Display(int num);\n\n    public static void Main()\n\
  \    {\n        DisplayHelper(DisplayNumber, 500);\n        DisplayHelper(DisplayMoney,\
  \ 200);\n    }\n\n    public static void DisplayHelper(Display delegateFunc, int\
  \ numToDisplay)\n    {\n        delegateFunc(numToDisplay);\n    }\n\n    public\
  \ static void DisplayNumber(int val)\n    {\n        Console.WriteLine(\"Number:\
  \ {0,-12:N0}\",val);\n    }\n\n    public static void DisplayMoney(int amount)\n\
  \    {\n        Console.WriteLine(\"Money: {0:C}\", amount);\n    }\n}\n```\n\n\
  代码将返回以下输出：\n\n![](img/00097.jpg)\n\n## 多路委托\n\n委托可以指向多个函数。任何指向多个函数的委托被称为多路委托（multicast\
  \ delegate）。使用 `+` 运算符向委托添加函数，并使用 `-` 运算符移除函数。考虑下面的示例：\n\n```csharp\nusing System;\n\
  \npublic class MyProgram\n{\n    public delegate void Display(int num);\n\n    public\
  \ static void Main()\n    {\n        Display displayDel = DisplayNumber;\n     \
  \   displayDel += DisplayMoney;\n        displayDel(1000);\n\n        displayDel\
  \ -= DisplayMoney;\n        displayDel(500);\n    }\n\n    public static void DisplayNumber(int\
  \ x)\n    {\n        Console.WriteLine(\"Number: {0,-12:N0}\",x);\n    }\n\n   \
  \ public static void DisplayMoney(int amount)\n    {\n        Console.WriteLine(\"\
  Money: {0:C}\", amount);\n    }\n}\n```\n\n## 第 20 章：C# 中的多线程\n\n线程定义了控制流。线程是操作系统分配的基本单元。单个进程被称为单线程，一次只能执行一个任务。为了同时执行多一个任务，会创建多个线程，这被称为多线程。\n\
  \n### 线程的生命周期\n\n线程的生命周期从创建 `System.Threading.Thread` 对象开始。任务一旦完成后生命周期结束。线程有多种状态：\n\
  \n- **未启动状态（Unstarted）**：当创建 `Thread` 时，线程进入未启动状态。\n- **就绪状态（Ready）**：在程序调用 `Start()`\
  \ 方法之前，线程处于此状态。\n- **不可运行状态（Not Runnable）**：某些元素会导致线程不可运行，包括：\n    - 等待（Waiting）：调用\
  \ `Wait()` 方法使线程等待某种条件的满足。\n    - 阻塞（Blocked）：线程被 I/O 操作阻塞。\n    - 睡眠（Sleeping）：调用\
  \ `Sleep()` 方法让线程进入睡眠模式。\n- **死亡状态（Dead）**：一旦线程完成执行或被中止，它将进入死亡状态。\n\n### 主线程\n\n\
  在处理线程时，我们使用 `System.Threading.Thread` 类。主线程在程序启动时就会创建。使用 `Thread` 类创建的线程被称为子线程。用户可以通过\
  \ `Thread` 类的 `CurrentThread` 属性访问主线程。\n\n示例：\n\n```csharp\nusing System;\nnamespace\
  \ thread {\n    class MainThread {\n        static void Main(string[] args) {\n\
  \            Thread t1 = new Thread();\n            t1.Name = \"Thread1\";\n   \
  \         Console.WriteLine(\"Thread is:{0}\",t1.Name);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n编译并执行代码后，输出为：\n\nThread is: Thread1\n\n### Thread 类的属性和方法\n\
  \n- **IsAlive**：显示当前线程执行状态的值。\n- **CurrentThread**：获取当前运行的线程。\n- **CurrentContext**：获取线程执行的当前上下文。\n\
  - **ExecutionContext**：`ExecutionContext` 对象包含有关上下文的信息。\n- **Name**：获取或设置线程名称。\n\
  - **ThreadState**：包含当前线程状态的值。\n\n\n\n\n\n- `Priority`: 获取或设置显示线程调度优先级的值\n\n### 方法\n\
  \n- `public static void BeginThreadAffinity()`: 宿主机即将执行依赖于当前物理操作系统线程的指令。\n- `public\
  \ void Abort()`: 在调用它的线程中抛出 `ThreadAbortException`。\n- `public void interrupt()`:\
  \ 中断处于 `WaitSleepJoin` 状态的线程。\n- `public static AppDomain GetDomain()`: 返回一个唯一的域标识符。\n\
  - `public static void MemoryBarrier()`: 处理器执行当前线程。指令不能被重排序。\n- `public void Start()`:\
  \ 启动线程。\n- `public static bool Yield()`: 让调用线程让出执行权，给另一个在处理器上准备就绪运行的线程。\n\n### 创建和管理线程\n\
  \n扩展线程类创建一个线程。扩展线程类调用 `Start()` 方法来启动子线程执行。\n\n#### 示例：\n\n```csharp\nusing System;\n\
  using System.Threading;\nnamespace MultipleThread{\n    class ThreadProgram {\n\
  \        public static void CallChild() {\n            Console.WriteLine(\"Start\
  \ child thread\");\n        }\n        static void Main(string[] args) {\n     \
  \       ThreadStart child1 = new ThreadStart(CallChild);\n            Console.WriteLine(\"\
  Creating child thread\");\n            Thread child2 = new Thread(child1);\n   \
  \         child2.Start();\n            Console.Read();\n        }\n    }\n}\n```\n\
  \n编译并执行代码后，输出为：\n```\nStart child thread\nCreating child thread\n```\n\n### 管理线程\n\
  \n当需要暂停线程一段时间以便另一个线程执行时，使用了 `Thread.Sleep()` 方法。该方法接受一个参数，以毫秒为单位的时间。\n\n#### 示例：\n\
  \n```csharp\nusing System;\nusing System.Threading;\nnamespace Multithreaded{\n\
  \    class Program {\n        public static void ChildThread() {\n            Console.WriteLine(\"\
  Start child thread\");\n            int sleeptime = 4000;\n            Console.WriteLine(\"\
  Thread sleeping for {0} seconds\", sleeptime / 1000);\n            Thread.Sleep(sleeptime);\n\
  \            Console.WriteLine(\"Resume child thread\");\n        }\n        public\
  \ static void Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
  \            Console.WriteLine(\"child thread created\");\n            Thread child1\
  \ = new Thread(t1);\n            child1.Start();\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n编译并执行代码后，输出为：\n```\nStart child thread\nThread sleeping\
  \ for 4 seconds\nResume child thread\nchild thread created\n```\n\n### 销毁线程\n\n\
  使用 `Thread.Abort()` 方法销毁线程。当线程被销毁时，会抛出 `ThreadAbortException`。该异常不会被捕获，会被发送到 `finally`\
  \ 块。\n\n#### 示例：\n\n```csharp\nusing System;\nusing System.Threading;\nnamespace\
  \ ThreadDemo{\n    class Program {\n        public static void ChildThread() {\n\
  \            try {\n                Console.WriteLine(\"Child Thread started\");\n\
  \                for(int j = 0; j <= 10; j++) {\n                    Thread.Sleep(1000);\n\
  \                    Console.WriteLine(\"Child thread finished\");\n           \
  \     }\n            } catch(ThreadAbortException e) {\n                Console.WriteLine(\"\
  Exception caught\");\n            } finally {\n                Console.WriteLine(\"\
  Exception is not handled\");\n            }\n        }\n        public static void\
  \ Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n       \
  \     Console.WriteLine(\"Creating child thread\");\n            Thread t2 = new\
  \ Thread(t1);\n            t1.Start(); // main thread stopped\n            Thread.Sleep(200);\
  \ // child aborted\n            Console.WriteLine(\"Aborting child thread\");\n\
  \            t2.Abort();\n            Console.Read();\n        }\n    }\n}\n```\n\
  \n输出为：\n```\nCreating child thread\nChild Thread started\nAborting child thread\n\
  Exception caught\nException is not handled\n```\n\n### 第 2 章：事件\n\n事件是预期会发生的事情。在\
  \ C# 中，事件是用户操作（如点击、按下、移动）或系统生成的通知等发生的情况。应用程序在事件发生后应该做出响应。中断的发生就是一个很好的例子。事件被用于促进进程间的通信。\n\
  \n事件在类中声明，并通过同一个类中或另一个类中的委托与事件处理程序关联。带有事件的类用于发布事件，这被称为发布者类（Publisher）。接受事件的类被称为订阅者类（Subscriber）。这意味着事件依赖于发布者-订阅者模型。发布者是同时定义了事件和委托的对象。事件与委托之间的关联在该对象中定义。发布者对象调用事件，随后事件会通知其他对象。订阅者是接受事件并提供事件处理程序的对象。发布者类有一个委托，可以调用订阅者类的（事件处理程序）。\n\
  \n#### 事件声明\n\n为了在类内部声明事件，你应该先为该事件声明一个委托类型。在此之后，你就可以使用 `event` 关键字声明事件。这里有一个示例：\n\
  \n```csharp\npublic delegate void myEvent();\npublic event myEvent;\n```\n\n因此，我们使用了\
  \ `event` 关键字使其成为一个事件。这是一个完整的示例：\n\n```csharp\nusing System;\n\npublic class DisplayHelper\n\
  {\n    // 声明委托\n    public delegate void BeforeDisplay();\n    // 声明事件\n    public\
  \ event BeforeDisplay beforeDisplayEvent;\n\n    public DisplayHelper()\n    {\n\
  \    }\n    \n    public event DisplayDisplay;\n\n    public void DisplayNumber(int\
  \ x)\n    {\n        // 在显示前调用委托\n        if (beforeDisplayEvent != null)\n    \
  \        beforeDisplayEvent();\n        Console.WriteLine(\"Number: {0,-12:N0}\"\
  , x);\n    }\n\n    public void PrintDecimal(int dec)\n    {\n        if (beforeDisplayEvent\
  \ != null)\n            beforeDisplayEvent();\n        Console.WriteLine(\"Decimal:\
  \ {0:G}\", dec);\n    }\n\n    public void DisplayMoney(int amount)\n    {\n   \
  \     if (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n     \
  \   Console.WriteLine(\"Money: {0:C}\", amount);\n    }\n\n    public void DisplayTemperature(int\
  \ x)\n    {\n        if (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n\
  \        Console.WriteLine(\"Temperature: {0,4:N1} F\", x);\n    }\n\n    public\
  \ void DisplayHexadecimal(int dec)\n    {\n        if (beforeDisplayEvent != null)\n\
  \            beforeDisplayEvent();\n        Console.WriteLine(\"Hexadecimal: {0:X}\"\
  , dec);\n    }\n}\n```\n\n`DisplayHelper` 是负责发布 `beforeDisplay` 事件的发布者类。在每个显示方法中，它首先检查\
  \ `beforeDisplayEvent` 是否为空，然后调用 `beforeDisplayEvent()` 方法。\n\n我们现在需要创建一个订阅者。考虑下面的类：\n\
  \n```csharp\nusing System;\n\npublic class MyProgram\n{\n    public static void\
  \ Main()\n    {\n        NumberClass nc = new NumberClass(200);\n        nc.DisplayMoney();\n\
  \        nc.DisplayNumber();\n    }\n}\n\nclass NumberClass\n{\n    private DisplayHelper\
  \ _displayHelper;\n    public NumberClass(int x)\n    {\n        _value = x;\n \
  \       _displayHelper = new DisplayHelper();\n        // 订阅 beforeDisplay 事件\n\
  \        _displayHelper.beforeDisplayEvent += displayHelper_beforeDisplayEvent;\n\
  \    }\n\n    // beforedisplayevent 处理程序\n    void displayHelper_beforeDisplayEvent()\n\
  \    {\n        Console.WriteLine(\"BeforeDisplayEventHandler: DisplayHelper will\
  \ print a value\");\n    }\n\n    private int _value;\n    public int Value\n  \
  \  {\n        get { return _value; }\n        set { _value = value; }\n    }\n\n\
  \    public void DisplayMoney()\n    {\n        _displayHelper.DisplayMoney(_value);\n\
  \    }\n\n    public void DisplayNumber()\n    {\n        _displayHelper.DisplayNumber(_value);\n\
  \    }\n}\n```\n\n\n\n\n```csharp\n    public delegate void BeforeDisplay();\n\n\
  \    //declare an event of type delegate\n    public event BeforeDisplay beforeDisplayEvent;\n\
  \n    public DisplayHelper()\n    {\n    }\n\n    public void DisplayNumber(int\
  \ y)\n    {\n        //call a delegate method before printing\n        if (beforeDisplayEvent\
  \ != null)\n            beforeDisplayEvent();\n        Console.WriteLine(\"Number:\
  \ {0,-12:N0}\", y);\n    }\n\n    public void DisplayDecimal(int dec)\n    {\n \
  \       if (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n   \
  \     Console.WriteLine(\"Decimal: {0:G}\", dec);\n    }\n\n    public void DisplayMoney(int\
  \ amount)\n    {\n        if (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n\
  \        Console.WriteLine(\"Money: {0:C}\", amount);\n    }\n\n    public void\
  \ DisplayTemperature(int y)\n    {\n        if (beforeDisplayEvent != null)\n  \
  \          beforeDisplayEvent();\n        Console.WriteLine(\"Temperature: {0,4:N1}\
  \ F\", y);\n    }\n\n    public void DisplayHexadecimal(int dc)\n    {\n       \
  \ if (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n        Console.WriteLine(\"\
  Hexadecimal: {0:X}\", dc);\n    }\n}\n```\n\n代码返回以下结果：\n\n![](img/00015.jpg)\n\n\
  所有订阅者都必须有一个处理函数，该函数将在发布者引发事件后被调用。\n\n# 第 22 章：提示与重要资源\n\n尽管我相信，如果你遵循本书的步骤操作，你将在短时间内非常深入且牢固地掌握\
