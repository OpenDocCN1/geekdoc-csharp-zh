  (Images/0143.jpg)\n\n### 封装与成员函数\n\n类的成员函数简单来说就是定义在类定义内部的函数，与其他函数的方式相同。此类函数可以在其所属的类的任何对象上进行操作，并且可以访问类的成员。成员函数简单来说就是对象的属性（从设计角度来看），它们被定义为\
  \ `private` 以实现封装的概念。我们只能通过 `public` 成员函数来访问此类变量。让我们演示一下如何在 `C#` 中设置和访问类的各种成员：\n\
