  \ 作用域\n\n变量的作用域决定它们在哪里可以被访问。在函数内部声明的变量具有局部作用域，而在函数外部声明的变量具有全局作用域。\n\n```javascript\n\
  let count = 0;\n\nfunction increment() {\n  count++;\n  console.log(count);\n}\n\
