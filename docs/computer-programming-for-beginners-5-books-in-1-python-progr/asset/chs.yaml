  \ 被引导加载程序占用，因此程序员仅有 `14kB` 可用）\n- SRAM：`1kB`\n- EEPROM：`0.5kB`\n- 处理速度：`8MHz`\n\
  - 数字引脚：`14 pins`\n- PWM 引脚：`6 pins`\n- 模拟输入：`6 pins`\n- 工作电压：`2.7-5V`\n- 输入电压：`2.7-5V`\n\
  \n## Lilypad Arduino Simple\n\n此微控制器板与 `Lilypad Arduino Main Board` 的区别在于它只有 `9`\
  \ 个输入输出引脚，适用于不需要那么多输入输出的简单项目。它比主板更强大，拥有双倍的闪存内存、`SRAM` 和 `EEPROM`。\n\n- 价格：$19.95\
  \ (可在 `SparkFun` 购买)\n- 闪存内存：`32kB`\n- SRAM：`2kB`\n- EEPROM：`1kB`\n- 处理速度：`8MHz`\n\
