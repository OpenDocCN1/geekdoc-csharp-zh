  \ <inheritdoc />\n/// <summary>\n/// 获取或设置一个指示 `<see cref=\"\"T:System.Collections.Generic.ICollection`1”\
  \ />` 是否为只读的值。\n/// </summary>\n/// <value>\n/// 如果 `<see cref=\"\"T:System.Collections.Generic.ICollection`1”\
  \ />` 是只读的，返回 `true`；否则返回 `false`。\n/// </value>\n/// <seealso cref=\"\"P:System.Collections.Generic.ICollection{T}.IsReadOnly”\
  \ />\n```csharp\npublic bool IsReadOnly => false;\n```\n\n---\n\n/// <summary> 查找排序插入的第一个索引。\
  \ </summary>\n/// <param name=\"list\"> 列表。此值不能为空。</param>\n/// <param name=\"comparer\"\
  > 比较器。此可以为空。</param>\n/// <param name=\"item\"> 项目。此可以为空。</param>\n/// <returns>\
  \ 找到的排序插入索引。 </returns>\n```csharp\npublic static int FindIndexForSortedInsert([NotNull]\
  \ List<T> list, [CanBeNull] Comparer<T> comparer, [CanBeNull] T item)\n{\n  if (list.Count\
  \ == 0)\n  {\n    return 0;\n  }\n  int lowerIndex = 0;\n  int upperIndex = list.Count\
  \ - 1;\n  int comparisonResult;\n  while (lowerIndex < upperIndex)\n  {\n    int\
  \ middleIndex = (lowerIndex + upperIndex) / 2;\n    T middle = list[middleIndex];\n\
  \    comparisonResult = comparer.Compare(middle, item);\n    if (comparisonResult\
  \ == 0)\n    {\n      return middleIndex;\n    }\n    if (comparisonResult > 0)\
  \ // middle > item\n    {\n      upperIndex = middleIndex - 1;\n    }\n    else\
  \ // middle < item\n    {\n      lowerIndex = middleIndex + 1;\n    }\n  }\n  //\
  \ 在此时，任何在‘middle’之后的项目都大于‘item’，\n  // 任何在‘middle’之前的项目都小于‘item’。\n  // 所以我们要么将‘item’放在‘middle’之前，放在之后。\n\
  \  comparisonResult = comparer.Compare(list[lowerIndex], item);\n  if (comparisonResult\
  \ < 0) // middle < item\n  {\n    return lowerIndex + 1;\n  }\n  return lowerIndex;\n\
  }\n```\n\n## SortedFunctionStack\n\nSortedFunctionStack 是一个经过排序的 `FunctionStack`（`Function`\
  \ 对象的栈）。\n\n以下是 `SortedFunctionStack` 对象的代码：\n\n```csharp\npublic class SortedFunctionStack\
  \ : Function\n{\n  /// <summary> 函数名称。 </summary>\n  const string FUNCTION_NAME\
  \ = \"SortedFunctionStack\";\n\n  /// <summary> 所有层都以 Function 类的形式存储在这里。 </summary>\n\
  \  /// <value> 函数。</value>\n  public Function[] Functions { get; private set; }\n\
  \n  /// <inheritdoc />\n  /// <summary>\n  /// 初始化 KelpNet.Common.Functions.Container.FunctionStack\
  \ 类的新实例。\n  /// </summary>\n  /// <param name=\"functions\"> 函数。</param>\n  ///\
  \ <param name=\"name\"> (可选) 名字。</param>\n  /// <param name=\"inputNames\"> (可选)\
  \ 输入名称列表。</param>\n  /// <param name=\"outputNames\"> (可选) 输出名称列表。</param>\n  public\
  \ SortedFunctionStack([CanBeNull] Function[] functions, [CanBeNull] string name\
  \ = FUNCTION_NAME, [CanBeNull] string[] inputNames = null, [CanBeNull] string[]\
  \ outputNames = null) : base(name, inputNames, outputNames)\n  {\n    Functions\
  \ = functions;\n  }\n\n  /// <inheritdoc />\n  /// <summary>\n  /// 初始化 KelpNet.Common.Functions.Container.FunctionStack\
  \ 类的新实例。\n  /// </summary>\n  /// <param name=\"function\"> 函数。</param>\n  /// <param\
  \ name=\"name\"> (可选) 名字。</param>\n  /// <param name=\"inputNames\"> (可选) 输入名称列表。</param>\n\
  \  /// <param name=\"outputNames\"> (可选) 输出名称列表。</param>\n  public SortedFunctionStack([CanBeNull]\
  \ Function function, [CanBeNull] string name = FUNCTION_NAME, [CanBeNull] string[]\
  \ inputNames = null, [CanBeNull] string[] outputNames = null) : base(name, inputNames,\
  \ outputNames)\n  {\n    Functions = new[] { function };\n  }\n\n  /// <inheritdoc\
  \ />\n  /// <summary>\n  /// 初始化 KelpNet.Common.Functions.Container.FunctionStack\
  \ 类的新实例。\n  /// </summary>\n  /// <param name=\"functions\"> 函数。</param>\n  public\
  \ SortedFunctionStack([CanBeNull] Function[] functions) : base(FUNCTION_NAME)\n\
  \  {\n    Functions = new Function[] { };\n    Add(functions);\n  }\n\n  /// <summary>\n\
  \  /// 这不是高效的，因为假设它会被频繁使用。\n  /// </summary>\n  /// <param name=\"function\"> 包含函数的变长列表。</param>\n\
  \  public void Add([CanBeNull] Function[] function)\n  {\n    if (function != null\
  \ && function.Length > 0)\n    {\n      List<Function> functionList = new List<Function>();\n\
  \      if (Functions != null)\n      {\n        functionList.AddRange(Functions);\n\
  \      }\n      IEnumerable<Function> funcs = function.Where(t => t != null);\n\
  \      functionList.AddRange(funcs.ToArray());\n      Functions = functionList.ToArray();\n\
  \      InputNames = Functions[0]?.InputNames;\n      OutputNames = Functions[Functions.Length\
  \ - 1]?.OutputNames;\n    }\n  }\n\n  /// <summary> 压缩此对象。 </summary>\n  public\
  \ void Compress()\n  {\n    List<Function> functionList = new List<Function>(Functions);\n\
  \    // 压缩层\n    for (int i = 0; i < functionList.Count - 1; i++)\n    {\n     \
  \ if (functionList[i] is CompressibleFunction)\n      {\n        if (functionList[i\
  \ + 1] is CompressibleActivation)\n        {\n          ((CompressibleFunction)\
  \ functionList[i]).SetActivation((CompressibleActivation) functionList[i + 1]);\n\
  \          functionList.RemoveAt(i + 1);\n        }\n      }\n    }\n    Functions\
  \ = functionList.ToArray();\n  }\n\n  /// <inheritdoc />\n  /// <summary> 前向传播。\
  \ </summary>\n  /// <param name=\"xs\"> 包含 xs 的变长列表。</param>\n  /// <returns> NdArray[].\
  \ </returns>\n  /// <seealso cref=\"M:KelpNet.Common.Functions.Function.Forward(params\
  \ NdArray[])\" />\n  [CanBeNull]\n  public override NdArray[] Forward([CanBeNull]\
  \ params NdArray[] xs)\n  {\n    return Functions.Aggregate(xs, (current, t) =>\
  \ t.Forward(current));\n  }\n\n  /// <inheritdoc />\n  /// <summary> 反向传播。 </summary>\n\
  \  /// <param name=\"ys\"> 包含 ys 的变长列表。</param>\n  /// <seealso cref=\"M:KelpNet.Common.Functions.Function.Backward(params\
  \ NdArray[])\" />\n  public override void Backward([NotNull] params NdArray[] ys)\n\
  \  {\n    NdArray.Backward(ys[0]);\n  }\n\n  /// <inheritdoc />\n  /// <summary>\
  \ 权重更新过程。 </summary>\n  /// <seealso cref=\"M:KelpNet.Common.Functions.Function.Update()\"\
  \ />\n  public override void Update()\n  {\n  }\n}\n```\n\n\n\n\n\n```csharp\nforeach\
