  \            Std[i] = Math.Sqrt(Variance[i]);\n        // 计算结果\n        Xhat = new\
  \ Real[x.Length];\n        Real[] y = new Real[x.Length];\n        int dataSize\
  \ = 1;\n        for (int i = 0; i < x.Shape.Length; i++)\n            dataSize *=\
  \ x.Shape[i];\n        for (int batchCount = 0; batchCount < x.BatchCount; batchCount++)\n\
  \        {\n            for (int i = 0; i < ChannelSize; i++)\n            {\n \
  \               int index = batchCount * ChannelSize + i;\n                Xhat[index]\
  \ = (x.Data[index] - Mean[i]) / Std[i];\n                y[index] = Xhat[index]\
