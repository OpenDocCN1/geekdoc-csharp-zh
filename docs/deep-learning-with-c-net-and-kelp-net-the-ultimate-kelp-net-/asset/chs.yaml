  \ NdArray x)\n{\n  Real[] y = new Real[x.Data.Length];\n  for (int b = 0; b < x.BatchCount;\
  \ b++)\n  {\n    for (int i = 0; i < x.Length; i++)\n      y[i + b * x.Length] =\
  \ x.Data[i + b * x.Length] * _beta;\n    Real maxval = y[b * x.Length];\n    for\
  \ (int i = 1; i < x.Length; i++)\n    {\n      if (maxval < y[i + b * x.Length])\n\
  \        maxval = y[i + b * x.Length];\n    }\n    for (int i = 0; i < x.Length;\
  \ i++)\n      y[i + b * x.Length] = (maxval + Math.Log(1.0 + Math.Exp(-Math.Abs(x.Data[i\
  \ + b * x.Length] * _beta)))) * _betaInv;\n  }\n  return NdArray.Convert(y, x.Shape,\
