  \n### FunctionStack 导航\n展示了如何在 `FunctionStack` 中分别通过正向和反向导航每个函数。\n\n### 完整源代码\n\
  完整的源代码所示，你可以在 `Kelp.Net` 的 `Test22` 测试中找到这段代码：\n\n```python\nconst int TRAINING_EPOCHS\
  \ = 5;\nconst int N_UNITS = 100;\nconst string DOWNLOAD_URL = “https://raw.githubusercontent.com/wojzarem/lstm/master/data/\"\
  ;\nconst string TRAIN_FILE = “ptb.train.txt”;\nconst string TEST_FILE = “ptb.test.txt”;\n\
  public static void Run() {\n    RILogManager.Default?.SendDebug(“Building Vocabulary.”);\n\
  \    Vocabulary vocabulary = new Vocabulary();\n    string trainPath = InternetFileloader.Download(DOWNLOAD_URL\
  \ + TRAIN_FILE, TRAIN_FILE);\n    string testPath = InternetFileloader.Download(DOWNLOAD_URL\
  \ + TEST_FILE, TEST_FILE);\n    int[] trainData = vocabulary.LoadData(trainPath);\n\
  \    int[] testData = vocabulary.LoadData(testPath);\n    int nVocab = vocabulary.Length;\n\
  \    bool verbose = true;\n    RILogManager.Default?.SendDebug(“Network Initializing.”);\n\
  \    FunctionStack model = new FunctionStack(“Test22”,\n        new EmbedID(verbose,\
  \ nVocab, N_UNITS, name: “l1 EmbedID$),\n        new Linear(true, N_UNITS, N_UNITS,\
  \ name: “l2 Linear$),\n        new Tanh(“l2 Tanh$),\n        new Linear(true, N_UNITS,\
  \ nVocab, name: “l3 Linear$),\n        new Softmax(“l3 Softmax$)\n    );\n    model.SetOptimizer(new\
  \ Adam());\n    List<int> s = new List<int>();\n    RILogManager.Default?.SendDebug(“Train\
  \ Start.”);\n    SoftmaxCrossEntropy softmaxEntropy = new SoftmaxCrossEntropy();\n\
  \    for (int epoch = 0; epoch < TRAINING_EPOCHS; epoch++) {\n        for (int pos\
  \ = 0; pos < 1000; pos++) {\n            NdArray h = new NdArray(new Real[N_UNITS]);\n\
  \            int id = trainData[pos];\n            s.Add(id);\n            if (id\
  \ == vocabulary.EosID) {\n                Real accumloss = 0;\n                Stack<NdArray>\
  \ tmp = new Stack<NdArray>();\n                for (int i = 0; i < s.Count; i++)\
  \ {\n                    int tx = i == s.Count - 1 ? vocabulary.EosID : s[i + 1];\n\
  \                    //l1 EmbedID\n                    NdArray l1 = model.Functions[0].Forward(true,\
  \ h)[0];\n                    //l2 Linear\n                    NdArray l2 = model.Functions[1].Forward(true,\
  \ h)[0];\n                    //Add\n                    NdArray xK = l1 + l2;\n\
  \                    //l2 Tanh\n                    h = model.Functions[2].Forward(true,\
  \ xK)[0];\n                    //l3 Linear\n                    NdArray h2 = model.Functions[3].Forward(true,\
  \ h)[0];\n                    Real loss = softmaxEntropy.Evaluate(true, h2, tx);\n\
  \                    tmp.Push(h2);\n                    accumloss += loss;\n   \
  \                 RILogManager.Default?.ViewerSendWatch(“Local Loss”, loss);\n \
  \                   RILogManager.Default?.ViewerSendWatch(“Total Loss”, accumloss);\n\
  \                }\n                for (int i = 0; i < s.Count; i++) {\n      \
  \              model.Backward(true, tmp.Pop());\n                }\n           \
  \     model.Update();\n                s.Clear();\n            }\n            if\
  \ (pos % 100 == 0) {\n                RILogManager.Default?.SendDebug(pos + “/”\
  \ + trainData.Length + “ finished”);\n            }\n        }\n    }\n}\n```\n\n\
  ```python\nRILogManager.Default?.SendDebug(“Test Start.”);\nReal sum = 0;\nint wnum\
  \ = 0;\nList<int> ts = new List<int>();\nbool unkWord = false;\nfor (int pos = 0;\
  \ pos < 1000; pos++) {\n    int id = testData[pos];\n    ts.Add(id);\n    if (id\
  \ > trainData.Length) {\n        unkWord = true;\n    }\n    if (id == vocabulary.EosID)\
  \ {\n        if (!unkWord) {\n            RILogManager.Default?.ViewerSendWatch(“pos”,\
  \ pos);\n            RILogManager.Default?.ViewerSendWatch(“tsLen”, ts.Count);\n\
