  \ OpenCL\n\n### OpenCL 层次结构\n\n# 第一章\n\n# 拿起这个 ___ 并 ___ 它\n\n尽管我们是第一次见面，但我可以猜出你脑海中用来填这个句子空白的两个词。这怎么可能呢？不仅如此，我敢定不仅仅是你和我选择了同样的两个词。我们中很可能很多人都是这样做的。这怎么可能呢？\n\
  \n\n\n他们口中出的第一个词是 `R` 和 `Python`。老板缓慢地点头表示同意。他认为，如果不让地球上的每个人都批准请求，他甚至无法从支持团队那里获得最新版本的\
  \ `Visual Studio`，而现在我们突然就要切换编程语言了？\n\n数据科学团队完成了他们的演示，当天的会议就结束了。大家像往常那样面面相觑，然后我们走出了办公室。我的大脑现在正处于另一个平行宇宙，许多问题在脑海中盘旋。我在心里想着：\n\
  \n1. 我的老板想使用机器学习来解决问题，但显然，我们没有一个项目是有真正良好的问题定义的。\n2. 我的老板以及其他高层管理人员都被告知了深度学习是多么简单又重要。我们不能让竞争对手超过我们。“这仅仅是海量数据、云技术和代码的结合，”他说道。在我的公司世界里，向外部所有者请求即使是最少的数据都是多么困难，而现在我需要的是从多个所有者那里获取如山如积的数据？希望他和和其他人理解，要正确完成这项工作，我们需要花费大量的时间来定位、清洗和准备数据，以便它们对这个项目有用，而这还只是在编写代码之前！首先，是要从每个数据孤岛的所有者那里获得访问权限。\n\
  3. 一旦我真的获得了公司存储了 15 年的 75 PB 数据的数据的访问，我到底该如何把它们塞进这台 IT 支持部门给我的、糟糕的二手机笔记本电脑里？`2 GB\
  \ RAM` 是 10 年前的标准，但不确定机器学习的目标是否能运行得这么顺利。我会有大量的时间开始喝咖啡！\n4. 我尝试让我们的数据科学家团队知道为什么我们可能需要考虑一些替代方案，但显然，这些解释完全是充耳于耳，因为他们都有博士学位！\n\
  5. 我们的模型在完善过程中会失败、也将失败，这是我们让事物运行起来的迭代过程的一部分。当我们面对“为什么*它*会失败”并试图向高层管理解释*它*时，这将会很有趣！我本希望新的数据科学团队能帮我向我的老板解释为什么模型失败是过程的一部分，但他们坚持要求我们用\
  \ `R` 或 `Python` 重写一切，因为那才是真正的深度学习项目使用的工具。\n\n如果这听起来像你开发工作中的一天（全部或部分），那么欢迎加入我们！这个短故事是为了说明当我们把东西从学术界引入并在企业界变得“符合流行术语规范”时会发生的一些情况。现实世界的软件开发与学术界在所遇到的问题以及日常执行方式上相差许多光年，特别是涉及到机器学习和深度学习时。我们大多数人都向往学术界的纯净世界，甚至是研发领域。对于我们大多数人来说，一进门戴上消防帽就开始了。\n\
  \n我很高兴向你们介绍两个非常强大且灵活的工具：`Kelp.Net` 和 `ReflectInsight`。我将向你们展示一个优秀的框架，它为 `C# .Net`\
  \ 开发者提供了动力和活性，同时在连接企业界和学术界方面表现出色。我将向你们展示如何使用这些软件，并提供关于机器学习和深度学习的高级概述，帮助你们能够与那个新的数据科学家团队进行有意义的对话。对于那些软件是否能满足需求的人，由于\
  \ `Kelp.Net` 是开源的，让我告诉你，你和你的团队将完全控制对它进行定制，以处理你可能遇到的任何情况。\n\n## 本书目标\n\n![](img/p004-001.jpg)\n\
  \n在书中，我们将讨论你，作为一名 `C# developer`，如何将惊奇且强大的深度学习技术添加到你的应用程序中。我们将通过介绍名为 `Kelp.Net`\
  \ 的强大、灵活且可扩展的开源软件包来实现。我们还将介绍 `ReflectInsight`，这是一个极其强大、灵活且健壮的日志框架，它在调试你的机器学习模型和过程时将证明是无价之宝。\n\
  \n**INFO**: `Kelp.Net` – 原自 Twitter 日文版：`https://twitter.com/harujoh`\n\n**Matt\
  \ R. Cole 翻译英文版**\n\n**ReflectInsight – ReflectSoftware**\n\n虽然 `ReflectInsight`\
  \ 不是开源的，但它在重新定义实时日志方面增加的价值使其成为任何需要深度插桩和实时日志项目的易行选择。\n\n但也许比所有这一切更重要的是，你将拥有 `Kelp.Net`\
  \ 这样一个开源软件包，你可以对其进行增强和修饰，以创建具有极其强大功能的新且令人兴奋的版本。你还将拥有一个极其强大的日志框架，这在调试你的模型和算法时具有至关重要的意义。对于这两者，我都创建了希望能成为你们的事实标准参考手册，供你们使用并帮助你们理解每个工具单独以及协作能提供什么。\n\
  \n我们将从关于神经网络、机器学习和深度学习的快速交流开始。我们将更多地讨论你熟悉的某些术语和概念，以及两者之间的一些相似与不同。由于我们的重点是深度学习，我们将对其放在极大关注。接下来，我们将讨论日志、日志的重要性以及\
  \ `ReflectInsight` 能为你提供什么。在所有这些准备就绪后，我们就可以开始深入研究 `Kelp.Net`，并讨论它的术语、含义以及如何使用它。在最后几个章节中，我们将讨论\
  \ `Kelp.Net` 深度学习模型、你如何训练和测试它们，以及你如何自己编写模型测试。\n\n让我们诚实面对深度学习现在是一个热潮，不是吗？它是企业界使用的一系列流行术语中的最新一个，并出现在各地的告示牌和广告中。每当我们搜索某些内容时，桌面上都会充斥着机器学习和\
  \ `AI` 的定向广告。曾经学术界内纯净的环境现在已经逃离并被企业界接纳。这确实带来了巨大的变化。幸运的是，由于我们对积累更多数据以实现深度学习领域新创新的日益增长且无法满足的渴望，这似乎每天都更有可能。我们获得的数据越多，就能从深度学习模型中学习得越多，并提高准确性和对知识的追求。\n\
  \n尽管我们都知道深度学习主题无处不在，但你是否停下来想过它到底意味着什么？深度学习真的能让你的生活变得简单吗，还是意味着更多工作？我会有更多时间在家里陪伴家人，让“机器”计算并为我解决问题吗？这项伟大的技术在未来几年会导致我的工作失效并让我失业吗？这些都是很好的问题，这本书的目标是帮助你回答这些以及更多问题（好吧，不是失业那个，让我们只希望它永远不会发生！）。\n\
  \n\n\n\n机器学习和深度学习在许多领域都能帮助改善我们的日常生活。对于你们中可能没有任何深度学习相关经验或教育背景的人，或者那些想要快速复习的人，我们将在本书的开头花几分钟时间回顾一些基础知识，这些知识在之后可能会有所帮助。这些知识将为未来的某些讨论奠定基础。如果你已经精通了这些内容，请尽管翻阅书中你最感兴趣的部分。无论如何，请确保我们在术语上达成共识，因为这将有助于消除后期的困惑。\n\
  \n从一开始，我想让我对本书的方法明确地向大家阐述一点。虽然我们将为你提供一些关于机器学习和深度学习的基本概念和信息，但我的首要目标是教你如何使用 `Kelp.Net`\
  \ 和 `ReflectInsight` 框架为你的应用程序添加机器学习和深度学习功能。本书并不是为了作为深度学习的参考资料或终极指南；市面上已经有太多此类资源了。这是一次更专注于技术的应用，旨在让你感到兴奋并开始为深度学习世界做出贡献。我希望我整理了你在任何地方都能找到的最详尽的软件参考资料，并为你提供了一个我专门为本书制作的更新版本\
  \ `Kelp.Net`。我的目标是让你接触到在应用程序中使用这项技术的一种直观且强大的方法，同时赋予你对其进行润色并让世界为你为你脚下的能力！\n\n让我们通过说明几个定义开始我们的旅程：\n\
  \n**机器学习**：“任何解析数据、从数据中学习，然后将所学知识应用于对该数据做出明智决策的算法。”\n\n**深度学习**：“任何利用多个一个隐藏层来完成任务的机器学习算法或任务，其目标是在最少监督的情况下发现数据中的寻找模式。”\n\
  \n**神经网络**：“一个神经网络，在最简单的形式下是由若干个简单但高度互连的元素组成的系统；其中每个元素都根据其对外部输入的响应来处理信息。”\n\n##\
  \ 神经网络概述\n\n神经网络是一种模仿人类大脑和神经系统建模的计算机系统。这种建模是基于我们对大脑、神经系统以及它们如何相互作用的有限知识。让我在这里强调一下*有限*（limited）这个词。考虑到我们现在对大脑的知识仍然非常有限，多年来我们已经取得了惊人的进步。因此，所讨论的很多内容可能会、有时也会随着时间的推移而改变。毫无疑问！从本书写作到你现在阅读的期间，将会获得巨大的知识。我们学习，我们改进（希望如此），我们学习更多，并一直如此。请对这个话题保持开放的心，正如许多“思想领袖”不断完善我们的前行道路一样。\n\
  \n你是否曾停下来花时间思考，为什么人类能如此轻松地完成某些事情，而计算机需要海量的硬件和数据却仍然无法做对？对我来说，这种轻松感是我们下一代深度学习和神经网络开发的关键。人类人类似乎已经知道了某些事情，而不需要所有那些海量的数据和知识？难道我们大脑的某些（我们的内部神经网络）已经预设了信息，可以在未来的引用中轻松访问吗？这些信息是存储在记忆的意识或潜意识部分，还是如果它们根本不在记忆中，我们又是如何在极短时间内完成实现结果所需的所有计算的？或者，镜像神经元和标准神经元掌握着解锁下一代深度学习和神经网络的钥匙？我们将继续问自己所有这些好问题。\n\
  \n让我们暂时偏离一下话题（你难道不很高兴我现在就把这个“离题”的话说出来，而不是在书的后面再提吗？）看一眼下面这一串手写数字：\n\n![](img/p007-001.jpg)\n\
  \n大多数人都会认出这些是数字，而且毫不费力。你可能会说，这非常直接。小时候，我们被教导如何识别数字，无论是集体地还是单独地，以及如何识别它们。在过去的某个地方，我们大脑经过了海量数据集的训练，我们现在将使用这些数据来快速、准确地识别上述数字。这些信息作为记忆存储在我们的潜意识系统中，以便进行闪速检索。\n\
  \n人类的大脑中有视觉皮层，其中包含数百万个神经元。这些神经元每一个都激发了数十亿次连接。还要记住，我们在不同的脑球中有几个视觉皮层，所以如果你将其视为一条连接的超级公路，我们原始的大脑力真的是不可思议的。在这些元素互连的某处，就包含了我们在屏幕上看到五个数字的知识。我们现在的目标是通过计算机人工实现这一点，就像我们自己做得一样快速且准确。我们才（相对）刚刚进入深度学习时代，并将其扩展到使用单层神经元之外，为了实现我们的目标，我们还需要走多远？在某些方面，我们取得了惊人的进步，但在另一些，如果我们的目标是真正镜像人类大脑的功能，我们还有很长的路要走。\n\
  \n所以，回到神经元和存储记忆几秒钟。难道我们大脑中的神经元已经适应了百年甚至更久并经过性能调优吗？我们现在才学到所有这些巨大的知识，还是我们根据人类几个世纪以来学到的信息以此继承了它们？是我们自己学习或继承了这些信息，还是从某种遗传机制获得了部分或全部？我们的大脑是否预填充了人类多年获得和处理的记忆和信号？很多问题，有些有答案，有些没有。\n\
  \n\n\n\n让我们继续讨论数字，并聊聊神经网络如何处理这类问题。其想法是获取大量的手写数字样本，每个数字都有多个样本，且每个样本的写写都略有不同。这个大样本被称为我们的`training`（训练）示例，看起来可能如下：\n\
  \n![](img/p009-001.jpg)\n\n从这个样本集中，我们需要开发一种能够从训练示例中学习的算法。通过增加提供给算法的训练示例数量，算法可以学习更多关于手写字的知识，并提高其结论的准确性。这是神经网络的一个高层示例，而该示例的实现就是机器学习。\n\
  \n## 机器学习概述\n\n![](img/p009-002.jpg)\n\n毫无疑问，当今社会是“热词合规型”的。我们所到之处到处都是热词，机器学习和深度学习也不例外。让我们尝试为这些术语下一些定义，以便在讨论每一个术语时明确我们的意图。\n\
  \n机器学习（ML）是这个被称为`人工智能`的巨大且广泛类别的一个子领域。机器学习赋予机器随着时间推移提高性能的能力，而无需人类的直接干预或帮助。目前大多数机器学习的应用都利用了所谓的`监督学习`。\n\
  \n当我们实现机器学习时，我们会向计算机展示成千上万个关于`things`（事物）的示例，并展示每个示例的含义或如何被`labeled`（标记）。这反过来正确地教会了计算机如何解决我们的问题。例如，利用历史欺诈数据，我们可以训练算法从非欺诈活动中识别出欺诈活动。一旦机器学会了如何正确分类案例，我们就可以部署该模型供未来使用。\n\
  \n机器学习的其他用途可以广泛归类为`无监督学习`或`强化学习`。在无监督学习中，没有用于训练机器判断什么是正确的标签或输出。机器被训练为能够正确识别隐藏的模式或片段。另一方面，强化学习侧重于一个不断学习的系统，该系统通过在给定约束条件下满足最终目标来激励算法。\n\
  \n## 深度学习概述\n\n![](img/p010-001.jpg)\n\n从实践来说，深度学习是机器学习的子集，而机器学习又是人工智能的子集；这就是为什么这些术语被互换使用。深度学习是机器学习，但具有不同的能力。深度学习通常比其他类型的算法具有更多的学习`layers`（层），这些层被称为`hidden\
  \ layers`（隐藏层）。\n\n机器学习通常需要某种形式的引导，特别是当它返回不准确的预测时。这时就需要人干预并进行正确的调整。但对于深度学习，通常算法本身就可以判断预测是否准确。\n\
  \n让我们花点时间关注深度学习。你可能会问自己，深度学习是如何工作的。首先，在不谈论数据，我们就无法谈论深度学习。为了让深度学习算法有效，必须有大量数据供其使用。数据越多越好。事实上，如果你没有足够的数据，你的深度学习努力很可能是徒劳的或是不准确的。我们拥有的数据越多，能分析和从中学习的就越多。\n\
  \n如果你能想象一下一枚运载卫星进入轨道的火箭，那么火箭引擎就是我们的深度学习模型，而存储在机载和助推器中的大量燃料就是我们提供给算法的海量数据。\n\n深度学习过程将依赖这些数据的可用性，并对其进行持续分析，试图根据该分析得出结论。该过程通过使用一组“分层”的算法来“学习”，这些算法通常被称为人工神经网络，而层本身被称为`hidden\
  \ layers`（隐藏层）。这种网络的设计灵感源于人脑，它是地球上最先进的人工神经网络（在我们所知的范围内！这种配置和能力使得深度学习系统在容量方面优于标准的机器学习模型。\n\
  \n你可能听过深度学习的一个绝佳例子是著名的 Google AlphaGo 项目。Google 创建了这个计算机程序来下围棋，围棋以需要非常敏锐的智力和直觉而闻名。通过与其他围棋手对弈，AlphaGo\
  \ 的深度学习模型学会了从人工智能角度看过的最高水平下法，而且它是在没有被告知何时执行任何特定移动的情况下做到的。以下是 AlphaGo 的截图，显示了它为下一步移动计算的百分比示例：\n\
  \n![](img/p012-001.jpg)\n\n围棋游戏\n\n## 复杂度\n\n如果不涉及复杂度主题，任何关于机器和深度学习的讨论都是不。这涉及到数据的“过拟合”，我们将在第\
  \ 3 章中详细介绍。所以，让我们聊聊模型复杂度。\n\n在你的数据中，你拥有“features”（特征），你可以将其想象为数据库或电子表格中的列。在某些深度学习模型中，你拥有许多、许多特征。在某些情况下，你拥有的特征数量可能比能够包含示例的数据还要多。如果你指定或使用所有可用特征，你的算法将开始记忆数据中的所有内容，包括随机噪声、错误和可能并非真正重要的特性。\n\
  \n当这种记忆发生时，你会感到很高兴，因为你产生了一种幻觉，认为你的算法运行得完美，因为从初看之下，它与数据的拟合非常好。一旦你将算法应用于测试数据，你就会注意到问题了。\n\
  \n我们将在`第 3 章，使用 ReflectInsight 进行深度检测`中更多地讨论如何解决复杂度。现在，我们只需要知道，由于你的数据集拥有成千万个特征，你很可能不会使用所有特征，或者你会花费大量时间处理过拟合问题。\n\
  \n## 机器学习与深度学习的区别\n\n让我们花点时间讨论机器学习和深度学习之间的一些区别。虽然机器学习模型在它们的功能上不断进步，但事实是它们仍然可能需要一些引导。如果机器学习算法预测错误，通常需要有人介入。然而，对于深度学习，算法本身的设计使其能够自行判断预测是否准确，而无需任何外部帮助或干预。\n\
  \n所以，事实上，我们这里拥有的层次结构是：深度学习是机器学习的子集，而机器学习是更广泛的人工智能类别的子集。\n\n以下是机器学习和深度学习之间应该强调的一些区别：\n\
  \n| | 机器学习 | 深度学习 |\n| --- | --- | --- |\n| 工作原理 | 使用自动算法，通过提供的数据预测未来决策并建模函数。 |\
  \ 使用神经网络解释数据中的特征及其关系，数据通过算法的多个层传递。 |\n| 干预 | 算法通常需要人工干预来检查不同的变量和数据集特征。 | 算法数据分析不需要人工干预。\
  \ |\n| 数据点 | 数百到几千个。 | 可达百万级。 |\n\n\n\n\n| 输出 | 一个数值，例如得分或分类。 | 可能是任何内容吗？ |\n| :---\
  \ | :--- | :--- |\n| 硬件 | 对硬件容量的需求比深度学习少。 | 需要 GPU 等高端硬件能力才能发挥最佳性能。 |\n| | 机器学习\
  \ | 深度学习 |\n| 特征提取 | 需要识别识别特征。 | 将尝试从数据中的模式中确定特征。 |\n| 训练时间 | 训练时间较短。 | 训练时间较长。\
  \ |\n\n让我们回顾一下：\n\n- 机器学习使用算法来解析数据、从数据中学习，然后根据所学内容做出明智决策。\n- 深度学习是机器学习的一个子集。它通过分层组织算法来创建人工神经网络，这种网络可以在没有任何外部干预的情况下，通过发现提供数据中的模式来学习并做出智能决策。\n\
  - 深度学习使用海量数据进行学习。随着我们收集的数据量惊人的增长，我们希望在不久的将来，深度学习能够提供新的机会和创新。\n\n## 总结\n\n在本章中，我们讨论了关于神经网络、机器学习和深度学习的一些基本概念。我们讨论了许多在本书后续部分将会看到的术语。我们还强调了机器学习和深度学习之间的一些区别。\n\
  \n现在，让我们继续讨论在深度学习框架中记录日志的重要性。通过我们的日志方法（使用 `ReflectInsight`），你将能够快速发现应用程序内部发生了什么。坐好你们的帽子！！！\n\
  \n# 第 2 章：机器学习/深度学习术语与概念\n\n### 概述\n\n在本章中，我们将简要回顾在讨论神经网络、机器学习和深度学习时会遇到的一些术语和概念。先告诉你们，一旦我们习惯了使用\
  \ `Kelp.Net`，我会尽力让你们免受这些内容的困扰，但底层理论、术语和概念对每个人来说都是重要的。任何人都可以学会使用工具包、框架或 API。也要通过学习底层的运行机制来让自己脱颖而出吧！正如下面的图像所示，神经网络中有很多大量工作，尽管它看起来有些杂乱，但这张图是一个极好的抽象视图，可以解释相关的术语和定义：\n\
  \n![](img/p016-001.jpg)\n\n如果你已经熟悉了本节中所有的术语和概念，或者只想直接进入软件部分，请随时跳到后续章节。本章中的信息并不是按重要顺序呈现的。即使你已经是该主题的专家，浏览一下这些章节以确保我们使用的是相同的定义可能对你有帮助。\n\
  \n*感谢 @EVOLVE Deep Learning Studio (Matt R. Cole)*\n\n让我们从讨论图像中所有的正方框开始：神经元和感知器。\n\
  \n## 神经元/感知器\n\n**注意：** 就本书而言，`neuron` 和 `perceptrons` 这两个术语是互换使用的。\n\n让我首先说一下，在神经网络开始的时代，使用的是\
  \ `perceptron` 这个术语。随着神经网络和计算神经科学的发展，`neuron` 在神经网络的讨论中取代了 `perceptron`，因为它更了模型了人类大脑。\n\
  \n就像神经元构成了我们大脑的基本元素一样，神经元构成了神经网络的基本结构。神经元接收输入，对其进行处理，然后生成输出，该输出被发送到其他神经元进行进一步处理，或者本身成为最终输出。下面的图像描述了一个具有三个输入和一个输出的简单神经元：\n\
  \n![](img/p017-001.jpg)\n\n如前的图像所示，我们的神经元有三个输入：`x1`、`x2` 和 `x3`。输出是通过引入所谓的 `weights`（权重）计算的，权重是表示相应输入对输出重要性的实数。`w1`\
  \ 是示例所示的额外权重：\n\n![](img/p017-002.jpg)\n\n神经元的输出取决于加权和是否小于或大于某个阈值。与权重一样，阈值是一个实数，是神经元的一个参数。\n\
  \n把神经元想象成这样：它是一个通过权衡数据来做出决策的设备。第一层的神经元通过简单权衡提供的输入数据来做出非常简单的决策。第二层的神经元通过权衡第一层决策的结果来做出决策。通过这种方式，第二层的神经元可以在比第一层神经元更复杂、更抽象层层决策。第三层的神经元可以做出更复杂的决策，以此此类推。通过这种方式，多层神经元网络可以进行非常复杂的决策。\n\
  \n我们还可以设计学习算法，能够自动调整人工神经元网络的权重和偏置（biases）。这种调整是响应外部刺激发生的，不需要程序员的直接干预。这些学习算法使我们能够完全不同于传统\
  \ `logic gates`（逻辑门）的方式使用人工神经元。我们的神经网络不需要显式地布置 `NAND` 和其他门的电路，而是简单地学习解决问题；有时这些问题直接设计传统电路是极其困难的。我们稍后将看到一个旨在复制基本\
  \ `XOR`（异或）功能的测试。\n\n## 多层感知器 (MLP)\n\n单个神经元在能够执行的任务的复杂性上是有限制的。因此，我们需要利用神经元的 `stacks`（堆）或\
  \ `groups`（组）来分析更多数据并镜像更复杂的过程。在这种类网络的最简单形式中，我们可以有一个输入层、隐藏层和一个输出层。每层都有多个神经元，每层中的所有神经元都连接到下一层的神经元。这些网络也被称为\
  \ `fully connected`（全连接）网络。下图展示了多层感知器的示例：\n\n![](img/p018-001.jpg)\n\n### 特征\n\n\
  你需要经常处理的问题之一是特征，即你所使用的数据集的不同特征。对我们来说，收集和识别这些特征非常重要。如果特征太少，我们的数据可能不足以获得我们所需的结果。特征过多也会产生问题。重要的是，我们不能向网络输入关于数据集的所有信息。我们对想要使用的特征及其原因必须谨慎且具有选择性。特征处理和选择本身是一门学科，有其自己的最佳实践。\n\
  \n涉及特征选择时，正确的领域知识是必须的。你必须理解问题领域，以知道什么是、是不重要的。此外，我们不希望整个特征集呈现在我们的模型中。由于以下原因，较少的特征是理想的：\n\
  \n- 降低模型的复杂度。\n- 速度更快且更具效益。\n- 简单的模型更容易理解和解释。\n- 使机器学习算法训练速度更快。\n- 如果选择了正确的子集，可以提高模型的准确性。\n\
  - 减少过拟合。\n\n### 权重\n\n**提个醒：你不应该在与训练集不同的数据集上进行特征选择（这是一个大忌；这会在你的模型中引入偏差）。**\n\n\n\
  \n\n当一个输入进入神经元时，它会被一个所谓的权重因子（weight factor）相乘。该权重因子的取值范围取决于它的用途。权重的数量应该与神经元的输入数量相等。在下面的图中，有三个输入，因此我们将为它分配三个权重。权重是随机初始化的，并在模型训练过程中进行更新。训练完成后，神经网络会为其认为最重要的输入分配更高的权重。权重为零则表示该特征不重要，不应在下游层中考虑。\n\
  \n让我们来看下面这个例子。假设输入为 `x1`，与之相关的权重为 `w1`，如图所示。在通过节点后，输入现在变为如下的 `x1*w1`：\n\n![](img/p019-001.jpg)\n\
  \n### 偏置 (Bias)\n\n除了权重之外，应用于输入的另一个组件称为偏置（如下所示的 `b1`）。偏置被加到我们刚刚讨论的权重相乘的结果上，并提供给输入。偏置基本上是为了改变权重相乘输入的范围。在给图所示的神经元中加上偏置后，结果将看起来像\
  \ `x1*w1+b1`：\n\n![](img/p019-002.jpg)\n\n### 激活函数 (Activation Function)\n\n一旦将权重和偏置应用于神经输入，就会应用一个非线性函数。这是通过对输入、权重和偏置的组合应用所谓的激活函数来实现的。在下面的流程图中，你可以直观地看到激活函数在神经元处理方向上的位置。这张图实际上展示了神经元完整处理层看起来是什么样的：\n\
  \n![](img/p020-001.jpg)\n\n简而言之，激活函数将输入信号转换为输出信号。在应用上述神经元所示的激活函数后，第一层的输出将看起来类似于\
  \ `f(x1*w1+b1)`，其中 `f()` 是激活函数本身。\n\n在接下来的图中，我们有两个输入 `X1` 和 `X2`，对应的权重 `W1` 和 `W2`，以及偏置为\
  \ `b`。权重与其对应的输入相乘，然后与偏置相加。一旦应用了激活函数，我们就得到了神经元的最终输出：\n\n![](img/p020-002.jpg)\n\n\
  你可能会遇到很多激活函数。我们将在本节中介绍三种最常用的激活函数。它们的重要性没有特定的先后顺序：\n\n* Sigmoid\n* ReLU\n* Softmax\n\
  \n### Sigmoid\n\nSigmoid 变换生成一个 0 到 1（包含边界）之间的平滑数值范围。平滑的曲线允许我们观察由于输入的微小变化引起的输出变化。权重和偏置的微小变化会导致输出的微小变化。仅此此原因，Sigmoid\
  \ 函数比阶跃函数更受欢迎。下面的图显示了 sigmoid 函数的图图：\n\n![](img/p021-001.jpg)\n\n### ReLU (修正线性单元)\n\
  \n`修正线性单元`激活函数（`ReLU`）比 sigmoid 更受青睐。当我们进入*样本*（Samples）章节时，你将在 Kelp.Net 中看到很多这种用法。使用\
  \ `ReLU` 的主要优点是对于所有大于 0 的输入，它都有常数导数值。常数导数有助于网络训练得更快，随着网络变得越来越大复杂，这具有巨大的价值。在我们测试模型的章节中，你会发现我们的许多深度学习网络都在使用\
  \ `ReLU` 单元。下面的图显示了 `ReLU` 单元绘图后的样子：\n\n![](img/p021-002.jpg)\n\n### Softmax\n\n\
  Softmax 激活函数通常用于输出层，主要用于分类问题。它与 sigmoid 函数类似；唯一的区别是输出被归一化为和为 1。在多分类分类问题中，Softmax\
  \ 可以非常容易地为每个类别分配值，这些值随后可以很容易地解释为概率。\n\n让我们来看一个例子，以便更容易理解。假设我们需要从一组训练过的数字中识别出数字 4。这个数字根据其写法，也可能看起来像图所示的数字\
  \ `7` 或 `9`：\n\n![](img/P022-001.jpg)\n\n函数将根据概率顺序，为它认为匹配该数字的每个数字桶（bucket）分配概率值。一旦完成，数字桶就会如下所示。你可以看到，大多数人的共识是该数字是\
  \ `4`：\n\n![](img/P022-002.jpg)\n\n### 神经网络 (Neural network)\n\n神经网络构深度学习的骨干。从形式上，神经网络的目标是寻找未知函数的近似。神经网络由一系列相互连接的神经元组成。如果你还记得我们在上面章节中讨论的内容，这些神经元具有权重和偏置，它们会在网络训练期间根据误差进行更新。激活函数对权重-偏置的计算进行变换，然后生成最终输出。激活神经元的组合产生了输出。\n\
  \n神经网络的最好的定义之一归于杨立平（Liping Yang），这里值得引用：\n\n>“神经网络由许多相互连接的概念化人工神经元组成，它们之间相互传递数据，并具有关联权重，这些权重根据网络的‘经验’进行调优。神经元具有激活阈值，如果其关联权重和传入的数据满足了阈值，它们就会触发；神经元的组合导致了学习。”\n\
  \n在我们讨论了神经元和神经网络之后，我想在这里花一点时间与大脑进行对比。你看，神经（或人工）网络的整个目的就是模拟我们对大脑的认知。虽然这一领域的生物组件（科学）取得了进展，计算组件（`RNNs`、`GANs`、`GRUs`）以及各种形式的神经网络也在进步。对我来说，神经网络的生物组件非常重要。对于其他人来说，算法的进步可能比确保其符合大脑的工作方式更为重要。我们还必须诚实地说，尽管我们在大脑方面的知识库有所增加，但仍有许多需要学习的内容。\n\
  \n让我们考虑所示的大脑神经元：\n\n![](img/P023-001.jpg)\n\n它由以下三个部分组成：\n\n* 树突 (Dendrites)：这是神经网络的输入层。树突是树状结构，通过`突触连接`接收输入。这种输入可以是感官输入，也可以是计算输入。我们知道单个神经元可以拥有多达\
  \ 10 万个不同的输入，每个输入可以来自不同的神经元。\n* 细胞体 (Soma)：这是神经网络的隐藏层，计算在这里发生。来自树突的输入汇合，并根据所有信号决定是否触发输出（产生`spike`）。\n\
  * 轴突 (Axon)：这是我们的输出层。一旦决定输出信号并使细胞处于`激活`状态，轴突负责传输该信号。通过树状结构，它通过突触连接将信号传递给下一层神经元的树突。\n\
  \n\n\n因此，你可以看到，神经网络的设计已经具备了基本的神经学基础，但随着时间的推移，人们对算法组件的思考和强调已经超过了生物学组件。此外，通过对神经网络进行快速实验，我们学到的知识比对大脑进行生物学实验和尝试要多。只需问问任何开发者他们的重点在哪里，你就会明白我的观点。让我们来聊聊神经网络的生物部分与我们所知的脑神经元之间的区别。\n\
  \n首先，脑神经元的复杂性和鲁健性远比我们的计算神经元先进强大。与我们的神经网络相比，大脑拥有更多的神经元和树突连接。\n\n其次，我们对神经元的实现比大脑简单得多。尽管我们拥有出色的计算基础，但与大脑所能做的相比，我们所使用的参数、权重以及线性函数和激活函数非常基础且粗糙，而且这只是我们所了解的部分。\n\
  \n最后，脑神经元的整体网络架构比我们的神经网络复杂得多，特别是前馈网络、多层循环神经网络等。大脑中的神经元网络极其复杂，数以万计的树突在许多方向上跨越大脑的不同层次和区域。\n\
  \n在我看来，无监督学习和强化学习是人工智能的秘密武器。我们知道大脑通过无监督学习和强化学习进行学习，但目前的机器学习应用使用的是监督学习。我相信，这一领域的进展在未来几年将至关重要。\n\
  \n我们还有许多需要学习的东西，而且我们将学会。如果你看一本十年前写的关于神经网络的书并进行比较，你就会明白我在说什么。我怀疑在 10 年后，你也能通过这本书做到同样的事情。\n\
  \n### 输入/输出/隐藏层\n\n神经网络通过连接函数层来构建。神经网络中存在三种层。它们是：**输入层**，负责接收输入，本质上是网络的第一层；**输出层**负责生成输出，是网络的最后一层。位于其之间的处理层是网络中的**隐藏层**，这些层对输入数据执行特定任务，并将它们生成的输出传递给下一层。输入层和输出层是对我们可见的，而`hidden\
  \ layers`显然是不可见的：\n\n![](img/p025-001.jpg)\n\n### 前向传播\n\n正向传播是指输入数据通过隐藏层到达输出层的路径。在正向传播中，信息沿单方向传输，即仅“正向”（FORWARD）。输入层向隐藏层提供输入，然后从那里生成输出。数据没有向向运动。以下图说明了这一概念：\n\
  \n![](img/p025-002.jpg)\n\n在神经网络中，你通过正向传播获取模型的输出，并将其与真实值比较以获得`error`（误差）。\n\n###\
  \ 反向传播\n\n当我们定义神经网络时，会为节点分配随机权重和偏置值。一旦我们收到单次迭代的输出，就可以将实际值与预期值进行比较并推导出误差。然后，该误差沿着代价函数的梯度传回网络，以更新网络的权重。这些权重随后会被更新，从而减少后续迭代中的误差。这种使用代价函数梯度更新权重的过程被称为反向传播。\n\
  \n在反向传播中，网络的移动是“反向的”（BACKWARDS），从输出到输入。误差连同梯度从输出层通过隐藏层回流，随后对权重进行更新，如下所示：\n\n![](img/p026-001.jpg)\n\
  \n当我们进行反向传播时，我们会回溯神经网络，寻找误差相对于权重的偏导数。这允许我们从权重中减去该值。导数随后可以被`gradient descent`（梯度下降）等过程用于迭代地最小化给定函数。结果是权重的调整（向上或向下），取决于哪种能减小误差：\n\
  \n![](img/p026-002.jpg)\n\n## 无免费午餐定理\n\n在机器学习中，有一个被称为“无免费午餐定理”（No Free Lunch theorem）的理论。该定理基本上说明，没有任何一个模型适用于所有问题。你对一个模型提出的假设可能并不适用于另一个模型，也可能根据你的数据而改变。最好且高度推荐的方法是尝试多个模型，以找到最适合你问题的模型。\n\
  \n无免费午餐定理是的，特别是在监督学习中。你需要评估许多具有不同复杂的模型的预测准确性，以找到最佳模型。\n\n最后，适用于某个问题的良好模型可以通过多种算法训练并得出不同的结果。例如，线性回归可以通过正规方程或梯度下降进行训练。这在我们稍后的`Learning\
  \ Rate`（学习率）章节中会变得非常明显。\n\n### 维度灾难\n\n维度灾难是一种现象，随着变量数量的增加，变量集的可能配置呈指数级增长。当维度过高时，我们在解决问题时就会遇到困难。\n\
  \n## 更多神经元对比更多层\n\n这是一个一直有趣的话题。增加另一层与增加现有层中的神经元数量有什么区别呢？增加更多层基本上允许你的网络学习它以前无法学习的函数（增加复杂性）。在现有层中添加更多神经元意味着我们可以进行更好的近似。\n\
  \n### 代价函数\n\n当我们构建网络时，网络试图让预测的输出尽可能接近真实值。我们使用所谓的`cost/loss`函数（代价/损失函数）来衡量网络的这种准确性。`cost`函数（也称为`loss`函数）试图在网络犯错时对其进行惩罚。代价函数告诉我们算法处理优化问题的效果如何。你需要记住的是，代价函数基本上用于监控每个训练示例的误差。还有一种被称为代价函数的导数。对于单个权重，导数告诉我们我们需要如何移动该权重，以便最小化该特定训练示例的误差。\n\
  \n我们在运行网络时的目标是提高预测准确性并减少误差，因此最小化代价函数。最优的输出是代价或损失函数值最小的一个。学习过程围绕最小化代价展开。\n\n在机器学习中，重点是从数据中学习。算法通过学习事物来帮助减少错误。例如，当我们小时候，我们总是被教什么是对错什么是坏。这通常通过父母告诉我们不要做某事、在我们做不该做的事时惩罚（负面奖励），或者在我的情况下，两者兼备来实现！这种做法希望通过告诉我们不要做什么，让我们学会应该做什么。\n\
  \n\n\n\n举一个简单的例子，假设我们有一个坐在地板上玩玩具的小孩子。孩子看到一个电源插座，并伸手想把玩具插进插座里。幸运的是，孩子很快被他的父母制住了，并被他们这这是危险的，不应该再次这样做。如果那个父母不在身边，孩子把东西放进了那个插座，他/她就会受到电击，这类似于“负强化”，让他/她知道不应该再次那样做。我们可以想一下《巴特·辛普森》（Bart\
  \ Simpson）的动画片，他在里面不断地重复对插座的那个动作；他的学习能力或意愿远低于我们希望算法能达到的水平！\n\n通过经验和反馈，孩子希望能够学习到良好和糟糕的行为。在这个例子中，电源插座充当了代价函数（cost\
  \ function）的作用；它帮助孩子学习纠正或改变自己的行为，以使错误最小化。在机器学习中，代价函数被用来估计模型相对于其估计 `a` 与 `b`（或者如果你愿意，也可以是\
  \ `X` 和 `Y`）之间关系的能力有多糟糕。这种估计通常表示为预测值与实际值之间的差异（有时是距离）。代价通过迭代运行模型，并将估计的预测值与所谓的“地面真值”（ground\
  \ truth）——即 `b`（或 `Y`）的已知良好值进行比较来确定的。\n\n代价函数有时也被称为 `loss` 或 `error`。\n\n**我们可以说，机器学习模型的目标是找到使代价函数最小化的参数（或权重）。**\n\
  \n以下是一些代价函数的图表示例：\n\n![](img/p029-001.jpg)\n\n### 梯度下降\n\n现在我们已经知道了 `cost`（代价）是什么，我们可以问自己，可以做什么来帮助我们的模型最小化代价？梯度下降就是其中之一。梯度下降是一种用于最小化代价非常流行的算法。给定由一组参数定义的函数，梯度下降从一组初始参数值开始，迭代地向使函数最小化的参数值集合移动。向下走阶梯就是梯度下降。我的意思是这样的：\n\
  \n想象我们正站在一座陡峭的山丘或山顶，准备向下走。我们的起点是随机分配的。我们的目标是到达底部的一个特定点，那个点恰好是全局最低点。我们不希望在最低点之前就停止，也不希望走太远（过冲）导致最后又走回山上。同时，我们不希望走得太快而过了底部目标点，也不希望走得太慢花费永远的时间到达那里。我们需要以某种方式优化我们的步幅，使其具有正确的增量和正确的方向，以便我们安全地下山，并能够用最优步数停在我们想要停留的地方。我们迈步多大被称为学习率（learning\
  \ rate），我们接下来将详细介绍。\n\n因此，如果我们从一个点 `x` 开始，我们将向下移动一点（我们称其为 `delta h`），并将我们的位置更新为\
  \ `x-delta h`。我们将不断重复这一过程，直到到达底部。将底部视为最小代价点，这就是我们的目标。下面的图显示了梯度下降的过程，以及算法可能到达的不同优解（蓝色圆圈）。在第一张图中，我们正确地到达了目标点，没有过冲，也没有走得太慢导致永远无法到达：\n\
  \n![](img/p030-001.jpg)\n\n在第二张图中，我们到达了目标点，但正如你所看到的，这比我们的学习率（下文讨论）最优时花费的步骤多得多。这比最优情况慢得多，花费的步骤也多得多：\n\
  \n![](img/p030-002.jpg)\n\n在最后一张图中，我们通往目标的旅程到处乱章，完全没有采取最优路径。对我们来说步数太多了；我们会精疲力竭，并花费永远的时间才能到达目的地：\n\
  \n![](img/p031-001.jpg)\n\n所以为了到达我们的最优目标，我们使用了初始权重来获得最优梯度。下面的图表为你直观展示了权重、梯度和代价的关系：\n\
  \n![](img/p031-002.jpg)\n\n最后，这里是一些突出显示学习率以及它们如何影响下降的图表。第一张图使用了低学习率。如如下图像所示，下降时间非常长，需要很多时间才能到达我们的极值点。\n\
  \n![](img/p032-001.jpg)\n\n我们的下一张图使用了一个恰当的学习率。`Just Right`（恰好）意味着下降到局部极值的过程既不快也不慢，并且恰好结束在我们需要所在的地方。\n\
  \n![](img/p032-002.jpg)\n\n我们的最后一张图像显示了使用过高学习率进行的下降。如下图像所示，我们正迈着疯狂的步子到达极值点，这比预期的要长得多。\n\
  \n![](img/p033-001.jpg)\n\n### 学习率\n\n学习率被定义为每次迭代中代价函数最小化的程度。简单来说，我们向代价函数极值点下降的速率就是学习率。在选择学习率时我们必须非常小心。学习率过大可能导致我们错过最优解。相反，学习率太小可能导致花费永远的时间才能达到最优状态。\n\
  \n我们在进行深度学习项目时面临的问题之一是选择学习率优化器（即超参数）。如果你像我一样，你会发现自己一直在猜想优化器和学习率，然后检查它们是否有效，结果发现大多数时候它们并不起作用。然而，我们的测试为我们带来了一些可以利用的宝贵见解：\n\
  \n*   对于每个优化器，大多数学习率都无法训练模型。\n*   每个优化器都有一个山谷形状：学习率太低不会进展，学习率太高会导致不稳定且无法收敛，而在之间，有一段恰当的学习率带。这些是我们需要寻找的：\n\
  \n*   没有一个适用于所有优化器的单一学习率。\n*   学习率会对训练时间产生一个数量级的影响。\n\n有了这些信息，我们可以说我们对 .Net 中现有的优化器有了了解（它们存在是有原因的！）：\n\
  \n*   除了 `RMSProp` 之外，所有优化器都能在合理时间内收敛。\n*   `Adam` 通常学习最快。\n*   `Adam` 比其他优化器更稳定，且没有出现任何大精度的下降。\n\
  *   `RMSProp` 可能是自动超参数搜索的良好用例，以确定除默认衰减率 `0.9`、epsilon `1e-10` 和动量 `0.0` 之外的最优参数。\n\
  *   通常（我这里的通常），`Adam` 是我们的最佳选择，但在给定模型和数据集可能表现不佳。\n\n坚持使用 `Adam` 作为我们的测试优化器，让我们看看关于学习率获得的一些见解。再次，我必须强调，这可能会根据所使用的模型和数据集而异。我们通过实验消除了数据集的问题：\n\
  \n*   `0.0005`、`0.001` 和 `0.00146` 的学习率表现最好。这似乎是该优化器的一个甜点区间。\n\n\n\n\n- 每种学习率的训练时间随模型大小呈线性增长。当我们稍后进入大规模深层神经网络时，你会看到这一点。\n\
  - 学习率的性能并不依赖于模型大小；在 1 倍大小下表现最好的相同学习率，在 10 倍大小下也表现最好。\n- 在 0.001 以上，增加学习率会增加训练时间，并增加训练时间的方差（与模型大小的线性函数相比）。\n\
  - 对于具有 `n` 个权重、固定成本 `c` 和学习常数 `k = f(learning rate)` 的模型，训练时间可以大致建模为 `c + kn`。\n\
  \n![](img/p035-001.jpg)\n\n上述图表显示，在较小训练集上表现最好的简单模型，在较大的训练集上其表现会逊更复杂的模型所拟越。当然，你需要足够的数据来驱动这些模型，而学习曲线可以作为一个指标，让你知道是否拥有足够的数据。它们可以帮助你决定是否需要收集更多数据，或者你的模型是否已经从现有数据中学习了它们能学会的所有内容。\n\
  \n### 批次/批大小 (Batches/Batch size)\n\n在训练神经网络时，我们不是一次性发送整个输入，而是将输入随机分成若干等大小的块。与一次性将整个数据集输入网络相比，在\
  \ `batches`（批次）中训练数据会让模型更具泛化性。批大小（batch size）是单个批次中训练示例的总数。\n\n### 轮次 (Epochs)\n\
  \n一个 epoch 定义为所有批次在前向传播和反向传播中的单次训练迭代。这意味着一个 epoch 是整个输入数据的单次前向和反向通过。\n\n在定义将使用的\
  \ epoch 数量时，你必须进行一些考虑。很有可能使用的 epoch 越多，准确率就越高。同样，增加 epoch 的数量会导致网络收敛时间增加。最后，要小心\
  \ epoch 数量增加可能导致网络过拟合。\n\n### 迭代 (Iterations)\n\n迭代是指完成一个 epoch 所需的次数数量。\n\n###\
  \ 丢弃 (Dropout)\n\nDropout 是一种防止网络过拟合的正则化技术。顾顾名，在训练期间，隐藏层中的某些神经元会被随机丢弃。这意味着训练是在神经网络的几种架构上针对不同的神经元组合进行的。你可以将\
  \ dropout 视为一种集成技术，其中多个网络的输出随后被用于产生最终输出。\n\nDropout 通过对每个输入的随机子集进行掩码（将其置零）来作用于神经网络层，概率为\
  \ `p`，并将其余输出按 `1/(1 - p)` 向上缩放。Dropout 通常在训练期间使用。掩码防止了梯度通过被掩码的输出进行反向传播。因此，该方法选择神经网络的随机子集对任何示例进行训练。这可以被认为训练一个模型集合来解决任务，其中单个模型共享参数：\n\
  \n![](img/p036-001.jpg)\n\n### 批归一化 (Batch Normalization)\n\n`Batch normalization`（批归一化）通过将层输出归一化为运行均值和方差起。这加速了训练并提高了模型的最终性能。运行统计数据在测试时是固定的。为了增加神经网络的稳定性，`batch\
  \ normalization` 通过减去批均值并除以批标准差来归一化前一个激活层的输出。发生这种情况，下一层的权重就不再是最新的。如果随机梯度下降能够最小化损失函数，就会撤销这种归一化。因此，批归一化过程需要在每层添加两个可训练的参数。这样，归一化的输出就可以乘以标准差（`gamma`）和均值（`beta`）。在这方面，随机梯度下降通过改变每个激活的\
  \ `gamma` 和 `beta` 权重来执行去归一化。这有助于防止由于所有权重变化导致的网络稳定性丢失：\n\n![](img/p037-001.jpg)\n\
  \n## CNN (卷积神经网络 - Convolutional Neural Network)\n\n卷积神经网络与之前描述的普通神经网络非常相似，由具有可学习权重和偏置的神经元组成。每个神经元接收一些输入，执行点积，并可选地跟随着某种形式的非线性变换。区别在于\
  \ CNN 架构显式地假设输入是图像。这种假设允许我们把某些属性编码到架构本身中，使得前向函数的实现更高效，同时大幅减少了网络所需的参数数量。很酷，对吧？整个网络仍然表示单个可微的评分函数，它们在最后一层（全连接层）仍然有一个损失函数（例如，SVM/\
  \ Softmax）。我们为学习普通神经网络开发的各种提示/技巧仍然适用。\n\nCNN 是层的序列，每一层都通过所谓的可微函数将一个激活体转换为另一个。我们使用三种主要的层来构建\
  \ CNN 架构：\n\n- 卷积层\n- 池化层\n- 全连接层（如普通神经网络所示）\n\n这些层堆叠形成完整的 CNN 架构。\n\n![](img/p038-001.jpg)\n\
  \n卷积神经网络通常用于图像数据。假设我们有一个大小为 (28*28*3) 的输入图像。如果我们使用普通的神经网络，将会有 2352 个参数 (28*28*3)。随着图像尺寸增大，参数数量也会增加。为了减少参数数量，我们对图像进行卷积。当滤波器在输入的宽度和高度上滑动时，我们将产生一个二维激活图，给出该滤波器在每个位置的输出。我们将这些激活图沿深度维度堆叠并产生输出体。\n\
  \n总结来说，\n\n- CNN 架构最简单的形式是层的列表，将图像体转换为输出体（例如持有类别分数）。\n- 有几种不同类型的层（例如，CONV/FC/RELU/POOL\
  \ 最受欢迎）。\n- 每个层接受一个输入 3D 体，并通过可微函数将其转换为输出 3D 体。\n- 每个层可能有也可能没有参数（例如，CONV/FC 有，RELU\
  \ 没有）。\n- 每个层可能有也可能没有额外的超参数（例如，CONV/FC/POOL 有，RELU 没有）。\n\n### 池化 (Pooling)\n\n\
  CNN（之前提到的）通常具有池化层。池化层基本上总结了卷积层中局部神经元的活动。本质上，池化层接受卷积层的输出作为输入，并对其进行下采样。池化层由池化单元组成，这些单元在拓扑上排列并与同一组的局部输出连接。每个池化单元然后计算该区域输出的某些函数。\n\
  \n一种常用方法是在卷积层之间定期引入池化层。这基本上是为了减少多个参数并防止过拟合。池池化类型是滤波器大小为 2x2 的池化层，使用 MAX 操作。这将提取图像每个\
  \ 4x4 矩阵的最大值。请注意，虽然 MAX 操作在实践中显示效果更好，但并没有阻止你使用其他池化操作，如 AVG 等：\n\n![](img/p039-001.jpg)\n\
  \n### 填充 (Padding)\n\n\n\n\n填充（Padding）指的是在图像上添加额外的零层，使得输出图像与输入图像的大小相同。这也被称为 `sample\
  \ padding`（样本填充）。下图是相同的一种示例：\n\n![](img/p040-001.jpg)\n\n在应用过滤器后，卷积层的大小与实际图像相同。有效填充（Valid\
  \ padding）是指保留图像并保留图像中所有实际或有效的像素。在这种情况下，应用过滤器后，输出的长度和宽度会在每个卷积层中不断减少。\n\n### 循环神经元\
  \ (Recurrent neuron)\n\n![](img/p040-002.jpg)\n\n循环神经元是指其输出会被传回（重复）`t` 个时间步的神经元。这种神经元的基本优势是它能提供更具泛化的输出。以下是循环神经元工作的基本概述：\n\
  \n| 1. | 向网络提供单个输入时间步 (`xt`)。 |\n| 2. | 接下来，我们使用当前输入和之前状态的组合 (`ht`) 来计算其当前状态。 |\n\
  | 3. | 当前的 `ht` 变为下一个时间步的 `ht-1`。 |\n| 4. | 我们根据问题的需要执行许多时间步，并结合所有之前状态的信息。 |\n|\
  \ 5. | 一旦完成所有时间步，最终当前状态将用于计算输出 (`yt`)。 |\n| 6. | 然后将输出与实际输出进行比较并产生误差。 |\n| 7. |\
  \ 然后将误差反向传播到网络以更新权重，并训练网络。 |\n\n### RNN (循环神经网络)\n\n![](img/p041-001.jpg)\n\n循环神经网络主要用于序列数据，其中上一个输出被用于预测下一个输出。在这种情况下，网络内部存在循环。隐藏神经元内部的循环使其能够存储一段时间关于之前词的信息，以便预测输出：\n\
  \n![](img/p042-001.jpg)\n\n隐藏层的输出会再次发送到隐藏层，持续 `t` 个时间步。循环神经元的输出只有在完成所有时间步后才会发送到下一层。发送的输出更具泛化性，且之前的信息保留的时间更长。然后根据展开的网络进行反向传播以更新权重。这被称为随时间反向传播\
  \ (`back-propagation through time`，`BPTT`）。\n\n### 梯度消失问题 (Vanishing gradient problem)\n\
  \n梯度消失问题出现在激活函数的梯度非常小的情况下。在反向传播过程中，当权重与这些低梯度相乘时，它们往往随着深入网络深处而变得非常小并消失。这在循环神经网络中通常是一个问题，因为长期依赖对于网络记忆非常重要。这可以通过等方法解决：\n\
  \n* 漏点激活函数，如 `ReLU`\n* 带有结构化丢弃的 Hessian 自由优化器\n* 梯度消失正则化\n* 长短期记忆 (Long short-term\
  \ memory)\n* 门控循环单元 (Gated recurrent unit)\n* 正交初始化\n\n### 梯度爆炸问题 (Exploding gradient\
  \ problem)\n\n这与上述描述的梯度消失问题完全相反。在梯度爆炸问题的情况下，激活函数的梯度太大。在反向传播过程中，它使得一个节点相对于其他节点的权重很高，因此导致它们变得微不足道。可以通过等方法轻松解决：\n\
  \n* 裁剪梯度使其不超过特定值\n* 截断随时间反向传播 (`Truncated Backpropagation Through Time`，`TBPTT`)\n\
  * 对循环权重施加 L1 和 L2 惩罚\n* 教师强制 (Teacher forcing)\n* 回声状态网络\n\n### 逻辑神经元 (Logistic\
  \ Neurons)\n\n`logistic neuron`（也称为 `Sigmoid Neuron`）的设计是为了解决独特的目的。它与普通神经元相似，不同在于它经过修改，权重和偏置的微小变化只会导致输出的微小变化。这使得逻辑神经元网络能够学习。让我们更详细地讨论一下，以理解为什么我们需要这样做。让我们从下图所示的普通神经元开始：\n\
  \n![](img/p043-001.jpg)\n\n就像普通神经元一样，sigmoid 神经元有输入 `x1`、`x2` 和 `x3`。但这些输入不仅取 0\
  \ 或 1 的值，还可以取 0 到 1 之间的任何值。这意味着诸如 0.44、0.4453、0.9 和 0.00032…0.03445 等值都是 sigmoid\
  \ 神经元的有效输入。同样，就像普通神经元一样，sigmoid 神经元对每个输入都有权重 `w1`、`w2` 和 `w3`，以及一个整体偏置 `b`。但输出不是\
  \ 0 或 1，而是 `(w∙x+b)`，其中称为 sigmoid 函数。\n\n通过使用实际的 sigmoid 函数，我们得到了一个平滑的神经元。事实上，事实是\
  \ sigmoid 函数的平滑性，而不是它的具体形式。sigmoid 函数的平滑性意味着权重和偏置的微变化将产生神经元输出的微小变化。\n\n### 隐藏层 (Hidden\
  \ layers)\n\n现在，如果我们增强一直在讨论的内容并将其转换为复杂的神经元网络，我们就可以对数据做出更明智、更复杂的决策。下图就是这样的架构：\n\n\
  ![](img/p045-001.jpg)\n\n输入和输出之间的圆是神经元，被称为 `hidden layers`（隐藏层）。它们是我们讨论深度学习的关键（更多内容请见\
  \ `第 4 章 Kelp.Net`）。我们的网络中可能有很多层，也可能只有几层。通常来说，现在任何多于一个隐藏层的网络都被大众认为是深度学习/信念网络。\n\n\
  ### 泛化 (Generalization)\n\n以下是目前已的一些神经网络类型：\n\n![](img/p046-001.jpg)\n\n经许可转载，版权所有\
  \ Asimov Institute (http://www.asimovinstitute.org/neural-network-zoo/)\n\n\n\n\n\
  \n泛化（Generalization）是指模型能够正确适应新的、此前未见过的数据的能力，这些数据与创建模型时使用的数据来自相同的分布。测试泛化是我们将原始数据集分为测试集和训练批次的原因之一。如果你的模型泛化良好，说明你的算法正在学习。如果不是，那么你可能进入了下文讨论的欠拟合和过拟合的残酷世界。目标是让模型在大多数情况下都有良好的泛化能力。这是一个迭代的过程，也是一种方法。记住，目标是获得一个能够准确预测未见数据标签的模型。这就是最简单形式的泛化。\n\
  \n### 正则化 (Regularization)\n\n正则化是指我们为了减少泛化误差（而非减少训练误差）而对算法可能进行的任何修改。正则化是一项重要的技术，其重要性与通用优化并驾。实现正则化的方法之一是在模型中添加一个名为“正则化项”（regularizer）的参数。该参数会被添加到代价函数中。可以使用许多类型的正则化项来实现这些目标。\n\
  \n让我们来看下面的图：\n\n![](img/p047-001.jpg)\n\n这张图展示了欠拟合（实线）和过拟合（曲线）。为了解决欠拟合，你通常可以从数据中添加额外的特征。为了解决过拟合，你有时可以减少特征的数量，或者使用正则化，这比尝试删除特征更容易且更有效。\n\
  \n### 损失 (Loss)\n\n对于神经网络来说，损失越小，模型就越好。损失是在训练数据和验证数据上计算的，其解释意义是模型在这两组数据上的表现如何。损失是训练集或验证集中每个示例所产生误差的总和。\n\
  \n学习模型的主要目标是通过通过不同的优化方法（例如神经网络中的反向传播）改变权重向量的值，从而减少（最小化）损失函数相对于模型参数的值。\n\n损失值意味着特定模型在每次优化迭代后的表现好坏。理想情况下，人们期望在每次或若干次迭代后损失都会有所降低。\n\
  \n模型的准确率通常在模型参数学习并固定且不再进行学习后确定。这时，将测试样本输入模型，并在与真实目标比较后记录模型所犯的错误数量。然后计算分类错误的的百分比。\n\
  \n### 随时间变化的损失 (Loss over time)\n\n训练过程中第一个有用的跟踪量是损失，因为它在正向传播期间是在单个批次上评估的。这里有一张图显示了随时间变化的损失可能是：\n\
  \n![](img/p048-001.jpg)\n\n### 损失与学习曲线 (Loss versus learning curve)\n\n这张图描述了损失曲线的不同形状，以及这些形状与学习率（之前介绍过）的关系：\n\
  \n![](img/p049-001.jpg)\n\n### 监督学习 (Supervised learning)\n\n这类机器学习模型用于根据提供给它的数据和指令预测结果。提供的指令是明确且详细的，或者至少应该是这样的，这就是为什么我们将其标记为`supervised`。\n\
  \n在监督学习中，我们基本上是在学习一个根据输入和输出对将输入映射到输出的函数。该函数是从被称为`labeled`的训练数据中推断出来的，这些数据具体告诉了函数它期望的内容。在监督学习中，始终存在输入和期望的输出值。更正式地说，这类算法使用一种名为归纳偏置（inductive\
  \ bias）的技术来实现此，这基本上意味着算法有一组假设，它将根据这些假设对于可能可能之前见过的输入来预测输出。\n\n在监督学习中，我们通常可以访问一组在\
  \ `n` 个观测上测量的 `x` 特征（`X1`, `X2`, `X3`, … `Xx`）以及同样在相同 `n` 个观测上测量的响应 `Y`。然后我们尝试使用\
  \ `X1`, `X2`, `X3`, … `Xn` 来预测 `Y`。\n\n监督学习的一些示例如下：\n\n* 支持向量机 (Support Vector Machines)\n\
  * 线性回归 (Linear regression)\n* 朴叶贝斯 (Naïve Bayes)\n* 基于树的方法 (Tree-based methods)\n\
  \n接下来，让我们简要讨论一下涉及监督学习需要学习的一些内容。它们没有特定的顺序：\n\n* 偏差-方差权衡 (Bias-Variance Trade-off)\n\
  * 数据量\n* 输入空间维度\n* 错误的输出值\n* 数据异质性\n\n## 偏差-方差权衡（过拟合与欠拟合）\n\n在讨论偏差-方差权衡之前，只有在我们确保你熟悉这些单独术语的情况下，讨论才有意义。\n\
  \n### 偏差 (Bias)\n\n偏差是指由于学习算法中的错误假设导致的误差。高偏差会导致所谓的欠拟合（underfitting），这是一种导致算法漏掉数据中相关的特征与输出层之间关系的现象。\n\
  \n### 方差 (Variance)\n\n相反，方差是对训练集中微小波动的敏感性误差。高方差会导致你的算法模拟随机噪声而非实际预期的输出，这种现象被称为过拟合（overfitting）。\n\
  \n### 过拟合 (Overfitting)\n\n“过拟合”一词指的是对训练数据建模过好的模型。模型并没有学习数据的通用分布，而是学习了每个数据点的预期输出：\n\
  \n![](img/p50-001.jpg)\n\n更具体地说，你的算法记住了数据并从中学习了太多东西，这类似于背下了考试答案。如果你在学校里背下了考试的答案，考虑一下如果有人改动了那场考试的几道题会发生什么后果？当你从训练集移动到测试集时，情况是相同的。在过拟合的情况下，你的算法可能会开始映射数据中不存在的形状和曲线。当你改变数据时，你的结果就会变得无常且不可预测。\n\
  \n每个机器学习开发者都需要理解偏差和方差之间的权衡。它与你数据的欠拟合和过拟合有直接相关性。我们说，如果一个学习算法在用于不同的训练集时预测出不同的输出结果，那么它对于输入具有高方差，这显然不是好事，也不是我们想要的。\n\
  \n具有`low bias`（低偏差）的机器学习算法必须足够灵活，以便拟合数据。如果设计的算法太灵活，每个训练和测试数据集的拟合情况都会不同，导致高方差。你的算法必须足够灵活，通过内在算法知识或可由用户调整的参数来平衡这种权衡。\n\
  \n### 你的模型是过拟合还是欠拟合？\n\n我们如何确定一个模型是过拟合还是欠拟合呢？答案是查看训练数据和评估数据中的预测误差。当模型在训练数据上的表现不佳时，我们的模型就是欠拟合。它无法达到足够低的误差值。这是因为模型无法捕捉输入与目标值之间的关系。\n\
  \n当我们看到模型在训练数据上表现良好但在测试数据上表现不佳时，我们的模型就是过拟合。这是由于模型记住了数据，因此它很难泛化到任何未见的数据。测试误差和训练误差之间的差距太大了。\n\
  \n\n\n\n\n性能不佳也可能是因为模型太简单，这意味着输入特征没有被充分表达。如果是如此，输入特征就无法很好地描述目标以进行分类。你这里的选择是添加新特征、增加\
  \ n-gram 大小等。或者，你也可以减少正在使用的正则化数量。\n\n如果模型过拟合了，你必须采取相反措施，即降低模型的灵活性。你可以通过使用更少的特征组合、减少\
  \ n-gram 大小、减少属性数量或增加使用的正则化数量来实现。\n\n最后，务要考虑增加训练数据量，或者在某些情况下，考虑增加对现有训练数据的迭代次数。性能不佳可能是由于学习算法没有足够的数据供学习。\n\
  \n这里是一些图，展示了可能发生的不同类型的拟合，以及它们在与数据对比绘图时的外观。中间的图片（理想拟合）是我们的目标目标：\n\n![](img/p052-001.jpg)\n\
  \n## 防止过拟合和欠拟合\n\n让我们再次回顾欠拟合和过拟合的预防措施，因为这对每个人的理解都非常重要。\n\n收集更多数据（如果可能）。这应该总是你的首选行动。为什么呢？因为你的模型只能存储有限的信息。这意味着你喂给它的训练数据越多，过拟合的可能性就越小。其原因是随着你添加更多数据，模型将无法拟合所有的样本，因此它被迫泛化以取得进展。收集更多数据还具有提高模型准确性的副作用：\n\
  \n![](img/p052-002.jpg)\n\n接下来，使用一种被称为正则化（regularization）的过程。`Regularization` 是一个通过限制模型学习来减少过拟合的过程。它可以采取许多不同的形式。正则化最强大且为人知的技术之一是向\
  \ `loss` 函数添加惩罚项。常见的惩罚项是 L1 (1) 和 L2 (2)，其中：\n\n* `L1` 惩罚旨在最小化权重的绝对值。\n* `L2` 惩罚旨在最小化权重的平方量级。\n\
  \n通过惩罚，模型被迫在权重上做出妥协，因为它不能再让这些权重任意变大。这使得模型更具通用性，有助于对抗过拟合。\n\n如果你有深度学习网络，我们尝试一些高级技术。这些技术被称为\
  \ `Drop Out`（丢弃）和 `DropConnect`（丢弃连接）。这些技术非常有效，并依赖于神经网络从一个层处理到下一层这一事实。其思想是在训练过程中随机禁用神经元（`DropOut`）或连接（`DropConnect`）。这迫使网络变成所谓的“冗余”，因为它不能再依赖特定的神经元或连接来提取特定的特征。一旦训练完成，所有神经元和连接将恢复到它们的原始位置。下面的图片展示了这将是什么样的：\n\
  \n![](img/p053-001.jpg)\n\n### 训练数据量\n\n正如我们反复所说的，拥有足够的数据来正确、完全地完成工作没有任何替代。这与你的学习算法的复杂性直接相关。一个具有高偏差和低方差的低复杂度算法可以从较少的数据中学习得更好。然而，如果我们的学习算法是复杂的（许多输入特征、参数等），那么你将需要一个大得训练集来实现低偏差和高方差的学习。你应该在项目的第一阶段确定你能够访问多少数据、数据位于何处、数据有多干净、是否有任何缺失数据，以及如果需要，可以从哪里获取更多数据。\n\
  \n### 输入空间维度\n\n在每个学习问题中，我们的输入都将以向量的形式存在。特征向量（即数据的特征）会极大地影响学习算法。如果输入特征向量非常大，即我们说的高维，那么即使你只需要这些特征中的几个，学习也会变得更加困难。有时，额外的维度会混淆你的学习算法，导致高方差。这反过来意味着你必须调整算法以获得更低的方差和更高的偏差。如果适用，从你的数据中移除额外特征有时是更容易的，从而提高学习函数的准确性。\n\
  \n尽管如此，一种被称为降维的技术可以通过几种机器学习算法完成，例如 `Principal Components Analysis`（`PCA` 成分分析）算法族。如果你需要，这些算法将识别并移除无关的特征。\n\
  \n### 错误的输出值\n\n我们必须自问的一个问题是，我们的机器学习算法的预期输出中存在多少误差。如果我们遇到这种情况，学习算法可能正试图过度完美地拟合数据，导致了我们之前提到的现象：过拟合。过拟合可能源于错误的数据或对于当前任务来说过于复杂的学习算法。如果发生了这种情况，我们需要调整算法，或者寻找一个能为我们提供更高偏差和更方方差的。错误的输出值是需要关注的，因为它们表明你的算法中出了问题。\n\
  \n### 数据异质性\n\n根据韦氏词典，异质性（Heterogeneity）意味着由不同或多样元素组成的质量或状态。对我们来说，这意味着特征向量包含了许多不同类型的特征。如果这适用于我们的应用，那么对任务应用不同的学习算法可能更好。某些学习算法还要求我们的数据缩放到特定范围内，例如\
  \ `[0 – 1]`、`[-1 – 1]` 等。当我们进入使用距离函数作为基础的学习算法时（例如最近邻和支持向量方法），你会发现它们对此异常敏感。另一方面，像基于树的算法（决策树等）可以很好地处理这种现象。\n\
  \n我们用一句话结束这段讨论：我们应该从最简单、最合适的算法开始，并确保我们的数据经过了准备准备。从那里开始，我们可以一直尝试不同的学习算法并对其进行调整，看看哪种最适合我们的情况。不要误认为，调整算法可能不是一项简单的任务，而且最终会消耗更多时间。务必先确保可用适当的数据！\n\
  \n## 无监督学习\n\n与监督学习相反，无监督学习在确定结果方面通常有更大的灵活性。数据的处理方式使得对于算法而言，数据集中的没有任何一个特征比其他特征更重要。这些算法从没有标记预期输出数据的数据集中学习。`K-Means\
  \ Clustering`（`聚类分析`）是无监督模型的一个示例。它非常擅长发现数据中相对于输入数据具有意义的模式。监督部分学到的与这里的很大区别在于，我们现在有\
  \ `x` 个特征 `X1`、`X2`、`X3`…… `Xx`，在 `n` 个观测值上测量。但我们不再关注预测 `Y`，因为我们不再拥有 `Y`。我们唯一的兴趣是发现我们拥有的特征的数据模式。\n\
  \n![](img/p056-001.jpg)\n\n\n\n\n在之前的图表中，你可以看到此类数据更适合于非线性方法，其中数据相对于重要性似乎呈现聚类状态（为了便于吸收，按颜色进行分组）。它是非线性的，因为我们无法通过一条直线来准确地分离和分类数据。无监督学习允许我们在几乎或完全不知道结果将长什么样、或者**应该**长什么样的情况下来处理问题。这种结构是源于数据本身，而不是应用于输出标签的监督规则。这种结构通常是通过对数据关系进行聚类得出的。\n\
  \n对于企业世界来说，这类算法/问题/架构将带给你另一个你必须解决的问题：解释算法在做什么、它发现了什么以及为什么。大多数高层管理人员确实会不定期询问这些问题，并且通常对“我不确定”的回答并不友好。因此，适当的调试（请参见\
  \ `Chapter 3, Deep Instrumentation using ReflectInsight` 中的 `ReflectInsight` 章节）将是帮助你理解算法在做什么以及为什么的关键。\n\
  \n例如，假设我们从一个基因组数据科学实验中获得了 108 个基因。我们希望将这些数据分成相似的部分，例如发色、寿命、体重等。\n\n在光谱的另一端是众所名的“鸡尾酒效应”，它基本上是指大脑听觉能够将注意力集中在一个物体上并过滤掉周围的噪声。\n\
  \n这两个示例都可以使用聚类来实现目标。\n\n## 强化学习\n\n强化学习是机器针对特定结果进行训练的一种情况，唯一目的是最大化效率和/或性能。算法做出正确决策时会奖励，做出错误决策时会受到惩罚。持续训练被用于不断提高性能。持续学习过程意味着人工干预的减少。马尔可夫模型是强化学习的一个例子，而自动驾驶汽车是这种应用的绝佳案例。它不断与环境交互，观察障碍物、限速、距离、行人等，以（希望）做出正确的决策。\n\
  \n我们与强化学习之间最大的区别在于，我们不处理正确的输入和输出数据。这里的重点是性能，这意味着要以某种方式在未见的数据和算法已经学习的内容之间找到平衡。算法对其环境应用某种动作，根据其所作的行为接收奖励或惩罚，然后循环此类推。你可以想象一下这在在酒店接到你的那辆小自动驾驶出租车上，每秒会发生多少次：\n\
  \n![](img/p057-001.jpg)\n\n## 流形学习\n\n数据集的维度是用于表示它的变量数量。例如，如果我们对根据身高和体重来描述人，那么我们的人类数据集就有两个维度。相反，如果我们有一个图像数据集，并且每张图像有一百万个像素，那么数据集的维度就是一百万。事实上，在许多现代机器学习应用中，数据集的维度可能是巨大的。\n\
  \n当维度非常大（大于数据集中的样本数量）时，我们可能会遇到一些严重的问题。考虑一个简单的分类算法，其目标是寻找一组权重 `w`，使得它与样本 `x` 点积时，对一类给一个负数，对另一类给一个正数。`w`\
  \ 的长度等于数据的维度，因此它的参数将比整个数据集中的样本还要多。这意味着学习器将对数据进行过拟合，导致学习器无法良好地泛化到训练期间未见的其他样本。\n\n\
  流形是嵌入某些高维空间中的维度为 `d` 的对象。非正式地说，流形是一个`连通区域`。想象纸上的一组点。如果你揉皱这张纸，这些点现在处于三维空间中了（例子举得不好，但希望你理解这一点）。许多流形学习算法寻求展开纸张，将数据放回二维。也许更好一点的例子是我们我们居住的星球。对我们来说它看起来是平的，但它是一个球体。所以，你可以将其看作嵌入三维空间中的\
  \ 2D 流形。下面的图片显示了这个概念：\n\n![](img/p058-001.jpg)\n\n即使我们不担心模型的过拟合，流形学习器也可以产生一个让分类和回归问题变得简单的空间。它这样做基本上是假设大多数数据点是无效的，而我们最感兴趣的数据点应该沿着流形分布，或者在流形之间移动时。\n\
  \n## 深度学习中的流形类型\n\n我在这里简要提到几种类型的流形学习。深入研究它们的细节超出了本书的范围；你只需要了解这些算法类型就了。\n\n### 拓扑\n\
  \n拓扑流形允许你将表面作为拓扑对象来讨论，也就是说，你关心它们的整体形状，但你不关心距离、角度或棱角等事情。从拓扑的角度来看，立方体和球体没有区别。\n\n\
  ### 可微\n\n可微流形的限制稍大一些（任何可微流形都是拓扑流形，但反之并不总是成立）。在可微流形上，讨论距离和角度仍然没有意义，但存在“光滑性”的概念——立方体不再与球体相同，因为立方体有边和角。然而，球体和椭球体本质上是相同的。这为我们提供了足够的结构来讨论微分形式并建立大多数的微积分。\n\
  \n### 黎曼\n\n黎曼流形是限制最强的。黎曼度量的加入使你能够理解角度和距离。它是讨论几何和曲率的正确设置。从黎曼几何的角度来看，球体和椭球是不同的对象。一个具有恒常曲率，而另一个的曲率取决于你在表面的位置。\n\
  \n## 超参数训练\n\n\n\n\n模型超参数是于模型外部的配置，其值无法从数据中估计。毫无疑问，你将花费大量的时间来调优超参数。超参数的选择将影响训练时长和预测的准确性。对于大多数数据集来说，只有少数超参数是真正重要的。\n\
  \n某些超参数比其他的更常见。最常见的如下：\n\n*   学习率 (Learning rate)\n*   动量 (Momentum)\n*   隐藏层数\n\
  *   批处理大小 (Mini-batch size)\n\n学习率可能是你需要处理的最重要的超参数，至少在初期如此。这个参数控制着所谓的模型`有效容量`（effective\
  \ capacity）。具有更多层数和每个隐藏层中具有更多神经元的网络具有更高的容量，这意味着它可以表示更复杂的函数。尽管可以表示更复杂的函数，但这并不意味着它们能够被有效地学习。\n\
  \n有效容量受到学习算法最小化用于训练模型的代价函数之能力的影响。当学习率过高时，你会看到梯度下降在增加，而不是训练误差在减少。当学习率过低时，训练速度会变慢，并可能永久停滞。你可能遇到比正常更高的训练误差。理解有效容量以及它如何受超参数影响也是重要的。\n\
  \n我们调优超参数的方法有两种：自动和手动。手动调优需要对每个超参数及其对系统的影响有深入的理解。自动调优消除了这一要求，但缺点是时间和计算成本上都要贵得多。自动调优通过使用算法自动推断潜在的超参数集并尝试对其进行优化来实现。`Grid`（网格搜索）和`Random\
  \ search`（随机搜索）是执行自动调优的两种方法。\n\n## 超参数调优方法\n\n以下章节介绍了超参数调优的许多方法中的：\n\n### 网格搜索 (Grid\
  \ search)\n\n执行超参数优化的传统方法基本上被称为参数扫描（parameter sweep），是对手动指定的超参数空间进行穷尽搜索。我们只需为提供的所有超参数值的每种组合构建一个模型，评估每个模型，并选择产生结果的架构。\n\
  \n### 随机搜索 (Random search)\n\n随机搜索通过随机选择超参数来取代网格搜索的穷尽枚举。随机搜索与网格搜索的区别在于，我们不再为每个超参数提供用于探索的离散值集；而是为每个超参数提供一个统计分布，从中随机采样值。\n\
  \n### 贝叶斯优化 (Bayesian optimization)\n\n与网格搜索和随机搜索相比，贝叶斯优化由于能够在实验运行前推理出实验质量，已被证明可以用更少的评估次数获得更好的结果。\n\
  \n### 基于梯度的优化 (Gradient-based optimization)\n\n对于特定的学习算法，可以计算相对于超参数的梯度，然后使用梯度下降来优化超参数。\n\
  \n### 进化优化 (Evolutionary optimization)\n\n进化优化使用进化算法在给定算法的超参数空间中搜索。\n\n下表总结了超参数的一些重要方面及其对有效容量的影响：\n\
  \n| 超参数 | 原因 | 注释 |\n| :--- | :--- | :--- |\n| 总隐藏单元数 | 增加总隐藏单元会增加容量 | 增加总隐藏单元会增加总内存和运行时间成本。\
  \ |\n| 学习率 | 太高或太低会导致有效容量较低。 | |\n| 零填充 | 在卷积阶段之前添加零可以保持尺寸较大 | 同时增加时间和内存成本。 |\n\
  | 权重衰减 | 减小允许模型参数变得更大 | |\n| Dropout 比例 | 丢弃较少神经元让神经元有更多机会拟合训练集 | 通常在非对数尺度下搜索 |\n\
  \n深度学习场景中常见的较大神经网络通常需要很长时间的训练。因此，执行超参数搜索可能需要几天甚至几周。记住这一点很重要，因为它影响了你对设计上的选择。\n\n\
  ## 总结\n\n在本节中，我们涵盖了许多机器学习和深度学习的术语和概念。对于那些没有该领域教育背景的人，我希望你们下次遇到这些术语时会感到更从容一些。\n\n\
  在下一章中，我们将深入研究 `Kelp.Net`。\n\n## 参考文献\n\n*   http://mathworld.wolfram.com/L1-Norm.html\n\
  *   http://mathworld.wolfram.com/L2-Norm.html\n\n## 第 3 章：使用 ReflectInsight 进行深度监测\n\
  \n我强烈感觉到的一点是，拥有一套良好的工具来完成你的工作。日志只是工具之一。最好的日志工具是那种你甚至意识不到它正在运行的工具，而来自 `ReflectSoftware`\
  \ 的 `ReflectInsight` 就是这样一种工具。它是现有的少数（如果不是唯一的）生产就绪、企业级日志记录器之一。它极其强大、灵活、直观，最重要的是速度快。它可以通过其\
  \ `Router Windows Service` 登录多个源，并带有实时和历史日志记录器。机器学习开发者需要知道他们的算法内部发生了什么，而 `ReflectSoftware`\
  \ 拥有最丰富的日志能力。我鼓励你下载副本并尝试一下。你再也不会用以前的方式看待日志记录了。这里有一个截图可以向你准确展示我的意思：\n\n![](img/p064-001.jpg)\n\
  \n我无论如何强调日志的重要性和好处，特别是在深度学习中。对于对 `Kelp.Net` 进行监测，以及我对通用深度学习的选择是 `ReflectInsight`。`Kelp.Net`\
  \ 使用 `RI` 进行其整个模型测试，这样你作为终端用户就可以在每个模型被测试和验证时看到发生了什么。拥有这些信息可以在快速识别并解决复杂问题与不能解决之间产生区别！\n\
  \n以下是 `ReflectInsight` 的一些功能和优点：\n\n*   使用简单或正则表达式标准进行高级搜索。\n*   使用多个`自定义视图` (`UDV`)\
  \ 对消息进行过滤/分类。\n*   请求和调用栈的可追踪视图。\n*   书签、行和消息类型高亮。\n*   使用 `PostSharp AOP` 进行自动方法和属性跟踪。\n\
  *   消息源时间到本地或任何其他 UTC 时间的转换。\n*   消息类型的丰富视觉指示。\n*   处理大量消息的能力\n\n让我们谈谈系统的某些单独组件。\n\
  \n### 下一代日志查看器\n\n`ReflectInsight` 带有实时和历史查看器，包含许多专门为分析 `ReflectInsight` 消息设计的工具。高性能日志允许你通过在实时查看器中显示日志消息来实时监控监测的应用程序。你可以记录极其丰富的细节，例如异常、对象、数据集、图像、进程和线程信息、格式化良好的\
  \ XML 等。你可以轻松地在应用程序中快速导航和跟踪，以找到你需要的信息。\n\n![](img/p065-001.jpg)\n\n### 消息日志\n\n\n\
  \n\n\n消息日志面板是显示所有记录消息的中央区域。该区域提供了创建多个`User-Defined Views`（用户定义视图，UDV）的能力。这些视图可以自定义以显示特定信息，允许您过滤掉不需要的噪声，并仅关注与当前需求相关的消息：\n\
  \n![](img/p066-001.jpg)\n\n### 消息详情\n\n消息详情面板显示所选消息的扩展详情。这些可以像消息本身一样简单，也可以是复杂数据，如对象、数据集、二进制对象、图像、进程和线程信息、集合内容等。对于\
  \ SQL、XML 和 HTML 相关的消息等特定消息类型，提供了语法高亮。还包含了对 Unicode 的完整支持，如下截图所示：\n\n![](img/p066-002.jpg)\n\
  \n### 消息属性\n\n消息属性面板允许您进一步检查所选消息。我们可以查看日期/时间值、时区、进程 ID、线程 ID、请求 ID、类别、机器等。我们还可以在记录过程中通过程序化方式向一个或多个消息附加用户定义属性，从而扩展消息属性面板：\n\
  \n![](img/p067-001.jpg)\n\n### 书签\n\n`Bookmarks`面板允许您查看当前日志会话的书签，并将其与日志文件一起保存以便日后检索。您可以过滤活动视图的书签、特定视图的书签，或查看所有视图的书签。导航到任何书签将立即激活该视图并选中书签消息的位置：\n\
  \n![](img/p068-001.jpg)\n\n书签也可以使用导航带菜单和/或快捷键进行管理。\n\n### 调用栈\n\n`Call Stack`面板显示当前所选消息的调用栈层级。调用栈条目是通过\
  \ enter/exit 方法程序化生成的，或者如果消息包含在 `TraceMethod` 块中。您只需双击调用栈条目即可轻松导航调用栈，这将带您进入活动消息日志面板中\
  \ enter/exit 消息块的顶部：\n\n![](img/p068-002.jpg)\n\n### 消息导航\n\nReflectInsight 支持多种在记录的消息之间进行导航的方法：\n\
  \n* 查找匹配的 enter/exit 方法块\n* 跳转到父级 enter/exit 方法块\n* 从用户定义视图中的任何消息跳转到 `All Messages`（所有消息）视图\n\
  * 按行号`Go to Message`\n* `Advanced Search` 高级搜索\n* 快速搜索（仅限活动视图）\n* 消息类型浏览导航器\n* `Bookmarks`\
  \ 书签\n\n![](img/p069-001.jpg)\n\n## 高级搜索\n\n查看器提供了两种根据标准搜索消息的方法：\n\n* 快速 `search`：主要用于简单的快速文本搜索。\n\
  * 高级搜索：主要用于需要复杂搜索标准的消息。\n\n搜索标准可以包含以下内容的组合：\n\n* 消息内容\n* 消息类型\n* 消息内容 且 类型\n* 消息内容\
  \ 或 类型\n* 此外还包括正则表达式\n\n`Advanced Search`视图提供了导航到搜索结果或将其标记为书签的能力：\n\n![](img/p070-001.jpg)\n\
  \n### 用户定义视图与过滤\n\n用户定义视图 (`UDV`) 允许您通过只查看最重要的消息来过滤掉不需要的噪声。您可以通过应用以下方法之一创建 UDV：\n\
  \n* 点击消息并选择其消息类型或其任一属性。\n* 通过创建新的 UDV 并指定过滤标准。\n* 通过克隆现有的 UDV。\n\n您还可以选择为活动日志文件持久化\
  \ UDVs。\n\n![](img/p071-001.jpg)\n\n## 自动保存/清理滚动日志文件\n\n除了库具有 `Auto Save/Purge`（自动保存/清理）滚动日志文件的能力外，实时查看器也类似的能力，外自动清理滚动日志文件的顶部。您可以通过应用以下方法之一配置实时查看器进行\
  \ `Auto Save/Auto Purge`（自动保存/自动清理）：\n\n* `Auto Save`：此方法强制实时查看器在满足特定标准（即在新的一天和或达到消息限制时）保存文件。\n\
  * `Auto Purge`：此方法根据当前日志文件的预定义大小百分比，强制实时查看器清理记录的消息顶部。\n\n![](img/p072-001.jpg)\n\
  \n### 监视 (Watches)\n\n监视面板允许在应用程序生命范围内程序化地跟踪许多不同变量的值。在深度学习中，一旦算法开始发挥作用，此面板将成为洞察发生情况的无价之宝。\n\
  \n![](img/p073-001.jpg)\n\n## 时区格式化\n\n![](img/p074-001.jpg)\n\n我们可以以标准时间或军事时间格式显示时间详情。通过选择可用的时区，选择最适合您位置的\
  \ `Time Zone Type`，例如 `Source`、`Local`、`UTC` 或 `Customize`。现在让我们涵盖系统的四个组件：\n\n*\
  \ 路由器\n* 日志查看器\n* 实时查看器\n* 配置编辑器\n\n### 路由器\n\n路由器是 ReflectInsight (RI) 日志系统的核心部分。这是一个持续运行的常规\
  \ Windows 服务，引导来自各种库（绑定到应用程序）的所有接收消息。这些消息随后分发到“监听器”，例如查看器、文本文件、二进制文件、事件日志、数据库等。在生产环境中，您通常会将路由器安装在与其余部分独立的机器上，但您完全不必这样做。一旦安装并配置（开箱配置通常适用于大多数情况），路由器将作为\
  \ Windows 服务运行，没有用户界面或桌面交互。\n\n### 日志查看器\n\n日志查看器用于查看手动保存或自动保存的历史日志文件。如果您通过系统流大量消息，您无疑会收集许多需要查看的日志文件。当出现问题时，历史日志可能是无价的；我总是设置系统保留最后七天的日志文件以备万一。我需要指出，在编写时，监视及其值不会保存到历史文件中，这些项目仅限实时流。\n\
  \n以下截图是日志查看器查看文件的示例：\n\n![](img/p075-001.jpg)\n\n### 实时查看器\n\n实时查看器是您大部分时间用于查看实时日志的工具。至少可以说，实时查看器的功能非常广泛。如果我们查看下面的截图，可以看到从我们的算法和应用程序中收集的信息量是巨大的：\n\
  \n![](img/p076-001.jpg)\n\n我们刚刚提过这种工具在机器学习方面是多么宝贵，因此公平地向您展示我们的确切含义。以下截图显示了真实的机器学习算法将数据输出到实时查看器中。如果没有这些实时信息，我们对应用程序的效率和性能将茫然失措！\n\
  \n![](img/p077-001.jpg)\n\n### SDK\n\n\n\n\n\n`Software Development Kit` (SDK) 允许你将\
  \ ReflectInsight 连接到你的应用程序。随着学习的深入，你会发现这种操作是多么简单。与其他 SDK 相比，这个 SDK 的优之处在于它为每条消息都分配了丰富的图像集。当每秒有数千条消息流时，颜色和图像可以极大帮助你将注意力集中在需要查看的内容上。\n\
  \n下面的截图准确地展示了我我的意思。例如，如果我们使用 `SendException` 消息，那么红色的“X”将显示在实时/日志查看器最左侧的图标面板中。你在下面的截图中看到的其他所有消息也是如此的。你可以在本章的“记录不同类型的消息”章节中找到更详细的信息。\n\
  \n![](img/p078-001.jpg)\n\n### 配置编辑器\n\n配置编辑器在传统的 XML 文件操作之上提供了一个图形化编辑器。它让你能够通过如下直观的图形用户界面更方便地修改你的值：\n\
  \n![](img/p078-002.jpg)\n\n### 概览\n\n我们可以在应用程序中使用基于 XML 的配置文件，让 ReflectInsight 查看器按照我们想要的方式运行。可用的配置类别涵盖从自动保存、过滤到消息着色等许多项。\n\
  \n### XML 配置\n\nReflectInsight 使用 XML 配置文件进行配置。配置信息可以嵌入其他 XML 配置文件中（如应用程序或 Web `.config`\
  \ 文件），或者放在单独的文件中。配置易于读取和更新，同时保留了表达所有配置的灵活性。\n\n此外，ReflectInsight 可以通过编程进行配置。在本书中我们将结合使用这两种，主配置通常通过\
  \ `app.config` 文件完成。\n\n### 动态配置\n\nReflectInsight 会自动监控其配置文件的更改，并在更改发生时动态应用这些更改。在许多情况下，可以在不终止进程的情况下诊断应用程序问题。这在调查已部署应用程序的问题时是一个非常有用的工具。\n\
  \n## 配置编辑器（视觉化）\n\nReflectInsight 的配置编辑器有助于通过视觉化界面轻松创建配置文件，但高级用户可以使用 XML。\n\n该工具对于编辑设置、定义消息模式/格式、定义扩展、定义监听器、将颜色与消息类型关联以及许多操作都非常有用。\n\
  \n- 易于理解的布局\n- 记住最近文件列表\n- 预定义的选项和动态区域查找\n- 键值弹出编辑器\n- 消息模式弹出编辑器\n- 方法类型弹出编辑器\n\
  - 颜色定义和消息颜色弹出编辑器\n\n## 扩展\n\n毫无疑问，你目前正在使用某种日志框架。该框架是无数小时集成工作的结果。如果我们不需要为了使用新工具而重写整个代码库，那不是太好了吗？巧合的是，ReflectSoftware\
  \ 开发了一套开源库扩展，它们实现简单，无需更改代码。这仅仅是配置问题。\n\n这些扩展允许你在实时和日志查看器中实时查看你的日志消息。此外，你也可以轻松地开发自己的扩展。以下是编写本书时当前可用的一些扩展：\n\
  \n![](img/p080-001.jpg)\n\n## 消息类型日志参考\n\n为了方便起见，由于关于 RI 支持的许多消息类型如何操作的文档不多，我整理了这份参考，向你展示如何使用日志函数。我按消息类型对其进行了组织以便快速参考。你可以查看模型部分，并在\
  \ `RITest.cs` 文件中找到你看到的完整功能代码。\n\n### 断言 (Assertions)\n\n![](img/p080-002.jpg)\n\
