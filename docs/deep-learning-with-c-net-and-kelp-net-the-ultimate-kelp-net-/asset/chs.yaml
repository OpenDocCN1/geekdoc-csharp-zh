  \ 来减少创建 `FunctionStacks` 所需的代码量。\n\n在下一章中，我们将讨论如何加载和保存你的模型；你可能会在每次测试中这样做，以确保以后方便复用。\n\
  \n## 第 6 章：加载和保存模型\n\n虽然这一章很短，但它涉及了如何加载和保存你的模型。你最不想做的事情（特别是当你的模型复杂或耗时较长）是每次运行时都重复学习过程。为什么不在需要的时候保存并重新加载模型呢？这正是我们在本章将讨论的内容。\n\
  \n每个深度学习模型都需要将其配置加载并保存到磁盘。这由 `ModelIO` 类处理。该类本身很小，因此在这里完整地复了代码：\n\n```csharp\npublic\
  \ class ModelIO\n{\n  public static void Save([NotNull] FunctionStack functionStack,\
  \ [NotNull] string fileName)\n  {\n    Ensure.Argument(fileName).NotNullOrWhiteSpace(“fileName\
  \ is null”);\n    Ensure.Argument(functionStack).NotNull(“functionStack is null”);\n\
  \    NetDataContractSerializer bf = new NetDataContractSerializer();\n    RILogManager.Default?.SendDebug(“Saving\
  \ model “ + functionStack.Name + “ to “ + fileName);\n    try\n    {\n      using\
  \ (Stream stream = File.OpenWrite(fileName))\n      {\n        bf.Serialize(stream,\
  \ functionStack);\n      }\n    }\n    catch (Exception ex)\n    {\n      RILogManager.Default?.SendException(ex.Message,\
  \ ex);\n    }\n  }\n\n  public static void Save([NotNull] SortedFunctionStack functionStack,\
  \ [NotNull] string fileName)\n  {\n    Ensure.Argument(fileName).NotNullOrWhiteSpace(“fileName\
  \ is null”);\n    Ensure.Argument(functionStack).NotNull(“functionStack is null”);\n\
  \    NetDataContractSerializer bf = new NetDataContractSerializer();\n    RILogManager.Default?.SendDebug(“Saving\
  \ model “ + functionStack.Name + “ to “ + fileName);\n    try\n    {\n      using\
  \ (Stream stream = File.OpenWrite(fileName))\n      {\n        bf.Serialize(stream,\
  \ functionStack);\n      }\n    }\n    catch (Exception ex)\n    {\n      RILogManager.Default?.SendException(ex.Message,\
  \ ex);\n    }\n  }\n\n  [CanBeNull]\n  public static FunctionStack Load([NotNull]\
  \ string fileName)\n  {\n    Ensure.Argument(fileName).NotNullOrWhiteSpace(“fileName\
  \ is null”);\n    NetDataContractSerializer bf = new NetDataContractSerializer();\n\
  \    FunctionStack result = null;\n    RILogManager.Default?.SendDebug(“Loading\
  \ model “ + fileName);\n    try\n    {\n      using (Stream stream = File.OpenRead(fileName))\n\
  \      {\n        result = (FunctionStack)bf.Deserialize(stream);\n      }\n   \
  \ }\n    catch (Exception ex)\n    {\n      RILogManager.Default?.SendException(ex.Message,\
  \ ex);\n    }\n    if (result?.Functions != null)\n    {\n      foreach (Function\
  \ function in result?.Functions)\n      {\n        RILogManager.Default?.SendDebug(“Configuring\
  \ “ + function.Name);\n        function.ResetState();\n        if (function.Optimizers\
  \ != null)\n        {\n          RILogManager.Default?.SendDebug(“Configuring “\
  \ + function.Name + “ Optimizers”);\n          foreach (var t in function.Optimizers)\n\
  \            t.ResetParams();\n        }\n        if (function is IParallelizable\
  \ parallelizable)\n        {\n          RILogManager.Default?.SendDebug(“Creating\
  \ “ + function.Name + “ Kernel”);\n          parallelizable.CreateKernel();\n  \
  \      }\n      }\n    }\n    return result;\n  }\n}\n```\n\n正如你看到的，将模型保存到磁盘需要序列化栈中的每个函数，这是一个简单的过程。而加载模型需要更多工作。首先创建一个\
  \ `NetDataContractSerializer` 对象。然后打开文件并将栈反序列化到内存中。每个函数都会重置状态，每个存在的函数都会重置参数。最后，如果函数实现了\
  \ `IParallelizable` 接口，将创建 OpenCL Kernel。\n\n### 加载模型\n\n加载模型可以通过 `ModelIO.Load`\
  \ 方法完成。这是该方法的完整代码：\n\n```csharp\n[CanBeNull]\npublic static FunctionStack Load([NotNull]\
  \ string fileName)\n{\n  Ensure.Argument(fileName).NotNullOrWhiteSpace(“fileName\
  \ is null”);\n  NetDataContractSerializer bf = new NetDataContractSerializer();\n\
  \  FunctionStack result = null;\n  RILogManager.Default?.SendDebug(“Loading model\
  \ “ + fileName);\n  try\n  {\n    using (Stream stream = File.OpenRead(fileName))\n\
  \    {\n      result = (FunctionStack)bf.Deserialize(stream);\n      RILogManager.Default?.SendDebug(“Model\
  \ “ + result.Name + “ loaded, size is “ + stream.Length.ToString(“N0”) + “ bytes”);\n\
  \    }\n  }\n  catch (Exception ex)\n  {\n    RILogManager.Default?.SendException(ex.Message,\
  \ ex);\n  }\n  if (result?.Functions != null)\n  {\n    foreach (Function function\
  \ in result?.Functions)\n    {\n      RILogManager.Default?.SendDebug(“Resetting\
  \ “ + function.Name);\n      function.ResetState();\n      if (function.Optimizers\
  \ != null)\n      {\n        RILogManager.Default?.SendDebug(“Resetting “ + function.Name\
  \ + “ Optimizers”);\n        foreach (var t in function.Optimizers)\n          t.ResetParams();\n\
  \      }\n      if (function is IParallelizable parallelizable)\n      {\n     \
  \   RILogManager.Default?.SendDebug(“Creating “ + function.Name + “ Kernel”);\n\
  \        parallelizable.CreateKernel();\n      }\n    }\n  }\n  return result;\n\
  }\n```\n\n`FunctionStack testnn = ModelIO.Load(“test.nn”);\n\n### 保存模型\n\n保存模型也是一个简单的过程，可以通过\
  \ `ModelIO. Save` 方法完成：\n\n```csharp\npublic static void Save([NotNull] FunctionStack\
  \ functionStack, [NotNull] string fileName)\n{\n```\n\n\n\n\n\n```csharp\nEnsure.Argument(fileName).NotNullOrWhiteSpace(“fileName\
  \ is null”);\n\nEnsure.Argument(functionStack).NotNull(“functionStack is null”);\n\
  \nNetDataContractSerializer bf = new NetDataContractSerializer();\n\nRILogManager.Default?.SendDebug(“Saving\
  \ model “ + functionStack.Name + “ to “ + fileName);\n\ntry\n{\n  using (Stream\
  \ stream = File.OpenWrite(fileName))\n  {\n   bf.Serialize(stream, functionStack);\n\
  \  }\n  FileStream fs = File.OpenRead(fileName);\n  RILogManager.Default?.SendDebug(“Model\
  \ “ + functionStack.Name + “ saved, size is “ +\n  fs.Length.ToString(“N0”) + “\
  \ bytes”);\n}\ncatch (Exception ex)\n{\n  RILogManager.Default?.SendException(ex.Message,\
  \ ex);\n}\n```\n\n```csharp\nFunctionStack nn = new FunctionStack(“Test1”,\nnew\
  \ Linear(2, 2, name: “l1 Linear”),\nnew Sigmoid(name: “l1 Sigmoid”),\nnew Linear(2,\
  \ 2, name: “l2 Linear”));\nModelIO.Save(nn, “test.nn”);\n```\n\n### 模型大小\n\n你会发现，模型保存时的大小会有所不同，这取决于你在流程的哪个位置调用了\
  \ `Save` 方法。正如我们之前提到的，存储的是计算结果而非操作过程，因此随着模型的训练，它的内存占用会增加。随着你的模型添加新的层级和优化器，其内存占用会持续增长，依此类推，直到你完成测试和训练。可以预见，取决于复杂性的模型可能会很容易达到\
  \ MB 级大小。不要担心，到磁盘的保存和加载速度都非常快。\n\n你需要的序列化信息量可能取决于你的使用场景。假设你正在为 Kelp.Net 设计一个可视化层，并希望用户能够保存空模型（创建后立即保存）。你也可以选择在用户会话期间定期通过程序保存模型信息以作为备份。无论你采用哪种方法，`Save`\
  \ 和 `Load` 方法都能让这些操作变得极其简单。\n\n下面的插图显示了每个模型保存时的大小。这些插图是通过 Kelp.Net 框架自动为你提供的：\n\n\
  ![](img/p307-001.jpg)\n\n## 总结\n\n在本章中，我们学习了如何加载和保存模型。在下一章中，我们将详细讨论模型的测试和训练。\n\n\
  ## 第 7 章\n\n# 深度学习测试示例\n\n在本章中，我们将检查随 Kelp.Net 提供的一些示例模型和测试。这些测试的创建目的是向你展示使用 Kelp.Net\
  \ 解决问题的多种方法。请注意，这些在编写本书时是准确的，但我一直在不断添加和改进，因此请尽可能在可能和地方参考软件的最新版本。\n\n这些示例尝试选取 Kelp.Net\
  \ 的各个方面，例如非常大的 `FunctionStacks`、`Optimizers`（优化器）、激活函数等。在很多情况下，解决一个问题有多种方法，我尝试在这些章节中展示这一点。请随时创建和/或修改任何内容以适应你的问题空间，并请进行这些测试，尝试所有组合，编写你自己的测试并丰富这里的内容。\n\
  \n这些示例还展示了如何通过程序配置 ReflectInsight 以清除消息和观察值、设置类别标签等内容。这是你学习如何使用这个强大日志工具的极佳参考。我已广泛使用它来向你展示与我们正在进行的测试相关的信息。\n\
  \n### 简单的 XOR（异或）问题\n\n这个测试非常简单基础，旨在创建一个小型但高效的神经网络（NN），然后在我们提供的数据上对其进行训练。该神经网络将作为一个异或门（XOR）运行。异或（XOR、EOR\
  \ 或 EXOR）是一种逻辑运算符，当两个操作数中有一个为真（一个为真另一个为假）但不同全为真且也不全为假时，它输出真值。\n\n我们的训练和标签数据集看起来如下。如你所示，我们有一组训练数据和一组训练标签：\n\
  \n```csharp\nReal[][] trainData =\n{\n  new Real[] { 0, 0 },\n  new Real[] { 1,\
  \ 0 },\n  new Real[] { 0, 1 },\n  new Real[] { 1, 1 }\n};\n\nReal[][] trainLabel\
  \ =\n{\n  new Real[] { 0 },\n  new Real[] { 1 },\n  new Real[] { 1 },\n  new Real[]\
  \ { 0 }\n};\n```\n\n## 完整源代码\n\n完整的源代码所示，包含注释。你可以在 Kelp.Net 测试的 `Test1` 测试中找到这段代码：\n\
  \n```csharp\nclass Test1\n{\n  public static void Run()\n  {\n    const int learningCount\
  \ = 10000;\n    Real[][] trainData =\n    {\n      new Real[] { 0, 0 },\n      new\
  \ Real[] { 1, 0 },\n      new Real[] { 0, 1 },\n      new Real[] { 1, 1 }\n    };\n\
  \    Real[][] trainLabel =\n    {\n      new Real[] { 0 },\n      new Real[] { 1\
  \ },\n      new Real[] { 1 },\n      new Real[] { 0 }\n    };\n\n    FunctionStack\
  \ nn = new FunctionStack(“Test1”,\n    new Linear(2, 2, name: “l1 Linear”),\n  \
  \  new Sigmoid(name: “l1 Sigmoid”),\n    new Linear(2, 2, name: “l2 Linear”));\n\
  \    ModelIO.Save(nn, “test.nn”);\n\n    // ... 此处省略逻辑实现部分\n  }\n}\n```\n\n\n\n\n\
  \n多花了 21 分钟，完全是因为我们切换了一个被誉为最好的优化器之一。你认为为什么会发生这种情况？难道是我们为 `Adam` 优化器的某个超参数不是最优的？\n\
  \n你的练习是操作该方法接受的参数，看看你是否能改进上面看到的时间。尝试更改不同的超参数并观察获得的结果。以下是这些参数的简要概述：\n\n- `Alpha`\
  \ 也称为学习率或步长。较大的值会在更新前导致更快的初始学习。较小的值在整个训练过程中学习速度较慢。尝试先调整这个值！作为一个提示，尝试以下学习率并看看它们会产生什么差异：0.0005、0.001\
  \ 和 0.00146。\n- `Beta1` 是一阶动量估计的衰减率。\n- `Beta2` 是二阶动量估计的衰减率。\n- `Epsilon` 是一个非常小的数字，唯一目的是防止除以零的错误。\n\
  \n更改超参数将让你感受到更改参数并重新运行测试是多么简单；这是你将执行无数次的操作。\n\n## 一个简单的异或问题（部分 2）\n\n此测试旨在向你展示如何应用不同的设置（函数、优化器等）来训练你的算法。此示例也将解决\
  \ XOR 问题；然而，我们将使用 `MeanSquaredError` 作为损失函数，并分批（batches）训练/更新模型。此测试显示了有时你可能如何通过多种方法处理同一个问题，以及不同的方法及其相关的超参数可能会产生正面或负面的影响。\n\
  \n### 完整源代码\n\n完整的源代码如下所示，包含注释。你可以在 Kelp.Net 测试的 `Test2` 测试中找到这段源码：\n\n```csharp\n\
  public static void Run()\n{\n  const int learningCount = 10000;\n  Real[][] trainData\
