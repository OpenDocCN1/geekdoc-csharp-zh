  \ NdArray x)\n{\n  for (int i = 0; i < y.Grad.Length; i++)\n  {\n    if (x.Data[i]\
  \ >= 0)\n      x.Grad[i] += y.Grad[i];\n    else\n      x.Grad[i] += y.Grad[i] *\
