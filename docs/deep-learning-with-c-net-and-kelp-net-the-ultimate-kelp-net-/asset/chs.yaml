  \ int inputs, int outputs, Optimizer[] optimizers)\n    {\n        FunctionStack\
  \ nn = new FunctionStack(name,\n            new Linear(verbose, inputs, outputs,\
  \ name: \"l1 Linear\"),\n            new Sigmoid(name: \"l1 Sigmoid\", verbose),\n\
  \            new Linear(verbose, inputs, outputs, name: \"l2 Linear\"));\n     \
  \   if (optimizers != null)\n            nn.SetOptimizer(optimizers);\n        return\
