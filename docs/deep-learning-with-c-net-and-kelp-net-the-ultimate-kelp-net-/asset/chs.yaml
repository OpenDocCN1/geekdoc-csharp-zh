  \n# Kelp.Net：参考](#toc.xhtml_cn4)\n\n在本章中，我们将讨论在编写本书时 Kelp.Net 拥有的许多特性和功能。一如既往，你应该在购买本书后从提供的\
  \ GitHub 路径下载源代码，以查看最新的特性和功能。\n\n## 让我们坦诚吧](#toc.xhtml_ch150)\n\n让我们从谈论我们今天相对于深度学习的现状开始这一章。在过去的几年里，研究、计算机处理能力以及深度学习网络的通用知识和测试方面，我们取得了长足的进步。深度学习的应用无处不在。学术界不仅在深度学习知识方面取得了进展，而且在此方面做出了巨大的工作，这应该受到极大的赞誉。对于在现实世界中从事软件项目的读者来说，你们一定对产品的发布日期非常熟悉（记得我们第\
  \ 1 章中的产品经理）。这是营销团队决定产品向公众开放的日期。在某些公司，这并不是没有预警的，无论发生什么，在这一天产品都会准时发布/发布，无论是否准备就绪。随着深度学习现在进入企业界，曾经存在于纯净、恒温环境中的技术现在也受到我们用于其他软件的相同规则限制。当然，我们的某些软件是任务关键型且非常重要的。但它们能与自动驾驶车辆相比吗？某人在项目中使用深度学习，并且它在某个时间点要投产。无论发生什么，该项目都必须在特定日期交付。这与你可能认为的常态没有区别，对吧？\n\
  \n假设我们的深度学习产品是一辆自动驾驶车辆。该车辆可以是汽车、卡车等，它内部有一个深度学习系统，帮助支持其自动驾驶模式。每个人的驾驶过程是如何被调试的？该车辆是否需要像人类一样通过驾驶认证才能在相同的道路上行驶？不同州之间是否有差异？为了让我们新一代的软件进入生产，我们需要问哪些新类型的问题？而且，在这种情况下，深度学习软件是更大产品（车辆）的一个组件，而该产品本身也有投产日期。\n\
  \n尽管深度学习是一个兴奋的研究领域，但正如我之前提到的，一旦它进入企业界，它就变成了一个由营销和技术主导的产品，许多事情的发生方式与在纯净的研发智库内部不同。\n\
  \n而冷酷的现实是，我们对深度学习仍然有很多许多并不了解。例如，神经网络是人脑的模型。你必须理解，我们对人脑实际如何运作的了解和理解非常少。我们认为自己了解了一些正在发生的情况，但关于这方面的理论每天都在演变。没有这种理解，我们如何能设计出解决当今最大问题的有效深度学习系统呢？因此，我们正在根据一些我们了解甚少的事物向世界发布软件，并被要求调试软件并交付全套功能集以满足生产“规格”，而这些可能与模型在其他情况下成熟的方式不同。如果汽车准备好了但软件没准备好，下一步是什么？\n\
  \n正如你将在本书中所看到的，我们可以用深度学习做各种事情。然而，解决一个 XOR（异或）问题和完善自动驾驶车辆是两个不同的事情。两者都很重要，但两者都需要理解系统正在做什么。一个\
  \ XOR 问题必须确定输出是 `1` 还是 `0`。自动驾驶车辆必须确定它看到的是否行人，然后据此做出下游决策。对于我的 XOR 问题，如果它出错了，我可以采用强化学习。但不确定在撞到斑马路上的行人时，人们对强化学习的接受程度如何！\n\
  \n我想在这里再提一点，即深度学习正在进入企业界。至少在美国，迟早，监管和监督就会介入。对于深度学习来说，它还没有以全军之力介入，但不可避免地会这样做。在此期间，请想一下：如果我想在任何州开车，我需要获得驾驶执照，这需要参加笔试和路考，以及眼科检查。也许我还需要根据我所在的州经常重新认证。这就是监督和管理。那么这些四处行驶的自动驾驶车辆呢？它们通过认证了吗？它们在哪里参加的驾驶测试？如果是的话，怎么过的？答案是否定的，至少还没有。但这些自动驾驶车辆实际上是深度学习的大规模实验。它作为帮助我们更好地理解这一特定领域的工具是非常棒的，但不要忘记这项实验在执行过程中关乎人类生命。谁来调试自动驾驶车辆以确保它们的图像和人脸识别软件正常工作？是否有人审查某次驾驶的图像和结果？事实证明，干扰图像识别屏幕上的即使一个像素都会影响图像的整体，那么我们如何知道像素干扰不会在下次驾驶中影响我们呢？我这一切的观点是什么？你手里有一个非常棒的软件，可以用它来回答这些以及更多问题。修饰它，让它更好，让你的深度学习实验变得更强大。拥抱更强大的机器和更多数据，这是让深度学习工作得更好、更准确的关键。成为那个找到所有及更多问题答案的人。成为那个创造改变的人！\n\
  \n## 下载 Kelp.Net](#toc.xhtml_ch151)\n\nKelp.Net 可以从其 GitHub 仓库下载。请参考购买本书时提供的信息。\n\
  \n![](img/p107-001.jpg\n\n## 构建源代码](#toc.xhtml_ch152)\n\n一旦下载了解决方案，对项目执行全部重新生成（rebuild\
  \ all）以确保构建正常。在在此之前，请确保你已经下载并安装了 Microsoft Visual Studio 2017 的社区版（如果有付费版也可以）。在重新生成所有项目时，请确保你已恢复任何\
  \ `NuGet` 包，这些包是首先被使用的。此软件的构建与你已经使用 Microsoft Visual Studio 过的项目没有区别。\n\n## 什么是\
  \ Kelp.Net?](#toc.xhtml_ch153)\n\n\n\n\nKelp.Net 是一个灵活且强大的框架，用于创建和测试深度学习神经网络模型。它通过采用“运行定义（Define-by-Run）”范式，让你能够简单且直观地编写复杂的架构。这意味着神经网络是通过实际的前向计算动态定义的，而不是通过编程来定义。更准确地说，Kelp.Net\
  \ 存储的是计算历史而不是编程逻辑。这使得编写多 GPU 并行代码变得简单，因为逻辑更接近于网络操作。\n\n对于那些熟悉“运行定义”的读者，我想告诉你们，它最近因为构建\
  \ Chainer 的基础组件而声名大起。Chainer 是第一个引入“运行定义”方法的深度学习框架。\n\n在“运行定义”出现之前，训练神经网络的传统过程分为两个阶段：首先在网络中定义数学数学操作（如矩阵乘法和非线性激活）之间的固定连接，然后运行实际的训练计算。Theano\
  \ 和 TensorFlow 是采用这种方法的著名框架。相比之下，在“运行定义”（或动态图）方法中，网络中的连接在训练开始时并不是确定的。网络是在训练执行实际计算时确定的。\n\
  \n这种方法的优点之一是直观且灵活。在“运行定义”方法中，如果网络具有复杂的控制流（如条件和循环语句），则需要为此类结构专门设计操作。另一方面，在“运行定义”方法中，可以使用语言的原生结构（如\
  \ if 语句和 for 循环）来描述这种流。\n\n另一个优点是易于调试，我们经常要做大量的调试工作！在“运行定义”方法中，如果训练计算过程中发生错误（例如数值错误），通常很难检查故障，因为定义网络的代码和错误发生的实际位置是分开的。在“运行定义”方法中，你只需要使用语言内置的调试器挂起计算，并检查流经你网络代码的数据。\n\
  \n如你所见，Kelp.Net 将你的机器和深度学习努力投入到与使用其中一种较新的数据科学语言编写项目相同的起始阶段。\n\nKelp.Net 的原始版本已转换为大幅增强的英文版，并重新发布到开源社区供本书编写。新增了许多新测试，提供了详尽的仪器支持，并添加了新的功能和特性。所有的功劳都属于原作者，感谢他创建这个精彩软件软件包所付出的远见和努力。\n\
  \n## Functions\n\n在 Kelp.Net 中，函数是许多类中使用的基础对象。其概念类似于 Microsoft .NET 的 `System.Object`，它们的定义如下：\n\
  \n```csharp\n[Serializable]\npublic abstract class Function : IComparable\n```\n\
  \n由于函数是 Kelp.Net 神经网络的基本构建单元，单个函数在 `FunctionStack` 中链联在一起，以创建强大且可能复杂的神经网络链。函数在从磁盘加载时也会被链联在一起。\n\
  \n你需要了解有四种主要类型的函数，它们的用途应该是不言自明的：\n\n*   单输入函数\n*   双输入函数\n*   多输入函数\n*   多输出函数\n\
  \n每个函数都包含一个 `Forward` 和 `Backward` 方法，你将在创建自己的函数时将实现这些方法，我们将在单独的章节中讨论：\n\n```csharp\n\
  public abstract NdArray[] Forward(params NdArray[] xs);\npublic virtual void Backward([CanBeNull])\
  \ params NdArray[] xs);\n```\n\n该类的完整定义如下：\n\n```csharp\n[Serializable]\npublic\
  \ abstract class Function : IComparable\n{\n  /// <summary> 名字。 </summary>\n  public\
  \ string Name;\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 获取/设置一个指示此对象是否启用了 GPU 的值。 </summary>\n  ///\n  /// <value> 如果启用\
  \ GPU 则为 True，否则为 false。 </value>\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  public bool GpuEnable { get; protected set; }\n  /// <summary> 控制操作的选项。 </summary>\n\
  \  public NdArray[] Parameters = { };\n  /// <summary> 优化器数组。 </summary>\n  public\
  \ Optimizer[] Optimizers = { };\n  /// <summary> 之前的输入。 </summary>\n  [NonSerialized]\n\
  \  public List<NdArray[]> PrevInputs = new List<NdArray[]>();\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 使用变长度 NdArray 参数进行前向传播。 </summary>\n  ///\n  /// <param name=”xs”>\
  \ 类型为 NdArray 的变长度参数。 </param>\n  ///\n  /// <returns> 一个 NdArray[]。 </returns>\n\
  \  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  public abstract NdArray[] Forward(bool verbose, params NdArray[] xs);\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 使用变长度 NdArray 参数进行反向传播。 </summary>\n  ///\n  /// <param name=”ys”>\
  \ 类型为 NdArray 的变长度参数。 </param>\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  public virtual void Backward(bool verbose, [CanBeNull] params NdArray[] ys){}\n\
  \  /// <summary> 输入名称列表。 </summary>\n  public string[] InputNames;\n  /// <summary>\
  \ 输出名称列表。 </summary>\n  public string[] OutputNames;\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary>\n  /// 初始化 KelpNet.Common.Functions.Function 类的新实例。\n  /// </summary>\n\
  \  ///\n  /// <param name=”name”> 名字。 </param>\n  /// <param name=”inputNames”>\
  \ (可选) 输入名称列表。 </param>\n  /// <param name=”outputNames”> (可选) 输出名称列表。 </param>\n\
  \  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  protected Function([CanBeNull] string name, [CanBeNull] string[] inputNames =\
  \ null,\n  [CanBeNull] string[] outputNames = null)\n  {\n    Name = name;\n   \
  \ if (inputNames != null)\n    {\n      InputNames = inputNames.ToArray();\n   \
  \ }\n    if (outputNames != null)\n    {\n      OutputNames = outputNames.ToArray();\n\
  \    }\n  }\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 设置优化器。 </summary>\n  ///\n  /// <param name=”optimizers”> 包含优化器的变长度参数列表。\
  \ </param>\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  public virtual void SetOptimizer([NotNull] params Optimizer[] optimizers)\n \
  \ {\n    Optimizers = optimizers;\n    foreach (Optimizer optimizer in optimizers)\n\
  \    {\n      optimizer?.AddFunctionParameters(Parameters);\n    }\n  }\n  /// <summary>\
  \ 更新参数时调用的函数) </summary>\n  protected void BackwardCountUp()\n  protected void BackwardCountUp()\n\
  \  {\n    foreach (NdArray parameter in Parameters)\n    {\n      parameter.CountUp();\n\
  \    }\n  }\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 评估函数。 </summary>\n  ///\n  /// <param name=”input”> 包含输入的变长度参数列表。\
  \ </param>\n  ///\n  /// <returns> 一个 NdArray[]。 </returns>\n}\n```\n\n\n\n\n```csharp\n\
  [CanBeNull]\npublic virtual NdArray[] Predict(bool verbose = true, [CanBeNull] params\
  \ NdArray[] input)\n{\n    return Forward(verbose, input);\n}\n\n/// <summary> 更新此对象。\
  \ </summary>\npublic virtual void Update(bool verbose = true)\n{\n    foreach (Optimizer\
  \ optimizer in Optimizers)\n    {\n        optimizer.Update(verbose);\n    }\n}\n\
  \n/// <summary> 初始化未被 RNN 等耗尽的输入数据。 </summary>\npublic virtual void ResetState()\n\
  {\n    PrevInputs = new List<NdArray[]>();\n}\n\n/// <summary> 返回表示当前对象的字符串。 </summary>\n\
  /// <returns> 表示当前对象的字符串。 </returns>\n/// <seealso cref=\"M:System.Object.ToString()\"\
  />\npublic override string ToString()\n{\n    return Name;\n}\n\n/// <summary> 对此对象进行深拷贝。\
  \ </summary>\n/// <returns> 此对象的拷贝。 </returns>\n[CanBeNull]\npublic Function Clone()\n\
  {\n    return DeepCopyHelper.DeepCopy(this);\n}\n\n/// <inheritdoc />\n/// <summary>\
  \ 将当前实例与另一个相同类型的对象进行比较，并返回一个整数\n/// 表示当前实例在排序顺序中是先于、后于还是与另一个对象\n/// 处于相同位置。\n///\
  \ </summary>\n/// <exception cref=\"T:System.ArgumentException\"> . </exception>\n\
  /// <param name=\"obj\"> 与此实例进行比较的对象。 </param>\n/// <returns>\n/// 表示所比较对象相对顺序的值。返回值具有\n\
  /// 这些含义：值 小于零：此实例在排序顺序中先于 <paramref name=\"obj\" />\n/// 零：此实例在排序顺序中与 <paramref\
  \ name=\"obj\" /> 处于相同位置。\n/// 大于零：此实例在排序顺序中后于 <paramref name=\"obj\" />\n/// </returns>\n\
  /// <seealso cref=\"M:System.IComparable.CompareTo(object)\" />\npublic int CompareTo([NotNull]\
  \ object obj)\n{\n    Function f = (Function) obj;\n    if (f.Name == Name)\n  \
  \      return 0;\n    if (InputNames != null && OutputNames != null && f.InputNames\
  \ != null && f.OutputNames != null)\n    {\n        if (InputNames.Length == f.InputNames.Length\
  \ && OutputNames.Length == f.OutputNames.Length)\n            return (0);\n    }\n\
  \    return (-1);\n}\n```\n\n如你所示，这是一个非常简单的类定义。`Kelp.Net` 有许多继承自基类 `Function` 类。\n\
  \n### N 维数组\n\n我想简要介绍一个您会在 Kelp.Net 中看到频繁使用的对象。这个对象是一个 n 维数组，用于此的类被称为 `NdArray`。这些可序列化的\
  \ n 维数组是大多数函数使用的基本参数类型。事实上，用于测试、训练和验证的数据都位于这些数组中。在表示您的数据时，它们是小巧、快速且强大的。\n\n以下是 `NdArray`\
  \ 维护的一些属性：\n\n- `Data`: 这是正在被操作或使用的实际际数据。\n- `Gradient`: 这是梯度。\n- `Shape`: 这是数组的每个维度的大小。\n\
  - `Length`: 长度根据形状计算。这与 `Data` 的长度不同。\n- `UseCount`: 这是该对象被函数使用的次数。这有助于 `Backward`\
  \ 操作的时机控制。\n- `ParentFunc`: 这是此对象的父对象。\n- `BatchCount`: 这是每个函数中共同执行的批次数。此信息用于 `Loss`\
  \ 函数中的折扣计算。\n- `TrainCount`: 在不更新的情况下执行的反向操作次数。这在运行优化器时非常有用。\n\n大多数常用的数学运算符都可以用于\
  \ `NdArray`，还有诸如 `Shape`、`Concatenate`（合并）、`Sum`（和）等操作。\n\n## FunctionStack\n\n\
  `FunctionStack` 是 `Function` 对象的数组，用于构建 Kelp.Net 模型。您可以在模型中根据需要放置任意数量的此类栈。神经网络的大小与性能之间没有直接关联，这意味着隐藏层和神经元更多的网络并不比小的网络更强大。`FunctionStack`\
  \ 真正是 Kelp.Net 的力量与美之源。它们允许您组装功能组（层），让您可以执行各种级别的复杂处理。完成后，它们将形成您的深度学习模型的基础，并根据需要从磁盘保存和加载。\n\
  \n这里是一个简单的 `FunctionStack` 示例：\n\n```csharp\nFunctionStack nn = new FunctionStack(\n\
  \    new Linear(2),\n    new Sigmoid(),\n    new Linear(2)\n);\n```\n\n此栈包含三层：两个线性层和一个\
  \ Sigmoid 层。\n\n```csharp\nFunctionStack nn = new FunctionStack(\n    new Linear(2),\n\
  \    new Sigmoid(),\n    new Linear(2)\n);\n```\n\n此时，请注意，我们创建的所有模型都尚未完成。我们添加了用于执行的函数，但仍然需要添加一个优化器使其成为一个模型。我们将通过简单告诉模型将优化器设置为许多可用优化器之一来实现此。\n\
  \n## 优化器 (Optimizers)\n\n在 Kelp.Net 中，告诉模型设置优化器只需要一次函数调用。使用上面创建的模型，我们如下调用 `SetOptimizer`\
  \ 方法：\n\n```csharp\nmodel.SetOptimizer(new MomentumSGD());\n```\n\n`SetOptimizer`\
  \ 函数接收一个 `Optimizer` 类对象，其定义如下：\n\n```csharp\n[Serializable]\npublic abstract class\
  \ Optimizer\n{\n    /// <summary> 更新次数。 </summary>\n    public long UpdateCount\
  \ = 1;\n    /// <summary> 控制优化器的选项。 </summary>\n    protected List<OptimizerParameter>\
  \ OptimizerParameters = new List<OptimizerParameter>();\n}\n```\n\n\n\n\n\n```csharp\n\
  /// <summary> 添加函数参数。 </summary>\n/// <param name=\"functionParameters\"> 控制函数的选项。\
  \ </param>\ninternal abstract void AddFunctionParameters(NdArray[] functionParameters);\n\
  \n/// <summary> 更新此对象。 </summary>\npublic void Update()\n{\n    bool isUpdated =\
  \ false;\n    foreach (var t in OptimizerParameters)\n    {\n        // 运行斜率缩减并检查是否有更新\n\
  \        if (t.FunctionParameter.Reduce())\n        {\n            t.UpdateFunctionParameters();\n\
  \            t.FunctionParameter?.ClearGrad();\n            isUpdated = true;\n\
  \        }\n    }\n    if (isUpdated)\n    {\n        UpdateCount++;\n    }\n}\n\
  \n/// <summary> 重置参数。 </summary>\npublic void ResetParams()\n{\n    foreach (var\
  \ t in OptimizerParameters)\n    {\n        t.FunctionParameter?.ClearGrad();\n\
  \    }\n    UpdateCount = 0;\n}\n```\n\n如果你省略了优化器声明，将使用默认的 `SGD(0.1)`。\n\n基础版 Kelp.Net\
  \ 包含了以下优化器：\n\n| 优化器 |or |\n| :--- | :--- |\n| AdaDelta | `AdaGrad` 的扩展，旨在减少其激进的、单调递减的学习率。\
  \ |\n| AdaGrad | 根据参数调整学习率，对频繁出现特征相关的参数进行较小的更新（即低学习率），对稀少出现特征相关的参数进行较大的更新（即高学习率）。`AdaGrad`\
  \ 的缺点是在深度学习中，单调学习率通常被证明过于激进，并导致过早停止学习。 |\n| Adam | 自适应矩估计为每个参数计算自适应学习率。在实践中，目前推荐将\
  \ `Adam` 作为默认算法，且效果通常比 `RMSProp` 稍微。 |\n| GradientClipping | 梯度裁剪是一种防止深层网络（通常是循环神经网络）中梯度爆炸的技术。\
  \ |\n| MomentumSGD | 动量随机梯度下降。 |\n| RMSProp | 使用梯度平方的移动平均来归一化梯度本身。`RMSProp` 更新以非常简单的方式调整\
  \ `Adagrad` 方法，以减少其激进的、单调递减的学习率。 |\n| SGD | 高效且易于使用。 |\n\n## AdaDelta\n\nAdaDelta\
  \ 结合了基于历史梯度的学习率缩（仅考虑最近的时间窗口），并使用了一个作为加速项的组件来积累历史更新。结果改进了 `AdaGrad` 对象学习率随时间增加而收敛至零的缺陷。Adadelta\
  \ 是一种基于梯度下降的学习算法，能够随时间调整每个参数的学习率。\n\n以下是 `AdaDelta` 对象的代码：\n\n```csharp\n[Serializable]\n\
  public class AdaDelta : Optimizer\n{\n    /// <summary> rho。 </summary>\n    public\
  \ Real Rho;\n    /// <summary> epsilon。 </summary>\n    public Real Epsilon;\n\n\
  \    /// <summary> 初始化 KelpNet.Optimizers.AdaDelta 类的一个新实例。 </summary>\n    ///\
  \ <param name=\"rho\"> (可选) rho。 </param>\n    /// <param name=\"epsilon\"> (可选)\
  \ epsilon。 </param>\n    public AdaDelta(double rho = 0.95, double epsilon = 1e-6)\n\
  \    {\n        Rho = rho;\n        Epsilon = epsilon;\n    }\n\n    /// <summary>\
  \ 添加函数参数。 </summary>\n    /// <param name=\"functionParameters\"> 控制函数的选项。 </param>\n\
  \    /// <seealso cref=\"M:KelpNet.Common.Optimizers.Optimizer.AddFunctionParameters(NdArray[])\"\
  />\n    internal override void AddFunctionParameters([NotNull] NdArray[] functionParameters)\n\
  \    {\n        foreach (NdArray functionParameter in functionParameters)\n    \
  \    {\n            OptimizerParameters.Add(new AdaDeltaParameter(functionParameter,\
  \ this));\n        }\n    }\n}\n```\n\n### AdaGrad\n\n`AdaGrad` 为频繁出现的特征提供非常低的学习率，为稀有的特征提供高学习率。其目的是在每次看到稀有特征时都进行记录。简而言之，这有助于发现和识别具有强大预测性但从任何意义上说都是稀有的特征。`AdaGrad`\
  \ 可以替代 `SGD`，在处理稀疏数据时特别有帮助，因为它为更新不频繁的参数分配较高的学习率。\n\n以下是 `AdaGrad` 对象的代码：\n\n```csharp\n\
  [Serializable]\npublic class AdaGrad : Optimizer\n{\n    /// <summary> 学习率。 </summary>\n\
  \    public Real LearningRate;\n    /// <summary> epsilon。 </summary>\n    public\
  \ Real Epsilon;\n\n    /// <summary> 初始化 KelpNet.Optimizers.AdaGrad 类的一个新实例。 </summary>\n\
  \    /// <param name=\"learningRate\"> (可选) 学习率。 </param>\n    /// <param name=\"\
  epsilon\"> (可选) epsilon。 </param>\n    public AdaGrad(double learningRate = 0.01,\
  \ double epsilon = 1e-8)\n    {\n        LearningRate = learningRate;\n        Epsilon\
  \ = epsilon;\n    }\n\n    /// <summary> 添加函数参数。 </summary>\n    /// <param name=\"\
  functionParameters\"> 控制函数的选项。 </param>\n    /// <seealso cref=\"M:KelpNet.Common.Optimizers.Optimizer.AddFunctionParameters(NdArray[])\"\
  />\n    internal override void AddFunctionParameters([NotNull] NdArray[] functionParameters)\n\
  \    {\n        foreach (NdArray functionParameter in functionParameters)\n    \
  \    {\n            OptimizerParameters.Add(new AdaGradParameter(functionParameter,\
  \ this));\n        }\n    }\n}\n```\n\n### Adam\n\n`Adam` 已经成为一种日益流行的优化算法。你可以认为将\
  \ `Adam` 视为一种泛化的 `AdaGrad`，这意味着 `Adam` 为其最优性预设了某些参数选择。因此，`Adam` 是 `AdaDelta` 加上动量，并且在某些超参数设置下会恢复到\
  \ `AdaDelta`。如果你禁用 `Adam` 中的一阶平滑，你就有 `AdaDelta`。如果你禁用二阶重缩放，你就有 `SGD + momentum`。无论如何，你的努力仍然将围绕调整学习率展开。更正式地说，算法更新使用梯度的一阶和二阶矩的移动平均直接估计，并包含一个偏置修正项。\n\
  \n以下是 `Adam` 对象的代码：\n\n```csharp\n[Serializable]\npublic class Adam : Optimizer\n\
  {\n    /// <summary> alpha。 </summary>\n    public Real Alpha;\n    /// <summary>\
  \ 第一阶 beta。 </summary>\n    public Real Beta1;\n    /// <summary> 第二阶 beta。 </summary>\n\
  \    public Real Beta2;\n    /// <summary> epsilon。 </summary>\n    public Real\
  \ Epsilon;\n}\n```\n\n\n\n\n```csharp\n/// <param name=”epsilon”> (可选) 的 epsilon。\
  \ </param>\npublic Adam(double alpha = 0.001, double beta1 = 0.9, double beta2 =\
  \ 0.999, double epsilon = 1e-8)\n{\n    Alpha = alpha;\n    Beta1 = beta1;\n   \
  \ Beta2 = beta2;\n    Epsilon = epsilon;\n}\n\n/// <summary> 添加函数参数。 </summary>\n\
  /// <param name=”functionParameters”> 控制函数的选项。 </param>\n/// <seealso cref=”M:KelpNet.Common.Optimizers.Optimizer.AddFunctionParameters(NdArray[])\"\
  />\ninternal override void AddFunctionParameters([NotNull] NdArray[] functionParameters)\n\
  {\n    foreach (NdArray functionParameter in functionParameters)\n    {\n      \
  \  OptimizerParameters.Add(new AdamParameter(functionParameter, this));\n    }\n\
  }\n```\n\n## 梯度裁剪 (GradientClipping)\n\n梯度裁剪主要发生在循环神经网络中。以下是其原因的简要解释。\n\n当梯度反向传播时，由于它们不断乘以小于\
  \ 1 的数字，梯度可能会消失。这被称为**梯度消失问题**。相反，当梯度由于乘以大于 1 的数字而呈指数级变大时，你就会遇到所说的**梯度爆炸问题**。\n\n\
  梯度裁剪会将梯度限制在两个数字之间，以防止它们变得过大。\n\n以下是 GradientClipping 对象的代码：\n\n```csharp\n[Serializable]\n\
  public class GradientClipping : Optimizer\n{\n    /// <summary> 阈值。 </summary>\n\
  \    public Real Threshold;\n\n    /// <summary>\n    /// 初始化 KelpNet.Optimizers.GradientClipping\
  \ 类的新实例。\n    /// </summary>\n    /// <param name=”threshold”> 阈值。 </param>\n  \
  \  public GradientClipping(double threshold)\n    {\n        Threshold = threshold;\n\
  \    }\n\n    /// <summary> 添加函数参数。 </summary>\n    /// <param name=”functionParameters”>\
  \ 控制函数的选项。 </param>\n    /// <seealso cref=”M:KelpNet.Common.Optimizers.Optimizer.AddFunctionParameters(NdArray[])\"\
  />\n    internal override void AddFunctionParameters([NotNull] NdArray[] functionParameters)\n\
  \    {\n        foreach (NdArray functionParameter in functionParameters)\n    \
  \    {\n            OptimizerParameters.Add(new GradientClippingParameter(functionParameter,\
  \ this));\n        }\n    }\n}\n```\n\n## 动量 SGD (MomentumSGD)\n\n**随机梯度下降** (**SGD**)\
  \ 取决于当前数据迭代的给定实例或多个实例。因此，它每次迭代的更新步骤往往不稳定，收敛需要更多时间，并且你的模型似乎陷入了糟糕的局部最小值。为了解决这个问题，应用了动量（更具体地说，是\
  \ Nesterov 动量）来保留之前更新步骤的历史，并将此信息与下一个梯度步相结合，以保持生成的更新更加稳定和平滑。简单来说，我们正在防止混乱的跳跃。\n\n\
  以下是 MomentumSGD 对象的代码：\n\n```csharp\n[Serializable]\npublic class MomentumSGD :\
  \ Optimizer\n{\n    /// <summary> 学习率。 </summary>\n    public Real LearningRate;\n\
  \    /// <summary> 动量。 </summary>\n    public Real Momentum;\n\n    /// <summary>\n\
  \    /// 初始化 KelpNet.Optimizers.MomentumSGD 类的新实例。\n    /// </summary>\n    ///\
  \ <param name=”learningRate”> (可选) 学习率。 </param>\n    /// <param name=”momentum”>\
  \ (可选) 动量。 </param>\n    public MomentumSGD(double learningRate = 0.01, double momentum\
  \ = 0.9)\n    {\n        LearningRate = learningRate;\n        Momentum = momentum;\n\
  \    }\n\n    /// <summary> 添加函数参数。 </summary>\n    /// <param name=”functionParameters”>\
  \ 控制函数的选项。 </param>\n    /// <seealso cref=”M:KelpNet.Common.Optimizers.Optimizer.AddFunctionParameters(NdArray[])\"\
  />\n    internal override void AddFunctionParameters([NotNull] NdArray[] functionParameters)\n\
  \    {\n        foreach (NdArray functionParameter in functionParameters)\n    \
  \    {\n            OptimizerParameters.Add(new MomentumSGDParameter(functionParameter,\
  \ this));\n        }\n    }\n}\n```\n\n### RMSprop\n\nRMSprop 的开发是为了解决 AdaGrad 学习率急剧减少的问题。RMSprop\
  \ 通过梯度平方的指数衰减平均值来除以学习率。\n\n以下是 RMSprop 对象的代码：\n\n```csharp\n[Serializable]\npublic\
  \ class RMSprop : Optimizer\n{\n    /// <summary> 学习率。 </summary>\n    public Real\
  \ LearningRate;\n    /// <summary> alpha。 </summary>\n    public Real Alpha;\n \
  \   /// <summary> epsilon。 </summary>\n    public Real Epsilon;\n\n    /// <summary>\n\
  \    /// 初始化 KelpNet.Optimizers.RMSprop 类的新实例。\n    /// </summary>\n    /// <param\
  \ name=”learningRate”> (可选) 学习率。 </param>\n    /// <param name=”alpha”> (可选) alpha。\
  \ </param>\n    /// <param name=”epsilon”> (可选) epsilon。 </param>\n    public RMSprop(double\
  \ learningRate = 0.01, double alpha = 0.99, double epsilon = 1e-8)\n    {\n    \
  \    LearningRate = learningRate;\n        Alpha = alpha;\n        Epsilon = epsilon;\n\
  \    }\n\n    /// <summary> 添加函数参数。 </summary>\n    /// <param name=”functionParameters”>\
  \ 控制函数的选项。 </param>\n    /// <seealso cref=”M:KelpNet.Common.Optimizers.Optimizer.AddFunctionParameters(NdArray[])\"\
  />\n    internal override void AddFunctionParameters([NotNull] NdArray[] functionParameters)\n\
  \    {\n        foreach (NdArray functionParameter in functionParameters)\n    \
  \    {\n            OptimizerParameters.Add(new RMSpropParameter(functionParameter,\
  \ this));\n        }\n    }\n}\n```\n\n### SGD\n\n**随机梯度下降** (**SGD**) 是一种批大小为 1\
  \ 的算法。这意味着 SGD 依赖于从数据集中均匀随机选择的单个样本，并用于计算每步梯度的估计值。\n\n以下是 SGD（随机梯度下降）对象的代码：\n\n```csharp\n\
  [Serializable]\npublic class SGD : Optimizer\n{\n    /// <summary> 学习率。 </summary>\n\
  \    public Real LearningRate;\n\n    /// <summary> 初始化 KelpNet.Optimizers.SGD 类的新实例。\
  \ </summary>\n    /// <param name=”learningRate”> (可选) 学习率。 </param>\n}\n```\n\n\
  \n\n\n```csharp\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  public SGD(double learningRate = 0.1)\n{\n    LearningRate = learningRate;\n}\n\
  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 添加函数参数。 </summary>\n///\n/// <param name=\"functionParameters\"> 控制函数的选项。\
  \ </param>\n///\n/// <seealso cref=\"M:KelpNet.Common.Optimizers.Optimizer.AddFunctionParameters(NdArr\
  \ ay[])\"/><//>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  internal override void AddFunctionParameters([NotNull] NdArray[] functionParameters)\n\
  {\n    foreach (NdArray functionParameter in functionParameters)\n    {\n      \
  \  OptimizerParameters.Add(new SGDParameter(functionParameter, this));\n    }\n\
  }\n}\n```\n\n## 池化层 (Poolings)\n\n池化层最常见地插入在**卷积神经网络** (**CNN**) 的连续卷积层之间，旨在逐步减少数据的宽度和高度并控制过拟合。Kelp.Net\
  \ 两种最常用的池化层，即最大池化（max）和平均池化（average）运算符。这些层沿输入数据的高度宽度执行下采样操作。\n\n池化层最常用的配置是应用步长为\
  \ 2 的 2×2 滤波器。这将输入卷中的每个深度切片在空间维度（宽度和高度）上进行二倍下采样。使用 2×2 的滤波器尺寸，`max()` 操作会取滤波器区域四个数字中的最大值。这意味着如果输入图像是\
  \ 32x32，输出图像将变为 16x16。此操作不影响深度维度。\n\n池化层没有层级参数，因为它们计算的是固定函数。然而，它们有额外的超参数。\n\nKelp.Net\
  \ 提供了以下池化层：\n\n| 层 | 备注 |\n| :--- | :--- |\n| MaxPooling (最大池化) | 该层取特征区域内的最大值并提取最重要的特征。\
  \ |\n| AveragePooling (平均池化) | 该层取特征区域内数字的平均值，平滑地提取特征（边缘不那么极端）。 |\n\n## MaxPooling\
  \ (最大池化)\n\n最大池化的目标是对输入数据进行下采样，从而降低其维度并允许进行特征假设。它还通过减少需要学习的参数数量来降低计算成本。这是对初始数据的子区域应用最大滤波器来实现的。这些子区域通常是不重叠的，但不是必须如此。\n\
  \n例如，假设我们有一个 4x4 的简单数据矩阵作为输入，如下图所示。我们的最大池化滤波器是一个 2x2 滤波器，我们将将其作为输入。我们将使用步长为 2，这意味着跨越输入时的\
  \ `dx` 和 `dy` 将为 (2, 2)，且不会重叠任何区域。对于我们的滤波器表示的每个区域，我们都会取该区域的最大值并创建一个新的输出矩阵，其中每个元素都是原始输入中某个区域的最大值。正如接图所示，我们的结果是一个\
  \ 2x2 矩阵，每个元素都是来自输入区域的极大值：\n\n![](img/p129-001.jpg)\n\n以下是 `MaxPooling` 对象的代码：\n\
  \n```csharp\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 最大池化。 </summary>\n///\n/// <seealso cref=\"T:KelpNet.Common.Functions.Type.SingleInputFunction\"\
  /></\n/// <seealso cref=\"T:KelpNet.Common.Functions.IParallelizable\"/></\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [Serializable] public class MaxPooling : SingleInputFunction, IParallelizable\n\
  {\n    /// <summary> 函数名称。 </summary>\n    const string FUNCTION_NAME = \"MaxPooling\"\
  ;\n    /// <summary> 宽度。 </summary>\n    private int _kWidth;\n    /// <summary>\
  \ 高度。 </summary>\n    private int _kHeight;\n    /// <summary> 填充 x 坐标。 </summary>\n\
  \    private int _padX;\n    /// <summary> 填充 y 坐标。 </summary>\n    private int\
  \ _padY;\n    /// <summary> 步长 x 坐标。 </summary>\n    private int _strideX;\n   \
  \ /// <summary> 步长 y 坐标。 </summary>\n    private int _strideY;\n    /// <summary>\
  \ 输出索引列表。 </summary>\n    private readonly List<int[]> _outputIndicesList = new\
  \ List<int[]>();\n    /// <summary> 前向内核。 </summary>\n    [NonSerialized]\n    [DebuggerBrowsable(DebuggerBrowsableState.Never)]\n\
  \    public ComputeKernel ForwardKernel;\n    ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \    /// <summary>\n    /// 初始化 KelpNet.Functions.Poolings.MaxPooling 类的一个新实例。\n\
  \    /// </summary>\n    ///\n    /// <param name=\"ksize\"> ksize。 </param>\n \
  \   /// <param name=\"stride\"> (可选) 步长。 </param>\n    /// <param name=\"pad\">\
  \ (可选) 填充。 </param>\n    /// <param name=\"gpuEnable\"> (可选) 如果启用 GPU 则为 True。 </param>\n\
  \    /// <param name=\"name\"> (可选) 名称。 </param>\n    /// <param name=\"inputNames\"\
  > (可选) 输入列表。 </param>\n    /// <param name=\"outputNames\"> (可选) 输出列表。 </param>\n\
  \    ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \    public MaxPooling(int ksize, int stride = 1, int pad = 0, bool gpuEnable)\n\
  )\n```\n\n\n```csharp\n_strideY = stride.Height;\n\nif (SetGpuEnable(gpuEnable))\n\
  {\n  CreateKernel();\n  SingleInputForward = ForwardGpu;\n}\nelse\n{\n  SingleInputForward\
  \ = ForwardCpu;\n}\nSingleOutputBackward = BackwardCpu;\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 创建内核。 </summary>\n///\n/// <seealso cref=”M:KelpNet.Common.Functions.IParallelizable.CreateKernel()”/>\n\
  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  public void CreateKernel()\n{\n  if (GpuEnable)\n    ForwardKernel = Weaver.CreateProgram(Weaver.GetKernelSource(FUNCTION_NAME)).CreateKernel(“MaxPoolingForward”);\n\
  }\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> CPU 前向传播。 </summary>\n///\n/// <param name=”input”> 输入。 </param>\n\
  ///\n/// <returns> 一个 NdArray。 </returns>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [CanBeNull]\nprivate NdArray ForwardCpu([NotNull] NdArray input)\n{\n  int outputHeight\
  \ = (int)Math.Floor((input.Shape[1] - _kHeight + _padY * 2.0) / _strideY) + 1;\n\
  \  int outputWidth = (int)Math.Floor((input.Shape[2] - _kWidth + _padX * 2.0) /\
  \ _strideX) + 1;\n  int[] outputIndices = new int[input.Shape[0] * outputHeight\
  \ * outputWidth * input.BatchCount];\n  for (int b = 0; b < input.BatchCount; b++)\n\
  \  {\n    int resultIndex = b * input.Shape[0] * outputHeight * outputWidth;\n \
  \   for (int i = 0; i < input.Shape[0]; i++)\n    {\n      int inputIndexOffset\
  \ = b * input.Length + i * input.Shape[1] * input.Shape[2];\n      for (int y =\
  \ 0; y < outputHeight; y++)\n      {\n        int dyOffset = y * _strideY + -_padY\
  \ < 0 ? 0 : y * _strideY + -_padY;\n        int dyLimit = _kHeight + dyOffset <\
  \ input.Shape[1] ? _kHeight + dyOffset : input.Shape[1];\n        for (int x = 0;\
  \ x < outputWidth; x++)\n        {\n          int dxOffset = x * _strideX - _padX\
  \ < 0 ? 0 : x * _strideX - _padX;\n          int dxLimit = _kWidth + dxOffset <\
  \ input.Shape[2] ? _kWidth + dxOffset : input.Shape[2];\n          outputIndices[resultIndex]\
  \ = inputIndexOffset + dyOffset * input.Shape[2] + dxOffset;\n          Real maxVal\
  \ = input.Data[outputIndices[resultIndex]];\n          for (int dy = dyOffset; dy\
  \ < dyLimit; dy++)\n          {\n            for (int dx = dxOffset; dx < dxLimit;\
  \ dx++)\n            {\n              int inputIndex = inputIndexOffset + dy * input.Shape[2]\
  \ + dx;\n              if (maxVal < input.Data[inputIndex])\n              {\n \
  \               maxVal = input.Data[inputIndex];\n                outputIndices[resultIndex]\
  \ = inputIndex;\n              }\n            }\n          }\n          resultIndex++;\n\
  \        }\n      }\n    }\n  }\n  return GetForwardResult(input, outputIndices,\
  \ outputWidth, outputHeight);\n}\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> GPU 前向传播。 </summary>\n///\n/// <param name=”input”>`` 输入。 </param>\n\
  ///\n/// <returns> 一个 NdArray。 </returns>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [CanBeNull]\nprivate NdArray ForwardGpu([NotNull] NdArray input)\n{\n  int outputHeight\
  \ = (int)Math.Floor((input.Shape[1] - _kHeight + _padY * 2.0) / _strideY) + 1;\n\
  \  int outputWidth = (int)Math.Floor((input.Shape[2] - _kWidth + _padX * 2.0) /\
  \ _strideX) + 1;\n  int[] outputIndices = new int[input.Shape[0] * outputHeight\
  \ * outputWidth * input.BatchCount];\n  using (ComputeBuffer<Real> gpuX = new ComputeBuffer<Real>(Weaver.Context,\
  \ ComputeMemoryFlags.ReadOnly | ComputeMemoryFlags.CopyHostPointer, input.Data))\n\
  \  {\n    using (ComputeBuffer<int> gpuYIndex = new ComputeBuffer<int>(Weaver.Context,\
  \ ComputeMemoryFlags.WriteOnly | ComputeMemoryFlags.AllocateHostPointer, outputIndices.Length))\n\
  \    {\n      ForwardKernel?.SetMemoryArgument(0, gpuX);\n      ForwardKernel?.SetMemoryArgument(1,\
  \ gpuYIndex);\n      ForwardKernel?.SetValueArgument(2, outputHeight);\n      ForwardKernel?.SetValueArgument(3,\
  \ outputWidth);\n      ForwardKernel?.SetValueArgument(4, input.Shape[0]);\n   \
  \   ForwardKernel?.SetValueArgument(5, input.Shape[1]);\n      ForwardKernel?.SetValueArgument(6,\
  \ input.Shape[2]);\n      ForwardKernel?.SetValueArgument(7, _kHeight);\n      ForwardKernel?.SetValueArgument(8,\
  \ _kWidth);\n      ForwardKernel?.SetValueArgument(9, _strideX);\n      ForwardKernel?.SetValueArgument(10,\
  \ _strideY);\n      ForwardKernel?.SetValueArgument(11, _padY);\n      ForwardKernel?.SetValueArgument(12,\
  \ _padX);\n      Weaver.CommandQueue?.Execute(ForwardKernel, null, new long[] {\
  \ input.BatchCount * input.Shape[0], outputHeight, outputWidth }, null, null);\n\
  \      Weaver.CommandQueue?.Finish();\n      Weaver.ReadFromBuffer(gpuYIndex, ref\
  \ outputIndices, true);\n    }\n  }\n  return GetForwardResult(input, outputIndices,\
  \ outputWidth, outputHeight);\n}\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 获取前向传播结果。 </summary>\n///\n/// <param name=”input”> 输入。 </param>\n\
  /// <param name=”outputIndices”> 索引。 </param>\n/// <param name=”outputWidth”> 输出的宽度。\
  \ </param>\n/// <param name=”outputHeight”> 输出的高度。 </param>\n///\n/// <returns>\
  \ 前向结果。 </returns>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [NotNull]\nNdArray GetForwardResult([NotNull] NdArray input, [NotNull] int[] outputIndices,\
  \ int outputWidth, int outputHeight)\n{\n  Real[] result = new Real[outputIndices.Length];\n\
  \  for (int i = 0; i < result.Length; i++)\n  {\n    result[i] = input.Data[outputIndices[i]];\n\
  \  }\n  _outputIndicesList?.Add(outputIndices);\n  return NdArray.Convert(result,\
  \ new[] { input.Shape[0], outputHeight, outputWidth }, input.BatchCount, this);\n\
  }\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> CPU 反向传播。 </summary>\n///\n/// <param name=”y”> 需要处理的 NdArray。 </param>\n\
  /// <param name=”x”> 需要处理的 NdArray。 </param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  private void BackwardCpu([NotNull] NdArray y, [CanBeNull] NdArray x)\n{\n  Ensure.Argument(y);\n\
  \  Ensure.Argument(x);\n  int[] outputIndices = _outputIndicesList[_outputIndicesList.Count\
  \ - 1];\n  _outputIndicesList.RemoveAt(_outputIndicesList.Count - 1);\n  for (int\
  \ i = 0; i < y.Grad.Length; i++)\n  {\n    x.Grad[outputIndices[i]] += y.Grad[i];\n\
  \  }\n}\n}\n```\n\n\n\n\n/// 初始化 `KelpNet.Functions.Poolings.AveragePooling` 类的一个新实例。\n\
  /// <summary>\n///\n/// <param name=\"ksize\"> `ksize`。 </param>\n/// <param name=\"\
  stride\"> (可选) `stride`。 </param>\n/// <param name=\"pad\"> (可选) `pad`。 </param>\n\
  /// <param name=\"name\"> (可选) `name`。 </param>\n/// <param name=\"inputNames\"\
  > (可选) 输入名称列表。 </param>\n/// <param name=\"outputNames\"> (可选) 输出名称列表。 </param>\n\
  \n```csharp\npublic AveragePooling(int ksize, int stride = 1, int pad = 0, [CanBeNull]\
  \ string name = FUNCTION_NAME, [CanBeNull] string[] inputNames = null, [CanBeNull]\
  \ string[] outputNames = null) :\n  base(name, inputNames, outputNames)\n{\n   \
  \ _kWidth = ksize;\n    _kHeight = ksize;\n    _padY = pad;\n    _padX = pad;\n\
  \    _strideX = stride;\n    _strideY = stride;\n    SingleInputForward = NeedPreviousForwardCpu;\n\
  \    SingleOutputBackward = NeedPreviousBackwardCpu;\n}\n```\n\n/// <summary>\n\
  /// 初始化 `KelpNet.Functions.Poolings.AveragePooling` 类的一个新实例。\n/// </summary>\n///\n\
  /// <param name=\"ksize\"> `ksize`。 </param>\n/// <param name=\"stride\"> (可选) `stride`。\
  \ </param>\n/// <param name=\"pad\"> (可选) `pad`。 </param>\n/// <param name=\"name\"\
  > (可选) `name`。 </param>\n/// <param name=\"inputNames\"> (可选) 输入名称列表。 </param>\n\
  /// <param name=\"outputNames\"> (可选) 输出名称列表。 </param>\n\n```csharp\npublic AveragePooling(Size\
  \ ksize, Size stride = new Size(), Size pad = new Size(), [CanBeNull] string name\
  \ = FUNCTION_NAME, [CanBeNull] string[] inputNames = null, [CanBeNull] string[]\
  \ outputNames = null) : base(name, inputNames, outputNames)\n{\n    if (pad == Size.Empty)\n\
  \      pad = new Size(0, 0);\n    if (stride == Size.Empty)\n      stride = new\
  \ Size(1, 1);\n    _kWidth = ksize.Width;\n    _kHeight = ksize.Height;\n    _padY\
  \ = pad.Height;\n    _padX = pad.Width;\n    _strideX = stride.Width;\n    _strideY\
  \ = stride.Height;\n    SingleInputForward = NeedPreviousForwardCpu;\n    SingleOutputBackward\
  \ = NeedPreviousBackwardCpu;\n}\n```\n\n/// <summary> 需要之前的 CPU 前向传播。 </summary>\n\
  ///\n/// <param name=\"input\"> 输入。 </param>\n///\n/// <returns> 一个 `NdArray`。 </returns>\n\
  \n```csharp\n[NotNull]\nprotected NdArray NeedPreviousForwardCpu([NotNull] NdArray\
  \ input)\n{\n    int outputHeight = (int)Math.Floor((input.Shape[1] - _kHeight +\
  \ _padY * 2.0) / _strideY) + 1;\n    int outputWidth = (int)Math.Floor((input.Shape[2]\
  \ - _kWidth + _padX * 2.0) / _strideX) + 1;\n    Real[] result = new Real[input.Shape[0]\
  \ * outputHeight * outputWidth * input.BatchCount];\n    Real m = _kHeight * _kWidth;\n\
  \    for (int b = 0; b < input.BatchCount; b++)\n    {\n        int resultIndex\
  \ = b * input.Shape[0] * outputHeight * outputWidth;\n        for (int i = 0; i\
  \ < input.Shape[0]; i++)\n        {\n            int inputIndexOffset = i * input.Shape[1]\
  \ * input.Shape[2];\n            for (int y = 0; y < outputHeight; y++)\n      \
  \      {\n                int dyOffset = y * _strideY - _padY < 0 ? 0 : y * _strideY\
  \ - _padY;\n                int dyLimit = _kHeight + dyOffset < input.Shape[1] ?\
  \ _kHeight + dyOffset : input.Shape[1];\n                for (int x = 0; x < outputWidth;\
  \ x++)\n                {\n                    int dxOffset = x * _strideX - _padX\
  \ < 0 ? 0 : x * _strideX - _padX;\n                    int dxLimit = _kWidth + dxOffset\
  \ < input.Shape[2] ? _kWidth + dxOffset : input.Shape[2];\n                    for\
  \ (int dy = dyOffset; dy < dyLimit; dy++)\n                    {\n             \
  \           for (int dx = dxOffset; dx < dxLimit; dx++)\n                      \
  \  {\n                            int inputindex = inputIndexOffset + dy * input.Shape[2]\
  \ + dx;\n                            result[resultIndex] += input.Data[inputindex\
  \ + input.Length * b] / m;\n                        }\n                    }\n \
  \                   resultIndex++;\n                }\n            }\n        }\n\
  \    }\n    return NdArray.Convert(result, new[] { input.Shape[0], outputHeight,\
  \ outputWidth }, input.BatchCount, this);\n}\n```\n\n/// <summary> 需要之前的 CPU 反向传播。\
  \ </summary>\n///\n/// <param name=\"y\"> 待处理的 `NdArray`。 </param>\n/// <param name=\"\
  x\"> 待处理的 `NdArray`。 </param>\n```csharp\nprotected void NeedPreviousBackwardCpu([NotNull]\
  \ NdArray y, [NotNull] NdArray x)\n{\n    Real m = _kHeight * _kWidth;\n    for\
  \ (int b = 0; b < input.BatchCount; b++)\n    {\n        int resultIndex = b * input.Shape[0]\
  \ * outputHeight * outputWidth;\n        for (int i = 0; i < input.Shape[0]; i++)\n\
  \        {\n            int inputIndexOffset = i * input.Shape[1] * input.Shape[2];\n\
  \            for (int y = 0; y < outputHeight; y++)\n            {\n           \
  \     int dyOffset = y * _strideY - _padY < 0 ? 0 : y * _strideY - _padY;\n    \
  \            int dyLimit = _kHeight + dyOffset < input.Shape[1] ? _kHeight + dyOffset\
  \ : input.Shape[1];\n                for (int x = 0; x < outputWidth; x++)\n   \
  \             {\n                    int dxOffset = x * _strideX - _padX < 0 ? 0\
  \ : x * _strideX - _padX;\n                    int dxLimit = _kWidth + dxOffset\
  \ < input.Shape[2] ? _kWidth + dxOffset : input.Shape[2];\n                    for\
  \ (int dy = dyOffset; dy < dyLimit; dy++)\n                    {\n             \
  \           for (int dx = dxOffset; dx < dxLimit; dx++)\n                      \
  \  {\n                            int inputindex = inputIndexOffset + dy * input.Shape[2]\
  \ + dx;\n                            result[resultIndex] += input.Data[inputindex\
  \ + input.Length * b] / m;\n                        }\n                    }\n \
  \                   resultIndex++;\n                }\n            }\n        }\n\
  \    }\n}\n```\n\n## 容器\n\n`KelpNet` 中的容器是一个非常重要的概念。它们基本上包含了你将要使用的深度学习函数。可能最常用的容器是\
  \ `FunctionStack`，如上文所示。\n\n在 `KelpNet` 中可用的容器有\n\n- `FunctionStack`\n- `FunctionDictionary`\n\
  - `SplitFunction`\n- `SortedList`\n- `SortedFunctionStack`\n\n## FunctionStack\n\
  \n`FunctionStack` 是 `KelpNet` 中基础但重要的原理。它们是在一次前向、反向或更新过程中同步执行的函数层。你将始终使用 `FunctionStack`\
  \ 来创建模型，并且有多种使用方法。\n\n以下是 `FunctionStack` 对象的代码：\n\n```csharp\n[Serializable]\n\
  public class FunctionStack : Function\n{\n    /// <summary> 函数名称。</summary>\n  \
  \  const string FUNCTION_NAME = \"FunctionStack\";\n\n    /// <summary> 所有层都存储在\
  \ Function 类中。</summary>\n    ///\n    /// <value> 函数。 </value>\n    public Function[]\
  \ Functions { get; private set; }\n\n/// <summary>\n/// 初始化 `KelpNet.Common.Functions.Container.FunctionStack`\
  \ 类的一个新实例。\n/// </summary>\n///\n/// <param name=\"functions\"> 函数。 </param>\n///\
  \ <param name=\"name\"> (可选) `name`。 </param>\n/// <param name=\"inputNames\"> (可选)\
  \ 输入名称列表。 </param>\n/// <param name=\"outputNames\"> (可选) 输出名称列表。 </param>\n\n```csharp\n\
  public FunctionStack([CanBeNull] Function[] functions, [CanBeNull] string name =\
  \ FUNCTION_NAME, [CanBeNull] string[] inputNames = null, [CanBeNull] string[] outputNames\
  \ = null) :\n```\n\n\n\n\n\n```csharp\nbase(name, inputNames, outputNames)\n{\n\
  \  Functions = functions;\n}\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary>\n/// 初始化 KelpNet.Common.Functions.Container.FunctionStack 类的新实例。\n\
  /// </summary>\n///\n/// <param name=\"function\"> 函数。 </param>\n/// <param name=\"\
  name\"> (可选) 名称。</param>\n/// <param name=\"inputNames\"> (可选) 输入名称列表。</param>\n\
  /// <param name=\"outputNames\"> (可选) 输出名称列表。</param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic FunctionStack([CanBeNull] Function function, [CanBeNull] string\
  \ name = FUNCTION_NAME, [CanBeNull] string[] inputNames = null, [CanBeNull] string[]\
  \ outputNames = null) :\nbase(name, inputNames, outputNames)\n{\n  Functions = new[]\
  \ { function };\n}\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary>\n/// 初始化 KelpNet.Common.Functions.Container.FunctionStack 类的新实例。\n\
  /// </summary>\n///\n/// <param name=\"functions\"> 包含函数的变长参数列表。</param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic FunctionStack([CanBeNull] params Function[] functions) : base(FUNCTION_NAME)\n\
  {\n  Functions = new Function[]{};\n  Add(functions);\n}\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary>\n/// 这不是一个高效的实现，因为它假设假设被频繁使用。\n/// </summary>\n///\n/// <param name=\"\
  function\"> 包含函数的变长参数列表。</param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic void Add([CanBeNull] params Function[] function)\n{\n  if (function\
  \ != null && function.Length > 0)\n  {\n    List<Function> functionList = new List<Function>();\n\
  \    if (Functions != null)\n    {\n      functionList.AddRange(Functions);\n  \
  \  }\n    functionList.AddRange(function.Where(t => t != null));\n    Functions\
  \ = functionList.ToArray();\n    InputNames = Functions[0].InputNames;\n    OutputNames\
  \ = Functions[Functions.Length - 1].OutputNames;\n  }\n}\n```\n\n/// <summary> 压缩此对象。</summary>\n\
  ```csharp\npublic void Compress()\n{\n  List<Function> functionList = new List<Function>(Functions);\n\
  \  // 压缩层\n  for (int i = 0; i < functionList.Count - 1; i++)\n  {\n    if (functionList[i]\
  \ is CompressibleFunction)\n    {\n      if (functionList[i + 1] is CompressibleActivation)\n\
  \      {\n        ((CompressibleFunction)functionList[i]).SetActivation((CompressibleActivation)functionList[i\
  \ + 1]);\n        functionList.RemoveAt(i + 1);\n      }\n    }\n  }\n  Functions\
  \ = functionList.ToArray();\n}\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 前向传播。</summary>\n///\n/// <param name=\"xs\"> 包含 xs 的变长参数列表。</param>\n\
  ///\n/// <returns> 一个 NdArray 数组。</returns>\n///\n/// <seealso cref=\"M:KelpNet.Common.Functions.Function.Forward(params\
  \ NdArray[])\"/>/>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\n[CanBeNull]\npublic override NdArray[] Forward([CanBeNull] params NdArray[]\
  \ xs)\n{\n  return Functions.Aggregate(xs, (current, t) => t.Forward(current));\n\
  }\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 反向传播。</summary>\n///\n/// <param name=\"ys\"> 包含 ys 的变长参数列表。</param>\n\
  ///\n/// <seealso cref=\"M:KelpNet.Common.Functions.Function.Backward(params NdArray[])\"\
  />\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic override void Backward([NotNull] params NdArray[] ys)\n{\n  NdArray.Backward(ys[0]);\n\
  }\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 权重更新过程。</summary>\n///\n/// <seealso cref=\"M:KelpNet.Common.Functions.Function.Update()\"\
  />/>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic override void Update()\n{\n  foreach (var function in Functions)\n\
  \  {\n    function.Update();\n  }\n}\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary>\n/// 执行处理后将特定数据恢复到初始值的过程。\n/// </summary>\n///\n/// <seealso cref=\"\
  M:KelpNet.Common.Functions.Function.ResetState()\"/>/>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic override void ResetState()\n{\n  foreach (Function function in\
  \ Functions)\n  {\n    function.ResetState();\n  }\n}\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 运行预测。</summary>\n///\n/// <param name=\"xs\"> 包含 xs 的变长参数列表。</param>\n\
  ///\n/// <returns> 一个 NdArray 数组。</returns>\n///\n/// <seealso cref=\"M:KelpNet.Common.Functions.Function.Predict(params\
  \ NdArray[])\"/>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\n[CanBeNull]\npublic override NdArray[] Predict([CanBeNull] params NdArray[]\
  \ xs)\n{\n  return Functions.Aggregate(xs, (current, t) => t.Forward(current));\n\
  }\n```\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 设置优化器。</summary>\n///\n/// <param name=\"optimizers\"> 包含优化器的变长参数列表。</param>\n\
  ///\n/// <seealso cref=\"M:KelpNet.Common.Functions.Function.SetOptimizer(params\
  \ Optimizer[])\"/>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic override void SetOptimizer([CanBeNull] params Optimizer[] optimizers)\n\
  {\n  foreach (Function function in Functions)\n  {\n    function.SetOptimizer(optimizers);\n\
  \  }\n}\n```\n\n## FunctionDictionary\n\n`FunctionDictionary` 是用于创建 Caffe 风格模型的可序列化函数字典。它用于\
  \ Caffe 数据模型加载器在从磁盘存储创建新函数时。对于不熟悉的人来说，Caffe 是一个以表达式、速度和模块化为设计的深度学习框架。它由 Berkeley\
  \ AI Research 以及多个社区贡献者共同开发。Kelp.Net 支持处理 Caffe 模型。测试 15 和 17 展示了此功能。\n\n以下是 `FunctionDictionary`\
  \ 对象的代码：\n\n```csharp\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <inheritdoc />\n/// <summary> (可序列化的) 函数字典。</summary>\n/// <seealso cref=\"\
  T:KelpNet.Common.Functions.Function\" />\n[Serializable]\npublic sealed class FunctionDictionary\
  \ : Function\n{\n  /// <summary> 函数的名称。</summary>\n  const string FUNCTION_NAME\
  \ = \"FunctionDictionary\";\n  /// <summary> 使用带有 I / O 键的 FunctionRecord 单元进行。</summary>\n\
  \  public Dictionary<string, FunctionStack> FunctionBlockDictionary = new Dictionary<string,\n\
  FunctionStack>();\n  /// <summary> 持有分区函数名称的字典。</summary>\n  public Dictionary<string,\
  \ FunctionStack> SplitedFunctionDictionary = new Dictionary<string,\nFunctionStack>();\n\
  }\n```\n\n\n\n\n\n```csharp\n/// <summary> 字典执行顺序列表。 </summary>\npublic List<FunctionStack>\
  \ FunctionBlocks = new List<FunctionStack>();\n\n/// <summary> 为 True 则压缩。 </summary>\n\
  private readonly bool _compress = false;\n\n/// <summary>\n/// 初始化 KelpNet.Common.Functions.Container.FunctionDictionary\n\
  /// 类的新实例。\n/// </summary>\n///\n/// <param name=”compress”> (可选) 设置为 True 进行压缩。</param>\n\
  /// <param name=”name”> (可选) 名称。</param>\n/// <param name=”inputNames”> (可选) 输入名称列表。</param>\n\
  /// <param name=”outputNames”> (可选) 输出名称列表。</param>\npublic FunctionDictionary(bool\
  \ compress = false, [CanBeNull] string name = FUNCTION_NAME,\n[CanBeNull] string[]\
  \ inputNames = null, [CanBeNull] string[] outputNames = null) : base(name,\ninputNames,\
  \ outputNames)\n{\n  _compress = compress;\n}\n\n/// <summary> 添加函数。 </summary>\n\
  ///\n/// <param name=”function”> 要添加的函数。</param>\npublic void Add([NotNull] Function\
  \ function)\n{\n  if (_compress && // 你是否想要汇总每个分支\n   (function is SingleInputFunction\
  \ || function is MultiOutputFunction)) // 仅一个函数\n    with input is gathered\n  {\n\
  \    // 检查字典中是否已通过输入名称注册\n    if (FunctionBlockDictionary.ContainsKey(function.InputNames[0]))\n\
  \    {\n      // 如果块已注册为字典，则合并到块中\n      FunctionBlockDictionary[function.InputNames[0]].Add(function);\n\
  \      // 覆盖输出名称\n      FunctionBlockDictionary[function.InputNames[0]].OutputNames\
  \ = function.OutputNames.\n      ToArray();\n      // 如果是拆分函数，更新拆分源输出名称\n      if\
  \ (SplitedFunctionDictionary.ContainsKey(function.InputNames[0]))\n      {\n   \
  \     FunctionStack spliteFunction = SplitedFunctionDictionary[function.InputNames[0]];\n\
  \        for (int i = 0; i < spliteFunction.OutputNames.Length; i++)\n        {\n\
  \         if (spliteFunction.OutputNames[i] == function.InputNames[0])\n       \
  \  {\n          spliteFunction.OutputNames[i] = function.OutputNames[0];\n     \
  \     if (!SplitedFunctionDictionary.ContainsKey(function.OutputNames[0]))\n   \
  \       {\n            SplitedFunctionDictionary.Add(function.OutputNames[0], spliteFunction);\n\
  \          }\n         }\n        }\n      }\n    }\n    if (!(function is MultiOutputFunction)\
  \ && // 如果输出分支，则不注册并断开\n    the link\n    !FunctionBlockDictionary.ContainsKey(function.OutputNames[0]))\
  \ // 如果已注册则不注册\n    {\n      // 将链接添加到字典\n      FunctionBlockDictionary.Add(function.OutputNames[0],\
  \ FunctionBlockDictionary[function.InputNames[0]]);\n    }\n    else if (function\
  \ is SplitFunction splitFunction)\n    {\n      var splitFunctions = splitFunction.SplitedFunctions;\n\
  \      for (int i = 0; i < splitFunctions.Length; i++)\n      {\n        // 将内部\
  \ FunctionStack 添加到链接字典\n        FunctionBlockDictionary.Add(splitFunction.OutputNames[i],\
  \ splitFunctions[i]);\n        // 添加到 SplitFunction 的列表\n        SplitedFunctionDictionary.Add(splitFunction.OutputNames[i],\
  \ FunctionBlockDictionary[function.InputNames[0]]);\n      }\n    }\n    return;\n\
  \  }\n}\n// 处理越少压缩越少，或者针对多输入、双输入处理\n//块是否在字典中注册\nif (FunctionBlockDictionary.ContainsKey(function.OutputNames[0]))\n\
  {\n  // 如果块已注册为字典，则合并到块中\n  FunctionBlockDictionary[function.OutputNames[0]].Add(function);\n\
  }\nelse\n{\n  // 如果未注册，则创建一个新块\n  FunctionStack functionRecord = new FunctionStack(function,\
  \ function.Name, function.\n  InputNames, function.OutputNames);\n  FunctionBlocks.Add(functionRecord);\n\
  \  FunctionBlockDictionary.Add(function.Name, functionRecord);\n}\n\n/// <summary>\
  \ 前向传播。 </summary>\n///\n/// <param name=”xs”> 包含 xs 的变长列表。</param>\n/// <returns>\
  \ 一个 NdArray[]。 </returns>\n///\n/// <seealso cref=\"KelpNet.Common.Functions.Container.FunctionDictionary.Forward(params\
  \ NdArray[])\" />\n[CanBeNull]\npublic override NdArray[] Forward([CanBeNull] params\
  \ NdArray[] xs)\n{\n  NdArray[] result = xs;\n  Dictionary<string, NdArray> outPuts\
  \ = new Dictionary<string, NdArray>();\n  // 在字典中注册第一个数据\n  for (int i = 0; i <\
  \ FunctionBlocks[0].InputNames.Length; i++)\n  {\n    outPuts.Add(FunctionBlocks[0].InputNames[i],\
  \ xs[i]);\n  }\n  // 按注册顺序执行\n  foreach (var t in FunctionBlocks)\n  {\n    string[]\
  \ inputNames = t.InputNames;\n    // 收集输入数据\n    // 实现函数\n    result = inputNames.Select(t1\
  \ => outPuts[t1]).ToArray();\n    // 在字典中注册输出数据\n    for (int j = 0; j < result.Length;\
  \ j++)\n    {\n      outPuts.Add(t.OutputNames[j], result[j]);\n    }\n  }\n  return\
  \ result;\n}\n\n/// <summary> 反向传播。 </summary>\n///\n/// <param name=”ys”> 包含 ys\
  \ 的变长列表。</param>\n///\n/// <seealso cref=\"KelpNet.Common.Functions.Container.FunctionDictionary.Backward(params\
  \ NdArray[])\" />\npublic override void Backward([NotNull] params NdArray[] ys)\n\
  {\n  NdArray.Backward(ys[0]);\n}\n\n/// <summary> 权重更新过程。 </summary>\n///\n/// <seealso\
  \ cref=\"KelpNet.Common.Functions.Container.FunctionDictionary.Update()\" />\npublic\
  \ override void Update()\n{\n  foreach (var functionBlock in FunctionBlocks)\n \
  \ {\n    functionBlock.Update();\n  }\n}\n\n/// <summary>\n/// 执行特定处理后将特定数据恢复到初始值。\
  \ </summary>\n///\n/// <seealso cref=\"KelpNet.Common.Functions.Container.FunctionDictionary.ResetState()\"\
  \ />\npublic override void ResetState()\n{\n  foreach (var functionBlock in FunctionBlocks)\n\
  \  {\n    functionBlock.ResetState();\n  }\n}\n\n/// <summary> 运行预测。 </summary>\n\
  ///\n/// <param name=”xs”> 包含 xs 的变长列表。</param>\n///\n/// <returns> 一个 NdArray[]。\
  \ </returns>\n///\n/// <seealso cref=\"KelpNet.Common.Functions.Container.FunctionDictionary.Predict(params\
  \ NdArray[])\" />\n[CanBeNull]\npublic override NdArray[] Predict([CanBeNull] params\
  \ NdArray[] xs)\n{\n  NdArray[] result = xs;\n  // 输出数据字典\n  Dictionary<string,\
  \ NdArray> outPuts = new Dictionary<string, NdArray>();\n}\n```\n\n\n\n\n```cs\n\
  // 在字典中注册输出数据\nfor (int j = 0; j < FunctionBlocks[0].InputNames.Length; j++)\n{\n\
  \  outPuts.Add(FunctionBlocks[0].InputNames[j], xs[j]);\n}\nforeach (var t in FunctionBlocks)\n\
  {\n  string[] inputBlockNames = t.InputNames;\n  // 收集输入数据\n  // 实现函数\n  result\
  \ = t.Predict(inputBlockNames.Select(t1 => outPuts[t1]).ToArray());\n  // 在字典中注册输出数据\n\
  \  for (int j = 0; j < result.Length; j++)\n  {\n    outPuts.Add(t.OutputNames[j],\
  \ result[j]);\n  }\n}\nreturn result;\n}\n```\n\n//////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 设置优化器。 </summary>\n/// <param name=\"optimizers\"> 包含优化器的变长参数列表。 </param>\n\
  /// <seealso cref=\"M:KelpNet.Common.Functions.Function.SetOptimizer(params Optimizer[])\"\
  />\n//////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \n```cs\npublic override void SetOptimizer([CanBeNull] params Optimizer[] optimizers)\n\
  {\n  foreach (var functionBlock in FunctionBlocks)\n  {\n    functionBlock.SetOptimizer(optimizers);\n\
  \  }\n}\n}\n```\n\n## SplitFunction\n\n`SplitFunction` 是一个具有多个输出函数。\n\n以下是 `SplitFunction`\
  \ 对象的代码：\n\n```cs\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> (序列化) 一个拆分函数。 </summary>\n/// <seealso cref=\"T:KelpNet.Common.Functions.Type.MultiOutputFunction\"\
  />\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [Serializable]\npublic class SplitFunction : MultiOutputFunction\n{\n  /// <summary>\
  \ 函数名。 </summary>\n  const string FUNCTION_NAME = \"SplitFunction\";\n  /// <summary>\
  \ 拆分数量。 </summary>\n  private readonly int _splitNum;\n  /// <summary> 拆分后的函数。 </summary>\n\
  \  public FunctionStack[] SplitedFunctions;\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary>\n  /// 初始化 KelpNet.Common.Functions.Container.SplitFunction 类的新实例。\n\
  \  /// </summary>\n  /// <param name=\"splitNum\"> (可选) 拆分数量。 </param>\n  /// <param\
  \ name=\"name\"> (可选)  own。 </param>\n  /// <param name=\"inputNames\"> (可选) 输入名称的列表。\
  \ </param>\n  /// <param name=\"outputNames\"> (可选) 输出名称的列表。 </param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  public SplitFunction(int splitNum = 2, [CanBeNull] string name = FUNCTION_NAME,\
  \ [CanBeNull] string[] inputNames = null, [CanBeNull] string[] outputNames = null)\
  \ : base(name, inputNames, outputNames)\n  {\n    _splitNum = splitNum;\n    SplitedFunctions\
  \ = new FunctionStack[splitNum];\n    for (int i = 0; i < SplitedFunctions.Length;\
  \ i++)\n    {\n      SplitedFunctions[i] = new FunctionStack(new Function[] { },\
  \ name + i, new[] { inputNames[0] }, new[] { outputNames[i] });\n    }\n    SingleInputForward\
  \ = ForwardCpu;\n    SingleOutputBackward = BackwardCpu;\n  }\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> CPU 前向传播。 </summary>\n  /// <param name=\"x\"> 需要处理的 NdArray。 </param>\n\
  \  /// <returns> 一个 NdArray[]。 </returns>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  [NotNull]\n  private NdArray[] ForwardCpu([CanBeNull] NdArray x)\n  {\n    NdArray[]\
  \ result = new NdArray[_splitNum];\n    for (int i = 0; i < result.Length; i++)\n\
  \    {\n      result[i] = SplitedFunctions[i].Forward(x)[0];\n    }\n    return\
  \ result;\n  }\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> CPU 反向传播。 </summary>\n  /// <param name=\"ys\"> ys。 </param>\n\
  \  /// <param name=\"x\"> 需要处理的 NdArray。 </param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  private void BackwardCpu([CanBeNull] NdArray ys, [CanBeNull] NdArray x)\n  {\n\
  \  }\n\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 评估。 </summary>\n  /// <param name=\"xs\"> 包含优化器的变长参数列表。 </param>\n\
  \  /// <returns> 一个 NdArray[]。 </returns>\n  /// <seealso cref=\"M:KelpNet.Common.Functions.Function.Predict(params\
  \ NdArray[])\"/>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  [NotNull]\n  public override NdArray[] Predict([CanBeNull] NdArray[] xs)\n  {\n\
  \    NdArray[] result = new NdArray[_splitNum];\n    for (int i = 0; i < result.Length;\
  \ i++)\n    {\n      result[i] = SplitedFunctions[i].Forward(x)[0];\n    }\n   \
  \ return result;\n  }\n}\n```\n\n## SortedList\n\n`SortedList` 对象正如其名所示。它包含一个排序后的函数列表。\n\
