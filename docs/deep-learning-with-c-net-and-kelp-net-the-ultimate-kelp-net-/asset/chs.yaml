  - `SoftmaxCrossEntropy`\n\n## MeanSquaredError\n\n以下是 `MeanSquaredError` 对象的代码：\n\
  ```csharp\npublic class MeanSquaredError : LossFunction\n{\n  /// <summary> 评估。</summary>\n\
  \  /// <exception cref=\"Exception\"> 当发生异常条件时抛出异常。</exception>\n  /// <param name=\"\
  input\"> 输入。</param>\n  /// <param name=\"teachSignal\"> 教学信号。</param>\n  /// <returns>\
  \ 一个 Real。 </returns>\n  /// <seealso cref=\"M:KelpNet.Common.Loss.LossFunction.Evaluate(NdArray[],NdArray[])\"\
  />\n  public override Real Evaluate([NotNull] NdArray[] input, [NotNull] NdArray[]\
  \ teachSignal)\n  {\n    Real resultLoss = 0;\n    #if DEBUG\n    if (input.Length\
  \ != teachSignal.Length) throw new Exception(\"Input and teacher size are different\"\
  );\n    #endif\n    for (int k = 0; k < input.Length; k++)\n    {\n      Real sumLoss\
  \ = 0;\n      Real[] resultArray = new Real[input[k].Data.Length];\n      for (int\
  \ b = 0; b < input[k].BatchCount; b++)\n      {\n        Real localloss = 0;\n \
  \       Real coeff = 2.0 / teachSignal[k].Length;\n        int batchoffset = b *\
  \ teachSignal[k].Length;\n        for (int i = 0; i < input[k].Length; i++)\n  \
  \      {\n          Real result = input[k].Data[b * input[k].Length + i] - teachSignal[k].Data[batchoffset\
  \ + i];\n          localloss += result * result;\n          resultArray[batchoffset\
  \ + i] *= coeff;\n        }\n        sumLoss += localloss / teachSignal[k].Length;\n\
  \      }\n      resultLoss += sumLoss / input[k].BatchCount;\n      input[k].Grad\
  \ = resultArray;\n    }\n    resultLoss /= input.Length;\n    return resultLoss;\n\
  \  }\n}\n```\n\n## SoftmaxCrossEntropy\n\n以下是 `SoftmaxCrossEntropy` 对象的代码：\n```csharp\n\
  public class SoftmaxCrossEntropy : LossFunction\n{\n  /// <summary> 评估。</summary>\n\
  \  /// <exception cref=\"Exception\"> 当发生异常条件时抛出异常。</exception>\n  /// <param name=\"\
  input\"> 输入。</param>\n  /// <param name=\"teachSignal\"> 包含教学信号的变长参数列表。</param>\n\
  \  /// <returns> 一个 Real。 </returns>\n  /// <seealso cref=\"M:KelpNet.Common.Loss.LossFunction.Evaluate(NdArray[],params\
  \ NdArray[])\"/>\n  public override Real Evaluate([NotNull] NdArray[] input, [NotNull]\
  \ params NdArray[] teachSignal)\n  {\n    Real resultLoss = 0;\n    #if DEBUG\n\
  \    if (input.Length != teachSignal.Length) throw new Exception(\"Input and teacher\
  \ size are different\");\n    #endif\n    for (int k = 0; k < input.Length; k++)\n\
  \    {\n      Real localloss = 0;\n      Real[] gx = new Real[input[k].Data.Length];\n\
  \      for (int b = 0; b < input[k].BatchCount; b++)\n      {\n        Real maxIndex\
  \ = 0;\n        for (int i = 0; i < teachSignal[k].Length; i++)\n        {\n   \
  \       if (maxIndex < teachSignal[k].Data[i + b * teachSignal[k].Length])\n   \
  \         maxIndex = teachSignal[k].Data[i + b * teachSignal[k].Length];\n     \
  \   }\n        Real[] logY = new Real[input[k].Length];\n        Real y = 0;\n \
  \       Real m = input[k].Data[b * input[k].Length];\n      }\n    }\n  }\n}\n```\n\
  \n\n\n\n\n```cpp\nfor (int i = 1; i < input[k].Length; i++)\n{\n  if (m < input[k].Data[i\
  \ + b * input[k].Length])\n    m = input[k].Data[i + b * input[k].Length];\n  }\n\
  \  for (int i = 0; i < input[k].Length; i++)\n    y += Math.Exp(input[k].Data[i\
  \ + b * input[k].Length] - m);\n  m += Math.Log(y);\n  for (int i = 0; i < input[k].Length;\
  \ i++)\n    logY[i] = input[k].Data[i + b * input[k].Length] - m;\n    localloss\
  \ += -logY[(int)maxIndex];\n  for (int i = 0; i < logY.Length; i++)\n    gx[i +\
  \ b * input[k].Length] = Math.Exp(logY[i]);\n    gx[(int)maxIndex + b * input[k].Length]\
  \ -= 1;\n  }\n  resultLoss += localloss / input[k].BatchCount;\n  input[k].Grad\
  \ = gx;\n  }\n  resultLoss /= input.Length;\n  return resultLoss;\n}\n\n}\n```\n\
  \n### 数据集 (Datasets)\n\n在整个示例测试中，我们将对使用的数据进行创建、尝试并保持一致。为了做到这一点，我们需要利用以下机器学习数据集。当某个数据集在任何测试中可能不受支持时，将在该数据集的主标题下进行说明。\n\
  \n### CIFAR-10\n\nCIFAR-10 数据集包含 60,000 张 32x32 的彩色图像，分为 10 个类，每类包含 6,000 张图像。它有\
  \ 50,000 张训练图像和 10,000 张测试图像。该数据集分为五个训练批次（batches）和一个测试批次，每个批次包含 10,000 张图像。测试批次包含从每个类中随机选择的\
  \ 1,000 张图像。训练批次包含随机顺序的剩余图像，但某些训练批次中某一个类的图像可能比其他类多。所有训练批次合起来，每个类恰好包含 5,000 张图像。\n\
  \n以下是该数据集包含的图像示例。这些类别之间完全互斥：\n\n![](img/p286-001.jpg)\n\n### CIFAR-100\n\nCIFAR-100\
  \ 数据集与 CIFAR-10 数据集类似，但它有 100 个类，每类包含 600 张图像。每类有 500 张训练图像和 100 张测试图像。CIFAR-100\
  \ 中的 100 个类被分为 20 个超类（superclasses）。每张图像都带有一个细粒度标签（所属类别）和一个粗粒度标签（所属的超类）。以下是 CIFAR-100\
  \ 数据集的类别列表：\n\n| 超类 (Superclass) | 类别 (Classes) |\n| :--- | :--- |\n| 水生哺乳动物 | 海狸、海豚、水獭、海豹和鲸鱼\
  \ |\n| 鱼类 | 鱼族鱼、平鱼、鱼鱼、鲨鱼和鳟鱼 |\n| 花类 | 兰花、罂粟、玫瑰、向日葵和郁金香 |\n| 食品容器 | 瓶子、碗、罐头、杯和盘子\
  \ |\n| 水果蔬菜 | 苹果、蘑菇、橙子、梨和甜椒 |\n| 家用电器 | 钟、电脑键盘、灯、电话和电视机 |\n| 家用家具 | 床、椅子、沙发、桌子和衣柜\
  \ |\n| 昆虫 | 蜜蜂、甲虫、蝴蝶、幼虫和蟑螂 |\n| 大型肉肉动物 | 熊、豹子、狮子、老虎和狼 |\n| 大型人造户外物品 | 桥梁、城堡、房屋、道路和摩天大楼\
  \ |\n| 大型自然户外景观 | 云、森林、山脉、平原和海洋 |\n| 大型杂食动物和草食动物 | 骆驼、牛、黑猩猩、大象和袋鼠 |\n| 中型哺乳动物 |\
  \ 狐狸、豪猪、负鼠、浣和臭鼬 |\n| 非昆虫无脊椎动物 | 螃蟹、龙虾、蜗牛、蜘蛛和虫 |\n| 人 | 婴儿、男孩、女孩、男人和女人 |\n| 爬行动物\
  \ | 鳄鱼、恐龙、蜥蜴、蛇和龟 |\n| 小型哺乳动物 | \U0001F439、鼠、兔子、鼩和松鼠 |\n| 树 | 枫树、橡树、棕榈、松树和柳树 |\n\
  | 车辆 1 | 自行车、巴士、摩托车、皮卡和火车 |\n| 车辆 2 | 草机械、火箭、电车、坦克和拖拉机 |\n\n### MNIST\n\nMNIST 数据库是一个大型手写数字数据库，用于训练各种图像处理系统。该数据库也广泛用于机器学习领域的训练和测试。它包含\
  \ 60,000 个示例的训练集和 10,000 个示例的测试集。数字经过了尺寸归一化并在固定大小的图像中，使其成为想要尝试的标准。\n\n### 街景数字 (SVHN)\n\
  \nSVHN 数据集与 MNIST（裁剪后的数字）类似，但它包含了 600,000 张来自 Google 街景的标记图像。在本文写作时，Kelp.Net 尚未支持\
  \ SVHN。\n\n![](img/p288-001.jpg)\n\n## 总结\n\n在本章中，我们讨论了 Kelp.Net 的每一个部分。我们还讨论了将使用的数据集。接下来，开始实践吧！\n\
  \n## 参考文献 (References)\n\n你可能知道，你会花费大量时间在测试和训练算法上。除了加载和保存模型，这可能是你最常用的操作。幸运的是，Kelp.Net\
  \ 让这个过程变得非常简单，并提供了许多函数来帮助你。Kelp.Net 有一个 `Trainer` 类，封装了训练模型所需的所有代码。基础函数是 `Train`\
  \ 方法，列如下：\n\n\n\n\n除了基本的 `Train` 方法外，还有几个更具体的方法可以对你有所帮助并节省编码时间。这些函数基本上节省了手动指定用于训练的\
  \ `LossFunction` 的时间。根据函数的名称，系统会在内部为您创建 `LossFunction` 以提供便利。\n\n额外的训练方法如下：\n\n\
  * `TrainWithSoftmaxCrossEntropy`\n* `TrainWithMeanSquaredError`\n* `TrainWithRootMeanSquaredError`\n\
  \n一旦创建了 `FunctionStack` 或 `SortedFunctionStack` 并设置了你的优化器（们），你就可以调用 `Train` 方法并执行训练。\n\
  \n这里是一个简单的示例，展示了我们如何使用 `TrainWithSoftmaxCrossEntropy` 方法。在这个示例中，我们将创建一个包含线性层、Sigmoid\
  \ 层以及随机梯度下降（动量）优化器的小型函数栈。一旦创建了它们，我们就会对数据进行迭代并训练算法。`Train` 算法需要一个 `LossFunction`\
  \ 来来配合工作，你可以在 `MeanSquaredError` 或 `SoftmaxCrossEntropy` 函数之间进行选择。\n\n```csharp\n\
  const int learningCount = 10000;\n\nReal[][] trainData =\n{\n    new Real[] { 0,\
  \ 0 },\n    new Real[] { 1, 0 },\n    new Real[] { 0, 1 },\n    new Real[] { 1,\
  \ 1 }\n};\n\nReal[][] trainLabel =\n{\n    new Real[] { 0 },\n    new Real[] { 1\
  \ },\n    new Real[] { 1 },\n    new Real[] { 0 }\n};\n\nFunctionStack nn = CommonStacks.SimpleLinearSigmoidStack(\"\
  Test1\", 2, 2, new MomentumSGD());\n\nfor (int i = 0; i < learningCount; i++)\n\
  \    for (int j = 0; j < trainData.Length; j++)\n        Trainer.TrainWithSoftmaxCrossEntropy(nn,\
  \ trainData[j], trainLabel[j]);\n```\n\n## 准确率 (Accuracy)\n\n`Trainer` 对象提供的另一个项目是获取模型准确率的一种快速简单的方法。这里是一个测试模型准确率的函数调用示例：\n\
  \n```csharp\nReal accuracy = Trainer.Accuracy(nn, datasetY.Data, datasetY.Label);\n\
  ```\n\n下面的截图显示了执行此函数调用期间 ReflectInsight 的运行情况，你可以看到准确率正在被跟踪和报告：\n\n![](img/p294-001.jpg)\n\
  \n本节如果没有提供关于如何提高模型准确率和预测能力的建议将是不完整的，从而产生更好的结果：\n\n* 确保你拥有涵盖几乎所有场景的多样化数据，并且偏向任何单一场景。不要在有限的数据上工作，而是请求更多数据，这将提高模型的准确率。\n\
  * 你必须正确处理离群值和缺失值以提高准确率。有多种方法可以实现，例如对于连续特征填充均值、中位数或众数，对于分类特征使用类。对于离群值，要么删除它们要么进行某些转换。\n\
  * 找到对结果影响最大的正确特征是提高准确率的关键方面之一。这将得益于更好的领域知识和可视化。在部署机器学习算法之前，务必考虑尽可能多的相关特征和潜在结果。\n\
  * 集成模型（Ensemble models）通过袋法（bagging）和提升法（boosting）结合多个模型来提高准确率。这比任何单一模型都能提高预测性能。`Random`\
  \ 森林被多次用于集成。\n* 在适当的时间频率对模型进行重新验证。随着数据的变化，有必要用新数据对模型重新评分。如果需要，定期使用不同的技术重新构建模型以挑战模型。\n\
  \n## 定时 (Timing)\n\n在对模型进行测试和训练时，清楚地看到系统中的瓶颈在哪里，以及监控你的系统和模型性能是非常重要的。Kelp.Net 为开发者提供了卓越的调试信息，比任何其他深度学习框架都更出色。Kelp.Net\
  \ 中的许多类都包含广泛的调试和计时信息，这些信息将打印到 ReflectInsight 实时查看器（如下所示），帮助你理解算法的运行情况。这些信息在执行的所有阶段都是无价的。\n\
  \n下面的截图描述了一个深度学习模型通过系列测试并显示内部信息。你不需要对代码进行插桩，`Kelp.Net` 已内置了这一切，无需任何额外工作即可使用。\n\n\
  ![](img/p295-001.jpg)\n\n## 常用栈 (Common stacks)\n\nKelp.Net 有*常用栈*（common stacks）的概念，它们是预定义的\
  \ `FunctionStacks`，可以极大地减少你需要编写的代码量。以下是几个预定义的函数栈，你可以看到扩展此类类以包含更多常用的函数栈是多简单：\n\n\
  ```csharp\npublic static class CommonStacks\n{\n    ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \    /// <summary> 简单的线性 sigmoid 栈。 </summary>\n    /// <param name=\"name\"> 名称。</param>\n\
