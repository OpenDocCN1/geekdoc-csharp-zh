  \ + i] = Math.Exp(x.Data[indexOffset + i] - maxval);\n        sumval += y[indexOffset\
  \ + i];\n      }\n      for (int i = 0; i < x.Length; i++)\n      {\n        y[indexOffset\
  \ + i] /= sumval;\n      }\n      indexOffset += x.Length;\n    }\n    return NdArray.Convert(y,\
