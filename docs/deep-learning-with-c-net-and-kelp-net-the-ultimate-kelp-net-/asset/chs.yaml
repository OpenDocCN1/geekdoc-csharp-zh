  \  }\n}\n}\n\n### 激活函数\n\n基本上，激活函数是一种代表电位触发率的抽象。在最简单的形式下，该函数是二元的，这意味着该函数（神经元）要么触发（被激活、开启），要么不触发（未激活、关闭）。请参阅*第\
  \ 3 章，使用 ReflectInsight 进行深度插桩*以获取有关激活函数的更多详细信息。\n\nKelp.Net 提供了以下激活函数：\n\n* ArcSinH\n\
  * ArcTan\n* ELU\n* Gaussian\n* LeakyReLU\n* LeakyReLUShifted\n* LogisticFunction\n\
  * MaxMinusOne\n* PolynomialApproximantSteep\n* QuadraticSigmoid\n* RbfGaussian\n\
  * ReLU\n* ReLuTanh\n* ScaledELU\n* Sigmoid\n* Sine\n* Softmax\n* Softplus\n* SReLU\n\
  * SReLUShifted\n* Swish\n* Tanh\n\n## 激活函数图\n\n这里是了不同激活函数在绘图时视觉效果的截图：\n\n![](img/p172-001.jpg)\n\
  \n## ArcSinH\n\n这是 ArcSinH 对象的代码：\n\n```csharp\n[Serializable]\npublic class ArcSinH\
  \ : CompressibleActivation\n{\n  /// <summary> 函数名称。 </summary>\n  const string\
  \ FUNCTION_NAME = “ArcSinH”;\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary>\n  /// 初始化 KelpNet.Functions.Activations.ArcSinH 类的新实例。\n  ///\
  \ </summary>\n  ///\n  /// <param name=”name”> (可选) 名称。 </param>\n  /// <param name=”inputNames”>\
  \ (可选) 输入名称列表。 </param>\n  /// <param name=”outputNames”> (可选) 输出名称列表。 </param>\n\
  \  /// <param name=”gpuEnable”> (可选) 如果启用 GPU 则为 True。 </param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  public ArcSinH([CanBeNull] string name = FUNCTION_NAME, [CanBeNull] string[]\
  \ inputNames = null, [CanBeNull] string[] outputNames = null, bool gpuEnable = false)\
  \ : base(FUNCTION_NAME, null, name, inputNames, outputNames, gpuEnable)\n  {\n \
  \ }\n  internal override Real ForwardActivate(Real x, [CanBeNull] Real[] args)\n\
  \  {\n    return x;\n  }\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 在 / / .Net 中使用的虚拟函数。 </summary>\n  ///\n  /// <param name=”x”>\
  \ 需要处理的 Real 类型。 </param>\n  ///\n  /// <returns> Real 类型。 </returns>\n  ///\n \
  \ /// <seealso cref=”M:KelpNet.Common.Functions.CompressibleActivation.ForwardActivate(Real)”/>\n\
  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  internal override Real ForwardActivate(Real x)\n  {\n    return (Real)(1.2567348023993685\
  \ * ((Math.Log(x + Math.Sqrt((x * x)) + 1.0) * 0.5));\n  }\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 反向激活。 </summary>\n  ///\n  /// <param name=”gy”> gy。 </param>\n\
  \  /// <param name=”y”> 需要处理的 Real 类型。 </param>\n  ///\n  /// <returns> Real 类型。\
  \ </returns>\n  ///\n  /// <seealso cref=”M:KelpNet.Common.Functions.CompressibleActivation.BackwardActivate(Real,Real)”/>\n\
  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  internal override Real BackwardActivate(Real gy, Real y)\n  {\n    return gy\
  \ * (1 - y * y);\n  }\n}\n```\n\n### ArcTan\n\n这是 ArcTan 对象的代码：\n\n```csharp\n[Serializable]\n\
