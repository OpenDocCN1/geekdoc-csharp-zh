- "# C# 深度学习：. 与 Kelp.Net：终极 Kelp.Net 深度学习指南\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n# 关于作者\n**Matt R. Cole** 是一位资深开发者和作家，在 Microsoft Windows、C、C++、C#\
  \ 和 .Net 领域拥有超过 30 年的经验。他是 Evolved AI Solutions 的所有者，这是一家先进机器学习/生物人工智能技术的领先提供商。他开发了第一个企业级微服务框架（完全用\
  \ C# 和 .Net 编写），并供纽约的一家大型对冲基金使用，还开发了第一个生物人工智能集群框架，该框架完全整合了镜像神经元和规范神经元。他继续突破机器学习、生物人工智能或群智能人工智能、深度学习以及微服务的边界。在空余时间，他通过参加所有可能的高级数学、AI/ML/DL、量子力学/物理学、弦理论和计算神经科学课程继续学习，并为\
  \ `Kelp.Net` 等开源项目做出贡献。\n\n# 审核员\n**Gaurav Arora** 拥有计算机科学硕士学位。他是微软 X-MVP、印度计算机学会\
  \ (CSI) 终身会员、IndiaMentor 顾问成员、认证 Scrum 培训师/教练、ITIL-F 的 XEN 以及 PRINCE-F 和 PRINCE-P\
  \ 的 APMG 认证。他是一名开源开发者、TechNet Wiki 贡献者、Ovatic Systems Private Limited 的创始人。在 22\
  \ 多年的职业生涯中，他指导了数千名学生和行业专业人士。你可以在 Twitter 账号 @g_arora 上推特 Gaurav。\n\n# 前言\n对于各位 C#\
  \ 开发者来说，你们知道在不求助于 Python 或 R 等语言的情况下，要找到如何在应用程序中实现深度学习的良好示例是多么困难。这本书旨在为你提供实现这一目标所需的一切。你会发现\
  \ `Kelp.Net` 是一个创建强大且富有表现力的深度学习模型的价值工具。但我知道，在此过程中，可能会有人问你幕后正在发生什么。这就是为什么我选择选择并深度集成了\
  \ `ReflectInsight` 到本书中，这样所有的输出都将进入这个强大的日志应用程序中。最难回答的问题之一就是你的深度学习模型在背后做什么。这本书让你轻松回答这个问题。你不仅能够轻松地创建自己的深度学习模型，还能更好地理解背后正在发生的事情。对于每个想要学习深度学习的\
  \ C# 开发者来说，这本书都是必读的，也是 `Kelp.Net` 的参考指南。\n\n# 致谢\n如果没有我的妻子 Neda 每天给予的巨大支持，这本书就不可能完成。我还要感谢\
  \ BPB Publications 的所有人，给我机会写这本了不起的书，并为作者提供了一个极佳的支持平台。我要感谢 Mindy 和 Cocoa 给予的独特支持。我不希望有任何改变！最后，非常感谢所有读者购买本书，并迈出通往深度学习道路的第一步（或下一步）。祝愿你的旅程一帆风顺！\n\
