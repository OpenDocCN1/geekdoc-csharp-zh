  \ = null, [CanBeNull] string[] outputNames = null) : base(name, inputNames, outputNames)\n\
  {\n  _beta = beta;\n  _betaInv = 1 / _beta;\n  SingleInputForward = NeedPreviousForwardCpu;\n\
  \  SingleOutputBackward = NeedPreviousBackwardCpu;\n}\n```\n\n/// <summary> 需要之前的\
  \ CPU 前向计算。 </summary>\n///\n/// <param name=\"x\"> 需要处理的 NdArray。</param>\n///\n\
