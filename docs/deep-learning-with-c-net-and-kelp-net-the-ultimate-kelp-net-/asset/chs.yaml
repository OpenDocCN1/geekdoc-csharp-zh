  * `StochasticDepth`\n\n## Dropout\n\n以下是 `Dropout` 对象的代码：\n\n```csharp\n[Serializable]\n\
  public class Dropout : SingleInputFunction, IParallelizable\n{\n  /// <summary>\
  \ 函数名称。 </summary>\n  const string FUNCTION_NAME = “Dropout”;\n  /// <summary> 丢弃率。\
  \ </summary>\n  private readonly Real dropoutRatio;\n  /// <summary> 掩码栈。 </summary>\n\
  \  private readonly List<Real[]> maskStack = new List<Real[]>();\n  /// <summary>\
  \ 前向内核。 </summary>\n  [NonSerialized]\n  [DebuggerBrowsable(DebuggerState.Never)]\n\
  \  public ComputeKernel ForwardKernel;\n  /// <summary> 反向内核。 </summary>\n  [NonSerialized]\n\
  \  [DebuggerBrowsable(DebuggerState.Never)]\n  public ComputeKernel BackwardKernel;\n\
  \  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary>\n  /// 初始化 KelpNet.Functions.Noise.Dropout 类的新实例。\n  /// </summary>\n\
  \  ///\n  /// <param name=”dropoutRatio”> (可选) 丢弃率。</param>\n  /// <param name=”name”>\
  \ (可选) 名称。</param>\n  /// <param name=”inputNames”> (可选) 输入名称列表。</param>\n  ///\
  \ <param name=”outputNames”> (可选) 输出名称列表。</param>\n  /// <param name=”gpuEnable”>\
  \ (可选) 如果启用 GPU 则为 True。</param>\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  public Dropout(double dropoutRatio = 0.5, [CanBeNull] string name = FUNCTION_NAME,\n\
  \  [CanBeNull] string[] inputNames = null, [CanBeNull] string[] outputNames = null,\
  \ bool gpuEnable\n  = false) : base(name, inputNames, outputNames)\n  {\n    this.dropoutRatio\
  \ = dropoutRatio;\n    SetGpuEnable(gpuEnable);\n  }\n  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  \  /// <summary> 设置 GPU 启用。 </summary>\n  ///\n}\n```\n\n\n\n\n\n/// <param name=”enable”>\
  \ 设置为 True 启用，false 禁用。</param>\n///\n/// <returns> 如果成功则返回 True，如果失败则返回 false。</returns>\n\
  ///\n/// <seealso cref=”M:KelpNet.Common.Functions.IParallelizable.SetGpuEnable(bool)”/>\n\
  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic bool SetGpuEnable(bool enable)\n{\n  GpuEnable = enable & Weaver.Enable;\n\
  \  CreateKernel();\n  if (GpuEnable)\n  {\n    SingleInputForward = ForwardGpu;\n\
  \    SingleOutputBackward = BackwardGpu;\n  }\n  else\n  {\n    SingleInputForward\
  \ = ForwardCpu;\n    SingleOutputBackward = BackwardCpu;\n  }\n  return GpuEnable;\n\
  }\n```\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 创建内核。 </summary>\n///\n/// <seealso cref=”M:KelpNet.Common.Functions.IParallelizable.CreateKernel()”/>\n\
  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic void CreateKernel()\n{\n  if (GpuEnable)\n  {\n    string kernelSource\
  \ = Weaver.GetKernelSource(FUNCTION_NAME);\n    ComputeProgram program = Weaver.CreateProgram(kernelSource);\n\
  \    ForwardKernel = program.CreateKernel(“DropoutForward”);\n    BackwardKernel\
  \ = program.CreateKernel(“DropoutBackward”);\n  }\n}\n```\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 创建掩码。 </summary>\n///\n/// <param name=”xLength”> 长度。</param>\n///\n\
  /// <returns> 一个 Real[]。 </returns>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [NotNull]\n```csharp\nprivate Real[] MakeMask(int xLength)\n{\n  Real[] mask = new\
  \ Real[xLength];\n  Real scale = 1 / (1 - dropoutRatio);\n  for (int i = 0; i <\
  \ mask.Length; i++)\n    mask[i] = Mother.Dice.NextDouble() >= dropoutRatio ? scale\
  \ : 0;\n  maskStack.Add(mask);\n  return mask;\n}\n```\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> CPU 前向传播。 </summary>\n///\n/// <param name=”x”> 需要处理的 NdArray。</param>\n\
  ///\n/// <returns> 一个 NdArray。 </returns>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [NotNull]\n```csharp\npublic NdArray ForwardCpu([NotNull] NdArray x)\n{\n  Real[]\
  \ result = new Real[x.Data.Length];\n  Real[] mask = MakeMask(x.Length);\n  for\
  \ (int i = 0; i < x.Data.Length; i++)\n    result[i] = x.Data[i] * mask[i % mask.Length];\n\
  \  return NdArray.Convert(result, x.Shape, x.BatchCount, this);\n}\n```\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> GPU 前向传播。 </summary>\n///\n/// <param name=”x”> 需要处理的 NdArray。</param>\n\
  ///\n/// <returns> 一个 NdArray。 </returns>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  [NotNull]\n```csharp\npublic NdArray ForwardGpu([NotNull] NdArray x)\n{\n  Real[]\
  \ result = new Real[x.Data.Length];\n  Real[] mask = MakeMask(x.Length);\n  using\
  \ (ComputeBuffer<Real> gpuX = new ComputeBuffer<Real>(Weaver.Context,\n  ComputeMemoryFlags.ReadOnly\
  \ | ComputeMemoryFlags.CopyHostPointer, x.Data))\n  {\n    using (ComputeBuffer<Real>\
  \ gpuMask = new ComputeBuffer<Real>(Weaver.Context,\n  ComputeMemoryFlags.ReadOnly\
  \ | ComputeMemoryFlags.CopyHostPointer, mask))\n    {\n      using (ComputeBuffer<Real>\
  \ gpuY = new ComputeBuffer<Real>(Weaver.Context,\n  ComputeMemoryFlags.WriteOnly\
  \ | ComputeMemoryFlags.AllocateHostPointer, result.Length))\n      {\n        ForwardKernel.SetMemoryArgument(0,\
  \ gpuX);\n        ForwardKernel.SetMemoryArgument(1, gpuMask);\n        ForwardKernel.SetMemoryArgument(2,\
  \ gpuY);\n        ForwardKernel.SetValueArgument(3, mask.Length);\n        Weaver.CommandQueue.Execute(ForwardKernel,\
  \ null, new long[] { x.Data.Length }, null,\n        null);\n        Weaver.CommandQueue.Finish();\n\
  \        Weaver.CommandQueue.ReadFromBuffer(gpuY, ref result, true, null);\n   \
  \   }\n    }\n  }\n  return NdArray.Convert(result, x.Shape, x.BatchCount, this);\n\
  }\n```\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> CPU 反向传播。 </summary>\n///\n/// <param name=”y”> 需要处理的 NdArray。</param>\n\
  ///\n/// <param name=”x”> 需要处理的 NdArray。</param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic void BackwardCpu([NotNull] NdArray y, [NotNull] NdArray x)\n{\n\
  \  Real[] result = y.ToArray();\n  Real[] mask = maskStack[maskStack.Count - 1];\n\
  \  maskStack.RemoveAt(maskStack.Count - 1);\n  for (int b = 0; b < y.BatchCount;\
  \ b++)\n  {\n    for (int i = 0; i < mask.Length; i++)\n      result[b * mask.Length\
  \ + i] *= mask[i];\n  }\n  for (int i = 0; i < x.Grad.Length; i++)\n    x.Grad[i]\
  \ += result[i];\n}\n```\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> GPU 反向传播。 </summary>\n///\n/// <param name=”y”> 需要处理的 NdArray。</param>\n\
  ///\n/// <param name=”x”> 需要处理的 NdArray。</param>\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic void BackwardGpu([NotNull] NdArray y, [NotNull] NdArray x)\n{\n\
  \  Real[] result = y.ToArray();\n  Real[] mask = maskStack[maskStack.Count - 1];\n\
  \  maskStack.RemoveAt(maskStack.Count - 1);\n  using (ComputeBuffer<Real> gpuX =\
  \ new ComputeBuffer<Real>(Weaver.Context,\n  ComputeMemoryFlags.WriteWrite | ComputeMemoryFlags.CopyHostPointer,\
  \ result))\n  {\n    using (ComputeBuffer<Real> gpuMask = new ComputeBuffer<Real>(Weaver.Context,\n\
  \  ComputeMemoryFlags.ReadOnly | ComputeMemoryFlags.CopyHostPointer, mask))\n  \
  \  {\n      BackwardKernel.SetMemoryArgument(0, gpuX);\n      BackwardKernel.SetMemoryArgument(1,\
  \ gpuMask);\n      BackwardKernel.SetValueArgument(2, mask.Length);\n      Weaver.CommandQueue.Execute(BackwardKernel,\
  \ null, new long[] { result.Length }, null,\n      null);\n      Weaver.CommandQueue.Finish();\n\
  \      Weaver.CommandQueue.ReadFromBuffer(gpuX, ref result, true, null);\n    }\n\
  \  }\n  for (int i = 0; i < x.Grad.Length; i++)\n    x.Grad[i] += result[i];\n}\n\
  ```\n////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  /// <summary> 我在 Predict 时不执行任何操作。 </summary>\n///\n/// <param name=”input”> 输入。</param>\n\
  ///\n/// <returns> 一个 NdArray。 </returns>\n///\n/// <seealso cref=”M:KelpNet.Common.Functions.Type.SingleInputFunction.Predict(NdArray)”/>\n\
  ////////////////////////////////////////////////////////////////////////////////////////////////////\n\
  ```csharp\npublic override NdArray Predict(NdArray input)\n{\n  return input;\n\
  }\n}\n}\n\n## StochasticDepth\n\nStochasticDepth 是一种训练程序，它允许训练短网络并获得深度网络（是的，这不是拼写错误！）。我们从非常深的网络开始，但在训练期间，对于处理的每个小批量，我们会随机丢弃一部分层并跳过它们。生成的网络在训练时是短的，而在测试时是深度。它显著缩短了训练时间，并大幅提高了几乎所有数据集的测试误差。\n\
  \n以下是 StochasticDepth 对象的代码：\n\n```csharp\n[Serializable]\npublic class StochasticDepth\
  \ : Function // 用于替换 SplitFunction\n{\n  /// <summary> 函数名称。</summary>\n  const\
  \ string FUNCTION_NAME = “StochasticDepth”;\n  /// <summary> 概率。</summary>\n  private\
