  sum += CalPs(model, ts);\nwnum += ts.Count - 1;\n}\nelse\n{\n    unkWord = false;\n\
  }\nts.Clear();\n}\n}\n}\n\nstatic Real CalPs(FunctionStack model, List<int> s)\n\
  {\n    Real sum = 0;\n    NdArray h = new NdArray(new Real[N_UNITS]);\n    for (int\
  \ i = 1; i < s.Count; i++)\n    {\n        //l1\n        NdArray xK = model.Functions[0].Forward(true,\
  \ s[i])[0];\n        //l2\n        NdArray l2 = model.Functions[1].Forward(true,\
  \ h)[0];\n        for (int j = 0; j < xK.Data.Length; j++)\n        {\n        \
  \    xK.Data[j] += l2.Data[j];\n        }\n        //l2\n        h = model.Functions[2].Forward(true,\
  \ xK)[0];\n        //l3 l4\n        NdArray yv = model.Functions[4].Forward(true,\
  \ model.Functions[3].Forward(true, h))[0];\n        Real pi = yv.Data[s[i - 1]];\n\
  \        sum -= Math.Log(pi, 2);\n    }\n    return sum;\n}\n```\n\n### 输出\n\n![](img/p370-001.jpg)\n\
  \n### 学习率超参数测试\n\n此测试可以帮助你根据耗时为你的模型测试确定最佳学习率。基本上，它会遍历几个不同的学习率，运行训练和测试，然后记录每个对应的时间。它会报告每个学习率的观测数据和耗时，最后报告哪一个最快。\n\
  \n## 完整源代码\n\n完整的源代码如下所示，包含注释。你可以在 `Kelp.Net` 测试的 `Test23` 测试中找到这段源代码：\n\n```cs\n\
  const int learningCount = 10000;\nReal[][] trainData =\n{\n    new Real[] { 0, 0\
  \ },\n    new Real[] { 1, 0 },\n    new Real[] { 0, 1 },\n    new Real[] { 1, 1\
  \ }\n};\nReal[][] trainLabel =\n{\n    new Real[] { 0 },\n    new Real[] { 1 },\n\
  \    new Real[] { 1 },\n    new Real[] { 0 }\n};\nbool verbose = true;\nRILogManager.Add(\"\
  Test23\", \"Test23\");\nRILogManager.SetDefault(\"Test23\");\nStopwatch sw = new\
  \ Stopwatch(); sw.Start();\nFunctionStack nn = new FunctionStack(\"Test23\",\n \
  \   new Linear(verbose, 2, 2, name: \"l1 Linear\"),\n    new Sigmoid(name: \"l1\
  \ Sigmoid\"),\n    new Linear(verbose, 2, 2, name: \"l2 Linear\"));\nlong lBest\
  \ = 0L;\nDecimal bestLearningRate = 0M;\nTimeSpan bestElapsedTime = TimeSpan.Zero;\n\
  for (Decimal d = 0.0005M; d <= 1.0M; d+= 0.005M)\n{\n    nn.SetOptimizer(new RMSprop(\"\
  RMSProp\", Convert.ToDouble(d)));\n    Info(\"Training with learning rate of \"\
  \ + d);\n    for (int i = 0; i < learningCount; i++)\n    {\n        for (int j\
  \ = 0; j < trainData.Length; j++)\n        {\n            Trainer.Train(nn, trainData[j],\
  \ trainLabel[j], new SoftmaxCrossEntropy());\n        }\n    }\n    Info(\"Test\
  \ Start...\");\n    foreach (Real[] input in trainData)\n    {\n        NdArray\
  \ result = nn.Predict(true, input)?[0];\n        int resultIndex = Array.IndexOf(result?.Data,\
  \ result.Data.Max());\n        Info($\"{input[0]} xor {input[1]} = {resultIndex}\
  \ {result}\");\n    }\n    sw.Stop();\n    if (verbose)\n    {\n        RILogManager.Default?.SendDebug(\"\
  Test took \" + Helpers.FormatTimeSpan(sw.Elapsed));\n        RILogManager.Default?.ViewerSendWatch(d\
  \ + \" time\", Helpers.FormatTimeSpan(sw.Elapsed));\n    }\n    if (sw.ElapsedMilliseconds\
  \ < lBest)\n    {\n        lBest = sw.ElapsedMilliseconds;\n        bestLearningRate\
  \ = d;\n        bestElapsedTime = sw.Elapsed;\n    }\n    Info(\"Saving Model...\"\
  );\n    ModelIO.Save(nn, \"test23\");\n    Info(\"Best learning rate was \" + bestLearningRate\
  \ + \" which took \" + Helpers.FormatTimeSpan(bestElapsedTime));\n```\n\n### 输出\n\
