  \n在本章中，我们将讨论如何创建你自己的模型以及相关的测试，以训练、测试和运行这些模型。如果你无法保存和重用你的工作，那么完成这些工作是没有意义的，而我们需要的是模型的描述。此外，请记住，没有两个问题是相同的，因此，也没有两个解决方案是相同的。在创建模型后，你应该能够花费大量时间进行测试和训练、比较评估指标、调整并重复这一过程，直到达到预期结果。\n\
  \n你可以以任何你喜欢的方式编写模型测试。你在整个 Kelp.Net 中会看到的模式是 `Run` 方法的使用和暴露，它负责我们模型的所有重型工作。在下面提供的示例中，你将看到其中一个此类测试。\n\
  \n创建一个模型基本上由创建你希望使用的函数栈（function stack），然后选择并设置你偏好的优化器。完成后，你就可以按需要训练、测试模型，以及加载和保存它。让我们快速查看下面的示例：\n\
  \n### 示例\n\n以下代码是你为了创建自己的测试而需要实现的示例。\n\n```csharp\nclass TestExample\n{\n}\n```\n\
  \n### 实现 Run 函数\n\n在大多数模型测试中，你会发现执行测试的标准方法是通过 `Run` 方法。虽然这并不是固定不变或强制执行的，但这是早期建立的范式。你可以自由按照你想要的方式实现测试。重点不在于你如何执行测试，而在于你执行了测试。\n\
  \n`Run` 方法具有以下签名：\n\n```csharp\npublic static void Run()\n{\n}\n```\n\n下面是一个已实现的供你评审的完整\
  \ `Run` 函数：\n\n```csharp\npublic static void Run()\n{\n    const int learningCount\
  \ = 10000;\n    bool verbose = true;\n    Real[][] trainData =\n    {\n        new\
  \ Real[] { 0, 0 },\n        new Real[] { 1, 0 },\n        new Real[] { 0, 1 },\n\
  \        new Real[] { 1, 1 }\n    };\n    Real[][] trainLabel =\n    {\n       \
  \ new Real[] { 0 },\n        new Real[] { 1 },\n        new Real[] { 1 },\n    \
  \    new Real[] { 0 }\n    };\n}\n```\n\n### 使用你的函数创建 FunctionStack\n\n`FunctionStack`\
  \ 是一个链链的函数列表，用于执行前向、更新和后向函数。模型的唯一其他组件是优化器，我们将在下一节介绍。\n\n```csharp\nFunctionStack\
  \ nn = new FunctionStack(“Test1”,\n    new Linear(verbose, 2, 2, name: “l1 Linear”),\n\
  \    new Sigmoid(name: “l1 Sigmoid”),\n    new Linear(verbose, 2, 2, name: “l2 Linear”));\n\
  ```\n\n### 设置优化器\n\n优化器是模型的最后一个组件，并在函数栈完全组装之后添加。它通过提供一个派生自 `Optimizer` 基类的对象来设置。以下是设置优化器的方法。请记住你需要首先通过声明\
  \ `FunctionStack` 并使用此处所示返回的对象创建模型：\n\n```csharp\nnn.SetOptimizer(new MomentumSGD());\n\
  ```\n\n### 训练数据\n\n当 `FunctionStack` 和 `Optimizer` 创建并准备就绪后，你现在需要训练你的模型。使用你留出的训练数据集和标签（记住一个黄金法是使用单个数据集，将\
  \ 80-90% 用于训练，剩余用于测试。数据集中的行数越多，百分比就可以越高）。要训练你的模型，只需调用 `Trainer.Train` 方法。\n\n```csharp\n\
  for (int i = 0; i < learningCount; i++)\n{\n    for (int j = 0; j < trainData.Length;\
  \ j++)\n    {\n        Trainer.Train(nn, trainData[j], trainLabel[j], new SoftmaxCrossEntropy());\n\
  \    }\n}\n```\n\n### 进行预测\n\n接下来，在模型完全训练后，你可以按照如下方式对数据进行预测：\n\n```csharp\nforeach\
  \ (Real[] input in trainData)\n{\n    NdArray result = nn.Predict(true, input)?[0];\n\
  \    int resultIndex = Array.IndexOf(result?.Data, result.Data.Max());\n    Console.WriteLine($”{input[0]}\
  \ xor {input[1]} = {resultIndex} {result}”);\n}\n```\n\n### 保存模型\n\n模型通过 `ModelIO`\
  \ 类保存，并使用 `Save` 和 `Load` 方法（在适当的情况下进行了重载）完成。关于保存模型的一个快速说明是，你会发现模型的大小取决于你在流水线的何种位置调用保存方法。这是由于我们在书中之前讨论的\
  \ *Define-by-Run* 方法导致的。在测试和训练后保存模型得到的模型通常比在设置优化器后立即保存的模型要大：\n\n```csharp\nModelIO.Save(nn,\
  \ “test1.dn”);\n```\n\n### 加载模型\n\n保存到磁盘的模型可以使用 `ModelIO.Load` 加载。要加载模型，请遵循以下指令：\n\
  \n1. `ModelIO.Load`\n2. `ModelIO.Load`\n3. `FunctionStack`\n4. `Optimizer`\n5. `FunctionStack`\n\
  6. `Model.Load`\n\n## 总结\n\n在本章中，我们讨论了如何创建自己的模型和测试。我们涵盖了如何使用 `FunctionStack`、设置\
  \ `Optimizer`、训练数据以及保存/加载模型。\n\n### 感谢\n\n在此，我想非常感谢你购买并阅读本书。希望你阅读它像我写它一样愉快，并且带走了一大量的工具和技术。\n\
  \n## 附录 A\n\n### 评估指标\n\n本节将简要概述在评估深度学习模型时应该注意的一些术语和概念。仅仅产生一个模型是不够的，你需要指标来比较该模型的效率。\n\
  \n![](img/p383-001.jpg)\n\n### 指标术语\n\n一些重要的术语描述如下：\n\n| 术语 |  |\n| --- | --- |\n\
  | 真阳性 (True positives) | 预测为是且真实为是。 |\n| 真阴性 (True negatives) | 预测为否且真实为否。 |\n|\
  \ 假阳性 (False positives) | 预测为是但真实为否。这有时被称为第一类错误。 |\n| 假阴性 (False negatives) | 预测为否但真实为是。有时被称为第二类错误。\
  \ |\n| 准确率 (Accuracy) | 分类器有多准确？(TP + TN)/总数 |\n| 分类率 (Misclassification rate) |\
  \ 分类器有多错？(FP + FN)/总数。也等等于 1 减去准确率，有时被称为**错误率**。 |\n| 真阳性率 (True positive rate)\
  \ | 当真实为是时，预测为是的频率？(TP/实际是)。有时被称为**灵敏度**或**召回率**。 |\n| 假阳性率 (False positive rate)\
  \ | 当真实为否时，预测为是的频率？(FP/实际否) |\n| 真阴性率 (True negative rate) | 当真实为否时，预测为否的频率？(TN/实际否)。等于\
  \ 1 减去假阳性率，也称为**特异性**。 |\n| 精确率 (Precision) | 当预测为是时，准确的概率？(TP/预测为是) |\n\n\n\n\n\
  \n| 术语 | 描述 |\n| :--- | :--- |\n| **流行率 (Prevalence)** | 在样本中“是”条件出现的频率是多少？（实际是/总数）\
  \ |\n| **零假设错误率 (Null error rate)** | 如果你预测多数类，犯错误的概率有多大？ |\n| **F 分 (F score)**\
  \ | 真正例率（召回率）和精确率的加权平均值。 |\n| **ROC 曲线**![](img/p384-001.jpg) | 所有可能阈值下的性能总结。真正例率为\
  \ `Y` 轴，假正例率为 `X` 轴。 |\n| **检测率 (Detection rate)** | 整个样本中正确预测为 1 的百分比。 |\n| **检测流行率\
  \ (Detection prevalence)** | 预测为 1 的全样本占百分比。 |\n| **平衡准确率 (Balanced accuracy)**\
  \ | 正确预测 1 和 0 之间的平衡。 |\n| **召回率 (Recall)** | 所有 1 中被正确预测的百分比。 |\n| **Cohens kappa**\
  \ | 衡量分类器性能与仅通过随机概率产生的性能相比的程度。 |\n| **一致性 (Concordance)** | 一致对对的比例。 |\n| **Somers\
  \ D** | 一致性与不一致性的组合。用于判断模型的效率。 |\n| **AUROC** | ROC 曲线下的面积。考虑了可能的概率截断点后，模型的真实性能。\
  \ |\n| **吉尼系数 (Gini coefficient)** | 模型在 ROC 方面超过随机预测的程度。 |\n\n### 混淆矩阵\n\n混淆矩阵是一个描述用于分类的模型性能的表格。该模型是根据一组已知真实值的测试数据创建的。\n\
  \n### 混淆矩阵示例\n\n![](img/p385-001.jpg)\n\n在上面的矩阵中，我们有两个可能的类别：`YES` 和 `NO`。真实值（已发生或存在的事件）将是\
  \ `YES`，其他将是 `NO`。预测总数为 `165`（所有行和列的总和）。在这些 `65` 次预测中，有 `110` 次结果为预测值为 `YES`，而 `55`\
  \ 次结果为预测值为 `NO`。\n\n## 附录 B\n\n### OpenCL\n\nKelp.Net 大量使用了开放计算语言，即 OpenCL。OpenCL\
  \ 将计算系统视为由多个计算设备组成，这些设备可能是连接到 CPU 的 CPU 或 GPU。在 OpenCL 设备上执行的函数称为 `kernels`（内核）。单个计算设备通常由多个计算单元组成，而计算单元又包含多个处理元素。单个内核执行可以在所有或许多处理元素上并行运行。\n\
  \n在 OpenCL 中，任务被调度到命令队列中。每个设备至少有一个命令队列。OpenCL 运行时将调度的数据并行任务拆分为部分，并将任务发送到设备处理元素。\n\
  \nOpenCL 定义了具有以下属性的内存层次结构：\n\n*   **全局内存 (Global)**：所有处理元素共享，且具有高延迟。\n*   **只读内存\
  \ (Read-only)**：较小、延迟较低，宿主机 CPU 可写，但计算设备不可写。\n*   **局部内存 (Local)**：由处理元素组共享。\n*\
  \   **逐元素内存 (Per-element)**：私有内存。\n\nOpenCL 还提供了一个更倾向于数学的`应用程序接口`（`API`）。这可以通过暴露固定长度的向量类型看出，例如\
  \ `float4`（四个单精度浮点数的向量），可用长度为 2, 3, 4, 8 和 16。随着你对 Kelp.Net 越来越熟悉并开始创建自己的函数，你将遇到\
  \ OpenCL 编程。目前，只需知道它的存在并在底层被广泛使用就足够了。\n\n### OpenCL 层级结构\n\n在 Kelp.Net 中，各种 OpenCL\
  \ 资源的层级结构所示：\n\n![](img/p388-001.jpg)![](img/p388-002.jpg)\n\n让我们详细描述这些内容：\n\n*\
  \   **计算内核 (Compute kernel)**：内核对象封装了程序中声明的特定内核函数以及执行该内核函数时使用的参数值。\n*   **计算程序 (Compute\
  \ program)**：由一组内核组成的 OpenCL 程序。程序还可以包含由内核函数调用的辅助函数和常量数据。\n*   **计算采样器 (Compute\
  \ sampler)**：描述在内核读取图像时如何进行采样的对象。图像读取函数接受采样器作为参数。采样器指定图像寻址模式（即如何处理超出坐标）、过滤模式以及输入图像坐标是归一化值还是非归一化值。\n\
  *   **计算设备 (Compute device)**：计算设备是计算单元集合。命令队列用于向设备队列命令。命令示例包括执行内核或读写内存对象。OpenCL\
  \ 设备通常对应 GPU、多核 CPU 以及其他处理器，如数字信号处理器 (`DSP`) 和 cell/B.E. 处理器。\n*   **计算资源 (Compute\
  \ resource)**：应用程序可以创建和删除的 OpenCL 资源。\n*   **计算对象 (Compute object)**：在 OpenCL 环境中通过句柄标识的对象。\n\
  *   **计算上下文 (Compute context)**：内核执行的实际环境，以及定义同步和内存管理的域。\n*   **计算命令队列 (Compute\
  \ command queue)**：命令队列是持有将在特定设备上执行的命令的对象。命令队列在`device` 上创建。\n*   **计算缓冲区 (Compute\
  \ buffer)**：用于存储线性数据的内存对象。\n*   **计算图像 (Compute image)**：用于存储图像的数据的内存对象。\n*   **计算平台\
  \ (Compute platform)**：提供 OpenCL 的实体。\n\n## 索引\n\n**A**\n\n*   激活函数 (activation\
