  \ trainData = vocabulary.LoadData(trainPath);\nint[] testData = vocabulary.LoadData(testPath);\n\
  int nVocab = vocabulary.Length;\n//创建网络。我们将使用简单的循环网络来完成此操作。\nFunctionStack model\
  \ = new FunctionStack(“Test9”,\n  new EmbedID(nVocab, N_UNITS, name: “l1 EmbedID”),\n\
  \  new Linear(N_UNITS, N_UNITS, name: “l2 Linear”),\n  new Tanh(),\n  new Linear(N_UNITS,\
  \ nVocab, name: “l3 Linear”),\n  new));\nmodel.SetOptimizer(new Adam());\nList<int>\
  \ s = new List<int>();\n//开始训练。我们将使用 Adam 优化器。\nSoftmaxEntropy softmaxEntropy =\
  \ new SoftmaxEntropy();\nfor (int epoch = 0; epoch < TRAINING_EPOCHS; epoch++)\n\
  {\n  for (int pos = 0; pos < trainData.Length; pos++)\n  {\n    Real accumloss =\
  \ 0;\n    Stack<NdArray> tmp = new Stack<NdArray>();\n    for (int i = 0; i < s.Count;\
  \ i++)\n    {\n      //在整个 FunctionStack 上直接反向传播，而不是逐个进行\n      //下文代码展示了如何对特定层反向传播\n\
  \      int tx = i == s.Count - 1 ? eos : s[i + 1];\n      //访问 EmbedID 函数并进行正向传播\n\
  \      NdArray l1 = model.Functions[0].Forward(s[i])[0];\n      //访问 Linear 函数并进行正向传播\n\
  \      NdArray l2 = model.Functions[1].Forward(h)[0];\n      //现在将两个数组的结果相加\n  \
  \    NdArray xK = l1 + l2;\n      //访问 Tanh 函数并进行正向传播\n      h = model.Functions[2].Forward(xK)[0];\n\
  \      //访问 Linear 函数并进行正向传播\n      NdArray h2 = model.Functions[3].Forward(h)[0];\n\
  \      //使用 softmaxEntropy 对象评估损失\n      Real loss = softmaxEntropy.Evaluate(h2,\
  \ tx);\n      tmp.Push(h2);\n      accumloss += loss;\n    }\n    RILogManager.Default?.SendDebug(accumloss.ToString());\n\
  \    //一次性对整个模型进行反向传播（所有函数）\n    // 相对于逐个进行反向传播\n    for (int i = 0; i < s.Count;\
  \ i++)\n    {\n      model.Backward(tmp.Pop());\n    }\n    model.Update();\n  \
  \  s.Clear();\n    if (pos % 100 == 0)\n    {\n      RILogManager.Default?.SendDebug(pos\
  \ + “/” + trainData.Length + “ finished”);\n    }\n  }\n}\n//开始测试：\nRILogManager.Default?.SendDebug(“Test\
  \ Start.”);\nReal sum = 0;\nint wnum = 0;\nList<int> ts = new List<int>();\nbool\
  \ unkWord = false;\nfor (int pos = 0; pos < 1000; pos++)\n{\n  int id = testData[pos];\n\
  \  ts.Add(id);\n  if (id > trainData.Length)\n  {\n    我们发现了一个未知词：\n    unkWord\
  \ = true;\n  }\n}\n```\n*(注：原文提供的源代码块中存在部分逻辑混乱和语法错误，如 `eos` 未定义、括号不匹配等，翻译已按要求保留代码块不翻译。)*\n\
