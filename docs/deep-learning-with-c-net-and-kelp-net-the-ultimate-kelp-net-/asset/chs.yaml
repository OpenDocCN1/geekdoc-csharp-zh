  \ Gamma;\n        Parameters[1] = Beta;\n        AvgMean = new NdArray(channelSize)\n\
  \        {\n            Name = Name + \" Mean\"\n        };\n        AvgVar = new\
  \ NdArray(channelSize)\n        {\n            Name = Name + \" Variance\"\n   \
  \     };\n        if (initialAvgMean != null)\n            AvgMean.Data = Real.GetArray(initialAvgMean);\n\
  \        if (initialAvgVar != null)\n            AvgVar.Data = Real.GetArray(initialAvgVar);\n\
  \        if (!IsTrain)\n        {\n            Parameters[2] = AvgMean;\n      \
  \      Parameters[3] = AvgVar;\n        }\n        SingleInputForward = ForwardCpu;\n\
  \        SingleOutputBackward = BackwardCpu;\n    }\n\n    /// <summary> CPU 前向传播。\
  \ </summary>\n    /// <param name=\"x\"> 需要处理的 NdArray。 </param>\n    /// <returns>\
  \ 一个 NdArray。 </returns>\n    [NotNull]\n    private NdArray ForwardCpu([NotNull]\
  \ NdArray x)\n    {\n        // 获取计算所需的参数\n        if (IsTrain)\n        {\n   \
  \         // 设置成员的均值和方差\n            Variance = new Real[ChannelSize];\n       \
  \     for (int i = 0; i < Variance.Length; i++)\n                Variance[i] = 0;\n\
  \            Mean = new Real[ChannelSize];\n            for (int i = 0; i < Mean.Length;\
  \ i++)\n            {\n                for (int index = 0; index < x.BatchCount;\
  \ index++)\n                    Mean[i] += x.Data[index * x.Length];\n         \
