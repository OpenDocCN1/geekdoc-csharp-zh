  \n### 循环神经网络语言模型 (RNNLM)\n\n在这个测试中，我们将构建并测试一个用于处理循环神经网络语言模型 (`RNNLM`) 的模型。这使用了简单的\
  \ RNN 架构。\n\n### 完整源代码\n\n完整的源代码如下所示，包含注释。你可以在 Kelp.Net 测试的 `Test9` 测试中找到这段源码：\n\
  \n```csharp\nconst int TRAINING_EPOCHS = 5;\nconst int N_UNITS = 100;\nconst string\
  \ DOWNLOAD_URL = “https://raw.githubusercontent.com/wojzaremba/lstm/master/\ndata/\"\
  ;\nconst string TRAIN_FILE = “ptb.train.txt”;\nconst string TEST_FILE = “ptb.test.txt”;\n\
