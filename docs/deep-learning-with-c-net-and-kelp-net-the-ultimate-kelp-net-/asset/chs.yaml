  \    RILogManager.Default?.SendDebug(\"sum: \" + sum);\n    RILogManager.Default?.SendDebug(\"\
  wnum: \" + wnum);\n    RILogManager.Default?.ViewerSendWatch(\"pos\", pos);\n  \
  \  RILogManager.Default?.ViewerSendWatch(\"tsLen\", ts.Count);\n    RILogManager.Default?.ViewerSendWatch(\"\
  sum\", sum);\n    RILogManager.Default?.ViewerSendWatch(\"wnum\", wnum);\n    sum\
  \ += CalPs(model, ts);\n    wnum += ts.Count - 1;\n  }\n  else\n  {\n    unkWord\
  \ = false;\n  }\n  ts.Clear();\n}\nRILogManager.Default?.SendDebug(Math.Pow(2.0,\
  \ sum / wnum).ToString());\n```\n\nstatic Real CalPs(FunctionStack model, List<int>\
  \ s)\n{\n  Real sum = 0;\n  NdArray h = new NdArray(new Real[N_UNITS]);\n  for (int\
  \ i = 1; i < s.Count; i++)\n  {\n    // 对前四个独立函数进行前向传播：\n    //l1 Linear\n    NdArray\
  \ xK = model.Functions[0].Forward(s[i])[0];\n    //l2 Linear\n    NdArray l2 = model.Functions[1].Forward(h)[0];\n\
  \    for (int j = 0; j < xK.Data.Length; j++)\n      xK.Data[j] += l2.Data[j];\n\
  \    //l2 Tanh\n    h = model.Functions[2].Forward(xK)[0];\n    //l3 Softmax(l3\
  \ Linear)\n    NdArray yv = model.Functions[4].Forward(model.Functions[3].Forward(h))[0];\n\
  \    Real pi = yv.Data[s[i - 1]];\n    sum -= Math.Log(pi, 2);\n  }\n  return sum;\n\
  }\n```\n\n### 词表\n\n在此模型中，我们将使用词表，因此让我们来讨论一下它是如何实现的。词表文件的加载是一个简单过程，由 `Vocabulary`\
  \ 类的 `LoadData` 方法处理，如下所示：\n\n```csharp\npublic List<string> Data = new List<string>();\n\
  public int EosID = -1;\npublic int Length => Data.Count;\npublic int[] LoadData(string\
  \ fileName)\n{\n  int[] result;\n  using (FileStream fs = new FileStream(fileName,\
  \ FileMode.Open))\n  {\n    StreamReader sr = new StreamReader(fs);\n    string\
  \ strText = sr.ReadToEnd();\n    sr.Close();\n    string[] replace = strText.Replace(\"\
  \\r\\n\", \"\\n\").Replace(\"\\n\", \"<EOS>\").Trim().Split(new[] { ' ' },\n   \
  \ StringSplitOptions.RemoveEmptyEntries);\n    Data.AddRange(replace);\n    Data\
  \ = new List<string>(Data.Distinct());\n    result = new int[replace.Length];\n\
  \    for (int i = 0; i < replace.Length; i++)\n      result[i] = Data.IndexOf(replace[i]);\n\
  \    if (EosID == -1)\n      EosID = Data.IndexOf(\"<EOS>\");\n  }\n  return result;\n\
  }\n```\n\n### 输出\n\n![](img/p322-001.jpg)\n\n### 词预测测试\n\n该网络模型经过训练，可以根据前面的词序列预测单词。为了实现这一点，我们创建了一个简单的神经网络来训练语言模型，该模型基于单词词的\
