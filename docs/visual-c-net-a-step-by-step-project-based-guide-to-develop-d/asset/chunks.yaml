    在第二章中，你将构建一个项目，让孩子们可以练习加、减、乘、除基础操作。这个 `Math Game`（数学游戏）项目可以用于选择题目类型以及你想使用的因素。该项目有三种计时选项。将展示
    `0` 到 `9` 之间数值的随机数学题。提供了计时选项来衡量准确性和速度。程序中使用了许多控件。两个 `label` 控件用于标题信息，两个用于显示分数。表单中间有一个宽大的
    `label` 用于显示数学题。此外，一个长细的 `label` 被用作分隔符。两个 `button` 控件用于开始和停止问题，还有一个 `button`
    用于退出项目。有三个 `group` 控件组框。第一个组框包含四个 `checkbox` 控件，用于选择题目类型。第二个组框包含 11 个 `radio buttons`（单选按钮），用于选择作为计算因子的数值。第三个组框包含三个
    `radio button` 控件用于计时选项。一个 `scrollbar`（滚动条）控制杆用于改变时间。


    在第三章中，你将构建 `Bank Code`（密码锁）游戏。存储箱被锁定，只有输入正确的数字组合时才能打开。组合可以是 `2` 到 `4` 个不重复的数字（数字范围从
    `1` 到 `9`）。在给出猜测后，系统会通知你有几个数字是正确的，以及几个数字的位置正确。根据这些信息，你将进行下一次猜测。你继续猜测，直到获得正确组合或停止游戏。表单左侧是一个大的
    `picture box`（图片框）控件。右侧放置了两个 `group box` 控件和两个 `button` 控件。在 `picture box` 中，放置了一个
    `control panel`（控制面板）。在 `panel` 中，有四个 `label` 控件（将 `AutoSize` 属性设置为 `False`）和九个
    `button` 控件。在第一个 `group box` 控件中放置了三个 `radio buttons`。在第二个 `group box` 控件中放置了一个
    `text box`（文本框）控件。`picture box` 包含一张银行图片和一个 `panel`。`panel` 中的 `label` 控件用于显示输入的组合（`BorderStyle`
    属性设置为 `FixedSingle` 以显示标签大小）。`panel` 上的九个 `buttons` 用于输入组合。`Radio buttons` 用于设置选项。`buttons`（一个用于开始和停止游戏，另一个用于退出项目）用于控制游戏操作。`text
    box` 显示输入组合的结果。


    在第四章中，你将构建 `Horse Racing`（赛马）游戏。这是一个简单的游戏。多达 `10` 匹马将竞向终点。你预测两匹你认为可能赢得比赛的马。通过点击
    `Start` 按钮，比赛将开始。所有的马将以速度竞向终点。`Labels` 用于显示说明和比赛中马的数量。使用了四个个 `button` 控件：两个 `buttons`
    用于更改马的数量，一个 `button` 用于开始游戏，另一个一个 `button` 用于停止游戏。`picture box` 控件用于加载马的图像。一个
    `timer`（定时器）控件用于在比赛期间更新马的移动。


    在第五章中，你将构建 `Catching Ball`（接球）游戏。鸟飞过并从天空掉落球。面临的挑战是将人移动到落球下方接住它。`Labels` 用于说明和显示游戏信息（剩余时间、捕获的球数和游戏难度等级）。两个
    `buttons` 用于更改游戏难度等级，一个 `button` 用于开始游戏，另一个 `button` 用于停止游戏。`PictureBox` 控件持有人、鸟和球的图像。


    在第六章中，你将构建 `Smart Tic Tac Toe`（智能井井棋）游戏。换句话说，这是第一个在计算机上编写的游戏，是由比尔·盖茨本人在青少年时期就西雅图湖滨中学期间编写的。这个游戏的目标是在
    `3 x 3` 网格上获胜，通过水平、对角线或垂直线上的三个相同的符号（`X` 或 `O`）获得胜利。玩家将交替进行。这个游戏给出两个选项：`player
    1` 对战 `player 2` 或人类对抗电脑。将为计算机逻辑开发一种智能但简单的策略，使其成为人类的强大对手。


    在第七章中，你将构建 `Fighting Plane`（战斗机）程序。该程序可以由两个人类玩家玩，也可以是人类对抗电脑。玩家的控制通过键盘完成。`Player
    1` 按 `A` 键向上，按 `Z` 键向下，按 `S` 键投掷导弹。当你从 `Options` 按钮选择 `Two players` 时，游戏可以由两个人类玩家玩。`Player
    1` 按相同的键，而 `player 2` 按键 `K` 向上，按 `M` 向下，按键 `J` 投掷导弹。所有的 `label` 控件都用于标题并提供评分和游戏信息。大型
    `panel`（`Panel1`）是游戏场。使用三个 `button` 控件来启动/停止程序、设置选项和退出程序。一个 `timer` 控件用于控制游戏动画，另一个代表电脑的决策过程。第二个控制面板
    (`Panel2`）用于选择游戏选项。一个 `group box` 包含 `radio buttons` 用于选择玩家人数。一个 `group box` 包含
    `radio buttons` 用于选择游戏难度等级，当与电脑玩时。


