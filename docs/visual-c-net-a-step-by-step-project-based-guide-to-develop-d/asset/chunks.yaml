    ;                    lblMessage.Text = "O''s Turn" ;                }               
    else                {                    LabelArr[i].Text = "O" ;                   
    XTurn = true ;                    lblMessage.Text = "X''s Turn" ;               
    }                // Who wins?                WhoWin = CheckWinning();               
    if (WhoWin != "" )                {                    WinSound.Play();                   
    lblMessage.Text = WhoWin + " wins" ;                    GameOver = true ;                   
    btnStartStop.PerformClick();                    return ;                }               
    else if (NumberOfClick == 9)                {                    // Draw                   
    DrawSound.Play();                    lblMessage.Text = "Game is draw!" ;                   
    GameOver = true ;                    btnStartStop.PerformClick();                   
    return ;                }                if (rdoOnePlayer.Checked)                   
    if ((XTurn && rdoComputerFirst.Checked) &#124;&#124;                          
    (!XTurn && rdoYouFirst.Checked))                        ComputerTurn();           
    }        }        private String CheckWinning()        {            String Winner
    = "" ;            int [] BoxNumber = new int [3];            String[] Symbol =
    new String[3];            // Checks all possible winning            for ( int
    i = 0; i < 8; i++)            {                for ( int j = 0; j < 3; j++)               
    {                    BoxNumber[j] = Convert.ToInt32(WinningArr[i][j].ToString());                   
    Symbol[j] = LabelArr[BoxNumber[j]].Text;                }                if (Symbol[0]
    == Symbol[1] && Symbol[0] == Symbol[2] &&                    Symbol[1] == Symbol[2]
    && Symbol[0] != "" )                {                    // There is a winner                   
