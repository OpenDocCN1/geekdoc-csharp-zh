    \ = \";\n        }\n        else if (PType == 2 && chkSubs.Checked)\n        {\n\
    \            // Substraction\n            P = PType;\n            Factor = GetFactor(2);\n\
    \            CorrectAnswer = MyRandom.Next(10);\n            RandValue = CorrectAnswer\
    \ + Factor;\n            Question = RandValue.ToString() + \" - \" + Factor.ToString()\
    \ + \" = \";\n        }\n        else if (PType == 3 && chkMul.Checked)\n    \
    \    {\n            // Multiplication\n            P = PType;\n            RandValue\
    \ = MyRandom.Next(10);\n            Factor = GetFactor(3);\n            CorrectAnswer\
    \ = RandValue * Factor;\n            Question = RandValue.ToString() + \" x \"\
    \ + Factor.ToString() + \" = \";\n        }\n        else if (PType == 4 && chkDiv.Checked)\n\
    \        {\n            // Division\n            P = PType;\n            Factor\
    \ = GetFactor(4);\n            CorrectAnswer = MyRandom.Next(10);\n          \
    \  RandValue = CorrectAnswer * Factor;\n            Question = RandValue.ToString()\
    \ + \" / \" + Factor.ToString() + \" = \";\n        }\n    } while (P == 0);\n\
    \    if (CorrectAnswer < 10)\n    {\n        Digits = 1;\n        return (Question\
    \ + \"?\");\n    }\n    else\n    {\n        Digits = 2;\n        return (Question\
    \ + \"??\");\n    }\n}\n```\n\n## 步骤 10：添加并运行\n将代码添加到项目。。保存并运行项目。点击 `Start Training`，你将看到一道随机加法题（Image0008.jpg）！图\
    \ 2.7 给出的两个问号的加法题告诉用户正确答案有两个数字。此时，你可以点击 `Stop Training`。然后你可以点击 `Start Training`\
    \ 查看其他题目。\n\n## 步骤 11：答案输入\n题目显示后，用户可以使用键盘输入数字。按键按下由表单的 `KeyPress` 事件处理。当表单获得焦点时，任何按下的键都将被解释并使用。在设计时，你将表单的\
    \ `KeyPreview` 属性设置为 `True`，这样所有按键按下在被其他控件使用之前都会通过 `KeyPress` 事件进行处理。你还需要确保表单在需要时拥有焦点。读取和检查答案的步骤如下：\n\
    \n- 确保按下的键值是 `0` 到 `9` 之间的值。\n- 如果输入了正确的值，则该值将作为答案的一部分，替换题目上的问号。\n- 如果仍留有问号，则等待下一次按键。\n\
    - 如果所有问号都已替换，则将答案与正确答案进行比较。\n- 增加已测试题目的数量。\n- 如果答案正确，则正确回答题目的数量加 1。\n- 更新分数控件。\n\
    - 生成另一道题目。\n\n你需要声明两个表单级变量来加载用户的答案以及答案的当前位数：\n\n```csharp\nstring YourAnswer;\n\
    int NumberDigitsAnswer;\n```\n\n编写表单的 Keypress 事件以实现上述步骤：\n\n```csharp\nprivate\
    \ void FormMathGame_KeyPress(object sender, KeyPressEventArgs e) {\n    if (btnStart.Text\
    \ == \"Start Training\") {\n        return;\n    }\n    // Only 允许 0-9\n    if\
    \ (e.KeyChar >= '0' && e.KeyChar <= '9') {\n        e.Handled = false;\n     \
    \   YourAnswer += e.KeyChar;\n        lblQuestion.Text = Question + YourAnswer;\n\
    \        if (NumberDigitsAnswer != Digits) {\n            NumberDigitsAnswer++;\n\
    \            lblQuestion.Text += \"?\";\n            return;\n        }\n    \
    \    else {\n            Answered++;\n            // Checks answer\n         \
    \   if (Convert.ToInt32(YourAnswer) == CorrectAnswer) {\n                Correct++;\n\
    \            }\n            lblTested.Text = Answered.ToString();\n          \
    \  lblTested.Refresh();\n            lblCorrect.Text = Correct.ToString();\n \
    \           lblCorrect.Refresh();\n            lblQuestion.Text = GetQuestion();\n\
    \            lblQuestion.Refresh();\n        }\n    } else {\n        e.Handled\
    \ = true;\n    }\n}\n```\n\n## 步骤 12：初始化\n你需要在 `GetQuestion` 函数中添加几行代码，在每道题目中初始化\
    \ `YourAnswer` 和 `NumberDigitsAnswer`，并赋予表单焦点以便输入答案：\n\n```csharp\nprivate string\
    \ GetQuestion() {\n    int PType, P, RandValue, Factor;\n    P = 0;\n    do\n\
    \    {\n        PType = MyRandom.Next(4) + 1;\n        if (PType == 1 && chkAdd.Checked)\
    \ {\n            // Addition\n            P = PType;\n            RandValue =\
    \ MyRandom.Next(10);\n            Factor = GetFactor(1);\n            CorrectAnswer\
    \ = RandValue + Factor;\n            Question = RandValue.ToString() + \" + \"\
    \ + Factor.ToString() + \" = \";\n        }\n        else if (PType == 2 && chkSubs.Checked)\
    \ {\n            // Substraction\n            P = PType;\n            Factor =\
    \ GetFactor(2);\n            CorrectAnswer = MyRandom.Next(10);\n            RandValue\
    \ = CorrectAnswer + Factor;\n            Question = RandValue.ToString() + \"\
    \ - \" + Factor.ToString() + \" = \";\n        }\n        else if (PType == 3\
    \ && chkMul.Checked) {\n            // Multiplication\n            P = PType;\n\
    \            RandValue = MyRandom.Next(10);\n            Factor = GetFactor(3);\n\
    \            CorrectAnswer = RandValue * Factor;\n            Question = RandValue.ToString()\
    \ + \" x \" + Factor.ToString() + \" = \";\n        }\n        else if (PType\
    \ == 4 && chkDiv.Checked) {\n            // Division\n            P = PType;\n\
    \            Factor = GetFactor(4);\n            CorrectAnswer = MyRandom.Next(10);\n\
    \            RandValue = CorrectAnswer * Factor;\n            Question = RandValue.ToString()\
    \ + \" / \" + Factor.ToString() + \" = \";\n        }\n    } while (P == 0);\n\
    \    YourAnswer = \"\";\n    NumberDigitsAnswer = 1;\n    this.Focus();\n    if\
    \ (CorrectAnswer < 10) {\n        Digits = 1;\n        return (Question + \"?\"\
    );\n    }\n    else {\n        Digits = 2;\n        return (Question + \"??\"\
    );\n    }\n}\n```\n\n## 步骤 13：类型选择\n选择类型看起来非常简单。你只需要勾选一个或多个想要的复选框，题目就会出现。但这里存在若干问题。到目前为止，没有什么能阻止用户取消勾选所有复选框，导致没有题目类型被选中。你必须确保至少有一个复选框始终被勾选。而且，如果选择了除法题，你不允许因子为零。你现在可以编写代码来解决这两个问题。你可以使用一种方法可以处理多个事件的技术，来处理“题目类型”组框中复选框的勾选操作。\n\
    \n"
- fmt: "\n*   If `chkDiv` is checked, you need to ensure that zero is not selected\
    \ as a factor; if `0` is selected by the user as a factor, you need to change\
    \ that factor to `1`. Also, if `chkDiv` is checked, you need to disable `rdoFactor0`.\n\
    \n*   If no check box is checked, you need to check the check box that was last\
    \ selected.\n\n*   Establish focus on the form.\n\nWrite the `chkType_CheckedChanged`\
    \ method which implements these steps:\n\n```csharp\nprivate void chkType_CheckedChanged(\
    \ object sender, EventArgs e) {\n    CheckBox CheckClicked;\n    int NumberCheck;\n\
    \    // Determines which checkbox is selected\n    CheckClicked = (CheckBox)sender;\n\
    \    // Determines how many check boxes are checked\n    NumberCheck = 0;\n  \
    \  if (chkAdd.Checked)\n        NumberCheck++;\n    if (chkSubs.Checked)\n   \
    \     NumberCheck++;\n    if (chkMul.Checked)\n        NumberCheck++;\n    if\
    \ (chkDiv.Checked)\n    {\n        NumberCheck++;\n        // Ensures that zero\
    \ is not selected as a factor\n        if (rdoFactor0.Checked)\n            rdoFactor1.PerformClick();\n\
    \        rdoFactor0.Enabled = false ;\n    }\n    else\n    {\n        rdoFactor0.Enabled\
    \ = true ;\n    }\n    //If no check box is checked,\n    //you need to check\
    \ the check box that was last selected\n    if (NumberCheck == 0)\n        CheckClicked.Checked\
    \ = true;\n    this .Focus();\n}\n```\n\n### Step 14\nSave and run the project.\
    \ Make sure all the newly written code does its job. Try to uncheck all question\
    \ type check boxes. One check box will still be checked. Check the division question\
    \ and notice that option `0` for the factor is disabled. Choose `0` as a factor.\
    \ Now, check again the type of division question. Notice the factor is changed\
    \ to `1` and option `0` is disabled. You have now solved the problem type problem\
    \ with any factor.![](Image00012.jpg)Figure 2.9 Option 0 for the factor is disabled\
    \ when user choose division question\n\n### Step 15\nAfter writing down the code\
    \ for generating questions and checking answers, you will now solve the problem\
    \ of using timer in this math game project. Until now, you assumed no timer is\
    \ used. You have two choices for a timer: (1) when the timer is counting forward,\
    \ which tracks how long you are solving the problem, and (2) when the timer is\
    \ counting down from a specified value. In both cases, a control (`lblTimer`)\
    \ will display the time in minute: second format. In the second case, a vertical\
    \ scroll bar (`vsbTimer`) will be used to set the value. Timing will be controlled\
    \ by a timer control at intervals of 1 second (1000 milliseconds). You will use\
    \ a form-level variable (`QuestionTime`) to store the time value (whether the\
    \ count is forward or backward) in seconds. Add this variable to the general declaration\
    \ area:\n\n```csharp\nint QuestionTime;\n```\n\n### Step 16\nThen, you need to\
    \ write the code to switch from one timing option to another. You will use a method\
    \ to handle the `CheckedChanged` event for all three radio buttons in the `grpTimer`\
    \ group box. The steps involved are as follows:\n\n*   If `rdoTimerOff` is selected,\
    \ `lblTimer` and `vsbTimer` will be disabled.\n*   If the forward counting (`rdoTimerForward`)\
    \ is selected, `lblTimer` will be displayed and `vsbTimer` will be disabled. The\
    \ `QuestionTime` variable is initialized with `0`.\n*   If the countdown (`rdoTimerBackward`)\
    \ is selected, `lblTimer` and `vsbTimer` will be displayed. The `QuestionTime`\
    \ variable is initialized with `30` times the `Value` property of `vsbTimer` (30\
    \ seconds for each increment).\n\nWrite the `rdoTimer_CheckedChanged` method which\
    \ implements these steps:\n\n```csharp\nprivate void rdoTimer_CheckedChanged(\
    \ object sender, EventArgs e) {\n    if (rdoTimerOff.Checked)\n    {\n       \
    \ lblTimer.Visible = false;\n        vsbTimer.Visible = false;\n    }\n    else\
    \ if (rdoTimerForward.Checked)\n    {\n        QuestionTime = 0;\n        lblTimer.Text\
    \ = GetTime(QuestionTime);\n        lblTimer.Visible = true;\n        vsbTimer.Visible\
    \ = false;\n    }\n    else if (rdoTimerBackward.Checked)\n    {\n        QuestionTime\
    \ = 30 * vsbTimer.Value;\n        lblTimer.Text = GetTime(QuestionTime);\n   \
    \     lblTimer.Visible = true;\n        vsbTimer.Visible = true;\n    }\n}\n```\n\
    \n### Step 17\nThe `rdoTimer_CheckedChanged` event above uses a public `GetTime`\
    \ function that generates time. Write `GetTime` function definition:\n\n```csharp\n\
    private string GetTime( int s) {\n    int min, det;\n    string ms, ss;\n    min\
    \ = (s / 60);\n    det = s - 60 * min;\n    ms = min.ToString();\n    ss = det.ToString();\n\
    \    if (det < 10)\n        ss = \"0\" + ss;\n    return (ms + \":\" + ss);\n\
    }\n```\nThis function takes the time (`s`) in seconds and breaks it down into\
    \ minutes and seconds. Add this new code to your project.\n\n### Step 18\nWhen\
    \ `rdoTimerBackward` is checked, then the `Value` property of the scroll bar (`vsbTimer`)\
    \ is used to initialize `QuestionTime`. In the code, each increment on the scroll\
    \ bar will add 30 seconds. If you look back at how you set the control, you will\
    \ see the `Maximum` property for this scroll bar is `60`. This will allow a maximum\
    \ of 30 minutes (1800 seconds) so that the game session is finished. You need\
    \ the `Scroll` event of `vsbTimer` to change the displayed time whenever the arrow\
    \ keys of the scrollbar are clicked. Write this method:\n\n```csharp\nprivate\
    \ void vsbTimer_Scroll( object sender, ScrollEventArgs e) {\n    lblTimer.Text\
    \ = GetTime(30 * vsbTimer.Value);\n    lblTimer.Refresh();\n}\n```\n\n### Step\
    \ 19\nYou allow changing the type of questions and factors when the user plays\
    \ the math game. It would not make sense to change the timer options when the\
    \ user is working on the question. Timing is not right. You will only allow the\
    \ selection of time options before clicking `Start Training`. Clicking `Start\
    \ Training` will start the timing process (which is controlled by `timerQuestion`).\
    \ The steps involved are as follows:\n\n*   Disable `grpTimer`.\n*   If `rdoTimerOff`\
    \ is selected, do nothing.\n*   If `rdoTimerForward` is selected, `QuestionTime`\
    \ is initialized to `0` and then displayed. Then `timerQuestion` is enabled.\n\
    *   If `rdoTimerBackward` is selected, `QuestionTime` is initialized with `30`\
    \ times the `Value` property of `vsbTimer` and then displayed. Then `timerQuestion`\
    \ is enabled.\n\nClicking `Stop Training` will stop the timing process. The steps\
    \ involved are as follows:\n\n*   Enable `grpTimer`.\n*   Disable `timerQuestion`.\n\
    \nEach of these steps is handled by the modified `btnStart_Click` event as follows:\n\
    \n```csharp\nprivate void btnStart_Click( object sender, EventArgs e) {\n    if\
    \ (btnStart.Text == \"Start Training\")\n    {\n        btnStart.Text = \"Stop\
    \ Training\";\n        btnExit.Enabled = false;\n        Answered = 0;\n     \
    \   Correct = 0;\n        lblTested.Text = \"0\";\n        lblCorrect.Text = \"\
    0\";\n        grpTimer.Enabled = false;\n        if (!rdoTimerOff.Checked)\n \
    \       {\n            if (rdoTimerForward.Checked)\n            {\n         \
    \       QuestionTime = 0;\n            }\n            else if (rdoTimerBackward.Checked)\n\
    \            {\n                QuestionTime = 30 * vsbTimer.Value;\n        \
    \    }\n            lblTimer.Text = GetTime(QuestionTime);\n            timerQuestion.Enabled\
    \ = true;\n        }\n        blQuestion.Text = GetQuestion();\n    }\n    else\n\
    \    {\n        grpTimer.Enabled = true;\n        timerQuestion.Enabled = false;\n\
    \        btnStart.Text = \"Start Training\";\n        btnExit.Enabled = true;\n\
    \        lblQuestion.Text = \"\";\n    }\n}\n```\n\n### Step 20\nWhen the timer\
    \ (`timerQuestion`) is enabled, the displayed time (`lblTimer`) will be updated\
    \ every second using the `Interval` property with a value of `1000`. The displayed\
    \ time will be incremented if forward count is selected, decremented if backward\
    \ count is selected. The steps involved in forward counting are as follows:\n\n\
    *   Increment `QuestionTime` by `1`.\n*   Display `QuestionTime`.\n*   If `QuestionTime`\
    \ is `1800` (30 minutes), question solving is stopped.\n\nThe steps involved in\
    \ backward counting are as follows:\n\n*   Decrement `QuestionTime` by `1`.\n"
