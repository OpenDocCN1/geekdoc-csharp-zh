  trans: "\n\n# 赛马游戏项目\n\n`Labels`（标签）用于显示指令和比赛中的马匹数量。使用了四个按钮控件：两个按钮用于更改马的数量，一个按钮用于开始游戏，另一个按钮用于停止游戏。`picture\
    \ box`（PictureBox）控件用于加载马图像。`timer`（定时器）控件用于在比赛期间更新马的移动。\n\n![](img/Image00025.jpg)\n\
    图 4.1 赛马游戏项目中使用的所有控件\n\n运行程序（按 `<F5>`）。游戏将在 `'initial'`（初始）状态运行。将显示程序描述和指令。此时，用户可以点击\
    \ `Start` 按钮开始游戏，点击箭头按钮更改参赛马数量，或点击 `Stop` 停止程序。\n\n![](img/Image00026.jpg)\n图\
    \ 4.2 赛马游戏处于初始状态，显示程序描述和指令\n\n通过点击 `Number of Horses` 下方的右箭头按钮根据需要更改马匹数量（例如 8\
    \ 匹）。点击 `Start` 按钮开始游戏。程序指令将消失。将显示八匹马，准备好比赛：\n\n![](img/Image00027.jpg)\n图 4.3\
    \ 八匹马已准备好比赛\n\n在这种情况下，用户需要选择两匹被认为将赢得比赛的马。要做到这一点，用户只需用鼠标点击所需的马，被选中的马旁边将显示一个红色的\
    \ X 符号，如图 4.4 所示。\n\n![](img/Image00028.jpg)\n图 4.4 当用户选择两匹预测将赢得比赛的马时，会出现两个红色的\
    \ X 符号\n\n然后，用户可以点击 `Start` 按钮开始比赛。所有的马都横跨屏幕到达终点：\n\n![](img/Image00029.jpg)\n\
    图 4.5 用户点击 Start 按钮时，所有马向终点奔驰\n\n## 教程步骤\n\n### 第 1 步\n你将开始构建赛马游戏项目。在 Visual Basic\
    \ 中启动一个新项目。建议立即使用你自定义的名称保存。这将为你的项目创建所需的文件夹和文件结构。\n\n### 第 2 步\n在表单上放置两个 `panel`（面板）控件（左侧一个宽度为\
    \ 100 像素的 `panel`，右侧另一个宽度为 900 像素的 `panel`）。在左面板中放置两个 `labels`（标签）和四个 `buttons`（按钮）。在右面板中放置一个\
    \ `label` 控件和一个 `picture box` 控件。添加一个 `timer`（定时器）控件。现在表单看起来看起来如图 4.6 所示。\n\n\
    `Labels` 用于显示信息。两个 `buttons` 用于更改马的数量，另外两个按钮用于开始和停止游戏。`timer` 控件设置马的移动。\n\n###\
    \ 第 3 步\n使用属性窗口设置控件属性：\n\n**`Form1` 对象的若干属性**\n| 属性 (Property) | 值 (Value) |\n\
    | :--- | :--- |\n| Name | `FormHorseRacing` |\n| Text | `Horse Racing` |\n| FormBorderStyle\
    \ | `FixedSingle` |\n| StartPosition | `CenterScreen` |\n\n![](img/Image00030.jpg)\n\
    图 4.6 本项目使用的所有控件及其位置\n\n**`Panel1` 对象的属性之一：**\n| 属性 (Property) | 值 (Value) |\n\
    | :--- | :--- |\n| BackColor | `DeepPink` |\n\n**`Label1` 对象的若干属性：**\n| 属性 (Property)\
    \ | 值 (Value) |\n| :--- | :--- |\n| AutoSize | `False` |\n| Font | `Bold, 12`\
    \ |\n| ForeColor | `Yellow` |\n| Text | `Number of Horses` |\n| TextAlign | `MiddleCenter`\
    \ |\n\n**`Label3` 对象的若干属性：**\n| 属性 (Property) | 值 (Value) |\n| :--- | :--- |\n\
    | AutoSize | `False` |\n| Name | `lblHorse` |\n| Font | `Bold, 12` |\n| ForeColor\
    \ | `White` |\n| Text | `0` |\n| TextAlign | `MiddleCenter` |\n\n**`Button1` 对象的若干属性：**\n\
    | 属性 (Property) | 值 (Value) |\n| :--- | :--- |\n| Name | `btnLeft` |\n| Font Size\
    \ | `12` |\n| Text | `<` |\n\n**`Button2` 对象的若干属性：**\n| 属性 (Property) | 值 (Value)\
    \ |\n| :--- | :--- |\n| Name | `btnRight` |\n| Font Size | `12` |\n| Text | `>`\
    \ |\n\n**`Button3` 对象的若干属性：**\n| 属性 (Property) | 值 (Value) |\n| :--- | :--- |\n\
    | Name | `btnStart` |\n| Font Size | `12` |\n| Text | `Start` |\n\n**`Button4`\
    \ 对象的若干属性：**\n| 属性 (Property) | 值 (Value) |\n| :--- | :--- |\n| Name | `btnStop`\
    \ |\n| Font Size | `12` |\n| Text | `Stop` |\n\n**`Panel2` 对象的若干属性：**\n| 属性 (Property)\
    \ | 值 (Value) |\n| :--- | :--- |\n| Name | `pnlGame` |\n| BackColor | `White`\
    \ |\n\n**`Label2` 对象的若干属性：**\n| 属性 (Property) | 值 (Value) |\n| :--- | :--- |\n\
    | Name | `lblInstruction` |\n| Font Size | `12` |\n\n**`PictureBox1` 对象的若干属性：**\n\
    | 属性 (Property) | 值 (Value) |\n| :--- | :--- |\n| Name | `picHorse` |\n| Image\
    \ | `horse.png` |\n| SizeMode | `AutoSize` |\n| Visible | `True` |\n\n**`Timer1`\
    \ 对象的若干属性：**\n| 属性 (Property) | 值 (Value) |\n| :--- | :--- |\n| Name | `timerHorse`\
    \ |\n| Interval | `100` |\n\n你现在将开始编写这个游戏代码。你将在多个阶段编写代码。作为一个初始步骤，你将编写启动游戏并设置初始状态的代码。然后，由于点击停止按钮设置\
    \ `'stop'` 状态。最后，点击 Start 按钮后编写赛马代码。在开发过程中，你将在结束前多次修改某些过程。\n\n### 第 4 步\n每当用户启动程序时，都需要进行初始化。你将看到项目中需要的初始化。当程序启动时，你自然想要显示游戏指令。你还想对\
    \ `NumberOfHorses` 和 `StatusGame` 进行初始化（提供初始值）。这种初始化是在表单的 `Load` 过程中进行的。\n\n![](img/Image0031.jpg)\n\
    图 4.7 表单 Load 过程中的初始化\n\n你在表单级别声明以下三个变量（`NumberOfHorses`、`StatusGame` 和 `PanelGame`）：\n\
    \n```csharp\nint NumberOfHorses;\nstring StatusGame;\nGraphics PanelGame;\n\n\
    private void FormHorseRacing_Load( object sender, EventArgs e) {\n    NumberOfHorses\
    \ = 3;\n    StatusGame = \"Start\";\n    lblInstruction.Text = \"赛马游戏 \\n\\n\"\
    ;\n    lblInstruction.Text += \"两匹马正在向终点冲刺。\\n\" +\n    \"猜哪匹马会先到达终点。\";\n   \
    \ lblInstruction.Text += \"\\n\\n 通过按左按钮减少、\" +\n    \"右按钮增加来选择参赛的马匹数量。\";\n \
    \   lblInstruction.Text += \"\\n\\n 点击 Start 按钮开始游戏。\";\n    lblInstruction.Text\
    \ += \"\\n\\n 点击 Stop 按钮结束游戏。\";\n    lblHorse.Text = NumberOfHorses.ToString();\n\
    \    PanelGame = pnlGame.CreateGraphics();\n}\n```\n\n`NumberOfHorses` 设置为 3，`StatusGame`\
    \ 设置为 `\" Start \"`。接下来，在创建图形对象（`PanelGame`）后，使用一系列语句在 `lblInstruction` 中编写游戏指令。\n\
    \n### 第 5 步\n保存并运行程序，查看图 4.7 所示。\n\n### 第 6 步\n要更改马的数量，用户可以点击提供的两个箭头键之一。执行此操作的代码放置在\
    \ `btnLeft` 和 `btnRight` 的 `Click` 事件过程中：\n\n"
- fmt: "\n```csharp\nprivate void btnLeft_Click( object sender, EventArgs e)\n{\n\
    \    if (StatusGame == \"Start\") // Decreases number of horses\n    {\n     \
    \   NumberOfHorses -= 1;\n        if (NumberOfHorses < 3)\n            NumberOfHorses\
    \ = 3;\n        lblHorse.Text = NumberOfHorses.ToString();\n    }\n}\n\nprivate\
    \ void btnRight_Click( object sender, EventArgs e)\n{\n    if (StatusGame == \"\
    Start\") // Decreases number of horses\n    {\n        NumberOfHorses += 1;\n\
    \        if (NumberOfHorses > 10)\n            NumberOfHorses = 10;\n        lblHorse.Text\
    \ = NumberOfHorses.ToString();\n    }\n}\n```\n\nThis code is quite simple. Number\
    \ of horses is only changed when the game is in the `\"Start\"` state. If the\
    \ `<` button is clicked, the program will reduce number of horses by one (with\
    \ a minimum of 3). If the `>` button is clicked, the program will add number of\
    \ horses by one (with a maximum of 10). New value for number of horses is then\
    \ displayed.\n\n### Step 7\nSave and run program. Make sure both the arrow keys\
    \ work well which changes the value of number of horses between 3 and 10, as shown\
    \ in Figure 4.8.\n\n### Step 8\nAfter number of horses are set, the next step\
    \ is to click on Start button to allow the user to select two horses. So, you\
    \ need a code to move from the `\"Start\"` state to the `\"Stop\"` state. When\
    \ Start button is clicked on the `\"Start\"` state, you need to do these steps:\n\
    \n* Change `StatusGame` to `\"Stop\"`.\n* Clear the game screen.\n* Draw a horse\
    \ and a race track for each horse.\n* Draw the finish line of the race.\n* Display\
    \ instructions for the user.\n\n![](Image00032.jpg)\nFigure 4.8 User now can change\
    \ number of horses using two arrow keys\n\nTo draw a horse, you divide the race\
    \ region into 10 equal areas (of the maximum number of horses). The image stored\
    \ on `picHorse` is used to represent horses. Now, add this code to the Click event\
    \ procedure from `btnStart`:\n\n```csharp\nprivate void btnStart_Click( object\
    \ sender, EventArgs e)\n{\n    if (StatusGame == \"Start\") //User clicks Start\
    \ button\n    {\n        StatusGame = \"Stop\";\n        lblInstruction.Visible\
    \ = false;\n        PanelGame.Clear(Color.White); //Draw horse and trajectory\n\
    \        for (int i = 1; i <= NumberOfHorses; i++)\n        {\n            PanelGame.DrawImage(picHorse.Image,\
    \ 50, (i - 1) * 60 + 10);\n            PanelGame.DrawLine(Pens.Green, 50, (i -\
    \ 1) * 60 + 35, 820, (i - 1) * 60 + 35);\n        }\n        //Draw finisih line\n\
    \        PanelGame.FillRectangle(Brushes.Pink, 820, 10, 10, NumberOfHorses * 60\
    \ - 10);\n        Font MyFont = new Font(\"Arial\", 14);\n        PanelGame.DrawString(\"\
    Click on the two horses you choose.\", MyFont, Brushes.Red, 200, 40);\n      \
    \  PanelGame.DrawString(\"Click the Start button to start the race.\", MyFont,\
    \ Brushes.Red, 200, 70);\n        NumberOfHorsesByUser = 0;\n        for (int\
    \ i = 1; i <= NumberOfHorses; i++)\n        {\n            HorsesChosenArr[i]\
    \ = 0;\n        }\n    }\n}\n```\n\nPay attention to how you draw each horse.\
    \ Two new variables added. `NumberOfHorsesByUser` is initialized to zero. `HorsesChosenArr`\
    \ array is used to track which horses the choose. Add the following declaration:\n\
    \n```csharp\nint[] HorsesChosenArr = new int[10];\nint NumberOfHorsesByUser;\n\
    ```\n\n### Step 9\nSave and run the program. Choose number of horses (for example,\
    \ 7). Click Start button and you will see:\n![](Image0033.jpg)\nFigure 4.9 Every\
    \ horse, trajectory and finish line are drawn on panel\n\n### Step 10\nThe next\
    \ step is to choose two horses that you want to compete with. You will write the\
    \ code for it. However, you first need to handle one thing that needs to be done\
    \ in the `\"Start\"` state, which is to stop the program. One last thing that\
    \ can be done while the game is in the `\"Start\"` state is to click Stop button.\
    \ This will stop the program. This code is quite simple. Add the following lines\
    \ to the Click event from `btnStop`:\n\n```csharp\nprivate void btnStop_Click(\
    \ object sender, EventArgs e)\n{\n    if (StatusGame == \"Start\")\n    {\n  \
    \      this.Close();\n    }\n}\n```\nSave and run program to prove it.\n\n###\
    \ Step 11\nAfter the game is in the `\"Stop\"` condition, the user can choose\
    \ two horses that wants to compete to reach finish line. To detect click on a\
    \ horse, you need to know its location and size. From the code that places the\
    \ horse on `PanelGame`, you can see i-th horse (where `i` starts from 1 to `NumberOfHorses`):\n\
    \n```csharp\nPanelGame.DrawImage(picHorse.Image, 50, (i - 1) * 60 + 10)\n```\n\
    \nThe `HorsesChosenArr` is used to tell which horses are selected. A red X will\
    \ be placed next to the selected horse. After two horses are selected (`NumberOfHorsesByUser\
    \ = 2`), you can start the race by clicking Start. If the user clicks on two horses\
    \ and wants to change the race, the user can click on the horse which has been\
    \ deleted and the red X will disappear so the user can choose another. When a\
    \ horse is clicked, the following steps are taken:\n\n* If the horse has been\
    \ selected before, then `NumberOfHorsesByUser` is decremented, set `HorsesChosenArr[i]`\
    \ to `0` and delete the letter X next to the horse.\n* If the horse is not selected\
    \ before and `NumberOfHorsesByUser` is less than 2, then `NumberOfHorsesByUser`\
    \ is incremented, set `HorsesChosenArr[i]` to `1` and draw a red X next to the\
    \ horse.\n\nYou follow these steps in that order to ensure that the user does\
    \ not click on a horse that has been previously selected.\n![](Image0034.jpg)\n\
    Figure 4.10 User can select two horses to compete\n\nThe code for horse selection\
    \ is placed inside `MouseDown` event from `PanelGame`:\n\n```csharp\nprivate void\
    \ pnlGame_MouseDown( object sender, MouseEventArgs e)\n{\n    int HorseClicked;\n\
    \    if (StatusGame == \"Stop\")\n    {\n        //User chooses two horses\n \
    \       Decimal ValHorses = (e.Y - 10) / 60;\n        HorseClicked = Convert.ToInt32(Math.Floor(ValHorses)\
    \ + 1);\n        //if horse has been clicked before, delete letter X\n       \
    \ if (HorsesChosenArr[HorseClicked] == 1)\n        {\n            NumberOfHorsesByUser\
    \ -= 1;\n            HorsesChosenArr[HorseClicked] = 0;\n            PanelGame.FillRectangle(Brushes.White,\
    \ 10, 10, 10, 10); // Logic assumed based on context\n        }\n        else\
    \ if (NumberOfHorsesByUser < 2)\n        {\n            NumberOfHorsesByUser++;\n\
    \            HorsesChosenArr[HorseClicked] = 1;\n            // Draw red X logic\
    \ assumed\n        }\n    }\n}\n```\n*(Note: The provided source for the MouseDown\
    \ method was truncated; I have formatted the visible logic based on the description\
    \ provided).*\n\n### Step 12\nSave and run the program. Set number of horses to\
    \ five. Select two of those horses and notice X letter next to each horse.\n\n\
    ### Step 13\nAfter two horses are selected, user can click on Start button to\
    \ start the race, which puts the game into `\"Moving\"` state. So, when Start\
    \ button is clicked in the `\"Stop\"` state, the following steps will be performed:\n\
    \n* Change `StatusGame` to `\"Move\"`.\n* Clear instructions.\n* For each horse,\
    \ the final random position is determined before the finish line.\n* Two winners\
    \ are chosen at random.\n* Move horses to their final positions.\n* Change `StatusGame`\
    \ to `\"Start\"` before another race starts.\n\nTo move a horse, you use the timer\
    \ control `timerHorse`. With each `Tick` event, you move each horse as far as\
    \ a fraction of the difference between its starting and ending position. This\
    \ method gives a smooth animation to the final position in 5000 milliseconds (5\
    \ seconds). Because the interval is 100 milliseconds, you move each horse for\
    \ 1/50 times the difference between the starting and ending positions for each\
    \ Click event.\n"
