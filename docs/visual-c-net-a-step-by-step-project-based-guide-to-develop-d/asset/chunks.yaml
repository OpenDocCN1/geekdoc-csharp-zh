  raw: 'In chapter two, you will build a project so that children can practice basic
    skills in addition, subtraction, multiplication, and division operations. This
    Math Game project can be used to choose the types of questions and what factors
    you want to use. This project has three timing options. Random math problems using
    values ​​from 0 to 9 will be presented. Timing options are provided to measure
    accuracy and speed. There are many controls used. Two label controls are used
    for title information, two for displaying scores. There is a wide label in the
    middle of the form to display math questions. And, long skinny label is used as
    separator. Two button controls are used to start and stop question and one button
    to exit the project. There are three group control boxes. The first group box
    holds four check box controls that are used to select the type of questions. The
    second group box holds eleven radio buttons that are used to select values ​​that
    are used as factors in calculations. The third group box contains three radio
    button controls for timing options. A scroll bar control rod is used to change
    the time.


    In chapter three, you will build Bank Code game. The storage box is locked and
    can only be opened if you enter the correct digit combination. Combinations can
    be 2 to 4 non-repetitive digits (range of digits from 1 to 9). After a guess is
    given, you will be notified of how many digits are right and how many digits are
    in the right position. Based on this information, you will give another guess.
    You continue to guess until you get the right combination or until you stop the
    game. On the left side of the form is a large picture box control. On the right
    side, two group box controls and two button controls are placed. In the picture
    box, a control panel is placed. In the panel, there are four label controls (set
    the AutoSize property to False ) and nine button controls. In the first group
    box control, place three radio buttons. In the second group box control, a text
    box control is placed. The picture box contains an image of bank and a panel.
    The label controls in the panel are used to display the combinations entered (the
    BorderStyle property set to FixedSingle to display the label size). The nine buttons
    on the panel are used to enter combinations. Radio buttons are used to set options.
    The buttons (one to start and stop the game and another to exit the project) are
    used to control game operations. The text box displays the results of the combinations
    entered.


    In chapter four, you will build Horse Racing game. This is a simple game. Up to
    10 horses will race to the finish line. You guessed two horses that you thought
    could win the race. By clicking on the Start button, the race will start. All
    horses will race speed to get to the finish line. Labels are used to display instructions
    and number of horses in a race. Four button controls are used: two buttons to
    change number of horses, one button to start the game, and one other button to
    stop the game. The picture box control is used to load the horse image. A timer
    control is used to update the horse''s movement during the race.


    In chapter five, you will build Catching Ball game. The bird flew and dropped
    ball from the sky. Users are challenged to position man under the fallen ball
    to catch it. Labels are used for instructions and to display game information
    (remaining time, number of balls captured, and game difficulty level). Two buttons
    are used to change the game difficulty level, one button to start the game, and
    another button to stop the game. Picture box controls hold images for man, bird,
    and ball.


    In chapter six, you will build Smart Tic Tac Toe game. That said, this is the
    first game ever programmed on a computer and one that had been programmed by Bill
    Gates himself when he was a teenager while attending Lakeside School in Seattle.
    The aim of this game is to win the game on a 3 x 3 grid with the victory of three
    identical symbols (X or O) on horizontal, diagonal, or vertical lines. The players
    will play alternately. In this game given two game options: player 1 against player
    2 or human player against computer. A smart but simple strategy will be developed
    for computer logic to be a formidable opponent for humans.


    In chapter seven, you will build Fighting Plane program. This program can be played
    by two human players or human player versus computer. The controls of the player
    are done via the keyboard. Player 1 presses A key to move up, Z key to move down,
    and S key to throw rudal. When you choose Two players from the Options button,
    this game can be played by two human players. Player 1 presses the same keys,
    while player 2 presses key K to move up, M to move down, and key J to throw rudal.
    All label controls are used for titles and provide scoring and game information.
    The large panel (Panel1) is the playing field. Three button controls are used
    to start / stop a program, set options, and exit the program. One timer control
    is used to control game animation and another is used to represent the computer''s
    decision process. The second control panel (Panel2) is used to select game options.
    One group box contains radio buttons which are used to select number of players.
    A group box contains radio buttons to select the level of difficulty of the game,
    when playing against a computer. A small button is used to close the options panel.
    The default properties are set for one-player games with the easiest game difficulty.


