    \ Visual C# 中，此测试可以使用 `Rectangle` 结构的 `IntersectsWith` 方法来执行。\n\n```csharp\nRudal1.IntersectsWith(Player2)\n\
    ```\n*图 7.17 所示，要检查两个矩形区域是否相交*\n\n如果 `Rudal1.Collide(Player2)` 的结果为 **True**，则发生了碰撞。如果为\
