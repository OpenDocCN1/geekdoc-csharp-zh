    \            btnStartStop.PerformClick();\n            return;\n        }\n  \
    \      else if (NumberOfClick == 9)\n        {\n            // Draw\n        \
    \    lblMessage.Text = \"Game is draw!\";\n            GameOver = true;\n    \
    \        btnStartStop.PerformClick();\n            return;\n        }\n    }\n\
    }\n```\n\n### Step 16\nSave and run project. The winner or draw game can now be\
    \ announced (Figure 6.12). Two-player mode is now complete. Now, you will see\
    \ how to implement the game in one player mode, where user will fight the computer.\
    \ You will start by making the computer make random moves (no brain!).\n\n###\
    \ Step 17\nAn important part of playing the player against the computer is deciding\
    \ what thought process or decision is given to the computer. You have two choices:\
    \ random computer and smart computer. You will start by writing down the code\
    \ for a random computer. Then, you will write the code for a smart computer, which\
    \ makes the computer a pretty opponent. All logics behind the movement of computer\
    \ will be implemented in a method called `ComputerTurn`. For random movements,\
    \ the computer will randomly select one of the empty boxes on the grid and place\
    \ symbol on that box (X if the computer starts the game first, O if human starts\
    \ the game first). Add a random object at the following form level:\n\n```csharp\n\
    Random MyRandom = new Random();\n```\n\nWrite the following method, `ComputerTurn`,\
    \ on your project:\n\n```csharp\nprivate void ComputerTurn(){\n    int BoxSelected;\n\
    \    int i, n;\n    if (rdoRandom.Checked)\n    {\n        // Random logic\n \
    \       // Put symbol on N-th empty box\n        n = MyRandom.Next(9 - NumberOfClick)\
    \ + 1;\n        i = 0;\n        for (BoxSelected = 0; BoxSelected < 9; BoxSelected++)\n\
    \        {\n            if (LabelArr[BoxSelected].Text == \"\")\n            \
    \    i++;\n            if (i == n)\n                break;\n        }\n      \
    \  // Put symbol on BoxSelected\n        lblBox_Click(LabelArr[BoxSelected], null);\n\
    \    }\n}\n```\nThe logic behind `ComputerTurn` is simple. At any time, you have\
    \ `9 - NumberOfClick` empty boxes. To give a symbol to a particular `LabelArr[BoxSelected]`,\
    \ simulate a click by calling `lblBox_Click(LabelArr[BoxSelected], null)`. The\
    \ program will know whether to place X or O based on implemented.\n\n### Step\
    \ 18\nNow, you will implement `ComputerTurn` so that the computer is against human.\
    \ You need to modify two methods. First, when you start the game, if the computer\
    \ plays first, you need to call `ComputerTurn()`. Modify the `Click` event method\
    \ of `btnStartStop`.\n"
