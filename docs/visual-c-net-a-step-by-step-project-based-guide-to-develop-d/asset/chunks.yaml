- fmt: "\n### A number of properties of the RadioButton1 object\n\n| Property | Value\
    \ |\n| :--- | :--- |\n| Name | `rdoTwoDigits` |\n| Text | 2 Digits Combination\
    \ |\n| Checked | True |\n\n### A number of properties of the RadioButton2 object\n\
    \n| Property | Value |\n| :--- | :--- |\n| Name | `rdoThreeDigits` |\n| Text |\
    \ 3 Digits Combination |\n\n### A number of properties of the RadioButton3 object\n\
    \n| Property | Value |\n| :--- | :--- |\n| Name | `rdoFourDigits` |\n| Text |\
    \ 4 Digits Combination |\n\n### A number of properties of the Button10 object\n\
    \n| Property | Value |\n| :--- | :--- |\n| Name | `btnStartStop` |\n| Text | Start\
    \ Game |\n\n### A number of properties of the Button11 object\n\n| Property |\
    \ Value |\n| :--- | :--- |\n| Name | `btnExit` |\n| Text | Exit Game |\n\n###\
    \ A number of properties of the GroupBox2 object\n\n| Property | Value |\n| :---\
    \ | :--- |\n| Name | `grpResult` |\n| Text | Results |\n| BackColor | LightBlue\
    \ |\n\n### A number of properties of the TextBox1 object\n\n| Property | Value\
    \ |\n| :--- | :--- |\n| Name | `textResult` |\n| BackColor | White |\n| MultiLine\
    \ | True |\n| ReadOnly | True |\n| ScrollBars | Vertical |\n\n#### Step 4\nWhen\
    \ setting properties is complete, the form now looks as shown in Figure 3.5. This\
    \ completes the form design. You will now start writing code for the game. You\
    \ will write the code in a few steps. As a first step, you will write the code\
    \ that starts the game and sets the \"stop\" state. Then, you will determine how\
    \ to switch the game to \"playing\" state by clicking Start Game button. During\
    \ the code development process, you will modify a number of methods before the\
    \ process endpoint is encountered.\n\n![](Image00021.jpg) Figure 3.5 Setting properties\
    \ is complete and you start writing code for the game\n\n#### Step 5\nEvery time\
    \ the project starts, there are a number of initializations that need to be done.\
    \ You will see a number of initializations that this game requires. All initialization\
    \ is placed in the `Load` event method of the form. To simplify the task, you\
    \ will create an array to contain the four control labels that are used to display\
    \ combinations and an array to contain the nine control buttons that are used\
    \ to enter combination values. These two arrays are defined at the form-level:\n\
    \n```cs\nLabel[] Combo = new Label[4];\nButton[] ComboButton = new Button[9];\n\
    ```\n\n#### Step 6\nAnd write assignments placed on the `Load` event method from\
    \ the form as follows:\n\n```cs\nprivate void FormBankCode_Load( object sender,\
    \ EventArgs e)\n{\n    // Disables pnlBank and creates two arrays\n    pnlBank.Enabled\
    \ = false ;\n    Combo[0] = lblCombol1;\n    Combo[1] = lblCombol2;\n    Combo[2]\
    \ = lblCombol3;\n    Combo[3] = lblCombol4;\n    ComboButton[0] = btn1;\n    ComboButton[1]\
    \ = btn2;\n    ComboButton[2] = btn3;\n    ComboButton[3] = btn4;\n    ComboButton[4]\
    \ = btn5;\n    ComboButton[5] = btn6;\n    ComboButton[6] = btn7;\n    ComboButton[7]\
    \ = btn8;\n    ComboButton[8] = btn9;\n}\n```\nThe utility of these two arrays\
    \ will become apparent when the code is further developed.\n\n#### Step 7\nYou\
    \ have two choices at this point: click `btnStop` button or click `btnExit` button.\
    \ The code to exit is simple. Place the following code in `btnExit` click event:\n\
    \n```cs\nprivate void btnExit_Click( object sender, EventArgs e)\n{\n}\n```\n\n\
    #### Step 8\nThe code for `btnStop` is more complex. You will build it in stages.\
    \ First, you will see how to switch the game from \"stop\" to \"playing\" state.\
    \ When user clicks `btnStop` button in the \"stop\" state, several things happen\
    \ to switch the game to the \"play\" state:\n\n*   Change `Text` property of `btnStop`\
    \ to \"Stop Game\".\n*   Disable `grpOptions`.\n*   Disable `btnExit`.\n*   Enable\
    \ `pnlBank`.\n*   Clear `textResult`.\n*   Determine number of digits.\n\nAdd\
    \ this line to the form-level declaration:\n\n```cs\nint NumberOfDigit;\n```\n\
    \nWrite the code for `btnStop` click event that implements all steps above:\n\n\
    ```cs\nprivate void btnStop_Click( object sender, EventArgs e)\n{\n    btnStop.Text\
    \ = \"Stop Game\" ;\n    grpOptions.Enabled = false ;\n    btnExit.Enabled = false\
    \ ;\n    pnlBank.Enabled = true ;\n    textResult.Text = \"\"\n    // Determines\
    \ number of digits\n    if (doTwoDigits.Checked)\n    {\n        NumberOfDigit\
    \ = 2;\n    }\n    else if (doThreeDigits.Checked)\n    {\n        NumberOfDigit\
    \ = 3;\n    }\n    else\n    {\n        NumberOfDigit = 4;\n    }\n    for ( int\
    \ i = 0; i < NumberOfDigit; i++)\n    {\n        Combo[i].Visible = true ;\n \
    \       Combo[i].Text = \"\" ;\n    }\n    if (NumberOfDigit != 4)\n    {\n  \
    \      for ( int i = NumberOfDigit; i < 4; i++)\n        {\n            Combo[i].Visible\
    \ = false ;\n        }\n    }\n}\n```\n\nNotice how the label control array (`Combo`)\
    \ is used to display the label controls needed for the combination.\n\n#### Step\
    \ 9\nSave and run the project. Click Start Game button, select the three-digit\
    \ combination option, and the game will switch to the \"play\" state, as shown\
    \ in Figure 3.6.Ensure that number of label boxes are displayed according to the\
    \ selected digits combination option. Notice Stop Game button doesn't do anything\
    \ for now. You will fix it later.\n\n![](Image00018.jpg) Figure 3.6 Number of\
    \ label boxes displayed is according to the selected digits option\n\n#### Step\
    \ 10\nWhen user clicks Stop Game button in the \"play\" state, several things\
    \ must be done to switch the game to the \"stop\" state: \n\n*   Change `Text`\
    \ property of `btnStartStop` to \"Start Game\".\n*   Enable `grpOptions`.\n* \
    \  Enable `btnExit`.\n*   Enable `pnlBank`.\n"
