    # TUTORIAL 6: SMART TIC TAC TOE


    In this tutorial, you will build a Smart Tic Tac Toe game. That said, this is
    the first game ever programmed on a computer and one that had been programmed
    by Bill Gates himself when he was a teenager while attending Lakeside School in
    Seattle. The aim of this game is to win the game on a 3 x 3 grid with the victory
    of three identical symbols (X or O) on horizontal, diagonal, or vertical lines.
    The players will play alternately. In this game two game options are given: player
    1 against player 2 or human player against computer. A smart but simple strategy
    will be developed for computer logic to be a formidable opponent for humans.


    ## Description


    Run the project (press `<F5>`). The game will be displayed in the ''stop'' state,
    the grid will be cleared and waiting for you to choose game options (one or two
    players and, if one player, who plays first and how smart the computer will oppose).


    ![](Image00052.jpg) Figure 6.1 All controls used in Smart Tic Tac Toe game project

    ![](Image00053.jpg) Figure 6.2 The game is at “stop” state


    You can choose the two players option and then press Start Game button:

    ![](Image00054.jpg) Figure 6.3 User chooses two players option


    In addition, you can choose the option of one player with a random computer or
    a smart computer opponent:

    ![](Image00055.jpg) Figure 6.4 User chooses one player option


    ## Tutorial Steps


    ### Step 1

    You will build a Smart Tic Tac Toe game project. Start a new project in Visual
    C#. Once created, you are advised to save the project immediately with the name
    you choose. This will create the folders and file structure that your project
    requires.


    ![](Image00056.jpg) Figure 6.5 All controls user and their positions form


    You need 14 `label` controls (with the `AutoSize` property set to `False` so that
    the size can be changed and the `BorderStyle` property temporarily set to `FixedSingle`
    to see edges) on the left side of the form. Place the three `group boxes` on the
    right side, along with the two control buttons. Place two `radio button` controls
    in each group box. The form will look as shown in Figure 6.5. `Label` controls
    are used to display messages, to display symbols (X and O), and to form a grid.
    The `radio buttons` are used to set game options. Buttons (one to start the game
    and one to end the game) are used to control game operations.


    ### Step 2

    Set control properties using the Properties window:


    #### Properties of the `Form1` object:

    | Property | Value |

    | :--- | :--- |

    | Name | `FormTicTacToe` |

    | BackColor | `White` |

    | Text | `Smart Tic Tac Toe` |

    | FormBorderStyle | `FixedSingle` |

    | StartPosition | `CenterScreen` |


    #### Properties of the `Label1` object:

    | Property | Value |

    | :--- | :--- |

    | Name | `lblMessage` |

    | AutoSize | `False` |

    | BackColor | `Crimson` |

    | ForeColor | `White` |

    | BorderStyle | `Fixed3D` |

    | Font | `Bold, 24` |

    | Text | `X’s Turn` |

    | TextAlign | `MiddleCenter` |


    #### Properties of the `Label2` through `Label10` objects (`lblBox1` to `lblBox9`):

    These labels share the following properties:

    - `AutoSize`: `False`

    - `BorderStyle`: `None`

    - `Font Size`: `48`

    - `Text`: `X`

    - `TextAlign`: `MiddleCenter`


    #### Properties of the `Label11` through `Label14` objects (`lbl11` to `lbl14`):

    These labels share the following properties:

    - `AutoSize`: `False`

    - `BackColor`: `Orange`

    - `BorderStyle`: `None`

    - `Text`: `[Empty]`


    #### Properties of the `GroupBox1` object:

    | Property | Value |

    | :--- | :--- |

    | Name | `grpPlayer` |

    | BackColor | `DeepPink` |

    | Text | `[Empty]` |


    #### Properties of the `RadioButton1` and `RadioButton2` objects:

    | Property | Value |

    | :--- | :--- |

    | Name | `rdoTwoPlayers`, `rdoOnePlayer` |

    | ForeColor | `White` |

    | Font Size | `9` |

    | Text | `Two Players`, `One Player` |

    | Checked | `True` |


    #### Properties of the `GroupBox2` object:

    | Property | Value |

    | :--- | :--- |

    | Name | `grpFirst` |

    | BackColor | `DeepPink` |

    | Text | `[Empty]` |

