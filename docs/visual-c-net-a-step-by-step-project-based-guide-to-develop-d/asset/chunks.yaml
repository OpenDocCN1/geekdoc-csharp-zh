    \ new Rectangle(pnlGame.ClientSize.Width - 5, (int)(0.5 * pnlGame.ClientSize.Height\
    \ - 0.5 * Player2.MyImage.Height), Player2.MyImage.Width, Player2.MyImage.Height);\n\
