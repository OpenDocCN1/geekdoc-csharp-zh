    \ 1 |\n| Visible | False |\n\n### A number of properties of the `Button1` object\n\
    | Property | Value |\n| :--- | :--- |\n| Name | `btnStart` |\n| Text | Start Training\
    \ |\n| Font Size | 10 |\n\n### A number of properties of the `Button2` object\n\
    | Property | Value |\n| :--- | :--- |\n| Name | `btnExit` |\n| Text | Exit |\n\
    | Font Size | 10 |\n\n### A number of properties of the `Timer1` object\n| Property\
    \ | Value |\n| :--- | :--- |\n| Name | `timerQuestion` |\n| Interval | 1000 |\n\
    \nWhen setting all the properties is done, your form will look like the following:![](Image00006.jpg)\n\
    Figure 2.5 Form When setting all the properties is done\n\nYou will start writing\
    \ code for the application. You will do it in a few steps. As an initial step,\
    \ you will write code to generate a random problem or question, read the answer\
    \ from user, and update the score.\n\n#### Step 3\nFor now, you will ignore the\
    \ timer option. After this initial code works satisfactorily, the timing issue\
    \ will be discussed. A step-by-step approach to building a project is always easier\
    \ than building it all at once.\n\nHere is what happens when Start Training (`btnStart`)\
    \ button is clicked:\n\n* Set `Text` property of `btnStart` to `Stop Training`.\n\
    * Disable `btnExit` button.\n* Set how many questions to be tested and set how\
    \ many correct answer to zero.\n* Generate and display a question on `lblQuestion`.\n\
    * Get answers from user.\n* Check answer and update score.\n\nAfter each question\
    \ is answered, the next question will be generated and answered. The user answers\
    \ the question until he clicks Stop Training (or until the time runs out). The\
    \ following steps need to be carried out:\n\n* Set `Text` property of `btnStart`\
    \ to `Start Training`.\n* Enable `btnExit` button.\n* Clear `lblQuestion`.\n*\
    \ Present the result.\n\nFirst, create a `Random` object and declare two form-level\
    \ variables to track how many questions that have been answered and how many answers\
    \ are correct:\n\n```cs\nRandom MyRandom = new Random();\nint Answered, Correct;\n\
    ```\n\n#### Step 4\nWrite code for `Click` event of `btnStart` to implement the\
    \ steps above, except to present the result:\n\n```csharp\nprivate void btnStart_Click(object\
    \ sender, EventArgs e)\n{\n    if (btnStart.Text == \"Start Training\")\n    {\n\
    \        btnStart.Text = \"Stop Training\";\n        btnExit.Enabled = false;\n\
    \        Answered = 0;\n        Correct = 0;\n        lblTested.Text = \"0\";\n\
    \        lblCorrect.Text = \"0\";\n        blQuestion.Text = GetQuestion();\n\
    \    }\n    else\n    {\n        btnStart.Text = \"Start Training\";\n       \
    \ btnExit.Enabled = true;\n        lblQuestion.Text = \"\";\n    }\n}\n```\n\n\
    #### Step 5\nThe code in Step 4 uses `GetQuestion` function to generate random\
    \ questions and generate them as a `String` type. Add this (you complete it later):\n\
    \n```csharp\nprivate string GetQuestion()\n{\n    return (\"Question!\");\n}\n\
    ```\n\n#### Step 6\nAnd, now, you can write the code for `Click` event of `btnExit`:\n\
    \n```csharp\nprivate void btnExit_Click(object sender, EventArgs e)\n{\n    this.Close();\n\
    }\n```\n\n#### Step 7\nSave, run the project, and click Training button. The form\
    \ will now be displayed as shown in Figure 2.6:![](Image0007.jpg)\nFigure 2.6\
    \ Math Game after user clicks Training\n\n#### Step 8\nYou will continue to write\
    \ the code for generating questions and getting answers (including score) from\
    \ the user. Then, later you will learn timer and how to present results. To generate\
    \ a question, you need to check the latest selected by user and generate a random\
    \ question based on those choices. All code will be placed in `GetQuestion`. Look\
    \ at each step of the question generation. The first step is to choose a type\
    \ of random question for a maximum of four. You will use a simple approach, first\
    \ generating a random value from 1 to 4 (1 represents addition, 2 for subtraction,\
    \ 3 for multiplication, and 4 represents division). If the check box (in the Type\
    \ group box) with the random number is checked, then it will be that type of question.\
    \ If the check box is not checked, then you will choose another value. You continue\
    \ this process until the type of question is selected. Note this approach assumes\
    \ at least one check box is always checked. The code to choose the type of question\
    \ is as follows:\n\n```cs\nint PType, P = 0;\ndo\n{\n    PType = MyRandom.Next(4)\
    \ + 1;\n    if (PType == 1 && chkAdd.Checked)\n    {\n        // Addition\n  \
    \      P = PType;\n    }\n    else if (PType == 2 && chkSubs.Checked)\n    {\n\
    \        // Substraction\n        P = PType;\n    }\n    else if (PType == 3 &&\
    \ chkMul.Checked)\n    {\n        // Multiplication\n        P = PType;\n    }\n\
    \    else if (PType == 4 && chkDiv.Checked)\n    {\n        // Division\n    \
    \    P = PType;\n    }\n} while (P == 0);\n```\n\nAfter the type of question is\
    \ selected, you determine the factor used to generate a question. This factor\
    \ can be a value from 0 to 9, or a random value from 0 to 9, based on the radio\
    \ button selected in Factor group. The `GetFactor` function provides a factor\
    \ based on radio button selection in the Factor box and type of question, `P`.\
    \ For random factor, this function ensures that zero is not used as a return value\
    \ if a division problem is generated. Write the definition of `GetFactor` function:\n\
    \n```cs\nprivate int GetFactor(int p)\n{\n    if (rdoFactor0.Checked)\n      \
    \  return (0);\n    else if (rdoFactor1.Checked)\n        return (1);\n    else\
    \ if (rdoFactor2.Checked)\n        return (2);\n    else if (rdoFactor3.Checked)\n\
    \        return (3);\n    else if (rdoFactor4.Checked)\n        return (4);\n\
    \    else if (rdoFactor5.Checked)\n        return (5);\n    else if (rdoFactor6.Checked)\n\
    \        return (6);\n    else if (rdoFactor7.Checked)\n        return (7);\n\
    \    else if (rdoFactor8.Checked)\n        return (8);\n    else if (rdoFactor9.Checked)\n\
    \        return (9);\n    else\n    {\n        // Random\n        if (p == 4)\n\
    \            return (MyRandom.Next(9) + 1);\n        else\n            return\
    \ (MyRandom.Next(10));\n    }\n}\n```\n\nIf a random option (`rdoFactorRandom`)\
    \ is selected, 0 to 9 is generated for addition, subtraction, and multiplication\
    \ problems; 1 to 9 are generated for the division problem (`p = 4`). In other\
    \ cases, the selected factor is used as a return value.\n\n#### Step 9\nNow it\
    \ is time for you to start writing the definition of the `GetQuestion` function.\
    \ First, add declaration for the following three form-level variables:\n\n```cs\n\
    int CorrectAnswer, Digits;\nstring Question;\n```\n\nThen, write the definition\
    \ of `GetQuestion` function:\n"
