    | `TextChanged` | Occurs when the value of the `Text` property has changed. |


    ### General uses of the `TextBox` control as a viewer control:


    - Set the `Name` property. Initialize the `Text` property with the desired string.

    - Set the `ReadOnly` property to `True`.

    - If used to display text more than one line, set the `MultiLine` property to
    `True`.

    - You can also change the `Font`, `BackColor`, and `ForeColor` properties.


    ### General uses of `TextBox` control as input device:


    - Set the `Name` property. Initialize the `Text` property with the desired string.

    - If used to display text more than one line, set the `MultiLine` property to
    `True`.

    - In the code, give `Focus` to the control when needed.

    - Provide the key entrapment code for the `KeyPress` event that will be discussed
    in this chapter.

    - Read the `Text` property when the `Leave` event occurs.

    - You can also change the `Font`, `BackColor`, and `ForeColor` properties.


    ## CheckBox


    Visual C# has many controls that give users many choices just by clicking the
    mouse. These controls are attractive, familiar, and minimize the possibility of
    errors in your application. You will use a lot of these controls.


    `CheckBox` control provides a way to provide a selection of a number of potential
    choices. `CheckBox` is used in many Windows applications.


    Table 1.15 A number of properties of the `CheckBox` object.


    | Property | Description |

    | :--- | :--- |

    | `Name` | Get or set the name of the check box. |

    | `BackColor` | Get or set the background color from the check box. |

    | `Checked` | Get or set a value indicating whether the check box is checked.
    |

    | `Font` | Get or set font name, style, and size. |

    | `ForeColor` | Get or set the color of text or graphics. |

    | `Text` | Get or set the string displayed next to the check box. |

    | `TextAlign` | Get or set text alignment in the checkbox. |


    Table 1.16 One of methods of `CheckBox` object.


    | Method | Description |

    | :--- | :--- |

    | `Focus` | Move focus to a specific check box. |


    Table 1.17 A number of Events of the `CheckBox` object.


    | Event | Description |

    | :--- | :--- |

    | `CheckedChanged` | Occurs when the value of the `Checked` property changes,
    whether via code or when the check box is clicked. |

    | `Click` | Triggered when a check box is clicked. The `Checked` property is automatically
    changed by Visual C#. |


    When a check box is clicked, if there is no check mark there (`Checked = False`),
    then Visual C# will place a check mark there and set `Checked` property to `True`.
    If clicked and previously there was a check mark there (`Checked = True`), then
    the check mark will disappear and `Checked` property will be changed to `Flase`.


    ### General uses of `CheckBox` control:


    - Set the `Name` and `Text` properties.

    - Initialize the `Checked` property.

    - Monitor the `Click` or `CheckedChanged` event to determine whether the check
    box is checked.

    - Change `Font`, `BackColor`, and `ForeColor` properties.


    ## RadioButton


    `RadioButton` control provides the capability to make mutually exclusive choices
    from a number of candidate choices. This means that the radio button works as
    a group, only one button can be selected. The radio button is widely used in Windows
    applications. Named as a radio button because it looks similar to a button on
    a transistor radio.


    Following are a number of properties, methods, and events of the `RadioButton`
    control:


    Table 1.18 A number of Properties of the `RadioButton` object.


    | Property | Description |

    | :--- | :--- |

    | `Name` | Get or set the name of the radio button. |

    | `BackColor` | Get or set the background color from the radio button. |

    | `Checked` | Get or set a value indicating whether the radio button is selected.
    |

    | `Font` | Get or set font name, style, and size. |

    | `ForeColor` | Get or set the color of text or graphics. |

    | `TextAlign` | Get or set text alignment on radio buttons. |


    Table 1.19 A number of Methods of `RadioButton` object.


    | Method | Description |

    | :--- | :--- |

    | `Focus` | Move focus to a specific radio button. |

    | `PerformClick` | Generates a `Click` event for a particular radio button, by
    simulating a click the user. |


    Table 1.20 A number of Events of `RadioButton` object.


    | Event | Description |

    | :--- | :--- |

    | `CheckedChanged` | Occurs when the value of the `Checked` property changes,
    whether via code or when the check box is clicked. |

    | `Click` | Triggered when a check box is clicked. The `Checked` property is automatically
    changed by Visual C#. |


    ### General uses of RadioButton control:


    - Create a radio button group.

    - For each button in the group, set the `Name` and `Text` properties.

    - Initialize the `Checked` property.

    - Monitor the events of each control in the group.


    ## GroupBox


    You already knew that check boxes and radio buttons work in a group. The `GroupBox`
    control provides a way to group related controls in a C# application.


    To place controls in a group box, you first need to drag or place `GroupBox` control
    into the form. Then, place each control into the group box.


    The group box affects how the radio button works. The radio buttons on a `GroupBox`
    work as a group, and are not related to the radio buttons on other `GroupBox`
    controls.


    Table 1.21 A number of Properties of the `GroupBox` object.


    | Property | Description |

    | :--- | :--- |

    | `Name` | Get or set the name of the group box. |

    | `Enabled` | Get or set a value indicating whether the group box is enabled.
    If it is `False`, then all controls in the group box will be disabled. |

    | `BackColor` | Get or set the background color from the group box. |

    | `Font` | Get or set font name, style, and size. |

    | `ForeColor` | Get or set color of text. |

    | `Text` | Get or set the string to be displayed in the title section of the group
    box. |

    | `Visible` | If it is `False`, it will hide the group box (and all the controls
    it contains). |


    The `GroupBox` control has a number of methods and events, but all of them are
    rarely used. You will focus more on the methods and events associated with the
    controls in the group box.


    ### General uses of GroupBox control:


    - Set `Text` and `Name` properties.

    - Place the desired controls in the group box.

    - Monitor the events of each control in the group box.


