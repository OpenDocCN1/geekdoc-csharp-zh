    \ game. You will start with a simple random rule. In this rule, the computer will\
    \ only move up and down in the game field, and occasionally throw rudal. The only\
    \ non-random element added is that the computer can only throw rudal if it has\
    \ at least as many rudals as the player has. This is to prevent the computer from\
    \ firing all the rudals and becoming an easy target for human. The rules used\
    \ are: \n\n*   Generate a random value from 0 to 4.\n\n*   If the random value\
    \ is 0, throw rudal, if computer has at least as many as the remaining rudals\
    \ owned by the player.\n\n*   If the random value is 1 or 2, move up.\n\n*   If\
    \ the random value is 3 or 4, make down.\n\nWith this rule, rudals are fired one\
    \ by one in five up or down movements. The computer will move up 2 movements of\
    \ 5 movements and move down 2 movements from 5 movements.In detailed (smart) logic\
    \ game rules, you only need to think about how you want to win the game. The smart\
    \ rule is to throw if other players are \"within a certain range\". And, avoid\
    \ human player if he fires rudal. In the rules given here, \"in range\" means\
    \ that the vertical difference between two players is not more than 80 percent\
    \ of the player's height:\n\n*   If it is \"in range\" and the computer has at\
    \ least as many rudals as the player has, the computer will throw rudal.\n\n*\
    \   If the human player fires rudal or the computer no longer has the remaining\
    \ rudals, the computer will make a defensive move: If human player is above the\
    \ computer player, the computer will move down; If the human player is below the\
    \ computer player, the computer will move up.\n\n*   Otherwise, the computer will\
    \ make an attacking move: If the human player is above the computer player, the\
    \ computer will move up; If the human player is under the computer player, the\
    \ computer will move down.\n\nNote that the computer can only throw rudal when\
    \ it has at least as many rudals left as the player has. You certainly don't want\
    \ a computer to run out of rudals before a human player.The code for both of these\
    \ logic is placed in the Tick event procedure of timComputer control. Before writing\
    \ this code, you need to overcome the problem of how you make computer player\
    \ throw, move up, or move down. With human as the second player, pressing J key\
    \ will make player 2 throw, K key pressing will make player 2 move up and pressing\
    \ M key will make player 2 move down. It would be better if there was a way to\
    \ make the computer press the same key for the job.Fortunately, Visual C# has\
    \ a procedure named SendKeys that can be used to simulate key presses on the keyboard.\
    \ To press J key, the code is: SendKeys.Send(\"K\") . Therefore, for computer\
    \ player, you will use SendKeys procedure to implement computer actions.The Tick\
    \ event procedure of timComputer control which implements computer player logic\
    \ is given as follows:\n\n&#124; 1234567891011121314151617181920212223242526272829303132333435363738\
    \ &#124; private void timComputer_Tick( object sender, EventArgs e){    int i;   \
