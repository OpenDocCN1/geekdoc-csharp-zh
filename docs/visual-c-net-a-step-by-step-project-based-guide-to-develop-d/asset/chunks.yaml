    | 属性 | 说明 |

    | :--- | :--- |

    | BackColor | 获取或设置图片框的背景颜色。 |

    | BorderStyle | 指定图片框的边缘样式。 |

    | Height | 图片框的高度（单位：像素）。 |

    | Image | 设置在图片框中显示的图形文件。 |

    | Left | 从表单左边缘到图片框左边缘的距离（单位：像素）。 |

    | SizeMode | 指明图片的显示方式。 |

    | Top | 从表单标题区域到图片框顶边缘的下距离（单位：像素）。 |

    | Width | 图片框的宽度（单位：像素）。 |


    ### 表 1.23 PictureBox 对象的一项事件


    | 事件 | 说明 |

    | :--- | :--- |

    | Click | 当点击图片框时触发。 |


    `Image` 属性指定了要显示的图形文件。可以放置在图像框中的五种图形文件类型如下：


    ### 表 1.24 PictureBox 控件可接受的图形文件类型


    | 文件类型 | 说明 |

    | :--- | :--- |

    | Bitmap | 图像由像素表示，并存储为包含位位的集合。这是扫描仪和画笔程序最常用的格式。格式具有 `.bmp` 扩展名。 |

    | Icon | 一种特殊的位图文件，最大尺寸为 32 x 32 像素。该格式具有 `.ico` 扩展。图标用于表示 Windows 应用程序。 |

    | Metafile | 将图像存储为包含图形对象（线、圆、多边形）的集合的文件，而不是像素。当放大或缩小尺寸时，元文件比位图具有更精确的分率。该格式具有
    `.wmf` 扩展。 |

    | JPEG | JPEG（联合图像专家小组）是一种压缩的 BMP 格式，支持 8 位和 24 位颜色。这种格式在互联网上非常流行，也是数码相机常用的格式。JPEG
    格式扩展名为 `.jpg`。 |

    | GIF | GIF（图形交换格式）最初由 CompuServe 开发的压缩 bmp 格式。该格式支持多达 256 色，在互联网上同样流行。该格式具有 `.gif`
    扩展。 |


    `SizeMode` 属性规定了特定图像将如何显示。该属性可以赋予五个值：`Normal`、`CenterImage`、`StretchImage`、`AutoSize`
    和 `Zoom`。这些每个值的效果如下：


    | SizeMode 的值 | 效果 |

    | :--- | :--- |

    | Normal | 图像按初始大小显示。如果图片框大于图像，会有剩余空间。如果图片框小于图像，图像将被截断。 |

    | CenterImage | 图像以初始大小显示，并位于图片框的居中。如果图片框大于图像，会有剩余空间。如果图片框小于图像，图像将被截断。 |

    | StretchImage | 图像将“填充”图片框。如果图像小于图片框，图像将放大。如果图像大于图片框，图像将缩小。 |

    | AutoSize | `StretchImage` 的相反。图片框将改变其尺寸以适应图像的初始大小。 |

    | Zoom | 与 `StretchImage` 相同。图像将进行调整以便加载到图片框中。 |


    请注意，对于 `Normal`、`CenterImage`、`StretchImage` 和 `Zoom` 值，尺寸保持不变。使用 `AutoSize` 时，图片框会改变大小。如果你的表单不够大以加载图片框，这会在程序运行时导致问题。


    PictureBox 控件显示图像的通用用途：

    * 设置 `Name` 和 `SizeMode` 属性（通常带有 `StretchImage` 值）。

    * 在设计时和程序运行时（运行时）均指定 `Image` 属性。


    # 教程 2：数学游戏


    在本教程中，你将构建一个项目，让孩子们可以练习加、减、乘、除运算的基本技能。这个数学游戏项目可以用来选择题目的类型以及你想要使用的因子。该项目有三个计时选项。


    将展示使用 0 到 9 之间值的随机数学题。提供了计时选项来衡量准确性和速度。


    | 说明 |

    | :--- |

    | 使用了许多控件。使用两个 label 控件用于标题信息，两个用于显示分数。表单中间有一个宽 label 用于显示数学题。长条形的 label 用作分隔符。使用两个
    button 控件用于开始和停止问题，还有一个按钮用于退出项目。有三个组框（group control）。![D:\2___VB For Students\Image2.png](img/Image00002.jpg)图
    2.1 数学游戏项目使用的控件。第一个组框包含四个复选框控件，用于选择题型。第二个组框包含十一个单选按钮，用于选择用作计算因子的值。第三个组框包含三个单选按钮控件，用于计时选项。使用滚动条控件杆来改变时间。运行项目（按
    `<F5>`）。此数学游戏程序将显示如下：![](img/Image00003.jpg)图 2.2 首次运行时时的数学游戏。有很多可用选项。首先，从“题型”（Type
    of Question）组框中选择问题类型。选择加、减、乘和/或除题。你也可以选择 `Factor`（因子）、0 到 9 之间的任何值，或选择 `Random`（随机）。这些选项可以随时更改。点击如图
    2.3 所示的 Start 按钮开始游戏。 |


    | 教程步骤 |

    | :--- |

    |  1 | 你将开始构建这个数学游戏项目。在 Visual Basic 中新建项目。在表单上放置六个 label 控件（将 `AutoSize` 设置为
    `False`）、三个组控件、两个按钮控件。在第一个组中放置四个复选框。在第二个组中放置十一个单选按钮。在第三个组中放置三个单选按钮、一个垂直滚动条。调整每个控件的大小和位置，使表单看起来如图
    2.4 所示![](img/Image00004.jpg)图 2.3 点击 Start 按钮时的数学游戏![](img/Image00005.jpg)图 2.4
    表单上的控件第一个 label 控件用于存储信息。宽 label 用于显示问的数学题。宽窄的 label 作为分隔符。第一个组框用于选择题型，第二个组框用于选择因子，第三个组框用于选择计时器。一个按钮用于开始和停止问题，另一个按钮用于退出项目。计时器用于花费的时间。
    |


