    \ and/or division questions. You can also choose Factor , any value from 0 to\
    \ 9, or choose Random for random factor. These options can be changed at any time.\
    \ To start game, click on Start Training button as shown in Figure 2.3. |\n\n\
    | Tutorial Steps |\n\n| Step 1 | You will start building this math game project.\
    \ Start a new project in Visual Basic. Place six label controls (for four of them,\
    \ set the AutoSize property to False ), three group box controls, and two button\
    \ controls on your form. Add timer control to the project. In the first group\
    \ box, place four check box controls. In the second group box, place eleven radio\
    \ button controls. In the third group box, place three radio buttons, a label\
    \ (with AutoSize property set to False ), and a vertical scroll bar. Change the\
    \ size and position of each control so that the form looks as shown in Figure\
    \ 2.4.![](Image00004.jpg)Figure 2.3 Math Game when user clicks Start Training\
    \ button![](Image00005.jpg)Figure 2.4 Controls placed on the formThe first four\
    \ label controls are used to store information. Wide label is used to display\
    \ math questions that are asked. Wide and thin label used as separator. The first\
    \ group box is used to select the type of questions, the second group box is used\
    \ to choose a factor, and the third group box is used to select the timer option.\
    \ One button to start and stop question and another button to exit the project.\
    \ The timer control is used to tell the time spent. |\n\n| Step 2 | Set control\
    \ properties using the Properties window: \n\n&#124; A number of properties of\
