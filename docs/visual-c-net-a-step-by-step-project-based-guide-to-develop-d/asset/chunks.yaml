  trans: "\n\n### 步骤 3\n你现在将分几个步骤开始编写此游戏的代码。作为初始步骤，你将编写启动程序并设置“开始”状态的代码。然后，你将看到在点击“开始”按钮后如何设置“进行”状态（放置所有图形元素）。接着，你将编写代码将球移动到屏幕底部，移动人（使用鼠标点击或键盘键），并检查人是否能够捕获球。在代码开发过程中，你将在达到最终定义之前反复修改某些过程。\n\
    \n每当程序启动时，都需要完成几次初始化。看看此游戏所需的初始化。当程序首次启动时，你自然地想要显示游戏说明。你还需要初始化游戏难度级别（`Difficulty`）和游戏状态（`StatusGame`）。此初始化是在表单的\
    \ `Load` 事件过程中完成。\n\n你声明了两个表单级变量（`Difficulty` 和 `StatusGame`）：\n\n```csharp\n\
    int Difficulty;\nString StatusGame;\n```\n\n### 步骤 4\n在表单的 `Load` 事件过程中过程中添加以下代码：\n\
    \n```csharp\nprivate void FormCatchingBall_Load(object sender, EventArgs e)\n\
    {\n    // Catching Ball Game\n    Difficulty = 1;\n    StatusGame = \"Starting\"\
    ;\n    lblInstruction.Text = \"CATCHING BALL GAME \\n\\n\";\n    lblInstruction.Text\
    \ += \"In this game, you will try to \\n\" + \"catch as many as possible fallen\
    \ ball.\";\n    lblInstruction.Text += \"\\n\\nUse the left and right arrow key\
    \ \" + \"or the left and right mouse buttons to \" + \"move man under the fallen\
    \ ball.\";\n    lblInstruction.Text += \"\\n\\nChoose the game difficulty level\
    \ by pressing \" + \"the left or right mouse button.\";\n    lblInstruction.Text\
    \ += \"\\n\\nClick Start button to start the game.\" + \"\\nClick Stop button\
    \ to stop the game.\";\n    lblDifficulty.Text = Difficulty.ToString();\n}\n```\n\
    \n保存并运行程序查看图 6.8 所示。\n\n### 步骤 5\n`Difficulty` 变量用于确定球掉落的速度（难度越高，球落的速度越快）。要更改难度，用户可以点击箭头键之一。实现此操作的代码放在\
    \ `btnLeft` 和 `btnRight` 按钮的 `Click` 事件过程中：\n\n```csharp\nprivate void btnLeft_Click_1(object\
    \ sender, EventArgs e)\n{\n    if (StatusGame == \"Starting\") // Decreases difficulty\
    \ level\n    {\n        Difficulty -= 1;\n        if (Difficulty < 1)\n      \
    \      Difficulty = 1;\n        lblDifficulty.Text = Difficulty.ToString();\n\
    \    }\n}\n\nprivate void btnRight_Click_1(object sender, EventArgs e)\n{\n  \
    \  if (StatusGame == \"Starting\") // Increases difficulty level\n    {\n    \
    \    Difficulty += 1;\n        if (Difficulty > 10)\n            Difficulty =\
    \ 10;\n        lblDifficulty.Text = Difficulty.ToString();\n    }\n}\n```\n\n\
    ![](img/Image00037.jpg)图 6.8 当程序首次启动时，它显示游戏描述和说明。保存并运行程序。确保箭头键工作正常。确保难度级别在 1 到\
    \ 10 之间。\n\n![](img/Image00043.jpg)图 6.9 要更改难度，用户可以点击箭头键之一。\n\n### 步骤 6\n设置游戏难度级别后，下一步是点击“开始”按钮以便游戏开始。因此，你需要代码来从“开始”状态切换到“进行”状态。当在“开始”状态下点击“开始”按钮时，需要执行以下步骤：\n\
    \n*   将 `StatusGame` 改为 \"Playing\"。\n*   清除屏幕。\n*   初始化分数和剩余时间。\n*   将人放置在屏幕底部区域。\n\
    *   将鸟和球随机放置在屏幕顶部区域。\n*   掉落。\n\n这里有很多工作需要完成，你将逐步进行。首先，你将初始化变量并将人置在屏幕底部。使用了两个变量控制游戏。`RemainingTime`\
    \ 是一个整数值，告诉游戏还剩多少时间（毫秒）。你选择游戏持续的时间，例如 60 秒。`Score` 告诉捕获了多少个球。`PanelGame` 是用于放置游戏的图形区域。添加以下表单级声明：\n\
    \n```csharp\nint RemainingTime;\nint Score;\nGraphics PanelGame;\n```\n\n在代码中，你指定了宽度（`ManW`）和高度（`ManH`）。人被放置在屏幕下方，中间位置。`ManX`\
    \ 和 `ManY` 变量告诉人的位置。`ManDeltaX` 用于告知按下按钮或点击鼠标时人移动了多远。这些变量对于判断人是否能捕获掉落的球很有用。添加以下表单级声明：\n\
    \n```csharp\nint ManW, ManH, ManX, ManY, ManDeltaX;\n```\n\n### 步骤 7\n在 `btnStart`\
    \ 控件的 `Click` 事件过程中添加此代码：\n\n```csharp\nprivate void btnStart_Click(object sender,\
    \ EventArgs e)\n{\n    // Start button clicked\n    StatusGame = \"Playing\";\n\
    \    lblInstruction.Visible = false;\n    PanelGame = pnlGame.CreateGraphics();\n\
    \    PanelGame.Clear(Color.Gold); // time/score\n    RemainingTime = 60 * 1000;\
    \ // milliseconds\n    Score = 0;\n    DisplayTimeScore();\n    // Man\n    ManW\
    \ = picMan.Width;\n    ManH = picMan.Height;\n    ManDeltaX = 10;\n    ManX =\
    \ 375;\n    ManY = pnlGame.Height - ManH;\n    PanelGame.DrawImage(picMan.Image,\
    \ ManX, ManY);\n}\n```\n\n在这里，面板被清除并设置了变量，使得人位于屏幕下方和中心附近。注意接以下代码行：`DisplayTimeScore()`。此行调用了一个函数来更新\
    \ `RemainingTime` 和 `Score` 的显示值。将此函数添加到程序的末尾：\n\n```csharp\nprivate void DisplayTimeScore()\n\
    {\n    lblTime.Text = (RemainingTime / 1000).ToString();\n    lblScore.Text =\
    \ Score.ToString();\n}\n```\n\n### 步骤 8\n保存并运行程序。选择游戏的难度级别（例如 3）。点击“开始”按钮，如下所示。\n\
    \n![](img/Image00044.jpg)图 6.10 人位于屏幕下方和中心附近\n\n### 步骤 9\n最后的初始化步骤是在屏幕上随机放置鸟和球。你指定鸟的宽度和高度（`BirdW`\
    \ 和 `BirdH`）以及球的长度和高度（`BallW` 和 `BallH`）。这将有助于判断是否捕获了球。添加以下表单级声明：\n\n```csharp\n\
    int BirdW, BirdH, BirdX;\nint BallW, BallH, BallX, BallY;\nRandom MyRandom = new\
    \ Random();\n```\n\n`BirdX` 是鸟的 x 坐标（y 位置为零，在屏幕上方）。球的位置为（`BallX`, `BallY`）。`MyRandom`\
    \ 用于生成随机数。\n\n### 步骤 10\n在 `btnStart` 控件的 `Click` 事件过程中添加修改后的代码：\n\n```csharp\n\
    private void btnStart_Click(object sender, EventArgs e)\n{\n    // Start button\
    \ clicked\n    StatusGame = \"Playing\";\n    lblInstruction.Visible = false;\n\
    \    PanelGame = pnlGame.CreateGraphics();\n    PanelGame.Clear(Color.Gold); //\
    \ time/score\n    RemainingTime = 60 * 1000; // milliseconds\n    Score = 0;\n\
    \    DisplayTimeScore();\n    // Man\n    ManW = picMan.Width;\n    ManH = picMan.Height;\n\
    \    ManDeltaX = 10;\n    ManX = 375;\n    ManY = pnlGame.Height - ManH;\n   \
    \ PanelGame.DrawImage(picMan.Image, ManX, ManY);\n    // Bird\n    BirdW = picBird.Width;\n\
    \    BirdH = picBird.Height;\n    // Ball\n    BallW = picBall.Width + 10;\n \
    \   BallH = picBall.Height;\n    PlaceBirdAndBall();\n}\n```\n\n### 步骤 11\n步骤\
    \ 10 中的代码使用了独立的子过程（`PlaceBirdAndBall`）在屏幕上随机放置鸟和球。将此子过程添加到程序中：\n\n"
- fmt: "\n### Bird and Ball Initialization\n\n```csharp\nprivate void PlaceBirdAndBall(){\
    \   \n    BirdX = MyRandom.Next(pnlGame.Width - BirdW);\n    PanelGame.DrawImage(picBird.Image,\
    \ BirdX, 0);\n    BallX = BirdX + Convert.ToInt32(0.5 * (BirdW - BallW));\n  \
    \  BallY = BallH + 10;\n    PanelGame.DrawImage(picBall.Image, BallX, BallY);\n\
    }\n```\n\n### Step 12: Save and Run\nSave and run the program. Set the `Difficulty`\
    \ (for example 3). Click the `Start` button to see:\n![](Image00045.jpg)\nFigure\
    \ 6.11 The final initialization step is to place bird and ball randomly on the\
    \ screen. You still need the code to drop the ball and move man along the bottom\
    \ of the screen. You will write the code shortly. But, first, you need to do something\
    \ to stop the program.\n\n### Step 13: Stop the Program\nOne last thing that can\
    \ be done when the game is in the \"Starting\" state is to click the `Stop` button.\
    \ This will stop the program. The code here is quite simple. Add the following\
    \ code to the `Click` event procedure of `btnStop` button:\n\n```csharp\nprivate\
    \ void btnStop_Click( object sender, EventArgs e){\n    if (StatusGame == \"Starting\"\
    \ )\n        this .Close();\n}\n```\n\n### Step 14: Transition to Playing State\n\
    Save and run the program. Make sure `Stop` button works properly. This completes\
    \ the code to move the \"Starting\" game to \"Playing\" state. Now you will write\
    \ the code to move man along the bottom of the screen.\n\n### Step 15: Ball Drop\
    \ Logic\nWhen the program starts, the ball will be dropped. User will move man\
    \ along the bottom of the screen to try to catch the dropped ball. Here, you will\
    \ write code that drops ball. A variable named `BallSpeed` will determine how\
    \ fast the ball will be dropped.\n\nAdd the following form-level declaration:\n\
    ```csharp\nint BallSpeed;\n```\n\nAssign `BallSpeed` based on `Difficulty` value:\n\
    ```csharp\nBallSpeed = 0.5 * Difficulty + 5\n```\n\n`Timer` (`timerGame`) is used\
    \ to control ball movement. Add the modified code to the `Click` event procedure\
    \ of `btnStart`:\n\n```csharp\nprivate void btnStart_Click( object sender, EventArgs\
    \ e){\n    //Start button clicked\n    StatusGame = \"Playing\";\n    lblInstruction.Visible\
    \ = false;\n    PanelGame = pnlGame.CreateGraphics();\n    PanelGame.Clear(Color.Gold);\
    \ //time/score\n    RemainingTime = 60 * 1000; //milliseconds\n    Score = 0;\n\
    \    DisplayTime();\n    //Man\n    ManW = picMan.Width;\n    ManH = picMan.Height;\n\
    \    ManDeltaX = 10;\n    ManX = 375;\n    ManY = pnlGame.Height - ManH;\n   \
    \ PanelGame.DrawImage(picMan.Image, ManX, ManY);\n    //Bird\n    BirdW = picBird.Width;\n\
    \    BirdH = picBird.Height;\n    //Ball\n    BallW = picBall.Width + 10;\n  \
    \  BallH = picBall.Height;\n    PlaceBirdAndBall();\n    //Start timer\n    BallSpeed\
    \ = Convert.ToInt32(0.5 * Difficulty) + 5;\n    timerGame.Start();\n}\n```\n\n\
    ### Step 16: Updating Ball Position\nThe ball position is updated in the `Tick`\
    \ event procedure of `timerGame` using the following code:\n\n```csharp\nprivate\
    \ void timerGame_Tick( object sender, EventArgs e){\n    ClearBall();\n    BallY\
    \ = BallY + BallSpeed;\n    PanelGame.DrawImage(picBall.Image, BallX, BallY);\n\
    }\n```\n\nThe code uses the new subroutine `ClearBall` which removes the ball\
    \ from its current location before moving it to a new position. Add this subroutine\
    \ to your program:\n\n```csharp\nprivate void ClearBall(){\n    PanelGame.FillRectangle(Brushes.Gold,\
    \ BallX, BallY,\n        BallW + 5, BallH + 5);\n}\n```\n\n### Step 17: Testing\
    \ Random Drop\nSave and run program. Then click on `Start` button. Now, the ball\
    \ is dropped in a random position:\n![](Image00046.jpg)\nFigure 6.12 Ball is dropped\
    \ in a random position:\nBut the ball still falls until it disappears across the\
    \ screen. You need two more pieces of code: one to move man under the ball and\
    \ another one to determine whether man can catch the falling ball or not.\n\n\
    ### Step 18: Keyboard Movement\nThe aim of the game is to move man under the falling\
    \ ball so he can catch it. Man can be moved using two different methods: First,\
    \ he can be moved using the left and right buttons on the keypad. With each key\
    \ press, you change `ManX` to the extent that `ManDeltaX` is in a certain direction.\
    \ You use a new variable `KeyPressed` to track which key is being pressed. Add\
    \ the following declarations to the form-level declaration:\n\n```csharp\nString\
    \ KeyPressed = \"Empty\";\n```\n\nYou detect a key presses on `KeyDown` procedure\
    \ of form with the following code:\n\n```csharp\nprivate void FormCatchingBall_KeyDown(\
    \ object sender, KeyEventArgs e){\n    //Check which arry key is pressed to move\
    \ man\n    if (e.KeyCode == Keys.Left)\n        KeyPressed = \"Left\";\n    else\
    \ if (e.KeyCode == Keys.Right)\n        KeyPressed = \"Right\";\n}\n```\n\n###\
    \ Step 19: Key Release\nYou also need a code to notify when the key is released.\
    \ This code is placed into the `KeyUp` event procedure of the form:\n\n```csharp\n\
    private void FormCatchingBall_KeyUp( object sender, KeyEventArgs e){\n    KeyPressed\
    \ = \"Empty\";\n}\n```\n\n### Step 20: Implementing Keyboard Movement\nAdd the\
    \ modified code of `Tick` event procedure of `timerGame` control:\n\n```csharp\n\
    private void timerGame_Tick( object sender, EventArgs e){\n    ClearBall();\n\
    \    BallY = BallY + BallSpeed;\n    PanelGame.DrawImage(picBall.Image, BallX,\
    \ BallY);\n    //Move man\n    ClearMan();\n    if (KeyPressed == \"Left\") {\n\
    \        ManX = ManX - ManDeltaX;\n        if (ManX < 0)\n            ManX = 0;\n\
    \    }\n    else if (KeyPressed == \"Right\") {\n        ManX = ManX + ManDeltaX;\n\
    \        if (ManX > (pnlGame.Width - ManW))\n            ManX = pnlGame.Width\
    \ - ManW;\n    }\n    PanelGame.DrawImage(picMan.Image, ManX, ManY);\n}\n```\n\
    \nJust like the code that moves the ball, this code uses another subroutine `ClearMan`\
    \ to delete man from its current location. Add the following subroutine:\n\n```csharp\n\
    private void ClearMan(){\n    PanelGame.FillRectangle(Brushes.Gold, ManX, ManY,\
    \ ManW + 50, ManH);\n}\n\n\n### Step 21: Verification\nSave and run the project.\
    \ Click on the Start button. Make man move by pressing left and right arrow keys:\n\
    ![](Image00047.jpg)\nFigure 6.13 User now can move man to left and right using\
    \ arrow keys\n\n### Step 22: Mouse Movement\nNow you will write the code for the\
    \ second method to move man: use the left and right buttons on the mouse. Define\
    \ a form level variable to track which button is clicked (`MouseClicked`):\n\n\
    ```csharp\nString ButtonClicked = \"Empty\";\n```\n\nNow, add this code to the\
    \ `MouseDown` event procedure of `pnlGame`:\n\n```csharp\nprivate void pnlGame_MouseDown(\
    \ object sender, MouseEventArgs e){\n    if (e.Button == MouseButtons.Left)\n\
    \        MouseClicked = \"Left\";\n    else if (e.Button == MouseButtons.Right)\n\
    \        MouseClicked = \"Right\";\n}\n```\n\nWith this code, when the mouse is\
    \ on the game panel, the left and right mouse buttons will replace the click action\
    \ of the left and right arrow keys. Add the following code to the `MouseUp` event\
    \ procedure from `pnlGame`:\n\n```csharp\nprivate void pnlGame_MouseUp( object\
    \ sender, MouseEventArgs e){\n    MouseClicked = \"Empty\";\n}\n```\n\n### Step\
    \ 23: Final Integration\nThen, add the modified code to the `Tick` event procedure\
    \ of `timerGame` control:\n\n```csharp\nprivate void timerGame_Tick( object sender,\
    \ EventArgs e){\n    ClearBall();\n    BallY = BallY + BallSpeed;\n    PanelGame.DrawImage(picBall.Image,\
    \ BallX, BallY);\n    //Move man\n    ClearMan();\n    if (KeyPressed == \"Left\"\
    \ || ButtonClicked == \"Left\") {\n        ManX = ManX - ManDeltaX;\n        if\
    \ (ManX < 0)\n            ManX = 0;\n    }\n    else if (KeyPressed == \"Right\"\
    \ || ButtonClicked == \"Right\") {\n        ManX = ManX + ManDeltaX;\n       \
    \ if (ManX > (pnlGame.Width - ManW))\n            ManX = pnlGame.Width - ManW;\n\
    \    }\n    PanelGame.DrawImage(picMan.Image, ManX, ManY);\n}\n```\n\n### Step\
    \ 25: Final Test\nSave and run program. Make sure you can now move man with the\
    \ left and right arrow keys and with both mouse buttons:\n![](Image00048.jpg)\n\
    Figure 6.14 User now can now move man with the left and right arrow keys and with\
    \ both mouse buttons\n"
