    ```\n\n"
- fmt: "\n`Ufo` will follow some rules. `Ufo1` will only move vertically on the left\
    \ side of the playing field, while `Ufo2` will only move vertically on the right\
    \ side of the playing field. The vertical speed will be random between values\
    \ 1 and 4 (you can change it yourself). `Ufo` can move up and down. If it moves\
