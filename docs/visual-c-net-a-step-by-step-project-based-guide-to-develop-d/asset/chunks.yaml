  trans: "\n\n```csharp\nprivate void FormFightingPlane_Load(object sender, EventArgs\
    \ e)\n{\n    try\n    {\n        StreamReader fileInput = new StreamReader(Application.StartupPath\
    \ + \"\\\\plane.ini\");\n        NumberOfPlayer = Convert.ToInt32(fileInput.ReadLine());\n\
    \        Difficulty = Convert.ToInt32(fileInput.ReadLine());\n        fileInput.Close();\n\
    \    }\n    catch\n    {\n        NumberOfPlayer = 1;\n        Difficulty = 1;\n\
    \    }\n    // 使表单可见以便点击选项\n    this.Show();\n    pnlOption.Visible = true;\n\
    \    if (Difficulty == 1)\n        rdoEasiest.PerformClick();\n    else if (Difficulty\
    \ == 2)\n        rdoEasy.PerformClick();\n    else if (Difficulty == 3)\n    \
    \    rdoHard.PerformClick();\n    else\n        rdoHardest.PerformClick();\n \
    \   if (NumberOfPlayer == 1)\n        rdoOnePlayer.PerformClick();\n    else\n\
    \        rdoTwoPlayers.PerformClick();\n    pnlOption.Visible = false;\n    Player1Rem\
    \ = RudalMax;\n    Player2Rem = RudalMax;\n    lblRemPlayer1.Text = Player1Rem.ToString();\n\
    \    lblRemPlayer2.Text = Player2Rem.ToString();\n    // 创建两个 TwoPlayer 对象\n \
    \   MyGraphics = pnlGame.CreateGraphics();\n    MyBrush = new SolidBrush(pnlGame.BackColor);\n\
    \    Player1 = new TwoPlayer();\n    Player2 = new TwoPlayer();\n    Player1.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\bomber1.png\");\n    Player2.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\bomber2.png\");\n}\n```\n\n\
    请注意用于创建两个 `TwoPlayer` 对象并初始化 `MyImage` 属性的代码。将 `bomber1.png` 和 `bomber2.png` 图形文件复制到\
    \ `bin\\Debug` 文件夹中。\n\n### 步骤 19\n\n此时，用户可以点击“新游戏”（`btnGame`）来开始游戏。将添加以下步骤：\n\
    \n- 移除所有图形对象。\n- 将 `btnGame` 的 `Text` 属性更改为“停止游戏”。\n- 禁用 `btnOption`。\n- 禁用退出按钮。\n\
    - 将 `Player1Hit` 和 `Player2Hit` 重置为 `0`。\n- 将 `Player1Rem` 和 `Player2Rem` 重置为\
    \ `RudalMax`。\n- 将 `Player1` 和 `Player2` 对象置于起始位置（使用 `TwoPlayer` 类的 `Place` 方法）。\n\
    \n这些这些步骤的代码非常简单。`Player1` 对象将垂直居中于 `pnlGame` 靠近左边缘的位置。`Player2` 对象将垂直居中于 `pnlGame`\
    \ 靠近右边缘的位置。`btnGame` 按钮也用于停止游戏。当用户点击 `btnGame` 按钮时（当其 `Text` 属性为“停止游戏”时），需要执行以下操作：\n\
    \n- 删除 `Player1` 和 `Player2` 对象（使用 `TwoPlayer` 类的 `Remove` 方法）。\n- 将 `Text` 属性从\
    \ `btnGame` 更改为“开始游戏”。\n- 启用 `btnOption`。\n- 启用退出按钮。\n- 显示“游戏结束”消息。\n\n所有这些步骤的代码都放在\
    \ `btnGame` 的 `Click` 事件过程中。给出代码如下：\n\n```csharp\nprivate void btnGame_Click(object\
    \ sender, EventArgs e)\n{\n    if (btnGame.Text == \"New Game\")\n    {\n    \
    \    MyGraphics.Clear(pnlGame.BackColor);\n        btnGame.Text = \"Stop Game\"\
    ;\n        pnlOption.Enabled = false;\n        btnExit.Enabled = false;\n    \
    \    Player1Hit = 0;\n        Player2Hit = 0;\n        lblHitPlayer1.Text = \"\
    0\";\n        lblHitPlayer2.Text = \"0\";\n        Player1Rem = RudalMax;\n  \
    \      Player2Rem = RudalMax;\n        lblRemPlayer1.Text = Player1Rem.ToString();\n\
    \        lblRemPlayer2.Text = Player2Rem.ToString();\n        Player1.Location\
    \ = new Rectangle(5, (int)(0.5 * pnlGame.ClientSize.Height - 0.5 * Player1.MyImage.Height),\
    \ Player1.MyImage.Width, Player1.MyImage.Height);\n        Player2.Location =\
    \ new Rectangle(pnlGame.ClientSize.Width - 5, (int)(0.5 * pnlGame.ClientSize.Height\
    \ - 0.5 * Player2.MyImage.Height), Player2.MyImage.Width, Player2.MyImage.Height);\n\
    \        Player1.Place(MyGraphics);\n        Player2.Place(MyGraphics);\n    }\n\
    \    else\n    {\n        Player1.Remove(MyGraphics, MyBrush);\n        Player2.Remove(MyGraphics,\
    \ MyBrush);\n        btnGame.Text = \"New Game\";\n        pnlOption.Enabled =\
    \ true;\n        btnExit.Enabled = true;\n        MyGraphics.DrawString(\"Game\
    \ Over\", new Font(\"Arial\", 24), Brushes.Yellow, 530, 210);\n    }\n}\n```\n\
    \n将此过程添加到你的项目中。“游戏结束”消息的位置通过反复尝试来获得。保存并运行项目。点击“新游戏”按钮，两个玩家将如图 7.13 所示出现。在退出游戏之前，点击“停止游戏”按钮以确保过程正常运行。\n\
    \n### 步骤 20\n\n你需要移动玩家向上和向下的能力。如果你选择使用键盘控制，可以使用 `KeyDown` 事件。此事件与之前的 `KeyPress`\
    \ 事件相同，但更灵活：\n\n```csharp\nprivate void FightingPlane_KeyDown(object sender, EventArgs\
    \ e){}\n```\n\n`KeyCode` 属性是 `Keys` 类的成员。当需要时，Visual C# IDE 会提供 `KeyCode` 值。`KeyDown`\
    \ 事件通常带有 `switch` 结构，并为每个按键（或按键组合）编写 `case` 子句。在游戏中，你选择以下键来控制移动并发射：\n\n- **玩家\
    \ 1**: A – 向上，Z – 向下，S 发射\n- **玩家 2**: K – 向上，M – 向下，J 发射\n\n你可以根据需要进行修改。`Player1`\
    \ 垂直居中于 `pnlGame` 靠近左边缘。`Player2` 垂直居中于 `pnlGame` 靠近右边缘。当用户点击按钮时，会出现“游戏结束”消息。每当按下键时，你都会（使用\
    \ `TwoPlayer` 类的 `Move` 方法）向下或向上移动。在此处添加一个常量声明：\n\n```csharp\nconst int Increment\
    \ = 5;\n\nprivate void FightingPlane_KeyDown(object sender, EventArgs e)\n{\n\
    \    switch (e.KeyCode)\n    {\n        case Keys.A:\n            Player1.Move(MyGraphics,\
    \ MyBrush, 0, -Increment);\n            if (Player1.Location.Y < 0)\n        \
    \        Player1.Location.Y = 0;\n            break;\n        case Keys.Z:\n \
    \           Player1.Move(MyGraphics, MyBrush, 0, Increment);\n            if (Player1.Location.Y\
    \ > pnlGame.ClientSize.Height)\n                Player1.Location.Y = pnlGame.ClientSize.Height;\n\
    \            break;\n        case Keys.K:\n            Player2.Move(MyGraphics,\
    \ MyBrush, 0, -Increment);\n            if (Player2.Location.Y < 0)\n        \
    \        Player2.Location.Y = 0;\n            break;\n        case Keys.M:\n \
    \           Player2.Move(MyGraphics, MyBrush, 0, Increment);\n            if (Player2.Location.Y\
    \ > pnlGame.ClientSize.Height)\n                Player2.Location.Y = pnlGame.ClientSize.Height;\n\
    \            break;\n    }\n}\n```\n\n该代码放在表单的 `KeyDown` 事件中。\n\n"
- fmt: "\nNote that you do not allow `KeyDown` events to occur if the user has not\
    \ started a game (that is, if `btnGame` still says New Game ). Add this procedure\
    \ to your project. You need to make sure that `form` always has the focus to intercept\
    \ the keys to move players. To be sure, add this line: `this.Focus()` at the end\
    \ of the `Click` procedure on `btnGame` which is used to start a new game.![](Image0079.jpg)Figure\
    \ 7.15 Both players now can move up and down.\n\n### Step 21\nSave and run the\
    \ project. Select `Two` option in `grpPlayer` so you can see whether both players\
    \ can move. Click `New Game`. Press `A` and `Z` to move player 1 and press `K`\
    \ and `M` to move player 2. Make sure both players do not move past the upper\
    \ or lower limit of the control panel as shown in Figure 7.15.\n\n### Step 22\n\
    In this project, you will give players the ability to throw rudal at each other.\
    \ Rudal will be represented by `Image` object just like player. The only difference\
    \ here is that when rudal is fired, it moves without user interaction at a predetermined\
    \ speed and its position is updated by the timer control. And, you need to constantly\
    \ check if the rudal collides with another object. `TwoPlayer` class does not\
    \ have properties for speed, or methods that check collisions. So, you need a\
    \ new class to define rudal.\n\nYou will explain rudal using `MovingRudal` class.\
    \ This class will have a number of properties and methods from `TwoPlayer` class\
    \ (using inheritance), plus the speed properties and a method for checking collision.\
    \ To build this class, you can start from scratch, with all new properties and\
    \ new methods. Or, you can take advantage of the concept of inheritance in object-oriented\
    \ programming. Inheritance is a concept where you can build an existing class-based\
    \ class, by adding its own properties and/or methods. This will save work.\n\n\
    You will see how inheritance is used. You will add the collision checking method\
    \ later. Now, just focus on class properties. Add a class to the project, name\
    \ it `MovingRudal`. Use the following class code:\n\n```csharp\nclass MovingRudal\
    \ : TwoPlayer{\n    public MovingRudal ()\n    {\n    }\n    public int XSpeed;\n\
    \    public int YSpeed;\n}\n```\n\nThis will make all the properties and methods\
    \ of `TwoPlayer` class available to the new class (`MovingRudal`). Other lines\
    \ of code add speed properties (`XSpeed`, speed in the horizontal direction; `YSpeed`,\
    \ speed in the vertical direction). These two properties represent how far the\
    \ `MovingRudal` will move in a certain direction.\n\n### Step 23\nRudals are represented\
    \ by two `MovingRudal` objects (`Rudal1` is rudal fired by player 1, while `Rudal2`\
    \ is rudal fired by player 2). Horizontal speed is determined by the rudal speed\
    \ constant with zero vertical speed. Add the following level-form declarations\
    \ to your project:\n\n```csharp\nMovingRudal Rudal1, Rudal2;\nconst int RudalSpeed\
    \ = 30;\n```\n\nSpeed is another parameter that you can change yourself as you\
    \ like with the value that you think best.\n\n### Step 24\nSnowballs are created\
    \ in the `Load` procedure from the form. Add the following four lines to the procedure\
    \ (after the lines of code that specify `TwoPlayer` objects):\n\n```csharp\nprivate\
    \ void FightingPlane_Load(object sender, EventArgs e) {\n    try {\n        StreamReader\
    \ fileInput = new StreamReader(Application.StartupPath + \"\\\\plane.ini\");\n\
    \        NumberOfPlayer = Convert.ToInt32(fileInput.ReadLine());\n        Difficulty\
    \ = Convert.ToInt32(fileInput.ReadLine());\n        fileInput.Close();\n    }\n\
    \    catch {\n        NumberOfPlayer = 1;\n        Difficulty = 1;\n    }\n  \
    \  // Makes form visible so options can be clicked\n    this.Show();\n    pnlOption.Visible\
    \ = true;\n    if (Difficulty == 1)\n        rdoEasiest.PerformClick();\n    else\
    \ if (Difficulty == 2)\n        rdoEasy.PerformClick();\n    else if (Difficulty\
    \ == 3)\n        rdoHard.PerformClick();\n    else\n        rdoHardest.PerformClick();\n\
    \    if (NumberOfPlayer == 1)\n        rdoOnePlayer.PerformClick();\n    else\n\
    \        rdoTwoPlayers.PerformClick();\n    pnlOption.Visible = false;\n    Player1Rem\
    \ = RudalMax;\n    Player2Rem = RudalMax;\n    lblRemPlayer1.Text = Player1Rem.ToString();\n\
    \    lblRemPlayer2.Text = Player2Rem.ToString();\n    // Creates TwoPlayer objects\n\
    \    MyGraphics = pnlGame.CreateGraphics();\n    MyBrush = new SolidBrush(pnlGame.BackColor);\n\
    \    Player1 = new TwoPlayer();\n    Player2 = new TwoPlayer();\n    Player1.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\bomber1.png\");\n    Player2.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\bomber2.png\");\n    Rudal1\
    \ = new MovingRudal();\n    Rudal2 = new MovingRudal();\n    Rudal1.MyImage =\
    \ Image.FromFile(Application.StartupPath + \"\\\\rudal1.png\");\n    Rudal2.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\rudal2.png\");\n    btnGame.Focus();\n\
    }\n```\n\n### Step 25\nPlayer 1 fires rudal by pressing the `S` key. Player 2\
    \ fires rudal by pressing the `J` key. You set a number of rules in firing the\
    \ rudal. First, you will only allow one rudal from each player to be displayed\
    \ on the screen at a time (no multi pitching). Second, the player cannot throw\
    \ rudal if he runs out of rations. If these conditions are met, when the player\
    \ fires rudal, these steps are carried out:\n\n* Decrease the remaining rudals.\n\
    * Update the remaining rudals.\n* Position the rudal to the side of the player\
    \ (in the right of player 1, in the left of player 2).\n* Place rudal snowballs\
    \ on graphic objects using `Place` method of `TwoPlayer` class.\n\nThis code for\
    \ firing rudal is placed in the existing `KeyDown` event procedure. Here is the\
    \ modified code:\n\n```csharp\nprivate void FightingPlane_KeyDown(object sender,\
    \ EventArgs e) {\n    if (btnGame.Text == \"New Game\")\n        return;\n   \
    \ switch (e.KeyCode) {\n        case Keys.A:\n            Player1.Move(MyGraphics,\
    \ MyBrush, 0, -Increment);\n            if (Player1.Location.Y < 0)\n        \
    \        Player1.Location.Y = 0;\n            break;\n        case Keys.Z:\n \
    \           Player1.Move(MyGraphics, MyBrush, 0, Increment);\n            if (Player1.Location.Y\
    \ > pnlGame.ClientSize.Height)\n                Player1.Location.Y = pnlGame.ClientSize.Height\
    \ - Player1.Height;\n            break;\n        case Keys.S:\n            if\
    \ (!Rudal1.IsVisible && Player1Rem > 0) {\n                Player1Rem--;\n   \
    \             lblRemPlayer1.Text = Player1Rem.ToString();\n                Rudal1.Location\
    \ = new Rectangle(Player1.Location.X + Player1.Location.Width, Player1.Location.Y,\
    \ Rudal1.MyImage.Width, Rudal1.MyImage.Height);\n                Rudal1.Place(MyGraphics);\n\
    \            }\n            break;\n        case Keys.K:\n            Player2.Move(MyGraphics,\
    \ MyBrush, 0, -Increment);\n            if (Player2.Location.Y < 0)\n        \
    \        Player2.Location.Y = 0;\n            break;\n        case Keys.M:\n \
    \           Player2.Move(MyGraphics, MyBrush, 0, Increment);\n            if (Player2.Location.Y\
    \ > pnlGame.ClientSize.Height)\n                Player2.Location.Y = pnlGame.ClientSize.Height\
    \ - Player2.Height;\n            break;\n        case Keys.J:\n            if\
    \ (!Rudal2.IsVisible && Player2Rem > 0) {\n                Player2Rem--;\n   \
    \             lblRemPlayer2.Text = Player2Rem.ToString();\n                Rudal2.Location\
    \ = new Rectangle(Player2.Location.X - Player2.Location.Width, Player2.Location.Y,\
    \ Rudal2.MyImage.Width, Rudal2.MyImage.Height);\n                Rudal2.Place(MyGraphics);\n\
    \            }\n            break;\n    }\n}\n```\n"
