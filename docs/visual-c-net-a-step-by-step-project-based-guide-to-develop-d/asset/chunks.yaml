    # Button Properties


    | Property | Description |

    | :--- | :--- |

    | Height | Form height in pixel. |

    | Help | Used to get or set a value that indicates whether Help button needs to
    be displayed or not. |

    | Icon | Used to get or set an icon for a form. |

    | Left | Distance from the left edge of the form, in pixel. |

    | MaximizeButton | Used to get or set a value that indicates whether maximized
    button is displayed on the caption bar. |

    | MinimizeButton | Used to get or set a value that indicates minimized button
    is displayed on the caption bar of the form. |

    | StartPosition | Used to get or set the initial position of the form when the
    application is run. |

    | Text | Used to get or set the form title. |

    | Top | Distance from the top edge of the form, in pixel. |

    | Width | Form width in pixel. |


    The general syntax for calling a method is to write the name of the control, a
    dot, and then the method name. For the methods of `Form` object, the name used
    is `this`. This is a C# keyword that is used to refer to a form. So, to close
    a form, you use `this.Close()`.


    ## 1.2 A number of methods from Form object


    | Method | Description |

    | :--- | :--- |

    | Close | Close the form. |

    | Focus | Set the focus on the form. |

    | Hide | Hide the form. |

    | Refresh | Force the form to displayed again. |

    | Show | Set the Visible property as `True`. |


    ## 1.3 A number of Event from Form object


    | Event | Description |

    | :--- | :--- |

    | Activated | Occurs when the form is activated by the user. |

    | Click | Occurs when the form is clicked by the user. |

    | FormClosing | Occurs when the form is closed. |

    | DoubleClick | Occurs when the form double clicked. |

    | Load | Occurs when the form is displayed for the first time. |

    | Paint | Occurs when the form is reloaded. |


    General uses of `Form` objects:

    - Set `Name` and `Text` properties.

    - Set `StartPosition` property, for example, to `CenterScreen`.

    - Set `BorderStyle` property to a certain value such as `FixedD`.

    - Write initialization code needed in the `Load` event. To double-click on the
    form, write finalization code in the `FormClosing` event.


    ## 1.4 A number of properties of Button object


    | Property | Description |

    | :--- | :--- |

    | Name | Used to get or set `Button` object name. |

    | BackColor | Used to get or set background color of the button. |

    | Enabled | If it is `False`, the button becomes visible but cannot accept clicks
    from user. |

    | Font | Used to get or set font name, size, and style. |

    | ForeColor | Used to get or set the color of text or graphics. |

    | Image | Used to get or set the image to be displayed on the button control.
    |

    | Text | Used to get or set the text or string displayed on the button. |

    | TextAlign | Used to get or set text alignment on button control. |


    ## 1.5 A number of methods of Button object


    | Method | Description |

    | :--- | :--- |

    | Focus | Used to assign focus to the button. |

    | PerformClick | Generates a `Click` event for a button. |


    ## 1.6 The most popular event of Button object


    | Event | Description |

    | :--- | :--- |

    | Click | This event is triggered when the button is selected by clicking on it
    or by pressing the key. |


    General uses of `Button` control:

    - Set `Name` and `Text` properties.

    - Write the code in the `Click` event.

    - You can also change `Font`, `BackColor`, and `ForeColor` properties.


    The Label control is used to display text which the user cannot edit directly.
    The text on a label can only be changed when the program is run when responding
    to an event.


    ## 1.7 A number of properties of Label object


    | Property | Description |

    | :--- | :--- |

    | Name | Used to get or set `Label` object name. |

    | AutoSize | Used to get or set a value that indicates whether the label automatically
    changes size or not. The default value is `True`. |

    | BackColor | Used to get or set background color on label. |

    | BorderStyle | Used to get or set edge style for label. |

    | Font | Used to get or set the name, style, and size of the font. |

    | ForeColor | Used to get or set the color of text or graphics. |

    | Text | Used to get or set the string displayed on the label. |

    | TextAlign | Used to get or set text alignment on label. |


    Note: by default, label control cannot be resized. To do this, set the `AutoSize`
    property to `False`.


    ## 1.8 One of methods of Label object


    | Method | Description |

    | :--- | :--- |

    | Refresh | Force an update to the content of a `Label` control. |


    ## 1.9 A number of Event Procedures from Label object


    | Event | Description |

    | :--- | :--- |

    | Click | Triggered when the user clicks on a label. |

    | DoubleClick | Triggered when the user double clicks on a label. |


    Common uses of `Label` controls:

    - Set the `Name` and `Text` properties.

    - Set the `Font`, `BackColor`, and `ForeColor` properties.

    - Set the `AutoSize` property to `False` and choose the desired value for `TextAlign`.


    # Timer Properties


    The `Timer` control in Visual C# can generate events without any input from the
    user. This timer control works behind the scenes on your project, which results
    in events with the time interval you set. This event generation feature is very
    helpful when the screen wants to be updated at regular time intervals.


    ## 1.10 A number of properties of Timer object


    | Property | Description |

    | :--- | :--- |

    | Name | Used to get or set `Timer` object name. |

    | Enabled | Used to enable and disable timer. When the value is `True`, this timer
    control continues operations until the `Enabled` property is `False`. |

    | Interval | Milliseconds (there are 1000 milliseconds in one second) between
    each `Tick` event call from the timer control. |


    ## 1.11 One of events of Timer object


    | Event | Description |

    | :--- | :--- |

    | Tick | This event procedure is called every interval (milliseconds) when the
    `Enabled` property is `True`. |


    To use the `Timer` control, you add it to your application like other controls.
    This control will be placed in the area below the form in the design window. The
    `Enabled` property of the timer control is `False` at design time. You enable
    a timer in the code by changing this property to `True`.


    Common uses of `Timer` control:

    - Set the `Name` property and the `Interval` property.

    - Write the code in the `Tick` event.


    # TextBox Properties


    The `TextBox` control is used to display information entered at the time of design,
    by user when the program is run, or by code in the program.


    ## 1.12 A number of properties of TextBox object


    | Property | Description |

    | :--- | :--- |

    | Name | Used to get or set the name of the text box. |

    | AutoSize | Used to get or set a value that indicates whether the height of the
    text box automatically adjusts when the font in the control changes. |

    | BackColor | Used to get or set the background color from the text box. |

    | BorderStyle | Used to get or set the edge style of the text box. |

    | Font | Used to get or set font name, style, and size. |

    | ForeColor | Used to get or set the color of text or graphics. |

    | HideSelection | Used to get or set a value that indicates whether the selected
    text in the text box control is still highlighted when the control loses focus.
    |

    | Lines | Used to get or set a line of text in a text box control. |

    | MaxLength | Used to get or set the maximum number of characters that a user
    can type in the text box control. |

    | MultiLine | Used to get or set a value that indicates whether the text box can
    contain multi-line text. |

    | PasswordChar | Used to get or set character to disguise password characters
    in a one-line TextBox control. |

