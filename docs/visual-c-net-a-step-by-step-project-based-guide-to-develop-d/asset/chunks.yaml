  trans: "\n\n## TextBox \n\n| 属性 | 描述 |\n| :--- | :--- |\n| `ReadOnly` | 获取或设置一个值，指示文本框控件中的文本是否为只读。\
    \ |\n| `ScrollBars` | 获取或设置在多行文本框控件中显示哪些滚动条。 |\n| `SelectedText` | 获取或设置一个值，表示当前选中的文本。\
    \ |\n| `SelectionLength` | 获取或设置文本框中被选中的字符数。 |\n| `SelectionStart` | 获取或设置文本框中选中文文本的起始点。\
    \ |\n| `Tag` | 存储字符串表达式。 |\n| `Text` | 获取或设置文本框中的当前文本。 |\n| `TextAlign` | 获取或设置文本框上的文本对齐方式。\
    \ |\n| `TextLength` | 获取文本框中文本的长度。 |\n\n表 1.13 `TextBox` 对象的若干方法。\n\n| 方法 | 描述\
    \ |\n| :--- | :--- |\n| `AppendText` | 将文本追加到文本框中的当前文本。 |\n| `Clear` | 清除文本框中的所有文本。\
    \ |\n| `Copy` | 将选中的文本复制到剪板。 |\n| `Cut` | 将选中的文本移动到剪板。 |\n| `Focus` | 将光标置于指定的文本框上。\
    \ |\n| `Paste` | 用 `Clipboard` 中的内容替换文本框中的当前选择。 |\n| `SelectAll` | 选中文本框中的所有文本。\
    \ |\n| `Undo` | 取消文本框的最后一次编辑操作。 |\n\n表 1.14 `TextBox` 对象的若干事件。\n\n| 事件 | 描述 |\n\
    | :--- | :--- |\n| `Click` | 用户点击文本框时发生。 |\n| `Enter` | 控件接收焦点时发生。 |\n| `KeyDown`\
    \ | 当控件拥有焦点且按下按键时发生。 |\n| `KeyPress` | 当控件拥有焦点且按下按键时发生。 |\n| `Leave` | 当用户离开文本框时触发。这是在完成编辑完成后检查文本框内容的一种方法。\
    \ |\n| `TextChanged` | 当 `Text` 属性的值发生变化时。 |\n\n### `TextBox` 控件作为查看控件的般用法：\n\n\
    - 设置 `Name` 属性。用所需的字符串初始化 `Text` 属性。\n- 将 `ReadOnly` 属性设置为 `True`。\n- 如果用于显示多行文本，将\
    \ `MultiLine` 属性设置为 `True`。\n- 你也可以更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\n\
    ### `TextBox` 控件作为输入设备的一般用法：\n\n- 设置 `Name` 属性。用所需的字符串初始化 `Text` 属性。\n- 如果用于显示多行文本，将\
    \ `MultiLine` 属性设置为 `True`。\n- 在代码中，在需要时给控件赋予 `Focus`。\n- 为本章将讨论的 `KeyPress` 事件提供按键捕获代码。\n\
    - 在 `Leave` 事件发生时读取 `Text` 属性。\n- 你也可以更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\
    \n## CheckBox\n\nVisual C# 有许多控件，只需通过点击鼠标即可为用户提供许多选择。这些控件具有吸引力、令人熟悉，并且最大限度地减少了应用程序中错误的可能性。你将使用许多此类控件。\n\
    \n`CheckBox` 控件提供了一种提供若干潜在选项选择的方法。`CheckBox` 用于许多 Windows 应用程序。\n\n表 1.15 `CheckBox`\
    \ 对象的若干属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置复选框名称。 |\n| `BackColor`\
    \ | 获取或设置复选框的背景颜色。 |\n| `Checked` | 获取或设置一个值，指示复选框是否被选中。 |\n| `Font` | 获取或设置字体名称、样式和大小。\
    \ |\n| `ForeColor` | 获取或设置文本或图形的颜色。 |\n| `Text` | 获取或设置显示在复选框旁的字符串。 |\n| `TextAlign`\
    \ | 获取或设置复选框内的文本对齐。 |\n\n表 1.16 `CheckBox` 对象的一种方法。\n\n| 方法 | 描述 |\n| :--- | :---\
    \ |\n| `Focus` | 将焦点移动到特定的复选框。 |\n\n表 1.17 `CheckBox` 对象的若干事件。\n\n| 事件 | 描述 |\n\
    | :--- | :--- |\n| `CheckedChanged` | 当 `Checked` 属性的值发生变化时发生，无论是通过代码还是点击复选框时。\
    \ |\n| `Click` | 当点击复选框时触发。Visual C# 会自动更改 `Checked` 属性。 |\n\n当点击复选框时，如果那里没有勾选标记（`Checked\
    \ = False`），则 Visual C# 将在该处放置勾选标记并将 `Checked` 属性设置为 `True`。如果点击且之前那里有勾选标记（`Checked\
    \ = True`），则勾选标记将消失，`Checked` 属性将变为 `False`。\n\n### `CheckBox` 控件的一般用法：\n\n- 设置\
    \ `Name` 和 `Text` 属性。\n- 初始化 `Checked` 属性。\n- 监控 `Click` 或 `CheckedChanged` 事件以确定复选框是否被选中。\n\
    - 更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\n## RadioButton\n\n`RadioButton` 控件提供了一种在若干潜在选项中进行互斥选择的能力。`RadioButton`\
    \ 在许多 Windows 应用程序中工作。作为一个组工作，只有一个按钮可以被选中。`RadioButton` 广泛用于。由于它是 `RadioButton`\
    \ 控件，以下是 `RadioButton` 的控件、方法和事件：\n\n表 1.18 `RadioButton` 对象的若干属性。\n\n| 属性 | 描述\
    \ |\n| :--- | :--- |\n| `Name` | 获取或设置单选按钮名称。 |\n| `BackColor` | 获取或设置单选按钮的背景颜色。\
    \ |\n| `Checked` | 获取或设置一个值，指示单选按钮是否被选中。 |\n| `Font` | 获取或设置字体名称、样式和大小。 |\n| `ForeColor`\
    \ | 获取或设置文本或图形的颜色。 |\n| `TextAlign` | 获取或设置单选按钮上的文本对齐。 |\n\n表 1.19 `RadioButton`\
    \ 的若干方法。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `Focus` | 将焦点移动到特定的单选按钮。 |\n| `PerformClick`\
    \ | 为特定的单选按钮产生 `Click` 事件。 |\n\n表 1.20 `RadioButton` 的若干事件。\n\n| 事件 | 描述 |\n|\
    \ :--- | :--- |\n| `CheckedChanged` | 当 `Checked` 属性的值发生变化时发生，无论是通过代码还是点击单选按钮时。\
    \ |\n| `Click` | 当点击单选按钮时触发。Visual C# 会自动更改 `Checked` 属性。 |\n\n### `RadioButton`\
    \ 的般用法：\n\n- 创建一个单选按钮组。\n- 为组中的每个按钮设置 `Name` 和 `Text` 属性。\n- 初始化 `Checked` 属性。\n\
    - 监控组中每个控件的事件。\n\n## GroupBox\n\n你已经知道复选框和单选按钮是一个组。`GroupBox` 控件提供了组织相关控件的方法。\n\
    \n要将控件放入组框，首先需要将 `GroupBox` 控件拖入表单。然后将每个控件放入组框。\n\n`GroupBox` 影响单选按钮的工作。`GroupBox`\
    \ 上的单选按钮作为一个组工作，与其他 `GroupBox` 上的单选按钮无关。\n\n表 1.21 `GroupBox` 对象的若干属性。\n\n| 属性\
    \ | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置组框的名称。 |\n| `Enabled` | 获取或设置一个值，指示组框是否可用。如果为\
    \ `False`，则组框中的所有控件都将被禁用。 |\n| `BackColor` | 获取或设置组框的背景颜色。 |\n| `Font` | 获取或设置字体名称、样式和大小。\
    \ |\n| `ForeColor` | 获取或设置文本的颜色。 |\n| `Text` | 获取或设置显示在组框标题区域的字符串。 |\n| `Visible`\
    \ | 如果为 `False`，它将隐藏组框（及其包含的所有控件）。 |\n\n`GroupBox` 控件有若干方法和事件，但它们都很少使用。你将更多关注与组内控件相关的方法和事件。\n\
    \n### `GroupBox` 的般用法：\n\n- 设置 `Text` 和 `Name` 属性。\n- 将所需的控件放入组框。\n- 监控组框中每个控件的事件。\n\
    \n## PictureBox\n\nVisual C# 提供了许多图形特性。`PictureBox` 控件是利用这些特性的主要工具之一。图片框控件可以显示图形文件（各种格式），并且可以利用许多图形函数，还可以用于动画。\n\
    \n表 1.22 `PictureBox` 对象的若干属性。\n\n"
- fmt: "\n| Property | Description |\n| :--- | :--- |\n| BackColor | Get or set the\
    \ background color from the picture box. |\n| BorderStyle | Indicate the edge\
    \ style for the picture box. |\n| Height | Heighy of the picture box in pixels.\
    \ |\n| Image | Set the graphic file to display in the picture box. |\n| Left |\
    \ The distance from the left edge of the form to the left edge of the picture\
    \ box, in pixels. |\n| SizeMode | Indicats how the picture is displayed. |\n|\
    \ Top | Lower edge distance from the area of ​​the form title to the top edge\
    \ of the picture box, in pixels. |\n| Width | Width of the picture box in pixels.\
    \ |\n\n### Table 1.23 One of Events of the PictureBox object\n\n| Event | Description\
    \ |\n| :--- | :--- |\n| Click | Triggered when a picture box is clicked. |\n\n\
    The `Image` property specifies the graphic file to be displayed. The five types\
    \ of graphics files that can be placed in the image box are as follows:\n\n###\
    \ Table 1.24 A number of acceptable graphic file types of PictureBox control\n\
    \n| File Type | Description |\n| :--- | :--- |\n| Bitmap | An image is represented\
    \ by pixels and stored as a collection that contains bits. This is the format\
    \ most commonly used by scanner and paintbrush programs. Format has a `.bmp` extension.\
    \ |\n| Icon | A special type of bitmap file with a maximum size of 32 x 32 pixels.\
    \ This format has the `.ico` extension. The icon is used to represent Windows\
    \ applications. |\n| Metafile | A file that stores an image as a collection that\
    \ contains graphical objects (lines, circles, polygons), not pixels. Metafile\
    \ has a more accurate resolution than bitmaps when the size is enlarged or reduced.\
    \ This format has a `.wmf` extension. |\n| JPEG | JPEG (Joint Photographic Experts\
    \ Group) is a compressed BMP format that supports 8 bits and 24 bit colors. This\
    \ format is popular on the Internet and is a common format for digital cameras.\
    \ JPEG format has the extension `.jpg`. |\n| GIF | GIF (Graphic Interchange Format)\
    \ is a compressed bmp format originally developed by CompuServe. This format supports\
    \ up to 256 bit colors and is also popular on the Internet. This format has a\
    \ `.gif` extension. |\n\nThe `SizeMode` property states how a particular image\
    \ will be displayed. There are five values that can be given to this property:\
    \ `Normal`, `CenterImage`, `StretchImage`, `AutoSize`, and `Zoom`. The effect\
    \ of each of these values is as follows:\n\n| Value of SizeMode | Effect |\n|\
    \ :--- | :--- |\n| Normal | The image is displayed at the initial size. If the\
    \ picture box is larger than the image, there will be free space. If the picture\
    \ box is smaller than the image, the image will be truncated. |\n| CenterImage\
    \ | The image is displayed at its initial size, centered on the picture box. If\
    \ the picture box is larger than the image, there will be free space. If the picture\
    \ box is smaller than the image, the image will be truncated. |\n| StretchImage\
    \ | The image will 'fill' the picture box. If the image is smaller than the picture\
    \ box, the image will expand. If the image is larger than the picture box, the\
    \ image will shrink. |\n| AutoSize | The opposite of `StretchImage`. The picture\
    \ box will change its dimensions to adjust the initial size of the image. |\n\
    | Zoom | Same with `StretchImage`. The image will adjust so it can be loaded in\
    \ the picture box. |\n\nNote that the dimensions remain unchanged for the `Normal`,\
    \ `CenterImage`, `StretchImage`, and `Zoom` values. With `AutoSize`, the picture\
    \ box will change size. This causes problems when the program runs if your form\
    \ is not large enough to load the picture box.\n\nGeneral uses of the PictureBox\
    \ control in displaying images:\n* Set the `Name` and `SizeMode` properties (often\
    \ with a `StretchImage` value).\n* Specify the `Image` property, both at the time\
    \ of design and when the program runs (run-time).\n\n# TUTORIAL 2: MATH GAME\n\
    \nIn this tutorial, you will build a project so that children can practice basic\
    \ skills in addition, subtraction, multiplication, and division operations. This\
    \ Math Game project can be used to choose the types of questions and what factors\
    \ you want to use. This project has three timing options.\n\nRandom math problems\
    \ using values from 0 to 9 will be presented. Timing options are provided to measure\
    \ accuracy and speed.\n\n| Description |\n| :--- |\n| There are many controls\
    \ used. Two label controls are used for title information, two for displaying\
    \ scores. There is a wide label in the middle of the form to display math questions.\
    \ And, long skinny label is used as separator. Two button controls are used to\
    \ start and stop question and one button to exit the project. There are three\
    \ group control boxes.![D:\\2___VB For Students\\Image2.png](Image00002.jpg)Figure\
    \ 2.1 Controls used in Math Game projectThe first group box holds four check box\
    \ controls that are used to select the type of questions. The second group box\
    \ holds eleven radio buttons that are used to select values that are used as factors\
    \ in calculations. The third group box contains three radio button controls for\
    \ timing options. A scroll bar control rod is used to change the time.Run the\
    \ project (press `<F5>`). This math game program will be displayed as follows:![](Image00003.jpg)Figure\
