    \n![](img/Image00075.jpg) 图 7.11 项目首次以默认选项显示。注意，如果无法打开配置文件，你将使用默认值。同样注意，在选择选项之前，你会先让表单（`this`）和面板（`pnlOption`）显示。你先选择难度选项，因为如果选择了两个玩家，该选项将无法启用。在选完选项后，面板的\
    \ `Visible` 属性将返回 False。\n\n### 步骤 14\n保存并运行项目。项目首次以默认选项（单玩家和最简单难度级别）显示，如图 7.11\
