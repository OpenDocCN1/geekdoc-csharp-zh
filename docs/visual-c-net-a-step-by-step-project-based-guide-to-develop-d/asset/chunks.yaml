    \        return;\n        }\n    }\n}\n```\n\n### 步骤 16\n保存并运行项目。现在可以宣布获胜者或平局（图\
    \ 6.12）。双人模式现在已完成。现在，你将看到如何实现单人模式游戏，即用户将与电脑对战。你将从让电脑进行随机移动（没有大脑！）开始。\n\n### 步骤\
    \ 17\n在玩家对电脑的游戏中，重要部分是决定给电脑什么样的思维过程或决策。你有两个选择：随机电脑和智能电脑。你将从编写随机电脑的代码开始。然后，你将编写智能电脑的代码，让电脑成为一个相当的对手。电脑移动背后的所有逻辑将实现在名为\
    \ `ComputerTurn` 的方法中。对于随机移动，电脑将随机选择网格上的一个空格，并在该格上放置符号（如果电脑先手则放置 X，如果人类先手则放置 O）。在以下表单层级添加一个随机对象：\n\
    \n```csharp\nRandom MyRandom = new Random();\n```\n\n在你的项目中编写以下 `ComputerTurn`\
    \ 方法：\n\n```csharp\nprivate void ComputerTurn(){\n    int BoxSelected;\n    int\
    \ i, n;\n    if (rdoRandom.Checked)\n    {\n        // Random logic\n        //\
    \ Put symbol on N-th empty box\n        n = MyRandom.Next(9 - NumberOfClick) +\
    \ 1;\n        i = 0;\n        for (BoxSelected = 0; BoxSelected < 9; BoxSelected++)\n\
    \        {\n            if (LabelArr[BoxSelected].Text == \"\")\n            \
    \    i++;\n            if (i == n)\n                break;\n        }\n      \
    \  // Put symbol on BoxSelected\n        lblBox_Click(LabelArr[BoxSelected], null);\n\
    \    }\n}\n```\n`ComputerTurn` 背后的逻辑非常简单。在任何时候，你都有 `9 - NumberOfClick` 个空格。要给特定的\
    \ `LabelArr[BoxSelected]` 放置符号，通过调用 `lblBox_Click(LabelArr[BoxSelected], null)`\
    \ 来模拟点击。程序将根据实现的逻辑决定放置 X 还是 O。\n\n### 步骤 18\n现在，你将实现 `ComputerTurn` 使电脑与人类对战。你需要修改两个方法。首先，当你开始游戏时，如果电脑先手，你需要调用\
    \ `ComputerTurn()`。修改 `btnStartStop` 的 `Click` 事件方法。\n"
- fmt: "\n## Tic Toe Computer AI Logic\n\nWith this code, computer will take its turn\
    \ when it plays first and gives `X` symbol or takes its turn when human first\
    \ and gives `O`.\n\n```csharp\nprivate void lblBox_Click( object sender, EventArgs\
    \ e)\n{\n    String WhoWin = \"\";\n    int i;\n    if (Clickable)\n    {\n  \
    \      // See which box clicked\n        Label BoxClicked;\n        BoxClicked\
    \ = (Label) sender;\n        // Last digit is the number extracted\n        i\
    \ = Convert.ToInt32(BoxClicked.Name[BoxClicked.Name.Length - 1].ToString()) -\
    \ 1;\n        // If it has been clicked, exit\n        if (LabelArr[i].Text !=\
    \ \"\")\n            return;\n        NumberOfClick++;\n        if (XTurn)\n \
    \       {\n            LabelArr[i].Text = \"X\";\n            XTurn = false;\n\
    \            lblMessage.Text = \"O's Turn\";\n        }\n        else\n      \
    \  {\n            LabelArr[i].Text = \"O\";\n            XTurn = true;\n     \
    \       lblMessage.Text = \"X's Turn\";\n        }\n        // Who wins?\n   \
    \     WhoWin = CheckWinning();\n        if (WhoWin != \"\")\n        {\n     \
    \       lblMessage.Text = WhoWin + \" wins\";\n            GameOver = true;\n\
    \            btnStartStop.PerformClick();\n            return;\n        }\n  \
    \      else if (NumberOfClick == 9)\n        {\n            // Draw\n        \
    \    lblMessage.Text = \"Game is draw!\";\n            GameOver = true;\n    \
    \        btnStartStop.PerformClick();\n            return;\n        }\n      \
    \  if (rdoOnePlayer.Checked)\n            if ((XTurn && rdoComputerFirst.Checked)\
    \ || (!XTurn && rdoYouFirst.Checked))\n                ComputerTurn();\n    }\n\
    }\n```\n\n### Step 19\nSave and run program. Select one player and make sure `Random`\
    \ is selected. Play several times. Make sure everything works. You will see that\
    \ computer is very easy to conquer, as shown in the figure below![](Image0006.jpg)Figure\
    \ 6.13 Random logic works well\n\n### Step 20\nYou have experienced the fun part\
    \ of this game. How do you make computer smart opponent? In every game where computer\
    \ becomes human opponent, you need to write down rules that give the computer\
    \ intelligence. For example, in chess games computer beats human more often than\
    \ vice versa. So how do you make computer a better opponent in Tic Toe game? Certainly,\
    \ for computer to be intelligent, programmer also needs practice and learning.\
    \ For Tic Toe game, you can develop a simple, very smart strategy. When it becomes\
    \ the computer's turn, what movements need to be done? The rules used here are:\n\
    \n* If the computer can win the game in one move, then the move must be made and\
    \ the game ends. So, if there is one line with two symbols given by the computer\
    \ and an empty box, then the empty space must be given a symbol by the computer.\n\
    * If the computer can block with one move, then the move must be done and the\
    \ opponent will not be able to win the game in the next move. So, there is a line\
    \ with two symbols given by human and an empty box, then the empty space must\
    \ be taken by computer by giving it a symbol.\n* If there no possibility of winning\
    \ or blocking is possible, then the movement is carried out in this order: the\
    \ middle box, one of corner boxes, or one of side squares.\n\nYou might ask about\
    \ the third step, why the order is important. Remember that there are 8 ways to\
    \ win the game (3 horizontal, 3 vertical, and 2 diagonal). The square box is involved\
    \ in 4 wins, the corner box is involved in three wins, and the side box is involved\
    \ in two wins. You will implement these steps. The following is a modified version\
    \ of `ComputerTurn` method that implements this smart logic:\n\n```csharp\nprivate\
    \ void ComputerTurn()\n{\n    int BoxSelected;\n    int i, n;\n    int j, k;\n\
    \    String ComputerSymbol, PlayerSymbol, WhichSymbol;\n    int [] BoxNumber =\
    \ new int [3];\n    String[] Symbols = new String[3];\n    int EmptyBox;\n   \
    \ int [] BestMove = { 4, 0, 2, 6, 8, 1, 3, 5, 7 };\n    if (rdoRandom.Checked)\n\
    \    {\n        // Random logic\n        // Put symbol on N-th empty box\n   \
    \     n = MyRandom.Next(9 - NumberOfClick) + 1;\n        i = 0;\n        for (BoxSelected\
    \ = 0; BoxSelected < 9; BoxSelected++)\n        {\n            if (LabelArr[BoxSelected].Text\
    \ == \"\")\n                i++;\n            if (i == n)\n                break;\n\
    \        }\n        // Put symbol on BoxSelected\n        lblBox_Click(LabelArr[BoxSelected],\
    \ null);\n    }\n    else\n    {\n        // Smart computer\n        // Determines\
    \ who has what symbol\n        if (rdoComputerFirst.Checked)\n        {\n    \
    \        ComputerSymbol = \"X\";\n            PlayerSymbol = \"O\";\n        }\n\
    \        else\n        {\n            ComputerSymbol = \"O\";\n            PlayerSymbol\
    \ = \"X\";\n        }\n        // Step 1 (K = 1) - winning: there is one line\
    \ with two symbols given by the computer and an empty box\n        // Step 2 (K\
    \ = 2) - blocking: there is a line with two symbols given by human and an empty\
    \ box\n        for (k = 1; k <= 2; k++)\n        {\n            if (k == 1)\n\
    \                WhichSymbol = ComputerSymbol;\n            else\n           \
    \     WhichSymbol = PlayerSymbol;\n            for (i = 0; i < 8; i++)\n     \
    \       {\n                n = 0;\n                EmptyBox = 0;\n           \
    \     for (j = 0; j < 3; j++)\n                {\n                    BoxNumber[j]\
    \ = Convert.ToInt32(WinningArr[i][j].ToString());\n                    Symbols[j]\
    \ = LabelArr[BoxNumber[j]].Text;\n                    if (Symbols[j] == WhichSymbol)\n\
    \                        n++;\n                    else if (Symbols[j] == \"\"\
    )\n                        EmptyBox = BoxNumber[j];\n                }\n     \
    \           if (n == 2 && EmptyBox != 0)\n                {\n                \
    \    // Give symbol on empty box to win\n                    // (K = 1) or to\
    \ block(K = 2)\n                    lblBox_Click(LabelArr[EmptyBox], null);\n\
    \                    return;\n                }\n            }\n        }\n  \
    \      // Step 3: Find the best movement\n        for (i = 0; i < 9; i++)\n  \
    \      {\n            if (LabelArr[BestMove[i]].Text == \"\")\n            {\n\
    \                lblBox_Click(LabelArr[BestMove[i]], null);\n                return;\n\
    \            }\n        }\n    }\n}\n```\n\n### Step 21\nSave and run project.\
    \ The game is now fully functional. You can fight the computer. You will know\
    \ that computers cannot be conquered. The best thing to do is draw![](Image00064.jpg)Figure\
    \ 6.14 With smart computer, the best thing user can do is draw game\n\n### Step\
    \ 22\nYou will add some sounds to the game Tic Toe. `draw.wav` file is the sound\
    \ that is used when the game ends in a draw. `win.wav` file is the sound when\
    \ the game is won by one of the players. Add declarations for the following two\
    \ sounds at the form-level:\n\n```csharp\nSystem.Media.SoundPlayer DrawSound;\n\
    System.Media.SoundPlayer WinSound;\n```\n\n### Step 23\nModify the `Load` method\
    \ of `FormTicTacToe` to create these sound objects:\n"
