    | AutoSize | Used to get or set a value that indicates whether the label automatically
    changes size or not. The default value is True . |


    | BackColor | Used to get or set background color on label. |


    | BorderStyle | Used to get or set edge style for label. |


    | Font | Used to get or set the name, style, and size of the font. |


    | ForeColor | Used to get or set the color of text or graphics. |


    | Text | Used to get or set the string displayed on the label. |


    | TextAlign | Used to get or set text alignment on label. |


    Note, by default, label control cannot be resized. To do this, set the AutoSize
    property to False .


    Table 1.8 One of methods of Label object


    | Refresh | Force an update to the content of a Label control. |


    Table 1.9 A number of Event Procedures from the Label object


    | Click | Triggered when the user clicks on a label. |


    | DblClick | Triggered when the user double clicks on a label. |


    Common uses of Label controls:


    *   Set the Name and Text properties.


    *   Set the Font , BackColor , and ForeColor properties.


    *   Set the AutoSize property to False and choose the desired value for TextAlign
    .


    | Timer |


    The Timer control in Visual C# can generate events without any input from the
    user. This timer control works behind the scenes on your project, which results
    in events with the time interval you set. This event generation feature is very
    helpful when the screen wants to be updated at regular time intervals.


    The following will be presented a number of properties and event of the Timer
    control.


    Table 1.10 A number of properties of the Timer object


    | Name | Used to get or set a Timer object name. |


    | Enabled | Used to enable and disable timer. When the value is True , this timer
    control continues operations until the Enabled property is False . |


    | Interval | Milliseconds (there are 1000 milliseconds in one second) between
    each Tick event call from the timer control. |


    Table 1.11 One of events of Timer object


    | Tick | This event procedure is called every interval (milliseconds) when the
    Enabled property is True . |


    To use the Timer control, you add it to your application like other controls.
    This control will be placed in the area below the form in the design window.


    The Enabled property of the timer control is False at design time. You enable
    a timer in the code by changing this property to True .


    Common uses of the Timer control:


    *   Set the Name property and the Interval property.


    *   Write the code in the Tick event.


    *   At some point in your application, set the Enabled property to True to start
    the timer. You can also make it False to stop the timer.


    | TextBox |


    The TextBox control is used to display information entered at the time of design,
    by user when the program is run, or by code in the program.


    Table 1.12 A number of properties of the TextBox object


    | Name | Get or set the name of the text box. |


    | AutoSize | Get or set a value that indicates whether the height of the text
    box automatically adjusts when the font in the control changes. |


    | BackColor | Get or set the background color from the text box. |


    | BorderStyle | Get or set the edge style of the text box. |


    | Font | Get or set font name, style, and size. |


    | ForeColor | Get or set the color of text or graphics. |


    | HideSelection | Get or set a value that indicates whether the selected text
    in the text box control is still highlighted when the control loses focus. |


    | Lines | Get or set a line of text in a text box control. |


    | MaxLength | Get or set the maximum number of characters that a user can type
    in the text box control. |


    | MultiLine | Get or set a value that indicates whether the text box can contain
    multi-line text. |


    | PasswordChar | Get or set character to disguise password characters in a one-line
    TextBox control. |'
