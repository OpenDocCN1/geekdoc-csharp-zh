    }\n```\n\n### 步骤 46\n\n现在，你编写计算机游戏的规则。你将从一个简单的随机规则开始。在这一规则中，计算机将在游戏区域内上下移动，并偶尔发射导弹。添加的唯一非随机元素是，计算机只有在拥有的导弹数量至少不少于玩家时才能发射导弹。这是为了防止计算机发射所有导弹而变成人类的容易攻击的目标。使用的规则如下：\n\
    \n*   生成一个 0 到 4 之间的随机值。\n*   如果随机值为 0，且计算机拥有的导弹数量至少等于玩家剩余的导弹，则发射导弹。\n*   如果随机值为\
    \ 1 或 2，则向上移动。\n*   如果随机值为 3 或 4，则向下移动。\n\n根据这条规则，导弹会在五次上下移动中逐一发射。计算机将在 5 次移动中向上\
    \ 2 次，在 5 次移动中向下 2 次。在详细（智能）逻辑游戏规则中，你只需要考虑你想如何赢得游戏。智能规则是在其他玩家“处于某个范围内”时发射。并且，如果人类玩家发射导弹则则避开。在这里给出的规则中，“范围内”意味着两个玩家之间的垂直差小于玩家高度的\
    \ 80%：\n\n*   如果在“范围内”且计算机拥有的导弹至少不少于玩家，则发射导弹。\n*   如果人类玩家发射导弹或计算机不再拥有导弹，计算机将采取防御移动：如果人类玩家在计算机上方，则向下移动；如果人类玩家在计算机下方，则向上移动。\n\
    *   否则，计算机将采取攻击移动：如果人类玩家在计算机上方，则向上移动；如果人类玩家在计算机下方，则向下移动。\n\n注意，计算机只有在拥有的导弹数量至少不少于玩家时才会发射导弹。你肯定不希望计算机耗光。在编写之前，你需要克服如何让玩家、向上或向下的问题。幸运的是，可以使用\
    \ `SendKeys`。`timComputer` 事件逻辑如下：\n\n```csharp\nprivate void timComputer_Tick(object\
    \ sender, EventArgs e)\n{\n    int i;\n    if (MyRandom.Next(100) < RandComputer)\n\
