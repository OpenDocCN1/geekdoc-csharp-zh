  trans: "\n\n### 第 9 步\n保存并运行项目。你现在可以在“停止”状态和“播放”状态之间切换，反之亦然。当停止时，确保单选框已启用单玩家和双玩家选项。![](img/Image00060.jpg)\
    \ 用户现在可以在“停止”状态和“播放”状态之间切换，反之亦然。你将为双玩家选项编写代码，首先编写在网格上显示符号的代码。\n\n### 第 10 步\n\
    在具有双玩家选项的井井棋游戏中，当玩家点击网格上的某个方框时，将出现适当的符号（`X` 或 `O`）。之后，你需要检查是否有人赢了游戏。如果没有获胜且仍有空框，则轮到另一个玩家。\n\
    \n所以，当点击网格方框时，需要执行以下步骤：\n* 验证之前网格上没有符号。\n* `NumberOfClick` 加 1。\n* 放置正确的符号（如果\
    \ `XTurn` 为 true 则放置 `X`，否则放置 `O`）。\n* 将回合切换给下一个玩家（如果获胜或平局则不需要）。\n* 检查是否获胜。如果获胜，则宣布胜利者并停止游戏。\n\
    * 检查 `NumberOfClick = 9`（棋盘已满但未获）。如果是，宣布平局并停止游戏。\n\n执行这些步骤的代码将存放在名为 `lblBox_Click`\
    \ 的方法中。此方法用于处理网格上使用的九个标签控件的 `Click` 事件（`lblBox1`、`lblBox2`、`lblBox3`、`lblBox4`、`lblBox5`、`lblBox6`、`lblBox7`、`lblBox8`\
    \ 和 `lblBox9`）。将此方法（`lblBox_Click`）添加到你的项目中。它实现了在网格上接收符号所需的步骤：\n\n```csharp\n\
    private void lblBox_Click(object sender, EventArgs e) {\n    String WhoWin = \"\
    \";\n    int i;\n    if (Clickable)\n    {\n        // 查看点击了哪个方框\n        Label\
    \ BoxClicked;\n        BoxClicked = (Label) sender;\n        // 提取最后一位数字\n   \
    \     i = Convert.ToInt32(BoxClicked.Name[BoxClicked.Name.Length - 1].ToString())\
    \ - 1;\n        // 如果已经被点击过，则退出\n        if (LabelArr[i].Text != \"\")\n     \
    \       return;\n        NumberOfClick++;\n        if (XTurn)\n        {\n   \
    \         LabelArr[i].Text = \"X\";\n            XTurn = false;\n            lblMessage.Text\
    \ = \"O's Turn\";\n        }\n        else\n        {\n            LabelArr[i].Text\
    \ = \"O\";\n            XTurn = true;\n            lblMessage.Text = \"X's Turn\"\
    ;\n        }\n        if (WhoWin != \"\")\n        {\n            lblMessage.Text\
    \ = WhoWin + \" wins\";\n            btnStartStop.PerformClick();\n          \
    \  return;\n        }\n        else if (NumberOfClick == 9)\n        {\n     \
    \       // 平局\n            lblMessage.Text = \"Game is draw!\";\n            btnStartStop.PerformClick();\n\
    \            return;\n        }\n    }\n}\n```\n![](img/Image0061.jpg) 图 6.11\
    \ 当所有网格位置都填充符号后，游戏返回“停止”状态。查看此代码。点击网格上的九个标签控件之一将调用此方法。代码的第一部分确定了点击的标签控件数组（`LabelArr`）的索引元素（`i`）。该索引是标签名称中的最后一个字符并转换为数字。如果已有符号（非空），则方法完成。如果是空的，则符号将放置在\
    \ `LabelArr[i]` 中。之后，你检查获胜情况（仅注释行，因为代码将执行逻辑）。如果获胜，则宣布胜利者并停止游戏。\n\n（注：此处原文逻辑似乎有中断，根据上下文推断，`WinningArr`\
    \ 数组用于定义可能的获胜组合）\n\n```csharp\nstring[][] WinningArr = {\n    { \"0,0\", \"0,1\"\
    , \"0,2\" }, { \"1,0\", \"1,1\", \"1,2\" }, { \"2,0\", \"2,1\", \"2,2\" }, //\
    \ 横向\n    { \"0,0\", \"1,0\", \"2,0\" }, { \"0,1\", \"1,1\", \"2,1\" }, { \"0,2\"\
    , \"1,2\", \"2,2\" }, // 纵向\n    { \"0,0\", \"1,1\", \"2,2\" }, { \"0,2\", \"\
    1,1\", \"2,0\" }                          // 对角线\n};\n```\n\n### 第 11 步\n保存并运行项目。你现在可以在“停止”状态和“播放”状态之间切换，反之亦然。当停止时，确保单选框已启用单玩家和双玩家选项。\n\
    \n*(注：由于提供的原文文本在第 10 步之后和第 11 步之间存在大量重复和逻辑断层，以下翻译基于您提供的文本片段进行了对齐处理，以保持文档连贯)*\n\
    \n### 第 12 步\n在具有双玩家选项的井井棋游戏中，当玩家点击网格上的某个方框时，将出现适当的符号（`X` 或 `O`）。之后，你需要检查是否有人赢了游戏。如果没有获胜且仍有空框，则轮到另一个玩家。\n\
    \n### 第 13 步\n执行这些步骤的代码将存放在名为 `lblBox_Click` 的方法中。此方法创建用于处理网格上使用的九个标签控件的 `Click`\
    \ 事件。\n\n### 第 14 步\n保存并运行项目。\n\n"
