- fmt: "\n| Name | Checked | Text | Font Size |\n| :--- | :--- | :--- | :--- |\n|\
    \ `rdoEasiest` | True | Easiest | 10 |\n| | | | |\n| A number of properties of\
    \ the `RadioButton4` object | | | |\n| `rdoEasy` | | Easy | 10 |\n| | | | |\n\
    | A number of properties of the `RadioButton5` object | | | |\n| `rdoHard` | |\
    \ Hard | 10 |\n| | | | |\n| A number of properties of the `RadioButton6` object\
    \ | | | |\n| `rdoHardest` | | Hardest | 10 |\n| | | | |\n| A number of properties\
    \ of the `Button4` object | | | |\n| `btnOK` | | OK | |\n\nWhen finished, the\
    \ form will look like in the figure below.![](Image00071.jpg)Figure 7.6 Form after\
    \ properties setting done.\n\n### Step 3\nRun the project (press `<F5>`), the\
    \ game is displayed as shwon in Figure 7.7. You will now start writing project\
    \ code. You first write the code that sets the status of the game based on the\
    \ selected game options.\n\n### Step 4\nWhen the game starts, user will choose\
    \ the options (number of players and the difficulty level of the game). Based\
    \ on these choices, the form will display different information. When the user\
    \ clicks Options button (`btnOption`), the following things occur:\n\n*   Disable\
    \ `btnGame`.\n*   Disable `btnOption`.\n*   Disable Exit button.\n*   Make `pnlOption`\
    \ visible.\n\n![](Image00072.jpg)Figure 7.7 The form first startsThe code to implement\
    \ these steps is placed in the `Click` event of the `btnOption` button:\n\n```csharp\n\
    private void btnOption_Click( object sender, EventArgs e){\n    btnGame.Enabled\
    \ = false ;\n    btnOption.Enabled = false ;\n    btnExit.Enabled = false ;\n\
    \    pnlOption.Visible = true ;\n}\n```\n\nAdd this procedure to your project.\
    \ When the project is run and the user clicks on the Options button, the form\
    \ will be displayed as shown in Figure 7.8.\n\n### Step 5\nAfter the options panel\
    \ is displayed, the user can choose one or two players and select game difficulty\
    \ (if playing against computer). You will use an Integer variable named `NumberOfPlayer`\
    \ to save number of players and an Integer variable with the name `Difficulty`\
    \ to save the selected difficulty level. Add the following two form-level variable\
    \ declarations to the project:\n\n```csharp\nint NumberOfPlayer, Difficulty;\n\
    ```\n\n![](Image00073.jpg)Figure 2.8 When user clicks Options button\n\n### Step\
    \ 6\nAdd a `Load` event of `FormFightingPlane` to the project to initialize these\
    \ variables to their default values:\n\n```csharp\nprivate void FormFightingPlane_Load(\
    \ object sender, EventArgs e){\n    NumberOfPlayer = 1;\n    Difficulty = 1;\n\
    }\n```\n\n### Step 7\nIf the one player radio button (`rdoOnePlayer`) is selected,\
    \ user will play against computer and the following happens:\n\n*   Set `NumberOfPlayer`\
    \ to 1.\n*   Set `Text` property of `lblPlayer1` to `You:`.\n*   Set `Text` property\
    \ of `lblPlayer2` to `Computer:`.\n*   Make `lblInstructionPlayer2` control invisible.\n\
    *   Enable `grpDifficulty`.\n\nIf the two player (`rdoTwoPlayers`) radio button\
    \ is selected, the user will play against another human and the following happens:\n\
    \n*   Set `NumberOfPlayer` to 2.\n*   Set `Text` property of `lblPlayer1` to `Player\
    \ 1:`.\n*   Set `Text` property of `lblPlayer2` to `Player 2:`.\n*   Make `lblInstructionPlayer2`\
    \ control visible.\n*   Disable `grpDifficulty`.\n\nNote that game difficulty\
    \ levels are only selected when playing against computer (one player). The code\
    \ to implement these steps is placed into a procedure named `rdoPlayer_Click`\
    \ which handles `Click` events of both `rdoOnePlayer` and `rdoTwoPlayers`:\n\n\
    ```csharp\nprivate void rdoPlayer_Click( object sender, EventArgs e){\n    RadioButton\
    \ ButtonClicked;\n    ButtonClicked = (RadioButton) sender;\n    if (ButtonClicked.Text\
    \ == \"One\" )\n    {\n        NumberOfPlayer = 1;\n        lblPlayer1.Text =\
    \ \"You:\" ;\n        lblPlayer2.Text = \"Computer:\" ;\n        lblInstructionPlayer2.Visible\
    \ = false ;\n        grpDifficulty.Enabled = true ;\n    }\n    else\n    {\n\
    \        NumberOfPlayer = 2;\n        lblPlayer1.Text = \"Player 1:\" ;\n    \
    \    lblPlayer2.Text = \"Player 2:\" ;\n        lblInstructionPlayer2.Visible\
    \ = true ;\n        grpDifficulty.Enabled = false ;\n    }\n}\n```\n\nAdd this\
    \ procedure to your project.\n\n### Step 8\nLikewise, a procedure named `rdoDifficulty_Click`\
    \ handles the `Click` event for four radio buttons on `grpDifficulty`. Based on\
    \ which button is clicked, the `Difficulty` variable is set:\n\n```csharp\nprivate\
    \ void rdoDifficulty_Click( object sender, EventArgs e){\n    RadioButton ButtonClicked;\n\
    \    ButtonClicked = (RadioButton) sender;\n    switch (ButtonClicked.Text)\n\
    \    {\n        case \"Easiest\" :\n            Difficulty = 1;\n            break;\n\
    \        case \"Easy\" :\n            Difficulty = 2;\n            break;\n  \
    \      case \"Hard\" :\n            Difficulty = 3;\n            break;\n    \
    \    case \"Hardest\" :\n            Difficulty = 4;\n            break;\n   \
    \ }\n}\n```\n\nAdd this procedure to your project.![](Image00072.jpg)Figure 7.9\
    \ The form first starts with default values (one player, easiest difficulty)\n\
    \n### Step 9\nAfter the user selects options he wants, he clicks the OK button\
    \ (`btnOK`) to close the options panel. The code in the `Click` event of the `btnOK`\
    \ control is the opposite of the code in the `Click` event of `btnOption`:\n\n\
    ```csharp\nprivate void btnOK_Click( object sender, EventArgs e){\n    btnGame.Enabled\
    \ = true ;\n    btnOption.Enabled = true ;\n    btnExit.Enabled = true ;\n   \
    \ pnlOption.Visible = false ;\n}\n```\n\nAdd this procedure to your project. At\
    \ this point, game can begin.\n\n### Step 10\nSave and run the project. The game\
    \ display will appear with default values (one player, easiest difficulty). Click\
    \ Options button to bring up the options panel, as shown in Figure 7.9. Changing\
    \ the level of difficulty will not change the appearance of the form. Changing\
    \ number of players will change the form display. Select two players, the header\
    \ information will change and the Difficulty group box will be disabled:Image00074.jpg)Figure\
    \ 7.10 Changing number of players will change the form display\n\n### Step 11\n\
    The configuration file will contain two pieces of information: number of players\
    \ (`NumberOfPlayer`) and difficulty level (`Difficulty`). First, you will develop\
