- fmt: "\n# TUTORIAL 7\n\n## FIGHTING PLANE\n\nIn this tutorial, you will build Fighting\
    \ Plane program. This program can be played by two human players or human player\
    \ versus computer.\n\n### Description\n\nStart Visual C# and open the project\
    \ and press `<F5>` to run it, you will see:![](Image00066.jpg)Figure 7.1 Fighting\
    \ Plane game startsNext, press `Options` button. Choose `One`. With one player,\
    \ you can also choose the level of difficulty of the game, as shown in Figure\
    \ 7.1.Click `OK` and then click `New Game` button. Game will start, as shown in\
    \ Figure 7.2.\n\nThe controls of the player are done via the keyboard. Player\
    \ 1 presses `A` key to move up, `Z` key to move down, and `S` key to throw rudal.\
    \ When you choose `Two` players from the `Options` button, this game can be played\
    \ by two human players. Player 1 presses the same keys, while player 2 presses\
    \ key `K` to move up, `M` to move down, and key `J` to throw rudal, as shown in\
    \ Figure 7.3.![](Image00067.jpg)Figure 7.2 User chooses one player and hard difficulty\
    \ level![](Image00068.jpg)Figure 7.3 User play against computer![](Image00069.jpg)Figure\
    \ 7.4 Human versus human\n\n### Tutorial Steps\n\n#### Step 1\nYou will start\
    \ building Fighting Plane game project. Start a new project in Visual C#. Place\
    \ 12 labels, a large control panel, and three control buttons on the form. In\
    \ the control panel, place a smaller panel with two group box controls and a button\
    \ control. In the first group box, place 2 radio buttons; in the second box group,\
    \ place 4 radio buttons. Add two timer controls to the project. Change the size\
    \ and position of each control so that the form is now as shown in Figure 7.5.\
    \ \n\nAll label controls are used for titles and provide scoring and game information.\
    \ The large panel (`Panel1`) is the playing field. Three button controls are used\
    \ to start / stop a program, set options, and exit the program. One timer control\
    \ is used to control game animation and another is used to represent the computer's\
    \ decision process. The second control panel (`Panel2`) is used to select game\
    \ options. One group box contains radio buttons which are used to select number\
    \ of players. A group box contains radio buttons to select the level of difficulty\
    \ of the game, when playing against a computer. A small button is used to close\
    \ the options panel. The default properties are set for one-player games with\
    \ the easiest game difficulty.\n\n#### Step 2\nSet control properties using the\
    \ Properties window:![](Image00070.jpg)Figure 2.5 All controls user in Fighting\
    \ Plane game project\n\n**A number of properties of the `Form1` object:**\n| Property\
    \ | Value |\n| :--- | :--- |\n| Name | `FormFightingPlane` |\n| BackColor | `Red`\
    \ |\n| FormBorderStyle | `FixedSingle` |\n| KeyPreview | `True` |\n| StartPosition\
    \ | `CenterScreen` |\n| Text | `Fighting Plane` |\n\n**A number of properties\
