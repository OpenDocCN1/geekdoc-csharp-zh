  trans: "\n\n### 小鸟与球初始化\n\n```csharp\nprivate void PlaceBirdAndBall(){   \n    BirdX\
    \ = MyRandom.Next(pnlGame.Width - BirdW);\n    PanelGame.DrawImage(picBird.Image,\
    \ BirdX, 0);\n    BallX = BirdX + Convert.ToInt32(0.5 * (BirdW - BallW));\n  \
    \  BallY = BallH + 10;\n    PanelGame.DrawImage(picBall.Image, BallX, BallY);\n\
    }\n```\n\n### 第 12 ：保存并运行\n保存并运行程序。设置 `Difficulty`（例如 3）。点击 `Start` 按钮查看：\n![](img/Image00045.jpg)\n\
    图 6.11 最后的初始化步骤是在屏幕上随机放置小鸟和球。你仍然需要代码来让球掉落并让人在屏幕底部移动。你很快就会编写这些代码。但是首先，你需要做一些操作来停止程序。\n\
    \n### 第 13 ：停止程序\n当游戏处于“Starting”状态时，可以做的最后一件事是点击 `Stop` 按钮。这将停止程序。这里的代码非常简单。将以下代码添加到\
    \ `btnStop` 按钮的 `Click` 事件过程中：\n\n```csharp\nprivate void btnStop_Click( object\
    \ sender, EventArgs e){\n    if (StatusGame == \"Starting\" )\n        this .Close();\n\
    }\n```\n\n### 第 14 ：过渡到游戏状态\n保存并运行程序。确保 `Stop` 按钮工作正常。这完成了将游戏从“Starting”移动到“Playing”状态的代码。现在，你将编写让人在屏幕底部移动的代码。\n\
    \n### 第 15 ：球的掉落逻辑\n当程序启动时，球将会掉落。用户将让人在屏幕底部移动以尝试接住掉落的球。在这里，你将编写掉落球的代码。名为 `BallSpeed`\
    \ 的变量将决定球掉落的速度。\n\n添加以下表级声明：\n```csharp\nint BallSpeed;\n```\n\n根据 `Difficulty`\
    \ 值分配 `BallSpeed`：\n```csharp\nBallSpeed = 0.5 * Difficulty + 5\n```\n\n`Timer`\
    \ (`timerGame`) 用于控制球的移动。将修改后的代码添加到 `btnStart` 的 `Click` 事件过程中：\n\n```csharp\n\
    private void btnStart_Click( object sender, EventArgs e){\n    //Start button\
    \ clicked\n    StatusGame = \"Playing\";\n    lblInstruction.Visible = false;\n\
    \    PanelGame = pnlGame.CreateGraphics();\n    PanelGame.Clear(Color.Gold); //时间/分数\n\
    \    RemainingTime = 60 * 1000; //毫秒\n    Score = 0;\n    DisplayTime();\n   \
    \ //人\n    ManW = picMan.Width;\n    ManH = picMan.Height;\n    ManDeltaX = 10;\n\
    \    ManX = 375;\n    ManY = pnlGame.Height - ManH;\n    PanelGame.DrawImage(picMan.Image,\
    \ ManX, ManY);\n    //小鸟\n    BirdW = picBird.Width;\n    BirdH = picBird.Height;\n\
    \    //球\n    BallW = picBall.Width + 10;\n    BallH = picBall.Height;\n    PlaceBirdAndBall();\n\
    \    //启动计时器\n    BallSpeed = Convert.ToInt32(0.5 * Difficulty) + 5;\n    timerGame.Start();\n\
    }\n```\n\n### 第 16 ：更新球的位置\n在 `timerGame` 的 `Tick` 事件过程中使用以下代码更新球的位置：\n\n```csharp\n\
    private void timerGame_Tick( object sender, EventArgs e){\n    ClearBall();\n\
    \    BallY = BallY + BallSpeed;\n    PanelGame.DrawImage(picBall.Image, BallX,\
    \ BallY);\n}\n```\n\n该代码使用了新的子程序 `ClearBall`，它在将球移动到新位置之前将其从当前位置移除。将此子程序添加到你的程序中：\n\
    \n```csharp\nprivate void ClearBall(){\n    PanelGame.FillRectangle(Brushes.Gold,\
    \ BallX, BallY,\n        BallW + 5, BallH + 5);\n}\n```\n\n### 第 17 ：测试随机掉落\n\
    保存并运行程序。然后点击 `Start` 按钮。现在，球会在一个随机位置掉落：\n![](img/Image00046.jpg)\n图 6.12 球在随机位置掉落：\n\
    但球仍然会掉落直到消失在屏幕上。你还需要两个代码：一个用于让人移动到球下方，另一个用于判断人是否能接住掉落的球。\n\n### 第 18 ：键盘移动\n游戏的目的是让人移动到掉落的球下方以便接住它。可以通过两种不同的方法移动人：首先，可以使用键盘上的左键和右键移动他。每次按键，你都会更改\
    \ `ManX`，使得 `ManDeltaX` 向某个方向移动。你使用一个新变量 `KeyPressed` 来跟踪正在按下哪个按键。在表级声明中添加以下声明：\n\
    \n```csharp\nString KeyPressed = \"Empty\";\n```\n\n你在表单的 `KeyDown` 过程中使用以下代码检测按键按下：\n\
    \n```csharp\nprivate void FormCatchingBall_KeyDown( object sender, KeyEventArgs\
    \ e){\n    //检查按了哪个方向键来移动人\n    if (e.KeyCode == Keys.Left)\n        KeyPressed\
    \ = \"Left\";\n    else if (e.KeyCode == Keys.Right)\n        KeyPressed = \"\
    Right\";\n}\n```\n\n### 第 19 ：按键释放\n当按键释放时，可以做的另一件事是清除状态。将以下代码放入表单的 `KeyUp` 过程中：\n\
    \n```csharp\nprivate void FormCatchingBall_KeyUp( object sender, KeyEventArgs\
    \ e){\n    KeyPressed = \"Empty\";\n}\n```\n\n### 第 20 ：实现键盘移动\n在 `timerGame`\
    \ 控制的 `Tick` 事件过程中添加移动代码：\n\n```csharp\nprivate void timerGame_Tick( object sender,\
    \ EventArgs e){\n    ClearBall();\n    BallY = BallY + BallSpeed;\n    PanelGame.DrawImage(picBall.Image,\
    \ BallX, BallY);\n    //移动人\n    if (KeyPressed == \"Left\") {\n        ManX =\
    \ ManX - ManDeltaX;\n        if (ManX < 0)\n            ManX = 0;\n    }\n   \
    \ else if (KeyPressed == \"Right\") {\n        ManX = ManX + ManDeltaX;\n    \
    \    if (ManX > pnlGame.Width - ManW)\n            ManX = pnlGame.Width - ManW;\n\
    \    }\n    PanelGame.DrawImage(picMan.Image, ManX, ManY);\n}\n```\n\n就像移动球的代码一样，这段代码使用另一个子程序\
    \ `ClearMan` 将人从当前位置删除。添加此子程序：\n\n```csharp\nprivate void ClearMan(){\n    PanelGame.FillRectangle(Brushes.Gold,\
    \ ManX, ManY,\n        ManW + 5, ManH + 5);\n}\n```\n\n### 第 21 ：验证\n保存并运行项目。点击\
    \ `Start` 按钮。通过左右方向键移动人：\n![](img/Image00047.jpg)\n图 6.13 现在可以使用方向键移动人\n\n###\
    \ 第 22 ：鼠标移动\n现在你将编写另一种移动人的代码：使用鼠标的左右按钮。定义一个表级变量来跟踪点击了哪个按钮（`MouseClicked`）：\n\n\
    ```csharp\nString ButtonClicked = \"Empty\";\n```\n\n现在，将此代码添加到 `pnlGame` 的 `MouseDown`\
    \ 事件过程中：\n\n```csharp\nprivate void pnlGame_MouseDown( object sender, MouseEventArgs\
    \ e){\n    if (e.Button == MouseButtons.Left)\n        MouseClicked = \"Left\"\
    ;\n    else if (e.Button == MouseButtons.Right)\n        MouseClicked = \"Right\"\
    ;\n}\n```\n\n有了这段代码，当鼠标位于游戏面板时，左右鼠标将替代方向键的操作。将以下代码添加到 `pnlGame` 的 `MouseUp`过程中：\n\
    \n```csharp\nprivate void pnlGame_MouseUp( object sender, MouseEventArgs e){\n\
    \    MouseClicked = \"Empty\";\n}\n```\n\n### 第 23 ：最终集成\n然后，将修改后的代码添加到 `timerGame`\
    \ 控制的 `Tick` 事件过程中：\n\n```csharp\nprivate void timerGame_Tick( object sender,\
    \ EventArgs e){\n    ClearBall();\n    BallY = BallY + BallSpeed;\n    PanelGame.DrawImage(picBall.Image,\
    \ BallX, BallY);\n    //移动人\n    ClearMan();\n    if (KeyPressed == \"Left\" ||\
    \ ButtonClicked == \"Left\") {\n        ManX = ManX - ManDeltaX;\n        if (ManX\
    \ < 0)\n            ManX = 0;\n    }\n    else if (KeyPressed == \"Right\" ||\
    \ ButtonClicked == \"Right\") {\n        ManX = ManX + ManDeltaX;\n        if\
    \ (ManX > (pnlGame.Width - ManW))\n            ManX = pnlGame.Width - ManW;\n\
    \    }\n    PanelGame.DrawImage(picMan.Image, ManX, ManY);\n}\n```\n\n### 第 25\
    \ ：最终测试\n保存并运行程序。确保你现在可以使用左右方向键以及左右鼠标按钮移动人：\n![](img/Image00048.jpg)\n图 6.14 用户现在确实可以使用左右方向键和左右鼠标按钮移动人\n\
    \n"
- fmt: "\n### Step 26\nWhen the ball approaches the bottom of the screen, you need\
    \ to see if man can catch it. The code to check this is in the `Tick` event procedure\
    \ of `timerGame`. You need to do two things:\n\n- Check whether the ball is caught.\
    \ If so, the ball is cleared and the score is incremented and the bird and ball\
    \ appear again at a random location at the top of the screen.\n- Check whether\
    \ the ball has reached the same vertical position as man and has not been caught.\
    \ If yes, bird and ball reappears.\n\nHow do you know when man catches ball? You\
    \ need to see if man's graphics collide with the ball graphics. The inspection\
    \ could not be carried out until the ball overlaps man. This happens when: `BallY\
    \ + BallH > ManY`. You will use a boolean variable `Passed` to see this. After\
    \ this condition is met, you can see that man collides with ball (or catches ball)\
    \ when: `ManX + ManW > BallX and ManX < BallX + BallW`. This says that the right\
    \ side of man must be \"more right\" than the left side of the ball and the left\
    \ side of man must be \"more left\" than the right side of the bal. Another boolean\
    \ variable `Collision` is used to check this condition. Declare these two new\
    \ variables:\n\n```csharp\nbool Passed, Collision;\n```\n\nAdd this modified code\
    \ from the `Tick` event procedure of `timerGame`:\n\n```csharp\nprivate void timerGame_Tick(\
    \ object sender, EventArgs e)\n{\n    ClearBall();\n    BallY = BallY + BallSpeed;\n\
    \    PanelGame.DrawImage(picBall.Image, BallX, BallY);\n    //Move man\n    ClearMan();\n\
    \    if (KeyPressed == \"Left\" || ButtonClicked == \"Left \")\n    {\n      \
    \  ManX = ManX - ManDeltaX;\n        if (ManX < 0)\n            ManX = 0;\n  \
    \  }\n    else if (KeyPressed == \"Right\" || ButtonClicked == \"Right \")\n \
    \   {\n        ManX = ManX + ManDeltaX;\n        if (ManX > (pnlGame.Width - ManW))\n\
    \            ManX = pnlGame.Width - ManW;\n    }\n    PanelGame.DrawImage(picMan.Image,\
    \ ManX, ManY);\n    //Checks whether ball collides with or passes man\n    Passed\
    \ = false;\n    Collision = false;\n    if (BallY + BallH > ManY)\n    {\n   \
    \     Passed = true;\n        if (ManX + ManW > BallX && ManX < BallX + BallW)\n\
    \            Collision = true;\n        if (Passed)\n            if (Collision)\n\
    \                Score += 1;\n        ClearBird();\n        ClearBall();\n   \
    \     PlaceBirdAndBall();\n    }\n    DisplayTimeScore();\n}\n```\n\n### Step\
    \ 27\nYou now understand the steps implemented. In particular, pay attention to\
    \ how the new bird is positioned after `Passed` is True (and how the score is\
    \ incremented if the `Collision` is True). This new code requires a new subroutine\
    \ called `ClearBird` which removes bird from their current position:\n\n```csharp\n\
    private void ClearBird()\n{\n    PanelGame.FillRectangle(Brushes.Gold, BirdX,\
    \ 0, BirdW + 30, BirdH + 30);\n}\n```\n\n### Step 28\nSave and run the program.\
    \ Change the difficulty level if desired. Click on Start button. Now you can move\
    \ man under the falling ball, and the score will increase and the bird appears\
    \ again in the next random position. If man fails to catch the ball, the score\
    \ will not be incremented and the bird will reappear in the next random position.\n\
    \n### Step 29\nYou are almost done. With the current code, you can play the game\
    \ as long as you like. Note that remaining time is still 60. You need to implement\
    \ logic that ends the game after 60 seconds (and updates the remaining time).\
    \ To do this, add this modified code of `Tick` event procedure to `timerGame`\
    \ control:\n\n```csharp\nprivate void timerGame_Tick( object sender, EventArgs\
