- fmt: "\n```csharp\nprivate void FormFightingplane_Load( object sender, EventArgs\
    \ e)\n{\n    try\n    {\n        StreamReader fileInput = new StreamReader(Application.StartupPath\
    \ + \"\\\\plane.ini\");\n        NumberOfPlayer = Convert.ToInt32(fileInput.ReadLine());\n\
    \        Difficulty = Convert.ToInt32(fileInput.ReadLine());\n        fileInput.Close();\n\
    \    }\n    catch\n    {\n        NumberOfPlayer = 1;\n        Difficulty = 1;\n\
    \    }\n    // Makes form visible so options can be clicked\n    this.Show();\n\
    \    pnlOption.Visible = true;\n    if (Difficulty == 1)\n        rdoEasiest.PerformClick();\n\
    \    else if (Difficulty == 2)\n        rdoEasy.PerformClick();\n    else if (Difficulty\
    \ == 3)\n        rdoHard.PerformClick();\n    else\n        rdoHardest.PerformClick();\n\
    \    if (NumberOfPlayer == 1)\n        rdoOnePlayer.PerformClick();\n    else\n\
    \        rdoTwoPlayers.PerformClick();\n    pnlOption.Visible = false;\n}\n```\n\
    \n![](Image00075.jpg) Figure 7.11 The project is first displayed with default\
    \ options. Note that you use the default values if the configuration file cannot\
    \ be opened. Also note that you make the form (`this`) and panel (`pnlOption`)\
    \ appear before selecting options. You choose the difficulty option first, because\
    \ this option is not enabled if two players are selected. After the option is\
    \ selected, the `Visible` property of the panel returns to False.\n\n### Step\
    \ 14\nSave and run the project. The project is first displayed with default options\
    \ (one player and easiest difficulty level) as shown in Figure 7.11. Choose several\
    \ options. For example, say you choose the number of players two. Then, click\
    \ the `OK` button and the `Exit` button to stop the project. Run the project again\
    \ and click the `Options` button to see that the last selected option is still\
    \ saved in the form.\n\n### Step 15\nYou will have a number of animated images\
    \ on this project (players, rudal, and ufos). This is a good place to test object-oriented\
    \ programming skills. You will build a class named `TwoPlayer` to represent the\
    \ two player objects and its default constructor:\n\n```csharp\nclass TwoPlayer\n\
    {\n    public TwoPlayer ()\n    {\n    }\n}\n```\n\n![](Image00076.jpg) Figure\
    \ 7.12 The last selected options are saved in the form. You will use three properties\
    \ to describe a `TwoPlayer` object: `MyImage` (`Image` data type), `Location`\
    \ (type of `Rectangle` that describes size and location), and an `IsVisible` (Boolean\
    \ type that tells whether the object is visible or not). Add these declarations\
    \ to the class file, which initializes `IsVisible` to False:\n\n```csharp\nclass\
    \ TwoPlayer\n{\n    public TwoPlayer ()\n    {\n    }\n    public Image MyImage;\n\
    \    public Rectangle Location;\n    public bool IsVisible = false;\n}\n```\n\n\
    ### Step 16\nYou will expand the class definition by adding several methods to\
    \ help with the animation work. Class methods are used so that objects can do\
    \ certain jobs. The method is written as a Visual C# method. You will write three\
    \ methods for the `TwoPlayer` object, one method that places it on a graphical\
    \ object, one method that moves it to a new location, and another method that\
    \ removes it. These three methods are added to the class definition just like\
    \ the general method when added to the form code file. To add a method to the\
    \ class description, you choose the name and data type of information that will\
    \ be generated as a return value. In addition, you specify the arguments required\
    \ by the method.\n\nThe `Place` method places a `TwoPlayer` object into a graphical\
    \ object named `g` (passed as argument):\n\n```csharp\npublic void Place(Graphics\
    \ g)\n{\n    g.DrawImage(this.MyImage, this.Location);\n    this.IsVisible = true;\n\
    }\n```\n\nNote the use of `this` to refer to the current object. After the object\
    \ is placed on `g`, you set `IsVisible` property to True. The `Move` method moves\
    \ a `TwoPlayer` object to a new location. The arguments needed are `g` (`Graphics`\
    \ object), `bc` (`Brush` object) to delete the previous location, `dx` (change\
    \ in x), and `dy` (change in y):\n\n```csharp\npublic void Move(Graphics g, Brush\
    \ bc, int dx, int dy)\n{\n    g.FillRectangle(bc, this.Location);\n    this.Location.X\
    \ += dx;\n    this.Location.Y += dy;\n    g.DrawImage(this.MyImage, this.Location);\n\
    }\n```\n\nThe object was deleted first. The location is then updated and the object\
    \ redrawn. The `Remove` method removes a `TwoPlayer` object from a graphical object\
    \ (using `bc`):\n\n```csharp\npublic void Remove(Graphics g, Brush bc)\n{\n  \
    \  g.FillRectangle(bc, this.Location);\n    this.IsVisible = false;\n}\n```\n\n\
    Add these three methods (`Place`, `Move`, `Remove`) to the `TwoPlayer` class to\
    \ create the latest version:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Drawing;\n\
    \nnamespace FiringRudal\n{\n    class TwoPlayer\n    {\n        public TwoPlayer\
    \ ()\n        {\n        }\n        public Image MyImage;\n        public Rectangle\
    \ Location;\n        public bool IsVisible = false;\n        public void Place(Graphics\
    \ g)\n        {\n            g.DrawImage(this.MyImage, this.Location);\n     \
    \       this.IsVisible = true;\n        }\n        public void Move(Graphics g,\
    \ Brush bc, int dx, int dy)\n        {\n            g.FillRectangle(bc, this.Location);\n\
    \            this.Location.X += dx;\n            this.Location.Y += dy;\n    \
    \        g.DrawImage(this.MyImage, this.Location);\n        }\n        public\
    \ void Remove(Graphics g, Brush bc)\n        {\n            g.FillRectangle(bc,\
    \ this.Location);\n            this.IsVisible = false;\n        }\n    }\n}\n\
    ```\n\nUsing this class, a `TwoPlayer` object variable can be created using:\n\
