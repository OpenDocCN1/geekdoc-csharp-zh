- fmt: "\n- Display `QuestionTime`.\n- If `QuestionTime` is 0, question solving is\
    \ stopped.\n\nWrite the code to implement the steps above which is placed into\
    \ `Tick` event of `timerQuestion` control:\n\n```csharp\nprivate void timerQuestion_Tick(object\
    \ sender, EventArgs e)\n{\n    if (rdoTimerForward.Checked)\n    {\n        QuestionTime++;\n\
    \        lblTimer.Text = GetTime(QuestionTime);\n        if (QuestionTime >= 1800)\n\
    \        {\n            btnStart.PerformClick();\n            return;\n      \
    \  }\n    }\n    else\n    {\n        QuestionTime--;\n        lblTimer.Text =\
    \ GetTime(QuestionTime);\n        if (QuestionTime == 0)\n        {\n        \
    \    btnStart.PerformClick();\n            return;\n        }\n    }\n    lblTimer.Refresh();\n\
    }\n```\n\n![](Image00013.jpg)Figure 2.10 Option Forward Count applied\n\nAdd the\
    \ code to your project. You have finished implementing the modification to the\
    \ timing. Save and run the project. You need to make sure all timer options are\
    \ running well. First, check whether the project can run without timer. Once you\
    \ are sure that the without timer option is working properly, stop training and\
    \ select forward count option. Run the project. Ensure that the timer is correctly\
    \ incremented, as shown in Figure 2.10. Click Stop Training at a certain time.\
    \ Select Backward Count option. Change the time using the scroll bar. Make sure\
    \ it reaches a maximum value of 30:00 (and a minimum value of 0:30). Then, click\
    \ Start Training . Ensure that the time is decremented appropriately:\n\n![](Image00014.jpg)Figure\
    \ 2.11 Option Backward Count applied\n\n### Step 21\n\nAfter the user stops solving\
    \ problems, you want him to know how good he is at answering questions. This information\
    \ includes:\n\n- The number of questions tried.\n- The number of answers correctly.\n\
    - The percentage score.\n- If the timer is activated, the time spent on problem.\n\
    \nIf forward count option is selected, the time spent is equal to `QuestionTime`.\
    \ If backward count option is selected, the time spent equal to initial time which\
    \ is reduced by `QuestionTime`. All of this information is available on a number\
    \ of variables in the program. The results are presented in `Click` event of `btnStart`\
    \ control. You only need use a simple message box to display the results:\n\n\
    ```csharp\nprivate void btnStart_Click(object sender, EventArgs e)\n{\n    int\
    \ Score;\n    string Message = \"\";\n    if (btnStart.Text == \"Start Training\"\
    )\n    {\n        btnStart.Text = \"Stop Training\";\n        btnExit.Enabled\
    \ = false;\n        Answered = 0;\n        Correct = 0;\n        lblTested.Text\
    \ = \"0\";\n        lblCorrect.Text = \"0\";\n        grpTimer.Enabled = false;\n\
    \        if (!rdoTimerOff.Checked)\n        {\n            if (rdoTimerForward.Checked)\n\
    \            {\n                QuestionTime = 0;\n            }\n           \
    \ else\n            {\n                QuestionTime = 30 * vsbTimer.Value;\n \
    \           }\n            lblTimer.Text = GetTime(QuestionTime);\n          \
    \  timerQuestion.Enabled = true;\n        }\n        lblQuestion.Text = GetQuestion();\n\
    \    }\n    else\n    {\n        grpTimer.Enabled = true;\n        timerQuestion.Enabled\
    \ = false;\n        btnStart.Text = \"Start Training\";\n        btnExit.Enabled\
    \ = true;\n        lblQuestion.Text = \"\";\n        if (Answered > 0)\n     \
    \   {\n            Score = (int)(100 * (double) / Answered);\n            Message\
    \ = \"The number of questions tried: \" + Answered.ToString() + \"\\n\";\n   \
    \         Message += \"The number of questions correctly answered: \" + Correct.ToString()\
    \ + \" (\" + Score.ToString() + \"%\" + \"\\n\";\n            if (rdoTimerOff.Checked)\n\
    \            {\n                Message += \"Timer Off\";\n            }\n   \
    \         else\n            {\n                if (rdoTimerBackward.Checked)\n\
    \                {\n                    QuestionTime = 30 * vsbTimer.Value - QuestionTime;\n\
    \                }\n            }\n            Message += \"Total time spent:\
    \ \" + GetTime(QuestionTime) + \"\\n\";\n            Message += \"Average time\
    \ every question: \" + String.Format(\"{0:f2}\", (double)(QuestionTime) / Answered)\
    \ + \" seconds\";\n        }\n        MessageBox.Show(Message, \"Results\", MessageBoxButtons.OK,\
    \ MessageBoxIcon.Information);\n    }\n}\n```\n\n### Step 22\n\nSave and run project.\
    \ Answer a number of questions and see the results. Make sure the results are\
    \ displayed correctly whether the timing is active or not:\n\n![](Image00015.jpg)!(Image00016.jpg)Figure\
    \ 2.12 Displaying results\n\n`Form1.cs`\n"
