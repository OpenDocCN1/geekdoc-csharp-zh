    | TextAlign | Get or set text alignment on radio buttons. |


    Table 1.19 A number of Methods of the RadioButton object


    | Focus | Move focus to the specified radio button. |


    | PerformClick | Generates a Click event for a particular radio button, by simulating
    a click by the user. |


    Table 1.20 A number of Events of the RadioButton object


    | CheckedChanged | Occurs when the value of the Checked property changes, whether
    via a code or when the radio button is clicked. |


    | Click | Triggered when a radio button is clicked. The Checked property is automatically
    changed by Visual C#. |


    General uses of RadioButton control:


    *   Create a radio button group.


    *   For each button in a group, set the Name and Text properties.


    *   Initialize the Checked property.


    *   Monitor the Click or CheckChanged event on each radio button to determine
    which radio button is clicked.


    | GroupBox |


    You already knew that check boxes and radio buttons work in a group. The GroupBox
    control provides a way to group related controls in a Visual C# application.


    To place controls in a group box, you first need to drag or place GroupBox control
    into the form. Then, place each control into the group box.


    The group box affects how the radio button works. The radio buttons on a GroupBox
    control work as a group, and are not related to the radio buttons on other GroupBox
    controls.


    Table 1.21 A number of Properties of the GroupBox object


    | Name | Get or set the name of the group box. |


    | Enabled | Get or set a value indicating whether the group box is enabled. If
    it is False , then all controls in the group box will be disabled. |


    | BackColor | Get or set the background color from the group box. |


    | Font | Get or set font name, style, and size. |


    | ForeColor | Get or set color of text. |


    | Text | Get or set the string to be displayed in the title section of the group
    box. |


    | Visible | If it is False , it will hide the group box (and all the controls
    it contains). |


    The GroupBox control has a number of methods and events, but all of them are rarely
    used. You will focus more on the methods and events associated with the controls
    in the group box.


    General uses of GroupBox control:


    *   Set Text and Name properties.


    *   Place the desired controls in the group box.


    *   Monitor the events of each control in the group box.


    | PictureBox |


    Visual C# offers a number of features for graphics. The PictureBox control is
    one of the main tools in exploiting these features. The picture box control can
    display graphic files (with various formats) and it can utilize a number of graphic
    functions and can be used for animation.


    Table 1.22 A number of Properties of the PictureBox object


    | Name | Get or set the name of the picture box. |'
