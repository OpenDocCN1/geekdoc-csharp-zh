    # TUTORIAL 1: VISUAL C# CONTROLS


    In this chapter, you will learn to know the properties and events of each control
    in Windows C# application. You need to learn and know in order to be more familiar
    when applying them to some applications.


    ## Form


    Forms are objects where the user interface is designed. The form is also known
    as a container or loader object, because it contains other controls. A number
    of controls are placed on the form having `BackColor`, `ForeColor`, and `Font`
    properties. To change it, you can select the desired control (after it is placed
    in the form) and change the desired properties. Another feature of this container
    control is that when `Enable` property is `False`, all controls on the form will
    be deactivated. Likewise, when this container control has a `Visible` property
    of `False`, then all controls on the form become invisible.


    Here, a number of properties, methods, and events commonly used for forms will
    be presented. Recall that the property describes the appearance and value of a
    control, a method is an action or task performed by a control, and an event occurs
    when something is done to that control.


    Following are the properties of the `Form`:


