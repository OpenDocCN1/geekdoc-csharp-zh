    \ Checked |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| RadioButton3 | `rdoYouFirst`\
    \ | White | 9 | You Play First | True |\n| RadioButton4 | `rdoComputerFirst` |\
    \ White | 9 | Computer Play First | True |\n| GroupBox3 | `grpComputer` | DeepPink\
    \ | | [Empty] | |\n| RadioButton5 | `rdoRandom` | White | 9 | Random Computer\
    \ | True |\n| RadioButton6 | `rdoSmart` | White | 9 | Smart Computer | True |\n\
    | Button1 | `btnStartStop` | | 10 | Start Game | |\n| Button2 | `btnExit` | |\
    \ 10 | Exit | |\n\n![](Image00057.jpg) Figure 6.6 Form after properties setting\
    \ done\n\n## Form Design Overview\n\nWhen finished, the form will look like as\
    \ shown in Figure 6.6. This completes the form design. You will start writing\
    \ the code for this game. You will write the code in several stages. As a first\
    \ step, you will write the code that starts the game and sets the 'stop' state.\
    \ Then, you will write the code for the 'playing' state after Start Game button\
    \ is clicked. During the code development process, you will modify certain methods\
    \ several times before arriving at the final process.\n\n### Step 3: Initialization\n\
    \nEvery time you start a project, a number of initializations are needed. In this\
    \ case, all initializations are placed in the `Load` event method of the form.\
    \ To simplify the task, you will specify an array of controls `LabelArr` for the\
    \ nine label controls that are used to display X and O marks on the grid. This\
    \ array is defined in the form-level declaration:\n\n```csharp\nLabel[] LabelArr\
    \ = new Label[9];\n```\n\n![](Image00058.jpg) Figure 6.7 The game is in “stop”\
    \ state\n\nAssignments are performed in the `Load` event method of `FormTicTacToe`.\
    \ You also create a message in `lblMessage` control and clear the label controls\
    \ that display the symbol. Finally, you want the game to be initialized in Two\
    \ Players mode so you disable two group boxes related to options for single player\
    \ mode:\n\n```csharp\nprivate void FormTicTacToe_Load(object sender, EventArgs\
    \ e)\n{\n    // Fills array\n    LabelArr[0] = lblBox1;\n    LabelArr[1] = lblBox2;\n\
    \    LabelArr[2] = lblBox3;\n    LabelArr[3] = lblBox4;\n    LabelArr[4] = lblBox5;\n\
    \    LabelArr[5] = lblBox6;\n    LabelArr[6] = lblBox7;\n    LabelArr[7] = lblBox8;\n\
    \    LabelArr[8] = lblBox9;\n    // Clears labels\n    for (int i = 0; i < 9;\
    \ i++)\n    {\n        LabelArr[i].Text = \"\";\n    }\n    lblMessage.Text =\
    \ \"Stopped\";\n    grpFirst.Enabled = false;\n    grpComputer.Enabled = false;\n\
    }\n```\n\n### Step 4: Verification\n\nSave and run the project to make sure everything\
    \ works, as shown in Figure 6.8.\n\n### Step 5: Exit Functionality\n\nAs desired,\
    \ the game is initialized in Two Players mode. You have two choices at this point:\
    \ clicking `btnStartStop` (Start Game) or clicking `btnExit`. You can also change\
    \ to One Player mode. You will handle this later. The code to exit the program\
    \ is quite simple. Click event from `btnExit`:\n\n```csharp\nprivate void btnExit_Click(object\
    \ sender, EventArgs e)\n{\n    this.Close();\n}\n```\n\nIt says that whenever\
    \ the Exit button is clicked, the project will close. Add this code to your project.\
    \ The code for `btnStartStop` is much complex. You will write it in several stages.\
    \ First, you will switch the code to shift the game from stop state to playing\
    \ state.\n\n### Step 6: Starting the Game\n\nWhen user clicks Start Game button\
    \ in the \"stop\" state, several things happen to switch the Tic Toe game to the\
    \ \"play\" state:\n\n- Change `Text` property of `btnStartStop` to \"Stop Game\"\
    .\n- Disable group boxes (do not allow selection when playing).\n- Disable Exit\
    \ button.\n- Set X's turn (because the X symbol is always first).\n- Clear label\
    \ controls that display symbols.\n- Allow user to enter symbols on the grid.\n\
    \nYou create three variables in the form-level declaration to help track a number\
    \ of situations in the game:\n\n```csharp\nbool XTurn;\nbool Clickable = false;\n\
    int NumberOfClick;\n```\n\nIf `XTurn` is true, then the X symbol will appear,\
    \ otherwise the O symbol will appear. `Clickable` is used to determine whether\
    \ user can click label controls. If this variable is true, the game is in progress.\
    \ Instead, it is false (initial value) when the game stops. `NumberOfClick` tracks\
    \ how many grid labels have been clicked (maximum 9).\n\n![](Image00059.jpg) Figure\
    \ 6.9 The game is in “playing” state\n\nThe code for the `Click` event of `btnStartStop`\
    \ that implements the steps above is given below:\n\n```csharp\nprivate void btnStartStop_Click(object\
    \ sender, EventArgs e)\n{\n    btnStartStop.Text = \"Stop Game\";\n    grpPlayer.Enabled\
    \ = false;\n    grpFirst.Enabled = false;\n    grpComputer.Enabled = false;\n\
    \    btnExit.Enabled = false;\n    XTurn = true;\n    lblMessage.Text = \"X's\
    \ Turn\";\n    // Clears LabelArr\n    for (int i = 0; i < 9; i++)\n    {\n  \
    \      LabelArr[i].Text = \"\";\n    }\n    Clickable = true;\n    NumberOfClick\
    \ = 0;\n}\n```\n\n### Step 7: Testing\n\nSave and run the project. Click Start\
    \ Game button and the game will switch to the \"playing\" state, as shown in Figure\
    \ 6.9. The game waits until the first player clicks on one of the grid locations\
    \ (you will write the code in a minute). Notice Stop Game button doesn't do anything\
    \ for now.\n\n### Step 8: Stopping the Game\n\nWhen user clicks Stop Game button\
    \ in \"playing\" state with two-players mode, several things must occur to switch\
    \ Tic Tac Toe game to the \"stop\" state:\n\n- Change the `Text` property of `btnStartStop`\
    \ to Start Game.\n- Display “Game Ends” message.\n- Enable `grpPlayer`.\n- Enable\
    \ `grpFirst` and `grpComputer` with one player mode.\n- Enable Exit button.\n\
    - Set `Clickable` to false.\n\nThe modified code that performs these steps is\
    \ placed in the `Click` event method of the `btnStartStop` control:\n\n```csharp\n\
    private void btnStartStop_Click(object sender, EventArgs e)\n{\n    if (btnStartStop.Text\
    \ == \"Start Game\")\n    {\n        btnStartStop.Text = \"Stop Game\";\n    \
    \    grpPlayer.Enabled = false;\n        grpFirst.Enabled = false;\n        grpComputer.Enabled\
    \ = false;\n        btnExit.Enabled = false;\n        XTurn = true;\n        lblMessage.Text\
    \ = \"X's Turn\";\n        // Clears LabelArr\n        for (int i = 0; i < 9;\
    \ i++)\n        {\n            LabelArr[i].Text = \"\";\n        }\n        Clickable\
    \ = true;\n        NumberOfClick = 0;\n    }\n    else\n    {\n        btnStartStop.Text\
    \ = \"Start Game\";\n        lblMessage.Text = \"Game Ends\";\n        grpPlayer.Enabled\
    \ = true;\n        if (rdoOnePlayer.Checked)\n        {\n            grpFirst.Enabled\
    \ = true;\n            grpComputer.Enabled = true;\n        }\n        btnExit.Enabled\
    \ = true;\n        Clickable = false;\n    }\n}\n```\n"
