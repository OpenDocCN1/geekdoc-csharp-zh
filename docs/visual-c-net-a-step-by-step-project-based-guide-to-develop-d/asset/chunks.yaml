  trans: "\n\n### 第 26 步\n保存并运行项目。现在，用户按下 `S` 键和 `J` 键后，将显示两枚导弹。\n![](img/Image00080.jpg)\n\
    *图 7.16 当用户按下 `J` 和 `K` 键时，会出现两枚导弹*\n\n### 第 27 步\n一旦发射，导弹的移动或位移将由 `timGame` 控制器更新。你需要使用\
    \ `btnGame` 的 `Click` 事件代码来启用定时器（当点击 `New Game` 时）和停止定时器（当点击 `Stop Game` 时）。在点击\
    \ `Stop Game` 的时候，你还需要清除导弹。以下给出了 `btnGame` 的 `Click` 过程的修改版本：\n\n```csharp\nprivate\
    \ void btnGame_Click( object sender, EventArgs e)\n{\n    if (btnGame.Text ==\
    \ \"New Game\")\n    {\n        MyGraphics.Clear(pnlGame.BackColor);\n       \
    \ btnGame.Text = \"Stop Game\";\n        btnOption.Enabled = false;\n        btnExit.Enabled\
    \ = false;\n        Player1Hit = 0;\n        Player2Hit = 0;\n        lblHitPlayer1.Text\
    \ = \"0\";\n        lblHitPlayer2.Text = \"0\";\n        Player1Rem = RudalMax;\n\
    \        Player2Rem = RudalMax;\n        lblRemPlayer1.Text = Player1Rem.ToString();\n\
    \        lblRemPlayer2.Text = Player2Rem.ToString();\n        Player1.Location\
    \ = new Rectangle(5, (int)(0.5 * pnlGame.ClientSize.Height - 0.5 * Player1.MyImage.Height),\
    \ Player1.MyImage.Width, Player1.MyImage.Height);\n        Player2.Location =\
    \ new Rectangle(pnlGame.ClientSize.Width - Player2.MyImage.Width - 5, (int)(0.5\
    \ * pnlGame.ClientSize.Height - 0.5 * Player2.MyImage.Height), Player2.MyImage.Width,\
    \ Player2.MyImage.Height);\n        Player1.Place(MyGraphics);\n        Player2.Place(MyGraphics);\n\
    \        timGame.Enabled = true;\n        this.Focus();\n    }\n    else\n   \
    \ {\n        timGame.Enabled = false;\n        Player1.Remove(MyGraphics, MyBrush);\n\
    \        Player2.Remove(MyGraphics, MyBrush);\n        Rudal1.Remove(MyGraphics,\
    \ MyBrush);\n        Rudal2.Remove(MyGraphics, MyBrush);\n        btnGame.Text\
    \ = \"New Game\";\n        btnOption.Enabled = true;\n        btnExit.Enabled\
    \ = true;\n        MyGraphics.DrawString(\"Game Over\", new Font(\"Arial\", 24),\
    \ Brushes.Yellow, 530, 210);\n    }\n}\n```\n\n### 第 28 步\n在 `timGame` 的 `Tick`\
    \ 事件过程过程中，你使用水平速度值和 `Move` 方法更新导弹的位置。你还检查了导弹是否越过了面板边缘。如果是，你需要将其从面板中删除以允许下一次发射。你还检查了游戏是否结束（两个玩家都没有导弹且均不可见）。当游戏结束时，将点击\
    \ `btnGame` 按钮：\n\n```csharp\nprivate void timGame_Tick( object sender, EventArgs\
    \ e)\n{\n    // 玩家 1 发出的导弹状态\n    if (Rudal1.IsVisible)\n    {\n        Rudal1.Move(MyGraphics,\
    \ MyBrush, RudalSpeed, 0);\n        if (Rudal1.Location.X > pnlGame.ClientSize.Width)\n\
    \        {\n            // 越过了面板边缘\n            Rudal1.Remove(MyGraphics, MyBrush);\n\
    \        }\n    }\n    // 玩家 2 发出的导弹状态\n    if (Rudal2.IsVisible)\n    {\n   \
    \     Rudal2.Move(MyGraphics, MyBrush, -RudalSpeed, 0);\n        if (Rudal2.Location.X\
    \ < 0)\n        {\n            // 越过了面板边缘\n            Rudal2.Remove(MyGraphics,\
    \ MyBrush);\n        }\n    }\n    // 检查游戏状态\n    if (!Rudal1.IsVisible && Player1Rem\
    \ == 0 && !Rudal2.IsVisible && Player2Rem == 0)\n    {\n        btnGame.PerformClick();\n\
    \    }\n}\n```\n将此过程添加到你的项目中。在代码中，你将定时器的 `Interval` 属性设置为 50 毫秒。这是一个你可以根据意愿更改的参数。\n\
    \n### 第 29 步\n保存并运行项目。确保你仍然使用双玩家选项。点击 `New Game`。点击 `S` 和 `J` 键发射导弹。确保标签反映了剩余导弹的准确值。如果导弹击中玩家，玩家的图形将会消失。要再次显示它，请按下可以在面板上上下移动的按键之一，如图\
    \ 7.17 所示。\n\n### 第 30 步\n如果导弹向玩家发射或击中玩家，另一个玩家将得分（命中）。你需要一种方法来检查此类碰撞。因为在这里使用矩形区域定义移动对象，所以你需要知道哪两个矩形区域相交的。在\
