  trans: "\n\n## 对象属性\n\n| Object | Name | ForeColor | Font Size | Text | Checked\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| RadioButton3 | `rdoYouFirst`\
    \ | White | 9 | 你先手 | True |\n| RadioButton4 | `rdoComputerFirst` | White | 9\
    \ | 电脑先手 | True |\n| GroupBox3 | `grpComputer` | DeepPink | | [Empty] | |\n| RadioButton5\
    \ | `rdoRandom` | White | 9 | 随机电脑 | True |\n| RadioButton6 | `rdoSmart` | White\
    \ | 9 | 智能电脑 | True |\n| Button1 | `btnStartStop` | | 10 | 开始游戏 | |\n| Button2\
    \ | `btnExit` | | 10 | 退出 | |\n\n![](img/Image00057.jpg) 图 6.6 设置属性后的表单\n\n##\
    \ 表单设计概述\n\n完成后，表单将如图 6.6 所示。这完成了表单设计。你将开始为这个游戏编写代码。你将分几个阶段编写代码。第一步，你将编写启动游戏并设置“停止”状态的代码。然后，你将在点击“开始游戏”按钮后编写“正在进行”状态的代码。在代码开发过程中，你将对某些方法进行多次修改，最终最终流程。\n\
    \n### 步骤 3：初始化\n\n每当你启动项目时，都需要进行许多初始化。在这种情况下，所有的初始化都放在表单的 `Load` 事件方法中。为了简化任务，你将为九个用于在网格上显示\
    \ X 和 O 标记的标签（Label）控件指定数组 `LabelArr`。该数组在表单级别的声明中定义：\n\n```csharp\nLabel[] LabelArr\
    \ = new Label[9];\n```\n\n![](img/Image00058.jpg) 图 6.7 游戏处于“停止”状态\n\n赋值操作在 `FormTicTacToe`\
    \ 的 `Load` 事件方法中执行。你会在 `lblMessage` 控件创建一个消息，并清除显示符号的标签控件。最后，你希望游戏以“双玩家”模式初始化，因此你禁用了与单人模式选项相关的两个组框：\n\
    \n```csharp\nprivate void FormTicTacToe_Load(object sender, EventArgs e)\n{\n\
    \    // 填充数组\n    LabelArr[0] = lblBox1;\n    LabelArr[1] = lblBox2;\n    LabelArr[2]\
    \ = lblBox3;\n    LabelArr[3] = lblBox4;\n    LabelArr[4] = lblBox5;\n    LabelArr[5]\
    \ = lblBox6;\n    LabelArr[6] = lblBox7;\n    LabelArr[7] = lblBox8;\n    LabelArr[8]\
    \ = lblBox9;\n    // 清除标签\n    for (int i = 0; i < 9; i++)\n    {\n        LabelArr[i].Text\
    \ = \"\";\n    }\n    lblMessage.Text = \"Stopped\";\n    grpFirst.Enabled = false;\n\
    \    grpComputer.Enabled = false;\n}\n```\n\n### 步骤 4：验证\n\n保存并运行项目以确保一切正常工作，如图\
    \ 6.8 所示。\n\n### 步骤 5：退出功能\n\n按照需要，游戏以“双玩家”模式初始化。此时你有两个选择：点击 `btnStartStop`（开始游戏）或点击\
    \ `btnExit`（退出）。你也可以切换到“单人”模式。你稍后会处理。退出程序的代码非常简单。来自 `btnExit` 的点击事件：\n\n```csharp\n\
    private void btnExit_Click(object sender, EventArgs e)\n{\n    this.Close();\n\
    }\n```\n\n这意味着每当点击退出按钮时，项目就会关闭。将此代码添加到项目中。`btnStartStop` 的代码要复杂。你将分几个阶段编写它。首先，你将切换代码将游戏从停止状态切换到正在进行状态。\n\
    \n### 步骤 6：开始游戏\n\n当用户在“停止”状态下点击“开始游戏”按钮时，会发生几件事来将井棋游戏切换到“播放”状态：\n\n- 将 `btnStartStop`\
    \ 的 `Text` 属性更改为“停止游戏”。\n- 禁用组框（游戏时不允许选择）。\n- 禁用退出按钮。\n- 设置 X 的回合（因为 X 符号总是第一个的）。\n\
    - 清除显示符号的标签控件。\n- 允许用户在网格上输入符号。\n\n你在表单级别声明中创建了三个变量来帮助跟踪游戏中的若干情况：\n\n```csharp\n\
    bool XTurn;\nbool Clickable = false;\nint NumberOfClick;\n```\n\n如果 `XTurn` 为真，则会出现\
    \ X 符号，否则会出现 O 符号。`Clickable` 用于确定用户是否可以点击标签控件。如果此变量为真，则游戏正在进行。相反，当游戏停止时为假（初始值）。`NumberOfClick`\
    \ 跟踪点击了多少网格标签（最多 9 个）。\n\n![](img/Image00059.jpg) 图 6.9 游戏处于“播放”状态\n\n实现上述步骤的\
    \ `btnStartStop` `Click` 事件代码所示：\n\n```csharp\nprivate void btnStartStop_Click(object\
    \ sender, EventArgs e)\n{\n    btnStartStop.Text = \"Stop Game\";\n    grpPlayer.Enabled\
    \ = false;\n    grpFirst.Enabled = false;\n    grpComputer.Enabled = false;\n\
    \    btnExit.Enabled = false;\n    XTurn = true;\n    lblMessage.Text = \"X's\
    \ Turn\";\n    // 清除标签\n    for (int i = 0; i < 9; i++)\n    {\n        LabelArr[i].Text\
    \ = \"\";\n    }\n    Clickable = true;\n    NumberOfClick = 0;\n}\n```\n\n###\
    \ 步骤 7：测试\n\n保存并运行项目。点击“开始游戏”按钮，游戏将切换到“播放”状态，如图 6.9 所示。游戏等待第一个玩家点击网格位置（你稍后会编写代码）。注意停止游戏按钮目前没有任何作用。\n\
    \n### 步骤 8：停止游戏\n\n当用户在双玩家模式播放状态下点击“停止游戏”按钮时，必须发生几件事将井棋游戏切换到“停止”状态：\n\n- 将 `btnStartStop`\
    \ 的 `Text` 属性更改为“开始游戏”。\n- 显示“游戏结束”消息。\n- 启用 `grpPlayer`。\n- 以单人模式启用 `grpFirst`\
    \ 和 `grpComputer`。\n- 启用退出按钮。\n- 设置 `Clickable` 为假。\n\n执行这些步骤的修改代码放在 `btnStartStop`\
    \ 控件的 `Click` 事件方法中：\n\n```csharp\nprivate void btnStartStop_Click(object sender,\
    \ EventArgs e)\n{\n    if (btnStartStop.Text == \"Start Game\")\n    {\n     \
    \   btnStartStop.Text = \"Stop Game\";\n        grpPlayer.Enabled = false;\n \
    \       grpFirst.Enabled = false;\n        grpComputer.Enabled = false;\n    \
    \    btnExit.Enabled = false;\n        XTurn = true;\n        lblMessage.Text\
    \ = \"X's Turn\";\n        // 清除标签\n        for (int i = 0; i < 9; i++)\n    \
    \    {\n            LabelArr[i].Text = \"\";\n        }\n        Clickable = true;\n\
    \        NumberOfClick = 0;\n    }\n    else\n    {\n        btnStartStop.Text\
    \ = \"Start Game\";\n        lblMessage.Text = \"Game Ends\";\n        grpPlayer.Enabled\
    \ = true;\n        if (rdoOnePlayer.Checked)\n        {\n            grpFirst.Enabled\
    \ = true;\n            grpComputer.Enabled = true;\n        }\n        btnExit.Enabled\
    \ = true;\n        Clickable = false;\n    }\n}\n```\n\n"
- fmt: "\n### Step 9\nSave and run project. You can now move from the \"stop\" to\
    \ the \"playing\" state and vice versa. When stop, make sure the group boxes are\
    \ enabled for one and two player options.![](Image00060.jpg) User now can move\
    \ from the \"stop\" to the \"playing\" state and vice versa. You will write the\
    \ code for the two player option, by first writing the code to display the symbol\
    \ on the grid.\n\n### Step 10\nIn the Tic Tac Toe game with a two player option,\
    \ when a player clicks on a box on the grid, an appropriate symbol (`X` or `O`)\
    \ will appear. After that, you then need to see if someone wins the game. If there\
    \ is no win, and there is still an empty box, the turn switch to another player.\n\
    \nSo, when a grid box is clicked, these steps need to be done:\n* Verify that\
    \ there is no symbol on the grid before.\n* Increment `NumberOfClick`.\n* Place\
    \ the right symbol (`X` if `XTurn` is true, otherwise `O`).\n* Switch turn to\
    \ the next player (not required if there is a win or a draw).\n* Check for winning.\
    \ If there is a win, the winner is announced and the game is stopped.\n* Check\
    \ if `NumberOfClick = 9` (board is full but no win). If yes, the draw is announced\
    \ and the game is stopped.\n\nThe code to perform these steps will be placed in\
    \ the method named `lblBox_Click`. This method was created to handle the `Click`\
    \ event for the nine label controls used on the grid (`lblBox1`, `lblBox2`, `lblBox3`,\
    \ `lblBox4`, `lblBox5`, `lblBox6`, `lblBox7`, `lblBox8`, and `lblBox9`). Add this\
    \ method (`lblBox_Click`) to your project. This implements the steps needed to\
    \ receive symbols on the grid:\n\n```csharp\nprivate void lblBox_Click(object\
    \ sender, EventArgs e) {\n    String WhoWin = \"\";\n    int i;\n    if (Clickable)\n\
    \    {\n        // See which box clicked\n        Label BoxClicked;\n        BoxClicked\
    \ = (Label) sender;\n        // Last digit is the number extracted\n        i\
    \ = Convert.ToInt32(BoxClicked.Name[BoxClicked.Name.Length - 1].ToString()) -\
    \ 1;\n        // If it has been clicked, exit\n        if (LabelArr[i].Text !=\
    \ \"\")\n            return;\n        NumberOfClick++;\n        if (XTurn)\n \
    \       {\n            LabelArr[i].Text = \"X\";\n            XTurn = false;\n\
    \            lblMessage.Text = \"O's Turn\";\n        }\n        else\n      \
    \  {\n            LabelArr[i].Text = \"O\";\n            XTurn = true;\n     \
    \       lblMessage.Text = \"X's Turn\";\n        }\n        if (WhoWin != \"\"\
    )\n        {\n            lblMessage.Text = WhoWin + \" wins\";\n            btnStartStop.PerformClick();\n\
    \            return;\n        }\n        else if (NumberOfClick == 9)\n      \
    \  {\n            // Draw\n            lblMessage.Text = \"Game is draw!\";\n\
    \            btnStartStop.PerformClick();\n            return;\n        }\n  \
    \  }\n}\n```\n![](Image0061.jpg) Figure 6.11 After all grid locations are filled\
    \ with symbols, the game returns to the \"stop\" state Look at this code. Clicking\
    \ on one of the nine label controls on the grid will invoke this method. The first\
    \ part of the code determines the index element of label controls array (`LabelArr`)\
    \ that is clicked (`i`). This index is the last character in the label name that\
    \ is converted to numeric. If there is a symbol (not empty), then the method is\
    \ complete. If it is empty, the symbol will be placed in `LabelArr[i]`. After\
    \ that, you check the winning (only the comment line, because the code will be\
    \ given later). If `WhoWin` is not empty, the winner will be declared. Otherwise,\
    \ if it is blank, clicks will be accepted until the grid is full and the game\
    \ is draw.\n\n### Step 11\nSave and run project. At this point, you can click\
    \ on each grid location, which places `X` and `O` symbols alternately. After all\
    \ grid locations are filled with symbols, the game returns to the \"stop\" state\
    \ as shown in Figure 6.11.\n\n### Step 12\nYou will write a general function `CheckWinning`\
    \ that checks the game grid and determines whether there is a winner or not. If\
    \ there is, a win will be announced and this function will produce a return value\
    \ in the form of a string containing the symbol (`X` or `O`) for the winner or\
    \ blank if there is no winner. You need a strategy to do it. There are eight ways\
    \ to determine winning (3 horizontal, 3 vertical, 2 diagonal). Consider the indices\
    \ of label controls array (`LabelArr`) used in the following grid (1, 2, 3, 4,\
    \ 5, 6, 7, 8, 9).\n\nIf you declare a string array `WinningArr`, eight elements:\n\
    ```csharp\n// Possible winnings\nWinningArr[0] = \"012\";\nWinningArr[1] = \"\
    345\";\nWinningArr[2] = \"678\";\nWinningArr[3] = \"036\";\nWinningArr[4] = \"\
    147\";\nWinningArr[5] = \"258\";\nWinningArr[6] = \"048\";\nWinningArr[7] = \"\
    246\";\n```\nSo, the logic here is to check every possible winning and see if\
    \ all elements of the `LabelArr` have the same symbol (`X` or `O`, but not empty).\
    \ If yes, the winner will be declared. Add the following level-form declaration:\n\
    ```csharp\nString[] WinningArr = new String[8];\n```\nModify the `Load` method\
    \ of `FormTicTacToe` to set the values of the array:\n```csharp\nprivate void\
    \ FormTicTacToe_Load(object sender, EventArgs e) {\n    // Fills array\n    LabelArr[0]\
    \ = lblBox1;\n    LabelArr[1] = lblBox2;\n    LabelArr[2] = lblBox3;\n    LabelArr[3]\
    \ = lblBox4;\n    LabelArr[4] = lblBox5;\n    LabelArr[5] = lblBox6;\n    LabelArr[6]\
    \ = lblBox7;\n    LabelArr[7] = lblBox8;\n    LabelArr[8] = lblBox9;\n    // Possible\
    \ winnings\n    WinningArr[0] = \"012\";\n    WinningArr[1] = \"345\";\n    WinningArr[2]\
    \ = \"678\";\n    WinningArr[3] = \"036\";\n    WinningArr[4] = \"147\";\n   \
    \ WinningArr[5] = \"258\";\n    WinningArr[6] = \"048\";\n    WinningArr[7] =\
    \ \"246\";\n    // Clears labels\n    for (int i = 0; i < 9; i++)\n        LabelArr[i].Text\
    \ = \"\";\n    lblMessage.Text = \"Game Stopped\";\n    grpFirst.Enabled = false;\n\
    \    grpComputer.Enabled = false;\n}\n```\n\n### Step 13\nAdd the general function\
    \ `CheckWinning` to your project:\n```csharp\nprivate String CheckWinning() {\n\
    \    String Winner = \"\";\n    int[] BoxNumber = new int[3];\n    String[] Symbol\
    \ = new String[3];\n    // Checks all winning\n    for (int i = 0; i < 8; i++)\
    \ {\n        for (int j = 0; j < 3; j++) {\n            BoxNumber[j] = Convert.ToInt32(WinningArr[i][j]);\n\
    \            Symbol[j] = LabelArr[BoxNumber[j]].Text;\n        }\n    }\n    if\
    \ (Symbol[0] == Symbol[1] && Symbol[1] == Symbol[2] && Symbol[0] != \"\") {\n\
    \        // There is a winner\n        Winner = Symbol[0];\n        for (int j\
    \ = 0; j < 3; j++) {\n            LabelArr[BoxNumber[j]].BackColor = Color.Red;\n\
    \        }\n    }\n    return (Winner);\n}\n```\n\n### Step 14\nYou can now modify\
    \ the `Click` event of `lblBox` to check the winnings, but you need one other\
    \ modification. Notice when a victory or draw game is declared, you stop the game\
    \ by clicking on `btnStartStop` button. You need a way to differentiate the way\
    \ the game is terminated from the way the game is terminated by clicking the button.\
    \ Add this variable to the form level declaration:\n```csharp\nbool GameOver;\n\
    ```\nIf `GameOver` is true, there will be a victory or a draw game. If false,\
    \ the Stop Game button is clicked before the game ends. Modify the `Click` event\
    \ method of `btnStartStop`:\n"
