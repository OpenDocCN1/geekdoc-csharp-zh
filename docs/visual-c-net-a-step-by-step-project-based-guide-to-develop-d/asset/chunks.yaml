    TUTORIAL 4


    HORSE RACING


    In this tutorial, you will build Horse Racing game. This is a simple game. Up
    to 10 horses will race to the finish line. You guessed two horses that you thought
    could win the race. By clicking on the Start button, the race will start. All
    horses will race speed to get to the finish line.


