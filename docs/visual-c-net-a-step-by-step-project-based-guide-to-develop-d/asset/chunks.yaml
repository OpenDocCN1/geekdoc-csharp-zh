- fmt: "\n# Catching Ball Game Overview\n\nLabels are used for instructions and to\
    \ display game information (remaining time, number of balls captured, and game\
    \ difficulty level). Two buttons are used to change the game difficulty level,\
    \ one button to start the game, and another button to stop the game. Picture box\
    \ controls hold images for man, bird, and ball. \n\nRun the program (press `<F5>`).\
    \ The game will appear in the \"starting\" state. Description and program instructions\
    \ are given. At this point, the user can click `Start` button to start the game,\
    \ click the arrow buttons to change the difficulty level of the game or click\
    \ `Stop` button to stop the program. \n\n![](Image00036.jpg)Figure 3.1 All controls\
    \ used in Catching Ball game project\n![](Image00037.jpg)Figure 6.2 The Catcing\
    \ Ball game is at “starting” state showing program description and instructions\n\
    \nChange the game's difficulty level if desired (for example 5) by clicking on\
    \ the small arrow buttons below `Difficulty` label. Then click on `Start` button.\
    \ Program instructions will disappear. A bird is displayed above the screen dropping\
    \ ball. This is the \"playing\" state: \n\n![](Image00038.jpg)Figure 6.3 Game\
    \ is at “playing” state\n\nYou can shift or move man to below the ball to catch\
    \ it. You can move man using the arrow keys on the keyboard or by pressing the\
    \ left or right mouse button. When the ball reaches man, you will get one point.\
    \ If the ball is not captured and passes man, the score does not increase: \n\n\
    ![](Image00039.jpg)Figure 6.4 User can move man to below the ball to catch it,\
    \ using arrow keys on the keyboard or by pressing the left or right mouse button\n\
    ![](Image00040.jpg)Figure 6.5 Final result is displayed in a message box\n\nThe\
    \ game continues for 60 seconds. Remaining time is displayed. And the final result\
    \ is displayed in the message box that appears at the end of the game, as shown\
    \ in Figure 6.5.\n\n# Tutorial Steps\n\n## Step 1: Designing the Form\nYou will\
    \ start building Catching Ball game project, by designing the form. Start a new\
    \ project in Visual Basic. Once started, it is recommended that you save the project\
    \ with the name you choose. This will create the folder and file structure needed\
    \ for your project.\n\nPlace two control panels on the form (one panel with a\
    \ width of 100 pixels on the left side and one other panel with a width of 900\
    \ pixels on the right side). Make the two panels have a height of 600 pixels.\
    \ Place six labels and four buttons in the left panel. Place a label control and\
    \ three picture box controls on the right panel. Add a timer control. The form\
    \ will look like this: \n\n![](Image00041.jpg)Figure 6.6 All controls user and\
    \ their positions form\n\nThe labels on the left panel are used to display game\
    \ information. Two buttons are used to change the game difficulty level, one button\
    \ to start the game, and one other button to stop the game. The label controls\
    \ on the right panel are used to display game instructions. Picture boxes are\
    \ used to contain Man, Bird, and Ball images. Timer is used to control the game.\n\
    \n## Step 2: Setting Control Properties\nSet control properties using the Properties\
    \ window:\n\n| Object | Property | Value |\n| :--- | :--- | :--- |\n| **Form1**\
    \ | Name | `FormCatchingBall` |\n| | Text | `Catching Ball` |\n| | FormBorderStyle\
    \ | `FixedSingle` |\n| | KeyPreview | `True` |\n| | StartPosition | `CenterScreen`\
    \ |\n| **Panel1** | BackColor | `DeepPink` |\n| **Label1** | AutoSize | `False`\
    \ |\n| | Font | `Bold, 12` |\n| | ForeColor | `Yellow` |\n| | Text | `Remaining\
    \ Time:` |\n| | TextAlign | `MiddleCenter` |\n| **Label2** | Name | `lblTime`\
    \ |\n| | AutoSize | `False` |\n| | Font | `Bold, 12` |\n| | ForeColor | `White`\
    \ |\n| | Text | `0` |\n| | TextAlign | `MiddleCenter` |\n| **Label3** | AutoSize\
    \ | `False` |\n| | Font | `Bold, 12` |\n| | ForeColor | `Yellow` |\n| | Text |\
    \ `Ball:` |\n| | TextAlign | `MiddleCenter` |\n| **Label4** | Name | `lblScore`\
    \ |\n| | AutoSize | `False` |\n| | Font | `Bold, 12` |\n| | ForeColor | `White`\
    \ |\n| | Text | `0` |\n| | TextAlign | `MiddleCenter` |\n| **Label5** | AutoSize\
    \ | `False` |\n| | Font | `Bold, 12` |\n| | ForeColor | `Yellow` |\n| | Text |\
