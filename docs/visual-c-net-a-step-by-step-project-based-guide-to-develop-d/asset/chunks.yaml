  trans: "\n\n| Maximum | 60 |\n| :--- | :--- |\n| SmallChange | 1 |\n| LargeChange\
    \ | 1 |\n| Visible | False |\n\n### `Button1` 对象的属性\n| Property | Value |\n| :---\
    \ | :--- |\n| Name | `btnStart` |\n| Text | Start Training |\n| Font Size | 10\
    \ |\n\n### `Button2` 对象的属性\n| Property | Value |\n| :--- | :--- |\n| Name | `btnExit`\
    \ |\n| Text | Exit |\n| Font Size | 10 |\n\n### `Timer1` 对象的属性\n| Property | Value\
    \ |\n| :--- | :--- |\n| Name | `timerQuestion` |\n| Interval | 1000 |\n\n当完成所有属性设置后，你的表单将如下所示：![](img/Image00006.jpg)\n\
    图 2.5 设置所有属性后的表单\n\n你将开始为应用程序编写代码。你将分几个步骤完成。作为第一步，你将编写代码来生成随机问题，从用户处读取答案，并更新分数。\n\
    \n#### 步骤 3\n目前，你将忽略计时选项。在初始代码运行良好后，将讨论计时问题。分步骤构建项目总是比一次性构建要容易。\n\n当点击 Start Training\
    \ (`btnStart`) 按钮时，会发生以下情况：\n\n* 将 `btnStart` 的 `Text` 属性设置为 `Stop Training`。\n\
    * 禁用 `btnExit` 按钮。\n* 设置测试的问题数量并将正确答案数设置为零。\n* 在 `lblQuestion` 上生成并显示问题。\n* 从用户处获取答案。\n\
    * 检查答案并更新分数。\n\n在回答每个问题后，将生成并回答下一个问题。用户将一直回答问题，直到点击 Stop Training（或时间耗尽）。需要执行以下步骤：\n\
    \n* 将 `btnStart` 的 `Text` 属性设置为 `Start Training`。\n* 启用 `btnExit` 按钮。\n* 清空 `lblQuestion`。\n\
    * 显示结果。\n\n首先，创建一个 `Random` 对象并声明两个表单级变量，用于跟踪回答了多少问题以及有多少答案是正确的：\n\n```cs\nRandom\
    \ MyRandom = new Random();\nint Answered, Correct;\n```\n\n#### 步骤 4\n为 `btnStart`\
    \ 的 `Click` 事件编写代码以实现上述步骤，显示显示结果：\n\n```csharp\nprivate void btnStart_Click(object\
    \ sender, EventArgs e)\n{\n    if (btnStart.Text == \"Start Training\")\n    {\n\
    \        btnStart.Text = \"Stop Training\";\n        btnExit.Enabled = false;\n\
    \        Answered = 0;\n        Correct = 0;\n        lblTested.Text = \"0\";\n\
    \        lblCorrect.Text = \"0\";\n        blQuestion.Text = GetQuestion();\n\
    \    }\n    else\n    {\n        btnStart.Text = \"Start Training\";\n       \
    \ btnExit.Enabled = true;\n        lblQuestion.Text = \"\";\n    }\n}\n```\n\n\
    #### 步骤 5\n步骤 4 中的代码使用 `GetQuestion` 函数生成随机问题并将其生成为 `String` 类型。添加此内容（你稍后会完成）：\n\
    \n```csharp\nprivate string GetQuestion()\n{\n    return (\"Question!\");\n}\n\
    ```\n\n#### 步骤 6\n现在，你可以为 `btnExit` 的 `Click` 事件编写代码：\n\n```csharp\nprivate void\
    \ btnExit_Click(object sender, EventArgs e)\n{\n    this.Close();\n}\n```\n\n\
    #### 步骤 7\n保存、运行项目并点击 Training 按钮。表单现在将如图 2.6 所示：![](img/Image0007.jpg)\n图 2.6\
    \ 用户点击 Training 后的数学游戏\n\n#### 步骤 8\n你将继续编写生成问题以及从用户处获取答案（包括分数）的代码。之后，你将学习计时器以及如何显示结果。要生成问题，你需要检查用户最近选择的选项，并根据这些选择生成随机问题。所有代码都将放在\
    \ `GetQuestion` 中。查看问题生成的每个步骤。第一步是选择一种随机问题类型，最多四种。你将使用一种简单的方法，首先生成 1 到 4 之间的随机值（1\
    \ 代表加法，2 代表减法，3 代表乘法，4 代表除法）。如果带有随机数字的选框（在 Type 组框中）被选中，那么就是该类型的问题。如果选框未被选中，你将选择另一个值。继续此过程，直到选择了问题类型。注意，这种方法假设至少有一个选框始终被选中。选择问题类型的代码如下：\n\
    \n```cs\nint PType, P = 0;\ndo\n{\n    PType = MyRandom.Next(4) + 1;\n    if (PType\
    \ == 1 && chkAdd.Checked)\n    {\n        // Addition\n        P = PType;\n  \
    \  }\n    else if (PType == 2 && chkSubs.Checked)\n    {\n        // Substraction\n\
    \        P = PType;\n    }\n    else if (PType == 3 && chkMul.Checked)\n    {\n\
    \        // Multiplication\n        P = PType;\n    }\n    else if (PType == 4\
    \ && chkDiv.Checked)\n    {\n        // Division\n        P = PType;\n    }\n\
    } while (P == 0);\n```\n\n选择问题类型后，你将确定用于生成问题的因子。该因子可以是 0 到 9 之间的值，或者根据 Factor\
    \ 组中选中的单选按钮生成 0 到 9 的随机值。`GetFactor` 函数根据 Factor 框中的单选按钮选择和问题类型 `P` 提供因子。对于随机因子，该函数确保了在生成除法题时不会使用\
    \ 0 作为返回值。编写 `GetFactor` 函数的定义：\n\n```cs\nprivate int GetFactor(int p)\n{\n  \
    \  if (rdoFactor0.Checked)\n        return (0);\n    else if (rdoFactor1.Checked)\n\
    \        return (1);\n    else if (rdoFactor2.Checked)\n        return (2);\n\
    \    else if (rdoFactor3.Checked)\n        return (3);\n    else if (rdoFactor4.Checked)\n\
    \        return (4);\n    else if (rdoFactor5.Checked)\n        return (5);\n\
    \    else if (rdoFactor6.Checked)\n        return (6);\n    else if (rdoFactor7.Checked)\n\
    \        return (7);\n    else if (rdoFactor8.Checked)\n        return (8);\n\
    \    else if (rdoFactor9.Checked)\n        return (9);\n    else\n    {\n    \
    \    // Random\n        if (p == 4)\n            return (MyRandom.Next(9) + 1);\n\
    \        else\n            return (MyRandom.Next(10));\n    }\n}\n```\n\n如果选择了随机选项\
    \ (`rdoFactorRandom`)，则为加法、减法和乘法题生成 0 到 9；为除法题 (`p = 4`) 生成 1 到 9。在其他情况下，选定的因子将作为返回值。\n\
    \n#### 步骤 9\n现在该你开始编写 `GetQuestion` 函数的定义了。首先，添加以下三个表单级变量的声明：\n\n```cs\nint CorrectAnswer,\
    \ Digits;\nstring Question;\n```\n\n然后，编写 `GetQuestion` 函数的定义：\n\n"
- fmt: "\n## Core Logic Implementation\n\n```csharp\nprivate string GetQuestion()\
    \ {\n    int PType, P, RandValue, Factor;\n    P = 0;\n    do\n    {\n       \
    \ PType = MyRandom.Next(4) + 1;\n        if (PType == 1 && chkAdd.Checked)\n \
    \       {\n            // Addition\n            P = PType;\n            RandValue\
    \ = MyRandom.Next(10);\n            Factor = GetFactor(1);\n            CorrectAnswer\
    \ = RandValue + Factor;\n            Question = RandValue.ToString() + \" + \"\
    \ + Factor.ToString() + \" = \";\n        }\n        else if (PType == 2 && chkSubs.Checked)\n\
    \        {\n            // Substraction\n            P = PType;\n            Factor\
    \ = GetFactor(2);\n            CorrectAnswer = MyRandom.Next(10);\n          \
    \  RandValue = CorrectAnswer + Factor;\n            Question = RandValue.ToString()\
    \ + \" - \" + Factor.ToString() + \" = \";\n        }\n        else if (PType\
    \ == 3 && chkMul.Checked)\n        {\n            // Multiplication\n        \
    \    P = PType;\n            RandValue = MyRandom.Next(10);\n            Factor\
    \ = GetFactor(3);\n            CorrectAnswer = RandValue * Factor;\n         \
    \   Question = RandValue.ToString() + \" x \" + Factor.ToString() + \" = \";\n\
    \        }\n        else if (PType == 4 && chkDiv.Checked)\n        {\n      \
    \      // Division\n            P = PType;\n            Factor = GetFactor(4);\n\
    \            CorrectAnswer = MyRandom.Next(10);\n            RandValue = CorrectAnswer\
    \ * Factor;\n            Question = RandValue.ToString() + \" / \" + Factor.ToString()\
    \ + \" = \";\n        }\n    } while (P == 0);\n    if (CorrectAnswer < 10)\n\
    \    {\n        Digits = 1;\n        return (Question + \"?\");\n    }\n    else\n\
    \    {\n        Digits = 2;\n        return (Question + \"??\");\n    }\n}\n```\n\
    \n## Step 10: Add and Run\nAdd the code to the project. Save and run the project.\
    \ Click `Start Training` and you will see a random addition problem (Image0008.jpg)!\
    \ Figure 2.7 Addition question given two question marks tell the user there are\
    \ two digits to the correct answer. At this point, what you can do is click `Stop\
    \ Training`. You can then click `Start Training` to see other problems.\n\n##\
    \ Step 11: Answer Input\nAfter a question is displayed, user can enter the digits\
    \ using the keyboard. Key presses are handled by the `KeyPress` event of the form.\
    \ When the form has focus, any key pressed will be interpreted and used. In designing,\
    \ you set the `KeyPreview` property of the form to `True` so that all key presses\
    \ are processed by the `KeyPress` event before they are used by other controls.\
    \ You will also make sure the form has focus when it needs it The steps for reading\
    \ and checking answer are as follows:\n\n- Make sure the pressed key is a value\
    \ between `0` to `9`.\n- If the correct value is entered, then the value will\
    \ be used as part of the answer to replace the question mark on the question.\n\
    - If question mark is still left, another key press is awaited.\n- If all question\
    \ marks have been replaced, the answer will be compared with the correct answer.\n\
    - Increment the number of questions that have been tested.\n- If the answer is\
    \ correct, the number of questions have been answered correctly will be incremented.\n\
    - Update score controls.\n- Generate another question.\n\nYou need to declare\
    \ two form-level variables to load user’s answer and the current number of digits\
    \ of the answer:\n\n```csharp\nstring YourAnswer;\nint NumberDigitsAnswer;\n```\n\
    \nWrite the Keypress event of the form which implements the steps above:\n\n```csharp\n\
    private void FormMathGame_KeyPress(object sender, KeyPressEventArgs e) {\n   \
