    \ 50, (i - 1) * 60 + 10) &#124;\n\nThe HorsesChosenArr is used to tell which horses\
    \ are selected. A red X will be placed next to the selected horse. After two horses\
    \ are selected ( NumberOfHorsesByUser = 2), you can start the race by clicking\
    \ Start . If the user clicks on two horses and wants to change the race, the user\
    \ can click on the horse which has been deleted and the red X will disappear so\
    \ the user can choose another.When a horse is clicked, the following steps are\
    \ taken:\n\n*   If the horse has been selected before, then NumberOfHorsesByUser\
    \ is decremented, set HorsesChosenArr[i] to 0 and delete the letter X next to\
    \ the horse.\n\n*   If the horse is not selected before and NumberOfHorsesByUser\
    \ is less than 2, then NumberOfHorsesByUser is incremented, set HorsesChosenArr[i]\
    \ to 1 and draw a red X next to the horse.\n\nYou follow these steps in that order\
    \ to ensure that the user does not click on a horse that has been previously selected.![](Image00034.jpg)Figure\
    \ 4.10 User can select two horses to competeThe code for horse selection is placed\
    \ inside MouseDown event procedure from pnlGame :\n\n&#124; 123456789101112131415161718192021222324252627282930313233\
    \ &#124; private void pnlGame_MouseDown( object sender, MouseEventArgs e){   int\
