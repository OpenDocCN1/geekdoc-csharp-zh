    TUTORIAL 1


    VISUAL C# CONTROLS


    In this chapter, you will learn to know the properties and events of each control
    in a Windows Visual C# application. You need to learn and know in order to be
    more familiar when applying them to some applications in this book.


    | Form |


    Forms are objects where the user interface is designed. The form is also known
    as a container or loader object, because it contains other controls. A number
    of controls are placed on the form having BackColor , ForeColor , and Font properties.
    To change it, you can select the desired control (after it is placed in the form)
    and change the desired properties. Another feature of this container control is
    that when Enable property is False , all controls on that form will be deactivated.
    Likewise, when this container control has a Visible property of False , then all
    controls on the form become invisible.


    Here, a number of properties, methods, and events commonly used for forms will
    be presented. Recall that the property describes the appearance and value of a
    control, a method is an action or task performed by a control, and an event occurs
    when something is done to that control.


    Following are the properties of the Form :


    Table 1.1 A number of properties of the Form object


    | Name | Used to get or set the form name. |


    | AcceptButton | Used to get or set button that is clicked on form when user presses
    the ENTER key. |


    | BackColor | Used to get or set the background color of the form. |


    | CancelButton | Used to get or set button that is clicked on form when user presses
    the Esc key. |


    | ControlBox | Used to get or set a value that indicates whether a control box
    is displayed on the caption bar of the form. |


    | Enabled | If it is False , all controls on the form will be disabled. |


    | Font | Used to get or set font name, size, and style. |


    | ForeColor | Used to get or set the color of text or graphics. |


    | FormBorderStyle | Used to set form boundaries to be fixed or dynamic. |'
