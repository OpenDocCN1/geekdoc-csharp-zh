- fmt: "\n### Step 3\nYou will now start writing the code for this game in a few steps.\
    \ As an initial step, you will write the code that starts the program and sets\
    \ the ‘starting’ state. Then, you will see how to set the 'playing' state (position\
    \ all graphic elements) after Start button is clicked. You then write the code\
    \ to move the ball to the bottom of the screen, shift man (using a mouse click\
    \ or keyboard key), and check whether man is able to capture the ball. During\
    \ the code development process, you will modify certain procedures repeatedly\
    \ before reaching the final definition.\n\nEvery time the program starts, there\
    \ are several initializations that need to be done. Look at the initializations\
    \ needed in this game. When the program first starts, you naturally want to display\
    \ game instructions. You also need to initialize the game's difficulty level (`Difficulty`)\
    \ and game status (`StatusGame`). This initialization is carried out in the `Load`\
    \ event procedure on the form.\n\nYou declare two form-level variables (`Difficulty`\
    \ and `StatusGame`):\n\n```csharp\nint Difficulty;\nString StatusGame;\n```\n\n\
    ### Step 4\nAdd the following code to the `Load` event procedure from the form:\n\
    \n```csharp\nprivate void FormCatchingBall_Load(object sender, EventArgs e)\n\
    {\n    // Catching Ball Game\n    Difficulty = 1;\n    StatusGame = \"Starting\"\
    ;\n    lblInstruction.Text = \"CATCHING BALL GAME \\n\\n\";\n    lblInstruction.Text\
    \ += \"In this game, you will try to \\n\" + \"catch as many as possible fallen\
    \ ball.\";\n    lblInstruction.Text += \"\\n\\nUse the left and right arrow key\
    \ \" + \"or the left and right mouse buttons to \" + \"move man under the fallen\
    \ ball.\";\n    lblInstruction.Text += \"\\n\\nChoose the game difficulty level\
    \ by pressing \" + \"the left or right mouse button.\";\n    lblInstruction.Text\
    \ += \"\\n\\nClick Start button to start the game.\" + \"\\nClick Stop button\
    \ to stop the game.\";\n    lblDifficulty.Text = Difficulty.ToString();\n}\n```\n\
    \nSave and run the program to see what shown in Figure 6.8.\n\n### Step 5\nThe\
    \ `Difficulty` variable is used to determine how fast the ball falls (the higher\
    \ the difficulty, the higher speed of the ball falls). To change the difficulty,\
    \ the user can click on one of the arrow keys. The code to do so is placed in\
    \ the `Click` event procedure of the `btnLeft` and `btnRight` buttons:\n\n```csharp\n\
    private void btnLeft_Click_1(object sender, EventArgs e)\n{\n    if (StatusGame\
    \ == \"Starting\") // Decreases difficulty level\n    {\n        Difficulty -=\
    \ 1;\n        if (Difficulty < 1)\n            Difficulty = 1;\n        lblDifficulty.Text\
    \ = Difficulty.ToString();\n    }\n}\n\nprivate void btnRight_Click_1(object sender,\
    \ EventArgs e)\n{\n    if (StatusGame == \"Starting\") // Increases difficulty\
    \ level\n    {\n        Difficulty += 1;\n        if (Difficulty > 10)\n     \
    \       Difficulty = 10;\n        lblDifficulty.Text = Difficulty.ToString();\n\
    \    }\n}\n```\n\n![](Image00037.jpg)Figure 6.8 When the program first starts,\
    \ it displays game description and instructions. Save and run program. Make sure\
    \ the arrow keys work correctly. Make sure the difficulty level is between values\
    \ 1 and 10.\n\n![](Image00043.jpg)Figure 6.9 To change the difficulty, the user\
    \ can click on one of the arrow keys.\n\n### Step 6\nAfter the game difficulty\
    \ level is set, the next step is to click on Start button so the game can start.\
    \ So, you need a code to get from the \"Starting\" state to the \"Playing\" state.\
    \ When Start button is clicked on the \"Starting\" state, these steps need to\
    \ be carried out:\n\n*   Change `StatusGame` to \"Playing\".\n*   Clean the screen.\n\
    *   Initialize the score and remaining time.\n*   Place man on the bottom area\
    \ of the screen.\n*   Place bird and ball on the top area of the screen randomly.\n\
    *   Drop ball.\n\nThere is a lot that needs to be done here, you will do it by\
    \ step. First, you will initialize the variables and position man at bottom of\
    \ the screen. Two variables are used to control the game. `RemainingTime` is an\
    \ integer value that tells how much time is left in the game (in milliseconds).\
    \ You choose the game to last, for example, in 60 seconds. `Score` tells how many\
    \ balls caught. `PanelGame` is a graphics region which is place for games. Add\
    \ the following form level declarations:\n\n```csharp\nint RemainingTime;\nint\
    \ Score;\nGraphics PanelGame;\n```\n\nIn the code, you specify width (`ManW`)\
    \ and height (`ManH`). Man is positioned below screen, around middle. `ManX` and\
    \ `ManY` variables tell where man is. `ManDeltaX` is used to tell how far man\
    \ moved by pressing a button or clicking the mouse. All of these variables are\
    \ useful for seeing whether man can catch dropped ball. Add the following form\
    \ level declarations:\n\n```csharp\nint ManW, ManH, ManX, ManY, ManDeltaX;\n```\n\
    \n### Step 7\nAdd this code to the `Click` event procedure from `btnStart` control:\n\
    \n```csharp\nprivate void btnStart_Click(object sender, EventArgs e)\n{\n    //\
    \ Start button clicked\n    StatusGame = \"Playing\";\n    lblInstruction.Visible\
    \ = false;\n    PanelGame = pnlGame.CreateGraphics();\n    PanelGame.Clear(Color.Gold);\
    \ // time/score\n    RemainingTime = 60 * 1000; // milliseconds\n    Score = 0;\n\
    \    DisplayTimeScore();\n    // Man\n    ManW = picMan.Width;\n    ManH = picMan.Height;\n\
    \    ManDeltaX = 10;\n    ManX = 375;\n    ManY = pnlGame.Height - ManH;\n   \
    \ PanelGame.DrawImage(picMan.Image, ManX, ManY);\n}\n```\n\nHere, the panel is\
    \ cleared and the variables are set so that man is positioned below and around\
    \ center of screen. Pay attention to following line of code: `DisplayTimeScore()`.\
    \ This line calls a function that updates the displayed value for `RemainingTime`\
    \ and `Score`. Add this function at the end of your program:\n\n```csharp\nprivate\
    \ void DisplayTimeScore()\n{\n    lblTime.Text = (RemainingTime / 1000).ToString();\n\
    \    lblScore.Text = Score.ToString();\n}\n```\n\n### Step 8\nSave and run the\
    \ program. Select the level of difficulty of the game (for example 3). Click Start\
    \ button to look like the figure below.\n\n![](Image00044.jpg)Figure 6.10 Man\
    \ is positioned below and around center of screen\n\n### Step 9\nThe final initialization\
    \ step is to place bird and ball randomly on the screen. You specify the width\
    \ and height of bird (`BirdW` and `BirdH`) and ball length and height (`BallW`\
    \ and `BallH`). This will help determine whether man caught ball or not. Add the\
    \ following form level declarations:\n\n```csharp\nint BirdW, BirdH, BirdX;\n\
    int BallW, BallH, BallX, BallY;\nRandom MyRandom = new Random();\n```\n\n`BirdX`\
    \ is the x-position of the bird (zero position y, above the screen). Ball has\
    \ position (`BallX`, `BallY`). `MyRandom` is needed for generating random numbers.\n\
    \n### Step 10\nAdd the following modified code to `Click` event procedure of `btnStart`\
    \ control:\n\n```csharp\nprivate void btnStart_Click(object sender, EventArgs\
    \ e)\n{\n    // Start button clicked\n    StatusGame = \"Playing\";\n    lblInstruction.Visible\
    \ = false;\n    PanelGame = pnlGame.CreateGraphics();\n    PanelGame.Clear(Color.Gold);\
    \ // time/score\n    RemainingTime = 60 * 1000; // milliseconds\n    Score = 0;\n\
    \    DisplayTimeScore();\n    // Man\n    ManW = picMan.Width;\n    ManH = picMan.Height;\n\
    \    ManDeltaX = 10;\n    ManX = 375;\n    ManY = pnlGame.Height - ManH;\n   \
    \ PanelGame.DrawImage(picMan.Image, ManX, ManY);\n    // Bird\n    BirdW = picBird.Width;\n\
