    \ this:\n\n```csharp\nconst int Increment = 5;\n\nprivate void FormFightingPlane_KeyDown(object\
    \ sender, KeyEventArgs e)\n{\n    switch (e.KeyCode)\n    {\n        case Keys.A:\n\
