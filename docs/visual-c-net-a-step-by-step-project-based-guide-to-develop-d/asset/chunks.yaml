    \ before the finish line.\n\n*   Two winners are chosen at random.\n\n*   Move\
    \ horses to their final positions.\n\n*   Change StatusGame to \"Start\" before\
    \ another race starts.\n\nTo move a horse, you use the timer control ( timerHorse\
    \ ). With each Tick event, you move each horse as far as a fraction of the difference\
