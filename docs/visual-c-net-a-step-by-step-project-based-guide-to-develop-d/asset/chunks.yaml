    # 教程 3


    ## 银行密码游戏


    在本教程中，你将构建一个“银行密码”游戏。储物箱被锁住，只有输入正确的数字组合时才能打开。数字组合可以是 2 到 4 位不重复的数字（数字范围为 1 到 9）。给出猜测后，系统会通知你有有多少个数字是正确的，以及有多少数字的位置正确。根据这些信息，你将进行下一次猜测。继续猜测，直到获得正确的组合或停止游戏。


    ### 描述


    表单左侧是一个大的图片框控件（PictureBox）。右侧放置了两个组框控件（GroupBox）和两个按钮控件（Button）。在图片框内放置了一个面板控件（Panel）。面板中，有四个标签控件（Label，将
    `AutoSize` 属性设置为 `False`）和九个按钮控件。在第一个组框控件中放置三个单选按钮（RadioButton）。在第二个组框控件中放置一个文本框控件（TextBox）。


    ![](img/Image00017.jpg)

    图 3.1 银行密码项目中使用使用的所有控件


    图片框包含一张银行图片和一个面板。面板中的标签控件用于显示输入的组合（将 `BorderStyle` 属性设置为 `FixedSingle` 以显示标签大小）。面板上的九个按钮用于输入组合。单选按钮用于设置选项。按钮（一个用于开始和停止游戏，另一个用于退出项目）用于控制游戏操作。文本框显示输入组合的结果。


    ![](img/Image00018.jpg)

    图 3.2 用户选择 3 位数字组合并点击“开始游戏”按钮


    ![](img/Image00019.jpg)

    图 3.3 用户猜测三个数字，结果显示在文本框控件上


    运行项目（按 `<F5>`）。游戏将以“停止”状态显示。此时你可以选择 2、3 或 4 位的组合选项。如果你选择 3 位数字组合并点击“开始游戏”按钮，它将如图
    3.2 所示。因为选择了 3 位数字组合选项，所以只显示三个标签用于输入组合。现在你可以通过按下提供的数字键来选择 3 位猜测。选择猜测后，结果将显示在表单右侧的文本框中，如图
    3.3 所示。


    ### 教程步骤


    #### 第一步

    你将开始构建银行密码游戏项目。在 Visual C# 中新建一个项目。建议立即使用你自定义的名称进行保存。这将创建项目所需的文件夹和文件结构。


    #### 第二步

    在表单左侧放置一个大的图片框控件。在右侧放置两个组框控件和两个按钮控件。在图片框中放置一个面板控件。在面板中，放置四个标签控件（将 `AutoSize` 属性设置为
    `False` 以便调整大小）和九个按钮控件。在第一个组框控件中放置三个单选按钮。在第二个组框控件中放置一个文本框控件。现在的表单如图 3.4 所示：


    ![](img/Image00020.jpg)

    图 3.4 表单中使用的所有控件及其位置


    图片框包含一张银行图片和一个面板。面板中的标签控件用于显示输入的组合（将 `BorderStyle` 属性设置为 `FixedSingle` 以显示标签大小）。面板上的九个按钮用于输入组合。单选按钮用于设置选项。按钮（一个用于开始和停止游戏，另一个用于退出项目）用于控制游戏操作。文本框显示输入组合的结果。


    #### 第三步

    使用属性窗口设置控件属性：


    **`Form1` 对象的若干属性**

    | Property | Value |

    | :--- | :--- |

    | Name | `FormBankCode` |

    | Text | `Bank Code` |

    | FormBorderStyle | `FixedSingle` |

    | StartPosition | `CenterScreen` |


    **`PictureBox1` 对象的若干属性**

    | Property | Value |

    | :--- | :--- |

    | Name | `picBank` |

    | Image | `bank3.png` |

    | SizeMode | `StretchImage` |


    **`Panel1` 对象的若干属性**

    | Property | Value |

    | :--- | :--- |

    | Name | `pnlBank` |

    | BackColor | `Light Yellow` |


    **`Label1` 对象的若干属性**

    | Property | Value |

    | :--- | :--- |

    | Name | `lblCombol1` |

    | BackColor | `White` |

    | BorderStyle | `FixedSingle` |

    | Font | `Bold, 18` |

    | Text | `0` |

    | TextAlign | `MiddleCenter` |


    **`Label2` 对象的若干属性**

    | Property | Value |

    | :--- | :--- |

    | Name | `lblCombol2` |

    | BackColor | `White` |

    | BorderStyle | `FixedSingle` |

    | Font | `Bold, 18` |

    | Text | `0` |

    | TextAlign | `MiddleCenter` |


    **`Label3` 对象的若干属性**

    | Property | Value |

    | :--- | :--- |

    | Name | `lblCombol3` |

    | BackColor | `White` |

    | BorderStyle | `FixedSingle` |

