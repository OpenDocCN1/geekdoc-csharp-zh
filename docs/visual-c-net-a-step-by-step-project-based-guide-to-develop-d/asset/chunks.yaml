- fmt: "\n# Horse Racing Game Project\n\n`Labels` are used to display instructions\
    \ and number of horses in a race. Four button controls are used: two buttons to\
    \ change number of horses, one button to start the game, and one other button\
    \ to stop the game. The `picture box` control is used to load the horse image.\
    \ A `timer` control is used to update the horse's movement during the race.\n\n\
    ![](Image00025.jpg)\nFigure 4.1 All controls used in Horse Racing game project\n\
    \nRun the program (press `<F5>`). The game will run in the `'initial'` state.\
    \ The program description and instructions will be displayed. At this point, the\
    \ user can click `Start` button to start the game, click the arrow button to change\
    \ number of horses to be competed or click `Stop` to stop the program.\n\n![](Image00026.jpg)\n\
    Figure 4.2 The Horse Racing game is at initial state showing program description\
    \ and instructions\n\nChange number of horses if you want (for example, 8) by\
    \ clicking the right arrow button under `Number of Horses`. Click `Start` button\
    \ to start the game. Program instructions will disappear. Eight horses will be\
    \ displayed, ready to race:\n\n![](Image00027.jpg)\nFigure 4.3 Eight horses are\
    \ ready to race\n\nIn this situation, the user needs to choose two horses that\
    \ are considered to win the race. To do this, the user only needs to click on\
    \ the desired horses using mouse, and a red X symbol will be displayed next to\
    \ the selected horses, as shown in Figure 4.4.\n\n![](Image00028.jpg)\nFigure\
    \ 4.4 Two red X symbols will appear when user choose two horses guessed to win\
    \ race\n\nThen, the user can click on the `Start` button to start the race. All\
    \ horses race across the screen to reach the finish line:\n\n![](Image00029.jpg)\n\
    Figure 4.5 All horses race to finish line when user clicks Start button\n\n##\
    \ Tutorial Steps\n\n### Step 1\nYou will start building Horse Racing game project.\
    \ Start a new project in Visual Basic. It is recommended that you immediately\
    \ save it with a name that you choose yourself. This will create the folders and\
    \ file structure needed for your project.\n\n### Step 2\nPlace two `panel` controls\
    \ on the form (one `panel` with a width of 100 pixels on the left side, one other\
    \ `panel` with a width of 900 pixels on the right side). Place two `labels` and\
    \ four `buttons` in the left panel. Place a `label` control and a `picture box`\
    \ control in the right panel. Add a `timer` control. The form will now look as\
    \ shown in Figure 4.6.\n\n`Labels` are used to display information. Two `buttons`\
    \ are used to change number of horses, two other buttons to start and stop the\
    \ game. The `timer` control sets the horse's movements.\n\n### Step 3\nSet control\
    \ properties using the Properties window: \n\n**A number of properties of the\
    \ `Form1` object**\n| Property | Value |\n| :--- | :--- |\n| Name | `FormHorseRacing`\
    \ |\n| Text | `Horse Racing` |\n| FormBorderStyle | `FixedSingle` |\n| StartPosition\
    \ | `CenterScreen` |\n\n![](Image00030.jpg)\nFigure 4.6 All controls used in this\
    \ project and their positions\n\n**One of properties of the `Panel1` object:**\n\
    | Property | Value |\n| :--- | :--- |\n| BackColor | `DeepPink` |\n\n**A number\
    \ of properties of the `Label1` object:**\n| Property | Value |\n| :--- | :---\
    \ |\n| AutoSize | `False` |\n| Font | `Bold, 12` |\n| ForeColor | `Yellow` |\n\
    | Text | `Number of Horses` |\n| TextAlign | `MiddleCenter` |\n\n**A number of\
    \ properties of the `Label3` object:**\n| Property | Value |\n| :--- | :--- |\n\
    | AutoSize | `False` |\n| Name | `lblHorse` |\n| Font | `Bold, 12` |\n| ForeColor\
    \ | `White` |\n| Text | `0` |\n| TextAlign | `MiddleCenter` |\n\n**A number of\
    \ properties of the `Button1` object:**\n| Property | Value |\n| :--- | :--- |\n\
    | Name | `btnLeft` |\n| Font Size | `12` |\n| Text | `<` |\n\n**A number of properties\
    \ of the `Button2` object:**\n| Property | Value |\n| :--- | :--- |\n| Name |\
    \ `btnRight` |\n| Font Size | `12` |\n| Text | `>` |\n\n**A number of properties\
    \ of the `Button3` object:**\n| Property | Value |\n| :--- | :--- |\n| Name |\
    \ `btnStart` |\n| Font Size | `12` |\n| Text | `Start` |\n\n**A number of properties\
    \ of the `Button4` object:**\n| Property | Value |\n| :--- | :--- |\n| Name |\
    \ `btnStop` |\n| Font Size | `12` |\n| Text | `Stop` |\n\n**A number of properties\
    \ of the `Panel2` object:**\n| Property | Value |\n| :--- | :--- |\n| Name | `pnlGame`\
    \ |\n| BackColor | `White` |\n\n**A number of properties of the `Label2` object:**\n\
    | Property | Value |\n| :--- | :--- |\n| Name | `lblInstruction` |\n| Font Size\
    \ | `12` |\n\n**A number of properties of the `PictureBox1` object:**\n| Property\
    \ | Value |\n| :--- | :--- |\n| Name | `picHorse` |\n| Image | `horse.png` |\n\
    | SizeMode | `AutoSize` |\n| Visible | `True` |\n\n**A number of properties of\
    \ the `Timer1` object:**\n| Property | Value |\n| :--- | :--- |\n| Name | `timerHorse`\
    \ |\n| Interval | `100` |\n\nYou will now start writing code for this game. You\
    \ will write the code in several stages. As an initial step, you will write the\
    \ code that starts the game and set the initial state. Then, you will see how\
    \ to set the `'stop'` state due to clicking Stop button. Finally, you will write\
    \ the code for the horse race after Start button is clicked. During code development,\
    \ you will modify certain procedures several times before reaching the end.\n\n\
    ### Step 4\nWhenever the user starts the program, there are several initializations\
    \ to be done. You will see what initializations are needed in this project. When\
    \ the program starts, you naturally want to display game instructions. You also\
    \ want to initialize (provide initial values) to `NumberOfHorses` and `StatusGame`.\
    \ This initialization is in the `Load` procedure of the form.\n\n![](Image00031.jpg)\n\
    Figure 4.7 The initialization in the Load procedure of the form\n\nYou declare\
    \ the following three variables (`NumberOfHorses`, `StatusGame`, and `PanelGame`)\
    \ as form level variables:\n\n```csharp\nint NumberOfHorses;\nstring StatusGame;\n\
    Graphics PanelGame;\n\nprivate void FormHorseRacing_Load( object sender, EventArgs\
    \ e) {\n    NumberOfHorses = 3;\n    StatusGame = \"Start\";\n    lblInstruction.Text\
    \ = \"HORSE RACING GAME \\n\\n\";\n    lblInstruction.Text += \"Two horses are\
    \ racing to arrive at the finish line. \\n\" +\n    \"Guess which horse will arrive\
    \ first to the end.\";\n    lblInstruction.Text += \"\\n\\nChoose number of horses\
    \ to race \" +\n    \"by pressing the left button to decrease, \" +\n    \"the\
    \ right button to add.\";\n    lblInstruction.Text += \"\\n\\nClick on the Start\
    \ button to start the game.\";\n    lblInstruction.Text += \"\\n\\nClick on the\
    \ Stop button to end the game.\";\n    lblHorse.Text = NumberOfHorses.ToString();\n\
    \    PanelGame = pnlGame.CreateGraphics();\n}\n```\n\n`NumberOfHorses` are set\
    \ to 3 and `StatusGame` is set to `\" Start \"`. Next, after creating a graphic\
    \ object (`PanelGame`), using a series of statements, you write game instructions\
    \ in `lblInstruction`.\n\n### Step 5\nSave and run the program to see what shown\
    \ in Figure 4.7.\n\n### Step 6\nTo change number of horses, user can click on\
    \ one of the two arrow keys provided. The code to do so is placed in the `Click`\
    \ event procedure of `btnLeft` and `btnRight` :\n"
