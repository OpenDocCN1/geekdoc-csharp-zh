  trans: "\n\n### RadioButton1 对象的若干属性\n\n| Property | Value |\n| :--- | :--- |\n\
    | Name | `rdoTwoDigits` |\n| Text | 2 Digits Combination |\n| Checked | True |\n\
    \n### RadioButton2 对象的若干属性\n\n| Property | Value |\n| :--- | :--- |\n| Name |\
    \ `rdoThreeDigits` |\n| Text | 3 Digits Combination |\n\n### RadioButton3 对象的若干属性\n\
    \n| Property | Value |\n| :--- | :--- |\n| Name | `rdoFourDigits` |\n| Text |\
    \ 4 Digits Combination |\n\n### Button10 对象的若干属性\n\n| Property | Value |\n| :---\
    \ | :--- |\n| Name | `btnStartStop` |\n| Text | Start Game |\n\n### Button11 对象的若干属性\n\
    \n| Property | Value |\n| :--- | :--- |\n| Name | `btnExit` |\n| Text | Exit Game\
    \ |\n\n### GroupBox2 对象的若干属性\n\n| Property | Value |\n| :--- | :--- |\n| Name\
    \ | `grpResult` |\n| Text | Results |\n| BackColor | LightBlue |\n\n### TextBox1\
    \ 对象的若干属性\n\n| Property | Value |\n| :--- | :--- |\n| Name | `textResult` |\n\
    | BackColor | White |\n| MultiLine | True |\n| ReadOnly | True |\n| ScrollBars\
    \ | Vertical |\n\n#### 步骤 4\n当属性设置完成后，表单现在如图 3.5 所示。这完成了表单设计。现在你将开始编写游戏代码。你将在几个步骤中编写代码。第一步，你将编写启动游戏并设置“停止”状态的代码。然后，你将确定如何点击开始按钮将游戏切换到“播放”状态。在代码开发过程中，你将在遇到流程终之前修改多个方法。\n\
    \n![](img/Image00021.jpg) 图 3.5 属性设置完成，你开始编写游戏代码\n\n#### 步骤 5\n每次项目启动时，都需要完成一些初始化工作。你将看到此游戏所需的若干初始化。所有的初始化都放在表单的\
    \ `Load` 事件方法中。为了简化任务，你将创建一个数组来包含用于显示组合的四个控件标签，以及另一个数组来包含用于输入组合值的九个控件按钮。这两个数组定义在表单级：\n\
    \n```cs\nLabel[] Combo = new Label[4];\nButton[] ComboButton = new Button[9];\n\
    ```\n\n#### 步骤 6\n并在表单的 `Load` 事件方法中编写如下赋值：\n\n```cs\nprivate void FormBankCode_Load(\
    \ object sender, EventArgs e)\n{\n    // 禁用 pnlBank 并创建两个数组\n    pnlBank.Enabled\
    \ = false ;\n    Combo[0] = lblCombol1;\n    Combo[1] = lblCombol2;\n    Combo[2]\
    \ = lblCombol3;\n    Combo[3] = lblCombol4;\n    ComboButton[0] = btn1;\n    ComboButton[1]\
    \ = btn2;\n    ComboButton[2] = btn3;\n    ComboButton[3] = btn4;\n    ComboButton[4]\
    \ = btn5;\n    ComboButton[5] = btn6;\n    ComboButton[6] = btn7;\n    ComboButton[7]\
    \ = btn8;\n    ComboButton[8] = btn9;\n}\n```\n当代码进一步开发时，这两个数组的用处将变得明显。\n\n####\
    \ 步骤 7\n在此时，你有两个选择：点击 `btnStop` 按钮或点击 `btnExit` 按钮。退出代码非常简单。将以下代码放在 `btnExit`\
    \ 点击事件中：\n\n```cs\nprivate void btnExit_Click( object sender, EventArgs e)\n{\n\
    }\n```\n\n#### 步骤 8\n`btnStop` 的代码更为复杂。你将分阶段构建它。首先，你将看到如何将游戏从“停止”状态切换到“播放”状态。当用户在“停止”状态下点击\
    \ `btnStop` 按钮时，会发生几操作将游戏切换到“播放”状态：\n\n*   将 `btnStop` 的 `Text` 属性改为“Stop Game”。\n\
    *   禁用 `grpOptions`。\n*   禁用 `btnExit`。\n*   启用 `pnlBank`。\n* 清空 `textResult`。\n\
    *   确定位数。\n\n在表单级声明中添加此行：\n\n```cs\nint NumberOfDigit;\n```\n\n编写实现上述所有步骤的 `btnStop`\
    \ 点击事件代码：\n\n```cs\nprivate void btnStop_Click( object sender, EventArgs e)\n\
    {\n    btnStop.Text = \"Stop Game\" ;\n    grpOptions.Enabled = false ;\n    btnExit.Enabled\
    \ = false ;\n    pnlBank.Enabled = true ;\n    textResult.Text = \"\"\n    //\
    \ 确定位数\n    if (doTwoDigits.Checked)\n    {\n        NumberOfDigit = 2;\n    }\n\
    \    else if (doThreeDigits.Checked)\n    {\n        NumberOfDigit = 3;\n    }\n\
    \    else\n    {\n        NumberOfDigit = 4;\n    }\n    for ( int i = 0; i <\
    \ NumberOfDigit; i++)\n    {\n        Combo[i].Visible = true ;\n        Combo[i].Text\
    \ = \"\" ;\n    }\n    if (NumberOfDigit != 4)\n    {\n        for ( int i = NumberOfDigit;\
    \ i < 4; i++)\n        {\n            Combo[i].Visible = false ;\n        }\n\
    \    }\n}\n```\n\n注意标签控件数组 (`Combo`) 是如何用于显示组合所需的标签控件的。\n\n#### 步骤 9\n保存并运行项目。点击开始游戏按钮，选择三位组合选项，游戏将切换到“播放”状态，如图\
    \ 3.6 所示。确保显示的标签框数量根据所选的位数组合选项。注意，停止游戏按钮目前没有任何作用。你稍后会修复它。\n\n![](img/Image00018.jpg)\
    \ 图 3.6 显示的标签框数量取决于选的位数选项\n\n#### 步骤 10\n当用户在“播放”状态下点击停止游戏按钮时，必须执行若干操作将游戏切换到“停止”状态：\
    \ \n\n*   将 `btnStartStop` 的 `Text` 属性改为“Start Game”。\n*   启用 `grpOptions`。\n\
    *   启用 `btnExit`。\n*   启用 `pnlBank`。\n\n"
