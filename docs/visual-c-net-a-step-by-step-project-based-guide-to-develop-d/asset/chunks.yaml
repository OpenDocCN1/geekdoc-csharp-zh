    \ is displayed, as shown in Figure 7.14. At this point, the user has the option\
    \ to start a new game, change options or exit the program.\n\n### Step 20\n\n\
    You need the capability to move player up and down the graphics region. If you\
    \ choose to use the keyboard to control, use the `KeyDown` event. This event is\
    \ the same as the `KeyPress` event that has been used before, but is more flexible.\
    \ This event can be used to detect keys that are pressed, along with control keys\
    \ such as Alt, Ctrl, Shift, cursor control, and other control keys. The form of\
    \ the `KeyDown` event procedure of form is:\n\n```csharp\nprivate void FormFightingPlane_KeyDown(object\
    \ sender, KeyEventArgs e){}\n```\n\nThe `KeyCode` property is a member of the\
    \ `Keys` class. There are a number of values for each key that can be pressed.\
    \ The Intelliense feature of the Visual C# IDE will provide `KeyCode` values when\
    \ needed. `KeyDown` event generally have a `Select Case` structure with a `Case`\
    \ clause for each possible key (or key combination). In this game, you choose\
    \ the following keys to control the player's movement and to throw rudal (selected\
    \ from the keyboard):\n\n- **Player 1**: A – Up, Z – Down, S – Throw rudal\n-\
