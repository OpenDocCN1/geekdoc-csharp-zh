    # 教程 6：智能井井棋


    在本教程中，你将构建一个智能井井棋游戏。需要说明的是，这是首个在计算机上编写的游戏，是由比尔·盖茨（Bill Gates）在青少年时期于就读于西雅图湖畔中学期间亲自编写的。该游戏的目标是在
    3x3 的网格上，通过水平、对角线或垂直线上的三个相同符号（X 或 O）来获胜。玩家将交替进行。游戏提供了两个选项：玩家 1 对战玩家 2，或者人类对战电脑。我们将开发一种智能但简单的计算机逻辑，使其成为人类的强大对手。


    ## 描述


    运行项目（按 `<F5>`）。游戏将显示为“停止”状态，网格将被清空并等待你选择游戏选项（单双玩家；如果是单玩家，则选择谁先手以及电脑对抗的智能程度）。


    ![](img/Image00052.jpg) 图 6.1 智能井井棋游戏项目中使用的所有控件

    ![](img/Image00053.jpg) 图 6.2 游戏处于“停止”状态


    你可以选择双玩家选项并点击“开始游戏”按钮：

    ![](img/Image00054.jpg) 图 6.3 用户选择双玩家选项


    此外，你可以选择单玩家选项，并随机电脑或智能电脑对手：

    ![](img/Image00055.jpg) 图 6.4 用户选择单玩家选项


    ## 教程步骤


    ### 步骤 1

    你将构建一个智能井井棋游戏项目。在 Visual C# 中新建一个项目。一旦创建，建议立即使用你选择的名称保存项目。这将创建项目所需的文件夹和文件结构。


    ![](img/Image00056.jpg) 图 6.5 所有控件及其位置布局


    你需要在表单左侧放置 14 个 `label` 控件（将 `AutoSize` 属性设置为 `False` 以便更改大小，并将 `BorderStyle`
    属性临时设置为 `FixedSingle` 以查看边框）。在表单右侧放置三个 `group boxes`，以及两个控制按钮。在每个分组框中放置两个 `radio
    button` 控件。表单外观将如图 6.5 所示。`Label` 控件用于显示消息、显示符号（X 和 O）以及形成网格。`radio buttons` 用于设置游戏选项。按钮（一个用于开始，一个用于结束）用于控制游戏操作。


    ### 步骤 2

    使用属性窗口设置控件属性：


    #### `Form1` 对象的属性：

    | 属性 | 值 |

    | :--- | :--- |

    | Name | `FormTicTacToe` |

    | BackColor | `White` |

    | Text | `Smart Tic Tac Toe` |

    | FormBorderStyle | `FixedSingle` |

    | StartPosition | `CenterScreen` |


    #### `Label1` 对象的属性：

    | 属性 | 值 |

    | :--- | :--- |

    | Name | `lblMessage` |

    | AutoSize | `False` |

    | BackColor | `Crimson` |

    | ForeColor | `White` |

    | BorderStyle | `Fixed3D` |

    | Font | `Bold, 24` |

    | Text | `X’s Turn` |

    | TextAlign | `MiddleCenter` |


    #### `Label2` 到 `Label10` 对象的属性 (`lblBox1` 到 `lblBox9`)：

    这些标签共享以下属性：

    - `AutoSize`: `False`

    - `BorderStyle`: `None`

    - `Font Size`: `48`

    - `Text`: `X`

    - `TextAlign`: `MiddleCenter`


    #### `Label11` 到 `Label14` 对象的属性 (`lbl11` 到 `lbl14`)：

    这些标签共享以下属性：

    - `AutoSize`: `False`

    - `BackColor`: `Orange`

    - `BorderStyle`: `None`

    - `Text`: `[Empty]` |


    #### `GroupBox1` 对象的属性：

    | 属性 | 值 |

    | :--- | :--- |

    | Name | `grpPlayer` |

    | BackColor | `DeepPink` |

    | Text | `[Empty]` |


    #### `RadioButton1` 和 `RadioButton2` 对象的属性：

    | 属性 | 值 |

    | :--- | :--- |

    | Name | `rdoTwoPlayers`, `rdoOnePlayer` |

    | ForeColor | `White` |

    | Font Size | `9` |

    | Text | `Two Players`, `One Player` |

    | Checked | `True` |


    #### `GroupBox2` 对象的属性：

    | 属性 | 值 |

    | :--- | :--- |

    | Name | `grpFirst` |

    | BackColor | `DeepPink` |

    | Text | `[Empty]` |


