    \    }\n        }\n        else if (i <= 2)\n        {\n            SendKeys.Send(\"\
    K\"); // Moves up\n        }\n        else\n        {\n            SendKeys.Send(\"\
    M\"); // Moves down\n        }\n    }\n    else\n    {\n        if (Math.Abs(Player1.Location.Y\
