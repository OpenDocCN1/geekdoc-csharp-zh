    \ 用完为止，都会播放游戏结束的声音。\n\n### 第 44 ：电脑 AI\n你当然可以找一个伙伴来玩游戏。那么在单人模式下让电脑成为你的对手呢？为了控制电脑，你需要制定规则。你可以使用简单的逻辑，这会让人类很容易赢。或者，你可以编写非常详细的逻辑，这将击败人类大脑。在游戏中，你将采取两种方法。你首先通过随机游戏开发简单逻辑。然后，你使用选择的难度级别来决定使用随机逻辑和详细逻辑的频率。所选值如下：\n\
    \n| 难度级别 | 简单逻辑 (%) | 详细逻辑 (%) |\n| :--- | :--- | :--- |\n| 简单 | 100 | 0 |\n|\
    \ 中等 | 75 | 25 |\n| 困难 | 50 | 50 |\n| 最困难 | 25 | 75 |\n\n所以，当选择简单级别时，你在游戏期间使用了\
    \ 100% 的简单逻辑。当选择最困难级别时，你使用了 75% 的详细逻辑（你不可能让电脑变得太聪明，否则人类会一直输）和 25% 的简单逻辑。电脑的移动将由一个独立的计时器（`timComputer`）控制。对于更容易的游戏，你会为该计时器创建一个更大的\
    \ `Interval` 值。这将减慢电脑的处理。这里的间隔值如下：\n\n| 难度级别 | 间隔值 |\n| :--- | :--- |\n| 简单 |\
    \ 1000 |\n| 中等 | 750 |\n| 困难 | 500 |\n| 最困难 | 250 |\n\n因此在困难难度下，电脑移动的频率比选择简单难度时快四倍。你将使用整数变量（`RandComputer`）来代表简单逻辑时间的百分比，并使用整数变量（`TimeComputer`）来代表计时器的\
    \ `Interval` 属性。在 `rdoDifficulty` 的 `Click` 事件过程中为这两个新变量赋值。修改后的过程代码如下：\n\n```csharp\n\
    int RandComputer, TimeComputer;\n```\n\n"
