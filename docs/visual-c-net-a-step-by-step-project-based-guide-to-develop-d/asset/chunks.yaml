    保存并运行项目。现在，如果用户发射导弹并击中另一个玩家，导弹将消失，但玩家仍然存在。你现在可以尝试一下：\n![](img/Image00082.jpg)\n\
    *图 7.18 用户发射导弹并击中另一个玩家，导弹将消失，但玩家仍然存在。*\n\n### 第 33 步\n按照设计，玩家除了上下移动的能力外，对导弹没有任何保护。你将改变这一点。你将在创建在游戏场中巡游的\
    \ UFO。这个 UFO 将停止发射的导弹。你有两个 UFO，每个由一个 `MovingRudal` 对象表示。它们的移动是随机的，限制较少。在表单中添加以下类级声明来声明\
