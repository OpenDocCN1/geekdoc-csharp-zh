    \ 10,                (HorseClicked - 1) * 60 + 20, 40,                (HorseClicked\
    \ - 1) * 60 + 50);            PanelGame.DrawLine(Pens.Red, 10,               \
    \ (HorseClicked - 1) * 60 + 50, 40,                (HorseClicked - 1) * 60 + 20);      \
    \ }    }} &#124;\n\n |\n\n| Step 12 | Save and run the program. Set number of\
