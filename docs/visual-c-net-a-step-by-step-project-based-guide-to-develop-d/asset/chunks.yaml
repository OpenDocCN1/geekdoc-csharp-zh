    \n### 步骤 15\n你将在项目中会有多个动画图像（玩家、导弹和 UFO）。这是一个测试面向对象编程技能的好地方。你将构建一个名为 `TwoPlayer`\
    \ 的类来表示两个玩家对象及其默认构造函数：\n\n```csharp\nclass TwoPlayer\n{\n    public TwoPlayer\
    \ ()\n    {\n    }\n}\n```\n\n![](img/Image00076.jpg) 图 7.12 最后选择的选项保存在表单中。你将使用三个属性来描述一个\
    \ `TwoPlayer` 对象：`MyImage`（`Image` 数据类型）、`Location`（描述大小和位置的 `Rectangle` 类型）以及\
    \ `IsVisible`（告知对象是否可见的布尔类型）。将这些声明添加到类文件中，并将 `IsVisible` 初始化为 False：\n\n```csharp\n\
    class TwoPlayer\n{\n    public TwoPlayer ()\n    {\n    }\n    public Image MyImage;\n\
    \    public Rectangle Location;\n    public bool IsVisible = false;\n}\n```\n\n\
    ### 步骤 16\n你将通过添加几个方法来扩展类定义，以帮助完成动画工作。使用类方法是为了让对象能够执行某些任务。该方法被写为 Visual C# 方法。你将为\
    \ `TwoPlayer` 对象编写三个方法：一个方法将其放置在图形对象上，一个方法将其移动到新位置，另一个方法将其移除。这三个方法被添加到类定义中，就像当方法被添加到表单代码文件中一样。要向类描述中添加方法，你需要选择作为返回值的信息的名称和数据类型。此外，你还需要指定方法所需的参数。\n\
    \n`Place` 方法将 `TwoPlayer` 对象放置到名为 `g` 的图形对象中（作为参数传递）：\n\n```csharp\npublic void\
    \ Place(Graphics g)\n{\n    g.DrawImage(this.MyImage, this.Location);\n    this.IsVisible\
    \ = true;\n}\n```\n\n注意使用 `this` 来引用当前对象。在对象放置在 `g` 上之后，你将 `IsVisible` 属性设置为 True。\"\
    Move` 方法将 `TwoPlayer` 对象移动到新位置。需要的参数是 `g`（`Graphics` 对象）、`bc`（用于删除之前位置的 `Brush`\
    \ 对象）、`dx`（x 轴变化）和 `dy`（y 轴变化）：\n\n```csharp\npublic void Move(Graphics g, Brush\
    \ bc, int dx, int dy)\n{\n    g.FillRectangle(bc, this.Location);\n    this.Location.X\
    \ += dx;\n    this.Location.Y += dy;\n    g.DrawImage(this.MyImage, this.Location);\n\
    }\n```\n\n对象首先被删除。然后更新位置并重绘对象。`Remove` 方法从图形对象中移除 `TwoPlayer` 对象（使用 `bc`）：\n\n\
    ```csharp\npublic void Remove(Graphics g, Brush bc)\n{\n    g.FillRectangle(bc,\
    \ this.Location);\n    this.IsVisible = false;\n}\n```\n\n将这三个方法（`Place`、`Move`、`Remove`）添加到\
