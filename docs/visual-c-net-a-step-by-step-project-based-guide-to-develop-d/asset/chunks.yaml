  trans: "\n\n注意，如果用户尚未开始游戏（即如果 `btnGame` 仍显示“New Game”），则不允许发生 `KeyDown` 事件。请将此过程添加到你的项目。。你需要确保\
    \ `form` 始终拥有焦点，以便拦截移动玩家的按键。为了万无一失，请在用于启动新游戏的 `btnGame` 的 `Click` 过程末尾添加此行：`this.Focus()`![](img/Image0079.jpg)图\
    \ 7.15 现在两个玩家都可以上下移动。\n\n### 步骤 21\n保存并运行项目。在 `grpPlayer` 中选择 `Two` 选项，以便查看两个玩家是否都能移动。点击\
    \ `New Game`。按下 `A` 和 `Z` 移动玩家 1，按下 `K` 和 `M` 移动玩家 2。确保两个玩家都不会超出控制面板的上限或下限界限，如图\
    \ 7.15 所示。\n\n### 步骤 22\n在这个项目中，你将赋予玩家互相发射导弹的能力。导弹将像玩家一样用 `Image` 对象表示。这里唯一的区别是，当导弹发射时，它将在预定速度下无需用户交互即可移动，并且其位置由计时器控制更新。而且，你需要不断检查导弹是否与另一个物体碰撞。`TwoPlayer`\
    \ 类没有速度属性，也没有检查碰撞的方法。因此，你需要一个新类来定义导弹。\n\n你将使用 `MovingRudal` 类来解释导弹。该类将拥有来自 `TwoPlayer`\
    \ 类的属性和方法（使用继承），加上速度属性和一个检查碰撞的方法。要构建此类，你可以从零开始，编写所有新属性和新方法。或者，你可以利用面向对象编程中的继承概念。继承是一种通过添加类自身的属性和/或方法来构建以现有类为基础的类的概念。这将节省工作量。\n\
    \n你将看到继承是如何使用的。你稍后会添加碰撞检查方法。现在，只需关注类属性。向项目中添加一个类，将其命名为 `MovingRudal`。使用以下类代码：\n\
    \n```csharp\nclass MovingRudal : TwoPlayer{\n    public MovingRudal ()\n    {\n\
    \    }\n    public int XSpeed;\n    public int YSpeed;\n}\n```\n\n这将使 `TwoPlayer`\
    \ 类的所有属性和方法对新类（`MovingRudal`）可用。其他代码行增加了速度属性（`XSpeed` 是水平方向的速度；`YSpeed` 是垂直方向的速度）。这两个属性代表了\
    \ `MovingRudal` 在特定方向上移动的距离。\n\n### 步骤 23\n导弹由两个 `MovingRudal` 对象表示（`Rudal1` 是玩家\
    \ 1 发射的导弹，而 `Rudal2` 是玩家 2 发射的导弹）。水平速度由导弹速度常数决定，垂直速度为零。向你的项目添加以下类级的声明：\n\n```csharp\n\
    MovingRudal Rudal1, Rudal2;\nconst int RudalSpeed = 30;\n```\n\n速度是另一个你可以根据自己喜好使用你认为最佳的值自行更改的参数。\n\
    \n### 步骤 24\n雪球在表单的 `Load` 过程中创建。向该过程添加以下四行代码（在指定 `TwoPlayer` 对象的代码之后）：\n\n```csharp\n\
    private void FightingPlane_Load(object sender, EventArgs e) {\n    try {\n   \
    \     StreamReader fileInput = new StreamReader(Application.StartupPath + \"\\\
    \\plane.ini\");\n        NumberOfPlayer = Convert.ToInt32(fileInput.ReadLine());\n\
    \        Difficulty = Convert.ToInt32(fileInput.ReadLine());\n        fileInput.Close();\n\
    \    }\n    catch {\n        NumberOfPlayer = 1;\n        Difficulty = 1;\n  \
    \  }\n    // 使表单可见以便点击选项\n    this.Show();\n    pnlOption.Visible = true;\n  \
    \  if (Difficulty == 1)\n        rdoEasiest.PerformClick();\n    else if (Difficulty\
    \ == 2)\n        rdoEasy.PerformClick();\n    else if (Difficulty == 3)\n    \
    \    rdoHard.PerformClick();\n    else\n        rdoHardest.PerformClick();\n \
    \   if (NumberOfPlayer == 1)\n        rdoOnePlayer.PerformClick();\n    else\n\
    \        rdoTwoPlayers.PerformClick();\n    pnlOption.Visible = false;\n    Player1Rem\
    \ = RudalMax;\n    Player2Rem = RudalMax;\n    lblRemPlayer1.Text = Player1Rem.ToString();\n\
    \    lblRemPlayer2.Text = Player2Rem.ToString();\n    // 创建 TwoPlayer 对象\n   \
    \ MyGraphics = pnlGame.CreateGraphics();\n    MyBrush = new SolidBrush(pnlGame.BackColor);\n\
    \    Player1 = new TwoPlayer();\n    Player2 = new TwoPlayer();\n    Player1.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\bomber1.png\");\n    Player2.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\bomber2.png\");\n    Rudal1\
    \ = new MovingRudal();\n    Rudal2 = new MovingRudal();\n    Rudal1.MyImage =\
    \ Image.FromFile(Application.StartupPath + \"\\\\rudal1.png\");\n    Rudal2.MyImage\
    \ = Image.FromFile(Application.StartupPath + \"\\\\rudal2.png\");\n    btnGame.Focus();\n\
    }\n```\n\n### 步骤 25\n玩家 1 通过按下 `S` 键发射导弹。玩家 2 通过按下 `J` 键发射导弹。你为发射设置了一些规则。首先，你允许每个玩家在屏幕上显示一个导弹。其次，如果玩家导弹完了，则无法发射。当满足这些条件时，玩家发射导弹，将执行以下步骤：\n\
    \n* 减少剩余导弹数。\n* 更新剩余导弹。\n* 将导弹置于玩家旁边（玩家 1 的右侧，玩家 2 的左侧）。\n* 使用 `TwoPlayer` 类的\
    \ `Place` 方法放置导弹。\n\n发射导弹的代码位于现有的 `KeyDown` 事件过程中。以下是修改后的代码：\n\n```csharp\nprivate\
    \ void FightingPlane_KeyDown(object sender, EventArgs e) {\n    if (btnGame.Text\
    \ == \"New Game\")\n        return;\n    switch (e.KeyCode) {\n        case Keys.A:\n\
    \            Player1.Move(MyGraphics, MyBrush, 0, -Increment);\n            if\
    \ (Player1.Location.Y < 0)\n                Player1.Location.Y = 0;\n        \
    \    break;\n        case Keys.Z:\n            Player1.Move(MyGraphics, MyBrush,\
    \ 0, Increment);\n            if (Player1.Location.Y > pnlGame.ClientSize.Height)\n\
    \                Player1.Location.Y = pnlGame.ClientSize.Height - Player1.Height;\n\
    \            break;\n        case Keys.S:\n            if (!Rudal1.IsVisible &&\
    \ Player1Rem > 0) {\n                Player1Rem--;\n                lblRemPlayer1.Text\
    \ = Player1Rem.ToString();\n                Rudal1.Location = new Rectangle(Player1.Location.X\
    \ + Player1.Location.Width, Player1.Location.Y, Rudal1.MyImage.Width, Rudal1.MyImage.Height);\n\
    \                Rudal1.Place(MyGraphics);\n            }\n            break;\n\
    \        case Keys.K:\n            Player2.Move(MyGraphics, MyBrush, 0, -Increment);\n\
    \            if (Player2.Location.Y < 0)\n                Player2.Location.Y =\
    \ 0;\n            break;\n        case Keys.M:\n            Player2.Move(MyGraphics,\
    \ MyBrush, 0, Increment);\n            if (Player2.Location.Y > pnlGame.ClientSize.Height)\n\
    \                Player2.Location.Y = pnlGame.ClientSize.Height - Player2.Height;\n\
    \            break;\n        case Keys.J:\n            if (!Rudal2.IsVisible &&\
    \ Player2Rem > 0) {\n                Player2Rem--;\n                lblRemPlayer2.Text\
    \ = Player2Rem.ToString();\n                Rudal2.Location = new Rectangle(Player2.Location.X\
    \ - Player2.Location.Width, Player2.Location.Y, Rudal2.MyImage.Width, Rudal2.MyImage.Height);\n\
    \                Rudal2.Place(MyGraphics);\n            }\n            break;\n\
    \    }\n}\n```\n\n"
- fmt: "\n### Step 26\nSave and run the project. Now, after the user presses `S` key\
    \ and `J` key, the two rudals are displayed.\n![](Image00080.jpg)\n*Figure 7.16\
    \ The two rudals appear when user press `J` and `K` keys*\n\n### Step 27\nOnce\
    \ fired, the movement or displacement of the rudal is updated by the `timGame`\
    \ control. You need the `Click` event code of `btnGame` to enable the timer (when\
    \ a `New Game` is clicked) and to stop the timer (when `Stop Game` is clicked).\
    \ You also need to clear the rudal when the `Stop Game` is clicked. A modified\
    \ version of the `Click` procedure of `btnGame` is given as follows:\n\n```csharp\n\
    private void btnGame_Click( object sender, EventArgs e)\n{\n    if (btnGame.Text\
    \ == \"New Game\")\n    {\n        MyGraphics.Clear(pnlGame.BackColor);\n    \
    \    btnGame.Text = \"Stop Game\";\n        btnOption.Enabled = false;\n     \
    \   btnExit.Enabled = false;\n        Player1Hit = 0;\n        Player2Hit = 0;\n\
    \        lblHitPlayer1.Text = \"0\";\n        lblHitPlayer2.Text = \"0\";\n  \
    \      Player1Rem = RudalMax;\n        Player2Rem = RudalMax;\n        lblRemPlayer1.Text\
    \ = Player1Rem.ToString();\n        lblRemPlayer2.Text = Player2Rem.ToString();\n\
    \        Player1.Location = new Rectangle(5, (int)(0.5 * pnlGame.ClientSize.Height\
    \ - 0.5 * Player1.MyImage.Height), Player1.MyImage.Width, Player1.MyImage.Height);\n\
    \        Player2.Location = new Rectangle(pnlGame.ClientSize.Width - Player2.MyImage.Width\
    \ - 5, (int)(0.5 * pnlGame.ClientSize.Height - 0.5 * Player2.MyImage.Height),\
    \ Player2.MyImage.Width, Player2.MyImage.Height);\n        Player1.Place(MyGraphics);\n\
    \        Player2.Place(MyGraphics);\n        timGame.Enabled = true;\n       \
    \ this.Focus();\n    }\n    else\n    {\n        timGame.Enabled = false;\n  \
    \      Player1.Remove(MyGraphics, MyBrush);\n        Player2.Remove(MyGraphics,\
    \ MyBrush);\n        Rudal1.Remove(MyGraphics, MyBrush);\n        Rudal2.Remove(MyGraphics,\
    \ MyBrush);\n        btnGame.Text = \"New Game\";\n        btnOption.Enabled =\
    \ true;\n        btnExit.Enabled = true;\n        MyGraphics.DrawString(\"Game\
    \ Over\", new Font(\"Arial\", 24), Brushes.Yellow, 530, 210);\n    }\n}\n```\n\
    \n### Step 28\nIn the `Tick` event procedure `timGame`, you update the position\
    \ of the rudal using horizontal speed value and `Move` method. You also check\
    \ whether rudal is past the edge of the panel. If so, you need to delete it from\
    \ the panel to allow another throw. You also check the end of the game (both players\
    \ are out of rudals and both players are not visible). When the game ends, `btnGame`\
    \ button will be clicked:\n\n```csharp\nprivate void timGame_Tick( object sender,\
    \ EventArgs e)\n{\n    // status of rudal fired by player 1\n    if (Rudal1.IsVisible)\n\
    \    {\n        Rudal1.Move(MyGraphics, MyBrush, RudalSpeed, 0);\n        if (Rudal1.Location.X\
    \ > pnlGame.ClientSize.Width)\n        {\n            // past the edge of the\
    \ panel\n            Rudal1.Remove(MyGraphics, MyBrush);\n        }\n    }\n \
    \   // status of rudal fired by player 2\n    if (Rudal2.IsVisible)\n    {\n \
    \       Rudal2.Move(MyGraphics, MyBrush, -RudalSpeed, 0);\n        if (Rudal2.Location.X\
    \ < 0)\n        {\n            // past the edge of the panel\n            Rudal2.Remove(MyGraphics,\
    \ MyBrush);\n        }\n    }\n    // Checks game status\n    if (!Rudal1.IsVisible\
    \ && Player1Rem == 0 && !Rudal2.IsVisible && Player2Rem == 0)\n    {\n       \
    \ btnGame.PerformClick();\n    }\n}\n```\nAdd this procedure to your project.\
    \ In the code, you select the `Interval` property of the timer control by 50 milliseconds.\
    \ This is a parameter that you can change as like.\n\n### Step 29\nSave and run\
    \ project. Make sure you still use the two player option. Click `New Game`. Click\
    \ the `S` and `J` keys to throw rudal. Make sure the labels reflect the exact\
    \ value of the remaining rudals. If rudal hits the player, the player's graphics\
    \ will disappear. To bring it up again press one of the keys that move it up and\
    \ down the panel, as shown in Figure 7.17.\n\n### Step 30\nIf rudal is fired at\
    \ or hits a player, another player will get point (a hit). You need a way to check\
    \ for such collision. Because rectangular region defines moving object here, you\
    \ need to know what two rectangular regions intersect. In Visual C#, this test\
    \ can be performed using `IntersectsWith` method of `Rectangle` structure. To\
    \ see whether the two rectangular regions (`Rectangular1` and `Rectangular2`)\
    \ intersect, you need to check the Boolean value of `Rectangular1.IntersectsWith(Rectangular2)`.\
    \ If the value is `True`, then an intersection or collision occurs. If `False`,\
    \ then there is no collision.\n![](Image00081.jpg)\n*Figure 7.17 Both players\
    \ now throw rudal at each other*\n\nTo use it on this project, you will add a\
    \ method `Collide` to `MovingRudal` class. Open `MovingRudal.cs` file and add\
    \ the following change:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Drawing;\n\
    \nnamespace FiringRudal\n{\n    class MovingRudal : TwoPlayer\n    {\n       \
    \ public MovingRudal ()\n        {\n        }\n        public int XSpeed;\n  \
    \      public int YSpeed;\n        public bool Collide(Rectangle r)\n        {\n\
    \            return this.IntersectsWith(r);\n        }\n    }\n}\n```\nThis method\
    \ has a rectangular argument (`r`) for checking collision on the `MovingRudal`\
    \ object. As an example of using this method, you can check whether `Rudal1` collides\
    \ with `Player2`. The resulting Boolean value: `Rudal1.Collide(Player2)` will\
    \ be `True` if a collision occurs. If a collision occurs, you need to clear the\
    \ rudal and update the thrower's score.\n\n### Step 31\nYou check for collision\
    \ between rudal and player in the `Click` event procedure of `timGame`. Modified\
    \ code for checking collision and updating score are given as follows:\n\n```csharp\n\
    private void timGame_Tick( object sender, EventArgs e)\n{\n    // status of rudal\
    \ fired by player 1\n    if (Rudal1.IsVisible)\n    {\n        Rudal1.Move(MyGraphics,\
    \ MyBrush, RudalSpeed, 0);\n        if (Rudal1.Location.X > pnlGame.ClientSize.Width)\n\
    \        {\n            // past the edge of the panel\n            Rudal1.Remove(MyGraphics,\
    \ MyBrush);\n        }\n        else if (Rudal1.Collide(Player2.Location))\n \
    \       {\n            Player1Hit++;\n            lblHitPlayer1.Text = Player1Hit.ToString();\n\
    \            Rudal1.Remove(MyGraphics, MyBrush);\n        }\n    }\n    // status\
    \ of rudal fired by player 2\n    if (Rudal2.IsVisible)\n    {\n        Rudal2.Move(MyGraphics,\
    \ MyBrush, -RudalSpeed, 0);\n        if (Rudal2.Location.X < 0)\n        {\n \
    \           // past the edge of the panel\n            Rudal2.Remove(MyGraphics,\
    \ MyBrush);\n        }\n        else if (Rudal2.Collide(Player1.Location))\n \
    \       {\n            Player2Hit++;\n            lblHitPlayer2.Text = Player2Hit.ToString();\n\
    \            Rudal2.Remove(MyGraphics, MyBrush);\n        }\n    }\n    // Checks\
    \ game status\n    if (!Rudal1.IsVisible && Player1Rem == 0 && !Rudal2.IsVisible\
    \ && Player2Rem == 0)\n    {\n        btnGame.PerformClick();\n    }\n}\n```\n\
    \n### Step 32\nSave and run project. Now if user fires rudal and hits another\
    \ player, the rudal will disappear, but the player remains. You can now try it:\n\
    ![](Image00082.jpg)\n*Figure 7.18 User fires rudal and hits another player, the\
    \ rudal will disappear, but the player remains.*\n\n### Step 33\nAs designed,\
    \ the players have no protection from rudal except for their ability to go up\
    \ and down. You will change it. You will create two ufos roaming the playing field.\
    \ This ufo will stop rudal fired. You will have two ufos, each represented by\
    \ a `MovingRudal` object (`Ufo1` and `Ufo2`). The movements will be random, with\
    \ few restrictions. Add the following form level declarations to your form to\
    \ declare ufo objects and random number object:\n\n```csharp\nMovingRudal Ufo1,\
    \ Ufo2;\nRandom MyRandom = new Random();\n```\n"
