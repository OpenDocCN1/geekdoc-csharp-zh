    J\"); // 发射导弹\n            }\n        }\n        else if (i <= 2)\n        {\n\
    \            SendKeys.Send(\"K\"); // 向上\n        }\n        else\n        {\n\
    \            SendKeys.Send(\"M\"); // 向下\n        }\n    }\n    else\n    {\n\
