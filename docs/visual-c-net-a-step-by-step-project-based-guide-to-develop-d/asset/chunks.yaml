    \ SendKeys.Send( \"J\" ); // Fires rudal        }        else if (i <= 2)           \
    \ SendKeys.Send( \"K\" ); // Moves up        else            SendKeys.Send( \"\
    M\" ); // Moves down    }    else    {        if (Math.Abs(Player1.Location.Y\
    \ - Player2.Location.Y) <            ( int )(0.8 * Player1.MyImage.Height) &&\
    \ Player2Rem >=            Player1Rem)            SendKeys.Send( \"J\" ); // Fires\
    \ rudal        if (Rudal1.IsVisible &#124;&#124; Player2Rem == 0)        {           \
    \ if (Player1.Location.Y - Player2.Location.Y < 0)                SendKeys.Send(\
    \ \"M\" ); // Moves up            else                SendKeys.Send( \"K\" );\
    \ // Moves down        }        else        {            if (Player1.Location.Y\
    \ - Player2.Location.Y < 0)                SendKeys.Send( \"K\" ); // Moves up           \
    \ else                SendKeys.Send( \"M\" ); // Moves down        }    }} &#124;\n\
