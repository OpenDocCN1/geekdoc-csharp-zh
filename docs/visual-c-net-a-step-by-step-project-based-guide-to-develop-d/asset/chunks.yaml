    \ You will start with a simple random rule. In this rule, the computer will only\
    \ move up and down in the game field, and occasionally throw rudal. The only non-random\
    \ element added is that the computer can only throw rudal if it has at least as\
    \ many rudals as the player has. This is to prevent the computer from firing all\
    \ the rudals and becoming an easy target for human. The rules used are:\n\n* \
    \  Generate a random value from 0 to 4.\n*   If the random value is 0, throw rudal,\
    \ if computer has at least as many as the remaining rudals owned by the player.\n\
    *   If the random value is 1 or 2, move up.\n*   If the random value is 3 or 4,\
    \ make down.\n\nWith this rule, rudals are fired one by one in five up or down\
    \ movements. The computer will move up 2 movements of 5 movements and move down\
    \ 2 movements from 5 movements. In detailed (smart) logic game rules, you only\
    \ need to think about how you want to win the game. The smart rule is to throw\
    \ if other players are \"within a certain range\". And, avoid human player if\
    \ he fires rudal. In the rules given here, \"in range\" means that the vertical\
    \ difference between two players is not more than 80 percent of the player's height:\n\
    \n*   If it is \"in range\" and the computer has at least as many rudals as the\
    \ player has, the computer will throw rudal.\n*   If the human player fires rudal\
    \ or the computer no longer has the remaining rudals, the computer will make a\
    \ defensive move: If human player is above the computer player, the computer will\
    \ move down; If the human player is below the computer player, the computer will\
    \ move up.\n*   Otherwise, the computer will make an attacking move: If the human\
    \ player is above the computer player, the computer will move up; If the human\
    \ player is below the computer player, the computer will move down.\n\nNote that\
    \ the computer only throws rudal if it has at least as many rudals as the player.\
    \ You certainly don't want the computer to run out. Before writing this, you need\
    \ to overcome the problem of how you make player, move up, or move down. Fortunately,\
    \ `SendKeys` can be used. The `timComputer` event logic is given as follows:\n\
    \n```csharp\nprivate void timComputer_Tick(object sender, EventArgs e)\n{\n  \
    \  int i;\n    if (MyRandom.Next(100) < RandComputer)\n    {\n        i = MyRandom.Next(5);\n\
