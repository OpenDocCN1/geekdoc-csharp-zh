    # TUTORIAL 3


    ## BANK CODE


    In this tutorial, you will build Bank Code game. The storage box is locked and
    can only be opened if you enter the correct digit combination. Combinations can
    be 2 to 4 non-repetitive digits (range of digits from 1 to 9). After a guess is
    given, you will be notified of how many digits are right and how many digits are
    in the right position. Based on this information, you will give another guess.
    You continue to guess until you get the right combination or until you stop the
    game.


    ### Description


    On the left side of the form is a large picture box control. On the right side,
    two group box controls and two button controls are placed. In the picture box,
    a control panel is placed. In the panel, there are four label controls (set the
    `AutoSize` property to `False`) and nine button controls. In the first group box
    control, place three radio buttons. In the second group box control, a text box
    control is placed.


    ![](Image00017.jpg)

    Figure 3.1 All controls used in Bank Code project


    The picture box contains an image of bank and a panel. The label controls in the
    panel are used to display the combinations entered (the `BorderStyle` property
    set to `FixedSingle` to display the label size). The nine buttons on the panel
    are used to enter combinations. Radio buttons are used to set options. The buttons
    (one to start and stop the game and another to exit the project) are used to control
    game operations. The text box displays the results of the combinations entered.


    ![](Image00018.jpg)

    Figure 3.2 User chooses 3 Digits Combination and clicks Start Game button


    ![](Image00019.jpg)

    Figure 3.3 User guesses three digits and the result displayed on text box control


    Run the project (press `<F5>`). The game will be displayed in a "stop" state.
    You can then choose the combination option 2, 3, or 4 digits. If you choose a
    3 digit combination and click Start Game button, it will appear as shown in Figure
    3.2. Because 3 digits combination option is selected, only three labels are displayed
    to enter the combination. Now you can select the three digit guesses by pressing
    the number keys provided. After you select the guess, the results will be displayed
    in the text box to the right of the form as shown in Figure 3.3.


    ### Tutorial Steps


    #### Step 1

    You will start building the Bank Code game project. Start a new project in Visual
    C#. It is recommended that you immediately save it with a name that you choose
    yourself. This will create the folders and file structure needed for your project.


