    ### Step 43: Testing\nSave and run project. Play the two player game. You can\
    \ now listen to the sounds of firing, hitting and ouch. And, play until the `rudal`\
    \ is zero for both players so that the gameover sound is played.\n\n### Step 44:\
    \ Computer AI\nYou certainly can't always find a partner to play the game. So\
    \ why not if computer becomes your opponent? In the one player option, this game\
    \ can make a computer as `player2`. For such computer control, you need to develop\
    \ rules to be used by computer as opponent. There are two approaches that can\
    \ be taken in writing code for computer opponent. You can use simple logic, which\
    \ makes it very easy for human to win game. Or, you can write code with very detailed\
    \ logic, which can defeat the human brain. With detailed logic, it will be harder\
    \ for human to win the match. In this game, you will take both approaches. You\
    \ first develop simple logic by playing a random game. Then, you use the difficulty\
    \ level selected using the `Options` button to determine how often you use random\
    \ logic versus how often you use detailed logic. The selected values are as follows:\n\
    \n| Difficulty Level | Simple Logic (%) | Detailed logic (%) |\n| :--- | :---\
    \ | :--- |\n| Easiest | 100 | 0 |\n| Easy | 75 | 25 |\n| Hard | 50 | 50 |\n| Hardest\
    \ | 25 | 75 |\n\nSo, when the Easiest level is selected, you use 100 percent simple\
    \ logic during the game. When the Hardest level is selected, you use 75 percent\
    \ of detailed logic (you can't possibly make the computer too smart, because human\
    \ will always lose) and 25 percent of simple logic. The movement of the computer\
    \ will be controlled by a separate timer control (`timComputer`). For easier games,\
    \ you will create a greater value for the `Interval` property of this timer. This\
    \ will slow down the computer process. The interval values selected here:\n\n\
    | Difficulty Level | Interval |\n| :--- | :--- |\n| Easiest | 1000 |\n| Easy |\
    \ 750 |\n| Hard | 500 |\n| Hardest | 250 |\n\nSo at the Difficult difficulty level,\
    \ the computer moves four times more often than when the Easiest difficulty level\
    \ is selected. You will use Integer variable (`RandComputer`) to represent a percentage\
    \ of the simple logic time used and an Integer variable (`TimeComputer`) to represent\
    \ the `Interval` property of the timer control. Add the value for these two new\
    \ variables in the `Click` event procedure of the `rdoDifficulty`. The modified\
    \ procedure is given as follows:\n\n```csharp\nint RandComputer, TimeComputer;\n\
    ```\n"
