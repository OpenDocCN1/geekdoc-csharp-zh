  \n你现在将开始编写这个游戏代码。你将在多个阶段编写代码。作为一个初始步骤，你将编写启动游戏并设置初始状态的代码。然后，由于点击停止按钮设置 `'stop'`\
  \ 状态。最后，点击 Start 按钮后编写赛马代码。在开发过程中，你将在结束前多次修改某些过程。\n\n### 第 4 步\n每当用户启动程序时，都需要进行初始化。你将看到项目中需要的初始化。当程序启动时，你自然想要显示游戏指令。你还想对\
  \ `NumberOfHorses` 和 `StatusGame` 进行初始化（提供初始值）。这种初始化是在表单的 `Load` 过程中进行的。\n\n![](img/Image0031.jpg)\n\
  图 4.7 表单 Load 过程中的初始化\n\n你在表单级别声明以下三个变量（`NumberOfHorses`、`StatusGame` 和 `PanelGame`）：\n\
  \n```csharp\nint NumberOfHorses;\nstring StatusGame;\nGraphics PanelGame;\n\nprivate\
  \ void FormHorseRacing_Load( object sender, EventArgs e) {\n    NumberOfHorses =\
  \ 3;\n    StatusGame = \"Start\";\n    lblInstruction.Text = \"赛马游戏 \\n\\n\";\n\
  \    lblInstruction.Text += \"两匹马正在向终点冲刺。\\n\" +\n    \"猜哪匹马会先到达终点。\";\n    lblInstruction.Text\
  \ += \"\\n\\n 通过按左按钮减少、\" +\n    \"右按钮增加来选择参赛的马匹数量。\";\n    lblInstruction.Text\
  \ += \"\\n\\n 点击 Start 按钮开始游戏。\";\n    lblInstruction.Text += \"\\n\\n 点击 Stop 按钮结束游戏。\"\
  ;\n    lblHorse.Text = NumberOfHorses.ToString();\n    PanelGame = pnlGame.CreateGraphics();\n\
  }\n```\n\n`NumberOfHorses` 设置为 3，`StatusGame` 设置为 `\" Start \"`。接下来，在创建图形对象（`PanelGame`）后，使用一系列语句在\
  \ `lblInstruction` 中编写游戏指令。\n\n### 第 5 步\n保存并运行程序，查看图 4.7 所示。\n\n### 第 6 步\n要更改马的数量，用户可以点击提供的两个箭头键之一。执行此操作的代码放置在\
  \ `btnLeft` 和 `btnRight` 的 `Click` 事件过程中：\n\n\n\n\n\n```csharp\nprivate void btnLeft_Click(\
  \ object sender, EventArgs e)\n{\n    if (StatusGame == \"Start\") // 减少马的数量\n \
  \   {\n        NumberOfHorses -= 1;\n        if (NumberOfHorses < 3)\n         \
  \   NumberOfHorses = 3;\n        lblHorse.Text = NumberOfHorses.ToString();\n  \
  \  }\n}\n\nprivate void btnRight_Click( object sender, EventArgs e)\n{\n    if (StatusGame\
  \ == \"Start\") // 增加马的数量\n    {\n        NumberOfHorses += 1;\n        if (NumberOfHorses\
  \ > 10)\n            NumberOfHorses = 10;\n        lblHorse.Text = NumberOfHorses.ToString();\n\
  \    }\n}\n```\n\n这段代码非常简单。只有当游戏处于 `\"Start\"` 状态时，马的数量才会发生改变。如果点击 `<` 按钮，程序将减少马的数量（最少\
  \ 3 匹）。如果点击 `>` 按钮，程序将增加马的数量（最多 10 匹）。然后会显示马数量的新值。\n\n### 步骤 7\n保存并运行程序。确保两个箭头键都能正常工作，它们可以改变马的数量在\
