  \ 步骤 22\n在这个项目中，你将赋予玩家互相发射导弹的能力。导弹将像玩家一样用 `Image` 对象表示。这里唯一的区别是，当导弹发射时，它将在预定速度下无需用户交互即可移动，并且其位置由计时器控制更新。而且，你需要不断检查导弹是否与另一个物体碰撞。`TwoPlayer`\
  \ 类没有速度属性，也没有检查碰撞的方法。因此，你需要一个新类来定义导弹。\n\n你将使用 `MovingRudal` 类来解释导弹。该类将拥有来自 `TwoPlayer`\
  \ 类的属性和方法（使用继承），加上速度属性和一个检查碰撞的方法。要构建此类，你可以从零开始，编写所有新属性和新方法。或者，你可以利用面向对象编程中的继承概念。继承是一种通过添加类自身的属性和/或方法来构建以现有类为基础的类的概念。这将节省工作量。\n\
  \n你将看到继承是如何使用的。你稍后会添加碰撞检查方法。现在，只需关注类属性。向项目中添加一个类，将其命名为 `MovingRudal`。使用以下类代码：\n\n\
  ```csharp\nclass MovingRudal : TwoPlayer{\n    public MovingRudal ()\n    {\n  \
  \  }\n    public int XSpeed;\n    public int YSpeed;\n}\n```\n\n这将使 `TwoPlayer`\
  \ 类的所有属性和方法对新类（`MovingRudal`）可用。其他代码行增加了速度属性（`XSpeed` 是水平方向的速度；`YSpeed` 是垂直方向的速度）。这两个属性代表了\
