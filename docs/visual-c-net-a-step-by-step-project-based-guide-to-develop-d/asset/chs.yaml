  ## 银行密码游戏\n\n在本教程中，你将构建一个“银行密码”游戏。储物箱被锁住，只有输入正确的数字组合时才能打开。数字组合可以是 2 到 4 位不重复的数字（数字范围为\
  \ 1 到 9）。给出猜测后，系统会通知你有有多少个数字是正确的，以及有多少数字的位置正确。根据这些信息，你将进行下一次猜测。继续猜测，直到获得正确的组合或停止游戏。\n\
  \n## 描述\n\n表单左侧是一个大的图片框控件（PictureBox）。右侧放置了两个组框控件（GroupBox）和两个按钮控件（Button）。在图片框内放置了一个面板控件（Panel）。面板中，有四个标签控件（Label，将\
  \ `AutoSize` 属性设置为 `False`）和九个按钮控件。在第一个组框控件中放置三个单选按钮（RadioButton）。在第二个组框控件中放置一个文本框控件（TextBox）。\n\
  \n![](img/Image00017.jpg)\n图 3.1 银行密码项目中使用使用的所有控件\n\n图片框包含一张银行图片和一个面板。面板中的标签控件用于显示输入的组合（将\
  \ `BorderStyle` 属性设置为 `FixedSingle` 以显示标签大小）。面板上的九个按钮用于输入组合。单选按钮用于设置选项。按钮（一个用于开始和停止游戏，另一个用于退出项目）用于控制游戏操作。文本框显示输入组合的结果。\n\
