  \ \" + Score.ToString() + \" 个球。\", \"游戏结束\");\n        StatusGame = \"Starting\"\
  ;\n    }\n}\n```\n\n在新代码中，每次 `Tick` 事件，`RemainingTime` 都会减去 `timerGame.Interval`。当\
  \ `RemainingTime` 为 0 时，图形元素（鸟、球和人）将从屏幕上移除，计时器停止，并在消息框显示结果。\n\n### 步骤 30\n保存并运行程序。点击开始按钮。时间将倒计时。\n\
  \n### 步骤 31\n这是最后一个需要修改的地方。你可以在 60 秒结束前停止程序。要实现这一点，当游戏处于“进行”状态时点击停止按钮。代码非常简单。为 `btnStop`\
  \ 控件的 `Click` 事件添加修改后的代码：\n\n```csharp\nprivate void btnStop_Click( object sender,\
