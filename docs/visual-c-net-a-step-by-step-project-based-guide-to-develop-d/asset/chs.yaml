  \ 7.2 所示。\n\n玩家的操作通过键盘完成。玩家 1 按 `A` 键向上移动，`Z` 键向下移动，按 `S` 键发射导弹。当你从 `Options` 按钮中选择\
  \ `Two` 玩家时，该游戏可以由两个人类玩家进行。玩家 1 按相同的键，而玩家 2 按 `K` 键向上移动，`M` 键向下移动，`J` 键发射导弹，如图 7.3\
  \ 所示。![](img/Image00067.jpg)图 7.2 用户选择单玩家和困难难度级![](img/Image00068.jpg)图 7.3 用户对战电脑![](img/Image00069.jpg)图\
  \ 7.4 人人对战\n\n## 教程步骤\n\n## 第一步\n你将开始构建战斗机游戏项目。在 Visual C# 中新建一个项目。在表单上放置 12 个 label、一个大型控制面板和三个控制按钮。在控制面板中，放置一个较小的面板，其中包含两个组框框控件和一个按钮控件。在第一个分组框中放置\
  \ 2 个单单选框；在第二个分组框中放置 4 个单单选框。为项目添加两个 timer 控件。更改每个控件的大小和位置，使表单现在如如图 7.5 所示。\n\n\
  所有 label 控件用于显示标题并提供评分和游戏信息。大型面板（`Panel1`）是游戏区域。三个按钮控件用于启动/停止程序、设置选项和退出程序。一个 timer\
  \ 控件用于控制游戏动画，另一个代表计算机的决策过程。第二个控制面板（`Panel2`）用于选择游戏选项。一个分组框包含单单选框，用于选择人数。另一个分组框包含单单选框，用于在对战电脑时选择游戏难度。一个小型按钮用于关闭选项面板。默认属性设置为单人游戏且为最容易的游戏难度。\n\
