  图 6.14 用户现在确实可以使用左右方向键和左右鼠标按钮移动人\n\n\n\n\n\n### 步骤 26\n当球接近屏幕底部时，你需要检查人是否能接住它。检查此点的代码位于\
  \ `timerGame` 的 `Tick` 事件处理过程中。你需要做两件事：\n\n- 检查球是否被接住。如果是的话，则清除球并增加分数，且鸟和球将再次出现在屏幕顶部的随机位置。\n\
  - 检查球是否已经到达与人相同的垂直位置且没有被接住。如果是，鸟和球将重新出现。\n\n你如何知道人接住了球？你需要检查人的图形与球的图形是否发生碰撞。在球与人重叠之前，无法进行检测。这种情况发生的条件是：`BallY\
  \ + BallH > ManY`。你将使用一个布尔变量 `Passed` 来判断。当满足此条件后，你可以判断人与球碰撞（或接住球）的情况：`ManX + ManW\
  \ > BallX and ManX < BallX + BallW`。这意味着人的右侧必须比球的左侧“更靠右”，而人的左侧必须比球的右侧“更靠左”。另一个布尔变量\
  \ `Collision` 用于检查此条件。声明这两个新变量：\n\n```csharp\nbool Passed, Collision;\n```\n\n将此修改后的代码添加到\
  \ `timerGame` 的 `Tick` 事件过程中：\n\n```csharp\nprivate void timerGame_Tick( object\
  \ sender, EventArgs e)\n{\n    ClearBall();\n    BallY = BallY + BallSpeed;\n  \
  \  PanelGame.DrawImage(picBall.Image, BallX, BallY);\n    //移动人\n    ClearMan();\n\
  \    if (KeyPressed == \"Left\" || ButtonClicked == \"Left \")\n    {\n        ManX\
  \ = ManX - ManDeltaX;\n        if (ManX < 0)\n            ManX = 0;\n    }\n   \
  \ else if (KeyPressed == \"Right\" || ButtonClicked == \"Right \")\n    {\n    \
  \    ManX = ManX + ManDeltaX;\n        if (ManX > (pnlGame.Width - ManW))\n    \
  \        ManX = pnlGame.Width - ManW;\n    }\n    PanelGame.DrawImage(picMan.Image,\
  \ ManX, ManY);\n    //检查球是否与人碰撞或经过人\n    Passed = false;\n    Collision = false;\n\
  \    if (BallY + BallH > ManY)\n    {\n        Passed = true;\n        if (ManX\
  \ + ManW > BallX && ManX < BallX + BallW)\n            Collision = true;\n     \
  \   if (Passed)\n            if (Collision)\n                Score += 1;\n     \
  \   ClearBird();\n        ClearBall();\n        PlaceBirdAndBall();\n    }\n   \
  \ DisplayTimeScore();\n}\n```\n\n### 步骤 27\n你现在理解了所实现的步骤。特别要注意在 `Passed` 为 True\
  \ 后新鸟是如何定位的（以及如果 `Collision` 为 True 时分数如何增加）。这段新代码需要一个名为 `ClearBird` 的新子程序，该程序用于从当前位置移除鸟：\n\
  \n```csharp\nprivate void ClearBird()\n{\n    PanelGame.FillRectangle(Brushes.Gold,\
  \ BirdX, 0, BirdW + 30, BirdH + 30);\n}\n```\n\n### 步骤 28\n保存并运行程序。根据需要更改难度级别。点击开始按钮。现在你可以移动人到掉落球下方，分数将会增加，鸟将再次出现在下一个随机位置。如果人没能接住球，分数将不会增加，鸟将出现在下一个随机位置。\n\
  \n### 步骤 29\n你快要完成了。使用目前的代码，你可以尽情玩游戏。请注意，剩余时间仍然是 60。你需要实现逻辑在 60 秒后结束游戏（并更新剩余时间）。要实现这一点，将此修改后的\
  \ `Tick` 事件过程代码添加到 `timerGame` 控件中：\n\n```csharp\nprivate void timerGame_Tick( object\
  \ sender, EventArgs e)\n{\n    ClearBall();\n    BallY = BallY + BallSpeed;\n  \
  \  PanelGame.DrawImage(picBall.Image, BallX, BallY);\n    //移动人\n    ClearMan();\n\
  \    if (KeyPressed == \"Left\" || ButtonClicked == \"Left \")\n    {\n        ManX\
  \ = ManX - ManDeltaX;\n        if (ManX < 0)\n            ManX = 0;\n    }\n   \
  \ else if (KeyPressed == \"Right\" || ButtonClicked == \"Right \")\n    {\n    \
  \    ManX = ManX + ManDeltaX;\n        if (ManX > (pnlGame.Width - ManW))\n    \
  \        ManX = pnlGame.Width - ManW;\n    }\n    PanelGame.DrawImage(picMan.Image,\
  \ ManX, ManY);\n    //检查球是否与人碰撞或经过人\n    Passed = false;\n    Collision = false;\n\
  \    if (BallY + BallH > ManY)\n    {\n        Passed = true;\n        if (ManX\
  \ + ManW > BallX && ManX < BallX + BallW)\n            Collision = true;\n     \
  \   if (Passed)\n            if (Collision)\n                Score += 1;\n     \
  \   ClearBird();\n        ClearBall();\n        PlaceBirdAndBall();\n    }\n   \
  \ //更新时间\n    RemainingTime = RemainingTime - timerGame.Interval;\n    DisplayTimeScore();\n\
  \    if (RemainingTime == 0)\n    {\n        ClearBird();\n        ClearBall();\n\
