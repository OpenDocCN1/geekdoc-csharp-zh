  \n在本教程中，你将构建一个智能井井棋游戏。需要说明的是，这是首个在计算机上编写的游戏，是由比尔·盖茨（Bill Gates）在青少年时期于就读于西雅图湖畔中学期间亲自编写的。该游戏的目标是在\
  \ 3x3 的网格上，通过水平、对角线或垂直线上的三个相同符号（X 或 O）来获胜。玩家将交替进行。游戏提供了两个选项：玩家 1 对战玩家 2，或者人类对战电脑。我们将开发一种智能但简单的计算机逻辑，使其成为人类的强大对手。\n\
  \n## 描述\n\n运行项目（按 `<F5>`）。游戏将显示为“停止”状态，网格将被清空并等待你选择游戏选项（单双玩家；如果是单玩家，则选择谁先手以及电脑对抗的智能程度）。\n\
