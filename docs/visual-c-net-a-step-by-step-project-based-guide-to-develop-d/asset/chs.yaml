  \ properties setting done. 7.6 属性设置后的表单。\n\n### 步骤 3\n运行项目（按 `<F5>`），游戏显示如图 7.7\
  \ 所示。现在你将开始编写项目代码。你首先编写根据所选游戏选项设置游戏状态的代码。\n\n### 步骤 4\n当游戏开始时，用户将选择选项（玩家人数和游戏难度级别）。根据这些选择，表单将显示不同的信息。当用户点击选项按钮\
  \ (`btnOption`) 时，会发生以下情况：\n\n*   禁用 `btnGame`。\n*   禁用 `btnOption`。\n*   禁用退出按钮。\n\
  *   使 `pnlOption` 可见。\n\n![](img/Image00072.jpg)Figure 7.7 The form first starts\
  \ 7.7 表单首次启动实现这些步骤的代码放置在 `btnOption` 按钮的 `Click` 事件中：\n\n```csharp\nprivate void\
  \ btnOption_Click( object sender, EventArgs e){\n    btnGame.Enabled = false ;\n\
  \    btnOption.Enabled = false ;\n    btnExit.Enabled = false ;\n    pnlOption.Visible\
  \ = true ;\n}\n```\n\n将此过程添加到你的项目中。当项目运行且用户点击选项 按钮时，表单将如图 7.8 所示显示。\n\n### 步骤 5\n\
  选项面板显示后，用户可以选择一个或两个玩家，并选择游戏难度（如果与电脑玩）。你将使用一个名为 `NumberOfPlayer` 的整数变量来保存玩家人数，并使用一个名为\
  \ `Difficulty` 的整数变量来保存所选的难度级别。向项目中添加以下两个表级变量声明：\n\n```csharp\nint NumberOfPlayer,\
  \ Difficulty;\n```\n\n![](img/Image00073.jpg)Figure 2.8 When user clicks Options\
  \ button 2.8 用户点击选项按钮\n\n### 步骤 6\n向项目添加 `FormFightingPlane` 的 `Load` 事件，以将这些变量初始化为默认值：\n\
  \n```csharp\nprivate void FormFightingPlane_Load( object sender, EventArgs e){\n\
  \    NumberOfPlayer = 1;\n    Difficulty = 1;\n}\n```\n\n### 步骤 7\n如果选择了单人单选按钮 (`rdoOnePlayer`)，用户将与电脑对战，并发生以下情况：\n\
