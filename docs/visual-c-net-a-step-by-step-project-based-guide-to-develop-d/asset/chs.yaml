  \n```csharp\nint QuestionTime;\n```\n\n### 步骤 16\n然后，你需要编写从一个计时选项切换到另一个的代码。你将使用一个方法处理\
  \ `grpTimer` 组框内三个单选按钮的 `CheckedChanged` 事件。涉及的步骤如下：\n\n*   如果选择了 `rdoTimerOff`，`lblTimer`\
  \ 和 `vsbTimer`将被禁用。\n*   如果选择了向前计数（`rdoTimerForward`），`lblTimer`将显示，`vsbTimer`将被禁用。`QuestionTime`\
