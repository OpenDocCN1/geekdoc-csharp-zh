  \ 7.13 所示出现。在退出游戏之前，点击“停止游戏”按钮以确保过程正常运行。\n\n### 步骤 20\n\n你需要移动玩家向上和向下的能力。如果你选择使用键盘控制，可以使用\
  \ `KeyDown` 事件。此事件与之前的 `KeyPress` 事件相同，但更灵活：\n\n```csharp\nprivate void FightingPlane_KeyDown(object\
  \ sender, EventArgs e){}\n```\n\n`KeyCode` 属性是 `Keys` 类的成员。当需要时，Visual C# IDE 会提供\
  \ `KeyCode` 值。`KeyDown` 事件通常带有 `switch` 结构，并为每个按键（或按键组合）编写 `case` 子句。在游戏中，你选择以下键来控制移动并发射：\n\
  \n- **玩家 1**: A – 向上，Z – 向下，S 发射\n- **玩家 2**: K – 向上，M – 向下，J 发射\n\n你可以根据需要进行修改。`Player1`\
  \ 垂直居中于 `pnlGame` 靠近左边缘。`Player2` 垂直居中于 `pnlGame` 靠近右边缘。当用户点击按钮时，会出现“游戏结束”消息。每当按下键时，你都会（使用\
  \ `TwoPlayer` 类的 `Move` 方法）向下或向上移动。在此处添加一个常量声明：\n\n```csharp\nconst int Increment\
  \ = 5;\n\nprivate void FightingPlane_KeyDown(object sender, EventArgs e)\n{\n  \
  \  switch (e.KeyCode)\n    {\n        case Keys.A:\n            Player1.Move(MyGraphics,\
  \ MyBrush, 0, -Increment);\n            if (Player1.Location.Y < 0)\n          \
