  \        vsbTimer.Visible = true;\n    }\n}\n```\n\n### 步骤 17\n上面的 `rdoTimer_CheckedChanged`\
  \ 事件使用一个生成时间的公共函数 `GetTime`。编写 `GetTime` 函数的定义：\n\n```csharp\nprivate string GetTime(\
  \ int s) {\n    int min, det;\n    string ms, ss;\n    min = (s / 60);\n    det\
  \ = s - 60 * min;\n    ms = min.ToString();\n    ss = det.ToString();\n    if (det\
  \ < 10)\n        ss = \"0\" + ss;\n    return (ms + \":\" + ss);\n}\n```\n此函数接收秒为单位的时间（`s`）并将其分解为分钟和秒。将此新代码添加到项目中。\n\
