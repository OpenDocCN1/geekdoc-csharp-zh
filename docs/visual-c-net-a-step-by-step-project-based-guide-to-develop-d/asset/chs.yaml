- "# Visual C# .NET：桌面应用开发分步项目指南\n\n\n\n![](img/Image00084.jpg)\n\n\n\n\n\n\n# 关于作者\n\
  \n![D:\\vivi2.jpg](img/Image00000.jpg) Vivian Siahaan 是一个乐于尝试新事物的快速学习者。她出生并成长于多巴湖畔的\
  \ Balige Hinalang Bagasan，在 `SMAN 1 Balige` 完成高中教育。她自学了 `Java`、`Android`、`JavaScript`、`CSS`、`C++`、`Python`、`R`、`Visual\
  \ Basic`、`Visual C#`、`MATLAB`、`Mathematica`、`PHP`、`JSP`、`MySQL`、`SQL Server`、`Oracle`、`Access`\
  \ 等编程语言。她从基础语法和逻辑开始，通过构建多个简单实用的 GUI 应用。动画和游戏是她想要开发的编程领域。除了学习数学逻辑和编程外，作者还喜欢阅读小说。Vivian\
  \ Siahaan 在 Sparta Publisher 出版了数十本电子书：`Java 数据结构`；`Java 编程：食谱`；`C++ 编程：食谱`；`面向高中/职业学校及学生的\
  \ C 语言编程`；`面向 SMA/SMK 的 Java 编程`；`Java 教程：GUI、图形与动画`；`Visual Basic 编程：从入门到专家`；`面向动画和游戏的\
  \ Java 编程`；`面向 SMA/SMK 及学生的 C# 编程`；`面向学生和研究人员的 MATLAB`；`JavaScript 图形：快速学习系列`；`JavaScript\
  \ 图像处理方法：从入门到专家`；`Java GUI 研究：AWT & Swing`；`基础 CSS 和 JavaScript`；`PHP / MySQL 编程：食谱`；`Visual\
  \ Basic：食谱`；`面向高中/职业学校及学生的 C++ 编程`；`C++ 概念与实践`；`面向学生的 PHP / MySQL`；`C# 编程：从入门到专家`；`面向\
  \ SMA/SMK 及学生的 Visual Basic`；`面向高中/职业学生的 .NET 和 SQL Server`。在 ANDI Yogyakarta 出版社，Vivian\
  \ Siahaan 还编写了多部书籍，包括：`Python 编程理论与实践`；`Python GUI 编程`；`Python GUI 与数据库`；`使用 Python/MySQL\
  \ 从零构建学校数据库管理系统`；`Python/MySQL 数据库管理系统`；`用于刑事追踪记录数据库管理系统的 Python/MySQL`；`用于刑事追踪记录数据库管理系统的\
  \ Java/MySQL`；`使用 Java/MySQL 的数据库与加密`；`使用 Java/MySQL 从零构建学校数据库管理系统`。\n\n![D:\\RH_AR.jpg](img/Image00001.jpg)\
  \ Rismon Hasiholan Sianipar 于 1994 年出生于 Pematang Siantar。从 `SMAN 3 Pematang Siantar`\
  \ 毕业后，作家前往雅加达他市。1998 年和 2001 年，作者在 `Adhi Soesanto` 和 `Thomas Widodo` 的指导下，在 `Gadjah\
  \ Mada 大学`完成了电气工程学士（S.T）和电气工程硕士（M.T）。由于能量分布的非平稳性，能量分布在`时频图`上变得非常动态。通过使用`离散小波变换`，可以设计非线性滤波器。2003\
  \ 年，作者获得了日本政府提供的`Monbukakusho`奖学金。2005 年和 2008 年，他在 `Hidetoshi Mike` 的指导下，在 `山口大学`完成了工程硕士（M.Eng）和工程博士（Dr.Eng）教育。在他的硕士论文和博士论文中，R.H.\
  \ Sianipar 将`SR-FHN`（随机共振 Fitzhugh-Nag）滤波器强度与 4096 位`ECC`（椭圆曲线加密）相结合，以抑制数字图像和数字视频中的噪声并保持其真实性。这项研究的结果已记录在国际科学期刊并在日本获得正式专利。其中一项专利在日本发表，注册号为\
  \ `2008-09549`。\n\n除了是马塔兰大学电气工程系的活跃教师外，他还活跃于与日本若干大学和研究机构的合作，特别是`密码学`、`密码分析`以及音频/图像/视频数字取证领域。R.H.\
  \ Sianipar 在对日本研究对象的若干情报数据进行代码破解方法（`密码分析`）方面拥有经验。R.H. Sianipar 拥有多个日本专利，并撰写了许多国家/国际科学文章以及数十本书籍。R.H.\
  \ Sianipar 还参加了多场关于`密码学`、`密码分析`、`数字水印`和`数字取证`的研讨会。在多场研讨会上，R.H. Sianipar 帮助 `Hidetoshi\
  \ Mike 教授` 创建数字图像/视频处理、`隐写术`、`密码学`、`水印`、`非线性筛选`、基于智能描述符的计算机视觉等应用，用于教学材料。R.H. Sianipar\
  \ 的研究领域涵盖多媒体安全、`信号处理/数字图像/视频`、`密码学`、`数字通信`、`数字取证`以及`数据压缩/编码`。目前，R.H. Sianipar 仍在基于\
  \ `Python` 语言开发用于研究和商业目的的信号、图像和数字视频分析应用。\n\n\n\n\n\n在第二章中，你将构建一个项目，让孩子们可以练习加、减、乘、除基础操作。这个\
  \ `Math Game`（数学游戏）项目可以用于选择题目类型以及你想使用的因素。该项目有三种计时选项。将展示 `0` 到 `9` 之间数值的随机数学题。提供了计时选项来衡量准确性和速度。程序中使用了许多控件。两个\
  \ `label` 控件用于标题信息，两个用于显示分数。表单中间有一个宽大的 `label` 用于显示数学题。此外，一个长细的 `label` 被用作分隔符。两个\
  \ `button` 控件用于开始和停止问题，还有一个 `button` 用于退出项目。有三个 `group` 控件组框。第一个组框包含四个 `checkbox`\
  \ 控件，用于选择题目类型。第二个组框包含 11 个 `radio buttons`（单选按钮），用于选择作为计算因子的数值。第三个组框包含三个 `radio\
  \ button` 控件用于计时选项。一个 `scrollbar`（滚动条）控制杆用于改变时间。\n\n在第三章中，你将构建 `Bank Code`（密码锁）游戏。存储箱被锁定，只有输入正确的数字组合时才能打开。组合可以是\
  \ `2` 到 `4` 个不重复的数字（数字范围从 `1` 到 `9`）。在给出猜测后，系统会通知你有几个数字是正确的，以及几个数字的位置正确。根据这些信息，你将进行下一次猜测。你继续猜测，直到获得正确组合或停止游戏。表单左侧是一个大的\
  \ `picture box`（图片框）控件。右侧放置了两个 `group box` 控件和两个 `button` 控件。在 `picture box` 中，放置了一个\
  \ `control panel`（控制面板）。在 `panel` 中，有四个 `label` 控件（将 `AutoSize` 属性设置为 `False`）和九个\
  \ `button` 控件。在第一个 `group box` 控件中放置了三个 `radio buttons`。在第二个 `group box` 控件中放置了一个\
  \ `text box`（文本框）控件。`picture box` 包含一张银行图片和一个 `panel`。`panel` 中的 `label` 控件用于显示输入的组合（`BorderStyle`\
  \ 属性设置为 `FixedSingle` 以显示标签大小）。`panel` 上的九个 `buttons` 用于输入组合。`Radio buttons` 用于设置选项。`buttons`（一个用于开始和停止游戏，另一个用于退出项目）用于控制游戏操作。`text\
  \ box` 显示输入组合的结果。\n\n在第四章中，你将构建 `Horse Racing`（赛马）游戏。这是一个简单的游戏。多达 `10` 匹马将竞向终点。你预测两匹你认为可能赢得比赛的马。通过点击\
  \ `Start` 按钮，比赛将开始。所有的马将以速度竞向终点。`Labels` 用于显示说明和比赛中马的数量。使用了四个个 `button` 控件：两个 `buttons`\
  \ 用于更改马的数量，一个 `button` 用于开始游戏，另一个一个 `button` 用于停止游戏。`picture box` 控件用于加载马的图像。一个\
  \ `timer`（定时器）控件用于在比赛期间更新马的移动。\n\n在第五章中，你将构建 `Catching Ball`（接球）游戏。鸟飞过并从天空掉落球。面临的挑战是将人移动到落球下方接住它。`Labels`\
  \ 用于说明和显示游戏信息（剩余时间、捕获的球数和游戏难度等级）。两个 `buttons` 用于更改游戏难度等级，一个 `button` 用于开始游戏，另一个\
  \ `button` 用于停止游戏。`PictureBox` 控件持有人、鸟和球的图像。\n\n在第六章中，你将构建 `Smart Tic Tac Toe`（智能井井棋）游戏。换句话说，这是第一个在计算机上编写的游戏，是由比尔·盖茨本人在青少年时期就西雅图湖滨中学期间编写的。这个游戏的目标是在\
  \ `3 x 3` 网格上获胜，通过水平、对角线或垂直线上的三个相同的符号（`X` 或 `O`）获得胜利。玩家将交替进行。这个游戏给出两个选项：`player\
  \ 1` 对战 `player 2` 或人类对抗电脑。将为计算机逻辑开发一种智能但简单的策略，使其成为人类的强大对手。\n\n在第七章中，你将构建 `Fighting\
  \ Plane`（战斗机）程序。该程序可以由两个人类玩家玩，也可以是人类对抗电脑。玩家的控制通过键盘完成。`Player 1` 按 `A` 键向上，按 `Z`\
  \ 键向下，按 `S` 键投掷导弹。当你从 `Options` 按钮选择 `Two players` 时，游戏可以由两个人类玩家玩。`Player 1` 按相同的键，而\
  \ `player 2` 按键 `K` 向上，按 `M` 向下，按键 `J` 投掷导弹。所有的 `label` 控件都用于标题并提供评分和游戏信息。大型 `panel`（`Panel1`）是游戏场。使用三个\
  \ `button` 控件来启动/停止程序、设置选项和退出程序。一个 `timer` 控件用于控制游戏动画，另一个代表电脑的决策过程。第二个控制面板 (`Panel2`）用于选择游戏选项。一个\
  \ `group box` 包含 `radio buttons` 用于选择玩家人数。一个 `group box` 包含 `radio buttons` 用于选择游戏难度等级，当与电脑玩时。\n\
  \n\n\n\n\n\n# 按钮属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| Height | 以像素为单位的表单高度。 |\n\
  | Help | 用于获取或设置一个值，指示是否需要显示帮助按钮。 |\n| Icon | 用于获取或设置表单的图标。 |\n| Left | 表单左边缘的距离，单位为像素。\
  \ |\n| MaximizeButton | 用于获取或设置一个值，指示标题栏上是否显示最大化按钮。 |\n| MinimizeButton | 用于获取或设置一个值，指示表单标题栏上是否显示最小化按钮。\
  \ |\n| StartPosition | 用于获取或设置应用程序运行时表单的初始位置。 |\n| Text | 用于获取或设置表单标题。 |\n| Top\
  \ | 表单顶边缘的距离，单位为像素。 |\n| Width | 以像素为单位的表单宽度。 |\n\n调用方法的通用语法是编写控件名称、点、然后是方法名。对于\
  \ `Form` 对象的方法，使用的名称是 `this`。这是一个 C# 关键字，用于引用表单。因此，要关闭表单，你可以使用 `this.Close()`。\n\
  \n## 1.2 Form 对象的若干方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| Close | 关闭表单。 |\n| Focus\
  \ | 将焦点设置在表单上。 |\n| Hide | 隐藏表单。 |\n| Refresh | 强制表单再次显示。 |\n| Show | 将 Visible\
  \ 属性设置为 `True`。 |\n\n## 1.3 Form 对象的若干个事件\n\n| 事件 | 描述 |\n| :--- | :--- |\n| Activated\
  \ | 当用户激活表单时发生。 |\n| Click | 当用户点击表单时发生。 |\n| FormClosing | 当表单关闭时发生。 |\n| DoubleClick\
  \ | 当双击表单时发生。 |\n| Load | 当表单首次显示时发生。 |\n| Paint | 当表单重载时发生。 |\n\n`Form` 对象的通用用途：\n\
  - 设置 `Name` 和 `Text` 属性。\n- 设置 `StartPosition` 属性，例如设置为 `CenterScreen`。\n- 将 `BorderStyle`\
  \ 属性设置为特定值，如 `FixedD`。\n- 在 `Load` 事件中编写所需的初始化代码。要双击表单，请在 `FormClosing` 事件中编写最终化代码。\n\
  \n## 1.4 Button 对象的若干属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| Name | 用于获取或设置 `Button`\
  \ 对象的名称。 |\n| BackColor | 用于获取或设置按钮的背景颜色。 |\n| Enabled | 如果为 `False`，按钮将变为可见但无法接受用户的点击。\
  \ |\n| Font | 用于获取或设置字体名称、大小和样式。 |\n| ForeColor | 用于获取或设置文本或图形的颜色。 |\n| Image |\
  \ 用于获取或设置在按钮控件上显示的图像。 |\n| Text | 用于获取或设置显示在按钮上的文本或字符串。 |\n| TextAlign | 用于获取或设置按钮控件上的文本对齐方式。\
  \ |\n\n## 1.5 Button 对象的若干方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| Focus | 将焦点分配给按钮。\
  \ |\n| PerformClick | 为按钮生成 `Click` 事件。 |\n\n## 1.6 Button 对象最流行的事件\n\n| 事件 | 描述\
  \ |\n| :--- | :--- |\n| Click | 当通过点击按钮或按下按键选择按钮时，触发此事件。 |\n\n`Button` 控件的通用用途：\n\
  - 设置 `Name` 和 `Text` 属性。\n- 在 `Click` 事件中编写代码。\n- 你还可以更改 `Font`、`BackColor` 和 `ForeColor`\
  \ 属性。\n\nLabel 控件用于显示用户无法直接编辑的文本。标签上的文本只有在程序运行时响应事件时才能被更改。\n\n## 1.7 Label 对象的若干属性\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| Name | 用于获取或设置 `Label` 对象的名称。 |\n| AutoSize |\
  \ 用于获取或设置一个值，指示 label 是否自动改变大小。默认值为 `True`。 |\n| BackColor | 用于获取或设置 label 上的背景颜色。\
  \ |\n| BorderStyle | 用于获取或设置 label 的边缘样式。 |\n| Font | 用于获取或设置字体的名称、样式和大小。 |\n| ForeColor\
  \ | 用于获取或设置文本或图形的颜色。 |\n| Text | 用于获取或设置显示在 label 上的字符串。 |\n| TextAlign | 用于获取或设置\
  \ label 上的文本对齐方式。 |\n\n注意：默认情况下，label 控件无法调整大小。要这样做，请将 `AutoSize` 属性设置为 `False`。\n\
  \n## 1.8 Label 对象的一个方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| Refresh | 强制更新 `Label`\
  \ 控件的内容。 |\n\n## 1.9 Label 对象的若干事件过程\n\n| 事件 | 描述 |\n| :--- | :--- |\n| Click |\
  \ 当用户点击标签时触发。 |\n| DoubleClick | 当用户双击标签时触发。 |\n\n`Label` 控件的常见用途：\n- 设置 `Name`\
  \ 和 `Text` 属性。\n- 设置 `Font`、`BackColor` 和 `ForeColor` 属性。\n- 将 `AutoSize` 属性设置为\
  \ `False`。\n\n# Timer 属性\n\n`Timer` 控件在 C# 中可以在没有用户输入的情况下生成事件。它在后台运行，当屏幕需要按间隔更新时非常有用。\n\
  \n## 1.10 Timer 对象的若干属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| Name | 用于获取或设置 `Timer`\
  \ 对象名称。 |\n| Enabled | 用于启用或禁用定时器。当为 `True` 时，定时器继续操作。 |\n| Interval | 每次调用 `Tick`\
  \ 事件之间的间隔（每秒 1000 毫秒）。 |\n\n## 1.11 Timer 对象的一个事件\n\n| 事件 | 描述 |\n| :--- | :---\
  \ |\n| Tick | 当 `Enabled` 属性为 `True` 时，每隔间隔调用此事件过程。 |\n\n要使用 `Timer` 控件，你可以将其添加到应用程序。该控件将位于表单下方。定时器的\
  \ `Enabled` 属性在设计时为 `False`。你在代码中通过将此属性设置为 `True` 来启用定时器。\n\n`Timer` 控件的常见用途：\n\
  - 设置 `Name` 属性和 `Interval` 属性。\n- 在 `Tick` 事件中编写代码。\n\n# TextBox 属性\n\n`TextBox`\
  \ 控件用于显示设计时、运行时用户或程序输入的信息。\n\n## 1.12 TextBox 对象的若干属性\n\n| 属性 | 描述 |\n| :--- | :---\
  \ |\n| Name | 用于获取或设置文本框的名称。 |\n| AutoSize | 用于获取或设置一个值，指示当控件字体更改时文本框的高度是否自动调整。\
  \ |\n| BackColor | 用于获取或设置文本框的背景颜色。 |\n| BorderStyle | 用于获取或设置文本框的边缘样式。 |\n| Font\
  \ | 用于获取或设置字体名称、样式和大小。 |\n| ForeColor | 用于获取或设置文本或图形的颜色。 |\n| HideSelection | 用于获取或设置一个值，指示当控件失去焦点时选中的文本是否仍然显示。\
  \ |\n| Lines | 用于获取或设置文本框控件中的行文本。 |\n| MaxLength | 用于获取或设置用户可以在文本框中输入的最大字符数。 |\n\
  | MultiLine | 用于获取或设置一个值，指示文本框是否包含多行文本。 |\n| PasswordChar | 用于获取或设置单行 TextBox 控件中掩盖密码字符的字符。\
  \ |\n\n\n\n\n\n## TextBox \n\n| 属性 | 描述 |\n| :--- | :--- |\n| `ReadOnly` | 获取或设置一个值，指示文本框控件中的文本是否为只读。\
  \ |\n| `ScrollBars` | 获取或设置在多行文本框控件中显示哪些滚动条。 |\n| `SelectedText` | 获取或设置一个值，表示当前选中的文本。\
  \ |\n| `SelectionLength` | 获取或设置文本框中被选中的字符数。 |\n| `SelectionStart` | 获取或设置文本框中选中文文本的起始点。\
  \ |\n| `Tag` | 存储字符串表达式。 |\n| `Text` | 获取或设置文本框中的当前文本。 |\n| `TextAlign` | 获取或设置文本框上的文本对齐方式。\
  \ |\n| `TextLength` | 获取文本框中文本的长度。 |\n\n表 1.13 `TextBox` 对象的若干方法。\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `AppendText` | 将文本追加到文本框中的当前文本。 |\n| `Clear` | 清除文本框中的所有文本。 |\n\
  | `Copy` | 将选中的文本复制到剪板。 |\n| `Cut` | 将选中的文本移动到剪板。 |\n| `Focus` | 将光标置于指定的文本框上。 |\n\
  | `Paste` | 用 `Clipboard` 中的内容替换文本框中的当前选择。 |\n| `SelectAll` | 选中文本框中的所有文本。 |\n|\
  \ `Undo` | 取消文本框的最后一次编辑操作。 |\n\n表 1.14 `TextBox` 对象的若干事件。\n\n| 事件 | 描述 |\n| :---\
  \ | :--- |\n| `Click` | 用户点击文本框时发生。 |\n| `Enter` | 控件接收焦点时发生。 |\n| `KeyDown` | 当控件拥有焦点且按下按键时发生。\
  \ |\n| `KeyPress` | 当控件拥有焦点且按下按键时发生。 |\n| `Leave` | 当用户离开文本框时触发。这是在完成编辑完成后检查文本框内容的一种方法。\
  \ |\n| `TextChanged` | 当 `Text` 属性的值发生变化时。 |\n\n### `TextBox` 控件作为查看控件的般用法：\n\n\
  - 设置 `Name` 属性。用所需的字符串初始化 `Text` 属性。\n- 将 `ReadOnly` 属性设置为 `True`。\n- 如果用于显示多行文本，将\
  \ `MultiLine` 属性设置为 `True`。\n- 你也可以更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\n###\
  \ `TextBox` 控件作为输入设备的一般用法：\n\n- 设置 `Name` 属性。用所需的字符串初始化 `Text` 属性。\n- 如果用于显示多行文本，将\
  \ `MultiLine` 属性设置为 `True`。\n- 在代码中，在需要时给控件赋予 `Focus`。\n- 为本章将讨论的 `KeyPress` 事件提供按键捕获代码。\n\
  - 在 `Leave` 事件发生时读取 `Text` 属性。\n- 你也可以更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\n\
  ## CheckBox\n\nVisual C# 有许多控件，只需通过点击鼠标即可为用户提供许多选择。这些控件具有吸引力、令人熟悉，并且最大限度地减少了应用程序中错误的可能性。你将使用许多此类控件。\n\
  \n`CheckBox` 控件提供了一种提供若干潜在选项选择的方法。`CheckBox` 用于许多 Windows 应用程序。\n\n表 1.15 `CheckBox`\
  \ 对象的若干属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置复选框名称。 |\n| `BackColor`\
  \ | 获取或设置复选框的背景颜色。 |\n| `Checked` | 获取或设置一个值，指示复选框是否被选中。 |\n| `Font` | 获取或设置字体名称、样式和大小。\
  \ |\n| `ForeColor` | 获取或设置文本或图形的颜色。 |\n| `Text` | 获取或设置显示在复选框旁的字符串。 |\n| `TextAlign`\
  \ | 获取或设置复选框内的文本对齐。 |\n\n表 1.16 `CheckBox` 对象的一种方法。\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `Focus` | 将焦点移动到特定的复选框。 |\n\n表 1.17 `CheckBox` 对象的若干事件。\n\n| 事件 | 描述 |\n\
  | :--- | :--- |\n| `CheckedChanged` | 当 `Checked` 属性的值发生变化时发生，无论是通过代码还是点击复选框时。 |\n\
  | `Click` | 当点击复选框时触发。Visual C# 会自动更改 `Checked` 属性。 |\n\n当点击复选框时，如果那里没有勾选标记（`Checked\
  \ = False`），则 Visual C# 将在该处放置勾选标记并将 `Checked` 属性设置为 `True`。如果点击且之前那里有勾选标记（`Checked\
  \ = True`），则勾选标记将消失，`Checked` 属性将变为 `False`。\n\n### `CheckBox` 控件的一般用法：\n\n- 设置\
  \ `Name` 和 `Text` 属性。\n- 初始化 `Checked` 属性。\n- 监控 `Click` 或 `CheckedChanged` 事件以确定复选框是否被选中。\n\
  - 更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\n## RadioButton\n\n`RadioButton` 控件提供了一种在若干潜在选项中进行互斥选择的能力。`RadioButton`\
  \ 在许多 Windows 应用程序中工作。作为一个组工作，只有一个按钮可以被选中。`RadioButton` 广泛用于。由于它是 `RadioButton`\
  \ 控件，以下是 `RadioButton` 的控件、方法和事件：\n\n表 1.18 `RadioButton` 对象的若干属性。\n\n| 属性 | 描述\
  \ |\n| :--- | :--- |\n| `Name` | 获取或设置单选按钮名称。 |\n| `BackColor` | 获取或设置单选按钮的背景颜色。\
  \ |\n| `Checked` | 获取或设置一个值，指示单选按钮是否被选中。 |\n| `Font` | 获取或设置字体名称、样式和大小。 |\n| `ForeColor`\
  \ | 获取或设置文本或图形的颜色。 |\n| `TextAlign` | 获取或设置单选按钮上的文本对齐。 |\n\n表 1.19 `RadioButton`\
  \ 的若干方法。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `Focus` | 将焦点移动到特定的单选按钮。 |\n| `PerformClick`\
  \ | 为特定的单选按钮产生 `Click` 事件。 |\n\n表 1.20 `RadioButton` 的若干事件。\n\n| 事件 | 描述 |\n| :---\
  \ | :--- |\n| `CheckedChanged` | 当 `Checked` 属性的值发生变化时发生，无论是通过代码还是点击单选按钮时。 |\n|\
  \ `Click` | 当点击单选按钮时触发。Visual C# 会自动更改 `Checked` 属性。 |\n\n### `RadioButton` 的般用法：\n\
  \n- 创建一个单选按钮组。\n- 为组中的每个按钮设置 `Name` 和 `Text` 属性。\n- 初始化 `Checked` 属性。\n- 监控组中每个控件的事件。\n\
  \n## GroupBox\n\n你已经知道复选框和单选按钮是一个组。`GroupBox` 控件提供了组织相关控件的方法。\n\n要将控件放入组框，首先需要将\
  \ `GroupBox` 控件拖入表单。然后将每个控件放入组框。\n\n`GroupBox` 影响单选按钮的工作。`GroupBox` 上的单选按钮作为一个组工作，与其他\
  \ `GroupBox` 上的单选按钮无关。\n\n表 1.21 `GroupBox` 对象的若干属性。\n\n| 属性 | 描述 |\n| :--- | :---\
  \ |\n| `Name` | 获取或设置组框的名称。 |\n| `Enabled` | 获取或设置一个值，指示组框是否可用。如果为 `False`，则组框中的所有控件都将被禁用。\
  \ |\n| `BackColor` | 获取或设置组框的背景颜色。 |\n| `Font` | 获取或设置字体名称、样式和大小。 |\n| `ForeColor`\
  \ | 获取或设置文本的颜色。 |\n| `Text` | 获取或设置显示在组框标题区域的字符串。 |\n| `Visible` | 如果为 `False`，它将隐藏组框（及其包含的所有控件）。\
  \ |\n\n`GroupBox` 控件有若干方法和事件，但它们都很少使用。你将更多关注与组内控件相关的方法和事件。\n\n### `GroupBox` 的般用法：\n\
  \n- 设置 `Text` 和 `Name` 属性。\n- 将所需的控件放入组框。\n- 监控组框中每个控件的事件。\n\n## PictureBox\n\n\
  Visual C# 提供了许多图形特性。`PictureBox` 控件是利用这些特性的主要工具之一。图片框控件可以显示图形文件（各种格式），并且可以利用许多图形函数，还可以用于动画。\n\
  \n表 1.22 `PictureBox` 对象的若干属性。\n\n\n\n\n\n| 属性 | 说明 |\n| :--- | :--- |\n| BackColor\
  \ | 获取或设置图片框的背景颜色。 |\n| BorderStyle | 指定图片框的边缘样式。 |\n| Height | 图片框的高度（单位：像素）。 |\n\
  | Image | 设置在图片框中显示的图形文件。 |\n| Left | 从表单左边缘到图片框左边缘的距离（单位：像素）。 |\n| SizeMode | 指明图片的显示方式。\
  \ |\n| Top | 从表单标题区域到图片框顶边缘的下距离（单位：像素）。 |\n| Width | 图片框的宽度（单位：像素）。 |\n\n### 表 1.23\
  \ PictureBox 对象的一项事件\n\n| 事件 | 说明 |\n| :--- | :--- |\n| Click | 当点击图片框时触发。 |\n\n\
  `Image` 属性指定了要显示的图形文件。可以放置在图像框中的五种图形文件类型如下：\n\n### 表 1.24 PictureBox 控件可接受的图形文件类型\n\
  \n| 文件类型 | 说明 |\n| :--- | :--- |\n| Bitmap | 图像由像素表示，并存储为包含位位的集合。这是扫描仪和画笔程序最常用的格式。格式具有\
  \ `.bmp` 扩展名。 |\n| Icon | 一种特殊的位图文件，最大尺寸为 32 x 32 像素。该格式具有 `.ico` 扩展。图标用于表示 Windows\
  \ 应用程序。 |\n| Metafile | 将图像存储为包含图形对象（线、圆、多边形）的集合的文件，而不是像素。当放大或缩小尺寸时，元文件比位图具有更精确的分率。该格式具有\
  \ `.wmf` 扩展。 |\n| JPEG | JPEG（联合图像专家小组）是一种压缩的 BMP 格式，支持 8 位和 24 位颜色。这种格式在互联网上非常流行，也是数码相机常用的格式。JPEG\
  \ 格式扩展名为 `.jpg`。 |\n| GIF | GIF（图形交换格式）最初由 CompuServe 开发的压缩 bmp 格式。该格式支持多达 256 色，在互联网上同样流行。该格式具有\
  \ `.gif` 扩展。 |\n\n`SizeMode` 属性规定了特定图像将如何显示。该属性可以赋予五个值：`Normal`、`CenterImage`、`StretchImage`、`AutoSize`\
  \ 和 `Zoom`。这些每个值的效果如下：\n\n| SizeMode 的值 | 效果 |\n| :--- | :--- |\n| Normal | 图像按初始大小显示。如果图片框大于图像，会有剩余空间。如果图片框小于图像，图像将被截断。\
  \ |\n| CenterImage | 图像以初始大小显示，并位于图片框的居中。如果图片框大于图像，会有剩余空间。如果图片框小于图像，图像将被截断。 |\n\
  | StretchImage | 图像将“填充”图片框。如果图像小于图片框，图像将放大。如果图像大于图片框，图像将缩小。 |\n| AutoSize | `StretchImage`\
  \ 的相反。图片框将改变其尺寸以适应图像的初始大小。 |\n| Zoom | 与 `StretchImage` 相同。图像将进行调整以便加载到图片框中。 |\n\
  \n请注意，对于 `Normal`、`CenterImage`、`StretchImage` 和 `Zoom` 值，尺寸保持不变。使用 `AutoSize` 时，图片框会改变大小。如果你的表单不够大以加载图片框，这会在程序运行时导致问题。\n\
  \nPictureBox 控件显示图像的通用用途：\n* 设置 `Name` 和 `SizeMode` 属性（通常带有 `StretchImage` 值）。\n\
  * 在设计时和程序运行时（运行时）均指定 `Image` 属性。\n\n# 教程 2：数学游戏\n\n在本教程中，你将构建一个项目，让孩子们可以练习加、减、乘、除运算的基本技能。这个数学游戏项目可以用来选择题目的类型以及你想要使用的因子。该项目有三个计时选项。\n\
