  \ = true;\n        }\n\n        public void Move(Graphics g, Brush bc, int dx, int\
  \ dy)\n        {\n            g.FillRectangle(bc, this.Location);\n            this.Location.X\
  \ += dx;\n            this.Location.Y += dy;\n            g.DrawImage(this.MyImage,\
  \ this.Location);\n        }\n\n        public void Remove(Graphics g, Brush bc)\n\
  \        {\n            g.FillRectangle(bc, this.Location);\n            this.IsVisible\
  \ = false;\n        }\n    }\n\n    public class MovingRudal : TwoPlayer\n    {\n\
