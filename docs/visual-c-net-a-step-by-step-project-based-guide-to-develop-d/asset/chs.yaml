  \n## 教程步骤\n\n### 第 1 步\n你将开始构建赛马游戏项目。在 Visual Basic 中启动一个新项目。建议立即使用你自定义的名称保存。这将为你的项目创建所需的文件夹和文件结构。\n\
  \n### 第 2 步\n在表单上放置两个 `panel`（面板）控件（左侧一个宽度为 100 像素的 `panel`，右侧另一个宽度为 900 像素的 `panel`）。在左面板中放置两个\
  \ `labels`（标签）和四个 `buttons`（按钮）。在右面板中放置一个 `label` 控件和一个 `picture box` 控件。添加一个 `timer`（定时器）控件。现在表单看起来看起来如图\
