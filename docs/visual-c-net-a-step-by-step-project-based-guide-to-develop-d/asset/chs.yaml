  \        for (k = 1; k <= 2; k++)\n        {\n            if (k == 1)\n        \
  \        WhichSymbol = ComputerSymbol;\n            else\n                WhichSymbol\
  \ = PlayerSymbol;\n            for (i = 0; i < 8; i++)\n            {\n        \
  \        n = 0;\n                EmptyBox = 0;\n                for (j = 0; j <\
  \ 3; j++)\n                {\n                    BoxNumber[j] = Convert.ToInt32(WinningArr[i][j]);\n\
