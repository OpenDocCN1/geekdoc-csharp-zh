  trans: "\n大多数计算机程序都会与其用户进行交互。用户需要与其交互的程序提供输入或指令。如今有许多交互方法：基于控制台的、基于浏览器的、基于互联网的、图形化的等。现在，使用控制台进行程序交互的人数正在不断减少。这是因为替代方案（例如基于浏览器的）在便利性和用户友好性方面更好。\n\
    \n## 使用控制台\n\n有时，控制台是用户与程序交互的最重要工具。例如，在创建简单的计算机程序时，你需要使用控制台。这些程序要求你关注必须解决的问题。美观的\
    \ GUI（即图形用户界面）和吸引人的输出对你完成这项任务没有帮助。\n\n你还可以使用控制台在将代码块添加到复杂的程序之前对其进行测试。由于控制台是一个简单的工具，你可以轻松地隔离出代码块，而无需按下任何按钮或查看不同的屏幕。控制台会在几秒钟内提供你所需的结果。\n\
    \n### 访问控制台\n\n访问控制台的过程取决于你当前使用的操作系统。例如，如果你使用的是 Windows 计算机，需要执行以下步骤：\n\n1. 点击“开始”按钮。\n\
    2. 点击“程序”并选择“辅助工具”。\n3. 点击写有“命令提示符”的选项。\n\n控制台将显示你的主目录，由你的用户名表示。在下面的示例中，用户名是 SARAH：\n\
    \n![](img/image00095.jpeg)\n\n**重要提示：** 如果你使用的是 Windows Vista、Windows 7 或 Windows\
    \ 8，可以通过搜索 `cmd` 来启动控制台。\n\n### 关于控制台的附加信息\n\n控制台是一个显示文本信息的黑色窗口。它有一个闪烁的光标并显示字符字符串。如你所见，每当你输入一个字符，光标就会移动。\n\
    \nWindows 程序可以是基于桌面、基于浏览器、基于互联网或基于控制台的。基于控制台的程序利用控制台进行输入和输出过程。另一方面，基于桌面的程序依赖其\
    \ GUI 进行用户程序交互。本书专注于基于控制台的应用程序，因此你将使用键盘输入数据，并在命令提示符中查看结果。\n\n某些基于控制台的应用程序需要用户提供文本、数字、字符等这意味着这意味着操作基于控制台的程序时会经常使用键盘。\n\
    \n## 基本命令\n\n在本节中，你将学习使用命令提示符发布的基本命令。如果你想成为一名优秀的 C# 程序员，应该仔细学习这些材料。\n\n字体 控制台命令\n\
    \n*   `cd name_of_directory` – 此命令允许你更改活动目录。例如，如果你想进入 C: 下的 Users 文件夹，你需要执行以下命令：\n\
    \    `cd C:\\Users`\n*   `dir` – 使用此命令查看活动目录中的文件。\n*   `rmdir name_of_directory`\
    \ – 此命令允许你删除目录。例如，`rmdir Sample` 会删除名为“Sample”的目录。\n*   `mkdir name_of_directory`\
    \ – 使用此命令，你可以在活动目录中创建新目录。例如，如果你当前在 Users 目录，`mkdir John` 将在“Users”内部创建一个名为“John”的文件夹。\n\
    *   `type name_of_file` – 使用此命令查看现有文件的内容。例如，你可能执行 `type HelloCSharp.cs` 来查看该 .cs\
    \ 文件的内容。\n\n### 标准输入输出 (I/O)\n\n标准 I/O 系统是为 UNIX 计算机开发的机制。该系统涉及特殊设备以接受输入和产生输出。\n\
    \n如果程序正在等待用户执行操作或提供信息，控制台将显示光标。这意味着系统处于“等待模式”。\n\n### 输入和输出\n\n操作系统需要定义用于用户程序交互的标准\
    \ I/O 机制。启动基于控制台的应用程序时，程序初始化块中的代码需要与操作系统分配的 I/O 机制配合工作。这些代码允许用户与相关的控制台程序进行交互。\n\
    \n由于这些代码，程序可以从 `Console.In`（即 C# 的标准输入流）读取用户输入，向 `Console.Out`（即 C# 的标准输出流）发送信息，并通过\
    \ `Console.Error`（即 C# 的标准错误流）报告问题情况。\n\n**重要提示：** 你将在书中后部分学习 C# 流。本章将集中于与 C#\
    \ I/O 机制相关的概念和思想。\n\n### I/O 设备\n\n某些程序接受非键盘输入。例如，你可以创建一个 C# 程序，从文本文件、条码器、麦克风和其他数据源获取输入。程序还可以将其输出发送到屏幕、外部文件、打印机等。\n\
    \n### System.Console\n\n名为 `System.Console` 的类具有各种方法和属性，你可以使用它们来读取、显示或格式化文本信息。`System.Console`\
    \ 类最流行的三个属性与输入和显示数据有关。这些属性是：`Console.In`、`Console.Out` 和 `Console.Error`。\n\n\
    这些属性帮助你显示数据、读取信息和报告错误消息。C# 允许你直接使用这些属性。然而，你需要记住 `System.Console` 还包含其他可以帮助你的方法的属性。\n\
    \n**重要提示：** C# 允许你修改默认流。要做到这一点，你需要使用以下方法：`Console.SetOut`（输出）、`Console.SetIn`（输入）和\
    \ `Console.SetError`（错误）。\n\n### 控制台输入\n\n编程语言有一套向控制台输入信息的系统。特别是 C# 语言使用名为 `Console.In`\
    \ 的对象来控制其输入流。\n\n实际上，你不需要直接使用 `Console.In`。`Console` 类提供了两个方法（即 `ReadLine` 和 `Read`），它们与\
    \ `Console.In` 工作。\n\n### Console.ReadLine 方法\n\n此方法为想要从控制台读取数据的人提供了简单方便的方法。当你调用此方法时，你的程序将停止并等待用户输入。然后，用户可能会输入一个字符或字符串并按下“回车”。通过按回车键，用户通知程序他们已输入内容。`ReadLine`\
    \ 方法将读取用户的输入，因此得名。\n\n给出的代码将向你展示 `ReadLine` 如何工作：\n\n```csharp\nclass Test\n{\n\
    \    static void Main()\n    {\n        Console.WriteLine(\"What is your first\
    \ name? \");\n        string firstName = Console.ReadLine();\n        Console.WriteLine(\"\
    Please enter your last name? \");\n        string lastName = Console.ReadLine();\n\
    \        Console.WriteLine(\"Hi, {0} {1}!\", firstName, lastName);\n    }\n}\n\
    ```\n\n如果你在命令提示符中输入“John”和“Smith”，你将获得以下消息：\n\n![](img/image00096.jpeg)\n\n###\
    \ Console.Read 方法\n\n`Console.Read` 和 `Console.ReadLine` 之间存在显著。首先，`Console.Read`\
    \ 只读取单个字符，而 `Console.ReadLine` 读取整个表达式。其次，`Console.Read` 返回代码而不是接受的内容。如果你想将输出作为普通字符使用，你应该执行以下操作：\n\
    \n*   将输出转换为字符\n*   在结果上使用 `Convert.ToChar` 方法\n"
- fmt: "\nImportant Note: `Constant.Read` will only read a character if the user hits\
    \ “Enter”. When the user presses this key, the program will transfer the input\
    \ to the standard string’s buffer and invoke the `Console.Read` method. Check\
    \ the example given below:\n\n![](Images/image00097.jpeg)\n\n# How to Read a Number\n\
    \nC# programs don’t read numbers directly. They need to take the inputs as strings\
    \ (i.e. through the `Console.ReadLine` method) and convert them into numbers.\
    \ The process of converting strings into other data types is known as parsing.\
    \ All of the primitive data types in the C# language support this process.\n\n\
    # The Console Output\n\nThis part of the book will focus on two methods: `Console.WriteLine`\
    \ and `Console.Write`. Both of these methods can print all of the data types in\
    \ C# language. That means you can use them to display messages on the user’s console.\n\
    \nThe following code snippets will teach you how these methods work:\n\n```csharp\n\
    Console.WriteLine(“I want to learn the C# programming language.”);\n// This line\
    \ will print the string inside the parentheses.\n\nConsole.WriteLine(100);\n//\
    \ This line will show “100” on the user’s command prompt.\n\nConsole.WriteLine(3.14);\n\
    // This line will print the double value 3.14 on the user’s console.\n```\n\n\
    You can use the `Console.WriteLine` method to show different kinds of data on\
    \ the user’s screen. That’s because the `Console` class has a built-in version\
    \ of each data type.\n\nThe only difference between `Console.WriteLine` and `Console.Write`\
    \ is that the former prints the value within the parentheses and adds a newline\
    \ character on the console whereas the latter simply shows the information inside\
    \ the parentheses. Thus, using `Console.WriteLine` in your codes is like hitting\
    \ the “Enter” key after showing the message (i.e. The cursor will go to the next\
    \ line.).\n\n# String Concatenation\n\nThe C# language prevents programmers from\
    \ using operators on strings values. Obviously, you can’t perform arithmetic operations\
    \ on actual words (e.g. fish – dog, power * humans, land / people, etc.). However,\
    \ C# allows you to concatenate (i.e. combine) multiple string objects to generate\
    \ a new one. You can do this by using the “+” symbol on your strings. The example\
    \ given below will illustrate this idea.\n\n```csharp\nstring gadget = “smartphone”;\n\
    string example = “I use my ” + gadget + “to access ” + “the internet.”;\nConsole.WriteLine(example);\n\
    ```\n\nIf you’ll execute that code, the console will display this:\n\nI use my\
    \ smartphone to access the internet.\n\n# Chapter 6: The Conditional Statements\
    \ of C#\n\nThis chapter will teach you how to use conditional statements in your\
    \ C# codes. Basically, a conditional statement is a code block that allows you\
    \ to perform various actions based on the assigned condition/s. Read this material\
    \ carefully as it contains valuable information that can help you master C# in\
    \ just 7 days.\n\n# The Operators\n\nIn this section, you’ll learn more information\
    \ about the comparison operators of C#. These operators are extremely important:\
    \ they can help you in setting the conditions for your own conditional statements.\n\
    \n## The Comparison Operators\n\nC# has different operators that you can use to\
    \ compare values of the same type. These operators are:\n\n- `<`\n- `>`\n- `<=`\n\
    - `>=`\n- `!=`\n- `==`\n\nYou may use the operators given above to compare C#\
    \ expressions (e.g. two integers, two variables, two constants, etc.). While using\
    \ any of these operators, the result will always be a Boolean. Analyze the following\
    \ examples:\n\n```csharp\nint height = 170;\nConsole.WriteLine(height < 180);\
    \ // This will give you “true”.\n\nstring gender = “Male”;\nConsole.WriteLine(gender\
    \ == “Female”); // This will give you “false”.\n\ndouble valueofPi = 3.14;\nConsole.WriteLine(valueofPi\
    \ > 100); // This will give you “true”.\n```\n\n## The Logical Operators\n\nC#\
    \ also supports some logical operators. Programmers use these operators to create\
    \ Boolean (also called “logical”) statements. Let’s discuss each logical operator\
    \ in detail:\n\n### The AND and OR Operators\n\nYou can only use the logical AND\
    \ (i.e. `&&`) and logical OR (i.e. `||`) operators on expressions that involve\
    \ Boolean values. The logical AND operator will give you “true” if both of the\
    \ operands are true. For example:\n\n```csharp\nbool sample = (1 < 2) && (10 ==\
    \ 10);\n```\n\nSince 1 is less than 2 and 10 is equal to 10, the expression will\
    \ give you true. Since the logical AND operator provides quick results without\
    \ performing unnecessary analyses, programmers refer to it as a “short-circuit\
    \ operator”. It checks the left section of the statement first. If the evaluation\
    \ is “false”, the operation will immediately stop. The expression can no longer\
    \ be true since one of the operands is false.\n\nThe logical OR (i.e. `||`) operator,\
    \ on the other hand, will give you true if at least one of your operands evaluates\
    \ to true. For instance:\n\n```csharp\nbool sample = ( 1 < 2) || (10 > 100);\n\
    ```\n\nThis example will give you true since the left-hand operand is true. The\
    \ logical OR operator is also a “short-circuit operator”, since it can give a\
    \ result even without checking the entire C# statement. In the current example,\
    \ logical OR will no longer analyze the second operand since the first one is\
    \ already true. Thus, the condition has already been met.\n\n### The Exclusive\
    \ OR and Negation Operators\n\nThe exclusive OR (i.e. `^`) is a full-circuit operator\
    \ since it needs to check both operands before giving the result. It will give\
    \ you true ONLY IF one of the operands evaluates to true. Thus, you’ll get false\
    \ if both of the operands are true. Check the following example:\n\n```csharp\n\
    bool sample = (1 < 2) ^ (2 == 2);\n```\n\nSince the two expressions are true,\
    \ exclusive OR will give you false.\n\nThe negation operator (i.e. `!`), however,\
    \ simply reverses the Boolean value to which it is attached. For instance:\n\n\
    ```csharp\nbool sample = !(1 < 2);\n```\n\nOne is less than two. However, since\
    \ “!” is attached to the Boolean expression, the result will be reversed. That\
    \ means this expression evaluates to “false”.\n\n# The Statements\n\nNow that\
    \ you know how to use the comparison and logical operators, it’s time to discuss\
    \ the creation of conditional statements. These statements are powerful tools\
    \ that can help you achieve programming logic.\n\n## The If Statement\n\nThe syntax\
    \ of an if statement is:\n\n```csharp\nif (the conditional expression)\n{\n  \
    \  The if statement’s body;\n}\n```\n\nAs you can see, this syntax has three parts:\n\
    \n1. The `if` clause – This part indicates the start of the `if` statement.\n\
    2. The Boolean expression – This part can hold a logical expression or a variable\
    \ that holds Boolean data. Unlike C, C# doesn’t accept integer expressions for\
    \ its conditional statements.\n3. The body of the statement – You need to enclose\
    \ this part using a pair of curly braces. C# allows you to place multiple statements\
    \ inside this section.\n\nThe program will run the statement’s body if the Boolean\
    \ expression evaluates to true. If the evaluation is false, the program will ignore\
    \ the statement’s body and pass the control to the succeeding blocks. The example\
    \ given below will show you how “if” statements work:\n\n```csharp\nConsole.WriteLine(“Please\
    \ enter a number.”);\nint number1 = int.Parse(Console.ReadLine());\nint number2\
    \ = 0;\n\nif (number1 > number2)\n{\n    Console.WriteLine(“C# is an excellent\
    \ language.”);\n}\n```\n\nThis code requires the user to provide a number. If\
    \ the user’s input is higher than zero, the program will print “C# is an excellent\
    \ language.” in the command prompt.\n\nImportant Note: You may omit the curly\
    \ braces if the body of your conditional statement is just a single line. Check\
    \ the example below:\n\n```csharp\nint x = 10;\nif (x > 0)\n    System.Console.WriteLine(“This\
    \ variable holds a positive number.”);\n```\n\n### The If-Else Statement\n\nJust\
    \ like other programming languages, C# supports “if-else” conditional statements.\
    \ When writing an if-else statement, you should use the following syntax:\n\n\
    ```csharp\nif (the Boolean variable or expression)\n{\n    The conditional statement’s\
    \ body;\n}\nelse\n{\n    The else statement’s body;\n}\n```\n"
  raw: 'Important Note: Constant.Read will only read a character if the user hits
    “Enter”. When the user presses this key, the program will transfer the input to
    the standard string’s buffer and invoke the Console.Read method. Check the example
    given below:


    ![](Images/image00097.jpeg)


    How to Read a Number


    C# programs don’t read numbers directly. They need to take the inputs as strings
    (i.e. through the Console.ReadLine method) and convert them into numbers. The
    process of converting strings into other data types is known as parsing. All of
    the primitive data types in the C# language support this process.


    The Console Output


    This part of the book will focus on two methods: Console.WriteLine and Console.Write.
    Both of these methods can print all of the data types in C# language. That means
    you can use them to display messages on the user’s console.


    The following code snippets will teach you how these methods work:


    Console.WriteLine(“I want to learn the C# programming language.”);


    // This line will print the string inside the parentheses.


    Console.WriteLine(100);


    // This line will show “100” on the user’s command prompt.


    Console.WriteLine(3.14);


    // This line will print the double value 3.14 on the user’s console.


    You can use the Console.WriteLine method to show different kinds of data on the
    user’s screen. That’s because the Console class has a built-in version of each
    data type.


    The only difference between Console.WriteLine and Console.Write is that the former
    prints the value within the parentheses and adds a newline character on the console
    whereas the latter simply shows the information inside the parentheses. Thus,
    using Console.WriteLine in your codes is like hitting the “Enter” key after showing
    the message (i.e. The cursor will go to the next line.).


    String Concatenation


    The C# language prevents programmers from using operators on strings values. Obviously,
    you can’t perform arithmetic operations on actual words (e.g. fish – dog, power
    * humans, land / people, etc.). However, C# allows you to concatenate (i.e. combine)
    multiple string objects to generate a new one. You can do this by using the “+”
    symbol on your strings. The example given below will illustrate this idea.


    string gadget = “smartphone”;


    string example = “I use my ” + gadget + “to access ” + “the internet.”;


    Console.WriteLine(example);


    If you’ll execute that code, the console will display this:


    I use my smartphone to access the internet.


    Chapter 6: The Conditional Statements of C#


    This chapter will teach you how to use conditional statements in your C# codes.
    Basically, a conditional statement is a code block that allows you to perform
    various actions based on the assigned condition/s. Read this material carefully
    as it contains valuable information that can help you master C# in just 7 days.


    The Operators


    In this section, you’ll learn more information about the comparison operators
    of C#. These operators are extremely important: they can help you in setting the
    conditions for your own conditional statements.


    The Comparison Operators


    C# has different operators that you can use to compare values of the same type.
    These operators are:


    *   <


    *   >


    *   <=


    *   >=


    *   !=


    *   ==


    You may use the operators given above to compare C# expressions (e.g. two integers,
    two variables, two constants, etc.). While using any of these operators, the result
    will always be a Boolean. Analyze the following examples:


    int height = 170;


    Console.WriteLine(height < 180); // This will give you “true”.


    string              gender = “Male”;


    Console.WriteLine(gender == “Female”); // This will give you “false”.


    double valueofPi = 3.14;


    Console.WriteLine(valueofPi > 100); // This will give you “true”.


    The Logical Operators


    C# also supports some logical operators. Programmers use these operators to create
    Boolean (also called “logical”) statements. Let’s discuss each logical operator
    in detail:


    The AND and OR Operators


    You can only use the logical AND (i.e. &&) and logical OR (i.e. ||) operators
    on expressions that involve Boolean values. The logical AND operator will give
    you “true” if both of the operands are true. For example:


    bool sample = (1 < 2) && (10 == 10);


    Since 1 is less than 2 and 10 is equal to 10, the expression will give you true.
    Since the logical AND operator provides quick results without performing unnecessary
    analyses, programmers refer to it as a “short-circuit operator”. It checks the
    left section of the statement first. If the evaluation is “false”, the operation
    will immediately stop. The expression can no longer be true since one of the operands
    is false.


    The logical OR (i.e. ||) operator, on the other hand, will give you true if at
    least one of your operands evaluates to true. For instance:


    bool sample = ( 1 < 2) || (10 > 100);


    This example will give you true since the left-hand operand is true. The logical
    OR operator is also a “short-circuit operator”, since it can give a result even
    without checking the entire C# statement. In the current example, logical OR will
    no longer analyze the second operand since the first one is already true. Thus,
    the condition has already been met.


    The Exclusive OR and Negation Operators


    The exclusive OR (i.e. ^) is a full-circuit operator since it needs to check both
    operands before giving the result. It will give you true ONLY IF one of the operands
    evaluates to true. Thus, you’ll get false if both of the operands are true. Check
    the following example:


    bool sample = (1 < 2) ^ (2 == 2);


    Since the two expressions are true, exclusive OR will give you false.


    The negation operator (i.e. !), however, simply reverses the Boolean value to
    which it is attached. For instance:


    bool sample = !(1 < 2);


    One is less than two. However, since “!” is attached to the Boolean expression,
    the result will be reversed. That means this expression evaluates to “false”.


    The Statements


    Now that you know how to use the comparison and logical operators, it’s time to
    discuss the creation of conditional statements. These statements are powerful
    tools that can help you achieve programming logic.


    The If Statement


    The syntax of an if statement is:


    if (the conditional expression)


    {


                  The if statement’s body;


    }


    As you can see, this syntax has three different parts:


    1.  The “if” clause – This part indicates the start of the “if” statement.


    2.  The Boolean expression – This part can hold a logical expression or a variable
    that holds Boolean data. Unlike C, C# doesn’t accept integer expressions for its
    conditional statements.


    3.  The body of the statement – You need to enclose this part using a pair of
    curly braces. C# allows you to place multiple statements inside this section.


    The program will run the statement’s body if the Boolean expression evaluates
    to true. If the evaluation is false, the program will ignore the statement’s body
    and pass the control to the succeeding code blocks. The example given below will
    show you how “if” statements work:


    Console.WriteLine(“Please enter a number.”);


    int number1 = int.Parse(Console.ReadLine());


    int number2 = 0;


    if (number1 > number2)


    {


                  Console.WriteLine(“C# is an excellent programming language.”);


    }


    This code requires the user to provide a number. If the user’s input is higher
    than zero, the program will print “C# is an excellent programming language.” in
    the command prompt.


    Important Note: You may omit the curly braces if the body of your conditional
    statement is just a single line. Check the example below:


    int x = 10;


    if (x > 0)


                  System.Console.WriteLine(“This variable holds a positive number.”);


    The If-Else Statement


    Just like other programming languages, C# supports “if-else” conditional statements.
    When writing an if-else statement, you should use the following syntax:


    if (the Boolean variable or expression)


    {


                  The conditional statement’s body;


    }


    else


    {


                  The else statement’s body;


    }'
