    \ it holds the value stored by the programmer. The Value Type category consists\
    \ of the Booleans, Characters, and Integers. The memory assigned to these data\
    \ types becomes available once the program finishes its code execution. For instance,\
    \ the variables within the `Main()` method of your program will be emptied once\
    \ the program is closed.\n\nA reference type, on the other hand, stores an address\
    \ (i.e. a reference) in the program’s stack. This address points to the location\
    \ of the needed value. Basically, a reference type assigns dynamic memory during\
    \ its declaration. It also frees up some memory once the program no longer needs\
    \ it.\n\n# The Literals\n\nLiterals are the values specified in a program’s source\
    \ code. The example given below will illustrate this idea:\n\n```csharp\nbool\
    \ isitdelicious = false;\nshort income = 22000;\nchar firstletter = ‘c’;\nbyte\
    \ ten = 10;\nint prize = 250000;\n```\n\nIn this example, the literals are `false`,\
    \ `22000`, `‘c’`, `10` and `250000`. These are values that you’ll add directly\
    \ to the program’s code.\n\n# The Different Kinds of Literals\n\nC# supports the\
    \ following kinds of literals:\n\n* Real\n* Integer\n* String\n* Character\n*\
    \ Boolean\n\nLet’s discuss each of these literals in detail:\n\n## Real\n\nA real\
    \ literal has a sign (i.e. `+` or `-`), a suffix, a prefix, and a decimal point.\
    \ You should use this kind of literal for `double`, `float`, and `decimal` values.\
    \ C# allows you to write real literals in their exponent form. Here are the suffixes\
    \ that you can apply on real literals:\n\n* `F` – This suffix represents `float`\
    \ values.\n* `D` – Use this suffix to indicate `double` values.\n* `M` – This\
    \ letter indicates `decimal` values.\n* `E` – Use this letter for exponential\
    \ values. For instance, “e4” means you need to multiply the integer by 104.\n\n\
    ## Integer\n\nAn integer literal consists of a prefix, a suffix, a sign (i.e.\
    \ `+` or `-`), and a set of digits. You can use prefixes to add numbers in your\
    \ code as decimals or hexadecimals. Here are the prefixes and suffixes that you\
    \ can use in C#:\n\n* `0X` (e.g. `0XA6F2`) – Use this prefix to indicate a hexadecimal\
    \ value.\n* `U` (e.g. `119U`) – This suffix represents unsigned `int` (`uint`)\
    \ or unsigned `long` (`ulong`) values.\n* `L` (e.g. `360L`) – Use this suffix\
    \ for “long” values.\n\n**Important Note:** C# will tag integer literals as “int”\
    \ if you won’t use any suffix. Also, the letters (i.e. `L`, `U` and `X`) are not\
    \ case-sensitive.\n\n## String\n\nUse this literal for string values. Basically,\
    \ a string literal is a set of characters placed within a pair of double quotes\
    \ (e.g. “sample”).\n\n**Important Note:** In the C# language, you may use the\
    \ `@” symbol to create quoted (or verbatim) strings. Programmers use these strings\
    \ for naming file paths.\n\n## Character\n\nA character literal is a single character\
    \ enclosed by a pair of single quotes (e.g. ‘z’). Use character literals to set\
    \ values that belong to the `char` type. Additionally, you may write a character\
    \ literal as:\n\n* a single character (e.g. ‘X’)\n* a code for a special character\
    \ (e.g. ‘\\u0067’)\n* an escape code (see below)\n\n**Escape Codes** – These are\
    \ special character sequences that add characters to your source code. In general,\
    \ the characters involved here cannot be added straight to the program’s codes.\n\
    \nC# prevents you from adding some characters straight to your programs. Some\
    \ of these characters are: tabs, newlines, backslashes, quotation marks, etc.\
    \ The following list will show you the most popular escape codes in C#:\n\n* `\\\
    \\` – Newline Character\n* `\\t` – Tab Character\n* `\\'` – Single Quotation Mark\n\
    * `\\\"` – Double Quotation Mark\n\n## Boolean\n\nThere are only two types of\
    \ Boolean literals: `true` and `false`. You can only assign one of these values\
    \ when working with a `bool` (i.e. Boolean) variable. The code snippet given below\
    \ will show you how to declare a Boolean literal:\n\n```csharp\nbool answer =\
    \ false;\n```\n\n# Chapter 3: The Operators of C#\n\nThis chapter will focus on\
    \ operators of C#. By reading this material, you’ll know how operators work and\
    \ how to use them.\n\n## The Basics\n\nOperators help you in processing data.\
    \ They accept inputs to produce a result.\n\n## The Different Types of Operators\n\
    \nC# divides operators into the following:\n\n### Assignment Operator\n\nIn C#,\
    \ you need `=` to assign values. Here’s some examples:\n\n```csharp\nint y = 99;\n\
    string hello = “Good”;\nchar sample = ‘z’;\n```\n\n**Important Note:** C# allows\
    \ you to use `=` multiple times. Here are some examples:\n\n```csharp\nint d =\
    \ 100;\ne = 3;\n```\n\n### Arithmetic Operators\n\nThese operators help you performing\
    \ math. This category consists of the following:\n\n* `+` – Use this operator\
    \ to perform addition using two values (e.g. `+1`).\n* `-` – This operator allows\
    \ you to subtract the value of the right operand from that of the left operand\
    \ (e.g. `-1`).\n* `*` – With this operator, you can multiply two operands (e.g.\
    \ `*6`).\n* `/` – Use this operator to divide the left-hand operand by that of\
    \ the right-hand operand.\n* `++` – This is known as the increment operator. It\
    \ increases the value of an operand by one. You may write it before or after the\
    \ operand (e.g. `99++`, `++5`).\n* `--` – This operator is the exact opposite\
    \ of the increment operator. You can use it to decrease an operand’s value by\
    \ one. You may write it before or after the operand you want to modify. The code\
    \ below will show you how these work:\n\n```csharp\nclass Test {\n    static void\
    \ Main() {\n        double d = 100, e = 3;\n        Console.WriteLine(d + e);\n\
    \        Console.WriteLine(d - e);\n        Console.WriteLine(d / e);\n      \
    \  Console.WriteLine(d * e);\n        Console.WriteLine(++d);\n        Console.WriteLine(--e);\n\
    \    }\n}\n```\n\n### Logical Operators\n\nLogical operators work with Boolean\
    \ values:\n\n* `&&` – Known as “AND”. It returns true if both operands are true.\n\
    * `^` – This is “Exclusive OR”. It returns true if operands are different.\n*\
    \ `||` – “OR”. It returns true if at least one is true.\n* `!` – Known as “Negation”.\
    \ It reverses the value.\n\nHere are some examples:\n\n```csharp\nclass Test {\n\
    \    static void Main() {\n        bool x = true, y = false;\n        Console.WriteLine(x\
    \ && y);\n        Console.WriteLine(x || y);\n        Console.WriteLine(!x);\n\
    \        Console.WriteLine(x ^ y);\n    }\n}\n```\n"
  raw: 'A value type exists inside the execution stack of a program. Additionally,
    it holds the value stored by the programmer. The Value Type category consists
    of the Booleans, Characters, and Integers. The memory assigned to these data types
    becomes available once the program finishes its code execution. For instance,
    the variables within the Main() method of your program will be emptied once the
    program is closed.


    A reference type, on the other hand, stores an address (i.e. a reference) in the
    program’s stack. This address points to the location of the needed value. Basically,
    a reference type assigns dynamic memory during its declaration. It also frees
    up some memory once the program no longer needs it.


    The Literals


    Literals are the values specified in a program’s source code. The example given
    below will illustrate this idea:


    bool isitdelicious = false;


    short income = 22000;


    char firstletter = ‘c’;


    byte ten = 10;


    int prize = 250000;


    In this example, the literals are false, 22000, ‘c’, 10 and 250000\. These are
    values that you’ll add directly to the program’s code.


    The Different Kinds of Literals


    C# supports the following kinds of literals:


    *   Real


    *   Integer


    *   String


    *   Character


    *   Boolean


    Let’s discuss each of these literals in detail:


    Real


    A real literal has a sign (i.e. + or -), a suffix, a prefix, and a decimal point.
    You should use this kind of literal for double, float, and decimal values. C#
    allows you to write real literals in their exponent form. Here are the suffixes
    that you can apply on real literals:


    *   F – This suffix represents float values.


    *   D – Use this suffix to indicate double values.


    *   M – This letter indicates decimal values.


    *   E – Use this letter for exponential values. For instance, “e4” means you need
    to multiply the integer by 104.


    Integer


    An integer literal consists of a prefix, a suffix, a sign (i.e. + or -), and a
    set of digits. You can use prefixes to add numbers in your code as decimals or
    hexadecimals. Here are the prefixes and suffixes that you can use in C#:


    *   0X (e.g. 0XA6F2) – Use this prefix to indicate a hexadecimal value.


    *   U (e.g. 119U) – This suffix represents unsigned int (uint) or unsigned long
    (ulong) values.


    *   L (e.g. 360L) – Use this suffix for “long” values.


    Important Note: C# will tag integer literals as “int” if you won’t use any suffix.
    Also, the letters (i.e. L, U and X) are not case-sensitive.


    String


    Use this literal for string values. Basically, a string literal is a set of characters
    placed within a pair of double quotes (e.g. “sample”).


    Important Note: In the C# language, you may use the “@” symbol to create quoted
    (or verbatim) strings. Programmers use these strings for naming file paths.


    Character


    A character literal is a single character enclosed by a pair of single quotes
    (e.g. ‘z’) Use character literals to set values that belong to the “char” type.
    Additionally, you may write a character literal as:


    *   a single character (e.g. ‘X’)


    *   a code for a special character (e.g. ‘\u0067’)


    *   an escape code (see below)


    Escape Codes – These are special character sequences that add characters to your
    source code. In general, the characters involved here cannot be added straight
    to the program’s codes.


    C# prevents you from adding some characters straight to your programs. Some of
    these characters are: tabs, newlines, backslashes, quotation marks, etc. The following
    list will show you the most popular escape codes in C#:


    *   \\ – Newline Character


    *   \t – Tab Character


    *   \’ – Single Quotation Mark


    *   \” – Double Quotation Mark


    Boolean


    There are only two types of Boolean literals: true and false. You can only assign
    one of these values when working with a “bool” (i.e. Boolean) variable. The code
    snippet given below will show you how to declare a Boolean literal:


    bool answer = false;


    Chapter 3: The Operators of the C# Language


    This chapter will focus on the operators of C#. By reading this material, you’ll
    know how these operators work and how you can use them in your source codes.


    Operators – The Basics


    Operators help you in processing objects and data types. They accept inputs and
    operands to produce a result. The C# language uses special characters (e.g. “.”,
    “+”, “^”, etc.) as operators. Also, C# codes can take up to three different operands.


    The Different Types of Operators


    C# programmers divide operators into the following types:


    Assignment Operator


    In C#, you need to use the equals sign (i.e. =) to assign values. Here’s the syntax
    that you need to use when assigning a value:


    name_of_operand = expression, literal, or second_operand


    Here are some examples:


    int y = 99;


    string hello = “Good morning.”;


    char sample = ‘z’;


    Important Note: C# allows you to cascade (i.e. use several times within a single
    expression) the assignment operator. That means you won’t have to enter multiple
    equals signs if you are creating variables of the same data type. The examples
    given below will illustrate this rule:


    int d = 1, e = 2, f = 3;


    string hi = “Good Morning.”, bye = “Farewell.”, thanks = “Thank you.”;


    Logical Operators


    A logical (also known as “Boolean”) operator accepts and returns Boolean values
    (i.e. true or false). Here are the four logical operators of C#:


    *   “&&” – Programmers refer to this operator as “Logical AND”. It will give you
    “true” if both of the operands are true.


    *   “^” – This is known as the “Exclusive OR” operator. It will give you true
    if one of the operands is true.


    *   “||” – This is the “Logical OR” operator. You will get true if at least one
    of the operators is true.


    *   “!” – This operator, known as the “Logical Negation” operator, reverses the
    value of an operand.


    The following code will show you how to use these operators:


    class Test


    {


                  static void Main()


                  {


                  bool x = true, y = false;


                  System.Console.WriteLine(x && y);


                  System.Console.WriteLine(x || y);


                  System.Console.WriteLine(!x);


                  System.Console.WriteLine(x ^ y);


    // This is an example.


                  }


    }


    Once you have compiled and run this code, you will see the following results:


    ![](Images/image00092.jpeg)


    Arithmetic Operators


    These operators help you in performing math operations. This category consists
    of the following operators:


    *   “+” – Use this operator to perform addition using two values (e.g. int x =
    1 + 1)


    *   “-” – This operator allows you to perform subtraction in your codes. It deducts
    the value of the right operand from that of the left operand (e.g. int x = 2 –
    1)


    *   “*” – With this operator, you can multiply the values of two operands (e.g.
    int r = 6 * 6)


    *   “/” – Use this operator to divide number values in your C# codes. Basically,
    “/” divides the value of the left-hand operand by that of the right-hand operand.


    *   “++” – This is known as the “increment operator”. It increases the value of
    an operand by one. Unlike the ones discussed above, this operator works on a single
    operand. Also, you may write it before or after the operand. (e.g. 99++, 1++,
    ++5, etc.)


    *   “--” – This operator is the exact opposite of the increment operator. You
    can use it to decrease an operand’s value by one. You may write it before or after
    the operand you want to modify.


    The code given below will show you how these operators work:


    class Test


    {


                  static void Main()


                  {


                  double d = 100, e = 3;


                  System.Console.WriteLine(d + e);


                  System.Console.WriteLine(d - e);


                  System.Console.WriteLine(d / e);


                  System.Console.WriteLine(d * e);


                  System.Console.WriteLine(++d);


                  System.Console.WriteLine(--e);


    // This is an example.


                  }


    }


    Once you compile and execute that code, you’ll see this on your command prompt:


    ![](Images/image00093.jpeg)


    Binary Operators'
