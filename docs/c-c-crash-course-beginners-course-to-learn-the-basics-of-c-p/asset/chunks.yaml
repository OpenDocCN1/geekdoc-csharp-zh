    \n```csharp\nfor (initializer; Boolean_expression; update)\n{\n    the_loop’s_body;\n\
    }\n```\n\n一个“for”循环包含一个初始化器（即计数器的初始值）、一个布尔表达式、一个更新计数器的 C# 语句以及循环体。\n\n“计数器”（即分配给循环的初始值）是“for”循环最显著的特征。在大多数情况下，计数器的值会一直增加，直到它达到最终值（例如从\
    \ 1 到 10）。此外，程序员通常知道“for”循环将迭代多少次。\n\n你可以在“for”循环中包含一个或多个变量。这些变量可以可以按降序或升序顺序移动。在编写程序时，你可以在单个“for”循环中结合升序和降序变量。此外，由于“for”循环支持算术运算（例如加法、乘法等），升序变量可以从\
    \ 1 变为 1024。\n\n**重要提示：** “for”循环的所有部分都是可选的。你可以通过在语法中留空来创建一个无限的“for”循环。这里有一个示例：\n\
    \n![](img/image00102.jpeg)\n\n此时，你已经准备好学习更多关于“for”循环的不同部分了。\n\n### 初始化\n\n“for”循环可以拥有一个初始化片段：\n\
    \n```csharp\nfor (double sample = 1; …;   …)\n{\n    // 你可以在这里使用“sample”变量。\n\
    }\n// 你不能在在这里使用该变量。\n```\n\nC# 程序在运行“for”循环之前会执行一次此片段。程序员通常使用初始化片段来创建一个计数器（也称为“循环变量”）并为其分配初始值。该计数器在循环体内部是可用且可操作的。C#\
    \ 允许你使用单个初始化片段声明多个变量。\n\n### 条件\n\n显然，“for”循环需要一个条件表达式。这里有一个示例：\n\n```csharp\n\
    for (double sample = 1; sample < 5; …)\n{\n    // 这是循环体。\n}\n```\n\n计算机程序在运行循环体之前会评估条件表达式。如果结果为“true”，则循环体将运行；否则，相关程序将跳转到在当前循环之后的语句。\n\
    \n### 更新语句\n\n这是“for”循环的最后部分。基本上，更新语句会更新循环的计数器。让我们使用上面提供的代码段：\n\n```csharp\nfor\
    \ (double sample = 10; sample > 1; sample--)\n{\n    // 这是循环体。\n}\n```\n\n程序在运行循环体后执行此部分。请记住，该语句会更新计数器的值。\n\
    \n### 循环体\n\n此部分由 C# 语句组成。它可以利用你在循环初始化片段中声明的变量。查看下面的示例：\n\n```csharp\nfor (double\
    \ sample = 10; sample > 1; sample--)\n{\n    System.Console.WriteLine(sample);\n\
    }\n```\n\n在某些情况下，你需要停止当前的迭代但不结束循环本身。你可以使用 C# 中名为“continue”的运算符来完成此任务。提供的示例将说明该运算符如何工作：\n\
    \n![](img/image00103.jpeg)\n\n此代码计算范围（1 到 n）内所有被 7 除余数的奇数总和。\n\n### “Foreach”循环\n\
    \n最近，C# 引入了“foreach”循环的概念（即扩展的“for”循环）。这种循环概念也存在于其他编程语言中，如 C、VB、C++、PHP 等。通过这个编程工具，你可以运行列表、数组或其他值组的所有元素。“foreach”循环即使对于非索引数据组也能获取其中的所有现有元素。\n\
    \n在编写这种循环时，请使用以下语法：\n\n```csharp\nforeach (type name_of_variable in name_of_group)\n\
    {\n    the_statements;\n}\n```\n\n如你所见，这种循环比典型的“for”循环简单得多。“foreach”循环可以帮助你快速扫描集合中的所有对象。无数程序员在编写代码时使用这种循环这并不意外。\n\
    \n### 嵌套 for 循环\n\nC# 允许你将一个“for”循环放在另一个“for”循环内部。代码最内层部分的循环运行次数最多。而最外层的循环重复次数最少。你应该使用以下语法：\n\
    \n```csharp\nfor (initializing_fragment, condition, update)\n{\n    for (initializing_fragment,\
    \ condition, update)\n    {\n        the_statements;\n    }\n}\n```\n\n"
