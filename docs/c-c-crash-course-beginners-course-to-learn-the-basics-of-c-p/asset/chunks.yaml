  trans: "\n\n这些操作符作用于二进制数。在 IT 世界中，所有的信息都表示为 0 和 1 的序列。这意味着如果你想成为一名成功的程序员，你就需要掌握二进制操作符。\n\
    \n二进制操作符的工作方式与逻辑运算符完全相同。实际上，你可能认为二进制运算符和逻辑运算符使用的输入不同，但执行相同的相同。逻辑运算符使用布尔值来产生结果。而二进制操作符作用于以二进制位表示的数字。以下是你在使用\
    \ C# 时会遇到的二进制操作符：\n\n- `&` – 这被称为 `Binary AND`（二进制位与）。它表示两个操作数位均为 `1` 的位置。\n-\
    \ `^` – 程序员将此运算符称为 `Binary Exclusive OR`（二进制位异或）。它会在值不同的位置上放置 `1`。\n- `|` – 这是\
    \ `Binary OR`（二进制位或）运算符。它表示任何一个操作数位为 `1` 的位置。\n- `~` – 它作为二进制值的取反运算符。就像 `!` 一样，它会反转变量当前的值。\n\
    - `<<` – 这是 `Binary Left Shift`（二进制左移）运算符。它将二进制数的位向左移动。这种移动取决于你将赋值的值（例如 `4 <<\
    \ 1`、`4 << 3`、`4 << 2` 等）。\n\n### 比较运算符\n\n这些操作符允许你比较两个操作数内部的值。这些操作符中的每一个都输出布尔值作为最终结果。以下是\
    \ C# 语言的比较运算符：\n\n- `==` – 这是相等运算符（Equality operator）。它检查两个操作数是否相等（例如 `x == y`）。\n\
    - `>` – 此运算符检查左侧操作数的值是否大于右侧操作数的值（例如 `x > y`）。\n- `<` – 此运算符比较两个操作数的值。如果左侧操作数的值小于右侧操作数，它将返回\
    \ `true`（例如 `y < x`）。\n- `>=` – 使用此运算符，你可以判断左侧操作数的值是否大于或等于右侧操作数的值。\n- `<=` – 如果左侧操作数的值小于或等于右侧操作数的值，此运算符将返回\
    \ `true`。\n- `!=` – 使用此运算符检查两个操作数的相等性。如果值不相等，它将返回 `true`（例如 `x != y`）。\n\n###\
    \ 条件运算符\n\nC# 用户将 `?` 称为条件运算符（conditional operator）。基本上，该操作符使用布尔表达式的结果来确定应该处理哪个语句。这被称为\
    \ `ternary operator`（三元运算符），因为它作用于三个操作数。在这里，第一个值应该是布尔值，而其余的值需要属于相同的数据类型（例如字符、字符串、数字等）。\n\
    \n该操作符的语法为：\n\n```\nfirst_operand ? second_operand : third_operand;\n```\n\n它的工作原理是：如果\
    \ `first_operand` 为真，程序将处理 `second_operand`。然而，如果 `first_operand` 为假，程序将处理 `third_operand`。\n\
    \n### 第 4 章：数据类型转换\n\n通常情况下，操作符作用于属于相同类型的参数。然而，C# 语言提供了许多数据类型，你可以用于特定情况。为了对属于不同类型的变量进行任何处理，你应该先转换其中一个变量。在\
    \ C# 中，数据类型转换可以是隐式的或显式的。\n\n每个 C# 表达式都有一种数据类型。这种数据类型取决于表达式内部使用的字面量、变量、值和结构。基本上，你可能会使用一个类型与情况不兼容的表达式。当这种情况发生时，你会得到以下结果之一：\n\
    \n- 程序将给你一个编译时错误。\n- 程序将执行自动转换。这意味着程序将获得正确的表达式类型。\n\n将 `s` 类型转换为 `t` 类型允许你在运行程序时将\
    \ `s` 视为 `t`。有时，这个过程需要程序员来验证类型转换。检查下面的示例：\n\n- 将 `objects` 转换为 `strings` 需要在程序运行时进行验证。这种验证确保你确实想将这些值作为字符串使用。\n\
    - 将 `string` 值转换为 `object` 值不需要验证。\n\n#### 隐式转换\n\n将 `s` 类型转换为 `t` 类型允许你在运行程序时将\
    \ `s` 视为 `t`。有时，这个过程需要程序员来验证类型转换。检查下面的示例：\n\n```csharp\nclass Example\n{\n   \
    \ static void Main()\n    {\n        double varDouble = 2.1;\n        Console.WriteLine(varDouble);\n\
    \n        long varLong = (long)varDouble;\n        Console.WriteLine(varLong);\n\
    \n        double varDouble2 = 2e9;\n        Console.WriteLine(varDouble2);\n\n\
    \        int varInt = (int)varDouble2;\n        Console.WriteLine(varInt);\n \
    \   }\n}\n```\n\n#### 显式转换\n\n如果存在损失可能，请使用这种转换。例如，在将浮点值转换为整数时会发生损失。这是下面的示例：\n\n\
    ```csharp\nclass Example\n{\n    static void Main()\n    {\n        double varDouble\
    \ = 2.1;\n        Console.WriteLine(varDouble);\n\n        long varLong = (long)varDouble;\n\
    \        Console.WriteLine(varLong);\n\n        double varDouble2 = 2e9;\n   \
    \     Console.WriteLine(varDouble2);\n\n        int varInt = (int)varDouble2;\n\
    \        Console.WriteLine(varInt);\n    }\n}\n```\n\n#### 字符串转换\n\nC# 允许将任何数据类型转换为\
    \ `string`。如果你使用 `+` 且至少有一个非字符串参数，编译器将自动执行此过程。\n\n"
- fmt: "\nMost computer programs interact with their user/s. Users need to provide\
    \ inputs or instructions to the program they are interacting with. There are a\
    \ lot of interaction methods available these days: console-based, browser-based,\
    \ internet-based, graphical, etc. Now, the people who use consoles for program\
    \ interactions are continuously decreasing. That’s because the alternative options\
    \ (e.g. browser-based) are better in terms of convenience and user-friendliness.\n\
    \n## Using the Console\n\nSometimes, the console serves as the most important\
    \ tool for user-program interactions. For instance, you need to use the console\
    \ when creating simple computer programs. These programs require you to focus\
    \ on the problems that must be fixed. Beautiful GUIs (i.e. graphical user interface)\
    \ and attractive outputs won’t help you with this task.\n\nYou can also use the\
    \ console to try a small code block before adding it to a complex program. Since\
    \ the console is a simple tool, you can easily isolate the code block without\
    \ pressing any button or seeing different screens. The console will give you the\
    \ results that you need in just a few seconds.\n\n### Accessing the Console\n\n\
    The process of accessing the console depends on the OS you’re currently using.\
    \ For instance, here are the steps you need to take if you are using a Windows\
    \ computer:\n\n1. Click on the Start button.\n2. Click “Programs” and choose “Accessories”.\n\
    3. Click on the option that says “Command Prompt”.\n\nThe console will display\
    \ your home directory, which is represented by your username. In the example below,\
    \ the username is SARAH:\n\n![](Images/image00095.jpeg)\n\n**Important Note:**\
    \ If you’re using Windows Vista, Windows 7, or Windows 8, you can launch the console\
    \ by running a search for `cmd`.\n\n### Additional Information About the Console\n\
    \nThe console is a black window that displays text-based information. It has a\
    \ blinking cursor and shows character strings. As you can see, the cursor moves\
    \ each time you type a character.\n\nA Windows program can be desktop-based, browser-based,\
    \ internet-based, or console-based. A console-based program utilizes the console\
    \ for input and output processes. Desktop-based programs, on the other hand, rely\
    \ on their GUI for user-program interactions. This book focuses on console-based\
    \ applications so you’ll be entering data using your keyboard and you will see\
    \ the results within the command prompt.\n\nCertain console-based applications\
    \ require the users to provide text, numbers, characters, etc. That means you’ll\
    \ be using your keyboard often while working with a console-based program.\n\n\
    ## The Basic Commands\n\nIn this section, you’ll learn about the basic commands\
    \ that you issue using the command prompt. You should study this material carefully\
    \ if you want to be a great C# programmer.\n\n### The Console Commands\n\n*  \
    \ `cd name_of_directory` – This command allows you to change the active directory.\
    \ For instance, if you want to go to the Users folder inside C:, you need to issue\
    \ the following command:\n    `cd C:\\Users`\n*   `dir` – Use this command to\
    \ view the files inside the active directory.\n*   `rmdir name_of_directory` –\
    \ This command allows you to delete a directory. For example, `rmdir Sample` deletes\
    \ the directory named “Sample”.\n*   `mkdir name_of_directory` – With this command,\
    \ you can create a new directory inside the active directory. For instance, if\
    \ you’re currently in the Users directory, `mkdir John` will create a folder named\
    \ “John” inside “Users”.\n*   `type name_of_file` – Use this command to view the\
    \ content of an existing file. For instance, you may issue `type HelloCSharp.cs`\
    \ to see the contents of that .cs file.\n\n### Standard I/O\n\nThe Standard I/O\
    \ system is a mechanism developed for UNIX computers. This system involves special\
    \ devices to accept input and produce output.\n\nIf a program is waiting for the\
    \ user to perform an action or provide information, the console will show a cursor.\
    \ This means the system is in “waiting mode”.\n\n### Input and Output\n\nOperating\
    \ systems need to define the standard I/O mechanisms for user-program interactions.\
    \ When launching a console-based application, the code at the program’s initialization\
    \ block needs to work with I/O mechanisms assigned by the OS. This code allows\
    \ the user to interact with the console-based program involved.\n\nBecause of\
    \ this code, the program can read the user’s input from `Console.In` (i.e. C#’s\
    \ standard stream for inputs), send information to `Console.Out` (i.e. C#’s standard\
    \ stream for outputs), and report problematic situations through `Console.Error`\
    \ (i.e. C#’s standard stream for error messages).\n\n**Important Note:** You’ll\
    \ learn about C# streams later in this book. This chapter will concentrate on\
    \ the concepts and ideas related to C#’s I/O mechanisms.\n\n### The I/O Devices\n\
    \nSome programs accept non-keyboard inputs. For example, you can create a C# program\
    \ that takes inputs from text files, barcode readers, microphones, and other data\
    \ sources. A program can also send its output to the screen, to an external file,\
    \ to a printer, etc.\n\n### System.Console\n\nThe class named `System.Console`\
    \ has various methods and attributes that you can use to read, display, or format\
    \ text-based information. Three of the most popular attributes of the `System.Console`\
    \ class are related to entering and showing data. These attributes are: `Console.In`,\
    \ `Console.Out`, and `Console.Error`.\n\nThese attributes help you in displaying\
    \ data, reading information, and reporting error messages. C# allows you to use\
    \ these attributes directly. However, you need to keep in mind that `System.Console`\
    \ contains other methods and attributes that can help you.\n\n**Important Note:**\
    \ C# allows you to modify the default streams. To do that, you need to use the\
    \ following methods: `Console.SetOut` (for Output), `Console.SetIn` (for Input),\
    \ and `Console.SetError` (for Error).\n\n### The Console Input\n\nProgramming\
    \ languages have a system for entering information to the console. The C# language,\
    \ in particular, uses an object called `Console.In` to control its input stream.\n\
    \nActually, you don’t have to use `Console.In` directly. The `Console` class offers\
    \ two methods (i.e. `ReadLine` and `Read`) that work with `Console.In`.\n\n###\
    \ The Console.ReadLine Method\n\nThis method offers simplicity and convenience\
    \ for people who want to read data from their console. When you call this method,\
    \ your program will stop and wait for the user’s input. Then, the user may enter\
    \ a character or a string and hit “Enter”. By pressing the Enter key, the user\
    \ informs the program that they have entered the input. The `ReadLine` method\
    \ will read the user’s input, hence the name.\n\nThe code given will show you\
    \ how `ReadLine` works:\n\n```csharp\nclass Test\n{\n    static void Main()\n\
    \    {\n        Console.WriteLine(\"What is your first name? \");\n        string\
    \ firstName = Console.ReadLine();\n        Console.WriteLine(\"Please enter your\
    \ last name? \");\n        string lastName = Console.ReadLine();\n        Console.WriteLine(\"\
    Hi, {0} {1}!\", firstName, lastName);\n    }\n}\n```\n\nIf you’ll enter “John”\
    \ and “Smith” into the command prompt, you’ll get the following message:\n\n![](Images/image00096.jpeg)\n\
    \n### The Console.Read Method\n\nThere are significant differences between `Console.Read`\
    \ and `Console.ReadLine`. First, `Console.Read` reads a single character only\
    \ while `Console.ReadLine` reads the entire expression. Second, `Console.Read`\
    \ returns a code rather than the accepted input. If you want to utilize the output\
    \ as an ordinary character, you should do one of these things:\n\n*   Convert\
    \ the output into a character\n*   Use the `Convert.ToChar` method on the result\n"
  raw: 'Most computer programs interact with their user/s. Users need to provide inputs
    or instructions to the program they are interacting with. There are a lot of interaction
    methods available these days: console-based, browser-based, internet-based, graphical,
    etc. Now, the people who use consoles for program interactions are continuously
    decreasing. That’s because the alternative options (e.g. browser-based) are better
    in terms of convenience and user-friendliness.


    Using the Console


    Sometimes, the console serves as the most important tool for user-program interactions.
    For instance, you need to use the console when creating simple computer programs.
    These programs require you to focus on the problems that must be fixed. Beautiful
    GUIs (i.e. graphical user interface) and attractive outputs won’t help you with
    this task.


    You can also use the console to try a small code block before adding it to a complex
    program. Since the console is a simple tool, you can easily isolate the code block
    without pressing any button or seeing different screens. The console will give
    you the results that you need in just a few seconds.


    Accessing the Console


    The process of accessing the console depends on the OS you’re currently using.
    For instance, here are the steps you need to take if you are using a Windows computer:


    1.  Click on the Start button.


    2.  Click “Programs” and choose “Accessories”.


    3.  Click on the option that says “Command Prompt”.


    The console will display your home directory, which is represented by your username.
    In the example below, the username is SARAH:


    ![](Images/image00095.jpeg)


    Important Note: If you’re using Windows Vista, Windows 7, or Windows 8, you can
    launch the console by running a search for “cmd”.


    Additional Information About the Console


    The console is a black window that displays text-based information. It has a blinking
    cursor and shows character strings. As you can see, the cursor moves each time
    you type a character.


    A Windows program can be desktop-based, browser-based, internet-based, or console-based.
    A console-based program utilizes the console for input and output processes. Desktop-based
    programs, on the other hand, rely on their GUI for user-program interactions.
    This book focuses on console-based applications so you’ll be entering data using
    your keyboard and you will see the results within the command prompt.


    Certain console-based applications require the users to provide text, numbers,
    characters, etc. That means you’ll be using your keyboard often while working
    with a console-based program.


    The Basic Commands


    In this section, you’ll learn about the basic commands that you issue using the
    command prompt. You should study this material carefully if you want to be a great
    C# programmer.


    The Console Commands


    *   cd name_of_directory – This command allows you to change the active directory.
    For instance, if you want to go to the Users folder inside C:, you need to issue
    the following command:


    cd C:\Users


    *   dir – Use this command to view the files inside the active directory.


    *   rmdir name_of_directory – This command allows you to delete a directory. For
    example, rmdir Sample  deletes the directory named “Sample”.


    *   mkdir name_of_directory – With this command, you can create a new directory
    inside the active directory. For instance, if you’re currently in the Users directory,
    mkdir John will create a folder named “John” inside “Users”.


    *   type name_of_file – Use this command to view the content of an existing file.
    For instance, you may issue “type HelloCSharp.cs” to see the contents of that
    .cs file.


    Standard I/O


    The Standard I/O system is a mechanism developed for UNIX computers. This system
    involves special devices to accept input and produce output.


    If a program is waiting for the user to perform an action or provide information,
    the console will show a cursor. This means the system is in “waiting mode”.


    Input and Output


    Operating systems need to define the standard I/O mechanisms for user-program
    interactions. When launching a console-based application, the code at the program’s
    initialization block needs to work with I/O mechanisms assigned by the OS. This
    code allows the user to interact with the console-based program involved.


    Because of this code, the program can read the user’s input from “Console.In”
    (i.e. C#’s standard stream for inputs), send information to “Console.Out” (i.e.
    C#’s standard stream for outputs), and report problematic situations through “Console.Error”
    (i.e. C#’s standard stream for error messages).


    Important Note: You’ll learn about C# streams later in this book. This chapter
    will concentrate on the concepts and ideas related to C#’s I/O mechanisms.


    The I/O Devices


    Some programs accept non-keyboard inputs. For example, you can create a C# program
    that takes inputs from text files, barcode readers, microphones, and other data
    sources. A program can also send its output to the screen, to an external file,
    to a printer, etc.


    System.Console


    The class named System.Console has various methods and attributes that you can
    use to read, display, or format text-based information. Three of the most popular
    attributes of the System.Console class are related to entering and showing data.
    These attributes are: Console.In, Console.Out, and Console.Error.             


    These attributes help you in displaying data, reading information, and reporting
    error messages. C# allows you to use these attributes directly. However, you need
    to keep in mind that System.Console contains other methods and attributes that
    can help you with I/O operations.


    Important Note: The C# language allows you to modify the default streams of your
    programs. To do that, you need to use the following methods: Console.SetOut (for
    the Output stream), Console.SetIn (for the Input Stream), and Console.SetError
    (for the Error stream).


    The Console Input


    Programming languages have a system for entering information to the computer’s
    console. The C# language, in particular, uses an object called “Console.In” to
    control its input stream.


    Actually, you don’t have to use Console.In directly. The “Console” class offers
    two methods (i.e. Console.ReadLine and Console.Read) that work with Console.In.
    You can use these methods to read data from your command prompt.


    The Console.ReadLine Method


    This method offers simplicity and convenience for people who want to read data
    from their console. When you call this method, your program will stop and wait
    for the user’s input. Then, the user may enter a character or a string and hit
    “Enter”. By pressing the Enter key, the user informs the program that they have
    entered the needed input. The Console.ReadLine method will read the user’s input,
    hence the name.


    The code given below will show you how Console.ReadLine works:


    class Test


    {


                  static void Main()


                  {


                                System.Console.WriteLine("What is your first name?
    ");


                                string yourfirstName = System.Console.ReadLine();


                                System.Console.WriteLine("Please enter your last name?
    ");


                                string yourlastName = System.Console.ReadLine();


                                System.Console.WriteLine("Hi, {0} {1}!", yourfirstName,
    yourlastName);


    }


    }


    If you’ll enter “John” and “Smith” into the command prompt, you’ll get the following
    message:


    ![](Images/image00096.jpeg)


    The Console.Read Method


    There are significant differences between Console.Read and Console.ReadLine. First,
    Console.Read reads a single character only while Console.ReadLine reads the entire
    expression. Second, Console.Read returns a code rather than the accepted input.
    If you want to utilize the output as an ordinary character, you should do one
    of these things:


    *   Convert the output into a character


    *   Use the Convert.ToChar method on the result'
