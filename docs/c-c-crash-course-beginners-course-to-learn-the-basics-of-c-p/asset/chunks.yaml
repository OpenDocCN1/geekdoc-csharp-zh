  trans: "\n\n值类型（Value type）存在于程序的执行栈中。此外，它保存了程序员存储的值。值类型包含布尔值（Booleans）、字符（Characters）和整数（Integers）。分配给这些数据类型的内会在程序完成代码执行后变得可用。例如，当程序关闭时，程序\
    \ `Main()` 方法中的变量将被清空。\n\n另一方面，引用类型（Reference type）在程序的栈中存储一个地址（即引用）。该地址指向所需值的位置。基本上，引用类型在声明期间会分配动态内存。当程序不再需要它时，它也会释放一些内存。\n\
    \n# 字面量 (Literals)\n\n字面量是程序源代码中指定的值。下面的示例将说明这一概念：\n\n```csharp\nbool isitdelicious\
    \ = false;\nshort income = 22000;\nchar firstletter = ‘c’;\nbyte ten = 10;\nint\
    \ prize = 250000;\n```\n\n在这个示例中，字面量是 `false`、`22000`、`‘c’`、`10` 和 `250000`。这些是你直接添加到程序代码中的值。\n\
    \n# 不同类型的字面量\n\nC# 支持以下类型的字面量：\n\n* 实数 (Real)\n* 整数 (Integer)\n* 字符串 (String)\n\
    * 字符 (Character)\n* 布尔值 (Boolean)\n\n让我们详细讨论这些字面量：\n\n## 实数 (Real)\n\n实数字面量有一个符号（即\
    \ `+` 或 `-`）、一个后缀、一个前缀和一个小数点。你应该对 `double`、`float` 和 `decimal` 值使用这种类型。C# 允许你以指数形式编写实数字面量。以下是你可以应用于实数字面量的后缀：\n\
    \n* `F` – 此后缀代表 `float` 值。\n* `D` – 使用此后缀指示 `double` 值。\n* `M` – 此字母表示 `decimal`\
    \ 值。\n* `E` – 使用此字母表示指数值。例如，“e4”意味着你需要将整数乘以 10⁴。\n\n## 整数 (Integer)\n\n整数字面量由前缀、后缀、符号（即\
    \ `+` 或 `-`）和一组数字组成。你可以使用前缀在代码中以进制或十六进制添加数字。以下是你在 C# 中可以使用的前缀和后缀：\n\n* `0X`（例如\
    \ `0XA6F2`）– 使用此前缀指示十六进制值。\n* `U`（例如 `119U`）– 此后缀代表无符号 `int` (`uint`) 或无符号 `long`\
    \ (`ulong`) 值。\n* `L`（例如 `360L`）– 使用此后缀用于“long”（长型）值。\n\n**重要说明：** 如果你不使用任何后缀，C#\
    \ 将把整数字面量标记为“int”。此外，字母（即 `L`、`U` 和 `X`）是不区分大小写的。\n\n## 字符串 (String)\n\n使用此字面量处理字符串值。基本上，字符串字面量是置于双引号内的字符集（例如，“sample”）。\n\
    \n**重要说明：** 在 C# 语言中，你可以使用 `@` 符号来创建引用字符串（或字面字符串）。程序员使用这些字符串来命名文件路径。\n\n## 字符\
    \ (Character)\n\n字符字面量是由一对单引号包围的单个字符（例如 ‘z’）。使用字符字面量设置属于 `char` 类型的值。此外，你也可以这样写字符字面量：\n\
    \n* 单个字符（例如 ‘X’）\n* 特殊字符的代码（例如 ‘\\u0067’）\n* 转义代码（见下文）\n\n**转义代码 (Escape Codes)**\
    \ – 这些是向源代码添加字符的特殊字符序列。通常情况下，这里涉及的字符不能直接添加到程序代码中。\n\nC# 防止你直接向程序添加某些字符。这些字符包括：制表符、换行符、反斜杠、引号等。以下列表将为你展示\
    \ C# 中常用的转义代码：\n\n* `\\\\` – 换行符\n* `\\t` – 制表符\n* `\\'` – 单引号\n* `\\\"` – 双引号\n\
    \n## 布尔值 (Boolean)\n\n布尔字面量只有两种类型：`true` 和 `false`。在处理 `bool`（即布尔）变量时，你只能分配这两个值之一。下面提供的代码段将向你展示如何声明布尔字面量：\n\
    \n```csharp\nbool answer = false;\n```\n\n# 第 3 章：C# 运算符\n\n本章将重点介绍 C# 的运算符。通过阅读这些材料，你将了解运算符的工作原理以及如何使用它们。\n\
    \n## 基础\n\n运算符帮助你处理数据。它们接受输入并产生结果。\n\n## 不同类型的运算符\n\nC# 将运算符分为以下几类：\n\n### 赋值运算符\
    \ (Assignment Operator)\n\n在 C# 中，你需要使用 `=` 来赋值。这里是一些示例：\n\n```csharp\nint y =\
    \ 99;\nstring hello = “Good”;\nchar sample = ‘z’;\n```\n\n**重要说明：** C# 允许你多次使用\
    \ `=`。这里是一些示例：\n\n```csharp\nint d = 100;\ne = 3;\n```\n\n### 算术运算符 (Arithmetic\
    \ Operators)\n\n这些运算符帮助你执行数学运算。该类别包括：\n\n* `+` – 使用此运算符对两个值进行加法运算（例如 `+1`）。\n\
    * `-` – 此运算符允许你从左操作数的值减去右操作数的值（例如 `-1`）。\n* `*` – 使用此运算符，你可以乘以两个操作数（例如 `*6`）。\n\
    * `/` – 使用此运算符将左操作数除以右操作数。\n* `++` – 这被称为自增运算符。它将操作数的值加一。你可以在操作数之前或之后编写它（例如 `99++`、`++5`）。\n\
    * `--` – 此运算符与自增运算符完全相反。你可以用它将操作数的值减一。你可以在要修改的操作数之前或之后编写它。下面的代码将展示它们如何工作：\n\n\
    ```csharp\nclass Test {\n    static void Main() {\n        double d = 100, e =\
    \ 3;\n        Console.WriteLine(d + e);\n        Console.WriteLine(d - e);\n \
    \       Console.WriteLine(d / e);\n        Console.WriteLine(d * e);\n       \
    \ Console.WriteLine(++d);\n        Console.WriteLine(--e);\n    }\n}\n```\n\n\
    ### 逻辑运算符 (Logical Operators)\n\n逻辑运算符与布尔值操作：\n\n* `&&` – 称为“与”(AND)。如果两个操作数都为真，则返回真。\n\
    * `^` – 这是“异或”(Exclusive OR)。如果操作数不同，则返回真。\n* `||` – “或”(OR)。如果至少有一个为真，则返回真。\n\
    * `!` – 称为“非”(Negation)。它会反转值。\n\n这里是一些示例：\n\n```csharp\nclass Test {\n    static\
    \ void Main() {\n        bool x = true, y = false;\n        Console.WriteLine(x\
    \ && y);\n        Console.WriteLine(x || y);\n        Console.WriteLine(!x);\n\
    \        Console.WriteLine(x ^ y);\n    }\n}\n```\n"
- fmt: "\nThese operators work on binary numbers. In the IT world, all of the information\
    \ is expressed as a sequence of zeros and ones. That mean you need to master binary\
    \ operators if you want to be a successful programmer.\n\nA binary operator works\
    \ exactly like a logical one. Actually, you may think that binary and logical\
    \ operators use different inputs but conduct the same processes. A logical operator\
    \ uses Boolean values to produce results. A binary operator, on the other hand,\
    \ works on numbers presented as binary digits. Here are the binary operators you’ll\
    \ encounter while using C#:\n\n- `&` – This is called `Binary AND`. It indicates\
    \ the position/s where both of the operands have `1`. \n- `^` – Programmers refer\
    \ to this operator as `Binary Exclusive OR`. It will place `1` in each position\
    \ where the values are different. own- `|` – This is the `Binary OR` operator.\
    \ It indicates the position/s where any of the operands has `1`. \n- `~` – This\
    \ acts as the negation operator for binary values. Just like `!`, it reverses\
    \ the current value of a variable.\n- `<<` – This is the `Binary Left Shift` operator.\
    \ It moves the bits of a binary number to the left. This movement depends on the\
    \ value that you’ll assign (e.g. `4 << 1`, `4 << 3`, `4 << 2`, etc.).\n\n### Comparison\
    \ Operators\n\nThese operators allow you to compare the values inside two operands.\
    \ Each of these operators gives a Boolean value as the final output. Here are\
    \ the comparison operators of the C# language:\n\n- `==` – This is the Equality\
    \ operator. It checks whether the two operands are equal (e.g. `x == y`)\n- `>`\
    \ – This operator checks whether the left-hand operand’s value is greater than\
    \ that of the right-hand operand (e.g. `x > y`).\n- `<` – This operator compares\
    \ the values of the two operands. It will give you `true` if the left-hand operand’s\
    \ value is less than that of the right-hand operand (e.g. `y < x`).\n- `>=` –\
    \ With this operator, you can determine whether the value of the left-hand operand\
    \ is greater than or equal to that of the right-hand operand. own- `<=` – This\
    \ operator will give you `true` if the value of the left-hand operand is less\
    \ than or equal to that of the right-hand operand.\n- `!=` – Use this operator\
    \ to check the equality of two operands. It will give you `true` if the values\
    \ are not equal (e.g. `x != y`).\n\n### Conditional Operator\n\nC# users refer\
    \ to `?` as the conditional operator. Basically, this operator uses the result\
    \ of a Boolean expression to determine which statement should be processed. This\
    \ is called `ternary operator` because it works on three operands. Here, the first\
    \ value should be Boolean, while the remaining values need to belong to the same\
    \ data type (e.g. characters, strings, numbers, etc.).\n\nThe syntax of this operator\
    \ is:\n\n```\nfirst_operand ? second_operand : third_operand;\n```\n\nHere’s how\
    \ it works: If `first_operand` is true, the program will work on `second_operand`.\
    \ If `first_operand` is false, however, the program will work on `third_operand`.\n\
    \n### Chapter 4: Data Type Conversion\n\nIn general, an operator works on arguments\
    \ that belong to the same type. However, the C# language offers a wide range of\
    \ data types that you can use for certain situations. To conduct any process on\
    \ variables that belong to different types, you should convert one of those variables\
    \ first. In C#, data type conversion can be implicit or explicit.\n\nEach C# expression\
    \ has a data type. This data type results from the literals, variables, values,\
    \ and structures used inside the expression. Basically, you might use an expression\
    \ whose type is incompatible for the situation. When this happens, you’ll get\
    \ one of these results:\n\n- The program will give you a compile-time error.\n\
    - The program will perform an automated conversion. That means the program will\
    \ get the right expression type.\n\nConverting an `s` type to a `t` type allows\
    \ you to treat `s` as `t` while running your program. Sometimes, this process\
    \ requires the programmer to validate the type conversion. Check the examples\
    \ below:\n\n- Converting `objects` to `strings` will need verification during\
    \ the program’s runtime. This verification ensures that you really want to use\
    \ the values as strings.\n- Converting `string` values to `object` values doesn’t\
    \ need verification.\n\n#### Implicit Conversion\n\nConverting an `s` type to\
    \ a `t` type allows you to treat `s` as `t` while running your program. Sometimes,\
    \ this process requires the programmer to validate the type conversion. Check\
    \ the examples below:\n\n```csharp\nclass Example\n{\n    static void Main()\n\
    \    {\n        double varDouble = 2.1;\n        Console.WriteLine(varDouble);\n\
    \n        long varLong = (long)varDouble;\n        Console.WriteLine(varLong);\n\
    \n        double varDouble2 = 2e9;\n        Console.WriteLine(varDouble2);\n\n\
    \        int varInt = (int)varDouble2;\n        Console.WriteLine(varInt);\n \
    \   }\n}\n```\n\n#### Explicit Conversion\n\nUse this conversion if there’s a\
    \ chance of loss. For instance, you’ll experience loss while converting floating-point\
    \ values to integer. Here are the examples below:\n\n```csharp\nclass Example\n\
    {\n    static void Main()\n    {\n        double varDouble = 2.1;\n        Console.WriteLine(varDouble);\n\
    \n        long varLong = (long)varDouble;\n        Console.WriteLine(varLong);\n\
    \n        double varDouble2 = 2e9;\n        Console.WriteLine(varDouble2);\n\n\
    \        int varInt = (int)varDouble2;\n        Console.WriteLine(varInt);\n \
    \   }\n}\n```\n\n#### String Conversion\n\nC# allows you to convert any data type\
    \ to `string`. The compiler will perform this process automatically if you will\
    \ use `+` and at least one non-string argument.\n"
  raw: 'These operators work on binary numbers. In the IT world, all of the information
    is expressed as a sequence of zeros and ones. That mean you need to master binary
    operators if you want to be a successful programmer.


    A binary operator works exactly like a logical one. Actually, you may think that
    binary and logical operators use different inputs but conduct the same processes.
    A logical operator uses Boolean values to produce results. A binary operator,
    on the other hand, works on numbers presented as binary digits. Here are the binary
    operators you’ll encounter while using C#:


    *   “&” – This is called “Binary AND”.  It indicates the position/s where both
    of the operands have “1”.


    *   “^” – Programmers refer to this operator as “Binary Exclusive OR”. It will
    place “1” in each position where the values are different.


    *   “|” – This is the “Binary OR” operator. It indicates the position/s where
    any of the operands has “1”.


    *   “~” – This acts as the negation operator for binary values. Just like “!”,
    it reverses the current value of a variable.


    *   “<<” – This is the “Binary Left Shift” operator. It moves the bits of a binary
    number to the left. This movement depends on the value that you’ll assign (e.g.
    4 << 1, 4 << 3, 4 << 2, etc.).


    Comparison Operators


    These operators allow you to compare the values inside two operands. Each of these
    operators gives a Boolean value as the final output. Here are the comparison operators
    of the C# language:


    *   “==” – This is the Equality operator. It checks whether the two operands are
    equal (e.g. x == y)


    *   “>” – This operator checks whether the left-hand operand’s value is greater
    than that of the right-hand operand (e.g. x > y).


    *   “<” – This operator compares the values of the two operands. It will give
    you “true” if the left-hand operand’s value is less than that of the right-hand
    operand (e.g. y < x).


    *   “>=” – With this operator, you can determine whether the value of the left-hand
    operand is greater than or equal to that of the right-hand operand.


    *   “<=” – This operator will give you true if the value of the left-hand operand
    is less than or equal to that of the right-hand operand.


    *   “!=” – Use this operator to check the equality of two operands. It will give
    you true if the values are not equal (e.g. x != y).


    Conditional Operator


    C# users refer to “?” as the conditional operator. Basically, this operator uses
    the result of a Boolean expression to determine which statement should be processed.
    This is called “ternary operator” because it works on three operands. Here, the
    first value should be Boolean, while the remaining values need to belong to the
    same data type (e.g. characters, strings, numbers, etc.).


    The syntax of this operator is:


    first_operand ? second_operand : third_operand;


    Here’s how it works: If “first_operand” is true, the program will work on “second_operand”.
    If “first_operand” is false, however, the program will work on “third_operand”.


    Chapter 4: Data Type Conversion


    In general, an operator works on arguments that belong to the same type. However,
    the C# language offers a wide range of data types that you can use for certain
    situations. To conduct any process on variables that belong to different types,
    you should convert one of those variables first. In C#, data type conversion can
    be implicit or explicit.


    Each C# expression has a data type. This data type results from the literals,
    variables, values, and structures used inside the expression. Basically, you might
    use an expression whose type is incompatible for the situation. When this happens,
    you’ll get one of these results:


    *   The program will give you a compile-time error.


    *   The program will perform an automated conversion. That means the program will
    get the right expression type.


    Converting an “s” type to “t” type allows you to treat “s” as “t” while running
    your program. Sometimes, this process requires the programmer to validate the
    type conversion. Check the examples below:


    *   Converting “objects” to “strings” will need verification during the program’s
    runtime. This verification ensures that you really want to use the values as strings.


    *   Converting “string” values to “object” values doesn’t need any validation.
    That’s because the “string” type is a branch of the “object” type. You can convert
    strings to their “parent” class without losing data or getting any error.


    *   You won’t have to perform verification while converting int values to long
    values. The “long” data type covers all of the possible values of the “int” type.
    That means the data can be transformed without any error.


    *   Converting “double” values to “long” values involves validation. You might
    experience loss of data, depending on the values you’re working on.


    Important Note: C# has certain restrictions when it comes to changing data types.
    Here are the possible type conversions supported by this language:


    Explicit Conversion


    Use this conversion if there’s a chance of information loss. For instance, you’ll
    experience information loss while converting floating-point values to integer
    values (i.e. the fractional section will disappear). You might also lose some
    data while converting a wide-range type to a narrow-range type (e.g. long-to-int
    conversion, double-to-float conversion, etc.). To complete this process, you need
    to use the “type” operator. Check the examples below:


    class Example


    {


                  static void Main()


                  {


                                double yourDouble = 2.1d;


                                System.Console.WriteLine(yourDouble);


                                long yourLong = (long)yourDouble;


                                System.Console.WriteLine(yourLong);


                                yourDouble = 2e9d;


                                System.Console.WriteLine(yourDouble);


                                int yourInt = (int)yourDouble;


                                System.Console.WriteLine(yourInt);


                  }


    }


    If compiled and executed correctly, that program will give you these results:


    ![](Images/image00094.jpeg)


    Implicit Conversion


    You can only perform this conversion if data loss is impossible. This conversion
    is referred to as implicit because it doesn’t require any operator. The C# compiler
    will perform implicit conversion whenever you assign narrow-range values to variables
    that have a wide-range.


    String Conversion


    C# allows you to convert any data type to “string”. The compiler will perform
    this conversion process automatically if you will use “+” and at least one non-string
    argument. Here, the non-string argument will become a string and the “+” operator
    will produce a new value.


    Chapter 5: The Console


    This chapter will teach you how to use the console in providing and collecting
    data. You’ll learn how to use this tool in performing I/O (i.e. Input/Output)
    operations in the C# language.


    Console – The Basics


    A console is a tool that you can use to interact with the programs available in
    your computer. Because of this, consoles are considered as an important part of
    any operating system.


    In C#, user-to-program interactions involve standard output (e.g. screen) and/or
    standard input (e.g. keyboard strokes). When combined, these things are called
    I/O operations. The text within the console provides useful data and is a set
    of characters from a computer program.


    The computer’s OS (i.e. operating system) links I/O devices to every console program
    installed on the computer. Most systems tag screens and keyboards as default output
    and input devices. However, you can easily redirect these channels to certain
    files or devices.


    The Interaction between a Program and Its User'
