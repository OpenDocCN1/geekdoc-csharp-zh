    \ will iterate.\n\nYou may include one or more variables in your “for” loops.\
    \ These variables may move in descending or ascending order. When writing programs,\
    \ you may combine ascending and descending variables in a single “for” loop. In\
    \ addition, an ascending variable can go from 1 to 1024 because “for” loops support\
    \ arithmetic operations (e.g. addition, multiplication, etc.).\n\n**Important\
    \ Note:** All of the parts of a “for” loop are optional. You can create an infinite\
