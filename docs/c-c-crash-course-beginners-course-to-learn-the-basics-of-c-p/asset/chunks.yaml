    # Class Names


    In C#, each program has one or more class definitions. Programmers often store
    each class definition inside a separate file that corresponds to the class’s name.
    Also, the extension of these files should be `.cs`. You can compile different
    classes into a single file without experiencing any technical problems. However,
    you’ll have a hard time navigating your codes.


    # More Information about C#


    The C#` programming language is advanced, modern, multipurpose, and object-oriented.
    It has some similarities with other languages such as `C`, `C++`, and `Java`.
    The main difference is that C#` offers easier programming and simplified syntaxes.


    A C#` program has one or more `.cs` files, which hold data types and class definitions.
    You need to compile those `.cs` files to get executable codes (i.e. files that
    end with `.dll` or `.exe`). For instance, if you will compile the `HelloCSharp`
    program, you’ll get an executable file named `HelloCSharp.exe`.


    # The Things You Need to Create C# Programs


    Before you can write programs using C#`, you need two important things—a text
    editor (e.g. `Notepad`) and the `.NET` framework. The text editor will help you
    in writing and editing codes. The `.NET` framework, on the other hand, will help
    you in compiling and executing your programs.


    ## What is .NET?


    Basically, `.NET` is a framework designed for the development and execution of
    computer programs. Most of the modern Windows systems have `.NET` as a built-in
    framework. Thus, you won’t have to install any software onto your computer if
    you are using Microsoft’s modern operating systems.


    If you are using an old Windows OS, you need to download the `.NET` framework
    first. You may go to this [site](http://download.microsoft.com) and get the most
    recent version of `.NET`.


    **Important Note**: Make sure that your computer has `.NET` before reading the
    rest of this book. Otherwise, you’ll have problems compiling and executing the
    sample programs that you’ll see later.


    ## Text Editors


    You should use a text editor to write, edit, and save source codes. You can use
    any text editor installed on your computer. If you don’t want to download additional
    programs, you may simply use `Notepad` (i.e. the pre-installed text editor of
    Windows computers).


    ## Compiling and Executing Programs


    Now, it’s time to compile and run the `HelloCSharp` program you’ve seen earlier.
    Here are the things you need to do:


    1. Generate a `.cs` file and name it as `HelloCSharp`.

    2. Write the source code inside that `.cs` file.

    3. Compile the code to get a `.exe` file.

    4. Run the resulting program.


    Turn on your computer and let’s start writing some codes.


    **Important Note**: This eBook assumes that you are using a Windows computer.


    Here’s the code of the `HelloCSharp` program:


    ![](Images/image00082.jpeg)


    # Writing a C# Program Using the Command Prompt


    First, you need to launch the `Command Prompt` (also known as `Command Console`).
    If you are using Windows 7 or Windows 8, you can click on the Start button and
    run a search for `cmd`. Check the search results and look for the program named
    `Command Prompt`. Right-click on the program and choose `Run as administrator`
    from the menu. Here’s a screenshot:


    ![](Images/image00083.jpeg)


    **Important Note**: If you will launch the Command Prompt by double-clicking on
    it, some of its important features might be unavailable.


    Next, you need to generate a file directory so you can store the resulting program.
    Type `md` followed by the directory’s name. Then, enter `cd` to get inside the
    new directory. Here’s a screenshot:


    ![](Images/image00084.jpeg)


    For this example, the name of the directory is `C#Programs`. The `cd` command
    changed the active directory to `C:\Windows\System32\C#Programs`. Now, you’re
    ready to create the `.cs` file. Go back to the Command Prompt and issue the following
    command:


    ![](Images/image00085.jpeg)


    After running that command, your screen will show you this:


    ![](Images/image00086.jpeg)


    Your computer will tell you that `HelloCSharp.cs` doesn’t exist. Also, it will
    ask you whether you like to create a new file. Click on the `Yes` button and copy
    the program’s code onto the Notepad application. The screenshot below will help
    you with this step:


    ![](Images/image00087.jpeg)


    Press `CTRL+S` to save the file. Then close the text editor by hitting the red
    X or pressing `ALT+F4`. Now, you’ll see the program’s code inside the `C#Programs`
    directory.


    ## Compiling the Code


    At this point, you can compile the source code using `csc` (i.e. the built-in
    compiler of the C# language). Enter `csc HelloCSharp.cs` into the Command Prompt.
    Since it’s your first time using the compiler, you might get an error message
    similar to this one:


    ![](Images/image00088.jpeg)


    To solve this problem, you just need to specify the location of the C# compiler.
    Here’s the required directory for Windows 7 computers: `C:\Windows\Microsoft.NET\Framework\v4.0.30319`


    **Important Note**: The numbers at the end of the directory might change depending
    on the OS version you’re using.


    Thus, you should issue the following command:


    ```

    C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc HelloCSharp.cs

    ```


    The C# compiler will convert your `.cs` file into an executable program. To execute
    your first program, enter its name into the Command Prompt. You will get the following
    message:


    ![](Images/image00089.jpeg)


    # How to Change the System Path of a Windows Computer


    Surely you don’t want to type the compiler’s complete directory each time you
    create a program. This part of the book will teach you how to set your computer
    so that it can automatically detect the compiler’s location.


    Here are things you need to do:


    1. Access your computer’s Control Panel and click on `System`.

    2. You’ll see a new window. Search for `Advanced System Settings` and click on
    it.

    3. Click on `Environment Variables` and look for a variable named `Path`.

    4. Click on the `Edit…` button and specify the compiler’s directory. Again, that
    is: `C:\Windows\Microsoft.NET\Framework\v4.0.30319`

    5. Hit `OK` to save the changes.

    6. Now, close the current Command Prompt and launch a new one. Then, `csc`.

    7. The screen should give you the following error:


    ![](Images/image0090.jpeg)


    8. That means your computer can automatically trigger the compiler. Once you specify
    a source code, your computer will generate `.exe` files for you.


    # Chapter 2: The Data Types, Variables, and Literals of C#


    This chapter will focus on the data types and variables used in C#. By reading
    this material, you’ll know what these objects are and how you can use them in
    writing your own programs.


    ## Variables – An Introduction


    Typical programs utilize different values during their execution. For instance,
    you can develop a program that solves mathematical problems. Obviously, you need
    to enter different values while using this kind of program. Simply put, programmers
    don’t know which values will be entered by the user. Thus, they need to make sure
    that the resulting programs will accept any value that the user may provide.


    When the user gives a value, you may temporarily store it in the machine’s `RAM`
    (i.e. random access memory). All of the values inside this memory may change.
    Because of this, programmers refer to such values as `variables`.


    ## Data Types


    A data type is a set (or range) of values that share similar attributes. For example,
    the `byte` data type refers to the values within the `0 to 255` number range.


    ### Attributes


    Data types have the following attributes:


    * Name (e.g. `int`, `char`, `bool`, etc.)

    * Size (e.g. `1 byte`)

    * Default Value (e.g. `1`, `2`, `3`, etc.)


    ## The Different Types of Data in C#


    C# supports the following data types:


    * Boolean

    * Characters

    * Objects

    * Floating-Point

    * Decimals

    * Integers

    * Strings

