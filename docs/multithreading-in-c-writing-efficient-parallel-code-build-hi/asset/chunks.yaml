    \ async 和 await 的用处\n\n在处理多线程应用程序时，`async` 和 `await` 关键字提供了许多用处：\n\n1. **简化代码**：与传统的基于回调或基于任务的方法相比，使用\
    \ `async` 和 `await` 编写的异步代码要易读和理解得多。\n2. **提高响应能力**：通过允许调用线程在等待异步操作完成的同时继续执行，`async`\
    \ 和 `await` 有助于保持应用程序的响应性，特别是在 UI 应用中。\n3. **高效的资源利用**：在等待异步操作时不会阻塞线程，从而提高了资源利用率。\n\
