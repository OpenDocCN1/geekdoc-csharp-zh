  trans: "\n虽然 `Parallel.For` 和 `Parallel.ForEach` 在许多场景下可以显著提高性能，但理解并行并不总是有益的。有几个因素需要考虑：\n\
    \n1. **工作负载大小**：对于较小的工作负载，创建和管理多个线程的开销可能会超过并行带来的益处。根据经验法则，当你有大量独立操作需要执行时，请考虑使用并行循环。\n\
    2. **任务复杂度**：如果循环的每次迭代执行的是非常简单的操作，那么并行化的开销可能并不划值。当每次迭代都涉及大量工作时，并行循环的优势最为显著。\n\
    3. **数据依赖关系**：如果循环的迭代依赖于之前迭代的结果，则并行化可能不可行，或者需要对你的算法进行重大重构。\n4. **共享资源访问**：如果你的循环迭代需要访问共享资源，你将需要实现适当的同步，这会减少并行带来的收益。\n\
    \n以下是一个示例，了如何衡量顺序循环和并行循环之间的性能差异：\n\n```csharp\nusing System;\nusing System.Diagnostics;\n\
    using System.Threading.Tasks;\n\nclass PerformanceComparisonExample {\n    static\
    \ void Main() {\n        const int iterations = 100000000;\n\n        Stopwatch\
    \ sw = new Stopwatch(); // 顺序循环\n        sw.Start();\n        double sequentialResult\
    \ = 0;\n        for (int i = 0; i < iterations; i++) {\n            sequentialResult\
    \ += Math.Sqrt(i);\n        }\n        sw.Stop();\n        Console.WriteLine($\"\
    Sequential loop time: {sw.ElapsedMilliseconds}ms\"); // 并行循环\n        sw.Restart();\n\
    \        double parallelResult = 0;\n        object lockObject = new object();\n\
    \n        Parallel.For(0, iterations, i => {\n            double localResult =\
    \ Math.Sqrt(i);\n            lock (lockObject) {\n                parallelResult\
    \ += localResult;\n            }\n        });\n        sw.Stop();\n        Console.WriteLine($\"\
    Parallel loop time: {sw.ElapsedMilliseconds}ms\");\n        Console.WriteLine($\"\
    Sequential result: {sequentialResult}\");\n        Console.WriteLine($\"Parallel\
    \ result: {parallelResult}\");\n    }\n}\n```\n\n此示例使用顺序循环和并行循环计算从 0 到 99,999,999\
    \ 的数字的平方根和。然后比较它们的执行时间。注意，在并行版本中，我们使用 `lock` 来确保对共享变量 `parallelResult` 进行线程安全的更新。\n\
    \n## 高级功能\n\n`Parallel.For` 和 `Parallel.ForEach` 都为更复杂的场景提供了高级级功能：\n\n### 取消\n\
    \n你可以使用 `CancellationToken` 取消并行循环操作：\n\n```csharp\nCancellationTokenSource cts\
    \ = new CancellationTokenSource();\ntry {\n    Parallel.For(0, 1000000, new ParallelOptions\
    \ { CancellationToken = cts.Token }, i => {\n        if (i == 500000) {\n    \
    \        cts.Cancel();\n        }\n        // 执行一些工作\n    });\n} catch (OperationCanceledException)\
    \ {\n    Console.WriteLine(\"Operation was canceled\");\n}\n```\n\n### 控制并行度\n\
    \n你可以使用 `MaxDegreeOfParallelism` 属性控制并发任务的最大数量：\n\n```csharp\nParallel.ForEach(items,\
    \ new ParallelOptions { MaxDegreeOfParallelism = Environment.ProcessorCount },\
    \ item => {\n    // 处理项目\n});\n```\n\n### 中断和停止循环\n\n`ParallelLoopState` 参数允许你中断或停止并行循环：\n\
    \n```csharp\nParallel.For(0, 1000, (int i, ParallelLoopState state) => {\n   \
    \ if (i == 500) {\n        state.Break(); // 这将停止处理 500 之后的任何迭代\n    }\n    //\
    \ 处理 i\n});\n```\n\n## 最佳实践与常见陷阱\n\n在使用 `Parallel.For` 和 `Parallel.ForEach` 时，请记住这些最佳实践：\n\
    \n1. **衡量性能**：始终将你的并行代码与其对应的顺序版本进行性能对比。并行化并不总是能带来更好的性能。\n2. **避免共享状态**：尽可能，设计你的并行循环以避免共享状态。如果共享状态是必要的，请使用适当的同步机制。\n\
    3. **处理异常**：记住在不同的迭代中可能会同时发生多个异常。使用适当的异常处理技术。\n4. **考虑任务粒度**：如果你的循环包含大量非常小的任务，请考虑对它们进行批处理以减少开销。\n\
    5. **注意线程安全**：确保你在并行循环中使用的任何方法或对象都是线程安全的。\n\n需要避免的常见陷阱包括：\n\n1. **过度并行**：不要并行化一切。某些任务保持顺序执行更好。\n\
    2. **忽略数据依赖关系**：确保你的并行迭代是真正的独立。\n3. **忽略异常处理**：适当的异常处理在并行编程中至关重要。\n4. **过度同步**：过度同步会抵消并行带来的优势。\n\
    \n## 结论\n\n`Parallel.For` 和 `Parallel.ForEach` 是 C# 多线程工具箱中强大的工具。它们为并行循环提供了高层抽象，允许开发者轻松利用多核处理器的能力。通过将工作负载分布到多个线程上，这些结构可以显著提高计算密集型任务的性能。\n\
    \n然而，重要的是并行并不是解决所有性能问题的魔术方案。必须仔细考虑任务的性质、工作负载的大小以及潜在的共享资源冲突。当使用适当时，`Parallel.For`\
    \ 和 `Parallel.ForEach` 可以产生更高效、更可扩展的代码。\n"
- fmt: "\n2. **Parallelization**: By calling the `AsParallel()` method on the data\
    \ source, you instruct `PLINQ` to parallelize the query execution.\n\n3. **Partitioning**:\
    \ `PLINQ` divides the input data into partitions, each of which can be processed\
    \ independently.\n\n4. **Thread Allocation**: The query operations are distributed\
    \ across multiple threads, typically one for each available processor core.\n\n\
    5. **Parallel Execution**: Each partition is processed concurrently on different\
    \ threads.\n\n6. **Result Merging**: The results from all partitions are combined\
    \ to produce the final output.\n\nHere's a simple example to illustrate this process:\n\
    ```csharp\nvar numbers = Enumerable.Range(1, 1000000); var evenSquares = numbers.AsParallel()\n\
    .Where(n => n % 2 == 0)\n.Select(n => n * n)\n.ToList(); \n```\nIn this code,\
    \ `PLINQ` will automatically divide the range of numbers into partitions, apply\
    \ the `Where` and `Select` operations in parallel, and then merge the results.\n\
    \n### When to Use PLINQ\n\nWhile `PLINQ` can offer significant performance improvements,\
    \ it's not always the best choice for every scenario. `PLINQ` is most beneficial\
    \ in the following situations:\n\n1. **Large Datasets**: When working with collections\
    \ containing thousands or millions of elements, `PLINQ` can provide substantial\
    \ speedups.\n2. **Computationally Intensive Operations**: If your query involves\
    \ complex calculations or time-consuming operations for each element, `PLINQ`\
    \ can distribute this workload effectively.\n3. **Independent Operations**: `PLINQ`\
    \ works best when each element can be processed independently of others, without\
    \ shared state or ordering requirements.\n4. **Multi-core Systems**: The benefits\
    \ of `PLINQ` are most apparent on systems with multiple cores or processors.\n\
    \nHowever, it's important to note that `PLINQ` may not be suitable for:\n\n- Small\
    \ datasets or simple operations where the overhead of parallelization outweighs\
    \ the benefits.\n- Queries that require maintaining a specific order of elements.\n\
    - Operations with significant I/O bottlenecks, as parallelization may not improve\
    \ performance in these cases.\n\n## PLINQ Query Operators and Execution\n\n###\
    \ Parallel Query Operators\n\n`PLINQ` supports most of the standard `LINQ` query\
    \ operators, allowing you to parallelize a wide range of query operations. Some\
    \ of the key operators include:\n\n- `Where`: Filters elements based on a predicate.\n\
    - `Select`: Transforms each element using a projection function.\n- `GroupBy`:\
    \ Groups elements based on a key selector.\n- `OrderBy` and `OrderByDescending`:\
    \ Sorts elements in ascending or descending order.\n- `Join`: Combines elements\
    \ from two sequences based on matching keys.\n- `Aggregate`: Performs a custom\
    \ aggregation operation on the sequence.\n\nHere's an example that combines multiple\
    \ operators in a parallel query:\n```csharp\nvar result = sourceData.AsParallel()\n\
    .Where(item => item.Value > 100)\n.GroupBy(item => item.Category)\n.Select(group\
    \ => new {\n    Category = group.Key,\n    Average = group.Average(item => item.Value)\n\
    })\n.OrderByDescending(g => g.Average)\n.ToList();\n```\nThis query filters items,\
    \ groups them by category, calculates averages, and sorts the results, all in\
    \ parallel.\n\n### Execution Modes\n\n`PLINQ` offers two main execution modes:\n\
    \n1. **Fully Parallelized**: By default, `PLINQ` attempts to parallelize the entire\
    \ query. This mode is suitable for most scenarios where order doesn't matter.\n\
    2. **Partially Parallelized**: In some cases, `PLINQ` may execute parts of the\
    \ query sequentially to maintain order or optimize performance.\n\nYou can control\
    \ the execution mode using methods like `AsOrdered()` and `AsUnordered()`:\n```csharp\n\
    var orderedResult = sourceData.AsParallel().AsOrdered()\n.Where(x => x > 10)\n\
    .Select(x => x * 2)\n.ToList();\n```\nThe `AsOrdered()` method ensures that the\
    \ output maintains the same order as the input, potentially at the cost of some\
    \ performance.\n\n### Cancellation and Exception Handling\n\n`PLINQ` provides\
    \ mechanisms for cancelling long-running queries and handling exceptions that\
    \ occur during parallel execution.\n\nTo support cancellation, you can use a `CancellationToken`:\n\
    ```csharp\nvar cts = new CancellationTokenSource(); \ntry {\n    var query = sourceData.AsParallel()\n\
    \    .WithCancellation(cts.Token)\n    .Where(x => SomeExpensiveOperation(x));\
    \ // ... rest of the query\n} catch (OperationCanceledException) {\n    Console.WriteLine(\"\
    Query was canceled.\");\n}\n```\n\nFor exception handling, `PLINQ` aggregates\
    \ exceptions from all parallel operations into an `AggregateException`:\n```csharp\n\
    try {\n    var query = sourceData.AsParallel()\n    .Where(x => SomeOperationThatMightThrow(x))\n\
    \    .ToList();\n} catch (AggregateException ae) {\n    foreach (var innerException\
    \ in ae.InnerExceptions) {\n        Console.WriteLine($\"Error: {innerException.Message}\"\
    );\n    }\n}\n```\n\n## Optimizing PLINQ Performance\n\n### Partitioning Strategies\n\
    \nEffective partitioning is crucial for `PLINQ` performance. `PLINQ` uses different\
    \ partitioning strategies depending on the data source:\n\n1. **Range Partitioning**:\
    \ Used for sources that support indexing, like arrays or lists.\n2. **Chunk Partitioning**:\
    \ Used for linked lists or other non-indexed collections.\n3. **Hash Partitioning**:\
    \ Used for unordered sources or when grouping is involved.\n\nYou can influence\
    \ partitioning using the `WithDegreeOfParallelism()` method:\n```csharp\nvar result\
    \ = sourceData.AsParallel()\n.WithDegreeOfParallelism(4)\n.Where(x => x.IsValid)\n\
    .ToList();\n```\nThis limits the query to use at most 4 threads, which can be\
    \ useful for controlling resource usage or fine-tuning performance.\n\n### Merge\
    \ Options\n\n`PLINQ` provides different merge options to control how results from\
    \ parallel operations are combined:\n\n- `NotBuffered`: Results are returned as\
    \ soon as they are available (default for most operators).\n- `AutoBuffered`:\
    \ `PLINQ` decides whether to buffer results based on the query and data characteristics.\n\
    - `FullyBuffered`: All results are collected before being returned.\n\nYou can\
    \ set the merge options using the `WithMergeOptions()` method:\n```csharp\nvar\
    \ result = sourceData.AsParallel()\n.WithMergeOptions(ParallelMergeOptions.FullyBuffered)\n\
    .Where(x => x.IsValid)\n.ToList();\n```\n\n### Performance Considerations\n\n\
    To get the most out of `PLINQ`, consider the following tips:\n\n1. **Measure Performance**:\
    \ Always benchmark your parallel queries against their sequential counterparts\
    \ to ensure you're getting a real benefit.\n2. **Balance Workload**: Try to ensure\
    \ that each parallel operation takes roughly the same amount of time to avoid\
    \ bottlenecks.\n3. **Minimize Thread Synchronization**: Avoid operations that\
    \ require frequent synchronization between threads, as this can negate the benefits\
    \ of parallelization.\n4. **Use Appropriate Data Structures**: Choose data structures\
    \ that support efficient partitioning and parallel access.\n5. **Consider Memory\
    \ Usage**: Be aware that `PLINQ` may use more memory than sequential `LINQ` due\
    \ to buffering and intermediate results.\n6. **Optimize Individual Operations**:\
    \ Ensure that the operations within your query (e.g., predicates, selectors) are\
    \ as efficient as possible.\n\n## Advanced PLINQ Techniques\n\n### Custom Partitioners\n\
    \nWhile `PLINQ`'s built-in partitioning strategies work well for many scenarios,\
    \ you can create custom partitioners for specialized requirements:\n```csharp\n\
    public class CustomPartitioner<T> : Partitioner<T>\n{\n    private readonly IEnumerable<T>\
    \ _source;\n    public CustomPartitioner(IEnumerable<T> source)\n    {\n     \
    \   _source = source;\n    }\n    public override IList<IEnumerator<T>> GetPartitions(int\
    \ partitionCount)\n    { \n        // Implement custom partitioning logic here\
    \ \n    }\n}\n// Usage\nvar customPartitioner = new CustomPartitioner<MyData>(sourceData);\n\
    var result = customPartitioner.AsParallel()\n.Where(x => x.IsValid)\n.ToList();\n\
    ```\nCustom partitioners can be particularly useful for data sources with unique\
    \ characteristics or when you need fine-grained control over how work is distributed.\n\
    \n### Parallel Aggregation\n\n`PLINQ` provides powerful aggregation capabilities\
    \ that can be parallelized for improved performance:\n```csharp\nvar sum = numbers.AsParallel()\n\
    .Aggregate(\n    seed: 0,\n    func: (partialSum, item) => partialSum + item,\n\
    \    resultSelector: finalSum => finalSum\n);\n```\n"
