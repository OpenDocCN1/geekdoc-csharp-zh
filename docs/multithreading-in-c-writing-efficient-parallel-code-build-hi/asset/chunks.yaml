    \    }\n    finally\n    {\n      if (lockTaken) spinLock.Exit();\n    }\n  }\n\
    }\n```\n\n`SpinLock` 为低竞争和短临界区的场景提供了传统锁的轻量级替代方案。\n\n## 9.4 线程间通信\n\n线程之间的有效通信对于协调它们的活动至关重要。C#\
    \ 提供了几种线程间通信机制：\n\n### 9.4.1 事件等待与信号\n\n`AutoResetEvent`、`ManualResetEvent` 及其轻量级对应版本提供了线程发送信号的方法。\n\
    \n```csharp\nclass ProducerConsumer {\n  private Queue<int> buffer = new Queue<int>();\n\
