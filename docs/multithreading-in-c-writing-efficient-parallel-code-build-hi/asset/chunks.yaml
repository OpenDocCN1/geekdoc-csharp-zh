    \ public void LongRunningOperation()\n    { \n        lock (lockObject)\n    \
    \    { \n            // Simulate a long-running operation \n            Thread.Sleep(5000);\
    \ \n        }\n    }\n\n    public void ShortOperation()\n    { \n        lock\
