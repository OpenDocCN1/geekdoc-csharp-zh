    \ C# 还提供了更高级的线程协调技术：\n\n### 9.3.1 ReaderWriter Locks（读写锁）\n\n读写锁允许多个线程同时读取资源，同时确保写入操作的排他性访问。当你有一个频繁被读取但较少更新的资源时，这种方法特别有用。\n\
    \n```csharp\nusing System.Threading;\npublic class ThreadSafeCache<TKey, TValue>\n\
