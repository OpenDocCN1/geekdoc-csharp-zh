    \ { /* ... */ }\nprivate int CalculatePart2() { /* ... */ }\nprivate int CombineResults(int\
    \ result1, int result2) { /* ... */ }\n```\n\n在此示例中，两个计算并行执行，然后在最后的步骤中合并结果。任务延续确保合并完成后。\n\
    \n### 9.4.3 BlockingCollection 和生产者消费者模式\n\n`BlockingCollection<T>` 类提供了用于生产者消费者模式的线程安全集合。\n\
    \n```csharp\nclass ProducerConsumer {\n  public BlockingCollection<int> buffer\
    \ = new BlockingCollection<int>(new ConcurrentQueue<int>(), 10);\n  public void\
    \ Produce(int item)\n  {\n    buffer.Add(item);\n    Console.WriteLine($\"Produced:\
    \ {item}\");\n  }\n  public int Consume()\n  {\n    int item = buffer.Take();\n\
    \    Console.WriteLine($\"Consumed: {item}\");\n    return item;\n  }\n  public\
    \ void CompleteAdding()\n  {\n    buffer.CompleteAdding();\n  }\n}\nclass Program\
    \ {\n  static void Main()\n  {\n    var pc = new ProducerConsumer();\n    Task\
    \ producer = Task.Run(() =>\n    {\n      for (int i = 0; i < 20; i++)\n     \
    \ {\n        pc.Produce(i);\n        Thread.Sleep(100);\n      }\n      pc.CompleteAdding();\n\
    \    });\n    Task consumer = Task.Run(() =>\n    {\n      foreach (var item in\
    \ pc.buffer.GetConsumingEnumerable())\n      {\n        Thread.Sleep(200);\n \
    \     }\n    });\n    Task.WaitAll(producer, consumer);\n  }\n}\n```\n\n此实现使用\
    \ `BlockingCollection<T>` 创建了一个自动处理生产者和消费者线程同步的边界缓冲区。\n\n## 9.5 线程协调的最佳实践\n\n\
    在应用程序中实现线程协调时，请考虑以下最佳实践：\n\n1. 最小化共享状态：共享状态越少，需要的同步点就越少，从而降低代码复杂度。\n\n2. 使用适当的同步原语：根据场景选择合适的工具。对于简单场景，`lock`\
    \ 可能足够；对于更复杂的场景，考虑使用 `ReaderWriterLockSlim` 或 `SemaphoreSlim`。\n\n3. 避免嵌套锁：嵌套锁可能导致死锁。如果必须使用嵌套锁，请确保所有线程都按照相同的顺序获取它们。\n\
    \n"
