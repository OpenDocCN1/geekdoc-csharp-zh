    using System; using System.Collections.Concurrent; using System.Net.Http; using
    System.Threading; using System.Threading.Tasks; public class ConcurrentWebCrawler
    { private readonly HttpClient _httpClient; private readonly ConcurrentQueue<string>
    _urlsToVisit; private readonly ConcurrentDictionary<string, bool> _visitedUrls;
    private readonly int _maxConcurrency; private readonly int _maxUrls; public ConcurrentWebCrawler(int
    maxConcurrency, int maxUrls)


    {


    _httpClient = new HttpClient();


    _urlsToVisit = new ConcurrentQueue<string>();


    _visitedUrls = new ConcurrentDictionary<string, bool>();


    _maxConcurrency = maxConcurrency;


    _maxUrls = maxUrls;


    } public async Task CrawlAsync(string startUrl)


    {


    _urlsToVisit.Enqueue(startUrl); var tasks = new List<Task>(); for (int i = 0;
    i < _maxConcurrency; i++)


    {


    tasks.Add(CrawlWorkerAsync());


    }


    await Task.WhenAll(tasks);


    } private async Task CrawlWorkerAsync()


    { while (_urlsToVisit.TryDequeue(out string url) && *visitedUrls.Count <* maxUrls)


    { if (_visitedUrls.TryAdd(url, true))


    { try { string content = await _httpClient.GetStringAsync(url);


    Console.WriteLine($"Crawled: {url}"); // Process the content (e.g., extract links,
    analyze text) // For simplicity, we''ll just print the length of the content Console.WriteLine($"Content
    length: {content.Length}"); // Extract new URLs and add them to the queue ExtractUrls(content).ForEach(newUrl
    => _urlsToVisit.Enqueue(newUrl));


    } catch (Exception ex)


    {


    Console.WriteLine($"Error crawling {url}: {ex.Message}");


    }


    }


    }


    } private List<string> ExtractUrls(string content)


    { // Implement URL extraction logic here // For simplicity, we''ll return an empty
    list return new List<string>();


    }


    }


    This concurrent web crawler uses a combination of Task-based asynchronous programming
    and thread-safe collections (ConcurrentQueue and ConcurrentDictionary) to manage
    the crawling process. The CrawlAsync method initializes multiple worker tasks
    that concurrently process URLs from the queue.


    To use this web crawler, you can create an instance and start crawling like this:
    var crawler = new ConcurrentWebCrawler(maxConcurrency: 5, maxUrls: 100);


    await crawler.CrawlAsync("https://example.com"); This project demonstrates how
    multithreading can be used to improve the performance of I/O-bound operations,
    such as making HTTP requests and processing web content.


    ### 3\. Parallel Sorting Algorithm


    Sorting large datasets is a common task in many applications, and parallelizing
    sorting algorithms can lead to significant performance improvements. This sample
    project implements a parallel merge sort algorithm using multithreading.


    using System; using System.Threading.Tasks; public class ParallelMergeSort { public
    static void Sort<T>(T[] arr) where T : IComparable<T>


    {


    ParallelMergeSortRecursive(arr, 0, arr.Length - 1, Environment.ProcessorCount);


    } private static void ParallelMergeSortRecursive<T>(T[] arr, int left, int right,
    int depth) where T : IComparable<T>


    { if (left < right)


    { if (depth <= 0)


    { // If we''ve reached the maximum depth, use sequential merge sort SequentialMergeSort(arr,
    left, right);


    } else { int mid = (left + right) / 2; // Recursively sort the left and right
    halves in parallel Parallel.Invoke(


    () => ParallelMergeSortRecursive(arr, left, mid, depth - 1),


    () => ParallelMergeSortRecursive(arr, mid + 1, right, depth - 1)


    ); // Merge the sorted halves Merge(arr, left, mid, right);


    }


    }


    } private static void SequentialMergeSort<T>(T[] arr, int left, int right) where
    T : IComparable<T>


    { if (left < right)


    { int mid = (left + right) / 2;


    SequentialMergeSort(arr, left, mid);


    SequentialMergeSort(arr, mid + 1, right);


    Merge(arr, left, mid, right);


    }


    } private static void Merge<T>(T[] arr, int left, int mid, int right) where T
    : IComparable<T>


    { int n1 = mid - left + 1; int n2 = right - mid;


    T[] leftArray = new T[n1];


    T[] rightArray = new T[n2];


    Array.Copy(arr, left, leftArray, 0, n1);


    Array.Copy(arr, mid + 1, rightArray, 0, n2); int i = 0, j = 0, k = left; while
    (i < n1 && j < n2)


    { if (leftArray[i].CompareTo(rightArray[j]) <= 0)


    {


    arr[k] = leftArray[i];


    i++;


    } else {


    arr[k] = rightArray[j];


    j++;


    }


    k++;


    } while (i < n1)


    {


    arr[k] = leftArray[i];


    i++;


    k++;


    } while (j < n2)


    {


    arr[k] = rightArray[j];


    j++;


    k++;


    }


    }


    }


    This parallel merge sort implementation uses the Parallel.Invoke method to recursively
    sort the left and right halves of the array concurrently. The algorithm switches
    to a sequential merge sort when it reaches a certain depth in the recursion tree,
    which helps to balance the overhead of creating new tasks with the benefits of
    parallelism.


    To use this parallel sorting algorithm, you can simply call the Sort method: int[]
    arr = { 64, 34, 25, 12, 22, 11, 90 };


    ParallelMergeSort.Sort(arr);


    Console.WriteLine(string.Join(", ", arr)); This project showcases how multithreading
    can be applied to improve the performance of CPU-bound algorithms, particularly
    when dealing with large datasets.


    ## Benchmarking Tools


    To effectively measure the performance improvements achieved through multithreading,
    it''s crucial to have reliable benchmarking tools. Here are some popular benchmarking
    tools and techniques for C# multithreading projects:


    ### 1. BenchmarkDotNet


    BenchmarkDotNet is a powerful .NET library for benchmarking. It provides a simple
    way to transform methods into benchmarks, track their performance, and produce
    detailed reports. Here''s an example of how to use BenchmarkDotNet to compare
    the performance of sequential and parallel implementations: using BenchmarkDotNet.Attributes;
    using BenchmarkDotNet.Running; using System.Linq; using System.Threading.Tasks;


    [MemoryDiagnoser] public class SortingBenchmark { private int[] _array;


    [Params(1000, 10000, 100000)] public int N;


    [GlobalSetup] public void Setup()


    {


    _array = Enumerable.Range(1, N).OrderBy(x => Guid.NewGuid()).ToArray();


    }


    [Benchmark(Baseline = true)] public void SequentialSort()


    {


    Array.Sort(_array);


    }


    [Benchmark] public void ParallelSort()


    {


    ParallelMergeSort.Sort(_array);


    }


    } public class Program { public static void Main(string[] args)


    { var summary = BenchmarkRunner.Run<SortingBenchmark>();


    }


    }


