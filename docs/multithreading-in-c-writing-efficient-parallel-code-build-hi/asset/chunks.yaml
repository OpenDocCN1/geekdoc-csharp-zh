    } finally {


    rwLock.ExitReadLock();


    }


    }


    }


    The ReaderWriterLockSlim allows multiple threads to acquire read locks simultaneously,
    but ensures that only one thread can hold a write lock at a time, and no read
    locks can be acquired while a write lock is held.


    ### Semaphore and SemaphoreSlim


