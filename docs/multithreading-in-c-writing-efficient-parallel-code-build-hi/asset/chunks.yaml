    \ acquired both locks\");\n        }\n    }\n});\n\nthread1.Start();\nthread2.Start();\n\
    ```\n\nIn this scenario, `thread1` acquires `lockA` and waits for `lockB`, while\
    \ `thread2` acquires `lockB` and waits for `lockA`, resulting in a deadlock.\n\
    \n### Fix:\n\nTo prevent deadlocks, always acquire locks in a consistent order\
    \ across all threads:\n\n```csharp\nobject lockA = new object(); \nobject lockB\
    \ = new object(); \n\nThread thread1 = new Thread(() =>\n{ \n    lock (lockA)\n\
    \    {\n        Thread.Sleep(1000); // Simulate some work \n        lock (lockB)\n\
    \        {\n            Console.WriteLine(\"Thread 1 acquired both locks\");\n\
    \        }\n    }\n});\n\nThread thread2 = new Thread(() =>\n{ \n    lock (lockA)\
    \ // Changed to acquire lockA first \n    {\n        Thread.Sleep(1000); // Simulate\
    \ some work \n        lock (lockB)\n        {\n            Console.WriteLine(\"\
    Thread 2 acquired both locks\");\n        }\n    }\n});\n\nthread1.Start();\n\
    thread2.Start();\n```\n\nAnother approach is to use `Monitor.TryEnter` with a\
    \ timeout to detect and recover from deadlocks:\n\n```csharp\nbool lockATaken\
    \ = false; \nbool lockBTaken = false; \ntry { \n    lockATaken = Monitor.TryEnter(lockA,\
    \ TimeSpan.FromSeconds(1));\n    if (lockATaken) {\n        lockBTaken = Monitor.TryEnter(lockB,\
    \ TimeSpan.FromSeconds(1));\n        if (lockBTaken) {\n            // Perform\
    \ operations with both locks\n        }\n    }\n} finally { \n    if (lockBTaken)\
    \ Monitor.Exit(lockB); \n    if (lockATaken) Monitor.Exit(lockA); \n}\n```\n\n\
    ## 3. Thread Starvation\n\nThread starvation occurs when one or more threads are\
