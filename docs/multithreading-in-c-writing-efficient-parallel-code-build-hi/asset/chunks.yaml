    \n此项目演示了如何使用多线程提高 I/O 密集操作的性能，例如发送 HTTP 请求和处理网页内容。\n\n## 3. 并行排序算法\n\n对大型数据集进行排序是许多应用程序中的常见任务，并行排序算法可以显著提高性能。此示例项目使用多线程实现了并行归并排序算法。\n\
