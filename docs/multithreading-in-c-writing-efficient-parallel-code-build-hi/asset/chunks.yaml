    \n## 结论\n\nPLINQ 是 C# 开发者工具箱中的强大工具，它提供了一种简单的方法来并行化数据处理任务，并利用现代多核处理器的全部潜力。通过自动处理并行执行的复杂性，PLINQ\
    \ 允许开发者专注于清晰、简洁地表达他们的查询，同时仍能获得并行带来的性能收益。\n\n在整个章节中，我们探索了 PLINQ 的基础知识、其查询操作符、执行模式和优化技术。我们看到了\
    \ PLINQ 如何应用于各种现实场景，从财务数据分析到图像处理和文本分析。\n\n然而，至关重要的是，并行并不是万灵药。PLINQ 的有效性取决于多种因素，包括数据的性质、操作的复杂性以及硬件特性。始终衡量并比较并行查询与其顺序对应项的性能，以确保你获得了实际收益。\n\
    \n随着你继续使用 PLINQ，你将更深入地理解何时以及如何最有效地应用它。通过练习，你将能够编写出高效、可扩展的查询，处理不断增长的数据集和复杂的计算，使你的应用程序在面临增长的数据挑战时保持高效。\n\
    \n记住，掌握 PLINQ 的关键不仅在于理解它的语法和功能，还在于培养对并行思维的直觉。通过考虑你的数据如何被分区和并发处理，你将完全有能力充分利用 PLINQ\
    \ 的潜力，创建高性能、数据密集型应用程序，并扩展以满足现代计算环境的需求。\n\n# 第 9 章：线程间的协调与通信\n\n### ❧\n\n在多线程编程领域，线程之间的协调与通信是至关重要的方面，它们决定了应用程序的效率和可靠性。当我们深入研究\
    \ C# 中线程管理的复杂性，我们将探索各种实现并发执行路径之间无缝交互的机制和技术。本章将为你提供编排复杂线程交互所需的知识和工具，确保你的多线程应用程序运行流畅且高效。\n\
    \n## 9.1 线程协调的重要性\n\n线程协调是有效多线程编程的基石。如果没有适当的协调，线程可能会相互干扰，导致竞态条件、死锁和其他同步问题。让我们来看看为什么协调如此关重要：\n\
    \n### 9.1.1 避免竞态条件\n\n当多个线程同时访问共享资源时会发生竞态条件，可能会导致意外的错误结果。考虑以下示例：`csharp\npublic\
    \ class BankAccount {\n  private decimal balance;\n  public void Deposit(decimal\
    \ amount)\n  {\n    balance += amount;\n  }\n  public void Withdraw(decimal amount)\n\
    \  {\n    if (balance >= amount)\n    {\n      balance -= amount;\n    }\n  }\n\
    }\n```\n\n如果两个线程尝试同时存款或取款，由于缺乏适当的同步，最终余额可能是错误的。这就是线程协调发挥作用的地方，确保此类操作是以原子方式执行的。\n\
    \n### 9.1.2 防止死锁\n\n死锁发生在两个或多个线程无法继续执行，因为每个线程都在等待另一个释放资源。如果没有适当的协调，死锁可能会让你的应用程序停滞。考虑这个经典示例：`csharp\n\
    object resource1 = new object();\nobject resource2 = new object();\n\nThread t1\
    \ = new Thread(() =>\n{\n  lock (resource1)\n  {\n    Thread.Sleep(1000);\n  \
    \  lock (resource2)\n    { // 执行某些操作 }\n  }\n});\n\nThread t2 = new Thread(()\
    \ =>\n{\n  lock (resource2)\n  {\n    Thread.Sleep(1000);\n    lock (resource1)\n\
    \    { // 执行某些操作 }\n  }\n});\n\nt1.Start();\nt2.Start();\n```\n\n在这种情况下，两个线程都可能无限期地等待另一个释放它们所需的资源。适当的协调技术可以帮助避免此类情况。\n\
    \n### 9.1.3 确保正确的执行顺序\n\n在许多场景中，某些操作必须跨多个线程按特定顺序执行。如果没有协调，无法保证执行序列。例如：`csharp\n\
    bool dataReady = false;\nstring sharedData = string.Empty;\n\nThread producer\
    \ = new Thread(() =>\n{\n  sharedData = \"重要数据\";\n  dataReady = true;\n});\n\n\
    Thread consumer = new Thread(() =>\n{\n  while (!dataReady) { }\n  Console.WriteLine(sharedData);\n\
    });\n\nproducer.Start();\nconsumer.Start();\n```\n\n在这个示例中，我们需要确保消费者线程在生产者准备好数据之前访问它。协调机制可以保证执行顺序。\n\
    \n## 9.2 C# 中的同步原语\n\nC# 提供了几种促进线程协调的同步原语。让我们探索一些最常用的：\n\n### 9.2.1 Monitor 和\
    \ Lock\n\n`Monitor` 类和 `lock` 语句是 C# 中基本的同步工具。它们提供了一种创建临界区的方法，确保一次只有一个线程可以执行特定的代码块。\n\
    \n```csharp\npublic class ThreadSafeCounter {\n  private int count = 0;\n  private\
    \ object lockObject = new object();\n  public void Increment()\n  {\n    lock\
    \ (lockObject)\n    {\n      count++;\n    }\n  }\n  public int GetCount()\n \
    \ {\n    lock (lockObject)\n    {\n      return count;\n    }\n  }\n}\n```\n"
- fmt: "In this example, the `lock` statement ensures that the `count` variable is\
    \ accessed and modified by only one thread at a time, preventing race conditions.\n\
    \n### 9.2.2 Mutex\n\nA `Mutex` (mutual exclusion) is a synchronization primitive\
    \ that can be used across multiple processes. It's particularly useful when you\
    \ need to coordinate access to shared resources between different applications.\n\
    \n```csharp\nusing System.Threading;\nclass Program {\n  static Mutex mutex =\
    \ new Mutex(false, \"GlobalMutex\");\n  static void Main()\n  {\n    if (mutex.WaitOne(TimeSpan.FromSeconds(3),\
    \ false))\n    {\n      try\n      {\n        Console.WriteLine(\"Mutex acquired,\
    \ performing critical operation\");\n        Thread.Sleep(5000); // Simulating\
    \ work\n      }\n      finally\n      {\n        mutex.ReleaseMutex();\n     \
    \ }\n    }\n    else\n    {\n      Console.WriteLine(\"Failed to acquire mutex\"\
    );\n    }\n  }\n}\n```\n\nIn this example, the `Mutex` ensures that only one instance\
    \ of the application can perform the critical operation at a time.\n\n### 9.2.3\
    \ Semaphore and SemaphoreSlim\n\nSemaphores are synchronization primitives that\
    \ control access to a shared resource by multiple threads. They maintain a count\
    \ of available resources and allow or block threads based on this count.\n\n```csharp\n\
    class BoundedBuffer {\n  private Queue<int> buffer = new Queue<int>();\n  private\
    \ SemaphoreSlim emptySlots;\n  private SemaphoreSlim fullSlots;\n  private object\
    \ lockObject = new object();\n  public BoundedBuffer(int capacity)\n  {\n    emptySlots\
    \ = new SemaphoreSlim(capacity, capacity);\n    fullSlots = new SemaphoreSlim(0,\
    \ capacity);\n  }\n  public void Produce(int item)\n  {\n    emptySlots.Wait();\n\
    \    lock (lockObject)\n    {\n      buffer.Enqueue(item);\n    }\n    fullSlots.Release();\n\
    \  }\n  public int Consume()\n  {\n    fullSlots.Wait();\n    int item;\n    lock\
    \ (lockObject)\n    {\n      item = buffer.Dequeue();\n    }\n    emptySlots.Release();\n\
    \    return item;\n  }\n}\n```\n\nThis implementation of a bounded buffer uses\
    \ `SemaphoreSlim` to coordinate between producer and consumer threads, ensuring\
    \ that the buffer doesn't overflow or underflow.\n\n## 9.3 Advanced Synchronization\
    \ Techniques\n\nWhile basic synchronization primitives are essential, C# offers\
    \ more advanced techniques for thread coordination:\n\n### 9.3.1 ReaderWriter\
    \ Locks\n\nReader-writer locks allow multiple threads to read a resource simultaneously\
    \ while ensuring exclusive access for writing. This is particularly useful when\
    \ you have a resource that is frequently read but infrequently updated.\n\n```csharp\n\
    using System.Threading;\npublic class ThreadSafeCache<TKey, TValue>\n{\n  private\
    \ Dictionary<TKey, TValue> cache = new Dictionary<TKey, TValue>();\n  private\
    \ ReaderWriterLockSlim cacheLock = new ReaderWriterLockSlim();\n  public TValue\
    \ GetOrAdd(TKey key, Func<TKey, TValue> valueFactory)\n  {\n    cacheLock.EnterUpgradeableReadLock();\n\
    \    try\n    {\n      if (cache.TryGetValue(key, out TValue value))\n      {\n\
    \        return value;\n      }\n      cacheLock.EnterWriteLock();\n      try\n\
    \      {\n        if (!cache.TryGetValue(key, out value))\n        {\n       \
    \   value = valueFactory(key);\n          cache[key] = value;\n        }\n   \
    \     return value;\n      }\n      finally\n      {\n        cacheLock.ExitWriteLock();\n\
    \      }\n    }\n    finally\n    {\n      cacheLock.ExitUpgradeableReadLock();\n\
    \    }\n  }\n}\n```\n\nThis implementation of a thread-safe cache uses a `ReaderWriterLockSlim`\
    \ to allow concurrent reads while ensuring exclusive access for writes.\n\n###\
    \ 9.3.2 Interlocked Operations\n\nThe `Interlocked` class provides atomic operations\
    \ for variables that are shared by multiple threads. These operations are often\
    \ more efficient than using locks for simple operations.\n\n```csharp\npublic\
    \ class AtomicCounter {\n  private long count;\n  public long Increment()\n  {\n\
    \    return Interlocked.Increment(ref count);\n  }\n  public long Decrement()\n\
    \  {\n    return Interlocked.Decrement(ref count);\n  }\n  public long GetCount()\n\
    \  {\n    return Interlocked.Read(ref count);\n  }\n}\n```\n\nThis implementation\
    \ of an atomic counter uses `Interlocked` operations to ensure thread-safe increments\
    \ and decrements without the need for explicit locks.\n\n### 9.3.3 SpinWait and\
    \ SpinLock\n\nFor scenarios where you expect contention to be rare and short-lived,\
    \ spin-based synchronization can be more efficient than traditional locks.\n\n\
    ```csharp\npublic class SpinLockExample {\n  private SpinLock spinLock = new SpinLock();\n\
    \  public void PerformOperation()\n  {\n    bool lockTaken = false;\n    try\n\
    \    {\n      spinLock.Enter(ref lockTaken); // Perform thread-safe operation\n\
    \    }\n    finally\n    {\n      if (lockTaken) spinLock.Exit();\n    }\n  }\n\
    }\n```\n\n`SpinLock` provides a lightweight alternative to traditional locks for\
    \ scenarios with low contention and short critical sections.\n\n## 9.4 Inter-Thread\
    \ Communication\n\nEffective communication between threads is crucial for coordinating\
    \ their activities. C# provides several mechanisms for inter-thread communication:\n\
    \n### 9.4.1 Event Waiting and Signaling\n\nThe `AutoResetEvent`, `ManualResetEvent`,\
    \ and their slim counterparts provide a way for threads to signal each other and\
    \ wait for signals.\n\n```csharp\nclass ProducerConsumer {\n  private Queue<int>\
    \ buffer = new Queue<int>();\n  private AutoResetEvent dataAvailable = new AutoResetEvent(false);\n\
    \  private AutoResetEvent spaceAvailable = new AutoResetEvent(true);\n  private\
    \ const int MaxItems = 5;\n  public void Produce(int item)\n  {\n    spaceAvailable.WaitOne();\n\
    \    lock (buffer)\n    {\n      buffer.Enqueue(item);\n      if (buffer.Count\
    \ == 1)\n      {\n        dataAvailable.Set();\n      }\n    }\n  }\n  public\
    \ int Consume()\n  {\n    dataAvailable.WaitOne();\n    lock (buffer)\n    {\n\
    \      int item = buffer.Dequeue();\n      if (buffer.Count == MaxItems - 1)\n\
    \      {\n        spaceAvailable.Set();\n      }\n      return item;\n    }\n\
    \  }\n}\n```\n\nThis implementation uses `AutoResetEvent` to coordinate between\
    \ producer and consumer threads, signaling when data is available or when space\
    \ is available in the buffer.\n\n### 9.4.2 Task Continuation\n\nTask continuations\
    \ provide a way to specify additional work that should be executed after a task\
    \ completes. This is a powerful mechanism for coordinating asynchronous operations.\n\
    \n```csharp\npublic async Task<int> PerformComplexCalculationAsync()\n{\n  var\
    \ task1 = Task.Run(() => CalculatePart1());\n  var task2 = Task.Run(() => CalculatePart2());\n\
    \  var results = await Task.WhenAll(task1, task2);\n  return await Task.Run(()\
    \ => CombineResults(results[0], results[1]));\n}\nprivate int CalculatePart1()\
    \ { /* ... */ }\nprivate int CalculatePart2() { /* ... */ }\nprivate int CombineResults(int\
    \ result1, int result2) { /* ... */ }\n```\n\nIn this example, two calculations\
    \ are performed concurrently, and their results are then combined in a final step.\
    \ Task continuations ensure that the combining step only occurs after both calculations\
    \ are complete.\n\n### 9.4.3 BlockingCollection and ProducerConsumer Pattern\n\
    \nThe `BlockingCollection<T>` class provides a thread-safe collection for implementing\
    \ the producer-consumer pattern.\n\n```csharp\nclass ProducerConsumer {\n  private\
    \ BlockingCollection<int> buffer = new BlockingCollection<int>(new ConcurrentQueue<int>(),\
    \ 10);\n  public void Produce(int item)\n  {\n    buffer.Add(item);\n    Console.WriteLine($\"\
    Produced: {item}\");\n  }\n  public int Consume()\n  {\n    int item = buffer.Take();\n\
    \    Console.WriteLine($\"Consumed: {item}\");\n    return item;\n  }\n  public\
    \ void CompleteAdding()\n  {\n    buffer.CompleteAdding();\n  }\n}\nclass Program\
    \ {\n  static void Main()\n  {\n    var pc = new ProducerConsumer();\n    Task\
    \ producer = Task.Run(() =>\n    {\n      for (int i = 0; i < 20; i++)\n     \
    \ {\n        pc.Produce(i);\n        Thread.Sleep(100);\n      }\n      pc.CompleteAdding();\n\
    \    });\n    Task consumer = Task.Run(() =>\n    {\n      foreach (var item in\
    \ pc.buffer.GetConsumingEnumerable())\n      {\n        Thread.Sleep(200);\n \
    \     }\n    });\n    Task.WaitAll(producer, consumer);\n  }\n}\n```\n\nThis implementation\
    \ uses `BlockingCollection<T>` to create a bounded buffer that automatically handles\
    \ synchronization between producer and consumer threads.\n\n## 9.5 Best Practices\
    \ for Thread Coordination\n\nWhen implementing thread coordination in your applications,\
    \ consider the following best practices:\n\n1. Minimize shared state: The less\
    \ shared state you have, the fewer synchronization points you need, reducing the\
    \ complexity of your code.\n\n2. Use the appropriate synchronization primitive:\
    \ Choose the right tool for the job. For simple scenarios, a `lock` might suffice.\
    \ For more complex scenarios, consider using `ReaderWriterLockSlim` or `SemaphoreSlim`.\n\
    \n3. Avoid nested locks: Nested locks can lead to deadlocks. If you must use nested\
