    offers more flexibility when used directly. It provides methods for entering and
    exiting critical sections, as well as for waiting and pulsing.


    public class BankAccount { private int balance; private readonly object lockObject
    = new object(); public void Deposit(int amount)


    {


    Monitor.Enter(lockObject); try {


    balance += amount;


    } finally {


    Monitor.Exit(lockObject);


    }


    } public bool Withdraw(int amount)


    {


    Monitor.Enter(lockObject); try { if (balance >= amount)


    {


    balance -= amount; return true;


    } return false;


    } finally {


    Monitor.Exit(lockObject);


    }


    } public int GetBalance()


    {


    Monitor.Enter(lockObject); try { return balance;


    } finally {


    Monitor.Exit(lockObject);


    }


    }


    }


    The Monitor class also provides Wait, Pulse, and PulseAll methods for more complex
    thread coordination scenarios. These methods allow threads to temporarily release
    a lock and wait for a signal from another thread before reacquiring the lock and
    continuing execution.


