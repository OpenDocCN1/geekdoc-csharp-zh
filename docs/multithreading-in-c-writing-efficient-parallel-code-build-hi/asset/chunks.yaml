    ## Sample Projects


    ### 1\. Parallel Image Processing


    One of the most common and effective applications of multithreading is in image
    processing. This sample project demonstrates how to leverage parallel processing
    to apply various filters and transformations to large sets of images.


    using System; using System.Drawing; using System.IO; using System.Threading.Tasks;
    public class ParallelImageProcessor { public static void ProcessImages(string
    inputFolder, string outputFolder, Func<Bitmap, Bitmap> filter)


    {


    Directory.CreateDirectory(outputFolder); string[] imageFiles = Directory.GetFiles(inputFolder,
    "*.jpg");


    Parallel.ForEach(imageFiles, imagePath =>


    { using (Bitmap originalImage = new Bitmap(imagePath))


    {


    Bitmap processedImage = filter(originalImage); string outputPath = Path.Combine(outputFolder,
    Path.GetFileName(imagePath));


    processedImage.Save(outputPath);


    }


    });


    } public static Bitmap GrayscaleFilter(Bitmap input)


    {


    Bitmap output = new Bitmap(input.Width, input.Height); for (int y = 0; y < input.Height;
    y++)


    { for (int x = 0; x < input.Width; x++)


    {


    Color pixel = input.GetPixel(x, y); int grayScale = (int)((pixel.R * 0.3) + (pixel.G
    * 0.59) + (pixel.B * 0.11));


    Color grayColor = Color.FromArgb(grayScale, grayScale, grayScale);


    output.SetPixel(x, y, grayColor);


    }


    } return output;


    }


    }


    This sample project demonstrates how to use Parallel.ForEach to process multiple
    images concurrently. The ProcessImages method takes an input folder containing
    images, an output folder for processed images, and a filter function to apply
    to each image. The GrayscaleFilter method is an example of a simple image transformation
    that converts color images to grayscale.


    To use this project, you can call the ProcessImages method like this: string inputFolder
    = @"C:\InputImages"; string outputFolder = @"C:\OutputImages";'
