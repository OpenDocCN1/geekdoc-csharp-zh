    \n};\n\nParallel.For(0, 10, options, i =>\n\n{\n\nConsole.WriteLine($\"Processing\
    \ item {i}\");\n\n});\n\n## 5\\. Async/Await Pattern\n\n### Async Methods\n\n\
    public async Task<int> AsyncMethod()\n\n{\n\nawait Task.Delay(1000); // Simulate\
