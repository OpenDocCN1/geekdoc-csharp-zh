    ## 4. 任务并行库 (TPL)\n\n### 创建并启动任务\n\n```csharp\n// 方法 1：使用 Task.Run\nTask task1\
    \ = Task.Run(() => Console.WriteLine(\"Hello from Task 1\"));\n\n// 方法 2：使用 Task\
    \ 构造函数\nTask task2 = new Task(() => Console.WriteLine(\"Hello from Task 2\"));\
    \ \ntask2.Start();\n\n// 方法 3：使用 Task.Factory.StartNew\nTask task3 = Task.Factory.StartNew(()\
    \ => Console.WriteLine(\"Hello from Task 3\"));\n\n// 创建带有返回值的任务\nTask<int> task4\
    \ = Task.Run(() =>\n{ \n    // 计算\n    return 42;\n});\n\n// 访问结果\nint result\
    \ = task4.Result; // 阻塞直到任务完成\n```\n\n### Task Continuation（任务延续）\n\n```csharp\n\
    Task<int> task = Task.Run(() => 42);\nTask continuationTask = task.ContinueWith(antecedent\
    \ =>\n{\n    int result = antecedent.Result;\n    Console.WriteLine($\"The result\
    \ is: {result}\");\n});\n\n// 条件延续\nTask successTask = task.ContinueWith(antecedent\
    \ =>\n{\n    Console.WriteLine(\"Task completed successfully\");\n}, TaskContinuationOptions.OnlyOnCompletion);\n\
    \n// 失败时延续\nTask faultedTask = task.ContinueWith(antecedent =>\n{\n    Console.WriteLine(\"\
    Task faulted\");\n}, TaskContinuationOptions.OnlyOnFaulted);\n```\n\n### Task\
    \ Waiting 和 Cancellation（等待与取消）\n\n```csharp\n// 等待单个任务\ntask.Wait();\n\n// 等待多个任务\n\
    Task.WaitAll(task1, task2, task3);\n\n// 等待任意任务完成\nTask.WaitAny(task1, task2,\
    \ task3);\n\n// 取消\nCancellationTokenSource cts = new CancellationTokenSource();\n\
    CancellationToken token = cts.Token;\nTask cancelableTask = Task.Run(() =>\n{\n\
    \    while (!token.IsCancellationRequested)\n    {\n        // 工作\n    }\n}, token);\n\
    \n// 取消任务\ncts.Cancel();\n```\n\n### Parallel.For 和 Parallel.ForEach\n\n```csharp\n\
    // Parallel.For\nParallel.For(0, 10, i =>\n{\n    Console.WriteLine(i);\n});\n\
