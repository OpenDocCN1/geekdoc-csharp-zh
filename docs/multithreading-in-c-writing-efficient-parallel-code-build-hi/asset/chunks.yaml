    # Chapter 7: Using Parallel.For and Parallel.ForEach


    ### ❧


    In the ever-evolving landscape of modern software development, the ability to
    harness the power of multiple processor cores has become increasingly crucial.
    As we delve deeper into the realm of multithreading in C#, we encounter two powerful
    tools that simplify the process of parallelizing loops: Parallel.For and Parallel.ForEach.
    These constructs, part of the Task Parallel Library (TPL), provide an elegant
    and efficient way to distribute workloads across multiple threads, potentially
    leading to significant performance improvements in your applications.


    ## Understanding Parallel Loops


    Before we dive into the specifics of Parallel.For and Parallel.ForEach, let''s
    take a moment to understand the concept of parallel loops. In traditional sequential
    programming, loops execute one iteration after another, processing elements in
    a linear fashion. While this approach is straightforward, it fails to utilize
    the full potential of modern multi-core processors.


    Parallel loops, on the other hand, distribute the workload of a loop across multiple
    threads, allowing multiple iterations to execute concurrently. This parallelism
    can lead to substantial performance gains, especially when dealing with computationally
    intensive tasks or large datasets.


    Consider the following scenario: You have a collection of 1,000,000 integers,
    and you need to perform a complex calculation on each one. In a sequential loop,
    your processor would tackle these calculations one by one, potentially taking
    a considerable amount of time. With a parallel loop, however, the work can be
    divided among multiple threads, each processing a portion of the data simultaneously.


    ## Introducing Parallel.For


    The Parallel.For method is a parallel implementation of the traditional for loop.
    It allows you to specify a range of values and an action to be performed for each
    value in that range. The TPL then handles the distribution of work across multiple
    threads, abstracting away the complexities of thread management.


    Let''s look at a basic example: using System; using System.Threading.Tasks; class
    ParallelForExample { static void Main()


    {


    Console.WriteLine("Starting Parallel.For example...");


    Parallel.For(0, 10, i =>


    {


    Console.WriteLine($"Iteration {i} on thread {Task.CurrentId}");


    });


    Console.WriteLine("Parallel.For completed.");


    }


    }


    In this example, we''re using Parallel.For to iterate from 0 to 9 (the second
    parameter is exclusive). For each iteration, we print the iteration number and
    the ID of the thread executing it. When you run this code, you''ll notice that
    the iterations are not necessarily executed in order, and different thread IDs
    are involved in processing the loop.


    ### Parallel.For Parameters


    The Parallel.For method has several overloads, but the most commonly used one
    takes three parameters:


    1.  fromInclusive: The start index (inclusive)


    2.  toExclusive: The end index (exclusive)


    3.  body: An Action<int> delegate representing the work to be done for each iteration


    ### Handling Exceptions in Parallel.For


    When working with parallel loops, it''s crucial to handle exceptions properly.
    Unlike sequential loops where an exception immediately halts execution, in parallel
    loops, multiple exceptions can occur simultaneously on different threads.


    Here''s an example of how to handle exceptions in a Parallel.For loop: try {


    Parallel.For(0, 100, (int i) =>


    { if (i == 50)


    { throw new Exception($"Error at iteration {i}");


    }


    Console.WriteLine($"Processing item {i}");


    });


    } catch (AggregateException ae)


    { foreach (var e in ae.InnerExceptions)


    {


    Console.WriteLine($"Exception: {e.Message}");


    }


    }


    In this example, we deliberately throw an exception when i equals 50\. The Parallel.For
    method wraps any exceptions thrown during execution in an AggregateException,
    which we can catch and process.


    ## Exploring Parallel.ForEach


    While Parallel.For is great for numeric ranges, Parallel.ForEach is designed to
    work with collections. It allows you to parallelize operations on elements of
    any IEnumerable<T> collection.


    Here''s a basic example:


    using System; using System.Collections.Generic; using System.Threading.Tasks;
    class ParallelForEachExample { static void Main()


    {


    List<string> items = new List<string> { "Apple", "Banana", "Cherry", "Date", "Elderberry"
    };


    Console.WriteLine("Starting Parallel.ForEach example...");


    Parallel.ForEach(items, item =>


    {


    Console.WriteLine($"Processing {item} on thread {Task.CurrentId}");


    });


    Console.WriteLine("Parallel.ForEach completed.");


    }


    }


    In this example, we''re processing a list of strings in parallel. Each item in
    the list is processed by a potentially different thread, as indicated by the Task.CurrentId.


    ### Parallel.ForEach Parameters


    The basic Parallel.ForEach method takes two parameters:


    1.  source: An IEnumerable<TSource> representing the collection to be processed


    2.  body: An Action<TSource> delegate representing the work to be done for each
    item


    ### Handling State in Parallel.ForEach


    Sometimes, you might need to maintain some state during the parallel processing
    of a collection. Parallel.ForEach provides overloads that allow you to initialize,
    use, and finalize local state for each task.


    Here''s an example:


    List<int> numbers = Enumerable.Range(1, 1000000).ToList(); long total = 0;


    Parallel.ForEach(numbers,


    () => 0L, // Initialize local state (number, loop, localTotal) =>


    {


    localTotal += number; // Use local state return localTotal;


    },


    (localTotal) => Interlocked.Add(ref total, localTotal) // Finalize local state
    );


    Console.WriteLine($"Total: {total}"); In this example, we''re calculating the
    sum of a large list of numbers. Each task maintains its own local total, which
    is then added to the global total at the end. This approach avoids the need for
    constant locking and can lead to better performance.


