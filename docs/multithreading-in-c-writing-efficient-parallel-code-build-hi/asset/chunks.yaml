    # Appendix C: Sample Projects and Benchmarking Tools


    ### ❧


    In this appendix, we''ll explore a collection of sample projects and benchmarking
    tools that will help you put your multithreading skills to the test and measure
    the performance improvements you''ve achieved. These resources are designed to
