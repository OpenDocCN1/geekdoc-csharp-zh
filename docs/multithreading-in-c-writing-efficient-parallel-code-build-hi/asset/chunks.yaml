    \ (lockObject)\n        {\n            balance += amount;\n        }\n    } \n\
    \    public void Withdraw(int amount)\n    { \n        lock (lockObject)\n   \
    \     {\n            balance -= amount;\n        }\n    }\n}\n```\n\nAlternatively,\
    \ for simple operations, you can use the `Interlocked` class:\n\n```csharp\npublic\
    \ void Deposit(int amount)\n{\n    Interlocked.Add(ref balance, amount);\n}\n\
    ```\n\n## 2. Deadlocks\n\nDeadlocks occur when two or more threads are waiting\
    \ for each other to release resources, resulting in a standstill where none of\
    \ the threads can proceed.\n\n### Symptom:\n\nThe program appears to freeze or\
    \ hang indefinitely.\n\n### Example:\n\n```csharp\nobject lockA = new object();\
    \ \nobject lockB = new object(); \n\nThread thread1 = new Thread(() =>\n{ \n \
