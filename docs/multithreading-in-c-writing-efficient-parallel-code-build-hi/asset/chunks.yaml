    ```


    ### 互斥锁 (Exclusive Locking)


    一种同步机制，一次时间只有一个线程可以持有锁。C# 中的 `lock` 关键字提供了互斥锁。


    ```csharp

    private readonly object _lock = new object(); public void ExclusiveOperation()


    { lock (_lock)


    { // 一时间只有一个线程可以执行此操作 }


