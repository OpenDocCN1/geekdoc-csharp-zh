    }; using (HttpClient client = new HttpClient())


    {


    Task[] downloadTasks = new Task[urls.Length]; for (int i = 0; i < urls.Length;
    i++)


    {


    downloadTasks[i] = DownloadFileAsync(client, urls[i], i + 1);


    }


    await Task.WhenAll(downloadTasks);


    }


    Console.WriteLine("All downloads completed.");


    } static async Task DownloadFileAsync(HttpClient client, string url, int fileNumber)


    {


    Console.WriteLine($"Starting download of file {fileNumber}"); string content =
    await client.GetStringAsync(url);


    Console.WriteLine($"Finished downloading file {fileNumber} (Size: {content.Length}
    bytes)");


    }


    }


    In this example, multiple files are downloaded concurrently, making efficient
    use of network resources and reducing the overall time required to complete the
    operation.


    ## Challenges and Considerations in Multithreaded Programming


    While multithreading offers numerous benefits, it also introduces complexity and
    potential pitfalls that developers must be aware of and address carefully.


    ### Race Conditions


    Race conditions occur when multiple threads access shared data concurrently, and
    the final outcome depends on the timing or order of their execution. This can
    lead to unpredictable and erroneous results.


    Consider the following example:


    using System; using System.Threading; class BankAccount { private int balance;
    public BankAccount(int initialBalance)


    {


    balance = initialBalance;


    } public void Deposit(int amount)


    {


    balance += amount;


    } public void Withdraw(int amount)


    { if (balance >= amount)


    { // Simulate some processing time Thread.Sleep(1);


    balance -= amount;


    }


    } public int GetBalance()


    { return balance;


    }


    } class Program { static void Main()


    {


    BankAccount account = new BankAccount(1000);


    Thread depositThread = new Thread(() =>


    { for (int i = 0; i < 100; i++)


    {


    account.Deposit(10);


    }


    });


    Thread withdrawThread = new Thread(() =>


    { for (int i = 0; i < 100; i++)


    {


    account.Withdraw(10);


    }


    });


    depositThread.Start();


    withdrawThread.Start();


    depositThread.Join();


    withdrawThread.Join();


    Console.WriteLine($"Final balance: {account.GetBalance()}");


    }


    }


    In this example, the final balance may not always be 1000 as expected, due to
    the race condition between the deposit and withdraw operations.


    ### Deadlocks


    Deadlocks occur when two or more threads are unable to proceed because each is
    waiting for the other to release a resource. This results in a circular dependency
    that prevents any of the threads from making progress.


    Here''s an example illustrating a potential deadlock situation: using System;
    using System.Threading; class Program { static object resource1 = new object();
    static object resource2 = new object(); static void Main()


    {


    Thread thread1 = new Thread(DoWork1);


    Thread thread2 = new Thread(DoWork2);


    thread1.Start();


    thread2.Start();


    thread1.Join();


    thread2.Join();


    } static void DoWork1()


    { lock (resource1)


    {


    Console.WriteLine("Thread 1 acquired resource 1");


    Thread.Sleep(1000); lock (resource2)


    {


    Console.WriteLine("Thread 1 acquired resource 2");


    }


    }


    } static void DoWork2()


    { lock (resource2)


    {


    Console.WriteLine("Thread 2 acquired resource 2");


    Thread.Sleep(1000); lock (resource1)


    {


    Console.WriteLine("Thread 2 acquired resource 1");


    }


    }


    }


    }


    In this example, there''s a potential for deadlock if Thread 1 acquires resource1
    and Thread 2 acquires resource2 simultaneously, as each thread will then wait
    indefinitely for the other resource.


    ### Thread Safety


    Ensuring thread safety is crucial in multithreaded applications. Thread safety
    refers to the property of code that allows it to function correctly when accessed
    by multiple threads concurrently.


    Here''s an example of making the earlier BankAccount class thread-safe using a
    lock: using System; using System.Threading; class ThreadSafeBankAccount { private
    int balance; private object lockObject = new object(); public ThreadSafeBankAccount(int
    initialBalance)


    {


    balance = initialBalance;


    } public void Deposit(int amount)


    { lock (lockObject)


    {


    balance += amount;


    }


    } public void Withdraw(int amount)


    { lock (lockObject)


    { if (balance >= amount)


    { // Simulate some processing time Thread.Sleep(1);


    balance -= amount;


    }


    }


    } public int GetBalance()


    { lock (lockObject)


    { return balance;


    }


    }


    }


    By using the lock statement, we ensure that only one thread can access the critical
    section of code at a time, preventing race conditions.


    ### Performance Overhead


    While multithreading can improve performance, it also introduces overhead due
    to thread creation, context switching, and synchronization. In some cases, excessive
    use of threads can actually degrade performance.


    It''s important to carefully consider the granularity of parallelism and use profiling
    tools to measure the actual performance impact of multithreading in your application.


    ## Conclusion


    Multithreading and parallelism are powerful tools in a developer''s arsenal, offering
    the potential for significant performance improvements and enhanced responsiveness
    in applications. However, they also introduce complexity and potential pitfalls
    that require careful consideration and design.


    As we delve deeper into the world of concurrent programming in C#, we''ll explore
    more advanced concepts, patterns, and best practices for leveraging the full power
    of multithreading while mitigating its challenges. The journey ahead promises
    to be both challenging and rewarding, opening up new possibilities for creating
    efficient, responsive, and scalable applications in the modern computing landscape.


    # Chapter 2: Using Threads in C#


    ### ❧


    ## Introduction to Threading


    In the realm of modern software development, the ability to execute multiple tasks
    concurrently is not just a luxury—it''s a necessity. As applications grow more
    complex and users demand increasingly responsive interfaces, developers must harness
    the power of parallel processing to deliver optimal performance. This is where
    threading comes into play, offering a powerful tool to leverage the full potential
    of multi-core processors and create efficient, responsive applications.


    Threading in C# allows developers to write programs that can perform multiple
    operations simultaneously, making the most of available system resources. By dividing
    a program into smaller, independent units of execution called threads, we can
    achieve true parallelism, where different parts of our code run concurrently on
    separate CPU cores.'
