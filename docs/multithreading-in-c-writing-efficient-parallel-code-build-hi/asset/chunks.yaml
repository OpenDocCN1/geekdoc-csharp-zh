    \n# 第 7 章：使用 Parallel.For 和 Parallel.ForEach\n\n### ❧\n\n在不断演变的现代软件开发版图中，利用多个处理器核心的能力已变得越来越至关重要。当我们深入研究\
    \ C# 的多线程领域时，我们遇到了两个简化循环并行过程的强大工具：`Parallel.For` 和 `Parallel.ForEach`。这些构造体是任务并行库（TPL）的一部分，提供了一种优雅且高效的方法将工作负载分布到多个线程上，可能会为你的应用程序带来显著的性能提升。\n\
    \n## 理解并行循环\n\n在深入探讨 `Parallel.For` 和 `Parallel.ForEach` 的细节之前，让我们花一点时间理解并行循环的概念。在传统的顺序编程中，循环一个接一个地执行迭代，以线性方式处理元素。虽然这种方法很直观，但它未能充分利用现代多核处理器的潜力。\n\
    \n另一方面，并行循环将循环的工作负载分布到多个线程上，允许多个迭代并发执行。这种并行性可以带来实质性的性能提升，特别是在处理计算密集型任务或大型数据集时。\n\
    \n考虑以下情景：你有一个包含 1,000,000 个整数的集合，你需要对每个整数进行复杂的计算。在顺序循环中，你的处理器将一个接一个地对这些这些计算，可能会花费大量时间。然而，通过并行循环，工作可以分给多个线程，每个线程同时处理某部分数据。\n\
    \n## 引入 Parallel.For\n\n`Parallel.For` 方法是传统 `for` 循环的并行实现。它允许你指定一个值范围以及针对该范围内的每个值要执行的操作。然后\
    \ TPL 会处理工作在多个线程之间的分布，抽象掉线程管理的复杂性。\n\n让我们来看一个基础示例：\n```csharp\nusing System; \n\
    using System.Threading.Tasks; \nclass ParallelForExample \n{ \n    static void\
    \ Main()\n    {\n        Console.WriteLine(\"Starting Parallel.For example...\"\
    );\n        Parallel.For(0, 10, i =>\n        {\n            Console.WriteLine($\"\
    Iteration {i} on thread {Task.CurrentId}\");\n        });\n        Console.WriteLine(\"\
    Parallel.For completed.\");\n    }\n}\n```\n\n在这个示例中，我们正在使用 `Parallel.For` 从 0\
    \ 迭代到 9（第二个参数是不包含的）。对于每次迭代，我们打印迭代次数和执行它的线程的 ID。当你运行这段代码时，你会发现迭代并不一定按顺序执行，并且不同的线程\
    \ ID 参与了循环的处理。\n\n### Parallel.For 参数\n\n`Parallel.For` 方法有多个重载，但最常用的三个参数：\n\n\
    1. `fromInclusive`: 起始索引（包含）\n2. `toExclusive`: 结束索引（不包含）\n3. `body`: 一个 `Action<int>`\
    \ 委托，代表每次迭代要执行的工作\n\n### 在 Parallel.For 中处理异常\n\n在处理并行循环时，正确处理异常至关重要。与顺序循环中异常会立即停止执行不同，在并行循环中，多个异常可能在不同的线程上同时发生。\n\
    \n如何在 `Parallel.For` 循环中处理异常的示例：\n```csharp\ntry \n{\n    Parallel.For(0, 100,\
    \ (int i) =>\n    { \n        if (i == 50)\n        {\n            throw new Exception($\"\
    Error at iteration {i}\");\n        }\n        Console.WriteLine($\"Processing\
    \ item {i}\");\n    });\n} catch (AggregateException ae)\n{ \n    foreach (var\
    \ e in ae.InnerExceptions)\n    {\n        Console.WriteLine($\"Exception: {e.Message}\"\
    );\n    }\n}\n```\n\n在这个示例中，我们当 `i` 等于 50 时故意抛出一个异常。`Parallel.For` 方法会将执行期间抛出的异常封装在\
    \ `AggregateException` 中，我们可以进行捕获。\n\n## 探索 Parallel.ForEach\n\n虽然 `Parallel.For`\
    \ 非常适用于数值范围，但 `Parallel.ForEach` 设计用于集合。它允许你对任何 `IEnumerable<T>` 集合的操作进行并行化。\n\
    \n这是一个基础示例：\n```csharp\nusing System; \nusing System.Collections.Generic; \nusing\
    \ System.Threading.Tasks; \nclass ParallelForEachExample \n{ \n    static void\
    \ Main()\n    {\n        List<string> items = new List<string> { \"Apple\", \"\
    Banana\", \"Cherry\", \"Date\", \"Elderberry\" };\n        Console.WriteLine(\"\
    Starting Parallel.ForEach example...\");\n        Parallel.ForEach(items, item\
    \ =>\n        {\n            Console.WriteLine($\"Processing {item} on thread\
    \ {Task.CurrentId}\");\n        });\n        Console.WriteLine(\"Parallel.ForEach\
    \ completed.\");\n    }\n}\n```\n\n在这个示例中，我们正在并行处理一个字符串列表。列表中的每个项目可能由不同的线程处理，如\
    \ `Task.CurrentId` 所示。\n\n### Parallel.ForEach 参数\n\n基础 `Parallel.ForEach` 方法接受两个参数：\n\
    \n1. `source`: 代表要处理集合的 `IEnumerable<TSource>`\n2. `body`: 代表每个项目要执行工作的 `Action<TSource>`\
    \ 委托\n\n### 在 Parallel.ForEach 中处理状态\n\n有时你需要在并行处理集合期间维护某些状态。`Parallel.ForEach`\
    \ 提供了重载，允许你为每个任务初始化、使用和完成本地状态。\n\n这是一个示例：\n```csharp\nList<int> numbers = Enumerable.Range(1,\
    \ 1000000).ToList(); \nlong total = 0;\n\nParallel.ForEach(numbers,\n    () =>\
    \ 0L, // 初始化本地状态\n    (number, loop, localTotal) =>\n    {\n        localTotal\
    \ += number; // 使用本地状态\n        return localTotal;\n    },\n    (localTotal) =>\
    \ Interlocked.Add(ref total, localTotal) // 结束本地状态\n);\n\nConsole.WriteLine($\"\
    Total: {total}\");\n```\n在这个示例中，我们正在计算一个大型数字列表的和。每个任务都维护自己的本地总和，最后将其添加到全局总和。这种方法避免了频繁锁定的需要并可以带来更好的性能。\n\
    \n## 性能考量\n\n"
- fmt: "\nWhile `Parallel.For` and `Parallel.ForEach` can significantly improve performance\
    \ in many scenarios, it's important to understand that parallelism isn't always\
    \ beneficial. There are several factors to consider:\n\n1. **Workload Size**:\
    \ For small workloads, the overhead of creating and managing multiple threads\
    \ might outweigh the benefits of parallelism. As a rule of thumb, consider using\
    \ parallel loops when you have a large number of independent operations to perform.\n\
    2. **Task Complexity**: If each iteration of your loop performs a very simple\
    \ operation, the overhead of parallelization might not be worth it. Parallel loops\
    \ are most beneficial when each iteration involves a significant amount of work.\n\
    3. **Data Dependencies**: If iterations of your loop depend on results from previous\
    \ iterations, parallelization might not be possible or might require significant\
    \ restructuring of your algorithm.\n4. **Shared Resource Access**: If your loop\
    \ iterations need to access shared resources, you'll need to implement proper\
    \ synchronization, which can reduce the benefits of parallelism.\n\nHere's an\
    \ example that demonstrates how to measure the performance difference between\
    \ sequential and parallel loops:\n\n```csharp\nusing System;\nusing System.Diagnostics;\n\
    using System.Threading.Tasks;\n\nclass PerformanceComparisonExample {\n    static\
    \ void Main() {\n        const int iterations = 100000000;\n\n        Stopwatch\
    \ sw = new Stopwatch(); // Sequential loop\n        sw.Start();\n        double\
    \ sequentialResult = 0;\n        for (int i = 0; i < iterations; i++) {\n    \
    \        sequentialResult += Math.Sqrt(i);\n        }\n        sw.Stop();\n  \
    \      Console.WriteLine($\"Sequential loop time: {sw.ElapsedMilliseconds}ms\"\
    ); // Parallel loop\n        sw.Restart();\n        double parallelResult = 0;\n\
    \        object lockObject = new object();\n\n        Parallel.For(0, iterations,\
    \ i => {\n            double localResult = Math.Sqrt(i);\n            lock (lockObject)\
    \ {\n                parallelResult += localResult;\n            }\n        });\n\
    \        sw.Stop();\n        Console.WriteLine($\"Parallel loop time: {sw.ElapsedMilliseconds}ms\"\
    );\n        Console.WriteLine($\"Sequential result: {sequentialResult}\");\n \
    \       Console.WriteLine($\"Parallel result: {parallelResult}\");\n    }\n}\n\
    ```\n\nThis example calculates the sum of square roots of numbers from 0 to 99,999,999\
    \ using both a sequential loop and a parallel loop. It then compares the execution\
    \ times. Note that in the parallel version, we use a `lock` to ensure thread-safe\
    \ updates to the shared `parallelResult` variable.\n\n## Advanced Features\n\n\
    Both `Parallel.For` and `Parallel.ForEach` offer advanced features for more complex\
    \ scenarios:\n\n### Cancellation\n\nYou can cancel a parallel loop operation using\
    \ a `CancellationToken`:\n\n```csharp\nCancellationTokenSource cts = new CancellationTokenSource();\n\
    try {\n    Parallel.For(0, 1000000, new ParallelOptions { CancellationToken =\
    \ cts.Token }, i => {\n        if (i == 500000) {\n            cts.Cancel();\n\
    \        }\n        // Do some work\n    });\n} catch (OperationCanceledException)\
    \ {\n    Console.WriteLine(\"Operation was canceled\");\n}\n```\n\n### Controlling\
    \ Degree of Parallelism\n\nYou can control the maximum number of concurrent tasks\
    \ using the `MaxDegreeOfParallelism` property:\n\n```csharp\nParallel.ForEach(items,\
    \ new ParallelOptions { MaxDegreeOfParallelism = Environment.ProcessorCount },\
    \ item => {\n    // Process item\n});\n```\n\n### Breaking and Stopping Loops\n\
    \nThe `ParallelLoopState` parameter allows you to break or stop the parallel loop:\n\
    \n```csharp\nParallel.For(0, 1000, (int i, ParallelLoopState state) => {\n   \
    \ if (i == 500) {\n        state.Break(); // This will stop processing any iterations\
    \ beyond 500\n    }\n    // Process i\n});\n```\n\n## Best Practices and Common\
    \ Pitfalls\n\nWhen working with `Parallel.For` and `Parallel.ForEach`, keep these\
    \ best practices in mind:\n\n1. **Measure Performance**: Always measure the performance\
    \ of your parallel code against its sequential counterpart. Parallelism doesn't\
    \ always lead to better performance.\n2. **Avoid Shared State**: Whenever possible,\
    \ design your parallel loops to avoid shared state. If shared state is necessary,\
    \ use appropriate synchronization mechanisms.\n3. **Handle Exceptions**: Remember\
    \ that multiple exceptions can occur simultaneously in different iterations. Use\
    \ proper exception handling techniques.\n4. **Consider Task Granularity**: If\
    \ your loop contains a large number of very small tasks, consider batching them\
    \ to reduce overhead.\n5. **Be Aware of Thread Safety**: Ensure that any methods\
    \ or objects you use within the parallel loop are thread-safe.\n\nCommon pitfalls\
    \ to avoid include:\n\n1. **Overparallelization**: Don't parallelize everything.\
    \ Some tasks are better left sequential.\n2. **Ignoring Data Dependencies**: Ensure\
    \ your parallel iterations are truly independent.\n3. **Neglecting Exception Handling**:\
    \ Proper exception handling is crucial in parallel programming.\n4. **Excessive\
    \ Synchronization**: Over-synchronization can negate the benefits of parallelism.\n\
    \n## Conclusion\n\n`Parallel.For` and `Parallel.ForEach` are powerful tools in\
    \ the C# multithreading arsenal. They provide a high-level abstraction for parallelizing\
    \ loops, allowing developers to easily leverage the power of multi-core processors.\
    \ By distributing workloads across multiple threads, these constructs can significantly\
    \ improve the performance of computationally intensive tasks.\n\nHowever, it's\
    \ important to remember that parallelism is not a magic solution for all performance\
    \ problems. Careful consideration must be given to the nature of the task, the\
    \ size of the workload, and the potential for shared resource conflicts. When\
    \ used appropriately, `Parallel.For` and `Parallel.ForEach` can lead to more efficient,\
    \ scalable code that makes the most of modern hardware capabilities.\n\nAs you\
    \ continue your journey into multithreading in C#, keep exploring and experimenting\
    \ with these parallel loop constructs. They are invaluable tools for any developer\
    \ looking to write high-performance, concurrent code in the .NET ecosystem.\n\n\
    # Chapter 8: PLINQ: Parallel LINQ Queries\n\n### ❧\n\n## Introduction to PLINQ\n\
    \nIn the ever-evolving landscape of modern computing, the demand for efficient\
    \ data processing and analysis continues to grow exponentially. As datasets become\
    \ larger and more complex, developers are constantly seeking ways to optimize\
    \ their code and leverage the full potential of multi-core processors. Enter PLINQ\
    \ (Parallel LINQ), a powerful extension to `LINQ` (Language Integrated Query)\
    \ that brings the benefits of parallel processing to your query operations.\n\n\
    `PLINQ`, introduced as part of the Task Parallel Library (TPL) in .NET Framework\
    \ 4.0, enables developers to harness the power of multiple processors or cores\
    \ to execute `LINQ` queries concurrently. By automatically parallelizing query\
    \ execution, `PLINQ` can significantly improve performance for computationally\
    \ intensive operations on large datasets, without requiring developers to manually\
    \ manage threads or synchronization.\n\nIn this chapter, we'll dive deep into\
    \ the world of `PLINQ`, exploring its features, benefits, and best practices.\
    \ We'll examine how `PLINQ` works under the hood, when to use it, and how to optimize\
    \ your parallel queries for maximum efficiency. Through practical examples and\
    \ real-world scenarios, you'll gain a comprehensive understanding of this powerful\
    \ tool and learn how to integrate it seamlessly into your C# applications.\n\n\
    ## Understanding PLINQ Basics\n\n### What is PLINQ?\n\n`PLINQ`, short for Parallel\
    \ LINQ, is an advanced query execution engine that extends the capabilities of\
    \ `LINQ` by introducing parallel processing. It's designed to automatically parallelize\
    \ and optimize `LINQ` queries, allowing them to take advantage of multi-core processors\
    \ and improve overall performance.\n\nAt its core, `PLINQ` aims to simplify the\
    \ process of writing parallel code. Instead of manually managing threads and synchronization,\
    \ developers can leverage `PLINQ` to automatically distribute query operations\
    \ across multiple threads, potentially achieving significant speedups with minimal\
    \ code changes.\n\n### How PLINQ Works\n\nTo understand how `PLINQ` operates,\
    \ let's break down its workflow:\n\n1. **Query Construction**: You start by writing\
    \ a `LINQ` query as you normally would.\n"
  raw: 'While Parallel.For and Parallel.ForEach can significantly improve performance
    in many scenarios, it''s important to understand that parallelism isn''t always
    beneficial. There are several factors to consider:


    1.  Workload Size: For small workloads, the overhead of creating and managing
    multiple threads might outweigh the benefits of parallelism. As a rule of thumb,
    consider using parallel loops when you have a large number of independent operations
    to perform.


    2.  Task Complexity: If each iteration of your loop performs a very simple operation,
    the overhead of parallelization might not be worth it. Parallel loops are most
    beneficial when each iteration involves a significant amount of work.


    3.  Data Dependencies: If iterations of your loop depend on results from previous
    iterations, parallelization might not be possible or might require significant
    restructuring of your algorithm.


    4.  Shared Resource Access: If your loop iterations need to access shared resources,
    you''ll need to implement proper synchronization, which can reduce the benefits
    of parallelism.


    Here''s an example that demonstrates how to measure the performance difference
    between sequential and parallel loops: using System; using System.Diagnostics;
    using System.Threading.Tasks; class PerformanceComparisonExample { static void
    Main()


    { const int iterations = 100000000;


    Stopwatch sw = new Stopwatch(); // Sequential loop sw.Start(); double sequentialResult
    = 0; for (int i = 0; i < iterations; i++)


    {


    sequentialResult += Math.Sqrt(i);


    }


    sw.Stop();


    Console.WriteLine($"Sequential loop time: {sw.ElapsedMilliseconds}ms"); // Parallel
    loop sw.Restart(); double parallelResult = 0; object lockObject = new object();


    Parallel.For(0, iterations, i =>


    { double localResult = Math.Sqrt(i); lock (lockObject)


    {


    parallelResult += localResult;


    }


    });


    sw.Stop();


    Console.WriteLine($"Parallel loop time: {sw.ElapsedMilliseconds}ms");


    Console.WriteLine($"Sequential result: {sequentialResult}");


    Console.WriteLine($"Parallel result: {parallelResult}");


    }


    }


    This example calculates the sum of square roots of numbers from 0 to 99,999,999
    using both a sequential loop and a parallel loop. It then compares the execution
    times. Note that in the parallel version, we use a lock to ensure thread-safe
    updates to the shared parallelResult variable.


    ## Advanced Features


    Both Parallel.For and Parallel.ForEach offer advanced features for more complex
    scenarios:


    ### Cancellation


    You can cancel a parallel loop operation using a CancellationToken: CancellationTokenSource
    cts = new CancellationTokenSource(); try {


    Parallel.For(0, 1000000, new ParallelOptions { CancellationToken = cts.Token },


    i =>


    { if (i == 500000)


    {


    cts.Cancel();


    } // Do some work });


    } catch (OperationCanceledException)


    {


    Console.WriteLine("Operation was canceled");


    }


    ### Controlling Degree of Parallelism


    You can control the maximum number of concurrent tasks using the MaxDegreeOfParallelism
    property: Parallel.ForEach(items, new ParallelOptions { MaxDegreeOfParallelism
    = Environment.ProcessorCount },


    item =>


    { // Process item });


    ### Breaking and Stopping Loops


    The ParallelLoopState parameter allows you to break or stop the parallel loop:
    Parallel.For(0, 1000, (int i, ParallelLoopState state) =>


    { if (i == 500)


    {


    state.Break(); // This will stop processing any iterations beyond 500 } // Process
    i });


    ## Best Practices and Common Pitfalls


    When working with Parallel.For and Parallel.ForEach, keep these best practices
    in mind:


    1.  Measure Performance: Always measure the performance of your parallel code
    against its sequential counterpart. Parallelism doesn''t always lead to better
    performance.


    2.  Avoid Shared State: Whenever possible, design your parallel loops to avoid
    shared state. If shared state is necessary, use appropriate synchronization mechanisms.


    3.  Handle Exceptions: Remember that multiple exceptions can occur simultaneously
    in different iterations. Use proper exception handling techniques.


    4.  Consider Task Granularity: If your loop contains a large number of very small
    tasks, consider batching them to reduce overhead.


    5.  Be Aware of Thread Safety: Ensure that any methods or objects you use within
    the parallel loop are thread-safe.


    Common pitfalls to avoid include:


    1.  Overparallelization: Don''t parallelize everything. Some tasks are better
    left sequential.


    2.  Ignoring Data Dependencies: Ensure that your parallel iterations are truly
    independent.


    3.  Neglecting Exception Handling: Proper exception handling is crucial in parallel
    programming.


    4.  Excessive Synchronization: Over-synchronization can negate the benefits of
    parallelism.


    ## Conclusion


    Parallel.For and Parallel.ForEach are powerful tools in the C# multithreading
    arsenal. They provide a high-level abstraction for parallelizing loops, allowing
    developers to easily leverage the power of multi-core processors. By distributing
    workloads across multiple threads, these constructs can significantly improve
    the performance of computationally intensive tasks.


    However, it''s important to remember that parallelism is not a magic solution
    for all performance problems. Careful consideration must be given to the nature
    of the task, the size of the workload, and the potential for shared resource conflicts.
    When used appropriately, Parallel.For and Parallel.ForEach can lead to more efficient,
    scalable code that makes the most of modern hardware capabilities.


    As you continue your journey into multithreading in C#, keep exploring and experimenting
    with these parallel loop constructs. They are invaluable tools for any developer
    looking to write high-performance, concurrent code in the .NET ecosystem.


    # Chapter 8: PLINQ: Parallel LINQ Queries


    ### ❧


    ## Introduction to PLINQ


    In the ever-evolving landscape of modern computing, the demand for efficient data
    processing and analysis continues to grow exponentially. As datasets become larger
    and more complex, developers are constantly seeking ways to optimize their code
    and leverage the full potential of multi-core processors. Enter PLINQ (Parallel
    LINQ), a powerful extension to LINQ (Language Integrated Query) that brings the
    benefits of parallel processing to your query operations.


    PLINQ, introduced as part of the Task Parallel Library (TPL) in .NET Framework
    4.0, enables developers to harness the power of multiple processors or cores to
    execute LINQ queries concurrently. By automatically parallelizing query execution,
    PLINQ can significantly improve performance for computationally intensive operations
    on large datasets, without requiring developers to manually manage threads or
    synchronization.


    In this chapter, we''ll dive deep into the world of PLINQ, exploring its features,
    benefits, and best practices. We''ll examine how PLINQ works under the hood, when
    to use it, and how to optimize your parallel queries for maximum efficiency. Through
    practical examples and real-world scenarios, you''ll gain a comprehensive understanding
    of this powerful tool and learn how to integrate it seamlessly into your C# applications.


    ## Understanding PLINQ Basics


    ### What is PLINQ?


    PLINQ, short for Parallel LINQ, is an advanced query execution engine that extends
    the capabilities of LINQ by introducing parallel processing. It''s designed to
    automatically parallelize and optimize LINQ queries, allowing them to take advantage
    of multi-core processors and improve overall performance.


    At its core, PLINQ aims to simplify the process of writing parallel code. Instead
    of manually managing threads and synchronization, developers can leverage PLINQ
    to automatically distribute query operations across multiple threads, potentially
    achieving significant speedups with minimal code changes.


    ### How PLINQ Works


    To understand how PLINQ operates, let''s break down its workflow:


    1.  Query Construction: You start by writing a LINQ query as you normally would.'
