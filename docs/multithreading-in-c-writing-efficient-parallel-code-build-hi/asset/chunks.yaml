    \ where T : IComparable<T>\n    {\n        int n1 = mid - left + 1;\n        int\
    \ n2 = right - mid;\n\n        T[] leftArray = new T[n1];\n        T[] rightArray\
    \ = new T[n2];\n\n        // ... (省略合并实现细节)\n    }\n}\n```\n\n这种并行归并排序使用 `Parallel.Invoke`\
