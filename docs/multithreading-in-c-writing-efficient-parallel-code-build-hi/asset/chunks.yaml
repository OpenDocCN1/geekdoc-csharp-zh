    Async void completed\");\n}\n\n// 使用\nint result = await AsyncMethod();\nawait\
    \ AsyncVoidMethod();\n```\n\n### Async 方法中的异常处理\n\n```csharp\npublic async Task\
    \ ExceptionExample()\n{\n    try {\n        await ThrowExceptionAsync();\n   \
    \ } catch (Exception ex) {\n        Console.WriteLine($\"Caught exception: {ex.Message}\"\
    );\n    }\n}\n\nprivate async Task ThrowExceptionAsync()\n{\n    await Task.Delay(1000);\n\
    \    throw new Exception(\"Async exception\");\n}\n```\n\n### Async Lambda 表达式\n\
    \n```csharp\nFunc<Task> asyncLambda = async () =>\n{\n    await Task.Delay(1000);\n\
    \    Console.WriteLine(\"Async lambda completed\");\n};\n\nawait asyncLambda();\n\
    ```\n\n### 异步流 (C# 8.0+)\n\n```csharp\npublic async IAsyncEnumerable<int> GenerateNumbersAsync()\n\
    { \n    for (int i = 0; i < 10; i++)\n    {\n        await Task.Delay(100);\n\
    \        yield return i;\n    }\n} \n\n// 使用\nawait foreach (var number in GenerateNumbersAsync())\n\
    {\n    Console.WriteLine(number);\n}\n```\n\n## 6. 线程安全集合\n\n### ConcurrentDictionary（并发字典）\n\
    \n```csharp\nConcurrentDictionary<int, string> dict = new ConcurrentDictionary<int,\
    \ string>(); \n\n// 添加或更新\ndict.AddOrUpdate(1, \"One\", (key, oldValue) => \"\
    Updated One\"); \n\n// 获取或添加\nstring value = dict.GetOrAdd(2, \"Two\"); \n\n//\
    \ 尝试移除\nif (dict.TryRemove(1, out string removedValue))\n{\n    Console.WriteLine($\"\
    Removed: {removedValue}\");\n} \n\n// 线程安全的枚举\nforeach (var kvp in dict)\n{\n\
    \    Console.WriteLine($\"{kvp.Key}: {kvp.Value}\");\n}\n```\n\n### ConcurrentQueue（并发队列）\n\
    \n```csharp\nConcurrentQueue<int> queue = new ConcurrentQueue<int>(); \n\n// 入队\n\
    queue.Enqueue(1);\nqueue.Enqueue(2); \n\n// 尝试出队\nif (queue.TryDequeue(out int\
    \ dequeuedItem))\n{\n    Console.WriteLine($\"Dequeued: {dequeuedItem}\");\n}\
    \ \n\n// 尝试取顶\nif (queue.TryPeek(out int peekedItem))\n{\n    Console.WriteLine($\"\
    Peeked: {peekedItem}\");\n}\n```\n\n### ConcurrentBag（并发袋）\n\n```csharp\nConcurrentBag<string>\
    \ bag = new ConcurrentBag<string>(); \n\n// 添加项\nbag.Add(\"Item 1\");\nbag.Add(\"\
    Item 2\"); \n\n// 尝试取出\nif (bag.TryTake(out string takenItem))\n{\n    Console.WriteLine($\"\
    Taken: {takenItem}\");\n} \n\n// 尝试查看元素\nif (bag.TryPeek(out string peekedItem))\n\
    {\n    Console.WriteLine($\"Peeked: {peekedItem}\");\n}\n```\n\n"
