    {\n    Parallel.ForEach(data, item =>\n    {\n        Task.Delay(100).Wait();\
    \ // Simulate some work\n        Console.WriteLine($\"Processed: {item * 2}\"\
    );\n    });\n}\n```\n\n在这个示例中，我们演示了两种并行处理的方法：\n\n1. `ProcessDataParallel`: 使用\
    \ `async/await` 结合 `Task.WhenAll` 来并发且异步处理项目。\n2. `ProcessDataParallelSync`: 使用\
    \ `Parallel.ForEach` 进行同步并行处理。\n\n### 11.5.2 优势与考虑因素\n\n`Task Parallel` 模式提供了许多优势：\n\
    \n1. **简单性**：它为并发编程提供了高层抽象，减少了直接管理线程的复杂性。\n2. **可扩展性**：`TPL` 自动处理线程的创建和管理，根据可用系统资源进行扩展。\n\
