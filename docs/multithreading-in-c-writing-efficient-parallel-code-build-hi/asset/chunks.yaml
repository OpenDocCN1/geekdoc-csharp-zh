    \n`lock` 语句是 C# 中 `Monitor` 类的语法糖。当线程进入 `lock` 块时，它会尝试获取指定对象的排他性锁。如果锁已被另一个线程持有，当前线程将阻塞，直到锁可用为止。\n\
    \n虽然 `lock` 使用起来简单，但意识到其局限性是非常重要的：\n\n1. 如果使用不当，它很容易导致死锁。\n2. 如果被锁区域过大或访问过于频繁，它可能会影响性能。\n\
