    \ 5.0 引入了 `async` 和 `await` 关键字，它们提供了一种编写异步代码的强大方法，这些代码看起来和行为都像同步代码：\n\n```csharp\n\
    using System;\nusing System.Threading.Tasks;\nclass Program {\n    static async\
