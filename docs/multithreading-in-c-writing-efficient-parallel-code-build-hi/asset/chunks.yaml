    \ options = new ParallelOptions\n{\n    MaxDegreeOfParallelism = Environment.ProcessorCount\n\
    };\nParallel.For(0, 10, options, i =>\n{\n    Console.WriteLine(i);\n});\n```\n\
    \n## 5. Async/Await 模式\n\n### Async 方法\n\n```csharp\npublic async Task<int> AsyncMethod()\n\
    {\n    await Task.Delay(1000); // 模拟异步工作\n    return 42;\n}\n\npublicpublic async\
