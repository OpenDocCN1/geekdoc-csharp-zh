    );\n    }\n}\n```\n\n在这个示例中，我们使用 `QueueUserWorkItem` 向 `ThreadPool` 队列了三个任务。每个任务都由池中的线程执行，如果有多个可用线程，可能会并行执行。\n\
    \n### ThreadPool 配置\n\n虽然 `ThreadPool` 设计为自管理，但在某些情况下你可能希望配置它的行为。`ThreadPool`\
