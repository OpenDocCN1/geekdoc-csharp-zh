    Using Python to Build a Website


    Python can be utilized for a vast assortment of things. You can use it for hacking
    and even video game creations. In this chapter, we are going to talk about how
    you can use Python in order to build a website.


    Do not worry if the programming that you write does not come out the way that
    you want it to come out the first time. It is important to remember that you are
    able to use Python in such a way that will allow you to make temporary programs
    that will not affect your finished project.


    When you look at websites such as Google and YouTube, you may not know it, but
    they are built using Python as we have mentioned earlier. However, you will be
    using the Flask framework in order to make your own website from scratch. Flask
    is easy to learn and even simple to get started with.


    First, you are going to need to insert something that looks like the coding below
    into an empty text.


    Note: Make sure that you always save your work with the title and then .py on
    the end of it.


    from flask import Flask


    app = Flask(__name__)


    @app.route(‘/’)


    def home():


    return “Hey there!”


    if __name__ == ‘__main__’:


    app.run(debug=True)


    Please take notice that flask is imported from the library from the very first
    line of coding. In case you do not have a library installed, you will then receive
    an error code that will not allow you to proceed.


    If you need to install flask, just type pip install flask into the command line
    of Python. Once you have made sure that flask is indeed installed properly, run
    your test script.


    As soon as your script is running properly, the website will be running on your
    local machine and will be able to be viewed by typing in localhost:5000 in the
    browser that you use.


    At this point in time, your website is just going to be plain text. It is important
    that you make sure that it does work before you go adding in the different designs
    and such that are going to make it look like a website.


    The first thing that you need to think about is who is going to be using your
    website? This is going to affect what data you put into the coding as well as
    how you design your website’s apperance.


    Being a developer, you are going to need to write the code in Python that is going
    to handle the requests from the users that are going to be visiting your website
    as well as the CGI. This is a standard environment that Python and many other
    web development programming languages use in order for them to create web pages.


    Since this is such a repetitive task, you can put all your code together and create
    a bunch of Python files. These files are known as flask. Flask is the framework
    that will be loaded within Python to execute the routine code automatically. This
    will also enable you to concentrate on specific parts of your website that you
    need to go in and fix at a later date.


    So, if you type pip install flask in your command line, you are installing the
    flask framework from its repositories. However, when you import flask, you are
    making the framework available for your current script.


    So, your coding should look a little something like this:


    1.from flask import Flask


    2.  


    3. app = Flask(__name__)


    4. 


    5. @app.route(‘/’)


    6. def home():


    7. return “Hey there!”


    8. 


    9. if __name__ == ‘__main__’:


    10. app.run(debug=True)


    In Line 1, all codes that is needed in order to build a web app using flask is
    located here. Simply put flask if it is the prototype that will be used to create
    instances of web application.


    Once flask is imported, you can now create a flask class that will be able to
    help you with your web app. Line 3 does the same with the name (_name_). This
    is a special variable that gets valued as the string “_main_” when you are actually
    executing the script.


    Lines 5–7 are going to be your defining functions that return the string. These
    functions are mapped to the home ‘/’ URL. Therefore, the user will be able to
    navigate to localhost:5000, and then, the home function will be returned to its
    original output on the webpage. If the input route method was something different,
    for example, ‘/about/’, then the user would be directed to localhost: 5000/about/.


    Lines 9 and 10 have the “_main_” script. If the script is imported into a different
    script, then the script will keep its original name, but in our case, we are using
    _name_, which will be equal to “_main_”. Should the conditional statement be satisfied,
    then the app.run() will be executed. This allows the programmer to have control
    over how the script behaves.


    You will also notice that the debug parameter is set to true. This will put the
    possible Python errors on the web page, therefore helping to trace any mistakes
    in the script. While you are in the production environment, you will want to set
    it to false.'
