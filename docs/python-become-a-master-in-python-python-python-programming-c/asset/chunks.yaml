    \ `try` 语句来处理。\n\n查看以下用于显示网站 HTML 代码。当你执行程序时，它将到达 `try` 语句，因此，它将尝试执行编写的代码。但是，如果由于某种原因设备未连接到网络、互联网或类似设备而遇到错误，那么解释器将跳过最后行的缩进代码。\n\
    \n```python\nImport urllib2\n\nURL = ‘HTTP://www.hello.com‘\n\nTry:\n\nreq = urllib2\
