    \n# 第 7 章\n\n![logo](img/00003.jpeg)\n\n## 如何在 Python 中处理错误和异常\n\n由于某些内容没有正确输入，会出现一些错误代码出现在在你面前。也有可能发生了其他事情，导致向你抛出该错误代码。\n\
