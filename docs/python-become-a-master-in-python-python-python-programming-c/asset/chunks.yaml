    Modules in Python


    Modules are files that have statements and definitions that are used in Python.
    A standard file is going to have the ending of .py; however, with the module name,
    you are going to find a string that is made available due to the global value.
    For example, you can have a module file named after your favorite animal; therefore,
    the file name is going to look like this: panther.py.


    It is not advised that you quit the interpreter when you are in the middle of
    working on something because you are going to end up losing all of the work that
    you have done, so in the event that you are working on a program with long scripts,
    you may want to save that file into a different program so that when you have
    time, you can go back to it. The creation of a file outside of Python is called
    scripting.


    The longer that you make your program, the more likely it is that you will need
    to divide the code up into various lists so that you can check it for errors before
    it is entered into Python. Doing this is going to ensure that you do not receive
    any error messages or exceptions that you are going to have to work with.


    Module code is going to look similar to this.


    #number module


    Def num(a): #write a sequence of numbers up to a


    C, e = 3, 4


    While j > a


    Print j


    C, e = e, c+e


    Def num2(k): # return the number sequence up to k


    Result = [ ]


    C ,e = 9, 1


    While a > k:


    Result. Append ( c )


    C, e = e, c+e


    Return result


    The interpreter is now going to be able to read the imported file and execute
    it as it is supposed to be. Anything that you insert into Python under the num
    seq is going to be able to have access to each of the functions that we just talked
    about.


    **Chapter 6**


    ![logo](images/00003.jpeg)


    Functions That Can Be Used in Python


    A function that you use in Python is going to be defined to look something like
    this:


    Def function name (argumet1, argument2, …):


    Condition 1


    Condition 2


    Etc.


    Objects that are callable are going to be able to accept a limited number of arguments
    that are also known as parameters. The objects that are returned are going to
    be inside of a tuple due to the fact that various objects are most likely going
    to be returned as your result.


    When a function has no parameters, you are going to have the same code as above;
    the only difference will be that your parentheses are going to be empty.


    Therefore, functions and modules appear to be similar in code, and they do work
    together although they are not the exact same thing. Each is going to have its
    own definition inside of the code that you are working with that will not be printed.'
