    ![logo](img/00003.jpeg)


    ## Python 运算符


    Python 的另一个有用之处是，你可以用它进行数学运算！没有人喜欢做数学——好吧，这是一个谎言，有些人是喜欢的。但是，当数学变得复杂时，得到一些帮助是很好的。Python
    会在这方面为你提供帮助！你可以将方程输入 Python 并每次都得到正确的答案。只要你正确地输入了操作符即可。你可以从简单的方程一直到复杂的、需要各种步骤的方程。


    在 Python 中你会发现的一些较常见的数学运算符如下：


    - `A+b` 用于加法。

    - `a−b` 用于减法。

    - `a*b` 用于乘法。

    - `a/b` 用于除法。

    - `a//b` 用于 Python 2.2 及后续版本的取除（floor division）。

    - `a%b` 是模 b，将为你提供模。

    - `−a` 用于取反。

    - `Abs(a)` 或 `|a|` 用于绝对值。

    - `A**b` 或 `a^b` 用于幂。

    - `Math.sqrt(a)` 是你在 Python 中输入平方根的方法。


    请尽量记住，如果你需要使用函数 `math.sqrt()`，那么你需要让 Python 知道你需要加载那个 `math` 模块。为了做到这一点，你应该准备好输入代码，以便它可以被打开。


    在 Python 中进行数学运算的缺点是，它在浮点运算的舍入误差方面存在局限性，这最终会给你意想不到的结果。


    例如，如果你选择通过放置 `print(0.8/0.2)` 来普通除法，如果操作正确，你应该应该得到 `4.0` 的正确结果。然而，当你对相同的数字进行取除时，你最终得到的返回值为
    `4.0`。


    Python 2.x 系列中的取除只对长整数和整数有效。但“真除”是在复数和浮点数上进行的。当使用 Python 3.x 时，真除方法适用于所有类型的数字。你可以通过在普通除法符号周围加上
    `[math]=0.5` 来解决这个问题。此答案将导致它被向下舍入 0.5，因为你在函数中是这样告诉它的。


    在小学期间，我们学习了运算顺序，Python 这一规则也不例外。在数学中，你将通过 PEMDAS 来评估所有的表达式。你将在边读边进行计算；你会从左到右操作，并执行表达式中的每种运算顺序。


    - **P** 代表括号。括号内的所有内容将首先执行。

    - **E** 代表指数。指数无非短的乘法或除法。

    - **M and D** 代表乘法和除法。如果你在同一个方程中同时两者，你将在执行除法之前执行乘法。

    - **A and S** 是你的加法和减法。就像乘法和除法一样，你将在执行减法之前执行加法。


    如果你正确地完成了数学，那么你的答案将是正确的。


    例如 `8 + (25 − 10) * 6/5 = 26`


    1. 第一步是执行 `25 − 10`，你将得到答案 `15`。

    2. 因为没有指数，我们跳过那一步，进入乘法和除法。

    3. 你的数学方程现在看起来像这样 `8 + (15) * 6/5 = 26`。

    4. `15 * 6` 等于 `90`，留下 `8 + 90/5 = 26`。

    5. `90/5` 将给你 `18`。

    6. `8 + 18 = 26`。


    你的答案是 `26`。


    为了得到这样一个简单的答案，这似乎有很多操作，但这就是创造我们计算数学方式的人所决定的方法。


    正如我们所知，数学并不总是以整数形式整洁呈现。有时你会收到小数点甚至是分数，我们并不总是能够对它们向上舍入或向下舍入。有时我们会得到这样的数字：如果你重 75
    磅，那么你重 34.019427 公斤。


    Python 会自动在任何数字中打印 10 位小数。但是，如果你只想获得一或两位，你将使用 `round()` 函数，这样你可以将数字舍入到你寻找的小数位数。在使用这一功能时，你不仅输入了想要舍入的数字，还输入了你想要舍入的位数。


    例如，如果你想舍入我们刚刚将磅转换为公斤时得到的数字，你将输入 `round(34.019427)`。


    在我们熟悉的数学舍入规则中，你将把一个函数放在另一个函数内部。当你把函数放在一起时，这被称为嵌套函数，效果就像你这样做一样：


    ```

    twoSigFigs = round(34.019427, 2)

    numToString = str(twoSigFigs)

    print("you weigh " + numToString + "kilograms")

    ```


    Python 将执行此函数并给你当你转换时得到相同的结果。

