    Lists are going to be like tuples except that they use square brackets instead
    of parentheses. The items that you place on a list does not have to be the same
    type. As you create a list, you are going to use the same function that is used
    when you are putting a value into Python; however, the difference is going to
    be that the element has to be a set of parentheses. The function `print(my_list)`
    is going to create new lists from scratch.


    Much like the other data types we have talked about, the index for a list is going
    to start at zero and has the ability to be sliced. The biggest difference for
    the index on a list is that they are given names that are related to colors such
    as black, green, red, and blue. If you place a value in the index that is not
    in the range that the index is working with, then you are going to receive an
    error message.


    As mentioned, list indexes can be sliced and the syntax is going to be as follows:


    ```

    sliced_list = List_Name[startIndex:endIndex]

    ```


    The great thing about a list is that it is mutable, so if you want to change values
    in it, you have the option to do this. Plus signs will create new lists, but that
    list is going to be connected to at least two other lists. The asterisk will once
    again repeat your list so that you do not have to copy and paste it.


    ### Sets


    When creating a set, you are going to be creating an unordered but unique collection
    of elements. You will mainly be using sets for when you use set theory. Set theory
    is a supported mathematical operation like a difference, union, symmetric difference,
    or even an intersection. You will also use a set when eliminating any duplicate
    entries that have occurred in your coding.


    ### Dictionaries


    A dictionary in Python is a container that holds an unordered set of items much
    like a list. However, the objects in a dictionary are surrounded by the curly
    braces (`{}`). A dictionary separates the different essential items and valued
    pairs with commas. The values and keys are going to be the Python data type.


    Every value or object that you access with a key is going to be unique in your
    dictionary. The keys that are used for indexing will be immutable. You can, however,
    create an empty dictionary through the use of empty curly braces.


    ### None


    The last data value that you need to know when using Python is the data value
    of none. This value is a single value type because there is a single object within
    this value. Objects will be accessed with a built-in name on Python. The name
    is quite obviously, `None`.


    The absence of any value in certain situations is going to return it from the
    functions that you use so that you explicitly get a return of anything. The truth
    for this value will always be false.


    ### Chapter 4


    ![logo](images/00003.jpeg)


    #### Python Lists


    A list is an array that can be found in Perl on the off chance that you have used
    Perl before. In using Perl, variables are going to always start with some kind
    of symbol. However, with Python, your variables are going to be named by you so
    that you have the ability to identify them if you need to find them for later
    use. Python tracks any data types that are used internally by their users.


    Lists will have plenty of uses; it is going to depend on what code has been placed
    in Python mainly. Here are just a few of the distinct list functions that you
    can use with Python.


    - `List.append(x)`: This is used when adding an item to the end of your list.
    You can also use the function `len(a)[:]=[x]`.

    - `List.extend(L)`: This is used when you are trying to extend your list by appending
    all of your objects in your list. It’s equivalent is `a[len(a) :] = L`.

    - `List.instert(I, x)`: This is used to insert an item into a particular position
    on the list. The first argument will be within the index of your list before you
    are able to insert it. You are going to be required to use `a.insert(0,x)` to
    place it at the front of your list. You can also use `a.inster(len(a), x)` which
    is the same as using `a.append(x)`.

    - `List.remove(x)`: This is used to remove any item from the list that has a value
    of `x`. If you run into an error message, then that item is not on the list.

    - `List.pop([i])`: This is used to remove an item from its given position on the
    list before returning it. If you do not choose a particular index using `a.pop()`,
    then the item is going to be returned to the last place on the list. The square
    brackets state that the parameter is optional for you to enter or not.

    - `List.index(x)`: This is used to return your index to the first item, which
    has a value of `x`. If you see an error code, that thing does not exist.

    - `List.count(x)`: This gives you how many times `x` appears in your list.

    - `List.sort(cmp= None, key= None, reverse= False)`: You will be able to sort
    the arguments on your list to be customized.

    - `List.reverse()`: This reverses the way items are listed.


    An example of several of these methods being used is as follows:


    ```

    A – [66.85, 300, 300, 9, 1764.5]

    Print a.count(300), a.count(66.85), a.count(''x’)

    896

    A.insert(8, 9)

    a.append(300)

    a

    [66.85, 300, 5, 300, 5, 1764.5]

    ```

