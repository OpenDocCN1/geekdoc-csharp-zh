    ## Chapter 1


    ![logo](images/00003.jpeg)


    ### Python – What It Is and Why You Should Use it


    `Python` is a computer programming code that can be used across all platforms
    as well as machines that a code writer will use. `Python` has different functions
    that actually help to make coding easier while making the coding look better as
    well as easy to read. This is useful should someone else need to come back along
    and rewrite the code at a later time.


    While we think of a rather large, heavy bodied constrictor snake when we reflect
    on what a `Python` is, this is not what we are talking about in this book. However,
    `Python`, the computer programming language, was not named after this snake that
    we always think about. Instead, back in 1990, when the program was created by
    Guido von Rossum, it was named after `Monty Python’s Flying Circus`, a British
    Comedy.


    This is a coding program that is easily available and helps to simplify the process
    of finding a solution when it comes to a computer problem. This program runs much
    like if you had taken the time to sit and write out your solution to the problem
    on paper, except that it is done with a computer.


    The greatest advantage to `Python` is that it can be run on any computer and you
    will not need to change the program once it has been written.


    When the program was first developed in the nineties, a team of volunteers has
    been running the program. This program and even support can be reached by going
    to the website for Python Software Foundation. During September of 2006, `2.5`
    was released. This is the most recent version available.


    When you look at the different versions of `Python`, you will see that there was
    a Java version of Python that was called `Jython`. Iron Python uses the C# version
    that works with .Net platforms. Anyone who uses C# has the same flexibility and
    power of Python. It is much like they are using Python, without using it.


    But, as any programmer knows, each program is going to behave differently. While
    `Python` is written in one language, it will work off that language as its primary
    while working with other languages. This is just a fraction of the many modules
    that was built into `Python` while it was developed.


    The `PyPy` project was founded in 2003 in order to help `Python` programmers be
    able to change how `Python` worked with the interpreter that helps it to communicate
    with a variety of programming languages. The project happened to be an open-sourced
    project, therefore allowing it to be developed by a community of program developers
    for free distribution and modification should the need for adjustment arise. This
    project was also funded by the Python Foundation along with the European Union.
    This was funded as part of the `FP6` program under `STReP` (Specified Targeted
    Research Program).


    `Python` can be accessed across any modern operating system and can be used to
    process things such as the following:


    * Scientific data

    * Images

    * Text

    * Numbers

    * Or anything else that you have the choice of saving on your computer.


    Many people do not realize that websites that we use every day were actually coded
    using `Python`. Sites like `YouTube` and even `Google` were created with code
    done inside `Python`. `NASA` and the New York Stock Exchange were also encrypted
    using `Python` as well. However, those are just a few ideas of the multitude of
    websites that `Python` has made possible for us to access. There are businesses,
    government, and nonprofit organization websites that run off of `Python` coding
    as well.


    Being that `Python` is a translated record, it does not need to be converted for
    a program to run off of it. This is different than the languages of the past that
    had to be converted due to them being a scripting language. The scripting languages
    were made to imitate the way that it operated for the banal and trivial tasks
    that needed to be done. However, `Python` and several other programs like it were
    made so that they were different.

