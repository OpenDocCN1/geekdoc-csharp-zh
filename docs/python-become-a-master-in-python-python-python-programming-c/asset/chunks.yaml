    \n# Chapter 7\n\n![logo](images/00003.jpeg)\n\n## How to Handle Errors and Exceptions\
    \ in Python\n\nThere are going to be error codes that pop up on you for the simple\
    \ reason that something was not entered correctly. There is also the probability\
    \ that there is something else going on to throw that error code out at you.\n\
    \nIn addition to that, there will always be exceptions to the rules of Python\
