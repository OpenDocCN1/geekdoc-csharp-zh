    ## 第 1 章


    ![logo](img/00003.jpeg)


    ### Python 是什么以及为什么你应该使用它


    `Python` 是一种计算机编程代码，可以用于所有平台以及代码编写者将使用的机器。`Python` 具有不同的功能，实际上实际上有助于让编码变得更容易，同时让代码看起来更漂亮且易于阅读。如果以后某其他人需要回来重写这些代码，这将非常有用。


    当我们思考什么是 `Python` 时，通常想的是一种体型巨大、身体沉重的蟒蛇，但这并不是我们在书中所讨论的内容。然而，计算机编程语言 `Python` 并不是以我们经常想到的那种蛇命名的。相反，在
    1990 年，当 Guido von Rossum 创建该程序时，它是以英国喜剧《蒙提派的飞行戏团》（Monty Python’s Flying Circus）命名的。


    这是一种易于获取的程序，有助于简化遇到计算机问题时寻找解决方案的过程。这个程序的运行方式就像你花时间坐在纸上写下对问题的解决方案一样，只不过是在计算机上完成的。


    `Python` 最大的优势是它可以在任何计算机上运行，一旦编写完成，你就不需要更改程序。


    在 90 年代程序被首次开发时，有一群志愿者一直在运行该程序。在 2006 年 9 月，发布了 `2.5`。这是最新的可用版本。当你查看 `Python`
    的不同版本时会发现有一个 Java 版本的 Python 叫做 `Jython`。Iron Python 使用与 .Net 平台的 C# 版本。使用 C#
    的人拥有 Python 相同的灵活性和力量。这就像他们在使用 Python，而不在使用它。


    但是，正如任何程序员所知，每个程序的行为都不同。虽然 `Python` 是用一种语言编写的，但它以该语言为主要与其他语言协作。这只是 `Python` 开发期间内置的许多模块中的一小部分。


    `PyPy` 项目成立于 2003 年，旨在帮助 Python 程序员改变 Python 与与其多种编程语言通信的解释器工作方式。该项目由于是一个开源项目，因此允许开发者社区对其进行免费分发和修改，以满足调整需求。该项目还得到了
    Python 基金会以及欧盟的资助。这是 `FP6` 项目 `STReP`（特定目标研究计划）的一部分。


    `Python` 可以在任何现代操作系统上访问，并可处理如下信息：


    * 科学数据

    * 图像

    * 文本

    * 数字

    * 或你选择保存在计算机上的任何其他


    许多人并没有意识到我们每天使用的网站实际上是用 `Python` 编写的。像 `YouTube` 甚至 `Google` 这样的网站都是使用 `Python`
    代码创建的。`NASA` 和纽约证券交易所也使用了 `Python` 进行加密。然而，这些只是 `Python` 为我们提供的可以访问的大量网站的例子。企业、政府和非营利组织网站也运行在
    `Python` 代码。


