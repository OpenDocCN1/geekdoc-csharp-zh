    \ `(obj, used_key)`。你的默认版本将采用由 `PEP3101` 定义的字符串，你可以在 [`www.Python.org/dev/peps/pep=3101`](https://www.Python.org/dev/peps/pep=3101)\
    \ 找到它。\n\n这些形式为 `label.title` 或“0[name]”。`Args` 和 `Kwargs` 将通过 `vformat()` 传递，以便返回的值与你的关键参数具有相同的含义。\n\
    \n`Get_value(key, args, kwargs)`：你能够检索列表中提供的任何字段值。`key` 参数将为你提供字符串或整数。在得到整数的情况下，你将看到\
    \ `args` 中位置参数的索引；但如果你得到字符串，它将代表 `kwargs` 中的命名参数。\n\n如果列表中的任何用于 `vformat()` 的位置参数在你的列表中设置了\
    \ `args` 参数，那么 `kwargs` 参数将被设置为字典中列出的关键字参数。\n\n但是，对于任何复合字段名，函数将只调用字段名中的第一个项。后续元素将处理用于索引的标准方法和操作。\n\
    \n如果你的字段表达式是“0.name”，那么你的 `get_value()` 需要一个等于 `0` 的键参数。在 Python 内置的 `getter()`\
    \ 函数返回 `get_value()` 之后，将找到该名称。\n\n当关键字和索引指向不存在的对象时，将抛出 `key error` 或 `index error`\
    \ 以提醒你这些项不存在。\n\n`Check_unsued_args(used_args, args, kwargs)`：使用此方法可以检查任何未使用的参数。你通过所有参数键设置的参数将引用格式化后的字符串。这包括用于任何命名参数的位置参数、整数和字符串。\n\
    \n它们还将引用通过 `vformat` 的任何 `kwargs` 或 `args`。任何未使用的 `args` 将使用参数进行计算。如果检查失败，`Check_unused_args()`\
    \ 将抛出异常。\n\n`Format_field(value, format_spec)`：全局的 `format()` 与 `format_field()`\
    \ 相关。创建此方法是为了让子类能够重写它。\n\n`Convert_field(value, conversion)`：从 `get_field()` 返回的值将进行转换。任何默认版本都会理解\
    \ `str(s)`、`repr(r)` 和 `ascii(a)` 是 Python 使用的转换类型。\n\n# 第 10 章\n\n![logo](img/00003.jpeg)\n\
    \n## 使用 Python 构建网站\n\nPython 可用于许多领域。你可以用它进行黑客攻击，甚至是视频游戏创作。在本章中，我们将讨论如何使用 Python\
    \ 来构建网站。\n\n如果你编写的程序第一次运行没有按照你预期的结果出现，不要担心。记住，你可以使用 Python 编写临时程序，这些程序不会影响你最终完成的项目。\n\
    \n当你查看 Google 和 YouTube 等网站时，你可能不知道，但正如我们之前提到的，它们是使用 Python 构建的。然而，你将使用 `Flask`\
    \ 框架来从零开始构建自己的网站。`Flask` 易于学习，入门也非常简单。\n\n首先，你需要在空白文本中插入类似于下面代码的内容。\n\n注意：确保你始终以标题命名并以\
    \ `.py` 结尾来保存你的工作。\n\n```python\nfrom flask import Flask\n\napp = Flask(__name__)\n\
    \n@app.route(‘’)\n\ndef home():\n    return “Hey there!”\n\nif __name__ == ‘__main__':\n\
    \    app.run(debug=True)\n```\n\n请注意，从代码的第一行开始从库中导入 `flask`。如果你没有安装该库，将收到一个不允许你继续操作的错误代码。\n\
    \n如果你需要安装 flask，只需在 Python 命令行中输入 `pip install flask`。一旦你确保 `flask` 已正确安装，请运行你的测试脚本。\n\
    \n只要你的脚本运行正常，网站就会在你的本地机器上运行，并且你可以通过在所使用的浏览器中输入 `localhost:5000` 来查看。\n\n此时，你的网站将只是纯文本。在添加各种让它看起来像网站的不同设计等内容之前，确保它能够正常工作是非常重要的。\n\
    \n你需要考虑的第一件事是，谁将使用你的网站？这将影响你放入代码中的数据以及你设计网站外观的方式。\n\n作为开发者，你将需要编写 Python 代码来处理请求。\n\
    \n"
- fmt: "\nIf you want to make something more visually appealing, you will want to\
    \ incorporate some HTML files. This will return the HTML pages instead of just\
    \ plain strings of text.\n\nThis is where you will learn how to return HTML pages\
    \ with the `render_template` method.\n\nYou should see that there is not any plain\
    \ text and that the text you have can have various formats. This is made by returning\
    \ the HTML template rather than the plain text from Python.\n\nTo do this, you\
    \ will want to create an empty file with the name of something similar to `home.html`\
    \ and put the following code into it.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <h1>My Personal Website</h1>\n<p>Hi, this is my personal website.</p>\n</body>\n\
    </html>\n```\n\nHTML is the language that web pages use. You will need to make\
    \ sure that you remember these three important things when it comes to creating\
    \ HTML pages:\n\n- Any visible part of the HTML will be between `<body>` and `</body>`.\
    \ The areas outside of this are used in reference to Javascript files, CSS, or\
    \ any similar features.\n- The HTML document needs to start with a declaration\
    \ that will specify the document type: `<!DOCTYPE html>`\n- HTML documents will\
    \ always begin with `<html>` and end with `</html>`\n\nIn the flask framework,\
    \ it should be written in a folder where it can specifically look for the HTML\
    \ template files. This folder should be called `templates`.\n\nAny Python scripting\
    \ will stay outside of the `templates` folder as it is not HTML.\n\nThe code to\
    \ be able to read the HTML templates will look similar to this. Note: this is\
    \ the updated code from our flask code earlier.\n\n```python\nfrom flask import\
    \ Flask, render_template\n\napp = Flask(__name__)\n\n@app.route('/')\ndef home():\n\
    \    return render_template('home.html')\n\nif __name__ == '__main__':\n    app.run(debug=True)\n\
    ```\n\nYou will notice that the code was maintained by using the imported `render_template`\
    \ method within the flask framework. It is from here that the HTML files are on\
    \ the flask framework. This will generate a jinja 2 template then return the model\
    \ to the browser whenever the users visit your URL.\n\nIf you want to create an\
    \ “about” page, you will need to create another HTML file in the template folder.\
    \ The coding for this is going to look a little something like this:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<h1>About me</h1>\n<p>This is a portfolio site\
    \ about anything that can be put in a portfolio.</p>\n</body>\n</html>\n```\n\n\
    It is from here that you will be able to render the HTML you created with Python\
    \ by joining a secondary function to the template. The new code for this looks\
    \ like this:\n\n```python\nfrom flask import Flask, render_template\n\napp = Flask(__name__)\n\
    \n@app.route('/')\ndef home():\n    return render_template('home.html')\n\n@app.route('/about/')\n\
    def about():\n    return render_template('about.html')\n\nif __name__ == '__main__':\n\
    \    app.run(debug=True)\n```\n\nOnce you have put the last string of codes in,\
    \ you will then need to run the script `localhost:5000/about`, and this will open\
    \ a new page. At a later date, this template can have CSS styling applied to it\
    \ in order to make it resemble what you want it to look.\n\nThe updated coding\
    \ for `about.html` is going to look something similar to this:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<div class=\"about\">\n<h1>About me</h1>\n<p>This is\
    \ a portfolio site about anything that can be put in a collection.</p>\n</div>\n\
    </body>\n</html>\n```\n\nYou’ll have to do this for your `home.html` as well.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div class=\"home\">\n<h1>About me</h1>\n\
    <p>This website was built with Python via the Flask framework.</p>\n</div>\n</body>\n\
    </html>\n```\n\nWhen you run your Python script now, you will have two URLs open.\
    \ Now, you should have two HTML pages as well as the Python script that has resulted\
    \ in your HTML pages being two different URLs. These two URLs are your home page\
    \ as well as your about page.\n\nIf you need to design an area in each page, you\
    \ will then need to add in the HTML code that will cause a header to generate\
    \ for each file. However, before you do this, the smart thing would be to create\
    \ a parent HTML template that your following templates will then inherit the code\
    \ from. This is done by simply linking the parent model to each HTML page so that\
    \ they can inherit the code.\n\nThe first action is to create a new page that\
    \ you will call `layout.html`, and the coding will look like this:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<header>\n<div class=\"container\">\n<h1 class=\"\
    logo\">Ardit’s web app</h1>\n<strong><nav>\n<ul class=\"menu\">\n<li><a href=\"\
    {{ url_for('home') }}\">Home</a></li>\n<li><a href=\"{{ url_for('about') }}\"\
    >About</a></li>\n</ul>\n</nav></strong>\n</div>\n</header>\n</body>\n</html>\n\
    ```\n\nPython will then modify the `home.html` and `about.html` pages as well\
    \ as your `layout.html` files. At this point, you will then need to link both\
    \ `about.html` and `layout.html`.\n"
  raw: 'If you want to make something more visually appealing, you will want to incorporate
    some HTML files. This will return the HTML pages instead of just plain strings
    of text.


    This is where you will learn how to return HTML pages with the render_template
    method.


    You should see that there is not any plain text and that the text you have can
    have various formats. This is made by returning the HTML template rather than
    the plain text from Python.


    To do this, you will want to create an empty file with the name of something similar
    to home.html and put the following code into it.


    <!DOCTYPE html>


    <html>


    <body>


    <h1>My Personal Website</h1>


    <p>Hi, this is my personal website.</p>


    </body>


    </html>


    HTML is the language that web pages use. You will need to make sure that you remember
    these three important things when it comes to creating HTML pages.


    -Any visible part of the HTML will be between <body> and </body>. The areas outside
    of this are used in reference to Javascript files, CSS, or any similar features.


    -The HTML document needs to start with a declaration that will specify the document
    type: <!DOCTYPEhtml>


    -HTML documents will always begin with <html> and end with </html/>


    In the flask framework, it should be written in a folder where it can specifically
    look for the HTML template files. This folder should be called templates.


    Any Python scripting will stay outside of the templates folder as it is not HTML.


    The code to be able to read the HTML templates will look similar to this. Note:
    this is the updated code from our flask code earlier.


    from flask import Flask, render_template


    app = Flask(__name__)


    @app.route(‘/’)


    def home():


    return render_template(‘home.html’)


    if __name__ == ‘__main__’:


    app.run(debug=True)


    You will notice that the code was maintained by using the imported render_template
    method within the flak framework. It is from here that the HTML files are on the
    flask framework. This will generate a jinja 2 template then return the model to
    the browser whenever the users visit your URL.


    If you want to create an “about” page, you will need to create another HTML file
    in the template folder. The coding for this is going to look a little something
    like this:


    <!DOCTYPE html>


    <html>


    <body>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a portfolio.</p>


    </body>


    </html>


    It is from here that you will be able to render the HTML you created with Python
    by joining a secondary function to the template. The new code for this looks like
    this:


    from flask import Flask, render_template


    app = Flask(__name__)


    @app.route(‘/’)


    def home():


    return render_template(‘home.html’)


    @app.route(‘/about/’)


    def about():


    return render_template(‘about.html’)


    if __name__ == ‘__main__’:


    app.run(debug=True)


    Once you have put the last string of codes in, you will then need to run the script
    localhost:5000/about, and this will open a new page. At a later date, this template
    can have CSS styling applied to it in order to make it resemble what you want
    it to look.


    The updated coding for about.html is going to look something similar to this:


    <!DOCTYPE html>


    <html>


    <body>


    <div class=“about”>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a collection.</p>


    </div>


    </body>


    </html>


    You’ll have to do this for your home.html as well.


    <!DOCTYPE html>


    <html>


    <body>


    <div class=“home”>


    <h1>About me</h1>


    <p>This website was built with Python via the Flask framework.</p>


    </div>


    </body>


    </html>


    When you run your Python script now, you will have two URLs open. Now, you should
    have two HTML pages as well as the Python script that has resulted in your HTML
    pages being two different URLs. These two URLs are your home page as well as your
    about page.


    If you need to design an area in each page, you will then need to add in the HTML
    code that will cause a header to generate for each file. However, before you do
    this, the smart thing would be to create a parent HTML template that your following
    templates will then inherit the code from. This is done by simply linking the
    parent model to each HTML page so that they can inherit the code.


    The first action is to create a new page that you will call layout.html, and the
    coding will look like this:


    <!DOCTYPE html>


    <html>


    <body>


    <header>


    <div class=“container”>


    <h1 class=“logo”>Ardit’s web app</h1>


    <strong><nav>


    <ul class=“menu”>


    <li><a href=“{{ url_for(‘home’) }}”>Home</a></li>


    <li><a href=“{{ url_for(‘about’) }}”>About</a></li>


    </ul>


    </nav></strong>


    </div>


    </header>


    </body>


    </html>


    Python will then modify the home.html and about.html pages as well as your layout.html
    files. At this point, you will then need to link both about.html and home.html
    to layout.html. This is going to take a few lines of coding, and you are going
    to start with the layout.html.


    <!DOCTYPE html>


    <html>


    <body>


    <header>


    <div class=“container”>


    <h1 class=“logo”>Ardit’s web app</h1>


    <strong><nav>


    <ul class=“menu”>


    <li><a href=“{{ url_for(‘home’) }}”>Home</a></li>


    <li><a href=“{{ url_for(‘about’) }}”>About</a></li>


    </ul>


    </nav></strong>


    </div>


    </header>


    <div class=“container”>


    {% block content %}


    {% end block %}


    </div>


    </body>


    </html>


    You will notice that a new div section was added to your layout.html. The two
    lines within the curly brackets will then be replaced on demand in either the
    home.html or the about.html code, depending on which URL the user is using at
    the time. But, in order for these to work, you will then need to edit both your
    about and home pages so that they will connect to your layout page.


    Your home.html code will look like this:


    {% extends “layout.html” %}


    {% block content %}


    <div class=“home”>


    <h1>A Python product</h1>


    <p>This website was built with Python via the Flask framework.</p>


    </div>


    {% end block %}


    And this is what your about.html will look like:


    {% extends “layout.html” %}


    {% block content %}


    <div class=“about”>


    <h1>About me</h1>


    <p>This is a portfolio site about anything that can be put in a portfolio.</p>


    </div>


    {% end block %}


    Congratulations!


    You now have a functional website! However, you are still missing some of your
    website. These were just the basics of how to make a website by using Python coding.
    You can still add more to your site like CSS styling and, finally, the steps that
    you will need to make your site public in the lessons that can be found on [www.Pythonhow.com](http://www.Pythonhow.com)


    **Chapter 11**


    ![logo](images/00003.jpeg)


    Additional Uses for Python


    When you look at all the different things that you can do with Python, you will
    learn that you can actually create video games with the Python source coding as
    well as use Python for hacking into computer systems.


    Note: It is important to not hack into any system without the expressed written
    permission from the system administrator.


    **Game Creation**


    When you are creating a game using Python, you are going to use PyGame. This software
    adds the functionality on top of the SDL library. It permits you to design fully
    featured games and multimedia applications by using the Python language.


    Pygame allows the game to be highly portable and run off of nearly every platform
    and operating system.


    There are numerous examples and documentation of games that were created by using
    PyGame that have been successful. You will also notice that it is easy to write
    games as well as graphic-intensive programs by using PyGame.


    If you want to make a high-level game that is in 3D, you will use PySoy. This
    works with the engine that is used in Python 3\. Python 3 tightly binds the rendering
    physics, networking, and even the animation.


    Python-Ogre is the complete Python wrapper for the OGRE 3D engine that includes
    15 other graphics as well as gaming-related libraries that are used for GUI, special
    effects, sound, physics, and much more.'
