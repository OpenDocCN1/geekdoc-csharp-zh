    to do math – well that is a lie, some people do. But, when math is complicated,
    it is nice to have some help with it. Python will help with that! You can enter
    your equations into Python and get the correct answer every time. Just so long
    as you enter in the operations correctly. You can do simple equations all the
    way up to equations that are complex and require various steps.


    Some of the more common mathematical operators you will find in Python are as
    follows:


    A+b is for addition.


    a−b is for subtraction.


    a*b is for multiplication .


    a/b is for division.


    a//b is for floor division for Python 2.2 and later.


    a%b, which is a mod b, will provide you with modulo.


    −a is for negation.


    Abs(a) or |a| is for the absolute value.


    A**b or a^b is for exponents.


    Math.sqrt(a) is how you put your square root into Python.


    Please try to remember that if you need to use the function math.sqrt(), then
    you will need to let Python know that you need to load that math module. In order
    to do that, you should have the code to input so that it can be opened.


    A downside to doing math in Python is that it has limitations on floating point
    arithmetic when it comes to rounding errors, which are going to end up giving
    you unexpected results.


    For example, if you choose to do regular division by placing print(0.8/0.2) you
    should get the proper result of 4.0 if done correctly. However, when you do floor
    division with the same numbers, you end up getting a return of 4.0.


    The floor division in Python 2.x series only does it for longs and integers. But,
    “true division” is done on complex and floats. When using Python 3.x, the true
    division method is used on all types of numbers. You can remedy this problem by
    putting around ([math]=0.5 for the regular division sign. The answer for this
    will cause it to be rounded down by 0.5 since you told it to in your function.


    During primary school, the order of operations was learned, and Python is no exception
    to this rule. In math, you will evaluate all expressions by using PEMDAS. You
    are going to do the math as you read; you will work left to right and do each
    of the order of operations in the expression.


    P stands for parentheses. Everything that is in the parentheses is going to be
    done first.


    E is for exponents. An exponent is nothing more than short multiplication or division.


    M and D are for multiplication and division. If you have both in the same equation,
    you are going to do multiplication before you do division.


    A and S are going to be your addition and subtraction. Just like with the multiplication
    and division, you are going to do addition before subtraction.


    If you have done your math correctly, then your answer will be correct.


    For example 8 + (25 − 10) * 6/5 = 26


    The first step is to do 25 − 10 in which you are going to receive the answer 15.


    Since there are no exponents, we skip that step and move onto the multiplication
    and division.


    Your math equation now looks like this 8 + (15) * 6/5 = 26.


    15 * 6 equals 90 leaving you with 8 + 90/5 = 26.


    90/5 will give you 18.


    8 + 18 = 26


    Your answer is 26.


    This may appear to be a lot of actions just for an answer just as simple as that,
    but it is how the people who created how we do math decided to do it.


    As we know, math is not always nice and neat with whole numbers. There are times
    that you will receive a decimal point and even fractions that we are not always
    going to be able to round up or down.


    Sometimes we get numbers like this:


    If you weigh 75 pounds, then you are going to weigh 34.019427 kilograms.


    Python will automatically print out 10 decimal places in any number. But, if you
    only want to get one or two places, you are going to use the round() function
    so that you can round the number to a number of decimal places that you are looking
    for. In using this feature, you are going to be putting not only the number that
    you want to be rounded but also how many places you want it rounded.


    For example, if you want to round out the number that we just came up with when
    we converted pounds into kilograms, you are going to input print round(34.019427,
    2) so that it will round it to two different decimal places.


    In the mathematical rules that we know about rounding decimals, you are going
    to come out with the number 34.02.


    You are going to be authorized to assign one function inside of another function
    to get the answer that you desire. When putting two functions with each other,
    it is called nesting functions, and it is all going to work out the exact same
    way as if you had done the functions by themselves.


    An example would be as follows:


    twoSigFigs = round(pounds_kilograms,2)


    numToString = str(twoSigFigs)


    print (“you weigh” + numToString + “kilograms”)


    Python will do this function and give you the exact same result that you got when
    you converted and rounded. 34.02.


    You are able to do everything from basic math to complex trigonometry problems
    just by using Python. The excellent thing about it is that you are not going to
    need to know how to do the problem itself, you just have to know how to place
    it in Python so that Python can calculate it out for you.


    **Chapter 9**


    ![logo](images/00003.jpeg)


    Formatting Strings in Python


    Strings are a module that contains different constants and classes that are useful;
    they can even hold deprecated legacy functions that are only available as a method
    for using strings. Python has string types that are built into its programming
    in order to support the sequencing type methods.


    In order to format the output on strings, you are going to use a template or the
    percent sign (%) operator. There is an another built-in function that is meant
    to help you in the formatting the strings in Python. The str and Unicode classes
    in Python were placed there to help with multiple variable substitutions as well
    as the formatting of the values in your string by using the str.format() technique.


    The formatter class that you can find within the string module is going to help
    you to customize your own formatting on strings and their behaviors by using the
    same techniques that are placed in the format() method.


    Class string formatter: To follow public methods, this is the formatter to use.


    Format(format_string, *args, **kwargs): This is the primary method. This takes
    your string that you have just formatted as well as a random set of keyword arguments
    and positions. This is just a wrapper for your formatted string that uses vformat().


    The formatter is also going to help define a variety of methods that you can use
    to replace the subclasses.


    Parse(format_string): You are going to cross the formatted string and then return
    the iterable tuple (literal_text, field_name, format_spec, and conversion). Using
    this with vformat() is going to bring the string into replacement fields or literal
    text.'
