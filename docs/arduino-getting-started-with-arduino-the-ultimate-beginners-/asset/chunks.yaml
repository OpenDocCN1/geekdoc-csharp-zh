    ## 术语表


    - **Sketch（脚本）**：用于指代 Arduino 程序的术语。编写用于控制 Arduino 代码段被称为“sketch”，而不是简单的“program”（程序），因为
    Arduino 平台的设计初衷不仅是吸引工程师，还为了吸引艺术家和创意人士。根据创始人的说法，使用“sketch”一词意味着一个可以被探索、完善和开发的粗略构思——就像艺术或设计草图一样。因此，它会让非技术背景的人员在使用
    Arduino 时感到更有鼓舞，且不那么令人畏畏。

    - **Shield（扩展板）**：这是一种可以附加在 Arduino 之上的电路板，用于实现各种目的。它们被称为这个名字是因为它们像保护罩一样覆盖在 Arduino
    板的顶部。

    - **IDE（集成开发环境）**：运行以向你提供 Arduino 板板编程工具的软件应用程序。它包含了源代码编辑器、构建自动化和调试器。它是一个开源软件，可以在
    Arduino 官方网站（[www.arduino.cc](http://www.arduino.cc)）下载。

    - **Pulse-Width Modulation (PWM，脉宽调制）**：描述用于各种应用的数字信号类型的术语。它主要用于控制供给给电子设备的电量。

    - **Voltage（电压）**：电路两点之间的能量量，以标准单位伏特（V）测量。


    ## 第 5 章


    ### 核心资源与进读


    你已经学习了 Arduino 的基础知识，而且如果你确实一直在按照指示操作，你已经亲身感受了该平台能做什么。然而，这只是冰山一角；想要精通 Arduino
    需要时间的投入，并在你所学知识的基础上不断构建。此外，随着越来越多的人开始使用，这个开源平台不断扩展。无论是什么带你来到 Arduino 的，你与这个有趣平台的旅程刚刚开始。这里有一份由
    Arduino 领域最受尊敬的权威编写的实用材料列表，帮助你不断前进。


    ### 针对绝对初学者


    #### Arduino 入门：开源电子原型平台

    作者：Massimo Banzi 和 Michael Shiloh

    ISBN-10: 1449363334 / ISBN-13: 978-1449363338


    还有比从创作者之一身上来更了解 Arduino 更好的方法呢？Massimo Banzi 是该平台的联合创始人。这本对初学者友好的书籍是基于他在教学、使用和构建
    Arduino 方面的丰富经验编写的。


    #### Arduino C 语言入门（第二版）：学习 Arduino C 语言编程 Kindle 版

    作者：Jack Purdum 博士.

    ISBN-10: 1484209419 / ISBN-13: 978-1484209417


    本书专为那些没有微控制器或编程基础经验的人编写，非常适合那些开始编程之旅的人。你将获得对 C 编程语言的介绍，并简单演示了如何在 Arduino 系列微控制器上使用它。此书源自作者
    20 多年的大学教学经验，非常适合完全编程初学者。它读起来引人入胜，且假设读者没有先前的编程或硬件设计经验，让学习变得愉快。


    ### 将你的技能提升到高度


    #### Arduino 编程进阶：深入学习 Sketch

    作者：Simon Monk

    ISBN-10: 0071830251 / ISBN-13: 978-0071830256


    电子大师 Simon Monk 在这本为已经牢牢掌握微控制器编程的人编写的实用指南中，揭示了 Arduino 的专业编程秘密。这本书涵盖了 Arduino
    Uno、Leonardo 和 Due 板。学习高级的“sketching”技巧来让你的 Arduino 提升到下一个水平，包括网络编程、最大化串口通信、内存管理、执行数字信号处理等更多内容。该书包含
    75 多个示例 sketch，均可下载。


    #### 从零开始电子学：通过黑客、设计和发明来学习

    作者：Ronald Quan

    ISBN-10: 0071837280 / ISBN-13: 978-0071837286


    你对常见电子设备背后的复杂电路感到着迷吗？这本书将引导你通过分步实验来揭示电子电路是如何工作的。它还解释了组件、构造技术、基础测试设备、电路分析和故障排除。在读完这本书后，你不仅掌握了设计定制电路的知识，还具备了根据需求黑客和修改现有电路的能力。


    #### 恶魔天才的 30 个 Arduino 项目

    作者：Simon Monk

    ISBN-10: 0071817727 / ISBN-13: 978-0071817721


    曾经想过制作莫尔斯密码翻译器吗？心率监测器？催眠仪？键盘恶作剧？你可以通过这本 DIY 指南释放你的恶魔天才天赋，它向你展示如何使用 Arduino Uno
    和 Leonardo 板编程并构建有趣的项目。你将通过指南进行学习，指南中包含每个项目所需零件的清单、带插图的分步说明，以及对项目背后科学原理的清晰解释。


    ### 趣味项目创意


    #### Arduino 工作坊：65 个项目的实上手介绍

    作者：John Boxall

    ISBN-10: 1593274483 / ISBN-13: 860-1200651553


    认为你已经掌握了 Arduino 并准备好尝试一些有趣的项目了吗？这本书将带你入门。你将学习 Arduino 广泛的输入输出、传感器、显示器、电机。每个项目都旨在巩固你所学的知识，并且复杂性逐渐增加。那么，你可以学习制作什么呢？数字温度计、电池检查器以及
    GPS 记录器等。


    #### 缝纫电气

    作者：Leah Buechley, Kanjun Qiu 和 Sonja de Boer

    ISBN-10: 09897950 / ISBN-13: 978-0989795


    由 LilyPad 板创始人 Leah Buechley 共同编写，这是一本结合了手工、电子和编程创建趣味项目的实践指南。学习使用 LilyPad 板制作互动玩具、时尚配饰和其他许多酷物品，并与朋友分享。这也是老师向学生介绍实用电子学的绝佳材料。


    #### 纺织信息：来自电子纺织与教育的世界

    作者：Leah Buechley, Kylie Peppler, Michael Eisenberg 和 Yasmin Kafai

    ISBN-10: 14331192X / ISBN-13: 978-143311200


    这本书是对电子纺织品的实用介绍——一种用于将电子元件融入服装和家具的软电路板。在 Arduino 家族中，LilyPad 板是一种电子纺织品，而这本入门到中级的指南可以教你如何充分利用你的
    LilyPad。你将接触一系列工具，使任何人（无论是教育工作者、爱好者还是设计师）都能通过电子纺织品进行学习和创作。


    #### Make：可穿戴电子学：设计、原型并穿上自己的互动服装

    作者：Kate Hartman

    ISBN-10: 1449336515 / ISBN-13: 978-1449336516


    对于计算感兴趣以及想要构建融合这两个学科的创意项目的时尚设计师来说，这本书是必读的。你将接触制作互动电子电路并将其嵌入服装的工具、材料和技术，并带有分步说明。虽然书中没有专门介绍
    Arduino 项目，但它将为你提供适用于 Arduino 平台的知识。所以，如果你曾经想过制作随肤色变化的变化的衣服、能显示下一班车到达时间的夹克、动态调整高度的鞋子以及许多酷的可穿戴物品，现在你可以做到了！


    #### Arduino 冒险

    作者：Becky Stewart

    ISBN-10: 1118948475 / ISBN-13: 978-1118948477


