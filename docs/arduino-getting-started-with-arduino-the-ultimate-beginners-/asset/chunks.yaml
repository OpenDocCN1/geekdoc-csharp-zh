  trans: "\n\n-   **强大的社区支持** – 如果你是该平台完全的新手且不知道从何开始，由于 Arduino 的普及，你可以在网上找到丰富的信息。你永远不会缺少学习资源，你甚至可以找到可以立即使用的预先代码项目（Arduino\
    \ 资源请参阅第 5 章）。\n\n## Arduino 能为你做什么？\n\nArduino 的设计初衷是考虑到创意和创新，无论经验水平如何。艺术家、设计师、电工、工程师、程序员和科学爱好者都可以用它来创建交互式对象和环境。Arduino\
    \ 可以交互的内容包括电机、扬声器、LED、GPS 单元、摄像头、电视机、智能手机甚至是互联网。\n\n通过 Arduino，人们可以构建低成本的科学仪器、进行机器人编程、构建建筑设计的交互式原型、为乐器创建用于实验声音的装置、制作新的视频游戏硬件——这仅仅只是冰山一角！因此，无论你的项目是制作机器人、加热毯、节日灯光展示，还是一个占卜机，Arduino\
    \ 都可以作为你电子项目的基础。\n\n## 在继续之前……\n\n为了表示感谢，我为你准备了一个很棒的惊喜，完全免费！\n\n只需点击下方的链接即可了解更多信息。\n\
    \n==> 点击此处<==\n\n我向你保证，这不是“垃圾邮件”，你通过简单的链接可以在几秒钟内回到此页面。\n\n立即行动，避免错过！\n\n==> 立即点击此处!<==\n\
    \n祝得愉快！\n\nSteve Gold\n\n## 第 2 章：开始使用 Arduino\n\n随着 Arduino 平台的不断扩展，持续学习是必要的，因为总会有新事物等待被发现。你在此章中将学到为了让你“涉水”所需要的最少知识。你将接触到基本的\
    \ Arduino 组件、你需要的物品以及如何设置它们。显然，你需要两件核心要素：一块 Arduino 板板和已安装的软件（可以在 Arduino 官方网站免费下载）。\n\
    \n### Arduino 板板的结构\n\n在开始四处挑选硬件之前，你需要了解一些关于 Arduino 板板及其特征的基础知识。市上有多种类型的 Arduino\
    \ 板板可供购买，每种的功能都不同。虽然它们在外观和功能上可能有所不同，但你会发现大多数板子都具有大部分共同组件：\n\n1. **USB 和圆孔插** –\
    \ 每一块板子都有连接电源的方法。几乎所有的 Arduino 板板都带有 USB 连接，因为你将通过它向板上传代码。你也可以通过圆孔插连接墙壁电源。\n\n\
    2. **引脚 (Pins)** – 板板上的引脚是你通过连接电线构建电路的地方。Arduino 板板上有几种类型的引脚，每种都有特定的功能。以下是你通常会发现的：\n\
    \   - `GND`：Ground 的缩写，这些引脚用于你的电路接地。\n   - `5V` 和 `3.3V`：这些引脚分别提供 5 特和 3.3 特的电压。\n\
    \   - `Analog`（模拟）：你可以在 `Analog In` 标签下找到这一行引脚。它们用于从模拟传感器读取信号，并将这些信号转换为数字值。\n\
    \   - `Digital`（数字）：在模拟引脚对面，`Digital` 标签下方是用于数字输入和输出的引脚。例如，指示按钮何时被按下（输入），从而让 LED\
    \ 点亮（输出）。\n   - `PWM`：在许多 Arduino 板板上，`Digital` 旁边有 `PWM~` 标签。这意味着这些引脚可以作为普通的数字引脚，也可以用于一种称为脉宽调制的信号（解释请参见第\
    \ 4 章的术语表）。\n   - `AREF`：Analog Reference（模拟参考）的短形式，这个引脚可以用于设置外部电压作为模拟引脚的上限（0\
    \ 到 5 特之间），尽管它通常被闲置。\n\n3. **重置按钮 (Reset button)** – 这个按钮的作用不言自明；按下它会将复位引脚接地并重启加载到板板上的任何代码。这对于多次测试你编写的代码非常有用。但是，它并不具备将一切重置为初始状态并清除任何问题的功能。\n\
    \n4. **电源 LED 指示灯** – 这是一个微型 LED，可以通过旁边的 `ON` 字识别。当你将板板接入电源时，它会亮起；如果没有亮起，意味着你需要重新检查电路，因为出了问题。\n\
    \n5. **传输 (TX) 和接收 (RX) LED** – 不要与数字引脚 0 和 1 的 `TX` 和 `RX` 标记混淆，带有这些标记的 LED 在板板传输或接收数据时（例如向板板加载新程序时）为你提供视觉指示。\n\
    \n6. **主集成电路 (IC)** – 这是附在每块板板上的、带有金属引脚的黑色部件。它基本上是 Arduino 板板的大脑。主 IC 随板板而异，尽管大多数来自\
    \ ATMEL 公司的 `ATmega` 系列 IC。在从 Arduino IDE 加载新程序之前，了解 IC 和板板类型至关重要。你通常可以在 `IC`\
    \ 的顶部找到这些信息。\n\n7. **电压调节器 (Voltage regulator)** – 正如其名，该组件控制进入 Arduino 板板的电压量。它通过排除进入板板的额外电压来工作。但它有局限性；无法处理超过\
    \ 20 特的电压。所以，警告大家：不要使用大于 20 特的电源！它会销毁你的 Arduino。大多数型号的建议电压为 6-12 特。\n\n### 家族成员\n\
    \nArduino 板板自推出以来一直在不断演变，以满足用户的各种需求和挑战。除了 8 位板板外，Arduino 还针对各种应用开发了板板，从物联网 (IoT)\
    \ 到可穿戴物品。所有的它们都是开源的，这进一步赋予了用户开发衍生并根据特定需求定制的能力。以下是一些被认为最适合 Arduino 初者的选项：\n\n-\
    \ **Arduino UNO (R3)**：UNO 通常被认为是经典的 Arduino 板板。它配备了入门所需的所有设备，带有 14 个数字输入输出引脚——其中\
    \ 6 个可以作为脉宽调制 (PWM) 输出——6 个模拟输入、USB 连接、电源插等。只需将其连接到任何电源（无论是带有 USB 线的电脑、交流转直流适配器还是电池），即可开始使用。无论你的\
    \ Arduino 经验如何，选择 UNO 都不会错。\n- **Arduino Mega (2560)**：Mega 板板比 UNO 高出一个档次；就像它的大哥一样。它拥有惊人的\
    \ 54 个数字输入输出引脚，其中 14 个可以作为 PWM 输出，16 个模拟输入，以及 UNO 上可以找到的所有功能，且功能相同。如果你的项目需要大量的数字输入输出（例如用于许多\
    \ LED 灯或按钮），Mega 可能是适合该工作的板子。\n- **Arduino Leonardo**：Leonardo 提供了一种更廉价、更简单的替代方案，因为它是第一个使用内置\
    \ USB 的微控制器的 Arduino 开发板。由于其直接处理 USB 的能力，可用的代码库可以让板板模拟计算机键盘、鼠标等。\n- **Arduino\
    \ Mega ADK**：这块板子基本上是 Arduino Mega 板板的特殊版本。它专门为与 Android 智能手机交互而设计。\n\n"
