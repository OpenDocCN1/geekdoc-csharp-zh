    # Arduino 板板


    * LilyPad Arduino – 正在考虑制作一件会发光的猫服吗？LilyPad 就是你需要的可穿戴电子织物板子。它由工程师、书籍《Sew Electric》的合著者
    Leah Buechley 设计，这种创新的板子具有大型连接焊盘和平和平整的背面，允许使用导电线将其缝入衣物中。而且它还是可洗的！

    * Arduino NG, Diecimila 和 duemilanove – 这些板子统称为 UNO 的旧版本（Legacy Versions），基本上是
    Arduino 的祖父级。这些旧版板缺少其他新板上的一些关键功能。例如，Diecimila 和 NG 在 USB 端口旁边有一个跳线，需要手动选择 USB
    或电池电源。NG 在上传程序之前，还需要按住几秒钟 Reset（重置）按钮。但需要注意的是，Arduino 爱好者仍在对这些旧版板进行研究和改进。一旦你获得了更多关于
    Arduino 的知识和经验，它们是非常值得研究的。


    ## Genuino 是什么鬼？！


    如果你在美国境外购买 Arduino 板板，你可能会发现外观完全相同的 Genuino 板板。别担心；你并没有被仿品欺骗！Genuino 是 Arduino
    的姐妹品牌，由同一团队创建，用于在美国境外销售的板板和产品。


    Genuino 品牌认证板板和产品的真实性符合 Arduino 的开源硬件理念。该品牌与亚洲、欧洲、南美、加拿大和非洲的市场领先制造商建立了联盟，使 Arduino
    硬件在全球范围内可用。


    你可以将 Genuino 板板想象成住在国外的 Arduino 板板双胞胎。所有 Genuino 板板的质量、组件和特性都与其对应的 Arduino 版本相似。因此，取决于你所在的地区，在想要购买
    Arduino UNO 时可能会发现 Genuino UNO 板板。这没关系；你得到的仍然正品。


    但需要注意的是，并不是所有的 Arduino 板板——尤其是那些不太熟悉的型号——都有 Genuino 双胞胎。


    ## 你可以使用的其他东西


    Arduino 板板本身不能做什么什么，所以你需要将它连接到其他设备上。有很多硬件选项可以固定在 Arduino 板板上，但对于初学者来说学习起来会非常困难（更多阅读建议请参见第
    5 章）。因此，我们只向你介绍两种易于连接到 Arduino 板板并让你的项目活跃起来的方便物品——传感器和扩展板（shields）。


    传感器有很多乐趣。将它连接到你的 Arduino 板板，并添加一些简单的编程代码，你就可以让你的板子感知并测量几乎任何东西——光、温度、物理压力、距离接近、气压和放射性。你还可以构建设备来扫描指纹、检测动物或人的动作以及来自遥控器的信号。


    此外，你还可以通过扩展板做更多事情，扩展板是安装在你的 Arduino 板板顶部的预制电路板。有了扩展板，你可以编写 Arduino 连接到互联网、控制 LCD
    屏幕、控制电机并提供蜂窝通信以及许多其他酷炫的功能，仅限于知识和想象力！


    ## 安装软件


    一旦你处理好了硬件，要做的第一件事就是安装 Arduino IDE。这是你为微控制器编写代码并连接电路组件以实现功能所需的软件。你可以在 Arduino 官方网站下载软件：[www.arduino.cc](http://www.arduino.cc)。


    下载后，将文件夹解压到电脑硬盘上的任一位置，然后运行 `Arduino.EXE` 文件完成安装。现在，你已经准备好开始使用 Arduino 了！


    # 第 3 章：迈出第一步！


    你已经有了 Arduino 板板和软件；现在是时候开始工作了！在接下来的章节中，你将在引导下逐步完成几件事；你将用第一个代码测试 Arduino 软件和板板，并完成一个点亮
    LED 的简单项目。对于给出的示例，将使用 Arduino UNO (R3) 板板。然而，指令经过微调后适用于你选择的任何 Arduino 板板。


    以下是你开始 Arduino 之旅所需的四件设备：


    * 一台运行 Windows（XP 或更高版本）、Mac 或 Linux 操作系统的电脑，并已安装 Arduino IDE

    * 一个 Arduino 微控制器（也称为电路板）

    * 一根 USB A 转 B 线，用于将你的 Arduino 板板连接到电脑，或适用于你选择的板板的线（注意，某些板子需要 A 转 Mini-B 线）

    * 一个 LED


    ## 接入板板


    Arduino 板板通过 USB 连接到电脑（通过 USB 接口）或外部电源（通过圆柱插接口）供电。为了使用 Arduino IDE 对其进行编程，你需要将板板连接到电脑。当你完成编程且不需要连接时——取决于你打算如何在项目中使用该板板——你可以选择使用插座电源供电。


    首先，你必须使用 USB 线将你的 Arduino 板板连接到电脑。当你连接的那一刻，你可能会发现标有“ON”标签的 LED 开始疯狂闪烁；这是存储在板板芯片中的默认程序。你为了启动
    Arduino 将要的操作是覆盖此默认程序，让 LED 缓慢地闪烁，间隔为 2 秒。


    ## 安装驱动程序


    如果你是第一次在 Windows 7、Vista 或 XP 上使用 Arduino 板板，则需要此步骤。如果你使用的是其他操作系统，可以跳过本节。


    1. 当你接入板板时，Windows 将开始驱动程序安装。几秒钟后，程序将失败。

    2. 点击开始菜单，打开“控制面板”。

    3. 在控制面板中，进入“系统和安全”并点击“系统”。

    4. 系统窗口弹出，打开“设备管理器”。

    5. 查看“端口 (COM 和 LPT)”。你应该看到一个名为 `Arduino UNO (COMxx)` 的端口。如果没有 COM 和 LPT 部分，查看“其他设备”下的“未知设备”。

    6. 右键点击 `Arduino UNO (COMxx)` 或未知设备端口，选择“更新驱动程序”。

    7. 接下来，选择“浏览我的电脑以查找驱动程序”。

    8. 最后，导航并选择名为 `arduino.inf` 的驱动文件，它位于 Arduino 下载包的 文件夹中（而不是 FTDI USB Drivers 子目录）。如果你使用的是旧版
    IDE（1.0.3 或更早版本），选择 `Arduino UNO.inf`。

    9. Windows 从那里完成驱动程序的安装。


    ## 启动与 Sketch


    一旦正确安装了 Arduino IDE，你现在准备好用第一个程序测试你的板板了。在在此之前，你需要了解一些关于编写 Arduino 代码的知识。代码被称为
    sketch（程序），用 C++ 编写。


    每个 sketch 需要两个不返回值的 void 类型函数，`setup()` 和 `loop()`。`setup()` 方法在 Arduino 板板启动后运行一次，之后
    `loop()` 方法持续运行。`setup()` 是你想进行任何初始化步骤的地方，`loop()` 是你想反复运行的代码。


    基础 sketch 骨架应该如下：


    ```

    void setup(){}

    void loop(){}

    ```


    现在，让我们尝试你的第一个程序：


    1. 确保你的板板已接入，并启动 Arduino 程序

    2. 通过以下路径打开 Blink 示例 sketch：File > Examples > 1.Basics > Blink

    3. 选择你使用的 Arduino 板板类型：Tools > Board > 你的板板类型

    4. 选择 Arduino 连接的串口/COM 端口：Tools > Port > COMxx


