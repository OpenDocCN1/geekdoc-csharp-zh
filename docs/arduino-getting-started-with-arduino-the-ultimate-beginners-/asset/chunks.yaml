- fmt: "\nSmall talk usually starts small – with just a casual exchange of ideas about\
    \ topics which may even seem rather superficial at first. However, rapport is\
    \ established through these small baby steps. You have to first get the other\
    \ person to feel comfortable with you through easy conversations. If you start\
    \ out strong, deep, and intimate, you are just likely to drive people away. However,\
    \ if you start out small in a casual, non-intimidating manner, you will be able\
    \ to establish rapport. You will get the other person to like you in those first\
    \ few seconds of interaction. You will be able to create a good impression, to\
    \ establish the fact that you are a likable and fun person to be with. By starting\
    \ small and casual, you pave the way to cultivating a deeper relationship – if\
    \ both of you are so inclined to do so.\n\n# Habits of Likable and Charismatic\
    \ People\nCharisma comes naturally to some privileged people. But for most, though,\
    \ it is, happily, something that can be learned. Try to observe people whom you\
    \ consider as charismatic. What is it in their person and behaviors that make\
    \ other people think of them as charming and compelling? What is it that draws\
    \ people to them? What is it that makes other people feel happy, comfortable and\
    \ at ease in their presence?\n\nWhat are the habits of likable and charismatic\
    \ people that you, too, can develop?\n\nLikable individuals know how to initiate\
    \ a conversation to make the other person feel that he is interesting. They know\
    \ how to make others feel comfortable enough to respond to small talk and to overtures\
    \ of friendship. They know not only how to start a conversation but how to sustain\
    \ it. They know how to keep the conversation going so that the other person soon\
    \ feels enthusiastic about the interaction.\n\nIn this aspect, practice, indeed,\
    \ makes perfect. If you find it difficult to converse with people, make it a point\
    \ to approach people and exercise your conversational skills. You may feel uncomfortable\
    \ at first. Just keep on going. You do not have to be brilliant. You just have\
    \ to be nice, to be sincerely interested in the other person. In time, you get\
    \ to be natural at it – able to sense what the other person will find interesting\
    \ to talk about and knowing how to steer the talk towards more interesting and\
    \ more rewarding channels.\n\nA charismatic person shows sincere interest in the\
    \ other person. He asks questions because he genuinely wants to find out more\
    \ about how the other person thinks and feels. He is sensitive. He realizes that\
    \ he cannot simply bombard intimate details out of the other person so he is willing\
    \ to go slow and easy.\n\nA person can sense your interest and he is likely to\
    \ appreciate it. When you are able to effectively communicate this interest, people\
