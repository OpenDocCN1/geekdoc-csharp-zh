  raw: '•LilyPad Arduino – Thinking about making a cat-suit that lights up? The LilyPad
    is the wearable e-textile board you need. Designed by Leah Buechley, engineer
    and co-author of the book, Sew Electric, the innovative board was created with
    a large connecting pad and flat back that allows it to be sewn into clothing with
    conductive thread. And it is even washable!


    •Arduino NG, Diecimila and duemilanove – Collectively known as Legacy Versions
    of the UNO, these boards are basically the granddaddies of the Arduino. The legacy
    boards lack some key features of other newer boards. For instance, the Diecimila
    and NG have a jumper next to the USB port and require manual selection of either
    USB or battery power. The NG also requires holding down the Reset button for a
    few seconds before uploading a program. It should be noted, however, the legacy
    boards are still being tinkered and improved upon by Arduino enthusiasts. They
    are worth looking into once you gain more knowledge and experience with Arduino.


    Genuino Who?!


    If you are shopping for Arduino boards outside of America, you may find Genuino
    boards that look identical. Don’t worry; you are not being duped by an imitation
    product! Genuino is Arduino’s sister-brand, created by the same team, and used
    for boards and products sold outside of the US.


    The Genuino brand certifies the authenticity of boards and products to be in line
    with Arduino’s philosophy of open-source hardware. The brand has alliances with
    market-leading manufacturers in Asia, Europe, South America, Canada and Africa,
    making the Arduino hardware available worldwide.


    You can think of Genuino boards as the identical twins of Arduino boards that
    live in foreign countries. All Genuino boards have the similar quality, components
    and characteristics as their Arduino counterpart. So, depending on which part
    of the world you live, you may find a Genuino UNO board when looking to buy an
    Arduino UNO. That’s just fine; you’re still getting the real deal.


    It should be noted though, that not all Arduino boards – especially lesser known
    ones – have a Genuino twin.


    Other Stuff You could Use


    An Arduino board cannot do much on its own, so you will need to hook it up with
    something. There are plenty of hardware options one can fix onto their Arduino
    boards that will be overwhelming for the beginner to learn (see Chapter 5 for
    further reading suggestions). Hence, we will only be introducing you to two handy
    items that are easy to hook onto an Arduino boards and bringing your projects
    to life – sensors and shields.


    There is a lot of fun to be had with sensors. Hook one up to your Arduino board,
    and add some simple programming code, you can then make your board sense and measure
    practically anything – light, temperature, physical pressure, distance proximity,
    barometric pressure and radioactivity. You can also build devices to scan fingerprint,
    detect motions of animals or people, and signals from remote controls.


    Additionally, you can do even more with shields, which are pre-built circuit boards
    that can fit on top of your Arduino boards. With shields, you can program your
    Arduino to connect to the internet, control LCD screens, control motors and provide
    cellular communication and lots of other cool stuff, limited only by your knowledge
    and imagination!


    Set Up the Software


    Once you have your hardware sorted out, the first thing to do is to install the
    Arduino IDE. This is the software where you will write the code for the micro-controller
    and attach the circuit components to make things happen. You can download the
    software at the official Arduino website: [www.arduino.cc](http://www.arduino.cc).


    Once downloaded, unzip the folder into a choose a location on your computer hard
    drive, and then run the Arduino.EXE file to complete the installation. Now, you
    are ready to get things going with Arduino!


    Chapter 3


    Taking The First Steps!


    You have an Arduino board and the software; it is time to get down to business!
    In the sections that follow, you will be guided in a step-by-step process to do
    a few things; you will test out the Arduino software and board with your first
    code, and do a simple project of lighting an LED. For the example given, an Arduino
    UNO (R3) board will be used. However, the instructions can be applied, with minor
    modifications, to any Arduino board of your choice.


    Here are the four pieces of equipment you will need to begin your Arduino journey:


    •A computer that runs on Windows (XP or above), Mac, or Linux operating system,
    with the Arduino IDE installed


    •An Arduino micro-controller (a.k.a. the circuit board)


    •A USB A-to-B cable for connecting your Arduino board to the computer, or one
    that fits your board of choice (be aware that some boards will require an A-to-Mini-B
    cable)


    •An LED


    Plug in the Board


    Arduino boards are powered by either a USB connection to a computer (via the USB
    jack) or an external power supply (via the barrel jack). You will need to connect
    the board to a computer in order to program it using the Arduino IDE. Once you
    are done with the programming and don’t require it to be connected – depending
    on how you want to use the board for your project – you can then opt for powering
    it with a wall power supply.


    To start off, you must connect your Arduino board to a computer using the USB
    cable. The moment you so that, you may notice the LED with the label ‘ON’ next
    to it starts blinking furiously; this is the default program stored in the board’s
    chip. What you will be doing to kick-start your Arduino is overriding this default
    program, and making the LED blink on and off slowly, at 2-second intervals.


    Install the Drivers


    This step is required if you are using Windows 7, Vista or XP with an Arduino
    board for the first time. If you are using another operating system, you can skip
    this section.


    1.When you plug in the board, Windows will begin the driver installation process.
    After a few moments, the process will fail.


    2.Click on the Start Menu, and open up the Control Panel.


    3.In the Control Panel, go to System and Security and click on System.


    4.Once the System window is up, open the Device Manager.


    5.Look under Ports (COM & LPT). You should see an open port named Arduino UNO
    (COMxx). If there is no COM & LPT section, look under Other Devices for Unknown
    Device.


    6.Right click on the Arduino UNO (COmxx) or Unknown Device port and choose the
    Update Driver Software option.


    7.Next, choose the Browse my computer for driver software option.


    8.Finally, navigate to and select the driver file named arduino.inf, located in
    the Drivers folder of the Arduino Software download (not the FTDI USB Drivers
    sub-directory). If you are using an old version of the IDE (1.0.3 or older), choose
    the Uno driver file named Arduino UNO.inf.


    9.Windows will finish up the driver installation from there.


    Launch and Sketch


    Once you have the Arduino IDE properly installed, you are now ready to test drive
    your board with the first program. Before getting into that, there are some things
    you need to know about writing code for Arduino. The codes are known as sketches,
    written in C++.


    Every sketch needs two void type functions that do not return any value,  setup()  and
    loop(). The setup() method is run once, just after the Arduino board is powered
    up and the loop() method is run continuously afterwards. The setup() is where
    you want to do any initialization steps, and loop() is for codes you want to run
    over and over again.


    A basic sketch skeleton should look like this:


    | void setup(){}void loop(){} |


    Now, let’s give your first program a try:


    1.Make sure your board is plugged in, and launch the Arduino application


    2.Open the Blink example sketch by going to: File > Examples > 1.Basics > Blink


    3.Select the type of Arduino board you’re using: Tools > Board > your board type


    4.Select the serial/COM port that your Arduino is attached to: Tools > Port >
    COMxx'
