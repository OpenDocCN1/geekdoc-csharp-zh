    Chapter 1


    The 60-Second Guide to Instant Rapport


    Establishing a Great First Impression


    Research indicates how important making a good impression is in effective communication
    and interpersonal relationships. All of us are hardwired to evaluate a person
    based on the first sixty seconds of interaction. This inherent inclination to
    immediately assess someone has its roots in evolution. In olden times, one had
    to be able to tell whether or not another person was friend or foe; giving off
    the wrong impression could result in tragic consequences.


    Today, making a good first impression is still essential—even if the outcome may
    not exactly be a matter of life or death. All of us want to make a great first
    impression on other people. We barely have 60 seconds to do this, and once a first
    impression is made, it is extremely difficult to change it. For this reason, it
    pays to give every new encounter the best that you are capable of. You are not
    likely to get a second chance.


    Some people say that all that is required to make a good first impression is a
    heavy dose of good old common sense. This may very well be true but because you
    are not likely to get a second chance at making a great first impression, it pays
    to be prepared and to give it some serious thought.


    Making that Instant Spark and Improving Your Rapport Development'
