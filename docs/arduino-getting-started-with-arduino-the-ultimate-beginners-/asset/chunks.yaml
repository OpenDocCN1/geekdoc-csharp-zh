    # 引言


    当演员罗伯特·道尼·小约翰签约饰演托尼·斯塔克（又名钢铁侠）时，他向导演约翰·法弗罗建议他们与埃隆·马斯克见面。他们的任务是赋予超级英雄生命，而马斯克是现实生活中最接近漫威式的天才、万富翁和慈善家的人。会面安排后，马斯克的的一些特征进入了道尼小约翰在屏幕上对托尼·斯塔克的刻画，从而创造了人们所知并喜爱的难忘角色。


    现实中，马斯克的生活和人格远比一个虚构角色所能体现的要丰富得多。确实，他与钢铁侠有许多共同点；他是一个过人的技术天才和企业家，能够将看似不可能的想法变为现实。像托尼·斯塔克一样，他梦想、思考和生活得非常宏大，但相似性仅此于此。


    与其漫画中的对应形象不同，埃隆·马斯克并非出生在奢华和安逸的生活中。尽管在青少年时期就展现出了非凡的潜力，但他的童年和青少年生活充满了敌意。直到今天，马斯克仍归功于早年的斗争帮助他培养了那广为人知的百折不屈的精神。


    在 IT、金融、可持续能源、汽车、航空航天和太空探索领域留下了足迹后，说马斯克从卑微的起点已经走了很远并不过。他创立了一些最具创性的公司——`Paypal`、`Tesla
    Motors` 和 `SpaceX`——几乎凭一人为每家企业的成功承担了责任。无论他决定涉足哪种业务，他都会带去革命性的想法，这往往会成为行业规则的改变者。然而，他远未结束。


    即使在经历了多次成功的尝试后，他卓越的大脑从未停止构思更宏大的创新。他丰富且狂野的雄心似乎是由改变我们所居住世界的宏伟愿景驱动的。他的未来计划包括让道路上布满电动汽车，用太阳能为世界提供动力，殖民邻近行星，并让人们通过未来性的高速公共交通系统跨越长距离。


    大多数孩子都会想象去外太空，乘坐子弹般快速胶舱穿梭于不同的城市，直到这些幻想在成年后逐渐幻灭。很少有人敢于梦想过那些本应停留在虚构领域的幻想。埃隆·马斯克就是这极少数卓越者之一。


    # 第 1 章：伟大的开端


    几乎每一个成就人士的成功故事都包含这样的情节，凸显了他们非凡的钢铁意志、批判性思维、勤奋倾向，以及对“不可能并非不可及”的坚定信念。作为 `20^(th)`
    世纪末信息时代黎明和技术热潮后塑造全球经济的最卓越头脑之一，埃隆·马斯克在如此幼的年纪就表现出如此鲜明的个性特征，这并不意外。


    埃隆·里夫·马斯克于 1971 年 6 月 28 日出生于南非豪尔滕省的普勒托利亚。他的父亲是出生在南非的英国电气工程师 `Errol Musk`，母亲是加拿大裔英国人营养师
    `Maye Musk`。埃隆是他们三个孩子中的长，随后是弟弟 `Kimbal` 和妹妹 `Tosca`。


    在普勒托利亚长大，埃隆的早年生活并非如画般的童年。他在 9 岁时父母离婚，之后他大部分时间与其要求严苛且情感上虐待他的父亲在一起。在学校里，他忍受同龄人的严厉欺凌。在一次著名的事件中，他被推下楼梯导致住院。这些磨难让埃隆在能获得的最安全的陪伴中找到了慰藉；他自己的思想和想象力，这些存在于他那过人大脑的深处。


    当他在 10 岁就开始自学计算机编程时，他在技术创新和创业方面的天赋便显而易见。当他才 12 岁时，就开发了一款名为 `Blastar` 的太空船射击游戏，并以
    `$500` 卖给一本电脑杂志。在第一次尝试成功后，埃隆和他的弟弟 Kimbal 计划在学校附近开一家游戏厅。不幸的是，当他们的父母拒绝提供获得营业执照的法律同意时，他们进取的计划被迫流产。

