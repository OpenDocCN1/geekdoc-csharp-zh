    ![](img/cover.jpeg)


    # Arduino

    # Arduino 入门指南：终极新手指南


    Steve Gold


    ## 引言


    如果你对最简单的技术深着迷，并经常对日常生活中无处不在的电子设备的内部原理感到好奇，那么你可能会在对 `Arduino` 的实验和摆弄中发现乐趣。


    所有开关开关即可焕发生机的事物的核心——闪烁着多种色彩的圣诞树灯、在触摸屏设备上打开的应用程序，以及加热食物的微波炉等——都是一个微控制器，它被编程在激活时执行特定的任务。`Arduino`
    是一个由微控制器和编程软件组成的开源平台。与大多数平台不同，`Arduino` 面向想要在电子领域发挥创意的非电子专业人士，同时也具有足够的活性来适应工程专家。无论你之前在电子和编程方面的知识如何，它都旨在做到易于上手、低成本且易于学习。


    本指南不会让你一夜之间成为 `Arduino` 专家——事实上，没有任何东西可以做到。然而，你将从书中中学到这个惊人的多功能平台的基础知识，你还将有机会亲身体验它的功能。我们将引导你了解
    `Arduino` 电路板的关键特征、开始工作的技术要求、如何启动你的第一个 `Arduino`、为了生存需要知道的重要术语，以及如何继续学习以在你所学知识的基础上不断构建。


    此地的信息旨在面向电子、电路和编程的绝对初学者。如果你一直想学习如何用电子设备制作酷东西，但对如何开始完全无从下手，现在你手指尖已经拥有了所需的所有信息，以进入兴奋的
    `Arduino` 世界。剩下的就取决于你了！


