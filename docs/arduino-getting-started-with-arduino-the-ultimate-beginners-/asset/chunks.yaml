    ## 第一章

    ### 了解 Arduino


    2005 年，意大利的伊里亚交互设计学院（Ivrea Interaction Design Institute）启动了一个创建开源平台的项目，用于构建各种电子项目，被称为
    `Arduino`。它最初面向几乎没有电子或计算机编程背景的学生，但最终因其易用性和对新手友好的特性而在范围内广受欢迎。


    自诞生以来，`Arduino` 吸引了来自各个经验水平的爱好者、艺术家、程序员、学生甚至黑客的关注和热情。作为一个开源平台，它在多元化用户社区的贡献下不断成长，不断推向其能力的极限。事实上，`Arduino`
    是成千上万项目和应用的支柱，从日常用品到复杂的科学设备。


    `Arduino` 平台由两个部分组成：


    1. 硬件——一个物理可编程电路板，也称为微控制器。有不同类型的 `Arduino` 板（更多内容将在第二章中介绍）。

    2. 软件——运行在计算机上的集成开发环境 (`IDE`)，用于编写和将编程代码上传到物理板。


    #### 为什么选择 Arduino？


    几乎任何人都可以使用 `Arduino`。专家们乐于构建项目并在在线社区中与其他用户分享想法。对于那些没有电路和微控制器编程经验的人来说，该平台是学习和进行实验的极佳工具。然而，建议在探索
    `Arduino` 的奇之处之前，你至少应该牢固理解这些基本概念：


    - 电电路的基础

    - 电压、电流、电阻和欧姆定律

    - 极性

    - 集成电路 (`ICs`)

    - 数字逻辑

    - 模拟对比数字

    - 基础计算机编程


    让 `Arduino` 受业余爱好者和专家青睐的原因是，与其他平台和系统相比，它简化了处理微控制器的过程。初，将新代码加载到板上只需通过 USB 线即可完成，而以前的可编程电路板需要使用额外的硬件。另一个优点是，与其他微控制器平台相比，`Arduino`
    板相对廉价，一些预组装模块的价格低于 50 美元。如果这些好处还不够，这里是选择 `Arduino` 的更多原因：


    - 跨平台——`Arduino` 的 `IDE` 运行在 Windows、Mac OSX 和 Linux 操作系统上，而大多数微控制器系统仅兼容 Windows。

    - 简单的编程环境——`Arduino` `IDE` 使用简化版的 `C++`，让新手更容易学习编程，同时又足够的灵活性让高级用户发挥创意并追求抱负。

    - 开源且可扩展的硬件——`Arduino` 板的设计方案根据知识共享许可发布，允许电路设计师创建模块的版本，对其进行扩展和改进。

    - 开源且可扩展的软件——`Arduino` `IDE` 以开源工具的形式发布，丰富的程序员可以通过 `C++` 库对其扩展。你也可以通过 `Arduino`
    学习 `AVR-C` 编程语言，就像直接在 `Arduino` 程序中添加 `AVR-C` 代码一样。


