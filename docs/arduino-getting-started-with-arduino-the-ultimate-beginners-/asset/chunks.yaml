    1.Plug in your board.


    2.Open another example sketch: File > Examples > Basics > BareMinimum. This will
    open a new window with a simple sketch that acts as the framework for your program.
     


    3.Connect the LED’s anode (the longer pin) to pin 13 on the Arduino board, and
    the cathode (the shorter pin) to the adjacent GND pin.


    4.Under the setup() section of the sketch, add the code: pinMode(13, OUTPUT);.
    This is the command that will run once to configure the board and get it ready
    to do as you program.


    5.Add the following under the loop() section: digitalWrite(13, HIGH);. This sets
    the pin 13 as an output pin with high voltage level (5 Volt).


    When complete, your sketch should look like this:


    | void setup(){pinMode(13, OUTPUT);}void loop(){digitalWrite(13, HIGH);} |


    Hit the Upload button and wait for the Done Uploading message to show in the status
    bar. Voila! The LED should light up.


    Chapter 4


    Arduino Survival Lingo


    As you go about adding to your knowledge bank about all things Arduino, you are
    bound to encounter some frequently used jargon. This mini glossary of terms is
    by no means extensive, but it does help the beginner understand the terms people
    often mention when they talk about Arduino, so that you will not be totally at
    a loss.


    8-bit – The term refers to a Central Processing Unit (CPU) that processes 8 bits
    of data as a single unit.


    Analog – Describes devices or systems that represent changing values as continuously
    variable physical quantities. As humans, we perceive the world in analog, as everything
    we see and hear is a continuous transmission of information (data) to our senses.
    An example of an analog device is a record player, because it reads bumps and
    groves from a vinyl record as a continuous signal. Analog data is more accurate
    than digital data, but harder to manipulate and preserve. With Arduino boards,
    you can use the analog pins to convert analog data to digital values.


    AVR – When you work with electronics, you will encounter several meanings for
    this acronym. In Arduino terms, it refers to the platforms environment, which
    is based on Atmel Atmega micro-controllers. The AVR micro-controller was developed
    by Atmel Corporation in 1996, by Alf-Egil Bogen andVegard Wollan. The AVR acronym
    derives from its developers and stands for Alf-Egil Bogen Vegard Wollan RISC micro-controller,
    and is also known as Advanced Virtual RISC.


    C++ – Pronounced as ‘cee plus plus’, it is a general-purpose programming language.
    You program an Arduino board do stuff with C++, using the Arduino IDE.


    CPU – Stands for Central Processing Unit and is also commonly referred to as the
    processor, a CPU is the electronic circuitry within a computer that carries out
    the instructions of a program.


    Digital – Information in digital is stored using a series of 1s and 0s, known
    as binary code. Digital is the opposite of analog. Because digital devices read
    only 1s and 0s, they can only approximate audio and video signals. Unlike analog,
    digital data is easier to manipulate and store.


    Driver – A software that allows a computer to connect and communicate with a hardware
    or device. Without the right driver, the hardware you connect to a computer will
    not work properly. Depending on the operating system you are using to work with
    your Arduino, you may need to install the driver for the board.


    Environment – In computing jargon, the environment refers to a particular configuration
    of a hardware platform and the operating system that it runs on.


    Ground – In electrical engineering, a ground is the reference point in an electrical
    circuit from which voltages are measured or the common wiring point. The term
    can also mean the literal earth where electrical circuits are connected to. On
    the Arduino board, the GND pin serves this purpose.


    I/O – Short for input/output, which describes a program, operation or device that
    transfers data to or from a computer, to interact with the outside world. For
    example, if a button is pressed (input), a light bulb goes on (output).


    LED – The acronym for Light-Emitting Diode, a two-lead semiconductor light source.
    LEDs have many advantages over other light sources, including smaller sizes, longer
    lifespan and lower energy consumption. On the Arduino board, you will notice some
    LEDs that indicate when the board is powered and codes are uploaded.


    Micro-controller – A computer present in a single integrated circuit that is programmed
    to perform specific tasks. Micro-controllers are the brains behind automatically
    controlled electronic devices, from cell phones and cameras to washing machines
    and microwave ovens to robots.


    Open-source – A program whose source code is made freely available to the public
    for use or modification. Open Source is a certification mark owned by the Open
    Source Initiative (OSI) that allows software developers to freely share their
    products with the public, so that it can be improved upon and redistributed. Unlike
    commercial software, where some sort of redistribution licensing is required,
    anyone can have a hand in developing and redistributing an open-source project.


    Sensor – Electronic devices used to measure physical quantities, and then convert
    them into electronic signals. There are various different kinds of sensors for
    measuring things in the physical, such as temperature, pressure, distance, noise,
    motion etc. Sensors are normally components of more complex and sophisticated
    electronic systems. If you want to built a digital thermometer, for instance,
    you will need a temperature sensor that will go with your Arduino board.


    Serial port – A connector that is used to send data to a device connected to a
    computer, such as modems, printers, and mice. An Arduino board must be connected
    to the right serial port for codes to be uploaded properly.'
