    If you know a kid who shows potential in electrical engineering and programming,
    give this book to him or her! Written specifically for the budding electrician,
    ages 11 to 15, this book is an excellent Arduino introductory source.


    # Online Resources


    [https://www.arduino.cc/](https://www.arduino.cc/) - The official Arduino website
    for all your needs and the latest development news regarding the platform. Here
    is where you can find and join the Arduino forum to get help and share knowledge
    with other users from all around the world.


    [http://www.cplusplus.com/](http://www.cplusplus.com/) - A comprehensive online
    library for all things C++. You can learn about the history, development and the
    A-to-Zs of the programming language that Arduino runs on.


    [http://www.ladyada.net/](http://www.ladyada.net/) - A wonderful resource to learn
    about electronics and circuitry, with nearly all its content being open-sourced.


    # Conclusion


    Congratulations on completing the Arduino basic apprenticeship and successfully
    navigating your first Arduino project! In this book, I hope I have managed to
    give you all the information you need to feel confident in your ability to move
    forward and try some more difficult Arduino projects. Good luck!


