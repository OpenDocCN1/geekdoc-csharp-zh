    Chapter 3


    Be Liked in an Instant


    Small Talk Equals Instant Connection


    The ability to make small talk is an essential skill if you want to make an instant
    connection. It is a way of starting a conversation in an easy and comfortable
    manner. You talk about things that people find generally interesting and easy
    to converse about – music, movies, food, travel, sports, and other topics that
    people can discuss with ease – without fear or anxiety.


