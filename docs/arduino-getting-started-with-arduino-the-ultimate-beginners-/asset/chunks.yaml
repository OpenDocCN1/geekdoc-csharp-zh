- fmt: '

    To create instant spark and rapport with another person, you have to be genuinely
    interested in the other person – and to demonstrate this interest to him or her.
    You have to be a good listener. This means that you need to listen attentively,
    not only to what the other person is saying – but also, and sometimes more importantly,
    to what they are not.


    Pay close attention to their non-verbal behaviors. These will cue you in to what
    the person you’re conversing with is really feeling and will help you determine
    how you should proceed with the rest of the conversation. Active listening allows
    you to fully understand what the other person is saying and to maintain a strong
    focus.


    When you listen intently to the other person, you make them feel important and
    special. They are likely to think well of you and if the person senses that you
    are sincerely interested in them, you create an instant spark and are able to
    develop immediate rapport. You make the person feel comfortable and happy to be
    spending time with you.


    # Chapter 2: Let Your Body Talk


    How you behave is just as important as what you are saying. Your body language
    is just as effective as your words are in communicating your feelings. You tend
    to become better at establishing rapport when your body language signals your
    interest in people.


    ## The Art of Body Language


    It is not enough to tell people that you want to get to know them. Your words
    are useless if your actuations do not substantiate them. If you want to create
    a strong immediate connection with people, use your body language to effectively
    demonstrate your interest to connect with them.


    There are many non-verbal cues that other people find appealing. Strengthen your
    winning ways by looking closely into these behaviors.


    When you turn toward another person, cross your legs in his direction, or point
    your feet towards him, you tell him through your body language that you want to
    know him better. When your body stance is open, you indicate that you are receptive
    to him.


    Try to cultivate a sincere and contagious laugh. People respond strongly to somebody
    who laughs at the right time -- and in a spontaneous, charming, child-like manner.
    In the same manner, be careful not to laugh in a loud or unpleasant way. Bray
    like a donkey or laugh in a strident manner – and people are certain to stay out
    of your way.


    Let your voice echo your excitement or pleasure. An expressive and lively voice
    is very attractive, particularly if it resonates and sparkles with positive feelings.
    Learn to cultivate a voice that reflects changes in volume, speed, and pitch,
    depending on the changing emotions that are present. Let your voice reflect your
    excitement about a particular topic. Let it mirror the warm and cordial feelings
    you feel about making the acquaintance of the person you are talking to.


    An inscrutable face tends to intimidate. A warm and open face draws people.


    Allow your face to demonstrate your feelings. You will be able to communicate
    more effectively when you enable the other person to better understand what you
    are saying through the different expressions you show on your face. The person
    you are talking to looks at your face and understands not only the ideas that
    you are expressing verbally but the feelings behind your words, as, through the
    different vivid expressions that flit across your face.


    Use your body language to help others visualize what you are saying. You do not
    necessarily have to act out your narrative but hand gestures and other body movements
    – on top of facial expressions – will definitely help you captivate the other
    person with what you are saying. He is not only likely to be better able to grasp
    your meaning; he is likely to be enthralled by you as well.


    ## The No-No’s of Non-verbal Behavior


    There are certain non-verbal behaviors that undermine your ability to establish
    rapport. You have to look into these behaviors so you can turn them around to
    work to your advantage.


    ### Be cautious about giving a fake smile.


    Everybody responds well to a smile – but it has to be sincere smile, a smile that
    reflects genuine interest, a warm welcome, or positive feelings. A fake smile
    simply makes people wary of you. It is not likely to make people think favorably
    of you; it may even make them avoid you.


    ### Be careful about making eye contact.


    When you establish and maintain eye contact, this shows the other person that
    you are interested in him. When you look past the person you are talking to, or
    keep your eyes on other people or goings-on in the room, these actions tell him
    that you are simply not interested -- that you would rather be somewhere else
    or talk to someone else. Take care not to glare as this makes the other person
    feel uncomfortable. Do not roll your eyes, either, as this non-verbal behavior
    demonstrates frustration or annoyance.


    ### Do not stand too close to the other person.


    Understand and respect the concept of “personal space.” When you position yourself
    too close to another individual, that person can feel uncomfortable or vulnerable.
    He is likely to see you as pushy or aggressive.


    ### On the other hand, do not stay too far away.


    You are likely to come across as aloof, unfriendly, and distant – not at all interested
    in establishing a connection with the other person.


    ### Do not always touch the side of your nose or scratch your head.


    These gestures are non-verbal cues that signal that you are telling a lie, or
    hiding or exaggerating something. They also indicate that you are not sure about
    what you are saying.


    ### Do not cross your arms over your chest – using them as a “barricade.”


    This stance signals that you are defensive and reluctant to let the other person
    get to know you better. Putting your hands in your pocket all the time says the
    same thing. If you do these things often, you are likely to come across as cold
    and aloof, and possibly even condescending.


    ### Do not move around too much.


    If you constantly pace, shift in position, or sway, this may indicate boredom
    or restlessness. It shows the other person that you are not really interested
    in the conversation.


    ### Do not look blank or impassive.


    It is difficult to carry on a conversation with a person who shows very little
    change in facial expression. He seems uninterested, indifferent, and unresponsive.
    It is more stimulating to talk to someone who is expressive, lively, and animated.


    ### Do not be inflexible.


    Move your body expressively. Use hand gestures to make your point. Being too rigid
    gives the impression that you’re uncomfortable and unable to relax. Of course,
    don''t overdo it either!


    ### Do not play with your pen, tie, jewelry, or hair.


    This is distracting behavior. It signals to the person you are talking to that
    you are not interested in the conversation or that you are nervous. Either way
    this behavior is best avoided.


    ### Do not fuss.


    Demonstrate your confidence through your body language – even if you really are
    nervous. Do not constantly rub your palms together, slouch your shoulders, or
    twist your hair. All of these actuations show that you are edgy. They can make
    others feel uncomfortable and tense, too.


    # Chapter 3: Be Liked in an Instant


    ## Small Talk Equals Instant Connection


    The ability to make small talk is an essential skill if you want to make an connection.
    It is a way of starting a conversation in an easy and comfortable manner. You
    talk about things that people find generally interesting and easy to converse
    about – music, movies, food, travel, sports, and other topics that people can
    discuss with ease – without fear or anxiety.

