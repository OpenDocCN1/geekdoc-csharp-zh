  raw: 'Small talk usually starts small – with just a casual exchange of ideas about
    topics which may even seem rather superficial at first. However, rapport is established
    through these small baby steps. You have to first get the other person to feel
    comfortable with you through easy conversations. If you start out strong, deep,
    and intimate, you are just likely to drive people away. However, if you start
    out small in a casual, non-intimidating manner, you will be able to establish
    rapport. You will get the other person to like you in those first few seconds
    of interaction. You will be able to create a good impression, to establish the
    fact that you are a likable and fun person to be with. By starting small and casual,
    you pave the way to cultivating a deeper relationship – if both of you are so
    inclined to do so.


    Habits of Likable and Charismatic People


    Charisma comes naturally to some privileged people. But for most, though, it is,
    happily, something that can be learned. Try to observe people whom you consider
    as charismatic. What is it in their person and behaviors that make other people
    think of them as charming and compelling? What is it that draws people to them?
    What is it that makes other people feel happy, comfortable and at ease in their
    presence?


    What are the habits of likable and charismatic people that you, too, can develop?


    Likable individuals know how to initiate a conversation to make the other person
    feel that he is interesting. They know how to make others feel comfortable enough
    to respond to small talk and to overtures of friendship. They know not only how
    to start a conversation but how to sustain it. They know how to keep the conversation
    going so that the other person soon feels enthusiastic about the interaction.


    In this aspect, practice, indeed, makes perfect. If you find it difficult to converse
    with people, make it a point to approach people and exercise your conversational
    skills. You may feel uncomfortable at first. Just keep on going. You do not have
    to be brilliant. You just have to be nice, to be sincerely interested in the other
    person. In time, you get to be natural at it – able to sense what the other person
    will find interesting to talk about and knowing how to steer the talk towards
    more interesting and more rewarding channels.


    A charismatic person shows sincere interest in the other person. He asks questions
    because he genuinely wants to find out more about how the other person thinks
    and feels. He is sensitive. He realizes that he cannot simply bombard intimate
    details out of the other person so he is willing to go slow and easy.


    A person can sense your interest and he is likely to appreciate it. When you are
    able to effectively communicate this interest, people are likely to see you as
    likable and charismatic. Because of this they tend to open up to you, to feel
    comfortable with you, and to be willing to take the conversation into deeper ends.


    Like and Be Liked Through Listening and Mirroring


    When you interact with a person, you may be able to “mirror” some of his behavior
    – facial expressions, posture, gestures, and even words. Research shows that mirroring
    is an effective technique for making another person like you. If you effectively
    use this technique, you may also find yourself readily liking the other person
    in return.


    You will find it easier to make an instant connection with another person when
    you act and talk like he does. He will then see you as somebody familiar and comfortable
    to be with. He will find it easier to trust you because you, after all, appear
    to be just like him! When he sees that you have many things in common with him,
    he is likely to feel an instant bond with you. He tends to see himself in you.


    You can use this powerful technique to create instant rapport with other people.
    You can harness mirroring to like and be liked by people in just 60 seconds.


    Be attentive and observant of the other person. Observe both his verbal and non-verbal
    behavior.


    What is the quality of his speaking voice? Does he talk in a soft, gentle, and
    deliberate manner? Or is he more emphatic, speaking loudly and assertively? Try
    to get a grasp of the rhythm, cadence, and speed of his speech.


    Look at how he carries himself. Pay attention to how he tilts his head. Does he
    often lean forward? Does he tend to slouch? Or does he keep himself erect all
    the time?


    Does he smile often? Does he often widen his eyes or move his eyebrows to make
    a point?


    People often communicate with their hands – deliberately or unconsciously. Does
    he do this? Does he use hand gestures to add emphasis or convey his emotions with
    flourish? Watch how he gestures with his hands.


    Observe all of these aspects of his verbal and non-verbal behavior and try to
    mirror them as you see fit. Note that mirroring is not mimicry. It is more of
    empathy – actively listening to what the other person is saying – both in his
    words and behavior -- and responding to it by acting in a way that shows this.
    It entails responding intelligently and sensitively to the other person. For after
    all, if you are not listening intently, if you are not paying sufficient attention,
    you will not be able to “mirror” the other person. Mirroring the other person
    underscores the fact that you are, indeed, focused on the other person. What is
    not to like in that? When you try to mirror the energy level and physical mannerisms
    of the person you are talking to in a way that is natural, he is likely to respond
    well to it. Without necessarily agreeing to what he says, but merely acting the
    way he does to some degree, you are likely to make him see you in a positive light.
    He is likely to think of you as likable and charismatic.


    If you use this technique for the right reasons – using it in the right manner
    and the right time, you will be able to easily make an instant connection with
    other people.


    Conclusion


    The impression you make on other people, particularly during the first 60 seconds
    of meeting them, determines to a great degree if you will be able to effectively
    connect with them. Use the easy steps presented here and you will be able to create
    a great first impression, develop instant likability and charisma, and establish
    rapport with other people.


    When you speak of charisma, you may be inclined to think about appearing as someone
    “special” to other people. True charisma, however, is grounded on how you make
    others feel – particularly about themselves. If an interaction with you, no matter
    how short, results in making the other person feel lighter, happier, and better
    about himself – if he feels special and important because of your actuations,
    he is likely to see you as likable and charming. Use this guide and you will be
    on your way to connecting with people without difficulty.


