    # Warren Buffett’s Vision and Principles


    Buffett’s clear vision of his future from the time he was raised in Omaha and
    Washington, D.C., has allowed him to become wealthier than even the greediest
    person can imagine. The invaluable plans from when Buffett was young that created
    his happy existence involved taking an inventory of his life, embracing the simplicity
    of his life and never straying from his core values.


    When taking an inventory of his life during his formative years at the University
    of Nebraska and Columbia Business School, Buffett realized his greatest asset
    aside from his health was his association with his significant other, family and
    long-standing friends. His inherent assets – his personality, humor and education
    -- all played a part in his fruitful association with others. They carry no price
    tag. Those assets define him more than money ever will.


    Buffett’s simple pleasures of life include keeping to himself, reading a book
    without interruption. His idea of a pleasurable evening since his high school
    years is not being out on the town but instead staying home to watch television
    and enjoy a hot cup of tea. Buffett believes that taking every opportunity to
    embrace your simple pleasures is the most valuable move you can make for your
    future.


    Throughout the years, Buffett has stayed true to his core principles and values.
    He never takes a chance with his investments. He sticks with investing in the
    sectors he believes will produce the most profit. Maintaining a clear vision of
    the values needed to reach prosperity has allowed Buffett to stay atop the business
    world, never wavering.


