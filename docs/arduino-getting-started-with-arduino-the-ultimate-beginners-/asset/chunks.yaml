    It may be a bold statement, but I believe that no one in the world of investment
    who’s alive today understands success, wealth and, perhaps even happiness, the
    way that Warren Buffet does. Not only does the so-called “Sage of Omaha” know
    how to generate an immense fortune, he also has a solid comprehension of how finite
    and impermanent money actually is. He may have made a name for himself as an investment
    strategist, but Buffet often speaks of how loose and overrated the link between
    wealth and quality of life can be. He would even go as far as to stress – somewhat
    paradoxically – that the more money one has, the less free and unhappy one is
    likely to become.


    Indeed, it can almost seem at times that despite his influential career in finance,
    Buffett does not place great importance on money and material possessions. His
    net worth may be up in the billions, but he lives in the least billionaire-like
    fashion. Buffett, who’s the antithesis of the typical image of a wealthy business
    magnate, owns a considerably modest amount of tangible assets compared to his
    nine-figure net worth peers, and he appears to be disinterested in the extravagant
    lifestyle of the rich and famous. He embraces the simplicity of daily life, reminding
    himself from the onset of his career that there are no greater assets one can
    possess than good health, as well as remembering that the key to happiness lies
    in the priceless bonds one creates with friends and family.


    His impartiality to wealth could not be more evident than in his numerous philanthropic
    efforts, which includes record-breaking donations amounting to more than half
    of his accumulated wealth over time.


    Regardless of where one stands in life and whatever one’s aspirations are, plenty
    can be learned by examining the core values that made Warren Buffett one of the
    most successful and wealthy individuals in the world.


    In the chapters that follow, you will see that business and personal success is
    not so much a result of strategic investment decisions, but rather that it results
    from cultivating a number of personality traits essential for navigating the world
    of commerce. Additionally, as Buffett has continuously demonstrated, good character
    and adherence to moral principles goes a long way in ensuring long-term success,
    wealth and happiness.


    Warren Buffet has made great contributions to the world in the form of a long-standing
    investment track-record along with his enormously generous philanthropic endeavors.
    As a business and investment magnate, Buffett’s approach to growing and managing
    wealth contains a certain humility that is so rarely given attention in a field
    that is predominantly about strategies and figures. Drawing from his own life
    experiences, Buffett acknowledges the human element that is often overlooked when
    it comes to accumulating and maintaining wealth. His philosophy and principles
    are simple, yet so powerful that they go beyond investment portfolios and apply
    to practically every aspect of our lives.


    Buffett’s extensive career achievements, however, can never measure up to the
    impressive life he has led. Living by his beliefs and principles, he proves that
    with patience, perseverance, diligence and hard work, one can build a financially
    stable and fulfilling life. Most importantly, he has exemplifies that a quality
    life is one which is lived with generosity, integrity and modesty.


    # Chapter 1: Plan For The Future


    > “Someone''s sitting in the shade today because someone planted a tree a long
    time ago.” — Warren Buffett


    The path to financial and personal success is not lined with gold but with golden
    values.


    Keeping your path straight, free from distractions or temptations, is the best
    vision anybody can take while planning their financial future. Investment strategists
    such as Warren Buffett suggest instilling in yourself from a young age the ability
    to stick with your plan following concrete steps to get to where you want to be.


    Buffett had a vision from when he was a child that he would be rich by investing
    his money in himself instead of giving away his hard earned money to somebody
    else. That vision started when he was a young boy in Washington, D.C., where his
    father served four terms in the U.S. House of Representatives after moving the
    family from Omaha, Neb. His father was originally a stockbroker and Warren learned
    the trade of investing by being close to his father. As a teenager in D.C., Buffett
    invested in placing pinball machines in barbershops. He took the money from those
    pinball machines and invested in more machines.


    He was fortunate from the beginning to have a father who stressed the importance
    of making sound financial decisions to improve his future. Every bit of his money
    was important to his development in becoming the second wealthiest person in America,
    behind business magnate Bill Gates.


    Buffett, who was born on Aug. 30, 1930, stresses to young people today to grasp
    what they have and build on it before giving it away to credit card companies.
    He warns against spending sprees and living outlandishly. His message: Everything
    has a price and what you spend today will affect your savings for tomorrow, not
    only for yourself but for your children and grandchildren.


    “Money doesn’t create man, but it is the man who created money,” Buffett said
    in a recent interview with `CNBC`.


    Money does not define Buffett although he is worth billions. He has maintained
    his humble values from his modest upbringing in Omaha. He continues to live in
    the same home in Omaha that he bought in 1958 for `$31,500`. The 6,000-square
    foot home in the Dundee-Happy Hollow Historic is valued today at `$250,000`, still
    a modest price for the mega-billionaire who is nicknamed the “Oracle of Omaha”.


    It is the only house Buffett owns, which is another rarity for a billionaire who
    has more personal wealth than some third-world countries. He once also owned real
    estate in Laguna Beach, Calif., but sold that property in 2005 for $5.45 million,
    a profit of more than $4 million from when he purchased it in 1993 as a vacation
    spot for him and his wife. Even when he tried to live lavishly, he made a profit
    from it, although this was an isolated case where he strayed from his basic principles.


    Buffett always had a clear vision of his future since his childhood. In his high
    school yearbook, he described himself as a “future stockbroker” although he was
    well on his way.


    “I don’t think standard of living equates with cost of living beyond a certain
    point,” Buffett said about his modest home during a 2014 shareholder meeting for
    `Berkshire Hathaway`, an American multinational conglomerate holding company that
    he owns. “Good housing, good health, good food, good transport. There’s a point
    you start getting inverse correlation between wealth and quality of life. My life
    couldn’t be happier. In fact, it’d be worse if I had six or eight houses. So,
    I have everything I need to have, and I don’t need any more because it doesn’t
    make a difference after a point.”

