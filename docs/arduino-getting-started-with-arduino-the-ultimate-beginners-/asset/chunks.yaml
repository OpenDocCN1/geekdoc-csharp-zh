    ## Glossary


    - **Sketch**: A term used to mean an Arduino program. A chunk of code written
    to command an Arduino is called a ‘sketch’, rather than just a ‘program’, because
    the Arduino platform was designed to appeal to artists and creative individuals
    in addition to engineers. According to the founders, using the term ‘sketch’ would
    imply a rough idea that can be explored, refined and developed – much like an
    art or design sketch. As such, it will make using Arduino feel more encouraging
    and less daunting to those who are not from a tech background.

    - **Shield**: This is a circuit board that can be attached on top of an Arduino
    to accomplish a variety of purposes. They are called this because they fit over
    the top of an Arduino board like a protective shield.

    - **IDE (Integrated Development Environment)**: The software application that
    is run to provide you with the tools to program Arduino boards. It includes a
    source code editor, build automation and debugger. It is an open-source software
    available for download at the official Arduino website ([www.arduino.cc](http://www.arduino.cc)).

    - **Pulse-Width Modulation (PWM)**: A term describing a type of digital signal
    that is used in a variety of applications. It is mainly used to control the amount
    of power supplied to electrical devices.

    - **Voltage**: The amount of energy between two points of a circuit, measured
    with the standard unit, Volt (V).


    ## Chapter 5


    ### Essential Resources & Further Reading


    You have learnt the basics of Arduino and – if you have actually been following
    along with the instructions – got a feel for what the platform can do firsthand.
    That was just the tip of the iceberg, though; Arduino mastery takes time and dedication
    to keep building upon what you have learnt. Furthermore, the open-source platform
    keeps on expanding as more people take to using it. Whatever brought you to Arduino,
    your journey with this exciting platform has just begun. Here is a list of useful
    materials, written by some of the most respected authorities on Arduino, to help
    you move ahead.


    ### For Absolute Beginners


    #### Getting Started with Arduino: The Open Source Electronics Prototyping Platform

    by Massimo Banzi and Michael Shiloh

    ISBN-10: 1449363334 / ISBN-13: 978-1449363338


    What better way to get more acquainted with Arduino than from one of the creators
    himself? Massimo Banzi is the platform’s co-founder. This beginner-friendly book
    is written based on his extensive experience in teaching, using, and building
    Arduino.


    #### Beginning C for Arduino, Second Edition: Learn C Programming for the Arduino
    Kindle Edition

    by Jack Purdum Ph.D.

    ISBN-10: 1484209419 / ISBN-13: 978-1484209417


    Written for those who have no prior experience with micro-controllers or programming,
    this guide is ideal for those who are starting their journey into programming.
    You will get an introduction into C programming language, with a simple demonstration
    of how it can be used on the Arduino family of micro-controllers. Drawn from the
    author’s 20-plus years of university teaching, this book is perfect for the complete
    programming beginner. It is engaging to read and assumes no prior programming
    or hardware design experience of its readers, making learning enjoyable.


    ### Take Your Skills to the Next Level


    #### Programming Arduino Next Steps: Going Further with Sketches

    by Simon Monk

    ISBN-10: 0071830251 / ISBN-13: 978-0071830256


    Electronics guru, Simon Monk reveals professional programming secrets for Arduino
    in this practical guide for those who already have a firm grasp of programming
    micro-controllers. This book covers the Arduino Uno, Leonardo, and Due boards.
    Learn advanced ‘sketching’ techniques to take your Arduino to the next level,
    including programming for the internet, maximizing serial communications, managing
    memory, performing digital signal processing, and so much more. The book features
    over 75 example sketches, all available for download.


    #### Electronics from the Ground Up: Learn by Hacking, Designing, and Inventing

    by Ronald Quan

    ISBN-10: 0071837280 / ISBN-13: 978-0071837286


    Are you fascinated by the complex circuits behind common electronic devices? This
    book guides you through step-by-step experiments that reveal how electronic circuits
    function. It also explains components, construction techniques, basic test equipment,
    circuit analysis, and troubleshooting. By the end of the book, you will not only
    be armed with the know-how to design customs circuits, but also the ability to
    hack and modify existing circuits to suit your needs.


    #### 30 Arduino Projects for the Evil Genius

    by Simon Monk

    ISBN-10: 0071817727 / ISBN-13: 978-0071817721


    Ever want to build a Morse code translator? Pulse rate monitor? A Hypnotizer?
    How about a keyboard prank? You can unleash your evil genius with this do-it-yourself
    guide that shows you how to program and build fascinating projects with the Arduino
    Uno and Leonardo boards. You will learn from through guides with checklists of
    required parts for each project, step-by-step instructions with illustrations,
    and clear explanation of scientific principles behind the projects.


    ### Fun Project Ideas


    #### Arduino Workshop: A Hands-On Introduction with 65 Projects

    by John Boxall

    ISBN-10: 1593274483 / ISBN-13: 860-1200651553


    Think you’ve already got the hang of Arduino and are ready to try some fun projects?
    This book will get you started. You will learn the extensive range of Arduino’s
    input/output, sensors, displays, motors. Each project is designed to reinforce
    what you have learnt, and they increase in complexity. So, what can you learn
    to build? A digital thermometer, battery checker, and a GPS logger, to name a
    few.


    #### Sew Electric Perfect

    by Leah Buechley, Kanjun Qiu and Sonja de Boer

    ISBN-10: 098979508 / ISBN-13: 978-098979509


    Co-written by the creator of the LilyPad board, Leah Buechley, this book is a
    hands-on guide that combines crafting, electronics and programming to create fun
    projects. Learn to make interactive toys, light-up fashion accessories and many
    other cool things using the LilyPad board that can be shared with friends and
    family. This is also a great material for teachers to introduce practical electronics
    to young students.


    #### Textile Messages: Dispatches From the World of E-Textiles and Education

    by Leah Buechley, Kylie Peppler, Michael Eisenberg and Yasmin Kafai

    ISBN-10: 143311920X / ISBN-13: 978-1433119200


    This book is a handy introduction to e-textiles – soft circuit boards that can
    be used to incorporate electronic elements into clothing and furniture. In the
    Arduino family, the LilyPad board is an e-textile, and this is a beginner to intermediate
    guide that can show you how to make the most of your LilyPad. You will be introduced
    to a collection of tools that enable anyone to learn and create with e-textiles,
    whether you are an educator, hobbyist or designer.


    #### Make: Wearable Electronics: Design, prototype, and wear your own interactive
    garments optby Kate Hartman

    ISBN-10: 1449336515 / ISBN-13: 978-1449336516


    For those with interest in computing, and fashion designers who want to build
    creative projects that fuse both disciplines, this book is a must read. You will
    be introduced to tools, materials and techniques for making interactive electronic
    circuits and embedding them in articles of clothing with step-by-step instructions.
    Although the book does not specifically feature Arduino projects, it will equip
    you with knowledge that can be adapted to suit the Arduino platform. So, if you
    ever wanted to build clothing that changes color to complement your skin tone,
    a jacket that shows when the next bus is arriving, shoes that dynamically shift
    your height, and many other cool wearable items, now you can!


    #### Adventures in Arduino

    by Becky Stewart

    ISBN-10: 1118948475 / ISBN-13: 978-1118948477

