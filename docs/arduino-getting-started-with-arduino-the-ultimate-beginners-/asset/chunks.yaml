- fmt: "\n- Backed by a supportive community – If you are absolutely new to the platform\
    \ and don’t know where to begin, there is a wealth of information to be found\
    \ online due to the popularity of Arduino. You will never run out of resources\
    \ to learn from, and you can even find pre-coded projects to work on right away\
    \ (See Chapter 5 for Arduino resources).\n\n## What can Arduino do for You?\n\n\
    Arduino was designed with the creative and innovative in mind, regardless of experience\
    \ level. Artists, designers, electricians, engineers, programmers and science\
    \ enthusiasts can use it to create interactive objects and environments. Among\
    \ the things Arduino can interact with include motors, speakers, LEDs, GPS units,\
    \ cameras, TVs, smart-phones and even the internet.\n\nWith Arduino, one can build\
    \ low cost scientific instruments, do programming for robotics, build interactive\
    \ prototypes of architectural designs and create installations for musical instruments\
    \ to experiment with sound, build new video game hardware – and this is just the\
    \ tip of the iceberg! So, whether your project entails building a robot, a heating\
    \ blanket, a festive lighting display or a fortune-telling machine, Arduino can\
    \ serve as a base for your electronic projects.\n\n## Before You Continue...\n\
    \nAs a token of appreciation, I’ve included a great, surprise for you, completely\
    \ FREE!\n\nSimply click the link below now to find out more.\n\n[==> CLICK HERE<==](#part0001_split_006.html_b3)\n\
    \nI promise, this is not “spam”, and you can be back to this page in just a few\
    \ seconds via a simple link.\n\nTake action now to avoid missing out!\n\n[==>CLICK\
    \ HERE NOW!<==](#part0001_split_006.html_b3)\n\nEnjoy!\n\nSteve Gold\n\n## Chapter\
    \ 2: Getting Started with Arduino\n\nAs the Arduino platform is ever expanding,\
    \ continuous learning is necessary as there is always something new to discover.\
    \ What you will learn in this chapter is the bare minimum you need to know in\
    \ order to get your feet wet. You will be introduced to the basic Arduino components,\
    \ what you will need and how to set them up. Obviously, you are going to need\
    \ the two essentials: an Arduino board and the software installed (available free\
    \ for download on the official Arduino website).\n\n### Anatomy of an Arduino\
    \ Board\n\nBefore you start shopping around for hardware, you need to know some\
    \ basics about Arduino boards and their features. There are several types of Arduino\
    \ boards available for purchase, each with different capabilities. Although they\
    \ may differ in look and capabilities, you will find most boards have the majority\
    \ of these components in common:\n\n1. **USB and Barrel Jack** – Every board will\
    \ have a means for it to be connected to a power source. Almost all Arduino boards\
    \ come with USB connection, since this is how you will be uploading codes onto\
    \ them. You can also connect to a wall power supply via the barrel jack.\n\n2.\
    \ **Pins** – The boards’ pins are where you construct circuits by connecting wires.\
    \ There are several types of pins on Arduino boards, each meant for a specific\
    \ functions. Here is what you will normally find:\n   - `GND`: Short for Ground,\
    \ these pins are used to ground your circuit.\n   - `5V` and `3.3V`: these pins\
    \ supply 5 Volts and 3.3 Volts of power, respectively.\n   - `Analog`: You can\
    \ identify this row of pins under the `Analog In` label. They are used for reading\
    \ signals from analog sensors, and convert those signals into digital values.\n\
    \   - `Digital`: Across from the analog pins, under the `Digital` label, are the\
    \ pins to be used for digital input and output. For example, telling when a button\
    \ is pressed (input), so that an LED lights up (output).\n   - `PWM`: In a lot\
    \ of Arduino boards, there is the label `PWM~` next to `Digital`. It means that\
    \ the pins can be used as normal digital pins, and also for a type of signal called\
    \ Pulse-Width Modulation (see the glossary of terms in Chapter 4 for explanation).\n\
    \   - `AREF`: A short form for Analog Reference, this is the pin which can be\
    \ used to set an external voltage as the upper limit for the analog pins (between\
    \ 0 and 5 Volts), although it is mostly left alone.\n\n3. **Reset button** – this\
    \ button is self-explanatory; pushing it will connect the rest pin to ground,\
    \ and restart any code loaded onto the board. This is useful for testing your\
    \ programmed codes multiple times. It does not, however, functions to reset everything\
    \ to a clean slate and wipe away any problems.\n\n4. **Power LED Indicator** –\
    \ This is a tiny LED that can be identified with the word `ON` next to it. It\
    \ will light up when you plug the board into a power source, and if it doesn’t,\
    \ it means you have to re-check your circuit because something is wrong.\n\n5.\
    \ **Transmit (TX) and Receive (RX) LEDs** – Not to be confused with the `TX` and\
    \ `RX` markings by the 0 and 1 digital pins, the LEDs with these markings will\
    \ give you a visual indication whenever the board is transmitting or receiving\
    \ data, such as when you load a new program onto the board.\n\n6. **Main Integrated\
    \ Circuit (IC)** – This is the black piece with metal legs that is attached to\
    \ every board. It is basically the brains of an Arduino board. The main IC differs\
    \ from board to board, though most are from the `ATmega` line of IC’s by the ATMEL\
    \ company. It is important to know the IC and board type before loading up a new\
    \ program from the Arduino IDE. You can usually find this information written\
    \ on the top side of the `IC`.\n\n7. **Voltage regulator** – As its name implies,\
    \ this component controls the amount of voltage that is allowed into the Arduino\
    \ board. It functions by turning away extra voltage let into the board. But it\
    \ has its limits though; it cannot handle anything over 20 Volts. So, a word of\
    \ caution: DO NOT use a power supply greater than 20 Volts! It will overpower\
    \ and destroy your Arduino. The recommended voltage for most models is 6-12 Volts.\n\
    \n### All in the Family\n\nThe Arduino board has gone through considerable changes\
    \ since it was first introduced, in order to meet the various demands and challenges\
    \ of its users. More than just the 8-bit boards, Arduino have boards built for\
    \ various applications, from Internet of Things (IoT) to wearable items. All of\
    \ them are, of course, open-source, which further empowers users to build derivatives\
    \ and customize them to fit specific needs. The following are a few options that\
    \ are considered most suitable for the Arduino novice:\n\n- **Arduino UNO (R3)**:\
    \ The UNO is often considered to be the definitive Arduino board. It is well-equipped\
    \ with everything you need to get started, with 14 digital input/output pins –\
    \ six of which can be used as Pulse Width Modulation (PWM) outputs – six analog\
    \ inputs, a USB connection, a power jack and many more. Simply connect it to any\
    \ power source, whether it is a computer with a USB cable, an AC-to-DC adapter\
    \ or battery, and you are good to get started. Regardless of your Arduino expertise,\
    \ you can never go wrong with the UNO.\n- **Arduino Mega (2560)**: The Mega board\
    \ is a few notches above the UNO; kind of like its big brother. It has an impressive\
    \ 54 digital input/output pins, of which 14 can be used as PWM outputs, 16 analog\
    \ inputs, plus everything you can find on the UNO and also functions the same\
    \ way. If you have a project that requires a lot of digital input/outputs, such\
    \ as for a lot of LED lights or buttons, the Mega may be the board for the job.\n\
    - **Arduino Leonardo**: The Leonardo board offers a cheaper and simpler alternative,\
    \ as it is the first Arduino development board to use one micro-controller with\
    \ built-in USB. Because of its direct USB handling, code libraries are available\
    \ that allows the board to emulate a computer keyboard, mouse and much more.\n\
    - **Arduino Mega ADK**: This board is basically a specialized version of the Arduino\
    \ Mega board. It is specifically designed for interfacing with Android smartphones.\n"
  raw: '•Backed by a supportive community – If you are absolutely new to the platform
    and don’t know where to begin, there is a wealth of information to be found online
    due to the popularity of Arduino. You will never run out of resources to learn
    from, and you can even find pre-coded projects to work on right away (See Chapter
    5 for Arduino resources).


    What can Arduino do for You?


    Arduino was designed with the creative and innovative in mind, regardless of experience
    level. Artists, designers, electricians, engineers, programmers and science enthusiasts
    can use it to create interactive objects and environments. Among the things Arduino
    can interact with include motors, speakers, LEDs, GPS units, cameras, TVs, smart-phones
    and even the internet.


    With Arduino, one can build low cost scientific instruments, do programming for
    robotics, build interactive prototypes of architectural designs and create installations
    for musical instruments to experiment with sound, build new video game hardware
    – and this is just the tip of the iceberg! So, whether your project entails building
    a robot, a heating blanket, a festive lighting display or a fortune-telling machine,
    Arduino can serve as a base for your electronic projects.


    Before You Continue...


