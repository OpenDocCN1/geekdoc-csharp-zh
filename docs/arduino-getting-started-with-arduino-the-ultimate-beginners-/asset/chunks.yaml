    He warns against spending sprees and living outlandishly. His message: Everything
    has a price and what you spend today will affect your savings for tomorrow, not
    only for yourself but for your children and grandchildren.


    “Money doesn’t create man, but it is the man who created money,” Buffett said
    in a recent interview with CNBC.


    Money does not define Buffett although he is worth billions. He has maintained
    his humble values from his modest upbringing in Omaha. He continues to live in
    the same home in Omaha that he bought in 1958 for $31,500\. The 6,000-square foot
    home in the Dundee-Happy Hollow Historic is valued today at $250,000, still a
    modest price for the mega-billionaire who is nicknamed the “Oracle of Omaha”.


    It is the only house Buffett owns, which is another rarity for a billionaire who
    has more personal wealth than some third-world countries. He once also owned real
    estate in Laguna Beach, Calif., but sold that property in 2005 for $5.45 million,
    a profit of more than $4 million from when he purchased it in 1993 as a vacation
    spot for him and his wife. Even when he tried to live lavishly, he made a profit
    from it, although this was an isolated case where he strayed from his basic principles.


    Buffett always had a clear vision of his future since his childhood. He became
    an investor when he was 11\. In his high school yearbook, he described himself
    as a “future stockbroker” although he was well on his way. From the start, he
    had the confidence to achieve his goals because he knew his path would be free
    of distractions or temptations. He was never consumed by excess to a fault.


     “I don’t think standard of living equates with cost of living beyond a certain
    point,” Buffett said about his modest home during a 2014 shareholder meeting for
    Berkshire Hathaway, an American multinational conglomerate holding company that
    he owns. “Good housing, good health, good food, good transport. There’s a point
    you start getting inverse correlation between wealth and quality of life. My life
    couldn’t be happier. In fact, it’d be worse if I had six or eight houses. So,
    I have everything I need to have, and I don’t need any more because it doesn’t
    make a difference after a point.”


    Buffett is on record saying that having more wealth actually reduces the quality
    of life. In his opinion, the quality of life is based on basic needs. That includes
    having good health, adequate housing, nourishment and transportation. Not all
    who are afforded these needs are content or satisfied. People crave bigger homes,
    souped-up cars and meals at expensive restaurants. Many of us believe happiness
    comes from having an extravagant lifestyle.'
