    ## Chapter 1

    ### Understanding Arduino


    In 2005, the Ivrea Interaction Design Institute in Italy started a project of
    creating an open-source platform to be used for building various electronic projects,
    known as `Arduino`. Originally geared towards students with little to no background
    in electronics or computer programming, the platform eventually gained worldwide
    popularity due to its accessibility and beginner-friendly features.


    Over the years since its inception, `Arduino` has garnered the attention and enthusiasm
    of hobbyists, artists, programmers, students and even hackers from all levels
    of experience. Being an open-source platform, it continues to grow with contributions
    from a diverse community of users that keep pushing the limits of its capabilities.
    In fact, `Arduino` has been the backbone behind thousands of projects and applications,
    from everyday objects to complex scientific equipment.


    The `Arduino` platform consists of two components:


    1. The hardware – A physical programmable circuit board, also known as the microcontroller.
    There are different types of `Arduino` boards (more on this in Chapter 2).

    2. The Software – The Integrated Development Environment (`IDE`) that runs on
    the computer, used for writing and uploading programming codes to the physical
    board.


    #### Why Go Arduino?


    Practically anyone can use `Arduino`. Experts are sure to have fun with building
    projects and sharing ideas with other users at online communities. For those with
    no experience with circuits and micro-controller programming, the platform is
    excellent for learning and experimenting. However, it is recommended that before
    exploring the wonders of `Arduino`, you should at least have a firm understanding
    of these fundamental concepts:


    - The basics of electricity and circuitry

    - Voltage, current, resistance and Ohm’s law

    - Polarity

    - Integrated circuits (`ICs`)

    - Digital logic

    - Analog versus Digital

    - Basic computer programming


    What makes `Arduino` a favorite among amateurs and experts alike is that, compared
    to other platforms and systems, it simplifies the process of working with micro-controllers.
    For a start, loading new codes to the board can simply be done with a USB cable,
    unlike previous programmable circuit boards where a separate piece of hardware
    has to be used. It is also a plus point that `Arduino` boards are relatively inexpensive
    compared to other micro-controller platforms, with some pre-assembled modules
    costing less than $50\. If those perks are not enough, here are some more reasons
    why `Arduino` is the platform to go for:


    - Cross-platform – `Arduino`’s `IDE` runs on Windows, Macintosh OSX, and Linux
    operating systems, whereas most micro-controller systems are only compatible with
    Windows.

    - Simple programming environment – The `Arduino` `IDE` uses a simplified version
    of `C++`, making it easier for beginner to learn how to program, yet flexible
    enough for advance users to get creative and ambitious with.

    - Open source and extensible hardware – `Arduino` board plans are published under
    a Creative Common license, allowing circuit designers to create their own version
    of the module, extending it and improving upon it.

    - Open source and extensible software – The `Arduino` `IDE` is published as open
    source tools that experienced programmers can expand on, through `C++` libraries.
    You can also learn the `AVR-C` programming language from `Arduino`, just as you
    can also add `AVR-C` code directly into `Arduino` programs.

